diagnosis:
- name: Metagenomic Next-Generation Sequencing (mNGS) of Respiratory Specimens
  description: >-
    Unbiased metagenomic next-generation sequencing of bronchoalveolar lavage fluid,
    sputum, or airway secretions rapidly identifies Chlamydia psittaci reads
    (often within 24 to 48 hours) and is the leading confirmatory method for severe
    or culture-negative psittacosis pneumonia.
  diagnosis_term:
    preferred_term: metagenomic next-generation sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  evidence:
  - reference: PMID:42255501
    reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Among sequencing-based approaches, metagenomic next-generation sequencing (mNGS) is the most frequently used diagnostic modality, particularly for respiratory specimens such as sputum, airway secretions, and bronchoalveolar lavage fluid, and has served as the principal confirmatory tool in hospital-based case reports and case series."
    explanation: >-
      Establishes respiratory-specimen mNGS as the principal hospital confirmatory
      tool for C. psittaci pneumonia.
  - reference: PMID:34817316
    reference_title: "Sixteen cases of severe pneumonia caused by Chlamydia psittaci in South China investigated via metagenomic next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixteen cases of severe psittacosis pneumonia were diagnosed through mNGS."
    explanation: >-
      Clinical series confirming diagnosis of 16 severe psittacosis pneumonia cases
      by bronchoalveolar lavage fluid mNGS.
- name: Chlamydia psittaci Nucleic Acid Amplification Testing (PCR)
  description: >-
    Targeted PCR, nested PCR, or real-time qPCR of respiratory specimens provides
    sensitive and species-specific detection of C. psittaci nucleic acids for case
    confirmation and outbreak source tracing.
  diagnosis_term:
    preferred_term: Chlamydia psittaci nucleic acid amplification test
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:42255501
    reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "NAATs, including PCR, nested PCR, qPCR, and reverse transcription quantitative PCR (RT-qPCR), provide more sensitive and specific detection of C. psittaci nucleic acids and are preferred for case confirmation and epidemiological investigation, but cannot distinguish viable from non-viable organisms"
    explanation: >-
      Documents targeted NAAT/PCR sensitivity and specificity for C. psittaci case
      confirmation and epidemiological investigation.
- name: Chlamydial Serology
  description: >-
    Paired acute- and convalescent-phase serological testing (microimmunofluorescence,
    complement fixation, or ELISA) provides retrospective confirmation and
    seroepidemiological assessment, though cross-reactivity with other Chlamydia
    species limits acute single-titer specificity.
  diagnosis_term:
    preferred_term: Chlamydia psittaci serology
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:42255501
    reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Serological assays, including ELISA, complement fixation, immunofluorescence, and immunoperoxidase tests, are relatively simple and useful for retrospective confirmation and seroepidemiological surveys. However, cross-reactivity with other Chlamydia species limits their specificity, and interpretation generally requires paired acute- and convalescent-phase sera in conjunction with clinical findings"
    explanation: >-
      Summarizes serological assay modalities, paired-sera interpretation, and
      genus-level cross-reactivity limitations.
treatments:
- name: Doxycycline
  description: >
    Tetracycline antibiotic with good intracellular bioavailability that inhibits
    bacterial protein synthesis at the 30S ribosome; first-line treatment for
    adults with psittacosis (typically for 10 to 14 days) because it reaches the
    intracellular organism, whereas beta-lactams are ineffective.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: tetracycline pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Chlamydial Ribosomal Translation (Tetracycline Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline binds the 30S ribosomal decoding center to prevent aminoacyl-tRNA
      accommodation at the A site and arrest C. psittaci protein synthesis.
    evidence:
    - reference: PMID:29570352
      reference_title: "Ribosome-Targeting Antibiotics: Modes of Action, Mechanisms of Resistance, and Implications for Drug Design."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Tetracyclines inhibit translation by preventing binding of aa-tRNA to the A site (35), while the smaller molecule negamycin stabilizes tRNA binding in the A site, inhibiting translocation and stimulating miscoding (36)."
      explanation: >-
        Establishes that tetracyclines (such as doxycycline) inhibit bacterial
        translation by blocking aminoacyl-tRNA binding to the ribosomal A site.
  - target: Inhalation and Obligate Intracellular Chlamydial Infection
    treatment_effect: INHIBITS
    description: >-
      Doxycycline's intracellular bioavailability lets it reach the intracellular
      organism that beta-lactams cannot.
    evidence:
    - reference: PMID:15895932
      reference_title: "[Chlamydia: diagnostic and treatment]."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Treatment should use an antibiotic with good intracellular bioavailability
        such as tetracycline, macrolides and new generation fluoroquinolones.
      explanation: >-
        Links effective chlamydial treatment to antibiotics with intracellular
        bioavailability.
  evidence:
  - reference: PMID:42255501
    reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tetracyclines were the first-line agents for adults, with treatment courses generally lasting 10–14 days and extended when clinically indicated in severe, prolonged, or immunocompromised cases."
    explanation: >-
      Establishes tetracyclines (doxycycline) for 10 to 14 days as first-line
      therapy in adults with psittacosis.
  - reference: PMID:15895932
    reference_title: "[Chlamydia: diagnostic and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment should use an antibiotic with good intracellular bioavailability
      such as tetracycline, macrolides and new generation fluoroquinolones.
    explanation: >-
      Supports use of cell-penetrant antibiotics (tetracycline first-line) for
      intracellular chlamydial infection.
- name: Macrolide Antibiotic Therapy (Azithromycin / Erythromycin)
  description: >-
    Intracellularly active macrolide antibiotics (azithromycin, erythromycin) serve
    as alternative therapy when tetracyclines are contraindicated, such as in
    pregnant women or children under eight years of age.
  context: Alternative therapy when tetracyclines are contraindicated (pregnancy, children under 8 years)
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: macrolide pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
    - preferred_term: erythromycin
      term:
        id: CHEBI:48923
        label: erythromycin
  target_mechanisms:
  - target: Chlamydial Ribosomal Translation (Tetracycline Target)
    treatment_effect: INHIBITS
    description: >-
      Macrolides penetrate host cells and bind near the nascent peptide exit tunnel
      of the 50S ribosomal subunit to inhibit chlamydial protein synthesis.
    evidence:
    - reference: PMID:29570352
      reference_title: "Ribosome-Targeting Antibiotics: Modes of Action, Mechanisms of Resistance, and Implications for Drug Design."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The natural macrolide erythromycin and its semi-synthetic derivatives, the ketolides, bind near the entrance of the NPET (Figure 5a)."
      explanation: >-
        Establishes binding of macrolides near the entrance of the 50S nascent
        peptide exit tunnel (NPET) to inhibit bacterial translation.
    - reference: PMID:15895932
      reference_title: "[Chlamydia: diagnostic and treatment]."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Treatment should use an antibiotic with good intracellular bioavailability
        such as tetracycline, macrolides and new generation fluoroquinolones.
      explanation: >-
        Documents intracellularly bioavailable macrolides as anti-chlamydial
        therapy.
  evidence:
  - reference: PMID:42255501
    reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Macrolides, including azithromycin and erythromycin, were used as alternatives for patients with contraindications to tetracyclines, such as pregnant women or children under eight years of age"
    explanation: >-
      Establishes azithromycin and erythromycin as recommended alternatives for
      pregnant patients and young children.
- name: Supportive Respiratory and Critical Care
  description: >-
    Escalating respiratory and organ support — including supplemental or high-flow
    humidified oxygen, non-invasive or invasive mechanical ventilation for acute
    respiratory distress syndrome, rescue extracorporeal membrane oxygenation (ECMO)
    for refractory hypoxemia, and vasoactive support for septic shock — is essential
    alongside targeted antimicrobial therapy in critically ill psittacosis patients.
  context: Severe psittacosis pneumonia, acute hypoxic respiratory failure, ARDS, or septic shock
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Atypical Pneumonia and Systemic Illness
    treatment_effect: MODULATES
    description: >-
      Oxygenation, mechanical ventilation, rescue ECMO, and hemodynamic support
      stabilize hypoxic respiratory failure and organ perfusion while anti-chlamydial
      therapy clears intracellular infection.
    evidence:
    - reference: PMID:42255501
      reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Critically ill patients also required oxygen therapy and escalating respiratory support, including non-invasive or invasive mechanical ventilation for ARDS and extracorporeal membrane oxygenation (ECMO) as rescue therapy for refractory hypoxemia"
      explanation: >-
        Documents oxygen therapy, mechanical ventilation, and rescue ECMO for severe
        psittacosis respiratory failure and ARDS.
  evidence:
  - reference: PMID:42255501
    reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Critically ill patients also required oxygen therapy and escalating respiratory support, including non-invasive or invasive mechanical ventilation for ARDS and extracorporeal membrane oxygenation (ECMO) as rescue therapy for refractory hypoxemia"
    explanation: >-
      Establishes escalating respiratory support and rescue ECMO in critically ill
      psittacosis pneumonia.
  - reference: PMID:34817316
    reference_title: "Sixteen cases of severe pneumonia caused by Chlamydia psittaci in South China investigated via metagenomic next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients underwent noninvasive mechanical ventilation, four patients underwent high flow humidified oxygen therapy and one patient underwent invasive mechanical ventilation."
    explanation: >-
      Documents high-flow oxygen, non-invasive mechanical ventilation, and invasive
      mechanical ventilation in 10/16 severe psittacosis pneumonia cases.
notes: >
  Intracellular zoonotic atypical pneumonia with a broad avian reservoir; conforms
  to the intracellular_pathogen_persistence module (intracellular niche and
  intrinsic beta-lactam resistance) and the bacterial_protein_synthesis_inhibition
  module (ribosomal translation target), mirroring the Q_Fever and Murine_Typhus
  doxycycline pattern. disease_term binds MONDO:0005888 (ornithosis, the canonical
  MONDO label for psittacosis), while infectious_agent binds NCBITaxon:83554
  (Chlamydia psittaci, formerly Chlamydophila psittaci).

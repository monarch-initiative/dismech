    quote_role: REVIEW_SYNTHESIS
    snippet: "C. psittaci infection in China primarily stems from avian species, with parrots and other pet or ornamental birds recurrently implicated as important reservoirs or exposure sources"
    explanation: Identifies parrots and other ornamental birds alongside pigeons and poultry as recurrent avian reservoir sources.
progression:
- phase: Incubation Period
  duration: 5 to 14 days
  notes: >-
    Typical asymptomatic incubation period in humans following inhalation of
    contaminated avian aerosols before acute symptom onset.
  evidence:
  - reference: PMID:42255501
    reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "C. psittaci infection has a typical 5–14 day incubation period in humans"
    explanation: Documents the typical 5- to 14-day human incubation period.
- phase: Acute Febrile Influenza-Like Phase
  notes: >-
    Abrupt onset of high fever, chills, fatigue, myalgia, and headache, often
    accompanied by dry cough and dyspnea.
  evidence:
  - reference: PMID:42255501
    reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "C. psittaci pneumonia usually presents with acute onset and non-specific manifestations, ranging from mild influenza-like illness to rapidly progressive severe pneumonia with multi-organ involvement. Fever is the most common symptom, often accompanied by chills, fatigue, myalgia, and headache."
    explanation: Describes the acute-onset febrile influenza-like presentation of psittacosis.
- phase: Atypical Pneumonia and Severe Multisystem Phase
  notes: >-
    Consolidative atypical pneumonia that in severe or delayed-treatment cases
    progresses to acute hypoxic respiratory failure, acute respiratory distress
    syndrome (ARDS), sepsis, and multi-organ dysfunction (hepatic, renal,
    myocardial, and neurocognitive involvement).
  evidence:
  - reference: PMID:42255501
    reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Severe disease may progress to respiratory failure, acute respiratory distress syndrome (ARDS), and sepsis or septic shock"
    explanation: Documents progression of severe psittacosis pneumonia to respiratory failure, ARDS, and septic shock.
transmission:
- name: Inhalation of aerosols from infected birds
  description: >-
    Humans are infected by inhaling aerosols raised from the dried droppings,
    feather dust, and respiratory secretions of infected birds. The birds are
    often asymptomatic shedders, so exposure can go unrecognized.
  evidence:
  - reference: PMID:29936804
    reference_title: Chlamydiosis in farmed chickens in Slovakia and zoonotic risk for humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Zoonotic transfer occurs through inhalation of contaminated aerosols, and originates from feathers, faecal material and respiratory tract exudates."
    explanation: >-
      Names the inhalational route and the avian materials it originates from. The
      sentence states established human epidemiology in the introduction of a poultry
      survey, not that survey's own finding.
  - reference: PMID:40256594
    reference_title: The Emergence Potential of Chlamydia psittaci and Chlamydia felis as Zoonotic Agents Causing Ocular and Respiratory Infections in Humans and Animals.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Direct contact and inhalation of contaminated air droplets from birds is a risk factor for transmission of infection."
    explanation: A review's synthesis identifying both direct bird contact and inhalation as transmission risks.
- name: Pet bird and poultry exposure
  description: >-
    The exposures that put people in contact with that aerosol are keeping pet
    birds and handling poultry, whether occupationally or domestically.
  evidence:
  - reference: PMID:42255501
    reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Reported cases were most often documented in middle-aged and older adults with avian exposure, including pet birds and poultry"
    explanation: A scoping review of reported cases identifies pet birds and poultry as the usual exposure.
pathophysiology:
- name: Inhalation and Obligate Intracellular Chlamydial Infection
  biological_scale: CELLULAR
  role: trigger
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  description: >
    Psittacosis follows inhalation of aerosols from infected birds. Chlamydia
    psittaci is an obligate intracellular bacterium that replicates within host
    cells via a biphasic elementary-body to reticulate-body cycle, an
    intracellular lifestyle that underlies intrinsic beta-lactam resistance and
    the requirement for cell-penetrant antibiotics.
  cell_types:
  - preferred_term: respiratory epithelial cell
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
    modifier: INCREASED
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
    modifier: ABNORMAL
  evidence:
  - reference: PMID:15895932
    reference_title: "[Chlamydia: diagnostic and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Chlamydia are obligate intracellular bacteria.
    explanation: >-
      Establishes Chlamydia (including C. psittaci) as obligate intracellular
      bacteria, the basis for the intracellular-niche conformance.
  - reference: PMID:42255501
    reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "C. psittaci is an obligate intracellular bacterium intrinsically resistant to β-lactams."
    explanation: >-
      Directly confirms intrinsic beta-lactam resistance resulting from the
      obligate intracellular lifestyle of C. psittaci.
  downstream:
  - target: Atypical Pneumonia and Systemic Illness
    causal_link_type: DIRECT
    description: >-
      Intracellular replication in the lower respiratory tract triggers a brisk
      pulmonary and systemic inflammatory response producing atypical pneumonia
      and multisystem illness.
    evidence:
    - reference: PMID:15895932
      reference_title: "[Chlamydia: diagnostic and treatment]."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Chlamydophila psittaci causes psittacosis, a severe zoonotic pneumonia
        transmitted by birds.
      explanation: >-
        C. psittaci infection produces psittacosis as a severe zoonotic
        pneumonia downstream of inhalational infection.
  - target: Chlamydial Ribosomal Translation (Tetracycline Target)
    causal_link_type: DIRECT
    description: >-
      Intracellular reticulate-body replication depends on bacterial ribosomal
      translation, the molecular target of cell-penetrant tetracycline and
      macrolide therapy.
    evidence:
    - reference: PMID:24336183
      reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The ribosome is one of the main antibiotic targets in the bacterial cell.
      explanation: >-
        Identifies the bacterial ribosome as the molecular target of
        protein-synthesis-inhibiting antibiotics.


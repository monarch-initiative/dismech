    by prominent systemic inflammatory symptoms (high fever, chills, fatigue,
    headache, myalgia), productive cough, and characteristic inflammatory and
    organ-injury biomarker elevations; severe cases can progress to acute
    respiratory distress syndrome, sepsis or septic shock, and multi-organ
    dysfunction (hepatic, renal, myocardial, and neurocognitive involvement).

- name: Chlamydial Ribosomal Translation (Tetracycline Target)
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >
    C. psittaci depends on its bacterial 70S ribosome for protein synthesis.
    Doxycycline, a tetracycline with good intracellular bioavailability, binds the
    decoding center on the 30S ribosomal subunit to prevent aminoacyl-tRNA binding at
    the A site and arrest bacterial translation (while macrolides bind near the
    nascent peptide exit tunnel on the 50S subunit) — combining the ribosomal target
    with the intracellular penetration needed to reach the organism, which is why a
    tetracycline rather than a beta-lactam is first-line.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:29570352
    reference_title: "Ribosome-Targeting Antibiotics: Modes of Action, Mechanisms of Resistance, and Implications for Drug Design."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The decoding center (DC) is the region comprising the A site on the 30S subunit that monitors the correct base pairing between the mRNA codon and the anticodon of the aa-tRNA."
    explanation: >-
      Locates the ribosomal A-site decoding center on the bacterial 30S subunit.
  - reference: PMID:29570352
    reference_title: "Ribosome-Targeting Antibiotics: Modes of Action, Mechanisms of Resistance, and Implications for Drug Design."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tetracyclines inhibit translation by preventing binding of aa-tRNA to the A site (35), while the smaller molecule negamycin stabilizes tRNA binding in the A site, inhibiting translocation and stimulating miscoding (36)."
    explanation: >-
      Establishes that tetracyclines inhibit bacterial translation by blocking
      aminoacyl-tRNA binding at the 30S A-site decoding center.
  - reference: PMID:29570352
    reference_title: "Ribosome-Targeting Antibiotics: Modes of Action, Mechanisms of Resistance, and Implications for Drug Design."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The majority of antibiotics that bind to the 50S subunit cluster at the PTC, where the peptide bond formation occurs, and within the nascent peptide exit tunnel (NPET) (Figure 1d)."
    explanation: >-
      Identifies the 50S subunit nascent peptide exit tunnel and peptidyl transferase
      center targeted by macrolide and related 50S ribosome inhibitors.
  downstream: []

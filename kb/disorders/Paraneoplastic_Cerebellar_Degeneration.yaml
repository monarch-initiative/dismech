- name: Search for an occult malignancy
  description: Investigation for a gynaecological or breast primary in the typical anti-Yo presentation.
    The neurological syndrome usually precedes the cancer diagnosis, so a negative initial search does
    not end the question.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The vast majority of cases have been reported in women with pelvic or breast tumors.
    explanation: States where to look, and the demographic that makes the search targeted.
discussions:
- discussion_id: pcd_antibody_versus_t_cell_effector
  kind: CONTROVERSY
  prompt: In anti-Yo paraneoplastic cerebellar degeneration, is the autoantibody an effector of Purkinje
    cell death or a marker of a T cell-mediated attack?
  attaches_to:
  - pathophysiology#Antitumour Immune Response Cross-Reactive with Purkinje Cells
  - pathophysiology#Cytotoxic T Cell-Mediated Purkinje Cell Destruction
  - mechanistic_hypotheses#pcd_t_cell_mediated_intracellular
  rationale: 'The review literature states plainly that the relative importance of autoantibodies and
    cytotoxic T lymphocytes in the neuronal loss is debated. This entry curates the T-cell reading as
    canonical, and the reasoning should be visible rather than assumed.

    The argument for it is not primarily empirical, it is mechanical: CDR2 is intracellular, and an
    antibody in the extracellular space cannot bind an intracellular antigen in a living cell. The
    neuropathology then supplies exactly what a cytotoxic attack should look like - MHC class I
    upregulated on neurons, CD8 granzyme-B T cells present, microglial nodules.

    What keeps it a controversy rather than a settled question is that cytoplasmic IgG staining is seen
    in some neurons, and that nobody has shown the T-cell response is sufficient. The practical stake is
    therapeutic: if antibodies are effectors, plasma exchange and B-cell depletion should work, and the
    published experience is that they mostly do not - which is itself weak evidence for the T-cell
    reading.'
  proposed_experiments:
  - experiment_id: pcd_effector_depletion_comparison
    name: Comparative depletion of the antibody and T-cell arms in anti-Yo PCD
    description: Compare outcomes between antibody-directed treatment (plasma exchange, B-cell depletion)
      and T cell-directed treatment in anti-Yo patients treated at a comparable point in the clinical
      course, since the existing experience confounds treatment type with how late it was given.
    readouts:
    - name: Cerebellar function after arm-specific immunotherapy
      target: pathophysiology#Cytotoxic T Cell-Mediated Purkinje Cell Destruction
      direction: UNCHANGED
      interpretation: If antibody removal does not change the course while T cell-directed treatment
        does, the canonical hypothesis is supported over the antibody-effector one.
- discussion_id: pcd_antigen_compartment_determines_window
  kind: INTERPRETATION
  prompt: Should paraneoplastic cerebellar degeneration be treated as one disease, given that the antigen
    compartment appears to determine both the mechanism and whether treatment can work?
  attaches_to:
  - mechanistic_hypotheses#pcd_antibody_mediated_surface
  - pathophysiology#Antibody-Mediated Purkinje Cell Dysfunction
  rationale: 'The neuropathological comparison in this entry finds the intracellular-antigen and
    surface-antigen forms differ in nearly every measured feature: distribution of cell loss, MHC class I
    upregulation, complement deposition, antigen downregulation, and evidence of endoplasmic reticulum
    stress. That is a large difference to hold inside one disease name.

    The reason it is curated as one entry with two hypothesis groups rather than split is that the
    clinical syndrome, the tumour association and the diagnostic pathway are shared, and the antibody is
    often not known when the patient presents. A clinician meets one syndrome and finds out later which
    mechanism it was.

    The consequence worth flagging is prognostic. The uniformly poor outlook attached to this disease
    comes from anti-Yo series. It should not be assumed to apply to the surface-antigen forms, where the
    pathology suggests dysfunction preceding death and therefore a window in which early treatment might
    matter - a point the source paper makes explicitly.

    This is also the boundary question against the existing Paraneoplastic_Neurological_Syndromes entry,
    which splits by antigen compartment rather than by syndrome. The two entries are complementary and
    should stay consistent: that one covers the compartment distinction across syndromes, and this one
    covers what it means within the cerebellar syndrome.'
- discussion_id: pcd_surface_antigen_evidence_thin
  kind: KNOWLEDGE_GAP
  prompt: How much confidence should the antibody-mediated mechanism carry, given that the
    neuropathological comparison rests on a single anti-P/Q-VGCC autopsy case?
  attaches_to:
  - mechanistic_hypotheses#pcd_antibody_mediated_surface
  rationale: 'The paper that establishes the two-mechanism picture is explicit about its own denominator,
    one anti-P/Q-VGCC case against two anti-Yo cases and controls. Its findings are internally consistent
    and mechanistically coherent, and they are one case. Every statement in this entry about the
    surface-antigen arm inherits that limitation, including the prognostic implication drawn from it.

    This is recorded rather than hedged into the node descriptions because it is a property of the
    evidence base, not of the claim: no amount of careful wording in the pathophysiology nodes tells a
    reader that the contrast rests on a single case, and the alternative - omitting the arm - would lose
    a real and well-characterised finding.'
  proposed_experiments:
  - experiment_id: pcd_surface_antigen_autopsy_series
    name: Multi-case neuropathological series of surface-antigen paraneoplastic cerebellar degeneration
    description: Assemble additional anti-P/Q-VGCC and other surface-antigen PCD autopsy cases and repeat
      the MHC class I, complement, CD8 and antigen-downregulation assessments, to establish whether the
      single-case findings generalise.
    readouts:
    - name: MHC class I upregulation in surface-antigen PCD cerebellum
      target: pathophysiology#Antibody-Mediated Purkinje Cell Dysfunction
      direction: UNCHANGED
      interpretation: Consistent absence of MHC class I upregulation across further cases would confirm
        that the surface-antigen arm is not a cytotoxic T-cell mechanism.
notes: 'Boundary with Paraneoplastic_Neurological_Syndromes. That entry (MONDO:0018215) exists and
  subdivides by antigen compartment - Intracellular Antigen PNS and Surface Antigen PNS - across all
  paraneoplastic neurological syndromes. This entry is the cerebellar syndrome, and it adds what the
  compartment-level entry does not carry: the specific onconeural antigen (CDR2), the Purkinje cell as
  the vulnerable population, the topography of cell loss, and the syndrome-specific prognosis. The two
  are complementary rather than redundant, and the compartment distinction is deliberately expressed
  here in the same terms so they stay consistent.

  A curator who disagrees has a reasonable case that this should instead be a has_subtypes entry on
  Paraneoplastic_Neurological_Syndromes. The argument against is that MONDO carries a distinct term, that
  the Purkinje-specific mechanism is not derivable from the compartment classification, and that PCD is
  the best-characterised paraneoplastic syndrome in its own right. This is flagged rather than assumed.

  kb/groupings/Cerebellar_Ataxias.yaml mentions paraneoplastic cerebellar degeneration and may want this
  entry as a member. That is a grouping edit and is deliberately not made here, since it changes a
  different artifact than the one this PR curates.

  On the antigen compartments. The two mechanistic_hypotheses are not rival explanations of one
  mechanism. They describe different antigen classes, and both are probably true of their respective
  patients. They are modelled as hypothesis groups because the causal edges genuinely diverge and each
  edge belongs to one of them, which is what hypothesis_groups is for.

  On ontology bindings. Two phenotype terms are broader than the finding, with the specific concept kept
  in preferred_term: HPO has no term for the CSF triad of raised protein, pleocytosis and oligoclonal
  bands together, and none for a pancerebellar syndrome as distinct from progressive cerebellar ataxia.'

treatments:
- name: Immunotherapy
  therapeutic_modality: OTHER
  description: 'Corticosteroids, intravenous immunoglobulin and plasma exchange, used extensively and
    with limited success. This record is deliberately blunt about that, because the mechanism explains
    it: in the anti-Yo form the cells are already dead by the time the syndrome is recognised, and no
    immunosuppression replaces a Purkinje cell.

    The one context where immunotherapy has a defensible mechanistic rationale is the surface-antigen
    arm, where the pathology is dysfunction rather than destruction and removing the antibody early
    might allow recovery. That is a prediction from the neuropathology rather than a demonstrated
    result.'
  treatment_term:
    preferred_term: Therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Antitumour Immune Response Cross-Reactive with Purkinje Cells
    description: Suppresses or removes the immune response upstream of the cerebellar injury, which is
      the only point at which it can act.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Immunotherapies, such as steroids, intravenous immune globulins, and plasma exchange, have
      been extensively used in managing this condition, with limited success.
    explanation: States both the practice and its poor result, in the source's own words. Curated in
      preference to citing individual positive case reports, which would overstate the position.
  - reference: PMID:32872070
    reference_title: 'Plasma exchange for treating anti-Yo-associated paraneoplastic cerebellar
      degeneration: Case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After four courses of plasma exchange, the patient could walk independently, the Romberg
      test was negative, and anti-Yo antibodies were undetectable.
    explanation: A single case with an unusually good outcome, in an atypical patient - male, and with no
      tumour found. It is curated because it is a genuine counterexample to the uniformly poor prognosis,
      and its atypia is stated so it is not read as representative.
  notes: 'The plasma exchange case above is one patient. The authors themselves conclude that the
    approach needs more study, and the patient differed from the typical anti-Yo population in two ways
    that plausibly matter - male sex and the absence of a detected tumour. It is recorded as a
    counterexample, not as evidence of efficacy.'
- name: Tumour-Directed Therapy
  therapeutic_modality: OTHER
  description: 'Surgery and chemotherapy directed at the underlying malignancy, on the rationale that
    removing the antigen source should shut down the immune response driving the neurological disease.
    The rationale is sound and the results are inconsistent, which is itself informative - it suggests
    the autoimmune response becomes self-sustaining, or that the damage is complete before the tumour is
    found.'
  treatment_term:
    preferred_term: Therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Ectopic Onconeural Antigen Expression by Tumour
    description: Removes the source of the antigen that initiated the cross-reactive response, acting at
      the trigger node.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although some reports indicate benefit from antitumor therapies like surgery and
      chemotherapy, this has not been consistently observed.
    explanation: States the inconsistency directly. The claim this record makes is that benefit is
      reported and unreliable, which is what the source supports.

genetic:
- name: CDR2
  gene_term:
    preferred_term: CDR2
    term:
      id: hgnc:1799
      label: CDR2
  relationship_type: BIOMARKER
  association: The onconeural antigen itself. CDR2 is a cytoplasmic Purkinje cell protein ectopically
    expressed by the tumour and is the target of the anti-Yo response.
  notes: 'This is not a disease gene and is deliberately not typed as one. Nobody inherits paraneoplastic
    cerebellar degeneration, and no germline CDR2 variant causes it. CDR2 is curated here because the
    entry''s central mechanistic claim is about a specific antigen, and an entry that names an antigen in
    prose without giving it an identifier is not queryable by that antigen.

    relationship_type is BIOMARKER rather than CAUSATIVE, RISK_FACTOR or SUSCEPTIBILITY. None of those
    fits: the gene is not mutated, not a risk allele, and not a susceptibility locus. What CDR2 is, is
    the molecular identity of the thing the immune system attacks. BIOMARKER is the closest available
    value and it is still an imperfect fit - see the entry-level notes.

    The antigen''s intracellular location is the mechanical argument behind the CANONICAL hypothesis, so
    getting the identifier right matters. Note that the deep-research report and the round-1 review both
    proposed hgnc:1802 for CDR2; hgnc:1802 is CDSN (corneodesmosin), an unrelated skin gene. The correct
    identifier is hgnc:1799, confirmed against the ontology.'
  evidence:
  - reference: PMID:11771954
    reference_title: Induction of cytotoxic T lymphocytes specific for paraneoplastic cerebellar
      degeneration-associated antigen in vivo by DNA immunization.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: Paraneoplastic cerebellar degeneration associated with gynecological and breast
      malignancies (PCD) is known to develop autoantibodies and autoreactive cytotoxic T lymphocytes
      (CTLs) specific for a cytoplasmic protein of Purkinje cells PCD17/cdr2, in the blood of patients.
    explanation: 'Names the antigen and states its cytoplasmic location, the fact the canonical
      hypothesis rests on, and states that both antibodies and cytotoxic T cells against it are present
      in patients - which is why the effector question is a controversy here rather than a settled
      point.

      Regraded MODEL_ORGANISM in review. The cited paper is a BALB/c mouse DNA-immunisation study, and
      evidence_source classifies the publication rather than the quoted sentence, even where that
      sentence is itself reporting a human observation. Graded INDIRECT for the same reason. The claim
      it supports is not species-contingent and is independently supported by PMID:27606347 elsewhere
      in this entry.'
- name: CDR2L
  gene_term:
    preferred_term: CDR2L
    term:
      id: hgnc:29999
      label: CDR2L
  relationship_type: BIOMARKER
  association: A CDR2 paralogue proposed as the major anti-Yo antigen in place of, or alongside, CDR2.
  notes: 'Recorded with its identifier and deliberately without a supporting evidence item, because none
    of the references cached for this entry states the CDR2L claim in quotable form. The identifier is
    here so that a curator who later finds that literature has the anchor to attach it to, and so that
    the entry does not silently imply CDR2 is the only candidate antigen. This is an incomplete record
    rather than an unsupported claim - the distinction is that it asserts nothing beyond the gene''s
    existence and its relationship to CDR2.'
- name: HLA-DRB1
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  relationship_type: SUSCEPTIBILITY
  association: The DRB1*13:01~DQA1*01:03~DQB1*06:03 class II haplotype is increased in anti-Yo disease
    arising from ovarian cancer.
  notes: 'The association is tumour-specific, which is the interesting part rather than an incidental
    qualifier: the same antibody arising from a different primary does not carry the same haplotype
    signal. That is consistent with the mechanism this entry curates, where the tumour is the site at
    which the antigen is presented and the anti-tumour response is shaped.

    Scale is the limit. Forty cases against ethnically matched controls is small for an HLA study, and
    the odds ratio of 5.4 is not accompanied by a confidence interval in the abstract. No replication
    cohort is cited. relationship_type is SUSCEPTIBILITY, which is the correct value for a common-variant
    risk haplotype and should not be read as a determinant.'
  evidence:
  - reference: PMID:29306402
    reference_title: Complex HLA association in paraneoplastic cerebellar ataxia with anti-Yo antibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Increased DRB1*13:01~DQA1*01:03~DQB1*06:03 was also found in PCD ovarian cases (OR=5.4,
      p=0.0016).
    explanation: The risk association, quoted with its effect size and the tumour type it is specific to.
  - reference: PMID:29306402
    reference_title: Complex HLA association in paraneoplastic cerebellar ataxia with anti-Yo antibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These results suggest differential genetic susceptibility to anti-Yo per cancer and with a
      primary HLA Class II involvement.
    explanation: The authors' own conclusion, which states both the class II localisation and the
      per-cancer specificity. Their hedge ("suggest") is preserved.
- name: HLA-DPB1
  gene_term:
    preferred_term: HLA-DPB1
    term:
      id: hgnc:4940
      label: HLA-DPB1
  relationship_type: PROTECTIVE
  association: The DPA1*01:03~DPB1*04:01 haplotype is protective against anti-Yo disease overall.
  notes: 'Curated as a separate record from HLA-DRB1 rather than folded into a single HLA entry, because
    relationship_type is a per-record value and these two point in opposite directions. Reporting them
    together would have forced one of the two directions to be lost.

    The reported odds ratio of 0 is a zero cell, not a measured effect size - no case carried the
    haplotype. That is a real observation in a 40-case study and it is also exactly the situation in
    which an odds ratio is uninformative about magnitude. The second, non-zero estimate for the same
    haplotype (OR=0.35) is quoted alongside it for that reason.'
  evidence:
  - reference: PMID:29306402
    reference_title: Complex HLA association in paraneoplastic cerebellar ataxia with anti-Yo antibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We detected protective effects of DPA1*01:03~DPB1*04:01 (OR=0, p=0.0008),
      DRB1*04:01~DQA1*03:03(OR=0, p=0.0016) and DPA1*01:03~DPB1*04:01 (OR=0.35, p=0.0047) overall.
    explanation: The protective associations with their effect sizes. The sentence carries the same
      haplotype twice with different odds ratios, which is quoted rather than tidied because it is what
      makes the zero cells interpretable.
environmental:
- name: Immune checkpoint inhibitor therapy
  description: 'Anti-PD-1, anti-PD-L1 and anti-CTLA-4 therapy can trigger a cerebellar syndrome that is
    clinically and immunologically continuous with spontaneous paraneoplastic cerebellar degeneration.
    It is the one exposure in this disease with a mechanism that is not merely plausible but by design:
    checkpoint inhibitors work by removing the restraint on an antitumour T-cell response, and this
    entry''s trigger node is an antitumour response that has become cross-reactive with Purkinje cells.

    Curated as an exposure rather than as a subtype because the resulting syndrome is not clearly the
    same disease - see the discussion pcd_ici_triggered_same_disease.'
  exposure_term:
    preferred_term: exposure to an immune checkpoint inhibitor
    term:
      id: ECTO:9001737
      label: exposure to antineoplastic agent
  influences_mechanisms:
  - target: Antitumour Immune Response Cross-Reactive with Purkinje Cells
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Checkpoint blockade removes the inhibitory restraint on the antitumour T-cell response
      that this node describes, which is the same response that becomes cross-reactive with Purkinje
      cells. The exposure acts on the node by design rather than as a side effect of an unrelated
      mechanism.
    evidence:
    - reference: PMID:39153058
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Symptoms developed at a median of 11 weeks after ICI onset.
      explanation: The temporal relationship between exposure and syndrome onset, across 35 pooled
        patients. A median of eleven weeks is what makes this a triggering relationship rather than a
        coincidental one in patients who have cancer anyway.
  evidence:
  - reference: PMID:39153058
    reference_title: 'Immune Checkpoint Inhibitor-Related Cerebellar Toxicity: Clinical Features and
      Comparison with Paraneoplastic Cerebellar Ataxia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neuronal antibodies were detected in 15/31 patients tested (48%).
    explanation: Roughly half of checkpoint-inhibitor cerebellar cases carry a neuronal antibody, which
      is what places the syndrome on the same immunological spectrum as the spontaneous disease rather
      than making it a separate toxicity.
  - reference: PMID:37151179
    reference_title: Immune checkpoint inhibitor-associated central nervous system autoimmunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CNS manifestations included encephalitis (n = 16), meningoencephalitis (n = 8), cerebellar
      ataxia (n = 4), demyelinating syndrome (n = 2), and myelopathy (n = 1).
    explanation: Places the cerebellar syndrome in proportion within checkpoint-inhibitor CNS
      autoimmunity - it is a minority manifestation, four of thirty-one, which bears on how often a
      clinician should expect it.
  notes: 'The exposure term is broader than the exposure. ECTO has no term for checkpoint inhibitor
    exposure specifically, and no term for pembrolizumab or nivolumab exposure; exposure to antineoplastic
    agent is the most specific correct ancestor, with the actual drug class kept in preferred_term. Both
    searches are recorded here so the binding is not re-derived.

    This matches the existing binding in Autoimmune_Encephalitis, which uses the same CURIE for the same
    exposure. just environmental-term-audit reports a name conflict against ECTO:0000509 (exposure to
    drug); that is a normalisation artifact rather than a disagreement - the other CURIE is bound to
    generic drug exposures in unrelated entries, not to checkpoint inhibitors.

    environmental_effect is TRIGGERS rather than the PREDISPOSES used in Autoimmune_Encephalitis. The
    difference is deliberate: the cited series gives a median of eleven weeks from drug start to
    neurological onset, which is a triggering interval, where the encephalitis entry records a
    predisposing relationship without that temporal anchor.'
treatments:
- name: Corticosteroid Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: 'Steroids, usually intravenous methylprednisolone pulses followed by oral maintenance, as
    first-line immunosuppression. Used extensively and with limited success, and the mechanism explains
    why: in the anti-Yo form the Purkinje cells are already dead by the time the syndrome is recognised,
    and no immunosuppression replaces a Purkinje cell.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glucocorticoid
      term:
        id: CHEBI:24261
        label: glucocorticoid
  target_mechanisms:
  - target: Antitumour Immune Response Cross-Reactive with Purkinje Cells
    description: Broad suppression of the immune response upstream of the cerebellar injury, which is
      the only point at which it can act.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Immunotherapies, such as steroids, intravenous immune globulins, and plasma exchange, have
      been extensively used in managing this condition, with limited success.
    explanation: States both the practice and its poor result, in the source's own words. The same
      sentence supports the IVIG and plasma exchange records below; each is curated separately because
      they act by different routes and are separately bindable.
  - reference: PMID:41197574
    reference_title: 'Clinical characteristics, treatment, and outcomes in anti-metabotropic glutamate
      receptor-1 encephalitis: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Glucocorticoids constituted the most common immunotherapy (n = 29, 80.6 %).
    explanation: Quantifies steroid use, in the anti-mGluR1 population. Recorded here because the
      outcomes in that population are markedly better than in anti-Yo disease, which is the entry's
      central prognostic claim rather than an incidental difference.
- name: Intravenous Immunoglobulin
  therapeutic_modality: OTHER
  description: Pooled immunoglobulin, used first line alongside or after steroids. Its mechanism in this
    disease is not established, which is one reason the record is bound to the immunoglobulin therapy
    action rather than to a named agent.
  treatment_term:
    preferred_term: Intravenous Immunoglobulin Therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_mechanisms:
  - target: Antitumour Immune Response Cross-Reactive with Purkinje Cells
    description: Modulates the systemic immune response upstream of the cerebellar injury.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Immunotherapies, such as steroids, intravenous immune globulins, and plasma exchange, have
      been extensively used in managing this condition, with limited success.
    explanation: Names intravenous immune globulin among the treatments used and states the outcome.
- name: Therapeutic Plasma Exchange
  therapeutic_modality: OTHER
  description: 'Removal of circulating antibody. Its rationale is entirely conditional on the
    antibody-effector hypothesis, which makes it the treatment whose success or failure carries the most
    mechanistic information in this entry: if antibodies were the effectors in anti-Yo disease, this
    should work, and it mostly does not.'
  treatment_term:
    preferred_term: Plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  target_mechanisms:
  - target: Antibody-Mediated Purkinje Cell Dysfunction
    description: Removes the circulating antibody, which is the effector in the surface-antigen arm and
      the point at which this treatment has a mechanistic rationale.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Immunotherapies, such as steroids, intravenous immune globulins, and plasma exchange, have
      been extensively used in managing this condition, with limited success.
    explanation: Names plasma exchange among the treatments used and states the outcome, which is the
      weak evidence against the antibody-effector reading discussed in this entry.
  - reference: PMID:32872070
    reference_title: 'Plasma exchange for treating anti-Yo-associated paraneoplastic cerebellar
      degeneration: Case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After four courses of plasma exchange, the patient could walk independently, the Romberg
      test was negative, and anti-Yo antibodies were undetectable.
    explanation: A single case with an unusually good outcome, in an atypical patient - male, and with
      no tumour found. It is curated because it is a genuine counterexample to the uniformly poor
      prognosis, and its atypia is stated so it is not read as representative.
  notes: 'The plasma exchange case above is one patient. The authors themselves conclude that the
    approach needs more study, and the patient differed from the typical anti-Yo population in two ways
    that plausibly matter - male sex and the absence of a detected tumour. It is recorded as a
    counterexample, not as evidence of efficacy.'
- name: B-Cell Depletion
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: 'Anti-CD20 monoclonal antibodies - rituximab, and more recently ofatumumab - as
    second-line treatment when first-line immunotherapy fails. It is the most mechanistically targeted
    option available, and like plasma exchange its rationale depends on the antibody arm mattering.

    The evidence available for this record is two single cases and it is deliberately not presented as
    more than that. Both are reported as favourable outcomes, and favourable single cases are the ones
    that get published. Note also that the mGluR1 case is a surface-antigen disease with a much better
    baseline prognosis, so it should not be read as evidence for B-cell depletion in anti-Yo disease.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ofatumumab
      term:
        id: NCIT:C66952
        label: Ofatumumab
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Antitumour Immune Response Cross-Reactive with Purkinje Cells
    description: Depletes the B-cell compartment producing the onconeural antibody.
  evidence:
  - reference: PMID:39737186
    reference_title: 'Case report: paraneoplastic cerebellar degeneration associated with anti-Yo
      antibody successfully treated with ofatumumab.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: When a second course of methylprednisolone pulse therapy proved ineffective, treatment was
      switched to ofatumumab. After two doses, the patient achieved partial symptomatic relief.
    explanation: A single anti-Yo case, quoted with the outcome the authors actually report - partial
      relief - rather than the "successfully treated" of their title. The distinction matters because
      this entry's prognosis claims are about degree of recovery.
  - reference: PMID:40760473
    reference_title: 'Efficacy of early rituximab treatment in anti-mGluR1 encephalitis: a case report.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: As the initial treatment was insufficient, rituximab was administered, leading to
      significant improvement, including the ability to walk unaided.
    explanation: A single surface-antigen case. Graded INDIRECT because the inference to anti-Yo disease
      requires an extra step the case does not support - anti-mGluR1 disease is antibody-mediated against
      an accessible target and recovers far more often, so a good result there does not predict one here.
- name: Tumour Resection
  therapeutic_modality: SURGERY
  description: Surgical removal of the underlying malignancy, on the rationale that removing the antigen
    source should shut down the immune response driving the neurological disease. The rationale is sound
    and the results are inconsistent, which is itself informative - it suggests the autoimmune response
    becomes self-sustaining, or that the damage is complete before the tumour is found.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Ectopic Onconeural Antigen Expression by Tumour
    description: Removes the source of the antigen that initiated the cross-reactive response, acting at
      the trigger node.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although some reports indicate benefit from antitumor therapies like surgery and
      chemotherapy, this has not been consistently observed.
    explanation: States the inconsistency directly. The claim this record makes is that benefit is
      reported and unreliable, which is what the source supports.
- name: Antitumour Chemotherapy
  therapeutic_modality: SMALL_MOLECULE
  description: Systemic treatment of the underlying malignancy, with the same antigen-removal rationale
    as resection and the same inconsistent neurological result. Curated separately from resection
    because the two are different modalities with different bindings, not because their evidence
    differs.
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Ectopic Onconeural Antigen Expression by Tumour
    description: Reduces or removes the antigen-expressing tumour burden at the trigger node.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although some reports indicate benefit from antitumor therapies like surgery and
      chemotherapy, this has not been consistently observed.
    explanation: The same sentence names chemotherapy alongside surgery, and states the same
      inconsistency.
  - reference: PMID:34817790
    reference_title: 'Anti-Tr/DNER Antibody-Associated Cerebellar Ataxia: a Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Oncological response was complete in 88%, but neurological prognosis was poor with only 41%
      of the patients presenting significant neurological improvement at the last follow up.
    explanation: 'The cleanest available dissociation between the two outcomes: in 85 anti-Tr/DNER
      patients the tumour is controlled in most and the ataxia is not. This is the strongest evidence in
      the entry that removing the antigen source does not reverse the neurological disease, and it is why
      the target_mechanisms edge points at the trigger node rather than at the cerebellar injury.'
  notes: Treating the tumour is not optional - it is the treatment for the cancer, whatever it does for
    the neurology. This record is about its neurological effect only, and should not be read as
    questioning oncological indication.
- name: Symptomatic and Supportive Care
  therapeutic_modality: BEHAVIORAL
  description: 'Rehabilitation, mobility aids and management of the established deficit. Curated because
    it is what most patients actually receive over the long term, and because the entry would otherwise
    imply that a disease in which most survivors cannot walk unassisted has nothing offered to it after
    immunotherapy fails.

    Recorded without an efficacy claim. No cited source in this entry reports a controlled outcome for
    supportive care in this disease, and none is asserted.'
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36334195
    reference_title: 'A Systematic Review on Anti-Yo/PCA-1 Antibody: Beyond Cerebellar Ataxia in
      Middle-Aged Women with Gynecologic Cancer.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, despite treatment, 84% of survivors were unable to walk unassisted on
      follow-up.
    explanation: Establishes the residual disability that this record exists to address. It is also the
      number that makes supportive care the substantive part of long-term management rather than an
      afterthought.
  notes: 'The 84% figure is the single most consequential number in this entry and it is pooled from
    case reports and small series, which are enriched for severe and unusual presentations. It should be
    read as the outcome among published anti-Yo patients, not as a population estimate.'
diagnosis:
- name: Onconeural antibody detection with risk stratification
  description: Detection of a characteristic antibody in serum or CSF. Current criteria classify
    antibodies by how strongly they predict an underlying cancer rather than treating them as a single
    category, which changes how a positive result should be acted on.
  evidence:
  - reference: PMID:34006622
    reference_title: Updated Diagnostic Criteria for Paraneoplastic Neurologic Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The term "onconeural antibody" was replaced by "high risk" (>70% associated with cancer)
      and "intermediate risk" (30%-70% associated with cancer) antibodies.
    explanation: Gives the quantitative threshold defining the high-risk antibody category that anti-Yo
      falls into, and the intermediate-risk band alongside it, so the reader can see that the
      classification is a graded scale rather than a binary.
  - reference: PMID:34006622
    reference_title: Updated Diagnostic Criteria for Paraneoplastic Neurologic Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we propose updated diagnostic criteria for PNS.
    explanation: Establishes that this reference is the current criteria statement rather than a review
      of practice.
- name: Search for an occult malignancy
  description: Investigation for a gynaecological or breast primary in the typical anti-Yo presentation.
    The neurological syndrome usually precedes the cancer diagnosis, so a negative initial search does
    not end the question.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The vast majority of cases have been reported in women with pelvic or breast tumors.
    explanation: States where to look, and the demographic that makes the search targeted.
- name: Antibody-guided imaging search for the primary tumour
  description: 'Which antibody is found determines where and how hard to look. Current guidance is that
    the antibody, more than the clinical syndrome, sets the risk and type of the underlying malignancy,
    and prescribes a modality sequence per body region rather than a single scan. It also sets a
    duration: a negative first search is repeated at 3 to 6 months and then six-monthly for up to four
    years, because the neurological syndrome almost always precedes the cancer.'
  evidence:
  - reference: PMID:20880069
    reference_title: 'Screening for tumours in paraneoplastic syndromes: report of an EFNS task force.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the nature of antibody, and to a lesser extent the clinical syndrome, determines the risk
      and type of an underlying malignancy.
    explanation: The principle behind antibody-guided rather than syndrome-guided screening. Graded
      OTHER because this is a task-force consensus recommendation, and the report states that no
      evidence-based grade A-C recommendations were possible.
  - reference: PMID:20880069
    reference_title: 'Screening for tumours in paraneoplastic syndromes: report of an EFNS task force.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: For screening of the thoracic region, a CT-thorax is recommended, which if negative is
      followed by fluorodeoxyglucose-positron emission tomography (FDG-PET).
    explanation: Places FDG-PET as the second-line thoracic modality rather than the first, which is the
      practical content of the recommendation.
  - reference: PMID:20880069
    reference_title: 'Screening for tumours in paraneoplastic syndromes: report of an EFNS task force.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If primary screening is negative, repeat screening after 3-6 months and screen every 6
      months up till 4 years.
    explanation: The surveillance interval and its endpoint. This is the operational answer to the
      problem stated in the record above - that a negative initial search does not end the question.
- name: FDG-PET/CT when no well-characterised antibody is found
  description: Whole-body FDG-PET/CT in clinically suspected paraneoplastic disease, including patients
    whose antibody testing is negative. This is the case where antibody-guided screening has nothing to
    guide it, and it is also where the yield data are weakest.
  evidence:
  - reference: PMID:22157026
    reference_title: Utility of F-18 FDG PET/CT in screening for paraneoplastic neurological syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of the 27 patients, 6 (22%) had an abnormal FDG uptake. Of these 6 patients, 5 (19%) were
      histologically confirmed as having a malignancy.
    explanation: The actual yield, from a 27-patient retrospective single-centre series. A five-cancer
      denominator is small, and the record is written so the reader sees that rather than inheriting the
      recommendation without its evidence base.
  - reference: PMID:22157026
    reference_title: Utility of F-18 FDG PET/CT in screening for paraneoplastic neurological syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PET/CT may be a useful screening tool for patients with clinically suspected PNS who do not
      exhibit well-characterized paraneoplastic antibodies.
    explanation: The authors' recommendation with their own hedge ("may") preserved, and scoped to the
      antibody-negative group where the antibody-guided approach does not apply.
animal_models:
- name: Anti-Yo IgG passive transfer to rodent brain and ventricles
  species: Mouse
  genotype: Wild-type, various strains; also rat recipients
  description: 'Patient anti-Yo IgG injected into mouse brain or, with complement or activated
    mononuclear cells, into rat ventricles. The antibody is taken up by Purkinje cells and stays there,
    and the cells do not die.

    This is a negative result and it is curated as the load-bearing evidence for the entry''s canonical
    hypothesis rather than as a footnote. The uptake half matters as much as the failure half: it rules
    out the trivial explanation that the antibody simply never reached its target.'
  publication: PMID:7707074
  modeled_mechanisms:
  - target: Antitumour Immune Response Cross-Reactive with Purkinje Cells
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    model_scale: TISSUE
    description: Anti-Yo IgG delivered directly to the target tissue, alone or with complement or
      activated mononuclear cells, does not produce Purkinje cell loss.
    limitations: 'A negative transfer result is weaker than it looks, and the specific weaknesses are
      worth naming. Rodent Purkinje cells may not present the human epitope in the way human cells do;
      a single injection over 36 hours is a fraction of the exposure a patient has over months; and
      intracerebral or intraventricular delivery is not the route the antibody takes in disease. What
      the experiment establishes is that antibody plus effector is not sufficient on the timescale
      tested, not that antibody is irrelevant.'
    divergences:
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: The observation window is 36 hours after a single injection. Human disease develops
        over weeks to months of continuous antibody exposure, so the model tests acute toxicity rather
        than the chronic process.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Rodent Purkinje cells are the recipients of a human autoantibody. The antibody does
        bind them, which limits how far this divergence can be pressed, but epitope presentation and
        downstream effector engagement need not match the human cell.
    readouts:
    - name: Purkinje cell survival after intracerebral anti-Yo IgG
      target: Antitumour Immune Response Cross-Reactive with Purkinje Cells
      direction: UNCHANGED
      interpretation: The measurement that carries the negative result. UNCHANGED here is the finding,
        not a missing datum.
      evidence:
      - reference: PMID:7707074
        reference_title: Passive transfer and active immunization with the recombinant leucine-zipper
          (Yo) protein as an attempt to establish an animal model of paraneoplastic cerebellar
          degeneration.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: On a single injection of PCD IgG to mouse brain, IgG was taken into Purkinje cells and
          remained there for more than 36 h without Purkinje cell loss.
        explanation: Records both halves - the antibody reached and entered the target cell, and the
          cell survived. The uptake is what makes the negative result interpretable.
    evidence:
    - reference: PMID:7707074
      reference_title: Passive transfer and active immunization with the recombinant leucine-zipper (Yo)
        protein as an attempt to establish an animal model of paraneoplastic cerebellar degeneration.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: The anti-Yo antibody, with or without complement or activated mononuclear cells,
        therefore could not be the sole cause of Purkinje cell loss.
      explanation: The authors' conclusion, graded REFUTE against the antibody-effector reading of this
        node. Note the claim they make is bounded - "sole cause" - and the entry does not stretch it
        into a claim that the antibody plays no part.
  - target: Antibody-Mediated Purkinje Cell Dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: Cited as a bounding result for the antibody-effector mechanism generally. Fidelity is
      LOW because this node is about a surface antigen and the transferred antibody targets an
      intracellular one.
    limitations: The antibody transferred here is anti-Yo, against the intracellular CDR2. This node
      describes an antibody against a cell-surface channel, which is a different mechanism with a
      different physical basis. A failure to transfer intracellular-antigen disease says little about
      whether surface-antigen disease is antibody-mediated, and the link is recorded only so that a
      reader does not mistake the anti-Yo negative for a general refutation of antibody effectors.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: INVALIDATING
      description: The quantity transferred is an antibody against an intracellular antigen; the
        quantity this node is about is an antibody against a surface antigen. The two differ in whether
        the target is physically accessible to the antibody in a living cell, which is the whole
        mechanistic distinction the entry draws.
    evidence:
    - reference: PMID:7707074
      reference_title: Passive transfer and active immunization with the recombinant leucine-zipper (Yo)
        protein as an attempt to establish an animal model of paraneoplastic cerebellar degeneration.
      supports: NO_EVIDENCE
      evidence_source: MODEL_ORGANISM
      snippet: The anti-Yo antibody, with or without complement or activated mononuclear cells,
        therefore could not be the sole cause of Purkinje cell loss.
      explanation: Graded NO_EVIDENCE against this node deliberately. The experiment is real and its
        conclusion is sound, and it does not bear on a surface-antigen mechanism at all. Recording that
        explicitly is the point of the link.
- name: Active immunization with recombinant Yo protein across four MHC backgrounds
  species: Mouse
  genotype: 'Wild-type BALB/c (H-2d), C3H (H-2k), C57BL/6 (H-2b), SJL/J (H-2s); also C57BL/6 nu/nu'
  background: Four inbred strains bearing different MHC haplotypes
  description: Mice immunized with recombinant Yo protein raise high anti-Yo titres and reactive spleen
    cells across four MHC backgrounds, and none develops ataxia or loses Purkinje cells. Using four
    haplotypes is what makes this more than one failed experiment - it rules out the explanation that a
    single strain simply lacked the right restriction element.
  publication: PMID:7788981
  modeled_mechanisms:
  - target: Antitumour Immune Response Cross-Reactive with Purkinje Cells
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    model_scale: ORGANISM
    description: A systemic anti-Yo immune response, raised in vivo and MHC-diverse, is not sufficient
      to produce the disease.
    limitations: The immunization raises a peripheral response. Nothing in the protocol breaks the
      blood-brain barrier, provides the tumour that in patients precedes the neurological disease, or
      supplies whatever second event lets a peripheral response reach the cerebellum. The authors draw
      exactly this conclusion, so the model's failure is informative about sufficiency rather than about
      the mechanism being wrong.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: There is no tumour in this model. In patients the antigen is presented by a
        malignancy, which is also the setting in which the response is shaped and, plausibly, the setting
        that licenses access to the CNS. Immunization with recombinant protein represents the antigen
        without representing that context.
    readouts:
    - name: Cerebellar ataxia and Purkinje cell loss after Yo immunization
      target: Antitumour Immune Response Cross-Reactive with Purkinje Cells
      direction: UNCHANGED
      interpretation: The negative outcome, measured across four MHC haplotypes rather than one.
      evidence:
      - reference: PMID:7788981
        reference_title: 'Trial to establish an animal model of paraneoplastic cerebellar degeneration
          with anti-Yo antibody. 1. Mouse strains bearing different MHC molecules produce antibodies on
          immunization with recombinant Yo protein, but do not cause Purkinje cell loss.'
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: All the strains produced high anti-Yo antibody titer but none developed cerebellar
          ataxia or showed Purkinje cell loss.
        explanation: The measurement, with the antibody response confirmed so the failure cannot be
          attributed to a failed immunization.
    evidence:
    - reference: PMID:7788981
      reference_title: 'Trial to establish an animal model of paraneoplastic cerebellar degeneration
        with anti-Yo antibody. 1. Mouse strains bearing different MHC molecules produce antibodies on
        immunization with recombinant Yo protein, but do not cause Purkinje cell loss.'
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: Results suggest that antibody production in peripheral blood alone is not sufficient for
        the development of PCD and that MHC class II molecules function in the activation of T cells to
        help B cells to help B cells produce antibodies.
      explanation: The authors' conclusion, graded REFUTE against a peripheral-antibody account of this
        node. Quoted as written, including the duplicated clause in the source.
    - reference: PMID:7788964
      reference_title: 'Trial to establish an animal model of paraneoplastic cerebellar degeneration
        with anti-Yo antibody. 2. Passive transfer of murine mononuclear cells activated with
        recombinant Yo protein to paraneoplastic cerebellar degeneration lymphocytes in severe combined
        immunodeficiency mice.'
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: Spleen cells from these Yo protein immunized mice were injected intravenously or
        intracerebrally into naive mice that subsequently showed no neurological symptoms or loss of
        Purkinje cells.
      explanation: The companion paper to the immunization study above. It transfers the cellular arm
        rather than the antibody, including directly into brain, and is the fourth of the four failed
        reconstructions this entry records. Graded REFUTE for the same reason - it bears against the
        sufficiency of the transferred response.
- name: DNA immunization raising both anti-Yo antibodies and CDR2-specific cytotoxic T cells
  species: Mouse
  genotype: Wild-type BALB/c immunized with naked pcd17 (CDR2) cDNA
  description: 'The most demanding of the four transfer and immunization experiments, and the one this
    entry treats as most informative. DNA immunization generated both arms of the human immune response
    at once - anti-Purkinje cell autoantibodies and CDR2-specific cytotoxic T lymphocytes able to lyse
    peptide-pulsed targets - and still produced no clinical or pathological cerebellar degeneration.

    It is curated because it does not favour either hypothesis in this entry. The other three
    experiments fail to transfer antibody-mediated disease and so support the T-cell reading by
    elimination. This one raises the T cells too, and still fails.'
  publication: PMID:11771954
  modeled_mechanisms:
  - target: Cytotoxic T Cell-Mediated Purkinje Cell Destruction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    model_scale: ORGANISM
    description: A CDR2-specific cytotoxic T-cell response demonstrably capable of lysing peptide-pulsed
      targets does not, on its own, produce cerebellar degeneration in vivo.
    limitations: 'The T cells were shown to lyse syngeneic myeloma cells pulsed with peptide - an
      artificial target presenting the epitope at high density. That is not evidence they could
      recognise a Purkinje cell, which presents endogenous antigen and which upregulates MHC class I in
      human disease but need not do so in an unmanipulated mouse. So the experiment shows that raising
      CDR2-specific CTLs is not sufficient; it does not show that the CTLs generated were the same
      effector population as in patients.'
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: Cytotoxic capability is measured against peptide-pulsed myeloma cells, not against
        Purkinje cells. The measured quantity is epitope-specific lysis in vitro; the quantity of
        interest is killing of an endogenously presenting neuron in vivo.
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: No tumour and no MHC class I upregulation on cerebellar neurons - the two features
        that in human neuropathology make the Purkinje cell a visible target for a CD8 T cell.
    readouts:
    - name: Cerebellar degeneration after CDR2 DNA immunization
      target: Cytotoxic T Cell-Mediated Purkinje Cell Destruction
      direction: UNCHANGED
      interpretation: No degeneration, despite both effector arms being present. This is the strongest
        single argument in the entry that the mechanism is not yet fully accounted for by either
        hypothesis.
      evidence:
      - reference: PMID:11771954
        reference_title: Induction of cytotoxic T lymphocytes specific for paraneoplastic cerebellar
          degeneration-associated antigen in vivo by DNA immunization.
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: In spite of the generation of anti-Purkinje cell antibodies and PCD17-specific CTLs in
          vivo, neither clinical nor pathological changes consistent with significant cerebellar
          degeneration have been detected.
        explanation: The negative result stated with both arms confirmed present. Graded REFUTE because
          it cuts against the sufficiency of the cytotoxic mechanism this node asserts, which is a
          different and weaker claim than refuting the mechanism itself.
    evidence:
    - reference: PMID:11771954
      reference_title: Induction of cytotoxic T lymphocytes specific for paraneoplastic cerebellar
        degeneration-associated antigen in vivo by DNA immunization.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We show that DNA immunization with naked pcd17 cDNA could induce autoantibodies against
        the cytoplasmic protein of Purkinje cells and CTLs could lyse syngenic myeloma cells pulsed with
        H-2K-restricted PCD17 peptide.
      explanation: Establishes that the model genuinely produced both effector arms, which is what makes
        the accompanying negative outcome worth citing at all. Graded SUPPORT because this sentence
        supports treating the model as informative for this node, separately from what the model then
        showed.
  notes: 'Read together with the two transfer experiments above, these four studies say something the
    entry''s two hypotheses do not: no experimental reconstruction of either arm of the human immune
    response has produced the disease in an animal. That is recorded as a knowledge gap rather than
    resolved, and it is the reason the canonical hypothesis is argued from human neuropathology and from
    the antigen''s compartment rather than from a model.'
discussions:
- discussion_id: pcd_ici_triggered_same_disease
  kind: INTERPRETATION
  prompt: Is checkpoint-inhibitor-triggered cerebellar ataxia the same disease as spontaneous
    paraneoplastic cerebellar degeneration, or a distinct drug toxicity that resembles it?
  attaches_to:
  - environmental#Immune checkpoint inhibitor therapy
  - pathophysiology#Antitumour Immune Response Cross-Reactive with Purkinje Cells
  rationale: 'The case for one disease is mechanistic and strong. Checkpoint inhibitors act by removing
    restraint from an antitumour T-cell response, which is exactly the response this entry''s trigger
    node describes; about half of affected patients carry a neuronal antibody; and the syndrome is
    cerebellar. If the spontaneous disease is a failure of tolerance in an antitumour response, the drug
    version is that failure induced deliberately.

    The case against is empirical and also strong. The one study that compares the two directly finds
    them significantly different on four axes at once - sex, tumour type, whether the ataxia is isolated,
    and outcome. Male predominance and lung cancer are the inverse of the anti-Yo picture, which is
    female and gynaecological. A better outcome is the difference that matters clinically, and it is not
    a small one.

    The entry does not resolve this. It curates the exposure and its mechanism link, and does not create
    a subtype, because a subtype would assert sameness that the comparative data do not support. Nor is
    it excluded, because excluding it would assert difference on the strength of one retrospective
    comparison of 35 against 15 patients.

    Worth stating what would settle it: whether the antibody-defined subgroup of checkpoint-inhibitor
    cases behaves like its spontaneous counterpart. The comparison available pools antibody-positive and
    antibody-negative cases together, so the better outcome could belong entirely to the antibody-negative
    half and tell us nothing about whether anti-Yo disease triggered by a drug differs from anti-Yo
    disease arising on its own.'
  evidence:
  - reference: PMID:39153058
    reference_title: 'Immune Checkpoint Inhibitor-Related Cerebellar Toxicity: Clinical Features and
      Comparison with Paraneoplastic Cerebellar Ataxia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: When compared with a series of PCA (n = 15), the cerebellar irAE group was significantly
      more associated with male sex, lung cancer (rather than gynecological/breast cancers), isolated
      ataxia, and a better outcome.
    explanation: The direct comparison, with its denominators. Four simultaneous differences in a
      35-versus-15 retrospective comparison is the whole case against treating the two as one disease,
      and the sample sizes are why it is not decisive.
  - reference: PMID:39153058
    reference_title: 'Immune Checkpoint Inhibitor-Related Cerebellar Toxicity: Clinical Features and
      Comparison with Paraneoplastic Cerebellar Ataxia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical presentation-antibody-tumor triad in the ICI group only partially reflects the
      associations described in paraneoplastic disorders.
    explanation: The authors' own summary of the relationship - partial correspondence rather than
      identity or independence, which is the position this discussion records.
- discussion_id: pcd_antibody_versus_t_cell_effector
  kind: CONTROVERSY
  prompt: In anti-Yo paraneoplastic cerebellar degeneration, is the autoantibody an effector of Purkinje
    cell death or a marker of a T cell-mediated attack?
  attaches_to:
  - pathophysiology#Antitumour Immune Response Cross-Reactive with Purkinje Cells
  - pathophysiology#Cytotoxic T Cell-Mediated Purkinje Cell Destruction
  - mechanistic_hypotheses#pcd_t_cell_mediated_intracellular
  rationale: 'The review literature states plainly that the relative importance of autoantibodies and
    cytotoxic T lymphocytes in the neuronal loss is debated. This entry curates the T-cell reading as
    canonical, and the reasoning should be visible rather than assumed.

    The argument for it is not primarily empirical, it is mechanical: CDR2 is intracellular, and an
    antibody in the extracellular space cannot bind an intracellular antigen in a living cell. The
    neuropathology then supplies exactly what a cytotoxic attack should look like - MHC class I
    upregulated on neurons, CD8 granzyme-B T cells present, microglial nodules.

    What keeps it a controversy rather than a settled question is that cytoplasmic IgG staining is seen
    in some neurons, and that nobody has shown the T-cell response is sufficient. The practical stake is
    therapeutic: if antibodies are effectors, plasma exchange and B-cell depletion should work, and the
    published experience is that they mostly do not - which is itself weak evidence for the T-cell
    reading.'
  proposed_experiments:
  - experiment_id: pcd_effector_depletion_comparison
    name: Comparative depletion of the antibody and T-cell arms in anti-Yo PCD
    description: Compare outcomes between antibody-directed treatment (plasma exchange, B-cell depletion)
      and T cell-directed treatment in anti-Yo patients treated at a comparable point in the clinical
      course, since the existing experience confounds treatment type with how late it was given.
    readouts:
    - name: Cerebellar function after arm-specific immunotherapy
      target: pathophysiology#Cytotoxic T Cell-Mediated Purkinje Cell Destruction
      direction: UNCHANGED
      interpretation: If antibody removal does not change the course while T cell-directed treatment
        does, the canonical hypothesis is supported over the antibody-effector one.
- discussion_id: pcd_antigen_compartment_determines_window
  kind: INTERPRETATION
  prompt: Should paraneoplastic cerebellar degeneration be treated as one disease, given that the antigen
    compartment appears to determine both the mechanism and whether treatment can work?
  attaches_to:
  - mechanistic_hypotheses#pcd_antibody_mediated_surface
  - pathophysiology#Antibody-Mediated Purkinje Cell Dysfunction
  rationale: 'The neuropathological comparison in this entry finds the intracellular-antigen and
    surface-antigen forms differ in nearly every measured feature: distribution of cell loss, MHC class I
    upregulation, complement deposition, antigen downregulation, and evidence of endoplasmic reticulum
    stress. That is a large difference to hold inside one disease name.

    The reason it is curated as one entry with two hypothesis groups rather than split is that the
    clinical syndrome, the tumour association and the diagnostic pathway are shared, and the antibody is
    often not known when the patient presents. A clinician meets one syndrome and finds out later which
    mechanism it was.

    The consequence worth flagging is prognostic. The uniformly poor outlook attached to this disease
    comes from anti-Yo series. It should not be assumed to apply to the surface-antigen forms, where the
    pathology suggests dysfunction preceding death and therefore a window in which early treatment might
    matter - a point the source paper makes explicitly.

    This is also the boundary question against the existing Paraneoplastic_Neurological_Syndromes entry,
    which splits by antigen compartment rather than by syndrome. The two entries are complementary and
    should stay consistent: that one covers the compartment distinction across syndromes, and this one
    covers what it means within the cerebellar syndrome.'
- discussion_id: pcd_surface_antigen_evidence_thin
  kind: KNOWLEDGE_GAP
  prompt: How much confidence should the neuropathological contrast between the intracellular-antigen
    and surface-antigen forms carry, given that it rests on a single anti-P/Q-VGCC autopsy case?
  attaches_to:
  - mechanistic_hypotheses#pcd_antibody_mediated_surface
  - pathophysiology#Antibody-Mediated Purkinje Cell Dysfunction
  rationale: 'The scope of this gap is narrower than it first appears, and getting the scope right is
    the point of recording it.

    What does not rest on one case: the compartment rule itself. That an antibody cannot reach an
    intracellular antigen in a living cell is mechanical, and the surface-antigen side of it is
    supported independently by anti-Tr/DNER, whose target is a demonstrated extracellular domain, and by
    anti-mGluR1, where 42 pooled cases respond to immunotherapy as an antibody-mediated mechanism
    predicts. The entry''s two-hypothesis architecture is not fragile.

    What does rest on one case: the specific neuropathological contrast. The paper that establishes it
    is explicit about its own denominator - one anti-P/Q-VGCC case against two anti-Yo cases and
    controls - and everything the entry says about topography of cell loss, MHC class I upregulation,
    complement deposition, antigen downregulation and endoplasmic reticulum stress in the surface-antigen
    arm inherits that limitation. So does the prognostic implication drawn from it.

    This is recorded rather than hedged into the node descriptions because it is a property of the
    evidence base, not of the claim: no amount of careful wording in the pathophysiology nodes tells a
    reader which parts rest on a single case, and the alternative - omitting the arm - would lose a real
    and well-characterised finding.

    A separate and larger gap sits underneath all of this. Four independent attempts to reconstruct the
    disease in animals - passive transfer of patient IgG, active immunization across four MHC
    haplotypes, transfer of immunized spleen cells, and DNA immunization raising both antibodies and
    CDR2-specific cytotoxic T cells - have all failed to produce cerebellar degeneration. Neither
    hypothesis in this entry has been shown sufficient in vivo. The animal_models section records these
    individually; the point of noting it here is that the choice between the two hypotheses is being made
    on human neuropathology and antigen compartment, not on any positive experimental reconstruction.'
  proposed_experiments:
  - experiment_id: pcd_surface_antigen_autopsy_series
    name: Multi-case neuropathological series of surface-antigen paraneoplastic cerebellar degeneration
    description: Assemble additional anti-P/Q-VGCC and other surface-antigen PCD autopsy cases and repeat
      the MHC class I, complement, CD8 and antigen-downregulation assessments, to establish whether the
      single-case findings generalise.
    readouts:
    - name: MHC class I upregulation in surface-antigen PCD cerebellum
      target: pathophysiology#Antibody-Mediated Purkinje Cell Dysfunction
      direction: UNCHANGED
      interpretation: Consistent absence of MHC class I upregulation across further cases would confirm
        that the surface-antigen arm is not a cytotoxic T-cell mechanism.
notes: 'Boundary with Paraneoplastic_Neurological_Syndromes. That entry (MONDO:0018215) exists and
  subdivides by antigen compartment - Intracellular Antigen PNS and Surface Antigen PNS - across all
  paraneoplastic neurological syndromes. This entry is the cerebellar syndrome, and it adds what the
  compartment-level entry does not carry: the specific onconeural antigen (CDR2), the Purkinje cell as
  the vulnerable population, the topography of cell loss, and the syndrome-specific prognosis. The two
  are complementary rather than redundant, and the compartment distinction is deliberately expressed
  here in the same terms so they stay consistent.

  A curator who disagrees has a reasonable case that this should instead be a has_subtypes entry on
  Paraneoplastic_Neurological_Syndromes. The argument against is that MONDO carries a distinct term, that
  the Purkinje-specific mechanism is not derivable from the compartment classification, and that PCD is
  the best-characterised paraneoplastic syndrome in its own right. This is flagged rather than assumed.

  kb/groupings/Cerebellar_Ataxias.yaml mentions paraneoplastic cerebellar degeneration and may want this
  entry as a member. That is a grouping edit and is deliberately not made here, since it changes a
  different artifact than the one this PR curates.

  On the antigen compartments. The two mechanistic_hypotheses are not rival explanations of one
  mechanism. They describe different antigen classes, and both are probably true of their respective
  patients. They are modelled as hypothesis groups because the causal edges genuinely diverge and each
  edge belongs to one of them, which is what hypothesis_groups is for.

  On ontology bindings. One phenotype term is broader than the finding, with the specific concept kept
  in preferred_term: HPO has no term for a pancerebellar syndrome as distinct from progressive cerebellar
  ataxia.

  An earlier version of this entry bound the CSF findings to a single broad term and justified it here on
  the grounds that HPO has no term for the triad together. That was true but misleading, and it produced
  the wrong curation: HPO has perfectly good terms for each component - HP:0002922, HP:0012229 and
  HP:6000397 - and the right answer was three phenotypes, not one broad binding. The three are now
  curated separately. The general lesson is worth keeping: the absence of a term for a bundle is an
  argument for unbundling the claim, not for binding the bundle to whichever component has a term.

  On gene identifiers. CDR2 is hgnc:1799. Both the deep-research report and the first round of review
  proposed hgnc:1802, which is CDSN, an unrelated skin gene. Recorded because the two independent
  sources agreeing on a wrong identifier is exactly the situation in which it would have been accepted
  without checking.'

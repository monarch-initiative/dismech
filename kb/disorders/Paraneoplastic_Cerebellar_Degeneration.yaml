name: Paraneoplastic Cerebellar Degeneration
creation_date: '2026-09-06T08:15:00Z'
category: Complex
disease_term:
  preferred_term: paraneoplastic cerebellar degeneration
  term:
    id: MONDO:0044877
    label: paraneoplastic cerebellar degeneration
synonyms:
- PCD
- subacute cerebellar degeneration
- anti-Yo paraneoplastic cerebellar degeneration
- paraneoplastic cerebellar syndrome
description: 'A subacute pancerebellar syndrome in which an immune response raised against a tumour
  destroys Purkinje cells. The tumour ectopically expresses a protein that is normally restricted to the
  cerebellum, the immune system attacks it, and the cerebellum is collateral damage. The archetype is
  anti-Yo, directed against cerebellar degeneration-related protein 2 (CDR2), in women with
  gynaecological or breast cancer.

  The entry is built around a distinction that a purely clinical description would hide. Neuropathology
  shows that PCD is not one mechanism but at least two, and which one applies depends on where the
  target antigen sits.

  When the antigen is intracellular (anti-Yo), the pathology is that of a cytotoxic T-cell attack:
  diffuse and widespread Purkinje cell loss, microglial nodules, CD8-positive granzyme-B-positive T
  cells, and upregulation of MHC class I on neurons. An antibody cannot reach an intracellular antigen
  in a living cell, so on this arm the antibody is a marker of the response rather than its effector.

  When the antigen is on the cell surface (anti-P/Q-type voltage-gated calcium channel), the picture
  differs in nearly every respect: Purkinje cell loss is focal rather than diffuse, sparing caudal
  regions and lateral hemispheres, there is no MHC class I upregulation and no complement deposition,
  the channel itself is downregulated, and there is evidence of endoplasmic reticulum stress and
  impaired axonal transport. Here the antibody plausibly is the agent.

  That distinction has a direct clinical consequence, and it is the reason this entry exists separately
  from the general paraneoplastic entry. Cells killed by cytotoxic T cells do not come back, which is
  why anti-Yo PCD has an almost uniformly poor prognosis whatever is done. Cells made dysfunctional by
  antibody binding might recover if the antibody is removed early, which is why the surface-antigen arm
  has a therapeutic window that the intracellular arm does not.'
parents:
- Paraneoplastic Neurological Syndrome
- Acquired Cerebellar Ataxia
mechanistic_hypotheses:
- hypothesis_group_id: pcd_t_cell_mediated_intracellular
  hypothesis_label: Cytotoxic T-cell attack on Purkinje cells presenting an intracellular onconeural
    antigen
  status: CANONICAL
  description: In anti-Yo and other intracellular-antigen forms, the effector is a cytotoxic CD8 T-cell
    response and the antibody is a diagnostic marker rather than the agent of injury. The strongest
    support is neuropathological - MHC class I upregulation on neurons, CD8-positive granzyme-B-positive
    T cells, and microglial nodules are the signature of a T cell-mediated attack, and an antibody
    cannot reach an intracellular antigen in a living cell.
  evidence:
  - reference: PMID:36070310
    reference_title: Paraneoplastic Cerebellar Degeneration With P/Q-VGCC vs Yo Autoantibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although the intracellular location of the target antigen in anti-Yo-PCD supports a T
      cell-mediated pathology, the immune mechanisms in anti-P/Q-VGCC-PCD remain unclear.
    explanation: States the argument from antigen compartment for this hypothesis, and in the same
      sentence marks the surface-antigen arm as unresolved.
- hypothesis_group_id: pcd_antibody_mediated_surface
  hypothesis_label: Direct antibody-mediated Purkinje cell dysfunction against a surface antigen
  status: ALTERNATIVE
  description: In anti-P/Q-VGCC PCD the autoantibody plausibly causes the disease directly, by altering
    synaptic transmission at a channel it can physically reach, producing calcium dysregulation and
    eventual Purkinje cell death. It is curated as ALTERNATIVE rather than as a competing account of the
    same disease, because it describes a different antigen class - the two hypotheses are not rivals for
    one mechanism so much as two mechanisms sharing a syndrome.
  evidence:
  - reference: PMID:36070310
    reference_title: Paraneoplastic Cerebellar Degeneration With P/Q-VGCC vs Yo Autoantibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings support a pathogenic role of anti-P/Q-VGCC autoantibodies in causing neuronal
      dysfunction, probably due to altered synaptic transmission resulting in calcium dysregulation and
      subsequent PC death.
    explanation: The authors' statement of this hypothesis, with their own hedging ("probably")
      preserved. The evidence base is a single autopsy case, which is recorded in a discussion.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: No rate is established. The condition is described as having a low prevalence that has
    prevented randomised controlled trials, which is a statement about the size of the evidence base as
    much as about occurrence.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The low prevalence of this condition has not allowed for large-scale randomized controlled
      trials.
    explanation: A qualitative rarity statement with no measure attached, which is why the record uses
      measure_type UNKNOWN. It also states the consequence for the treatment evidence in this entry.
pathophysiology:
- name: Ectopic Onconeural Antigen Expression by Tumour
  role: trigger
  biological_scale: MOLECULAR
  description: 'The initiating event, and the reason the disease is paraneoplastic rather than primarily
    neurological. A tumour expresses a protein whose normal expression is restricted to the nervous
    system. For anti-Yo that protein is CDR2, normally found in the cerebellum and ectopically produced
    by tumour cells. The immune system meets a neural antigen in a context where it is not tolerated,
    inside a tumour, and responds to it.'
  downstream:
  - target: Antitumour Immune Response Cross-Reactive with Purkinje Cells
    causal_link_type: DIRECT
    description: The response raised against the tumour antigen is by construction also a response
      against the identical protein in the cerebellum.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The underlying mechanism is believed to be an immunological reaction to cerebellar
      degeneration-related protein 2 (CDR2), a protein usually found in the cerebellum that is
      ectopically produced by tumor cells.
    explanation: States the antigen, its normal restriction to the cerebellum, and its ectopic tumour
      expression - the three facts this node asserts. The source's "believed to be" is preserved.
- name: Antitumour Immune Response Cross-Reactive with Purkinje Cells
  role: central_effector
  biological_scale: CELLULAR
  description: 'The immune response against the onconeural antigen, comprising both a B-cell arm
    (detectable autoantibody) and a T-cell arm. This node is the branch point of the entry: which
    downstream arm carries the injury depends on whether the target antigen is intracellular or on the
    cell surface, and the two arms have different pathology and different reversibility.'
  cell_types:
  - preferred_term: CD8-positive cytotoxic T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  downstream:
  - target: Cytotoxic T Cell-Mediated Purkinje Cell Destruction
    causal_link_type: DIRECT
    hypothesis_groups:
    - pcd_t_cell_mediated_intracellular
    description: Where the antigen is intracellular, only the T-cell arm can engage it, and the
      neuropathology is that of a cytotoxic attack.
  - target: Antibody-Mediated Purkinje Cell Dysfunction
    causal_link_type: DIRECT
    hypothesis_groups:
    - pcd_antibody_mediated_surface
    description: Where the antigen is on the cell surface, the antibody can bind it on a living neuron
      and interfere with its function directly.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although both B- and T-cell abnormalities are seen, there is debate about the relative
      importance of the autoantibodies and cytotoxic T lymphocytes in the neuronal loss.
    explanation: Establishes that both arms of the response are present and that their relative
      contribution is contested, which is why this node branches rather than committing to one effector.
- name: Cytotoxic T Cell-Mediated Purkinje Cell Destruction
  role: central_effector
  biological_scale: TISSUE
  description: 'The anti-Yo arm. Neuropathology shows the full signature of a cytotoxic T-cell attack:
    diffuse and widespread Purkinje cell loss, microglial nodules, CD8-positive granzyme-B-positive T
    cells, and upregulation of MHC class I on neurons, which is what makes a neuron visible to a CD8 T
    cell in the first place. This is cell killing, and it is why the deficit does not recover.'
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  - preferred_term: CD8-positive cytotoxic T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  locations:
  - preferred_term: cerebellar cortex
    term:
      id: UBERON:0002129
      label: cerebellar cortex
  downstream:
  - target: Irreversible Purkinje Cell Loss
    causal_link_type: DIRECT
    hypothesis_groups:
    - pcd_t_cell_mediated_intracellular
    description: Cytotoxic killing removes the cell, and Purkinje cells are not replaced.
  evidence:
  - reference: PMID:36070310
    reference_title: Paraneoplastic Cerebellar Degeneration With P/Q-VGCC vs Yo Autoantibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Anti-Yo-PCD showed characteristic features of a T cell-mediated pathology, whereas this was
      not observed in 1 case of anti-P/Q-VGCC-PCD.
    explanation: The direct neuropathological comparison. Note the source states its own denominator, one
      anti-P/Q-VGCC case, which is why the contrast is curated as a hypothesis rather than settled fact.
- name: Antibody-Mediated Purkinje Cell Dysfunction
  role: central_effector
  biological_scale: TISSUE
  description: 'The surface-antigen arm, seen with anti-P/Q-VGCC. Purkinje cell loss is focal rather than
    diffuse, predominantly affecting the upper vermis while caudal regions and lateral hemispheres are
    spared. There is no MHC class I upregulation and no complement deposition, so this is not a cytotoxic
    attack. The channel itself is downregulated and synaptophysin reduced, and axonal spheroids with
    accumulated amyloid precursor protein and GRP78 indicate endoplasmic reticulum stress and failing
    axonal transport - a picture of neuronal dysfunction preceding neuronal death.'
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  locations:
  - preferred_term: cerebellar cortex
    term:
      id: UBERON:0002129
      label: cerebellar cortex
  downstream:
  - target: Irreversible Purkinje Cell Loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - pcd_antibody_mediated_surface
    description: Sustained dysfunction and calcium dysregulation eventually kill the cell, but the
      intermediate dysfunctional state is what creates a therapeutic window.
  evidence:
  - reference: PMID:36070310
    reference_title: Paraneoplastic Cerebellar Degeneration With P/Q-VGCC vs Yo Autoantibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In contrast, PC loss in anti-P/Q-VGCC-PCD was focal and predominantly affected the upper
      vermis, whereas caudal regions and lateral hemispheres were spared.
    explanation: The topographical difference from the anti-Yo arm, one of the observations arguing that
      the two are different mechanisms rather than one mechanism of differing severity.
  - reference: PMID:36070310
    reference_title: Paraneoplastic Cerebellar Degeneration With P/Q-VGCC vs Yo Autoantibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No complement deposition or MHC-I upregulation was detected. Moreover, synaptophysin was
      reduced, and neuronal P/Q-VGCC was downregulated.
    explanation: The negative findings are the load-bearing part. Absence of MHC class I upregulation is
      what excludes a cytotoxic T-cell mechanism in this arm.
- name: Irreversible Purkinje Cell Loss
  role: consequence
  biological_scale: TISSUE
  description: 'Widespread loss of Purkinje cells, the sole output neuron of the cerebellar cortex.
    Calbindin expression is reduced or lost even in the Purkinje cells that remain, in both arms, so
    surviving cells are not necessarily functional cells. Cerebellar atrophy follows on imaging, though
    it is typically absent early, which is why a normal early MRI does not exclude the diagnosis.'
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  downstream:
  - target: Pancerebellar syndrome
    causal_link_type: DIRECT
    description: Loss of the cerebellar cortex output neuron produces the full cerebellar syndrome.
  - target: Cerebellar atrophy
    causal_link_type: DIRECT
    description: Cell loss becomes visible as volume loss on imaging over time.
  evidence:
  - reference: PMID:36070310
    reference_title: Paraneoplastic Cerebellar Degeneration With P/Q-VGCC vs Yo Autoantibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both PCD types, calbindin expression was reduced or lost in the remaining PCs.
    explanation: Records that surviving Purkinje cells are themselves abnormal, in both arms. It is the
      reason cell counts understate the functional deficit.
  - reference: PMID:36070310
    reference_title: Paraneoplastic Cerebellar Degeneration With P/Q-VGCC vs Yo Autoantibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Paraneoplastic cerebellar degeneration (PCD) is characterized by a widespread loss of
      Purkinje cells (PCs)
    explanation: States Purkinje cell loss as the defining pathological feature of the syndrome.
- name: Pancerebellar syndrome
  role: outcome
  biological_scale: ORGANISM
  description: The clinical endpoint - a subacute pancerebellar deficit that progresses and then
    plateaus, typically within six months. The plateau is itself informative, since it marks the point at
    which the vulnerable cell population has been exhausted rather than the point at which the immune
    response stops.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The typical presentation involves the subacute development of pancerebellar deficits with a
      clinical plateau within 6 months.
    explanation: States the tempo and the plateau, which together define the clinical course.

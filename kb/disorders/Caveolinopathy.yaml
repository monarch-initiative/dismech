inheritance:
- name: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Usually autosomal dominant, with heterozygous missense variants. De novo
    variants occur. Expressivity is variable: one variant can produce rippling,
    limb-girdle weakness, distal myopathy or isolated hyperCKemia in different
    members of one family, and some carriers are asymptomatic into old age.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_a314687e-b35d-4bb4-8b93-efcc83d1fa9b-2022-09-13T160000.000Z
    reference_title: CAV3 / caveolinopathy (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CAV3 | HGNC:1529 | caveolinopathy | MONDO:0016146 | AD | Definitive"
    explanation: ClinGen classifies CAV3-caveolinopathy as definitive with autosomal dominant inheritance.
  - reference: PMID:15318349
    reference_title: Phenotypic variability associated with Arg26Gln mutation in caveolin3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals had either a characteristic RMD phenotype, a combination of RMD and LGMD1C phenotypes, or a LGMD1C phenotype, but one mutation carrier was asymptomatic at age 86 years."
    explanation: One variant gives different phenotypes within a family, and one carrier is asymptomatic at 86, showing variable expressivity and incomplete penetrance.
  - reference: PMID:11756609
    reference_title: A sporadic case of rippling muscle disease caused by a de novo caveolin-3 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors observed a de novo CAV3 missense mutation Arg26Gln."
    explanation: Documents de novo occurrence of a dominant CAV3 variant.
- name: Autosomal recessive inheritance
  description: >-
    Recessive caveolinopathy is rare. The retired GeneReviews chapter records it,
    with heterozygous parents asymptomatic or showing modest hyperCKemia or calf
    hypertrophy. ClinGen has classified only the dominant relationship.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301559
    reference_title: "Caveolinopathies – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most caveolinopathies are inherited in an autosomal dominant manner; they may also be inherited in an autosomal recessive manner."
    explanation: GeneReviews records both dominant and, less often, recessive inheritance.
pathophysiology:
- name: Heterozygous CAV3 missense variant
  biological_scale: MOLECULAR
  description: >-
    Most pathogenic CAV3 variants are missense changes in the N-terminal,
    scaffolding or membrane-spanning regions of caveolin-3. Because CAV3 has only
    two exons, truncating variants are not expected to trigger nonsense-mediated
    decay. ClinGen expects the disease mechanism to be dominant negative.
  genes:
  - preferred_term: CAV3
    term:
      id: hgnc:1529
      label: CAV3
  evidence:
  - reference: CGGV:assertion_a314687e-b35d-4bb4-8b93-efcc83d1fa9b-2022-09-13T160000.000Z
    reference_title: CAV3 / caveolinopathy (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More than 50 pathogenic and likely pathogenic variants reported in humans with clinical phenotypes that form the caveolinopathy spectrum are recorded in ClinVar, most of them being missense variants."
    explanation: ClinGen summary of the variant spectrum.
  - reference: PMID:9537420
    reference_title: Mutations in the caveolin-3 gene cause autosomal dominant limb-girdle muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a missense mutation in the membrane-spanning region and a micro-deletion in the scaffolding domain"
    explanation: The first CAV3 variants found lie in the membrane-spanning and scaffolding domains.
  downstream:
  - target: Mutant caveolin-3 Golgi retention and sequestration of wild-type protein
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12839838
      reference_title: "Phenotypic behavior of caveolin-3 R26Q, a mutant associated with hyperCKemia, distal myopathy, and rippling muscle disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we show that the caveolin-3 R26Q mutant is mostly retained at the level of the Golgi complex."
      explanation: A recurrent CAV3 missense protein is retained in the Golgi in cultured cells.
  - target: Mutant caveolin-3 increase of cardiac late sodium current
    causal_link_type: DIRECT
    description: Reported only for variants found in long QT patients, in heterologous cells.
    evidence:
    - reference: PMID:17060380
      reference_title: Mutant caveolin-3 induces persistent late sodium current and is associated with long-QT syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "mutant caveolin-3 results in a 2- to 3-fold increase in late sodium current compared with wild-type caveolin-3"
      explanation: Heterologous expression of the LQT-associated variants increases late sodium current.
- name: Mutant caveolin-3 Golgi retention and sequestration of wild-type protein
  biological_scale: MOLECULAR
  description: >-
    Mutant caveolin-3 forms abnormal oligomers that are retained in the Golgi
    apparatus and are excluded from caveolae. In the dominant-negative model the
    mutant protein also traps wild-type caveolin-3 in the Golgi. For the R26Q
    allele one cell study instead proposed haploinsufficiency, so the dominance
    mechanism may differ between variants.
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:14981167
    reference_title: "Caveolinopathies: mutations in caveolin-3 cause four distinct autosomal dominant muscle diseases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A mutation in one caveolin-3 allele produces an aberrant protein product capable of sequestering the normal caveolin-3 protein in the Golgi apparatus of skeletal muscle cells."
    explanation: Review statement of the dominant-negative sequestration model.
  - reference: PMID:12839838
    reference_title: "Phenotypic behavior of caveolin-3 R26Q, a mutant associated with hyperCKemia, distal myopathy, and rippling muscle disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The caveolin-3 R26Q mutant formed oligomers of a much larger size than wild-type caveolin-3 and was excluded from caveolae-enriched membranes."
    explanation: Abnormal oligomerization and exclusion from caveolae of a mutant caveolin-3.
  - reference: PMID:12839838
    reference_title: "Phenotypic behavior of caveolin-3 R26Q, a mutant associated with hyperCKemia, distal myopathy, and rippling muscle disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We propose a haploinsufficiency model in which reduced levels of wild-type caveolin-3, although not rendered dysfunctional due to the caveolin-3 R26Q mutant protein, are insufficient for normal muscle cell function."
    explanation: The alternative haploinsufficiency model proposed for R26Q.
  - reference: CGGV:assertion_a314687e-b35d-4bb4-8b93-efcc83d1fa9b-2022-09-13T160000.000Z
    reference_title: CAV3 / caveolinopathy (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism for disease is expected to be dominant negative."
    explanation: ClinGen's expected mechanism for the gene-disease relationship.
  downstream:

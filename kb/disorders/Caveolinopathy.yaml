  description: >-
    Reduced sarcolemmal caveolin-3 points to a primary caveolinopathy.
    Immunoblotting is more sensitive than immunostaining. A reduced caveolin-3
    alone does not exclude CAVIN1 disease, which also lowers it.
  evidence:
  - reference: PMID:27312022
    reference_title: "CAV3 mutations causing exercise intolerance, myalgia and rhabdomyolysis: Expanding the phenotypic spectrum of caveolinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our series, immunoblotting was a more sensitive method to detect reduced caveolin-3 levels than immunohistochemistry in skeletal muscle."
    explanation: Immunoblotting detects reductions missed by immunostaining.
  - reference: PMID:26185955
    reference_title: Caveolinopathies in Greece.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemical study of caveolin-3 expression on muscle biopsy should be routinely performed when investigating isolated hyperCKemia or undetermined myopathy especially in the presence of percussion-induced muscle mounding."
    explanation: Recommends caveolin-3 immunostaining in hyperCKemia or undetermined myopathy.
- name: CAV3 sequencing
  description: Sequencing of both CAV3 exons, or a neuromuscular gene panel, confirms the diagnosis.
  evidence:
  - reference: PMID:20301559
    reference_title: "Caveolinopathies – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Sequence analysis identifies pathogenic variants in more than 99% of affected individuals."
    explanation: Diagnostic yield of CAV3 sequence analysis from the retired GeneReviews chapter.
differential_diagnoses:
- name: Immune-mediated rippling muscle disease
  description: >-
    Acquired rippling muscle disease shares percussion-induced hyperexcitability
    and abnormal caveolin-3 immunostaining, but is autoimmune.
  distinguishing_features:
  - Anti-cavin-4 antibodies.
  - Mosaic rather than uniformly reduced caveolin-3 and cavin-4 immunostaining.
  disease_term:
    preferred_term: acquired rippling muscle disease
    term:
      id: MONDO:0021142
      label: acquired rippling muscle disease
  evidence:
  - reference: PMID:39370631
    reference_title: The spectrum of rippling muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Anti-cavin-4 antibodies are the serological marker while the mosaic expression of caveolin-3 and cavin-4 is the pathological feature of iRMD."
    explanation: Serological and biopsy features separating immune-mediated rippling muscle disease from CAV3 disease.
- name: CAVIN1-related congenital generalized lipodystrophy type 4
  description: >-
    Recessive CAVIN1 (PTRF) disease causes secondary caveolin-3 reduction and
    muscle hyperexcitability.
  distinguishing_features:
  - Congenital generalized lipodystrophy and extra-muscular manifestations.
  - Absent or reduced cavin-1 immunostaining.
  disease_term:
    preferred_term: congenital generalized lipodystrophy type 4
    term:
      id: MONDO:0013225
      label: congenital generalized lipodystrophy type 4
  evidence:
  - reference: PMID:39370631
    reference_title: The spectrum of rippling muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Muscle cavin-1/PTRF immunoreactivity is absent or reduced while caveolin-3 immunoreactivity is reduced, often in a patchy way, in CAVIN1/PTRF-RMD."
    explanation: CAVIN1 disease also reduces caveolin-3 on biopsy.
treatments:
- name: Physical therapy
  description: >-
    No disease-modifying therapy exists. Supportive physical therapy and
    stretching to maintain mobility and prevent contractures were recommended in
    the retired GeneReviews chapter. The same chapter advised anesthetic
    precautions in isolated hyperCKemia because of a possible malignant
    hyperthermia risk.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:20301559
    reference_title: "Caveolinopathies – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "physical therapy and stretching exercises to promote mobility and prevent contractures"
    explanation: Supportive management recommendation.
  - reference: PMID:20301559
    reference_title: "Caveolinopathies – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In individuals with isolated HCK, special precautions during surgical procedures and anesthesia because of possible risk for malignant hyperthermia (MH)."
    explanation: Anesthetic precaution recorded in the retired chapter.
animal_models:
- name: Cav3 knockout mouse
  species: Mouse
  genotype: Cav3-/-
  publication: PMID:42639979
  genes:
  - preferred_term: Cav3
    term:
      id: MGI:107570
      label: Cav3
  description: >-
    Mice lacking caveolin-3 lose caveolae and develop T-tubule disorganization,
    skeletal muscle weakness and a cardiomyopathy.
  modeled_mechanisms:
  - target: T-tubule system disorganization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      Complete loss of caveolin-3 rather than the heterozygous missense variants
      that cause human disease.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The model is a homozygous null, while patients are mostly heterozygous for
        a missense allele thought to act dominant-negatively, so the residual
        caveolin-3 present in patients is absent from the model.
    evidence:
    - reference: PMID:42639979
      reference_title: BIN1 overexpression rescues cardiac but not skeletal muscle defects in a mouse model of caveolinopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found Cav-3-/- mice displayed skeletal muscle weakness, T-tubule disorganization, and mitochondrial abnormalities, alongside cardiac diastolic dysfunction and myofibrillar disarray."
      explanation: The knockout shows the T-tubule node with weakness.
  - target: Cardiac caveolin-3 loss and hypertrophic signaling
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      Progressive cardiomyopathy is consistent in the null mouse but rare in
      patients with caveolinopathy.
    evidence:
    - reference: PMID:12138167
      reference_title: Caveolin-3 knock-out mice develop a progressive cardiomyopathy and show hyperactivation of the p42/44 MAPK cascade.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that these mice develop a progressive cardiomyopathic phenotype."
      explanation: The knockout develops cardiomyopathy.

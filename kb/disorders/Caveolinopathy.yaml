    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Almost all (87%) of the biopsies were abnormal but without any specific pattern."
    explanation: Myopathic biopsy change in most patients of a 23-patient cohort.
  downstream:

notes: >-
  Scope. This entry follows ClinGen, which lumps the allelic CAV3 phenotypes
  under caveolinopathy because they share inheritance, phenotype and molecular
  mechanism, and records the named presentations as has_subtypes. The
  Tateyama distal myopathy is curated in full in its own entry and appears here
  only as a pointer subtype. The GeneReviews caveolinopathies chapter
  (PMID:20301559) is retired; it is kept as the only expert-curated summary of
  the spectrum, and the phenotype baseline otherwise comes from the 2023
  multicenter cohort (PMID:37166430) and the series cited per phenotype.

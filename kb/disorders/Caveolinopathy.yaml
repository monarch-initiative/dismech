- name: HCM
  display_name: CAV3-associated hypertrophic cardiomyopathy
  description: >-
    Hypertrophic cardiomyopathy without skeletal muscle manifestations was
    reported in two siblings carrying CAV3 p.Thr63Ser, a variant that only mildly
    reduced cell-surface caveolin-3. ClinGen names familial hypertrophic
    cardiomyopathy among the OMIM entities it lumps under caveolinopathy, but the
    human evidence for a cardiac-only CAV3 presentation remains a small number of
    families. MONDO has no CAV3-specific hypertrophic cardiomyopathy term.
  genes:
  - preferred_term: CAV3
    term:
      id: hgnc:1529
      label: CAV3
  evidence:
  - reference: PMID:14672715
    reference_title: Identification and functional analysis of a caveolin-3 mutation associated with familial hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A Thr63Ser mutation was identified in a sibling case of HCM."
    explanation: The family report on which the CAV3 hypertrophic cardiomyopathy association rests.
  - reference: PMID:20301559
    reference_title: "Caveolinopathies – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hypertrophic cardiomyopathy (HCM), without skeletal muscle manifestations."
    explanation: GeneReviews lists cardiac-only HCM as one of the caveolinopathy phenotypes.
- name: LQT9
  display_name: Long QT syndrome 9
  subtype_term:
    preferred_term: long QT syndrome 9
    term:
      id: MONDO:0012736
      label: long QT syndrome 9
  description: >-
    Four CAV3 missense variants were found among 905 unrelated patients referred
    for long QT genetic testing, and in heterologous cells the mutant proteins
    raised late sodium current through Nav1.5. ClinGen's Long QT Syndrome panel
    rates CAV3 Limited for long QT syndrome (MONDO:0002442), while its muscular
    dystrophy panel lumps long QT syndrome 9 into caveolinopathy. The arrhythmia
    association is therefore weakly supported. The Long_QT_Syndrome entry also
    lists this subtype (as Type 9) and does not curate a mechanism for it.
  genes:
  - preferred_term: CAV3
    term:
      id: hgnc:1529
      label: CAV3
  evidence:
  - reference: PMID:17060380
    reference_title: Mutant caveolin-3 induces persistent late sodium current and is associated with long-QT syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed open reading frame/splice site mutational analysis on CAV3 in 905 unrelated patients referred for LQTS genetic testing"
    explanation: The screening study behind the LQT9 designation.
  - reference: CGGV:assertion_74aabddc-3402-46de-ba1e-f66aa273cd9c-2020-12-15T002855.870Z
    reference_title: "CAV3 / long QT syndrome (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CAV3 | HGNC:1529 | long QT syndrome | MONDO:0002442 | AD | Limited"
    explanation: >-
      ClinGen grades the CAV3-long QT syndrome relationship Limited, which
      supports the statement that the arrhythmia association is weakly
      supported. It is not recorded as gene_disease_validity here because its
      disease term is long QT syndrome, not this entry or this subtype.

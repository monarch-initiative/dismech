      explanation: Golgi-retained caveolin-3 mutants redistribute dysferlin to the Golgi.
- name: Sarcolemmal caveolin-3 deficiency and caveolae loss
  biological_scale: CELLULAR
  description: >-
    Caveolin-3 is reduced at the sarcolemma and caveolae are lost from the muscle
    fiber surface. Caveolin-3 deficiency is a sensitive and specific biopsy marker
    of primary caveolinopathy, although immunostaining can look normal when
    immunoblotting shows a reduction. With caveolin-3 absent, its scaffolding of
    signalling partners at the sarcolemma is lost.

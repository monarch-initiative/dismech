- name: Cardiac caveolin-3 loss and hypertrophic signaling
  biological_scale: CELLULAR
  description: >-
    Caveolin-3 is also the caveolin of cardiomyocytes. Cav3 knockout mice develop
    a progressive cardiomyopathy with cardiomyocyte hypertrophy, fibrosis and
    hyperactivated ERK1/2 signaling, and a CAV3 variant found in familial
    hypertrophic cardiomyopathy reduces cell-surface caveolin-3. No patient in a
    23-patient skeletal-muscle caveolinopathy cohort had cardiac impairment, so
    cardiac involvement in human disease is uncommon.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    modifier: INCREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  evidence:
  - reference: PMID:12138167
    reference_title: Caveolin-3 knock-out mice develop a progressive cardiomyopathy and show hyperactivation of the p42/44 MAPK cascade.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that p42/44 MAPK (ERK1/2) is hyperactivated in hearts derived from Cav-3 knock-out mice."
    explanation: ERK1/2 hyperactivation in caveolin-3-deficient heart.
  - reference: PMID:14672715
    reference_title: Identification and functional analysis of a caveolin-3 mutation associated with familial hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It was observed that the Thr63Ser mutation reduced the cell surface expression of caveolin-3, albeit the change was mild as compared with the LGMD mutations."
    explanation: The HCM-associated variant reduces surface caveolin-3 in transfected cells, mildly.
  - reference: PMID:37166430
    reference_title: "Caveolinopathy: Clinical, histological, and muscle imaging features and follow-up in a multicenter retrospective cohort."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No patient had cardiac or respiratory impairment."
    explanation: >-
      Refutes cardiac involvement as a usual feature of skeletal-muscle
      caveolinopathy: none of 23 patients followed for a mean of 24 years had
      cardiac impairment.
  downstream:
  - target: Hypertrophic cardiomyopathy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12138167
      reference_title: Caveolin-3 knock-out mice develop a progressive cardiomyopathy and show hyperactivation of the p42/44 MAPK cascade.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Taken together, our data argue that loss of Cav-3 expression is sufficient to induce a molecular program leading to cardiac myocyte hypertrophy and cardiomyopathy."
      explanation: Caveolin-3 loss is sufficient for cardiomyocyte hypertrophy in mice; indirect for the human phenotype.
- name: Mutant caveolin-3 increase of cardiac late sodium current
  biological_scale: CELLULAR
  description: >-
    Caveolin-3 variants found in long QT patients increased late sodium current
    two- to three-fold through the cardiac sodium channel Nav1.5 in heterologous
    cells, resembling LQT3. This rests on one screening and expression study, and
    ClinGen grades the CAV3-long QT relationship Limited.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: late sodium current
    modifier: INCREASED
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
  evidence:
  - reference: PMID:17060380
    reference_title: Mutant caveolin-3 induces persistent late sodium current and is associated with long-QT syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we provide functional data demonstrating a gain-of-function increase in late sodium current"
    explanation: Functional data for increased late sodium current with mutant caveolin-3.
  downstream:
  - target: Prolonged QT interval
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Inferred from the LQT3-like current; not shown in patient myocardium.

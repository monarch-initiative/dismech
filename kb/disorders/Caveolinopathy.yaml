- Hereditary neurological disease
has_subtypes:
- name: LGMD1C
  display_name: Limb-girdle muscular dystrophy 1C
  description: >-
    Mild to moderate proximal weakness with onset usually in the first decade,
    calf hypertrophy, a positive Gowers sign and variable exercise-related
    cramps, with severe caveolin-3 deficiency in muscle. MONDO and OMIM no longer
    keep LGMD1C as a separate entity: MONDO lists it as a synonym of rippling
    muscle disease 2 (MONDO:0019947) and Orphanet has moved ORPHA:265 into
    ORPHA:97238, so this row carries no subtype_term of its own.
  genes:
  - preferred_term: CAV3
    term:
      id: hgnc:1529
      label: CAV3
  evidence:
  - reference: PMID:9537420
    reference_title: Mutations in the caveolin-3 gene cause autosomal dominant limb-girdle muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe eight patients from two different families with a new form of autosomal dominant LGMD, which we propose to call LGMD1C, associated with a severe deficiency of caveolin-3 in muscle fibres."
    explanation: Original description of LGMD1C as a CAV3 caveolin-3-deficient dominant muscular dystrophy.
  - reference: PMID:20301559
    reference_title: "Caveolinopathies – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Limb-girdle muscular dystrophy 1C (LGMD1C), characterized by onset usually in the first decade, mild-to-moderate proximal muscle weakness, calf hypertrophy, positive Gower sign, and variable muscle cramps after exercise."
    explanation: GeneReviews phenotype summary for the LGMD1C presentation.
  - reference: ORPHA:97238
    reference_title: Rippling muscle disease
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ORPHA:265 | Autosomal dominant limb-girdle muscular dystrophy type 1C | Moved to | ORPHA:97238 | Rippling muscle disease"
    explanation: Orphanet has merged its LGMD1C record into rippling muscle disease, which is why this row has no separate disease term.
- name: RMD2
  display_name: Rippling muscle disease 2
  subtype_term:
    preferred_term: rippling muscle disease 2
    term:
      id: MONDO:0019947
      label: rippling muscle disease 2
  description: >-
    Mechanical hyperirritability of skeletal muscle: percussion-induced rapid
    contractions, percussion-induced muscle mounding and electrically silent
    rolling contractions (rippling), often with muscle hypertrophy, stiffness and
    raised creatine kinase. Weakness is minor or absent and the course is
    usually benign and non-progressive. MONDO's term also carries the LGMD1C
    synonyms, but this row is scoped to the rippling presentation.
  genes:
  - preferred_term: CAV3
    term:
      id: hgnc:1529
      label: CAV3
  evidence:
  - reference: PMID:11431690
    reference_title: Mutations in CAV3 cause mechanical hyperirritability of skeletal muscle in rippling muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found missense mutations in positional candidate CAV3 (encoding caveolin 3; ref. 5) in all five families analyzed."
    explanation: Identifies CAV3 missense variants as the cause of hereditary rippling muscle disease.
  - reference: PMID:20229577
    reference_title: Bedside diagnosis of rippling muscle disease in CAV3 p.A46T mutation carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype in these 23 cases of RMD with this mutation appears to be homogenous, benign, and nonprogressive."
    explanation: Large family series showing a benign, non-progressive rippling phenotype.
- name: HyperCKemia
  display_name: Isolated hyperCKemia due to CAV3 variants
  subtype_term:
    preferred_term: creatine phosphokinase, elevated serum
    term:
      id: MONDO:0007402
      label: creatine phosphokinase, elevated serum
  description: >-
    Persistently raised serum creatine kinase without muscle weakness, with
    partial caveolin-3 deficiency on biopsy. Bound to MONDO:0007402 (OMIM 123320),
    which MONDO links to CAV3. The broader MONDO:0016103 (isolated asymptomatic
    elevation of creatine phosphokinase), which MONDO places under caveolinopathy,
    is deliberately not bound: it carries no causal gene and MONDO also places it
    under dystrophinopathy.
  genes:
  - preferred_term: CAV3
    term:
      id: hgnc:1529
      label: CAV3
  evidence:
  - reference: PMID:10746614
    reference_title: Mutation in the CAV3 gene causes partial caveolin-3 deficiency and hyperCKemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors report a novel sporadic mutation in the CAV3 gene in two unrelated children with persistent elevated levels of serum creatine kinase (hyperCKemia) without muscle weakness."
    explanation: First report of CAV3 variants causing isolated hyperCKemia.
  - reference: PMID:15099591
    reference_title: A novel mutation in the caveolin-3 gene causing familial isolated hyperCKaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three members of a family were known to have persistent elevated serum CK levels without muscle weakness."
    explanation: Familial isolated hyperCKemia with a heterozygous CAV3 variant.

name: Caveolinopathy
creation_date: "2026-11-24T16:13:12Z"
category: Mendelian
synonyms:
- caveolinopathies
- qualitative or quantitative defects of caveolin-3
- caveolin-3 deficiency
description: >-
  Caveolinopathy is the allelic spectrum of muscle disease caused by pathogenic
  variants in CAV3, which encodes caveolin-3, the muscle-specific structural
  protein of sarcolemmal caveolae. Inheritance is usually autosomal dominant and
  most variants are missense. The clinical presentations overlap and can occur
  in different members of one family: limb-girdle muscular dystrophy 1C (LGMD1C),
  rippling muscle disease (RMD), isolated hyperCKemia, Tateyama-type distal
  myopathy, and an exercise-intolerance, myalgia and rhabdomyolysis presentation.
  Hypertrophic cardiomyopathy and long QT syndrome 9 have also been reported with
  CAV3 variants, but the cardiac associations rest on few families. Across the
  spectrum, mutant caveolin-3 is retained in the Golgi apparatus and sequesters
  the wild-type protein, so caveolin-3 is reduced at the sarcolemma and caveolae
  are lost. The muscle then cannot buffer membrane tension, membrane repair and
  T-tubule organization are disturbed, and serum creatine kinase is raised in
  almost all symptomatic patients. Reduced caveolin-3 on muscle biopsy, best
  shown by immunoblotting, and CAV3 sequencing establish the diagnosis. Most
  patients have limited functional impairment and there is no disease-modifying
  treatment.

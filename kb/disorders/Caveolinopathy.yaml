- name: Defective sarcolemmal membrane repair
  biological_scale: CELLULAR
  conforms_to: "sarcolemmal_fragility_myofiber_necrosis#Sarcolemmal Membrane Repair Failure"
  description: >-
    Sarcolemmal lesions fail to reseal because the MG53, dysferlin and
    caveolin-3 repair complex is disrupted. The dystrophin-glycoprotein complex
    is not the primary defect, so caveolinopathy enters the shared dystrophic
    chain through the membrane-repair arm. The supporting work is in cells.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: plasma membrane repair
    modifier: DECREASED
    term:
      id: GO:0001778
      label: plasma membrane repair
  evidence:
  - reference: PMID:19380584
    reference_title: "Membrane repair defects in muscular dystrophy are linked to altered interaction between MG53, caveolin-3, and dysferlin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in Cav3 (P104L, R26Q) that cause retention of Cav3 in Golgi apparatus result in aberrant localization of MG53 and dysferlin in a dominant-negative fashion, leading to defective membrane repair."
    explanation: Defective membrane repair with Golgi-retained caveolin-3 mutants.
  downstream:
  - target: Myofiber damage and myopathic change
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Unrepaired membrane lesions are proposed to contribute to fiber damage; repair has not been measured in patient muscle.
- name: Impaired caveolar mechanoprotection
  biological_scale: CELLULAR
  description: >-
    Caveolae act as a membrane reservoir that flattens to buffer tension. In
    patient myotubes lacking caveolae the membrane cannot buffer mechanical
    stress, and IL6/STAT3 signaling becomes constitutively hyperactivated. In
    zebrafish, a dystrophy-associated caveolin-3 mutant causes sarcolemmal damage
    only under vigorous muscle activity, which fits the exercise intolerance,
    myalgia and rhabdomyolysis seen in some patients.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:31036801
    reference_title: Dystrophy-associated caveolin-3 mutations reveal that caveolae couple IL6/STAT3 signaling with mechanosensing in human muscle cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This results in impaired regulation of the IL6/STAT3 signaling pathway leading to its constitutive hyperactivation and increased expression of muscle genes."
    explanation: Signaling consequence of failed mechanoprotection in patient myotubes.
  downstream:
  - target: Myofiber damage and myopathic change
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26323694
      reference_title: The caveolin-cavin system plays a conserved and critical role in mechanoprotection of skeletal muscle.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "In vivo imaging of live zebrafish embryos revealed that loss of muscle-specific Cavin-1 or expression of a dystrophy-associated Caveolin-3 mutant both led to sarcolemmal damage but only in response to vigorous muscle activity."
      explanation: A dystrophy-associated caveolin-3 mutant causes activity-dependent sarcolemmal damage in zebrafish; indirect because of the species.
- name: T-tubule system disorganization
  biological_scale: CELLULAR
  description: >-
    Caveolin-3 deficiency is associated with derangement of the T-tubule system,
    sarcolemmal membrane alterations and subsarcolemmal vesicles, in human LGMD1C
    muscle and in caveolin-3 null mice.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: T-tubule organization
    modifier: ABNORMAL
    term:
      id: GO:0033292
      label: T-tubule organization
  evidence:
  - reference: PMID:14981167
    reference_title: "Caveolinopathies: mutations in caveolin-3 cause four distinct autosomal dominant muscle diseases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Improper caveolin-3 oligomerization and membrane localization result in skeletal muscle T-tubule system derangement, sarcolemmal membrane alterations, and large subsarcolemmal vesicle formation."
    explanation: Review synthesis linking caveolin-3 mislocalization to T-tubule derangement.
  - reference: PMID:11259414
    reference_title: "Caveolin-3 null mice show a loss of caveolae, changes in the microdomain distribution of the dystrophin-glycoprotein complex, and t-tubule abnormalities."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "abnormalities in the organization of the T-tubule system, with dilated and longitudinally oriented T-tubules"
    explanation: T-tubule abnormalities in caveolin-3 null mice.
  - reference: PMID:42639979
    reference_title: BIN1 overexpression rescues cardiac but not skeletal muscle defects in a mouse model of caveolinopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found Cav-3-/- mice displayed skeletal muscle weakness, T-tubule disorganization, and mitochondrial abnormalities, alongside cardiac diastolic dysfunction and myofibrillar disarray."
    explanation: Independent confirmation of T-tubule disorganization with skeletal muscle weakness in Cav3 knockout mice.
  downstream:
  - target: Myofiber damage and myopathic change
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: How T-tubule disorganization contributes to weakness has not been shown directly.
- name: Muscle mechanical hyperexcitability
  biological_scale: CELLULAR
  description: >-
    Skeletal muscle contracts in response to percussion, stretch or movement
    without accompanying electrical activity on EMG. This is the defining
    feature of rippling muscle disease and is common across the caveolinopathy
    spectrum.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:11431690
    reference_title: Mutations in CAV3 cause mechanical hyperirritability of skeletal muscle in rippling muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary rippling muscle disease (RMD) is an autosomal dominant human disorder characterized by mechanically triggered contractions of skeletal muscle."
    explanation: Mechanically triggered contraction defines the rippling phenotype.
  downstream:
  - target: Percussion-induced rapid rolling muscle contractions
    causal_link_type: DIRECT
  - target: Muscle mounding
    causal_link_type: DIRECT
- name: Myofiber damage and myopathic change
  biological_scale: TISSUE
  description: >-
    Skeletal muscle shows myopathic or dystrophic change of variable severity,
    with fiber-size variability and fatty involvement on imaging, and creatine
    kinase leaks into serum. Biopsies are almost always abnormal but without a
    specific pattern.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:

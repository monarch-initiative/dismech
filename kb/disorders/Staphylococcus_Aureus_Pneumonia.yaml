    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In addition, PVL-positive CAP patients were more likely to present with
      septic shock, leukopenia, elevated blood lactate and Sequential Organ
      Failure Assessment (SOFA) severity score, and to require extracorporeal
      membrane oxygenation (ECMO).
    explanation: >-
      Identifies septic shock at admission as enriched among PVL-positive severe
      community-acquired S. aureus pneumonia cases.
- name: Pulmonary Hemorrhage
  category: Respiratory
  phenotype_term:
    preferred_term: Pulmonary hemorrhage
    term:
      id: HP:0040223
      label: Pulmonary hemorrhage
  evidence:
  - reference: PMID:42501530
    reference_title: >-
      Fatal septic shock due to PVL-positive Staphylococcus aureus necrotizing
      pneumonia: autopsy findings and systematic review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most cases were characterized by rapid clinical deterioration, frequent
      septic shock, and hemoptysis or pulmonary hemorrhage.
    explanation: >-
      Supports pulmonary hemorrhage as part of the fatal PVL-positive
      necrotizing pneumonia clinicopathologic pattern.
- name: Respiratory Failure

review_notes: >-
  Deliberately lumped. This entry keeps methicillin-susceptible and
  methicillin-resistant S. aureus pneumonia, post-influenza community-acquired
  necrotizing pneumonia, and hospital- or ventilator-associated staphylococcal
  pneumonia together because MONDO:0041879 names the organism-specific
  pneumonia and the shared S. aureus lower-airway cytolysin/quorum-sensing
  pathograph applies across those clinical contexts. It remains split from
  generic bacterial pneumonia, other organism-specific pneumonias, and
  nonpulmonary S. aureus diseases whose acquisition route and tissue-level
  pathographs differ.

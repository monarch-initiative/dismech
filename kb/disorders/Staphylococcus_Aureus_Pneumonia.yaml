    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      PVL-positive S. aureus pneumonia represents a rare but highly aggressive
      infection that may rapidly progress to respiratory failure and death.
    explanation: >-
      Supports respiratory failure as a severe endpoint of PVL-positive
      necrotizing S. aureus pneumonia.

progression:
- phase: Post-viral fulminant community-acquired necrotizing pneumonia
  notes: >-
    PVL-positive community-acquired S. aureus pneumonia often follows an
    influenza-like prodrome and can progress from symptom onset to death within
    days when the infection is fulminant.
  evidence:
  - reference: PMID:21051855
    reference_title: >-
      Factors associated with the outcome of life-threatening necrotizing
      pneumonia due to community-acquired Staphylococcus aureus in adult and
      adolescent patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      S. aureus community-acquired pneumonia (CAP) with usually PVL-positive
      strains is a severe disease with significant lethality, i.e. 42.9%; a
      short duration of the time from the onset of symptoms to death, i.e. 5.5 ±
      10.1 days
    explanation: >-
      Quantifies the fulminant tempo of life-threatening usually PVL-positive
      community-acquired S. aureus pneumonia.
- phase: Ventilator-associated onset
  notes: >-
    In mechanically ventilated ICU patients, S. aureus can emerge as a leading
    organism recovered from ventilator-associated events around the first week
    of ventilation.
  evidence:
  - reference: PMID:24709718
    reference_title: Descriptive epidemiology and attributable morbidity of ventilator-associated events.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The median number of days to VAC onset was 6 (interquartile range, 4-11).
    explanation: >-
      Supports approximately first-week onset for ventilator-associated
      conditions in the CDC ventilator-associated-events cohort.

prevalence:
- population: Ventilator-associated pneumonia in recent HAP/VAP epidemiology
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    VAP occurs at 2-16 episodes per 1000 ventilator-days, and S. aureus is among
    the most frequent HAP/VAP pathogens. This record captures the care-context
    incidence for ventilator-associated pneumonia rather than a population
    incidence for organism-specific S. aureus pneumonia.
  evidence:
  - reference: PMID:23524477
    reference_title: >-
      Hospital-acquired pneumonia and ventilator-associated pneumonia: recent
      advances in epidemiology and management.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The current incidence of VAP ranges from two to 16 episodes for 1000
      ventilator-days, with an attributable mortality of 3-17%.
    explanation: >-
      Provides a ventilator-associated pneumonia incidence range for the
      healthcare-associated setting that includes S. aureus pneumonia.
- population: CDC ventilator-associated event cohort
  measure_type: PERIOD_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    In the CDC ventilator-associated-event cohort, S. aureus was the most
    frequent probable-pneumonia organism at 29% of microbiology-positive
    probable pneumonia events.
  evidence:
  - reference: PMID:24709718
    reference_title: Descriptive epidemiology and attributable morbidity of ventilator-associated events.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The most frequently isolated organisms were Staphylococcus aureus (29%),
      Pseudomonas aeruginosa (14%), and Enterobacter species (7.9%).
    explanation: >-
      Quantifies the S. aureus fraction among recovered organisms in the CDC
      ventilator-associated-events cohort.

diagnosis:
- name: MRSA nasal PCR rule-out test
  description: >-
    Nasal-swab MRSA PCR has a high negative predictive value for MRSA pneumonia
    in low-prevalence pneumonia populations, so a negative result can guide
    de-escalation of empiric anti-MRSA therapy while cultures are pending.
  evidence:
  - reference: PMID:24277023
    reference_title: Predictive value of methicillin-resistant Staphylococcus aureus (MRSA) nasal swab PCR assay for MRSA pneumonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The MRSA PCR assay demonstrated 88.0% sensitivity and 90.1% specificity,
      with a positive predictive value of 35.4% and a negative predictive value
      of 99.2%.
    explanation: >-
      Quantifies the operating characteristics of nasal PCR for predicting MRSA
      pneumonia.
- name: Bronchoalveolar lavage culture protocol
  description: >-
    Quantitative lower-respiratory culture from bronchoalveolar lavage can
    identify VAP causative organisms and guide directed therapy when ventilated
    patients are suspected to have bacterial pneumonia.
  evidence:
  - reference: PMID:22310133
    reference_title: >-
      Differences in management and mortality with a bronchoalveolar
      lavage-based diagnostic protocol for ventilator-associated pneumonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Methicillin-sensitive Staphylococcus aureus was the most common causative
      organism.
    explanation: >-
      Demonstrates that BAL-based VAP diagnosis recovered S. aureus as a
      causative lower-respiratory organism in the protocol cohort.

treatments:
- name: MRSA-active antibiotic therapy
  description: >-
    Hospital-acquired or nosocomial MRSA pneumonia is treated with active
    antibiotics such as linezolid or vancomycin, which lower the viable
    bacterial burden.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: vancomycin
      term:
        id: CHEBI:28001
        label: vancomycin
    - preferred_term: linezolid
      term:
        id: CHEBI:63607
        label: linezolid
  target_mechanisms:
  - target: Lower Airway Staphylococcus aureus Seeding
    treatment_effect: INHIBITS
    description: >-
      MRSA-active antibiotics kill or inhibit the lower-airway S. aureus burden
      before quorum-regulated toxin production can amplify lung injury.
  evidence:
  - reference: PMID:36852899
    reference_title: >-
      A 600 mg of fixed-dose linezolid in renally impaired patients versus 15 mg/kg
      intermittent dose-optimized vancomycin in renally non-impaired patients: A
      single centre retrospective analysis for adult patients with hospital-acquired
      pneumonia due to methicillin-resistant Staphylococcus aureus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Both linezolid and vancomycin are approved by USFDA and IDSA guidelines
      for the management of nosocomial pneumonia due to methicillin-resistant
      Staphylococcus aureus (MRSA) in clinical practice.
    explanation: >-
      Identifies linezolid and vancomycin as MRSA pneumonia therapies in the
      clinical setting.
- name: MSSA beta-lactam therapy
  description: >-
    Methicillin-susceptible S. aureus pneumonia is treated with an active
    anti-staphylococcal beta-lactam such as cefazolin, nafcillin, or oxacillin
    once MSSA is established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: cefazolin
      term:
        id: CHEBI:474053
        label: cefazolin
    - preferred_term: nafcillin
      term:
        id: CHEBI:7447
        label: nafcillin
    - preferred_term: oxacillin
      term:
        id: CHEBI:7809
        label: oxacillin
  target_mechanisms:
  - target: Lower Airway Staphylococcus aureus Seeding
    treatment_effect: INHIBITS
    description: >-
      MSSA-active beta-lactams lower the susceptible S. aureus burden that
      initiates lower-airway disease.
  evidence:
  - reference: PMID:40349971
    reference_title: >-
      Cefazolin vs. antistaphylococcal penicillins for the treatment of
      methicillin-susceptible Staphylococcus aureus bacteraemia: a systematic
      review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      There is debate on whether cefazolin or antistaphylococcal penicillins
      should be the first-line treatment for methicillin-susceptible
      Staphylococcus aureus (MSSA) bacteraemia.
    explanation: >-
      Supports cefazolin and anti-staphylococcal penicillins as the active
      beta-lactam options for invasive MSSA disease.
- name: Toxin-suppressing antibiotic therapy
  description: >-
    Protein-synthesis inhibitors such as linezolid or clindamycin are used when
    toxin suppression is desired in necrotizing community-associated MRSA
    pneumonia.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: linezolid
      term:
        id: CHEBI:63607
        label: linezolid
    - preferred_term: clindamycin
      term:
        id: CHEBI:3745
        label: clindamycin
  target_mechanisms:
  - target: Agr Quorum-Sensing Virulence Activation
    treatment_effect: MODULATES
    description: >-
      Toxin-suppressing regimens are intended to damp secreted cytolysin
      production while active antimicrobial therapy reduces bacterial burden.
  evidence:
  - reference: PMID:21051855
    reference_title: >-
      Factors associated with the outcome of life-threatening necrotizing
      pneumonia due to community-acquired Staphylococcus aureus in adult and
      adolescent patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Antibiotic therapies inhibiting toxin production were associated with an
      improved outcome in these cases (p = 0.007).
    explanation: >-
      Associates toxin-inhibiting antimicrobial regimens with improved outcomes
      in a review of life-threatening, usually PVL-positive community-acquired
      S. aureus pneumonia.
  - reference: PMID:21722847
    reference_title: >-
      Pulmonary infections and community associated methicillin resistant
      Staphylococcus aureus: a dangerous mix?
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Linezolid and clindamycin have also been used in the treatment of CA-MRSA
      pneumonia and ongoing research is looking for alternative antimicrobials.
    explanation: >-
      Names linezolid and clindamycin as drugs used for community-associated
      MRSA pneumonia.
- name: Anti-alpha-toxin monoclonal antibody prophylaxis
  description: >-
    Suvratoxumab is an investigational monoclonal antibody against S. aureus
    alpha toxin that was tested as single-dose prophylaxis to prevent S. aureus
    pneumonia in colonized mechanically ventilated ICU patients.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Monoclonal Antibody Therapy
    term:
      id: NCIT:C15490
      label: Monoclonal Antibody Therapy
    therapeutic_agent:
    - preferred_term: suvratoxumab
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  target_mechanisms:
  - target: Alpha-Hemolysin ADAM10 Barrier Disruption
    treatment_effect: INHIBITS
    description: >-
      Suvratoxumab binds alpha toxin upstream of its ADAM10-mediated epithelial
      barrier-disruption step.
  evidence:
  - reference: PMID:33894131
    reference_title: >-
      Efficacy and safety of suvratoxumab for prevention of Staphylococcus
      aureus ventilator-associated pneumonia (SAATELLITE): a multicentre,
      randomised, double-blind, placebo-controlled, parallel-group, phase 2 pilot
      trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We aimed to evaluate the efficacy of suvratoxumab, a monoclonal antibody
      targeting the α toxin, in reducing the incidence of S aureus pneumonia in
      patients in the intensive care unit (ICU) who are on mechanical
      ventilation.
    explanation: >-
      Identifies suvratoxumab as the anti-alpha-toxin monoclonal antibody tested
      for prevention of S. aureus ventilator-associated pneumonia.


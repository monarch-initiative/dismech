name: Staphylococcus Aureus Pneumonia
creation_date: "2026-09-30T10:37:00Z"
description: >-
  Staphylococcus aureus pneumonia is bacterial pneumonia caused by S. aureus,
  including post-influenza and healthcare-associated forms in which
  agr-regulated cytolysins, alpha-hemolysin ADAM10 signaling, leukocyte lysis,
  and neutrophil-rich inflammation can produce necrotizing pulmonary disease.
category: Infectious Disease
disease_term:
  preferred_term: staphylococcus aureus pneumonia
  term:
    id: MONDO:0041879
    label: staphylococcus aureus pneumonia
parents:
- Staphylococcus aureus infection
- Staphylococcal pneumonia
synonyms:
- MRSA pneumonia
- MSSA pneumonia
- Staphylococcal pneumonia
- Staphylococcus aureus necrotizing pneumonia
infectious_agent:
- name: Staphylococcus aureus
  description: >-
    Staphylococcus aureus is the defining Gram-positive extracellular pathogen
    in this organism-specific pneumonia.
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  evidence:
  - reference: PMID:21926978
    reference_title: >-
      A Staphylococcus aureus pore-forming toxin subverts the activity of ADAM10
      to cause lethal infection in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Staphylococcus aureus is a major cause of human disease, responsible for
      half a million infections and approximately 20,000 deaths per year in the
      United States alone. This pathogen secretes α-hemolysin, a pore-forming
      cytotoxin that contributes to the pathogenesis of pneumonia.
    explanation: >-
      Identifies S. aureus and one of its secreted cytotoxins as contributors to
      staphylococcal pneumonia pathogenesis.
agent_life_cycle:
  description: >-
    S. aureus normally persists as a human-adapted extracellular colonizer and
    opportunistic pathogen; this pneumonia entry is scoped to human lower-airway
    disease after S. aureus is aspirated or introduced onto airway and alveolar
    epithelial surfaces.
  hosts:
  - preferred_term: Homo sapiens
    role: respiratory disease host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Airway aspiration or nosocomial lower-airway exposure
  description: >-
    S. aureus reaches the lower respiratory tract from colonized upper-airway
    reservoirs, viral-damaged mucosa, or healthcare-associated airway devices.
pathophysiology:
- name: Lower Airway Staphylococcus aureus Seeding
  role: trigger
  biological_scale: TISSUE
  description: >-
    S. aureus enters the lower respiratory tract and begins to proliferate on
    airway or alveolar surfaces.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Alpha-Hemolysin ADAM10 Barrier Disruption
    causal_link_type: DIRECT
    description: >-
      Alpha-hemolysin binds ADAM10 on alveolar epithelial cells and disrupts
      the adherens-junction barrier.
  - target: Agr PSM-Alpha Neutrophil Necroptosis
    causal_link_type: DIRECT
    description: >-
      The agr system promotes secretion of phenol-soluble modulin cytolysins
      that injure recruited neutrophils.
- name: Alpha-Hemolysin ADAM10 Barrier Disruption
  biological_scale: CELLULAR
  description: >-
    S. aureus alpha-hemolysin engages ADAM10 on alveolar epithelial cells,
    increases ADAM10 metalloprotease activity, and cleaves E-cadherin to weaken
    epithelial cell-cell adhesion in the infected lung.
  cell_types:
  - preferred_term: pulmonary alveolar epithelial cell
    term:
      id: CL:0000322
      label: pulmonary alveolar epithelial cell
  biological_processes:
  - preferred_term: cell-cell adhesion
    modifier: DECREASED
    term:
      id: GO:0098609
      label: cell-cell adhesion
  downstream:
  - target: Pneumonia
    causal_link_type: DIRECT
    description: >-
      Loss of alveolar epithelial barrier integrity contributes to acute lung
      injury during staphylococcal pneumonia.
  evidence:
  - reference: PMID:21926978
    reference_title: >-
      A Staphylococcus aureus pore-forming toxin subverts the activity of ADAM10
      to cause lethal infection in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Investigation of the molecular mechanism of toxin-receptor function
      revealed that α-hemolysin upregulates ADAM10 metalloprotease activity in
      alveolar epithelial cells, resulting in cleavage of the adherens junction
      protein E-cadherin.
    explanation: >-
      Shows that alpha-hemolysin subverts epithelial ADAM10 to cleave an
      adherens-junction component in the staphylococcal pneumonia model.
- name: Agr PSM-Alpha Neutrophil Necroptosis
  biological_scale: TISSUE
  description: >-
    Agr-regulated PSM-alpha cytolysins lyse neutrophils by MLKL-linked
    necroptosis, weakening cellular bacterial clearance while amplifying
    inflammatory injury.
  biological_processes:
  - preferred_term: neutrophil chemotaxis
    modifier: INCREASED
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Pneumonia
    causal_link_type: DIRECT
    description: >-
      Leukocyte lysis and toxin-amplified inflammation converge on
      tissue-damaging lower-respiratory infection.
  evidence:
  - reference: PMID:29500427
    reference_title: >-
      Inhibiting PSMα-induced neutrophil necroptosis protects mice with MRSA
      pneumonia by blocking the agr system.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PSMα1, 2, and 3 significantly induced neutrophil necroptosis by activating
      mixed lineage kinase-like protein (MLKL) phosphorylation and increasing
      lactate dehydrogenase release.
    explanation: >-
      Supports the agr-regulated PSM-alpha branch as a neutrophil-lytic
      contributor to MRSA pneumonia pathology.
phenotypes:
- name: Pneumonia
  category: Respiratory
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Pneumonia
    term:
      id: HP:0002090
      label: Pneumonia
review_notes: >-
  Deliberately lumped. This entry keeps methicillin-susceptible and
  methicillin-resistant S. aureus pneumonia, post-influenza community-acquired
  necrotizing pneumonia, and hospital- or ventilator-associated staphylococcal
  pneumonia together because MONDO:0041879 names the organism-specific
  pneumonia and the shared S. aureus lower-airway cytolysin/quorum-sensing
  pathograph applies across those clinical contexts. It remains split from
  generic bacterial pneumonia, other organism-specific pneumonias, and
  nonpulmonary S. aureus diseases whose acquisition route and tissue-level
  pathographs differ.

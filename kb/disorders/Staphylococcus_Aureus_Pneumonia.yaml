name: Staphylococcus Aureus Pneumonia
creation_date: "2026-09-30T10:37:00Z"
description: >-
  Staphylococcus aureus pneumonia is bacterial pneumonia caused by S. aureus,
  including post-influenza and healthcare-associated forms in which
  agr-regulated alpha-hemolysin, Panton-Valentine leukocidin, PSM-alpha toxins,
  ADAM10 signaling, leukocyte lysis, and neutrophil-rich inflammation can
  produce necrotizing pulmonary disease.
category: Infectious Disease
disease_term:
  preferred_term: staphylococcus aureus pneumonia
  term:
    id: MONDO:0041879
    label: staphylococcus aureus pneumonia
parents:
- Staphylococcus aureus infection
- Staphylococcal pneumonia
synonyms:
- MRSA pneumonia
- MSSA pneumonia
- Staphylococcus aureus necrotizing pneumonia
infectious_agent:
- name: Staphylococcus aureus
  description: >-
    Staphylococcus aureus is the defining Gram-positive extracellular pathogen
    in this organism-specific pneumonia.
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  evidence:
  - reference: PMID:21926978
    reference_title: >-
      A Staphylococcus aureus pore-forming toxin subverts the activity of ADAM10
      to cause lethal infection in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Staphylococcus aureus is a major cause of human disease, responsible for
      half a million infections and approximately 20,000 deaths per year in the
      United States alone.
    explanation: >-
      Background from a murine alpha-hemolysin study identifies S. aureus as a
      major human pathogen.
agent_life_cycle:
  description: >-
    S. aureus normally persists as a human-adapted extracellular colonizer and
    opportunistic pathogen; this pneumonia entry is scoped to human lower-airway
    disease after S. aureus is aspirated or introduced onto airway and alveolar
    epithelial surfaces.
  hosts:
  - preferred_term: Homo sapiens
    role: respiratory disease host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Airway aspiration or nosocomial lower-airway exposure
  description: >-
    S. aureus reaches the lower respiratory tract from colonized upper-airway
    reservoirs, viral-damaged mucosa, or healthcare-associated airway devices.

environmental:
- name: Antecedent influenza infection
  description: >-
    Influenza A co-infection suppresses Type 17 antibacterial defense and
    attenuates IL-1β/NF-κB activation, creating a permissive post-viral
    respiratory niche for severe secondary S. aureus pneumonia.
  influences_mechanisms:
  - target: Influenza Type I IFN Type 17 Suppression
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Antecedent influenza induces a type I IFN program that suppresses IL-17,
      IL-22, IL-23, and IL-1β responses needed for staphylococcal clearance.
  evidence:
  - reference: PMID:21178015
    reference_title: Influenza A inhibits Th17-mediated host defense against bacterial pneumonia in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      These data indicate a novel mechanism by which influenza A-induced type I
      IFNs inhibit Th17 immunity and increase susceptibility to secondary
      bacterial pneumonia.
    explanation: >-
      Supports antecedent influenza as a co-infection that predisposes to
      secondary bacterial pneumonia by suppressing Type 17 host defense.
  - reference: PMID:24089191
    reference_title: Influenza A exacerbates Staphylococcus aureus pneumonia by attenuating IL-1β production in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Influenza A attenuation of S. aureus induced NF-κB activation, leading to
      inhibition of IL-1β production and subsequent diminution of Type 17
      pathway activation may represent a novel pathway by which influenza
      predisposes to secondary bacterial infection.
    explanation: >-
      Links influenza A to NF-κB and IL-1β attenuation upstream of impaired Type
      17 antibacterial immunity in the S. aureus pneumonia model.

pathophysiology:
- name: Lower Airway Staphylococcus aureus Seeding
  role: trigger
  biological_scale: TISSUE
  description: >-
    S. aureus enters the lower respiratory tract and proliferates on airway or
    alveolar surfaces until high local density licenses quorum-sensing-driven
    virulence-factor production.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Agr Quorum-Sensing Virulence Activation
    causal_link_type: DIRECT
    description: >-
      Increasing airway bacterial density activates the accessory gene regulator
      quorum-sensing circuit that controls secreted S. aureus toxins.
- name: Influenza Type I IFN Type 17 Suppression
  biological_scale: TISSUE
  description: >-
    Antecedent influenza A infection induces type I IFN signaling that suppresses
    IL-17, IL-22, IL-23, NF-κB, and IL-1β responses, weakening the neutrophilic
    antibacterial program needed to clear S. aureus from lung.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Agr Quorum-Sensing Virulence Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced Type 17 immunity impairs bacterial clearance, allowing airway
      S. aureus burdens to rise to agr-activating density.
  evidence:
  - reference: PMID:21178015
    reference_title: Influenza A inhibits Th17-mediated host defense against bacterial pneumonia in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      influenza A coinfection resulted in substantially decreased IL-17, IL-22,
      and IL-23 production after S. aureus infection.
    explanation: >-
      Directly supports suppression of Type 17 cytokines in a sequential
      influenza A and S. aureus pneumonia model.
- name: Agr Quorum-Sensing Virulence Activation
  biological_scale: CELLULAR
  description: >-
    The S. aureus accessory gene regulator quorum-sensing circuit activates
    RNAIII-linked virulence expression and upregulates secreted cytolysins,
    including alpha-hemolysin, PSM-alpha toxins, and PVL.
  downstream:
  - target: Alpha-Hemolysin ADAM10 Barrier Disruption
    causal_link_type: DIRECT
    description: >-
      Agr activation contributes to the secreted alpha-hemolysin pool that
      engages ADAM10 on alveolar epithelial cells.
  - target: PSM-Alpha Neutrophil Necroptosis
    causal_link_type: DIRECT
    description: >-
      The agr system directly regulates PSM-alpha cytolysins that drive MLKL
      phosphorylation and neutrophil necroptosis.
  - target: Panton-Valentine Leukocidin Leukocyte Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Agr-driven cytolysin expression is one part of the larger virulence
      program that, in PVL-positive strains, produces severe leukocyte injury
      and necrotizing community-acquired pneumonia.
  evidence:
  - reference: PMID:29500427
    reference_title: >-
      Inhibiting PSMα-induced neutrophil necroptosis protects mice with MRSA
      pneumonia by blocking the agr system.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Phenol-soluble modulins (PSMs), as major leukocyte lysis toxins of
      CA-MRSA, are directly regulated by the agr system.
    explanation: >-
      Places the agr quorum-sensing system upstream of PSM-alpha leukocyte-lysis
      toxins in CA-MRSA pneumonia.
- name: Alpha-Hemolysin ADAM10 Barrier Disruption
  biological_scale: CELLULAR
  description: >-
    S. aureus alpha-hemolysin engages ADAM10 on alveolar epithelial cells,
    increases ADAM10 metalloprotease activity, and cleaves E-cadherin to weaken
    epithelial cell-cell adhesion in the infected lung.
  cell_types:
  - preferred_term: pulmonary alveolar epithelial cell
    term:
      id: CL:0000322
      label: pulmonary alveolar epithelial cell
  biological_processes:
  - preferred_term: cell-cell adhesion
    modifier: DECREASED
    term:
      id: GO:0098609
      label: cell-cell adhesion
  downstream:
  - target: Respiratory Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Alpha-hemolysin/ADAM10 barrier loss contributes to lethal acute lung
      injury and downstream respiratory failure in severe disease.
  evidence:
  - reference: PMID:21926978
    reference_title: >-
      A Staphylococcus aureus pore-forming toxin subverts the activity of ADAM10
      to cause lethal infection in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Investigation of the molecular mechanism of toxin-receptor function
      revealed that α-hemolysin upregulates ADAM10 metalloprotease activity in
      alveolar epithelial cells, resulting in cleavage of the adherens junction
      protein E-cadherin.
    explanation: >-
      Shows that alpha-hemolysin subverts epithelial ADAM10 to cleave an
      adherens-junction component in the staphylococcal pneumonia model.
- name: PSM-Alpha Neutrophil Necroptosis
  biological_scale: CELLULAR
  description: >-
    Agr-regulated PSM-alpha cytolysins trigger MLKL phosphorylation and
    necroptosis in recruited neutrophils, releasing neutrophil contents and
    reducing cellular bacterial clearance.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: necroptotic process
    modifier: INCREASED
    term:
      id: GO:0070266
      label: necroptotic process
  downstream:
  - target: Leukopenia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Staphylococcal leukocyte lysis is one route by which necrotizing pneumonia
      presents with peripheral leukopenia.
  evidence:
  - reference: PMID:29500427
    reference_title: >-
      Inhibiting PSMα-induced neutrophil necroptosis protects mice with MRSA
      pneumonia by blocking the agr system.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      PSMα1, 2, and 3 significantly induced neutrophil necroptosis by activating
      mixed lineage kinase-like protein (MLKL) phosphorylation and increasing
      lactate dehydrogenase release.
    explanation: >-
      Supports the agr-regulated PSM-alpha branch as a neutrophil-lytic
      contributor to MRSA pneumonia pathology.
- name: Panton-Valentine Leukocidin Leukocyte Injury
  biological_scale: CELLULAR
  description: >-
    PVL-positive S. aureus strains carry LukS-PV/LukF-PV leukocidin and are
    clinically associated with rapidly progressive hemorrhagic necrotizing
    pneumonia, leukopenia, airway bleeding, septic shock, and increased
    mortality.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Hemoptysis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      PVL-positive lung infection is clinically associated with airway bleeding
      and hemoptysis.
  - target: Pulmonary Hemorrhage
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Fatal PVL-positive necrotizing pneumonia has a hemorrhagic pulmonary
      pattern in systematic review and autopsy material.
  - target: Septic Shock
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      PVL-positive severe community-acquired S. aureus pneumonia is associated
      with greater frequency of septic shock at admission.
  evidence:
  - reference: PMID:33833037
    reference_title: Prognostic factors of severe community-acquired staphylococcal pneumonia in France.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Thus, PVL positivity was a risk factor of mortality independent of other
      baseline factors.
    explanation: >-
      Supports PVL positivity as a human prognostic determinant in severe
      community-acquired staphylococcal pneumonia.

phenotypes:
- name: Fever
  category: Constitutional
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:11888586
    reference_title: >-
      Association between Staphylococcus aureus strains carrying gene for
      Panton-Valentine leukocidin and highly lethal necrotising pneumonia in
      young immunocompetent patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      PVL-positive infections were more often marked by: temperature greater
      than 39 degrees C (p=0.01), heart rate above 140 beats per min (p=0.02),
      haemoptysis (p=0.005), onset of pleural effusion during hospital stay
      (p=0.004), and leucopenia (p=0.001).
    explanation: >-
      The PVL-positive staphylococcal-pneumonia case comparison found fever
      above 39 C enriched in necrotizing disease.

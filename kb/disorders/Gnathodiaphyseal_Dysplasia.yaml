name: Gnathodiaphyseal Dysplasia
creation_date: "2026-08-21T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: gnathodiaphyseal dysplasia
  term:
    id: MONDO:0008151
    label: gnathodiaphyseal dysplasia
synonyms:
- GDD
- gnathodiaphyseal sclerosis
- osteogenesis imperfecta with unusual skeletal lesions
- osteogenesis imperfecta Levin type
description: >-
  Gnathodiaphyseal dysplasia (GDD) is a rare autosomal dominant skeletal disorder
  caused by heterozygous missense variants in ANO5 (TMEM16E, originally GDD1). It
  couples two lesions that rarely travel together: expansile cemento-osseous
  fibrous lesions of the jaws, and diaphyseal sclerosis with cortical thickening
  and bowing of the tubular bones accompanied by bone fragility. Patients
  therefore present with both recurrent long-bone fractures and progressive
  mandibular or maxillary swelling, and the jaw lesions are prone to purulent
  osteomyelitis in adult life. GDD was long mistaken for osteogenesis imperfecta
  or fibrous dysplasia; the 2004 identification of ANO5 established it as a
  distinct entity.

  The entry's mechanistic focus is allelic. ANO5 carries two essentially separate
  disease programmes: heterozygous missense variants clustered at a few residues
  (p.Cys356Tyr/Arg/Gly, p.Cys360Tyr, p.Ser500Phe, p.Thr513Ile, p.Gly518Glu,
  p.Arg215Gly) cause this dominant skeletal disease, whereas biallelic
  loss-of-function variants cause limb-girdle muscular dystrophy R12 and
  Miyoshi-like distal myopathy, curated separately in
  Autosomal_Recessive_Limb-Girdle_Muscular_Dystrophy. That opposite inheritance
  is itself an argument against haploinsufficiency here - the obligate
  heterozygous null carriers who are the parents of LGMDR12 patients are not
  reported with bone disease, though they have never been systematically
  skeletally phenotyped, so this is an argument from absence rather than a
  measured negative. What does bear the gain-of-function reading out directly is
  heterologous expression, where GDD alleles and muscular-dystrophy alleles
  compared in one assay system move in opposite directions.

  Three things stop that story being tidier than the evidence, and all three are
  curated rather than smoothed over. The bone-mass direction is not uniform: a
  proposed sub-entity split assigns high bone mass to gain-of-function alleles and
  osteopenia to loss-of-function ones, which is why this entry curates both
  diaphyseal sclerosis and osteopenia and puts no single direction on bone mineral
  density. The bone/muscle separation is not absolute either: one dominant kindred
  carrying p.Thr513Ile - the very allele the gain-of-function assay characterized -
  had rhabdomyolysis and hyperCKemia alongside its jaw lesions, and those authors
  explicitly challenged the dichotomy. And the mouse models disagree with each other
  and invert the human genotype-phenotype relation. Finally, how altered scramblase
  activity in an ER protein produces jaw-selective fibro-osseous lesions is simply
  not known, and is recorded as an open knowledge gap rather than filled in with a
  plausible chain.

parents:
- Skeletal Dysplasias

references:
- reference: PMID:15124103
  title: "The novel gene encoding a putative transmembrane protein is mutated in gnathodiaphyseal dysplasia (GDD)."
- reference: PMID:32112655
  title: "TMEM16E/ANO5 mutations related to bone dysplasia or muscular dystrophy cause opposite effects on lipid scrambling."

classifications:
  isds_skeletal_category:
  - classification_value: osteogenesis_imperfecta_and_decreased_bone_density
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (PMID:36779427),
      group 26 "Osteogenesis Imperfecta and bone fragility group", which explicitly
      lists "gnathodiaphyseal dysplasia (ANO5)" among the non-OI bone-fragility
      conditions. This agrees with the MONDO parent of MONDO:0008151
      (MONDO:0800064, the osteogenesis-imperfecta/reduced-bone-mineral-density
      grouping). Note the placement is by bone fragility, not by the diaphyseal
      sclerosis, which would otherwise suggest group 25.

inheritance:
- name: Autosomal dominant
  description: >-
    GDD segregates as an autosomal dominant trait in multigeneration kindreds and
    also arises de novo; affected individuals are heterozygous for an ANO5 missense
    variant. This is the inheritance mode that distinguishes GDD from the
    autosomal recessive ANO5 muscular dystrophies.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: UNKNOWN
  expressivity: VARIABLE
  evidence:
  - reference: PMID:40861765
    reference_title: "A Long-Term (41 Years) Radiographic Follow-Up Study of the Onset and Development of a Jawbone Lesion in a Patient With Gnathodiaphyseal Dysplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with autosomal dominant inheritance, with high penetrance
    explanation: >-
      The only penetrance statement in the GDD literature, describing the founding
      Akasaka kindred. `penetrance` is nonetheless recorded as UNKNOWN rather than
      COMPLETE because this is a historical pedigree impression rather than a measured
      estimate, and no quantitative penetrance study exists; support is PARTIAL for that
      reason. `expressivity: VARIABLE` is the better-supported claim - the same
      p.Cys356Tyr allele spans mild jaw lesions to severe multi-quadrant gigantiform
      disease, bone mass runs in opposite directions between families, and one
      p.Thr513Ile kindred adds a muscle phenotype absent from every other GDD family.
  - reference: PMID:28176803
    reference_title: "Three novel ANO5 missense mutations in Caucasian and Chinese families and sporadic cases with gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gnathodiaphyseal dysplasia (GDD; MIM#166260) is an autosomal dominant syndrome
      with characteristic cemento-osseous lesions of jawbones, bone fragility, and
      diaphyseal sclerosis of tubular bones.
    explanation: >-
      States the autosomal dominant inheritance mode alongside the defining triad.
  - reference: PMID:38922934
    reference_title: "Gnathodiaphyseal dysplasia: Diagnostic clues from two fetal cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing revealed two de novo variants of the ANO5 gene, confirming the
      diagnosis.
    explanation: >-
      Documents de novo occurrence of the dominant ANO5 allele, so a negative family
      history does not exclude GDD.

progression:
- phase: Early childhood - long bones first, jaws silent
  age_range: 1-8 years
  notes: >-
    The two components of GDD do not begin together. In a woman followed
    radiographically from age one to over forty, widening of the diaphyseal
    cortices of the femur and radius was already present at three years old while
    the jawbones were still asymptomatic. The long-bone lesion is therefore the
    earlier finding, which matters diagnostically: a child with unexplained
    diaphyseal cortical thickening and fractures may not yet show the gnathic
    lesion that makes the diagnosis obvious.
  evidence:
  - reference: PMID:40861765
    reference_title: "A Long-Term (41 Years) Radiographic Follow-Up Study of the Onset and Development of a Jawbone Lesion in a Patient With Gnathodiaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At three years of age, widening of the diaphyseal cortices in the femur and
      radius was observed, although no symptoms were observed in the jawbones.
    explanation: >-
      Establishes that the diaphyseal change precedes any jaw involvement in this
      long-followed patient.
- phase: Mixed dentition onward - jaw lesion appears and grows
  age_range: 9 years to adulthood
  notes: >-
    The gnathic lesion emerges around the mixed-dentition stage and then enlarges
    with age rather than remaining static. Sclerosis appeared adjacent to the
    permanent tooth roots at nine years, became a clearly denser mass once the
    secondary dentition was complete at fourteen, and continued to develop over
    four decades. The association with the erupting permanent dentition is a
    suggestive - though untested - hint towards the tissue-selectivity question
    recorded in `gdd_jaw_selectivity_gap`.
  evidence:
  - reference: PMID:40861765
    reference_title: "A Long-Term (41 Years) Radiographic Follow-Up Study of the Onset and Development of a Jawbone Lesion in a Patient With Gnathodiaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At nine years of age, we observed a slightly sclerotic appearance in the
      alveolar and jawbones adjacent to the permanent tooth roots. After completion
      of the secondary dentition at 14 years of age, increased density of the
      sclerotic mass was clearly observed.
    explanation: >-
      Dates the appearance of the jaw lesion to the mixed-dentition period and ties
      its progression to completion of the secondary dentition.
  - reference: PMID:40861765
    reference_title: "A Long-Term (41 Years) Radiographic Follow-Up Study of the Onset and Development of a Jawbone Lesion in a Patient With Gnathodiaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this study observed that the onset of the jawbone lesion had already appeared
      after the mixed dentition stage, and the sclerotic mass developed with age
    explanation: >-
      The authors' summary that the lesion is progressive rather than static across
      four decades of follow-up.

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based estimate exists. The literature consistently describes GDD as
    rare or ultra-rare, and the qualitative class is recorded here rather than a
    fabricated rate; `rate_per_100000` is deliberately left unset. The largest
    aggregation is a literature review of about 108 clinically diagnosed individuals
    across 25 families, which is a case count, not a denominator.
  evidence:
  - reference: PMID:29175271
    reference_title: "Gnathodiaphyseal dysplasia: Severe atypical presentation with novel heterozygous mutation of the anoctamin gene (ANO5)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gnathodiaphyseal dysplasia (GDD; OMIM #166260) is an ultra-rare autosomal
      dominant disorder caused by heterozygous mutation in the anoctamin 5 (ANO5) gene
    explanation: >-
      Supports the qualitative ULTRA_RARE class, in a sentence that also states the
      heterozygous-mutation mechanism. No quantitative rate is asserted because none is
      reported anywhere in the literature.

pathophysiology:
- name: Heterozygous ANO5 Missense Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    GDD is caused by a heterozygous missense variant in ANO5 (TMEM16E), the gene
    originally designated GDD1. The reported alleles are strikingly clustered: the
    founding Japanese and African American families carried substitutions at the
    evolutionarily conserved cysteine 356 (p.Cys356Arg, p.Cys356Gly, and later
    p.Cys356Tyr), and subsequent families added p.Cys360Tyr, p.Arg215Gly,
    p.Ser500Phe, p.Thr513Ile and p.Gly518Glu. All map either to the extracellular
    loop following the first transmembrane domain or to the fourth putative
    transmembrane domain, which is what makes a simple gene-dosage explanation
    implausible: a haploinsufficiency mechanism would tolerate nonsense and
    frameshift alleles anywhere in the gene, and those alleles instead produce a
    recessive myopathy.
  genetic_context:
    gene:
      preferred_term: ANO5
      term:
        id: hgnc:27337
        label: ANO5
    allele_type: Missense substitution clustered at ANO5 residues 215, 356, 360, 500, 513 and 518
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous germline ANO5 missense allele. `functional_impact_category` is
      set to GAIN_OF_FUNCTION rather than LOSS_OF_FUNCTION on two converging
      grounds: the dominant inheritance with a restricted missense spectrum, and
      functional assay data. Note the scope of that assay evidence precisely - the
      calcium-independent-scrambling demonstration is for p.Thr513Ile specifically
      (PMID:29124309), and the class-level claim that GDD alleles gain function while
      muscular-dystrophy alleles lose it comes from a separate head-to-head comparison
      (PMID:32112655) that did not name every allele it tested. It is NOT established
      that every GDD allele behaves this way; the two commonest, p.Cys356Tyr and
      p.Cys360Tyr, have published *reduced* steady-state protein in overexpression.
      The category is therefore an allele-class judgement, and the competing
      loss-of-function reading is not dismissed - see the mechanistic hypotheses and
      the `gdd_gof_vs_lof_dispute` discussion.
  evidence:
  - reference: PMID:15124103
    reference_title: "The novel gene encoding a putative transmembrane protein is mutated in gnathodiaphyseal dysplasia (GDD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two missense mutations (C356R and C356G) of GDD1 were identified in the two
      families with GDD (the original Japanese family and a new African American
      family), and both missense mutations occur at the cysteine residue at amino
      acid 356, which is evolutionarily conserved among human, mouse, zebrafish,
      fruit fly, and mosquito.
    explanation: >-
      The founding gene-identification study, establishing GDD1/ANO5 missense change
      at a single conserved cysteine as the cause of GDD.
  - reference: PMID:28176803
    reference_title: "Three novel ANO5 missense mutations in Caucasian and Chinese families and sporadic cases with gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It appears that all GDD mutations known so far locate in an extracellular
      domain following the first transmembrane domain or in the 4th putative
      transmembrane domain.
    explanation: >-
      Documents the tight positional clustering of GDD alleles, which is difficult to
      reconcile with simple haploinsufficiency.
  downstream:
  - target: Altered Calcium-Activated Phospholipid Scrambling by TMEM16E
    causal_link_type: DIRECT
    description: >-
      The missense substitution acts on the protein's own transport behaviour; this is
      the step demonstrated directly in heterologous expression.

- name: Altered Calcium-Activated Phospholipid Scrambling by TMEM16E
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    ANO5 encodes TMEM16E/anoctamin-5, a member of the TMEM16 family that behaves as
    a calcium-activated phospholipid scramblase and a poorly selective ion conduit,
    and that localizes predominantly to the endoplasmic reticulum rather than the
    plasma membrane. In heterologous expression, the GDD-associated p.Thr513Ile
    protein scrambles phospholipid and carries large currents even at very low
    cytosolic calcium, i.e. it is uncoupled from its normal calcium gating rather
    than inactivated. When GDD alleles and muscular-dystrophy alleles were compared
    side by side in the same assay system, they moved in opposite directions - GDD
    towards gain of function, muscular dystrophy towards loss of function. This is
    the node at which the two ANO5 diseases separate, and it is why bone disease is
    not simply "less ANO5".
  molecular_functions:
  - preferred_term: phospholipid scramblase activity
    term:
      id: GO:0017128
      label: phospholipid scramblase activity
    modifier: GAIN_OF_FUNCTION
  biological_processes:
  - preferred_term: calcium activated phospholipid scrambling
    term:
      id: GO:0061588
      label: calcium activated phospholipid scrambling
    modifier: GAIN_OF_FUNCTION
  - preferred_term: endoplasmic reticulum calcium ion homeostasis
    term:
      id: GO:0032469
      label: endoplasmic reticulum calcium ion homeostasis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:29124309
    reference_title: "Gain of function of TMEM16E/ANO5 scrambling activity caused by a mutation associated with gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      While the activity of wild-type TMEM16E depended on elevated cytosolic Ca2+
      levels, a mutant form carrying the GDD-causing T513I substitution showed PLS and
      large time-dependent ion currents even at low cytosolic Ca2+ concentrations.
    explanation: >-
      Direct demonstration that a GDD allele uncouples TMEM16E scrambling from its
      normal calcium requirement - constitutive activity, not absent activity.
  - reference: PMID:32112655
    reference_title: "TMEM16E/ANO5 mutations related to bone dysplasia or muscular dystrophy cause opposite effects on lipid scrambling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results collectively demonstrate that, on the level of protein function, MD
      mutations are associated to loss-of-function and GDD mutations to
      gain-of-function phenotypes, confirming conjectures made on the basis of
      inheritance modes.
    explanation: >-
      The head-to-head comparison establishing the allelic dichotomy at the level of
      protein function, and explicitly grounding it in the opposite inheritance modes.
  - reference: PMID:15124103
    reference_title: "The novel gene encoding a putative transmembrane protein is mutated in gnathodiaphyseal dysplasia (GDD)."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Cellular localization to the endoplasmic reticulum suggests a role for GDD1 in
      the regulation of intracellular calcium homeostasis.
    explanation: >-
      Establishes the ER localization that constrains where the scrambling defect can
      act; the calcium-regulation role is inferred rather than measured here, hence
      PARTIAL.
  downstream:
  - target: Pro-Osteogenic Signalling Dysregulation in Osteoblasts
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Route to the osteoblast arm. Candidate intermediates are now identified in mouse
      models, but the step from altered TMEM16E scrambling to those signalling changes
      has not been demonstrated in patient bone.
    hypothesis_groups:
    - gof_scramblase_model
    - ano5_deficiency_model
  - target: Osteoclast Differentiation Blockade and Apoptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Route to the osteoclast arm, evidenced in the same model systems and subject to
      the same caveat.
    hypothesis_groups:
    - gof_scramblase_model
    - ano5_deficiency_model

- name: Pro-Osteogenic Signalling Dysregulation in Osteoblasts
  biological_scale: CELLULAR
  description: >-
    The osteoblast-side intermediate between the ANO5 defect and the remodelling
    imbalance. Four convergent mouse studies identify signalling routes by which
    perturbed ANO5 drives excess bone formation: AMPK phosphorylation rises and
    accelerates glycolysis and PGC1a-dependent mitochondrial respiration; AMPK in turn
    upregulates ATG9A and activates autophagy, which is required for the excess
    osteogenesis; miR-34c-5p falls, de-repressing KLF4 and activating canonical
    Wnt/beta-catenin; and Akt phosphorylation falls, with Akt re-activation suppressing
    mineralization. Each arm has a pharmacological or genetic rescue.

    READ THE GENOTYPES BEFORE TRANSFERRING ANY OF THIS TO HUMAN GDD. The AMPK and Akt
    arms come from the Ano5 p.Cys360Tyr knock-in, which carries an actual human GDD
    allele. The autophagy/ATG9A, miR-34c-5p/KLF4 and NF-kB arms come from Ano5-null
    mice - a genotype that in humans causes myopathy, not bone disease. So this node is
    better evidenced than the bare "unknown intermediates" it replaces, but it is not
    thereby established for human GDD, and the two model classes are not
    interchangeable. See `gdd_mouse_model_mismatch`.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: AMPK-driven glycolytic shift
    term:
      id: GO:0006096
      label: glycolytic process
    modifier: INCREASED
  - preferred_term: autophagy (ATG9A-dependent)
    term:
      id: GO:0006914
      label: autophagy
    modifier: INCREASED
  - preferred_term: canonical Wnt/beta-catenin signalling via KLF4
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: INCREASED
  - preferred_term: PI3K/Akt signalling in osteoblasts
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: DECREASED
  molecular_functions:
  - preferred_term: AMP-activated protein kinase activity
    term:
      id: GO:0004679
      label: AMP-activated protein kinase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:40067389
    reference_title: "Anoctamin-5 deficiency enhances ATG9A-dependent autophagy, inducing osteogenesis and gnathodiaphyseal dysplasia-like bone formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Further analysis revealed that Ano5 deficiency upregulated the expression of
      ATG9A, and silencing ATG9A significantly reduced both autophagy and osteogenic
      activity in Ano5-/- mCOBs.
    explanation: >-
      Establishes ATG9A-dependent autophagy as a required intermediate for the excess
      osteogenesis, with the silencing experiment supplying the causal direction.
  - reference: PMID:41717545
    reference_title: "Anoctamin 5 mutation leads to abnormal bone homeostasis of GDD by regulating AMPK-dependent glucose metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, ANO5 mutation promoted the phosphorylation of AMPK, the classical
      sensor of energy metabolism.
    explanation: >-
      Places AMPK activation downstream of a genotype-matched GDD knock-in allele
      (p.Cys360Tyr), not merely of Ano5 loss.
  - reference: PMID:40508076
    reference_title: "Ano5 Deficiency Leads to Abnormal Bone Formation via miR-34c-5p/KLF4/beta-Catenin in Gnathodiaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this study, we found that Ano5 deficiency notably inhibited miR-34c-5p
      expression. Krüppel-Like Factor 4 (Klf4), a target gene of miR-34c-5p confirmed
      by dual luciferase reporter assay, was up-regulated in Ano5-/- mCOBs, accompanied
      by activated downstream canonical Wnt/β-catenin signaling and increased
      expression of β-catenin.
    explanation: >-
      Supplies the miR-34c-5p/KLF4/beta-catenin arm with a validated target
      relationship.
  - reference: PMID:39866532
    reference_title: "Ano5(Cys360Tyr) mutation leads to bone dysfunction of gnathodiaphyseal dysplasia via disturbing Akt signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additionally, Ano5 Cys360Tyr mutation down-regulated the Akt phosphorylation
      level in osteoblast.
    explanation: >-
      The Akt arm, again in the genotype-matched knock-in. Note the direction: Akt is
      DECREASED, and it is Akt re-activation that suppresses the excess mineralization.
  downstream:
  - target: Dysregulated Osteoblast and Osteoclast Differentiation
    causal_link_type: DIRECT
    description: >-
      These signalling changes are what the differentiation phenotype is measured as;
      each arm's rescue reverses the osteogenic excess.

- name: Osteoclast Differentiation Blockade and Apoptosis
  biological_scale: CELLULAR
  description: >-
    The osteoclast-side intermediate. Perturbed ANO5 suppresses RANKL-induced early
    signalling and the NF-kB pathway, reducing NFATc1, c-Fos and the osteoclast
    effector programme and leaving disrupted actin rings with impaired mineral
    resorption. Separately, calcium dyshomeostasis in Ano5-null osteoclasts drives an
    overactivated endoplasmic-reticulum stress response and CHOP-mediated apoptosis, so
    osteoclasts are both under-differentiated and actively lost. Akt is the third arm:
    it is reduced in the knock-in, and the Akt activator SC79 restores multinucleated
    osteoclast formation.

    The same genotype caveat as the osteoblast node applies - the NF-kB and ER-stress
    arms are null-mouse work.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: canonical NF-kappaB signalling in osteoclast precursors
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: DECREASED
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  - preferred_term: osteoclast apoptosis
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:36989132
    reference_title: "Genetic disruption of Ano5 leads to impaired osteoclastogenesis for gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RANKL-induced early signaling pathways were suppressed in Ano5-/- osteoclasts and
      Ano5 knockdown RAW264.7 cells. Moreover, the inhibitory effects of NF-κB
      signalling pathway on osteoclastogenesis were partially attenuated with NF-κB
      signalling activator.
    explanation: >-
      Establishes suppressed RANKL/NF-kB signalling as the osteoclast intermediate, with
      partial pharmacological reversal supplying the causal direction.
  - reference: PMID:40049314
    reference_title: "Ano5 deficiency disturbed bone formation by inducing osteoclast apoptosis in Gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, the endoplasmic reticulum stress (ERS) response was significantly
      enhanced in Ano5-/- osteoclasts, possibly because of calcium dyshomeostasis, which
      leading to the increased proportion of apoptotic osteoclasts via the activation of
      the C/EBP homologous protein (CHOP) signalling pathway
    explanation: >-
      Supplies the ER-stress/CHOP apoptosis arm and ties it back to calcium
      dyshomeostasis, connecting this node to the upstream ER calcium claim.
  - reference: PMID:39866532
    reference_title: "Ano5(Cys360Tyr) mutation leads to bone dysfunction of gnathodiaphyseal dysplasia via disturbing Akt signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Akt activation promoted the generation of TRAP-positive multinucleated osteoclasts
      and the formation of actin rings in Ano5 KI/KI BMMs cultures
    explanation: >-
      The Akt arm in the genotype-matched knock-in, with rescue of both multinucleation
      and the actin ring defect noted elsewhere in this entry.
  downstream:
  - target: Dysregulated Osteoblast and Osteoclast Differentiation
    causal_link_type: DIRECT
    description: >-
      Reduced osteoclast differentiation and increased osteoclast apoptosis are the
      resorption-side half of the remodelling imbalance.

- name: Dysregulated Osteoblast and Osteoclast Differentiation
  biological_scale: CELLULAR
  description: >-
    ANO5 is expressed in osteoblasts and periodontal ligament cells, and
    manipulating it in cell culture perturbs both arms of bone remodelling.
    Knockdown in osteoblast precursors raises osteoblast marker expression and
    mineral nodule formation, while ANO5 supports RANKL-driven osteoclast
    differentiation through Akt-NFATc1 signalling and its loss impairs
    osteoclastogenesis and actin-ring formation. The direction of effect is not
    consistent across systems - which is itself informative, and is the reason the
    cellular arm is curated as a hypothesis-tagged step rather than a settled
    mechanism. Both processes therefore carry `modifier: DYSREGULATED` rather than a
    direction: knockdown in MC3T3-E1 precursors increased osteoblast markers and
    mineralization, ANO5 downregulation in another system did not affect osteoblast
    differentiation at all, and the Ano5-null osteoblasts of a third study showed
    decreased indices. Asserting INCREASED here would pick a winner among three
    published directions.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: osteoclast
    term:

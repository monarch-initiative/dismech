      label: osteoclast differentiation
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:28176803
    reference_title: "Three novel ANO5 missense mutations in Caucasian and Chinese families and sporadic cases with gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After Ano5 gene knock-down with shRNA in MC3T3-E1 osteoblast precursors we saw
      elevated expression of osteoblast-related genes such as Col1a1, osteocalcin,
      osterix and Runx2 as well as increased mineral nodule formation in
      differentiating cells.
    explanation: >-
      Links ANO5 perturbation to an osteoblast differentiation and mineralization
      phenotype in an osteoblast precursor line.
  - reference: PMID:30557634
    reference_title: "Role of anoctamin 5, a gene associated with gnathodiaphyseal dysplasia, in osteoblast and osteoclast differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, Ano5-mediated Akt phosphorylation resulted in nuclear factor of
      activated T-cells c1 (NFATc1) activation, indicating that Ano5 regulates
      osteoclast differentiation through activation of the Akt-NFATc1 signaling
      pathway.
    explanation: >-
      Places ANO5 in the RANKL-Akt-NFATc1 osteoclast differentiation axis, the
      osteoclast arm of the remodelling imbalance.
  - reference: PMID:30557634
    reference_title: "Role of anoctamin 5, a gene associated with gnathodiaphyseal dysplasia, in osteoblast and osteoclast differentiation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Downregulation of Ano5 expression did not affect osteoblast differentiation and
      mineralization, while ectopic expression of Ano5 significantly enhanced receptor
      activator of nuclear factor kappa B ligand (RANKL)-induced osteoclast
      differentiation.
    explanation: >-
      A directly contrary result on the osteoblast arm - no effect, where another
      system reported an increase - which is why the osteoblast process carries
      DYSREGULATED rather than a direction. Also shows the osteoclast effect runs the
      opposite way from the knock-in mouse.
  downstream:
  - target: High-Turnover Skeletal Remodelling Imbalance
    causal_link_type: DIRECT
    description: >-
      A coordinated disturbance of osteoblast and osteoclast behaviour is what
      produces the paradoxical combination of sclerotic, thickened bone that
      nevertheless fractures. This edge is claimed by BOTH mechanistic hypotheses, and
      that is the point: they disagree about the SIGN of the remodelling change - the
      gain-of-function model predicts increased indices and high bone mass, the
      sub-entity model predicts decreased indices and osteopenia for loss-of-function
      alleles - while agreeing that the cellular imbalance is what produces the
      skeletal phenotype.
    hypothesis_groups:
    - gof_scramblase_model
    - ano5_deficiency_model
  - target: Jaw Cemento-Osseous Fibrous Lesion Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The jaw-selective step. Why a systemically expressed ER scramblase produces
      focal, expansile fibro-osseous masses confined to the gnathic skeleton is
      unexplained; see the knowledge-gap discussion. The expanding cell population on
      that node is deliberately left as free text rather than bound to CL:0000061
      cementoblast, because which lineage expands is precisely what
      `gdd_jaw_selectivity_gap` records as untested.

- name: High-Turnover Skeletal Remodelling Imbalance
  biological_scale: TISSUE
  description: >-
    Full osteological assessment of a GDD patient carrying p.Ser500Phe showed
    increased trabecular bone mass with elevated serum markers of both bone
    formation and bone resorption, and an iliac crest biopsy with markedly
    increased osteoblast and osteoclast indices. GDD is therefore not a low-turnover
    sclerosing disease: bone is being both laid down and resorbed faster than
    normal, and the resulting tissue is sclerotic in the diaphyses yet mechanically
    inadequate. Elevated serum alkaline phosphatase is the usual laboratory correlate
    of this high-turnover presentation, but it is not universal across GDD: the
    osteopenic sub-entity has been reported with low bone-formation markers, and
    individual patients with normal ALP are documented.
  biological_processes:
  - preferred_term: bone mineralization
    term:
      id: GO:0030282
      label: bone mineralization
    modifier: INCREASED
  locations:
  - preferred_term: diaphysis
    term:
      id: UBERON:0004769
      label: diaphysis
  evidence:
  - reference: PMID:27541832
    reference_title: "A Novel ANO5 Mutation Causing Gnathodiaphyseal Dysplasia With High Bone Turnover Osteosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We thereby identified increased trabecular bone mass accompanied by elevated
      serum markers of bone formation and bone resorption.
    explanation: >-
      Establishes the high-turnover character of the skeletal phenotype in a
      genetically confirmed GDD patient.
  - reference: PMID:27541832
    reference_title: "A Novel ANO5 Mutation Causing Gnathodiaphyseal Dysplasia With High Bone Turnover Osteosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The high turnover bone pathology was further confirmed through the analysis of
      an iliac crest biopsy, where osteoblast and osteoclast indices were remarkably
      increased.
    explanation: >-
      Histomorphometric confirmation that both cell lineages are hyperactive, tying the
      tissue phenotype back to the cellular node.
  downstream:
  - target: Diaphyseal Sclerosis and Bone Fragility
    causal_link_type: DIRECT
    description: >-
      Accelerated, poorly coordinated remodelling yields thickened sclerotic
      diaphyses whose material quality does not match their apparent density.

- name: Jaw Cemento-Osseous Fibrous Lesion Formation
  biological_scale: TISSUE
  description: >-
    The gnathic component of GDD is a multi-quadrant fibro-osseous lesion of the
    mandible and maxilla - cementum-like calcified deposits scattered in a
    fibroblastic stroma - that expands, deforms the face, and frequently becomes
    secondarily infected. It has been variously reported as florid cemento-osseous
    dysplasia, cemento-ossifying fibroma, or familial gigantiform cementoma, and
    ANO5 p.Cys356Tyr has since been found in familial gigantiform cementoma
    kindreds, suggesting that entity is an atypical variant of GDD rather than a
    separate disease. Notably, osteosclerosis - the hallmark of the long-bone
    lesion - is not a feature of the jaw lesion, so the two components of GDD are
    not the same pathology in two places.
  cell_types:
  - preferred_term: cementoblast or periodontal ligament cell (lineage unresolved)
  locations:
  - preferred_term: mandible
    term:
      id: UBERON:0001684
      label: mandible
  evidence:
  - reference: PMID:37649308
    reference_title: "Familial gigantiform cementoma with recurrent ANO5 p.Cys356Tyr mutations: Clinicopathological and genetic study with literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Results showed that all three patients harbored the heterozygous mutation
      c.1067G > A (p.Cys356Tyr) in the ANO5 gene.
    explanation: >-
      Ties the recurrent GDD allele to expansile multi-quadrant gnathic fibro-osseous
      disease, supporting a shared lesion biology.
  - reference: PMID:37649308
    reference_title: "Familial gigantiform cementoma with recurrent ANO5 p.Cys356Tyr mutations: Clinicopathological and genetic study with literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings indicate that FGC may be an atypical variant of GDD, providing
      evidence for the feasibility of ANO5 gene testing as an auxiliary diagnostic
      method for complex cases with multiple quadrants.
    explanation: >-
      Supports treating familial gigantiform cementoma as within the GDD spectrum
      rather than as a differential to be excluded.
  downstream:
  - target: Mandibular Osteomyelitis and Facial Deformity
    causal_link_type: DIRECT
    description: >-
      Expansile avascular fibro-osseous masses in tooth-bearing bone deform the face
      and provide a nidus for purulent infection.

- name: Diaphyseal Sclerosis and Bone Fragility
  biological_scale: ORGANISM
  role: outcome
  description: >-
    The extragnathic skeletal phenotype: sclerosis and cortical thickening of the
    diaphyses of the tubular bones, bowing of the lower limbs, and recurrent
    fractures that typically begin around puberty but may present prenatally as
    bone bowing. The combination of radiographically dense bone with a high
    fracture rate is the feature that historically caused GDD to be misfiled as
    osteogenesis imperfecta.
  locations:
  - preferred_term: diaphysis
    term:
      id: UBERON:0004769
      label: diaphysis
  evidence:
  - reference: PMID:28176803
    reference_title: "Three novel ANO5 missense mutations in Caucasian and Chinese families and sporadic cases with gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One Caucasian family with seven affected members exhibited frequent bone
      fractures and florid osseous dysplasia (p.Cys356Tyr), while one Chinese family
      with two affected members suffered from cementoma and purulent osteomyelitis
      (p.Cys360Tyr).
    explanation: >-
      Documents the co-occurrence of fractures with gnathic fibro-osseous disease in
      genotyped families.
  - reference: PMID:27541832
    reference_title: "A Novel ANO5 Mutation Causing Gnathodiaphyseal Dysplasia With High Bone Turnover Osteosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gnathodiaphyseal dysplasia (GDD) is a rare skeletal syndrome that involves an
      osteopetrosis-like sclerosis of the long bones and fibrous dysplasia-like
      cemento-osseous lesions of the jawbone.
    explanation: >-
      Substantiates the sclerosis half of this node, which the fracture-focused
      evidence above does not address.
  - reference: PMID:28176803
    reference_title: "Three novel ANO5 missense mutations in Caucasian and Chinese families and sporadic cases with gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      his radiographs showed gross thickening of the diaphyseal cortices of long bones
      with narrow medullary canals
    explanation: >-
      Human radiographic evidence for the cortical-thickening component of this node.

- name: Mandibular Osteomyelitis and Facial Deformity
  biological_scale: ORGANISM
  role: outcome
  description: >-
    Jaw lesions enlarge through adolescence and adult life, producing maxillofacial
    deformity and malocclusion that may require orthognathic or reconstructive
    surgery, and are susceptible to purulent osteomyelitis. This was a defining
    feature of the original Japanese kindred.
  locations:
  - preferred_term: mandible
    term:
      id: UBERON:0001684
      label: mandible
  evidence:
  - reference: PMID:28176803
    reference_title: "Three novel ANO5 missense mutations in Caucasian and Chinese families and sporadic cases with gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      first described in a large Japanese family including 21 patients exhibiting
      frequent bone fractures in adolescence and purulent osteomyelitis of the jaws

      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In addition, two different novel mutations (p.Gly518Glu and p.Arg215Gly) were
        identified in sporadic patients without family history.
      explanation: >-
        Reports p.Arg215Gly and p.Gly518Glu as sporadic GDD alleles, extending the
        spectrum beyond the familial cysteine cluster.
  - name: ANO5 p.Leu370_Ala371insDYWRLNSTCL
    description: >-
      The de novo in-frame insertion that anchors the low-bone-mass argument. Unlike
      every other allele curated here it is not a missense substitution, it reduces
      TMEM16E expression, and the family presented with osteopenia rather than
      osteosclerosis - which is why this entry curates two bone-mass directions and an
      EMERGING sub-entity hypothesis rather than a single phenotype.
    gene:
      preferred_term: ANO5
      term:
        id: hgnc:27337
        label: ANO5
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:35982081
      reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we report a de novo pathogenic ANO5 frameshift insertion mutation
        (c.1080_1081insGATTATTGGAGACTAAATAGTACGTGTTTG, p.L370_A371insDYWRLNSTCL)
      explanation: >-
        Identifies the insertion allele at nucleotide resolution in the osteopenic GDD
        family.
    - reference: PMID:35982081
      reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our results also confirm that the mutation resulted in partial instead of
        complete LOF of the TMEM16E protein.
      explanation: >-
        Establishes the allele as a PARTIAL loss of function, which is how a
        reduced-activity allele can be dominant without implying a full null would be.
  - name: ANO5 p.Ser500Phe
    description: >-
      A de novo GDD allele in a patient with recurrent femoral diaphyseal fractures,
      whose full osteological workup established the high-turnover osteosclerotic
      phenotype. Its murine equivalent is the knock-in that failed to reproduce GDD.
    gene:
      preferred_term: ANO5
      term:
        id: hgnc:27337
        label: ANO5
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:27541832
      reference_title: "A Novel ANO5 Mutation Causing Gnathodiaphyseal Dysplasia With High Bone Turnover Osteosclerosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report a new case of GDD in a 13-year-old boy with recurrent diaphyseal
        fractures of the femur, in whom we identified a novel de novo missense mutation
        in the ANO5 gene, causing a p.Ser500Phe substitution at the protein level.
      explanation: >-
        Identifies the de novo p.Ser500Phe allele and the clinical context in which it
        was characterized.

phenotypes:
- category: Skeletal
  name: Recurrent fractures
  description: >-
    Recurrent long-bone fractures, characteristically beginning around puberty,
    occurring despite radiographically dense and thickened diaphyses.
  phenotype_term:
    preferred_term: Recurrent fractures
    term:
      id: HP:0002757
      label: Recurrent fractures
  evidence:
  - reference: PMID:28176803
    reference_title: "Three novel ANO5 missense mutations in Caucasian and Chinese families and sporadic cases with gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One Caucasian family with seven affected members exhibited frequent bone
      fractures and florid osseous dysplasia (p.Cys356Tyr), while one Chinese family
      with two affected members suffered from cementoma and purulent osteomyelitis
      (p.Cys360Tyr).
    explanation: >-
      Reports frequent bone fractures in a genotyped seven-member GDD family.

- category: Skeletal
  name: Diaphyseal sclerosis
  description: >-
    Sclerosis of the diaphyses of the tubular bones, an osteopetrosis-like
    radiographic appearance that coexists paradoxically with fragility.
  phenotype_term:
    preferred_term: Diaphyseal sclerosis
    term:
      id: HP:0003034
      label: Diaphyseal sclerosis
  evidence:
  - reference: PMID:27541832
    reference_title: "A Novel ANO5 Mutation Causing Gnathodiaphyseal Dysplasia With High Bone Turnover Osteosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gnathodiaphyseal dysplasia (GDD) is a rare skeletal syndrome that involves an
      osteopetrosis-like sclerosis of the long bones and fibrous dysplasia-like
      cemento-osseous lesions of the jawbone.
    explanation: >-
      Describes the long-bone sclerosis that defines the diaphyseal half of the
      disease name.

- category: Skeletal
  name: Osteopenia
  description: >-
    Reduced bone mineral density. This is NOT a universal GDD feature and is the
    reason bone mass is curated as a variant-class-stratified split rather than a
    single direction: a family carrying the p.L370_A371insDYWRLNSTCL frameshift
    presented with osteopenia and decreased BMD throughout the body, while the
    p.Ser500Phe patient assessed by DXA and HR-pQCT had increased trabecular bone
    mass. Both are GDD. See the `ano5_deficiency_model` hypothesis group.
  phenotype_term:
    preferred_term: Osteopenia
    term:
      id: HP:0000938
      label: Osteopenia
  evidence:
  - reference: PMID:35982081
    reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      First, our GDD family with the mutation did not have a history of severe bone
      fractures, although it presented decreased BMD throughout the body.
    explanation: >-
      Documents the low-bone-mass GDD presentation, which is the counterpart of the
      high-bone-mass presentation cited on the diaphyseal-sclerosis phenotype.

- category: Skeletal
  name: Cortical thickening of long bone diaphyses
  description: >-
    Cortical thickening of the femoral and tibial diaphyses, recapitulated in both
    the Ano5 knockout and the p.Cys360Tyr knock-in mouse.
  phenotype_term:
    preferred_term: Cortical thickening of long bone diaphyses
    term:
      id: HP:0005791
      label: Cortical thickening of long bone diaphyses
  evidence:
  - reference: PMID:34841576
    reference_title: "Introduction of a Cys360Tyr Mutation in ANO5 Creates a Mouse Model for Gnathodiaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous Ano5 knock-in mice (Ano5KI/KI ) replicated GDD-like skeletal features,
      including massive jawbones, bowing tibia, bone fragility, sclerosis, and cortical
      thickening of the femoral and tibial diaphysis.
    explanation: >-
      Model-organism corroboration of diaphyseal cortical thickening; the human
      evidence is the accompanying PMID:28176803 item, which is what actually
      substantiates the phenotype.
  - reference: PMID:28176803
    reference_title: "Three novel ANO5 missense mutations in Caucasian and Chinese families and sporadic cases with gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      his radiographs showed gross thickening of the diaphyseal cortices of long bones
      with narrow medullary canals
    explanation: >-
      Direct human radiographic documentation of diaphyseal cortical thickening in a
      genotyped GDD patient, so this phenotype does not rest on mouse data alone.

- category: Skeletal
  name: Cementoma
  description: >-
    Expansile cemento-osseous fibrous lesions of the mandible and maxilla,
    histologically cementum-like calcified deposits in a fibroblastic stroma, often
    multi-quadrant.
  phenotype_term:
    preferred_term: Cementoma
    term:
      id: HP:0012328
      label: Cementoma
  evidence:
  - reference: PMID:28176803
    reference_title: "Three novel ANO5 missense mutations in Caucasian and Chinese families and sporadic cases with gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One Caucasian family with seven affected members exhibited frequent bone
      fractures and florid osseous dysplasia (p.Cys356Tyr), while one Chinese family
      with two affected members suffered from cementoma and purulent osteomyelitis
      (p.Cys360Tyr).
    explanation: >-
      Documents cementoma in a genotyped GDD family.

- category: Skeletal
  name: Mandibular osteomyelitis
  description: >-
    Purulent osteomyelitis of the jaws, characteristically emerging in adult life and
    a major source of morbidity in the founding kindred.
  phenotype_term:
    preferred_term: Mandibular osteomyelitis
    term:
      id: HP:0007626
      label: Mandibular osteomyelitis
  evidence:
  - reference: PMID:28176803
    reference_title: "Three novel ANO5 missense mutations in Caucasian and Chinese families and sporadic cases with gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      first described in a large Japanese family including 21 patients exhibiting
      frequent bone fractures in adolescence and purulent osteomyelitis of the jaws
      during adult life
    explanation: >-
      Documents purulent jaw osteomyelitis as an adult-onset feature of GDD.

- category: Skeletal
  name: Bowing of the legs
  description: >-
    Bowing of the lower limbs, which can be the presenting prenatal sign - two fetal
    GDD cases came to diagnosis through bone bowing on antenatal imaging.
  phenotype_term:
    preferred_term: Bowing of the legs
    term:
      id: HP:0002979
      label: Bowing of the legs
  evidence:
  - reference: PMID:38922934
    reference_title: "Gnathodiaphyseal dysplasia: Diagnostic clues from two fetal cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cases involved two fetuses exhibiting bone bowing, which led to the diagnosis
      of GDD.
    explanation: >-
      Establishes bone bowing as a recognized, and potentially prenatal, GDD
      presentation.

- category: Laboratory
  name: Elevated circulating alkaline phosphatase concentration
  description: >-
    Elevated serum alkaline phosphatase, reflecting the high-turnover state, is
    reported in GDD patients and reproduced in both the knockout and knock-in mouse
    models.
  phenotype_term:
    preferred_term: Elevated circulating alkaline phosphatase concentration
    term:
      id: HP:0003155
      label: Elevated circulating alkaline phosphatase concentration
  evidence:
  - reference: PMID:34841576
    reference_title: "Introduction of a Cys360Tyr Mutation in ANO5 Creates a Mouse Model for Gnathodiaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Serum alkaline phosphatase (ALP) levels were elevated in Ano5KI/KI mice as in GDD
      patients with p.Cys360Tyr mutation.
    explanation: >-
      Reports elevated ALP in the knock-in mouse and states the same finding in the
      corresponding human patients; paired below with direct human evidence so this
      phenotype does not rest on mouse data alone.
  - reference: PMID:37649308
    reference_title: "Familial gigantiform cementoma with recurrent ANO5 p.Cys356Tyr mutations: Clinicopathological and genetic study with literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a slight increase in alkaline phosphatase levels in the blood before
      the last surgery.
    explanation: >-
      Human ALP elevation in an ANO5 p.Cys356Tyr patient. PARTIAL because it is a
      single case and the rise is described as slight; the same paper records another
      patient whose ALP was normal, so this is not a constant finding.

- category: Craniofacial
  name: Abnormality of the dentition
  description: >-
    Dental involvement is a common and often presenting feature: recurrent dental
    infections, tooth displacement by the expanding jaw lesions, failed extraction
    healing and tooth loss. It is curated without a `frequency:` band - aggregated
    literature percentages exist but are not stated in any cached abstract, and they
    are ascertainment-biased because most GDD patients reach diagnosis through a
    maxillofacial or dental route in the first place.
  phenotype_term:
    preferred_term: Abnormality of the dentition
    term:
      id: HP:0000164
      label: Abnormality of the dentition
  evidence:
  - reference: PMID:38922934
    reference_title: "Gnathodiaphyseal dysplasia: Diagnostic clues from two fetal cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical manifestations range from recurrent dental infections with mild jaw
      lesions to severe bone fragility with several fractures associated with large jaw
      lesions requiring disfiguring surgeries.
    explanation: >-
      Places recurrent dental infection at the mild end of the GDD clinical spectrum,
      establishing dental involvement as a disease manifestation.

- category: Craniofacial
  name: Abnormal mandible morphology
  description: >-
    Progressive expansion and deformity of the mandible and maxilla from the
    fibro-osseous lesions, producing maxillofacial disfigurement and malocclusion.
  phenotype_term:
    preferred_term: Abnormal mandible morphology
    term:
      id: HP:0000277
      label: Abnormal mandible morphology
  evidence:
  - reference: PMID:41193275
    reference_title: "Double jaw surgery for a patient with Gnathodiaphyseal dysplasia (GDD): A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients typically present with pathological fractures, muscle weakness, and
      jawbone deformities.
    explanation: >-
      States jawbone deformity as a typical GDD presentation.

histopathology:
- name: Jaw fibro-osseous lesion histology
  description: >-
    Cementum-like calcified deposits scattered within a fibroblastic stroma, with
    psammomatoid bodies and abundant mineralization of vessel walls. Riminucci et al.
    used precisely this histology to separate the entity from the sclerosing
    disorders, since osteosclerosis is NOT a feature of the jaw lesion even though it
    defines the long-bone lesion. Psammomatoid bodies are characteristic but not
    invariable, so their absence does not exclude the diagnosis.
  diagnostic: true
  evidence:
  - reference: PMID:37649308
    reference_title: "Familial gigantiform cementoma with recurrent ANO5 p.Cys356Tyr mutations: Clinicopathological and genetic study with literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Riminucci et al. have described the histopathological features of jaw lesions,
      including cementum‐ossifying fibroma, psammomatoid bodies, and abundant
      mineralization in the vessel wall, and refined the name of this disease entity to
      gnathodiaphyseal dysplasia, as osteosclerosis is not a feature of the jaw lesions
      in this syndrome
    explanation: >-
      Gives the defining histological features and the explicit statement that the jaw
      lesion is not osteosclerotic - which is why this entry models the gnathic and
      diaphyseal components as separate nodes rather than one pathology in two sites.

diagnosis:
- name: Recognition and misdiagnosis
  description: >-
    GDD is substantially under-recognized. Two thirds of molecularly confirmed cases
    were initially given another diagnosis, most often osteogenesis imperfecta or
    fibrous dysplasia, and clinicians continue to manage it as an OI variant. The
    diagnostic combination that should prompt ANO5 testing is the one that makes no
    sense under either alternative: recurrent fractures together with expansile
    cemento-osseous jaw lesions, with diaphyseal sclerosis and cortical thickening on
    radiographs rather than the osteopenia expected in OI.
  evidence:
  - reference: PMID:30554457
    reference_title: "Novel ANO5 mutation c.1067G>T (p.C356F) identified by whole genome sequencing in a big family with atypical gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      67% of GDD cases confirmed by molecular testing were initially misdiagnosed.
    explanation: >-
      Quantifies the misdiagnosis rate, which is the practical reason this entry exists
      as a distinct disease rather than as a note on osteogenesis imperfecta.
- name: Osteological assessment (densitometry, HR-pQCT, turnover markers)
  description: >-
    Because GDD's bone-mass direction is not uniform, densitometry plus
    high-resolution peripheral quantitative CT plus serum turnover markers together
    establish which presentation a given patient has - and that determines whether an
    antiresorptive or an osteoanabolic is directionally appropriate. This combination is
    what established the high-turnover osteosclerotic phenotype in the p.Ser500Phe
    patient; iliac crest biopsy added histomorphometric confirmation.
  diagnosis_term:
    preferred_term: dual-energy X-ray absorptiometry with HR-pQCT and bone turnover markers
    term:
      id: NCIT:C48789
      label: Dual X-ray Absorptiometry
  evidence:
  - reference: PMID:27541832
    reference_title: "A Novel ANO5 Mutation Causing Gnathodiaphyseal Dysplasia With High Bone Turnover Osteosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we focused on a full osteologic assessment using dual-energy X-ray absorptiometry
      (DXA), high-resolution peripheral quantitative computed tomography (HR-pQCT), and
      serum analyses
    explanation: >-
      Names the modality combination used to characterize GDD bone status. The same paper
      opens by stating there is still no established consensus regarding the bone status
      of GDD patients, which is why this assessment is informative rather than routine.

- name: Radiographic jaw and long-bone surveillance
  description: >-
    Radiography carries the diagnosis and tracks it over decades: the jaw lesion by
    dental and panoramic imaging, the long bones by plain films. A patient followed from
    age one to over forty showed diaphyseal cortical widening at three years, sclerosis
    adjacent to the permanent tooth roots at nine, and a clearly denser mass once the
    secondary dentition completed at fourteen. Because the diaphyseal change precedes the
    jaw lesion, imaging both compartments is what makes the combination recognizable
    before it is obvious.
  diagnosis_term:
    preferred_term: serial radiography of the jaws and long bones
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  evidence:
  - reference: PMID:40861765
    reference_title: "A Long-Term (41 Years) Radiographic Follow-Up Study of the Onset and Development of a Jawbone Lesion in a Patient With Gnathodiaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report describes the long-term radiographic follow-up study of jaw lesions in
      a GDD-affected woman of >40 years of age from the age of one onward.
    explanation: >-
      Establishes serial radiography as the modality by which GDD jaw lesions are
      detected and followed over time.

- name: Molecular confirmation
  description: >-
    Diagnosis is confirmed molecularly. Because the GDD allele spectrum is tightly
    clustered, targeted ANO5 sequencing is informative; exome or genome sequencing is
    used when the presentation is atypical or the differential is broad, and was how
    the two reported prenatal cases were resolved.
  evidence:
  - reference: PMID:38922934
    reference_title: "Gnathodiaphyseal dysplasia: Diagnostic clues from two fetal cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic techniques depend on the context and include targeted genetic testing
      of ANO5, untargeted molecular analysis with whole-exome sequencing, or
      whole-genome sequencing.
    explanation: >-
      States the molecular diagnostic strategies and that the choice is
      context-dependent.

biochemical:
- name: Bone turnover markers
  notes: >-
    Serum markers of bone formation and resorption. Their DIRECTION is
    sub-entity-dependent and must not be curated as a single expectation: the
    high-turnover osteosclerotic presentation shows elevated formation and resorption
    markers with markedly increased osteoblast and osteoclast indices on iliac crest
    biopsy, whereas the osteopenic presentation has been reported with decreased bone
    mineral density. Alkaline phosphatase is the routinely available marker and is
    curated separately as a phenotype.
  evidence:
  - reference: PMID:27541832
    reference_title: "A Novel ANO5 Mutation Causing Gnathodiaphyseal Dysplasia With High Bone Turnover Osteosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We thereby identified increased trabecular bone mass accompanied by elevated
      serum markers of bone formation and bone resorption.
    explanation: >-
      Documents the elevated-marker, high-turnover pattern in a genetically confirmed
      patient.
  - reference: PMID:35982081
    reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      First, our GDD family with the mutation did not have a history of severe bone
      fractures, although it presented decreased BMD throughout the body.
    explanation: >-
      The contrasting low-bone-mass presentation, which is why marker direction is
      recorded as sub-entity-dependent rather than fixed.

differential_diagnoses:
- name: Osteogenesis imperfecta
  description: >-
    The historical misdiagnosis, and still the commonest one. GDD was originally
    named "osteogenesis imperfecta with unusual skeletal lesions"; both cause
    recurrent fractures, but GDD adds diaphyseal sclerosis with cortical thickening
    and gnathic fibro-osseous lesions, whereas OI bone is typically osteopenic.
  evidence:
  - reference: PMID:41193275
    reference_title: "Double jaw surgery for a patient with Gnathodiaphyseal dysplasia (GDD): A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, clinicians are still largely unaware of this entity and continue to
      label and treat it as a variation of Osteogenesis Imperfecta.
    explanation: >-
      States that GDD continues to be misclassified as osteogenesis imperfecta in
      practice.
- name: Cherubism
  description: >-
    Also presents with fibro-osseous lesions of the jawbones, and is a documented
    misdiagnosis: one family was initially diagnosed as cherubism, found to have no
    pathogenic SH3BP2 variant, and resolved to a novel ANO5 p.Cys356Phe allele by
    genome sequencing. A negative SH3BP2 result in a jaw fibro-osseous kindred should
    prompt ANO5 testing.
  evidence:
  - reference: PMID:30554457
    reference_title: "Novel ANO5 mutation c.1067G>T (p.C356F) identified by whole genome sequencing in a big family with atypical gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A family with patients with fibro-osseous lesions of the jawbones were initially
      diagnosed with cherubism. Sequencing of SH3BP2, which is the causal gene of
      cherubism, revealed no pathogenic mutation.
    explanation: >-
      Documents cherubism as a real-world GDD misdiagnosis and the SH3BP2-negative
      result that redirected the workup to ANO5.
- name: Fibrous dysplasia and McCune-Albright syndrome
  description: >-
    Share fibro-osseous jaw lesions, but are caused by activating GNAS1 mutations
    and are mosaic or somatic rather than germline dominant.
  evidence:
  - reference: PMID:28176803
    reference_title: "Three novel ANO5 missense mutations in Caucasian and Chinese families and sporadic cases with gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GDD shares clinical and pathological features of syndromes involving fibro-osseous
      jaw lesions, most notably fibrous dysplasia (FD) and McCune-Albright syndrome
      (MAS).
    explanation: >-
      Names the fibro-osseous differentials and, in the same passage, the distinct GNAS1
      basis that separates them.
- name: ANO5-related limb-girdle muscular dystrophy R12
  description: >-
    The allelic recessive myopathy, curated as
    Autosomal_Recessive_Limb-Girdle_Muscular_Dystrophy. Same gene, biallelic
    loss-of-function alleles, adult-onset proximal weakness with high CK, and no
    skeletal dysplasia. It is a differential only in the sense that an ANO5 variant
    report must be interpreted against zygosity and allele class before a phenotype
    is assigned.
  evidence:
  - reference: PMID:32112655
    reference_title: "TMEM16E/ANO5 mutations related to bone dysplasia or muscular dystrophy cause opposite effects on lipid scrambling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations in the human TMEM16E/ANO5 gene are causative for gnathodiaphyseal
      dysplasia (GDD), a rare bone malformation and fragility disorder, and for two
      types of muscular dystrophy (MD).
    explanation: >-
      Establishes that the two disorders are allelic at ANO5, which is what makes
      zygosity and allele class the discriminating information.

treatments:
- name: Bisphosphonate Therapy (Pamidronate)
  description: >-
    Intravenous pamidronate has been given to GDD patients with low bone mass and
    fractures. The evidence is case-level - a child treated with seven infusions from
    15 months of age, and a separate patient whose osteopenia was managed with
    pamidronate - and no controlled data exist.

    The mechanistic caveat is the important part and follows directly from the
    sub-entity split this entry curates. An antiresorptive suppresses bone resorption,
    which is coherent for the low-bone-mass, osteopenic GDD sub-entity, but is the
    wrong direction for the high-turnover osteosclerotic sub-entity, where trabecular
    bone mass is already increased. Bone mass and turnover markers should therefore be
    established before an antiresorptive is chosen, rather than inferring from the
    diagnosis alone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pamidronate
      term:
        id: CHEBI:7903
        label: pamidronate
  target_mechanisms:
  - target: High-Turnover Skeletal Remodelling Imbalance
    treatment_effect: INHIBITS
    description: >-
      Suppresses the osteoclastic resorption arm of the remodelling imbalance.
      Directionally appropriate only for the low-bone-mass sub-entity.
  evidence:
  - reference: PMID:29175271
    reference_title: "Gnathodiaphyseal dysplasia: Severe atypical presentation with novel heterozygous mutation of the anoctamin gene (ANO5)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We assessed his response to a total of 7 pamidronate infusions commencing at age
      15months
    explanation: >-
      Documents pamidronate exposure in a GDD patient. PARTIAL because it is a single
      case and the snippet records that a response was assessed, not that a particular
      benefit was established.
  - reference: PMID:28176803
    reference_title: "Three novel ANO5 missense mutations in Caucasian and Chinese families and sporadic cases with gnathodiaphyseal dysplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The osteopenia is being treated with pamidronate.
    explanation: >-
      A second, independent report of pamidronate use, and notably in an OSTEOPENIC
      patient - the sub-entity for which an antiresorptive is directionally
      appropriate.

- name: Osteoanabolic Therapy (Parathyroid Hormone) - Preclinical Only
  description: >-
    Parathyroid hormone enhanced bone strength in Ano5-knockout mice. This is a mouse
    result in a genotype that does not correspond to human GDD, and no human GDD
    patient has been reported treated with an osteoanabolic. It is curated because it
    is the only pharmacological rescue reported for any ANO5 bone model, and because
    it is the directional complement of the bisphosphonate entry: osteoanabolic for
    low bone mass, antiresorptive for high turnover. This is NOT a clinical
    recommendation.

    No `therapeutic_agent` is bound, deliberately. The source says "parathyroid
    hormone" without naming an analogue. Teriparatide has both CHEBI and NCIT
    identities and would be the obvious binding, but it is specifically PTH 1-34, and
    asserting it would attribute an agent the paper does not specify; neither ontology
    offers a plain "parathyroid hormone" therapeutic term. Left unbound rather than
    made precise beyond the evidence.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: High-Turnover Skeletal Remodelling Imbalance
    treatment_effect: MODULATES
    description: >-
      Shifts the remodelling balance towards formation; demonstrated only in the
      low-bone-mass null mouse.
  evidence:
  - reference: PMID:35982081
    reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Osteoanabolic treatment of parathyroid hormone was effective in enhancing bone
      strength in Ano5 KO mice.
    explanation: >-
      Model-organism evidence only, in a null genotype unlike human GDD, hence PARTIAL
      and explicitly not a treatment recommendation.

- name: Orthognathic and Reconstructive Jaw Surgery
  description: >-
    Surgical management of the expansile gnathic lesions and the resulting
    malocclusion and facial deformity. Orthognathic surgery (Le Fort I advancement
    with bilateral sagittal split osteotomy) has been performed safely in a GDD
    patient with stable two-year occlusal follow-up, but the evidence base is single
    case reports and best practices are not established. This is anatomical
    correction, not disease modification; no therapy targeting the ANO5 mechanism
    exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Mandibular Osteomyelitis and Facial Deformity
    treatment_effect: MODULATES
    description: >-
      Alters the anatomical outcome node - the deformity and malocclusion produced by
      the jaw lesions - without acting on any upstream mechanism node.
  evidence:
  - reference: PMID:41193275
    reference_title: "Double jaw surgery for a patient with Gnathodiaphyseal dysplasia (GDD): A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was treated with LeFort 1 advancement and Bilateral Sagittal Split Osteotomy of
      the mandible with setback procedures. No complications were seen and 2-year
      follow-up showed stable dental occlusion.
    explanation: >-
      Documents the orthognathic procedure and its two-year outcome in a GDD patient.
  - reference: PMID:41193275
    reference_title: "Double jaw surgery for a patient with Gnathodiaphyseal dysplasia (GDD): A case report and literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other procedures are possible, but more research is needed to develop best
      practices for this disorder.
    explanation: >-
      The authors' own statement that the surgical evidence base is not yet sufficient
      to define standard management.

- name: Fracture Fixation and Orthopedic Management
  description: >-
    Operative fixation of pathological diaphyseal fractures. Sclerotic, thickened
    cortices make instrumentation technically demanding, and the reported experience
    is case-level.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Diaphyseal Sclerosis and Bone Fragility
    treatment_effect: MODULATES
    description: >-
      Symptomatic management of the fracture burden at the outcome node; it does not
      act on the ANO5 mechanism.
  evidence:
  - reference: PMID:33826556
    reference_title: "Surgical Treatment of Pathological Tibial Shaft Fracture in Adult Patient With Gnathodiaphyseal Dysplasia: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Internal fixation with the Ender nail was effective for the tubular bone with
      deformity. Callus formation was observed without delay.
    explanation: >-
      Reports the outcome of operative fixation in a GDD diaphyseal fracture,
      including the observation that callus formation was not delayed - relevant
      because sclerotic GDD bone might be expected to heal poorly.
  - reference: PMID:33826556
    reference_title: "Surgical Treatment of Pathological Tibial Shaft Fracture in Adult Patient With Gnathodiaphyseal Dysplasia: A Case Report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first report describing the treatment of fracture in an adult
      patient with gnathodiaphyseal dysplasia.
    explanation: >-
      Establishes how thin the evidence base is - a single adult case at the time of
      publication - which is why this treatment is not presented as standard practice.

animal_models:
- name: Ano5 p.Cys360Tyr knock-in mouse
  species: Mouse
  genotype: Ano5 knock-in homozygous for the murine equivalent of human ANO5 p.Cys360Tyr
  publication: PMID:34841576
  description: >-
    The first knock-in mouse carrying a human GDD missense allele. Homozygotes
    reproduce massive jawbones, tibial bowing, bone fragility, diaphyseal sclerosis
    and cortical thickening, and elevated serum ALP, together with increased
    osteoblastogenesis and decreased osteoclastogenesis with disrupted osteoclast
    actin rings.
  modeled_mechanisms:
  - target: Diaphyseal Sclerosis and Bone Fragility
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the cardinal long-bone features of GDD - sclerosis, cortical
      thickening, bowing and fragility - in a genotype matched to a human GDD allele.
    limitations: >-
      The phenotype is reported in homozygotes, whereas human GDD is heterozygous, so
      the model does not test dominance. A knock-in of a different human GDD allele
      (p.Ser500Phe, murine p.T491F) in an independent study produced no skeletal
      phenotype at all, so mouse results for GDD alleles are not consistent across
      alleles.
    readouts:
    - name: Femoral and tibial diaphyseal cortical thickness and sclerosis
      target: Diaphyseal Sclerosis and Bone Fragility
      direction: INCREASED
      interpretation: Structural correlate of the human diaphyseal sclerosis phenotype.
      evidence:
      - reference: PMID:34841576
        reference_title: "Introduction of a Cys360Tyr Mutation in ANO5 Creates a Mouse Model for Gnathodiaphyseal Dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Homozygous Ano5 knock-in mice (Ano5KI/KI ) replicated GDD-like skeletal
          features, including massive jawbones, bowing tibia, bone fragility, sclerosis,
          and cortical thickening of the femoral and tibial diaphysis.
        explanation: Reports the diaphyseal sclerosis and cortical thickening measurement.
    evidence:
    - reference: PMID:34841576
      reference_title: "Introduction of a Cys360Tyr Mutation in ANO5 Creates a Mouse Model for Gnathodiaphyseal Dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we generated the first knock-in mouse model for GDD with the expression of
        human mutation p.Cys360Tyr in ANO5.
      explanation: >-
        Establishes that the model carries a human GDD allele, making it informative for
        the skeletal node.
  - target: Dysregulated Osteoblast and Osteoclast Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Directly measures the two-lineage remodelling disturbance, with increased
      osteoblastogenesis and decreased osteoclastogenesis in primary cultures.
    limitations: >-
      Cultured calvarial osteoblasts and bone-marrow-derived macrophages are ex vivo
      readouts; the direction of the osteoclast effect is opposite to that reported for
      ANO5 overexpression in human cell systems.
    readouts:
    - name: Calvaria-derived osteoblast mineralization and osteoblastogenesis
      target: Dysregulated Osteoblast and Osteoclast Differentiation
      direction: INCREASED
      interpretation: Cellular correlate of the increased-osteoblast arm of the imbalance.
      evidence:
      - reference: PMID:34841576
        reference_title: "Introduction of a Cys360Tyr Mutation in ANO5 Creates a Mouse Model for Gnathodiaphyseal Dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Calvaria-derived Ano5KI/KI osteoblast cultures showed increased
          osteoblastogenesis, including hypermineralized bone matrix and enhanced bone
          formation-related factors expression.
        explanation: Reports the osteoblastogenesis and mineralization measurement.
    - name: Bone-marrow-derived osteoclastogenesis and actin ring formation
      target: Dysregulated Osteoblast and Osteoclast Differentiation
      direction: DECREASED
      interpretation: Cellular correlate of the osteoclast arm of the imbalance.
      evidence:
      - reference: PMID:34841576
        reference_title: "Introduction of a Cys360Tyr Mutation in ANO5 Creates a Mouse Model for Gnathodiaphyseal Dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Interestingly, Ano5KI/KI bone marrow-derived macrophage cultures showed
          decreased osteoclastogenesis, and Ano5KI/KI osteoclasts exhibited disrupted
          actin ring formation, which may be associated with some signaling pathways.
        explanation: Reports the osteoclastogenesis and actin-ring measurements.
    evidence:
    - reference: PMID:34841576
      reference_title: "Introduction of a Cys360Tyr Mutation in ANO5 Creates a Mouse Model for Gnathodiaphyseal Dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Calvaria-derived Ano5KI/KI osteoblast cultures showed increased
        osteoblastogenesis, including hypermineralized bone matrix and enhanced bone
        formation-related factors expression.
      explanation: >-
        A measured result in the knock-in model on both arms of the remodelling node,
        which is what makes this model informative for it.
  - target: Osteoclast Differentiation Blockade and Apoptosis
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      The Akt activator SC79 restores osteoclast formation in this genotype-matched
      knock-in - multinucleated TRAP-positive osteoclasts and actin rings reappear with
      the osteoclast effector programme re-expressed - while the mirror experiment in
      osteoblasts suppresses mineralization. One intervention corrects both arms.
    limitations: >-
      Ex vivo BMM and calvarial osteoblast cultures from homozygous knock-in mice, with
      no in vivo skeletal endpoint and no human data. SC79 is a research tool compound,
      not a therapeutic, which is why this is curated here and not under `treatments`.
    readouts:
    - name: TRAP-positive multinucleated osteoclast and actin ring formation after SC79
      target: Osteoclast Differentiation Blockade and Apoptosis
      direction: RESTORED
      interpretation: >-
        Pharmacological reversal of the osteoclast blockade, which is what establishes
        Akt as a causal intermediate rather than a correlate.
      evidence:
      - reference: PMID:39866532
        reference_title: "Ano5(Cys360Tyr) mutation leads to bone dysfunction of gnathodiaphyseal dysplasia via disturbing Akt signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Akt activation promoted the generation of TRAP-positive multinucleated
          osteoclasts and the formation of actin rings in Ano5 KI/KI BMMs cultures,
          accompanied by increased expression of Nfatc1, Trap, Dc-stamp, Mmp9, Ctsk, and
          Atp6v0d2.
        explanation: Reports the SC79 rescue measurements on the osteoclast arm.
    evidence:
    - reference: PMID:39866532
      reference_title: "Ano5(Cys360Tyr) mutation leads to bone dysfunction of gnathodiaphyseal dysplasia via disturbing Akt signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Akt activation by SC79 stimulation can obviously rescue abnormal increased
        osteogenesis and decreased osteoclastogenesis in Ano5 KI/KI mouse model
      explanation: >-
        The authors' summary that a single intervention rescues both arms, which is what
        makes this model informative for the signalling nodes.
  - target: Pro-Osteogenic Signalling Dysregulation in Osteoblasts
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      The AMPK inhibitor Compound C reverses the skeletal phenotype in this
      genotype-matched knock-in, restraining formation and restoring osteoclastogenesis
      by suppressing PGC1a and promoting PGC1b.
    limitations: >-
      Compound C is a non-selective research tool with well-documented off-target
      activity, and the result is mouse-only. Not curated as a treatment.
    readouts:
    - name: Bone phenotype after AMPK inhibition
      target: Pro-Osteogenic Signalling Dysregulation in Osteoblasts
      direction: RESTORED
      interpretation: Reversal of the remodelling imbalance by blocking the AMPK arm.
      evidence:
      - reference: PMID:41717545
        reference_title: "Anoctamin 5 mutation leads to abnormal bone homeostasis of GDD by regulating AMPK-dependent glucose metabolism."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          AMPK inhibitor reversed the bone phenotype of GDD by restraining bone formation
          and restoring osteoclastogenesis.
        explanation: Reports the Compound C rescue of the skeletal phenotype.
    evidence:
    - reference: PMID:41717545
      reference_title: "Anoctamin 5 mutation leads to abnormal bone homeostasis of GDD by regulating AMPK-dependent glucose metabolism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Inhibiting AMPK reduced glycolysis in osteoblast and maintained the mitochondrial
        homeostasis between osteoblast and osteoclast by suppressing PGC1a and promoting
        PGC1b respectively, to restrain bone formation and restore osteoclastogenesis.
      explanation: >-
        Gives the mechanism by which the AMPK arm is corrected, tying the rescue to the
        glycolytic and mitochondrial changes curated on that node.

- name: Ano5 p.T491F knock-in mouse
  species: Mouse
  genotype: Ano5 p.T491F knock-in (murine equivalent of human ANO5 p.Ser500Phe), heterozygous and homozygous
  publication: PMID:32455153
  description: >-
    A knock-in of the murine equivalent of a human GDD-causing allele taken from a
    thoroughly phenotyped patient. Despite radiography, micro-CT and undecalcified
    histomorphometry at two ages in males, with confirmation in females and in a
    second independent clone, no skeletal or mandibular phenotype was found.
  modeled_mechanisms:
  - target: Diaphyseal Sclerosis and Bone Fragility
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      A genotype-matched GDD allele that produces no bone phenotype in mouse, in
      direct conflict with the human disease and with the p.Cys360Tyr knock-in.
    limitations: >-
      Mice were assessed only under unchallenged conditions and only to 24 weeks, so a
      late or stress-dependent phenotype is not excluded; the authors nonetheless
      conclude Ano5 is dispensable for murine bone homeostasis. Construct validity is
      the more specific concern: the mutated residue is not conserved, so the human
      Ser-to-Phe change corresponds to a Ter-to-Phe change in mouse, and the knock-in
      may therefore not model the human lesion at all.
    evidence:
    - reference: PMID:32455153
      reference_title: "Gnathodiaphyseal dysplasia is not recapitulated in a respective mouse model carrying a mutation of the Ano5 gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These mice did not display alterations of skeletal microarchitecture or mandible
        morphology. The results were confirmed in female mice and animals derived from a
        second, independent clone.
      explanation: >-
        The negative result, with the replication that makes it a substantive negative
        claim rather than an underpowered one.

- name: Ano5 knockout mouse
  species: Mouse
  genotype: Ano5 homozygous knockout (CRISPR/Cas9)
  publication: PMID:30712070
  description: >-
    Complete Ano5 loss of function in mouse. Homozygous null animals develop several
    cardinal GDD traits with elevated serum ALP and increased osteoblastogenesis -
    which is mechanistically awkward, since in humans it is biallelic loss of
    function that causes myopathy rather than bone disease.
  modeled_mechanisms:
  - target: Diaphyseal Sclerosis and Bone Fragility
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces GDD-like jawbone enlargement, tibial bowing and diaphyseal sclerosis
      with cortical thickening, but from a genotype that does not correspond to human
      GDD.
    limitations: >-
      The genotype is a homozygous null, whereas human GDD is heterozygous missense and
      human biallelic ANO5 null alleles cause muscular dystrophy, not bone disease. Its
      GDD-like readout therefore cannot be read as validating a loss-of-function
      mechanism for human GDD; it is evidence that murine and human ANO5 skeletal
      requirements differ.
    readouts:
    - name: Mandibular size, tibial bowing and diaphyseal sclerosis
      target: Diaphyseal Sclerosis and Bone Fragility
      direction: INCREASED
      interpretation: >-
        GDD-like skeletal changes arising from a null genotype, the observation that
        drives the alternative deficiency hypothesis.
      evidence:
      - reference: PMID:30712070
        reference_title: "Genetic Disruption of Anoctamin 5 in Mice Replicates Human Gnathodiaphyseal Dysplasia (GDD)."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Homozygous Ano5 knockout mice (Ano5-/-) replicate some typical traits of human
          GDD including massive jawbones, bowing tibia, sclerosis and cortical thickening
          of femoral and tibial diaphyses.
        explanation: Reports the skeletal measurements in the null mouse.
    evidence:
    - reference: PMID:30712070
      reference_title: "Genetic Disruption of Anoctamin 5 in Mice Replicates Human Gnathodiaphyseal Dysplasia (GDD)."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Bone matrix is hypermineralized, and the expression of bone formation-related
        factors is enhanced in Ano5-/- mice, suggesting that the osteogenic anomaly
        arises from a genetic disruption of Ano5.
      explanation: >-
        Supports the model as informative about ANO5 and bone, while the genotype
        mismatch keeps the support partial.
  - target: Pro-Osteogenic Signalling Dysregulation in Osteoblasts
    relationship: RESCUES
    fidelity: LOW
    description: >-
      Two independent in vivo rescues of the osteogenic excess in Ano5-null mice: the
      autophagy inhibitor 3-methyladenine alleviates the bone phenotype, and miR-34c-5p
      delivered by AAV rescues the abnormally thickened cortical bone, improves
      biomechanics and lowers serum P1NP. Both establish their arm as causal rather than
      correlative.
    limitations: >-
      Fidelity is LOW for a specific reason, not a generic one: these rescues are in a
      homozygous NULL, and human GDD is heterozygous missense while human biallelic ANO5
      null alleles cause muscular dystrophy rather than bone disease. A rescue that works
      in this genotype does not establish the arm is operating in human GDD. 3-MA is
      also a non-selective autophagy inhibitor.
    readouts:
    - name: Cortical thickness, biomechanics and serum P1NP after miR-34c-5p AAV
      target: Pro-Osteogenic Signalling Dysregulation in Osteoblasts
      direction: RESTORED
      interpretation: >-
        In vivo reversal of the cortical phenotype through the miR-34c-5p/KLF4/
        beta-catenin arm, with a serum bone-formation marker moving in the same
        direction.
      evidence:
      - reference: PMID:40508076
        reference_title: "Ano5 Deficiency Leads to Abnormal Bone Formation via miR-34c-5p/KLF4/beta-Catenin in Gnathodiaphyseal Dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Furthermore, miR-34c-5p adeno-associated virus (AAV) treatment in vivo rescued
          the abnormally thickened cortical bone and enhanced biomechanical properties in
          Ano5-/- mice.
        explanation: Reports the in vivo AAV rescue measurements.
    - name: Bone phenotype after 3-methyladenine
      target: Pro-Osteogenic Signalling Dysregulation in Osteoblasts
      direction: RESTORED
      interpretation: In vivo reversal through the autophagy arm.
      evidence:
      - reference: PMID:40067389
        reference_title: "Anoctamin-5 deficiency enhances ATG9A-dependent autophagy, inducing osteogenesis and gnathodiaphyseal dysplasia-like bone formation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Moreover, in vivo experiments confirmed that treatment with 3-MA alleviated the
          bone phenotype abnormalities in Ano5-/- mice.
        explanation: Reports the in vivo 3-MA rescue.
    evidence:
    - reference: PMID:40067389
      reference_title: "Anoctamin-5 deficiency enhances ATG9A-dependent autophagy, inducing osteogenesis and gnathodiaphyseal dysplasia-like bone formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The application of 3-methyladenine (3-MA) and chloroquine (CQ) reversed the
        excessive osteogenesis observed in Ano5-/- mCOBs.
      explanation: >-
        Two independent autophagy inhibitors reversing the phenotype, which is what makes
        this model informative for the osteoblast signalling node.
  - target: Osteoclast Differentiation Blockade and Apoptosis
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces the osteoclast blockade with suppressed RANKL/NF-kB signalling,
      disrupted actin rings and reduced resorption, plus ER-stress/CHOP-driven osteoclast
      apoptosis.
    limitations: >-
      Homozygous null genotype, not corresponding to human GDD; see the note on the other
      link from this model.
    readouts:
    - name: Osteoclast marker expression and resorption
      target: Osteoclast Differentiation Blockade and Apoptosis
      direction: DECREASED
      interpretation: The osteoclast-side deficit in the null mouse.
      evidence:
      - reference: PMID:36989132
        reference_title: "Genetic disruption of Ano5 leads to impaired osteoclastogenesis for gnathodiaphyseal dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Ano5-/- osteoclasts manifested disrupted actin ring and less mineral resorption.
        explanation: Reports the actin-ring and resorption measurements.
    evidence:
    - reference: PMID:40049314
      reference_title: "Ano5 deficiency disturbed bone formation by inducing osteoclast apoptosis in Gnathodiaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In summary, Ano5 deficiency impairs the function of osteoclasts by increasing
        osteoclast apoptosis, which is induced by an overactivated ERS response via
        calcium dyshomeostasis.
      explanation: >-
        Summarizes the ER-stress/apoptosis mechanism this model evidences for the
        osteoclast node.

- name: Ano5 knockout mouse (Li et al., low-bone-mass line)
  species: Mouse
  genotype: Ano5 homozygous and heterozygous knockout
  publication: PMID:35982081
  description: >-
    A second, independent Ano5-null line that reports the OPPOSITE skeletal direction
    from the Wang knockout: low bone volume, defective osteoblast and osteoclast
    differentiation, and diminished intracellular calcium oscillations, modelling the
    low-bone-mass GDD sub-entity rather than the osteosclerotic one. Heterozygotes
    show a milder version of the homozygous phenotype, which is the basis of the
    dosage-sensitivity argument. Parathyroid hormone rescued bone strength.
  modeled_mechanisms:
  - target: Dysregulated Osteoblast and Osteoclast Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Measures the two-lineage remodelling disturbance and ties it to calcium
      oscillations, WNT/beta-catenin and RANKL-NFATc1 signalling.
    limitations: >-
      A null genotype, whereas human GDD is heterozygous missense. Its direction of
      effect on osteoblasts is opposite to both the Wang null and the p.Cys360Tyr
      knock-in, so the three lines cannot all be describing the same biology.
    readouts:
    - name: Trabecular bone volume and osteoblast/osteoclast differentiation
      target: Dysregulated Osteoblast and Osteoclast Differentiation
      direction: DECREASED
      interpretation: >-
        The low-bone-mass arm of the proposed sub-entity split, opposite in sign to the
        other two mouse lines.
      evidence:
      - reference: PMID:35982081
        reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Moreover, using Ano5 knockout (KO) mice, we found that they exhibited low bone
          volume, abnormal calcium deposits, and defective osteoblast and osteoclast
          differentiation.
        explanation: Reports the bone-volume and differentiation measurements.
    evidence:
    - reference: PMID:35982081
      reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we show that ablation of Ano5 reduced intracellular calcium transients,
        leading to defects in osteogenesis and osteoclastogenesis and thus bone
        dysplasia.
      explanation: >-
        Establishes the mechanism this line is informative about at the cellular node.
  - target: High-Turnover Skeletal Remodelling Imbalance
    relationship: RESCUES
    fidelity: LOW
    description: >-
      Osteoanabolic parathyroid hormone restored bone strength in the null mouse - the
      only pharmacological rescue reported for any ANO5 bone model, and the origin of
      the osteoanabolic option recorded under treatments.
    limitations: >-
      Mouse only, in a null genotype that does not correspond to human GDD, and it
      rescues the low-bone-mass phenotype - so it says nothing about, and would be
      mechanistically wrong for, the osteosclerotic high-turnover sub-entity.
    readouts:
    - name: Bone strength after parathyroid hormone treatment
      target: High-Turnover Skeletal Remodelling Imbalance
      direction: RESTORED
      interpretation: Pharmacological reversal of the low-bone-mass phenotype.
      evidence:
      - reference: PMID:35982081
        reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Osteoanabolic treatment of parathyroid hormone was effective in enhancing bone
          strength in Ano5 KO mice.
        explanation: Reports the PTH rescue measurement.
    evidence:
    - reference: PMID:35982081
      reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Osteoanabolic treatment of parathyroid hormone was effective in enhancing bone
        strength in Ano5 KO mice.
      explanation: >-
        The rescue is real but in a non-corresponding genotype, so it is partial support
        for treating this node as pharmacologically addressable.

discussions:
- discussion_id: gdd_jaw_selectivity_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a heterozygous missense change in ANO5, a broadly expressed
    endoplasmic-reticulum phospholipid scramblase, produce focal expansile
    cemento-osseous lesions that are essentially confined to the tooth-bearing
    jaws, while the rest of the skeleton shows a diffuse high-turnover sclerosing
    phenotype instead?
  attaches_to:
  - pathophysiology#Jaw Cemento-Osseous Fibrous Lesion Formation
  rationale: >-
    This is the central unexplained feature of GDD and the reason the causal edge
    into the jaw lesion node is marked INDIRECT_UNKNOWN_INTERMEDIATES rather than
    DIRECT. The gnathic and extragnathic lesions are not the same pathology in two
    locations - jaw lesions are fibro-osseous and specifically lack the
    osteosclerosis that defines the long-bone lesion - so the disorder needs an
    account of tissue selectivity, not merely of bone-cell dysfunction. Candidate
    explanations include a neural-crest-derived versus mesoderm-derived skeletal
    origin, the distinct periodontal-ligament and cementoblast populations of the
    gnathic skeleton (ANO5 is expressed in periodontal ligament cells), and the
    continuous remodelling demand of tooth-bearing bone. None has been tested.
    Filling this gap with a plausible-sounding chain would misrepresent the state of
    the evidence.
  proposed_experiments:
  - experiment_id: gdd_lineage_conditional_knockin
    name: Lineage-resolved conditional ANO5 GDD-allele expression
    description: >-
      Express a GDD knock-in allele conditionally in neural-crest-derived versus
      mesoderm-derived skeletal lineages in mouse and ask whether jaw lesion
      formation tracks lineage rather than anatomical site.
  - experiment_id: gdd_jaw_lesion_single_cell
    name: Single-cell profiling of human GDD jaw lesion tissue
    description: >-
      Single-cell or spatial transcriptomic profiling of resected GDD gnathic lesions
      against uninvolved bone from the same patient, to identify the cell population
      that expands and whether it is cementoblast or periodontal-ligament derived.
  notes: >-
    Distinct from the mechanism-direction dispute recorded in
    `gdd_gof_vs_lof_dispute`: even if the gain-of-function reading is correct, the
    tissue-selectivity question remains open.

- discussion_id: gdd_gof_vs_lof_dispute
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the GDD skeletal phenotype driven by gain of ANO5 function, or can reduced
    ANO5 activity produce it too - and if the latter, why do heterozygous ANO5 null
    carriers (the parents of LGMDR12 patients) not develop bone disease?
  attaches_to:
  - pathophysiology#Altered Calcium-Activated Phospholipid Scrambling by TMEM16E
  rationale: >-
    The gain-of-function reading rests on strong but indirect grounds - dominant
    inheritance with a clustered missense spectrum, plus heterologous-expression
    assays in HEK293 cells showing GDD and muscular-dystrophy alleles moving in
    opposite directions. Three findings sit awkwardly with it. First, Ano5-knockout
    mice reproduce several cardinal GDD traits, which a strict gain-of-function
    model does not predict. Second, canonical GDD missense alleles reduce
    steady-state ANO5 protein in overexpression studies, so they are not purely
    hyperactive. Third, a GDD family has been reported with a frameshift insertion
    and reduced TMEM16E expression. The observation that obligate heterozygous null
    carriers of LGMDR12 alleles are not reported with bone disease remains the
    strongest argument against simple haploinsufficiency, but it is an argument from
    absence in a population that has not been systematically skeletally phenotyped,
    and that limitation should be stated rather than glossed.
  proposed_experiments:
  - experiment_id: gdd_null_carrier_skeletal_phenotyping
    name: Skeletal phenotyping of obligate ANO5 null heterozygotes
    description: >-
      Systematic dental panoramic imaging, long-bone radiography and bone-turnover
      marker assessment in obligate heterozygous carriers of ANO5 truncating alleles
      ascertained through LGMDR12 probands, to convert an argument from absence into a
      measured negative.
  - experiment_id: gdd_allelic_series_knockin
    name: Allelic series knock-in comparison in a single genetic background
    description: >-
      Compare knock-in of a GDD missense allele, a heterozygous null allele, and a
      homozygous null allele in one mouse background with identical skeletal
      phenotyping, to separate dosage effects from allele-specific activity.
  evidence:
  - reference: PMID:30712070
    reference_title: "Genetic Disruption of Anoctamin 5 in Mice Replicates Human Gnathodiaphyseal Dysplasia (GDD)."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we generated Ano5-knockout (KO) mice using a CRISPR/Cas 9 approach to study
      loss of function aspects of GDD mutations.
    explanation: >-
      Frames the loss-of-function investigation whose positive skeletal result is the
      main tension with the gain-of-function model.

- discussion_id: gdd_phenotypic_dichotomy_challenged
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How absolute is the separation between the ANO5 bone and muscle phenotypes,
    given a dominant kindred in which the functionally characterized GDD allele
    p.Thr513Ile produced both cemento-osseous jaw lesions and recurrent
    rhabdomyolysis with hyperCKemia?
  attaches_to:
  - pathophysiology#Heterozygous ANO5 Missense Variant
  rationale: >-
    The clean dichotomy - dominant missense to bone, recessive null to muscle - is
    the framing that motivates this entry, and it is largely right, but it is not
    absolute and the entry should not assert more than the literature supports. An
    11-member kindred carrying p.Thr513Ile showed recurrent rhabdomyolysis, muscle
    cramps, hyperCKemia and muscle hypertrophy alongside the mandibular
    cemento-osseous lesions, and the authors explicitly framed this as a challenge to
    the proposed dichotomy. If a single dominant allele can produce both tissue
    phenotypes, then allele class and tissue are not in one-to-one correspondence,
    and the gain-of-function versus loss-of-function assignment explains the
    inheritance pattern better than it explains the tissue distribution.
  proposed_experiments:
  - experiment_id: gdd_prospective_neuromuscular_assessment
    name: Prospective neuromuscular assessment of GDD cohorts
    description: >-
      Systematic CK measurement, muscle imaging and exertional-symptom history in
      genotyped GDD patients stratified by allele, to establish whether subclinical
      muscle involvement is specific to p.Thr513Ile or general to GDD.
  evidence:
  - reference: PMID:34291158
    reference_title: "Autosomal Dominant ANO5-Related Disorder Associated With Myopathy and Gnathodiaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report described the coexistence of muscle and bone phenotypes in the same
      patients with ANO5-related disorder.
    explanation: >-
      Documents the coexistence directly, which is what makes the dichotomy a curated
      question rather than a settled fact.
  - reference: PMID:34291158
    reference_title: "Autosomal Dominant ANO5-Related Disorder Associated With Myopathy and Gnathodiaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data challenge recent results that suggested complete dichotomy of these
      phenotypes and the proposed loss-of-function and gain-of-function mechanisms for
      the skeletal and muscle phenotypes, respectively.
    explanation: >-
      The authors' explicit statement that they are challenging the dichotomy this
      entry otherwise adopts as its organizing frame. Reader caution, since the quote
      is reproduced verbatim and must not be altered: the trailing "respectively"
      pairs loss-of-function with the SKELETAL phenotype and gain-of-function with the
      MUSCLE phenotype, which is the reverse of the assignment made everywhere else in
      this entry and in the functional literature (PMID:29124309, PMID:32112655, and
      this paper's own discussion). Treat the sentence as evidence that the dichotomy
      is being challenged, not as a source for which direction goes with which tissue.

- discussion_id: gdd_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the existing mouse models faithfully represent human GDD, given that a
    knock-in of the murine equivalent of a human GDD missense allele produced no
    skeletal phenotype at all, while Ano5 knockout - the genotype that in humans
    causes myopathy rather than bone disease - does produce GDD-like bone changes?
  attaches_to:
  - pathophysiology#Heterozygous ANO5 Missense Variant
  - pathophysiology#Altered Calcium-Activated Phospholipid Scrambling by TMEM16E
  rationale: >-
    The mouse evidence is internally inconsistent in a way that inverts the human
    genotype-phenotype relationship, so no mouse result about GDD mechanism can
    currently be transferred to human disease without argument. A p.T491F knock-in -
    the murine equivalent of the human p.Ser500Phe GDD allele, taken from a
    thoroughly characterized patient - showed no alteration of skeletal
    microarchitecture or mandible morphology in heterozygotes or homozygotes, assessed
    at two ages in males with the result confirmed in females and in an independent
    clone. Meanwhile Ano5 knockout mice, and a separate p.Cys360Tyr knock-in, do
    develop GDD-like massive jawbones, tibial bowing and diaphyseal cortical
    thickening.

    Worse, the two null lines disagree with EACH OTHER. Wang's knockout gave
    osteosclerosis and hypermineralized matrix; Li's knockout gave low bone volume
    with defective osteoblast and osteoclast differentiation. Li et al. state the
    non-replication plainly. So the model evidence is not merely
    positive-versus-negative: three independent lines carrying ANO5 lesions produce
    three different skeletal directions, and two of them share a genotype. Together
    with the null-models-a-missense-disease problem, this means the mouse literature
    cannot presently arbitrate the gain- versus loss-of-function question it is most
    often invoked to settle. There is at least one concrete, testable explanation for the negative
    knock-in rather than a bare species hand-wave: Li et al. point out the residue is
    not conserved - the human change is Ser to Phe while the murine equivalent is Ter
    to Phe - so the mouse allele may simply not be the same lesion, and they also
    argue the animals were phenotyped too late. That is an argument about construct
    validity, and it is why the negative result is recorded here as a mismatch to be
    resolved rather than as a refutation of the human mechanism.
  proposed_experiments:
  - experiment_id: gdd_harmonized_multiallele_phenotyping
    name: Harmonized multi-allele skeletal phenotyping
    description: >-
      Phenotype p.T491F, p.Cys360Tyr and null Ano5 alleles in one genetic background
      with a single harmonized imaging and histomorphometry protocol, to determine
      whether the discrepancy is allele-specific biology or protocol and background
      variation.
  - experiment_id: gdd_human_osteoblast_cementoblast_models
    name: Human osteoblast and cementoblast models of GDD alleles
    description: >-
      Patient-derived or isogenic iPSC-derived human osteoblasts and
      periodontal-ligament or cementoblast cultures carrying GDD alleles, to test the
      mechanism in human cells rather than relying on mouse models that disagree.
  evidence:
  - reference: PMID:32455153
    reference_title: "Gnathodiaphyseal dysplasia is not recapitulated in a respective mouse model carrying a mutation of the Ano5 gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These mice did not display alterations of skeletal microarchitecture or mandible
      morphology.
    explanation: >-
      The negative knock-in result: the murine equivalent of a human GDD allele
      produced no skeletal phenotype.
  - reference: PMID:32455153
    reference_title: "Gnathodiaphyseal dysplasia is not recapitulated in a respective mouse model carrying a mutation of the Ano5 gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, our results indicate that Ano5 is dispensable for bone homeostasis in
      mice, at least under unchallenged conditions, and that these animals may not
      present the most adequate model to study the physiological role of Anoctamin 5.
    explanation: >-
      The authors' own conclusion that the mouse is not an adequate model, which is the
      substance of this mismatch.
  - reference: PMID:34841576
    reference_title: "Introduction of a Cys360Tyr Mutation in ANO5 Creates a Mouse Model for Gnathodiaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous Ano5 knock-in mice (Ano5KI/KI ) replicated GDD-like skeletal features,
      including massive jawbones, bowing tibia, bone fragility, sclerosis, and cortical
      thickening of the femoral and tibial diaphysis.
    explanation: >-
      The contradicting positive knock-in result, in a different GDD allele, that makes
      the model evidence inconsistent rather than merely negative.
  - reference: PMID:35982081
    reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, the amino acid sequence is not conserved between humans and mice at
      that mutation site, where Ser is mutated to Phe in humans while Ter is mutated to
      Phe in mice.
    explanation: >-
      Supplies a specific construct-validity explanation for the negative knock-in - the
      mouse allele is not the homologous lesion - which converts an unexplained species
      discrepancy into a testable one.
  - reference: PMID:35982081
    reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      however, a similar skeletal phenotype could not be produced in another study
    explanation: >-
      Records the knockout-versus-knockout non-replication in the authors' own words -
      the sharpest form of the mismatch, since the same null genotype yields opposite
      bone-mass directions across laboratories. The clause immediately preceding this
      one in the source describes the increased BMD and bone matrix mineralization
      reported in the other Ano5 knockout; it is not quoted here only because an inline
      citation marker sits mid-sentence and would break verbatim matching.

notes: >-
  Entry-type decision (issue #9198): curated as a `DISEASE` in `kb/disorders/`.
  MONDO:0008151 has no MONDO descendants, so there is nothing to group; it is not a
  subtype of an existing dismech entry (its MONDO parent, MONDO:0800064, is an
  osteogenesis-imperfecta/reduced-bone-mineral-density grouping term that dismech
  does not curate as an entry); and it carries a single causal gene with a
  well-defined allele class, so it is neither a grouping nor out of scope.

  Deliberately NOT modelled here: the mechanism of the ANO5 muscular dystrophies.
  That belongs to `Autosomal_Recessive_Limb-Girdle_Muscular_Dystrophy`, which
  already curates ANO5/LGMDR12 as a subtype and as a `genetic:` entry. This entry
  references that mechanism only where the contrast does mechanistic work - the
  argument that GDD is not haploinsufficiency.

  No GeneReviews chapter exists for gnathodiaphyseal dysplasia (PubMed searches for
  `gnathodiaphyseal dysplasia GeneReviews` returned no results on 2026-08-21), so
  the GeneReviews phenotype baseline step was not applicable. A GeneReviews chapter
  does exist for ANO5 *muscle* disease, which is the allelic disorder curated
  elsewhere, not this one.

  Prevalence is curated only as the qualitative class ULTRA_RARE, with
  `rate_per_100000` deliberately unset. No population-based estimate for GDD exists,
  and the Orphanet bulk XML was not available in this worktree to cite an Orphanet
  prevalence band; asserting a numeric rate would be fabrication.

  No `mappings:` block. OMIM #166260 (the phenotype) and *608662 (the gene) are stated
  in several cited abstracts, and ORPHA:53697 exists, but `DiseaseMappings` provides
  only `icd10cm_mappings`, `icd11f_mappings`, `mondo_mappings` and `ncit_mappings` -
  there is no OMIM or ORPHA slot - and no cached source in this worktree states an
  ICD-10-CM or NCIT code for GDD. A mapping is an assertion like any other, so none is
  made rather than one guessed from a plausible-looking code.

  No `frequency:` band on ANY phenotype, entry-wide and deliberately. Aggregated
  percentages do exist - a literature review of 108 individuals across 25 families
  gives roughly 67% jaw lesions, 48% tooth anomalies, 45% fractures, 19% bowing, 16%
  diaphyseal thickening, 10% osteopenia. Two reasons they are not curated. First, the
  numbers are not stated in any cached abstract, so a `frequency:` value would carry a
  snippet that does not support it, which is exactly the failure the frequency-evidence
  SOP warns about. Second, they are literature-derived and biased in opposing
  directions - jaw lesions are over-counted because most patients reach diagnosis
  through a maxillofacial route, while mildly affected relatives inside reported
  pedigrees are systematically under-phenotyped. If the full text is later cached, these
  become curatable with the ascertainment caveat attached.

  `has_subtypes` decision: NOT split, deliberately, and this is the closest call in the
  entry. The high-bone-mass and low-bone-mass presentations are a real candidate split
  and have been proposed as GDD sub-entities assigned by variant class. They are not
  curated as `has_subtypes` because the split currently rests on two contrasting
  reports - one p.Ser500Phe patient with increased trabecular mass and one
  p.L370_A371ins family with osteopenia - plus a mechanistic model, and the allele-class
  rule that would assign a new patient to a subtype is precisely what is unproven.
  Creating subtypes now would harden a hypothesis into structure and force every
  downstream annotation to pick a side. Instead the split is carried where it can be
  revised: an EMERGING `mechanistic_hypotheses` entry, both phenotypes curated with no
  direction on bone mineral density, and a treatment caveat that the two directions
  imply opposite drug choices. Revisit if a cohort demonstrates the allele-class rule.

  Muscle phenotypes (rhabdomyolysis, hyperCKemia, muscle hypertrophy) are deliberately
  NOT curated as `phenotypes:` even though a GDD kindred exhibits them. They are
  reported in a single p.Thr513Ile family, and the whole point of this entry is that
  ANO5 muscle disease is the allelic recessive disorder curated elsewhere; promoting
  them to disease-level phenotypes of GDD would blur the distinction the entry exists to
  draw. They are instead recorded in `gdd_phenotypic_dichotomy_challenged`, which is the
  honest location for a documented exception.

  No `conforms_to` declared, deliberately. `osteoporosis_bone_resorption` was
  considered and declined: that module models net bone LOSS through increased
  osteoclastic resorption, whereas GDD's bone-mass direction is contested and
  variant-class-dependent, with the better-characterized presentations showing
  INCREASED trabecular bone mass. Declaring conformance would assert exactly the
  direction this entry records as unresolved. It should be revisited if the
  low-bone-mass sub-entity is confirmed as a distinct, separately curatable entity.
  Two other modules were checked and also declined: `defective_skeletal_mineralization`
  is the wrong shape, since GDD produces HYPERmineralized matrix and sclerosis rather
  than a failure to mineralize, and its three trigger arms (calciopenic, phosphopenic,
  inhibitor-excess) are all absent here; and `loss_of_proteostasis` is
  aggregate-centred, whereas the ANO5 defect is a membrane-transport activity change,
  not an aggregation or degradation-capacity problem, notwithstanding that GDD missense
  alleles reduce steady-state protein in overexpression. The KB has no sclerosing
  bone dysplasia / increased-bone-mass module; GDD plus the existing autosomal dominant
  osteopetrosis entry could seed one, which is a better follow-up than forcing a fit.

  Lump/split on familial gigantiform cementoma and familial florid cemento-osseous
  dysplasia: these are curated here as within the GDD spectrum rather than as separate
  entries or differentials, following the finding of recurrent ANO5 p.Cys356Tyr in FGC
  kindreds and the authors' conclusion that FGC may be an atypical GDD variant. They
  are not given `has_subtypes` entries because the evidence is three probands and the
  nosology is explicitly unsettled in the source.

  Follow-up worth a separate issue, deliberately not attempted here: a
  `kb/groupings/` entry over the fibro-osseous and giant-cell lesions of the jaws.
  dismech already curates Cherubism and Fibrous_Dysplasia; heterozygous ANO5 variants
  are now also reported in florid cemento-osseous dysplasia WITHOUT the
  diaphyseal/fragility component, which would make ANO5 a shared-mechanism thread
  through part of that family. A grouping needs its members curated first, and the
  FCOD reports are not yet curated as entries, so this is a pointer rather than a
  half-built union.

  HPO/HPOA coverage gap, recorded because it affects what can be annotated rather
  than being a defect in this entry: the HPOA annotations on OMIM:166260 carry the
  diaphyseal, bowing, fracture, osteopenia, osteomyelitis, onset and inheritance
  features but include NO jaw-lesion annotation at all - the defining feature of the
  disease. `HP:0012328` Cementoma exists and is used here with a more specific
  `preferred_term`; there is no HPO term for a fibro-osseous lesion as such. Both the
  missing annotation and the missing term are upstream issues.

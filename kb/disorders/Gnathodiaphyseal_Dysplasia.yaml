    explanation: >-
      Establishes the age-staged pattern of adolescent fractures followed by adult jaw
      osteomyelitis in the founding kindred.

mechanistic_hypotheses:
- hypothesis_group_id: gof_scramblase_model
  hypothesis_label: Gain-of-function scramblase model
  status: CANONICAL
  description: >-
    The prevailing model: heterozygous GDD missense alleles confer constitutive,
    calcium-independent phospholipid scrambling on TMEM16E, and that aberrant
    activity - not a shortfall of ANO5 - disturbs bone-cell behaviour. Its two
    supports are the dominant inheritance with a restricted missense spectrum, and
    the head-to-head functional comparison showing GDD and muscular-dystrophy
    alleles moving in opposite directions in the same assay. Its weakness is that
    the step from scrambling to a bone lesion, and above all to a jaw-restricted
    lesion, has not been demonstrated in bone tissue.
  evidence:
  - reference: PMID:32112655
    reference_title: "TMEM16E/ANO5 mutations related to bone dysplasia or muscular dystrophy cause opposite effects on lipid scrambling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Previous studies have demonstrated that TMEM16E/ANO5 is a Ca2+ -activated
      phospholipid scramblase and that the mutation c.1538C>T (p.Thr513Ile) causing
      GDD leads to a gain-of-function phenotype.
    explanation: >-
      States the gain-of-function characterization that this hypothesis group is built
      on.
  - reference: PMID:38922934
    reference_title: "Gnathodiaphyseal dysplasia: Diagnostic clues from two fetal cases and literature review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GDD is a rare but frequently inherited cause of bone fragility and jaw lesions
      characterized by a gain-of-function variant within the ANO5 gene.
    explanation: >-
      Shows the gain-of-function reading has been adopted as the working model in the
      contemporary clinical literature. Classified OTHER rather than HUMAN_CLINICAL
      because the sentence is a literature-review characterization, not an observation
      the authors made in their own patients.

- hypothesis_group_id: ano5_deficiency_model
  hypothesis_label: Variant-class-stratified GOF/LOF sub-entity model
  status: EMERGING
  description: >-
    A reading that does not compete with the gain-of-function model so much as
    subsume it, and that changes what a curator should record about bone mass.
    Li et al. propose that GDD comprises two sub-entities assigned by variant class
    rather than by clinical convention: gain-of-function alleles produce a
    HIGH-bone-mass phenotype through hyperactive phospholipid scrambling with
    increased osteoblast and osteoclast indices, while loss-of-function alleles
    produce a LOW-bone-mass, osteopenic phenotype through impaired calcium
    oscillations with decreased indices. The supporting observations are that
    Ano5-knockout mice replicate several cardinal GDD traits, and that a GDD family
    carrying a frameshift insertion with reduced TMEM16E presented with osteopenia
    rather than osteosclerosis. One frequently cited finding is NOT support for this
    model and should not be listed as such: reduced ANO5 in osteoblast precursors
    INCREASES osteoblastogenesis and mineralization, which runs opposite to the
    decreased-indices arm proposed here - Li et al. name that result themselves as
    partly contradicting their own conclusions. Li et al. further argue ANO5 is
    dosage-sensitive and
    that their heterozygous frameshift causes only PARTIAL loss of function, partly
    compensated by the normal allele - which is how a reduced-activity allele can be
    dominant without being a simple haploinsufficiency. The practical curation
    consequence is that this entry deliberately does NOT put a single INCREASED or
    DECREASED modifier on bone mineral density, because either would be wrong for one
    of the two sub-entities.
  evidence:
  - reference: PMID:35982081
    reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overall, our results suggest the existence of GDD-sub-entities with high and low
      BMD phenotypes due to different GOF and LOF mutations and functions.
    explanation: >-
      The authors' explicit statement of the two-sub-entity model that this hypothesis
      group records.
  - reference: PMID:35982081
    reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, our results suggest that ANO5 is dosage-sensitive and that LOF of the
      TMEM16E protein caused by the heterozygous ANO5 mutation in one allele is partly
      compensated by another normally functional allele.
    explanation: >-
      Supplies the dosage-sensitivity argument that lets a partial-loss-of-function
      allele be dominant without implying that a full null allele would be.
  - reference: PMID:30712070
    reference_title: "Genetic Disruption of Anoctamin 5 in Mice Replicates Human Gnathodiaphyseal Dysplasia (GDD)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous Ano5 knockout mice (Ano5-/-) replicate some typical traits of human
      GDD including massive jawbones, bowing tibia, sclerosis and cortical thickening
      of femoral and tibial diaphyses.
    explanation: >-
      A pure loss-of-function genotype reproducing GDD-like bone traits, which is the
      central difficulty for a strict gain-of-function-only account.
  - reference: PMID:35982081
    reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found a causative de novo ANO5 frameshift insertion mutation
      (p.L370_A371insDYWRLNSTCL) in a GDD family with osteopenia, accompanied by a
      decrease in TMEM16E expression
    explanation: >-
      Reports a GDD family whose allele is not a canonical missense change and is
      associated with reduced TMEM16E, supporting a reduced-activity route.
  - reference: PMID:28176803
    reference_title: "Three novel ANO5 missense mutations in Caucasian and Chinese families and sporadic cases with gnathodiaphyseal dysplasia."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      In vitro studies overexpressing GDD mutations (p.Cys356Tyr and p.Cys360Tyr)
      showed significantly reduced ANO5 protein.
    explanation: >-
      Shows canonical GDD missense alleles reduce steady-state protein, a partial
      bridge between the two models rather than a decisive result for either. Note the
      measurement is made in an overexpression system, as the snippet itself states,
      so it does not establish the protein level in patient bone.
  - reference: PMID:35982081
    reference_title: "Ano5 modulates calcium signaling during bone homeostasis in gnathodiaphyseal dysplasia."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The authors also noticed that calvaria-derived Ano5−/− and Ano5KI/KI osteoblasts
      show increased mineralization and osteoblastogenesis, which partly contradicts
      our conclusions
    explanation: >-
      The authors' own acknowledgement that the increased osteoblastogenesis seen in
      Ano5-deficient osteoblasts runs against the decreased-indices arm of their
      sub-entity model. Recorded as REFUTE so the contradiction is visible in the
      entry rather than only in the prose.


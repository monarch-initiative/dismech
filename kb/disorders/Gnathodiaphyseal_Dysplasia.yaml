  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    ANO5 (TMEM16E; originally GDD1) at 11p14.3-15.1 is the sole gene known to cause
    GDD. The GDD allele class is heterozygous missense; the same gene's biallelic
    truncating and loss-of-function alleles cause limb-girdle muscular dystrophy R12
    and Miyoshi-like distal myopathy, curated in
    Autosomal_Recessive_Limb-Girdle_Muscular_Dystrophy. Obligate heterozygous
    carriers of those null alleles - the parents of affected LGMDR12 individuals -
    are not reported to develop the GDD skeletal phenotype, which is the clinical
    observation that argues against haploinsufficiency as the GDD mechanism.

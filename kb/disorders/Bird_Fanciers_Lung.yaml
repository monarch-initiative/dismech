histopathology:
- name: Alveolitis with Mononuclear Infiltration
  description: Transbronchial lung biopsy may show alveolitis due to mononuclear cell infiltration.
  evidence:
  - reference: PMID:14503346
    reference_title: "[A case of acute bird fancier's lung caused by feather duvet]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a transbronchial lung biopsy (TBLB) specimen showed alveolitis due to the infiltration of mononuclear cells."
    explanation: The case report documents biopsy-confirmed alveolitis in bird fancier's lung.
- name: Bronchiolocentric Interstitial Pneumonia with Granulomatous Inflammation
  description: >-
    Typical nonfibrotic HP histology combines bronchiolocentric cellular
    interstitial pneumonia, chronic bronchiolitis, and poorly formed
    nonnecrotizing granulomatous inflammation. These findings support BFL only
    when integrated with avian exposure and the other diagnostic domains.
  evidence:
  - reference: PMID:32706311
    reference_title: Diagnosis of Hypersensitivity Pneumonitis in Adults. An Official ATS/JRS/ALAT Clinical Practice Guideline.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A confident histopathological diagnosis of nonfibrotic HP requires the
      presence of typical histopathological features. These include 1) a
      cellular interstitial pneumonia accentuated around small airways
      (“bronchiolocentric”) accompanied by 2) a cellular chronic bronchiolitis,
      3) a distinctive pattern of granulomatous inflammation, and 4) no
      histopathological features to suggest a more likely alternative
    explanation: The official guideline defines the characteristic nonfibrotic-HP histologic triad.
biochemical:
- name: Bird antigen-specific IgG/IgA antibodies
  notes: Elevated serum IgG/IgA antibodies to bird antigens in bird-related hypersensitivity pneumonitis.
  presence: Positive
  evidence:
  - reference: PMID:33041192
    reference_title: "Screening and diagnosis of acute and chronic bird-related hypersensitivity pneumonitis by serum IgG and IgA antibodies to bird antigens with ImmunoCAP®."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The levels of sIgG/sIgA against the bird antigens of the three species were significantly higher in subjects with acute bird-related HP and chronic bird-related HP with acute episodes (recurrent type) than in the control subjects."
    explanation: Elevated bird-specific antibodies are reported in affected patients.
  - reference: PMID:38762468
    reference_title: "Longitudinal changes in serum immunoglobulin G testing in patients with fibrotic avian hypersensitivity pneumonitis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum IgG testing against pigeon serum was conducted twice using two methods: enzyme linked-immunosorbent assay (ELISA) and ImmunoCAP."
    explanation: The study uses serial bird-specific IgG testing against pigeon serum in fibrotic avian HP.
  - reference: PMID:40049235
    reference_title: "Anti-chicken and anti-pigeon immunoglobulin G testing in patients with bird-related fibrotic hypersensitivity pneumonitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean titers of anti-pigeon IgG antibody by ELISA were 0.659 ± 0.381 and 0.494 ± 0.187 in the bird-related fibrotic HP and control groups, respectively (p = 0.012)."
    explanation: Anti-pigeon IgG titers are higher in bird-related fibrotic HP, supporting serologic evidence for avian antigen exposure.
diagnosis:
- name: Multidisciplinary diagnostic integration
  description: >-
    BFL is diagnosed by integrating avian exposure assessment, thoracic HRCT,
    BAL cellular analysis, and—when needed—histopathology in multidisciplinary
    discussion. No single feature is sufficient in isolation.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:33861992
    reference_title: "Diagnosis and Evaluation of Hypersensitivity Pneumonitis: CHEST Guideline and Expert Panel Report."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis of HP should employ a patient-centered approach and include a
      multidisciplinary assessment that incorporates the environmental and
      occupational exposure history and CT pattern to establish diagnostic
      confidence prior to considering BAL and/or lung biopsy.
    explanation: The CHEST guideline defines the multidisciplinary sequence used for suspected avian HP.
  - reference: PMID:32706311
    reference_title: Diagnosis of Hypersensitivity Pneumonitis in Adults. An Official ATS/JRS/ALAT Clinical Practice Guideline.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although the diagnosis of HP is predominantly based on exposure
      identification, chest HRCT scan pattern, and
      bronchoscopic/histopathological findings, a major challenge is that no
      individual feature is sufficient in isolation, nor are any mandatory.
    explanation: The official guideline cautions against treating any one diagnostic domain as definitive.
- name: Avian and occupational exposure history
  description: >-
    A structured history should assess live birds, droppings, feathers or down
    bedding, contaminated fertilizer, occupational sources, and indirect
    household exposure.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:32706311
    reference_title: Diagnosis of Hypersensitivity Pneumonitis in Adults. An Official ATS/JRS/ALAT Clinical Practice Guideline.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pending the availability of a validated questionnaire, the guideline
      committee advocates that clinicians take a thorough history to identify
      potential exposures and sources in the patient’s environment that are
      known to be associated with HP.
    explanation: The guideline prioritizes systematic exposure history.
  - reference: PMID:39958101
    reference_title: "Advanced Imaging and Occupational History in the Diagnosis of Bird Fancier's Lung: A Case Report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: A thorough occupational history uncovered significant avian antigen exposure, and a family history suggested genetic susceptibility.
    explanation: A BFL case illustrates how detailed history establishes avian exposure.
- name: High-resolution computed tomography pattern
  description: >-
    Nonfibrotic BFL commonly shows ill-defined centrilobular nodules,
    ground-glass opacity, mosaic attenuation, and air trapping; fibrotic disease
    adds reticulation, traction bronchiectasis, or honeycombing.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:24480143
    reference_title: "Chronic hypersensitivity pneumonitis and pulmonary sarcoidosis: differentiation from usual interstitial pneumonia using high-resolution computed tomography."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In chronic HP, the presence of lobular areas of decreased attenuation and centrilobular small nodules and the absence of lower lung zone predominance are characteristically observed."
    explanation: The HRCT pattern distinguishes chronic HP from other fibrotic ILDs.
  - reference: PMID:39958101
    reference_title: "Advanced Imaging and Occupational History in the Diagnosis of Bird Fancier's Lung: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HRCT revealed bilateral diffuse centrilobular nodules, patchy ground-glass opacities, and a mosaic attenuation pattern without fibrosis, consistent with acute HP."
    explanation: The case report highlights characteristic HRCT findings in BFL.
- name: Bronchoalveolar lavage lymphocyte cellular analysis
  description: >-
    BAL lymphocytosis supports HP in the appropriate exposure and imaging
    context, particularly nonfibrotic disease, but is not a stand-alone BFL
    diagnosis.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:14503346
    reference_title: "[A case of acute bird fancier's lung caused by feather duvet]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Bronchoalveolar lavage (BAL) revealed a marked increase in lymphocytes
    explanation: The case report documents BAL lymphocytosis in feather-associated BFL.
  - reference: PMID:32706311
    reference_title: Diagnosis of Hypersensitivity Pneumonitis in Adults. An Official ATS/JRS/ALAT Clinical Practice Guideline.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      recommends obtaining bronchoalveolar lavage (BAL) fluid for lymphocyte
      cellular analysis (recommendation, very low confidence in the estimated
      effects).
    explanation: The guideline recommends BAL lymphocyte analysis for suspected nonfibrotic HP while grading the evidence as very low confidence.
- name: Bird antigen-specific IgG serology as exposure support
  description: >-
    Elevated bird-specific IgG can support prior exposure and sensitization,
    but it neither proves that birds caused the lung disease nor independently
    confirms or excludes BFL. IgA testing has been studied but is not part of
    the standard guideline formulation.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:33041192
    reference_title: "Screening and diagnosis of acute and chronic bird-related hypersensitivity pneumonitis by serum IgG and IgA antibodies to bird antigens with ImmunoCAP®."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The levels of sIgG/sIgA against the bird antigens of the three species were significantly higher in subjects with acute bird-related HP and chronic bird-related HP with acute episodes (recurrent type) than in the control subjects."
    explanation: The bird-specific study shows group-level discrimination, supporting exposure attribution rather than stand-alone diagnosis.
  - reference: PMID:38762468
    reference_title: "Longitudinal changes in serum immunoglobulin G testing in patients with fibrotic avian hypersensitivity pneumonitis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum IgG testing against pigeon serum was conducted twice using two methods: enzyme linked-immunosorbent assay (ELISA) and ImmunoCAP."
    explanation: Serial testing demonstrates an exposure biomarker in fibrotic avian HP.
  - reference: PMID:40049235
    reference_title: "Anti-chicken and anti-pigeon immunoglobulin G testing in patients with bird-related fibrotic hypersensitivity pneumonitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean titers of anti-pigeon IgG antibody by ELISA were 0.659 ± 0.381 and 0.494 ± 0.187 in the bird-related fibrotic HP and control groups, respectively (p = 0.012)."
    explanation: Elevated anti-pigeon IgG supports avian sensitization in the correct clinical context.
  - reference: PMID:32706311
    reference_title: Diagnosis of Hypersensitivity Pneumonitis in Adults. An Official ATS/JRS/ALAT Clinical Practice Guideline.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It was emphasized that a positive serum IgG result does not mean that the
      exposure is the cause of the lung condition; it only indicates that the
      patient has likely been exposed to a potential cause of HP at some point
      in his or her life
    explanation: The guideline directly limits serology to evidence of exposure rather than causation.
- name: Inhalation challenge test
  description: >-
    Specific avian inhalation challenge can help identify the inciting exposure
    in centers with appropriate expertise; it is a specialized component of
    exposure assessment, not a routine stand-alone test.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:35779842
    reference_title: "Validation of inhalation challenge test and serum immunoglobulin G test for bird-related fibrotic hypersensitivity pneumonitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The inhalation challenge test for bird-related fibrotic HP was more sensitive than the anti-bird IgG antibodies."
    explanation: The comparative study supports challenge testing as a specialized exposure-attribution tool.
  - reference: PMID:32706311
    reference_title: Diagnosis of Hypersensitivity Pneumonitis in Adults. An Official ATS/JRS/ALAT Clinical Practice Guideline.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Exposure assessment includes a thorough clinical history and/or serum IgG
      testing against potential antigens associated with HP and/or, in centers
      with the appropriate expertise and experience, specific inhalational
      challenge testing
    explanation: The guideline restricts specific inhalational challenge to experienced centers.
treatments:
- name: Identification and Avoidance of Avian Antigen
  description: >-
    Identify and remove the inciting avian source. Depending on the exposure,
    this can require removing birds, avoiding feather/down products, remediating
    contaminated material, and preventing indirect occupational or household
    exposure. Benefit is clearest in nonfibrotic HP; established fibrosis may
    continue to progress.

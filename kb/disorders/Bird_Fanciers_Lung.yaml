      reference_title: Hypersensitivity pneumonitis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Complete antigen avoidance is the mainstay of treatment.
      explanation: Removal of the inciting antigen directly interrupts the initiating exposure.
  evidence:
  - reference: PMID:32764620
    reference_title: Hypersensitivity pneumonitis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Complete antigen avoidance is the mainstay of treatment.
    explanation: The review identifies complete antigen avoidance as first-line management.
  - reference: DOI:10.3390/jcm8010014
    reference_title: "Effects of Corticosteroid Treatment and Antigen Avoidance in a Large Hypersensitivity Pneumonitis Cohort: A Single-Centre Cohort Study"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FVC% and DLCO% increased in nfHP patients after exposure avoidance, while
      a positive numerical trend was seen for FVC% after exposure avoidance in
      fHP patients (p = 0.15).
    explanation: Retrospective data support lung-function improvement in nonfibrotic HP but leave benefit in fibrotic HP uncertain.
  - reference: DOI:10.1371/journal.pone.0273544
    reference_title: Impact of number and type of identified antigen on transplant-free survival in hypersensitivity pneumonitis
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our retrospective cohort, 136 patients met high or definite
      probability of HP and were included in the analysis. Median
      transplant-free survival was better in patients with antigen identified
      on clinical history alone than patients without identified antigen.
      Feather exposure was associated with improved TFS compared to patients
      without antigen identified; there was no difference in TFS between
      patients with feather exposure and either mold or live bird exposure.
    explanation: The cohort supports systematic identification of live-bird and feather exposures but does not directly test avoidance.

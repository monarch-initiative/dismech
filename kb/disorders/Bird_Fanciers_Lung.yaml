  downstream:
  - target: Bird Antigen-Driven Humoral Response
    description: >-
      Repeated avian antigen exposure triggers measurable bird-specific
      antibody responses.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33041192
      reference_title: "Screening and diagnosis of acute and chronic bird-related hypersensitivity pneumonitis by serum IgG and IgA antibodies to bird antigens with ImmunoCAP®."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The levels of sIgG/sIgA against the bird antigens of the three species
        were significantly higher in subjects with acute bird-related HP and
        chronic bird-related HP with acute episodes (recurrent type) than in
        the control subjects.
      explanation: Bird-related HP is associated with measurable avian-antigen-specific antibody responses.
  - target: Th1/Th2 to Th2/Th17 Cytokine Shift
    description: >-
      Antigen exposure initiates the hypersensitivity-pneumonitis immune
      response that shifts across disease stages.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: DOI:10.3390/ijms24032884
      reference_title: Immunopathological Mechanisms of Bird-Related Hypersensitivity Pneumonitis
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the first stages of BRHP, there is a mixed Th1/Th2 immune response,
        while during the progression of the disease, although there is a Th1
        response, the cytokine levels seem to indicate a switch towards a
        Th2/Th17 mixed response.
      explanation: The pigeon-serum mouse model supplies stage-dependent cytokine evidence.

has_subtypes:
- name: Nonfibrotic bird-related hypersensitivity pneumonitis
  description: >-
    Bird-related HP without radiologic or histopathologic evidence of fibrosis;
    it often has a clearer exposure history, acute inflammatory features, and
    bronchoalveolar-lavage lymphocytosis.
  evidence:
  - reference: PMID:32706311
    reference_title: Diagnosis of Hypersensitivity Pneumonitis in Adults. An Official ATS/JRS/ALAT Clinical Practice Guideline.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      nonfibrotic HP (i.e., patients without radiological and/or
      histopathological evidence of fibrosis)
    explanation: The guideline defines the nonfibrotic phenotype by absence of fibrosis.
- name: Fibrotic bird-related hypersensitivity pneumonitis
  description: >-
    Bird-related HP with radiologic or histopathologic fibrosis; exposure may be
    less obvious and the course may become progressive despite antigen removal.
  evidence:
  - reference: PMID:32706311
    reference_title: Diagnosis of Hypersensitivity Pneumonitis in Adults. An Official ATS/JRS/ALAT Clinical Practice Guideline.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      fibrotic HP (i.e., patients with radiological and/or histopathological
      evidence of fibrosis)
    explanation: The guideline defines the fibrotic phenotype by demonstrable fibrosis.
- name: Recurrent chronic bird fancier's lung
  description: >-
    Historical chronic-BFL pattern with recurrent acute episodes followed by
    interstitial pulmonary fibrosis; retained as a bird-specific clinical
    course rather than as the primary modern classification.
  evidence:
  - reference: PMID:12839317
    reference_title: "Clinical features of recurrent and insidious chronic bird fancier's lung."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One subgroup of patients develops interstitial pulmonary fibrosis after recurrent acute episodes (recurrent BFL)"
    explanation: The abstract defines a recurrent chronic BFL subtype marked by recurrent acute episodes and fibrotic progression.
- name: Insidious chronic bird fancier's lung
  description: >-
    Historical chronic-BFL pattern with slowly progressive respiratory disease
    and no recalled acute episodes; retained as a bird-specific clinical
    course rather than as the primary modern classification.
  evidence:
  - reference: PMID:12839317
    reference_title: "Clinical features of recurrent and insidious chronic bird fancier's lung."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the other subgroup of patients has no history of acute episodes but has slowly progressive chronic respiratory disease (insidious BFL)."
    explanation: The abstract defines an insidious subtype with slow progression and no acute episode history.
disease_term:
  preferred_term: bird fancier's lung
  term:
    id: MONDO:0005668
    label: bird fancier's lung
description: >-
  Bird fancier's lung is the avian-antigen form of hypersensitivity pneumonitis:
  an immune-mediated interstitial and small-airway lung disease caused by
  repeated inhalation of proteins from birds, feathers, or contaminated
  materials. It spans nonfibrotic inflammatory and fibrotic phenotypes; only a
  minority of exposed people develop disease.
synonyms:
- Bird-related hypersensitivity pneumonitis
- Bird-related HP
- BRHP
- Avian hypersensitivity pneumonitis
- Avian HP
- Bird fancier's lung
- Pigeon breeder's disease
- Pigeon breeders' disease
- Pigeon fancier's lung
epidemiology:
- name: Salt Lake City pigeon-fancier cohort
  description: >-
    A selected regional cohort found clinical pigeon breeders' disease in 21%
    of 53 pigeon fanciers; this exposure-cohort proportion is not a general
    population prevalence estimate.
  evidence:
  - reference: PMID:1053441
    reference_title: "Pigeon breeders' disease--a prevalence study and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among fifty-three Salt Lake City, Utah area pigeon fanciers, 21% were found to have the clinical picture of pigeon breeders' disease."
    explanation: The study supplies a cohort-specific proportion among heavily exposed pigeon fanciers.
- name: Common form of hypersensitivity pneumonitis
  description: Bird fancier's lung is a common form of hypersensitivity pneumonitis among exposed populations.
  evidence:
  - reference: PMID:21870048
    reference_title: "Bird fancier's lung: a state-of-the-art review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Bird fancier's lung (BFL) resulting from avian antigen exposure is a very common form of hypersensitivity pneumonitis."
    explanation: The review describes BFL as a very common form of HP.
progression:
- phase: Acute inflammatory presentation
  notes: >-
    An acute presentation can begin within hours after a high avian-antigen
    exposure and commonly aligns with a nonfibrotic inflammatory phenotype.
  evidence:
  - reference: PMID:6761066
    reference_title: "Immunology of hypersensitivity pneumonitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Symptoms usually begin 4 to 6 hr after exposure to large quantities of causative organic dust."
    explanation: The review describes rapid onset after exposure in acute disease.
- phase: Chronic fibrotic presentation
  notes: >-
    Chronic disease can begin gradually and develop pulmonary fibrosis; the
    current fibrotic/nonfibrotic phenotype should be recorded separately from
    the time course.
  evidence:
  - reference: PMID:6761066
    reference_title: "Immunology of hypersensitivity pneumonitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Chronically, these diseases may present with the gradual onset of cough, dyspnea on exertion, fatigue, anorexia, and weight loss which may progress to pulmonary fibrosis or severe pulmonary insufficiency."
    explanation: The review notes gradual onset and progression to fibrosis.
- phase: Progressive fibrotic disease
  notes: >-
    Once a progressive fibrotic phenotype is established, decline may continue
    despite removal of the identified exposure.
  evidence:
  - reference: PMID:32764620
    reference_title: Hypersensitivity pneumonitis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Some patients with fibrotic HP may evolve to a progressive phenotype,
      even with complete exposure avoidance.
    explanation: The review establishes that exposure removal does not invariably halt fibrotic progression.

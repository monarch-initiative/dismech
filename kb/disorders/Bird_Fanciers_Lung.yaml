discussions:
- discussion_id: interpretation_bfl_serology_exposure_not_causation
  prompt: >-
    How should positive bird-specific IgG or IgA be interpreted when other
    diagnostic domains are discordant?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - diagnosis#Bird antigen-specific IgG serology as exposure support
  rationale: >-
    Bird-specific antibodies document sensitization and likely exposure. They
    do not establish that the exposure caused the ILD, and test panels and
    thresholds are not standardized internationally. The entry therefore does
    not model positive serology as an independently diagnostic biomarker.
  evidence:
  - reference: PMID:32706311
    reference_title: Diagnosis of Hypersensitivity Pneumonitis in Adults. An Official ATS/JRS/ALAT Clinical Practice Guideline.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It was emphasized that a positive serum IgG result does not mean that the
      exposure is the cause of the lung condition; it only indicates that the
      patient has likely been exposed to a potential cause of HP at some point
      in his or her life
    explanation: The guideline directly separates exposure evidence from disease causation.
- discussion_id: gap_bfl_antigen_stratified_fibrotic_mechanisms
  prompt: >-
    Which single-cell and profibrotic mechanisms demonstrated in pooled or
    non-avian HP are reproduced specifically in human avian-antigen disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Classical Monocyte Enrichment
  - pathophysiology#MMP14-High Macrophage Profibrotic Activity
  rationale: >-
    The single-cell cohorts are not stratified by inciting antigen, while the
    MMP14 perturbation study uses a non-avian SR-antigen mouse model. These
    results are retained as partial shared-HP evidence, not as established
    bird-specific mechanisms.
  evidence:
  - reference: PMID:38924775
    reference_title: "Single-Cell Analysis Reveals Novel Immune Perturbations in Fibrotic Hypersensitivity Pneumonitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Single-cell 5' RNA sequencing was conducted on peripheral blood
      mononuclear cells and BAL cells obtained from 45 patients with FHP, 63
      patients with idiopathic pulmonary fibrosis (IPF), 4 patients with
      nonfibrotic hypersensitivity pneumonitis, and 36 healthy control subjects
      in the United States and Mexico.
    explanation: The cohort is defined at HP phenotype level without an avian-antigen subgroup.
  - reference: PMID:38218353
    reference_title: "MMP14(high) macrophages orchestrate progressive pulmonary fibrosis in SR-Ag-induced hypersensitivity pneumonitis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We demonstrated that suppressing toll-like receptor 2 (TLR2) and nuclear factor kappa-B (NF-κB) could attenuate MMP14 expression and exosome secretion in macrophages stimulation with SR-Ag.
    explanation: The perturbation is performed in an SR-antigen rather than avian-antigen model.
- discussion_id: gap_bfl_genetic_susceptibility_specificity
  prompt: >-
    Do reported MUC5B and TOLLIP associations predict susceptibility or outcome
    specifically in bird-related HP rather than in pooled fibrotic HP?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    The available association is for fibrotic HP and is non-causal. MUC5B and
    TOLLIP are therefore not represented as causal BFL genes; antigen-stratified
    replication and functional evidence would be needed.
  evidence:
  - reference: PMID:38309995
    reference_title: "Polymorphisms and haplotypes of TOLLIP and MUC5B are associated with susceptibility and survival in patients with fibrotic hypersensitivity pneumonitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MUC5B rs35705950 and three neighboring TOLLIP variants (rs3750920, rs111521887, and rs5743894) were associated with increased susceptibility to fHP.
    explanation: The study reports association with pooled fibrotic HP, not causation or BFL specificity.
- discussion_id: gap_bfl_antifibrotic_efficacy
  prompt: >-
    What is the comparative efficacy of nintedanib and pirfenidone in
    progressive fibrotic BFL after avian-antigen removal?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatment#Nintedanib for Progressive Fibrosing Disease
  - treatment#Investigational Pirfenidone for Fibrotic HP
  rationale: >-
    INBUILD was not powered for the HP subgroup or stratified by avian exposure.
    The pirfenidone trial enrolled only 40 participants and was underpowered for
    its primary endpoint. BFL-specific comparative evidence remains absent.
  evidence:
  - reference: PMID:32145830
    reference_title: "Nintedanib in patients with progressive fibrosing interstitial lung diseases-subgroup analyses by interstitial lung disease diagnosis in the INBUILD trial: a randomised, double-blind, placebo-controlled, parallel-group trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The INBUILD trial was not designed or powered to provide evidence for a
      benefit of nintedanib in specific diagnostic subgroups.
    explanation: The trial authors explicitly limit diagnosis-specific inference.
  - reference: PMID:37028940
    reference_title: "Pirfenidone in fibrotic hypersensitivity pneumonitis: a double-blind, randomised clinical trial of efficacy and safety."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The trial was underpowered to detect a difference in the primary end point.
    explanation: The pirfenidone trial authors explicitly identify inadequate power.
review_notes: >-
  This record is scoped to avian-antigen hypersensitivity pneumonitis rather
  than to all HP. The prior United Kingdom rate was removed because its source
  estimated overall domestic HP incidence, not BFL incidence. Modern
  nonfibrotic/fibrotic phenotypes are primary; recurrent and insidious chronic
  BFL are retained as historical bird-specific course patterns. General or
  pooled HP evidence is used only where a diagnostic, management, or shared
  fibrotic mechanism reasonably applies, and such extrapolation is labeled
  partial. The two GEO datasets are not antigen-stratified. MUC5B and TOLLIP
  associations are non-causal pooled-fibrotic-HP findings and are recorded as a
  knowledge gap rather than causal genes. Bird-specific IgG supports exposure
  but cannot diagnose BFL alone. Complete avian-antigen avoidance remains the
  management foundation; corticosteroid evidence is phenotype-dependent,
  nintedanib evidence comes from a broader progressive-fibrosing-ILD trial, and
  pirfenidone remains investigational. The FREQUENT dyspnea and cough bands use
  the guideline's qualitative "common" wording; frequency qualifiers are
  omitted for the remaining phenotypes because their evidence supports the
  associations but not quantitative or qualitative frequency bands.

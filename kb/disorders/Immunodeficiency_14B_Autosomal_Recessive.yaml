genetic:
- name: PIK3CD
  gene_term:
    preferred_term: PIK3CD
    term:
      id: hgnc:8977
      label: PIK3CD
  relationship_type: CAUSATIVE
  association: >-
    Biallelic loss-of-function variants in PIK3CD cause IMD14B. The same gene causes
    activated PI3K-delta syndrome (APDS1 / IMD14A) through heterozygous activating
    variants, so the direction of the variant's effect, not the gene, determines which
    disease results. Reported IMD14B alleles are nonsense, frameshift or in-frame
    deletions producing complete or near-complete loss of p110-delta.
  evidence:
  - reference: PMID:41026257
    reference_title: "Homozygous Loss of Function PIK3CD Mutation in Multiple Siblings Leading To B Cell Dysregulation and Autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in PIK3CD, which encodes an immune-specific catalytic subunit of
      PI3K, cause both dominant (activating) and recessive (loss of function) immune
      deficiencies in humans."
    explanation: Establishes the bidirectional gene-disease architecture at PIK3CD.
  - reference: PMID:41026257
    reference_title: "Homozygous Loss of Function PIK3CD Mutation in Multiple Siblings Leading To B Cell Dysregulation and Autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study substantially increases the limited number of patients known to have
      immune deficiency due to loss of PIK3CD."
    explanation: Confirms loss of PIK3CD as an established cause of immune deficiency.

prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ten patients reported as of the 2025 sibship report, which then added three more. The
    count carries its own caveat: three of the ten had a concurrent mutation in another
    immune gene, so the number of patients whose phenotype can be attributed to PIK3CD
    alone is smaller than ten.
  evidence:
  - reference: PMID:41026257
    reference_title: "Homozygous Loss of Function PIK3CD Mutation in Multiple Siblings Leading To B Cell Dysregulation and Autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For LOF, only 10 patients have been reported to date with germline autosomal
      recessive deficiency of PIK3CD; however, phenotypic interpretation is complicated by
      the fact that three of them also had a concurrent mutation"
    explanation: >-
      Gives both the published case count and the confounding that limits how many of those
      cases can support phenotype claims.

diagnosis:
- name: Molecular Genetic Testing of PIK3CD
  description: >-
    Sequencing of PIK3CD, with attention to zygosity and to the direction of the
    variant's effect - a PIK3CD variant report alone does not distinguish IMD14B from
    APDS1, and the two need opposite therapeutic approaches. Standard laboratory
    measures of T-cell number and function are frequently unremarkable, so a normal
    T-cell panel does not exclude the diagnosis.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "others had normal counts and standard laboratory measures of T cell number and
      function were generally unremarkable. Therefore a high index of suspicion for an
      underlying monogenic cause is required in this setting."
    explanation: >-
      Supports the diagnostic caution that routine immunological testing may not flag the
      disorder.

treatments:
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Potentially curative, and the only intervention reported to resolve the disease
    rather than manage it. In the index case a first transplant was rejected with
    autologous lymphoid reconstitution; a second, with more myeloablative conditioning,
    achieved full donor chimerism and sustained remission of the enterocolitis. It is
    curated against the tolerance node because replacing the haematopoietic compartment
    replaces the p110-delta-deficient lymphocytes driving both arms of the disease.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Loss of Immune Tolerance
    treatment_effect: INHIBITS
    description: >-
      Replacement of the patient's haematopoietic system with donor cells carrying
      functional PIK3CD removes the deficient lymphocyte compartment, and with it the
      immune dysregulation.
    evidence:
    - reference: PMID:31073077
      reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "On this occasion he achieved 100% donor chimerism including lymphoid
        reconstitution and sustained remission of enterocolitis."
      explanation: Documents resolution of the immune-mediated disease following engraftment.
  evidence:
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hematopoietic stem cell transplantation (HSCT) was therefore performed as a
      potentially curative procedure."
    explanation: Establishes HSCT as the curative intent intervention in this disease.

- name: Immunoglobulin Replacement and Antimicrobial Prophylaxis
  description: >-
    Standard management of the humoral defect in the previously reported patients:
    immunoglobulin replacement with antimicrobial therapy for acute infections. This
    treats the consequence of the humoral arm and does not engage the underlying
    signalling lesion, so no target_mechanisms link is asserted.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their management involved immunoglobulin replacement and antimicrobial therapy
      for acute infections"
    explanation: Reports the standard supportive management used across the reported patients.

- name: Immunosuppressive and Anti-Inflammatory Therapy
  description: >-
    Control of the immune-mediated enterocolitis. In the index case anti-inflammatory
    therapy alone failed, and the diarrhoea only came under control with corticosteroid,
    cyclosporine and infliximab; weaning the immunosuppression relapsed the gut disease.
    Other reported patients were managed with mesalazine, steroids or 6-mercaptopurine.
    It is curated against the tolerance node because it suppresses the dysregulated immune
    response rather than correcting the signalling lesion - which is also why it controls
    rather than cures.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Loss of Immune Tolerance
    treatment_effect: INHIBITS
    description: >-
      Broad immunosuppression suppresses the dysregulated effector response driving the
      enterocolitis, without addressing the underlying PI3K-delta deficiency.
    evidence:
    - reference: PMID:31073077
      reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, weaning of immunosuppressive treatment led to a relapse of his gut
        disease, indicating chronic immune-mediated inflammation."
      explanation: >-
        Demonstrates the effect is suppressive and ongoing rather than curative - the disease
        returns when treatment stops.
  evidence:
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "but continued with torrential diarrhea (3L/day) until the addition of
      immunosuppression (corticosteroid, cyclosporine, infliximab)"
    explanation: Documents the specific agents that brought the enterocolitis under control.

differential_diagnoses:
- name: Activated PI3K-delta syndrome (APDS1 / IMD14A)
  description: >-
    The same gene in the opposite direction. APDS1 arises from heterozygous activating
    PIK3CD variants and presents with lymphoproliferation, herpesvirus infection and CD4
    lymphopenia; IMD14B arises from biallelic null variants and presents with humoral
    deficiency, autoimmunity and enterocolitis. Distinguishing them is not academic - a
    PI3K-delta inhibitor is rational therapy in APDS and would be expected to worsen
    IMD14B.
  distinguishing_features:
  - APDS1 is autosomal dominant with gain-of-function variants; IMD14B is autosomal recessive with biallelic loss of function
  - APDS1 features chronic lymphoproliferation and CD4 lymphopenia
  - PI3K-delta inhibition is a therapeutic strategy in APDS and would aggravate the lesion in IMD14B
  evidence:
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Activating germline mutations inPIK3CDcause the immune dysregulatory disease
      activated PI3Kδ syndrome (APDS), usually presenting with recurrent sinopulmonary
      infections in childhood, herpes virus infections and CD4 lymphopenia"
    explanation: Gives the contrasting genotype and presentation of the dominant disease.

- name: Idelalisib-associated immune-mediated colitis
  description: >-
    Not an inherited mimic but the acquired, pharmacological counterpart. Patients given
    the p110-delta-specific inhibitor idelalisib for haematological malignancy develop
    severe colitis - the same on-target loss of activity producing the same gut disease
    in adults with no PIK3CD variant. It belongs here because it is the strongest
    available evidence that the enterocolitis in IMD14B is caused by loss of p110-delta
    activity itself rather than by anything else in these patients' genomes.
  distinguishing_features:
  - Acquired and drug-induced rather than germline, with onset during therapy in adults
  - No PIK3CD variant; the enzyme is inhibited rather than absent
  - Resolves or is managed by withdrawing the drug, an option unavailable in the genetic disease
  evidence:
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In humans, immune dysregulation including severe colitis is present in many
      cancer patients who are treated with the p110δ-specific inhibitor idelalisib."
    explanation: >-
      Establishes the pharmacological phenocopy of the enterocolitis in patients without a
      PIK3CD variant.

- name: Common variable immunodeficiency
  description: >-
    The clinical bucket IMD14B patients are most likely to be placed in before genetic
    testing: hypogammaglobulinaemia, absent class-switched memory B cells, recurrent
    sinopulmonary infection and autoimmune cytopenia together describe a CVID phenotype.
    Routine T-cell testing is often normal, which does nothing to prompt a monogenic
    search.
  distinguishing_features:
  - CVID is a clinical diagnosis of exclusion; IMD14B has a defined biallelic PIK3CD genotype
  - Consanguinity and affected siblings should prompt a monogenic search
  - Enterocolitis with crypt apoptosis and refractory immune thrombocytopenia are more suggestive of a monogenic defect
  evidence:
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore a high index of suspicion for an underlying monogenic cause is
      required in this setting."
    explanation: The authors' own statement that this phenotype will not otherwise be recognised.

animal_models:
- name: p110-delta kinase-dead mouse
  species: Mouse
  genotype: Pik3cd kinase-dead knock-in
  publication: PMID:31073077
  description: >-
    The mouse that anticipated the human disease. p110-delta kinase-dead mice spontaneously
    develop inflammatory bowel disease with crypt abscesses - the same histological lesion
    later found in the index patient - and their regulatory T cells show normal thymic
    output but disturbed trafficking and suppressive function.
  modeled_mechanisms:
  - target: Loss of Immune Tolerance
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Spontaneous colitis with crypt abscesses arises without any additional manipulation,
      matching the human enterocolitis at the level of histology, and the model supplies the
      regulatory T-cell mechanism that patient material was too limited to test.
    limitations: >-
      A kinase-dead knock-in is not the human genotype: patients carry truncating alleles
      that remove the protein entirely, and loss of p110-delta protein also destabilises
      p85-alpha, which a catalytically inactive but present protein would not. The model
      also does not speak to the humoral arm, where human and mouse B cells are reported to
      differ in their class-switching requirement.
    evidence:
    - reference: PMID:31073077
      reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Similar to our patient, p110δ kinase-dead mice spontaneously develop
        inflammatory bowel disease with crypt abscesses."
      explanation: >-
        Establishes that the model reproduces the human gut lesion, including its
        histological hallmark.
    - reference: PMID:31073077
      reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In these mice, thymic output of Tregs was normal, but Treg trafficking and
        suppressive activity including IL-10 secretion were disturbed."
      explanation: >-
        Supplies the regulatory T-cell mechanism invoked for the tolerance node, sourced
        rather than asserted.

discussions:
- discussion_id: mismatch_human_b_cell_class_switching_versus_mouse
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Defective B-Cell Proliferation and Class-Switch Recombination
  prompt: >-
    Why do human PIK3CD-deficient B cells fail to class-switch even when supplied with
    CD40L and IL-21, when mouse B cells lacking p110-delta can still class-switch given
    external T-cell help?
  rationale: >-
    Most of what is known about PI3K-delta in immunity comes from mice, and the mouse
    predicts that T-cell help should rescue class-switch recombination. Human patient B
    cells do not behave that way: proliferation and switching remain impaired under CD40L
    and IL-21 stimulation, which is precisely the help that should have rescued them. The
    authors of the sibling study raise this themselves. If the human B-cell requirement
    for PI3K-delta is genuinely broader than the mouse's, then mouse models will
    systematically understate the humoral severity of this disease, and a therapy
    validated on murine class-switching would not translate. The alternative is that the
    in vitro stimulation conditions do not reproduce germinal-centre help faithfully
    enough, in which case the discrepancy is methodological rather than biological.
  proposed_experiments:
  - experiment_id: exp_side_by_side_human_mouse_csr
    name: Matched-protocol class-switch recombination in human and murine p110-delta-null B cells
    description: >-
      Run identical stimulation protocols on patient-derived and p110-delta-null murine B
      cells in the same laboratory, varying CD40L and IL-21 dose and timing. A species
      difference that survives protocol matching is biological; one that disappears is an
      artefact of how the two literatures were generated.
  - experiment_id: exp_germinal_centre_organoid_switching
    name: Class-switching in a germinal-centre organoid supplied with autologous T-cell help
    description: >-
      Test patient B cells in a three-dimensional germinal-centre system with autologous T
      cells rather than recombinant CD40L, to establish whether physiological help rescues
      switching where soluble stimulation does not.

- discussion_id: gap_confounded_phenotype_attribution
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Loss of Immune Tolerance
  prompt: >-
    Which features of the reported IMD14B phenotype are attributable to PIK3CD loss
    alone, given that a third of published patients carry a second immune-gene defect and
    the index case was immunophenotyped after rituximab?
  rationale: >-
    This is a small-numbers problem with a specific and unusually well-documented shape.
    Of roughly ten reported patients, three also carry a concurrent mutation in another
    immune gene, so their phenotypes cannot be assigned to PIK3CD. Separately, the index
    case's B-cell findings - low B cells, absent class-switched memory, low
    immunoglobulins - were measured after treatment with the B-cell-depleting antibody
    rituximab, and the reporting authors say explicitly that these are consistent with
    either the drug or a primary B-cell abnormality. The unconfounded evidence for the
    humoral phenotype therefore rests on a smaller set of patients than the headline count
    suggests, and the 2025 sibship is valuable precisely because it is untreated and
    unconfounded. Until more such families are reported, any frequency estimate for this
    disease would be assembled from a denominator that does not really exist.
  proposed_experiments:
  - experiment_id: exp_unconfounded_imd14b_registry
    name: Registry of biallelic PIK3CD patients stratified by confounder status
    description: >-
      Collect reported and unreported biallelic PIK3CD patients into a single registry
      that records, per patient, whether a second immune-gene variant is present and
      whether immunophenotyping preceded or followed B-cell-depleting or immunosuppressive
      therapy. Only the untreated, single-locus subset can support statements about the
      disease's intrinsic phenotype.

notes: >-
  No GeneReviews chapter exists for IMD14B. This was checked and verified by reading rather
  than assumed. A PubMed search for PIK3CD in GeneReviews returns exactly one chapter,
  PMID:39899769, and that chapter was fetched and read: it is "Activated PI3K Delta
  Syndrome", it defines APDS1 as caused by a heterozygous gain-of-function PIK3CD variant
  and APDS2 by a heterozygous PIK3R1 variant, and it contains no occurrence of "recessive",
  "biallelic" or "homozygous". It is therefore a chapter about a different disease and is
  not cited here; using it as the phenotype baseline for IMD14B would be evidence from the
  wrong disorder. Note also that APDS2 is described as a loss-of-function variant, but in
  PIK3R1, the inhibitory regulatory subunit - so that loss of function produces pathway
  hyperactivation, the opposite of what loss of function in PIK3CD does. The phrase "PIK3CD
  loss of function" alone is not enough to identify which disease is meant.

  Confounded evidence, flagged deliberately. The index case (PMID:31073077) received
  rituximab before immunophenotyping, and the reporting authors state that the low B cells,
  absent class-switched memory and subnormal immunoglobulins are "consistent with prior
  rituximab therapy and/or a primary B-cell abnormality". This entry therefore sources the
  humoral phenotype to the four previously reported unconfounded patients and to the 2025
  untreated sibship, not to the index case's own B-cell numbers. Separately, three of the
  roughly ten reported patients carry a concurrent mutation in another immune gene.

  No frequency bands are assigned to any phenotype. With about ten reported patients, a
  third of them confounded by a second genetic defect, there is no denominator to band
  against.

  The founding clinical description of PI3K-delta deficiency, Sogkas et al. 2018
  (PMID:30040974, J Allergy Clin Immunol), is a Letter that caches with no abstract and no
  retrievable full text, so it carries no evidence item here and is cited only as context.
  It is not listed in the references block because nothing in this entry is quoted from it.


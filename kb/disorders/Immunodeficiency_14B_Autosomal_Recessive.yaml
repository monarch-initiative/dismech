name: Immunodeficiency 14B, Autosomal Recessive
creation_date: "2026-08-21T00:00:00Z"
category: Mendelian
description: >-
  Immunodeficiency 14B (IMD14B, OMIM 619281) is an ultra-rare autosomal recessive
  inborn error of immunity caused by biallelic loss-of-function variants in PIK3CD,
  which encodes p110-delta, the leukocyte-restricted catalytic subunit of class IA
  phosphoinositide 3-kinase delta.

  It is the mirror image of a disease the knowledge base already holds. Heterozygous
  activating variants in the same gene cause activated PI3K-delta syndrome (APDS1 /
  IMD14A), a lymphoproliferative combined immunodeficiency; biallelic null variants
  cause this one, a predominantly humoral immunodeficiency with autoimmunity and
  enterocolitis. One gene, two directions, two diseases - which is why IMD14B is
  curated separately rather than as a subtype of the APDS entry.

  Roughly ten patients have been reported, and the literature carries its own health
  warning: three of them had a second, concurrent immune-gene mutation, so their
  phenotypes cannot be attributed to PIK3CD alone. The entry marks that confounding
  explicitly rather than pooling all reported features into one clean picture.

  The mechanism has an unusual external check. Idelalisib, a p110-delta-specific
  inhibitor used in haematological malignancy, causes severe colitis in treated
  patients - pharmacological loss of the same activity, in adults, producing the same
  gut disease. That is curated as a distinct line of supporting evidence.
disease_term:
  preferred_term: immunodeficiency 14b, autosomal recessive
  term:
    id: MONDO:0023655
    label: immunodeficiency 14b, autosomal recessive
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic loss-of-function variants. Reported genotypes are
    predominantly homozygous, reflecting consanguinity in the ascertained families.
    Heterozygous carriers are unaffected, which is what separates this from the
    dominant gain-of-function disease at the same locus.
  evidence:
  - reference: PMID:41026257
    reference_title: "Homozygous Loss of Function PIK3CD Mutation in Multiple Siblings Leading To B Cell Dysregulation and Autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in PIK3CD, which encodes an immune-specific catalytic subunit
      of PI3K, cause both dominant (activating) and recessive (loss of function) immune
      deficiencies in humans."
    explanation: >-
      States the two-mode architecture of PIK3CD disease and places IMD14B on the
      recessive loss-of-function side.

pathophysiology:
- name: Biallelic PIK3CD Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous null or severely hypomorphic PIK3CD alleles.
    Reported classes include nonsense, frameshift and in-frame deletion variants; the
    index case carried a homozygous 21 bp deletion with a 2 bp insertion in exon 5
    producing p.Q170Vfs*41 and no detectable full-length protein.
  downstream:
  - target: Loss of p110-delta Protein with Secondary p85-alpha Reduction
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41026257
    reference_title: "Homozygous Loss of Function PIK3CD Mutation in Multiple Siblings Leading To B Cell Dysregulation and Autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report a family with three affected children carrying a novel
      bi-allelic, truncating mutation in PIK3CD."
    explanation: Documents a biallelic truncating genotype in three affected siblings.

- name: Loss of p110-delta Protein with Secondary p85-alpha Reduction
  biological_scale: MOLECULAR
  description: >-
    Truncating alleles abolish p110-delta protein. The consequence is not confined to
    the catalytic subunit: because p110-delta and the p85-alpha regulatory subunit
    associate constitutively, loss of p110-delta also reduces p85-alpha expression. The
    lesion therefore removes the holoenzyme rather than just half of it.
  molecular_functions:
  - preferred_term: 1-phosphatidylinositol-3-kinase activity
    term:
      id: GO:0016303
      label: 1-phosphatidylinositol-3-kinase activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of PIP3 Generation on Antigen and Cytokine Receptor Engagement
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41026257
    reference_title: "Homozygous Loss of Function PIK3CD Mutation in Multiple Siblings Leading To B Cell Dysregulation and Autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoblot confirmed loss of protein along with reduced expression of the
      associated p85α regulatory subunit."
    explanation: >-
      Demonstrates both the loss of p110-delta and the secondary reduction of its
      obligate regulatory partner.

- name: Failure of PIP3 Generation on Antigen and Cytokine Receptor Engagement
  biological_scale: CELLULAR
  description: >-
    PI3K-delta phosphorylates PIP2 to PIP3 at the leukocyte plasma membrane downstream
    of antigen and cytokine receptors. Patient T lymphoblasts fail to generate PIP3 on
    T-cell receptor engagement, which is the proximal signalling failure from which the
    rest of the disease follows.
  downstream:
  - target: Impaired AKT-mTOR Signalling and Lymphocyte Metabolic Reprogramming
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patient-derived T lymphoblasts were profoundly impaired in their ability
      to generate PIP3 upon T cell receptor (TCR) engagement"
    explanation: Direct measurement of the proximal signalling defect in patient cells.

- name: Impaired AKT-mTOR Signalling and Lymphocyte Metabolic Reprogramming
  biological_scale: CELLULAR
  description: >-
    Reduced PIP3 blunts the PDK1-AKT-mTOR cascade, and with it the metabolic switch
    lymphocytes need in order to expand and acquire effector function. Patient cells
    show reduced AKT and S6 phosphorylation and impaired glycolysis - and the same
    glycolytic defect is reproduced in healthy donor cells simply by adding idelalisib,
    which ties the metabolic phenotype directly to loss of p110-delta activity rather
    than to anything else in the patient's background.
  biological_processes:
  - preferred_term: glycolytic process
    term:
      id: GO:0006096
      label: glycolytic process
    modifier: DECREASED
  downstream:
  - target: Defective B-Cell Proliferation and Class-Switch Recombination
    causal_link_type: DIRECT
  - target: Impaired Cytotoxic Lymphocyte Effector Function
    causal_link_type: DIRECT
  - target: Paradoxical T-Cell Hyperactivation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A glycolysis stress test showed impaired IL-2-stimulated glycolysis and
      glycolytic reserve in patient cells, similar to the behavior of CD4 and CD8 T cells
      treated with idelalisib"
    explanation: >-
      Establishes the metabolic defect and its pharmacological phenocopy in control cells,
      which controls for patient-specific confounders.
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings show that germline p110δ deficiency impairs lymphocyte
      metabolism"
    explanation: The authors' summary of the metabolic consequence of p110-delta deficiency.

- name: Defective B-Cell Proliferation and Class-Switch Recombination
  biological_scale: CELLULAR
  description: >-
    The humoral arm, and the one that dominates the clinical picture. Patient B cells
    proliferate poorly and fail to class-switch even when given CD40L and IL-21 - that
    is, even when supplied with the T-cell help that would normally rescue switching.
    The compartment skews toward naive cells at the expense of class-switched memory.
  cell_types:
  - preferred_term: naive B cell
    term:
      id: CL:0000788
      label: naive B cell
    modifier: INCREASED
  biological_processes:
  - preferred_term: isotype switching
    term:
      id: GO:0045190
      label: isotype switching
    modifier: DECREASED
  - preferred_term: B cell proliferation
    term:
      id: GO:0042100
      label: B cell proliferation
    modifier: DECREASED
  downstream:
  - target: Humoral Immunodeficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41026257
    reference_title: "Homozygous Loss of Function PIK3CD Mutation in Multiple Siblings Leading To B Cell Dysregulation and Autoimmunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro functional testing of CD19 + and enriched naïve B cells revealed
      impaired proliferation, and reduction in class-switch recombination upon CD40L and
      IL-21 stimulation."
    explanation: >-
      Directly demonstrates the intrinsic B-cell proliferation and class-switching defect
      under conditions that supply T-cell help.
  - reference: PMID:41026257
    reference_title: "Homozygous Loss of Function PIK3CD Mutation in Multiple Siblings Leading To B Cell Dysregulation and Autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immune phenotyping showed B cell dysregulation with abnormally high levels
      of naïve cells."
    explanation: Documents the skew toward naive B cells in the patient compartment.

- name: Impaired Cytotoxic Lymphocyte Effector Function
  biological_scale: CELLULAR
  description: >-
    CD8 T-cell and NK-cell killing depend on PI3K-delta signalling, and the consequence
    in patients is susceptibility to herpesviruses. The index case had active
    cytomegalovirus replication in the gut with viraemia. Note that the CD8 compartment
    is not simply depleted - it is skewed toward effector/memory cells expressing high
    TBET and perforin, so the failure is functional rather than numerical.
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  downstream:
  - target: Susceptibility to Viral and Recurrent Bacterial Infection
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Viral inclusion bodies were visible, indicating active cytomegalovirus (CMV)
      replication in the gut, accompanied by CMV viremia"
    explanation: Documents failure of control of a herpesvirus in the index patient.
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peripheral blood was enriched for effector/memory CD8 T cells, which expressed
      high levels of the transcription factor TBET and perforin"
    explanation: >-
      Shows the CD8 compartment is skewed rather than absent, supporting a functional
      rather than numerical defect.

- name: Paradoxical T-Cell Hyperactivation
  biological_scale: CELLULAR
  description: >-
    The counterintuitive step, and the one that makes the autoimmune half of this disease
    make sense. PI3K-delta drives T-cell activation, so losing it ought to make T cells
    less responsive - yet patient CD3+ cells are hyperactivated. The proposed reason is
    substrate rerouting: with the kinase gone, its substrate PIP2 accumulates and is
    instead hydrolysed by phospholipase C-gamma1 into second messengers that drive
    activation through a different arm.

    The consequence is a two-sided failure at the gut mucosa - effector T cells that are
    improperly activated, and PI3K-delta-deficient regulatory T cells unable to suppress
    them.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
    modifier: INCREASED
  downstream:
  - target: Loss of Immune Tolerance
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41026257
    reference_title: "Homozygous Loss of Function PIK3CD Mutation in Multiple Siblings Leading To B Cell Dysregulation and Autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data supports the conclusion that CD3 + hyperactivation is a natural
      consequence of PIK3CD protein loss."
    explanation: >-
      The authors' conclusion that hyperactivation follows directly from loss of the
      protein, rather than being incidental to these patients.
  - reference: PMID:41026257
    reference_title: "Homozygous Loss of Function PIK3CD Mutation in Multiple Siblings Leading To B Cell Dysregulation and Autoimmunity."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This hyperactivation may result from the increased availability of PIP2, which
      is hydrolyzed by phospholipase Cγ1 (PLCγ1) into crucial secondary messengers that
      trigger several distal signaling cascades vital for CD3 + activation"
    explanation: >-
      The proposed substrate-rerouting mechanism. Curated PARTIAL because the authors state
      it as a possible explanation, not a demonstrated one.
  - reference: PMID:41026257
    reference_title: "Homozygous Loss of Function PIK3CD Mutation in Multiple Siblings Leading To B Cell Dysregulation and Autoimmunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In PI3Kδ-deficient mice, improper activation of effector T cells by gut
      microbes leads to colitis, which PI3Kδ-deficient Treg are unable to suppress"
    explanation: >-
      Supplies the route from hyperactivated effector T cells to colitis, and the parallel
      failure of the regulatory compartment to restrain them.

- name: Loss of Immune Tolerance
  biological_scale: ORGANISM
  description: >-
    Autoimmune and autoinflammatory disease is as prominent as the infection
    susceptibility. Immune-mediated thrombocytopenia and inflammatory enterocolitis are
    the two recurring manifestations. The intermediates between impaired PI3K-delta
    signalling and tolerance breakdown are now partly established: the immediate upstream
    node is paradoxical T-cell hyperactivation, and mouse work implicates disturbed
    regulatory T-cell trafficking and suppressive function, curated with evidence in
    animal_models below rather than asserted here as prose.
  downstream:
  - target: Autoimmune Cytopenia and Inflammatory Enterocolitis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41026257
    reference_title: "Homozygous Loss of Function PIK3CD Mutation in Multiple Siblings Leading To B Cell Dysregulation and Autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three patients exhibited autoimmunity and B cell dysregulation"
    explanation: Establishes autoimmunity as a consistent feature across an affected sibship.

- name: Humoral Immunodeficiency
  biological_scale: ORGANISM
  description: >-
    Hypogammaglobulinaemia with absent class-switched memory B cells, giving recurrent
    sinopulmonary infection. This is the feature most consistently reported across
    independent kindreds and the one that usually brings patients to attention.
  downstream:
  - target: Susceptibility to Viral and Recurrent Bacterial Infection
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the remaining four patients, all presented with hypogammaglobulinemia and
      recurrent sinopulmonary infections, some including severe and opportunistic pneumonias."
    explanation: >-
      Reports the phenotype across the previously published unconfounded patients, which is
      the cleanest available statement of the humoral defect.

- name: Susceptibility to Viral and Recurrent Bacterial Infection
  biological_scale: ORGANISM
  description: >-
    The infectious endpoint: recurrent sinopulmonary infection from the humoral defect,
    and poor control of herpesviruses from the cytotoxic defect. Both arms converge here.
  evidence:
  - reference: PMID:41026257
    reference_title: "Homozygous Loss of Function PIK3CD Mutation in Multiple Siblings Leading To B Cell Dysregulation and Autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three patients exhibited chronic diarrhea and recurrent sinopulmonary
      infections."
    explanation: Documents recurrent sinopulmonary infection across the sibship.

- name: Autoimmune Cytopenia and Inflammatory Enterocolitis
  biological_scale: ORGANISM
  description: >-
    The autoimmune endpoint. Thrombocytopenia can be refractory to corticosteroids,
    immunoglobulin and splenectomy, and severe enough to cause intracranial haemorrhage.
    The enterocolitis is histologically distinctive - crypt epithelial apoptosis with
    crypt abscess formation and a lamina propria notably depleted of B cells and plasma
    cells.
  evidence:
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endoscopy revealed enterocolitis, which histologically showed marked apoptosis
      of crypt epithelial cells, eosinophil and neutrophil infiltration, crypt distortion and
      crypt abscess formation"
    explanation: Describes the histopathology of the enterocolitis in the index case.
  - reference: PMID:31073077
    reference_title: "Immunodeficiency, autoimmune thrombocytopenia and enterocolitis caused by autosomal recessive deficiency of PIK3CD-encoded phosphoinositide 3-kinase δ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report a child with homozygous germline loss-of-function mutation inPIK3CD,
      who developed refractory immune thrombocytopenia, inflammatory bowel disease and
      susceptibility to infection, cured by HSCT"
    explanation: >-
      The authors' summary of the index case, establishing the triad and its response to
      transplantation.


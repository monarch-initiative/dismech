diagnosis:
- name: Immune workup for combined immunodeficiency
  description: >-
    T-cell lymphopenia with markers of poor thymic output - low naive T-cell
    counts and low T-cell receptor excision circles - together with a restricted
    receptor repertoire and impaired proliferation to mitogen.
  evidence:
  - reference: PMID:39560673
    reference_title: Dominant negative variants in ITPR3 impair T cell Ca2+ dynamics causing combined immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TCR-excision circles (TRECs) were low"
    explanation: Reports the low TREC level that marks reduced thymic output in these patients.
- name: Genetic confirmation by exome or genome sequencing
  description: >-
    The diagnosis is made by sequencing. In the defining cohort the variants were
    found by exome and genome sequencing after a panel of genes already known to
    cause inborn errors of immunity had returned nothing, and were confirmed by
    Sanger sequencing.
  evidence:
  - reference: PMID:39560673
    reference_title: Dominant negative variants in ITPR3 impair T cell Ca2+ dynamics causing combined immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the absence of a genetic diagnosis after sequencing a panel of known IEI genes, whole exome sequencing (WES) was performed on the sextet."
    explanation: Records the diagnostic route, and that a targeted IEI panel does not find these variants.
references:
- reference: PMID:36302985
  title: "Disrupted Ca(2+) homeostasis and immunodeficiency in patients with functional IP(3) receptor subtype 3 defects."
  findings: []
notes: >-
  Scope. MONDO:0979570, which MONDO cross-references to OMIM:621254, is the
  autosomal dominant, de novo
  ITPR3 entity. The compound heterozygous hypomorphic ITPR3 immunodeficiency
  reported by Neumann et al. (PMID:36302985) is a separate recessive disease and
  is deliberately not merged here; both autosomal dominant and recessive ITPR3
  combined immunodeficiency are recognised (PMID:41019080).

  Sources. There is no GeneReviews chapter for this disease, checked against the
  committed Bookshelf index (snapshot 2026-09-10, 958 chapters), so the phenotype
  baseline here is the primary cohort literature rather than a review chapter.
  That is expected for a disease first delineated in 2024-2025.

  Hypohidrosis, not anhidrosis. Reduced sweating is reported in ITPR3 patients
  themselves and is curated as HP:0000966. The stronger phrase "anhidrotic
  ectodermal dysplasia" appears in the same literature describing the ORAI1 and
  STIM1 CRAC channelopathies, and generalized anhidrosis is attributed there to
  ITPR1 and ITPR2 rather than ITPR3, so the absent-sweating term is deliberately
  not bound for this disease.

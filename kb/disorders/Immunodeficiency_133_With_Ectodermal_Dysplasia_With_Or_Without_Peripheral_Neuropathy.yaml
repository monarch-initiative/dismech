    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In line with this, only three out of five patients in our cohort required HCT during childhood, four displayed variable features of ED, and just two were diagnosed with peripheral neuropathy to date"
    explanation: Reports how many patients required transplantation.
  - reference: PMID:39560673
    reference_title: "Dominant negative variants in ITPR3 impair T cell Ca2+ dynamics causing combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As expected, the pathologies outside of the immune system, including the ectodermal and neurological features, did not improve after HCT."

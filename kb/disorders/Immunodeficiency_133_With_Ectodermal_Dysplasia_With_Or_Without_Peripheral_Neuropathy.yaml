inheritance:
- name: Autosomal dominant, typically de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Monoallelic ITPR3 missense variants, arising de novo in most reported patients.
    One patient instead inherited a milder allele from an asymptomatic parent, so
    penetrance of the full syndrome is not complete even for a transmitted allele.
  evidence:
  - reference: PMID:39560673
    reference_title: "Dominant negative variants in ITPR3 impair T cell Ca2+ dynamics causing combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, we identified four de novo missense variants in ITPR3 in five unrelated patients with childhood-onset CID and incomplete penetrance for ED and multisystem disease through WES and WGS with confirmation by Sanger sequencing"
    explanation: Establishes monoallelic de novo missense variants as the mode of inheritance, with incomplete penetrance of the non-immune features.
  - reference: PMID:41019080
    reference_title: "Two cases of combined immunodeficiency with ITPR3 mutations presenting with life-threatening severe EBV-associated hemophagocytic lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two cases of heterozygous ITPR3 mutations associated with Epstein-Barr virus-induced hemophagocytic lymphohistiocytosis (EBV-HLH), including one fatal outcome."
    explanation: Independent cohort confirming the heterozygous (monoallelic) architecture of ITPR3-related combined immunodeficiency.
genetic:
- name: ITPR3
  gene_term:
    preferred_term: ITPR3
    term:
      id: hgnc:6182
      label: ITPR3
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    ITPR3 encodes IP3R3, one of three subunits that assemble into the tetrameric
    IP3 receptor in the endoplasmic reticulum membrane. Disease-causing variants
    are heterozygous missense substitutions that interfere with channel function
    of the assembled tetramer, so the functional impact is dominant-negative
    rather than loss of function; that is recorded on the pathophysiology node
    "Impaired IP3-Gated Endoplasmic Reticulum Calcium Release", which carries the
    ITPR3 gene descriptor and the genetic_context block.
  evidence:
  - reference: PMID:39560673
    reference_title: "Dominant negative variants in ITPR3 impair T cell Ca2+ dynamics causing combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenicity is not due to haploinsufficiency, rather ITPR3 protein variants interfere with IP3R channel function leading to depletion of ER Ca2+ stores and blunted SOCE in T cells."
    explanation: States that the variants act on channel function rather than by gene-dosage loss, which is what makes the impact dominant-negative rather than loss-of-function.
  variants:
  - name: p.Arg2524Cys
    description: >-
      Recurrent de novo substitution (NM_002224.3:c.7570C>T) reported in four
      unrelated patients. Site-directed mutagenesis showed the residue is
      exquisitely sensitive to any amino acid change.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:39270020
      reference_title: "A pleiotropic recurrent dominant ITPR3 variant causes a complex multisystemic disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Arg2524Cys-causes, through a dominant-negative effect, a complex multisystemic disorder with immunodeficiency."
      explanation: Identifies the recurrent variant and its dominant-negative mode of action.
    - reference: PMID:39270020
      reference_title: "A pleiotropic recurrent dominant ITPR3 variant causes a complex multisystemic disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "7570C>T variant specifically impairs calcium flux function and cannot be replicated by a KO of the gene, suggesting a dominant-negative effect for the variant."
      explanation: Knock-in versus knockout comparison is the experiment that distinguishes a dominant-negative effect from simple loss of function.
pathophysiology:
- name: Impaired IP3-Gated Endoplasmic Reticulum Calcium Release
  biological_scale: MOLECULAR
  description: >-
    The variant subunit assembles into the IP3R tetramer and interferes with its
    gating, so IP3 generated downstream of antigen-receptor stimulation no longer
    produces normal calcium release from the endoplasmic reticulum.
  genetic_context:
    variant_origin: DE_NOVO
    functional_impact_category: DOMINANT_NEGATIVE
  molecular_functions:
  - preferred_term: IP3-gated calcium release channel activity of the IP3R tetramer
    modifier: ABNORMAL
    term:
      id: GO:0005220
      label: inositol 1,4,5-trisphosphate-gated calcium channel activity
  genes:
  - preferred_term: ITPR3
    term:
      id: hgnc:6182
      label: ITPR3
  downstream:
  - target: Endoplasmic Reticulum Calcium Store Depletion
    causal_link_type: DIRECT
    description: Loss of normal gating leaves the store unable to hold its calcium load.
  evidence:
  - reference: PMID:39560673
    reference_title: "Dominant negative variants in ITPR3 impair T cell Ca2+ dynamics causing combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report five unrelated patients with de novo missense variants in ITPR3, encoding a subunit of the inositol 1,4,5-trisphosphate receptor (IP3R), which forms a Ca2+ channel in the endoplasmic reticulum (ER) membrane responsible for the release of ER Ca2+ required to trigger SOCE, and for Ca2+ transfer to other organelles."
    explanation: Identifies the gene product as the ER calcium-release channel subunit and locates the lesion at that channel.
- name: Endoplasmic Reticulum Calcium Store Depletion
  biological_scale: MOLECULAR
  description: >-
    Channel leakiness leaves the endoplasmic reticulum store already depleted at
    baseline, which is the proposed explanation for the blunted response to
    thapsigargin in patient T cells.
  biological_processes:
  - preferred_term: release of endoplasmic reticulum calcium into the cytosol
    modifier: ABNORMAL
    term:
      id: GO:1903514
      label: release of sequestered calcium ion into cytosol by endoplasmic reticulum
  downstream:
  - target: Blunted Store-Operated Calcium Entry
    causal_link_type: DIRECT
    description: >-
      Store-operated entry depends on prior store depletion being sensed, so a
      store that is already depleted cannot generate the normal signal.
  evidence:
  - reference: PMID:39560673
    reference_title: "Dominant negative variants in ITPR3 impair T cell Ca2+ dynamics causing combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we speculated that the blunted SOCE observed after thapsigargin could be due to already depleted ER Ca2+ stores in patient T cells at baseline due to IP3R channel leakiness."
    explanation: States the store-depletion step and flags it as the authors' interpretation rather than a direct measurement.
- name: Blunted Store-Operated Calcium Entry
  biological_scale: CELLULAR
  description: >-
    Sustained cytosolic calcium elevation after receptor stimulation is reduced,
    placing this disease one step upstream of the ORAI1 and STIM1 CRAC
    channelopathies, which abolish the same final step.
  biological_processes:
  - preferred_term: store-operated calcium entry
    modifier: DECREASED
    term:
      id: GO:0002115
      label: store-operated calcium entry
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Impaired NFAT and NF-kB Dependent T Cell Activation
    causal_link_type: DIRECT
    description: Sustained cytosolic calcium is what activates the calcineurin-NFAT and NF-kB arms.
  - target: Defective Late Thymic T Cell Development
    causal_link_type: DIRECT
    description: Calcium signalling is required for the late thymic selection stages.
  evidence:
  - reference: PMID:39560673
    reference_title: "Dominant negative variants in ITPR3 impair T cell Ca2+ dynamics causing combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenicity is not due to haploinsufficiency, rather ITPR3 protein variants interfere with IP3R channel function leading to depletion of ER Ca2+ stores and blunted SOCE in T cells."
    explanation: Reports blunted store-operated calcium entry in patient T cells as the consequence of store depletion.
- name: Impaired NFAT and NF-kB Dependent T Cell Activation
  biological_scale: CELLULAR
  description: >-
    The calcium-dependent transcriptional programmes downstream of the T-cell
    receptor are inadequately engaged, so activation, proliferation and the
    metabolic switch that accompanies them all fall short.
  biological_processes:
  - preferred_term: calcineurin-NFAT signalling downstream of the T cell receptor
    modifier: DECREASED
    term:
      id: GO:0070886
      label: positive regulation of calcineurin-NFAT signaling cascade
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Impaired Peripheral T Cell Proliferation and Metabolism
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39560673
    reference_title: "Dominant negative variants in ITPR3 impair T cell Ca2+ dynamics causing combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their predominant T cell immunodeficiency is characterized by significant T cell lymphopenia, defects in late stages of thymic T cell development, and impaired function of peripheral T cells, including inadequate NF-κB- and NFAT-mediated, proliferative, and metabolic responses to activation."
    explanation: Names the inadequate NF-kB- and NFAT-mediated responses to activation in patient T cells.
- name: Defective Late Thymic T Cell Development
  biological_scale: TISSUE
  description: >-
    T-cell output is reduced by a block in the late stages of thymic development,
    which distinguishes this disease from ORAI1 and STIM1 deficiency, where
    circulating T-cell numbers are typically normal or elevated and the defect is
    purely functional.
  biological_processes:
  - preferred_term: T cell differentiation in thymus
    modifier: DECREASED
    term:
      id: GO:0033077
      label: T cell differentiation in thymus
  cell_types:
  - preferred_term: thymocyte
    term:
      id: CL:0000893
      label: thymocyte
  downstream:
  - target: Decreased total T cell count
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39560673
    reference_title: "Dominant negative variants in ITPR3 impair T cell Ca2+ dynamics causing combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their predominant T cell immunodeficiency is characterized by significant T cell lymphopenia, defects in late stages of thymic T cell development, and impaired function of peripheral T cells, including inadequate NF-κB- and NFAT-mediated, proliferative, and metabolic responses to activation."
    explanation: Reports the late thymic developmental defect alongside the resulting lymphopenia.
- name: Impaired Peripheral T Cell Proliferation and Metabolism
  biological_scale: CELLULAR
  description: >-
    Mature peripheral T cells respond poorly to stimulation, with reduced
    proliferation, a skewed naive-to-memory distribution and a restricted receptor
    repertoire.
  biological_processes:
  - preferred_term: T cell proliferation
    modifier: DECREASED
    term:
      id: GO:0042098
      label: T cell proliferation
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  downstream:
  - target: Combined immunodeficiency
    causal_link_type: DIRECT
  - target: Decreased total CD4+ T cell count
    causal_link_type: DIRECT
  - target: Defective Control of Epstein-Barr Virus Infection
    causal_link_type: DIRECT
    description: Failure of the T-cell response that normally contains EBV-infected B cells.
  - target: Verrucae
    causal_link_type: DIRECT
    description: >-
      Impaired T-cell control of cutaneous viral infection. That the T-cell
      defect is what drives these lesions is shown by their complete resolution
      once donor T cells were established after transplantation.
    evidence:
    - reference: PMID:39560673
      reference_title: Dominant negative variants in ITPR3 impair T cell Ca2+ dynamics causing combined immunodeficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "After HCT, her warts and molluscum resolved completely."
      explanation: >-
        Resolution after haematopoietic cell transplantation ties the cutaneous
        viral disease to the T-cell defect rather than to a separate cause.
  - target: Unusual molluscum contagiosum
    causal_link_type: DIRECT
    description: >-
      Impaired T-cell control of cutaneous viral infection, shown by resolution
      after transplantation.
    evidence:
    - reference: PMID:39560673
      reference_title: Dominant negative variants in ITPR3 impair T cell Ca2+ dynamics causing combined immunodeficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "After HCT, her warts and molluscum resolved completely."
      explanation: >-
        Resolution after transplantation ties the molluscum to the T-cell defect.
  evidence:
  - reference: PMID:39270020
    reference_title: "A pleiotropic recurrent dominant ITPR3 variant causes a complex multisystemic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This leads to defective calcium homeostasis, mitochondrial malfunction, CD4+ lymphopenia, a quasi-absence of naïve CD4+ and CD8+ cells, an increase in memory cells, and a distinct TCR repertoire."
    explanation: Reports the CD4+ lymphopenia, loss of naive cells and repertoire restriction in patients carrying the recurrent variant.
- name: Defective Control of Epstein-Barr Virus Infection
  biological_scale: ORGANISM
  description: >-
    The T-cell defect leaves Epstein-Barr virus poorly contained, and the reported
    consequence is severe EBV-associated haemophagocytic lymphohistiocytosis.
  downstream:
  - target: Hemophagocytosis
    causal_link_type: DIRECT
  - target: Recurrent viral infections
    causal_link_type: DIRECT
  - target: B-cell lymphoma
    causal_link_type: DIRECT
    description: >-
      Uncontrolled Epstein-Barr virus drives B-cell lymphoproliferation, and two
      of the five patients in the defining cohort developed EBV-driven lymphoma.
    evidence:
    - reference: PMID:39560673
      reference_title: Dominant negative variants in ITPR3 impair T cell Ca2+ dynamics causing combined immunodeficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "two additional patients developed EBV-driven lymphomas at the ages of 22 and 12 years, requiring chemotherapy followed by HCT."
      explanation: >-
        Attributes the lymphomas to Epstein-Barr virus, which is what this edge
        claims: the failure of EBV control is what produces them.
  - target: Lymphoproliferative disorder
    causal_link_type: DIRECT
    description: >-
      Across the reported ITPR3 patients, EBV infection presents as lymphoma or
      as lymphoproliferative disease short of lymphoma.
    evidence:
    - reference: PMID:41019080
      reference_title: Two cases of combined immunodeficiency with ITPR3 mutations presenting with life-threatening severe EBV-associated hemophagocytic lymphohistiocytosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Among these 14 patients, 7 developed EBV infection (7/14), presenting with lymphoma or lymphoproliferative disorders, while our two cases progressed to HLH."
      explanation: >-
        Ties EBV infection in ITPR3 patients to lymphoproliferative disease as
        well as to lymphoma, which is the claim this edge makes. The separate
        immune-dysregulation lymphoproliferation reported in PMID:39560673 is
        not attributed to EBV, and is cited on the phenotype rather than here.
  evidence:
  - reference: PMID:41019080
    reference_title: "Two cases of combined immunodeficiency with ITPR3 mutations presenting with life-threatening severe EBV-associated hemophagocytic lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study demonstrates that ITPR3-associated CID confers a susceptibility to EBV-driven pathologies, particularly HLH, which warrants heightened clinical vigilance."
    explanation: Establishes susceptibility to EBV-driven disease, and HLH specifically, as a consequence of the ITPR3 immunodeficiency.
- name: Impaired IP3R-Dependent Enamel Formation
  biological_scale: TISSUE
  description: >-
    IP3R3 is required for enamel formation, which is the mechanistic basis of the
    dental component of the ectodermal dysplasia. This arm is independent of the
    immune arm and is not corrected by transplantation.
  biological_processes:
  - preferred_term: enamel mineralization
    modifier: ABNORMAL
    term:
      id: GO:0070166
      label: enamel mineralization
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  downstream:
  - target: Enamel hypoplasia
    causal_link_type: DIRECT
  - target: Ectodermal dysplasia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39804930
    reference_title: "IP3 receptor depletion in a spontaneous canine model of Charcot-Marie-Tooth disease 1J with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In summary, IP3R3 is critical for enamel formation and peripheral nerve maintenance."
    explanation: States the requirement for IP3R3 in enamel formation, from the spontaneous canine loss-of-protein model.
  - reference: PMID:26515404
    reference_title: "Dental enamel cells express functional SOCE channels."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "inositol 1,4,5-trisphosphate receptor (IP3R) but not ryanodine receptor (RyR) expression was high in enamel cells suggesting that IP3Rs are the main ER Ca(2+) release mechanism."
    explanation: >-
      Identifies IP3Rs as the principal endoplasmic reticulum calcium-release
      mechanism in enamel cells, which is the bridge from the disease's calcium
      lesion to the enamel phenotype. Indirect: primary murine enamel cells, and
      the study does not isolate the IP3R3 isoform.
- name: Peripheral Nerve Maintenance Failure
  biological_scale: TISSUE
  description: >-
    IP3R3 is required for peripheral nerve maintenance, and ITPR3 variants cause
    demyelinating sensorimotor Charcot-Marie-Tooth neuropathy type 1J. The
    neuropathy is incompletely penetrant within this disease, and one patient's
    nerve involvement was a motor neuronopathy without demyelination, so the
    node is kept at the level of nerve maintenance rather than asserting
    demyelination in every case.
  biological_processes:
  - preferred_term: peripheral nervous system myelin maintenance
    modifier: ABNORMAL
    term:
      id: GO:0032287
      label: peripheral nervous system myelin maintenance
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  downstream:
  - target: Peripheral neuropathy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39804930
    reference_title: "IP3 receptor depletion in a spontaneous canine model of Charcot-Marie-Tooth disease 1J with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Variants in the ITPR3 gene, which encodes IP3R3, have recently been found to cause demyelinating sensorimotor Charcot-Marie-Tooth neuropathy type 1J (CMT1J)."
    explanation: >-
      States the human ITPR3 neuropathy phenotype. The quote is from the
      introduction of a canine study, so quote_role records that the citing paper
      is not the source of this human observation.
  - reference: PMID:39287469
    reference_title: "ITPR3-associated neuropathy: Report of a further family with adult onset intermediate Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "ITPR3 encodes type 3 inositol-tri-phosphate receptor (IP3R3), a protein expressed in Schwann cells, predominantly in the paranodal region, and involved in the regulation of Ca2+ release from the endoplasmic reticulum."
    explanation: >-
      Localizes IP3R3 to Schwann cells and the paranodal region, which is what
      grounds the Schwann cell binding on this node. Recorded as BACKGROUND
      because the sentence restates prior expression work rather than this case
      report's own finding.
  - reference: PMID:38938188
    reference_title: "A recurrent missense variant in ITPR3 causes demyelinating Charcot-Marie-Tooth with variable severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This previously reported p.Thr1424Met change was present in 33 affected individuals from nine unrelated families from multiple populations, representing an unusual recurrence rate at a mutational hotspot, strengthening the gene-disease relationship"
    explanation: >-
      Establishes the allelic ITPR3 neuropathy phenotype on a large independent
      cohort. Note the scope: that cohort is ascertained for Charcot-Marie-Tooth
      disease rather than for this immunodeficiency, so it supports the existence
      of the nerve arm, not its frequency within IMD133.

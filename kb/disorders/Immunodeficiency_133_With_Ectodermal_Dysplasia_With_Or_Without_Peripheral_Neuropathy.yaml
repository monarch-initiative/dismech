animal_models:
- name: Lancashire Heeler ITPR3 nonsense dog (spontaneous CMT1J with amelogenesis imperfecta)
  species: Dog
  genotype: ITPR3 homozygous nonsense variant
  publication: PMID:39804930
  description: >-
    Spontaneous canine disorder presenting with a severe developmental enamel
    defect and reduced nerve conduction velocity. Patient fibroblasts lack
    full-length IP3R3 entirely, and IP3R1 and IP3R2 levels fall too, suggesting
    co-regulation.
  modeled_mechanisms:
  - target: Impaired IP3R-Dependent Enamel Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Severe developmental enamel defect in an animal lacking IP3R3, which is the
      evidence that the receptor is required for enamel formation.
    limitations: >-
      The canine allele is a homozygous nonsense variant causing complete absence
      of the protein, whereas the human disease is caused by a heterozygous
      missense variant acting on the assembled tetramer. The model therefore
      establishes the requirement for IP3R3 in enamel, not the dominant-negative
      mechanism by which the human variant produces it.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: IMMATERIAL
      description: >-
        Canine rather than human ameloblasts, but the human and canine IP3R3
        proteins are highly similar and the paper argues the tissue involvement is
        conserved, so the species gap does not bear on this particular claim.
    readouts:
    - name: Developmental enamel defect
      target: Impaired IP3R-Dependent Enamel Formation
      direction: ALTERED
      interpretation: Structural enamel correlate of IP3R3 loss in this model.
      evidence:
      - reference: PMID:39804930
        reference_title: "IP3 receptor depletion in a spontaneous canine model of Charcot-Marie-Tooth disease 1J with amelogenesis imperfecta."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we report the identification of a homozygous nonsense variant in the ITPR3 gene in Lancashire Heeler dogs, presenting with a severe developmental enamel defect and reduced nerve conduction velocity."
        explanation: Reports the enamel defect in the affected dogs.
    evidence:
    - reference: PMID:39804930
      reference_title: "IP3 receptor depletion in a spontaneous canine model of Charcot-Marie-Tooth disease 1J with amelogenesis imperfecta."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In summary, IP3R3 is critical for enamel formation and peripheral nerve maintenance."
      explanation: The model's own conclusion that IP3R3 is required for enamel formation.
  - target: Peripheral Nerve Maintenance Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reduced nerve conduction velocity in dogs lacking IP3R3.
    limitations: >-
      As above, a complete protein-null recessive allele rather than the human
      heterozygous dominant-negative missense variant; and nerve conduction
      velocity was measured without the human cohort's distinction between
      demyelinating and axonal involvement.
    readouts:
    - name: Nerve conduction velocity
      target: Peripheral Nerve Maintenance Failure
      direction: DECREASED
      interpretation: Electrophysiological correlate of the peripheral nerve arm.
      evidence:
      - reference: PMID:39804930
        reference_title: "IP3 receptor depletion in a spontaneous canine model of Charcot-Marie-Tooth disease 1J with amelogenesis imperfecta."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we report the identification of a homozygous nonsense variant in the ITPR3 gene in Lancashire Heeler dogs, presenting with a severe developmental enamel defect and reduced nerve conduction velocity."
        explanation: Reports the reduced nerve conduction velocity in the affected dogs.
  evidence:
  - reference: PMID:39804930
    reference_title: "IP3 receptor depletion in a spontaneous canine model of Charcot-Marie-Tooth disease 1J with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings highlight the first spontaneous mammalian phenotype caused by a nonsense variant in ITPR3, leading to the loss of IP3R3."
    explanation: Establishes the model as the first spontaneous mammalian ITPR3-null phenotype.

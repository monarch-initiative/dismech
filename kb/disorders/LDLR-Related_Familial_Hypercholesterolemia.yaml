  evidence:
  - reference: PMID:24014831
    reference_title: "Effect of the proprotein convertase subtilisin/kexin 9 monoclonal antibody, AMG 145, in homozygous familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No reduction was seen in the 2 receptor-negative patients."
    explanation: >-
      The negative half of the relation - a receptor-directed drug does nothing
      when no receptor can be made.
  - reference: PMID:24014831
    reference_title: "Effect of the proprotein convertase subtilisin/kexin 9 monoclonal antibody, AMG 145, in homozygous familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over the treatment periods, mean±SD LDL cholesterol reductions in the 6 LDL receptor-defective patients were 19.3±16% and 26.3±20% with 4- and 2-week dosing, respectively"
    explanation: >-
      The positive half - the same drug in the same trial lowers LDL when
      residual receptor activity exists.
  - reference: PMID:32813947
    reference_title: "Evinacumab for Homozygous Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The LDL cholesterol level was lower in the evinacumab group than in the placebo group in patients with null-null variants (-43.4% vs. +16.2%) and in those with non-null variants (-49.1% vs. -3.8%)."
    explanation: >-
      Shows the complementary case - an LDLR-independent mechanism works in
      both genotype strata, which is what makes the gating relation
      therapeutically consequential rather than merely prognostic.
  notes: >-
    Caveat on strength of claim: the receptor-negative arm of the AMG 145 study
    comprised two patients, so "no response in receptor-negative disease" rests
    on a very small n even though it is consistent with the mechanism and with
    the way regulatory labels and trial protocols stratify HoFH. Treat the
    direction as well supported and the magnitude as imprecise.

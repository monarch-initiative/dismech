parents:
- Familial Hypercholesterolemia
notes: >
  Scope: curated as a standalone Disease rather than folded into
  kb/disorders/Familial_Hypercholesterolemia.yaml (MONDO:0005439). Four
  reasons. (1) MONDO models MONDO:0007750 as a distinct is_a child of
  MONDO:0005439, anchored on OMIM:143890 and the synonym "LDL receptor
  disorder". (2) The umbrella entry's has_subtypes axis is *zygosity*
  (heterozygous / homozygous), not gene, so a gene-defined entity has no place
  on it without mixing two orthogonal axes. (3) The two other dominant FH genes
  already have sibling entries curated on exactly this rationale -
  Familial_Defective_Apolipoprotein_B-100 (MONDO:0007751, APOB) and
  Autosomal_Dominant_Hypercholesterolemia_3 (MONDO:0011369, PCSK9) - and
  leaving the receptor-side form as the one unmodelled member of the trio makes
  the set incoherent. (4) The mechanism graph curated here is deliberately NOT
  the umbrella's: the umbrella models a single "LDL receptor deficiency" entry
  point into a shared LDL-to-atherosclerosis pathway, whereas this entry
  elaborates the LDL receptor's own itinerary into per-step nodes (synthesis,
  ER-to-Golgi export, surface binding, clathrin-mediated internalization,
  endosomal release and recycling), maps the classical mutation classes onto
  those steps, and carries the residual-receptor-activity node that gates
  response to receptor-dependent therapy. That last relation is what makes the
  allelic series clinically actionable and it is not modelled anywhere else in
  the knowledge base.

  Deliberately NOT duplicated from the umbrella entry: the EHR case-finding
  phenotype algorithms (SEARCH, FAMCAT, FIND FH), the general FH prevalence
  and cascade-screening apparatus, the environmental risk-factor block, and the
  APOB/PCSK9/LDLRAP1/APOE arms. Cite MONDO:0005439 for the disorder as a class;
  cite this entry for receptor-side mechanism.

  Named Entity Confusion preflight (dismech NEC SOP): the hypercholesterolemia
  series is a high-NEC-risk numbered-and-lettered class (FH1/LDLR vs familial
  defective apoB-100 "type B"/APOB vs ADH3/PCSK9). `just preflight-dr` returned
  SKIP because MONDO records no RO:0004003 causal gene for MONDO:0007750, so
  the manual checks were run: the report's OMIM (143890) matches the MONDO
  xref exactly; gene mentions in the report are dominated by LDLR (70) over
  PCSK9 (19) and APOB (3); and the MONDO synonym list ("LDL receptor
  disorder", "hyperlipoproteinemia, type 2A") points at the receptor-side
  entity and does not collide with the labels or synonyms of MONDO:0007751 or
  MONDO:0011369. Mechanistic claims here are anchored on LDLR publications;
  PCSK9 appears only where a PCSK9-directed *drug* acts on the LDL receptor,
  which is receptor-side biology, not the ADH3 disease.

  evidence_source convention for the GeneReviews chapter (PMID:24404629):
  statements taken from its Clinical Characteristics, Diagnosis and Genetic
  Counseling sections report human patient observations and are tagged
  HUMAN_CLINICAL, while statements taken from its Management and
  Agents/Circumstances-to-Avoid sections are expert recommendations rather than
  reported data and are tagged OTHER. The mix of two evidence_source values
  against a single PMID in this file is deliberate, not drift. Separately, the
  chapter covers FH as a class across LDLR, APOB and PCSK9, so several items
  citing it carry supports: PARTIAL to mark the statement as class-level rather
  than LDLR-specific.
references:
- reference: PMID:24404629
  title: "Familial Hypercholesterolemia."
  tags:
  - GeneReviews
  findings:
  - statement: >-
      Clinical characteristics. GeneReviews describes the FH clinical spectrum
      that LDLR-related FH defines - premature atherosclerotic plaque in the
      coronary arteries and proximal aorta, angina and myocardial infarction,
      tendon xanthoma, xanthelasma, and early corneal arcus, with calcific
      aortic valve disease and childhood-onset coronary artery disease in
      biallelic disease. The chapter covers FH as a class across LDLR, APOB and
      PCSK9, so it is class-level rather than LDLR-specific evidence and is
      cited as such throughout this entry.
    supporting_text: >-
      increases the risk of premature cardiovascular events such as angina and
      myocardial infarction
  - statement: >-
      Diagnosis and testing. GeneReviews gives the untreated LDL-C thresholds
      for a clinical FH diagnosis and names LDLR as one of three molecular
      routes to FH - the receptor-side route that defines this entry.
    supporting_text: >-
      The molecular diagnosis of FH can be established by identification of
      heterozygous or biallelic pathogenic variants in APOB (variants that
      impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of
      function); or rarely, identification of biallelic pathogenic variants in
      LDLRAP1.
  - statement: >-
      Management. GeneReviews sets out lipid surveillance from age two years,
      statin initiation in children from around age eight, cardiovascular
      risk-factor modification, and the contraindication of statins in
      pregnancy.
    supporting_text: >-
      Monitor lipid levels from age two years
  - statement: >-
      Agents and circumstances to avoid. GeneReviews names the exposures that
      compound the arterial risk conferred by the receptor defect.
    supporting_text: >-
      Agents/circumstances to avoid: Smoking, high intake of saturated and
      trans unsaturated fat, sedentary lifestyle, obesity, hypertension, and
      diabetes mellitus.
  - statement: >-
      Genetic counseling. GeneReviews states the autosomal dominant
      transmission risk that applies to LDLR-related FH and the more severe,
      earlier-onset presentation of biallelic disease.
    supporting_text: >-
      Each child of an individual with a heterozygous pathogenic variant in
      APOB, LDLR, or PCSK9 has a 50% chance of inheriting the pathogenic
      variant and having FH.

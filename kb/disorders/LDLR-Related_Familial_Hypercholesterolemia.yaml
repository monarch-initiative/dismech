diagnosis:
- name: Molecular Genetic Testing of LDLR
  description: >-
    Sequencing of LDLR together with APOB and PCSK9, plus deletion/duplication
    analysis, since exon-level copy-number changes are a real and
    sequencing-invisible part of the LDLR allelic series. Variant
    interpretation should follow the ClinGen FH Variant Curation Expert Panel's
    LDLR-specific specification of the ACMG/AMP framework rather than the
    generic rules, which is what makes a confident pathogenic call - and
    therefore cascade testing of relatives - possible.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular diagnosis of FH can be established by identification of heterozygous or biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: States the molecular diagnostic route and the genes tested.
  - reference: PMID:34906454
    reference_title: "The Clinical Genome Resource (ClinGen) Familial Hypercholesterolemia Variant Curation Expert Panel consensus guidelines for LDLR variant classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Establishment of these guidelines as the new standard in the clinical laboratory setting will result in a more evidence-based, harmonized method for LDLR variant classification worldwide, thereby improving the care of patients with FH."
    explanation: Names the gene-specific interpretation standard that governs the diagnostic call.
- name: Functional Characterization of LDLR Variants
  description: >-
    Cell-based assays - LDL binding and uptake by flow cytometry with
    fluorescent LDL, receptor expression by immunofluorescence or Western blot,
    and receptor localization by confocal microscopy - performed in
    receptor-deficient CHO-ldlA7 cells transfected with the patient allele.
    These assays do two things no in silico predictor can: they resolve
    variants of uncertain significance into a pathogenicity call, and they
    assign the allele to a functional class, which is the input to
    genotype-guided therapy selection.
  evidence:
  - reference: PMID:25386756
    reference_title: "Advantages and versatility of fluorescence-based methodology to characterize the functionality of LDLR and class mutation assignment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Additionally confocal microscopy allowed the assignment of different class mutation to the variants assayed."
    explanation: Establishes class assignment as an output of the functional assay.
  - reference: PMID:31106925
    reference_title: "Functional analysis of new variants at the low-density lipoprotein receptor associated with familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This approach allows us to confirm the genetic diagnosis of FH, avoiding the classification as \"uncertain significant variants\", and therefore, carry out cascade family screening."
    explanation: States the clinical consequence of functional characterization - VUS resolution enabling cascade screening.
  - reference: PMID:37847331
    reference_title: "Predictive Modeling and Structure Analysis of Genetic Variants in Familial Hypercholesterolemia: Implications for Diagnosis and Protein Interaction Studies."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Despite their contributions, a definitive diagnosis of a genetic variant necessitates functional validation through in vitro characterization or cascade screening."
    explanation: >-
      States that computational prediction alone is insufficient, which is why
      the functional assay is curated as its own diagnostic modality.
differential_diagnoses:
- name: Familial defective apolipoprotein B-100 (APOB)
  description: >-
    The ligand-side mirror of this entry. Clinically indistinguishable at the
    bedside and separated only by molecular testing: here the receptor is
    defective, there the receptor is normal and the apoB-100 ligand it must
    recognize is not. Curated separately as
    Familial_Defective_Apolipoprotein_B-100 (MONDO:0007751). LDL-C elevation is
    generally milder than in LDLR-related disease.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular diagnosis of FH can be established by identification of heterozygous or biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: >-
      GeneReviews names APOB as an alternative molecular cause of the same
      clinical picture and specifies its distinguishing mechanism - impaired
      binding of LDL-C to the receptor rather than a defective receptor.
- name: Autosomal dominant hypercholesterolemia 3 (PCSK9 gain of function)
  description: >-
    The regulator-side member of the dominant trio. The receptor gene is
    intact; a gain-of-function PCSK9 variant degrades normal receptor
    prematurely, so receptor number falls without any receptor defect. Curated
    separately as Autosomal_Dominant_Hypercholesterolemia_3 (MONDO:0011369).
    The practical consequence is therapeutic: PCSK9-directed agents address the
    causal lesion there, whereas here they amplify a residual receptor.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular diagnosis of FH can be established by identification of heterozygous or biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: >-
      GeneReviews lists PCSK9 gain of function as a distinct molecular route to
      the same phenotype.
- name: Autosomal recessive hypercholesterolemia (LDLRAP1)
  description: >-
    The phenocopy of this entry acting in trans. LDLRAP1 encodes the adaptor
    that couples the receptor to the clathrin endocytic machinery, so biallelic
    loss produces functionally the same internalization failure as a class 4
    LDLR allele while the receptor itself is normal. Recessive rather than
    dominant, so parents are typically unaffected - the pedigree pattern is
    usually what separates it clinically.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: >-
      GeneReviews records LDLRAP1 as the rare biallelic route to a clinical FH
      diagnosis, distinguishing it from the dominant genes by inheritance.
- name: Polygenic hypercholesterolemia
  description: >-
    The most common alternative explanation for a clinical FH phenotype with no
    identified monogenic variant: the cumulative effect of many small LDL-C
    raising alleles can reach the same LDL-C range as a monogenic defect.
    Distinguishing it matters because cardiovascular risk, cascade-testing
    yield, and treatment responsiveness differ from monogenic disease, and
    because a negative LDLR test does not exclude clinical FH.
  evidence:
  - reference: PMID:39076699
    reference_title: "Familial Hypercholesterolemia: Pitfalls and Challenges in Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "would suggest polygenic causes of FH, where small but cumulative effects of several LDL-C raising alleles can cause the LDL-C increase up to the same range as that"
    explanation: >-
      States that polygenic burden can reproduce the monogenic LDL-C range,
      which is what makes it the principal differential for a variant-negative
      clinical FH phenotype.
- name: Elevated lipoprotein(a) mimicking familial hypercholesterolemia
  description: >-
    Not a separate disease so much as a measurement artefact that produces the
    same referral. Conventional LDL-C assays cannot separate LDL-cholesterol
    from lipoprotein(a)-cholesterol because the particles overlap in density,
    so a high Lp(a) inflates measured LDL-C and can push a patient into a
    clinical FH category they do not belong in. Relevant to this entry because
    Lp(a) is also genuinely elevated in FH and is curated as a biomarker here.
  evidence:
  - reference: PMID:39076699
    reference_title: "Familial Hypercholesterolemia: Pitfalls and Challenges in Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Conventional assays for LDL-C determination quantify a composite of atherogenic cholesterol, which is attributable not only to LDL-C, but also to lipoprotein(a)-cholesterol (Lp(a)-C) due to their overlapping densities."
    explanation: >-
      Explains the assay overlap that lets high Lp(a) masquerade as the elevated
      LDL-C used to make a clinical FH diagnosis.
- name: Sitosterolemia, dysbetalipoproteinemia, and cholesteryl ester storage disease
  description: >-
    Distinctive non-FH inherited dyslipidemias that can present with severe
    hypercholesterolemia and xanthoma and so enter the differential of a young
    patient with very high LDL-C and no LDLR variant - sitosterolemia (ABCG5 /
    ABCG8), dysbetalipoproteinemia (APOE), and cholesteryl ester storage
    disease / lysosomal acid lipase deficiency (LIPA). Each has its own
    mechanism and, importantly, its own treatment, so misassignment to FH has
    therapeutic consequences.
  evidence:
  - reference: PMID:39076699
    reference_title: "Familial Hypercholesterolemia: Pitfalls and Challenges in Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "some of these genes might also cause distinctive non-FH syndromes such as sitosterolemia (ABCG5), dysbetalipoproteinemia (APOE) or cholesteryl ester storage disease (LIPA)"
    explanation: >-
      Names the non-FH inherited dyslipidemias that share the severe
      hypercholesterolemia presentation.
discussions:
- discussion_id: residual_ldlr_activity_response_threshold
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Reduced Functional Hepatic LDL Receptor Activity"
  prompt: >-
    What residual LDL receptor activity threshold actually separates patients
    who will respond to receptor-directed therapy from those who will not; is
    that threshold the same for statins as for PCSK9-directed agents; and do
    statins in fact lose effect in receptor-negative disease at all, given that
    this has never been tested against an untreated null-genotype stratum?
  rationale: >-
    The entry curates residual receptor activity as the quantity that gates
    receptor-dependent LDL lowering, and the direction of that relation is well
    evidenced. The threshold is not. "Null" has been defined at under 2% of
    wild-type activity in functional-assay literature and operationalized as
    high as 15% in trial protocols, and the pivotal genotype-stratified
    observation rests on two receptor-negative patients. Nor is it established
    that statins (which act transcriptionally, on synthesis) and PCSK9-directed
    agents (which act post-translationally, on degradation and recycling) share
    a threshold - a class 1 null allele leaves nothing for either to act on,
    but a class 5 recycling-defective allele might respond differently to the
    two mechanisms. The asymmetry is sharper than that: the only
    genotype-stratified test in this entry is of a PCSK9 antibody, and its two
    receptor-negative patients were already on stable statin therapy at
    enrolment, so statins have never been shown here to fail in
    receptor-negative disease - and the entry's own cited mechanistic review
    reports statins helping both homozygous and heterozygous patients. The
    null-genotype ceiling for statins is therefore inferred from mechanism
    rather than demonstrated. Without a threshold, and without a
    drug-class-specific test, the relation informs reasoning but does not yet
    support a decision rule.
  proposed_experiments:
  - experiment_id: residual_activity_response_threshold_study
    name: Prospective genotype-stratified response study with quantified residual receptor activity
    description: >-
      In a homozygous and compound-heterozygous FH cohort, measure residual
      LDLR activity for each proband's allele pair in a standardized cell-based
      uptake assay, then relate that quantity to the achieved LDL-C reduction
      on a high-intensity statin and, separately, on a PCSK9 monoclonal
      antibody. The readout is whether a single activity threshold predicts
      response for both drug classes or whether the classes have different
      thresholds.
- discussion_id: ldlr_model_arterial_translation
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - "pathophysiology#Premature Atherosclerotic Cardiovascular Events"
  prompt: >-
    Does the arterial disease of any available LDLR-deficient animal model
    reproduce the human course closely enough to test interventions aimed at
    events rather than at LDL levels?
  rationale: >-
    The clearance defect translates cleanly across species - the Ldlr-/- mouse
    reproduces it and adenoviral receptor restoration reverses it - but the
    arterial arm does not. Murine lipoprotein metabolism is apoB48- and
    HDL-dominated, so the mouse does not reach human homozygous-FH cholesterol
    levels and develops limited spontaneous atherosclerosis on chow. The WHHL
    rabbit is far closer in lipoprotein physiology and does develop coronary
    disease, but the strain history reports that lesion rupture there requires
    secondary mechanical forces such as spasm, so it is not a clean analogue of
    spontaneous human plaque rupture. The genome-edited LDLR-knockout
    cynomolgus monkey reaches human-like lipid levels and develops xanthoma
    within a year, but the published cohort is six founder animals with short
    follow-up and possible editing mosaicism. Each model is informative for the
    node it was curated against and none is currently adequate for
    event-endpoint intervention studies.
  proposed_experiments:
  - experiment_id: cross_species_plaque_rupture_comparison
    name: Cross-species comparison of plaque composition and rupture triggers under matched cumulative LDL exposure
    description: >-
      Compare coronary and aortic lesion composition, fibrous cap thickness,
      and spontaneous versus provoked rupture between LDLR-deficient rabbits,
      LDLR-knockout primates, and human FH imaging cohorts matched on
      cumulative LDL-C exposure rather than on age, to establish which model,
      if any, supports event-level extrapolation.

biochemical:
- name: Plasma LDL Cholesterol
  biomarker_term:
    preferred_term: LDL cholesterol
    term:
      id: CHEBI:47774
      label: low-density lipoprotein cholesterol
  presence: Increased
  notes: >-
    The primary diagnostic and monitoring analyte. Reference intervals and
    interpretation bands are not restated here; the diagnostic thresholds used
    in FH are carried on the phenotype entries above and in the diagnosis
    section.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A clinical diagnosis of FH can be established in a proband with characteristic clinical features and significantly elevated LDL-C levels (typically >190 mg/dL in adults and >160 mg/dL in children)."
    explanation: Establishes LDL-C as the diagnostic analyte and gives its thresholds.
- name: Plasma Apolipoprotein B
  biomarker_term:
    preferred_term: Circulating apolipoprotein B concentration
    term:
      id: HP:0031798
      label: Elevated circulating apolipoprotein B concentration
  presence: Increased
  notes: >-
    Each atherogenic particle carries exactly one apoB-100 molecule, so apoB is
    a particle *count* where LDL-C is a cholesterol *mass*. That distinction
    matters in this disease specifically: the defect is in clearance of
    apoB-100-containing particles, so apoB tracks the quantity the receptor
    actually fails to remove. It also discriminates by allele class - null
    variants carry significantly higher apoB than defective variants in the
    SAFEHEART cohort.
  evidence:
  - reference: PMID:28475941
    reference_title: "Mutational analysis and genotype-phenotype relation in familial hypercholesterolemia: The SAFEHEART registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with null variants have a more severe phenotype than patients with defective variants, presenting with significantly higher levels of atherogenic particles (total cholesterol, LDL-cholesterol and apolipoprotein B)."
    explanation: >-
      Names apolipoprotein B among the atherogenic particle measures elevated in
      this disease, and shows it separating null from defective allele classes.
- name: Lipoprotein(a)
  biomarker_term:
    preferred_term: Circulating lipoprotein(a) concentration
    term:
      id: HP:0430148
      label: Abnormal circulating lipoprotein(a) concentration
  presence: Variable
  notes: >-
    Not caused by the LDLR defect but an independent, additive risk modifier
    within it - and an interpretive trap, because Lp(a)-cholesterol is measured
    within the LDL-C fraction and can inflate an apparent FH phenotype.
  evidence:
  - reference: PMID:24632281
    reference_title: "Lipoprotein(a) levels in familial hypercholesterolemia: an important predictor of cardiovascular disease independent of the type of LDL receptor mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On multivariate analysis, Lp(a) was an independent predictor of cardiovascular disease."
    explanation: Establishes Lp(a) as an independent cardiovascular risk predictor within FH.
  - reference: PMID:24632281
    reference_title: "Lipoprotein(a) levels in familial hypercholesterolemia: an important predictor of cardiovascular disease independent of the type of LDL receptor mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of CVD is higher in those patients with an Lp(a) level >50 mg/dl and carrying a receptor-negative mutation in the LDLR gene compared with other less severe mutations."
    explanation: >-
      Shows Lp(a) risk interacting with the receptor class - the highest risk
      stratum is receptor-negative genotype plus high Lp(a).
genetic:
- name: LDLR
  gene_term:
    preferred_term: LDLR
    term:
      id: hgnc:6547
      label: LDLR
  association: Pathogenic Mutations
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    LDLR at 19p13.2 spans >45 kb in 18 exons that map onto the receptor's
    structural modules. More than 2300 unique FH-associated variants have been
    catalogued - missense (the largest group), nonsense, frameshift, canonical
    and non-canonical splice changes, promoter changes, and exon-level
    deletions and duplications, so deletion/duplication analysis is part of an
    adequate genetic workup and not an optional extra. Variant interpretation
    follows the ClinGen FH Variant Curation Expert Panel's LDLR-specific
    modifications of the ACMG/AMP framework rather than the generic rules.

    The five variant entries below are the *functional* classes - which step of
    the receptor itinerary the allele breaks - and correspond one-to-one with
    the class nodes in the pathophysiology graph. They are orthogonal to the
    ACMG/AMP pathogenicity tiers: an allele has both a class and a
    classification, and only the class predicts response to receptor-directed
    therapy.
  variants:
  - name: Class 1 - null (receptor-negative)
    description: >-
      No LDL receptor protein is synthesized. Large deletions removing the
      promoter, nonsense and frameshift changes, and alleles that make normal
      mRNA but no detectable protein. Homozygotes for two such alleles are
      receptor-negative and respond poorly or not at all to receptor-directed
      drugs.
    type: "null"
    clinical_significance: PATHOGENIC
  - name: Class 2 - transport-defective
    description: >-
      The receptor is synthesized but misfolds and is retained in the
      endoplasmic reticulum instead of maturing through the Golgi to the
      surface. Retention may be complete (2a) or partial (2b).
    type: missense
    clinical_significance: PATHOGENIC
  - name: Class 3 - binding-defective
    description: >-
      Receptor reaches the surface but binds apoB-100 poorly. Changes fall in
      the cysteine-rich ligand-binding repeats or in the EGF-precursor homology
      domain that orients them.
    type: missense
    clinical_significance: PATHOGENIC
  - name: Class 4 - internalization-defective
    description: >-
      Receptor is expressed and binds LDL normally but fails to cluster in
      clathrin-coated pits, because the cytoplasmic internalization signal is
      disrupted. The founding allele is the J.D. mutation, a
      tyrosine-to-cysteine substitution at residue 807.
    type: missense
    clinical_significance: PATHOGENIC
  - name: Class 5 - recycling-defective
    description: >-
      Receptor binds and internalizes LDL but fails to release it in the
      acidified endosome, so receptor and ligand are degraded together and the
      receptor is not returned to the surface.
    type: missense
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:34906454
    reference_title: "The Clinical Genome Resource (ClinGen) Familial Hypercholesterolemia Variant Curation Expert Panel consensus guidelines for LDLR variant classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we provide consensus recommendations for the most common FH-associated gene, LDLR, where >2300 unique FH-associated variants have been identified."
    explanation: Establishes both LDLR primacy and the scale of the allelic series.
  - reference: PMID:34906454
    reference_title: "The Clinical Genome Resource (ClinGen) Familial Hypercholesterolemia Variant Curation Expert Panel consensus guidelines for LDLR variant classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The consensus LDLR variant modifications to existing ACMG/AMP guidelines include (1) alteration of population frequency thresholds, (2) delineation of loss-of-function variant types, (3) functional study criteria specifications, (4) cosegregation criteria specifications, and (5) specific use and thresholds for in silico prediction tools, among others."
    explanation: Names the gene-specific interpretation rules that govern LDLR variant classification.
  - reference: PMID:30306860
    reference_title: "New Horizons in the Pathogenesis, Pathophysiology and Treatment of Familial Hypercholesterolaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common (60-80%) FH cause is mutations of the LDL Receptor (LDLR) protein (6 classes with a different number of receptors and functionality)."
    explanation: >-
      Quantifies the LDLR share of FH and names the receptor-class scheme. Note
      the source counts six classes; the five curated above are the classical
      set, with the sixth (defective basolateral targeting) omitted because no
      quotable functional evidence for it was found.
  - reference: PMID:28475941
    reference_title: "Mutational analysis and genotype-phenotype relation in familial hypercholesterolemia: The SAFEHEART registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with null variants have a more severe phenotype than patients with defective variants, presenting with significantly higher levels of atherogenic particles (total cholesterol, LDL-cholesterol and apolipoprotein B)."
    explanation: >-
      The genotype-phenotype relation that makes the class distinction
      clinically meaningful, in a 2938-patient molecularly diagnosed registry.
  - reference: PMID:30306860
    reference_title: "New Horizons in the Pathogenesis, Pathophysiology and Treatment of Familial Hypercholesterolaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent studies demonstrated the influence of the LDLR mutation type in the FH phenotype, associating a more severe clinical phenotype and worse advanced CVD in patients with null mutation than those with receptor-defective mutations."
    explanation: Independent statement of the null-versus-defective severity gradient.
treatments:
- name: Statin (HMG-CoA Reductase Inhibitor) Therapy
  description: >
    First-line, lifelong LDL-lowering therapy. The mechanism is receptor-side
    and therefore genotype-sensitive: inhibiting HMG-CoA reductase lowers
    intracellular cholesterol, which de-represses LDLR transcription and puts
    more receptor on the hepatocyte surface. The drug therefore amplifies
    whatever receptor capacity the genotype leaves. Note that statins have not
    been tested against a receptor-negative genotype stratum in this entry's
    evidence, and the cited mechanistic review reports statins helping both
    homozygous and heterozygous patients, so the null-genotype ceiling is
    inferred from mechanism rather than demonstrated. In a 2146-patient FH cohort followed a
    mean 8.5 years, statin treatment reduced coronary heart disease risk by
    76%.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: statin
      term:
        id: CHEBI:87631
        label: statin
  target_mechanisms:
  - target: Residual Receptor Activity Gates Receptor-Dependent LDL Lowering
    treatment_effect: ACTIVATES
    description: >
      Statins act by inducing residual LDL receptor, so their effect is bounded
      by how much functional receptor the genotype permits.
    evidence:
    - reference: PMID:37371118
      reference_title: "A Review of Progress on Targeting LDL Receptor-Dependent and -Independent Pathways for the Treatment of Hypercholesterolemia, a Major Risk Factor of ASCVD."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Statins proved to be the first blockbuster drug, helping both HoFH and HeFH individuals by inhibiting the cholesterol synthesis pathway rate-limiting enzyme HMG-CoA reductase and inducing the LDL receptor."
      explanation: States the receptor-inducing mechanism that makes the effect genotype-dependent.
  evidence:
  - reference: PMID:19001495
    reference_title: "Efficacy of statins in familial hypercholesterolaemia: a long term cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed an overall risk reduction of 76% (hazard ratio 0.24 (95% confidence interval 0.18 to 0.30), P<0.001)."
    explanation: Quantifies the cardiovascular benefit of statin therapy in an FH cohort.
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "statins can be used in children starting around age eight years"
    explanation: >-
      GeneReviews sets the paediatric initiation age. PARTIAL because the
      recommendation is made for FH as a class rather than for LDLR-related FH
      specifically.
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Statins are contraindicated in pregnancy because of concerns for teratogenicity and should be discontinued prior to conception."
    explanation: >-
      GeneReviews states the pregnancy contraindication. PARTIAL because it
      constrains rather than supports the therapy, and is stated at class level.
  notes: >
    Two management constraints carried from the GeneReviews FH chapter, both
    class-level: statins may be started in children from around age eight, and
    they are contraindicated in pregnancy and must be stopped before
    conception - a hard interruption in an otherwise lifelong therapy for a
    disorder transmitted to half of offspring.
- name: PCSK9 Monoclonal Antibody Therapy
  description: >
    Alirocumab and evolocumab neutralize circulating PCSK9, preventing
    PCSK9-directed lysosomal degradation of the LDL receptor and so increasing
    receptor recycling and surface abundance. Like statins this is a
    receptor-amplifying mechanism, and the AMG 145 (evolocumab) homozygous-FH
    study is the cleanest published demonstration that the amplification
    requires a receptor to amplify: LDL cholesterol fell in receptor-defective
    patients and not at all in the receptor-negative ones, within the same
    protocol and at the same doses.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: PCSK9 inhibitor
      term:
        id: NCIT:C190797
        label: PCSK9 Inhibitor
  target_mechanisms:
  - target: Residual Receptor Activity Gates Receptor-Dependent LDL Lowering
    treatment_effect: ACTIVATES
    description: >
      Blocking PCSK9 spares existing LDL receptor from degradation, raising
      surface receptor abundance in patients who retain functional receptor and
      achieving nothing in those who do not.
    evidence:
    - reference: PMID:24014831
      reference_title: "Effect of the proprotein convertase subtilisin/kexin 9 monoclonal antibody, AMG 145, in homozygous familial hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This study demonstrates significant and dose-related LDL cholesterol lowering with a PCSK9 monoclonal antibody in homozygous familial hypercholesterolemia patients with defective LDL receptor activity but no reduction in those who were receptor negative."
      explanation: The genotype-stratified result that defines the boundary of this therapy.
  evidence:
  - reference: PMID:24014831
    reference_title: "Effect of the proprotein convertase subtilisin/kexin 9 monoclonal antibody, AMG 145, in homozygous familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over the treatment periods, mean±SD LDL cholesterol reductions in the 6 LDL receptor-defective patients were 19.3±16% and 26.3±20% with 4- and 2-week dosing, respectively"
    explanation: Quantifies the response in receptor-defective homozygous disease.
  - reference: PMID:37130090
    reference_title: "2023 Update on European Atherosclerosis Society Consensus Statement on Homozygous Familial Hypercholesterolaemia: new treatments and clinical guidance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Addition of novel, efficacious therapies (i.e. inhibitors of proprotein convertase subtilisin/kexin type 9, followed by evinacumab and/or lomitapide) offers potential to attain LDL-C goal or reduce the need for LA."
    explanation: Places PCSK9 inhibition in the current consensus treatment sequence for severe disease.
- name: Evinacumab (ANGPTL3 Inhibition)
  description: >
    An angiopoietin-like 3 monoclonal antibody that lowers LDL cholesterol by a
    route that does not require the LDL receptor. This is the therapeutic
    complement of everything above: in the phase 3 homozygous-FH trial it
    lowered LDL cholesterol by a similar amount in patients with null-null
    variants and in those with non-null variants, so it is the option that
    remains when the receptor-directed drugs have nothing to act on.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: evinacumab
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  target_mechanisms:
  - target: Lifelong Elevation of Plasma LDL Cholesterol
    treatment_effect: INHIBITS
    description: >
      Lowers plasma LDL cholesterol without acting through the LDL receptor, so
      the effect is preserved regardless of receptor class.
    evidence:
    - reference: PMID:32813947
      reference_title: "Evinacumab for Homozygous Familial Hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The LDL cholesterol level was lower in the evinacumab group than in the placebo group in patients with null-null variants (-43.4% vs. +16.2%) and in those with non-null variants (-49.1% vs. -3.8%)."
      explanation: Demonstrates genotype-independent efficacy, the defining property of this agent.
  evidence:
  - reference: PMID:32813947
    reference_title: "Evinacumab for Homozygous Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At week 24, patients in the evinacumab group had a relative reduction from baseline in the LDL cholesterol level of 47.1%, as compared with an increase of 1.9% in the placebo group"
    explanation: Reports the primary efficacy result of the pivotal randomized trial.
- name: Lomitapide (Microsomal Triglyceride Transfer Protein Inhibition)
  description: >
    An MTP inhibitor that reduces hepatic assembly and secretion of
    apoB-containing lipoproteins. Like evinacumab it acts upstream of the
    receptor rather than through it, so it is expected to be
    genotype-independent - though, unlike the evinacumab trial, the pivotal
    lomitapide study was single-arm, open-label, and not genotype-stratified,
    so its 50% reduction is a whole-cohort figure and not a demonstration of
    effect in receptor-negative disease specifically. Hepatic steatosis, transaminase elevation,
    gastrointestinal intolerance, and fat-soluble vitamin depletion constrain
    its use and require monitoring.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lomitapide
      term:
        id: CHEBI:72297
        label: lomitapide
  target_mechanisms:
  - target: Lifelong Elevation of Plasma LDL Cholesterol
    treatment_effect: INHIBITS
    description: >
      Reduces the production side of the LDL steady state rather than the
      clearance side, bypassing the receptor defect entirely.
    evidence:
    - reference: PMID:23122768
      reference_title: "Efficacy and safety of a microsomal triglyceride transfer protein inhibitor in patients with homozygous familial hypercholesterolaemia: a single-arm, open-label, phase 3 study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "LDL cholesterol was reduced by 50% (95% CI -62 to -39) from baseline"
      explanation: Quantifies LDL lowering in homozygous disease, where receptor-directed drugs underperform.
  evidence:
  - reference: PMID:23122768
    reference_title: "Efficacy and safety of a microsomal triglyceride transfer protein inhibitor in patients with homozygous familial hypercholesterolaemia: a single-arm, open-label, phase 3 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with homozygous familial hypercholesterolaemia respond inadequately to existing drugs."
    explanation: States the therapeutic gap that LDLR-independent agents were developed to fill.
  - reference: PMID:23122768
    reference_title: "Efficacy and safety of a microsomal triglyceride transfer protein inhibitor in patients with homozygous familial hypercholesterolaemia: a single-arm, open-label, phase 3 study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients had aminotransaminase levels of more than five times the upper limit of normal, which resolved after dose reduction or temporary interruption of lomitapide."
    explanation: Documents the hepatic toxicity signal that constrains dosing.
- name: Lipoprotein Apheresis
  description: >
    Extracorporeal physical removal of apoB-containing lipoproteins from
    plasma. Wholly independent of LDL receptor function and therefore effective
    in receptor-negative disease, but the effect rebounds between sessions and
    the vascular-access, time, and cost burden is substantial. Current
    consensus places it alongside pharmacotherapy as foundational in severe
    biallelic disease.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Lifelong Elevation of Plasma LDL Cholesterol
    treatment_effect: INHIBITS
    description: >
      Removes circulating LDL directly, requiring no receptor and no hepatic
      metabolic step.
    evidence:
    - reference: PMID:37130090
      reference_title: "2023 Update on European Atherosclerosis Society Consensus Statement on Homozygous Familial Hypercholesterolaemia: new treatments and clinical guidance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Combination LDL-C-lowering therapy-both pharmacologic intervention and lipoprotein apheresis (LA)-is foundational."
      explanation: Establishes apheresis as a foundational component of severe-disease management.
  evidence:
  - reference: PMID:37130090
    reference_title: "2023 Update on European Atherosclerosis Society Consensus Statement on Homozygous Familial Hypercholesterolaemia: new treatments and clinical guidance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Addition of novel, efficacious therapies (i.e. inhibitors of proprotein convertase subtilisin/kexin type 9, followed by evinacumab and/or lomitapide) offers potential to attain LDL-C goal or reduce the need for LA."
    explanation: Positions apheresis relative to the newer pharmacologic options.
- name: Ezetimibe
  description: >
    Cholesterol-absorption inhibitor (NPC1L1) added to statin therapy when the
    LDL-C target is not reached - step two of the standard FH escalation.
    Curated here because its mechanism is receptor-dependent in the same sense
    statins are: blocking jejunal cholesterol uptake depletes hepatocyte
    cholesterol and drives a compensatory increase in LDL receptor, so like a
    statin it amplifies whatever receptor capacity the genotype leaves rather
    than bypassing the receptor. Statin-plus-ezetimibe reaches roughly 65-70%
    LDL-C reduction against 50-60% for a high-intensity statin alone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ezetimibe
      term:
        id: CHEBI:49040
        label: ezetimibe
  target_mechanisms:
  - target: Residual Receptor Activity Gates Receptor-Dependent LDL Lowering
    treatment_effect: ACTIVATES
    description: >
      Ezetimibe belongs on the receptor-dependent side of the gating relation,
      not the LDLR-independent side: it lowers LDL-C by inducing residual
      receptor, so its effect is bounded by the receptor capacity the genotype
      permits.
    evidence:
    - reference: PMID:39076699
      reference_title: "Familial Hypercholesterolemia: Pitfalls and Challenges in Diagnosis and Treatment."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ezetimibe by blocking cholesterol uptake from the jejunum) result in a  compensatory increase in LDL-R and subsequently enhanced LDL-C clearance."
      explanation: >-
        States that ezetimibe lowers LDL-C through a compensatory increase in
        LDL receptor, which is what places it on the receptor-dependent side of
        the gating node alongside statins.
  evidence:
  - reference: PMID:39076699
    reference_title: "Familial Hypercholesterolemia: Pitfalls and Challenges in Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "statins (alone or in combination with ezetimibe) demonstrated a significant  reduction of future ASCVD events even in subjects with LDL-R defective forms"
    explanation: >-
      Supports the event-level benefit of statin-plus-ezetimibe specifically in
      receptor-defective disease, the genotype stratum this entry curates.
  notes: >-
    The umbrella entry (Familial_Hypercholesterolemia) describes ezetimibe as
    "independent of LDLR". That is not the characterization adopted here: the
    cited review states that ezetimibe, like a statin, works through a
    compensatory increase in LDL receptor. Ezetimibe's target is independent of
    LDLR, but its LDL-lowering effect is not, which is the distinction this
    entry's gating node is built to make.
- name: Bempedoic Acid
  description: >
    Oral ATP-citrate lyase inhibitor acting upstream of HMG-CoA reductase.
    Because it is a prodrug activated by a liver-specific enzyme absent from
    skeletal muscle, it is the guideline option for statin-intolerant patients
    - a common situation in a disease requiring lifelong high-intensity statin
    therapy. Like statins and ezetimibe it upregulates LDL receptor activity,
    so it sits on the receptor-dependent side of the gating relation. Reported
    LDL-C reduction was 22.3% in a pooled clinical-heterozygous-FH subgroup.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bempedoic acid
      term:
        id: CHEBI:149601
        label: bempedoic acid
  target_mechanisms:
  - target: Residual Receptor Activity Gates Receptor-Dependent LDL Lowering
    treatment_effect: ACTIVATES
    description: >
      Inhibiting ATP-citrate lyase depletes hepatic cholesterol and upregulates
      LDL receptor activity by the same de-repression route statins use, so the
      effect is bounded by residual receptor capacity.
    evidence:
    - reference: PMID:39076699
      reference_title: "Familial Hypercholesterolemia: Pitfalls and Challenges in Diagnosis and Treatment."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "It acts as an inhibitor of adenosine triphosphate (ATP) citrate lyase, a  hepatic enzyme that works upstream of HMG-CoA reductase with subsequent  upregulation of LDL-R activity, similar to statins"
      explanation: >-
        States the target and, critically for this entry, that the LDL-lowering
        effect runs through upregulation of LDL receptor activity.
  evidence:
  - reference: PMID:36876740
    reference_title: "Bempedoic Acid and Cardiovascular Outcomes in Statin-Intolerant Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bempedoic acid, an ATP citrate lyase inhibitor, reduces low-density lipoprotein (LDL) cholesterol levels and is associated with a low incidence of muscle-related adverse events"
    explanation: >-
      CLEAR Outcomes provides the outcome evidence justifying bempedoic acid as
      curated therapy rather than an investigational option.
  notes: >-
    CLEAR Outcomes enrolled statin-intolerant patients at high cardiovascular
    risk, not an LDLR-genotyped or FH-only cohort, so the outcome benefit is not
    LDLR-specific evidence.
- name: Inclisiran (PCSK9-Directed siRNA)
  description: >
    Hepatocyte-targeted small interfering RNA that suppresses PCSK9 synthesis,
    given on days 1 and 90 and every six months thereafter. Mechanistically it
    reaches the same endpoint as a PCSK9 antibody - less PCSK9-mediated
    receptor degradation, therefore more receptor on the hepatocyte surface -
    by inhibiting hepatic PCSK9 production rather than neutralizing circulating
    protein, so it is equally receptor-dependent. ORION-9 (NCT03397121) tested
    it in adults with heterozygous FH.
  therapeutic_modality: SIRNA
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: inclisiran
      term:
        id: CHEBI:176399
        label: inclisiran
  target_mechanisms:
  - target: Residual Receptor Activity Gates Receptor-Dependent LDL Lowering
    treatment_effect: ACTIVATES
    description: >
      Suppressing hepatic PCSK9 synthesis preserves receptor that would
      otherwise be degraded, so like the PCSK9 antibodies the effect requires a
      receptor that can be made and can function.
    evidence:
    - reference: PMID:39076699
      reference_title: "Familial Hypercholesterolemia: Pitfalls and Challenges in Diagnosis and Treatment."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In  contrast to anti-PCSK9 mAbs, inclisiran inactivates PCSK9 by inhibition of its  hepatic synthesis"
      explanation: >-
        Distinguishes the siRNA route to PCSK9 inactivation from antibody
        neutralization while placing both on the same receptor-preserving
        mechanism.
  evidence:
  - reference: PMID:39076699
    reference_title: "Familial Hypercholesterolemia: Pitfalls and Challenges in Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "inclisiran represents a first-in-class cholesterol-lowering small interfering  ribonucleic acid (siRNA), targeting PCSK9 messenger RNA (mRNA) in hepatocytes."
    explanation: Establishes the modality and molecular target of the agent.
- name: Liver Transplantation
  description: >
    The limiting case of the receptor-dependent/receptor-independent axis:
    rather than amplifying or bypassing the patient's own receptor, orthotopic
    liver transplantation *supplies* a hepatic LDL receptor complement, which
    is why it can correct the biochemical defect in receptor-negative disease
    that no receptor-directed drug can reach. Reserved for homozygous patients
    whose LDL-C cannot be controlled by maximal medical therapy and apheresis,
    and constrained by operative risk and lifelong immunosuppression. Where
    severe cardiovascular involvement has already developed, combined
    heart-liver transplantation may be required, which is the argument for
    early listing rather than late rescue.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Reduced Functional Hepatic LDL Receptor Activity
    treatment_effect: ACTIVATES
    description: >
      Replacing the liver replaces the tissue that carries the defective
      receptor, restoring hepatic receptor capacity itself rather than
      modulating the residual capacity a mutant genotype leaves. This is the
      only curated intervention that acts on the receptor-activity node
      directly.
    evidence:
    - reference: PMID:39815304
      reference_title: "Liver transplantation for homozygous familial hypercholesterolemia: a retrospective analysis from Chinese experience."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Accordingly, all 6 patients received orthotopic liver transplantations (OLT), with the result that significant postoperative reductions were observed in levels of TC and LDL."
      explanation: >-
        Reports that supplying a donor liver lowers total and LDL cholesterol,
        which is the receptor-supply mechanism this edge asserts.
  evidence:
  - reference: PMID:39815304
    reference_title: "Liver transplantation for homozygous familial hypercholesterolemia: a retrospective analysis from Chinese experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In severe cases of HoFH, clinical signs and symptoms cannot be controlled well by non-surgical treatments, liver transplantation (LT) currently represents the viable option."
    explanation: >-
      Places liver transplantation as the option of last resort when medical
      therapy fails, the clinical position curated here.
  - reference: PMID:39815304
    reference_title: "Liver transplantation for homozygous familial hypercholesterolemia: a retrospective analysis from Chinese experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If severe cardiovascular involvement occurs, LT should be performed as soon as possible, otherwise combined heart-liver transplantation may be required."
    explanation: >-
      Supports the timing argument in the description - that the cost of late
      listing is escalation to combined heart-liver transplantation.
  notes: >-
    The cited series is six patients, retrospective and single-region, so it
    supports the direction of the effect and the clinical positioning but not a
    quantitative estimate of benefit or of transplant-free survival.
- name: Cardiovascular Risk Factor Modification
  description: >
    The receptor defect sets a high baseline arterial risk that conventional
    risk factors multiply. Smoking cessation, control of blood pressure and
    glycemia, weight management, physical activity, and reduced saturated and
    trans fat intake do not correct the LDL level but reduce absolute event
    risk.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Agents/circumstances to avoid: Smoking, high intake of saturated and trans unsaturated fat, sedentary lifestyle, obesity, hypertension, and diabetes mellitus."
    explanation: >-
      The GeneReviews agents-and-circumstances-to-avoid list, which is what
      this treatment entry operationalizes.
animal_models:
- name: Ldlr-knockout mouse
  species: Mouse
  genotype: Ldlr-/- (homologous recombination in embryonic stem cells)
  publication: PMID:8349823
  description: >-
    The founding genetic model. Viable and fertile, with a selective rise in
    IDL and LDL and a demonstrated prolongation of apoB-lipoprotein clearance,
    and reversible by hepatic re-expression of the human receptor - which
    closes the causal loop between receptor absence and hypercholesterolemia.
  modeled_mechanisms:
  - target: Impaired Receptor-Mediated Clearance of Plasma LDL
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Directly measures the clearance defect that this node represents, in the
      cleanest possible genetic background - complete receptor absence.
    limitations: >-
      Murine lipoprotein metabolism is apoB48- and HDL-dominated rather than
      LDL-dominated, so absolute cholesterol levels are far below human
      homozygous FH and spontaneous atherosclerosis on chow is limited; the
      model reproduces the clearance defect faithfully but not the human
      lipoprotein distribution or the arterial disease burden.
    readouts:
    - name: Plasma clearance half-life of radiolabelled VLDL and LDL
      target: Impaired Receptor-Mediated Clearance of Plasma LDL
      direction: INCREASED
      interpretation: >-
        Prolonged half-life is the direct measurement of the clearance defect;
        normal HDL clearance in the same animals shows the defect is
        ligand-specific.
      evidence:
      - reference: PMID:8349823
        reference_title: "Hypercholesterolemia in low density lipoprotein receptor knockout mice and its reversal by adenovirus-mediated gene delivery."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The half-lives for intravenously administered 125I-VLDL and 125I-LDL were prolonged by 30-fold and 2.5-fold, respectively, but the clearance of 125I-HDL was normal in the LDLR-/- mice."
        explanation: Reports the measured clearance half-lives underlying this readout.
    evidence:
    - reference: PMID:8183926
      reference_title: "The two-receptor model of lipoprotein clearance: tests of the hypothesis in \"knockout\" mice lacking the low density lipoprotein receptor, apolipoprotein E, or both proteins."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "LDLR(-/-) mice had a relatively isolated elevation in plasma LDL"
      explanation: >-
        Confirms that the model isolates the LDL clearance arm rather than
        producing a generalized dyslipidemia.
  - target: Reduced Functional Hepatic LDL Receptor Activity
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Restoring hepatic LDL receptor expression by adenoviral delivery
      normalized the elevated IDL/LDL within four days, demonstrating that the
      receptor deficit is both necessary and sufficient for the phenotype in
      this model.
    limitations: >-
      Adenoviral rescue is acute and supraphysiological hepatic overexpression,
      not a model of the endogenous allelic series; it establishes sufficiency
      of receptor restoration, not the dose-response of partial residual
      activity.
    readouts:
    - name: Plasma IDL/LDL cholesterol after hepatic LDLR re-expression
      target: Reduced Functional Hepatic LDL Receptor Activity
      direction: RESTORED
      interpretation: >-
        Normalization on receptor restoration is the rescue arm of the causal
        claim.
      evidence:
      - reference: PMID:8349823
        reference_title: "Hypercholesterolemia in low density lipoprotein receptor knockout mice and its reversal by adenovirus-mediated gene delivery."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The elevated IDL/LDL level of LDLR-/- mice was reduced to normal 4 d after the intravenous injection of a recombinant replication-defective adenovirus encoding the human LDL receptor driven by the cytomegalovirus promoter."
        explanation: Reports the rescue measurement.
    evidence:
    - reference: PMID:8349823
      reference_title: "Hypercholesterolemia in low density lipoprotein receptor knockout mice and its reversal by adenovirus-mediated gene delivery."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The virus restored expression of LDL receptor protein in the liver and increased the clearance of 125I-VLDL."
      explanation: Confirms that the rescue acted through restored hepatic receptor protein.
- name: Watanabe heritable hyperlipidemic (WHHL) rabbit
  species: Rabbit
  genotype: Naturally occurring homozygous LDL receptor deficiency
  publication: PMID:31748469
  description: >-
    A spontaneously arising LDL-receptor-deficient rabbit strain and its
    coronary-atherosclerosis-prone and myocardial-infarction-prone derivatives.
    Rabbit lipoprotein metabolism is far closer to human than murine, and this
    is the model in which the LDL receptor pathway hypothesis - derived from
    cultured fibroblasts - was shown to hold in a whole animal, and in which
    the arterial consequences of lifelong receptor deficiency were worked out.
  modeled_mechanisms:
  - target: Endothelial Dysfunction and Subendothelial LDL Retention
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Spontaneous, diet-independent hypercholesterolemia from receptor
      deficiency drives the initiating arterial events - oxidized LDL
      accumulation, endothelial adhesion molecule expression, and monocyte
      infiltration.
    limitations: >-
      Rabbits lack the human coronary anatomy and plaque-rupture triggers in
      full, and the reviewed strain history reports that lesion rupture in this
      model requires secondary mechanical forces such as spasm, so event
      generation is not a faithful analogue of human acute coronary syndrome.
    readouts:
    - name: Arterial intimal macrophage infiltration and oxidized LDL accumulation
      target: Endothelial Dysfunction and Subendothelial LDL Retention
      direction: INCREASED
      interpretation: >-
        Histological demonstration of the initiating steps of atherogenesis in
        a receptor-deficient animal.
      evidence:
      - reference: PMID:31748469
        reference_title: "The History of the WHHL Rabbit, an Animal Model of Familial Hypercholesterolemia (I) - Contribution to the Elucidation of the Pathophysiology of Human Hypercholesterolemia and Coronary Heart Disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Oxidized LDL accumulates in the arterial wall, monocyte adhesion molecules are expressed on arterial endothelial cells, and monocyte-derived macrophages infiltrate the arterial intima, resulting in the formation and progression of atherosclerosis."
        explanation: Reports the arterial findings underlying this readout.
    evidence:
    - reference: PMID:31748469
      reference_title: "The History of the WHHL Rabbit, an Animal Model of Familial Hypercholesterolemia (I) - Contribution to the Elucidation of the Pathophysiology of Human Hypercholesterolemia and Coronary Heart Disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The main part of human lipoprotein metabolism has been elucidated, and the low-density lipoprotein (LDL) receptor pathway hypothesis derived from studies using fibroblasts was proven in vivo."
      explanation: >-
        Establishes this strain as the in vivo proof of the receptor pathway,
        which is why it is informative for the arterial arm.
- name: LDLR-knockout cynomolgus monkey
  species: Cynomolgus monkey
  genotype: LDLR knockout by genome editing (six founder animals)
  publication: PMID:37730951
  description: >-
    A genome-edited non-human primate model. Plasma cholesterol reached levels
    comparable to human homozygous FH, periocular xanthoma appeared within the
    first year, and the animals were strongly resistant to lipid-lowering
    medication - the primate counterpart of the receptor-negative
    pharmacological phenotype.
  modeled_mechanisms:
  - target: Residual Receptor Activity Gates Receptor-Dependent LDL Lowering
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Complete receptor knockout reproduces the drug-refractory phenotype that
      defines receptor-negative homozygous disease.
    limitations: >-
      Six founder animals, possible mosaicism from editing, short follow-up,
      and the report characterizes drug resistance in aggregate rather than
      drug-by-drug, so it supports the direction of the gating relation but not
      an agent-specific magnitude.
    readouts:
    - name: LDL cholesterol response to lipid-lowering medication
      target: Residual Receptor Activity Gates Receptor-Dependent LDL Lowering
      direction: UNCHANGED
      interpretation: >-
        Failure to respond in a total-knockout primate is the model-side
        counterpart of the absent response in receptor-negative patients.
      evidence:
      - reference: PMID:37730951
        reference_title: "Generation of a familial hypercholesterolemia model in non-human primate."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The LDLR KO monkeys were also strongly resistant to medications for hypercholesterolemia."
        explanation: Reports the drug-resistance observation underlying this readout.
    evidence:
    - reference: PMID:37730951
      reference_title: "Generation of a familial hypercholesterolemia model in non-human primate."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The levels of plasma cholesterol and triglyceride were quite high in the monkeys, and were similar to those in FH patients with homozygous mutations in the LDLR gene."
      explanation: >-
        Establishes that the model reaches human homozygous-FH lipid levels,
        which is what makes its drug-response behaviour informative.

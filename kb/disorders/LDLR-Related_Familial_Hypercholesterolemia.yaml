- name: Residual Receptor Activity Gates Receptor-Dependent LDL Lowering
  biological_scale: ORGANISM
  description: >-
    The pharmacogenetic node, and the reason the allelic series is clinically
    actionable rather than merely descriptive. Statins lower intracellular
    cholesterol and thereby induce more LDL receptor; PCSK9 antibodies and
    inclisiran prevent or reduce PCSK9-mediated receptor degradation. Both
    families of drugs work by putting *more* receptor on the hepatocyte
    surface, so both require a receptor that can be made and can function. The
    genotype-stratified evidence below is for a PCSK9 antibody: in the two
    receptor-negative (null-null) homozygotes studied there was nothing to
    induce and the response was absent, while in receptor-defective
    homozygotes there was residual receptor and the response was preserved.
    Whether statins behave the same way in receptor-negative disease has not
    been tested here - the two null patients in that trial were already on
    stable statin therapy at enrolment - and the mechanisms differ (statins act
    transcriptionally on receptor synthesis, PCSK9-directed agents
    post-translationally on receptor degradation and recycling), so the
    statin/PCSK9 asymmetry is carried as an open question in the
    residual_ldlr_activity_response_threshold discussion rather than asserted.
    LDLR-independent agents - the MTP inhibitor lomitapide, the ANGPTL3
    antibody evinacumab, and lipoprotein apheresis - bypass the receptor
    entirely and retain effect in null-null disease. This node is the target of
    the treatment entries curated below.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107

- name: Reduced Functional Hepatic LDL Receptor Activity
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The convergence node of the allelic series. Whichever step is broken -
    synthesis, ER export, ligand binding, internalization, or recycling - the
    measurable output is the same: fewer LDL particles cleared per unit time by
    the hepatocyte. Functional assays report this as a single quantity
    (percentage of wild-type LDL uptake), which is why class assignment and
    residual activity are recorded separately: the class says *where* the
    itinerary breaks, the residual activity says *how much* capacity survives.
    Null alleles are conventionally under about 2% of normal activity, though
    trial protocols have operationalized "null" at thresholds as high as 15%.

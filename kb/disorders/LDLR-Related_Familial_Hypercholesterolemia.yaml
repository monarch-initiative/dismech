- name: Defective Clustering in Clathrin-Coated Pits
  biological_scale: CELLULAR
  description: >-
    The class 4 (internalization-defective) branch. The cytoplasmic tail of the
    LDL receptor carries the signal that concentrates it in clathrin-coated
    pits; a change there leaves a receptor that is expressed and binds LDL
    normally but is distributed diffusely over the surface and enters the cell
    slowly. The founding example is patient J.D., whose receptor carries a
    tyrosine-to-cysteine substitution at residue 807. Because the LDLRAP1/ARH
    adaptor serves this same step, the recessive LDLRAP1 disease is the
    phenocopy of this branch acting in trans.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte

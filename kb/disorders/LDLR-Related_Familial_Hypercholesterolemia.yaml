name: LDLR-Related Familial Hypercholesterolemia
creation_date: "2026-08-19T00:00:00Z"
description: >
  LDLR-related familial hypercholesterolemia (familial hypercholesterolemia 1,
  FHCL1; hyperlipoproteinemia type 2A) is the receptor-side form of familial
  hypercholesterolemia and the form for which the disease was originally
  defined. The low-density lipoprotein receptor is a cell-surface transmembrane
  protein that binds apoB-100-containing LDL particles and delivers them to the
  lysosome for degradation, and hepatic LDLR accounts for most clearance of
  plasma LDL. Germline pathogenic variants in LDLR reduce the number of
  functional receptors on the hepatocyte surface, LDL residence time in plasma
  lengthens, and LDL cholesterol is elevated from birth, producing cumulative
  arterial cholesterol exposure, premature atherosclerotic cardiovascular
  disease, and extravascular cholesterol deposition as tendon xanthoma,
  xanthelasma, and corneal arcus.

  What distinguishes this entry from its siblings is the *allelic series*. LDLR
  is a modular mosaic protein whose receptor itinerary - synthesis, folding and
  ER-to-Golgi export, surface presentation, ligand binding, clathrin-mediated
  internalization, endosomal ligand release, and recycling - can be interrupted
  at any step, and the classical five (sometimes six) mutation classes name
  which step a given allele breaks. That is not decorative taxonomy: how much
  receptor activity survives sets the ceiling on every receptor-dependent
  therapy. Statins and PCSK9-directed agents both work by putting *more* LDL
  receptor on the hepatocyte surface, so their effect is bounded by the
  receptor capacity the genotype permits. That bound has been demonstrated
  directly only for PCSK9-directed therapy, where LDL-C fell in
  receptor-defective homozygotes and not at all in the two receptor-negative
  patients studied (PMID:24014831); whether statins are equally null-dependent
  is not established here, and the entry's own cited review reports statins
  helping both homozygous and heterozygous patients. The LDLR-independent
  agents lomitapide, evinacumab, and lipoprotein apheresis act upstream of or
  around the receptor and so are expected to be genotype-independent - shown
  with genotype stratification for evinacumab, and not stratified for the
  other two. This entry curates the receptor
  itinerary, the class-to-step mapping, and the residual-activity-gates-therapy
  relation as its own mechanism graph.
category: Mendelian
synonyms:
- Hypercholesterolemia, familial, 1
- FHCL1
- Familial hypercholesterolemia type 1
- LDL receptor disorder
- LDL receptor deficiency
- Hyperlipoproteinemia type 2A
- Familial hypercholesterolemic xanthomatosis
- Autosomal dominant hypercholesterolemia 1

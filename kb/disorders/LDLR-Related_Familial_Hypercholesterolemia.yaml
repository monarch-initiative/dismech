      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results support the hypothesis that cytoplasmic domains direct receptors to coated pits, thereby determining the high rate of receptor internalization in animal cells."
      explanation: >-
        States the general principle - internalization rate, and therefore
        clearance capacity, is set by the cytoplasmic signal.
- name: Defective Endosomal Ligand Release and Receptor Recycling
  biological_scale: CELLULAR
  description: >-
    The class 5 (recycling-defective) branch. Binding and internalization are
    intact, but the receptor fails to release LDL when the endosome acidifies,
    so receptor and ligand traffic together to the lysosome and the receptor is
    consumed rather than returned to the surface. Each receptor therefore makes
    one round trip instead of many, and functional clearance capacity collapses
    even though synthesis is normal. This is also the step that PCSK9 subverts
    pharmacologically, which is why PCSK9-directed drugs raise receptor
    abundance in patients who still have recyclable receptor.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte

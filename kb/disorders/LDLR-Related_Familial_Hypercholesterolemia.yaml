inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >-
    A single pathogenic LDLR allele is sufficient to raise LDL cholesterol from
    birth, and transmission is autosomal dominant. Penetrance for the
    biochemical phenotype is essentially complete; penetrance for clinical
    cardiovascular events is age-dependent and modified by treatment, Lp(a),
    and conventional risk factors, so expressivity is variable. The trait is
    more precisely co-dominant than dominant, because two pathogenic alleles
    produce a substantially more severe phenotype than one - the gene-dosage
    relation curated under has_subtypes on the umbrella entry.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "APOB-, LDLR-, and PCSK9-related FH are inherited in an autosomal dominant manner."
    explanation: GeneReviews states the mode of inheritance for LDLR-related FH explicitly.
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with a heterozygous pathogenic variant in APOB, LDLR, or PCSK9 has a 50% chance of inheriting the pathogenic variant and having FH."
    explanation: States the 50% transmission risk used in genetic counselling.
  - reference: PMID:1301956
    reference_title: "Molecular genetics of the LDL receptor gene in familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations disrupting the function of this receptor produce autosomal dominant familial hypercholesterolemia (FH)."
    explanation: The founding molecular-genetic account of the disease attributes dominant FH to LDLR mutation.
prevalence:
- population: Molecularly diagnosed familial hypercholesterolemia cohorts
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Recorded as a share of molecularly solved FH rather than as a population
    rate. LDLR is by a wide margin the most common FH gene, but the reported
    share varies with referral criteria, panel design, and whether
    deletion/duplication analysis was performed, so the figure is carried as a
    quoted range with its source rather than normalized to a single number.
    Population prevalence of the FH phenotype as a whole belongs to the
    umbrella entry (MONDO:0005439) and is not restated here.
  evidence:
  - reference: PMID:30306860
    reference_title: "New Horizons in the Pathogenesis, Pathophysiology and Treatment of Familial Hypercholesterolaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common (60-80%) FH cause is mutations of the LDL Receptor (LDLR) protein (6 classes with a different number of receptors and functionality)."
    explanation: Quantifies the LDLR share of FH and names the receptor-class scheme this entry models.
progression:
- phase: Presymptomatic biochemical disease (birth onward)
  notes: >-
    LDL cholesterol is elevated from birth because the receptor defect is
    constitutional. Heterozygotes are typically asymptomatic through childhood
    while arterial cholesterol exposure accumulates; this is the window in
    which treatment has the largest effect on lifetime risk.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Monitor lipid levels from age two years"
    explanation: >-
      Surveillance from age two reflects a biochemical phenotype that is
      present long before any clinical event.
- phase: Extravascular cholesterol deposition (childhood to adulthood)
  notes: >-
    Tendon xanthoma, xanthelasma, and premature corneal arcus accumulate with
    age and with the height of the LDL burden. They are specific but
    insensitive - their absence does not exclude the diagnosis.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Xanthomas (cholesterol deposits in tendons) may be visible in the Achilles tendons or tendons of the hands and worsen with age as a result of extremely high cholesterol levels."
    explanation: Describes the age-dependent accumulation of tendon xanthoma.
- phase: Premature atherosclerotic cardiovascular disease
  notes: >-
    Coronary and proximal aortic plaque develops decades earlier than in the
    general population. In biallelic disease coronary events and calcific
    aortic valve disease can occur in childhood or adolescence.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with a more severe phenotype, often as a result of biallelic variants, can present with very significant elevations in LDL-C (>500 mg/dL), early-onset coronary artery disease (CAD; presenting as early as childhood in some), and calcific aortic valve disease."
    explanation: Sets out the severe end of the course, driven by receptor gene dosage.
pathophysiology:
- name: LDLR Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A germline pathogenic variant in LDLR at 19p13.2. The gene spans more than
    45 kb in 18 exons whose boundaries map onto the receptor's functional
    modules - the cysteine-rich ligand-binding repeats, the EGF-precursor
    homology domain, the O-linked sugar domain, the transmembrane segment and
    the cytoplasmic tail - so the mutated exon largely predicts which step of
    the receptor's itinerary is broken. More than 2300 unique FH-associated
    LDLR variants have been catalogued, spanning missense, nonsense,
    frameshift, splice, promoter and exon-level copy-number changes. This node
    is the single lesion; the five nodes immediately downstream are the
    alternative steps at which it can act.
  genes:
  - preferred_term: LDLR
    term:
      id: hgnc:6547
      label: LDLR
  genetic_context:
    gene:
      preferred_term: LDLR
      term:
        id: hgnc:6547
        label: LDLR
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      The variant consequence is loss of function - fewer functional LDL
      receptors reach or persist on the hepatocyte surface. Recorded on the
      genetic context rather than as a Descriptor modifier because the claim is
      about the consequence of an allele. The severity of that loss is
      allele-specific and is the subject of the class nodes downstream.
  molecular_functions:
  - preferred_term: low-density lipoprotein particle receptor activity
    modifier: DECREASED
    term:
      id: GO:0005041
      label: low-density lipoprotein particle receptor activity
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:1301956
    reference_title: "Molecular genetics of the LDL receptor gene in familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations disrupting the function of this receptor produce autosomal dominant familial hypercholesterolemia (FH)."
    explanation: States the causal relation that defines this entry's trigger node.
  - reference: PMID:2988123
    reference_title: "The LDL receptor gene: a mosaic of exons shared with different proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This gene is more than 45 kilobases in length and contains 18 exons, most of which correlate with functional domains previously defined at the protein level."
    explanation: >-
      Establishes the exon-to-domain correspondence that underlies the
      structure-function mapping used by the class nodes downstream.
  - reference: PMID:34906454
    reference_title: "The Clinical Genome Resource (ClinGen) Familial Hypercholesterolemia Variant Curation Expert Panel consensus guidelines for LDLR variant classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we provide consensus recommendations for the most common FH-associated gene, LDLR, where >2300 unique FH-associated variants have been identified."
    explanation: Quantifies the size of the LDLR allelic series curated by this entry.
  downstream:
  - target: Absent LDL Receptor Synthesis
    causal_link_type: DIRECT
    description: >-
      Null (class 1) alleles - large deletions removing the promoter, nonsense
      and frameshift changes, and alleles producing no detectable protein -
      abolish receptor synthesis outright.
    evidence:
    - reference: PMID:3343347
      reference_title: "Multiple crm- mutations in familial hypercholesterolemia. Evidence for 13 alleles, including four deletions."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "16 of the 132 cell strains (12%) synthesized no immunodetectable LDL receptor protein, indicating the presence of two mutant genes that failed to produce cross-reacting material (crm- mutations)."
      explanation: >-
        Demonstrates the null class directly - patient fibroblasts making no
        detectable receptor protein at all.
  - target: Impaired ER-to-Golgi Transport of the LDL Receptor
    causal_link_type: DIRECT
    description: >-
      Class 2 alleles allow synthesis but the receptor misfolds and is retained
      in the endoplasmic reticulum instead of maturing through the Golgi.
    evidence:
    - reference: PMID:32015373
      reference_title: "Mutation type classification and pathogenicity assignment of sixteen missense variants located in the EGF-precursor homology domain of the LDLR."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Of the analysed variants, we found six non-pathogenic LDLR variants and ten pathogenic variants distributed as follow: three class 3 variants; four class 2 variants; and three class 5 variants."
      explanation: >-
        Assigns real patient variants to the transport-defective class in a
        functional assay, showing the class is an operational category and not
        just a textbook scheme.
  - target: Defective LDL Binding at the Hepatocyte Surface
    causal_link_type: DIRECT
    description: >-
      Class 3 alleles produce a receptor that reaches the surface but binds
      apoB-100 poorly, typically through changes in the cysteine-rich
      ligand-binding repeats or in the EGF-precursor domain that positions
      them.
    evidence:
    - reference: PMID:32015373
      reference_title: "Mutation type classification and pathogenicity assignment of sixteen missense variants located in the EGF-precursor homology domain of the LDLR."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The activity of sixteen LDLR variants was functionally characterized by determining LDLR expression by Western blot and LDLR expression, LDL binding capacity and uptake, and LDLR recycling activity by flow cytometry in transfected CHO-ldlA7 cells."
      explanation: >-
        Describes the assay that separates a binding defect from expression and
        recycling defects, which is what makes this a distinct node.
  - target: Defective Clustering in Clathrin-Coated Pits
    causal_link_type: DIRECT
    description: >-
      Class 4 alleles disable the cytoplasmic internalization signal, so a
      fully synthesized, surface-expressed, ligand-competent receptor never
      enters the cell.
    evidence:
    - reference: PMID:3955657
      reference_title: "The J.D. mutation in familial hypercholesterolemia: amino acid substitution in cytoplasmic domain impedes internalization of LDL receptors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The DNA sequence revealed a substitution of a cysteine codon for a tyrosine codon at residue 807 in the cytoplasmic domain of the receptor."
      explanation: >-
        Identifies the founding internalization-defective allele and localizes
        it to the cytoplasmic tail rather than the ligand-binding region.
  - target: Defective Endosomal Ligand Release and Receptor Recycling
    causal_link_type: DIRECT
    description: >-
      Class 5 alleles allow binding and internalization but the receptor fails
      to release LDL in the acidified endosome, so receptor and ligand are
      degraded together instead of the receptor returning to the surface.
    evidence:
    - reference: PMID:32015373
      reference_title: "Mutation type classification and pathogenicity assignment of sixteen missense variants located in the EGF-precursor homology domain of the LDLR."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "LDLR structure is organized in 5 different domains, including an EGF-precursor homology domain that plays a pivotal role in lipoprotein release and receptor recycling."
      explanation: >-
        Assigns the ligand-release and recycling step to a specific receptor
        domain, the structural basis of the class 5 phenotype.
- name: Absent LDL Receptor Synthesis
  biological_scale: MOLECULAR
  description: >-
    The class 1 (null, receptor-negative) branch. No immunodetectable LDL
    receptor protein is made, because the allele deletes the promoter, produces
    no mRNA, or produces mRNA that yields no protein. This is the most severe
    branch and the one with the least therapeutic room: there is no receptor to
    upregulate. In clinical trials of homozygous disease it is operationalized
    as "null-null" or receptor-negative status.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  molecular_functions:
  - preferred_term: low-density lipoprotein particle receptor activity
    modifier: ABSENT
    term:
      id: GO:0005041
      label: low-density lipoprotein particle receptor activity
  evidence:
  - reference: PMID:3343347
    reference_title: "Multiple crm- mutations in familial hypercholesterolemia. Evidence for 13 alleles, including four deletions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Four of the alleles produced no mRNA. Three of these four mRNA- alleles had large deletions ranging from 6 to 20 kb that eliminated the promoter region of the gene."
    explanation: Documents the molecular routes to complete absence of receptor protein.
  - reference: PMID:32813947
    reference_title: "Evinacumab for Homozygous Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder is associated with genetic variants that result in virtually absent (null-null) or impaired (non-null) LDL-receptor activity."
    explanation: >-
      Shows the null versus non-null distinction being used as a formal
      stratifier in a contemporary phase 3 trial.
  downstream:
  - target: Reduced Functional Hepatic LDL Receptor Activity
    causal_link_type: DIRECT
    description: Absent receptor protein is the limiting case of reduced receptor activity.
    evidence:
    - reference: PMID:3343347
      reference_title: "Multiple crm- mutations in familial hypercholesterolemia. Evidence for 13 alleles, including four deletions."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "16 of the 132 cell strains (12%) synthesized no immunodetectable LDL receptor protein, indicating the presence of two mutant genes that failed to produce cross-reacting material (crm- mutations)."
      explanation: >-
        Reports the measured result: in 12% of homozygous FH cell strains no
        receptor protein is made at all, which is the limiting case of reduced
        receptor activity this edge asserts.
- name: Impaired ER-to-Golgi Transport of the LDL Receptor
  biological_scale: MOLECULAR
  description: >-
    The class 2 (transport-defective) branch. The receptor is synthesized but
    misfolds and is retained in the endoplasmic reticulum rather than being
    further glycosylated in the Golgi and delivered to the surface. Retention
    may be complete (class 2a) or partial (class 2b), and partial retention
    leaves residual surface receptor - which matters therapeutically, because
    residual receptor is what receptor-directed drugs act on.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: DECREASED
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
  evidence:
  - reference: PMID:32015373
    reference_title: "Mutation type classification and pathogenicity assignment of sixteen missense variants located in the EGF-precursor homology domain of the LDLR."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Of the analysed variants, we found six non-pathogenic LDLR variants and ten pathogenic variants distributed as follow: three class 3 variants; four class 2 variants; and three class 5 variants."
    explanation: Assigns patient variants to the transport-defective class by functional assay.
  - reference: PMID:25386756
    reference_title: "Advantages and versatility of fluorescence-based methodology to characterize the functionality of LDLR and class mutation assignment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Additionally confocal microscopy allowed the assignment of different class mutation to the variants assayed."
    explanation: >-
      Confirms that subcellular localization imaging is what distinguishes an
      ER-retained receptor from a surface-expressed one.
  downstream:
  - target: Reduced Functional Hepatic LDL Receptor Activity
    causal_link_type: DIRECT
    description: >-
      A receptor stuck in the ER never reaches the surface, so it contributes
      nothing to LDL clearance regardless of whether its ligand-binding
      sequence is intact.
    evidence:
    - reference: PMID:25386756
      reference_title: "Advantages and versatility of fluorescence-based methodology to characterize the functionality of LDLR and class mutation assignment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Use of fluorescence yielded similar results than 125I-labeled lipoproteins concerning LDLR activity determination, and also allows class mutation classification."
      explanation: >-
        Reports that a single functional readout - LDLR activity - both
        reproduces the reference radiolabel measurement and resolves which
        mutation class produced it, which is what makes receptor activity the
        common quantity every class converges on.
- name: Defective LDL Binding at the Hepatocyte Surface
  biological_scale: MOLECULAR
  description: >-
    The class 3 (binding-defective) branch. Receptor reaches the surface in
    normal numbers but binds apoB-100-containing LDL with reduced affinity.
    Changes typically fall in the cysteine-rich ligand-binding repeats or in the
    EGF-precursor homology domain that holds them in a binding-competent
    conformation. This is the receptor-side mirror of the ligand-side defect
    curated in Familial_Defective_Apolipoprotein_B-100 - the same handshake
    fails, from the other side.

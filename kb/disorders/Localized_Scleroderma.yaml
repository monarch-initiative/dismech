biochemical:
- name: Antinuclear antibody (ANA)
  biomarker_term:
    preferred_term: antinuclear antibody
    term:
      id: NCIT:C70547
      label: Antinuclear Antibody
  notes: >-
    A non-specific autoimmune marker in morphea: up to 50% of patients have
    elevated antinuclear (ANA), anti-histone (AHA) or anti-single-stranded-DNA
    antibodies. These are not disease-specific and do not, by themselves,
    distinguish morphea from other autoimmune conditions.
  evidence:
  - reference: PMID:36860340
    reference_title: "Morphea: The 2023 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "up to 50% of patients have elevated levels of three main autoantibodies: antinuclear (ANA), anti-histone (AHA), and anti-single-stranded DNA"
    explanation: Reports the frequency of ANA and related autoantibodies in morphea.
- name: C-reactive protein
  biomarker_term:
    preferred_term: C-reactive protein
    term:
      id: NCIT:C60651
      label: C-Reactive Protein
  notes: >-
    Hypergammaglobulinemia, elevated CRP and eosinophilia are found in the
    active stages of linear morphea (eosinophilia also in the generalized type);
    these are activity markers, not diagnostic tests.
  evidence:
  - reference: PMID:36860340
    reference_title: "Morphea: The 2023 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hypergammaglobulinemia, elevated CRP and eosinophilia are found in the active stages of linear morphea, while the latter is also seen in the generalized type"
    explanation: Reports raised CRP, hypergammaglobulinemia and eosinophilia in active disease.
environmental:
- name: Environmental triggers (infection, trauma, radiation)
  exposure_term:
    preferred_term: infection, skin trauma or radiation exposure
  description: >-
    In genetically predisposed individuals, infections (including Borrelia
    burgdorferi, EBV and varicella zoster virus), local trauma or surgery,
    radiation and BCG vaccination are proposed triggers of the T-cell-driven
    skin inflammation that initiates morphea. No single exposure is established
    as causal.
  notes: >-
    exposure_term left as free-text preferred_term: the entry aggregates several
    heterogeneous proposed triggers (infection, trauma, radiation), so no single
    ECTO exposure class fits. Individual ECTO bindings could be split out if the
    triggers were modelled as separate environmental entries.
  influences_mechanisms:
  - target: Vascular Endothelial Injury
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed triggers initiate the vascular and immune dysregulation that
      begins the morphea cascade in predisposed individuals.
    evidence:
    - reference: PMID:36860340
      reference_title: "Morphea: The 2023 update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Environmental factors like radiation, skin trauma and infections may trigger in genetically predisposed patients"
      explanation: Links environmental triggers to initiation of the skin inflammation.
  evidence:
  - reference: PMID:36860340
    reference_title: "Morphea: The 2023 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "various exogenous triggers are suggested, including some infections as for SSc, Epstein–Barr virus, varicella zoster virus and Borrelia burgdorferi, as well as local trauma, surgical operations, radiation and BCG vaccinations"
    explanation: Enumerates the proposed exogenous triggers of morphea.
treatments:
- name: UVA1 Phototherapy
  description: >-
    Ultraviolet A1 phototherapy has the most robust evidence for morphea restricted
    to the skin.
  treatment_term:
    preferred_term: ultraviolet A1 phototherapy
    term:
      id: NCIT:C15301
      label: Phototherapy
  target_mechanisms:
  - target: Excessive Dermal Collagen Deposition
    description: UVA1 induces dermal collagenase/MMP-1 and depletes dermal T cells, reducing accumulated collagen in skin-limited disease.
  evidence:
  - reference: PMID:22741933
    reference_title: "Localized scleroderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the most robust data is available for ultraviolet A1 phototherapy in disease that is restricted to the skin, and methotrexate alone or in combination with systemic corticosteroids in more severe disease that additionally affects extracutaneous structures"
    explanation: States UVA1 phototherapy as best-evidenced for skin-restricted morphea.
- name: Topical Corticosteroids

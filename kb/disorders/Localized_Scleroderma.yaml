has_subtypes:
- name: Plaque morphea
  display_name: Plaque (circumscribed) morphea
  description: >-
    The most common and most benign adult subtype: well-defined oval-shaped
    sclerotic plaques that typically do not extend beyond the dermis.
  evidence:
  - reference: PMID:21536453
    reference_title: "Cytokine profiles in localized scleroderma and relationship to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "circumscribed morphea, is characterized by well defined oval-shaped lesions, and typically does not extend beyond the dermis"
    explanation: Defines plaque (circumscribed) morphea as dermis-limited oval plaques.
- name: Generalized morphea
  description: >-
    Several plaques, often confluent, covering a large total body-surface area.
  evidence:
  - reference: PMID:21536453
    reference_title: "Cytokine profiles in localized scleroderma and relationship to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "is termed when there are several plaques, which are often confluent and cover a large total surface area"
    explanation: Defines generalized morphea by confluent plaques over a large surface area.
- name: Deep morphea
  display_name: Deep morphea (morphea profunda)
  description: >-
    Lesions affecting the deeper dermis and extending into subcutaneous tissue and
    often muscle, with prominent subcutaneous atrophy.
  evidence:
  - reference: PMID:21536453
    reference_title: "Cytokine profiles in localized scleroderma and relationship to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "is defined as lesions that affect deeper layer of the dermis, extending into the subcutaneous tissue and often muscle"
    explanation: Defines deep morphea by extension into subcutis and muscle.
- name: Linear scleroderma
  display_name: Linear scleroderma (incl. en coup de sabre / Parry-Romberg)
  subtype_term:
    preferred_term: linear scleroderma
    term:
      id: MONDO:0043294
      label: linear scleroderma
  description: >-
    The most common childhood subtype: one or more linear streaks on the extremities
    or head. It causes the greatest deformity and morbidity, including joint
    contractures, limb-length discrepancy, seizures and strokes. Head/face
    involvement produces en coup de sabre and Parry-Romberg (progressive facial
    hemiatrophy).
  evidence:
  - reference: PMID:21536453
    reference_title: "Cytokine profiles in localized scleroderma and relationship to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the most common subtype in children, is characterized by one or more linear streaks down the extremities or head, and causes the most significant deformities and morbidity, including joint contractures, leg length discrepancy, optic neuritis, vasculitic strokes and seizures"
    explanation: Defines linear scleroderma, its childhood predominance, and its major morbidity.
prevalence:
- population: Children
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 50.0
  notes: >-
    Reported as a prevalence of 50 per 100,000 children in a review of localized
    scleroderma; the disease is more common in children than in adults.
  evidence:
  - reference: PMID:21536453
    reference_title: "Cytokine profiles in localized scleroderma and relationship to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "a disfiguring fibrotic autoimmune disease of the skin and underlying tissue that is more common in children than adults, with a prevalence of 50 per 100,000 children"
    explanation: Source for the pediatric prevalence estimate of 50 per 100,000 children.
pathophysiology:
- name: Vascular Endothelial Injury
  biological_scale: CELLULAR
  conforms_to: "fibrotic_response#Tissue Injury"
  description: >-
    The inflammatory phase begins with injury to the dermal vascular endothelium
    and upregulation of adhesion molecules (E-selectin, VCAM-1) that promote
    monocyte and lymphocyte adhesion and recruitment into the dermis — the
    earliest recognised step of the morphea cascade.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Autoreactive CD4+ T-Cell Dermal Infiltration
    causal_link_type: DIRECT
    description: >-
      Adhesion-molecule upregulation on injured endothelium recruits the
      inflammatory infiltrate.
    evidence:
    - reference: PMID:36860340
      reference_title: "Morphea: The 2023 update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "These adhesion molecules are important for the adherence of monocytes to the endothelium and the recruitment to the area of inflammation"
      explanation: Links endothelial adhesion-molecule upregulation to inflammatory-cell recruitment.
  evidence:
  - reference: PMID:36860340
    reference_title: "Morphea: The 2023 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Up-regulation of several adhesion molecules, such as soluble E-selectin and soluble vascular adhesion molecule-1 (sVCAM-1) was observed in sera of morphea patients"
    explanation: Documents endothelial adhesion-molecule upregulation in morphea.
- name: Autoreactive CD4+ T-Cell Dermal Infiltration
  biological_scale: CELLULAR
  conforms_to: "fibrotic_response#Inflammatory Recruitment and Amplification"
  description: >-
    Trigger factors in genetically predisposed individuals provoke an
    immunologically driven release of pro-inflammatory cytokines and a dense
    dermal and subcutaneous infiltrate of activated T lymphocytes (predominantly
    CD4+ T-helper cells), with plasma cells and eosinophils, that characterizes
    the early, active inflammatory phase. An interferon-gamma / CXCL9-CXCL10 gene
    signature in this phase correlates with clinical disease activity in juvenile
    morphea.
  cell_types:
  - preferred_term: CD4+ T-helper cell
    term:
      id: CL:0000492
      label: CD4-positive helper T cell
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Dermal Fibroblast Activation by TGF-beta and IL-4
    causal_link_type: DIRECT
    description: >-
      Inflammatory cytokine release from the infiltrate activates resident dermal
      fibroblasts.
    evidence:
    - reference: PMID:22741933
      reference_title: "Localized scleroderma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "an immunologically triggered release of pro-inflammatory cytokines, resulting in a profound dysregulation of the connective tissue metabolism and ultimately to induction of fibrosis"
      explanation: Links cytokine release to connective-tissue dysregulation and fibrosis.
  evidence:
  - reference: PMID:21536453
    reference_title: "Cytokine profiles in localized scleroderma and relationship to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Histologically, a dense dermal and subcutaneous lymphocytic infiltrate is identified during this stage"
    explanation: Documents the dermal/subcutaneous lymphocytic infiltrate of the active phase.
  - reference: PMID:21536453
    reference_title: "Cytokine profiles in localized scleroderma and relationship to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "both demonstrate a predominant CD4+ T-helper (Th) lymphocytic infiltrate"
    explanation: Identifies the infiltrate as predominantly CD4+ T-helper cells.
  - reference: PMID:36860340
    reference_title: "Morphea: The 2023 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "a large number of mononuclear lymphocytes (primarily activated T lymphocytes but also macrophages), some plasma cells and eosinophils infiltrate the skin and surrounding blood vessels"
    explanation: Describes the early-stage lymphocyte, plasma-cell and eosinophil infiltrate.
  - reference: PMID:36860340
    reference_title: "Morphea: The 2023 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "chemokine (C-X-C motif) ligand (CXCL)-9, CXCL-10, CXCL-11 and IFN-γ itself in correlation with the clinical disease activity"
    explanation: Reports the IFN-gamma / CXCL9-CXCL10 activity signature in juvenile morphea.
- name: Dermal Fibroblast Activation by TGF-beta and IL-4
  biological_scale: CELLULAR
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  description: >-
    A Th2-skewed cytokine milieu, in which TGF-beta and IL-4 predominate in the
    later fibrotic stage, activates dermal fibroblasts and drives their
    differentiation toward a collagen-producing myofibroblast phenotype.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: TGF-beta receptor signaling
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  downstream:
  - target: Excessive Dermal Collagen Deposition
    causal_link_type: DIRECT
    description: >-
      Activated fibroblasts/myofibroblasts synthesize excess collagen and matrix.
    evidence:
    - reference: PMID:36860340
      reference_title: "Morphea: The 2023 update."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "both IL-4 and TGF-β increase collagen synthesis, and IL-4 furthermore promotes fibroblast proliferation"
      explanation: Links TGF-beta/IL-4 activity to increased collagen synthesis and fibroblast proliferation.
  evidence:
  - reference: PMID:21536453
    reference_title: "Cytokine profiles in localized scleroderma and relationship to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the imbalance between Th1/Th2/Th17 cell subsets drives inflammation in the early stages of disease (Th1 and Th17 predominant) and fibrosis in the later stages of scleroderma (Th2 predominant)"
    explanation: Establishes the Th-subset imbalance with a Th2-predominant fibrotic stage.
  - reference: PMID:36860340
    reference_title: "Morphea: The 2023 update."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "In vitro experiments have shown that tissue fibrosis is caused by overshooting TGF-β and IL-4 activity"
    explanation: In-vitro evidence that excess TGF-beta and IL-4 activity drives fibrosis.
- name: Excessive Dermal Collagen Deposition
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  description: >-
    TGF-beta drives synthesis of collagens, fibronectin and other extracellular-matrix
    proteins while suppressing collagenase, producing the densely packed homogeneous
    collagen that defines the sclerotic ("damage") phase.
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: collagen biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0032964
      label: collagen biosynthetic process
  - preferred_term: extracellular matrix organization
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  downstream:
  - target: Dermal and Subcutaneous Sclerosis with Adnexal Atrophy
    causal_link_type: DIRECT
    description: >-
      Accumulated collagen replaces normal dermal architecture, producing clinical
      sclerosis and atrophy.
    evidence:
    - reference: PMID:21536453
      reference_title: "Cytokine profiles in localized scleroderma and relationship to clinical features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "closely packed homogenous dense collagen deposition with minimal inflammation"
      explanation: Describes the dense collagen deposition of the damage phase.
  evidence:
  - reference: PMID:36860340
    reference_title: "Morphea: The 2023 update."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "TGF-β induces mitogenic activity in fibroblasts by matrix metalloproteinase (MMP)-3 and platelet-derived growth factor (PDGF) as well as the synthesis of several extracellular matrix proteins, such as collagens, fibronectin and others"
    explanation: Links TGF-beta to synthesis of collagen and other ECM proteins.
- name: Dermal and Subcutaneous Sclerosis with Adnexal Atrophy
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Architectural Distortion and Organ Dysfunction"
  description: >-
    Over months to years the lesion becomes less inflammatory and more atrophic:
    thinned epidermis, dense dermal collagen, and loss of adnexal (eccrine, hair,
    sebaceous) structures, giving fine wrinkled dyspigmented skin and, in deeper
    forms, loss of subcutaneous tissue.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Cutaneous sclerotic plaque
    causal_link_type: DIRECT
  - target: Irregular hyperpigmentation
    causal_link_type: DIRECT
  - target: Hypopigmentation of the skin
    causal_link_type: DIRECT
  - target: Flexion contracture
    causal_link_type: DIRECT
  - target: Lipoatrophy
    causal_link_type: DIRECT
  - target: Hemifacial hypoplasia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36860340
    reference_title: "Morphea: The 2023 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "lesions become less sclerotic and more atrophic, showing a fine, wrinkled skin with dyspigmentation and loss of skin appendages"
    explanation: Describes the atrophic end-stage with dyspigmentation and loss of adnexa.
phenotypes:
- name: Cutaneous sclerotic plaque
  category: Cutaneous
  phenotype_term:
    preferred_term: Cutaneous sclerotic plaque
    term:
      id: HP:0031359
      label: Cutaneous sclerotic plaque
  evidence:
  - reference: PMID:36860340
    reference_title: "Morphea: The 2023 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Symmetrical, hyperpigmented, round, slightly depressed and sharply demarcated plaques with varying diameters, from millimeters to several centimeters, are characteristic"
    explanation: >-
      Describes the characteristic sclerotic plaques of morphea. Bound to
      HP:0031359 (Cutaneous sclerotic plaque) rather than the disease-level
      HP:0012344 (Morphea), because this node names the lesion morphology, not
      the disease itself.
- name: Irregular hyperpigmentation
  category: Cutaneous

differential_diagnoses:
- name: Systemic Sclerosis
  disease_term:
    preferred_term: systemic sclerosis
    term:
      id: MONDO:0005100
      label: systemic sclerosis
  description: >-
    Morphea must be distinguished from systemic sclerosis, which adds Raynaud
    phenomenon, sclerodactyly, nailfold-capillary abnormalities, scleroderma-specific
    autoantibodies and internal-organ involvement that localized scleroderma lacks.
  distinguishing_features:
  - Raynaud phenomenon and sclerodactyly (absent in morphea)
  - Nailfold-capillary abnormalities and anti-centromere / anti-Scl-70 antibodies
  - Internal-organ (lung, GI, renal) fibrosis
  evidence:
  - reference: PMID:36860340
    reference_title: "Morphea: The 2023 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Generalized morphea should not present signs of SSc, such as Raynaud phenomenon, sclerodactyly, capillaroscopy abnormalities as well as specific autoantibodies"
    explanation: States the features that distinguish morphea from systemic sclerosis.
- name: Disabling Pansclerotic Morphea of Childhood
  disease_term:
    preferred_term: disabling pansclerotic morphea of childhood
    term:
      id: MONDO:0957497
      label: disabling pansclerotic morphea of childhood
  description: >-
    The most severe end of the morphea spectrum, curated as its own entry
    (Disabling_Pansclerotic_Morphea_Of_Childhood); it adds STAT4 gain-of-function
    autoinflammation, deep circumferential sclerosis into muscle and bone, chronic
    ulceration and squamous-cell-carcinoma risk.
  distinguishing_features:
  - Circumferential pansclerosis extending into fascia, muscle and bone
  - Chronic ulceration, poor wound healing and squamous-cell-carcinoma risk
  - Germline STAT4 gain-of-function in genetically defined cases
- name: Eosinophilic Fasciitis
  disease_term:
    preferred_term: eosinophilic fasciitis
    term:
      id: MONDO:0009175
      label: eosinophilic fasciitis
  description: >-
    Eosinophilic fasciitis (Shulman syndrome) may be considered a form of
    localized scleroderma — it can show concomitant morphea lesions in about 40%
    of patients — but presents with acute, painful, symmetrical limb swelling and
    deep fascial inflammation with peripheral eosinophilia.
  distinguishing_features:
  - Acute painful symmetrical limb swelling, sparing hands and feet
  - Deep fascial (rather than dermal) inflammation with peripheral eosinophilia
  evidence:
  - reference: PMID:36860340
    reference_title: "Morphea: The 2023 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Eosinophilic fasciitis may be considered a form of localized scleroderma, since it can exhibit concomitant morphea lesions in approximately 40% of patients"
    explanation: States the overlap of eosinophilic fasciitis with localized scleroderma.
diagnosis:
- name: Clinical and histopathologic diagnosis
  description: >-
    Diagnosis is clinical, supported by skin biopsy showing dermal sclerosis. There
    are no disease-specific serological markers; non-specific markers do occur
    (ANA/anti-histone/anti-ssDNA autoantibodies in up to 50%, and raised CRP,
    hypergammaglobulinemia and eosinophilia in active disease — see the biochemical
    section), but these do not establish the diagnosis. The absence of
    scleroderma-specific autoantibodies, Raynaud phenomenon and internal-organ
    disease separates localized scleroderma from systemic sclerosis.
  evidence:
  - reference: PMID:22741933
    reference_title: "Localized scleroderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "there are no specific serological markers available for localized scleroderma"
    explanation: States the absence of specific serological markers in localized scleroderma.
notes: >-
  Curated as a single Disease (one reasonably conserved fibrotic pathograph) with
  clinical variants carried as has_subtypes rather than as separate entries, because
  plaque, generalized, deep and linear scleroderma share the autoimmune,
  TGF-beta/IL-4-driven dermal-fibrosis mechanism and differ mainly in depth and
  distribution. Linear scleroderma carries its own MONDO term (MONDO:0043294). The
  most severe end of the spectrum, disabling pansclerotic morphea of childhood
  (MONDO:0957497), is a separate curated entry and is linked here as a differential
  rather than re-curated. Part of the scleroderma grouping tracker (issue #19103).
  Mechanism nodes conform to the fibrotic_response module.

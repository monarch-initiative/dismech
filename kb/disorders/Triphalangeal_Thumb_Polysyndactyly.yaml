animal_models:
- name: Human pZRS mutant transgenic mouse enhancer-reporter assay
  species: Mus musculus
  genotype: >-
    Transgenic reporter carrying the human TPT-PS-associated pZRS
    chr7:156585476G>C allele
  publication: PMID:29543231
  description: >-
    A mouse transgenic enhancer assay tested the human patient pZRS allele at
    embryonic day 11.5 and showed extended ectopic reporter expression across
    the developing limb bud.
  modeled_mechanisms:
  - target: Ectopic Limb-Bud SHH Regulatory Activity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The reporter assay directly reproduces the spatial gain of enhancer
      activity caused by the patient allele.
    limitations: >-
      The assay uses an isolated human regulatory construct and reporter in a
      mouse embryo; it does not reproduce the full human SHH-LMBR1 locus,
      endogenous SHH transcription, or the mature hand-foot phenotype.
    readouts:
    - name: Limb-bud enhancer-reporter expression at E11.5
      target: Ectopic Limb-Bud SHH Regulatory Activity
      direction: INCREASED
      interpretation: >-
        Spatially extended reporter expression is the direct readout of ectopic
        pZRS enhancer activity.
      evidence:
      - reference: PMID:29543231
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Functional characterization using a mouse transgenic enhancer essay
          showed extended ectopic expression dispersed throughout the entire
          limb bud (E11.5).
        explanation: >-
          Directly reports the model readout and developmental time point.
    evidence:
    - reference: PMID:29543231

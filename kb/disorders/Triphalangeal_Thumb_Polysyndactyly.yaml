pathophysiology:
- name: ZRS or pZRS Regulatory Gain of Ectopic Expression
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous duplication encompassing ZRS or a pathogenic pZRS point
    variant changes the activity of the limb-specific SHH enhancer domain.
    This is a noncoding gain-of-ectopic-expression mechanism, not SHH protein
    loss of function and not a coding LMBR1 defect.
  genes:
  - preferred_term: LMBR1
    term:
      id: hgnc:13243
      label: LMBR1
  evidence:
  - reference: PMID:18417549
    reference_title: >-
      Triphalangeal thumb-polysyndactyly syndrome and syndactyly type IV are
      caused by genomic duplications involving the long range, limb-specific
      SHH enhancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Point mutations in the ZRS and duplications encompassing the ZRS cause
      distinctive limb phenotypes.
    explanation: >-
      Establishes regulatory alteration of ZRS as a limb-patterning lesion and
      distinguishes variant-class-specific phenotypes.
  - reference: PMID:29543231
    reference_title: >-
      A point mutation in the pre-ZRS disrupts sonic hedgehog expression in
      the limb bud and results in triphalangeal thumb-polysyndactyly syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our work describes the first mutation in the pZRS to be associated with
      TPT-PS and provides functional evidence that this mutation leads to
      ectopic expression of this enhancer within the developing limb.
    explanation: >-
      Supports the rarer pZRS regulatory route to TPT-PS.
  downstream:
  - target: Ectopic Limb-Bud SHH Regulatory Activity
    causal_link_type: DIRECT
    description: >-
      Increased enhancer dosage or altered pZRS sequence directly changes the
      spatial activity of the limb-specific SHH regulatory domain.
    evidence:
    - reference: PMID:29543231
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Functional characterization using a mouse transgenic enhancer essay
        showed extended ectopic expression dispersed throughout the entire
        limb bud (E11.5).
      explanation: >-
        The transgenic enhancer assay directly measures ectopic regulatory
        activity of the patient pZRS allele.
  - target: Altered SHH-LMBR1 Regulatory-Domain Contacts
    causal_link_type: UNKNOWN
    description: >-
      Patient fibroblasts carrying the pZRS variant show increased contacts
      across the SHH-LMBR1 TAD, but the causal path from the variant to this
      contact pattern is unresolved.
    evidence:
    - reference: PMID:35821352
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        The results of 4C-seq experiments revealed increased interactions
        within the whole SHH regulatory domain (SHH-LMBR1 TAD) in the patient
        compared to controls.
      explanation: >-
        Supports the contact difference but not a complete causal mechanism or
        its fidelity to embryonic limb tissue.
- name: Ectopic Limb-Bud SHH Regulatory Activity
  conforms_to: >-
    limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Mutant regulatory sequences activate a reporter outside the normal
    posterior zone of polarizing activity, extending activity across the limb
    bud. This establishes spatial gain of enhancer activity; it should not be
    overread as a measurement of endogenous human SHH protein abundance.
  biological_processes:
  - preferred_term: Smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: ABNORMAL
  locations:
  - preferred_term: limb bud
    term:
      id: UBERON:0004347
      label: limb bud
  evidence:
  - reference: PMID:29543231
    reference_title: >-
      A point mutation in the pre-ZRS disrupts sonic hedgehog expression in
      the limb bud and results in triphalangeal thumb-polysyndactyly syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Functional characterization using a mouse transgenic enhancer essay
      showed extended ectopic expression dispersed throughout the entire limb
      bud (E11.5).
    explanation: >-
      Direct functional evidence for ectopic limb-bud enhancer activity.
  downstream:
  - target: Disrupted Digit Number and Identity Specification
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered SHH morphogen distribution and GLI3 repressor gradient
    description: >-
      Spatially deregulated SHH regulatory activity perturbs the
      anterior-posterior information used to specify digit number and identity.
    evidence:
    - reference: PMID:18178630
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Point mutations within this non-coding regulatory region designated ZRS
        lead to ectopic expression of Shh in the anterior margin of the limb bud,
        as shown in mice, and cause the human triphalangeal thumb and
        polysyndactyly (TPT-PS) phenotype.
      explanation: >-
        Links anterior ectopic SHH activity to the human TPT-PS phenotype.
- name: Altered SHH-LMBR1 Regulatory-Domain Contacts
  biological_scale: MOLECULAR
  role: modifier
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Circular chromatin-conformation capture in patient skin fibroblasts found
    increased contacts across the SHH-LMBR1 TAD. The observation is real, but
    its mechanistic relationship to ectopic embryonic limb expression is
    uncertain because fibroblasts are not limb-bud tissue and the authors did
    not resolve how the variant changes contacts.
  evidence:
  - reference: PMID:35821352
    reference_title: >-
      The pZRS non-coding regulatory mutation resulting in triphalangeal
      thumb-polysyndactyly syndrome changes the pattern of local interactions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The results of 4C-seq experiments revealed increased interactions within
      the whole SHH regulatory domain (SHH-LMBR1 TAD) in the patient compared
      to controls.
    explanation: >-
      Directly supports the measured chromatin-contact phenotype in patient
      fibroblasts.
- name: Disrupted Digit Number and Identity Specification
  conforms_to: >-
    limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity
    Specification
  biological_scale: TISSUE
  role: central_effector
  description: >-
    The abnormal spatial SHH signal perturbs anterior-posterior digit-number,
    digit-identity, and phalangeal-segmentation programs in the developing
    autopod.
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: Anterior/posterior pattern specification
    term:
      id: GO:0009952
      label: anterior/posterior pattern specification
    modifier: ABNORMAL
  - preferred_term: Embryonic limb morphogenesis
    term:
      id: GO:0030326
      label: embryonic limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:18417549
    reference_title: >-
      Triphalangeal thumb-polysyndactyly syndrome and syndactyly type IV are
      caused by genomic duplications involving the long range, limb-specific
      SHH enhancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Sonic hedgehog (SHH) protein produced in the zone of polarising
      activity (ZPA) is a major determinant of the identity and numbers of
      digits in early limb development.
    explanation: >-
      Establishes SHH-dependent digit-number and identity specification as the
      affected developmental program.
  downstream:
  - target: Serially Homologous Autopod Malformation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - abnormal digit condensation and phalangeal segmentation
    description: >-
      Altered digit specification produces the coordinated triphalangism,
      polydactyly, and syndactyly phenotype across the hands and feet.
    evidence:
    - reference: PMID:10594878
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Triphalangeal thumb-polysyndactyly (TPT-PS) is an isolated limb
        malformation consisting of pre- and postaxial polysyndactyly of hands
        and feet.
      explanation: >-
        Documents the serially repeated hand-foot outcome in human TPT-PS.
- name: Serially Homologous Autopod Malformation
  conforms_to: >-
    limb_digit_patterning_serial_homology#Serially Homologous Autopod
    Malformation
  biological_scale: TISSUE
  role: consequence
  description: >-
    Because homologous digit-patterning programs operate in the forelimb and
    hindlimb autopods, the single cis-regulatory lesion can produce a variable
    bundle of triphalangeal thumbs, preaxial and postaxial polydactyly, and
    finger or foot syndactyly rather than an isolated single-element defect.
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: Limb morphogenesis
    term:
      id: GO:0035108
      label: limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:10594878
    reference_title: >-
      Phenotypic variability of triphalangeal thumb-polysyndactyly syndrome
      linked to chromosome 7q36.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The characteristic findings in this family are triphalangeal thumb,
      webbing between 3rd, 4th, and 5th fingers associated with bony synostosis
      in the distal phalanges of the same fingers, and pre- and postaxial
      polysyndactyly of feet.
    explanation: >-
      Directly supports the coordinated hand-foot malformation bundle.
  downstream:
  - target: Triphalangeal Thumb
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - abnormal thumb phalangeal segmentation
  - target: Preaxial Hand Polydactyly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - supernumerary preaxial digit specification
  - target: Postaxial Hand Polydactyly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - supernumerary postaxial digit specification
  - target: Finger Syndactyly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - incomplete interdigital separation and phalangeal synostosis
  - target: Preaxial Foot Polydactyly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - supernumerary preaxial digit specification
  - target: Postaxial Foot Polydactyly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - supernumerary postaxial digit specification
diagnosis:
- name: ZRS copy-number analysis with pZRS sequencing
  description: >-
    Molecular evaluation should be able to detect copy-number gains spanning
    ZRS and point variants in the adjacent pZRS. A coding-only gene panel or
    exome may miss both regulatory variant classes.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:35821352
    reference_title: >-
      The pZRS non-coding regulatory mutation resulting in triphalangeal
      thumb-polysyndactyly syndrome changes the pattern of local interactions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study expands the number of TPT-PS families carrying a pathogenic
      alteration of the pZRS and underlines the importance of routine pZRS
      sequencing in the genetic diagnostics of patients with TPT-PS or similar
      phenotypes.
    explanation: >-
      Directly supports pZRS sequencing after routine approaches do not find a
      ZRS alteration.
  - reference: PMID:18417549
    reference_title: >-
      Triphalangeal thumb-polysyndactyly syndrome and syndactyly type IV are
      caused by genomic duplications involving the long range, limb-specific
      SHH enhancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We designed 17 additional qPCR assays and defined the minimum
      duplications in all six families, ranging from 131kb to 398kb.
    explanation: >-
      Supports copy-number-sensitive analysis for the common
      ZRS-encompassing duplication class.
treatments:
- name: Individualized triphalangeal-thumb and polydactyly reconstruction
  description: >-
    Hand surgery may remove an accessory/delta phalanx, reconstruct ligaments,
    perform osteotomy, or rebalance soft tissues according to the individual's
    anatomy and functional goals. It corrects established anatomy and does not
    reverse the embryonic SHH-patterning lesion.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic hand surgery
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_phenotypes:
  - preferred_term: Triphalangeal thumb
    term:
      id: HP:0001199
      label: Triphalangeal thumb
  - preferred_term: Preaxial hand polydactyly
    term:
      id: HP:0001177
      label: Preaxial hand polydactyly

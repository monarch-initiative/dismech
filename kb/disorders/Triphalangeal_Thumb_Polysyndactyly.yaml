datasets: []
discussions:
- discussion_id: pzrs_chromatin_contact_mechanism
  prompt: >-
    Do pZRS-associated changes in SHH-LMBR1 chromatin contacts cause ectopic
    limb-bud SHH expression, and are the fibroblast contact differences present
    in the disease-relevant embryonic cell state?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#ZRS or pZRS Regulatory Gain of Ectopic Expression
  - pathophysiology#Altered SHH-LMBR1 Regulatory-Domain Contacts
  - pathophysiology#Ectopic Limb-Bud SHH Regulatory Activity
  rationale: >-
    Patient fibroblasts show increased TAD contacts and a transgenic mouse
    reporter shows ectopic enhancer activity, but the studies do not establish
    that the contact change causes endogenous SHH misexpression in human
    limb-bud mesenchyme. The source explicitly states that the contact change
    arose by an unknown mechanism.
  proposed_experiments:
  - experiment_id: pzrs_isogenic_limb_bud_contact_expression
    name: Isogenic pZRS limb-bud chromatin and expression study
    description: >-
      Introduce and correct the recurrent pZRS variant in isogenic human
      iPSC-derived limb-bud mesenchymal models, then jointly measure enhancer
      accessibility, SHH-LMBR1 contacts, endogenous SHH expression, and
      Hedgehog-response gradients across the developmental time course.
    readouts:
    - name: Difference in SHH-LMBR1 contact frequency
      target: pathophysiology#Altered SHH-LMBR1 Regulatory-Domain Contacts
    - name: Spatial and temporal endogenous SHH expression
      target: pathophysiology#Ectopic Limb-Bud SHH Regulatory Activity
  evidence:
  - reference: PMID:35821352
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The pathogenic mutation causative for TPT-PS in our patient gave rise to
      increased interactions within the SHH regulatory domain in yet unknown
      mechanism.
    explanation: >-
      The authors explicitly identify the mechanism connecting the pZRS variant
      to altered contacts as unresolved.
notes: >-
  Identity boundary: TPT-PS is MONDO:0017454 / OMIM:190605 / ORPHA:2950.
  PPD2 (polydactyly of a triphalangeal thumb) is MONDO:0008270 / OMIM:174500
  and is not the primary disease term for this file, although both conditions
  involve the SHH limb-regulatory domain. TPT-PS and syndactyly type IV share
  ZRS-duplication genetics and are reported as a phenotypic continuum
  (PMID:23793141); they remain separately named ontology entities rather than
  being declared subtypes here. No disease-specific GeneReviews article was
  located. GEO discovery returned GSE44325 as a lexical polydactyly hit, but it
  studies Sost/Sostdc1-Gli3 digit-number biology rather than a ZRS/pZRS TPT-PS
  model, so no dataset accession was curated. No TPT-PS-specific clinical trial
  was identified. The prior disconnected ZRS dosage-effect node based on a
  homozygous PPD2/Werner-mesomelic-syndrome allele was removed because it
  crossed this entry's disease boundary.

genetic:
- name: MECR
  gene_term:
    preferred_term: MECR
    term:
      id: hgnc:19691
      label: MECR
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic (homozygous or compound heterozygous) pathogenic MECR variants are
    the sole known cause of MEPAN. The founding cohort reported six variants
    across five families - nonsense (p.Tyr285*), frameshift (p.Asn83Hisfs*4),
    splice-site (c.830+2_830+3insT) and missense in the cofactor-binding domain
    (p.Gly232Glu, p.Tyr285Cys, p.Arg258Trp). The recurrent p.Arg258Trp allele
    has since been reported in homozygous form causing both classic disease and
    atypical adult-onset / LHON-like optic neuropathy, and a homozygous
    p.Asp304Tyr allele caused dystonia and basal-ganglia disease without optic
    atrophy.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:27817865
    reference_title: "MECR Mutations Cause Childhood-Onset Dystonia and Optic Atrophy, a Mitochondrial Fatty Acid Synthesis Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All six mutations are extremely rare in the general population, segregate with the disease in the families, and are predicted to be deleterious."
    explanation: Establishes the recessive MECR variant spectrum segregating with disease in the founding cohort.
  - reference: PMID:38296034
    reference_title: "Recurrent MECR R258W causes adult-onset optic atrophy: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of whole-exome sequencing (WES) revealed a homozygous recurrent variant (NM_016011.5:c.772C > T, p.Arg258Trp) in MECR."
    explanation: Documents the recurrent homozygous p.Arg258Trp allele underlying phenotypic heterogeneity.
  - reference: PMID:33401012
    reference_title: "Whole exome sequencing identifies a novel homozygous MECR mutation in a Chinese patient with childhood-onset dystonia and basal ganglia abnormalities, without optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a novel homozygous MECR mutation (c.910G > T, p.Asp304Tyr) in a Chinese patient with childhood-onset dystonia and basal ganglia abnormalities, without optic atrophy."
    explanation: Extends the variant spectrum and shows a genotype associated with dystonia and basal-ganglia disease without optic atrophy.
diagnosis:
- name: Molecular diagnosis by biallelic MECR variants
  description: >-
    The diagnosis is established in a proband with a childhood-onset movement
    disorder in whom molecular genetic testing identifies biallelic (compound
    heterozygous or homozygous) pathogenic MECR variants. The characteristic
    T2-hyperintense basal-ganglia MRI signal and optic atrophy raise the
    clinical suspicion that prompts testing.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Two pathogenic MECR variants in trans confirm the diagnosis; a single
    heterozygous variant is not diagnostic in this autosomal recessive disorder.
  evidence:
  - reference: PMID:31070877
    reference_title: "MECR-Related Neurologic Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of MECR-related neurologic disorder is established in a proband with a childhood-onset movement disorder and biallelic (compound heterozygous or homozygous) pathogenic variants in MECR identified by molecular genetic testing."
    explanation: GeneReviews states the molecular diagnostic criterion (biallelic MECR variants by molecular genetic testing).
- name: Whole-exome sequencing as the testing approach
  description: >-
    In practice the biallelic MECR variants are most often ascertained by
    whole-exome sequencing in a child with an unexplained childhood-onset
    dystonia and basal-ganglia MRI changes.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:38296034
    reference_title: "Recurrent MECR R258W causes adult-onset optic atrophy: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of whole-exome sequencing (WES) revealed a homozygous recurrent variant (NM_016011.5:c.772C > T, p.Arg258Trp) in MECR."
    explanation: Illustrates whole-exome sequencing as the modality that identifies the causative MECR variant.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare. The founding report described 7 individuals from 5 families
    (2016); GeneReviews notes only 13 affected individuals known to its authors;
    the MEPAN Foundation reported more than 30 diagnosed individuals worldwide by
    early 2023. These are ascertained case counts in a growing cohort, not a true
    population prevalence estimate.
  evidence:
  - reference: PMID:31070877
    reference_title: "MECR-Related Neurologic Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because only 13 affected individuals are known to the authors, and because nearly half of them were diagnosed retrospectively as adults, the natural history of disease progression and other aspects of the phenotype have not yet been completely defined."
    explanation: GeneReviews reports the small number of known affected individuals, supporting the ultra-rare classification.
  - reference: PMID:38328756
    reference_title: "Application of deep brain stimulation for the treatment of childhood-onset dystonia in patients with MEPAN syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "by early 2023, more than 30 people had been diagnosed with MEPAN syndrome globally since its discovery in 2016"
    explanation: Provides an updated global ascertained case count for the growing cohort.
environmental:
- name: Intercurrent febrile illness
  description: >-
    Febrile illness is listed by GeneReviews among the circumstances to avoid
    because it is presumed to exacerbate disease progression, consistent with
    the metabolic-decompensation vulnerability of a mitochondrial bioenergetic
    disorder in which fever raises energy demand.
  effect: Presumed to exacerbate disease progression
  notes: >-
    No ECTO exposure term binds "febrile illness" as an environmental exposure
    (fever is a physiologic state rather than an external agent); exposure_term
    is therefore left unbound.
  evidence:
  - reference: PMID:31070877
    reference_title: "MECR-Related Neurologic Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stress and febrile illness as much as possible as these are presumed to exacerbate disease progression. Discuss anesthetic risks with a patient's medical team prior to surgical procedures."
    explanation: GeneReviews lists febrile illness among circumstances presumed to worsen disease progression.
  influences_mechanisms:
  - target: Mitochondrial Bioenergetic Failure
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fever raises systemic and neuronal energy demand, which is presumed to
      unmask or worsen the underlying oxidative-phosphorylation deficit; the
      mechanistic intermediates are not established.
    evidence:
    - reference: PMID:31070877
      reference_title: "MECR-Related Neurologic Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Stress and febrile illness as much as possible as these are presumed to exacerbate disease progression. Discuss anesthetic risks with a patient's medical team prior to surgical procedures."
      explanation: GeneReviews presumes febrile illness exacerbates progression of this mitochondrial disorder.
- name: Physiologic stress
  description: >-
    Stress is likewise listed by GeneReviews among circumstances to avoid, on
    the presumption that it exacerbates disease progression.
  effect: Presumed to exacerbate disease progression
  notes: >-
    Emotional/physiologic stress has no suitable ECTO exposure term (per the
    project's environmental-term guidance on stress); exposure_term left unbound.
  evidence:
  - reference: PMID:31070877
    reference_title: "MECR-Related Neurologic Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stress and febrile illness as much as possible as these are presumed to exacerbate disease progression. Discuss anesthetic risks with a patient's medical team prior to surgical procedures."
    explanation: GeneReviews lists stress among circumstances presumed to worsen disease progression.
  influences_mechanisms:
  - target: Mitochondrial Bioenergetic Failure
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Stress is presumed to increase metabolic load on already-compromised
      mitochondria; the mechanistic intermediates are not established.
    evidence:
    - reference: PMID:31070877
      reference_title: "MECR-Related Neurologic Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Stress and febrile illness as much as possible as these are presumed to exacerbate disease progression. Discuss anesthetic risks with a patient's medical team prior to surgical procedures."
      explanation: GeneReviews presumes stress exacerbates progression of this mitochondrial disorder.
treatments:
- name: Symptomatic Pharmacotherapy for Dystonia
  description: >-
    Medications used to relieve dystonia include anticholinergic agents,
    baclofen, and benzodiazepines. Responses are variable and the therapy is
    symptomatic, not disease-modifying; dopaminergic agents have worsened chorea
    in some patients and several agents (benzodiazepines, carbidopa-levodopa,
    baclofen, botulinum toxin) were ineffective in a reported refractory sibling
    pair.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:31070877
    reference_title: "MECR-Related Neurologic Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Medications that may relieve dystonia include anticholinergic agents, baclofen, and benzodiazepines."
    explanation: GeneReviews lists the standard symptomatic pharmacotherapy for the dystonia.
- name: Deep Brain Stimulation
  description: >-
    Deep brain stimulation (globus pallidus internus, with pedunculopontine or
    ventralis intermedius targets) has been applied to severe
    pharmacotherapy-refractory MEPAN dystonia in two pediatric siblings with significant
    improvement in dystonia rating scores. It is palliative, not
    disease-modifying, and reported in only two patients.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: deep brain stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  evidence:
  - reference: PMID:38328756
    reference_title: "Application of deep brain stimulation for the treatment of childhood-onset dystonia in patients with MEPAN syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients successfully underwent DBS placement with no perioperative complications and significant improvement in their BFMDRS score."
    explanation: First reported use of DBS for MEPAN dystonia with measured improvement in two patients.
- name: Supportive and Rehabilitative Care
  description: >-
    Multidisciplinary supportive care - visual aids for reduced acuity,
    occupational and physical therapy to maintain mobility, speech therapy and
    augmentative communication for dysarthria, and feeding support - plus annual
    ophthalmologic, neurologic, speech, cognitive and feeding surveillance.
    Stress and febrile illness should be minimized as they are presumed to
    exacerbate progression.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:31070877
    reference_title: "MECR-Related Neurologic Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "occupational therapy and physical therapy to maintain range of movement and special aids (e.g., braces, walkers, wheelchairs) to maintain/improve mobility; speech therapy for dysarthria and augmentative communication if needed."
    explanation: GeneReviews specifies the supportive and rehabilitative management.
  - reference: PMID:31070877
    reference_title: "MECR-Related Neurologic Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stress and febrile illness as much as possible as these are presumed to exacerbate disease progression. Discuss anesthetic risks with a patient's medical team prior to surgical procedures."
    explanation: >-
      GeneReviews lists stress and febrile illness among circumstances to avoid
      and advises discussing anesthetic risk before surgery - directly relevant
      given the neurosurgical (DBS) option offered elsewhere in this entry.
- name: Lipoic Acid Supplementation
  description: >-
    Because the mtFAS defect lowers lipoic acid synthesis, lipoic acid (with or
    without octanoic acid / medium-chain triglyceride supplementation) has been
    tried as a mechanism-targeted therapy. Evidence is limited and mixed: a
    single homozygous p.Asp304Tyr patient had controlled progression without
    developing optic atrophy on lipoic acid, but medium-chain triglyceride plus
    lipoic acid feeding did not prevent neurodegeneration in a Purkinje-cell
    Mecr-knockout mouse. It is investigational and should not be presented as
    established disease-modifying therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lipoic acid
      term:
        id: CHEBI:16494
        label: lipoic acid
  target_mechanisms:
  - target: Deficient Lipoic Acid Synthesis
    treatment_effect: RESTORES
    description: >-
      Exogenous lipoic acid is intended to counter the deficient endogenous
      lipoic acid synthesis by supplying the cofactor directly. The strategy is
      mechanism-targeted but investigational, with only anecdotal human benefit
      and a negative controlled mouse result.
    evidence:
    - reference: PMID:33401012
      reference_title: "Whole exome sequencing identifies a novel homozygous MECR mutation in a Chinese patient with childhood-onset dystonia and basal ganglia abnormalities, without optic atrophy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "With lipoic acid treatment, the disease progression was under control, and neither visual impairment nor optic atrophy was observed."
      explanation: A therapeutic response to lipoic acid is cited as indirect validation that the deficient-lipoic-acid-synthesis node is the actionable target.
  evidence:
  - reference: PMID:33401012
    reference_title: "Whole exome sequencing identifies a novel homozygous MECR mutation in a Chinese patient with childhood-onset dystonia and basal ganglia abnormalities, without optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With lipoic acid treatment, the disease progression was under control, and neither visual impairment nor optic atrophy was observed."
    explanation: Anecdotal single-patient report of stabilized progression on lipoic acid.
  - reference: PMID:38879137
    reference_title: "Exploration of dietary interventions to treat mitochondrial fatty acid disorders in a mouse model."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "feeding the mice with medium chain triacylglycerols and LA affected fatty acid profiles in the cerebellum and plasma but did not prevent the development of neurodegeneration in these mice."
    explanation: A controlled mouse study found medium-chain triglyceride plus lipoic acid supplementation did not prevent neurodegeneration, tempering the anecdotal human benefit.
animal_models:
- name: MEPAN mouse (Mecr Tyr285Cys compound heterozygous)
  species: Mouse
  genotype: Mecr compound heterozygous (p.Tyr285Cys with truncating alleles)
  publication: PMID:41021813
  description: >-
    CRISPR-engineered mouse carrying the patient-derived p.Tyr285Cys allele in
    compound heterozygous combination with truncating alleles.
  modeled_mechanisms:
  - target: Mitochondrial Bioenergetic Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse reproduces reduced brain oxidative phosphorylation, protein
      lipoylation defects, and loss of OXPHOS/ISC complex subunits.
    limitations: >-
      Reduced respiration was regional (cerebellum affected, cortex relatively
      spared); the p.Tyr285Cys homozygote and mouse basal-ganglia circuitry may
      not fully mirror human dystonia phenotyping.
    readouts:
    - name: Brain mitochondrial oxidative phosphorylation
      target: Mitochondrial Bioenergetic Failure
      direction: DECREASED
      interpretation: Reduced brain OXPHOS is the bioenergetic correlate of the human mechanism.
      evidence:
      - reference: PMID:41021813
        reference_title: "A mouse model of MEPAN demonstrates a role for mitochondrial fatty acid synthesis in iron-sulfur cluster and supercomplex formation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "reduced mitochondrial oxidative phosphorylation in the brain"
        explanation: Reports the reduced brain OXPHOS measurement in the MEPAN mouse.
  evidence:
  - reference: PMID:41021813
    reference_title: "A mouse model of MEPAN demonstrates a role for mitochondrial fatty acid synthesis in iron-sulfur cluster and supercomplex formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The MEPAN mouse recapitulates the major hallmarks of MEPAN, including a movement disorder, optic neuropathy, defects in protein lipoylation, and reduced mitochondrial oxidative phosphorylation in the brain."
    explanation: Establishes the mouse as an informative model recapitulating the core MEPAN hallmarks.
- name: Purkinje-cell-specific Mecr knockout mouse
  species: Mouse
  genotype: Purkinje-cell-specific conditional Mecr knockout
  publication: PMID:30266742
  description: >-
    Conditional knockout inactivating Mecr specifically in cerebellar Purkinje
    cells, producing a trackable cerebellar neurodegeneration and ataxia.
  modeled_mechanisms:
  - target: Cerebellar Purkinje Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Purkinje-cell loss of Mecr causes loss of protein lipoylation, reduced
      respiratory chain activity, Purkinje-cell death, and ataxic symptoms.
    limitations: >-
      Cell-type-restricted knockout models only the cerebellar component, not
      the basal-ganglia or optic pathology, and the near-total Purkinje-cell loss
      is more severe than the human cerebellar phenotype.
    readouts:
    - name: Cerebellar Purkinje cell survival
      target: Cerebellar Purkinje Cell Degeneration
      direction: DECREASED
      interpretation: Progressive Purkinje-cell loss is the structural correlate of the cerebellar mechanism node.
      evidence:
      - reference: PMID:30266742
        reference_title: "Impaired Mitochondrial Fatty Acid Synthesis Leads to Neurodegeneration in Mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "followed by nearly complete loss of PCs by 9 months of age"
        explanation: Documents progressive Purkinje-cell loss in the model.
  evidence:
  - reference: PMID:30266742
    reference_title: "Impaired Mitochondrial Fatty Acid Synthesis Leads to Neurodegeneration in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These animals exhibited balancing difficulties ∼7 months of age and ataxic symptoms were evident from 8-9 months of age on."
    explanation: The model develops ataxia, supporting cerebellar Purkinje-cell involvement in the movement phenotype.
- name: Drosophila mecr loss-of-function model
  species: Drosophila melanogaster
  genotype: mecr loss of function (whole-animal and neuron-specific knockdown/mutant)
  publication: PMID:37653044
  description: >-
    Drosophila lacking mecr, the fly ortholog of the terminal mtFAS reductase.
    Whole-animal loss is lethal; neuron-restricted loss produces progressive
    neurodegeneration. This is the interventional model that established the
    iron-Fe-S-ceramide branch: reducing either iron or ceramide suppresses the
    neurodegenerative phenotype, and patient fibroblasts reproduce the same
    elevated-ceramide/impaired-iron signature.
  modeled_mechanisms:
  - target: Iron and Ceramide Dysregulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      mecr-null neurons show impaired Fe-S cluster biogenesis, increased iron,
      and elevated ceramide, and epistatic rescue (lowering iron or ceramide)
      suppresses the neurodegeneration - the clearest causal evidence that this
      branch drives the phenotype.
    limitations: >-
      An invertebrate model whose nervous system lacks the basal-ganglia and
      retinal-ganglion-cell circuitry that define the human lesion; the iron and
      ceramide readouts are cross-corroborated in patient fibroblasts but not in
      human brain.
    readouts:
    - name: Neuronal iron level
      target: Iron and Ceramide Dysregulation
      direction: INCREASED
      interpretation: Elevated iron is one arm of the dysregulation node.
      evidence:
      - reference: PMID:37653044
        reference_title: "A defect in mitochondrial fatty acid synthesis impairs iron metabolism and causes elevated ceramide levels."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We observe a defect in Fe-S cluster biogenesis and increased iron levels in flies lacking mecr, leading to elevated ceramide levels. Reducing the levels of either iron or ceramide suppresses the neurodegenerative phenotypes, indicating an interplay between ceramide and iron metabolism."
        explanation: Reports increased iron in mecr-null flies as measured evidence for this node.
    - name: Neuronal ceramide level
      target: Iron and Ceramide Dysregulation
      direction: INCREASED
      interpretation: Elevated ceramide is the second arm of the dysregulation node, and its reduction rescues the phenotype.
      evidence:
      - reference: PMID:37653044
        reference_title: "A defect in mitochondrial fatty acid synthesis impairs iron metabolism and causes elevated ceramide levels."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We observe a defect in Fe-S cluster biogenesis and increased iron levels in flies lacking mecr, leading to elevated ceramide levels. Reducing the levels of either iron or ceramide suppresses the neurodegenerative phenotypes, indicating an interplay between ceramide and iron metabolism."
        explanation: Reports elevated ceramide and its epistatic rescue in the mecr-null fly.
  evidence:
  - reference: PMID:37653044
    reference_title: "A defect in mitochondrial fatty acid synthesis impairs iron metabolism and causes elevated ceramide levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "loss of function of Drosophila mitochondrial enoyl coenzyme A reductase (Mecr), which is the enzyme required for the last step of mtFAS, causes lethality, while neuronal loss of Mecr leads to progressive neurodegeneration."
    explanation: Establishes the mecr-null fly as an informative model of MECR-loss neurodegeneration.

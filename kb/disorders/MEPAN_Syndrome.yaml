name: MEPAN Syndrome
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: MEPAN syndrome
  term:
    id: MONDO:0015003
    label: dystonia, childhood-onset, with optic atrophy and basal ganglia abnormalities
description: >-
  MEPAN syndrome (Mitochondrial Enoyl-CoA Reductase Protein-Associated
  Neurodegeneration), also called MECR-related neurologic disorder, is an
  ultra-rare autosomal recessive childhood-onset neurodegenerative disorder
  caused by biallelic pathogenic variants in MECR, the gene encoding the
  mitochondrial trans-2-enoyl-CoA/ACP reductase that catalyzes the terminal,
  NADPH-dependent step of mitochondrial fatty acid synthesis (mtFAS). It was the
  first human disease shown to result from a defect in the mtFAS pathway.

  Clinically it is defined by a triad of a progressive movement disorder
  (predominantly dystonia, often with chorea and/or ataxia) beginning between
  roughly one and 6.5 years of age, optic atrophy developing between ages four
  and 12 years, and hyperintense T2-weighted signal abnormalities in one or more
  basal-ganglia structures (caudate, putamen, globus pallidus) on MRI.
  Cognition is relatively spared, which distinguishes MEPAN from many other
  pediatric neurodegenerations. The disorder is discussed among the
  neurodegeneration-with-brain-iron-accumulation (NBIA) "mimics" because of the
  phenotypic overlap and a demonstrated cellular iron-dysregulation mechanism,
  even though frank brain iron accumulation is not the core imaging lesion.

  Mechanistically, deficient MECR activity lowers production of octanoyl-ACP,
  the precursor of lipoic acid, so protein lipoylation of the lipoate-dependent
  mitochondrial enzymes (pyruvate dehydrogenase, 2-oxoglutarate dehydrogenase,
  branched-chain ketoacid dehydrogenase, glycine cleavage system) fails; loss of
  properly acylated acyl-carrier protein additionally destabilizes iron-sulfur
  cluster assembly and oxidative-phosphorylation supercomplexes, and in fly and
  patient-fibroblast models produces iron overload and elevated ceramide. The
  net result is a mitochondrial bioenergetic deficit with selective vulnerability
  of basal-ganglia, cerebellar and retinal-ganglion-cell neurons. Management is
  supportive and symptomatic; there is no approved disease-modifying therapy.
synonyms:
- MEPAN syndrome
- MECR-related neurologic disorder
- Mitochondrial Enoyl-CoA Reductase Protein-Associated Neurodegeneration
- childhood-onset dystonia with optic atrophy and basal ganglia abnormalities
- DYTOABG

      label: Autosomal recessive inheritance
  description: >-
    MEPAN is inherited in an autosomal recessive manner; affected individuals
    carry biallelic (homozygous or compound heterozygous) MECR pathogenic
    variants and unaffected parents are obligate heterozygous carriers.
  evidence:
  - reference: PMID:31070877
    reference_title: "MECR-Related Neurologic Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MECR-related neurologic disorder is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the autosomal recessive inheritance pattern.
  - reference: PMID:31070877
    reference_title: "MECR-Related Neurologic Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: GeneReviews gives the 25% sib recurrence risk expected for an autosomal recessive disorder.
pathophysiology:
- name: Biallelic MECR Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic MECR variants (missense, nonsense, or splice-site)
    reduce or abolish mitochondrial trans-2-enoyl-CoA/ACP reductase activity,
    the enzyme that carries out the terminal NADPH-dependent reduction step of
    mitochondrial fatty acid synthesis. Missense alleles typically act as
    destabilizing hypomorphs rather than complete nulls.
  molecular_functions:
  - preferred_term: mitochondrial trans-2-enoyl-CoA/ACP reductase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0019166
      label: trans-2-enoyl-CoA reductase (NADPH) activity
  downstream:
  - target: Impaired Mitochondrial Fatty Acid Synthesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27817865
      reference_title: "MECR Mutations Cause Childhood-Onset Dystonia and Optic Atrophy, a Mitochondrial Fatty Acid Synthesis Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All affected individuals were found to harbor recessive mutations in MECR encoding the mitochondrial trans-2-enoyl-coenzyme A-reductase involved in human mtFAS."
      explanation: The founding cohort establishes that recessive MECR variants disable the mtFAS enzyme.
  evidence:
  - reference: PMID:37734847
    reference_title: "Recessive MECR pathogenic variants cause an LHON-like optic neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In yeast, the MECR-R258W mutant showed an impaired oxidative growth, 30% reduction in oxygen consumption rate and 80% decrease in protein levels, pointing to structure destabilisation."
    explanation: Demonstrates that a recurrent missense allele destabilizes the MECR protein, reducing its activity.
- name: Impaired Mitochondrial Fatty Acid Synthesis
  biological_scale: MOLECULAR
  description: >-
    Loss of MECR activity impairs the terminal step of mitochondrial fatty acid
    synthesis (mtFAS), reducing production of acyl-ACP species including
    octanoyl-ACP, the precursor of lipoic acid, and of longer-chain acyl-ACPs
    required for mitochondrial complex assembly.
  biological_processes:
  - preferred_term: mitochondrial fatty acid synthesis (mtFAS)
    modifier: DECREASED
    term:
      id: GO:0006633
      label: fatty acid biosynthetic process
  downstream:
  - target: Deficient Lipoic Acid Synthesis
    causal_link_type: DIRECT
  - target: Deficient Iron-Sulfur Cluster Assembly
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27817865
    reference_title: "MECR Mutations Cause Childhood-Onset Dystonia and Optic Atrophy, a Mitochondrial Fatty Acid Synthesis Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial fatty acid synthesis (mtFAS) is an evolutionarily conserved pathway essential for the function of the respiratory chain and several mitochondrial enzyme complexes."
    explanation: Establishes mtFAS as the pathway disabled in MEPAN and its role supporting the respiratory chain and enzyme complexes.
- name: Deficient Lipoic Acid Synthesis
  biological_scale: MOLECULAR
  description: >-
    Octanoic acid (octanoyl-ACP) produced by mtFAS is the precursor of lipoic
    acid, an essential cofactor for several mitochondrial 2-oxoacid
    dehydrogenase complexes; reduced octanoyl-ACP lowers lipoic acid
    availability.
  biological_processes:
  - preferred_term: lipoic acid biosynthesis
    modifier: DECREASED
    term:
      id: GO:0009107
      label: lipoate biosynthetic process
  downstream:
  - target: Impaired Protein Lipoylation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37734847
    reference_title: "Recessive MECR pathogenic variants cause an LHON-like optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the fatty acids synthesised by mtFAS, there is octanoic acid, the precursor of lipoic acid (LA), a cofactor involved in the activity of several mitochondrial enzymes, among which the pyruvate dehydrogenase, the α-ketoglutarate dehydrogenase, the branched-chain keto acid dehydrogenase, the 2-oxoadipate dehydrogenase and the glycine cleavage system."
    explanation: States that mtFAS-derived octanoic acid is the lipoic acid precursor, linking mtFAS failure to lipoic acid deficiency.
- name: Impaired Protein Lipoylation
  biological_scale: MOLECULAR
  description: >-
    Reduced lipoic acid availability causes failure to lipoylate the
    lipoate-dependent mitochondrial enzymes; patient fibroblasts and mouse brain
    both show reduced levels of lipoylated proteins.
  biological_processes:
  - preferred_term: protein lipoylation
    modifier: DECREASED
    term:
      id: GO:0009249
      label: protein lipoylation
  downstream:
  - target: Lipoate-Dependent Enzyme Dysfunction
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27817865
    reference_title: "MECR Mutations Cause Childhood-Onset Dystonia and Optic Atrophy, a Mitochondrial Fatty Acid Synthesis Disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblast cell lines from affected individuals displayed reduced levels of both MECR and lipoylated proteins as well as defective respiration."
    explanation: Patient-derived fibroblasts directly demonstrate reduced protein lipoylation downstream of MECR deficiency.
- name: Lipoate-Dependent Enzyme Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Deficient lipoylation impairs the lipoate-dependent 2-oxoacid dehydrogenase
    complexes - pyruvate dehydrogenase and 2-oxoglutarate (alpha-ketoglutarate)
    dehydrogenase among them - compromising oxidative decarboxylation flux into
    the TCA cycle.
  molecular_functions:
  - preferred_term: pyruvate dehydrogenase activity
    modifier: DECREASED
    term:
      id: GO:0004739
      label: pyruvate dehydrogenase (acetyl-transferring) activity
  - preferred_term: 2-oxoglutarate dehydrogenase activity
    modifier: DECREASED
    term:
      id: GO:0004591
      label: oxoglutarate dehydrogenase (succinyl-transferring) activity
  downstream:
  - target: Mitochondrial Bioenergetic Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37734847
    reference_title: "Recessive MECR pathogenic variants cause an LHON-like optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the fatty acids synthesised by mtFAS, there is octanoic acid, the precursor of lipoic acid (LA), a cofactor involved in the activity of several mitochondrial enzymes, among which the pyruvate dehydrogenase, the α-ketoglutarate dehydrogenase, the branched-chain keto acid dehydrogenase, the 2-oxoadipate dehydrogenase and the glycine cleavage system."
    explanation: Names the lipoate-dependent enzymes (PDH, KGDH, BCKDH, glycine cleavage) whose function depends on the lipoic acid supplied by mtFAS.
- name: Deficient Iron-Sulfur Cluster Assembly
  biological_scale: MOLECULAR
  description: >-
    Loss of properly acylated acyl-carrier protein (ACP) destabilizes the
    mitochondrial iron-sulfur cluster (ISC) assembly complex and alters
    oxidative-phosphorylation complex and supercomplex assembly, an
    ACP-acylation-dependent branch demonstrated in Mecr-mutant mouse brain and
    in fly models.
  biological_processes:
  - preferred_term: iron-sulfur cluster assembly
    modifier: DECREASED
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
  downstream:
  - target: Mitochondrial Bioenergetic Failure
    causal_link_type: DIRECT
  - target: Iron and Ceramide Dysregulation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41021813
    reference_title: "A mouse model of MEPAN demonstrates a role for mitochondrial fatty acid synthesis in iron-sulfur cluster and supercomplex formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "LC-MS/MS-based proteomic analysis of Mecr mutant cerebella identified loss of subunits of complex I of oxidative phosphorylation (OXPHOS) and subunits of the iron-sulfur cluster assembly (ISC) complex."
    explanation: The MEPAN mouse shows loss of ISC assembly and complex I subunits, supporting the ISC/supercomplex branch.
- name: Iron and Ceramide Dysregulation
  biological_scale: CELLULAR
  description: >-
    Downstream of the Fe-S cluster biogenesis defect, mecr-loss neurons
    accumulate free iron and elevated ceramide; lowering either iron or ceramide
    suppresses the neurodegenerative phenotype, and MEPAN patient fibroblasts
    replicate the elevated-ceramide/impaired-iron signature. This branch is
    established primarily in a Drosophila model with patient-fibroblast
    corroboration.
  downstream:
  - target: Basal Ganglia Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Retinal Ganglion Cell Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:37653044
    reference_title: "A defect in mitochondrial fatty acid synthesis impairs iron metabolism and causes elevated ceramide levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We observe a defect in Fe-S cluster biogenesis and increased iron levels in flies lacking mecr, leading to elevated ceramide levels. Reducing the levels of either iron or ceramide suppresses the neurodegenerative phenotypes, indicating an interplay between ceramide and iron metabolism."
    explanation: Interventional fly evidence that iron and ceramide dysregulation drives the neurodegeneration.
  - reference: PMID:37653044
    reference_title: "A defect in mitochondrial fatty acid synthesis impairs iron metabolism and causes elevated ceramide levels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that human-derived fibroblasts display similar elevated ceramide levels and impaired iron homeostasis."
    explanation: Patient-derived fibroblasts corroborate the elevated-ceramide/iron mechanism in human cells.
- name: Mitochondrial Bioenergetic Failure
  biological_scale: CELLULAR
  description: >-
    The combined loss of lipoate-dependent flux, ISC-dependent respiratory
    enzymes, and OXPHOS supercomplex integrity produces a mitochondrial
    oxidative-phosphorylation deficit, measured as defective respiration in
    patient fibroblasts and reduced OXPHOS in Mecr-mutant mouse brain.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  downstream:
  - target: Basal Ganglia Neurodegeneration
    causal_link_type: DIRECT
  - target: Retinal Ganglion Cell Degeneration
    causal_link_type: DIRECT
  - target: Cerebellar Purkinje Cell Degeneration
    causal_link_type: DIRECT
  - target: Ophthalmoplegia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      External ophthalmoplegia is an oculomotor manifestation of the
      mitochondrial bioenergetic deficit seen in mitochondrial disease; reported
      in a single detailed MEPAN ophthalmic case, with intermediates unresolved.
  evidence:
  - reference: PMID:41021813
    reference_title: "A mouse model of MEPAN demonstrates a role for mitochondrial fatty acid synthesis in iron-sulfur cluster and supercomplex formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The MEPAN mouse recapitulates the major hallmarks of MEPAN, including a movement disorder, optic neuropathy, defects in protein lipoylation, and reduced mitochondrial oxidative phosphorylation in the brain."
    explanation: The mouse model demonstrates reduced brain oxidative phosphorylation as the bioenergetic lesion.
- name: Basal Ganglia Neurodegeneration
  biological_scale: TISSUE
  description: >-
    Selective neurodegeneration of the basal ganglia (caudate, putamen, globus
    pallidus), reflected clinically as dystonia and chorea and radiologically as
    T2-hyperintense basal-ganglia signal, is the substrate of the extrapyramidal
    movement disorder.
  cell_types:
  - preferred_term: striatal medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  downstream:
  - target: Dystonia
    causal_link_type: DIRECT
  - target: Chorea
    causal_link_type: DIRECT
  - target: Focal T2 hyperintense basal ganglia lesion
    causal_link_type: DIRECT
    description: >-
      The T2-hyperintense basal-ganglia signal is the radiological reflection of
      this selective basal-ganglia neurodegeneration.
  - target: Dysarthria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Progressive dysarthria arises as a bulbar/motor-speech consequence of the
      extrapyramidal movement disorder; the precise intermediates are unresolved.
  evidence:
  - reference: PMID:27817865
    reference_title: "MECR Mutations Cause Childhood-Onset Dystonia and Optic Atrophy, a Mitochondrial Fatty Acid Synthesis Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven individuals from five unrelated families presented with childhood-onset dystonia, optic atrophy, and basal ganglia signal abnormalities on MRI."
    explanation: The founding cohort ties basal-ganglia involvement to the dystonic movement disorder.
- name: Retinal Ganglion Cell Degeneration
  biological_scale: TISSUE
  description: >-
    Degeneration of retinal ganglion cells and their axons in the papillomacular
    bundle produces the optic atrophy, with a pattern resembling other
    mitochondrial optic neuropathies (LHON, dominant optic atrophy).
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  downstream:
  - target: Optic atrophy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36262091
    reference_title: "Ophthalmic manifestations of MEPAN syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fundus exam revealed bilateral optic atrophy with pallor most pronounced temporally, corresponding to OCT findings of diffuse retinal nerve fiber layer thinning most prominent in the papillomacular bundle region and severe ganglion cell layer thinning in the maculae."
    explanation: Ophthalmic imaging demonstrates retinal ganglion cell layer loss underlying the optic atrophy.
- name: Cerebellar Purkinje Cell Degeneration
  biological_scale: TISSUE
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  description: >-
    MECR is highly expressed in cerebellar Purkinje cells, and Purkinje-cell
    degeneration - established in a Purkinje-cell-specific Mecr knockout mouse -
    is a plausible substrate for the ataxia that accompanies the movement
    disorder in a subset of patients. The Purkinje-cell mechanism is
    model-derived; the ataxia phenotype itself is documented clinically.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  downstream:
  - target: Ataxia
    causal_link_type: DIRECT
  - target: Nystagmus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cerebellar dysfunction is the usual substrate of gaze-evoked nystagmus;
      reported in a single MEPAN ophthalmic case, with intermediates unresolved.
  evidence:
  - reference: PMID:30266742
    reference_title: "Impaired Mitochondrial Fatty Acid Synthesis Leads to Neurodegeneration in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mitochondria in KO PCs displayed abnormal morphology, loss of protein lipoylation, and reduced respiratory chain enzymatic activities by the time these mice were 6 months of age, followed by nearly complete loss of PCs by 9 months of age."
    explanation: A Purkinje-cell-specific Mecr knockout shows Purkinje-cell degeneration, the model basis for cerebellar involvement.

    snippet: people with severe disease (FIX activity <1% of normal) have frequent spontaneous bleeds; people with moderate disease (FIX activity 1%–5% of normal) rarely have spontaneous bleeds but bleed with minor trauma; and people with mild disease (FIX activity 5%–40% normal) bleed only during invasive procedures or trauma
    explanation: >-
      The introduction describes the conventional residual-activity severity bands; modern GeneReviews places exactly 5% in moderate disease.
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Severe hemophilia B: Usually diagnosed during the first two years of life.'
    explanation: >-
      GeneReviews gives the usual diagnostic age.
- name: Moderate Hemophilia B
  classification: baseline_FIX_activity
  description: >-
    Baseline FIX activity 1–5 IU/dL (1–5%). Spontaneous bleeding is less frequent and variable, with excessive or delayed bleeding after minor trauma; some patients need prophylaxis for a severe bleeding phenotype.
  evidence:
  - reference: PMID:31219805
    reference_title: Hyperactivity of factor IX Padua (R338L) depends on factor VIIIa cofactor activity.

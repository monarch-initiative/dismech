differential_diagnoses:
- name: Hemophilia A
  description: Clinically similar X-linked bleeding with deficient FVIII rather than FIX.
  distinguishing_features:
  - Measure both activities; normal FVIII does not exclude HB, and unusual new bleeding in known HB may warrant investigation for an acquired FVIII inhibitor.
  evidence:
  - reference: PMID:36407152
    reference_title: A Case of Acquired Hemophilia A and Congenital Hemophilia B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This report describes the management of a patient with congenital hemophilia B and acquired hemophilia A.
    explanation: >-
      A rare dual diagnosis illustrates why a known F9 diagnosis does not exclude an additional cause.
- name: Acquired FIX inhibitor
  description: Rare autoantibody-mediated functional FIX loss without the inherited F9 disorder.
  distinguishing_features:
  - New bleeding, inhibitor detection, and prior or family history distinguish acquired autoimmunity from congenital HB with an alloimmune treatment complication.
  evidence:
  - reference: PMID:22123568
    reference_title: '[Acquired haemophilia B: a case report and literature review].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a 7-year-old girl with no past medical history of bleeding disorder and who present an extensive haematoma in the left calf.
    explanation: >-
      Case supports a distinct acquired presentation.
- name: Vitamin K deficiency, liver disease, or vitamin K antagonist effect
  description: Acquired reduction in several coagulation factors can include FIX.
  distinguishing_features:
  - Multi-factor abnormalities and often prolonged PT distinguish these states from isolated congenital FIX deficiency; vitamin K does not correct an inherited dysfunctional F9 allele.
  evidence:
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Vitamin K does not prevent or control bleeding in hemophilia B.
    explanation: >-
      GeneReviews distinguishes the inherited defect from vitamin K-responsive states.
- name: Other inherited bleeding disorders
  description: von Willebrand disease and deficiencies of factors XI, VII, or XIII can overlap clinically.
  distinguishing_features:
  - FVII deficiency usually prolongs PT; HB affects FIX-dependent aPTT assays.
  - VWF/FVIII studies identify von Willebrand disease; type 2N mimics FVIII deficiency, not FIX deficiency.
  - Factor XIII deficiency can cause delayed bleeding with normal routine PT/aPTT; factor XII deficiency can prolong aPTT without causing the HB bleeding phenotype.
  evidence:
  - reference: PMID:19245420
    reference_title: Major differences in bleeding symptoms between factor VII deficiency and hemophilia B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hemophilia B patients (n = 296) and FVII-deficient males (n = 109) were compared for FVII/FIX clotting activity, F7/F9 genotypes and clinical phenotypes
    explanation: >-
      Primary cohort demonstrates distinct phenotypes despite shared coagulation involvement.
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of hemophilia B is established in individuals with low factor IX clotting activity.
    explanation: >-
      Factor-specific assays distinguish the diagnostic defect; the complete GeneReviews differential table was reviewed.
discussions:
- discussion_id: skeletal-pathway
  kind: KNOWLEDGE_GAP
  prompt: Which downstream coagulation signals connect FIX deficiency to low bone mass?
  attaches_to:
  - pathophysiology#Factor IX Deficiency
  - phenotypes#Reduced Bone Mineral Density
  rationale: >-
    Mouse F9 loss produces a skeletal phenotype without spontaneous joint bleeding, but the study did not demonstrate direct FIX binding/signaling in osteoblasts. Similar FVIII-null findings favor testing shared downstream thrombin/PAR or matrix effects. Human low-BMD studies mix HA/HB and cannot separate bleeding, mobility, or comorbidity.
  proposed_experiments:
  - experiment_id: systemic-fix-bone
    description: >-
      First establish F9 expression and source contribution before proposing osteoblast-specific deletion; compare systemic FIX rescue with controlled thrombin-pathway perturbation.
    name: Distinguish systemic FIX from direct skeletal signaling
  - experiment_id: prospective-bone-clinical
    description: >-
      Prospectively measure bone endpoints, activity, joint bleeding, and comorbidity in HB cohorts; improved DXA alone would not identify the molecular mediator.
    name: Prospective HB-specific bone outcomes
  evidence:
  - reference: PMID:34117910
    reference_title: 'Deletion of Coagulation Factor IX Compromises Bone Mass and Strength: Murine Model of Hemophilia B (Christmas Disease).'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Further studies are needed to explore the underlying mechanism by which a defective coagulation cascade and the resulting thrombin deficiency alters normal skeletogenesis.
    explanation: >-
      The primary study explicitly leaves mechanism unresolved.
- discussion_id: synovitis-translation
  kind: KNOWLEDGE_GAP
  prompt: Can an adjunct inflammatory intervention protect human joints beyond optimized bleed prevention?
  attaches_to:
  - pathophysiology#Blood-induced synovitis
  rationale: >-
    Mouse preventive and delayed-treatment experiments have different cartilage outcomes. These data justify further evaluation, not routine MTX treatment or proof that inflammation is independent of all continuing blood exposure.
  evidence:
  - reference: PMID:42119948
    reference_title: Targeting synovitis by immunomodulation as a novel therapeutic approach for hemophilic arthropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: No differences in cartilage erosion and proteoglycan loss were observed.
    explanation: >-
      Delayed-treatment result limits reversal claims.
- discussion_id: extravascular-fix
  kind: KNOWLEDGE_GAP
  prompt: How should extravascular FIX and cross-reacting antigen status inform human prophylaxis?
  attaches_to:
  - pathophysiology#Impaired fibrin hemostasis
  rationale: >-
    Collagen-IV-binding perturbation in mice and localization in human liver and muscle establish that this is not a no-data gap. The unresolved issue is quantitative contribution and validated dosing implications in patients, including competition by dysfunctional CRM-positive FIX.
  evidence:
  - reference: PMID:19583826
    reference_title: Abnormal hemostasis in a knock-in mouse carrying a variant of factor IX with impaired binding to collagen type IV.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the binding of FIX to collagen IV probably plays a significant functional role in hemostasis.
    explanation: >-
      Experimental support exists but needs human quantitative translation.
  - reference: PMID:33780107
    reference_title: The Function of extravascular coagulation factor IX in haemostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Prophylactic protection decreases ~5X faster in CRM+ animals.
    explanation: >-
      Cross-reacting antigen status modifies protection in a mouse comparison.
- discussion_id: durability-and-retreatment
  kind: KNOWLEDGE_GAP
  prompt: What predicts lifetime gene-therapy durability and feasible retreatment across vector platforms?
  attaches_to:
  - pathophysiology#Factor IX Deficiency
  rationale: >-
    Median 13-year follow-up exists in ten men given a wild-type F9 AAV8 vector; current Padua product cohorts have shorter follow-up. One liver biopsy does not resolve all vector-integration, clonal, or cancer risks. Persistently high anti-AAV antibodies limit redosing, and children have different liver-growth considerations.
  evidence:
  - reference: PMID:40499172
    reference_title: Sustained Clinical Benefit of AAV Gene Therapy in Severe Hemophilia B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Levels of neutralizing antibodies to AAV8 remained high throughout follow-up, thus indicating potential barriers to readministration of the vector.
    explanation: >-
      Long-term human follow-up identifies a concrete retreatment barrier.
- discussion_id: severity-modifiers
  kind: KNOWLEDGE_GAP
  prompt: Which modifiers improve HB-specific prediction beyond FIX activity and treatment history?
  attaches_to:
  - pathophysiology#Deficient thrombin propagation
  rationale: >-
    FVII, thrombophilia, platelet, and endothelial reports are heterogeneous and often mix HA and HB. They do not quantify how much HB severity variance is explained. The small TGA cohort supports prospective validation, not replacement of factor assays. Matched HA/HB comparisons need genotype, prophylaxis, age, and joint-damage adjustment.
  evidence:
  - reference: PMID:28550758
    reference_title: 'Platelets and hemophilia: A review of the literature.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the available evidence is currently limited and no clear correlations between platelet function parameters and clinical phenotypes have been demonstrated.
    explanation: >-
      Review explicitly limits platelet-modifier inference.
  - reference: PMID:18624700
    reference_title: Endothelial dysfunction in haemophilia patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fifteen haemophilia patients with chronic viral hepatitis and/or HIV infection showed a significantly lower FMD than patients without active infection.
    explanation: >-
      Vascular findings are confounded by comorbidity in a mixed cohort.

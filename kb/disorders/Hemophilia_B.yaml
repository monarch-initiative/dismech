      explanation: >-
        ISTH guideline supports regular bleed prevention.
- name: Extended Half-Life Factor IX Products
  description: >-
    Fc fusion, albumin fusion, and PEGylation can prolong circulating FIX exposure and reduce infusion burden. Product-specific assays and pharmacokinetics require attention. Plasma half-life alone does not establish tissue hemostatic protection: mouse comparisons and human tissue localization support an extravascular collagen-IV-bound pool, without validating mouse high-dose predictions as a patient regimen.
  treatment_term:
    preferred_term: Protein Replacement Therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
  evidence:
  - reference: PMID:33780107
    reference_title: The Function of extravascular coagulation factor IX in haemostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In mice, both Alprolix® and BeneFIX® bind Col4 with similar affinities
    explanation: >-
      Binding experiments support an extravascular compartment, not a universal dosing recommendation.
  - reference: PMID:27106122
    reference_title: Prophylactic efficacy of BeneFIX vs Alprolix in hemophilia B mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A robust pool of extravascular FIX is clearly observed surrounding blood vessels, localized to the same region as collagen IV, in 2 representative human tissues: liver and skeletal muscle.'
    explanation: >-
      Human tissue localization complements mouse hemostatic studies.
  - reference: PMID:41087175
    reference_title: '[Chinese guidelines on the treatment of hemophilia (2025)].'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the advent of novel therapeutic strategies-including long-acting coagulation factor products, non-factor therapies, and gene therapy-has ushered hemophilia into a new era of treatment.
    explanation: >-
      Guideline identifies long-acting FIX strategies.
  target_mechanisms:
  - target: Factor IX Deficiency
    treatment_effect: RESTORES
    description: >-
      Supplies functional FIX with altered pharmacokinetics.
    evidence:
    - reference: PMID:20301668
      reference_title: Hemophilia B.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Intravenous infusion of plasma-derived or recombinant factor IX for acute bleeding episodes should be given as soon as possible after symptoms occur.
      explanation: >-
        GeneReviews supports prompt replacement for acute bleeds.
- name: Etranacogene Dezaparvovec Gene Therapy
  description: >-
    Liver-directed AAV5 gene addition supplies the hyperactive FIX-Padua transgene for selected adults. HOPE-B enrolled 54 men with baseline FIX ≤2 IU/dL: five-year mean activity was 36.1 IU/dL and ABR fell 63% against each participant's prophylaxis lead-in. Eligibility, liver health, product-specific AAV antibody interpretation, corticosteroid management, and long-term follow-up matter. It is not assured permanent cure or an established repeat-dose treatment.
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:41358585
    reference_title: Final Analysis of a Study of Etranacogene Dezaparvovec for Hemophilia B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the full analysis population (54 participants), the adjusted annualized bleeding rate for all bleeding events was 4.16 during the lead-in period and 1.52 during months 7 through 60 after gene therapy, a reduction of 63% (95% confidence interval, 24 to 82).
    explanation: >-
      HOPE-B five-year results compare the treated cohort with its own prophylaxis lead-in, not a parallel randomized group.
  - reference: PMID:41358585
    reference_title: Final Analysis of a Study of Etranacogene Dezaparvovec for Hemophilia B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: at 5 years, the mean (±SD) factor IX activity level was 36.1±15.7 IU per deciliter
    explanation: >-
      This is the five-year value; 36.7% was the two-year value.
  - reference: PMID:20301668
    reference_title: Hemophilia B.

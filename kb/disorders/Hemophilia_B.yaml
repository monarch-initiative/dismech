- name: Neutralizing FIX alloantibodies
  description: >-
    After exposure to replacement FIX, a subset of patients develops inhibitory antibodies that neutralize its coagulation activity. Risk is concentrated in severe disease with null variants, especially large deletions or nonsense alleles. This treatment complication is distinct from spontaneous acquired anti-FIX autoimmunity.
  evidence:
  - reference: PMID:31919092
    reference_title: 'Inhibitor incidence in an unselected cohort of previously untreated patients with severe haemophilia B: a PedNet study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nonsense mutations and deletions with large structural changes comprised all mutations among inhibitor patients and were associated with an inhibitor risk of 26.9% and 33.3%, respectively.
    explanation: >-
      Prospective severe previously untreated cohort links null variants to inhibitor development.
  - reference: PMID:41499759
    reference_title: 'Concizumab in hemophilia with inhibitors: longer-term efficacy and safety results from the phase 3 explorer7 study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The development of inhibitors in some patients further complicates clinical management, as these antibodies neutralize the coagulation activity of FVIII or FIX, negatively affecting treatment outcomes.
    explanation: >-
      Clinical trial context explains the neutralizing effect of inhibitors.
  downstream:
  - target: Factor IX Deficiency
    description: >-
      Inhibitors reduce effective activity of infused FIX and can undermine replacement response.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41499759
      reference_title: 'Concizumab in hemophilia with inhibitors: longer-term efficacy and safety results from the phase 3 explorer7 study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: these antibodies neutralize the coagulation activity of FVIII or FIX, negatively affecting treatment outcomes.
      explanation: >-
        Neutralization creates functional replacement failure; this is an acquired complication layered onto inherited deficiency.

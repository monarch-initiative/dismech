      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Our results suggest that TGT could be a promising tool to evaluate haemostasis capacity in patients with haemophilia.
      explanation: >-
        The source itself frames the assay as promising rather than validated.
animal_models:
- name: F9-mutant mouse with CRISPR correction
  species: Mouse
  genotype: F9-mutant hemophilia B
  description: >-
    Hydrodynamic tail-vein delivery of Cas9 and donor plasmids corrected hepatocyte F9 in a subset of treated mice. The result was >1% corrected alleles in 62.5% of mice, not 62.5% allelic correction.
  publication: PMID:28508290
  evidence:
  - reference: PMID:28508290
    reference_title: CRISPR/Cas9-mediated somatic and germline gene correction to restore hemostasis in hemophilia B mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 62.5% of the HTV-treated mice showed a detectable gene correction (>1%) in the F9 alleles of hepatocytes, which was sufficient to remit the coagulation deficiency.
    explanation: >-
      Model-specific experimental support.
  modeled_mechanisms:
  - target: Factor IX Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-

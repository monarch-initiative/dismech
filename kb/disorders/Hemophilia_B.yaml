pathophysiology:
- name: Factor IX Deficiency
  description: >-
    Pathogenic coding, splice, deletion, and regulatory F9 variants cause absent, reduced, or dysfunctional FIX. Hepatocytes normally secrete this vitamin K-dependent zymogen. Some variants retain circulating FIX antigen despite low activity, so functional deficiency is the common lesion.

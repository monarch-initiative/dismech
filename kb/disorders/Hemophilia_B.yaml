- name: Leyden promoter dysfunction
  description: >-
    Selected F9 promoter variants impair binding of liver-enriched transcription factors. ONECUT binding at the -5/-6 site and HNF4-dependent regulation provide distinct mechanisms; age-dependent transcriptional compensation varies by allele.
  evidence:
  - reference: PMID:23472758
    reference_title: A CpG mutational hotspot in a ONECUT binding site accounts for the prevalent variant of hemophilia B Leyden.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: ONECUT transcription factors (ONECUT1 and ONECUT2) bind to the -5/-6 site.
    explanation: >-
      Promoter-binding experiments identify a mechanistic regulatory subtype.
  - reference: PMID:23472758
    reference_title: A CpG mutational hotspot in a ONECUT binding site accounts for the prevalent variant of hemophilia B Leyden.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The various hemophilia B Leyden mutations that have been reported in this site inhibit ONECUT binding to varying degrees, which correlate well with their associated clinical severities.
    explanation: >-
      Direct binding perturbation links promoter variants to altered regulation.
  - reference: PMID:1631121
    reference_title: Disruption of a binding site for hepatocyte nuclear factor 4 results in hemophilia B Leyden.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Whereas HNF-4 transactivates the wild-type promoter sequence in liver (HepG2) and non-liver (HeLa) cell types quite well, it transactivates the -20 mutated promoter to only a limited extent and the -26 mutated promoter not at all.
    explanation: >-
      Different promoter variants have distinct functional effects; lifelong deficiency is not Leyden recovery.
  - reference: PMID:8499951
    reference_title: Synergy between transcription factors DBP and C/EBP compensates for a haemophilia B Leyden factor IX mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a synergistic interaction between DBP and C/EBP responsible for the recovery of normal transcriptional activity of the -5 mutant promoter and may play a role in the resolution of other Leyden mutants.
    explanation: >-
      Specific promoter compensation does not establish one universal pubertal mechanism.

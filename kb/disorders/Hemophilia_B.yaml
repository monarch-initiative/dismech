    reference_title: International Society on Thrombosis and Haemostasis clinical practice guideline for treatment of congenital hemophilia A and B based on the Grading of Recommendations Assessment, Development, and Evaluation methodology.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Strong recommendations were issued for prophylactic over episodic treatment for severe and moderately severe hemophilia A and B.
    explanation: >-
      ISTH guideline supports regular bleed prevention.
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: For those with severe hemophilia B and those with moderate or mild hemophilia B and frequent bleeding, prophylactic treatment with factor IX concentrate infusions to maintain factor IX clotting activity higher than 1% or as needed to prevent bleeding and allow normal activity improves outcomes and prevents chronic joint disease.
    explanation: >-
      GeneReviews emphasizes an individualized clinical goal.
  target_mechanisms:

description: >-
  Hemophilia B is an X-linked disorder of functional coagulation factor IX deficiency caused by pathogenic F9 variants. Defective FIXa-FVIIIa intrinsic tenase limits factor X activation and thrombin-dependent fibrin hemostasis. Residual FIX activity, treatment, joint health, and other modifiers shape a spectrum from severe spontaneous joint and muscle bleeding to bleeding mainly after trauma or procedures. Heterozygous females can also have clinically significant disease.

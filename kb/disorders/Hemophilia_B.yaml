- name: Mucosal and Postpartum Antifibrinolytic Support
  description: >-
    Tranexamic acid can support selected mucosal/procedural and postpartum bleeding management. It is not a FIX replacement and should not be extrapolated to upper urinary-tract bleeding, where clot obstruction can be hazardous. A specialist coordinates its use with factor and non-factor products.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Tranexamic acid can be used to prevent and treat postpartum hemorrhage.
    explanation: >-
      GeneReviews supports this specific use.
- name: Hemophilia Treatment Center Follow-Up
  description: >-
    Provide education, home-infusion training, joint and muscle assessment, exposure-related inhibitor surveillance, and individualized treatment adjustment. GeneReviews recommends six- to twelve-month review for young severe/moderate patients, at least annually for older severe/moderate patients, and every one to two years for mild disease, with shorter intervals for comorbidity.
  treatment_term:
    preferred_term: Comprehensive hemophilia care
  evidence:
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Referral to a hemophilia treatment center (HTC) for assessment, education, genetic counseling, and treatment.
    explanation: >-
      Organized multidisciplinary care is a management component.
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The assessment should include a review of bleeding episodes, adjustment of treatment plans as needed, a joint and muscle evaluation, an inhibitor screen, viral testing if indicated
    explanation: >-
      Defines surveillance content.
  notes: Composite education, surveillance, and treatment-coordination activity; no single precise NCIT procedure term was selected.
- name: Genetic Counseling and Pregnancy Planning
  description: >-
    Test at-risk relatives, establish female genetic status and baseline FIX before pregnancy where possible, and discuss prenatal or preimplantation testing. Maternal FIX does not normally increase substantially in pregnancy; coordinate delivery and postpartum hemostasis and monitor delayed bleeding. Delivery planning should minimize traumatic fetal instrumentation without assuming all pregnancies require cesarean delivery.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: It is recommended that the genetic status of at-risk females be established prior to pregnancy or as early in a pregnancy as possible.
    explanation: >-
      GeneReviews identifies timing of female-risk assessment.
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Maternal factor IX levels do not significantly increase during pregnancy and heterozygous females may need factor IX infusion support for delivery and/or to treat or prevent postpartum hemorrhage.
    explanation: >-
      Corrects the research report's erroneous claim that pregnancy increases FIX.
- name: Bleeding-Risk Precautions
  description: >-
    Avoid unnecessary high-trauma activities and coordinate invasive procedures with hemostatic cover. Do not circumcise an at-risk newborn until hemophilia is excluded or covered. Use caution with aspirin and other platelet-active medicines; intramuscular injections require pressure, ice, and treatment planning. Modern factor products have improved infection safety, while older recipients may need evaluation for historical transfusion-related infection.
  treatment_term:
    preferred_term: Bleeding-risk prevention and education
  evidence:
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Circumcision of at-risk males until hemophilia B is either excluded or treated with factor IX concentrate regardless of severity; activities with a high risk of trauma, particularly head injury.
    explanation: >-
      GeneReviews lists circumstances to avoid.
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Cautious use of medications and herbal remedies that affect platelet function, including aspirin. Use precaution with intramuscular injections (apply pressure and ice)
    explanation: >-
      Specifies medication and injection precautions.
  notes: An informational prevention activity. The specific NCIT Patient Education term is outside the current TreatmentActionTerm enum; no inaccurate therapeutic-procedure binding is substituted.

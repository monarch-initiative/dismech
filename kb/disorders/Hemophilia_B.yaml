  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Mild hemophilia B: Individuals generally do not have spontaneous bleeding episodes; however, without pre- and postoperative treatment, abnormal bleeding occurs with surgery or tooth extractions.'
    explanation: >-
      GeneReviews distinguishes mild disease from spontaneous bleeding in severe disease.
- name: Hemophilia B Leyden
  classification: regulatory_genotype
  description: >-
    A promoter-variant subtype in which childhood FIX deficiency can improve after puberty. This is an age-dependent regulatory classification that overlaps baseline activity classes; not every proximal-promoter variant has a recovering Leyden phenotype.
  evidence:
  - reference: PMID:23472758
    reference_title: A CpG mutational hotspot in a ONECUT binding site accounts for the prevalent variant of hemophilia B Leyden.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Mutations within the F9 promoter are associated with a remarkable hemophilia B subtype, termed hemophilia B Leyden, in which symptoms ameliorate after puberty.
    explanation: >-
      Defines the clinical regulatory subtype.
  - reference: PMID:23472758
    reference_title: A CpG mutational hotspot in a ONECUT binding site accounts for the prevalent variant of hemophilia B Leyden.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The various hemophilia B Leyden mutations that have been reported in this site inhibit ONECUT binding to varying degrees, which correlate well with their associated clinical severities.
    explanation: >-
      Direct binding perturbation links promoter variants to altered regulation.
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    A heterozygous mother has a 50% chance of transmitting the variant in each pregnancy. An affected father transmits it to all daughters and no sons. Females can be symptomatic with one pathogenic allele; de novo variation and parental germline mosaicism can explain simplex cases.
  evidence:
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If the mother of the proband has an F9 pathogenic variant, the chance of the mother transmitting it in each pregnancy is 50%. If the father of the proband has an F9 pathogenic variant, he will transmit it to all his daughters and none of his sons.
    explanation: >-
      GeneReviews describes X-linked transmission.
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Approximately 30% of heterozygous females have factor IX clotting activity lower than 40% and are at risk for bleeding
    explanation: >-
      This is an activity threshold among heterozygotes, not a requirement for biallelic disease.
diagnosis:
- name: FIX clotting activity and coagulation studies
  description: >-
    Establish low FIX activity with an appropriate factor assay. Severe disease is <1%, moderate 1–5%, and mild >5% to <40%; phenotype and assay context also matter. A prolonged aPTT with normal PT and platelet count suggests intrinsic-pathway factor deficiency, but mild disease can have a normal screening aPTT. Age-adjust newborn FIX results because physiologic levels are low; molecular testing or later repeat testing may resolve equivocal results.
  evidence:
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of hemophilia B is established in individuals with low factor IX clotting activity.
    explanation: >-
      Full GeneReviews diagnosis section was reviewed, including screening-test and neonatal limitations.
  - reference: PMID:31219805
    reference_title: Hyperactivity of factor IX Padua (R338L) depends on factor VIIIa cofactor activity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: people with severe disease (FIX activity <1% of normal) have frequent spontaneous bleeds; people with moderate disease (FIX activity 1%–5% of normal) rarely have spontaneous bleeds but bleed with minor trauma; and people with mild disease (FIX activity 5%–40% normal) bleed only during invasive procedures or trauma
    explanation: >-
      The introduction describes the conventional residual-activity severity bands; modern GeneReviews places exactly 5% in moderate disease.
- name: F9 molecular testing
  description: >-
    Sequence F9 including the relevant proximal promoter, with deletion/duplication testing when appropriate. A hemizygous pathogenic variant confirms male disease and a heterozygous pathogenic variant can confirm female disease; a variant of uncertain significance alone is not confirmation.
  evidence:
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Identification of a hemizygous F9 pathogenic variant by molecular genetic testing confirms the diagnosis in a male proband. Identification of a heterozygous F9 pathogenic variant by molecular genetic testing confirms the diagnosis in a female proband.
    explanation: >-
      GeneReviews supplies the molecular confirmation criteria.
- name: Inhibitor testing
  description: >-
    Measure an inhibitor when recovery or clinical response to FIX is suboptimal and according to exposure-related surveillance. Mixing studies and Bethesda-based assays distinguish a neutralizing inhibitor from isolated inherited factor deficiency, interpreted by a specialist laboratory.
  evidence:
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Screening for alloimmune inhibitors is performed after treatment with factor IX concentrates has been initiated and in any individual with a suboptimal clinical response to treatment.
    explanation: >-
      GeneReviews gives the testing indication.
biochemical:
- name: Thrombin generation capacity
  presence: DECREASED
  notes: >-
    ETP, peak thrombin, and timing measure the downstream coagulation phenotype under assay-specific conditions. The 2005 cohort contained 34 HA and 12 HB patients; its factor-infusion comparison was HA, so it does not validate TGA-guided HB dosing or a universal surrogate endpoint.
  evidence:
  - reference: PMID:15735797
    reference_title: Evaluation of thrombin generating capacity in plasma from patients with haemophilia A and B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition, a correlation was found between severe clinical bleeding phenotype and ETP.
    explanation: >-
      Correlation supports investigation of functional coagulation capacity, not validated individual prediction.
  readouts:
  - target: Deficient thrombin propagation
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: CANDIDATE_SURROGATE
    interpretation: An exploratory functional marker; prospective HB-specific validation is required before claiming clinical surrogacy.
    evidence:
    - reference: PMID:15735797

    snippet: people with severe disease (FIX activity <1% of normal) have frequent spontaneous bleeds; people with moderate disease (FIX activity 1%–5% of normal) rarely have spontaneous bleeds but bleed with minor trauma; and people with mild disease (FIX activity 5%–40% normal) bleed only during invasive procedures or trauma
    explanation: >-
      The introduction describes the conventional residual-activity severity bands; modern GeneReviews places exactly 5% in moderate disease.
  - reference: PMID:20301668
    reference_title: Hemophilia B.

        HOPE-B five-year results compare the treated cohort with its own prophylaxis lead-in, not a parallel randomized group.
- name: Fidanacogene Elaparvovec Gene Therapy
  description: >-
    AAV gene addition with FIX-Padua reduced ABR by 71% in 45 BENEGENE-2 participants versus their prophylaxis lead-in; mean activity was 26.9% at 15 months. Sixty-two percent received glucocorticoids and anti-AAV antibodies excluded many screened men. Separate phase 1/2a follow-up involved 14 participants and median 5.5 years; it is not an extension result for all 45 phase 3 recipients. Commercial access changed after development: EU authorization was withdrawn on 15 May 2025 for commercial reasons, so trial efficacy is retained without presenting Beqvez as routinely available.
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:39321362
    reference_title: Gene Therapy with Fidanacogene Elaparvovec in Adults with Hemophilia B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of the 45 participants who received fidanacogene elaparvovec, 44 completed at least 15 months of follow-up.
    explanation: >-
      Defines the phase 3 population and follow-up.
  - reference: PMID:39321362
    reference_title: Gene Therapy with Fidanacogene Elaparvovec in Adults with Hemophilia B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The annualized rate of bleeding for all bleeding episodes decreased by 71%, from 4.42 (95% confidence interval [CI], 1.80 to 7.05) at baseline to 1.28 (95% CI, 0.57 to 1.98) after gene therapy
    explanation: >-
      Before-after phase 3 outcome supports biological activity.
  - reference: PMID:39321362
    reference_title: Gene Therapy with Fidanacogene Elaparvovec in Adults with Hemophilia B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A total of 28 participants (62%) received glucocorticoids for increased aminotransferase levels or decreased factor IX levels (or both)
    explanation: >-
      Treatment burden and immune/liver monitoring qualify the benefit.
  - reference: PMID:40239068
    reference_title: Fidanacogene Elaparvovec for Hemophilia B - A Multiyear Follow-up Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A total of 14 participants provided consent and completed at least 3 years of follow-up (median, 5.5; range 3 to 6)
    explanation: >-
      This is the separate phase 1/2a follow-up cohort.
  notes: >-
    Availability verified against https://www.ema.europa.eu/en/medicines/human/EPAR/beqvez on 2026-09-04; withdrawal was requested for commercial reasons and does not refute the clinical trial results.

    evidence_source: HUMAN_CLINICAL
    snippet: "the adjusted annualized bleeding rate for all bleeding events was 4.16 during the lead-in period and 1.52 during months 7 through 60 after gene therapy, a reduction of 63%"
    explanation: >-
      Final 5-year analysis of the phase 3 HOPE-B trial of etranacogene

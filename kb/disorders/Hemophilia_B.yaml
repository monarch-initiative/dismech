  - reference: PMID:36163649
    reference_title: "Factor IX inhibitors in haemophilia B: A report of National Haemophilia Registry in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Large deletions were most significantly associated with inhibitor development."
    explanation: >-
      National registry cohort of 44 inhibitor patients among 4485 registered
      hemophilia B patients, showing that inhibitor risk is graded by F9 variant
      class, with large deletions carrying the highest risk and missense variants
      a low one. The gradient is itself consistent with the canonical model: the
      patients whose F9 lesion leaves no endogenous factor IX protein are the
      ones whose immune system treats infused factor IX as foreign.

- name: Inhibitor-Directed Hemostatic Management
  description: >-
    Clinically significant FIX inhibitors require specialized hemostatic treatment. Recombinant activated FVII bypasses FIX-dependent tenase and is an option for acute bleeding, especially when allergic reactions make FIX-containing products problematic. Non-factor prophylaxis offers additional options; doses and combinations depend on the specific concomitant therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:22123568
    reference_title: '[Acquired haemophilia B: a case report and literature review].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: patient received recombinant factor VIIa and corticosteroid treatment. Bleeding symptoms had completely disappeared and coagulation tests become normal.
    explanation: >-
      This acquired anti-FIX case supports bypass activity, not corticosteroids as routine congenital HB prophylaxis.
  - reference: PMID:37646676
    reference_title: Phase 3 Trial of Concizumab in Hemophilia with Inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Among patients with hemophilia A or B with inhibitors, the annualized bleeding rate was lower with concizumab prophylaxis than with no prophylaxis.
    explanation: >-
      Trial evidence supports an inhibitor-specific non-factor option.
  - reference: PMID:32133968
    reference_title: "'Do not Do' Recommendations in Hemophilia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: do not use factor IX (FIX) in patients with hemophilia B with inhibitor and a history of anaphylaxis after administration of FIX.
    explanation: >-
      Management review reinforces the need for bypass options in this high-risk context.
  target_mechanisms:
  - target: Deficient intrinsic tenase activity
    treatment_effect: BYPASSES
    description: >-
      Activated FVII-based therapy can generate hemostasis without restoring the inhibited FIXa-FVIIIa complex.
    evidence:
    - reference: PMID:22123568
      reference_title: '[Acquired haemophilia B: a case report and literature review].'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: patient received recombinant factor VIIa and corticosteroid treatment.
      explanation: >-
        Clinical anti-FIX case illustrates bypass, while specific regimens require broader guideline management.
- name: Immune Tolerance Induction for FIX Inhibitors
  description: >-
    Selected patients undergo specialist FIX exposure-based immune tolerance induction, sometimes with immune suppression. Success is variable and allergic reactions and nephrotic syndrome can complicate therapy. B-Natural reported 11/22 successfully tolerized after one or more courses at study end, with eight still undergoing treatment; that is not a final population success probability.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:34118102
    reference_title: The B-Natural study-The outcome of immune tolerance induction therapy in patients with severe haemophilia B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At study end, 11 (50%) were considered successfully tolerized after one or more ITI courses, three were unsuccessful, and eight were still undergoing treatment.
    explanation: >-
      Observational cohort documents incomplete follow-up and variable outcome.
  - reference: PMID:36163649
    reference_title: 'Factor IX inhibitors in haemophilia B: A report of National Haemophilia Registry in China.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nephrotic syndrome developed in two (16.7%) patients during ITI.
    explanation: >-
      This frequency applies to the selected Chinese ITI subgroup, not all HB.
  target_mechanisms:
  - target: Neutralizing FIX alloantibodies
    treatment_effect: MODULATES
    description: >-
      Attempts to induce tolerance and remove inhibitory antibody activity.
    evidence:
    - reference: PMID:34118102
      reference_title: The B-Natural study-The outcome of immune tolerance induction therapy in patients with severe haemophilia B.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Eight patients (36.4%) were successfully tolerized after the first course of ITI.
      explanation: >-
        Initial-course efficacy is distinct from later repeat-course outcomes.
- name: Rehabilitation and Pain Management
  description: >-
    Physical therapy evaluates and treats musculoskeletal disease; rehabilitation, exercise adapted to joint status, and pain care accompany bleed prevention. Established arthropathy may require orthopedic treatment and does not necessarily resolve when FIX levels rise.
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:

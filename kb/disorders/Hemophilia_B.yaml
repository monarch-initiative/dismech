experimental_models:
- name: Purified and plasma FIX-Padua cofactor-dependence assays
  experimental_model_type: OTHER
  description: >-
    Recombinant FIX-WT and R338L activity, activation, inactivation and FVIIIa dependence were compared in purified-protein and plasma systems, including transgene-expressing patient samples. Emicizumab substitution removed Padua-specific hyperactivity.
  publication: PMID:31219805
  evidence:
  - reference: PMID:31219805
    reference_title: Hyperactivity of factor IX Padua (R338L) depends on factor VIIIa cofactor activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We observed that the high-specific-activity of FIX-R338L requires factor VIIIa (FVIIIa) cofactor.
    explanation: >-
      FVIIIa perturbation identifies the requirement for Padua hyperactivity.
  modeled_mechanisms:
  - target: Deficient intrinsic tenase activity
    relationship: PERTURBS
    fidelity: HIGH
    model_scale: MOLECULAR
    limitations: Defined biochemical systems resolve enzyme-cofactor dependence but lack organ injury, vascular compartments and patient-level bleeding outcomes.
    evidence:
    - reference: PMID:31219805
      reference_title: Hyperactivity of factor IX Padua (R338L) depends on factor VIIIa cofactor activity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We observed that the high-specific-activity of FIX-R338L requires factor VIIIa (FVIIIa) cofactor.
      explanation: >-
        FVIIIa perturbation identifies the requirement for Padua hyperactivity.
- name: Leyden F9 promoter transactivation assays
  experimental_model_type: CELL_LINE
  cell_source: HepG2 and HeLa cell lines
  description: >-
    Wild-type and mutant F9 promoter reporters test HNF4-dependent transactivation. Together with ONECUT binding assays, these experiments connect specific regulatory alleles with loss of expression.
  publication: PMID:1631121
  evidence:
  - reference: PMID:1631121
    reference_title: Disruption of a binding site for hepatocyte nuclear factor 4 results in hemophilia B Leyden.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Whereas HNF-4 transactivates the wild-type promoter sequence in liver (HepG2) and non-liver (HeLa) cell types quite well, it transactivates the -20 mutated promoter to only a limited extent and the -26 mutated promoter not at all.
    explanation: >-
      Promoter transactivation separates recovering and persistent regulatory defects.
  modeled_mechanisms:
  - target: Leyden promoter dysfunction
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: Reporter assays do not recapitulate puberty, liver chromatin context or all Leyden variants.
    evidence:
    - reference: PMID:1631121
      reference_title: Disruption of a binding site for hepatocyte nuclear factor 4 results in hemophilia B Leyden.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Whereas HNF-4 transactivates the wild-type promoter sequence in liver (HepG2) and non-liver (HeLa) cell types quite well, it transactivates the -20 mutated promoter to only a limited extent and the -26 mutated promoter not at all.
      explanation: >-
        Promoter transactivation separates recovering and persistent regulatory defects.

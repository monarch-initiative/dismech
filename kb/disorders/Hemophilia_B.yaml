    reference_title: 'X Chromosome inactivation: a modifier of factor VIII and IX plasma levels and bleeding phenotype in Haemophilia carriers.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In our cohort of haemophilia carriers, XCI was significantly skewed, which may contribute to the low expression of clotting factor levels and bleeding symptoms.
    explanation: >-
      Association supports an X-inactivation modifier, with tissue-specific causation unresolved.
  - reference: PMID:33656538
    reference_title: Evolutionary insights into coagulation factor IX Padua and other high-specific-activity variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This is consistent with the previous identification of hFIX-R338L as a cause of a rare X-linked thrombophilia risk factor.
    explanation: >-
      Padua is a hyperactive variant with a distinct phenotype, used therapeutically rather than as an HB allele.
  notes: >-
    F9 coding, splice, copy-number, and proximal promoter variants can cause disease. Activity rather than antigen concentration defines severity: some dysfunctional proteins retain cross-reacting antigen. Null alleles confer greater inhibitor risk than missense alleles. A single heterozygous pathogenic variant can cause disease in females; low factor levels can reflect skewed X inactivation, but blood-cell X-inactivation measurements do not directly establish hepatocyte mosaicism. The therapeutic FIX-Padua mature-protein R338L (precursor p.Arg384Leu) is a gain-of-function transgene, not a hemophilia-causing loss-of-function variant.
treatments:
- name: Factor IX Replacement
  description: >-
    Plasma-derived or recombinant FIX treats acute bleeds and provides hemostatic cover for dental procedures, surgery, or significant trauma. A hemophilia treatment center individualizes product and exposure; inhibitor status and measured recovery can change the approach. Vitamin K and desmopressin do not correct inherited FIX deficiency.
  treatment_term:
    preferred_term: Protein Replacement Therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
  evidence:
  - reference: PMID:20301668
    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Intravenous infusion of plasma-derived or recombinant factor IX for acute bleeding episodes should be given as soon as possible after symptoms occur.
    explanation: >-
      GeneReviews supports prompt replacement for acute bleeds.
  target_mechanisms:
  - target: Factor IX Deficiency
    treatment_effect: RESTORES
    description: >-
      Provides the missing functional coagulation protein.
    evidence:
    - reference: PMID:20301668
      reference_title: Hemophilia B.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Intravenous infusion of plasma-derived or recombinant factor IX for acute bleeding episodes should be given as soon as possible after symptoms occur.
      explanation: >-
        GeneReviews supports prompt replacement for acute bleeds.
- name: Prophylactic Factor IX Replacement
  description: >-
    Regular individualized FIX prophylaxis is recommended for severe disease and for moderate or mild disease with frequent bleeds. Targets should prevent bleeding and allow activity; a trough just above 1% may be inadequate for some people, especially with existing joint disease.
  treatment_term:
    preferred_term: Protein Replacement Therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
  evidence:

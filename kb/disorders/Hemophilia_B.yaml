mechanistic_hypotheses:
- hypothesis_group_id: canonical_f9_deficiency_intrinsic_coagulation_model
  hypothesis_label: Canonical F9 Deficiency / Intrinsic Coagulation Failure Model
  status: CANONICAL
  description: >-
    Hemophilia B (Christmas disease) is caused by loss-of-function variants in F9 on Xq27.1 encoding
    coagulation factor IX (FIX). FIX is activated to FIXa by the FVIIa/tissue-factor complex and by
    FXIa, then partners with FVIIIa on activated platelet membranes as the intrinsic tenase complex to
    activate factor X. Loss of FIX activity disables propagation of the intrinsic pathway, abolishes the
    thrombin burst, and produces severe spontaneous joint, soft-tissue, and CNS bleeding analogous to
    hemophilia A. FIX replacement therapy (recombinant or plasma-derived), extended-half-life
    Fc/albumin-fusion FIX, and AAV-mediated F9 gene therapy (etranacogene dezaparvovec, fidanacogene
    elaparvovec) all support the F9-deficiency-as-rate-limiting-lesion model by restoring FIX activity
    and hemostatic competence.
  notes: >-
    Retained as CANONICAL. The 2026 openscientist
    hypothesis-search report
    (kb/hypotheses/Hemophilia_B/canonical_f9_deficiency_intrinsic_coagulation_model)
    confirms F9 loss-of-function → loss of FIXa-FVIIIa intrinsic tenase
    activity as the core mechanism, supported by two independent Phase 3
    AAV-F9 gene therapy programs (etranacogene dezaparvovec,
    fidanacogene elaparvovec) with up to 5 years of sustained
    hemostatic benefit, cross-species animal models, CRISPR/Cas9 gene
    correction, and acquired hemophilia B phenocopying the congenital
    disease through anti-FIX autoantibodies. Six refinements: (1) non-
    replacement therapies (fitusiran, concizumab) demonstrate that
    thrombin generation capacity, not FIX protein per se, is the
    functional determinant of hemostasis; (2) Hemophilia B Leyden
    promoter mutations show age-dependent phenotypic recovery,
    indicating F9 transcriptional regulation is a critical modulator;
    (3) phenotype modifiers (co-inherited FVII polymorphisms,
    thrombophilia alleles, platelet variation) explain the 10–15% of
    severe HB patients with milder phenotypes; (4) hemophilic
    arthropathy has an independent inflammatory component —
    methotrexate added to FIX prophylaxis further reduces joint
    damage in a mouse model; (5) FIX deficiency directly impairs
    bone metabolism (reduced BMD/fracture resistance in FIX-KO mice)
    independent of joint bleeding, suggesting extrahemostatic
    consequences; (6) FIX inhibitor development (1.5–3%) with
    anaphylaxis and nephrotic syndrome complicates the simple
    replacement paradigm.
  evidence:
  - reference: PMID:23430394
    reference_title: "Treatment of hemophilia B: focus on recombinant factor IX."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemophilia B is a recessive X-linked bleeding disorder characterized by deficiency of the coagulation factor IX (FIX)."
    explanation: >
      Canonical mechanism reference used as the seed for the
      hypothesis-search deep-research run.
  - reference: PMID:28508290
    reference_title: "CRISPR/Cas9-mediated somatic and germline gene correction to restore hemostasis in hemophilia B mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "62.5% of the HTV-treated mice showed a detectable gene correction (>1%) in the F9 alleles of hepatocytes, which was sufficient to remit the coagulation deficiency."
    explanation: >-
      Source for the CRISPR/Cas9 gene-correction clause of the notes above.
      Correcting the endogenous mutant allele, rather than supplying a
      transgene, is the orthogonal form of the causal test: it changes only F9
      and recovers hemostasis, so the lesion is rate-limiting. Murine, and a
      correction rate above 1% of hepatocyte alleles was enough, which also
      bounds how much residual activity the phenotype needs.
  - reference: PMID:40053895
    reference_title: "Safety and efficacy of a fitusiran antithrombin-based dose regimen in people with hemophilia A or B: the ATLAS-OLE study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Integrated efficacy analyses demonstrated superiority of AT-DR over on-demand clotting factor concentrates (CFCs; 71% mean ABR reduction; P < .0001), and on-demand bypassing agents (BPAs; 73% mean ABR reduction; P = .0006)"
    explanation: >-
      Supports refinement (1): lowering antithrombin raises thrombin generation
      and controls bleeding without supplying any factor IX, so the correctable
      proximal defect is thrombin generation capacity rather than the absence of
      the factor IX molecule. The trial enrolled severe hemophilia A and B
      together and does not break the reduction out for hemophilia B, so this
      supports the direction of the refinement rather than a hemophilia
      B-specific effect size.
  - reference: PMID:23472758
    reference_title: "A CpG mutational hotspot in a ONECUT binding site accounts for the prevalent variant of hemophilia B Leyden."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The various hemophilia B Leyden mutations that have been reported in this site inhibit ONECUT binding to varying degrees, which correlate well with their associated clinical severities."
    explanation: >-
      Supports refinement (2): the Leyden lesions sit in the F9 promoter and act
      by disrupting binding of the ONECUT1 and ONECUT2 activators, with severity
      graded by how far binding is lost. Identifies transcriptional regulation of
      F9, rather than the coding sequence alone, as a determinant of residual
      activity. Hemophilia B Leyden itself is curated as a subtype on the parent
      `Hemophilia` entry.
  - reference: PMID:19686262
    reference_title: "Polymorphism in factor VII gene modifies phenotype of severe haemophilia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the polymorphisms studied, the FVII353Q (RR = 3.5, 95% CI: 1.04-12.05, P = 0.044) allele was associated with a severe phenotype."
    explanation: >-
      Supports refinement (3): a functional polymorphism in a coagulation gene
      other than the deficient factor gene shifts clinical severity, so genotype
      at the causal locus does not fix the phenotype. Two caveats. The cohort is
      severe haemophilia broadly and its comparability analysis reports F8:c
      activity, so it is not a hemophilia B-specific estimate. And the direction
      here is toward a more severe phenotype, whereas the notes discuss modifiers
      as an explanation for milder-than-expected disease.
  - reference: PMID:42119948
    reference_title: "Targeting synovitis by immunomodulation as a novel therapeutic approach for hemophilic arthropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Prophylactic MTX combined with EHL-FIX reduced the severity of the synovitis, significantly reduced the vascular density in the synovial pannus, and decreased the degree of cartilage damage compared with EHL-FIX alone."
    explanation: >-
      Source of the methotrexate result quoted in refinement (4). Adding an
      immunomodulator to factor IX prophylaxis protected the joint better than
      prophylaxis alone, which is what makes the inflammatory arm of arthropathy
      partly independent of hemostatic correction. Murine, and the same
      experiment found no difference in cartilage erosion or proteoglycan loss in
      its delayed-treatment arm, so the effect is bounded.
  - reference: PMID:34117910
    reference_title: "Deletion of Coagulation Factor IX Compromises Bone Mass and Strength: Murine Model of Hemophilia B (Christmas Disease)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the FIX KO mice displayed reduced bone mineral density (BMD), reduced cortical and cancellous bone mass, and diminished whole bone fracture resistance"
    explanation: >-
      Source of the bone phenotype quoted in refinement (5), measured in mice
      whose somatic growth matched wild-type littermates, so it is not secondary
      to reduced loading. The paper's own reading is narrower than the word
      extrahemostatic suggests: together with parallel findings in FVIII-deficient
      mice it points to an effector downstream of the coagulation cascade being
      needed for skeletal development, rather than to a non-hemostatic function of
      factor IX itself. See the discussion `hemophilia_b_bone_extrahemostatic_role`.
  - reference: PMID:29925096
    reference_title: "Inhibitors in Hemophilia B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The development of an inhibitor in HB is a rare event (1.5-3% of all patients) but is associated with a significant morbidity, related not only to the bleeding risk but also to the frequent occurrence of allergic/anaphylactic reactions and nephrotic syndrome."
    explanation: >-
      Source of the incidence figure and the two complications named in
      refinement (6). Review-level rather than a single cohort, so the 1.5-3%
      band is a field-level synthesis; the accompanying anaphylaxis and nephrotic
      syndrome risks are what make this complication disproportionate to its
      frequency in hemophilia B compared with hemophilia A.
pathophysiology:
- name: Factor IX Deficiency
  description: >-
    Deficiency of coagulation factor IX impairs intrinsic pathway function and
    leads to abnormal bleeding.
  evidence:
  - reference: PMID:23430394
    reference_title: "Treatment of hemophilia B: focus on recombinant factor IX."
    supports: SUPPORT
    snippet: "Hemophilia B is a recessive X-linked bleeding disorder characterized by deficiency of the coagulation factor IX (FIX)."
    explanation: The abstract identifies factor IX deficiency as the cause of hemophilia B.
  downstream:
  - target: Abnormal Bleeding
    causal_link_type: DIRECT
    description: Factor IX deficiency impairs coagulation and produces abnormal bleeding.
  - target: Hemarthrosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Severe coagulation impairment can manifest as spontaneous bleeding into joints.
    intermediate_mechanisms:
    - impaired intrinsic-pathway thrombin generation
    - spontaneous joint-space bleeding
  - target: Intrinsic Tenase Complex Failure
    causal_link_type: DIRECT
    description: >-
      Without factor IXa there is no protease to occupy the intrinsic tenase
      complex, so the complex cannot assemble on the activated platelet surface
      however much factor VIIIa is present.
- name: Intrinsic Tenase Complex Failure
  biological_scale: MOLECULAR
  description: >-
    Factor IXa does not act alone. It is the protease half of the intrinsic
    tenase complex, whose other half is the cofactor factor VIIIa, and the pair
    activates factor X on the membrane of an activated platelet. Losing factor
    IX therefore disables one specific enzyme rather than a whole pathway: the
    tissue-factor-driven initiation of clotting is intact, and what fails is the
    amplification step that follows it. The cofactor dependence is direct rather
    than inferred, since the hyperactivity of the FIX-Padua variant used in gene
    therapy disappears when factor VIIIa is replaced by a mimetic antibody.
  cell_types:
  - preferred_term: activated platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: factor X activation by the factor VIIIa-factor IXa intrinsic tenase complex
    term:
      id: GO:0007597
      label: blood coagulation, intrinsic pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:31219805
    reference_title: "Hyperactivity of factor IX Padua (R338L) depends on factor VIIIa cofactor activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In a novel system utilizing emicizumab, a FVIII-mimicking bispecific antibody, the hyperactivity of both recombinant FIX-R338L and AAV-mediated-transgene-expressed FIX-R338L from HB GT subjects is ablated without FVIIIa activity."
    explanation: >-
      Establishes that factor IX exerts its activity through the factor
      VIIIa-dependent tenase complex rather than independently: removing genuine
      factor VIIIa cofactor activity abolishes the gain, in recombinant protein
      and in transgene-expressed factor IX from gene therapy recipients alike.
  - reference: PMID:11434702
    reference_title: "A cell-based model of hemostasis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "3) propagation, in which large amounts of thrombin are generated on the platelet surface. This cell based model explains some aspects of hemostasis that a protein-centric model does not."
    explanation: >-
      Places the step this node describes on the activated platelet membrane and
      in the propagation phase, which is why the cell type annotated here is the
      platelet rather than a factor IX-synthesizing hepatocyte.
  downstream:
  - target: Deficient Thrombin Generation
    causal_link_type: DIRECT
    description: >-
      Reduced factor Xa output starves the prothrombinase complex, so the large
      second wave of thrombin generation never arrives.
- name: Deficient Thrombin Generation
  biological_scale: MOLECULAR
  description: >-
    The quantity of thrombin a patient can generate, not the presence of factor
    IX protein as such, is what the clot depends on. Thrombin generation in
    hemophilia plasma tracks residual factor activity, and it also separates
    patients whose bleeding is clinically severe from those whose is not, which
    is why it is the parameter that rebalancing therapies restore without
    supplying any factor IX at all.
  biological_processes:
  - preferred_term: thrombin generation during blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: DECREASED
  evidence:
  - reference: PMID:15735797
    reference_title: "Evaluation of thrombin generating capacity in plasma from patients with haemophilia A and B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a series of 46 haemophilia patients (34 haemophilia A and 12 haemophilia B patients), we found a significant correlation between plasmatic FVIII/FIX levels and endogenous thrombin potential (ETP), peak and time to peak obtained by thrombin generation measurement"
    explanation: >-
      Measures the link this node asserts in patient plasma that includes 12
      hemophilia B patients: how much factor is present predicts how much
      thrombin can be generated. A small series, and factor VIII and factor IX
      patients are analysed together rather than separately.
  - reference: PMID:15735797
    reference_title: "Evaluation of thrombin generating capacity in plasma from patients with haemophilia A and B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, a correlation was found between severe clinical bleeding phenotype and ETP."
    explanation: >-
      Carries the node one step further, to the clinical end: thrombin-generating
      capacity, and not only the factor assay, tracks whether bleeding is
      severe. Correlational and from the same 46-patient series.
  downstream:
  - target: Abnormal Bleeding
    causal_link_type: DIRECT
    description: >-
      A clot forms but does not hold, because too little thrombin is made to
      build a dense, mechanically stable, lysis-resistant fibrin network.
  - target: Hemarthrosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The synovial vasculature is a preferential site at which the unstabilized
      clot fails, giving repeated bleeding into the joint space.
    intermediate_mechanisms:
    - failure to stabilize hemostasis in the synovial vasculature under joint loading

discussions:
- discussion_id: hemophilia_b_bone_extrahemostatic_role
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the bone phenotype of factor IX deficiency reflect a role for factor IX
    outside hemostasis, or a requirement for something downstream of the
    coagulation cascade, such as thrombin, that is common to hemophilia A and B?
  attaches_to:
  - pathophysiology#Factor IX Deficiency
  rationale: >
    Factor IX knockout mice have low bone mineral density, reduced cortical and
    cancellous bone mass, and weaker bones, and the effect is not explained by
    reduced loading, since somatic growth matched wild-type littermates at 10 and
    20 weeks. The mismatch is in what that licenses. The same paper reports
    parallel findings in FVIII-deficient mice and concludes that they point to an
    effector downstream of the coagulation cascade being necessary for normal
    skeletal development, which is a claim about thrombin or another downstream
    product rather than about factor IX having a second, non-hemostatic job.
    Those two readings make opposite predictions and the mouse data cannot
    separate them.

    The human side does not resolve it either. The available clinical series
    studied 29 children with haemophilia of mixed type and severity on
    prophylaxis and found lower bone mineral density, higher urinary calcium and
    altered bone turnover but no excess fractures, and offers primary skeletal
    pathology as an interpretation rather than a finding. Nothing in it is
    hemophilia B-specific, and no molecular mechanism has been demonstrated in
    human bone.

    Recorded rather than curated as a pathophysiology node, because a node would
    have to commit to one of the two readings.
  proposed_experiments:
  - experiment_id: f9_conditional_knockout_bone_lineage
    name: Lineage-restricted conditional F9 knockout
    description: >-
      Compare hepatocyte-specific with osteoblast-lineage-specific conditional F9
      knockout mice on bone mineral density and bone turnover markers. A bone
      phenotype that persists in the hepatocyte-restricted knockout implicates
      circulating factor IX or a downstream product such as thrombin; one that
      appears only with local deletion implicates factor IX acting in bone.
    experiment_type:
      preferred_term: lineage-restricted conditional gene knockout study
    would_support:
    - pathophysiology#Deficient Thrombin Generation
    supporting_outcome:
    - >-
        Bone phenotype tracks the hepatocyte-restricted knockout, indicating that
        the skeletal defect follows the circulating hemostatic deficit rather than
        a local role for factor IX.
    refuting_outcome:
    - >-
        Bone phenotype appears only with osteoblast-lineage deletion, which would
        establish a local, non-hemostatic requirement for factor IX in bone.
  - experiment_id: gene_therapy_recipient_bmd_followup
    name: Longitudinal bone density in gene therapy recipients
    description: >-
      Prospective serial densitometry and bone turnover markers in recipients of
      etranacogene dezaparvovec or fidanacogene elaparvovec against
      prophylaxis-matched controls. Restoring endogenous factor IX to the mild
      range is the closest available human analogue of the knockout rescue.
    experiment_type:
      preferred_term: prospective observational bone densitometry cohort study
    would_support:
    - pathophysiology#Factor IX Deficiency
    supporting_outcome:
    - >-
        Bone turnover and density normalize after factor IX restoration, tying the
        skeletal phenotype to the factor IX deficit.
    refuting_outcome:
    - >-
        Bone measures remain abnormal despite sustained mild-range factor IX
        activity, implicating a mechanism the current therapy does not reach.
  evidence:
  - reference: PMID:34117910
    reference_title: "Deletion of Coagulation Factor IX Compromises Bone Mass and Strength: Murine Model of Hemophilia B (Christmas Disease)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings coupled with parallel observations in a murine model of hemophilia A (FVIII deficiency) point to an effector downstream of the coagulation cascade that is necessary for normal skeletal development."
    explanation: >-
      The paper's own conclusion, and the reason this is a mismatch rather than a
      settled extrahemostatic role: the authors locate the requirement downstream
      of the cascade and shared with hemophilia A, not in factor IX itself.
  - reference: PMID:21391975
    reference_title: "Hypercalciuria in children with haemophilia suggests primary skeletal pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest primary skeletal pathology, resulting in increased urinary calcium loss and altered bone metabolism, which may over time contribute to the development of osteoporosis in patients with haemophilia."
    explanation: >-
      The human counterpart, and the limit of it. A case-control study of 29
      children with haemophilia on prophylaxis, not stratified by factor, framing
      primary skeletal pathology as a suggestion drawn from calcium handling
      rather than as a demonstrated mechanism.
- discussion_id: hemophilia_b_arthropathy_inflammatory_arm
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does hemophilic arthropathy in people with hemophilia B carry an inflammatory
    process that factor IX prophylaxis alone cannot arrest, as adding
    methotrexate in the murine model implies?
  attaches_to:
  - phenotypes#Hemarthrosis
  rationale: >
    In hemophilia B mice given repeated knee punctures, methotrexate added to
    extended half-life factor IX prophylaxis protected the joint better than
    prophylaxis alone, reducing synovitis severity, synovial pannus vascularity
    and cartilage damage; given after synovitis was established it reduced
    synovial hyperplasia, vascularity and macrophage infiltration. If the same
    holds in patients, joint outcome is not fully determined by how well bleeding
    is controlled, and an immunomodulatory arm would belong in management.

    What is missing is the human step. This is a single murine study, its
    delayed-treatment arm found no difference in cartilage erosion or
    proteoglycan loss, and no trial has tested adjunctive immunomodulation
    against prophylaxis alone in people with hemophilia B. Model-to-human
    transfer is not routine here: the murine joint is loaded differently, the
    bleeding is induced by puncture rather than spontaneous, and methotrexate
    carries its own risk in a population already managing a bleeding disorder.
  proposed_experiments:
  - experiment_id: mtx_adjunct_to_fix_prophylaxis_trial
    name: Adjunctive methotrexate with factor IX prophylaxis in early arthropathy
    description: >-
      Randomized trial of methotrexate added to factor IX prophylaxis versus
      prophylaxis alone in people with severe hemophilia B and early arthropathy,
      stratified by target-joint count and inhibitor status, with synovial
      thickness on ultrasound and a joint health score as outcomes.
    experiment_type:
      preferred_term: randomized controlled adjunctive-therapy trial
    would_support:
    - phenotypes#Hemarthrosis
    supporting_outcome:
    - >-
        Joint outcomes improve on the combination beyond what the bleeding-rate
        difference accounts for, establishing an inflammatory arm that hemostatic
        correction alone does not reach.
    refuting_outcome:
    - >-
        Joint outcomes track bleeding control alone, with no separable benefit from
        immunomodulation.
  evidence:
  - reference: PMID:42119948
    reference_title: "Targeting synovitis by immunomodulation as a novel therapeutic approach for hemophilic arthropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Unlike inflammatory synovitis, HArt lacks disease-modifying, joint-directed, targeted therapies."
    explanation: >-
      States the gap this discussion records, from the study that is currently
      the only direct test of closing it, and which is murine.
- discussion_id: hemophilia_b_gene_therapy_durability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How long does AAV-directed factor IX expression persist beyond the 5 to 6
    years now reported, and can a recipient whose expression declines be
    re-dosed?
  attaches_to:
  - treatments#Gene Therapy
  rationale: >
    Both licensed hemophilia B vectors have now reported multiyear follow-up with
    stable expression: etranacogene dezaparvovec at 5 years and fidanacogene
    elaparvovec across 3 to 6 years. That is the whole of the record. The AAV
    genome persists in hepatocytes largely as an episome, so it is not replicated
    when a hepatocyte divides, and whether expression holds across a normal adult
    liver's turnover over decades is untested rather than answered.

    It matters because it decides what the therapy is. If expression holds, a
    single infusion is curative; if it decays, it is a long-duration treatment
    whose recipients will eventually need something else, and re-dosing with the
    same serotype is blocked by the neutralizing antibodies the first dose
    raises. Recorded as a gap in evidence rather than a caveat on the treatment,
    because the follow-up simply has not reached the relevant horizon.
  evidence:
  - reference: PMID:41358585
    reference_title: "Final Analysis of a Study of Etranacogene Dezaparvovec for Hemophilia B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sustained endogenous factor IX expression and low annualized bleeding rates over a 5-year period were observed after an infusion of etranacogene dezaparvovec."
    explanation: >-
      Marks the current outer edge of the evidence. Expression was stable to 5
      years, which is the longest follow-up available for this product and the
      point beyond which nothing is known.

    reference_title: Hemophilia B.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Physical therapy for evaluation and treatment of musculoskeletal disease; standard treatments for pain with help from a pain specialist as needed
    explanation: >-
      GeneReviews recommends rehabilitation and pain management.

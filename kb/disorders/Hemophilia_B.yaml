- name: Blood-induced synovitis
  description: >-
    Chronic synovial inflammation, hyperplasia, macrophage infiltration, and abnormal vascularity accompany recurrent hemarthrosis. Mouse experiments show that these processes can be modified in addition to FIX prophylaxis; the exact contribution of each mediator in patients remains unresolved.
  evidence:
  - reference: PMID:42119948
    reference_title: Targeting synovitis by immunomodulation as a novel therapeutic approach for hemophilic arthropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Following targeted treatment of chronic synovitis, combined FIX + MTX therapy resulted in significantly reduced synovial hyperplasia, vascularity, and macrophage infiltration.
    explanation: >-
      Delayed methotrexate changes synovial endpoints in mice, but does not establish a standard human therapy.
  - reference: PMID:17822515
    reference_title: 'Pathogenesis of haemophilic synovitis: experimental studies on blood-induced joint damage.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: it is likely that iron deposition in the synovium induces an inflammatory response that causes not only immune system activation but also stimulates angiogenesis.
    explanation: >-
      Mechanistic synthesis supports iron-associated amplification as a qualified model, not a proven linear human p53→p21→TRAIL pathway.
  downstream:

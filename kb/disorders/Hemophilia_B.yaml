      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Fitusiran, a subcutaneous investigational small interfering RNA therapeutic, lowers antithrombin (AT) to increase thrombin generation and rebalance hemostasis in people with hemophilia.
      explanation: >-
        Antithrombin reduction bypasses the deficient procoagulant factor.
- name: Concizumab
  description: >-
    Anti-TFPI prophylaxis increases extrinsic-pathway FXa generation for patients aged ≥12 years with hemophilia A or B with or without inhibitors. Explorer7 included 133 participants, only 52 in the randomized comparison; explorer8 had a separate HB randomized comparison (12 no prophylaxis, 24 concizumab) with a treated-bleed rate ratio of 0.21. Thromboembolic events prompted a trial pause and mitigation; current management requires drug-level-guided dosing and a breakthrough-bleed plan.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:33570646
    reference_title: 'Concizumab: a novel anti-TFPI therapeutic for hemophilia.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: When the TFPI inhibitory activity is decreased, sufficient FXa is produced by the FVIIa-tissue factor complex to achieve hemostasis.
    explanation: >-
      Mechanistic review describes a bypass through extrinsic FXa generation.
  - reference: PMID:37646676
    reference_title: Phase 3 Trial of Concizumab in Hemophilia with Inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of 133 enrolled patients, 19 were randomly assigned to group 1 and 33 to group 2; the remaining 81 were assigned to groups 3 and 4.
    explanation: >-
      Separates randomized evidence from the full inhibitor cohort.
  - reference: PMID:39521008
    reference_title: 'Concizumab prophylaxis in people with haemophilia A or haemophilia B without inhibitors (explorer8): a prospective, multicentre, open-label, randomised, phase 3a trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 0·21 (0·10-0·45; p<0·0001) for patients with haemophilia B.
    explanation: >-
      HB-specific result in explorer8 compares concizumab with no prophylaxis.
  - reference: PMID:42341325
    reference_title: 'Concizumab in patients with hemophilia A or B without inhibitors: 56-week cutoff results of the phase 3 explorer8 study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Low median annualized bleeding rates for treated spontaneous and traumatic bleeding episodes were maintained at the 56-week cutoff in patients receiving concizumab
    explanation: >-
      Longer follow-up maintains efficacy; HA and HB subgroup results are reported separately.
  notes: >-
    The US indication expanded to patients without inhibitors in July 2025; checked against the manufacturer announcement and current prescribing information on 2026-09-04. Earlier GeneReviews/review statements limiting use to inhibitor-positive HB are time-specific.
  target_mechanisms:
  - target: Impaired factor X activation
    treatment_effect: BYPASSES
    description: >-

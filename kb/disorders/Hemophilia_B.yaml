    snippet: 'Moderate hemophilia B: Less frequent spontaneous bleeding, although it varies between individuals; however, individuals with moderate hemophilia B do have prolonged or delayed oozing after relatively minor trauma'
    explanation: >-
      GeneReviews documents variation within the moderate activity band.
- name: Mild Hemophilia B
  classification: baseline_FIX_activity
  description: >-
    Baseline FIX activity above 5 and below 40 IU/dL (>5% to <40%). Spontaneous bleeding is generally absent, but surgery, dental extraction, or major trauma can cause serious bleeding. Diagnosis may be delayed until adulthood.
  evidence:
  - reference: PMID:31219805

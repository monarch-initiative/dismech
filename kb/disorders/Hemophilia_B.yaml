      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: containing a high-activity human factor IX variant (FIX-R338L/FIX-Padua)
      explanation: >-
        The transgene is explicitly Padua.
- name: Fitusiran
  description: >-
    Subcutaneous SERPINC1-directed siRNA reduces antithrombin and increases thrombin generation in eligible patients aged ≥12 years with hemophilia A or B, with or without inhibitors. ATLAS-OLE included 213 participants on an antithrombin-guided regimen, not 213 HB-only randomized patients. The regimen targets AT 15–35% to mitigate thrombosis; breakthrough bleeding, liver and gallbladder safety, and laboratory monitoring require product-specific specialist management.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:40053895
    reference_title: 'Safety and efficacy of a fitusiran antithrombin-based dose regimen in people with hemophilia A or B: the ATLAS-OLE study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fitusiran, a subcutaneous investigational small interfering RNA therapeutic, lowers antithrombin (AT) to increase thrombin generation and rebalance hemostasis in people with hemophilia.
    explanation: >-
      Antithrombin reduction bypasses the deficient procoagulant factor.
  - reference: PMID:40053895
    reference_title: 'Safety and efficacy of a fitusiran antithrombin-based dose regimen in people with hemophilia A or B: the ATLAS-OLE study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Integrated efficacy analyses demonstrated superiority of AT-DR over on-demand clotting factor concentrates (CFCs; 71% mean ABR reduction; P < .0001), and on-demand bypassing agents (BPAs; 73% mean ABR reduction; P = .0006); improvement over BPA prophylaxis (70% mean ABR reduction); and ABR comparable with that observed with CFC prophylaxis.
    explanation: >-
      External parent-study comparisons do not imply 71% superiority to prophylactic FIX.
  - reference: PMID:40053895
    reference_title: 'Safety and efficacy of a fitusiran antithrombin-based dose regimen in people with hemophilia A or B: the ATLAS-OLE study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Persistent AT activity levels of <10% for prolonged periods of time were identified as a potential modifiable target for risk mitigation
    explanation: >-
      The low-AT risk is central to the redesigned dosing strategy.
  target_mechanisms:
  - target: Deficient thrombin propagation
    treatment_effect: BYPASSES
    description: >-
      Reduces anticoagulant inhibition of thrombin rather than supplying FIX.
    evidence:

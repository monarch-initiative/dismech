progression:
- phase: Influenza-like prodrome
  notes: >-
    Most patients who go on to parenchymal CNS involvement have a preceding
    influenza-like illness before neurological symptoms begin.
  evidence:
  - reference: PMID:3918344
    reference_title: "[Epidemic listeriosis. Report of 25 cases in 15 months at the Vaud University Hospital Center]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in 7 out of 8 patients with parenchymal CNS involvement an influenza-like
      illness was present prior to the development of neurological symptoms
    explanation: >-
      Documents the prodromal phase that precedes the neuroinvasive phase in
      parenchymal CNS listeriosis.
- phase: Neuroinvasive phase
  notes: >-
    Altered consciousness, headache and fever dominate once CNS disease is
    established.
  evidence:
  - reference: PMID:3918344
    reference_title: "[Epidemic listeriosis. Report of 25 cases in 15 months at the Vaud University Hospital Center]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prominent clinical features in all patients with neuromeningeal disease
      included altered consciousness, headache and fever
    explanation: >-
      Characterizes the established neuroinvasive phase of the disease.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Neurolisteriosis carries high short-term mortality, and imaging markers of
    ventricular or parenchymal involvement separate patients with very poor
    three-month survival from the rest.
  evidence:
  - reference: PMID:29796652
    reference_title: "Imaging of Human Neurolisteriosis: A Prospective Study of 71 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three-month survival was lower in patients with hydrocephalus or
      contrast-enhancing ventricles (1/7 [14%] than without [47/64, 73%], P =
      .005)
    explanation: >-
      Quantifies the prognostic weight of the hydrocephalus phenotype curated in
      this entry.
  - reference: PMID:23592828
    reference_title: "Listeria monocytogenes sequence type 6 and increased rate of unfavorable outcome in meningitis: epidemiologic cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multivariate regression analysis identified infection with L.
      monocytogenes ST6 as the sole predictor of unfavorable outcome (odds
      ratio, 3.77; 95% confidence interval, 1.07-13.33).
    explanation: >-
      Records that outcome is modified by the infecting bacterial sequence type,
      not by host factors alone.
  notes: >-
    Unfavorable outcome in Dutch nationwide cohorts of adult listerial
    meningitis rose from 27% to 61% over fourteen years, alongside the emergence
    of sequence type 6.
transmission:
- name: Foodborne Listeria acquisition
  description: >-
    Humans ingest L. monocytogenes in contaminated ready-to-eat foods or
    unprocessed dairy before intestinal translocation and bacteremia seed the
    CNS in susceptible adults or the placenta and neonate in pregnancy.
  evidence:
  - reference: PMID:40887071
    reference_title: Invasive Neonatal Listeriosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pregnant persons can acquire this foodborne pathogen from deli meats and
      unprocessed cheese, placing their neonate at risk.
    explanation: >-
      Supports contaminated deli meat and unprocessed cheese as maternal
      foodborne vehicles that can endanger neonates.
- name: Vertical or nosocomial neonatal Listeria exposure
  description: >-
    Early-onset neonatal infection follows maternal-fetal spread, whereas
    late-onset neonatal meningoencephalitis can follow nonmaternal,
    healthcare-associated postnatal exposure.
  evidence:
  - reference: PMID:419368
    reference_title: Epidemiology of listeriosis in Sweden 1958--1974.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neonates with early onset of disease were infected by their mothers, while
      neonates with late onset of disease were infected from other and often
      nosocomial sources.
    explanation: >-
      Supports both vertical and postnatal nosocomial neonatal acquisition
      branches.

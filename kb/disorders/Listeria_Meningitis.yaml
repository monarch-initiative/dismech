    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurolisteriosis presented as meningoencephalitis in 212 (84%) of 252
      patients; brainstem involvement was only reported in 42 (17%) of 252
      patients.
    explanation: >-
      Meningoencephalitis occurred in 84% of MONALISA neurolisteriosis cases.
- name: Hydrocephalus
  description: Hydrocephalus or contrast-enhancing ventricles are an imaging complication of severe neurolisteriosis.

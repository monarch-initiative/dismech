- name: Rhombencephalitis-associated brainstem syndrome
  description: >-
    Listeria rhombencephalitis can involve the pons, medulla oblongata,
    cerebellum, and cranial nerves on MRI.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Nystagmus
    term:
      id: HP:0000639
      label: Nystagmus
  evidence:
  - reference: PMID:37303100
    reference_title: "Epidemiology, clinical and imaging features of rhombencephalitis caused by L. monocytogenes. A retrospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent MRI findings in patients with confirmed
      rhombencephalitis were T2-FLAIR hyperintensity (100%), T1 hypointensity
      (80%), scattered parenchymal enhancement (80%), and cranial nerve
      enhancement (70%), while the most frequent anatomical involvement were
      pons, medulla oblongata, and cerebellum.
    explanation: >-
      Supports brainstem, cerebellar, and cranial-nerve involvement as the MRI
      substrate for ocular-motor and bulbar signs in Listeria
      rhombencephalitis.
diagnosis:
- name: CSF or Blood Culture Diagnosis with MRI for Rhombencephalitis
  description: >-
    Diagnosis rests on culturing L. monocytogenes from cerebrospinal fluid or
    blood, with brain MRI used to detect meningeal enhancement, parenchymal
    abscesses or nodules, hemorrhage, ventriculitis or hydrocephalus, and
    rhombencephalitis.
  evidence:
  - reference: PMID:23592828
    reference_title: "Listeria monocytogenes sequence type 6 and increased rate of unfavorable outcome in meningitis: epidemiologic cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Episodes of community-acquired listerial meningitis confirmed by
      cerebrospinal fluid culture were included from 1998 to 2002 and 2006 to
      2012.
    explanation: >-
      Establishes CSF culture confirmation in adult Listeria meningitis
      cohorts.
  - reference: PMID:29796652
    reference_title: "Imaging of Human Neurolisteriosis: A Prospective Study of 71 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance and computed tomography images were studied by 2
      independent neuroradiologists.
    explanation: >-
      Supports MRI and CT as structured imaging modalities for proven
      neurolisteriosis.
treatments:
- name: Amoxicillin or Ampicillin plus Gentamicin
  description: >-
    Aminopenicillin therapy is the Listeria-active antibacterial backbone, with
    gentamicin added early for synergy in severe invasive or CNS disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amoxicillin
      term:
        id: CHEBI:2676
        label: amoxicillin
    - preferred_term: ampicillin
      term:
        id: CHEBI:28971
        label: ampicillin
    - preferred_term: gentamicin
      term:
        id: CHEBI:759884
        label: gentamicin
  target_mechanisms:
  - target: CNS Listeria Seeding
    treatment_effect: INHIBITS
    description: >-
      Bactericidal beta-lactam and aminoglycoside treatment lowers Listeria
      burden in infected CSF, brain, and blood.
  evidence:
  - reference: PMID:10390217
    reference_title: Comparative efficacies of antibiotics in a rat model of meningoencephalitis due to Listeria monocytogenes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the brain, amoxicillin plus gentamicin was more active than all of the
      other regimens
    explanation: >-
      The infant-rat meningoencephalitis model directly compared regimens and
      found amoxicillin plus gentamicin most active in brain tissue.
- name: Trimethoprim-Sulfamethoxazole Salvage
  description: >-
    Trimethoprim-sulfamethoxazole is an intracellularly active, CNS-penetrant
    alternative for refractory Listeria CNS infection or for hosts who cannot
    tolerate aminopenicillin therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: trimethoprim-sulfamethoxazole
      term:
        id: NCIT:C909
        label: Trimethoprim-Sulfamethoxazole
  target_mechanisms:
  - target: LLO Phagosomal Escape
    treatment_effect: INHIBITS
    description: >-
      Intracellular trimethoprim-sulfamethoxazole activity can kill Listeria in
      host-cell compartments less accessible to amoxicillin and gentamicin.
  evidence:
  - reference: PMID:10959905
    reference_title: Trimethoprim-sulfamethoxazole salvage for refractory listeriosis during maintenance chemotherapy for acute lymphoblastic leukemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TMP/SMX has bactericidal extracellular and intracellular activity against
      Listeria and excellent central nervous system penetration, and thus may be
      effective for the treatment of refractory listeriosis.
    explanation: >-
      A refractory Listeria bacteremia and meningitis case supports
      trimethoprim-sulfamethoxazole as a CNS-penetrant intracellular salvage
      agent.
- name: Stop Dexamethasone After Listeria Confirmation
  description: >-
    Empirical dexamethasone used for community-acquired bacterial meningitis is
    stopped once L. monocytogenes is identified, because outcome benefit in
    Listeria meningitis is unproven and MONALISA associated adjunctive
    dexamethasone with lower neurolisteriosis survival.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy Discontinuation
    term:
      id: NCIT:C128535
      label: Pharmacotherapy Discontinuation
    therapeutic_agent:
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  evidence:
  - reference: PMID:36472590
    reference_title: "Progress and Challenges in Bacterial Meningitis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Adjunctive dexamethasone should be used in patients with bacterial
      meningitis but stopped if Listeria monocytogenes is confirmed.
    explanation: >-
      Review guidance supports discontinuing empirical dexamethasone once the
      organism is confirmed to be L. monocytogenes.
  - reference: PMID:28139432

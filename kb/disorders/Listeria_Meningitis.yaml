- name: LLO Phagosomal Escape
  description: >-
    Listeriolysin O disrupts the phagocytic vesicle, allowing internalized
    L. monocytogenes to leave the phagosome and replicate in host-cell cytosol.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: symbiont-mediated disruption of host phagosome
    term:
      id: GO:0141160
      label: symbiont-mediated disruption of host phagosome
    modifier: INCREASED
  cellular_components:
  - preferred_term: phagocytic vesicle
    term:
      id: GO:0045335
      label: phagocytic vesicle
  - preferred_term: cytosol
    term:
      id: GO:0005829
      label: cytosol
  downstream:
  - target: ActA and Efferocytosis-Linked Cell-to-Cell Spread
    causal_link_type: DIRECT
    description: >-
      Cytosolic bacteria polymerize host actin and push into neighboring cells

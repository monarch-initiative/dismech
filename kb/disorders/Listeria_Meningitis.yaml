diagnosis:
- name: CSF or Blood Culture Diagnosis with MRI for Rhombencephalitis
  description: >-
    Diagnosis rests on culturing L. monocytogenes from cerebrospinal fluid or
    blood, with brain MRI used to detect meningeal enhancement, parenchymal
    abscesses or nodules, hemorrhage, ventriculitis or hydrocephalus, and
    rhombencephalitis.
  evidence:
  - reference: PMID:23592828
    reference_title: "Listeria monocytogenes sequence type 6 and increased rate of unfavorable outcome in meningitis: epidemiologic cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Episodes of community-acquired listerial meningitis confirmed by
      cerebrospinal fluid culture were included from 1998 to 2002 and 2006 to
      2012.
    explanation: >-
      Establishes CSF culture confirmation in adult Listeria meningitis
      cohorts.
  - reference: PMID:29796652
    reference_title: "Imaging of Human Neurolisteriosis: A Prospective Study of 71 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance and computed tomography images were studied by 2
      independent neuroradiologists.
    explanation: >-
      Supports MRI and CT as structured imaging modalities for proven
      neurolisteriosis.
treatments:
- name: Amoxicillin or Ampicillin plus Gentamicin
  description: >-
    Aminopenicillin therapy is the Listeria-active antibacterial backbone, with
    gentamicin added early for synergy in severe invasive or CNS disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amoxicillin
      term:
        id: CHEBI:2676
        label: amoxicillin
    - preferred_term: ampicillin
      term:
        id: CHEBI:28971
        label: ampicillin
    - preferred_term: gentamicin
      term:
        id: CHEBI:759884
        label: gentamicin
  target_mechanisms:
  - target: CNS Listeria Seeding
    treatment_effect: INHIBITS
    description: >-
      Bactericidal beta-lactam and aminoglycoside treatment lowers Listeria
      burden in infected CSF, brain, and blood.
  evidence:
  - reference: PMID:10390217
    reference_title: Comparative efficacies of antibiotics in a rat model of meningoencephalitis due to Listeria monocytogenes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the brain, amoxicillin plus gentamicin was more active than all of the
      other regimens
    explanation: >-
      The infant-rat meningoencephalitis model directly compared regimens and
      found amoxicillin plus gentamicin most active in brain tissue.
  - reference: PMID:36472590
    reference_title: "Progress and Challenges in Bacterial Meningitis: A Review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In countries in which the prevalence of ceftriaxone-resistant
      Streptococcus pneumoniae exceeds 1%, vancomycin and ceftriaxone are the
      empirical antibiotics of choice, with the addition of ampicillin in
      neonates, older patients, and immunocompromised patients.
    explanation: >-
      The aminopenicillin is added to the empirical cephalosporin-based regimen
      specifically for the groups at risk of Listeria, so this entry's
      first-line agent is a separate requirement rather than part of the
      standard backbone.
- name: Trimethoprim-Sulfamethoxazole Salvage
  description: >-
    Trimethoprim-sulfamethoxazole is an intracellularly active, CNS-penetrant
    alternative for refractory Listeria CNS infection or for hosts who cannot
    tolerate aminopenicillin therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: trimethoprim-sulfamethoxazole
      term:
        id: NCIT:C909
        label: Trimethoprim-Sulfamethoxazole
  target_mechanisms:
  - target: LLO Phagosomal Escape
    treatment_effect: INHIBITS
    description: >-
      Intracellular trimethoprim-sulfamethoxazole activity can kill Listeria in
      host-cell compartments less accessible to amoxicillin and gentamicin.
  evidence:
  - reference: PMID:10959905
    reference_title: Trimethoprim-sulfamethoxazole salvage for refractory listeriosis during maintenance chemotherapy for acute lymphoblastic leukemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TMP/SMX has bactericidal extracellular and intracellular activity against
      Listeria and excellent central nervous system penetration, and thus may be
      effective for the treatment of refractory listeriosis.
    explanation: >-
      A refractory Listeria bacteremia and meningitis case supports
      trimethoprim-sulfamethoxazole as a CNS-penetrant intracellular salvage
      agent.
- name: Stop Dexamethasone After Listeria Confirmation
  description: >-
    Empirical dexamethasone used for community-acquired bacterial meningitis is
    stopped once L. monocytogenes is identified, because outcome benefit in
    Listeria meningitis is unproven and MONALISA associated adjunctive
    dexamethasone with lower neurolisteriosis survival.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy Discontinuation
    term:
      id: NCIT:C128535
      label: Pharmacotherapy Discontinuation
    therapeutic_agent:
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  evidence:
  - reference: PMID:36472590
    reference_title: "Progress and Challenges in Bacterial Meningitis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Adjunctive dexamethasone should be used in patients with bacterial
      meningitis but stopped if Listeria monocytogenes is confirmed.
    explanation: >-
      Review guidance supports discontinuing empirical dexamethasone once the
      organism is confirmed to be L. monocytogenes.
  - reference: PMID:28139432
    reference_title: "Clinical features and prognostic factors of listeriosis: the MONALISA national prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found evidence of a significantly reduced survival in patients with
      neurolisteriosis treated with adjunctive dexamethasone
    explanation: >-
      MONALISA provides the organism-specific observational safety signal for
      avoiding continued adjunctive dexamethasone in neurolisteriosis.
animal_models:
- name: C57BL/6 intracisternal Listeria meningitis mouse
  species: Mouse
  publication: PMID:30193592
  description: >-
    Intracisternal injection of L. monocytogenes sequence type 1 or 6 into
    C57BL/6 mice induces listerial meningitis with meningeal infiltration,
    vascular inflammation, hemorrhage, ventriculitis, cytokine induction, and
    genotype-dependent brain injury.
  modeled_mechanisms:
  - target: Suppurative Listeria Meningoencephalitis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The model reproduces direct CNS Listeria infection and inflammatory brain
      injury while allowing comparison of different bacterial sequence types.
    limitations: >-
      Intracisternal inoculation bypasses natural foodborne intestinal
      translocation, bacteremia, and blood-brain-barrier invasion.
    evidence:
    - reference: PMID:30193592
      reference_title: Characterization of a Listeria monocytogenes meningitis mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Histopathology showed increased meningeal infiltration, vascular
        inflammation of meningeal vessels, hemorrhages, and ventriculitis.
      explanation: >-
        Defines the intracisternal mouse model by the CNS inflammatory and
        ventricular pathology it produces.
- name: Zebrafish Listeria-phagocyte live-imaging model
  species: Zebrafish
  publication: PMID:19546195
  description: >-
    Intravenous L. monocytogenes injection in transparent zebrafish larvae
    permits real-time imaging of macrophage uptake, listeriolysin-dependent
    cytosolic escape, and ActA-dependent actin-tail spread.
  modeled_mechanisms:
  - target: LLO Phagosomal Escape
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The model visualizes LLO-dependent escape from the macrophage phagosome in
      vivo and tests its requirement for virulence.
    limitations: >-
      Larval intravenous infection isolates phagocyte interactions rather than
      reproducing mammalian foodborne, placental, or BBB invasion anatomy.
    evidence:
    - reference: PMID:19546195
      reference_title: Real-time observation of listeria monocytogenes-phagocyte interactions in living zebrafish larvae.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        bacteria could escape the macrophage phagosome in a
        listeriolysin-dependent manner and accessed the cytosol; this event was
        critical for bacterial virulence
      explanation: >-
        Directly supports the zebrafish model as an in vivo LLO-escape system.
- name: Human E-cadherin transgenic intestinal invasion mouse
  species: Mouse
  publication: PMID:11387478
  description: >-
    Human E-cadherin transgenic mice restore the InlA-E-cadherin host-receptor
    interaction that wild-type mouse E-cadherin under-models, enabling tests of
    Listeria intestinal barrier crossing.
  modeled_mechanisms:
  - target: Internalin-Mediated Intestinal Entry
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Human E-cadherin expression resolves the species-specific InlA receptor
      mismatch for the intestinal entry step.
    limitations: >-
      The model is designed around the intestinal barrier and does not by
      itself recapitulate adult human neurolisteriosis risk factors.
    evidence:
    - reference: PMID:11387478
      reference_title: "A transgenic model for listeriosis: role of internalin in crossing the intestinal barrier."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In guinea pigs and transgenic mice expressing human E-cadherin,
        internalin was found to mediate invasion of enterocytes and crossing of
        the intestinal barrier.
      explanation: >-
        The model's own report establishes that internalin mediates enterocyte
        invasion and intestinal barrier crossing in this system.
    - reference: PMID:15060982
      reference_title: Exploitation of host cell cytoskeleton and signalling during Listeria monocytogenes entry into mammalian cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        species specificity has been discovered concerning the interaction
        between InlA and E-cadherin, leading to the generation of transgenic
        mice expressing the human E-cadherin
      explanation: >-
        Explains why human E-cadherin transgenic mice were needed to model the
        InlA-dependent intestinal invasion step.

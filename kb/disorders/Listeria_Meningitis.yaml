  evidence:
  - reference: PMID:28139432
    reference_title: "Clinical features and prognostic factors of listeriosis: the MONALISA national prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We enrolled 818 cases from 372 centres, including 107 maternal-neonatal

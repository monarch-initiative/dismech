  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: apoptotic cell clearance
    term:
      id: GO:0043277
      label: apoptotic cell clearance
    modifier: INCREASED
  cellular_components:
  - preferred_term: plasma membrane
    term:
      id: GO:0005886
      label: plasma membrane
  downstream:
  - target: Suppurative Listeria Meningoencephalitis
    causal_link_type: DIRECT
    description: >-
      Repeated intracellular spread and tissue invasion amplify local infection

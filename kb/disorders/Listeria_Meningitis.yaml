name: Listeria meningitis
creation_date: "2026-09-30T03:32:25Z"
description: >-
  Listeria meningitis is foodborne or maternal-neonatal bacterial meningitis
  caused by invasive Listeria monocytogenes, in which a facultative
  intracellular organism crosses intestinal, placental, or postnatal entry
  barriers, survives in phagocytes, disseminates in blood, invades the central
  nervous system, escapes phagosomes through listeriolysin O, spreads between
  host cells through ActA- and efferocytosis-linked mechanisms, and produces
  suppurative meningoencephalitis with characteristic brainstem involvement in
  a subset of patients.
category: Infectious Disease
disease_term:
  preferred_term: Listeria meningitis
  term:
    id: MONDO:0006836
    label: Listeria meningitis
parents:
- Bacterial meningitis
- Listeriosis
synonyms:
- listerial meningitis
- Listeria monocytogenes meningitis
- neurolisteriosis
- CNS listeriosis
notes: >-
  The Falcon deep-research request fell back to OpenScientist. All 43 reported
  references resolved successfully, but the term validator flagged one obsolete
  GO identifier and multiple report table labels that did not name their CURIEs
  correctly. This curation avoided the obsolete phagosome process lead
  GO:0090662, the report's misbound NCIT drug terms, and the pia-mater binding
  that the report labelled as leptomeninges.
review_notes: >-
  Deliberately scoped to CNS listeriosis. This child entry keeps the shared
  foodborne and facultative-intracellular mechanisms needed for brain invasion,
  then focuses the terminal compartment on meningitis and meningoencephalitis;
  the broader Listeriosis entry should continue to hold isolated bacteremia,
  pregnancy loss without neonatal CNS disease, and non-CNS manifestations.
infectious_agent:
- name: Listeria monocytogenes
  infectious_agent_term:
    preferred_term: Listeria monocytogenes
    term:
      id: NCBITaxon:1639
      label: Listeria monocytogenes
  description: >-
    Listeria monocytogenes is a Gram-positive, foodborne, facultative
    intracellular bacterium that causes invasive listeriosis, bacteremia,
    maternal-neonatal disease, and brainstem-predominant neurolisteriosis.
  evidence:
  - reference: PMID:23739339
    reference_title: "Vital signs: Listeria illnesses, deaths, and outbreaks--United States, 2009-2011."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Older adults, pregnant women, and persons with immunocompromising
      conditions are at higher risk than others for invasive Listeria
      monocytogenes infection (listeriosis), a rare and preventable foodborne
      illness that can cause bacteremia, meningitis, fetal loss, and death.
    explanation: >-
      Establishes L. monocytogenes as a foodborne invasive pathogen that causes
      meningitis and concentrates in vulnerable host groups.
agent_life_cycle:
  description: >-
    L. monocytogenes persists in environmental and food-processing reservoirs,
    reaches humans through contaminated food, crosses the gut to cause
    bacteremia, and can then seed placenta, neonates, or the central nervous
    system; neonatal meningitis may be vertically acquired or postnatal and
    often nosocomial.
  hosts:
  - preferred_term: Homo sapiens
    role: clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: Bos taurus
    role: ruminant neurolisteriosis host
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  evidence:
  - reference: PMID:40192846
    reference_title: Identification and characterization of Listeria monocytogenes and Listeria innocua in bovine listeriosis cases in Uruguay.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Histopathological examination of neurolisteriosis cases revealed
      suppurative meningoencephalitis with brainstem microabscesses.
    explanation: >-
      Bovine natural disease demonstrates the ruminant neurolisteriosis host
      branch that parallels human brainstem-predominant disease.
  - reference: PMID:419368
    reference_title: Epidemiology of listeriosis in Sweden 1958--1974.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neonates with early onset of disease were infected by their mothers, while
      neonates with late onset of disease were infected from other and often
      nosocomial sources.
    explanation: >-
      Separates vertical maternal infection from later postnatal or nosocomial
      neonatal exposure.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Foodborne Listeria acquisition
  description: >-
    Humans ingest L. monocytogenes in contaminated ready-to-eat foods or
    unprocessed dairy before intestinal translocation and bacteremia seed the
    CNS in susceptible adults or the placenta and neonate in pregnancy.
  evidence:
  - reference: PMID:40887071
    reference_title: Invasive Neonatal Listeriosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pregnant persons can acquire this foodborne pathogen from deli meats and
      unprocessed cheese, placing their neonate at risk.
    explanation: >-
      Supports contaminated deli meat and unprocessed cheese as maternal
      foodborne vehicles that can endanger neonates.
- name: Vertical or nosocomial neonatal Listeria exposure
  description: >-
    Early-onset neonatal infection follows maternal-fetal spread, whereas
    late-onset neonatal meningoencephalitis can follow nonmaternal,
    healthcare-associated postnatal exposure.
  evidence:
  - reference: PMID:419368
    reference_title: Epidemiology of listeriosis in Sweden 1958--1974.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neonates with early onset of disease were infected by their mothers, while
      neonates with late onset of disease were infected from other and often
      nosocomial sources.
    explanation: >-
      Supports both vertical and postnatal nosocomial neonatal acquisition
      branches.
environmental:

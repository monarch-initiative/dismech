  evidence:
  - reference: PMID:40887071
    reference_title: Invasive Neonatal Listeriosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pregnant persons can acquire this foodborne pathogen from deli meats and

    reference_title: "Imaging of Human Neurolisteriosis: A Prospective Study of 71 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Main neuroradiological images were meningeal enhancement (25/71, 35%),
      abscess(es), or nodular image(s) evocative of abscess (10/71, 14%),

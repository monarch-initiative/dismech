  evidence:
  - reference: PMID:19546195
    reference_title: Real-time observation of listeria monocytogenes-phagocyte interactions in living zebrafish larvae.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      bacteria could escape the macrophage phagosome in a
      listeriolysin-dependent manner and accessed the cytosol; this event was

  description: >-
    Contaminated ready-to-eat food, including processed meats or unprocessed
    dairy products that can carry L. monocytogenes, delivers the inoculum that
    initiates invasive listeriosis.
  exposure_term:
    preferred_term: exposure to processed meat food product via ingestion
    term:
      id: ECTO:0070084
      label: exposure to processed meat food product via ingestion
  effect: Establishes the intestinal inoculum upstream of bacteremia and CNS invasion.
  influences_mechanisms:

  evidence:
  - reference: PMID:40887071
    reference_title: Invasive Neonatal Listeriosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pregnant persons can acquire this foodborne pathogen from deli meats and
      unprocessed cheese, placing their neonate at risk.
    explanation: >-
      Names representative food vehicles for the upstream exposure branch of
      maternal and neonatal invasive listeriosis.
pathophysiology:
- name: Foodborne Listeria Ingestion
  role: trigger
  description: >-
    A susceptible host ingests contaminated ready-to-eat food or unprocessed
    dairy carrying viable L. monocytogenes.
  biological_scale: ORGANISM
  downstream:
  - target: Internalin-Mediated Barrier Invasion
    causal_link_type: DIRECT
    description: >-
      Organisms delivered to the gut use internalins to enter host cells and
      cross the intestinal epithelium.
  evidence:
  - reference: PMID:23739339
    reference_title: "Vital signs: Listeria illnesses, deaths, and outbreaks--United States, 2009-2011."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      listeriosis), a rare and preventable foodborne illness that can cause
      bacteremia, meningitis, fetal loss, and death.
    explanation: >-
      Places foodborne exposure upstream of invasive meningitis, bacteremia, and
      maternal-fetal listeriosis.
- name: Internalin-Mediated Barrier Invasion
  description: >-
    InlA and InlB on the bacterial surface engage host E-cadherin and MET
    family receptors, reorganizing the actin cortex to promote uptake across
    intestinal epithelium and brain endothelial cells.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
    modifier: INCREASED
  locations:
  - preferred_term: blood-brain barrier
    term:
      id: UBERON:0000120
      label: blood brain barrier
  downstream:
  - target: Intracellular Listeria Bacteremia
    causal_link_type: DIRECT
    description: >-
      Barrier entry lets Listeria survive in phagocytes and spread through the
      bloodstream.
  - target: Placental and Neonatal Listeria Seeding
    causal_link_type: DIRECT
    description: >-
      InlA/InlB-associated barrier crossing can also seed the placenta and
      fetus during maternal invasive listeriosis.
  evidence:
  - reference: PMID:30117097
    reference_title: "Mechanisms of Blood Brain Barrier Disruption by Different Types of Bacteria, and Bacterial-Host Interactions Facilitate the Bacterial Pathogen Invading the Brain."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Internalins (InlA and InlB) of Listeria monocytogenes interact with its
      cellular receptors E-cadherin and mesenchymal-epithelial transition (MET)
      to facilitate invading the brain.
    explanation: >-
      Supports internalin-receptor interactions as Listeria's brain-invasion
      mechanism.
  - reference: PMID:15060982
    reference_title: Exploitation of host cell cytoskeleton and signalling during Listeria monocytogenes entry into mammalian cells.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      InlA interacts with the adhesion molecule E-cadherin, while InlB
      interacts with the receptor for the globular head of the complement
      factor C1q (gC1q-R), with the hepatocyte growth factor receptor (c-Met)
      and with glycosaminoglycans
    explanation: >-
      Identifies the principal host receptors used by InlA and InlB during host
      cell entry.
- name: Placental and Neonatal Listeria Seeding
  description: >-
    Maternal bacteremia can cross the placenta to infect the fetus, and
    postnatal exposure can seed late neonatal meningoencephalitis.
  biological_scale: ORGANISM
  locations:
  - preferred_term: placenta
    term:
      id: UBERON:0001987
      label: placenta
  downstream:
  - target: Intracellular Listeria Bacteremia
    causal_link_type: DIRECT
    description: >-
      Neonatal infection may progress through sepsis and bloodstream spread
      before meningeal invasion.
  evidence:
  - reference: PMID:419368
    reference_title: Epidemiology of listeriosis in Sweden 1958--1974.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Out of 37 neonates born alive, 22 had "early disease", mostly
      granulomatosis infantiseptica, and 8 had "late disease" with
      meningoencephalitis.
    explanation: >-
      Supports the neonatal branch and distinguishes early disseminated disease
      from later neonatal CNS disease.
- name: Intracellular Listeria Bacteremia
  description: >-
    L. monocytogenes survives within monocytes, macrophages, or neutrophils
    during bacteremia, a cell-associated state that helps distribute the
    organism toward privileged compartments.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: CNS Listeria Seeding
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Bloodborne bacteria reach central nervous system barriers either through
      endothelial invasion or through infected leukocytes.
  evidence:
  - reference: PMID:40067021
    reference_title: Intravacuolar persistence in neutrophils facilitates Listeria monocytogenes spread to co-cultured cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Therefore, we identify PMNs as a mobile niche for Lm survival and provide
      evidence that PMNs harbor VBNC bacteria, potentially facilitating Lm
      dissemination within the host.
    explanation: >-
      Ex vivo bovine neutrophil work supports a plausible leukocyte-associated
      dissemination niche for Listeria.
- name: CNS Listeria Seeding
  description: >-
    Bacteremic L. monocytogenes crosses into the CNS across brain endothelium
    and establishes infection near the meninges and brainstem.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  locations:
  - preferred_term: blood-brain barrier
    term:
      id: UBERON:0000120
      label: blood brain barrier
  - preferred_term: meninx
    term:
      id: UBERON:0002360
      label: meninx
  downstream:
  - target: LLO Phagosomal Escape
    causal_link_type: DIRECT
    description: >-
      Organisms internalized in CNS myeloid or barrier cells must leave the
      phagocytic vesicle to complete the intracellular life cycle.
  evidence:
  - reference: PMID:28139432
    reference_title: "Clinical features and prognostic factors of listeriosis: the MONALISA national prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We enrolled 818 cases from 372 centres, including 107 maternal-neonatal
      infections, 427 cases of bacteraemia, and 252 cases of neurolisteriosis.
    explanation: >-
      The MONALISA cohort establishes neurolisteriosis as a recognized invasive
      compartment after bacteremic and maternal-neonatal disease.
- name: LLO Phagosomal Escape
  description: >-
    Listeriolysin O disrupts the phagocytic vesicle, allowing internalized
    L. monocytogenes to leave the phagosome and replicate in host-cell cytosol.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: symbiont-mediated disruption of host phagosome
    term:
      id: GO:0141160
      label: symbiont-mediated disruption of host phagosome
    modifier: INCREASED
  cellular_components:
  - preferred_term: phagocytic vesicle
    term:
      id: GO:0045335
      label: phagocytic vesicle
  - preferred_term: cytosol
    term:
      id: GO:0005829
      label: cytosol
  downstream:
  - target: ActA and Efferocytosis-Linked Cell-to-Cell Spread
    causal_link_type: DIRECT
    description: >-
      Cytosolic bacteria polymerize host actin and push into neighboring cells
      without requiring extracellular exposure.
  evidence:
  - reference: PMID:19546195
    reference_title: Real-time observation of listeria monocytogenes-phagocyte interactions in living zebrafish larvae.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      bacteria could escape the macrophage phagosome in a
      listeriolysin-dependent manner and accessed the cytosol; this event was
      critical for bacterial virulence
    explanation: >-
      Zebrafish larvae show that listeriolysin-dependent phagosomal escape
      drives access to the cytosol and virulence in vivo.
- name: ActA and Efferocytosis-Linked Cell-to-Cell Spread
  description: >-
    ActA-dependent actin comet tails drive Listeria protrusions at the host
    plasma membrane, and LLO-damaged protrusions can be released as
    phosphatidylserine-exposing vesicles that exploit efferocytosis receptors
    on neighboring cells.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: apoptotic cell clearance
    term:
      id: GO:0043277
      label: apoptotic cell clearance
    modifier: INCREASED
  cellular_components:
  - preferred_term: plasma membrane
    term:
      id: GO:0005886
      label: plasma membrane
  downstream:
  - target: Suppurative Listeria Meningoencephalitis
    causal_link_type: DIRECT
    description: >-
      Repeated intracellular spread and tissue invasion amplify local infection
      in the meninges and adjacent brain parenchyma.
  evidence:
  - reference: PMID:19546195
    reference_title: Real-time observation of listeria monocytogenes-phagocyte interactions in living zebrafish larvae.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Actin comet tails and protrusions were observed, suggesting cell-to-cell
      spread; these phenomena also played a role in virulence in zebrafish
      larvae, as actA-deficient bacteria were attenuated.
    explanation: >-
      Supports the ActA-linked actin-protrusion arm of Listeria virulence.
  - reference: PMID:24739967
    reference_title: Listeria monocytogenes exploits efferocytosis to promote cell-to-cell spread.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      L. monocytogenes promotes its dissemination in a host by exploiting
      efferocytosis.
    explanation: >-
      Places efferocytosis downstream of LLO-damaged protrusion release as a
      mechanism of host-cell-to-host-cell dissemination.
- name: Suppurative Listeria Meningoencephalitis
  description: >-
    Intracellular spread in the CNS produces meningeal inflammation,
    meningoencephalitis, ventriculitis, abscesses, hemorrhage, hydrocephalus,
    and a brainstem-predominant rhombencephalitis pattern in some cases.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  - preferred_term: pons
    term:
      id: UBERON:0000988
      label: pons
  - preferred_term: medulla oblongata
    term:
      id: UBERON:0001896
      label: medulla oblongata
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:28139432
    reference_title: "Clinical features and prognostic factors of listeriosis: the MONALISA national prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurolisteriosis presented as meningoencephalitis in 212 (84%) of 252
      patients; brainstem involvement was only reported in 42 (17%) of 252
      patients.
    explanation: >-
      Quantifies the meningoencephalitis and brainstem-involvement pattern in a
      prospective national neurolisteriosis cohort.
  - reference: PMID:29796652
    reference_title: "Imaging of Human Neurolisteriosis: A Prospective Study of 71 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Main neuroradiological images were meningeal enhancement (25/71, 35%),
      abscess(es), or nodular image(s) evocative of abscess (10/71, 14%),
      hemorrhages (11/71, 15%), contrast-enhancing ventricles, or hydrocephalus
      (7/71, 10%).
    explanation: >-
      Defines the principal MRI and CT injury patterns seen in proven
      neurolisteriosis.
phenotypes:
- name: Infectious encephalitis
  description: Meningoencephalitis is the dominant clinical presentation among neurolisteriosis cases.

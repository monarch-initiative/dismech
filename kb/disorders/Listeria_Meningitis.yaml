    reference_title: Listeria monocytogenes exploits efferocytosis to promote cell-to-cell spread.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      L. monocytogenes promotes its dissemination in a host by exploiting
      efferocytosis.
    explanation: >-
      Places efferocytosis downstream of LLO-damaged protrusion release as a
      mechanism of host-cell-to-host-cell dissemination.
- name: Suppurative Listeria Meningoencephalitis
  description: >-
    Intracellular spread in the CNS produces suppurative inflammation of the
    meninges and adjacent brain parenchyma, with a predilection for the
    brainstem and cerebellum. Its downstream clinical consequences -
    meningoencephalitis, hydrocephalus and the rhombencephalitis pattern - are
    modelled as phenotypes rather than folded into this node.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  - preferred_term: pons
    term:
      id: UBERON:0000988
      label: pons
  - preferred_term: medulla oblongata
    term:
      id: UBERON:0001896
      label: medulla oblongata
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  downstream:
  - target: Infectious encephalitis
    causal_link_type: DIRECT
    description: >-
      Suppurative inflammation of the meninges and adjacent parenchyma is what
      presents clinically as meningoencephalitis, the dominant form of
      neurolisteriosis.
    evidence:
    - reference: PMID:28139432
      reference_title: "Clinical features and prognostic factors of listeriosis: the MONALISA national prospective cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Neurolisteriosis presented as meningoencephalitis in 212 (84%) of 252
        patients; brainstem involvement was only reported in 42 (17%) of 252
        patients.
      explanation: >-

notes: >-
  Phenotypic frequencies, penetrance, and genotype-specific prognosis cannot be estimated reliably from the
  small number of reported families. Growth/hematologic and neurologic presentations overlap and are not established
  separate molecular subtypes. Chromosome breakage does not imply a confirmed Fanconi-anemia complementation
  disorder or an established malignancy predisposition. General nuclear-encoded Leigh syndrome guidance informs
  supportive care; phenotype frequencies and treatments for other Leigh syndrome genes should not be attributed
  to COX4I1.
diagnosis:
- name: Molecular diagnosis and segregation
  diagnosis_term:
    preferred_term: DNA Sequencing
    term:
      id: NCIT:C153598
      label: DNA Sequencing
  description: >-
    Identify biallelic causative COX4I1 alleles by exome/genome or a suitable panel, and test parents. Apparent
    homozygosity inconsistent with segregation warrants deletion analysis. A single identified allele can require
    RNA studies and intronic sequencing; long reads can resolve phase.
  evidence:
  - reference: url:https://scholarworks.indianapolis.iu.edu/bitstreams/b9b37f63-6e5e-4563-b086-880db5d3d66b/download

    reference_title: Replicative Stress Coincides with Impaired Nuclear DNA Damage Response in COX4-1 Deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: detecting a 28% significant decrease in the HR efficiency compared to the control.
    explanation: >-
      The homologous-recombination reporter was measured in COX4I1-silenced HEK293 cells, not directly in patient
      fibroblasts.
  biological_scale: MOLECULAR
  biological_processes:

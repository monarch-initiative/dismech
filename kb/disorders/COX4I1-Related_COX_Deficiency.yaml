pathophysiology:
- name: Aberrant COX4I1 Splicing
  description: >-
    The deep-intronic c.73+1511A>G variant activates cryptic splicing. Patient transcripts retain 82 intronic
    bases while losing the first two bases of exon 3, predicting p.Glu25ValfsTer9. Residual correctly processed
    transcripts indicate leaky splicing. Splicing was only hypothesized, not demonstrated, for the founding
    complex substitution.
  evidence:
  - reference: url:https://dsp.tecnalia.com/bitstreams/4bea0297-ccd2-4fa4-ab62-4d8e45d99b07/download
    reference_title: https://dsp.tecnalia.com/bitstreams/4bea0297-ccd2-4fa4-ab62-4d8e45d99b07/download
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the c.73 + 1511A > G variant promotes the aberrant incorporation of an intronic sequence into COX4I1 mRNA.
    explanation: Patient RNA and a HAP1 minigene assay support cryptic splice activation.

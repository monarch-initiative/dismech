- name: Seizure management
  description: >-
    An experienced neurologist should individualize antiseizure treatment. ACTH, topiramate, valproate, zonisamide,
    levetiracetam and clonazepam have been used in reported cases, with refractory seizures in the deletion/missense
    case. Historical valproate use is not a recommendation: general mitochondrial guidance advises avoiding
    it if possible; the absolute POLG contraindication should not be misattributed to COX4I1.
  treatment_term:
    preferred_term: Anticonvulsant Therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy

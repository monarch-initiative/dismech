- name: COX4I1 Protein Deficiency
  description: >-
    Biallelic variants reduce functional COX4-1. Protein was undetectable in the founding fibroblasts and substantially
    reduced, with residual protein, in the later nonsense/intronic case. A deletion of one COX4I1 allele can
    contribute when a pathogenic variant affects the other allele.
  evidence:
  - reference: PMID:28766551
    reference_title: >-
      Mutation in the COX4I1 gene is associated with short stature, poor weight gain and increased chromosomal
      breaks, simulating Fanconi anemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Western blot analysis revealed undetectable COX 4 protein while complexes I and II were comparable to controls
    explanation: Patient fibroblast immunoblotting demonstrates loss of detectable COX4 protein.
  - reference: url:https://dsp.tecnalia.com/bitstreams/4bea0297-ccd2-4fa4-ab62-4d8e45d99b07/download

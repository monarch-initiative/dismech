  description: >-
    Double-stranded DNA breaks occur in COX4I1-deficient cultures and are enriched in proliferating cells.
    Experiments in COX-inhibited control fibroblasts found damage despite normal ROS and ATP, arguing against
    a solely oxidative-stress explanation. An NAD+ deficit is proposed, not established as the intermediate.

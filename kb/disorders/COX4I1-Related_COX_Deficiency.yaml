name: COX4I1-Related COX Deficiency
category: Mendelian
creation_date: '2026-06-19T00:00:00Z'
synonyms:
- COX4I1 deficiency
- Mitochondrial complex IV deficiency, nuclear type 16
- MC4DN16
- COX4I1-related cytochrome c oxidase deficiency
- Cytochrome c oxidase subunit 4 isoform 1 deficiency
description: >-
  COX4I1-related mitochondrial complex IV deficiency is an autosomal recessive disorder caused by biallelic
  COX4I1 variants. Reduced abundance or function of the COX4-1 structural and regulatory subunit impairs complex
  IV assembly and respiratory-chain function. Presentations range from severe growth failure with chromosome
  breakage and mild hematologic abnormalities to infantile encephalopathy with regression and epilepsy, or
  later progressive spastic-dystonic motor and cognitive impairment with Leigh-like basal ganglia lesions.
  Normal lactate, normal chromosome-breakage studies, or initially normal development do not exclude the disorder.
  Nuclear DNA-repair defects and replication-associated DNA damage have been demonstrated in cell models; excess
  reactive oxygen species alone does not explain this branch of the disease mechanism.

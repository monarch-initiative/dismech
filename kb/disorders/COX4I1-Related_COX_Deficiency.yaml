    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous c.454C>A (p.P152T) variant in COX4I1 was detected by trio exome sequencing in Patient 1
      and confirmed by familial mutation testing in Patient 2.
    explanation: The two siblings carried the same homozygous missense allele.
  - reference: PMID:40095452
    reference_title: >-
      Compound heterozygosity of a De novo 16q24.1 deletion and missense mutation in COX4I1 leads to developmental
      regression, intellectual disability, and seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The analysis revealed that the patient harbors a heterozygous deletion of approximately 0.13 Mb (chr16:85706011–85 840 495)
      in the 16q24.1 region, encompassing eight genes, including COX4I1
    explanation: The deletion includes COX4I1 and additional genes; it is not a demonstrated isolated regulatory lesion.
  - reference: url:https://dsp.tecnalia.com/bitstreams/4bea0297-ccd2-4fa4-ab62-4d8e45d99b07/download

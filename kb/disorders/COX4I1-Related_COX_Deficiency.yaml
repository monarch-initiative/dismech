- name: Impaired Nuclear DNA Repair
  description: >-
    Patient fibroblasts and COX4I1-knockdown HFF cells recover poorly from etoposide-induced DNA damage and
    have reduced expression of DNA-repair genes. A separate HEK293 knockdown reporter showed reduced homologous
    recombination. The molecular link between COX4-1 and nuclear repair is unresolved.
  evidence:
  - reference: PMID:35456968
    reference_title: Replicative Stress Coincides with Impaired Nuclear DNA Damage Response in COX4-1 Deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: both HFF-shCOX4I1 and the patient’s cells displayed a significant prolongation of the γH2AX foci signal
    explanation: Persistent damage after etoposide recovery supports impaired nuclear DNA-damage repair.

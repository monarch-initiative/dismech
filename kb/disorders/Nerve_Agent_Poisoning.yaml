biochemical:
- name: Blood cholinesterase activity
  presence: DECREASED
  notes: >-
    Reduced blood (plasma/erythrocyte) cholinesterase activity is the biochemical
    signature of nerve agent exposure. It is the diagnostic and therapeutic-
    monitoring assay for the disease: depression tracks acute severity, the value
    recovers with treatment and time, and the cholinesterase status guides oxime
    therapy.
  evidence:
  - reference: PMID:21783510
    reference_title: "Acute and chronic effects of sarin exposure from the Tokyo subway incident."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Reduction in plasma cholinesterase (ChE) activity was generally associated with the severity of acute signs of toxicity."
    explanation: In Tokyo subway sarin victims, lower plasma cholinesterase activity tracked with greater acute toxicity severity.
  - reference: PMID:21783510
    reference_title: "Acute and chronic effects of sarin exposure from the Tokyo subway incident."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "With time and treatment, the value rose quickly."
    explanation: Cholinesterase activity recovers with treatment and time, supporting its use for monitoring.
  - reference: PMID:32198755
    reference_title: "Diagnostics and treatment of nerve agent poisoning-current status and future developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Therapeutic guidance concerning the duration and success of the current oxime therapy via determination of the cholinesterase status can contribute to an optimal use of resources."
    explanation: Cholinesterase status guides oxime therapy duration and success.

  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Occurrence is incident-based rather than endemic, so no population rate is
    defensible. The 1995 Tokyo subway sarin attack brought 640 patients to a
    single hospital on the day of the attack; other mass-exposure events include
    Matsumoto (1994), Halabja (1988) and Ghouta/Syria (2013).
  evidence:
  - reference: PMID:21783510
    reference_title: "Acute and chronic effects of sarin exposure from the Tokyo subway incident."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "The St. Luke's International Hospital received 640 patients on the day of the attack."
    explanation: Documents the incident-based case count from the Tokyo subway sarin attack.
progression:
- phase: Acute cholinergic crisis
  age_range: Minutes to hours after exposure
  notes: >-
    Onset is within seconds to minutes after vapour exposure and can be delayed
    after dermal exposure. The cholinergic crisis (muscarinic, nicotinic and
    central overstimulation) evolves rapidly, and death in this phase is
    principally from respiratory failure. Surviving the first minutes of a vapour
    attack strongly predicts survival.
  evidence:
  - reference: PMID:16945386
    reference_title: "The acute treatment of nerve agent exposure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "If victims can survive the first 15 to 20 min of a vapor attack, they will likely live."
    explanation: Characterises the tempo and survivability of the acute phase.
- phase: Long-term neuropsychiatric sequelae
  age_range: Months to years after exposure
  notes: >-
    Survivors, particularly after status epilepticus, can be left with persistent
    neurologic, cognitive and behavioural deficits and structural brain changes.
    One year after the Tokyo subway attack, 45% of responding survivors still
    reported symptoms.
  evidence:
  - reference: PMID:21783510
    reference_title: "Acute and chronic effects of sarin exposure from the Tokyo subway incident."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "of 303 respondents, 45% still had some symptoms including eye problems, easy fatigability, headache, and fear."
    explanation: Documents persistent symptoms one year after acute sarin exposure.
  - reference: PMID:30159887
    reference_title: "Acute and long-term consequences of exposure to organophosphate nerve agents in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Recent studies document long-term neurologic and behavior deficits, and technological advances demonstrate structural brain changes on magnetic resonance imaging."
    explanation: Documents long-term neurologic/behavioural deficits and structural brain changes.
treatments:
- name: Atropine
  description: >-
    Competitive muscarinic antagonist that reverses the muscarinic
    (secretory/bronchospastic) effects; titrated to drying of secretions.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atropine
      term:
        id: CHEBI:16684
        label: atropine
  target_mechanisms:
  - target: Muscarinic Receptor Overstimulation
  evidence:
  - reference: PMID:30159887
    reference_title: "Acute and long-term consequences of exposure to organophosphate nerve agents in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Standard-of-care treatment for OP nerve agent acute exposure includes atropine, a muscarinic antagonist, pralidoxime (2-PAM), an oxime that regenerates acetycholinesterase activity in those molecules that are not aged, and diazepam, a benzodiazepine to stop/attenuate seizures."
    explanation: Atropine is the standard-of-care muscarinic antagonist for nerve agent poisoning.
- name: Oxime reactivator (pralidoxime)
  description: >-
    Reactivates inhibited acetylcholinesterase by displacing the nerve agent
    from the catalytic serine; effective only in enzyme molecules that have not
    yet aged.
  therapeutic_modality: SMALL_MOLECULE
  notes: >-
    The therapeutic window closes as the inhibited enzyme ages at an
    agent-specific rate; once aging is complete, oxime reactivation is
    ineffective.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pralidoxime
      term:
        id: CHEBI:8354
        label: pralidoxime
  target_mechanisms:
  - target: Acetylcholinesterase Inhibition
  evidence:
  - reference: PMID:18555982
    reference_title: "Comparison of oxime reactivation and aging of nerve agent-inhibited monkey and human acetylcholinesterases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "the efficacy of an oxime primarily depends on its ability to reactivate nerve agent-inhibited acetylcholinesterase (AChE)"
    explanation: Oxime benefit depends on reactivating inhibited AChE, the mechanism this treatment targets.
  - reference: PMID:30159887
    reference_title: "Acute and long-term consequences of exposure to organophosphate nerve agents in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "pralidoxime (2-PAM), an oxime that regenerates acetycholinesterase activity in those molecules that are not aged"
    explanation: Pralidoxime regenerates AChE but only before the adduct ages.
- name: Benzodiazepine
  description: >-
    First-line anticonvulsant for nerve-agent seizures and status epilepticus;
    by stopping seizures it also limits the glutamatergic excitotoxicity that
    drives neuropathology. Efficacy declines the longer administration is delayed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazepam
      term:
        id: CHEBI:49575
        label: diazepam
  target_mechanisms:
  - target: Central Cholinergic Overstimulation
  - target: Glutamatergic Excitotoxicity
  evidence:
  - reference: PMID:30159887
    reference_title: "Acute and long-term consequences of exposure to organophosphate nerve agents in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Anticonvulsants such as benzodiazepines decrease seizure activity and improve outcome, but their efficacy depends upon the administration time after exposure to the nerve agent."
    explanation: Benzodiazepines control nerve-agent seizures, with time-dependent efficacy.
- name: Decontamination and supportive care
  description: >-
    Removal from source, skin/clothing and ocular decontamination, airway
    management and mechanical ventilation.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Respiratory failure
  evidence:
  - reference: PMID:16168308
    reference_title: "Organic phosphorus compounds--nerve agents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Treatment includes early airway and ventilatory support as well as antidotal therapy with atropine, pralidoxime, and diazepam."
    explanation: Airway and ventilatory support underpin management of respiratory failure.
  - reference: PMID:15979676
    reference_title: "The Tokyo subway sarin attack--lessons learned."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Preparation for a large-scale chemical attack by terrorists requires the prior establishment of a detailed decontamination plan"
    explanation: Decontamination planning is a core response to mass nerve agent exposure.
differential_diagnoses:
- name: Organophosphate (pesticide) poisoning
  disease_term:
    preferred_term: organophosphate poisoning
    term:
      id: MONDO:0800386
      label: organophosphate poisoning
  distinguishing_features:
  - >-
    Both are organophosphorus poisonings acting by acetylcholinesterase
    inhibition and share the cholinergic toxidrome, so they are not distinguished
    by a different mechanism. What separates them is pharmacodynamic: nerve agents
    are military-grade compounds of far greater potency, and their inhibited
    enzyme can age to an oxime-refractory state that collapses the therapeutic
    window for reactivators. The sibling entry Organophosphate_Poisoning models
    insecticidal organophosphorus poisoning, which already represents nerve-agent
    exposure as one environmental route into the same pathway; whether these
    should remain separate Disease entries, become a has_subtypes stratum, or be
    joined by a covering Grouping is a scope decision for a maintainer.
  evidence:
  - reference: PMID:16168308
    reference_title: "Organic phosphorus compounds--nerve agents."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The organic phosphorous compounds (OPC) include both the military grade nerve agents and the organic phosphorous pesticides."
    explanation: Nerve agents and organophosphate pesticides are the two members of the same organophosphorus class, differing as military-grade versus agricultural agents.
  - reference: PMID:30159887
    reference_title: "Acute and long-term consequences of exposure to organophosphate nerve agents in humans."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Nerve agents are organophosphate (OP) compounds and among the most powerful poisons known to man."
    explanation: Supports the far greater potency of nerve agents relative to agricultural organophosphates.
  - reference: PMID:16945386
    reference_title: "The acute treatment of nerve agent exposure."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Oximes like pralidoxime salvage acetylcholine esterase by \"prying off\" NA, provided the attachment has not \"aged\" to an irreversible bond."
    explanation: Supports the aging-dependent collapse of the oxime window as the pharmacodynamic distinction.

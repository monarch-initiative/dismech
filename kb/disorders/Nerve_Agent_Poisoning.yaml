name: Nerve Agent Poisoning
creation_date: "2026-10-03T00:00:00Z"
category: Environmental
synonyms:
- nerve gas poisoning
- organophosphorus nerve agent poisoning
- chemical warfare nerve agent toxicity
disease_term:
  preferred_term: nerve agent poisoning
  term:
    id: MONDO:0100331
    label: nerve agent poisoning
parents:
- poisoning
pathophysiology:
- name: Acetylcholinesterase Inhibition
  biological_scale: MOLECULAR
  description: >-
    Organophosphorus nerve agents (sarin, soman, tabun, cyclosarin, VX and the
    Novichok agents) are extremely potent inhibitors of acetylcholinesterase
    (AChE). They phosphylate the catalytic serine of the enzyme, abolishing its
    ability to hydrolyse acetylcholine throughout the central and peripheral
    nervous systems.
  biological_processes:
  - preferred_term: acetylcholine catabolic process
    modifier: DECREASED
    term:
      id: GO:0006581
      label: acetylcholine catabolic process
  evidence:
  - reference: PMID:30159887
    reference_title: "Acute and long-term consequences of exposure to organophosphate nerve agents in humans."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The major mechanism of acute toxicity is the irreversible inhibition of acetylcholinesterase."
    explanation: Identifies AChE inhibition as the primary mechanism of acute nerve agent toxicity.
  - reference: PMID:16168308
    reference_title: "Organic phosphorus compounds--nerve agents."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The major mechanism of OPC toxicity is through inhibition of acetylcholinesterase in neuronal synapses leading to excess acetylcholine and overstimulation of target organs."
    explanation: States the AChE-inhibition mechanism shared by the organophosphorus nerve agents.
  - reference: PMID:21783510
    reference_title: "Acute and chronic effects of sarin exposure from the Tokyo subway incident."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Reduction in plasma cholinesterase (ChE) activity was generally associated with the severity of acute signs of toxicity."
    explanation: In Tokyo subway sarin victims, lower plasma cholinesterase activity tracked with greater toxicity severity — a human surrogate for synaptic AChE inhibition.
  downstream:
  - target: Aging of the Nerve Agent-AChE Adduct
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30159887
      reference_title: "Acute and long-term consequences of exposure to organophosphate nerve agents in humans."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: "over time the covalent bond between the active site and the OP nerve agent stabilizes by removal of an alkyl group"
      explanation: The inhibited enzyme progresses to the aged adduct over time.
  - target: Synaptic Acetylcholine Accumulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30159887
      reference_title: "Acute and long-term consequences of exposure to organophosphate nerve agents in humans."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: "Acetylcholinesterase inhibition results in the accumulation of excessive acetylcholine levels in synapses"
      explanation: AChE inhibition directly causes synaptic acetylcholine to accumulate.
- name: Aging of the Nerve Agent-AChE Adduct
  biological_scale: MOLECULAR
  description: >-
    The phosphylated enzyme loses an alkyl group ("aging"), converting the
    inhibited AChE into an oxime-refractory form and making the inhibition
    permanent. Aging half-times are agent-specific and are especially short for
    soman, which is the central feature distinguishing nerve agents from most
    insecticidal organophosphates and the reason oxime reactivators must be
    given before the adduct ages.
  evidence:
  - reference: PMID:30159887
    reference_title: "Acute and long-term consequences of exposure to organophosphate nerve agents in humans."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "the covalent bond between the active site and the OP nerve agent stabilizes by removal of an alkyl group, a process called aging"
    explanation: Describes the dealkylation that renders AChE inhibition irreversible.
  - reference: PMID:18555982
    reference_title: "Comparison of oxime reactivation and aging of nerve agent-inhibited monkey and human acetylcholinesterases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Aging rate constants of GF-, GD-, and VR-inhibited monkey AChEs were very similar to human AChE"
    explanation: Measures aging rate constants for soman (GD) and other nerve-agent-inhibited AChE, establishing aging as a quantifiable process.
  downstream:
  - target: Synaptic Acetylcholine Accumulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Synaptic Acetylcholine Accumulation
  biological_scale: CELLULAR
  description: >-
    With AChE inactivated, acetylcholine accumulates at muscarinic and nicotinic
    synapses throughout the peripheral and central nervous systems, producing
    sustained cholinergic receptor overstimulation.
  chemical_entities:
  - preferred_term: acetylcholine
    modifier: INCREASED
    term:
      id: CHEBI:15355
      label: acetylcholine
  evidence:
  - reference: PMID:30159887
    reference_title: "Acute and long-term consequences of exposure to organophosphate nerve agents in humans."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Acetylcholinesterase inhibition results in the accumulation of excessive acetylcholine levels in synapses, leading to progression of toxic signs including hypersecretions, tremors, status epilepticus, respiratory distress, and death."
    explanation: Synaptic acetylcholine accumulation is the step driving the downstream toxidrome.
  downstream:
  - target: Muscarinic Receptor Overstimulation
    causal_link_type: DIRECT
  - target: Nicotinic Receptor Overstimulation
    causal_link_type: DIRECT
  - target: Central Cholinergic Overstimulation
    causal_link_type: DIRECT
- name: Muscarinic Receptor Overstimulation
  biological_scale: ORGANISM
  description: >-
    Excess acetylcholine at peripheral muscarinic receptors drives glandular
    hypersecretion and smooth-muscle effects: miosis, lacrimation, salivation,
    bronchorrhoea, bronchoconstriction, vomiting and diarrhoea.
  evidence:
  - reference: PMID:16168308
    reference_title: "Organic phosphorus compounds--nerve agents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Muscarinic symptoms may include diarrhea, urination, bronchospasm, bronchorrhea, emesis, and salivation."
    explanation: Enumerates the muscarinic toxidrome produced by cholinergic overstimulation.
  downstream:
  - target: Miosis
    causal_link_type: DIRECT
  - target: Hypersalivation
    causal_link_type: DIRECT
  - target: Diarrhea
    causal_link_type: DIRECT
  - target: Vomiting
    causal_link_type: DIRECT
  - target: Respiratory Failure
    causal_link_type: DIRECT
- name: Nicotinic Receptor Overstimulation
  biological_scale: ORGANISM
  description: >-
    Acetylcholine excess at nicotinic receptors of the neuromuscular junction
    first causes fasciculations and then depolarising blockade with muscle
    weakness and flaccid paralysis, including the diaphragm.
  evidence:
  - reference: PMID:16168308
    reference_title: "Organic phosphorus compounds--nerve agents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Nicotinic symptoms such as paralysis and fasciculations may also occur."
    explanation: The nicotinic toxidrome produces fasciculations and paralysis.
  downstream:
  - target: Muscle fasciculation
    causal_link_type: DIRECT
  - target: Muscle weakness
    causal_link_type: DIRECT
  - target: Respiratory Failure
    causal_link_type: DIRECT
- name: Central Cholinergic Overstimulation
  biological_scale: ORGANISM
  description: >-
    Central cholinergic overstimulation initiates seizures that can progress to
    status epilepticus, together with altered mental status and central
    respiratory depression.
  evidence:
  - reference: PMID:16168308
    reference_title: "Organic phosphorus compounds--nerve agents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Central nervous system toxicity may include seizures, altered mental status, and apnea, and require prompt intervention."
    explanation: The central toxidrome comprises seizures, altered mental status and apnoea.
  - reference: PMID:30159887
    reference_title: "Acute and long-term consequences of exposure to organophosphate nerve agents in humans."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "acetylcholinesterase inhibition results in the overactivation of muscarinic receptors leading to the initiation of status epilepticus"
    explanation: Central cholinergic overactivation initiates status epilepticus.
  downstream:
  - target: Seizure
    causal_link_type: DIRECT
  - target: Coma
    causal_link_type: DIRECT
  - target: Respiratory Failure
    causal_link_type: DIRECT
- name: Respiratory Failure
  biological_scale: ORGANISM
  description: >-
    Death from nerve agent poisoning is principally respiratory: bronchorrhoea
    and bronchospasm, diaphragmatic and respiratory-muscle paralysis, and
    central apnoea converge to cause hypoxaemic respiratory failure.
  evidence:
  - reference: PMID:30159887
    reference_title: "Acute and long-term consequences of exposure to organophosphate nerve agents in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "generalized signs of toxicity including status epilepticus, defecation, miosis, bronchospasm, bronchorrhea, paralysis and respiratory failure"
    explanation: Respiratory failure is the convergent, life-threatening endpoint of the toxidrome.
  downstream:
  - target: Respiratory insufficiency
    causal_link_type: DIRECT

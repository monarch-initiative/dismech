datasets:
- accession: geo:GSE281263
  title: Identification of a novel PDC-E2 epitope in Primary Biliary Cholangitis and application for engineered Treg therapy
  description: 'Background and Aims: Primary biliary cholangitis (PBC) is a chronic autoimmune liver disease, characterized by progressive destruction of small intrahepatic bile ducts and portal inflammation. Treatment options are limited with reliance on liver transplantation in advanced cases. The adaptive immune response is implicated in disease pathogenesis by both the presence of anti-mitochondrial antibodies targeting the E2 subunit of the pyruvate dehydrogenase complex (PDC-E2), in 90-95% of patients, and T cells infiltrating the portal tracts in affected individuals.'

- accession: geo:GSE304352
  title: Transcriptome analysis of liver tissue from patients with Autoimmune Hepatitis, Primary Biliary Cholangitis, and Chronic Hepatitis B
  description: 'This study aims to identify immune-related genes in Autoimmune Hepatitis (AIH) by analyzing liver tissue transcriptomes. Bulk RNA sequencing was performed on liver biopsies from patients with AIH and two disease control groups: Primary Biliary Cholangitis (PBC) and Chronic Hepatitis B (CHB). Differential expression analysis was used to compare AIH against both control groups. By intersecting the resulting differentially expressed genes (DEGs) with immune gene databases, we identified 19 common immune-related DEGs (IRDEGs). Gene Ontology (GO) analysis of these genes highlighted functions related to lymphocyte-mediated immunity and T-cell receptor signaling.'

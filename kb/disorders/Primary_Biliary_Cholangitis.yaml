    evidence_source: HUMAN_CLINICAL
    snippet: "Ursodeoxycholic acid (UDCA) is the first-line treatment of primary biliary cholangitis (PBC). Long-term UDCA use significantly reduces progression to cirrhosis. UDCA improves liver enzymes and transplant-free survival rates."
    explanation: >-
      States UDCA's first-line position and the biochemical and transplant-free
      survival benefit asserted by this treatment entry.

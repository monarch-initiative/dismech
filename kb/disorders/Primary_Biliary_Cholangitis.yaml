name: Primary Biliary Cholangitis
creation_date: '2025-12-19T01:12:52Z'
category: Autoimmune
parents:
- Autoimmune Disease
- Liver Disease
disease_term:
  preferred_term: Primary Biliary Cholangitis
  term:
    id: MONDO:0005388
    label: primary biliary cholangitis
description: >-
  A chronic autoimmune liver disease characterized by progressive destruction
  of small intrahepatic bile ducts, leading to cholestasis, fibrosis, and
  eventually cirrhosis. Highly associated with anti-mitochondrial antibodies
  (AMA) targeting pyruvate dehydrogenase complex.
pathophysiology:
- name: Anti-Mitochondrial Antibody Response
  description: >-
    Autoantibodies against the E2 subunit of pyruvate dehydrogenase complex
    (PDC-E2) are highly specific for PBC. These antibodies may directly
    contribute to biliary epithelial cell damage through immune complex
    formation and complement activation.
  biological_processes:
  - preferred_term: Immunoglobulin Production
    term:
      id: GO:0002377
      label: immunoglobulin production
  evidence:
  - reference: PMID:26953925
    reference_title: "A contemporary perspective on the molecular characteristics of mitochondrial autoantigens and diagnosis in primary biliary cholangitis."
    supports: PARTIAL
    snippet: >-
      Primary biliary cholangitis (PBC) is an autoimmune hepatobiliary disease
      characterized by immune mediated destruction of the intrahepatic small bile
      ducts and the presence of antimitochondrial antibodies (AMAs). The mitochondrial
      autoantigens have been identified as the E2 subunits of the 2-oxo-acid
      dehydrogenase complex, including the E2 subunits of pyruvate dehydrogenase,
      branched-chain 2-oxo acid dehydrogenase complex, oxoglutarate dehydrogenase
      complex, E3 binding protein and PDC E1 alpha subunit.
    explanation: >-
      This paper confirms that AMAs targeting PDC-E2 and related E2 subunits are
      characteristic of PBC and are associated with immune-mediated bile duct destruction.
  - reference: PMID:39329760
    reference_title: "Current Landscape and Evolving Therapies for Primary Biliary Cholangitis."
    supports: PARTIAL
    snippet: >-
      Although the pathogenesis of the disease is multifactorial, there is a consensus
      that individuals with a genetic predisposition develop the disease in the
      presence of specific environmental triggers. A dysbiosis of intestinal
      microbiota is increasingly considered among the potential pathogenic factors.
    explanation: >-
      This review highlights the multifactorial pathogenesis of PBC, including
      genetic predisposition and environmental triggers that lead to AMA production
      and disease development.
- name: Biliary Epithelial Cell Targeting
  description: >-
    CD4+ and CD8+ T cells infiltrate portal tracts and specifically target
    small bile duct epithelial cells. Aberrant PDC-E2 expression on apoptotic
    cholangiocytes may initiate the autoimmune response.
  cell_types:
  - preferred_term: Cholangiocyte
    term:
      id: CL:0002538
      label: intrahepatic cholangiocyte
  - preferred_term: CD8+ T Cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T Cell Cytotoxicity
    term:
      id: GO:0001913
      label: T cell mediated cytotoxicity
  evidence:
  - reference: PMID:24556277
    reference_title: "Murine autoimmune cholangitis requires two hits: cytotoxic KLRG1(+) CD8 effector cells and defective T regulatory cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In vitro cholangiocyte cytotoxicity assays demonstrated significantly
      increased numbers of cytotoxic hepatic dnTGFβRII KLRG1(+) CD8 cells
      compared to B6. Protection from disease by B6 Tregs was associated with
      elimination of hepatic dnTGFβRII CD8 mediated cholangiocyte cytotoxicity.
      These results emphasize that autoimmune cholangitis requires defects in
      both the T effector and regulatory compartments.
    explanation: >-
      Cytotoxic CD8+ T cells directly target and destroy cholangiocytes in the
      dnTGFbetaRII mouse model of autoimmune cholangitis, supporting T cell-
      mediated cytotoxicity as the mechanism of bile duct epithelial cell
      destruction. The demonstration is in mice, so the human claim follows by
      extrapolation from the model.
  - reference: PMID:39329760
    reference_title: "Current Landscape and Evolving Therapies for Primary Biliary Cholangitis."
    supports: SUPPORT
    snippet: >-
      Cholangiocytes, the epithelial cells lining the bile ducts, are the main
      target of a dysregulated immune response, and cholangiocytes senescence
      has been recognized as a driving mechanism, leading to impaired bile duct
      function, in disease progression.
    explanation: >-
      This review confirms that cholangiocytes are the primary cellular targets
      of immune attack in PBC, with senescent cholangiocytes driving disease
      progression through impaired bile duct function.
- name: Progressive Ductopenia and Cholestasis
  description: >-
    Destruction of bile ducts leads to ductopenia, impaired bile flow, and
    accumulation of toxic bile acids. Retained bile acids cause further
    hepatocyte damage and promote fibrosis.
  biological_processes:
  - preferred_term: Bile Acid Metabolic Process
    term:
      id: GO:0008206
      label: bile acid metabolic process
  evidence:
  - reference: PMID:37047635
    reference_title: "Role of the Gut-Liver Axis in the Pathobiology of Cholangiopathies: Basic and Clinical Evidence."
    supports: PARTIAL
    snippet: >-
      In recent years, several studies have shown that, in case of a change in
      gut bacterial homeostasis or impairment of intestinal barrier functions,
      cholangiocytes, which are the epithelial cells lining the bile ducts,
      activate innate immune responses against gut-derived microorganisms or
      bacterial products that reach the liver via enterohepatic circulation.
      Intestinal dysbiosis or impaired intestinal barrier functions cause
      cholangiocytes to be exposed to an increasing amount of microorganisms
      that can reactivate inflammatory responses, thus inducing the onset of
      liver fibrosis.
    explanation: >-
      This review demonstrates that cholangiocyte injury and bile duct destruction
      in PBC are promoted by gut-derived bacterial products reaching the liver,
      which trigger inflammatory responses that induce liver fibrosis and progressive
      disease.
  - reference: PMID:39329760
    reference_title: "Current Landscape and Evolving Therapies for Primary Biliary Cholangitis."
    supports: PARTIAL
    snippet: >-
      Bile acids are also recognized as playing an important role, both in disease
      development and therapy. Thus, while bile acid-based therapies, specifically
      ursodeoxycholic acid and obeticholic acid, have been the cornerstone of
      therapy in PBC, novel therapeutic approaches have been developed in recent years.
    explanation: >-
      This review highlights the central role of bile acids in PBC pathogenesis,
      noting that bile acid accumulation contributes to disease progression and
      that bile acid modulation is a key therapeutic strategy.
phenotypes:
- name: Pruritus
  category: Dermatological
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  notes: Often the presenting symptom
  evidence:
  - reference: PMID:35704252
    reference_title: "Impact of Pruritus on Quality of Life and Current Treatment Patterns in Patients with Primary Biliary Cholangitis."
    supports: PARTIAL
    snippet: >-
      Pruritus was reported in 170 patients (81%), with those reporting clinically
      significant pruritus (30%) scoring worse across each domain of the PBC-40 and
      5-D itch, more frequently having cirrhosis, and having significantly greater
      levels of fatigue.
    explanation: >-
      This real-world cohort study demonstrates that pruritus is highly prevalent
      in PBC (81%), with clinically significant pruritus associated with worse
      quality of life, more advanced disease, and greater fatigue.
- name: Fatigue
  category: Systemic
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  evidence:
  - reference: PMID:35704252
    reference_title: "Impact of Pruritus on Quality of Life and Current Treatment Patterns in Patients with Primary Biliary Cholangitis."
    supports: PARTIAL
    snippet: >-
      Pruritus was reported in 170 patients (81%), with those reporting clinically
      significant pruritus (30%) scoring worse across each domain of the PBC-40 and
      5-D itch, more frequently having cirrhosis, and having significantly greater
      levels of fatigue.
    explanation: >-
      This study shows that fatigue is significantly elevated in PBC patients,
      particularly in those with clinically significant pruritus.
- name: Jaundice
  category: Hepatic
  phenotype_term:
    preferred_term: Jaundice
    term:
      id: HP:0000952
      label: Jaundice
  notes: >-
    The staging of jaundice in PBC is not settled by the cited source. The
    review quoted here lists jaundice among early-stage manifestations, while
    clinically a rising bilirubin is a late, poor-prognostic feature. The
    entry previously asserted "indicates advanced disease" over a quote saying
    the opposite; both claims are now dropped in favour of the symptom quote,
    and a staging claim needs its own citation. The former frequency band
    (FREQUENT) is likewise removed as unsupported -- no cited source reports a
    jaundice-specific rate.
  evidence:
  - reference: PMID:39329760
    reference_title: "Current Landscape and Evolving Therapies for Primary Biliary Cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      alleviates symptoms of PBC, such as pruritus, jaundice and fatigue
    explanation: >-
      Establishes jaundice as a symptom of PBC that first-line UDCA is expected
      to relieve. The sentence carries no staging claim, so it supports the
      phenotype without asserting when in the disease course it appears.
- name: Hepatomegaly
  category: Hepatic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Hepatomegaly
    term:
      id: HP:0002240
      label: Hepatomegaly
biochemical:
- name: Anti-Mitochondrial Antibodies (AMA)
  presence: Elevated
  context: Present in 95% of patients, highly specific
  evidence:
  - reference: PMID:26953925
    reference_title: "A contemporary perspective on the molecular characteristics of mitochondrial autoantigens and diagnosis in primary biliary cholangitis."
    supports: SUPPORT
    snippet: >-
      Primary biliary cholangitis (PBC) is an autoimmune hepatobiliary disease
      characterized by immune mediated destruction of the intrahepatic small bile
      ducts and the presence of antimitochondrial antibodies (AMAs).
    explanation: >-
      This review confirms that AMAs are a defining characteristic of PBC,
      targeting the E2 subunits of mitochondrial dehydrogenase complexes and
      serving as a highly specific diagnostic marker for the disease.
- name: Alkaline Phosphatase
  presence: Elevated
  context: Cholestatic pattern
  biomarker_term:
    preferred_term: Serum Alkaline Phosphatase Measurement
    term:
      id: NCIT:C61016
      label: Serum Alkaline Phosphatase Measurement
  synonyms:
  - ALP
  - Serum ALP
  readouts:
  - target: Progressive Ductopenia and Cholestasis
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    regulatory_endpoint_refs:
    - FDA-SE-adult-noncancer-092
    interpretation: >-
      Serum alkaline phosphatase reports the cholestatic injury pattern caused
      by progressive small-duct loss in PBC; lower ALP is associated with
      longer transplant-free survival and is used with bilirubin as a composite
      surrogate endpoint in PBC trials.
    evidence:
    - reference: PMID:25160979
      reference_title: "Levels of alkaline phosphatase and bilirubin are surrogate end points of outcomes of patients with primary biliary cirrhosis: an international follow-up study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Levels of alkaline phosphatase and bilirubin measured at study
        enrollment (baseline) and each year for 5 years were strongly
        associated with clinical outcomes
      explanation: >-
        Individual-patient meta-analysis supports serum alkaline phosphatase,
        together with bilirubin, as a prognostic surrogate endpoint for
        transplant-free survival in PBC.
- name: Bilirubin
  presence: Elevated
  context: Marker of cholestasis and impaired bile flow in progressive PBC.
  biomarker_term:
    preferred_term: Serum Total Bilirubin Measurement
    term:
      id: NCIT:C61031
      label: Serum Total Bilirubin Measurement
  synonyms:
  - Total bilirubin
  - Serum bilirubin
  readouts:
  - target: Progressive Ductopenia and Cholestasis
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    regulatory_endpoint_refs:
    - FDA-SE-adult-noncancer-092
    interpretation: >-
      Serum bilirubin reports impaired bile flow and cholestatic progression
      downstream of ductopenia in PBC; normal bilirubin is used with alkaline
      phosphatase response as a composite surrogate endpoint in PBC trials.
    evidence:
    - reference: PMID:25160979
      reference_title: "Levels of alkaline phosphatase and bilirubin are surrogate end points of outcomes of patients with primary biliary cirrhosis: an international follow-up study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One year after study enrollment, a bilirubin level 1.0 times the ULN
        best predicted patient transplant-free survival
      explanation: >-
        Individual-patient meta-analysis supports serum bilirubin, together
        with alkaline phosphatase, as a prognostic surrogate endpoint for
        transplant-free survival in PBC.
- name: IgM
  presence: Elevated
  context: Characteristic finding
  synonyms:
  - Immunoglobulin M
  - Serum IgM
  evidence:
  - reference: PMID:31677185
    reference_title: "IgM response is a prognostic biomarker of primary biliary cholangitis treated with ursodeoxycholic acid and bezafibrate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cumulative survival rates were significantly lower in patients with IgM
      >= 240 mg/dL than in patients with IgM < 240 mg/dL. Thus, normalization of
      IgM levels was a good surrogate predictor of long-term prognosis.
    explanation: >-
      In a 150-patient UDCA-refractory cohort, elevated serum IgM tracked worse
      survival and its normalization predicted long-term outcome, supporting IgM
      as an elevated and prognostically meaningful marker in PBC.
- name: Anti-sp100 Antibodies
  presence: Variable
  context: PBC-specific ANA
  evidence:
  - reference: PMID:37032725
    reference_title: "Role of autoantibodies in the clinical management of primary biliary cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis of PBC in a patient with cholestasis relies on the detection of
      disease-specific autoantibodies, including anti-mitochondrial antibodies,
      and disease-specific anti-nuclear antibodies targeting sp100 and gp210.
    explanation: >-
      This review confirms anti-sp100 as a PBC-specific antinuclear antibody used
      in diagnosis, supporting its presence as a variable but disease-specific
      finding.
genetic:
- name: HLA-DRB1*08
  association: Risk Factor
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:19458352
    reference_title: "Primary biliary cirrhosis associated with HLA, IL12A, and IL12RB2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found significant associations between primary biliary cirrhosis and 13
      loci across the HLA class II region
    explanation: >-
      Region-level support only. The GWAS reports 13 associated loci across the
      HLA class II region, which contains HLA-DRB1, but the abstract never names
      DRB1 and never resolves the *08 allele. The DRB1*08 association itself
      rests on the wider HLA literature, not on this quote; the class II signal
      here is in linkage disequilibrium across the region.
  notes: >-
    HLA-DRB1*08 (DRB1*08:01 in Europeans, *08:03 in Japanese) is a
    well-replicated PBC risk allele, but the citation attached here is a
    region-level GWAS. An allele-level DRB1 typing study is still needed to
    evidence this entry at the granularity its name claims.
- name: HLA-DQB1
  association: Risk Factor
  gene_term:
    preferred_term: HLA-DQB1
    term:
      id: hgnc:4944
      label: HLA-DQB1
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:19458352
    reference_title: "Primary biliary cirrhosis associated with HLA, IL12A, and IL12RB2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the HLA-DQB1 locus (encoding the major histocompatibility complex class II,
      DQ beta chain 1) had the strongest association (P=1.78x10(-19); odds ratio
      for patients vs. controls, 1.75)
    explanation: >-
      Names the gene and reports the effect size directly. HLA-DQB1 carried the
      strongest association of the 13 class II loci in this GWAS, with an odds
      ratio of 1.75.
- name: IL12A
  association: Risk Factor
  gene_term:
    preferred_term: IL12A
    term:
      id: hgnc:5969
      label: IL12A
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:19458352
    reference_title: "Primary biliary cirrhosis associated with HLA, IL12A, and IL12RB2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary biliary cirrhosis was also significantly and reproducibly
      associated with two SNPs at the IL12A locus (encoding interleukin-12alpha),
      rs6441286 (P=2.42x10(-14); odds ratio, 1.54) and rs574808 (P=1.88x10(-13);
      odds ratio, 1.54)
    explanation: >-
      Two independently replicated IL12A SNPs confer PBC risk, implicating the
      IL-12 immunoregulatory axis in disease susceptibility.
- name: IL12RB2
  association: Risk Factor
  gene_term:
    preferred_term: IL12RB2
    term:
      id: hgnc:5972
      label: IL12RB2
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:19458352
    reference_title: "Primary biliary cirrhosis associated with HLA, IL12A, and IL12RB2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      one SNP at the IL12RB2 locus (encoding interleukin-12 receptor beta2),
      rs3790567 (P=2.76x10(-11); odds ratio, 1.51)
    explanation: >-
      The replicated IL12RB2 association complements the IL12A signal and
      supports IL-12 receptor signaling as a PBC susceptibility pathway.
treatments:
- name: Ursodeoxycholic Acid (UDCA)
  description: First-line therapy, improves biochemistry and transplant-free
    survival.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ursodeoxycholic acid
      term:
        id: CHEBI:9907
        label: ursodeoxycholic acid
  target_mechanisms:
  - target: Progressive Ductopenia and Cholestasis
    treatment_effect: INHIBITS
    description: >-
      UDCA enriches the bile acid pool with a hydrophilic, non-cytotoxic species,
      reducing the cholestatic injury that follows small-duct loss.
    evidence:
    - reference: PMID:39329760
      reference_title: "Current Landscape and Evolving Therapies for Primary Biliary Cholangitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the displacement of endogenous hydrophobic hepatotoxic BAs by expanding
        the hydrophilic pool modulating BA homeostasis
      explanation: >-
        States the mechanism this edge's description asserts: UDCA displaces
        hydrophobic hepatotoxic bile acids by expanding the hydrophilic pool.
    - reference: PMID:30980847
      reference_title: "Ursodeoxycholic acid therapy and liver transplant-free survival in patients with primary biliary cholangitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The use of UDCA improves LT-free survival among patients with PBC,
        regardless of the disease stage and the observed biochemical response.
      explanation: >-
        Improved transplant-free survival across all disease stages supports UDCA
        acting on the cholestatic progression node rather than only on biochemistry.
  evidence:
  - reference: PMID:30980847
    reference_title: "Ursodeoxycholic acid therapy and liver transplant-free survival in patients with primary biliary cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After IPTW, the 10-year cumulative LT-free survival was 79.7% (95% CI
      78.1-81.2) among UDCA-treated patients and 60.7% (95% CI 58.2-63.4) among
      untreated patients (p <0.001).
    explanation: >-
      This international cohort of 3,902 patients quantifies the transplant-free
      survival benefit of UDCA, supporting it as first-line therapy for PBC.
- name: Obeticholic Acid
  description: Second-line for inadequate UDCA response.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: obeticholic acid
      term:
        id: CHEBI:43602
        label: obeticholic acid
  target_mechanisms:
  - target: Progressive Ductopenia and Cholestasis
    treatment_effect: INHIBITS
    description: >-
      As a farnesoid X receptor agonist, obeticholic acid suppresses bile acid
      synthesis and promotes biliary secretion, reducing cholestatic load.
    evidence:
    - reference: PMID:27532829
      reference_title: "A Placebo-Controlled Trial of Obeticholic Acid in Primary Biliary Cholangitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Obeticholic acid, a farnesoid X receptor agonist, has shown potential
        benefit in patients with this disease.
      explanation: >-
        Identifies FXR agonism as the mechanism by which obeticholic acid acts on
        the bile-acid arm of the cholestasis node.
  evidence:
  - reference: PMID:27532829
    reference_title: "A Placebo-Controlled Trial of Obeticholic Acid in Primary Biliary Cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary end point occurred in more patients in the 5-10-mg group (46%)
      and the 10-mg group (47%) than in the placebo group (10%; P<0.001 for both
      comparisons).
    explanation: >-
      The phase 3 POISE trial enrolled patients with an inadequate response to
      ursodiol, supporting obeticholic acid as second-line therapy on the
      composite alkaline-phosphatase/bilirubin endpoint.
  notes: >-
    POISE reported more pruritus (68% at 10 mg vs 38% placebo) and more serious
    adverse events with obeticholic acid than with placebo.
- name: Fibrates
  description: Bezafibrate or fenofibrate as add-on therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bezafibrate
      term:
        id: CHEBI:47612
        label: bezafibrate
    - preferred_term: fenofibrate
      term:
        id: CHEBI:5001
        label: fenofibrate
  target_mechanisms:
  - target: Progressive Ductopenia and Cholestasis
    treatment_effect: INHIBITS
    description: >-
      Fibrates are PPAR agonists that reduce the cholestatic biochemical burden
      when added to UDCA in incomplete responders.
    evidence:
    - reference: PMID:29874528
      reference_title: "A Placebo-Controlled Trial of Bezafibrate in Primary Biliary Cholangitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fibrates, which are agonists of peroxisome proliferator-activated
        receptors, in combination with ursodeoxycholic acid, have shown potential
        benefit in patients with this condition.
      explanation: >-
        Names PPAR agonism as the fibrate mechanism acting alongside UDCA on
        cholestatic injury.
  evidence:
  - reference: PMID:29874528
    reference_title: "A Placebo-Controlled Trial of Bezafibrate in Primary Biliary Cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary outcome occurred in 31% of the patients assigned to bezafibrate
      and in 0% assigned to placebo (difference, 31 percentage points; 95%
      confidence interval, 10 to 50; P<0.001).
    explanation: >-
      The phase 3 BEZURSO trial shows add-on bezafibrate achieves complete
      biochemical response in UDCA-incomplete responders, supporting fibrates as
      add-on therapy.
  notes: >-
    BEZURSO tested bezafibrate 400 mg daily; myalgia (20% vs 10%) and a small
    creatinine rise were the notable safety signals.
- name: Liver Transplantation
  description: For end-stage disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  evidence:
  - reference: PMID:39329760
    reference_title: "Current Landscape and Evolving Therapies for Primary Biliary Cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary Biliary Cholangitis (PBC), formerly Primary Biliary Cirrhosis, is a
      progressive cholestatic disease that if untreated might progress to
      cirrhosis and liver decompensation requiring liver transplant
    explanation: >-
      States the indication directly: untreated PBC progresses to cirrhosis and
      decompensation requiring liver transplantation, which is what this
      treatment's "for end-stage disease" description asserts.
  - reference: PMID:32275981
    reference_title: "Long-term impact of preventive UDCA therapy after transplantation for primary biliary cholangitis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recurrence of primary biliary cholangitis (PBC) after liver transplantation
      (LT) is frequent and can impair graft and patient survival.
    explanation: >-
      Records the limitation rather than the indication. This multicentre cohort
      of 780 transplanted PBC patients found post-transplant recurrence to be
      frequent and to impair graft and patient survival, so it cuts against
      transplantation being curative even though it establishes that PBC
      patients are transplanted.
  notes: >-
    In the same cohort, preventive post-transplant UDCA (10-15 mg/kg/day) reduced
    the risk of PBC recurrence (aHR 0.41), graft loss, and all-cause death.

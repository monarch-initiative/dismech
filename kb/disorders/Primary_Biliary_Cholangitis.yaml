    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      We found significant associations between primary biliary cirrhosis and 13
      loci across the HLA class II region
    explanation: >-
      Region-level support only. The GWAS reports 13 associated loci across the
      HLA class II region, which contains HLA-DRB1, but the abstract never names
      DRB1 and never resolves the *08 allele. The DRB1*08 association itself
      rests on the wider HLA literature, not on this quote; the class II signal
      here is in linkage disequilibrium across the region.
  notes: >-
    HLA-DRB1*08 (DRB1*08:01 in Europeans, *08:03 in Japanese) is a
    well-replicated PBC risk allele, but the citation attached here is a
    region-level GWAS. An allele-level DRB1 typing study is still needed to
    evidence this entry at the granularity its name claims.

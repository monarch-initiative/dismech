- accession: geo:GSE231432
  title: HSC-derived exosomal miR-122- 5p inhibits EMT and fibrosis of intrahepatic biliary epithelial cells to alleviate primary biliary cholangitis
  description: 'Objective: The objective was to study the expression profile of serum exosomal ncRNAs in patients with PBC and to explore their potential molecular mechanisms. Methods: The expression profile of ncRNAs in serum exosomes of PBC patients was analyzed by RNA-sequence. Bioinformatics analysis predicted target genes and related signaling pathways. Spearson correlation analysis and receiver operating characteristic (ROC) curve were used to explore the relationship between ncRNAs and PBC clinical indicators and application value. Primary human intrahepatic biliary epithelial cells (HIBECs) were cultured in vitro and lipopolysaccharide (LPS) induced HIBECs inflammatory injury model.'

- name: Liver Transplantation
  description: For end-stage disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: Progressive Ductopenia and Cholestasis
    treatment_effect: BYPASSES
    description: >-
      Replacing the organ removes the destroyed intrahepatic biliary tree
      entirely. It does not remove the autoimmune predisposition, and PBC
      recurs in the graft in a substantial fraction of recipients.
    evidence:
    - reference: PMID:42486602
      reference_title: "Recurrence of Primary Biliary Cholangitis and Primary Sclerosing Cholangitis after Liver Transplantation: Current Evidence and Clinical Implications."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Reported recurrence rates of PBC and PSC after LT range from 17% to 46% and 10% to 37% of recipients, respectively."
      explanation: >-
        Graft recurrence supports BYPASSES rather than a curative effect: the
        transplant replaces the damaged biliary tree without removing the
        underlying autoimmune process.
  evidence:
  - reference: PMID:42647757
    reference_title: "Liver transplantation for cholestatic liver diseases: Trends in primary biliary cholangitis and primary sclerosing cholangitis in the US and Europe over two decades."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-transplant recipient survival for PBC: 1-year 90%, 3-year 85%, 5-year 81%, 10-year 68%"
    explanation: >-
      Registry analysis of 8,774 PBC transplant recipients quantifying outcomes
      of transplantation for end-stage PBC.
  - reference: PMID:39329760
    reference_title: "Current Landscape and Evolving Therapies for Primary Biliary Cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary Biliary Cholangitis (PBC), formerly Primary Biliary Cirrhosis, is a
      progressive cholestatic disease that if untreated might progress to
      cirrhosis and liver decompensation requiring liver transplant
    explanation: >-
      States the indication directly: untreated PBC progresses to cirrhosis and
      decompensation requiring liver transplantation, which is what this
      treatment's "for end-stage disease" description asserts.
  notes: >-
    Transplantation is not curative. PMID:32275981, a multicentre cohort of 780
    transplanted PBC patients, reports that recurrence after liver
    transplantation is frequent and can impair graft and patient survival. In
    that same cohort, preventive post-transplant UDCA (10-15 mg/kg/day) reduced
    the risk of PBC recurrence (aHR 0.41), graft loss, and all-cause death. Both
    are post-transplant management findings rather than evidence bearing on the
    indication, which is why they sit here rather than in `evidence:`.

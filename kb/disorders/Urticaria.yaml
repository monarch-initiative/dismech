environmental:
- name: IgE-Mediated Food, Latex, Venom, or Antibiotic Exposure
  description: >-
    In acute urticaria, clinically indicated food, latex, insect-venom, or
    antibiotic exposures can trigger a type I IgE-mediated episode.
  effect: TRIGGERS
  influences_mechanisms:
  - target: Fc Epsilon RI-LYN-SYK-BTK Signaling
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Allergen-specific IgE cross-linking activates the Fc epsilon RI signaling route.
    evidence:
    - reference: PMID:40845419
      reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        IgE specific to a given allergen, binding to contiguous FcεRI receptors
        on the mast cell membrane, and intracellular signaling events mediated
        by Bruton's tyrosine kinase (BTK). The phenomenon culminates in mast cell
        degranulation
      explanation: The full-text review directly connects allergen-specific IgE/Fc epsilon RI signaling to degranulation.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skin prick tests (SPTs) and serum-specific IgE tests may help confirm a
      diagnosis of acute urticaria resulting from allergic or IgE-mediated
      (type I) reactions to common food allergens, latex hypersensitivity,
      stinging insect hypersensitivity and certain antibiotics.
    explanation: The clinical review identifies the representative type I exposure classes.
- name: Medication, Infection, and Contact Triggers of Acute Urticaria
  description: >-
    Acute urticaria may follow medications, foods, viral or parasitic infection,
    insect venom, or contact allergens; the precise upstream route varies, so
    this aggregate exposure entry targets the shared mast-cell effector through
    unknown intermediates.
  effect: TRIGGERS
  influences_mechanisms:
  - target: Cutaneous Mast-Cell Activation and Degranulation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Heterogeneous acute triggers converge on the shared mast-cell effector by trigger-specific routes.
    evidence:
    - reference: DOI:10.1186/s13223-024-00931-6
      reference_title: Urticaria
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The most common causes of acute urticaria (with or without angioedema)
        are medications, foods, viral infections, stress, parasitic infections,
        insect venom, and contact allergens (e.g., latex)
      explanation: The review enumerates common acute causes; the edge remains indirect because their molecular routes differ.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common causes of acute urticaria (with or without angioedema)
      are medications, foods, viral infections, stress, parasitic infections,
      insect venom, and contact allergens (e.g., latex)
    explanation: The review directly identifies these exposure categories as common acute causes.
- name: MRGPRX2 Agonist Drug and Neuropeptide Exposure
  description: >-
    Selected opioids, antibiotics, neuromuscular blockers, eosinophil mediators,
    and neuropeptides can activate the MRGPRX2 pseudoallergic/neurogenic route.
  effect: TRIGGERS
  influences_mechanisms:
  - target: MRGPRX2-Mediated Non-IgE Activation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: These agonists activate MRGPRX2 independently of IgE.
    evidence:
    - reference: PMID:40845419
      reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Communication between eosinophils and mast cells, independent of
        IgE-related mechanisms, can occur in CSU due to MBP and EPO binding to
        MRGPRX2 receptors, contributing to the maintenance of CSU lesions.
      explanation: The full-text review directly supports an IgE-independent agonist-to-MRGPRX2 route.
  evidence:
  - reference: PMID:40845419
    reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      small molecule drugs (nicotine antagonists and neuromuscular blocking
      drugs), opioids, antibiotics (vancomycin, ciprofloxacin, levofloxacin, and
      moxifloxacin), and iodinated contrast media
    explanation: The review enumerates drug classes and agents implicated in MRGPRX2 activation and CSU exacerbation.

name: Urticaria
creation_date: '2026-02-02T00:16:36Z'
updated_date: '2026-02-17T21:53:14Z'
description: >-
  Urticaria is a mast-cell-mediated skin disorder defined by recurrent pruritic
  wheals, with or without angioedema. It is classified by duration as acute or
  chronic and, within chronic disease, by whether lesions arise spontaneously
  or in response to a reproducible physical or environmental trigger. Mast-cell
  mediator release produces cutaneous vasodilation and plasma leakage; chronic
  spontaneous urticaria includes autoimmune IgG- and IgE-mediated endotypes,
  but these mechanisms account for a subset rather than every case.
category: Complex
parents:
- Dermatological Disease
- Inflammatory Disease
disease_term:
  preferred_term: urticaria
  term:
    id: MONDO:0005492
    label: urticaria
has_subtypes:
- name: Acute Urticaria
  description: Urticaria whose episode duration is less than six weeks.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Acute urticaria refers to urticaria which lasts less than 6 weeks."
    explanation: The clinical review defines the acute subtype by duration.
- name: Chronic Spontaneous Urticaria
  description: >-
    Wheals, angioedema, or both occurring continuously or intermittently for at
    least six weeks without an identifiable external trigger.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chronic urticaria is defined as urticaria, angioedema or both that has
      been continuous or intermittent for at least 6 weeks
    explanation: The review supplies the chronic-duration criterion.
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In CSU, an external trigger cannot be identified"
    explanation: The review distinguishes spontaneous disease by absence of an identifiable trigger.
- name: Chronic Inducible Urticaria
  description: >-
    Chronic urticaria elicited by reproducible stimuli such as scratching,
    cold, heat, sunlight, vibration, or pressure.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The latter represents a distinct subgroup of chronic urticaria that is
      induced by physical stimuli, such as scratching (dermatographism, a
      common form of physical urticaria), cold, heat, sunlight, vibration and
      pressure.
    explanation: The review defines inducible urticaria and enumerates representative stimuli.
pathophysiology:
- name: Autoimmune IgG or IgE Mast-Cell Activation
  biological_scale: MOLECULAR
  description: >-
    In an estimated subset of chronic spontaneous urticaria, IgG
    autoantibodies against IgE or Fc epsilon RI, or IgE against autoallergens,
    chronically activate dermal mast cells and basophils.
  downstream:
  - target: Cutaneous Mast-Cell Activation and Degranulation
    causal_link_type: DIRECT
    description: >-
      Autoantibody engagement of IgE or its high-affinity receptor directly
      stimulates mast cells and basophils in autoimmune CSU endotypes.
    evidence:
    - reference: DOI:10.1186/s13223-024-00931-6
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        circulating IgG autoantibodies that recognize IgE antibodies or the
        alpha subunit of the high-affinity IgE receptor on dermal mast cells
        and basophils lead to chronic stimulation of these cells
      explanation: The review directly links IgG autoantibodies to chronic effector-cell stimulation.
    - reference: DOI:10.1186/s13223-024-00931-6
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "IgE directed against a variety of auto-allergens promote mast cell/basophil degranulation"
      explanation: The review directly supports the autoallergic IgE route.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Almost half of these cases are thought to occur due to pathogenic
      autoimmune mechanisms
    explanation: The wording supports autoimmune endotypes in a subset of CSU, not all urticaria.
- name: Cutaneous Mast-Cell Activation and Degranulation
  biological_scale: CELLULAR
  description: >-
    Activated cutaneous mast cells degranulate and act as the common effector
    cell for urticarial lesions across heterogeneous upstream triggers.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: mast cell degranulation
    term:
      id: GO:0043303
      label: mast cell degranulation
  downstream:
  - target: Inflammatory Mediator Release
    causal_link_type: DIRECT
    description: Mast-cell degranulation rapidly releases histamine, leukotrienes, and prostaglandins.
    evidence:
    - reference: DOI:10.1186/s13223-024-00931-6
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Mast cell degranulation leads to the rapid release of various
        inflammatory mediators, such as histamine, leukotrienes and
        prostaglandins
      explanation: The source directly states the degranulation-to-mediator transition.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mast cells are the primary effector cells in urticaria"
    explanation: The review identifies mast cells as the shared urticaria effector cell.
- name: Inflammatory Mediator Release
  biological_scale: MOLECULAR
  description: >-
    Histamine, leukotrienes, prostaglandins, and later cytokines are released
    from activated mast cells into cutaneous tissue.
  downstream:
  - target: Cutaneous Vasodilation and Plasma Leakage
    causal_link_type: DIRECT
    description: Released inflammatory mediators cause vasodilation and leakage of plasma in and below the skin.
    evidence:
    - reference: DOI:10.1186/s13223-024-00931-6
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        inflammatory mediators, such as histamine, leukotrienes and
        prostaglandins which, in turn, cause vasodilation and leakage of plasma
        in and below the skin
      explanation: The review directly links the released mediators to the vascular response.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mast cell degranulation leads to the rapid release of various
      inflammatory mediators, such as histamine, leukotrienes and
      prostaglandins
    explanation: The review identifies the principal rapidly released mediators.
- name: Cutaneous Vasodilation and Plasma Leakage
  biological_scale: TISSUE
  description: >-
    Mediator-driven vasodilation and vascular leakage produce superficial
    edematous wheals and, when swelling extends beneath the skin, angioedema.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  downstream:
  - target: Urticarial Wheals
    causal_link_type: DIRECT
    description: Superficial plasma leakage produces the edematous urticarial wheal.
    evidence:
    - reference: DOI:10.1186/s13223-024-00931-6
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        inflammatory mediators, such as histamine, leukotrienes and
        prostaglandins which, in turn, cause vasodilation and leakage of plasma
        in and below the skin
      explanation: This directly supports vascular leakage as the tissue event underlying wheals.
  - target: Angioedema
    causal_link_type: DIRECT
    description: Deeper swelling beneath the skin manifests as angioedema.
    evidence:
    - reference: DOI:10.1186/s13223-024-00931-6
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "angioedema (swelling that occurs beneath the skin)"
      explanation: The source defines angioedema as deeper subcutaneous swelling.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      inflammatory mediators, such as histamine, leukotrienes and
      prostaglandins which, in turn, cause vasodilation and leakage of plasma
      in and below the skin
    explanation: The review directly supports the vascular tissue response.
phenotypes:
- name: Urticarial Wheals
  description: >-
    Recurrent pruritic wheals with pale central swelling and surrounding
    erythema; individual lesions usually resolve in about 24 hours without
    scarring, although some persist up to 48 hours.
  phenotype_term:
    preferred_term: Urticaria
    term:
      id: HP:0001025
      label: Urticaria
    temporality: TRANSIENT
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is characterized by recurrent, pruritic wheals with pale, central
      swelling and surrounding epidermal erythema
    explanation: The clinical review describes the characteristic wheal morphology.
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      are often transient, resolving within about 24 h without scarring;
      however, some lesions may last up to 48 h
    explanation: The review supports the transient lesion course without overstating a strict 24-hour cutoff.
- name: Pruritus
  description: Itching accompanies the characteristic urticarial wheals.
  phenotype_term:
    preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:31899843
    reference_title: Evidence for bradykinin release in chronic spontaneous urticaria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic spontaneous urticaria (CSU) is characterized by recurrent itchy weals and/or angioedema"
    explanation: A human CSU cohort report directly supports itch as a clinical feature.
- name: Angioedema
  description: Deeper swelling beneath the skin may accompany urticaria.
  phenotype_term:
    preferred_term: Angioedema
    term:
      id: HP:0100665
      label: Angioedema
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urticaria (hives) is a common disorder that may be associated with angioedema (swelling that occurs beneath the skin)."
    explanation: The source directly supports angioedema as an associated manifestation.

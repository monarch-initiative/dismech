review_notes: >-
  Review narrowed the entry to the MONDO umbrella concept while making acute,
  chronic spontaneous, and chronic inducible scope explicit. The autoimmune
  mechanism is restricted to supported CSU subsets rather than generalized to
  all urticaria, and the type I autoallergic and type IIb autoimmune endotypes
  are represented as parallel receptor-proximal routes. Complement, Fc epsilon
  RI-LYN-SYK-BTK, and MRGPRX2 branches are included only where the generated
  full-text review provides proposition-level support. Bradykinin is not
  serialized as a causal mechanism because
  the cited human association study states that its clinical implications
  remain open to debate. Pruritus is wired through an atomic histaminergic
  cutaneous sensory-signaling node using direct proposition-level evidence.
  No causal gene, validated disease-specific animal model, or current clinical
  trial record was inferred from the reviewed material: this complex umbrella
  disorder has heterogeneous triggers, and the retained sources did not justify
  a single genetic cause, one representative model, or a registry assertion.
  The D2P comparison was reviewed but not imported mechanically because its
  umbrella MONDO mapping aggregates many syndromic and differential-diagnosis
  phenotypes that are not core manifestations of ordinary urticaria.

      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Mast cell degranulation leads to the rapid release of various
        inflammatory mediators, such as histamine, leukotrienes and
        prostaglandins
      explanation: The source directly states the degranulation-to-mediator transition.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mast cells are the primary effector cells in urticaria"
    explanation: The review identifies mast cells as the shared urticaria effector cell.
  - reference: PMID:40845419
    reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The central role of mast cells is being reinforced, but multiple cells,
      pathways, and mediators are involved in a complex interrelationship.
    explanation: The dedicated CSU review confirms mast-cell centrality while preserving upstream heterogeneity.
- name: Inflammatory Mediator Release
  biological_scale: MOLECULAR
  description: >-
    Histamine, leukotrienes, prostaglandins, and later cytokines are released
    from activated mast cells into cutaneous tissue.
  downstream:
  - target: Cutaneous Vasodilation and Plasma Leakage
    causal_link_type: DIRECT
    description: Released inflammatory mediators cause vasodilation and leakage of plasma in and below the skin.
    evidence:
    - reference: DOI:10.1186/s13223-024-00931-6
      reference_title: Urticaria
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        inflammatory mediators, such as histamine, leukotrienes and
        prostaglandins which, in turn, cause vasodilation and leakage of plasma
        in and below the skin
      explanation: The review directly links the released mediators to the vascular response.
  - target: Histaminergic Cutaneous Sensory Signaling
    causal_link_type: DIRECT
    description: Released histamine activates H1- and H4-receptor pathways on cutaneous sensory nerve endings.
    evidence:
    - reference: PMID:40845419
      reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Sensory nerve endings in the dermis have histaminergic pathways (H1 and
        H4 receptors), to which histamine binds and determines the perception
        of pruritus.
      explanation: The review directly links histamine binding at cutaneous sensory endings to itch perception.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mast cell degranulation leads to the rapid release of various
      inflammatory mediators, such as histamine, leukotrienes and
      prostaglandins
    explanation: The review identifies the principal rapidly released mediators.
- name: Histaminergic Cutaneous Sensory Signaling
  biological_scale: CELLULAR
  description: >-
    Histamine activates H1- and H4-receptor pathways on cutaneous sensory nerve
    endings, generating the perception of itch.
  downstream:
  - target: Pruritus
    causal_link_type: DIRECT
    description: Histaminergic signaling in cutaneous sensory nerve endings produces pruritus.
    evidence:
    - reference: PMID:40845419
      reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Sensory nerve endings in the dermis have histaminergic pathways (H1 and
        H4 receptors), to which histamine binds and determines the perception
        of pruritus.
      explanation: The source directly supports the sensory-signaling-to-pruritus edge.
  evidence:
  - reference: PMID:40845419
    reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Histamine released during mast cell degranulation and by basophils plays a
      prominent role in the pathogenesis of urticaria and its pruritus.
    explanation: The review identifies released histamine as a prominent pruritogenic mediator.
- name: Cutaneous Vasodilation and Plasma Leakage
  biological_scale: TISSUE
  description: >-
    Mediator-driven vasodilation and vascular leakage produce superficial

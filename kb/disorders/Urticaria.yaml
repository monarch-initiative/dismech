differential_diagnoses:
- name: Urticarial vasculitis
  description: >-
    Consider when lesions are painful rather than pruritic, persist longer than
    48 hours, and leave bruising or discoloration.
  distinguishing_features:
  - Painful lesions lasting more than 48 hours with residual bruising or discoloration favor urticarial vasculitis.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In urticarial vasculitis, the lesions are usually painful rather than
      pruritic, last longer than 48 h, and leave bruises or discoloration on the
      skin
    explanation: The source provides the distinguishing clinical features.

name: Urticaria
creation_date: '2026-02-02T00:16:36Z'
description: >-
  Urticaria is a mast-cell-mediated skin disorder defined by recurrent pruritic
  wheals, with or without angioedema. It is classified by duration as acute or
  chronic and, within chronic disease, by whether lesions arise spontaneously
  or in response to a reproducible physical or environmental trigger. Mast-cell
  mediator release produces cutaneous vasodilation and plasma leakage; chronic
  spontaneous urticaria includes autoimmune IgG- and IgE-mediated endotypes,
  but these mechanisms account for a subset rather than every case.
category: Complex
parents:
- Dermatological Disease
- Inflammatory Disease
disease_term:
  preferred_term: urticaria
  term:
    id: MONDO:0005492
    label: urticaria
has_subtypes:
- name: Acute Urticaria
  description: Urticaria whose episode duration is less than six weeks.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Acute urticaria refers to urticaria which lasts less than 6 weeks."
    explanation: The clinical review defines the acute subtype by duration.
- name: Chronic Spontaneous Urticaria
  description: >-
    Wheals, angioedema, or both occurring continuously or intermittently for at
    least six weeks without an identifiable external trigger.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chronic urticaria is defined as urticaria, angioedema or both that has
      been continuous or intermittent for at least 6 weeks
    explanation: The review supplies the chronic-duration criterion.
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In CSU, an external trigger cannot be identified"
    explanation: The review distinguishes spontaneous disease by absence of an identifiable trigger.
- name: Chronic Inducible Urticaria
  description: >-
    Chronic urticaria elicited by reproducible stimuli such as scratching,
    cold, heat, sunlight, vibration, or pressure.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The latter represents a distinct subgroup of chronic urticaria that is
      induced by physical stimuli, such as scratching (dermatographism, a
      common form of physical urticaria), cold, heat, sunlight, vibration and
      pressure.
    explanation: The review defines inducible urticaria and enumerates representative stimuli.
pathophysiology:
- name: Type I Autoallergic IgE Activation
  biological_scale: MOLECULAR
  description: >-
    In type I autoallergic CSU, IgE directed against self-antigens such as
    thyroid peroxidase or IL-24 engages Fc epsilon RI and activates mast cells
    or basophils.
  downstream:
  - target: Fc Epsilon RI-LYN-SYK-BTK Signaling
    causal_link_type: DIRECT
    description: Autoallergic IgE engages the high-affinity IgE-receptor signaling route.
    evidence:
    - reference: PMID:40845419
      reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        type I autoimmunity (or autoallergic, aaCSU), primarily mediated by IgE
        specific to self-antigens (endogenous peptides)
      explanation: The full-text review defines the type I autoallergic route as self-antigen-specific IgE.
    - reference: PMID:40845419
      reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In both mechanisms, mast cell degranulation and synthesis of newly formed
        mediators occur through the activation of specific intracellular and
        nuclear signaling pathways, which share the activation of Bruton's
        tyrosine kinase (BTK).
      explanation: The figure caption explicitly includes type I in the BTK-sharing intracellular degranulation route.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IgE directed against a variety of auto-allergens promote mast cell/basophil degranulation"
    explanation: The review directly supports the autoallergic IgE endotype.
- name: Type IIb Anti-IgE or Anti-Fc Epsilon RI Autoimmunity
  biological_scale: MOLECULAR
  description: >-
    In type IIb autoimmune CSU, IgG and less often IgM or IgA autoantibodies
    recognize IgE or Fc epsilon RI on mast cells and basophils.
  downstream:
  - target: Fc Epsilon RI-LYN-SYK-BTK Signaling
    causal_link_type: DIRECT
    description: Anti-receptor or anti-IgE autoantibodies activate Fc epsilon RI-dependent intracellular signaling.
    evidence:
    - reference: PMID:40845419
      reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In both mechanisms, mast cell degranulation and synthesis of newly formed
        mediators occur through the activation of specific intracellular and
        nuclear signaling pathways, which share the activation of Bruton's
        tyrosine kinase (BTK).
      explanation: The figure caption directly links both autoimmune endotypes to BTK-sharing intracellular degranulation signaling.
  - target: Complement C5a-C5aR Amplification
    causal_link_type: DIRECT
    description: Complement activation following IgG anti-Fc epsilon RI engagement generates the C5a amplifier.
    evidence:
    - reference: PMID:40845419
      reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        particularly relevant in the mechanism of type IIb CSU, where after
        activation of FcɛRI on the mast cell membrane by IgG-anti-FcɛRI, C5a
        (anaphylatoxin) is generated
      explanation: The review directly links type IIb receptor activation to C5a generation.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      circulating IgG autoantibodies that recognize IgE antibodies or the
      alpha subunit of the high-affinity IgE receptor on dermal mast cells and
      basophils lead to chronic stimulation of these cells
    explanation: The review directly supports chronic effector-cell stimulation by type IIb autoantibodies.
- name: Complement C5a-C5aR Amplification
  biological_scale: MOLECULAR
  description: >-
    In type IIb CSU, generated C5a binds C5aR on cutaneous mast cells and
    amplifies degranulation.
  downstream:
  - target: Cutaneous Mast-Cell Activation and Degranulation
    causal_link_type: DIRECT
    description: C5a-C5aR signaling exacerbates and amplifies cutaneous mast-cell degranulation.
    evidence:
    - reference: PMID:40845419
      reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        C5a (anaphylatoxin) is generated and this acts as a ligand for the C5aR
        receptor expressed only on cutaneous mast cells, and exacerbates mast
        cell degranulation, worsening and amplifying CSU
      explanation: The review directly supports the C5a-C5aR amplification edge.
  evidence:
  - reference: PMID:40845419
    reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      another factor involved in the amplification of mast cell degranulation
      is the activation of the complement system through the alternative pathway
    explanation: The review identifies complement as a degranulation amplifier.
- name: Fc Epsilon RI-LYN-SYK-BTK Signaling
  biological_scale: CELLULAR
  description: >-
    Fc epsilon RI activation recruits LYN, SYK, and BTK phosphorylation signals
    that drive mast-cell activation and degranulation.
  downstream:
  - target: Cutaneous Mast-Cell Activation and Degranulation
    causal_link_type: DIRECT
    description: LYN-, SYK-, and BTK-mediated signals induce mast-cell activation and degranulation.
    evidence:
    - reference: PMID:40845419
      reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Activation of FcɛRI involves several intracytoplasmic signaling proteins,
        such as LYN, splenic tyrosine kinase (SYK), and Bruton's tyrosine kinase
        (BTK), which promote subsequent phosphorylation signals in other proteins
        and induce mast cell activation and degranulation.
      explanation: The full-text review directly supports the intracellular signaling-to-degranulation edge.
  evidence:
  - reference: PMID:40845419
    reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the first step of FcɛRI-mediated signaling is the phosphorylation of the
      FcɛRI beta chain (FcɛRIβ-chain) and gamma chain (FcɛRIγ-chain) by the LYN
      protein, followed by the activation of SYK and BTK
    explanation: The review specifies the ordered receptor-proximal signaling events.
- name: MRGPRX2-Mediated Non-IgE Activation
  biological_scale: CELLULAR
  description: >-
    MRGPRX2 on cutaneous mast cells responds to selected drugs, eosinophil
    mediators, and neuropeptides, providing a pseudoallergic or neurogenic route
    to degranulation that does not require IgE.
  downstream:
  - target: Cutaneous Mast-Cell Activation and Degranulation
    causal_link_type: DIRECT
    description: MRGPRX2 activation raises cytosolic calcium and initiates degranulation signaling.
    evidence:
    - reference: PMID:40845419
      reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        After activation of MRGPRX2, there is an increase in calcium in the CM
        cytosol, mediating Ca2+ channels, Gai, Gaq, extracellular signal regulated
        by kinase, PI3K/AKT, and phosphoinositide phospholipase Cγ with subsequent
        degranulation and further cytokine release.
      explanation: The review directly supports the calcium-signaling-to-degranulation edge.
  evidence:
  - reference: PMID:40845419
    reference_title: "Chronic spontaneous urticaria: update on pathogenesis and therapeutic implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Its activation occurs by several mediators, including compound 48/80,
      eosinophil-derived mediators (major basic protein, MBP, and EPO),
      neuropeptides (such as substance P, vasoactive intestinal peptide, VIP)
    explanation: The review enumerates representative non-IgE MRGPRX2 agonists.
- name: Cutaneous Mast-Cell Activation and Degranulation
  biological_scale: CELLULAR
  description: >-
    Activated cutaneous mast cells degranulate and act as the common effector
    cell for urticarial lesions across heterogeneous upstream triggers.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: mast cell degranulation
    term:
      id: GO:0043303
      label: mast cell degranulation
  downstream:
  - target: Inflammatory Mediator Release
    causal_link_type: DIRECT
    description: Mast-cell degranulation rapidly releases histamine, leukotrienes, and prostaglandins.
    evidence:
    - reference: DOI:10.1186/s13223-024-00931-6

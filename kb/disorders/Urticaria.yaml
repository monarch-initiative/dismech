    description: Deeper swelling beneath the skin manifests as angioedema.
    evidence:
    - reference: DOI:10.1186/s13223-024-00931-6
      reference_title: Urticaria
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "angioedema (swelling that occurs beneath the skin)"
      explanation: The source defines angioedema as deeper subcutaneous swelling.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      inflammatory mediators, such as histamine, leukotrienes and
      prostaglandins which, in turn, cause vasodilation and leakage of plasma
      in and below the skin
    explanation: The review directly supports the vascular tissue response.
phenotypes:
- name: Urticarial Wheals
  description: >-
    Recurrent pruritic wheals with pale central swelling and surrounding
    erythema; individual lesions usually resolve in about 24 hours without
    scarring, although some persist up to 48 hours.
  phenotype_term:
    preferred_term: Urticaria
    term:
      id: HP:0001025
      label: Urticaria
    temporality: TRANSIENT
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is characterized by recurrent, pruritic wheals with pale, central
      swelling and surrounding epidermal erythema
    explanation: The clinical review describes the characteristic wheal morphology.
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      are often transient, resolving within about 24 h without scarring;
      however, some lesions may last up to 48 h
    explanation: The review supports the transient lesion course without overstating a strict 24-hour cutoff.
- name: Pruritus
  description: Itching accompanies the characteristic urticarial wheals.
  phenotype_term:
    preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:31899843
    reference_title: Evidence for bradykinin release in chronic spontaneous urticaria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic spontaneous urticaria (CSU) is characterized by recurrent itchy weals and/or angioedema"
    explanation: A human CSU cohort report directly supports itch as a clinical feature.
- name: Angioedema
  description: Deeper swelling beneath the skin may accompany urticaria.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Angioedema
    term:
      id: HP:0100665
      label: Angioedema
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urticaria (hives) is a common disorder that may be associated with angioedema (swelling that occurs beneath the skin)."
    explanation: The source directly supports angioedema as an associated manifestation.
  - reference: DOI:10.1186/s13223-024-00931-6
    reference_title: Urticaria
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "beneath the skin) is reported in 40% to 60% of patients with urticaria"
    explanation: The 40-60% estimate maps to the FREQUENT phenotype band.

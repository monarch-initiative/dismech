  biological_processes:
  - preferred_term: vasodilation
    term:
      id: GO:0042311
      label: vasodilation
  - preferred_term: positive regulation of vascular permeability
    term:
      id: GO:0043117
      label: positive regulation of vascular permeability
  downstream:
  - target: Urticarial Wheals
    causal_link_type: DIRECT
    description: Superficial plasma leakage produces the edematous urticarial wheal.
    evidence:
    - reference: DOI:10.1186/s13223-024-00931-6
      reference_title: Urticaria
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        inflammatory mediators, such as histamine, leukotrienes and
        prostaglandins which, in turn, cause vasodilation and leakage of plasma

treatments:
- name: Second-Generation H1 Antihistamines
  description: >-
    New-generation, non-sedating H1 antihistamines are first-line treatment;
    for inadequate control at the standard dose, guidelines recommend
    increasing the dose up to fourfold.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antihistamine agent therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: histamine-1 receptor antagonist
      term:
        id: NCIT:C29578
        label: Histamine-1 Receptor Antagonist
  target_mechanisms:
  - target: Cutaneous Vasodilation and Plasma Leakage
    treatment_effect: MODULATES
    description: H1-receptor antagonism reduces histamine-mediated vascular effects without asserting inhibition of mast-cell degranulation or of other released mediators.
    evidence:
    - reference: DOI:10.1186/s13223-024-00931-6
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Second-generation, non-sedating H1-receptor antihistamines represent the mainstay of therapy for both acute urticaria and CU"
      explanation: The review supports H1 blockade clinically; the join is deliberately MODULATES and targets the downstream tissue response rather than claiming reduced mediator release.
  evidence:
  - reference: PMID:36730626
    reference_title: "S3 Guideline Urticaria. Part 2: Treatment of urticaria - German-language adaptation of the international S3 guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The recommended first-line treatment is to administer new generation,
      non-sedating H1 antihistamines. If the standard dose is not sufficiently
      effective, the dose should be increased up to fourfold.
    explanation: The S3 guideline supports both first-line use and fourfold updosing.
- name: Omalizumab for Antihistamine-Refractory CSU
  description: >-
    Add-on anti-IgE monoclonal-antibody therapy for chronic spontaneous
    urticaria that remains uncontrolled after a trial of up-dosed
    second-generation H1 antihistamines.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: omalizumab
      term:
        id: NCIT:C29299
        label: Omalizumab
  target_mechanisms:
  - target: Autoimmune IgG or IgE Mast-Cell Activation
    treatment_effect: MODULATES
    description: Anti-IgE therapy modulates the IgE-dependent arm represented by this CSU-specific node.
    evidence:
    - reference: DOI:10.1186/s13223-024-00931-6
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "omalizumab (an anti-IgE humanized monoclonal antibody), as add-on therapy is now considered the second-line option"
      explanation: The source identifies both the anti-IgE mechanism and second-line role.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Randomized double-blind, placebo-controlled trials have demonstrated its
      efficacy and safety in patients with CSU refractory to H1-antihistamines
    explanation: The review summarizes randomized human trial support in antihistamine-refractory CSU.
- name: Ciclosporin for Refractory CSU
  description: >-
    Third-line immunosuppressive therapy when chronic spontaneous urticaria does
    not respond to or cannot tolerate omalizumab; blood pressure, renal function,
    and serum drug levels require monitoring.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ciclosporin
      term:
        id: CHEBI:4031
        label: cyclosporin A
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cyclosporine is considered third-line therapy if there is no response to
      omalizumab within 6 months, or if the condition is intolerable.
    explanation: The clinical review supports the restricted third-line position.
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      blood pressure, renal function and serum cyclosporine levels should be
      monitored regularly given the significant side effects associated with
      this form of therapy
    explanation: The source directly supports the stated safety monitoring.
- name: Brief Oral Corticosteroid Course for Severe Exacerbation
  description: >-
    A short oral corticosteroid course may be used for a severe exacerbation;
    long-term corticosteroid therapy should be avoided.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: therapeutic corticosteroid
      term:
        id: NCIT:C211
        label: Therapeutic Corticosteroid
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For some patients with severe urticaria, a brief course of oral
      corticosteroids (e.g., 0.3–0.5 mg/kg of prednisone for 10–14 days) is
      warranted.
    explanation: The review supports a brief oral rescue course for severe urticaria.
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, long-term corticosteroid therapy should be avoided"
    explanation: The review explicitly discourages long-term corticosteroid therapy.
diagnosis:
- name: Clinical History and Physical Examination
  description: >-
    Diagnosis is primarily clinical, documenting lesion morphology, timing,
    recurrence, duration, distribution, possible triggers, treatment response,
    and relevant atopic history.
  diagnosis_term:
    preferred_term: clinical history and physical examination
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of urticaria is based primarily on a thorough clinical history and physical examination."
    explanation: The review identifies history and examination as the diagnostic foundation.
- name: Supervised Provocation Testing for Inducible Urticaria
  description: >-
    Reproduce a suspected physical stimulus under supervision to confirm an
    inducible subtype, using stimulus-specific methods such as cold, stroking,
    water, heat/exercise, or pressure challenge.
  diagnosis_term:
    preferred_term: supervised provocation testing
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Challenge testing, which reproduces exposure to a suspected stimulus in
      a supervised clinical environment, is often indicated to confirm a
      diagnosis of inducible urticaria.
    explanation: The review directly supports supervised challenge testing for inducible disease.
differential_diagnoses:
- name: Urticarial vasculitis
  description: >-
    Consider when lesions are painful rather than pruritic, persist longer than
    48 hours, and leave bruising or discoloration.
  distinguishing_features:
  - Painful lesions lasting more than 48 hours with residual bruising or discoloration favor urticarial vasculitis.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In urticarial vasculitis, the lesions are usually painful rather than
      pruritic, last longer than 48 h, and leave bruises or discoloration on the
      skin
    explanation: The source provides the distinguishing clinical features.
- name: Systemic mastocytosis
  disease_term:
    preferred_term: systemic mastocytosis
    term:
      id: MONDO:0016586
      label: systemic mastocytosis
  description: >-
    A systemic mast-cell disorder with atypical mast-cell accumulation in skin
    and internal organs rather than isolated transient urticarial wheals.
  distinguishing_features:
  - Internal-organ involvement and atypical mast-cell accumulation distinguish systemic mastocytosis.
  evidence:
  - reference: DOI:10.1186/s13223-024-00931-6
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systemic mastocytosis (also called systemic mast cell disease) is a rare
      condition that involves the internal organs, in addition to the skin.
    explanation: The review identifies systemic involvement as the key distinction.

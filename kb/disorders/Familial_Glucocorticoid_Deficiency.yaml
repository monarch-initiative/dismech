pathophysiology:
- name: ACTH Receptor Complex Signaling Failure
  biological_scale: MOLECULAR
  description: >-
    MC2R (the ACTH receptor) requires its accessory protein MRAP for
    trafficking from the endoplasmic reticulum to the plasma membrane and for
    ACTH binding and Gs-coupled signal transduction. Biallelic loss-of-function
    variants in either MC2R (FGD1) or MRAP (FGD2) abolish or markedly reduce
    functional ACTH receptor signaling despite structurally intact
    adrenocortical cells.
  molecular_functions:
  - preferred_term: corticotropin receptor activity
    term:
      id: GO:0004978
      label: corticotropin receptor activity
    modifier: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: cortical cell of adrenal gland
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  downstream:
  - target: Impaired Adrenocortical Cortisol Biosynthesis
    description: >-
      Without functional ACTH receptor signaling, the cAMP-PKA cascade that
      normally drives steroidogenic enzyme expression in the zona fasciculata
      is not activated, so cortisol output fails despite an intact cell mass.
    evidence:
    - reference: PMID:19558534
      reference_title: "Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The biochemical findings are a markedly elevated plasma ACTH in the presence of low cortisol but with a preserved mineralocorticoid production and are characteristic of ACTH insensitivity."
      explanation: Documents the biochemical signature (high ACTH, low cortisol, preserved mineralocorticoid) resulting from ACTH receptor signaling failure.
  evidence:
  - reference: PMID:15654338
    reference_title: "Mutations in MRAP, encoding a new interacting partner of the ACTH receptor, cause familial glucocorticoid deficiency type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that MRAP interacts with MC2R and may have a role in the trafficking of MC2R from the endoplasmic reticulum to the cell surface."
    explanation: Establishes the MC2R-MRAP receptor complex and its dependence on MRAP for surface trafficking.
  - reference: PMID:19558534
    reference_title: "Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRAP is required in the earliest stages of MC2R processing and in the absence of MRAP protein, the receptor is retained within the ER."
    explanation: Describes the ER-retention mechanism underlying complete loss of receptor signaling in FGD2.
- name: STAR-Mediated Cholesterol Transport Deficiency
  biological_scale: MOLECULAR
  description: >-
    STAR (steroidogenic acute regulatory protein) mediates the rate-limiting
    transfer of cholesterol from the outer to inner mitochondrial membrane in
    adrenocortical cells, the substrate-delivery step that precedes all
    steroidogenic enzyme reactions. Partial-function STAR missense mutations
    (FGD3) reduce but do not abolish this cholesterol transport, sufficiently
    to compromise cortisol output while sparing gonadal steroidogenesis and
    mineralocorticoid production (unlike complete STAR loss, which abolishes
    transport in both the adrenal and gonad).
  molecular_functions:
  - preferred_term: cholesterol transfer activity
    term:
      id: GO:0120020
      label: cholesterol transfer activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: intracellular cholesterol transport
    term:
      id: GO:0032367
      label: intracellular cholesterol transport
    modifier: DECREASED
  cell_types:
  - preferred_term: cortical cell of adrenal gland
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  downstream:
  - target: Impaired Adrenocortical Cortisol Biosynthesis
    description: >-
      Reduced mitochondrial cholesterol delivery limits substrate available
      to the steroidogenic enzyme cascade, lowering cortisol output.
    evidence:
    - reference: PMID:19773404
      reference_title: "Nonclassic lipoid congenital adrenal hyperplasia masquerading as familial glucocorticoid deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations in STAR usually cause lipoid congenital adrenal hyperplasia, a disorder characterized by both gonadal and adrenal steroid deficiency. Our results demonstrate that certain mutations in STAR (R192C and the previously reported R188C) can present with a phenotype indistinguishable from that seen in FGD."
      explanation: Links partial-function STAR mutations to an FGD-type isolated cortisol deficiency, distinct from complete STAR loss.
  evidence:
  - reference: PMID:19773404
    reference_title: "Nonclassic lipoid congenital adrenal hyperplasia masquerading as familial glucocorticoid deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified homozygous STAR mutations in this patient and his affected siblings."
    explanation: Identifies homozygous STAR mutations underlying this FGD3 kindred.
- name: Adrenocortical Mitochondrial Antioxidant Defense Failure
  biological_scale: MOLECULAR
  description: >-
    NNT (nicotinamide nucleotide transhydrogenase) uses the mitochondrial
    proton gradient to generate high concentrations of NADPH, which TXNRD2
    (thioredoxin reductase 2) and glutathione peroxidases require to detoxify
    reactive oxygen species by maintaining a high reduced-to-oxidized
    glutathione (GSH/GSSG) ratio. Biallelic loss-of-function variants in
    either NNT (FGD4) or TXNRD2 (FGD5) impair this antioxidant axis
    specifically in adrenocortical mitochondria, without affecting ACTH
    receptor signaling itself.
  molecular_functions:
  - preferred_term: proton-translocating NAD(P)+ transhydrogenase activity
    term:
      id: GO:0008750
      label: proton-translocating NAD(P)+ transhydrogenase activity
    modifier: LOSS_OF_FUNCTION
  - preferred_term: thioredoxin-disulfide reductase (NADPH) activity
    term:
      id: GO:0004791
      label: thioredoxin-disulfide reductase (NADPH) activity
    modifier: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: cortical cell of adrenal gland
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  downstream:
  - target: Adrenocortical Oxidative Stress and Apoptosis
    description: >-
      Loss of NADPH-dependent glutathione/thioredoxin recycling capacity
      raises reactive oxygen species and lowers the GSH/GSSG ratio in
      adrenocortical mitochondria.
    evidence:
    - reference: PMID:22634753
      reference_title: "Mutations in NNT encoding nicotinamide nucleotide transhydrogenase cause familial glucocorticoid deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "NNT knockdown in a human adrenocortical cell line resulted in impaired redox potential and increased reactive oxygen species (ROS) levels."
      explanation: Human adrenocortical cell-line knockdown directly links NNT loss to increased ROS and impaired redox potential.
  evidence:
  - reference: PMID:22634753
    reference_title: "Mutations in NNT encoding nicotinamide nucleotide transhydrogenase cause familial glucocorticoid deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Detoxification in mitochondria of reactive oxygen species (ROS) by glutathione peroxidases depends on this NADPH for regeneration of reduced glutathione (GSH) from oxidized glutathione (GSSG) to maintain a high GSH/GSSG ratio"
    explanation: Describes the NADPH-dependent antioxidant mechanism disrupted by NNT loss.
  - reference: PMID:24601690
    reference_title: "Thioredoxin Reductase 2 (TXNRD2) mutation associated with familial glucocorticoid deficiency (FGD)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TXNRD2 deficiency leads to impaired redox homeostasis in a human adrenocortical cell line."
    explanation: Confirms TXNRD2 loss also impairs adrenocortical redox homeostasis, mechanistically paralleling NNT loss.
- name: Adrenocortical Oxidative Stress and Apoptosis
  biological_scale: CELLULAR
  description: >-
    Unchecked accumulation of reactive oxygen species in adrenocortical
    mitochondria drives zona fasciculata cell apoptosis and progressive cell
    loss, a mechanistically distinct route to glucocorticoid deficiency from
    the receptor-signaling-failure forms (FGD1-3), since the ACTH receptor
    and its downstream signaling cascade remain structurally intact.
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  cell_types:
  - preferred_term: cortical cell of adrenal gland
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  downstream:
  - target: Impaired Adrenocortical Cortisol Biosynthesis
    description: >-
      Progressive loss of zona fasciculata cells reduces the functional
      steroidogenic cell mass available to synthesize cortisol.
    evidence:
    - reference: PMID:22634753
      reference_title: "Mutations in NNT encoding nicotinamide nucleotide transhydrogenase cause familial glucocorticoid deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mice with Nnt loss, higher levels of adrenocortical cell apoptosis and impaired glucocorticoid production were observed."
      explanation: Mouse Nnt-loss model links increased adrenocortical apoptosis directly to impaired glucocorticoid production.
  evidence:
  - reference: PMID:24601690
    reference_title: "Thioredoxin Reductase 2 (TXNRD2) mutation associated with familial glucocorticoid deficiency (FGD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently FGD cases caused by mutations in the mitochondrial antioxidant, nicotinamide nucleotide transhydrogenase, have highlighted the importance of redox regulation in steroidogenesis."
    explanation: Frames oxidative-stress-driven adrenocortical failure as a distinct mechanistic class within FGD.
- name: Adrenocortical Replicative Stress and Impaired Steroidogenic Cell Differentiation
  biological_scale: CELLULAR
  description: >-
    MCM4 is part of the MCM2-7 complex, the core replicative helicase required
    for normal DNA replication and genome stability in eukaryotic cells.
    Biallelic loss-of-function MCM4 variants define a third mechanistic route
    to adrenocortical failure, distinct from both ACTH-receptor-signaling
    failure (FGD1-3) and oxidative-stress-driven apoptosis of mature
    steroidogenic cells (FGD4-5): Mcm4-depleted mouse adrenal cortex shows
    grossly abnormal morphology, with non-steroidogenic GATA4- and
    Gli1-positive cells persisting within the cortex and reducing the number
    of cells that differentiate into steroidogenic zona fasciculata cells.
  biological_processes:
  - preferred_term: DNA replication
    term:
      id: GO:0006260
      label: DNA replication
    modifier: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: cortical cell of adrenal gland
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  downstream:
  - target: Impaired Adrenocortical Cortisol Biosynthesis
    description: >-
      Fewer cells differentiate into steroidogenic zona fasciculata cells,
      reducing the functional cortisol-producing cell mass available for
      steroidogenesis.
    evidence:
    - reference: PMID:22354170
      reference_title: "MCM4 mutation causes adrenal failure, short stature, and natural killer cell deficiency in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "histological studies with Mcm4-depleted mice showed grossly abnormal adrenal morphology that was characterized by non-steroidogenic GATA4- and Gli1-positive cells within the steroidogenic cortex, which reduced the number of steroidogenic cells in the zona fasciculata of the adrenal cortex"
      explanation: Mouse model shows the developmental mechanism by which MCM4 loss reduces the number of steroidogenic cells in the zona fasciculata.
  evidence:
  - reference: PMID:22354170
    reference_title: "MCM4 mutation causes adrenal failure, short stature, and natural killer cell deficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since MCM4 is one part of a MCM2-7 complex recently confirmed as the replicative helicase essential for normal DNA replication and genome stability in all eukaryotes, it is possible that our patients may have an increased risk of neoplastic change."
    explanation: Establishes MCM4's role in the replicative helicase complex, framing the replicative/genomic-stress mechanism as distinct from the receptor and redox routes.
  - reference: PMID:23279877
    reference_title: "Familial glucocorticoid deficiency: New genes and mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These latest findings expand the spectrum of pathogenetic mechanisms causing adrenal disease and imply that the adrenal may be hypersensitive to replicative and oxidative stresses."
    explanation: Review frames replicative stress (MCM4) alongside oxidative stress (NNT) as the two newly recognized non-receptor mechanistic routes in FGD.
- name: Impaired Adrenocortical Cortisol Biosynthesis
  biological_scale: TISSUE
  description: >-
    Convergent endpoint of both mechanistic routes: whether ACTH signaling
    fails at the receptor (FGD1-3) or redox-competent zona fasciculata cells
    are progressively lost (FGD4-5), net cortisol output from the adrenal
    cortex falls, producing the shared biochemical and clinical phenotype of
    FGD.
  downstream:
  - target: Loss of Cortisol-Mediated Negative Feedback and Compensatory ACTH Hypersecretion
    description: >-
      Failure of cortisol production removes the principal negative-feedback
      signal on the hypothalamic-pituitary-adrenal axis.
    evidence:
    - reference: PMID:19558534
      reference_title: "Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "characterized by elevated plasma ACTH, and low or undetectable cortisol in the absence of overt mineralocorticoid deficiency"
      explanation: Documents the combination of low cortisol and reflexively elevated ACTH that defines the FGD biochemical phenotype.
  - target: Decreased circulating cortisol level
    description: >-
      Impaired cortisol biosynthesis directly produces the low or
      undetectable serum cortisol that is the core biochemical phenotype of
      FGD, unresponsive to exogenous ACTH stimulation.
    evidence:
    - reference: PMID:19558534
      reference_title: "Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "characterized by elevated plasma ACTH, and low or undetectable cortisol in the absence of overt mineralocorticoid deficiency"
      explanation: States low/undetectable cortisol as the direct biochemical consequence of impaired cortisol biosynthesis.
  - target: Hypoglycemia
    description: >-
      Cortisol is required for hepatic gluconeogenesis and counter-regulatory
      glucose defense, so impaired cortisol biosynthesis produces hypoglycemia,
      a presenting and potentially life-threatening feature.
    evidence:
    - reference: PMID:22634753
      reference_title: "Mutations in NNT encoding nicotinamide nucleotide transhydrogenase cause familial glucocorticoid deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients typically present within the first few months of life with symptoms related to cortisol deficiency including recurrent illnesses/infections, hypoglycaemia, convulsions, failure to thrive and shock."
      explanation: Lists hypoglycemia among the symptoms directly attributed to cortisol deficiency.
  - target: Failure to thrive
    description: >-
      Cortisol deficiency impairs growth and metabolic homeostasis in
      infancy, producing failure to thrive as part of the classic
      presentation.
    evidence:
    - reference: PMID:22634753
      reference_title: "Mutations in NNT encoding nicotinamide nucleotide transhydrogenase cause familial glucocorticoid deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients typically present within the first few months of life with symptoms related to cortisol deficiency including recurrent illnesses/infections, hypoglycaemia, convulsions, failure to thrive and shock."
      explanation: Lists failure to thrive among the symptoms directly attributed to cortisol deficiency.
  - target: Recurrent or severe infections
    description: >-
      Loss of cortisol's role in immune and metabolic homeostasis increases
      susceptibility to recurrent or overwhelming infection, historically a
      cause of mortality in undiagnosed FGD.
    evidence:
    - reference: PMID:15654338
      reference_title: "Mutations in MRAP, encoding a new interacting partner of the ACTH receptor, cause familial glucocorticoid deficiency type 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Affected individuals are deficient in cortisol and, if untreated, are likely to succumb to hypoglycemia or overwhelming infection in infancy or childhood."
      explanation: Documents overwhelming infection as a life-threatening consequence of cortisol deficiency.
  evidence:
  - reference: PMID:19558534
    reference_title: "Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The biochemical findings are a markedly elevated plasma ACTH in the presence of low cortisol but with a preserved mineralocorticoid production and are characteristic of ACTH insensitivity."
    explanation: Summarizes the convergent biochemical phenotype of impaired cortisol biosynthesis across FGD subtypes.
- name: Preserved Zona Glomerulosa Mineralocorticoid Production
  biological_scale: TISSUE
  description: >-
    The zona glomerulosa (aldosterone-producing layer of the adrenal cortex,
    UBERON:0002053) is regulated principally by the renin-angiotensin-potassium
    axis rather than by ACTH, so it is functionally spared in FGD even when
    the ACTH-dependent zona fasciculata (cortisol-producing layer) fails.
    This is the mechanistic basis for the normal plasma renin activity and
    serum aldosterone that distinguish FGD from combined-deficiency forms of
    primary adrenal insufficiency, such as autoimmune Addison disease,
    congenital adrenal hyperplasia, or classic (complete) STAR-null lipoid
    congenital adrenal hyperplasia, in which mineralocorticoid production is
    also lost.
  evidence:
  - reference: PMID:19558534
    reference_title: "Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The biochemical findings are a markedly elevated plasma ACTH in the presence of low cortisol but with a preserved mineralocorticoid production and are characteristic of ACTH insensitivity."
    explanation: States the preserved-mineralocorticoid-production biochemical hallmark that distinguishes FGD from combined adrenal insufficiency.
- name: Loss of Cortisol-Mediated Negative Feedback and Compensatory ACTH Hypersecretion
  biological_scale: ORGANISM
  description: >-
    Absent cortisol negative feedback on the hypothalamus and pituitary
    corticotrophs drives markedly elevated plasma ACTH and other
    proopiomelanocortin (POMC)-derived peptides, including
    melanocyte-stimulating hormone activity, producing the characteristic
    generalized hyperpigmentation of FGD as well as the risk of
    hypoglycemia, failure to thrive, and susceptibility to infection that
    define the untreated clinical course.
  downstream:
  - target: Hyperpigmentation
    description: >-
      Markedly elevated ACTH and other POMC-derived peptides, including
      melanocyte-stimulating hormone activity, act on melanocortin 1
      receptors in melanocytes to produce generalized hyperpigmentation.
    evidence:
    - reference: PMID:19558534
      reference_title: "Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "patients usually present with hypoglycaemia, seizure, jaundice, hyperpigmentation, failure to thrive and frequent or severe infections"
      explanation: Lists hyperpigmentation among the classic presenting features driven by compensatory ACTH hypersecretion.
  - target: Increased circulating ACTH level
    description: >-
      Loss of cortisol-mediated negative feedback on the hypothalamic-pituitary
      axis is the direct cause of the markedly elevated plasma ACTH that
      defines this biochemical phenotype.
    evidence:
    - reference: PMID:19558534
      reference_title: "Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The biochemical findings are a markedly elevated plasma ACTH in the presence of low cortisol but with a preserved mineralocorticoid production and are characteristic of ACTH insensitivity."
      explanation: Documents markedly elevated plasma ACTH as the direct readout of lost negative feedback.
  evidence:
  - reference: PMID:15654338
    reference_title: "Mutations in MRAP, encoding a new interacting partner of the ACTH receptor, cause familial glucocorticoid deficiency type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals are deficient in cortisol and, if untreated, are likely to succumb to hypoglycemia or overwhelming infection in infancy or childhood."
    explanation: Documents the clinical consequences of unopposed cortisol deficiency if the compensatory HPA response is not corrected by treatment.
  - reference: PMID:22634753
    reference_title: "Mutations in NNT encoding nicotinamide nucleotide transhydrogenase cause familial glucocorticoid deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients typically present within the first few months of life with symptoms related to cortisol deficiency including recurrent illnesses/infections, hypoglycaemia, convulsions, failure to thrive and shock."
    explanation: Documents the classic presenting symptom complex of FGD driven by cortisol deficiency.

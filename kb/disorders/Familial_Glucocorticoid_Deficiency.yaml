name: Familial Glucocorticoid Deficiency
creation_date: "2026-08-26T00:00:00Z"
category: Mendelian
synonyms:
- Hereditary unresponsiveness to ACTH
- Familial ACTH resistance
- ACTH resistance syndrome
- Isolated glucocorticoid deficiency
- GCCD
description: >-
  Familial glucocorticoid deficiency (FGD) is a genetically heterogeneous
  group of autosomal recessive primary adrenal insufficiency disorders
  characterized by isolated failure of cortisol production in response to
  adrenocorticotropic hormone (ACTH), with classically preserved
  mineralocorticoid (aldosterone) secretion, because the aldosterone-producing
  zona glomerulosa is regulated principally by the renin-angiotensin system
  rather than by ACTH. Affected infants and children present with
  hypoglycemia, generalized hyperpigmentation (driven by markedly elevated
  ACTH and other POMC-derived peptides), failure to thrive, and recurrent or
  severe infections; unlike combined glucocorticoid-and-mineralocorticoid
  primary adrenal insufficiency, salt-wasting, hyponatremia, and hyperkalemia
  are characteristically absent. Two mechanistically distinct routes converge
  on the same endocrine endpoint: failure of ACTH receptor signaling itself
  (MC2R, the ACTH receptor, and its obligate trafficking chaperone MRAP,
  together accounting for roughly 45% of cases, plus partial-function
  mutations in STAR, the rate-limiting cholesterol-transport step of
  steroidogenesis) versus adrenocortical cell loss from failure of
  mitochondrial antioxidant defense (NNT and TXNRD2), in which the receptor
  and its signaling cascade remain structurally intact but zona fasciculata
  cells progressively die from unchecked oxidative stress. Partial-function
  STAR mutations causing this phenotype (historically labeled FGD type 3) are
  distinct from the severe, combined adrenal-and-gonadal steroidogenic
  failure caused by classic STAR-null lipoid congenital adrenal hyperplasia. A
  third, mechanistically distinct route arises from biallelic loss-of-function
  mutations in MCM4, a component of the MCM2-7 replicative helicase essential
  for genome stability; the full MCM4-related phenotype additionally includes
  growth failure, increased chromosomal breakage, and natural killer (NK) cell
  deficiency (natural killer cell and glucocorticoid deficiency with DNA
  repair defect, NKGCD), extra-adrenal features that place it partly outside
  the isolated-FGD phenotype spectrum modeled here, so only its adrenocortical
  mechanism is curated on this entry. A substantial minority of FGD cases
  remain genetically unresolved even after accounting for MC2R, MRAP, STAR,
  NNT, TXNRD2, and MCM4. Lifelong glucocorticoid replacement corrects the
  cortisol deficiency and reverses the associated excessive linear growth seen
  in FGD type 1; mineralocorticoid replacement is not required.

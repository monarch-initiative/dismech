classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    All molecularly defined forms of FGD (MC2R, MRAP, STAR, NNT, TXNRD2) are
    inherited in an autosomal recessive manner; affected individuals carry
    biallelic (homozygous or compound heterozygous) pathogenic variants,
    frequently in the setting of parental consanguinity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:15654338
    reference_title: "Mutations in MRAP, encoding a new interacting partner of the ACTH receptor, cause familial glucocorticoid deficiency type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial glucocorticoid deficiency (FGD), or hereditary unresponsiveness to adrenocorticotropin (ACTH; OMIM 202200), is an autosomal recessive disorder resulting from resistance to the action of ACTH on the adrenal cortex, which stimulates glucocorticoid production."
    explanation: Establishes the autosomal recessive inheritance pattern and the core ACTH-resistance mechanism defining FGD.
  - reference: PMID:8094489
    reference_title: "Familial glucocorticoid deficiency associated with point mutation in the adrenocorticotropin receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial glucocorticoid deficiency is an uncommon disorder that appears to be due to congenital insensitivity or resistance to adrenocorticotropin (ACTH), and is usually inherited in an autosomal recessive pattern."
    explanation: Describes the original MC2R kindred, confirming autosomal recessive segregation.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    FGD is a rare disorder; no robust numeric population prevalence estimate
    is established. A 15-year single tertiary referral center series
    (1993-2008) identified only 164 patients referred with a clinical
    diagnosis of FGD across all genetic subtypes, consistent with rarity.
  evidence:
  - reference: PMID:19558534
    reference_title: "Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One hundred and sixty-four patients were referred to us from 1993 to 2008 for genetic screening with a clinical diagnosis of FGD"
    explanation: Quantifies the rarity of FGD via a long-running specialist referral cohort.
has_subtypes:
- name: FGD1
  display_name: FGD1 (MC2R-Related)
  subtype_term:
    preferred_term: glucocorticoid deficiency 1
    term:
      id: MONDO:0024536
      label: glucocorticoid deficiency 1
  description: >-
    Caused by biallelic loss-of-function mutations in MC2R, the ACTH receptor
    itself, accounting for approximately 25% of FGD cases; the founding
    example is the c.220G>T (Ser74Ile) missense mutation in the second
    transmembrane domain. Most MC2R mutations are missense variants with
    varying degrees of impaired trafficking to the cell surface, often
    leaving some residual receptor function. Distinguished clinically from
    FGD2 by a later, more variable age of presentation (median 2.0 years) and
    unusually tall stature not seen in FGD2.
  evidence:
  - reference: PMID:8094489
    reference_title: "Familial glucocorticoid deficiency associated with point mutation in the adrenocorticotropin receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected male proband showed a single base mutation, ser74-->ile, in the sequence coding for the second transmembrane domain of the ACTH receptor."
    explanation: Describes the original MC2R point mutation identified as the cause of FGD1.
  - reference: PMID:19558534
    reference_title: "Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FGD resulting from MC2R mutations accounts for ∼25% of all FGD and is now known as FGD type 1"
    explanation: Quantifies the proportion of FGD cases attributable to MC2R mutations.
- name: FGD2
  display_name: FGD2 (MRAP-Related)
  subtype_term:
    preferred_term: glucocorticoid deficiency 2
    term:
      id: MONDO:0011826
      label: glucocorticoid deficiency 2
  description: >-
    Caused by biallelic loss-of-function mutations in MRAP, the single-pass
    transmembrane accessory protein required for trafficking MC2R from the
    endoplasmic reticulum to the cell surface; accounts for approximately
    20% of FGD cases. Reported MRAP mutations are predominantly splice-site
    or nonsense variants predicted to abolish the transmembrane domain
    essential for MC2R interaction, so MC2R is retained in the ER rather than
    reaching the plasma membrane. Presents earlier than FGD1 (median age 0.08
    years) and, unlike FGD1, is not associated with tall stature.
  evidence:
  - reference: PMID:15654338
    reference_title: "Mutations in MRAP, encoding a new interacting partner of the ACTH receptor, cause familial glucocorticoid deficiency type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that MRAP interacts with MC2R and may have a role in the trafficking of MC2R from the endoplasmic reticulum to the cell surface."
    explanation: Establishes MRAP's role as the MC2R trafficking chaperone whose loss causes FGD2.
  - reference: PMID:19558534
    reference_title: "Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and this accounts for ∼20% of FGD and is now known as FGD type 2."
    explanation: Quantifies the proportion of FGD cases attributable to MRAP mutations.
  - reference: PMID:19558534
    reference_title: "Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRAP is required in the earliest stages of MC2R processing and in the absence of MRAP protein, the receptor is retained within the ER."
    explanation: Describes the ER-retention mechanism by which MRAP loss abolishes MC2R surface expression.
- name: FGD3
  display_name: FGD3 (STAR-Related, Partial Function)
  subtype_term:
    preferred_term: glucocorticoid deficiency 3
    term:
      id: MONDO:0012214
      label: glucocorticoid deficiency 3
  description: >-
    Originally defined by linkage of unexplained FGD (unlinked to MC2R or
    MRAP) to a locus on chromosome 8, subsequently resolved as certain
    partial-function missense mutations (e.g., R192C, R188C) in STAR,
    encoding the steroidogenic acute regulatory protein that mediates the
    rate-limiting transfer of cholesterol across mitochondrial membranes for
    steroidogenesis; accounts for approximately 5-10% of FGD. This is
    distinct from classic, complete STAR loss-of-function, which instead
    causes lipoid congenital adrenal hyperplasia with combined adrenal and
    gonadal steroidogenic failure and disordered sex development in 46,XY
    individuals; the partial-function FGD3 variants retain enough residual
    StAR activity in the adrenal to spare mineralocorticoid and gonadal
    steroidogenesis while cortisol production still fails.
  evidence:
  - reference: PMID:19773404
    reference_title: "Nonclassic lipoid congenital adrenal hyperplasia masquerading as familial glucocorticoid deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A locus on chromosome 8 has previously been linked to the disease in three families, but no underlying gene defect has to date been identified."
    explanation: Documents the historical chromosome 8-linked, gene-unresolved status of FGD3 prior to STAR identification.
  - reference: PMID:19773404
    reference_title: "Nonclassic lipoid congenital adrenal hyperplasia masquerading as familial glucocorticoid deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in STAR usually cause lipoid congenital adrenal hyperplasia, a disorder characterized by both gonadal and adrenal steroid deficiency. Our results demonstrate that certain mutations in STAR (R192C and the previously reported R188C) can present with a phenotype indistinguishable from that seen in FGD."
    explanation: Establishes that specific partial-function STAR mutations cause an FGD-indistinguishable phenotype, distinct from classic lipoid CAH.
  - reference: PMID:30817990
    reference_title: "Isolated glucocorticoid deficiency: Genetic causes and animal models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primarily there are three established subtypes of the disease: FGD 1, FGD2 and FGD3 corresponding to mutations in the Melanocortin 2 receptor MC2R (25%), Melanocortin 2 receptor accessory protein MRAP (20%), and Steroidogenic acute regulatory protein STAR (5-10%) respectively."
    explanation: Quantifies the proportion of FGD attributable to STAR (FGD3) alongside MC2R and MRAP.
- name: FGD4
  display_name: FGD4 (NNT-Related)
  subtype_term:
    preferred_term: glucocorticoid deficiency 4
    term:
      id: MONDO:0013874
      label: glucocorticoid deficiency 4
  description: >-
    Caused by biallelic loss-of-function mutations in NNT, encoding
    nicotinamide nucleotide transhydrogenase, an inner mitochondrial membrane
    enzyme that generates NADPH from the mitochondrial proton gradient; NADPH
    is required to regenerate reduced glutathione for detoxification of
    reactive oxygen species. Loss of NNT function causes oxidative-stress-driven
    adrenocortical cell apoptosis rather than a primary defect of ACTH
    receptor signaling, distinguishing this mechanistic route from FGD1-3.
  evidence:
  - reference: PMID:22634753
    reference_title: "Mutations in NNT encoding nicotinamide nucleotide transhydrogenase cause familial glucocorticoid deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using targeted exome sequencing, we identified mutations in NNT, an antioxidant defense gene, in individuals with familial glucocorticoid deficiency."
    explanation: Establishes NNT loss-of-function mutations as a genetic cause of FGD.
  - reference: PMID:22634753
    reference_title: "Mutations in NNT encoding nicotinamide nucleotide transhydrogenase cause familial glucocorticoid deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NNT knockdown in a human adrenocortical cell line resulted in impaired redox potential and increased reactive oxygen species (ROS) levels."
    explanation: Human adrenocortical cell line data mechanistically links NNT loss to impaired redox homeostasis.
- name: FGD5
  display_name: FGD5 (TXNRD2-Related)
  subtype_term:
    preferred_term: glucocorticoid deficiency 5
    term:
      id: MONDO:0040502
      label: glucocorticoid deficiency 5
  description: >-
    Caused by biallelic loss-of-function mutations in TXNRD2, encoding the
    mitochondrial selenoprotein thioredoxin reductase 2, which uses NADPH
    (generated in part via NNT) to reduce thioredoxin as part of the
    mitochondrial antioxidant defense system. Identified in a consanguineous
    kindred with a homozygous stop-gain mutation causing complete absence of
    TXNRD2 protein; the first reported human disease caused by loss of any
    component of the thioredoxin antioxidant system. Mechanistically grouped
    with FGD4 (NNT) as an oxidative-stress route to adrenocortical failure,
    distinct from the ACTH-receptor-signaling routes (FGD1-3).
  evidence:
  - reference: PMID:24601690
    reference_title: "Thioredoxin Reductase 2 (TXNRD2) mutation associated with familial glucocorticoid deficiency (FGD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A stop gain mutation, p.Y447X in TXNRD2, encoding the mitochondrial selenoprotein thioredoxin reductase 2 (TXNRD2) was identified and segregated with disease in this extended kindred."
    explanation: Identifies the causal TXNRD2 mutation and its segregation with the FGD5 phenotype.
  - reference: PMID:24601690
    reference_title: "Thioredoxin Reductase 2 (TXNRD2) mutation associated with familial glucocorticoid deficiency (FGD)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TXNRD2 deficiency leads to impaired redox homeostasis in a human adrenocortical cell line."
    explanation: Functional cell-line data linking TXNRD2 loss to impaired adrenocortical redox homeostasis.

differential_diagnoses:
- name: Triple A (Allgrove) Syndrome
  description: >-
    The classic clinical differential for FGD: also presents with ACTH-resistant
    primary adrenal insufficiency and preserved mineralocorticoid production,
    caused by biallelic AAAS variants (a nuclear pore complex protein), but is
    distinguished by the additional cardinal features of esophageal achalasia
    and alacrima, plus progressive neurological involvement not seen in
    isolated FGD.
  distinguishing_features:
  - Esophageal achalasia is a defining feature of Triple A syndrome, absent in FGD.
  - Alacrima (deficient tear production) is a defining feature of Triple A syndrome, absent in FGD.
  - Progressive peripheral/central neuropathy or cerebellar ataxia occur in Triple A syndrome but not isolated FGD.
  - AAAS sequencing distinguishes the two when the clinical triad of Triple A syndrome is incomplete.
  evidence:
  - reference: PMID:22634753
    reference_title: "Mutations in NNT encoding nicotinamide nucleotide transhydrogenase cause familial glucocorticoid deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of particular relevance to our patients is Triple A syndrome (OMIM 231550)"
    explanation: The NNT/FGD4 discovery paper explicitly identifies Triple A syndrome as the closest relevant differential, sharing an oxidative-stress mechanistic theme.
- name: Autoimmune Addison Disease and Other Combined-Deficiency Causes of Chronic Primary Adrenal Insufficiency
  description: >-
    Autoimmune Addison disease and other causes of combined-deficiency
    chronic primary adrenal insufficiency (e.g., adrenoleukodystrophy, adrenal
    hemorrhage, infiltrative or infectious adrenalitis) present with cortisol
    deficiency and hyperpigmentation similarly to FGD, but additionally lose
    zona glomerulosa (aldosterone) function, producing hyponatremia,
    hyperkalemia, salt-wasting, and compensatory hyperreninemia that are
    absent in FGD. FGD itself sits within the broader chronic primary adrenal
    insufficiency umbrella (see `parents`) as its isolated-glucocorticoid,
    genetic-only branch; this differential names the combined-deficiency
    causes within that same umbrella that must be excluded, of which
    autoimmune Addison disease (`kb/disorders/Addisons_Disease.yaml`) is the
    most common.
  disease_term:
    preferred_term: autoimmune primary adrenal insufficiency
    term:
      id: MONDO:0100480
      label: autoimmune primary adrenal insufficiency
  distinguishing_features:
  - Elevated plasma renin activity (compensatory hyperreninemia) occurs in combined-deficiency primary adrenal insufficiency but not FGD.
  - Decreased aldosterone (mineralocorticoid deficiency) occurs in combined-deficiency primary adrenal insufficiency but not FGD.
  - Hyponatremia, hyperkalemia, and salt-wasting occur in combined-deficiency primary adrenal insufficiency but not FGD.
  evidence:
  - reference: PMID:19558534
    reference_title: "Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by elevated plasma ACTH, and low or undetectable cortisol in the absence of overt mineralocorticoid deficiency"
    explanation: States the preserved-mineralocorticoid criterion used to exclude combined-deficiency primary adrenal insufficiency in the FGD diagnostic cohort.
- name: Classic (STAR-Null) Lipoid Congenital Adrenal Hyperplasia
  description: >-
    Complete loss-of-function STAR mutations cause a severe, distinct
    disorder with combined adrenal and gonadal steroidogenic failure
    (glucocorticoid, mineralocorticoid, and sex steroid deficiency) and
    disordered sex development in 46,XY individuals, in contrast to the
    partial-function STAR mutations underlying FGD3, which spare
    mineralocorticoid and gonadal steroidogenesis.
  distinguishing_features:
  - Combined mineralocorticoid deficiency (salt-wasting) occurs in classic lipoid congenital adrenal hyperplasia but not FGD3.
  - Disordered sex development in 46,XY individuals occurs in classic lipoid congenital adrenal hyperplasia but not FGD3.
  evidence:
  - reference: PMID:19773404
    reference_title: "Nonclassic lipoid congenital adrenal hyperplasia masquerading as familial glucocorticoid deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in STAR usually cause lipoid congenital adrenal hyperplasia, a disorder characterized by both gonadal and adrenal steroid deficiency. Our results demonstrate that certain mutations in STAR (R192C and the previously reported R188C) can present with a phenotype indistinguishable from that seen in FGD."
    explanation: Directly contrasts the combined-deficiency phenotype of classic STAR loss with the FGD-like phenotype of partial-function STAR mutations.
treatments:
- name: Hydrocortisone Replacement Therapy
  description: >-
    Lifelong glucocorticoid replacement (typically hydrocortisone in
    children) corrects cortisol deficiency and is the mainstay of FGD
    treatment; unlike combined-deficiency primary adrenal insufficiency,
    mineralocorticoid replacement is not required because zona glomerulosa
    function is preserved. Adequate replacement also normalizes the
    excessive linear growth characteristic of untreated FGD type 1.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cortisol
      term:
        id: CHEBI:17650
        label: cortisol
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Impaired Adrenocortical Cortisol Biosynthesis
    treatment_effect: RESTORES
    description: >-
      Exogenous hydrocortisone substitutes directly for the deficient
      endogenous cortisol, regardless of which upstream route (receptor
      signaling failure, oxidative or replicative adrenocortical stress)
      caused the biosynthetic failure.
    evidence:
    - reference: PMID:15654338
      reference_title: "Mutations in MRAP, encoding a new interacting partner of the ACTH receptor, cause familial glucocorticoid deficiency type 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Affected individuals are deficient in cortisol and, if untreated, are likely to succumb to hypoglycemia or overwhelming infection in infancy or childhood."
      explanation: Establishes the life-saving necessity of glucocorticoid replacement in correcting the cortisol deficiency.
  - target: Loss of Cortisol-Mediated Negative Feedback and Compensatory ACTH Hypersecretion
    treatment_effect: INHIBITS
    description: >-
      Restoring circulating cortisol reinstates negative feedback on the
      hypothalamic-pituitary-adrenal axis, suppressing the compensatory ACTH
      hypersecretion and reversing the excessive linear growth it drives in
      FGD type 1.
    evidence:
    - reference: PMID:11012566
      reference_title: "Tall stature in familial glucocorticoid deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Growth charts suggest that the excessive growth is reduced to normal following the introduction of glucocorticoid replacement."
      explanation: Demonstrates that glucocorticoid replacement reverses the ACTH-driven excessive growth of FGD type 1, evidencing suppression of the upstream hypersecretion.
  evidence:
  - reference: PMID:11012566
    reference_title: "Tall stature in familial glucocorticoid deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Growth charts suggest that the excessive growth is reduced to normal following the introduction of glucocorticoid replacement."
    explanation: Demonstrates the clinical benefit of glucocorticoid replacement in normalizing the excessive growth of FGD type 1.
  - reference: PMID:15654338
    reference_title: "Mutations in MRAP, encoding a new interacting partner of the ACTH receptor, cause familial glucocorticoid deficiency type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals are deficient in cortisol and, if untreated, are likely to succumb to hypoglycemia or overwhelming infection in infancy or childhood."
    explanation: Establishes the life-saving necessity of glucocorticoid replacement in FGD.

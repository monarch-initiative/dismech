animal_models:
- name: Nnt-loss mouse
  species: Mouse
  genotype: Nnt loss-of-function (C57BL/6J-background Nnt-deficient line)
  description: >-
    Mice lacking functional Nnt were used to test whether loss of this
    NADPH-generating antioxidant enzyme reproduces the oxidative-stress route
    to adrenocortical failure identified in human FGD4 (NNT-related FGD).
  publication: PMID:22634753
  modeled_mechanisms:
  - target: Adrenocortical Oxidative Stress and Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Nnt-loss mice show increased adrenocortical cell apoptosis and impaired
      glucocorticoid production, recapitulating the oxidative-stress-driven
      cell-loss mechanism proposed for human NNT-related FGD (FGD4).
    limitations: >-
      The widely used C57BL/6J substrain carries a spontaneous Nnt deletion,
      so mouse adrenal zonation, steroidogenic regulation, and lifespan differ
      from human; the mouse data establish increased apoptosis and reduced
      glucocorticoid output but do not by themselves reproduce the full human
      FGD4 phenotype (e.g., the specific hyperpigmentation/ACTH-resistance
      presentation).
    readouts:
    - name: Adrenocortical cell apoptosis
      target: Adrenocortical Oxidative Stress and Apoptosis
      direction: INCREASED
      interpretation: >-
        Increased apoptosis in Nnt-deficient mouse adrenal cortex supports
        oxidative stress as the driver of zona fasciculata cell loss in this
        mechanistic route.
      evidence:
      - reference: PMID:22634753
        reference_title: "Mutations in NNT encoding nicotinamide nucleotide transhydrogenase cause familial glucocorticoid deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In mice with Nnt loss, higher levels of adrenocortical cell apoptosis and impaired glucocorticoid production were observed."
        explanation: Reports the apoptosis and glucocorticoid-output measurements behind this readout.
    evidence:
    - reference: PMID:22634753
      reference_title: "Mutations in NNT encoding nicotinamide nucleotide transhydrogenase cause familial glucocorticoid deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mice with Nnt loss, higher levels of adrenocortical cell apoptosis and impaired glucocorticoid production were observed."
      explanation: Supports treating the Nnt-loss mouse as informative for the oxidative-stress-driven adrenocortical failure node.

name: Isolated Growth Hormone Deficiency Type IA
creation_date: "2026-08-22T04:35:00Z"
category: Endocrine
disease_term:
  preferred_term: isolated growth hormone deficiency type IA
  term:
    id: MONDO:0009876
    label: isolated growth hormone deficiency type IA
description: >-
  The most severe Mendelian form of isolated growth hormone deficiency: autosomal
  recessive, with complete absence of endogenous growth hormone and severe dwarfism by six
  months of age. Caused by severe loss-of-function lesions at GH1 - most often deletions,
  but also frameshift and nonsense mutations.

  What makes it worth curating as its own entity rather than as the severe end of a
  spectrum is that the same lesion causes the disease and the failure of its treatment.
  These patients have never been exposed to growth hormone, so they were never made
  tolerant to it. Given recombinant GH, many mount an antibody response against the
  hormone, and those antibodies can abolish the growth response the treatment was given
  for.

  The natural experiment that proves this is the heterozygote. A carrier with one deleted
  allele and one allele producing non-truncated protein makes GH, and is usually immune
  tolerant. Tolerance tracks the presence of endogenous hormone, not the genotype as such.

parents:
- Isolated Growth Hormone Deficiency
- Growth Hormone Deficiency

pathophysiology:

- name: GH1 Severe Loss-of-Function Lesion
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    GH1 lies on chromosome 17 and is expressed in the somatotrophs of the anterior
    pituitary. Type IA is defined by lesions that abolish bioactive GH entirely: deletions
    ranging from about 6.7 kb to 45 kb, and also frameshift and nonsense mutations.

    The definitional point matters for diagnosis. The entity is complete GH deficiency
    caused by severe loss-of-function at GH1, not "the deletion syndrome" - a patient with
    a homozygous nonsense mutation and no deletion has type IA, and a deletion-only
    definition would miss them.

    The deletions have an unusual origin: they recur through unequal meiotic recombination
    rather than descending from a common ancestral allele, so the same deletion appearing
    in unrelated families is not evidence of shared ancestry.
  molecular_functions:
  - preferred_term: hormone activity
    term:
      id: GO:0005179
      label: hormone activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:17551470
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GH1 gene deletions, frameshifts, or nonsense mutations cause complete absence of GH in
      IGHD 1A.
    explanation: >-
      The three lesion classes and their shared consequence, which is what this node models.
  - reference: PMID:17551470
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus IGHD 1A is best described as being complete GHD caused by severe loss of function
      GH1 gene mutations rather than being limited to only those having GH1 gene deletions.
    explanation: >-
      The definitional correction this node's description turns on - the entity is defined
      by functional completeness of the deficiency, not by mutation class.
  - reference: PMID:17551470
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, GH1 gene deletions are recurring mutations that can arise through
      unequal recombination in meiosis rather than by allele sharing through common descent.
    explanation: >-
      The mutational mechanism, which bears on how a recurrent deletion in unrelated
      families should be interpreted.
  - reference: PMID:7868072
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with IGHD type IA have heterogeneous deletions, ranging in size from 6.7
      kb to 45 kb, that encompass the entire gene encoding for pituitary GH, GH-1.
    explanation: >-
      The size range of the deletions, from an independent source.
  downstream:
  - target: Complete Absence of Endogenous Growth Hormone
    causal_link_type: DIRECT
    description: >-
      Loss of both functional alleles leaves no bioactive hormone.

- name: Complete Absence of Endogenous Growth Hormone
  role: central_effector
  biological_scale: ORGANISM
  description: >-
    The rate-limiting state, and the one from which both arms of this entry follow. It is
    what separates type IA from the other Mendelian forms: types IB, II and III all have
    diminished GH, type IA has none.

    Curating absence rather than deficiency as the central node is deliberate. A quantity
    that is reduced and a quantity that is zero behave differently in the immune system,
    and the difference is what the tolerance arm below depends on.
  evidence:
  - reference: PMID:7868072
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At least four Mendelian types of isolated GH deficiency (IGHD) have been delineated
      based on the mode of inheritance and the degree of GH deficiency: IGHD type IA,
      autosomal recessive with absent endogenous GH; type IB, autosomal recessive with
      diminished GH; type II, autosomal dominant with diminished GH; and type III, X-linked
      with diminished GH.
    explanation: >-
      Places type IA in the classification by the two axes that define it - inheritance and
      the completeness of the deficiency - and is the source for the absent-versus-diminished
      distinction this node rests on.
  downstream:
  - target: Loss of Growth Hormone Receptor Signalling
    causal_link_type: DIRECT
    description: >-
      No ligand, no signal. This is the growth arm.
  - target: Failure of Immune Tolerance to Growth Hormone
    causal_link_type: DIRECT
    description: >-
      Never having been exposed to the hormone, the immune system never became tolerant of
      it. This is the treatment-failure arm, and it is downstream of absence specifically
      rather than of deficiency.

- name: Loss of Growth Hormone Receptor Signalling
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Without ligand there is no growth hormone receptor signalling and no downstream
    generation of the growth-promoting response. Clinically this is unremarkable in the
    newborn period - length at birth may be short but need not be - and then declares
    itself decisively, with all affected individuals reaching severe dwarfism by six months.
  biological_processes:
  - preferred_term: growth hormone receptor signaling pathway
    term:
      id: GO:0060396
      label: growth hormone receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:17551470
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While affected individuals can have short lengths at birth and hypoglycemia in infancy,
      all develop severe dwarfism by six months of age.
    explanation: >-
      The natural history of this arm, including the early hypoglycaemia and the age by
      which the growth failure is universal.
  - reference: PMID:17551470
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although short stature, delayed growth velocity, and delayed skeletal maturation all
      occur with IGHD, none are specific for IGHD 1A.
    explanation: >-
      PARTIAL because it qualifies rather than supports - the growth phenotype is real but
      does not distinguish type IA from the milder forms, which is why the diagnosis rests
      on the molecular lesion.
  downstream:
  - target: Severe Short Stature
    causal_link_type: DIRECT
    description: >-
      The defining clinical consequence, universal by six months.
  - target: Hypoglycemia
    causal_link_type: DIRECT
    description: >-
      Growth hormone is a counter-regulatory hormone; its absence presents in infancy as
      hypoglycaemia, before the growth failure is apparent.
  - target: Delayed Skeletal Maturation
    causal_link_type: DIRECT
    description: >-
      Skeletal maturation lags with the growth failure.

- name: Failure of Immune Tolerance to Growth Hormone
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The arm that makes this disease distinctive. Because no growth hormone was ever
    present, the immune system never encountered it as self, and recombinant GH given
    therapeutically is seen as a foreign protein. Many patients develop anti-GH antibodies,
    and those antibodies can prevent the growth response the treatment was given to
    produce.

    The evidence that this is a tolerance failure rather than an idiosyncratic drug
    reaction is the carrier state. Heterozygotes with one deleted allele and one allele
    producing non-truncated protein have circulating GH and are usually immune tolerant -
    tolerance follows the presence of endogenous hormone, not the genotype. That is as
    close to a controlled comparison as a rare disease offers.
  evidence:
  - reference: PMID:17551470
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with IGHD 1A develop severe dwarfism in early infancy and often develop
      anti-GH antibodies after receiving exogenous GH.
    explanation: >-
      The antibody response and its trigger.
  - reference: PMID:17551470
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These antibodies can prevent the growth response expected from exogenous GH therapy.
    explanation: >-
      The clinical consequence - neutralisation of the therapy, not merely seroconversion.
  - reference: PMID:17551470
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals who are heterozygous for a GH1 gene deletion but whose other GH1 allele is
      not deleted and produces a non truncated product are usually immune tolerant.
    explanation: >-
      The natural experiment on which this node's mechanism rests. Carriers differ from
      patients in having endogenous hormone, and they are tolerant - which is what
      identifies absence of the antigen, rather than the mutation, as the cause of the
      antibody response.
  downstream:
  - target: Anti-Growth-Hormone Antibody Formation
    causal_link_type: DIRECT
    description: >-
      The serological expression of the tolerance failure, on exposure to exogenous hormone.

phenotypes:

- category: Growth
  name: Severe Short Stature
  description: >-
    Severe proportionate growth failure, universal by six months of age. Historically the
    condition was called sexual ateleiotic dwarfism and appears in older literature as a
    form of primordial dwarfism.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Severe short stature
    term:
      id: HP:0003510
      label: Severe short stature
    onset:
      onset_category: INFANTILE
  evidence:
  - reference: PMID:17551470
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While affected individuals can have short lengths at birth and hypoglycemia in infancy,
      all develop severe dwarfism by six months of age.
    explanation: >-
      "All develop" supports the VERY_FREQUENT band directly, and gives the age by which it
      is complete.

- category: Metabolic
  name: Hypoglycemia
  description: >-
    Infantile hypoglycaemia, reflecting the loss of growth hormone's counter-regulatory
    role. It can precede recognisable growth failure and is one of the few features that
    brings these infants to attention before six months.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Hypoglycemia
    term:
      id: HP:0001943
      label: Hypoglycemia
    onset:
      onset_category: INFANTILE
  evidence:
  - reference: PMID:17551470
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While affected individuals can have short lengths at birth and hypoglycemia in infancy,
      all develop severe dwarfism by six months of age.
    explanation: >-
      PARTIAL for the frequency claim specifically. The sentence contrasts "can have" for
      hypoglycaemia with "all develop" for the dwarfism, which supports a band below
      universal but does not quantify it; OCCASIONAL is the conservative reading of "can
      have" and no better source is cached.

- category: Skeletal
  name: Delayed Skeletal Maturation
  description: >-
    Bone age lags behind chronological age, as in growth hormone deficiency generally. Not
    specific to type IA.
  phenotype_term:
    preferred_term: Delayed skeletal maturation
    term:
      id: HP:0002750
      label: Delayed skeletal maturation
  evidence:
  - reference: PMID:17551470
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although short stature, delayed growth velocity, and delayed skeletal maturation all
      occur with IGHD, none are specific for IGHD 1A.
    explanation: >-
      Establishes the phenotype and, in the same sentence, its lack of diagnostic
      specificity.

- category: Immunological
  name: Anti-Growth-Hormone Antibody Formation
  description: >-
    Antibodies against growth hormone appearing after exogenous GH is started. Titre and
    binding capacity matter more than presence: high-titre antibodies produce secondary
    growth arrest, while low-binding-capacity antibodies have been observed alongside
    sustained catch-up growth for at least three years.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: anti-growth-hormone antibody formation
  evidence:
  - reference: PMID:17551470
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with IGHD 1A develop severe dwarfism in early infancy and often develop
      anti-GH antibodies after receiving exogenous GH.
    explanation: >-
      "Often develop" supports the FREQUENT band.
  - reference: PMID:9364351
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was treated with biosynthetic GH resulting in long-lasting catch-up growth during
      at least three years, despite a clinically irrelevant appearance of low binding
      capacity GH antibodies.
    explanation: >-
      PARTIAL because it is the counter-case: antibodies appeared and did not matter. Curated
      to prevent the entry reading as though seroconversion always means treatment failure.

genetic:

- name: GH1
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: GH1
    term:
      id: hgnc:4261
      label: GH1
  association: >-
    Biallelic severe loss-of-function lesions at GH1 on chromosome 17. Deletions of roughly
    6.7 to 45 kb are the commonest, and can extend beyond GH1 into the neighbouring
    chorionic somatomammotropin cluster; frameshift and nonsense mutations predicting
    complete absence of bioactive GH cause the same phenotype.
  evidence:
  - reference: PMID:17551470
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human Growth Hormone gene ( GH1 ) resides on chromosome 17q22-24 and it is expressed in
      somatotropic cells of the anterior pituitary gland.
    explanation: >-
      Locus and expression site.
  - reference: PMID:7868072
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonsense, frameshift and splice GH-1 mutations that predict a complete lack of
      bioactive GH synthesis in homozygotes have also been reported in association with IGHD
      IA.
    explanation: >-
      The non-deletional lesion classes, which is why the entity is defined functionally
      rather than by deletion.
  - reference: PMID:7877887
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Restriction endonuclease analysis revealed that the cause of hGH deficiency was a 45-kb
      gene deletion within the hGH-chorionic somatomammotropin (CS) gene cluster,
      encompassing the GH-1, CS-L, CS-A, and GH-2 genes.
    explanation: >-
      A worked example at the large end of the deletion range, showing the extent beyond GH1
      itself.

inheritance:

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic loss of function is required. The carrier state is not a mild form of the
    disease but is mechanistically informative in its own right, because one functioning
    allele confers immune tolerance to growth hormone - which is what identifies the
    antibody response in patients as a consequence of antigen absence.
  evidence:
  - reference: PMID:17551470
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most severe Mendelian form of IGHD, called IGHD IA, has an autosomal recessive mode
      of inheritance.
    explanation: >-
      The inheritance mode and the entity's position as the most severe Mendelian form.

treatments:

- name: Recombinant Human Growth Hormone Replacement
  description: >-
    Hormone replacement is the treatment, and in this disorder it is also the exposure that
    creates the second problem. Replacement produces catch-up growth where antibodies do
    not neutralise it; where they do, growth arrests secondarily.

    The Italian family in the cited series shows the range within a single genotype: three
    siblings with the same 45-kb deletion, two developing high-titre antibodies with
    secondary growth arrest, and the third growing normally with only very low-titre
    antibodies.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: growth hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_mechanisms:
  - target: Complete Absence of Endogenous Growth Hormone
    treatment_effect: RESTORES
    description: >-
      Supplies the missing hormone. Curated as acting on the absence node rather than on the
      receptor-signalling node below it, because replacement restores the ligand rather than
      the response - and because acting on that node is precisely what provokes the
      tolerance arm.
    evidence:
    - reference: PMID:9364351
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        She was treated with biosynthetic GH resulting in long-lasting catch-up growth during
        at least three years, despite a clinically irrelevant appearance of low binding
        capacity GH antibodies.
      explanation: >-
        Replacement working as intended over years, in a patient who seroconverted without
        clinical consequence.
  evidence:
  - reference: PMID:7877887
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two of the affected children developed high-titer anti-hGH antibodies after recombinant
      hGH treatment with secondary growth arrest, whereas the third one maintained normal
      growth in the presence of very low-titer antibodies.
    explanation: >-
      PARTIAL because it is simultaneously evidence for and against the treatment - the same
      therapy in three siblings with the same deletion, working in one and neutralised in
      two. This is the single most informative observation about this treatment in this
      disease.
  - reference: PMID:17551470
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These antibodies can prevent the growth response expected from exogenous GH therapy.
    explanation: >-
      The failure mode that is specific to this disorder rather than to growth hormone
      therapy generally.

discussions:

- discussion_id: gap_what_determines_neutralising_antibody
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do some patients with complete GH1 loss develop neutralising anti-GH antibodies on
    replacement while others, with the same deletion, do not?
  attaches_to:
  - pathophysiology#Failure of Immune Tolerance to Growth Hormone
  - treatments#Recombinant Human Growth Hormone Replacement
  rationale: >-
    The tolerance account explains why patients with no endogenous hormone are at risk and
    carriers are not. It does not explain the variation among patients who all have none.

    The sharpest form of the question is the Italian sibship: three children, one 45-kb
    deletion, two with high-titre antibodies and secondary growth arrest and one growing
    normally with very low titres. Genotype is held constant and the outcome differs, which
    was the point the original report made in calling this the first description of
    phenotypic heterogeneity in antibody formation within such a family. A separate patient
    with a 7.0-kb deletion seroconverted with low binding capacity and grew for at least
    three years.

    So titre and binding capacity, not seroconversion, determine whether therapy fails - and
    nothing curated here predicts which a given patient will develop. The candidates are not
    distinguished by the cited evidence: HLA background, residual expression from a
    partially retained locus in smaller deletions, differences in the preparation or
    schedule of the recombinant hormone, or the age at which exposure begins.

    The practical stake is that this is a treatable disease whose treatment fails
    unpredictably in a subset, and there is currently no way to identify that subset before
    starting.
  proposed_experiments:
  - experiment_id: genotype_stratified_antibody_cohort
    name: Deletion-size-stratified prospective antibody surveillance on GH replacement
    description: >-
      Follow anti-GH antibody titre and binding capacity prospectively from the start of
      replacement in patients stratified by lesion class - large deletion, small deletion,
      nonsense or frameshift - with HLA typing and growth velocity as outcomes. If antibody
      outcome tracks residual locus content rather than HLA, the mechanism is antigen
      exposure; if it tracks HLA, it is presentation.

notes: >-
  Why this is its own entry rather than the severe tail of a spectrum. Isolated growth
  hormone deficiency has at least four Mendelian forms distinguished by inheritance and by
  the degree of deficiency, and type IA is the only one with complete absence of endogenous
  hormone. That is not a difference of degree for the immune system: the tolerance arm
  curated here follows from absence specifically, and it is what makes the entity's
  treatment behave unlike treatment of the milder forms.

  The mirror lesion is already in this knowledge base. Growth_Hormone_Insensitivity_Syndrome
  (Laron syndrome) is the receptor-side defect - growth hormone is present, often elevated,
  and cannot be heard. Here the receptor is intact and there is nothing to hear. The two
  produce similar growth phenotypes by opposite lesions, and only one of them has an immune
  tolerance problem, because only one of them lacks the antigen. Neither entry is a subtype
  of the other.

  Definitional care. The entity is complete GH deficiency from severe GH1 loss of function,
  not "the GH1 deletion syndrome". Deletions are the commonest lesion but nonsense and
  frameshift mutations predicting complete absence of bioactive hormone cause the same
  disease, and the cited review states the definitional point explicitly. An entry organised
  around deletions would misclassify those patients.

  Frequency bands are assigned from qualitative language in the cited review and marked
  accordingly. "All develop" gives VERY_FREQUENT for the growth failure; "often develop"
  gives FREQUENT for the antibodies; "can have" gives OCCASIONAL for hypoglycaemia, and that
  item is marked PARTIAL because the phrase supports a band below universal without
  quantifying it. No cached source gives numeric frequencies.

  No GeneReviews baseline. A PubMed All Fields search for GeneReviews coverage returned
  chapters on Temple syndrome, GLI3-related Pallister-Hall syndrome, sepiapterin reductase
  deficiency and AIP familial isolated pituitary adenomas - none of them this disease. The
  same false-positive pattern recurred across this batch and is recorded rather than the
  absence merely asserted.

  Age of the literature. The primary sources here are from 1994 to 2006. That is not a gap
  in the curation but a property of the entity: IGHD IA was molecularly characterised in
  that period and the recent literature on isolated GH deficiency has moved to other genes
  and to combined pituitary deficiency. A 2020-2026 search returned nothing on this entity.
  The antibody phenotype is deliberately left unbound. HPO carries specific "X antibody
  positivity" terms but none for anti-growth-hormone antibodies, and the nearest generic
  candidates - reduced circulating growth hormone concentration, abnormal circulating
  immunoglobulin concentration - describe concentrations rather than the presence of a
  specific antibody, so either would assert something the phenotype does not claim. A
  free-text preferred_term with the claim carried by the description and evidence is the
  honest option; no term beats a bad one.


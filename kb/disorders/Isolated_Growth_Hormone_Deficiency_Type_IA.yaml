name: Isolated Growth Hormone Deficiency Type IA
creation_date: "2026-08-22T04:35:00Z"
category: Endocrine
disease_term:
  preferred_term: isolated growth hormone deficiency type IA
  term:
    id: MONDO:0009876
    label: isolated growth hormone deficiency type IA
description: >-
  The most severe Mendelian form of isolated growth hormone deficiency: autosomal
  recessive, with complete absence of endogenous growth hormone and severe dwarfism by six
  months of age. Caused by severe loss-of-function lesions at GH1 - most often deletions,
  but also frameshift and nonsense mutations.

  What makes it worth curating as its own entity rather than as the severe end of a
  spectrum is that the same lesion causes the disease and the failure of its treatment.
  These patients have never been exposed to growth hormone, so they were never made
  tolerant to it. Given recombinant GH, many mount an antibody response against the
  hormone, and those antibodies can abolish the growth response the treatment was given
  for.

  The natural experiment that proves this is the heterozygote. A carrier with one deleted
  allele and one allele producing non-truncated protein makes GH, and is usually immune
  tolerant. Tolerance tracks the presence of endogenous hormone, not the genotype as such.

parents:
- Isolated Growth Hormone Deficiency
- Growth Hormone Deficiency

pathophysiology:

- name: GH1 Severe Loss-of-Function Lesion
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    GH1 lies on chromosome 17 and is expressed in the somatotrophs of the anterior
    pituitary. Type IA is defined by lesions that abolish bioactive GH entirely: deletions
    ranging from about 6.7 kb to 45 kb, and also frameshift and nonsense mutations.

    The definitional point matters for diagnosis. The entity is complete GH deficiency
    caused by severe loss-of-function at GH1, not "the deletion syndrome" - a patient with
    a homozygous nonsense mutation and no deletion has type IA, and a deletion-only
    definition would miss them.

    The deletions have an unusual origin: they recur through unequal meiotic recombination
    rather than descending from a common ancestral allele, so the same deletion appearing
    in unrelated families is not evidence of shared ancestry.
  molecular_functions:
  - preferred_term: hormone activity
    term:
      id: GO:0005179
      label: hormone activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GH1 gene deletions, frameshifts, or nonsense mutations cause complete absence of GH in
      IGHD 1A.
    explanation: >-
      The three lesion classes and their shared consequence, which is what this node models.
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus IGHD 1A is best described as being complete GHD caused by severe loss of function
      GH1 gene mutations rather than being limited to only those having GH1 gene deletions.
    explanation: >-
      The definitional correction this node's description turns on - the entity is defined
      by functional completeness of the deficiency, not by mutation class.
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, GH1 gene deletions are recurring mutations that can arise through
      unequal recombination in meiosis rather than by allele sharing through common descent.
    explanation: >-
      The mutational mechanism, which bears on how a recurrent deletion in unrelated
      families should be interpreted.
  - reference: PMID:7868072
    reference_title: "Molecular basis of familial growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with IGHD type IA have heterogeneous deletions, ranging in size from 6.7
      kb to 45 kb, that encompass the entire gene encoding for pituitary GH, GH-1.
    explanation: >-
      The size range of the deletions, from an independent source.
  downstream:
  - target: Complete Absence of Endogenous Growth Hormone
    causal_link_type: DIRECT
    description: >-
      Loss of both functional alleles leaves no bioactive hormone.

- name: Complete Absence of Endogenous Growth Hormone
  role: central_effector
  biological_scale: ORGANISM
  description: >-
    The rate-limiting state, and the one from which both arms of this entry follow. It is
    what separates type IA from the other Mendelian forms: types IB, II and III all have
    diminished GH, type IA has none.

    Curating absence rather than deficiency as the central node is deliberate. A quantity
    that is reduced and a quantity that is zero behave differently in the immune system,
    and the difference is what the tolerance arm below depends on.
  evidence:
  - reference: PMID:7868072
    reference_title: "Molecular basis of familial growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At least four Mendelian types of isolated GH deficiency (IGHD) have been delineated
      based on the mode of inheritance and the degree of GH deficiency: IGHD type IA,
      autosomal recessive with absent endogenous GH; type IB, autosomal recessive with
      diminished GH; type II, autosomal dominant with diminished GH; and type III, X-linked
      with diminished GH.
    explanation: >-
      Places type IA in the classification by the two axes that define it - inheritance and
      the completeness of the deficiency - and is the source for the absent-versus-diminished
      distinction this node rests on.
  downstream:
  - target: Loss of Growth Hormone Receptor Signalling
    causal_link_type: DIRECT
    description: >-
      No ligand, no signal. This is the growth arm.
  - target: Failure of Immune Tolerance to Growth Hormone
    causal_link_type: DIRECT
    description: >-
      Never having been exposed to the hormone, the immune system never became tolerant of
      it. This is the treatment-failure arm, and it is downstream of absence specifically
      rather than of deficiency.

- name: Loss of Growth Hormone Receptor Signalling
  role: consequence
  biological_scale: CELLULAR
  description: >-
    Without ligand there is no growth hormone receptor signalling and no downstream
    generation of the growth-promoting response. Clinically this is unremarkable in the
    newborn period - length at birth may be short but need not be - and then declares
    itself decisively, with all affected individuals reaching severe dwarfism by six months.
  biological_processes:
  - preferred_term: growth hormone receptor signaling pathway
    term:
      id: GO:0060396
      label: growth hormone receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While affected individuals can have short lengths at birth and hypoglycemia in infancy,
      all develop severe dwarfism by six months of age.
    explanation: >-
      The natural history of this arm, including the early hypoglycaemia and the age by
      which the growth failure is universal.
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although short stature, delayed growth velocity, and delayed skeletal maturation all
      occur with IGHD, none are specific for IGHD 1A.
    explanation: >-
      PARTIAL because it qualifies rather than supports - the growth phenotype is real but
      does not distinguish type IA from the milder forms, which is why the diagnosis rests
      on the molecular lesion.
  downstream:
  - target: Severe Short Stature
    causal_link_type: DIRECT
    description: >-
      The defining clinical consequence, universal by six months.
  - target: Hypoglycemia
    causal_link_type: DIRECT
    description: >-
      Growth hormone is a counter-regulatory hormone; its absence presents in infancy as
      hypoglycaemia, before the growth failure is apparent.
  - target: Delayed Skeletal Maturation
    causal_link_type: DIRECT
    description: >-
      Skeletal maturation lags with the growth failure.

- name: Failure of Immune Tolerance to Growth Hormone
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The arm that makes this disease distinctive. Because no growth hormone was ever
    present, the immune system never encountered it as self, and recombinant GH given
    therapeutically is seen as a foreign protein. Many patients develop anti-GH antibodies,
    and those antibodies can prevent the growth response the treatment was given to
    produce.

    The evidence that this is a tolerance failure rather than an idiosyncratic drug
    reaction is the carrier state. Heterozygotes with one deleted allele and one allele
    producing non-truncated protein have circulating GH and are usually immune tolerant -
    tolerance follows the presence of endogenous hormone, not the genotype. That is as
    close to a controlled comparison as a rare disease offers.
  evidence:
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with IGHD 1A develop severe dwarfism in early infancy and often develop
      anti-GH antibodies after receiving exogenous GH.
    explanation: >-
      The antibody response and its trigger.
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These antibodies can prevent the growth response expected from exogenous GH therapy.
    explanation: >-
      The clinical consequence - neutralisation of the therapy, not merely seroconversion.
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals who are heterozygous for a GH1 gene deletion but whose other GH1 allele is
      not deleted and produces a non truncated product are usually immune tolerant.
    explanation: >-
      The natural experiment on which this node's mechanism rests. Carriers differ from
      patients in having endogenous hormone, and they are tolerant - which is what
      identifies absence of the antigen, rather than the mutation, as the cause of the
      antibody response.
  downstream:
  - target: Anti-Growth-Hormone Antibody Formation
    causal_link_type: DIRECT
    description: >-
      The serological expression of the tolerance failure, on exposure to exogenous hormone.

phenotypes:

- category: Growth
  name: Severe Short Stature
  description: >-
    Severe proportionate growth failure, universal by six months of age. Historically the
    condition was called sexual ateleiotic dwarfism and appears in older literature as a
    form of primordial dwarfism.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Severe short stature
    term:
      id: HP:0003510
      label: Severe short stature
    onset:
      onset_category: INFANTILE
  evidence:
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While affected individuals can have short lengths at birth and hypoglycemia in infancy,
      all develop severe dwarfism by six months of age.
    explanation: >-
      "All develop" supports the VERY_FREQUENT band directly, and gives the age by which it
      is complete.

- category: Metabolic
  name: Hypoglycemia
  description: >-
    Infantile hypoglycaemia, reflecting the loss of growth hormone's counter-regulatory
    role. It can precede recognisable growth failure and is one of the few features that
    brings these infants to attention before six months.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Hypoglycemia
    term:
      id: HP:0001943
      label: Hypoglycemia
    onset:
      onset_category: INFANTILE
  evidence:
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While affected individuals can have short lengths at birth and hypoglycemia in infancy,
      all develop severe dwarfism by six months of age.
    explanation: >-
      PARTIAL for the frequency claim specifically. The sentence contrasts "can have" for
      hypoglycaemia with "all develop" for the dwarfism, which supports a band below
      universal but does not quantify it; OCCASIONAL is the conservative reading of "can
      have" and no better source is cached.

- category: Skeletal
  name: Delayed Skeletal Maturation
  description: >-
    Bone age lags behind chronological age, as in growth hormone deficiency generally. Not
    specific to type IA.
  phenotype_term:
    preferred_term: Delayed skeletal maturation
    term:
      id: HP:0002750
      label: Delayed skeletal maturation
  evidence:
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although short stature, delayed growth velocity, and delayed skeletal maturation all
      occur with IGHD, none are specific for IGHD 1A.
    explanation: >-
      Establishes the phenotype and, in the same sentence, its lack of diagnostic
      specificity.

- category: Immunological
  name: Anti-Growth-Hormone Antibody Formation
  description: >-
    Antibodies against growth hormone appearing after exogenous GH is started. Titre and
    binding capacity matter more than presence: high-titre antibodies produce secondary
    growth arrest, while low-binding-capacity antibodies have been observed alongside
    sustained catch-up growth for at least three years.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: anti-growth-hormone antibody formation
  evidence:
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with IGHD 1A develop severe dwarfism in early infancy and often develop
      anti-GH antibodies after receiving exogenous GH.
    explanation: >-
      "Often develop" supports the FREQUENT band.
  - reference: PMID:9364351
    reference_title: "Molecular diagnosis and endocrine evaluation of a patient with a homozygous 7.0 kb deletion of the growth hormone (GH) gene cluster: response to biosynthetic GH therapy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was treated with biosynthetic GH resulting in long-lasting catch-up growth during
      at least three years, despite a clinically irrelevant appearance of low binding
      capacity GH antibodies.
    explanation: >-
      PARTIAL because it is the counter-case: antibodies appeared and did not matter. Curated
      to prevent the entry reading as though seroconversion always means treatment failure.

genetic:

- name: GH1
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: GH1
    term:
      id: hgnc:4261
      label: GH1
  association: >-
    Biallelic severe loss-of-function lesions at GH1 on chromosome 17. Deletions of roughly
    6.7 to 45 kb are the commonest, and can extend beyond GH1 into the neighbouring
    chorionic somatomammotropin cluster; frameshift and nonsense mutations predicting
    complete absence of bioactive GH cause the same phenotype.

    The molecular yield is high for this type specifically and low for the rest of the
    IGHD spectrum, which is the practical corollary of defining IA functionally: sequencing
    GH1 found an alteration in two thirds of IGHD IA families and in a tenth of all other
    GH-deficient families in the same series. Among the deletions, 6.7 kb accounts for
    roughly four fifths, and total GH1 abnormality rates differ substantially between
    populations.
  case_fractions:
  - population: Families with IGHD type IA (multi-ethnic series of 83 families with severe IGHD)
    case_fraction_percent: 66.7
    cohort_size: 12
    notes: >-
      Families rather than probands, and the denominator is families already classified as
      IGHD IA. So this is the sensitivity of GH1 sequencing in the phenotype, not the share
      of a disease caused by a gene - the entity is defined by complete GH absence and the
      remaining third of families were not molecularly solved at GH1.
    evidence:
    - reference: PMID:9432120
      reference_title: "Prevalence of human GH-1 gene alterations in patients with isolated growth hormone deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A high frequency of GH-1 gene alterations was found in families with IGHD type IA
        (8/12, 66.7%), whereas only a low frequency of GH-1 gene defects was present in all
        the other GH-deficient families (7/71, 9.9%).
      explanation: >-
        The figure with its denominator, and the contrast with the rest of the IGHD spectrum
        that makes it meaningful.
  evidence:
  - reference: PMID:9432120
    reference_title: "Prevalence of human GH-1 gene alterations in patients with isolated growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The sizes of the deletions were heterogeneous with the most frequent (78%) being 6.7
      kb.
    explanation: >-
      Quantifies the deletion-size distribution the association above describes
      qualitatively, and identifies 6.7 kb as the modal lesion.
  - reference: PMID:9432120
    reference_title: "Prevalence of human GH-1 gene alterations in patients with isolated growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      total GH-1 gene abnormalities varied among different populations from 11.6% in
      Northern Europe, 14.7% in Mediterranean countries and 31.2% in Asia
    explanation: >-
      Population variation in molecular yield across the whole severe-IGHD series. Curated
      because a diagnostic expectation set in one population will be wrong in another, not
      because it says anything about the biology of this entity.
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human Growth Hormone gene ( GH1 ) resides on chromosome 17q22-24 and it is expressed in
      somatotropic cells of the anterior pituitary gland.
    explanation: >-
      Locus and expression site.
  - reference: PMID:7868072
    reference_title: "Molecular basis of familial growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonsense, frameshift and splice GH-1 mutations that predict a complete lack of
      bioactive GH synthesis in homozygotes have also been reported in association with IGHD
      IA.
    explanation: >-
      The non-deletional lesion classes, which is why the entity is defined functionally
      rather than by deletion.
  - reference: PMID:7877887
    reference_title: "Isolated growth hormone deficiency type IA associated with a 45-kilobase gene deletion within the human growth hormone gene cluster in an Italian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Restriction endonuclease analysis revealed that the cause of hGH deficiency was a 45-kb
      gene deletion within the hGH-chorionic somatomammotropin (CS) gene cluster,
      encompassing the GH-1, CS-L, CS-A, and GH-2 genes.
    explanation: >-
      A worked example at the large end of the deletion range, showing the extent beyond GH1
      itself.

inheritance:

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic loss of function is required. The carrier state is not a mild form of the
    disease but is mechanistically informative in its own right, because one functioning
    allele confers immune tolerance to growth hormone - which is what identifies the
    antibody response in patients as a consequence of antigen absence.
  evidence:
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most severe Mendelian form of IGHD, called IGHD IA, has an autosomal recessive mode
      of inheritance.
    explanation: >-
      The inheritance mode and the entity's position as the most severe Mendelian form.

biochemical:

- name: Growth hormone-binding protein (GHBP)
  context: >-
    The discriminator against the mirror disorder, and the reason it belongs in a structured
    slot rather than in a notes paragraph.

    GHBP is the circulating extracellular domain of the growth hormone receptor, so its
    level reports on the receptor rather than on the hormone. In this disorder the receptor
    is intact and there is no ligand, so GHBP is normal. In growth hormone insensitivity
    from a receptor defect it is characteristically low. Two children with indistinguishable
    growth failure and opposite lesions are separated by this measurement.

    The cited case adds a second, quieter observation: GHBP did not change over three years
    of growth hormone therapy, so supplying the ligand did not alter the receptor pool.
  presence: Normal
  specificity: >-
    Normal GHBP is expected in ligand-absence disorders and distinguishes them from growth
    hormone receptor defects, where it is characteristically reduced.
  biomarker_term:
    preferred_term: plasma growth hormone-binding protein concentration
  evidence:
  - reference: PMID:9364351
    reference_title: "Molecular diagnosis and endocrine evaluation of a patient with a homozygous 7.0 kb deletion of the growth hormone (GH) gene cluster: response to biosynthetic GH therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Growth hormone-binding protein (GHBP) levels were normal at the time of diagnosis.
    explanation: >-
      The measurement, at diagnosis, in a molecularly confirmed patient.
  - reference: PMID:9364351
    reference_title: "Molecular diagnosis and endocrine evaluation of a patient with a homozygous 7.0 kb deletion of the growth hormone (GH) gene cluster: response to biosynthetic GH therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, GHBP plasma levels did not show any significant change during the three
      years of therapy with GH.
    explanation: >-
      Replacement does not move the marker, which is consistent with GHBP reporting on the
      receptor rather than on hormone exposure.

- name: Insulin-like growth factor binding protein 3 (IGFBP-3)
  context: >-
    Low, and - the point of curating it - it stays low on IGF-1 therapy. The authors read
    that as showing the growth hormone effect on IGFBP-3 is not mediated by IGF-1, which
    bounds how completely the rescue therapy substitutes for the missing hormone.
  presence: Low; unchanged by IGF-1 therapy
  evidence:
  - reference: PMID:10417965
    reference_title: "Insulin-like growth factor-I treatment in two children with growth hormone gene deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IGFBP-3 levels were low (0.55 and 0.40 mg/I) and did not increase after IGF-I
      treatment, suggesting that this GH effect is not mediated by IGF-I
    explanation: >-
      The values, and the inference the authors draw from the non-response.

- name: Anti-growth hormone antibodies
  context: >-
    The marker that decides whether replacement therapy works, and the one whose *titre and
    binding capacity* matter rather than whether it is present at all. A patient with
    low-binding-capacity antibodies grew for at least three years; siblings with high-titre
    antibodies arrested. Curated here as well as as a phenotype because it is a laboratory
    measurement with a therapeutic decision attached.

    Deliberately unbound. HPO carries an "anti-X antibody positivity" family - HP:6000494
    Anti-factor VIII antibody positivity is the direct structural analogue, an inhibitor
    antibody against a replacement protein - but has no term for anti-growth hormone
    antibodies. A new-term request is the right resolution and is tracked as a dismech issue
    rather than left implicit; see notes.
  presence: Variable; develops in a substantial proportion after exposure to exogenous GH
  evidence:
  - reference: PMID:7877887
    reference_title: "Isolated growth hormone deficiency type IA associated with a 45-kilobase gene deletion within the human growth hormone gene cluster in an Italian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two of the affected children developed high-titer anti-hGH antibodies after recombinant
      hGH treatment with secondary growth arrest, whereas the third one maintained normal
      growth in the presence of very low-titer antibodies.
    explanation: >-
      Titre rather than seroconversion is what separates the outcomes, within one sibship
      and one genotype.
  - reference: PMID:9364351
    reference_title: "Molecular diagnosis and endocrine evaluation of a patient with a homozygous 7.0 kb deletion of the growth hormone (GH) gene cluster: response to biosynthetic GH therapy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      despite a clinically irrelevant appearance of low binding capacity GH antibodies
    explanation: >-
      The counter-case, and the source's own phrase for it - antibodies present, binding
      capacity low, therapy unaffected.

diagnosis:

- name: Molecular confirmation of the GH1 lesion
  description: >-
    The defining diagnostic step, and the reason it is worth a structured entry: this
    disorder is a molecular diagnosis rather than a deletion-only one. The review quoted in
    the genetic section makes the same point - nonsense and frameshift mutations predicting
    complete absence of bioactive hormone cause the same disease as the deletions - so a
    workup that stops at deletion screening will misclassify patients.

    Detection in the cited case was by PCR amplification of the regions flanking GH1,
    demonstrating a homozygous 7.0-kb deletion.
  diagnosis_term:
    preferred_term: molecular analysis of the GH1 gene
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:9364351
    reference_title: "Molecular diagnosis and endocrine evaluation of a patient with a homozygous 7.0 kb deletion of the growth hormone (GH) gene cluster: response to biosynthetic GH therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The analysis of the genomic DNA of this patient, performed by polymerase chain
      reaction (PCR) amplification of the flanking regions of the GH-1 gene, showed a
      homozygous deletion of 7.0 kb of sequence including the GH-1 gene.
    explanation: >-
      The method and the result that established the diagnosis in this patient.

- name: Carrier genotyping in relatives
  description: >-
    Autosomal recessive inheritance makes carrier status a question for the family, and the
    cited case shows it answered from dried blood spots on filter paper - a low-burden
    method that matters in consanguineous kindreds where several relatives may need testing.

    It also connects to the mechanism. Heterozygous relatives whose remaining allele makes a
    non-truncated product are usually immune tolerant, so carrier genotyping identifies not
    just reproductive risk but the immunological difference that this entry's tolerance arm
    turns on.
  diagnosis_term:
    preferred_term: carrier genotyping of GH1 alleles
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:9364351
    reference_title: "Molecular diagnosis and endocrine evaluation of a patient with a homozygous 7.0 kb deletion of the growth hormone (GH) gene cluster: response to biosynthetic GH therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis of carrier status in family relatives was done by genotyping GH gene alleles
      by PCR amplification from blood spots on filter paper.
    explanation: >-
      The method, and the sample type that makes it practical for extended families.

treatments:

- name: Recombinant Human IGF-1 (Mecasermin)
  description: >-
    The rescue option when replacement has been neutralised, and the one that completes the
    entry's argument: if anti-GH antibodies block the hormone from reaching its receptor,
    giving the mediator downstream of that receptor bypasses the block entirely. IGF-1 is
    not growth hormone, so the antibodies do not see it.

    Curated as second-line with a heterogeneous response rather than as a mainstay, because
    the three cited reports disagree with each other in an instructive way. The 1993 case
    had anti-GH titres reaching 1:1,000,000 and grew well for a year on IGF-I with no
    anti-IGF-I antibody formation. Two Brazilian children with 6.7-kb deletions achieved
    catch-up growth, at 6.7 to 8.4 cm/yr. A 2006 series of four patients called the growth
    response to rhIGF-I *moderate* and the overall outcome heterogeneous, with pubertal
    development and bone-age acceleration in the two treated at pubertal age.

    So it works, it is not equivalent to effective GH replacement, and the age at which it
    is started appears to matter. The entry does not claim more than that.

    One mechanistic detail from the Brazilian report is worth keeping: IGFBP-3 levels were
    low and did not rise on IGF-I, which the authors read as showing that the GH effect on
    IGFBP-3 is not IGF-I-mediated. That is a limit on how completely this treatment
    substitutes for the missing hormone - it replaces the growth-promoting arm, not
    everything growth hormone does.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: mecasermin
      term:
        id: NCIT:C2262
        label: Mecasermin
  target_mechanisms:
  - target: Loss of Growth Hormone Receptor Signalling
    treatment_effect: BYPASSES
    description: >-
      BYPASSES rather than RESTORES: IGF-1 does not restore growth hormone receptor
      signalling, it supplies the mediator that signalling would have produced. That is
      exactly why it survives the antibodies - it enters the chain below the step they
      block.
    evidence:
    - reference: PMID:10417965
      reference_title: "Insulin-like growth factor-I treatment in two children with growth hormone gene deletions."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We conclude that IGF-I promotes growth by endocrine mechanisms and constitutes an
        effective treatment for patients with GH insensitivity secondary to GH antibodies.
      explanation: >-
        States the indication in exactly the terms this node needs - insensitivity caused by
        the antibodies, not by a receptor defect.
  evidence:
  - reference: PMID:7509217
    reference_title: "Treatment of isolated growth hormone deficiency type IA due to GH-I gene deletion with recombinant human insulin-like growth factor I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Administration of IGF-I to IGHD type IA with poor response to GH therapy appears to
      have a beneficial effect on growth.
    explanation: >-
      The indication stated for this exact disorder and this exact failure mode, in the
      source's own hedged register.
  - reference: PMID:7509217
    reference_title: "Treatment of isolated growth hormone deficiency type IA due to GH-I gene deletion with recombinant human insulin-like growth factor I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During IGF-I therapy he showed good linear growth without any side effects, such as
      hypoglycemia and anti-IGF-I antibody formation.
    explanation: >-
      The outcome in a patient with anti-GH titres up to 1:1,000,000, and the negative
      finding that matters most for this strategy - no antibodies formed against the
      substitute.
  - reference: PMID:10417965
    reference_title: "Insulin-like growth factor-I treatment in two children with growth hormone gene deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IGF-I therapy with increasing doses resulted in catch-up growth without side-effects.
    explanation: >-
      Catch-up growth in two unrelated children with 6.7-kb deletions, after replacement had
      produced only a transient response.
  - reference: PMID:16607923
    reference_title: "Effects of growth hormone (GH) and insulin-like growth factor-I therapy in patients with gene defects in the GH axis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Growth response during rhIGF-I treatment carried out in three of the patients was
      moderate, but pubertal development and bone age acceleration occurred in the two
      patients treated at pubertal age.
    explanation: >-
      PARTIAL, and the reason this treatment is curated as second-line rescue rather than as
      a solution. It is the counterweight to the two favourable reports - but a bounded one,
      and the bound is worth stating. The series is four patients carrying either a GH1
      deletion, a GH1 signal-peptide mutation, or a GH receptor mutation; rhIGF-I went to
      three of them, and the abstract does not say which three. A GH receptor mutation is
      the mirror disease rather than this one, so some unknown part of this "moderate"
      response may not be about IGHD IA at all.
  - reference: PMID:16607923
    reference_title: "Effects of growth hormone (GH) and insulin-like growth factor-I therapy in patients with gene defects in the GH axis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GH resistance, either caused by GH-Ab or GH receptor mutations, is still difficult to
      treat and results in a heterogeneous outcome.
    explanation: >-
      The authors' summary judgement, which applies to this disorder's antibody-mediated
      resistance and to the receptor-defect mirror entry alike.
  - reference: PMID:10417965
    reference_title: "Insulin-like growth factor-I treatment in two children with growth hormone gene deletions."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IGFBP-3 levels were low (0.55 and 0.40 mg/I) and did not increase after IGF-I
      treatment, suggesting that this GH effect is not mediated by IGF-I
    explanation: >-
      PARTIAL because it bounds the substitution rather than supporting or refuting the
      therapy: at least one growth-hormone effect is not reproduced by giving IGF-1.

- name: Recombinant Human Growth Hormone Replacement
  description: >-
    Hormone replacement is the treatment, and in this disorder it is also the exposure that
    creates the second problem. Replacement produces catch-up growth where antibodies do
    not neutralise it; where they do, growth arrests secondarily.

    The Italian family in the cited series shows the range within a single genotype: three
    siblings with the same 45-kb deletion, two developing high-titre antibodies with
    secondary growth arrest, and the third growing normally with only very low-titre
    antibodies.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: growth hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_mechanisms:
  - target: Complete Absence of Endogenous Growth Hormone
    treatment_effect: RESTORES
    description: >-
      Supplies the missing hormone. Curated as acting on the absence node rather than on the
      receptor-signalling node below it, because replacement restores the ligand rather than
      the response - and because acting on that node is precisely what provokes the
      tolerance arm.
    evidence:
    - reference: PMID:9364351
      reference_title: "Molecular diagnosis and endocrine evaluation of a patient with a homozygous 7.0 kb deletion of the growth hormone (GH) gene cluster: response to biosynthetic GH therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        She was treated with biosynthetic GH resulting in long-lasting catch-up growth during
        at least three years, despite a clinically irrelevant appearance of low binding
        capacity GH antibodies.
      explanation: >-
        Replacement working as intended over years, in a patient who seroconverted without
        clinical consequence.
  evidence:
  - reference: PMID:7877887
    reference_title: "Isolated growth hormone deficiency type IA associated with a 45-kilobase gene deletion within the human growth hormone gene cluster in an Italian family."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two of the affected children developed high-titer anti-hGH antibodies after recombinant
      hGH treatment with secondary growth arrest, whereas the third one maintained normal
      growth in the presence of very low-titer antibodies.
    explanation: >-
      PARTIAL because it is simultaneously evidence for and against the treatment - the same
      therapy in three siblings with the same deletion, working in one and neutralised in
      two. This is the single most informative observation about this treatment in this
      disease.
  - reference: PMID:17551470
    reference_title: "GH1 gene deletions and IGHD type 1A."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These antibodies can prevent the growth response expected from exogenous GH therapy.
    explanation: >-
      The failure mode that is specific to this disorder rather than to growth hormone
      therapy generally.

discussions:

- discussion_id: gap_what_determines_neutralising_antibody
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do some patients with complete GH1 loss develop neutralising anti-GH antibodies on
    replacement while others, with the same deletion, do not?
  attaches_to:
  - pathophysiology#Failure of Immune Tolerance to Growth Hormone
  - treatments#Recombinant Human Growth Hormone Replacement
  rationale: >-
    The tolerance account explains why patients with no endogenous hormone are at risk and
    carriers are not. It does not explain the variation among patients who all have none.

    The sharpest form of the question is the Italian sibship: three children, one 45-kb
    deletion, two with high-titre antibodies and secondary growth arrest and one growing
    normally with very low titres. Genotype is held constant and the outcome differs, which
    was the point the original report made in calling this the first description of
    phenotypic heterogeneity in antibody formation within such a family. A separate patient
    with a 7.0-kb deletion seroconverted with low binding capacity and grew for at least
    three years.

    So titre and binding capacity, not seroconversion, determine whether therapy fails - and
    nothing curated here predicts which a given patient will develop. The candidates are not
    distinguished by the cited evidence: HLA background, residual expression from a
    partially retained locus in smaller deletions, differences in the preparation or
    schedule of the recombinant hormone, or the age at which exposure begins.

    A second family makes the same point across a wider degree of relationship and with a
    harder endpoint. Two cousins carrying the identical genetic defect diverged completely:
    one reached a final height within her target range with an unrestricted growth response,
    the other responded far less favourably. The authors of that series name three candidate
    explanations - genetic disposition, the specific epitopes the antibodies recognise, or
    induction of immunological tolerance - and do not choose between them. Those are added
    to the candidate list below rather than replacing it, since they are orthogonal to the
    residual-expression and preparation hypotheses.

    One candidate has been tried and failed. Deliberate desensitisation with small daily
    doses of exogenous GH was attempted in two Brazilian children with 6.7-kb deletions;
    anti-GH antibodies appeared anyway, and usual-dose replacement then produced only a
    transient growth increase. That is a genuine negative result on the most obvious
    intervention the tolerance model suggests, and it is the reason this entry has no
    immune-tolerance-induction treatment entry - the absence is a literature gap that has
    been probed, not one that has been ignored.

    The practical stake is that this is a treatable disease whose treatment fails
    unpredictably in a subset, and there is currently no way to identify that subset before
    starting.
  evidence:
  - reference: PMID:16607923
    reference_title: "Effects of growth hormone (GH) and insulin-like growth factor-I therapy in patients with gene defects in the GH axis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surprisingly, growth response to GH was unrestricted in one girl, who reached a final
      height within her target height range, whereas her cousin with the identical genetic
      defect responded far less favourably.
    explanation: >-
      The same divergence as the Italian sibship, at a wider degree of relationship and
      measured on final height rather than on interim growth velocity.
  - reference: PMID:16607923
    reference_title: "Effects of growth hormone (GH) and insulin-like growth factor-I therapy in patients with gene defects in the GH axis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variability in the growth inhibiting potency of GH-Ab may therefore depend on genetic
      disposition, specific epitopes, or induction of immunological tolerance.
    explanation: >-
      The authors' three candidate explanations, quoted rather than paraphrased because they
      are hypotheses and the source presents them as such.
  - reference: PMID:10417965
    reference_title: "Insulin-like growth factor-I treatment in two children with growth hormone gene deletions."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Desensitization using small amounts of exogenous GH (0.033 IU/kg body weight/week,
      divided into daily s.c. injections) was attempted, but anti-GH antibodies appeared.
    explanation: >-
      REFUTE against desensitisation as a solution, in the two patients in whom it was
      tried. Curated because a probed and failed intervention is a different state of
      knowledge from an untried one.
  proposed_experiments:
  - experiment_id: genotype_stratified_antibody_cohort
    name: Deletion-size-stratified prospective antibody surveillance on GH replacement
    description: >-
      Follow anti-GH antibody titre and binding capacity prospectively from the start of
      replacement in patients stratified by lesion class - large deletion, small deletion,
      nonsense or frameshift - with HLA typing and growth velocity as outcomes. If antibody
      outcome tracks residual locus content rather than HLA, the mechanism is antigen
      exposure; if it tracks HLA, it is presentation.

notes: >-
  Why this is its own entry rather than the severe tail of a spectrum. Isolated growth
  hormone deficiency has at least four Mendelian forms distinguished by inheritance and by
  the degree of deficiency, and type IA is the only one with complete absence of endogenous
  hormone. That is not a difference of degree for the immune system: the tolerance arm
  curated here follows from absence specifically, and it is what makes the entity's
  treatment behave unlike treatment of the milder forms.

  The mirror lesion is already in this knowledge base. Growth_Hormone_Insensitivity_Syndrome
  (Laron syndrome) is the receptor-side defect - growth hormone is present, often elevated,
  and cannot be heard. Here the receptor is intact and there is nothing to hear. The two
  produce similar growth phenotypes by opposite lesions, and only one of them has an immune
  tolerance problem, because only one of them lacks the antigen. Neither entry is a subtype
  of the other.

  Definitional care. The entity is complete GH deficiency from severe GH1 loss of function,
  not "the GH1 deletion syndrome". Deletions are the commonest lesion but nonsense and
  frameshift mutations predicting complete absence of bioactive hormone cause the same
  disease, and the cited review states the definitional point explicitly. An entry organised
  around deletions would misclassify those patients.

  Frequency bands are assigned from qualitative language in the cited review and marked
  accordingly. "All develop" gives VERY_FREQUENT for the growth failure; "often develop"
  gives FREQUENT for the antibodies; "can have" gives OCCASIONAL for hypoglycaemia, and that
  item is marked PARTIAL because the phrase supports a band below universal without
  quantifying it. No cached source gives numeric frequencies.

  No GeneReviews baseline. A PubMed All Fields search for GeneReviews coverage returned
  chapters on Temple syndrome, GLI3-related Pallister-Hall syndrome, sepiapterin reductase
  deficiency and AIP familial isolated pituitary adenomas - none of them this disease. The
  same false-positive pattern recurred across this batch and is recorded rather than the
  absence merely asserted.

  Age of the literature. The primary sources here are from 1994 to 2006. That is not a gap
  in the curation but a property of the entity: IGHD IA was molecularly characterised in
  that period and the recent literature on isolated GH deficiency has moved to other genes
  and to combined pituitary deficiency. A 2020-2026 search returned nothing on this entity.
  The antibody phenotype is deliberately left unbound. HPO carries specific "X antibody
  positivity" terms but none for anti-growth-hormone antibodies, and the nearest generic
  candidates - reduced circulating growth hormone concentration, abnormal circulating
  immunoglobulin concentration - describe concentrations rather than the presence of a
  specific antibody, so either would assert something the phenotype does not claim. A
  free-text preferred_term with the claim carried by the description and evidence is the
  honest option; no term beats a bad one.

  The gap now has a tracking handle rather than staying implicit: dismech issue #9231
  records a proposed HPO new term, Anti-growth hormone antibody positivity, citing
  HP:6000494 Anti-factor VIII antibody positivity as the precedent - an inhibitor antibody
  against a replacement protein in a patient lacking the endogenous version, which is the
  same situation with growth hormone in place of factor VIII. The upstream request belongs
  at obophenotype/human-phenotype-ontology; the issue here exists so this entry's unbound
  term points somewhere.

  Deep research. A claude_code provider run
  (research/Isolated_Growth_Hormone_Deficiency_Type_IA-deep-research-claude_code.md) was
  performed after the first draft. Its own reference validation reports 23 of 23 identifiers
  resolved, none unresolved, 1 of 1 quote valid, and 20 of 23 scored on topic with none off
  topic - so three are undecided rather than cleared. It contributed PMID:9432120, the
  multi-ethnic GH1 sequencing series now behind this entry's case_fractions and
  deletion-size figures, and it independently reached the same conclusion about
  epidemiology recorded below: no population-specific incidence for IGHD IA as distinct
  from the broader IGHD category.

  No prevalence is curated, and that is a checked absence rather than an unfilled slot.
  MONDO:0009876 carries Orphanet:231662, and the record built from the pinned Orphadata
  snapshot (2025-12-09) holds synonyms and six cross-references with no epidemiology table,
  no HPO frequency table and no definition - Orphanet treats IGHD IA as a clinical subtype
  rather than a disorder. None of the four primary references gives a population figure
  either; the only quantitative statement available is that 5-30% of growth hormone
  deficiency overall may be genetic, which is a proportion of a broader category and not a
  prevalence for this entity. Recorded so the gap is not re-opened as unfilled work.

  The one figure that does exist belongs to the parent category and is deliberately NOT
  curated here: isolated GH deficiency of all types is estimated at 1 in 4,000 to 1 in
  10,000 live births. Type IA is the rarest and most severe member of that category, so
  recording the parent's rate on this entry would overstate its frequency by an unknown
  factor.

  Why rhIGF-1 is second-line here and central in the mirror entry. In growth hormone
  insensitivity from a receptor defect, IGF-1 replacement is the treatment, because the
  receptor cannot be made to work. Here the receptor is intact and rhGH works in the
  patients whose antibodies do not neutralise it, so IGF-1 is rescue for the subset in whom
  it does. The same drug, the same BYPASSES predicate on a receptor-signalling node, and a
  different position in the therapeutic sequence - which is worth stating because the two
  entries otherwise look like they should share a treatment plan.


  variants:
  - name: CSRP3 p.Cys58Gly (C58G)
    description: >-
      LIM1 zinc-finger cysteine substitution. Cosegregates with HCM in a large four-generation
      family with genome-wide linkage. Abolishes zinc coordination, destabilizes MLP and reduces
      binding to alpha-actinin and N-RAP; the knock-in mouse loses about half of myocardial MLP
      as a heterozygote. A 2018 ACMG meta-analysis rated it the only likely pathogenic CSRP3
      variant among those then reported.
  - name: CSRP3 p.Leu44Pro (L44P)
    description: LIM1 missense allele reported in HCM; depleted by the proteasome in cultured cells.
  - name: CSRP3 p.Ser54Arg/Glu55Gly (S54R/E55G)
    description: >-
      Double LIM1 missense allele reported in HCM; depleted by the proteasome in cultured
      cells.
  - name: CSRP3 p.Cys150Tyr (C150Y)
    description: >-
      LIM2 missense allele found in 11 of 6,456 Spanish HCM index cases and absent from other
      cardiomyopathy and control groups. Heterozygotes develop late-onset, low-risk HCM with
      highly age-dependent penetrance; the single homozygote was more severely affected.
  - name: CSRP3 p.Arg122Ter (c.364C>T)
    description: >-
      Nonsense allele (NM_003476.5:c.364C>T). Found homozygous in a Polish HCM patient, and
      cosegregating with HCM in a three-generation Chinese family (zygosity not stated in the
      cited abstract).
  - name: Homozygous CSRP3 truncating alleles
    description: >-
      Two unrelated French HCM probands were the first reported human CSRP3 knockouts. A 2024
      meta-analysis counted six reported adult HCM cases with biallelic CSRP3 truncating
      variants.
- name: CSRP3 p.Trp4Arg (W4R) modifier allele
  gene_term:
    preferred_term: CSRP3
    term:
      id: hgnc:2472
      label: CSRP3
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  association: >-
    The common N-terminal W4R allele (up to 1% of people of European ancestry) is not a cause of
    HCM on its own but worsens the expression of sarcomeric (MYH7 and MYBPC3) HCM. It is
    recorded here so that a W4R result on CSRP3 testing is read as a modifier rather than as a
    CMH12 diagnosis; the HCM it modifies is sarcomeric, not CSRP3-caused.
  notes: >-
    W4R was first reported in dilated cardiomyopathy and weakens MLP binding to telethonin. It
    was found in seven of 389 HCM probands in a Mayo Clinic series, four of whom also carried a
    sarcomeric variant, and in one healthy control. In patient iPSC cardiomyocytes, W4R alone
    caused no abnormality, whereas combined with MYH7 p.Arg723Cys it depleted MLP and worsened
    hypertrophy; correcting either variant rescued the phenotype. The W4R knock-in mouse develops
    age- and dose-dependent hypertrophic cardiomyopathy, which is one reason the human role was
    long debated.
  evidence:
  - reference: PMID:35384713
    reference_title: "Muscle LIM Protein Force-Sensing Mediates Sarcomeric Biomechanical Signaling in Human Familial Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We demonstrate that the common muscle LIM protein-W4R variant is an important modifier, exacerbating the phenotypic expression of HCM, but alone may not be a disease-causing mutation."
    explanation: W4R modifies sarcomeric HCM and is not sufficient alone.
  - reference: PMID:35384713
    reference_title: "Muscle LIM Protein Force-Sensing Mediates Sarcomeric Biomechanical Signaling in Human Familial Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Further, while ectopic expression of MLP-W4R in healthy control iPSC-CMs did not cause any abnormalities, it significantly worsened the HCM defects in iPSC-CMs derived from five HCM patients bearing different MYH7 and MYBPC3 mutations"
    explanation: The modifier effect is reproduced across several sarcomeric backgrounds.
  - reference: PMID:16352453
    reference_title: "Genotype-phenotype relationships involving hypertrophic cardiomyopathy-associated mutations in titin, muscle LIM protein, and telethonin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Four of the seven patients with W4R-MLP in the present study also have a published HCM-associated myofilament mutation."
    explanation: W4R often co-occurs with a sarcomeric variant in HCM patients.
  - reference: PMID:16352453
    reference_title: "Genotype-phenotype relationships involving hypertrophic cardiomyopathy-associated mutations in titin, muscle LIM protein, and telethonin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "W4R-MLP was also noted in a single white control subject."
    explanation: W4R is present in controls.
diagnosis:
- name: Echocardiography
  description: >-
    Imaging for unexplained left ventricular wall thickening, usually asymmetric septal
    hypertrophy, with grading of the septal contour. Serial imaging of carriers is needed
    because penetrance is late and age-dependent.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:17097056
    reference_title: "Echocardiographic-determined septal morphology in Z-disc hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Blinded to the Z-disc genotype status, the septal contour was graded qualitatively using standard transthoracic echocardiography."
    explanation: >-
      Transthoracic echocardiography defines the septal morphology of Z-disc HCM, including the
      CSRP3 carrier in this series. INDIRECT because the series is not CSRP3-specific.
- name: Clinical Evaluation for Nonsyndromic Hypertrophic Cardiomyopathy
  description: >-
    The phenotype is established clinically, with phenocopies (storage, infiltrative and
    syndromic causes of left ventricular hypertrophy) excluded, following the general evaluation
    of a proband with nonsyndromic HCM. Nothing on imaging separates CSRP3 HCM from sarcomeric
    HCM.
  evidence:
  - reference: PMID:20301725
    reference_title: "Nonsyndromic Hypertrophic Cardiomyopathy Overview."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Provide an evaluation strategy to identify (when possible) the genetic cause of nonsyndromic HCM in a proband"
    explanation: >-
      The GeneReviews overview sets out the evaluation of an HCM proband. INDIRECT because it
      covers HCM in general.
- name: Multigene HCM Panel Testing Including CSRP3
  description: >-
    CSRP3 is included on standard HCM gene panels. Interpretation should not treat W4R alone as
    a diagnosis, should look for a second CSRP3 allele (biallelic disease) and for a sarcomeric
    co-variant, and should take account of late, age-dependent penetrance when testing
    relatives.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:30012424
    reference_title: "First identification of homozygous truncating CSRP3 variants in two unrelated cases with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Among them, CSRP3 is usually included on HCM gene panels used for molecular diagnosis by next-generation sequencing (NGS)."
    explanation: CSRP3 is a standard panel gene.
  - reference: PMID:16352453
    reference_title: "Genotype-phenotype relationships involving hypertrophic cardiomyopathy-associated mutations in titin, muscle LIM protein, and telethonin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The precise role of W4R-MLP in the pathogenesis of either DCM or HCM warrants further investigation."
    explanation: Reason for caution in interpreting W4R.
progression:
- phase: Genotype-positive carrier before clinical expression
  notes: >-
    Heterozygous carriers can remain unaffected into late adulthood. In the p.Cys150Tyr families
    penetrance was highly age-dependent and the mean age at diagnosis was 55 years, so a normal
    echocardiogram in a young carrier does not exclude later disease.
  evidence:
  - reference: PMID:33035702
    reference_title: "The p.(Cys150Tyr) variant in CSRP3 is associated with late-onset hypertrophic cardiomyopathy in heterozygous individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The variant showed highly age-dependent penetrance."
    explanation: Late, age-dependent penetrance.
  - reference: PMID:33035702
    reference_title: "The p.(Cys150Tyr) variant in CSRP3 is associated with late-onset hypertrophic cardiomyopathy in heterozygous individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The mean age at diagnosis of affected individuals was 55 ± 13 years, and the mean left ventricular wall thickness was 18 ± 3 mm."
    explanation: Late mean age at diagnosis.
- phase: Established hypertrophic cardiomyopathy
  notes: >-
    For heterozygous p.Cys150Tyr carriers the course was benign, with no adverse events over a
    mean of 11 years. Biallelic disease is reported to be more severe. Outcome data for other
    CSRP3 alleles are too sparse to summarize.
  evidence:
  - reference: PMID:33035702
    reference_title: "The p.(Cys150Tyr) variant in CSRP3 is associated with late-onset hypertrophic cardiomyopathy in heterozygous individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "After a mean follow-up of 11 (±8) years, no adverse events were reported in any of the HCM patients."
    explanation: Low event rate in heterozygous carriers of one allele.
differential_diagnoses:
- name: Dilated Cardiomyopathy 1M
  disease_term:
    preferred_term: dilated cardiomyopathy 1M
    term:
      id: MONDO:0011840
      label: dilated cardiomyopathy 1M
  description: >-
    The allelic CSRP3 dilated designation (CMD1M), rated Limited by ClinGen and built mainly on
    the W4R and K69R alleles. A CSRP3 carrier with a dilated, poorly contracting ventricle should
    have end-stage HCM considered as well as CMD1M.
  distinguishing_features:
  - >-
    Primary left ventricular dilation with systolic dysfunction rather than unexplained
    hypertrophy.
  evidence:
  - reference: PMID:18505755
    reference_title: "Beyond the sarcomere: CSRP3 mutations cause hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Previous studies have shown an association between CSRP3 missense mutations and either dilated cardiomyopathy (DCM) or HCM, but all these studies were unable to provide comprehensive genetic evidence for a causative role of CSRP3 mutations."
    explanation: CSRP3 variants have been reported in both dilated and hypertrophic disease.
- name: Sarcomeric Hypertrophic Cardiomyopathy
  disease_term:
    preferred_term: hypertrophic cardiomyopathy
    term:
      id: MONDO:0005045
      label: hypertrophic cardiomyopathy
  description: >-
    HCM caused by variants in sarcomere genes such as MYBPC3 and MYH7, which explain most
    genotype-positive HCM. The clinical picture is the same, so only genetic testing separates
    them. A sarcomeric variant and a CSRP3 variant can occur together, including in families
    where double heterozygotes are more severely affected.
  distinguishing_features:
  - A pathogenic variant in a sarcomere gene, with no pathogenic CSRP3 variant.
  evidence:
  - reference: PMID:16352453
    reference_title: "Genotype-phenotype relationships involving hypertrophic cardiomyopathy-associated mutations in titin, muscle LIM protein, and telethonin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Patients with MLP/TCAP-associated HCM clinically mimicked myofilament-HCM."
    explanation: CSRP3 and sarcomeric HCM are clinically alike.
  - reference: PMID:20087448
    reference_title: "Hypertrophic cardiomyopathy family with double-heterozygous mutations; does disease severity suggest doubleheterozygosity?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Here we describe a family with double heterozygosity for pathogenic mutations in cysteine and glycine-rich protein 3 (CSRP3) and MYH7."
    explanation: A CSRP3 variant and a sarcomeric variant can segregate in the same family.
treatments:
- name: Cascade Screening and Cardiac Surveillance of At-Risk Relatives
  description: >-
    Predictive testing of first-degree relatives for the familial CSRP3 variant, then serial
    cardiac evaluation of carriers. In the p.Cys150Tyr families, relatives without the variant
    showed no disease, so the genotype is informative. Because penetrance is late, an unaffected
    young carrier stays under surveillance.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: cascade genetic and cardiac screening of at-risk relatives
    term:
      id: NCIT:C168126
      label: Cardiac Disease Screening
  evidence:
  - reference: PMID:33035702
    reference_title: "The p.(Cys150Tyr) variant in CSRP3 is associated with late-onset hypertrophic cardiomyopathy in heterozygous individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Family screening identified 17 other carriers. Wild-type individuals showed no signs of disease."
    explanation: Family screening identifies carriers, and non-carriers are unaffected.
- name: Genetic Counseling
  description: >-
    Counseling should cover dominant transmission with late, incomplete penetrance, the more
    severe disease of homozygotes and the recessive-like presentation of biallelic truncating
    alleles (relevant in consanguineous families), and the modifier rather than causal status of
    W4R.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33035702
    reference_title: "The p.(Cys150Tyr) variant in CSRP3 is associated with late-onset hypertrophic cardiomyopathy in heterozygous individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Ten of the index cases were heterozygous and one was homozygous. Homozygous had a more severe phenotype."
    explanation: Dose-dependent severity that counseling must convey.
  - reference: PMID:31919335
    reference_title: "Identification of a variant hotspot in MYBPC3 and of a novel CSRP3 autosomal recessive alteration in a cohort of Polish patients with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "This report expands the mutational spectrum and the inheritance pattern of HCM."
    explanation: Biallelic inheritance is part of the CSRP3 spectrum.
- name: Pharmacotherapy for Symptomatic Hypertrophic Cardiomyopathy
  description: >-
    Standard HCM pharmacotherapy (beta-blockers, non-dihydropyridine calcium channel blockers,
    disopyramide) for symptoms and outflow obstruction. No CSRP3-specific clinical study exists.
    In MLP-null human stem-cell cardiomyocytes, verapamil restored calcium homeostasis and
    prevented the hypertrophic phenotype, a preclinical observation that fits the calcium node
    but has not been tested in patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metoprolol
      term:
        id: CHEBI:6904
        label: metoprolol
    - preferred_term: verapamil
      term:
        id: CHEBI:9948
        label: verapamil
    - preferred_term: disopyramide
      term:
        id: CHEBI:4657
        label: disopyramide
  target_mechanisms:
  - target: Abnormal Cardiomyocyte Calcium Handling
    treatment_effect: INHIBITS
    description: >-
      Verapamil corrects the raised intracellular calcium of MLP-null cardiomyocytes in vitro.
    evidence:
    - reference: PMID:31406109
      reference_title: "MLP-deficient human pluripotent stem cell derived cardiomyocytes develop hypertrophic cardiomyopathy and heart failure phenotypes due to abnormal calcium handling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Furthermore, restoration of Ca2+ homeostasis by verapamil prevented the development of HCM and HF phenotypes, suggesting that elevated intracellular Ca2+ concentration is a central mechanism for pathogenesis of MLP deficiency."
      explanation: >-
        Preclinical rescue by verapamil. INDIRECT because it is a knockout cell model, not
        patients.
- name: Cardiac Myosin Inhibitor Therapy
  description: >-
    Mavacamten improves exercise capacity and outflow obstruction in symptomatic obstructive
    HCM. The pivotal trial was not stratified by genotype and reports no CSRP3 carriers. In
    patient iPSC cardiomyocytes in which MLP was depleted secondarily to a sarcomeric variant
    combined with W4R, mavacamten raised MLP levels and suppressed calcineurin-NFAT signalling;
    whether it helps primary CSRP3 disease, in which MLP loss is caused by the CSRP3 variant
    itself, is untested.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavacamten
      term:
        id: CHEBI:756998
        label: mavacamten
  target_mechanisms:
  - target: Disinhibited Calcineurin-NFAT Hypertrophic Signalling
    treatment_effect: INHIBITS
    description: >-
      Reducing crossbridge force restores MLP and lowers NFAT activity in secondary MLP
      depletion.
    evidence:
    - reference: PMID:35384713
      reference_title: "Muscle LIM Protein Force-Sensing Mediates Sarcomeric Biomechanical Signaling in Human Familial Hypertrophic Cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Notably, administration of mavacamten resulted in a reproducible upregulation of MLP (Figure 5M and 5N) as well as downregulation of nuclear NFATc4 (Figure 5J and 5O), its target gene MCIP1, and NFAT-luciferase activities (Figure S5Y’ and 5Z’) in the proband CMs."
      explanation: >-
        Mavacamten reverses MLP loss and NFAT activation in MYH7/W4R proband cardiomyocytes.
        INDIRECT because MLP loss there is secondary to a sarcomeric variant.
  evidence:
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Treatment with mavacamten improved exercise capacity, LVOT obstruction, NYHA functional class, and health status in patients with obstructive hypertrophic cardiomyopathy."
    explanation: Efficacy in obstructive HCM generally; applying it to CSRP3 carriers is an inference.
- name: Implantable Cardioverter-Defibrillator
  description: >-
    Primary or secondary prevention of sudden death on standard HCM risk criteria. Risk models
    have not been validated for CSRP3, and heterozygous p.Cys150Tyr carriers had no adverse
    events over a mean of 11 years.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  notes: >-
    Deliberately carries no evidence item. No CSRP3-specific device outcome data exist;
    indications are guideline-generic.
animal_models:
- name: Csrp3 C58G knock-in mouse
  species: Mouse
  genotype: Csrp3 p.C58G knock-in, heterozygous (KI/+) and homozygous (KI/KI)
  publication: PMID:30048712
  description: >-
    The first knock-in of a clearly pathogenic CSRP3 HCM allele. Homozygotes develop
    cardiomyopathy with diastolic and systolic dysfunction, increased heart weight, fetal and
    hypertrophic gene programmes, calcineurin pathway activation, mild fibrosis and a
    proteotoxic response. Heterozygotes lose about half of myocardial MLP but have no overt
    phenotype at baseline, with aging to 12 months, or after pressure overload.
  modeled_mechanisms:
  - target: MLP Protein Destabilization and Depletion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: Carries the human allele and reproduces dose-dependent proteasomal MLP depletion.
    limitations: >-
      Mouse myocardium; whether human heterozygous myocardium loses the same fraction of MLP has
      been examined only in one patient sample.
    evidence:
    - reference: PMID:30048712
      reference_title: "Mutant Muscle LIM Protein C58G causes cardiomyopathy through protein depletion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Intriguingly, the abundance of MLP decreased in KI/KI mice by 80% and in KI/+ mice by 50%."
      explanation: MLP depletion in the model.
  - target: Maladaptive Hypertrophic Remodeling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Homozygotes develop cardiomyopathy with increased heart weight.
    limitations: >-
      Only homozygotes are affected, whereas most patients are heterozygous; the phenotype
      combines diastolic and systolic dysfunction rather than isolated septal hypertrophy.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Heterozygous knock-in mice, the genotype of most patients, have no overt cardiac
        phenotype, whereas heterozygous humans develop (late-onset) HCM.
    evidence:
    - reference: PMID:30048712
      reference_title: "Mutant Muscle LIM Protein C58G causes cardiomyopathy through protein depletion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "In vivo phenotyping of homozygous KI/KI mice revealed a robust cardiomyopathy phenotype with diastolic and systolic left ventricular dysfunction, which was supported by increased heart weight measurements."
      explanation: The homozygous phenotype.
    - reference: PMID:30048712
      reference_title: "Mutant Muscle LIM Protein C58G causes cardiomyopathy through protein depletion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Heterozygous KI/+ mice did not develop an overt cardiac phenotype even upon aging up to 12 months (data not shown)."
      explanation: The heterozygous limitation.
  evidence:
  - reference: PMID:30048712
    reference_title: "Mutant Muscle LIM Protein C58G causes cardiomyopathy through protein depletion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "In conclusion, the newly generated mouse model provides insights into the underlying disease mechanisms of cardiomyopathy caused by mutations in the non-sarcomeric protein MLP."
    explanation: The authors' statement of the model's purpose.
- name: Mlp W4R knock-in mouse
  species: Mouse
  genotype: Mlp(W4R/+) and Mlp(W4R/W4R) knock-in
  publication: PMID:20044516
  description: >-
    Knock-in of the common W4R allele. Heterozygous and homozygous mice develop age- and
    dose-dependent hypertrophic cardiomyopathy and heart failure with reduced MLP and weaker
    telethonin binding. Human carriers of W4R alone are usually unaffected, so the model
    overstates the allele's effect in humans.
  modeled_mechanisms:
  - target: MLP Protein Destabilization and Depletion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Reduced MLP mRNA and protein in knock-in hearts.
    limitations: >-
      W4R is a modifier in humans; the reduction here is caused by an allele that does not cause
      HCM on its own in people.
    evidence:
    - reference: PMID:20044516
      reference_title: "A common MLP (muscle LIM protein) variant is associated with cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Importantly, we found significantly reduced MLP mRNA and MLP protein expression levels in hearts of heterozygous and homozygous W4R-MLP knock-in animals."
      explanation: MLP reduction in the model.
  evidence:
  - reference: PMID:20044516
    reference_title: "A common MLP (muscle LIM protein) variant is associated with cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "We now report the generation and detailed analysis of the corresponding Mlp(W4R/+) and Mlp(W4R/W4R) knock-in animals, which develop an age- and gene dosage-dependent hypertrophic cardiomyopathy and heart failure phenotype, characterized by almost complete loss of contractile reserve under catecholamine induced stress."
    explanation: The knock-in phenotype is hypertrophic cardiomyopathy.
- name: Csrp3 (Mlp) knockout mouse
  species: Mouse
  genotype: Csrp3-/- (MLP-/-), homozygous null
  publication: PMID:9039266
  description: >-
    The classic MLP-null mouse. Hearts are soft at birth with disrupted cytoarchitecture, and
    the mice develop dilated cardiomyopathy with hypertrophy and heart failure. Human complete
    loss of CSRP3 (biallelic truncation) gives adult HCM instead.
  modeled_mechanisms:
  - target: Maladaptive Hypertrophic Remodeling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Hypertrophy is present but is accompanied by dilation and heart failure.
    limitations: >-
      The dominant remodeling phenotype in the mouse is dilated, not hypertrophic.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Complete MLP loss gives dilated cardiomyopathy with hypertrophy in the mouse but
        hypertrophic cardiomyopathy in humans with biallelic truncating CSRP3 variants.
    evidence:
    - reference: PMID:9039266
      reference_title: "MLP-deficient mice exhibit a disruption of cardiac cytoarchitectural organization, dilated cardiomyopathy, and heart failure."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "MLP (-/-) mice developed dilated cardiomyopathy with hypertrophy and heart failure after birth."
      explanation: Mixed dilated and hypertrophic phenotype of the null mouse.
  evidence:
  - reference: PMID:9039266
    reference_title: "MLP-deficient mice exhibit a disruption of cardiac cytoarchitectural organization, dilated cardiomyopathy, and heart failure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Ultrastructural analysis revealed dramatic disruption of cardiomyocyte cytoarchitecture."
    explanation: The structural lesion of complete MLP loss.
experimental_models:
- name: MLP-knockout hESC-derived cardiomyocytes
  description: >-
    CRISPR/Cas9 CSRP3-null human embryonic stem cell line (H9) differentiated to cardiomyocytes.
    The cells develop hypertrophic features early and heart-failure features by 30 days, with
    impaired calcium handling; verapamil prevents the phenotype. Models complete loss of MLP,
    comparable to biallelic truncation.
  experimental_model_type: OTHER
  publication: PMID:31406109
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  modeled_mechanisms:
  - target: Abnormal Cardiomyocyte Calcium Handling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Impaired calcium handling that drives the hypertrophic phenotype.
    limitations: Complete knockout in immature stem-cell cardiomyocytes, not a heterozygous patient allele.
    evidence:
    - reference: PMID:31406109
      reference_title: "MLP-deficient human pluripotent stem cell derived cardiomyocytes develop hypertrophic cardiomyopathy and heart failure phenotypes due to abnormal calcium handling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Furthermore, restoration of Ca2+ homeostasis by verapamil prevented the development of HCM and HF phenotypes, suggesting that elevated intracellular Ca2+ concentration is a central mechanism for pathogenesis of MLP deficiency."
      explanation: Calcium dependence of the phenotype in the model.
  - target: Sarcomere Disorganization and Myocyte Disarray
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Disorganized sarcomeric ultrastructure.
    limitations: Immature cardiomyocytes and a null genotype.
    evidence:
    - reference: PMID:31406109
      reference_title: "MLP-deficient human pluripotent stem cell derived cardiomyocytes develop hypertrophic cardiomyopathy and heart failure phenotypes due to abnormal calcium handling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "MLP-deficient hESC-CMs were found to develop phenotypic features of HCM early after differentiation, such as enlarged cell size, multinucleation, and disorganized sarcomeric ultrastructure."
      explanation: Sarcomere disorganization in the model.
- name: Patient iPSC-derived cardiomyocytes and engineered heart tissue (MYH7 p.Arg723Cys with MLP W4R)
  description: >-
    Cardiomyocytes and engineered heart tissue from an HCM proband carrying MYH7 p.Arg723Cys and
    MLP W4R, with gene-edited corrections. Increased force destabilizes the Z-disc MLP complex,
    MLP falls and calcineurin-NFAT is disinhibited; correcting either variant, or mavacamten,
    rescues the phenotype. Here MLP depletion is secondary to a sarcomeric variant, so the model
    informs the downstream steps of CMH12 rather than its initiating lesion.
  experimental_model_type: IPSC_DERIVED_MODEL
  publication: PMID:35384713
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  modeled_mechanisms:
  - target: Disinhibited Calcineurin-NFAT Hypertrophic Signalling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: MLP reduction followed by calcineurin-NFAT disinhibition and hypertrophy.
    limitations: >-
      MLP loss is secondary to MYH7 hypercontractility plus W4R, not to a pathogenic CSRP3
      allele.
    divergences:

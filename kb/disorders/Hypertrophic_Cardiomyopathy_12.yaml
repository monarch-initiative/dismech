notes: >-
  Scope. This entry covers CSRP3 hypertrophic cardiomyopathy (CMH12, MONDO:0012804, OMIM
  612124). The allelic dilated designation CMD1M (MONDO:0011840) has its own entry and is listed
  as a differential. The umbrella Hypertrophic_Cardiomyopathy entry lists CSRP3 among its genes.

  Gene-disease validity. The ClinGen Definitive, semidominant CSRP3 assertion is for generic
  hypertrophic cardiomyopathy (MONDO:0005045), so it is cited as evidence and not recorded in
  gene_disease_validity, which is reserved for assertions on this entry's own MONDO term.

  GeneReviews. There is no CSRP3- or CMH12-specific GeneReviews chapter. The Nonsyndromic
  Hypertrophic Cardiomyopathy Overview (PMID:20301725) is tagged; its cached record holds only
  the purpose statement, so no phenotype baseline could be taken from it.

  Phenotypes. Only HCM, asymmetric septal hypertrophy and mild skeletal myopathy are curated,
  because those are the features reported specifically for CSRP3 carriers. General HCM
  features (outflow obstruction, arrhythmia, sudden death, heart failure, myocardial fibrosis)
  were not found with CSRP3-specific data and are left out rather than inferred from HCM in
  general; heterozygous p.Cys150Tyr carriers had no adverse events over 11 years. Septal
  reduction therapy is not listed because no CSRP3-specific outflow-obstruction data exist.

  Mechanism. The chain is: CSRP3 variant, then reduced partner binding and proteasomal MLP
  depletion, then disinhibited calcineurin-NFAT signalling, abnormal calcium handling and
  sarcomere disorganization, then ventricular hypertrophic remodeling. The depletion step is
  shown with a patient allele in mice and cells. The steps after it come from MLP-null human
  stem-cell cardiomyocytes and from iPSC cardiomyocytes in which MLP loss is secondary to a
  sarcomeric variant, and are marked PROVISIONAL or HYPOTHETICAL accordingly. The direction of
  the calcineurin-NFAT step differs between human cardiomyocyte and post-infarction mouse data;
  the allelic dilated entry models the reduced direction (see the calcineurin discussion).

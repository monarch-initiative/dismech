pathophysiology:
- name: CSRP3 Germline Variant
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion is a germline CSRP3 variant. Heterozygous HCM alleles are mostly
    missense changes at conserved residues of the first LIM domain (for example p.Leu44Pro,
    p.Ser54Arg/Glu55Gly and p.Cys58Gly), which binds alpha-actinin, plus the LIM2 allele
    p.Cys150Tyr. Biallelic truncating alleles remove the protein. The zinc-coordinating
    cysteine substitution p.Cys58Gly prevents zinc binding and folding of the first LIM domain.

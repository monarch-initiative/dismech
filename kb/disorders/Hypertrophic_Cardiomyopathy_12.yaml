inheritance:
- name: Autosomal dominant
  description: >-
    Most reported CSRP3 HCM alleles are heterozygous missense variants that cosegregate with
    disease in families, which is the autosomal dominant pattern recorded by OMIM. Penetrance is
    incomplete and strongly age-dependent: in the p.Cys150Tyr families, carriers were diagnosed
    at a mean of 55 years and wild-type relatives were unaffected. Expressivity is variable.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:

    explanation: Linkage evidence establishing CSRP3 as an HCM gene.
  - reference: PMID:15205937
    reference_title: "Decreased interactions of mutant muscle LIM protein (MLP) with N-RAP and alpha-actinin and their implication for hypertrophic cardiomyopathy."

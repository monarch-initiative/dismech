    explanation: Places the HCM alleles in the alpha-actinin-binding LIM1 domain.
  - reference: PMID:18505755
    reference_title: "Beyond the sarcomere: CSRP3 mutations cause hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT

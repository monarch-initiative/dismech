genetic:
- name: CSRP3
  gene_term:
    preferred_term: CSRP3
    term:
      id: hgnc:2472
      label: CSRP3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Pathogenic CSRP3 variants: heterozygous LIM-domain missense variants and biallelic
    truncating variants. ClinGen classifies CSRP3 as Definitive for hypertrophic cardiomyopathy
    with semidominant inheritance.
  notes: >-
    Gene-disease validity. ClinGen's Hereditary Cardiovascular Disease Gene Curation Expert Panel
    classifies CSRP3 as Definitive for hypertrophic cardiomyopathy, semidominant (SD), SOP9,
    dated 2023-08-09 (CGGV:assertion_012b9b15-798a-46e2-8164-61a829ceeda1-2023-08-09T160000.000Z).
    That assertion is filed against the generic term hypertrophic cardiomyopathy
    (MONDO:0005045), not against MONDO:0012804, so it is cited as ordinary evidence and not
    copied into gene_disease_validity. relationship_type CAUSATIVE follows the Definitive tier,
    as for the sibling FHOD3 entry (Hypertrophic Cardiomyopathy 28). The classification has
    risen over time: the 2019 ClinGen HCM curation placed CSRP3 in the Moderate group, and the
    2025 reappraisal made it Definitive with a semidominant mode. A 2026 multi-biobank analysis
    found a positive effect size for CSRP3 that was nominally significant but did not survive
    Bonferroni correction, as for other uncommon Definitive genes. The CSRP3 dilated
    cardiomyopathy assertion (Limited, AD, MONDO:0011840) belongs to the allelic entry Dilated
    Cardiomyopathy 1M.

    Case fraction. No reliable CSRP3 share of HCM exists. A Mayo Clinic series found CSRP3
    variants in 12 of 389 HCM probands, but seven of the twelve were the common W4R allele and
    several carriers also had a sarcomeric variant. The p.Cys150Tyr allele alone was found in 11
    of 6,456 HCM index cases in a Spanish multicentre series.

- name: Reduced MLP Binding to Alpha-Actinin and N-RAP
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    MLP forms a ternary complex with alpha-actinin, the main Z-disc actin cross-linker, and with
    N-RAP through separate binding sites. HCM missense alleles weaken both interactions. The
    authors of the C58G binding study proposed that the altered balance of this complex, and a
    compensatory rise in N-RAP when MLP falls, could lead to myocyte disarray. That step is a
    proposal and has not been tested.

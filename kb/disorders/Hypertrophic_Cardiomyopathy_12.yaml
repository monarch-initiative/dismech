- name: MLP Protein Destabilization and Depletion
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Unstable mutant MLP is degraded by the ubiquitin-proteasome system. In C58G knock-in mice,
    myocardial MLP falls to about 50% of normal in heterozygotes and about 20% in homozygotes,
    and two further HCM alleles are depleted in cultured cells. A C58G patient myocardium also
    showed reduced MLP, although MLP levels vary widely in failing and non-failing hearts.
    Biallelic truncating alleles give complete loss. Reduced functional MLP is therefore the
    common molecular end-point of the known pathogenic alleles; this has been shown in mice and
    cells, with one human tissue observation.
  biological_processes:
  - preferred_term: Proteasome-mediated degradation of mutant MLP
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: INCREASED
  cell_types:

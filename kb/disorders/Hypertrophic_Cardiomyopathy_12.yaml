    reference_title: "Mutations in the human muscle LIM protein gene in families with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Family studies revealed cosegregation of clinically affected individuals with the respective mutations in MLP."
    explanation: >-
      Heterozygous LIM1 missense variants cosegregate with HCM in families, the dominant
      transmission pattern.
  - reference: PMID:18505755
    reference_title: "Beyond the sarcomere: CSRP3 mutations cause hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Furthermore, CSRP3 missense mutations segregating with HCM were identified in four other families."
    explanation: Segregation of CSRP3 missense variants with HCM in further families.
  - reference: PMID:33035702
    reference_title: "The p.(Cys150Tyr) variant in CSRP3 is associated with late-onset hypertrophic cardiomyopathy in heterozygous individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The variant showed highly age-dependent penetrance."
    explanation: Penetrance of the heterozygous p.Cys150Tyr allele depends strongly on age.
- name: Semidominant
  description: >-
    ClinGen curated CSRP3 for hypertrophic cardiomyopathy as semidominant: heterozygous variants
    cause disease, and biallelic variants cause disease that is at least as penetrant and, for
    p.Cys150Tyr, more severe. Homozygous truncating CSRP3 alleles (complete loss of MLP) have
    been reported in several adult HCM probands, and CSRP3 variants are found in the homozygous
    state unusually often in a highly consanguineous Egyptian HCM cohort. One group argued from
    the first homozygous truncating cases that CSRP3 HCM may be recessive rather than dominant;
    the semidominant classification covers both observations.
  inheritance_term:
    preferred_term: Semidominant inheritance
    term:
      id: HP:0032113
      label: Semidominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE

discussions:
- discussion_id: cmh12_inheritance_mode
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is CSRP3 HCM dominant, recessive or semidominant, and how penetrant are heterozygous
    alleles?
  attaches_to:
  - genetic#CSRP3
  - inheritance#Semidominant
  rationale: >-
    OMIM records CMH12 as autosomal dominant, and most published alleles are heterozygous
    missense variants that cosegregate with disease. After the first homozygous truncating
    cases, one group argued for recessive inheritance and noted that only C58G met ACMG likely
    pathogenic criteria. Later data showed both: heterozygous p.Cys150Tyr causes late-onset
    disease, the homozygote is more severe, and homozygous variants are enriched where
    consanguinity is common. ClinGen settled on semidominant. The open part is penetrance of
    heterozygous missense and truncating alleles, which needs age-stratified family data.
  evidence:
  - reference: PMID:30012424
    reference_title: "First identification of homozygous truncating CSRP3 variants in two unrelated cases with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "By combining meta-analysis results and identification of two unrelated HCM patients with homozygous CSRP3 truncating variants, we suggest that the association of CSRP3 as a validated HCM-causing gene require additional studies and those CSRP3 variants could result in HCM with an autosomal recessive inheritance rather than with an autosomal dominant transmission as usually reported on HCM (OMIM 612124)."
    explanation: The recessive-inheritance position.
  - reference: PMID:33035702
    reference_title: "The p.(Cys150Tyr) variant in CSRP3 is associated with late-onset hypertrophic cardiomyopathy in heterozygous individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The p.(Cys150Tyr) variant in CSRP3 causes late-onset and low risk form of hypertrophic cardiomyopathy in heterozygous carriers."
    explanation: Heterozygous disease, against a purely recessive model.
  - reference: PMID:37431535
    reference_title: "Ethnicity, consanguinity, and genetic architecture of hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "variants in the minor HCM genes MYL2, MYL3, and CSRP3 more likely to present in homozygosity than the major genes, suggesting these variants are less penetrant in heterozygosity."
    explanation: Reduced heterozygous penetrance inferred from homozygosity enrichment.
  - reference: PMID:39971408
    reference_title: "Genes Associated With Hypertrophic Cardiomyopathy: A Reappraisal by the ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "CSRP3 was curated for a semidominant mode of inheritance (definitive)."
    explanation: The expert-panel resolution.
- discussion_id: cmh12_calcineurin_direction
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does loss of MLP increase or decrease calcineurin-NFAT signalling in the heart?
  attaches_to:
  - pathophysiology#Disinhibited Calcineurin-NFAT Hypertrophic Signalling
  rationale: >-
    In human iPSC cardiomyocytes (MLP lost secondarily to a sarcomeric variant) and in homozygous
    C58G knock-in hearts, reduced MLP is followed by more calcineurin-NFAT activity and
    hypertrophy. In heterozygous MLP-null mice after myocardial infarction, halving MLP displaced
    calcineurin from the Z-disc and blunted NFAT activation, and the hearts dilated. The settings
    differ (high sarcomeric force or near-complete MLP loss with a hypertrophic outcome, versus
    an ischaemic stressor with a dilated outcome). The authors of the human study, who cite the
    mouse anchoring work, propose that MLP both restrains calcineurin-NFAT at rest and is needed
    to localize it, so the net effect of MLP loss may depend on context. This entry follows the
    human cardiomyocyte data for the hypertrophic phenotype; the allelic dilated entry (Dilated
    Cardiomyopathy 1M) follows the mouse data for the dilated phenotype. Neither direction has
    been measured in cells carrying a primary pathogenic CSRP3 allele at heterozygous dose.
  evidence:
  - reference: PMID:35384713
    reference_title: "Muscle LIM Protein Force-Sensing Mediates Sarcomeric Biomechanical Signaling in Human Familial Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Subsequent reduction in the sarcomeric muscle LIM protein level caused disinhibition of calcineurin-nuclear factor of activated T-cells signaling, which promoted cardiac hypertrophy."
    explanation: Reduced MLP increases calcineurin-NFAT activity.
  - reference: PMID:35384713
    reference_title: "Muscle LIM Protein Force-Sensing Mediates Sarcomeric Biomechanical Signaling in Human Familial Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "It is possible that MLP has both inhibitory and facilitative effects on calcineurin activity."
    explanation: >-
      The human-study authors' proposed reconciliation of the two directions: MLP may both
      restrain and facilitate Z-disc calcineurin. Stated as a possibility in their discussion.
  - reference: PMID:15665106
    reference_title: "Attenuation of cardiac remodeling after myocardial infarction by muscle LIM protein-calcineurin signaling at the sarcomeric Z-disc."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Activation of the stress-responsive, prohypertrophic calcineurin-nuclear factor of activated T-cells (NFAT) signaling pathway was reduced in MLP+/- mice after MI, as shown by a blunted transcriptional activation of NFAT in cardiomyocytes isolated from MLP+/-/NFAT-luciferase reporter gene transgenic mice."
    explanation: >-
      Contradicts the increased-signalling direction: halving MLP reduced calcineurin-NFAT
      activation after infarction in mice.
- discussion_id: cmh12_heterozygous_model_gap
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why do heterozygous CSRP3 patient alleles cause HCM in humans when heterozygous knock-in mice
    stay normal, and why does the MLP-null mouse dilate while human CSRP3 knockouts hypertrophy?
  attaches_to:
  - animal_models#Csrp3 C58G knock-in mouse
  - animal_models#Csrp3 (Mlp) knockout mouse
  - pathophysiology#Maladaptive Hypertrophic Remodeling
  rationale: >-
    The C58G knock-in halves MLP in heterozygotes without a cardiac phenotype, even with aging
    or pressure overload, while heterozygous humans develop late-onset HCM. Complete MLP loss
    gives dilated cardiomyopathy with hypertrophy in mice but adult HCM in humans. The
    differences may reflect lifespan (human disease appears in mid-life), species differences in
    load or myosin isoforms, or the mouse strain. Human stem-cell cardiomyocytes lacking MLP do
    take on hypertrophic features. A heterozygous patient-allele isogenic iPSC model, studied
    under load, would test whether partial MLP loss is enough in human cells.
  evidence:
  - reference: PMID:30048712
    reference_title: "Mutant Muscle LIM Protein C58G causes cardiomyopathy through protein depletion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Heterozygous KI/+ mice did not develop an overt cardiac phenotype even upon aging up to 12 months (data not shown)."
    explanation: The heterozygous mouse has no phenotype.
  - reference: PMID:9039266
    reference_title: "MLP-deficient mice exhibit a disruption of cardiac cytoarchitectural organization, dilated cardiomyopathy, and heart failure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "MLP (-/-) mice developed dilated cardiomyopathy with hypertrophy and heart failure after birth."
    explanation: The null mouse is dilated.
  - reference: PMID:31406109
    reference_title: "MLP-deficient human pluripotent stem cell derived cardiomyocytes develop hypertrophic cardiomyopathy and heart failure phenotypes due to abnormal calcium handling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "MLP-deficient hESC-CMs were found to develop phenotypic features of HCM early after differentiation, such as enlarged cell size, multinucleation, and disorganized sarcomeric ultrastructure."
    explanation: Human MLP-null cells take on hypertrophic features.

- name: Sensorimotor neuropathy
  category: Nervous System
  description: Motor and sensory neuropathy developed by age 4 in the infantile p.Asp163Glu case,
    after normal nerve conduction at 19 months. Several other patients had normal studies; neither
    frequency nor a general relation to severity is established.
  phenotype_term:
    preferred_term: Sensorimotor neuropathy
    term:
      id: HP:0007141
      label: Sensorimotor neuropathy
  evidence:
  - reference: PMID:35766882
    reference_title: "Protein misfolding and clearance in the pathogenesis of a new infantile onset ataxia caused by mutations in PRDX3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Physical examinations did not show any additional clinical signs at that time, but a
      nerve conduction study (NCS) revealed moderate signs of motor and sensory neuropathy, predominantly
      in lower limbs; NCS at 19 months old was normal.
    explanation: Nerve-conduction findings justify sensorimotor specificity without assigning an axonal
      or demyelinating subtype.
  notes: >-
    No frequency band is assigned. The published patients come from separate
    single-case and small-series reports with no pooled cohort denominator, and
    nerve conduction was not performed in every patient.


inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every reported patient carries two PRDX3 alleles — homozygous in the
    consanguineous and founder-allele families, compound heterozygous in
    several non-consanguineous ones — with unaffected heterozygous parents.
    PRDX3 is nuclear-encoded and autosomal (10q26.11), so despite the disease
    being mitochondrial in its biochemistry the transmission is nuclear
    recessive, with a 25 percent sibling recurrence risk and no maternal
    transmission.
  evidence:
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified recessive mutations in PRDX3 as the genetic cause of cerebellar ataxia in five unrelated families, providing further evidence for oxidative stress in the pathogenesis of neurodegeneration."
    explanation: Establishes recessive inheritance of PRDX3 ataxia across five unrelated families in the defining study.
  - reference: PMID:35766882
    reference_title: "Protein misfolding and clearance in the pathogenesis of a new infantile onset ataxia caused by mutations in PRDX3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The further segregation analysis confirmed these findings and showed that his healthy brother was carrier of the PRDX3 c.489C > G variant in heterozygosis"
    explanation: Documents an unaffected heterozygous sibling, the segregation pattern expected of a recessive allele.
pathophysiology:
- name: PRDX3 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic PRDX3 variants — nonsense, frameshift, splice and missense alike —
    converge on absence of the peroxiredoxin 3 protein from patient cells. PRDX3
    is the only one of the six human peroxiredoxins confined to mitochondria, and
    it functions as a homodimer packed into a decameric/dodecameric ring; the
    recurrent p.Asp202Asn missense allele sits at the conserved dimer interface of
    that ring and destroys the protein rather than merely blunting its catalysis.
    The mutant protein is absent in patient fibroblasts across every allele
    characterised to date, so the molecular lesion is enzyme loss and not a
    dominant-negative or neomorphic activity.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline PRDX3 alleles: homozygous in the consanguineous and
      founder-allele families and compound heterozygous in several
      non-consanguineous ones. Reported classes are nonsense, frameshift,
      noncanonical splice and missense, and all characterised alleles leave the
      protein absent from patient fibroblasts.
  molecular_functions:
  - preferred_term: thioredoxin-dependent peroxiredoxin activity
    term:
      id: GO:0008379
      label: thioredoxin peroxidase activity
    modifier: ABSENT
  evidence:
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Among the six isoforms (PRDX1-PRDX6), PRDX3 is the only protein exclusively localized to the mitochondria, which are the main source of reactive oxygen species."
    explanation: Background statement in the defining paper establishing PRDX3 as the exclusively mitochondrial peroxiredoxin; graded OTHER because it reports no experiment of its own.
  - reference: PMID:37553803
    reference_title: "Pure cerebellar ataxia due to bi-allelic PRDX3 variants including recurring p.Asp202Asn."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "All PRDX3 variants reported to date act via loss‐of‐function, as the mutant proteins are absent in patients' fibroblasts, leading to complete loss of the enzyme."
    explanation: Summarises the published functional data across alleles as uniform loss of function; graded OTHER because it restates prior results rather than a new experiment.
  - reference: PMID:37553803
    reference_title: "Pure cerebellar ataxia due to bi-allelic PRDX3 variants including recurring p.Asp202Asn."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mutation is located in the PRX_Tyrp2cys domain of the protein at a region of high conservation in the dimer interface located between two PRDX3 subunits of the dodecamer ring and causes a complete absence of the protein."
    explanation: Locates the recurrent p.Asp202Asn allele at the oligomer dimer interface and states that it abolishes the protein; graded OTHER as a structural interpretation of published data.
  - reference: PMID:35766882
    reference_title: "Protein misfolding and clearance in the pathogenesis of a new infantile onset ataxia caused by mutations in PRDX3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the patient's fibroblasts, PRDX3 expression was nearly absent."
    explanation: Direct measurement of protein loss in patient-derived fibroblasts.
  downstream:
  - target: Mitochondrial Hydrogen Peroxide Accumulation
    description: >-
      Loss of the mitochondrial thioredoxin-dependent peroxidase removes the
      principal matrix route for disposing of respiratory-chain hydrogen peroxide.
  - target: Misfolded PRDX3 Aggregation and Unfolded Protein Response
    description: >-
      Allele-specific: the destabilising p.Asp163Glu missense protein aggregates
      before it is cleared, adding a proteostatic insult to the enzyme loss.

- name: Mitochondrial Hydrogen Peroxide Accumulation
  biological_scale: MOLECULAR
  description: >-
    Superoxide produced by the respiratory chain is dismutated to hydrogen
    peroxide in the matrix, where peroxiredoxin 3 is the dominant scavenger.
    Without it the peroxide load rises: patient fibroblasts show reduced
    glutathione peroxidase activity and increasing mitochondrial superoxide as
    external hydrogen peroxide is raised, and PRDX3-depleted cerebellar cells
    accumulate hydrogen peroxide directly. Compensating transcripts (SOD2, GPX1,
    catalase, TXN2, PRDX5) are upregulated but do not restore buffering.
  biological_processes:
  - preferred_term: hydrogen peroxide catabolic process
    term:
      id: GO:0042744
      label: hydrogen peroxide catabolic process
    modifier: DECREASED
  - preferred_term: cell redox homeostasis
    term:
      id: GO:0045454
      label: cell redox homeostasis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts showed a lack of PRDX3 protein, resulting in decreased glutathione peroxidase activity and decreased mitochondrial maximal respiratory capacity."
    explanation: Couples PRDX3 protein loss to measured loss of peroxidase activity in patient cells.
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PRDX3 knockdown in cerebellar medulloblastoma cells resulted in significantly decreased cell viability, increased H2O2 levels and increased susceptibility to apoptosis triggered by reactive oxygen species."
    explanation: Shows directly that removing PRDX3 from a cerebellar cell line raises hydrogen peroxide and kills the cells.
  downstream:
  - target: Cerebellar Neuronal Oxidative Injury
    description: >-
      Unbuffered matrix peroxide is the proximate oxidative insult to cerebellar
      neurons.
  - target: Mitochondrial Respiratory Impairment
    description: >-
      Oxidative damage to the organelle degrades its own respiratory capacity.

- name: Misfolded PRDX3 Aggregation and Unfolded Protein Response
  biological_scale: CELLULAR
  description: >-
    This node is allele-specific and does not apply to the null alleles. The
    p.Asp163Glu missense protein is unstable, forms insoluble aggregates and is
    routed to proteasomal degradation, and its expression activates the
    unfolded protein response in both the mitochondrion and the endoplasmic
    reticulum. Expressed exogenously it damages mitochondria far more severely
    than the p.Asp202Asn or p.Ala142Gly alleles do — cristae disorganisation,
    membrane damage and lipid-droplet accumulation — and in cultured mouse
    cortical neurons it distorts neurite morphology. This is the current
    candidate explanation for the exceptionally early, 19-month onset in that
    patient, and it is a proteostatic mechanism layered on top of, not instead
    of, the shared enzyme loss.
  biological_processes:
  - preferred_term: mitochondrial unfolded protein response
    term:
      id: GO:0034514
      label: mitochondrial unfolded protein response
    modifier: INCREASED
  - preferred_term: endoplasmic reticulum unfolded protein response
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
  evidence:
  - reference: PMID:35766882
    reference_title: "Protein misfolding and clearance in the pathogenesis of a new infantile onset ataxia caused by mutations in PRDX3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The biochemical analysis suggested that the mutation p.D163E would result in an unstable structure tending to form aggregates that trigger unfolded protein responses via mitochondria and endoplasmic reticulum."
    explanation: States the aggregation-plus-UPR mechanism demonstrated for this allele.
  - reference: PMID:35766882
    reference_title: "Protein misfolding and clearance in the pathogenesis of a new infantile onset ataxia caused by mutations in PRDX3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mitochondrial morphology showed severe changes, including extremely damaged outer and inner membranes with a notable cristae disorganization."
    explanation: Documents the organelle damage produced by expressing the aggregating allele.
  - reference: PMID:35766882
    reference_title: "Protein misfolding and clearance in the pathogenesis of a new infantile onset ataxia caused by mutations in PRDX3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In mouse primary cortical neurons, the exogenous expression of PRDX3 p.D163E was reduced and triggered alterations in neurite morphology and in mitochondria."
    explanation: Extends the aggregating-allele damage to cultured neurons, the cell class relevant to the disease.
  downstream:
  - target: Cerebellar Neuronal Oxidative Injury
    description: >-
      Proteostatic stress compounds the redox insult in the one allele where it
      has been demonstrated.

- name: Mitochondrial Respiratory Impairment
  biological_scale: CELLULAR
  description: >-
    PRDX3-deficient cells lose respiratory reserve. Patient fibroblasts in the
    defining cohort had reduced maximal respiratory capacity, and prdx3-depleted
    zebrafish larvae show significant reductions in ATP production and maximal
    respiration. This is a consequence of the redox lesion rather than a primary
    OXPHOS subunit defect: PRDX3 is not part of any respiratory complex, and one
    later patient's fibroblasts showed no measurable respiratory abnormality at
    all, so the finding is not uniform across cell lines.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: cellular respiration
    term:
      id: GO:0045333
      label: cellular respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts showed a lack of PRDX3 protein, resulting in decreased glutathione peroxidase activity and decreased mitochondrial maximal respiratory capacity."
    explanation: Reports the reduced maximal respiratory capacity in patient fibroblasts.
  - reference: PMID:38837640
    reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "significant reductions in ATP production and maximal respiration"
    explanation: Independent respiratory deficit in the prdx3-depleted zebrafish larva.
  - reference: PMID:38837640
    reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: "Metabolic parameters obtained from OCR traces did not show significant changes in mitochondrial function between the patient and the controls."
    explanation: A later patient's fibroblasts showed no respiratory abnormality, so this node is not uniformly demonstrable in peripheral cells.
  downstream:
  - target: Cerebellar Neuronal Oxidative Injury
    description: >-
      Reduced respiratory reserve leaves high-demand cerebellar neurons less able
      to tolerate the redox insult.

- name: Cerebellar Neuronal Oxidative Injury
  biological_scale: CELLULAR
  description: >-
    Cerebellar neurons are the cell population in which the redox failure becomes
    a disease. Removing PRDX3 from cerebellar cells raises hydrogen peroxide,
    reduces viability and sensitises them to reactive-oxygen-species-triggered
    apoptosis; the same sensitisation is seen in prdx3-depleted zebrafish larvae
    as an increase in apoptotic cells and in apoptosis-associated transcripts.
    Why the cerebellum in particular is the vulnerable region, when PRDX3 is
    ubiquitously expressed, is not established.
  biological_processes:
  - preferred_term: cellular response to reactive oxygen species
    term:
      id: GO:0034614
      label: cellular response to reactive oxygen species
    modifier: INCREASED
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PRDX3 knockdown in cerebellar medulloblastoma cells resulted in significantly decreased cell viability, increased H2O2 levels and increased susceptibility to apoptosis triggered by reactive oxygen species."
    explanation: The closest available cerebellar cell model shows peroxide accumulation and apoptotic sensitisation on PRDX3 loss.
  - reference: PMID:38837640
    reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "our functional characterization of the prdx3 zebrafish model revealed motor defects, increased susceptibility to reactive oxygen species-triggered apoptosis, and an impaired oxygen consumption rate."
    explanation: In vivo confirmation that prdx3 depletion sensitises to ROS-triggered apoptosis and impairs motor output.
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Pan-neuronal and pan-glial in vivo models of Drosophila revealed aberrant locomotor phenotypes and reduced survival times upon exposure to oxidative stress."
    explanation: Neuronal and glial loss of the fly orthologue produces locomotor failure and oxidative-stress lethality.
  downstream:
  - target: Cerebellar Cortical Degeneration
    description: >-
      Sustained oxidative injury and apoptosis of cerebellar neurons is the
      cellular substrate of the tissue-level degeneration.

- name: Cerebellar Cortical Degeneration
  biological_scale: TISSUE
  description: >-
    The tissue-level lesion is a cerebellar cortical degeneration: cerebellar
    atrophy is present in every reported patient, is often severe and early
    relative to the clinical picture, and is accompanied on MRI by T2
    hyperintensity of the dentate nuclei and of the cerebellar cortex itself,
    with variable extension to the middle cerebellar peduncles, posterior pons and
    inferior olives. It is curated at the cortical rather than the Purkinje-cell
    level on purpose: no autopsy or biopsy neuropathology of a SCAR32 patient has
    been published, and no paper in this literature identifies the Purkinje cell
    as the degenerating population. Conformance to the
    `cerebellar_purkinje_degeneration` module is therefore not declared here —
    see the open discussion.
  locations:
  - preferred_term: cerebellar cortex
    term:
      id: UBERON:0002129
      label: cerebellar cortex
  - preferred_term: dentate nucleus
    term:
      id: UBERON:0002132
      label: dentate nucleus
  - preferred_term: inferior olivary complex
    term:
      id: UBERON:0002127
      label: inferior olivary complex
  - preferred_term: pons
    term:
      id: UBERON:0000988
      label: pons
  evidence:
  - reference: PMID:37731903
    reference_title: "Expansion of clinico-genetic spectrum of PRDX3 disease: a literature review with two additional cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only a few reports have described the MRI features of PRDX3 disease, including T2 signal changes in the reticular formation, dentate nucleus and transverse stripes of the pons, which are not typically seen in other hereditary degenerative ataxia."
    explanation: Adds the reticular-formation and transverse-pontine-stripe signal changes, and states that this infratentorial pattern is not typical of other hereditary degenerative ataxias.
  - reference: PMID:37553803
    reference_title: "Pure cerebellar ataxia due to bi-allelic PRDX3 variants including recurring p.Asp202Asn."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The presence of cerebellar atrophy is a ubiquitous feature in patients with bi‐allelic PRDX3 mutations."
    explanation: Establishes cerebellar atrophy as universal across the reported PRDX3 cohort; graded OTHER as a synthesis of published cases.
  - reference: PMID:42608543
    reference_title: "Clinical features of four unrelated Japanese patients with autosomal recessive spinocerebellar ataxia type 32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI showed cerebellar atrophy and T2 hyperintensity in dentate nuclei in all patients, and three had cerebellar cortical T2 hyperintensity, a potentially representative feature of SCAR32."
    explanation: Adds the dentate and cerebellar-cortical signal change seen in every patient of a four-patient series.
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation of individuals with PRDX3 mutations consists of mild-to-moderate progressive cerebellar ataxia with concomitant hyper- and hypokinetic movement disorders, severe early-onset cerebellar atrophy, and in part olivary and brainstem degeneration."
    explanation: Documents severe early cerebellar atrophy with olivary and brainstem involvement in the defining cohort.
  downstream:
  - target: Progressive cerebellar ataxia

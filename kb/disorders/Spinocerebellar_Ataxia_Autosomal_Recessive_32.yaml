- name: Proposed Pyramidal Tract Dysfunction
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: Pyramidal signs in reported patients indicate an additional central motor pathway component.
    This is a clinical localization, without direct demonstration of corticospinal tract degeneration
    or its cellular redox lesion.
  evidence:
  - reference: PMID:37731903
    reference_title: 'Expansion of clinico-genetic spectrum of PRDX3 disease: a literature review
      with two additional cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our study reports two additional patients who displayed caudal-to-rostral spatial disease
      spread, with one showing mild cognitive impairment and the other exhibiting pyramidal signs.
    explanation: The authors clinically identify pyramidal involvement; tissue pathology and the regional
      oxidative mechanism remain unconfirmed.
    directness: INDIRECT
  downstream:
  - target: Babinski sign
    description: >-
      The extensor plantar response supports the proposed descending motor-pathway dysfunction.
      Its attribution to a particular PRDX3-related tract lesion is clinically inferred.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37731903
      reference_title: "Expansion of clinico-genetic spectrum of PRDX3 disease: a literature review with
        two additional cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        During the neurological examination, Babinski’s sign was present but deep tendon reflexes
        were within the normal range.
      explanation: >-
        Patient 1 had an explicit extensor plantar sign. Together with the authors' description of
        pyramidal involvement, this supports a clinically inferred descending motor-pathway
        attribution without proving a specific tract lesion.
      directness: INDIRECT
  - target: Hyperreflexia
    description: Pyramidal motor pathway dysfunction can produce brisk tendon reflexes. Isolated brisk
      reflexes without Babinski signs do not establish this mechanism in every patient.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37553803
      reference_title: Pure cerebellar ataxia due to bi-allelic PRDX3 variants including recurring

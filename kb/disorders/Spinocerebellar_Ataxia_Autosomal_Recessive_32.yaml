    established; it is recorded because it changed that patient's management.
  phenotype_term:
    preferred_term: Hypogonadotropic hypogonadism
    term:
      id: HP:0000044
      label: Hypogonadotropic hypogonadism
  evidence:
  - reference: PMID:37553803
    reference_title: "Pure cerebellar ataxia due to bi-allelic PRDX3 variants including recurring p.Asp202Asn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An endocrinological exam showed that the patient presented with low levels of follicle‐stimulating hormone (FSH) at 1.9 mIU/mL, luteinizing hormone (LH) at 1 mIU/mL, testosterone at 0.2 mg/mL and dihydrotestosterone (DHT) at 0.01 mg/mL."
    explanation: The hormone profile establishing hypogonadotropic hypogonadism in this patient.
  notes: >-
    Reported in one patient only. Do not read this as a SCAR32-associated

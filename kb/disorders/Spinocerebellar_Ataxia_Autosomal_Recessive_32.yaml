    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, the patient presented with slowly progressive gait ataxia and cerebellar vermis atrophy."
    explanation: Gait ataxia as the presenting symptom in a paediatric SCAR32 patient.

- name: Cerebellar atrophy
  category: Nervous System
  description: >-
    Present in every reported patient and often disproportionate to the clinical
    severity; the vermis is affected early and quantitatively (one infant lost 19
    percentage points of midsagittal vermis relative diameter between 23 and 32
    months of age).
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:37553803
    reference_title: "Pure cerebellar ataxia due to bi-allelic PRDX3 variants including recurring p.Asp202Asn."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The presence of cerebellar atrophy is a ubiquitous feature in patients with bi‐allelic PRDX3 mutations."
    explanation: States explicitly that cerebellar atrophy is universal in the reported PRDX3 cohort, which is the basis for the OBLIGATE band.
  - reference: PMID:42608543
    reference_title: "Clinical features of four unrelated Japanese patients with autosomal recessive spinocerebellar ataxia type 32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI showed cerebellar atrophy and T2 hyperintensity in dentate nuclei in all patients, and three had cerebellar cortical T2 hyperintensity, a potentially representative feature of SCAR32."
    explanation: Cerebellar atrophy in all four patients of an independent series.


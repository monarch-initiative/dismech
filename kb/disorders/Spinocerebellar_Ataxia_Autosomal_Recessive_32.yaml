    evidence_source: HUMAN_CLINICAL
    snippet: "MRI showed cerebellar atrophy and T2 hyperintensity in dentate nuclei in all patients, and three had cerebellar cortical T2 hyperintensity, a potentially representative feature of SCAR32."
    explanation: Documents dentate-nucleus T2 hyperintensity in every patient of the series.
  notes: >-
    Bound to the closest available HPO concept. HPO has no term for a T2 signal
    abnormality of the dentate nucleus specifically; `Abnormal dentate nucleus
    morphology` is broader than the imaging finding but is the accurate parent.

- name: Peripheral neuropathy
  category: Nervous System
  description: >-
    Reported in the infantile-onset patient, in whom nerve conduction was normal at
    19 months and showed moderate motor and sensory neuropathy by age 4. Absent in
    several adult-onset patients with formally normal nerve conduction studies, so
    it appears to track with the severe end of the spectrum rather than being a
    constant feature.
  phenotype_term:
    preferred_term: Peripheral neuropathy
    term:
      id: HP:0009830
      label: Peripheral neuropathy
  evidence:
  - reference: PMID:35766882
    reference_title: "Protein misfolding and clearance in the pathogenesis of a new infantile onset ataxia caused by mutations in PRDX3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We aimed to unravel the molecular bases underlying the disease in an infant suffering from cerebellar ataxia that started at 19 months old and presented severe cerebellar atrophy and peripheral neuropathy early in the course of disease."
    explanation: Peripheral neuropathy early in the course of the infantile-onset case.
  notes: >-
    No frequency band is assigned. The published patients come from separate
    single-case and small-series reports with no pooled cohort denominator, and
    nerve conduction was not performed in every patient.


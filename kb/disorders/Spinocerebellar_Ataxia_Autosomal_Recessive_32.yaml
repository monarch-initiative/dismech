genetic:
- name: PRDX3
  notes: >-
    Biallelic variants in PRDX3 (peroxiredoxin 3, chromosome 10q26.11) cause
    SCAR32. Reported alleles span nonsense (p.Arg207*, p.Arg170*, p.Lys166*,
    p.Gln50*), frameshift (p.Leu8Cysfs*10, p.Leu176TrpfsTer11), noncanonical
    splice variants causing exon skipping, and missense (p.Asp202Asn, p.Ala142Gly,
    p.Asp163Glu). All behave as loss of function, with the mutant protein absent
    from patient fibroblasts. Two alleles recur across unrelated families:
    p.Asp202Asn, first found in Kurdish families and since in Brazilian and UK
    patients and sitting at a CpG dinucleotide, and p.Arg207*, which is
    comparatively common in East Asian population data and was present in all four
    patients of the Japanese series.
  gene_term:
    preferred_term: PRDX3
    term:
      id: hgnc:9354
      label: PRDX3
  relationship_type: CAUSATIVE
  variants:
  - name: PRDX3 c.604G>A (p.Asp202Asn)
    description: >-
      Recurrent missense allele at the conserved dimer interface of the PRDX3
      oligomer; abolishes the protein rather than reducing its catalytic rate.
      First reported in two unrelated Kurdish families, subsequently homozygous in
      a Brazilian patient and in a British boy with cerebellar hypoplasia found in
      100,000 Genomes Project data.
    type: missense
    clinical_significance: PATHOGENIC
    regulatory_category: LOF
    evidence:
    - reference: PMID:37553803
      reference_title: "Pure cerebellar ataxia due to bi-allelic PRDX3 variants including recurring p.Asp202Asn."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous missense variant in PRDX3 (NM_006793.5): c.604G>A, p.(Asp202Asn) residing within a 6.45 Mb region of homozygosity (Fig. 1C) was identified and confirmed by Sanger Sequencing in proband I."
      explanation: Identifies the recurrent missense allele in the homozygous state in a further unrelated patient.
  - name: PRDX3 c.619C>T (p.Arg207*)
    description: >-
      Nonsense allele that is comparatively frequent in East Asian population data
      and was carried by all four patients in the Japanese series, homozygous in
      one and compound heterozygous in three; also reported homozygous in a Chinese
      paediatric patient.
    type: nonsense
    clinical_significance: PATHOGENIC
    regulatory_category: LOF
    evidence:
    - reference: PMID:42608543
      reference_title: "Clinical features of four unrelated Japanese patients with autosomal recessive spinocerebellar ataxia type 32."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analysis identified one homozygous and three compound heterozygous PRDX3 nonsense variants: the previously reported p.Arg207* in all patients, p.Arg170* in two, and novel p.Gln50* in one."
      explanation: Documents p.Arg207* in every patient of the Japanese series.
    - reference: PMID:42608543
      reference_title: "Clinical features of four unrelated Japanese patients with autosomal recessive spinocerebellar ataxia type 32."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The relatively high p.Arg207* allele frequency in East Asians and the 0.97% prevalence in our undiagnosed ataxia cohort support SCAR32 as an important cause of early-onset autosomal recessive cerebellar ataxia in Japan."
      explanation: Establishes p.Arg207* as a comparatively common East Asian allele and gives the diagnostic yield in a repeat-negative ataxia cohort.
    - reference: PMID:41351775
      reference_title: "A homozygous PRDX3 pathogenic variant in a paediatric case of spinocerebellar ataxia type 32."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This rare variant (gnomAD allele frequency: 2/251,446; 1/18,394 East Asian) was predicted to cause premature termination and loss of protein function"
      explanation: Quantifies the population rarity of the allele and its East Asian enrichment.
  - name: PRDX3 c.508C>T (p.Arg170*)
    description: >-
      The most frequently reported pathogenic allele, seen homozygous in an Indian
      patient and compound heterozygous in two Korean patients and in two of the
      four Japanese patients. Reported alongside a novel p.Asp171Gly missense
      allele four base pairs away in one Korean proband.
    type: nonsense
    clinical_significance: PATHOGENIC
    regulatory_category: LOF
    evidence:
    - reference: PMID:37731903
      reference_title: "Expansion of clinico-genetic spectrum of PRDX3 disease: a literature review with two additional cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The genetic findings identified in our study indicated that the p.Arg170Ter variant is the most frequent pathogenic hit"
      explanation: Identifies p.Arg170Ter as the most frequently recurring PRDX3 allele.
  - name: PRDX3 c.496A>T (p.Lys166*)
    description: >-
      Homozygous nonsense allele in a consanguineous family, and the report that
      first added profound hearing impairment to the PRDX3 phenotype alongside
      global developmental delay, hypotonia, dystonia and cerebellar atrophy.
    type: nonsense
    clinical_significance: PATHOGENIC
    regulatory_category: LOF
    evidence:
    - reference: PMID:36190665
      reference_title: "A novel biallelic variant further delineates PRDX3-related autosomal recessive cerebellar ataxia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a biallelic nonsense variant (c.496A > T; p.Lys166*) in the exon 5 of the PRDX3 gene that segregated perfectly within the family."
      explanation: Identifies the allele and its segregation in the family.
  - name: PRDX3 c.425C>G (p.Ala142Gly)
    description: >-
      Missense allele reported in compound heterozygosity with the
      p.Leu176TrpfsTer11 frameshift. Used as a comparator in the aggregation
      experiments, where it damaged mitochondria less severely than p.Asp163Glu.
    type: missense
    clinical_significance: PATHOGENIC
    regulatory_category: LOF
    evidence:
    - reference: PMID:38837640
      reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patient 2 is a 20-year-old male who was found to present the known c.425C>G/p. Ala142Gly variant in compound heterozygosity with the p. Leu176TrpfsTer11 one."
      explanation: Documents the allele in a compound-heterozygous patient.
  - name: PRDX3 c.489C>G (p.Asp163Glu)
    description: >-
      Missense allele found homozygous in the earliest-onset patient reported
      (19 months). Unlike the other alleles it produces an unstable protein that
      aggregates and activates the mitochondrial and endoplasmic-reticulum unfolded
      protein responses before being cleared, and damages mitochondria more
      severely than p.Asp202Asn or p.Ala142Gly when expressed exogenously. This
      allele is not simply a null: the published data show loss of the enzyme
      plus a gain of aggregation-driven proteostatic stress that the nonsense
      alleles do not produce, which is why the node-level
      `functional_impact_category` of LOSS_OF_FUNCTION describes the shared
      lesion rather than this allele in full.
    type: missense
    clinical_significance: PATHOGENIC
    regulatory_category: LOF
    evidence:
    - reference: PMID:35766882
      reference_title: "Protein misfolding and clearance in the pathogenesis of a new infantile onset ataxia caused by mutations in PRDX3."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "in PRDX3 was identified in homozygosis in the proband, and in heterozygosis in each progenitor"
      explanation: Establishes the homozygous state in the proband with heterozygous parents.
  - name: PRDX3 c.525_535del (p.Leu176TrpfsTer11)
    description: >-
      Frameshift allele reported homozygous in one patient and compound
      heterozygous with p.Ala142Gly in a second, both presenting with early-onset
      slowly progressive cerebellar syndrome.
    type: frameshift
    clinical_significance: PATHOGENIC
    regulatory_category: LOF
    evidence:
    - reference: PMID:38837640
      reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patient 2 is a 20-year-old male who was found to present the known c.425C>G/p. Ala142Gly variant in compound heterozygosity with the p. Leu176TrpfsTer11 one."
      explanation: Documents the frameshift allele in compound heterozygosity with a known missense allele.
  evidence:
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified recessive mutations in PRDX3 as the genetic cause of cerebellar ataxia in five unrelated families, providing further evidence for oxidative stress in the pathogenesis of neurodegeneration."
    explanation: Establishes PRDX3 as the causative gene across five unrelated families.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate has been published for SCAR32, so the
    qualitative ULTRA_RARE tier is used rather than a numeric Orphanet band. About
    fifteen patients had been described by mid-2024 and roughly twenty by 2026.
    The disease is not uniformly distributed: a Japanese series found four
    patients among 411 repeat-expansion-negative ataxia cases, a diagnostic yield
    in a selected cohort that is not a population rate.
  evidence:
  - reference: PMID:38837640
    reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "15 individuals harboring pathogenic variants have been described with onset ages ranging from infancy to adulthood."
    explanation: The published case count as of 2024; graded OTHER because it is a literature tally rather than a study result.
  - reference: PMID:42608543
    reference_title: "Clinical features of four unrelated Japanese patients with autosomal recessive spinocerebellar ataxia type 32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report four unrelated Japanese patients with SCAR32 identified among 411 ataxia cases negative for repeat expansion disorders."
    explanation: Gives the numerator and denominator behind the Japanese diagnostic yield quoted in the note.
- population: Republic of Korea
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.034
  notes: >-
    0.34 patients per million, which is 0.034 per 100,000. This is the only
    published population figure for SCAR32 and it is an ALLELE-FREQUENCY-DERIVED
    ESTIMATE, not an observed rate: it is calculated from the Korean Variant
    Archive 2 frequencies of the three PRDX3 alleles identified in that study, and
    the authors express it as at least 17 expected patients nationally against a
    handful diagnosed. It therefore reflects the alleles known in 2023 and should
    be read as a lower bound on an undiagnosed population rather than a
    measurement.
  evidence:
  - reference: PMID:37731903
    reference_title: "Expansion of clinico-genetic spectrum of PRDX3 disease: a literature review with two additional cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the allele frequencies of the 3 identified variants reported in the KOVA2, PRDX3 disease patients are estimated to be 0.34 individuals per million (at least 17 patients in the Republic of Korea), indicating that more efforts should be made in identifying PRDX3 disease."
    explanation: The allele-frequency-derived national estimate and its stated derivation.

animal_models:
- name: prdx3 F0 crispant zebrafish
  species: Zebrafish
  genotype: prdx3 CRISPR-Cas9 F0 crispant (somatic biallelic disruption)
  publication: PMID:38837640
  description: >-
    An F0 "crispant" zebrafish generated to test prdx3 function during nervous
    system development, made because no zebrafish model of PRDX3 existed. Larvae
    show reduced burst activity on tail-coiling, reduced locomotor velocity and
    distance, increased susceptibility to oxidative stress, impaired mitochondrial
    bioenergetics, and increased apoptotic cells with raised apoptosis-associated
    transcripts.
  evidence:
  - reference: PMID:38837640
    reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "our functional characterization of the prdx3 zebrafish model revealed motor defects, increased susceptibility to reactive oxygen species-triggered apoptosis, and an impaired oxygen consumption rate."
    explanation: Establishes the crispant as an informative in vivo model of prdx3 depletion.
  modeled_mechanisms:
  - target: Cerebellar Neuronal Oxidative Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      prdx3 depletion in vivo reproduces the ROS-sensitised apoptosis and the
      motor consequence that this node asserts for human cerebellar neurons.
    limitations: >-
      Species divergence, and an F0 somatic crispant is mosaic rather than a
      germline null, so residual prdx3 is expected. The apoptosis and motor
      readouts are whole-larva measurements at 24-120 hours post fertilisation:
      nothing localises the injury to the cerebellum, and a developing larva is
      not a model of the adult-onset human presentations.
    readouts:
    - name: ROS-triggered apoptotic cell burden
      target: Cerebellar Neuronal Oxidative Injury
      direction: INCREASED
      interpretation: >-
        Acridine-orange-positive cells and apoptosis-associated transcripts both
        rise in prdx3-depleted larvae, the in vivo counterpart of the apoptotic
        sensitisation seen in PRDX3-knockdown cerebellar cells.
      evidence:
      - reference: PMID:38837640
        reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we observed a likely ROS‐triggered increment of acridine orange‐positive cells"
        explanation: The apoptosis measurement behind this readout.
    - name: Larval locomotor burst activity
      target: Cerebellar Neuronal Oxidative Injury
      direction: DECREASED
      interpretation: >-
        Reduced burst activity on the tail-coiling test is the motor output
        consequence of prdx3 depletion.
      evidence:
      - reference: PMID:38837640
        reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The tail‐coiling test results showed a significant decrease in burst activity in prdx3‐F0 animals compared with controls"
        explanation: The locomotor measurement behind this readout.
  - target: Mitochondrial Respiratory Impairment
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Oxygen-consumption studies in prdx3-depleted larvae reproduce the loss of
      respiratory capacity measured in patient fibroblasts.
    limitations: >-
      Whole-larva respirometry rather than a neuronal measurement, in a mosaic F0
      animal; and the corresponding human finding is itself inconsistent between
      patient fibroblast lines.
    readouts:
    - name: Larval maximal respiration and ATP production
      target: Mitochondrial Respiratory Impairment
      direction: DECREASED
      interpretation: >-
        Seahorse respirometry of 120-hpf larvae shows reduced ATP-linked and
        maximal respiration on prdx3 depletion.
      evidence:
      - reference: PMID:38837640
        reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "oxygen consumption rate studies revealed impaired mitochondrial bioenergetics in 120‐hpf larvae compared with controls, with significant reductions in ATP production and maximal respiration"
        explanation: The respirometry measurement behind this readout.

- name: Pan-neuronal and pan-glial Drosophila prdx3 knockdown
  species: Fruit fly
  genotype: RNAi knockdown of the PRDX3 orthologue driven pan-neuronally and pan-glially
  publication: PMID:33889951
  description: >-
    In vivo knockdown of the fly PRDX3 orthologue in neurons and in glia, used in
    the defining paper to test whether loss of the enzyme is sufficient to cause a
    locomotor phenotype and oxidative-stress vulnerability in an intact nervous
    system.
  evidence:
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Pan-neuronal and pan-glial in vivo models of Drosophila revealed aberrant locomotor phenotypes and reduced survival times upon exposure to oxidative stress."
    explanation: Establishes that neuronal and glial loss of the orthologue is sufficient for a locomotor and oxidative-stress phenotype.
  modeled_mechanisms:
  - target: Cerebellar Neuronal Oxidative Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces the causal step from neuronal loss of the peroxiredoxin to
      locomotor failure and oxidative-stress vulnerability, but not the anatomy.
    limitations: >-
      Drosophila has no cerebellum, so the model cannot address the regional
      selectivity that is the central unexplained feature of the human disease.
      Knockdown is RNAi rather than a null allele and is driven throughout neurons
      and glia rather than in the affected population, and the locomotor readout
      is not ataxia.
    readouts:
    - name: Survival under oxidative stress challenge
      target: Cerebellar Neuronal Oxidative Injury
      direction: DECREASED
      interpretation: >-
        Shortened survival on oxidative-stress exposure is the in vivo expression
        of the lost peroxide-buffering capacity.
      evidence:
      - reference: PMID:33889951
        reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Pan-neuronal and pan-glial in vivo models of Drosophila revealed aberrant locomotor phenotypes and reduced survival times upon exposure to oxidative stress."
        explanation: The survival measurement behind this readout.

experimental_models:
- name: SCAR32 patient dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary dermal fibroblasts from SCAR32 patients, the workhorse model of this
    literature and an inconsistent one. In the defining cohort they showed absent
    PRDX3, reduced glutathione peroxidase activity and reduced maximal respiratory
    capacity; in the infantile-onset patient they showed near-absent PRDX3, raised
    mitochondrial superoxide and increased sensitivity to glutathione depletion;
    but in the 2024 pair of patients they were biochemically unremarkable.
  evidence:
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts showed a lack of PRDX3 protein, resulting in decreased glutathione peroxidase activity and decreased mitochondrial maximal respiratory capacity."
    explanation: The positive fibroblast result that made this the standard model for the disease.
  modeled_mechanisms:
  - target: Mitochondrial Respiratory Impairment
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      In the 2024 report the patient fibroblast line reproduced none of the
      expected biochemistry: oxygen consumption was indistinguishable from
      controls and susceptibility to oxidative stress was not increased, leading
      the authors to conclude that the relevant PRDX3 functions are not expressed
      in peripheral cells.
    limitations: >-
      This is a negative result in one laboratory's line and does not overturn
      the positive fibroblast findings of the defining cohort; genotypes differ
      between the reports. What it does establish is that a normal fibroblast
      assay cannot be used to exclude SCAR32, and that fibroblasts are an
      unreliable surrogate for the neuronal phenotype.
    readouts:
    - name: Fibroblast oxygen consumption rate
      target: Mitochondrial Respiratory Impairment
      direction: UNCHANGED
      interpretation: >-
        Seahorse respirometry of the patient line was not different from controls
        — a real negative, not a missing measurement.
      evidence:
      - reference: PMID:38837640
        reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Metabolic parameters obtained from OCR traces did not show significant changes in mitochondrial function between the patient and the controls."
        explanation: The respirometry measurement behind this negative readout.
    evidence:
    - reference: PMID:38837640
      reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "While the fibroblast model failed to recapitulate the pathological features associated with PRDX3 loss of function"
      explanation: The authors' own statement that their fibroblast model did not reproduce the PRDX3 loss-of-function phenotype.

diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis rests on finding biallelic pathogenic PRDX3 variants, in practice by
    exome or genome sequencing after repeat-expansion testing is negative.
    Homozygosity mapping helps in consanguineous families. A noncanonical splice
    allele causing exon skipping has been reported, so RNA studies may be needed
    when only one clearly damaging allele is found. In East Asian patients the
    recurrent p.Arg207* nonsense allele is worth specific attention.
  evidence:
  - reference: PMID:42608543
    reference_title: "Clinical features of four unrelated Japanese patients with autosomal recessive spinocerebellar ataxia type 32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report four unrelated Japanese patients with SCAR32 identified among 411 ataxia cases negative for repeat expansion disorders."
    explanation: Describes the practical diagnostic route — sequencing after negative repeat-expansion testing.
- name: Brain MRI
  description: >-
    MRI is the key supporting investigation. Cerebellar atrophy is universal;
    dentate-nucleus T2 hyperintensity and cerebellar cortical T2 hyperintensity
    have been proposed as a characteristic SCAR32 signature, with variable
    involvement of the middle cerebellar peduncles, posterior pons and inferior
    olives. The atrophy can be striking relative to a mild examination.
  evidence:
  - reference: PMID:42608543
    reference_title: "Clinical features of four unrelated Japanese patients with autosomal recessive spinocerebellar ataxia type 32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI showed cerebellar atrophy and T2 hyperintensity in dentate nuclei in all patients, and three had cerebellar cortical T2 hyperintensity, a potentially representative feature of SCAR32."
    explanation: The imaging pattern proposed as characteristic of SCAR32.

treatments:
- name: Physiotherapy and gait/balance training
  description: >-
    The mainstay of management. No disease-modifying therapy exists, so care is
    the general progressive-ataxia package: physiotherapy, gait and balance
    training, fall reduction, and mobility aids as ambulation declines. Function
    is tracked with SARA and, in paediatric patients, with balance and gross-motor
    measures.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Progressive cerebellar ataxia
    description: >-
      Addresses the functional consequence of the cerebellar syndrome. It does
      not act on the redox lesion and does not alter the degeneration.
      `treatment_effect` is deliberately absent: `TreatmentEffectEnum` offers
      INHIBITS, ACTIVATES, MODULATES, BYPASSES and RESTORES, and none of them is
      true of a purely symptomatic rehabilitative intervention.
  notes: >-
    No published trial or case series of any intervention in SCAR32, so this
    record carries no efficacy evidence. It describes standard ataxia care as
    applied to reported patients rather than an evidence-based therapy for this
    disease.

- name: Speech and language therapy
  description: >-
    For the cerebellar dysarthria, and later for the dysphagia that most patients
    develop as the syndrome spreads rostrally.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_mechanisms:
  - target: Dysarthria
    description: >-
      Symptomatic management of the cerebellar speech disorder.
      `treatment_effect` is absent for the same reason as on the physiotherapy
      link: no value in the enum describes a symptomatic intervention.
  notes: >-
    Standard-of-care inference from the curated phenotypes, not a SCAR32-specific
    published intervention; no efficacy evidence is attached because none exists.

- name: Genetic counselling
  description: >-
    Autosomal recessive transmission means a 25 percent sibling recurrence risk
    and, for an affected person, a low risk to offspring outside consanguinity.
    Both Korean probands were compound heterozygotes in a non-consanguineous
    setting, which is the specific point the Korean report makes about diagnostic
    strategy; carrier and cascade testing follow once the familial alleles are
    known.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37731903
    reference_title: "Expansion of clinico-genetic spectrum of PRDX3 disease: a literature review with two additional cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Particularly, both patients presented compound heterozygotes alleles highlighting the importance of consideration for compound heterozygote modes during diagnostic evaluation in nonconsanguineous populations."
    explanation: States the counselling-relevant point about compound heterozygosity in non-consanguineous families.

- name: Human chorionic gonadotropin replacement
  description: >-
    One reported patient had hypogonadotropic hormonal dysfunction with micropenis
    and received intramuscular human chorionic gonadotropin, 500 IU weekly for
    four weeks, after which testosterone rose. This treated a comorbidity found in
    a single SCAR32 patient; it is not a therapy for SCAR32, and the relationship
    of the endocrinopathy to PRDX3 deficiency is unestablished.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: chorionic gonadotropin
      term:
        id: CHEBI:81570
        label: Chorionic gonadotropin
  target_mechanisms:
  - target: Hypogonadotropic hypogonadism
    treatment_effect: RESTORES
    description: >-
      Gonadotropin replacement for the documented low FSH, LH and testosterone in
      the one patient in whom this was found.
  evidence:
  - reference: PMID:37553803
    reference_title: "Pure cerebellar ataxia due to bi-allelic PRDX3 variants including recurring p.Asp202Asn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent laboratory evaluations revealed an increase in testosterone levels to 6.42 mg/mL, while DHT levels remained unchanged at 0.01 mg/mL."
    explanation: The biochemical response to the gonadotropin course in the single treated patient.
  notes: >-
    A single-patient observation. Do not read this as a SCAR32 treatment.

differential_diagnoses:
- name: Autosomal recessive ataxia due to TXN2 deficiency
  description: >-
    The other disease of the mitochondrial thioredoxin system, and the closest
    mechanistic neighbour: like SCAR32 it causes early-onset neurodegeneration
    through increased ROS, impaired oxidative-stress defence and mitochondrial
    dysfunction, but through the thioredoxin rather than the peroxiredoxin.
  distinguishing_features:
  - Biallelic TXN2 rather than PRDX3 variants
- name: Friedreich ataxia
  description: >-
    The commonest recessive ataxia and a routine early consideration; also a
    mitochondrial, oxidative-stress-linked disease. Distinguished by the GAA
    repeat expansion in FXN, prominent sensory neuropathy and areflexia,
    cardiomyopathy and scoliosis, and by spinal cord rather than cerebellar
    cortical atrophy.
  distinguishing_features:
  - GAA repeat expansion in FXN
  - Cardiomyopathy and marked proprioceptive loss with areflexia
- name: Repeat-expansion spinocerebellar ataxias
  description: >-
    SCA1/2/3/6/7/10 and the late-onset FGF14 (SCA27B) GAA expansion are the first
    tier excluded in practice, and were negative in every SCAR32 patient reported
    from a screening cohort.
  distinguishing_features:
  - A pathogenic repeat expansion rather than biallelic PRDX3 variants
  - Usually dominant family history
- name: Other early-onset autosomal recessive cerebellar ataxias
  description: >-
    Ataxia with vitamin E deficiency, ataxia-telangiectasia, ARSACS, COQ8A ataxia
    and the recessive ataxias with cerebellar atrophy generally. Several of these
    are treatable, which is why they are excluded first.
  distinguishing_features:
  - Distinct causal genes and biochemical markers (alpha-fetoprotein, vitamin E, coenzyme Q10)

discussions:
- discussion_id: scar32_which_cerebellar_cell_population
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Cerebellar Cortical Degeneration"
  prompt: >-
    Which cerebellar cell population degenerates in SCAR32, and is the
    Purkinje cell the primary target?
  rationale: >-
    Every other recessive cerebellar ataxia curated here that declares
    conformance to the `cerebellar_purkinje_degeneration` module does so on the
    strength of neuropathology, a mouse or canine model with Purkinje-cell
    counts, or an explicit statement in the literature. SCAR32 has none of these:
    no autopsy or biopsy study of a SCAR32 patient has been published, no
    published model measures cerebellar cell populations, and the word Purkinje
    does not appear in any of the PRDX3 ataxia reports. The available human
    evidence is imaging — cerebellar cortical and vermian atrophy with dentate,
    cortical, peduncular and olivary T2 change — which localises the lesion to
    the cerebellar cortex and its connections but not to a cell type. This entry
    therefore stops at the cortex and does not declare module conformance. The
    gap matters beyond bookkeeping: the disease also involves the inferior olives
    and brainstem, and if the primary lesion were olivary or afferent rather than
    Purkinje-intrinsic, the shared Purkinje module would be the wrong causal
    story for it.
  proposed_experiments:
  - experiment_id: exp_scar32_cerebellar_histopathology
    name: Cerebellar histopathology of a SCAR32 brain
    description: >-
      Quantitative Purkinje-cell, granule-cell and dentate-neuron counts with
      calbindin immunostaining on post-mortem cerebellum from a genetically
      confirmed SCAR32 patient, compared with age-matched controls.
    would_support:
    - "pathophysiology#Cerebellar Cortical Degeneration"
    supporting_outcome:
    - >-
      Selective loss of Purkinje neurons with relative preservation of granule
      cells would localise the degeneration to the Purkinje cell and justify
      declaring conformance to the shared module.
    refuting_outcome:
    - >-
      Preserved Purkinje-cell counts with granule-cell or olivary loss would
      show that the shared Purkinje module is the wrong mechanism for SCAR32.
  - experiment_id: exp_scar32_cell_type_resolved_deletion
    name: Cell-type-resolved prdx3 loss in a cerebellum-bearing model
    description: >-
      Conditional Prdx3 deletion in mouse restricted to Purkinje cells versus to
      granule cells versus to inferior olivary neurons, with motor phenotyping
      and cerebellar histology.
    would_support:
    - "pathophysiology#Cerebellar Neuronal Oxidative Injury"
    supporting_outcome:
    - >-
      Ataxia and cerebellar degeneration following Purkinje-restricted deletion
      but not the other two would establish Purkinje-cell autonomy of the lesion.

- discussion_id: scar32_age_at_onset_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "genetic#PRDX3"
  prompt: >-
    Why does the same class of loss-of-function PRDX3 allele produce onset at 19
    months in one patient and at 35 years in another?
  rationale: >-
    Age at onset in SCAR32 spans birth to the mid-thirties across roughly twenty
    patients, and the spread is not explained by allele class: nonsense and
    missense alleles both appear at both ends. Two partial explanations have been
    offered and neither is established. The first is positional — variants in the
    later part of the thioredoxin domain, near the catalytic CXXC motifs, have
    been observed in the earlier-onset patients. The second is compensatory —
    PRDX5 and glutathione peroxidase are co-regulated with PRDX3, so a residual
    hypomorphic allele such as p.Gly180Ser paired with a null might be buffered
    well enough to delay onset by decades. A third, allele-specific mechanism is
    documented for p.Asp163Glu, where aggregation and unfolded-protein-response
    activation add an insult the null alleles do not carry. Distinguishing these
    matters for counselling, because it determines whether a genotype predicts
    anything about age at onset.
  proposed_experiments:
  - experiment_id: exp_scar32_allele_activity_panel
    name: Residual-activity and compensation panel across reported PRDX3 alleles
    description: >-
      Express each reported PRDX3 allele in a PRDX3-null cell background and
      measure protein abundance, thioredoxin-dependent peroxidase activity,
      aggregation propensity, and PRDX5/GPX1 compensatory induction, then test
      those measures against the reported age at onset for each allele.
    would_support:
    - "pathophysiology#PRDX3 Loss of Function"
    supporting_outcome:
    - >-
      A monotonic relationship between residual peroxidase activity (or the
      degree of compensatory induction) and age at onset would establish a
      genotype-phenotype rule for the disease.
    refuting_outcome:
    - >-
      No relationship between any biochemical measure and age at onset would
      point the explanation away from the allele and towards modifiers or
      environment.

- discussion_id: scar32_antioxidant_therapy_lead
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Mitochondrial Hydrogen Peroxide Accumulation"
  - "treatments#"
  prompt: >-
    Would an antioxidant or thioredoxin-system-directed drug change the course of
    SCAR32?
  rationale: >-
    The mechanism invites the question and nothing answers it. The defining paper
    ends by saying its findings suggest targets for future therapeutic approaches;
    the only concrete datum is one patient with biallelic TXN2 variants — the
    partner disease of the same mitochondrial thioredoxin system, whose product
    recycles oxidised PRDX3 — who improved clinically on idebenone. That is a
    single case in a different gene, and idebenone's action is on electron
    transport rather than on peroxide scavenging, so the inference to PRDX3
    disease is two steps long. It is recorded as a lead precisely so that it is
    not mistaken for a treatment: no SCAR32 patient has been given idebenone or
    any other antioxidant in a published report, and the entry's `treatments`
    block deliberately contains no such entry.
  proposed_experiments:
  - experiment_id: exp_scar32_antioxidant_rescue_panel
    name: Antioxidant rescue in PRDX3-deficient cerebellar and in vivo models
    description: >-
      Test mitochondria-targeted peroxide scavengers and thioredoxin-system
      agents, including idebenone as the clinically available comparator, against
      the established PRDX3-loss readouts: hydrogen peroxide accumulation and
      apoptotic sensitisation in PRDX3-depleted cerebellar cells, and locomotor
      output and oxidative-stress survival in the prdx3 zebrafish crispant and the
      Drosophila knockdown.
    would_support:
    - "pathophysiology#Mitochondrial Hydrogen Peroxide Accumulation"
    supporting_outcome:
    - >-
      Rescue of the peroxide and apoptosis readouts with a corresponding
      improvement in the in vivo locomotor phenotype would justify a first
      clinical trial and identify which arm of the redox system to target.
    refuting_outcome:
    - >-
      Correction of the peroxide readout without any improvement in the locomotor
      or survival phenotype would indicate that the neuronal injury is not
      reversible by scavenging alone and would redirect effort towards the
      proteostatic arm.

notes: >-
  Curation decisions worth knowing about.

  Frequency bands are used only where a source states the denominator. Cerebellar
  atrophy and progressive cerebellar ataxia are banded OBLIGATE because the
  literature says explicitly that atrophy is ubiquitous and because ataxia is the
  defining feature. Everything else — neuropathy, hearing loss, dystonia,
  cognitive impairment, endocrine findings — is left with no band, because the
  published patients are scattered across single-case reports and small series
  with no pooled denominator, and two of these features are explicitly recorded as
  absent in other patients.

  The Japanese figure of 0.97% is a diagnostic yield in a selected cohort of
  repeat-expansion-negative ataxia patients, not a population prevalence, and is
  deliberately kept out of the `prevalence` block for that reason; it is recorded
  against the p.Arg207* allele and in the prevalence note instead.

  The OMIM identity is quoted two different ways in the literature. MONDO's exact
  match for `MONDO:0859245` is OMIM 619862, and the Korean report gives
  `[SCAR32; Online Mendelian Inheritance in Man (OMIM) #619862]`; the 2025
  Chinese case report writes `#619648` instead, which appears to be a typographic
  error. 619862 is used here. There is no `omim_mappings` slot in this schema, so
  this is recorded as a note rather than as a structured mapping.

  Four alleles reported in the literature are NOT promoted to structured
  `variants` records: c.340dupG (p.Ala114Glyfs*3), c.43C>T (p.Arg15*), c.658C>T
  (p.Gln220*) and the splice alleles c.37-2A>G and c.311+5G>T. They appear only
  inside a whitespace-collapsed summary table in the cached full text of
  PMID:41351775, from which no quotable propositional snippet can be extracted,
  and their primary reports are either uncited here or have unavailable caches.
  Curating them would mean asserting genotypes with no verifiable evidence item.

  HPO carries per-feature frequencies for OMIM:619862 as n/5 fractions over the
  founding cohort — hypermetric saccades, saccadic pursuit and dysphagia at 4/5,
  and abnormal nerve conduction velocity and somatic sensory dysfunction at 0/5.
  Those are not used as `frequency` bands here, because the cohort paper is
  abstract-only in the reference cache and none of those counts can be quoted or
  verified against it. The 0/5 entries are the more interesting half — they are
  the evidence that this is a cerebellar rather than a genuinely spinocerebellar
  ataxia despite the name — and the same point is carried instead by the curated
  NO_EVIDENCE items and by the peripheral-neuropathy note.

  Two cited papers carry no evidence item because their reference caches are
  `content_type: unavailable`, so nothing in them can be quoted or verified:
  `Exon Skipping Caused by Noncanonical Splicing Mutation in PRDX3-Related
  Spinocerebellar Ataxia` (PMID:37553955), kept in the reference list so the
  splice-allele class is not invisible, and `Expanding PRDX3 disease: broad range
  of onset age and infratentorial MRI signal changes` (PMID:35792670), the
  >3,500-exome screen that first stretched the onset range and that later reports
  cite for it.

  Not curated: `biochemical`, because no laboratory marker of SCAR32 has been
  described. The two laboratory abnormalities in the literature - the thyroid
  autoantibody titres and the low selenium in one Chinese patient - are curated as
  phenotypes rather than as biomarkers, because a single patient does not
  establish either as a marker OF the disease, and the research assays (glutathione
  peroxidase activity, mitochondrial superoxide, respirometry) belong to the
  experimental models that measured them;
  `progression`, because no staged natural-history study exists and the
  onset-to-severity relationship is exactly what the second open discussion says
  is unexplained; `clinical_trials` and `datasets`, because there are none.

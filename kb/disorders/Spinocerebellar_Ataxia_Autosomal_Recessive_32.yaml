name: Spinocerebellar Ataxia, Autosomal Recessive 32
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: spinocerebellar ataxia, autosomal recessive 32
  term:
    id: MONDO:0859245
    label: spinocerebellar ataxia, autosomal recessive 32
description: >-
  Spinocerebellar ataxia, autosomal recessive 32 (SCAR32), also called
  PRDX3-associated neurodegeneration (PRAN), is the recessive cerebellar ataxia
  caused by biallelic loss-of-function variants in PRDX3. Peroxiredoxin 3 is the
  one member of the six-isoform human peroxiredoxin family that is restricted to
  mitochondria, where it is the thioredoxin-dependent peroxidase that clears the
  hydrogen peroxide generated by the respiratory chain. SCAR32 is therefore an
  ataxia of failed mitochondrial redox buffering rather than of a structural,
  channel, repeat-expansion or DNA-repair lesion, and it sits alongside TXN2
  deficiency as one of two ultra-rare diseases of the mitochondrial thioredoxin
  system.

  The entity was defined in 2021 from five unrelated families in the PREPARE
  recessive-ataxia network. The core picture is a slowly progressive cerebellar
  syndrome — gait then limb ataxia, cerebellar dysarthria, nystagmus and
  dysmetria — with cerebellar atrophy that is present in every reported patient,
  frequently disproportionate to the clinical severity, and often accompanied by
  T2 hyperintensity of the dentate nuclei, cerebellar cortex, middle cerebellar
  peduncles and posterior pons. Olivary and brainstem degeneration is reported in
  part of the cohort.

  What is distinctive, and unexplained, is the range of onset. It was described in
  2023 as birth to 35 years on the cases then published; a Korean report the same
  year, counting nine patients, put it at infantile onset to 55 years. Either way
  it spans both nonsense and missense alleles across a literature of roughly
  twenty patients, with no genotype-phenotype rule established. A second
  descriptive pattern proposed from the same report is a caudal-to-rostral spatial
  spread of the disease. The severe
  infantile end adds early peripheral neuropathy and rapid cerebellar volume loss;
  the adult end can be a nearly pure, slowly progressive cerebellar syndrome with
  independent ambulation preserved a decade after onset. Non-cerebellar features
  reported in individual patients — profound hearing impairment, dystonia,
  hypogonadotropic hormonal dysfunction, thyroid autoimmunity, intellectual
  disability — are each single-patient or few-patient observations and are curated
  here without frequency bands for that reason.

  Every PRDX3 allele characterised so far behaves as loss of function: the mutant
  protein is absent from patient fibroblasts, glutathione peroxidase activity and
  maximal mitochondrial respiratory capacity fall, and PRDX5 is co-reduced. One
  allele, p.Asp163Glu, adds a second mechanism on top of simple enzyme loss — an
  unstable protein that aggregates and triggers both the mitochondrial and the
  endoplasmic-reticulum unfolded protein responses — which is the current best
  candidate explanation for why that patient's disease began in infancy.

  A point this entry is deliberate about: no neuropathological study of a SCAR32
  patient has been published, and the word Purkinje does not appear anywhere in
  the PRDX3 ataxia literature. The degeneration is therefore curated at the
  cerebellar-cortex level that imaging actually supports, and conformance to the
  `cerebellar_purkinje_degeneration` module is NOT declared. See the open
  discussion.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Wechsler Intelligence Scale for Children-Fourth Edition (WISC-IV) indicated mild cognitive impairment (full-scale IQ: 74)"
    explanation: Formal psychometric documentation of mild cognitive impairment in a SCAR32 patient.
  - reference: PMID:37553803
    reference_title: "Pure cerebellar ataxia due to bi-allelic PRDX3 variants including recurring p.Asp202Asn."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL

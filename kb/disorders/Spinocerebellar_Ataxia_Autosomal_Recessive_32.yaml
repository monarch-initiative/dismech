    ocular-motor incoordination. MRI documents subsequent or concomitant cerebellar atrophy and variable
    signal changes in connected infratentorial structures. Dysfunction can precede visible atrophy.
    Imaging does not identify a primary neuronal subtype, and no Purkinje-specific mechanism is assigned.

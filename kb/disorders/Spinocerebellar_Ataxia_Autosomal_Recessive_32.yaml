    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified recessive mutations in PRDX3 as the genetic cause of cerebellar ataxia in five unrelated families, providing further evidence for oxidative stress in the pathogenesis of neurodegeneration."
    explanation: Establishes recessive inheritance of PRDX3 ataxia across five unrelated families in the defining study.
  - reference: PMID:35766882
    reference_title: "Protein misfolding and clearance in the pathogenesis of a new infantile onset ataxia caused by mutations in PRDX3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The further segregation analysis confirmed these findings and showed that his healthy brother was carrier of the PRDX3 c.489C > G variant in heterozygosis"
    explanation: Documents an unaffected heterozygous sibling, the segregation pattern expected of a recessive allele.
pathophysiology:
- name: PRDX3 Loss of Function
  biological_scale: MOLECULAR
  description: Biallelic PRDX3 variants impair the mitochondrial thioredoxin-dependent peroxidase.
    In the original five fibroblast lines, protein was undetectable in four and a faint band remained
    in one compound heterozygote. Missense instability, truncation and altered splicing therefore
    converge on absent or markedly reduced protein rather than necessarily absolute loss in every
    allele.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic germline variants occur in homozygous or compound-heterozygous state. Functionally
      studied variants markedly reduce protein abundance; residual protein differs between alleles.
  molecular_functions:
  - preferred_term: thioredoxin-dependent peroxiredoxin activity
    term:
      id: GO:0008379
      label: thioredoxin peroxidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Among the six isoforms (PRDX1-PRDX6), PRDX3 is the only protein exclusively localized to the mitochondria, which are the main source of reactive oxygen species."
    explanation: Background statement in the defining paper establishing PRDX3 as the exclusively mitochondrial peroxiredoxin; graded OTHER because it reports no experiment of its own.
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6247182
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6247182
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A faint band was detected in Patient 5
    explanation: The full paper describes a faint residual protein band in the compound heterozygote,
      qualifying universal absence claimed in a later review.
  - reference: PMID:37553803
    reference_title: "Pure cerebellar ataxia due to bi-allelic PRDX3 variants including recurring p.Asp202Asn."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mutation is located in the PRX_Tyrp2cys domain of the protein at a region of high conservation in the dimer interface located between two PRDX3 subunits of the dodecamer ring and causes a complete absence of the protein."
    explanation: Locates the recurrent p.Asp202Asn allele at the oligomer dimer interface and states that it abolishes the protein; graded OTHER as a structural interpretation of published data.
  - reference: PMID:35766882
    reference_title: "Protein misfolding and clearance in the pathogenesis of a new infantile onset ataxia caused by mutations in PRDX3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the patient's fibroblasts, PRDX3 expression was nearly absent."
    explanation: Direct measurement of protein loss in patient-derived fibroblasts.
  downstream:
  - target: Mitochondrial Hydrogen Peroxide Accumulation
    description: >-
      Loss of the mitochondrial thioredoxin-dependent peroxidase removes the
      principal matrix route for disposing of respiratory-chain hydrogen peroxide.
  - target: Misfolded PRDX3 Aggregation and Unfolded Protein Response

- name: Proposed Thyroid Autoimmune Response
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: The single thyroid case report proposes that excess ROS promotes inflammatory signaling
    and thyroid autoantigen presentation. This untested hypothesis could connect PRDX3-related redox
    failure to thyroid autoimmunity; incidental autoimmune disease remains possible.
  evidence:
  - reference: PMID:41351775
    reference_title: A homozygous PRDX3 pathogenic variant in a paediatric case of spinocerebellar
      ataxia type 32.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This oxidative stress may initiate two key pathological processes: accumulation of ROS in thyroid cells triggers pro-inflammatory pathways (NF-κB, NLRP3 inflammasome) and enhances presentation of thyroid autoantigens. These mechanisms may contribute to the development of thyroid autoimmunity in the context of PRDX3-related pathology."
    explanation: The authors propose oxidative-stress-mediated thyroid autoimmunity; this is a discussion
      hypothesis, not a patient-cell experiment.
    directness: INDIRECT
  downstream:
  - target: Goiter
    description: Autoimmune thyroid inflammation is a proposed explanation for gland enlargement in
      the antibody-positive case; a PRDX3-specific causal association remains unconfirmed.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41351775
      reference_title: A homozygous PRDX3 pathogenic variant in a paediatric case of spinocerebellar
        ataxia type 32.

    reference_title: "Pure cerebellar ataxia due to bi-allelic PRDX3 variants including recurring p.Asp202Asn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On neurological examination, he exhibited moderate gait ataxia, cerebellar dysarthria, saccadic pursuit, multi‐directional nystagmus, four limbs dysmetria, comprising a scale for the assessment and rating of ataxia (SARA) score of 12/40."
    explanation: Documents multidirectional nystagmus alongside the other cerebellar signs in a reported patient.
  notes: >-

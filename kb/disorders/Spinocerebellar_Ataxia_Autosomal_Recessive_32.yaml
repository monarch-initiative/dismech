- name: Mitochondrial Hydrogen Peroxide Accumulation
  biological_scale: MOLECULAR
  description: PRDX3 loss reduces mitochondrial peroxide buffering. Knockdown in cerebellar medulloblastoma
    cells raises H2O2 and susceptibility to oxidant-triggered apoptosis. Cultured patient fibroblasts
    and zebrafish show increased stress susceptibility, although basal ROS was normal in the 2024
    fibroblast line; this is not a uniform constitutive readout in all patient cells.
  biological_processes:
  - preferred_term: hydrogen peroxide catabolic process
    term:
      id: GO:0042744
      label: hydrogen peroxide catabolic process
    modifier: DECREASED
  - preferred_term: cell redox homeostasis
    term:
      id: GO:0045454
      label: cell redox homeostasis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts showed a lack of PRDX3 protein, resulting in decreased glutathione peroxidase activity and decreased mitochondrial maximal respiratory capacity."
    explanation: Couples PRDX3 protein loss to measured loss of peroxidase activity in patient cells.
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PRDX3 knockdown in cerebellar medulloblastoma cells resulted in significantly decreased cell viability, increased H2O2 levels and increased susceptibility to apoptosis triggered by reactive oxygen species."
    explanation: Shows directly that removing PRDX3 from a cerebellar cell line raises hydrogen peroxide and kills the cells.
  downstream:
  - target: Neuronal Oxidative Injury
    description: Loss of peroxide buffering increases susceptibility to oxidative cellular injury
      in experimental models. Translation to the selectively affected human neurons is provisional.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33889951
      reference_title: Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: PRDX3 knockdown in cerebellar medulloblastoma cells resulted in significantly decreased
        cell viability, increased H2O2 levels and increased susceptibility to apoptosis triggered
        by reactive oxygen species.
      explanation: Shows directly that removing PRDX3 from a cerebellar cell line raises hydrogen
        peroxide and kills the cells.
  - target: Mitochondrial Respiratory Impairment
    description: >-
      Oxidative damage to the organelle degrades its own respiratory capacity.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Proposed Thyroid Autoimmune Response
    description: The authors propose excess ROS as an initiator of inflammatory signaling and thyroid
      autoantigen presentation. This remains an untested disease-specific hypothesis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41351775
      reference_title: A homozygous PRDX3 pathogenic variant in a paediatric case of spinocerebellar
        ataxia type 32.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "This oxidative stress may initiate two key pathological processes: accumulation of ROS in thyroid cells triggers pro-inflammatory pathways (NF-κB, NLRP3 inflammasome) and enhances presentation of thyroid autoantigens. These mechanisms may contribute to the development of thyroid autoimmunity in the context of PRDX3-related pathology."
      explanation: The authors propose oxidative-stress-mediated thyroid autoimmunity; this is a discussion
        hypothesis, not a patient-cell experiment.
      directness: INDIRECT

- name: Misfolded PRDX3 Aggregation and Unfolded Protein Response
  biological_scale: CELLULAR
  description: The strongest evidence for this proteostatic arm concerns p.Asp163Glu; it does not
    apply to alleles that produce no protein. The p.Asp163Glu missense protein is unstable, forms
    insoluble aggregates and is routed to proteasomal degradation, and its expression activates the
    unfolded protein response in both the mitochondrion and the endoplasmic reticulum. Expressed exogenously
    it damages mitochondria far more severely than the p.Asp202Asn or p.Ala142Gly alleles do — cristae
    disorganisation, membrane damage and lipid-droplet accumulation — and in cultured mouse cortical
    neurons it distorts neurite morphology. This is the current candidate explanation for the 19-month
    onset in that patient, and it is a proteostatic mechanism layered on top of, not instead of, the
    shared enzyme loss.
  biological_processes:
  - preferred_term: mitochondrial unfolded protein response
    term:
      id: GO:0034514
      label: mitochondrial unfolded protein response
    modifier: INCREASED
  - preferred_term: endoplasmic reticulum unfolded protein response
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
  evidence:
  - reference: PMID:35766882
    reference_title: "Protein misfolding and clearance in the pathogenesis of a new infantile onset ataxia caused by mutations in PRDX3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The biochemical analysis suggested that the mutation p.D163E would result in an unstable structure tending to form aggregates that trigger unfolded protein responses via mitochondria and endoplasmic reticulum."
    explanation: States the aggregation-plus-UPR mechanism demonstrated for this allele.
  - reference: PMID:35766882
    reference_title: "Protein misfolding and clearance in the pathogenesis of a new infantile onset ataxia caused by mutations in PRDX3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mitochondrial morphology showed severe changes, including extremely damaged outer and inner membranes with a notable cristae disorganization."
    explanation: Documents the organelle damage produced by expressing the aggregating allele.
  - reference: PMID:35766882
    reference_title: "Protein misfolding and clearance in the pathogenesis of a new infantile onset ataxia caused by mutations in PRDX3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In mouse primary cortical neurons, the exogenous expression of PRDX3 p.D163E was reduced and triggered alterations in neurite morphology and in mitochondria."
    explanation: Extends the aggregating-allele damage to cultured neurons, the cell class relevant to the disease.
  downstream:
  - target: Neuronal Oxidative Injury
    description: Expression of p.Asp163Glu alters cultured cortical-neuron mitochondria and neurites.
      Its contribution to human neuronal injury is inferred from these experiments.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35766882
      reference_title: Protein misfolding and clearance in the pathogenesis of a new infantile onset
        ataxia caused by mutations in PRDX3.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In mouse primary cortical neurons, the exogenous expression of PRDX3 p.D163E was reduced
        and triggered alterations in neurite morphology and in mitochondria.
      explanation: Extends the aggregating-allele damage to cultured neurons, the cell class relevant
        to the disease.

- name: Mitochondrial Respiratory Impairment
  biological_scale: CELLULAR
  description: >-
    PRDX3-deficient cells lose respiratory reserve. Fibroblasts from proband 1 in the defining
    cohort had reduced maximal respiratory capacity, and prdx3-depleted zebrafish larvae show
    significant reductions in ATP production and maximal respiration. This is a consequence of
    the redox lesion rather than a primary OXPHOS subunit defect: PRDX3 is not part of any
    respiratory complex, and one later patient's fibroblasts showed no measurable respiratory
    abnormality at all, so the finding is not uniform across cell lines. Human muscle
    histochemistry in a different discovery-cohort patient showed some COX-negative fibres, a
    localized complex IV activity readout rather than evidence that every patient has a
    generalized mitochondrial myopathy.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: cellular respiration
    term:
      id: GO:0045333
      label: cellular respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts showed a lack of PRDX3 protein, resulting in decreased glutathione peroxidase activity and decreased mitochondrial maximal respiratory capacity."
    explanation: Reports the reduced maximal respiratory capacity in patient fibroblasts.
  - reference: PMID:38837640
    reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Fluorescence measurements in mutant zebrafish F0 embryos showed a significant increase
      in susceptibility to oxidative stress (Fig. 2D,D′), and oxygen consumption rate studies revealed
      impaired mitochondrial bioenergetics in 120‐hpf larvae compared with controls, with significant
      reductions in ATP production and maximal respiration (Fig. 2E,E′).
    explanation: Independent respiratory deficit in the prdx3-depleted zebrafish larva.
  - reference: PMID:38837640
    reference_title: "SCAR32: Functional characterization and expansion of the clinical-genetic spectrum."
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: "Metabolic parameters obtained from OCR traces did not show significant changes in mitochondrial function between the patient and the controls."
    explanation: A later patient's fibroblasts showed no respiratory abnormality, so this node is not uniformly demonstrable in peripheral cells.
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6247182
    reference_title: "https://oup.silverchair-cdn.com/article-minimal/6247182"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mild classical mitochondrial features were seen in only 1/5 patients, namely ptosis and
      COX-negative fibres (Patient 5), and none of the patients showed other classical features
      of mitochondrial diseases such as ophthalmoparesis, sensory neuropathy, epilepsy,
      hypoacusis, optic atrophy, diabetes or cardiomyopathy.
    explanation: >-
      Rebelo et al. (PMID:33889951), Results and Table 1, identify ptosis and some COX-negative
      muscle-biopsy fibres in Patient 5. The paired findings are case observations; they do not
      prove that the muscle stain explains the eyelid sign.
  downstream:
  - target: Neuronal Oxidative Injury
    description: Reduced respiratory reserve is proposed to compound oxidative neuronal injury. This
      is supported by cellular and whole-larval bioenergetic findings, without a direct measurement
      in affected human neurons.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38837640
      reference_title: 'SCAR32: Functional characterization and expansion of the clinical-genetic
        spectrum.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Fluorescence measurements in mutant zebrafish F0 embryos showed a significant increase
        in susceptibility to oxidative stress (Fig. 2D,D′), and oxygen consumption rate studies revealed
        impaired mitochondrial bioenergetics in 120‐hpf larvae compared with controls, with significant
        reductions in ATP production and maximal respiration (Fig. 2E,E′).
      explanation: Independent respiratory deficit in the prdx3-depleted zebrafish larva.


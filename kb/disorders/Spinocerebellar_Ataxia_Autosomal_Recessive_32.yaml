      evidence_source: HUMAN_CLINICAL
      snippet: Upon neurological examination, he presented with axial and appendicular skeleton hypotonia,
        as well as brisk deep tendon reflexes and extensor plantar on both sides.
      explanation: The coexisting brisk reflexes and extensor plantar responses support a pyramidal
        component in this boy.
      directness: INDIRECT

phenotypes:
- name: Progressive cerebellar ataxia
  category: Nervous System
  description: The defining feature. Onset is usually with gait ataxia, followed by limb ataxia, cerebellar
    dysarthria and dysmetria; progression is typically slow, with ambulation often retained years
    to a decade after onset, though the infantile-onset patient lost autonomous ambulation within
    two weeks of onset. Stable periods and some improvement in tremor or assisted walking were reported
    in the infantile case; progression is not uniform at every examination.
  phenotype_term:
    preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:33889951
    reference_title: "Biallelic loss-of-function variations in PRDX3 cause cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation of individuals with PRDX3 mutations consists of mild-to-moderate progressive cerebellar ataxia with concomitant hyper- and hypokinetic movement disorders, severe early-onset cerebellar atrophy, and in part olivary and brainstem degeneration."
    explanation: Progressive cerebellar ataxia is the presenting and defining feature in the founding cohort.
  - reference: PMID:42608543
    reference_title: "Clinical features of four unrelated Japanese patients with autosomal recessive spinocerebellar ataxia type 32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age at onset was 9-30 years, with a predominantly pure cerebellar phenotype; one patient had autoimmune comorbidities."
    explanation: Confirms a predominantly pure cerebellar phenotype in an independent four-patient series.
  notes: No disease-wide frequency is inferred from small, ataxia-ascertained case series.

- name: Gait ataxia
  category: Nervous System
  description: >-
    The usual first symptom across the age range, from a toddler with acute loss
    of independent sitting and walking to an adult reporting insidious unsteadiness.
  phenotype_term:
    preferred_term: Gait ataxia
    term:
      id: HP:0002066
      label: Gait ataxia
  evidence:
  - reference: PMID:41351775
    reference_title: "A homozygous PRDX3 pathogenic variant in a paediatric case of spinocerebellar ataxia type 32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, the patient presented with slowly progressive gait ataxia and cerebellar vermis atrophy."
    explanation: Gait ataxia as the presenting symptom in a paediatric SCAR32 patient.
  sequelae:
  - target: Frequent falls
    description: Impaired gait coordination increases falls, as described during progression in the
      adolescent-onset case.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38837640
      reference_title: 'SCAR32: Functional characterization and expansion of the clinical-genetic
        spectrum.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Shortly afterward he began experiencing frequent falls and difficulty climbing stairs,
        and brain MRI showed cerebellar atrophy.
      explanation: Direct clinical observation in a genetically confirmed patient; no disease-wide
        frequency is inferred.

- name: Cerebellar atrophy
  category: Nervous System
  description: 'Cerebellar atrophy is prominent across reported series but can emerge after symptoms:
    MRI was initially normal at 19 months in the infantile case, with midsagittal vermis relative
    diameter declining from 61% at 19 months to 52% at 23 months and 42% at 32 months.'
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:35766882
    reference_title: Protein misfolding and clearance in the pathogenesis of a new infantile onset
      ataxia caused by mutations in PRDX3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At 23 months old, MRI revealed a global cerebellar atrophy, with a decrease from 61 to
      52% (Fig. 1A, B and L).
    explanation: Serial imaging documents emergence of atrophy after the initially normal scan; the
      later 32-month scan reached 42%.
  - reference: PMID:42608543
    reference_title: "Clinical features of four unrelated Japanese patients with autosomal recessive spinocerebellar ataxia type 32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI showed cerebellar atrophy and T2 hyperintensity in dentate nuclei in all patients, and three had cerebellar cortical T2 hyperintensity, a potentially representative feature of SCAR32."
    explanation: Cerebellar atrophy in all four patients of an independent series.
  notes: Reported-case counts are not a population frequency estimate.
  reports_on:
  - target: Cerebellar Circuit Dysfunction and Degeneration
    relationship: READOUT_OF
    direction: POSITIVE
    interpretation: MRI volume loss reflects the structural-degeneration component; an initially normal
      scan does not exclude circuit dysfunction.
    evidence:
    - reference: PMID:35766882
      reference_title: Protein misfolding and clearance in the pathogenesis of a new infantile onset
        ataxia caused by mutations in PRDX3.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: At 23 months old, MRI revealed a global cerebellar atrophy, with a decrease from 61
        to 52% (Fig. 1A, B and L).
      explanation: Serial imaging documents emergence of atrophy after the initially normal scan;
        the later 32-month scan reached 42%.


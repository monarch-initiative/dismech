    explanation: An adult SCAR32 patient with no cognitive impairment, establishing that intellectual disability is not constant.

- name: Anti-thyroid peroxidase antibody positivity
  category: Endocrine
  description: >-
    Raised anti-thyroid peroxidase and anti-thyroglobulin antibodies with an
    enlarged, heterogeneously echogenic thyroid, in one Chinese paediatric
    patient who also had a low serum selenium. One patient in the Japanese series
    is separately recorded as having autoimmune comorbidities. The reporting
    authors offer an oxidative-stress rationale for a link to PRDX3 deficiency,
    but it is a hypothesis about two patients, not an established association.
  phenotype_term:
    preferred_term: Anti-thyroid peroxidase antibody positivity
    term:
      id: HP:0025379
      label: Anti-thyroid peroxidase antibody positivity
  evidence:
  - reference: PMID:41351775
    reference_title: "A homozygous PRDX3 pathogenic variant in a paediatric case of spinocerebellar ataxia type 32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comprehensive laboratory tests showed decreased levels of selenium (85.44 µg/L), increased levels of thyroid autoantibodies, including anti-thyroid peroxidase (30.54 IU/mL) and anti-thyroglobulin (238.21 IU/mL)."
    explanation: The measured thyroid autoantibody titres, together with the low selenium, in this patient.
  - reference: PMID:42608543
    reference_title: "Clinical features of four unrelated Japanese patients with autosomal recessive spinocerebellar ataxia type 32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age at onset was 9-30 years, with a predominantly pure cerebellar phenotype; one patient had autoimmune comorbidities."
    explanation: A second, independent patient with autoimmune comorbidity, though the report does not say which.
  notes: >-
    Two patients across the whole literature, so no frequency band. Treat as a
    reported association awaiting replication rather than a feature of SCAR32.

- name: Goiter
  category: Endocrine

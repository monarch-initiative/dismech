name: VPS51-Related Pontocerebellar Hypoplasia-CDG
creation_date: "2026-07-06T12:00:00Z"
category: Mendelian
description: >-
  VPS51-related pontocerebellar hypoplasia-CDG is a rare autosomal recessive
  neurodevelopmental and neurometabolic disorder caused by biallelic VPS51
  variants. VPS51 encodes the shared GARP/EARP tethering-complex subunit needed
  for endosome-derived carrier fusion at the trans-Golgi network and recycling
  endosomes. Patient cells show reduced assembled GARP/EARP complexes, altered
  mannose-6-phosphate receptor distribution, lysosomal swelling, and abnormal
  cellular and serum glycoprotein glycosylation. Reported individuals have
  severe developmental delay or intellectual disability, microcephaly, epilepsy,
  hypotonia, thin corpus callosum or pontocerebellar abnormalities, failure to
  thrive, and variable hepatic, hearing, feeding, and vision involvement.
disease_term:
  preferred_term: VPS51-related pontocerebellar hypoplasia-CDG
  term:
    id: MONDO:0032831
    label: pontocerebellar hypoplasia, type 13
parents:
- Neurodevelopmental Disorder
- Pontocerebellar Hypoplasia
- congenital disorder of glycosylation type II
synonyms:
- VPS51-related neurodevelopmental disorder
- VPS51 deficiency
- VPS51-related GARP/EARP complex dysfunction
- pontocerebellar hypoplasia-CDG due to VPS51 deficiency
notes: >-
  Ontology anchor, corrected 2026-08-20. This entry previously carried no
  disease_term on the basis that no exact MONDO class existed. That was wrong:
  MONDO:0032831 "pontocerebellar hypoplasia, type 13" xrefs OMIM:618606 - the
  same OMIM number this entry was seeded from - and records VPS51 (HGNC:1172)
  as its causal gene via RO:0004003. It is bound here. The earlier audit
  correctly rejected PCH1A, which is a VRK1 anterior-horn-cell disorder, but
  did not go on to check the numbered PCH series past it.

  One caveat the binding does not resolve. MONDO:0032831 is classified under
  MONDO:0020135 pontocerebellar hypoplasia, not under MONDO:0015286 congenital
  disorder of glycosylation, so this entry is a member of the
  Congenital_Disorders_of_Glycosylation grouping without being a MONDO
  descendant of the grouping's mapped class. That is an upstream
  classification gap rather than a curation error here: patient cells show
  abnormal cellular and serum glycoprotein glycosylation, which is why the name
  carries the CDG suffix and why the entry conforms to the CDG module. A MONDO
  request to add the CDG parent to MONDO:0032831 would be the right follow-up,
  and is a smaller ask than the new-term request previously assumed to be
  needed.

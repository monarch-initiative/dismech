  evidence:
  - reference: PMID:30624672
    reference_title: "A neurodevelopmental disorder caused by mutations in the VPS51 subunit of the GARP and EARP complexes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

genetic:
- name: LIPH
  subtype: ARWH2
  notes: >
    Biallelic loss-of-function variants in LIPH cause autosomal recessive woolly
    hair/hypotrichosis 2 (ARWH2; OMIM 604379) by abolishing production of 2-acyl
    lysophosphatidic acid.
  gene_term:
    preferred_term: LIPH
    term:
      id: hgnc:18483
      label: LIPH
  evidence:
  - reference: PMID:19536142
    supports: SUPPORT
    evidence_source: IN_VITRO
    reference_title: "In vitro analysis of LIPH mutations causing hypotrichosis simplex: evidence confirming the role of lipase H and lysophosphatidic acid in hair growth."
    snippet: "Mutations in LIPH, which encodes lipase member H, have recently been shown to cause an autosomal-recessive form of HS."
    explanation: Establishes LIPH (lipase member H) as the cause of an autosomal recessive form of hypotrichosis simplex / woolly hair.
  case_fractions:
  - population: Pakistani ARWH families
    case_fraction_percent: 47.2
    notes: Share of Pakistani autosomal recessive woolly hair families attributed to LIPH; the remainder carried LPAR6.
    evidence:
    - reference: PMID:33988877
      reference_title: "Isolated autosomal recessive woolly hair/hypotrichosis: genetics, pathogenesis and therapies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "In the Pakistani population, 47.2% of ARWH families had the disease due to LIPH mutations and 52.8% of them carried LPAR6 mutations."
      explanation: Gives both gene shares in the same Pakistani ARWH family series.
  - population: Japanese ARWH families
    case_fraction_percent: 98.7
    notes: >-
      LIPH accounts for nearly all Japanese ARWH families, driven by two
      recurrent founder alleles. The same figure is recorded under prevalence
      with the founder-allele detail; it is repeated here because it is a
      per-gene case share, which is what this slot is for.
    evidence:
    - reference: PMID:33988877
      reference_title: "Isolated autosomal recessive woolly hair/hypotrichosis: genetics, pathogenesis and therapies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Most Japanese ARWH families (98.7%) harbour LIPH mutations, including the two highly prevalent, recurrent LIPH mutations c.736T>A (p.Cys246Ser) and c.742C>A (p.His248Asn)."
      explanation: Gives the LIPH share of Japanese ARWH families.
- name: LPAR6
  subtype: ARWH1
  notes: >
    Biallelic variants in LPAR6 (P2RY5) cause autosomal recessive woolly
    hair/hypotrichosis 1 (ARWH1; OMIM 278150) by disrupting the LPA receptor that
    acts downstream of LIPH.
  gene_term:
    preferred_term: LPAR6
    term:
      id: hgnc:15520
      label: LPAR6
  evidence:
  - reference: PMID:19529952
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    reference_title: "Novel mutations in the P2RY5 gene in one Turkish and two Indian patients presenting with hypotrichosis and woolly hair."
    snippet: "Our study increases the spectrum of known P2RY5 mutations and highlights the importance of this receptor in human hair growth and texture."
    explanation: Identifies LPAR6/P2RY5 mutations in patients with woolly hair and underscores the receptor's role in hair growth and texture.
  case_fractions:
  - population: Pakistani ARWH families
    case_fraction_percent: 52.8
    notes: Share of Pakistani autosomal recessive woolly hair families attributed to LPAR6; the remainder carried LIPH.
    evidence:
    - reference: PMID:33988877
      reference_title: "Isolated autosomal recessive woolly hair/hypotrichosis: genetics, pathogenesis and therapies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "In the Pakistani population, 47.2% of ARWH families had the disease due to LIPH mutations and 52.8% of them carried LPAR6 mutations."
      explanation: Gives both gene shares in the same Pakistani ARWH family series.
- name: KRT74
  subtype: ADWH
  notes: >
    Heterozygous variants in KRT74 cause autosomal dominant woolly hair through a
    hair-shaft keratin filament defect.
  gene_term:
    preferred_term: KRT74
    term:
      id: hgnc:28929
      label: KRT74
  evidence:
  - reference: PMID:20346438
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    reference_title: "Autosomal-dominant woolly hair resulting from disruption of keratin 74 (KRT74), a potential determinant of human hair texture."
    snippet: "In this study, we define the ADWH phenotype resulting from a mutation in a hair-follicle-specific epithelial keratin in humans."
    explanation: Defines autosomal dominant woolly hair as resulting from a KRT74 hair-follicle-specific keratin mutation.
- name: KRT71
  subtype: HYPT13
  notes: >-
    KRT71 is the second type II inner-root-sheath keratin reported in autosomal
    dominant woolly hair. MONDO gives it its own gene-anchored term in the
    hypotrichosis series (MONDO:0014390, hypotrichosis 13, RO:0004003 to KRT71),
    which is why it is curated as a distinct subtype rather than folded into the
    KRT74 ADWH row.
  gene_term:
    preferred_term: KRT71
    term:
      id: hgnc:28927
      label: KRT71
  evidence:
  - reference: PMID:22592156
    reference_title: A missense mutation within the helix initiation motif of the keratin K71 gene underlies autosomal dominant woolly hair/hypotrichosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we discovered the heterozygous mutation c.422T>G (p.Phe141Cys) within the helix initiation motif of the IRS-specific keratin K71 (KRT71) gene in affected family members."
    explanation: Reports the heterozygous KRT71 variant segregating with autosomal dominant woolly hair and hypotrichosis in a Japanese family.
  - reference: PMID:26160856
    reference_title: A homozygous missense variant in type I keratin KRT25 causes autosomal recessive woolly hair.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "ADWH and hypotrichosis (MIM 613981) are caused by mutations in two type II IRS-specific genes KRT71 (MIM 608245) and KRT74 (MIM 608248)."
    explanation: Independent confirmation that KRT71 sits beside KRT74 as an autosomal dominant woolly hair gene. The quote is the introduction of the KRT25 gene-discovery paper restating established human genetics, not that paper's own finding.
- name: KRT25
  subtype: ARWH3
  notes: >-
    KRT25 is a type I inner-root-sheath keratin. It is the one recessive gene in
    this entry that does not act through the LIPH-LPA-LPAR6 axis, so it wires to
    the keratin filament node rather than the signalling node.
  gene_term:
    preferred_term: KRT25
    term:
      id: hgnc:30839
      label: KRT25
  evidence:
  - reference: PMID:26160856
    reference_title: A homozygous missense variant in type I keratin KRT25 causes autosomal recessive woolly hair.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous missense variant c.950T>C (p.(Leu317Pro)) within KRT25 segregated with ARWH in both families"
    explanation: Reports segregation of a biallelic KRT25 variant with autosomal recessive woolly hair in two unrelated consanguineous families.
  - reference: PMID:33988877
    reference_title: "Isolated autosomal recessive woolly hair/hypotrichosis: genetics, pathogenesis and therapies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Woolly hair autosomal recessive 1 (ARWH1) (MIM #278150), woolly hair autosomal recessive 2 (ARWH2) (MIM #604379) and woolly hair autosomal recessive 3 (ARWH3) (MIM #616760) are caused by mutations in LPAR6, LIPH and KRT25, respectively."
    explanation: A review assigning ARWH3 to KRT25, corroborating the gene-discovery report.
- name: C3ORF52
  notes: >-
    C3orf52 is curated with no subtype foreign key because MONDO has no
    gene-anchored disease term for it: searching the MONDO build for "C3orf52"
    (`runoak -i sqlite:obo:mondo search "C3orf52"`) returns only the HGNC gene
    node, and none of the six children of MONDO:0008686 names it. The gene
    discovery paper describes the phenotype as localized autosomal recessive
    hypotrichosis, and it is included in this entry because the ARWH review
    reports the same variants in ARWH patients and places the gene in the same
    LPA-biosynthesis axis as LIPH and LPAR6.
  gene_term:
    preferred_term: C3ORF52
    term:
      id: hgnc:26255
      label: C3orf52
  evidence:
  - reference: PMID:33988877
    reference_title: "Isolated autosomal recessive woolly hair/hypotrichosis: genetics, pathogenesis and therapies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition, nonsense variants in C3ORF52 (*611956) were identified in ARWH patients."
    explanation: The basis for including C3ORF52 in this entry rather than only in a hypotrichosis entry.
  - reference: PMID:32336749
    reference_title: Loss-of-function variants in C3ORF52 result in localized autosomal recessive hypotrichosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified homozygous variants in C3ORF52 in four individuals with LAH."
    explanation: The gene-discovery report, in four individuals; it describes the phenotype as localized autosomal recessive hypotrichosis.
  - reference: PMID:32336749
    reference_title: Loss-of-function variants in C3ORF52 result in localized autosomal recessive hypotrichosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The LAH-causing variants were associated with decreased C3ORF52 expression and resulted in markedly reduced lipase H-mediated LPA biosynthesis."
    explanation: Places C3orf52 upstream in the same LPA-biosynthesis step as LIPH, which is why it wires to the signalling node in this entry.
prevalence:
- subtype: ARWH2
  population: Japan
  prevalence_class: UNKNOWN
  percentage: unknown
  notes: >-
    LIPH-related ARWH (ARWH2) is described as the most prevalent hereditary hair
    disease in Japan, with 98.7% of Japanese ARWH families carrying LIPH mutations,
    driven by the two recurrent founder alleles c.736T>A (p.Cys246Ser) and
    c.742C>A (p.His248Asn).
  evidence:
  - reference: PMID:33988877
    reference_title: "Isolated autosomal recessive woolly hair/hypotrichosis: genetics, pathogenesis and therapies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most Japanese ARWH families (98.7%) harbour LIPH mutations, including the two highly prevalent, recurrent LIPH mutations c.736T>A (p.Cys246Ser) and c.742C>A (p.His248Asn)."
    explanation: Documents the high prevalence and founder-mutation basis of LIPH-related ARWH in the Japanese population.

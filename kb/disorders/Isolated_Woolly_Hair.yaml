- name: Inner Root Sheath Keratin Filament Defect
  conforms_to: "keratin_intermediate_filament_fragility#Keratin Filament Network Collapse and Aggregation"
  description: >
    The inner root sheath keratins heterodimerise in obligate type I / type II
    pairs to build the keratin intermediate filaments that shape the growing
    hair shaft. KRT74 and KRT71 are the type II partners and KRT25 the type I
    partner curated here. Heterozygous dominant KRT74 or KRT71 variants impair
    filament assembly in the inner root sheath, and biallelic KRT25 variants
    disrupt the same filaments from the type I side, in each case distorting
    hair-shaft formation and producing woolly hair with variable hypotrichosis.
    This is a separate mechanism from the LIPH-LPA-LPAR6 signalling node: the
    keratin subtypes are not LPA-axis disorders, which is why a single entry
    carries two independent pathophysiology chains.
  genes:
  - preferred_term: KRT74
    term:
      id: hgnc:28929
      label: KRT74
  - preferred_term: KRT71
    term:
      id: hgnc:28927
      label: KRT71
  - preferred_term: KRT25
    term:
      id: hgnc:30839
      label: KRT25
  evidence:
  - reference: PMID:20346438
    reference_title: "Autosomal-dominant woolly hair resulting from disruption of keratin 74 (KRT74), a potential determinant of human hair texture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that the mutant K74 protein results in disruption of keratin intermediate filament formation in cultured cells, most likely in a dominant-negative manner."
    explanation: Demonstrates that mutant K74 (KRT74) disrupts keratin intermediate filament assembly in a dominant-negative manner, the molecular basis of autosomal dominant woolly hair.
  - reference: PMID:20346438
    reference_title: "Autosomal-dominant woolly hair resulting from disruption of keratin 74 (KRT74), a potential determinant of human hair texture."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KRT74 encodes the inner root sheath (IRS)-specific epithelial (soft) keratin 74."
    explanation: Establishes KRT74 as an inner root sheath-specific hair keratin whose disruption causes woolly hair.
  - reference: PMID:22592156
    reference_title: A missense mutation within the helix initiation motif of the keratin K71 gene underlies autosomal dominant woolly hair/hypotrichosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrated that the mutant K71 protein led to disruption of keratin intermediate filament formation in cultured cells."
    explanation: Shows that a woolly-hair KRT71 variant produces the same intermediate-filament assembly failure as the KRT74 variant, extending this node to the second type II inner-root-sheath keratin.
  - reference: PMID:26160856
    reference_title: A homozygous missense variant in type I keratin KRT25 causes autosomal recessive woolly hair.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The KRT25 variant is predicted to result in disruption of the second α-helical rod domain and the entire protein structure, thus possibly interfering with heterodimerisation of K25 with type II keratins within the inner root sheath (IRS) of the hair follicle and the medulla of the hair shaft."
    explanation: Gives the type I side of the same filament defect. The authors state this as a structural prediction from molecular modelling rather than a measured assembly failure, so it is graded as the in-silico analysis it is.

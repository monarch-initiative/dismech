    autosomal recessive 1, with or without hypotrichosis" as a related synonym,
    while MONDO:0800312 has no OMIM xref and no gene relationship. Both are
    direct children of MONDO:0008686. This looks like an upstream duplication
    rather than two diseases; it is recorded here rather than resolved, because
    rebinding to the gene-anchored term would silently change which MONDO
    identifier this subtype claims.

name: Genital Lichen Sclerosus
creation_date: '2026-07-02T21:00:00Z'
category: Complex
parents:
- Autoimmune Disease
- Skin Disease
disease_term:
  preferred_term: Genital lichen sclerosus
  term:
    id: MONDO:0007899
    label: lichen sclerosus et atrophicus
description: >-
  Genital lichen sclerosus is a chronic immune-mediated inflammatory disorder
  of genital skin, encompassing vulvar lichen sclerosus and penile lichen
  sclerosus (balanitis xerotica obliterans). It produces ivory-white atrophic
  lesions, pruritus or soreness, and progressive sclerosis that can distort
  vulvar anatomy or cause phimosis and urinary obstruction. The pathogenesis is
  incompletely understood; HLA-associated susceptibility, a Th1-skewed T-cell
  infiltrate, ECM1 autoantibodies, oxidative injury, and abnormal extracellular
  matrix remodeling have evidence of differing strength. Long-term follow-up is
  important because genital disease can be complicated by squamous cell
  carcinoma.
synonyms:
- Genital lichen sclerosus et atrophicus
- Lichen sclerosus genitalium
- White spot disease of the genitalia
has_subtypes:
- name: Vulvar Lichen Sclerosus
  subtype_term:
    preferred_term: Vulvar lichen sclerosus
    term:
      id: MONDO:0006491
      label: vulvar lichen sclerosus
  description: >-
    Lichen sclerosus involving the vulva and often the perianal region, with
    pruritus, whitish atrophic lesions, scarring, and possible loss of normal
    vulvar architecture.
- name: Penile Lichen Sclerosus
  display_name: Penile lichen sclerosus (balanitis xerotica obliterans)
  subtype_term:
    preferred_term: Balanitis xerotica obliterans
    term:
      id: MONDO:0001725
      label: balanitis xerotica obliterans
  description: >-
    Lichen sclerosus involving the foreskin and glans penis, where atrophic
    hypopigmented lesions and scarring can cause phimosis, meatal stenosis, or
    urethral stricture.
  evidence:
  - reference: PMID:33620847
    reference_title: Balanitis Xerotica Obliterans (Male Penile Lichen Sclerosus).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Balanitis xerotica obliterans is a form of lichen sclerosus that involves
      the foreskin and glans penis in affected male individuals.
    explanation: This review identifies balanitis xerotica obliterans as the penile form of lichen sclerosus.

inheritance:
- name: Multifactorial susceptibility
  inheritance_term:
    preferred_term: Non-Mendelian inheritance
    term:
      id: HP:0001426
      label: Non-Mendelian inheritance
  description: >-
    Genital lichen sclerosus is not a monogenic Mendelian disorder. Familial
    aggregation and HLA associations support a complex susceptibility model in
    which genetic predisposition interacts with immune and local factors.
  evidence:
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      LS pathogenesis involves factors such as a genetic predisposition and an
      immune-mediated Th1-specific IFNγ-induced phenotype.
    explanation: The review supports genetic predisposition without a single-gene inheritance model.

prevalence:
- subtype: Vulvar Lichen Sclerosus
  population: Women attending general gynecology private practice
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1700.0
  notes: >-
    This is an ascertainment-setting-specific estimate and should not be treated
    as general-population prevalence. Overall genital lichen sclerosus frequency
    is likely underestimated because disease may be asymptomatic or
    unrecognized.
  evidence:
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In regard to VLS, the prevalence in general gynecology private practice
      reached 1.7%.
    explanation: The cited 1.7% is represented as 1,700 cases per 100,000 in the stated clinical setting.

genetic:
- name: HLA-DQ7 susceptibility association
  gene_term:
    preferred_term: HLA-DQB1
    term:
      id: hgnc:4944
      label: HLA-DQB1
  association: Enrichment of HLA-DQ7, corresponding to sequence variation at the HLA-DQB1 locus
  relationship_type: SUSCEPTIBILITY
  notes: >-
    This is an association signal, not a Mendelian cause. The primary study did
    not find the classic HLA-A1-B8-DR3-DQ2 autoimmune profile.
  evidence:
  - reference: PMID:7888355
    reference_title: The association between lichen sclerosus and antigens of the HLA system.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DQ7 was present in 39 of 78 (50%) of patients compared with 89 (25%)
      controls (P < 0.001).
    explanation: A case-control study found significant HLA-DQ7 enrichment in histologically proven lichen sclerosus.
- name: HLA-DRB1*12 susceptibility association in vulvar disease
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  association: Increased frequency of HLA-DR12 (HLA-DRB1*12) in vulvar lichen sclerosus
  relationship_type: SUSCEPTIBILITY
  subtype: Vulvar Lichen Sclerosus
  notes: This review-level association is not evidence of monogenic causation.
  evidence:
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A study of UK women with VLS demonstrated an increased frequency of
      HLA-DR12 (DRB1*12) and a lower frequency of HLA-DR17 (DRB1*0301/04)
      compared to controls.
    explanation: The review summarizes an HLA-DRB1*12 susceptibility association in vulvar disease.

pathophysiology:
- name: Th1-Skewed Genital Lymphocytic Inflammation
  description: >-
    Genital lichen sclerosus lesions contain dermal T-cell infiltrates with CD8
    and regulatory T cells and a smaller CD4 component. CXCR3/CCR5 expression
    and interferon-gamma production support a Th1-skewed inflammatory profile,
    but the initiating antigen and exact causal sequence remain unresolved.
  cell_types:
  - preferred_term: T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T-helper 1 type immune response
    term:
      id: GO:0042088
      label: T-helper 1 type immune response
  - preferred_term: Interferon-gamma production
    term:
      id: GO:0032609
      label: type II interferon production
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The involved cells express the chemokine receptors CXCR3 and CCR5 and lack
      CCR3 and CCR4, suggesting a Th1 profile.
    explanation: The review summarizes lesional immunophenotyping that supports a Th1-skewed profile.
  downstream:
  - target: Basal Keratinocyte Injury and Oxidative Stress
    description: Chronic T-cell inflammation contributes to epithelial injury and oxidative stress.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Proinflammatory cytokine signaling
    - Reactive oxygen species generation
  - target: Dermal Sclerosis and Epithelial Atrophy
    description: Chronic inflammation promotes tissue remodeling and sclerosis through incompletely resolved intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: ECM1-Directed Humoral Autoimmune Response
  description: >-
    Circulating IgG autoantibodies recognize extracellular matrix protein 1
    (ECM1) in many patients. The immune response is reproducible, but whether it
    drives matrix injury or is partly an epiphenomenon remains uncertain.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:12867112
    reference_title: Autoantibodies to extracellular matrix protein 1 in lichen sclerosus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings provide evidence for a specific humoral immune response to
      ECM1 in lichen sclerosus
    explanation: Recombinant ECM1 immunoreactivity was present in 64 of 86 cases and 6 of 85 controls.
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The significance of the autoantibodies is unclear and, except for
      anti-EMC1 antibodies, they may only represent an epiphenomenon rather than
      a key-component of the LS pathogenesis
    explanation: The review cautions against treating all detected autoantibodies as established causal drivers.
  downstream:
  - target: Dermal Sclerosis and Epithelial Atrophy
    description: >-
      ECM1 autoantibodies have been proposed to alter MMP9 and TGF-beta activity,
      but causality and intermediate steps are not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Basal Keratinocyte Injury and Oxidative Stress
  description: >-
    Basal keratinocyte degeneration and oxidative damage accompany genital
    lichen sclerosus. Lipid peroxidation, oxidative DNA damage, and reduced
    antioxidant defenses are reported, but their position in the causal
    sequence remains provisional.
  cell_types:
  - preferred_term: Keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: Response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Lipid peroxidation in keratinocytes, oxidative DNA damage and protein
      oxidation in areas of LS were associated with low concentrations of
      antioxidant enzymes
    explanation: The review summarizes oxidative injury observed in lichen sclerosus tissue.
  downstream:
  - target: Dermal Sclerosis and Epithelial Atrophy
    description: Persistent epithelial injury and inflammation contribute to the fibrosing tissue-remodeling response.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Chronic inflammatory signaling
    - Fibroblast activation and collagen deposition
- name: Dermal Sclerosis and Epithelial Atrophy
  description: >-
    Fibroblast proliferation and increased collagen I and III synthesis remodel
    the upper dermis, while basal keratinocyte degeneration and epidermal
    atrophy weaken the epithelial surface. These changes produce the hallmark
    white atrophic lesions, scarring, and site-specific functional sequelae.
  cell_types:
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: Keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: Extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
  - preferred_term: Collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
  - preferred_term: Transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Another characteristic of LS is the augmented collagen synthesis in the
      dermis, in particular, collagen I and III.
    explanation: The review supports abnormal collagen synthesis and fibroblast-associated remodeling.
  downstream:
  - target: Hypopigmented Genital Lesions
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Genital Scarring and Architectural Loss
    causal_link_type: DIRECT
  - target: Phimosis
    causal_link_type: DIRECT
  - target: Dyspareunia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Urethral Stricture
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

phenotypes:
- name: Hypopigmented Genital Lesions
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Hypopigmented genitalia
    term:
      id: HP:0030259
      label: Hypopigmented genitalia
  description: Ivory-white, waxy, atrophic macules, papules, or plaques on affected genital skin.
  evidence:
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The typical clinical picture includes chronic whitish atrophic patches
      along with itching and soreness in the vulvar, perianal and penile regions.
    explanation: The review describes the characteristic whitish atrophic genital lesions.
- name: Pruritus
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  description: Itching of affected genital skin, often accompanied by soreness or burning.
  evidence:
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical picture of anogenital LS (gLS) includes ivory-white patches,
      atrophy and severe pruritus
    explanation: Severe pruritus is described as a typical feature of anogenital disease.
- name: Dysuria
  phenotype_term:
    preferred_term: Dysuria
    term:
      id: HP:0100518
      label: Dysuria
  description: Painful or difficult urination associated with fissures, meatal involvement, or scarring.
  evidence:
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Fissures are often localized between clitoris and urethra and in the
      interlabial sulci, leading to dysuria
    explanation: The review directly links vulvar fissuring near the urethra to dysuria.
- name: Genital Scarring and Architectural Loss
  phenotype_term:
    preferred_term: Genital scarring
    term:
      id: HP:0100699
      label: Scarring
  description: >-
    Fibrotic scarring can resorb or fuse vulvar structures, narrow the introitus,
    or create foreskin and glans adhesions.
  evidence:
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Scarring often results in fusion or even complete resorption of labia
      minora and loss of clitoral hood.
    explanation: The review describes architectural loss caused by vulvar scarring.
- name: Dyspareunia
  frequency: OCCASIONAL
  subtype: Vulvar Lichen Sclerosus
  phenotype_term:
    preferred_term: Dyspareunia
    term:
      id: HP:0030016
      label: Dyspareunia
  description: Pain during intercourse due to introital narrowing, fissuring, and inelastic scarred tissue.
  evidence:
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      narrowing of vaginal introitus can occasionally lead to dyspareunia
    explanation: The review directly links introital narrowing to occasional dyspareunia.
- name: Phimosis
  subtype: Penile Lichen Sclerosus
  phenotype_term:
    preferred_term: Phimosis
    term:
      id: HP:0001741
      label: Phimosis
  description: Progressive preputial scarring can prevent foreskin retraction.
  evidence:
  - reference: PMID:33620847
    reference_title: Balanitis Xerotica Obliterans (Male Penile Lichen Sclerosus).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Involvement of the foreskin leads to atrophic skin changes with
      depigmentation and constriction, which can result in phimosis.
    explanation: The penile lichen sclerosus review links preputial constriction to phimosis.
- name: Urethral Stricture
  subtype: Penile Lichen Sclerosus
  phenotype_term:
    preferred_term: Urethral stricture
    term:
      id: HP:0012227
      label: Urethral stricture
  description: Scar-mediated narrowing of the urethra is a recognized sequela of penile disease.
  evidence:
  - reference: PMID:33620847
    reference_title: Balanitis Xerotica Obliterans (Male Penile Lichen Sclerosus).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Urethral stricture disease, phimosis, and meatal stenosis are common
      sequelae of balanitis xerotica obliterans.
    explanation: The review identifies urethral stricture as a penile lichen sclerosus sequela.
- name: Vulvar Squamous Cell Carcinoma
  subtype: Vulvar Lichen Sclerosus
  frequency: OCCASIONAL
  description: >-
    Vulvar squamous cell carcinoma is a clinically important long-term
    complication; risk is higher with concurrent vulvar intraepithelial
    neoplasia and older age at lichen sclerosus diagnosis.
  evidence:
  - reference: PMID:27257093
    reference_title: 'Lichen Sclerosus: Incidence and Risk of Vulvar Squamous Cell Carcinoma.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age at time of lichen sclerosus diagnosis was 59.8 years and
      the cumulative VSCC incidence was 6.7%.
    explanation: A Dutch pathology-registry cohort of 3,038 women quantified cumulative vulvar cancer incidence.


treatments:
- name: Topical Clobetasol Propionate 0.05%
  role: First-line therapy
  description: >-
    An ultrapotent topical corticosteroid used to induce control of active
    genital lichen sclerosus and continued or intermittent maintenance according
    to clinical response.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Clobetasol propionate
      term:
        id: CHEBI:31414
        label: clobetasol propionate
  target_phenotypes:
  - preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:23472631
    reference_title: 'Treatment of male genital lichen sclerosus with clobetasol propionate and maintenance with either methylprednisolone aceponate or tacrolimus: a retrospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clobetasol propionate 0.05% cream is effective as first-line treatment in male GLS.
    explanation: A retrospective study of 41 men found improvement after eight weeks of clobetasol propionate.
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Topical glucocorticosteroids are the first-line therapy in gLS
    explanation: The review identifies topical corticosteroids, commonly clobetasol propionate, as first-line genital treatment.
- name: Topical Tacrolimus
  role: Off-label alternative or maintenance therapy
  description: >-
    A topical calcineurin inhibitor considered when clobetasol is not tolerated
    or fails, and studied as maintenance therapy after initial corticosteroid
    response. Clobetasol remains the preferred first-line treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Tacrolimus
      term:
        id: CHEBI:61049
        label: tacrolimus (anhydrous)
  evidence:
  - reference: PMID:23472631
    reference_title: 'Treatment of male genital lichen sclerosus with clobetasol propionate and maintenance with either methylprednisolone aceponate or tacrolimus: a retrospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The data suggest that there is no difference between methylprednisolone
      aceponate 0.1% cream and tacrolimus 0.1% ointment in preventing the relapses.
    explanation: The study supports tacrolimus as a maintenance option after response to clobetasol in male disease.
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Calcineurin inhibitors, namely tacrolimus 0.1% ointment or pimecrolimus 1%
      cream once or twice a day for 1–2 months, can be considered as an off-label
      alternative in case of failure or intolerance to CP
    explanation: The review limits topical calcineurin inhibitors to an off-label alternative when clobetasol fails or is not tolerated.
- name: Circumcision for Penile Scarring or Phimosis
  role: Surgical treatment for penile disease
  context: Penile Lichen Sclerosus
  description: >-
    Complete circumcision is used for progressive fibrous phimosis and foreskin
    scarring in penile lichen sclerosus; persistent active disease may still
    require topical corticosteroid treatment and follow-up.
  treatment_term:
    preferred_term: Circumcision
    term:
      id: NCIT:C87068
      label: Male Circumcision
  target_phenotypes:
  - preferred_term: Phimosis
    term:
      id: HP:0001741
      label: Phimosis
  evidence:
  - reference: PMID:36873861
    reference_title: 'Lichen sclerosus: The 2023 update'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a frenuloplasty in the context of complete circumcision should be recommended
    explanation: The review recommends complete circumcision in the surgical management of male genital scarring.

notes: >-
  This entry deliberately excludes the quantitative immune-cell counts and the
  ten PMIDs that prior review found to be fabricated or unrelated. Every PMID
  retained here was regenerated with the repository reference-fetch workflow.
  Mechanistic language distinguishes observed associations from causal claims
  because the ordering of immune, oxidative, and fibrotic events remains
  incompletely understood.
datasets:
- accession: geo:GSE290798
  title: Multi-omics analysis unveiled fibroblast-mediated pathogenesis in male genital lichen sclerosus
  description: Male genital lichen sclerosus (MGLSc), a chronic inflammatory dermatological condition, has been recognized for its profound implications on the quality of life among males. The exact etiological factors behind this prevalent condition remained largely enigmatic. In this research, we employed a multi-omics strategy to identify and elucidate the underlying histological biomarkers and the fundamental pathogenesis associated with MGLSc. Generally, a comprehensive cell atlas of MGLSc disease was constructed, highlighting a pronounced increase in T cells coupled with a remarkable reduction in keratinocytes within the MGLSc samples.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 9
  publication: PMID:40745572
  notes: Identified by GEO DataSets index search for Genital Lichen Sclerosus (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.

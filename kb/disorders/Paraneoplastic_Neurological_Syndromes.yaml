definitions:
- name: Remote cancer-associated neurologic syndrome definition
  definition_type: OTHER
  description: >-
    Paraneoplastic neurological syndromes are remote neurologic effects of
    cancer, distinct from metastasis or other cancer complications.
  evidence:
  - reference: PMID:17480225
    reference_title: "Paraneoplastic neurological syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Paraneoplastic neurological syndromes (PNS) can be defined as remote effects of cancer that are not caused by the tumor and its metastasis, or by infection, ischemia or metabolic disruptions."
    explanation: The Orphanet Journal of Rare Diseases review provides the core clinical definition for PNS.
- name: PNS-Care diagnostic evidence levels
  definition_type: CASE_DEFINITION
  description: >-
    Contemporary diagnostic criteria classify PNS evidence as definite,
    probable, or possible using clinical phenotype, antibody risk category,
    cancer detection, and follow-up duration.
  evidence:
  - reference: PMID:34006622
    reference_title: "Updated Diagnostic Criteria for Paraneoplastic Neurologic Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Each level can be reached by using the PNS-Care Score, which combines clinical phenotype, antibody type, the presence or absence of cancer, and time of follow-up."
    explanation: The 2021 expert consensus defines the PNS-Care score and diagnostic certainty levels.
- name: Opsoclonus-myoclonus exception to the antibody requirement
  definition_type: CASE_DEFINITION
  description: >-
    Opsoclonus-myoclonus syndrome is the one named exception in the 2021
    PNS-Care criteria. Definite PNS otherwise requires a high- or
    intermediate-risk antibody; OMS occurring with neuroblastoma or
    small-cell lung cancer is accepted as definite PNS without one, because
    the syndrome has no specific antibody association in either setting. In
    children that matters for a practical reason: a negative commercial
    autoantibody panel does not argue against neuroblastoma-associated OMS,
    and should not delay the tumour search.
  evidence:
  - reference: PMID:34006622
    reference_title: Updated Diagnostic Criteria for Paraneoplastic Neurologic Syndromes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "With the exception of opsoclonus-myoclonus, the diagnosis of definite PNS requires the presence of high- or intermediate-risk antibodies. ... The panel proposed as exception the OMS associated with neuroblastoma or SCLC in which there is no specific antibody association. Therefore, although this syndrome provides a score of 7, it should be considered definite PNS when associated with these tumors."
    explanation: >-
      The consensus panel's own statement of the exception and of its reason:
      the syndrome scores 7 on the PNS-Care score and is nonetheless called
      definite when it occurs with these two tumours. Graded OTHER because the
      quoted text is a consensus panel's criteria decision rather than a study
      result, and REVIEW_SYNTHESIS because the panel is codifying work it did
      not perform.
  - reference: PMID:34006622
    reference_title: Updated Diagnostic Criteria for Paraneoplastic Neurologic Syndromes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Another example is OMS in children with neuroblastoma (in this case, patients do not have a specific antibody)."
    explanation: >-
      States the absence of a specific antibody association in the paediatric
      neuroblastoma setting, which is what the exception rests on.

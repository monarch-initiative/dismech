- name: Intravenous Immunoglobulin
  description: >-
    Intravenous immunoglobulin is used as antibody-directed or immune-modulating
    therapy in selected PNS phenotypes, including opsoclonus-myoclonus and
    autoimmune cerebellar presentations.
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Pathogenic Autoantibody-Mediated Synaptic Dysfunction (Surface Antigen PNS)
    treatment_effect: MODULATES
    description: IVIG can modulate pathogenic humoral immune responses and Fc-mediated effector pathways.
    evidence:
    - reference: PMID:26414229
      reference_title: Responses to and Outcomes of Treatment of Autoimmune Cerebellar Ataxia in Adults.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Responses to immunotherapy (corticosteroids, intravenous immunoglobulin, plasma exchange, and immunosuppressants)"
      explanation: This cohort explicitly includes intravenous immunoglobulin among assessed immunotherapies.
  - target: Tumor-Infiltrating Polyclonal Lymphoid Response
    treatment_effect: MODULATES
    description: >-
      The strongest trial evidence for IVIG anywhere in this entry is in
      neuroblastoma-associated OMS, where adding it to prednisone and
      risk-adapted chemotherapy doubled the response rate in a randomised
      comparison. What it does to the tumour's lymphoid response is not
      measured, so the edge is a modulation claim rather than a mechanism.
    evidence:
    - reference: PMID:29376112
      reference_title: "Intravenous immunoglobulin with prednisone and risk-adapted chemotherapy for children with opsoclonus myoclonus ataxia syndrome associated with neuroblastoma (ANBL00P3): a randomised, open-label, phase 3 trial."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "Significantly higher rates of OMA response were observed in patients randomized to IVIG+ compared to NO-IVIG [21/26=80.8% for IVIG+; 11/27=40.7% for NO-IVIG (odds ratio=6.1; 95% CI: (1.5, 25.9), p=0.0029)]."
      explanation: >-
        The trial result. Indirect for this edge because the measured outcome
        is neurological response, not any property of the tumour infiltrate
        the node describes.
  evidence:
  - reference: PMID:26414229
    reference_title: Responses to and Outcomes of Treatment of Autoimmune Cerebellar Ataxia in Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Responses to immunotherapy (corticosteroids, intravenous immunoglobulin, plasma exchange, and immunosuppressants)"
    explanation: The cohort explicitly includes intravenous immunoglobulin among assessed immunotherapies.
  - reference: PMID:29376112
    reference_title: "Intravenous immunoglobulin with prednisone and risk-adapted chemotherapy for children with opsoclonus myoclonus ataxia syndrome associated with neuroblastoma (ANBL00P3): a randomised, open-label, phase 3 trial."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significantly higher rates of OMA response were observed in patients randomized to IVIG+ compared to NO-IVIG [21/26=80.8% for IVIG+; 11/27=40.7% for NO-IVIG (odds ratio=6.1; 95% CI: (1.5, 25.9), p=0.0029)]."
    explanation: >-
      81% versus 41% response with and without IVIG added to prednisone and
      risk-adapted chemotherapy, odds ratio 6.1. The arms are small, 26 and 27
      children, which the wide confidence interval reflects.
  - reference: PMID:29376112
    reference_title: "Intravenous immunoglobulin with prednisone and risk-adapted chemotherapy for children with opsoclonus myoclonus ataxia syndrome associated with neuroblastoma (ANBL00P3): a randomised, open-label, phase 3 trial."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the only randomized prospective therapeutic clinical trial in children with neuroblastoma-associated OMA. The addition of IVIG to prednisone and risk-adapted chemotherapy significantly improves OMA response rate."
    explanation: >-

- name: Tumor-Infiltrating Polyclonal Lymphoid Response
  biological_scale: TISSUE
  description: >-
    A third mechanism arm, and the one that fits neither of this entry's two
    antibody-defined subtypes. In children, opsoclonus-myoclonus syndrome is
    the paraneoplastic syndrome characteristic of neuroblastic tumours: about
    half of children presenting with OMS in referral cohorts are found to have
    a tumour, and in those the tumour is neuroblastic, most often
    neuroblastoma. The tumours of affected children carry a distinctive
    immune infiltrate - diffuse and extensive lymphocytic infiltration with
    lymphoid follicles, which matched controls do not show - and that
    infiltrate is a polyclonal expansion of both B and T cells organised into
    tertiary lymphoid structures, with no single antigenic stimulus
    identified. Commercially screened serum autoantibodies are negative in
    this setting while cerebrospinal fluid oligoclonal bands and B cells are
    present, so the humoral signal is intrathecal rather than a serum
    antibody. Which arm of the response injures the brain is unsettled; see
    the knowledge gap in discussions.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: B cell activation
    modifier: INCREASED
    term:
      id: GO:0042113
      label: B cell activation
  - preferred_term: T cell proliferation
    modifier: INCREASED
    term:
      id: GO:0042098
      label: T cell proliferation
  evidence:
  - reference: PMID:11344493
    reference_title: "Opsoclonus-myoclonus-ataxia syndrome in neuroblastoma: histopathologic features-a report from the Children's Cancer Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathology slides from a total of 54 neuroblastoma tumors were reviewed blindly. They included 13 tumors associated with opsoclonus-myoclonus and 41 age- and stage-matched controls. ... Twelve of 13 cases had diffuse (found in every section prepared from the multiple portions of the primary tumor) and extensive (occupying more than 50% of a single of multiple microscopic fields with x 100 magnification) lymphocytic infiltration with lymphoid follicles. Of the 41 control cases (27 FH and 14 UH tumors), 18 had focal areas of lymphocytic infiltration and six showed lymphoid follicles, but none had diffuse or extensive infiltration in their primary tumors."
    explanation: >-
      The controlled histology this node rests on: 13 OMS-associated tumours
      against 41 age- and stage-matched controls, read blind, with 12 of 13
      showing diffuse and extensive lymphocytic infiltration with lymphoid
      follicles and none of the 41 controls showing it. The quote carries the
      authors' own definitions of diffuse and extensive, which is why they are
      not paraphrased here.
  - reference: PMID:37537844
    reference_title: Polyclonal lymphoid expansion drives paraneoplastic autoimmunity in neuroblastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found greater B and T cell infiltration in OMAS-associated tumors compared to controls and showed that both were polyclonal expansions. Tertiary lymphoid structures (TLSs) were enriched in OMAS-associated tumors."
    explanation: >-
      Characterises the infiltrate rather than merely counting it: both
      lineages are expanded, both expansions are polyclonal, and the cells are
      organised into tertiary lymphoid structures.
  - reference: PMID:37537844
    reference_title: Polyclonal lymphoid expansion drives paraneoplastic autoimmunity in neuroblastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our surprise, we found that the robust immune cell infiltrate is dominated by polyclonal B and T cells, absent the identification of a unifying single antigenic stimulus"
    explanation: >-
      The negative result that keeps this node out of both antibody-defined
      subtypes: no unifying antigen was identified. The same paper records that
      the B-cell repertoire's diversity, together with few control samples and
      their small repertoires, precluded nominating any specific clone, so this
      is a failure to find rather than a demonstration that none exists.
  - reference: PMID:28959231
    reference_title: "Demographic, Clinical, and Immunologic Features of 389 Children with Opsoclonus-Myoclonus Syndrome: A Cross-sectional Study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cerebrospinal fluid (CSF) leukocyte count was minimally elevated in 14% (<=11/mm3) with normal differential, and commercially screened serum autoantibodies were negative, but CSF oligoclonal bands (OCB) and B cells frequency were positive (58 and 93%)."
    explanation: >-
      The compartment the humoral signal sits in, from a cross-sectional study
      of 389 children with OMS: negative commercial serum autoantibodies
      alongside CSF oligoclonal bands in 58% and raised CSF B cells in 93%.
      This is what makes a negative serum panel uninformative here.
  - reference: PMID:28959231
    reference_title: "Demographic, Clinical, and Immunologic Features of 389 Children with Opsoclonus-Myoclonus Syndrome: A Cross-sectional Study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the 50% of patients in whom a tumor was found (n = 194), the tumor was neuroblastic: neuroblastoma in 73%, particularly with younger OMS onset age (Table 5)."
    explanation: >-
      The direction that runs from the syndrome to the tumour: of 389 children
      with OMS, a tumour was found in about half, and in those 194 the tumour
      was neuroblastic. This is a referral cohort, so the 50% is the fraction
      with a tumour found in a specialist OMS practice rather than a population
      figure, and it is not the complement of the 2-3% recorded under
      prevalence, which has a different denominator.
  - reference: PMID:34006622
    reference_title: Updated Diagnostic Criteria for Paraneoplastic Neurologic Syndromes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Paraneoplastic OMS in children accounts for 50% of cases and is closely associated with neuroblastoma."
    explanation: >-
      The consensus panel's statement of the same fraction, independent of the
      referral cohort above. Graded OTHER and REVIEW_SYNTHESIS because the
      sentence is the panel's summary of the literature rather than a study
      result of its own.
  downstream:
  - target: Opsoclonus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The tumour-associated lymphoid response is the mechanism this entry
      attributes childhood opsoclonus to, but how it reaches the brainstem and
      cerebellar circuits that generate opsoclonus is not established: no
      antigen is identified, and whether the effector arm is humoral or T-cell
      mediated is open.
    evidence:
    - reference: PMID:11344493
      reference_title: "Opsoclonus-myoclonus-ataxia syndrome in neuroblastoma: histopathologic features-a report from the Children's Cancer Group."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diffuse and extensive lymphocytic infiltration with lymphoid follicles is a characteristic histologic feature of neuroblastic tumors with opsoclonus-myoclonus. This observation suggests an immune-mediated mechanism for this rare paraneoplastic syndrome."
      explanation: >-
        The authors' own reading of their controlled histology, and the basis
        for drawing this edge. Indirect because the inference from a tumour
        infiltrate to a neurological sign is theirs to suggest rather than
        theirs to demonstrate, which the word suggests records.
  - target: Myoclonus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Myoclonus is the second component of the same syndrome and is attributed
      to the same tumour-associated response; the intermediate steps are no
      better established than for opsoclonus.
    evidence:
    - reference: PMID:11344493
      reference_title: "Opsoclonus-myoclonus-ataxia syndrome in neuroblastoma: histopathologic features-a report from the Children's Cancer Group."
      supports: SUPPORT
      directness: INDIRECT

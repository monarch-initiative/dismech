discussions:
- discussion_id: pns_omas_humoral_versus_t_cell_effector
  kind: KNOWLEDGE_GAP
  prompt: >-
    In neuroblastoma-associated opsoclonus-myoclonus-ataxia, is the arm that
    injures the brain humoral or T-cell mediated?
  attaches_to:
  - pathophysiology#Tumor-Infiltrating Polyclonal Lymphoid Response
  - treatments#Rituximab
  rationale: >-
    This entry sorts its other syndromes by effector arm - a cytotoxic T-cell
    subtype for intracellular antigens and a pathogenic-autoantibody subtype
    for surface antigens - and neuroblastoma-associated OMAS cannot be placed
    in either. The humoral case is circumstantial but consistent: CSF
    B-cell expansion tracking severity and response to B-cell depletion,
    oligoclonal bands, cytokines of B-cell activation, and IgG binding
    neuronal surfaces in a minority. Against it, no pathogenic autoantibody
    has been found, the tumour infiltrate is polyclonal in both lineages with
    no unifying antigen, and commercial serum panels are negative. The
    alternative, a T-cell-driven process, is harder to test, which is itself a
    reason the question stays open rather than evidence either way. It is not
    an academic point: the preference for rituximab over cyclophosphamide
    rests partly on the B-cell premise, so settling it would bear on first-line
    choice.
  status: OPEN
  posed_by: "dismech curation (neuroblastoma project, issue #14976)"
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "The elevation of cytokines and chemokines involved in B-cell activation, alongside CSF oligoclonal bands, may argue for a role for a pathogenic humoral autoimmune process in OMAS ... and discovery of a pathogenic autoantibody would advance the field substantially. This is supported by evidence of IgG binding to the cell surface of neurones in a minority of patients with OMAS. ... An alternate explanation is that the driving autoimmune process is T cell mediated, resulting in greater challenges from a discovery and biomarker perspective."
    explanation: >-
      The international-perspective review puts both arms side by side and says
      a pathogenic autoantibody has not been found, which is the gap this
      discussion records. Graded OTHER and REVIEW_SYNTHESIS: the sentences are
      the authors' weighing of other people's work, and the hedges - may argue,
      an alternate explanation - are theirs.
  - reference: PMID:37537844
    reference_title: Polyclonal lymphoid expansion drives paraneoplastic autoimmunity in neuroblastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The B cell infiltrates were significantly more polyclonal in OMAS compared to control neuroblastoma samples. This diversity, as well as our limited number of control samples and their small repertoire sizes, precluded nomination of any specific BCR clone or sequence as specifically correlated with OMAS or anti-tumor immunity."
    explanation: >-
      The negative repertoire result, quoted with the authors' own reason for
      it: greater polyclonality in OMAS tumours, and a sample-size limit that
      prevented nominating any clone. It is why the humoral arm cannot yet be
      pinned to an antigen, and it is a limitation of this study rather than a
      finding that no such clone exists.

    evidence_source: MODEL_ORGANISM
    snippet: "Mouse Col27a1 was found to be expressed in the cartilaginous structures associated with inner ear development and cochlear epithelium"
    explanation: Establishes an inner-ear expression domain for the gene, the anatomical basis for the auditory phenotype.
  - reference: PMID:32376988
    reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all three affected individuals presented with bilateral hearing loss with onset after 30 years of age"
    explanation: Documents adult-onset bilateral hearing loss in molecularly confirmed founder-allele homozygotes.
  downstream:

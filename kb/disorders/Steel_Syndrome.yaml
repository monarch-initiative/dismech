- name: Clinical, Radiographic and Molecular Diagnosis
  description: >
    Steel syndrome is suspected from the combination of short stature, bilateral
    irreducible hip dislocation, dislocated radial heads, carpal coalition, scoliosis and
    the characteristic facies, and is confirmed by finding biallelic COL27A1 variants.
    Targeted testing for the c.2089G>C p.(Gly697Arg) allele is appropriate in patients of
    Puerto Rican ancestry; exome sequencing is used otherwise, and copy-number analysis
    matters because at least one reported allele is a multi-exon deletion.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:24986830
    reference_title: "Mutations in COL27A1 cause Steel syndrome and suggest a founder mutation effect in the Puerto Rican population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the clinical and radiographic findings in all three children, a clinical diagnosis of Steel syndrome was made."
    explanation: Shows that the diagnosis is made clinically and radiographically before molecular confirmation.
  - reference: PMID:33963180
    reference_title: "Biallelic novel mutations of the COL27A1 gene in a patient with Steel syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The maternal mutation was a large deletion encompassing exons 38-60, which was challenging to detect."
    explanation: Justifies including copy-number analysis in the molecular workup.
treatments:
- name: Hip Reduction Surgery
  description: >
    Operative reduction of the dislocated hips has an unfavourable record in Steel
    syndrome. In the original series every hip treated by reduction augmented by an
    operation redislocated, and among closed reductions the results were satisfactory only
    in patients still skeletally immature at review. Untreated hips functioned
    satisfactorily over the reported follow-up. This history is why surgical reduction is
    approached cautiously rather than as routine.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: hip reduction surgery
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Congenital hip dislocation
    description: >
      The operation addresses the dislocated hip itself, not the underlying collagen
      defect.
  evidence:
  - reference: PMID:8423186
    reference_title: "A syndrome of dislocated hips and radial heads, carpal coalition, and short stature in Puerto Rican children."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighteen hips in nine patients were treated with a reduction augmented by some form of operation. All of these hips redislocated."
    explanation: Every operatively augmented reduction failed, which argues against surgical reduction as an effective treatment.
  - reference: PMID:8423186
    reference_title: "A syndrome of dislocated hips and radial heads, carpal coalition, and short stature in Puerto Rican children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these eight patients, the four who were skeletally immature at the time of the review had a satisfactory result, and the four who were skeletally mature had an unsatisfactory result because of discomfort or fibrous ankylosis."
    explanation: Closed reduction gave satisfactory results only in patients not yet skeletally mature, the qualified benefit this entry records.
- name: Spinal Arthrodesis for Scoliosis
  description: >
    Progressive scoliosis is managed by spinal arthrodesis with correction. Five of the
    fourteen children with scoliosis in the original series were treated this way.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: spinal arthrodesis with correction
    term:
      id: NCIT:C157986
      label: Spinal Fusion
  target_mechanisms:
  - target: Scoliosis
    description: >
      Arthrodesis corrects and stabilises the curve; it does not alter the growth-plate
      lesion that produced it.
  evidence:
  - reference: PMID:8423186
    reference_title: "A syndrome of dislocated hips and radial heads, carpal coalition, and short stature in Puerto Rican children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fourteen children had scoliosis, and five of them were managed with spinal arthrodesis and correction."
    explanation: Documents spinal arthrodesis as the scoliosis management used in the original cohort.
- name: Cervical Spine Surveillance and Decompression
  description: >
    Cervical spine anomalies including odontoid hypoplasia occur and may become
    symptomatic; one child in the original series required decompression. Cervical imaging
    before general anaesthesia and before elective spinal procedures is prudent for that
    reason.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cervical spinal decompression
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Hypoplasia of the odontoid process
    description: >
      Decompression relieves cord or root compression arising from the cervical anomaly.
  evidence:
  - reference: PMID:8423186
    reference_title: "A syndrome of dislocated hips and radial heads, carpal coalition, and short stature in Puerto Rican children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients had an anomaly of the cervical spine, with one deformity causing symptoms and signs that were treated with decompression."
    explanation: Records symptomatic cervical spine anomaly treated by decompression in Steel syndrome.
- name: Audiologic Assessment and Hearing Amplification
  description: >
    Hearing loss is congenital in patients with severe or loss-of-function alleles and
    adult-onset in founder-allele homozygotes, so audiologic assessment belongs in the
    initial workup and should be repeated through adult life. A patient with congenital
    hearing impairment was fitted with a hearing aid in infancy.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: audiometric assessment and hearing amplification
    term:
      id: NCIT:C38036
      label: Audiometric Test
  target_mechanisms:
  - target: Sensorineural hearing impairment
    description: >
      Assessment and amplification address the hearing deficit; neither modifies the
      collagen defect.
  evidence:
  - reference: PMID:32376988
    reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all three affected individuals presented with bilateral hearing loss with onset after 30 years of age"
    explanation: Adult-onset hearing loss in founder-allele homozygotes is why surveillance must continue into adulthood.
  - reference: PMID:33963180
    reference_title: "Biallelic novel mutations of the COL27A1 gene in a patient with Steel syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 1 year of age, he underwent orchiopexy and was provided with a hearing aid."
    explanation: Documents hearing amplification as the management used for congenital hearing impairment in Steel syndrome.
- name: Genetic Counseling and Carrier Testing
  description: >
    Identification of COL27A1 enables molecular confirmation, carrier testing for relatives
    and recurrence-risk counselling. This matters particularly in Puerto Rican families,
    where a single founder allele can be targeted directly and the estimated carrier
    frequency is about one in fifty-one.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24986830
    reference_title: "Mutations in COL27A1 cause Steel syndrome and suggest a founder mutation effect in the Puerto Rican population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "will enable molecular testing for individuals with the clinical presentation characteristic of Steel syndrome, as well as genetic counseling for carrier individuals"
    explanation: The gene-discovery paper names carrier genetic counselling as a direct clinical consequence of the finding.
  - reference: PMID:32376988
    reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has been estimated that the carrier frequency for the COL27A1 c.2089G>C (p.Gly697Arg) variant in Puerto Ricans is 1:51"
    explanation: Quantifies the carrier burden that makes targeted carrier testing worthwhile in this population.
discussions:
- discussion_id: hmm_col27a1_murine_lung_lethality
  prompt: >-
    Why is loss of collagen XXVII perinatally lethal from a lung defect in mice while
    humans with markedly reduced or absent COL27A1 protein survive with no reported
    respiratory disease, and what does that species difference imply for using the murine
    growth-plate phenotype as a model of the human lesion?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Structurally Defective or Absent Collagen XXVII
  - pathophysiology#Collapse of the Growth Plate Proliferative Zone
  rationale: >-
    Both published mouse models, the engineered 87-amino-acid deletion and the knock-in of
    the human founder allele, kill most homozygotes perinatally through a lung defect or
    presumed respiratory insufficiency. Human patients carrying frameshift, nonsense and
    splice alleles that abolish the protein are viable and are not reported to have
    respiratory problems. The growth-plate readouts from these mice are the main
    mechanistic evidence in this entry, so the weight they can carry depends on whether
    the murine dependence on collagen XXVII in lung is a species-specific requirement or a
    difference in residual protein.
  proposed_experiments:
  - experiment_id: exp_col27a1_lung_requirement
    name: Cross-species comparison of the collagen XXVII requirement in lung
    description: >-
      Compare COL27A1 expression, matrix localisation and pulmonary architecture in human
      fetal lung against mouse, and assess pulmonary function and imaging in a cohort of
      adults with biallelic loss-of-function COL27A1 alleles, to establish whether the
      murine lung requirement has a human counterpart that has simply not been looked for.
    would_support:
    - pathophysiology#Structurally Defective or Absent Collagen XXVII
  evidence:
  - reference: PMID:32376988
    reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, STLS patients do not appear to have respiratory problems or lung abnormalities."
    explanation: States the human side of the mismatch, with no respiratory phenotype despite loss-of-function alleles.
  - reference: PMID:22206015
    reference_title: "Collagen XXVII organises the pericellular matrix in the growth plate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice expressing an 87 amino acid deletion in the collagenous domain of collagen XXVII were phenotypically normal as heterozygotes whereas homozygotes exhibited a severe chondrodysplasia and died perinatally from a lung defect."
    explanation: States the murine side of the mismatch, perinatal lethality from a lung defect.
notes: >
  No GeneReviews chapter exists for Steel syndrome. A PubMed search for
  "Steel syndrome GeneReviews" returned no records, so the GeneReviews phenotype baseline
  step was not applicable and the phenotype set here is built from the original clinical
  series, the gene-discovery report, and the subsequent molecularly confirmed case reports
  and reviews.

  Genotype-phenotype pattern. Patients homozygous for the Puerto Rican founder missense
  allele have the skeletal syndrome without congenital hearing loss, while patients with
  frameshift, nonsense and splice alleles more often have congenital sensorineural hearing
  loss and additional features. Coloboma, cleft palate, and dental and genital anomalies
  each rest on a single report and should be treated as provisional extensions of the
  phenotype rather than established features.

  Heterozygous carriers are not affected in the Mendelian sense. Two independent
  electronic-health-record interrogations found no significant phenotype association in
  carriers beyond non-significant enrichment of joint and spine degeneration codes; the
  proposal that the locus contributes to complex osteopathological traits in carriers is
  explicitly framed by its authors as a hypothesis and is not curated here as a disease
  mechanism.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Steel syndrome segregates as an autosomal recessive trait. Affected individuals are
    homozygous or compound heterozygous for COL27A1 variants and unaffected parents are
    heterozygous carriers; heterozygotes have neither short stature nor congenital hip
    dislocation.
  evidence:
  - reference: PMID:32376988
    reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have demonstrated apodictically that Steel syndrome is an AR disorder clinically characterized by congenital bilateral hip dislocation, short stature, scoliosis, radial head dislocation, carpal coalitions, and foot deformities"
    explanation: States the autosomal recessive mode of inheritance for Steel syndrome.
  - reference: PMID:28276056
    reference_title: "Second family provides further evidence for causation of Steel syndrome by biallelic mutations in COL27A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified 2 novel compound heterozygous variants c.521_528del (p.(Cys174Serfs*34)) and c.2119C>T (p.(Arg707*)) in COL27A1 in this child and the parents were heterozygous carriers."
    explanation: Biallelic variants in the proband with heterozygous unaffected parents fit recessive inheritance.
prevalence:
- population: Puerto Rico
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1960.8
  notes: >-
    Published carrier-frequency estimate of 1:51 for the COL27A1 c.2089G>C (p.Gly697Arg)
    founder allele in Puerto Ricans, normalised to 1960.8 carriers per 100,000. This is a
    heterozygous carrier rate, not a disease prevalence, and it applies only to the single
    founder allele.
  evidence:
  - reference: PMID:32376988
    reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has been estimated that the carrier frequency for the COL27A1 c.2089G>C (p.Gly697Arg) variant in Puerto Ricans is 1:51"
    explanation: Source of the founder-allele carrier frequency in the Puerto Rican population.
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population-based prevalence estimate exists. Case counting is the only available
    measure. 51 patients had been reported by 2020, of whom 14 were genetically confirmed,
    and a 2022 review recorded disease-causing variants in twenty Puerto Rican and nine
    non-Puerto Rican families. The two counts use different inclusion rules and should not
    be combined.
  evidence:
  - reference: PMID:31903681
    reference_title: "Three new patients with Steel syndrome and a Puerto Rican specific COL27A1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are now 51 patients in the literature with Steel syndrome, including the 3 patients in this article, and 14 patients with a genetically confirmed Steel syndrome diagnosis."
    explanation: Gives the cumulative reported case count and the molecularly confirmed subset.
  - reference: PMID:35568358
    reference_title: "Steel syndrome: Report of three patients, including monozygotic twins and review of clinical and mutation profiles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, disease causing variants have been identified only in twenty Puerto Rican and nine non-Puerto Rican families."
    explanation: Independent review confirming that molecularly solved families remain few and are concentrated in Puerto Rico.
pathophysiology:
- name: COL27A1 Biallelic Pathogenic Variants
  biological_scale: MOLECULAR
  description: >
    Steel syndrome is initiated by biallelic pathogenic variants in COL27A1 on chromosome
    9q32. The Puerto Rican founder allele c.2089G>C substitutes arginine for a conserved
    glycine of a Gly-Xaa-Yaa repeat inside the triple-helical domain. Elsewhere in the
    world, private missense alleles and null alleles (frameshift, nonsense, splice-site
    and multi-exon deletion) have been reported in consanguineous and non-consanguineous
    families.
  genes:
  - preferred_term: COL27A1
    term:
      id: hgnc:22986
      label: COL27A1
  evidence:
  - reference: PMID:24986830
    reference_title: "Mutations in COL27A1 cause Steel syndrome and suggest a founder mutation effect in the Puerto Rican population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous missense variant p.(Gly697Arg) in COL27A1, in a family with Steel syndrome and no consanguinity."
    explanation: Identifies COL27A1 as the causative gene and names the founder missense allele.
  - reference: PMID:35568358
    reference_title: "Steel syndrome: Report of three patients, including monozygotic twins and review of clinical and mutation profiles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven missense variants and eight null variants are reported in COL27A1 until date."
    explanation: Documents that the allelic spectrum comprises both missense and null variants.
  downstream:
  - target: Structurally Defective or Absent Collagen XXVII
    causal_link_type: DIRECT
    description: >
      Missense glycine substitutions in the triple helix yield a misfolded protein, while
      frameshift and splice alleles introduce premature termination codons whose
      transcripts are cleared, so both classes converge on a deficit of functional
      collagen XXVII.
    evidence:
    - reference: PMID:32376988
      reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The two additional variants reported here are predicted to introduce frameshift or splice changes that result in the introduction of early termination codons that lead to nonsense mediated processing and clearance of the mutant transcripts, effectively resulting in loss-of-function (LoF) alleles with consequent loss of the COL27A1 protein."
      explanation: States the step from null COL27A1 alleles to loss of the protein product.
- name: Structurally Defective or Absent Collagen XXVII
  biological_scale: MOLECULAR
  description: >
    Collagen XXVII is a fibrillar collagen whose triple-helical domain depends on an
    uninterrupted Gly-Xaa-Yaa repeat. Substituting a helical glycine causes modest
    endoplasmic-reticulum retention of the mutant protein in chondrogenic cells,
    consistent with abnormal folding and impaired secretion, and behaves as a hypomorph;
    null alleles remove the protein outright.
  genes:
  - preferred_term: COL27A1
    term:
      id: hgnc:22986
      label: COL27A1
  molecular_functions:
  - preferred_term: extracellular matrix structural constituent conferring tensile strength
    term:
      id: GO:0030020
      label: extracellular matrix structural constituent conferring tensile strength
    modifier: DECREASED
  biological_processes:
  - preferred_term: collagen biosynthetic process
    term:
      id: GO:0032964
      label: collagen biosynthetic process
    modifier: DECREASED
  - preferred_term: retention of misfolded procollagen XXVII in the endoplasmic reticulum
    term:
      id: GO:0006621
      label: protein retention in ER lumen
    modifier: INCREASED
  evidence:
  - reference: PMID:24986830
    reference_title: "Mutations in COL27A1 cause Steel syndrome and suggest a founder mutation effect in the Puerto Rican population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This p.(Gly697Arg) variant most likely leads to a hypomorphic allele, since all carrier individuals are phenotypically normal."
    explanation: Characterises the founder allele as hypomorphic rather than a complete null.
  - reference: PMID:32376988
    reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our experiments showed modest ER-retention of the mutant proteins as compared with the WT in both W20 and ATDC5 cells"
    explanation: Cell-based assay showing that the glycine substitutions impair folding and retain the protein in the ER.
  downstream:
  - target: Disrupted Growth Plate Pericellular Matrix
    causal_link_type: DIRECT
    description: >
      Collagen XXVII normally accumulates in the pericellular matrix around growth-plate
      chondrocytes, so its structural disruption or absence is directly a defect of that
      matrix.
    evidence:
    - reference: PMID:22206015
      reference_title: "Collagen XXVII organises the pericellular matrix in the growth plate."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Collagen XXVII plays an important structural role in the pericellular extracellular matrix of the growth plate and is required for the organisation of the proliferative zone."
      explanation: Establishes that mutant collagen XXVII acts by disorganising the growth-plate pericellular matrix.
- name: Disrupted Growth Plate Pericellular Matrix
  biological_scale: TISSUE
  description: >
    Collagen XXVII is expressed throughout the growth plate, most strongly in the resting
    and proliferative zones, and accumulates in the pericellular matrix around
    chondrocytes at the cartilage-to-bone transition. In mice expressing a mutant form the
    pericellular matrix of proliferative chondrocytes is disrupted, and the knock-in of
    the human founder allele shows abnormal collagen deposition in the extracellular
    matrix.
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:17693149
    reference_title: "Type XXVII collagen at the transition of cartilage to bone during skeletogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemical analyses showed that type XXVII collagen was most evident in hypertrophic cartilage at the primary ossification center and at the growth plate and that it accumulated in the pericellular matrix."
    explanation: Localises collagen XXVII protein to the growth-plate pericellular matrix in developing human skeletal tissue.
  - reference: PMID:22206015
    reference_title: "Collagen XXVII organises the pericellular matrix in the growth plate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The pericellular matrix of proliferative chondrocytes was disrupted and the proliferative cells exhibited a decreased tendency to flatten and form vertical columns."
    explanation: Directly demonstrates pericellular matrix disruption when collagen XXVII is mutated.
  - reference: PMID:32376988
    reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Characterization of the in vivo murine model shows abnormal collagen deposition in the extracellular matrix and disorganization of the proliferative zone of the growth plate."
    explanation: Confirms abnormal matrix collagen deposition in a knock-in model of the human founder allele.
  downstream:
  - target: Collapse of the Growth Plate Proliferative Zone
    causal_link_type: DIRECT
    description: >
      The pericellular matrix is the scaffold that lets proliferative chondrocytes flatten
      and stack into columns; when it is disorganised, that architecture fails.
    evidence:
    - reference: PMID:32376988
      reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However abnormal or absent collagen XXVII protein in the ECM results in collapse of the proliferative zone and disorganization of the cartilaginous zones of the growth plate preventing normal endochondral bone growth"
      explanation: States the causal step from abnormal matrix collagen XXVII to proliferative-zone collapse.
- name: Collapse of the Growth Plate Proliferative Zone
  biological_scale: CELLULAR
  description: >
    Chondrocytes still differentiate, but they lose their columnar organisation. Homozygous
    knock-in mice carrying the murine equivalent of the Steel founder allele lose the
    normal architecture of the proliferative zone, with absence and disorganisation of
    columnar chondrocytes, while proteoglycan accumulation, mineralisation, and collagen II
    and X staining are not overtly changed. Human fetal material shows the corresponding
    lesion, with severely disorganised metaphyseal cartilage and hypercellular resting
    cartilage arranged in irregular nests bounded by acellular matrix.
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  biological_processes:
  - preferred_term: regulation of growth plate cartilage chondrocyte proliferation
    term:
      id: GO:0003420
      label: regulation of growth plate cartilage chondrocyte proliferation
    modifier: ABNORMAL
  - preferred_term: cartilage development
    term:
      id: GO:0051216
      label: cartilage development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32376988
    reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Stained sections of femoral and tibial growth plates of homozygous KI mice showed loss of the normal architecture of the proliferative zone with absence and disorganization of columnar chondrocytes"
    explanation: Histological demonstration of proliferative-zone collapse in the knock-in model of the human founder allele.
  - reference: PMID:33411029
    reference_title: "Histopathology of recurrent Steel syndrome in fetuses caused by novel variants of COL27A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Resting cartilage was hypercellular, organized in irregular nests limited by acellular matrix."
    explanation: Human fetal histology showing the same loss of orderly chondrocyte arrangement.
  - reference: PMID:33411029
    reference_title: "Histopathology of recurrent Steel syndrome in fetuses caused by novel variants of COL27A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metaphyseal cartilage showed severe disorganization."
    explanation: Confirms metaphyseal cartilage disorganisation in molecularly confirmed human fetuses.
  - reference: PMID:32376988
    reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "it appears that disease associated alterations in COL27A1 do not prevent chondrocytes from differentiating properly"
    explanation: Bounds the claim, since the lesion is architectural rather than a block of chondrocyte differentiation.
  downstream:
  - target: Impaired Endochondral Bone Growth
    causal_link_type: DIRECT
    description: >
      Columnar proliferative chondrocytes drive longitudinal growth, so their loss prevents
      normal endochondral bone growth.
    evidence:
    - reference: PMID:32376988
      reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However abnormal or absent collagen XXVII protein in the ECM results in collapse of the proliferative zone and disorganization of the cartilaginous zones of the growth plate preventing normal endochondral bone growth"
      explanation: Names proliferative-zone collapse as what prevents normal endochondral bone growth.
- name: Impaired Endochondral Bone Growth
  biological_scale: TISSUE
  description: >
    Cartilage calcification and its replacement by bone are the processes in which collagen
    XXVII normally participates. With the growth plate disorganised, longitudinal growth is
    curtailed and the ossification of epiphyseal and articular elements is delayed or
    incomplete.
  cell_types:
  - preferred_term: hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: endochondral ossification
    term:
      id: GO:0001958
      label: endochondral ossification
    modifier: DECREASED
  - preferred_term: bone development
    term:
      id: GO:0060348
      label: bone development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:17693149
    reference_title: "Type XXVII collagen at the transition of cartilage to bone during skeletogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The timing and location of synthesis suggest that type XXVII collagen plays a role during the calcification of cartilage and the transition of cartilage to bone."
    explanation: Places collagen XXVII at the cartilage-to-bone transition that is impaired in the disease.
  - reference: PMID:22206015
    reference_title: "Collagen XXVII organises the pericellular matrix in the growth plate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Animals expressing the 87 amino acid deletion targeted specifically to cartilage were viable but severely dwarfed."
    explanation: Cartilage-restricted disruption of collagen XXVII is sufficient to stunt skeletal growth.
  downstream:

name: Steel Syndrome
synonyms:
- STLS
- Steel syndrome
- dislocated hips and radial heads, carpal coalition, scoliosis, and short stature
- bilateral hip and radial head dislocations-short stature-scoliosis-carpal coalitions-pes
  cavus-facial dysmorphism syndrome
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
description: >
  Steel syndrome (STLS, MIM #615155) is a rare autosomal recessive osteochondrodysplasia
  caused by biallelic pathogenic variants in COL27A1, the gene encoding the pro-alpha-1
  chain of fibrillar collagen type XXVII. It was delineated in 1993 by H. H. Steel in
  twenty-three Puerto Rican children who shared bilateral irreducible hip dislocation,
  dislocated radial heads, carpal coalitions, short stature, scoliosis and pes cavus,
  with a characteristic long oval face, prominent forehead, hypertelorism and broad nasal
  bridge. The causative gene was identified in 2015, when a homozygous p.(Gly697Arg)
  missense variant was found to segregate in a non-consanguineous Puerto Rican family;
  that allele is a Puerto Rican founder mutation and accounts for most molecularly
  confirmed cases. Non-Puerto Rican families carry private missense, frameshift and
  splice alleles, and these tend to produce a more severe, loss-of-function phenotype
  that extends the syndrome to congenital sensorineural hearing loss and, in isolated
  reports, ocular coloboma, cleft palate, and dental and genital anomalies.

  Collagen XXVII is a minor fibrillar collagen of the cartilage pericellular matrix that
  is most abundant in the proliferative and prehypertrophic zones of the growth plate and
  at the primary ossification centre, where cartilage is calcified and replaced by bone.
  Loss or structural disruption of the protein does not block chondrocyte differentiation;
  instead it disorganises the pericellular matrix, collapses the proliferative zone and
  abolishes the columnar arrangement of chondrocytes, so endochondral bone growth and the
  ossification of articular elements proceed abnormally. This produces the short stature,
  the under-ossified and dysplastic femoral heads and acetabula, the absent capitulum
  humeri that underlies radial head dislocation, and the axial deformity of the syndrome.
  Management is entirely supportive and orthopaedic; surgical reduction of the dislocated
  hips has an unfavourable record, with every operatively augmented reduction in the
  original series redislocating.
disease_term:
  preferred_term: Steel syndrome
  term:
    id: MONDO:0014061
    label: Steel syndrome
parents:
- Skeletal dysplasia

      explanation: The same knock-in reproduces scoliosis, tying axial deformity to the COL27A1 lesion.
  - target: Delayed femoral head ossification
    causal_link_type: DIRECT
  - target: Dysplastic Articular Element Formation
    causal_link_type: DIRECT
    description: >
      Articular surfaces are themselves products of endochondral ossification, so the same
      defect leaves epiphyses under-ossified and joint-forming elements malformed or absent.
- name: Dysplastic Articular Element Formation
  biological_scale: TISSUE
  description: >
    Joint-forming skeletal elements are malformed. Radiographs in the gene-discovery family
    showed dislocated femoral heads with under-ossification of the capital femoral
    epiphysis and shallow acetabula; fetal autopsy showed bilateral absence of the
    capitulum humeri, which mechanically explains the dislocated radial heads. Failure of
    orderly cartilage segmentation and ossification in the wrist yields carpal coalitions.
  biological_processes:
  - preferred_term: skeletal system development
    term:
      id: GO:0001501
      label: skeletal system development
    modifier: ABNORMAL
  evidence:

genetic:
- name: COL27A1 biallelic pathogenic variants
  gene_term:
    preferred_term: COL27A1
    term:
      id: hgnc:22986
      label: COL27A1
  association: Causative
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
  frequency: the single known disease gene for Steel syndrome
  notes: >
    COL27A1 lies on chromosome 9q32, spans 61 exons and encodes a 1860-amino-acid
    pro-peptide of fibrillar collagen type XXVII. The Puerto Rican founder allele
    c.2089G>C p.(Gly697Arg) replaces a conserved glycine of the Gly-Xaa-Yaa repeat in the
    triple-helical domain and behaves as a hypomorph; carriers are phenotypically normal.
    Reported non-founder alleles include missense (p.Gly802Glu, p.Gly841Arg, p.Gly850Arg,
    p.Gly676Arg, p.Ala99Thr, p.Pro1019His), frameshift, nonsense, splice-site and
    multi-exon deletion variants.
  evidence:
  - reference: PMID:24986830
    reference_title: "Mutations in COL27A1 cause Steel syndrome and suggest a founder mutation effect in the Puerto Rican population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous missense variant p.(Gly697Arg) in COL27A1, in a family with Steel syndrome and no consanguinity."
    explanation: Establishes COL27A1 as the causative gene for Steel syndrome.
  - reference: PMID:24986830
    reference_title: "Mutations in COL27A1 cause Steel syndrome and suggest a founder mutation effect in the Puerto Rican population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, the identified variant seems to have arisen as a founder mutation in the Puerto Rican population."
    explanation: Records the founder-allele origin of the common Puerto Rican variant.
  - reference: PMID:31913554
    reference_title: "A Syrian patient with Steel syndrome due to compound heterozygous COL27A1 mutations with colobomata of the eye."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition is caused by a deficient matrix protein, collagen type XXVII alpha 1 chain, due to bi-allelic loss of function mutations in the gene COL27A1."
    explanation: States the biallelic loss-of-function mechanism and the deficient matrix protein.
  case_fractions:
  - population: Molecularly confirmed patients reported to 2020
    notes: >-
      Eight of the eleven patients with homozygous COL27A1 mutations reported before 2020
      carried the p.Gly697Arg founder allele, so the founder allele accounted for the
      majority of solved cases at that time.
    evidence:
    - reference: PMID:31903681
      reference_title: "Three new patients with Steel syndrome and a Puerto Rican specific COL27A1 mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Eleven patients have previously been described with Steel syndrome and homozygous COL27A1 mutations, with eight having an apparent founder mutation, p.Gly697Arg."
      explanation: Gives the founder-allele share of previously reported homozygous patients.
animal_models:
- name: Col27a1 G682R knock-in mouse (Steel founder allele)
  species: Mus musculus
  genotype: Col27a1 G682R knock-in, homozygous and heterozygous
  genes:
  - preferred_term: COL27A1
    term:
      id: hgnc:22986
      label: COL27A1
  publication: PMID:32376988
  description: >
    A mouse carrying the murine orthologue of the human Steel syndrome founder allele
    p.Gly697Arg. Homozygotes are dwarfed and kyphotic with a shorter snout and a rounded
    skull, and their growth plates lose the columnar architecture of the proliferative
    zone. Most homozygotes die perinatally, presumably from respiratory insufficiency,
    which human patients do not show.
  associated_phenotypes:
  - Reduced body length
  - Scoliosis
  - Rounded skull shape
  modeled_mechanisms:
  - target: Collapse of the Growth Plate Proliferative Zone
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      The knock-in reproduces the growth-plate lesion attributed to the human founder
      allele, with loss of the proliferative-zone architecture and of columnar
      chondrocytes.
    limitations: >-
      Proteoglycan accumulation, mineralisation and collagen II and X staining were not
      overtly different from wild type, so the model speaks to chondrocyte architecture
      rather than to matrix mineralisation.
    readouts:
    - name: Columnar chondrocyte organisation in the femoral and tibial growth plate
      target: Collapse of the Growth Plate Proliferative Zone
      direction: ABOLISHED
      interpretation: >-
        Histological correlate of proliferative-zone collapse in homozygous knock-in mice.
      evidence:
      - reference: PMID:32376988
        reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Stained sections of femoral and tibial growth plates of homozygous KI mice showed loss of the normal architecture of the proliferative zone with absence and disorganization of columnar chondrocytes"
        explanation: Reports the histological measurement behind this readout.
    evidence:
    - reference: PMID:32376988
      reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Characterization of the in vivo murine model shows abnormal collagen deposition in the extracellular matrix and disorganization of the proliferative zone of the growth plate."
      explanation: Supports treating this model as informative for the growth-plate node.
  - target: Impaired Endochondral Bone Growth
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >
      Homozygotes reproduce reduced body length, scoliosis and a rounded skull, the growth
      consequences of the human lesion.
    limitations: >-
      Most homozygous knock-in mice die perinatally from presumed respiratory
      insufficiency, a lethality with no counterpart in Steel syndrome patients, so the
      severity of the murine growth phenotype overstates the human one.
    evidence:
    - reference: PMID:32376988
      reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We modeled the orthologous variant in murine Col27a1 and found it recapitulates some of the major Steel syndrome associated skeletal features including reduced body length, scoliosis, and a more rounded skull shape."
      explanation: States which human skeletal features the model reproduces and that the recapitulation is partial.
  evidence:
  - reference: PMID:32376988
    reference_title: "Functional biology of the Steel syndrome founder allele and evidence for clan genomics derivation of COL27A1 pathogenic alleles worldwide."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our STLS KI animal model (Col27a1G682R/G682R) recapitulates the short stature and some of the skeletal abnormalities observed in the human subjects, however most homozygous KI mice die perinatally, presumably due to respiratory insufficiency consistent with previous Col27a1 mouse models"
    explanation: Establishes the model as an allele-matched in vivo system and states its principal limitation.
- name: Cartilage-specific Col27a1 87-amino-acid deletion mouse
  species: Mus musculus
  genotype: Col27a1 87-amino-acid collagenous-domain deletion, cartilage-targeted homozygote
  genes:
  - preferred_term: COL27A1
    term:
      id: hgnc:22986
      label: COL27A1
  publication: PMID:22206015
  description: >
    Mice expressing an 87-amino-acid deletion in the collagenous domain of collagen XXVII.
    Ubiquitous homozygotes have severe chondrodysplasia and die perinatally from a lung
    defect; restricting the deletion to cartilage makes them viable but severely dwarfed,
    with a disrupted pericellular matrix around proliferative chondrocytes.
  associated_phenotypes:
  - Severe dwarfism
  - Disrupted pericellular matrix
  modeled_mechanisms:
  - target: Disrupted Growth Plate Pericellular Matrix
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      Cartilage-targeted disruption of collagen XXVII directly demonstrates that the
      protein organises the pericellular matrix and the proliferative zone.
    limitations: >-
      An engineered 87-amino-acid in-frame deletion is not an allele observed in patients,
      and the ubiquitous homozygote is perinatally lethal from a lung defect that Steel
      syndrome patients do not have.
    readouts:
    - name: Pericellular matrix organisation around proliferative chondrocytes
      target: Disrupted Growth Plate Pericellular Matrix
      direction: ALTERED
      interpretation: >-
        Structural correlate of the pericellular matrix node in this model.
      evidence:
      - reference: PMID:22206015
        reference_title: "Collagen XXVII organises the pericellular matrix in the growth plate."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The pericellular matrix of proliferative chondrocytes was disrupted and the proliferative cells exhibited a decreased tendency to flatten and form vertical columns."
        explanation: Reports the histological observation behind this readout.
    evidence:
    - reference: PMID:22206015
      reference_title: "Collagen XXVII organises the pericellular matrix in the growth plate."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Collagen XXVII plays an important structural role in the pericellular extracellular matrix of the growth plate and is required for the organisation of the proliferative zone."
      explanation: Supports treating this model as informative for the pericellular matrix node.
  evidence:
  - reference: PMID:22206015
    reference_title: "Collagen XXVII organises the pericellular matrix in the growth plate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Animals expressing the 87 amino acid deletion targeted specifically to cartilage were viable but severely dwarfed."
    explanation: Establishes the cartilage-restricted model and its skeletal phenotype.

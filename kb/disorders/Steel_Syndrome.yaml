- name: Collagen XXVII Deficiency in Inner Ear Cartilage
  biological_scale: TISSUE
  description: >
    Col27a1 is expressed in the cartilaginous structures of the developing inner ear and in
    the cochlear epithelium in mouse, which offers a route from the same collagen deficit
    to the sensorineural hearing loss seen in patients with severe and loss-of-function
    COL27A1 alleles. In patients homozygous for the milder Puerto Rican founder missense
    allele, hearing loss appears instead in adult life.
  biological_processes:
  - preferred_term: cartilage development

discussions:
- discussion_id: gap_cleft_palate_pierre_robin_conflation
  prompt: >-
    Is cleft palate an independently documented finding in this cohort, or
    does the curated claim reflect conflation with the separately evidenced
    Pierre Robin sequence in patient 2137?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotype#Cleft palate
  - phenotype#Pierre Robin sequence
  rationale: >-
    Cleft palate is absent from both the cached full-text of the defining
    paper and the HPO annotation set for OMIM:619699, unlike every other
    supplemental-table finding in this entry, which are independently
    corroborated by that same HPO annotation set. Pierre Robin sequence is a
    triad (micrognathia, glossoptosis, and airway obstruction) that often,
    but not always, includes cleft palate, and is independently and verbatim
    evidenced in patient 2137. Access to the paper's Table S2 is needed to
    determine whether cleft palate was scored as a distinct finding in one or
    more patients or whether the claim originated from the Pierre Robin
    sequence observation alone.
notes: >-
  Asta retrieval was run for this entry. Because the Asta result set was mostly
  broad neurodevelopmental-disorder literature, the curation relies on the
  defining ANAPC7 paper and focused PubMed/MedGen/PMC checks. The current human
  phenotype evidence is a single 11-person Old Order Amish cohort, so frequency
  claims should remain provisional and case/cohort-level. The downstream
  mechanism is kept distinct from the human genetic association: APC7 loss in
  affected individuals is human clinical evidence, while APC substrate handling,
  neuronal Ki-67 accumulation, and heterochromatin dysregulation come from
  in-vitro or mouse-model experiments. Seizures, brain MRI/neuroimaging
  findings, and human behavioral features were checked in the primary paper and
  supplement but were not modeled because they were not documented as human
  cohort findings.

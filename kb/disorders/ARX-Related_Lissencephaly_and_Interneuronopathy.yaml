histopathology:
- name: Neocortical GABAergic Interneuron Depletion and Mislocalization
  description: >-
    GAD- and calretinin-positive interneurons are markedly reduced in neocortex
    and retained in white matter or the neocortical subventricular zone, while
    other interneuron subtypes can be relatively preserved.
  diagnostic: false
  evidence:
  - reference: PMID:18458920
    reference_title: "Aristaless-related homeobox gene disruption leads to abnormal distribution of GABAergic interneurons in human neocortex: evidence based on a case of X-linked lissencephaly with abnormal genitalia (XLAG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that glutamic acid decarboxylase (GAD)- and calretinin
      (CR)-containing cells were significantly reduced in the neocortex and
      located in the white matter and neocortical subventricular zone, while
      neuropeptide Y- or cholecystokinin-containing cells were normally
      distributed.
    explanation: >-
      Direct human neuropathologic evidence for subtype-selective interneuron
      depletion and mislocalization.
- name: Cortical Plate Nearly Devoid of Interneurons
  description: >-
    In severe ARX-mutated lissencephaly, the cortical plate may contain almost
    exclusively pyramidal cells with profound depletion of interneurons.
  diagnostic: false
  evidence:

discussions:
- discussion_id: gap_arx_mouse_lissencephaly_gyrencephaly_mismatch
  prompt: >-
    Which ARX-dependent process produces the defining human XLAG gyral
    malformation, given that the constitutive and conditional mouse models
    robustly reproduce interneuron, basal-ganglia, projection, and testicular
    defects but cannot phenocopy loss of gyral architecture in a naturally
    lissencephalic species?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#ARX Functional Deficiency
  - pathophysiology#Tangential Migration Failure from Ganglionic Eminences
  - pathophysiology#Candidate Neocortical SVZ Radial-Migration Disruption
  rationale: >-
    Mouse models validate the conserved subpallial interneuronopathy and several
    ARX-specific developmental branches. They do not establish that tangential
    interneuron migration failure is sufficient for human lissencephaly. Human
    XLAG neuropathology suggests an additional radial-migration contribution from
    the neocortical subventricular zone, while general human lissencephaly work
    shows that outer radial glia important for neocortical expansion are largely
    absent from lissencephalic rodents. The canonical graph therefore does not
    connect tangential migration directly to lissencephaly; an explicitly
    alternative, human-enriched dorsal cortical route carries that endpoint.
  proposed_experiments:
  - experiment_id: exp_arx_human_cortical_assembloid
    name: Isogenic ARX-null Human MGE-Cortex Assembloid Migration and Lamination Assay
    description: >-
      Generate isogenic ARX-null, corrected, and wild-type human iPSC-derived MGE
      and dorsal-cortical organoids, fuse them into assembloids, and quantify
      interneuron specification, tangential migration, dorsal progenitor
      proliferation, radial migration, and cortical lamination. Timed ARX rescue
      should distinguish lineage-specification, migration, and post-migration
      requirements.
    experiment_type:
      preferred_term: iPSC assembloid perturbation assay
    model_systems:
    - name: Isogenic human MGE-cortex assembloid
      description: >-
        Fused subpallial and cortical organoids generated from matched ARX-null,
        corrected, and wild-type human iPSC lines.
      experimental_model_type: ORGANOID
    decision_criterion: >-
      A reproducible dorsal progenitor, radial-migration, or lamination defect in
      ARX-null cortical tissue that is rescued by gene correction would support a
      human dorsal route beyond the conserved tangential-interneuron phenotype.
    supporting_outcome:
    - Dorsal cortical defects occur in ARX-null tissue independently of the genotype of incoming interneurons.
    - Gene correction or appropriately timed ARX restoration rescues the dorsal cortical readout.
    refuting_outcome:
    - ARX-null dorsal tissue shows normal progenitor dynamics and lamination while only interneuron entry is altered.
  - experiment_id: exp_arx_gyrencephalic_ferret
    name: ARX Perturbation in a Gyrencephalic Ferret Cortex
    description: >-
      Perturb Arx in developing ferret dorsal and subpallial compartments using
      spatially restricted strategies, then assess gyral architecture,
      progenitor dynamics, cortical lamination, interneuron migration, and
      basal-ganglia development against matched sham and rescue controls.
    experiment_type:
      preferred_term: in vivo gyrencephalic model study
    model_systems:
    - name: Gyrencephalic ferret cortex
      description: >-
        Developing ferret cortex with a prominent outer subventricular zone,
        used as a bridge between naturally lissencephalic mice and humans.
      experimental_model_type: OTHER
    decision_criterion: >-
      Gyral simplification or regional agyria that tracks dorsal Arx perturbation
      and is rescued by ARX restoration would support a gyrencephaly-dependent
      cortical branch.
    supporting_outcome:
    - Dorsal Arx perturbation produces reproducible gyral and lamination abnormalities.
    - Subpallial-only perturbation reproduces interneuron loss without the full gyral phenotype.
    refuting_outcome:
    - Neither dorsal nor subpallial perturbation affects gyral architecture despite robust molecular target engagement.
  evidence:
  - reference: PMID:12379852
    reference_title: "Mutation of ARX causes abnormal development of forebrain and testes in mice and X-linked lissencephaly with abnormal genitalia in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These characteristics recapitulate some of the clinical features of
      X-linked lissencephaly with abnormal genitalia (XLAG) in humans.
    explanation: >-
      The founding report explicitly limits the extent of human phenocopy.
  - reference: PMID:17460091
    reference_title: "Inactivation of Arx, the murine ortholog of the X-linked lissencephaly with ambiguous genitalia gene, leads to severe disorganization of the ventral telencephalon with impaired neuronal migration and differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Both tangential migration toward the cortex and striatum and radial
      migration to the globus pallidus and striatum were greatly reduced in the
      mutants, causing a periventricular accumulation of NPY+ or calretinin+
      neurons in the MGE.
    explanation: >-
      Establishes the conserved model phenotype on the shared side of the mismatch.
  - reference: PMID:28111201
    reference_title: "Human iPSC-Derived Cerebral Organoids Model Cellular Features of Lissencephaly and Reveal Prolonged Mitosis of Outer Radial Glia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, the mouse brain is naturally lissencephalic, suggesting that
      certain aspects of cortical development may not be adequately assessed in
      mice.
    explanation: >-
      General lissencephaly evidence directly states the species limitation.
  - reference: PMID:28111201
    reference_title: "Human iPSC-Derived Cerebral Organoids Model Cellular Features of Lissencephaly and Reveal Prolonged Mitosis of Outer Radial Glia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While IP cells are conserved between humans and mice, oRG cells are largely
      absent from the developing cortices of lissencephalic rodents
    explanation: >-
      Supports the specific outer-radial-glia limitation without claiming that it
      is already demonstrated in ARX disease.
  - reference: PMID:28951247
    reference_title: "Genetics and mechanisms leading to human cortical malformations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We finish by describing the advantages of human in vitro cell culture
      models, to examine human-specific cells and transcripts
    explanation: >-
      Supports the proposed human-model strategy for resolving species-specific
      cortical mechanisms.
notes: >-
  Entry derives from cortical-malformation epic 4098 (issue 4082). Disease
  identity is deliberately restricted to XLAG/LISX2 (MONDO:0010268). The broader
  ARX allelic spectrum is retained only where it informs variant interpretation,
  counseling, differential diagnosis, or allele-specific model limitations;
  infantile spasms, Partington syndrome, and nonsyndromic intellectual disability
  are not represented as classic XLAG phenotypes. The conserved subpallial
  lineage, differentiation, tangential-migration, interneuron-deficit, and
  inferred excitation-inhibition branches conform to
  kb/modules/interneuron_specification_tangential_migration_failure.yaml.
  Basal-ganglia, thalamocortical, forebrain-growth, testicular, and candidate
  human dorsal-cortical branches remain ARX-specific. No disease-modifying or
  XLAG-specific interventional trial with deterministic disease-specific
  evidence was identified.

  - reference: PMID:17460091
    reference_title: "Inactivation of Arx, the murine ortholog of the X-linked lissencephaly with ambiguous genitalia gene, leads to severe disorganization of the ventral telencephalon with impaired neuronal migration and differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In these animals, the early differentiation of this tissue appeared
      normal, whereas subsequent differentiation was impaired, leading to the
      periventricular accumulation of immature neurons in both the lateral
      ganglionic eminence and medial ganglionic eminence (MGE).
    explanation: >-
      Defines the post-patterning lineage defect in Arx-mutant ganglionic eminences.
  - reference: PMID:41630162
    reference_title: "ARX mutation-associated interneuron defects provide insights into mechanisms underlying developmental epilepsies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In these mice, we observed defects in cell cycle exit, a biased loss of the
      marginal zone migration stream of cINs, shifts in cell fate from caudal
      ganglionic eminence (CGE) to medial ganglionic eminence (MGE) identity, and a
      reduced number of parvalbumin⁺ and somatostatin⁺ cINs, with parvalbumin⁺ cINs
      being more severely affected.
    explanation: >-
      Current conditional-model evidence resolves multiple components of the
      disrupted lineage program.

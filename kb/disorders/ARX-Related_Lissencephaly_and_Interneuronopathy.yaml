    cortical-interneuron cell-cycle exit, subtype identity, differentiation, and guidance.
    Their disruption is the conserved upstream interneuronopathy branch of XLAG.
  conforms_to: "interneuron_specification_tangential_migration_failure#Subpallial Interneuron Lineage Program Disruption"

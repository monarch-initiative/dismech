progression:
- phase: Prenatal
  notes: >-
    The structural brain malformation is prenatal. Seizure-like fetal movements
    or electrographic evidence can occur in utero, and longitudinal sibling
    observations suggest cerebral atrophy may begin before birth.
  evidence:
  - reference: PMID:17515135
    reference_title: "[X-linked lissencephaly with absent corpus callosum and abnormal genitalia: a report of siblings followed from the prenatal period]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures were observed in utero."
    explanation: >-
      Direct evidence of prenatal seizure onset.
  - reference: PMID:17515135
    reference_title: "[X-linked lissencephaly with absent corpus callosum and abnormal genitalia: a report of siblings followed from the prenatal period]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebral atrophy was progressive postnatally, and fetal
      echoencephalography indicated that the atrophy might have started in the
      prenatal period.
    explanation: >-
      Supports a prenatal beginning for progressive tissue loss.
- phase: Neonatal Period
  notes: >-
    Clonic or myoclonic seizures begin within minutes to the first day of life
    and are commonly refractory to multiple antiseizure medications. Tone and
    genital abnormalities are evident at neonatal examination.
  evidence:
  - reference: PMID:31867230
    reference_title: "Fetal and neonatal MRI features of ARX-related lissencephaly presenting with neonatal refractory seizure disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Within the first few minutes of life, baby developed seizures and cerebral
      function monitoring (CFM) demonstrated persistent electrical seizure
      activity, refractory to multi-pharmacological management with antiepileptic
      medications (phenobarbitone and phenytoin in addition to levetiracetam).
    explanation: >-
      Directly documents immediate onset and pharmacoresistance.
- phase: Infancy
  notes: >-
    Profound developmental impairment persists, acquired microcephaly and
    cerebral atrophy may progress, and gastrointestinal/endocrine complications
    can dominate care in some affected infants.
  evidence:
  - reference: PMID:17221017
    reference_title: "Lissencephaly, abnormal genitalia and refractory epilepsy: case report of XLAG syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lacked psychomotor development"
    explanation: >-
      Supports profound developmental impairment.
  - reference: DOI:10.1177/2329048X17738625
    reference_title: "X-Linked Lissencephaly With Absent Corpus Callosum and Abnormal Genitalia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe chronic diarrhea resulted in failure to thrive, dehydration,
      electrolyte derangements, long-term hospitalization, and prompted
      transition to palliative care.
    explanation: >-
      Documents a severe but variably observed multisystem course.
- phase: Infancy to Early Childhood
  notes: >-
    Historical case series reported high early mortality, but no modern
    population survival curve is available; figures should therefore be
    interpreted as historical ascertainment rather than a current individual
    prognosis.
  evidence:
  - reference: PMID:31867230
    reference_title: "Fetal and neonatal MRI features of ARX-related lissencephaly presenting with neonatal refractory seizure disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall prognosis is dismal, with the average life expectancy being around
      18 months and a maximum recorded age of 4 years
    explanation: >-
      Provides the historical survival summary while the entry explicitly
      qualifies its limitations.

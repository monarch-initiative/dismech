    evidence:
    - reference: PMID:12379852
      reference_title: "Mutation of ARX causes abnormal development of forebrain and testes in mice and X-linked lissencephaly with abnormal genitalia in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Male embryonic mice with mutations in the X-linked aristaless-related
        homeobox gene (Arx) developed with small brains due to suppressed
        proliferation and regional deficiencies in the forebrain.
      explanation: >-
        Directly connects Arx loss to suppressed forebrain proliferation in vivo.
  - target: Basal Ganglia Differentiation Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - ventral telencephalic differentiation
    description: >-
      ARX-dependent ventral telencephalic programs are required for normal
      basal-ganglia neuronal differentiation.
    evidence:
    - reference: PMID:17460091
      reference_title: "Inactivation of Arx, the murine ortholog of the X-linked lissencephaly with ambiguous genitalia gene, leads to severe disorganization of the ventral telencephalon with impaired neuronal migration and differentiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, Arx mutants lacked a large fraction of cholinergic neurons
        and displayed a strong impairment of thalamocortical projections, in which
        major axon fiber tracts failed to traverse the basal ganglia.
      explanation: >-
        Demonstrates a basal-ganglia differentiation defect in Arx-mutant mice.
  - target: Thalamocortical Projection Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - basal-ganglia axon-guidance environment
    description: >-
      The Arx-mutant ventral telencephalon fails to support normal passage of
      thalamocortical axon tracts; this branch is demonstrated in mice and is not
      asserted as a directly observed human XLAG lesion.
    evidence:
    - reference: PMID:17460091

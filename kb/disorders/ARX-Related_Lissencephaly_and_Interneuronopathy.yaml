description: >-
  X-linked lissencephaly with abnormal genitalia (XLAG, LISX2) is a severe
  congenital malformation of cortical development caused by hemizygous
  pathogenic ARX variants, including complete loss-of-function and severe
  homeodomain variants. Affected males have a characteristic
  temporal/posterior-predominant thin lissencephaly pattern, agenesis of the
  corpus callosum, small or dysplastic basal ganglia, abnormal male genital
  development, and medically
  refractory clonic or myoclonic seizures beginning in fetal or neonatal life.
  ARX is a paired-like homeodomain transcription factor required for forebrain
  and testicular development and for the differentiation and migration of
  ganglionic-eminence-derived cortical interneurons. Human neuropathology and
  mouse models support a profound cortical GABAergic-interneuron deficit, making
  XLAG a prototype interneuronopathy. The causal route from this conserved
  interneuron lesion to the human gyral malformation remains unresolved because
  the naturally lissencephalic mouse cannot reproduce loss of gyral architecture.
  ARX also causes distinct allelic disorders, including Proud syndrome,
  polyalanine-expansion developmental epilepsy/infantile spasms, Partington
  syndrome, and nonsyndromic intellectual disability. Those disorders inform
  genotype-phenotype interpretation but are not modeled here as XLAG phenotypes;
  notably, classic XLAG reports neonatal seizures without infantile spasms or
  hypsarrhythmia.

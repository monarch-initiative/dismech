differential_diagnoses:
- name: PAFAH1B1- or DCX-Related Classical Lissencephaly
  description: >-
    PAFAH1B1 and DCX disorders can produce agyria-pachygyria and severe epilepsy,
    but their gradient, cortical thickness, associated malformations, and
    molecular cause differ from XLAG.
  distinguishing_features:
  - Temporal-predominant thin lissencephaly with complete callosal agenesis and hypoplastic basal ganglia favors ARX.
  - Classic thick posterior-predominant lissencephaly favors PAFAH1B1; anterior-predominant thick lissencephaly in males favors DCX.
  - Abnormal male genitalia strongly favors XLAG.
  evidence:
  - reference: PMID:28440899
    reference_title: "Lissencephaly: Expanded imaging and clinical classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The single most common pattern (55/188, 29.2%) was partial
      agyria-pachygyria that was most severe posteriorly, almost exclusively
      caused by severe mutations of LIS1 including whole gene and intragenic
      deletions, as well as truncating point mutations.
    explanation: >-
      Supports the posterior-predominant classic pattern associated with
      LIS1/PAFAH1B1.
  - reference: PMID:28440899
    reference_title: "Lissencephaly: Expanded imaging and clinical classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations of DCX and actin isoforms (ACTB, ACTG1) account for almost all
      anterior predominant LIS with thick cortex (classic LIS).
    explanation: >-
      Supports the anterior-predominant thick-cortex distinction for DCX.
  - reference: PMID:28440899
    reference_title: "Lissencephaly: Expanded imaging and clinical classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lastly, temporal-predominant thin LIS with ACC and abnormal white matter
      is caused by mutations in ARX.
    explanation: >-
      Supports the gene-predictive imaging distinction.
- name: TUBA1A-Related Tubulinopathy
  description: >-
    Severe tubulinopathies overlap through lissencephaly, callosal dysgenesis,
    basal-ganglia dysplasia, and seizures, but often add cerebellar or brainstem
    abnormalities and a tubulinopathy-type dysgyria pattern.
  disease_term:
    preferred_term: lissencephaly due to TUBA1A mutation
    term:
      id: MONDO:0012703
      label: lissencephaly due to TUBA1A mutation
  distinguishing_features:
  - Cerebellar/brainstem hypoplasia or dysplasia and tubulinopathy-type dysgyria favor a tubulin gene.
  - Temporal-predominant thin lissencephaly with severe callosal agenesis and abnormal genitalia favors ARX.
  evidence:
  - reference: PMID:28440899
    reference_title: "Lissencephaly: Expanded imaging and clinical classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      almost all patients with mutations of tubulin (excluding the TUBA1A p.R402C
      and p.R402H mutations) or tubulin motor genes had multiple non-cortical
      malformations including basal ganglia dysplasia, partial agenesis of the
      corpus callosum, enlarged tectum, brainstem hypoplasia, and cerebellar
      hypoplasia.
    explanation: >-
      Defines the overlapping but distinguishable tubulinopathy pattern.
- name: Reelin-Pathway Lissencephaly With Cerebellar Hypoplasia
  description: >-
    RELN- or VLDLR-related disease can produce thin lissencephaly but is usually
    anterior predominant, autosomal recessive, and accompanied by severe
    cerebellar and hippocampal abnormalities.
  disease_term:
    preferred_term: lissencephaly with cerebellar hypoplasia
    term:
      id: MONDO:0019450
      label: lissencephaly with cerebellar hypoplasia
  distinguishing_features:
  - Severe cerebellar and hippocampal hypoplasia favors RELN/VLDLR.
  - Temporal predominance, callosal agenesis, basal-ganglia hypoplasia, and abnormal male genitalia favor ARX.
  evidence:
  - reference: PMID:28440899
    reference_title: "Lissencephaly: Expanded imaging and clinical classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anterior predominant thin LIS with severe CBLH is an autosomal recessive
      condition and strongly associated with mutations in RELN and VLDLR.
    explanation: >-
      Defines the contrasting gradient, inheritance, and cerebellar phenotype.
- name: CRADD-Related Thin Lissencephaly
  description: >-
    CRADD-related thin lissencephaly can show mild anterior pachygyria but usually
    has normal cerebellar development, mild megalencephaly, and autosomal
    recessive inheritance rather than the syndromic XLAG pattern.
  disease_term:
    preferred_term: CRADD-related thin lissencephaly
    term:
      id: MONDO:0013785
      label: intellectual disability, autosomal recessive 34
  distinguishing_features:
  - Anterior-predominant thin lissencephaly with mild megalencephaly and normal cerebellum favors CRADD.
  - Temporal predominance with callosal/basal-ganglia abnormalities and abnormal male genitalia favors ARX.
  evidence:
  - reference: PMID:28440899
    reference_title: "Lissencephaly: Expanded imaging and clinical classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, biallelic RELN and VLDLR mutations have never been seen in
      patients with anterior thin LIS and normal cerebellum. Mutations of a
      single gene – CRADD – have been found in the latter group. An additional
      diagnostic clue for CRADD mutations is mild megalencephaly
    explanation: >-
      Supports the anterior thin-lissencephaly pattern with normal cerebellum and
      mild megalencephaly that distinguishes CRADD.
- name: Other ARX Allelic Disorders
  description: >-
    Proud syndrome, polyalanine-expansion ARX developmental epilepsy/infantile
    spasms, Partington syndrome, and nonsyndromic intellectual disability share
    the causal gene but are distinct from classic XLAG.
  distinguishing_features:
  - Infantile spasms without the XLAG malformation pattern favor a polyalanine-expansion ARX disorder.
  - Classic XLAG has fetal/neonatal clonic or myoclonic seizures and was reported without infantile spasms or hypsarrhythmia.
  - Variant class and the presence or absence of structural brain and genital abnormalities separate the allelic diagnoses.
  evidence:
  - reference: PMID:14722918
    reference_title: "Mutations of ARX are associated with striking pleiotropy and consistent genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, several less severe phenotypes without malformations have been
      reported, including mental retardation with cryptogenic infantile spasms
      (West syndrome), other seizure types, dystonia or autism, and nonsyndromic
      mental retardation.
    explanation: >-
      Establishes the non-malformative allelic spectrum that must not be merged
      into XLAG phenotypes.

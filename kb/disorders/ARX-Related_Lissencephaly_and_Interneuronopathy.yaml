      explanation: >-
        Directly demonstrates abnormal testicular differentiation after Arx loss.
  - target: Enteroendocrine and Pancreatic Developmental Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      ARX program disruption may impair enteroendocrine and pancreatic

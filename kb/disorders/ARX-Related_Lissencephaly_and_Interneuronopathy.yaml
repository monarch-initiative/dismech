    reference_title: "Evidence for tangential migration disturbances in human lissencephaly resulting from a defect in LIS1, DCX and ARX genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the ARX-mutated brain, the cortical plate contained almost exclusively
      pyramidal cells and was devoid of interneurons.
    explanation: >-
      Directly documents the severe human cortical interneuronopathy.

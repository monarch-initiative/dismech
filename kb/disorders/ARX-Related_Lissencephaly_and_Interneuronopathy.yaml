  - target: Forebrain Progenitor Proliferation Deficit
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered cell-cycle regulation
    description: >-
      ARX program disruption suppresses proliferation and reduces regional

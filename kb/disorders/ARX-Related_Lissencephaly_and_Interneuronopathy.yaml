  - target: Testicular Differentiation Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - fetal testicular developmental program disruption
    description: >-
      ARX deficiency disrupts fetal testicular differentiation, providing the
      model-supported developmental route to abnormal male genitalia.
    evidence:
    - reference: PMID:12379852
      reference_title: "Mutation of ARX causes abnormal development of forebrain and testes in mice and X-linked lissencephaly with abnormal genitalia in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These mice also showed aberrant migration and differentiation of
        interneurons containing gamma-aminobutyric acid (GABAergic interneurons)

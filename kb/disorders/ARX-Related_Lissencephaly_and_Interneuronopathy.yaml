genetic:
- name: Pathogenic ARX Variants
  association: Causative
  gene_term:
    preferred_term: ARX (aristaless-related homeobox)
    term:
      id: hgnc:18060
      label: ARX
  inheritance:
  - name: X-linked inheritance
    inheritance_term:
      preferred_term: X-linked inheritance
      term:
        id: HP:0001417
        label: X-linked inheritance
    evidence:
    - reference: PMID:12379852
      reference_title: "Mutation of ARX causes abnormal development of forebrain and testes in mice and X-linked lissencephaly with abnormal genitalia in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found multiple loss-of-function mutations in ARX in individuals
        affected with XLAG and in some female relatives, and conclude that mutation
        of ARX causes XLAG.
      explanation: >-
        Establishes the X-linked gene and affected-family context.
  features: >-
    Complete loss-of-function alleles and severe homeodomain missense variants
    are associated with XLAG or the nearby hydranencephaly/Proud-syndrome end of
    the ARX spectrum. Polyalanine expansions and other hypomorphic alleles more
    often produce non-malformative developmental epilepsy, Partington syndrome,
    or intellectual disability and must not be used to infer a classic XLAG
    phenotype. Female heterozygotes range from asymptomatic to severe ARX-related
    neurodevelopmental disease depending on variant origin, X-inactivation, and
    other modifiers.
  evidence:
  - reference: PMID:12379852
    reference_title: "Mutation of ARX causes abnormal development of forebrain and testes in mice and X-linked lissencephaly with abnormal genitalia in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found multiple loss-of-function mutations in ARX in individuals
      affected with XLAG and in some female relatives, and conclude that mutation
      of ARX causes XLAG.
    explanation: >-
      Founding human evidence for ARX loss-of-function causation.
  - reference: PMID:14722918
    reference_title: "Mutations of ARX are associated with striking pleiotropy and consistent genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Premature termination mutations consisting of large deletions, frameshifts,
      nonsense mutations, and splice site mutations in exons 1 to 4 caused XLAG
      or hydranencephaly with abnormal genitalia.
    explanation: >-
      Defines the variant-class association with severe malformative disease.
  - reference: PMID:14722918
    reference_title: "Mutations of ARX are associated with striking pleiotropy and consistent genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonconservative missense mutations within the homeobox caused less severe
      XLAG, while conservative substitution in the homeodomain caused Proud
      syndrome.
    explanation: >-
      Demonstrates genotype-phenotype separation within severe ARX alleles.
  - reference: PMID:20148114
    reference_title: "Mutations in the nuclear localization sequence of the Aristaless related homeobox; sequestration of mutant ARX with IPO13 disrupts normal subcellular distribution of the transcription factor and retards cell division."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that missense mutations in either the N- or C-terminal NLS
      regions of the homeodomain cause significant disruption to nuclear
      localisation of the ARX protein in vitro.
    explanation: >-
      Provides a functional mechanism for severe homeodomain/NLS alleles.
  - reference: PMID:41960368
    reference_title: "Cellular Functional Analyses of ARX Variants Reveal New Insights Into Genotype-Phenotype Correlations in Neurodevelopmental Disorders Among Male and Female Patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results demonstrate that all tested variants disrupt normal ARX
      transcriptional function, with several also altering protein localization
      or expression.
    explanation: >-
      Current functional evidence supports variant-level interpretation while
      remaining in vitro rather than outcome evidence.
  - reference: PMID:37879892
    reference_title: "Further characterisation of ARX-related disorders in females due to inherited or de novo variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ID/DEE phenotype was significantly more prevalent in females carrying
      de novo variants (75%, n=15/20) versus in those carrying inherited variants
      (27.3%, n=9/33).
    explanation: >-
      Demonstrates that female risk is substantial but differs by variant origin;
      these percentages are not XLAG-male phenotype frequencies.

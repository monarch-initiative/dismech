mechanistic_hypotheses:
- hypothesis_group_id: human_xlag_lissencephaly_route
  hypothesis_label: Candidate Human-Specific Radial-Migration Route
  status: ALTERNATIVE
  description: >-
    The defining gyral malformation may require an additional ARX-dependent
    radial-migration process in the neocortical subventricular zone rather than
    following solely from tangential interneuron migration failure. Human XLAG
    neuropathology only suggests such a role; an ARX defect in dorsal excitatory
    progenitors, outer radial glia, or cortical lamination remains untested.
    General non-ARX lissencephaly organoid work motivates the species limitation
    but does not establish this mechanism in XLAG.
  evidence:
  - reference: PMID:18458920
    reference_title: "Aristaless-related homeobox gene disruption leads to abnormal distribution of GABAergic interneurons in human neocortex: evidence based on a case of X-linked lissencephaly with abnormal genitalia (XLAG)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that ARX protein controls not only the tangential
      migration of GABAergic interneurons from the ganglionic eminence, but also
      may serve to induce radial migration from the neocortical subventricular
      zone.
    explanation: >-
      Human XLAG tissue raises a possible neocortical-SVZ radial-migration route
      but does not identify the migrating lineage or demonstrate causation.
  - reference: PMID:28111201
    reference_title: "Human iPSC-Derived Cerebral Organoids Model Cellular Features of Lissencephaly and Reveal Prolonged Mitosis of Outer Radial Glia."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We also identified a mitotic defect in outer radial glia, a progenitor
      subtype that is largely absent from lissencephalic rodents but critical for
      human neocortical expansion.
    explanation: >-
      Miller-Dieker organoid evidence illustrates a human-enriched progenitor
      limitation; it is not evidence of an ARX defect in outer radial glia.
pathophysiology:
- name: ARX Functional Deficiency
  description: >-
    Complete loss-of-function and severe homeodomain variants reduce or
    mislocalize functional nuclear ARX. This is the initiating molecular lesion
    in classic XLAG; hypomorphic and polyalanine-expansion alleles can produce
    different ARX-related disorders and are not assumed to follow every branch
    modeled here.
  role: trigger
  genes:
  - preferred_term: ARX
    term:
      id: hgnc:18060
      label: ARX
  evidence:
  - reference: PMID:12379852
    reference_title: "Mutation of ARX causes abnormal development of forebrain and testes in mice and X-linked lissencephaly with abnormal genitalia in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found multiple loss-of-function mutations in ARX in individuals
      affected with XLAG and in some female relatives, and conclude that mutation
      of ARX causes XLAG.
    explanation: >-
      Establishes pathogenic ARX loss of function as the cause of human XLAG.
  - reference: PMID:20148114
    reference_title: "Mutations in the nuclear localization sequence of the Aristaless related homeobox; sequestration of mutant ARX with IPO13 disrupts normal subcellular distribution of the transcription factor and retards cell division."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that the most likely, common pathogenic mechanism of the missense
      mutations in NLS regions of the ARX homeodomain is inadequate accumulation
      and distribution of the ARX transcription factor within the nucleus due to
      sequestration of ARX with IPO13.
    explanation: >-
      Severe homeodomain variants can create functional ARX deficiency by
      disrupting nuclear localization rather than by eliminating the protein.
  downstream:
  - target: ARX-Dependent Transcriptional Program Disruption
    causal_link_type: DIRECT
    description: >-
      Loss or nuclear mislocalization of functional ARX directly disrupts its
      developmental transcriptional activity.
    evidence:
    - reference: PMID:41960368
      reference_title: "Cellular Functional Analyses of ARX Variants Reveal New Insights Into Genotype-Phenotype Correlations in Neurodevelopmental Disorders Among Male and Female Patients."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our results demonstrate that all tested variants disrupt normal ARX
        transcriptional function, with several also altering protein localization
        or expression.
      explanation: >-
        Functional testing directly links pathogenic ARX variants to disrupted
        transcriptional activity.
- name: ARX-Dependent Transcriptional Program Disruption
  description: >-
    ARX deficiency perturbs transcriptional programs governing forebrain
    progenitor proliferation, cortical-interneuron lineage differentiation and
    guidance, basal-ganglia and thalamocortical development, and testicular
    differentiation. ARX can regulate targets through context-dependent
    repression or derepression, so this node does not assume a single direction
    for every target gene.
  role: trigger
  genes:
  - preferred_term: ARX
    term:
      id: hgnc:18060
      label: ARX
  evidence:
  - reference: PMID:27287386
    reference_title: "Developmental interneuron subtype deficits after targeted loss of Arx."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Aristaless-related homeobox (ARX) is a paired-like homeodomain
      transcription factor that functions primarily as a transcriptional
      repressor and has been implicated in neocortical interneuron specification
      and migration.
    explanation: >-
      Establishes the transcription-factor role that connects ARX deficiency to
      interneuron developmental programs.
  - reference: PMID:41630162
    reference_title: "ARX mutation-associated interneuron defects provide insights into mechanisms underlying developmental epilepsies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Single-cell RNA sequencing combined with chromatin immunoprecipitation
      (ChIP)-seq revealed ARX regulates key processes involved in cell cycle
      progression, cIN subtype differentiation, guidance cues and receptors, as
      well as other transcription factors.
    explanation: >-
      Integrated transcriptional and chromatin evidence identifies the affected
      cortical-interneuron developmental programs.

name: FHONDA Syndrome
creation_date: "2026-11-24T00:00:00Z"
description: >-
  FHONDA syndrome (foveal hypoplasia, optic nerve decussation defects and
  anterior segment dysgenesis) is an autosomal recessive congenital disorder of
  visual-pathway development caused by biallelic SLC38A8 variants. SLC38A8
  encodes SNAT8, a sodium-dependent neutral amino acid transporter that prefers
  L-glutamine and is expressed in retinal photoreceptors and CNS neurons.
  Affected individuals have severe (grade 4) foveal hypoplasia with no foveal
  pit and no cone outer-segment lengthening, infantile nystagmus, moderately to
  severely reduced visual acuity and excess crossing of retinal ganglion cell
  axons at the optic chiasm, as in albinism but with normal skin, hair and
  ocular pigmentation. Anterior segment dysgenesis (posterior embryotoxon,
  Axenfeld anomaly) occurs in about a fifth of patients. How loss of SNAT8
  transport produces the foveal and chiasmal phenotypes is not known.
category: Mendelian
parents:
- foveal hypoplasia
- inborn disorder of amino acid transport
- hereditary optic neuropathy
synonyms:
- foveal hypoplasia - optic nerve decussation defect - anterior segment dysgenesis syndrome
- foveal hypoplasia 2
- foveal hypoplasia type 2
- foveal hypoplasia 2, with or without optic nerve misrouting and/or anterior segment dysgenesis
- FVH2
- SLC38A8-related foveal hypoplasia
notes: >-
  Named FHONDA Syndrome rather than an SLC38A8-related dyad. FHONDA syndrome is a
  MONDO exact synonym and the name the primary literature uses (a PubMed search
  for FHONDA returned 15 records; a search for "SLC38A8-related" returned one,
  PMID:33498813), and it covers only the SLC38A8 disease. No GeneReviews chapter
  covers FHONDA or SLC38A8 (cache/bookshelf/genereviews.csv has no row matching
  either), so the phenotype baseline is the pooled review of 58 published
  patients in PMID:33498813 together with the 28-patient multicentre series in
  PMID:35029636. Single reports of retinitis pigmentosa features
  (PMID:39275842), early-onset age-related macular degeneration and
  developmental delay (PMID:32032626) are not entered as phenotypes because
  each rests on one patient.

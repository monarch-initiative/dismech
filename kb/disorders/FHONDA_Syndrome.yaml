animal_models:
- name: Slc38a8 p.Pro196* truncating mouse
  species: Mouse
  genotype: Slc38a8 p.Pro196* (CRISPR/Cas9), backcrossed to C57BL/6J
  genes:
  - preferred_term: Slc38a8
    term:
      id: MGI:2685433
      label: Slc38a8
  publication: PMID:37862028
  description: >-
    CRISPR/Cas9 allele truncating Slc38a8 at p.Pro196*, equivalent to human
    p.Pro199* and close to the patient allele p.Gln200*. Mice have wild-type eye
    and coat pigmentation, a reduced ipsilateral retinal projection, reduced
    scotopic ERG response, reduced optomotor visual acuity and subcellular
    abnormalities of the retinal pigment epithelium.
  modeled_mechanisms:
  - target: Retinal Ganglion Cell Axon Misrouting at the Optic Chiasm
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Misrouting is measured as a reduction in ipsilateral fibres by
      anterograde labelling, not by VEP as in patients.
    readouts:
    - name: Ipsilateral retinal fibres by anterograde labelling
      target: Retinal Ganglion Cell Axon Misrouting at the Optic Chiasm
      direction: DECREASED
      evidence:
      - reference: PMID:37862028
        reference_title: A Slc38a8 Mouse Model of FHONDA Syndrome Faithfully Recapitulates the Visual Deficits of Albinism Without Pigmentation Defects.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Anterograde labeling experiments of retinal projections in embryos and adults showed a reduction of ipsilateral fibers."
        explanation: Reports the measurement behind the readout.
    evidence:
    - reference: PMID:37862028
      reference_title: A Slc38a8 Mouse Model of FHONDA Syndrome Faithfully Recapitulates the Visual Deficits of Albinism Without Pigmentation Defects.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Slc38a8 mutant mice recapitulate the phenotype of patients with FHONDA concerning their normal pigmentation and their abnormal visual system, in the latter being a hallmark of all types of albinism."
      explanation: The authors conclude the model reproduces the visual-system phenotype with normal pigmentation.
  - target: Arrested Foveal Development
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      Mice lack a fovea, so the defining foveal phenotype of FHONDA cannot be
      assessed in this model.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        The mouse retina has no fovea or foveal pit, so the arrest of foveal pit
        formation and cone outer-segment lengthening seen in patients has no
        counterpart to measure.
    evidence:
    - reference: PMID:37862028
      reference_title: A Slc38a8 Mouse Model of FHONDA Syndrome Faithfully Recapitulates the Visual Deficits of Albinism Without Pigmentation Defects.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Functional visual analyses revealed a decreased ERG response in scotopic conditions and a reduction of visual acuity in mutant mice measured by OT."
      explanation: The model's retinal readouts are ERG and optomotor acuity, not foveal structure.
treatments:
- name: Genetic Counseling
  description: >-
    Molecular diagnosis separates FHONDA from albinism and PAX6 disease, with
    which it is often confused, and supports recessive recurrence-risk
    counselling.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33498813
    reference_title: Novel Biallelic Variants and Phenotypic Features in Patients with SLC38A8-Related Foveal Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study reinforces the importance of obtaining a molecular diagnosis in patients whose phenotype overlap with other inherited ocular conditions, in order to support genetic counselling, clinical prognosis and family planning."
    explanation: States the role of molecular diagnosis in genetic counselling and family planning.
  - reference: PMID:32744312
    reference_title: SLC38A8 mutations result in arrested retinal development with loss of cone photoreceptor specialization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ninety percent of our cases were initially misdiagnosed as PAX6-related phenotype or ocular albinism prior to NGS."
    explanation: Shows how often FHONDA is misdiagnosed without molecular testing.

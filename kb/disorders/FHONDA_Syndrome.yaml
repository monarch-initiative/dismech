inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic (homozygous or compound heterozygous) SLC38A8
    variants; the first families were consanguineous.
  evidence:
  - reference: PMID:24194637
    reference_title: "A new recessively inherited disorder composed of foveal hypoplasia, optic nerve decussation defects and anterior segment dysgenesis maps to chromosome 16q23.3-24.1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a new recessively inherited syndrome consisting of foveal hypoplasia, optic nerve decussation defects and anterior segment dysgenesis, which we have abbreviated to FHONDA syndrome."
    explanation: Linkage study of two consanguineous families that defined the syndrome as recessive.
  - reference: PMID:33498813
    reference_title: Novel Biallelic Variants and Phenotypic Features in Patients with SLC38A8-Related Foveal Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic pathogenic variants in solute carrier family 38 member 8, SLC38A8, cause a pan-ocular autosomal recessive condition known as foveal hypoplasia 2, FVH2, characterised by foveal hypoplasia, nystagmus and optic nerve chiasmal misrouting."
    explanation: Case series and literature review stating biallelic SLC38A8 variants and autosomal recessive inheritance.
genetic:
- name: SLC38A8
  gene_term:
    preferred_term: SLC38A8
    term:
      id: hgnc:32434
      label: SLC38A8
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic germline SLC38A8 variants (missense, nonsense, frameshift,
    canonical splice and exon deletions) cause FHONDA syndrome. About 60
    disease-causing variants had been reported by 2024. Missense changes
    cluster in the sixth transmembrane domain; p.Ile32Ser recurs in Indian and
    Karaite Jewish families.
  evidence:
  - reference: PMID:24290379
    reference_title: Recessive mutations in SLC38A8 cause foveal hypoplasia and optic nerve misrouting without albinism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report that these defects can occur independently of albinism in people with recessive mutations in the putative glutamine transporter gene SLC38A8. Nine different mutations were identified in seven Asian and European families."
    explanation: Gene-discovery study identifying recessive SLC38A8 mutations in seven families.
  - reference: PMID:24045842
    reference_title: Isolated foveal hypoplasia with secondary nystagmus and low vision is associated with a homozygous SLC38A8 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified a single missense mutation in the homozygosity region: c.95T>G, p.(Ile32Ser), in a conserved amino acid within the first predicted transmembrane domain of SLC38A8. The mutation fully segregated with the disease-associated phenotype"
    explanation: Independent discovery of a segregating homozygous SLC38A8 missense variant in Jewish Indian families.
  - reference: PMID:32744312
    reference_title: SLC38A8 mutations result in arrested retinal development with loss of cone photoreceptor specialization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 16 novel SLC38A8 mutations. The sixth transmembrane domain is most frequently disrupted by missense SLC38A8 mutations."
    explanation: Multicentre nystagmus-panel study expanding the SLC38A8 mutational spectrum.
  - reference: PMID:39275842
    reference_title: Expanding the mutational and phenotypical spectrum of FHONDA syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FHONDA is associated with biallelic disease-causing variants in the SLC38A8 gene, which has a strong expression in the photoreceptor layer. To date, 60 different disease-causing variants in the SLC38A8 gene have been described."
    explanation: Recent case series summarising the size of the SLC38A8 variant spectrum.

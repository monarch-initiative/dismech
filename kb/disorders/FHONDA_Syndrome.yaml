      snippet: "Molecular analysis revealed a recently described homozygous mutation, c.95T > G; p.Ile32Ser, in two families of Jewish Indian descent, and the same mutation in two families of Karaite Jewish descent."
      explanation: Shows recurrence of p.Ile32Ser across Jewish Indian and Karaite Jewish families.
pathophysiology:
- name: SLC38A8 Biallelic Variants
  biological_scale: MOLECULAR
  description: >-
    Biallelic SLC38A8 variants are expected to abolish or reduce SNAT8, a
    sodium-dependent neutral amino acid transporter whose substrates include
    L-glutamine, L-alanine, L-arginine, L-histidine and L-aspartate. Truncating
    and canonical splice variants are predicted to undergo nonsense-mediated
    decay, and missense variants are predicted to destabilise the protein.
    Transport by patient variants has not been measured in the sources cited
    here, so loss of transport is inferred rather than demonstrated.
  genes:
  - preferred_term: SLC38A8
    term:
      id: hgnc:32434
      label: SLC38A8
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: sodium-coupled neutral amino acid transport (SNAT8)
    term:
      id: GO:0005295
      label: neutral L-amino acid:sodium symporter activity
    modifier: DECREASED
  - preferred_term: L-glutamine transport
    term:
      id: GO:0015186
      label: L-glutamine transmembrane transporter activity
    modifier: DECREASED
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000287
      label: eye photoreceptor cell
  evidence:
  - reference: PMID:25451601
    reference_title: "Transport of L-glutamine, L-alanine, L-arginine and L-histidine by the neuron-specific Slc38a8 (SNAT8) in CNS."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "We show that SLC38A8 has preference for transporting L-glutamine, L-alanine, L-arginine, L-histidine and L-aspartate using a Na+-dependent transport mechanism and that the functional characteristics of SNAT8 have highest similarity to the known System A transporters."
    explanation: Functional characterisation of wild-type SNAT8 establishes the transport activity that biallelic variants are expected to lose; it does not test patient variants.
  - reference: PMID:32744312
    reference_title: SLC38A8 mutations result in arrested retinal development with loss of cone photoreceptor specialization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLC38A8 is a putative glutamine transporter with strong expression within the photoreceptor layer in the retina."
    explanation: Places SLC38A8 expression in the photoreceptor layer, the retinal compartment whose specialisation fails.
  - reference: PMID:32744312
    reference_title: SLC38A8 mutations result in arrested retinal development with loss of cone photoreceptor specialization.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "All amino acid substitutions are predicted to be destabilizing (Fig. 2)."
    explanation: Structural modelling predicts that patient missense variants destabilise SNAT8; a prediction, not a transport measurement.
  - reference: PMID:28546991
    reference_title: Structural modeling of a novel SLC38A8 mutation that causes foveal hypoplasia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "Our modeling also predicted that the mutation destabilizes the protein by altering the electrostatic potential within the channel pore."
    explanation: Independent structural modelling of a patient missense variant predicts loss of protein stability.
  downstream:
  - target: Arrested Foveal Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      SLC38A8 is required for foveal development independently of melanin; the
      steps between loss of SNAT8 and failed foveal specialisation are not
      known.
    evidence:
    - reference: PMID:24290379
      reference_title: Recessive mutations in SLC38A8 cause foveal hypoplasia and optic nerve misrouting without albinism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This study reveals a melanin-independent component underpinning the development of the visual pathway that requires a functional role for SLC38A8."
      explanation: Gene-discovery study concludes that SLC38A8 function is needed for visual-pathway development; the intermediate mechanism is unresolved.
  - target: Retinal Ganglion Cell Axon Misrouting at the Optic Chiasm
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of Slc38a8 reduces the uncrossed (ipsilateral) retinal projection in
      mice; how SNAT8 influences axon routing is not known.
    evidence:
    - reference: PMID:37862028
      reference_title: A Slc38a8 Mouse Model of FHONDA Syndrome Faithfully Recapitulates the Visual Deficits of Albinism Without Pigmentation Defects.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Anterograde labeling experiments of retinal projections in embryos and adults showed a reduction of ipsilateral fibers."
      explanation: A truncating Slc38a8 allele in mouse reduces ipsilateral retinal fibres, linking loss of SLC38A8 to chiasmal misrouting.
  - target: Ocular anterior segment dysgenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Anterior segment dysgenesis occurs in a minority of patients; no
      mechanism linking SLC38A8 to anterior segment development has been
      described.
- name: Arrested Foveal Development
  biological_scale: TISSUE
  description: >-
    Retinal development arrests at an early stage: the foveal pit does not form,
    inner retinal layers remain continuous across the fovea and cone outer
    segments do not lengthen, implying low foveal cone density. The arrest is
    more severe than the graded foveal hypoplasia of albinism or PAX6 disease
    and is not progressive.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: foveal cone specialisation
    term:
      id: GO:0046549
      label: retinal cone cell development
    modifier: DECREASED
  locations:
  - preferred_term: fovea centralis
    term:
      id: UBERON:0001786
      label: fovea centralis
  evidence:
  - reference: PMID:32744312
    reference_title: SLC38A8 mutations result in arrested retinal development with loss of cone photoreceptor specialization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had severe grades of arrested retinal development with lack of a foveal pit and no cone photoreceptor outer segment lengthening."
    explanation: High-resolution OCT in 11 patients shows arrested foveal development with no cone outer-segment lengthening.
  - reference: PMID:32744312
    reference_title: SLC38A8 mutations result in arrested retinal development with loss of cone photoreceptor specialization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike other disorders (such as albinism or PAX6 mutations) which exhibit a spectrum of foveal hypoplasia, SLC38A8 mutations have arrest of retinal development at an earlier stage resulting in a more under-developed retina and severe phenotype."
    explanation: Compares the developmental arrest with albinism and PAX6 disease.
  downstream:
  - target: Hypoplasia of the fovea
    causal_link_type: DIRECT
  - target: Reduced visual acuity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32744312
      reference_title: SLC38A8 mutations result in arrested retinal development with loss of cone photoreceptor specialization.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Loss of foveal specialization features such as outer segment lengthening implies reduced foveal cone density, which contributes to reduced visual acuity."
      explanation: Links the loss of foveal cone specialisation to reduced visual acuity.
  - target: Congenital nystagmus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Nystagmus is interpreted as secondary to the foveal defect, as in other
      sensory-defect infantile nystagmus; the sources cited here do not test
      this.
- name: Retinal Ganglion Cell Axon Misrouting at the Optic Chiasm
  biological_scale: TISSUE
  description: >-
    Temporal retinal ganglion cell axons cross abnormally at the optic chiasm,
    so each hemisphere receives excess input from the contralateral eye, as in
    albinism but without hypopigmentation.
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: optic chiasm axon routing
    term:
      id: GO:0061360
      label: optic chiasma development
    modifier: ABNORMAL
  locations:
  - preferred_term: optic chiasm
    term:
      id: UBERON:0000959
      label: optic chiasma
  evidence:
  - reference: PMID:29524626
    reference_title: Altered organization of the visual cortex in FHONDA syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We determined the cortical organization in a novel congenital visual pathway disorder, FHONDA-syndrome, where the axons from the temporal retina abnormally cross to the contralateral hemisphere."
    explanation: 7 T fMRI study in two affected individuals describing abnormal crossing of temporal retinal axons.
  - reference: PMID:35029636
    reference_title: "The Phenotypic and Mutational Spectrum of the FHONDA Syndrome and Oculocutaneous Albinism: Similarities and Differences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Misrouting was present in all nine tested patients. None of the patients had any signs of hypopigmentation of skin and hair."
    explanation: Misrouting by VEP in all tested patients of a 28-patient series, without hypopigmentation.
  downstream:
  - target: Optic nerve misrouting
    causal_link_type: DIRECT
  - target: Abnormal Visual Cortex Hemifield Representation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29524626
      reference_title: Altered organization of the visual cortex in FHONDA syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The cortical activation in FHONDA was confined to the hemisphere contralateral to the stimulated eye."
      explanation: Shows the cortical consequence of the excess chiasmal crossing.
- name: Abnormal Visual Cortex Hemifield Representation
  biological_scale: TISSUE
  description: >-
    Primary visual cortex receives input from the contralateral eye only, and
    each cortical location represents mirror-symmetric points in both visual
    hemifields.
  locations:
  - preferred_term: primary visual cortex
    term:
      id: UBERON:0002436
      label: primary visual cortex
  evidence:
  - reference: PMID:29524626
    reference_title: Altered organization of the visual cortex in FHONDA syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each cortical location was found to contain a pRF in each visual hemifeld and opposing hemifields were represented as retinotopic cortical overlays of mirror-symmetrical locations across the vertical meridian."
    explanation: Population receptive field mapping in two affected individuals.

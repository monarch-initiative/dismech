    snippet: "Excluding missing data, all patients had moderate to severe visual impairment (median visual acuity [VA] = 0.7 logMAR, interquartile range [IQR] = 0.6-0.8), nystagmus (28/28), and grade 4 foveal hypoplasia (17/17)."
    explanation: Grade 4 foveal hypoplasia in all 17 patients with OCT grading.

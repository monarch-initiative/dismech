    reference_title: Novel Biallelic Variants and Phenotypic Features in Patients with SLC38A8-Related Foveal Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 58 affected individuals in 37 families, 100% (n = 58) had foveal hypoplasia and nystagmus, while 97% (29 out of the 30 who underwent VEP testing) showed chiasmal misrouting."
    explanation: Pooled review of 58 published patients; all had foveal hypoplasia.

      explanation: ClinGen Aminoacidopathy GCEP classifies SLC38A8 in autosomal recessive FHONDA as Definitive.
  variants:
  - name: p.Ile32Ser
    description: >-
      SLC38A8 c.95T>G, p.(Ile32Ser), in the first predicted transmembrane

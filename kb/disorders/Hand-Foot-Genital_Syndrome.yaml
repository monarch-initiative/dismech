  evidence:
  - reference: PMID:9020844
    reference_title: "Mutation of HOXA13 in hand-foot-genital syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Limb anomalies include short first metacarpals of normal thickness, small distal phalanges of the thumbs, short middle phalanges of the fifth fingers, and fusion or delayed ossification of wrist bones."
    explanation: "Documents abnormal distal digit growth and delayed carpal ossification/fusion in HFGS."
  - reference: PMID:10839976
    reference_title: "Novel HOXA13 mutations and the phenotypic spectrum of hand-foot-genital syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in HOXA13 can therefore cause more-severe limb abnormalities than previously suspected and may act by more than one mechanism."
    explanation: "Demonstrates the spectrum of distal limb morphogenesis defects across HOXA13 variant classes."
  downstream:
  - target: Short First Metacarpal

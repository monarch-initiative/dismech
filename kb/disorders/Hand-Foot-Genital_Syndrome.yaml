pathophysiology:
- name: HOXA13 Haploinsufficiency and Impaired Homeodomain DNA Binding
  biological_scale: MOLECULAR
  description: >-
    HOXA13 encodes the most 5' (caudal/distal) homeobox transcription factor of
    the HOXA cluster. Heterozygous nonsense, frameshift, gross deletion, and
    homeodomain missense variants cause haploinsufficiency or abolish
    homeodomain DNA binding, reducing HOXA13 transcriptional activity in
    developing distal limb buds and caudal urogenital tissues.
  genes:
  - preferred_term: HOXA13
    term:
      id: hgnc:5102
      label: HOXA13
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:9020844
    reference_title: "Mutation of HOXA13 in hand-foot-genital syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation converts a highly conserved tryptophan residue in the homeodomain to a stop codon, which truncates 20 amino acids from the protein and likely eliminates or greatly reduces the ability of the protein to bind to DNA."
    explanation: "Demonstrates that truncating homeodomain mutations impair HOXA13 DNA-binding transcription factor activity."
  - reference: PMID:10839976
    reference_title: "Novel HOXA13 mutations and the phenotypic spectrum of hand-foot-genital syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In families 1, 2, and 3, nonsense mutations truncating the encoded protein N-terminal to or within the homeodomain produce typical limb and genitourinary abnormalities; in family 4, an expansion of an N-terminal polyalanine tract produces a similar phenotype"
    explanation: "Demonstrates that nonsense mutations truncating HOXA13 N-terminal to or within the homeodomain disrupt HOXA13 function to cause HFGS."
  downstream:
  - target: Distal Autopod Chondrogenesis and Ossification Disruption
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: "Loss of nuclear HOXA13 transcriptional activity disrupts distal limb bud mesenchymal patterning and ossification."
  - target: Mullerian Duct Fusion Defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: "Deficient caudal HOXA13 transcriptional signaling impairs fusion of the distal paramesonephric (Müllerian) ducts."
  - target: Ureterovesical and Bladder Outlet Patterning Defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: "Deficient HOXA13 activity disrupts urogenital sinus and ureterovesical junction morphogenesis."
  - target: Ventral Urethral Closure Defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: "Deficient HOXA13 activity impairs urethral plate patterning and ventral urethral closure."
- name: HOXA13 Polyalanine Tract Expansion and Reduced Protein Abundance
  biological_scale: MOLECULAR
  description: >-
    In-frame expansions across any of the three large exon 1 polyalanine tracts
    of HOXA13 leave steady-state mRNA levels, splicing, and translation
    efficiency intact while reducing steady-state HOXA13 protein abundance in
    vivo (likely via protein degradation), producing a loss-of-function
    phenotype indistinguishable from null alleles; in vitro overexpression
    studies additionally report cytoplasmic aggregation and mislocalization of
    polyalanine-expanded HOXA13.
  genes:
  - preferred_term: HOXA13
    term:
      id: hgnc:5102
      label: HOXA13
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:15385446
    reference_title: "Polyalanine expansion in HOXA13: three new affected families and the molecular consequences in a mouse model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Here we report additional families with expansions in the third repeat of 11 and 12 alanine residues, the latter being the largest expansion reported. We also report a patient with a novel, de novo 8-alanine expansion in the first large repeat. Thus, expansions in all three large HOXA13 polyalanine repeats can cause HFGS."
    explanation: "Establishes that pathogenic polyalanine expansions in all three large exon 1 repeats of HOXA13 cause human HFGS."
  - reference: PMID:15385446
    reference_title: "Polyalanine expansion in HOXA13: three new affected families and the molecular consequences in a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Mutant mice were indistinguishable from Hoxa13 null mice. Mutant limb buds had normal steady-state Hoxa13 RNA expression, normal mRNA splicing and reduced levels of steady-state protein. In vitro translation efficiency of the HOXA13(ALA28) protein was normal. Thus, loss of function is secondary to a reduction in the in vivo abundance of the expanded protein likely due to degradation."
    explanation: "Demonstrates in knock-in mice that polyalanine expansion causes HOXA13 loss of function via reduced in vivo steady-state protein abundance rather than altered transcription or translation."
  - reference: PMID:19591980
    reference_title: "A novel mutation of HOXA13 in a family with hand-foot-genital syndrome and the role of polyalanine expansions in the spectrum of Müllerian fusion anomalies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Wild type HOXA13 and HOXD13 mislocalize when coexpressed with mutant HOXA13 that contains polyalanine expansions in vitro. The presence of additional alanine residues in the polyalanine tracts of HOXA13 has been shown to cause aggregations of both HOXA13 and HOXD13 in the cytoplasm, preventing these transcription factors from entering the nucleus."
    explanation: "Summarizes prior in vitro co-expression assays showing cytoplasmic aggregation and nuclear exclusion of polyalanine-expanded HOXA13."
  downstream:

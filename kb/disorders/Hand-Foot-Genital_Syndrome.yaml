    reference_title: "Mutation of HOXA13 in hand-foot-genital syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Uterine anomalies are common in females with HFG, and typically involve a partially divided (bicornuate) or completely divided (didelphic) uterus, representing defects of Müllerian duct fusion."
    explanation: "Establishes incomplete Müllerian duct fusion as the developmental basis of uterine anomalies in HFGS."
  - reference: PMID:20301596
    reference_title: "Hand-Foot-Genital Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urogenital malformations include abnormalities of the ureters and urethra and various degrees of incomplete müllerian fusion in females, and hypospadias of variable severity with or without chordee in males."

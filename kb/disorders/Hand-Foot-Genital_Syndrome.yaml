treatments:
- name: Urologic and Gynecologic Surgical Correction
  description: >-
    Ureteric reimplantation and surgical correction of bladder outlet
    abnormalities or hypospadias are frequently required, whereas hand/foot
    surgery and resection of uterine or vaginal septa are reserved for specific
    functional or obstetric indications (such as tight hymenal ring or
    recurrent pregnancy loss).
  therapeutic_modality: SURGERY
  target_mechanisms:

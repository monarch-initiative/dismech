    treatment_effect: MODULATES
    description: "Ureteric reimplantation and bladder outlet repair correct structural urinary tract anomalies and prevent reflux nephropathy."
  - target: Ventral Urethral Closure Defect
    treatment_effect: MODULATES
    description: "Urethroplasty corrects ventral urethral closure defects (hypospadias) in affected males."
  - target: Mullerian Duct Fusion Defect

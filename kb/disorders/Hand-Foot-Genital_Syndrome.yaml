    evidence_source: HUMAN_CLINICAL
    snippet: "GC content had less influence on sequence coverage in WGS than WES analysis."
    explanation: "Notes the diagnostic advantage of whole-genome sequencing over exome sequencing in GC-rich exon 1 of HOXA13."
treatments:
- name: Urologic and Gynecologic Surgical Correction
  description: >-
    Ureteric reimplantation and surgical correction of bladder outlet
    abnormalities or hypospadias are frequently required, whereas hand/foot
    surgery and resection of uterine or vaginal septa are reserved for specific
    functional or obstetric indications (such as tight hymenal ring or
    recurrent pregnancy loss).
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Lower Urinary Tract and External Genital Patterning Defect
    treatment_effect: MODULATES
    description: "Ureteric reimplantation and urethral/bladder outlet repair correct structural urinary tract anomalies and prevent reflux nephropathy."
  - target: Mullerian Duct Fusion Defect
    treatment_effect: MODULATES
    description: "Selective surgical management addresses obstructive vaginal/hymenal rings or symptomatic uterine septa."
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301596
    reference_title: "Hand-Foot-Genital Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hand or foot surgery is not usually necessary. Ureteric reimplantation and surgical correction of bladder outlet abnormalities are often necessary. Surgical removal of a longitudinal vaginal septum is rarely indicated."
    explanation: "Defines the surgical management priorities across limb, urologic, and Müllerian anomalies in HFGS."
- name: Antibiotic Prophylaxis
  description: >-
    Prophylactic antimicrobial therapy is used as clinically indicated to
    prevent recurrent urinary tract infections and renal parenchymal damage in
    patients with vesicoureteral reflux or ureteropelvic junction obstruction.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
  evidence:
  - reference: PMID:20301596
    reference_title: "Hand-Foot-Genital Syndrome."
    supports: SUPPORT

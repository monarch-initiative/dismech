    and ossification of the first-ray metacarpals, metatarsals, distal
    phalanges, fifth-finger middle phalanges, and carpal/tarsal bones,
    producing symmetric thumb and hallux hypoplasia together with carpal/tarsal
    synostosis or delayed ossification.

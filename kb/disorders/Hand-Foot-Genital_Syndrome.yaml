name: Hand-Foot-Genital Syndrome
synonyms:
- Hand-foot-genital syndrome, HOXA13-related
- Hand-foot-uterus syndrome
- HFGS
creation_date: '2026-02-13T00:31:42Z'
category: Mendelian
description: >-
  Hand-foot-genital syndrome (HFGS) is an autosomal dominant, fully penetrant
  disorder caused by heterozygous pathogenic variants in HOXA13, a 5'-end
  homeobox transcription factor critical for distal autopod and caudal
  urogenital/Müllerian duct patterning. Roughly half of pathogenic variants are
  exon 1 polyalanine tract expansions that cause loss of function via reduced
  steady-state HOXA13 protein abundance in vivo (with cytoplasmic mislocalization
  observed in overexpression assays), while truncating and homeodomain missense
  variants act via haploinsufficiency or altered DNA binding. Clinically, HFGS
  is characterized by bilateral shortening of the thumbs and halluces (short
  first metacarpals/metatarsals and small pointed distal phalanges), short
  fifth-finger middle phalanges, carpal or tarsal synostosis or delayed
  ossification, incomplete Müllerian duct fusion in females (bicornuate or
  didelphic uterus, longitudinal vaginal septum), hypospadias in males, and
  ureterovesical anomalies predisposing to vesicoureteral reflux, recurrent
  urinary tract infections, and chronic pyelonephritis.

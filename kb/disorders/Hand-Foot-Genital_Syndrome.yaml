    snippet: "BACKGROUND: Hand-Foot-Genital Syndrome (HFGS) is an autosomal dominant disorder characterized by a broad phenotypic spectrum. Variants in HOXA13 gene were associated with HFGS. To date, only twenty families with HFGS have been reported."
    explanation: "Recent report notes approximately twenty families reported worldwide."
pathophysiology:
- name: HOXA13 Transcription Factor Loss of Function and Dominant-Negative Aggregation
  biological_scale: MOLECULAR
  description: >-
    HOXA13 encodes the most 5' (caudal/distal) homeobox transcription factor of
    the HOXA cluster. Truncating variants and deletions cause haploinsufficiency
    or abolish homeodomain DNA binding, whereas in-frame expansions of exon 1
    polyalanine tracts induce cytoplasmic aggregation that sequesters mutant
    HOXA13 and wild-type HOXA13/HOXD13 away from the nucleus in a
    dominant-negative manner.
  genes:
  - preferred_term: HOXA13
    term:
      id: hgnc:5102
      label: HOXA13
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:9020844
    reference_title: "Mutation of HOXA13 in hand-foot-genital syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation converts a highly conserved tryptophan residue in the homeodomain to a stop codon, which truncates 20 amino acids from the protein and likely eliminates or greatly reduces the ability of the protein to bind to DNA."
    explanation: "Demonstrates that truncating homeodomain mutations impair HOXA13 DNA-binding transcription factor activity."
  - reference: PMID:10839976
    reference_title: "Novel HOXA13 mutations and the phenotypic spectrum of hand-foot-genital syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In families 1, 2, and 3, nonsense mutations truncating the encoded protein N-terminal to or within the homeodomain produce typical limb and genitourinary abnormalities; in family 4, an expansion of an N-terminal polyalanine tract produces a similar phenotype"
    explanation: "Demonstrates that both truncating homeodomain variants and N-terminal polyalanine tract expansions disrupt HOXA13 function to cause HFGS."
  downstream:
  - target: Distal Autopod Chondrogenesis and Ossification Disruption
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: "Loss of nuclear HOXA13 transcriptional activity disrupts distal limb bud mesenchymal patterning and ossification."
  - target: Mullerian Duct Fusion Defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: "Deficient caudal HOXA13 transcriptional signaling impairs fusion of the distal paramesonephric (Müllerian) ducts."
  - target: Lower Urinary Tract and External Genital Patterning Defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: "Deficient HOXA13 activity disrupts urogenital sinus, ureterovesical junction, and urethral plate morphogenesis."
- name: Distal Autopod Chondrogenesis and Ossification Disruption
  biological_scale: TISSUE
  description: >-
    Defective HOXA13-directed patterning in the distal autopod impairs growth
    and ossification of the first-ray metacarpals, metatarsals, distal
    phalanges, and carpal/tarsal bones, producing symmetric thumb and hallux
    hypoplasia.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte

animal_models:
- name: Hoxa13(ALA28) polyalanine-expansion knock-in mouse
  species: Mouse
  genotype: Hoxa13(ALA28) knock-in (+10 alanines in third polyalanine tract)
  publication: PMID:15385446
  description: >-
    Knock-in mouse carrying a 10-alanine expansion in the third polyalanine
    tract of Hoxa13 (HOXA13(ALA28)); mutant limb buds retain normal Hoxa13 RNA
    expression, splicing, and translation efficiency but exhibit reduced
    steady-state HOXA13 protein abundance in vivo and developmental anomalies
    indistinguishable from Hoxa13 null mice.
  modeled_mechanisms:
  - target: HOXA13 Polyalanine Tract Expansion and Reduced Protein Abundance
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Demonstrates that in-frame polyalanine expansion reduces steady-state
      HOXA13 protein abundance in vivo despite normal mRNA levels, splicing,
      and translation efficiency.
    evidence:
    - reference: PMID:15385446
      reference_title: "Polyalanine expansion in HOXA13: three new affected families and the molecular consequences in a mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Mutant limb buds had normal steady-state Hoxa13 RNA expression, normal mRNA splicing and reduced levels of steady-state protein. In vitro translation efficiency of the HOXA13(ALA28) protein was normal. Thus, loss of function is secondary to a reduction in the in vivo abundance of the expanded protein likely due to degradation."
      explanation: "Establishes reduced in vivo steady-state protein abundance as the loss-of-function mechanism of polyalanine-expanded HOXA13."
  - target: Distal Autopod Chondrogenesis and Ossification Disruption
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Reproduces Hoxa13-null distal autopod developmental defects in mutant
      mouse limb buds.
    evidence:
    - reference: PMID:15385446
      reference_title: "Polyalanine expansion in HOXA13: three new affected families and the molecular consequences in a mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "To determine the molecular basis for impaired HOXA13 function, we performed homologous recombination in ES cells in mice to expand the size of the third largest polyalanine tract by 10 residues (HOXA13(ALA28)). Mutant mice were indistinguishable from Hoxa13 null mice."
      explanation: "Shows that Hoxa13(ALA28) knock-in mice phenocopy Hoxa13 null distal autopod developmental defects."
  evidence:
  - reference: PMID:15385446
    reference_title: "Polyalanine expansion in HOXA13: three new affected families and the molecular consequences in a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "To determine the molecular basis for impaired HOXA13 function, we performed homologous recombination in ES cells in mice to expand the size of the third largest polyalanine tract by 10 residues (HOXA13(ALA28)). Mutant mice were indistinguishable from Hoxa13 null mice."
    explanation: "Establishes the Hoxa13(ALA28) knock-in mouse as a direct genetic model of polyalanine-expansion HFGS."

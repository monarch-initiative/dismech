    description: "Impaired first-ray autopod skeletal growth shortens the first metacarpal."
  - target: Short Thumb
    causal_link_type: DIRECT
    description: "Hypoplastic distal thumb phalanges and first metacarpals produce bilateral short thumbs."
  - target: Short Hallux
    causal_link_type: DIRECT
    description: "Shortened first metatarsals and pointed distal phalanges produce bilateral short halluces."
- name: Mullerian Duct Fusion Defect
  biological_scale: TISSUE
  description: >-
    HOXA13 is expressed at the caudal end of the developing paramesonephric
    (Müllerian) ducts; reduced HOXA13 function prevents complete midline fusion
    and septal resorption, resulting in longitudinal vaginal septa and
    bicornuate or didelphic uterus in affected females.

genetic:
- name: HOXA13
  gene_term:
    preferred_term: HOXA13
    term:
      id: hgnc:5102
      label: HOXA13
  association: Heterozygous pathogenic variants in HOXA13
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Approximately 50%-60% of pathogenic HOXA13 variants are in-frame
    polyalanine tract expansions in GC-rich exon 1, with the remainder
    comprising nonsense, frameshift, gross deletion, and homeodomain missense
    variants. Isolated uterovaginal septa without distal limb anomalies do not
    harbor HOXA13 mutations.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_a138effd-f406-4791-b0eb-1f7f89c381d7-2025-07-22T160000.000Z
    evidence:
    - reference: CGGV:assertion_a138effd-f406-4791-b0eb-1f7f89c381d7-2025-07-22T160000.000Z
      reference_title: "HOXA13 / hand-foot-genital syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HOXA13 | HGNC:5102 | hand-foot-genital syndrome | MONDO:0007698 | AD | Definitive"
      explanation: "ClinGen classifies the HOXA13-hand-foot-genital syndrome gene-disease relationship as Definitive for autosomal dominant inheritance."
  evidence:
  - reference: PMID:9020844
    reference_title: "Mutation of HOXA13 in hand-foot-genital syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the identification of a HOXA13 nonsense mutation in a family with hand-foot-genital syndrome."
    explanation: "Identifies the first causative HOXA13 nonsense mutation in HFGS."
  - reference: PMID:20301596
    reference_title: "Hand-Foot-Genital Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of a heterozygous HOXA13 pathogenic variant can establish the diagnosis if clinical and radiographic features are inconclusive. Approximately 50%-60% of pathogenic variants are polyalanine expansions."
    explanation: "Summarizes heterozygous HOXA13 variant spectrum and the predominance of polyalanine expansions."
  - reference: PMID:19591980
    reference_title: "A novel mutation of HOXA13 in a family with hand-foot-genital syndrome and the role of polyalanine expansions in the spectrum of Müllerian fusion anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected members of a family with HFGS showed a novel expansion of the third polyalanine tract of HOXA13, inserting 10 alanines in-frame. None of the patients with idiopathic uterovaginal septa displayed mutations of HOXA13."
    explanation: "Demonstrates pathogenic exon 1 polyalanine expansion in familial HFGS and absence of HOXA13 variants in isolated uterovaginal septa."

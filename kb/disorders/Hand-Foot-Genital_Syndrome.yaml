- name: Mullerian Duct Fusion Defect
  biological_scale: TISSUE
  description: >-
    HOXA13 is expressed at the caudal end of the developing paramesonephric
    (Müllerian) ducts; reduced HOXA13 function prevents complete midline fusion
    and septal resorption, resulting in longitudinal vaginal septa and
    bicornuate or didelphic uterus in affected females, which in turn increase
    the risk of premature labor and fetal loss.

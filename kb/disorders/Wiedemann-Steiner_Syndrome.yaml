- name: Altered H3K4 Methylation and Transcriptional Regulation
  conforms_to: "epigenetic_alterations#Altered Epigenetic Regulation of Gene Expression"
  mechanism_confidence: PROVISIONAL
  description: >
    KMT2A is an H3K4 methylation writer and transcriptional coactivator. In adult
    Kmt2a-heterozygous mouse brain, transcriptional changes and weak
    locus-specific H3K4me3 differences were detected, while global H3K4me1-3
    levels were not dramatically altered. This supports locus- and
    cell-context-dependent dysregulation rather than a proven global histone
    methylation loss.
    The genome-wide DNA methylation episignature used diagnostically is a distinct
    measurement and is not evidence of reduced histone H3K4 methylation.
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: ABNORMAL
  - preferred_term: epigenetic regulation of gene expression
    term:
      id: GO:0040029
      label: epigenetic regulation of gene expression
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32483278
    reference_title: "Mutually suppressive roles of KMT2A and KDM5C in behaviour, neuronal structure, and histone H3K4 methylation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In western blot analyses, global H3K4me1–3 levels were not altered dramatically in any mutant"
    explanation: >
      This negative result prevents overinterpreting KMT2A haploinsufficiency as
      a global H3K4 methylation deficiency.
  - reference: PMID:32483278
    reference_title: "Mutually suppressive roles of KMT2A and KDM5C in behaviour, neuronal structure, and histone H3K4 methylation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By relaxing the threshold, we obtained weak 2A-HET DMRs"
    explanation: >
      The reported Kmt2a-heterozygous H3K4me3 changes were weak and
      locus-specific, supporting the deliberately qualified node.
  downstream:
  - target: Reduced Dendritic Spine Density and Neuronal Dysregulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - mouse_neuronal_extrapolation
    evidence:
    - reference: PMID:32483278
      reference_title: "Mutually suppressive roles of KMT2A and KDM5C in behaviour, neuronal structure, and histone H3K4 methylation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Double mutation of Kmt2a and Kdm5c clearly reversed dendritic morphology, key behavioral traits including aggression, and partially corrected altered transcriptomes and H3K4me landscapes."
      explanation: >
        Genetic interaction connects H3K4/transcriptomic changes with
        dendritic morphology and behavior in the mouse model.

- name: Centrosome Dysfunction and Impaired Microtubule Nucleation
  mechanism_confidence: PROVISIONAL
  description: >
    The MLL/WDR5 complex localizes to pericentriolar material, interacts with
    Cep72 and gamma-tubulin ring-complex proteins, and promotes centrosomal
    recruitment of structural proteins. Loss of MLL/WDR5 impairs microtubule
    nucleation and spindle formation; a related localization phenotype was also
    observed in cells derived from people with WSS. How much this branch
    contributes to the human neurodevelopmental phenotype remains uncertain.
  biological_processes:
  - preferred_term: microtubule nucleation
    term:
      id: GO:0007020
      label: microtubule nucleation
    modifier: ABNORMAL
  - preferred_term: mitotic spindle organization
    term:
      id: GO:0007052
      label: mitotic spindle organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39661677
    reference_title: "MLL/WDR5 complex recruits centriolar satellite protein Cep72 to regulate microtubule nucleation and spindle formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss of the MLL/WDR5 complex affects microtubule nucleation and regrowth. MLL/WDR5 localize to the pericentriolar material and interact with centriolar satellite protein Cep72 and γ-tubulin ring complex proteins (γ-TuRCs)."
    explanation: >
      The study demonstrates a non-nuclear MLL/WDR5-Cep72 centrosomal function
      and reports the phenotype in WSS-derived cells.
  downstream:
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - centrosomal_branch
    evidence:
    - reference: PMID:39661677
      reference_title: "MLL/WDR5 complex recruits centriolar satellite protein Cep72 to regulate microtubule nucleation and spindle formation."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Our studies provide insight into an undiscovered role of MLL at the centrosome"
      explanation: >
        The study supports the cellular branch, but does not establish its
        quantitative contribution to developmental delay; the clinical edge
        is therefore indirect and partial.

- name: Reduced Dendritic Spine Density and Neuronal Dysregulation
  mechanism_confidence: PROVISIONAL
  description: >
    Constitutive Kmt2a-heterozygous mice show reduced dendritic spine density and
    increased aggression. Combining Kmt2a heterozygosity with Kdm5c deficiency
    reversed dendritic morphology and key behavioral traits and partially
    corrected transcriptomic and H3K4me changes. These observations support a
    neuronal branch but have not yet been confirmed in human developmental
    neurons.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:

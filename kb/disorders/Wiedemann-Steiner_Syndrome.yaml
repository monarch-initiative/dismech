      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we show functional interactions of a writer-eraser duo, KMT2A and KDM5C, which are responsible for Wiedemann-Steiner Syndrome (WDSTS), and mental retardation X-linked syndromic Claes-Jensen type (MRXSCJ), respectively."

phenotypes:
- name: Characteristic Facial Features
  description: >
    Characteristic facial features are a defining part of the WDSTS phenotype.
    Reported features include thick eyebrows with lateral flare, vertically
    narrow downslanting palpebral fissures, widely spaced eyes, a wide nasal
    bridge, broad nasal tip, thin upper-lip vermilion, and thick scalp hair.
  category: Craniofacial
  phenotype_term:
    preferred_term: Abnormal facial shape
    term:
      id: HP:0001999
      label: Abnormal facial shape
  evidence:
  - reference: PMID:35617449
    reference_title: "Wiedemann-Steiner Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wiedemann-Steiner syndrome (WSS) is characterized by developmental delay, intellectual disability, and characteristic facial features, with or without additional congenital anomalies."
    explanation: >
      GeneReviews identifies characteristic facial features as one of the core
      clinical findings.

- name: Global Developmental Delay
  description: >
    Developmental delay was reported in 90% of affected children in a
    physical-therapy review, while developmental delay or intellectual
    disability combined was reported in 97% of the largest cohort. Median ages
    at first words and independent walking were 18 and 20 months, respectively,
    demonstrating delays across communication and motor milestones.
  category: Neurological
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:32604375
    reference_title: "Physical Therapy Management of Wiedemann-Steiner Syndrome From Birth to 3 Years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty-seven percent of children diagnosed with WSS have hypotonia, and 90% have developmental delay."
    explanation: >
      The review's developmental-delay estimate directly supports the
      very-frequent frequency band.
  - reference: PMID:33783954
    reference_title: "Expanding the genotypic and phenotypic spectrum in a diverse cohort of 104 individuals with Wiedemann-Steiner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common clinical features identified in the cohort included: developmental delay or intellectual disability (97%), constipation (63.8%), failure to thrive (67.7%), feeding difficulties (66.3%), hypertrichosis cubiti (57%), short stature (57.8%), and vertebral anomalies (46.9%)."
    explanation: >
      The Sheppard et al. n=104 multi-centre cohort provides the most robust
      frequency estimate (97%) for developmental delay/intellectual disability
      in WDSTS.
  - reference: PMID:33783954
    reference_title: "Expanding the genotypic and phenotypic spectrum in a diverse cohort of 104 individuals with Wiedemann-Steiner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median ages at walking and first words were 20 months and 18 months, respectively."
    explanation: >
      The same cohort quantifies delayed motor and speech milestones.

- name: Intellectual Disability
  description: >
    Intellectual disability is a core feature of WDSTS, although severity is
    variable. In a neuropsychological series of ten molecularly confirmed
    children, nonverbal reasoning, visuospatial skills, visual memory, attention,
    working memory, and mathematics were often weaker than receptive vocabulary,
    verbal memory, and word reading.
  category: Neurological
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:36062544
    reference_title: "Individuals with Wiedemann-Steiner syndrome show nonverbal reasoning and visuospatial defects with relative verbal skill sparing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients performed in the below average to very low ranges in Nonverbal Reasoning, Visual/Spatial Perception, Visuoconstruction, Visual Memory, Attention, Working Memory and Math Computation skills. In contrast, over half the sample performed within normal limits on Receptive Vocabulary, Verbal Memory, and Word Reading."
    explanation: >
      Ng et al. characterise the specific neurocognitive profile of WSS in 10
      patients; the small sample supports a profile description but not a
      population-wide severity distribution.
  - reference: PMID:35617449
    reference_title: "Wiedemann-Steiner Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wiedemann-Steiner syndrome (WSS) is characterized by developmental delay, intellectual disability, and characteristic facial features, with or without additional congenital anomalies."
    explanation: >
      GeneReviews identifies intellectual disability as a core clinical feature.

- name: Muscular Hypotonia
  description: >
    Hypotonia was reported in 57% of affected children in a physical-therapy
    review and was associated with loss-of-function KMT2A variants in the
    104-person cohort. It commonly accompanies motor developmental delay.
  category: Neurological
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  evidence:
  - reference: PMID:32604375
    reference_title: "Physical Therapy Management of Wiedemann-Steiner Syndrome From Birth to 3 Years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty-seven percent of children diagnosed with WSS have hypotonia, and 90% have developmental delay. The diagnosis of WSS should require physical therapy services through early intervention programs due to its high correlation with motor developmental delay and disability."
    explanation: >
      Mendoza 2020 reports a 57% frequency estimate and connects hypotonia with
      the need for early motor intervention.
  - reference: PMID:33783954
    reference_title: "Expanding the genotypic and phenotypic spectrum in a diverse cohort of 104 individuals with Wiedemann-Steiner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypotonia was associated with loss of function (LoF) variants, and seizures were associated with non‐LoF variants."
    explanation: >
      Sheppard et al. identify a genotype-phenotype correlation: hypotonia is
      specifically associated with loss-of-function KMT2A variants.

- name: Short Stature
  description: >
    Short stature was reported in 57.8% of the 104-person international cohort
    and in 90.9% of a smaller cohort of 11 Chinese children. The difference
    illustrates ascertainment and cohort variability rather than an established
    population range.
  category: Growth
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:

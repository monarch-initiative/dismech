discussions:
- discussion_id: wdts_mouse_neuronal_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Do the dendritic-spine and H3K4/transcriptomic findings in constitutive
    Kmt2a-heterozygous adult male mice reproduce the mechanisms operating in
    developing human neurons with heterozygous pathogenic KMT2A variants?
  attaches_to:
  - pathophysiology#Altered H3K4 Methylation and Transcriptional Regulation
  - pathophysiology#Reduced Dendritic Spine Density and Neuronal Dysregulation
  rationale: >
    The mouse study provides the main experimental bridge from KMT2A dosage to
    dendritic morphology, but the molecular assays used adult amygdala tissue
    containing mixed neuronal and glial populations, only male mice were studied,
    and the constitutive genotype permits lifetime adaptation. Global H3K4me1-3
    levels were not dramatically altered, and Kmt2a-heterozygous mice were normal
    in the two learning/memory assays used. The model therefore supports a
    locus-specific neuronal hypothesis, not a direct equivalence to human
    intellectual disability or a global histone-methylation-loss mechanism.
  evidence:
  - reference: PMID:32483278
    reference_title: "Mutually suppressive roles of KMT2A and KDM5C in behaviour, neuronal structure, and histone H3K4 methylation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "First, we measured gene expression and H3K4me3 in adult brain tissues, a mixture of many neuron and glia types, which may mask potentially important molecular changes."
    explanation: >
      The authors explicitly identify adult mixed brain tissue as a limitation.
  - reference: PMID:32483278
    reference_title: "Mutually suppressive roles of KMT2A and KDM5C in behaviour, neuronal structure, and histone H3K4 methylation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It is important to note that the double mutations introduced in our mice were constitutive, and therefore a lifetime of adaptation to loss of these two major chromatin regulators may occur from early developmental stages."
    explanation: >
      The study acknowledges developmental adaptation in its constitutive
      genetic design.
  proposed_experiments:
  - experiment_id: wdts_isogenic_human_neuron_timecourse
    name: Isogenic human KMT2A dosage series across neuronal development
    description: >
      Generate patient-derived and CRISPR-engineered heterozygous KMT2A iPSC
      lines with matched corrected controls, differentiate them into defined
      excitatory and inhibitory neuronal lineages, and profile H3K4me states,
      chromatin accessibility, single-cell transcription, dendritic spines, and
      electrophysiology across developmental time points.
    decision_criterion: >
      A reproducible allele-dependent phenotype that is rescued by correction
      and converges across independent lines would support translation of the
      mouse neuronal branch; absence of such changes would argue that the mouse
      phenotype is model- or developmental-context-specific.
    evidence:
    - reference: PMID:32483278
      reference_title: "Mutually suppressive roles of KMT2A and KDM5C in behaviour, neuronal structure, and histone H3K4 methylation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Increasing spatiotemporal resolution of the molecular study is an important future direction."
      explanation: >
        The authors identify insufficient spatiotemporal resolution as a
        limitation that a human developmental time course would address.

- discussion_id: wdts_episignature_interpretation
  kind: INTERPRETATION
  status: OPEN
  prompt: >
    How should a negative or intermediate KMT2A blood DNA methylation
    episignature be interpreted when phenotype and sequence evidence suggest
    WDSTS?
  attaches_to:
  - diagnosis#KMT2A DNA methylation episignature analysis
  rationale: >
    The discovery study showed clinical utility for variant classification, but
    independent evaluation found KMT2A sensitivity ranging from 70% to 100% at
    best with unstable performance and heterogeneous methylation profiles. The
    assay is useful as supporting functional evidence, yet its negative predictive
    value and handling of intermediate profiles remain insufficiently standardized
    for exclusionary use.
  evidence:
  - reference: PMID:35163737
    reference_title: "Clinical Utility of a Unique Genome-Wide DNA Methylation Signature for KMT2A-Related Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WDSTS episignature enabled classification of variants of uncertain significance in the KMT2A gene as well as confirmation of diagnosis in patients with clinical presentation of WDSTS without known genetic variants."

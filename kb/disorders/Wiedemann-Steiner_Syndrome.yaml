diagnosis:
- name: Molecular genetic testing
  description: >
    WDSTS is established in an individual with suggestive findings by identifying
    a heterozygous pathogenic variant in KMT2A. Because the phenotype overlaps
    other chromatinopathies and can be mild or atypical, clinical findings alone
    are not sufficient to establish the molecular diagnosis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: A heterozygous pathogenic KMT2A variant establishes the molecular diagnosis.
  evidence:
  - reference: PMID:35617449
    reference_title: "Wiedemann-Steiner Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of WSS is established in a proband with suggestive findings and a heterozygous pathogenic variant in KMT2A identified by molecular genetic testing."
    explanation: >
      GeneReviews states the molecular diagnostic criterion.

- name: KMT2A DNA methylation episignature analysis
  description: >
    A genome-wide blood DNA methylation episignature can provide functional
    evidence for classification of some KMT2A variants of uncertain significance
    or support diagnosis in clinically suggestive cases. This assay measures DNA
    methylation, not histone H3K4 methylation. Independent evaluation found
    KMT2A-signature sensitivity dependent on classifier settings and affected by
    heterogeneous or intermediate profiles, so a negative result does not exclude
    WDSTS and the assay does not replace sequence-based diagnosis.
  diagnosis_term:
    preferred_term: DNA methylation analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  results: >
    A concordant KMT2A episignature can support variant interpretation; an
    absent or intermediate signature is not exclusionary.
  evidence:
  - reference: PMID:35163737
    reference_title: "Clinical Utility of a Unique Genome-Wide DNA Methylation Signature for KMT2A-Related Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WDSTS episignature enabled classification of variants of uncertain significance in the KMT2A gene as well as confirmation of diagnosis in patients with clinical presentation of WDSTS without known genetic variants."
    explanation: >
      The discovery cohort demonstrates the intended variant-classification and
      diagnostic-support use.
  - reference: PMID:37872275
    reference_title: "Episignatures in practice: independent evaluation of published episignatures for the molecular diagnostics of ten neurodevelopmental disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Remaining Cornelia de Lange syndrome, KMT2A, KDM5C and CHD7 signatures reached 70–100% sensitivity at best with unstable performances, suffering from heterogeneous methylation profiles among cases and rare discordant samples."
    explanation: >
      Independent validation supports cautious use because sensitivity was
      unstable despite high specificity in the study framework.

differential_diagnoses:
- name: Overlapping chromatinopathies and syndromic intellectual disability disorders
  description: >
    The clinical differential includes Coffin-Siris, Nicolaides-Baraitser,
    Cornelia de Lange, Rubinstein-Taybi, Kabuki, Bohring-Opitz,
    Suleiman-El-Hattab, and blepharophimosis-ptosis-epicanthus inversus
    syndromes. Shared developmental delay, growth restriction, hypertrichosis,
    and craniofacial findings make phenotype alone insufficient in atypical
    cases.
  distinguishing_features:
  - Identification of a heterozygous pathogenic KMT2A variant establishes WDSTS.
  - Hypertrichosis cubiti is frequent but is neither required nor pathognomonic.
  - A concordant KMT2A DNA methylation episignature may support ambiguous variant interpretation but is not independently exclusionary.
  evidence:
  - reference: PMID:37025457
    reference_title: "Novel variants and phenotypic heterogeneity in a cohort of 11 Chinese children with Wiedemann-Steiner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the features of WSS are shared by a range of disorders"
    explanation: >
      The review explicitly frames these syndromes as overlapping clinical
      differentials.
  - reference: PMID:35617449
    reference_title: "Wiedemann-Steiner Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of WSS is established in a proband with suggestive findings and a heterozygous pathogenic variant in KMT2A identified by molecular genetic testing."
    explanation: >
      Molecular confirmation provides the decisive distinction from overlapping
      syndromic diagnoses.


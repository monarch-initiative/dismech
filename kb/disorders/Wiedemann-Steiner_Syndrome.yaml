    evidence_source: IN_VITRO
    snippet: "Haploinsufficiency of mixed-lineage leukemia (MLL/KMT2A) protein causes Wiedemann-Steiner syndrome (WSS), a neurodevelopmental disorder associated with microcephaly."
    explanation: >
      The mechanistic study identifies KMT2A haploinsufficiency as the upstream

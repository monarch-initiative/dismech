description: >
  Wiedemann-Steiner syndrome (WDSTS; OMIM 605130) is an autosomal dominant
  Mendelian disorder of the epigenetic machinery caused by heterozygous
  pathogenic variants in KMT2A. It is characterized by developmental delay,
  intellectual disability, characteristic facial features, hypertrichosis
  cubiti, growth restriction, and variably present neurologic, gastrointestinal,
  skeletal, cardiac, ophthalmologic, genitourinary, immune, and dental findings.
  Most molecularly confirmed cases result from a de novo variant, although rare
  familial transmission and parental mosaicism are documented.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >
    WDSTS is inherited in an autosomal dominant manner. Most affected
    individuals whose parents have undergone molecular testing have a de novo
    KMT2A pathogenic variant; rare affected parents and parental mosaicism have
    been reported. Each child of an affected individual has a 50% chance of
    inheriting the variant.
  evidence:
  - reference: PMID:35617449
    reference_title: "Wiedemann-Steiner Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most individuals diagnosed with WSS whose parents have undergone molecular genetic testing have the disorder as the result of a de novo pathogenic variant."
    explanation: >
      GeneReviews defines the autosomal dominant inheritance pattern and notes
      that most tested families represent de novo disease.
  - reference: PMID:29574747
    reference_title: "Wiedemann-Steiner syndrome as a major cause of syndromic intellectual disability: A study of 33 French cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed autosomal dominant transmission of WSS in 3 families and mosaicism in one family."
    explanation: >
      The French cohort documents both vertical transmission and mosaicism.

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: BELOW_1_IN_1000000
  notes: >
    A literature review estimated prevalence below one per million, but also
    emphasized likely underdiagnosis. This should be treated as a provisional
    rarity estimate rather than a measured population prevalence.
  evidence:
  - reference: PMID:37025457
    reference_title: "Novel variants and phenotypic heterogeneity in a cohort of 11 Chinese children with Wiedemann-Steiner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of WSS is estimated to be less than 1/1,000,000"
    explanation: >
      This review supplies the reported band while cautioning that cases are
      probably underdiagnosed.

progression:
- phase: Early development
  age_range: Infancy through childhood
  notes: >
    Developmental delay is usually apparent in early childhood. In the largest
    published cohort, median ages at first words and independent walking were
    18 and 20 months, respectively. Available summaries do not establish a
    uniform degenerative course or adequately define adult natural history.
  evidence:
  - reference: PMID:33783954
    reference_title: "Expanding the genotypic and phenotypic spectrum in a diverse cohort of 104 individuals with Wiedemann-Steiner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median ages at walking and first words were 20 months and 18 months, respectively."
    explanation: >
      The cohort provides directly observed developmental milestone timing.

mechanistic_hypotheses:
- hypothesis_group_id: centrosomal_branch
  hypothesis_label: Centrosomal microtubule-nucleation branch
  status: EMERGING
  description: >
    Proposes that loss of a non-nuclear KMT2A/MLL-WDR5 function at centrosomes
    contributes to neurodevelopmental manifestations through impaired recruitment
    of Cep72 and gamma-tubulin ring-complex proteins. The cellular phenotype is
    reported in WSS-derived cells, but its contribution to individual clinical
    manifestations has not been quantified.
  evidence:
  - reference: PMID:39661677
    reference_title: "MLL/WDR5 complex recruits centriolar satellite protein Cep72 to regulate microtubule nucleation and spindle formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss of the MLL/WDR5 complex affects microtubule nucleation and regrowth. MLL/WDR5 localize to the pericentriolar material and interact with centriolar satellite protein Cep72 and γ-tubulin ring complex proteins (γ-TuRCs)."
    explanation: >
      The study establishes the centrosomal cellular phenotype underlying this
      emerging mechanistic branch.
- hypothesis_group_id: mouse_neuronal_extrapolation
  hypothesis_label: H3K4-dependent neuronal and synaptic branch
  status: EMERGING
  description: >
    Proposes that KMT2A-dependent, locus-specific H3K4 methylation and
    transcriptional changes alter dendritic spine biology and contribute to the
    human neurodevelopmental phenotype. Evidence currently comes primarily from
    constitutive Kmt2a-heterozygous mice and therefore requires confirmation in
    human developmental neural models.
  evidence:
  - reference: PMID:32483278
    reference_title: "Mutually suppressive roles of KMT2A and KDM5C in behaviour, neuronal structure, and histone H3K4 methylation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Despite opposite enzymatic activities, the two mouse models deficient for either Kmt2a or Kdm5c shared reduced dendritic spines and increased aggression."
    explanation: >
      The Kmt2a-heterozygous mouse supplies the principal evidence for this
      neuronal branch.

pathophysiology:
- name: KMT2A Haploinsufficiency
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >
    The initiating lesion is reduced KMT2A function from a heterozygous
    pathogenic variant. KMT2A encodes an H3K4 methyltransferase, but the clinical
    allelic spectrum is not limited to experimentally proven loss-of-function
    variants; the causal statement is therefore kept at the gene-disease level.

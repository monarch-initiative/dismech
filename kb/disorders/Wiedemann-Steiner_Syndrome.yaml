genetic:
- name: KMT2A
  notes: >
    Heterozygous pathogenic KMT2A variants cause WDSTS. The allelic spectrum is
    highly heterogeneous: 69 of 82 variants in the 104-person cohort were novel.
    Most tested families represent de novo disease, but vertical autosomal
    dominant transmission and parental mosaicism occur. In that cohort,
    hypotonia was associated with loss-of-function variants and seizures with
    non-loss-of-function variants; the abstract does not support more granular
    variant-class percentages or a universal functional mechanism.
  gene_term:
    preferred_term: KMT2A
    term:
      id: hgnc:7132
      label: KMT2A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:33783954

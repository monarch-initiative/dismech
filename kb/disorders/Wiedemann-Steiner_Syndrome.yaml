    causal_link_type: DIRECT
    description: >
      Reduced activity of the H3K4 writer KMT2A can alter H3K4 methylation and
      transcription at selected loci; available mouse data do not show a simple
      global reduction in H3K4 methylation.
    hypothesis_groups:

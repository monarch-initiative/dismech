animal_models:
- species: Mus musculus
  genotype: Constitutive Kmt2a heterozygous (Kmt2a+/-) male mice
  category: Genetic disease model
  genes:
  - preferred_term: Kmt2a
    term:
      id: MGI:96995
      label: Kmt2a
  associated_phenotypes:
  - Reduced body weight
  - Reduced dendritic spine density
  - Increased aggression and social dominance
  description: >
    Constitutive Kmt2a-heterozygous male mice were studied as a WDSTS model in
    an F1 hybrid background. They showed reduced body weight, reduced dendritic
    spine density in basolateral amygdala neurons, and altered aggression/social
    dominance measures. They did not show deficits in the contextual fear or
    novel-object-recognition assays used in that study. Adult male brain tissue,
    mixed cell populations, and lifetime adaptation limit direct extrapolation to
    human developmental cognition.

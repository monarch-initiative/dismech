name: Vertebral, Cardiac, Tracheoesophageal, Renal, and Limb Defects
creation_date: '2026-10-23T00:00:00Z'
category: Mendelian
synonyms:
- VCTERL
- VCTERL syndrome
- WBP11-related disorder
- WBP11-related multiple congenital anomalies
description: >-
  Vertebral, cardiac, tracheoesophageal, renal, and limb defects (VCTERL;
  OMIM:619227) is an autosomal dominant multiple congenital anomaly syndrome
  caused by heterozygous loss-of-function variants in WBP11, which encodes a
  spliceosome-associated pre-mRNA splicing factor (also called SIPP1). It was
  delineated in 2020 in seven unrelated families whose overlapping
  malformations fall within the VACTERL association spectrum, and about
  twenty affected individuals, including several fetuses, have been reported
  since. Vertebral segmentation defects (often cervical fusion of Klippel-Feil
  type) are the most frequent postnatal finding, accompanied variably by
  craniofacial, cardiac, tracheoesophageal or gastrointestinal, renal, limb
  and Sprengel anomalies; developmental delay, microcephaly, short stature,
  hearing impairment and ocular anomalies occur in a minority. Penetrance is
  incomplete and expressivity is highly variable, extending from multi-system
  VACTERL-like presentations to an isolated vertebral anomaly. Haploinsufficiency
  is supported by a Wbp11 heterozygous null mouse with axial skeletal, renal and
  esophageal defects and by a wbp11 knockdown zebrafish with cardiac, spinal,
  fin and renal defects. Loss of WBP11 causes widespread intron retention and
  exon skipping, but which mis-spliced targets produce the malformations is not
  known and is recorded here as a knowledge gap.
disease_term:
  preferred_term: vertebral, cardiac, tracheoesophageal, renal, and limb defects
  term:
    id: MONDO:0030987
    label: vertebral, cardiac, tracheoesophageal, renal, and limb defects
parents:
- Multiple Congenital Anomalies Syndrome
- Spliceosomopathy
inheritance:
- name: Autosomal dominant
  description: >-
    Affected individuals are heterozygous for a single WBP11 variant. Variants
    arise de novo or are inherited from a parent, and inherited variants have
    been transmitted from clinically unaffected or mildly affected carriers.
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:33276377
    reference_title: Heterozygous loss of WBP11 function causes multiple congenital defects in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report novel heterozygous predicted loss-of-function (LoF) and
      predicted damaging missense variants in the WW domain binding protein 11
      (WBP11) gene in seven unrelated families with a variety of overlapping
      congenital malformations, including cardiac, vertebral,
      tracheo-esophageal, renal and limb defects.
    explanation: >-
      The defining cohort carries heterozygous variants in seven unrelated
      families, establishing a dominant (monoallelic) mode of inheritance.
  - reference: PMID:41975533
    reference_title: "Prenatal and postnatal manifestations of WBP11-related disorder in Chinese patients: expanding the phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three occurred de novo, while two were paternally inherited from
      clinically unaffected or mildly affected carriers, supporting incomplete
      penetrance.
    explanation: >-
      Documents both de novo and inherited heterozygous variants in an
      independent cohort.
- name: Incomplete penetrance
  description: >-
    Heterozygous carriers can be clinically unaffected or show only short
    stature, so a parent of an affected child may carry the variant without
    the malformations.
  inheritance_term:
    preferred_term: incomplete penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  evidence:
  - reference: PMID:41975533
    reference_title: "Prenatal and postnatal manifestations of WBP11-related disorder in Chinese patients: expanding the phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the fathers of Families 2 and 3 and the paternal grandmother in Family 3
      displayed no identified clinical abnormalities beyond short stature.
    explanation: >-
      Three heterozygous carriers across two families had no malformations,
      directly showing non-penetrance for the structural phenotype.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Sixteen individuals had been reported by early 2026 (one fetal case
    among them), to which the Chinese series added four fetuses and one
    child. These are reported cases, not a population estimate, so no
    rate_per_100000 is asserted.
  evidence:
  - reference: PMID:41975533
    reference_title: "Prenatal and postnatal manifestations of WBP11-related disorder in Chinese patients: expanding the phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, a total of 16 patients with WBP11 variants have been reported,
      with only one fetal case
    explanation: >-
      Literature case count, supporting an ultra-rare cases-in-literature
      record.
progression:
- phase: Prenatal
  age_range: Second-trimester anomaly scan through birth
  notes: >-
    Fetal presentations are dominated by cardiac and central nervous system
    malformations and growth restriction. Vertebral anomalies, the most common
    postnatal finding, have not been detected prenatally, possibly because
    they are not yet apparent at the routine anomaly scan.
  evidence:
  - reference: PMID:41975533
    reference_title: "Prenatal and postnatal manifestations of WBP11-related disorder in Chinese patients: expanding the phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, prenatal cases predominantly presented with cardiac
      malformations, whereas vertebral anomalies, common postnatally, were
      absent prenatally, suggesting age-dependent phenotypic evolution.
    explanation: >-
      Describes the prenatal phenotype and its difference from the postnatal
      one.
  - reference: PMID:41185117
    reference_title: A de novo WBP11 Pathogenic Variant in a Fetus With Cystic Brain Malformation and Growth Restriction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the first prenatal diagnosis of a de novo WBP11 variant in a
      fetus with growth restriction and structural brain anomalies.
    explanation: >-
      First reported prenatal case, with growth restriction and brain
      malformation.
- phase: Postnatal
  age_range: Birth onward
  notes: >-
    Postnatally the structural malformations are congenital and static;
    vertebral, craniofacial, cardiac and gastrointestinal anomalies are the
    most common. Developmental delay is present in a minority. No
    longitudinal natural-history data have been published.
  evidence:
  - reference: PMID:41975533
    reference_title: "Prenatal and postnatal manifestations of WBP11-related disorder in Chinese patients: expanding the phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      most patients exhibit vertebral deformities, often accompanied by
      craniofacial, cardiac (e.g., ventricular septal defects), or
      gastrointestinal abnormalities
    explanation: >-
      Summary of the postnatal phenotype across all reported cases.
pathophysiology:
- name: Heterozygous WBP11 Loss-of-Function Variants
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Reported alleles are predominantly nonsense, frameshift and canonical
    splice-site variants predicted to cause loss of function, with a smaller
    number of predicted damaging missense variants. They occur de novo or are
    inherited from mildly affected or unaffected carriers.
  genes:
  - preferred_term: WBP11
    term:
      id: hgnc:16461
      label: WBP11
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:33276377
    reference_title: Heterozygous loss of WBP11 function causes multiple congenital defects in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report novel heterozygous predicted loss-of-function (LoF) and
      predicted damaging missense variants in the WW domain binding protein 11
      (WBP11) gene in seven unrelated families with a variety of overlapping
      congenital malformations, including cardiac, vertebral,
      tracheo-esophageal, renal and limb defects.
    explanation: Defines the allelic class underlying the disorder.
  - reference: PMID:40089178
    reference_title: "Isolated congenital vertebral anomaly and Sprengel's deformity in a WBP11 pathogenic variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whole genome sequencing presented a de novo novel WBP11 heterozygous
      pathogenic variant, with frameshift resulting in a loss of function.
    explanation: An additional de novo truncating allele in an independent patient.
  downstream:
  - target: WBP11 Haploinsufficiency
    causal_link_type: DIRECT
    description: >-
      Truncating alleles are expected to remove one functional copy of WBP11,
      halving the available splicing factor. Direct measurement of WBP11
      protein in patient tissue has not been reported; the edge rests on the
      variant class and on the heterozygous null mouse.
    evidence:
    - reference: PMID:33276377
      reference_title: Heterozygous loss of WBP11 function causes multiple congenital defects in humans and mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Importantly, Wbp11 heterozygous null mice are small and exhibit defects
        in axial skeleton, kidneys and esophagus, similar to the affected
        individuals, supporting the role of WBP11 haploinsufficiency in the
        development of congenital malformations in humans.
      explanation: >-
        Haploinsufficiency is inferred from a heterozygous null mouse rather
        than measured in patients.
- name: WBP11 Haploinsufficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Reduced WBP11 dosage. WBP11 is a nuclear-speckle and spliceosome component
    that activates pre-mRNA splicing and also binds protein phosphatase 1.
    Complete loss is incompatible with development (Wbp11 null mouse embryos
    die before E8.5), while heterozygous loss reduces viability and causes
    malformations.
  genes:
  - preferred_term: WBP11
    term:
      id: hgnc:16461
      label: WBP11
  molecular_functions:
  - preferred_term: protein phosphatase 1 binding
    term:
      id: GO:0008157
      label: protein phosphatase 1 binding
    modifier: DECREASED
  cellular_components:
  - preferred_term: spliceosomal complex
    term:
      id: GO:0005681
      label: spliceosomal complex
  evidence:
  - reference: PMID:33276377
    reference_title: Heterozygous loss of WBP11 function causes multiple congenital defects in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WBP11 encodes a component of the spliceosome with the ability to activate
      pre-messenger RNA splicing.
    explanation: Establishes the molecular role of the dosage-sensitive protein.
  - reference: PMID:14640981
    reference_title: SIPP1, a novel pre-mRNA splicing factor and interactor of protein phosphatase-1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, we found that SIPP1 is also a component of the spliceosomes and
      that a SIPP1-fragment inhibits splicing catalysis by nuclear extracts
      independent of its ability to interact with PP1.
    explanation: >-
      Biochemical evidence that WBP11 (SIPP1) is a spliceosome component
      that acts on splicing catalysis.
  - reference: PMID:33276377
    reference_title: Heterozygous loss of WBP11 function causes multiple congenital defects in humans and mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Wbp11 homozygous null embryos die prior to E8.5, indicating that Wbp11 is
      essential for development.
    explanation: >-
      Complete loss is early embryonic lethal, consistent with a
      dosage-sensitive essential gene.
  - reference: PMID:14640981
    reference_title: SIPP1, a novel pre-mRNA splicing factor and interactor of protein phosphatase-1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Two-hybrid and co-sedimentation analysis revealed that SIPP1 has two
      distinct PP1-binding domains
    explanation: >-
      Supports the protein phosphatase 1 binding activity bound on this node.
      GO has no more specific molecular-function term for WBP11's
      splicing-activating role, so the binding activity is the one bound.
  downstream:
  - target: Pre-mRNA Splicing Defects
    causal_link_type: DIRECT
    description: >-
      Reduced WBP11 impairs spliceosome function, producing intron retention
      and exon skipping across many transcripts.
    evidence:
    - reference: PMID:31874114
      reference_title: WBP11 is required for splicing the TUBGCP6 pre-mRNA to promote centriole duplication.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        Loss of WBP11 results in the retention of ∼200 introns, including
        multiple introns in TUBGCP6, a central component of the γ-TuRC.
      explanation: >-
        WBP11 depletion in cultured human cells causes widespread intron
        retention; this is depletion rather than the heterozygous state of
        patients.
    - reference: PMID:42625817
      reference_title: "Loss of wbp11 causes multi-system developmental defects: a zebrafish model of VACTERL association."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This analysis identified widespread alternative splicing events,
        including intron retention and exon skipping, upon wbp11 knockdown
      explanation: >-
        In vivo evidence that wbp11 loss causes broad splicing aberrations in
        the developing embryo.
- name: Pre-mRNA Splicing Defects
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Loss of WBP11 causes retention of roughly 200 introns in human cells and
    widespread intron retention and exon skipping in zebrafish embryos. The
    affected transcripts include genes for cardiac function, angiogenesis,
    skeletal patterning, fin and kidney development. Which mis-spliced targets
    drive which malformations is not established.
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: DECREASED
  evidence:
  - reference: PMID:42625817
    reference_title: "Loss of wbp11 causes multi-system developmental defects: a zebrafish model of VACTERL association."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Transcriptomic and alternative splicing analyses revealed significant
      dysregulation of genes associated with cardiac function, angiogenesis,
      skeletal patterning, fin development, and kidney development,
      accompanied by widespread splicing aberrations.
    explanation: >-
      Links wbp11-dependent splicing to developmental gene programs in the
      organs affected in patients.
  downstream:
  - target: Impaired Centriole Duplication
    causal_link_type: DIRECT
    description: >-
      Mis-splicing of TUBGCP6, a core gamma-tubulin ring complex component,
      lowers TUBGCP6 protein and impairs centriole duplication.
    evidence:
    - reference: PMID:31874114
      reference_title: WBP11 is required for splicing the TUBGCP6 pre-mRNA to promote centriole duplication.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        WBP11 depletion causes centriole duplication defects, in part by
        causing a rapid decline in the level of TUBGCP6.
      explanation: >-
        Directly connects WBP11-dependent splicing of TUBGCP6 to centriole
        duplication in human cells.
  - target: Disrupted Multi-Organ Embryonic Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Splicing defects in developmental gene programs are proposed to disturb
      morphogenesis of the axial skeleton, heart, foregut, kidney and limbs.
      The specific causal targets are unknown.
    evidence:
    - reference: PMID:42625817
      reference_title: "Loss of wbp11 causes multi-system developmental defects: a zebrafish model of VACTERL association."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Transcriptomic and alternative splicing analyses revealed significant
        dysregulation of genes associated with cardiac function, angiogenesis,
        skeletal patterning, fin development, and kidney development,
        accompanied by widespread splicing aberrations.
      explanation: >-
        The co-occurrence of mis-splicing and dysregulated developmental gene
        programs supports, but does not prove, the link to malformation.
- name: Impaired Centriole Duplication
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    WBP11 is required for centriole duplication through correct splicing of
    TUBGCP6. Centriole defects are linked to microcephaly and growth
    restriction in other spliceosomopathies and may contribute to those
    features here. This has been shown in cultured cells, not in patient
    tissue.
  genes:
  - preferred_term: TUBGCP6
    term:
      id: hgnc:18127
      label: TUBGCP6
  biological_processes:
  - preferred_term: centriole replication
    term:
      id: GO:0007099
      label: centriole replication
    modifier: DECREASED
  evidence:
  - reference: PMID:31874114
    reference_title: WBP11 is required for splicing the TUBGCP6 pre-mRNA to promote centriole duplication.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      WBP11 depletion causes centriole duplication defects, in part by causing
      a rapid decline in the level of TUBGCP6.
    explanation: Establishes the cellular defect downstream of WBP11 loss.
  downstream:
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed link from centriole duplication failure to reduced brain growth,
      by analogy with other spliceosome disorders; not tested for WBP11.
    evidence:
    - reference: PMID:31874114
      reference_title: WBP11 is required for splicing the TUBGCP6 pre-mRNA to promote centriole duplication.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: BACKGROUND
      snippet: >-
        This may have clinical implications because mutations in some
        spliceosome proteins cause microcephaly and/or growth retardation,
        phenotypes that are strongly linked to centriole defects.
      explanation: >-
        The authors propose the centriole-microcephaly link as a hypothesis;
        it is not shown for WBP11 patients.
- name: Disrupted Multi-Organ Embryonic Morphogenesis
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Abnormal development of the axial skeleton, heart, tracheoesophageal
    foregut, kidney and limbs, producing the VACTERL-spectrum malformations.
    Heterozygous null mice show axial skeletal, renal and esophageal defects but
    no cardiac defects; morphant zebrafish show cardiac, vascular, notochord,
    fin and renal-marker defects.
  biological_processes:

discussions:
- discussion_id: vcterl_mis_spliced_targets
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Pre-mRNA Splicing Defects
  - pathophysiology#Disrupted Multi-Organ Embryonic Morphogenesis
  prompt: >-
    Which WBP11-dependent splicing events cause the vertebral, cardiac,
    foregut, renal and limb malformations?
  rationale: >-
    WBP11 loss mis-splices many transcripts, but no specific target has been
    linked to a malformation. Ciliogenesis genes have been proposed because
    WBP11 is needed for centriole duplication and primary cilia carry
    Hedgehog and Wnt signals implicated in VACTERL association.
  evidence:
  - reference: PMID:41975533
    reference_title: "Prenatal and postnatal manifestations of WBP11-related disorder in Chinese patients: expanding the phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Future work should focus on identifying which key ciliogenesis-related
      genes are mis-spliced due to WBP11 deficiency, thereby elucidating its
      molecular pathogenic mechanism.
    explanation: The authors state the open question.
- discussion_id: vcterl_mouse_lacks_cardiac_defects
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Wbp11 heterozygous null mouse
  prompt: >-
    Why does the Wbp11 heterozygous null mouse lack the cardiac defects seen
    in about half of patients, while zebrafish knockdown reproduces them?
  rationale: >-
    The mouse carries the patient genotype but misses a major human feature,
    while the zebrafish shows it under a transient knockdown that is not the
    patient genotype. Species differences in dosage sensitivity, genetic
    background, or knockdown depth could explain the difference.

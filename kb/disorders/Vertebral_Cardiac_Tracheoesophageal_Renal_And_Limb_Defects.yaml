genetic:
- name: WBP11
  gene_term:
    preferred_term: WBP11
    term:
      id: hgnc:16461
      label: WBP11
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Heterozygous loss-of-function variants in WBP11 cause this disorder,
    identified in seven unrelated families in the defining report and in
    further independent patients since, with supporting heterozygous null mouse
    and zebrafish knockdown models. Not every heterozygous carrier is affected.
  notes: >-
    No ClinGen gene-disease validity classification for WBP11 is cached in
    this repository, so gene_disease_validity is left absent.
  evidence:
  - reference: PMID:33276377
    reference_title: Heterozygous loss of WBP11 function causes multiple congenital defects in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report novel heterozygous predicted loss-of-function (LoF) and
      predicted damaging missense variants in the WW domain binding protein 11
      (WBP11) gene in seven unrelated families with a variety of overlapping
      congenital malformations, including cardiac, vertebral,
      tracheo-esophageal, renal and limb defects.
    explanation: The defining gene-disease report.
  - reference: PMID:41975533
    reference_title: "Prenatal and postnatal manifestations of WBP11-related disorder in Chinese patients: expanding the phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three occurred de novo, while two were paternally inherited from
      clinically unaffected or mildly affected carriers, supporting incomplete
      penetrance.
    explanation: Independent replication in five further families.
  variants:
  - name: WBP11 NM_016312.3:c.1310-1G>A
    description: >-
      Canonical acceptor splice-site variant found in a fetus with isolated
      femoral shortening. RNA from amniocytes showed only 4% aberrant splicing
      (c.1310del, p.Gly437Glufs*6), so this canonical splice-site variant
      retains most normal splicing and should not be classified pathogenic on
      sequence grounds alone.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:41975533
      reference_title: "Prenatal and postnatal manifestations of WBP11-related disorder in Chinese patients: expanding the phenotypic and mutational spectrum."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Crucially, RNA analysis of amniocytes carrying the c.1310-1G > A
        variant revealed only 4% aberrant splicing (c.1310del,
        p.Gly437Glufs*6), explaining the mild fetal phenotype of isolated
        femoral shortening
      explanation: >-
        Transcript analysis shows the variant is largely tolerated, a caution
        for prenatal interpretation of canonical splice-site variants.
animal_models:
- name: Wbp11 heterozygous null mouse
  species: Mouse
  genotype: Wbp11 +/- (CRISPR-Cas9 null allele)
  publication: PMID:33276377
  description: >-
    CRISPR-Cas9 null allele. Homozygous embryos die before E8.5. Heterozygotes
    are under-represented because of embryonic and postnatal death, are small,
    and have axial skeletal, renal and esophageal defects; cardiac defects are
    not reported.
  modeled_mechanisms:
  - target: Disrupted Multi-Organ Embryonic Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The heterozygous null mouse reproduces the axial skeletal, renal and
      esophageal malformations of the human disorder.
    limitations: >-
      The heterozygous mouse lacks the cardiac defects seen in patients, so it
      models only part of the malformation spectrum.
    evidence:
    - reference: PMID:33276377
      reference_title: Heterozygous loss of WBP11 function causes multiple congenital defects in humans and mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Importantly, Wbp11 heterozygous null mice are small and exhibit defects
        in axial skeleton, kidneys and esophagus, similar to the affected
        individuals, supporting the role of WBP11 haploinsufficiency in the
        development of congenital malformations in humans.
      explanation: The model shows the organ-level malformations with the patient genotype.
    - reference: PMID:42625817
      reference_title: "Loss of wbp11 causes multi-system developmental defects: a zebrafish model of VACTERL association."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        existing heterozygous Wbp11 knockout mice recapitulate only a subset of
        the patient phenotypes, most notably lacking the cardiac defects
      explanation: States the main limitation of the mouse model.
- name: wbp11 morpholino knockdown zebrafish
  species: Zebrafish
  genotype: wbp11 translation-blocking morpholino knockdown
  publication: PMID:42625817
  description: >-
    Translation-blocking morpholino knockdown, validated by Western blot and
    rescued by wbp11 mRNA co-injection. About 70% of morphants are malformed,
    with cardiac, vascular, notochord and spinal, fin and kidney-marker
    defects and widespread mis-splicing.
  modeled_mechanisms:
  - target: Disrupted Multi-Organ Embryonic Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Morphants show multi-system defects, including the cardiac component
      absent from the mouse.
    limitations: >-
      Morpholino knockdown is a transient reduction rather than a heterozygous
      null genotype, can have off-target effects, and fin hypoplasia is only an
      analogue of mammalian limb defects. The authors describe the model as
      partially recapitulating the human disorder.
    evidence:
    - reference: PMID:42625817
      reference_title: "Loss of wbp11 causes multi-system developmental defects: a zebrafish model of VACTERL association."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        wbp11-MO injection reduced Wbp11 protein levels, induced a 70% overall
        malformation rate, and caused a general delay in embryonic development.
      explanation: Shows knockdown efficacy and the malformation rate.
    - reference: PMID:42625817
      reference_title: "Loss of wbp11 causes multi-system developmental defects: a zebrafish model of VACTERL association."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        co-injection of wbp11 mRNA significantly decreased the proportion of
        severely affected embryos and increased the proportion of phenotypically
        normal embryos, thereby demonstrating effective phenotypic rescue
      explanation: Rescue supports specificity of the knockdown phenotype.
  - target: Pre-mRNA Splicing Defects
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: RNA-seq and rMATS analysis of morphants show intron retention and exon skipping.
    evidence:
    - reference: PMID:42625817
      reference_title: "Loss of wbp11 causes multi-system developmental defects: a zebrafish model of VACTERL association."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This analysis identified widespread alternative splicing events,
        including intron retention and exon skipping, upon wbp11 knockdown
      explanation: Direct measurement of mis-splicing in the model.
differential_diagnoses:
- name: VACTERL association
  description: >-
    VACTERL association is usually sporadic and of unknown cause. WBP11 is one
    of few single genes linked to it, and a WBP11 variant should be considered
    in VACTERL association as well as in isolated Klippel-Feil syndrome, renal
    agenesis or esophageal atresia.
  evidence:
  - reference: PMID:33276377
    reference_title: Heterozygous loss of WBP11 function causes multiple congenital defects in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LoF WBP11 variants should be considered as a possible cause of VACTERL
      association as well as isolated Klippel-Feil syndrome, renal agenesis or
      esophageal atresia.
    explanation: Places WBP11 testing within the VACTERL differential.
  - reference: PMID:23165726
    reference_title: "Clinical geneticists' views of VACTERL/VATER association."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      VACTERL association (sometimes termed "VATER association" depending on
      which component features are included) is typically defined by the
      presence of at least three of the following congenital malformations
    explanation: >-
      The clinical definition of VACTERL association (three or more component
      malformations), against which WBP11 cases are compared; some WBP11
      cases present with a single component.
- name: WBP4-related neurodevelopmental disorder
  description: >-
    Biallelic WBP4 loss, another spliceosome gene, causes a recessive
    neurodevelopmental syndrome that can include a VACTERL-like presentation.
    In WBP11 disease inheritance is dominant and the phenotype is dominated by
    structural malformations rather than intellectual disability.
  evidence:
  - reference: PMID:37963460
    reference_title: Bi-allelic loss-of-function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical manifestations included hypotonia, global developmental delay,
      severe intellectual disability, brain abnormalities, musculoskeletal,
      and gastrointestinal abnormalities.
    explanation: >-
      WBP4 disease is defined by neurodevelopmental features, including severe
      intellectual disability, in contrast to the malformation-dominated WBP11
      phenotype.
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results support the conclusion of Martin et al 202032 that loss-of
      function WBP11 and WBP4 variants should be considered as a possible
      cause of VACTERL association.
    explanation: >-
      Documents the overlapping VACTERL presentation that makes WBP4 disease
      a differential for WBP11 disease.

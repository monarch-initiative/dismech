  downstream:
  - target: Vertebral segmentation defects
    causal_link_type: DIRECT
    description: Abnormal axial skeletal development produces vertebral segmentation and fusion anomalies.
    evidence:
    - reference: PMID:33276377
      reference_title: Heterozygous loss of WBP11 function causes multiple congenital defects in humans and mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Importantly, Wbp11 heterozygous null mice are small and exhibit defects

    modifier: ABNORMAL
  - preferred_term: heart development
    term:
      id: GO:0007507
      label: heart development
    modifier: ABNORMAL
  - preferred_term: kidney development
    term:
      id: GO:0001822
      label: kidney development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33276377
    reference_title: Heterozygous loss of WBP11 function causes multiple congenital defects in humans and mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Importantly, Wbp11 heterozygous null mice are small and exhibit defects
      in axial skeleton, kidneys and esophagus, similar to the affected
      individuals, supporting the role of WBP11 haploinsufficiency in the
      development of congenital malformations in humans.
    explanation: >-
      The heterozygous mouse reproduces skeletal, renal and esophageal

- name: Impaired noncanonical mitochondrial RNA processing
  description: Cleavage at the CO1 5-prime end and ATP8/6-CO3 junction is severely impaired in patient fibroblasts. Precursors accumulate and mature CO1 and CO3 decline. Mature CYB remains available with residual FASTKD5 function; complete knockout also disrupts ND5-CYB processing. CO3 can still be translated from the tricistronic precursor, so impaired processing does not imply loss of every encoded protein.

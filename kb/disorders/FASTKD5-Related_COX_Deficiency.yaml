    reference: PMID:40637235
    reference_title: FASTKD5 processes mitochondrial pre-mRNAs at noncanonical cleavage sites.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The translation of CO3 was, however, not affected in the KO cells, although the level of the mature CO3 mRNA was virtually undetectable by Northern blot. This directly demonstrates that CO3 encoded by a tricistronic mRNA (ATP8/6-CO3) can be synthesized by the mitochondrial ribosome as has been suggested previously [35].
    explanation: 'Unprocessed RNA is not uniformly untranslatable: CO3 translation persists.'

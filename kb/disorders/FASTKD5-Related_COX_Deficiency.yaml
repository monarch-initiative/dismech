      reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Stable expres- sion of FLAG-tagged FASTKD5 protein (to 1.6 and 4.2 times of endogenous control FASTKD5 levels in subjects 1 and 2, respectively; Figures 2A and 2B) resulted in the rescue of MT-CO1 and MT-CO3 processing (Figures 2E and 3), an increase in the translation of the MT-CO1 poly- peptide (Figure 2F), rescue of the steady-state level of the MT-CO1 protein (Figures 2A and 2B), and concomitant rescue of COX assembly (Figure 2C) and enzymatic activ- ity (Figure 2D).
      explanation: Wild-type complementation rescues RNA processing, CO1 translation, complex IV assembly and activity in patient cells.
- name: Loss of FASTKD5 processing function
  description: The patient p.Arg404Cys and p.Leu634Pro proteins fail to restore CO1 expression or COX activity despite wild-type-comparable expression. Recombinant experiments establish intrinsic FASTKD5 endonuclease activity. Engineered D429N impairs cleavage while retaining RNA binding; it is a mechanistic probe, not a reported patient allele.

treatments:
- name: Multidisciplinary supportive care
  description: Care is directed to neurological, feeding, respiratory, visual, cardiac and developmental complications. General Leigh syndrome spectrum recommendations provide a framework; no disease-modifying treatment was established by the three-case study.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Supportive care to improve quality of life, maximize function, and reduce complications is recommended.
    explanation: General LSS supportive-care guidance.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Feeding support and gastrostomy
  description: Swallowing assessment, nutritional support and gastrostomy may be needed. Both childhood cases received gastrostomy; aspiration risk warrants assessment.
  evidence:
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At the age of 14.5 months, the subject received a percutaneous endoscopic gastrostomy tube due to dysphagia.
    explanation: Gastrostomy was used for subject 1 dysphagia.
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: he developed a failure to thrive and had gastrostomy tube placement at 11 months of age.
    explanation: Subject 3 also required feeding support.
- name: Respiratory support
  description: Provide respiratory assessment and ventilatory support during compromise. Both the severe child and adult case required mechanical airway support during acute complications.
  evidence:
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: His final hospital admission followed a rhinovirus infection leading to acute respi- ratory failure that required mechanical ventilation.
    explanation: Subject 1 required mechanical ventilation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Ventilatory support for persons w/LSS ... respiratory compromise
    explanation: General LSS care supports ventilation when respiratory compromise is present.
- name: Management of metabolic acidosis
  description: Specialist-directed correction of significant acidosis follows general LSS guidance. IV acetate and enteral sodium citrate/citric acid did not correct acidosis in subject 1; reported use does not establish efficacy for FASTKD5 deficiency.
  evidence:
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Supplemental alkali from acetate administered intravenously (i.v.) or enteral sodium citrate/citric acid did not shift the lactate concentration or correct the acidosis.
    explanation: Alkali therapy failed to correct subject 1 acidosis.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sodium bicarbonate or sodium citrate for significant acidosis
    explanation: General LSS management recommendation.
- name: Symptomatic movement-disorder treatment
  description: The adult case received a dopamine agonist. Parkinsonism later resolved, but concurrent therapies and the uncontrolled course prevent attribution to a specific drug. Dystonia management should be individualized.
  evidence:
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: She was treated with a dopamine agonist and idebenone.
    explanation: The adult patient received symptomatic dopaminergic treatment.
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the subject was breathing spontaneously and had no com- plaints of dysphagia, and parkinsonism had resolved.
    explanation: The adult course showed later improvement without a controlled efficacy assessment.
- name: Treatment of gastrointestinal dysmotility
  description: Prokinetic treatment was used for adult gastroparesis after an aspiration complication; monitor nutritional intake and swallowing safety.
  evidence:
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After 1 month, she was readmitted due to gastroparesis with aspi- ration pneumonia, which temporarily required orotracheal intu- bation. Prokinetic therapy was started.
    explanation: Reported symptomatic treatment of gastroparesis.
- name: Empiric mitochondrial supplements
  description: Riboflavin and coenzyme Q10 were given initially to subject 2, and idebenone later. The report does not establish FASTKD5-specific efficacy of these agents.
  evidence:
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At this point, i.v. immunoglobulin, i.v. steroids, and a mitochon- drial cocktail (100 mg/day riboflavin and 600 mg/day CoQ10) were administered.
    explanation: The adult case received multiple empiric therapies.
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: She was treated with a dopamine agonist and idebenone.
    explanation: Idebenone was another reported intervention; benefit cannot be separated from other treatment or natural fluctuation.
- name: Empiric immunotherapy during initial adult evaluation
  description: IV immunoglobulin and corticosteroids were administered during the initial adult presentation. They are reported historical interventions, without evidence of disease-modifying efficacy for the genetic RNA-processing disorder.
  evidence:
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At this point, i.v. immunoglobulin, i.v. steroids, and a mitochon- drial cocktail (100 mg/day riboflavin and 600 mg/day CoQ10) were administered.
    explanation: Records the empiric interventions without recommending them for FASTKD5 deficiency.
- name: Developmental, visual and cardiac follow-up
  description: Provide physical and occupational therapy, communication support, ophthalmologic care and cardiology follow-up according to manifestations. General LSS surveillance includes regular neurological, eye, hearing and cardiac assessment.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neurologic, ophthalmologic, audiologic, and cardiologic evaluations are recommended
    explanation: General LSS surveillance framework.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Equipment to prevent falling, maintain independent mobility as appropriate
    explanation: Rehabilitation aims to preserve safe function.
- name: Perioperative and metabolic precautions
  description: General mitochondrial-disease guidance recommends limiting fasting and catabolism, assessing anesthetic respiratory risk, avoiding lactate-containing fluids when acidosis is a risk, and avoiding valproate when possible. The absolute POLG-specific valproate contraindication is not a FASTKD5-specific finding.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Catabolism should be prevented by minimizing preoperative fasting
    explanation: General LSS perioperative recommendation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sodium valproate should be avoided if possible, because of its inhibitory effect on respiratory chain enzymes.
    explanation: General LSS medication caution.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Avoid lactate-containing agents (e.g., Ringer's lactate) in those at risk of lactic acidosis
    explanation: General LSS guidance addresses patients at risk of lactic acidosis.
- name: Genetic counseling and reproductive options
  description: For confirmed autosomal recessive disease with both parents carrying a familial variant, recurrence risk is 25% per pregnancy. Offer segregation/carrier testing and discuss prenatal or preimplantation testing once the familial variants are established.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic ... carrier ... and a 25% chance of being unaffected and not a carrier.
    explanation: The general recessive LSS counseling model applies to established biallelic FASTKD5 disease.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Once the LSS-related ... have been identified in an affected family member, prenatal and ... preimplantation genetic testing ... are possible.
    explanation: General LSS guidance permits prenatal and preimplantation testing after familial variants are identified.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Experimental FASTKD5 complementation and protein stabilization concept
  description: Wild-type gene complementation rescues patient fibroblast defects. Overexpressed p.Tyr125Cys partly restores COX activity, motivating a proposal to stabilize that protein. No stabilizing compound or clinical gene therapy was tested in this report.
  evidence:
  - *id007
  - *id026
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Stabilizing this variant could poten- tially ameliorate the clinical phenotype in this subject.
    explanation: Protein stabilization is a proposed strategy, not a demonstrated treatment.
inheritance:
- *id027
diagnosis:
- name: Molecular diagnosis and family segregation
  description: Identify biallelic FASTKD5 variants by genomic testing and establish phase. The clinical series used exome sequencing; general Leigh syndrome spectrum guidance favors genome sequencing when available to assess both nuclear and mitochondrial causes.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:40499538
    reference_title: Bi-allelic mutations in FASTKD5 are associated with cytochrome c oxidase deficiency and early- to late-onset Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using exome sequencing, we identified compound heterozygous variants of unknown significance in FASTKD5
    explanation: Exome sequencing identified the candidate variants in the founding series.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genome sequencing is preferred (if available), as it allows analysis of the mitochondrial and nuclear genome, and typically has the highest diagnostic rate.
    explanation: General LSS diagnostic guidance; the chapter does not contain a FASTKD5-specific section.
- name: Brain MRI and magnetic resonance spectroscopy
  description: Evaluate characteristic brainstem and basal ganglia lesions and possible thalamic involvement. MRS may show a lactate peak. These findings support Leigh syndrome spectrum but do not identify the causal gene.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - *id020
  - *id021
  - *id028
- name: Respiratory-chain enzyme and muscle evaluation
  description: Enzymology can support variant interpretation. Subject 2 had COX-deficient muscle histochemistry; subject 3 had normal routine pathology but severe complex IV enzymatic deficiency and abnormal combined assays. An isolated complex IV pattern is not a required finding in every tissue.
  evidence:
  - *id024
- name: Functional RNA processing and complementation studies
  description: Northern blotting or RNA sequencing, CO1 protein/translation assays and wild-type complementation can substantiate pathogenicity of uncertain variants. These are specialized cellular investigations, not established population screening assays.
  evidence:
  - *id004
  - *id007
histopathology:
- name: Variable skeletal muscle pathology
  description: Adult subject 2 had diffuse COX deficiency, small fibers and mild connective-tissue/inflammatory changes with multiple mtDNA deletions. Subject 3 had no significant routine pathologic abnormality and normal mtDNA content/sequence despite deficient enzymology; neither mtDNA depletion nor abnormal muscle histology is universal.
  evidence:
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Muscle biopsy revealed modest myopathic changes, including diffuse cytochrome c oxidase (COX) defi- ciency, hypo-atrophic fibers, rare sandwich-type fibers, rare chronic inflammatory lymphomonocytes, and a slight increase in endomysial and perimysial connective tissue, ... deletions in mtDNA.
    explanation: Subject 2 muscle had COX-deficient myopathic changes.
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: age and showed no significant pathologic abnormalities with normal mitochondrial DNA content and sequencing.
    explanation: Subject 3 routine muscle evaluation was normal.
experimental_models:
- name: Patient-derived immortalized fibroblasts
  experimental_model_type: CELL_LINE
  description: Fibroblasts from subjects 1 and 2 support RNA, protein, assembly and complementation experiments. Subject 3 muscle data are distinct. Residual FASTKD5 function preserves mature CYB and complex III assembly in the tested patient lines.
  publication: PMID:40499538
  evidence:
  - *id029
  - *id004
  - *id007
  - *id026
  modeled_mechanisms:
  - target: Reduced FASTKD5 protein abundance
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Cellular findings do not establish tissue-specific injury or clinical treatment efficacy.
  - target: Impaired noncanonical mitochondrial RNA processing
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Cellular findings do not establish tissue-specific injury or clinical treatment efficacy.
  - target: Reduced complex IV assembly
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Cellular findings do not establish tissue-specific injury or clinical treatment efficacy.
- name: FASTKD5-disrupted HAP1 cells
  experimental_model_type: CELL_LINE
  description: Single and double FASTK-family disruption models reveal CO1 translation and respiration defects. The later 2025 study found residual FASTKD5 in the HAP1 system; these lines should not be equated with complete-null 143B or HEK293T cells. CO3 translation effects differ across cellular contexts.
  publication: PMID:34748562
  evidence:
  - *id009
  - reference: PMID:40637235
    reference_title: FASTKD5 processes mitochondrial pre-mRNAs at noncanonical cleavage sites.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, in that study KO cells retained residual FASTKD5 protein, which could partially compensate for processing defects.
    explanation: The later paper explains why the HAP1 disruption model is not equivalent to complete loss.
  modeled_mechanisms:
  - target: Reduced CO1 translation
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Cellular findings do not establish tissue-specific injury or clinical treatment efficacy.
  - target: Impaired mitochondrial respiration
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Cellular findings do not establish tissue-specific injury or clinical treatment efficacy.
- name: Complete FASTKD5 knockout in 143B and HEK293T cells
  experimental_model_type: CELL_LINE
  description: True knockout models show failure of all three noncanonical RNA-processing events, reduced CO1 and CYB translation, loss of complexes III and IV and secondary complex I loss. Uridine supports culture of respiratory-deficient cells; this does not establish uridine therapy in patients.
  publication: PMID:40637235
  evidence:
  - *id006
  - *id011
  - *id030
  modeled_mechanisms:
  - target: Impaired noncanonical mitochondrial RNA processing
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Cellular findings do not establish tissue-specific injury or clinical treatment efficacy.
  - target: Reduced CYB translation in complete-knockout cells
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Cellular findings do not establish tissue-specific injury or clinical treatment efficacy.
  - target: Reduced complex III assembly in complete-knockout cells
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Cellular findings do not establish tissue-specific injury or clinical treatment efficacy.
- name: Reconstituted recombinant FASTKD5 cleavage assay
  experimental_model_type: OTHER
  description: Purified wild-type and engineered D429N proteins distinguish intrinsic endonuclease activity from RNA binding. CCA and upstream RNA structural features contribute to substrate recognition, but a complete substrate-bound structure and the role of auxiliary factors remain unresolved.
  publication: PMID:40637235
  evidence:
  - *id003
  - reference: PMID:40637235
    reference_title: FASTKD5 processes mitochondrial pre-mRNAs at noncanonical cleavage sites.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the D429N variant showed markedly diminished processing activity for all three noncanonical transcripts.
    explanation: The engineered mutant is a cleavage-defective mechanistic control.
  - reference: PMID:40637235
    reference_title: FASTKD5 processes mitochondrial pre-mRNAs at noncanonical cleavage sites.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These data imply that the CCA motif in the CO1 and CYB pre-mRNAs is important but not sufficient for FASTKD5 recognition of the cleavage site.
    explanation: Sequence recognition contributes to the assay mechanism without establishing the full recognition structure.

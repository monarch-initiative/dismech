      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: the accumulation of unprocessed 5 ′ end MT-CO1, MT-ATP8/6-CO3, and MT-ND5-CYB transcripts, with a lack of mature MT-CO1 and MT-CO3 (Figure 2E), but normal levels of mature MT-CYB, suggesting that residual activity of the FASTKD5 variants in the subjects’ fibro- blasts was sufficient to process MT-ND5-CYB pre-mRNA, resembling the situation in FASTKD5 knockdown cells.
      explanation: Processing defects preferentially deplete mature CO1 and CO3; residual function preserves mature CYB in patient fibroblasts.

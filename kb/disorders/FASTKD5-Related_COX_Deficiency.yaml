    name: Autosomal recessive
    evidence:
    - reference: PMID:40499538
      reference_title: Bi-allelic mutations in FASTKD5 are associated with cytochrome c oxidase deficiency and early- to late-onset Leigh syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: compound heterozygous variants of unknown significance in FASTKD5
      explanation: The clinical series identified biallelic variants, with functional studies supporting disease causality.
  features: The founding series contains three missense and two frameshift alleles in three unrelated compound heterozygous subjects. Protein instability and impaired processing function are distinct mechanisms. The shared p.Tyr125Cys allele retains function; residual activity in cultured cells is not a validated individual prognostic test. Subject 2 additionally has a maternally inherited 1q21.1 deletion, which may contribute to dysmorphism and is not a FASTKD5 structural variant.

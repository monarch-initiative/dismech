    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Immunoblot analysis of fibroblasts showed decreased steady-state levels of FASTKD5 protein in two subjects for whom fibroblast cultures were available: 24% of con- trols in subject 1 and 45% of controls in subject 2 (Figures 2A and 2B),'
    explanation: Patient fibroblasts from subjects 1 and 2 have reduced FASTKD5 protein abundance.
  - &id026

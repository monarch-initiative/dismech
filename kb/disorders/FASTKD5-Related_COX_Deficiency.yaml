    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725001880-mmc2.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The p.Tyr125Cys FASTKD5 protein was unstable, as it was ex- pressed at levels significantly lower than the WT protein in fibroblasts from both the subjects and control individ- uals (Figure 4A). However, expression of this variant was able to double the COX activity in subject 2 (from 32% to 66%), confirming that the effect of the variant p. Tyr125Cys is hypomorphic due to the reduced stability of the protein (Figure 4B).
    explanation: 'The p.Tyr125Cys protein is unstable but retains activity: overexpression partly restores COX activity in subject 2 cells.'

notes: The three reported individuals do not establish separate severity subtypes, penetrance, population prevalence or feature frequencies. The general Nuclear Gene-Encoded Leigh Syndrome Spectrum GeneReview supplies care and counseling context but has no FASTKD5-specific section; its cohort frequencies are not transferred to MC4DN24. Patient and null-model findings differ with residual function and tissue context. A co-occurring 1q21.1 deletion in subject 2 complicates attribution of facial features.

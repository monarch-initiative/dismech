pathophysiology:
- name: Reduced FASTKD5 protein abundance
  description: Patient fibroblasts have reduced steady-state FASTKD5. The p.Tyr125Cys allele destabilizes the protein while retaining partial function; the two frameshift alleles are predicted to alter translation. Reduced abundance is distinct from functional failure of a stably expressed missense protein.

- name: Abnormal Collagen Fibril and Bone Matrix Architecture
  description: >-
    Overmodified type I collagen assembles into fibrils with abnormal diameters
    and irregular borders, forming an abnormal bone extracellular matrix
    characterized by decreased cortical width, extremely thin trabeculae, and
    focal patches of unmineralized osteoid. At the material level, mineralized
    bone packets exhibit elevated local matrix mineral content (typical of OI),
    accompanied by an increased fraction of low-mineralized bone relative to OI
    type VII and concurrent growth-plate osteochondrodysplasia.

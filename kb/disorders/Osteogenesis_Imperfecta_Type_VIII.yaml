- name: Delayed Collagen Helix Folding and Chain Overmodification
  description: >-
    Loss of the P3H1-CRTAP-CyPB complex and absent Pro986 3-hydroxylation delay
    type I procollagen triple-helix folding in the endoplasmic reticulum.
    Prolonged exposure of unfolded alpha chains to lysyl hydroxylase and
    glycosyltransferases produces post-translational overmodification (excess
    lysyl hydroxylation and glycosylation with retarded electrophoretic
    mobility); collagen secretion from the cell is moderately delayed, while
    total collagen output is increased.
  biological_scale: CELLULAR

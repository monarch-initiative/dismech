diagnosis:
- name: Clinical, Biochemical, and Molecular Diagnosis
  description: >-
    OI type VIII is suspected in an infant with severe/lethal recessive OI,
    often with white (rather than dark blue) sclerae, rhizomelia, and extreme
    skeletal undermineralization, particularly in individuals of West African
    ancestry. Biochemical collagen analysis of cultured fibroblasts shows
    near-absent alpha1(I)Pro986 3-hydroxylation with collagen overmodification.
    Diagnosis is confirmed by identifying biallelic P3H1 (LEPRE1) variants — by
    single-gene testing (including the c.1080+1G>T founder allele in at-risk
    populations) or a recessive-OI gene panel / exome sequencing —
    distinguishing it from the closely similar CRTAP (type VII) and PPIB (type
    IX) forms and from parental germline mosaicism for dominant COL1A1/COL1A2
    variants.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:17277775
    reference_title: "Prolyl 3-hydroxylase 1 deficiency causes a recessive metabolic bone disorder resembling lethal/severe osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Proband collagen had minimal 3-hydroxylation of alpha1(I)Pro986 but excess
      lysyl hydroxylation and glycosylation along the collagen helix.
    explanation: >-
      The biochemical signature (absent Pro986 3-hydroxylation with
      overmodification) supports the diagnosis of P3H1-deficient OI type VIII.
  - reference: PMID:18566967
    reference_title: "CRTAP and LEPRE1 mutations in recessive osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      testing for those mutations is essential to distinguish the mode of
      inheritance, prediction of recurrence risk, and facilitate testing for
      parental mosaicism when mutations occur in the collagen genes.
    explanation: >-
      Establishes molecular DNA testing of LEPRE1/CRTAP as essential for
      definitive diagnosis and distinguishing autosomal recessive OI from
      parental COL1A1/COL1A2 mosaicism.
treatments:
- name: Bisphosphonate Therapy
  description: >-
    Intravenous bisphosphonates (such as pamidronate) are widely used
    empirically in children with severe recessive OI, including OI type VIII,
    by analogy with general severe-OI antiresorptive management; however,
    efficacy specifically in OI type VIII has not been established in
    controlled studies, and published case observations note uncertainty as to
    whether clinical outcomes in treated LEPRE1-mutant children reflect
    bisphosphonate therapy or genetic background.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Bisphosphonate Therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
    therapeutic_agent:
    - preferred_term: pamidronate
      term:
        id: CHEBI:7903
        label: pamidronate
  target_mechanisms:
  - target: Whole-Bone Osteopenia and Skeletal Fragility
    description: >-
      Antiresorptive intravenous bisphosphonate therapy is used empirically to
      counteract severe osteopenia in children with severe recessive OI,
      although efficacy specifically in OI type VIII is not established.
    evidence:
    - reference: PMID:18566967
      reference_title: "CRTAP and LEPRE1 mutations in recessive osteogenesis imperfecta."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        We are uncertain if the extended survival of Proband 4, one of the Irish
        Traveller subjects who is now 5 years old, intellectually normal, and
        uses a wheelchair for mobility, results from treatment since birth with
        bisphosphonates (IV pamidronate, 12 mg/kg/year divided into every three
        month doses) that are frequently used in treatment of children with
        severe OI (Glorieux, 2007), or reflects a different genetic background
        on which the homozygous LEPRE1 mutations are expressed.
      explanation: >-
        Documents empiric intravenous pamidronate use from birth in a child
        homozygous for a LEPRE1 frameshift allele while explicitly noting that
        treatment efficacy could not be separated from genetic background.
  evidence:
  - reference: PMID:18566967
    reference_title: "CRTAP and LEPRE1 mutations in recessive osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We are uncertain if the extended survival of Proband 4, one of the Irish
      Traveller subjects who is now 5 years old, intellectually normal, and uses
      a wheelchair for mobility, results from treatment since birth with
      bisphosphonates (IV pamidronate, 12 mg/kg/year divided into every three
      month doses) that are frequently used in treatment of children with severe
      OI (Glorieux, 2007), or reflects a different genetic background on which
      the homozygous LEPRE1 mutations are expressed.
    explanation: >-
      Documents empiric IV pamidronate therapy in a surviving child homozygous
      for a LEPRE1 loss-of-function allele (Proband 4) alongside explicit
      uncertainty regarding its specific contribution to clinical outcome.
  - reference: PMID:20301472
    reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."

- name: Whole-Bone Osteopenia and Skeletal Fragility
  description: >-
    Although mineralized matrix packets are locally hypermineralized at the
    material level, the severe paucity of cortical and trabecular bone volume
    and focal unmineralized osteoid yield profound organ-level osteopenia
    (lumbar spine areal BMD Z-scores of -5 to -6), decreased long-bone modeling,
    and extreme mechanical fragility. This whole-bone structural deficit drives
    congenital and recurrent postnatal long-bone and rib fractures, progressive
    limb bowing and kyphoscoliosis, and neonatal thoracic respiratory
    insufficiency.

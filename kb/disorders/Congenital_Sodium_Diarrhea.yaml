name: Congenital Sodium Diarrhea
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
synonyms:
- CSD
- congenital secretory sodium diarrhea
- diarrhea 8, secretory sodium, congenital
- familial GUCY2C diarrhea syndrome
description: >-
  Congenital sodium diarrhea (CSD) is a rare congenital diarrhea and enteropathy
  (CODE) defined by perinatal-onset watery diarrhea with disproportionately high
  fecal sodium loss, hyponatremia and metabolic ACIDOSIS. With congenital
  chloride diarrhea it forms the electrolyte-transport-related class of the CODEs
  - disorders in which the failed apical transport step handles an ion rather
  than an ingested nutrient, so the diarrhea is independent of feeding and cannot
  be treated by eliminating any dietary constituent. CSD is genetically
  heterogeneous but mechanistically convergent. Classic (non-syndromic) CSD is
  caused by recessive loss-of-function variants in SLC9A3, encoding NHE3, the
  major sodium/proton exchanger of the intestinal brush border. A second
  non-syndromic form is caused by dominant ACTIVATING variants in GUCY2C,
  encoding guanylate cyclase C: excess cyclic GMP both drives CFTR-mediated
  chloride and water secretion and inhibits NHE3, which is itself a downstream
  target of GC-C - so the gain-of-function and loss-of-function routes converge
  on the same failure of NHE3-mediated sodium absorption. A syndromic form is
  caused by recessive loss-of-function variants in SPINT2, encoding a Kunitz-type
  serine protease inhibitor, and is distinguished by choanal or anal atresia,
  hypertelorism and corneal erosions. CSD is the acid-base mirror image of
  congenital chloride diarrhea: losing the sodium/proton exchanger means protons
  are retained rather than secreted, giving acidosis where loss of the
  chloride/bicarbonate exchanger gives alkalosis. Mortality is high in the first
  years from electrolyte imbalance and the complications of parenteral nutrition,
  but survivors can adapt to partial or complete enteral nutrition - a natural
  history distinctly better than that of the structural enteropathies.

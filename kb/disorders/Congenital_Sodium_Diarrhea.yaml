- name: Luminal Sodium Retention and Obligated Water Loss
  conforms_to: "electrolyte_transport_related_diarrhea#Obligated Water Loss and Feeding-Independent Watery Diarrhea"
  description: >-
    Sodium retained in the lumen is osmotically active and obligates water,
    producing the high-volume watery stool. Because the retained solute is an ion
    the body itself secretes and recycles rather than an ingested nutrient, stool
    output does not fall when feeds are withheld and no dietary elimination
    abolishes it - the practical feature that separates this class from the
    diet-induced congenital diarrheas at the bedside. Diarrhea begins
    perinatally and, as in congenital chloride diarrhea, intrauterine fluid loss
    can present as polyhydramnios.
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: Transepithelial water movement into the lumen
    term:
      id: GO:0006833
      label: water transport
    modifier: INCREASED

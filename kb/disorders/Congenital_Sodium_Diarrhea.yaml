      id: UBERON:0000160
      label: intestine
  evidence:
  - reference: PMID:19185281
    reference_title: "Mutations in SPINT2 cause a syndromic form of congenital sodium diarrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      perinatal onset of a persistent watery diarrhea with nonproportionally high
      fecal sodium excretion
    explanation: >-
      States the output of this node - persistent watery stool carrying
      disproportionate sodium - and its perinatal onset.
  downstream:
  - target: Electrolyte Crisis, Growth Failure and Later Enteral Adaptation
    causal_link_type: DIRECT
- name: Systemic Sodium Depletion and Metabolic Acidosis
  conforms_to: "electrolyte_transport_related_diarrhea#Ion-Specific Systemic Depletion and Acid-Base Derangement"
  description: >-
    The systemic arm, and the acid-base mirror image of congenital chloride
    diarrhea. NHE3 exports a proton into the lumen for every sodium it absorbs;
    when the exchanger fails, that proton is retained in the body while sodium is
    lost in stool. The result is hyponatremia with metabolic ACIDOSIS - the
    opposite derangement to the hypochloremic metabolic ALKALOSIS produced when
    the chloride/bicarbonate exchanger DRA fails in congenital chloride diarrhea.
    Urinary sodium is low-to-normal, confirming that the loss is enteric rather
    than renal, which is the discriminating measurement.
  role: effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Systemic acid-base regulation
    term:
      id: GO:0006885
      label: regulation of pH
    modifier: ABNORMAL
  evidence:
  - reference: PMID:11113072
    reference_title: "Congenital sodium diarrhea is an autosomal recessive disorder of sodium/proton exchange but unrelated to known candidate genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CSD in 4 of 5 patients was based on daily fecal sodium
      excretion between 98 and 190 mmol/L, hyponatremia, metabolic acidosis, and
      low-to-normal urinary sodium concentrations.
    explanation: >-
      Gives the complete biochemical signature of this node with quantitative
      fecal sodium values, including the low-to-normal urinary sodium that
      localizes the loss to the gut.
  downstream:
  - target: Electrolyte Crisis, Growth Failure and Later Enteral Adaptation
    causal_link_type: DIRECT
- name: Electrolyte Crisis, Growth Failure and Later Enteral Adaptation
  conforms_to: "electrolyte_transport_related_diarrhea#Electrolyte Crisis, Growth Failure and Long-Term Morbidity"
  description: >-
    The clinical output. Mortality risk is high in the first years of life, from
    immediate electrolyte imbalance and from the complications of long-term
    parenteral nutrition. The natural history then diverges from that of the
    structural enteropathies in a clinically important way: survivors can
    eventually adapt to partial or complete enteral nutrition, so parenteral
    dependence is not necessarily lifelong and transplantation is not the
    expected endpoint. Management is supportive - aggressive sodium and fluid
    replacement with correction of acidosis - since no therapy addresses the
    transport defect itself.
  role: consequence
  biological_scale: ORGANISM
  locations:
  - preferred_term: Intestine
    term:
      id: UBERON:0000160
      label: intestine
  evidence:
  - reference: PMID:19185281
    reference_title: "Mutations in SPINT2 cause a syndromic form of congenital sodium diarrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients from both groups have a high risk of mortality due to immediate
      electrolyte imbalances and complications from long-term parenteral
      nutrition in the first years of life, but survivors can eventually adapt to
      partial or complete enteral nutrition.
    explanation: >-
      States both halves of this node: the early mortality risk and the enteral
      adaptation achievable by survivors, which distinguishes the prognosis of
      CSD from that of the enterocyte-structural enteropathies.
has_subtypes:
- name: Classic non-syndromic CSD
  display_name: Classic (non-syndromic) congenital sodium diarrhea, SLC9A3-related
  description: >-
    Recessive SLC9A3/NHE3 loss of function. Isolated intestinal disease with no
    atresias or facial features. Presented in seven families in the cohort that
    delineated the syndromic/classic split.
- name: Syndromic CSD
  display_name: Syndromic congenital sodium diarrhea, SPINT2-related
  description: >-
    Recessive SPINT2 loss of function. Intestinal disease plus choanal or anal
    atresia, hypertelorism and corneal erosions. Occurred in ten families in the
    delineating cohort. SPINT2 also causes a syndromic form of congenital
    tufting enteropathy.
- name: GUCY2C-activating form
  display_name: Familial GUCY2C diarrhea syndrome (dominant, activating)
  description: >-
    Dominant activating GUCY2C variant raising cyclic GMP. Milder, early-onset
    chronic diarrhea with increased susceptibility to inflammatory bowel disease,
    small-bowel obstruction and esophagitis. Paradoxically associated with
    prolonged rather than accelerated gut transit.
  genes:
  - preferred_term: GUCY2C
    term:
      id: hgnc:4688
      label: GUCY2C
  evidence:
  - reference: PMID:28957388
    reference_title: "Prolonged intestinal transit and diarrhea in patients with an activating GUCY2C mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite having diarrhea, the FGDS patients have prolonged transit time
      through the gut compared to HC, particularly in colon.
    explanation: >-
      Supports the paradoxical motility phenotype asserted for this subtype -
      diarrhea with prolonged rather than accelerated transit, most marked in
      the colon - which distinguishes it from the other CSD forms.

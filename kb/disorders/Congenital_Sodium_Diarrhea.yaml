inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Classic (SLC9A3) and syndromic (SPINT2) CSD are autosomal recessive.
    Consanguinity is common in reported kindreds; the original Austrian cohort
    traced five affected infants in a circumscribed rural area to a single common
    ancestor five generations back.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:11113072
    reference_title: "Congenital sodium diarrhea is an autosomal recessive disorder of sodium/proton exchange but unrelated to known candidate genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pedigree analysis of the affected 2 CSD families revealed parental
      consanguinity and a common single ancestor 5 generations ago.
    explanation: >-
      Pedigree evidence for recessive inheritance with a founder effect in a
      geographically circumscribed population.
  - reference: PMID:19185281
    reference_title: "Mutations in SPINT2 cause a syndromic form of congenital sodium diarrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal-recessive congenital sodium diarrhea (CSD) is characterized by
      perinatal onset of a persistent watery diarrhea with nonproportionally high
      fecal sodium excretion.
    explanation: >-
      States the recessive inheritance and the defining clinical and biochemical
      features of the disorder.
- name: Autosomal dominant inheritance
  description: >-
    The GUCY2C-associated form is autosomal dominant and results from activating
    (gain-of-function) rather than loss-of-function variants, so it does not
    follow the recessive pattern of the other two forms. It was delineated in a
    32-member Norwegian family. Applies to the GUCY2C-activating subtype only.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:22436048
    reference_title: "Familial diarrhea syndrome caused by an activating GUCY2C mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Familial diarrhea disorders are, in most cases, severe and caused by
      recessive mutations. We describe the cause of a novel dominant disease in
      32 members of a Norwegian family.
    explanation: >-
      Establishes the dominant inheritance of the GUCY2C form and explicitly
      contrasts it with the recessive majority of familial diarrheas.
genetic:
- name: SLC9A3 loss-of-function variants
  gene_term:
    preferred_term: SLC9A3
    term:
      id: hgnc:11073
      label: SLC9A3
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: Classic non-syndromic CSD
  features: >-
    Recessive missense, splicing, truncating and whole-gene-deletion variants in
    SLC9A3 (including one instance of uniparental disomy) cause classic
    non-syndromic CSD. All reported variants lie in the NHE3 N-terminal transport
    domain and all missense variants fall in putative membrane-spanning domains.
    Functional testing in NHE-null fibroblasts showed reduced basal surface
    expression and/or loss of basal transport function, with acute regulation
    preserved - so the defect is in constitutive NHE3 activity rather than in its
    regulation.
  evidence:
  - reference: PMID:26358773
    reference_title: "Reduced sodium/proton exchanger NHE3 activity causes congenital sodium diarrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SLC9A3 missense, splicing and truncation mutations, including an instance
      of uniparental disomy, and whole-gene deletion were identified in nine
      patients from eight families with CSD.
    explanation: >-
      The gene-discovery report identifying SLC9A3 as a cause of CSD and
      describing the variant spectrum.
  - reference: PMID:26358773
    reference_title: "Reduced sodium/proton exchanger NHE3 activity causes congenital sodium diarrhea."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SLC9A3 missense mutations compromised NHE3 activity by reducing basal
      surface expression and/or loss of basal transport function of NHE3
      molecules, whereas acute regulation was normal.
    explanation: >-
      Functional characterization localizing the defect to constitutive NHE3
      surface expression and transport rather than to acute regulation. Evidence
      source is IN_VITRO because activity was assayed in NHE-null fibroblasts.
- name: GUCY2C activating variants
  gene_term:
    preferred_term: GUCY2C
    term:
      id: hgnc:4688
      label: GUCY2C
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: GUCY2C-activating form
  features: >-
    A heterozygous missense variant (c.2519G>T) in GUCY2C, encoding guanylate
    cyclase C, causes a dominant familial diarrhea syndrome that presents as
    non-syndromic CSD. The variant is activating, not inactivating: ligand
    exposure produces markedly increased cyclic GMP. Affected individuals have
    increased susceptibility to inflammatory bowel disease, small-bowel
    obstruction and esophagitis, an inflammatory dimension absent from the other
    forms.
  evidence:
  - reference: PMID:22436048
    reference_title: "Familial diarrhea syndrome caused by an activating GUCY2C mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a heterozygous missense mutation (c.2519G→T) in GUCY2C in all
      affected family members and observed no other rare variants in the exons of
      genes in the candidate region.
    explanation: >-
      Identifies the causative heterozygous GUCY2C variant and its segregation
      with disease.
  - reference: PMID:22436048
    reference_title: "Familial diarrhea syndrome caused by an activating GUCY2C mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Exposure of the mutant receptor to its ligands resulted in markedly
      increased production of cyclic guanosine monophosphate (cGMP).
    explanation: >-
      Demonstrates that the variant is activating, the point that distinguishes
      this form mechanistically from the loss-of-function forms. Evidence source
      is IN_VITRO because cGMP production was measured in transfected HEK293T
      cells.
- name: SPINT2 loss-of-function variants
  gene_term:
    preferred_term: SPINT2
    term:
      id: hgnc:11247
      label: SPINT2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: Syndromic CSD
  features: >-
    Homozygous or compound heterozygous SPINT2 variants, encoding a Kunitz-type
    serine protease inhibitor, cause the syndromic form. Reported alleles include
    a recurrent c.593-1G>A splice variant plus p.Y163C, c.1A>T, c.337+2T>C and
    c.553+2T>A. They act by loss of protein synthesis or by failure to inhibit
    the serine protease trypsin, so the proposed mechanism is excess serine
    protease activity in affected tissues. Genotype-phenotype separation is
    clean: SPINT2 variants were found in all syndromic patients and in none of
    the classic-CSD patients. SPINT2 variants also cause a syndromic form of
    congenital tufting enteropathy, so the same gene reaches two CODE classes.
  evidence:
  - reference: PMID:19185281
    reference_title: "Mutations in SPINT2 cause a syndromic form of congenital sodium diarrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The same mutation and four distinct, homozygous or compound heterozygous
      mutations (p.Y163C, c.1A-->T, c.337+2T-->C, c.553+2T-->A) were identified
      in all syndromic patients. No SPINT2 mutations were found in
      classic-CSD patients.
    explanation: >-
      Establishes SPINT2 as the syndromic-form gene and documents the clean
      genotype-phenotype separation from classic CSD.
  - reference: PMID:19185281
    reference_title: "Mutations in SPINT2 cause a syndromic form of congenital sodium diarrhea."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SPINT2 mutations were associated with loss of protein synthesis or failure
      to inhibit the serine protease trypsin in vitro.
    explanation: >-
      Characterizes the two molecular consequences of the SPINT2 variants,
      supporting the excess-protease mechanism proposed for this form.
pathophysiology:
- name: Loss of NHE3 Activity or Constitutive Guanylate Cyclase C Activation
  conforms_to: "electrolyte_transport_related_diarrhea#Loss of an Apical Intestinal Electrolyte Transport Step"
  description: >-
    The initiating lesion, reached by two opposite-looking molecular routes that
    converge. In classic CSD, recessive SLC9A3 variants reduce surface expression
    or transport function of NHE3, the major sodium/proton exchanger of the
    intestinal brush border, while leaving its acute regulation intact. In the
    GUCY2C form, a dominant activating variant in guanylate cyclase C raises
    cyclic GMP on ligand exposure; because NHE3 is itself a downstream target of
    GC-C, excess cGMP inhibits it, and in parallel hyperactivates CFTR to drive
    chloride and water secretion. Loss-of-function of the exchanger and
    gain-of-function of its upstream inhibitor therefore produce the same
    functional endpoint. The syndromic SPINT2 form is proposed to act through
    excess serine protease activity in the affected epithelium, a route that is
    less well resolved at the transport level.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Small-intestinal enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  molecular_functions:
  - preferred_term: Brush-border sodium/proton exchange (NHE3)
    term:
      id: GO:0015385
      label: sodium:proton antiporter activity
    modifier: LOSS_OF_FUNCTION
  - preferred_term: Guanylate cyclase C activity
    term:
      id: GO:0004383
      label: guanylate cyclase activity
    modifier: GAIN_OF_FUNCTION
  cellular_components:

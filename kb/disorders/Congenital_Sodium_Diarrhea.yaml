diagnosis:
- name: Fecal and urinary sodium measurement
  description: >-
    Measurement of fecal sodium with paired serum electrolytes, blood gas and
    urinary sodium is the diagnostic core. The pattern is high fecal sodium with
    hyponatremia, metabolic acidosis and low-to-normal urinary sodium; the last
    of these localizes the loss to the gut rather than the kidney.
  evidence:
  - reference: PMID:11113072
    reference_title: "Congenital sodium diarrhea is an autosomal recessive disorder of sodium/proton exchange but unrelated to known candidate genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CSD in 4 of 5 patients was based on daily fecal sodium
      excretion between 98 and 190 mmol/L, hyponatremia, metabolic acidosis, and
      low-to-normal urinary sodium concentrations.
    explanation: >-
      States the diagnostic criteria actually used to establish CSD in a
      published cohort.
- name: SLC9A3, GUCY2C and SPINT2 sequencing
  description: >-
    Molecular confirmation. The presence or absence of atresias, hypertelorism
    and corneal erosions directs testing: syndromic features point to SPINT2,
    isolated intestinal disease to SLC9A3, and a dominant family history with
    inflammatory complications to GUCY2C.
  evidence:
  - reference: PMID:19185281
    reference_title: "Mutations in SPINT2 cause a syndromic form of congenital sodium diarrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No SPINT2 mutations were found in classic-CSD patients.
    explanation: >-
      Supports using the syndromic/classic clinical split to direct molecular
      testing, since the genotype-phenotype separation is complete in the
      delineating cohort.
treatments:
- name: Sodium and Fluid Replacement
  description: >-
    Supportive management is the only available treatment: aggressive replacement
    of sodium and water with correction of the metabolic acidosis, delivered
    parenterally in infancy. Nothing addresses the underlying transport defect.
    Because survivors can adapt to partial or complete enteral nutrition, the
    goal is to carry the child through the high-mortality early years rather than
    to plan for lifelong parenteral support.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_mechanisms:
  - target: Systemic Sodium Depletion and Metabolic Acidosis
    treatment_effect: INHIBITS
    description: >-
      Replacing sodium and water and correcting acidosis offsets the systemic
      consequences of enteric loss. It acts only on the systemic arm and leaves
      luminal sodium retention and stool volume unchanged.
    evidence:
    - reference: PMID:19185281
      reference_title: "Mutations in SPINT2 cause a syndromic form of congenital sodium diarrhea."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients from both groups have a high risk of mortality due to immediate
        electrolyte imbalances and complications from long-term parenteral
        nutrition in the first years of life
      explanation: >-
        Establishes electrolyte imbalance as the immediate threat to life that
        replacement therapy addresses, and records the competing risk from the
        parenteral route itself.
notes: >-
  CSD and congenital chloride diarrhea together form the
  electrolyte-transport-related class of the congenital diarrheas and
  enteropathies (PMID:29654747), and are curated as conformers of the
  electrolyte_transport_related_diarrhea module. Neither conforms to
  diet_induced_osmotic_diarrhea: the failed step handles an ion rather than an
  ingested nutrient, the diarrhea persists during bowel rest, and no dietary
  elimination abolishes it. The two are acid-base mirror images, which is the
  most useful bedside discriminator - alkalosis in chloride diarrhea, acidosis
  here.
  Curation caution on PMID:11113072: that paper's title asserts CSD is unrelated
  to the known sodium/proton exchanger genes, and it specifically excluded NHE3.
  That negative conclusion was overturned in 2015 by PMID:26358773, which
  identified recessive SLC9A3/NHE3 variants as a cause. The 2000 paper is cited
  here only for its inheritance, phenotype and biochemistry findings, which
  stand; it must not be cited for the claim that NHE3 is not involved.
  The GUCY2C form is curated here as a subtype rather than a separate entry
  because Janecke et al. classify it as a non-syndromic form of CSD, but it is
  atypical on three counts - dominant rather than recessive, gain- rather than
  loss-of-function, and accompanied by inflammatory bowel disease susceptibility.
  A future split into its own entry (familial GUCY2C diarrhea syndrome) would be
  defensible if its inflammatory arm is curated in depth.

    reference_title: "Reduced sodium/proton exchanger NHE3 activity causes congenital sodium diarrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SLC9A3 encodes Na(+)/H(+) antiporter 3 (NHE3), which is the major
      intestinal brush-border Na(+)/H(+) exchanger.
    explanation: >-
      Identifies the transporter whose loss defines the classic arm of this
      trigger and establishes it as the major brush-border sodium/proton
      exchanger.
  - reference: PMID:26358773
    reference_title: "Reduced sodium/proton exchanger NHE3 activity causes congenital sodium diarrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study identifies recessive mutations in NHE3, a downstream target of
      GC-C, as a cause of CSD
    explanation: >-
      States the relationship that makes this a single convergent node rather
      than two unrelated mechanisms: NHE3 is a downstream target of guanylate
      cyclase C, so activating GC-C and inactivating NHE3 act on the same axis.
  - reference: PMID:22436048
    reference_title: "Familial diarrhea syndrome caused by an activating GUCY2C mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This may cause hyperactivation of the cystic fibrosis transmembrane
      regulator (CFTR), leading to increased chloride and water secretion from
      the enterocytes, and may thus explain the chronic diarrhea in the affected
      family members.
    explanation: >-
      Gives the secretory arm of the GC-C route. The authors hedge this as a
      proposed explanation, which is why the edge from this node is typed as
      having known intermediates rather than as a direct mechanism.
  downstream:
  - target: Failure of Net Intestinal Sodium Absorption
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Failure of Net Intestinal Sodium Absorption
  conforms_to: "electrolyte_transport_related_diarrhea#Luminal Electrolyte Retention and Failure of Net Ion Absorption"
  description: >-
    The rate-limiting step. NHE3-mediated electroneutral sodium absorption is the
    principal route by which the small intestine and colon reclaim luminal
    sodium, and it is the driving force for the water absorption that follows it.
    When that step fails - whether the exchanger is absent, non-functional, or
    inhibited by excess cGMP - sodium is retained in the lumen at concentrations
    far above what the remaining absorptive routes can clear, and in the GUCY2C
    form active chloride secretion adds to the luminal ion load. This is the
    disorder-agnostic convergence point of all three genetic forms and the reason
    fecal sodium is disproportionately high, which is the diagnostic signature.
  role: central_effector
  biological_scale: TISSUE

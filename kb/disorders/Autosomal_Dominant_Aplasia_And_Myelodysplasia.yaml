- category: Neurological
  name: Congenital sensorineural hearing impairment
  phenotype_term:
    preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
  description: >-
    Congenital nerve deafness is recorded alongside the haematologic phenotype
    in the IUIS classification. It is not a constant feature: a reported patient
    with a pathogenic SRP72 frameshift had normal hearing tests, so the
    deafness does not track the marrow phenotype allele for allele. No
    frequency band is set here for the reason given in the entry-level `notes`.
  evidence:
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT

name: Autosomal Dominant Aplasia and Myelodysplasia
creation_date: "2026-09-03T22:45:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal dominant aplasia and myelodysplasia
  term:
    id: MONDO:0013851
    label: autosomal dominant aplasia and myelodysplasia
description: >
  Autosomal dominant aplasia and myelodysplasia (bone marrow failure syndrome 1,
  BMFS1; OMIM 614675) is an inherited bone marrow failure and myelodysplasia
  predisposition syndrome caused by heterozygous germline variants in SRP72, the
  72 kDa subunit of the signal recognition particle. Reported families present
  with marrow hypocellularity, pancytopenia and adult- or childhood-onset
  myelodysplasia; congenital sensorineural deafness was present in the family in
  which the gene was first identified and is recorded alongside the haematologic
  phenotype in expert classifications of the inherited bone marrow failure
  syndromes.

  Its mechanistic interest is that it places a defect in *co-translational
  protein targeting* upstream of marrow failure. The signal recognition particle
  is a ribonucleoprotein of six proteins assembled on 7SL RNA that binds the
  signal sequence of a nascent secretory or membrane protein as it emerges from
  the ribosome and routes the ribosome-nascent-chain complex to the endoplasmic
  reticulum. That is a housekeeping function required by every cell, so it is a
  different kind of lesion from the five mechanistic axes already represented
  among the inherited aplastic anaemias in this knowledge base - DNA interstrand
  crosslink repair (Fanconi anaemia), telomere maintenance (dyskeratosis
  congenita), ribosome biogenesis and assembly (Diamond-Blackfan anaemia,
  Shwachman-Diamond syndrome), thrombopoietin receptor signalling (congenital
  amegakaryocytic thrombocytopenia), and inflammatory suppression of the stem
  compartment. SRP72 is a sixth axis rather than a variant of any of them,
  which is why it is curated as its own entry rather than folded into the
  parent.

  How a ubiquitous translocation defect produces a tissue-restricted
  haematopoietic phenotype is unresolved, and the literature says so directly.
  That gap is recorded here as a `KNOWLEDGE_GAP` discussion rather than papered
  over with an inferred chain, and the pathophysiology nodes below are
  deliberately few: they carry only what the references available to this entry
  actually support.

synonyms:

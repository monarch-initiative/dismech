pathophysiology:
- name: SRP72 Deficiency
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline SRP72 variant leaves the signal recognition particle
    without normal SRP72 function. The IUIS classification names the entity
    "SRP72-deficiency", which is the name used for this node.

    The node is deliberately NOT named haploinsufficiency. "Deficiency" in a
    classification table says a functional deficit exists; it does not say the
    deficit is a halved dose of an otherwise normal subunit. The primary reports
    describe mutant SRP72 protein mislocalizing within the cell and one variant
    failing to associate normally with the particle's 7SL RNA, which points at a
    defect in incorporating SRP72 into an assembled particle - possibly
    dominant-negative - rather than at reduced gene dosage. Those primary data
    are not cited here because they could not be fetched in this environment (see
    entry `notes`), so this node makes the weaker claim the available sources do
    support, and the unresolved choice between the two mechanisms is recorded in
    the `srp72-molecular-lesion` discussion. `functional_impact_category` is
    correspondingly left unset on the `genetic` block: every value it could take
    would assert the distinction this entry cannot yet make.
  genes:
  - preferred_term: SRP72
    term:
      id: hgnc:11303
      label: SRP72
  downstream:
  - target: Impaired SRP-Dependent Cotranslational Protein Targeting
    description: >-
      Loss of normal SRP72 function in the particle is the proximal cause of
      reduced particle-level function, on either candidate lesion.
  evidence:
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BMFS1 (SRP72-deficiency) SRP72 AD 602122 NA NA Bone marrow failure and congenital nerve deafness"
    explanation: >-
      The expert classification names the disease entity "SRP72-deficiency".
      That supports a functional deficiency of the subunit, which is what this
      node claims; it does not distinguish reduced dosage from a misassembling
      mutant subunit.

- name: Impaired SRP-Dependent Cotranslational Protein Targeting
  biological_scale: MOLECULAR
  description: >-
    The signal recognition particle binds the signal sequence of a nascent
    secretory or membrane protein and delivers the ribosome-nascent-chain
    complex to the endoplasmic reticulum membrane. Reduced SRP72 is expected to
    degrade this particle-level function. Note the directness caveat on the
    evidence below: the cited review describes the SRP complex's role in
    co-translational targeting, not a measured targeting defect in SRP72-mutant
    patient cells.
  biological_processes:
  - preferred_term: SRP-dependent cotranslational protein targeting to membrane
    modifier: DECREASED
    term:
      id: GO:0006614
      label: SRP-dependent cotranslational protein targeting to membrane
  downstream:
  - target: Impaired Haematopoietic Output
    description: >-
      The step from a ubiquitous targeting defect to a blood-restricted
      phenotype is the unexplained link in this disease; see the
      `srp72-tissue-restriction` discussion.
  evidence:
  - reference: PMID:37226705
    reference_title: "Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "For proteins directed to the endoplasmic reticulum, this process occurs co-translationally, which is mediated by the SRP complex."
    explanation: >-
      Establishes the function this node reports as impaired. Graded INDIRECT
      because the quoted statement is about the SRP complex in general; it does
      not itself measure targeting in SRP72-deficient cells.

- name: Impaired Haematopoietic Output
  biological_scale: CELLULAR
  description: >-
    SRP72 is one of two SRP components linked to disordered granulocyte
    production. The cited review reports that association without resolving
    which haematopoietic compartments are affected or by what route, so this
    node is stated at the level the source supports.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  downstream:
  - target: Bone marrow hypocellularity
    description: >-
      Reduced haematopoietic output is the cellular correlate of the
      hypocellular marrow. The target is the HP-bound `phenotypes` entry: the
      tissue-level finding is that phenotype, so it is not restated as a
      separate pathophysiology node.
  evidence:
  - reference: PMID:37226705
    reference_title: "Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Two other components of the SRP complex, SRP72 and SRP19, are associated with dysgranulopoiesis."
    explanation: >-
      Links SRP72 specifically to a disorder of haematopoietic cell production.
  notes: >-
    Deliberately not conformed to the `stem_cell_exhaustion` module. That module
    scopes itself in its own description to the age-associated decline of
    tissue stem cells; asserting conformance from a germline targeting defect
    would import an ageing mechanism that no source here supports. Also
    deliberately not conformed to `myelosuppression`, whose description scopes
    it to treatment toxicity.


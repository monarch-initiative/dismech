treatments:
- name: Haematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic HSCT is the only treatment that replaces the failing marrow
    compartment, and is the definitive management of the marrow failure and
    clonal-evolution risk. Two grades of evidence are cited below. The
    BMFS1-specific outcomes are DIRECT: of the previously reported cases only
    two were transplanted, one doing well and one lost to acute immune
    rejection, and the 2026 index case was transplanted from a sibling with
    normal counts by day 132. The GeneReviews referral pathway is INDIRECT,
    stated for the monosomy 7 predisposition class whose Table 2 of
    predisposing disorders includes SRP72 / bone marrow failure syndrome 1.

    The transplant denominator is what matters clinically here: with three
    transplanted patients in the whole literature, one of whom died of
    rejection, this is a treatment of established intent and almost no outcome
    base. Do not read the day-132 result as a success rate.
  treatment_term:
    preferred_term: Hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  target_mechanisms:
  - target: Bone marrow hypocellularity
    description: >-
      Transplantation replaces the failing haematopoietic compartment, acting
      on the marrow-failure node rather than on the SRP lesion upstream of it.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK571103/
    reference_title: "Monosomy 7 Predisposition Syndromes Overview - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Measures include urgent referral to a hematologist for evaluation of cytopenias and bone marrow abnormalities that appear prior to the development of acute myeloid leukemia (AML) or myelodysplastic syndrome (MDS) and urgent referral to a hematopoietic stem cell transplantation (HSCT) specialist to identify potential donors and determine a transplant strategy."
    explanation: >-
      GeneReviews management guidance for the monosomy 7 predisposition
      syndromes, the class whose Table 2 lists SRP72 / bone marrow failure
      syndrome 1. Graded OTHER because it is expert management guidance rather
      than a reported study result, and INDIRECT because it is stated for the
      class rather than for BMFS1 specifically.
  - reference: PMID:41472573
    reference_title: "A De Novo Splicing Mutation of SRP72 in Bone Marrow Failure Syndrome Type 1: Case Report and Review of the Literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the reported cases, only two patients underwent HSCT (Sakaguchi and Yoshida 2022; Tarlock et al. 2022). One had a good prognosis, while the other failed due to acute immune rejection."
    explanation: >-
      The entire prior transplant experience in BMFS1: two patients, one good
      outcome and one death from acute immune rejection. DIRECT and
      disease-specific, and the reason this entry does not present HSCT as a
      settled outcome.
  - reference: PMID:41472573
    reference_title: "A De Novo Splicing Mutation of SRP72 in Bone Marrow Failure Syndrome Type 1: Case Report and Review of the Literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "After the diagnosis of BMFS1 by genetic testing, the child received hematopoietic stem cell transplantation from a sibling. After 132 days post-transplantation, all parameters of the patient were within the normal range."
    explanation: >-
      A third transplanted BMFS1 patient with normal haematological parameters
      at day 132 - short follow-up, and a single case, but disease-specific
      evidence that transplantation corrects the marrow failure.
  notes: >-
    Supportive care is curated separately below rather than folded in here,
    because the cited source states it as its own management limb with
    transfusion thresholds.

- name: Supportive Transfusion and Infection Prophylaxis
  description: >-
    The standing management of the cytopenias while a transplant decision is
    made, and the only management for a patient who is not a transplant
    candidate. The cited source gives explicit transfusion thresholds - red
    cells at about 80 g/L and platelets at or above 10 x 10^9/L - alongside
    infection prevention. It does not treat the SRP lesion or the marrow
    failure; it substitutes for the missing output.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Pancytopenia
    term:
      id: HP:0001876
      label: Pancytopenia
  evidence:
  - reference: PMID:41472573
    reference_title: "A De Novo Splicing Mutation of SRP72 in Bone Marrow Failure Syndrome Type 1: Case Report and Review of the Literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supportive treatment includes red cell transfusions (typically maintained at 80 g/L), platelet transfusions (maintained at ≥ 10 × 109/L), and infection prevention or anti-infection treatment"
    explanation: >-
      States the supportive-care limb for BMFS1 with its transfusion
      thresholds. An earlier revision of this entry asserted no cached
      reference stated this; that was wrong and is corrected here.
  notes: >-
    No `target_mechanisms` link: transfusion replaces the marrow's product
    rather than acting on any node in the causal chain, so a mechanism edge

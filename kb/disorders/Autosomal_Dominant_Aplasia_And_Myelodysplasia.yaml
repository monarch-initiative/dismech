discussions:
- discussion_id: srp72-molecular-lesion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the molecular lesion in SRP72 bone marrow failure differ by allele
    class - the missense variants acting through a misassembling subunit that
    interferes with the particle, and the frameshift and splice variants
    through simple loss of function - or does one mechanism explain them all?
  attaches_to:
  - pathophysiology#SRP72 Deficiency
  - genetic#SRP72
  rationale: >-
    The evidence pulls both ways, and the likeliest reconciliation is that the
    answer is allele-dependent.

    Against simple haploinsufficiency, for the founding missense alleles: the
    mutant proteins mislocalize and one fails to associate with 7SL RNA, which
    is an assembly defect rather than a reduced dose. The dosage-only mouse
    points the same way - halving Srp72 produces no haematological disorder at
    all, so if dose alone were the lesion the model should be sick and is not.

    For loss of function, in a different allele class: the later reported
    variants are a frameshift whose in-vitro study is reported as loss of
    function, and a splice variant producing a premature termination codon.
    Those are the alleles a haploinsufficiency model fits.

    So the question is no longer "which single mechanism", but whether the
    missense and truncating alleles reach the same phenotype by different
    routes. Deciding it needs the missense subunit tested against particles
    containing wild-type SRP72 - the experiment nobody has reported. This is
    exactly why `functional_impact_category` is left unset on `genetic#SRP72`:
    the slot takes one value per variant context, and this entry curates the
    gene rather than the individual alleles, so any single value would erase
    the split the evidence suggests.
  evidence:
  - reference: PMID:22541560
    reference_title: "Exome sequencing identifies autosomal-dominant SRP72 mutations associated with familial aplasia and myelodysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, coimmunoprecipitation of epitope-tagged SRP72 indicated that the essential RNA component of the SRP did not fully associate with one of the SRP72 variants."
    explanation: >-
      Variant-specific failure of 7SL RNA association - an assembly defect
      rather than a dosage effect, and the observation that opens this question.
  - reference: PMID:31254415
    reference_title: "Heterozygous loss of Srp72 in mice is not associated with major hematological phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous loss of Srp72 in mice is not associated with major changes in hematopoiesis, although causes mild reductions in blood and BM cellularity and minor changes within the stem/progenitor compartment. We did not observe any hematological disorder."
    explanation: >-
      The dosage-only model does not produce the disease, which is the
      complementary argument against haploinsufficiency for the missense
      alleles.
  - reference: PMID:40922878
    reference_title: "A 14-Year-Old Male Patient With Bone Marrow Failure Syndrome, Without Deafness, Caused by a Novel SRP72 Mutation Inherited From His Father: A Case Report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "In vitro functional studies indicated a loss-of-function mechanism."
    explanation: >-
      The other direction, for a frameshift allele: functional study reported
      as loss of function, which is what a haploinsufficiency model predicts
      and what the missense data argue against.
  - reference: PMID:41472573
    reference_title: "A De Novo Splicing Mutation of SRP72 in Bone Marrow Failure Syndrome Type 1: Case Report and Review of the Literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "This is predicted to result in a frameshift variant (p.Leu502ValfsTer14), which alters the amino acids and derives a premature termination codon."
    explanation: >-
      A second truncating allele, from a splice variant. A premature
      termination codon is the canonical loss-of-function lesion, reinforcing
      that the truncating and missense alleles may not share a mechanism.
      Graded IN_VITRO because the sentence reports the readout of a minigene
      splicing assay rather than a clinical observation, matching the sibling
      in-vitro item above. Note the source's own hedge - the frameshift is
      predicted from the observed 2-base retention, not directly demonstrated
      at the protein level.

- discussion_id: srp72-mouse-model-mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The Srp72+/- mouse has no haematological disorder, while heterozygous SRP72
    variants cause marrow failure in humans. Is the mouse a poor model of the
    human lesion, or is reduced SRP72 dosage genuinely not the human mechanism?
  attaches_to:
  - animal_models#Srp72 heterozygous null mouse
  - pathophysiology#SRP72 Deficiency
  rationale: >-
    Evidence exists in the model and its translational validity is the open
    question, which is what distinguishes this from a plain KNOWLEDGE_GAP. The
    two readings have different consequences. If the mouse is simply the wrong
    construct - a null allele where the human alleles make a misassembling
    protein - then the human lesion is allele-specific and a knock-in of a human
    variant should reproduce it. If instead dosage really is insufficient in
    both species, the human phenotype needs a second factor, which would also
    help explain the unaffected carriers. The decisive experiment is a knock-in
    of a human SRP72 allele rather than a null.
  evidence:
  - reference: PMID:31254415
    reference_title: "Heterozygous loss of Srp72 in mice is not associated with major hematological phenotypes."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The Srp72+/- mouse model only partially recapitulates the phenotype observed in families with inherited SRP72 lesions."
    explanation: >-
      The authors state the mismatch themselves.

- discussion_id: srp72-tissue-restriction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a defect in the signal recognition particle - a housekeeping
    complex required by every nucleated cell - produce a phenotype largely
    restricted to haematopoiesis and hearing?
  attaches_to:
  - pathophysiology#Impaired SRP-Dependent Cotranslational Protein Targeting
  rationale: >-
    This is the load-bearing unexplained step of the whole pathograph. Without
    it, the edge from impaired co-translational targeting to impaired
    haematopoietic output is an assertion of tissue selectivity that no source
    accounts for. The cited review makes the same point about the SRP and
    ribosome biogenesis disorders as a class.
  evidence:
  - reference: PMID:37226705
    reference_title: "Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "How these fundamental and ubiquitous cellular processes that lead to protein synthesis result in specific, limited phenotypes remains poorly understood."
    explanation: >-
      States the gap explicitly for the class of disorders this one belongs to.

- discussion_id: srp72-deafness-mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does SRP72 deficiency cause congenital sensorineural
    deafness, and why is the deafness present in some reported families and
    absent in others?
  attaches_to:
  - phenotypes#Congenital sensorineural hearing impairment
  rationale: >-
    The deafness is recorded as a feature of the syndrome but has no proposed
    mechanistic route from the SRP lesion, and it does not segregate with the
    haematologic phenotype across all reported families. Conforming it to a
    hair-cell degeneration module would assert a mechanism nobody has shown, so
    it is left as an unexplained phenotype instead.

- discussion_id: srp72-penetrance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the penetrance of a heterozygous SRP72 variant for bone marrow
    failure or myelodysplasia, and is a second hit or modifier required?
  attaches_to:
  - genetic#SRP72
  - inheritance#Autosomal dominant
  rationale: >-
    Autosomal dominant inheritance is recorded, but the number of reported
    families is small and the literature includes transmission from an
    unaffected parent and reports in which an SRP72 variant is one of several
    variants of uncertain significance. Whether the allele is fully penetrant is
    therefore open. No penetrance value is set on the `inheritance` block for
    this reason.
  evidence:
  - reference: PMID:40922878
    reference_title: "A 14-Year-Old Male Patient With Bone Marrow Failure Syndrome, Without Deafness, Caused by a Novel SRP72 Mutation Inherited From His Father: A Case Report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite this, only the 14-year-old patient in the family developed pancytopenia, while his asymptomatic father, who carries the same mutation, remains healthy."
    explanation: >-
      A documented carrier of the same variant who is unaffected, which is
      direct evidence of incomplete penetrance.

- discussion_id: srp72-evidence-completeness
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Re-curate this entry against the primary SRP72 literature once those
    references can be fetched into `references_cache/`.
  rationale: >-
    Largely discharged. The entry was first written in a session with no network
    route to PubMed, so it cited only an expert classification table, a review of
    a neighbouring disorder, and a GeneReviews overview. Egress later opened and
    the primary literature was fetched and curated: the founding exome study
    (PMID:22541560) now supports the gene, the inheritance, the molecular lesion
    and the co-translational-targeting node; the Srp72 heterozygous-null mouse
    (PMID:31254415) is curated in `animal_models` with a
    `FAILS_TO_RECAPITULATE` link and its own `HUMAN_MODEL_MISMATCH` discussion;
    and incomplete penetrance is cited from PMID:40922878.

    What remains: the per-variant allele spectrum from PMID:41472573 is not
    curated as `variants` entries, though the paper's review table is the best
    available source for it and the entry now cites the paper for treatment,
    prevalence and the truncating-allele lesion; the SRP72 structural work
    (PMID:27899666) is cached but not yet used, and would let the two molecular
    sub-lesions - SRP68 heterodimerization versus 7SL RNA binding - be split
    into separate nodes; the genome-first
    penetrance cohort (PMID:39501104) is cached and could quantify penetrance,
    but reports a pooled odds ratio across eight genes and no SRP72-specific
    figure, so it must not be cited as an SRP72 penetrance estimate.

notes: >-
  Scope and evidence limits, stated plainly so the gaps are not mistaken for
  findings.

  This entry was first written in a session whose egress policy blocked every
  literature source - PubMed/E-utilities, Europe PMC, PMC, Crossref,
  ClinicalTrials.gov, Orphadata and OLS all returned 403 at the agent proxy - so
  it initially cited only what was already in `references_cache/`: an expert
  classification table (IUIS 2022), a review of Shwachman-Diamond syndrome, and
  a GeneReviews overview. Egress later opened in the same session and the
  primary literature was fetched and curated, so that constraint no longer
  describes the entry. It is recorded here because it explains the shape of the
  history records and of the early review rounds, and because the residual gaps
  it caused are listed in the `srp72-evidence-completeness` discussion.

  No `frequency` bands are set on any phenotype. The published series are a
  handful of families with different alleles, and the congenital deafness in
  particular is present in some and absent in others; a band pooled across them
  would assert a population frequency the sources do not support. Numbers, when
  added, should name their denominator.

  The `prevalence` record is a case count, not a rate. Six families as of March
  2024 is the only quantified figure any cited source gives, so `measure_type`
  is `CASES_IN_LITERATURE` and no `rate_per_100000` is set - the source itself
  says the undiagnosed fraction cannot be determined. An earlier revision of
  this entry said no prevalence figure was citable at all; that was wrong, and
  it was a claim about a file this same change set had already committed.

  One treatment is curated, and its evidence is deliberately class-level. The
  cached GeneReviews monosomy 7 overview - whose Table 2 of predisposing
  disorders includes SRP72 / bone marrow failure syndrome 1 - states the HSCT
  referral pathway for that class, so the transplant claim is cited with
  `directness: INDIRECT` rather than left out. An earlier revision of this entry
  asserted that nothing in the cached references bore on treatment at all; that
  overstated the constraint and was corrected in review. Supportive transfusion
  and infection prophylaxis remain uncurated because no cached reference states
  them in quotable form.

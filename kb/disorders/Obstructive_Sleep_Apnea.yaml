name: Obstructive Sleep Apnea
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Obstructive sleep apnea is a disorder of repetitive collapse of the upper
  airway during sleep, producing recurrent episodes of complete (apnea) or
  partial (hypopnea) airflow cessation despite continued respiratory effort.
  Reduced pharyngeal dilator muscle tone during sleep, often compounded by
  obesity, craniofacial anatomy, and increased airway collapsibility, leads to
  cycles of obstruction that terminate in arousals with intermittent hypoxemia
  and sleep fragmentation. The resulting sympathetic activation, oxidative
  stress, and systemic inflammation produce daytime sleepiness and contribute to
  hypertension, cardiovascular disease, and metabolic dysfunction.
category: Complex
parents:
- Respiratory Disease
- Sleep Disorder
disease_term:
  preferred_term: obstructive sleep apnea syndrome
  term:
    id: MONDO:0007147
    label: obstructive sleep apnea syndrome
pathophysiology:
- name: Upper Airway Collapse
  description: >
    During sleep the wakefulness-dependent tonic drive to the pharyngeal
    dilator muscles is withdrawn, and where the underlying airway is
    anatomically narrow or collapsible the soft tissues occlude, obstructing
    airflow against continued respiratory effort. Anatomical factors
    (retrognathia, adenotonsillar hypertrophy, obesity and parapharyngeal fat)
    set the collapsibility, but they are not the whole mechanism: whether an
    individual obstruction becomes a self-limited event or the start of a
    cycling pattern depends on the non-anatomic endotypic traits curated in the
    node below.
  role: trigger
  biological_scale: TISSUE
  conforms_to: "sleep_disordered_breathing_intermittent_hypoxia#Sleep-Related Loss of Upper Airway Dilator Compensation in a Collapsible Pharynx"
  cell_types:
  - preferred_term: Genioglossus pharyngeal dilator muscle cell
    term:
      id: CL:0002673
      label: tongue muscle cell
  biological_processes:
  - preferred_term: Sleep-related loss of pharyngeal dilator muscle tone
    term:
      id: GO:0006937
      label: regulation of muscle contraction
    modifier: DECREASED
  locations:
  - preferred_term: pharynx
    term:
      id: UBERON:0001042
      label: chordate pharynx
  downstream:
  - target: Sleep Fragmentation
    description: >-
      Each obstruction is terminated by a cortical arousal that restores airway
      patency, so the obstructive events and the arousals that end them are the
      same cycle.
    causal_link_type: DIRECT
  - target: Intermittent Hypoxia
    description: >-
      Cessation or reduction of airflow produces a fall in arterial oxygen
      saturation, restored rapidly when the arousal reopens the airway.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38672697
    reference_title: "Unraveling the Complexities of Oxidative Stress and Inflammation Biomarkers in Obstructive Sleep Apnea Syndrome: A Comprehensive Review."
    supports: SUPPORT
    snippet: "BACKGROUND: Obstructive sleep apnea syndrome (OSAS), affecting approximately
      1 billion adults globally, is characterized by recurrent airway obstruction
      during sleep, leading to oxygen desaturation, elevated carbon dioxide levels,
      and disrupted sleep architecture."
    explanation: "Defines the fundamental pathophysiological mechanism of OSA as recurrent
      airway obstruction during sleep."
  - reference: PMID:36982552
    reference_title: "Molecular Pathology, Oxidative Stress, and Biomarkers in Obstructive Sleep Apnea."
    supports: SUPPORT
    snippet: "Obstructive sleep apnea syndrome (OSAS) is characterized by intermittent
      hypoxia (IH) during sleep due to recurrent upper airway obstruction."
    explanation: "Confirms that intermittent hypoxia results from recurrent upper
      airway obstruction, the primary mechanical defect in OSA."
- name: Intermittent Hypoxia
  description: >
    Repeated cycles of oxygen desaturation followed by rapid reoxygenation.
    The cyclical character is the mechanistically important part: it is the
    reoxygenation phase, ischaemia-reperfusion-like, that generates the burst of
    reactive oxygen species driving oxidative stress, sympathetic activation and
    systemic inflammation. An equivalent time-averaged desaturation delivered
    continuously does not reproduce the phenotype, which is why this node - and
    not the apnoea count - is the causal quantity for the systemic sequelae.
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "sleep_disordered_breathing_intermittent_hypoxia#Chronic Intermittent Hypoxia and Reoxygenation"
  biological_processes:
  - preferred_term: Response to Hypoxia
    term:
      id: GO:0001666
      label: response to hypoxia
    modifier: INCREASED
  downstream:
  - target: Sympathetic Overactivation
    description: >-
      Cyclical hypoxia and reoxygenation sensitise the peripheral chemoreflex,
      carrying a nocturnal intermittent stimulus into a tonic daytime elevation
      of sympathetic vasoconstrictor outflow.
    causal_link_type: DIRECT
  - target: Systemic Inflammation
    description: >-
      Reoxygenation-driven reactive oxygen species activate NF-kB-dependent
      inflammatory signalling in the vascular wall.
    causal_link_type: DIRECT
  - target: Ocular Surface Inflammation and Dry Eye Disease
    description: >-
      Intermittent hypoxia and the associated oxidative stress drive ocular
      surface inflammation and lacrimal/meibomian gland dysfunction.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:38672697
    reference_title: "Unraveling the Complexities of Oxidative Stress and Inflammation Biomarkers in Obstructive Sleep Apnea Syndrome: A Comprehensive Review."
    supports: SUPPORT
    snippet: "The cyclic pattern of intermittent hypoxia in OSAS triggers oxidative
      stress, contributing to cellular damage."
    explanation: "Directly confirms that intermittent hypoxia in OSA triggers oxidative
      stress and cellular damage."
  - reference: PMID:36982552
    reference_title: "Molecular Pathology, Oxidative Stress, and Biomarkers in Obstructive Sleep Apnea."
    supports: SUPPORT
    snippet: "IH increases oxygen free radicals (ROS) and reduces antioxidant capacities."
    explanation: "Demonstrates the molecular mechanism by which intermittent hypoxia
      produces oxidative stress through increased ROS and decreased antioxidant defenses."
  - reference: PMID:39694586
    reference_title: "Cerebral oxidative stress, inflammation and apoptosis induced by intermittent hypoxia: a systematic review and meta-analysis of rodent data."
    supports: SUPPORT
    snippet: "IH-induced oxidative stress (increased malondialdehyde (MDA) and NADPH
      oxidase (NOX) and decreased superoxide dismutase), increased inflammation (tumour
      necrosis factor-α, NF-κB and inducible nitric oxide synthase), HIF-1 and apoptosis
      evaluated by terminal deoxynucleotidyl transferase dUTP nick-end labelling and
      cleaved caspase-3."
    explanation: "Meta-analysis of rodent models confirming that intermittent hypoxia
      induces oxidative stress, inflammation, and apoptosis in the brain, establishing
      causal mechanisms."
- name: Sleep Fragmentation
  description: >
    Frequent arousals to restore airway patency disrupt sleep architecture,
    reducing restorative sleep and causing daytime sleepiness. The arousal is
    simultaneously the corrective mechanism and a source of injury, which makes
    the arousal threshold genuinely double-edged rather than a severity marker: a
    low threshold is its own endotype, since patients who arouse too readily
    terminate events before dilator recruitment can stabilise the airway.
  role: amplifier
  biological_scale: ORGANISM
  conforms_to: "sleep_disordered_breathing_intermittent_hypoxia#Recurrent Apnoea-Hypopnoea with Arousal from Sleep"
  biological_processes:
  - preferred_term: Sleep Regulation
    term:
      id: GO:0030431
      label: sleep
    modifier: ABNORMAL
  downstream:
  - target: Intermittent Hypoxia
    description: >-
      Arousal terminates each obstruction and restores airflow, producing the
      rapid reoxygenation that completes the hypoxia-reoxygenation cycle.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38672697
    reference_title: "Unraveling the Complexities of Oxidative Stress and Inflammation Biomarkers in Obstructive Sleep Apnea Syndrome: A Comprehensive Review."
    supports: SUPPORT
    snippet: "Obstructive sleep apnea syndrome (OSAS), affecting approximately 1 billion
      adults globally, is characterized by recurrent airway obstruction during sleep,
      leading to oxygen desaturation, elevated carbon dioxide levels, and disrupted
      sleep architecture."
    explanation: "Confirms that disrupted sleep architecture is a fundamental consequence
      of recurrent airway obstruction in OSA."
- name: Non-Anatomic Endotypic Traits
  description: >-
    Obstructive sleep apnoea is not one mechanism graded by severity. Careful
    physiological phenotyping identifies four largely independent contributing
    traits: pharyngeal collapsibility (the anatomic trait, measured as passive
    critical closing pressure), genioglossus muscle responsiveness during sleep,
    the arousal threshold, and respiratory control stability (loop gain). Around
    a third of patients each have minimal genioglossus responsiveness, a low
    arousal threshold, or high loop gain, and non-anatomic features contribute
    importantly in the majority. About one patient in five has a relatively
    non-collapsible airway similar to controls, and in those patients loop gain
    is roughly double - control instability substituting for anatomy. This node
    is curated because the apnoea-hypopnoea index by which the disease is graded
    is a count of events, not a measure of any of these traits, and because each
    trait implies a different therapeutic target.
  role: amplifier
  biological_scale: ORGANISM
  conforms_to: "sleep_disordered_breathing_intermittent_hypoxia#Ventilatory Control Instability or Chemoreflex Failure"
  biological_processes:
  - preferred_term: nervous system control of respiratory gas exchange
    term:
      id: GO:0002087
      label: regulation of respiratory gaseous exchange by nervous system process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23721582
    reference_title: Defining phenotypic causes of obstructive sleep apnea. Identification of novel therapeutic targets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 36% of patients with OSA had minimal genioglossus muscle
      responsiveness during sleep, 37% had a low arousal threshold, and 36% had
      high loop gain.
    explanation: >-
      Quantifies the three non-anatomic traits in a phenotyped cohort, which is
      the evidence that this node is a real and common contributor rather than a
      theoretical refinement.
  - reference: PMID:23721582
    reference_title: Defining phenotypic causes of obstructive sleep apnea. Identification of novel therapeutic targets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In these patients, loop gain was almost twice as high as patients with a
      Pcrit greater than -2 cm H2O
    explanation: >-
      Shows the trade-off between the anatomic and control arms directly: where
      the airway is comparatively non-collapsible, loop gain is roughly double.
  - reference: PMID:23721582
    reference_title: Defining phenotypic causes of obstructive sleep apnea. Identification of novel therapeutic targets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study confirms that OSA is a heterogeneous disorder. Although
      Pcrit-anatomy is an important determinant, abnormalities in nonanatomic
      traits are also present in most patients with OSA.
    explanation: >-
      The study's own conclusion, and the reason this entry curates a
      non-anatomic node alongside the airway-collapse trigger rather than
      treating anatomy as the mechanism.
  downstream:
  - target: Sleep Fragmentation
    description: >-
      A low arousal threshold terminates respiratory events early, before dilator
      recruitment can stabilise the airway, increasing arousal frequency.
    causal_link_type: DIRECT
  - target: Upper Airway Collapse
    description: >-
      High loop gain and poor genioglossus responsiveness convert a marginal
      airway into a repeatedly collapsing one, so these traits act on the
      anatomic trigger rather than bypassing it.
    causal_link_type: DIRECT
- name: Sympathetic Overactivation
  description: >
    Chemoreceptor sensitisation converts a nocturnal, intermittent stimulus into
    a tonic daytime elevation of sympathetic vasoconstrictor outflow that
    persists long after waking - the step that turns a sleep disorder into a
    cardiovascular one - leading to hypertension, arrhythmias, and cardiovascular
    disease.
  role: effector
  biological_scale: ORGANISM
  conforms_to: "sleep_disordered_breathing_intermittent_hypoxia#Sympathetic Overactivation, Oxidative Stress and Vascular Inflammation"
  cell_types:
  - preferred_term: Sympathetic postganglionic neuron
    term:
      id: CL:0011103
      label: sympathetic neuron
  evidence:
  - reference: PMID:38672697
    reference_title: "Unraveling the Complexities of Oxidative Stress and Inflammation Biomarkers in Obstructive Sleep Apnea Syndrome: A Comprehensive Review."
    supports: SUPPORT
    snippet: "The cyclic pattern of intermittent hypoxia in OSAS triggers oxidative
      stress, contributing to cellular damage."
    explanation: "Intermittent hypoxia triggers cellular stress that contributes to
      sympathetic activation and cardiovascular complications."
  - reference: PMID:39595069
    reference_title: "Mitigating Increased Cardiovascular Risk in Patients with Obstructive Sleep Apnea Using GLP-1 Receptor Agonists and SGLT2 Inhibitors: Hype or Hope?"
    supports: SUPPORT
    snippet: "These agents, originally developed for T2D management, have demonstrated
      pleiotropic effects, including significant weight loss, blood pressure reduction,
      and amelioration of endothelial dysfunction and arterial stiffness, along with
      anti-inflammatory benefits, which may be particularly beneficial in OSA."
    explanation: "Indicates that OSA is associated with blood pressure elevation,
      endothelial dysfunction, and arterial stiffness, consistent with sympathetic
      overactivation."
- name: Systemic Inflammation
  description: >
    Intermittent hypoxia activates inflammatory pathways (NF-kB),
    elevating CRP, IL-6, and TNF-alpha. Contributes to metabolic
    dysfunction and atherosclerosis. Curated in parallel with sympathetic
    overactivation rather than downstream of it: the two limbs are additive
    contributors to the vascular consequences, and both are needed to account for
    the hypertension.
  role: effector
  biological_scale: TISSUE
  conforms_to: "sleep_disordered_breathing_intermittent_hypoxia#Sympathetic Overactivation, Oxidative Stress and Vascular Inflammation"
  cell_types:
  - preferred_term: Vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:38672697
    reference_title: "Unraveling the Complexities of Oxidative Stress and Inflammation Biomarkers in Obstructive Sleep Apnea Syndrome: A Comprehensive Review."
    supports: SUPPORT
    snippet: "The review delineates the imbalance between pro-inflammatory and anti-inflammatory
      factors in OSAS, leading to heightened oxidative stress."
    explanation: "Confirms that OSA is characterized by an imbalance favoring pro-inflammatory
      factors, resulting in heightened inflammation."
  - reference: PMID:36982552
    reference_title: "Molecular Pathology, Oxidative Stress, and Biomarkers in Obstructive Sleep Apnea."
    supports: SUPPORT
    snippet: "OS and metabolic alterations lead OSAS patients to undergo endothelial
      dysfunction, osteoporosis, systemic inflammation, increased cardiovascular risk,
      pulmonary remodeling, and neurological alterations."
    explanation: "Demonstrates that systemic inflammation is a key pathophysiological
      feature of OSA contributing to multiple complications."
  - reference: PMID:39694586
    reference_title: "Cerebral oxidative stress, inflammation and apoptosis induced by intermittent hypoxia: a systematic review and meta-analysis of rodent data."
    supports: SUPPORT
    snippet: "IH-induced oxidative stress (increased malondialdehyde (MDA) and NADPH
      oxidase (NOX) and decreased superoxide dismutase), increased inflammation (tumour
      necrosis factor-α, NF-κB and inducible nitric oxide synthase), HIF-1 and apoptosis
      evaluated by terminal deoxynucleotidyl transferase dUTP nick-end labelling and
      cleaved caspase-3."
    explanation: "Meta-analysis evidence showing that intermittent hypoxia induces
      inflammation through TNF-α and NF-κB activation."
- name: Ocular Surface Inflammation and Dry Eye Disease
  role: consequence
  biological_scale: TISSUE
  description: >
    Intermittent hypoxia and the associated oxidative stress in OSA drive
    ocular surface and systemic inflammation together with lacrimal gland
    dysfunction (reduced aqueous tear production) and meibomian gland
    dysfunction (dysregulated meibum lipid secretion). The resulting tear
    film instability produces both aqueous-deficient and evaporative dry
    eye disease. Mechanical factors such as face-down sleeping positions,
    habitual eye rubbing, and CPAP airflow leakage or retrograde air
    movement further aggravate meibomian gland dysfunction and ocular
    surface drying.
  cell_types:
  - preferred_term: Meibomian (sebaceous) gland cell
    term:
      id: CL:2000021
      label: sebaceous gland cell
    modifier: ABNORMAL
  biological_processes:
  - preferred_term: Ocular Surface Inflammation
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: Response to Oxidative Stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  - preferred_term: Meibomian Lipid Metabolism
    term:
      id: GO:0006629
      label: lipid metabolic process
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:42412736
    reference_title: "The Link Between Obstructive Sleep Apnea and Dry Eye Disease: Pathophysiology and Current Updates."
    supports: SUPPORT
    snippet: "Tear film stability is disrupted by inflammation and lacrimal and
      meibomian glands dysfunction, which are caused by intermittent hypoxia and
      associated oxidative stress in OSA."
    explanation: "Establishes the mechanistic link: intermittent hypoxia and oxidative
      stress in OSA drive inflammation and lacrimal/meibomian gland dysfunction that
      destabilize the tear film."
  - reference: PMID:42412736
    reference_title: "The Link Between Obstructive Sleep Apnea and Dry Eye Disease: Pathophysiology and Current Updates."
    supports: SUPPORT
    snippet: "These disruptions result in both aqueous-deficient and evaporative forms of DED."
    explanation: "Confirms that OSA-driven tear film disruption produces both aqueous-deficient
      and evaporative forms of dry eye disease."
  - reference: PMID:42412736
    reference_title: "The Link Between Obstructive Sleep Apnea and Dry Eye Disease: Pathophysiology and Current Updates."
    supports: SUPPORT
    snippet: "This review highlights the multifactorial etiology of OSA-related DED,
      highlighting the roles of systemic and ocular inflammation, lipid metabolism
      dysfunction, and mechanical stress."
    explanation: "Supports the multifactorial mechanism, including ocular inflammation,
      meibomian lipid metabolism dysfunction, and mechanical stress."

- accession: geo:GSE282864
  title: Differential expression profiles of plasma exosomal microRNAs in obstructive sleep apnea patients
  description: Obstructive sleep apnea (OSA) is a prevalent respiratory disorder, with an estimated global prevalence of over one billion individuals, exhibiting a wide spectrum of severity. In this study, clinical data and whole blood samples were obtained from non-OSA individuals and OSA patients.we performed high-throughput sequencing to analyze differential expression of miRNAs between non-OSA exosomes (n=4) and OSA-Exos (n=6). This analysis identified 15 miRNAs exhibited significantly different expression levels between the two groups, with 7 upregulated and 8 downregulated in OSA-Exos compared to CON-Exos.

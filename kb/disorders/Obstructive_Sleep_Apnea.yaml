treatments:
- name: CPAP
  description: Continuous positive airway pressure, gold standard treatment.
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Sleep Fragmentation
    treatment_effect: INHIBITS
    description: >-
      Positive pressure splints the pharynx open across the respiratory cycle,
      abolishing the obstruction-arousal cycle and, with it, the intermittent
      hypoxia downstream. Because it removes the events without altering obesity
      or craniofacial anatomy, reversal of the downstream chain under CPAP is
      the causal test that the events themselves drive it.
  - target: Upper Airway Collapse
    treatment_effect: INHIBITS
    description: >-
      Pneumatic splinting acts directly on the anatomic trigger; it does not
      correct the non-anatomic endotypic traits, which is one reason residual
      symptoms persist in some adherent patients.

  treatment_term:
    preferred_term: continuous positive airway pressure ventilation
    term:
      id: NCIT:C124040

    snippet: "A 10% increase in weight predicted a 6-fold (95% CI, 2.2-17.0) increase in the odds of developing moderate-to-severe SDB"
    explanation: "Wisconsin Sleep Cohort, measured prospectively at 4-year intervals. The reciprocal finding -- 10% weight loss predicting a 26% AHI reduction -- is what makes this exposure modifiable rather than merely associated."

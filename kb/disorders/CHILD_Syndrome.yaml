    explanation: Continued maintenance accompanied the reported sustained response.
  - reference: PMID:39431262
    reference_title: '5% Simvastatin Ointment as Treatment for Congenital Hemidysplasia with Ichthyosiform Erythroderma and Limb Defects (CHILD) Syndrome in a 4-year-old Female: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: However, the verrucous plaques reappeared on the palms on week 12, which again almost cleared after four weeks. The most responsive sites were the arm, chest, abdomen, inguinal and labia majora, while the foot was the most resistant.
    explanation: The follow-up report shows site-dependent response and recurrence rather than universal clearance.
  - reference: PMID:39431262
    reference_title: '5% Simvastatin Ointment as Treatment for Congenital Hemidysplasia with Ichthyosiform Erythroderma and Limb Defects (CHILD) Syndrome in a 4-year-old Female: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Monitoring of liver and kidney function tests, as well as serum cholesterol level were not done, similar to previously-published cases.

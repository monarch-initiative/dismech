histopathology:
- name: Psoriasiform hyperkeratosis and acanthosis with loss of the granular layer
  description: >-
    Lesional skin shows marked hyperkeratosis and acanthosis with absence of the
    granular layer, together with foam cells in the dermis. This is the routine
    light-microscopic picture, and it reverses on effective pathogenesis-based
    therapy: after three months of topical cholesterol plus lovastatin the
    epidermis was largely normal with a prominent granular layer and
    orthokeratotic scale.
  finding_term:
    preferred_term: hyperkeratosis with acanthosis
    term:
      id: NCIT:C35541
      label: Hyperkeratosis
  evidence:
  - reference: PMID:21753784
    reference_title: "Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Baseline biopsy sections of skin lesions from both patients prior to
      treatment showed marked hyperkeratosis and acanthosis with absence of the
      granular layer and dermal foam cells
    explanation: >-
      Reports the light-microscopic findings in lesional skin from both patients,
      including the dermal foam cells.

- name: Verruciform xanthoma-like change in the CHILD nevus
  description: >-
    Verruciform xanthoma-like histology can occur in the CHILD nevus, together with psoriasiform changes. It is not specific enough to establish the diagnosis by itself. A prominent vulvar and inner-thigh lesion required debulking in one patient in the topical-treatment report.
  diagnostic: false
  finding_term:
    preferred_term: verruciform xanthoma-like change
  evidence:
  - reference: PMID:7640190
    reference_title: "Epidermal nevus syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The associated CHILD nevus shows unique features such as a diffuse form of
      lateralization, ptychotropism, and microscopic changes of verruciform
      xanthoma.
    explanation: >-
      The review describes verruciform xanthoma-like changes in CHILD nevi; the finding is not diagnostic by itself.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:16776722
    reference_title: "Abnormal lamellar granules in a case of CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The histology shared many features with verruciform xanthoma.
    explanation: >-
      Independent case confirmation of the verruciform xanthoma resemblance.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: this is a nonspecific histopathologic finding that can be seen in other entities but may help distinguish CHILD nevi from other psoriasiform lesions on histopathology.
    explanation: GeneReviews explicitly limits the specificity of verruciform xanthoma-like histology.
- name: Abnormal lamellar granules on electron microscopy
  description: >-
    Ultrastructurally the lesion is a lipid secretory failure. Vesicular
    structures appear in the intercellular spaces of the stratum corneum and
    vacuoles in the upper prickle cell layer, some recognizable as abnormal
    lamellar granules, with large vacuoles inside the foamy cells of the
    papillary dermis. This is the electron-microscopic counterpart of the
    lamellar body secretory defect modelled in the pathophysiology, observed in
    a separate patient and laboratory from the treatment study.
  finding_term:
    preferred_term: abnormal epidermal lamellar granules
  evidence:
  - reference: PMID:16776722
    reference_title: "Abnormal lamellar granules in a case of CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggested that abnormal lipid metabolism involving lamellar
      granules may be responsible to the skin lesion of CHILD syndrome.
    explanation: >-
      States the authors' interpretation linking the ultrastructural finding to
      the lipid-metabolic lesion, preserving the hedged form they used.

    evidence:
    - reference: PMID:11907515
      reference_title: "A novel missense mutation of NSDHL in an unusual case of CHILD syndrome showing bilateral, almost symmetric involvement."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ipsilateral defects involve all skeletal structures and internal organs
        such as the brain, the lung, the heart, or the kidney.
      explanation: >-
        Supports the one-sided skeletal involvement but does not name joint
        contractures specifically, hence PARTIAL.
  - target: Scoliosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Involvement of skeletal structures confined to one side of the body
      produces asymmetric axial growth, which is the standing explanation for
      the scoliosis. The edge is at the level of the lateralized skeletal
      involvement rather than a specific vertebral mechanism.
    evidence:
    - reference: PMID:11907515
      reference_title: "A novel missense mutation of NSDHL in an unusual case of CHILD syndrome showing bilateral, almost symmetric involvement."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ipsilateral defects involve all skeletal structures and internal organs
        such as the brain, the lung, the heart, or the kidney.
      explanation: >-
        Supports the one-sided skeletal involvement but says nothing about
        scoliosis specifically, hence PARTIAL.
  evidence:
  - reference: PMID:21753784
    reference_title: "Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The unusual lateralization of abnormalities in CHILD syndrome reflects
      selective clearance of keratinocytes and fibroblasts that express the mutant
      allele from the unaffected side.
    explanation: >-
      States the cell-level result that clinically normal skin is normal because
      the mutant-expressing cells are gone from it.
  - reference: PMID:19631568
    reference_title: "Developmental expression pattern of the cholesterogenic enzyme NSDHL and negative selection of NSDHL-deficient cells in the heterozygous Bpa(1H)/+ mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results suggest that while NSDHL-deficient cells in the mosaic Bpa(1H)
      female are able to survive and differentiate during embryonic development,
      they are subject to negative selection over the life of the animal.
    explanation: >-
      Supplies the longitudinal evidence that clearance of mutant-expressing cells
      is a postnatal, progressive process rather than an embryonic one.

- name: Impaired Epidermal Lamellar Body Secretion and Barrier Formation
  biological_scale: TISSUE
  description: >-
    In lesional epidermis the lipid secretory apparatus is structurally
    disorganized. Lamellar bodies contain few internal lamellae, fuse prematurely
    into multivesicular bodies, and are incompletely secreted, so organelle
    contents remain entombed within corneocytes and the stratum corneum
    extracellular space is left with sparse lamellar material interspersed with
    non-lamellar vesicles. Histologically this appears as marked hyperkeratosis
    and acanthosis with loss of the granular layer and dermal foam cells. The
    severity of this secretory disruption exceeds what topical statin-induced
    cholesterol deficiency alone produces in normal skin, which is the
    ultrastructural argument that toxic intermediates and not simply cholesterol
    depletion drive the ichthyosiform phenotype.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: establishment of skin barrier
    modifier: DECREASED
    term:
      id: GO:0061436
      label: establishment of skin barrier
  - preferred_term: keratinocyte differentiation
    modifier: ABNORMAL
    term:
      id: GO:0030216
      label: keratinocyte differentiation
  downstream:
  - target: Ichthyosiform nevus
    description: >-
      The disordered lipid barrier and compensatory hyperkeratotic response
      produce the waxy, scaling, inflammatory plaques of the CHILD nevus.
  - target: Onychodystrophy and periungual hyperkeratosis
    causal_link_type: UNKNOWN
    description: >-
      The nail unit is a keratinized epidermal appendage, so the same defective
      cornification is the natural explanation for the nail changes. The
      intermediates are not established: this edge is inferred from shared
      keratinization biology and from the observation that nail changes persist
      under a therapy that clears the skin, not from any measurement made in the
      nail matrix.
  evidence:
  - reference: PMID:21753784
    reference_title: "Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ultrastructural analysis of affected skin showed evidence of both
      cholesterol depletion and toxic metabolic accumulation.
    explanation: >-
      Reports the ultrastructural finding in lesional epidermis that grounds this
      node.
  - reference: PMID:32886633
    reference_title: "Topical Cholesterol/Simvastatin Gel for the Treatment of CHILD Syndrome in an Adolescent."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital ichthyoses are a heterogeneous group of genetic skin disorders
      characterized by defects in the critical barrier function of the skin.
    explanation: >-
      Places CHILD syndrome within the barrier-defect class of congenital
      ichthyoses. This supports the barrier framing only, not the specific
      lamellar body lesion, hence PARTIAL.
  - reference: PMID:16776722
    reference_title: "Abnormal lamellar granules in a case of CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electron microscopy revealed vesicular structures in the intercellular
      spaces of the stratum corneum and vacuoles or vesicular structures in
      upper prickle cell layer. Some of them can be recognized as abnormal
      lamellar granules. Within the foamy cells in the papillary dermis, large
      vacuoles were found.
    explanation: >-
      Independent ultrastructural confirmation of the abnormal lamellar granules
      and of the dermal foam cells this description asserts, from a different
      patient and laboratory than the treatment study.

- name: Impaired Hedgehog Signal Transduction
  biological_scale: MOLECULAR
  description: >-
    Cholesterol is required for Hedgehog signal transduction, so the distal
    biosynthetic block reaches developmental patterning as well as membrane
    lipid supply. The cleanest experimental demonstration is in cerebellar
    granule cell precursors from a conditional Nsdhl mouse, where the
    proliferation defect was shown to result from defective signalling by SHH and
    was rescued by exogenous cholesterol. The same dependency is invoked for the
    persistent failure of hair growth in treated CHILD skin, where the ichthyosis
    resolves but hair does not return.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  downstream:
  - target: Ipsilateral limb hypoplasia or aplasia
    description: >-
      Hedgehog-dependent limb patterning is disrupted in the territory of
      mutant-expressing cells, contributing to the ipsilateral skeletal defects.
  - target: Alopecia of affected skin
    description: >-
      Hair follicle development is Hedgehog-dependent, which is the standing
      explanation for hair failing to return in skin that has otherwise been
      cleared by topical therapy.
  - target: Placental Labyrinth Failure and Male Lethality
    description: >-
      Hedgehog signalling is required for development of a functional
      labyrinth, and its failure is implicated in the placental pathology of
      NSDHL deficiency.
  evidence:
  - reference: PMID:25652406
    reference_title: "Analysis of hedgehog signaling in cerebellar granule cell precursors in a conditional Nsdhl allele demonstrates an essential role for cholesterol in postnatal CNS development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We replicated the granule cell precursor proliferation defect in vitro and
      demonstrate that it results from defective signaling by SHH.
    explanation: >-
      Directly demonstrates that NSDHL loss impairs Hedgehog signal transduction
      in a cholesterol-dependent manner.
  - reference: PMID:17028112
    reference_title: "Analysis of Nsdhl-deficient embryos reveals a role for Hedgehog signaling in early placental development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data strongly implicate the hedgehog signaling pathway in the
      pathogenesis of the placental defects in NSDHL deficiency and provide
      evidence for a role for the hedgehog pathway in the development of a
      functional mammalian placenta.
    explanation: >-
      Links the Hedgehog defect specifically to the placental arm of NSDHL
      deficiency.
  notes: >-
    This is a sterol-dependent Hedgehog defect and is deliberately NOT declared
    as conforming to the Hedgehog node of the ciliopathy_dysfunction module,
    whose chain runs from a basal body, transition zone, or intraflagellar
    transport lesion. CHILD syndrome has no primary ciliary assembly defect; the
    two routes converge on the same pathway from different upstream causes. Note
    also that the direct experimental evidence here is murine and comes from CNS
    tissue; the limb and hair consequences are inferences from the established
    cholesterol dependence of Hedgehog signalling rather than measurements made
    in CHILD syndrome tissue.

- name: Placental Labyrinth Failure and Male Lethality
  biological_scale: ORGANISM
  description: >-
    The prenatal male lethality that shapes the inheritance pattern appears to be
    placental rather than embryonic. In Nsdhl mutant mice, affected male embryos
    die in midgestation with no consistent anomaly in the embryo itself, but with
    a labyrinth layer that is always thinner, with fewer fetal vessels and
    decreased trophoblast proliferation. Heterozygous female placentas show the
    defect non-cell-autonomously, and Hedgehog reporter activity is markedly
    reduced or absent in affected male placentas, with failure of Indian
    hedgehog-expressing cells to migrate into the developing placenta. The
    mechanism is inferred from mouse; it has not been demonstrated in human
    conceptuses.
  cell_types:
  - preferred_term: trophoblast cell
    term:
      id: CL:0000351
      label: trophoblast cell
  biological_processes:
  - preferred_term: placenta development
    modifier: ABNORMAL
    term:
      id: GO:0001890
      label: placenta development
  evidence:
  - reference: PMID:15639195
    reference_title: "Placental defects are associated with male lethality in bare patches and striated embryos deficient in the NAD(P)H Steroid Dehydrogenase-like (NSDHL) Enzyme."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although no consistent anomalies were identified in affected male embryos
      themselves, the labyrinth layer of the fetal placenta was always thinner,
      with fewer fetal vessels and decreased proliferation of labyrinth
      trophoblast cells.
    explanation: >-
      Locates the lethal lesion in the placenta rather than the embryo.
  - reference: PMID:17028112
    reference_title: "Analysis of Nsdhl-deficient embryos reveals a role for Hedgehog signaling in early placental development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Further, affected placentas from mutant Nsdhl(Bpa-8H) male embryos
      demonstrate markedly decreased or no Ptch1-lacZ staining and no migration of
      Ihh expressing cells into the developing placenta.
    explanation: >-
      Supplies the signalling readout showing Hedgehog pathway failure in the
      affected placenta.

phenotypes:
- category: Cutaneous
  name: Ichthyosiform nevus
  description: >-
    Unilateral inflammatory, erythematous plaques topped by waxy yellow scale,
    present at birth or in the first weeks of life. New lesions can appear later
    in life. More limited lesions may follow one or more lines of Blaschko.
  phenotype_term:
    preferred_term: Ichthyosiform nevus
    term:
      id: HP:0010816
      label: Epidermal nevus
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHILD syndrome is characterized by unilateral distribution of ichthyosiform
      skin lesions and ipsilateral limb defects that range from shortening of the
      metacarpals and phalanges to absence of the entire limb.
    explanation: >-
      GeneReviews names the unilateral ichthyosiform lesion as a defining feature.
  - reference: PMID:24060582
    reference_title: "The role of abnormalities in the distal pathway of cholesterol synthesis in the Congenital Hemidysplasia with Ichthyosiform erythroderma and Limb Defects (CHILD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The CHILD syndrome skin is characterized by plaques topped by waxy scales
      and a variety of developmental defects in extracutaneous tissues,
      particularly limb hypoplasia or aplasia.
    explanation: >-
      Describes the characteristic morphology of the plaques.
  notes: >-
    Bound to HP:0010816 (Epidermal nevus) rather than HP:0008064 (Ichthyosis).
    The lesion is genuinely ichthyosiform, but it is a localized, mosaic,
    unilateral nevus, not a generalized disorder of cornification, and the
    nevoid character is what discriminates it; the classic delineation places
    the CHILD nevus among the epidermal nevus syndromes. HP:0034275 (Verrucous
    epidermal nevus) was considered and not used, since the verrucous quality is
    reported in some lesions rather than being a general property of the CHILD
    nevus. The ichthyosiform quality is carried by the preferred_term.
    Separately, no frequency band is asserted. The lesion is effectively
    definitional, and grading a defining feature as VERY_FREQUENT on the
    strength of the phrase "is characterized by" would be circular rather than
    evidenced. There is no published CHILD syndrome cohort with a denominator
    from which a real band could be derived.

- category: Cutaneous
  name: Strict midline demarcation of skin lesions
  description: >-
    The cutaneous lesions typically stop abruptly at the body midline, a
    lateralization far sharper than the Blaschko-line mosaicism seen in other
    X-linked genodermatoses, and it is the single most distinctive clinical sign
    of the syndrome. It is a strong tendency rather than a rule: an exceptional
    patient with a molecularly confirmed NSDHL variant had an almost symmetric
    bilateral CHILD nevus, and bilateral involvement should not be taken to
    exclude the diagnosis.
  phenotype_term:
    preferred_term: strict midline demarcation of the cutaneous eruption
  evidence:
  - reference: PMID:10710235
    reference_title: "Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an inflammatory nevus with striking lateralization and strict midline
      demarcation, as well as ipsilateral hypoplasia of the body
    explanation: >-
      States the midline demarcation of the nevus, which is the claim this
      phenotype makes.
  - reference: PMID:7408908
    reference_title: "The CHILD syndrome. Congenital hemidysplasia with ichthyosiform erythroderma and limb defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The syndrome is characterized by unilateral erythema and scaling, with a
      distinct demarcation in the middle of the trunk.
    explanation: >-
      The original delineation locates the demarcation anatomically, at the
      middle of the trunk.
  - reference: PMID:11907515
    reference_title: "A novel missense mutation of NSDHL in an unusual case of CHILD syndrome showing bilateral, almost symmetric involvement."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A symmetric distribution of this nevus can exceptionally be seen in
      patients with CHILD syndrome, and this bilateral involvement should not
      mislead the clinician to any other diagnosis.
    explanation: >-
      Qualifies rather than supports the lateralization claim, documenting the
      exception that makes midline demarcation typical but not obligatory.
  notes: >-
    No ontology term is bound, deliberately. HPO has no term for strict midline
    demarcation of a cutaneous eruption. HP:0100555 (Asymmetric growth) was used
    here previously and has been removed: it describes asymmetry of body growth,
    not the distribution of a skin lesion, so it is a cross-category proxy
    rather than a merely broad parent, and no term is better than a misleading
    one. That term now sits on the separate `Ipsilateral body hypoplasia`
    phenotype, which it genuinely fits. HP:0025293 (Distributed along Blaschko
    lines) is explicitly not a substitute, since the whole point of this
    phenotype is that the demarcation is sharper than Blaschko mosaicism.

- category: Skeletal
  name: Ipsilateral body hypoplasia
  description: >-
    Hemidysplasia, the H in the acronym: hypoplasia of one side of the body,
    involving skeletal structures and internal organs on the same side as the
    cutaneous eruption. This is the body-growth asymmetry, distinct from both
    the distribution of the skin lesion and the limb-specific defect below.
  phenotype_term:
    preferred_term: Asymmetric growth
    term:
      id: HP:0100555
      label: Asymmetric growth
  evidence:
  - reference: PMID:10710235
    reference_title: "Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an inflammatory nevus with striking lateralization and strict midline
      demarcation, as well as ipsilateral hypoplasia of the body
    explanation: >-
      States the ipsilateral hypoplasia of the body, which is the asymmetric
      growth this term describes.
  - reference: PMID:7408908
    reference_title: "The CHILD syndrome. Congenital hemidysplasia with ichthyosiform erythroderma and limb defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, ipsilateral hypoplasia of other parts of the skeleton, as well
      as defects of the brain and the viscera are found.
    explanation: >-
      Extends the ipsilateral hypoplasia beyond the limbs to the rest of the
      skeleton and the viscera.

- category: Skeletal
  name: Ipsilateral limb hypoplasia or aplasia
  description: >-
    Limb defects on the same side as the skin lesions, ranging in severity from
    shortening of metacarpals and phalanges through to absence of the entire
    limb. Severe cases have required amputation of a rudimentary limb in early
    childhood to permit prosthetic fitting.
  phenotype_term:
    preferred_term: Aplasia/hypoplasia involving bones of the extremities
    term:
      id: HP:0045060
      label: Aplasia/hypoplasia involving bones of the extremities
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      unilateral distribution of ichthyosiform skin lesions and ipsilateral limb
      defects that range from shortening of the metacarpals and phalanges to
      absence of the entire limb
    explanation: >-
      GeneReviews states the ipsilateral limb defect and its severity range as a
      defining characteristic.

- category: Cutaneous
  name: Onychodystrophy and periungual hyperkeratosis
  description: >-
    Nail dystrophy with hyperkeratosis of the periungual skin is a common
    accompaniment of the cutaneous phenotype. Nails respond poorly to topical
    pathogenesis-based therapy, plausibly because the compounded lotion cannot
    penetrate the nail plate.
  phenotype_term:
    preferred_term: Nail dystrophy
    term:
      id: HP:0008404
      label: Nail dystrophy
  frequency: FREQUENT
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Onychodystrophy and periungual hyperkeratosis are common.
    explanation: >-
      GeneReviews states both the finding and a qualitative frequency. "Common"
      is the literature term the curation SOP maps to the FREQUENT band.

- category: Cutaneous
  name: Alopecia of affected skin
  description: >-
    Hair does not grow in affected territory, and notably does not return even
    after topical cholesterol and statin therapy has otherwise normalized the
    skin. This dissociation is read as evidence that hair follicle development
    requires cholesterol-dependent Hedgehog signalling, a requirement that
    restoring the barrier does not retrospectively satisfy.
  phenotype_term:
    preferred_term: Alopecia
    term:
      id: HP:0001596
      label: Alopecia
  evidence:
  - reference: PMID:21753784
    reference_title: "Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By 6 months, treated skin largely normalized, but did not grow hair
    explanation: >-
      Reports the persistence of alopecia despite otherwise successful treatment.

- category: Skeletal
  name: Stippled epiphyseal calcification
  description: >-
    Punctate calcification of cartilaginous structures may be seen in infancy, a
    radiographic finding shared with the other X-linked sterol biosynthesis
    disorder CDPX2 and the reason CHILD syndrome is classified under
    chondrodysplasia punctata in MONDO.
  phenotype_term:
    preferred_term: Stippled chondral calcification
    term:
      id: HP:0002764
      label: Stippled chondral calcification
  evidence:
  - reference: PMID:10710233
    reference_title: "CHILD syndrome caused by deficiency of 3beta-hydroxysteroid-delta8, delta7-isomerase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHILD (congenital hemidysplasia, ichthyosis, and limb defects) syndrome is
      a rare, usually sporadic disorder associated with unilateral distribution of
      ichthyosiform skin lesions, limb defects, punctate calcifications of
      cartilaginous structures, and visceral anomalies.
    explanation: >-
      Names punctate calcification of cartilaginous structures among the
      characteristic features.

- category: Skeletal
  name: Scoliosis
  description: >-
    Scoliosis and joint contractures occur and are managed with bracing or
    corrective surgery. Severe lumbar scoliosis was documented in one of the two
    patients in the pathogenesis-based therapy report.
  phenotype_term:
    preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Scoliosis and joint contractures are treated with braces and/or corrective
      surgery.
    explanation: >-
      A management statement, so it presupposes rather than reports the
      occurrence of scoliosis in CHILD syndrome. PARTIAL for that reason.

- category: Cardiovascular
  name: Cardiac malformation
  description: >-
    Structural heart malformations occur as part of the visceral involvement and
    warrant surveillance.
  phenotype_term:
    preferred_term: Abnormal heart morphology
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heart, lung, and kidney malformations can also occur.
    explanation: >-
      GeneReviews states the visceral malformations. No frequency band is
      asserted, because "can also occur" is weaker than any of the qualitative
      terms the frequency SOP maps to a band.

- category: Renal
  name: Kidney malformation
  description: >-
    Renal malformations are part of the visceral spectrum and are monitored on
    surveillance.
  phenotype_term:
    preferred_term: Abnormal kidney morphology
    term:
      id: HP:0012210
      label: Abnormal renal morphology
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heart, lung, and kidney malformations can also occur.
    explanation: >-
      GeneReviews states kidney malformation among the visceral anomalies.

- category: Respiratory
  name: Lung malformation
  description: >-
    Pulmonary malformations belong to the same ipsilateral visceral spectrum as
    the cardiac and renal anomalies, and GeneReviews names the lung alongside
    them. The original clinical delineation likewise recorded ipsilateral
    defects of the viscera generally rather than enumerating pulmonary lesions,
    so the anatomy is recorded at the level the sources actually support.
  phenotype_term:
    preferred_term: Abnormal lung morphology
    term:
      id: HP:0002088
      label: Abnormal lung morphology
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heart, lung, and kidney malformations can also occur.
    explanation: >-
      GeneReviews names the lung among the organs that may be malformed, on the
      same footing as the heart and kidney.

- category: Musculoskeletal
  name: Joint contracture
  description: >-
    Joint contractures occur with the skeletal involvement and, like scoliosis,
    are managed with bracing or corrective surgery and tracked on surveillance.
  phenotype_term:
    preferred_term: Joint contracture
    term:
      id: HP:0034392
      label: Joint contracture
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      monitor for new cutaneous lesions, musculoskeletal deformities such as
      scoliosis and joint contractures, and neurologic, cardiac, and/or kidney
      manifestations annually or as needed
    explanation: >-
      GeneReviews names joint contractures among the musculoskeletal deformities
      that warrant ongoing monitoring in CHILD syndrome.

- category: Neurological
  name: Normal intellect
  description: >-
    Intellect is usually normal in CHILD syndrome. This is a deliberate negative
    characterization and is the sharpest clinical separator from the allelic
    NSDHL disorder in males, CK syndrome, which is defined by cognitive
    impairment, seizures, and cortical malformation.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      absence of the entire limb. Intellect is usually normal.
    explanation: >-
      GeneReviews states that intellect is usually normal in CHILD syndrome, which
      refutes intellectual disability as a feature of this entity.

prevalence:
- population: Worldwide, published case literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No cohort, registry, or population study exists, so no rate can be given.
    The original 1980 delineation assembled twenty observations in total, two
    new plus eighteen reviewed, and the published total has since grown into the
    low hundreds. The figure of one in 100,000 that circulates in review
    literature has no traceable denominator and is inconsistent with that case
    count, so it is deliberately not recorded here. The same series gives the
    female-to-male ratio as 19:1, which is a consequence of male lethality
    rather than an independent epidemiological finding.
  evidence:
  - reference: PMID:7408908
    reference_title: "The CHILD syndrome. Congenital hemidysplasia with ichthyosiform erythroderma and limb defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two further cases of this syndrome are reported, and a review of 18
      previous observations is presented. The ratio of females to males is 19 :
      1.
    explanation: >-
      Supplies the literature case count behind the CASES_IN_LITERATURE measure
      and the sex ratio, which is the only quantitative epidemiology available.

histopathology:
- name: Psoriasiform hyperkeratosis and acanthosis with loss of the granular layer
  description: >-
    Lesional skin shows marked hyperkeratosis and acanthosis with absence of the
    granular layer, together with foam cells in the dermis. This is the routine
    light-microscopic picture, and it reverses on effective pathogenesis-based
    therapy: after three months of topical cholesterol plus lovastatin the
    epidermis was largely normal with a prominent granular layer and
    orthokeratotic scale.
  finding_term:
    preferred_term: hyperkeratosis with acanthosis
    term:
      id: NCIT:C35541
      label: Hyperkeratosis
  evidence:
  - reference: PMID:21753784
    reference_title: "Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Baseline biopsy sections of skin lesions from both patients prior to
      treatment showed marked hyperkeratosis and acanthosis with absence of the
      granular layer and dermal foam cells
    explanation: >-
      Reports the light-microscopic findings in lesional skin from both patients,
      including the dermal foam cells.

- name: Verruciform xanthoma-like change in the CHILD nevus
  description: >-
    The CHILD nevus is not histologically generic. Alongside the psoriasiform
    changes it shows the microscopic features of verruciform xanthoma, which
    together with the diffuse lateralization and ptychotropism (a predilection
    for body folds) is what distinguishes it from the other epidermal nevus
    syndromes. This is a lesion that can grow, not only a microscopic
    descriptor: one of the two patients in the topical therapy report developed
    a frank verruciform xanthoma of the vulva and inner thigh that required
    debulking.
  diagnostic: true
  finding_term:
    preferred_term: verruciform xanthoma-like change
  evidence:
  - reference: PMID:7640190
    reference_title: "Epidermal nevus syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The associated CHILD nevus shows unique features such as a diffuse form of
      lateralization, ptychotropism, and microscopic changes of verruciform
      xanthoma.
    explanation: >-
      Names the histological triad that identifies the CHILD nevus among the
      epidermal nevus syndromes, which is what makes this finding diagnostic.
  - reference: PMID:16776722
    reference_title: "Abnormal lamellar granules in a case of CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The histology shared many features with verruciform xanthoma.
    explanation: >-
      Independent case confirmation of the verruciform xanthoma resemblance.
  notes: >-
    No ontology term is bound. HP:0000991 (Xanthomatosis) is not a member of the
    HistopathologyFindingTerm enum, and the nearest NCIT candidate,
    NCIT:C221710 Cutaneous Xanthomatous Alteration, is not reachable from
    NCIT:C83490 (Histopathology Result) either. Binding instead to the generic
    hyperkeratosis or acanthosis terms would attach the label to the least
    distinctive part of the finding, so the free-text preferred_term carries it.

- name: Abnormal lamellar granules on electron microscopy
  description: >-
    Ultrastructurally the lesion is a lipid secretory failure. Vesicular
    structures appear in the intercellular spaces of the stratum corneum and
    vacuoles in the upper prickle cell layer, some recognizable as abnormal
    lamellar granules, with large vacuoles inside the foamy cells of the
    papillary dermis. This is the electron-microscopic counterpart of the
    lamellar body secretory defect modelled in the pathophysiology, observed in
    a separate patient and laboratory from the treatment study.
  finding_term:
    preferred_term: abnormal epidermal lamellar granules
  evidence:
  - reference: PMID:16776722
    reference_title: "Abnormal lamellar granules in a case of CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggested that abnormal lipid metabolism involving lamellar
      granules may be responsible to the skin lesion of CHILD syndrome.
    explanation: >-
      States the authors' interpretation linking the ultrastructural finding to
      the lipid-metabolic lesion, preserving the hedged form they used.
  notes: >-
    No ontology term is bound. There is no NCIT ultrastructural-finding term for
    abnormal epidermal lamellar granules, and the available broader terms would
    lose the organelle-level specificity that is the entire content of the
    finding.

progression:
- phase: Postnatal improvement of cutaneous lesions
  notes: >-
    Skin lesions tend to become less inflammatory over childhood. The mechanistic
    account for this is the progressive negative selection of mutant-expressing
    cells demonstrated in the heterozygous Bpa(1H) mouse, in which the mutant
    fraction in liver fell from roughly half at postnatal day 6 to roughly a
    fifth by one year. The corresponding longitudinal measurement has not been
    made in human CHILD syndrome skin, so the human natural history is described
    clinically while the mechanism behind it is murine.
  evidence:
  - reference: PMID:19631568
    reference_title: "Developmental expression pattern of the cholesterogenic enzyme NSDHL and negative selection of NSDHL-deficient cells in the heterozygous Bpa(1H)/+ mouse."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the liver, the proportion of NSDHL negative cells dropped from
      approximately 50% at postnatal day 6 to approximately 20% at one year of
      age.
    explanation: >-
      Quantifies the postnatal depletion of mutant-expressing cells in the mouse.
      PARTIAL because the measurement is murine hepatic, not human cutaneous, and
      so supports the mechanism rather than the clinical course directly.

biochemical:
- name: Methylsterol accumulation in affected tissue
  presence: INCREASED
  notes: >-
    Sterol intermediates immediately above the enzymatic block accumulate in
    affected tissue. An important negative is that this is a tissue rather than a
    plasma finding: serum sterol profiles in CHILD syndrome and in the mouse
    models are near-normal, with only minimal elevation of intermediates, because
    functional mosaicism and skewed X inactivation mean most of the body outside
    the lesions is expressing the normal allele. Plasma sterol analysis therefore
    does not reliably diagnose or exclude the condition. The one exception is
    diagnostically useful in the opposite direction: a CHILD-like patient with
    raised plasma 8-dehydrocholesterol and 8(9)-cholestenol has the EBP sterol
    signature, not the NSDHL one, and should be investigated for a CDPX2-locus
    variant.
  evidence:
  - reference: PMID:24060582
    reference_title: "The role of abnormalities in the distal pathway of cholesterol synthesis in the Congenital Hemidysplasia with Ichthyosiform erythroderma and Limb Defects (CHILD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      which leads to inhibition of cholesterol synthesis and accumulation of toxic
      metabolic intermediates in affected tissues
    explanation: >-
      States the accumulation of intermediates and localizes it to affected
      tissues rather than the circulation.
  - reference: PMID:10369263
    reference_title: "The gene mutated in bare patches and striated mice encodes a novel 3beta-hydroxysteroid dehydrogenase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Quantitative analysis of sterols from tissues of affected Bpa mice support a
      role for Nsdhl in cholesterol biosynthesis.
    explanation: >-
      Reports the tissue sterol measurements in the mouse counterpart of the
      disorder.

- name: Plasma 8-dehydrocholesterol and 8(9)-cholestenol elevation in the EBP-related minority
  presence: INCREASED
  notes: >-
    This is the EBP (CDPX2-locus) biochemical signature, not the NSDHL one, and
    it is recorded here because it distinguishes the two routes to a CHILD
    phenotype at the bench. A patient with a clinical CHILD diagnosis and this
    plasma pattern was found to carry an EBP nonsense variant. Do not treat these
    analytes as a screening test for CHILD syndrome in general; NSDHL-related
    disease does not produce them.
  evidence:
  - reference: PMID:10710233
    reference_title: "CHILD syndrome caused by deficiency of 3beta-hydroxysteroid-delta8, delta7-isomerase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we measured plasma sterols in a patient with CHILD syndrome and found
      levels of 8-dehydrocholesterol and 8(9)-cholestenol increased to the same
      degree as in CDPX2 patients
    explanation: >-
      Reports the plasma sterol measurement in the EBP-related patient.

diagnosis:
- name: NSDHL molecular genetic testing
  description: >-
    The diagnosis is established in a female proband by identifying a
    heterozygous NSDHL pathogenic variant. This is the definitive test, and it
    is also what makes carrier identification and prenatal or preimplantation
    testing possible in the family. Sequence analysis alone is not a sufficient
    strategy, though: multi-exon deletions and microdeletions are described as
    not rare in CHILD syndrome and are invisible to classical Sanger sequencing,
    so gene-targeted deletion and duplication analysis belongs alongside it.
    A negative sequencing result therefore means "not detected by this assay"
    rather than "not CHILD syndrome". Reported cases include a deletion of NSDHL
    exons 3 and 4, and structural variants at Xq28 spanning exon-containing
    regions have been resolved by optical genome mapping in patients whose
    conventional genetic work-up was inconclusive.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CHILD syndrome is established in a female proband with a
      heterozygous NSDHL pathogenic variant identified by molecular genetic
      testing that results in loss of functional decarboxylating
      sterol-4-alpha-carboxylate 3-dehydrogenase, the protein encoded by NSDHL.
    explanation: >-
      GeneReviews states the diagnostic criterion.
  - reference: PMID:29341259
    reference_title: "CHILD syndrome mimicking verrucous nevus in a Chinese patient responded well to the topical therapy of compound of simvastatin and cholesterol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple exons deletions or microdeletion was not rare in CHILD syndrome.
      Classical Sanger sequencing may not be useful enough to find all kinds of
      mutations. Next-generation sequencing may be more effective.
    explanation: >-
      States the assay blind spot directly, and the same report supplies the
      worked example, a large deletion of NSDHL exons 3 and 4.
  - reference: PMID:41625319
    reference_title: "Diagnostic Utility of Optical Genome Mapping in X-Linked Dominant Genodermatoses: Incontinentia Pigmenti and CHILD Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified structural variants consisted of deletions of varying sizes
      in the Xq28 cytoband, encompassing regions that contain exons.
    explanation: >-
      Second source for the same gap, from the other end. The cohort was
      pediatric patients with a compatible phenotype whose conventional genetic
      studies were inconclusive, and this is what optical genome mapping then
      found in them: exon-containing deletions at Xq28, the NSDHL locus. Quoted
      from the reported result rather than from the study's stated aim.

- name: Sterol profiling of skin flakes and plasma
  description: >-
    Sterol analysis is the biochemical confirmatory test, and the tissue it is
    run on matters. In a reported case, analysis of skin flakes showed a
    mono 4-alpha methyl sterol also detectable in plasma, plus
    4-alpha-carboxy-4-methyl-cholest-8(9)-en-3beta-ol and several keto-sterols
    normally below the limit of detection, a pattern consistent with a defective
    4-alpha-methylsterol-4-demethylase complex. Its practical value is
    demonstrated by that same case: the pattern was what allowed an NSDHL
    variant of uncertain significance to be reclassified as likely pathogenic.
    Note the limits recorded in the biochemical section, though, since plasma
    sterols are frequently near-normal because functional mosaicism leaves most
    of the body expressing the wild-type allele.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:33139364
    reference_title: "Novel NSDHL gene variant for congenital hemidysplasia with ichthyosiform erythroderma and limb defects (CHILD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sterol analysis from skin flakes revealed increased levels of a mono
      4-alpha methyl sterol also seen in plasma as well as the presence of
      4-alpha-carboxy-4-methyl-cholest-8(9)-en-3beta-ol and several keto-sterols,
      which are usually below the limit of detection. This sterol pattern is
      consistent with abnormal function of the 4-alpha-methylsterol-4-demethylase
      complex.
    explanation: >-
      Reports the sterol pattern and its interpretation as evidence of the
      enzymatic block.
  - reference: PMID:33139364
    reference_title: "Novel NSDHL gene variant for congenital hemidysplasia with ichthyosiform erythroderma and limb defects (CHILD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On this basis, this variant has been reclassified as likely pathogenic.
    explanation: >-
      Documents the concrete diagnostic use of the sterol result, resolving a
      variant of uncertain significance.

treatments:
- name: Topical Cholesterol plus Statin (Pathogenesis-Based Therapy)
  description: >-
    Twice-daily topical application of a compounded lotion containing cholesterol
    together with an HMG-CoA reductase inhibitor (lovastatin or simvastatin) is
    the pathogenesis-directed treatment of the cutaneous disease. It addresses
    both arms of the biochemical lesion at once: cholesterol replaces the missing
    end product, and the statin shuts off flux into the pathway so the toxic
    methylsterol intermediates are not generated. The design is validated by the
    negative control within the same study, since topical cholesterol alone
    produced no improvement. Lesions clear over weeks to months, with histological
    and ultrastructural normalization, and the effect is maintained on
    reduced-frequency dosing. Hair growth and onychodystrophy do not recover.
    Note the evidence ceiling: every report is an uncontrolled case series of one
    or two patients, with the publication bias that implies, and there has been
    no trial. Systemic absorption and long-term safety of compounded topical
    statins applied to large body-surface areas in infants have not been studied.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholesterol
      term:
        id: CHEBI:16113
        label: cholesterol
    - preferred_term: lovastatin
      term:
        id: CHEBI:40303
        label: lovastatin
    - preferred_term: simvastatin
      term:
        id: CHEBI:9150
        label: simvastatin
  target_mechanisms:
  - target: Blocked C4-Demethylation with Cholesterol Deficiency and Methylsterol Accumulation
    treatment_effect: INHIBITS
    description: >-
      The statin component suppresses flux through HMG-CoA reductase so that
      intermediates above the NSDHL block are not generated, while the
      cholesterol component supplies the missing end product. The combination
      therefore acts on both arms of this node.
    evidence:
    - reference: PMID:21753784
      reference_title: "Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        On the basis of the putative pathogenic role of both pathway-product
        deficiency of cholesterol and accumulation of toxic metabolic
        intermediates, we assessed the efficacy of combined therapy with lovastatin
        and cholesterol.
      explanation: >-
        States the mechanistic rationale linking the two drug components to the two
        arms of the biochemical block.
  evidence:
  - reference: PMID:21753784
    reference_title: "Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Topical treatment with lovastatin/cholesterol (but not cholesterol alone)
      virtually cleared skin lesions by 3 months, accompanied by histological and
      ultrastructural normalization of epidermal structure and lipid secretion.
    explanation: >-
      Reports the therapeutic result together with the cholesterol-alone negative
      control that establishes the combination is required.
  - reference: PMID:25845514
    reference_title: "CHILD Syndrome: Successful Treatment of Skin Lesions with Topical Simvastatin/Cholesterol Ointment--A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the case of a 10-year-old girl treated with topical simvastatin
      and cholesterol ointment, after which her skin lesions significantly improved
      within the first 30 days of treatment.
    explanation: >-
      Independent case replication using simvastatin in place of lovastatin.
  - reference: PMID:31365666
    reference_title: "CHILD syndrome: successful treatment of skin lesions with topical lovastatin and cholesterol lotion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The authors report a 2-month-old patient presenting with typical features of
      CHILD syndrome that was treated with a topical solution containing
      cholesterol and lovastatin, with complete clearance of her CHILD nevus.
    explanation: >-
      Further independent replication, and at the youngest reported age of
      treatment.

- name: Symptomatic Topical Care
  description: >-
    Emollients, keratolytics such as lactic acid creams for itching, urea creams
    for dryness, topical corticosteroids, and oral or topical ketoconazole have
    all been used. GeneReviews is explicit that no single therapy ameliorates the
    cutaneous findings in every affected individual, and the two patients in the
    pathogenesis-based therapy report had each failed years of emollients,
    keratolytics, retinoids, corticosteroids, calcineurin inhibitors, or
    cryotherapy before responding to cholesterol plus statin. This entry is
    retained as the historical standard of care rather than as a recommended
    first choice.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ketoconazole
      term:
        id: CHEBI:47519
        label: ketoconazole
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In CHILD syndrome, no one therapy described to date appears to ameliorate
      the cutaneous findings for every reported individual. Oral and topical
      ketoconazole may reduce lesions.
    explanation: >-
      Documents the symptomatic options while stating the limitation that none
      works universally, hence PARTIAL.

- name: Skin Grafting from the Unaffected Side
  description: >-
    Full-thickness grafting of skin taken from the contralateral unaffected
    region onto an inflammatory nevus has been successful. The mosaic account of
    the disease predicts why: donor skin from the unaffected side is populated by
    keratinocytes and fibroblasts expressing only the wild-type allele, so the
    graft is genetically competent to build a normal barrier in its new location.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Skin Transplantation
    term:
      id: NCIT:C15325
      label: Skin Transplantation
  target_mechanisms:
  - target: X-Inactivation Mosaicism and Negative Selection of Mutant-Expressing Cells
    treatment_effect: BYPASSES
    description: >-
      Grafting replaces mutant-expressing epidermis with wild-type-expressing
      epidermis, bypassing rather than correcting the mosaic distribution.
    evidence:
    - reference: PMID:21290788
      reference_title: "NSDHL-Related Disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment of an inflammatory nevus by grafting skin obtained from a
        contralateral unaffected region has been successful.
      explanation: >-
        Reports the intervention and its dependence on an unaffected-side donor
        site, which is what makes it a mosaic-bypassing strategy.
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of an inflammatory nevus by grafting skin obtained from a
      contralateral unaffected region has been successful.
    explanation: >-
      GeneReviews records grafting as an effective option for a localized
      inflammatory nevus.

- name: Orthopedic and Rehabilitative Management of the Limb and Spine Defects
  description: >-
    The skeletal side of the disease is managed mechanically, not
    pharmacologically: scoliosis and joint contractures with bracing or
    corrective surgery, and severe limb hypoplasia with amputation of a
    rudimentary limb where that permits prosthetic fitting. This arm of care is
    entirely untouched by the topical therapy that clears the skin, which is
    worth stating plainly because the pathogenesis-based treatment is sometimes
    described as if it addressed the syndrome rather than its cutaneous
    component.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Orthopedic Surgical Procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Scoliosis and joint contractures are treated with braces and/or corrective
      surgery.
    explanation: >-
      GeneReviews states the orthopedic management of the axial and joint
      deformities.

- name: Long-Term Surveillance
  description: >-
    Because the disease is multisystem and lesions can appear after infancy,
    management includes scheduled monitoring rather than one-time assessment:
    new cutaneous lesions, musculoskeletal deformity, and neurologic, cardiac,
    and kidney manifestations are reviewed annually or as needed. This is the
    care pathway through which the visceral phenotypes curated above are
    actually detected.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In CHILD syndrome, monitor for new cutaneous lesions, musculoskeletal
      deformities such as scoliosis and joint contractures, and neurologic,
      cardiac, and/or kidney manifestations annually or as needed.
    explanation: >-
      GeneReviews states the surveillance schedule and the organ systems it
      covers.

- name: Genetic Counseling
  description: >-
    Counseling addresses the X-linked transmission and the distorted live-born
    ratios that follow from male lethality. Once the familial NSDHL variant is
    known, prenatal and preimplantation genetic testing are possible, and
    heterozygous female relatives can be identified.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once the NSDHL pathogenic variant has been identified in a family member
      with an NSDHL-related disorder, prenatal and preimplantation genetic testing
      are possible.
    explanation: >-
      States the reproductive testing options that counseling is built around.

animal_models:
- name: Bare patches and striated mice (Nsdhl mutant)
  species: Mouse
  genotype: Nsdhl mutant alleles Bpa and Str, X-linked dominant male-lethal
  publication: PMID:10369263
  description: >-
    Bare patches (Bpa) and striated (Str) are allelic X-linked dominant,
    male-lethal mouse mutations in Nsdhl, and were the first mammalian locus
    associated with such a phenotype. They reproduce the male lethality, the
    cholesterol biosynthetic defect, and the mosaic negative selection of
    mutant-expressing cells. They do not reproduce the lateralization of human
    CHILD syndrome, which is the single most distinctive human feature.
  genes:
  - preferred_term: NSDHL
    term:
      id: hgnc:13398
      label: NSDHL
  evidence:
  - reference: PMID:10710235
    reference_title: "Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They provide animal models for the study of CHILD syndrome, a further human
      condition due to mutations in a gene of the cholesterol synthesis pathway.
    explanation: >-
      The human gene-discovery paper explicitly nominates these mouse mutants as
      models for CHILD syndrome, which is the model-level claim.
  modeled_mechanisms:
  - target: NSDHL Loss of Function
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Independent Bpa and Str alleles are mutations in Nsdhl, and tissue sterol
      analysis confirms the biosynthetic role.
    limitations: >-
      The mouse skin phenotype is patterned as patches and stripes rather than the
      lateralized, midline-demarcated distribution seen in humans, so the model is
      informative for the enzymatic lesion but not for the lateralization.
    readouts:
    - name: Tissue sterol profile in affected Bpa mice
      target: NSDHL Loss of Function
      direction: ALTERED
      interpretation: >-
        Quantitative tissue sterol analysis is the biochemical correlate of the
        enzymatic block in this model.
      evidence:
      - reference: PMID:10369263
        reference_title: "The gene mutated in bare patches and striated mice encodes a novel 3beta-hydroxysteroid dehydrogenase."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Quantitative analysis of sterols from tissues of affected Bpa mice
          support a role for Nsdhl in cholesterol biosynthesis.
        explanation: >-
          Reports the sterol measurement underlying this readout.
    evidence:
    - reference: PMID:10369263
      reference_title: "The gene mutated in bare patches and striated mice encodes a novel 3beta-hydroxysteroid dehydrogenase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we report mutations in one of these genes, Nsdhl, encoding an NAD(P)H
        steroid dehydrogenase-like protein, in two independent Bpa and three
        independent Str alleles.
      explanation: >-
        Establishes that these mouse mutants carry lesions in the orthologous gene.
  - target: X-Inactivation Mosaicism and Negative Selection of Mutant-Expressing Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Heterozygous Bpa(1H) females are mosaic for NSDHL expression through normal
      random X inactivation, and their mutant clones are progressively depleted
      after birth, giving the human clearance model a longitudinal grounding it
      cannot get from single human biopsies.
    limitations: >-
      The clonal patterning is patches and stripes rather than a body-half
      boundary, so the model supports the selection process but not the geometry.
      The quantitative depletion was measured in liver and brain rather than skin.
    readouts:
    - name: Fraction of NSDHL-negative cells in liver over the first year
      target: X-Inactivation Mosaicism and Negative Selection of Mutant-Expressing Cells
      direction: DECREASED
      interpretation: >-
        A falling mutant fraction with age is the direct measurement of negative
        selection against NSDHL-deficient cells.
      evidence:
      - reference: PMID:19631568
        reference_title: "Developmental expression pattern of the cholesterogenic enzyme NSDHL and negative selection of NSDHL-deficient cells in the heterozygous Bpa(1H)/+ mouse."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In the liver, the proportion of NSDHL negative cells dropped from
          approximately 50% at postnatal day 6 to approximately 20% at one year of
          age.
        explanation: >-
          Reports the quantitative measurement behind this readout.
    evidence:
    - reference: PMID:19631568
      reference_title: "Developmental expression pattern of the cholesterogenic enzyme NSDHL and negative selection of NSDHL-deficient cells in the heterozygous Bpa(1H)/+ mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygous Bpa(1H) females are mosaic for NSDHL expression due to normal
        random X-inactivation.
      explanation: >-
        Establishes that the heterozygous mouse reproduces the functional
        mosaicism that this node describes.
  - target: Placental Labyrinth Failure and Male Lethality
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Affected male embryos die in midgestation with a thin, poorly vascularized
      placental labyrinth and reduced trophoblast proliferation, and with loss of
      Hedgehog reporter activity in the affected placenta.
    limitations: >-
      Human male conceptuses are not available for study, so the placental
      mechanism of male lethality is inferred from mouse and has not been
      confirmed in human material. Rodent placental X inactivation is imprinted in
      most lineages rather than random, which is not the human arrangement, so the
      lineage logic behind the heterozygous female placental phenotype may not
      transfer.
    readouts:
    - name: Placental labyrinth thickness and fetal vessel density
      target: Placental Labyrinth Failure and Male Lethality
      direction: DECREASED
      interpretation: >-
        Structural correlate of the placental failure that accompanies male
        lethality.
      evidence:
      - reference: PMID:15639195
        reference_title: "Placental defects are associated with male lethality in bare patches and striated embryos deficient in the NAD(P)H Steroid Dehydrogenase-like (NSDHL) Enzyme."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the labyrinth layer of the fetal placenta was always thinner, with fewer
          fetal vessels and decreased proliferation of labyrinth trophoblast cells
        explanation: >-
          Reports the histological measurement behind this readout.
    evidence:
    - reference: PMID:15639195
      reference_title: "Placental defects are associated with male lethality in bare patches and striated embryos deficient in the NAD(P)H Steroid Dehydrogenase-like (NSDHL) Enzyme."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To begin to examine the pathogenesis of these disorders, we have determined
        that affected male embryos for several Nsdhl alleles die in midgestation,
        between E10.5 and 13.5
      explanation: >-
        Supports treating this model as informative for the timing and nature of
        male lethality.

- name: Conditional Nsdhl ablation in radial glia
  species: Mouse
  genotype: Nsdhl(tm1.1Hrm) conditional allele, GFAP-cre driver
  publication: PMID:25652406
  description: >-
    Because hemizygous Nsdhl mutant males die by midgestation, a conditional
    allele was needed to reach postnatal biology. Ablating Nsdhl in radial glia
    produced live-born males that developed ataxia by postnatal day 8 to 10, with
    loss of cortical and hippocampal neurons and defective proliferation and
    migration of cerebellar granule precursors followed by massive apoptosis. The
    proliferation defect was traced to defective SHH signalling and was almost
    completely rescued by exogenous cholesterol.
  genes:
  - preferred_term: NSDHL
    term:
      id: hgnc:13398
      label: NSDHL
  evidence:
  - reference: PMID:25652406
    reference_title: "Analysis of hedgehog signaling in cerebellar granule cell precursors in a conditional Nsdhl allele demonstrates an essential role for cholesterol in postnatal CNS development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Since hemizygous male mice with Nsdhl mutations die by midgestation, we
      generated a conditional targeted Nsdhl mutation (Nsdhl(tm1.1Hrm)) to
      investigate the essential role of cholesterol in the early postnatal CNS.
    explanation: >-
      States why this conditional model exists and what it is a model of, which is
      the model-level claim.
  modeled_mechanisms:
  - target: Impaired Hedgehog Signal Transduction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes the causal chain from NSDHL loss to defective SHH signalling and
      shows that cholesterol supply is the limiting factor for it.
    limitations: >-
      The tissue is CNS rather than skin or limb, and the phenotype it produces is
      the CK syndrome-like neurological picture rather than the CHILD phenotype, so
      the Hedgehog result transfers as a mechanism while the phenotype does not.
      Conditional ablation in one lineage is also not equivalent to the mosaic
      heterozygous state of human CHILD syndrome.
    readouts:
    - name: Cerebellar granule cell precursor proliferation
      target: Impaired Hedgehog Signal Transduction
      direction: RESTORED
      interpretation: >-
        Rescue by exogenous cholesterol identifies cholesterol availability, rather
        than a separate consequence of the mutation, as the proximate cause of the
        Hedgehog signalling failure.
      evidence:
      - reference: PMID:25652406
        reference_title: "Analysis of hedgehog signaling in cerebellar granule cell precursors in a conditional Nsdhl allele demonstrates an essential role for cholesterol in postnatal CNS development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Furthermore, this defect is almost completely rescued by supplementation
          of the culture media with exogenous cholesterol
        explanation: >-
          Reports the rescue experiment behind this readout.
    evidence:
    - reference: PMID:25652406
      reference_title: "Analysis of hedgehog signaling in cerebellar granule cell precursors in a conditional Nsdhl allele demonstrates an essential role for cholesterol in postnatal CNS development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We replicated the granule cell precursor proliferation defect in vitro and
        demonstrate that it results from defective signaling by SHH.
      explanation: >-
        Supports treating this model as informative for the Hedgehog node.

- name: Labrador Retriever NSDHL deletion
  species: Dog
  genotype: Heterozygous deletion removing the last three exons of NSDHL
  publication: PMID:28739597
  description: >-
    A naturally occurring canine counterpart. A female Labrador Retriever and her
    crossbred daughter carried a large heterozygous NSDHL deletion and showed
    cornification-disorder lesions following Blaschko lines; both male littermates
    of the affected daughter died at birth, consistent with X-linked semidominant
    male lethality. The value of this model is that it is spontaneous and shows
    the mosaic cutaneous patterning in a large outbred mammal.
  genes:
  - preferred_term: NSDHL
    term:
      id: hgnc:13398
      label: NSDHL
  evidence:
  - reference: PMID:28739597
    reference_title: "A Large Deletion in the NSDHL Gene in Labrador Retrievers with a Congenital Cornification Disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Variants in the NSDHL gene cause CHILD syndrome in humans, and the bare
      patches (Bpa) and striated (Str) phenotypes in mice.
    explanation: >-
      The authors situate their canine finding against the human disease and the
      established mouse models, which is what makes this dog a model for CHILD
      syndrome rather than an isolated veterinary case.
  modeled_mechanisms:
  - target: X-Inactivation Mosaicism and Negative Selection of Mutant-Expressing Cells
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the X-linked mosaic cutaneous patterning in a heterozygous female
      carrier of an NSDHL loss-of-function allele.
    limitations: >-
      The canine lesions follow Blaschko lines rather than showing the strict
      midline demarcation that defines human CHILD syndrome, so the model captures
      functional X-inactivation mosaicism but not the lateralization that is the
      open question. It also carries no longitudinal measurement of clone
      depletion, so it does not speak to the negative-selection arm of this node.
      Causality was inferred from genome sequencing and the known role of NSDHL
      rather than demonstrated functionally.
    readouts:
    - name: Blaschko-linear cutaneous lesion distribution
      target: X-Inactivation Mosaicism and Negative Selection of Mutant-Expressing Cells
      direction: ALTERED
      interpretation: >-
        The patterned lesion distribution is the visible readout of functional
        X-inactivation mosaicism in the epidermis.
      evidence:
      - reference: PMID:28739597
        reference_title: "A Large Deletion in the NSDHL Gene in Labrador Retrievers with a Congenital Cornification Disorder."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We investigated a female Labrador Retriever and her crossbred daughter,
          which both showed similar clinical lesions that followed Blaschko's lines.
        explanation: >-
          Reports the lesion distribution behind this readout.
    evidence:
    - reference: PMID:28739597
      reference_title: "A Large Deletion in the NSDHL Gene in Labrador Retrievers with a Congenital Cornification Disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Taken together, our genetic data and the known role of NSDHL in X-linked
        skin disorders strongly suggest that the identified structural variant in
        the NSDHL gene is causative for the phenotype in the two affected dogs.
      explanation: >-
        Supports treating the canine phenotype as an NSDHL-driven model, with the
        authors' own hedged causal language preserved.

experimental_models:
- name: Heterologous expression of NSDHL missense mutants
  experimental_model_type: CELL_LINE
  publication: PMID:40222685
  description: >-
    Thirteen disease-causing NSDHL missense mutations and one deletion mutation
    were expressed and assayed for protein level. All showed low expression;
    some were partially rescued by culture at 30°C rather than 37°C or by the
    chemical chaperone glycerol, and optimal expression required heat shock
    proteins 70 and 90. This reframes NSDHL missense disease as substantially a
    protein stability and folding problem, which is what makes chaperone-directed
    approaches conceivable.
  evidence:
  - reference: PMID:40222685
    reference_title: "Comprehensive survey of disease-causing missense mutations of the cholesterol synthesis enzyme NSDHL: Low temperature and a chemical chaperone rescue low protein expression of select mutants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We examined 13 missense mutations and one deletion mutation in the
      cholesterol synthesis enzyme NSDHL (NAD(P) Dependent Steroid
      Dehydrogenase-Like), known to cause the X-linked developmental disorders
      CHILD (congenital hemidysplasia with ichthyosiform erythroderma and limb
      defects) syndrome and CK syndrome.
    explanation: >-
      States that the alleles assayed in this system are the ones that cause CHILD
      syndrome, which is the model-level relevance claim.
  modeled_mechanisms:
  - target: NSDHL Loss of Function
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Quantifies how disease alleles reduce NSDHL protein abundance and identifies
      a rescuable folding component.
    limitations: >-
      Heterologous overexpression in cultured cells does not report on endogenous
      expression in keratinocytes or on the mosaic tissue context, and a
      temperature or glycerol rescue in culture is not evidence that any
      clinically usable chaperone therapy exists.
    readouts:
    - name: NSDHL mutant protein expression level
      target: NSDHL Loss of Function
      direction: DECREASED
      interpretation: >-
        Low steady-state protein for every disease allele tested indicates loss of
        function operates substantially through protein instability.
      evidence:
      - reference: PMID:40222685
        reference_title: "Comprehensive survey of disease-causing missense mutations of the cholesterol synthesis enzyme NSDHL: Low temperature and a chemical chaperone rescue low protein expression of select mutants."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Here we show that protein expression levels were low for all mutants, but
          some could be rescued by a lower temperature (30°C vs. 37°C) and/or the
          chemical chaperone glycerol.
        explanation: >-
          Reports the expression measurement behind this readout.
    evidence:
    - reference: PMID:40222685
      reference_title: "Comprehensive survey of disease-causing missense mutations of the cholesterol synthesis enzyme NSDHL: Low temperature and a chemical chaperone rescue low protein expression of select mutants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Additionally, heat shock proteins 70 and 90 are needed for optimal NSDHL
        protein expression suggesting that disease mutations in NSDHL may interfere
        with this interaction
      explanation: >-
        Supports treating this system as informative about the molecular basis of
        NSDHL loss of function.

differential_diagnoses:
- name: X-linked chondrodysplasia punctata 2 (Conradi-Hunermann-Happle syndrome)
  disease_term:
    preferred_term: X-linked chondrodysplasia punctata 2
    term:
      id: MONDO:0020603
      label: X-linked chondrodysplasia punctata 2
  description: >-
    The closest mechanistic neighbour and the most important differential. CDPX2
    is caused by variants in EBP, a delta8-delta7 sterol isomerase acting
    downstream of NSDHL in the same post-squalene pathway, and it is likewise an
    X-linked dominant, male-lethal disorder with patterned ichthyotic skin and
    bone malformations. The relationship between the two entities is not fully
    settled: the NSDHL gene-discovery paper found EBP unaffected in its CHILD
    cohort and concluded they are not allelic, while a paper published alongside
    it identified an EBP nonsense variant in a patient carrying a clinical CHILD
    diagnosis.
  distinguishing_features:
  - CDPX2 skin lesions and skeletal defects are bilateral and asymmetric, without the strict lateralization and midline demarcation of CHILD syndrome
  - CDPX2 is caused by EBP variants acting one step downstream of NSDHL in the same pathway
  - CDPX2 carries a plasma sterol signature of raised 8-dehydrocholesterol and 8(9)-cholestenol that NSDHL-related CHILD syndrome does not
  evidence:
  - reference: PMID:10710235
    reference_title: "Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EBP was unaffected in the patients analyzed by us demonstrating that CHILD
      syndrome and CDPX2 are not caused by allelic mutations.
    explanation: >-
      Establishes that in this cohort the two are genetically distinct despite
      their shared pathway and overlapping clinical picture.
  - reference: PMID:10710233
    reference_title: "CHILD syndrome caused by deficiency of 3beta-hydroxysteroid-delta8, delta7-isomerase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      although the skeletal defects and skin lesions in CDPX2 are bilateral and
      asymmetric
    explanation: >-
      States the clinical distinction in lesion distribution that separates the
      two on examination.

- name: Inflammatory linear verrucous epidermal nevus (ILVEN)
  disease_term:
    preferred_term: inflammatory linear verrucous epidermal nevus
    term:
      id: MONDO:0019318
      label: inflammatory linear verrucous epidermal nevus
  description: >-
    The dermatologic mimic, as opposed to the mechanistic neighbours above. The
    CHILD nevus is an inflammatory verrucous lesion with psoriasiform
    hyperkeratosis and loss of the granular layer, and ILVEN looks like that
    too, so the differential is made on the systemic findings rather than on the
    skin. It is a real trap in both directions: a boy with widespread
    right-sided inflammatory lesions was worked up as possible CHILD syndrome
    before being confirmed as severe ILVEN, and separately a genuine CHILD
    patient was described as mimicking verrucous nevus. The hard part is that
    the ILVEN case also had an ipsilateral limb contracture and short stature,
    so even the extracutaneous findings are not cleanly discriminating.
  distinguishing_features:
  - ILVEN has no NSDHL variant and no sterol pathway biochemical signature, which is the definitive separator
  - ILVEN lesions follow Blaschko lines rather than showing the strict midline demarcation typical of the CHILD nevus
  - ILVEN lacks the ipsilateral skeletal hypoplasia or aplasia of CHILD syndrome, though an ipsilateral limb contracture has been reported in ILVEN, so limb involvement alone does not settle it
  - Male sex argues against CHILD syndrome, which is usually male lethal, and the reported ILVEN mimic was a boy
  evidence:
  - reference: PMID:39953436
    reference_title: "Unilateral widespread inflammatory linear verrucous epidermal nevus with ipsilateral limb contracture along the lines of Blaschko: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initially, we suspected this may be a rare case of CHILD syndrome in a boy.
      However, after further investigation, we confirmed the diagnosis as a
      severe form of ILVEN.
    explanation: >-
      A worked case of the differential actually being made, with CHILD syndrome
      as the initial working diagnosis and ILVEN as the resolution.
  - reference: PMID:39953436
    reference_title: "Unilateral widespread inflammatory linear verrucous epidermal nevus with ipsilateral limb contracture along the lines of Blaschko: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He also had an associated contracture in the ipsilateral limb and short
      stature.
    explanation: >-
      Documents that the ILVEN case carried ipsilateral limb findings too, which
      is why extracutaneous involvement does not by itself distinguish the two.

- name: CK syndrome
  description: >-
    The allelic NSDHL disorder in males. CK syndrome arises from hypomorphic
    NSDHL variants retaining partial enzyme activity, and presents with cognitive
    impairment, behavioural problems, infantile-onset seizures, cerebral cortical
    malformation, and microcephaly rather than with the cutaneous and limb
    phenotype of CHILD syndrome. Same gene, opposite sex distribution, and an
    essentially non-overlapping clinical picture.
  distinguishing_features:
  - CK syndrome affects males hemizygous for a hypomorphic allele; CHILD syndrome affects heterozygous females and is male lethal
  - CK syndrome is dominated by cognitive impairment, seizures, and cortical malformation, whereas intellect is usually normal in CHILD syndrome
  - CK syndrome lacks the lateralized ichthyosiform nevus and ipsilateral limb defects
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CK syndrome is established in a male proband with a
      hemizygous NSDHL hypomorphic pathogenic variant identified by molecular
      genetic testing that results in partial loss of functional decarboxylating
      sterol-4-alpha-carboxylate 3-dehydrogenase.
    explanation: >-
      States the allelic relationship and the partial-loss-of-function basis that
      separates CK syndrome from CHILD syndrome.

discussions:
- discussion_id: lateralization_mechanism_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#X-Inactivation Mosaicism and Negative Selection of Mutant-Expressing Cells
  prompt: >-
    What mechanism converts random X inactivation into a body-half boundary in
    CHILD syndrome, rather than the finer Blaschko-line mosaicism seen in other
    X-linked genodermatoses?
  rationale: >-
    The observation that lesional keratinocytes express only the mutant allele and
    contralateral keratinocytes only the wild-type allele explains why affected
    skin is affected, but it does not explain the geometry. Negative selection of
    mutant-expressing cells accounts for their depletion, not for its confinement
    to one side of the midline. The authors who established the clearance model
    describe the lateralization as poorly understood, and no available animal
    system reproduces it: both mouse models pattern as patches or stripes, and
    the canine model follows Blaschko lines. This disease would be an unusually
    good subject for single-cell or spatial methods, which have not been applied
    to it, because the mosaic boundary is sharp and the selecting phenotype is
    cell-autonomous.
  proposed_experiments:
  - experiment_id: lateralization_lineage_mapping
    name: Lineage and allele-expression mapping across the midline in CHILD skin
    description: >-
      Single-cell or spatial transcriptomic mapping of NSDHL allele expression
      across the midline boundary in affected individuals, paired with clonal
      lineage inference, to determine whether the boundary reflects an early
      embryonic left-right lineage restriction, a later selective clearance front,
      or an unrecognized signalling boundary.
  evidence:
  - reference: PMID:21753784
    reference_title: "Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also evaluated the basis for the poorly understood, unique lateralization
      of the cutaneous and bone malformations of CHILD syndrome by analyzing gene
      activation in abnormal and unaffected skin.
    explanation: >-
      The authors describe the lateralization as poorly understood at the outset of
      the study that produced the current best account of it.

- discussion_id: male_lethality_placental_mechanism_human
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Placental Labyrinth Failure and Male Lethality
  prompt: >-
    Does the placental labyrinth mechanism established for male lethality in
    Nsdhl mutant mice hold for human male conceptuses with NSDHL loss of function?
  rationale: >-
    The placental account of male lethality rests entirely on mouse work, in which
    affected male embryos die in midgestation with a thin, poorly vascularized
    labyrinth while showing no consistent embryonic anomaly. Extrapolating to
    humans is not straightforward: X inactivation in most rodent placental
    lineages is imprinted with preferential paternal inactivation, which is not the
    human arrangement, and the reasoning that heterozygous females should
    phenocopy affected males in extraembryonic tissue depends on that difference.
    Human material is not wholly unavailable: a maternally inherited NSDHL
    variant has been identified by exome sequencing in a male conceptus lost at
    ten weeks, confirming that the lethality is real and NSDHL-linked in humans.
    What that report does not supply is any placental histology or Hedgehog
    readout, so it establishes the outcome while leaving the murine mechanism
    for it untested in humans.
  proposed_experiments:
  - experiment_id: human_nsdhl_trophoblast_model
    name: NSDHL-null human trophoblast organoid vascularization assay
    description: >-
      Generate NSDHL loss-of-function human trophoblast stem cell or placental
      organoid models and assay Hedgehog pathway activity, trophoblast
      proliferation, and vascular network formation, to test whether the murine
      labyrinth phenotype has a human counterpart independent of rodent-specific
      placental X inactivation.
  evidence:
  - reference: PMID:15639195
    reference_title: "Placental defects are associated with male lethality in bare patches and striated embryos deficient in the NAD(P)H Steroid Dehydrogenase-like (NSDHL) Enzyme."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      X-inactivation is non-random in females in most lineages of the rodent
      placenta with preferential inactivation of the paternal X chromosome.
    explanation: >-
      States the rodent-specific placental X-inactivation arrangement that the
      mouse inference depends on and that does not transfer to humans.
  - reference: PMID:36504312
    reference_title: "Etiological identification of recurrent male fatality due to a novel NSDHL gene mutation using trio whole-exome sequencing: A rare case report and literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 33-year-old pregnant woman with recurrent spontaneous abortion was
      experiencing her third pregnancy with a male embryo. In this pregnancy, a
      miscarriage occurred at a gestational age of 10+6  weeks with no copy
      number variants.
    explanation: >-
      Establishes the human male loss and its timing, which is the outcome side
      of the mismatch. PARTIAL because the report supplies no placental
      histology or Hedgehog readout, so it cannot confirm or refute the murine
      labyrinth mechanism that is the actual open question.

- discussion_id: nsdhl_versus_ebp_nosological_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#EBP
  prompt: >-
    Is "CHILD syndrome" one disease with two loci, or is the EBP-related case a
    CDPX2 variant that was clinically misassigned?
  rationale: >-
    Two papers published in the same journal issue in 2000 reach opposite-facing
    conclusions. One identified NSDHL variants in six CHILD patients and reported
    EBP unaffected in all of them, concluding the disorders are not allelic. The
    other measured plasma sterols in a CHILD patient, found the CDPX2 signature,
    identified an EBP nonsense variant, and speculated that at least some CHILD
    cases are allelic with CDPX2. Both observations can stand; what is unresolved
    is whether a CHILD phenotype arising from EBP should be curated as CHILD
    syndrome with locus heterogeneity or as an unusually lateralized CDPX2. This
    is a lump-versus-split decision affecting how the entity boundary is drawn,
    and it has not been settled by any subsequent cohort. The practical
    consequence is diagnostic: plasma sterol analysis separates the two routes
    even though it is uninformative within NSDHL-related disease.
  proposed_experiments:
  - experiment_id: child_locus_reassessment_cohort
    name: Genotype and sterol reassessment of the assembled CHILD case literature
    description: >-
      Assemble the published CHILD syndrome cases with molecular data, and where
      material allows, determine NSDHL versus EBP genotype together with plasma
      sterol profile and lesion distribution, to establish whether EBP-related
      cases form a clinically separable subgroup or are distributed through the
      CHILD phenotype.
  evidence:
  - reference: PMID:10710233
    reference_title: "CHILD syndrome caused by deficiency of 3beta-hydroxysteroid-delta8, delta7-isomerase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We speculate that at least some cases of CHILD syndrome are allelic with
      CDPX2 caused by 3beta-hydroxysteroid-delta8,delta7-isomerase deficiency.
    explanation: >-
      The authors' own hedged phrasing is the open question this discussion
      records.

notes: >-
  Four scope decisions. First, this entry deliberately does not declare
  conformance to the Hedgehog node of the ciliopathy_dysfunction module: that
  module's chain runs from a basal body, transition zone, or intraflagellar
  transport lesion, and CHILD syndrome reaches the same pathway by a sterol
  route with no primary ciliary defect. Second, CK syndrome is modeled as a
  differential diagnosis rather than a subtype. Although CK syndrome is allelic,
  its clinical picture is essentially non-overlapping with CHILD syndrome and it
  affects the opposite sex, so treating it as a subtype of this entry would
  merge two distinct disease entities under one pathograph. Third, prevalence is
  recorded only as a CASES_IN_LITERATURE / ULTRA_RARE band with no rate. The
  figure of one in 100,000 circulates in review literature but is inconsistent
  with a total published case count in the low hundreds, and there is no cohort,
  registry, or natural-history study from which a defensible rate could be
  derived; for the same reason most phenotypes here carry no frequency value.
  Fourth, no datasets are
  curated. GEO discovery returned twelve candidates, all GENE_ONLY and all
  spurious: every one matched the string EBP against the unrelated CCAAT
  enhancer-binding protein (C/EBP) family rather than the sterol isomerase, and
  none concerned NSDHL or CHILD syndrome. Recording the absence here so the
  search is not repeated and so the near-miss is not mistaken for coverage.
  Fifth, four further lines from the research report were considered and
  declined, recorded here so they are not repeatedly re-proposed.
  Gastrointestinal and colonic xanthomas (PMID:39466221, PMID:40517742) are a
  real and newly recognized part of the adult phenotype, but both cache with no
  retrievable content, so there is no quotable snippet and curating them would
  mean asserting a phenotype on an uncheckable citation. Greenberg dysplasia
  (PMID:32304187) is a different sterol-pathway disorder (LBR) whose overlap
  with CHILD syndrome is at the level of the pathway rather than the
  presentation, so it does not earn a differential entry alongside CDPX2 and
  ILVEN. The additional topical statin case reports (PMID:34787337,
  PMID:39431262, PMID:40464756, PMID:42083494) are redundant with the three
  already cited on that treatment and would add citation count without adding
  evidential weight.

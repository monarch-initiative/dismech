inheritance:
- name: X-linked dominant inheritance with male lethality
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  description: >-
    CHILD syndrome is transmitted as an X-linked dominant trait. Hemizygous male
    conceptuses generally do not survive gestation, so the disorder is seen
    almost exclusively in heterozygous females. Because affected males abort or
    resorb, the expected live-born distribution from a heterozygous mother
    departs from the usual X-linked ratios, and recurrent male pregnancy loss is
    a family-history clue.
  evidence:
  - reference: PMID:10710235
    reference_title: "Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report for the first time that CHILD syndrome (MIM 308050), an X-linked
      dominant, male-lethal trait characterized by an inflammatory nevus with
      striking lateralization and strict midline demarcation, as well as
      ipsilateral hypoplasia of the body is caused by mutations in the gene NSDHL
      located at Xq28
    explanation: >-
      The gene-discovery paper states the X-linked dominant, male-lethal mode of
      inheritance alongside the causal locus.
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHILD syndrome is usually male lethal during gestation and thus
      predominantly affects females.
    explanation: >-
      GeneReviews states the male-lethal consequence and the resulting female
      predominance.
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, since studies suggest that male conceptuses with an NSDHL
      pathogenic variant generally abort or resorb spontaneously, the expected
      live-born distribution is: 33% heterozygous (typically) affected females;
      33% unaffected females; and 33% unaffected males.
    explanation: >-
      Supplies the quantitative recurrence-risk figures that this description
      would otherwise only paraphrase, including the reason the live-born ratios
      depart from the usual X-linked expectation.
  - reference: PMID:36504312
    reference_title: "Etiological identification of recurrent male fatality due to a novel NSDHL gene mutation using trio whole-exome sequencing: A rare case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we detected c.790-6C>T, a novel variant in the NSDHL gene
      that results in recurrent miscarriage in males.
    explanation: >-
      Human evidence that the male lethality is real and observable as recurrent
      male pregnancy loss in a carrier mother, rather than being inferred only
      from the skewed sex ratio among liveborn patients.
- name: Functional mosaicism from random X inactivation
  inheritance_term:
    preferred_term: Typified by somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    NSDHL lies at Xq28 and is therefore subject to X inactivation, so a
    heterozygous female is a functional mosaic of cells expressing either the
    mutant or the wild-type allele. This is not somatic mosaicism at the DNA
    level, which is why sequencing genomic DNA from lesional and non-lesional
    keratinocytes recovers both alleles equally; the mosaicism is only visible in
    expressed RNA. Lesional keratinocytes express the mutant allele exclusively,
    whereas clinically normal contralateral keratinocytes express only the
    wild-type allele. The X-inactivation pattern, rather than the particular
    allele, appears to set the distribution of skin involvement, which is why an
    exceptional patient can have an almost symmetric bilateral CHILD nevus.
  evidence:
  - reference: PMID:21753784
    reference_title: "Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The unusual lateralization of abnormalities in CHILD syndrome reflects
      selective clearance of keratinocytes and fibroblasts that express the mutant
      allele from the unaffected side.
    explanation: >-
      Directly ties the mosaic distribution of mutant-allele-expressing cells to
      the lateralized clinical pattern.
  - reference: PMID:11907515
    reference_title: "A novel missense mutation of NSDHL in an unusual case of CHILD syndrome showing bilateral, almost symmetric involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Apparently, the effect of random X-inactivation is responsible for
      different patterns of cutaneous involvement in female carriers of NSDHL
      mutations.
    explanation: >-
      Attributes the variable cutaneous distribution, including the exceptional
      bilateral case, to the X-inactivation pattern rather than to allele
      identity.

genetic:
- name: NSDHL
  gene_term:
    preferred_term: NSDHL
    term:
      id: hgnc:13398
      label: NSDHL
  relationship_type: CAUSATIVE
  notes: >-
    Loss-of-function variants in NSDHL, encoding NAD(P)H steroid
    dehydrogenase-like protein, cause CHILD syndrome. The gene maps to Xq28. The
    encoded enzyme is a 3-beta-hydroxysteroid dehydrogenase and C4-decarboxylase
    that removes C-4 methyl groups in the post-squalene segment of cholesterol
    biosynthesis. Reported alleles include missense changes such as p.Gly83Asp
    and premature termination changes such as p.Ser106X. CHILD syndrome and CK
    syndrome are allelic: CK syndrome arises from hypomorphic alleles retaining
    partial enzyme function and affects males.
  evidence:
  - reference: PMID:10710235
    reference_title: "Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SSCA and genomic sequence analysis of NSDHL identified in 6 patients with
      CHILD syndrome, including one boy as well as a mother and her daughter,
      mutations potentially impairing protein function.
    explanation: >-
      Establishes NSDHL variants as the molecular cause in a patient series.
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CHILD syndrome is established in a female proband with a
      heterozygous NSDHL pathogenic variant identified by molecular genetic
      testing that results in loss of functional decarboxylating
      sterol-4-alpha-carboxylate 3-dehydrogenase, the protein encoded by NSDHL.
    explanation: >-
      GeneReviews states the diagnostic criterion and the loss-of-function
      consequence at the protein level.
  - reference: PMID:25652406
    reference_title: "Analysis of hedgehog signaling in cerebellar granule cell precursors in a conditional Nsdhl allele demonstrates an essential role for cholesterol in postnatal CNS development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rare, hypomorphic NSDHL mutations are also associated with X-linked
      intellectual disability in males with CK syndrome.
    explanation: >-
      Supports the allelic relationship in which residual enzyme activity yields
      CK syndrome rather than CHILD syndrome.

- name: EBP
  gene_term:
    preferred_term: EBP
    term:
      id: hgnc:3133
      label: EBP
  relationship_type: CAUSATIVE
  notes: >-
    A minority route to a CHILD-syndrome phenotype runs through EBP, the
    delta8-delta7 sterol isomerase acting one step downstream of NSDHL and the
    gene of CDPX2. A patient with a clinical diagnosis of CHILD syndrome was
    found to have the CDPX2 plasma sterol signature (raised 8-dehydrocholesterol
    and 8(9)-cholestenol) and a nonsense variant in EBP. This is a genuine
    locus-heterogeneity finding, but it sits in unresolved tension with the
    NSDHL gene-discovery paper published alongside it, which found EBP
    unaffected in its own CHILD cohort and concluded the two disorders are not
    allelic. Both can be true if "CHILD syndrome" as clinically diagnosed spans
    two loci; which patients belong where is a nosological question this entry
    does not settle. See the corresponding discussion. EBP is deliberately left
    unwired to any pathophysiology node: it catalyses delta8-delta7
    isomerization, a different step from the C4-demethylation that this
    pathograph models, so attaching it to the existing metabolic block node
    would misstate the enzymology. Wiring it properly would mean curating a
    second, EBP-specific block, which is not warranted by one hedged case
    report.
  evidence:
  - reference: PMID:10710233
    reference_title: "CHILD syndrome caused by deficiency of 3beta-hydroxysteroid-delta8, delta7-isomerase."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequently, we identified a nonsense mutation in exon 3 of the patient's
      3beta-hydroxysteroid-delta8,delta7-isomerase gene. We speculate that at
      least some cases of CHILD syndrome are allelic with CDPX2 caused by
      3beta-hydroxysteroid-delta8,delta7-isomerase deficiency.
    explanation: >-
      Reports a single patient with an EBP nonsense variant and the matching
      sterol signature. PARTIAL because the authors themselves generalize only
      speculatively, from one patient, to "at least some cases".

pathophysiology:
- name: NSDHL Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Pathogenic NSDHL variants abolish or severely reduce the activity of the
    NAD(P)H steroid dehydrogenase-like protein. Missense alleles do not simply
    produce a catalytically dead but abundant enzyme: across a survey of thirteen
    disease-causing missense changes and one deletion, protein expression levels
    were uniformly low, and some mutants could be partially rescued by lowering
    the temperature or by adding a chemical chaperone, implicating a folding and
    stability defect rather than pure catalytic loss.
  molecular_functions:
  - preferred_term: sterol-4-alpha-carboxylate 3-dehydrogenase (NSDHL) activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0000252
      label: 3-beta-hydroxysteroid dehydrogenase [NAD(P)+]/C4-decarboxylase activity
  genes:
  - preferred_term: NSDHL
    term:
      id: hgnc:13398
      label: NSDHL
  downstream:
  - target: Blocked C4-Demethylation with Cholesterol Deficiency and Methylsterol Accumulation
    description: >-
      Loss of the C4-demethylating enzyme interrupts the post-squalene pathway,
      simultaneously reducing cholesterol output and causing intermediates above
      the block to accumulate.
  evidence:
  - reference: PMID:40222685
    reference_title: "Comprehensive survey of disease-causing missense mutations of the cholesterol synthesis enzyme NSDHL: Low temperature and a chemical chaperone rescue low protein expression of select mutants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that protein expression levels were low for all mutants, but
      some could be rescued by a lower temperature (30°C vs. 37°C) and/or the
      chemical chaperone glycerol.
    explanation: >-
      Characterizes the molecular consequence of disease-causing missense alleles
      as reduced protein expression with a partially rescuable folding component.
  - reference: PMID:10710235
    reference_title: "Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (NAD(P)H steroid dehydrogenase-like protein) encoding a 3beta-hydroxysteroid
      dehydrogenase functioning in the cholesterol biosynthetic pathway
    explanation: >-
      Identifies the enzymatic function that is lost.

- name: Blocked C4-Demethylation with Cholesterol Deficiency and Methylsterol Accumulation
  biological_scale: MOLECULAR
  description: >-
    The enzymatic block has two simultaneous consequences that are usually
    described as one. Downstream, flux to cholesterol falls, so affected cells
    are deprived of the pathway end product. Upstream, methylsterol intermediates
    accumulate; these are not inert, but insert into membranes and perturb
    membrane function, oxysterol generation, Hedgehog signalling, and HMG-CoA
    reductase turnover. In cultured cerebellar granule cell precursors from a
    conditional Nsdhl mouse, the two arms are experimentally separable: exogenous
    cholesterol almost completely rescued the proliferation defect, while
    methylsterol accumulation above the block was associated instead with
    increased cell death.
  biological_processes:
  - preferred_term: cholesterol biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006695
      label: cholesterol biosynthetic process
  chemical_entities:
  - preferred_term: cholesterol
    modifier: DECREASED
    term:
      id: CHEBI:16113
      label: cholesterol
  downstream:
  - target: Impaired Epidermal Lamellar Body Secretion and Barrier Formation
    description: >-
      Cholesterol is a required constituent of the stratum corneum lipid
      lamellae; its depletion, together with toxic intermediate accumulation,
      disorganizes the epidermal lipid secretory system.
  - target: Impaired Hedgehog Signal Transduction
    description: >-
      Cholesterol is required for Hedgehog signal transduction, and accumulated
      sterol intermediates further perturb it.
  - target: X-Inactivation Mosaicism and Negative Selection of Mutant-Expressing Cells
    description: >-
      The metabolic lesion is also what makes a mutant-expressing cell less fit
      than its wild-type neighbour, which is the proposed driver of the
      progressive negative selection.
  - target: Stippled epiphyseal calcification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Punctate calcification of cartilage is the radiographic finding CHILD
      syndrome shares with CDPX2, and what the two disorders have in common is a
      block in the same post-squalene sterol pathway rather than any shared gene.
      That shared biochemistry is the basis for placing the stippling downstream
      of the metabolic block; the chondro-osseous mechanism connecting them is
      not established.
    evidence:
    - reference: PMID:10710235
      reference_title: "Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause CHILD syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This phenotype is distinct from, but shares various clinical and
        biochemical findings with chondrodysplasia punctata (CDPX2, MIM 302960).
      explanation: >-
        Supports the shared clinical and biochemical ground between the two sterol
        pathway disorders, which is the argument for this edge, but does not
        itself demonstrate the causal step. Hence PARTIAL.
  evidence:
  - reference: PMID:24060582
    reference_title: "The role of abnormalities in the distal pathway of cholesterol synthesis in the Congenital Hemidysplasia with Ichthyosiform erythroderma and Limb Defects (CHILD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHILD syndrome results from loss of function mutations in the NSDHL gene,
      which leads to inhibition of cholesterol synthesis and accumulation of toxic
      metabolic intermediates in affected tissues.
    explanation: >-
      States both arms of the dual biochemical lesion explicitly.
  - reference: PMID:25652406
    reference_title: "Analysis of hedgehog signaling in cerebellar granule cell precursors in a conditional Nsdhl allele demonstrates an essential role for cholesterol in postnatal CNS development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, this defect is almost completely rescued by supplementation of
      the culture media with exogenous cholesterol, while methylsterol
      accumulation above the enzymatic block appears to be associated with
      increased cell death.
    explanation: >-
      Experimentally dissociates the end-product-deficiency arm from the
      toxic-intermediate arm within one model system.

- name: X-Inactivation Mosaicism and Negative Selection of Mutant-Expressing Cells
  biological_scale: CELLULAR
  description: >-
    Because NSDHL is X-linked, a heterozygous female is a functional mosaic of
    cells expressing either allele. Lesional and contralateral clinically normal
    skin carry equal amounts of mutant and wild-type DNA, but differ completely
    in what they express: cultured keratinocytes from lesional skin expressed
    only the mutant allele, and keratinocytes from the unaffected side expressed
    only the wild-type allele. Fibroblasts showed the same asymmetry less
    completely. Skewed X inactivation in peripheral blood is consistent with
    overall depletion of mutant-expressing cells. The mouse work adds the
    temporal dimension that makes this a process rather than a snapshot:
    NSDHL-negative cells survive and differentiate during embryogenesis but are
    progressively outcompeted afterwards, with the mutant fraction in liver
    falling from about half at postnatal day 6 to about a fifth by one year.
    That selection is the likely reason skin lesions tend to improve with age,
    and why the disease is fundamentally a developmental one, doing its damage in
    the window while mutant clones are still abundant. The model also predicts
    the clinical observation that a full-thickness graft taken from the
    unaffected side stays normal after transfer to the affected side. What it
    does not explain is why the boundary is a sharp body midline rather than the
    finer Blaschko striping typical of X-linked mosaic skin disease.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: random X inactivation
    term:
      id: GO:0060816
      label: random inactivation of X chromosome
  downstream:
  - target: Impaired Epidermal Lamellar Body Secretion and Barrier Formation
    description: >-
      The epidermal phenotype is confined to the territory populated by
      mutant-allele-expressing keratinocytes, which is what makes the skin
      disease unilateral.
  - target: Strict midline demarcation of skin lesions
    description: >-
      The distribution of surviving mutant-expressing clones is what the clinical
      lateralization is a map of.
  - target: Ipsilateral body hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The hemidysplasia follows the same mosaic territory as the skin, so one
      side of the body grows out of a cell population that is largely
      mutant-expressing. Why that produces hypoplasia rather than a purely
      cutaneous phenotype is not worked out.
  - target: Cardiac malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Visceral anomalies in CHILD syndrome are ipsilateral, following the same
      body territory as the skin and limb involvement, which places them
      downstream of the mosaic distribution of mutant-expressing cells. How
      NSDHL deficiency in that territory produces a given cardiac malformation
      is not worked out.
    evidence:
    - reference: PMID:11907515
      reference_title: "A novel missense mutation of NSDHL in an unusual case of CHILD syndrome showing bilateral, almost symmetric involvement."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ipsilateral defects involve all skeletal structures and internal organs
        such as the brain, the lung, the heart, or the kidney.
      explanation: >-
        Establishes that the visceral anomalies follow the same lateralized
        territory as the cutaneous disease, which is what licenses this edge.
  - target: Kidney malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      As for the cardiac malformations, renal anomalies fall on the affected
      side, placing them downstream of the mosaic territory rather than of a
      separate systemic mechanism.
    evidence:
    - reference: PMID:11907515
      reference_title: "A novel missense mutation of NSDHL in an unusual case of CHILD syndrome showing bilateral, almost symmetric involvement."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ipsilateral defects involve all skeletal structures and internal organs
        such as the brain, the lung, the heart, or the kidney.
      explanation: >-
        Names the kidney among the ipsilaterally affected internal organs.
  - target: Lung malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The lung belongs to the same set of ipsilaterally affected internal organs
      as the heart and kidney, so it sits downstream of the mosaic territory on
      the same footing as they do.
    evidence:
    - reference: PMID:11907515
      reference_title: "A novel missense mutation of NSDHL in an unusual case of CHILD syndrome showing bilateral, almost symmetric involvement."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ipsilateral defects involve all skeletal structures and internal organs
        such as the brain, the lung, the heart, or the kidney.

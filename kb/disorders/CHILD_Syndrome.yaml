progression:
- phase: Postnatal improvement of cutaneous lesions
  notes: >-
    Cutaneous lesions can improve with age, but intertriginous lesions may persist and new lesions can arise later, including at sites of injury.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Most of the skin lesions improve spontaneously, but some can cause lifelong morbidity. Lesions in the intertriginous areas tend to be more persistent; this is termed ptychotropism
    explanation: GeneReviews describes the human cutaneous course.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Ichthyosiform skin lesions can develop after infancy at sites of injury such as a surgical wound.
    explanation: Lesions can also appear after early development.
- phase: Survival into adulthood
  notes: Life span in females is not well characterized. Adults with a wide range of disease severity have been reported, including an individual diagnosed at age 82; that observation does not establish a normal population life expectancy. Pulmonary hypoplasia can cause early respiratory compromise and death.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf

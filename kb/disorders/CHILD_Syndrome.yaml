inheritance:
- name: X-linked dominant inheritance with male lethality
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  description: >-
    CHILD syndrome is inherited in an X-linked manner and predominantly affects heterozygous females because hemizygous males with severe loss-of-function variants usually do not survive gestation. Rare surviving males with postzygotic mosaicism have been reported. A heterozygous mother has a 50% chance of transmitting the pathogenic variant in each pregnancy; the expected live-born distribution is altered by male lethality. Molecular recurrence-risk assessment requires a pathogenic or likely pathogenic variant, not a variant of uncertain significance.
  evidence:
  - reference: PMID:10710235
    reference_title: "Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report for the first time that CHILD syndrome (MIM 308050), an X-linked
      dominant, male-lethal trait characterized by an inflammatory nevus with
      striking lateralization and strict midline demarcation, as well as
      ipsilateral hypoplasia of the body is caused by mutations in the gene NSDHL
      located at Xq28
    explanation: >-
      The gene-discovery paper states the X-linked dominant, male-lethal mode of
      inheritance alongside the causal locus.
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CHILD syndrome is usually male lethal during gestation and thus
      predominantly affects females.
    explanation: >-
      GeneReviews states the male-lethal consequence and the resulting female
      predominance.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, since studies suggest that male conceptuses with an NSDHL
      pathogenic variant generally abort or resorb spontaneously, the expected
      live-born distribution is: 33% heterozygous (typically) affected females;
      33% unaffected females; and 33% unaffected males.
    explanation: >-
      Supplies the quantitative recurrence-risk figures that this description
      would otherwise only paraphrase, including the reason the live-born ratios
      depart from the usual X-linked expectation.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: If the mother of a proband has an NSDHL pathogenic variant, the chance of transmitting it in each pregnancy is 50%.
    explanation: GeneReviews gives the transmission probability per pregnancy; this differs from the distribution among live births.
- name: Functional mosaicism from random X inactivation
  description: >-
    Heterozygous females are functional mosaics because of X-inactivation; this is distinct from a postzygotic DNA variant. In cultures from one studied patient, both NSDHL alleles were present in genomic DNA from affected and unaffected skin. Affected keratinocytes expressed the mutant allele, whereas unaffected keratinocytes expressed the wild-type allele. Affected fibroblasts retained expression of both alleles. This tissue-specific expression pattern does not establish the developmental origin of the body-half boundary or longitudinal clearance of mutant cells in human skin.
  evidence:
  - reference: PMID:21753784
    reference_title: Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 'However, RT-PCR on cDNA from keratinocytes and fibroblasts isolated from the affected versus clinically unaffected side in Patient #1 demonstrated exclusive expression of the mutant allele by affected cultured keratinocytes, while unaffected keratinocytes solely expressed the wild type allele'
    explanation: Cultures from one patient showed side-specific NSDHL allele expression; this is not a longitudinal measure of cell clearance.
  - reference: PMID:21753784
    reference_title: Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Only the normal allele was expressed by unaffected fibroblasts, but fibroblasts from the clinically affected area expressed an approximately even distribution of normal and mutant alleles.
    explanation: Fibroblast expression in affected skin did not match the exclusively mutant keratinocyte pattern.
  - reference: PMID:11907515
    reference_title: "A novel missense mutation of NSDHL in an unusual case of CHILD syndrome showing bilateral, almost symmetric involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Apparently, the effect of random X-inactivation is responsible for
      different patterns of cutaneous involvement in female carriers of NSDHL
      mutations.
    explanation: >-
      Attributes the variable cutaneous distribution, including the exceptional
      bilateral case, to the X-inactivation pattern rather than to allele
      identity.

genetic:
- name: NSDHL
  gene_term:
    preferred_term: NSDHL
    term:
      id: hgnc:13398
      label: NSDHL
  relationship_type: CAUSATIVE
  notes: >-
    NSDHL loss-of-function variants cause CHILD syndrome. The Xq28 gene encodes the dehydrogenase/decarboxylase component of sterol C4-demethylation. Reported alleles include missense, premature termination, frameshift and exon-deletion variants. Familial transmission can occur with marked variability, including a mother with mild skin changes. Rare male survival can reflect postzygotic mosaicism. Hypomorphic variants retaining partial function cause the distinct allelic CK syndrome.
  evidence:
  - reference: PMID:10710235
    reference_title: "Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SSCA and genomic sequence analysis of NSDHL identified in 6 patients with
      CHILD syndrome, including one boy as well as a mother and her daughter,
      mutations potentially impairing protein function.
    explanation: >-
      Establishes NSDHL variants as the molecular cause in a patient series.
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of CHILD syndrome is established in a female proband with a
      heterozygous NSDHL pathogenic variant identified by molecular genetic
      testing that results in loss of functional decarboxylating
      sterol-4-alpha-carboxylate 3-dehydrogenase, the protein encoded by NSDHL.
    explanation: >-
      GeneReviews states the diagnostic criterion and the loss-of-function
      consequence at the protein level.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:21129721
    reference_title: Hypomorphic temperature-sensitive alleles of NSDHL cause CK syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These two mutations, which alter protein folding, show temperature-sensitive protein stability and complementation in Erg26-deficient yeast.
    explanation: The original CK syndrome study demonstrates residual, temperature-sensitive function of its two studied alleles, supporting the distinction from severe CHILD loss of function.
  - reference: PMID:34957706
    reference_title: A novel NSDHL variant in CHILD syndrome with gastrointestinal manifestations and localized skin involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The variant was confirmed by targeted Sanger sequencing for DNA from both skin tissues and blood. Testing of parental DNA indicated maternal inheritance, with her father testing negative for the variant.
    explanation: The adult gastrointestinal case confirms maternal transmission of the reported NSDHL frameshift.
pathophysiology:
- name: NSDHL Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Pathogenic NSDHL variants impair the sterol dehydrogenase/decarboxylase component of the C4-demethylation complex. An expression study of thirteen disease-associated missense variants and one deletion found reduced protein abundance; temperature or glycerol partially increased abundance for some variants. These assays do not establish that all variants act through the same folding defect or that rescued protein has restored catalytic activity.
  molecular_functions:
  - preferred_term: sterol-4-alpha-carboxylate 3-dehydrogenase (NSDHL) activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0000252
      label: 3-beta-hydroxysteroid dehydrogenase [NAD(P)+]/C4-decarboxylase activity
  genes:
  - preferred_term: NSDHL
    term:
      id: hgnc:13398
      label: NSDHL
  downstream:
  - target: Impaired Sterol C4-Demethylation
    description: Loss of the NSDHL enzyme component impairs this biosynthetic step.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15639195
      reference_title: Placental defects are associated with male lethality in bare patches and striated embryos deficient in the NAD(P)H Steroid Dehydrogenase-like (NSDHL) Enzyme.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      directness: DIRECT
      snippet: NSDHL is a 3beta-hydroxysterol dehydrogenase that is involved in the removal of C-4 methyl groups in one of the later steps of cholesterol biosynthesis.
      explanation: The primary mouse paper describes the established enzymatic function in its background.
  - target: Increased Receptor Lysosomal Trafficking
    description: Experimental NSDHL depletion alters receptor handling; the molecular intermediates and relevance to human skin remain incompletely defined.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23125191
      reference_title: Targeting C4-demethylating genes in the cholesterol pathway sensitizes cancer cells to EGF receptor inhibitors via increased EGF receptor degradation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: In contrast, depletion of either SC4MOL or NSDHL significantly reduced the amount of fluorescently labeled EGFR ... associated with RAB11-positive recycling endosomes after 30 minutes of EGF stimulation.
      explanation: NSDHL knockdown in experimental cells reduced receptor localization to recycling endosomes; this is not a patient-tissue result.
  - target: Impaired Anagen Hair Growth
    description: Nsdhl-deficient mouse skin shows defective anagen progression, with the intervening signaling sequence unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19631568
      reference_title: Developmental expression pattern of the cholesterogenic enzyme NSDHL and negative selection of NSDHL-deficient cells in the heterozygous Bpa(1H)/+ mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The mutant follicles were smaller and shorter than adjacent WT follicles and lacked hair shafts, consistent with defective anagen hair growth.
      explanation: Mouse mutant skin shows defective postnatal anagen growth; initial P2 follicle morphology was not grossly abnormal.
  evidence:
  - reference: PMID:40222685
    reference_title: "Comprehensive survey of disease-causing missense mutations of the cholesterol synthesis enzyme NSDHL: Low temperature and a chemical chaperone rescue low protein expression of select mutants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that protein expression levels were low for all mutants, but
      some could be rescued by a lower temperature (30°C vs. 37°C) and/or the
      chemical chaperone glycerol.
    explanation: >-
      The expression assay reports lower steady-state abundance and partial abundance rescue; enzymatic rescue is not established by this quote.
  - reference: PMID:10710235
    reference_title: "Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause CHILD syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      (NAD(P)H steroid dehydrogenase-like protein) encoding a 3beta-hydroxysteroid
      dehydrogenase functioning in the cholesterol biosynthetic pathway
    explanation: >-
      Identifies the enzymatic function that is lost.

    quote_role: BACKGROUND
  mechanism_confidence: ESTABLISHED

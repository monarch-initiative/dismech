    reference_title: 'Pathogenesis-based therapy: Cutaneous abnormalities of CHILD syndrome successfully treated with topical simvastatin monotherapy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: After obtaining informed consent from her father, we began treatment with twice-daily topical simvastatin 2% ointment
    explanation: The primary case used simvastatin monotherapy.
  - reference: PMID:29687057
    reference_title: 'Pathogenesis-based therapy: Cutaneous abnormalities of CHILD syndrome successfully treated with topical simvastatin monotherapy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Decreased inflammation, skin thickening, and scaling were noted as early as 3 weeks. By 6 weeks, the treated skin largely and dramatically normalized with a discrete postinflammatory hypopigmentation remaining
    explanation: Clinical results describe improvement by three weeks and near-normalization at six weeks.
  - reference: PMID:29687057
    reference_title: 'Pathogenesis-based therapy: Cutaneous abnormalities of CHILD syndrome successfully treated with topical simvastatin monotherapy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT

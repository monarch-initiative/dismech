    explanation: The source documents survival to old age in a family, not a population survival estimate.
biochemical:
- name: Methylsterol accumulation in affected tissue
  presence: INCREASED
  notes: >-
    C4-methylsterol intermediates can accumulate in affected tissue. Plasma profiles can be near normal and therefore cannot exclude NSDHL-related disease. A reported p.Gly44Ser case had a characteristic skin-flake sterol profile with an abnormal sterol also detectable in plasma. EBP-related CDPX2 has a different sterol signature and is a differential diagnosis.
  evidence:
  - reference: PMID:24060582
    reference_title: "The role of abnormalities in the distal pathway of cholesterol synthesis in the Congenital Hemidysplasia with Ichthyosiform erythroderma and Limb Defects (CHILD) syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      which leads to inhibition of cholesterol synthesis and accumulation of toxic
      metabolic intermediates in affected tissues
    explanation: >-
      States the accumulation of intermediates and localizes it to affected
      tissues rather than the circulation.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:10369263
    reference_title: "The gene mutated in bare patches and striated mice encodes a novel 3beta-hydroxysteroid dehydrogenase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Quantitative analysis of sterols from tissues of affected Bpa mice support a
      role for Nsdhl in cholesterol biosynthesis.
    explanation: >-
      Reports the tissue sterol measurements in the mouse counterpart of the
      disorder.

diagnosis:
- name: NSDHL molecular genetic testing
  description: >-
    Diagnosis is supported by characteristic findings and a pathogenic or likely pathogenic NSDHL variant. Sequence analysis detects many coding and splice variants, while exon-level deletion/duplication analysis is needed for copy-number variants that conventional sequencing can miss. A variant of uncertain significance neither establishes nor excludes the diagnosis. Rare mosaic males and mild females require clinical and molecular interpretation rather than exclusion by sex or by absence of a severe limb defect. Optical genome mapping has been reported in a mixed cohort of incontinentia pigmenti and CHILD syndrome; this does not establish a general diagnostic yield for CHILD syndrome.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of CHILD syndrome is established in a female proband with a
      heterozygous NSDHL pathogenic variant identified by molecular genetic
      testing that results in loss of functional decarboxylating
      sterol-4-alpha-carboxylate 3-dehydrogenase, the protein encoded by NSDHL.
    explanation: >-
      GeneReviews states the diagnostic criterion.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:29341259
    reference_title: "CHILD syndrome mimicking verrucous nevus in a Chinese patient responded well to the topical therapy of compound of simvastatin and cholesterol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple exons deletions or microdeletion was not rare in CHILD syndrome.
      Classical Sanger sequencing may not be useful enough to find all kinds of
      mutations. Next-generation sequencing may be more effective.
    explanation: >-
      States the assay blind spot directly, and the same report supplies the
      worked example, a large deletion of NSDHL exons 3 and 4.
  - reference: PMID:41625319
    reference_title: "Diagnostic Utility of Optical Genome Mapping in X-Linked Dominant Genodermatoses: Incontinentia Pigmenti and CHILD Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified structural variants consisted of deletions of varying sizes
      in the Xq28 cytoband, encompassing regions that contain exons.
    explanation: >-
      The abstract reports structural variants in a mixed incontinentia pigmenti/CHILD cohort. It does not assign every deletion to NSDHL or establish a CHILD-specific diagnostic yield.

  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Identification of a heterozygous or hemizygous NSDHL variant of uncertain significance does not establish or rule out the diagnosis.
    explanation: GeneReviews explicitly distinguishes a VUS from a diagnostic pathogenic variant.
- name: Sterol profiling of skin flakes and plasma
  description: >-
    Sterol profiling of affected skin can support biochemical interpretation of an NSDHL variant. In one p.Gly44Ser case, skin-flake methyl-, carboxy- and keto-sterol abnormalities supported reclassification from uncertain significance to likely pathogenic. An abnormal methylsterol was also detected in plasma in that patient. Serum profiles can be near normal, so a normal systemic result does not exclude the disorder.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:33139364
    reference_title: "Novel NSDHL gene variant for congenital hemidysplasia with ichthyosiform erythroderma and limb defects (CHILD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sterol analysis from skin flakes revealed increased levels of a mono
      4-alpha methyl sterol also seen in plasma as well as the presence of
      4-alpha-carboxy-4-methyl-cholest-8(9)-en-3beta-ol and several keto-sterols,
      which are usually below the limit of detection. This sterol pattern is
      consistent with abnormal function of the 4-alpha-methylsterol-4-demethylase
      complex.
    explanation: >-
      Reports the sterol pattern and its interpretation as evidence of the
      enzymatic block.
  - reference: PMID:33139364
    reference_title: "Novel NSDHL gene variant for congenital hemidysplasia with ichthyosiform erythroderma and limb defects (CHILD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On this basis, this variant has been reclassified as likely pathogenic.
    explanation: >-
      Documents the concrete diagnostic use of the sterol result, resolving a
      variant of uncertain significance.

  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Serum concentrations of methylsterol and cholesterol are almost always normal in individuals with CHILD syndrome and CK syndrome.
    explanation: GeneReviews limits the usefulness of normal serum sterols for excluding these disorders.
treatments:
- name: Topical Cholesterol plus Statin (Pathogenesis-Based Therapy)
  description: >-
    Topical lovastatin or simvastatin combined with cholesterol has improved cutaneous lesions in uncontrolled reports. In the original two-patient study, 10% cholesterol alone produced no improvement over three months, followed by substantial improvement with 2% lovastatin/2% cholesterol. There was no statin-only arm, so this sequence does not establish that cholesterol supplementation is required. Later reports describe benefit from statin monotherapy. Skin improvement does not establish correction of congenital skeletal defects, and long-term comparative efficacy and safety remain uncertain.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholesterol
      term:
        id: CHEBI:16113
        label: cholesterol
    - preferred_term: lovastatin
      term:
        id: CHEBI:40303
        label: lovastatin
    - preferred_term: simvastatin
      term:
        id: CHEBI:9150
        label: simvastatin
  target_mechanisms:
  - target: Reduced Cholesterol Availability
    treatment_effect: RESTORES
    description: The cholesterol component supplies the pathway end product; tissue-specific target engagement was not isolated from the effects of the statin in the clinical report.
    evidence:
    - reference: PMID:21753784
      reference_title: Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: On the basis of the putative pathogenic role of both pathway-product deficiency of cholesterol and accumulation of toxic metabolic intermediates, we assessed the efficacy of combined therapy with lovastatin and cholesterol.
      explanation: The authors state the dual treatment rationale as putative. The combined intervention does not isolate restoration of cholesterol from suppression of precursor formation.
  - target: C4-Methylsterol Accumulation
    treatment_effect: INHIBITS
    description: Upstream statin inhibition is intended to reduce precursor production; clinical response to the combination is consistent with this rationale but does not quantify precursor clearance.
    evidence:
    - reference: PMID:21753784
      reference_title: Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: On the basis of the putative pathogenic role of both pathway-product deficiency of cholesterol and accumulation of toxic metabolic intermediates, we assessed the efficacy of combined therapy with lovastatin and cholesterol.
      explanation: The authors state the dual treatment rationale as putative. The combined intervention does not isolate restoration of cholesterol from suppression of precursor formation.
  evidence:
  - reference: PMID:21753784
    reference_title: "Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Topical treatment with lovastatin/cholesterol (but not cholesterol alone)
      virtually cleared skin lesions by 3 months, accompanied by histological and
      ultrastructural normalization of epidermal structure and lipid secretion.
    explanation: >-
      Cholesterol alone did not improve the lesions in this two-patient sequence; there was no statin-only comparison to establish that the combination is required.
  - reference: PMID:25845514
    reference_title: "CHILD Syndrome: Successful Treatment of Skin Lesions with Topical Simvastatin/Cholesterol Ointment--A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the case of a 10-year-old girl treated with topical simvastatin
      and cholesterol ointment, after which her skin lesions significantly improved
      within the first 30 days of treatment.
    explanation: >-
      Independent case replication using simvastatin in place of lovastatin.
  - reference: PMID:31365666
    reference_title: "CHILD syndrome: successful treatment of skin lesions with topical lovastatin and cholesterol lotion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The authors report a 2-month-old patient presenting with typical features of
      CHILD syndrome that was treated with a topical solution containing
      cholesterol and lovastatin, with complete clearance of her CHILD nevus.
    explanation: >-
      An additional infant case had clearance of the nevus with the combination.

  - reference: PMID:21753784
    reference_title: Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Decreased inflammation, skin thickening, and scaling was noted as early as 4–6 weeks in both patients, and the severity scores decreased by 72% (patient 1) and 79% (patient 2) by 3 months.
    explanation: The uncontrolled two-patient study reports separate within-patient severity-score reductions, not comparative efficacy.
  - reference: PMID:21753784
    reference_title: Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We first addressed the possibility that skin lesions in CHILD syndrome primarily reflect cholesterol (pathway end-product) deficiency alone, but found no clinical improvement after 3 months of treatment with twice daily topical 10% cholesterol in hydrophilic ointment.
    explanation: This sequential observation argues against cholesterol-alone efficacy in the two patients; no statin-only arm tested the necessity of supplementation.
- name: Topical Simvastatin Monotherapy
  description: Uncontrolled reports describe improvement with topical simvastatin without added cholesterol. In an infant treated with 2% ointment twice daily, improvement appeared by three weeks and the skin largely normalized by six weeks, with maintenance treatment over ten months. A later 5% report describes variable responses by site and recurrent lesions; it follows the previously reported p.Gly44Ser patient rather than adding an independent genotype case. Comparative efficacy and long-term safety are not established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: simvastatin
      term:
        id: CHEBI:9150
        label: simvastatin
  evidence:

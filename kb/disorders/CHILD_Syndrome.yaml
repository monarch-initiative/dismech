phenotypes:
- category: Cutaneous
  name: Ichthyosiform nevus
  description: >-
    Inflammatory erythematous plaques with yellowish waxy scale usually appear at birth or in early infancy. Lesions can be patchy, follow Blaschko lines, or involve both sides. Many improve with age, while intertriginous lesions can persist and new lesions can arise later, including at sites of injury.
  phenotype_term:
    preferred_term: Ichthyosiform nevus
    term:
      id: HP:0010816
      label: Epidermal nevus
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CHILD syndrome is characterized by unilateral distribution of ichthyosiform
      skin lesions and ipsilateral limb defects that range from shortening of the
      metacarpals and phalanges to absence of the entire limb.
    explanation: >-
      GeneReviews names the unilateral ichthyosiform lesion as a defining feature.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:24060582
    reference_title: "The role of abnormalities in the distal pathway of cholesterol synthesis in the Congenital Hemidysplasia with Ichthyosiform erythroderma and Limb Defects (CHILD) syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The CHILD syndrome skin is characterized by plaques topped by waxy scales
      and a variety of developmental defects in extracutaneous tissues,
      particularly limb hypoplasia or aplasia.
    explanation: >-
      Describes the characteristic morphology of the plaques.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK51754/pdf/Bookshelf_NBK51754.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Most of the skin lesions improve spontaneously, but some can cause lifelong morbidity. Lesions in the intertriginous areas tend to be more persistent; this is termed ptychotropism
    explanation: GeneReviews describes the variable natural history and persistence in body folds.
- category: Cutaneous
  name: Strict midline demarcation of skin lesions
  description: >-
    Skin lesions typically have a sharp boundary at the body midline. Limited lesions can follow Blaschko lines, and molecularly confirmed bilateral, almost symmetric involvement has been reported; bilateral involvement does not exclude CHILD syndrome.
  phenotype_term:
    preferred_term: strict midline demarcation of the cutaneous eruption
  evidence:
  - reference: PMID:10710235
    reference_title: "Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an inflammatory nevus with striking lateralization and strict midline
      demarcation, as well as ipsilateral hypoplasia of the body
    explanation: >-
      States the midline demarcation of the nevus, which is the claim this
      phenotype makes.
  - reference: PMID:7408908
    reference_title: "The CHILD syndrome. Congenital hemidysplasia with ichthyosiform erythroderma and limb defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The syndrome is characterized by unilateral erythema and scaling, with a
      distinct demarcation in the middle of the trunk.
    explanation: >-
      The original delineation locates the demarcation anatomically, at the
      middle of the trunk.
  - reference: PMID:11907515

      quote_role: PRIMARY_RESULT
    model_scale: MOLECULAR
  - target: X-Inactivation-Dependent NSDHL Expression Mosaicism
    description: Heterozygous female mice show patches of NSDHL-positive and NSDHL-negative tissue.
    evidence:
    - reference: PMID:19631568
      reference_title: Developmental expression pattern of the cholesterogenic enzyme NSDHL and negative selection of NSDHL-deficient cells in the heterozygous Bpa(1H)/+ mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Heterozygous Bpa(1H) females are mosaic for NSDHL expression due to normal random X-inactivation.
      explanation: The mouse model reproduces mosaic expression, while its pattern differs from human lateralization.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Mouse patches and stripes differ from a human body-half boundary; tissue X-inactivation and selection are context-dependent.
    fidelity: MODERATE
  - target: Age-Dependent Depletion of NSDHL-Deficient Cells
    description: Cross-sectional mouse age groups show a higher proportion of NSDHL-positive hepatocytes with age.
    evidence:
    - reference: PMID:19631568
      reference_title: Developmental expression pattern of the cholesterogenic enzyme NSDHL and negative selection of NSDHL-deficient cells in the heterozygous Bpa(1H)/+ mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: These data suggest that the higher percentage of WT hepatocytes present in livers from older Bpa1H females is the cumulative result of postnatal differences in either the growth rate or survival of WT vs mutant hepatocytes.
      explanation: Cross-sectional age groups support selection in mouse liver while leaving differential survival versus proliferation unresolved.
    - reference: PMID:19631568
      reference_title: Developmental expression pattern of the cholesterogenic enzyme NSDHL and negative selection of NSDHL-deficient cells in the heterozygous Bpa(1H)/+ mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: 'The average percentage of NSDHL positive hepatocytes in livers from six Bpa1H P6 females was 52 (SD: 5). Among six mutant livers at P25, the average percentage of NSDHL positive hepatocytes increased to 62 (SD: 9).'
      explanation: The comparison concerns different mouse age groups and liver tissue, not serial biopsies of human skin.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: The quantitative comparison is in liver, with additional brain observations. Mutant skin remains at eight weeks; this is not evidence of longitudinal clearance in human skin.
    fidelity: MODERATE
  - target: Placental Labyrinth Dysmorphogenesis
    description: Nsdhl mouse alleles exhibit a thin labyrinth, reduced fetal vessels, and reduced trophoblast proliferation.
    evidence:
    - reference: PMID:15639195
      reference_title: Placental defects are associated with male lethality in bare patches and striated embryos deficient in the NAD(P)H Steroid Dehydrogenase-like (NSDHL) Enzyme.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Although no consistent anomalies were identified in affected male embryos themselves, the labyrinth layer of the fetal placenta was always thinner, with fewer fetal vessels and decreased proliferation of labyrinth trophoblast cells.
      explanation: Several mouse alleles show a placental structural phenotype associated with prenatal lethality; it does not establish the cause of every male loss or a human placental lesion.
    - reference: PMID:17028112
      reference_title: Analysis of Nsdhl-deficient embryos reveals a role for Hedgehog signaling in early placental development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Further, affected placentas from mutant Nsdhl(Bpa-8H) male embryos demonstrate markedly decreased or no Ptch1-lacZ staining and no migration of Ihh expressing cells into the developing placenta.
      explanation: Placental reporter and cellular-distribution observations implicate Hedgehog signaling in this mouse allele.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: TISSUE
    limitations: Placental findings and timing vary by allele. Rodent placental X-inactivation differs from humans, and human placental pathology has not been established.
    fidelity: MODERATE
  - target: Reduced EGFR Signaling
    description: NSDHL-null mouse skin has reduced activated EGFR and downstream signals with reduced proliferation.
    evidence:
    - reference: PMID:23125191
      reference_title: Targeting C4-demethylating genes in the cholesterol pathway sensitizes cancer cells to EGF receptor inhibitors via increased EGF receptor degradation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The reduced intracellular EGFR staining was accompanied by a marked loss of phosphorylated (activated) Y1173-EGFR ... signal in the NSDHL-null areas.
      explanation: NSDHL-null patches of mouse skin had reduced activated EGFR; the original sentence also reports reduced ERK and AKT phosphorylation.
    - reference: PMID:23125191
      reference_title: Targeting C4-demethylating genes in the cholesterol pathway sensitizes cancer cells to EGF receptor inhibitors via increased EGF receptor degradation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The NSDHL-null areas of the skin also exhibited significantly reduced proliferation, as determined by Ki-67 ... expression and in vivo BrdU incorporation
      explanation: Mouse skin proliferation was reduced, so human hyperkeratosis must not be generalized into a universal increase in cellular proliferation.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: These are mouse skin observations. Similar signaling changes have not been demonstrated in human CHILD lesions, and they do not imply universal epidermal hyperproliferation.
    fidelity: MODERATE
  - target: Impaired Anagen Hair Growth
    description: Mutant mouse skin has impaired anagen growth despite apparently normal early follicle morphology.
    evidence:
    - reference: PMID:19631568
      reference_title: Developmental expression pattern of the cholesterogenic enzyme NSDHL and negative selection of NSDHL-deficient cells in the heterozygous Bpa(1H)/+ mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The mutant follicles were smaller and shorter than adjacent WT follicles and lacked hair shafts, consistent with defective anagen hair growth.
      explanation: Mouse mutant skin shows defective postnatal anagen growth; initial P2 follicle morphology was not grossly abnormal.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: TISSUE
    limitations: The hair-cycle observations are murine; they do not establish a specific SHH defect in patient follicles.
    fidelity: MODERATE

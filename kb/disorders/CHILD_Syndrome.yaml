differential_diagnoses:
- name: X-linked chondrodysplasia punctata 2 (Conradi-Hunermann-Happle syndrome)
  disease_term:
    preferred_term: X-linked chondrodysplasia punctata 2
    term:
      id: MONDO:0020603
      label: X-linked chondrodysplasia punctata 2
  description: >-
    EBP-related X-linked chondrodysplasia punctata 2 is a distinct sterol-biosynthesis disorder with overlapping ichthyotic skin and skeletal findings. An early patient described clinically as CHILD syndrome had an EBP nonsense variant and a CDPX2 sterol profile. Current GeneReviews places EBP-related CDPX2 in the differential of NSDHL-related CHILD syndrome; the historical label does not establish EBP as a second causative gene for this entry.
  distinguishing_features:
  - CDPX2 commonly has bilateral asymmetric skin and skeletal involvement. CHILD often has sharper lateralization, but bilateral CHILD presentations mean distribution alone is not definitive.
  - CDPX2 is caused by EBP variants affecting sterol delta8-delta7 isomerization, a different enzymatic step from NSDHL-dependent C4-demethylation.
  - CDPX2 carries a plasma sterol signature of raised 8-dehydrocholesterol and 8(9)-cholestenol that NSDHL-related CHILD syndrome does not
  evidence:
  - reference: PMID:10710235
    reference_title: "Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause CHILD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EBP was unaffected in the patients analyzed by us demonstrating that CHILD
      syndrome and CDPX2 are not caused by allelic mutations.
    explanation: >-
      Establishes that in this cohort the two are genetically distinct despite
      their shared pathway and overlapping clinical picture.
  - reference: PMID:10710233
    reference_title: "CHILD syndrome caused by deficiency of 3beta-hydroxysteroid-delta8, delta7-isomerase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      although the skeletal defects and skin lesions in CDPX2 are bilateral and
      asymmetric
    explanation: >-
      States the clinical distinction in lesion distribution that separates the
      two on examination.

- name: Inflammatory linear verrucous epidermal nevus (ILVEN)
  disease_term:
    preferred_term: inflammatory linear verrucous epidermal nevus
    term:
      id: MONDO:0019318
      label: inflammatory linear verrucous epidermal nevus
  description: >-
    ILVEN can resemble the inflammatory verrucous CHILD nevus. A reported boy initially suspected to have CHILD syndrome was diagnosed with severe ILVEN despite ipsilateral contracture and short stature. Distribution and extracutaneous findings therefore require interpretation together with molecular and biochemical testing.
  distinguishing_features:
  - A pathogenic NSDHL variant and the corresponding sterol-biosynthesis abnormality support CHILD syndrome; negative or incomplete testing alone does not prove ILVEN.
  - Both ILVEN and CHILD lesions can follow Blaschko lines, so that pattern alone does not distinguish them.
  - ILVEN lacks the ipsilateral skeletal hypoplasia or aplasia of CHILD syndrome, though an ipsilateral limb contracture has been reported in ILVEN, so limb involvement alone does not settle it
  - CHILD syndrome predominantly affects females, but rare mosaic males are reported; male sex alone does not exclude it.
  evidence:
  - reference: PMID:39953436
    reference_title: "Unilateral widespread inflammatory linear verrucous epidermal nevus with ipsilateral limb contracture along the lines of Blaschko: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initially, we suspected this may be a rare case of CHILD syndrome in a boy.
      However, after further investigation, we confirmed the diagnosis as a
      severe form of ILVEN.
    explanation: >-
      A worked case of the differential actually being made, with CHILD syndrome
      as the initial working diagnosis and ILVEN as the resolution.
  - reference: PMID:39953436
    reference_title: "Unilateral widespread inflammatory linear verrucous epidermal nevus with ipsilateral limb contracture along the lines of Blaschko: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He also had an associated contracture in the ipsilateral limb and short
      stature.
    explanation: >-
      Documents that the ILVEN case carried ipsilateral limb findings too, which
      is why extracutaneous involvement does not by itself distinguish the two.

- name: CK syndrome
  description: >-
    CK syndrome is an allelic NSDHL disorder associated with hypomorphic variants. Affected males typically have intellectual disability, behavioral problems, infantile seizures, cortical malformations and microcephaly. This differs from the predominant cutaneous and limb phenotype of CHILD syndrome, although both disorders can have CNS manifestations.
  distinguishing_features:
  - CK syndrome typically affects males with hypomorphic NSDHL variants; CHILD syndrome predominantly affects heterozygous females, with rare mosaic males.
  - CK syndrome is dominated by cognitive impairment, seizures, and cortical malformation, whereas intellect is usually normal in CHILD syndrome
  - CK syndrome lacks the lateralized ichthyosiform nevus and ipsilateral limb defects
  evidence:
  - reference: PMID:21290788
    reference_title: "NSDHL-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of CK syndrome is established in a male proband with a
      hemizygous NSDHL hypomorphic pathogenic variant identified by molecular
      genetic testing that results in partial loss of functional decarboxylating
      sterol-4-alpha-carboxylate 3-dehydrogenase.
    explanation: >-
      States the allelic relationship and the partial-loss-of-function basis that
      separates CK syndrome from CHILD syndrome.

    quote_role: REVIEW_SYNTHESIS
discussions:
- discussion_id: lateralization_mechanism_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#X-Inactivation-Dependent NSDHL Expression Mosaicism
  prompt: >-
    What mechanism converts random X inactivation into a body-half boundary in
    CHILD syndrome, rather than the finer Blaschko-line mosaicism seen in other
    X-linked genodermatoses?
  rationale: >-
    Expression differences between cultured keratinocytes from affected and unaffected patient skin are consistent with functional mosaicism but do not explain the geometry of the boundary. Age-dependent selection in mouse liver and brain is a separate observation; human skin clone clearance has not been measured longitudinally. Mouse and canine lesion patterns differ from typical human lateralization. Paired spatial and allele-expression measurements could distinguish developmental lineage allocation from subsequent tissue-specific selection.
  proposed_experiments:
  - experiment_id: lateralization_lineage_mapping
    name: Lineage and allele-expression mapping across the midline in CHILD skin
    description: >-
      Single-cell or spatial transcriptomic mapping of NSDHL allele expression
      across the midline boundary in affected individuals, paired with clonal
      lineage inference, to determine whether the boundary reflects an early
      embryonic left-right lineage restriction, a later selective clearance front,
      or an unrecognized signalling boundary.
  evidence:
  - reference: PMID:21753784
    reference_title: Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 'However, RT-PCR on cDNA from keratinocytes and fibroblasts isolated from the affected versus clinically unaffected side in Patient #1 demonstrated exclusive expression of the mutant allele by affected cultured keratinocytes, while unaffected keratinocytes solely expressed the wild type allele'
    explanation: Cultures from one patient showed side-specific NSDHL allele expression; this is not a longitudinal measure of cell clearance.
  - reference: PMID:21753784
    reference_title: Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder of distal cholesterol metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Only the normal allele was expressed by unaffected fibroblasts, but fibroblasts from the clinically affected area expressed an approximately even distribution of normal and mutant alleles.
    explanation: Fibroblast expression in affected skin did not match the exclusively mutant keratinocyte pattern.
  - reference: PMID:19631568
    reference_title: Developmental expression pattern of the cholesterogenic enzyme NSDHL and negative selection of NSDHL-deficient cells in the heterozygous Bpa(1H)/+ mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These data suggest that the higher percentage of WT hepatocytes present in livers from older Bpa1H females is the cumulative result of postnatal differences in either the growth rate or survival of WT vs mutant hepatocytes.
    explanation: Cross-sectional age groups support selection in mouse liver while leaving differential survival versus proliferation unresolved.
- discussion_id: male_lethality_placental_mechanism_human
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Placental Labyrinth Dysmorphogenesis
  prompt: >-
    Do the placental abnormalities associated with prenatal death in Nsdhl-mutant mice contribute to human male lethality?
  rationale: >-
    Nsdhl mouse studies associate placental labyrinth abnormalities with prenatal death, but the timing varies by allele and the findings do not establish a universal human mechanism. Rodent and human placental X-inactivation differ. A report of recurrent male pregnancy losses identified maternal and fetal NSDHL c.790-6C>T, but classified it as a variant of uncertain significance, predicted a splice effect without functional confirmation, and tested only one lost conceptus. That report does not confirm NSDHL-mediated recurrent fetal lethality or the placental mechanism in humans.
  proposed_experiments:
  - experiment_id: human_nsdhl_trophoblast_model
    name: NSDHL-null human trophoblast organoid vascularization assay
    description: >-
      Generate NSDHL loss-of-function human trophoblast stem cell or placental
      organoid models and assay Hedgehog pathway activity, trophoblast
      proliferation, and vascular network formation, to test whether the murine
      labyrinth phenotype has a human counterpart independent of rodent-specific
      placental X inactivation.
  evidence:
  - reference: PMID:15639195
    reference_title: "Placental defects are associated with male lethality in bare patches and striated embryos deficient in the NAD(P)H Steroid Dehydrogenase-like (NSDHL) Enzyme."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      X-inactivation is non-random in females in most lineages of the rodent
      placenta with preferential inactivation of the paternal X chromosome.
    explanation: >-
      States the rodent-specific placental X-inactivation arrangement that the
      mouse inference depends on and that does not transfer to humans.
  - reference: PMID:36504312
    reference_title: 'Etiological identification of recurrent male fatality due to a novel NSDHL gene mutation using trio whole-exome sequencing: A rare case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: According to ACMG guidelines, the variant has been classified as a variant of uncertain significance.
    explanation: The primary report explicitly classifies c.790-6C>T as uncertain; its more assertive abstract does not establish causality.
  - reference: PMID:36504312
    reference_title: 'Etiological identification of recurrent male fatality due to a novel NSDHL gene mutation using trio whole-exome sequencing: A rare case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: However, further work is required to verify the relationship between the c.790-6C>T variant and CHILD syndrome.
    explanation: The authors acknowledge that the variant-disease relationship requires further verification.
- discussion_id: nsdhl_versus_ebp_nosological_boundary
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - genetic#NSDHL
  prompt: >-
    How should the historical EBP-positive case labeled CHILD syndrome be interpreted within the current NSDHL-defined disease boundary?
  rationale: >-
    An early report identified an EBP nonsense variant and a CDPX2 plasma sterol profile in a patient clinically labeled CHILD syndrome. The NSDHL discovery cohort instead found EBP unaffected, and current GeneReviews defines CHILD syndrome through NSDHL while listing EBP-related CDPX2 as a differential diagnosis. The early clinical label alone is insufficient evidence of locus heterogeneity. Reassessment of historical cases may clarify phenotypic overlap, but does not justify recording EBP as causative for NSDHL-related CHILD syndrome.
  proposed_experiments:
  - experiment_id: child_locus_reassessment_cohort
    name: Genotype and sterol reassessment of the assembled CHILD case literature
    description: >-
      Assemble the published CHILD syndrome cases with molecular data, and where
      material allows, determine NSDHL versus EBP genotype together with plasma
      sterol profile and lesion distribution, to establish whether EBP-related
      cases form a clinically separable subgroup or are distributed through the
      CHILD phenotype.
  evidence:
  - reference: PMID:10710233
    reference_title: "CHILD syndrome caused by deficiency of 3beta-hydroxysteroid-delta8, delta7-isomerase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We speculate that at least some cases of CHILD syndrome are allelic with
      CDPX2 caused by 3beta-hydroxysteroid-delta8,delta7-isomerase deficiency.
    explanation: >-
      The authors' own hedged phrasing is the open question this discussion
      records.

notes: >-
  This entry covers NSDHL-related CHILD syndrome. CK syndrome is an allelic differential diagnosis, and EBP-related CDPX2 is a distinct sterol-biosynthesis disorder. Intellect is usually normal, although brain malformations and neurologic manifestations can occur. Sterol-dependent Hedgehog effects are supported principally by experimental models and should not be interpreted as a primary ciliary assembly defect. Tissue-specific mosaicism limits the interpretation of blood testing and systemic biochemical measurements.

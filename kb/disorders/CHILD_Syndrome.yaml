    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Institutional approval was obtained for the off-label use of 2% ketoconazole cream. The pre-treatment Dermatology Life Quality Index (DLQI) score was 3 out of 30.
    explanation: The adult report specifies the off-label formulation and baseline quality-of-life score.
  - reference: PMID:39565229

    explanation: The clinical endpoints distinguish symptom improvement from the unchanged area at one week.
  - reference: PMID:39565229
    reference_title: Improvement of Skin Lesions in an Adult with CHILD Syndrome Treated with 2% Ketoconazole Cream.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT

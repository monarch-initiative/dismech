name: CHILD Syndrome
creation_date: "2026-08-13T19:20:00Z"
category: Mendelian
description: >-
  CHILD syndrome (Congenital Hemidysplasia with Ichthyosiform nevus and Limb
  Defects) is an X-linked dominant, usually male-lethal disorder of the distal
  (post-squalene) cholesterol biosynthetic pathway, caused by loss-of-function
  variants in NSDHL at Xq28. NSDHL encodes the NAD(P)H steroid
  dehydrogenase-like protein, the 3-beta-hydroxysteroid dehydrogenase and
  C4-decarboxylase that removes the C-4 methyl groups from lanosterol-derived
  intermediates. Its mechanistic interest is that the lesion is dual rather than
  single: affected cells are simultaneously starved of the pathway end product,
  cholesterol, and poisoned by the methylsterol intermediates that pile up above
  the enzymatic block. Neither arm alone explains the disease, and the
  therapeutic proof of this came from a topical trial in which cholesterol
  replacement alone failed while cholesterol combined with a statin, which shuts
  off the flux generating the toxic intermediates, cleared the skin. The
  syndrome's other signature is its striking lateralization: because NSDHL is
  X-linked and subject to random X inactivation, a heterozygous female is a
  functional mosaic, and lesional skin is populated by keratinocytes expressing
  the mutant allele while contralateral clinically normal skin expresses only
  the wild-type allele. Mutant-expressing cells are under continuing negative
  selection, which accounts both for that asymmetry and for the tendency of skin
  lesions to improve with age; what remains unexplained is why the boundary is a
  sharp body midline rather than the finer Blaschko striping seen in most
  X-linked mosaic genodermatoses. Cholesterol is also required for Hedgehog
  signal transduction, which links NSDHL deficiency to the ipsilateral limb
  defects, to the hair-follicle failure that persists even after the skin
  clears, and to the placental labyrinth defect that appears to underlie male
  lethality. Hypomorphic NSDHL alleles cause a clinically distinct allelic
  disorder in males, CK syndrome.
synonyms:
- CHILD syndrome
- congenital hemidysplasia with ichthyosiform nevus and limb defects
- congenital hemidysplasia with ichthyosiform erythroderma and limb defects
- CHILD nevus
disease_term:
  preferred_term: CHILD syndrome
  term:
    id: MONDO:0010621
    label: CHILD syndrome
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      An X-linked Mendelian disorder whose clinical logic - mosaic expression
      under random X inactivation, male lethality - is genetic rather than
      organ-system based.
  - classification_value: DERMATOLOGY
    notes: >-
      The presenting and most persistent manifestation is a cutaneous one, the
      unilateral ichthyosiform nevus, and the disorder's therapeutic proof of
      mechanism (topical cholesterol plus statin) is a dermatologic
      intervention.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Also an inborn error of metabolism: an enzymatic block in post-squalene
      cholesterol biosynthesis, confirmed by the sterol profile.
  icimd_category:
  - classification_value: sterol_metabolism
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of sterol
      metabolism" under category "Disorders of lipid metabolism". NSDHL is the
      C4-demethylation-complex sterol dehydrogenase/decarboxylase of the distal
      cholesterol pathway.
  isds_skeletal_category:
  - classification_value: chondrodysplasia_punctata
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 23 "Chondrodysplasia punctata (CDP) group", row
      NOS 23-0030 "Congenital hemidysplasia, ichthyosis, limb defects (CHILD)
      syndrome, NSDHL-related" (MIM 308050). The placement is the nosology's,
      not an inference from the skeletal phenotype: CHILD syndrome is grouped
      with the other CDPs because affected infants show punctate epiphyseal
      calcification, and it sits alongside the other post-squalene
      cholesterol-pathway member of the group, CDPX2 (EBP). Note the group is
      radiographically rather than mechanistically defined, so CHILD's nearest
      mechanistic relatives in dismech - Smith-Lemli-Opitz syndrome and the other
      sterol-biosynthesis disorders - are not group-23 entities.


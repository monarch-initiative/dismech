genetic:
  - name: SLC10A2
    relationship_type: CAUSATIVE
    gene_term:
      preferred_term: SLC10A2
      term:
        id: hgnc:10906
        label: SLC10A2
    notes: >-
      A171S is a common polymorphism, not a pathogenic variant: it was present
      in 28% of controls and had no effect on taurocholate uptake. It is
      recorded here because it sits on the same allele as the pathogenic splice
      change in the index family, and a variant-level reading of that genotype
      that did not distinguish the two would mis-assign causality.
    inheritance:
      - name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:

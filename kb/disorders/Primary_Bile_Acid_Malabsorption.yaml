name: Primary Bile Acid Malabsorption
creation_date: "2026-08-28T00:05:00Z"
category: Mendelian
description: >-
  Primary bile acid malabsorption is a congenital diarrhoeal disorder caused by
  biallelic loss-of-function variants in SLC10A2, which encodes the ileal apical
  sodium-dependent bile acid transporter (ASBT, also called IBAT). ASBT performs
  the active reclamation step of the enterohepatic circulation: it takes bile
  acids back up across the apical membrane of terminal ileal enterocytes so they
  can return to the liver. Without it, bile acids are not recovered, they spill
  into the colon where they act as secretagogues, and the result is
  congenital-onset watery diarrhoea with steatorrhoea. The interruption of the
  enterohepatic circulation has a second consequence away from the gut: the bile
  acid pool contracts, hepatic synthesis is de-repressed to compensate, and
  because that synthesis consumes cholesterol, plasma cholesterol falls. The
  disease is important out of proportion to its rarity because the same
  transporter is a deliberate drug target - partial pharmacological ASBT
  inhibition is used to treat cholestatic pruritus and has been explored for
  hypercholesterolaemia - so this disorder is in effect the complete-loss end of
  a dose-response curve that medicine now traverses on purpose.
parents:
  - Congenital Diarrhoeal Disorder
  - Inborn Error of Metabolism
synonyms:
  - PBAM
  - congenital bile acid diarrhoea
  - ileal bile acid transporter deficiency
  - ASBT deficiency
  - bile acid malabsorption, primary, 1
disease_term:
  preferred_term: bile acid malabsorption, primary, 1
  term:
    id: MONDO:0013214
    label: bile acid malabsorption, primary, 1
notes: >-
  Evidence-base caveat. The human evidence for this disease is a handful of
  molecularly confirmed case reports - the 1997 index family plus at least two
  further genotyped patients - and there is no cohort, no natural-history
  series, and no per-phenotype frequency data. Phenotypes in this entry
  therefore carry no frequency values. That is the reason, and it is worth
  stating precisely: the problem is the absence of a denominator, not the number
  of families.

  The case-report literature also does something a cohort would not: it shows
  how wide the phenotype is. A homozygous patient reported in 2025 had lifelong
  severe fat-soluble vitamin deficiency, rickets, a hypocalcaemic seizure in
  infancy and reduced final height, with normal stool frequency and consistency
  and no steatorrhoea at all. Diarrhoea and steatorrhoea are therefore not
  obligate features, and an entry that modelled only those would miss the
  presentation that took eighteen years to diagnose. The vitamin-deficiency arm
  is curated below for that reason.

  The strongest mechanistic evidence remains the Slc10a2-null mouse, which - as
  the HUMAN_MODEL_MISMATCH discussion records - reproduces the transport defect
  faithfully while not reproducing the human malabsorptive phenotype.

  Scope. MONDO:0013214 is primary bile acid malabsorption type 1 specifically.
  PBAM2, caused by SLC51B/OSTbeta variants and presenting with chronic diarrhoea
  plus cholestatic liver features, is a distinct Mendelian entity and is
  deliberately out of scope here. It is the easier of the two neighbours to
  confuse this entry with, so it is named alongside the acquired condition
  below.

  Terminology caution. "Bile acid malabsorption" is used far more often in
  gastroenterology for the common acquired condition - after ileal resection, in
  Crohn disease, post-cholecystectomy, or idiopathic - which is a different
  entity with a different mechanism and is not curated here. This entry is the
  primary, SLC10A2-determined congenital form only.
prevalence:
  - population: Worldwide
    measure_type: CASES_IN_LITERATURE
    prevalence_class: ULTRA_RARE
    notes: >-
      A handful of molecularly confirmed cases. Recorded as a class rather than
      a rate because no denominator exists; this makes the caveat in the entry's
      top-level notes machine-readable rather than prose-only.
inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >-
      The index family carried compound heterozygous variants: one allele with a
      splice-donor change, the other with two missense substitutions that
      together abolish transport.
    evidence:
      - reference: PMID:9109432
        reference_title: >-
          Primary bile acid malabsorption caused by mutations in the ileal
          sodium-dependent bile acid transporter gene (SLC10A2).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Four polymorphisms were identified and sequenced in a family with
          congenital PBAM. One allele encoded an A171S missense mutation and a
          mutated donor splice site for exon 3. The other allele encoded two
          missense mutations at conserved amino acid positions, L243P and T262M.
        explanation: >-
          Describes the compound heterozygous allele structure in the index
          family, consistent with autosomal recessive inheritance.
pathophysiology:
  - name: Loss of ASBT Bile Acid Transport Function
    biological_scale: MOLECULAR
    description: >-
      Biallelic SLC10A2 variants abolish sodium-coupled bile acid uptake. The
      1997 transfection work is unusually informative about how: the L243P and
      T262M mutant proteins were expressed normally and trafficked normally to
      the plasma membrane, yet transported no taurocholate. The lesion is
      therefore in transport function itself, not in protein folding, stability
      or membrane delivery, which is why it is modelled as a molecular
      functional defect rather than as a protein-loss node.
    genes:
      - preferred_term: SLC10A2
        term:
          id: hgnc:10906
          label: SLC10A2
    molecular_functions:
      - preferred_term: bile acid:sodium symporter activity
        term:
          id: GO:0008508
          label: bile acid:sodium symporter activity
        modifier: LOSS_OF_FUNCTION
    cell_types:
      - preferred_term: terminal ileal enterocyte
        term:
          id: CL:1000334
          label: enterocyte of epithelium of small intestine
    locations:
      - preferred_term: ileum
        term:
          id: UBERON:0002116
          label: ileum
    downstream:
      - target: Failure of Ileal Bile Acid Reclamation
    evidence:
      - reference: PMID:9109432
        reference_title: >-
          Primary bile acid malabsorption caused by mutations in the ileal
          sodium-dependent bile acid transporter gene (SLC10A2).
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          In transfected COS cells, the L243P, T262M, and double mutant
          (L243P/T262M) did not affect transporter protein expression or
          trafficking to the plasma membrane; however, transport of taurocholate
          and other bile acids was abolished.
        explanation: >-
          Establishes that the mutant transporter reaches the membrane but does
          not transport, which is exactly the distinction this node makes.
          Graded IN_VITRO because the assay was in transfected COS cells.
      - reference: PMID:9109432
        reference_title: >-
          Primary bile acid malabsorption caused by mutations in the ileal
          sodium-dependent bile acid transporter gene (SLC10A2).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The dysfunctional mutations were not detected in 104 unaffected
          control subjects, whereas the A171S was present in 28% of that
          population.
        explanation: >-
          The control-screening result that separates the two dysfunctional
          alleles from the common A171S polymorphism, which had no effect on
          taurocholate uptake. Included because it is what makes the
          genotype-function assignment credible on a single family.
  - name: Failure of Ileal Bile Acid Reclamation
    biological_scale: TISSUE
    description: >-
      Active reabsorption in the terminal ileum is the step that normally
      recovers the great majority of the bile acid pool on each enterohepatic
      cycle. Its loss cannot be compensated: the mouse knockout shows that
      alternative absorptive mechanisms, including passive uptake along the rest
      of the intestine, do not make up the shortfall.
    biological_processes:
      - preferred_term: bile acid and bile salt transport
        term:
          id: GO:0015721
          label: bile acid and bile salt transport
        modifier: DECREASED
    locations:
      - preferred_term: ileum
        term:
          id: UBERON:0002116
          label: ileum
    downstream:
      - target: Colonic Bile Acid Spillover and Secretory Diarrhoea
      - target: Contracted Bile Acid Pool and Compensatory Hepatic Synthesis
    evidence:
      - reference: PMID:12819193
        reference_title: >-
          Targeted deletion of the ileal bile acid transporter eliminates
          enterohepatic cycling of bile acids in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          These data indicate that Slc10a2 is essential for efficient intestinal
          absorption of bile acids and that alternative absorptive mechanisms
          are unable to compensate for loss of Slc10a2 function.
        explanation: >-
          Establishes both that the transporter is required and that no
          alternative route compensates, which is the non-redundancy claim this
          node makes. Graded MODEL_ORGANISM.
      - reference: PMID:11396803
        reference_title: "Intestinal bile acid transport: biology, physiology, and pathophysiology."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          This process is primarily localized to the terminal ileum and is
          mediated by a 48-kd sodium-dependent bile acid cotransporter (SLC10A2
          = ASBT).
        explanation: >-
          Localises the reclamation step to the terminal ileum and names the
          responsible transporter. Graded OTHER because this is a review article
          rather than a primary study.
  - name: Colonic Bile Acid Spillover and Secretory Diarrhoea
    biological_scale: ORGANISM
    description: >-
      Unabsorbed bile acids pass into the colon and watery diarrhoea follows
      from birth. The colonic secretagogue mechanism - bile acids driving water
      and electrolyte secretion through cAMP, TGR5 and aquaporin changes - is
      the standard textbook account, but neither citation on this node
      establishes it, so the node claims only the delivery and the diarrhoea and
      leaves the secretory mechanism to be evidenced by a curator who has a
      source for it. The rat pelvic-irradiation model, in which
      ileal Asbt is downregulated by radiation rather than by mutation, shows
      the same redistribution - ileal bile acids fall, colonic and faecal bile
      acids rise, diarrhoea follows - and is included here as convergent
      evidence for the mechanism from a different cause of the same transporter
      loss.
    locations:
      - preferred_term: colon
        term:
          id: UBERON:0001155
          label: colon
    downstream:
      - target: Steatorrhoea and Fat Malabsorption
    evidence:
      - reference: PMID:9109432
        reference_title: >-
          Primary bile acid malabsorption caused by mutations in the ileal
          sodium-dependent bile acid transporter gene (SLC10A2).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Primary bile acid malabsorption (PBAM) is an idiopathic intestinal
          disorder associated with congenital diarrhea, steatorrhea,
          interruption of the enterohepatic circulation of bile acids, and
          reduced plasma cholesterol levels.
        explanation: >-
          The clinical definition, naming congenital diarrhoea as the presenting
          feature.
      - reference: PMID:31900034
        reference_title: "Mechanism of Asbt (Slc10a2)-related bile acid malabsorption in diarrhea after pelvic radiation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Bile acid malabsorption is partially responsible for RID post-pelvic
          radiation in rats, and the potential mechanism is related to the
          downregulation of the ileal Asbt.
        explanation: >-
          Convergent evidence that reduced ileal Asbt causes bile acid
          malabsorption and diarrhoea, from an acquired rather than genetic
          cause. Graded MODEL_ORGANISM because the study is in rats, and
          included as mechanistic corroboration rather than as evidence about
          the genetic disease itself.
  - name: Contracted Bile Acid Pool and Compensatory Hepatic Synthesis
    biological_scale: ORGANISM
    description: >-
      Because bile acids are not returned to the liver, the pool contracts and
      hepatic bile acid synthesis is de-repressed. In the mouse this is
      quantified: faecal bile acid excretion rises 10- to 20-fold and the pool
      falls by 80% despite increased synthesis, and the residual pool becomes
      selectively enriched in cholic acid. Since bile acid synthesis consumes
      cholesterol, the sustained drain lowers plasma cholesterol in affected
      humans.
    biological_processes:
      - preferred_term: bile acid biosynthetic process
        term:
          id: GO:0006699
          label: bile acid biosynthetic process
        modifier: INCREASED
    downstream:
      - target: Reduced Plasma Cholesterol
    evidence:
      - reference: PMID:12819193
        reference_title: >-
          Targeted deletion of the ileal bile acid transporter eliminates
          enterohepatic cycling of bile acids in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In the Slc10a2-/- mice, fecal bile acid excretion was elevated 10- to
          20-fold and was not further increased by feeding a bile acid binding
          resin. Despite increased bile acid synthesis, the bile acid pool size
          was decreased by 80% and selectively enriched in cholic acid in the
          Slc10a2-/- mice.
        explanation: >-
          Quantifies the faecal loss, the compensatory synthesis and the net
          pool contraction this node models. Graded MODEL_ORGANISM.
  - name: Steatorrhoea and Fat Malabsorption
    biological_scale: ORGANISM
    description: >-
      A contracted bile acid pool impairs micellar solubilisation of dietary
      fat, producing steatorrhoea in affected humans. This node is where the
      mouse and the human diverge, and the divergence is recorded rather than
      reconciled - see the HUMAN_MODEL_MISMATCH discussion.
    evidence:
      - reference: PMID:9109432
        reference_title: >-
          Primary bile acid malabsorption caused by mutations in the ileal
          sodium-dependent bile acid transporter gene (SLC10A2).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          congenital diarrhea, steatorrhea, interruption of the enterohepatic
          circulation of bile acids, and reduced plasma cholesterol levels
        explanation: >-
          Names steatorrhoea among the defining clinical features of the human
          disease.
  - name: Fat-Soluble Vitamin Malabsorption
    biological_scale: ORGANISM
    description: >-
      Impaired micellar solubilisation carries the fat-soluble vitamins A, D, E
      and K down with dietary fat. This node was missing from the first version
      of this entry, which stopped one step short of it, and the omission
      mattered: in the 2025 genotyped case the vitamin deficiency was the entire
      presentation, producing rickets, a hypocalcaemic seizure in infancy and
      reduced final height in a patient with normal stools and no steatorrhoea.
      Lifelong vitamin supplementation, not sequestrant therapy, was what she
      actually needed.
    downstream:
      - target: phenotypes#Fat-Soluble Vitamin Deficiency
      - target: phenotypes#Rickets
    evidence:
      - reference: PMID:40814585
        reference_title: >-
          Homozygosity for a variant in SLC10A2 and infancy onset severe
          fat-soluble vitamin deficiency due to bile acid malabsorption.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We present a case of a young female patient with persistent and severe
          fat-soluble vitamin deficiency since infancy.
        explanation: >-
          Establishes fat-soluble vitamin deficiency as a presentation of
          SLC10A2 deficiency in a molecularly confirmed patient.
      - reference: PMID:40814585
        reference_title: >-
          Homozygosity for a variant in SLC10A2 and infancy onset severe
          fat-soluble vitamin deficiency due to bile acid malabsorption.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A bile retention scan showed severe bile acid malabsorption, with only
          1.6% of radioactively labeled bile acids retained 7 days after intake.
        explanation: >-
          Quantifies the malabsorption in the same patient, which is what links
          the vitamin deficiency to this entry's transport lesion rather than to
          some other cause.
  - name: Reduced Plasma Cholesterol
    biological_scale: ORGANISM
    description: >-
      Continuous faecal loss of bile acids forces sustained hepatic conversion
      of cholesterol into bile acids, lowering plasma cholesterol. This is the
      basis on which partial ASBT inhibition was pursued as a lipid-lowering
      strategy.
    evidence:
      - reference: PMID:9109432
        reference_title: >-
          Primary bile acid malabsorption caused by mutations in the ileal
          sodium-dependent bile acid transporter gene (SLC10A2).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          congenital diarrhea, steatorrhea, interruption of the enterohepatic
          circulation of bile acids, and reduced plasma cholesterol levels
        explanation: >-
          Names reduced plasma cholesterol among the defining features.
      - reference: PMID:11396803
        reference_title: "Intestinal bile acid transport: biology, physiology, and pathophysiology."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Partial inhibition of ASBT may be useful in the treatment of
          hypercholesterolemia and intrahepatic cholestasis.
        explanation: >-
          Supports the therapeutic corollary noted in this node's description:
          the same axis is deliberately targeted pharmacologically.

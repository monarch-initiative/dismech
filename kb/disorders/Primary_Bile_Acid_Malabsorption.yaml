  - name: Fat-Soluble Vitamin Deficiency
    category: Metabolic
    description: >-
      Deficiency of vitamins A, D, E and K, requiring lifelong supplementation.
      In at least one genotyped patient this was the presenting and dominant
      problem, with no diarrhoea or steatorrhoea.
    phenotype_term:
      preferred_term: Decreased circulating vitamin D concentration
      term:
        id: HP:0100512
        label: Decreased circulating vitamin D concentration
      temporality: CHRONIC
    evidence:
      - reference: PMID:40814585
        reference_title: >-
          Homozygosity for a variant in SLC10A2 and infancy onset severe
          fat-soluble vitamin deficiency due to bile acid malabsorption.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The patient was generally asymptomatic while receiving continuous
          vitamin subsidy.
        explanation: >-
          Establishes both the deficiency and its dependence on continuous
          replacement. The bound term names vitamin D specifically because HPO
          has no single fat-soluble-vitamin-deficiency term; the other three
          vitamins are named in the description rather than given manufactured
          bindings.
  - name: Rickets
    category: Skeletal
    description: >-
      Consequence of the vitamin D deficiency, radiographically confirmed in
      infancy in the 2025 case alongside a hypocalcaemic seizure.
    phenotype_term:
      preferred_term: Rickets
      term:
        id: HP:0002748
        label: Rickets
    evidence:
      - reference: PMID:40814585
        reference_title: >-
          Homozygosity for a variant in SLC10A2 and infancy onset severe
          fat-soluble vitamin deficiency due to bile acid malabsorption.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          An X-ray was performed and showed rachitis.
        explanation: >-
          The radiographic confirmation. Rachitis is the term the report uses
          for rickets.
  - name: Hypocalcemia
    category: Metabolic
    description: >-
      Presented as a nonfebrile generalised seizure at ten months of age, which
      was the patient's first hospitalisation.
    phenotype_term:
      preferred_term: Hypocalcemia
      term:
        id: HP:0002901
        label: Hypocalcemia
    evidence:
      - reference: PMID:40814585
        reference_title: >-
          Homozygosity for a variant in SLC10A2 and infancy onset severe
          fat-soluble vitamin deficiency due to bile acid malabsorption.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The patient's first hospitalization was at 10 months of age when she
          was admitted with a nonfebrile generalized seizure related to
          hypocalcemia
        explanation: >-
          The hypocalcaemic seizure that brought the patient to attention.
  - name: Growth Failure
    category: Growth
    description: >-
      Stunting is reported in two independent genotyped patients: extreme
      stunting in an infant with the diarrhoeal presentation, and a final height
      of 155.5 cm in the vitamin-deficiency presentation.
    phenotype_term:
      preferred_term: Short stature
      term:
        id: HP:0004322
        label: Short stature
    evidence:
      - reference: PMID:34192422
        reference_title: "SLC10A2 deficiency-induced congenital chronic bile acid diarrhea and stunting."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The patient's clinical manifestations were chronic diarrhea with
          increased BAs in the feces and extreme stunting, which was diagnosed
          as BAD.
        explanation: >-
          Growth failure in a homozygous SLC10A2 patient, severe enough to be in
          the paper's title.
      - reference: PMID:40814585
        reference_title: >-
          Homozygosity for a variant in SLC10A2 and infancy onset severe
          fat-soluble vitamin deficiency due to bile acid malabsorption.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Growth and weight were consistently below target with final height at
          155.5 cm
        explanation: >-
          Growth failure in a second, independently reported genotyped patient
          with a different presentation.
genetic:
  - name: SLC10A2
    relationship_type: CAUSATIVE
    gene_term:
      preferred_term: SLC10A2
      term:
        id: hgnc:10906
        label: SLC10A2
    notes: >-
      A171S is a common polymorphism, not a pathogenic variant: it was present
      in 28% of controls and had no effect on taurocholate uptake. It is
      recorded here because it sits on the same allele as the pathogenic splice
      change in the index family, and a variant-level reading of that genotype
      that did not distinguish the two would mis-assign causality.
    inheritance:
      - name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
    evidence:
      - reference: PMID:9109432
        reference_title: >-
          Primary bile acid malabsorption caused by mutations in the ileal
          sodium-dependent bile acid transporter gene (SLC10A2).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          These findings establish that SLC10A2 mutations can cause PBAM and
          underscore the ileal Na+/bile acid cotransporter's role in intestinal
          reclamation of bile acids.
        explanation: >-
          The authors' causal conclusion assigning PBAM to SLC10A2.
      - reference: PMID:11396803
        reference_title: "Intestinal bile acid transport: biology, physiology, and pathophysiology."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-

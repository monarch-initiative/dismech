animal_models:
  - name: Slc10a2-null mouse
    species: Mouse
    genotype: Slc10a2 homozygous null by targeted deletion
    publication: PMID:12819193
    description: >-
      Targeted disruption of Slc10a2 by homologous recombination. Homozygous
      nulls are physically indistinguishable from wild type. The model
      reproduces the transport lesion with high fidelity but does not reproduce
      the human malabsorptive illness.
    modeled_mechanisms:
      - target: Failure of Ileal Bile Acid Reclamation
        relationship: RECAPITULATES
        fidelity: HIGH
        description: >-
          Faecal bile acid excretion rises 10- to 20-fold and is not further
          increased by a bile acid binding resin, indicating essentially
          complete failure of active ileal reclamation.
        readouts:
          - name: Faecal bile acid excretion
            target: Failure of Ileal Bile Acid Reclamation
            direction: INCREASED
            interpretation: >-
              Direct quantification of the bile acids that active ileal uptake
              would normally have recovered.
            evidence:
              - reference: PMID:12819193
                reference_title: >-
                  Targeted deletion of the ileal bile acid transporter
                  eliminates enterohepatic cycling of bile acids in mice.
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: >-
                  In the Slc10a2-/- mice, fecal bile acid excretion was elevated
                  10- to 20-fold and was not further increased by feeding a bile
                  acid binding resin.
                explanation: >-
                  Reports the measurement and its magnitude, and the resin
                  result showing reclamation is already maximally impaired.
        evidence:
          - reference: PMID:12819193
            reference_title: >-
              Targeted deletion of the ileal bile acid transporter eliminates
              enterohepatic cycling of bile acids in mice.
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              These data indicate that Slc10a2 is essential for efficient
              intestinal absorption of bile acids and that alternative
              absorptive mechanisms are unable to compensate for loss of
              Slc10a2 function.
            explanation: >-
              Supports treating this model as informative for the reclamation
              node specifically.
      - target: Contracted Bile Acid Pool and Compensatory Hepatic Synthesis
        relationship: RECAPITULATES
        fidelity: HIGH
        description: >-
          The pool falls by 80% despite increased synthesis, and becomes
          selectively enriched in cholic acid.
        readouts:
          - name: Bile acid pool size
            target: Contracted Bile Acid Pool and Compensatory Hepatic Synthesis
            direction: DECREASED
            interpretation: >-
              Quantifies the net pool contraction that persists even after
              compensatory synthesis.
            evidence:
              - reference: PMID:12819193
                reference_title: >-
                  Targeted deletion of the ileal bile acid transporter
                  eliminates enterohepatic cycling of bile acids in mice.
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: >-
                  Despite increased bile acid synthesis, the bile acid pool size
                  was decreased by 80% and selectively enriched in cholic acid
                  in the Slc10a2-/- mice.
                explanation: >-
                  Reports the pool measurement, the compensatory synthesis, and
                  the compositional shift.
      - target: Steatorrhoea and Fat Malabsorption
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: >-
          On a low fat diet the Slc10a2-null mouse does not have steatorrhoea.
          Faecal neutral sterol excretion rises only 3-fold and intestinal
          cholesterol absorption falls only 20%, because the smaller
          cholic-acid-enriched pool is still sufficient to support intestinal
          lipid absorption.
        limitations: >-
          The mouse fails at exactly the node where the human disease is
          clinically defined. The most likely reasons are dietary and
          compositional rather than a difference in the transporter: the mice
          were studied on a low fat diet, so the residual pool was not stressed,
          and the selective cholic acid enrichment preserves micelle-forming
          capacity per unit of pool. The consequence for curation is that this
          model can be used to support the transport and pool nodes but must not
          be used to support the fat-malabsorption node, and its silence there
          is not evidence that human steatorrhoea is doubtful.
        evidence:
          - reference: PMID:12819193
            reference_title: >-
              Targeted deletion of the ileal bile acid transporter eliminates
              enterohepatic cycling of bile acids in mice.
            supports: REFUTE
            evidence_source: MODEL_ORGANISM
            snippet: >-
              On a low fat diet, the Slc10a2-/- mice did not have steatorrhea.
              Fecal neutral sterol excretion was increased only 3-fold, and
              intestinal cholesterol absorption was reduced only 20%,
              indicating that the smaller cholic acid-enriched bile acid pool
              was sufficient to facilitate intestinal lipid absorption.
            explanation: >-
              The negative result itself, with the authors' own explanation for
              it. Graded REFUTE because it refutes the proposition that this
              model reproduces the human fat-malabsorption phenotype, not the
              proposition that humans have steatorrhoea.
      - target: Reduced Plasma Cholesterol
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: >-
          Rather than the reduced plasma cholesterol seen in affected humans,
          plasma HDL cholesterol was slightly elevated in the null mice, a
          result the authors themselves flag as unexpected. Hepatic cholesteryl
          ester content did fall by half, so the hepatic drain is present; it is
          the plasma readout that does not translate.
        limitations: >-
          Mouse and human lipoprotein physiology differ substantially - mice
          carry most plasma cholesterol as HDL and lack cholesteryl ester
          transfer protein - so a plasma cholesterol endpoint is among the least
          transferable readouts this model could offer. The hepatic cholesteryl
          ester measurement is the informative one; the plasma value should not
          be read as evidence against the human phenotype.
        evidence:
          - reference: PMID:12819193
            reference_title: >-
              Targeted deletion of the ileal bile acid transporter eliminates
              enterohepatic cycling of bile acids in mice.
            supports: REFUTE
            evidence_source: MODEL_ORGANISM
            snippet: >-
              Liver cholesteryl ester content was reduced by 50% in Slc10a2-/-
              mice, and unexpectedly plasma high density lipoprotein cholesterol
              levels were slightly elevated.
            explanation: >-
              Reports both the expected hepatic cholesterol depletion and the
              plasma result that runs opposite to the human phenotype. Graded
              REFUTE with respect to the model's fidelity for this node.
discussions:
  - discussion_id: slc10a2_mouse_human_malabsorption_mismatch
    kind: HUMAN_MODEL_MISMATCH
    prompt: >-
      Why does the Slc10a2-null mouse reproduce the bile acid transport defect
      almost completely while failing to reproduce the steatorrhoea and reduced
      plasma cholesterol that define the human disease?
    attaches_to:
      - pathophysiology#Steatorrhoea and Fat Malabsorption
      - pathophysiology#Reduced Plasma Cholesterol
    rationale: >-
      This is a mismatch of the kind worth recording structurally rather than as
      prose, because it changes what the model can be used to argue. The mouse
      loses 10- to 20-fold more bile acid in faeces and holds an 80% smaller
      pool, so the proximal lesion is faithfully reproduced; yet on a low fat
      diet it has no steatorrhoea, and its plasma HDL cholesterol is slightly
      elevated where humans have reduced plasma cholesterol. Two candidate
      explanations are visible in the data - the low fat diet never stresses the
      residual pool, and the pool's selective cholic acid enrichment preserves
      micelle formation - and a third, that mouse lipoprotein physiology makes
      plasma cholesterol a poor cross-species readout in the first place. None
      has been tested directly. Until one is, the model supports the transport
      and pool nodes and must not be cited for the malabsorptive nodes.
    proposed_experiments:
      - experiment_id: slc10a2_null_high_fat_challenge
        name: High-fat dietary challenge of Slc10a2-null mice
        description: >-
          Feed Slc10a2-null and wild-type mice a high fat diet and measure
          faecal fat, faecal neutral sterol excretion and intestinal
          cholesterol absorption. If steatorrhoea appears only under fat
          loading, the discrepancy is a matter of dietary stress on a reduced
          but qualitatively adequate pool rather than a species difference in
          the mechanism.
        would_support:
          - pathophysiology#Steatorrhoea and Fat Malabsorption
        supporting_outcome:
          - >-
            Null mice develop measurable steatorrhoea and a substantially
            larger fall in intestinal cholesterol absorption on the high fat
            diet than on the low fat diet.
        refuting_outcome:
          - >-
            Null mice remain free of steatorrhoea under fat loading, which
            would point to a genuine species difference in how a contracted,
            cholic-acid-enriched pool supports lipid absorption rather than to
            a dietary artefact.
    evidence:
      - reference: PMID:12819193
        reference_title: >-
          Targeted deletion of the ileal bile acid transporter eliminates
          enterohepatic cycling of bile acids in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          On a low fat diet, the Slc10a2-/- mice did not have steatorrhea.
        explanation: >-
          The negative result at the heart of the mismatch, together with the
          dietary condition under which it was obtained.
      - reference: PMID:9109432
        reference_title: >-
          Primary bile acid malabsorption caused by mutations in the ileal
          sodium-dependent bile acid transporter gene (SLC10A2).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          congenital diarrhea, steatorrhea, interruption of the enterohepatic
          circulation of bile acids, and reduced plasma cholesterol levels
        explanation: >-
          The human phenotype the model fails to reproduce, establishing the
          other half of the mismatch.
treatments:
  - name: Lifelong Fat-Soluble Vitamin Supplementation
    description: >-
      Continuous replacement of vitamins A, D, E and K. In the one genotyped
      patient with a documented long-term course this was the therapy that
      worked and the one she stayed on: her levels dropped markedly whenever she
      was non-compliant or the dose was reduced. Modelled first among the
      treatments because, for the vitamin-deficiency presentation, it is not
      adjunctive - it is the treatment.
    therapeutic_modality: OTHER
    treatment_term:
      preferred_term: nutritional support
      term:
        id: NCIT:C15433
        label: Nutritional Support
    target_mechanisms:
      - target: Fat-Soluble Vitamin Malabsorption
        description: >-
          Bypasses the malabsorption by supplying the vitamins directly. It does
          not correct the transport defect, which is why replacement has to be
          lifelong.
    evidence:
      - reference: PMID:40814585
        reference_title: >-
          Homozygosity for a variant in SLC10A2 and infancy onset severe
          fat-soluble vitamin deficiency due to bile acid malabsorption.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          However, she needed continuous subsidy with ADEK, and the levels
          dropped markedly when she was noncompliant, or during doctor-induced
          attempts to lower vitamin-doses.
        explanation: >-
          Demonstrates both efficacy and dependence: the deficiency returns when
          replacement stops, which is what makes this lifelong rather than
          corrective.
  - name: Bile Acid Sequestrant Therapy
    description: >-
      Cholestyramine and colesevelam are the standard therapy for bile acid
      diarrhoea, and the trial evidence for them - including placebo-controlled
      data for colesevelam - comes from the common acquired condition, not from
      SLC10A2 deficiency. That distinction is not academic here. In the one
      genotyped patient in whom a sequestrant was tried, it was discontinued for
      side effects and had no significant effect on intestinal vitamin uptake.
      A sequestrant binds luminal bile acids, which addresses the colonic
      spillover arm and does nothing for the contracted-pool arm - so its
      failure in a vitamin-deficiency presentation is mechanistically expected
      rather than anomalous.
    therapeutic_modality: OTHER
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    target_mechanisms:
      - target: Colonic Bile Acid Spillover and Secretory Diarrhoea
        description: >-
          Binds the bile acids delivered to the colon. Deliberately not linked
          to the vitamin or pool nodes, since it does not act on them.
    evidence:
      - reference: PMID:40814585
        reference_title: >-
          Homozygosity for a variant in SLC10A2 and infancy onset severe
          fat-soluble vitamin deficiency due to bile acid malabsorption.
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Treatment with a bile acid sequestrant was attempted but discontinued
          due to side effects and no significant effect on intestinal vitamin
          uptake.
        explanation: >-
          Graded REFUTE with respect to the specific proposition that a
          sequestrant helps the vitamin-malabsorption arm of SLC10A2 deficiency.
          It is not evidence against sequestrants for bile acid diarrhoea
          generally, which is a different claim and a different population.
  - name: Low-Fat Diet
    description: >-
      Reducing dietary fat reduces the substrate for steatorrhoea. Listed
      because it is standard management of fat malabsorption; no SLC10A2-specific
      evidence was found, and none is claimed.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: dietary intervention
      term:
        id: NCIT:C15447
        label: Dietary Intervention
    notes: >-
      No evidence item is attached because no cached source supports a low-fat
      diet in SLC10A2 deficiency specifically. Recorded as an uncited management
      option rather than given a citation from the acquired-condition literature
      that would imply evidence this entry does not have.
diagnosis:
  - name: Bile Acid Retention Testing
    description: >-
      A bile retention scan quantifies the malabsorption directly. In the 2025
      case only 1.6% of labelled bile acid was retained at seven days, which is
      what converted an eighteen-year-old diagnostic mystery into a specific
      answer.
    evidence:
      - reference: PMID:40814585
        reference_title: >-
          Homozygosity for a variant in SLC10A2 and infancy onset severe
          fat-soluble vitamin deficiency due to bile acid malabsorption.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A bile retention scan showed severe bile acid malabsorption, with only
          1.6% of radioactively labeled bile acids retained 7 days after intake.
        explanation: >-
          The test and a quantified abnormal result.
  - name: Exome or Targeted SLC10A2 Sequencing
    description: >-
      The definitive test. Both recent genotyped cases were solved by sequencing
      after prolonged and unsuccessful conventional workup, which is the
      practical argument for testing early rather than last.
    evidence:
      - reference: PMID:40814585
        reference_title: >-
          Homozygosity for a variant in SLC10A2 and infancy onset severe
          fat-soluble vitamin deficiency due to bile acid malabsorption.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This case highlights the importance of early genetic testing in
          patients with unexplained fat-soluble vitamin deficiency.
        explanation: >-
          The authors' own diagnostic recommendation, arising from an
          eighteen-year delay.
      - reference: PMID:34192422
        reference_title: "SLC10A2 deficiency-induced congenital chronic bile acid diarrhea and stunting."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Moreover, they highlight the value of molecular genetic screening for
          diagnosing BAD in young patients.
        explanation: >-
          The same recommendation from the independent paediatric case.

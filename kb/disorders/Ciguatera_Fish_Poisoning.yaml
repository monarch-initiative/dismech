- name: Cold Sensitisation of Nav1.8/TRPA1-Positive Afferents
  biological_scale: CELLULAR
  description: >-
    Ciguatoxin confers cold sensitivity on a subpopulation of normally
    cold-insensitive afferents that co-express Nav1.8 and TRPA1, so innocuous
    cooling drives a nociceptive response. In spinal recordings, cold
    hypersensitivity is abolished by a Nav1.8 antagonist, only partially
    prevented by a TRPA1 antagonist, and unaffected by a TRPM8 antagonist -
    which places the lesion on the Nav1.8/TRPA1 population rather than on the
    canonical cold receptor.
  biological_processes:
  - preferred_term: detection of temperature stimulus involved in sensory perception of pain
    modifier: ABNORMAL
    term:
      id: GO:0050965
      label: detection of temperature stimulus involved in sensory perception of pain
  cell_types:
  - preferred_term: Nav1.8/TRPA1-positive primary afferent neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Cold allodynia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26454262
      reference_title: "Ionic mechanisms of spinal neuronal cold hypersensitivity in ciguatera."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ciguatoxins may confer cold sensitivity to a subpopulation of cold-insensitive Nav 1.8/TRPA1-positive primary afferents, which could underlie the cold allodynia reported in ciguatera."
      explanation: The authors' explicit mapping of this cellular mechanism onto the human sign.
  evidence:
  - reference: PMID:26454262
    reference_title: "Ionic mechanisms of spinal neuronal cold hypersensitivity in ciguatera."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Subcutaneous injection of 10 nm ciguatoxin-2 into the receptive field increased neuronal responses to innocuous and noxious cooling."
    explanation: The primary measurement - cooling responses increase after local ciguatoxin.
  - reference: PMID:26454262

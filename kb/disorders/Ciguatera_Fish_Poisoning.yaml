      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "This reflects the stimulation of efferent cholinergic sympathetic skin nerves"
      explanation: Names the efferent limb of that reflex, which is the mechanism this edge asserts.
  - target: Pruritus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      CGRP-dependent neurogenic signalling is the proposed route to the itch

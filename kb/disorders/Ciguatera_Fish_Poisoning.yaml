    reference_title: "Screening for Predictors of Chronic Ciguatera Poisoning: An Exploratory Analysis among Hospitalized Cases from French Polynesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These manifestations can be expressed continuously or through transient reactivation peaks, triggered by multiple factors (e.g., consumption of marine/fresh water-related products, even from non-endemic region, alcohol, nuts, and red meat."
    explanation: Names the triggers this avoidance advice is built on.
animal_models:
- name: Cook Islands naturally occurring canine and feline ciguatera
  species: Dog
  category: Natural disease
  publication: PMID:32158145
  description: >-
    Not an engineered model. Dogs and cats in Rarotonga eat reef fish and fish
    scraps and develop ciguatera in numbers large enough to study: 246 cases in
    six years of records from the only veterinary clinic in the territory,
    165 dogs and 81 cats. The presentation is motor-dominant - ataxia, paresis
    and recumbency - rather than the sensory-dominant syndrome seen in people,
    which is the main reason this is recorded as partially recapitulating rather
    than recapitulating.
  modeled_mechanisms:
  - target: Ingestion and Systemic Distribution of Ciguatoxin
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The same exposure route and the same toxin, in a naturally exposed
      non-human population with veterinary follow-up that human series rarely
      match.
    limitations: >-
      The clinical picture diverges from the human one: motor signs dominate and
      the sensory disturbances that define human ciguatera cannot be elicited
      from an animal at all, so the syndrome is not comparable symptom by
      symptom. Dose is unmeasured and probably higher than a human meal, because
      these animals scavenge viscera and whole carcasses where the toxin
      concentrates. No toxin assay confirmed exposure in individual cases; the
      case definition is clinical.
    evidence:
    - reference: PMID:32158145
      reference_title: "A descriptive study of ciguatera fish poisoning in Cook Islands dogs and cats: Demographic, temporal, and spatial distribution of cases."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A total of 246 cases of CFP were identified, comprising 165 dogs and 81 cats."
      explanation: Establishes the scale of the naturally exposed population this model rests on.
    - reference: PMID:32848300
      reference_title: "A descriptive study of ciguatera fish poisoning in Cook Islands dogs and cats: Treatment and outcome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Prolonged periods of anorexia and recumbency were common in both species."
      explanation: Documents the recumbency named in the limitations above.
    - reference: PMID:32255982
      reference_title: "A descriptive study of ciguatera fish poisoning in Cook Islands dogs and cats: Exposure history, clinical signs, and formulation of a case definition."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The toxicosis was characterized by motor dysfunction with a high frequency of ataxia and paresis/paralysis/recumbency."
      explanation: >-
        States the motor dominance directly, which is the divergence from the
        sensory-dominant human syndrome that limits this model.
  evidence:
  - reference: PMID:32848300
    reference_title: "A descriptive study of ciguatera fish poisoning in Cook Islands dogs and cats: Treatment and outcome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The survival rate was >90% and almost all mortalities occurred in the first week of hospitalization."
    explanation: >-
      Outcome data from the same population, which parallels the low human case
      fatality and supports treating the animal disease as informative.
  - reference: PMID:32848300
    reference_title: "A descriptive study of ciguatera fish poisoning in Cook Islands dogs and cats: Treatment and outcome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The treatments most commonly administered to cases were fluid therapy and muscle relaxants."
    explanation: Records that management was supportive here too, as in humans.
  notes: >-
    Recorded under a single `species: Dog` entry although the source series
    covers dogs and cats together; the slot takes one value and dogs are the
    larger group. The feline cases are described in the same papers and the
    quoted findings are reported for both species.
- name: Rat spinal dorsal horn ciguatoxin cold hypersensitivity model
  species: Rat
  category: Induced
  publication: PMID:26454262
  description: >-
    Subcutaneous Pacific ciguatoxin-2 into the receptive field of a dorsal horn
    wide-dynamic-range neuron, with in vivo electrophysiological recording of
    responses to cooling. This is the model that assigned ciguatera cold
    allodynia to Nav1.8 and TRPA1 rather than to the canonical cold receptor
    TRPM8.
  modeled_mechanisms:
  - target: Cold Sensitisation of Nav1.8/TRPA1-Positive Afferents
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Local ciguatoxin reproduces the cold hypersensitivity, and the channel
      dependence is established by selective antagonists.
    limitations: >-
      The readout is a spinal neuronal firing rate in a non-sentient
      preparation, not a reported sensation, so the mapping onto human cold
      allodynia is an inference the authors make explicitly rather than a
      measurement. The toxin is injected locally at a known concentration rather
      than ingested and distributed, so absorption, congener mixture and dose
      are all bypassed.
    readouts:
    - name: Dorsal horn neuronal response to innocuous and noxious cooling
      target: Cold Sensitisation of Nav1.8/TRPA1-Positive Afferents
      direction: INCREASED
      interpretation: >-
        Increased firing to cooling after local ciguatoxin is the electrophysiological
        correlate of cold allodynia.
      evidence:
      - reference: PMID:26454262
        reference_title: "Ionic mechanisms of spinal neuronal cold hypersensitivity in ciguatera."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Subcutaneous injection of 10 nm ciguatoxin-2 into the receptive field increased neuronal responses to innocuous and noxious cooling."
        explanation: Reports the measurement and its direction.
    evidence:
    - reference: PMID:26454262
      reference_title: "Ionic mechanisms of spinal neuronal cold hypersensitivity in ciguatera."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ciguatoxins may confer cold sensitivity to a subpopulation of cold-insensitive Nav 1.8/TRPA1-positive primary afferents, which could underlie the cold allodynia reported in ciguatera."
      explanation: The authors' own statement that this model informs the human sign.
  evidence:
  - reference: PMID:26454262
    reference_title: "Ionic mechanisms of spinal neuronal cold hypersensitivity in ciguatera."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study examined, for the first time, the neural substrates and molecular components of Pacific ciguatoxin-2-induced cold hypersensitivity."
    explanation: >-
      States what the preparation was built to measure, which is what makes it a
      model of this entry's cold-sensitisation node.
  - reference: PMID:26454262
    reference_title: "Ionic mechanisms of spinal neuronal cold hypersensitivity in ciguatera."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Electrophysiological recordings of dorsal horn lamina V/VI wide dynamic range neurones were made in non-sentient rats."
    explanation: Records the preparation and readout this model entry describes.
discussions:
- discussion_id: cfp-host-nav-susceptibility
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does variation in human voltage-gated sodium channel genes modify
    susceptibility to, or the symptom profile of, ciguatera fish poisoning?
  attaches_to:
  - pathophysiology#Voltage-Gated Sodium Channel Site 5 Activation
  rationale: >-
    Ciguatoxin acts directly on Nav1.1 to Nav1.9, and the isoform carrying a
    given symptom has been separated pharmacologically in rodents, so
    allelic variation at SCN1A, SCN9A, SCN10A or SCN11A is a biologically
    obvious candidate modifier of who becomes symptomatic and how. No human
    genetic association study exists. This entry deliberately has no `genetic:`
    section rather than one inferred from channel pharmacology, and that absence
    is the gap being recorded.
  evidence:
  - reference: PMID:28225079
    reference_title: "Multiple sodium channel isoforms mediate the pathological effects of Pacific ciguatoxin-1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "P-CTX-1-induced visceral and cutaneous pain behaviours were significantly decreased after pharmacological inhibition of NaV1.8 and the tetrodotoxin-sensitive isoforms NaV1.7 and NaV1.6, respectively."
    explanation: >-
      Establishes that different isoforms carry different symptoms, which is
      what makes host allelic variation a plausible modifier worth testing.
- discussion_id: cfp-chronic-phase-no-model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Every experimental model of ciguatera reproduces the acute channel lesion
    over minutes to hours. None reproduces the chronic relapsing syndrome that
    affects at least a fifth of patients for months to years. Does chronicity
    reflect persisting channel dysregulation, a sensitised nociceptive circuit,
    or something the acute models cannot express?
  attaches_to:
  - progression#Chronic ciguatera
  - pathophysiology#Repetitive Firing of Peripheral Sensory Afferents
  rationale: >-
    The mismatch matters because it is the chronic phase, not the acute one,
    that carries most of the disability, and every mechanistic claim about it in
    the literature is inference from acute pharmacology. The rat cold
    hypersensitivity model and the mouse CGRP release preparations recorded in
    this entry both measure an effect within hours of toxin application; neither
    has been run over the time course on which human symptoms relapse, and the
    reported triggers of relapse - alcohol, nuts, a further fish meal - have no
    counterpart in any model. Reactivation months after the toxin has cleared is
    not obviously a channel-occupancy phenomenon at all, which is what makes this
    a translational gap rather than a missing experiment.
  evidence:
  - reference: PMID:34564650
    reference_title: "Screening for Predictors of Chronic Ciguatera Poisoning: An Exploratory Analysis among Hospitalized Cases from French Polynesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Even though chronic CP cases are regularly reported, studies dedicated to the understanding of this phenomenon are scarce, especially due to the lack of a clear consensus regarding its clinical definition."
    explanation: States that the chronic phase is under-studied, which is the human side of the mismatch.
  - reference: PMID:34564650
    reference_title: "Screening for Predictors of Chronic Ciguatera Poisoning: An Exploratory Analysis among Hospitalized Cases from French Polynesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering that at least 20% of the persons affected by CP are likely to develop a persistent form"

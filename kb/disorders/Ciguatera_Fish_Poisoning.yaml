- name: Cardiac Conduction and Vasomotor Disturbance
  biological_scale: TISSUE
  description: >-
    How ciguatoxin slows the heart is contested, and both positions are recorded
    below. The clinical literature argues an indirect route: stimulation of
    unmyelinated vagal cardiac afferents inhibiting central vasomotor centres, so
    sympathetic output and peripheral resistance fall. Mouse histology argues a
    direct one: cardiac myocytes swell in a pattern read as myocardial sodium
    channel activation rather than as an action on cardiac autonomic nerves.
    Either route, combined with hypovolaemia from gastrointestinal losses,
    produces bradycardia, hypotension and conduction disorders. These are the
    least frequent features but the ones that make the illness life-threatening.
    They do respond to atropine, fluids and dopamine, but reversal can require
    unusually large or prolonged atropine dosing - 45 mg and 30 mg over 48 hours
    in the two published cases cited here.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  notes: >-
    `cell_types` binds the cardiac muscle cell for the direct-myocyte position
    only, which is the mouse-histology side of the controversy this node
    records. The competing clinical account places the lesion on cardiac
    autonomic nerves rather than on the myocyte, and CL has no term for the
    unmyelinated vagal cardiac afferent that account names, so only one side of
    the dispute is bindable here.
  biological_processes:
  - preferred_term: membrane depolarization
    modifier: INCREASED
    term:
      id: GO:0051899
      label: membrane depolarization
  downstream:
  - target: Bradycardia
    causal_link_type: DIRECT
  - target: Hypotension
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22574244
    reference_title: "Cardiovascular Complications in Ciguatera Fish Poisoning: A Wake-up Call."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two patients with persistent bradycardia and hypotension after eating mackerel fish."
    explanation: Direct clinical observation of the cardiovascular phenotype this node produces.
  - reference: PMID:25333356
    reference_title: "Epidemiology and clinical features of ciguatera fish poisoning in Hong Kong."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bradycardia and hypotension, which can be life-threatening, are common."
    explanation: Supports the severity claim in this description from a territory-wide case series.
  - reference: PMID:22574244
    reference_title: "Cardiovascular Complications in Ciguatera Fish Poisoning: A Wake-up Call."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ciguatoxin stimulates the unmyelinated afferent cardiac branches of the vagus nerve which leads to a tonic inhibition of central vasomotor centers with reduced sympathetic output and peripheral vascular resistance, causing bradycardia, continued hypotension, and peripheral vasodilatation."
    explanation: Spells out the vagal-afferent and central-vasomotor route this node records.
  - reference: PMID:22574244
    reference_title: "Cardiovascular Complications in Ciguatera Fish Poisoning: A Wake-up Call."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ciguatoxin action on the human heart thus appears to be related primarily to indirect effects on intrinsic nerves, rather than a direct effect on myocardial cells."
    explanation: >-
      The indirect position as the authors' conclusion, and an explicit argument
      against the myocyte being the substrate.
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "A swelling of cardiac myocytes was also present, likely resulting from a direct effect (activation of the myocardial Nav channels) instead of an indirect action through activation of Nav in cardiac autonomic nerves."
    explanation: >-
      The competing direct-myocyte position. Recorded as REFUTE against the
      indirect account quoted immediately above, because the two make opposite
      claims about where the lesion sits and neither is settled.
  - reference: PMID:22574244
    reference_title: "Cardiovascular Complications in Ciguatera Fish Poisoning: A Wake-up Call."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Large doses of atropine and dopamine are needed to revert the symptoms."
    explanation: >-
      Source of the atropine-dosing claim in this description. The bradycardia is
      reversible, but in the two reported cases reversal took 45 mg and 30 mg of
      atropine over 48 hours.

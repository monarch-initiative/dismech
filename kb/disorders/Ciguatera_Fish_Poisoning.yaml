progression:
- phase: Acute gastrointestinal phase
  duration: 1-2 days
  duration_days: "2"
  incubation_days: "1"
  notes: >-
    Onset is a few minutes to 24 hours after the meal, and falls between one and
    six hours in 90% of cases. `incubation_days: 1` is the coarse
    day-granularity encoding of that sub-day latency; the verbatim range is in
    the evidence below.
  evidence:
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The first symptoms appear a few minutes to 24 h after the toxic fish meal, but occur between 1 and 6 h in 90% of cases"
    explanation: Establishes the latency of this phase.
  - reference: PMID:26454262
    reference_title: "Ionic mechanisms of spinal neuronal cold hypersensitivity in ciguatera."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The gastrointestinal effects are typically transient (1–5 days), whereas neurological symptoms can persist for weeks to many months"
    explanation: Establishes that this phase is transient and separates it from the neurological one.
- phase: Acute neurological and cardiovascular phase
  duration: days to weeks
  notes: >-
    Overlaps with or shortly follows the gastrointestinal phase. Sensory
    disturbance dominates; cardiovascular signs when present appear in the first
    day.
  evidence:
  - reference: PMID:25333356
    reference_title: "Epidemiology and clinical features of ciguatera fish poisoning in Hong Kong."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In affected subjects, the gastrointestinal symptoms often subside within days, whereas the neurological symptoms can persist for weeks or even months."
    explanation: Contrasts the duration of this phase with the preceding one.
- phase: Chronic ciguatera
  duration: 3 months or longer
  notes: >-
    Defined in the literature as symptoms lasting three months or more, affecting
    at least a fifth of patients. Manifestations are mainly neurological and
    psychiatric - tenacious fatigue, paresthesia, dysesthesia, pruritus, anxiety
    and depression - and may be continuous or appear as reactivation peaks
    triggered by marine or fresh-water foods, alcohol, nuts or red meat.
  evidence:
  - reference: PMID:34564650
    reference_title: "Screening for Predictors of Chronic Ciguatera Poisoning: An Exploratory Analysis among Hospitalized Cases from French Polynesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic forms of CP with symptoms lasting ≥3 months are a real clinical challenge."
    explanation: Establishes the three-month definition this phase uses.
  - reference: PMID:34564650
    reference_title: "Screening for Predictors of Chronic Ciguatera Poisoning: An Exploratory Analysis among Hospitalized Cases from French Polynesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering that at least 20% of the persons affected by CP are likely to develop a persistent form"
    explanation: Quantifies how many patients reach this phase.
  - reference: PMID:34564650
    reference_title: "Screening for Predictors of Chronic Ciguatera Poisoning: An Exploratory Analysis among Hospitalized Cases from French Polynesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "five significant predictors of having symptoms lasting ≥3 months were identified: age, tobacco consumption, acute bradycardia, laboratory measures of urea, and neutrophils."
    explanation: >-
      Names the candidate predictors of reaching this phase. The study is
      explicitly exploratory and hypothesis-generating, so these are candidates
      rather than established risk factors.

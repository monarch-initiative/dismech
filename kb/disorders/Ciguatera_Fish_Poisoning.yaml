clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Case fatality is very low and most acute illness resolves within days to
    weeks, but the neurological phase routinely outlasts the gastrointestinal
    one by months, a substantial minority develop a chronic relapsing syndrome,
    and the burden falls on reef-dependent island communities with limited
    diagnostic and therapeutic options.
  evidence:
  - reference: PMID:19005579
    reference_title: "Ciguatera fish poisoning: treatment, prevention and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ciguatera Fish Poisoning (CFP) is the most frequently reported seafood-toxin illness in the world, and it causes substantial physical and functional impact."
    explanation: States both the global frequency and the functional impact behind this burden level.
  - reference: PMID:34564650
    reference_title: "Screening for Predictors of Chronic Ciguatera Poisoning: An Exploratory Analysis among Hospitalized Cases from French Polynesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering that at least 20% of the persons affected by CP are likely to develop a persistent form"
    explanation: Quantifies the chronic tail that keeps this above a purely self-limited illness.
pathophysiology:
- name: Gambierdiscus Ciguatoxin Production on Reef Substrate
  biological_scale: ORGANISM
  description: >-
    The environmental origin of the toxin. Benthic dinoflagellates of the genera
    Gambierdiscus and Fukuyoa live epiphytically on macroalgae, dead coral and
    reef detritus in tropical and subtropical waters, where they synthesise the
    ciguatoxin precursors known as gambiertoxins. Toxin production is
    species-specific rather than a property of the genus as a whole, which is
    why Gambierdiscus abundance alone is a poor predictor of local risk.
  notes: >-
    Deliberately carries no ontology-bound process descriptor. The node denotes
    a process occurring in a free-living marine microalga, not in the human
    host, and the GO terms available describe host-side biology.
  downstream:
  - target: Trophic Biotransformation and Biomagnification in Reef Fish
    causal_link_type: DIRECT
    description: >-
      Algal gambiertoxins enter the reef food web when herbivorous fish graze
      the substrate the dinoflagellates colonise.
    evidence:
    - reference: PMID:28225079
      reference_title: "Multiple sodium channel isoforms mediate the pathological effects of Pacific ciguatoxin-1."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Consumption of coral and seaweed contaminated with Gambierdiscus by herbivorous fish leads to bioaccumulation of the ciguatoxins through the food chain via larger carnivorous fish that in turn are consumed by humans and cause ciguatera."
      explanation: States the grazing step that carries algal toxin into the food chain, which is this edge.
  evidence:
  - reference: PMID:41610130
    reference_title: "Risk of ciguatoxins is shaped by Gambierdiscus community structure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ciguatoxins (CTXs) are produced by marine microbial eukaryotes (Gambierdiscus/Fukuyoa, Dinophyta: Alveolata) that live epiphytically on macroalgae and other substrates."
    explanation: Establishes the producing organisms and the substrate they occupy.
  - reference: PMID:41610130
    reference_title: "Risk of ciguatoxins is shaped by Gambierdiscus community structure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Of newly isolated Gambierdiscus strains, only the three G. polynesiensis produced P-CTXs."
    explanation: >-
      Supports the species-specificity point in this description - most isolates
      from an endemic site made no Pacific ciguatoxin at all.
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "These toxins originate from benthic microalgae of the genus Gambierdiscus and Fukuyoa"
    explanation: Independent statement of the algal origin of the toxins.
- name: Trophic Biotransformation and Biomagnification in Reef Fish
  biological_scale: ORGANISM
  description: >-
    Gambiertoxins taken up by herbivorous fish are oxidised by fish hepatic
    cytochrome P450 enzymes into more polar and substantially more potent
    ciguatoxin congeners, and accumulate as those fish are eaten by carnivorous
    predators. The end products differ by ocean basin - P-CTX-1 in the Pacific,
    C-CTX-1/2 in the Caribbean, I-CTX in the Indian Ocean - and the Pacific end
    product is the most toxic congener known for mammals.
  chemical_entities:
  - preferred_term: ciguatoxin
    term:
      id: CHEBI:61275
      label: ciguatoxin
  downstream:
  - target: Ingestion and Systemic Distribution of Ciguatoxin
    causal_link_type: DIRECT
    description: >-
      The concentrated toxin burden in predatory reef fish flesh is what a human
      meal delivers.
    evidence:
    - reference: PMID:28535116
      reference_title: "Is mannitol the treatment of choice for patients with ciguatera fish poisoning?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Ciguatoxins, a class of tasteless, heat-stable, polycyclic toxins produced by dinoflagellates, accumulate through the food chain and concentrate in various carnivorous fish, such as groupers, barracudas, wrasses, amberjack, kingfishes, and eels."
      explanation: >-
        Connects food-chain accumulation to the carnivorous fish that people
        actually eat, which is the step this edge asserts.
  evidence:
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "During this transfer, GTXs are not only accumulated within the marine food chain but also biotransformed to become more polar and more toxic CTXs"
    explanation: States both halves of this node - accumulation and toxifying biotransformation.
  - reference: PMID:37044143
    reference_title: "Algal ciguatoxin identified as source of ciguatera poisoning in the Caribbean."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Metabolism in vitro by fish liver microsomes converted algal C-CTX5 into C-CTX1/2, the dominant CTX in ciguatoxic fish from the Caribbean."
    explanation: >-
      Direct demonstration that fish hepatic metabolism performs the
      algal-precursor to fish-congener conversion this node asserts.
  - reference: PMID:28867800
    reference_title: "Ciguatoxins Evoke Potent CGRP Release by Activation of Voltage-Gated Sodium Channel Subtypes Na(V)1.9, Na(V)1.7 and Na(V)1.1."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The precursors are oxidized to CTXs in the fish liver by cytochrome enzymes to become the most potent mammalian voltage-gated sodium channel (VGSC) toxins known."
    explanation: Names the enzymatic route and the resulting increase in mammalian potency.
- name: Ingestion and Systemic Distribution of Ciguatoxin
  biological_scale: ORGANISM
  description: >-
    The exposure event. A human meal of contaminated reef fish delivers
    ciguatoxin that cannot be detected by taste, smell or appearance and is not
    destroyed by cooking, salting or freezing. Because the toxins are lipophilic
    they are readily absorbed and slowly eliminated, and distribute to excitable
    tissue throughout the body.
  notes: >-
    Carries no ontology-bound process descriptor: the node denotes an exposure
    event rather than a host biological process. The exposure itself is grounded
    in the `environmental:` block.
  downstream:
  - target: Voltage-Gated Sodium Channel Site 5 Activation
    causal_link_type: DIRECT
    description: >-
      Absorbed ciguatoxin reaches voltage-gated sodium channels in peripheral
      nerve, enteric and autonomic neurons, and cardiac tissue.
  - target: Potassium Current Inhibition in Sensory Neurons
    causal_link_type: DIRECT
    description: >-
      The same absorbed toxin independently reaches potassium conductances in
      dorsal root ganglion neurons. This is a parallel branch of the exposure,
      not a consequence of the sodium lesion: ciguatoxin acting on one channel
      class does not cause its action on the other, and the two converge
      downstream at afferent firing rather than one feeding the other.
  evidence:
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ciguatera fish poisoning (CFP), the most prevalent seafood poisoning worldwide, is caused by the consumption of tropical and subtropical fish contaminated with potent neurotoxins called ciguatoxins (CTXs)."
    explanation: Establishes fish consumption as the causal exposure for the disease.
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "CTXs are thermo- and relatively acid- and basic-stable toxins that are unaffected by cooking, salting or congealing"
    explanation: Supports the claim that ordinary preparation does not remove the exposure.
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "lipid-soluble and therefore readily absorbed and slowly eliminated in fish and humans"
    explanation: Source of the absorption and elimination claim in this description.
- name: Voltage-Gated Sodium Channel Site 5 Activation
  biological_scale: MOLECULAR
  description: >-
    Ciguatoxins bind neurotoxin receptor site 5 on the alpha subunit of
    voltage-gated sodium channels - the same site targeted by the structurally
    related brevetoxins - and act as allosteric activators rather than blockers.
    Binding shifts the voltage dependence of activation to more hyperpolarised
    potentials and impairs inactivation, so a fraction of channels is open at or
    near the resting membrane potential. The effect is close to non-selective
    across Nav1.1 to Nav1.9, with the largest activation shifts at the
    tetrodotoxin-resistant isoforms Nav1.8 and Nav1.9.
  molecular_functions:
  - preferred_term: ciguatoxin-activated voltage-gated sodium channel activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
  chemical_entities:
  - preferred_term: ciguatoxin
    term:
      id: CHEBI:61275
      label: ciguatoxin
  notes: >-
    `modifier: GAIN_OF_FUNCTION` rather than `INCREASED` is deliberate, and
    follows the CLAUDE.md rule for a qualitative rather than quantitative claim:
    the channel is not simply more active, it is opening outside its normal
    voltage-dependent constraint. There is no host variant anywhere in this
    entry, so `functional_impact_category` has nothing to describe - the same
    situation the knowledge base records for virally driven pathway activation.
  downstream:
  - target: Sustained Sodium Influx and Membrane Depolarization
    causal_link_type: DIRECT
    description: >-
      Channels opening at resting potential admit sodium continuously rather
      than only during an action potential.
    evidence:
    - reference: PMID:26454262
      reference_title: "Ionic mechanisms of spinal neuronal cold hypersensitivity in ciguatera."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "likely leading to channel activation at resting membrane potentials, ongoing activity in primary sensory afferent fibres, axonal swelling and elevation of intracellular calcium"
      explanation: >-
        States the inference from the biophysical shift to resting-potential
        activation and ongoing afferent activity, which is this edge.
  evidence:
  - reference: PMID:28225079
    reference_title: "Multiple sodium channel isoforms mediate the pathological effects of Pacific ciguatoxin-1."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "This diverse symptomatology is believed to be caused by the interaction of the ciguatoxins with site 5 of the voltage-gated sodium channels (NaV)"
    explanation: >-
      Names site 5 as the molecular target. Graded OTHER because the quoted
      sentence reports a mechanistic belief about a binding site and describes no
      study of its own; the direct patch-clamp measurement below is the real
      support for this node.
  - reference: PMID:28225079
    reference_title: "Multiple sodium channel isoforms mediate the pathological effects of Pacific ciguatoxin-1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "P-CTX-1 significantly shifted the V1/2 for the voltage-dependence of activation to more hyperpolarising potentials at all NaV subtypes"
    explanation: >-
      Direct patch-clamp measurement of the activation shift, across every human
      Nav isoform tested.
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Alterations of TTX-s Nav properties comprise a shift of the activation threshold voltage to more negative values associated with an impairment of their inactivation process"
    explanation: States the second half of the biophysical claim, impaired inactivation.
  - reference: PMID:37044143
    reference_title: "Algal ciguatoxin identified as source of ciguatera poisoning in the Caribbean."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, C-CTX5 from G. silvae was confirmed to have voltage-gated sodium-channel-specific activity."
    explanation: >-
      Confirms the same molecular target for the Caribbean congener lineage, not
      only the Pacific one.
- name: Potassium Current Inhibition in Sensory Neurons
  biological_scale: MOLECULAR
  description: >-
    Ciguatoxins also inhibit delayed-rectifier and A-type potassium currents in
    dorsal root ganglion neurons. Because these currents normally repolarise the
    membrane and damp repetitive discharge, their loss amplifies the
    excitability produced by the sodium-channel effect rather than acting
    independently of it.
  molecular_functions:
  - preferred_term: delayed rectifier potassium channel activity
    modifier: DECREASED
    term:
      id: GO:0005251
      label: delayed rectifier potassium channel activity
  - preferred_term: A-type potassium channel activity
    modifier: DECREASED
    term:
      id: GO:0005250
      label: A-type (transient outward) potassium channel activity
  cell_types:
  - preferred_term: dorsal root ganglion sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Repetitive Firing of Peripheral Sensory Afferents
    causal_link_type: DIRECT
    description: >-
      Loss of the repolarising currents that would otherwise terminate a burst.
  evidence:
  - reference: PMID:26454262
    reference_title: "Ionic mechanisms of spinal neuronal cold hypersensitivity in ciguatera."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Ciguatoxins also inhibit delayed rectifier and A-type potassium currents in dorsal root ganglia neurones, resulting in further increases in neuronal excitability"
    explanation: States both the potassium-current effect and its amplifying role.
  - reference: PMID:28535116
    reference_title: "Is mannitol the treatment of choice for patients with ciguatera fish poisoning?"
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "In vitro experiments of isolated neurons demonstrate that ciguatoxins produce neuronal edema, open certain sodium channels, block potassium channels, cause uncontrolled and repetitive action potentials after a stimulus."
    explanation: >-
      Independent synthesis naming potassium-channel block alongside the sodium
      effect and the repetitive firing it produces.
- name: Sustained Sodium Influx and Membrane Depolarization
  biological_scale: CELLULAR
  description: >-
    Continuous sodium entry through toxin-modified channels depolarises
    excitable cells, raises intracellular calcium, and imposes an osmotic load
    that water follows. This is the single cellular lesion from which the
    neurological, gastrointestinal and cardiovascular branches of the syndrome
    all descend.
  biological_processes:
  - preferred_term: sodium ion transmembrane transport
    modifier: INCREASED
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
  - preferred_term: membrane depolarization
    modifier: INCREASED
    term:
      id: GO:0051899
      label: membrane depolarization
  downstream:
  - target: Repetitive Firing of Peripheral Sensory Afferents
    causal_link_type: DIRECT
    description: >-
      A depolarised afferent fires without a stimulus and keeps firing after one.
    evidence:
    - reference: PMID:28535116
      reference_title: "Is mannitol the treatment of choice for patients with ciguatera fish poisoning?"
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "In vitro experiments of isolated neurons demonstrate that ciguatoxins produce neuronal edema, open certain sodium channels, block potassium channels, cause uncontrolled and repetitive action potentials after a stimulus."
      explanation: >-
        States the progression from channel opening to uncontrolled repetitive
        firing in isolated neurons, which is this edge.
  - target: Cold Sensitisation of Nav1.8/TRPA1-Positive Afferents
    causal_link_type: DIRECT
    description: >-
      Depolarisation, not firing, is what shifts the voltage dependence of TRPA1
      activation so that cooling opens it. Cold sensitisation is therefore a
      sibling consequence of the same depolarisation as the repetitive firing,
      not a consequence of the firing itself.
    evidence:
    - reference: PMID:26454262
      reference_title: "Ionic mechanisms of spinal neuronal cold hypersensitivity in ciguatera."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "Thus, a cumulative effect on sodium and potassium currents would result in activation of TRPA1 upon cooling but not TRPM8."
      explanation: >-
        Derives TRPA1 cold activation from the combined ionic-conductance change,
        which is the depolarisation this node represents, and explains why TRPM8
        is spared.
  - target: Nodal and Adaxonal Schwann Cell Swelling
    causal_link_type: DIRECT
    description: >-
      Sodium entry with obligate water movement is the osmotic driver of the
      swelling.
    evidence:
    - reference: PMID:33066435
      reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "nodal swelling of myelinated nerve fibers was prevented by tetrodotoxin and completely prevented and reversed by pretreatment with or the addition of hyperosmolar external solutions of D-mannitol"
      explanation: >-
        Tetrodotoxin prevention shows the swelling requires sodium entry, and
        reversal by a hyperosmolar solution shows it is osmotic - together the
        two halves of this edge.
  - target: Enteric and Autonomic Neuron Hyperexcitability
    causal_link_type: DIRECT
  - target: Cardiac Conduction and Vasomotor Disturbance
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26454262
    reference_title: "Ionic mechanisms of spinal neuronal cold hypersensitivity in ciguatera."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "likely leading to channel activation at resting membrane potentials, ongoing activity in primary sensory afferent fibres, axonal swelling and elevation of intracellular calcium"
    explanation: Names the depolarisation, the calcium rise and the swelling that define this node.
- name: Repetitive Firing of Peripheral Sensory Afferents
  biological_scale: CELLULAR
  description: >-
    Depolarised primary afferents discharge spontaneously and repetitively, and
    respond excessively to stimuli that would normally be innocuous. Which
    isoform carries which symptom has been separated pharmacologically: Nav1.8
    block significantly decreases visceral pain behaviour while block of the
    tetrodotoxin-sensitive Nav1.7 and Nav1.6 significantly decreases cutaneous
    pain behaviour. Neither block abolishes it.
  biological_processes:
  - preferred_term: action potential
    modifier: INCREASED
    term:
      id: GO:0001508
      label: action potential
  cell_types:
  - preferred_term: peripheral sensory afferent neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Calcium-Dependent CGRP Release and Neurogenic Inflammation
    causal_link_type: DIRECT
  - target: Perioral and distal paresthesia
    causal_link_type: DIRECT
  - target: Hyperesthesia
    causal_link_type: DIRECT
  - target: Myalgia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Arthralgia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Joint pain travels with the myalgia in every series, but no source traces
      it to afferent hyperexcitability specifically, so the intermediates are
      recorded as unknown rather than guessed.
  - target: Muscle weakness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Motor complaints are common, and depolarisation to the point of
      inexcitability is the obvious candidate route, but no cited source
      demonstrates it in ciguatera.
  - target: Fatigue
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Asthenia acutely and tenacious fatigue chronically. The route from
      peripheral afferent hyperexcitability to fatigue is not established; the
      edge records that the phenotype belongs to this branch of the syndrome,
      not that the mechanism is known.
  - target: Headache
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Parageusia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:28225079
    reference_title: "Multiple sodium channel isoforms mediate the pathological effects of Pacific ciguatoxin-1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The contribution of these isoforms to excitability of peripheral C- and A-fibre sensory neurons, confirmed using murine skin and visceral single-fibre recordings, reflects the expression pattern of NaV isoforms in peripheral sensory neurons and their contribution to membrane depolarisation, action potential initiation and propagation."
    explanation: Single-fibre recordings establishing afferent hyperexcitability as the cellular lesion.
  - reference: PMID:28225079
    reference_title: "Multiple sodium channel isoforms mediate the pathological effects of Pacific ciguatoxin-1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "P-CTX-1-induced visceral and cutaneous pain behaviours were significantly decreased after pharmacological inhibition of NaV1.8 and the tetrodotoxin-sensitive isoforms NaV1.7 and NaV1.6, respectively."
    explanation: Supports the isoform-to-symptom mapping this description states.
- name: Nodal and Adaxonal Schwann Cell Swelling
  biological_scale: CELLULAR
  description: >-
    Sodium entry with obligate water movement swells the nodes of Ranvier of
    myelinated fibres and the adaxonal Schwann cell cytoplasm. This is the one
    structural lesion of ciguatera that has been seen in patients: sural nerve
    biopsies in severe cases show adaxonal Schwann cell oedema with axonal
    compression and vesicular myelin degeneration, and skin biopsy months after
    poisoning has shown diffuse axonal swellings with preserved intraepidermal
    fibre density.
  cell_types:
  - preferred_term: myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  downstream:
  - target: Perioral and distal paresthesia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

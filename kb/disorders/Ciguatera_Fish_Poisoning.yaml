    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both mechanical and cold hypersensitivity were completely prevented by co-injection with the Nav 1.8 antagonist A803467, whereas the transient receptor potential ankyrin 1 (TRPA1) antagonist A967079 only prevented hypersensitivity to innocuous cooling and partially prevented hypersensitivity to noxious cooling."
    explanation: The pharmacological dissection that assigns the effect to Nav1.8 and TRPA1.
- name: Enteric and Autonomic Neuron Hyperexcitability
  biological_scale: TISSUE
  description: >-
    Sodium channel activation in enteric and autonomic neurons produces the
    earliest and most consistent phase of the illness - nausea, vomiting,
    watery diarrhoea and abdominal cramping beginning within hours of the meal -
    together with autonomic signs such as profuse sweating and hypersalivation.
    This phase is self-limited over one to a few days while the neurological
    phase continues.
  cell_types:

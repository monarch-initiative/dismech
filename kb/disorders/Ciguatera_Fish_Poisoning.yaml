diagnosis:
- name: Clinical diagnosis from exposure history and syndrome
  description: >-
    There is no confirmatory bedside test. The diagnosis rests on a recent
    reef-fish meal plus the characteristic sequence - gastrointestinal upset
    followed by paresthesia, cold allodynia and pruritus - in a non-febrile
    patient, supported where possible by analytical testing of a remnant of the
    fish that was eaten.
  evidence:
  - reference: PMID:28335428
    reference_title: "An Updated Review of Ciguatera Fish Poisoning: Clinical, Epidemiological, Environmental, and Public Health Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of CFP is based on the recent fish-eating history of the patient(s), clinical presentation, and whenever possible, results from analytical testing of a remnant of the fish consumed by the person(s) suffering from CFP."
    explanation: States all three legs of the diagnosis this entry records.
  - reference: PMID:28335428
    reference_title: "An Updated Review of Ciguatera Fish Poisoning: Clinical, Epidemiological, Environmental, and Public Health Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients diagnosed with CFP without fish testing confirmation should be warned about the uncertainty of a purely clinical diagnosis and recommended for additional medical evaluation if symptoms recur or do not resolve."
    explanation: Records how uncertain a clinical-only diagnosis is held to be, which is why fish testing matters.
- name: Absence of a human biomarker of ciguatoxin exposure
  presence: absent
  description: >-
    The gap that shapes everything else about diagnosing this disease. Nothing
    measurable in the patient confirms exposure, so every assay below is applied
    to the fish rather than to the person, and the clinical diagnosis cannot be
    laboratory-confirmed in the patient at all.
  evidence:
  - reference: PMID:28335428
    reference_title: "An Updated Review of Ciguatera Fish Poisoning: Clinical, Epidemiological, Environmental, and Public Health Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "There are currently no identified biomarkers that can be used to confirm exposure to CTX in humans"
    explanation: States the absence directly.
  - reference: PMID:28335428
    reference_title: "An Updated Review of Ciguatera Fish Poisoning: Clinical, Epidemiological, Environmental, and Public Health Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The development of methods to confirm exposure to CTX in affected humans will assist not only in the diagnostic process, but also in the validity of clinical trials investigating treatments for individuals with a presumed CFP diagnosis."
    explanation: >-
      Names the downstream consequence that matters for this entry - it is also
      why the treatment evidence recorded here is as weak as it is.
- name: Ciguatoxin detection in the implicated fish
  description: >-
    The analytical work is done on fish tissue. The FDA protocol is a two-tier
    screen-then-confirm design: an N2a mouse neuroblastoma cell assay for
    activity consistent with the ciguatoxin mode of action, then LC-MS/MS for
    molecular confirmation. Receptor-binding assays and ELISA are the main
    alternatives, and the historical mouse bioassay is being displaced on
    welfare and specificity grounds.
  evidence:
  - reference: PMID:28335428
    reference_title: "An Updated Review of Ciguatera Fish Poisoning: Clinical, Epidemiological, Environmental, and Public Health Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "in vitro mouse neuroblastoma (N2a) cell assay as a semi-quantitative screen for toxicity consistent with CTX mode of action; and (2) liquid chromatography tandem-mass spectrometry (LC-MS/MS) for molecular confirmation of CTX."
    explanation: The two tiers of the regulatory protocol this diagnosis entry describes.
  - reference: PMID:28335428
    reference_title: "An Updated Review of Ciguatera Fish Poisoning: Clinical, Epidemiological, Environmental, and Public Health Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Alternative methods for CTX detection in fish include receptor binding assays"
    explanation: Names the alternative assay class recorded here.
  - reference: PMID:18623118
    reference_title: "Detection of ciguatoxin in fish tissue using sandwich ELISA and neuroblastoma cell bioassay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The applicability of a new enzyme-linked immunoassay (ELISA) for detecting ciguatoxin (CTX) in fish tissue was evaluated by testing three fish species commonly implicated in ciguatera fish poisoning in Hawaii."
    explanation: A worked example of the ELISA route, applied to fish tissue rather than to a patient.
differential_diagnoses:
- name: Other marine and fish-borne toxin syndromes
  description: >-
    Ciguatera shares symptoms with paralytic, neurotoxic and diarrhetic
    shellfish poisoning, scombrotoxin (histamine) fish poisoning, pufferfish
    tetrodotoxin poisoning and hallucinatory fish poisoning. All arrive through
    the same "I ate seafood and got sick" history, so the exposure story does not
    discriminate between them.
  distinguishing_features:
  - >-
    Cold allodynia - burning pain on innocuous cold contact - is the
    discriminating feature, and is described as pathognomonic for ciguatera.
  - >-
    The implicated species differs: ciguatera follows carnivorous reef fish
    (jacks, groupers, snappers, barracuda, moray eels, amberjack).
  notes: >-
    Deliberately short. The features that separate ciguatera from each named
    alternative individually - the histamine mechanism of scombroid, the
    ascending paralysis of tetrodotoxin - are standard clinical teaching but are
    not stated by any reference cited in this entry, so they are omitted rather
    than asserted without a source. Adding them means citing a source that makes
    each comparison.
  evidence:
  - reference: PMID:28335428
    reference_title: "An Updated Review of Ciguatera Fish Poisoning: Clinical, Epidemiological, Environmental, and Public Health Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "CFP induces some symptoms in common with paralytic shellfish poisoning (PSP), neurotoxic shellfish poisoning (NSP), scombrotoxin fish poisoning, pufferfish poisoning (also referred to as Fugu poisoning), and hallucinatory fish poisoning"
    explanation: Names the differential this entry records.
  - reference: PMID:28535116
    reference_title: "Is mannitol the treatment of choice for patients with ciguatera fish poisoning?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The classic dysaesthesia is cold allodynia, often described as reversal of hot and cold sensation, but a more accurate description is burning pain on exposure to cold."
    explanation: >-
      Supports cold allodynia as the discriminating feature. Its specificity
      against the other syndromes named here is not quantified in any source
      cited by this entry, so "near-pathognomonic" is the clinical consensus
      rather than a measured test characteristic.
histopathology:
- name: Adaxonal Schwann cell oedema with axonal compression on sural nerve biopsy
  description: >-
    The one structural lesion of ciguatera documented in human tissue. Sural
    nerve biopsy in severe cases shows striking oedema of the adaxonal layer of
    the Schwann cell cytoplasm, compressing the axon, with vesicular
    degeneration of the myelin.
  diagnostic: false
  evidence:
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "This was confirmed by a biopsy of the sural nerve, which revealed a striking edema in the adaxonal layer of the Schwann cell cytoplasm, with axonal compression and vesicular degeneration of the myelin."
    explanation: Describes the finding exactly as recorded here.
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In two severe cases, edema of myelin fibers, sometimes intra-axonal, or of the adaxonal Schwann cell cytoplasm, were revealed in biopsied sural nerves"
    explanation: >-
      Establishes how few cases this rests on - two - which is why it is recorded
      as a finding rather than as a diagnostic criterion.
  notes: >-
    No `finding_term` is bound. HPO's nearest terms describe peripheral
    myelination abnormality (`HP:0003130`) and onion bulb formation
    (`HP:0003383`), neither of which denotes adaxonal Schwann cell oedema, and
    binding a broader myelination term would assert a different lesion. The
    finding is carried as prose and as the `Nodal and Adaxonal Schwann Cell
    Swelling` pathophysiology node instead.
- name: Diffuse axonal swellings with preserved intraepidermal nerve fibre density on skin biopsy
  description: >-
    Skin biopsy of the distal leg two months after intoxication shows diffuse
    axonal swellings while the density of intraepidermal nerve fibres remains
    normal. The combination matters: it argues that the persisting sensory
    disturbance is a functional and structural change in surviving fibres rather
    than a small-fibre neuropathy with fibre loss.
  diagnostic: false
  evidence:
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A skin biopsy from the distal leg, carried out 2 months after intoxication, revealed that the density of the intraepidermal nerve fibers was normal, but diffuse axonal swellings were observed"
    explanation: >-
      States both halves of the finding - swelling present, fibre density
      preserved - which is the whole of the inference drawn here.
environmental:
- name: Consumption of ciguatoxin-contaminated carnivorous reef fish
  description: >-
    The sole route of exposure. Carnivorous reef predators - jacks and trevallies,
    snappers, groupers, barracuda, moray eels, amberjack and king mackerel -
    carry the highest toxin burden because the toxin biomagnifies up the reef
    food chain, and liver, roe and viscera concentrate it further. Contaminated
    fish are indistinguishable from safe ones by taste, smell or appearance, and
    the toxins survive cooking, salting and freezing, so no consumer-level
    precaution short of avoiding the species removes the risk.
  exposure_term:
    preferred_term: dietary exposure to ciguatoxin in contaminated reef fish
    term:
      id: ECTO:0000537
      label: exposure to toxin
  food_source:
    preferred_term: sea water fish food product
    term:
      id: FOODON:00001055
      label: sea water fish food product
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: ORAL
    exposure_duration:
    - classification_value: ACUTE
  influences_mechanisms:
  - target: Ingestion and Systemic Distribution of Ciguatoxin
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The meal is what delivers the toxin the whole entry follows from.
    evidence:
    - reference: PMID:33066435
      reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Ciguatera fish poisoning (CFP), the most prevalent seafood poisoning worldwide, is caused by the consumption of tropical and subtropical fish contaminated with potent neurotoxins called ciguatoxins (CTXs)."
      explanation: States consumption of contaminated fish as the cause of the disease.
  notes: >-
    Bound to `ECTO:0000537` exposure to toxin. ECTO was searched through this
    repository's adapter (`sqlite:obo:ecto`) for a ciguatoxin or ciguatera
    exposure class and none exists. The nearest classes under `ECTO:0000537` are
    mycotoxin, phytoalexin, phytotoxin, nephrotoxin, uremic toxin and virulence
    factor, and the fish-ingestion classes that do exist (`ECTO:0070099`
    bluefish, `ECTO:0070100` swordfish, `ECTO:0070189` whitefish,
    `ECTO:0070209` dark fish flesh) name unrelated species. One algal-toxin
    class does exist outside that subtree - `ECTO:8000033` exposure to
    accumulation of toxins from algal bloom process, whose parent is
    `ECTO:8000000` exposure to environmental process, so a descendant walk from
    `ECTO:0000537` misses it. It was considered and not used: ciguatoxin reaches
    people through years of food-chain accumulation in fish, not through a bloom
    event, and this entry's exposure is a meal rather than an environmental
    process. The
    specific agent is carried in `preferred_term`, and the toxin itself is bound
    to `CHEBI:61275` on the pathophysiology nodes where it acts. `food_source`
    names the marine fish product class rather than a species, because the
    implicated species differ by ocean basin and the slot takes a single term.
  evidence:
  - reference: PMID:28535116
    reference_title: "Is mannitol the treatment of choice for patients with ciguatera fish poisoning?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ciguatoxins, a class of tasteless, heat-stable, polycyclic toxins produced by dinoflagellates, accumulate through the food chain and concentrate in various carnivorous fish, such as groupers, barracudas, wrasses, amberjack, kingfishes, and eels."
    explanation: Names the implicated species and the undetectability that this description rests on.
  - reference: PMID:36006197
    reference_title: "Clinical Characteristics of Ciguatera Poisoning in Martinique, French West Indies-A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CP was mainly attributed to the ingestion of trevallies (59%), snappers (13%), and king mackerels (8%)"
    explanation: >-
      Quantifies which species actually caused disease in one Caribbean series,
      which is a stronger claim than a list of high-risk species.
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ciguateric fish are indistinguishable from uncontaminated ones with regard to taste, smell, and appearance."
    explanation: Supports the claim that no consumer-level inspection detects the exposure.
- name: Sea surface warming and coral reef disturbance
  description: >-
    Reef degradation and rising sea surface temperatures expand the algal
    substrate that Gambierdiscus and Fukuyoa colonise and extend the geographic
    range in which ciguatera occurs, including into previously unaffected
    temperate-adjacent waters. This acts on the upstream production step rather
    than on the human host.
  exposure_term:
    preferred_term: exposure to elevated sea surface temperature and degraded coral reef habitat
  influences_mechanisms:
  - target: Gambierdiscus Ciguatoxin Production on Reef Substrate
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Warming and reef disturbance change where and how much toxin-producing
      dinoflagellate is present, which sets regional risk rather than causing an
      individual poisoning.
    evidence:
    - reference: PMID:41610130
      reference_title: "Risk of ciguatoxins is shaped by Gambierdiscus community structure."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "When CTXs accumulate in seafood they cause Ciguatera Poisoning (CP), which affects ca. 20-50,000 people p.a. and is likely worsened by climate change."
      explanation: States climate change as a worsening factor for the disease, which is this link.
    - reference: PMID:33066435
      reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "global warming has tended to extend the areas concerned"
      explanation: >-
        States the geographic consequence directly - warming extends where the
        disease occurs, which is what this PREDISPOSES link asserts.
  notes: >-
    `exposure_term` deliberately carries a free-text `preferred_term` with no
    `term:`. ECTO was searched for a sea-surface-temperature, ocean-warming or
    reef-degradation exposure class and none exists; the temperature classes
    available describe exposure of an organism to ambient heat, which is not the
    claim here - the warming acts on the dinoflagellate habitat, not on the
    patient. `ECTO:0000537` would be wrong for the same reason, since no toxin
    is being described at this step.
  evidence:
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "global warming has tended to extend the areas concerned"
    explanation: States the range-expansion claim in this description.
  - reference: PMID:28225079
    reference_title: "Multiple sodium channel isoforms mediate the pathological effects of Pacific ciguatoxin-1."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "oceans warm and algal blooms become more frequent, ciguatera is now emerging as a significant issue in Asia, America and parts of Europe"
    explanation: >-
      Ties ocean warming and bloom frequency directly to the geographic expansion
      this exposure describes, rather than the expansion alone.
  - reference: PMID:29449664
    reference_title: "Incidence and clinical characteristics of ciguatera fish poisoning in Guadeloupe (French West Indies) between 2013 and 2016: a retrospective cases-series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The monitoring of ciguatera poisoning throughout the Caribbean region must be improved, notably after reef disturbance due to Irma and Maria major cyclones."
    explanation: >-
      A surveillance recommendation, not a measurement. It is included because it
      shows investigators treating named cyclone reef disturbance as a reason to
      expect changed ciguatera risk, which is weaker than demonstrating it.
treatments:
- name: Supportive and symptomatic care
  description: >-
    First-line and the only universally agreed management. Rehydration for
    gastrointestinal losses, antiemetics and antidiarrhoeals, analgesia for
    myalgia and arthralgia, antihistamines for pruritus, and atropine plus fluid
    and vasopressor support for bradycardia and hypotension. Rehydration also
    has to precede any mannitol infusion.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Diarrhea
    term:
      id: HP:0002014
      label: Diarrhea
  - preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
  evidence:
  - reference: PMID:25333356
    reference_title: "Epidemiology and clinical features of ciguatera fish poisoning in Hong Kong."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of ciguatera is primarily supportive and symptomatic."
    explanation: States supportive care as the mainstay.
  - reference: PMID:36006197
    reference_title: "Clinical Characteristics of Ciguatera Poisoning in Martinique, French West Indies-A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management was supportive. No patient died but symptoms persisted in 40% of the 77 patients with follow-up at day 15."
    explanation: >-
      Records what was actually given across a 149-patient series, together with
      the outcome - no deaths, but persisting symptoms in 40% of those followed up.
  - reference: PMID:19005579
    reference_title: "Ciguatera fish poisoning: treatment, prevention and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "indicated that mannitol should not be administered until the patient is adequately rehydrated"
    explanation: Supports rehydration preceding mannitol, which is the ordering claim in this description.
- name: Intravenous mannitol
  description: >-
    The most studied specific intervention and a genuinely contested one.
    Uncontrolled case series, an unblinded comparative trial and many case
    reports describe rapid neurological improvement when mannitol is given
    early; the single randomised controlled trial found no difference from
    normal saline. The proposed mechanism - osmotic reversal of the neuronal
    oedema this entry records as nodal and adaxonal swelling - is supported in
    isolated nerve preparations but not in intact animals. Both positions are
    recorded below rather than resolved.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mannitol
      term:
        id: CHEBI:16899
        label: D-mannitol
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Nodal and Adaxonal Schwann Cell Swelling
    description: >-
      The proposed target: hyperosmolar mannitol reverses the osmotic swelling
      at the node.
    evidence:
    - reference: PMID:33066435
      reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "nodal swelling of myelinated nerve fibers was prevented by tetrodotoxin and completely prevented and reversed by pretreatment with or the addition of hyperosmolar external solutions of D-mannitol"
      explanation: Demonstrates that hyperosmolar mannitol reverses this specific lesion in nerve fibres.
    - reference: PMID:28535116
      reference_title: "Is mannitol the treatment of choice for patients with ciguatera fish poisoning?"
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "Treatment with mannitol fails to correct these effects."
      explanation: >-
        The same reversal does not happen in an intact animal - in rats given
        intraperitoneal ciguatoxin, mannitol failed to correct the increased
        refractory period and slowed conduction velocity. This is why the
        treatment description says the mechanism is supported in isolated nerve
        preparations but not in intact animals.
  evidence:
  - reference: PMID:28535116
    reference_title: "Is mannitol the treatment of choice for patients with ciguatera fish poisoning?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Evidence supporting mannitol for ciguatera fish poisoning includes four uncontrolled case series, one prospective, unblinded comparative trial and several case reports."
    explanation: The body of evidence favouring mannitol, and its design limitations.
  - reference: PMID:28535116
    reference_title: "Is mannitol the treatment of choice for patients with ciguatera fish poisoning?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In 2002, a small randomized, controlled trial reported no significant difference between mannitol and normal saline."
    explanation: >-
      The only randomised evidence, and it contradicts the claim that mannitol
      is effective. Recorded as a separate REFUTE item rather than folded into
      the supporting one, because the two quotes make opposite claims.
  - reference: PMID:28535116
    reference_title: "Is mannitol the treatment of choice for patients with ciguatera fish poisoning?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "It is reasonable to consider using intravenous mannitol in cases of acute ciguatera fish poisoning."
    explanation: The reviewers' net position after weighing both bodies of evidence.
  - reference: PMID:19005579
    reference_title: "Ciguatera fish poisoning: treatment, prevention and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The effect of mannitol infusion is thought to be mediated by the osmotic reduction of neuronal edema"
    explanation: States the proposed mechanism this treatment is linked to.
- name: Atropine for symptomatic bradycardia
  description: >-
    The specific pharmacologic intervention for the one life-threatening feature
    of the illness, given with intravenous fluids and dopamine. Reversal can need
    unusually large cumulative doses over days - 45 mg and 30 mg over 48 hours in
    the two published cases - so a persisting bradycardia is a reason to continue
    rather than to abandon it.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atropine
      term:
        id: CHEBI:16684
        label: atropine
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Bradycardia
    term:
      id: HP:0001662
      label: Bradycardia
  evidence:
  - reference: PMID:25333356
    reference_title: "Epidemiology and clinical features of ciguatera fish poisoning in Hong Kong."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe bradycardia and prolonged hypotension can occur, necessitating prompt treatment with intravenous atropine, intravenous fluid replacement and dopamine infusion"
    explanation: States the indication and the three-drug combination this treatment records.
  - reference: PMID:22574244
    reference_title: "Cardiovascular Complications in Ciguatera Fish Poisoning: A Wake-up Call."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A continuous infusion of atropine with a total dose of 45 mg over 48 hours was given."
    explanation: Source of the cumulative-dose figure in this description.
  - reference: PMID:33066435
    reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "atropine effectively relieves the gastrointestinal and cardiovascular disturbances"
    explanation: >-
      Independent statement that atropine works here, which is why this entry no
      longer describes the bradycardia as atropine-resistant.
- name: Neuropathic-pain pharmacotherapy for persistent symptoms
  description: >-
    Amitriptyline, gabapentin, pregabalin, fluoxetine, duloxetine and tocainide
    have all been reported to suppress the paresthesia, dysesthesia and pruritus
    of the chronic phase. The evidence is case reports and overlapping case
    series only, none has been shown superior to another, and a long duration of
    treatment appears necessary to maintain the benefit.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amitriptyline
      term:
        id: CHEBI:2666
        label: amitriptyline
    - preferred_term: gabapentin
      term:
        id: CHEBI:42797
        label: gabapentin
    - preferred_term: pregabalin
      term:
        id: CHEBI:64356
        label: pregabalin
    - preferred_term: duloxetine
      term:
        id: CHEBI:36796
        label: duloxetine
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Repetitive Firing of Peripheral Sensory Afferents
    description: >-
      These are the agents used for neuropathic pain generally, and the
      persisting paresthesia and dysesthesia they suppress here are the clinical
      expression of this node. Whether they act on this mechanism in ciguatera
      specifically has not been shown.
    evidence:
    - reference: PMID:28535116
      reference_title: "Is mannitol the treatment of choice for patients with ciguatera fish poisoning?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Medications used in other neuropathic syndromes appear to suppress the paresthesiae of persistent ciguatera cases."
      explanation: >-
        States the observed effect. It supports the symptom claim; the mechanism
        attribution in this link's description is an inference and is flagged as
        such.
  target_phenotypes:
  - preferred_term: Perioral and distal paresthesia
    term:
      id: HP:0003401
      label: Paresthesia
  - preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:28535116
    reference_title: "Is mannitol the treatment of choice for patients with ciguatera fish poisoning?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Evidence regarding other treatments consists only of ten case reports and three overlapping case series that describe using amitriptyline, fluoxetine, duloxetine, gabapentin, pregabalin, or tocainide."
    explanation: Names the agents and states the quality of evidence behind them.
  - reference: PMID:28535116
    reference_title: "Is mannitol the treatment of choice for patients with ciguatera fish poisoning?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Medications used in other neuropathic syndromes appear to suppress the paresthesiae of persistent ciguatera cases."
    explanation: States the effect claimed for this treatment class.
  - reference: PMID:28535116
    reference_title: "Is mannitol the treatment of choice for patients with ciguatera fish poisoning?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, the human evidence is of low quality for all treatments."
    explanation: The caveat this description carries, in the reviewers' own words.
- name: Avoidance of relapse-triggering foods
  description: >-
    Patients are counselled to avoid reef fish and other marine products,
    alcohol, nuts and red meat after an episode, because these are reported to
    reactivate neurological symptoms months after the index poisoning. The
    trigger list is observational and the mechanism is unknown.
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  evidence:

    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Motor nerve terminals and perisynaptic Schwann cell soma of frog neuromuscular junctions (NMJs) exposed to CTXs were also swollen"
    explanation: >-
      Analogous swelling in a directly exposed preparation, where the human
      biopsies are observational. Note this is the perisynaptic Schwann cell at
      the neuromuscular junction, a different cell population from the adaxonal
      myelinating Schwann cell this node is about.
- name: Calcium-Dependent CGRP Release and Neurogenic Inflammation
  biological_scale: CELLULAR
  description: >-
    Depolarised sensory terminals release calcitonin gene-related peptide in a
    manner dependent on extracellular sodium and calcium and independent of
    thermosensory transient receptor potential channel activation. Nav1.9 alone,
    and Nav1.7 with Nav1.1 together, carry most of the release. Intradermal
    ciguatoxin in human volunteers produces a long-lasting painful axon reflex
    flare, which is the neurogenic-inflammation readout of this step, and CGRP
    signalling is the plausible route from afferent firing to itch.
  biological_processes:
  - preferred_term: CGRP release from sensory nerve terminals
    modifier: INCREASED
    term:
      id: GO:0007269
      label: neurotransmitter secretion
  cell_types:
  - preferred_term: peptidergic sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Hyperhidrosis
    causal_link_type: DIRECT
    description: >-
      Sweating follows the cutaneous axon reflex rather than the enteric branch:
      intracutaneous ciguatoxin in human volunteers elicits axon reflex sweating
      through efferent cholinergic sympathetic skin nerves.
    evidence:
    - reference: PMID:33066435
      reference_title: "Neurological Disturbances of Ciguatera Poisoning: Clinical Features and Pathophysiological Basis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "In human volunteers, intracutaneous injection of low nanomolar concentrations of P-CTX-1 in the forearm elicited a striking axon reflex sweating"
      explanation: The human experiment that places sweating on the cutaneous axon-reflex route.

name: Ciguatera Fish Poisoning
creation_date: "2026-09-15T02:30:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Marine Biotoxin Illness
- Foodborne Intoxication
parents:
- Foodborne Intoxication
- Marine Biotoxin Poisoning
synonyms:
- ciguatera
- ciguatera poisoning
- CFP
- ciguatoxin poisoning
- ciguatera toxicosis
description: >-
  Ciguatera fish poisoning is an acquired foodborne intoxication caused by eating
  reef fish whose flesh carries ciguatoxins - lipophilic, heat-stable cyclic
  polyether toxins originating in the benthic dinoflagellates Gambierdiscus and
  Fukuyoa. The algal precursors, gambiertoxins, enter the reef food web when
  herbivorous fish graze toxin-bearing macroalgae, are oxidised in fish liver to
  more polar and more potent congeners, and biomagnify into carnivorous
  predators such as jacks, groupers, snappers, barracuda and moray eels. Because
  the toxins are tasteless, odourless and unaffected by cooking or freezing, no
  consumer-level inspection prevents exposure. The unifying molecular mechanism
  is binding at neurotoxin receptor site 5 on the alpha subunit of voltage-gated
  sodium channels, which shifts the voltage dependence of activation to more
  hyperpolarised potentials and impairs inactivation, so channels open near the
  resting membrane potential. The resulting sodium influx, amplified by
  concurrent block of delayed-rectifier and A-type potassium currents, drives
  repetitive firing in peripheral sensory afferents, enteric and autonomic
  neurons, and cardiac conduction tissue, and produces osmotically driven
  swelling at the nodes of Ranvier and in adaxonal Schwann cell cytoplasm.
  Patients present within hours of the meal with nausea, vomiting, diarrhoea and
  abdominal pain, followed by perioral and distal paresthesia, pruritus and the
  near-pathognomonic cold allodynia in which innocuous cool contact is felt as
  burning pain; bradycardia and hypotension occur in a minority and can be
  life-threatening. Gastrointestinal features settle within days while
  neurological features persist for weeks to months, and roughly a fifth of
  patients develop a chronic relapsing syndrome of fatigue, dysesthesia and
  pruritus that can be reactivated by alcohol, nuts or a further fish meal. No
  antidote exists; management is supportive, with intravenous mannitol and
  neuropathic-pain agents both supported only by low-quality evidence.
notes: >-
  Curated from a `claude_code` deep-research report
  (`research/Ciguatera_Fish_Poisoning-deep-research-claude_code.md`), whose
  reference validation resolved 38/38 identifiers and whose term validation
  resolved 41/41 CURIEs. Every ontology binding written here was nevertheless
  re-derived by a fresh lookup rather than copied from that report, per the
  repository's term contract; the report itself flags its suggested CURIEs as
  unverified. There is no GeneReviews chapter, and no OMIM entry, because this
  is an acquired toxicosis with no Mendelian basis - the `genetic:` section is
  deliberately absent rather than empty, and the open question of host
  voltage-gated sodium channel variation is recorded in `discussions` instead of
  being inferred from channel pharmacology. `clinical_trials:` is likewise empty
  because no NCT-registered ciguatera trial was found; the one randomised trial
  in the literature predates registration and is cited through the review that
  appraises it.

  Two mechanisms here are genuinely disputed and are curated as disputes rather
  than resolved. Where ciguatoxin acts on the heart is one: the clinical
  literature argues an indirect vagal-afferent and central-vasomotor route while
  mouse histology argues direct myocardial sodium channel activation, and the
  `Cardiac Conduction and Vasomotor Disturbance` node carries both with a
  `REFUTE` item against the indirect account. Whether intravenous mannitol works
  is the other, carried as a `SUPPORT`/`REFUTE` pair on the treatment and a
  second `REFUTE` on its mechanism link, where the nerve-preparation result and
  the intact-rat result disagree.

  Two causal edges are deliberately *not* drawn. Sodium channel activation does
  not cause the potassium current inhibition, so that node hangs off the
  ingestion node as a parallel branch of the same exposure; and repetitive
  firing does not cause the cold sensitisation, which is a sibling consequence
  of the same depolarisation. Both were initially drawn the wrong way round and
  corrected.

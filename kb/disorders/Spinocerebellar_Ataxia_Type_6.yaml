name: Spinocerebellar Ataxia Type 6
category: Mendelian
creation_date: '2026-09-08T08:45:00Z'
synonyms:
- SCA6
- spinocerebellar ataxia 6
- CACNA1A autosomal dominant cerebellar ataxia type III
- autosomal dominant cerebellar ataxia type III caused by mutation in CACNA1A
description: >-
  Spinocerebellar ataxia type 6 is a late-onset, slowly progressive, largely pure
  cerebellar ataxia caused by a small CAG repeat expansion in the last exon of
  the longest CACNA1A isoform on chromosome 19p13. Normal alleles carry 4-18
  repeats and disease alleles 19-33 — an order of magnitude shorter than the
  expansions of SCA1, SCA3 or Huntington disease, and short enough that the
  repeat is transmitted with unusual stability between generations.

  What makes SCA6 mechanistically distinctive is that CACNA1A is bicistronic. An
  internal ribosome entry site in the same mRNA produces a second, structurally
  unrelated protein, alpha1ACT, which is a transcription factor driving a
  programme of Purkinje-cell and cerebellar developmental genes — and it is
  alpha1ACT, not the channel, that carries the polyglutamine tract. Expanded
  alpha1ACT loses its transcription-factor and neurite-outgrowth function, kills
  cells in culture, and produces ataxia and cerebellar atrophy in transgenic
  mice. So the pathogenic species in SCA6 is a transcription factor cleaved from
  a calcium channel, which is why SCA6 sits awkwardly alongside both the
  polyglutamine diseases and the CACNA1A channelopathies.

  The pathology is correspondingly focal: severe, vermis-predominant Purkinje
  cell loss with a normal brainstem in most patients, and cytoplasmic — not
  nuclear — alpha1A aggregates that are not ubiquitinated, in contrast to the
  ubiquitin-positive neuronal intranuclear inclusions of the other polyglutamine
  ataxias. Clinically this gives gait and limb ataxia, dysarthria, and a
  characteristic oculomotor picture of gaze-evoked and vertical nystagmus with an
  abnormal vestibulo-ocular reflex. Across the literature onset spans 19 to 73
  years with a mean between 43 and 52. Repeat length does correlate inversely
  with onset age, but far more weakly than in the long-repeat ataxias, and not at
  all within a kindred: relatives carrying an identical repeat number have
  differed in onset by nearly four decades.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    SCA6 is autosomal dominant. The expansion segregates with the phenotype, and
    a reported compound heterozygote had earlier onset and a more rapid course
    than relatives carrying one copy of the same expanded allele — a dosage
    effect rather than true recessivity.
  evidence:
  - reference: PMID:8988170
    reference_title: Autosomal dominant cerebellar ataxia (SCA6) associated with small polyglutamine expansions in the alpha 1A-voltage-dependent calcium channel.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the repeat length in families of the affected individuals revealed that the expansion segregated with the phenotype in every patient.
    explanation: Establishes dominant segregation of the expanded allele.
  - reference: PMID:9371902
    reference_title: Spinocerebellar ataxia type 6. Frequency of the mutation and genotype-phenotype correlations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, a compound heterozygote for the SCA6 expansion manifested an earlier onset and more rapid course than family members with the same larger expanded allele.
    explanation: >-
      Documents the gene-dosage effect that qualifies the simple dominant model.
  - reference: PMID:20301319
    reference_title: Spinocerebellar Ataxia Type 6.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      SCA6 is inherited in an autosomal dominant manner. Offspring of an affected individual have a 50% chance of inheriting an abnormal CAG trinucleotide repeat expansion in CACNA1A.
    explanation: >-
      GeneReviews states the transmission risk to offspring, which is the figure
      genetic counselling actually turns on.
  - reference: PMID:20301319
    reference_title: Spinocerebellar Ataxia Type 6.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Once a CACNA1A CAG repeat expansion has been identified in an affected family member, prenatal testing and preimplantation genetic testing for SCA6 are possible.
    explanation: >-
      Records the reproductive options available once the familial expansion is
      known.
genetic:
- name: CACNA1A
  gene_term:
    preferred_term: CACNA1A
    term:
      id: hgnc:1388
      label: CACNA1A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    A CAG repeat expansion in the last exon of the longest CACNA1A isoform.
    Normal 4-18 repeats, pathogenic 19-33. The repeat lies within an open reading
    frame and is translated as polyglutamine in a subset of isoforms.
  evidence:
  - reference: PMID:8988170
    reference_title: Autosomal dominant cerebellar ataxia (SCA6) associated with small polyglutamine expansions in the alpha 1A-voltage-dependent calcium channel.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight unrelated patients with late onset ataxia had alleles with larger repeat numbers (21-27) compared to the number of repeats (4-16) in 475 non-ataxia individuals.
    explanation: >-
      The original case-control observation that identified the expansion, with
      the control distribution that defines the normal range.
  - reference: PMID:29427102
    reference_title: "Spinocerebellar [corrected] Ataxia Type 6: Molecular Mechanisms and Calcium Channel Genetics."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Normal alleles have 4-18 repeats, while alleles causing disease contain 19-33 repeats.
    explanation: Gives the current normal and pathogenic repeat ranges.
  - reference: PMID:20301319
    reference_title: Spinocerebellar Ataxia Type 6.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Affected individuals have 20 to 33 CAG repeats."
    explanation: >-
      GeneReviews gives the pathogenic range as 20-33, where PMID:29427102 gives
      19-33. The divergence is real and is recorded in this entry's notes rather
      than silently resolved; alleles at 19 repeats are the disputed boundary.
  - reference: PMID:9436730
    reference_title: "Spinocerebellar ataxia type 6: genotype and phenotype in German kindreds."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Age at onset correlated inversely with repeat length.
    explanation: >-
      Establishes that repeat length is not wholly uninformative for onset age,
      which qualifies this entry's discussion of onset variance.
  - reference: PMID:9436730
    reference_title: "Spinocerebellar ataxia type 6: genotype and phenotype in German kindreds."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither these clinical signs nor progression rate correlated with CAG repeat length.
    explanation: >-
      Bounds what repeat length predicts: onset age only, not the non-cerebellar
      features or the rate of progression.
pathophysiology:
- name: CACNA1A CAG Repeat Expansion
  biological_scale: MOLECULAR
  conforms_to: "polyglutamine_expansion_proteotoxicity#Translated CAG / Polyglutamine Repeat Expansion"
  description: >-
    A small CAG expansion (19-33 repeats) in the last exon of the longest
    CACNA1A isoform. The expansion is unusually short for a polyglutamine
    disease and is transmitted with high stability, so anticipation is not a
    feature and repeat length is a weak predictor of onset age.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    allele_type: REPEAT_EXPANSION
    zygosity: HETEROZYGOUS
  downstream:
  - target: Expanded Polyglutamine alpha1ACT Transcription Factor
    causal_link_type: DIRECT
    description: >-
      The repeat lies in the region translated as the C-terminal polyglutamine
      tract of alpha1ACT, so the expansion is carried by that protein.
    evidence:
    - reference: PMID:29427102
      reference_title: "Spinocerebellar [corrected] Ataxia Type 6: Molecular Mechanisms and Calcium Channel Genetics."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: >-
        α1ACT, a newly recognized transcription factor, with polyglutamine repeat at C-terminal end.
      explanation: >-
        States that the polyglutamine tract sits on alpha1ACT rather than on the
        channel subunit.
  evidence:
  - reference: PMID:29427102
    reference_title: "Spinocerebellar [corrected] Ataxia Type 6: Molecular Mechanisms and Calcium Channel Genetics."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Genetically, SCA6 is caused by expansion of a trinucleotide CAG repeat in the last exon of longest isoform CACNA1A gene on chromosome 19p13.1-p13.2.
    explanation: Locates the expansion precisely within the gene.
  - reference: PMID:9403487
    reference_title: "Spinocerebellar ataxia type 6: gaze-evoked and vertical nystagmus, Purkinje cell degeneration, and variable age of onset."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The expanded alleles were all of a single size (repeat number) within the two large kindreds, numbering 22 and 23 repeat units.
    explanation: >-
      Documents the repeat stability within kindreds that distinguishes SCA6
      from the long, unstable expansions of other polyglutamine ataxias.
- name: Expanded Polyglutamine alpha1ACT Transcription Factor
  biological_scale: MOLECULAR
  conforms_to: "polyglutamine_expansion_proteotoxicity#Transcriptional Dysregulation"
  description: >-
    CACNA1A is bicistronic: an internal ribosome entry site in the same mRNA
    yields alpha1ACT, a transcription factor that coordinates a programme of
    neural and Purkinje-cell developmental genes. The polyglutamine tract sits on
    alpha1ACT, and expansion abolishes its transcription-factor and
    neurite-outgrowth activity. This is what separates SCA6 from the rest of the
    CACNA1A allelic series, in which the channel protein itself is altered.
  molecular_functions:
  - preferred_term: alpha1ACT DNA-binding transcription factor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    modifier: DECREASED
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  downstream:
  - target: Cytoplasmic alpha1A Aggregation in Purkinje Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Expanded polyglutamine protein aggregates in Purkinje cells. The step from
      loss of alpha1ACT transcriptional function to cytoplasmic aggregate
      formation is not established; the two are separately documented.
  - target: Purkinje Cell Degeneration
    causal_link_type: DIRECT
    description: >-
      Expanded alpha1ACT expressed as an independent polypeptide causes cell
      death in culture and produces ataxia with cerebellar atrophy in transgenic
      mice.
    evidence:
    - reference: PMID:23827678
      reference_title: Second cistron in CACNA1A gene encodes a transcription factor mediating cerebellar development and SCA6.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        When expressed as an independent polypeptide, α1ACT-bearing an expanded polyQ tract-lacks transcription factor function and neurite outgrowth properties, causes cell death in culture, and leads to ataxia and cerebellar atrophy in transgenic mice.
      explanation: >-
        The key causal experiment. Graded INDIRECT because it establishes the
        edge in transgenic mouse and cell culture, expressing alpha1ACT out of
        its normal bicistronic context, rather than in human tissue.
  evidence:
  - reference: PMID:23827678
    reference_title: Second cistron in CACNA1A gene encodes a transcription factor mediating cerebellar development and SCA6.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We found that CACNA1A coordinates gene expression using a bicistronic mRNA bearing a cryptic internal ribosomal entry site (IRES).
    explanation: Establishes the bicistronic architecture that produces alpha1ACT.
  - reference: PMID:23827678
    reference_title: Second cistron in CACNA1A gene encodes a transcription factor mediating cerebellar development and SCA6.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      The second expresses a transcription factor, α1ACT, which coordinates expression of a program of genes involved in neural and Purkinje cell development.
    explanation: >-
      States alpha1ACT's normal function, which is what the expansion removes.
- name: Cytoplasmic alpha1A Aggregation in Purkinje Cells
  biological_scale: CELLULAR
  conforms_to: "polyglutamine_expansion_proteotoxicity#Misfolded Polyglutamine Protein Aggregation"
  description: >-
    SCA6 brains show oval or rod-shaped alpha1A aggregates confined to the
    cytoplasm of Purkinje cells. Two features set this apart from the other
    polyglutamine ataxias: the inclusions are cytoplasmic rather than nuclear,
    and they are not ubiquitinated. The channel mRNA and protein bearing the
    repeat are most intensely expressed in Purkinje cells, which is the simplest
    available explanation for why those cells are the ones that die.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  cellular_components:
  - preferred_term: cytoplasmic inclusion body
    modifier: INCREASED
    term:
      id: GO:0016234
      label: inclusion body
  downstream:
  - target: Purkinje Cell Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Aggregation accompanies degeneration in SCA6 brains, and transfection of
      full-length expanded CACNA1A produces perinuclear aggregates together with
      apoptotic death. Whether the aggregates are the killing species or a marker
      of the process is not resolved.
  evidence:
  - reference: PMID:10369863
    reference_title: "Abundant expression and cytoplasmic aggregations of [alpha]1A voltage-dependent calcium channel protein associated with neurodegeneration in spinocerebellar ataxia type 6."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In SCA6 brains, numerous oval or rod-shaped aggregates were seen exclusively in the cytoplasm of Purkinje cells.
    explanation: >-
      Establishes the aggregate species, its cytoplasmic location, and its
      restriction to Purkinje cells, in human post-mortem tissue.
  - reference: PMID:10369863
    reference_title: "Abundant expression and cytoplasmic aggregations of [alpha]1A voltage-dependent calcium channel protein associated with neurodegeneration in spinocerebellar ataxia type 6."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cytoplasmic inclusions were not ubiquitinated, which contrasts with the neuronal intra-nuclear inclusions of other CAG repeat/polyglutamine diseases.
    explanation: >-
      The negative finding that distinguishes SCA6 from the rest of the
      polyglutamine family and qualifies its conformance to the module.
  - reference: PMID:10369863
    reference_title: "Abundant expression and cytoplasmic aggregations of [alpha]1A voltage-dependent calcium channel protein associated with neurodegeneration in spinocerebellar ataxia type 6."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In cultured cells, formation of perinuclear aggregates of the channel protein and apoptotic cell death were seen when transfected with full-length CACNA1A coding an expanded polyglutamine tract.
    explanation: >-
      Couples aggregation to death. Graded INDIRECT: transfected cell lines
      overexpressing the full-length channel, not Purkinje cells in situ.
- name: Purkinje Cell Degeneration
  biological_scale: CELLULAR
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  description: >-
    Severe Purkinje cell loss, most marked in the vermis, with dendritic and
    axonal abnormalities in the surviving cells — heterotopic irregular nuclei,
    somatic sprouts, increased spine-like protrusions, and axonal torpedoes. The
    pathology is largely restricted to the cerebellar cortex, with a normal
    brainstem in most patients within the first decade of symptoms.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  locations:
  - preferred_term: cerebellar vermis
    term:
      id: UBERON:0004720
      label: cerebellar vermis
  downstream:
  - target: Cerebellar Cortical Atrophy
    causal_link_type: DIRECT
    description: >-
      Loss of the principal cortical output neuron produces the selective
      cerebellar atrophy seen on imaging and at autopsy.
  evidence:
  - reference: PMID:10985694
    reference_title: Morphological Purkinje cell changes in spinocerebellar ataxia type 6.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe loss of Purkinje cells was found, particularly in the vermis, and various morphological changes in Purkinje cells and their dendritic arborizations were demonstrated.
    explanation: >-
      Establishes the cell type lost and its topographic preference, in human
      cerebellar tissue.
  - reference: PMID:10985694
    reference_title: Morphological Purkinje cell changes in spinocerebellar ataxia type 6.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many of the remaining Purkinje cells were found to have heterotopic, irregularly shaped nuclei, an unclear cytoplasmic membrane outline, and somatic sprouts.
    explanation: >-
      Describes the sublethal changes in surviving cells, indicating a
      degenerative process rather than simple cell dropout.
  - reference: PMID:9403487
    reference_title: "Spinocerebellar ataxia type 6: gaze-evoked and vertical nystagmus, Purkinje cell degeneration, and variable age of onset."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographically and pathologically, there was selective atrophy of the cerebellum and extensive loss of Purkinje cells in the cerebellar cortex.
    explanation: >-
      Independent confirmation of the selective cerebellar pathology across four
      kindreds.
- name: Cerebellar Cortical Atrophy
  biological_scale: TISSUE
  conforms_to: "cerebellar_purkinje_degeneration#Loss of Cerebellar Cortical Output"
  description: >-
    Selective cerebellar atrophy with a normal brainstem in most patients,
    especially early. This is the anatomical basis of the "pure cerebellar"
    phenotype that places SCA6 in Harding's ADCA type III class.
  locations:
  - preferred_term: cerebellar cortex
    term:
      id: UBERON:0002129
      label: cerebellar cortex
  downstream:
  - target: Progressive cerebellar ataxia
    causal_link_type: DIRECT
    description: >-
      Loss of cerebellar cortical output produces the progressive gait and limb
      ataxia and dysarthria.
  - target: Gaze-evoked and vertical nystagmus
    causal_link_type: DIRECT
    description: >-
      Cerebellar control of gaze-holding and of the vestibulo-ocular reflex is
      lost, giving the characteristic oculomotor signature.
  evidence:
  - reference: PMID:9371902
    reference_title: Spinocerebellar ataxia type 6. Frequency of the mutation and genotype-phenotype correlations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical examination, quantitative eye movement testing, and imaging data show that the brainstem is normal in most patients with SCA6, especially within the first 10 years of symptoms.
    explanation: >-
      The important negative: the atrophy is cerebellar and does not extend to
      the brainstem, unlike ADCA type I disorders.

- Hereditary Ataxia
- Neurodegenerative Disease
notes: >-
  Curated as a standalone entry following the established pattern for numbered
  SCAs in this KB — Spinocerebellar_Ataxia_Type_1, _23 and _31 are all separate
  entries even though the Harding-class entries Autosomal_Dominant_Cerebellar_
  Ataxia_Type_I and _Type_III list them as has_subtypes. SCA6 remains a subtype
  of Autosomal_Dominant_Cerebellar_Ataxia_Type_III there.

  Boundary with the sibling CACNA1A entries: CACNA1A_Related_Disorder covers the
  allelic series as a whole, Episodic_Ataxia covers EA2 and Familial_Hemiplegic_
  Migraine covers FHM1. Those are loss-of-function and missense channel
  disorders; SCA6 is a repeat expansion acting on the alpha1ACT transcription
  factor. The allelism is real and clinically visible — some SCA6 patients have
  an episodic course resembling EA2 — and is recorded in the pathophysiology
  notes rather than merged into one entry.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Placed with the neurological disorders as a hereditary cerebellar ataxia.
      Harrison's does not list SCA6 individually; this is a mechanism- and
      system-based placement, matching the sibling entry
      Spinocerebellar_Ataxia_Type_31.

      The SCA6 mutation is allelic with episodic ataxia type 2 (EA-2), but the two differ clinically because of the presence of progressive, rather than episodic, ataxia in SCA6.
    explanation: >-
      States the clinical boundary with the sibling CACNA1A entry Episodic_Ataxia.

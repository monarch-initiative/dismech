animal_models:
- name: alpha1ACT polyglutamine transgenic mouse
  species: Mouse
  genotype: Transgenic expression of alpha1ACT bearing an expanded polyglutamine tract
  publication: PMID:23827678
  description: >-
    Expresses alpha1ACT as an independent polypeptide rather than from the
    bicistronic CACNA1A message, which is what makes it a test of the fragment's
    sufficiency.
  modeled_mechanisms:
  - target: Purkinje Cell Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Produces ataxia and cerebellar atrophy, establishing that expanded
      alpha1ACT alone is sufficient for a cerebellar degenerative phenotype.
    limitations: >-
      alpha1ACT is expressed out of its normal bicistronic context, so the model
      cannot speak to IRES regulation or to the stoichiometry between the channel
      and the fragment — which is the axis the proposed IRES-suppression therapy
      would act on. The readout is ataxia and atrophy rather than the cytoplasmic
      non-ubiquitinated aggregates seen in human SCA6 Purkinje cells, so the
      aggregation arm of this entry's pathograph is not modelled.
    evidence:
    - reference: PMID:23827678
      reference_title: Second cistron in CACNA1A gene encodes a transcription factor mediating cerebellar development and SCA6.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        When expressed as an independent polypeptide, α1ACT-bearing an expanded polyQ tract-lacks transcription factor function and neurite outgrowth properties, causes cell death in culture, and leads to ataxia and cerebellar atrophy in transgenic mice.
      explanation: >-
        Reports the murine phenotype. Graded INDIRECT for the same reason the
        corresponding pathograph edge is: expression outside the bicistronic
        context is a departure from the human situation.
discussions:
- discussion_id: ires_suppression_as_therapeutic_target
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Expanded Polyglutamine alpha1ACT Transcription Factor
  prompt: >-
    Can suppressing CACNA1A IRES activity reduce expanded alpha1ACT without
    disturbing the alpha1A calcium channel, and is that tolerable in humans?
  rationale: >-
    The bicistronic architecture offers something rare in a repeat-expansion
    disease: a way to remove the toxic species selectively, because alpha1ACT and
    the channel are translated from the same mRNA by different mechanisms. The
    authors who identified the IRES proposed exactly this. But alpha1ACT has a
    normal developmental function that the same intervention would also remove,
    and the channel is essential, so the therapeutic window is entirely
    unknown. No human data exist.
- discussion_id: aggregate_species_causal_or_marker
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Cytoplasmic alpha1A Aggregation in Purkinje Cells
  prompt: >-
    Are the non-ubiquitinated cytoplasmic alpha1A aggregates a cause of Purkinje
    cell death in SCA6, or a marker of a process driven by loss of alpha1ACT
    transcriptional function?
  rationale: >-
    Two candidate proximal mechanisms are documented in different systems and
    have never been tested against each other. Aggregation is seen in patient
    Purkinje cells and, with cell death, in cells transfected with the expanded
    full-length channel; loss of alpha1ACT transcription-factor function causes
    death and murine ataxia when that fragment is expressed alone. The edge from
    alpha1ACT dysfunction to aggregation is therefore left as
    INDIRECT_UNKNOWN_INTERMEDIATES rather than asserted in either direction.
    Resolving it decides whether the therapeutic target is aggregation or
    transcription.
- discussion_id: onset_age_variance_unexplained
  kind: KNOWLEDGE_GAP
  attaches_to:
  - progression#Onset
  prompt: >-
    What accounts for the onset variance in SCA6 that repeat length does not
    explain, and none of which it explains within a kindred?
  rationale: >-
    Repeat length is not uninformative here: Durr et al. found onset age
    correlates inversely with it. But the correlation is weaker than in SCA1 or
    SCA2, it does not extend to progression rate or to the non-cerebellar signs,
    and within a kindred sharing one repeat number members have differed in onset
    by nearly four decades. So the residual variance is large and unattributed,
    and implies a modifier — genetic, or cumulative Purkinje-cell stress — that
    has not been identified. The practical consequence is narrower than "repeat
    size tells you nothing": it constrains how precisely onset can be predicted
    for an individual, not whether repeat size carries any signal at all.

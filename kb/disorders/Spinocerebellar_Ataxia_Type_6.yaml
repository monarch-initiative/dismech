progression:
- phase: Onset
  notes: >-
    Adult onset spanning 19 to 73 years across the literature, mean 43 to 52.
    Repeat length correlates inversely with onset age but explains much less of
    the variance than in the long-repeat ataxias — and none of it within a
    kindred, where members sharing one repeat number differed by 24 to 63 years.
  evidence:
  - reference: PMID:20301319
    reference_title: Spinocerebellar Ataxia Type 6.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The age of onset ranges from 19 to 73 years; mean age of onset is between 43 and 52 years.
    explanation: >-
      The literature-wide onset range, which supersedes the single-series figure
      as the disease-level statement.
  - reference: PMID:9403487
    reference_title: "Spinocerebellar ataxia type 6: gaze-evoked and vertical nystagmus, Purkinje cell degeneration, and variable age of onset."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is noteworthy that the age of onset of ataxia ranged from 24 to 63 years among all affected individuals, despite the uniform repeat number.
    explanation: >-
      The observation that decouples onset age from repeat length in this
      disease, unlike the long-repeat polyglutamine ataxias.
- phase: First decade of symptoms
  notes: >-
    The syndrome remains largely confined to the cerebellum, with a normal
    brainstem on examination, oculomotor testing and imaging in most patients.
  evidence:
  - reference: PMID:9371902
    reference_title: Spinocerebellar ataxia type 6. Frequency of the mutation and genotype-phenotype correlations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical examination, quantitative eye movement testing, and imaging data show that the brainstem is normal in most patients with SCA6, especially within the first 10 years of symptoms.
    explanation: Bounds the anatomical extent of disease in the first decade.
diagnosis:
- name: CACNA1A Repeat-Sizing Molecular Genetic Testing
  description: >-
    Diagnosis rests on sizing the CAG repeat in the last exon of CACNA1A. Durr
    et al. put the point sharply: no clinical or electrophysiological finding was
    specific for SCA6 against SCA1, SCA2 or SCA3, so the molecular defect cannot
    be predicted from clinical examination. Testing is therefore indicated even
    in apparently sporadic adult-onset ataxia, because late onset hides the
    affected parent in up to 30% of kindreds.
  evidence:
  - reference: PMID:20301319
    reference_title: Spinocerebellar Ataxia Type 6.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of SCA6 rests on the use of molecular genetic testing to detect an abnormal CAG trinucleotide repeat expansion in CACNA1A.
    explanation: States the confirmatory test.
  - reference: PMID:9436730
    reference_title: "Spinocerebellar ataxia type 6: genotype and phenotype in German kindreds."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By comparison with SCA1, SCA2, and SCA3 no clinical or electrophysiological finding was specific for SCA6. Therefore, the molecular defect cannot be predicted from clinical investigations.
    explanation: >-
      The negative result that makes molecular testing necessary rather than
      merely confirmatory.
  - reference: PMID:9436730
    reference_title: "Spinocerebellar ataxia type 6: genotype and phenotype in German kindreds."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing is therefore recommended for the SCA6 mutation also in patients with putative sporadic ataxia.
    explanation: Extends the testing indication to apparently sporadic disease.
  notes: >-
    Repeat-range divergence, recorded rather than resolved: GeneReviews states
    affected individuals have 20 to 33 repeats, while PMID:29427102 gives the
    pathogenic range as 19 to 33. Alleles at 19 are the disputed boundary and
    have been described as borderline or low-penetrance. Both statements are
    quotable and both are carried in the genetic block.

- name: Clinical provocation and electromyography
  description: Examine relaxation after repeated rapid contractions and sustained hand grip or eyelid closure. Absence of myotonic discharges with clinically evident delayed relaxation suggests Brody disease. Silent contractures may need active provocation and are not always elicited; normal routine EMG does not exclude the diagnosis.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: when EMG shows no myotonic discharges in patients clinically suspected of having a myotonic disorder, provocation of possible silent contractures is recommended by performing rapid contractions during EMG.
    explanation: Clinical testing recommendation from the cohort.
- name: ATP2A1 sequencing with deletion analysis when indicated
  description: Sequence ATP2A1 directly or use an appropriate myopathy panel/exome approach. Ensure exon and gene copy-number changes are assessed, particularly when clinical and functional evidence is convincing but only one pathogenic allele is found. The pediatric series recommends including ATP2A1 in congenital-myopathy, developmental/movement-disorder and muscle-channelopathy panels.
  evidence:

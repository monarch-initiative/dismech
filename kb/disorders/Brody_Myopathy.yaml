    snippet: Other tested CFTR correctors including VX809 ... VX661 ... and the molecule glafenine, were less effective or almost totally ineffective in rescuing R164H mutant SERCA1.
    explanation: Approved cystic-fibrosis drugs cannot be assumed to reproduce the experimental C17 result.

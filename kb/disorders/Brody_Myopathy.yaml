- name: Usually limited myonecrosis
  description: Discrete necrosis occurred in one reviewed biopsy, with degeneration in two additional specimens. Extensive necrosis is not the typical baseline pattern, but acute rhabdomyolysis and more severe bovine muscle injury are documented.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Discrete necrosis was found in only one biopsy (Patient L18). The same biopsy also showed sparse regeneration, and two other biopsies showed degeneration
    explanation: Qualifies the usual absence rather than claiming muscle injury never occurs.

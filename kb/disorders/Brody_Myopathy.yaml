      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: Sarcoplasmic/endoplasmic reticulum Ca2+ ATPase (SERCA) activity was reduced and western blot analysis showed decreased or absent SERCA1 protein.
      explanation: Paired functional and protein findings in human muscle.
  - target: Selective Type II Fibre Involvement
    description: The fast-twitch distribution of SERCA1 helps explain preferential type II pathology.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - &id005
      reference: PMID:32040565
      reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
      supports: SUPPORT

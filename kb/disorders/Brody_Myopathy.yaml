- name: Dantrolene
  description: Dantrolene reduces skeletal-muscle calcium release and is used off label for symptoms in selected patients. Five exposed patients in the 2020 series had no reported benefit, whereas a 2026 single case reported marked improvement. These uncontrolled observations indicate variable response, not established efficacy or an explained genotype-specific difference.

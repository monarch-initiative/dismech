    explanation: Explicit analytical specificity limit.
  reference_ranges:
  - lower_bound: 36.6
    unit: mU/mg
    population: Study-specific frozen quadriceps samples from 28 healthy controls; optimized molybdate-Fe(II) phosphate assay
    notes: Lower limit calculated as control mean minus two standard deviations; mU per mg total protein. Not a universal clinical cutoff. No upper reference limit was established. Patient samples included two quadriceps and two deltoid biopsies; age, sex, muscle site and other myopathies require further validation.
    evidence:
    - reference: PMID:41938373

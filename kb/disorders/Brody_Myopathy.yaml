- name: Sarcoplasmic reticulum calcium ATPase activity
  presence: DECREASED
  notes: Whole-muscle calcium-dependent ATPase activity is reduced in genetically confirmed Brody disease. In the optimized 2026 assay, four patient samples averaged 30.0 ± 4.2 mU/mg protein versus 86.7 ± 25.1 in 28 controls (mean ± SD). This is a compound SERCA1/SERCA2 assay with potential PMCA contribution. The small control-versus-case comparison does not establish specificity against other myopathies, and results require clinical and genetic interpretation.
  evidence:
  - reference: PMID:41938373
    reference_title: Sarco/endoplasmatic reticulum calcium ATPase activity in healthy muscle and Brody disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Brody disease muscle samples (30.0 ± 4.2 mU/mg protein) compared to controls (86.7 ± 25.1 mU/mg protein)
    explanation: Quantitative values from the specified assay and small clinical sample.
  - reference: PMID:41938373

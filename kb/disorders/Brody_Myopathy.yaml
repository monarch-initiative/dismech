    explanation: Independent study supports limited discriminatory value.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic pathogenic ATP2A1 variants cause autosomal recessive Brody disease. Heterozygous relatives in
    reported families generally lack the Brody phenotype. When both parents carry one familial pathogenic allele,
    each pregnancy has the standard recessive recurrence risk of 25%; molecular phasing and family testing
    are important for counseling.
  evidence:
  - *id008
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Heterozygous family members of patients (carriers) did not exhibit the Brody disease phenotype
    explanation: Family histories support unaffected carriers, although carrier phenotyping was not systematically collected.
treatments:
- name: Trigger-Free Anaesthesia and Perioperative Monitoring
  description: Plan anesthesia with specialist precautions because of reported anesthesia-associated rigidity, rhabdomyolysis and MH-like reactions. The cohort recommends avoiding succinylcholine and inhalational agents and monitoring vital signs including core temperature. This management recommendation does not establish a quantified risk of classic malignant hyperthermia or prove a reduction in mortality.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure

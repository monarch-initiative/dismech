      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: pathological muscles are characterized by a broad distribution of mitochondrial markers in all fiber types, not related to intrinsic features of double muscle phenotype and by an increased expression of sarcolemmal calcium extrusion pump.
      explanation: One affected calf shows altered protein-marker expression; increased calcium flux and a causal rescue of severity were not directly demonstrated.
    - &id007
      reference: PMID:25614869
      reference_title: Exome analysis identifies Brody myopathy in a family diagnosed with malignant hyperthermia susceptibility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: Analyses of affected muscles showed the absence of SERCA1, but SERCA2 upregulation in slow and fast myofibers, suggesting a compensatory mechanism that partially restores the diminished Ca(2+) transport in Brody myopathy.
      explanation: In one index-patient biopsy, increased SERCA2 abundance and ectopic staining support a candidate adaptation; restoration of flux was inferred.

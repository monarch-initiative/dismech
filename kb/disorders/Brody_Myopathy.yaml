    quote_role: REVIEW_SYNTHESIS
    snippet: avoid administration of succinylcholine and inhalational agents, and monitor vital functions including core temperature
    explanation: The cohort recommends perioperative precautions despite uncertainty about classic MH susceptibility.
- name: Symptomatic Pharmacotherapy
  description: Symptomatic drugs often provide limited benefit or unacceptable adverse effects. In the 2020 cohort, mexiletine improved symptoms in one of two exposed patients but was stopped because of side effects; carbamazepine, ibuprofen, nifedipine and other tried agents did not provide sustained benefit. Drug selection and monitoring require individual clinical assessment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

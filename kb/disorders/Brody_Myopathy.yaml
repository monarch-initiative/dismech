    snippet: the Tq206−/− embryos treated with C17 (orange color) did not exhibit any significant differences after treatment, neither in terms of body length (Figure 5A) or tail curvature angles (Figure 5B).
    explanation: The S766F homozygous zebrafish model did not show morphological rescue; locomotor rescue was also not significant.
  - reference: PMID:41206505

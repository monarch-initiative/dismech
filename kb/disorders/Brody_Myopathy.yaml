- name: Delayed muscle relaxation
  category: Neuromuscular
  description: Delayed relaxation after repeated or sustained voluntary contractions is the characteristic examination sign. It can involve the eyelids as well as limb muscles. Clinical relaxation delay does not imply electrical myotonia, and a routine EMG may fail to elicit silent contractures.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Delayed relaxation following repetitive contractions or sustained contraction was observed in 22/33 and 27/34 patients, respectively.
    explanation: Separate tested denominators support the two examination maneuvers.
  frequency: VERY_FREQUENT
- name: Malignant hyperthermia-like episodes
  category: Anaesthetic
  description: The cohort abstract groups four patients under MH-like events, but the full text distinguishes two anesthesia-associated reactions, an exertional rhabdomyolysis case and unexplained hyperthermia. These observations do not establish a 10% risk of classic malignant hyperthermia or an anesthesia-event rate. Positive contracture tests can reflect abnormal calcium handling without proving classic MH susceptibility.
  evidence:

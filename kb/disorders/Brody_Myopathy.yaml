- name: Prolonged Cytosolic Calcium Elevation
  biological_scale: CELLULAR
  description: Prolonged cytosolic calcium elevation sustains activation of the contractile machinery after the electrical stimulus has ended. Calcium-transient prolongation is directly observed in mutant zebrafish; this supports the human relaxation mechanism without proving that every clinical complication has the same immediate cause.
  evidence:
  - *id004
  - reference: PMID:25614869
    reference_title: Exome analysis identifies Brody myopathy in a family diagnosed with malignant hyperthermia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: The “off” signal, that induces muscle relaxation, is the pumping of Ca2+ from the myoplasm back into the SR
    explanation: Physiological background explains how impaired reuptake delays relaxation.
  biological_processes:
  - preferred_term: intracellular calcium ion homeostasis
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: DYSREGULATED

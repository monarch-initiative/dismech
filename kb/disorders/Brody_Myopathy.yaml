      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: Atrophy of type II fibres was seen in 76% (13/17) of patients, of which two also demonstrated type I atrophy.
      explanation: Biopsy findings establish predominant, but not exclusive, type II involvement.
- name: Intrinsic SERCA1 Calcium-Transport Defect
  biological_scale: MOLECULAR
  description: The human p.Pro789Leu substitution markedly reduces calcium affinity and calcium transport in transfected HEK293 cells despite readily detectable expression. This route is distinct from premature degradation of an otherwise competent pump. Functional defects may coexist with reduced abundance in patient tissue.
  evidence:
  - *id003
  molecular_functions:
  - preferred_term: P-type calcium transporter activity
    term:
      id: GO:0005388
      label: P-type calcium transporter activity
    modifier: DECREASED
  downstream:
  - target: Impaired Calcium Reuptake into the Sarcoplasmic Reticulum
    description: Lower transport activity limits calcium reuptake even when mutant protein is present.
    causal_link_type: DIRECT
    evidence:
    - *id003
- name: Impaired Calcium Reuptake into the Sarcoplasmic Reticulum
  biological_scale: CELLULAR
  description: Impaired SERCA1-dependent transport slows return of contraction-associated calcium to the sarcoplasmic reticulum. Human muscle calcium-ATPase assays and mutant animal calcium imaging support this deficit. The assays do not establish normal calcium release or exclude all other secondary calcium-handling changes.
  evidence:
  - &id004
    reference: PMID:15469975
    reference_title: "accordion, a zebrafish behavioral mutant, has a muscle relaxation defect due to a mutation in the ATPase Ca2+ pump SERCA1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: In vivo imaging of muscle Ca2+ transients revealed that cytosolic Ca2+ decay was significantly slower in acc muscle.
    explanation: Direct calcium imaging in an atp2a1 zebrafish mutant supports impaired post-contraction clearance.
  - reference: PMID:41938373
    reference_title: Sarco/endoplasmatic reticulum calcium ATPase activity in healthy muscle and Brody disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: We were able to provide new reference values and demonstrate marked decreased SERCA activity in Brody disease muscle samples
    explanation: An optimized compound calcium-ATPase assay found low activity in four genetically confirmed patients.
  biological_processes:
  - preferred_term: calcium ion import into sarcoplasmic reticulum
    term:
      id: GO:1990036
      label: calcium ion import into sarcoplasmic reticulum
    modifier: DECREASED
  downstream:
  - target: Prolonged Cytosolic Calcium Elevation
    description: Slower calcium removal prolongs the post-contraction cytosolic transient.
    causal_link_type: DIRECT
    evidence:
    - *id004
  - target: Compensatory Calcium Extrusion and Handling
    description: Alternative calcium-handling responses may compensate for the primary deficit; the contribution varies between models and patients.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

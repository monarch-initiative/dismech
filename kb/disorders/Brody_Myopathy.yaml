    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
    modifier: INCREASED
mechanistic_hypotheses:
- hypothesis_group_id: pmca_extrusion_compensation
  hypothesis_label: Alternative calcium extrusion contributes to compensation
  status: EMERGING
  description: Increased sarcolemmal calcium-pump expression and altered mitochondrial-marker distribution in one affected calf support alternative calcium handling as a candidate adaptation. Protein abundance does not directly measure flux or demonstrate rescue. This mechanism can coexist with SERCA2 adaptation.
  evidence:
  - *id006
  notes: Direct human functional confirmation remains lacking in the cited studies.
- hypothesis_group_id: serca2_isoform_compensation
  hypothesis_label: SERCA2 upregulation contributes to compensation in some patients
  status: EMERGING
  description: One human index-patient biopsy showed increased SERCA2 abundance and expression in fast as well as slow fibres. Most other biopsies did not show increased SERCA2. The evidence supports a possible patient-dependent response, not a universal mechanism or an independently refuted observation.
  evidence:
  - *id007
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The presence of the SERCA2 isoform was determined by immunohistochemistry in eight biopsies, with normal expression in seven patients and increased expression in one patient
    explanation: The cohort includes previously published cases and limits universality; it is not an independent failure to reproduce every original observation.
  - reference: PMID:26482047
    reference_title: Fast-twitch skeletal muscle fiber adaptation to SERCA1 deficiency in a Dutch Improved Red and White calf pseudomyotonia case.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: The reduced expression of SERCA1 is selective and not compensated by the SERCA2 isoform.
    explanation: The affected calf did not show SERCA2 compensation; this does not rule out human patient-specific adaptation.
phenotypes:
- name: Exercise-induced muscle stiffness
  category: Neuromuscular
  description: Reported in all 40 patients in the international cohort. Symptoms often begin during rapid or repetitive activity and affect lower limbs, upper limbs and eyelids. Cold worsened symptoms in 25/36 evaluated patients. Childhood onset is typical, but later onset and mild progression occur.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Exercise-induced muscle stiffness was reported in all patients
    explanation: Core finding in this selected 40-patient cohort.
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Almost all patients reported onset of symptoms in childhood (38/40).
    explanation: Supports typical childhood onset without excluding later onset.
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The majority of patients mentioned an increase of symptoms upon exposure to cold temperatures (25/36).
    explanation: Records an environmental symptom modifier, not a cause of disease.
  frequency: VERY_FREQUENT

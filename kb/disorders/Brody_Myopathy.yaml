name: Brody Myopathy
creation_date: "2026-08-16T00:00:00Z"
description: >-
  Brody myopathy is an autosomal recessive skeletal-muscle relaxation disorder caused by biallelic pathogenic
  ATP2A1 variants. Deficient SERCA1 abundance or calcium-transport function impairs calcium reuptake into the
  sarcoplasmic reticulum, particularly in fast-twitch muscle fibres. Exercise-induced stiffness and delayed
  relaxation usually begin in childhood, often affecting limbs and eyelids. Myotonic discharges are generally
  absent despite clinically evident contractures. Strength and bulk are usually preserved, but mild weakness,
  percussion myotonia and limited symptom progression are reported. Rhabdomyolysis and anesthesia-associated
  contractures warrant perioperative precautions; classic malignant hyperthermia susceptibility is not established
  for every patient. Experimental protein-rescue strategies apply to selected functionally competent mutant
  pumps and have not established clinical efficacy in humans.
category: Mendelian
disease_term:
  preferred_term: Brody Myopathy
  term:
    id: MONDO:0010977
    label: Brody myopathy
synonyms:
- Brody disease
- SERCA1 deficiency
- ATP2A1-related myopathy
- Sarcoplasmic reticulum calcium ATPase deficiency
notes: >-
  This entry covers ATP2A1-related Brody disease. The historically defined Brody syndrome describes a similar
  clinical and biochemical phenotype without identified ATP2A1 variants and is retained as a differential diagnosis.
  Clinical proportions below describe selected cohorts with variable denominators, not population frequencies.
  The 2020 international cohort included 40 patients from 28 families, with retrospective follow-up in a subset;
  childhood presentations are further characterized in a 2024 series of nine children. No reproducible genotype–phenotype
  severity correlation or disease-modifying treatment is established.
pathophysiology:
- name: Biallelic ATP2A1 Loss of Function
  biological_scale: MOLECULAR
  description: Biallelic pathogenic variants reduce SERCA1 abundance, stability or intrinsic calcium-transport function. Truncating alleles, exon/gene deletions, splice changes, in-frame deletions and missense substitutions are reported. Mechanisms overlap and cannot be assigned solely from variant class; for example, a splice variant causes an in-frame exon skip.
  evidence:
  - &id008
    reference: PMID:8841193
    reference_title: "Mutations in the gene-encoding SERCA1, the fast-twitch skeletal muscle sarcoplasmic reticulum Ca2+ ATPase, are associated with Brody disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: We have now associated Brody disease with the autosomal recessive inheritance of three ATP2A1 mutations in two families
    explanation: Founding human genetic evidence establishes recessive ATP2A1 causation.
  - reference: PMID:37332993
    reference_title: "Case report: Clinical and molecular characterization of two siblings affected by Brody myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: we observed the skipping of the whole Exon 4
    explanation: Blood RNA analysis supports the splice effect of c.324+1G>A; the resulting transcript preserves the reading frame.

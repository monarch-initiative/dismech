name: Brody Myopathy
creation_date: "2026-08-16T00:00:00Z"
description: >-
  Brody myopathy (Brody disease) is an autosomal recessive disorder of skeletal
  muscle relaxation caused by biallelic loss-of-function variants in ATP2A1,
  which encodes SERCA1, the sarcoplasmic reticulum calcium pump of fast-twitch
  fibres. SERCA1 is not an accessory to relaxation; in type II fibres it is
  essentially the whole of the relaxation machinery, clearing cytosolic calcium
  back into the sarcoplasmic reticulum after each contraction. When it is
  missing, calcium lingers in the cytosol, troponin C stays saturated, and
  cross-bridges keep cycling, so the muscle contracts normally but cannot let
  go. The result is exercise-induced stiffness of the limbs and eyelids that
  builds during activity and eases with rest, worsens in the cold, and is
  accompanied by delayed relaxation after repeated contraction.

  The defining diagnostic feature follows directly from the mechanism. Because
  the fault is downstream of the sarcolemma, the contracture is electrically
  silent: needle EMG records nothing while the muscle is stiff. That silence is
  what separates Brody myopathy from the myotonias it is mistaken for, and
  myotonia, percussion myotonia, and myotonic discharges are all curated
  exclusions in this disease rather than merely absent findings.

  Two features make the entry mechanistically interesting beyond the core chain.
  First, the disease is far milder than it should be: mice lacking SERCA1 die at
  birth of diaphragm failure, while humans with essentially absent SERCA1 have a
  mild, non-progressive myopathy, an athletic build, and no respiratory
  involvement at all. Something compensates, and what that something is remains
  genuinely unsettled, with the two leading candidates recorded here as competing
  hypotheses rather than a single chain. Second, a subset of missense alleles
  produce a pump that folds badly but still works, and is destroyed by the
  ubiquitin-proteasome system before it ever reaches the sarcoplasmic reticulum
  membrane. Those alleles are in principle rescuable by stabilising the protein
  through quality control, which is the basis of the CFTR-corrector strategy now
  being tested in cattle.
category: Mendelian
disease_term:
  preferred_term: Brody Myopathy
  term:
    id: MONDO:0010977
    label: Brody myopathy
synonyms:
- Brody disease
- SERCA1 deficiency
- ATP2A1-related myopathy
- Sarcoplasmic reticulum calcium ATPase deficiency
notes: >-
  Scope. This entry curates Brody DISEASE, meaning reduced SERCA activity
  together with identified biallelic ATP2A1 variants. The literature separates
  this from Brody SYNDROME, a clinically and biochemically similar picture in
  patients without ATP2A1 variants, which remains genetically unsolved and in
  which myalgia and daily-life impact are reported more often. MONDO folds
  "Brody disease" into MONDO:0010977 as a synonym and provides no separate term
  for the gene-negative group, so the distinction is recorded here and in
  differential_diagnoses rather than as a second disease term or a subtype.

  Frequencies quoted in this entry come from a single international cohort of 40
  patients and one cross-sectional study of 17, not from a population. There is
  no registry, no natural-history study with structured longitudinal data, and no
  EHR-derived cohort. Percentages should be read as cohort proportions.

  Not curated here: a quantitative SERCA-activity reference interval that the
  source deep-research report attributed to PMID:41938373, and a Chianina
  founder-variant citation attributed to PMID:18786632. Neither identifier
  resolves to a record, and both were flagged as probable confabulations by the
  report's own reference validation. The underlying claims may well be true, but
  they are not curated on citations that do not exist.
pathophysiology:
- name: Biallelic ATP2A1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Recessive loss-of-function variants on both ATP2A1 alleles. Two mechanistic
    routes converge on the same deficit: truncating, splice, and deletion alleles
    yield little or no SERCA1 protein, while a subset of missense alleles yield a
    protein that folds badly but retains catalytic activity. The distinction is
    not academic, because only the second group is addressable by strategies that
    stabilise the protein through quality control.
  molecular_functions:
  - preferred_term: SERCA1 P-type calcium transporter activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005388
      label: P-type calcium transporter activity
  evidence:
  - reference: PMID:8841193
    reference_title: Mutations in the gene-encoding SERCA1, the fast-twitch skeletal muscle sarcoplasmic reticulum Ca2+ ATPase, are associated with Brody disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "how have these Brody patients partially compensated for the functional knockout"
    explanation: >-
      The paper that established ATP2A1 as the causal gene, quoted here at the
      point where it frames the functional knockout of SERCA1 in patients.
  downstream:
  - target: Proteasomal Degradation of Misfolded SERCA1
    causal_link_type: DIRECT
    description: >-
      The missense route specifically. A protein that misfolds is recognised and
      destroyed rather than trafficked.
  - target: Reduced SERCA1 Density at the Sarcoplasmic Reticulum Membrane
    causal_link_type: DIRECT
    description: >-
      The truncating, splice, and deletion route, where little or no protein is
      made in the first place.
- name: Proteasomal Degradation of Misfolded SERCA1
  biological_scale: MOLECULAR
  description: >-
    For missense alleles, the mutant pump is corrupted in folding but not in
    catalysis. The ubiquitin-proteasome system recognises the misfolded protein
    and strips it out before it reaches the sarcoplasmic reticulum membrane, so
    the fibre loses a pump that would have worked had it arrived. Proteasome
    inhibition restores both the expression level and the membrane localisation
    of the mutant, and the rescued protein handles calcium like wild type. This
    node is the therapeutic vulnerability behind the corrector strategy.
  biological_processes:
  - preferred_term: proteasome-mediated degradation of misfolded SERCA1
    modifier: INCREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence:
  - reference: PMID:25288803
    reference_title: Inhibition of ubiquitin proteasome system rescues the defective sarco(endo)plasmic reticulum Ca2+-ATPase (SERCA1) protein causing Chianina cattle pseudomyotonia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the mutation generates a protein most likely corrupted in proper folding but not in catalytic activity"
    explanation: >-
      States the folding-versus-catalysis distinction that defines this node.
      Tagged MODEL_ORGANISM because the publication studies Chianina cattle
      pseudomyotonia together with a heterologous cell model, not human patients.
  - reference: PMID:25288803
    reference_title: Inhibition of ubiquitin proteasome system rescues the defective sarco(endo)plasmic reticulum Ca2+-ATPase (SERCA1) protein causing Chianina cattle pseudomyotonia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The treatment with MG132, an inhibitor of ubiquitin proteasome system, rescues the expression level and membrane localization of the SERCA1 mutant in a heterologous cellular model."
    explanation: >-
      Demonstrates that blocking the degradation restores both abundance and
      correct localisation, which is what makes this node druggable in principle.
  downstream:
  - target: Reduced SERCA1 Density at the Sarcoplasmic Reticulum Membrane
    causal_link_type: DIRECT
    description: >-
      Degradation before trafficking is completed produces the same end state as
      failure to synthesise the protein: too few pumps in the membrane.
- name: Reduced SERCA1 Density at the Sarcoplasmic Reticulum Membrane
  biological_scale: MOLECULAR
  description: >-
    The convergence point of both allelic routes. Fewer functional calcium pumps
    sit in the sarcoplasmic reticulum membrane of fast-twitch fibres, so the
    tissue's total calcium-ATPase activity falls. The reduction is selective for
    SERCA1 rather than a general loss of sarcoplasmic reticulum protein.
  cellular_components:
  - preferred_term: sarcoplasmic reticulum membrane
    term:
      id: GO:0033017
      label: sarcoplasmic reticulum membrane
  molecular_functions:
  - preferred_term: sarcoplasmic reticulum calcium ATPase activity
    modifier: DECREASED
    term:
      id: GO:0005388
      label: P-type calcium transporter activity
  evidence:
  - reference: PMID:26482047
    reference_title: Fast-twitch skeletal muscle fiber adaptation to SERCA1 deficiency in a Dutch Improved Red and White calf pseudomyotonia case.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The reduced expression of SERCA1 is selective and not compensated by the SERCA2 isoform."
    explanation: >-
      Establishes that the protein loss is selective for SERCA1. The second half
      of the sentence is also the evidence against isoform compensation and is
      used again on that hypothesis.
  - reference: PMID:20142766
    reference_title: "Brody disease: insights into biochemical features of SERCA1 and identification of a novel mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrastructural examination revealed dilatation of lateral cisternae and proliferation of tubular elements of the sarcoplasmic reticulum."
    explanation: >-
      Human biopsy ultrastructure showing that the sarcoplasmic reticulum itself
      is structurally remodelled where the pump is deficient.
  downstream:
  - target: Impaired Calcium Reuptake into the Sarcoplasmic Reticulum
    causal_link_type: DIRECT
    description: >-
      Fewer pumps means less calcium moved per unit time back into the store.
- name: Impaired Calcium Reuptake into the Sarcoplasmic Reticulum
  biological_scale: CELLULAR
  description: >-
    The functional consequence of pump loss. Calcium released to trigger
    contraction is cleared from the cytosol too slowly, because in fast-twitch
    fibres SERCA1 is the dominant route by which that clearance happens. Calcium
    release itself is intact; it is only the return leg of the cycle that fails.
  biological_processes:
  - preferred_term: calcium ion import into sarcoplasmic reticulum
    modifier: DECREASED
    term:
      id: GO:1990036
      label: calcium ion import into sarcoplasmic reticulum
  evidence:
  - reference: PMID:15469975
    reference_title: accordion, a zebrafish behavioral mutant, has a muscle relaxation defect due to a mutation in the ATPase Ca2+ pump SERCA1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "cytosolic Ca2+ decay was significantly slower in acc muscle"
    explanation: >-
      Direct in vivo imaging of the slowed calcium transient in the zebrafish
      SERCA1 mutant, which is the measurement this node asserts.
  downstream:
  - target: Prolonged Cytosolic Calcium Elevation
    causal_link_type: DIRECT
    description: >-
      Slower removal leaves calcium in the cytosol for longer after each
      contraction.
  - target: Compensatory Calcium Extrusion and Handling
    causal_link_type: DIRECT
    description: >-
      The same rise in cytosolic calcium that causes the disease also recruits
      alternative removal mechanisms, which is the branch that appears to make
      the human disease survivable.
- name: Prolonged Cytosolic Calcium Elevation
  biological_scale: CELLULAR
  description: >-
    Cytosolic free calcium stays elevated after each contraction instead of
    falling promptly. This is the proximate cause of every downstream feature,
    and it is also the point of contact with malignant hyperthermia, which
    arrives at the same elevated myoplasmic calcium by a different route.
  biological_processes:
  - preferred_term: intracellular calcium ion homeostasis
    modifier: DECREASED
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
  evidence:
  - reference: PMID:25614869
    reference_title: Exome analysis identifies Brody myopathy in a family diagnosed with malignant hyperthermia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a feature common to both conditions is elevated myoplasmic Ca(2+) content"
    explanation: >-
      Names the elevated myoplasmic calcium shared by Brody myopathy and
      malignant hyperthermia, which is why this node carries the anaesthetic
      hazard downstream.
  downstream:
  - target: Electrically Silent Muscle Contracture
    causal_link_type: DIRECT
    description: >-
      Sustained calcium keeps troponin C saturated and cross-bridges cycling.
  - target: Malignant hyperthermia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Susceptibility to malignant-hyperthermia-like episodes on exposure to
      triggering anaesthetic agents, reached through the shared myoplasmic
      calcium overload rather than through a ryanodine receptor defect.
- name: Electrically Silent Muscle Contracture
  biological_scale: TISSUE
  description: >-
    Involuntary sustained contraction following voluntary contraction, occurring
    without any electrical activity on needle EMG. The silence is the
    mechanistically important part: the fault lies downstream of the sarcolemma,
    in the calcium-handling machinery, so the membrane is not misbehaving and
    there is nothing for the electrode to record. Every myotonic disorder on the
    differential generates electrical discharges; this one does not.
  biological_processes:
  - preferred_term: relaxation of muscle
    modifier: DECREASED
    term:
      id: GO:0090075
      label: relaxation of muscle
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EMG can reveal silent contractures defined as prolonged involuntary muscle contractions (following voluntary phasic contractions) without electrical activity detected on EMG"
    explanation: >-
      Defines the silent contracture explicitly, including that it follows
      voluntary contraction and produces no electrical activity.
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EMG is characterized by the presence of silent contractures and absence of myotonic discharges."
    explanation: >-
      States both halves of the discriminator in one sentence: contractures are
      present, myotonic discharges are absent.
  downstream:
  - target: Exercise-induced muscle stiffness
    causal_link_type: DIRECT
    description: >-
      The contracture experienced clinically as stiffness that builds with
      activity.
  - target: Delayed muscle relaxation
    causal_link_type: DIRECT
    description: >-
      The examination finding, elicited by repetitive contraction.
- name: Selective Type II Fibre Involvement
  biological_scale: TISSUE
  description: >-
    SERCA1 is the fast-twitch isoform; slow fibres run SERCA2a from a different
    gene and are therefore spared. This single fact explains the distribution of
    the disease: the muscles that stiffen are fast-twitch-rich, which is why
    eyelid closure through orbicularis oculi is affected in roughly two thirds of
    patients while cardiac muscle, running SERCA2a, is entirely uninvolved. The
    biopsy correlate is selective type II fibre atrophy without myonecrosis.
  cell_types:
  - preferred_term: type II skeletal muscle fibre
    term:
      id: CL:0002212
      label: type II muscle cell
  evidence:
  - reference: PMID:25614869
    reference_title: Exome analysis identifies Brody myopathy in a family diagnosed with malignant hyperthermia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "encoding the sarco(endo)plasmic reticulum Ca(2+) ATPase type 1 (SERCA1), a calcium pump, expressed in fast-twitch muscles"
    explanation: >-
      States the fast-twitch restriction of SERCA1 expression that produces the
      fibre-type selectivity of the disease.
  downstream:
  - target: Exercise-induced muscle stiffness
    causal_link_type: DIRECT
    description: >-
      Restricting the deficit to fast-twitch fibres is what makes the stiffness
      exertional and distributed as it is.
- name: Compensatory Calcium Extrusion and Handling
  biological_scale: CELLULAR
  description: >-
    Alternative calcium-removal mechanisms recruited in the face of SERCA1
    deficiency, which appear to be why the human disease is mild rather than
    lethal. Candidate contributors include the sarcolemmal calcium extrusion pump
    (PMCA), the sodium-calcium exchanger, mitochondrial uptake, and upregulation
    of the SERCA2 isoform. Which of these actually carries the load in human
    muscle is unresolved, and the two leading candidates are recorded as
    competing hypotheses rather than as a settled chain. The branch is included
    in the pathograph because it is load-bearing for prognosis: without it, the
    expectation from the mouse null would be neonatal death.
  biological_processes:
  - preferred_term: calcium ion transmembrane transport
    modifier: INCREASED
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
  evidence:
  - reference: PMID:26482047
    reference_title: Fast-twitch skeletal muscle fiber adaptation to SERCA1 deficiency in a Dutch Improved Red and White calf pseudomyotonia case.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Calcium removal mechanisms, operating in muscle fibers as compensatory response aimed at lowering excessive cytoplasmic calcium concentration caused by SERCA1 deficiency, could explain the difference in severity of clinical signs."
    explanation: >-
      States the compensation principle and links it explicitly to severity,
      which is the reason this branch is modelled rather than left as prose. The
      authors frame it as a candidate explanation rather than a demonstrated one.
mechanistic_hypotheses:
- hypothesis_group_id: pmca_extrusion_compensation
  hypothesis_label: Sarcolemmal calcium extrusion compensates for SERCA1 loss
  status: EMERGING
  description: >-
    Holds that the calcium load left by the missing sarcoplasmic reticulum pump
    is handled principally by exporting calcium across the sarcolemma, via the
    plasma-membrane calcium ATPase and related extrusion mechanisms, rather than
    by an alternative sarcoplasmic reticulum pump. The bovine work supports this
    directly, reporting increased sarcolemmal extrusion pump expression in the
    same muscle in which SERCA2 compensation was excluded.
  evidence:
  - reference: PMID:26482047
    reference_title: Fast-twitch skeletal muscle fiber adaptation to SERCA1 deficiency in a Dutch Improved Red and White calf pseudomyotonia case.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "an increased expression of sarcolemmal calcium extrusion pump"
    explanation: >-
      The positive finding for this hypothesis, reported in the same animal in
      which SERCA2 compensation was not observed.
  notes: >-
    EMERGING rather than CANONICAL because the direct evidence is bovine and from
    a single case, and because no human muscle study has measured extrusion-pump
    activity in Brody myopathy.
- hypothesis_group_id: serca2_isoform_compensation
  hypothesis_label: SERCA2 isoform upregulation compensates for SERCA1 loss
  status: ALTERNATIVE
  description: >-
    Holds that the SERCA2 isoform is upregulated, including ectopically in type
    II fibres, and takes over part of the calcium reuptake that SERCA1 can no
    longer perform. This was the first proposed explanation for the mildness of
    the human disease and rests on a single family in which muscle showed absent
    SERCA1 with elevated SERCA2. It is recorded as ALTERNATIVE rather than
    discarded because that observation is real, but the larger cohort and the
    bovine work both failed to reproduce it.
  evidence:
  - reference: PMID:25614869
    reference_title: Exome analysis identifies Brody myopathy in a family diagnosed with malignant hyperthermia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analyses of affected muscles showed the absence of SERCA1, but SERCA2 upregulation in slow and fast myofibers, suggesting a compensatory mechanism that partially restores the diminished Ca(2+) transport in Brody myopathy."
    explanation: >-
      The originating observation, in human muscle, which is the whole positive
      case for this hypothesis.
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "SERCA2 staining was normal in all samples."
    explanation: >-
      The international cohort found no SERCA2 upregulation in its own biopsies,
      directly contradicting the hypothesis in human muscle.
  - reference: PMID:26482047
    reference_title: Fast-twitch skeletal muscle fiber adaptation to SERCA1 deficiency in a Dutch Improved Red and White calf pseudomyotonia case.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "The reduced expression of SERCA1 is selective and not compensated by the SERCA2 isoform."
    explanation: >-
      Independent contradiction from the bovine model, in which the same question
      was asked and answered negatively.
  notes: >-
    The conflict is not resolvable from the published record. The supporting and
    refuting studies used immunohistochemistry on different patients, and the
    cohort separately reports that of eight biopsies examined, seven showed
    normal SERCA2 expression and one showed increased expression, so the positive
    finding may be real but uncommon rather than wrong.
phenotypes:
- name: Exercise-induced muscle stiffness
  category: Neuromuscular
  description: >-
    The cardinal feature, present in every patient in the international cohort.
    Stiffness builds during exertion and eases within minutes of rest, involves
    the limbs almost universally and the eyelids in roughly two thirds, and is
    worsened by cold.
  phenotype_term:
    preferred_term: Exercise-induced muscle stiffness
    term:
      id: HP:0008967
      label: Exercise-induced muscle stiffness
    onset:
      onset_category: CHILDHOOD
      notes: >-
        Onset is in childhood in the large majority. Recorded as a descriptor
        qualifier rather than as a separate phenotype, since HPO onset terms sit
        outside the phenotypic-abnormality branch the PhenotypeTerm enum draws
        from.
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This observational study shows that the main feature of Brody disease is an exercise-induced muscle stiffness of the limbs, and often of the eyelids."
    explanation: >-
      Names this as the main feature and gives the limb and eyelid distribution.
      The VERY_FREQUENT band reflects the cohort, in which limb stiffness was
      present in all 40 patients.
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Onset begins in childhood and there was no or only mild progression of symptoms over time."
    explanation: >-
      Supports the childhood onset recorded on this descriptor, and the absence of
      meaningful progression thereafter, which together are the prognostic core of
      the disease.
- name: Delayed muscle relaxation
  category: Neuromuscular
  description: >-
    The key examination finding, elicited by asking the patient to contract
    repeatedly and observing that each relaxation takes longer than the last.
    Deliberately left without an ontology binding. HPO has no term for delayed
    relaxation as a sign; the nearest candidates are Muscle stiffness, which
    duplicates the exertional stiffness phenotype already recorded here, and
    Myotonia, which is a curated exclusion in this disease. Binding this sign to
    a myotonia term would encode precisely the misdiagnosis that the electrically
    silent contracture exists to rule out, so the phenotype is carried as free
    text until a suitable term exists.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The key finding at physical examination was delayed relaxation after repetitive contractions."
    explanation: >-
      Identifies delayed relaxation after repetitive contraction as the key
      physical sign.
- name: Malignant hyperthermia
  category: Anaesthetic
  description: >-
    Episodes resembling malignant hyperthermia occurred in four of forty patients
    in the international cohort. The link is the shared elevation of myoplasmic
    calcium rather than a ryanodine receptor defect, and it is the single most
    actionable fact in the entry because it changes anaesthetic management.
  phenotype_term:
    preferred_term: Malignant hyperthermia
    term:
      id: HP:0002047
      label: Malignant hyperthermia
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients had episodes resembling malignant hyperthermia."
    explanation: >-
      Four of forty is 10 per cent, which falls in the OCCASIONAL band of 5 to 29
      per cent.
- name: Preserved muscle strength without atrophy
  category: Neuromuscular
  description: >-
    A curated negative, and diagnostically load-bearing. Despite lifelong
    symptoms, patients do not lose bulk or strength, and some are conspicuously
    athletic in build. Reported weakness in about a third of patients is
    generally misperceived stiffness rather than true weakness.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no atrophy was seen, muscle strength was generally preserved, and some patients had a remarkable athletic build"
    explanation: >-
      States the absence of atrophy, the preservation of strength, and the
      athletic build in one sentence.
- name: Absence of myotonia and myotonic discharges
  category: Neuromuscular
  description: >-
    Curated exclusion. Myotonic discharges are absent on EMG, and that absence
    beside a silent contracture is what distinguishes Brody myopathy from the
    myotonic disorders it is routinely mistaken for. This is a negative finding
    with positive diagnostic value, and the cohort turns it into an explicit
    diagnostic step rather than leaving it as a description.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, when EMG shows no myotonic discharges in patients clinically suspected of having a myotonic disorder, provocation of possible silent contractures is recommended by performing rapid contractions during EMG."
    explanation: >-
      Turns the absence of myotonic discharges into an actionable diagnostic
      step, which is the reason the exclusion is curated rather than omitted.
- name: Elevated circulating creatine kinase concentration
  category: Laboratory
  description: >-
    Creatine kinase is normal or only mildly elevated. The modest scale of the
    elevation is itself informative, since it is consistent with the near-absence
    of myonecrosis in this disease and argues against the necrotising myopathies
    on the differential.
  phenotype_term:
    preferred_term: Elevated circulating creatine kinase concentration
    term:
      id: HP:0003236
      label: Elevated circulating creatine kinase concentration
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Creatine kinase was normal or mildly elevated"
    explanation: >-
      Records that creatine kinase is normal or only mildly raised, which is the
      claim this phenotype makes.
- name: Myalgia
  category: Neuromuscular
  description: >-
    Muscle pain, reported by a majority of patients in the international cohort and
    often worsened by cold exposure alongside the stiffness.
  phenotype_term:
    preferred_term: Myalgia
    term:
      id: HP:0003326
      label: Myalgia
  frequency: FREQUENT
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, myalgia and muscle cramps are described, which may worsen upon exposure to cold temperatures"
    explanation: >-
      Names myalgia among the reported features and records the cold sensitivity
      that accompanies it. The FREQUENT band reflects the cohort proportion of
      20/34.
- name: Exercise-induced muscle cramps
  category: Neuromuscular
  description: >-
    Involuntary painful sustained contractures at rest or during exercise, reported
    by roughly half the cohort. Note the cohort defines cramps in terms of
    sustained contracture, which is the same physical event as the disease's core
    lesion rather than an unrelated symptom.
  phenotype_term:
    preferred_term: Exercise-induced muscle cramps
    term:
      id: HP:0003710
      label: Exercise-induced muscle cramps
  frequency: FREQUENT
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients variably reported muscle cramps (defined as involuntary and painful sustained muscle contractures) at rest or during exercise (18/34)."
    explanation: >-
      Gives the cohort proportion, 18 of 34, which falls in the FREQUENT band, and
      the authors' definition of cramps as sustained contracture.
genetic:
- name: ATP2A1
  gene_term:
    preferred_term: ATP2A1
    term:
      id: hgnc:811
      label: ATP2A1
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    Encodes SERCA1, the sarcoplasmic reticulum calcium ATPase of fast-twitch
    skeletal muscle. Biallelic loss-of-function variants cause the disease.
    Missense alleles that impair folding while preserving catalytic activity form
    a therapeutically distinct group, since only that group can be rescued by
    stabilising the protein through quality control; nonsense, frameshift,
    splice, and deletion alleles cannot be.
  evidence:
  - reference: PMID:8841193
    reference_title: Mutations in the gene-encoding SERCA1, the fast-twitch skeletal muscle sarcoplasmic reticulum Ca2+ ATPase, are associated with Brody disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "how have these Brody patients partially compensated for the functional knockout"
    explanation: >-
      The study that associated SERCA1 mutations with Brody disease, quoted at
      its statement of the functional knockout in patients.
biochemical:
- name: Sarcoplasmic reticulum calcium ATPase activity
  notes: >-
    SERCA activity measured in muscle homogenate is reduced, and western blot shows
    decreased or absent SERCA1 protein. Together these are the confirmatory
    functional assays of the disease, and their real value is in adjudicating novel
    variants: a previously unreported ATP2A1 change is supported as pathogenic when
    activity and protein are shown to be reduced. Recorded qualitatively only. A
    numeric reference interval circulating for this assay traces to an identifier
    that does not resolve, and no reference_ranges block is curated on that basis.
  presence: DECREASED
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sarcoplasmic/endoplasmic reticulum Ca2+ ATPase (SERCA) activity was reduced and western blot analysis showed decreased or absent SERCA1 protein."
    explanation: >-
      States both assay results in patients, which is exactly what this biomarker
      record asserts.
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SERCA activity measurement and SERCA1 western blot can assist in proving the pathogenicity of novel ATP2A1 mutations"
    explanation: >-
      Gives the assays their clinical purpose, which is variant adjudication rather
      than primary diagnosis.
histopathology:
- name: Selective type II fibre atrophy with increased fibre size variability
  description: >-
    Systematic re-evaluation of biopsies showed type II fibre atrophy, increased
    variability of fibre size, and increased internal nuclei. The findings are mild
    and non-specific taken individually; what makes them useful is the company they
    keep, in particular their appearance alongside preserved strength and an absence
    of necrosis.
  diagnostic: true
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Systematic re-evaluation of the biopsy reports showed fibre type II atrophy, increased fibre size variability, and an increased number of internal nuclei."
    explanation: >-
      Enumerates all three biopsy findings from a systematic re-review rather than
      from individual case impressions.
- name: Absence of myonecrosis
  description: >-
    A curated negative. Muscle necrosis is essentially absent, found in a single
    biopsy across the international cohort. This is consistent with the modest
    creatine kinase elevation and separates the disease from the necrotising
    myopathies: the muscle is failing to relax, not dying.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Discrete necrosis was found in only one biopsy (Patient L18)."
    explanation: >-
      One biopsy out of the whole cohort, which is what makes absence of necrosis a
      usable negative finding rather than merely an unremarked one.
diagnosis:
- name: Electromyography showing silent contractures without myotonic discharges
  description: >-
    The pivotal diagnostic observation, and the reason the disease is so often
    misdiagnosed. Needle EMG during the stiffness records nothing, because the fault
    lies downstream of the sarcolemma. The cohort turns this into an active
    manoeuvre rather than a passive finding: when a patient looks myotonic but shows
    no myotonic discharges, provoke contractures with rapid repeated contraction
    during the study instead of stopping at the negative result.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, when EMG shows no myotonic discharges in patients clinically suspected of having a myotonic disorder, provocation of possible silent contractures is recommended by performing rapid contractions during EMG."
    explanation: >-
      Converts the absence of myotonic discharges into a positive diagnostic step,
      which is what makes this a diagnostic recommendation rather than a
      description.
- name: ATP2A1 sequencing or myopathy gene panel
  description: >-
    Molecular confirmation, recommended once delayed relaxation is present on
    examination and myotonic discharges have been excluded electrophysiologically.
    The order matters: the clinical and electrophysiological findings select who
    should be sequenced.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we recommend direct sequencing of the ATP2A1 gene or next generation sequencing with a myopathy panel"
    explanation: >-
      The testing recommendation, quoted with the clinical preconditions that
      precede it in the same sentence.
- name: SERCA1 immunohistochemistry (inadequate in isolation)
  description: >-
    Recorded specifically as a false-negative trap rather than as a recommended
    test. Immunostaining for loss of SERCA1a protein is not adequate for diagnosis
    on its own, so a normal-appearing stain does not exclude the disease and should
    not stop the diagnostic sequence. This is curated because a negative
    immunostain is exactly the point at which a workup tends to be abandoned.
  evidence:
  - reference: PMID:10914677
    reference_title: "The mutation of Pro789 to Leu reduces the activity of the fast-twitch skeletal muscle sarco(endo)plasmic reticulum Ca2+ ATPase (SERCA1) and is associated with Brody disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "immunostaining of skeletal muscle to detect the loss of SERCA1a protein is not adequate for the diagnosis"
    explanation: >-
      States plainly that immunostaining alone is inadequate, which is the caution
      this record exists to carry.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic ATP2A1 variants are required. Heterozygous carriers are

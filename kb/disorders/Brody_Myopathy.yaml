  description: Muscle calcium-ATPase measurement and SERCA1 western blot can support interpretation of uncertain ATP2A1 variants. The 2026 optimized assay provides laboratory-specific quantitative data. Reduced compound activity is not a stand-alone proof of variant pathogenicity or Brody disease because other myopathies and assay contributors can alter it.

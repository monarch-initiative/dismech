- name: CFTR Correctors (Investigational)
  description: C17, C4 and C9 increase abundance of selected bovine SERCA1 mutants in heterologous cells. Local C17 injections in two affected calves increased SR-associated SERCA1 and calcium-ATPase activity; whole-animal functional recovery and systemic safety were not established. C17 failed to improve key morphological and locomotor outcomes in the S766F accordion zebrafish model, which has a different molecular defect. Lumacaftor and tezacaftor were relatively ineffective in the tested cell assay. Human therapeutic benefit remains unproven.

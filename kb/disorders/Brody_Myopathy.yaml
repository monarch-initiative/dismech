- name: Selective Type II Fibre Involvement
  biological_scale: TISSUE
  description: SERCA1 expression in fast-twitch fibres accounts for preferential involvement of type II skeletal muscle and vulnerability during rapid repetitive activity. Biopsy often shows type II atrophy with internal nuclei and fibre-size variability; occasional type I changes mean that slow fibres are not absolutely spared morphologically.
  evidence:
  - *id005
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Delayed muscle relaxation occurred especially after explosive, short and repetitive contractions, which is explained by the selective type II muscle fibre involvement.
    explanation: The clinical pattern is consistent with the physiological distribution of SERCA1.
  cell_types:
  - preferred_term: type II muscle cell
    term:
      id: CL:0002212
      label: type II muscle cell

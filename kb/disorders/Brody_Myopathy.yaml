  - target: Proteasomal Degradation of Misfolded SERCA1
    description: Selected missense variants increase proteasomal disposal of a catalytically competent pump.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - &id001
      reference: PMID:36293223
      reference_title: Differential Analysis of Gly211Val and Gly286Val Mutations Affecting Sarco(endo)plasmic Reticulum Ca(2+)-ATPase (SERCA1) in Congenital Pseudomyotonia Romagnola Cattle.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: After blocking the proteasome using a proteasome inhibitor, we found that the G211V mutant accumulates in cells at levels comparable to those of WT SERCA1.
      explanation: Proteasome inhibition rescues abundance of a bovine disease allele; this is not evidence that every human missense allele follows this mechanism.
  - target: Reduced SERCA1 Density at the Sarcoplasmic Reticulum Membrane
    description: Loss of expression or stability lowers pump abundance in patient muscle.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - &id002
      reference: PMID:32040565
      reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: All immunoblot analyses demonstrated absent or severely decreased amounts of SERCA protein.
      explanation: Human muscle analyses support reduced protein abundance in the tested patients; abundance and intrinsic function are distinct.
  - target: Intrinsic SERCA1 Calcium-Transport Defect
    description: Some substitutions directly impair calcium affinity and transport.
    causal_link_type: DIRECT
    evidence:
    - &id003
      reference: PMID:10914677
      reference_title: The mutation of Pro789 to Leu reduces the activity of the fast-twitch skeletal muscle sarco(endo)plasmic reticulum Ca2+ ATPase (SERCA1) and is associated with Brody disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: The Pro789 to Leu mutant was readily expressed in HEK-293 cells, but it demonstrated an almost complete loss of Ca2+ transport activity because of reduced Ca2+ affinity.
      explanation: The human disease-associated substitution impairs intrinsic transport despite expression in a heterologous assay.
- name: Proteasomal Degradation of Misfolded SERCA1
  biological_scale: MOLECULAR
  description: Bovine R164H and G211V SERCA1 variants are prematurely ubiquitinated and degraded despite retaining catalytic activity. Mutant protein can reach ER/SR membranes; the evidence supports accelerated disposal, not an obligatory block before membrane insertion. The extent to which this route applies to individual human variants requires functional testing.
  evidence:
  - *id001
  - reference: PMID:36293223
    reference_title: Differential Analysis of Gly211Val and Gly286Val Mutations Affecting Sarco(endo)plasmic Reticulum Ca(2+)-ATPase (SERCA1) in Congenital Pseudomyotonia Romagnola Cattle.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: Co-localization using anti calreticulin antibodies, a well-known ER marker, confirmed that SERCA1 mutants are correctly targeted to ER
    explanation: Microscopy argues against an absolute pre-membrane trafficking block.
  - reference: PMID:25288803
    reference_title: Inhibition of ubiquitin proteasome system rescues the defective sarco(endo)plasmic reticulum Ca2+-ATPase (SERCA1) protein causing Chianina cattle pseudomyotonia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: the mutation generates a protein most likely corrupted in proper folding but not in catalytic activity
    explanation: R164H experiments distinguish loss of abundance from loss of enzymatic competence.
  biological_processes:

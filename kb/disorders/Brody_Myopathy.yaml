treatments:
- name: Trigger-Free Anaesthesia and Malignant Hyperthermia Precautions
  description: >-
    The highest-value intervention in the disease, and the one that changes
    outcomes rather than symptoms. Patients are managed as
    malignant-hyperthermia-susceptible: volatile anaesthetics and succinylcholine
    are avoided in favour of a total intravenous technique, with core temperature
    monitoring. This follows from the shared myoplasmic calcium overload rather
    than from a ryanodine receptor defect.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Prolonged Cytosolic Calcium Elevation
    treatment_effect: MODULATES
    description: >-
      Avoidance rather than pharmacology: the measure prevents a trigger from
      compounding an existing calcium-handling deficit, rather than correcting
      the deficit itself.
    evidence:
    - reference: PMID:32040565
      reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "patients with Brody disease may be at risk for malignant hyperthermia-like episodes, and therefore appropriate perioperative measures are recommended"
      explanation: >-
        States both the risk and the recommendation for perioperative measures.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with Brody disease may be at risk for malignant hyperthermia-like episodes, and therefore appropriate perioperative measures are recommended"
    explanation: >-
      The recommendation as stated by the international cohort.
- name: Symptomatic Pharmacotherapy
  description: >-
    Calcium channel blockers, dantrolene, mexiletine, carbamazepine, and others
    have been tried. The honest summary from the largest cohort is that
    symptomatic treatment was mostly ineffective or produced unacceptable side
    effects, with only a small minority achieving durable control. Verapamil was
    the best performer in that cohort but still helped a minority.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptomatic treatment was mostly ineffective or produced unacceptable side effects."
    explanation: >-
      Refutes a general claim of symptomatic benefit. Recorded as REFUTE rather
      than omitted because a reader needs to know that the obvious drug options
      have been tried and largely failed.
- name: Dantrolene
  description: >-
    A ryanodine receptor inhibitor, mechanistically coherent here because it
    reduces calcium release into the cytosol, attacking the same overload from
    the opposite direction when reuptake cannot be restored. The evidence points
    both ways and is curated that way: dantrolene was ineffective or poorly
    tolerated in the cohort, while a single later case report describes clear
    benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dantrolene
      term:
        id: CHEBI:4317
        label: dantrolene
  target_mechanisms:
  - target: Prolonged Cytosolic Calcium Elevation
    treatment_effect: MODULATES
    description: >-
      Reduces ryanodine-receptor-mediated calcium release, lowering the cytosolic
      calcium load that the deficient pump cannot clear.
    evidence:
    - reference: PMID:41926432
      reference_title: "Rare Brody myopathy: A case report."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment with dantrolene sodium resulted in marked clinical improvement."
      explanation: >-
        PARTIAL because this is a single case, and because the largest cohort
        reports the opposite experience with the same drug.
  evidence:
  - reference: PMID:41926432
    reference_title: "Rare Brody myopathy: A case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with dantrolene sodium resulted in marked clinical improvement."
    explanation: >-
      A single reported responder. Graded PARTIAL rather than SUPPORT because one
      case cannot establish efficacy against a cohort reporting the drug as
      ineffective or poorly tolerated.
  notes: >-
    The contradiction between the cohort experience and this case report is left
    standing rather than resolved. Both are curated so that a reader meets the
    disagreement rather than one side of it.
- name: CFTR Correctors (Investigational)
  description: >-
    A repurposing strategy aimed at the folding defect rather than the symptoms.
    Small molecules developed to chaperone misfolded CFTR through quality control
    also rescue misfolded SERCA1, restoring pump abundance at the sarcoplasmic
    reticulum membrane. The corrector C17 was effective in vitro and in cattle,
    whereas the licensed cystic fibrosis correctors lumacaftor and tezacaftor
    were not efficient. This has not been tested in humans.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Proteasomal Degradation of Misfolded SERCA1
    treatment_effect: INHIBITS
    description: >-
      Stabilises the misfolded pump so that it escapes degradation and reaches
      the membrane, addressing the node rather than its consequences.
    evidence:
    - reference: PMID:41206505
      reference_title: "CFTR corrector C17 rescues defective SERCA1 in bovine pseudomyotonia: a potential therapy for Brody myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CFTR correctors, particularly C17, successfully rescue SERCA1 mutants both in vitro and in vivo models"
      explanation: >-
        Demonstrates rescue of the mutant pump. Tagged MODEL_ORGANISM because the
        in vivo work is in cattle.
  evidence:
  - reference: PMID:41206505
    reference_title: "CFTR corrector C17 rescues defective SERCA1 in bovine pseudomyotonia: a potential therapy for Brody myopathy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "may be a potential innovative pharmacological approach addressing Brody patients in which mutated SERCA1 retains its activity"
    explanation: >-
      PARTIAL because the authors themselves frame this as potential rather than
      established, and because the quoted sentence carries the decisive
      restriction: the approach can only help patients whose mutant pump retains
      catalytic activity.
  notes: >-
    The allele restriction is the most important qualifier on this approach and
    is easy to lose. Correctors can only rescue a protein that exists and works;
    they offer nothing to patients whose alleles are nonsense, frameshift,
    splice, or deletion variants producing no protein at all. Any future clinical
    application requires genotype stratification.
- name: Physical Therapy and Activity Pacing
  description: >-
    Warm-up strategies, activity pacing, and avoidance of cold during exertion.
    Used pragmatically. No trial evidence exists, and none is claimed here.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
- name: Genetic Counselling
  description: >-
    Autosomal recessive recurrence risk, cascade testing of relatives, and
    critically, communication of anaesthetic risk to family members who may carry
    the same genotype.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
animal_models:
- name: Bovine congenital pseudomyotonia (ATP2A1 missense, Chianina and Romagnola cattle)
  species: Cattle
  genotype: Biallelic ATP2A1 missense variants
  publication: PMID:23046865
  description: >-
    Naturally occurring ATP2A1 pseudomyotonia in beef cattle, presenting as
    exercise-induced impairment of muscle relaxation. It is the only mammalian
    model of the disease, since the mouse null is not viable, and it carries most
    of the translational work including the corrector strategy.
  modeled_mechanisms:
  - target: Proteasomal Degradation of Misfolded SERCA1
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The bovine missense alleles reproduce the folding-competent, catalytically
      intact pump that is destroyed before reaching the membrane, and this is the
      system in which both proteasome inhibition and corrector rescue were
      demonstrated.
    limitations: >-
      The specific alleles are bovine founder variants rather than human ones, and
      the rescue experiments were performed partly in heterologous cells rather
      than in mature muscle.
    evidence:
    - reference: PMID:41206505
      reference_title: "CFTR corrector C17 rescues defective SERCA1 in bovine pseudomyotonia: a potential therapy for Brody myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Bovine PMT, despite unconventional, is currently the unique mammalian model of Brody disease"
      explanation: >-
        States the standing of this model, which is what justifies treating
        bovine results as informative for the human node.
  evidence:
  - reference: PMID:41206505
    reference_title: "CFTR corrector C17 rescues defective SERCA1 in bovine pseudomyotonia: a potential therapy for Brody myopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Bovine PMT, despite unconventional, is currently the unique mammalian model of Brody disease"
    explanation: >-
      Supports treating this naturally occurring bovine disease as the mammalian
      model for Brody myopathy.
- name: accordion zebrafish (atp2a1 mutant)
  species: Zebrafish
  genotype: atp2a1 (serca1) mutant, accordion allele series
  publication: PMID:15469975
  description: >-
    A behavioural mutant positionally cloned to atp2a1, in which touch-evoked
    swimming is replaced by bilateral simultaneous contraction. It is the
    workhorse in vivo model and the system in which slowed cytosolic calcium
    decay was directly imaged.
  modeled_mechanisms:
  - target: Impaired Calcium Reuptake into the Sarcoplasmic Reticulum
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      In vivo imaging shows the slowed cytosolic calcium decay that defines this
      node, and the defect is shown to be muscle-intrinsic rather than neural.
    limitations: >-
      The phenotype is embryonic and larval rather than exertional and
      adult-onset, the readout is touch-evoked swimming behaviour rather than
      muscle stiffness, and larval zebrafish lack the fast and slow fibre
      architecture of adult human limb muscle.
    readouts:
    - name: Cytosolic calcium transient decay rate
      target: Impaired Calcium Reuptake into the Sarcoplasmic Reticulum
      direction: DECREASED
      interpretation: >-
        Slower decay of the cytosolic calcium transient is the direct measurement
        of impaired reuptake.
      evidence:
      - reference: PMID:15469975
        reference_title: accordion, a zebrafish behavioral mutant, has a muscle relaxation defect due to a mutation in the ATPase Ca2+ pump SERCA1.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "cytosolic Ca2+ decay was significantly slower in acc muscle"
        explanation: >-
          The imaging measurement behind this readout.
    evidence:
    - reference: PMID:15469975
      reference_title: accordion, a zebrafish behavioral mutant, has a muscle relaxation defect due to a mutation in the ATPase Ca2+ pump SERCA1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "As SERCA1 mutations in humans lead to Brody disease, an exercise-induced muscle relaxation disorder, zebrafish accordion mutants could be a useful animal model for this condition"
      explanation: >-
        The authors' own statement that this mutant is informative for Brody
        disease.
  evidence:
  - reference: PMID:15581877
    reference_title: A mutation in serca underlies motility dysfunction in accordion zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mutation in SERCA, a serine to phenylalanine substitution, is likely to result in compromised protein function"
    explanation: >-
      Independent positional cloning of the same locus, confirming that the
      behavioural phenotype follows from compromised SERCA function.
- name: Atp2a1-null mouse
  species: Mouse
  genotype: Atp2a1 homozygous null
  publication: PMID:12556521
  description: >-
    Complete targeted disruption of Atp2a1. The mice die within hours of birth
    from respiratory failure attributed to diaphragm dysfunction, a course with no
    counterpart in human disease, where respiratory involvement is absent
    entirely. The model is included because its failure is informative rather than
    merely inconvenient.
  modeled_mechanisms:
  - target: Compensatory Calcium Extrusion and Handling
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mouse does not reproduce the compensation that makes the human disease
      survivable. Humans with essentially absent SERCA1 have a mild,
      non-progressive myopathy with no respiratory involvement, whereas the null
      mouse dies at birth of diaphragm failure. Whatever carries the calcium load
      in human muscle is either absent in the mouse or cannot meet the acute
      respiratory demand of birth.
    limitations: >-
      A complete null is a poor genetic match for most human genotypes, which
      retain residual protein or residual activity, so some of the gap between
      species may be allele severity rather than species biology. The lethality
      also prevents the model from ever being used to study the exertional,
      adult-onset phenotype that defines the human disease.
    evidence:
    - reference: PMID:12556521
      reference_title: Targeted disruption of the ATP2A1 gene encoding the sarco(endo)plasmic reticulum Ca2+ ATPase isoform 1 (SERCA1) impairs diaphragm function and is lethal in neonatal mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "SERCA1-null mice had progressive cyanosis and gasping respiration and succumbed from respiratory failure shortly after birth"
      explanation: >-
        Establishes the neonatal lethal respiratory course that human patients do
        not have, which is the substance of the failure to recapitulate.
    - reference: PMID:12556521
      reference_title: Targeted disruption of the ATP2A1 gene encoding the sarco(endo)plasmic reticulum Ca2+ ATPase isoform 1 (SERCA1) impairs diaphragm function and is lethal in neonatal mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "coupled with the marked increase in contractile function required of the diaphragm muscle to support postnatal respiration, can account for respiratory failure"
      explanation: >-
        Gives the authors' own mechanism for the lethality, the acute respiratory
        load at birth, which is the specific circumstance human patients never
        face in this form.
  evidence:
  - reference: PMID:39273176
    reference_title: The Accordion Zebrafish tq206 Mutant in the Assessment of a Novel Pharmaceutical Approach to Brody Myopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "No mouse model nor specific therapies exist for Brody myopathy, which is therefore considered an orphan disease"
    explanation: >-
      Records the consequence for the field: an Atp2a1 knockout mouse exists, but
      no viable mouse model of Brody myopathy does, which is why the zebrafish
      and cattle carry the work.
discussions:
- discussion_id: brody_compensation_mechanism
  prompt: >-
    What actually compensates for SERCA1 loss in human fast-twitch muscle, and
    why is the human disease mild when complete murine SERCA1 loss is lethal?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Compensatory Calcium Extrusion and Handling
  rationale: >-
    This is the central unresolved question of the disease and it is not merely
    academic. The compensation is what determines severity, so understanding it
    would explain the variability between patients and might itself be a
    therapeutic target. Two candidate mechanisms are curated here as competing
    hypotheses. Sarcolemmal calcium extrusion has direct positive evidence but
    only from cattle, and from a single case. SERCA2 isoform upregulation was
    observed in one human family but was not reproduced in the largest human
    cohort or in the bovine model. No human study has measured extrusion pump
    activity, sodium-calcium exchange, or mitochondrial calcium uptake in Brody
    muscle, so the question is open rather than contested at the level of data.
  proposed_experiments:
  - experiment_id: brody_compensation_profiling
    name: Calcium-handling protein profiling in genotyped Brody muscle
    description: >-
      Quantify plasma membrane calcium ATPase, sodium-calcium exchanger,
      mitochondrial calcium uniporter, and SERCA2 protein abundance and activity
      in fast-twitch muscle biopsies from genotyped Brody patients, stratified by
      residual SERCA1 activity, against matched controls. This would establish
      which removal mechanism actually carries the load in human muscle, and
      whether the degree of compensation predicts clinical severity.
  - experiment_id: brody_single_nucleus_rnaseq
    name: Fibre-type-resolved single-nucleus RNA sequencing of Brody muscle
    description: >-
      Single-nucleus RNA sequencing of Brody muscle, resolved by fibre type. The
      mechanism is fibre-type selective, so a fibre-type-resolved expression map
      is the obvious way to detect compensatory programmes running specifically
      in type II nuclei. No such dataset exists.
- discussion_id: brody_mouse_model_mismatch
  prompt: >-
    Does the neonatal lethality of the Atp2a1-null mouse reflect a genuine
    species difference in calcium handling, or an artefact of modelling a
    partial-loss human disease with a complete null?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Compensatory Calcium Extrusion and Handling
  - pathophysiology#Reduced SERCA1 Density at the Sarcoplasmic Reticulum Membrane
  rationale: >-
    Evidence exists in the model and is not in doubt; what is open is its
    translational validity. Complete murine SERCA1 loss kills the animal at birth
    through diaphragm failure, while human patients with severely reduced or
    absent SERCA1 have no respiratory involvement whatsoever and a mild,
    non-progressive limb and eyelid myopathy. Two readings are possible and are
    not mutually exclusive: that human muscle compensates in a way mouse muscle
    cannot, or that most human alleles retain enough residual protein or activity
    that a complete null is simply the wrong comparison. Distinguishing them
    matters, because the first reading makes compensation a therapeutic target
    and the second makes allele severity the dominant variable.
  proposed_experiments:
  - experiment_id: brody_hypomorphic_mouse
    name: Hypomorphic Atp2a1 mouse allele series matched to human residual activity
    description: >-
      Generate a hypomorphic Atp2a1 allele series in mouse, matched to the
      residual activity levels measured in human patients, rather than a complete
      null. This would separate the two readings directly: if graded hypomorphs
      are viable and develop exertional stiffness, the mismatch is about allele
      severity; if they still die of diaphragm failure, it is about species
      biology.
differential_diagnoses:
- name: Brody syndrome (gene-negative)
  description: >-
    Clinically and biochemically similar exercise-induced impairment of
    relaxation with reduced SERCA activity, but without identifiable ATP2A1
    variants. It is genetically unsolved and reported to differ clinically:
    myalgia is more common and the impact on daily life greater than in
    gene-confirmed Brody disease. It is the most important boundary on this
    entry, since a patient can meet the clinical and biochemical description and
    still not belong here.
  evidence:
  - reference: PMID:22704959
    reference_title: "Brody syndrome: a clinically heterogeneous entity distinct from Brody disease: a review of literature and a cross-sectional clinical study in 17 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with Brody syndrome more often report myalgia"
    explanation: >-
      Establishes that the gene-negative group differs clinically rather than
      being an undiagnosed remainder of the same entity.
- name: Myotonia congenita and paramyotonia congenita
  description: >-
    The disorders Brody myopathy is most often mistaken for, since all present
    with exercise-related muscle stiffness. They are distinguished
    electrophysiologically rather than clinically: the myotonias generate
    myotonic discharges on EMG, while the Brody contracture is electrically
    silent.
- name: Rippling muscle disease
  description: >-
    Also features mechanically induced muscle activity with limited electrical
    correlate. Distinguished by the rolling wave of contraction on percussion and,
    in the immune-mediated form, by an inflammatory basis that Brody myopathy
    does not have.
- name: Canine paradoxical pseudomyotonia
  description: >-
    Included as a cross-species comparator rather than a human differential. In
    English Cocker and Springer Spaniels an exercise-induced myotonic-like
    stiffness closely resembling bovine pseudomyotonia and human Brody disease is
    caused by an SLC7A10 nonsense variant, not by ATP2A1. It is a reminder that
    the clinical picture of exercise-induced failure of relaxation is reachable
    through more than one gene.
  evidence:
  - reference: PMID:36869603
    reference_title: The c.126C>A(p.(Cys42Ter)) SLC7A10 nonsense variant is a candidate causative variant for paradoxical pseudomyotonia in English Cocker and Springer Spaniels.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This disease is characterised by episodes of exercise-induced generalised myotonic-like muscle stiffness, phenotypically similar to congenital pseudomyotonia in cattle, and paramyotonia congenita and Brody disease in people."
    explanation: >-
      States the phenotypic similarity to Brody disease alongside a different
      causal gene, which is the point of including it.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists. The largest series assembled
    40 patients internationally, and a separate cross-sectional study covered 17
    patients with the gene-negative syndrome. Recorded as CASES_IN_LITERATURE
    rather than converted to a rate, because dividing a convenience series by a
    world population would manufacture a precision the data do not have.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This observational study shows that the main feature of Brody disease is an exercise-induced muscle stiffness of the limbs, and often of the eyelids."
    explanation: >-
      The international series of 40 patients, cited here for the scale of the
      assembled literature rather than for a rate.

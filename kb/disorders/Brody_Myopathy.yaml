    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Symptomatic treatment was mostly ineffective or produced unacceptable side effects.
    explanation: Overall cohort experience limits claims of general symptomatic efficacy.
  - reference: PMID:32040565

- name: Reduced SERCA1 Density at the Sarcoplasmic Reticulum Membrane
  biological_scale: MOLECULAR
  description: Reduced or absent SERCA1 protein is a common biochemical finding in tested patient muscle. A normal immunohistochemical stain does not exclude this deficit, and normal abundance would not exclude an intrinsic catalytic defect. SERCA1 is the dominant calcium pump in type II skeletal muscle fibres.
  evidence:
  - *id002
  - reference: PMID:20142766
    reference_title: "Brody disease: insights into biochemical features of SERCA1 and identification of a novel mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Immunoblotting after high-resolution 2-dimensional gel electrophoresis showed a significant difference in the amount of SERCA1 protein between the patient and controls.
    explanation: Human muscle protein analysis complements the calcium-ATPase assay.

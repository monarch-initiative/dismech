- name: Activity Pacing and Trigger Management
  description: Adjust rapid repetitive activity to individual tolerance and use rest breaks to relieve stiffness. Cold exposure can worsen symptoms, so temperature and activity adjustments may help symptom avoidance. This is pragmatic supportive management; the cited evidence does not establish a standardized physical-therapy or warm-up protocol.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:25614869
    reference_title: Exome analysis identifies Brody myopathy in a family diagnosed with malignant hyperthermia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Brody disease has a mild presentation when muscular activity is paced at tolerable levels, but becomes acute with rapid, repetitive exercise.
    explanation: Clinical discussion supports pacing as a practical response to the exertional phenotype.
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: The majority of patients mentioned an increase of symptoms upon exposure to cold temperatures (25/36).
    explanation: Observed trigger provides an indirect rationale for temperature management.
- name: Genetic Counselling
  description: Discuss autosomal recessive inheritance, confirm the familial variants and their phase, and offer appropriate family testing. For two carrier parents, the usual recurrence risk is 25% per pregnancy. Identifying affected relatives also allows communication of perioperative precautions; heterozygous carrier status alone is not equivalent to the affected phenotype.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37332993
    reference_title: "Case report: Clinical and molecular characterization of two siblings affected by Brody myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The bi-allelic inheritance was verified by Sanger sequencing in the unaffected parents.
    explanation: Family segregation provides direct evidence for recessive counseling.
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Heterozygous family members of patients (carriers) did not exhibit the Brody disease phenotype
    explanation: Observed carrier status supports distinguishing carriers from affected relatives; this was not systematically assessed.
animal_models:
- name: 'Bovine congenital pseudomyotonia: Chianina and Romagnola ATP2A1 variants'
  species: Cattle
  genotype: R164H homozygosity; G211V/G286V cis allele homozygosity or compound heterozygosity with R164H
  publication: PMID:18786632
  description: Naturally occurring recessive disease produces exercise-induced stiffness, delayed relaxation and reduced SERCA1 abundance/activity. Functional separation of the Romagnola cis variants identifies G211V as pathogenic and G286V as largely benign. Local C17 treatment in two compound-heterozygous calves improved muscle biochemical endpoints, but systemic clinical efficacy was not established.
  modeled_mechanisms:
  - target: Reduced SERCA1 Density at the Sarcoplasmic Reticulum Membrane
    description: Models low SERCA1 abundance in skeletal muscle, with variant- and species-specific limits.
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    evidence:
    - reference: PMID:23046865
      reference_title: Pseudomyotonia in Romagnola cattle caused by novel ATP2A1 mutations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: the amount of SERCA1 protein was decreased in the pathological samples with respect to control samples
      explanation: Whole-animal disease specimens show reduced abundance; this is not direct evidence of the same molecular route in every human variant.
  - target: Impaired Calcium Reuptake into the Sarcoplasmic Reticulum
    description: Reduced calcium-ATPase activity in affected muscle models loss of reuptake capacity.
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    evidence:
    - reference: PMID:18786632
      reference_title: "Identification of a missense mutation in the bovine ATP2A1 gene in congenital pseudomyotonia of Chianina cattle: an animal model of human Brody disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: SERCA1 activity in affected animals was decreased by about 70%
      explanation: Founding Chianina study provides a functional muscle readout.
  notes: The 2012 abstract contains inconsistent amino-acid nomenclature; R164H and the distinction between G211V and G286V follow the corrected body text and the 2022 functional study. Degeneration can be more marked than in typical human biopsies.
- name: Dutch Improved Red and White calf with ATP2A1 R559C
  species: Cattle
  genotype: ATP2A1 p.Arg559Cys
  publication: PMID:20547455
  description: A naturally affected calf had exercise-induced stiffness and low SERCA1 activity. The same variant is associated with a more severe respiratory course in Belgian Blue cattle, indicating context-dependent expression. Increased PMCA and broadly distributed mitochondrial markers were observed without SERCA2 compensation.
  modeled_mechanisms:
  - target: Compensatory Calcium Extrusion and Handling
    description: Provides expression-level clues to compensatory calcium handling, not direct proof of increased extrusion flux.
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    evidence:
    - reference: PMID:26482047
      reference_title: Fast-twitch skeletal muscle fiber adaptation to SERCA1 deficiency in a Dutch Improved Red and White calf pseudomyotonia case.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: an increased expression of sarcolemmal calcium extrusion pump
      explanation: Protein expression supports the candidate adaptation; no selective intervention establishes causal rescue.
- name: accordion zebrafish, including atp2a1 tq206 S766F
  species: Zebrafish
  genotype: atp2a1 accordion alleles; tq206 S766F homozygotes and heterozygotes
  publication: PMID:15469975
  description: Mutants show prolonged calcium transients and simultaneous bilateral trunk contraction. The tq206 S766F homozygote has severe larval abnormalities and early lethality, unlike the usually mild human course. C17 did not significantly rescue key morphological or locomotor endpoints in the 2024 experiment. Heterozygotes had largely preserved larval locomotion, although adult histology showed abnormalities.
  modeled_mechanisms:
  - target: Impaired Calcium Reuptake into the Sarcoplasmic Reticulum
    description: Recapitulates impaired calcium clearance after excitation, with species-specific behavioral and developmental readouts.
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    evidence:
    - reference: PMID:15469975
      reference_title: "accordion, a zebrafish behavioral mutant, has a muscle relaxation defect due to a mutation in the ATPase Ca2+ pump SERCA1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: In vivo imaging of muscle Ca2+ transients revealed that cytosolic Ca2+ decay was significantly slower in acc muscle.
      explanation: Direct in-vivo calcium-transient measurement.
  - target: Intrinsic SERCA1 Calcium-Transport Defect
    description: S766F is a useful contrast to unstable, activity-retaining mutants; preserved expression and lack of corrector response are consistent with a functional defect.
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    evidence:
    - reference: PMID:39273176
      reference_title: The Accordion Zebrafish tq206 Mutant in the Assessment of a Novel Pharmaceutical Approach to Brody Myopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: Administration of the CFTR C17 corrector to Tq206−/− siblings exhibited no difference or improvement in morphological traits and swimming performance.
      explanation: Negative rescue in the S766F model constrains the therapeutic generalization.
  notes: The 2024 study inferred impaired intrinsic S766F function from phenotype, expression and structural context; it did not directly establish the same calcium-affinity defect measured for human P789L. Embryonic/larval severity and early death limit modeling of human natural history.
- name: Atp2a1-null mouse
  species: Mouse
  genotype: Atp2a1 homozygous null
  publication: PMID:12556521
  description: Constitutive SERCA1 loss produces marked reduction in calcium transport, neonatal diaphragm dysfunction and death shortly after birth. The model captures severe loss of pump function but not the usually survivable human course. Diaphragm fibre composition, species-specific adaptation and residual allele activity may contribute to the mismatch.
  modeled_mechanisms:
  - target: Impaired Calcium Reuptake into the Sarcoplasmic Reticulum
    description: Recapitulates deficient calcium transport in diaphragm and skeletal muscle despite a much more severe clinical outcome.
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    evidence:
    - reference: PMID:12556521
      reference_title: Targeted disruption of the ATP2A1 gene encoding the sarco(endo)plasmic reticulum Ca2+ ATPase isoform 1 (SERCA1) impairs diaphragm function and is lethal in neonatal mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: The V(max) of Ca(2+) transport activity in mutant diaphragm and skeletal muscle was reduced by 80% compared with wild-type muscle
      explanation: Direct functional consequence of the engineered null.
  - target: Compensatory Calcium Extrusion and Handling
    description: The assayed compensatory changes were not detected in this lethal neonatal model.
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    evidence:
    - reference: PMID:12556521
      reference_title: Targeted disruption of the ATP2A1 gene encoding the sarco(endo)plasmic reticulum Ca2+ ATPase isoform 1 (SERCA1) impairs diaphragm function and is lethal in neonatal mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: No compensatory responses were detected in analysis of mRNAs encoding other Ca(2+) handling proteins or of protein levels.
      explanation: Negative expression-level result in newborn mice; it does not prove all possible compensatory flux is absent.
    limitations: Comparison is with proposed human adaptation, whose functional magnitude remains uncertain. Constitutive complete loss, neonatal respiratory demand and species-specific muscle composition all limit inference.
discussions:
- discussion_id: brody_compensation_mechanism
  prompt: >-
    Which calcium-handling adaptations preserve muscle function in humans with severe SERCA1 deficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Compensatory Calcium Extrusion and Handling
  rationale: >-
    One affected human biopsy showed increased SERCA2, whereas most tested biopsies did not. An affected calf
    showed increased PMCA expression and altered mitochondrial-marker distribution without SERCA2 compensation.
    These are expression-level observations rather than selective functional-rescue experiments. The candidate
    mechanisms need not compete exclusively and could vary by patient, fibre type or genetic background.
  proposed_experiments:
  - experiment_id: brody_compensation_profiling
    name: Calcium-handling protein profiling in genotyped Brody muscle
    description: >-
      Quantify SERCA2, PMCA and other candidate calcium-handling proteins in genotyped patient muscle, and
      measure calcium clearance with selective perturbations where feasible. Stratify by fibre type and residual
      SERCA1 function to distinguish expression changes from functional compensation.
  - experiment_id: brody_single_nucleus_rnaseq
    name: Fibre-type-resolved single-nucleus RNA sequencing of Brody muscle
    description: >-
      Compare fibre-type-resolved transcriptional programs in patient muscle and controls, followed by protein
      and calcium-flux validation. Transcript abundance alone would not establish a compensatory transport
      mechanism.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Future research would be needed to test if similar compensatory mechanisms can be identified in patients with Brody disease.
    explanation: The cohort identifies the remaining translational gap.
  - reference: PMID:26482047
    reference_title: Fast-twitch skeletal muscle fiber adaptation to SERCA1 deficiency in a Dutch Improved Red and White calf pseudomyotonia case.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: Calcium removal mechanisms, operating in muscle fibers as compensatory response aimed at lowering excessive cytoplasmic calcium concentration caused by SERCA1 deficiency, could explain the difference in severity of clinical signs.
    explanation: The bovine authors frame compensation as a proposed explanation rather than a proven cause.
- discussion_id: brody_mouse_model_mismatch
  prompt: >-
    Why is constitutive SERCA1 loss neonatally lethal in mice while human Brody disease usually permits long-term
    survival?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Compensatory Calcium Extrusion and Handling
  - pathophysiology#Reduced SERCA1 Density at the Sarcoplasmic Reticulum Membrane
  rationale: >-
    The null mouse has severe diaphragm dysfunction, reduced transport and no detected compensatory expression
    changes. Human disease includes severe protein deficiency but usually a much milder clinical course. Species-specific
    diaphragm composition, residual function and alternative calcium-handling responses are plausible, nonexclusive
    contributors; none alone has been established as the explanation.
  proposed_experiments:
  - experiment_id: brody_hypomorphic_mouse
    name: Hypomorphic Atp2a1 mouse allele series matched to human residual activity
    description: >-
      Compare graded or conditional Atp2a1 loss with human residual protein and activity measurements, including
      diaphragm fibre composition and calcium clearance. This could distinguish neonatal complete-loss effects
      from variant- and species-dependent adaptation.
  evidence:
  - reference: PMID:12556521
    reference_title: Targeted disruption of the ATP2A1 gene encoding the sarco(endo)plasmic reticulum Ca2+ ATPase isoform 1 (SERCA1) impairs diaphragm function and is lethal in neonatal mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: SERCA1-null mice had progressive cyanosis and gasping respiration and succumbed from respiratory failure shortly after birth
    explanation: Direct evidence for the model-specific lethal phenotype.
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Onset begins in childhood and there was no or only mild progression of symptoms over time.
    explanation: Human cohort contrast; does not establish that all patients lack respiratory involvement.
- discussion_id: brody_assay_specificity
  prompt: How specifically does reduced compound muscle calcium-ATPase activity identify ATP2A1-related Brody disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#Sarcoplasmic reticulum calcium ATPase activity
  rationale: The optimized assay separated four genetically confirmed patients from 28 healthy controls, but it includes SERCA1/SERCA2 and possible PMCA contributions. Other myopathies, muscle site, age, sex and disuse may alter results; clinical sensitivity and specificity require broader validation.
  evidence:
  - reference: PMID:41938373
    reference_title: Sarco/endoplasmatic reticulum calcium ATPase activity in healthy muscle and Brody disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Future research on SERCA activity in these subject groups is needed to determine the specificity of abnormal SERCA activity.
    explanation: The study explicitly identifies the disease-specificity gap.
differential_diagnoses:
- name: Brody syndrome without identified ATP2A1 variants
  description: Historically describes delayed relaxation and reduced SERCA activity without identified ATP2A1 variants. The 17-patient study found greater myalgia and daily-life impact than in gene-confirmed disease. This is not a genetically resolved subtype, and incomplete genetic testing or another cause of reduced activity must be considered.
  evidence:
  - reference: PMID:22704959
    reference_title: "Brody syndrome: a clinically heterogeneous entity distinct from Brody disease: a review of literature and a cross-sectional clinical study in 17 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: a distinction between Brody disease (with ATP2A1 mutations) and Brody syndrome (without ATP2A1 mutations) was proposed.
    explanation: Defines the scope boundary.
  - reference: PMID:22704959
    reference_title: "Brody syndrome: a clinically heterogeneous entity distinct from Brody disease: a review of literature and a cross-sectional clinical study in 17 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Patients with Brody syndrome more often report myalgia and experience a considerable impact on daily life.
    explanation: Clinical comparison in the historical syndrome study.
- name: Myotonia congenita and paramyotonia congenita
  description: These channelopathies commonly produce myotonic discharges, unlike the typical Brody pattern of electrically silent contractures. Clinical percussion myotonia alone does not settle the distinction.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: myotonic disorders will typically demonstrate myotonic discharges at myography that are not seen in Brody disease
    explanation: Comparative diagnostic guidance; the qualifier typically avoids a universal statement about every myotonic presentation.
- name: McArdle disease
  description: Can also produce silent contractures. A second-wind phenomenon, persistently high creatine kinase and recurrent exercise-associated rhabdomyolysis favor McArdle disease, although rhabdomyolysis can also occur in Brody disease.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Silent contractures can also be found in McArdle disease (glycogen storage disease type V).
    explanation: Electrical silence is not uniquely diagnostic of Brody disease.
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: McArdle disease typically presents with a second wind phenomenon, permanently high creatine kinase levels and episodes of rhabdomyolysis
    explanation: The broader phenotype helps distinguish the disorders.
- name: Rippling muscle disease
  description: Mechanically induced visible rippling or muscle mounding can also be electrically silent. Hereditary and immune-mediated forms differ from the ATP2A1-related relaxation defect.
  evidence:
  - reference: PMID:42124386
    reference_title: Muscle Stiffness due to Neuromuscular Hyperexcitability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Rippling muscle disease (RMD) and Brody disease are extremely rare nonprogressive myopathies associated with electrical silence on needle EMG during muscle stiffness and delayed muscle relaxation
    explanation: The clinical review supports overlap in electrical silence; disease mechanisms and provocation patterns differ.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: Exact prevalence is unknown. Published cohort sizes and literature counts are ascertainment summaries and should not be divided by the world population or treated as a measured incidence.
  evidence:
  - reference: url:https://medlineplus.gov/genetics/condition/brody-myopathy/
    reference_title: "Brody myopathy: MedlinePlus Genetics"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Brody myopathy is a rare condition, although its exact prevalence is unknown.
    explanation: Authoritative clinical summary does not supply a measured prevalence estimate.
experimental_models:
- name: HEK293 expression of human SERCA1 P789L and R819C
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Heterologous HEK293 cells expressing human wild-type or mutant SERCA1
  publication: PMID:10914677
  description: P789L was readily expressed but lost most calcium transport because of reduced calcium affinity. R819C retained near-normal transport and was not supported as causative in the reported family. This assay separates expression from function; heterologous cells do not reproduce mature fast-twitch muscle physiology.
  modeled_mechanisms:
  - target: Intrinsic SERCA1 Calcium-Transport Defect
    description: Tests intrinsic transport impairment separately from protein abundance.
    relationship: PERTURBS
    fidelity: MODERATE
    evidence:
    - reference: PMID:10914677
      reference_title: The mutation of Pro789 to Leu reduces the activity of the fast-twitch skeletal muscle sarco(endo)plasmic reticulum Ca2+ ATPase (SERCA1) and is associated with Brody disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: The Pro789 to Leu mutant was readily expressed in HEK-293 cells, but it demonstrated an almost complete loss of Ca2+ transport activity because of reduced Ca2+ affinity.
      explanation: Direct functional assay of a human disease-associated allele.
- name: Heterologous bovine SERCA1 instability and corrector assays
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: HEK293 or HeLa host cells expressing rabbit SERCA1 with R164H or bovine SERCA1 with G211V/G286V substitutions
  publication: PMID:36293223
  description: Transfected-cell assays measure mutant abundance, ER localization, ubiquitination, calcium transients and microsomal ATPase activity. G211V reduces abundance whereas G286V is largely benign. Proteasome inhibition and selected CFTR correctors rescue unstable variants. Host-cell species does not make these human pathogenic-variant experiments.
  modeled_mechanisms:
  - target: Proteasomal Degradation of Misfolded SERCA1
    description: Tests ubiquitination and protein rescue after proteasome inhibition.
    relationship: PERTURBS
    fidelity: MODERATE
    evidence:
    - reference: PMID:36293223
      reference_title: Differential Analysis of Gly211Val and Gly286Val Mutations Affecting Sarco(endo)plasmic Reticulum Ca(2+)-ATPase (SERCA1) in Congenital Pseudomyotonia Romagnola Cattle.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: Inhibition of the UPS with MG132 led to an increase in the recovery of the polyubiquitinated G211V mutant
      explanation: Direct biochemical evidence for altered protein disposal in the transfected-cell system.
  - target: Reduced SERCA1 Density at the Sarcoplasmic Reticulum Membrane
    description: Corrector screening measures restoration of mutant protein abundance.
    relationship: PERTURBS
    fidelity: MODERATE
    evidence:
    - reference: PMID:41206505
      reference_title: "CFTR corrector C17 rescues defective SERCA1 in bovine pseudomyotonia: a potential therapy for Brody myopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: the incubation with CFTR correctors C17, C4 and C9, induced an increase in the expression level of SERCA1 mutant almost equivalent to that of MG132-treated cells
      explanation: Expression-level rescue does not alone establish clinical efficacy.
- name: Bovine pseudomyotonia muscle explants
  experimental_model_type: OTHER
  organism:
    preferred_term: Bos taurus
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  cell_source: Fresh adult skeletal-muscle fibre bundles from affected cattle
  publication: PMID:41206505
  description: Muscle explants preserve differentiated diseased tissue for MG132 or corrector exposure. C17 and C4 increased mutant SERCA1 in SR-enriched fractions. Ex vivo response avoids whole-animal pharmacokinetics and therefore cannot establish systemic safety or functional benefit.
  modeled_mechanisms:
  - target: Reduced SERCA1 Density at the Sarcoplasmic Reticulum Membrane
    description: Tests pharmacological restoration of protein abundance in diseased muscle tissue.
    relationship: PERTURBS
    fidelity: MODERATE
    evidence:
    - reference: PMID:41206505
      reference_title: "CFTR corrector C17 rescues defective SERCA1 in bovine pseudomyotonia: a potential therapy for Brody myopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: the treatment with C17 or C4 correctors efficiently increased SERCA1 mutant expression
      explanation: Explant immunoblot readout supports protein rescue.
- name: Normal human primary muscle cultures for SERCA1 isoform characterization
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Primary cultures of normal human muscle; infant muscle examined for comparison
  publication: PMID:23911890
  description: Normal human cultured fibres predominantly express the neonatal SERCA1b isoform. This is an assay-development comparator rather than a demonstrated patient-derived Brody model, and isoform maturation must be considered when modeling adult SERCA1a disease.
  evidence:
  - reference: PMID:23911890
    reference_title: SERCA1 protein expression in muscle of patients with Brody disease and Brody syndrome and in cultured human muscle fibers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: We found that SERCA1b, the SERCA1 neonatal form, is the main protein isoform expressed in cultured human muscle fibers and infant muscle.
    explanation: Direct isoform result; the cultured cells were from normal human muscle.
progression:
- phase: Long-term course
  notes: Most patients have a relatively stable course, but strict lifelong nonprogression is not established. In the international cohort, 27 patients had follow-up averaging 9.3 years and three had more limited information. Seven of these 30 reported increased symptoms, while physicians observed no new weakness or atrophy. Retrospective ascertainment and the relatively young cohort limit conclusions about late adulthood.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Of these 30 patients, seven patients reported that symptoms had increased (23%).
    explanation: The denominator combines 27 patients with follow-up and three with limited progression information.
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: No development of weakness or atrophy was seen by physicians during follow-up physical examination.
    explanation: Reported symptom progression was not accompanied by newly observed weakness or atrophy in this cohort.
references:
- reference: PMID:10914677
  title: The mutation of Pro789 to Leu reduces the activity of the fast-twitch skeletal muscle sarco(endo)plasmic reticulum Ca2+ ATPase (SERCA1) and is associated with Brody disease.
  findings:
  - statement: Human P789L impairs calcium affinity and transport despite preserved heterologous expression; R819C is not supported as causal.
- reference: PMID:12556521
  title: Targeted disruption of the ATP2A1 gene encoding the sarco(endo)plasmic reticulum Ca2+ ATPase isoform 1 (SERCA1) impairs diaphragm function and is lethal in neonatal mice.
  findings:
  - statement: Atp2a1-null mice show severe diaphragm dysfunction and neonatal lethality, limiting natural-history fidelity.
- reference: PMID:15469975
  title: "accordion, a zebrafish behavioral mutant, has a muscle relaxation defect due to a mutation in the ATPase Ca2+ pump SERCA1."
  findings:
  - statement: Accordion zebrafish connect SERCA1 dysfunction to impaired muscle relaxation.
- reference: PMID:15581877
  title: A mutation in serca underlies motility dysfunction in accordion zebrafish.
  findings:
  - statement: Zebrafish calcium-transient and contraction experiments distinguish muscle calcium clearance from neural output.
- reference: PMID:18786632
  title: "Identification of a missense mutation in the bovine ATP2A1 gene in congenital pseudomyotonia of Chianina cattle: an animal model of human Brody disease."
  findings:
  - statement: Chianina cattle ATP2A1 R164H founder model with reduced muscle calcium-ATPase activity.
- reference: PMID:20142766
  title: "Brody disease: insights into biochemical features of SERCA1 and identification of a novel mutation."
  findings:
  - statement: Affected siblings show SR ultrastructural remodeling and discordance between immunostaining and quantitative protein measurement.
- reference: PMID:20547455
  title: "Pseudomyotonia, a muscle function disorder associated with an inherited ATP2A1 (SERCA1) defect in a Dutch Improved Red and White cross-breed calf."
  findings:
  - statement: Dutch calf R559C disease model with low SERCA activity and absent electrical myotonia.
- reference: PMID:22704959
  title: "Brody syndrome: a clinically heterogeneous entity distinct from Brody disease: a review of literature and a cross-sectional clinical study in 17 patients."
  findings:
  - statement: ATP2A1-negative Brody syndrome is clinically heterogeneous and distinct from genetically defined Brody disease.
- reference: PMID:23046865
  title: Pseudomyotonia in Romagnola cattle caused by novel ATP2A1 mutations.
  findings:
  - statement: Romagnola cattle provide ATP2A1 genotype, protein and ATPase evidence; later work resolves the pathogenic G211V and benign G286V contributions.
- reference: PMID:23911890
  title: SERCA1 protein expression in muscle of patients with Brody disease and Brody syndrome and in cultured human muscle fibers.
  findings:
  - statement: SERCA1 assay-method effects and neonatal SERCA1b predominance in normal human muscle cultures.
- reference: PMID:25288803
  title: Inhibition of ubiquitin proteasome system rescues the defective sarco(endo)plasmic reticulum Ca2+-ATPase (SERCA1) protein causing Chianina cattle pseudomyotonia.
  findings:
  - statement: MG132 rescues unstable bovine mutant SERCA1 in experimental systems; clinical efficacy is untested.
- reference: PMID:25614869
  title: Exome analysis identifies Brody myopathy in a family diagnosed with malignant hyperthermia susceptibility.
  findings:
  - statement: Human family with severe SERCA1 reduction and increased SERCA2 in the studied biopsy; compensation remains an interpretation.
- reference: PMID:26482047
  title: Fast-twitch skeletal muscle fiber adaptation to SERCA1 deficiency in a Dutch Improved Red and White calf pseudomyotonia case.
  findings:
  - statement: A mildly affected R559C calf has increased PMCA and mitochondrial markers without SERCA2 upregulation.
- reference: PMID:32040565
  title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
  findings:
  - statement: Forty-patient international clinical, genetic and biopsy cohort, including natural history, perioperative precautions and limited symptomatic drug responses.
- reference: PMID:36293223
  title: Differential Analysis of Gly211Val and Gly286Val Mutations Affecting Sarco(endo)plasmic Reticulum Ca(2+)-ATPase (SERCA1) in Congenital Pseudomyotonia Romagnola Cattle.
  findings:
  - statement: Bovine G211V undergoes accelerated proteasomal disposal while surviving pump molecules retain activity; G286V is largely benign.
- reference: PMID:37332993
  title: "Case report: Clinical and molecular characterization of two siblings affected by Brody myopathy."
  findings:
  - statement: Two siblings with childhood stiffness, falls and compound heterozygous variants; RNA confirms in-frame exon skipping.
- reference: PMID:38125752
  title: "Case report: Revealing the rare-a Brody Disease patient from Turkey expanding the phenotype."
  findings:
  - statement: Adult case broadens reported clinical variability; variant interpretation and possible exotropia association remain limited by lack of functional confirmation.
- reference: PMID:38373275
  title: "Brody Disease, an Early-Onset Myopathy With Delayed Relaxation and Abnormal Gait: A Case Series of 9 Children."
  findings:
  - statement: Nine children demonstrate early abnormal gait and running difficulty with delayed recognition of the relaxation defect.
- reference: PMID:39273176
  title: The Accordion Zebrafish tq206 Mutant in the Assessment of a Novel Pharmaceutical Approach to Brody Myopathy.
  findings:
  - statement: C17 does not rescue key homozygous S766F zebrafish outcomes; this model differs from unstable-protein cattle variants.
- reference: PMID:41206505
  title: "CFTR corrector C17 rescues defective SERCA1 in bovine pseudomyotonia: a potential therapy for Brody myopathy."
  findings:
  - statement: CFTR corrector screening, muscle-explant experiments and local C17 injections in two calves support selected mutant-protein rescue without demonstrating human efficacy or systemic safety.
- reference: PMID:41926432
  title: "Rare Brody myopathy: A case report."
  findings:
  - statement: Single rhabdomyolysis case reports symptomatic improvement with dantrolene.
- reference: PMID:41938373
  title: Sarco/endoplasmatic reticulum calcium ATPase activity in healthy muscle and Brody disease.
  findings:
  - statement: Muscle SERCA assay compares 28 controls with four Brody cases; the reference limit and excellent within-sample discrimination require broader validation.
- reference: PMID:42124386
  title: Muscle Stiffness due to Neuromuscular Hyperexcitability.
  findings:
  - statement: Clinical review distinguishes electrically silent Brody contractures from other causes of muscle stiffness.
- reference: PMID:8841193
  title: "Mutations in the gene-encoding SERCA1, the fast-twitch skeletal muscle sarcoplasmic reticulum Ca2+ ATPase, are associated with Brody disease."
  findings:
  - statement: Founding evidence for autosomal recessive ATP2A1-related Brody disease.
- reference: url:https://medlineplus.gov/genetics/condition/brody-myopathy/
  title: "Brody myopathy: MedlinePlus Genetics"
  findings:
  - statement: Clinical summary of characteristic stiffness, recessive inheritance and unknown prevalence.

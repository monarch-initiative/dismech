      snippet: imaging of skeletal muscle of larval acc reveals greatly prolonged calcium transients and associated contractions in response to depolarization.
      explanation: Paired calcium and contraction readouts support the causal connection.
- name: Electrically Silent Muscle Contracture
  biological_scale: TISSUE
  description: Contractures after voluntary contraction can persist without myotonic discharges on EMG. This describes the abnormal contraction episode, not absence of all physiological motor-unit activity. Silent contractures are elicited in a subset of tested patients and are not specific to Brody disease alone.
  evidence:
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: EMG can reveal silent contractures defined as prolonged involuntary muscle contractions (following voluntary phasic contractions) without electrical activity detected on EMG
    explanation: Defines the contraction readout without myotonic electrical discharges.
  - reference: PMID:32040565
    reference_title: "Clinical, morphological and genetic characterization of Brody disease: an international study of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: None of the patients had myotonic discharges on EMG (n = 30). Silent contractures were present in 18/28 patients
    explanation: The cohort distinguishes a consistent negative electrical finding from an incompletely detected positive contracture.

      explanation: The cohort authors propose fibre-type composition as the reason for eyelid involvement; the mechanism was not experimentally isolated in patients.
- name: Compensatory Calcium Extrusion and Handling
  biological_scale: CELLULAR
  description: Compensatory calcium handling is a candidate explanation for relatively preserved function despite severe SERCA1 loss. Increased PMCA protein and altered mitochondrial-marker distribution occur in a bovine case; ectopic SERCA2 expression occurs in one human biopsy. These observations do not establish the magnitude of calcium flux, prove that adaptation causes the mild course, or require the mechanisms to be mutually exclusive.
  evidence:
  - *id006
  - *id007
  mechanism_confidence: HYPOTHETICAL
  biological_processes:

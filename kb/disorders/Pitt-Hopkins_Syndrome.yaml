  downstream:
  - target: Disrupted bHLH-Dependent Neuronal Differentiation
    description: >-
      Reduced TCF4 E-protein dosage impairs proneural bHLH heterodimer
      transcriptional output during neurogenesis and glial differentiation.
  - target: SCN10A / Nav1.8 Channel Dysregulation
    description: >-
      Loss of TCF4 transcriptional repression derepresses ectopic SCN10A
      (Nav1.8) expression in central neurons.
  - target: RIMBP2-Dependent Synaptic Dysfunction
    description: >-
      TCF4 deficiency downregulates presynaptic RIMBP2 expression and impairs
      cortical synaptic transmission.
  - target: Brainstem Respiratory Control Dysregulation
    description: >-
      TCF4 haploinsufficiency disrupts development and CO2/H+ chemosensitivity
      of Phox2b+ parafacial and retrotrapezoid brainstem respiratory neurons.
  - target: Enteric Autonomic Gastrointestinal Dysmotility
    description: >-
      TCF4 haploinsufficiency impairs enteric autonomic nervous system function
      and intestinal motility.
  - target: Wide Mouth

    explanation: First international consensus statement defining clinical diagnostic criteria and the molecular diagnostic pathway for PTHS.
  - reference: PMID:38571311
    reference_title: "DNA methylation episignature and comparative epigenomic profiling for Pitt-Hopkins syndrome caused by TCF4 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

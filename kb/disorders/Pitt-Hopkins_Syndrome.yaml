name: Pitt-Hopkins Syndrome
creation_date: "2026-06-27T00:00:00Z"
updated_date: "2026-11-13T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Pitt-Hopkins syndrome
  term:
    id: MONDO:0012589
    label: Pitt-Hopkins syndrome
synonyms:
- PTHS
- Pitt-Hopkins syndrome
- Pitt Hopkins syndrome
- TCF4 haploinsufficiency syndrome
- intellectual disability, wide mouth, distinctive facial features, and intermittent hyperventilation followed by apnea
description: >-
  Pitt-Hopkins syndrome (PTHS) is a rare autosomal dominant neurodevelopmental
  disorder caused by haploinsufficiency of TCF4 (transcription factor 4) at
  chromosome 18q21.2, almost always arising from de novo heterozygous pathogenic
  variants (point mutations, small insertions/deletions, or larger deletions).
  TCF4 encodes a class I basic helix-loop-helix (bHLH) "E-protein" transcription
  factor that heterodimerizes with proneural bHLH factors to regulate neuronal
  differentiation, synaptic maturation, and brainstem autonomic circuit
  development. Affected individuals present with moderate-to-severe intellectual
  disability, severe speech impairment (often absent speech with relatively
  stronger receptive language), a recognizable facial gestalt (deep-set eyes,
  prominent/beaked nasal bridge, wide mouth with a cupid-bow upper lip and fleshy
  everted lips), and a characteristic episodic awake breathing abnormality (bouts
  of hyperventilation alternating with breath-holding/apnea). Additional features
  include hypotonia, ataxia, epilepsy, postnatal microcephaly, chronic
  constipation and gastroesophageal reflux, stereotypic hand movements, autism
  spectrum features, sleep disturbances, strabismus, and severe myopia. The
  phenotype overlaps Angelman, Rett, and Mowat-Wilson syndromes, and a clinically
  similar "Pitt-Hopkins-like" autosomal recessive syndrome is caused by biallelic
  CNTNAP2 or NRXN1 variants.
parents:
- Neurodevelopmental Disorder
- Syndromic Intellectual Disability
notes: >-
  Pitt-Hopkins syndrome (OMIM #610954) was clinically delineated by Pitt and
  Hopkins in 1978, and heterozygous TCF4 haploinsufficiency was established as
  its molecular basis in 2007. Recurrent missense variants outside the C-terminal
  bHLH domain (such as p.Arg389Cys in the AD2 activation domain) cause an
  overlapping TCF4-related intellectual disability disorder lacking classical
  PTHS hyperventilation, myopia, and typical facial gestalt.

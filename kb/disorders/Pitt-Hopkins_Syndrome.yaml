- name: SCN10A / Nav1.8 Channel Dysregulation
  description: >-
    SCN10A, encoding the voltage-gated sodium channel Nav1.8, is a downstream
    target of TCF4 that is consistently upregulated in central neurons in PTHS
    mouse models. Ectopic Nav1.8 sodium conductance alters intrinsic neuronal
    excitability and brainstem/cortical circuit function, and pharmacological
    Nav1.8 inhibition normalizes neuron function, respiratory stability, and
    behavioral abnormalities in models.

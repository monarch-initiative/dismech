- name: Disrupted bHLH-Dependent Neuronal Differentiation
  description: >-
    TCF4 partners with proneural factors (e.g., ASCL1, NEUROD2, NEUROG2) to drive
    neuronal specification, migration, and differentiation as well as astrocyte
    maturation. Reduced TCF4 activity impairs proneural transcriptional output,
    perturbing cortical neurogenesis, commissural tract development, and glial
    differentiation and driving core cognitive, speech, motor, and postnatal
    brain-growth deficits.

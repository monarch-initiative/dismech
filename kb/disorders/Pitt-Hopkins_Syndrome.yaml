    snippet: "both iNPCs and iAstrocytes displayed defects in function and differentiation in a mutation-specific manner"
    explanation: Patient-derived neural progenitors and astrocytes show TCF4-mutation-dependent differentiation defects, supporting disrupted neural/glial differentiation.
  downstream:
  - target: Intellectual Disability
    description: >-
      Impaired cortical neurogenesis and circuit assembly cause moderate-to-severe
      intellectual disability.
  - target: Global Developmental Delay
    description: >-
      Defective neuronal and glial differentiation delays motor and cognitive
      milestone acquisition from infancy.
  - target: Absent or Severely Limited Speech
    description: >-
      Disrupted cortical and speech-motor circuit development results in absent
      or severely restricted expressive speech.
  - target: Postnatal Microcephaly
    description: >-
      Reduced postnatal cortical neurogenesis, gliogenesis, and neuropil
      expansion lead to secondary microcephaly.
  - target: Corpus Callosum Hypoplasia
    description: >-
      Impaired cortical neuronal differentiation and interhemispheric axon tract
      development result in hypoplasia or aplasia of the corpus callosum.
  - target: Hypotonia
    description: >-
      Impaired central motor-pathway maturation manifests as infantile and
      childhood hypotonia.
  - target: Scoliosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neuromuscular hypotonia and altered motor-pathway maturation predispose to
      scoliosis, although the specific axial mechanism in PTHS is unknown.
  - target: Ataxia
    description: >-
      Disrupted cerebellar and motor-network differentiation causes gait and
      truncal motor incoordination/ataxia.
  - target: Motor Stereotypies
    description: >-
      Altered corticostriatal neurodevelopment produces repetitive stereotypic
      hand and motor movements.
  - target: Autistic Behavior
    description: >-
      Perturbed cortical differentiation and circuit development underlie autism
      spectrum behavioral manifestations.
- name: Brainstem Respiratory Control Dysregulation
  description: >-
    Central autonomic respiratory-control dysfunction impairs awake breathing
    rhythm generation. In a Tcf4 truncation mouse model, disordered breathing is
    associated with selective loss of Phox2b-expressing putative expiratory
    parafacial neurons and compromised CO2/H+ chemosensitivity of retrotrapezoid
    nucleus neurons, and is improved by pharmacological inhibition of aberrantly
    upregulated central Nav1.8 channels.
  biological_scale: CELLULAR

    classified_by: CLINGEN
    external_id: CGGV:assertion_096f830c-0065-456a-9e26-db54fd157981-2018-05-02T170000.000Z
    evidence:
    - reference: CGGV:assertion_096f830c-0065-456a-9e26-db54fd157981-2018-05-02T170000.000Z
      reference_title: "TCF4 / Pitt-Hopkins syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "| TCF4 | HGNC:11634 | Pitt-Hopkins syndrome | MONDO:0012589 | AD | Definitive |"
      explanation: >-
        ClinGen Rett and Angelman-like Disorders Gene Curation Expert Panel
        classifies the autosomal dominant TCF4-Pitt-Hopkins syndrome relationship
        as Definitive.
  notes: >-
    Heterozygous, predominantly de novo pathogenic alterations in TCF4 (18q21.2)
    cause PTHS (rarely inherited from a mosaic or affected parent). Approximately
    70% of affected individuals carry sequence variants or small intragenic
    deletions/indels (nonsense, frameshift, splice-site, or missense variants
    clustering in the C-terminal bHLH DNA-binding/dimerization domain), and
    approximately 30% carry larger heterozygous 18q21.2 deletions encompassing
    part or all of TCF4.
  evidence:
  - reference: PMID:22934316
    reference_title: "Pitt-Hopkins Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of PTHS is established in a proband with suggestive findings
      and one of the following identified by molecular genetic testing: (1) a
      heterozygous TCF4 pathogenic variant or small intragenic deletions or
      indels (~70% of affected individuals) or (2) a heterozygous deletion of
      chromosome 18q21.2 involving TCF4 (~30% of affected individuals).
    explanation: >-
      Quantifies the ~70% sequence/intragenic-indel and ~30% 18q21.2-deletion
      contributions to TCF4-related PTHS.
  - reference: DOI:10.1111/cge.14206
    reference_title: "The recurrent <scp><i>TCF4</i></scp> missense variant p.(<scp>Arg389Cys</scp>) causes a neurodevelopmental disorder overlapping with but not typical for <scp>Pitt‐Hopkins</scp> syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "TCF4 haploinsufficiency by deletions, truncating variants or loss‐of‐function missense variants within the DNA‐binding and protein interacting bHLH domain causes Pitt‐Hopkins syndrome (PTHS)."
    explanation: Describes the TCF4 variant spectrum (deletions, truncating, and bHLH-domain loss-of-function missense) converging on haploinsufficiency.
  - reference: DOI:10.1186/s13023-024-03055-7
    reference_title: "Clinical and genetic characterization of 47 Chinese pediatric patients with Pitt–Hopkins syndrome: a retrospective study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The locus heterogeneity of the TCF4 gene in the patients was highlighted, emphasizing the significance of genetic studies for accurate diagnosis"
    explanation: A 47-patient cohort documents the allelic spectrum of pathogenic TCF4 variants in PTHS.
diagnosis:
- name: Molecular Genetic Testing for TCF4 and Peripheral-Blood DNA Methylation Episignature
  description: >-
    Diagnosis is established in a proband with suggestive clinical findings by
    molecular genetic testing identifying a heterozygous TCF4 sequence variant
    or intragenic indel (~70%) or a chromosome 18q21.2 deletion involving TCF4
    (~30%) via multigene panel, exome/genome sequencing, or chromosomal
    microarray. A sensitive TCF4-specific peripheral-blood DNA methylation
    episignature enables functional reclassification of TCF4 variants of
    uncertain significance.
  presence: Positive in affected individuals
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:22934316
    reference_title: "Pitt-Hopkins Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of PTHS is established in a proband with suggestive findings
      and one of the following identified by molecular genetic testing: (1) a
      heterozygous TCF4 pathogenic variant or small intragenic deletions or
      indels (~70% of affected individuals) or (2) a heterozygous deletion of
      chromosome 18q21.2 involving TCF4 (~30% of affected individuals).
    explanation: Establishes molecular genetic testing for TCF4 sequence variants and 18q21.2 deletions as the diagnostic standard.
  - reference: PMID:30677142

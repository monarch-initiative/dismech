pathophysiology:
- name: TCF4 Haploinsufficiency
  description: >-
    Heterozygous loss-of-function variants (nonsense, frameshift, splice-site,
    whole/partial gene deletions) and loss-of-function or dominant-negative
    missense variants in the C-terminal bHLH domain reduce functional TCF4
    dosage. TCF4 is a class I bHLH E-protein that heterodimerizes with
    tissue-specific class II bHLH factors and binds E-box cis-regulatory
    elements; heterozygous reduction in functional TCF4 protein disrupts
    transcriptional programs across the developing central and enteric nervous
    systems and craniofacial structures.
  biological_scale: MOLECULAR

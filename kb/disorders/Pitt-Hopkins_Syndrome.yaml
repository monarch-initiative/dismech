  - reference: DOI:10.1038/s41467-021-26263-2
    reference_title: "Disordered breathing in a Pitt-Hopkins syndrome model involves Phox2b-expressing parafacial neurons and aberrant Nav1.8 expression"
    supports: SUPPORT

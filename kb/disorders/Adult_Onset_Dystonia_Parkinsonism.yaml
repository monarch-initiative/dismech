pathophysiology:
- name: PLA2G6 Functional Dysregulation
  description: >-
    Biallelic PLA2G6 variants alter group VIA calcium-independent phospholipase
    A2 beta function in adult PLAN. Reported parkinsonism alleles are mainly
    nontruncating, and biochemical assays can retain catalytic activity;
    altered regulation, protein interactions, or context-specific membrane
    homeostasis are therefore more conservative than an asserted catalytic
    loss-of-function mechanism.

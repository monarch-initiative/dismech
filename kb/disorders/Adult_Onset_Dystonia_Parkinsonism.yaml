- reference: PMID:18570303
  title: Characterization of PLA2G6 as a locus for dystonia-parkinsonism.
  found_in:
  - Adult_Onset_Dystonia_Parkinsonism-deep-research-fallback.md
  findings:
  - statement: >-
      Homozygosity mapping identified PLA2G6 mutations in families with
      adult-onset levodopa-responsive dystonia-parkinsonism.
    supporting_text: >-
      METHODS: We used homozygosity mapping and mutational analysis in three
      individuals from two unrelated families who presented with adult-onset
      levodopa-responsive dystonia-parkinsonism, pyramidal signs and
      cognitive/psychiatric features, and cerebral and cerebellar atrophy on
      magnetic resonance imaging but absent iron in the basal ganglia. RESULTS:
      We identified areas of homozygosity on chromosome 22 and, subsequently,
      PLA2G6 mutations.
    evidence:
    - reference: PMID:18570303
      reference_title: "Characterization of PLA2G6 as a locus for dystonia-parkinsonism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

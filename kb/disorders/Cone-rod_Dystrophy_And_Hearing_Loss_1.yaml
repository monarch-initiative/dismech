name: Cone-rod dystrophy and hearing loss 1
creation_date: "2026-09-11T11:40:00Z"
category: Mendelian
synonyms:
- CRDHL1
- CEP78-associated syndrome
- cone-rod dystrophy with hearing loss, CEP78-related
description: >-
  Cone-rod dystrophy and hearing loss 1 is an autosomal recessive ciliopathy
  caused by biallelic CEP78 variants. It pairs a childhood- or
  adolescent-onset, cone-predominant cone-rod dystrophy with bilateral,
  postlingual, progressive sensorineural hearing loss, and in some affected
  males with sperm abnormalities causing infertility.

  The unifying mechanism is centriolar. CEP78 sits at the distal end of the
  mature centriole, recruited there by the CEP350-FOP scaffold, and it acts on
  CP110 through the EDD1-DYRK2-DDB1 ubiquitin ligase. Cells lacking CEP78 have
  elevated CP110 and disordered ciliogenesis, and patient fibroblasts and nasal
  brushings show elongated primary cilia.

  How CEP78 acts on that ligase is disputed, and the entry does not pick a side.
  The two papers that characterise it reach opposite conclusions - one has CEP78
  inhibiting the ligase, which would make CEP78 loss increase CP110
  ubiquitination, while the other has CEP78 recruiting it, which would make
  CEP78 loss decrease ubiquitination and so raise CP110. The elevated-CP110
  observation is common ground and is what the pathograph rests on; the
  direction of the ubiquitination step is recorded as an open disagreement
  rather than resolved by picking the paper that fits. The three organs that fail
  are the three whose post-mitotic cells depend most on a centriole-derived
  structure: the photoreceptor connecting cilium, the cochlear hair cell, and
  the sperm flagellum. Why the eye is affected first and hardest has a partial
  anatomical answer - CEP78 labels cone inner segments more intensely than rods
  - which is unusually satisfying for a ciliopathy.

  It is deliberately not Usher syndrome, and the distinction is clinical as
  well as genetic: Usher syndrome is rod-first with congenital hearing loss,
  while this is cone-first with postlingual, progressive loss. Misdiagnosis as
  Usher syndrome is documented and the founding authors flag it.

  On scope. MONDO:0014980 "cone-rod dystrophy and hearing loss" xrefs OMIM
  phenotypic series OMIMPS:617236 and has exactly two descendants: this entry's
  term and MONDO:0020780 (CEP250), which dismech already curates as
  Cone-rod_Dystrophy_And_Hearing_Loss_2. Curating the series term would have
  duplicated that entry, so this is the CEP78 member, named to match its
  sibling. See notes.

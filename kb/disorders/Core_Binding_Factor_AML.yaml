    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rising MRD levels on serial monitoring accurately predicted hematologic relapse."
    explanation: >-
      Serial fusion-transcript MRD monitoring predicts hematologic relapse,
      supporting MRD-guided decisions about additional therapy.
- name: Allogeneic Stem Cell Transplantation
  description: >-
    Generally reserved for relapsed CBF-AML or patients with persistent MRD
    after consolidation. Not routinely recommended in first remission given
    excellent outcomes with chemotherapy alone.
  treatment_term:
    preferred_term: Allogeneic Stem Cell Transplantation
    term:
      id: NCIT:C201466
      label: Allogeneic Stem Cell Transplantation

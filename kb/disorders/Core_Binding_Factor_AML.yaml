- name: Differentiation Block at Myeloid Stage
  biological_scale: CELLULAR
  description: >-
    CBF fusion proteins recruit corepressor complexes including HDACs and NCoR,
    converting CBF from a transcriptional activator to a repressor. This silences
    differentiation genes while partially preserving some myeloid identity,
    resulting in blasts with partial maturation features.
  evidence:
  - reference: PMID:22032582
    reference_title: "Core-binding factor acute myeloid leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the cytogenetic rearrangements disrupt genes that encode subunits of core-binding factor, a transcription factor that functions as an essential regulator of normal hematopoiesis"
    explanation: >-
      Disruption of core-binding factor, an essential regulator of normal
      hematopoiesis, underlies the block in myeloid differentiation captured by
      this node.
  cell_types:
  - preferred_term: myeloblast
    term:
      id: CL:0000835
      label: myeloblast
  biological_processes:
  - preferred_term: granulocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0030851
      label: granulocyte differentiation
  downstream:
  - target: Leukemic Blast Accumulation
    description: Arrested cells accumulate in bone marrow and blood
- name: Self-Renewal Maintenance
  biological_scale: CELLULAR
  description: >-
    CBF fusion proteins maintain expression of self-renewal genes while blocking
    differentiation. Additional mutations, particularly in receptor tyrosine
    kinases (KIT, FLT3), provide proliferative signals that cooperate with
    CBF fusions to cause overt leukemia.
  genes:
  - preferred_term: KIT
    term:
      id: hgnc:6342
      label: KIT
  molecular_functions:
  - preferred_term: transmembrane receptor protein tyrosine kinase activity
    modifier: INCREASED
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
  cell_types:
  - preferred_term: myeloid progenitor cell
    term:
      id: CL:0000049
      label: common myeloid progenitor
  evidence:
  - reference: PMID:16921041
    reference_title: "Adverse prognostic significance of KIT mutations in adult acute myeloid leukemia with inv(16) and t(8;21): a Cancer and Leukemia Group B Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "activated KIT potentially can be targeted with novel tyrosine kinase inhibitors"
    explanation: >-
      Activated KIT is a cooperating receptor-tyrosine-kinase driver in CBF-AML,
      consistent with this node's model that RTK mutations supply proliferative
      signals alongside the CBF fusion.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Leukemic Blast Accumulation
    description: Enhanced self-renewal with blocked differentiation drives disease
- name: Leukemic Blast Accumulation
  biological_scale: TISSUE
  description: >-
    The combination of differentiation block, maintained self-renewal, and
    cooperating mutations leads to accumulation of immature myeloid blasts
    in the bone marrow, causing bone marrow failure and circulating leukemia.
  evidence:
  - reference: PMID:23590662
    reference_title: "Acute myeloid leukemia: advances in diagnosis and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an aggressive myeloid neoplasm characterized by ≥20% myeloblasts in the blood or bone marrow"
    explanation: >-
      Acute myeloid leukemia is defined by accumulation of >=20% myeloblasts in
      blood or marrow, the leukemic blast accumulation described by this node.
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  cell_types:
  - preferred_term: myeloblast
    term:
      id: CL:0000835
      label: myeloblast
  downstream:
  - target: Anemia
    description: Marrow blast accumulation suppresses normal erythropoiesis, causing anemia.
    evidence:
    - reference: PMID:39735012
      reference_title: "Characterization of Acute Myeloid Leukemia With RUNX1/RUNX1T1 Gene Rearrangement: Clinical, Hematological, and Morphological Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bone marrow aspiration showed erythropoiesis, thrombopoiesis, and
        myelopoiesis depressed in all positive cases of acute myeloblastic
        leukemia with maturation (AML-M2).
      explanation: >-
        Marrow blast accumulation depresses erythropoiesis across RUNX1/RUNX1T1
        CBF-AML cases, resulting in anemia.
  - target: Thrombocytopenia
    description: Marrow blast accumulation suppresses megakaryopoiesis and thrombopoiesis.
    evidence:
    - reference: PMID:39735012
      reference_title: "Characterization of Acute Myeloid Leukemia With RUNX1/RUNX1T1 Gene Rearrangement: Clinical, Hematological, and Morphological Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bone marrow aspiration showed erythropoiesis, thrombopoiesis, and
        myelopoiesis depressed in all positive cases of acute myeloblastic
        leukemia with maturation (AML-M2).
      explanation: >-
        Depressed marrow thrombopoiesis in CBF-AML directly underlies
        thrombocytopenia.
  - target: Leukocytosis
    description: Clonal expansion and egress of leukemic blasts elevate peripheral leukocyte counts.
    evidence:
    - reference: PMID:39735012
      reference_title: "Characterization of Acute Myeloid Leukemia With RUNX1/RUNX1T1 Gene Rearrangement: Clinical, Hematological, and Morphological Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The average count of hemoglobin, platelets, and total leukocyte count was 8 g/dl, 41.5×109/L, and 71.4×109/L, respectively."
      explanation: >-
        Circulating leukemic burden elevates mean total leukocyte count in
        CBF-AML patients.
  - target: Recurrent Infections
    description: Leukemic marrow failure impedes normal granulocyte production and predisposes to severe infections.
    evidence:
    - reference: PMID:23901108
      reference_title: "Acute myeloid leukemia does not deplete normal hematopoietic stem cells but induces cytopenias by impeding their differentiation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Acute myeloid leukemia (AML) induces bone marrow (BM) failure in
        patients, predisposing them to life-threatening infections and bleeding.
      explanation: >-
        AML-induced marrow failure impairs normal downstream myeloid production
        and predisposes patients to severe infections.
  - target: Fatigue
    description: Anemia and systemic leukemic burden produce fatigue at presentation.
    evidence:
    - reference: PMID:35907896
      reference_title: "Acute hepatitis-like presentation with cholestasis of CBFB-MYH11-positive acute myeloid leukemia in an adult male: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A 38-year-old Caucasian man presented with fever, cough, and mild
        fatigue. Laboratory workup showed anemia, thrombocytopenia, severe
        leukocytosis, transaminitis, and hyperbilirubinemia.
      explanation: >-
        Documents fatigue accompanying marrow cytopenias and leukemic burden in
        CBFB-MYH11 CBF-AML.
  - target: Hepatomegaly
    description: Extramedullary sinusoidal and portal infiltration by leukemic blasts causes liver enlargement.
    evidence:
    - reference: PMID:35907896
      reference_title: "Acute hepatitis-like presentation with cholestasis of CBFB-MYH11-positive acute myeloid leukemia in an adult male: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Imaging of the abdomen (ultrasound and magnetic resonance) showed
        hepatomegaly, splenomegaly, upper limits portal veins diameters,
        increased thickness of the gallbladder wall, and significant abdominal
        lymph nodes. Peripheral blood smear and bone marrow evaluation were
        consistent with acute myeloid leukemia, and liver biopsy showed massive
        sinusoidal and portal infiltration by leukemic cells.
      explanation: >-
        Biopsy-proven sinusoidal and portal leukemic blast infiltration directly
        causes hepatomegaly in CBFB-MYH11 CBF-AML.

name: Acute Myeloid Leukemia, Core Binding Factor
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Core binding factor (CBF) acute myeloid leukemia encompasses two favorable-risk
  AML subtypes defined by chromosomal abnormalities affecting the CBF transcription
  factor complex: t(8;21)(q22;q22) creating RUNX1-RUNX1T1 fusion, and inv(16)(p13.1q22)
  or t(16;16)(p13.1;q22) creating CBFB-MYH11 fusion. CBF is essential for definitive
  hematopoiesis, and these fusion proteins act as dominant-negative inhibitors of
  normal CBF function, blocking myeloid differentiation. CBF-AML represents 15-20%
  of adult AML and has favorable prognosis with intensive chemotherapy, particularly
  with high-dose cytarabine consolidation.
categories:
- Hematologic Malignancy
- Acute Leukemia
- Molecularly Defined Cancer
- Favorable Risk AML
synonyms:
- CBF-AML
- core-binding factor AML
- core-binding factor acute myeloid leukemia
- CBF acute myeloid leukemia
- core binding factor acute myelogenous leukemia
parents:
- acute myeloid leukemia
has_subtypes:
- name: AML with t(8;21)(q22;q22) RUNX1-RUNX1T1
  description: >-
    AML characterized by the t(8;21) translocation fusing RUNX1 (formerly AML1)
    on chromosome 21 with RUNX1T1 (formerly ETO) on chromosome 8. Typically shows
    maturation to promyelocyte/myelocyte stage. Associated with Auer rods, CD19
    expression, and loss of chromosome Y or del(9q). Favorable prognosis with
    intensive chemotherapy.
  evidence:
  - reference: PMID:22032582
    reference_title: "Core-binding factor acute myeloid leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rearrangements t(8;21) and inv(16) involve the RUNX1/RUNX1T1 ( AML1-ETO ) and CBFB/MYH11 genes, respectively."
    explanation: >-
      The t(8;21) rearrangement generates the RUNX1/RUNX1T1 (AML1-ETO) fusion
      defining this CBF-AML subtype.
  - reference: PMID:16110030
    reference_title: "Prognostic factors and outcome of core binding factor acute myeloid leukemia patients with t(8;21) differ from those of patients with inv(16): a Cancer and Leukemia Group B study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When the prognostic impact of race, secondary cytogenetic abnormalities,
      sex, and response to salvage treatment is considered, t(8;21) and inv(16)
      AMLs seem to be distinct clinical entities and should be stratified and
      reported separately.
    explanation: >-
      Large prospective CALGB cohort analysis demonstrates distinct clinical and
      salvage-survival profiles between t(8;21) and inv(16) CBF-AML subtypes.
- name: AML with inv(16)(p13.1q22) or t(16;16) CBFB-MYH11
  description: >-
    AML characterized by inv(16) or t(16;16) fusing CBFB (core binding factor beta)
    with MYH11 (smooth muscle myosin heavy chain). Associated with abnormal bone
    marrow eosinophils containing abnormal granules. Typically presents with younger
    age and may have extramedullary disease. Favorable prognosis.
  evidence:
  - reference: PMID:22032582
    reference_title: "Core-binding factor acute myeloid leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rearrangements t(8;21) and inv(16) involve the RUNX1/RUNX1T1 ( AML1-ETO ) and CBFB/MYH11 genes, respectively."
    explanation: >-
      The inv(16)/t(16;16) rearrangement generates the CBFB/MYH11 fusion
      defining this CBF-AML subtype.
  - reference: PMID:16110030
    reference_title: "Prognostic factors and outcome of core binding factor acute myeloid leukemia patients with t(8;21) differ from those of patients with inv(16): a Cancer and Leukemia Group B study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After adjusting for covariates, patients with t(8;21) had shorter OS
      (hazard ratio [HR] = 1.5; P = .045) and survival after first relapse
      (HR = 1.7; P = .009) than patients with inv(16).
    explanation: >-
      CALGB outcomes show superior overall and post-relapse survival for the
      inv(16) subtype relative to t(8;21) AML.
prevalence:
- population: Europe (AML with t(8;21)(q22;q22) subtype)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Orphanet reports an annual incidence below 1 per 1,000,000 in Europe for
    the t(8;21)(q22;q22) subtype (ORPHA:102724). Across acute myeloid leukemia
    cohorts overall, combined core-binding factor AML (t(8;21) plus
    inv(16)/t(16;16)) accounts for up to 12-15% of all AML cases.
  evidence:
  - reference: ORPHA:102724
    reference_title: "Acute myeloid leukemia with t(8;21)(q22;q22) translocation"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Europe | Annual incidence | OTHER"
    explanation: >-
      Orphanet reports European annual incidence for the t(8;21)(q22;q22)
      subtype within CBF-AML.
  - reference: PMID:34135311
    reference_title: "Core binding factor acute myelogenous leukemia-2021 treatment algorithm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Core-binding factor (CBF) acute myeloid leukemia (AML), comprising up to
      12–15% of all AML cases ... is characterized by the presence of either
      t(8;21)(q22;q22) or inv(16)(p13q22)/t(16;16), which leads to the
      formation of RUNX1/RUNX1T1 (AML1/ETO) ... and CBFB/MYH11 ... fusion genes
      respectively.
    explanation: >-
      Clinical review quantifies combined CBF-AML as accounting for up to 12-15%
      of all acute myeloid leukemia cases.
pathophysiology:
- name: CBF Transcription Factor Complex Disruption
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    allelic_hit_role: FIRST_HIT
  description: >-
    The core binding factor complex consists of RUNX1 (alpha subunit) and CBFB
    (beta subunit). RUNX1 binds DNA while CBFB stabilizes this binding. Both
    t(8;21) and inv(16) produce somatic fusion proteins (RUNX1::RUNX1T1 or
    CBFB::MYH11) in myeloid progenitors that dominantly inhibit normal CBF
    transcriptional activity, disrupting expression of genes essential for
    myeloid differentiation.
  genes:
  - preferred_term: RUNX1
    term:
      id: hgnc:10471
      label: RUNX1
  - preferred_term: RUNX1T1
    term:
      id: hgnc:1535
      label: RUNX1T1
  - preferred_term: CBFB
    term:
      id: hgnc:1539
      label: CBFB
  - preferred_term: MYH11
    term:
      id: hgnc:7569
      label: MYH11
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: DECREASED
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence:
  - reference: PMID:41152985
    reference_title: "Resolving intra-tumor heterogeneity and clonal evolution of core-binding factor acute myeloid leukemia patients with single-cell resolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "core-binding factor acute myeloid leukemia patients, defined by the presence of a RUNX1::RUNX1T1 or CBFB::MYH11 fusion gene."
    explanation: This abstract defines CBF-AML by RUNX1::RUNX1T1 or CBFB::MYH11 fusions, supporting the core-binding factor disruption described.
  - reference: PMID:34135311
    reference_title: "Core binding factor acute myelogenous leukemia-2021 treatment algorithm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Translocation events alter the normal DNA binding of the heterodimer and
      create alternate binding, leading to disruption of the normal
      transcription program and resulting in maturation arrest
    explanation: >-
      Confirms that somatic CBF fusion proteins impair normal heterodimer DNA
      binding and RNA polymerase II transcriptional programming.

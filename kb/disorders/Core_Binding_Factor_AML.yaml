biochemical:
- name: Cytogenetic Analysis
  notes: >-
    Karyotyping detects t(8;21)(q22;q22) or inv(16)(p13.1q22)/t(16;16)(p13.1;q22).
    FISH may be needed for cryptic rearrangements. These findings define the
    diagnosis regardless of blast percentage.
  evidence:
  - reference: PMID:22032582
    reference_title: "Core-binding factor acute myeloid leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the cytogenetic fusion transcripts are considered diagnostic of acute leukemia even when the marrow blast count is less than 20%"
    explanation: >-
      The defining cytogenetic/fusion abnormalities establish the CBF-AML
      diagnosis regardless of blast percentage.
- name: Molecular Fusion Detection
  notes: >-
    RT-PCR detects RUNX1-RUNX1T1 or CBFB-MYH11 fusion transcripts, useful for
    diagnosis and minimal residual disease monitoring. MRD assessment guides
    post-remission therapy decisions.
  evidence:
  - reference: PMID:22875911
    reference_title: "Minimal residual disease monitoring by quantitative RT-PCR in core binding factor AML allows risk stratification and predicts relapse: results of the United Kingdom MRC AML-15 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRD monitoring by quantitative RT-PCR at specific time points in CBF AML allows identification of patients at high risk of relapse"
    explanation: >-
      Quantitative RT-PCR of CBF fusion transcripts enables minimal residual
      disease detection and relapse-risk stratification in CBF-AML.
genetic:
- name: RUNX1-RUNX1T1 Fusion
  association: Somatic Oncogenic Fusion
  notes: >-
    The t(8;21)(q22;q22) translocation creates a fusion between RUNX1 (AML1)
    on chromosome 21 and RUNX1T1 (ETO) on chromosome 8. The fusion protein
    recruits corepressors, converting CBF to a transcriptional repressor.
    Defines favorable-risk AML.
  evidence:
  - reference: PMID:22032582
    reference_title: "Core-binding factor acute myeloid leukemia."
    supports: SUPPORT
    snippet: "The rearrangements t(8;21) and inv(16) involve the RUNX1/RUNX1T1 ( AML1-ETO ) and CBFB/MYH11 genes, respectively."
    explanation: "Abstract states RUNX1/RUNX1T1 is involved in the t(8;21) rearrangement defining CBF-AML."
- name: CBFB-MYH11 Fusion
  association: Somatic Oncogenic Fusion
  notes: >-
    inv(16)(p13.1q22) or t(16;16)(p13.1;q22) fuses CBFB with MYH11. The fusion
    protein sequesters RUNX1 in the cytoplasm and disrupts normal CBF function.
    Associated with abnormal eosinophils. Defines favorable-risk AML.
  evidence:
  - reference: PMID:22032582
    reference_title: "Core-binding factor acute myeloid leukemia."
    supports: SUPPORT
    snippet: "The rearrangements t(8;21) and inv(16) involve the RUNX1/RUNX1T1 ( AML1-ETO ) and CBFB/MYH11 genes, respectively."
    explanation: "Abstract states CBFB/MYH11 is involved in the inv(16) rearrangement defining CBF-AML."
- name: KIT
  gene_term:
    preferred_term: KIT
    term:
      id: hgnc:6342
      label: KIT
  association: Cooperating Mutation
  notes: >-
    KIT mutations occur in 20-30% of CBF-AML cases, particularly in exon 17.
    May confer adverse prognosis within CBF-AML and represents a potential
    therapeutic target.
  evidence:
  - reference: PMID:16921041
    reference_title: "Adverse prognostic significance of KIT mutations in adult acute myeloid leukemia with inv(16) and t(8;21): a Cancer and Leukemia Group B Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients with inv(16), 29.5% had mutKIT (16% with mutKIT17 and 13% with sole mutKIT8). Among patients with t(8;21), 22% had mutKIT (18% with mutKIT17 and 4% with sole mutKIT8)."
    explanation: >-
      KIT mutations (predominantly exon 17) occurred in 22-29.5% of CBF-AML
      patients, supporting the 20-30% frequency and exon-17 predominance, and
      conferred higher relapse risk (adverse prognosis).
treatments:
- name: Intensive Chemotherapy (7+3) with High-Dose Cytarabine Consolidation
  description: >-
    Standard induction with 7 days cytarabine and 3 days anthracycline followed
    by multiple cycles of high-dose cytarabine (HiDAC) consolidation. HiDAC is
    particularly effective for CBF-AML and is the standard of care for fit
    patients, achieving 60-70% cure rates without transplant.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:15020610
    reference_title: "Repetitive cycles of high-dose cytarabine benefit patients with acute myeloid leukemia and inv(16)(p13q22) or t(16;16)(p13;q22): results from CALGB 8461."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CIR was significantly decreased in patients assigned to receive three to four cycles of HDAC compared with patients assigned to one course"
    explanation: >-
      Repetitive high-dose cytarabine consolidation significantly lowered the
      cumulative incidence of relapse in CBF-AML, supporting HiDAC as standard
      consolidation.
- name: Venetoclax with Hypomethylating Agent
  description: >-
    Venetoclax in combination with hypomethylating agents (azacitidine or
    decitabine) is an effective treatment option for CBF-AML patients who are
    unfit for intensive chemotherapy. Particularly effective for inv(16)/CBFB-MYH11
    disease, with high response rates and rapid MRD negativity. Less effective in
    t(8;21)/RUNX1-RUNX1T1 AML, especially in patients with KIT mutations.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: venetoclax
      term:
        id: CHEBI:133021
        label: venetoclax
    - preferred_term: azacitidine
      term:
        id: NCIT:C288
        label: Azacitidine
  evidence:
  - reference: DOI:10.1038/s41408-023-00928-1
    reference_title: "Efficacy of venetoclax combined with hypomethylating agents in young, and unfit patients with newly diagnosed core binding factor acute myeloid leukemia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For 17 inv(16)/t(16;16) patients, all patients achieved CR/CRi with a median transcript level of CBFB::MYH11 340 copies (range 0–20,650) after one cycle of treatment."
    explanation: >-
      In a retrospective cohort of 30 CBF-AML patients treated with venetoclax +
      HMA, all 17 inv(16)/t(16;16) patients achieved complete remission with rapid
      fusion-transcript reduction and high rates of MRD negativity, supporting
      efficacy in inv(16) subtype.
  - reference: DOI:10.1038/s41408-023-00928-1
    reference_title: "Efficacy of venetoclax combined with hypomethylating agents in young, and unfit patients with newly diagnosed core binding factor acute myeloid leukemia"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "For 13 t(8;21) patients, CR/CRi was achieved in 4 patients (31%) after a single course of induction therapy."
    explanation: >-
      In the same cohort, t(8;21) AML showed inferior response (31% CR/CRi rate),
      especially in patients with KIT D816 mutations, indicating suboptimal efficacy
      in this CBF-AML subtype.
  - reference: DOI:10.21203/rs.3.rs-5301043/v1
    reference_title: "Efficacy of venetoclax and azacitidine based therapy in favorable-risk unfit acute myeloid leukemia: a real-world study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CR/CRi rate for RUNX1::RUNX1T1, CBFb::MYH11... was 35.7% (5/14), 90.9% (10/11)"
    explanation: >-
      A real-world analysis of 70 favorable-risk unfit AML patients confirmed differential
      efficacy: CBFB::MYH11 achieved 90.9% CR/CRi vs. 35.7% in RUNX1::RUNX1T1 AML,
      with MRD-negative status predicting superior 2-year OS and EFS.

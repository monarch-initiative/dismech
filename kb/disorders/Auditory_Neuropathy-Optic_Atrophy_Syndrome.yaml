    snippet: "Here, we report on eight subjects from four independent families affected by auditory neuropathy and optic atrophy."
    explanation: Auditory neuropathy in all eight founding patients.
- category: Ophthalmological
  name: Optic atrophy
  description: >
    Bilateral optic atrophy, clinical in five of the eight founding patients and
    detectable only on electrophysiology or optical coherence tomography in the other
    three. It is not universal across the spectrum: one Chinese patient had no visual
    problem over sixteen years of follow-up.
  phenotype_term:

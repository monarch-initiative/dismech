genetic:
- name: FDXR
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: FDXR
    term:
      id: hgnc:3642
      label: FDXR
  variant_origin: GERMLINE
  notes: >
    Over eighty per cent of reported variants are missense, and eight cluster in the
    FAD-binding site. Founding-cohort alleles include c.916C>T p.(Arg306Cys), homozygous
    in a consanguineous Tunisian family, c.724C>T p.(Arg242Trp), c.979C>A p.(Arg327Ser),
    c.643C>G p.(Leu215Val), c.1429G>A p.(Glu477Lys) and the nonsense c.1255C>T
    p.(Gln419*). A recurrent hotspot allele accounts for a large share of alleles in one
    cohort and is enriched in people of Mexican ancestry, whose carrier frequency is
    reported at about one in 185; that study proposes ancestry-based carrier screening.
    **The hotspot's protein position is written differently by different groups**
    (p.Arg386Trp in two reports, p.R392W in a third) because they use different reference
    transcripts, and the cohorts cite NM_024417.4 and NM_024417.5. Positions here are as
    each source writes them and must be reconciled against a transcript before reuse.
    No biallelic truncating genotype has been reported. Pathogenicity has been supported
    functionally by complementation of a yeast arh1 deletion, which the same group later
    used to reclassify variants of uncertain significance. ClinGen has no gene-disease
    validity record for FDXR.
  evidence:
  - reference: PMID:28965846
    reference_title: "FDXR Mutations Cause Sensorial Neuropathies and Expand the Spectrum of Mitochondrial Fe-S-Synthesis Diseases."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Functional complementation in a yeast strain in which ARH1, the human FDXR ortholog, was deleted established the pathogenicity of these mutations."
    explanation: Yeast complementation established pathogenicity of the founding alleles.
  - reference: PMID:33348459
    reference_title: "Expanding the clinical and genetic spectrum of FDXR deficiency by functional validation of variants of uncertain significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "over 80% of these variants are missense"
    explanation: The variant spectrum is predominantly missense, consistent with hypomorphic alleles only.
  - reference: PMID:39669623
    reference_title: "Clinical study of ferredoxin-reductase-related mitochondriopathy: Genotype-phenotype correlation and proposal of ancestry-based carrier screening in the Mexican population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype correlation and proposal of ancestry-based carrier screening  in the Mexican population"
    explanation: The ancestry-enriched hotspot allele and the screening proposal; this is the paper's title, cited for the proposal's existence rather than as a finding.
diagnosis:
- name: Auditory electrophysiology with otoacoustic emissions
  description: >
    Severely impaired or absent auditory brainstem responses with preserved otoacoustic
    emissions, and speech discrimination worse than the pure-tone audiogram predicts, is
    the pattern that identifies a neural rather than cochlear lesion and should prompt
    FDXR testing when optic atrophy accompanies it.
  evidence:
  - reference: PMID:28965846
    reference_title: "FDXR Mutations Cause Sensorial Neuropathies and Expand the Spectrum of Mitochondrial Fe-S-Synthesis Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "eight subjects from four independent families affected by auditory neuropathy and optic atrophy"
    explanation: The paired sensory presentation that defines the diagnostic situation.
- name: Exome sequencing
  description: Whole-exome sequencing established the diagnosis in both the founding families and the larger optic-atrophy cohort.
  evidence:
  - reference: PMID:28965846
    reference_title: "FDXR Mutations Cause Sensorial Neuropathies and Expand the Spectrum of Mitochondrial Fe-S-Synthesis Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed biallelic mutations in FDXR in affected subjects of each family."
    explanation: Exome sequencing was the diagnostic route.
differential_diagnoses:
- name: Multiple mitochondrial dysfunctions syndrome 9B
  description: >
    The severe end of the same FDXR spectrum, with early-onset developmental regression,
    seizures and early death. Curated separately in dismech.
  disease_term:
    preferred_term: multiple mitochondrial dysfunctions syndrome 9b
    term:
      id: MONDO:0971174
      label: multiple mitochondrial dysfunctions syndrome 9b
  distinguishing_features:
  - Early-onset neurodegeneration with developmental regression and early death, rather than isolated sensory impairment
  - Associated with the homozygous hotspot genotype in one cohort
- name: Acute inflammatory peripheral neuropathy
  description: >
    The acquired neuropathy this disease can mimic when peripheral involvement begins
    acutely, which is the differential a 2023 review was written to address.
  distinguishing_features:
  - No FDXR variants, and no accompanying optic atrophy or auditory neuropathy
  evidence:
  - reference: PMID:37046037
    reference_title: "FDXR-associated disease: a challenging differential diagnosis with inflammatory peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FDXR-associated disease: a challenging differential diagnosis with inflammatory  peripheral neuropathy"
    explanation: The review's title states the differential; it is cited here for the differential's existence rather than as a finding.
- name: FDX2-related mitochondrial myopathy
  description: >
    Deficiency of ferredoxin 2, the protein FDXR passes its electrons to, which presents
    as a myopathy with exercise intolerance rather than as a sensory syndrome.
  disease_term:
    preferred_term: hereditary myopathy with lactic acidosis due to ISCU deficiency
    term:
      id: MONDO:0009706
      label: hereditary myopathy with lactic acidosis due to ISCU deficiency
  distinguishing_features:
  - Myopathy with exertional symptoms rather than auditory neuropathy and optic atrophy
  - Mitochondrial iron accumulation is reported absent in FDX2 patient muscle, unlike in FDXR disease
  notes: >-
    The disease_term bound here is the ISCU myopathy, the dismech entry that covers the
    muscle Fe-S myopathies; the FDX2 entry itself has no separate MONDO term in this
    repository's mapping, so the nearest curated concept is used and named in the
    description.
discussions:
- discussion_id: anoa_sensory_selectivity
  prompt: >-
    Why does an electron-supply defect present in every mitochondrion strike the auditory
    and optic projections first, and leave most other tissues intact in the milder form?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Sensory Neuron and Axonal Transport Failure
  - pathophysiology#Deficient Respiratory Chain and Cluster-Dependent Enzyme Activity
  rationale: >-
    Seven of the eight founding patients had isolated sensory defects, and the mouse work
    locates the lesion in axonal transport rather than in cell body metabolism, which is a
    real candidate explanation: the longest, most transport-dependent projections would be
    the first to fail when ATP falls and reactive oxygen species rise. But the cochlear
    and optic projections are not the body's longest, and the peripheral nerves, which
    are, are involved in only about a quarter of patients. So transport length alone does
    not rank the tissues correctly. No study has compared transport failure across neuron
    classes in the same model, and the entry therefore records the edge from the
    bioenergetic deficit to the sensory failure with unknown intermediates.
  evidence:
  - reference: PMID:32499495
    reference_title: "Integrated analysis of the molecular pathogenesis of FDXR-associated disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we demonstrate that FDXR mutation leads to significant optic transport defects that are likely to underlie optic atrophy"
    explanation: The transport hypothesis, demonstrated for the optic projection in the mouse.
  - reference: PMID:37046037
    reference_title: "FDXR-associated disease: a challenging differential diagnosis with inflammatory peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "significant incidence of sensorimotor peripheral polyneuropathy (22.72%) and  ataxia (43.18%)"
    explanation: The long peripheral nerves are involved in a minority, which is what a simple length-dependence model would not predict.
  proposed_experiments:
  - experiment_id: anoa_transport_across_neuron_classes
    name: Axonal transport across neuron classes in one FDXR model
    experiment_design: TARGETED_PERTURBATION
    executability: SPECIFIED
    description: >-
      In a single hypomorphic FDXR mouse line, measure anterograde and retrograde
      mitochondrial transport rates, ATP and reactive oxygen species in retinal ganglion
      cells, spiral ganglion neurons, dorsal root ganglion neurons and cortical neurons
      from the same animals, with axon length and mitochondrial density recorded for each.
    would_support:
    - pathophysiology#Sensory Neuron and Axonal Transport Failure
    supporting_outcome:
    - Transport failure ranks the neuron classes in the same order as the clinical involvement, with retinal ganglion and spiral ganglion neurons worst affected despite not being the longest
    refuting_outcome:
    - Transport failure that tracks axon length alone, which would leave the auditory and optic predominance unexplained and point to a tissue-specific factor outside transport
- discussion_id: anoa_retinal_vascular_finding
  prompt: >-
    Is the retinal vascular occlusion reported in one ocular cohort a genuine feature of
    FDXR disease, and if so what produces it?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Retinal Degeneration With Vascular Attenuation
  - phenotypes#Attenuation of retinal blood vessels
  rationale: >-
    Three of five patients in one Chinese ocular cohort had attenuated retinal vessels
    appearing as white lines, with complete occlusion and peripheral non-perfusion on
    angiography, and those authors propose it as a distinct feature of the disease. It has
    not been described in the founding cohort or the other series, so it is either a real
    feature that earlier ophthalmological examination was not looking for, a consequence
    of the retinal degeneration rather than a parallel lesion, or a finding specific to
    those genotypes. The node is therefore left with no incoming mechanism edge. The
    question matters because a vascular component would make this the only one of the
    inherited iron-sulfur disorders with an occlusive vasculopathy, and would raise
    whether the same process acts elsewhere.
  evidence:
  - reference: PMID:37481223
    reference_title: "FDXR-associated disease in a Chinese cohort: Unraveling expanded ocular phenotypes and genetic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fundus fluorescein angiography (FFA) further revealed vascular  abnormalities including delayed filling, completely occluded retinal  vasculature, and severe retinal vascular nonperfusion of the peripheral retina."
    explanation: The angiographic findings behind the proposal.
  proposed_experiments:
  - experiment_id: anoa_prospective_fundus_series
    name: Prospective angiography in an unselected FDXR series
    experiment_design: HUMAN_OBSERVATIONAL
    executability: SPECIFIED
    description: >-
      Examine every reachable FDXR patient with wide-field fundus imaging, fluorescein
      angiography and optical coherence tomography angiography on one protocol, recording
      genotype and the degree of retinal degeneration, and ask whether vascular occlusion
      occurs independently of the degeneration's severity.
    would_support:
    - phenotypes#Attenuation of retinal blood vessels
    supporting_outcome:
    - Vascular occlusion in a substantial share of patients across genotypes, including some with mild degeneration, which would establish it as a parallel lesion
    refuting_outcome:
    - Occlusion only in the most degenerate retinas, which would make it a secondary consequence of the degeneration rather than a feature in its own right
- discussion_id: anoa_spectrum_boundary_and_nomenclature
  prompt: >-
    Where does the boundary lie between this entry and multiple mitochondrial dysfunctions
    syndrome 9B, and is the serial numbering of the FDXR spectrum stable enough to curate
    against?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - disease#
  - pathophysiology#Biallelic Hypomorphic FDXR Variants
  rationale: >-
    One gene produces a continuum from isolated adult-recognised sensory impairment to
    infantile neurodegeneration with early death, and the field cuts it into two numbered
    entities plus an umbrella term, FDXR-related mitochondriopathy, that most mechanistic
    papers actually use. The cut is not clean: ataxia and polyneuropathy occur in a
    substantial minority of patients who would otherwise sit at the mild end, and one
    cohort patient developed ataxia and weakness by 24 after a purely sensory start.
    Genotype does not settle it either, since the same hotspot allele appears across the
    range and its homozygous form marks the severe end. There is also a live nomenclature
    hazard: the MMDS9A and 9B labels and the Orphanet codes do not line up cleanly across
    databases, and the hotspot's protein position differs by transcript between reports.
    Curating two entries against a continuum is a decision, not a fact, and this is the
    record of it.
  evidence:
  - reference: PMID:37046037
    reference_title: "FDXR-associated disease: a challenging differential diagnosis with inflammatory peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in FDXR gene, involved in mitochondrial pathway,  cause a rare recessive neurological disorder with variable severity of  phenotypes."
    explanation: The field describes one disorder of variable severity rather than two entities.
  - reference: PMID:33348459
    reference_title: "Expanding the clinical and genetic spectrum of FDXR deficiency by functional validation of variants of uncertain significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "over 80% of these variants are missense"
    explanation: A spectrum of hypomorphic missense alleles rather than two genotype classes, which is why genotype does not draw the boundary.
  notes: >-
    Findings reported only for the severe end of the spectrum are deliberately not
    curated in this entry; see the entry-level notes.

  description: >
    Bilateral auditory neuropathy in all eight founding patients: brainstem responses
    severely impaired or absent while otoacoustic emissions are preserved, with speech
    discrimination out of proportion to the pure-tone thresholds. The preserved emissions
    place the lesion behind the outer hair cells rather than in the cochlea.

    reference_title: "FDXR Mutations Cause Sensorial Neuropathies and Expand the Spectrum of Mitochondrial Fe-S-Synthesis Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed biallelic mutations in FDXR in affected subjects of each family."
    explanation: Biallelic variants in all four founding families.
prevalence:
- population: Global reported patients
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Eight patients in four families in the founding report, with later cohorts from China,
    Korea and Italy; a 2023 review pooled 44 reported FDXR patients across the whole
    spectrum, severe end included.
  evidence:
  - reference: PMID:28965846
    reference_title: "FDXR Mutations Cause Sensorial Neuropathies and Expand the Spectrum of Mitochondrial Fe-S-Synthesis Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on eight subjects from four independent families affected by auditory neuropathy and optic atrophy."
    explanation: The founding cohort size.
progression:
- phase: First- to second-decade sensory onset
  age_range: Childhood to early adulthood
  notes: >-
    Hearing and visual impairment begin in the first or second decade. In the founding
    cohort auditory onset ranged from 5 to 20 years and optic atrophy was detected from
    childhood to 36 years, in three patients only on electrophysiology.
  evidence:
  - reference: PMID:28965846
    reference_title: "FDXR Mutations Cause Sensorial Neuropathies and Expand the Spectrum of Mitochondrial Fe-S-Synthesis Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss and visual impairment in childhood have mostly genetic origins, some of them being related to sensorial neuronal defects."
    explanation: Frames the disease as a childhood-onset sensory neuronal defect, which is the course this phase records.
pathophysiology:
- name: Biallelic Hypomorphic FDXR Variants
  description: >
    Biallelic germline FDXR variants, over eighty per cent of them missense and several
    clustering in the FAD-binding site. No patient with two truncating alleles has been
    reported, from which the authors infer that complete loss of FDXR function is not
    compatible with life, so the disease alleles are hypomorphic rather than null.
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  genes:
  - preferred_term: FDXR
    term:
      id: hgnc:3642
      label: FDXR
  evidence:
  - reference: PMID:29040572
    reference_title: "Biallelic mutations in the ferredoxin reductase gene cause novel mitochondriopathy with optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these data provide the first demonstration that germline,  hypomorphic mutations in FDXR cause a novel mitochondriopathy and optic atrophy  in humans"
    explanation: Establishes the hypomorphic mechanism and the disease.
  downstream:
  - target: Reduced Ferredoxin Reductase Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29040572
      reference_title: "Biallelic mutations in the ferredoxin reductase gene cause novel mitochondriopathy with optic atrophy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro enzymatic assays in patient fibroblast cells showed deficient  ferredoxin NADP reductase activity"
      explanation: Patient cells have deficient enzyme activity, measured directly.
- name: Reduced Ferredoxin Reductase Activity
  description: >
    FDXR is the only human ferredoxin reductase. Its activity in patient fibroblasts is
    roughly half of control, which is enough to impair the pathway it feeds without being
    lethal.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FDXR
    term:
      id: hgnc:3642
      label: FDXR
  evidence:
  - reference: PMID:28965846
    reference_title: "FDXR Mutations Cause Sensorial Neuropathies and Expand the Spectrum of Mitochondrial Fe-S-Synthesis Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FDXR encodes the mitochondrial ferredoxin reductase, the sole human ferredoxin reductase implicated in the biosynthesis of iron-sulfur clusters (ISCs) and in heme formation."
    explanation: FDXR is the only enzyme performing this step, so its partial loss has no redundant backup.
  downstream:
  - target: Reduced Electron Supply to Ferredoxin
    causal_link_type: DIRECT
- name: Reduced Electron Supply to Ferredoxin
  description: >
    FDXR passes electrons from NADPH to the mitochondrial ferredoxins, which deliver the
    reducing equivalents that cluster assembly consumes, both for building the nascent
    cluster on the scaffold and for the reductive fusion step. The lesion is therefore in
    the electron supply to the pathway rather than in any scaffold, carrier or
    transporter, which distinguishes this disease from its siblings.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:32499495
    reference_title: "Integrated analysis of the molecular pathogenesis of FDXR-associated disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The mitochondrial flavoprotein ferredoxin reductase (FDXR) is required for biogenesis of iron-sulfur clusters and for steroidogenesis."
    explanation: States the two pathways FDXR supplies, of which cluster biogenesis is the one this chain follows.
  downstream:
  - target: Impaired Mitochondrial Iron-Sulfur Cluster Biogenesis
    causal_link_type: DIRECT
- name: Impaired Mitochondrial Iron-Sulfur Cluster Biogenesis
  description: >
    Cluster assembly fails for want of reducing equivalents, and the cluster-dependent
    enzymes follow: mitochondrial and cytosolic aconitase and the complex II subunit SDHB
    are all reduced in patient fibroblasts. This is the rate-limiting step of the disease.
  biological_scale: MOLECULAR
  role: central_effector
  biological_processes:
  - preferred_term: iron-sulfur cluster assembly
    modifier: DECREASED
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
  cellular_components:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  evidence:
  - reference: PMID:28965846
    reference_title: "FDXR Mutations Cause Sensorial Neuropathies and Expand the Spectrum of Mitochondrial Fe-S-Synthesis Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND

    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic FDXR variants, homozygous in a consanguineous family and compound
    heterozygous in the others. Only one of the four founding families was consanguineous.
  evidence:

    causal_link_type: DIRECT
- name: Deficient Respiratory Chain and Cluster-Dependent Enzyme Activity
  description: >
    Patient fibroblasts show low oxygen consumption, reduced respiratory complex
    activities and reduced ATP production, with raised reactive oxygen species. The
    membrane potential falls with it.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:29040572
    reference_title: "Biallelic mutations in the ferredoxin reductase gene cause novel mitochondriopathy with optic atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mitochondrial dysfunction evidenced by  low oxygen consumption rates (OCRs), complex activities, ATP production and  increased reactive oxygen species (ROS)"
    explanation: The bioenergetic and oxidative consequences, measured in patient cells.
  downstream:
  - target: Oxidative Stress and Mitochondrial Depolarization
    causal_link_type: DIRECT
  - target: Sensory Neuron and Axonal Transport Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Iron-Starvation Signalling
  description: >
    With cluster supply short, the cell reads itself as iron-starved and raises transferrin
    receptor, so iron import continues past need. Iron handling is deregulated in patient
    fibroblasts, with indirect evidence of mitochondrial iron overload.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: intracellular iron ion homeostasis
    modifier: DYSREGULATED
    term:
      id: GO:0006879
      label: intracellular iron ion homeostasis
  evidence:
  - reference: PMID:28965846
    reference_title: "FDXR Mutations Cause Sensorial Neuropathies and Expand the Spectrum of Mitochondrial Fe-S-Synthesis Diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed deregulated iron homeostasis in FDXR mutant fibroblasts and indirect evidence of mitochondrial iron overload."
    explanation: Deregulated iron handling in patient cells, with the authors themselves calling the overload evidence indirect.
  downstream:
  - target: Mitochondrial Iron Overload
    causal_link_type: DIRECT
- name: Mitochondrial Iron Overload
  description: >
    Iron accumulates in mitochondria, shown directly in mouse tissue where the founding
    human evidence was indirect. Excess mitochondrial iron favours free-radical formation,
    which is the link from the iron branch to the oxidative one.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:32499495
    reference_title: "Integrated analysis of the molecular pathogenesis of FDXR-associated disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Molecular analysis indicates that FDXR mutation also leads to mitochondrial iron overload and an associated depolarization of the mitochondrial membrane"
    explanation: Mitochondrial iron overload with membrane depolarization, in the mouse model.
  downstream:
  - target: Oxidative Stress and Mitochondrial Depolarization
    causal_link_type: DIRECT
- name: Oxidative Stress and Mitochondrial Depolarization
  description: >
    The two branches converge here: reduced respiratory chain function raises reactive
    oxygen species, and mitochondrial iron overload depolarizes the membrane and favours
    free-radical formation. The authors place this convergence behind the
    neurodegeneration.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  evidence:
  - reference: PMID:29040572
    reference_title: "Biallelic mutations in the ferredoxin reductase gene cause novel mitochondriopathy with optic atrophy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Excessive levels of iron favor the formation of excess oxygen free radicals and consequent mitochondrial dysfunction."
    explanation: States the step from iron overload to free-radical damage.
  downstream:
  - target: Sensory Neuron and Axonal Transport Failure
    causal_link_type: DIRECT
- name: Sensory Neuron and Axonal Transport Failure
  description: >
    The long sensory projections fail. Mouse work shows significant optic transport
    defects, which the authors read as the basis of the optic atrophy, together with
    neurodegenerative cell loss in the central nervous system. The corresponding cochlear
    lesion is post-synaptic rather than cochlear: brainstem responses are lost while
    otoacoustic emissions, which report outer hair cell function, are preserved.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  locations:
  - preferred_term: optic nerve
    term:
      id: UBERON:0000941
      label: cranial nerve II
  evidence:
  - reference: PMID:32499495
    reference_title: "Integrated analysis of the molecular pathogenesis of FDXR-associated disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we demonstrate that FDXR mutation leads to significant optic transport defects that are likely to underlie optic atrophy, a major clinical presentation in FDXR patients, as well as a neurodegenerative loss of cells in the central nervous system (CNS)"
    explanation: Axonal transport failure in the mouse, proposed by the authors as the basis of the optic atrophy.
  downstream:
  - target: Optic atrophy
  - target: Abnormal auditory evoked potentials
  - target: Peripheral neuropathy
- name: Retinal Degeneration With Vascular Attenuation
  description: >
    Beyond the ganglion-cell loss of optic atrophy, several cohorts show a retinal
    dystrophy with severely impaired cone and rod responses in the first decades, and in
    three of five patients in one ocular cohort attenuated retinal vessels appearing as
    white lines, with occlusion and delayed filling on angiography. Those authors propose
    retinal vascular occlusion as a distinct feature of FDXR disease. Its mechanism is
    unknown and it is not connected to an upstream node here.
  biological_scale: TISSUE
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:37481223
    reference_title: "FDXR-associated disease in a Chinese cohort: Unraveling expanded ocular phenotypes and genetic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all patients presented with retinal dystrophy, and electroretinogram showed  severely impaired cone and rod functions in their first decades"
    explanation: Retinal dystrophy with impaired cone and rod function in every patient of that cohort.
  - reference: PMID:37481223
    reference_title: "FDXR-associated disease in a Chinese cohort: Unraveling expanded ocular phenotypes and genetic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of the  five patients showed attenuated retinal vessels that appeared as white lines on  the fundus"
    explanation: The retinal vascular finding, in three of five patients.
  downstream:
  - target: Retinal dystrophy
  - target: Attenuation of retinal blood vessels

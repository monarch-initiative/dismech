    explanation: States the breadth of the client set whose maturation this step supplies.
  - reference: PMID:32499495
    reference_title: "Integrated analysis of the molecular pathogenesis of FDXR-associated disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Our previous studies have demonstrated that hypomorphic mutations in FDXR cause a novel mitochondriopathy and optic atrophy in humans and mice, attributed in part to reduced function of the electron transport chain (ETC) as well as elevated production of reactive oxygen species (ROS)."
    explanation: Summarises the two downstream branches, respiratory chain loss and oxidative stress, that this node feeds.
  downstream:
  - target: Deficient Respiratory Chain and Cluster-Dependent Enzyme Activity
    causal_link_type: DIRECT

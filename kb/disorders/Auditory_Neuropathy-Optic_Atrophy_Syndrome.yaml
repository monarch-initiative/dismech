name: Auditory Neuropathy-Optic Atrophy Syndrome
category: Mendelian
creation_date: "2026-11-19T04:30:00Z"
synonyms:
- ANOA
- auditory neuropathy and optic atrophy
- multiple mitochondrial dysfunctions syndrome 9A
- FDXR-related mitochondriopathy
- FDXR deficiency
description: >
  Auditory neuropathy-optic atrophy syndrome is an autosomal recessive mitochondrial
  disorder caused by biallelic hypomorphic variants in FDXR, the sole human ferredoxin
  reductase. FDXR passes electrons from NADPH to ferredoxin, which supplies the reducing
  equivalents that mitochondrial iron-sulfur cluster assembly consumes, so the lesion sits
  at the electron-supply step of the pathway rather than at a scaffold, a transfer or an
  export step. Cluster-dependent enzymes lose activity, cells read themselves as
  iron-starved, and mitochondrial iron overloads. The clinical picture is
  sensory-predominant: bilateral auditory neuropathy, in which brainstem responses are
  severely impaired while cochlear outer hair cell function is preserved, together with
  optic atrophy that is sometimes detectable only on electrophysiology, and in several
  cohorts a retinal dystrophy with attenuated and occluded retinal vessels. This entry is
  the milder, sensory end of one FDXR spectrum whose severe end is curated separately as
  multiple mitochondrial dysfunctions syndrome 9B.
disease_term:
  preferred_term: auditory neuropathy-optic atrophy syndrome
  term:
    id: MONDO:0060582
    label: auditory neuropathy-optic atrophy syndrome
parents:
- FDXR-Related Optic Atrophy Mitochondrial Dysfunction Syndrome
- Mitochondrial iron-sulfur cluster assembly disorder
notes: >-
  No GeneReviews chapter covers FDXR (PubMed search `FDXR[TIAB] AND genereviews[book] NOT
  retired[TI]` returned 0 on 2026-11-19), so the phenotype baseline is the founding report
  of eight patients in four families (PMID:28965846) plus later cohorts.
  MONDO records no causal gene (RO:0004003) for this term, so `just preflight-dr` returned
  SKIP rather than PASS and disease identity was confirmed by hand instead: the OMIM xref
  617717 matches the report exactly, and FDXR is the report's top gene at 32 mentions.
  MONDO places this term as a child of `MONDO:1060116 FDXR-related optic atrophy
  mitochondrial dysfunction syndrome`, whose other child `MONDO:0971174` is already curated
  as Multiple Mitochondrial Dysfunctions Syndrome 9B; this entry is deliberately scoped to
  the sensory-predominant form, and findings reported only for the severe end
  (developmental regression, seizures, Leigh syndrome, early death) are not curated here.
  Where a finding comes from a pooled FDXR cohort rather than from sensory-predominant
  patients, the phenotype `description` says so.
  **Variant nomenclature is not reconciled in the literature and is not reconciled here.**
  The recurrent hotspot allele is written p.Arg386Trp in two reports and p.R392W in a
  third, from different reference transcripts, and the cohorts use NM_024417.4 and
  NM_024417.5. Protein positions in the genetic notes are therefore recorded as each
  source writes them, and a reader must reconcile the transcript before reusing one.
  ClinGen has no gene-disease validity record for FDXR.
  Phenotype frequencies are given only where a source states a count or a percentage.

- name: Disrupted NuRD-dependent cortical layer specification
  description: 'The Mi-2/NuRD (Nucleosome Remodeling and Deacetylase) complex couples ATP-dependent chromatin remodeling (via mutually exclusive CHD3, CHD4, or CHD5 subunits) with histone deacetylation (via HDAC1/2). During mouse cortical development a sequential subunit switch assigns non-redundant developmental roles: CHD4 drives early progenitor proliferation, CHD5 facilitates radial neuronal migration, and CHD3 is specifically required for proper cortical layer specification. Inhibition of any one CHD cannot be rescued by overexpression of another, indicating CHD3''s role in the NuRD complex is irreplaceable. Loss of CHD3 catalytic function in NuRD therefore disturbs late transcriptional programs governing layer identity and post-mitotic neuronal differentiation, providing a mechanistic substrate for the intellectual disability, speech/language impairment, and structural cortical findings observed in SNIBCPS. Together with CHD4 (Sifrim-Hitz-Weiss) and GATAD2B (GAND) disorders, SNIBCPS belongs to a "NuRDopathy" class of macrocephaly-associated neurodevelopmental disorders sharing intellectual disability, hypotonia and overlapping facial features.'

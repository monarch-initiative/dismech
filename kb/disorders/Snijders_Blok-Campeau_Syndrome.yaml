  - reference: PMID:27806305
    reference_title: A Functional Switch of NuRD Chromatin Remodeling Complex Subunits Regulates Mouse Cortical Development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Whereas CHD4 promotes the early proliferation of progenitors, CHD5 facilitates neuronal migration and CHD3 ensures proper layer specification.
    explanation: In vivo mouse cortical development experiments establish that CHD3 has a specific, non-redundant role in cortical layer specification that cannot be substituted by CHD4 or CHD5, providing the developmental substrate for SNIBCPS cortical phenotypes.
  - reference: PMID:27806305

genetic:
- name: CHD3 pathogenic variants
  association: Causative
  gene_term:
    preferred_term: CHD3
    term:
      id: hgnc:1918
      label: CHD3
  features: Heterozygous pathogenic variants in CHD3 are causative. Most variants are de novo, with the majority being missense substitutions clustering in the central ATPase/helicase domain. Other mechanisms include truncating variants, in-frame deletions, whole-gene deletions, and duplications outside the helicase domain - all producing indistinguishable clinical phenotypes. A minority of cases have inherited variants from mildly or unaffected parents, demonstrating variable expressivity. Inherited variants are most often maternally transmitted.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:30397230
      reference_title: CHD3 helicase domain mutations cause a neurodevelopmental syndrome with macrocephaly and impaired speech and language.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: we use a genotype-driven approach, collecting and characterizing 35 individuals with de novo CHD3 mutations and overlapping phenotypes. Most mutations cluster within the ATPase/helicase domain of the encoded protein.
      explanation: Heterozygous de novo CHD3 variants cause the syndrome, consistent with an autosomal dominant inheritance pattern.
  evidence:
  - reference: PMID:30397230
    reference_title: CHD3 helicase domain mutations cause a neurodevelopmental syndrome with macrocephaly and impaired speech and language.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we use a genotype-driven approach, collecting and characterizing 35 individuals with de novo CHD3 mutations and overlapping phenotypes. Most mutations cluster within the ATPase/helicase domain of the encoded protein.
    explanation: Establishes CHD3 as the causative gene with most variants being de novo missense changes in the helicase domain.
  - reference: PMID:32483341
    reference_title: A second cohort of CHD3 patients expands the molecular mechanisms known to cause Snijders Blok-Campeau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our analysis has shown no difference in phenotype between those patients with missense variants affecting the CHD3 helicase domain compared with patients with any other CHD3 variant type, expanding the spectrum of molecular mechanisms that are known to lead to Snijders Blok-Campeau syndrome.
    explanation: Demonstrates that variants outside the helicase domain - including truncating variants, deletions, and duplications - produce the same phenotype as helicase-domain missense variants.
  - reference: PMID:35346573
    reference_title: Inherited variants in CHD3 show variable expressivity in Snijders Blok-Campeau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We characterized 21 families with inherited heterozygous missense or protein-truncating variants in CHD3, a gene in which de novo variants cause Snijders Blok-Campeau syndrome.
    explanation: Documents inherited CHD3 variants causing Snijders Blok-Campeau syndrome with variable expressivity.
  - reference: PMID:35346573
    reference_title: Inherited variants in CHD3 show variable expressivity in Snijders Blok-Campeau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Notably, most inherited CHD3 variants were maternally transmitted.
    explanation: Documents the predominance of maternal transmission for inherited CHD3 variants in this syndrome.
  - reference: PMID:38116750
    reference_title: A severe neurocognitive phenotype caused by biallelic CHD3 variants in two siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report a severe neurocognitive phenotype caused by biallelic CHD3 variants in two siblings, each inherited from a mildly affected parent.
    explanation: Documents that rare biallelic CHD3 variants cause a more severe neurocognitive phenotype than the classic heterozygous SNIBCPS, consistent with dosage sensitivity of CHD3.
  - reference: PMID:38116750
    reference_title: A severe neurocognitive phenotype caused by biallelic CHD3 variants in two siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Biallelic CHD3 variants cause a severe neurodevelopmental syndrome that is distinguishable from SBCS.
    explanation: Establishes biallelic CHD3 disease as a distinct, more severe entity than classic monoallelic SNIBCPS.
  - reference: PMID:39542866
    reference_title: Insights From a Novel Splicing Variant and Recurrent Arginine Variants in the CHD3 Gene Causing Snijders Blok-Campeau Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Given the high prevalence of arginine residue pathogenic variants in the CHD3 protein and its notable propensity for binding and storing ATP molecules
    explanation: Highlights the disproportionate enrichment of arginine residue pathogenic variants in CHD3, consistent with the importance of these residues for ATP binding within the helicase domain.
  - reference: CGGV:assertion_0e94c7c1-9c13-4189-8a9f-e9808916526f-2022-03-02T170000.000Z
    reference_title: CHD3 / Snijders Blok-Campeau syndrome (Definitive)

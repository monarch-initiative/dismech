- name: Disrupted BMP/Wnt signaling in cranial neural crest cell specification
  description: During cranial neural crest cell (CNCC) specification, CHD3 is upregulated in early CNCCs and is required to enhance the BMP signalling response by opening chromatin at BMP-responsive cis-regulatory elements and by increasing expression of BMP-responsive transcription factors, including DLX paralogs. CHD3 loss in iPSC-derived CNCCs represses BMP target genes and reduces chromatin accessibility at these elements, producing an imbalance between BMP and Wnt signalling that diverts cells away from a CNCC fate toward aberrant early-mesoderm identity. Partial rescue by titrating Wnt levels demonstrates a causal role for the BMP/Wnt imbalance and points to a candidate therapeutic axis. This mechanism provides a direct molecular explanation for the recognizable craniofacial gestalt of SNIBCPS (frontal bossing, hypertelorism, broad nasal bridge, midface findings) by linking CHD3 chromatin remodeling activity to neural crest-derived craniofacial development.

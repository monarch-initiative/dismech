diagnosis:
- name: CHD3 molecular genetic testing
  description: Definitive diagnosis requires identification of a heterozygous pathogenic or likely pathogenic variant (missense, truncating, or copy-number variant) in CHD3 by exome/genome sequencing or multigene neurodevelopmental panels, including assessment for parental transmission given documented variable expressivity.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Heterozygous pathogenic missense variant (frequently clustering in the ATPase/helicase domain), truncating variant, or whole/partial gene deletion or duplication in CHD3.
  evidence:
  - reference: PMID:30397230
    reference_title: CHD3 helicase domain mutations cause a neurodevelopmental syndrome with macrocephaly and impaired speech and language.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we use a genotype-driven approach, collecting and characterizing 35 individuals with de novo CHD3 mutations and overlapping phenotypes. Most mutations cluster within the ATPase/helicase domain of the encoded protein.
    explanation: Establishes genotype-first molecular identification of pathogenic CHD3 variants as the definitive diagnostic modality.
  - reference: PMID:32483341
    reference_title: A second cohort of CHD3 patients expands the molecular mechanisms known to cause Snijders Blok-Campeau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our analysis has shown no difference in phenotype between those patients with missense variants affecting the CHD3 helicase domain compared with patients with any other CHD3 variant type, expanding the spectrum of molecular mechanisms that are known to lead to Snijders Blok-Campeau syndrome.
    explanation: Demonstrates that molecular testing must evaluate both helicase-domain missense variants and truncating or copy-number variants across CHD3.
differential_diagnoses:
- name: Sifrim-Hitz-Weiss syndrome
  description: CHD4-related NuRDopathy (Sifrim-Hitz-Weiss syndrome) shares macrocephaly, intellectual disability, hypotonia, and overlapping facial dysmorphism with Snijders Blok-Campeau syndrome, but is distinguished by higher rates of congenital heart defects, skeletal anomalies, and deafness/hearing loss, whereas CHD3 variants more characteristically feature childhood apraxia of speech and inguinal hernias.
  disease_term:
    preferred_term: Sifrim-Hitz-Weiss syndrome
    term:
      id: MONDO:0014946
      label: Sifrim-Hitz-Weiss syndrome
  distinguishing_features:
  - CHD4 pathogenic variants rather than CHD3 variants on molecular genetic testing
  - Higher prevalence of skeletal anomalies, hearing loss, and cardiac defects in CHD4-related disorder versus speech apraxia and inguinal hernia in CHD3-related disorder
  evidence:
  - reference: PMID:31737996
    reference_title: The NuRD complex and macrocephaly associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition to macrocephaly and intellectual disability, CHD3 variants are associated with inguinal hernias and apraxia of speech; whereas CHD4 variants are associated with skeletal anomalies, deafness, and cardiac defects. GATAD2B-associated neurodevelopmental disorder (GAND) has phenotypic overlap with both of these disorders.
    explanation: Directly compares the clinical spectrum and distinguishing features of CHD3-related Snijders Blok-Campeau syndrome and CHD4-related Sifrim-Hitz-Weiss syndrome.
- name: GATAD2B-associated neurodevelopmental disorder
  description: GATAD2B-associated neurodevelopmental disorder (GAND) is a fellow NuRDopathy that overlaps clinically with Snijders Blok-Campeau syndrome through macrocephaly, intellectual disability, hypotonia, severe speech impairment, and facial dysmorphism, requiring molecular genetic testing of GATAD2B versus CHD3 for definitive differentiation.
  disease_term:
    preferred_term: GATAD2B-associated neurodevelopmental disorder
    term:
      id: MONDO:0014034
      label: severe intellectual disability-poor language-strabismus-grimacing face-long fingers syndrome
  distinguishing_features:
  - Heterozygous pathogenic variants in GATAD2B rather than CHD3 on molecular genetic testing
  - Lacks the characteristic clustering of inguinal hernias and childhood apraxia of speech associated with CHD3 variants
  evidence:
  - reference: PMID:31737996
    reference_title: The NuRD complex and macrocephaly associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition to macrocephaly and intellectual disability, CHD3 variants are associated with inguinal hernias and apraxia of speech; whereas CHD4 variants are associated with skeletal anomalies, deafness, and cardiac defects. GATAD2B-associated neurodevelopmental disorder (GAND) has phenotypic overlap with both of these disorders.
    explanation: Identifies GATAD2B-associated neurodevelopmental disorder (GAND) as an overlapping NuRDopathy differential diagnosis for CHD3-related Snijders Blok-Campeau syndrome.
treatments:
- name: Speech and Language Therapy
  description: Speech and language therapy is a cornerstone of management for the universal severe speech delay and childhood apraxia of speech features in Snijders Blok-Campeau syndrome. Augmentative and alternative communication (AAC) approaches are often necessary.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:

    reference_title: Safety, Tolerability and Preliminary Efficacy Study of a Single Intrathecal Injection of the Dual Vector AAV-CHD3-R1025W Base Editor for the Treatment of Developmental Disorders Caused by the R1025W Mutation in the CHD3 Gene
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To evaluate the safety, tolerability and preliminary efficacy study of a single intrathecal injection of the dual vector AAV-CHD3-R1025W base editor for the treatment of developmental disorders caused by the R1025W mutation in the CHD3 gene
    explanation: Documents the active first-in-human trial of allele-specific AAV base editing targeting the recurrent CHD3 R1025W variant, a landmark therapeutic development for SNIBCPS.

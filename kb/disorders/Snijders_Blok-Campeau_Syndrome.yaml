    explanation: Demonstrates the non-interchangeable function of CHD3 within NuRD and explains why CHD3 haploinsufficiency cannot be functionally compensated by paralogs.
  - reference: PMID:31737996
    reference_title: The NuRD complex and macrocephaly associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The nucleosome remodeling and deacetylase (NuRD) complex is a major regulator of gene expression involved in pluripotency, lineage commitment, and corticogenesis. This important complex is composed of seven different proteins, with mutations in CHD3, CHD4, and GATAD2B being associated with neurodevelopmental disorders presenting with macrocephaly and intellectual disability
    explanation: Establishes the NuRDopathy disease class linking CHD3, CHD4 and GATAD2B disorders by their shared NuRD complex biology and overlapping macrocephaly/ID phenotype.

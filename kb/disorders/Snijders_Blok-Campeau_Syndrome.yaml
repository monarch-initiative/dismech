    term:
      id: HP:0000750
      label: Delayed speech and language development
  - preferred_term: Speech apraxia
    term:
      id: HP:0011098
      label: Speech apraxia
  evidence:
  - reference: PMID:30397230
    reference_title: CHD3 helicase domain mutations cause a neurodevelopmental syndrome with macrocephaly and impaired speech and language.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We implicate de novo CHD3 mutations in a syndrome characterized by intellectual disability, macrocephaly, and impaired speech and language.
    explanation: Universal speech and language impairment in Snijders Blok-Campeau syndrome necessitates targeted speech and language therapy.
- name: Early Developmental Intervention
  description: Early intervention services including occupational therapy, physical therapy, and developmental support are recommended given the universal global developmental delay seen in affected individuals.
  treatment_term:
    preferred_term: early intervention services
    term:
      id: NCIT:C159524
      label: Early Intervention
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  - preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  evidence:
  - reference: PMID:32483341
    reference_title: A second cohort of CHD3 patients expands the molecular mechanisms known to cause Snijders Blok-Campeau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All patients initially presented for evaluation for developmental delay, most with additional findings, and were each found to have a variant in the CHD3 gene
    explanation: Universal global developmental delay (100% across combined cohorts) warrants early multidisciplinary developmental intervention.
- name: Antiepileptic Drug Therapy
  description: Standard antiepileptic medications are used to manage seizures in the approximately 16% of patients who develop epilepsy. Drug selection is guided by seizure type.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:32483341
    reference_title: A second cohort of CHD3 patients expands the molecular mechanisms known to cause Snijders Blok-Campeau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Seizures were reported in 5 of 24 patients in our cohort (21%).
    explanation: Seizures occur in 16% of patients across combined cohorts (21% in the second cohort) and require standard antiepileptic pharmacotherapy.
- name: Ophthalmologic Evaluation
  description: Given the high prevalence of visual abnormalities (72%), regular ophthalmologic evaluation is recommended. Refractive error correction, strabismus management, and treatment of cortical visual impairment may be needed.
  treatment_term:
    preferred_term: ophthalmologist evaluation
    term:
      id: NCIT:C38060
      label: Eye Examination
  target_phenotypes:
  - preferred_term: Abnormality of vision
    term:
      id: HP:0000504
      label: Abnormality of vision
  - preferred_term: Strabismus
    term:
      id: HP:0000486
      label: Strabismus
  evidence:
  - reference: PMID:32483341
    reference_title: A second cohort of CHD3 patients expands the molecular mechanisms known to cause Snijders Blok-Campeau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Strikingly, 18 of 24 patients in our cohort (75%) had some type of vision abnormality. A similar rate of visual impairment was reported in the initial cohort, where 70% of patients were reported as having some type of visual abnormality
    explanation: High prevalence of visual abnormalities (72% combined) and strabismus necessitates routine ophthalmologic evaluation and management.
- name: Echocardiographic Evaluation
  description: Echocardiographic evaluation is recommended at diagnosis given the 14% prevalence of congenital heart defects, primarily atrial and ventricular septal defects.
  treatment_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  target_phenotypes:
  - preferred_term: Abnormal heart morphology
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  evidence:
  - reference: PMID:32483341
    reference_title: A second cohort of CHD3 patients expands the molecular mechanisms known to cause Snijders Blok-Campeau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Congenital heart disease (CHD) was seen in only 5 of 24 (21%) of patients, mostly accounted for by atrial septal defects (seen in 3 patients), followed by patent ductus arteriosus (in 1 patient) and ventricular septal defect (in 1 patient).
    explanation: Presence of congenital heart defects in 14% of combined cohort patients (21% in the second cohort) supports baseline echocardiographic screening.
- name: Genetic Counseling
  description: Given the autosomal dominant inheritance pattern with variable expressivity, genetic counseling is important for families. Most cases are de novo, but inherited variants from mildly affected parents are increasingly recognized, particularly via maternal transmission.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35346573
    reference_title: Inherited variants in CHD3 show variable expressivity in Snijders Blok-Campeau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our results point to a significant role of inherited variation in Snijders Blok-Campeau syndrome, a finding that is critical for correct variant interpretation and genetic counseling and warrants further investigation toward understanding the broader contributions of such variation to the landscape of human disease.
    explanation: Explicitly highlights the importance of genetic counseling given inherited CHD3 variants with variable expressivity.
clinical_trials:
- name: NCT06860672
  phase: PHASE_I
  status: RECRUITING
  description: First-in-human early-phase trial of a single intrathecal injection of a dual vector AAV-delivered base editor designed to correct the recurrent CHD3 c.3073C>T (p.R1025W) variant in pediatric patients with Snijders Blok-Campeau syndrome. Represents one of the first in-vivo base-editing approaches for any chromatinopathy.
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  - preferred_term: Intellectual disability

pathophysiology:
- name: CHD3-dependent NuRD chromatin remodeling defects
  description: CHD3 is an ATP-dependent chromatin remodeling enzyme that uses energy from ATP hydrolysis to slide and reposition nucleosomes along DNA. It is one of three mutually exclusive catalytic subunits (CHD3, CHD4, CHD5) of the NuRD complex, which couples chromatin remodeling with histone deacetylation to regulate gene expression. Pathogenic missense variants cluster within the central ATPase/helicase domain and disrupt critical binding and interaction motifs. Functional assays show that a subset of variants directly impair ATPase activity, while nearly all yield alterations in chromatin remodeling. Both gain- and loss-of-function effects, as well as haploinsufficiency from truncating and whole-gene copy-number changes, can produce the same clinical phenotype.

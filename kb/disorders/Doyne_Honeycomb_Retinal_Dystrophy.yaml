      explanation: Complement activation in knock-in RPE and Bruch's membrane is attributed to ECM alteration.
  - target: Sub-RPE Basal Deposit and Drusen Formation
    causal_link_type: DIRECT
    description: Excess and abnormal matrix material forms the basal deposits that precede drusen.

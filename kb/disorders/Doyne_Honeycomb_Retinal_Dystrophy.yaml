    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis done in patient one revealed a heterozygous, autosomal dominant, pathogenic mutation (c.1033C>T p.ARG345Trp) in the EFEMP1 gene, confirming the ML diagnosis."
    explanation: Molecular testing confirmed the clinical diagnosis.
  - reference: PMID:11389162
    reference_title: "Molecular genetic heterogeneity in autosomal dominant drusen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HpaII restriction digest test was found to be a reliable and quick method for detecting this."
    explanation: A targeted assay detects the single disease variant.
treatments:
- name: Intravitreal anti-VEGF therapy for choroidal neovascularization
  description: >-
    Intravitreal anti-VEGF agents are used for secondary choroidal
    neovascularization. They do not treat the underlying drusen dystrophy, and
    responses in DHRD case reports have been variable, including no effect.
    The modality tag refers to the monoclonal antibody agents such as
    bevacizumab and ranibizumab; aflibercept is a VEGF receptor-Fc fusion
    protein rather than an antibody.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: angiogenesis inhibitor (anti-VEGF)
      term:
        id: NCIT:C1742
        label: Angiogenesis Inhibitor
  target_phenotypes:
  - preferred_term: Choroidal neovascularization
    term:
      id: HP:0011506
      label: Choroidal neovascularization
  target_mechanisms:
  - target: Increased RPE VEGF Expression
    treatment_effect: INHIBITS
    description: >-
      Anti-VEGF agents neutralize the VEGF protein produced downstream of this
      node, the proposed driver of neovascularization; they do not lower VEGF
      expression itself.
  evidence:
  - reference: PMID:30541486
    reference_title: "Doyne honeycomb retinal dystrophy/malattia leventinese induced by EFEMP1 mutation in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "To date, laser therapy and anti-VEGF therapy have been utilized for the treatment, but the treatment is still a challenge"
    explanation: Anti-VEGF therapy is used in DHRD/ML, with limited success.
  - reference: PMID:33689237
    reference_title: "First reported case of Doyne honeycomb retinal dystrophy (Malattia Leventinese/autosomal dominant drusen) in Scandinavia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary choroidal neovascularizations were identified on both eyes, and anti-vascular endothelial growth factor was administered, without effect."
    explanation: In this case, anti-VEGF did not control bilateral CNV, so efficacy is not assured.
- name: Low-energy laser treatment of drusen
  description: >-
    Low-energy argon laser or nanosecond (2RT) laser applied to the RPE over
    drusen has been studied in small series. In a prospective series of 11
    EFEMP1 patients, treated eyes did not show the drusen thickening seen in
    untreated eyes; nanosecond laser case reports describe stable or improved
    function without structural change. The evidence is limited to small
    uncontrolled series, and the approach is not established care.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: laser therapy
    term:
      id: NCIT:C15466
      label: Laser Therapy
  target_phenotypes:
  - preferred_term: Macular drusen
    term:
      id: HP:0030499
      label: Macular drusen
  target_mechanisms:
  - target: Sub-RPE Basal Deposit and Drusen Formation
    treatment_effect: MODULATES
    description: Laser to the RPE over drusen aims to clear or limit sub-RPE deposit.
  evidence:
  - reference: PMID:23036572
    reference_title: "Laser clearance of drusen deposit in patients with autosomal dominant drusen (p.Arg345Trp in EFEMP1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An increase in mean drusen thickness was observed in the untreated eyes, but not in the treated eyes (P = .0322)."
    explanation: Laser-treated eyes did not show the drusen thickening of untreated fellow eyes.
  - reference: PMID:23036572
    reference_title: "Laser clearance of drusen deposit in patients with autosomal dominant drusen (p.Arg345Trp in EFEMP1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low-energy laser treatment is safe and may be effective in the treatment of autosomal dominant drusen."
    explanation: The authors conclude the treatment is safe and possibly effective, pending longer follow-up.
  - reference: PMID:38023612
    reference_title: "Long-Term Structural and Functional Assessment of Doyne Honeycomb Retinal Dystrophy following Nanosecond 2RT Laser Treatment: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2RT treatment in DHRD may improve or stabilize some retinal function parameters without significant structural changes"
    explanation: A three-patient series followed for up to 30 months reports functional stabilization or improvement after nanosecond laser.
- name: Genetic counseling
  description: >-
    Counseling for autosomal dominant inheritance with incomplete penetrance and
    variable expressivity; cascade testing of relatives for the single known
    variant.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:16799055
    reference_title: "Maculopathy due to the R345W substitution in fibulin-3: distinct clinical features, disease variability, and extent of retinal dysfunction."
    supports: SUPPORT

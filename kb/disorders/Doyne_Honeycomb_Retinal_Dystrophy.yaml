- name: Allele-specific EFEMP1 antisense oligonucleotide (preclinical)
  description: >-
    Preclinical only. An allele-specific antisense oligonucleotide that degrades
    the EFEMP1 c.1033C>T transcript by RNase H cleared the mutant transcript in
    patient iPSC-RPE and, after gymnotic delivery, rescued ECM remodeling,
    reduced intracellular lipid and cleared extracellular deposits, even after
    the disease phenotype had appeared. No clinical study has been reported.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  oligonucleotide_details:
    oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: EFEMP1
      term:
        id: hgnc:3218
        label: EFEMP1
    target_transcript: EFEMP1 c.1033C>T (R345W) mRNA
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Fibulin-3 R345W Misfolding and Impaired Secretion
    treatment_effect: INHIBITS
    description: Removes the mutant transcript, and so the mutant protein, while sparing the wild-type allele.
    evidence:
    - reference: PMID:42306086
      reference_title: "Antisense oligonucleotide allele-specific targeting of EFEMP1 in a patient-derived model of Doyne honeycomb retinal dystrophy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We developed an allele-specific antisense oligonucleotide which specifically and effectively promoted the clearance of the EFEMP1 c.1033C>T transcript in the patient-derived disease model following assisted or gymnotic delivery."
      explanation: The ASO selectively clears the mutant transcript.
  evidence:
  - reference: PMID:42306086
    reference_title: "Antisense oligonucleotide allele-specific targeting of EFEMP1 in a patient-derived model of Doyne honeycomb retinal dystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gymnotic delivery rescued remodeling of the ECM, reduced intracellular accumulation of lipids, and cleared extracellular deposits, even after the onset of the disease phenotype"
    explanation: In patient-derived RPE, the ASO reverses the disease phenotype; this is cell-model evidence only.
  - reference: PMID:42306086
    reference_title: "Antisense oligonucleotide allele-specific targeting of EFEMP1 in a patient-derived model of Doyne honeycomb retinal dystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we designed an antisense oligonucleotide to specifically promote the downregulation of the R345W EFEMP1 transcript through RNase H-dependent degradation"
    explanation: Documents the RNase H knockdown mechanism.
animal_models:
- name: Efemp1 R345W knock-in mouse
  species: Mouse
  genotype: Efemp1 p.R345W knock-in (heterozygous and homozygous)
  description: >-
    Two independently generated knock-in lines carry the disease mutation in
    murine Efemp1. Heterozygous and homozygous mice develop sub-RPE basal
    (laminar) deposits from about 4 months that grow into continuous sheets,
    with fibulin-3 and TIMP3 in the deposits, abnormal Bruch's membrane ECM,
    local complement activation, Nlrp3 upregulation and, in older mice, RPE and
    choroidal degeneration. Mice have no macula, the deposits are microscopic
    rather than clinical drusen, and detectable retinal degeneration is not
    reproduced. The model has been used to show that removal or inhibition of
    C3, factor B, Nlrp3/caspase-1 and GSK3 reduces deposits.
  publication: PMID:17664227
  modeled_mechanisms:
  - target: Sub-RPE Basal Deposit and Drusen Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces the sub-RPE basal deposits that precede drusen.
    limitations: >-
      Mice lack a macula and form microscopic basal laminar deposits rather than
      clinically visible honeycomb drusen; detectable retinal degeneration and
      vision loss are not reproduced.
    evidence:
    - reference: PMID:17666404
      reference_title: "The R345W mutation in EFEMP1 is pathogenic and causes AMD-like deposits in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The mutant Efemp1-R345W mice develop deposits of material between Bruch's membrane and the RPE, which resemble basal deposits in patients with AMD."
      explanation: The knock-in reproduces sub-RPE basal deposits.
    - reference: PMID:31095679

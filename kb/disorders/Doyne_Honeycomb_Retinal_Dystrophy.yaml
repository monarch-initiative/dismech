- name: Alternative Complement Activation
  description: >-
    The abnormal ECM triggers local complement activation by the RPE, with C3
    cleavage and increased alternative pathway activity (iC3b and Ba). Genetic
    removal of C3, or deletion or inhibition of complement factor B, reduces
    basal deposits in the knock-in mouse, whereas removal of C5 does not, which
    places the effect at C3 rather than at the terminal pathway. In the knock-in
    mouse the effect is sex-dependent: females have more deposits and show the
    complement elevation and the response to factor B inhibition, males do not.

genetic:
- name: EFEMP1
  gene_term:
    preferred_term: EFEMP1
    term:
      id: hgnc:3218
      label: EFEMP1
  relationship_type: CAUSATIVE
  association: Causative
  variant_origin: GERMLINE
  features: >-
    A single recurrent heterozygous missense variant, c.1033C>T p.(Arg345Trp)
    (R345W) in exon 10, accounts for molecularly confirmed DHRD/ML. It was
    absent from 477 controls and 494 AMD patients in the original study. The
    variant occurs on more than one haplotype, and an apparently de novo case
    has been reported, consistent with recurrent mutation rather than a single
    founder. R345W acts as a toxic gain of function.
  evidence:
  - reference: PMID:10369267
    reference_title: "A single EFEMP1 mutation associated with both Malattia Leventinese and Doyne honeycomb retinal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we use a combination of positional and candidate gene methods to identify a single non-conservative mutation (Arg345Trp) in the gene EFEMP1 (for EGF-containing fibrillin-like extracellular matrix protein 1) in all families studied."
    explanation: The original gene discovery found the same EFEMP1 variant in all ML and DHRD families.
  - reference: PMID:10369267
    reference_title: "A single EFEMP1 mutation associated with both Malattia Leventinese and Doyne honeycomb retinal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This change was not present in 477 control individuals or in 494 patients with age-related macular degeneration."
    explanation: The variant is absent from controls and from AMD patients.
  - reference: PMID:17666404
    reference_title: "The R345W mutation in EFEMP1 is pathogenic and causes AMD-like deposits in mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic studies show that one of the identified families with the R345W mutation has a novel haplotype."
    explanation: R345W on a different haplotype argues for independent recurrence and against linkage to a founder chromosome.
  - reference: PMID:17666404
    reference_title: "The R345W mutation in EFEMP1 is pathogenic and causes AMD-like deposits in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results confirm that the R345W mutation in EFEMP1 is pathogenic."
    explanation: The knock-in mouse phenotype confirms pathogenicity.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_2859008e-eeb1-4af4-8a6e-1bf5372bb3ab-2021-08-05T160000.000Z
    evidence:
    - reference: CGGV:assertion_2859008e-eeb1-4af4-8a6e-1bf5372bb3ab-2021-08-05T160000.000Z
      reference_title: "EFEMP1 / Doyne honeycomb retinal dystrophy (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "EFEMP1 | HGNC:3218 | Doyne honeycomb retinal dystrophy | MONDO:0007471 | AD | Definitive"
      explanation: The ClinGen Retina GCEP classifies EFEMP1 in DHRD as Definitive for autosomal dominant inheritance.
  variants:
  - name: c.1033C>T p.(Arg345Trp)
    synonyms:
    - R345W
    - NM_001039348.3:c.1033C>T
    description: >-
      Recurrent missense variant in fibulin-3 and the only variant included in
      the ClinGen curation. Other EFEMP1 variants cause different phenotypes and
      are out of scope here.
    gene:
      preferred_term: EFEMP1
      term:
        id: hgnc:3218
        label: EFEMP1
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:42720932
      reference_title: "Widening the Spectrum of Disease Expression due to Heterozygous Variants in EFEMP1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Doyne honeycomb retinal dystrophy or malattia leventinese (DHRD/ML) is an autosomal dominant retinal disorder caused by a single recurrent p.Arg345Trp (NM_001039348.3:c.1033C>T) variant in EFEMP1"
      explanation: Gives the variant nomenclature and its single recurrent role.
    - reference: CGGV:assertion_2859008e-eeb1-4af4-8a6e-1bf5372bb3ab-2021-08-05T160000.000Z
      reference_title: "EFEMP1 / Doyne honeycomb retinal dystrophy (Definitive)"
      supports: SUPPORT

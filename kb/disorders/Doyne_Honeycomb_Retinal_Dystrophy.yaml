      evidence_source: HUMAN_CLINICAL
      snippet: "Fd-OCT revealed extensive or focal sub-retinal pigment epithelium (RPE) deposits, separation of RPE and Bruch's membrane, and disruption of the photoreceptor outer and inner segment layers. No outer retinal changes were visible outside areas with sub-RPE deposits."

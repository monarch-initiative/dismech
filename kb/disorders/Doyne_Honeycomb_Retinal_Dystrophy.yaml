- name: Efemp1 knockout mouse
  species: Mouse
  genotype: Efemp1-/-
  description: >-
    Loss of fibulin-3 causes early ageing features, reduced fascial elastic
    fibres and hernias, but no macular degeneration phenotype, and the mice
    resist sub-RPE deposit formation under stressors that induce deposits in
    wild-type mice. This negative result argues that DHRD is not caused by loss
    of fibulin-3 function.
  publication: PMID:17872905
  modeled_mechanisms:
  - target: Sub-RPE Basal Deposit and Drusen Formation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: Fibulin-3 null mice do not form sub-RPE deposits.
    limitations: >-
      A null allele does not model the dominant R345W toxic gain of function;
      the model is informative only as evidence against a loss-of-function
      mechanism.
    evidence:
    - reference: PMID:28264101
      reference_title: "Deletion of Efemp1 Is Protective Against the Development of Sub-RPE Deposits in Mouse Eyes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice lacking fibulin-3 do not develop sub-RPE deposits."
      explanation: The knockout fails to form deposits, even under stressors that induce them in wild-type mice.
  evidence:
  - reference: PMID:17872905
    reference_title: "Lack of fibulin-3 causes early aging and herniation, but not macular degeneration in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "No apparent macular degeneration associated defects were found in Efemp1(-/-) mice, suggesting that loss of fibulin-3 function is not the mechanism by which the mutation in EFEMP1 causes macular degeneration."
    explanation: Null mice lack the retinal disease.
experimental_models:
- name: Patient-derived DHRD iPSC-RPE
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  cell_source: >-
    RPE differentiated from induced pluripotent stem cells of patients carrying
    EFEMP1 R345W, compared with unaffected, isogenic gene-corrected or EFEMP1
    knockout controls
  publication: PMID:42306086
  description: >-
    Patient iPSC-RPE reproduces drusen-like sub-RPE deposits containing ApoE
    and collagen IV, ECM remodeling, lipid accumulation with reduced CES1 and
    cholesterol efflux, ER stress, lysosomal dysfunction, apoptosis and
    upregulated complement genes. It has been used to test trehalose and an
    allele-specific ASO.
  modeled_mechanisms:
  - target: Sub-RPE Basal Deposit and Drusen Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Forms drusen-like deposits beneath patient RPE in culture.
    limitations: >-
      Cultured RPE lacks the choroid, the full layers of Bruch's membrane,
      photoreceptors and systemic factors, so deposits are drusen-like rather
      than clinical drusen.
    evidence:
    - reference: PMID:42306086
      reference_title: "Antisense oligonucleotide allele-specific targeting of EFEMP1 in a patient-derived model of Doyne honeycomb retinal dystrophy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In the patient-derived disease model, remodeling of the extracellular matrix (ECM) occurred with progressive accumulation of the drusen-associated proteins apolipoprotein E and collagen IV, in addition to the intracellular accumulation and extracellular deposition of lipids."
      explanation: Patient RPE accumulates drusen-associated proteins and lipids.
  - target: Impaired RPE Cholesterol Efflux
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    evidence:
    - reference: PMID:33909993
      reference_title: "Impaired cholesterol efflux in retinal pigment epithelium of individuals with juvenile macular degeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we detected significant downregulation of carboxylesterase 1 (CES1), an enzyme that converts cholesteryl ester to free cholesterol, an indispensable process in cholesterol export"
      explanation: The cholesterol efflux defect was found in DHRD iPSC-RPE.
  - target: RPE Lysosomal Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    evidence:
    - reference: PMID:42484373
      reference_title: "Restoration of impaired lysosomal function mitigates drusen-like deposit formation and cell death in Malattia Leventinese."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A key pathological feature was lysosomal dysfunction associated with altered regulation of lysosomal gene programs, including reduced transcription factor EB transcript levels."
      explanation: The lysosomal defect was found in ML iPSC-RPE.
  evidence:
  - reference: PMID:42306086
    reference_title: "Antisense oligonucleotide allele-specific targeting of EFEMP1 in a patient-derived model of Doyne honeycomb retinal dystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We reprogrammed patient-derived renal epithelial cells to induced pluripotent stem cells, followed by directed differentiation to retinal pigment epithelium and compared the phenotype to gene-corrected and EFEMP1 knockout patient-derived retinal pigment epithelium."
    explanation: Describes the patient-derived model with isogenic and knockout controls.

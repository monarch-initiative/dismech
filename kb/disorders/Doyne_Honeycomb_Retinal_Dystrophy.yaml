notes: >-
  Scope. MONDO:0007471 names the EFEMP1-caused disease, and this entry follows
  it. Orphanet ORPHA:75376 "Autosomal dominant drusen", mapped Exact to this
  MONDO term, also lists CFH and CFI as disease-causing genes, and a UK/US
  series found EFEMP1 R345W in only seven of ten dominant drusen families
  (PMID:11389162), so the clinical label "dominant drusen" is broader than this
  entry; dominant drusen families without EFEMP1 R345W are out of scope here.
  Other EFEMP1 phenotypes are separate diseases and are not lumped in: EFEMP1
  juvenile-onset open-angle glaucoma (PMID:34923728), and an adult-onset
  peripheral chorioretinal degeneration with severe rod dysfunction associated
  with p.Arg140Trp (PMID:42720932), which differs from canonical DHRD in
  topography.
  No GeneReviews chapter names this disease (committed Bookshelf index and a
  PubMed genereviews[book] search for EFEMP1, drusen, leventinese and Doyne
  returned none). Orphanet records the point-prevalence class as unknown, and no
  population prevalence estimate was found.
pathophysiology:
- name: Fibulin-3 R345W Misfolding and Impaired Secretion
  description: >-
    The heterozygous EFEMP1 p.Arg345Trp substitution causes fibulin-3 to
    misfold, in part through reduced native disulfide bonding in the domain
    carrying residue 345. Wild-type fibulin-3 is secreted, whereas the mutant is
    secreted inefficiently and retained within RPE cells. Loss of fibulin-3 does
    not reproduce the disease in mice, and Efemp1 knockout protects against
    sub-RPE deposits, so the variant acts as a toxic gain of function rather
    than through haploinsufficiency. Fibulin-3 is an extracellular matrix
    protein (its GO molecular function annotation is extracellular matrix
    structural constituent); that function is bound here as abnormal rather
    than decreased, because the mutant protein is retained and deposited
    abnormally rather than simply lost.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The most prominent feature of ML/DHRD is the development of radial or honeycomb patterns of drusen which can develop as early as adolescence."
    explanation: A review summarizes the radial or honeycomb drusen pattern and its early onset.
  downstream:

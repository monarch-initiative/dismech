  evidence:
  - reference: PMID:12242346
    reference_title: "Aberrant accumulation of EFEMP1 underlies drusen formation in Malattia Leventinese and age-related macular degeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that wild-type EFEMP1 is a secreted protein whereas mutant EFEMP1 is misfolded, secreted inefficiently, and retained within cells."
    explanation: Direct comparison of wild-type and R345W EFEMP1 shows misfolding, inefficient secretion and intracellular retention of the mutant.
  - reference: PMID:22031286
    reference_title: "Compromised mutant EFEMP1 secretion associated with macular dystrophy remedied by proteostasis network alteration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These secretion defects appear to be caused, in part, by reduced native disulfide bonding in domain 6 harboring the 345 position."
    explanation: A cell-based secretion assay attributes the R345W secretion defect partly to impaired disulfide bonding in the domain carrying residue 345.
  - reference: PMID:42306086
    reference_title: "Antisense oligonucleotide allele-specific targeting of EFEMP1 in a patient-derived model of Doyne honeycomb retinal dystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data support an EFEMP1 Arg345Trp toxic gain of function and the absence of haploinsufficiency in DHRD."
    explanation: Patient iPSC-RPE work, set beside the knockout data it cites, supports a toxic gain-of-function mechanism for R345W.
  - reference: PMID:17872905
    reference_title: "Lack of fibulin-3 causes early aging and herniation, but not macular degeneration in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "No apparent macular degeneration associated defects were found in Efemp1(-/-) mice, suggesting that loss of fibulin-3 function is not the mechanism by which the mutation in EFEMP1 causes macular degeneration."
    explanation: Efemp1 null mice lack the retinal phenotype, arguing against loss of function as the disease mechanism.
  downstream:
  - target: RPE Endoplasmic Reticulum Stress
    causal_link_type: DIRECT
    description: Retention of misfolded fibulin-3 in the ER activates the unfolded protein response in RPE cells.
    evidence:
    - reference: PMID:16249470
      reference_title: "Aberrant accumulation of fibulin-3 in the endoplasmic reticulum leads to activation of the unfolded protein response and VEGF expression."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "R345W was poorly secreted by ARPE-19 cells and accumulated in the ER, leading to UPR activation and increased VEGF expression."
      explanation: In RPE-derived cells the poorly secreted R345W protein accumulates in the ER and activates the UPR.
  - target: Abnormal Bruch's Membrane Extracellular Matrix
    causal_link_type: DIRECT
    description: Mutant fibulin-3 accumulates beneath the RPE and alters the composition and turnover of the RPE basal lamina and Bruch's membrane.
    evidence:
    - reference: PMID:12242346
      reference_title: "Aberrant accumulation of EFEMP1 underlies drusen formation in Malattia Leventinese and age-related macular degeneration."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, in ML eyes, EFEMP1 accumulates within the RPE cells and between the RPE and drusen, but does not appear to be a major component of drusen."
      explanation: Human ML eyes show the mutant protein accumulating within and beneath the RPE, at the RPE-drusen interface.
    - reference: PMID:26199322
      reference_title: "A local complement response by RPE causes early-stage macular degeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Increased activation of complement appears to occur in response to an abnormal extracellular matrix (ECM), generated by the mutant EFEMP1(R345W) protein and reduced ECM turnover due to inhibition of matrix metalloproteinase 2 by EFEMP1(R345W) and C3a."
      explanation: Primary Efemp1 R345W RPE cells generate an abnormal ECM with reduced turnover.
  - target: Impaired RPE Cholesterol Efflux
    causal_link_type: DIRECT
    description: Expression of EFEMP1 R345W attenuates RPE cholesterol efflux.
    evidence:
    - reference: PMID:33909993
      reference_title: "Impaired cholesterol efflux in retinal pigment epithelium of individuals with juvenile macular degeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "attenuated cholesterol efflux and led to lipid droplet accumulation"
      explanation: In iPSC-derived RPE, overexpression of EFEMP1 R345W (like CES1 knockdown) attenuated cholesterol efflux and caused lipid droplet accumulation.
  - target: RPE Lysosomal Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Patient-derived ML iPSC-RPE carrying the mutation show lysosomal
      dysfunction; how mutant fibulin-3 produces it is not established.
    evidence:
    - reference: PMID:42484373
      reference_title: "Restoration of impaired lysosomal function mitigates drusen-like deposit formation and cell death in Malattia Leventinese."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A key pathological feature was lysosomal dysfunction associated with altered regulation of lysosomal gene programs, including reduced transcription factor EB transcript levels."
      explanation: Lysosomal dysfunction is a feature of RPE derived from a patient with the EFEMP1 mutation.
  - target: NLRP3 Inflammasome Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      R345W knock-in mice show retinal Nlrp3 upregulation and inflammasome
      component transcription in RPE/choroid; the intermediate steps from the
      mutant protein are not defined.
    evidence:
    - reference: PMID:41198612
      reference_title: "Genetic removal of Nlrp3 protects against age-related and R345W Efemp1-induced basal laminar deposit formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "R345W+/+ knockin mice demonstrated increased Muller cell gliosis, subretinal Iba-1+ cells, higher Nlrp3 immunoreactivity in the retina"
      explanation: The knock-in model shows increased Nlrp3 in the retina compared with controls.
- name: RPE Endoplasmic Reticulum Stress
  description: >-
    Intracellular retention of misfolded R345W fibulin-3 induces endoplasmic
    reticulum stress and the unfolded protein response in the RPE, observed in
    RPE cell lines, in knock-in mouse eyecups and in patient-derived iPSC-RPE,
    where it accompanies fibulin-3 and ApoE aggregation and increased apoptosis.

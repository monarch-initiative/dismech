diagnosis:
- name: Multimodal retinal imaging
  description: >-
    Fundus examination with autofluorescence, OCT and angiography shows the
    radial macular and peripapillary drusen, sub-RPE hyperreflective material
    with RPE elevation, and complications such as CNV. Peripapillary deposits
    strongly suggest the R345W genotype.
  diagnosis_term:
    preferred_term: eye examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  evidence:
  - reference: PMID:22814526

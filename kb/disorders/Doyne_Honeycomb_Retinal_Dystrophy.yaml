    of carboxylesterase 1 (CES1), which converts cholesteryl ester to free
    cholesterol for export. CES1 knockdown or EFEMP1 R345W overexpression
    attenuates cholesterol efflux and causes intracellular lipid droplet
    accumulation; R345W fibulin-3 also has a stronger inhibitory effect on EGFR
    signalling than wild type, which may suppress CES1 through reduced SP1.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: cholesterol efflux
    term:
      id: GO:0033344
      label: cholesterol efflux
    modifier: DECREASED
  chemical_entities:
  - preferred_term: cholesteryl ester
    term:
      id: CHEBI:17002
      label: cholesteryl ester
  evidence:
  - reference: PMID:33909993
    reference_title: "Impaired cholesterol efflux in retinal pigment epithelium of individuals with juvenile macular degeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we detected significant downregulation of carboxylesterase 1 (CES1), an enzyme that converts cholesteryl ester to free cholesterol, an indispensable process in cholesterol export"
    explanation: Patient-derived DHRD RPE shows loss of an enzyme needed for cholesterol export.
  downstream:
  - target: Sub-RPE Basal Deposit and Drusen Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Lipid retention in the RPE is proposed to feed the lipid-rich component of
      drusen; the study measured intracellular lipid droplets, not drusen.
    evidence:
    - reference: PMID:33909993
      reference_title: "Impaired cholesterol efflux in retinal pigment epithelium of individuals with juvenile macular degeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Abnormal intracellular accumulation of lipid droplets and pericellular deposits of lipid-rich material in the retinal pigment epithelium (RPE) called drusen are clinical hallmarks of different forms of MD including Doyne honeycomb retinal dystrophy (DHRD)"
      explanation: The authors frame the lipid handling defect as the basis of the lipid-rich drusen of DHRD; the link to drusen is inferred rather than measured.
- name: RPE Lysosomal Dysfunction
  description: >-
    ML patient iPSC-RPE show lysosomal dysfunction with altered lysosomal gene
    programs and reduced TFEB transcripts, increased hexosylceramide and
    bis-monoacylglycerophosphate, and, after long-term culture with
    photoreceptor outer segments, drusen-like deposits containing ApoE,
    complement components and collagen IV. Restoring lysosomal function with
    trehalose reduced deposits, MMP2 activation and apoptosis.

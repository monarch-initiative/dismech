- name: NLRP3 Inflammasome Activation
  description: >-
    R345W knock-in mice show retinal gliosis, subretinal Iba-1 positive cells,
    increased retinal Nlrp3 and transcriptional upregulation of C3, Nlrp3,
    pro-Il1b and pro-caspase-1 in RPE/choroid. Genetic removal of Nlrp3 or
    caspase-1 reduces basal laminar deposits, so inflammasome signalling
    contributes to deposit formation in this model. It has not been examined in
    patient tissue.

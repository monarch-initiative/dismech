    reference_title: "Mouse genetics and proteomic analyses demonstrate a critical role for complement in a model of DHRD/ML, an inherited macular degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Proteomic analyses of Bruch's membrane/choroid and Bruch's membrane in the Efemp1(R345W/R345W) mice indicate that the basal deposits comprise normal extracellular matrix (ECM) components present in abnormal amounts."
    explanation: Proteomics of knock-in Bruch's membrane shows an abnormal ECM composition.
  - reference: PMID:17666404
    reference_title: "The R345W mutation in EFEMP1 is pathogenic and causes AMD-like deposits in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These basal deposits contain Efemp1 and Timp3, an Efemp1 interacting protein."
    explanation: Mutant fibulin-3 and TIMP3 are incorporated into the sub-RPE matrix deposits.
  - reference: PMID:28622396
    reference_title: "Mutant Fibulin-3 Causes Proteoglycan Accumulation and Impaired Diffusion Across Bruch's Membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "HSPGs and C/DSPGs were markedly increased in Efemp1ki/ki Bruch's membrane, and MMP-2 and MMP-9 were decreased, but TIMP-3 was increased. Diffusion across Efemp1ki/ki Bruch's membrane was impaired."
    explanation: Knock-in Bruch's membrane accumulates proteoglycans, shifts the MMP/TIMP balance and loses diffusional permeability.
  - reference: PMID:29095988
    reference_title: "Changes in extracellular matrix cause RPE cells to make basal deposits and activate the alternative complement pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This process is exacerbated by impaired ECM turnover via increased matrix metalloproteinase-2 activity."
    explanation: In matrix made by CRISPR-edited R345W ARPE-19 cells, ECM turnover is impaired, here with increased MMP-2 activity, opposite in direction to the knock-in mouse data.
  - reference: PMID:42569289
    reference_title: "Interactions Between Epidermal Growth Factor-Containing Fibulin-Like Extracellular Matrix Protein 1 and Tissue Inhibitor of Metalloproteinases-3 and Relevance to Age-Related Macular Degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In Doyne Honeycomb Retinal Dystrophy, the EFEMP1 R345W mutation causes rapid disease progression through impaired protein secretion, abnormal matrix accumulation, and complement dysregulation."
    explanation: A 2026 review summarizes impaired secretion, abnormal matrix accumulation and complement dysregulation as the disease mechanism.
  downstream:
  - target: Alternative Complement Activation
    causal_link_type: DIRECT
    description: The abnormal ECM binds and activates complement C3 locally at the RPE-Bruch's membrane interface.
    evidence:
    - reference: PMID:29095988
      reference_title: "Changes in extracellular matrix cause RPE cells to make basal deposits and activate the alternative complement pathway."

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OCT showed the large round drusen as focal or diffuse deposition of hyperreflective material between the RPE and Bruch membrane within the macula"
    explanation: OCT localizes the drusen between the RPE and Bruch's membrane.
  - reference: PMID:16799055
    reference_title: "Maculopathy due to the R345W substitution in fibulin-3: distinct clinical features, disease variability, and extent of retinal dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The findings established that the presence of peripapillary deposit is highly likely to indicate that a patient carries the R345W mutation."
    explanation: A clinical sign that predicts the genotype.
- name: EFEMP1 molecular genetic testing
  description: >-
    Diagnosis is confirmed by detecting heterozygous EFEMP1 c.1033C>T
    p.(Arg345Trp) by targeted testing, a retinal dystrophy gene panel or exome
    sequencing. Because the disease is defined by one variant, targeted testing
    is efficient; a restriction-digest assay for the variant has been described.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:41971199

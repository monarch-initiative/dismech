    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "demonstrate that dysfunction of RPE cells alone is sufficient for the initiation of sub-RPE lipoproteinaceous deposit (drusen) formation and extracellular matrix (ECM) alteration in these diseases"
    explanation: Patient-derived DHRD RPE initiates drusen-like deposits without other cell types.
  - reference: PMID:26427406

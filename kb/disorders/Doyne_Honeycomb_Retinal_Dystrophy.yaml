    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Malattia Leventinese (ML) and Doyne honeycomb retinal dystrophy (DHRD) refer to two autosomal dominant diseases characterized by yellow-white deposits known as drusen that accumulate beneath the retinal pigment epithelium (RPE)."
    explanation: Defines the disease by sub-RPE drusen accumulation.

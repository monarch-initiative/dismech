name: Doyne Honeycomb Retinal Dystrophy
creation_date: "2026-10-14T20:49:40Z"
category: Mendelian
description: >-
  Doyne honeycomb retinal dystrophy (DHRD), also called malattia leventinese
  (ML), is an autosomal dominant macular dystrophy caused by a single recurrent
  missense variant in EFEMP1, c.1033C>T p.(Arg345Trp), which encodes the
  secreted extracellular matrix glycoprotein fibulin-3. Yellow-white drusen
  accumulate beneath the retinal pigment epithelium (RPE), in Bruch's membrane,
  in the macula and around the optic disc, often in a radial pattern, and
  coalesce with age into a honeycomb-like pattern. Drusen can be present from
  adolescence, while visual symptoms (reduced central vision, delayed dark
  adaptation, metamorphopsia, photophobia, paracentral scotoma) usually begin
  in early to mid adulthood. RPE atrophy, macular hyperpigmentation, geographic
  atrophy and, less often, choroidal neovascularization drive late central
  vision loss. The mutant protein misfolds, is secreted inefficiently and is
  retained in the RPE, causing endoplasmic reticulum stress, an abnormal Bruch's
  membrane extracellular matrix and local alternative complement activation that
  together drive sub-RPE deposit formation; R345W behaves as a toxic gain of
  function rather than haploinsufficiency. Expressivity is highly variable and
  nonpenetrance has been reported. There is no approved disease-modifying
  therapy. Because it reproduces the drusen biology of age-related macular
  degeneration (AMD) from a single genetic lesion, DHRD is used as a monogenic
  model of AMD.

phenotypes:
- name: Macular drusen
  category: Ophthalmological
  diagnostic: true
  description: >-
    Yellow-white sub-RPE drusen in the macula, often radially distributed, that
    become confluent with age in a honeycomb-like pattern; large round drusen
    sit in the perimacular area and smaller radial drusen temporal to the macula.
  phenotype_term:
    preferred_term: Macular drusen
    term:
      id: HP:0030499
      label: Macular drusen
  evidence:
  - reference: PMID:16799055
    reference_title: "Maculopathy due to the R345W substitution in fibulin-3: distinct clinical features, disease variability, and extent of retinal dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peripapillary deposition and a radial distribution of macular drusen were consistent, distinguishing signs in the mutation-positive group."
    explanation: Radially distributed macular drusen consistently distinguish R345W carriers.
  - reference: PMID:42720932
    reference_title: "Widening the Spectrum of Disease Expression due to Heterozygous Variants in EFEMP1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "characterized by early-onset, nearly confluent, large central retinal drusen"
    explanation: Describes the early-onset confluent central drusen of canonical DHRD/ML.
  - reference: PMID:22814526
    reference_title: "Multimodal morphological and functional characterization of Malattia Leventinese."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The smallest drusen were not round, radially distributed, mostly localized temporally to the macula."
    explanation: Multimodal imaging documents the radial small-drusen component.
  - reference: PMID:41971199
    reference_title: "Early-onset drusen in Malattia Leventinese with EFEMP1 mutation differ from drusen in age-related macular degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All cases exhibited early-onset central vision loss and small, radially distributed drusen, consistent with ML/DHRD."
    explanation: Radial drusen were present in every case of an Indian series.
- name: Peripapillary drusen
  category: Ophthalmological
  diagnostic: true
  description: >-
    Drusen around the optic disc, especially nasal to it, are a consistent,
    distinguishing sign; their presence makes carriage of R345W highly likely.
    These are sub-RPE drusen around the disc, not optic nerve head drusen, so
    HP:0012426 Optic disc drusen does not apply and HP:0011510 Drusen is bound.
  phenotype_term:
    preferred_term: Peripapillary drusen
    term:
      id: HP:0011510
      label: Drusen
  evidence:
  - reference: PMID:16799055
    reference_title: "Maculopathy due to the R345W substitution in fibulin-3: distinct clinical features, disease variability, and extent of retinal dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The findings established that the presence of peripapillary deposit is highly likely to indicate that a patient carries the R345W mutation."
    explanation: Peripapillary deposits are a strong clinical indicator of the R345W genotype.
  - reference: PMID:33689237
    reference_title: "First reported case of Doyne honeycomb retinal dystrophy (Malattia Leventinese/autosomal dominant drusen) in Scandinavia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On both eyes, ophthalmological findings included massive hard drusen in the macular region and nasal to the optic disc as well as macular hyperpigmentation."
    explanation: A confirmed case with drusen nasal to the optic disc.
- name: Drusen hyperautofluorescence
  category: Ophthalmological
  description: Drusen show increased fundus autofluorescence, most intense in large drusen.
  phenotype_term:
    preferred_term: Hyperautofluorescent drusen
    term:
      id: HP:0025158
      label: Hyperautofluorescent retinal lesion
  evidence:
  - reference: PMID:25111685
    reference_title: "Malattia leventinese/Doyne honeycomb retinal dystrophy in a chinese family with mutation of the EFEMP1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased autofluorescence corresponding to the drusen was detected in the R345W mutation patients."
    explanation: Fundus autofluorescence is increased over the drusen in R345W carriers.
  - reference: PMID:22814526
    reference_title: "Multimodal morphological and functional characterization of Malattia Leventinese."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FAF revealed an intense autofluorescence of large drusen."
    explanation: Large drusen are intensely autofluorescent.
- name: Reduced visual acuity
  category: Ophthalmological
  description: >-
    Reduced central visual acuity, with onset of vision loss usually in early to
    mid adulthood and highly variable severity, including within families.
  phenotype_term:
    preferred_term: Reduced central visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  evidence:
  - reference: PMID:33689237
    reference_title: "First reported case of Doyne honeycomb retinal dystrophy (Malattia Leventinese/autosomal dominant drusen) in Scandinavia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Debut of vision loss often occurs in early to mid-adulthood, and the degree varies."
    explanation: States the usual age of onset and variability of vision loss.
  - reference: PMID:25111685
    reference_title: "Malattia leventinese/Doyne honeycomb retinal dystrophy in a chinese family with mutation of the EFEMP1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intrafamilial patients with Malattia leventinese/Doyne honeycomb retinal dystrophy seem to be phenotypically variable in visual loss"
    explanation: Visual loss varies between affected members of one family.

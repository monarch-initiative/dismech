    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surveillance: Systematic follow up to monitor rehabilitation and treatment as needed; annual complete blood count and renal function testing; consideration of routine liver ultrasounds.
    explanation: Provides the explicit historical surveillance schedule, retained with a retirement caveat.
  - reference: PMID:20301362
    reference_title: "Wolf-Hirschhorn Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standard care is recommended for skeletal anomalies, ophthalmologic abnormalities, congenital heart defects, hearing loss, sleep disturbance, and hepatic adenomas.
    explanation: Supports coordinated specialty follow-up across recurrent WHS complications.
animal_models:
- species: Mus musculus
  genotype: Whsc1/Nsd2 deficiency, including haploinsufficient and deficient mouse embryos
  genes:
  - preferred_term: NSD2
    term:
      id: hgnc:12766
      label: NSD2
  description: >-
    Whsc1-deficient mice model one deleted gene rather than the full human 4p
    contiguous deletion. They show growth retardation and WHS-like midline and
    cardiovascular defects, with genetic interaction between Whsc1 and Nkx2-5.
    A complementary cochlear study found disorganized hair cells and abnormal
    stereocilia bundles, supporting an NSD2-dependent sensorineural-hearing
    mechanism. The single-gene model cannot assign the remaining human
    deletion phenotypes.
  associated_phenotypes:
  - Growth retardation
  - Midline defects
  - Congenital cardiovascular anomalies
  - Cochlear hair-cell and stereocilia abnormalities
  evidence:
  - reference: PMID:19483677
    reference_title: "A histone H3 lysine 36 trimethyltransferase links Nkx2-5 to Wolf-Hirschhorn syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Whsc1-deficient mice showed growth retardation and various WHS-like midline defects, including congenital cardiovascular anomalies.
    explanation: Documents WHS-relevant growth, midline, and cardiac phenotypes in the mouse model.
  - reference: PMID:19483677
    reference_title: "A histone H3 lysine 36 trimethyltransferase links Nkx2-5 to Wolf-Hirschhorn syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The effects of Whsc1 haploinsufficiency were increased in Nkx2-5 heterozygous mutant hearts, indicating their functional link.
    explanation: Supports a Whsc1-Nkx2-5 developmental interaction in the cardiac phenotype.
  - reference: PMID:26092122
    reference_title: "Auditory hair cell defects as potential cause for sensorineural deafness in Wolf-Hirschhorn syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although auditory hair cells are specified normally, their stereocilia hair bundles required for sound perception fail to develop the appropriate morphology.
    explanation: Documents the cochlear hair-bundle phenotype in Whsc1-deficient mice.
- species: Mus musculus
  genotype: Heterozygous Letm1 loss (Letm1±)
  genes:
  - preferred_term: LETM1
    term:
      id: hgnc:6556
      label: LETM1
  description: >-
    Heterozygous Letm1 mice show increased susceptibility to chemically induced
    seizures. This single-gene, provoked-seizure model supports a susceptibility
    role but does not reproduce spontaneous human WHS epilepsy or the multigene
    distal 4p deletion.
  associated_phenotypes:
  - Increased chemically induced seizure susceptibility
  evidence:
  - reference: PMID:26747863
    reference_title: "Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      heterozygous Letm1± mice, as well as rats with a lentiviral-mediated Letm1 knockdown, demonstrate increased seizure susceptibility in response to kainic acid or pilocarpine seizure induction.
    explanation: >-
      Documents challenge-induced seizure susceptibility in heterozygous Letm1
      mice while leaving spontaneous epilepsy and multigene effects untested.
- species: Rattus norvegicus
  genotype: Lentiviral-mediated Letm1 knockdown
  genes:
  - preferred_term: LETM1
    term:
      id: hgnc:6556
      label: LETM1
  description: >-
    Lentiviral Letm1 knockdown in rats increases susceptibility to chemically
    induced seizures. The acute single-gene perturbation and provoked endpoint
    limit translation to spontaneous epilepsy in a constitutional multigene 4p
    deletion.
  associated_phenotypes:
  - Increased chemically induced seizure susceptibility
  evidence:
  - reference: PMID:26747863
    reference_title: "Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      heterozygous Letm1± mice, as well as rats with a lentiviral-mediated Letm1 knockdown, demonstrate increased seizure susceptibility in response to kainic acid or pilocarpine seizure induction.
    explanation: >-
      Documents challenge-induced seizure susceptibility after rat Letm1
      knockdown, not a constitutional human-like deletion model.
- species: Danio rerio
  genotype: Morpholino knockdown of DrWhsc1, the zebrafish NSD2 homolog
  genes:
  - preferred_term: NSD2
    term:
      id: hgnc:12766
      label: NSD2
  description: >-
    DrWhsc1 morphants model acute reduction of the zebrafish NSD2 homolog.
    They show impaired embryonic H3K36 dimethylation with brain, cartilage,
    bone, and motor-neuron abnormalities. Morpholino knockdown and a single-gene
    perturbation are important limitations relative to a stable heterozygous
    multigene human deletion.
  associated_phenotypes:
  - Endbrain enlargement
  - Abnormal cartilage
  - Reduced bone
  - Incomplete motor-neuron formation
  evidence:
  - reference: PMID:20946879
    reference_title: "Functional characterization of the zebrafish WHSC1-related gene, a homolog of human NSD2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Morpholino oligonucleotides for the DrWhsc1 gene affected early embryogenesis in zebrafish, such as endbrain enlargement, abnormal cartilage, marked reduction of bone, and incomplete motor neuron formation.
    explanation: Defines the developmental phenotype of the zebrafish knockdown model.
  - reference: PMID:20946879
    reference_title: "Functional characterization of the zebrafish WHSC1-related gene, a homolog of human NSD2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      suppression of the DrWhsc1 gene or defect in the SET domain of DrWhsc1 resulted in impairment of di-methylation of histone H3K36 at early embryogenesis
    explanation: Links DrWhsc1 perturbation to the predicted chromatin defect.
discussions:
- discussion_id: gap_whs_deletion_resolved_causality
  prompt: >-
    Which distal 4p genes and gene combinations are necessary for each major WHS
    phenotype, and how do deletion size, breakpoint, and additional duplicated
    material alter penetrance?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#4p16.3 Contiguous Gene Deletion
  - pathophysiology#NSD2 (WHSC1) Haploinsufficiency
  - pathophysiology#Telomeric 4p Seizure-Susceptibility Region Haploinsufficiency
  - pathophysiology#Candidate Multigene Neuronal-Communication Dysfunction
  rationale: >-
    Human deletion mapping supports a multigene syndrome and identifies
    candidate intervals, but most individual-gene assignments remain
    correlational or extrapolated. Resolving this gap is necessary for
    genotype-specific prognosis and for distinguishing causal drivers from
    passengers in differently sized deletions.
  proposed_experiments:
  - experiment_id: exp_whs_isogenic_4p_dosage_series
    name: Isogenic distal-4p deletion and gene-restoration series
    description: >-
      Engineer matched human iPSC lines carrying nested heterozygous distal-4p
      deletions, then restore NSD2, LETM1, PIGG, or defined gene combinations.
      Differentiate cortical, neural-crest, cardiac, renal, and cochlear lineages
      and compare chromatin, mitochondrial, electrophysiologic, migration, and
      morphogenesis readouts.
    decision_criterion: >-
      Reproducible rescue by one restored gene would assign that dosage
      component to the affected lineage; rescue only after defined multigene
      restoration would support a synergistic contiguous-deletion mechanism.
    evidence:
    - reference: PMID:26239400
      reference_title: "Wolf-Hirschhorn syndrome: A review and update."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Thus, the next step is to determine the precise effects of specific gene deletions.
      explanation: Motivates an isogenic experiment that separates the effects of specific deleted genes.
  evidence:
  - reference: PMID:26239400
    reference_title: "Wolf-Hirschhorn syndrome: A review and update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thus, the next step is to determine the precise effects of specific gene deletions.
    explanation: The review explicitly identifies gene-resolved dosage effects as the next mechanistic task.
  - reference: PMID:26239400
    reference_title: "Wolf-Hirschhorn syndrome: A review and update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      our focus will continue to be on the establishment of robust genotype-phenotype correlations and the penetrance of these phenotypes.
    explanation: Supports the need for deletion-resolved penetrance estimates.
- discussion_id: gap_whs_human_model_translation
  prompt: >-
    How faithfully do current NSD2 developmental models and LETM1
    seizure-susceptibility models represent a human heterozygous multigene 4p
    deletion?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired H3K36 Dimethylation and Developmental Gene Mis-regulation
  - pathophysiology#LETM1 Haploinsufficiency and Mitochondrial Ion Dyshomeostasis
  - pathophysiology#Candidate FGFR3-Dependent Neural-Crest Signaling Defect
  - pathophysiology#Humoral Antibody Deficiency
  rationale: >-
    Existing models establish important NSD2- and LETM1-dependent biology but
    perturb one gene; some use homozygous deficiency, transient knockdown, or
    pharmacologically triggered seizures. They cannot by themselves validate
    the human effects of heterozygous dosage loss across multiple neighboring
    genes or interactions with unbalanced-translocation trisomic material.
  proposed_experiments:
  - experiment_id: exp_whs_model_benchmark
    name: Cross-model benchmark against deletion-resolved human cells
    description: >-
      Compare matched molecular and developmental readouts across nested-deletion
      human iPSC lineages, stable heterozygous Nsd2 mouse cells, and stable
      heterozygous zebrafish mutants. In a parallel neuronal/seizure arm, compare
      human deletion-derived neurons with heterozygous Letm1 mice and
      lentiviral-mediated Letm1-knockdown rats at baseline and under matched
      kainic-acid or pilocarpine challenge. Separate conserved single-gene
      effects from phenotypes that require additional 4p dosage loss.
    decision_criterion: >-
      Translational conservation requires concordant lineage-specific NSD2
      signatures across heterozygous human and animal models and concordant
      LETM1-related neuronal or seizure-threshold effects across human cells,
      heterozygous mice, and rat knockdown. Effects confined to homozygous,
      morpholino, knockdown, or provoked-seizure conditions would limit their
      relevance to human WHS haploinsufficiency.
    evidence:
    - reference: PMID:26239400
      reference_title: "Wolf-Hirschhorn syndrome: A review and update."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        New animal models will also be developed to further our understanding of the effects of hemizygosity as well as to serve as models for treatment development.
      explanation: Motivates a cross-model benchmark centered on human hemizygosity.
    - reference: PMID:26747863
      reference_title: "Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        heterozygous Letm1± mice, as well as rats with a lentiviral-mediated Letm1 knockdown, demonstrate increased seizure susceptibility in response to kainic acid or pilocarpine seizure induction.
      explanation: >-
        Supplies the permitted evidence for the explicit LETM1 mouse/rat
        comparison arm while underscoring that the existing endpoint is
        challenge-induced seizure susceptibility.
  evidence:
  - reference: PMID:26239400
    reference_title: "Wolf-Hirschhorn syndrome: A review and update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      New animal models will also be developed to further our understanding of the effects of hemizygosity as well as to serve as models for treatment development.
    explanation: The review explicitly calls for models that address hemizygosity and treatment translation.
review_notes: >-
  The GeneReviews chapter available for WHS is retired and explicitly warns that
  it may be out of date. This review retains it as a clearly tagged historical
  baseline for diagnosis, management, surveillance, and counseling, and
  cross-checks phenotype frequencies, natural history, epilepsy, mortality,
  genotype mapping, and immune findings against later primary cohorts and
  reviews.

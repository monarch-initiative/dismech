    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risks to family members depend on the mechanism of origin of the deletion. Prenatal testing is possible for families in which one parent is known to be a carrier of a chromosome rearrangement involving 4p16.3."
    explanation: GeneReviews establishes the indication for genetic counseling and prenatal testing in WHS families.
- name: Immunoglobulin Replacement for Documented Antibody Deficiency
  description: >-
    IVIG may be used for selected individuals with documented antibody
    deficiency and clinically important infections; continuous antibiotic
    prophylaxis is another option described in the archival management summary.
    This is not universal treatment for all individuals with WHS.

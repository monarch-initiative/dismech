pathophysiology:
- name: 4p16.3 Contiguous Gene Deletion
  description: >
    Wolf-Hirschhorn syndrome is a contiguous gene deletion disorder caused
    by hemizygous loss of distal chromosome 4 (4p16.3). Two adjacent
    "critical regions" lie ~1.8-2.0 Mb from the 4p telomere: WHSCR (a
    ~165 kb interval encompassing parts of WHSC1/NSD2 and WHSC2/NELFA)
    and WHSCR-2 (a ~300-600 kb interval that includes the 5' end of
    WHSC1/NSD2 and all of LETM1). A separate ~197 kb terminal seizure
    susceptibility region (containing PIGG, ZNF721 and ABCA11P) lies
    ~368 kb from the 4p telomere. Phenotypic severity scales broadly
    with deletion size, but individual features track more tightly with
    which dosage-sensitive genes are removed.
  evidence:
  - reference: PMID:32914558
    reference_title: "Wolf-Hirschhorn syndrome: A case series from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The syndrome is caused by deletion of a critical region (Wolf-Hirschhorn Syndrome Critical region-WHSCR) on chromosome 4p16.3."
    explanation: This establishes the genetic basis of Wolf-Hirschhorn syndrome as a deletion of the critical region on 4p16.3.
  - reference: PMID:26747863
    reference_title: "Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wolf-Hirschhorn syndrome (WHS) is a contiguous gene deletion syndrome involving variable size deletions of the 4p16.3 region."
    explanation: Establishes WHS as a contiguous gene deletion syndrome of variable size.
  - reference: PMID:26747863
    reference_title: "Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Two adjacent regions, located approximately 1.8–2.0 Mbp from the 4p terminus, are each proposed to be the minimal region of deletion necessary to observe the core WHS features."
    explanation: Defines WHSCR/WHSCR-2 as the historically recognized critical regions for the core WHS phenotype.
  - reference: PMID:18474167
    reference_title: "Wolf-Hirschhorn syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a case of a rare chromosomal disorder, Wolf-Hirschhorn syndrome, caused by deletion of short arm of chromosome 4."
    explanation: This confirms that Wolf-Hirschhorn syndrome results from deletion of the short arm of chromosome 4.
  - reference: PMID:18932224
    reference_title: "Update on the clinical features and natural history of Wolf-Hirschhorn (4p-) syndrome: experience with 87 patients and recommendations for routine health supervision."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No single gene deletions or intragenic mutations have been shown to confer the full WHS phenotype.
    explanation: >-
      Supports a contiguous multigene dosage model rather than assigning the
      complete syndrome to one deleted gene.
  downstream:
  - target: NSD2 (WHSC1) Haploinsufficiency
    description: Loss of one copy of NSD2/WHSC1 within WHSCR/WHSCR-2 reduces H3K36 dimethyltransferase dosage.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26747863
      reference_title: "Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The first critical region described was a 165 kbp interval encompassing part of the WHSC1 gene and all of the WHSC2 (NELFA) gene.
      explanation: Places NSD2/WHSC1 within a mapped WHS critical region.
  - target: LETM1 Haploinsufficiency and Mitochondrial Ion Dyshomeostasis
    description: Loss of LETM1, located in WHSCR-2, halves the mitochondrial K+/H+ and Ca2+/H+ exchanger.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26747863
      reference_title: "Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the critical region (designated WHSCR2) lies in an adjacent, 300–600 kbp interval that includes the 5′ end of WHSC1 and the entirety of LETM1, a candidate seizure gene
      explanation: Places LETM1 within the proposed WHSCR2 interval.
  - target: Telomeric 4p Seizure-Susceptibility Region Haploinsufficiency
    description: Most WHS deletions extend to the 4p terminus, removing the ~197 kb terminal region containing PIGG and ZNF721.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26747863
      reference_title: "Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There are two genes and one pseudogene in this region: ZNF721, encoding a zinc-finger containing protein of unknown function, PIGG, a member of the phosphatidylinositol glycan anchor biosynthetic pathway, and ABCA11P, a pseudogene with sequence similarity to ATP-binding cassette, subfamily A genes
      explanation: Defines the gene content of the mapped 197 kb interval.
  - target: Candidate Multigene Neuronal-Communication Dysfunction
    description: >-
      Depending on the breakpoint, the 4p deletion can remove several candidate
      epilepsy contributors nominated by computational network analysis,
      including PIGG, CPLX1, CTBP1, and LETM1.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35278209
      reference_title: "Distinct Epileptogenic Mechanisms Associated with Seizures in Wolf-Hirschhorn Syndrome."
      supports: PARTIAL
      evidence_source: COMPUTATIONAL
      snippet: "The proximity among the previous reported haploinsufficient candidate genes (PIGG, CPLX1, CTBP1, LETM1) and disease genes associated with epilepsy suggests not just one, but different impaired mechanisms in cellular networks responsible for the balance of neuronal activity in WHS patients, from which neuron communication is the most impaired in WHS-related seizures."
      explanation: >-
        Nominates a multigene neuronal-network model; it does not establish that
        every WHS deletion removes all four genes or prove their individual
        causal contributions.
  - target: Candidate MSX1-Dependent Odontogenesis Defect
    description: Larger 4p deletions remove MSX1, a craniofacial/odontogenic transcription factor.
    causal_link_type: DIRECT
  - target: Candidate FGFR3-Dependent Neural-Crest Signaling Defect
    description: FGFR3 lies near the WHS critical regions and may be co-deleted depending on the breakpoint.
    causal_link_type: DIRECT
  - target: Microcephaly
    description: Distal 4p gene loss can produce microcephaly through unresolved multigene developmental mechanisms.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hypotonia
    description: Hypotonia is associated with the distal 4p deletion syndrome, but its gene-level mechanism remains unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18932224
      reference_title: "Update on the clinical features and natural history of Wolf-Hirschhorn (4p-) syndrome: experience with 87 patients and recommendations for routine health supervision."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hypotonia was present in virtually all patients.
      explanation: >-
        Supports the syndrome-level deletion-to-hypotonia association while
        leaving the responsible deleted gene or genes unresolved.
  - target: Status Epilepticus
    description: >-
      WHS-associated epilepsy can include status epilepticus, but available
      cohort evidence does not assign that complication to a particular distal
      interval or deleted gene.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41303083
      reference_title: "Epilepsy in Wolf-Hirschhorn Syndrome: Clinical Insights from a Pediatric Cohort and a Review of the Literature."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Status epilepticus occurred in 58% of cases, with a high proportion requiring multiple ASMs.
      explanation: >-
        Supports a syndrome-level association while explicitly leaving the
        responsible deletion interval and mechanism unresolved.
  - target: Corpus Callosum Abnormalities
    description: Structural brain abnormalities can accompany distal 4p deletion, but the responsible dosage-sensitive genes are unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Renal Anomalies
    description: Kidney and urinary-tract anomalies occur in the deletion syndrome without a securely mapped single-gene mechanism.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Feeding Difficulties
    description: Feeding impairment is a variable multisystem consequence of the deletion syndrome.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hearing Loss
    description: Hearing loss is a recurrent manifestation with conductive and sensorineural components and incompletely resolved gene attribution.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Ophthalmologic Abnormalities
    description: Ocular abnormalities occur in the distal 4p deletion syndrome, with the responsible gene-level mechanisms unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29199884
      reference_title: "Congenital cavitary optic disc anomaly and Axenfeld's anomaly in Wolf-Hirschhorn syndrome: A case report and review of the literature."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A variety of ocular manifestations may occur in up to 40% of patients.
      explanation: Supports the syndrome-level deletion-to-ocular-abnormality association without assigning a specific deleted gene.
  - target: Hepatic Neoplasia
    description: Rare reported hepatic neoplasms may be associated with the distal 4p deletion, but penetrance and gene attribution are unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30289612
      reference_title: "Risk of hepatic neoplasms in Wolf-Hirschhorn syndrome (4p-): Four new cases and review of the literature."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We propose that, in the context of the rarity of WHS, these seven cases suggest that hepatocellular neoplasia may be a feature of WHS.
      explanation: Supports a proposed syndrome association based on seven cumulative cases, not an established frequency or mechanism.
- name: NSD2 (WHSC1) Haploinsufficiency
  description: >
    NSD2 (also called WHSC1 or MMSET) encodes a SET-domain histone
    methyltransferase that dimethylates lysine 36 of histone H3
    (H3K36me2). NSD2 partners with cell-type-specific transcription
    factors (e.g., Sall1/Sall4/Nanog in embryonic stem cells, Nkx2-5 in
    embryonic heart) to deposit H3K36 marks at developmental gene loci,
    preventing inappropriate transcription. Hemizygous loss of NSD2 is
    included in essentially all classic WHS deletions and is a well-supported
    contributor to the craniofacial, growth, neurodevelopmental and
    cardiovascular phenotypes. NSD2 loss alone has not been shown to reproduce
    the full human contiguous-deletion syndrome.

  - reference: PMID:20301362
    reference_title: "Wolf-Hirschhorn Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Carbamazepine may worsen atypical absence seizures.
    explanation: Records the seizure-type-specific medication-safety warning.
- name: Growth Hormone Therapy
  description: >-
    Recombinant human growth hormone may be considered only for an individual
    with documented growth hormone deficiency. The available WHS evidence is a
    single long-term case and does not support routine use for syndrome-related
    growth failure alone.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Postnatal growth retardation
    term:
      id: HP:0008897
      label: Postnatal growth retardation
  evidence:
  - reference: PMID:41017003
    reference_title: "Wolf-Hirschhorn syndrome with growth hormone deficiency: long-term response to RhGH therapy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Across 11 years of rhGH, height improved from ~ - 4.2 to ~ - 1.3 SDS with normalized height velocity and a prolonged but uneventful pubertal course. No major adverse effects were observed. Muscle tone improvement was also noted with treatment initiation."
    explanation: >-
      Single-case evidence supports a possible response in the specific context
      of confirmed growth hormone deficiency, not a general WHS indication.
- name: Benzodiazepines for Status Epilepticus

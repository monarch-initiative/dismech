name: Wolf-Hirschhorn_Syndrome
creation_date: '2026-01-07T21:37:01Z'
description: >
  Wolf-Hirschhorn syndrome (WHS) is a contiguous-gene disorder caused by a
  heterozygous deletion of distal chromosome 4p, usually including 4p16.3 and
  the Wolf-Hirschhorn syndrome critical regions. Core manifestations include a
  characteristic craniofacial gestalt, prenatal- and postnatal-onset growth
  deficiency, developmental delay or intellectual disability, hypotonia, and
  epilepsy. Deletion size and gene content modify the phenotype. NSD2/WHSC1,
  LETM1, and a distal seizure-susceptibility interval containing PIGG are among
  the best-studied contributors, but no single deleted gene reproduces the full
  syndrome; the evidence supports a multigene dosage model.

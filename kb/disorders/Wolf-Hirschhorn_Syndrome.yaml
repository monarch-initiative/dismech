- name: Genetic Counseling
  description: >
    Genetic counseling incorporates the proband's deletion mechanism and
    parental chromosome findings. A confirmed parental balanced rearrangement
    changes recurrence risk and enables targeted prenatal testing.
  action_category: COUNSELING_INFORMATIONAL

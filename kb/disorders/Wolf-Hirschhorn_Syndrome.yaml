inheritance:
- name: Predominantly sporadic 4p deletion
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    WHS is usually sporadic. About 50%-60% of affected individuals have a de
    novo pure 4p deletion, while about 40%-45% have an unbalanced translocation
    that may be de novo or inherited from a parent carrying a balanced
    rearrangement in the historical GeneReviews summary; cohort proportions
    vary with ascertainment. Ring chromosome 4 and other complex rearrangements
    account for the remainder.
  evidence:
  - reference: PMID:20301362
    reference_title: "Wolf-Hirschhorn Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About 50%-60% of individuals with WHS have a de novo pure deletion of
      4p16 and about 40%-45% have an unbalanced translocation with both a
      deletion of 4p and a partial trisomy of a different chromosome arm.
    explanation: >-
      The retired GeneReviews chapter supplies the historical distribution of
      pure deletions and unbalanced translocations; newer cohort evidence is
      used elsewhere in this entry to cross-check the chromosomal mechanisms.
  - reference: PMID:18932224
    reference_title: "Update on the clinical features and natural history of Wolf-Hirschhorn (4p-) syndrome: experience with 87 patients and recommendations for routine health supervision."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixty-five of 87 patients had an apparent pure, de novo, terminal deletion
    explanation: >-
      Demonstrates a higher pure-deletion proportion in one later cohort and
      therefore cautions against treating the historical percentages as fixed.
- name: Rearrangement-dependent recurrence risk
  description: >-
    Recurrence risk cannot be assigned from the WHS diagnosis alone. It is low
    after a confirmed de novo deletion but can be substantially higher when an
    unbalanced 4p deletion is inherited from a parent with a balanced
    rearrangement. Parental chromosome studies therefore determine counseling
    and prenatal-testing options.
  evidence:
  - reference: PMID:20301362
    reference_title: "Wolf-Hirschhorn Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These unbalanced translocations may be de novo or inherited from a parent
      with a balanced rearrangement.
    explanation: >-
      Documents the inherited balanced-rearrangement mechanism that changes
      recurrence risk.
  - reference: PMID:20301362
    reference_title: "Wolf-Hirschhorn Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Risks to family members depend on the mechanism of origin of the deletion.
    explanation: >-
      Directly supports mechanism-specific rather than universal recurrence
      counseling.

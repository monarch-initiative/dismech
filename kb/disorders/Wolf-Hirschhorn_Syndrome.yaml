genetic:
- name: Chromosome 4p16.3 Deletion
  association: Causal
  notes: >
    The defining lesion is a heterozygous distal 4p deletion. It may be a de
    novo pure deletion, the deleted component of an unbalanced translocation,
    or part of a ring or other complex rearrangement. Deletion size and gene
    content modify phenotype and mortality.
  evidence:
  - reference: PMID:32914558
    reference_title: "Wolf-Hirschhorn syndrome: A case series from India."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Less than half of the patients can be identified by conventional cytogenetics and molecular cytogenetic testing should be offered for diagnosis. Karyotyping of the parents should always be offered in a child with WHS."
    explanation: This provides important diagnostic guidance regarding the need for molecular cytogenetic testing and parental karyotyping.
  - reference: PMID:11584045
    reference_title: "An epidemiological study of Wolf-Hirschhorn syndrome: life expectancy and cause of mortality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cases with large de novo deletions (proximal to and including p15.2) were more likely to have died than those with smaller deletions (odds ratio=5.7, 95% CI=1.7-19.9) after adjusting for age."
    explanation: Larger 4p deletions carry a 5.7-fold increased mortality, consistent with the contiguous-gene-deletion model where more haploinsufficient genes drive worse outcomes.
  - reference: PMID:41303083
    reference_title: "Epilepsy in Wolf-Hirschhorn Syndrome: Clinical Insights from a Pediatric Cohort and a Review of the Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with more severe epilepsy tended to have larger deletions (>9 Mb) and poorer developmental outcomes.
    explanation: >-
      Records a cohort-level association between deletions above 9 Mb, epilepsy
      severity, and developmental outcome without treating the threshold as
      deterministically predictive for an individual.
  - reference: PMID:20301362
    reference_title: "Wolf-Hirschhorn Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WHS is caused by deletion of the WHSCR of chromosome 4p16.3 by one of several genetic mechanisms.
    explanation: Establishes the defining deletion and its mechanistic heterogeneity.
- name: NSD2 (WHSC1) Haploinsufficiency
  association: Contributory
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: NSD2
    term:
      id: hgnc:12766
      label: NSD2
  notes: >
    NSD2/WHSC1 is the H3K36 dimethyltransferase whose hemizygous loss is
    included in essentially all classic WHS deletions. Model-organism data
    support an epigenetic contribution to craniofacial, growth, cardiac, and
    cochlear phenotypes, but NSD2 loss alone has not been shown to cause the
    full contiguous-deletion syndrome.
  evidence:
  - reference: PMID:25942451
    reference_title: "The NSD family of protein methyltransferases in human cancer."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "NSD2 haploinsufficiency causes Wolf-Hirschhorn syndrome"
    explanation: >-
      Cancer-biology review shorthand linking NSD2 haploinsufficiency to WHS;
      the evidence supports this contributory genetic entry but not single-gene
      sufficiency for the full syndrome.
- name: LETM1 Haploinsufficiency
  association: Contributory
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: LETM1
    term:
      id: hgnc:6556
      label: LETM1
  notes: >
    LETM1, encoding the inner-mitochondrial-membrane K+/H+ and Ca2+/H+
    exchanger, lies in WHSCR-2 and is deleted in most WHS patients. It
    has long been considered the major candidate gene for WHS-associated
    seizures, but human deletion mapping indicates that LETM1
    haploinsufficiency is neither necessary nor sufficient.
  evidence:
  - reference: PMID:24738919
    reference_title: "Unusual 4p16.3 deletions suggest an additional chromosome region for the Wolf-Hirschhorn syndrome-associated seizures disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LETM1, encoding a mitochondrial protein playing a role in K(+) /H(+) exchange and in Ca(2+) homeostasis, is currently considered the major candidate gene."
    explanation: Establishes LETM1 as the historical major candidate seizure gene.
- name: PIGG Haploinsufficiency
  association: Candidate contributor
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: PIGG
    term:
      id: hgnc:25985
      label: PIGG
  notes: >
    PIGG lies within the refined 197 kb terminal 4p seizure-susceptibility
    region. Its haploinsufficiency, alongside CPLX1 and CTBP1, is
    nominated as a contributor to WHS-associated epilepsy by interval mapping
    and network analyses; those data do not isolate PIGG from neighboring
    deleted genes.
  evidence:
  - reference: PMID:26747863
    reference_title: "Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify a small terminal region of chromosome 4p that represents a seizure susceptibility region. Deletion of this region in the context of WHS is sufficient for seizure occurrence."
    explanation: >-
      Supports the candidate interval containing PIGG but does not isolate PIGG
      from ZNF721 or other co-deleted genes.
- name: CPLX1 Haploinsufficiency
  association: Candidate contributor
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: CPLX1
    term:
      id: hgnc:2309
      label: CPLX1
  notes: >
    CPLX1 encodes Complexin-1, a SNARE-binding regulator of synaptic
    vesicle exocytosis. Computational network analysis nominates its
    haploinsufficiency, together with LETM1, PIGG, and CTBP1, as a candidate
    contributor to the seizure phenotype.
  evidence:
  - reference: PMID:35278209
    reference_title: "Distinct Epileptogenic Mechanisms Associated with Seizures in Wolf-Hirschhorn Syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The proximity among the previous reported haploinsufficient candidate genes (PIGG, CPLX1, CTBP1, LETM1) and disease genes associated with epilepsy suggests not just one, but different impaired mechanisms in cellular networks responsible for the balance of neuronal activity in WHS patients, from which neuron communication is the most impaired in WHS-related seizures."
    explanation: Network analysis groups CPLX1 with PIGG/CTBP1/LETM1 as a synergistic seizure-susceptibility module.
- name: CTBP1 Haploinsufficiency
  association: Candidate contributor
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: CTBP1
    term:
      id: hgnc:2494
      label: CTBP1
  notes: >
    CTBP1 (C-terminal-binding protein 1) is a transcriptional corepressor
    expressed in brain. Its haploinsufficiency in WHS is implicated in
    seizure susceptibility and may be a pharmacologic target for future
    seizure therapy.
  evidence:
  - reference: PMID:35278209
    reference_title: "Distinct Epileptogenic Mechanisms Associated with Seizures in Wolf-Hirschhorn Syndrome."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "CTBP1 obtained the largest number of drug associations, reinforcing its importance for adaptations of brain circuits and its putative use as a pharmacological target for treating seizures/epilepsy in patients with WHS."
    explanation: Identifies CTBP1 as a candidate drug-targetable haploinsufficient gene in WHS.
- name: FGFR3 Haploinsufficiency
  association: Candidate contributor
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: FGFR3
    term:
      id: hgnc:3690
      label: FGFR3
  notes: >
    FGFR3 lies near the WHS critical regions and is co-deleted in many cases.
    Chick-embryo neural-crest biology makes reduced FGFR3 signaling a candidate
    developmental contributor, but the cited evidence does not establish a
    specific human WHS skeletal or cochlear effect.
  evidence:
  - reference: PMID:27777068
    reference_title: "Exploring the developmental mechanisms underlying Wolf-Hirschhorn Syndrome: Evidence for defects in neural crest cell migration."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "FGFRs 1 and 3 have recently been implicated in the chemotactic response of cardiac neural crest cells to FGF8 in the pharyngeal ecto-and endoderm in chick embryos, operating upstream of the MAPK/ERK pathway"
    explanation: FGFR3 haploinsufficiency may compromise cardiac neural-crest chemotaxis upstream of MAPK/ERK.
- name: MSX1 Haploinsufficiency
  association: Candidate contributor
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: MSX1
    term:
      id: hgnc:7391
      label: MSX1
  notes: >
    MSX1 is a homeobox transcription factor implicated in non-syndromic tooth
    agenesis. When co-deleted in larger 4p deletions it is a plausible dental
    contributor, but this assignment is extrapolated rather than directly
    demonstrated in WHS.
  evidence:
  - reference: PMID:29628999
    reference_title: "A review on non-syndromic tooth agenesis associated with PAX9 mutations."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Mutation of candidate genes PAX9 and MSX1 have been identified as the main causes of hypodontia and oligodontia"
    explanation: Identifies MSX1 as a primary tooth-agenesis disease gene; mechanistic role in WHS dental phenotypes is extrapolated from this non-syndromic literature.
diagnosis:
- name: Chromosomal microarray confirmation and deletion definition
  description: >-
    Chromosomal microarray is used to establish the distal 4p deletion, define
    its breakpoints and gene content, and detect additional copy-number changes
    from an unbalanced translocation. A heterozygous deletion including the
    WHS critical region establishes the molecular diagnosis in the appropriate
    clinical setting.
  diagnosis_term:
    preferred_term: chromosomal microarray analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  results: Heterozygous distal 4p16.3 deletion including the WHS critical region.
  evidence:
  - reference: PMID:20301362
    reference_title: "Wolf-Hirschhorn Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of WHS is established by the finding of a heterozygous deletion of the Wolf-Hirschhorn syndrome critical region (WHSCR) on chromosome 4p16.3 by chromosomal microarray (CMA), conventional G-banded cytogenetic analysis, or fluorescence in situ hybridization (FISH).
    explanation: Defines the diagnostic lesion and accepted cytogenetic methods.
  - reference: PMID:18932224
    reference_title: "Update on the clinical features and natural history of Wolf-Hirschhorn (4p-) syndrome: experience with 87 patients and recommendations for routine health supervision."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Array-CGH analysis at 1 Mb resolution was performed in 34/87 patients, and, in 15/34 (44%), showed an unbalanced translocation leading to both a 4p monosomy and a partial trisomy for another chromosome arm.
    explanation: Shows why genome-wide copy-number definition matters beyond a targeted deletion call.
- name: Karyotype and targeted FISH assessment
  description: >-
    Conventional karyotyping can identify larger 4p deletions, rings, and
    translocations, while targeted FISH can confirm a suspected deletion not
    visible by routine chromosome analysis. Once WHS is diagnosed, parental
    karyotyping is important to determine whether a balanced rearrangement
    changes recurrence risk.
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  results: Defines visible structural rearrangements and parental balanced-rearrangement status.
  evidence:
  - reference: PMID:18932224
    reference_title: "Update on the clinical features and natural history of Wolf-Hirschhorn (4p-) syndrome: experience with 87 patients and recommendations for routine health supervision."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deletion was detected by standard cytogenetics in 44/87 (50.5%) patients, whereas FISH was necessary in the other 43 (49.5%).
    explanation: Documents complementary diagnostic yield of standard cytogenetics and targeted FISH in the cohort.
  - reference: PMID:32914558
    reference_title: "Wolf-Hirschhorn syndrome: A case series from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Karyotyping of the parents should always be offered in a child with WHS.
    explanation: Supports parental chromosome analysis for recurrence-risk assessment.
differential_diagnoses:
- name: Cri-du-chat syndrome
  disease_term:
    preferred_term: Cri-du-chat syndrome
    term:
      id: MONDO:0007404
      label: cri du chat syndrome
  description: >-
    Cri-du-chat syndrome is another terminal autosomal deletion disorder with
    prenatal or postnatal growth impairment, microcephaly, craniofacial
    dysmorphism, developmental delay, and possible cardiac, neurologic, and
    renal malformations. Cytogenetic testing distinguishes its 5p deletion from
    the distal 4p deletion of WHS.
  distinguishing_features:
  - A high-pitched monochromatic cat-like cry and a chromosome 5p deletion favor Cri-du-chat syndrome.
  - A Greek-warrior-helmet facial gestalt with a distal 4p16.3 deletion favors Wolf-Hirschhorn syndrome.
  evidence:
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Cri du Chat syndrome (CdCS) is a genetic disease resulting from a deletion of variable size occurring on the short arm of chromosome 5 (5p-).
    explanation: Establishes the alternative chromosomal lesion.
  - reference: PMID:16953888
    reference_title: Cri du Chat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main clinical features are a high-pitched monochromatic cry, microcephaly, broad nasal bridge, epicanthal folds, micrognathia, abnormal dermatoglyphics, and severe psychomotor and mental retardation.
    explanation: Documents the overlapping phenotype and the characteristic cry that helps distinguish Cri-du-chat syndrome.
- name: Dravet syndrome
  disease_term:
    preferred_term: Dravet syndrome
    term:
      id: MONDO:0100135
      label: Dravet syndrome
  description: >-
    WHS epilepsy can resemble Dravet syndrome through infantile onset,
    fever-associated prolonged clonic or tonic-clonic seizures, atypical
    absences, and later developmental impairment. Children with subtle WHS
    dysmorphism may initially undergo SCN1A testing. Chromosomal microarray
    showing distal 4p deletion favors WHS, whereas a pathogenic SCN1A variant
    without the WHS deletion supports Dravet syndrome.
  distinguishing_features:
  - The characteristic WHS facial gestalt, congenital anomalies, and distal 4p deletion favor Wolf-Hirschhorn syndrome.
  - A pathogenic SCN1A variant in the appropriate electroclinical setting favors Dravet syndrome.
  evidence:
  - reference: PMID:26747863
    reference_title: "Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with WHS display a distinctive electroclinical pattern resembling the severe myoclonic epilepsy of infancy or Dravet syndrome.
    explanation: Directly establishes the electroclinical overlap.
  - reference: PMID:26747863
    reference_title: "Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      some patients with a milder presentation of WHS-related dysmorphologies are sometimes first suspected of having Dravet syndrome
    explanation: Documents the real-world diagnostic confusion in mildly dysmorphic WHS.

- name: Multisystem Surveillance
  description: >-
    Longitudinal follow-up should monitor developmental therapies and known
    complications. The archival GeneReviews summary specifies annual complete
    blood count and renal-function testing and consideration of routine liver
    ultrasonography, with standard specialty care for skeletal, ophthalmologic,
    cardiac, hearing, sleep, and hepatic manifestations. Because the chapter is
    retired, schedules should be individualized with current specialist input.
  action_category: MONITORING
  treatment_term:

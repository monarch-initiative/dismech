diagnosis:
- name: FARS2 molecular genetic testing including copy-number analysis
  description: >-
    Diagnosis rests on identifying biallelic pathogenic FARS2 variants. Because
    intragenic deletions are common in SPG77 and can make a missense allele look
    homozygous, copy-number analysis and parental segregation testing are needed
    alongside sequencing.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:30869852
    reference_title: "FARS2 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of FARS2 deficiency is established in a proband with suggestive findings and biallelic pathogenic variants in FARS2 identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:39342436
    reference_title: "A pseudo-homozygous missense variant and Alu-mediated exon 5 deletion in FARS2 causing spastic paraplegia 77."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, our initial WES analysis suggested the patients were homozygous for the missense mutation, but later found by co-segregation analysis to be pseudo-homozygous. It illustrates the need familial co-segregation analysis to verify homozygous mutations."
    explanation: A deletion in trans was missed by exome sequencing until segregation analysis.
differential_diagnoses:
- name: Combined oxidative phosphorylation defect type 14
  disease_term:
    preferred_term: combined oxidative phosphorylation deficiency 14 (COXPD14)
    term:
      id: MONDO:0013986
      label: combined oxidative phosphorylation defect type 14
  description: >-
    The allelic infantile-onset FARS2 phenotype: early epileptic encephalopathy
    with refractory seizures, lactic acidosis and often death in early childhood,
    with Alpers-like neuropathology. It is kept as a separate entry because MONDO
    and OMIM treat it as a distinct disease, and it is in the curation queue as
    stubs/Combined_Oxidative_Phosphorylation_Defect_Type_14.yaml. Intermediate
    patients exist (early seizures that resolve, followed by spastic paraplegia).
  distinguishing_features:
  - Onset in infancy with intractable seizures rather than childhood-onset gait disorder
  - Lactic acidosis and early lethality
  - Associated FARS2 alleles (for example p.Gly309Ser and p.Asp325Tyr) impair enzyme stability more severely
  evidence:
  - reference: PMID:30869852
    reference_title: "FARS2 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The spectrum of FARS2 deficiency ranges from the infantile-onset phenotype, characterized by epileptic encephalopathy with lactic acidosis and poor prognosis (70% of affected individuals)"
    explanation: GeneReviews description of the allelic infantile-onset phenotype.
  - reference: PMID:22833457
    reference_title: "Mitochondrial phenylalanyl-tRNA synthetase mutations underlie fatal infantile Alpers encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features, including postnatal onset, catastrophic epilepsy, lactic acidemia, early lethality and neuroimaging findings of the patients with FARS2 variants, resembled each other closely, and neuropathology was consistent with Alpers syndrome."
    explanation: The founding description of the infantile epileptic FARS2 phenotype.
- name: Hereditary spastic paraplegia 7
  description: >-
    Another autosomal recessive HSP caused by a nuclear gene for a mitochondrial
    protein (paraplegin, SPG7); usually adult onset with cerebellar ataxia and
    optic atrophy. Distinguished by gene.
  distinguishing_features:
  - Adult onset, spastic ataxia
  - Causal gene SPG7
animal_models:
- name: Conditional Fars2 knockout mouse and Fars2-knockdown primary neurons
  species: Mouse
  genotype: Fars2 conditional knockout; Fars2 knockdown in primary cultured neurons
  publication: PMID:35794642
  description: >-
    Global Fars2 knockout is lethal in early gestation, before neurogenesis. A
    conditional knockout survives to late gestation with a thinner cortex and
    enlarged ventricles; Fars2 knockdown in primary neurons impairs mitochondrial
    function, delays neurite outgrowth and increases apoptosis.
  modeled_mechanisms:
  - target: Impaired Neurite Outgrowth
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Knockdown neurons reproduce delayed neurite outgrowth downstream of Fars2 loss.
    limitations: >-
      Knockdown is closer to complete loss of function than the hypomorphic SPG77
      alleles, and cultured embryonic neurons say nothing about maintenance of an
      adult corticospinal axon.
    evidence:
    - reference: PMID:35794642
      reference_title: "Neuropathy-associated Fars2 deficiency affects neuronal development and potentiates neuronal apoptosis by impairing mitochondrial function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro Fars2-knockdown mouse neurons showed delayed and disrupt neurite outgrowth."
      explanation: The neurite phenotype this model contributes.
  - target: Neuronal Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Conditional knockout embryos show neural cell apoptosis and a thinner cortex.
    limitations: >-
      The conditional knockout is embryonic-lethal and closer to complete loss of
      function than the hypomorphic SPG77 alleles, so no postnatal or
      corticospinal tract phenotype can be observed.
    evidence:
    - reference: PMID:35794642
      reference_title: "Neuropathy-associated Fars2 deficiency affects neuronal development and potentiates neuronal apoptosis by impairing mitochondrial function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, conditional Fars2-deletion in mouse embryos at embryonic day (E) 11 causes significant neural cell apoptosis and a lethal phenotype at late-gestation."
      explanation: The apoptosis phenotype this model contributes.
- name: fars2 knockdown zebrafish
  species: Zebrafish
  genotype: fars2 knockdown
  publication: PMID:35794642
  description: Knockdown of fars2 impairs motor axon growth and locomotion.
  modeled_mechanisms:
  - target: Corticospinal Tract Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Motor axon growth failure and reduced locomotion, taken by the authors as a model of spastic paraplegia.
    limitations: >-
      Zebrafish larval motor axons are spinal motor neurons, not corticospinal
      upper motor neurons, and the measured defect is in axon growth rather than
      maintenance, so this is an upward extrapolation to a tract-level human sign.
    evidence:
    - reference: PMID:35794642
      reference_title: "Neuropathy-associated Fars2 deficiency affects neuronal development and potentiates neuronal apoptosis by impairing mitochondrial function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The further generated fars2-knockdown zebrafish models showed impaired motor axon growth and reduced locomotor capacity, features believed to be consistent with the manifestation of HSP patients."
      explanation: The motor phenotype of the zebrafish model.

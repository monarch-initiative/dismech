      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry biallelic FARS2 variants, either homozygous (the
    original consanguineous family) or compound heterozygous. A recurring genotype
    is a missense variant in trans with an intragenic deletion, which can make the
    missense variant appear homozygous on exome sequencing (pseudo-homozygosity).
  evidence:
  - reference: PMID:26553276
    reference_title: "A Newly Identified Missense Mutation in FARS2 Causes Autosomal-Recessive Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a missense homozygous mutation c.424G>T (p.D142Y) in the FARS2 gene, which encodes a mitochondrial phenylalanyl tRNA synthetase (mtPheRS), causes HSP in a Chinese consanguineous family"
    explanation: Homozygous causal variant in a consanguineous family, the founding SPG77 report.
  - reference: PMID:30869852
    reference_title: "FARS2 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FARS2 deficiency is inherited in an autosomal recessive manner."
    explanation: GeneReviews statement of the mode of inheritance for the FARS2 deficiency spectrum.
  - reference: PMID:30869852
    reference_title: "FARS2 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: GeneReviews recurrence risks, which are those of autosomal recessive inheritance.
  - reference: PMID:39342436
    reference_title: "A pseudo-homozygous missense variant and Alu-mediated exon 5 deletion in FARS2 causing spastic paraplegia 77."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we reported two affected siblings in an autosomal recessive spastic paraplegia family with a pseudo-homozygous missense variant and Alu-mediated exon 5 deletion in FARS2"
    explanation: Compound heterozygosity for a missense variant and a deletion, presenting as pseudo-homozygosity.
genetic:
- name: FARS2
  gene_term:
    preferred_term: FARS2
    term:
      id: hgnc:21062

  notes: >-
    Fourteen SPG77 cases had been reported before the two siblings described in
    PMID:39342436 (2024). The GeneReviews chapter (PMID:30869852) counts 37
    individuals from 25 families with FARS2 deficiency of any phenotype, of whom
    about 30% have the later-onset spastic paraplegia phenotype.

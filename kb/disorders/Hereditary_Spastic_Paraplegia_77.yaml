  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Reported SPG77 genotypes include homozygous p.Asp142Tyr; compound
    heterozygous p.Pro136His with p.Gln216*; p.Pro361Leu with a deletion of exons
    1-2 or of exons 2-4; p.Gly141Glu with an exon 6 deletion; p.Arg419Cys with
    an interstitial 6p25.1 deletion including exon 6 (a sibling pair classified
    as complicated SPG77 in later literature reviews, although the original
    report describes developmental delay, dysarthria and tremor without naming
    spastic paraplegia); and a missense variant at codon 338 with an Alu-mediated
    exon 5 deletion. Across the FARS2
    spectrum nearly all non-deletion alleles are missense, and deletions are always
    in trans with a missense allele. p.Pro361Leu occurs in both pure and
    complicated presentations.
  evidence:
  - reference: PMID:26553276
    reference_title: "A Newly Identified Missense Mutation in FARS2 Causes Autosomal-Recessive Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a missense homozygous mutation c.424G>T (p.D142Y) in the FARS2 gene, which encodes a mitochondrial phenylalanyl tRNA synthetase (mtPheRS), causes HSP in a Chinese consanguineous family"
    explanation: Establishes FARS2 as the causal gene for autosomal recessive spastic paraplegia.
  - reference: PMID:30250868
    reference_title: "FARS2 mutations presenting with pure spastic paraplegia and lesions of the dentate nuclei."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a paternal nonsense variant (Q216X) lacking the catalytic core and anticodon-binding regions, and a maternal missense variant (P136H) possessing partial enzymatic activity."
    explanation: Independent SPG77 patient with compound heterozygous FARS2 variants, one null and one partially active.
  - reference: PMID:32007496
    reference_title: "Two types of recessive hereditary spastic paraplegia in Roma patients in compound heterozygous state; no ethnically prevalent variant found."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients are compound heterozygotes for two different variants in the SPG11 (c.1603-1G>A and del ex. 16-18) and FARS2 (c.1082C>T and del ex.1-2) genes respectively"
    explanation: A Czech Roma SPG77 patient, identified by HSP gene-panel sequencing, compound heterozygous for p.Pro361Leu and a deletion.
  - reference: PMID:37152989
    reference_title: "Case report: A novel FARS2 deletion and a missense variant in a child with complicated, rapidly progressive spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe an 8-year-old patient with severe and complicated spastic paraplegia, carrying a missense variant (p.Pro361Leu) and a novel intragenic deletion in FARS2"
    explanation: A further compound heterozygous missense-plus-deletion genotype, in a complicated presentation.
  - reference: PMID:25851414
    reference_title: "Mutations in FARS2 and non-fatal mitochondrial dysfunction in two siblings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They have a heterozygous missense mutation, c.1255C>T which predicts p.Arg419Cys in exon 7 of FARS2, inherited from their father and uncovered on exome sequencing, and an interstitial deletion of chromosome 6p25.1 inherited from their mother and uncovered on SNP array."
    explanation: >-
      Missense-plus-deletion genotype in a sibling pair with a milder FARS2
      phenotype, later tabulated as complicated SPG77 (PMID:37152989).
  - reference: PMID:30177229
    reference_title: "FARS2 deficiency; new cases, review of clinical, biochemical, and molecular spectra, and variants interpretation based on structural, functional, and evolutionary significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All large deletions and the single splice-site variant are in trans with a missense variant. This suggests that complete loss of function may be incompatible with life."
    explanation: >-
      Review of the FARS2 variant spectrum across phenotypes; supports treating
      pathogenic FARS2 alleles as hypomorphic rather than null in combination.
pathophysiology:
- name: FARS2 Partial Loss of Function
  conforms_to: "corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect"
  biological_scale: MOLECULAR
  description: >-
    Biallelic hypomorphic FARS2 variants reduce the catalytic activity of mtPheRS.
    p.Asp142Tyr disrupts both steps of the aminoacylation reaction (phenylalanine
    activation and transfer to tRNA(Phe)), and p.Pro136His retains partial
    activity. Compared with the variants that cause the infantile epileptic
    phenotype, the spastic paraplegia variants retain some protein stability and
    refolding capacity, which is the best available molecular correlate of the
    milder phenotype. This node substitutes a mitochondrial translation lesion into
    the mitochondrial-function category of the corticospinal axonopathy trigger.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION

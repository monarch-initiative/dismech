    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She developed severe lower extremity spasticity and required femoral derotational osteotomies as well as Achilles tenotomies for management of spasticity."
    explanation: Orthopedic procedures used for spasticity in a patient with the spastic paraplegia phenotype.
- name: Oral L-phenylalanine supplementation
  description: >-
    Experimental cognate amino acid supplementation, intended to raise
    substrate availability for a hypomorphic mtPheRS. Reported in a single N-of-1
    trial in a 3-year-old girl with FARS2 deficiency, who improved in gross motor
    skills and postural stability, lost new skills during a withdrawal period and
    regained them on restarting. The abstract does not state which FARS2
    phenotype the child had.
  therapeutic_modality: SMALL_MOLECULE

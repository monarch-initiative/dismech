treatments:
- name: Multidisciplinary supportive care
  description: >-
    Symptomatic management by neurology, rehabilitation, orthopedics and speech
    therapy, with surveillance for mobility, contractures, scoliosis, foot
    deformity and seizures. GeneReviews notes that valproic acid, a concern in
    mitochondrial disease, has been given to some FARS2 patients without liver
    dysfunction, but makes no general recommendation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:30869852
    reference_title: "FARS2 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For those with later onset: routine monitoring of OT/PT needs (e.g., mobility and activities of daily living), orthopedic complications (contractures, scoliosis, foot deformities), seizure control, speech and language development, and educational and social needs."
    explanation: GeneReviews surveillance recommendations for the later-onset phenotype.
  - reference: PMID:30869852
    reference_title: "FARS2 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While valproic acid can induce liver failure in persons with mitochondrial diseases, some individuals with FARS2 deficiency received valproic acid with no evidence of liver dysfunction or worsening of existing liver disease. Given the limited number of affected individuals reported to date, no general recommendation can be made."
    explanation: GeneReviews agents-to-avoid statement on valproic acid.
- name: Physical and occupational therapy
  description: Physiotherapy and occupational therapy to maintain mobility and prevent contractures.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy

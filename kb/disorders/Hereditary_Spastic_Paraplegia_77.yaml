name: Hereditary Spastic Paraplegia 77
creation_date: "2026-09-28T12:49:43Z"
category: Mendelian
synonyms:
- SPG77
- hereditary spastic paraplegia type 77
- spastic paraplegia 77, autosomal recessive
- autosomal recessive spastic paraplegia type 77
- FARS2-related hereditary spastic paraplegia
- later-onset FARS2 deficiency
description: >-
  Hereditary spastic paraplegia 77 (SPG77) is an autosomal recessive spastic
  paraplegia caused by biallelic variants in FARS2, the nuclear gene encoding the
  mitochondrial phenylalanyl-tRNA synthetase (mtPheRS), which charges the single
  mitochondrially encoded tRNA(Phe) with phenylalanine for intramitochondrial
  translation of the thirteen mtDNA-encoded oxidative phosphorylation subunits.

  SPG77 is the later-onset, milder pole of the FARS2 deficiency spectrum. The
  opposite pole is combined oxidative phosphorylation deficiency 14 (COXPD14), an
  infantile-onset epileptic mitochondrial encephalopathy with lactic acidosis and
  Alpers-like neuropathology that accounts for about 70% of reported FARS2
  patients. SPG77 was defined in a consanguineous Chinese family homozygous for
  p.Asp142Tyr, and fewer than twenty further patients have been reported. Onset is
  usually in early childhood (18 months to 7 years) with toe-walking or
  difficulty walking, progressing to lower-limb spasticity, pyramidal weakness,
  brisk reflexes, ankle clonus and extensor plantar responses. Several reported
  patients have a pure phenotype with normal cognition and normal brain MRI; others
  are complicated by developmental delay or mild intellectual disability,
  dysarthria or dysphonia, tremor, upper-limb involvement, kyphoscoliosis, early
  seizures that resolve, and MRI changes such as diffuse atrophy or T2 lesions of
  the dentate nuclei or brainstem tegmentum.

  The mechanism is partial loss of mtPheRS function. SPG77 alleles reduce
  aminoacylation activity but retain some protein stability and refolding
  capacity, whereas alleles that cause the infantile epileptic phenotype impair
  stability more severely, and complete loss of FARS2 function appears
  incompatible with life. Reduced tRNA(Phe) charging impairs mitochondrial
  translation and OXPHOS complex biogenesis; in Fars2-deficient mouse neurons this
  lowers ATP and membrane potential, delays neurite outgrowth and potentiates
  apoptosis, and fars2 knockdown zebrafish show impaired motor axon growth and
  reduced locomotion. How a systemic mitochondrial translation defect is expressed
  selectively as corticospinal tract dysfunction is not established; no
  neuropathology of an SPG77 patient has been reported. Management is symptomatic
  and supportive; oral L-phenylalanine supplementation has been reported in a
  single N-of-1 trial.

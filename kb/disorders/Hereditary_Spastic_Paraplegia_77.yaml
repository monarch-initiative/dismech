    reference_title: "Treatment of Mitochondrial Phenylalanyl-tRNa-Synthetase Deficiency (FARS2) with Oral Phenylalanine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The individual showed clear improvement in all areas tested, especially in gross motor skills, movement abilities, and postural stability. In the period without supplementation, she lost newly acquired motor skills but regained these upon restarting supplementation."
    explanation: N-of-1 trial with a withdrawal period in a single patient.
notes: >-
  Scope. This entry covers SPG77 (MONDO:0014882, OMIM 617046) only. GeneReviews
  (PMID:30869852, "FARS2 Deficiency") treats SPG77 and the infantile epileptic
  phenotype as one spectrum, but MONDO keeps them as separate diseases and
  combined oxidative phosphorylation defect type 14 (MONDO:0013986) has its own
  stub in the curation queue, so it is recorded here as an allelic differential
  rather than as a subtype. The sibling mitochondrial aminoacyl-tRNA synthetase
  entries in this knowledge base (e.g. Combined_Oxidative_Phosphorylation_Defect_Type_21)
  are likewise one entry per MONDO term.

  Module conformance. The trigger node conforms to the mitochondrial-function
  category of corticospinal_tract_axonopathy, and the tract node to its
  stretch-reflex node, because the bedside signs are upper motor neuron signs.
  The module's axonal-transport and length-dependent-degeneration nodes are not
  claimed: no SPG77 neuropathology exists, and the only transport link (Dctn3 in
  Fars2-deficient neurons) is a proposed downstream molecule. The
  mitochondrial_dysfunction module is an aging-hallmark module and is not used.

  GeneReviews. The FARS2 Deficiency chapter (PMID:30869852) is the phenotype
  baseline; its abstract lists spastic paraplegia with weakness, spasticity and
  exaggerated reflexes, developmental delay or intellectual disability and brief
  seizures for the later-onset phenotype, all captured above.

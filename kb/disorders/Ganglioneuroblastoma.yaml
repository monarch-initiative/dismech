mappings:
  mondo_mappings:
  - term:
      id: MONDO:0005035
      label: ganglioneuroblastoma
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      Primary MONDO identifier for this entry. MONDO defines the class by
      neuroblastic cells, ganglion cells and a Schwannian stroma making up more
      than half of the tumor volume, and records NCIT:C3790 and Orphanet:251877
      as exact matches. The Schwannian stroma criterion matches this entry's
      peripheral scope; the over-half threshold corresponds to the INPC
      intermixed category, and the INPC sets no such threshold for the nodular
      category, which this entry also covers.
  ncit_mappings:
  - term:
      id: NCIT:C3790
      label: Ganglioneuroblastoma
    mapping_predicate: skos:exactMatch
    mapping_source: NCIT
    mapping_justification: >-
      NCIT concept that MONDO records as an exact match of MONDO:0005035. NCIT
      also files Central Nervous System Ganglioneuroblastoma (NCIT:C92629)
      beneath it, which this entry does not cover. C3790 is used rather than the
      narrower Peripheral Ganglioneuroblastoma (NCIT:C6594) because NCIT files
      the intermixed and nodular classes (NCIT:C42057, NCIT:C42058) under C3790,
      while C6594 holds only the adrenal and mediastinal site classes.

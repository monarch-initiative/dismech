  evidence:
  - reference: PMID:22137163
    reference_title: "Characteristics and outcome of patients with ganglioneuroblastoma, nodular subtype: a report from the INRG project."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amongst 4071 patients in the INRG database with known INPC histological category, 232 patients with GNBn were identified. ... A cohort with superior outcome was identified: OS for GNBn patients younger than 18 months was 95%±5% (n=39) and for GNBn patients with stage 1, 2, 3, 4s was 95%±3% (n=125). Conversely, a poor outcome sub-group could also be identified: OS for stage 4 was 35%±7% (n=107)."
    explanation: >-
      This INRG database analysis of 232 patients with nodular
      ganglioneuroblastoma reports overall survival of 35% for stage 4 (n=107)
      and 95% for stages 1, 2, 3 and 4s (n=125); these cover all 232, so 46% had
      stage 4 disease. The abstract gives no stage table and never mentions
      metastasis, so the 46% and its reading as distant metastasis are
      inferences; the 46% excludes stage 4s, and no survival time point is
      stated. INRG pools cooperative-group data, so this cohort is not

    modifier: ABNORMAL
  evidence:
  - reference: PMID:22643837
    reference_title: "Functional characterization of the human α-cardiac actin mutations Y166C and M305L involved in hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both mutants stimulated the cardiac β-myosin ATPase to only 50 % of WT cardiac F-actin."
    explanation: >-
      Quantifies the impaired actin-myosin interaction: HCM ACTC1 mutants stimulate
      the cardiac beta-myosin ATPase to only half the wild-type level.
  - reference: PMID:22643837
    reference_title: "Functional characterization of the human α-cardiac actin mutations Y166C and M305L involved in hypertrophic cardiomyopathy."

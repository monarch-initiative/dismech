pathophysiology:
- name: ACTC1 Missense Variant in Alpha-Cardiac Actin
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The initiating lesion in CMH11 is a heterozygous missense variant in ACTC1,
    the gene encoding alpha-cardiac actin — the thin-filament protein that forms
    the track for myosin cross-bridge cycling and anchors the tropomyosin-troponin
    regulatory apparatus. The mutant actin is expressed and incorporated into the
    cardiomyocyte thin filament alongside wild-type actin, so disease arises from a
    functionally abnormal filament rather than from loss of protein.

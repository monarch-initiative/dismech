name: Hypertrophic Cardiomyopathy 11
creation_date: "2026-08-22T00:00:00Z"
synonyms:
- CMH11
- ACTC1 hypertrophic cardiomyopathy
- alpha-cardiac actin hypertrophic cardiomyopathy
- cardiomyopathy, familial hypertrophic, 11
- hypertrophic cardiomyopathy caused by mutation in ACTC1
description: >-
  Hypertrophic cardiomyopathy 11 (CMH11) is the ACTC1-related form of familial
  hypertrophic cardiomyopathy. ACTC1 encodes alpha-cardiac actin, the thin-filament
  track along which the myosin motor generates force; it is one of the eight genes
  with definitive ClinGen gene-disease validity for HCM, though it accounts for a
  small fraction of cases. Pathogenic ACTC1 alleles are missense variants that are
  incorporated into the cardiomyocyte thin filament, where they perturb the
  actin-myosin interaction and the calcium-dependent regulation of contraction
  rather than acting through loss of protein. As a thin-filament HCM gene, ACTC1
  disease tends toward the thin-filament clinical profile — milder and atypically
  distributed left ventricular hypertrophy with a greater burden of diastolic
  dysfunction and progression to heart failure — while sharing the sarcomeric
  disarray, fibrosis, and arrhythmic risk of HCM generally. Inheritance is autosomal
  dominant; ACTC1 is allelically pleiotropic, with other variants causing dilated
  cardiomyopathy, left ventricular noncompaction, and atrial septal defect.

notes: >-
  CMH11 is the ACTC1 (alpha-cardiac actin) member of the sarcomeric HCM series and
  one of the eight ClinGen-definitive HCM genes, added to complete the
  definitive-gene set. It is curated as a thin-filament HCM (with TNNC1/CMH13,
  TNNT2/CMH2, TNNI3/CMH7, TPM1/CMH3), sharing the milder-hypertrophy,
  greater-diastolic-dysfunction, comparable-arrhythmic-risk profile documented for
  the thin-filament class, and conforms to the shared
  cardiomyopathy_maladaptive_remodeling module. ACTC1 is allelically pleiotropic —
  other variants cause dilated cardiomyopathy (ClinGen Moderate), left ventricular
  noncompaction, and atrial septal defect — so this entry is scoped to the
  hypertrophic phenotype.

  GeneReviews scope. The GeneReviews resource applicable to this entry is the
  disease-level "Nonsyndromic Hypertrophic Cardiomyopathy Overview"
  (PMID:20301725), tagged accordingly in `references`. Its indexed PubMed record
  is content_type abstract_only and carries only the chapter's purpose
  statement, not the Clinical Characteristics, Management, or Genetic Counseling
  sections, so section-by-section GeneReviews mining is not possible from the
  cache and no snippet is quoted from it. The clinical-characteristics baseline
  for this entry is therefore built from the primary ACTC1 cohort and pedigree
  literature cited throughout, principally PMID:28912181, PMID:25524337.

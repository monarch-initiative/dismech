notes: |-
  CMH11 is the ACTC1 (alpha-cardiac actin) member of the sarcomeric HCM series and one of the eight ClinGen-definitive HCM genes, accounting for approximately 1% or fewer of all HCM cases (PMID:36158814). It is curated as a thin-filament HCM (with TNNC1/CMH13, TNNT2/CMH2, TNNI3/CMH7, TPM1/CMH3), sharing the milder-hypertrophy, greater-diastolic-dysfunction, comparable-arrhythmic-risk profile documented for the thin-filament class, and conforms to the shared cardiomyopathy_maladaptive_remodeling module. ACTC1 is allelically pleiotropic — other variants cause dilated cardiomyopathy (ClinGen Moderate), left ventricular noncompaction, and atrial septal defect — so this entry is scoped to the hypertrophic phenotype.
  GeneReviews scope. The GeneReviews resource applicable to this entry is the disease-level "Nonsyndromic Hypertrophic Cardiomyopathy Overview" (PMID:20301725), tagged accordingly in `references`. Its cached record (`references_cache/PMID_20301725.md`) is `content_type: abstract_only` and contains the six-point chapter purpose overview statement rather than the full Clinical Characteristics, Management, or Genetic Counseling chapter text, so section-by-section mining is drawn from the full-text review of thin-filament cardiomyopathies (PMID:36158814) and primary cohort and functional studies (PMID:22643837, PMID:25524337, PMID:28912181).

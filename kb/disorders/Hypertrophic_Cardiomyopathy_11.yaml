- name: Ventricular Hypertrophy, Myocyte Disarray and Fibrosis
  biological_scale: TISSUE
  role: central_effector
  conforms_to: cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling
  description: 'Sustained sarcomeric dysfunction produces the structural remodeling that defines HCM:
    cardiomyocyte hypertrophy, myofiber disarray, and interstitial fibrosis. In thin-filament disease,
    of which ACTC1 is a member, the hypertrophy tends to be milder and more atypically distributed than
    in thick-filament HCM, but the disarray-and-fibrosis substrate is shared.'

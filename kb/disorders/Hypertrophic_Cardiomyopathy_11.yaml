        involved in hypertrophic cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Copolymers of WT and increasing amounts of the mutant actins led to a reduced stimulation
        of the myosin ATPase.
      explanation: Incorporation of mutant ACTC1 subunits into hybrid thin filaments directly impairs
        stimulation of cardiac beta-myosin ATPase.
- name: Impaired Actin-Myosin Interaction and Thin-Filament Regulation
  biological_scale: MOLECULAR
  role: effector
  description: Incorporated mutant actin perturbs the mechanochemistry of the sarcomere. Functional studies
    of HCM ACTC1 mutants show reduced stimulation of the cardiac beta-myosin ATPase, altered actin polymerization
    behaviour in the presence of tropomyosin and other partners, and, in cardiomyocytes, shortening of
    sarcomere length — signatures of a filament that transmits and regulates force abnormally. As a thin-filament
    lesion, the net effect is dysregulation of calcium-dependent contraction rather than the myosin super-relaxed-state
    defect seen with thick-filament genes.

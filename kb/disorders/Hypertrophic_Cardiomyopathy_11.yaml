    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The histological features of HCM include myocyte hypertrophy and disarray, as well as interstitial
      fibrosis.
    explanation: Names the defining tissue-level triad — hypertrophy, disarray, and interstitial fibrosis
      — that this node represents.
  - reference: PMID:25524337
    reference_title: Clinical phenotype and outcome of hypertrophic cardiomyopathy associated with thin-filament
      gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Compared with thick-filament HCM, patients with thin-filament mutations showed: 1) milder
      and atypically distributed left ventricular (LV) hypertrophy (maximal wall thickness 18 ± 5 mm vs.
      24 ± 6 mm; p < 0.001) and less prevalent outflow tract obstruction (19% vs. 34%; p = 0.015)'
    explanation: Documents the milder, atypically distributed hypertrophy characteristic of thin-filament
      HCM (which includes ACTC1) relative to thick-filament disease.
  downstream:

        Diagnosis, and Therapy.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The hypertrophy is also frequently associated with left ventricular diastolic dysfunction.
      explanation: Connects ventricular hypertrophy and remodeling directly to impaired diastolic function.
  - target: Hypertrophic Cardiomyopathy

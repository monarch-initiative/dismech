    reference_title: Functional characterization of the human α-cardiac actin mutations Y166C and M305L
      involved in hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Thus our data demonstrate that a mutant actin can be integrated into cardiomyocyte thin filaments
      and by its reduced mode of myosin interaction might be the basis for the initiation of HCM.
    explanation: Demonstrates that mutant alpha-cardiac actin is incorporated into thin filaments and
      initiates HCM through a disturbed actin-myosin interaction.
  - reference: PMID:36158814
    reference_title: 'Thin filament cardiomyopathies: A review of genetics, disease mechanisms, and emerging

name: Choroiditis
creation_date: '2026-08-01T09:15:00Z'
description: >-
  Choroiditis is inflammation of the choroid, the high-flow vascular layer between
  the retina and the sclera that supplies the outer retina and retinal pigment
  epithelium (RPE). It is the principal anatomic substrate of posterior uveitis and
  a major cause of irreversible vision loss. Choroiditis is not a single disease but
  an umbrella over a heterogeneous set of entities that divide along one
  clinically decisive axis: infectious versus non-infectious aetiology. Infectious
  choroiditis includes ocular toxoplasmosis (the commonest infectious posterior
  uveitis worldwide), tubercular serpiginous-like choroiditis, syphilitic
  chorioretinitis, and presumed ocular histoplasmosis syndrome. Non-infectious
  choroiditis includes the white-dot syndromes (multifocal choroiditis with
  panuveitis, punctate inner choroidopathy, serpiginous choroiditis, birdshot
  chorioretinopathy) and granulomatous disease (sarcoidosis, sympathetic
  ophthalmia). The two arms converge on shared downstream mechanisms —
  choriocapillaris hypoperfusion, outer-retinal and RPE damage, chorioretinal
  scarring, and inflammatory choroidal neovascularization — but they demand
  opposed management: corticosteroids and immunosuppression are the mainstay of
  non-infectious disease and are actively harmful when given without antimicrobial
  cover in unrecognised infectious disease.
category: Immune
disease_term:
  preferred_term: choroiditis
  term:
    id: MONDO:0001280
    label: choroiditis
parents:
- Posterior uveitis
- Uveitis
- Eye disorder
synonyms:
- Choroiditides
- Chorioretinitis

has_subtypes:
- name: Ocular Toxoplasmosis
  display_name: Ocular toxoplasmosis (Toxoplasma retinochoroiditis)
  classification: etiologic_infectious
  subtype_term:
    preferred_term: ocular toxoplasmosis
    term:
      id: MONDO:0005879
      label: ocular toxoplasmosis
  description: >-
    Necrotising retinochoroiditis caused by Toxoplasma gondii, the leading
    infectious cause of posterior uveitis worldwide. Classically presents as a
    focal white retinal lesion with overlying vitritis, frequently recurring at
    the border of a pre-existing pigmented chorioretinal scar as tissue cysts
    reactivate. Requires antiparasitic therapy; corticosteroid must never be
    given without antiparasitic cover.
  evidence:
  - reference: PMID:36095008
    reference_title: Ocular Toxoplasmosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular toxoplasmosis is the leading cause of posterior uveitis worldwide"
    explanation: Establishes ocular toxoplasmosis as the dominant infectious subtype of posterior uveitis/choroiditis.

- name: Tubercular Choroiditis
  display_name: Tubercular choroiditis and serpiginous-like choroiditis
  classification: etiologic_infectious
  subtype_term:
    preferred_term: ocular tuberculosis
    term:
      id: MONDO:0006876
      label: ocular tuberculosis
  description: >-
    Choroidal inflammation attributable to Mycobacterium tuberculosis, presenting
    as choroidal tubercles/tuberculoma, multifocal choroiditis, or — most
    treacherously — a diffuse serpiginous-like choroiditis that phenocopies
    idiopathic serpiginous choroiditis. Because the idiopathic phenocopy is
    conventionally treated with immunosuppression, misclassification here is the
    canonical harm scenario of the infectious/non-infectious fork.
  evidence:
  - reference: PMID:33845014
    reference_title: Classification Criteria for Tubercular Uveitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Key criteria for tubercular uveitis were a compatible uveitic syndrome, including (1) anterior uveitis with iris nodules, (2) serpiginous-like tubercular choroiditis, (3) choroidal nodule (tuberculoma)"
    explanation: SUN consensus criteria enumerate serpiginous-like choroiditis and choroidal tuberculoma as defining tubercular uveitic presentations.

- name: Syphilitic Chorioretinitis
  display_name: Syphilitic chorioretinitis, including acute syphilitic posterior placoid chorioretinitis
  classification: etiologic_infectious
  description: >-
    Ocular involvement by Treponema pallidum, "the great masquerader". It can
    imitate almost any uveitic phenotype, and its one relatively distinctive form
    is acute syphilitic posterior placoid chorioretinitis (ASPPC), a large
    yellowish placoid outer-retinal lesion at the posterior pole. Serologic
    exclusion of syphilis is mandatory before immunosuppressing any choroiditis.
    No MONDO term for ocular/syphilitic chorioretinitis exists at time of
    curation, so this subtype carries no subtype_term.
  evidence:
  - reference: PMID:33831337
    reference_title: Ocular syphilis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With the exception of syphilitic posterior placoid chorioretinitis, the diverse manifestations of ocular syphilis have few distinct features that can be used to assist in clinical diagnosis."
    explanation: Documents both the masquerading breadth of ocular syphilis and ASPPC as its one distinctive chorioretinal form.
  - reference: PMID:22863970
    reference_title: "Acute syphilitic posterior placoid chorioretinitis: report of a case series and comprehensive review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients, posterior segment examination in the involved eyes revealed a large, yellowish, placoid, outer retinal lesion."
    explanation: Defines the characteristic ASPPC lesion morphology in a 16-patient series.

- name: Presumed Ocular Histoplasmosis Syndrome
  display_name: Presumed ocular histoplasmosis syndrome (POHS)
  classification: etiologic_infectious
  subtype_term:
    preferred_term: histoplasmosis retinitis
    term:
      id: MONDO:0001263
      label: histoplasmosis retinitis
  description: >-
    A chorioretinal disorder of Histoplasma capsulatum-endemic regions (in the
    United States, the Mississippi and Ohio river valleys), characterised by
    punched-out "histo spots", peripapillary atrophy and absent vitritis. Vision
    loss is driven almost entirely by secondary choroidal neovascularization
    rather than by active inflammation, so management is anti-VEGF-led rather
    than immunosuppression-led.
  evidence:
  - reference: PMID:25841248
    reference_title: Ocular histoplasmosis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular histoplasmosis syndrome (OHS) is a chorioretinal disorder with a distinct fundus appearance that is commonly found in regions endemic for Histoplasma capsulatum."
    explanation: Defines POHS as an endemic-region chorioretinal disorder attributed to Histoplasma capsulatum.

- name: Birdshot Chorioretinopathy
  display_name: Birdshot chorioretinopathy (HLA-A29-associated)
  classification: etiologic_noninfectious
  subtype_term:
    preferred_term: birdshot chorioretinopathy
    term:
      id: MONDO:0011599
      label: birdshot chorioretinopathy
  description: >-
    A bilateral chronic posterior uveitis of middle-aged people of European
    descent with no extraocular manifestations, defined by scattered
    cream-coloured hypopigmented choroidal lesions with retinal vasculitis and
    vitritis. Its association with HLA-A29 is among the strongest HLA-disease
    associations documented in humans, and ERAP1/ERAP2 haplotypes modify risk
    within HLA-A29 carriers. Requires long-term immunosuppressive or biologic
    therapy.
  evidence:
  - reference: PMID:25434765
    reference_title: The immunopathogenesis of birdshot chorioretinopathy; a bird of many feathers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BSCR is characterized by distinctive multiple choroidal hypopigmented lesions in combination with retinal vasculitis and vitritis, and the extraordinary feature that virtually all patients are HLA-A29 positive."
    explanation: Defines the birdshot phenotype and its near-obligate HLA-A29 positivity.

- name: Multifocal Choroiditis with Panuveitis
  display_name: Multifocal choroiditis with panuveitis (MFCPU)
  classification: etiologic_noninfectious
  subtype_term:
    preferred_term: multifocal choroiditis
    term:
      id: MONDO:0023833
      label: multifocal choroiditis
  description: >-
    Idiopathic chronic bilateral chorioretinopathy of predominantly young myopic
    women, with multiple punched-out chorioretinal lesions plus anterior-chamber
    and vitreous inflammation. Distinguished from PIC largely by the presence of
    overt intraocular inflammation and larger lesions; carries a high rate of
    choroidal neovascularization and of structural complications.
  evidence:
  - reference: PMID:27994812
    reference_title: Idiopathic Multifocal Choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MFCPU is a variant of idiopathic MFC that has been described in association with anterior uveitis and/or vitritis, multiple punched-out atrophic chorioretinal lesions of variable size"
    explanation: Defines MFCPU as the inflammatory variant of idiopathic multifocal choroiditis.

- name: Punctate Inner Choroidopathy
  display_name: Punctate inner choroidopathy (PIC)
  classification: etiologic_noninfectious
  subtype_term:
    preferred_term: punctate inner choroidopathy
    term:
      id: MONDO:0035584
      label: punctate inner choroidopathy
  description: >-
    An uncommon idiopathic inflammatory chorioretinopathy of young myopic women,
    with small yellow-white lesions of the inner choroid and outer retina and
    characteristically absent vitritis. Choroidal neovascularization is
    exceptionally common and is the principal threat to sight, so management must
    distinguish new inflammatory lesions from new neovascular membranes.
  evidence:
  - reference: PMID:38181975
    reference_title: "Punctate inner choroidopathy: A review of the current diagnostic and therapeutic approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Punctate inner choroidopathy (PIC) is an uncommon idiopathic inflammatory condition characterized by multifocal chorioretinopathy that primarily affects young adults, with a predilection for myopic females."
    explanation: Defines PIC and its demographic predilection.

- name: Serpiginous Choroiditis
  display_name: Serpiginous choroiditis (idiopathic)
  classification: etiologic_noninfectious
  subtype_term:
    preferred_term: serpiginous choroiditis
    term:
      id: MONDO:0018152
      label: serpiginous choroiditis
  description: >-
    A rare, usually bilateral, chronic and relentlessly recurrent inflammation of
    choroid, RPE and choriocapillaris that spreads in a geographic
    (serpentine) pattern, classically peripapillary, macular or ampiginous.
    Idiopathic serpiginous choroiditis must be separated from tubercular
    serpiginous-like choroiditis before immunosuppression is started.
  evidence:
  - reference: PMID:15850812
    reference_title: Serpiginous choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serpiginous choroiditis is a rare, usually bilateral, chronic, progressive, recurrent inflammation of the choroid, retinal pigment epithelium, and choriocapillaris of unknown etiology."
    explanation: Defines idiopathic serpiginous choroiditis and its target tissues.

- name: Sarcoid Choroiditis
  display_name: Sarcoidosis-associated choroiditis
  classification: etiologic_noninfectious
  description: >-
    Choroidal involvement in systemic sarcoidosis, part of a granulomatous
    uveitis that may include vitritis, retinal vasculitis and choroidal
    granulomas. The systemic granulomatous mechanism is curated in the
    Sarcoidosis and Neurosarcoidosis entries; this subtype scopes only the
    ocular/choroidal arm. No MONDO term for ocular sarcoidosis exists at time of
    curation, so this subtype carries no subtype_term.
  evidence:
  - reference: PMID:37176633
    reference_title: "Sarcoidosis-Related Uveitis: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Posterior involvement includes vitritis, vasculitis and choroidal lesions."
    explanation: Documents choroidal involvement as part of posterior sarcoid uveitis.

- name: Sympathetic Ophthalmia
  display_name: Sympathetic ophthalmia
  classification: etiologic_noninfectious
  subtype_term:
    preferred_term: sympathetic ophthalmia
    term:
      id: MONDO:0019198
      label: sympathetic ophthalmia
  description: >-
    A rare bilateral granulomatous panuveitis following penetrating trauma or
    surgery to one eye, in which autoimmunity to sequestered uveal/retinal
    antigen released by the injured eye attacks the fellow ("sympathising") eye.
    Choroidal involvement takes the form of yellowish-white lesions or
    Dalen-Fuchs nodules.
  evidence:
  - reference: PMID:35647958
    reference_title: "Sympathetic ophthalmia: A comprehensive update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sympathetic ophthalmia is a rare, bilateral, granulomatous, panuveitis following penetrating trauma or surgery to one eye."
    explanation: Defines sympathetic ophthalmia as post-traumatic bilateral granulomatous panuveitis.

pathophysiology:
- name: Aetiologic Fork - Infectious versus Non-Infectious Choroidal Inflammation
  biological_scale: ORGANISM
  role: trigger
  description: >-
    The root branch point of the entry. Choroidal inflammation may be driven by a
    replicating pathogen within ocular tissue or by an antigen-driven
    autoimmune/autoinflammatory process against ocular self-antigen. Both arms
    produce clinically overlapping choroiditis, and both converge on the same
    downstream tissue-injury cascade, but they diverge completely at the level of
    management: the infectious arm requires antimicrobial eradication and is made
    worse by unopposed immunosuppression, whereas the non-infectious arm requires
    exactly that immunosuppression. Distinguishing the arms is therefore the
    single most consequential diagnostic act in choroiditis.
  locations:
  - preferred_term: choroid
    term:
      id: UBERON:0001776
      label: optic choroid
  downstream:
  - target: Pathogen Invasion and Persistence in the Choroid and Outer Retina
    description: Aetiologic assignment to the infectious arm.
    causal_link_type: DIRECT
  - target: Autoimmune Recognition of Ocular Self-Antigen
    description: Aetiologic assignment to the non-infectious arm.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37589912
    reference_title: Challenges in posterior uveitis-tips and tricks for the retina specialist.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The spectrum of etiologies for uveitis is very broad and includes infectious and auto-immune diseases."
    explanation: States the infectious/autoimmune aetiologic dichotomy that structures this entry.
  - reference: PMID:37428299
    reference_title: "The large Hellenic Study of Uveitis: epidemiology, etiologic factors and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Out of 6191 cases with uveitis, 1925 were infectious, 4125 were non-infectious"
    explanation: Quantifies the infectious/non-infectious split in a 30-year tertiary uveitis cohort, showing both arms are numerically substantial.

- name: Pathogen Invasion and Persistence in the Choroid and Outer Retina
  biological_scale: CELLULAR
  role: trigger
  description: >-
    In the infectious arm, an organism reaches and persists in the choroid, RPE
    or outer retina: Toxoplasma gondii as encysted bradyzoites in retinal scars,
    Mycobacterium tuberculosis within choroidal macrophages, Treponema pallidum
    disseminated haematogenously to the highly vascular choroid, or Histoplasma
    capsulatum presumed to have seeded the choroid during earlier fungaemia. The
    choroid's exceptionally high blood flow makes it a preferential site of
    haematogenous seeding. Organism persistence, not merely acute invasion, is
    what makes the infectious arm relapsing and what makes unopposed
    immunosuppression dangerous.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  locations:
  - preferred_term: choroid
    term:
      id: UBERON:0001776
      label: optic choroid
  downstream:
  - target: Choroidal Inflammatory Cell Infiltration
    description: Pathogen antigen drives recruitment of leukocytes into the choroidal stroma.
    causal_link_type: DIRECT
  - target: Toxoplasma Cyst Reactivation and Recurrent Retinochoroiditis
    description: Persisting tissue cysts provide the reservoir for later reactivation.
    causal_link_type: DIRECT
  - target: Unopposed Immunosuppression of Unrecognised Infectious Choroiditis
    description: >-
      Persisting organism is the substrate on which immunosuppression given
      without antimicrobial cover acts.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Misclassification of infectious choroiditis as an idiopathic non-infectious entity
    evidence:
    - reference: PMID:22675097
      reference_title: Tubercular serpiginous-like choroiditis.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Choroidal tuberculosis (TB) infection may present itself as a diffuse choroiditis that resembles serpiginous choroiditis, usually treated with immunossupressants."
      explanation: >-
        Documents the specific route by which a persisting organism ends up
        receiving immunosuppression - phenocopy of an entity conventionally
        treated that way. Marked PARTIAL because the source establishes the
        misclassification risk, not a measured harm from immunosuppression.
  evidence:
  - reference: PMID:36095008
    reference_title: Ocular Toxoplasmosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular toxoplasmosis is the leading cause of posterior uveitis worldwide"
    explanation: Establishes an infectious organism as the single commonest driver of posterior uveitis/choroiditis.
  - reference: PMID:33831337
    reference_title: Ocular syphilis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular involvement can occur at any stage of syphilis and any part of the eye can be affected."
    explanation: Documents haematogenous ocular seeding by Treponema pallidum at any disease stage.
  - reference: PMID:33845014
    reference_title: Classification Criteria for Tubercular Uveitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "evidence of tuberculosis, including histologically or microbiologically confirmed infection, positive interferon-γ release assay test, or positive tuberculin skin test"
    explanation: Consensus criteria require demonstrable mycobacterial infection, supporting organism presence as the driver of the tubercular arm.

- name: Toxoplasma Cyst Reactivation and Recurrent Retinochoroiditis
  biological_scale: TISSUE
  role: amplifier
  description: >-
    The signature relapsing behaviour of ocular toxoplasmosis. Bradyzoites
    encysted in the retina at the edge of an old pigmented chorioretinal scar
    convert back to proliferating tachyzoites, producing a new satellite focus of
    necrotising retinochoroiditis at the scar border. Each reactivation enlarges
    the area of destroyed outer retina, so cumulative visual loss is driven by
    recurrence count and lesion location rather than by any single episode.
    Immunocompromise markedly worsens lesion size and visual outcome.
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000287
      label: eye photoreceptor cell
  locations:
  - preferred_term: choroid
    term:
      id: UBERON:0001776
      label: optic choroid
  downstream:
  - target: Outer Retinal and Retinal Pigment Epithelial Damage
    description: Each reactivation episode destroys a further patch of outer retina.
    causal_link_type: DIRECT
  - target: Chorioretinal scar
    description: Healed reactivation foci leave pigmented atrophic scars.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38843299
    reference_title: "Clinical characteristics, visual acuity outcomes, and factors associated with loss of vision among patients with active ocular toxoplasmosis: A retrospective study in a Thai tertiary center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cumulative incidence of recurrent OT at three years was 33.9%"
    explanation: Quantifies the recurrent nature of ocular toxoplasmosis in a treated tertiary cohort.
  - reference: PMID:38843299
    reference_title: "Clinical characteristics, visual acuity outcomes, and factors associated with loss of vision among patients with active ocular toxoplasmosis: A retrospective study in a Thai tertiary center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OT reactivation, owing to the persistence of tissue cysts in retinal tissues, can increase the probability of VA loss."
    explanation: >-
      Directly states the tissue-cyst-persistence mechanism of reactivation and
      its link to cumulative visual loss.
  - reference: PMID:38843299
    reference_title: "Clinical characteristics, visual acuity outcomes, and factors associated with loss of vision among patients with active ocular toxoplasmosis: A retrospective study in a Thai tertiary center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunocompromised patients showed a significantly larger size of retinitis than immunocompetent patients."
    explanation: Shows host immune control constrains lesion size, consistent with reactivation being restrained by immunity.

- name: Unopposed Immunosuppression of Unrecognised Infectious Choroiditis
  biological_scale: ORGANISM
  role: amplifier
  description: >-
    The harm arm of the aetiologic fork, and the reason the fork must be modelled
    mechanistically rather than as a list. When infectious choroiditis is
    misclassified as an idiopathic non-infectious entity, it receives the correct
    treatment for the wrong diagnosis — corticosteroid and/or steroid-sparing
    immunosuppression without antimicrobial cover. The expected consequence is
    loss of host immune restraint on a replicating organism; note that the
    documented evidence here is for the misclassification hazard and for the
    superiority of adding antimicrobial therapy, rather than a trial measuring
    harm from unopposed immunosuppression directly. Tubercular
    serpiginous-like choroiditis is the canonical case, because its idiopathic
    phenocopy is conventionally immunosuppressed; syphilis is the second, because
    it can imitate essentially any uveitic phenotype. This is why serologic and
    mycobacterial exclusion precede immunosuppression in all choroiditis.
  locations:
  - preferred_term: choroid
    term:
      id: UBERON:0001776
      label: optic choroid
  downstream:
  - target: Outer Retinal and Retinal Pigment Epithelial Damage
    description: >-
      Uncontrolled pathogen replication extends the zone of outer-retinal
      destruction.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Unrestrained pathogen replication in choroid and outer retina
  evidence:
  - reference: PMID:22675097
    reference_title: Tubercular serpiginous-like choroiditis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Choroidal tuberculosis (TB) infection may present itself as a diffuse choroiditis that resembles serpiginous choroiditis, usually treated with immunossupressants."
    explanation: >-
      States the misclassification hazard directly - a TB choroiditis that
      phenocopies an entity conventionally treated with immunosuppressants.
      Marked PARTIAL because the source documents the risk of misdirected
      treatment rather than measuring harm from immunosuppression.
      (The spelling "immunossupressants" is as printed in the source.)
  - reference: PMID:22675097
    reference_title: Tubercular serpiginous-like choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent studies have demonstrated that patients with serpiginous-like choroiditis and evidence of systemic or latent TB are best treated with antituberculosis treatment (ATT) in addition to the corticosteroid therapy."
    explanation: >-
      Establishes that corticosteroid is appropriate in the infectious arm only
      when combined with antimicrobial therapy - the operational content of the
      management fork.
  - reference: PMID:33831337
    reference_title: Ocular syphilis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ocular syphilis should always be a part of the differential diagnosis of most, if not all, ocular infectious and inflammatory presentations"
    explanation: Supports mandatory syphilis exclusion in any inflammatory ocular presentation before immunosuppression.

- name: Autoimmune Recognition of Ocular Self-Antigen
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    In the non-infectious arm, T cells recognise peptide derived from ocular
    self-antigen presented on MHC molecules, breaking the eye's immune
    privilege. Loss of sequestration is explicit in
    sympathetic ophthalmia, where penetrating trauma exposes previously
    sequestered uveal antigen and provokes bilateral granulomatous disease. In
    birdshot chorioretinopathy the presenting molecule itself is the dominant
    genetic risk factor.
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: antigen processing and presentation of peptide antigen via MHC class I
    modifier: ABNORMAL
    term:
      id: GO:0002474
      label: antigen processing and presentation of peptide antigen via MHC class I
  - preferred_term: T cell mediated immunity
    modifier: INCREASED
    term:
      id: GO:0002456
      label: T cell mediated immunity
  downstream:
  - target: HLA-A29-Restricted Antigen Presentation in Birdshot Chorioretinopathy
    description: The birdshot-specific instantiation of self-antigen presentation.
    causal_link_type: DIRECT
  - target: Choroidal Inflammatory Cell Infiltration
    description: Autoreactive T cells recruit and sustain a choroidal infiltrate.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25434765
    reference_title: The immunopathogenesis of birdshot chorioretinopathy; a bird of many feathers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the association with HLA-A29 suggests that it is directly involved in the presentation of peptide antigens to T cells"
    explanation: Frames the non-infectious arm as MHC-restricted peptide presentation to T cells.
  - reference: PMID:35647958
    reference_title: "Sympathetic ophthalmia: A comprehensive update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sympathetic ophthalmia is a rare, bilateral, granulomatous, panuveitis following penetrating trauma or surgery to one eye."
    explanation: >-
      Sympathetic ophthalmia is the clearest human demonstration that breach of
      ocular antigen sequestration triggers bilateral autoimmune uveitis.

- name: HLA-A29-Restricted Antigen Presentation in Birdshot Chorioretinopathy
  biological_scale: MOLECULAR
  role: driver
  description: >-
    Birdshot chorioretinopathy carries one of the strongest HLA-disease
    associations documented in human medicine: essentially all patients are
    HLA-A29 positive. In a classic series 47 of 49 birdshot patients (95.9%)
    carried HLA-A29, and the linked HLA-B12(B44) association is explained by
    linkage disequilibrium with HLA-A29 rather than by independent effect.
    Mechanistically the association is not merely a marker - genetic modifiers
    act on the peptide-loading pathway that supplies HLA-A29. ERAP1 and ERAP2
    haplotypes that increase ERAP2 expression and decrease ERAP1 expression raise
    risk in HLA-A29 carriers, while a haplotype disrupting ERAP2 expression is
    protective, and homozygosity for HLA-A29 further increases susceptibility.
    Together these implicate a peptide-presentation threshold model in which
    excess presentation of ERAP2-shaped peptides on HLA-A29 activates the immune
    response in the choroid.
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: antigen processing and presentation of peptide antigen via MHC class I
    modifier: INCREASED
    term:
      id: GO:0002474
      label: antigen processing and presentation of peptide antigen via MHC class I
  genes:
  - preferred_term: HLA-A29
    term:
      id: hgnc:4931
      label: HLA-A
  - preferred_term: ERAP1
    term:
      id: hgnc:18173
      label: ERAP1
  - preferred_term: ERAP2
    term:
      id: hgnc:29499
      label: ERAP2
  locations:
  - preferred_term: choroid
    term:
      id: UBERON:0001776
      label: optic choroid
  downstream:

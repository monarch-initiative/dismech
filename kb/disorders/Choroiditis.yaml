- name: Inflammatory Choroidal Neovascularization
  biological_scale: TISSUE
  role: consequence
  description: >-
    A major sight-threatening complication of inflammatory chorioretinal scars,
    and in some entities the dominant cause of vision loss rather than the
    inflammation itself. Inflammation compromises choroidal perfusion, generating
    a retinal-choroidal hypoxia gradient; VEGF, SDF-1-alpha and other mediators
    are released; and with the RPE-Bruch's membrane barrier already breached, new
    choroidal vessels grow into the subretinal space, the majority appearing as
    a classic type 2 lesion.
    It is especially common in punctate inner choroidopathy, multifocal
    choroiditis, serpiginous choroiditis and presumed ocular histoplasmosis
    syndrome. Clinically it is hard to distinguish from an active inflammatory
    lesion, which matters because the treatments differ: anti-VEGF for the
    neovascular membrane versus anti-inflammatory therapy for active choroiditis.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED

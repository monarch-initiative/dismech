- name: Granulomatous Choroidal Inflammation
  biological_scale: TISSUE
  role: effector
  description: >-
    In sarcoidosis, tuberculosis and sympathetic ophthalmia the choroidal
    infiltrate organises into granulomas. Sarcoid granulomas are non-caseating
    epithelioid granulomas; tubercular disease produces choroidal tubercles and
    tuberculoma; sympathetic ophthalmia produces Dalen-Fuchs nodules, focal
    aggregates of epithelioid cells between Bruch's membrane and the RPE. That
    both an infectious (TB) and a sterile (sarcoid) trigger yield broadly
    overlapping granulomatous choroiditis is a second, tissue-level restatement
    of why the aetiologic fork is not reliably settled on morphology alone -
    tuberculosis is the standing differential for ocular sarcoidosis, and
    caseation, while suggestive of tuberculosis, is often unavailable because
    ocular biopsy is rarely performed.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: granuloma formation
    modifier: INCREASED

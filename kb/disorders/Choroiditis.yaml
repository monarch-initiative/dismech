    reference_title: Idiopathic Multifocal Choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected eyes typically show multiple punched-out chorioretinal lesions ranging from 50 to 350 μm in size"
    explanation: Documents punched-out chorioretinal lesions as the characteristic healed lesion morphology.
  - reference: PMID:38843299
    reference_title: "Clinical characteristics, visual acuity outcomes, and factors associated with loss of vision among patients with active ocular toxoplasmosis: A retrospective study in a Thai tertiary center."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients mainly presented with primary retinitis without previous scar (62%)"
    explanation: >-
      Marked PARTIAL because this is an argument from the complement: 62% had no
      previous scar, so the remaining ~38% presented in eyes carrying a
      pre-existing chorioretinal scar. The source reports the former directly,
      not the latter.

- category: Ocular
  name: Choroidal neovascularization
  description: >-
    Ingrowth of new choroidal vessels through a breached RPE-Bruch's membrane
    complex into the subretinal space. A major sight-threatening complication and
    in POHS and PIC the dominant cause of vision loss.
  phenotype_term:
    preferred_term: Choroidal neovascularization
    term:
      id: HP:0011506
      label: Choroidal neovascularization
  evidence:
  - reference: PMID:25841248
    reference_title: Ocular histoplasmosis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Choroidal neovascularization (CNV) secondary to OHS is considered one of the principal causes of central vision loss among young adults in endemic areas."
    explanation: Documents CNV as the dominant vision-threatening complication in POHS.
  - reference: PMID:38181975
    reference_title: "Punctate inner choroidopathy: A review of the current diagnostic and therapeutic approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "New or worsening PIC lesions suggest active inflammation, while new neovascular membranes may indicate secondary neovascular processes."
    explanation: Confirms neovascular membranes as a distinct, treatment-relevant complication of PIC.

- category: Ocular
  name: Vitritis
  description: >-
    Inflammatory cells in the vitreous cavity, reflecting spillover from
    choroidal and retinal inflammation. Characteristically present in ocular
    toxoplasmosis, birdshot chorioretinopathy and MFCPU, and characteristically
    absent in punctate inner choroidopathy - a discriminating sign.
  phenotype_term:
    preferred_term: Vitritis
    term:
      id: HP:0011531
      label: Vitritis
  evidence:
  - reference: PMID:37176633
    reference_title: "Sarcoidosis-Related Uveitis: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Posterior involvement includes vitritis, vasculitis and choroidal lesions."
    explanation: Documents vitritis accompanying choroidal involvement in posterior uveitis.
  - reference: PMID:25434765
    reference_title: The immunopathogenesis of birdshot chorioretinopathy; a bird of many feathers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BSCR is characterized by distinctive multiple choroidal hypopigmented lesions in combination with retinal vasculitis and vitritis"
    explanation: Documents vitritis as a defining feature of birdshot chorioretinopathy.

- category: Ocular
  name: Retinal vasculitis
  description: >-
    Inflammation of retinal vessels accompanying choroidal inflammation. A
    defining component of birdshot chorioretinopathy and a recognised feature of
    sarcoid and tubercular posterior uveitis (where it may be occlusive).
  phenotype_term:
    preferred_term: Retinal vasculitis
    term:
      id: HP:0025188
      label: Retinal vasculitis
  evidence:
  - reference: PMID:25434765
    reference_title: The immunopathogenesis of birdshot chorioretinopathy; a bird of many feathers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BSCR is characterized by distinctive multiple choroidal hypopigmented lesions in combination with retinal vasculitis and vitritis"
    explanation: Documents retinal vasculitis as a defining feature of birdshot chorioretinopathy.
  - reference: PMID:33845014
    reference_title: Classification Criteria for Tubercular Uveitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(4) occlusive retinal vasculitis, and (5) in hosts with evidence of active systemic tuberculosis, multifocal choroiditis"
    explanation: Lists occlusive retinal vasculitis among the SUN-defining presentations of tubercular uveitis.

- category: Ocular
  name: Macular edema
  description: >-
    Accumulation of intraretinal fluid at the macula from inflammatory breakdown
    of the blood-retinal barrier. A leading reversible cause of vision loss in
    choroiditis and the primary endpoint of several uveitis trials.
  phenotype_term:
    preferred_term: Macular edema
    term:
      id: HP:0040049
      label: Macular edema
  evidence:
  - reference: PMID:27994812
    reference_title: Idiopathic Multifocal Choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "higher frequency of structural complications such as cataract, cystoid macular edema (CME), and epiretinal membrane (ERM) related to intraocular inflammation"
    explanation: Documents cystoid macular edema as an inflammation-related structural complication of MFCPU.

- category: Ocular
  name: Scotoma
  description: >-
    A localised blind spot in the visual field corresponding to a zone of
    destroyed outer retina. Because photoreceptor loss is irreversible, scotomata
    from healed choroiditis lesions are permanent.
  phenotype_term:
    preferred_term: Scotoma
    term:
      id: HP:0000575
      label: Scotoma
  evidence:
  - reference: PMID:27994812
    reference_title: Idiopathic Multifocal Choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients may complain of a temporal scotoma, metamorphopsia, floaters, photopsias, photophobia, and decreased vision"
    explanation: Lists scotoma among the presenting symptoms of multifocal choroiditis.

- category: Ocular
  name: Metamorphopsia
  description: >-
    Distortion of straight lines, typically signalling macular involvement by
    subretinal fluid or a choroidal neovascular membrane.
  phenotype_term:
    preferred_term: Metamorphopsia
    term:
      id: HP:0012508
      label: Metamorphopsia
  evidence:
  - reference: PMID:27994812
    reference_title: Idiopathic Multifocal Choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients may complain of a temporal scotoma, metamorphopsia, floaters, photopsias, photophobia, and decreased vision"
    explanation: Lists metamorphopsia among the presenting symptoms of multifocal choroiditis.

- category: Ocular
  name: Photopsia
  description: >-
    Perceived flashes or shimmering of light arising from dysfunctional or
    irritated photoreceptors overlying active outer-retinal inflammation.
  phenotype_term:
    preferred_term: Photopsia
    term:
      id: HP:0030786
      label: Photopsia
  evidence:
  - reference: PMID:27994812
    reference_title: Idiopathic Multifocal Choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients may complain of a temporal scotoma, metamorphopsia, floaters, photopsias, photophobia, and decreased vision"
    explanation: Lists photopsia among the presenting symptoms of multifocal choroiditis.

- category: Ocular
  name: Blindness
  description: >-
    Severe irreversible visual loss, the feared endpoint of macula-involving or
    repeatedly recurrent choroiditis.
  phenotype_term:
    preferred_term: Blindness
    term:
      id: HP:0000618
      label: Blindness
  evidence:
  - reference: PMID:39452769
    reference_title: "Ocular Toxoplasmosis: Advances in Toxoplasma gondii Biology, Clinical Manifestations, Diagnostics, and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular toxoplasmosis (OT), a severe manifestation of T. gondii infection, can lead to potentially blinding complications."
    explanation: Documents blindness as a potential outcome of the commonest infectious choroiditis.

- category: Ocular
  name: Vitreous floaters
  description: >-
    Perceived mobile opacities from inflammatory cells and debris in the
    vitreous, a common presenting symptom of active choroiditis.
  phenotype_term:
    preferred_term: Vitreous floaters
    term:
      id: HP:0100832
      label: Vitreous floaters
  evidence:
  - reference: PMID:27994812
    reference_title: Idiopathic Multifocal Choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients may complain of a temporal scotoma, metamorphopsia, floaters, photopsias, photophobia, and decreased vision"
    explanation: Lists floaters among the presenting symptoms of multifocal choroiditis.

- category: Ocular
  name: Macular scar
  description: >-
    A healed, often pigmented chorioretinal scar involving the macula. The
    commonest structural complication in an ocular toxoplasmosis cohort, present
    in 24.7% of patients, and a direct cause of permanent central visual loss.
  phenotype_term:
    preferred_term: Macular scar
    term:
      id: HP:0200056
      label: Macular scar
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:38843299
    reference_title: "Clinical characteristics, visual acuity outcomes, and factors associated with loss of vision among patients with active ocular toxoplasmosis: A retrospective study in a Thai tertiary center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Macular scar 24 (24.7)"
    explanation: >-
      Complications table reports macular scar in 24 of 97 patients (24.7%),
      supporting the OCCASIONAL (5-29%) frequency band.

- category: Ocular
  name: Ocular hypertension
  description: >-
    Raised intraocular pressure (above 21 mmHg) complicating intraocular
    inflammation and its corticosteroid treatment, recorded in 20.6% of an
    ocular toxoplasmosis cohort.
  phenotype_term:
    preferred_term: Ocular hypertension
    term:
      id: HP:0007906
      label: Ocular hypertension
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:38843299
    reference_title: "Clinical characteristics, visual acuity outcomes, and factors associated with loss of vision among patients with active ocular toxoplasmosis: A retrospective study in a Thai tertiary center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular hypertension (IOP >21 mmHg) 20 (20.6)"
    explanation: >-
      Complications table reports ocular hypertension in 20 of 97 patients
      (20.6%), supporting the OCCASIONAL (5-29%) frequency band.

- category: Ocular
  name: Epiretinal membrane
  description: >-
    A fibrocellular membrane on the inner retinal surface, a structural
    complication of chronic intraocular inflammation that can distort the macula
    and reduce acuity. Reported in 12.6% of an ocular toxoplasmosis cohort.
  phenotype_term:
    preferred_term: Epiretinal membrane
    term:
      id: HP:0100014
      label: Epiretinal membrane
  evidence:
  - reference: PMID:27994812
    reference_title: Idiopathic Multifocal Choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "higher frequency of structural complications such as cataract, cystoid macular edema (CME), and epiretinal membrane (ERM) related to intraocular inflammation"
    explanation: Documents epiretinal membrane as an inflammation-related structural complication of MFCPU.

- category: Ocular
  name: Cataract
  description: >-
    Lens opacification arising from chronic intraocular inflammation and from
    the corticosteroid therapy used to treat it - a complication of both the
    disease and its management.
  phenotype_term:
    preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
  evidence:
  - reference: PMID:27994812
    reference_title: Idiopathic Multifocal Choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "higher frequency of structural complications such as cataract, cystoid macular edema (CME), and epiretinal membrane (ERM) related to intraocular inflammation"
    explanation: Documents cataract as an inflammation-related structural complication of MFCPU.

histopathology:
- name: Diffuse Lymphocytic Choroidal Infiltrate
  description: >-
    Moderate diffuse lymphocytic infiltration throughout the choroid, accompanied
    by atrophy of the choriocapillaris, RPE and photoreceptors in established
    lesions.
  evidence:
  - reference: PMID:15850812
    reference_title: Serpiginous choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The histological findings of the lesions are atrophy of the choriocapillaris, retinal pigment epithelium and photoreceptor cells, and moderate diffuse lymphocytic infiltrates throughout the choroid."
    explanation: Direct histologic description of serpiginous choroiditis lesions.

- name: Non-Caseating Epithelioid Granuloma
  description: >-
    Compact aggregates of epithelioid macrophages without central caseation, the
    histologic hallmark of sarcoid choroiditis. Caseation instead favours
    tuberculosis, but biopsy yield in the eye is low and the diagnosis of ocular
    sarcoidosis is usually clinico-radiological.
  diagnostic: true
  evidence:
  - reference: PMID:37176633
    reference_title: "Sarcoidosis-Related Uveitis: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is based on histology with the presence of non-caseating epithelioid granulomas."
    explanation: Defines the non-caseating epithelioid granuloma as the diagnostic histologic finding of sarcoidosis.

- name: Dalen-Fuchs Nodule
  description: >-
    Focal aggregates of epithelioid cells lying between Bruch's membrane and the
    retinal pigment epithelium, seen as yellowish-white choroidal lesions in
    sympathetic ophthalmia.
  evidence:
  - reference: PMID:35647958
    reference_title: "Sympathetic ophthalmia: A comprehensive update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It manifests as acute/chronic granulomatous uveitis with yellowish-white choroidal lesions or Dalen-Fuchs nodules."
    explanation: Documents Dalen-Fuchs nodules as the characteristic choroidal lesion of sympathetic ophthalmia.

diagnosis:
- name: Optical Coherence Tomography (including EDI-OCT)
  description: >-
    The preferred modality for detecting active choroiditis lesions and for
    monitoring recurrence. OCT resolves the RPE elevations, ellipsoid-zone
    disruption and subretinal material of active lesions, and enhanced-depth
    imaging (EDI-OCT) visualises the choroid itself. SUN classification criteria
    for MFCPU and PIC now incorporate OCT findings for assessment of activity.
  diagnosis_term:
    preferred_term: Optical Coherence Tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  evidence:
  - reference: PMID:40288596
    reference_title: Evidence and Consensus-Based Imaging Guidelines in Multifocal Choroiditis With Panuveitis and Punctate Inner Choroiditis-Multimodal Imaging in Uveitis (MUV) Taskforce Report 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OCT is the preferred modality for detecting active lesions."
    explanation: Expert-consensus statement designating OCT as first-line for detecting activity.
  - reference: PMID:40288596
    reference_title: Evidence and Consensus-Based Imaging Guidelines in Multifocal Choroiditis With Panuveitis and Punctate Inner Choroiditis-Multimodal Imaging in Uveitis (MUV) Taskforce Report 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Incorporating imaging findings, particularly OCT, into the Standardization of Uveitis Nomenclature (SUN) classification criteria for MFCPU and PIC enables more precise assessment of disease activity."
    explanation: Documents integration of OCT into formal classification criteria.

- name: Fundus Autofluorescence
  description: >-
    A non-invasive map of RPE health. Hypoautofluorescence marks RPE loss in
    healed lesions and hyperautofluorescence can mark active or recent disease.
    Consensus places FAF alongside OCT as an effective modality for monitoring
    disease recurrence in MFCPU and PIC.
  diagnosis_term:
    preferred_term: Fundus Autofluorescence Imaging
    term:
      id: NCIT:C162465
      label: Fundus Autofluorescence Imaging
  evidence:
  - reference: PMID:40288596
    reference_title: Evidence and Consensus-Based Imaging Guidelines in Multifocal Choroiditis With Panuveitis and Punctate Inner Choroiditis-Multimodal Imaging in Uveitis (MUV) Taskforce Report 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both FAF and OCT are effective for monitoring disease recurrence."
    explanation: Consensus designation of fundus autofluorescence as a recurrence-monitoring modality.

- name: Indocyanine Green Angiography
  description: >-
    The modality that images the choroidal circulation directly and therefore the
    one that reveals choriocapillaris hypo- and non-perfusion, seen as patchy
    lobular hypofluorescence. Late-phase ICGA is most valuable in recurrent
    disease when lesions are invisible on fundus autofluorescence and colour
    fundus photography.
  diagnosis_term:
    preferred_term: Indocyanine Green Fluorescence Angiography
    term:
      id: NCIT:C175030
      label: Indocyanine Green Fluorescence Angiography
  evidence:
  - reference: PMID:35208488
    reference_title: "Diagnosis and Treatment of Primary Inflammatory Choriocapillaropathies (PICCPs): A Comprehensive Overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ICGA shows the typical pattern of patchy lobular hypofluorescence reflecting hypo- or non-perfusion of the choriocapillaris"
    explanation: Establishes ICGA as the modality that visualises the choriocapillaris non-perfusion mechanism.
  - reference: PMID:40288596
    reference_title: Evidence and Consensus-Based Imaging Guidelines in Multifocal Choroiditis With Panuveitis and Punctate Inner Choroiditis-Multimodal Imaging in Uveitis (MUV) Taskforce Report 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Late-phase ICGA is most valuable in recurrent disease when the lesions are not visible on FAF and CFP."
    explanation: Defines the specific clinical niche of ICGA in choroiditis follow-up.

- name: Fluorescein Angiography
  description: >-
    Images the retinal circulation and the RPE window, delineating active
    inflammatory lesions and choroidal neovascular membranes. In acute syphilitic
    posterior placoid chorioretinitis it shows progressive hyperfluorescence with
    scattered focal hypofluorescence ("leopard spotting").
  diagnosis_term:
    preferred_term: Fluorescein Angiography
    term:
      id: NCIT:C190541
      label: Fluorescein Angiography
  evidence:
  - reference: PMID:22863970
    reference_title: "Acute syphilitic posterior placoid chorioretinitis: report of a case series and comprehensive review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fluorescein angiography showed progressive hyperfluorescence in the area of the lesion, often with scattered focal hypofluorescence, or leopard spotting."
    explanation: Documents the characteristic fluorescein angiographic signature of ASPPC.

- name: Treponemal and Non-Treponemal Serology for Syphilis
  description: >-
    Mandatory exclusion test in any choroiditis before immunosuppression, given
    that ocular syphilis mimics nearly every uveitic phenotype. SUN criteria for
    syphilitic uveitis require a positive treponemal test alongside a compatible
    uveitic presentation, using the CDC reverse screening algorithm. Every
    patient with ocular syphilis also needs CSF testing for neurosyphilis and HIV
    serology.
  notes: >-
    Left without a diagnosis_term deliberately: NCIT has no term for the
    combined treponemal-plus-non-treponemal syphilis serology algorithm this
    entry describes. NCIT:C132388 Treponema pallidum Antibody Measurement
    covers only the treponemal half and would misrepresent the recommended
    two-test CDC reverse screening sequence.
  evidence:
  - reference: PMID:33845020
    reference_title: Classification Criteria for Syphilitic Uveitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Key criteria for syphilitic uveitis included a compatible uveitic presentation (anterior uveitis; intermediate uveitis; or posterior or panuveitis with retinal, retinal pigment epithelial, or retinal vascular inflammation) and evidence of syphilis infection with a positive treponemal test."
    explanation: SUN consensus criteria requiring treponemal serology for the syphilitic subtype.
  - reference: PMID:33831337
    reference_title: Ocular syphilis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with ocular syphilis should have their cerebrospinal fluids tested for the co-existence of neurosyphilis and their blood tested for human immunodeficiency virus co-infection."
    explanation: Documents the mandatory neurosyphilis and HIV co-testing that follows a positive ocular syphilis diagnosis.

- name: Interferon-Gamma Release Assay and Tuberculin Skin Testing
  description: >-
    Evidence of mycobacterial infection is required to classify a choroiditis as
    tubercular, and hence to redirect management from immunosuppression alone to
    antitubercular therapy. SUN criteria accept histologic or microbiologic
    confirmation, a positive interferon-gamma release assay, or a positive
    tuberculin skin test.
  diagnosis_term:
    preferred_term: Interferon Gamma Release Assay
    term:
      id: NCIT:C128363
      label: Interferon Gamma Release Assay
  evidence:
  - reference: PMID:33845014
    reference_title: Classification Criteria for Tubercular Uveitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "evidence of tuberculosis, including histologically or microbiologically confirmed infection, positive interferon-γ release assay test, or positive tuberculin skin test"
    explanation: SUN consensus criteria for demonstrating the mycobacterial aetiology.

- name: Intraocular Fluid PCR
  description: >-
    Detection of pathogen DNA in aqueous or vitreous humour provides definitive
    aetiologic proof in infectious choroiditis when serology and clinical
    appearance are equivocal - most usefully for Toxoplasma gondii.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:34370174
    reference_title: "Ocular toxoplasmosis: a review of the current diagnostic and therapeutic approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The detection of the parasite DNA in the aqueous or vitreous humor can provide evidence for a definitive diagnosis."
    explanation: Establishes intraocular PCR as the definitive aetiologic test in ocular toxoplasmosis.

- name: HLA-A29 Typing
  description: >-
    HLA typing supports the diagnosis of birdshot chorioretinopathy, in which
    virtually all patients carry HLA-A29. A negative HLA-A29 result should prompt
    reconsideration of the diagnosis.
  diagnosis_term:
    preferred_term: HLA Typing
    term:
      id: NCIT:C71329
      label: HLA Typing
  evidence:
  - reference: PMID:3341436
    reference_title: HLA typing in birdshot chorioretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these 49 patients, 47 (95.9%) had the HLA-A29 antigen."
    explanation: Quantifies the near-universal HLA-A29 carriage that gives the test its diagnostic value.

genetic:
- name: HLA-A29
  gene_term:
    preferred_term: HLA-A29
    term:
      id: hgnc:4931
      label: HLA-A
  notes: >-
    The dominant genetic risk factor for birdshot chorioretinopathy and the
    strongest documented HLA-disease association in humans. Virtually all
    patients carry HLA-A29, and homozygosity increases susceptibility further
    without altering severity. This is a susceptibility allele in an
    HLA-restricted autoimmune disease, not a Mendelian causal gene.
  relationship_type: SUSCEPTIBILITY
  subtype: Birdshot Chorioretinopathy
  evidence:
  - reference: PMID:25434765
    reference_title: The immunopathogenesis of birdshot chorioretinopathy; a bird of many feathers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BSCR is the strongest documented association between HLA and disease in humans"
    explanation: Establishes the exceptional strength of the HLA-A29 association.
  - reference: PMID:39570638
    reference_title: The Impact of HLA-A29 Homozygosity and of the Second HLA-A Allele on Susceptibility and Severity of Birdshot Chorioretinitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity for HLA-A29 increased the risk of developing BSCR without affecting disease severity."
    explanation: Demonstrates the allele-dosage effect on susceptibility.

- name: ERAP1
  gene_term:
    preferred_term: ERAP1
    term:
      id: hgnc:18173
      label: ERAP1
  notes: >-
    Endoplasmic reticulum aminopeptidase 1 trims peptides for MHC class I
    loading. An expression quantitative trait locus decreasing ERAP1 expression
    (rs27432) raises birdshot risk within HLA-A29 carriers, consistent with a
    model in which altered peptide processing changes the HLA-A29 peptidome.
  relationship_type: MODIFIER
  subtype: Birdshot Chorioretinopathy
  evidence:
  - reference: PMID:34727153
    reference_title: ERAP1, ERAP2, and Two Copies of HLA-Aw19 Alleles Increase the Risk for Birdshot Chorioretinopathy in HLA-A29 Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an expression quantitative trait locus (eQTL) decreasing ERAP1 expression"
    explanation: Identifies the ERAP1 risk variant as an expression-lowering eQTL.

- name: ERAP2
  gene_term:
    preferred_term: ERAP2
    term:
      id: hgnc:29499
      label: ERAP2
  notes: >-
    Endoplasmic reticulum aminopeptidase 2, whose increased expression raises
    birdshot risk while a haplotype disrupting its expression is protective. The
    opposing directions of the two ERAP2 variants make the antigen-processing
    mechanism unusually well supported.
  relationship_type: MODIFIER
  subtype: Birdshot Chorioretinopathy
  evidence:
  - reference: PMID:34727153
    reference_title: ERAP1, ERAP2, and Two Copies of HLA-Aw19 Alleles Increase the Risk for Birdshot Chorioretinopathy in HLA-A29 Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an eQTL increasing ERAP2 expression. Furthermore, ERAP2-rs2248374 that disrupts ERAP2 expression is protective"
    explanation: Documents both the risk-increasing and the protective ERAP2 expression variants.

environmental:
- name: Ocular penetrating trauma or intraocular surgery
  influences_mechanisms:
  - target: Autoimmune Recognition of Ocular Self-Antigen
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sympathetic ophthalmia is the worked example this node already names for
      loss of antigen sequestration, and penetrating injury to one eye is what
      breaches it. The intervening step is therefore a known one. Graded
      partial because the cited sentence establishes the trauma and the
      resulting entity without reaching the T cell recognition event the node
      describes.
    evidence:
    - reference: PMID:35647958
      reference_title: "Sympathetic ophthalmia: A comprehensive update."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Sympathetic ophthalmia is a rare, bilateral, granulomatous, panuveitis following penetrating trauma or surgery to one eye."
      explanation: >-
        Defines the entity as a panuveitis following penetrating trauma or
        surgery to one eye. It fixes the exposure and the disease, not the
        antigen recognition at this node.
  - target: Granulomatous Choroidal Inflammation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same sentence read one step further along: it describes the
      post-traumatic entity as granulomatous, which is this node rather than
      the generic infiltrate node upstream of it. Both edges are drawn because
      the autoimmune recognition and the granulomatous character of the
      resulting inflammation are separate claims and this entry models them as
      separate nodes.
    evidence:
    - reference: PMID:35647958
      reference_title: "Sympathetic ophthalmia: A comprehensive update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sympathetic ophthalmia is a rare, bilateral, granulomatous, panuveitis following penetrating trauma or surgery to one eye."
      explanation: >-
        Describes the entity following penetrating trauma as a granulomatous
        panuveitis, which names the granulomatous character this node holds.
  presence: PRESENT
  evidence:
  - reference: PMID:35647958
    reference_title: "Sympathetic ophthalmia: A comprehensive update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sympathetic ophthalmia is a rare, bilateral, granulomatous, panuveitis following penetrating trauma or surgery to one eye."
    explanation: Ocular penetrating injury is the required environmental trigger of sympathetic ophthalmia.

- name: Residence in a Histoplasma capsulatum-endemic region
  influences_mechanisms:
  - target: Pathogen Invasion and Persistence in the Choroid and Outer Retina
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Endemic residence is an ecological proxy for exposure to the organism,
      and the organism reaching and persisting in the choroid is this node.
      Graded low because the evidence is geographic clustering of a syndrome
      across states, which is several steps removed from any observation of
      the fungus in ocular tissue, and the syndrome itself is named presumed
      for that reason.
    evidence:
    - reference: PMID:32168355
      reference_title: "Presumed ocular histoplasmosis syndrome in a commercially insured population, United States."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Eleven of the 13 states with the highest POHS rates bordered the Mississippi and Ohio rivers."
      explanation: >-
        Eleven of the thirteen highest-rate states border the Mississippi and
        Ohio rivers. Population-level geography, which ties risk to the
        endemic region without observing the organism.
  presence: PRESENT
  evidence:
  - reference: PMID:32168355
    reference_title: "Presumed ocular histoplasmosis syndrome in a commercially insured population, United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven of the 13 states with the highest POHS rates bordered the Mississippi and Ohio rivers."
    explanation: Geographic clustering along the Mississippi/Ohio river valleys ties POHS risk to Histoplasma-endemic residence.

- name: Immunocompromise
  notes: >-
    Left ontologically unbound deliberately. ECTO's only immunosuppression
    term, ECTO:9001747, is defined as exposure to an immunosuppressive
    agent (RO:0002309 some CHEBI:35705) -- a drug exposure. This entry
    describes immunosuppression as a host state with non-drug causes, so
    that term would assert something the entry's own description rules
    out. No host-immunosuppression-state exposure term exists.
  influences_mechanisms:
  - target: Pathogen Invasion and Persistence in the Choroid and Outer Retina
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Impaired host immunity permits the organism to grow and persist rather
      than causing it to arrive, which is why this is recorded as
      exacerbating. Pointed at pathogen persistence and not at this entry's
      unopposed-immunosuppression node, which is a distinct claim: that node
      models iatrogenic immunosuppression given for a misdiagnosed infection,
      whereas this exposure is host immunocompromise however arising.
    evidence:
    - reference: PMID:38843299
      reference_title: "Clinical characteristics, visual acuity outcomes, and factors associated with loss of vision among patients with active ocular toxoplasmosis: A retrospective study in a Thai tertiary center."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Immunocompromised patients showed a significantly larger size of retinitis than immunocompetent patients."
      explanation: >-
        Immunocompromised patients had significantly larger retinitis than
        immunocompetent patients. Lesion size is a proxy for unrestrained
        organism growth rather than a measure of persistence itself.
  presence: PRESENT
  evidence:
  - reference: PMID:38843299
    reference_title: "Clinical characteristics, visual acuity outcomes, and factors associated with loss of vision among patients with active ocular toxoplasmosis: A retrospective study in a Thai tertiary center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunocompromised patients showed a significantly larger size of retinitis than immunocompetent patients."
    explanation: Impaired host immunity worsens infectious choroiditis, the biological basis of the immunosuppression hazard.

infectious_agent:
- name: Toxoplasma gondii
  description: >-
    An obligate intracellular apicomplexan protozoan, the commonest infectious
    cause of posterior uveitis worldwide. Persists lifelong as encysted
    bradyzoites in retinal tissue, providing the reservoir for recurrent
    retinochoroiditis.
  evidence:
  - reference: PMID:29704469
    reference_title: "Current treatment of ocular toxoplasmosis in immunocompetent patients: a network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular toxoplasmosis (OT) is the most frequent form of infectious posterior uveitis caused by the protozoan parasite Toxoplasma gondii."
    explanation: Identifies T. gondii as the agent of the commonest infectious posterior uveitis.

- name: Treponema pallidum
  description: >-
    The spirochaete of syphilis. Disseminates haematogenously and can involve any
    ocular structure at any disease stage, producing chorioretinitis that mimics
    nearly all other uveitic entities.
  evidence:
  - reference: PMID:33831337
    reference_title: Ocular syphilis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Syphilis is a sexually transmitted, systemic, inflammatory disease caused by the spirochaete, Treponema pallidum."
    explanation: Identifies the causative spirochaete of the syphilitic subtype.

- name: Human herpesviruses and other neurotropic viruses
  description: >-
    Herpesviruses (CMV, HSV, VZV) and other viruses are collectively the
    commonest infectious cause of uveitis in some referral cohorts, producing
    necrotising retinitis with secondary choroidal involvement rather than
    primary choroiditis. Many remain latent with reactivation gated by host
    immunity. Included here because they sit on the infectious side of the
    aetiologic fork and respond to antivirals, not immunosuppression; the
    dedicated ocular entity is curated in Cytomegalovirus_Retinitis.
  evidence:
  - reference: PMID:28012878
    reference_title: Viral posterior uveitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many viruses remain latent in the infected host with a risk of reactivation that depends on various factors, including virulence and host immunity, age, and comorbidities."
    explanation: >-
      Documents latency-plus-reactivation gated by host immunity, the same
      immunosuppression-hazard logic as the toxoplasmosis and tuberculosis arms.
  - reference: PMID:37428299
    reference_title: "The large Hellenic Study of Uveitis: epidemiology, etiologic factors and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herpetic uveitis (HSV-1 and VZV/HZV) was the most common cause of infectious uveitis (14.87%)"
    explanation: Quantifies herpetic infection as the leading infectious uveitis aetiology in a large tertiary cohort.

- name: Mycobacterium tuberculosis
  description: >-
    Causes choroidal tubercles, tuberculoma and serpiginous-like choroiditis.
    Ocular disease may occur without demonstrable active systemic tuberculosis,
    so exclusion depends on immunologic evidence of infection.
  evidence:
  - reference: PMID:33845014
    reference_title: Classification Criteria for Tubercular Uveitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "evidence of tuberculosis, including histologically or microbiologically confirmed infection, positive interferon-γ release assay test, or positive tuberculin skin test"
    explanation: Defines how mycobacterial aetiology is established for tubercular choroiditis.

treatments:
- name: Antiparasitic Therapy for Ocular Toxoplasmosis
  description: >-
    Antimicrobial eradication of the active Toxoplasma focus, historically
    pyrimethamine plus sulfadiazine with corticosteroid ("classic therapy"), with
    trimethoprim-sulfamethoxazole a well-supported alternative in immunocompetent
    patients. Corticosteroid is added only under antiparasitic cover; it must
    never be given alone.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyrimethamine
      term:
        id: CHEBI:8673
        label: pyrimethamine
    - preferred_term: sulfadiazine
      term:
        id: CHEBI:9328
        label: sulfadiazine
  notes: >-
    treatment_term is Pharmacotherapy rather than NCIT:C15620 Antibiotic
    Therapy because Toxoplasma gondii is a protozoan, not a bacterium, and that
    term is defined as treatment of bacterial infections.
  target_mechanisms:
  - target: Pathogen Invasion and Persistence in the Choroid and Outer Retina
    treatment_effect: INHIBITS
    description: Antiparasitic drugs suppress replicating tachyzoites in the retina and choroid.
    evidence:
    - reference: PMID:29704469
      reference_title: "Current treatment of ocular toxoplasmosis in immunocompetent patients: a network meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Based on our network meta-analysis, therapy with TMP-SMX seems to be an alternative treatment of OT in immunocompetent patients."
      explanation: Network meta-analysis supporting antiparasitic therapy directed at the organism.
  evidence:
  - reference: PMID:34370174
    reference_title: "Ocular toxoplasmosis: a review of the current diagnostic and therapeutic approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The current mainstay for the treatment, if necessary, is the use of oral antibiotic with systemic corticosteroids."
    explanation: >-
      Establishes the combined antimicrobial-plus-corticosteroid regimen - the
      infectious arm's version of anti-inflammatory therapy, always paired with
      antimicrobial cover.
  - reference: PMID:29704469
    reference_title: "Current treatment of ocular toxoplasmosis in immunocompetent patients: a network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the combination of pyrimethamine, sulfadiazine, and corticosteroids"
    explanation: Names the conventional antiparasitic-plus-corticosteroid regimen for ocular toxoplasmosis.

- name: Antitubercular Therapy for Tubercular Choroiditis
  description: >-
    Multi-drug antitubercular therapy (ATT) added to corticosteroid in
    serpiginous-like choroiditis with evidence of systemic or latent
    tuberculosis. ATT reduces active inflammation and, critically, eliminates the
    recurrences that immunosuppression alone would not prevent. Trials are
    ongoing on optimal duration.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
  target_mechanisms:
  - target: Unopposed Immunosuppression of Unrecognised Infectious Choroiditis
    treatment_effect: INHIBITS
    description: >-
      Adding antimicrobial cover converts the harmful unopposed-immunosuppression
      scenario into safe combined therapy.
    evidence:
    - reference: PMID:22675097
      reference_title: Tubercular serpiginous-like choroiditis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "patients with serpiginous-like choroiditis and evidence of systemic or latent TB are best treated with antituberculosis treatment (ATT) in addition to the corticosteroid therapy"
      explanation: Directly supports adding ATT to corticosteroid rather than immunosuppressing alone.
  evidence:
  - reference: PMID:22675097
    reference_title: Tubercular serpiginous-like choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of ATT in these patients is likely to reduce active inflammation and eliminate future recurrences."
    explanation: States the dual benefit of antitubercular therapy in serpiginous-like choroiditis.

- name: Penicillin for Ocular Syphilis
  description: >-
    Ocular syphilis is managed as neurosyphilis, with parenteral aqueous
    crystalline penicillin G the drug of choice. Timely treatment is curative;
    delay produces long-term visual impairment. This is the clearest case in
    which the correct diagnosis converts an untreatable-looking uveitis into a
    curable infection.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: benzylpenicillin (penicillin G)
      term:
        id: CHEBI:18208
        label: benzylpenicillin
  target_mechanisms:
  - target: Pathogen Invasion and Persistence in the Choroid and Outer Retina
    treatment_effect: INHIBITS
    description: Penicillin eradicates Treponema pallidum from ocular and CNS compartments.
    evidence:
    - reference: PMID:33831337
      reference_title: Ocular syphilis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Centers for Disease Control and Prevention recommend that ocular syphilis be managed according to its treatment guidelines for neurosyphilis, with parenteral aqueous crystalline penicillin G the drug of choice."
      explanation: Guideline-level support for penicillin G as the eradicating therapy.
  evidence:
  - reference: PMID:33831337
    reference_title: Ocular syphilis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With the timely diagnosis and appropriate treatment, ocular syphilis is curable. However, delayed diagnosis of ocular syphilis may result in long-term visual impairment."
    explanation: Documents curability with timely antibiotic therapy and the cost of delay.

- name: Corticosteroid Therapy
  description: >-
    First-line anti-inflammatory therapy for non-infectious choroiditis, given
    locally or systemically. It is the mainstay of the non-infectious arm and
    remains first-line in ocular sarcoidosis. In the infectious arm it is
    permissible only in combination with antimicrobial therapy; given alone to an
    unrecognised infectious choroiditis it removes immune restraint on the
    organism. Up to 30% of sarcoidosis patients require high doses, which is what
    drives the move to steroid-sparing agents.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Choroidal Inflammatory Cell Infiltration
    treatment_effect: INHIBITS
    description: Corticosteroid suppresses the choroidal inflammatory infiltrate.
    evidence:
    - reference: PMID:37176633
      reference_title: "Sarcoidosis-Related Uveitis: A Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Corticosteroids remain the first-line treatment for sarcoidosis, but up to 30% of patients require high doses, justifying the use of corticosteroid-sparing treatments."
      explanation: Establishes corticosteroid as first-line anti-inflammatory therapy and its dose-limiting problem.
  notes: >-
    Safety caveat central to this entry - corticosteroid monotherapy is
    contraindicated until infectious causes (toxoplasmosis, tuberculosis,
    syphilis) have been excluded or are being concurrently treated.
  evidence:
  - reference: PMID:36013011
    reference_title: "Birdshot Chorioretinopathy: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Local and systemic corticosteroids can be used for short periods, but immunosuppressive or biological therapies are usually needed for the long-term management of the disease."
    explanation: Positions corticosteroid as short-term therapy in birdshot, with immunosuppression for maintenance.
  - reference: PMID:22675097
    reference_title: Tubercular serpiginous-like choroiditis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Choroidal tuberculosis (TB) infection may present itself as a diffuse choroiditis that resembles serpiginous choroiditis, usually treated with immunossupressants."
    explanation: >-
      Supports the safety caveat by documenting a TB choroiditis that phenocopies
      an entity conventionally treated with immunosuppression. Marked PARTIAL
      because the source states the misclassification risk rather than measuring
      corticosteroid harm directly.

- name: Immunosuppressive and Biologic Therapy
  description: >-
    Corticosteroid-sparing immunomodulation - methotrexate, mycophenolate
    mofetil, and anti-TNF biologics - for chronic non-infectious choroiditis,
    especially birdshot chorioretinopathy, serpiginous choroiditis, MFCPU and
    sarcoid uveitis. This is the arm of the treatment fork that is actively
    dangerous if the aetiology is in fact infectious and untreated. Spans two
    platforms (small-molecule antimetabolites and monoclonal-antibody
    biologics), hence therapeutic_modality OTHER.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Immunosuppressive Therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
  target_mechanisms:
  - target: Autoimmune Recognition of Ocular Self-Antigen
    treatment_effect: INHIBITS
    description: >-
      Immunomodulatory therapy suppresses the autoreactive T-cell response
      driving non-infectious choroiditis.
    evidence:
    - reference: PMID:37176633
      reference_title: "Sarcoidosis-Related Uveitis: A Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "immunosuppressive treatments such as methotrexate may be introduced. More recent biotherapies such as anti-TNF are also very effective (as they are in other non-infectious uveitis etiologies)"
      explanation: Supports methotrexate and anti-TNF for non-infectious uveitis broadly.
  evidence:
  - reference: PMID:36013011
    reference_title: "Birdshot Chorioretinopathy: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "immunosuppressive or biological therapies are usually needed for the long-term management of the disease"
    explanation: Documents long-term immunomodulation as standard in birdshot chorioretinopathy.
  - reference: PMID:15850812
    reference_title: Serpiginous choroiditis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment with immunosuppressive and alkylating agents have shown possible efficacy in small case series"
    explanation: >-
      Supports immunosuppression in serpiginous choroiditis, marked PARTIAL
      because the evidence base is small uncontrolled case series.

- name: Anti-VEGF Therapy for Inflammatory Choroidal Neovascularization
  description: >-
    Intravitreal anti-VEGF injection for inflammatory choroidal neovascular
    membranes, with or without concomitant anti-inflammatory therapy. In POHS and
    PIC, where CNV rather than inflammation dominates vision loss, this is the
    principal sight-preserving intervention.
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anti-VEGF agent
      term:
        id: NCIT:C1742
        label: Angiogenesis Inhibitor
  target_mechanisms:
  - target: Inflammatory Choroidal Neovascularization
    treatment_effect: INHIBITS
    description: VEGF blockade causes regression of the inflammatory neovascular membrane.
    evidence:
    - reference: PMID:30209691
      reference_title: "An update on inflammatory choroidal neovascularization: epidemiology, multimodal imaging, and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Management of these neovascular membranes consists of anti-vascular growth factor agents, with or without concomitant anti-inflammatory and/or corticosteroid therapy."
      explanation: Establishes anti-VEGF as the management of inflammatory CNV.
  evidence:
  - reference: PMID:25841248
    reference_title: Ocular histoplasmosis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subfoveal and juxtafoveal CNVs are managed with anti-vascular endothelial growth factor therapy, photodynamic therapy, or a combination of both."
    explanation: Documents anti-VEGF as standard management of CNV in POHS.

- name: Laser Photocoagulation for Extrafoveal Choroidal Neovascularization
  description: >-
    Thermal laser ablation of extrafoveal inflammatory choroidal neovascular
    membranes, where the membrane is far enough from the fovea that the resulting
    scotoma is acceptable. Largely superseded by anti-VEGF for subfoveal and
    juxtafoveal lesions.
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Laser Therapy
    term:
      id: NCIT:C15466
      label: Laser Therapy
  target_mechanisms:
  - target: Inflammatory Choroidal Neovascularization
    treatment_effect: INHIBITS
    description: Photocoagulation ablates the extrafoveal neovascular membrane.
    evidence:
    - reference: PMID:25841248
      reference_title: Ocular histoplasmosis syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Extrafoveal CNVs are successfully treated with laser photocoagulation."
      explanation: Supports laser photocoagulation for extrafoveal CNV.
  evidence:
  - reference: PMID:25841248
    reference_title: Ocular histoplasmosis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extrafoveal CNVs are successfully treated with laser photocoagulation."
    explanation: Documents laser photocoagulation as effective for extrafoveal neovascular membranes.

differential_diagnoses:
- name: Intraocular (vitreoretinal) lymphoma
  description: >-
    The most important masquerade syndrome of choroiditis. Lymphoma produces
    sub-RPE nodular deposits with autofluorescence and fluorescein angiographic
    findings closely resembling multifocal choroiditis, and it may transiently
    respond to corticosteroid, further delaying diagnosis.
  distinguishing_features:
  - Older patients, typically over 50 years
  - Sub-RPE nodular elevations approximately 100 microns in diameter
  - Frequent CNS involvement
  - Vitreous or chorioretinal biopsy with cytology, IL-10/IL-6 ratio and MYD88 testing
  - Corticosteroid response is transient and incomplete
  disease_term:
    preferred_term: intraocular lymphoma
    term:
      id: MONDO:0004351
      label: intraocular lymphoma
  evidence:
  - reference: PMID:27994812
    reference_title: Idiopathic Multifocal Choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "causes subretinal pigment epithelium (sub-RPE) nodular elevations about 100 μm in diameter which demostrate autofluorescence and fluorescein angiographic findings similar to those seen in MFC"
    explanation: >-
      Documents the imaging overlap between vitreoretinal lymphoma and multifocal
      choroiditis. (The spelling "demostrate" is as printed in the source.)

- name: Vogt-Koyanagi-Harada disease
  description: >-
    A bilateral granulomatous panuveitis with diffuse choroidal inflammation,
    exudative retinal detachment and extraocular (auditory, meningeal,
    integumentary) features. Curated as its own dismech entry; listed here as the
    principal non-infectious granulomatous mimic of diffuse choroiditis.
  distinguishing_features:
  - Exudative/serous retinal detachments with diffuse choroidal thickening on EDI-OCT
  - Extraocular features (tinnitus, headache, meningismus, poliosis, vitiligo, alopecia)
  - Predilection for pigmented ethnicities
  - No antecedent ocular trauma, which would instead suggest sympathetic ophthalmia
  disease_term:
    preferred_term: Vogt-Koyanagi-Harada disease
    term:
      id: MONDO:0018092
      label: Vogt-Koyanagi-Harada disease
  evidence:
  - reference: PMID:34145419
    reference_title: "Precise, simplified diagnostic criteria and optimised management of initial-onset Vogt-Koyanagi-Harada disease: an updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vogt-Koyanagi-Harada (VKH) disease is a primary autoimmune stromal choroiditis."
    explanation: >-
      Establishes VKH as itself a form of choroiditis - a stromal rather than
      choriocapillaris-based one - which is exactly why it must be
      distinguished from the entities modelled here.
  - reference: PMID:34145419
    reference_title: "Precise, simplified diagnostic criteria and optimised management of initial-onset Vogt-Koyanagi-Harada disease: an updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the sine qua non presence of diffuse choroiditis, detected with indocyanine green angiography (ICGA) and/or Enhanced Depth Imaging OCT (EDI-OCT)"
    explanation: >-
      Supports the distinguishing feature - diffuse choroidal involvement on
      ICGA/EDI-OCT - separating VKH from the focal/multifocal lesions of the
      white-dot entities.

- name: Ocular tuberculosis
  description: >-
    Tubercular choroiditis is curated as a subtype of this entry, but it is
    simultaneously the standing differential for every non-infectious
    granulomatous choroiditis, above all ocular sarcoidosis and idiopathic
    serpiginous choroiditis, because misclassification leads to harmful
    unopposed immunosuppression.
  distinguishing_features:
  - Positive interferon-gamma release assay or tuberculin skin test
  - Residence in or travel to a tuberculosis-endemic area
  - Choroidal tubercle or tuberculoma
  - Occlusive retinal vasculitis
  - Response to antitubercular therapy
  disease_term:
    preferred_term: ocular tuberculosis
    term:
      id: MONDO:0006876
      label: ocular tuberculosis
  evidence:
  - reference: PMID:37176633
    reference_title: "Sarcoidosis-Related Uveitis: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tuberculosis is a classic differential diagnosis to be wary of, especially in people who have spent time in endemic areas."
    explanation: Names tuberculosis as the classic differential for sarcoid uveitis.

- name: Ocular syphilis
  description: >-
    Syphilitic chorioretinitis is curated as a subtype here, but ocular syphilis
    is also the universal differential: it can imitate essentially any ocular
    inflammatory presentation, and serologic exclusion is mandatory before
    immunosuppression.
  distinguishing_features:
  - Positive treponemal serology using the CDC reverse screening algorithm
  - Acute syphilitic posterior placoid chorioretinitis morphology with leopard-spot hypofluorescence
  - Frequent HIV co-infection and neurosyphilis
  - Rapid resolution on penicillin
  disease_term:
    preferred_term: syphilis
    term:
      id: MONDO:0005976
      label: syphilis
  notes: >-
    No MONDO term for ocular syphilis exists at time of curation, so the parent
    term syphilis is bound rather than a stage-specific term - ocular
    involvement can occur at any stage, so binding to secondary syphilis would
    contradict this entry's own cited evidence.
  evidence:
  - reference: PMID:33831337
    reference_title: Ocular syphilis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ocular syphilis should always be a part of the differential diagnosis of most, if not all, ocular infectious and inflammatory presentations"
    explanation: Directly states the universal differential status of ocular syphilis.

- name: Sarcoidosis
  description: >-
    Systemic granulomatous disease involving the eye in a large minority of
    cases, sometimes without systemic involvement. The systemic mechanism is
    curated in the dismech Sarcoidosis and Neurosarcoidosis entries; the ocular
    arm is a subtype here.
  distinguishing_features:
  - Granulomatous anterior uveitis with mutton-fat keratic precipitates and synechiae
  - Bilateral hilar lymphadenopathy on chest imaging
  - Raised serum angiotensin-converting enzyme
  - Non-caseating epithelioid granulomas on biopsy
  disease_term:
    preferred_term: sarcoidosis
    term:
      id: MONDO:0019338
      label: sarcoidosis
  evidence:
  - reference: PMID:37176633
    reference_title: "Sarcoidosis-Related Uveitis: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sarcoidosis is an inflammatory disease that involves the eyes in 10-55% of cases, sometimes without systemic involvement."
    explanation: Quantifies ocular involvement in sarcoidosis and notes it may be isolated.

- name: Behcet disease
  description: >-
    Systemic vasculitis producing occlusive retinal vasculitis and panuveitis.
    Curated as its own dismech entry; listed here because its posterior-segment
    inflammation overlaps with choroiditis and it is a recognised non-infectious
    uveitis aetiology in large cohorts.
  distinguishing_features:
  - Recurrent oral and genital aphthous ulceration, skin lesions, pathergy
  - Explosive occlusive retinal vasculitis with retinal haemorrhage rather than primary choroidal lesions
  - HLA-B51 association
  - Silk Road geographic distribution
  disease_term:
    preferred_term: Behcet disease
    term:
      id: MONDO:0007191
      label: Behcet disease
  evidence:
  - reference: PMID:37428299
    reference_title: "The large Hellenic Study of Uveitis: epidemiology, etiologic factors and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent causes of non-infectious uveitis included sarcoidosis, white dot syndromes, ankylosing spondylitis, lens-induced uveitis, Adamantiades-Behçet disease, and idiopathic juvenile arthritis."
    explanation: Places Behcet disease among the leading non-infectious uveitis aetiologies to be distinguished.

- name: Cytomegalovirus retinitis
  description: >-
    Viral necrotising retinitis of the profoundly immunocompromised, curated as
    its own dismech entry. A key infectious differential in any patient with
    posterior-segment inflammation and low CD4 count.
  distinguishing_features:
  - Severe immunosuppression, typically CD4 below 50 cells per microlitre
  - Granular retinitis with haemorrhage along the vascular arcades
  - Minimal vitritis
  - Aqueous PCR positive for cytomegalovirus
  - Responds to antivirals, not to immunosuppression
  disease_term:
    preferred_term: cytomegalovirus retinitis
    term:
      id: MONDO:0000878
      label: cytomegalovirus retinitis
  evidence:
  - reference: PMID:28012878
    reference_title: Viral posterior uveitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "others, such as cytomegalovirus retinitis or acute retinal necrosis, may result in serious complications and profound vision loss"
    explanation: >-
      Identifies CMV retinitis specifically as a sight-threatening viral
      posterior uveitis requiring differentiation.
  - reference: PMID:28012878
    reference_title: Viral posterior uveitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since some of these infections may respond well to antiviral therapy, it is important to work up all cases of posterior uveitis to rule out an infectious etiology."
    explanation: >-
      Supports the management consequence of the distinction - antiviral therapy
      rather than immunosuppression.


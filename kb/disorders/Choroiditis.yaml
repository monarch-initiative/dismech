  rate_per_100000: 13.0
  notes: >-
    Claims-based diagnosis-code prevalence among more than 50 million MarketScan
    enrollees. Geographically concentrated in the Mississippi and Ohio river
    valleys.
  evidence:
  - reference: PMID:32168355
    reference_title: "Presumed ocular histoplasmosis syndrome in a commercially insured population, United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among >50 million total MarketScan enrollees, 6,678 (13 per 100,000) had a POHS diagnosis code."
    explanation: Directly reports POHS prevalence as 13 per 100,000 insured enrollees.

epidemiology:
- name: Infectious versus non-infectious share of uveitis
  description: >-
    In a 30-year Greek tertiary referral cohort of 6,191 uveitis cases, 1,925
    were infectious and 4,125 non-infectious, with 141 masquerade syndromes.
    Both arms of the aetiologic fork are therefore numerically substantial in
    referral practice, and masquerades are a small but non-trivial third
    category.
  evidence:
  - reference: PMID:37428299
    reference_title: "The large Hellenic Study of Uveitis: epidemiology, etiologic factors and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Out of 6191 cases with uveitis, 1925 were infectious, 4125 were non-infectious, and an overall of 141 masquerade syndromes were recorded."
    explanation: Quantifies the aetiologic composition of a large tertiary uveitis cohort.

- name: Leading infectious causes in a tertiary uveitis cohort
  description: >-
    Herpetic uveitis was the commonest infectious cause (14.87% of all cases),
    followed by toxoplasmosis (6.6%) and tuberculosis (2.74%). Note this is a
    case-mix fraction within a referral cohort, not a population rate, and is
    strongly geography-dependent.
  evidence:
  - reference: PMID:37428299
    reference_title: "The large Hellenic Study of Uveitis: epidemiology, etiologic factors and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herpetic uveitis (HSV-1 and VZV/HZV) was the most common cause of infectious uveitis (14.87%), followed by toxoplasmosis (6.6%) and tuberculosis (2.74%)."
    explanation: Quantifies the relative contribution of infectious aetiologies in a tertiary cohort.

- name: Geographic variation in infectious share
  description: >-
    Infectious causes account for 30-60% of uveitis in developing countries,
    while non-infectious uveitis predominates in the developed world - though
    tuberculosis and syphilis have been increasing in developed countries. The
    prior probability on the aetiologic fork therefore depends heavily on where
    the patient is seen.
  evidence:
  - reference: PMID:27467180
    reference_title: A Focus on the Epidemiology of Uveitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infectious causes are common (30-60%) in the developing countries."
    explanation: Quantifies the infectious share of uveitis in developing countries.
  - reference: PMID:27467180
    reference_title: A Focus on the Epidemiology of Uveitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-infectious uveitic conditions are generally more common in the developed world."
    explanation: Documents the complementary predominance of non-infectious uveitis in the developed world.
  - reference: PMID:27467180
    reference_title: A Focus on the Epidemiology of Uveitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An increase in the prevalence of infectious etiologies, including tuberculosis and syphilis, has been seen in developed countries."
    explanation: Supports the caveat that the two key immunosuppression-hazard infections are rising in developed settings.

progression:
- phase: Acute active choroiditis
  notes: >-
    Active inflammatory lesions with overlying vitritis and, depending on
    aetiology, retinal necrosis or placoid outer-retinal whitening. Symptoms
    include blurred vision, floaters, photopsia and scotoma.
  evidence:
  - reference: PMID:27994812
    reference_title: Idiopathic Multifocal Choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients may complain of a temporal scotoma, metamorphopsia, floaters, photopsias, photophobia, and decreased vision"
    explanation: Describes the symptom complex of active choroiditis.

- phase: Healed atrophic and scarred phase
  notes: >-
    Resolution of active inflammation leaves punched-out atrophic chorioretinal
    lesions and pigmented fibrotic scars, with permanent corresponding field
    defects. In toxoplasmosis the scar border is the site of future reactivation.
  evidence:
  - reference: PMID:27994812
    reference_title: Idiopathic Multifocal Choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "circumscribed areas of chorioretinal atrophy and subretinal pigmented fibrotic scars"
    explanation: Describes the healed structural end-state.

- phase: Chronic recurrent and complication phase
  notes: >-
    Many entities are chronically recurrent, with cumulative lesion accrual and
    the late development of choroidal neovascularization, macular edema,
    cataract, epiretinal membrane and progressive chorioretinal atrophy.
    Recurrence rather than the index episode governs long-term visual outcome.
  evidence:
  - reference: PMID:27994812
    reference_title: Idiopathic Multifocal Choroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rate of increase in the size and number of lesions and development of new or recurrent CME and/or CNV is also high despite the relative absence of anterior uveitis or vitritis."
    explanation: Documents ongoing lesion accrual and complication development in the chronic phase.
  - reference: PMID:38843299
    reference_title: "Clinical characteristics, visual acuity outcomes, and factors associated with loss of vision among patients with active ocular toxoplasmosis: A retrospective study in a Thai tertiary center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cumulative incidence of recurrent OT at three years was 33.9%"
    explanation: Quantifies recurrence risk over three years in ocular toxoplasmosis.

clinical_burden:
  burden_level: HIGH
  rationale: >-
    Choroiditis is a leading cause of irreversible vision loss from posterior
    uveitis. Photoreceptor and RPE loss is permanent, one-fifth of eyes in a
    treated ocular toxoplasmosis cohort ended with acuity of 20/200 or worse, and
    recurrent disease plus choroidal neovascularization accrue further deficit
    over decades. Many patients require indefinite immunosuppression with its own
    morbidity, and the disease typically affects working-age adults.
  evidence:
  - reference: PMID:38843299
    reference_title: "Clinical characteristics, visual acuity outcomes, and factors associated with loss of vision among patients with active ocular toxoplasmosis: A retrospective study in a Thai tertiary center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the final visit, 21% of all affected eyes suffered VA ≤ 20/200."
    explanation: Quantifies severe residual visual impairment after treated disease.

clinical_trials:
- name: NCT06613919
  phase: PHASE_IV
  status: COMPLETED
  description: >-
    Randomised non-inferiority trial comparing 6 versus 9 months of antitubercular
    therapy for tubercular posterior uveitis and choroiditis. Directly addresses
    the treatment-duration question in the infectious arm of the aetiologic fork.
  target_phenotypes:
  - preferred_term: Posterior uveitis
    term:
      id: HP:0012123
      label: Posterior uveitis
  evidence:
  - reference: clinicaltrials:NCT06613919
    reference_title: Prospective Randomised Trial for 6-Months Versus 9-Months Anti-TB Therapy for Tubercular Posterior Uveitis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The goal of this clinical trial is to learn if 6-months anti-TB therapy is not worse than 9-months therapy for the treatment of tubercular posterior uveitis."
    explanation: Confirms the trial tests antitubercular therapy duration in tubercular posterior uveitis.

- name: NCT01449877
  phase: PHASE_III
  status: COMPLETED
  description: >-
    Randomised double-masked trial of trimethoprim-sulfamethoxazole prophylaxis
    versus placebo after acute treatment of Toxoplasma retinochoroiditis, with
    recurrence over long-term follow-up as the primary outcome. Tests whether
    continued antimicrobial suppression prevents cyst reactivation.
  target_phenotypes:
  - preferred_term: Chorioretinal scar
    term:
      id: HP:0007777
      label: Chorioretinal scar
  evidence:
  - reference: clinicaltrials:NCT01449877
    reference_title: Influence of Trimethoprim-sulfamethoxazole for the Recurrence of Retinochoroiditis Toxoplasma Gondii
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The investigators study aims to determine the effect of prophylactic therapy with Trimethoprim-sulfamethoxazole on the recurrences of toxoplasma retinochoroiditis gondii."
    explanation: Confirms the trial tests antimicrobial prophylaxis against recurrence of ocular toxoplasmosis.

notes: >-
  Boundary handling against existing dismech entries. This entry is deliberately
  scoped to the ocular/choroidal arm and cross-references rather than duplicates
  systemic disease mechanisms curated elsewhere: Sarcoidosis and Neurosarcoidosis
  (systemic granulomatous mechanism), Tuberculosis (systemic mycobacterial
  mechanism), Behcets_Disease, Vogt-Koyanagi-Harada_Disease, Panuveitis (the
  anatomic-class sibling covering all-uveal-layer involvement), and
  Cytomegalovirus_Retinitis. No standalone ocular toxoplasmosis, ocular syphilis,
  histoplasmosis, birdshot, serpiginous, MFC or PIC entry existed in
  kb/disorders/ at time of curation, so those are modelled here as subtypes.
  Choroiditis is distinct from choroideremia (an X-linked chorioretinal
  degeneration) and from choroid plexus disease; MONDO:0001280 is anchored to
  UBERON:0001776 optic choroid.

  Ontology gaps encountered: MONDO has no term for ocular syphilis or for ocular
  sarcoidosis, so the syphilis differential is bound to the parent
  MONDO:0005976 syphilis and the sarcoid choroiditis subtype carries no
  subtype_term. (The choriocapillaris is covered by UBERON:0005336 capillary
  layer of choroid, whose "choriocapillaris" is a RELATED synonym - findable by
  synonym search, not by label search.)

  Open nosological question for a human curator: MONDO:0001280 carries
  subset: disease_grouping and subset: ordo_group_of_disorders, and this entry
  is explicitly modelled as an umbrella over ten aetiologically heterogeneous
  entities. It may belong in kb/groupings/ as a Grouping rather than as a
  Disease. It is curated here as a Disease because the entry's substantive
  content is the shared downstream mechanism (choriocapillaris hypoperfusion →
  outer-retinal/RPE damage → scarring → inflammatory CNV) plus the
  infectious/non-infectious management fork, which is genuine pathophysiology
  rather than a taxonomy. Flagging for review rather than deciding unilaterally.


  - preferred_term: Bruch's membrane
    term:
      id: UBERON:0003957
      label: Bruch's membrane
  downstream:
  - target: Outer Retinal and Retinal Pigment Epithelial Damage
    description: Granulomatous destruction of the outer retinal/RPE complex.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37176633
    reference_title: "Sarcoidosis-Related Uveitis: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is based on histology with the presence of non-caseating epithelioid granulomas."
    explanation: Defines the sarcoid granuloma as the histologic substrate.
  - reference: PMID:37176633
    reference_title: "Sarcoidosis-Related Uveitis: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tuberculosis is a classic differential diagnosis to be wary of, especially in people who have spent time in endemic areas."
    explanation: >-
      Confirms that infectious (TB) and sterile (sarcoid) granulomatous
      choroiditis are not separable on morphology alone.
  - reference: PMID:35647958
    reference_title: "Sympathetic ophthalmia: A comprehensive update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It manifests as acute/chronic granulomatous uveitis with yellowish-white choroidal lesions or Dalen-Fuchs nodules."
    explanation: Documents Dalen-Fuchs nodules as the granulomatous choroidal lesion of sympathetic ophthalmia.

- name: Choriocapillaris Hypoperfusion and Non-Perfusion
  biological_scale: TISSUE
  role: central_effector
  description: >-
    The shared final common pathway of several white-dot entities. Inflammation
    of the choriocapillaris and its precapillary supply produces hypo- or
    non-perfusion of choroidal lobules, which is the defining clinicopathological
    mechanism of the primary inflammatory choriocapillaropathies. The calibre of
    vessel affected grades disease severity: involvement of only terminal
    choriocapillaries gives the benign end of the spectrum (MEWDS), whereas
    involvement of larger choriocapillaris or precapillary vessels gives the
    severe forms - APMPPE, idiopathic multifocal choroiditis and serpiginous
    choroiditis. Because the choriocapillaris is the sole blood supply of the
    outer retina and RPE, its non-perfusion is directly ischaemic to the
    photoreceptor/RPE complex, and it is imaged as patchy lobular
    hypofluorescence on indocyanine green angiography.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: cellular response to hypoxia
    modifier: INCREASED
    term:
      id: GO:0071456
      label: cellular response to hypoxia
  locations:
  - preferred_term: choriocapillaris
    term:
      id: UBERON:0005336
      label: capillary layer of choroid
  downstream:
  - target: Outer Retinal and Retinal Pigment Epithelial Damage
    description: >-
      Loss of the sole vascular supply of the outer retina causes ischaemic
      photoreceptor and RPE injury.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15850812
      reference_title: Serpiginous choroiditis.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The histological findings of the lesions are atrophy of the choriocapillaris, retinal pigment epithelium and photoreceptor cells"
      explanation: >-
        Shows choriocapillaris atrophy co-localising with RPE and photoreceptor
        atrophy in the same lesion. Marked PARTIAL because the histology
        establishes co-occurrence rather than proving the direction of causation.
  - target: Inflammatory Choroidal Neovascularization
    description: >-
      Inflammation-driven hypoperfusion generates a retinal-choroidal hypoxia
      gradient that promotes neovascularization.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38541191
      reference_title: Diagnostic Challenges in Inflammatory Choroidal Neovascularization.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Inflammation itself can compromise perfusion, generating a gradient of retinal-choroidal hypoxia that additionally promotes the formation of choroidal neovascularization in the course of uveitis."
      explanation: States the perfusion-to-hypoxia-to-neovascularization causal chain explicitly.
  evidence:
  - reference: PMID:35208488
    reference_title: "Diagnosis and Treatment of Primary Inflammatory Choriocapillaropathies (PICCPs): A Comprehensive Overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PICCPs are resulting from one common clinicopathological mechanism, inflammatory choriocapillaris hypo- or non-perfusion."
    explanation: States choriocapillaris non-perfusion as the single shared mechanism of this disease group.
  - reference: PMID:35208488

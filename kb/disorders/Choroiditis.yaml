- name: Choroidal Inflammatory Cell Infiltration
  biological_scale: TISSUE
  role: central_effector
  description: >-
    The convergence node of both aetiologic arms. Leukocytes - lymphocytes,
    macrophages and, in granulomatous forms, epithelioid and giant cells - are
    recruited across the choroidal vasculature into the choroidal stroma, with
    spillover into the vitreous (vitritis) and retinal vessels (retinal
    vasculitis). Histologically, serpiginous lesions show moderate diffuse
    lymphocytic infiltrates throughout the choroid. Because both an infectious
    and an autoimmune trigger produce a broadly similar infiltrate, the pattern
    of inflammation narrows but does not settle aetiology - some morphologies
    are informative (caseation favours tuberculosis; a serpiginous-like or
    tuberculoma pattern is a SUN criterion for tubercular uveitis) but
    microbiologic and serologic confirmation is what actually decides treatment.
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: T cell

- name: Outer Retinal and Retinal Pigment Epithelial Damage
  biological_scale: TISSUE
  role: effector
  description: >-
    The route from choroidal inflammation to actual vision loss. Because the
    choroid supplies the avascular outer retina, choroidal inflammation and
    choriocapillaris non-perfusion injure the photoreceptor/RPE complex rather
    than the choroid alone. Histology of serpiginous lesions shows atrophy of the
    choriocapillaris, RPE and photoreceptor cells together, and on OCT active
    lesions show disruption of the ellipsoid zone and RPE. Photoreceptor loss is
    irreversible, which is why choroiditis causes permanent scotomata and why the
    therapeutic goal is preventing new lesions rather than recovering old ones.
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  - preferred_term: retinal pigment epithelial cell
    term:

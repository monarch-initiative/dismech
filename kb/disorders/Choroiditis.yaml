    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ICGA shows the typical pattern of patchy lobular hypofluorescence reflecting hypo- or non-perfusion of the choriocapillaris"
    explanation: Links the mechanism to its imaging signature on indocyanine green angiography.
  - reference: PMID:35208488
    reference_title: "Diagnosis and Treatment of Primary Inflammatory Choriocapillaropathies (PICCPs): A Comprehensive Overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Choriocapillaris non-perfusion can affect the end-choriocappilaries, at the benign end of the PICCP spectrum (MEWDS), to larger choriocapillaris vessels or precapillary vessels at the origin of more severe forms such as acute posterior multifocal placoid pigment epitheliopathy (APMPPE), idiopathic multifocal choroiditis (MFC) and Serpiginous Choroiditis (SC)."

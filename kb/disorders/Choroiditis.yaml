- name: Chorioretinal Scarring and Bruch Membrane Disruption
  biological_scale: TISSUE
  role: consequence
  description: >-
    Healed choroiditis lesions become punched-out atrophic, often pigmented,
    chorioretinal scars with disruption of the RPE-Bruch's membrane complex. The
    scar is not inert: a breached RPE-Bruch's membrane barrier is the anatomical
    precondition for ingrowth of new choroidal vessels into the subretinal space,
    and in ocular toxoplasmosis the scar border is the reservoir from which
    recurrent disease arises. Scars are therefore simultaneously the record of
    past disease and the substrate of future sight-threatening complications.
  locations:
  - preferred_term: Bruch's membrane
    term:
      id: UBERON:0003957
      label: Bruch's membrane
  - preferred_term: retinal pigment epithelium
    term:
      id: UBERON:0001782
      label: pigmented layer of retina
  downstream:

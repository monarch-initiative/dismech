      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Inflammatory CNV develops when inflammation or infection directly involves the retinal pigment epithelium (RPE)-Bruch's membrane complex."
      explanation: Identifies RPE-Bruch's membrane disruption as the precondition for inflammatory CNV.

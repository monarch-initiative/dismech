    term:
      id: UBERON:0001776
      label: optic choroid
  downstream:
  - target: Granulomatous Choroidal Inflammation
    description: >-
      In sarcoidosis, tuberculosis and sympathetic ophthalmia the infiltrate
      organises into granulomas.
    causal_link_type: DIRECT
  - target: Choriocapillaris Hypoperfusion and Non-Perfusion
    description: >-
      Inflammation of and around the choriocapillaris obstructs its lobular
      perfusion.
    causal_link_type: DIRECT
    evidence:

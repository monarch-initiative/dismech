has_subtypes:
- name: Sporadic MMND
  display_name: Sporadic Madras motor neuron disease
  description: >-
    The classic, predominantly sporadic form: young-onset limb wasting and weakness,
    multiple lower cranial nerve palsies and sensorineural hearing loss, with a
    comparatively benign course.
- name: MMNDV
  display_name: Madras motor neuron disease variant (MMNDV)
  description: >-
    A clinical variant in which optic atrophy is an invariable feature and cerebellar
    involvement may occur, with a younger age at onset and more consistent bulbar palsy
    than classic MMND.
- name: FMMND
  display_name: Familial Madras motor neuron disease (FMMND)
  description: >-
    A recognized familial form of MMND sharing the core phenotype but with a positive
    family history.
pathophysiology:
- name: Unknown Etiology with Negative Riboflavin-Transporter and C9ORF72 Genetics
  description: >-
    The primary cause of MMND remains unidentified. Sequencing of the riboflavin
    transporter genes SLC52A1, SLC52A2, and SLC52A3 (causative of phenotypically
    overlapping riboflavin transporter deficiency / Brown-Vialetto-Van Laere syndrome)
    and screening for C9ORF72 repeat expansions have been negative in familial and
    sporadic MMND cohorts, indicating a distinct genetic and/or environmental upstream
    insult targeting selective motor, auditory, and (in MMNDV) optic and cerebellar
    pathways.
  evidence:
  - reference: PMID:24139842
    reference_title: "Madras motor neuron disease (MMND) is distinct from the riboflavin transporter genetic defects that cause Brown-Vialetto-Van Laere syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced the SLC52A1, SLC52A2 and SLC52A3 in affected probands and sporadic individuals from the MMND series as well as the C9ORF72 expansion. No genetic defects were identified and the C9ORF72 repeats were all less than 10."
    explanation: >-
      Riboflavin transporter genes and C9ORF72 were assessed and found negative in MMND,
      supporting an as-yet-unidentified upstream etiology.
  - reference: PMID:24139842
    reference_title: "Madras motor neuron disease (MMND) is distinct from the riboflavin transporter genetic defects that cause Brown-Vialetto-Van Laere syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these diseases are likely to share a common defective biological pathway that may be a combination of genetic and environmental factors"
    explanation: >-
      Supports a hypothesized upstream pathway defect arising from combined genetic and
      environmental factors.
  downstream:
  - target: Lower Motor Neuron and Anterior Horn Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Unidentified upstream etiologic factors trigger selective vulnerability and loss of spinal anterior horn motor neurons.
  - target: Multiple Lower Cranial Nerve (Bulbar) Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Unidentified upstream etiologic factors trigger degeneration of brainstem seventh and ninth-to-twelfth cranial nerve motor nuclei.
  - target: Corticospinal Pyramidal Tract Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Unidentified upstream etiologic factors produce upper motor neuron / pyramidal tract dysfunction alongside anterior horn involvement.
  - target: Auditory Neuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Unidentified upstream etiologic factors cause selective retrocochlear / spiral ganglion auditory neural dysfunction across MMND.
  - target: Optic Nerve Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: In the MMNDV clinical variant, unidentified upstream etiologic factors additionally cause bilateral optic nerve degeneration.
  - target: Variant Cerebellar Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: In a subset of MMNDV patients, unidentified upstream etiologic factors additionally cause cerebellar pathway dysfunction.
- name: Lower Motor Neuron and Anterior Horn Degeneration
  biological_scale: CELLULAR
  description: >-
    The core spinal lesion of MMND is degeneration of lower motor neurons in the ventral
    (anterior) horn of the spinal cord, producing neurogenic wasting and weakness of the
    limbs (predominantly distal) with juvenile or young-adult onset.
  cell_types:
  - preferred_term: lower motor neuron
    term:
      id: CL:0008039
      label: lower motor neuron
  locations:
  - preferred_term: ventral horn of spinal cord
    term:
      id: UBERON:0002257
      label: ventral horn of spinal cord
  notes: >-
    No cell-death biological_processes term is bound because published MMND autopsy
    histopathology is scarce and the specific cellular mode of anterior horn neuron death
    remains unknown.
  evidence:
  - reference: PMID:18261745
    reference_title: "Madras motor neuron disease (MMND): clinical description and survival pattern of 116 patients from Southern India seen over 36 years (1971-2007)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The characteristic features are onset in young, weakness and wasting of limbs, multiple lower cranial nerve palsies and sensorineural hearing loss."
    explanation: >-
      A 116-patient series defines MMND by young-onset limb wasting and weakness, the
      clinical correlate of spinal lower-motor-neuron degeneration.
  - reference: PMID:24139842
    reference_title: "Madras motor neuron disease (MMND) is distinct from the riboflavin transporter genetic defects that cause Brown-Vialetto-Van Laere syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 10 patients had the classical features of MMND/MMNDV with progressive hearing impairment associated with progressive involvement of bulbar nuclei (7th and 9th to 10th) including severe muscle weakness and wasting due to anterior horn cell involvement, with pyramidal dysfunction."
    explanation: >-
      Explicitly attributes severe limb muscle weakness and wasting in MMND/MMNDV to
      spinal anterior horn cell involvement.
  downstream:
  - target: Lower motor neuron involvement
    causal_link_type: DIRECT
    description: Anterior horn motor neuron loss manifests directly as clinical lower motor neuron signs.
  - target: Limb muscle weakness
    causal_link_type: DIRECT
    description: Loss of spinal alpha motor neuron innervation causes progressive distal-predominant limb muscle weakness.
  - target: Limb muscle atrophy
    causal_link_type: DIRECT
    description: Denervation of skeletal muscle fibers following anterior horn cell loss causes neurogenic limb muscle wasting.
- name: Multiple Lower Cranial Nerve (Bulbar) Involvement
  biological_scale: CELLULAR
  description: >-
    MMND characteristically involves lower motor neurons of multiple brainstem cranial
    nerve nuclei, particularly the seventh (facial) and ninth-to-twelfth nerves,
    producing bifacial weakness, tongue atrophy and fasciculations, dysarthria,
    hypophonia, and bulbar palsy. Bulbar involvement is invariable in MMNDV and present in
    a large share of classic MMND.
  cell_types:
  - preferred_term: lower motor neuron
    term:
      id: CL:0008039
      label: lower motor neuron
  locations:
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  notes: >-
    No cell-death biological_processes term is bound because the cellular mechanism of
    cranial motor neuron loss in MMND has not been histopathologically defined.
  evidence:
  - reference: PMID:12686396
    reference_title: "Madras motor neuron disease variant, clinical features of seven patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "multiple cranial nerve palsies particularly the seventh, ninth to twelfth and sensorineural hearing loss"
    explanation: >-
      Defines the characteristic multiple lower cranial nerve palsies of MMND, with the
      seventh and ninth-to-twelfth nerves particularly affected.
  - reference: PMID:12686396
    reference_title: "Madras motor neuron disease variant, clinical features of seven patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bulbar palsy was an invariable feature, being present in all patients compared to 38.3% of MMND"
    explanation: >-
      Bulbar palsy was present in all MMNDV patients and in 38.3% of classic MMND,
      confirming lower cranial nerve (bulbar) involvement.
  downstream:
  - target: Bulbar palsy
    causal_link_type: DIRECT
    description: Degeneration of ninth-to-twelfth cranial nerve motor nuclei directly causes bulbar palsy.
  - target: Bifacial weakness
    causal_link_type: DIRECT
    description: Seventh (facial) cranial nerve motor nucleus involvement produces bilateral facial muscle weakness.
  - target: Tongue atrophy
    causal_link_type: DIRECT
    description: Hypoglossal (twelfth cranial nerve) motor neuron loss produces neurogenic atrophy of the tongue.
  - target: Tongue fasciculations
    causal_link_type: DIRECT
    description: Hypoglossal motor neuron denervation causes spontaneous discharges manifesting as tongue fasciculations.
  - target: Dysarthria
    causal_link_type: DIRECT
    description: Lower cranial nerve weakness of speech musculature directly causes dysarthria.
  - target: Hypophonia
    causal_link_type: DIRECT
    description: Tenth cranial nerve / bulbar motor weakness reduces vocal loudness (hypophonia).
- name: Corticospinal Pyramidal Tract Dysfunction
  biological_scale: TISSUE
  description: >-
    Alongside prominent lower motor neuron degeneration, corticospinal tract involvement
    occurs in the majority of MMND patients (particularly in the lower limbs), giving the
    disorder mixed upper- and lower-motor-neuron signs including hyperreflexia, spasticity,
    and an extensor plantar (Babinski) response.
  cell_types:
  - preferred_term: upper motor neuron
    term:
      id: CL:0008048
      label: upper motor neuron
  locations:
  - preferred_term: corticospinal tract
    term:
      id: UBERON:0002707
      label: corticospinal tract
  evidence:
  - reference: PMID:18261745
    reference_title: "Madras motor neuron disease (MMND): clinical description and survival pattern of 116 patients from Southern India seen over 36 years (1971-2007)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Predominant initial manifestations were impaired hearing with wasting and weakness of distal limb muscles and pyramidal dysfunction."
    explanation: >-
      Establishes pyramidal tract dysfunction among the predominant initial neurological
      manifestations in the 116-patient MMND cohort.
  - reference: PMID:24139842
    reference_title: "Madras motor neuron disease (MMND) is distinct from the riboflavin transporter genetic defects that cause Brown-Vialetto-Van Laere syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Signs of pyramidal tract dysfunction in the upper limbs were seen in 6 patients (60.0%), and in the lower limbs in 10 patients (100.0%)."
    explanation: >-
      Demonstrates frequent upper-limb and universal lower-limb pyramidal tract signs in
      the 10-patient MMND/MMNDV cohort.
  downstream:
  - target: Pyramidal tract dysfunction
    causal_link_type: DIRECT
    description: Corticospinal tract involvement manifests clinically as abnormal pyramidal signs on neurological examination.
  - target: Babinski sign
    causal_link_type: DIRECT
    description: Corticospinal tract upper motor neuron dysfunction disinhibits the extensor plantar reflex (Babinski sign).
- name: Auditory Neuropathy
  biological_scale: CELLULAR
  description: >-
    Universal auditory neural dysfunction across MMND is characterized physiologically by
    preserved distortion-product otoacoustic emissions (intact outer hair cell function)
    paired with impaired auditory brainstem responses, localizing the hearing defect to
    spiral ganglion / eighth-nerve auditory neurons rather than cochlear outer hair cells.
  cell_types:
  - preferred_term: spiral ganglion (auditory) neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  - preferred_term: cochlear nerve
    term:
      id: UBERON:0004727
      label: cochlear nerve
  notes: >-
    No cell-death biological_processes term is bound because the cellular mechanism of
    auditory neural dysfunction in MMND has not been histopathologically established.
  evidence:
  - reference: PMID:24139842
    reference_title: "Madras motor neuron disease (MMND) is distinct from the riboflavin transporter genetic defects that cause Brown-Vialetto-Van Laere syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of the distortion product (DP) otoacoustic emissions (OAE) and auditory brain stem response (ABR) were available for the 20 ears. The most significant finding was the presence of robust OAEs in the presence of impaired AFA (ranging from mild to profound degree of SN hearing loss) in all. Thus, DPOAE and ABR demonstrated a neural dysfunction."
    explanation: >-
      Preserved otoacoustic emissions with abnormal auditory brainstem responses directly
      establish retrocochlear / spiral ganglion auditory neural dysfunction across all 20
      tested ears.
  - reference: PMID:18261745
    reference_title: "Madras motor neuron disease (MMND): clinical description and survival pattern of 116 patients from Southern India seen over 36 years (1971-2007)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had clinical and/or audiological evidence of hearing impairment."
    explanation: >-
      Demonstrates universal auditory impairment across the 116-patient Southern Indian
      MMND series.
  downstream:
  - target: Sensorineural hearing loss
    causal_link_type: DIRECT
    description: Auditory neural dysfunction in the spiral ganglion / cochlear nerve pathway directly produces bilateral sensorineural hearing impairment.

notes: >-
  MMND is rare (fewer than ~200 reported cases, predominantly from Southern India), with
  mean age of onset in the mid-teens (15.8 +/- 7.9 years in the 116-patient NIMHANS
  cohort). A familial form (FMMND) and an optic-atrophy variant (MMNDV) are recognized
  alongside classic sporadic disease. No causative gene has been established; sequencing
  of SLC52A1, SLC52A2, SLC52A3, and C9ORF72 is negative.

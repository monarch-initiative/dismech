has_subtypes:
- name: Sporadic MMND
  display_name: Sporadic Madras motor neuron disease
  description: >-
    The classic, predominantly sporadic form: young-onset limb wasting and weakness,
    multiple lower cranial nerve palsies and sensorineural hearing loss, with a
    comparatively benign course.
- name: MMNDV
  display_name: Madras motor neuron disease variant (MMNDV)
  description: >-
    A clinical variant in which optic atrophy is an invariable feature and cerebellar
    involvement may occur, with a younger age at onset and more consistent bulbar palsy
    than classic MMND.
- name: FMMND
  display_name: Familial Madras motor neuron disease (FMMND)
  description: >-
    A recognized familial form of MMND sharing the core phenotype but with a positive
    family history.
pathophysiology:
- name: Unidentified Etiologic Insult Distinct from Riboflavin Transporter and C9ORF72 Defects
  biological_scale: MOLECULAR
  description: >-
    The primary cause of MMND remains unidentified. Sequencing of the riboflavin
    transporter genes SLC52A1, SLC52A2, and SLC52A3 (causative of phenotypically
    overlapping Brown-Vialetto-Van Laere syndrome) and screening for C9ORF72 repeat
    expansions have been negative in familial and sporadic MMND cohorts, indicating a
    distinct genetic and/or environmental upstream insult targeting selective motor and
    sensory cranial/spinal neuronal pools.
  evidence:
  - reference: PMID:24139842
    reference_title: "Madras motor neuron disease (MMND) is distinct from the riboflavin transporter genetic defects that cause Brown-Vialetto-Van Laere syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced the SLC52A1, SLC52A2 and SLC52A3 in affected probands and sporadic individuals from the MMND series as well as the C9ORF72 expansion. No genetic defects were identified and the C9ORF72 repeats were all less than 10."
    explanation: >-
      Riboflavin transporter genes and C9ORF72 were assessed and found negative in MMND,
      supporting an as-yet-unidentified upstream etiology.
  - reference: PMID:24139842
    reference_title: "Madras motor neuron disease (MMND) is distinct from the riboflavin transporter genetic defects that cause Brown-Vialetto-Van Laere syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these diseases are likely to share a common defective biological pathway that may be a combination of genetic and environmental factors"
    explanation: >-
      Supports a hypothesized upstream pathway defect arising from combined genetic and
      environmental factors.
  downstream:
  - target: Lower Motor Neuron and Anterior Horn Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Unidentified upstream etiologic factors trigger selective vulnerability and loss of spinal anterior horn motor neurons.
  - target: Multiple Lower Cranial Nerve (Bulbar) Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Unidentified upstream etiologic factors trigger degeneration of brainstem lower cranial nerve motor nuclei.
  - target: Corticospinal Pyramidal Tract Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Unidentified upstream etiologic factors produce upper motor neuron / pyramidal tract dysfunction alongside anterior horn involvement.
  - target: Cochlear Auditory and Variant Optic Neuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Unidentified upstream etiologic factors cause selective auditory neuropathy and, in the MMNDV subset, optic nerve degeneration.

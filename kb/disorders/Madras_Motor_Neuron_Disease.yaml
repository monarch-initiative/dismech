- name: Distortion product otoacoustic emissions and auditory brainstem response
  diagnosis_term:
    preferred_term: otoacoustic emissions and auditory brainstem response testing
    term:
      id: NCIT:C184949
      label: Auditory Brainstem Response
  presence: PRESENT
  description: >-
    Combined distortion-product otoacoustic emission (DPOAE) and auditory brainstem
    response (ABR) testing demonstrates robust OAEs paired with impaired ABR, confirming
    auditory neural dysfunction (auditory neuropathy) rather than primary outer hair cell
    cochlear loss.
  results: Preserved robust distortion-product otoacoustic emissions with impaired auditory brainstem responses indicating neural dysfunction.
  evidence:
  - reference: PMID:24139842
    reference_title: "Madras motor neuron disease (MMND) is distinct from the riboflavin transporter genetic defects that cause Brown-Vialetto-Van Laere syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of the distortion product (DP) otoacoustic emissions (OAE) and auditory brain stem response (ABR) were available for the 20 ears. The most significant finding was the presence of robust OAEs in the presence of impaired AFA (ranging from mild to profound degree of SN hearing loss) in all. Thus, DPOAE and ABR demonstrated a neural dysfunction."
    explanation: >-
      Establishes combined DPOAE and ABR testing as the diagnostic demonstration of
      auditory neuropathy in MMND.
- name: Exclusion genetic testing for riboflavin transporter genes and C9ORF72
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: NORMAL
  description: >-
    Molecular genetic testing of SLC52A1, SLC52A2, and SLC52A3 is critical to exclude
    treatable riboflavin transporter deficiency (Brown-Vialetto-Van Laere syndrome), and
    C9ORF72 repeat-expansion testing is negative in MMND.
  results: Absence of pathogenic variants in SLC52A1, SLC52A2, and SLC52A3 and normal (<10) C9ORF72 repeat counts.
  evidence:
  - reference: PMID:24139842
    reference_title: "Madras motor neuron disease (MMND) is distinct from the riboflavin transporter genetic defects that cause Brown-Vialetto-Van Laere syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced the SLC52A1, SLC52A2 and SLC52A3 in affected probands and sporadic individuals from the MMND series as well as the C9ORF72 expansion. No genetic defects were identified and the C9ORF72 repeats were all less than 10."
    explanation: >-
      Demonstrates that negative genetic testing for SLC52A1/SLC52A2/SLC52A3 and C9ORF72
      distinguishes MMND from genetically defined mimics.
differential_diagnoses:
- name: Amyotrophic lateral sclerosis
  description: >-
    ALS shares motor neuron degeneration and pyramidal dysfunction but typically presents
    at a much older age and lacks the hallmark auditory neuropathy of MMND.
  disease_term:
    preferred_term: amyotrophic lateral sclerosis
    term:
      id: MONDO:0004976
      label: amyotrophic lateral sclerosis
  distinguishing_features:
  - Older adult onset and absence of characteristic auditory neuropathy, whereas MMND presents in childhood/adolescence with universal hearing impairment and longer mean survival.
  evidence:
  - reference: PMID:18261745
    reference_title: "Madras motor neuron disease (MMND): clinical description and survival pattern of 116 patients from Southern India seen over 36 years (1971-2007)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, Madras motor neuron disease is clinically a distinct entity with features of amyotrophic lateral sclerosis but with young age of onset and presence of auditory neuropathy."
    explanation: >-
      Explicitly differentiates MMND from amyotrophic lateral sclerosis by juvenile onset
      and auditory neuropathy.
- name: Brown-Vialetto-Van Laere syndrome
  description: >-
    Riboflavin transporter deficiency (Brown-Vialetto-Van Laere syndrome) is a childhood
    bulbospinal motor neuron disorder with bulbar palsy and sensorineural hearing loss
    that overlaps phenotypically with MMND, but is caused by treatable biallelic
    riboflavin transporter (SLC52A2 or SLC52A3) defects that are absent in MMND.
  disease_term:
    preferred_term: riboflavin transporter deficiency
    term:
      id: MONDO:0008891
      label: riboflavin transporter deficiency
  distinguishing_features:
  - Caused by biallelic pathogenic variants in SLC52A2 or SLC52A3 (and responsive to high-dose riboflavin), whereas SLC52A1/SLC52A2/SLC52A3 sequencing is negative in MMND.
  evidence:
  - reference: PMID:24139842
    reference_title: "Madras motor neuron disease (MMND) is distinct from the riboflavin transporter genetic defects that cause Brown-Vialetto-Van Laere syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a considerable overlap in the phenotype of MMND with Brown-Vialetto-Van Laere syndrome (BVVL) Boltshauser syndrome, Nathalie syndrome and Fazio-Londe syndrome."
    explanation: >-
      Documents the close clinical overlap between MMND and Brown-Vialetto-Van Laere
      syndrome that necessitates molecular exclusion.

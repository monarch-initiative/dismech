histopathology:
- name: Large thick-walled yeasts in multinucleated giant cells
  description: >-
    Biopsies show granulomatous inflammation with numerous large 7-15 µm Hcd
    yeasts inside multinucleated giant cells; periodic acid-Schiff and Grocott
    methenamine-silver stains highlight the fungal forms.
  diagnostic: true
  evidence:
  - reference: PMID:30334708
    reference_title: "African Histoplasmosis in HIV-Negative Patients, Kimpese, Democratic Republic of the Congo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      which shows granulomatous inflammation and giant cells containing numerous
      large yeast cells 10–15 μm in diameter, which are thick-walled and divided
      by narrow budding. The fungus is easily visible by GMS, Gridley, or PAS
      staining
    explanation: >-
      The Kimpese series describes the diagnostic large Hcd yeasts in
      granulomatous inflammation and the stains that show them.
  - reference: PMID:30334708
    reference_title: "African Histoplasmosis in HIV-Negative Patients, Kimpese, Democratic Republic of the Congo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

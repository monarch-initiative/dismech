agent_life_cycle:
  description: >-
    H. capsulatum var. duboisii has a poorly defined environmental saprophytic
    phase; a reservoir in soil mixed with bat guano has been reported, and human
    disease follows environmental acquisition rather than a maintained human
    transmission cycle.
  hosts:
  - preferred_term: Homo sapiens
    role: Clinically affected host; not a reservoir that maintains the fungus.
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  life_cycle_stages:
  - name: Environmental Histoplasma mold in guano-enriched soil
    description: >-
      Environmental mycelial growth in soil mixed with bat guano is a documented
      saprophytic reservoir, but the niche is incompletely characterized.
    evidence:
    - reference: PMID:15597674
      reference_title: "Histoplasmosis in Africa: a review."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        A natural reservoir of this fungus in soil admixed with bat guano has been
        found in a bat cave in a rural area
      explanation: >-
        Review-level evidence for guano-enriched soil as a documented natural Hcd
        reservoir.
  - name: Human yeast infection after environmental acquisition
    description: >-
      After acquisition from an environmental source through an unresolved portal,
      the dimorphic fungus is encountered in human tissue as large thick-walled
      yeast cells.
    evidence:
    - reference: PMID:35202403
      reference_title: "Histoplasmosis in Africa: Current perspectives, knowledge gaps, and research priorities."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The size of the yeast cells is larger, and the walls are thicker in Hcd
        than in Hcc.
      explanation: >-
        Defines the large thick-walled Hcd yeast morphology seen during the human
        tissue stage.
  evidence:
  - reference: PMID:15597674
    reference_title: "Histoplasmosis in Africa: a review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A natural reservoir of this fungus in soil admixed with bat guano has been
      found in a bat cave
    explanation: >-
      Supports an environmental reservoir that can seed human exposure.
  notes: >-
    Animal reservoirs or intermediate hosts are not asserted here: the available
    reviews identify a natural guano-enriched-soil reservoir and call for more
    work on possible animal reservoirs.

- name: HIV infection host context
  description: >-
    HIV infection and advanced CD4 depletion are host contexts for disseminated
    African histoplasmosis.
  effect: Predisposes to disseminated Hcd infection.
  influences_mechanisms:
  - target: Disseminated Hcd Infection
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Advanced HIV-associated immunosuppression weakens cellular control of
      Histoplasma infection and is observed in disseminated Hcd case reports.
    evidence:
    - reference: PMID:18217546
      reference_title: Literature review and case histories of Histoplasma capsulatum var. duboisii infections in HIV-infected patients.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Among the well-described cases (Table 1), most involved patients with
        poor immunologic status (mean CD4 count 55/mm3), which also occurs with
        histoplasmosis due to variety capsulatum ( 21 ). Most patients had
        disseminated infections
      explanation: >-
        Supports advanced HIV-associated immunosuppression as a host context in
        reported disseminated Hcd infections.
  evidence:
  - reference: PMID:32887981

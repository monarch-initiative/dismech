name: African Histoplasmosis
creation_date: "2026-11-14T11:00:00Z"
category: Infectious Disease
description: >-
  African histoplasmosis is a rare endemic deep mycosis caused by Histoplasma
  capsulatum var. duboisii. The exact portal of entry remains unresolved; soil
  mixed with bat guano is a documented reservoir, inhalation and transcutaneous
  inoculation have both been proposed, and tissue yeast infection most often
  presents with granulomatous cutaneous or subcutaneous lesions, bone infection,
  and lymphadenopathy rather than the predominantly pulmonary syndrome seen in
  classical histoplasmosis.
disease_term:
  preferred_term: African histoplasmosis
  term:
    id: MONDO:0001262
    label: African histoplasmosis
references:
- reference: PMID:32887981
  title: "Histoplasmosis Caused by Histoplasma capsulatum var. duboisii: A Comprehensive Review of Cases From 1993 to 2019."
  found_in:
  - African_Histoplasmosis-literature-sweep-codex.md
  findings:
  - statement: >-
      In 94 well-documented African histoplasmosis cases from 1993-2019, skin
      or subcutaneous lesions, bone infection, and lymphadenopathy were the most
      common presentations.
    supporting_text: >-
      Cutaneous/subcutaneous lesions, bone infections, and lymphadenopathies,
      both isolated and combined, were the most frequent presentations.
- reference: PMID:35202403
  title: "Histoplasmosis in Africa: Current perspectives, knowledge gaps, and research priorities."
  found_in:
  - African_Histoplasmosis-literature-sweep-codex.md
  findings:
  - statement: >-
      African histoplasmosis is linked to Histoplasma capsulatum var. duboisii,
      is concentrated in western and central Africa, and commonly affects the
      skin, lymph nodes, and bone rather than the lung.
    supporting_text: >-
      Classical histoplasmosis typically presents as an acute or chronic
      pulmonary infection, while African histoplasmosis rarely manifests as
      pulmonary disease but more commonly as an infection of skin, lymph nodes,
      and bone.
  - statement: >-
      The acquisition route for African histoplasmosis is uncertain, with
      inhalation and transcutaneous inoculation both proposed.
    supporting_text: >-
      The popular infection route in histoplasmosis is the inhalation of
      microconidia and subsequent development of pulmonary lesions. The
      transcutaneous route after trauma has also been suggested especially in
      Hcd and has been implicated in a few case reports
- reference: PMID:33956817
  title: "Histoplasmosis in the Republic of Congo dominated by African histoplasmosis, Histoplasma capsulatum var. duboisii."
  found_in:
  - African_Histoplasmosis-literature-sweep-codex.md
  findings:
  - statement: >-
      A Republic of Congo review found that nearly all reported histoplasmosis
      cases in that country were African histoplasmosis and that the most
      frequent clinical presentations were skin, lymph-node, and bone lesions.
    supporting_text: >-
      Of the 57 cases, 54 (94.7%) were cases of Histoplasma capsulatum var.
      duboisii (Hcd) infection, African histoplasmosis.
- reference: PMID:30334708
  title: "African Histoplasmosis in HIV-Negative Patients, Kimpese, Democratic Republic of the Congo."
  found_in:
  - African_Histoplasmosis-literature-sweep-codex.md
  findings:
  - statement: >-
      In a Kimpese case series, African histoplasmosis diagnoses were confirmed
      histologically and molecularly from specimens including skin, bone, and
      lymph-node biopsies.
    supporting_text: >-
      Cases were confirmed by histopathology, immunohistochemistry, and reverse
      transcription PCR.
- reference: PMID:18217546
  title: "Literature review and case histories of Histoplasma capsulatum var. duboisii infections in HIV-infected patients."
  found_in:
  - African_Histoplasmosis-literature-sweep-codex.md
  findings:
  - statement: >-
      African histoplasmosis can occur in people with advanced HIV infection,
      but H. capsulatum var. duboisii and HIV co-infection has been reported
      much less often than classical H. capsulatum var. capsulatum disease in
      comparable settings.
    supporting_text: >-
      In contrast, reports concerning African histoplasmosis during HIV
      infection are rare, although both pathogens coexist in those regions.
- reference: PMID:15538817
  title: "African histoplasmosis: a review."
  found_in:
  - African_Histoplasmosis-literature-sweep-codex.md
  findings:
  - statement: >-
      African histoplasmosis is endemic in central and western Africa and
      Madagascar, with both inhalation and direct skin inoculation implicated as
      possible entry portals.
    supporting_text: >-
      The exact portal of entry into the body is not known, but inhalation into
      the lungs and direct inoculation in the skin have been incriminated.
- reference: PMID:15597674
  title: "Histoplasmosis in Africa: a review."
  found_in:
  - African_Histoplasmosis-literature-sweep-codex.md
  findings:
  - statement: >-
      A natural environmental reservoir of Histoplasma capsulatum var. duboisii
      has been reported in soil mixed with bat guano from a Nigerian cave.
    supporting_text: >-
      A natural reservoir of this fungus in soil admixed with bat guano has been
      found in a bat cave in a rural area, viz. Ogbunike in Anambra State of
      Nigeria.
synonyms:
- Histoplasma capsulatum var. duboisii infection
- Histoplasma duboisii infection
notes: >-
  Lump/split decision: African histoplasmosis is curated as a standalone
  Histoplasma disease because MONDO carries it as the named H. capsulatum var.
  duboisii leaf (MONDO:0001262) under Histoplasma capsulatum infectious disease
  and the literature separates it from classical histoplasmosis by geography,
  the Hcd variety, and the skin/bone/lymph-node clinical pattern. The broader
  Histoplasmosis and Histoplasma capsulatum infectious disease stubs remain in
  the queue for later umbrella curation, and focal meningitis or pericarditis
  stubs remain open as organ-specific lump/split decisions. Lung and internal
  organ involvement is rare in the classic review literature, but recent case
  reviews describe disseminated Hcd infection in many published cases.

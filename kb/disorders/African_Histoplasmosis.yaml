    explanation: >-
      Supports localized skin, bone, and lymph-node disease as the common
      presentation pattern.
- phase: Disseminated African histoplasmosis
  notes: >-
    Dissemination is defined in the Republic of Congo review as infection of at
    least two noncontiguous body sites. A 1993-2019 case review found
    disseminated forms in 60.6% of reviewed cases and 23.4% mortality by the
    end of follow-up.
  evidence:

      life, failure to thrive, cerebral malformations, developmental delay, epilepsy,
      severe mental retardation, roving eye movements during infancy, trunk hypotonia,
      poor head control, craniofacial dysmorphisms, and mild deafness
    explanation: Deafness in the human clinical picture.
genetic:
- name: SNAP29
  gene_term:
    preferred_term: SNAP29
    term:
      id: hgnc:11133
      label: SNAP29
  relationship_type: CAUSATIVE
  notes: >-
    Synaptosomal-associated protein 29, at 22q11.2. Biallelic loss-of-function
    variants cause CEDNIK. The locus is the clinically important part: SNAP29 is
    deleted in 90% of patients with 22q11.2 deletion syndrome, so a 22q11.2 deletion
    carrier who also has a deleterious variant on the remaining allele has no
    functional SNAP29 and can present with CEDNIK features. Expressivity is variable
    and penetrance incomplete even within one genotype.
  variants:
  - name: 1-bp deletion in SNAP29
    description: >-
      The founding allele, homozygous in all patients of two large consanguineous
      families identified by homozygosity mapping.
  - name: c.486insA
    description: >-
      A homozygous insertion reported in two sibs with ichthyosis and corpus callosum
      dysgenesis, shown by transfection to be loss of function. Reported elsewhere as
      c.486_487insA, where homozygotes may present with the full syndrome or with the
      neurological features alone.
  evidence:
  - reference: PMID:15968592
    reference_title: A mutation in SNAP29, coding for a SNARE protein involved in intracellular trafficking, causes a novel neurocutaneous syndrome characterized by cerebral dysgenesis, neuropathy, ichthyosis, and palmoplantar keratoderma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using homozygosity mapping in two large families, we localized the disease gene
      to 22q11.2 and identified, in all patients, a 1-bp deletion in SNAP29, which
      codes for a SNARE protein involved in vesicle fusion.
    explanation: Gene identification, locus, and the founding allele.
  - reference: PMID:31633066
    reference_title: Snap29 mutant mice recapitulate neurological and ophthalmological abnormalities associated with 22q11 and CEDNIK syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      SNAP29 maps to the 22q11.2 region and is deleted in 90% of patients with 22q11.2
      deletion syndrome (22q11.2DS).
    explanation: >-
      The locus overlap with 22q11.2DS, which is what makes the hemizygous route to
      CEDNIK possible. Stated as established background in this paper's introduction.
animal_models:
- species: Mouse
  genotype: Snap29(-/-) and Snap29(fl/fl)/K14-Cre
  publication: PMID:26747696
  description: >-
    Total and keratinocyte-restricted knockouts, both giving a congenital ichthyotic
    phenotype with neonatal lethality. The keratinocyte-specific line is the
    informative one for the cutaneous arm: restricting the deletion to keratinocytes
    is sufficient to produce the skin disease.
  modeled_mechanisms:
  - target: Aberrant Epidermal Differentiation and Barrier Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Reproduces the acanthosis, hyperkeratosis, abnormal keratinocyte differentiation
      and barrier failure, and localises the lamellar-body defect that causes them.
    limitations: >-
      The mouse phenotype is neonatally lethal, which the human disease is not, so the
      model is more severe than the disease it represents and cannot report on
      anything that happens after the newborn period.
    evidence:
    - reference: PMID:26747696
      reference_title: Establishment of Two Mouse Models for CEDNIK Syndrome Reveals the Pivotal Role of SNAP29 in Epidermal Differentiation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Both mutant mice exhibited a congenital distinct ichthyotic phenotype resulting
        in neonatal lethality.
      explanation: >-
        Establishes both that the model reproduces the cutaneous phenotype and that it
        is more severe than the human disease.
  - target: Lamellar Granule Maturation Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Shows malformed lamellar bodies and markedly decreased deposition of their
      contents, which is the organelle-level lesion described in patient skin.
    evidence:
    - reference: PMID:26747696
      reference_title: Establishment of Two Mouse Models for CEDNIK Syndrome Reveals the Pivotal Role of SNAP29 in Epidermal Differentiation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Markedly decreased deposition of lamellar body contents in mutant mice
        epidermis and the observation of malformed lamellar bodies indicate severe
        impairments in lamellar body function due to the Snap29 knockout.
      explanation: The organelle lesion, in the knockout.
- species: Mouse
  genotype: Snap29 loss-of-function
  background: mixed CD1;FvB
  publication: PMID:31633066
  description: >-
    A loss-of-function line on a mixed background that reproduces the neurological and
    ophthalmological features as well as the skin, and so is the model for the half of
    the syndrome the keratinocyte-specific line cannot address. It also revealed a
    requirement for Snap29 in male fertility that has no reported human counterpart.
  modeled_mechanisms:
  - target: Neuroectodermal Developmental Disruption
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Phenocopies neurological and ophthalmological abnormalities found in CEDNIK
      patients, which is what makes the human cerebral features tractable in a model.
    limitations: >-
      The phenotype is background-dependent — it is reported on a mixed CD1;FvB
      background — which means strain modifiers contribute and the mapping to a human
      genotype is not one to one. The model also shows a male fertility defect not
      reported in patients, so not every finding in it transfers.
    evidence:
    - reference: PMID:31633066
      reference_title: Snap29 mutant mice recapitulate neurological and ophthalmological abnormalities associated with 22q11 and CEDNIK syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we report that mice with a loss of function mutation of Snap29 on a mixed
        CD1;FvB genetic background recapitulate skin abnormalities associated with
        CEDNIK, and also phenocopy neurological and ophthalmological abnormalities
        found in CEDNIK and a subset of 22q11.2DS patients
      explanation: >-
        The recapitulation claim, with the background dependence stated in the same
        sentence.
experimental_models:
- name: SNAP29-knockdown three-dimensional human keratinocyte organotypic culture
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary human keratinocytes in 3D organotypic culture with SNAP29 knocked down.
    This is the model that closes the species gap: it reproduces CEDNIK histology in
    human cells, so the epidermal mechanism does not rest on mouse data alone.
  publication: PMID:21073448
  modeled_mechanisms:
  - target: Aberrant Epidermal Differentiation and Barrier Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Replicates histological features typical of CEDNIK in human keratinocytes.
    limitations: >-
      Knockdown is not the biallelic null state of a patient, and an organotypic
      culture has no immune, vascular or neural compartment, so it reports on the
      epidermal arm of the disease only.
    evidence:
    - reference: PMID:21073448
      reference_title: CEDNIK syndrome results from loss-of-function mutations in SNAP29.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Further substantiating this notion, we could replicate histological features
        typical for CEDNIK syndrome in three-dimensional primary human keratinocyte
        organotypic cell cultures downregulated for SNAP29.
      explanation: The human-cell replication of the epidermal phenotype.
discussions:
- discussion_id: cednik_brain_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    What does loss of SNAP29-dependent vesicle fusion do in the developing brain to
    produce corpus callosum dysgenesis and polymicrogyria?
  attaches_to:
  - pathophysiology#Neuroectodermal Developmental Disruption
  rationale: >-
    The epidermal arm of this disease is worked out to the level of a named organelle
    and its cargo. The cerebral arm is not: the malformations are well described and
    the shared neuroectodermal origin is offered as the reason they occur, but no
    located source identifies the cell type, the trafficking step, or the
    developmental process involved. That asymmetry is why every edge out of this node
    is typed with unknown intermediates while the skin edges are DIRECT.
- discussion_id: cednik_expressivity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do some patients homozygous for c.486_487insA have the full syndrome while
    others have the neurological features and no skin disease at all?
  attaches_to:
  - genetic#SNAP29
  rationale: >-
    Identical genotype, absent phenotype in one of the two defining organ systems. A
    modifier, a background effect, or residual SNAP29 function would each imply
    something different about the mechanism, and distinguishing them would change how
    a clinician interprets a SNAP29 variant found in a patient with isolated cerebral
    malformation. The Snap29 mouse phenotype being background-dependent is suggestive
    but is not evidence about human modifiers.
- discussion_id: cednik_autophagy_contribution
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the autophagy and ER-stress arm contribute to human CEDNIK, or is it a
    property of the mouse knockout?
  attaches_to:
  - pathophysiology#Impaired Autophagosome-Lysosome Fusion
  rationale: >-
    The LC3B-II accumulation, unchanged p62 and CHOP induction that make CEDNIK
    readable as an autophagy disorder are all measured in Snap29 knockout mouse
    epidermis. No located source reports the corresponding readouts in patient tissue
    or in the human organotypic model, which did reproduce the histology. Evidence
    exists in a model; its translational validity to human disease is the open
    question, which is what distinguishes this from a plain absence of evidence. The
    experiment that would settle it is measuring LC3B-II, p62/SQSTM1 and CHOP in the
    SNAP29-knockdown human organotypic system under the conditions used in the mouse.
notes: >-
  The two halves of this syndrome are not equally well understood, and the entry is
  built to show that rather than to smooth it over. The cutaneous arm is resolved to
  an organelle: lamellar granules fail to mature, their lipid and protease cargo is
  mislocated, the barrier fails. That chain is measured in patient skin, reproduced in
  a keratinocyte-specific mouse knockout, and reproduced again in human organotypic
  culture, so its edges are typed DIRECT. The cerebral arm has no comparable account.
  The malformations are well documented, and the founding paper's argument for why
  they belong to the same disease is the shared neuroectodermal origin of skin and
  neural tissue — which is a reason to expect a connection, not a mechanism. Every
  edge out of the neuroectodermal node is therefore typed with unknown intermediates.

  Reading the evidence here needs one more distinction. Several of the clinical
  features — epilepsy, developmental delay, hypotonia, optic nerve hypoplasia, mild
  deafness, failure to thrive — are cited from the introduction of a mouse paper,
  where that introduction states the human clinical picture. Those items carry
  evidence_source HUMAN_CLINICAL with quote_role BACKGROUND, which is exactly true:
  the observation is human and clinical, and the citing publication is not where it
  was made. Grading them MODEL_ORGANISM would assert that a mouse measured human
  deafness.

  On the relationship to 22q11.2 deletion syndrome: SNAP29 sits in the deleted
  interval and is lost in 90% of 22q11.2DS patients, so a deletion carrier with a
  deleterious variant on the remaining allele has no functional SNAP29. This entry
  curates CEDNIK, not 22q11.2DS, and the 22q11.2_Deletion_Syndrome entry already in
  the KB is the place for the contiguous-gene disease.

  No GeneReviews chapter exists for CEDNIK syndrome; just check-genereviews reports
  NO_CHAPTER against the committed Bookshelf index.

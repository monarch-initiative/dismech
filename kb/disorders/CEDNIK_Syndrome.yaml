name: CEDNIK Syndrome
creation_date: "2026-09-17T14:55:00Z"
description: >-
  CEDNIK syndrome is an autosomal recessive SNAP29-related neurocutaneous disorder with variable developmental impairment, brain malformations, peripheral neuropathy, ichthyosis and palmoplantar keratoderma. Some molecularly confirmed individuals lack skin disease or cortical malformations. Loss of SNAP29 function disrupts selected membrane-trafficking pathways; patient skin demonstrates abnormal lamellar granules and retention of lipid and protease cargo. Cell models identify endocytic recycling, Golgi organization and mitotic defects, but the causal routes to human brain malformations remain incompletely resolved. Hypomyelination and later neurological regression broaden the disorder beyond a purely congenital malformation syndrome. Biallelic sequence variants or a pathogenic sequence variant opposite a deletion encompassing SNAP29 can cause disease; other deleted genes can contribute additional features.
synonyms:
- CEDNIK
- cerebral dysgenesis, neuropathy, ichthyosis and keratoderma syndrome
- cerebral dysgenesis-neuropathy-ichthyosis-keratoderma syndrome
- SNAP29 deficiency
- SNAP29-related disorder

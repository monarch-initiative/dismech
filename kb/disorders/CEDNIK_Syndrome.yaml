inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Two defective SNAP29 alleles are required. The founding families were
    homozygous for a 1-bp deletion and were identified by homozygosity mapping. A
    second homozygous insertion, c.486insA, was later reported in two sibs.
    Heterozygous parents are unaffected. The one route to the disease that is not a
    plain homozygous genotype is hemizygosity: because SNAP29 sits in the 22q11.2
    deletion interval, a deletion carrier with a deleterious variant on the
    remaining allele has no functional copy either.
  evidence:
  - reference: PMID:15968592
    reference_title: A mutation in SNAP29, coding for a SNARE protein involved in intracellular trafficking, causes a novel neurocutaneous syndrome characterized by cerebral dysgenesis, neuropathy, ichthyosis, and palmoplantar keratoderma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using homozygosity mapping in two large families, we localized the disease gene
      to 22q11.2 and identified, in all patients, a 1-bp deletion in SNAP29, which
      codes for a SNARE protein involved in vesicle fusion.
    explanation: >-
      The founding genetic result: homozygosity mapping in consanguineous families,
      with the same homozygous variant in every patient.
  - reference: PMID:21073448
    reference_title: CEDNIK syndrome results from loss-of-function mutations in SNAP29.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a novel homozygous insertion in SNAP29 (c.486insA) in two sibs
      presenting with ichthyosis and dysgenesis of the corpus callosum.
    explanation: >-
      A second, independent homozygous allele, confirming the recessive requirement
      is not specific to the founding families' variant.
prevalence:
- population: Families reported in the founding and follow-up series
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Two large consanguineous families in the founding report, two sibs in the
    second, and scattered single cases since. No population prevalence has been
    published and no located source offers a denominator, so the band reflects the
    published case count rather than a measured rate.
  evidence:
  - reference: PMID:21073448
    reference_title: CEDNIK syndrome results from loss-of-function mutations in SNAP29.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      CEDNIK (cerebral dysgenesis, neuropathy, ichthyosis and keratoderma) syndrome
      is a rare genodermatosis which was shown 5 years ago in one family to be
      associated with a loss-of-function mutation in SNAP29, encoding a member of the
      SNARE family of proteins.
    explanation: >-
      States the rarity and the size of the literature at the time. The sentence is
      this paper's background framing of the prior report, not its own result.
progression:
- phase: Neonatal and infantile onset
  notes: >-
    Skin disease is present at birth or appears in the first months of life, and the
    neurological features are developmental rather than degenerative — the cerebral
    malformations are formed before birth.
  evidence:
  - reference: PMID:31633066
    reference_title: Snap29 mutant mice recapitulate neurological and ophthalmological abnormalities associated with 22q11 and CEDNIK syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      CEDNIK patients exhibit skin defects at birth or in the first few months of
      life, failure to thrive, cerebral malformations, developmental delay, epilepsy,
      severe mental retardation, roving eye movements during infancy, trunk hypotonia,
      poor head control, craniofacial dysmorphisms, and mild deafness
    explanation: >-
      The timing of onset and the clinical range. This sentence is the mouse paper's
      introduction summarising the human literature, so it describes human clinical
      observation rather than anything measured in this study.
pathophysiology:
- name: SNAP29 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants abolish SNAP29, a SNARE-family protein
    encoded at 22q11.2 and required for vesicle fusion. Patient skin shows decreased
    SNAP29 expression, and transfection experiments confirm that the reported
    variants are loss of function rather than altered function. Because SNAP29 acts
    at fusion steps used by more than one pathway, a single loss propagates into two
    separable downstream branches.
  genes:
  - preferred_term: SNAP29
    term:
      id: hgnc:11133
      label: SNAP29
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Lamellar Granule Maturation Failure
    causal_link_type: DIRECT
    description: >-
      Reduced SNAP29 in patient skin is accompanied by abnormal maturation of the
      lamellar granules, the secretory organelles of the granular layer.
    evidence:
    - reference: PMID:15968592
      reference_title: A mutation in SNAP29, coding for a SNARE protein involved in intracellular trafficking, causes a novel neurocutaneous syndrome characterized by cerebral dysgenesis, neuropathy, ichthyosis, and palmoplantar keratoderma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        SNAP29 expression was decreased in the skin of the patients, resulting in
        abnormal maturation of lamellar granules and, as a consequence, in mislocation
        of epidermal lipids and proteases.
      explanation: >-
        Measured in the patients' own skin, and the paper states the consequence
        relation explicitly rather than leaving it to be inferred.
  - target: Impaired Autophagosome-Lysosome Fusion
    causal_link_type: DIRECT
    description: >-
      SNAP29 also serves autophagic fusion. Knockout mouse epidermis accumulates
      LC3B-II with unchanged p62/SQSTM1, the pattern expected when autophagosomes
      form but are not cleared.
    evidence:
    - reference: PMID:26747696
      reference_title: Establishment of Two Mouse Models for CEDNIK Syndrome Reveals the Pivotal Role of SNAP29 in Epidermal Differentiation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We also found increased microtubule associated protein-1 light chain 3,
        isoform B-II levels, unchanged p62/SQSTM1 protein amounts, and strong
        induction of the endoplasmic reticulum stress marker C/EBP homologous protein
        in mutant mice.
      explanation: >-
        The autophagy and ER-stress readouts. These are mouse measurements and are not
        reported in human patient tissue in any located source.
  evidence:
  - reference: PMID:21073448
    reference_title: CEDNIK syndrome results from loss-of-function mutations in SNAP29.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro transfection experiments indicated that this mutation results in SNAP29
      loss-of-function.
    explanation: >-
      Establishes the functional consequence of the variant directly, rather than
      assuming it from the variant class.
- name: Lamellar Granule Maturation Failure
  biological_scale: CELLULAR
  description: >-
    Lamellar granules are the keratinocyte organelles that deliver barrier lipids and
    processing proteases into the intercellular space at the granular-to-cornified
    transition. Without SNAP29 they do not mature, and their cargo is mislocated. This
    is the specific lesion that makes CEDNIK an ichthyosis rather than a generic
    trafficking disease.
  cellular_components:
  - preferred_term: epidermal lamellar body
    modifier: DECREASED
    term:
      id: GO:0097209
      label: epidermal lamellar body
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Aberrant Epidermal Differentiation and Barrier Failure
    causal_link_type: DIRECT
    description: >-
      Mislocated lipids and proteases leave the cornified envelope improperly formed,
      and the barrier fails.
    evidence:
    - reference: PMID:26747696
      reference_title: Establishment of Two Mouse Models for CEDNIK Syndrome Reveals the Pivotal Role of SNAP29 in Epidermal Differentiation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Markedly decreased deposition of lamellar body contents in mutant mice
        epidermis and the observation of malformed lamellar bodies indicate severe
        impairments in lamellar body function due to the Snap29 knockout.
      explanation: >-
        Connects the malformed organelle to failed deposition of its contents, which
        is the step this edge asserts. Measured in mouse.
  evidence:
  - reference: PMID:15968592
    reference_title: A mutation in SNAP29, coding for a SNARE protein involved in intracellular trafficking, causes a novel neurocutaneous syndrome characterized by cerebral dysgenesis, neuropathy, ichthyosis, and palmoplantar keratoderma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SNAP29 expression was decreased in the skin of the patients, resulting in
      abnormal maturation of lamellar granules and, as a consequence, in mislocation
      of epidermal lipids and proteases.
    explanation: The organelle defect and its cargo consequence, in patient skin.
- name: Impaired Autophagosome-Lysosome Fusion
  biological_scale: CELLULAR
  description: >-
    SNAP29 participates in the fusion of autophagosomes with lysosomes. Its loss in
    mouse epidermis raises LC3B-II while leaving p62/SQSTM1 unchanged, and induces
    CHOP. This branch is the reason CEDNIK is discussed alongside the autophagy
    disorders, but note the whole of the evidence for it is murine.
  biological_processes:
  - preferred_term: autophagosome-lysosome fusion
    modifier: DECREASED
    term:
      id: GO:0061909
      label: autophagosome-lysosome fusion
  downstream:
  - target: Aberrant Epidermal Differentiation and Barrier Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The autophagy block and the ER stress are reported in the same knockout
      epidermis that shows the differentiation defect, but no located source
      establishes that one produces the other rather than both following from the
      shared fusion lesion.
  evidence:
  - reference: PMID:26747696
    reference_title: Establishment of Two Mouse Models for CEDNIK Syndrome Reveals the Pivotal Role of SNAP29 in Epidermal Differentiation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This emphasizes a role of SNAP29 in autophagy and endoplasmic reticulum stress.
    explanation: The authors' own statement of what their autophagy readouts show.
- name: Aberrant Epidermal Differentiation and Barrier Failure
  biological_scale: TISSUE
  description: >-
    Keratinocyte differentiation is abnormal and proliferation is increased, giving
    acanthosis and hyperkeratosis, and the epidermal barrier is severely impaired.
    In the mouse the phenotype is severe enough to be lethal in the neonatal period,
    which human patients survive — a species difference worth holding in mind when
    reading the mouse data.
  biological_processes:
  - preferred_term: keratinocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0030216
      label: keratinocyte differentiation
  - preferred_term: establishment of skin barrier
    modifier: DECREASED
    term:
      id: GO:0061436
      label: establishment of skin barrier
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Ichthyosis
    causal_link_type: DIRECT
  - target: Palmoplantar keratoderma
    causal_link_type: DIRECT
  - target: Failure to thrive
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A failed skin barrier costs water and energy, which together with the feeding
      difficulty of a severely affected infant produces the growth failure.
  evidence:
  - reference: PMID:26747696
    reference_title: Establishment of Two Mouse Models for CEDNIK Syndrome Reveals the Pivotal Role of SNAP29 in Epidermal Differentiation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutant mice revealed acanthosis and hyperkeratosis as well as abnormal
      keratinocyte differentiation and increased proliferation. In addition, the
      epidermal barrier was severely impaired.
    explanation: >-
      The histological and functional description of the epidermal phenotype, in the
      knockout.
  - reference: PMID:21073448
    reference_title: CEDNIK syndrome results from loss-of-function mutations in SNAP29.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Further substantiating this notion, we could replicate histological features
      typical for CEDNIK syndrome in three-dimensional primary human keratinocyte
      organotypic cell cultures downregulated for SNAP29.
    explanation: >-
      The human counterpart of the mouse result: knocking SNAP29 down in human
      keratinocytes reproduces the histology, which is what makes the mouse finding
      translatable rather than incidental.
- name: Neuroectodermal Developmental Disruption
  biological_scale: TISSUE
  description: >-
    Epidermis and neural tissue share an embryonic origin, and the founding report
    framed CEDNIK as evidence that vesicle trafficking is required for proper
    neuroectodermal differentiation — which is the argument that the cutaneous and
    cerebral halves of this syndrome are one lesion rather than two. What the
    trafficking defect does in the developing brain is not resolved at the cellular
    level in any located source; the malformations are the observation, not the
    mechanism.
  downstream:
  - target: Cerebral dysgenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Polymicrogyria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Peripheral neuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Optic nerve hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:15968592
    reference_title: A mutation in SNAP29, coding for a SNARE protein involved in intracellular trafficking, causes a novel neurocutaneous syndrome characterized by cerebral dysgenesis, neuropathy, ichthyosis, and palmoplantar keratoderma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data underscore the importance of vesicle trafficking regulatory
      mechanisms for proper neuroectodermal differentiation.
    explanation: >-
      The authors' framing of why one trafficking gene produces a combined
      neurocutaneous phenotype. It is a conclusion about the shared lineage, not a
      cellular mechanism in the brain, which is why the edges out of this node are
      typed with unknown intermediates.

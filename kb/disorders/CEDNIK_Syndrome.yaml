      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive inheritance with homozygous or compound heterozygous pathogenic SNAP29 variants. Two sequence variants can occur in trans, or a sequence variant can be paired with a deletion encompassing SNAP29. Carrier parents are generally unaffected; feature-specific variability does not demonstrate incomplete penetrance of the entire recessive disorder.
  evidence:
  - reference: PMID:15968592
    reference_title: A mutation in SNAP29, coding for a SNARE protein involved in intracellular trafficking, causes a novel neurocutaneous syndrome characterized by cerebral dysgenesis, neuropathy, ichthyosis, and palmoplantar keratoderma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Using homozygosity mapping in two large families, we localized the disease gene to 22q11.2
    explanation: The founding families establish recessive inheritance.
  - reference: PMID:31748968
    reference_title: Compound heterozygous mutations in SNAP29 is associated with Pelizaeus-Merzbacher-like disorder (PMLD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Exome sequencing in the trio revealed novel compound heterozygous pathogenic mutations in SNAP29 (p.Leu119AlafsX15, c.354DupG and p.0?, c.2T > C).
    explanation: The molecularly confirmed case demonstrates two different sequence alleles; the variant details are provided in the available abstract.
prevalence:
- population: Published patients through the 2021 six-patient series
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: The series added six patients from five families to 19 previously reported individuals. This is a literature count, not a population prevalence estimate; later case reports exist and some reports overlap.
  evidence:
  - reference: PMID:33977139
    reference_title: New Cohort of Patients With CEDNIK Syndrome Expands the Phenotypic and Genotypic Spectra.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Here, we describe 6 additional patients with CEDNIK syndrome from 5 unrelated families
    explanation: The authors distinguish their new cohort from earlier reports.
progression:
- phase: Infantile developmental presentation with variable skin onset
  notes: Poor head control, hypotonia and developmental delay often emerge in infancy. The founding skin manifestations appeared at 5–11 months; skin findings can appear much later or remain absent.
  evidence:
  - reference: PMID:38590735
    reference_title: Keratoderma and ichthyosis as valuable features for the diagnosis of CEDNIK syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: At age of 10 years the patient developed fine scales on extremities, and progressive thickening of the toenails and soles.
    explanation: The molecularly confirmed case developed the characteristic cutaneous findings late; onset is not uniformly neonatal.
- phase: Variable later neurological course
  notes: Some individuals acquire walking and speech, while others remain nonambulatory and nonverbal. Loss of acquired motor and speech skills and progressive myelin loss were documented in an adolescent. Survival to 19 years is reported; childhood aspiration-pneumonia deaths in the founding families do not establish a uniform survival limit.
  evidence:
  - reference: PMID:33977139
    reference_title: New Cohort of Patients With CEDNIK Syndrome Expands the Phenotypic and Genotypic Spectra.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Patient 1 is a 19-year-old woman
    explanation: The cohort includes survival into adulthood.
  - reference: PMID:33977139
    reference_title: New Cohort of Patients With CEDNIK Syndrome Expands the Phenotypic and Genotypic Spectra.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: She lost motor and speech milestones at the age of 12–13.
    explanation: The primary history demonstrates regression, not solely developmental delay.
pathophysiology:
- name: SNAP29 Loss of Function
  description: 'Biallelic pathogenic variants reduce functional SNAP29. Protein abundance and localization depend on the allele: the founding deletion reduced RNA and protein, whereas the Ser163 frameshift can produce a truncated, mislocalized protein. Residual translation from the c.2T>C start-loss allele and nonsense-mediated-decay escape of p.Glu208* remain predictions.'
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

- name: Peripheral Nerve Myelin Dysfunction
  description: Electrophysiology in one child showed markedly slowed conduction and absent sensory responses consistent with diffuse sensorimotor demyelinating polyneuropathy. The SNAP29-dependent cell biology responsible for this peripheral myelin phenotype is unresolved.

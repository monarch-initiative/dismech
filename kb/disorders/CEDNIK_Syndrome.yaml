    relationship: MEASURES
    model_scale: CELLULAR
    limitations: Static markers and ultrastructure support disturbed clearance but do not directly measure fusion flux.
    fidelity: MODERATE
  - target: Abnormal Keratinocyte Differentiation
    description: Compares mutant epidermal organization with mammalian skin.

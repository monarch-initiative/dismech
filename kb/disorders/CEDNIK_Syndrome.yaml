name: CEDNIK Syndrome
creation_date: "2026-09-17T14:55:00Z"
description: >-
  CEDNIK syndrome — cerebral dysgenesis, neuropathy, ichthyosis and keratoderma —
  is the autosomal recessive neurocutaneous disease caused by biallelic loss of
  SNAP29, a SNARE protein on 22q11.2. Its coherence as one disease rests on a
  single cell-biological fact: SNAP29 is required for vesicle fusion, and the two
  tissues that suffer are the two that depend most conspicuously on regulated
  fusion events. In the epidermis, lamellar granules fail to mature, so the lipids
  and proteases they should deliver to the stratum corneum end up mislocated, the
  barrier fails and the skin becomes ichthyotic and hyperkeratotic. In the
  developing brain, the same trafficking defect accompanies cerebral malformation —
  corpus callosum dysgenesis and polymicrogyria — and a peripheral neuropathy.
  SNAP29 also participates in autophagosome-lysosome fusion, and knockout mouse
  epidermis accumulates LC3B-II with induction of the ER stress marker CHOP, which
  is why the disease is often discussed as an autophagy disorder as well as a
  SNARE one.

  The gene's position matters clinically. SNAP29 lies inside the region deleted in
  22q11.2 deletion syndrome, so a patient hemizygous for 22q11.2 who also carries a
  deleterious variant on the remaining allele can present with CEDNIK features.
  Expressivity is variable and penetrance incomplete: patients homozygous for the
  same c.486_487insA allele may show the full constellation or only the neurological
  part with no skin disease at all.
synonyms:
- CEDNIK
- cerebral dysgenesis, neuropathy, ichthyosis and keratoderma syndrome
- cerebral dysgenesis-neuropathy-ichthyosis-keratoderma syndrome
- SNAP29 deficiency

- name: Context-Dependent Autophagic Clearance Disturbance
  description: SNAP29 participates in autophagic membrane fusion, but loss does not produce an identical readout in every model. Zebrafish mutants accumulate LC3-II, p62 and abnormal multilamellar structures. Mouse fibroblast LC3-II elevation with unchanged p62 is compatible with increased autophagy induction; it does not prove a fusion block. Undifferentiated mouse ESCs retain low marker levels unless SNAP47 is also depleted.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL

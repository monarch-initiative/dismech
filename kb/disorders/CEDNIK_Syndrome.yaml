discussions:
- discussion_id: cednik_brain_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    What does loss of SNAP29-dependent vesicle fusion do in the developing brain to
    produce corpus callosum dysgenesis and polymicrogyria?
  attaches_to:
  - pathophysiology#Abnormal Neural Development
  - pathophysiology#Defective Mitotic Chromosome Segregation
  rationale: >-
    Human neuroepithelial stem-cell knockdown establishes Golgi, spindle and nuclear abnormalities; patient fibroblasts show defective recycling and motility. The unresolved question is which of these routes causes specific human malformations or myelin loss. Patient-derived neural models with isogenic correction and developmental readouts could distinguish these contributions.
- discussion_id: cednik_expressivity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which allele-dependent and background-dependent factors explain variable skin, myelin and developmental manifestations?
  attaches_to:
  - genetic#SNAP29
  rationale: >-
    The start-loss siblings have relatively preserved skills, yet one later regressed; skin-negative compound heterozygotes and variable keratoderma are documented. Protein mislocalization, residual translation and genetic background are distinguishable hypotheses. The mouse background effect demonstrates a model modifier effect, not a proven human modifier.
- discussion_id: cednik_autophagy_contribution
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    When does SNAP29 loss impair autophagic clearance, and how much does this contribute to human skin and neurological disease?
  attaches_to:
  - pathophysiology#Context-Dependent Autophagic Clearance Disturbance
  - pathophysiology#Endoplasmic Reticulum Stress
  rationale: >-
    The 2016 static LC3-II/p62/CHOP measurements were made in primary mouse fibroblasts and cannot distinguish induction from reduced clearance. Zebrafish and mouse ESCs show different marker responses, with a SNAP47-dependent effect in ESCs. Flux assays with appropriate turnover controls in patient keratinocytes and neural cells, alongside isogenic rescue, would test the contribution to human disease.
- discussion_id: cednik_model_brain_skin_divergence
  kind: HUMAN_MODEL_MISMATCH
  prompt: Which model backgrounds reproduce the human cortical and epidermal phenotypes?
  attaches_to:
  - animal_models#Mixed CD1/FvB Snap29 exon-2 knockouts
  - animal_models#snap29 K164* and N171fs zebrafish
  rationale: Mixed-background mice survive with a functional neonatal barrier and no detectable cortical malformations. Zebrafish have a thinner periderm rather than hyperkeratosis. These divergences matter when selecting readouts for rescue experiments; neurological or skin improvement in one model does not demonstrate correction of the corresponding human mechanism.
notes: >-
  The clinical spectrum is broader than the CEDNIK acronym: skin disease, neuropathy and cortical malformations are individually variable, and some individuals survive into adulthood. Cell-model pathways explain candidate disease mechanisms without establishing that every trafficking readout causes every human phenotype. The founding full text is cached under its legacy NCBI reader URL. The URL-titled Max Planck PDF cache is the accepted journal proof of Schiller et al., Establishment of Two Mouse Models for CEDNIK Syndrome (PMID:26747696); its title field retains the fetcher metadata.
diagnosis:
- name: Molecular diagnosis
  description: Sequence analysis of SNAP29, usually through exome or an appropriate panel, should be interpreted together with deletion/duplication assessment and parental segregation. Apparent homozygosity can reflect a variant opposite a deletion. Clinical suspicion is appropriate despite absent ichthyosis, keratoderma or polymicrogyria; uncertain missense predictions alone are insufficient to establish CEDNIK.
  evidence:
  - reference: PMID:33977139
    reference_title: New Cohort of Patients With CEDNIK Syndrome Expands the Phenotypic and Genotypic Spectra.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Clinical exome or targeted sequencing were performed to elucidate the molecular genetic cause
    explanation: The cohort was molecularly characterized.
  - reference: PMID:35093605
    reference_title: CEDNIK syndrome in a Brazilian patient with compound heterozygous pathogenic variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: each of these genetic variants inherited from one of the parents
    explanation: Segregation demonstrated the sequence-variant/deletion configuration.
- name: Brain MRI and longitudinal neurological assessment
  description: MRI characterizes cortical, callosal and white-matter abnormalities. Serial imaging may distinguish impaired myelination from later loss when the clinical course changes; the existing series does not establish a universal scanning interval.
  evidence:
  - reference: PMID:33977139
    reference_title: New Cohort of Patients With CEDNIK Syndrome Expands the Phenotypic and Genotypic Spectra.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Serial imaging in future patients could help determine which SNAP29 variants are associated with this pattern of white matter disease.
    explanation: The authors propose longitudinal imaging to clarify variable white-matter disease.
- name: Peripheral neurophysiology
  description: Nerve-conduction studies and electromyography can characterize suspected neuropathy and distinguish demyelinating or neurogenic findings.
  evidence:
  - reference: PMID:35359556
    reference_title: CErebral Dysgenesis, Neuropathy, Ichthyosis, and Keratoderma (CEDNIK) Syndrome with Brain Stem Malformation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the electroneurographic study was confirmatory for the presence of diffuse sensorimotor demyelinating polyneuropathy.
    explanation: Electrophysiology established the neuropathy subtype in this patient.
- name: Swallowing, hearing and visual assessment
  description: Clinical assessment is directed by feeding, hearing and visual difficulties. Swallow studies can detect aspiration; ophthalmologic and auditory evaluation distinguish optic-nerve, cortical, ocular and sensorineural abnormalities.

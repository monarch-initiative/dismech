genetic:
- name: SNAP29
  gene_term:
    preferred_term: SNAP29
    term:
      id: hgnc:11133
      label: SNAP29
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic loss of SNAP29 function causes a variable neurocutaneous disorder. Homozygous and compound heterozygous sequence variants, and sequence-variant/deletion combinations, are documented. Contiguous-gene deletions can add phenotypes attributable to other genes. Missense candidates proposed in the 2013 22q11.2 series were supported chiefly by prediction and should not be equated with its two truncating-variant CEDNIK cases.
  variants:
  - name: c.223delG (p.Val75Serfs*28)
    description: Founding frameshift, historically reported as c.220delG using a different numbering convention. Patient fibroblasts showed markedly reduced RNA and protein.
  - name: c.487dup (p.Ser163Lysfs*6)
    description: Historically described as c.486insA or c.486_487insA. Transfection and organotypic assays support loss of function; truncated protein can be expressed and mislocalized.
  - name: c.2T>C start-loss
    description: Homozygous in two siblings with relatively greater motor/language acquisition and compound heterozygous with c.354dupG in a skin-negative hypomyelinating presentation. Residual translation is hypothesized, not established.
  - name: c.622G>T (p.Glu208*)
    description: Last-exon stop variant in one patient; escape from nonsense-mediated decay is predicted rather than experimentally demonstrated.
  - name: c.85C>T (p.Arg29*)
    description: Homozygous in a molecularly confirmed patient; both parents were heterozygous. Nonsense-mediated decay or truncation was predicted.
  - name: Pathogenic sequence allele in trans with a SNAP29-containing deletion
    description: Recessive unmasking can occur within 22q11.2 deletion syndrome or with a smaller deletion; additional deleted genes complicate phenotype attribution.
  evidence:
  - reference: PMID:15968592
    reference_title: A mutation in SNAP29, coding for a SNARE protein involved in intracellular trafficking, causes a novel neurocutaneous syndrome characterized by cerebral dysgenesis, neuropathy, ichthyosis, and palmoplantar keratoderma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Using homozygosity mapping in two large families, we localized the disease gene to 22q11.2
    explanation: The founding families establish recessive inheritance.
  - reference: PMID:23231787
    reference_title: Hemizygous mutations in SNAP29 unmask autosomal recessive conditions and contribute to atypical findings in patients with 22q11.2DS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: as is the case with the SNAP29 abnormalities observed in patients 1 and 2 and their features of CEDNIK syndrome
    explanation: The primary deletion series supports recessive unmasking in its two truncating-variant cases.
  - reference: PMID:35093605
    reference_title: CEDNIK syndrome in a Brazilian patient with compound heterozygous pathogenic variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The patient presents a combination of a loss-of-function SNAP29 mutation and a ∼370 kb 22q11.2 deletion, each of these genetic variants inherited from one of the parents.
    explanation: A smaller deletion opposite a sequence allele is another documented configuration.
animal_models:
- name: C57BL/6 global and keratinocyte-specific Snap29 knockouts
  species: Mus musculus
  genotype: Global Snap29 knockout or Snap29 floxed / K14-Cre epidermal knockout
  publication: PMID:26747696
  description: Both lines develop severe congenital ichthyosis, acanthosis, hyperkeratosis, abnormal granules and neonatal lethality. Tissue-specific knockout demonstrates an epidermal requirement.
  modeled_mechanisms:
  - target: Lamellar Granule Maturation Failure
    description: Models abnormal granules and reduced cargo secretion.
    evidence:
    - reference: url:https://pure.mpg.de/rest/items/item_2248126/component/file_2248124/content
      reference_title: https://pure.mpg.de/rest/items/item_2248126/component/file_2248124/content
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The amount of secreted LB contents between SG and SC was strongly reduced in mutant epidermis
      explanation: Electron microscopy directly demonstrates diminished secretion.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Normal-appearing granules coexist with malformed structures; severity exceeds human skin disease.
    fidelity: MODERATE
  - target: Epidermal Barrier Impairment
    description: Directly tests permeability and water loss.
    evidence:
    - reference: url:https://pure.mpg.de/rest/items/item_2248126/component/file_2248124/content
      reference_title: https://pure.mpg.de/rest/items/item_2248126/component/file_2248124/content
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Both experiments indicate severe functional impairment of the epidermal barrier.
      explanation: Dye intrusion and dehydration directly test the barrier in mutant mice.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Neonatal barrier lethality and acanthosis are model-specific divergences from typical CEDNIK.
    fidelity: MODERATE
- name: Mixed CD1/FvB Snap29 exon-2 knockouts
  species: Mus musculus
  genotype: Two exon-2 deletion lines maintained on a mixed CD1/FvB background
  publication: PMID:31633066
  description: Most mutants survive to adulthood. They show variable skin disease, gait and grip abnormalities and retinal defects. Male infertility is a mouse finding and is not established as a human CEDNIK feature.
  modeled_mechanisms:
  - target: Epidermal Barrier Impairment
    description: Tests delayed prenatal barrier acquisition followed by normalization.
    evidence:
    - reference: PMID:31633066
      reference_title: Snap29 mutant mice recapitulate neurological and ophthalmological abnormalities associated with 22q11 and CEDNIK syndrome.
      supports: NO_EVIDENCE
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: although skin barrier formation is delayed in homozygous mutant embryos, a proper skin barrier was present at birth.
      explanation: The mixed-background model limits generalization of the neonatal barrier defect.
    relationship: FAILS_TO_RECAPITULATE
    model_scale: CELLULAR
    limitations: A functional barrier exists at birth despite later skin changes, unlike the C57BL/6 model.
    fidelity: MODERATE
  - target: Abnormal Neural Development
    description: Tests whether mutant mice reproduce human brain malformations.
    evidence:
    - reference: PMID:31633066
      reference_title: Snap29 mutant mice recapitulate neurological and ophthalmological abnormalities associated with 22q11 and CEDNIK syndrome.
      supports: NO_EVIDENCE
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: we did not detect any morphological changes during neurogenesis or in adult brains
      explanation: The primary study explicitly reports the negative structural result.
    relationship: FAILS_TO_RECAPITULATE
    model_scale: CELLULAR
    limitations: Motor and retinal abnormalities occur without detectable cortical malformations; sporadic seizures were observed but not systematically quantified.
    fidelity: MODERATE
- name: snap29 K164* and N171fs zebrafish
  species: Danio rerio
  genotype: ENU K164* and CRISPR frameshift alleles; detailed phenotyping chiefly K164*
  publication: PMID:30718891
  description: Mutants develop microcephaly, early apoptotic-cell excess, neuromuscular disorganization, feeding failure and early death. K164* RNA is markedly reduced; the frameshift allele retains RNA. Transient GFP-snap29 expression improves selected phenotypes and prolongs survival without a durable adult rescue.
  modeled_mechanisms:
  - target: Altered Motor Neuron Organization
    description: Models missing trigeminal motor nuclei and axonal hyperbranching.
    evidence:

    reference_title: "Expanding the Molecular and Clinical Phenotype of SSR4-CDG."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Western blot analysis revealed that the mutations caused a complete loss of
      SSR4 protein.
    explanation: Protein-level measurement in patient fibroblasts showing the variants are null.
  - reference: PMID:39653760
    reference_title: "Intron retention caused by a canonical splicing variant in SSR4-related congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This aberrant mRNA splicing resulted in the occurrence of a premature
      termination codon, triggered nonsense-mediated mRNA decay, and decreased the
      SSR4 gene expression.
    explanation: Shows how a canonical splice allele reaches loss of function through NMD.

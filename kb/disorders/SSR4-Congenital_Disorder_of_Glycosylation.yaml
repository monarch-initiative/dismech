- name: ER Stress Response Activation
  biological_scale: CELLULAR
  description: >
    TRAP loss activates ER stress signalling, with increased XBP1 splicing early
    after SSR4 knockout and a later adaptive fall. Its contribution to the
    clinical phenotype is not established, so the node is not wired to any
    phenotype.
  biological_processes:

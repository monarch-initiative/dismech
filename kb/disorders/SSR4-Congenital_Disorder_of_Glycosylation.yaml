    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now report eight affected males with either de novo (4) or inherited (4)
      loss of function mutations in SSR4.
    explanation: >-
      Affected males carrying hemizygous SSR4 variants, half inherited from a
      carrier mother, which is the X-linked recessive pattern.
  - reference: PMID:26264460
    reference_title: "Expanding the Molecular and Clinical Phenotype of SSR4-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The older sister has a milder phenotype compared to her brother and analysis
      of her blood samples showed skewing favoring the paternal (non-deleted)
      allele.
    explanation: >-
      Heterozygous female relatives show skewed X-inactivation and a milder
      presentation than hemizygous males.

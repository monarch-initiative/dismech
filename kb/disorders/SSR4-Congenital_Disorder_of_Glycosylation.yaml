- name: TRAP Complex Destabilization
  biological_scale: MOLECULAR
  description: >
    In patient fibroblasts, loss of SSR4 lowers the levels of the other TRAP
    subunits, and re-expressing wild-type SSR4 partially restores them. The
    generality of this is contested: in CRISPR knockout clones of the A549 cell
    line, loss of SSR4 did not eliminate the other subunits (SSR2 was the
    subunit that stabilised the others). Both results are recorded.
  cellular_components:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  evidence:
  - reference: PMID:24218363
    reference_title: "A new congenital disorder of glycosylation caused by a mutation in SSR4, the signal sequence receptor 4 protein of the TRAP complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overexpression of the wild-type SSR4 allele partially restores glycosylation
      of the marker and of the other members of the TRAP complex.
    explanation: Rescue in patient fibroblasts ties the loss of the other subunits to SSR4 itself.
  - reference: PMID:33523898
    reference_title: "The translocon-associated protein (TRAP) complex regulates quality control of N-linked glycosylation during ER stress."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Comparison of SSR1, SSR2, SSR3, and SSR4 protein levels in three individual
      clones of SSR1–4 KOs was consistent and revealed that complete or significant
      reduction of SSR1, SSR3, or SSR4 protein levels did not eliminate protein
      levels of the other subunits
    explanation: >-
      In engineered knockout cell lines, SSR4 loss did not abolish the other TRAP
      subunits. Graded INDIRECT because these are A549 knockout clones rather than
      patient cells.
  downstream:
  - target: Reduced N-Glycosylation Efficiency at the Translocon
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24218363
      reference_title: "A new congenital disorder of glycosylation caused by a mutation in SSR4, the signal sequence receptor 4 protein of the TRAP complex."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This is the first evidence that the TRAP complex, which binds to the
        oligosaccharyltransferase complex, is directly involved in N-glycosylation.
      explanation: Links TRAP complex loss to the glycosylation defect.
- name: Reduced N-Glycosylation Efficiency at the Translocon
  biological_scale: CELLULAR
  description: >
    Without a functional TRAP complex, nascent glycoproteins entering the ER are
    less efficiently N-glycosylated, so some sequons are left unoccupied. This is
    a type I (assembly/transfer) defect, measurable in patient fibroblasts with a
    glycosylation reporter and in serum as reduced glycan-site occupancy of
    transferrin. In knockout cell lines the defect is most pronounced under ER
    stress and partly adapts over time, which may help explain why serum
    transferrin is often only marginally abnormal.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  evidence:
  - reference: PMID:24218363
    reference_title: "A new congenital disorder of glycosylation caused by a mutation in SSR4, the signal sequence receptor 4 protein of the TRAP complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The glycosylation marker Glyc-ER-GFP was used to confirm the
      underglycosylation in fibroblasts from the patient.
    explanation: Direct measurement of underglycosylation in patient cells.
  - reference: PMID:41441028
    reference_title: "Multi-Omics Characterization of a Novel SSR4 Variant in Congenital Disorders of Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transferrin glycopeptide LC-MS/MS showed impaired N-glycan occupancy at both
      glycosylation sites (Asn432 and Asn630), with reduced fully sialylated
      glycoforms and increased non-glycosylated peptides.
    explanation: Site-level evidence in patient serum that the defect is one of glycan occupancy.
  - reference: PMID:33523898
    reference_title: "The translocon-associated protein (TRAP) complex regulates quality control of N-linked glycosylation during ER stress."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Activation of ER stress or silencing of the ER chaperone BiP exacerbates or
      rescues the glycosylation defects, respectively, indicating that SSR3 and
      SSR4 enable N-glycosylation during ER stress.
    explanation: >-
      Knockout cell lines show SSR4 is needed for N-glycosylation, most clearly
      under ER stress. Graded INDIRECT because these are engineered cell lines, not
      patient cells.
  downstream:
  - target: Type I transferrin isoform profile
    causal_link_type: DIRECT
    evidence:

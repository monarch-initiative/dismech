genetic:
- name: SSR4
  notes: >
    SSR4 (Xq28) encodes the delta subunit of the TRAP complex. Reported alleles
    are predominantly null: whole-gene and contiguous Xq28 deletions (one
    including part of ABCD1), nonsense, frameshift and canonical splice variants
    that trigger nonsense-mediated decay. A maternally inherited in-frame
    insertion-deletion was later reclassified as likely pathogenic after
    transcript analysis showed aberrant transcripts and modelling suggested
    destabilisation of the beta-barrel domain.
  gene_term:
    preferred_term: SSR4
    term:
      id: hgnc:11326
      label: SSR4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:24218363
    reference_title: "A new congenital disorder of glycosylation caused by a mutation in SSR4, the signal sequence receptor 4 protein of the TRAP complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a de novo variant in the X-linked SSR4 gene which encodes a
      protein of the heterotetrameric translocon-associated protein (TRAP) complex.
    explanation: The founding report identifying SSR4 as the cause of this CDG.
  - reference: PMID:26264460
    reference_title: "Expanding the Molecular and Clinical Phenotype of SSR4-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now report eight affected males with either de novo (4) or inherited (4)
      loss of function mutations in SSR4.
    explanation: Independent replication of SSR4 loss of function in eight further males.
  - reference: PMID:41210240
    reference_title: "Novel SSR4 gene splice variant leads to congenital disorder of glycosylation, type Iy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Up to date, all of the pathogenic SSR4 gene variants were null variants.
    explanation: Establishes loss of function as the allelic mechanism across the reported spectrum.
  - reference: PMID:42463952
    reference_title: "Clinical and molecular expansion of SSR4-CDG: an adult patient and pathogenic interpretation of an in-frame variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Repeat glycan analysis revealed a CDG type I pattern, transcript analysis
      demonstrated aberrant transcripts with an expanded deletion, and structural
      modeling suggested destabilization of the β-barrel domain of SSR4, together
      supporting reclassification as likely pathogenic.
    explanation: >-
      Extends the allelic spectrum to an in-frame variant, with the reclassification
      resting on biochemical, transcript and structural evidence.
pathophysiology:
- name: SSR4 Loss of Function
  biological_scale: MOLECULAR
  description: >
    Hemizygous null variants abolish SSR4 protein. Splice variants act through
    aberrant transcripts that are degraded by nonsense-mediated decay.
  genes:
  - preferred_term: SSR4

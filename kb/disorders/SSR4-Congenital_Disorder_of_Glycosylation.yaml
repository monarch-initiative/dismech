name: SSR4-Congenital Disorder of Glycosylation
creation_date: "2026-09-29T21:00:00Z"
category: Mendelian
description: >
  SSR4-CDG (CDG-Iy) is an ultra-rare X-linked congenital disorder of N-linked
  glycosylation caused by hemizygous loss-of-function variants in SSR4 (Xq28),
  which encodes the delta subunit of the heterotetrameric translocon-associated
  protein (TRAP) complex of the endoplasmic reticulum membrane. The TRAP complex
  sits at the Sec61 translocon beside the oligosaccharyltransferase, and its loss
  reduces the efficiency with which nascent glycoproteins receive their N-glycans,
  giving a type I (glycan-site occupancy) transferrin pattern that is often only
  marginally abnormal or even normal.

  Affected individuals are almost all males, with roughly half of variants de novo
  and half maternally inherited. The core phenotype, reported in every described
  patient, is global developmental delay with speech delay, intellectual
  disability, muscular hypotonia, microcephaly and a recognisable facial gestalt
  (deep-set eyes, wide mouth). Feeding difficulties, failure to thrive,
  gastrointestinal reflux, strabismus and seizures are common, and a
  connective-tissue component (redundant skin, joint laxity, blue sclerae,
  vascular tortuosity), congenital heart defects, cardiomyopathy and behavioural
  problems extend the spectrum. Survival into adulthood is documented. There is no
  causal therapy.

diagnosis:
- name: Exome sequencing
  description: >
    Most patients are diagnosed by exome sequencing, because the transferrin
    abnormality is mild or absent and the clinical picture overlaps with many
    neurodevelopmental disorders. Copy-number analysis is needed as well, since
    whole-gene and contiguous Xq28 deletions are a recurrent allele class.
  evidence:
  - reference: PMID:38805916
    reference_title: "SSR4-CDG, an ultra-rare X-linked congenital disorder of glycosylation affecting the TRAP complex: Review of 22 affected individuals including the first adult patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to lack of awareness of this rare disorder, and since biochemical testing
      can be normal in affected individuals, most are diagnosed through genetic
      studies, such as whole exome sequencing.
    explanation: Establishes genetic testing as the usual diagnostic route.
- name: Serum transferrin glycoform analysis
  description: >
    Transferrin isoform analysis shows a type I pattern that supports the
    diagnosis, but is often only marginally abnormal or normal. Site-specific
    transferrin glycopeptide mass spectrometry can show the reduced glycan-site
    occupancy directly.
  evidence:
  - reference: PMID:33300232
    reference_title: "Expanding the phenotype of X-linked SSR4-CDG: Connective tissue implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All subjects presented with hypotonia, failure to thrive, developmental
      delay, and dysmorphic traits and showed a type 1 serum sialotransferrin
      profile, facilitating the diagnosis.
    explanation: A type 1 profile helped diagnosis in this series.
  - reference: PMID:26264460
    reference_title: "Expanding the Molecular and Clinical Phenotype of SSR4-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In nearly all cases, the abnormal glycosylation of serum transferrin was only
      slightly above the accepted normal cutoff range.
    explanation: Explains the limited sensitivity of the screening test.
treatments:
- name: Supportive and multidisciplinary care
  description: >
    No causal therapy exists. Management is symptomatic: feeding and nutritional
    support, anticonvulsant treatment, developmental and behavioural support, and
    cardiac evaluation.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38805916
    reference_title: "SSR4-CDG, an ultra-rare X-linked congenital disorder of glycosylation affecting the TRAP complex: Review of 22 affected individuals including the first adult patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We emphasize the great need for causal therapies, as well as effective
      symptomatic therapies addressing the multitude of symptoms in this disease.
    explanation: States that management is currently symptomatic with no causal therapy.
- name: Preventive rehabilitation for connective tissue involvement
  description: >
    Rehabilitation measures directed at the joint laxity and related
    connective-tissue signs.
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Connective Tissue Involvement
  evidence:
  - reference: PMID:33300232
    reference_title: "Expanding the phenotype of X-linked SSR4-CDG: Connective tissue implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The connective tissue problems are relevant, and require preventive
      rehabilitation measures.
    explanation: Recommends preventive rehabilitation for the connective-tissue component.
- name: Genetic counseling
  description: >
    X-linked inheritance with frequent maternal transmission makes carrier
    testing of the mother and counselling on recurrence risk important.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33300232
    reference_title: "Expanding the phenotype of X-linked SSR4-CDG: Connective tissue implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As an X-linked disorder, genetic counseling is essential.
    explanation: Recommends genetic counselling on the basis of the X-linked inheritance.
notes: >
  The GeneReviews chapter covering this disorder (PMID:20301507, Congenital
  Disorders of N-Linked Glycosylation and Multiple Pathway Overview) is retired and
  kept for historical reference only; it is tagged in references but not used as
  evidence. The related TRAP-complex disorder SSR3-CDG has no
  dismech entry at the time of writing. The TRAP-destabilisation step rests on
  patient fibroblasts from the index case; engineered knockout cell lines disagree,
  and both results are recorded on that node.

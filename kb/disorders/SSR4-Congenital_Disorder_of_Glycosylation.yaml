inheritance:
- name: X-linked Recessive
  description: >
    Hemizygous males are affected. About half of reported variants arose de novo
    and half were maternally inherited; heterozygous carrier mothers and sisters
    have been described with skewed X-inactivation favouring the normal allele and
    at most a mild phenotype.
  inheritance_term:

    evidence:
    - reference: PMID:34390869
      reference_title: "Of men and mice: Human X-linked retinoschisis and fidelity in mouse modeling."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The faithful phenotype of the XLRS mouse has assisted in delineating the disease pathophysiology."
      explanation: >
        Supports treating this model as informative for the human mechanism.
        Evidence source is OTHER because this is a review of the mouse
        literature rather than a primary model-organism report.
  - target: Failure of Retinoschisin Octamer-Mediated Retinal Cell Adhesion
    relationship: RESCUES
    fidelity: MODERATE
    description: >
      AAV8-RS1 delivery under the native promoter restores retinal structure and
      synaptic function in the mutant mouse, providing the rescue arm that
      motivated the human trial.
    limitations: >
      Rescue was achieved by subretinal-scale exposure in a small eye; the human
      trial used intravitreal delivery, where vector must cross the inner
      limiting membrane, and produced only transient cavity closure in one of
      nine participants.
    readouts:
    - name: Schisis-associated retinal microglial activation
      target: Failure of Retinoschisin Octamer-Mediated Retinal Cell Adhesion
      direction: DECREASED
      interpretation: >
        Restoring the adhesion protein quiets the inflammatory response the
        cavities provoke, indicating the microglial phenotype is downstream of
        the adhesion failure rather than an independent process.
      evidence:
      - reference: PMID:34390869
        reference_title: "Of men and mice: Human X-linked retinoschisis and fidelity in mouse modeling."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "It also ameliorates the schisis-induced inflammatory microglia phenotype toward a state of immune quiescence."
        explanation: >
          Reports the microglial readout and the direction of change after gene
          delivery. Evidence source is OTHER because this is a review.

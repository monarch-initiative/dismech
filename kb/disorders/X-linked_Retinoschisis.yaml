genetic:
- name: RS1
  association: Hemizygous loss-of-function variants in males
  notes: >
    RS1 encodes retinoschisin, a secreted discoidin-domain cell adhesion protein
    that assembles into disulfide-linked homo-octamers. Pathogenic variants
    include null alleles and missense changes that map to the octamer assembly
    interfaces; the latter cause disease by preventing correct assembly rather
    than by preventing expression.
  gene_term:
    preferred_term: RS1
    term:
      id: hgnc:10457
      label: RS1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:34390869
    reference_title: "Of men and mice: Human X-linked retinoschisis and fidelity in mouse modeling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It results from loss-of-function RS1 gene mutations on the X-chromosome."
    explanation: >
      Assigns causation to loss-of-function RS1 variants. Evidence source is
      OTHER because this is a comprehensive review.
  - reference: PMID:15644328
    reference_title: "RS1, a discoidin domain-containing retinal cell adhesion protein associated with X-linked retinoschisis, exists as a novel disulfide-linked octamer."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results indicate that RS1 exists as a novel octamer in which the eight subunits are joined together by Cys(59)-Cys(223) intermolecular disulfide bonds."
    explanation: >
      Establishes the octameric, disulfide-linked architecture referenced in
      this gene's notes and in the central effector node.
treatments:
- name: Topical Carbonic Anhydrase Inhibitor (Dorzolamide)
  description: >
    Topical dorzolamide 2% reduces the cystic macular cavities in a majority of
    treated eyes, presumably by promoting fluid transport out of the retina
    across the retinal pigment epithelium. It does not address the adhesion
    defect, response is not universal, and rebound of cysts on continued therapy
    is described, so it is symptomatic management of the cavity rather than
    disease modification.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dorzolamide
      term:
        id: CHEBI:4702
        label: dorzolamide
  target_mechanisms:
  - target: Intraretinal Schisis Cavity Formation
    treatment_effect: INHIBITS
    description: >
      Carbonic anhydrase inhibition reduces the size of established schisis
      cavities without correcting the upstream adhesion failure that produced
      them, which is why it is wired to this node rather than to the central
      effector.
    evidence:
    - reference: PMID:20142541
      reference_title: "Efficacy of sustained topical dorzolamide therapy for cystic macular lesions in patients with X-linked retinoschisis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Among the 15 patients with XLRS, 20 eyes (69%) of 11 patients showed a positive response to treatment."
      explanation: >
        Quantifies the cavity response rate in the retrospective series that
        established this practice.
  evidence:
  - reference: PMID:20142541
    reference_title: "Efficacy of sustained topical dorzolamide therapy for cystic macular lesions in patients with X-linked retinoschisis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with XLRS have the potential to experience a beneficial effect from sustained treatment with dorzolamide, 2%."
    explanation: >
      The authors' own hedged conclusion. Marked PARTIAL because the study is a
      retrospective uncontrolled analysis of 29 eyes reporting the potential for
      benefit, not a controlled demonstration of it.
- name: AAV8-RS1 Gene Augmentation Therapy
  description: >
    Intravitreal delivery of an AAV8 vector carrying RS1 under its own promoter,
    intended to restore retinoschisin and with it retinal adhesion. In XLRS
    mice it restores retinal structure and synaptic function and quiets the
    schisis-induced microglial response. A phase I/IIa three-dose-escalation
    trial in nine men found the vector generally tolerated with dose-related
    ocular inflammation that resolved on corticosteroids; cavities closed
    transiently in one participant. Investigational, not approved.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Failure of Retinoschisin Octamer-Mediated Retinal Cell Adhesion
    treatment_effect: RESTORES
    description: >
      Supplying wild-type RS1 restores the secreted adhesion protein itself,
      acting on the disease's central effector rather than on a downstream
      consequence.
    evidence:
    - reference: PMID:34390869
      reference_title: "Of men and mice: Human X-linked retinoschisis and fidelity in mouse modeling."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Delivery to XLRS mouse retina of an AAV8-RS1 construct under control of the RS1 promoter restores the retinal structure and synaptic function (with increase of b-wave amplitude)."
      explanation: >
        Demonstrates in the mouse model that restoring the gene restores both
        the structural and the synaptic consequences of the adhesion failure.
        Evidence source is OTHER because this is a review.
  evidence:
  - reference: PMID:30196853
    reference_title: "Retinal AAV8-RS1 Gene Therapy for X-Linked Retinoschisis: Initial Findings from a Phase I/IIa Trial by Intravitreal Delivery."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular events included dose-related inflammation that resolved with topical and oral corticosteroids."
    explanation: >
      Reports the principal safety finding of the first-in-human trial. Marked
      PARTIAL because the trial established tolerability with only transient
      cavity closure in one participant, not efficacy.
- name: Avoidance of Head Trauma and Contact Sports
  description: >
    Because the split retina is mechanically fragile, avoiding head trauma and
    high-contact sports reduces the risk of the two acute complications that
    threaten sudden vision loss. This is the only intervention in XLRS directed
    at preventing the complications rather than managing the established
    lesion.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Retinal Fragility, Haemorrhage and Detachment
    treatment_effect: INHIBITS
    description: >
      Reducing mechanical insult to a structurally fragile retina lowers the
      probability of the haemorrhage and detachment this node models; it does
      not affect the underlying adhesion defect.
  evidence:
  - reference: PMID:20301401
    reference_title: "X-Linked Congenital Retinoschisis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Agents/circumstances to avoid: Head trauma and high-contact sports to reduce risk of retinal detachment and vitreous hemorrhage."
    explanation: >
      GeneReviews states this avoidance recommendation and the specific
      complications it targets. Evidence source is OTHER because GeneReviews is
      an expert-curated clinical synthesis rather than a primary study.

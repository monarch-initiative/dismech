name: X-linked Retinoschisis
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
description: >
  X-linked retinoschisis (XLRS) is an early-onset, bilateral retinal dystrophy of
  males caused by loss-of-function variants in RS1, which encodes retinoschisin.
  Retinoschisin is an oddity among cell adhesion proteins: it is secreted rather
  than membrane-anchored, and it works by assembling into disulfide-linked
  octamers that pair into double rings and staple neighbouring retinal cell
  membranes together. Without it the retina literally splits - cystic schisis
  cavities open within the inner nuclear and outer plexiform layers, most
  conspicuously at the fovea, where the spoke-wheel appearance is diagnostic.
  The functional consequence follows from where the split runs: it severs signal
  transmission from photoreceptors to ON-bipolar cells, so the electroretinogram
  shows a b-wave reduced out of proportion to the a-wave, the "electronegative"
  pattern that distinguishes XLRS from a photoreceptor dystrophy. Acuity is
  reduced from young childhood, and the fragile split retina is prone to
  vitreous haemorrhage and retinal detachment. There is no approved
  disease-modifying therapy; topical carbonic anhydrase inhibitors reduce the
  cavities in a majority of eyes, and intravitreal AAV8-RS1 gene augmentation has
  completed a phase I/IIa dose-escalation trial.

  This entry deliberately declares no conforms_to on any node. XLRS is a
  failure of extracellular adhesion between retinal cells, not a photoreceptor
  degeneration, a phototransduction cascade lesion or a visual cycle defect, so
  none of the retinal modules currently in the KB describes its mechanism. Note
  in particular that it is NOT wired to phototransduction_cascade_dysfunction
  despite sharing an electronegative electroretinogram with the
  Schubert-Bornschein congenital stationary night blindness forms: that waveform
  is a shared readout of interrupted transmission, not evidence of a shared
  mechanism, and that module explicitly excludes transmission defects.

- name: RS1 mutant XLRS mouse
  species: Mouse
  genotype: Rs1 loss-of-function (multiple independent mutant lines)
  description: >
    Several independently generated Rs1 mutant mouse lines reproduce the human
    disease with outer plexiform and inner nuclear layer schisis cavities, early
    onset, phenotypic variability across lines, and a reduced b-wave to a-wave
    amplitude ratio. The fidelity of the model is what allowed the
    pathophysiology to be worked out and the gene therapy to be tested
    preclinically.
  publication: PMID:34390869
  modeled_mechanisms:
  - target: Intraretinal Schisis Cavity Formation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      Reproduces the cavities in the same retinal layers as the human disease,
      with the same electrophysiological signature.
    limitations: >
      The mouse retina has no fovea, so the foveoschisis that dominates the
      human presentation and determines human acuity has no counterpart in the
      model; phenotype also varies across independently derived mutant lines.
    readouts:
    - name: ERG b-wave to a-wave amplitude ratio
      target: Intraretinal Schisis Cavity Formation
      direction: DECREASED
      interpretation: >
        Electrophysiological correlate of the transmission failure produced by
        the cavities, matching the electronegative ERG of affected men.
      evidence:
      - reference: PMID:34390869
        reference_title: "Of men and mice: Human X-linked retinoschisis and fidelity in mouse modeling."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "Several independent XLRS mouse models with mutant RS1 were created that recapitulate features of human XLRS disease, with OPL-INL schisis cavities, early onset and variable phenotype across mutant models, and reduced ERG b-wave to a-wave amplitude ratio."
        explanation: >
          Reports the readout and its direction across the independent mutant
          lines. Evidence source is OTHER because the publication is a review
          synthesizing results from several independently derived mouse lines,

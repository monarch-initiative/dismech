      label: X-linked recessive inheritance
  description: >
    XLRS affects males essentially exclusively; heterozygous female carriers are
    generally spared, and are typically identified only through family studies
    rather than through symptoms.
  evidence:
  - reference: PMID:34390869
    reference_title: "Of men and mice: Human X-linked retinoschisis and fidelity in mouse modeling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "X-linked Retinoschisis (XLRS) is an early-onset transretinal dystrophy, often with a prominent macular component, that affects males and generally spares heterozygous females because of X-linked recessive inheritance."
    explanation: >
      States the inheritance pattern and the observation that carrier females
      are generally unaffected. Evidence source is OTHER because this is a
      comprehensive review.
pathophysiology:
- name: RS1 Loss of Function
  description: >
    A hemizygous loss-of-function variant in RS1 abolishes or cripples
    retinoschisin. Because the protein works as an assembly, the disease is not
    confined to variants that stop production: missense changes at the interfaces
    within and between the octamer rings are themselves pathogenic, and mutations
    that prevent correct subunit assembly cause XLRS just as null alleles do.
    RS1 is expressed principally by photoreceptors and inner nuclear layer
    bipolar neurons - the two cell classes on either side of the layer that
    subsequently splits.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  - preferred_term: retinal bipolar neuron
    term:
      id: CL:0000748
      label: retinal bipolar neuron
  biological_processes:
  - preferred_term: Cell-cell adhesion
    term:
      id: GO:0098609
      label: cell-cell adhesion
    modifier: DECREASED
  evidence:
  - reference: PMID:34390869
    reference_title: "Of men and mice: Human X-linked retinoschisis and fidelity in mouse modeling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "RS1 gene expression is localized mainly to photoreceptors and INL bipolar neurons, and RS1 protein is thought to play a critical cell adhesion role during normal retinal development and later for maintenance of retinal structure."
    explanation: >
      Establishes both the expressing cell types this node names and the
      adhesion function whose loss initiates the cascade. Evidence source is
      OTHER because this is a review.
  - reference: PMID:15644328
    reference_title: "RS1, a discoidin domain-containing retinal cell adhesion protein associated with X-linked retinoschisis, exists as a novel disulfide-linked octamer."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Because mutations that disrupt subunit assembly cause X-linked retinoschisis, the assembly of RS1 into a disulfide-linked homo-octamer appears to be critical for its function as a retinal cell adhesion protein."
    explanation: >
      Supports the specific claim that assembly-disrupting variants, not only
      null alleles, cause the disease - the reason this node is framed as loss
      of a functional assembly rather than loss of a protein.
  downstream:
  - target: Failure of Retinoschisin Octamer-Mediated Retinal Cell Adhesion
    causal_link_type: DIRECT

- name: Failure of Retinoschisin Octamer-Mediated Retinal Cell Adhesion
  description: >
    Retinoschisin is secreted as a soluble protein and then does something no
    other known cell adhesion molecule does: it assembles extracellularly into
    disulfide-linked octamers that pair into double rings, and couples
    neighbouring membranes together through octamer-octamer contacts. Cryo-EM
    places the residues implicated in XLRS at the interfaces within and between
    those rings, which is direct structural evidence that the disease mechanism
    is failure of the assembly rather than failure of secretion alone. Without
    the staple, the mechanical cohesion of the inner retina is lost.
  role: central_effector
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  - preferred_term: retinal bipolar neuron
    term:
      id: CL:0000748
      label: retinal bipolar neuron
  biological_processes:
  - preferred_term: Cell adhesion
    term:
      id: GO:0007155
      label: cell adhesion
    modifier: DECREASED
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:27114531
    reference_title: "Paired octamer rings of retinoschisin suggest a junctional model for cell-cell adhesion in the retina."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Retinoschisin (RS1) is involved in cell-cell junctions in the retina, but is unique among known cell-adhesion proteins in that it is a soluble secreted protein."
    explanation: >
      Establishes the unusual secreted-adhesion mechanism this node models.
  - reference: PMID:27114531
    reference_title: "Paired octamer rings of retinoschisin suggest a junctional model for cell-cell adhesion in the retina."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The interfaces internal to and between rings feature residues implicated in X-linked retinoschisis, indicating the importance of correct assembly."
    explanation: >
      Provides the structural evidence that disease-causing residues map to the
      assembly interfaces, which is the specific claim this node rests on.
  downstream:
  - target: Intraretinal Schisis Cavity Formation
    causal_link_type: DIRECT

- name: Intraretinal Schisis Cavity Formation
  description: >
    Loss of adhesion allows the neurosensory retina to split, opening cystic
    cavities within the inner nuclear and outer plexiform layers. The fovea is
    affected most conspicuously, giving the spoke-wheel foveoschisis seen on
    fundus examination and the petaloid cystic cavities resolved on optical
    coherence tomography; peripheral schisis occurs in about half of patients.
    Splitting is present from early childhood rather than developing over
    decades, which is why XLRS presents at school age with poor vision rather
    than with progressive later loss.
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: Retina layer formation
    term:
      id: GO:0010842
      label: retina layer formation
    modifier: ABNORMAL
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:34390869
    reference_title: "Of men and mice: Human X-linked retinoschisis and fidelity in mouse modeling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "XLRS causes bilateral reduced acuities from young age, and on clinical exam and by ocular coherence tomography (OCT) the neurosensory retina shows foveo-macular cystic schisis cavities in the outer plexiform (OPL) and inner nuclear layers (INL)."
    explanation: >
      Localizes the cavities to the specific retinal layers this node names and
      confirms the early-childhood onset. Evidence source is OTHER because this
      is a review.
  downstream:
  - target: Disrupted Photoreceptor-to-Bipolar Synaptic Transmission
    causal_link_type: DIRECT
  - target: Retinal Fragility, Haemorrhage and Detachment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Disrupted Photoreceptor-to-Bipolar Synaptic Transmission
  description: >
    The functional heart of the disease, and a direct consequence of where the
    split runs. The outer plexiform layer is the synaptic layer connecting
    photoreceptor terminals to bipolar dendrites; a cavity opening there and in
    the inner nuclear layer disorganizes that connection and interrupts signal
    transmission to ON-bipolar cells. The electroretinographic signature is
    therefore a b-wave reduced out of proportion to the a-wave - the
    electronegative ERG - which is what separates XLRS from a primary
    photoreceptor dystrophy at the bedside. Note that this places XLRS
    mechanistically alongside the Schubert-Bornschein forms of congenital
    stationary night blindness as a transmission defect, not a phototransduction
    defect, although the lesion here is structural rather than synaptic.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal bipolar neuron
    term:
      id: CL:0000748
      label: retinal bipolar neuron
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: Chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: DECREASED
  - preferred_term: Synapse organization
    term:
      id: GO:0050808
      label: synapse organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34390869
    reference_title: "Of men and mice: Human X-linked retinoschisis and fidelity in mouse modeling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "INL disorganization disrupts synaptic signal transmission from photoreceptors to ON-bipolar cells, and this reduces the electroretinogram (ERG) bipolar b-wave disproportionately to photoreceptor a-wave changes."
    explanation: >
      States this node's mechanism and its objective electrophysiological
      readout in one sentence. Evidence source is OTHER because this is a
      review.
  downstream:
  - target: Early-Onset Bilateral Visual Impairment
    causal_link_type: DIRECT

- name: Retinal Fragility, Haemorrhage and Detachment
  description: >
    A split retina is a mechanically weak retina. Vessels bridging a schisis
    cavity may rupture into the vitreous, and the inner wall of a large cavity
    may tear, so vitreous haemorrhage and rhegmatogenous or combined retinal
    detachment are the acute complications that threaten sudden, sometimes
    permanent, vision loss on top of the stable baseline deficit. These events
    are the reason XLRS requires ongoing surveillance despite being an
    essentially non-progressive dystrophy in most patients.
  role: consequence
  biological_scale: ORGANISM
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:30196853
    reference_title: "Retinal AAV8-RS1 Gene Therapy for X-Linked Retinoschisis: Initial Findings from a Phase I/IIa Trial by Intravitreal Delivery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retinoschisin protein is secreted principally in the outer retina, and its absence results in retinal cavities, synaptic dysfunction, reduced visual acuity, and susceptibility to retinal detachment."
    explanation: >
      Names susceptibility to retinal detachment as a direct consequence of the
      cavities, supporting this node's placement downstream of schisis
      formation.

- name: Early-Onset Bilateral Visual Impairment
  description: >
    Acuity is bilaterally reduced from young childhood, typically to the 20/60
    to 20/120 range. The course is not flat: acuity often deteriorates through
    the first and second decades and only then remains relatively stable, until
    the fifth or sixth decade. Presentation ranges from infancy to school age.
    There are
    no reliable genotype-phenotype correlations, so the causative variant does
    not predict severity and cannot be used to counsel prognosis - a notable
    contrast with most inherited retinal dystrophies.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  evidence:
  - reference: PMID:34390869
    reference_title: "Of men and mice: Human X-linked retinoschisis and fidelity in mouse modeling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "XLRS manifests between infancy and school-age with variable phenotypic presentation and without reliable genotype-phenotype correlations."
    explanation: >
      Supports both the age range and the specific negative claim about
      genotype-phenotype correlation that this node makes. Evidence source is
      OTHER because this is a review.
  - reference: PMID:20301401
    reference_title: "X-Linked Congenital Retinoschisis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Affected males typically have 20/60 to 20/120 vision. Visual acuity often deteriorates during the first and second decades of life but then remains relatively stable until the fifth or sixth decade."
    explanation: >
      GeneReviews supplies the acuity range this node states, which was
      previously uncited, and corrects its trajectory claim: the deficit is not
      flat from childhood but deteriorates through the first two decades before
      stabilising. The node description was amended accordingly. Evidence
      source is OTHER because GeneReviews is an expert-curated clinical
      synthesis.

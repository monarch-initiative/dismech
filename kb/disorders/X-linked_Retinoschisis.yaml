discussions:
- discussion_id: xlrs_no_genotype_phenotype_correlation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does XLRS show no reliable genotype-phenotype correlation, given that
    the structural basis of the disease - failure of retinoschisin octamer
    assembly - is comparatively well defined?
  attaches_to:
  - "pathophysiology#RS1 Loss of Function"
  - "pathophysiology#Early-Onset Bilateral Visual Impairment"
  rationale: >-
    Cryo-EM localizes disease-associated residues to the octamer assembly
    interfaces, which would predict that variants abolishing assembly are more
    severe than those merely destabilizing it. Clinically no such correlation
    holds, and phenotype varies markedly even within families sharing a variant.
    Independently derived mouse lines also differ in severity. Something other
    than the allele - modifier loci, stochastic developmental factors, or
    mechanical variation in retinal architecture - dominates the outcome, and
    identifying it matters practically because gene therapy trials must select
    participants and time intervention without a severity predictor.
  proposed_experiments:
  - experiment_id: xlrs_intrafamilial_discordance_study
    name: Intrafamilial phenotype discordance with modifier mapping in XLRS
    description: >
      Systematically quantify OCT cavity volume, ERG b/a ratio and acuity in
      affected relatives sharing an identical RS1 variant, and test whether
      residual discordance associates with common variation at candidate
      retinal-adhesion and Muller-glia loci.

- name: Neocortical Cytoarchitectonic Alteration
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Mispositioned cortical neurons yield altered neocortical cytoarchitecture
    and circuit assembly. In forebrain-specific Foxp1 conditional knockout mice
    this is accompanied by impaired neonatal vocalization, providing the closest
    model-system correlate of the human speech phenotype. In affected humans,
    imaging shows only non-specific structural brain abnormalities, so the
    correspondence between the murine cytoarchitectonic lesion and human
    cortical pathology is inferred rather than demonstrated.
  cell_types:

    term:
      id: GO:0021801
      label: cerebral cortex radial glia-guided migration
    modifier: DECREASED
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: DECREASED
  evidence:
  - reference: PMID:26010426
    reference_title: >-
      Foxp1 regulates cortical radial migration and neuronal morphogenesis in
      developing cerebral cortex.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report that suppression of Foxp1 expression in mouse cerebral
      cortex led to a neuronal migration defect, which was rescued by
      overexpression of Foxp1.
    explanation: >-
      Knockdown-plus-rescue is the strongest available demonstration that the
      migration defect is Foxp1 dose dependent.
  - reference: PMID:26010426
    reference_title: >-
      Foxp1 regulates cortical radial migration and neuronal morphogenesis in
      developing cerebral cortex.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, morphological analysis showed that the neurons with Foxp1
      deficiency had an inhibited axonal growth in vitro and a weakened
      transition from multipolar to bipolar in vivo.
    explanation: >-
      Identifies the cell-biological substrate of the migration defect and an
      added axon-growth deficit.
  downstream:
  - target: Neocortical Cytoarchitectonic Alteration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26010426
      reference_title: >-
        Foxp1 regulates cortical radial migration and neuronal morphogenesis in
        developing cerebral cortex.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice with Foxp1 knockdown exhibited ectopic neurons in deep layers of

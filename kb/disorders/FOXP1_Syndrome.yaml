differential_diagnoses:
- name: FOXP2-Related Speech and Language Disorder
  description: >-
    FOXP2 haploinsufficiency causes hereditary developmental verbal dyspraxia.
    FOXP1 and FOXP2 are paralogs that heterodimerize and have overlapping brain
    expression, but the disorders are clinically separable: FOXP1 syndrome
    presents with global developmental delay and intellectual disability plus a
    complex dysarthria-dominant speech profile, whereas FOXP2 deficiency causes
    a primary oromotor verbal dyspraxia without obligate intellectual
    disability.
  evidence:
  - reference: PMID:20571508
    reference_title: >-
      Chiari I malformation, delayed gross motor skills, severe speech delay,
      and epileptiform discharges in a child with FOXP1 haploinsufficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nature of the speech deficit is different from the primary oromotor
      verbal dyspraxia found in patients with FOXP2 deficiency.
    explanation: >-
      States the discriminating feature between the two FOXP-related speech
      disorders.
  - reference: PMID:24214399
    reference_title: "FOXP1 mutations cause intellectual disability and a recognizable phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in FOXP2, located at 7q31, are well known to cause developmental
      speech and language disorders, particularly developmental verbal dyspraxia
      (DVD).
    explanation: >-
      Establishes the FOXP2 phenotype that must be distinguished from FOXP1
      syndrome.
  - reference: PMID:31999079
    reference_title: "FOXP transcription factors in vertebrate brain development, function, and disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These varied sites and timepoints of expression have complicated efforts
      to link FOXP1 and FOXP2 mutations to their respective developmental
      disorders, the former affecting global neural functions and the latter
      specifically affecting speech and language.
    explanation: >-
      A FOXP-family review states the discriminating principle directly: FOXP1
      loss affects global neural function whereas FOXP2 loss is specific to
      speech and language. It also notes that the overlapping,
      cell-type-specific expression of the two paralogs is precisely what makes
      the distinction non-trivial.

discussions:
- discussion_id: foxp1_postnatal_reinstatement_window
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Postnatal FOXP1 reinstatement rescues electrophysiological, behavioral and
    cell-type-specific transcriptional phenotypes in mice. Does a
    comparable postnatal window of reversibility exist in humans, in whom the
    disorder is diagnosed after several years of atypical development and in
    whom cortical and striatal circuit maturation follows a much longer
    timescale?
  attaches_to:
  - pathophysiology#Altered Striatal Circuit Excitability
  rationale: >-
    This is a translational-validity question rather than an absence of
    evidence. Strong in vivo mouse evidence exists that the striatal arm of the
    mechanism is postnatally reversible, which would reclassify FOXP1 syndrome
    from a fixed prenatal malformation disorder to a partially modifiable
    circuit disorder and would justify FOXP1-restoration strategies. But mouse
    reinstatement occurs early in a short developmental program, whereas human
    diagnosis typically follows years of atypical development; delivery to the
    relevant cell types, dosage and isoform control, off-target transcriptional
    effects, and the human timing window are all unresolved. The cortical arm of
    the mechanism (lamination, barrel formation, dendritic spines) has not been
    shown to be reversible at all.
  proposed_experiments:
  - experiment_id: exp_foxp1_reinstatement_age_series
    name: Age-series mapping of the FOXP1 reinstatement window in mice
    description: >-
      Reinstate FOXP1 at a graded series of postnatal ages in the same
      conditional model and measure D2 SPN glutamatergic input strength,
      synaptically driven excitability, and the corresponding behavioral
      readouts at each timepoint. The objective is the shape of the closing
      window, not a single permissive early timepoint, because only a rate of
      closure can be extrapolated to the much longer human developmental
      timescale.
  - experiment_id: exp_foxp1_cortical_arm_reversibility
    name: Test whether the cortical arm is reversible under the same protocol
    description: >-
      Apply the same postnatal reinstatement protocol to cortex-restricted
      Foxp1 loss and assay laminar positioning, somatosensory barrel
      organization, dendritic spine density, and tactile behavior. A negative
      result would confine the reversibility claim to the striatal arm and would
      materially change what a FOXP1-restoration therapy could be expected to
      achieve.
  - experiment_id: exp_foxp1_dose_response_ipsc
    name: FOXP1 dose-response in patient-derived and isogenic human neurons
    description: >-
      Use patient-derived iPSC neurons and isogenic corrected lines to establish
      the FOXP1 dose-response relationship, determining whether a normal
      transcriptional state is reachable without overexpression toxicity and
      which isoforms must be restored. FOXP1 is dosage sensitive in both
      directions, so a human dose window is a prerequisite for any restoration
      strategy.
  evidence:
  - reference: PMID:38701209
    reference_title: >-
      FOXP1 regulates the development of excitatory synaptic inputs onto
      striatal neurons and induces phenotypic reversal with reinstatement.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Last, we demonstrate that postnatal FOXP1 reinstatement rescues
      electrophysiological deficits, cell type-specific gene expression changes,
      and behavioral phenotypes.
    explanation: >-
      The mouse result that creates the translational question; it is
      model-organism evidence with no human counterpart.
  - reference: PMID:40066139
    reference_title: >-
      Adolescents and adults with FOXP1 syndrome show high rates of anxiety and
      externalizing behaviors but not psychiatric decompensation or skill loss.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Caregivers reported continued development in adaptive skills even into
      adulthood.
    explanation: >-
      Continued human skill acquisition into adulthood is weakly consistent with
      retained plasticity, but it is not evidence that the underlying circuit
      deficit is reversible.

notes: >-
  Frequency bands are asserted only where a quantitative or explicitly universal
  statement is available. Most bands are anchored on the pooled 62-person
  literature review (PMID:33892622) or on the prospective Mount Sinai cohorts
  (PMID:29090079, PMID:34588003, PMID:40066139): speech/language 60/60 (100%),
  motor delay 59/61 (97%), ID/GDD 55/61 (90%), prominent forehead 48/59 (81%),
  ADHD 75%, short nose with broad tip 41/59 (69%), articulation problems 32/48
  (67%), psychiatric comorbidity 32/56 (57%), brain abnormality 29/58 (50%),
  myopia 29/58 (50%), downslanted palpebral fissures 24/59 (41%), anxiety 38%,
  ptosis 22/59 (37%), congenital heart defect 17/56 (30%), hypotonia 18/62
  (29%), hypertelorism 17/59 (29%), contractures 16/56 (29%), frontal hair
  upsweep 16/59 (27%), ASD 24%, cryptorchidism 9/41 males (22%), feeding issues
  13/62 (21%), strabismus 11/60 (18%), hearing loss 8/48 (17%), macrocephaly
  9/59 (15%), short stature 8/60 (13%), seizures 7/59 (12%), recurrent ear
  infections 7/60 (12%), micropenis 3/41 males (7%), obesity 3/60 (5%).
  Two ASD figures exist and are deliberately not averaged: 24% met formal DSM-5
  criteria on prospective expert-consensus assessment, whereas 50% had ASD
  *features* on retrospective literature aggregation; the curated band follows
  the stricter prospective figure with the higher figure retained as a PARTIAL
  evidence item. GeneReviews lists oromotor dysfunction, refractive errors,
  strabismus, cardiac abnormalities, renal abnormalities, cryptorchidism,
  hypertonia, hearing loss and epilepsy collectively as "other common findings";
  because the qualifier applies to the group rather than to each item, frequency
  is deliberately omitted for those phenotypes.

  No conforms_to module reference is asserted. The candidate modules were
  reviewed and none fits: FOXP1 syndrome is a transcription-factor
  haploinsufficiency neurodevelopmental disorder whose mechanism (loss of
  transcriptional repression, leading to impaired cortical migration and
  striatal medium spiny neuron differentiation) is not represented by any
  current kb/modules entry. The epilepsy_excitation_inhibition_imbalance module
  was considered for the seizure arm, but epilepsy is a minority, non-defining
  feature here and this entry does not curate an excitation/inhibition-imbalance
  node, so declaring conformance would be unsupported.

  The 2010 index case (PMID:20571508) contributes Chiari I malformation and
  epileptiform discharges as single-patient observations; both are curated
  without a frequency. The lung disease resembling neuroendocrine cell
  hyperplasia of infancy and the skeletal undertubulation phenotype reported in
  PMID:28884888 are deliberately NOT curated as phenotypes: they are
  unreplicated single-patient findings that the authors themselves attribute to
  possible stochastic developmental variation. They are represented only in the
  Extra-CNS pathophysiology node description and its PARTIAL evidence item.

  Deep research: an Edison/Falcon deep-research run
  (research/FOXP1_Syndrome-deep-research-falcon.md, 2026-07-31) was used as a
  lead source only. Its NEC preflight passed (report gene FOXP1, MONDO:0013352,
  3p14.1 - matching the intended entity). Every DR-sourced item was
  independently re-derived: DOIs were resolved to PMIDs via the PMC ID
  converter, abstracts were fetched with just fetch-reference, and all snippets
  were verified as exact substrings of the cached text. Two DR suggestions were
  rejected on verification: HP:0002167 was proposed for speech apraxia (the
  correct term is HP:0011098; HP:0002167 is Neurological speech impairment), and
  HP:0000431 was proposed for "wide nasal tip" when its actual label is Wide
  nasal bridge. The DR report also stated that no Orphanet code could be
  established; ORPHA:391372 was confirmed independently from the MONDO record
  and the Orphadata cache. Cytoband is reported as 3p13 by PMID:24214399 and
  3p14.1 by the pooled review; the entry quotes the sourced 3p13 statement.

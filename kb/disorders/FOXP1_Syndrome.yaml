    trials may be required before benefit is achieved, so a structured trial
    plan is appropriate. No FOXP1-specific efficacy trial has been performed;
    prescribing follows general ADHD practice. A tolerability caveat is
    documented: the investigators of a French psychiatric-phenotyping study
    record family reports of ineffectiveness and poor tolerance of
    methylphenidate in this population, so response should not be assumed and

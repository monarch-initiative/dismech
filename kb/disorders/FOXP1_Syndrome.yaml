inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    FOXP1 syndrome is autosomal dominant. Nearly all molecularly characterized
    probands carry a de novo pathogenic variant; rare parental somatic and
    germline mosaicism or a complex chromosome rearrangement involving FOXP1 has
    been reported. Sib recurrence risk is approximately 1% because of possible
    parental germline mosaicism.
  penetrance: COMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:37733892
    reference_title: "FOXP1 Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FOXP1 syndrome is an autosomal dominant disorder typically caused by a de
      novo pathogenic variant.
    explanation: >-
      GeneReviews states the mode of inheritance and the predominance of de novo
      origin.
  - reference: PMID:37733892
    reference_title: "FOXP1 Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rarely, a parent of an individual with FOXP1 syndrome has somatic and
      germline mosaicism for the FOXP1 pathogenic variant or a complex
      chromosome arrangement involving FOXP1.
    explanation: >-
      Documents the rare non-de-novo mechanisms that underlie the residual sib
      recurrence risk.
  - reference: PMID:34109629
    reference_title: "Severe speech impairment is a distinguishing feature of FOXP1-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with pathogenic FOXP1 variants (14 truncating, three missense, three
      splice site, one in-frame deletion, eight cytogenic deletions; 28 out of
      29 were de novo variants) were studied.
    explanation: >-
      An independent 29-patient cohort quantifies de novo origin (28/29) and the
      allele spectrum.


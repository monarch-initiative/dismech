name: FOXP1 Syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  FOXP1 syndrome is an autosomal dominant neurodevelopmental disorder caused by
  heterozygous, almost always de novo, loss-of-function variants or deletions of
  FOXP1, a forkhead-box transcriptional repressor. Pathogenic alleles are
  predominantly protein truncating; recurrent missense and in-frame changes
  cluster in the forkhead DNA-binding domain, where they disrupt DNA contact or
  the domain swap that mediates FOXP1 dimerization, and the reported alleles
  converge on loss of transcriptional repression activity. FOXP1 directly
  represses neurogenic programs (including Notch/Jagged1) and is required for
  neural stem cell differentiation, cortical radial migration and neuronal
  morphogenesis, and striatal medium spiny neuron identity and excitability;
  reduced dosage in model systems produces neocortical cytoarchitectonic
  alterations and impaired vocalization. Clinically the disorder is
  characterized by global developmental delay, mild-to-severe intellectual
  disability, and a speech and language impairment present in essentially all
  affected individuals regardless of cognitive level - a complex profile with
  prominent dysarthria, apraxic features, and phonological errors. Behavioral
  features (ADHD, anxiety, restricted/repetitive behaviors, autistic features,
  sleep and sensory symptoms) are near-universal, and mild dysmorphism (broad
  forehead, downslanted palpebral fissures, short nose with broad tip, relative
  macrocephaly, frontal hair upsweep, prominent fingertip pads) plus ophthalmic,
  cardiac, renal/urogenital and other congenital anomalies complete the
  spectrum. Longitudinal caregiver studies report no developmental regression.

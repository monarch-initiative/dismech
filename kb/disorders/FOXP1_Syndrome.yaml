      phenotype; translation of whisker behavior to human sensory experience is
      indirect, so this is PARTIAL support.

genetic:
- name: FOXP1 Pathogenic Variants
  gene_term:
    preferred_term: FOXP1
    term:
      id: hgnc:3823
      label: FOXP1
  association: Causative
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    FOXP1 (3p13) encodes a forkhead-box transcriptional repressor. Pathogenic
    alleles are heterozygous and, in the large majority of molecularly tested
    probands, de novo. The spectrum comprises whole- and partial-gene deletions
    (including cytogenetically visible 3p13-14.1 deletions and intragenic
    deletions), frameshift and nonsense variants, essential splice-site changes,
    in-frame deletions, and missense substitutions; balanced rearrangements
    disrupting FOXP1 have also been reported. Missense and in-frame alleles
    cluster in the C-terminal forkhead DNA-binding domain. All reported
    pathogenic alleles studied functionally converge on loss of transcriptional
    repression activity, supporting haploinsufficiency as the disease mechanism.
    Rare parental somatic-plus-germline mosaicism gives an approximately 1% sib
    recurrence risk.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Autosomal dominant, almost always de novo; each child of an affected
      individual has a 50% chance of inheriting the variant.
    evidence:
    - reference: PMID:37733892
      reference_title: "FOXP1 Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Each child of an individual with FOXP1 syndrome has a 50% chance of
        inheriting the FOXP1 pathogenic variant.
      explanation: GeneReviews states the dominant transmission risk.
  evidence:
  - reference: PMID:29090079
    reference_title: "Prospective investigation of FOXP1 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haploinsufficiency of the forkhead-box protein P1 (FOXP1) gene leads to a
      neurodevelopmental disorder termed FOXP1 syndrome.
    explanation: >-
      States haploinsufficiency of FOXP1 as the disease mechanism.
  - reference: PMID:29090079
    reference_title: "Prospective investigation of FOXP1 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study identifies novel FOXP1 mutations associated with FOXP1
      syndrome, identifies recurrent mutations, and demonstrates significant
      clustering of missense mutations in the DNA-binding domain.
    explanation: >-
      Establishes the DNA-binding-domain clustering of missense alleles.
  - reference: PMID:30385778
    reference_title: >-
      Characterization of a recurrent missense mutation in the forkhead
      DNA-binding domain of FOXP1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Most of the reported FOXP1 mutations occur on the C-terminus of the
      protein and cluster around to the forkhead domain. All reported FOXP1
      pathogenic variants result in abnormal cellular localization and loss of
      transcriptional repression activity of the protein product.
    explanation: >-
      Functional characterization of the allele spectrum showing convergent loss
      of repression.
  - reference: PMID:34109629
    reference_title: "Severe speech impairment is a distinguishing feature of FOXP1-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      14 truncating, three missense, three splice site, one in-frame deletion,
      eight cytogenic deletions; 28 out of 29 were de novo variants
    explanation: >-
      Quantifies the variant-class distribution and the de novo rate in a
      29-patient cohort.

variants:
- name: FOXP1 c.1574G>A (p.Arg525Gln)
  description: >-
    A recurrent missense substitution in the forkhead DNA-binding domain,
    reported in three unrelated patients. It abolishes transcriptional
    repression while, uniquely among characterized FOXP1 alleles, preserving
    normal nuclear localization, evidence that loss of repression rather than
    mislocalization is the shared pathogenic consequence.
  gene:
    preferred_term: FOXP1
    term:
      id: hgnc:3823
      label: FOXP1
  evidence:
  - reference: PMID:30385778
    reference_title: >-
      Characterization of a recurrent missense mutation in the forkhead
      DNA-binding domain of FOXP1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we present three patients with the same FOXP1 mutation, c.1574G>A
      (p.R525Q), that results in the characteristic loss of transcription
      repression activity.
    explanation: >-
      Identifies the recurrent allele and its functional consequence.
- name: FOXP1 c.1267_1268delGT (p.Val423Hisfs*37)
  description: >-
    A de novo frameshift allele identified by clinical exome sequencing in a
    child with autism, mild intellectual disability, severe hypotonia and severe
    speech and language impairment. Cellular assays showed disruption of both
    subcellular localization and transcriptional repression.
  gene:
    preferred_term: FOXP1
    term:
      id: hgnc:3823
      label: FOXP1
  evidence:
  - reference: PMID:25853299
    reference_title: >-
      A de novo FOXP1 variant in a patient with autism, intellectual disability
      and severe speech and language impairment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Clinical exome sequencing identified a heterozygous de novo FOXP1 variant
      c.1267_1268delGT (p.V423Hfs*37). Functional analyses using cellular models
      show that the variant disrupts multiple aspects of FOXP1 activity,
      including subcellular localization and transcriptional repression
      properties.
    explanation: >-
      Establishes the allele, its de novo origin, and its functional effect.

diagnosis:
- name: Molecular Genetic Diagnosis of FOXP1 Syndrome
  description: >-
    The diagnosis is molecular. It is established in a proband with supportive
    clinical findings and a heterozygous pathogenic FOXP1 variant identified by
    molecular genetic testing, in practice exome or genome sequencing performed
    for neurodevelopmental delay, or chromosomal microarray when the lesion is a
    copy-number deletion. The recognizable facial gestalt plus a speech
    impairment disproportionate to cognitive level are the clinical triggers.
  presence: Positive
  evidence:
  - reference: PMID:37733892
    reference_title: "FOXP1 Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of FOXP1 syndrome is established in a proband with a
      heterozygous pathogenic variant in FOXP1 identified by molecular genetic
      testing and supportive clinical findings.
    explanation: GeneReviews states the diagnostic criterion.
  - reference: PMID:38123995
    reference_title: >-
      Clinical phenotype of FOXP1 syndrome: parent-reported medical signs and
      symptoms in 40 individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with FOXP1 syndrome were included, mostly diagnosed via
      whole-exome sequencing for neurodevelopmental delay.
    explanation: >-
      Documents the ascertainment route in current practice.

definitions:
- name: GeneReviews Molecular Diagnostic Criterion for FOXP1 Syndrome
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Diagnosis requires supportive clinical findings (global developmental delay
    with speech and language impairment out of proportion to cognitive level,
    behavior abnormalities, and mild dysmorphism) together with a heterozygous
    pathogenic FOXP1 variant on molecular genetic testing. There are no
    consensus clinical-only criteria; the molecular finding is required.
  inclusion_criteria:
  - preferred_term: Heterozygous pathogenic FOXP1 variant
    description: >-
      A heterozygous pathogenic or likely pathogenic FOXP1 variant (sequence
      variant, or whole- or partial-gene deletion) identified by molecular
      genetic testing.
  - preferred_term: Supportive clinical findings
    term:
      id: HP:0001263
      label: Global developmental delay
    description: >-
      Supportive clinical findings, including global developmental delay and
      speech and language impairment.
  evidence:
  - reference: PMID:37733892
    reference_title: "FOXP1 Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of FOXP1 syndrome is established in a proband with a
      heterozygous pathogenic variant in FOXP1 identified by molecular genetic
      testing and supportive clinical findings.
    explanation: >-
      The GeneReviews diagnostic statement is the source of both inclusion
      criteria.

treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    There is no disease-modifying therapy. Management is symptom directed and
    aims to improve quality of life, maximize function, and reduce
    complications, delivered by a multidisciplinary team spanning pediatrics,
    developmental medicine or neurodevelopment, neurology, physiatry,
    occupational and physical therapy, speech-language pathology, psychiatry,
    psychology, ophthalmology, and medical genetics. The GeneReviews chapter
    abstract records no agents or circumstances to avoid for this disorder.

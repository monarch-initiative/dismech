    by avoidance and hyper-reaction to repeated stimulation), providing a
    candidate cortical substrate. Bound at the sensory-behavioral grouping level
    because the claim spans both sensory seeking (the prominent human finding,
    HP:4000079) and hyper-reactivity/avoidance, rather than seeking alone.

pathophysiology:
- name: Heterozygous FOXP1 Loss-of-Function Variation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion is a heterozygous, usually de novo, pathogenic FOXP1
    variant: whole- or partial-gene deletion, frameshift, nonsense, essential
    splice-site change, in-frame deletion, or missense substitution. Missense
    and in-frame alleles cluster in the C-terminal forkhead DNA-binding domain,
    where they either perturb residues required for DNA contact or interfere
    with the domain swap that mediates FOXP1 dimerization. FOXP1 also
    heterodimerizes with its paralog FOXP2, the classic speech-and-language
    gene, which is one route by which reduced FOXP1 dosage reaches speech
    circuitry.
  genes:
  - preferred_term: FOXP1
    term:
      id: hgnc:3823
      label: FOXP1
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  - preferred_term: FOXP1 domain-swap dimerization
    term:
      id: GO:0042803
      label: protein homodimerization activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29090079
    reference_title: "Prospective investigation of FOXP1 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of pathogenic missense and in-frame mutations, including all
      four missense mutations in our cohort, lie in the DNA-binding domain.
      Through structural analyses, we show that the mutations perturb amino
      acids necessary for binding to the DNA or interfere with the domain
      swapping that mediates FOXP1 dimerization.
    explanation: >-
      Establishes both the mutational clustering in the forkhead domain and the
      two structural mechanisms by which those alleles impair FOXP1 function.
  - reference: PMID:29090079
    reference_title: "Prospective investigation of FOXP1 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified nine de novo mutations, including three frameshift, one
      nonsense, one mutation in an essential splice site resulting in frameshift
      and insertion of a premature stop codon, three missense, and one in-frame
      deletion.
    explanation: >-
      Documents the de novo origin and the truncating-predominant allele
      spectrum of the initiating lesion.
  downstream:
  - target: Loss of FOXP1 Transcriptional Repression
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30385778
      reference_title: >-
        Characterization of a recurrent missense mutation in the forkhead
        DNA-binding domain of FOXP1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        All reported FOXP1 pathogenic variants result in abnormal cellular
        localization and loss of transcriptional repression activity of the
        protein product.
      explanation: >-
        Functional characterization shows the shared molecular consequence of
        pathogenic FOXP1 alleles is loss of repression activity.

- name: Loss of FOXP1 Transcriptional Repression
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    FOXP1 is a sequence-specific transcriptional repressor. Pathogenic alleles
    converge on loss of repression activity, most often accompanied by abnormal
    subcellular (cytoplasmic or aggregated nuclear) localization; the recurrent
    p.Arg525Gln allele loses repression while retaining normal nuclear
    localization, showing that the repression defect, not mislocalization per
    se, is the shared consequence. Repression is exerted in part through
    interaction with the NuRD chromatin-remodeling complex, an interaction that
    requires SUMOylation of FOXP1 during embryonic brain development.
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
  - preferred_term: FOXP1 SUMOylation required for NuRD interaction
    term:
      id: GO:0016925
      label: protein sumoylation
  evidence:
  - reference: PMID:30385778
    reference_title: >-
      Characterization of a recurrent missense mutation in the forkhead
      DNA-binding domain of FOXP1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we present three patients with the same FOXP1 mutation, c.1574G>A
      (p.R525Q), that results in the characteristic loss of transcription
      repression activity. This mutation, however, represents the first reported
      FOXP1 mutation that does not result in cytoplasmic or nuclear aggregation
      of the protein but maintains normal nuclear localization.
    explanation: >-
      Dissociates loss of repression from mislocalization, identifying loss of
      repression as the convergent molecular defect.
  - reference: PMID:25853299
    reference_title: >-
      A de novo FOXP1 variant in a patient with autism, intellectual disability
      and severe speech and language impairment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analyses using cellular models show that the variant disrupts
      multiple aspects of FOXP1 activity, including subcellular localization and
      transcriptional repression properties.
    explanation: >-
      An independent patient-derived frameshift allele shows the same loss of
      repression in cellular assays.
  - reference: PMID:29138280
    reference_title: "Foxp1 regulation of neonatal vocalizations via cortical development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also uncovered mechanistic insight into Foxp1 function by demonstrating
      that sumoylation of Foxp1 during embryonic brain development is necessary
      for mediating proper interactions between Foxp1 and the NuRD complex.
    explanation: >-
      Identifies the chromatin-remodeling partner through which FOXP1 exerts
      repression in the developing brain.
  downstream:
  - target: Dysregulated Neurodevelopmental Transcriptional Program
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29141232
      reference_title: >-
        FOXP1 Promotes Embryonic Neural Stem Cell Differentiation by Repressing
        Jagged1 Expression.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we demonstrate with RNA and chromatin immunoprecipitation
        sequencing that FOXP1 directly regulates genes controlling neurogenesis.
      explanation: >-
        RNA-seq plus ChIP-seq show FOXP1 occupancy and regulation of neurogenic
        target genes, linking repression loss to program dysregulation.
  - target: Extra-CNS Developmental Consequences of FOXP1 Dosage Reduction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28884888
      reference_title: "FOXP1 haploinsufficiency: Phenotypes beyond behavior and intellectual disability?"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In mice, Foxp1 plays critical roles in development of the spinal motor
        neurons, lymphocytes, cardiomyocytes, foregut, and skeleton.
      explanation: >-
        FOXP1 is required transcriptionally outside the brain, so loss of its
        repression activity also acts in non-neural lineages. The tissue-specific
        intermediates between loss of repression and each extra-CNS malformation
        are not characterized, hence INDIRECT_UNKNOWN_INTERMEDIATES.

- name: Dysregulated Neurodevelopmental Transcriptional Program
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Reduced FOXP1 dosage releases repression of its direct targets and
    reconfigures the downstream network. Two arms are best characterized:
    de-repression of Notch pathway genes, notably the ligand Jagged1, which
    sustains Notch signaling and holds progenitors in a proliferative,
    undifferentiated state; and dysregulation of autism-associated signaling
    pathways and neuronal-activity genes, including a striatal neuron-identity
    program that is conserved between mouse brain and human neural progenitors.
    In developing neocortex the Foxp1-regulated networks are specifically
    enriched for neurogenesis and neuronal-migration effectors.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
  - preferred_term: Notch signaling pathway
    term:
      id: GO:0007219
      label: Notch signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:29141232
    reference_title: >-
      FOXP1 Promotes Embryonic Neural Stem Cell Differentiation by Repressing
      Jagged1 Expression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      FOXP1 was found to repress the expression of Notch pathway genes including
      the Notch-ligand Jagged1, resulting in inhibition of Notch signaling.
    explanation: >-
      Identifies Jagged1/Notch de-repression as a specific, mechanistically
      resolved consequence of FOXP1 loss.
  - reference: PMID:26494785
    reference_title: "FoxP1 orchestration of ASD-relevant signaling pathways in the striatum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We demonstrate a role for FoxP1 in the transcriptional regulation of
      autism-related pathways as well as genes involved in neuronal activity.
    explanation: >-
      Defines the FOXP1-regulated program in patient-relevant heterozygous Foxp1
      mouse brain and human neural cells.
  - reference: PMID:29138280
    reference_title: "Foxp1 regulation of neonatal vocalizations via cortical development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using a genomics approach, we identified the transcriptional networks
      regulated by Foxp1 in the developing neocortex and found that such
      networks are enriched for downstream targets involved in neurogenesis and
      neuronal migration.
    explanation: >-
      Shows the dysregulated program is specifically enriched for the
      neurogenesis and migration effectors that produce the downstream cortical
      phenotype.
  downstream:
  - target: Impaired Neural Progenitor Differentiation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29141232
      reference_title: >-
        FOXP1 Promotes Embryonic Neural Stem Cell Differentiation by Repressing
        Jagged1 Expression.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Finally, blockade of Jagged1 in FOXP1-knockdown NSCs rescued neuronal
        differentiation in vitro.
      explanation: >-
        Epistatic rescue establishes that Jagged1 de-repression is the effector
        step from transcriptional dysregulation to the differentiation defect.
  - target: Impaired Striatal Medium Spiny Neuron Development
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26494785
      reference_title: "FoxP1 orchestration of ASD-relevant signaling pathways in the striatum."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Finally, we demonstrate that FoxP1 has an evolutionarily conserved role
        in regulating pathways involved in striatal neuron identity through gene
        expression studies in human neural progenitors with altered FOXP1
        levels.
      explanation: >-
        Links the dysregulated program directly to striatal neuron identity, and
        shows the link is conserved in human neural progenitors.
  - target: Impaired Cortical Radial Migration and Neuronal Morphogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29138280
      reference_title: "Foxp1 regulation of neonatal vocalizations via cortical development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We show that deletion of Foxp1 in the developing forebrain leads to
        impairments in neonatal vocalizations as well as neocortical
        cytoarchitectonic alterations via neuronal positioning and migration.
      explanation: >-
        Forebrain-specific conditional knockout ties the Foxp1-dependent
        transcriptional network to a migration/positioning phenotype.

- name: Impaired Neural Progenitor Differentiation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    FOXP1 is expressed in embryonic neural stem cells, and reducing it shifts
    the balance away from neuronal (and astrocytic) differentiation. In utero
    FOXP1 knockdown reduces neural stem cell differentiation and migration
    during corticogenesis, and transplanted FOXP1-knockdown neural stem cells
    fail to differentiate and function normally in vivo. The mechanism is
    established in murine and cellular models; direct confirmation in human
    FOXP1-syndrome brain tissue is lacking.
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: neuron differentiation
    term:
      id: GO:0030182
      label: neuron differentiation
    modifier: DECREASED
  - preferred_term: neural precursor cell proliferation
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29141232
    reference_title: >-
      FOXP1 Promotes Embryonic Neural Stem Cell Differentiation by Repressing
      Jagged1 Expression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using a murine model of cortical development, FOXP1-knockdown in utero was
      found to reduce NSC differentiation and migration during corticogenesis.
    explanation: >-
      In vivo knockdown demonstrates the progenitor differentiation and
      migration defect that follows FOXP1 loss.
  downstream:
  - target: Neocortical Cytoarchitectonic Alteration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced and mistimed neuronal output from the ventricular and
      subventricular zone leads to abnormal laminar positioning of cortical
      neurons.
    evidence:
    - reference: PMID:29141232
      reference_title: >-
        FOXP1 Promotes Embryonic Neural Stem Cell Differentiation by Repressing
        Jagged1 Expression.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, transplantation of FOXP1-knockdown NSCs in neonatal mice
        after hypoxia-ischemia challenge demonstrated that FOXP1 is also
        required for neuronal differentiation and functionality in vivo.
      explanation: >-
        Supports the progenitor-to-neuron step in vivo; the laminar consequence
        itself is demonstrated in the conditional-knockout studies.

- name: Impaired Cortical Radial Migration and Neuronal Morphogenesis
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Foxp1 is required for radial migration of newly generated cortical neurons.
    Suppressing Foxp1 in mouse cerebral cortex produces a migration defect that
    is rescued by Foxp1 re-expression, with ectopic neurons persisting in deep
    cortical layers postnatally. Differentiation per se is preserved in that
    model, but the neurons show inhibited axonal growth, a weakened
    multipolar-to-bipolar transition, and altered late dendritic maturation.
  cell_types:
  - preferred_term: cerebral cortex neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  - preferred_term: glutamatergic projection neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  biological_processes:

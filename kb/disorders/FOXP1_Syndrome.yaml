        deficit in the same animals.
  - target: Autistic Features and Behavioral Dysregulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced dendritic spine density and disrupted somatosensory barrel
      organization, with reduced layer IV cortical activation and increased
      basolateral amygdala activation, produce aberrant sensory responsiveness.
    evidence:
    - reference: PMID:37691105
      reference_title: >-
        Cortex-restricted deletion of Foxp1 impairs barrel formation and induces
        aberrant tactile responses in a mouse model of autism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast to the wild-type, c-Fos was activated in the basolateral
        amygdala but not in layer IV of the primary somatosensory cortex of the
        cKO mice.
      explanation: >-
        Identifies a cortex-to-limbic shift in stimulus-evoked activity as a
        candidate substrate for the sensory and behavioral phenotype; the
        authors note the causal circuit physiology is unresolved.
  - target: Global Developmental Delay and Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24214399
      reference_title: "FOXP1 mutations cause intellectual disability and a recognizable phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in FOXP1, located at 3p13, have been reported in patients with
        global developmental delay (GDD), intellectual disability (ID), and
        speech defects.
      explanation: >-
        Links FOXP1 loss to the cognitive endpoint; the intervening steps from
        cortical architecture to cognition remain unresolved.

- name: Impaired Striatal Medium Spiny Neuron Development
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    FoxP1 is the most highly upregulated gene in the developing mouse whole
    ganglionic eminence, marks medium spiny projection neurons from precursor
    through maturity, and co-localizes with essentially all striatal DARPP-32
    positive projection neurons without labelling interneurons. FoxP1 knockout
    ganglionic eminence fails to generate DARPP-32-positive medium spiny neurons
    in vitro, establishing FoxP1 as required for their differentiation. The same
    expression pattern is present in human fetal brain at equivalent gestational
    stages.
  cell_types:
  - preferred_term: medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  biological_processes:
  - preferred_term: striatum development
    term:
      id: GO:0021756
      label: striatum development
    modifier: ABNORMAL
  - preferred_term: neuron differentiation
    term:
      id: GO:0030182
      label: neuron differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:27154297
    reference_title: >-
      FoxP1 marks medium spiny neurons from precursors to maturity and is
      required for their differentiation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, DARPP-32 expression was absent from FoxP1 knock-out mouse WGE
      differentiated in vitro, suggesting that FoxP1 is important for the
      development of DARPP-32-positive MSNs.
    explanation: >-
      Loss-of-function evidence that FoxP1 is required for medium spiny neuron
      differentiation.
  - reference: PMID:27154297
    reference_title: >-
      FoxP1 marks medium spiny neurons from precursors to maturity and is
      required for their differentiation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      FoxP1 expression persisted through into adulthood in the mouse brain,
      where it co-localised with all striatal DARPP-32 positive projection
      neurons and a small population of DARPP-32 negative cells. There was no
      co-localisation of FoxP1 with any interneuron markers.
    explanation: >-
      Establishes the cell-type specificity of FoxP1 within the striatum,
      identifying the medium spiny neuron as the vulnerable population.
  - reference: PMID:32130906
    reference_title: "Single-Cell Analysis of Foxp1-Driven Mechanisms Essential for Striatal Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using single-cell RNA sequencing (RNA-seq), we examine the cellular
      diversity of the early postnatal striatum and show that Foxp1, a
      transcription factor strongly linked to autism and intellectual
      disability, regulates the cellular composition, neurochemical
      architecture, and connectivity of the striatum in a cell-type-dependent
      fashion.
    explanation: >-
      Single-cell profiling of the early postnatal striatum shows the effect of
      Foxp1 loss is cell-type dependent rather than uniform, and extends it from
      neuron identity to neurochemical compartmentalization and connectivity.
  - reference: PMID:32130906
    reference_title: "Single-Cell Analysis of Foxp1-Driven Mechanisms Essential for Striatal Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also identify Foxp1-regulated target genes within distinct cell types
      and connect these molecular changes to functional and behavioral deficits
      relevant to phenotypes described in patients with FOXP1 loss-of-function
      mutations.
    explanation: >-
      Explicitly bridges the cell-type-specific molecular changes to behavioral
      deficits corresponding to the human loss-of-function phenotype.
  downstream:
  - target: Altered Striatal Circuit Excitability
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26494785
      reference_title: "FoxP1 orchestration of ASD-relevant signaling pathways in the striatum."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We show that Foxp1 regulates the excitability of striatal medium spiny
        neurons and that reduction of Foxp1 correlates with defects in
        ultrasonic vocalizations.
      explanation: >-
        Direct electrophysiological demonstration that Foxp1 dose sets medium
        spiny neuron excitability.

- name: Altered Striatal Circuit Excitability
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Beyond specifying medium spiny neuron identity, FoxP1 dose sets the
    intrinsic excitability of these neurons. In patient-relevant heterozygous
    Foxp1 mice, reduced Foxp1 alters medium spiny neuron excitability and
    correlates with defective ultrasonic vocalization; brain-specific Foxp1
    knockout pups have strongly reduced ultrasonic vocalization and lose the
    normal sex-specific call rate. FoxP1 is co-expressed with the androgen
    receptor in striatal medium spiny neurons, and FOXP1 heterodimerizes with
    FOXP2, tying this node to the canonical speech-and-language pathway. The
    proximate mechanism is subtype specific: FOXP1 strengthens and matures the
    long-range cortical and thalamic glutamatergic inputs onto D2
    (indirect-pathway) SPNs and thereby promotes their synaptically driven
    excitability. Critically, postnatal FOXP1 reinstatement in mice rescues the
    electrophysiological, cell-type-specific transcriptional, and behavioral
    abnormalities, so at least part of this node is not a fixed prenatal
    malformation.
  cell_types:
  - preferred_term: medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  biological_processes:
  - preferred_term: regulation of membrane potential
    term:
      id: GO:0042391
      label: regulation of membrane potential
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28204507
    reference_title: "Foxp1 expression is essential for sex-specific murine neonatal ultrasonic vocalization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Foxp1 KO pups had strongly reduced USV and lacked the sex-specific call
      rate from WT pups, indicating that Foxp1 is essential for normal USV.
    explanation: >-
      Independent knockout model confirms that Foxp1 loss impairs vocal output.
  - reference: PMID:28204507
    reference_title: "Foxp1 expression is essential for sex-specific murine neonatal ultrasonic vocalization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Since Foxp1 and Foxp2 form heterodimers for transcriptional regulation, we
      investigated USV in neonatal brain-specific Foxp1 KO mice.
    explanation: >-
      Documents the FOXP1-FOXP2 heterodimer that connects FOXP1 dosage to the
      established speech-and-language transcription factor.
  - reference: PMID:38701209
    reference_title: >-
      FOXP1 regulates the development of excitatory synaptic inputs onto
      striatal neurons and induces phenotypic reversal with reinstatement.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We find a neuron subtype-specific role of FOXP1 in strengthening and
      maturing glutamatergic inputs onto dopamine receptor 2-expressing SPNs (D2
      SPNs). We also find that FOXP1 promotes synaptically driven excitability
      in these neurons.
    explanation: >-
      Resolves the excitability effect to a specific mechanism (maturation of
      long-range cortical and thalamic glutamatergic input) and a specific
      neuron subtype (D2, indirect-pathway SPNs).
  - reference: PMID:38701209
    reference_title: >-
      FOXP1 regulates the development of excitatory synaptic inputs onto
      striatal neurons and induces phenotypic reversal with reinstatement.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Last, we demonstrate that postnatal FOXP1 reinstatement rescues
      electrophysiological deficits, cell type-specific gene expression changes,
      and behavioral phenotypes.
    explanation: >-
      Postnatal rescue shows this node is not an irreversible prenatal
      malformation in mice, establishing it as a candidate therapeutic target;
      the corresponding human window is unknown.
  downstream:
  - target: Impaired Speech Motor and Vocal Communication Output
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Corticostriatal loop dysfunction affecting motor planning and programming
      for speech.
    evidence:
    - reference: PMID:34109629
      reference_title: "Severe speech impairment is a distinguishing feature of FOXP1-related disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        FOXP1-related disorder is characterized by a complex speech and language
        phenotype with prominent dysarthria, broader motor planning and
        programming deficits, and linguistic-based phonological errors.
      explanation: >-
        The human speech profile is dominated by motor planning and programming
        deficits, the functional domain served by corticostriatal circuits.
  - target: Autistic Features and Behavioral Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26494785
      reference_title: "FoxP1 orchestration of ASD-relevant signaling pathways in the striatum."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data support an integral role for FoxP1 in regulating signaling
        pathways vulnerable in autism and the specific regulation of striatal
        pathways important for vocal communication.
      explanation: >-
        Connects the striatal node to autism-relevant pathways; the path from
        striatal excitability to human behavior is not resolved.

- name: Impaired Speech Motor and Vocal Communication Output
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The clinical convergence point that distinguishes FOXP1 syndrome from other
    syndromic intellectual disabilities: speech and language impairment is
    present in essentially every affected individual regardless of cognitive
    level. The profile is complex rather than a pure verbal dyspraxia - all
    verbal patients show dysarthric and apraxic features with persistent
    phonological errors, and in individuals with truncating or splice-site
    variants and small deletions expressive ability is relatively preserved
    compared with comprehension. This differs from the primary oromotor verbal
    dyspraxia of FOXP2 deficiency.
  evidence:
  - reference: PMID:37733892
    reference_title: "FOXP1 Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      speech and language impairment in all individuals regardless of level of
      cognitive abilities
    explanation: >-
      GeneReviews establishes speech and language impairment as the invariant
      feature, independent of cognitive level.
  - reference: PMID:34109629
    reference_title: "Severe speech impairment is a distinguishing feature of FOXP1-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All had atypical speech, with 21 being verbal and eight minimally verbal.
      All verbal patients had dysarthric and apraxic features, with phonological
      deficits in most (14 out of 16).
    explanation: >-
      Standardized speech assessment in 29 patients quantifies the profile and
      its universality.
  - reference: PMID:20571508
    reference_title: >-
      Chiari I malformation, delayed gross motor skills, severe speech delay,
      and epileptiform discharges in a child with FOXP1 haploinsufficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nature of the speech deficit is different from the primary oromotor
      verbal dyspraxia found in patients with FOXP2 deficiency.
    explanation: >-
      Contrasts the FOXP1 speech phenotype with the FOXP2 phenotype, supporting
      it as a distinct mechanism-level endpoint.

- name: Global Developmental Delay and Intellectual Disability
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Impaired cortical and striatal development produces early motor and language
    milestone delay and mild-to-severe intellectual disability, present in
    essentially all affected individuals. Longitudinal caregiver report finds
    continued, if slow, acquisition of adaptive skills into adulthood, with no
    developmental regression, neuropsychiatric decompensation, or catatonia,
    distinguishing FOXP1 syndrome from regressive neurodevelopmental disorders.
  evidence:
  - reference: PMID:38123995
    reference_title: >-
      Clinical phenotype of FOXP1 syndrome: parent-reported medical signs and
      symptoms in 40 individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had developmental problems, including cognitive,
      communication, social-emotional and motor delays.
    explanation: >-
      An unbiased 40-person cohort establishes the universality of multi-domain
      developmental delay.
  - reference: PMID:40066139
    reference_title: >-
      Adolescents and adults with FOXP1 syndrome show high rates of anxiety and
      externalizing behaviors but not psychiatric decompensation or skill loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were no reports of developmental regression, neuropsychiatric
      decompensation or catatonia.
    explanation: >-
      Establishes the non-regressive natural history, an important negative
      finding for counseling and for the mechanistic model.
  downstream:
  - target: Dependence in Activities of Daily Living
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41175749
      reference_title: >-
        Improving prognostication for individuals with FOXP1 syndrome:
        Parent-reported practical and social skills in 52 individuals.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found that individuals with FOXP1 syndrome have great difficulties
        with both basic and instrumental activities of daily living, but
        continue to develop their skills into adulthood.
      explanation: >-
        Quantifies the functional consequence of the cognitive and communication
        deficits across the lifespan.

- name: Autistic Features and Behavioral Dysregulation
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    A complex neurobehavioral profile rather than a single behavioral diagnosis.
    Restricted and repetitive behaviors are near-universal even in individuals
    who do not meet criteria for autism spectrum disorder; ADHD is the most
    common formal psychiatric diagnosis, followed by anxiety, with sensory
    symptoms (particularly sensory seeking) common. The behavioral phenotype
    persists into adolescence and adulthood as anxiety plus externalizing
    behavior. The mechanistic path from FOXP1-dependent striatal and cortical
    circuits to these behaviors is supported by model systems but not
    established in humans.
  evidence:
  - reference: PMID:34588003
    reference_title: >-
      Individuals with FOXP1 syndrome present with a complex neurobehavioral
      profile with high rates of ADHD, anxiety, repetitive behaviors, and
      sensory symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, 24% of the cohort met criteria for ASD. Seventy-five percent
      of individuals met DSM-5 criteria for attention-deficit/hyperactivity
      disorder and 38% for an anxiety disorder. Repetitive behaviors were almost
      universally present (95%) even without a diagnosis of ASD.
    explanation: >-
      Quantifies each component of the behavioral phenotype in a prospectively
      assessed cohort.
  - reference: PMID:29090079
    reference_title: "Prospective investigation of FOXP1 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with FOXP1 syndrome presented with delays in early motor and
      language milestones, language impairment (expressive language > receptive
      language), ASD symptoms, visual-motor integration deficits, and complex
      psychiatric presentations characterized by anxiety, obsessive-compulsive
      traits, attention deficits, and externalizing symptoms.
    explanation: >-
      The first prospective standardized characterization of the composite
      behavioral phenotype.

- name: Extra-CNS Developmental Consequences of FOXP1 Dosage Reduction
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    FOXP1 is required outside the brain. In mice it has critical roles in spinal
    motor neuron, lymphocyte, cardiomyocyte, foregut and skeletal development,
    and reduced dosage in humans is associated with cardiac malformations,
    congenital anomalies of the kidney and urinary tract, cryptorchidism,
    ophthalmic anomalies, and recurrent sinopulmonary or airway infections.
    Which of these are obligate consequences of FOXP1 dosage versus variable
    stochastic developmental effects is unresolved; single-patient reports of
    lung and skeletal disease remain unreplicated.
  evidence:
  - reference: PMID:28884888
    reference_title: "FOXP1 haploinsufficiency: Phenotypes beyond behavior and intellectual disability?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In humans FOXP1 mutations have been associated with language and speech
      defects, intellectual disability, autism spectrum disorder, facial
      dysmorphisms, and congenital anomalies of the kidney and urinary tract.
    explanation: >-
      Sets out the established extra-CNS human associations that motivate the
      node. The murine requirement is cited separately, as MODEL_ORGANISM
      evidence, on the causal edge into this node.
  - reference: PMID:28884888
    reference_title: "FOXP1 haploinsufficiency: Phenotypes beyond behavior and intellectual disability?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although attribution of these traits to mutation of FOXP1 requires
      ascertainment of additional patients, we hypothesize that the variable
      expression of these additional features might arise by means of stochastic
      developmental variation.
    explanation: >-
      The authors themselves flag the unreplicated single-patient features as
      provisional, which is why this node carries PROVISIONAL confidence.
  - reference: ORPHA:391372
    reference_title: "FOXP1 Syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Brain, cardiac, urogenital and ocular malformations may be associated."
    explanation: >-
      Orphanet independently records the organ systems affected by congenital
      malformation in FOXP1 syndrome.

- name: Dependence in Activities of Daily Living
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The lifetime functional endpoint. Most individuals acquire some basic
    self-care tasks independently, but the majority rely heavily on caregivers,
    and many require continuous supervision into adulthood. Skills continue to
    accrue rather than decline, so the trajectory is one of slow gain against a
    persistent support requirement.
  evidence:
  - reference: PMID:41175749
    reference_title: >-
      Improving prognostication for individuals with FOXP1 syndrome:
      Parent-reported practical and social skills in 52 individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although most individuals learn to perform some basic daily living tasks
      independently, the majority heavily rely on their parents, many needing
      24-7 supervision to support many aspects of daily life up to adulthood.
    explanation: >-
      Directly quantifies the level of ongoing support required, the practical
      endpoint families ask about.


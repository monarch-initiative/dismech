    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To elucidate the contribution of FOXP1-mediated signaling to brain
      development and, in particular, neocortical development, we generated
      forebrain-specific Foxp1 conditional knockout mice.
    explanation: >-
      Establishes the model system in which the cytoarchitectonic alteration and
      the vocalization deficit are jointly demonstrated.
  - reference: PMID:29090079
    reference_title: "Prospective investigation of FOXP1 syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Medical features included non-specific structural brain abnormalities and
      dysmorphic features, endocrine and gastrointestinal problems, sleep
      disturbances, and sinopulmonary infections.
    explanation: >-
      Human neuroimaging documents structural brain abnormality but is
      non-specific, so it only partially corroborates the model-derived
      cytoarchitectonic mechanism.
  - reference: PMID:37691105
    reference_title: >-
      Cortex-restricted deletion of Foxp1 impairs barrel formation and induces
      aberrant tactile responses in a mouse model of autism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, Foxp1 deficiency in cortical neurons altered the dendrite

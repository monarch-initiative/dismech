genetic:
- name: SCN2A
  gene_term:
    preferred_term: SCN2A
    term:
      id: hgnc:10588
      label: SCN2A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    SCN2A encodes the voltage-gated sodium channel Nav1.2. Most DEE variants are
    de novo. The functional consequence is genotype-dependent: gain-of-function
    variants cause early-onset (typically before three months) seizures
    responsive to sodium-channel blockers, whereas loss-of-function variants
    cause later-onset epilepsy and/or autism in which sodium-channel blockers
    can worsen seizures.
  evidence:
  - reference: PMID:28379373
    reference_title: "Genetic and phenotypic heterogeneity suggest therapeutic implications in SCN2A-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "truncating mutations were exclusively seen in patients with late onset epilepsies and lack of response to sodium channel blockers"
    explanation: >-
      Truncating (loss-of-function) SCN2A mutations mapped exclusively to
      late-onset epilepsy with poor sodium-channel-blocker response.
treatments:
- name: Sodium-Channel-Blocking Antiseizure Medication
  description: >-
    Sodium-channel blockers (e.g., phenytoin, carbamazepine, oxcarbazepine,
    lacosamide) are often effective in the early-onset gain-of-function group by
    countering the increased sodium current, but can paradoxically worsen
    seizures in the later-onset loss-of-function group - making functional
    variant classification central to treatment.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Increased Nav1.2 Sodium Current (Gain of Function)
    treatment_effect: INHIBITS
    description: >-
      Sodium-channel blockers reduce the increased Nav1.2 current in the
      gain-of-function arm.
    evidence:
    - reference: PMID:31904126
      reference_title: "Phenotypic spectrum and genetics of SCN2A-related disorders, treatment options, and outcomes in epilepsy and beyond."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sodium channel blockers may be effective antiepileptic medications in gain of function, neonatal and infantile presentations."
      explanation: >-
        Explicitly matches the drug class to the gain-of-function mechanism node
        it targets.
    - reference: PMID:28379373
      reference_title: "Genetic and phenotypic heterogeneity suggest therapeutic implications in SCN2A-related disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a good response to sodium channel blockers clinically was found to be associated with a relatively small gain-of-function"
      explanation: >-
        Links the degree of Nav1.2 gain of function to the clinical response to
        the inhibiting drug, supporting the mechanism-target relationship.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenytoin
      term:
        id: CHEBI:8107
        label: phenytoin
  evidence:
  - reference: PMID:28379373
    reference_title: "Genetic and phenotypic heterogeneity suggest therapeutic implications in SCN2A-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the use of sodium channel blockers was often associated with clinically relevant seizure reduction or seizure freedom in children with early infantile epilepsies (<3 months)"
    explanation: >-
      Sodium-channel blockers reduced seizures or achieved freedom in
      early-infantile (gain-of-function) SCN2A epilepsy.
  - reference: PMID:28379373
    reference_title: "Genetic and phenotypic heterogeneity suggest therapeutic implications in SCN2A-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sodium channel blockers were rarely effective in epilepsies with later onset (≥3 months) and sometimes induced seizure worsening"
    explanation: >-
      In later-onset (loss-of-function) SCN2A epilepsy the same drugs were
      rarely effective and sometimes worsened seizures - the key precision
      caveat.
- name: Broad-Spectrum Antiseizure Medication and Ketogenic Diet
  description: >-
    Broad-spectrum agents (e.g., levetiracetam, valproate, benzodiazepines) and
    the ketogenic diet are used, particularly in the later-onset loss-of-function
    group where sodium-channel blockers are avoided. Evidence for a specific
    non-sodium-channel-blocker regimen in SCN2A is limited; the rationale is
    largely the avoidance of sodium-channel blockade in the loss-of-function arm.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:28379373
    reference_title: "Genetic and phenotypic heterogeneity suggest therapeutic implications in SCN2A-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sodium channel blockers were rarely effective in epilepsies with later onset (≥3 months) and sometimes induced seizure worsening"
    explanation: >-
      Provides the rationale for using non-sodium-channel-blocking agents in the
      later-onset (loss-of-function) group.
  - reference: PMID:28379373
    reference_title: "Genetic and phenotypic heterogeneity suggest therapeutic implications in SCN2A-related disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas other antiepileptic drugs were less effective"
    explanation: >-
      Important caveat: in the early-infantile (gain-of-function) group,

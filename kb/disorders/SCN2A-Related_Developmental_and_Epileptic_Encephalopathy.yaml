- name: Elsunersen (SCN2A-Directed Antisense Oligonucleotide)
  description: >-
    Elsunersen (PRAX-222) is an investigational antisense oligonucleotide that
    lowers SCN2A expression by RNase H-mediated transcript knockdown, designed
    for the gain-of-function, early-onset arm; it holds FDA Breakthrough Therapy
    designation and is in clinical trials.

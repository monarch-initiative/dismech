inheritance:
- name: Autosomal dominant (de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    SCN2A-DEE is autosomal dominant; the great majority of variants are de novo.
    Recurrence risk to siblings is low but not zero (on the order of 1-2%)
    because of the possibility of parental germline (or low-level somatic)
    mosaicism.
  evidence:
  - reference: PMID:34859793
    reference_title: "Phenotypic spectrum and long-term outcome of children with genetic early-infantile-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With regards to inheritance pattern, de novo heterozygous mutations accounted for the majority (104/118; 88.1%)"
    explanation: >-
      In a genetically diagnosed early-infantile-onset DEE cohort (which included
      SCN2A cases), de novo heterozygous variants accounted for the large
      majority, supporting the de novo autosomal dominant mode of inheritance.
  - reference: PMID:31077350
    reference_title: "Parental mosaicism in epilepsies due to alleged de novo variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Parental mosaicism was observed in the following genes: SCN1A, SCN2A, SCN8A, and STXBP1."
    explanation: >-
      Documents parental somatic mosaicism for SCN2A variants that appeared de
      novo, the basis for the small but non-zero sibling recurrence risk.
  - reference: PMID:31077350
    reference_title: "Parental mosaicism in epilepsies due to alleged de novo variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "parents affected by low-grade mosaicism are faced with an increased recurrence risk for transmitting the pathogenic variant, compared to the overall recurrence risk for a second affected child estimated at approximately 1%"
    explanation: >-
      Quantifies the baseline sibling recurrence risk (~1%) and the mosaicism
      mechanism that raises it in individual families.
mechanistic_hypotheses:
- hypothesis_group_id: scn2a_gain_of_function_early_onset
  hypothesis_label: Gain-of-Function / Early-Onset Model
  status: CANONICAL
  description: >-
    Gain-of-function SCN2A variants increase Nav1.2 sodium current and neuronal
    excitability, producing early-infantile-onset epilepsy (typically before
    three months of age) that often responds to sodium-channel-blocking drugs.
  evidence:
  - reference: PMID:31904126
    reference_title: "Phenotypic spectrum and genetics of SCN2A-related disorders, treatment options, and outcomes in epilepsy and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some missense, gain of function variants tend to present in early infancy with epilepsy"
    explanation: >-
      States the gain-of-function / early-infantile-onset arm of the SCN2A
      dichotomy that this hypothesis group models.
  - reference: PMID:28256214
    reference_title: "Opposing Effects on Na(V)1.2 Function Underlie Differences Between SCN2A Variants Observed in Individuals With Autism Spectrum Disorder or Infantile Seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Variants observed in infantile seizures are predominantly missense, leading to a gain of function and increased neuronal excitability."
    explanation: >-
      Voltage-clamp characterization links infantile-seizure SCN2A variants to
      gain of Nav1.2 function and increased neuronal excitability.
- hypothesis_group_id: scn2a_loss_of_function_later_onset
  hypothesis_label: Loss-of-Function / Later-Onset Model
  status: CANONICAL
  description: >-
    Loss-of-function SCN2A variants reduce Nav1.2 current, impairing action
    potential firing in excitatory neurons, and typically produce later-onset
    (after three months) epilepsy and/or autism and intellectual disability, in
    which sodium-channel blockers can worsen seizures.
  evidence:
  - reference: PMID:37578743
    reference_title: "Epilepsy-associated SCN2A (NaV1.2) variants exhibit diverse and complex functional properties."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "predominantly gain-of-function variants cause neonatal-onset epilepsy, whereas loss-of-function variants are associated with ASD and ID"
    explanation: >-
      States the loss-of-function arm (autism and intellectual disability) of the
      SCN2A functional dichotomy modeled by this hypothesis group.
  - reference: PMID:28256214
    reference_title: "Opposing Effects on Na(V)1.2 Function Underlie Differences Between SCN2A Variants Observed in Individuals With Autism Spectrum Disorder or Infantile Seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast to gain of function variants that contribute to seizure, we found that all ASD-associated variants dampened or eliminated channel function."
    explanation: >-
      Direct electrophysiological demonstration that autism-associated SCN2A
      variants reduce or abolish Nav1.2 function.
  - reference: PMID:37578743
    reference_title: "Epilepsy-associated SCN2A (NaV1.2) variants exhibit diverse and complex functional properties."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Many epilepsy-associated variants in our study exhibited complex patterns of gain- and loss-of-functions that are difficult to classify by a simple binary scheme."
    explanation: >-
      Important caveat: high-throughput automated patch-clamp shows many variants
      have mixed gain/loss features, so the two-arm model is a useful
      simplification rather than a strict binary.
pathophysiology:
- name: SCN2A Variant (Nav1.2 Dysfunction)
  description: >-
    A pathogenic variant in SCN2A alters the function of the voltage-gated
    sodium channel Nav1.2. This node captures the single concept of the
    initiating channel lesion, whose functional direction (gain versus loss of
    function) sets the clinical arm.
  role: trigger
  gene:
    preferred_term: SCN2A
    term:
      id: hgnc:10588
      label: SCN2A
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
  evidence:
  - reference: PMID:29691040
    reference_title: "Progress in Understanding and Treating SCN2A-Mediated Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Advances in gene discovery for neurodevelopmental disorders have identified SCN2A dysfunction as a leading cause of infantile seizures, autism spectrum disorder, and intellectual disability. SCN2A encodes the neuronal sodium channel NaV1.2."
    explanation: >-
      Establishes the initiating lesion of this entry: SCN2A variants disrupting
      the neuronal sodium channel Nav1.2 as a leading cause of infantile
      seizures and neurodevelopmental disease.
  - reference: PMID:29691040
    reference_title: "Progress in Understanding and Treating SCN2A-Mediated Disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional assays demonstrate strong correlation between genotype and phenotype."
    explanation: >-
      Supports the modeling choice that the functional direction of the variant
      (gain versus loss of function) is what sets the clinical arm. The
      genotype-phenotype correlation is established by in vitro functional
      (electrophysiological) characterization of the variants.
  downstream:
  - target: Increased Nav1.2 Sodium Current (Gain of Function)
    causal_link_type: DIRECT
    description: >-
      Gain-of-function variants increase Nav1.2 sodium current.
    hypothesis_groups:
    - scn2a_gain_of_function_early_onset
    evidence:
    - reference: PMID:30813884
      reference_title: "Further corroboration of distinct functional features in SCN2A variants causing intellectual disability or epileptic phenotypes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "small gain-of-function variants cause BFNIE and EE variants exhibit variable but profound Nav1.2 gating changes"
      explanation: >-
        Whole-cell patch-clamp of patient variants links epilepsy-associated
        SCN2A alleles to gain of Nav1.2 channel function.
  - target: Decreased Nav1.2 Sodium Current (Loss of Function)
    causal_link_type: DIRECT
    description: >-
      Loss-of-function variants reduce Nav1.2 sodium current.
    hypothesis_groups:
    - scn2a_loss_of_function_later_onset
    evidence:
    - reference: PMID:30813884
      reference_title: "Further corroboration of distinct functional features in SCN2A variants causing intellectual disability or epileptic phenotypes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The three variants identified in ID patients without seizures, p.R937C, p.L611Vfs*35 and p.W1716*, did not produce measurable currents."
      explanation: >-
        Variants from intellectual-disability patients produced no measurable
        sodium current, i.e. loss of Nav1.2 function.
- name: Increased Nav1.2 Sodium Current (Gain of Function)
  description: >-
    Gain-of-function variants increase the Nav1.2 sodium current (through
    enhanced activation, impaired inactivation, or increased persistent
    current), directly raising neuronal excitability. This node captures the
    single concept of the gain-of-function channel state and conforms to the
    shared epilepsy final common pathway.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"

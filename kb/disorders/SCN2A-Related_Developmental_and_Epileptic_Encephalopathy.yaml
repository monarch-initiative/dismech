  phenotype_term:
    preferred_term: Autistic behavior
    term:
      id: HP:0000729
      label: Autistic behavior
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 7.5
  notes: >-
    SCN2A-related disorders have an estimated prevalence on the order of 5-8 per
    100,000 (cohort and patient-foundation estimates), with disease-causing
    variants arising in roughly 7.5 per 100,000 births; SCN2A is among the most
    frequently implicated single genes in developmental and epileptic
    encephalopathy and de novo autism. Figures are ascertainment-dependent and
    rising with expanded sequencing.
genetic:
- name: SCN2A
  gene_term:
    preferred_term: SCN2A
    term:
      id: hgnc:10588
      label: SCN2A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    SCN2A encodes the voltage-gated sodium channel Nav1.2. Most DEE variants are
    de novo. The functional consequence is genotype-dependent: gain-of-function
    variants cause early-onset (typically before three months) seizures
    responsive to sodium-channel blockers, whereas loss-of-function variants
    cause later-onset epilepsy and/or autism in which sodium-channel blockers
    can worsen seizures.
  evidence:
  - reference: PMID:28379373
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "truncating mutations were exclusively seen in patients with late onset epilepsies and lack of response to sodium channel blockers"
    explanation: >-
      Truncating (loss-of-function) SCN2A mutations mapped exclusively to
      late-onset epilepsy with poor sodium-channel-blocker response.
treatments:
- name: Sodium-Channel-Blocking Antiseizure Medication
  description: >-
    Sodium-channel blockers (e.g., phenytoin, carbamazepine, oxcarbazepine,
    lacosamide) are often effective in the early-onset gain-of-function group by
    countering the increased sodium current, but can paradoxically worsen
    seizures in the later-onset loss-of-function group - making functional
    variant classification central to treatment.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Increased Nav1.2 Sodium Current (Gain of Function)
    treatment_effect: INHIBITS
    description: >-
      Sodium-channel blockers reduce the increased Nav1.2 current in the
      gain-of-function arm.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenytoin
      term:
        id: CHEBI:8107
        label: phenytoin
  evidence:
  - reference: PMID:28379373
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the use of sodium channel blockers was often associated with clinically relevant seizure reduction or seizure freedom in children with early infantile epilepsies (<3 months)"
    explanation: >-
      Sodium-channel blockers reduced seizures or achieved freedom in
      early-infantile (gain-of-function) SCN2A epilepsy.
  - reference: PMID:28379373
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sodium channel blockers were rarely effective in epilepsies with later onset (≥3 months) and sometimes induced seizure worsening"
    explanation: >-
      In later-onset (loss-of-function) SCN2A epilepsy the same drugs were
      rarely effective and sometimes worsened seizures - the key precision
      caveat.
- name: Broad-Spectrum Antiseizure Medication
  description: >-
    Broad-spectrum agents are used, particularly in the loss-of-function group
    where sodium-channel blockers are avoided.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
datasets: []
discussions:
- discussion_id: scn2a-functional-classification-for-treatment
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Increased Nav1.2 Sodium Current (Gain of Function)"
  - "pathophysiology#Decreased Nav1.2 Sodium Current (Loss of Function)"
  prompt: >-
    Because sodium-channel blockers help gain-of-function SCN2A epilepsy but can
    worsen loss-of-function forms, treatment hinges on knowing the functional
    consequence of a variant. How reliably can gain versus loss of function be
    inferred at the bedside from age at onset (before versus after three months)
    and variant type, and how quickly can functional assays resolve ambiguous
    (e.g., missense, VUS) variants to guide drug choice?
  rationale: >-
    Onset age and truncating status are useful proxies but not perfect, and many
    missense variants are of uncertain effect; a wrong inference can select a
    drug that worsens seizures. A fast, validated functional-classification
    pathway would directly change management.
  evidence:
  - reference: PMID:28379373
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sodium channel blockers were rarely effective in epilepsies with later onset (≥3 months) and sometimes induced seizure worsening"
    explanation: >-
      Demonstrates the opposite treatment response by arm, motivating rapid
      functional classification.
  proposed_experiments:
  - experiment_id: scn2a-functional-assay-pipeline
    name: Rapid functional-classification pipeline
    description: >-
      Benchmark high-throughput electrophysiology and predictive models against
      clinical response to sodium-channel blockers across a large SCN2A variant
      set to establish a rapid gain/loss classification that guides therapy.
    readouts:
    - name: Predicted gain/loss versus clinical drug response
      target: "pathophysiology#Increased Nav1.2 Sodium Current (Gain of Function)"
    decision_criterion: >-
      A classifier that predicts drug response better than onset age alone would
      support its clinical use.
    would_support:
    - "pathophysiology#Increased Nav1.2 Sodium Current (Gain of Function)"
    - "pathophysiology#Decreased Nav1.2 Sodium Current (Loss of Function)"
- discussion_id: scn2a-precision-therapy-aso
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Increased Nav1.2 Sodium Current (Gain of Function)"
  prompt: >-
    Antisense-oligonucleotide and other gene-directed strategies that lower or
    raise Nav1.2 are in development for SCN2A disorders. Can allele- or
    direction-specific approaches safely correct the gain-of-function arm
    (lowering Nav1.2) and the loss-of-function arm (raising Nav1.2) without
    tipping the opposite way, and in what developmental window must they act?
  rationale: >-
    Because the two arms need opposite corrections, a one-size intervention is
    unsafe; the therapeutic window and the reversibility of the encephalopathy
    once established are open questions central to precision therapy.
  proposed_experiments:
  - experiment_id: scn2a-directional-therapy-model
    name: Direction-specific Nav1.2 modulation study
    description: >-
      Test gain-lowering (e.g., ASO knockdown) and loss-restoring approaches in
      genotype-matched SCN2A models across developmental stages, measuring
      seizure, network, and behavioral outcomes and off-target excitability.
    readouts:
    - name: Outcome of directional Nav1.2 modulation by arm and timing
      target: "pathophysiology#Increased Nav1.2 Sodium Current (Gain of Function)"
    would_support:
    - "pathophysiology#Increased Nav1.2 Sodium Current (Gain of Function)"
- discussion_id: scn2a-lof-autism-mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Decreased Nav1.2 Sodium Current (Loss of Function)"
  prompt: >-
    Loss-of-function SCN2A variants produce autism and intellectual disability,
    sometimes with little or no epilepsy. How does reduced Nav1.2 current in
    developing excitatory neurons translate into autism and cognitive impairment
    independent of seizures, and does this reflect impaired dendritic excitability
    and synaptic maturation?
  rationale: >-
    The seizure-independent neurodevelopmental phenotype of Nav1.2 loss of
    function is mechanistically distinct from the epileptogenic arm and is only
    partially understood, yet it defines the prognosis and therapeutic targets
    for a large share of SCN2A patients.
  proposed_experiments:
  - experiment_id: scn2a-lof-neurodevelopment
    name: Nav1.2 loss-of-function neurodevelopmental study
    description: >-
      Use human neurons and animal models with SCN2A loss-of-function variants
      to link reduced Nav1.2 current to dendritic excitability, synaptic
      maturation, and behavioral phenotypes independent of overt seizures.
    readouts:
    - name: Dendritic/synaptic phenotype and behavior with Nav1.2 loss
      target: "pathophysiology#Decreased Nav1.2 Sodium Current (Loss of Function)"
    would_support:
    - "pathophysiology#Decreased Nav1.2 Sodium Current (Loss of Function)"

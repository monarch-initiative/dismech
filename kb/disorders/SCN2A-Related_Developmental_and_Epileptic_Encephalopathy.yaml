- name: Decreased Nav1.2 Sodium Current (Loss of Function)
  description: >-
    Loss-of-function variants reduce the Nav1.2 sodium current, impairing action
    potential initiation and propagation especially in excitatory pyramidal
    neurons during early development. This node captures the single concept of
    the loss-of-function channel state and conforms to the shared epilepsy final
    common pathway.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  cell_types:
  - preferred_term: Pyramidal (excitatory) neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:
  - preferred_term: Sodium ion transmembrane transport
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:28379373
    reference_title: "Genetic and phenotypic heterogeneity suggest therapeutic implications in SCN2A-related disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mutations in patients with late-onset forms and an insufficient response to sodium channel blockers were associated with loss-of-function effects"
    explanation: >-
      Late-onset SCN2A forms with poor sodium-channel-blocker response show
      loss-of-function channel effects.
  downstream:
  - target: Neuronal Hyperexcitability and Network Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced excitatory-neuron firing dysregulates developing circuits and
      network excitability.
    hypothesis_groups:
    - scn2a_loss_of_function_later_onset
    evidence:
    - reference: PMID:31230762
      reference_title: "The Autism-Associated Gene Scn2a Contributes to Dendritic Excitability and Synaptic Function in the Prefrontal Cortex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "NaV1.2 loss reduced action potential backpropagation into dendrites, impairing synaptic plasticity and synaptic strength"
      explanation: >-
        Shows the intermediate steps by which reduced Nav1.2 current
        dysregulates cortical circuits (dendritic excitability and synaptic
        function) rather than acting through simple firing loss alone.
    - reference: PMID:34348148
      reference_title: "Severe deficiency of the voltage-gated sodium channel Na(V)1.2 elevates neuronal excitability in adult mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using a NaV1.2-deficient mouse model, we show enhanced intrinsic excitability of principal neurons in the prefrontal cortex and striatum, brain regions known to be involved in Scn2a-related seizures."
      explanation: >-
        Demonstrates that severe Nav1.2 deficiency can paradoxically produce
        network hyperexcitability, the counter-intuitive link this edge encodes.
- name: Neuronal Hyperexcitability and Network Dysfunction
  description: >-
    Both arms converge on abnormal cortical network excitability - direct
    hyperexcitability in the gain-of-function arm, and developmental network
    dysfunction in the loss-of-function arm. This node captures the single
    concept of the resulting network dysfunction and conforms to the shared
    epilepsy final common pathway.
  role: central_effector
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:34348148
    reference_title: "Severe deficiency of the voltage-gated sodium channel Na(V)1.2 elevates neuronal excitability in adult mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we report the counterintuitive finding that severe NaV1.2 deficiency results in increased neuronal excitability."
    explanation: >-
      Frames the convergent node: the loss-of-function arm does not simply
      reduce excitability but converges on the same abnormal network
      excitability as the gain-of-function arm.
  - reference: PMID:34348148
    reference_title: "Severe deficiency of the voltage-gated sodium channel Na(V)1.2 elevates neuronal excitability in adult mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This unexpected neuronal hyperexcitability may serve as a cellular basis underlying NaV1.2 deficiency-related seizures."
    explanation: >-
      Supports modeling this node as the proximate cellular substrate of
      seizures for both arms, including the loss-of-function arm.
  downstream:
  - target: Seizures and Developmental Encephalopathy
    causal_link_type: DIRECT
    description: >-
      Network dysfunction produces seizures and impaired development.
    evidence:
    - reference: PMID:34850743
      reference_title: "Antisense oligonucleotide therapy reduces seizures and extends life span in an SCN2A gain-of-function epilepsy model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Untreated Q/+ mice presented with spontaneous seizures at P1 and did not survive beyond P30."
      explanation: >-
        In a knock-in model of an SCN2A gain-of-function DEE variant, the
        resulting excitability change produces spontaneous seizures and early
        death, the clinical endpoint this edge encodes.
- name: Seizures and Developmental Encephalopathy
  description: >-
    The clinical result is seizures (focal, tonic, epileptic spasms, and others,
    with age and arm-dependent semiology) together with developmental
    impairment; the loss-of-function arm is more associated with autism and
    intellectual disability. This node captures the single concept of the
    seizure/encephalopathy endpoint and conforms to the shared epilepsy final
    common pathway.
  role: consequence
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:30813884
    reference_title: "Further corroboration of distinct functional features in SCN2A variants causing intellectual disability or epileptic phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deleterious variants in the voltage-gated sodium channel type 2 (Nav1.2) lead to a broad spectrum of phenotypes ranging from benign familial neonatal-infantile epilepsy (BFNIE), severe developmental and epileptic encephalopathy (DEE) and intellectual disability (ID) to autism spectrum disorders (ASD)."
    explanation: >-
      Defines the clinical endpoint of the pathograph: seizures plus
      developmental impairment across a spectrum from benign epilepsy to DEE,
      intellectual disability, and autism.
  - reference: PMID:31904126
    reference_title: "Phenotypic spectrum and genetics of SCN2A-related disorders, treatment options, and outcomes in epilepsy and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is increasing evidence that an important phenotype linked to the gene is autism and intellectual disability without epilepsy or with rare seizures in later childhood."
    explanation: >-
      Supports the arm-dependence of the endpoint: the loss-of-function arm can
      present as autism and intellectual disability with little or no epilepsy.

      (DEE11) concept.
mechanistic_hypotheses:
- hypothesis_group_id: scn2a_gain_of_function_early_onset
  hypothesis_label: Gain-of-Function / Early-Onset Model
  status: CANONICAL
  description: >-
    Gain-of-function SCN2A variants increase Nav1.2 sodium current and neuronal
    excitability, producing early-infantile-onset epilepsy (typically before
    three months of age) that often responds to sodium-channel-blocking drugs.
- hypothesis_group_id: scn2a_loss_of_function_later_onset
  hypothesis_label: Loss-of-Function / Later-Onset Model
  status: CANONICAL
  description: >-
    Loss-of-function SCN2A variants reduce Nav1.2 current, impairing action
    potential firing in excitatory neurons, and typically produce later-onset
    (after three months) epilepsy and/or autism and intellectual disability, in
    which sodium-channel blockers can worsen seizures.
pathophysiology:
- name: SCN2A Variant (Nav1.2 Dysfunction)
  description: >-
    A pathogenic variant in SCN2A alters the function of the voltage-gated
    sodium channel Nav1.2. This node captures the single concept of the
    initiating channel lesion, whose functional direction (gain versus loss of
    function) sets the clinical arm.
  role: trigger
  gene:
    preferred_term: SCN2A
    term:
      id: hgnc:10588
      label: SCN2A
  downstream:
  - target: Increased Nav1.2 Sodium Current (Gain of Function)
    causal_link_type: DIRECT
    description: >-
      Gain-of-function variants increase Nav1.2 sodium current.
    hypothesis_groups:
    - scn2a_gain_of_function_early_onset
  - target: Decreased Nav1.2 Sodium Current (Loss of Function)
    causal_link_type: DIRECT
    description: >-
      Loss-of-function variants reduce Nav1.2 sodium current.
    hypothesis_groups:
    - scn2a_loss_of_function_later_onset
- name: Increased Nav1.2 Sodium Current (Gain of Function)
  description: >-
    Gain-of-function variants increase the Nav1.2 sodium current (through
    enhanced activation, impaired inactivation, or increased persistent
    current), directly raising neuronal excitability. This node captures the
    single concept of the gain-of-function channel state and conforms to the
    shared epilepsy final common pathway.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Sodium ion transmembrane transport
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
    modifier: INCREASED
  evidence:
  - reference: PMID:28379373
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mutations associated with early infantile epilepsy result in increased sodium channel activity with gain-of-function"
    explanation: >-
      Functional studies show early-infantile-epilepsy SCN2A mutations increase
      sodium channel activity (gain of function).
  downstream:
  - target: Neuronal Hyperexcitability and Network Dysfunction
    causal_link_type: DIRECT
    description: >-
      Increased sodium current directly raises neuronal excitability.
    hypothesis_groups:
    - scn2a_gain_of_function_early_onset
- name: Decreased Nav1.2 Sodium Current (Loss of Function)
  description: >-
    Loss-of-function variants reduce the Nav1.2 sodium current, impairing action
    potential initiation and propagation especially in excitatory pyramidal
    neurons during early development. This node captures the single concept of
    the loss-of-function channel state and conforms to the shared epilepsy final
    common pathway.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Sodium ion transmembrane transport
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:28379373
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mutations in patients with late-onset forms and an insufficient response to sodium channel blockers were associated with loss-of-function effects"
    explanation: >-
      Late-onset SCN2A forms with poor sodium-channel-blocker response show
      loss-of-function channel effects.
  downstream:
  - target: Neuronal Hyperexcitability and Network Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced excitatory-neuron firing dysregulates developing circuits and
      network excitability.
    hypothesis_groups:
    - scn2a_loss_of_function_later_onset
- name: Neuronal Hyperexcitability and Network Dysfunction
  description: >-
    Both arms converge on abnormal cortical network excitability - direct
    hyperexcitability in the gain-of-function arm, and developmental network
    dysfunction in the loss-of-function arm. This node captures the single
    concept of the resulting network dysfunction and conforms to the shared
    epilepsy final common pathway.
  role: central_effector
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Seizures and Developmental Encephalopathy
    causal_link_type: DIRECT
    description: >-
      Network dysfunction produces seizures and impaired development.
- name: Seizures and Developmental Encephalopathy
  description: >-
    The clinical result is seizures (focal, tonic, epileptic spasms, and others,
    with age and arm-dependent semiology) together with developmental
    impairment; the loss-of-function arm is more associated with autism and
    intellectual disability. This node captures the single concept of the
    seizure/encephalopathy endpoint and conforms to the shared epilepsy final
    common pathway.
  role: consequence
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron

name: SCN2A-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-18T00:00:00Z"
category: Genetic
description: >-
  SCN2A-related developmental and epileptic encephalopathy (DEE11) is caused by
  pathogenic variants in SCN2A, which encodes the voltage-gated sodium channel
  Nav1.2. The disorder has a striking mechanistic dichotomy with opposite
  treatment implications. Gain-of-function variants increase Nav1.2 sodium
  current and typically produce early-infantile-onset (usually before three
  months) epilepsy that often responds to sodium-channel-blocking drugs.
  Loss-of-function variants reduce Nav1.2 current and typically produce
  later-onset (after three months) epilepsy and/or autism and intellectual
  disability, in which sodium-channel blockers can paradoxically worsen
  seizures. Determining the functional consequence of the variant is therefore
  central to management.
parents:
- Epilepsy
- Neurological Disease
synonyms:
- DEE11
- SCN2A encephalopathy
- SCN2A-related epilepsy

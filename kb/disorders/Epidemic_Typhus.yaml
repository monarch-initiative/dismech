    explanation: The review names the body louse as the human vector for epidemic typhus.
  - reference: PMID:9717922
    reference_title: Outbreak of epidemic typhus associated with trench fever in Burundi.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transmission of both diseases to such a large number of people has

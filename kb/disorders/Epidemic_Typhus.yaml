    explanation: The Burundi outbreak links large-scale epidemic typhus transmission to body-louse infestation.
- name: Flying-squirrel-associated sylvatic spillover
  description: >-
    In the United States, R. prowazekii also persists in a sylvatic cycle
    involving the southern flying squirrel, causing sporadic human infections
    after squirrel exposure.
  evidence:
  - reference: PMID:18582834
    reference_title: Epidemic typhus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Since 1975, R prowazekii infection in human beings has been related to
      contact with the flying squirrel Glaucomys volans in the USA.
    explanation: The review identifies flying-squirrel contact as a second, sylvatic exposure route.

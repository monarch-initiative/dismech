    Epidemic typhus is transmitted by the human body louse Pediculus humanus
    corporis; poor sanitary conditions and crowding promote louse proliferation
    and enable outbreaks.
  evidence:
  - reference: PMID:18582834
    reference_title: Epidemic typhus.
    supports: SUPPORT
    evidence_source: OTHER

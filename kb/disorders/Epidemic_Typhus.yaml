name: Epidemic typhus
creation_date: "2026-09-25T00:00:00Z"
category: Infectious Disease
parents:
- Typhus
- Rickettsial disease
- Bacterial Infection
synonyms:
- Epidemic louse-borne typhus
- Louse-borne typhus
- Classic typhus
- Brill-Zinsser disease
description: >-
  Epidemic typhus is an acute louse-borne rickettsiosis caused by the obligate
  intracytoplasmic bacterium Rickettsia prowazekii. Human body lice become
  infected while feeding on a bacteremic person and shed organisms in feces;
  scratching inoculates the contaminated feces through abrasions or onto mucosal
  surfaces. R. prowazekii then disseminates and infects vascular endothelial
  cells and macrophages, producing diffuse rickettsial vasculitis that manifests
  as a severe febrile illness with headache, myalgia, and a variably present
  rash. The organism can persist after primary infection and reactivate years
  later as Brill-Zinsser disease, and early cell-penetrant doxycycline treatment
  is the key disease-modifying therapy.
disease_term:
  preferred_term: epidemic louse-borne typhus
  term:
    id: MONDO:0019362
    label: epidemic louse-borne typhus
references:
- reference: PMID:18582834
  title: Epidemic typhus.
  findings:
  - statement: >-
      Lancet Infectious Diseases review supporting body-louse transmission,
      poor-sanitation risk, the United States flying-squirrel cycle,
      Brill-Zinsser recrudescence, and bioterrorism concern.
    supporting_text: >-
      Epidemic typhus is transmitted to human beings by the body louse Pediculus
      humanus corporis.
- reference: PMID:27726780
  title: The History of Epidemic Typhus.
  findings:
  - statement: >-
      Historical review identifying epidemic typhus as a Rickettsia prowazekii
      infection transmitted by Pediculus humanus corporis and tied to wars and
      other population disasters that promote louse proliferation.
    supporting_text: >-
      Epidemic typhus caused by Rickettsia prowazekii is one of the oldest
      pestilential diseases of humankind.
- reference: PMID:30712763
  title: "The Rickettsioses: A Practical Update."
  findings:
  - statement: >-
      Practical rickettsiosis review supporting the acute febrile presentation,
      rash variability, serology by indirect immunofluorescence, and doxycycline
      treatment.
    supporting_text: Doxycycline is the treatment of choice.
- reference: PMID:9346184
  title: Immunohistochemical diagnosis of typhus rickettsioses using an anti-lipopolysaccharide monoclonal antibody.
  findings:
  - statement: >-
      Autopsy immunohistochemistry identified Rickettsia prowazekii in
      endothelial cells and macrophages in fatal human epidemic typhus brain
      tissue.
    supporting_text: >-
      Rickettsia prowazekii organisms were identified in endothelium and
      macrophages in sections of the brains of three Egyptian men who died of
      epidemic louse-borne typhus
- reference: PMID:19327117
  title: Host-cell interactions with pathogenic Rickettsia species.
  findings:
  - statement: >-
      Mechanistic review supporting vascular endothelium as the central
      rickettsial target and vascular inflammation, impaired vascular integrity,
      and increased permeability as the syndrome of rickettsial vasculitis.
    supporting_text: >-
      vascular inflammation, insult to vascular integrity and compromised
      vascular permeability, collectively termed 'Rickettsial vasculitis'
- reference: PMID:17537665
  title: "A murine model of infection with Rickettsia prowazekii: implications for pathogenesis of epidemic typhus."
  findings:
  - statement: >-
      BALB/c mouse infection with R. prowazekii reproduces disseminated
      persistence and inflammatory lung, liver, and brain lesions, supporting
      this model for epidemic typhus pathogenesis.
    supporting_text: >-
      infected mice developed interstitial pneumonia, with consolidation of the
      alveoli, hemorrhages in lungs, multifocal granulomas in liver, and
      hemorrhages in brain
- reference: PMID:11005205
  title: "Establishment of a novel endothelial target mouse model of a typhus group rickettsiosis: evidence for critical roles for gamma interferon and CD8 T lymphocytes."
  findings:
  - statement: >-
      Endothelial-target typhus-group mouse model supporting vascular-target
      organ tropism and the requirement for gamma interferon and CD8 T cells in
      rickettsial clearance.
    supporting_text: >-
      Gamma interferon and CD8 T lymphocytes were demonstrated to be crucial to
      clearance of the rickettsiae and recovery from infection
- reference: PMID:9693729
  title: Bioenergetics of the obligate intracellular parasite Rickettsia prowazekii.
  findings:
  - statement: >-
      Review showing that the reduced R. prowazekii genome lacks glycolysis and
      encodes transporters that let the organism exploit host cytoplasmic ATP.
    supporting_text: >-
      the R. prowazekii genome contains genes encoding components of the
      tricarboxylic acid cycle as well as of the electron transport system, but
      lacks genes to support glycolysis
- reference: PMID:16923893
  title: "Study of the five Rickettsia prowazekii proteins annotated as ATP/ADP translocases (Tlc): Only Tlc1 transports ATP/ADP, while Tlc4 and Tlc5 transport other ribonucleotides."
  findings:
  - statement: >-
      ATP/ADP translocase study identifying Tlc1 as the energy transporter that
      exchanges rickettsial ADP for host-cell ATP.
    supporting_text: >-
      ATP/ADP translocase Tlc1, which exchanges bacterial ADP for host cell ATP
      as a source of energy
- reference: PMID:20049326
  title: Adipose tissue serves as a reservoir for recrudescent Rickettsia prowazekii infection in a mouse model.
  findings:
  - statement: >-
      Mouse recrudescence study supporting adipose tissue as a reservoir for
      latent R. prowazekii infection and the Brill-Zinsser relapse phenotype.
    supporting_text: >-
      Collectively these data suggest a role for adipose tissue as a potential
      reservoir for dormant infections with R. prowazekii.
- reference: PMID:19506016
  title: Directed mutagenesis of the Rickettsia prowazekii pld gene encoding phospholipase D.
  findings:
  - statement: >-
      Directed mutagenesis study linking the R. prowazekii phospholipase D gene
      to phagosomal escape and showing that a pld knockout attenuates guinea-pig
      virulence while retaining protective vaccine activity.
    supporting_text: >-
      the pld mutant exhibited attenuated virulence in the guinea pig model
- reference: PMID:9717922
  title: Outbreak of epidemic typhus associated with trench fever in Burundi.
  findings:
  - statement: >-
      Burundi outbreak study documenting body-louse-driven epidemic typhus and
      the fall in jail fatality after single-dose doxycycline treatment of
      suspected cases.
    supporting_text: >-
      A fatality rate of 15% among jail inmates fell to 0.5% after
      administration of a single dose of 200 mg doxycycline to suspected cases.
- reference: PMID:24336183
  title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
  findings:
  - statement: >-
      Review establishing the bacterial ribosome as a major antibiotic target
      for protein-synthesis inhibitors including doxycycline.
    supporting_text: The ribosome is one of the main antibiotic targets in the bacterial cell.

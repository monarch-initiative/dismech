diagnosis:
- name: Serologic diagnosis by indirect immunofluorescence assay
  description: >-
    Epidemic typhus is confirmed serologically; the indirect immunofluorescence
    assay is the test of choice, and because reactive antibodies are often absent
    in early illness, paired acute- and convalescent-phase sera are tested.
  diagnosis_term:
    preferred_term: serology testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Seroconversion or a rising anti-Rickettsia antibody titer between acute- and
    convalescent-phase sera supports the diagnosis.
  evidence:
  - reference: PMID:30712763
    reference_title: "The Rickettsioses: A Practical Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Serology is the mainstay of diagnosis, and the indirect immunofluorescence assay is the test of choice."
    explanation: The review identifies IFA serology as the reference diagnostic test for rickettsioses.
  - reference: PMID:30712763
    reference_title: "The Rickettsioses: A Practical Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Reactive antibodies are seldom present during early illness, so testing should be performed on both acute-phase and convalescent-phase sera."
    explanation: The review supports paired acute/convalescent serology because early antibodies are often absent.
treatments:
- name: Doxycycline therapy
  description: >-
    Doxycycline is the first-line therapy for rickettsial infections and is
    effective for epidemic typhus, where it reaches the intracellular organism
    and inhibits bacterial ribosomal protein synthesis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation
    treatment_effect: INHIBITS
    description: Doxycycline inhibits bacterial ribosomal protein synthesis.
  - target: Endothelial and Macrophage Rickettsial Infection
    treatment_effect: BYPASSES
    description: >-
      Doxycycline enters host cells, bypassing the cell-penetration constraint
      imposed by the intracytoplasmic rickettsial niche.
  evidence:
  - reference: PMID:30712763
    reference_title: "The Rickettsioses: A Practical Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Doxycycline is the treatment of choice.
    explanation: The practical review identifies doxycycline as the drug of choice for rickettsioses.
  - reference: PMID:9717922
    reference_title: Outbreak of epidemic typhus associated with trench fever in Burundi.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A fatality rate of 15% among jail inmates fell to 0.5% after
      administration of a single dose of 200 mg doxycycline to suspected cases.
    explanation: The Burundi outbreak gives epidemic-typhus-specific clinical support for doxycycline effectiveness.
progression:
- phase: Incubation and acute febrile illness
  notes: >-
    After body-louse-associated infection, epidemic typhus develops as an acute
    undifferentiated febrile rickettsiosis. Untreated disease can progress to
    severe vasculitic disease and death; effective doxycycline can rapidly abort
    outbreak fatality.
  evidence:
  - reference: PMID:30712763
    reference_title: "The Rickettsioses: A Practical Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rickettsioses present as an acute undifferentiated febrile illness"
    explanation: The review supports the acute febrile phase.
- phase: Brill-Zinsser recrudescence
  notes: >-
    R. prowazekii may persist after the primary illness and later recrudesce as
    Brill-Zinsser disease, sometimes many years after the original infection.
  evidence:
  - reference: PMID:18582834
    reference_title: Epidemic typhus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Brill-Zinsser disease, a relapsed form of epidemic typhus that appears as
      sporadic cases many years after the initial infection
    explanation: The review establishes delayed recrudescent disease as part of the epidemic typhus natural history.
prevalence:
- population: United States (2003-2016 commercial insurance claims)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Typhus-group rickettsioses are rarely diagnosed in the United States and are
    not nationally notifiable. In a large commercial claims database, epidemic
    typhus accounted for 931 of 1,799 typhus-group diagnoses (51.8%). This is a
    count of coded diagnoses, not a rate against a population denominator, so no
    prevalence class or normalized rate is asserted.
  evidence:
  - reference: PMID:31984654
    reference_title: Trends in clinical diagnoses of typhus group rickettsioses among a large U.S. insurance claims database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epidemic typhus (n = 931/1,799; 51.8%) was the most common TGRs"
    explanation: The claims-database study counts epidemic typhus diagnoses among typhus-group rickettsioses.
animal_models:
- name: BALB/c mouse R. prowazekii infection
  species: Mouse
  publication: PMID:17537665
  description: >-
    BALB/c mice infected with R. prowazekii develop disseminated infection with
    inflammatory lung, liver, and brain lesions, recapitulating the multi-organ
    pathology of epidemic typhus.
  modeled_mechanisms:
  - target: Endothelial and Macrophage Rickettsial Infection
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The model reproduces disseminated R. prowazekii infection and its inflammatory organ lesions.
    limitations: >-
      Mice are not the natural host and do not reproduce the louse-borne
      transmission route or the human rash.
    evidence:
    - reference: PMID:17537665
      reference_title: "A murine model of infection with Rickettsia prowazekii: implications for pathogenesis of epidemic typhus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        infected mice developed interstitial pneumonia, with consolidation of the
        alveoli, hemorrhages in lungs, multifocal granulomas in liver, and
        hemorrhages in brain
      explanation: The BALB/c model reproduces the disseminated inflammatory organ lesions of epidemic typhus.
- name: Endothelial-target typhus-group mouse model
  species: Mouse
  publication: PMID:11005205
  description: >-
    A mouse model of a typhus-group rickettsiosis targets vascular endothelium
    and shows that gamma interferon and CD8 T cells are required for clearance.
  modeled_mechanisms:
  - target: CD8 T-Cell and Interferon-Gamma Rickettsial Clearance
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: The model establishes the IFN-gamma/CD8 clearance requirement for typhus-group rickettsiae.
    limitations: >-
      The infecting organism is a typhus-group rickettsia other than R. prowazekii,
      so the clearance requirement is inferred for epidemic typhus.
    evidence:
    - reference: PMID:11005205
      reference_title: "Establishment of a novel endothelial target mouse model of a typhus group rickettsiosis: evidence for critical roles for gamma interferon and CD8 T lymphocytes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Gamma interferon and CD8 T lymphocytes were demonstrated to be crucial to
        clearance of the rickettsiae and recovery from infection
      explanation: Antibody-depletion experiments establish the IFN-gamma/CD8 clearance requirement in the typhus-group model.
- name: Guinea-pig R. prowazekii pld mutant
  species: Guinea pig
  genotype: R. prowazekii pld knockout
  publication: PMID:19506016
  description: >-
    A directed R. prowazekii pld knockout attenuates virulence in the guinea-pig
    model, linking phospholipase D to virulence.
  modeled_mechanisms:
  - target: Endothelial and Macrophage Rickettsial Infection
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Deleting the pld gene attenuates R. prowazekii virulence, implicating phospholipase D in the infection mechanism.
    limitations: The guinea-pig fever model measures virulence, not the human clinical syndrome.
    evidence:
    - reference: PMID:19506016
      reference_title: Directed mutagenesis of the Rickettsia prowazekii pld gene encoding phospholipase D.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the pld mutant exhibited attenuated virulence in the guinea pig model"
      explanation: The pld knockout attenuates virulence, supporting phospholipase D as a virulence factor.
- name: Mouse adipocyte R. prowazekii reservoir
  species: Mouse
  publication: PMID:20049326
  description: >-
    A mouse recrudescence model points to adipose tissue as a reservoir for
    dormant R. prowazekii, a plausible substrate for Brill-Zinsser relapse.
  modeled_mechanisms:
  - target: Adipose Reservoir and Brill-Zinsser Reactivation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The model identifies adipose tissue as a reservoir for dormant R. prowazekii.
    limitations: >-
      The adipose reservoir is shown in mice; the link to human Brill-Zinsser
      relapse is inferred.
    evidence:
    - reference: PMID:20049326
      reference_title: Adipose tissue serves as a reservoir for recrudescent Rickettsia prowazekii infection in a mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Collectively these data suggest a role for adipose tissue as a potential
        reservoir for dormant infections with R. prowazekii.
      explanation: The mouse model points to adipose tissue as a reservoir for dormant R. prowazekii.

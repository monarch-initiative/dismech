- name: Avoidance of Agents Precipitating Pheochromocytoma Crisis
  description: >-
    Dopamine D2 receptor antagonists (including antiemetics such as
    metoclopramide) and beta-adrenergic receptor antagonists given without prior
    alpha-blockade carry a high risk of adverse reactions in an individual with
    an unresected pheochromocytoma, and are avoided until pheochromocytoma has
    been excluded or resected.

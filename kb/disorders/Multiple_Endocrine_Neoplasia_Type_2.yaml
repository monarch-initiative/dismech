name: Multiple Endocrine Neoplasia Type 2
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Multiple endocrine neoplasia type 2 (MEN2) is an autosomal dominant hereditary
  cancer syndrome caused by germline activating mutations in the RET proto-oncogene.
  It is characterized by medullary thyroid carcinoma (MTC), pheochromocytoma, and
  depending on the subtype, primary hyperparathyroidism or mucosal neuromas with
  marfanoid habitus. MEN2 exemplifies oncogenic gain-of-function mutations in receptor
  tyrosine kinases and demonstrates genotype-phenotype correlations that guide the
  timing of prophylactic thyroidectomy and surveillance protocols.
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Endocrine Neoplasia
parents:
- hereditary cancer-predisposing syndrome
has_subtypes:
- name: MEN2A
  description: >-
    The most common subtype (95% of MEN2), characterized by medullary thyroid
    carcinoma (95%), pheochromocytoma (50%), and primary hyperparathyroidism (20-30%).
    Most commonly caused by mutations at codon 634 (Cys634Arg). Penetrance for MTC
    approaches 100% but varies with specific mutation.
  evidence:
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MEN2A and MEN2B involve an increased risk for pheochromocytoma; MEN2A
      involves an increased risk for parathyroid adenoma or hyperplasia.
    explanation: >-
      GeneReviews states the two features that define MEN2A against the other
      phenotypes: pheochromocytoma risk shared with MEN2B, and parathyroid
      disease which MEN2B does not carry.
  - reference: PMID:21862994
    reference_title: "Management of medullary thyroid carcinoma and MEN2 syndromes in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MEN2A accounts for 90-95% of childhood MTC cases and is most commonly due to
      mutations in codon 634 of RET.
    explanation: >-
      Supports both the predominance of MEN2A among MEN2 and the codon-634
      genotype named in this subtype description.
- name: MEN2B
  description: >-
    The most aggressive subtype (5% of MEN2), characterized by earlier and more
    aggressive MTC, pheochromocytoma (50%), mucosal neuromas of lips and tongue,
    intestinal ganglioneuromatosis, and marfanoid habitus. Does not include
    hyperparathyroidism. Caused by M918T mutation in 95% of cases.
  evidence:
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional features of MEN2B include mucosal neuromas of the lips and
      tongue, distinctive facies with enlarged lips, ganglioneuromatosis of the
      gastrointestinal tract, and a marfanoid habitus.
    explanation: >-
      GeneReviews enumerates the extra-endocrine features that distinguish MEN2B,
      matching this subtype description clause for clause.
  - reference: PMID:21862994
    reference_title: "Management of medullary thyroid carcinoma and MEN2 syndromes in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MEN2B is associated with the most aggressive
      clinical presentation of MTC and is almost always due to the
      Met918Thr mutation of RET.
    explanation: >-
      Supports both the aggressiveness and the M918T genotype. Note the source
      says "almost always" rather than giving the 95% figure this description
      quotes, so the numeric claim rests on other literature.
- name: Familial Medullary Thyroid Carcinoma (FMTC)
  description: >-
    MTC without pheochromocytoma or hyperparathyroidism in four or more family
    members. Now considered a variant of MEN2A with lower penetrance for
    pheochromocytoma rather than a separate entity. Associated with mutations
    at codons 609, 611, 618, 620, and 791.
  evidence:
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      familial medullary thyroid carcinoma (FMTC,
      which may be a variant of MEN2A)
    explanation: >-
      GeneReviews itself hedges FMTC as possibly a variant of MEN2A rather than a
      separate entity, which is the reclassification this subtype records.
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MTC typically occurs in early childhood in MEN2B, early
      adulthood in MEN2A, and middle age in FMTC.
    explanation: >-
      Supports the lower-penetrance, later-onset character of FMTC relative to
      the other two phenotypes.
pathophysiology:
- name: RET Oncogene Activation
  description: >-
    Germline activating mutations in RET cause ligand-independent receptor
    dimerization and constitutive tyrosine kinase activation. Unlike tumor
    suppressor syndromes, only one mutant allele is required (no second hit).
    This represents a gain-of-function oncogene mechanism.
  biological_processes:
  - preferred_term: transmembrane receptor protein tyrosine kinase signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007169
      label: cell surface receptor protein tyrosine kinase signaling pathway
  gene_products:
  - preferred_term: RET receptor
    term:
      id: NCIT:C18539
      label: Proto-Oncogene Tyrosine-Protein Kinase Receptor Ret
  evidence:
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identification of a
      heterozygous germline gain-of-function variant in RET on molecular genetic
      testing.
    explanation: >-
      Establishes the two claims this node's "no second hit" statement rests on:
      the variant is gain-of-function, and a single heterozygous allele is
      diagnostic — the oncogene pattern rather than the tumor-suppressor one.
  - reference: PMID:9620546
    reference_title: "Full activation of MEN2B mutant RET by an additional MEN2A mutation or by ligand GDNF stimulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In MEN2A
      mutations affecting cysteine residues in the extracellular domain of the
      receptor cause constitutive activation of the tyrosine kinase by the
      formation of disulfide-bonded homodimers.
    explanation: >-
      Direct support for the dimerization mechanism this node describes, and
      specifically for the MEN2A extracellular-cysteine class of alleles.
  - reference: PMID:9620546
    reference_title: "Full activation of MEN2B mutant RET by an additional MEN2A mutation or by ligand GDNF stimulation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      This mutation does not lead to
      dimer formation, but has been shown (both biologically and biochemically) to
      cause ligand-independent activation of the Ret protein
    explanation: >-
      Qualifies this node rather than supporting it as written. The MEN2B M918T
      allele activates RET ligand-independently WITHOUT forming dimers, so
      "ligand-independent receptor dimerization" holds for the MEN2A cysteine
      alleles but not for MEN2B. Recorded as partial support so the node is not
      read as asserting one mechanism for both subtypes; see the node notes.
  notes: >-
    Mechanism differs by subtype. The description above states ligand-independent
    dimerization, which is the MEN2A extracellular-cysteine mechanism. The MEN2B
    M918T allele sits in the kinase domain and is reported NOT to form dimers,
    activating instead through a cis-autophosphorylation route while remaining
    ligand-independent. Both converge on constitutive kinase activity, which is
    what the downstream nodes model, so the chain is unaffected — but the
    dimerization clause should not be read as covering MEN2B.
  downstream:
  - target: Downstream Signaling Cascade Activation
    description: Constitutive RET phosphorylation activates multiple signaling pathways
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15013219
      reference_title: "RET and neuroendocrine tumors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These
        signaling pathways are activated via binding of adaptor proteins to
        intracellular tyrosine residues of RET phosphorylated by its own kinase
        activity.
      explanation: >-
        Edge-level support: the downstream cascades are activated by adaptor
        binding to RET's own autophosphorylated tyrosines, which is exactly the
        step from constitutive kinase activity to cascade activation.
- name: Downstream Signaling Cascade Activation
  description: >-
    Constitutively active RET phosphorylates intracellular substrates and activates
    RAS-MAPK, PI3K-AKT, and JAK-STAT signaling pathways. These promote cell
    proliferation, survival, and transformation of neuroendocrine cell populations.
  biological_processes:
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  - preferred_term: phosphatidylinositol 3-kinase signaling
    modifier: INCREASED
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  evidence:
  - reference: PMID:15013219
    reference_title: "RET and neuroendocrine tumors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RET can activate various signaling pathways such as RAS/extracellular signal-regulated
      kinase (ERK), phosphatidylinositol 3-kinase (PI3K)/AKT, p38 mitogen-activated
      protein kinase (MAPK) and c-Jun N-terminal kinase (JNK) pathways.
    explanation: >-
      Supports the RAS-MAPK and PI3K-AKT arms annotated on this node, and adds
      p38 MAPK and JNK. It does NOT mention JAK-STAT, which this node's
      description also names; that arm is currently unevidenced here.
  downstream:
  - target: Neuroendocrine Cell Transformation
    description: Sustained signaling drives transformation of thyroid C-cells and chromaffin cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15013219
      reference_title: "RET and neuroendocrine tumors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The constitutive activation of the RET by somatic
        rearrangement with other partner genes or germ-line mutations causes a
        considerable population of human papillary thyroid carcinomas or multiple
        endocrine neoplasia (MEN) type 2A and 2B, respectively
      explanation: >-
        Edge-level support: sustained (constitutive) RET signalling from germline
        mutation is what produces MEN2A and MEN2B, i.e. the neoplastic
        transformation of the neuroendocrine lineages this edge targets.
- name: Neuroendocrine Cell Transformation
  description: >-
    Constitutive RET signaling drives transformation of neuroendocrine cell
    populations. C-cell hyperplasia precedes MTC development and serves as a
    preneoplastic lesion. Similar processes affect adrenal chromaffin cells
    leading to pheochromocytoma.
  cell_types:
  - preferred_term: parafollicular cell
    term:
      id: CL:0000570
      label: parafollicular cell
  - preferred_term: chromaffin cell
    term:
      id: CL:0000166
      label: chromaffin cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:21862994
    reference_title: "Management of medullary thyroid carcinoma and MEN2 syndromes in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it frequently occurs secondary
      to activating mutations in the RET proto-oncogene and arises from pre-existing
      C-cell hyperplasia.
    explanation: >-
      Supports the central claim of this node — that C-cell hyperplasia is the
      preneoplastic lesion MTC arises from, downstream of activating RET.
  downstream:
  - target: Tumor Development
    description: Progressive transformation leads to carcinoma
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21862994
      reference_title: "Management of medullary thyroid carcinoma and MEN2 syndromes in childhood."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        arises from pre-existing
        C-cell hyperplasia.
      explanation: >-
        Edge-level support: the carcinoma arises FROM the pre-existing hyperplasia,
        which is the progression this edge encodes rather than two independent
        findings in the same gland.
- name: Tumor Development
  description: >-
    C-cell hyperplasia progresses to medullary thyroid carcinoma. The age of MTC
    onset correlates with mutation location and aggressiveness. MEN2B mutations
    (M918T) cause earliest onset, often in infancy, while some FMTC mutations
    may not cause MTC until adulthood.
  evidence:
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MTC typically occurs in early childhood in MEN2B, early
      adulthood in MEN2A, and middle age in FMTC.
    explanation: >-
      Supports the genotype-dependent age of onset this node asserts, ordered
      exactly as described (MEN2B earliest, FMTC latest).
  - reference: PMID:21862994
    reference_title: "Management of medullary thyroid carcinoma and MEN2 syndromes in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strong genotype-phenotype
      correlations have facilitated the development of guidelines for interventions.
    explanation: >-
      Supports the genotype-phenotype correlation framing, and why it is
      actionable — it is the basis of the prophylactic-thyroidectomy timing
      guidelines this entry curates as treatment.
phenotypes:
- category: Neoplastic
  name: Medullary Thyroid Carcinoma
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    MTC is the defining neoplasm of MEN2 and the primary cause of morbidity and
    mortality. Develops from thyroid C-cells that produce calcitonin. Penetrance
    approaches 100% for the highest-risk genotypes but is mutation-dependent and
    is substantially lower for moderate-risk variants and in unselected carriers
    ascertained incidentally, so the frequency band is VERY_FREQUENT rather than
    OBLIGATE. Age of onset likewise depends on RET mutation: MEN2B patients may
    develop MTC in infancy while some FMTC mutations cause later onset.
    Prophylactic thyroidectomy timing is based on mutation risk category.
  phenotype_term:
    preferred_term: Medullary thyroid carcinoma
    term:
      id: HP:0002865
      label: Medullary thyroid carcinoma
  evidence:
  - reference: PMID:21862994
    reference_title: "Management of medullary thyroid carcinoma and MEN2 syndromes in childhood."
    supports: SUPPORT
    snippet: >-
      MEN2A accounts for 90-95% of childhood MTC cases and is most commonly due to
      mutations in codon 634 of RET. MEN2B is associated with the most aggressive
      clinical presentation of MTC and is almost always due to the Met918Thr mutation
      of RET.
    explanation: >-
      Review confirms MTC is the hallmark of MEN2 with genotype-phenotype correlations
      determining clinical presentation and aggressiveness.
- category: Neoplastic
  name: Pheochromocytoma
  frequency: FREQUENT
  description: >-
    Pheochromocytomas occur in approximately 50% of MEN2A and MEN2B patients.
    Often bilateral (50-80%) and may be diagnosed before, concurrent with, or
    after MTC. Screening with plasma metanephrines is essential before any surgery.
    Generally benign but can cause hypertensive crises if undiagnosed.
  phenotype_term:
    preferred_term: Pheochromocytoma
    term:
      id: HP:0002666
      label: Pheochromocytoma
  evidence:
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MEN2A and MEN2B involve an increased risk for pheochromocytoma
    explanation: >-
      GeneReviews confirms pheochromocytoma risk in both MEN2A and MEN2B.
- category: Endocrine
  name: Primary Hyperparathyroidism
  subtype: MEN2A
  description: >-
    Primary hyperparathyroidism occurs in roughly 20-30% of MEN2A patients
    (highest with codon 634 variants; nationwide population-based series report
    lower figures than referral cohorts) but not in MEN2B. Usually multigland
    disease. May be asymptomatic or cause hypercalcemia symptoms. Often milder
    than MEN1-associated hyperparathyroidism.
  phenotype_term:
    preferred_term: Hyperparathyroidism
    term:
      id: HP:0000843
      label: Hyperparathyroidism
  evidence:
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MEN2A involves an increased risk for parathyroid adenoma or hyperplasia
    explanation: >-
      GeneReviews confirms primary hyperparathyroidism is a MEN2A-specific
      manifestation, absent in MEN2B.
- category: Neurologic
  name: Mucosal Neuromas
  frequency: VERY_FREQUENT
  subtype: MEN2B
  description: >-
    Mucosal neuromas of the lips, tongue, and eyelids are characteristic of MEN2B
    and may be present from early childhood. They produce a distinctive bumpy,
    nodular appearance of the lips and thickened appearance of the eyelids.
  phenotype_term:
    preferred_term: Ganglioneuroma
    term:
      id: HP:0003005
      label: Ganglioneuroma
  notes: >-
    Mucosal neuromas represent ganglioneuromas of mucosal surfaces. The term
    ganglioneuroma is used as there is no specific HP term for mucosal neuromas.
  evidence:
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional features of MEN2B include mucosal neuromas of the lips and
      tongue, distinctive facies with enlarged lips, ganglioneuromatosis of the
      gastrointestinal tract, and a marfanoid habitus.
    explanation: >-
      GeneReviews lists mucosal neuromas of the lips and tongue as a defining
      MEN2B feature.
- category: Gastrointestinal
  name: Intestinal Ganglioneuromatosis
  subtype: MEN2B
  description: >-
    Diffuse ganglioneuromatosis of the gastrointestinal tract occurs in MEN2B,
    causing constipation, megacolon, and feeding difficulties from infancy.
  phenotype_term:
    preferred_term: Ganglioneuroma
    term:
      id: HP:0003005
      label: Ganglioneuroma
  evidence:
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional features of MEN2B include mucosal neuromas of the lips and
      tongue, distinctive facies with enlarged lips, ganglioneuromatosis of the
      gastrointestinal tract, and a marfanoid habitus.
    explanation: >-
      GeneReviews lists gastrointestinal ganglioneuromatosis as a defining
      MEN2B feature.
- category: Skeletal
  name: Marfanoid Habitus
  frequency: VERY_FREQUENT
  subtype: MEN2B
  description: >-
    MEN2B patients often have a marfanoid body habitus with tall stature, long
    limbs, arachnodactyly, pectus excavatum, and high-arched palate. Unlike true
    Marfan syndrome, they do not have lens dislocation or aortic root dilation.
  phenotype_term:
    preferred_term: Marfanoid habitus
    term:
      id: HP:0001519
      label: Disproportionate tall stature
  notes: >-
    HP:0001519 carries "Marfanoid habitus" as an exact synonym and is the correct
    binding for the whole-habitus phenotype. Arachnodactyly (HP:0001166) is only
    one component of the marfanoid habitus and understates the finding.
  evidence:
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional features of MEN2B include mucosal neuromas of the lips and
      tongue, distinctive facies with enlarged lips, ganglioneuromatosis of the
      gastrointestinal tract, and a marfanoid habitus.
    explanation: >-
      GeneReviews lists marfanoid habitus as a defining MEN2B feature.
biochemical:
- name: Serum Calcitonin
  biomarker_term:
    preferred_term: Calcitonin
    term:
      id: NCIT:C2281
      label: Calcitonin
  notes: >-
    Calcitonin is produced by thyroid C-cells and elevated in MTC. Used for
    diagnosis, staging, and post-operative surveillance. Stimulated calcitonin
    testing may detect early C-cell hyperplasia or microcarcinoma.
  evidence:
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Annual measurement of serum calcitonin concentration in those who have not
      had prophylactic thyroidectomy and to detect residual or recurrent MTC
      after thyroidectomy
    explanation: >-
      GeneReviews specifies serum calcitonin as the surveillance analyte both
      before thyroidectomy and for residual or recurrent disease afterwards,
      supporting the surveillance role recorded here.
- name: Plasma Metanephrines
  notes: >-
    Fractionated plasma metanephrines are used to screen for pheochromocytoma.
    Must be performed before any surgery (especially thyroidectomy) to avoid
    intraoperative hypertensive crisis from undiagnosed pheochromocytoma.
  evidence:
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Measurement of
      plasma free metanephrines or 24-hour urine for fractionated metanephrines to
      evaluate for functioning pheochromocytoma prior to any surgery in individuals
      with MEN2A, MEN2B, or FMTC.
    explanation: >-
      GeneReviews states both the analyte and the timing constraint this note
      records — screening must precede any surgery. Note the source gives the
      requirement without naming intraoperative hypertensive crisis as the
      reason, so that rationale is standard practice rather than a quoted claim.
genetic:
- name: RET
  gene_term:
    preferred_term: RET
    term:
      id: hgnc:9967
      label: RET
  association: Germline Activating Mutations
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:20301434
      reference_title: "Multiple Endocrine Neoplasia Type 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All MEN2 phenotypes are inherited in an autosomal dominant
        manner.
      explanation: >-
        GeneReviews states the mode of inheritance for every MEN2 phenotype,
        which is what this block asserts.
    - reference: PMID:11786689
      reference_title: "Multiple endocrine neoplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All these forms of MEN may
        be inherited as autosomal dominant syndromes.
      explanation: >-
        Independent corroboration across the MEN syndromes, including all three
        MEN2 clinical variants.
  notes: >-
    RET (10q11.21) encodes a receptor tyrosine kinase essential for neural crest
    development. Germline activating mutations cause ligand-independent dimerization
    and kinase activation. MEN2A is most commonly caused by cysteine mutations
    in extracellular domain (codons 609, 611, 618, 620, 634). MEN2B is caused by
    M918T in 95% of cases. De novo mutations account for 50% of MEN2B and 5% of
    MEN2A. Penetrance for MTC approaches 100% but age of onset varies with mutation.
  evidence:
  - reference: PMID:11786689
    reference_title: "Multiple endocrine neoplasia."
    supports: SUPPORT
    snippet: >-
      The gene causing all three MEN2 variants is located on chromosome 10cen-10q11.2,
      and is the c-ret proto-oncogene which encodes a tyrosine kinase receptor with
      cadherin-like and cysteine-rich extracellular domains, and a tyrosine kinase
      intracellular domain. Specific mutations of c-ret have been identified for each
      of the three MEN2 variants.
    explanation: >-
      Review confirms RET proto-oncogene as the gene responsible for all MEN2 variants
      with specific mutations identified for each clinical variant.
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 5%-9% of individuals with MEN2A and 50% of individuals with
      MEN2B have the disorder as the result of a de novo germline pathogenic
      variant.
    explanation: >-
      GeneReviews gives the de novo germline-variant rate as 50% for MEN2B and
      5%-9% for MEN2A, confirming the figures in this note; the "roughly 75%"
      figure elsewhere in the KB literature (DOI:10.3390/cancers15194865) refers
      to sporadic (non-MEN2) MTC overall, not the MEN2B de novo germline rate,
      and is not a conflicting statistic on this claim.
diagnosis:
- name: RET Molecular Genetic Testing
  description: >-
    The diagnosis of MEN2 is established either clinically, in a proband meeting
    existing clinical diagnostic criteria, or molecularly, by identification of a
    heterozygous germline gain-of-function RET variant. Molecular testing is
    recommended in every individual with a clinical diagnosis because
    surveillance and treatment recommendations are genotype-specific and a
    confirmed familial variant enables cascade testing of at-risk relatives.
  diagnosis_term:
    preferred_term: RET molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A heterozygous germline gain-of-function RET variant establishes the
    molecular diagnosis.
  notes: >-
    Molecular testing of RET identifies pathogenic variants and guides management.
    ATA risk categories based on specific mutations determine timing of prophylactic
    thyroidectomy: highest risk (M918T) within first year of life; high risk
    (codons 634, A883F) before age 5; moderate risk (others) individualized.
  evidence:
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of MEN2 is established in a proband who fulfills existing
      clinical diagnostic criteria or by identification of a heterozygous
      germline gain-of-function variant in RET on molecular genetic testing.
    explanation: >-
      GeneReviews states the two routes by which the MEN2 diagnosis is
      established, with molecular identification of a germline gain-of-function
      RET variant as the molecular criterion.
  - reference: PMID:20301434
    reference_title: "Multiple Endocrine Neoplasia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular genetic testing is recommended in all individuals with a
      clinical diagnosis due to genotype-specific surveillance and treatment
      recommendations and to allow family studies.
    explanation: >-
      GeneReviews supports testing every clinically diagnosed individual, and
      gives the two reasons recorded here: genotype-specific surveillance and
      treatment, and cascade family studies.
treatments:
- name: Prophylactic Thyroidectomy
  description: >-
    Total thyroidectomy prevents MTC development. Timing is based on ATA risk
    stratification: highest risk (M918T) in first year of life; high risk (codon
    634, A883F) before age 5; moderate risk individualized based on calcitonin
    levels and family history. Central lymph node dissection may be included.
  therapeutic_modality: SURGERY

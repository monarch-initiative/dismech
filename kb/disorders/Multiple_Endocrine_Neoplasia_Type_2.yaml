classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    notes: >-
      MEN2 is a hereditary cancer syndrome. Medullary thyroid carcinoma is the
      defining neoplasm and the primary cause of morbidity and mortality, and
      the entry curates kinase-inhibitor therapy for metastatic MTC, so the
      oncology Part applies.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      The organ-system Part is retained rather than omitted as it usually is for
      cancers. MEN2 is defined by tumors of two or more endocrine glands
      (thyroid C-cells, adrenal chromaffin cells, parathyroid), and essentially
      all of its clinical management is endocrine: calcitonin and metanephrine
      surveillance, genotype-directed prophylactic thyroidectomy, adrenalectomy
      before thyroidectomy, parathyroid surgery, and post-thyroidectomy
      hypothyroidism replacement.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Autosomal dominant germline RET disorder with strong, clinically
      actionable genotype-phenotype correlations — the correlations are what set
      surveillance and the timing of prophylactic surgery, so the Mendelian axis
      is not incidental here.
notes: >-
  Classification note. `icdo_morphology` is deliberately left empty. The enum
  classifies a tumor morphology, and this entry is a multi-tumor predisposition
  syndrome rather than a single neoplasm — its component tumors span carcinoma
  (medullary thyroid carcinoma), pheochromocytoma and parathyroid
  adenoma/hyperplasia, so no single morphology value describes the entry. A
  future per-tumor entry for MTC would take `Carcinoma`.
  `mechanistic_category` is also empty: RET is a receptor tyrosine kinase but
  MEN2 is not a RASopathy (which the enum reserves for germline RAS/MAPK
  disorders such as Noonan, Costello, CFC and NF1), and no RTK/oncogene-
  activation value exists.

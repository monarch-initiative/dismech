discussions:
- discussion_id: gap_arts_tissue_selectivity
  prompt: >-
    Which PRPP-dependent metabolite deficits drive the selective neural,
    auditory, optic, peripheral-nerve, and immune manifestations of Arts syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#PRPP-Dependent Biosynthetic Constraint
  rationale: >-
    Human studies establish PRPS1 loss, low enzyme activity, and purine-pathway
    abnormalities, but do not resolve why particular high-demand tissues are
    affected or which purine, pyrimidine, or NAD-pathway deficit is causal.
  evidence:
  - reference: PMID:41787648
    reference_title: "PRPS1 (p.V42L) Mutation in Arts Syndrome Induces Aberrant Neural Stem Cell Development and Neuronal Senescence-Like Phenotype: Rescue by Nicotinamide Mononucleotide Supplementation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      therapeutic interventions remain limited, largely due to an incomplete
      understanding of the cellular pathophysiology underlying the disorder.
    explanation: The 2026 mechanistic study explicitly identifies this limitation.
- discussion_id: mismatch_arts_models
  prompt: >-
    Do the single-variant iPSC model and dual-paralog zebrafish loss models
    reproduce the mechanisms operating across genetically diverse human Arts syndrome?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Neural Stem Cell Proliferation
  - pathophysiology#Neural Stem Cell Senescence-Like State
  - pathophysiology#Impaired Neurite Outgrowth
  rationale: >-
    The human neural findings derive from one patient-specific p.V42L line, while
    zebrafish have two prps1 paralogs and model graded transcript loss. Neither
    system establishes prevalence across variants or validates the cellular
    findings in affected human tissue.
  evidence:
  - reference: PMID:41787648
    reference_title: "PRPS1 (p.V42L) Mutation in Arts Syndrome Induces Aberrant Neural Stem Cell Development and Neuronal Senescence-Like Phenotype: Rescue by Nicotinamide Mononucleotide Supplementation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study, we generated patient-specific induced pluripotent stem cells
      harboring the PRPS1 p.V42L variant and differentiated them into neural stem
      cells (NSCs) and neurons to elucidate disease mechanisms and explore potential
      therapeutic strategies.
    explanation: The study identifies the single patient-specific variant model.
  - reference: PMID:27425195
    reference_title: Additive reductions in zebrafish PRPS1 activity result in a spectrum of deficiencies modeling several human PRPS1-associated diseases.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found two paralogs in zebrafish, prps1a and prps1b and characterized
      each paralogous mutant individually as well as the double mutant fish.
    explanation: The model-organism study documents the paralog-specific design.
- discussion_id: gap_arts_treatment_efficacy
  prompt: >-
    Do SAMe, nicotinamide riboside, or nicotinamide mononucleotide improve
    survival or neurologic outcomes in controlled human studies?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#PRPP-Dependent Biosynthetic Constraint
  rationale: >-
    SAMe and SAMe-plus-NR evidence is limited to a handful of uncontrolled cases;
    NMN evidence is limited to one in-vitro patient-derived model. No Arts-specific
    interventional trial was identified in the literature and trial-registry review
    current through 2026-08-05. NCT06092346 was dispositioned as not Arts-specific
    because its cached summary names only the broad DPPM population and does not
    explicitly identify PRPS1 deficiency eligibility.
  evidence:
  - reference: DOI:10.1002/jmd2.12395
    reference_title: "S‐adenosylmethionine and nicotinamide riboside therapy in Arts syndrome: A case report and literature review"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had stability or improvement of symptoms, suggesting that SAMe
      and NR can be a treatment option in Arts syndrome, though further studies
      are warranted.
    explanation: The report supports a preliminary signal while explicitly calling for more study.

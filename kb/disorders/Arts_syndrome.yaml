animal_models:
- species: Zebrafish (Danio rerio)
  genotype: prps1a and prps1b single and double loss-of-function mutants
  description: >-
    Additive loss of the two zebrafish paralogs produces graded eye, hair-cell,
    motor-neuron, innervation, and leukocyte abnormalities resembling features
    of the human PRPS1-deficiency spectrum.
  associated_phenotypes:
  - Smaller eyes
  - Reduced hair cell number
  - Abnormal primary motor-neuron development
  - Abnormal hair-cell innervation
  - Reduced leukocytes
  evidence:
  - reference: PMID:27425195
    reference_title: Additive reductions in zebrafish PRPS1 activity result in a spectrum of deficiencies modeling several human PRPS1-associated diseases.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The double mutant also showed abnormal development of primary motor neurons,
      hair cell innervation, and reduced leukocytes, consistent with the neuropathy
      and recurrent infection of the human patients possessing the most severe
      reductions of PRPS1 activity.
    explanation: The zebrafish model recapitulates neurologic, auditory, and immune features.

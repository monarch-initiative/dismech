    reference_title: "PRPS1 (p.V42L) Mutation in Arts Syndrome Induces Aberrant Neural Stem Cell Development and Neuronal Senescence-Like Phenotype: Rescue by Nicotinamide Mononucleotide Supplementation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Notably, supplementation with nicotinamide mononucleotide, a precursor of
      nicotinamide adenine dinucleotide (NAD＋), partially ameliorated defects in
      NSC proliferation, nuclear architecture, and neuronal morphology.
    explanation: This supports only preclinical cellular rescue, not human efficacy.

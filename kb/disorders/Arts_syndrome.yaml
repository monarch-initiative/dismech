name: Arts syndrome
creation_date: "2026-04-16T00:00:00Z"
description: >-
  Arts syndrome is the severe end of the PRPS1 deficiency spectrum and is an
  X-linked multisystem disorder characterized by early-onset sensorineural
  hearing impairment, ataxia, hypotonia, developmental delay, optic atrophy,
  retinal dystrophy, and recurrent infections.
category: Mendelian
parents:
- hereditary disease
- syndromic disease
- Inborn Error of Purine Metabolism
classifications:
  icimd_category:
  - classification_value: purine_metabolism
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of
      purine metabolism" under category "Disorders of nucleobase, nucleotide
      and nucleic acid metabolism". Arts syndrome is the severe PRPS1
      deficiency presentation with impaired purine biosynthesis.
disease_term:
  preferred_term: Arts syndrome
  term:
    id: MONDO:0010533
    label: Arts syndrome
definitions:
- name: Orphanet Arts syndrome definition
  definition_type: OTHER
  description: >-
    A severe PRPS1-deficiency presentation characterized by intellectual
    disability, early hypotonia and ataxia, delayed motor development,
    sensorineural hearing impairment, and progressive visual loss from optic
    atrophy.
  evidence:
  - reference: ORPHA:1187
    reference_title: Arts syndrome (Orphanet structured-database record)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Lethal ataxia with deafness and optic atrophy (also known as Arts syndrome)
      is characterized by intellectual deficit, early-onset hypotonia, ataxia,
      delayed motor development, hearing impairment and loss of vision due to
      optic atrophy.
    explanation: Orphanet provides a disease-specific clinical definition.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  notes: Orphanet reports worldwide point prevalence below 1 per 1,000,000.
  evidence:
  - reference: ORPHA:1187
    reference_title: Arts syndrome (Orphanet structured-database record)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Worldwide | Point prevalence | PMID:27256512"
    explanation: Orphanet supplies the point-prevalence class without an exact rate.
inheritance:
- name: X-linked recessive inheritance
  description: >-
    Arts syndrome is inherited in an X-linked manner; hemizygous males are
    typically more severely affected, while heterozygous females may be
    asymptomatic or variably affected because of X-chromosome inactivation.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:20301738
    reference_title: Phosphoribosylpyrophosphate Synthetase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PRS deficiency is inherited in an X-linked manner. If the mother of the
      proband has a PRPS1 pathogenic variant, the chance of transmitting it in
      each pregnancy is 50%; if the father of the proband has a PRPS1 pathogenic
      variant, he will transmit it to all his daughters and none of his sons.
    explanation: GeneReviews establishes X-linked inheritance and transmission risks.
pathophysiology:
- name: PRPS1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Pathogenic PRPS1 variants reduce phosphoribosylpyrophosphate synthetase 1
    function and initiate the PRPS1 deficiency cascade.
  genes:
  - preferred_term: PRPS1
    term:
      id: hgnc:9462
      label: PRPS1
  molecular_functions:
  - preferred_term: ribose phosphate diphosphokinase activity
    modifier: DECREASED
    term:
      id: GO:0004749
      label: ribose phosphate diphosphokinase activity
  evidence:
  - reference: DOI:10.1002/jmd2.12395
    reference_title: "S‐adenosylmethionine and nicotinamide riboside therapy in Arts syndrome: A case report and literature review"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Phospho‐ribosyl‐pyrophosphate synthetase 1 (PRPS1) deficiency is secondary
      to loss of function variants in PRPS1.
    explanation: >-
      Directly links Arts syndrome to PRPS1 loss-of-function variants.
  downstream:
  - target: PRS-I Enzyme Deficiency
    description: >-
      PRPS1 loss-of-function variants reduce phosphoribosylpyrophosphate
      synthetase 1 enzymatic activity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17701896
      reference_title: "Arts syndrome is caused by loss-of-function mutations in PRPS1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Both mutations result in a loss of phosphoribosyl pyrophosphate
        synthetase 1 activity, as was shown in silico by molecular modeling and
        was shown in vitro by phosphoribosyl pyrophosphate synthetase activity
        assays in erythrocytes and fibroblasts from patients.
      explanation: >-
        Patient-derived erythrocyte and fibroblast assays directly link PRPS1
        variants to reduced PRS-I activity.
  - target: Reduced Neural Stem Cell Proliferation
    description: >-
      A patient-derived PRPS1 p.V42L neural model showed reduced neural stem-cell
      proliferation, although the experiment did not isolate which downstream
      PRPP-dependent pathway mediates the defect.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41787648
      reference_title: "PRPS1 (p.V42L) Mutation in Arts Syndrome Induces Aberrant Neural Stem Cell Development and Neuronal Senescence-Like Phenotype: Rescue by Nicotinamide Mononucleotide Supplementation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Patient-derived NSCs demonstrated significantly reduced proliferative
        capacity, aberrant nuclear morphology, and increased neuronal senescence,
        while mitochondrial integrity and function were largely preserved.
      explanation: Patient-derived NSCs directly demonstrate the proliferation defect.
  - target: Neural Stem Cell Senescence-Like State
    description: >-
      PRPS1 p.V42L patient-derived neural stem cells exhibited a senescence-like

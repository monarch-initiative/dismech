        Places TOPORS-related retinopathy among primary-cilia-dependent
        photoreceptor ciliopathies.
prevalence:
- population: Published literature and in-house cohorts
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Systematic 2022 review of published literature, HGMD, LOVD, and an in-house
    exome cohort identified 17 causative truncating TOPORS variants across 47
    families with autosomal dominant retinopathy; missense variants account for
    roughly a third of reported alleles.
  evidence:
  - reference: PMID:35579903
    reference_title: "Autosomal Dominant Retinitis Pigmentosa-Associated TOPORS Protein Truncating Variants Are Exclusively Located in the Region of Amino Acid Residues 807 to 867."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the in-house dataset and published literature, 17 truncating variants were identified in 47 families with RP."
    explanation: >-
      Pooled family count of causative truncating TOPORS variants across
      published and clinical exome cohorts.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous TOPORS variants segregate with disease in large dominant
    pedigrees: the French Canadian family in which the RP31 locus was mapped,
    and a Norwegian family with 35 affected members. ClinGen curated the
    gene-disease pair for autosomal dominant inheritance only.
  evidence:
  - reference: PMID:17924349
    reference_title: "Mutations in TOPORS cause autosomal dominant retinitis pigmentosa with perivascular retinal pigment epithelium atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report mutations in the gene for topoisomerase I-binding RS protein (TOPORS) in patients with autosomal dominant retinitis pigmentosa (adRP) linked to chromosome 9p21.1 (locus RP31)."
    explanation: Gene-discovery report placing TOPORS variants in dominant RP families linked to the RP31 locus.
  - reference: PMID:19183411
    reference_title: "Autosomal dominant pericentral retinal dystrophy caused by a novel missense mutation in the TOPORS gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation showed complete co-segregation with the disease in this family, with a LOD score of 7.3."
    explanation: Complete cosegregation of a heterozygous TOPORS variant in a large dominant pedigree.
  - reference: CGGV:assertion_8d71be46-7f7d-4567-b47d-d67015c3fa74-2023-04-06T160000.000Z
    reference_title: "TOPORS / TOPORS-related retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Curiously, although TOPORS is ubiquitously expressed, variants in TOPORS are only known to cause adRP."
    explanation: ClinGen's 2023 curation recognises only the autosomal dominant retinal disease.
mechanistic_hypotheses:
- hypothesis_group_id: topors_haploinsufficiency
  hypothesis_label: TOPORS haploinsufficiency
  status: CANONICAL
  description: >-
    Truncating alleles produce no stable mutant protein, so disease results
    from a reduced dose of normal TOPORS. This is the original authors'
    interpretation and the one ClinGen records.
  evidence:
  - reference: PMID:17924349
    reference_title: "Mutations in TOPORS cause autosomal dominant retinitis pigmentosa with perivascular retinal pigment epithelium atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ubiquitous nature of TOPORS expression and a lack of mutant protein in patients are highly suggestive of haploinsufficiency, rather than a dominant negative effect, as the molecular mechanism of the disease"
    explanation: Absence of mutant protein in patient cells is the basis for the haploinsufficiency model.
  - reference: CGGV:assertion_8d71be46-7f7d-4567-b47d-d67015c3fa74-2023-04-06T160000.000Z
    reference_title: "TOPORS / TOPORS-related retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity appears to be haploinsufficiency."
    explanation: ClinGen's summary of the disease mechanism.
  - reference: PMID:35579903
    reference_title: "Autosomal Dominant Retinitis Pigmentosa-Associated TOPORS Protein Truncating Variants Are Exclusively Located in the Region of Amino Acid Residues 807 to 867."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Three N-terminus truncating variants were detected in three families without RP, and the other three were identified in four unrelated families with typical RP."
    explanation: >-
      N-terminal truncating variants occur in families without RP, which is
      hard to reconcile with loss of one TOPORS copy being sufficient for
      disease.
- hypothesis_group_id: topors_dominant_negative
  hypothesis_label: TOPORS dominant-negative effect
  status: ALTERNATIVE
  description: >-
    Pathogenic truncations cluster in a short C-terminal window while
    N-terminal truncations and deletions are tolerated, which suggests that a
    truncated protein interferes with the remaining normal TOPORS. Proposed
    from the allele distribution; no functional test of interference has been
    reported.
  evidence:
  - reference: PMID:35579903
    reference_title: "Autosomal Dominant Retinitis Pigmentosa-Associated TOPORS Protein Truncating Variants Are Exclusively Located in the Region of Amino Acid Residues 807 to 867."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A dominant-negative effect, rather than haploinsufficiency, is speculated to be the underlying pathogenesis."
    explanation: The authors' alternative mechanism, inferred from the restricted position of pathogenic truncations.
pathophysiology:
- name: Heterozygous TOPORS Last-Exon Variant
  conforms_to: "photoreceptor_degeneration#Photoreceptor Gene Defect"
  description: >-
    The initiating lesion is a heterozygous germline TOPORS variant. Most are
    frameshift or nonsense variants in the last exon (exon 3) that fall
    between residues 807 and 867, near the C-terminus of the 1,045 residue
    protein; truncating variants outside this window, and N-terminal copy
    number losses, are found in people without RP. Missense variants make up
    about a third of reported alleles and include p.Gln402Pro, which causes a
    pericentral form.

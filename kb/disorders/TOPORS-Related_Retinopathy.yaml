      explanation: No mutant protein is detected in patients, so the variant reduces the amount of functional TOPORS.
- name: Loss of TOPORS Ligase Function at the Photoreceptor Basal Body
  description: >-
    TOPORS is a RING domain protein with ubiquitin and SUMO1 E3 ligase
    activity and is part of the ubiquitin-proteasome system; it binds the
    proteasome ATPase subunit PSMC1. In photoreceptors it localises mainly to
    the basal body of the connecting cilium, and to the centrosome in cultured
    cells. Which ligase substrates matter at the basal body is not known.

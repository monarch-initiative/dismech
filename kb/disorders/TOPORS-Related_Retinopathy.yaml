genetic:
- name: TOPORS
  gene_term:
    preferred_term: TOPORS
    term:
      id: hgnc:21653
      label: TOPORS
  association: >-
    Causative heterozygous variants, mostly C-terminal frameshift or nonsense
    changes in the last exon, with a minority of missense changes.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  case_fractions:
  - population: North American autosomal dominant RP cohort (215 families)
    case_fraction_percent: 1
    cohort_size: 215
    notes: >-
      Two of 89 probands without a mutation in another known adRP gene had a
      TOPORS variant; the authors give the overall share as approximately 1
      percent.
    evidence:
    - reference: PMID:18509552
      reference_title: "Mutations in the TOPORS gene cause 1% of autosomal dominant retinitis pigmentosa."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Point mutations and small insertions or deletions in TOPORS cause approximately 1% of adRP."
      explanation: TOPORS share of a dominant RP cohort.
  - population: French Canadian adRP families with an identified mutation (24 of 60 families solved)
    case_fraction_percent: 12.5
    notes: >-
      Three of the 24 solved families carried TOPORS variants. The denominator
      is solved families, not all 60, and the population is a founder
      population.
    evidence:
    - reference: PMID:26720483
      reference_title: "Genotype and Phenotype Studies in Autosomal Dominant Retinitis Pigmentosa (adRP) of the French Canadian Founder Population."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "three mutations (12.5%) in TOPORS"
      explanation: TOPORS share of solved French Canadian dominant RP families.

classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      An inherited degeneration of retinal photoreceptors; the Harrison
      chapter enum has no ophthalmology value, so this is filed under the
      nearest neurological heading, as for other inherited retinal dystrophies
      in the KB.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:17924349
      reference_title: "Mutations in TOPORS cause autosomal dominant retinitis pigmentosa with perivascular retinal pigment epithelium atrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report mutations in the gene for topoisomerase I-binding RS protein (TOPORS) in patients with autosomal dominant retinitis pigmentosa (adRP) linked to chromosome 9p21.1 (locus RP31)."
      explanation: >-
        Establishes TOPORS-related retinopathy as an inherited monogenic
        photoreceptor disorder.
  mechanistic_category:
  - classification_value: ciliopathy

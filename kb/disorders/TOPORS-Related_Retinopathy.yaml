  phenotype_term:
    preferred_term: Loss of central visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:35254173
    reference_title: "Mutations of TOPORS identified in families with retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, patients with missense mutations retained better central vision in older age compared to the patients with truncated mutations."
    explanation: Central vision declines with age, more in patients with truncating alleles.
  - reference: PMID:38592336
    reference_title: "Autosomal Dominant Retinitis Pigmentosa Secondary to TOPORS Mutations: A Report of a Novel Mutation and Clinical Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A mother (70 yr) and daughter (51 yr) had a novel heterozygous nonsense point mutation in TOPORS c.2431C > T, p.Gln811X (Exon 3) that led to premature termination of the desired protein resulting in early onset vision loss, cataract formation, and visual field restriction."
    explanation: Early-onset vision loss in a mother and daughter with a truncating allele.
- name: Perivascular cuff of retinal pigment epithelium atrophy
  category: Ophthalmological
  description: >-
    A band of RPE atrophy surrounding the superior and inferior vascular
    arcades, described in the founding families at early stages of the disease
    and later progressing to pigmentary retinopathy. It is not a consistent
    feature: it was absent in other TOPORS families examined at older ages,
    so its absence does not argue against the diagnosis.
  phenotype_term:
    preferred_term: Perivascular retinal pigment epithelium atrophy
    term:
      id: HP:0007722
      label: Retinal pigment epithelial atrophy
  evidence:
  - reference: PMID:17924349
    reference_title: "Mutations in TOPORS cause autosomal dominant retinitis pigmentosa with perivascular retinal pigment epithelium atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, a distinct phenotype is noted at the earlier stages of the disease, with an unusual perivascular cuff of retinal pigment epithelium atrophy, which was found surrounding the superior and inferior arcades in the retina."
    explanation: Original description of the perivascular cuff in early TOPORS disease.
  - reference: PMID:18509552
    reference_title: "Mutations in the TOPORS gene cause 1% of autosomal dominant retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The unique perivascular cuff was not seen in any of our examined patients, but its absence could easily be due to the later age at which our patients were examined."
    explanation: Supports the statement that the cuff is not seen in every family, and that age at examination may explain this.
- name: Pericentral retinitis pigmentosa
  category: Ophthalmological
  description: >-
    An atypical, milder pericentral retinal dystrophy with a favourable
    prognosis, reported in a large Norwegian family carrying the missense
    variant p.Gln402Pro.
  phenotype_term:
    preferred_term: Pericentral retinal dystrophy
    term:
      id: HP:0007947
      label: Pericentral retinitis pigmentosa
  evidence:

notes: >-
  Scope and the lump/split decision. This entry covers the autosomal dominant
  retinal disease only, and has no has_subtypes. Searches of PubMed
  ("TOPORS AND (recessive OR biallelic OR homozygous OR cone-rod)") and
  Europe PMC (TOPORS with biallelic, autosomal recessive or homozygous and
  retinitis, cone-rod or retinal) on 2026-11-04 found no report of a
  recessive TOPORS retinopathy or of TOPORS cone-rod dystrophy, and ClinGen's
  2023 curation states that TOPORS variants are only known to cause
  dominant RP. The biallelic TOPORS disease that is reported is a syndromic
  ciliopathy: homozygosity for p.Pro10Gln in children of Dominican ancestry
  with oral-facial-digital syndrome (PMID:34132027) or Joubert syndrome
  (PMID:37227088). That is a different disease and is carried by the
  Joubert_syndrome entry, not here. MONDO has no separate term for a
  recessive TOPORS retinopathy; the single MONDO child of MONDO:0700233 is
  retinitis pigmentosa 31 (MONDO:0012367), which is this entity and is
  recorded as a narrowMatch mapping. A Topors-deficient mouse exists
  (PMID:20429939), but its report describes perinatal lethality and genomic
  instability with no retinal data, so it is not listed as a model of this
  disease. No GeneReviews chapter is specific to TOPORS; the GeneReviews
  Nonsyndromic Retinitis Pigmentosa Overview (PMID:20301590) lists it among
  the dominant RP genes, and its cached abstract carries no clinical text to
  quote, so it is tagged in references but not cited as evidence.

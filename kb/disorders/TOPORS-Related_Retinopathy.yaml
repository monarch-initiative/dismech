name: TOPORS-Related Retinopathy
creation_date: "2026-11-04T12:00:00Z"
category: Mendelian
description: >-
  TOPORS-related retinopathy (retinitis pigmentosa 31, RP31) is an autosomal
  dominant rod-cone degeneration caused by heterozygous variants in TOPORS,
  which encodes topoisomerase I-binding arginine/serine-rich protein, a RING
  domain E3 ligase with both ubiquitin and SUMO1 ligase activity. TOPORS is
  expressed in all tissues tested, yet its disease-causing variants are known
  only to damage the retina. In photoreceptors the protein sits at the basal
  body of the connecting cilium, and knockdown in zebrafish embryos prevents
  outer segment formation, so the disease is grouped with the photoreceptor
  ciliopathies. Most pathogenic alleles are frameshift or nonsense changes
  confined to a short stretch near the C-terminus in the last exon (residues
  807 to 867), with a smaller number of missense changes. Whether these
  alleles act by haploinsufficiency or by a dominant-negative effect is
  unresolved. Patients present with night blindness, progressive constriction
  of the visual field and reduced electroretinogram responses, and later lose
  central vision; some young patients show a distinctive perivascular cuff of
  retinal pigment epithelium atrophy along the vascular arcades, and one
  missense allele causes a milder pericentral dystrophy. TOPORS accounts for
  roughly 1 percent of autosomal dominant retinitis pigmentosa, more in the
  French Canadian founder population.

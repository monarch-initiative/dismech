    reference_title: "Autosomal dominant pericentral retinal dystrophy caused by a novel missense mutation in the TOPORS gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ophthalmological examinations revealed an atypical form of retinitis pigmentosa (RP), which we prefer to call adPRD."
    explanation: Pericentral dystrophy as the phenotype of this TOPORS allele.
  - reference: PMID:19183411
    reference_title: "Autosomal dominant pericentral retinal dystrophy caused by a novel missense mutation in the TOPORS gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with classical RP, this phenotype has a favourable prognosis."

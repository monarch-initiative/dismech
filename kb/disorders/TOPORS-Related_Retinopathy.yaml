diagnosis:
- name: Full-Field Electroretinography
  description: >-
    Full-field ERG documents reduced responses early in the disease, before
    central vision is lost.
  diagnosis_term:
    preferred_term: Full-field electroretinography
    term:
      id: NCIT:C101217
      label: Retinal Examination
  evidence:
  - reference: PMID:35254173
    reference_title: "Mutations of TOPORS identified in families with retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Night blindness was a common onset symptom, and TOPORS-related ERG changes can be observed in early stage."
    explanation: ERG detects the disease at an early stage.
- name: Molecular Genetic Testing
  description: >-
    Sequencing identifies the heterozygous TOPORS variant. Truncating
    variants are interpreted by position: those between residues 807 and 867
    in the last exon are associated with RP, while truncating variants
    outside that window and N-terminal copy number losses occur in people
    without RP.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:35579903
    reference_title: "Autosomal Dominant Retinitis Pigmentosa-Associated TOPORS Protein Truncating Variants Are Exclusively Located in the Region of Amino Acid Residues 807 to 867."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three N-terminus truncating variants were detected in three families without RP, and the other three were identified in four unrelated families with typical RP."
    explanation: Truncating variants outside the C-terminal window were found in families without RP, which bears on variant interpretation.
treatments:
- name: Genetic Counseling
  description: >-
    Counseling for an autosomal dominant disorder, in which each child of an
    affected parent has a 50 percent chance of inheriting the variant.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Gene Augmentation Therapy (Proposed)
  description: >-
    Not tested in patients or in an animal model of the disease. It has been
    proposed on the haploinsufficiency model, and the TOPORS coding sequence
    fits within the capacity of an AAV vector. If the dominant-negative model
    is correct, adding a normal copy may not be sufficient.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Loss of TOPORS Ligase Function at the Photoreceptor Basal Body
    description: Would restore the amount of functional TOPORS in photoreceptors.
  evidence:
  - reference: PMID:28453362
    reference_title: "A novel mutation in the dominantly inherited TOPORS gene supports haploinsufficiency as the mechanism of retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since the cDNA encoding TOPORS is 3,135 nucleotides (within the coding capacity of AAV vectors) and haploinsufficiency is a mechanism relating to inadequate gene expression, gene replacement therapy may be an option for patients with this condition."
    explanation: The proposal and its rationale; no therapeutic data are reported.
animal_models:
- name: topors morphant zebrafish
  species: Zebrafish
  genotype: topors morpholino knockdown in embryos
  publication: PMID:21159800
  description: >-
    Morpholino knockdown of topors in zebrafish embryos causes defective
    retinal development and failure to form photoreceptor outer segments,
    rescued by human TOPORS mRNA.
  modeled_mechanisms:
  - target: Photoreceptor Connecting Cilium and Outer Segment Defect
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Shows that TOPORS is needed for outer segment formation in a vertebrate
      retina.
    limitations: >-
      A transient, near-complete knockdown during embryonic development,
      whereas patients are heterozygous and lose photoreceptors that formed
      normally, over decades. The model tests outer segment formation, not
      maintenance or degeneration.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The phenotype is read in zebrafish embryos; zebrafish and human
        photoreceptors differ in development and lifespan.
    evidence:
    - reference: PMID:21159800
      reference_title: "TOPORS, implicated in retinal degeneration, is a cilia-centrosomal protein."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Morpholino-mediated silencing of topors in zebrafish embryos demonstrates in another species a comparable retinal problem as seen in humans, resulting in defective retinal development and failure to form outer segments."
      explanation: The model's phenotype at the ciliary and outer segment node.

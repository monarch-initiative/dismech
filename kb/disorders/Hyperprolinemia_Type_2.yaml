notes: >-
  IEMbase package seed WP-003 (issue #5558), classification code 1.7.06.01
  (ALDH4A1-related pyrroline-5-carboxylate dehydrogenase deficiency);
  OMIM:239510; ORPHA:79101. MONDO provides an exact disease term
  (MONDO:0009401, gene HGNC:406 ALDH4A1, OMIM xref 239510), so HPII is curated
  as a standalone Disease entry rather than a subtype. Hyperprolinemia type 1
  (PRODH, MONDO:0009400, WP-003 row 1.7.05.01) is a mechanistically distinct
  entry that remains to be curated: it blocks the pathway one step earlier and
  does not generate P5C, which is why it lacks the PLP-inactivation arm modeled
  here. The entry deliberately does not declare conformance to
  metabolic_intoxication_decompensation: although febrile illness precipitates
  HPII crises, the toxic species acts as a cofactor antagonist rather than
  through the module's acidosis/hyperammonemia/hypoglycemia decompensation
  chain.

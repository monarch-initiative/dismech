name: Hyperprolinemia Type 2
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Hyperprolinemia type 2 (HPII) is an autosomal recessive disorder of proline
  degradation caused by biallelic ALDH4A1 pathogenic variants. ALDH4A1 encodes
  the mitochondrial enzyme delta-1-pyrroline-5-carboxylate dehydrogenase
  (P5CDH), which oxidizes glutamate-gamma-semialdehyde to glutamate in the
  second step of proline catabolism. Loss of P5CDH activity causes accumulation
  of its substrate delta-1-pyrroline-5-carboxylate (P5C) together with marked
  hyperprolinemia and prolinuria. Unlike hyperprolinemia type 1 (PRODH/proline
  oxidase deficiency), which blocks the pathway one step earlier and does not
  generate P5C, the accumulating P5C in HPII is chemically reactive: it
  condenses with the aldehyde carbon of pyridoxal 5'-phosphate (PLP) and
  inactivates it, producing a secondary vitamin B6 deficiency. This
  "endogenous vitamin antagonist" mechanism is the leading explanation for the
  seizures and metabolic encephalopathy that distinguish HPII from the largely
  benign type 1 disorder, and it is the rationale for high-dose pyridoxine
  supplementation. Presentation is variable — many individuals are
  asymptomatic or mildly affected, while others have recurrent or refractory
  seizures, often precipitated by febrile intercurrent illness, and rare
  late-onset presentations with status epilepticus and lactic acidosis are
  described.
category: Metabolic Disorder
parents:
- Inborn Error of Metabolism
- Hyperprolinemia
- Disorder of Amino Acid Metabolism
synonyms:

- name: Mitochondrial Dysfunction
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    A mild mitochondrial arm accompanies HPII. In the only cohort to look for
    it, three of four metabolically confirmed patients had biochemical markers
    suggesting mitochondrial dysfunction, and the finding was confirmed on
    muscle biopsy in one; mitochondrial enzyme complex activity and fibroblast
    oxygen consumption were measured because ALDH4A1 is itself a mitochondrial
    matrix enzyme. The arm is modeled as provisional because no mechanistic
    route from the enzyme deficiency to impaired oxidative phosphorylation has
    been demonstrated. It is retained because it is the only candidate
    explanation on offer for the severe lactic acidosis reported during HPII
    crisis, which otherwise has no mechanistic anchor in this pathograph.
  role: amplifier

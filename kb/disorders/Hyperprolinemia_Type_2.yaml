- name: Neurodevelopmental and Behavioral Impairment
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Beyond seizures, HPII patients show intellectual disability and prominent
    behavioral and psychiatric features. In the four-patient cohort, all had
    significant behavioral problems including anxiety and hallucinations, and
    two adolescents had intellectual disability; intellectual deficit and mild
    developmental delay are also part of the authoritative Orphanet disease
    definition. This node is marked HYPOTHETICAL rather than established
    because no mechanistic route links the metabolic block to these features:
    the primary literature exempts only the secondary B6 deficiency from that
    doubt, and a systematic review of 35 studies found no biochemical-clinical
    phenotype correlation.

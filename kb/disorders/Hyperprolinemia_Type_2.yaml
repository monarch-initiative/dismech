- name: Pyridoxal 5'-Phosphate Inactivation by P5C
  biological_scale: MOLECULAR
  description: >-
    P5C acts as an endogenous vitamin antagonist. In vitro NMR and mass
    spectrometry show that the activated C-4 carbon of the pyrroline ring
    undergoes a Claisen (Knoevenagel-type) condensation with the aldehyde carbon
    of pyridoxal 5'-phosphate, the active vitamin B6 coenzyme, generating stable
    adducts and removing PLP from the functional cofactor pool. Analogous P5C
    adducts with acetoacetic acid and malonic acid have been recovered from
    patient urine and plasma, establishing that the reaction occurs in vivo.
  role: central_effector
  chemical_entities:
  - preferred_term: pyridoxal 5'-phosphate
    term:
      id: CHEBI:18405
      label: pyridoxal 5'-phosphate
    modifier: DECREASED

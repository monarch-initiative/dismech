  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    The precise incidence of HPII is unknown. A Japanese national questionnaire
    survey combined with a literature review identified only a single HPII case
    in Japan, consistent with earlier Western reports of extreme rarity.

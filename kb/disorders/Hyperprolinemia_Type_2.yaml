- name: Seizures and Metabolic Encephalopathy
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Seizure Generation and Epileptogenesis"
  description: >-
    The clinical endpoint of HPII is a metabolic epilepsy. Reported
    presentations range from infantile seizures refractory to multiple
    antiepileptic drugs to a late-onset adult presentation with status
    epilepticus and severe lactic acidosis. Intercurrent febrile illness is a
    recurrent precipitant: reported episodes followed upper respiratory
    infection, and the single Japanese HPII case was ascertained during
    influenza-associated encephalopathy, prompting the proposal that HPII lowers
    the convulsive threshold.

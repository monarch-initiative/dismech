- name: Pyrroline-5-Carboxylate and Proline Accumulation
  biological_scale: MOLECULAR
  description: >-
    The metabolic block causes accumulation of delta-1-pyrroline-5-carboxylate
    (P5C), the reactive intermediate of proline catabolism, together with
    markedly elevated proline in plasma, urine, and cerebrospinal fluid. The
    presence of accumulating P5C is the biochemical feature that separates HPII
    from hyperprolinemia type 1, in which the earlier proline-oxidase block
    prevents P5C formation.

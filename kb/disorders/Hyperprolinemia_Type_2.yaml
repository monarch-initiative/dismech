pathophysiology:
- name: ALDH4A1 P5C Dehydrogenase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function ALDH4A1 variants abolish mitochondrial
    delta-1-pyrroline-5-carboxylate dehydrogenase (P5CDH) activity, the second
    enzymatic step of proline catabolism, which oxidizes
    glutamate-gamma-semialdehyde to glutamate. Structural work on the human
    enzyme shows how the recurrent S352L missense allele inactivates catalysis
    by rearranging the catalytic loop and eliminating NAD+ binding.

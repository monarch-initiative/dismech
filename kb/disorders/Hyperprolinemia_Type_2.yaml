treatments:
- name: High-Dose Pyridoxine (Vitamin B6) Supplementation
  description: >-
    Because the proposed pathomechanism is consumption of pyridoxal
    5'-phosphate by accumulating P5C, replacing the depleted cofactor is the
    mechanistically targeted intervention. High-dose vitamin B6 abolished
    further seizures in the reported late-onset case, and long-term
    supplementation was proposed as preventive when the P5C-PLP condensation was
    first characterized. Evidence is limited to case-level observation; no
    controlled trial exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  target_mechanisms:
  - target: Secondary Vitamin B6 Deficiency
    treatment_effect: RESTORES
    description: >-
      Pyridoxine supplementation replenishes the vitamin B6 pool depleted by P5C
      adduct formation, counteracting the secondary deficiency.
  evidence:
  - reference: PMID:31884946
    reference_title: "Novel variants in a patient with late-onset hyperprolinemia type II: diagnostic key for status epilepticus and lactic acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Under high-dose vitamin-B6 therapy no further"
    explanation: >-
      High-dose vitamin B6 stopped the seizures in the reported ALDH4A1-confirmed
      patient.
  - reference: PMID:11134058
    reference_title: "Pyridoxal phosphate de-activation by pyrroline-5-carboxylic acid. Increased risk of vitamin B6 deficiency and seizures in hyperprolinemia type II."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "be preventable with long term vitamin B6 supplementation."
    explanation: >-
      Proposes long-term vitamin B6 supplementation as preventive; this is a
      mechanistic proposal from an in vitro study, not clinical trial evidence.
  - reference: PMID:24173411
    reference_title: "Long-term clinical outcome, therapy and mild mitochondrial dysfunction in hyperprolinemia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "and independent from the B6 concentration and B6 therapy. Hyperprolinemia is a"
    explanation: >-
      Counter-evidence: in the only published HPII cohort, the clinical course
      was non-progressive and independent of both B6 concentration and B6
      therapy. This is the largest series in the literature and directly
      opposes the single-case observation of B6-responsive seizures, so the
      benefit of pyridoxine in HPII should be regarded as unresolved rather
      than established.
  notes: >-
    The evidence for this treatment is genuinely conflicting and is curated as
    such: one case report describes seizures stopping under high-dose vitamin
    B6, while the only cohort study reports a course independent of B6 therapy.
    No controlled trial exists. The conflict is a live question rather than a
    settled contraindication, and is tracked in
    gap_hpii_plp_seizure_causality.
discussions:
- discussion_id: gap_hpii_plp_seizure_causality
  prompt: >-
    Is P5C-mediated inactivation of pyridoxal 5'-phosphate actually the cause of
    seizures in hyperprolinemia type 2, and which PLP-dependent enzymes (e.g.
    glutamate decarboxylase and the GABA synthetic pathway) are rate-limiting in
    vivo? Do all symptomatic HPII patients have measurable vitamin B6 depletion,
    and does pyridoxine responsiveness track with it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    The PLP-inactivation mechanism is supported by in vitro chemistry, in vivo
    recovery of analogous P5C adducts, and single-case observations of low serum
    B6 with B6-responsive seizures — but it remains explicitly framed in the
    primary literature as what "is thought to be" the pathophysiological
    mechanism. The intervening neurotransmitter steps have not been measured in
    HPII patients, so the link from cofactor depletion to seizure generation is
    inferred from general vitamin B6 biochemistry. The one cohort study to
    address it partially answers the pyridoxine-responsiveness half of the
    question in the negative: all four patients had low-normal B6 and the
    clinical course was independent of both B6 concentration and B6 therapy.
    That result does not settle the mechanism — the cohort was not designed as
    a treatment trial and n=4 — but it means the gap is now one of conflicting
    evidence rather than absent evidence.
  attaches_to:
  - pathophysiology#Secondary Vitamin B6 Deficiency
  - pathophysiology#Seizures and Metabolic Encephalopathy
  evidence:

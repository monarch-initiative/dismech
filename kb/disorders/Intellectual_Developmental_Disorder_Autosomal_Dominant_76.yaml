      explanation: Supports the Mark2+/- mouse as a haploinsufficiency model of the cortical and behavioral phenotype.
notes: >-
  MARK2-related intellectual developmental disorder (MRD76, OMIM 621285;
  MONDO:0979575) is an autosomal-dominant autism spectrum disorder with
  developmental delay, universal speech/language deficits, and a recurrent
  facial gestalt. The pivotal cohort is Gong et al. 2024 (PMID:39419027,
  Am J Hum Genet), reporting 31 individuals; pathogenic variants are mostly
  de novo loss-of-function, and the proposed mechanism is MARK2 loss ->
  downregulated WNT/beta-catenin signaling -> impaired NPC proliferation,
  differentiation, and neuronal polarity, with cortical malformation in the
  Mark2+/- mouse. Lithium is a preclinical candidate (WNT re-activation), not an
  established therapy. A 2026 HGG Advances study (humanized Drosophila) further
  supports hypomorphic/loss-of-function pathogenesis and includes a familial
  case; it was not available for exact-quote citation here. The distinctive
  facial features are recorded as phenotypes but not wired to a mechanism node,
  as the developmental basis of the facial gestalt is not established.

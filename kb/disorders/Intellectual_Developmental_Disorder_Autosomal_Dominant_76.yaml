genetic:
- name: MARK2
  gene_term:
    preferred_term: MARK2
    term:
      id: hgnc:3332
      label: MARK2
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    MARK2 (MIM 600526; chromosome 11q13.1; microtubule affinity-regulating
    kinase 2 / PAR1b) causes autosomal-dominant intellectual developmental
    disorder 76 (MRD76, OMIM 621285), an autism spectrum disorder with
    developmental delay, speech/language deficits, and distinctive facial
    features. Pathogenic variants are predominantly loss-of-function
    (nonsense, frameshift, splice, and destabilizing missense), mostly de novo,
    acting through haploinsufficiency.
  variants:
  - name: c.337+1G>T
    description: Canonical splice-site variant causing exon skipping with a 49-bp transcript deletion; de novo.
    evidence:
    - reference: PMID:39419027
      reference_title: "MARK2 variants cause autism spectrum disorder via the downregulation of WNT/β-catenin signaling pathway."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Sequencing of the RT-PCR products (right) show c.337+1G>T variant results in a 49-bp deletion"
      explanation: Minigene/RT-PCR shows the splice variant causes a 49-bp deletion (loss of function).
  - name: p.Gly135Arg
    description: Missense variant (c.403G>A) that destabilizes the kinase domain and reduces MARK2 protein, a loss-of-function effect.
    evidence:
    - reference: PMID:39419027
      reference_title: "MARK2 variants cause autism spectrum disorder via the downregulation of WNT/β-catenin signaling pathway."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "The ΔΔGfold of p.Gly135Arg variant is highly unfavorable, suggesting that the variant destabilizes the kinase domain."
      explanation: In vitro / computational analysis shows the missense variant destabilizes the MARK2 kinase domain (loss of function).
  evidence:
  - reference: PMID:39419027
    reference_title: "MARK2 variants cause autism spectrum disorder via the downregulation of WNT/β-catenin signaling pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Here, we report 31 individuals with MARK2 variants and presenting with ASD, other neurodevelopmental disorders, and distinctive facial features."
    explanation: Establishes MARK2 as the causative gene from a 31-individual cohort.
treatments:
- name: Lithium (investigational)
  description: >-
    Preclinical only. Lithium (a GSK3-beta inhibitor) re-activated WNT/beta-catenin
    signaling and reversed abnormal cellular phenotypes of MARK2-mutant neural
    progenitor cells in vitro and in vivo; identified by the authors as a
    candidate drug, not an established therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lithium
      term:
        id: CHEBI:49713
        label: lithium(1+)
  target_mechanisms:
  - target: WNT/beta-catenin Signaling Downregulation
    treatment_effect: RESTORES
    description: Lithium inhibits GSK3-beta, re-activating WNT/beta-catenin signaling reduced by MARK2 loss.
  evidence:
  - reference: PMID:39419027
    reference_title: "MARK2 variants cause autism spectrum disorder via the downregulation of WNT/β-catenin signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "we link MARK2 loss to downregulation of the WNT/β-catenin signaling pathway and identify lithium as a potential drug for treating MARK2-associated ASD."
    explanation: Authors propose lithium as a candidate drug based on preclinical WNT-pathway rescue.

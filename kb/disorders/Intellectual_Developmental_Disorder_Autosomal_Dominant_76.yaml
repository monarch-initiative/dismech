pathophysiology:
- name: MARK2 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    MARK2 (PAR1b) is a serine/threonine kinase of the PAR1/MARK family. Most
    pathogenic variants are loss-of-function (truncating, splice, or
    destabilizing missense), and missense alleles tested in vitro also reduce
    MARK2 function, so the disorder is predominantly a haploinsufficiency /
    loss-of-function state.
  genes:
  - preferred_term: MARK2
    term:
      id: hgnc:3332
      label: MARK2
  molecular_functions:
  - preferred_term: MARK2 serine/threonine kinase activity
    modifier: DECREASED
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
  evidence:
  - reference: PMID:39419027
    reference_title: "MARK2 variants cause autism spectrum disorder via the downregulation of WNT/β-catenin signaling pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Loss-of-function (LoF) variants predominate (81%) in affected individuals, while computational analysis and in vitro expression assay of missense variants supported the effect of MARK2 loss."
    explanation: Establishes loss-of-function / haploinsufficiency as the molecular mechanism.
  - reference: PMID:39419027
    reference_title: "MARK2 variants cause autism spectrum disorder via the downregulation of WNT/β-catenin signaling pathway."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Microtubule affinity-regulating kinase 2 (MARK2) contributes to establishing neuronal polarity and developing dendritic spines."
    explanation: States the normal MARK2 kinase function whose loss drives the disorder.
  downstream:
  - target: WNT/beta-catenin Signaling Downregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: MARK2 loss downregulates WNT/beta-catenin signaling; the connecting steps are not fully resolved.
- name: WNT/beta-catenin Signaling Downregulation
  biological_scale: CELLULAR
  description: >-
    RNA sequencing of MARK2-mutant neural progenitor cells links MARK2 loss to
    reduced canonical WNT/beta-catenin signaling, the proposed core molecular
    mechanism; lithium (a GSK3-beta inhibitor) re-activates the pathway.
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: DECREASED
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  evidence:
  - reference: PMID:39419027
    reference_title: "MARK2 variants cause autism spectrum disorder via the downregulation of WNT/β-catenin signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "we link MARK2 loss to downregulation of the WNT/β-catenin signaling pathway and identify lithium as a potential drug for treating MARK2-associated ASD."
    explanation: Identifies WNT/beta-catenin downregulation as the molecular mechanism of MARK2 loss.
  downstream:
  - target: Impaired Neuronal Development
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Reduced WNT/beta-catenin signaling disturbs NPC proliferation, differentiation, and neuronal polarity.
- name: Impaired Neuronal Development
  biological_scale: CELLULAR
  description: >-
    MARK2-mutant proband-derived and CRISPR-engineered isogenic iPSC-derived
    neural progenitor cells show anomalous polarity, disorganized neural
    rosettes, and imbalanced proliferation and differentiation.
  biological_processes:
  - preferred_term: neuron differentiation
    modifier: DECREASED
    term:
      id: GO:0030182
      label: neuron differentiation
  evidence:
  - reference: PMID:39419027
    reference_title: "MARK2 variants cause autism spectrum disorder via the downregulation of WNT/β-catenin signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "we show that MARK2 loss leads to early neuronal developmental and functional deficits, including anomalous polarity and dis-organization in neural rosettes, as well as imbalanced proliferation and differentiation in neural progenitor cells (NPCs)."
    explanation: Reports the cellular neurodevelopmental deficits in patient-derived and isogenic iPSC-NPCs.
  downstream:
  - target: Abnormal Cortical Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Disturbed neuronal development manifests as abnormal cortical formation in the Mark2+/- mouse.
  - target: Autism spectrum disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Impaired neurodevelopment underlies the autism phenotype.
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Impaired neurodevelopment underlies the cognitive deficit.
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Impaired neurodevelopment underlies the developmental delay.
  - target: Delayed speech and language development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Impaired neurodevelopment underlies the speech and language deficit.
- name: Abnormal Cortical Development
  biological_scale: TISSUE
  description: >-
    Mark2+/- (heterozygous) mice recapitulate the disorder with abnormal
    cortical formation and partition and ASD-like behavior, indicating that
    partial MARK2 loss disrupts cortical lamination.
  evidence:
  - reference: PMID:39419027
    reference_title: "MARK2 variants cause autism spectrum disorder via the downregulation of WNT/β-catenin signaling pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Mark2+/- mice showed abnormal cortical formation and partition and ASD-like behavior."
    explanation: Mouse haploinsufficiency model recapitulates cortical malformation and ASD-like behavior.
  downstream:
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cortical malformation is a plausible substrate for the seizures seen in a subset.
  - target: Motor delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cortical/neurodevelopmental disruption underlies motor delay.

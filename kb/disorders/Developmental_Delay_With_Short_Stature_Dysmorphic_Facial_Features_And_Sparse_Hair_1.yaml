name: Developmental Delay With Short Stature, Dysmorphic Facial Features, And Sparse Hair 1
creation_date: "2026-10-27T00:00:00Z"
category: Mendelian
description: >-
  An autosomal recessive multisystem developmental disorder caused by biallelic
  hypomorphic variants in DPH1, the first enzyme of diphthamide biosynthesis.
  DPH1 and DPH2 form an iron-sulfur-cluster heterodimer that performs the first
  of four steps placing diphthamide on a single conserved histidine (His715) of
  translation elongation factor 2 (eEF2). Loss of that modification does not
  abolish translation; it degrades translational accuracy at the elongation
  step, permitting ribosomal frameshifting, and preactivates oxidative-stress
  and NF-kappaB stress programs. The disorder is therefore classified as a
  ribosomopathy of translational fidelity rather than of ribosome biogenesis.
  The clinical core is intellectual disability with short stature, an unusual
  skull shape, and ectodermal findings (sparse scalp hair and eyebrows,
  hypoplastic toenails); head circumference may be small or large rather than
  uniformly reduced. The entity is also called diphthamide deficiency syndrome
  1, DPH1 syndrome, and Loucks-Innes syndrome, and fewer than twenty cases have
  been reported. Complete loss of diphthamide synthesis is lethal in animals, so
  every variant found in a living affected individual reduces rather than
  abolishes enzyme activity. DPH1 was first described as the candidate ovarian
  tumour suppressor OVCA1 and lies inside the Miller-Dieker syndrome critical
  deletion region, which is how its role in craniofacial development came to be
  tested.
synonyms:
- DEDSSH1
- diphthamide deficiency syndrome 1
- diphtamide deficiency syndrome
- DPH1 syndrome
- Loucks-Innes syndrome
- developmental delay-short stature-dysmorphic features-sparse hair syndrome

discussions:
- discussion_id: dph1_fidelity_vs_stress_arms
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which of the clinical features of DPH1 deficiency follow from reduced
    translational fidelity, and which follow from the separate stress-pathway
    preactivation that diphthamide loss also causes?
  rationale: >-
    Both consequences are documented, but only in engineered cell lines and
    yeast, and no study has measured frameshifting rate or stress-pathway
    activation in tissue from an affected individual. Without that, the
    assignment of any given phenotype to either arm is inference. It matters
    because the two arms suggest different interventions: an accuracy defect is
    not obviously druggable, whereas preactivated oxidative-stress and NF-kappaB
    signalling is a more conventional target.
  attaches_to:
  - pathophysiology#Reduced Translational Fidelity at Elongation
  - pathophysiology#Preactivation of Oxidative Stress and NF-kappaB Responses
- discussion_id: dph1_neural_crest_null_vs_hypomorph
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the mouse neural-crest conditional knockout model the human
    craniofacial phenotype, given that the human disease is caused by hypomorphic
    alleles and the mouse experiment removes the gene entirely?
  rationale: >-
    The craniofacial arm of the pathograph rests on conditional ablation of Dph1
    in mouse neural crest, which produced hypoplastic nasal bone and lower jaw.
    Human patients instead have an unusual skull shape, most often scaphocephaly
    with variable suture fusion, and the mouse null dies perinatally while
    patients survive to adulthood. The model establishes that this gene is
    required in neural crest; it does not establish that the human skull shape
    arises the same way, and the dose difference between a null and a hypomorph
    is exactly the variable the human disease turns on.
  attaches_to:
  - pathophysiology#Impaired Craniofacial Neural Crest Development

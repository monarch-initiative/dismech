diagnosis:
- name: Exome sequencing
  description: >-
    Diagnosis rests on exome or genome sequencing in an individual with the
    clinical pattern, followed where needed by functional assessment of the
    identified variant. Because in silico predictors called the founder
    p.Met6Lys allele benign and tolerated, variant interpretation here cannot
    rest on prediction alone: human MCF7-derivative and yeast assays are the
    established way to decide whether a missense allele is functionally
    compromised, and the yeast assay is the more sensitive of the two for
    graded differences.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  evidence:
  - reference: PMID:37675463
    reference_title: "DPH1 and DPH2 variants that confer susceptibility to diphthamide deficiency syndrome in human cells and yeast models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The diagnosis of diphthamide deficiency syndrome is based upon whole-exome
      sequencing of patients with the above-described manifestations that
      identify potentially compromised DPH enzyme variants.
    explanation: >-
      States the diagnostic route for this disease. The sentence describes
      clinical practice in patients, so evidence_source grades that; it is in
      this functional paper's introduction, which quote_role records.
  - reference: PMID:39166428
    reference_title: "Recessive loss-of-function variants in DPH1 identified as the molecular cause in a sibling pair previously diagnosed with Fine-Lubinsky syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This leads us to recommend that all individuals with a clinical diagnosis
      of Fine-Lubinsky syndrome be screened for variants in DPH1.
    explanation: >-
      A specific diagnostic recommendation: the clinically defined Fine-Lubinsky
      syndrome overlaps this disease closely enough that it should prompt DPH1
      testing. Relevant because the sibling pair carried that label for years.
  - reference: PMID:33704902
    reference_title: "An adult Chinese patient with developmental delay with short stature, dysmorphic features, and sparse hair (Loucks-Innes syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dental and endocrine checkup should be considered in the routine follow-up
      of DPH1 syndrome patients.
    explanation: >-
      Names the two surveillance axes this paper's own findings motivate -
      dental anomalies and the growth hormone deficiency it reported.
treatments:
- name: Supportive and Developmental Care
  description: >-
    There is no disease-modifying treatment. Management is supportive:
    developmental and educational support, seizure control where seizures occur,
    audiological assessment, and surveillance for the craniofacial, cardiac and
    renal findings reported in individual cases. This entry records the absence
    of a targeted therapy rather than proposing one.

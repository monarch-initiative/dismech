notes: >-
  No GeneReviews chapter names this disease. Verified with `just
  check-genereviews --online` against the committed Bookshelf index snapshot of
  2026-09-10 plus a live PubMed title search, with the entry's six synonyms in
  place: NO_CHAPTER for both GeneReviews and StatPearls. The phenotype baseline
  here is therefore the primary case literature, principally the two cohorts
  reported together by Loucks et al. (PMID:26220823) and the phenotype synthesis
  in the DPH2 report (PMID:32576952).
inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic DPH1 variants, homozygous in consanguineous and founder
    populations and compound heterozygous in non-consanguineous families.
    Heterozygous parents are unaffected, because one functional allele of each
    diphthamide-pathway enzyme suffices for activity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:29362492
    reference_title: "Novel compound heterozygous DPH1 mutations in a patient with the unique clinical features of airway obstruction and external genital abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In humans, DPH1 mutations cause developmental delay with a short stature,
      dysmorphic features, and sparse hair, and are inherited in an autosomal
      recessive manner
    explanation: States the mode of inheritance for this disease directly.
  - reference: PMID:37675463
    reference_title: "DPH1 and DPH2 variants that confer susceptibility to diphthamide deficiency syndrome in human cells and yeast models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      All clinical reports so far have described the syndrome in patients that
      either carry defective homozygous alleles (consanguineous families) or
      compound heterozygous ones, with their heterozygous (DPH+/-) parents
      showing no phenotype.
    explanation: >-
      Records that carriers are unaffected and that affected individuals carry
      two defective alleles, which is the recessive architecture. The quoted
      sentence describes the published human clinical reports, so
      evidence_source grades that rather than this paper's own yeast and
      cell-line work; quote_role BACKGROUND records that the citing study ran a
      different kind of experiment.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than twenty published cases as of 2025. Reported families cluster in
    consanguineous pedigrees and in one North American genetic isolate carrying
    a founder allele.
  evidence:
  - reference: PMID:41444928
    reference_title: "A pediatric case of diphthamide biosynthesis 1 gene defect presenting with developmental delay, short stature, dysmorphic features, and sparse hair (Loucks-Innes syndrome): a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To the best of our knowledge, there have been fewer than 20 reported cases
      of Loucks-Innes syndrome in the literature.
    explanation: Gives the published case count underlying the ultra-rare class.
genetic:
- name: DPH1
  gene_term:
    preferred_term: DPH1
    term:
      id: hgnc:3003
      label: DPH1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    No external body has published a gene-disease validity classification for
    this pair, so `gene_disease_validity` is deliberately absent rather than
    filled with a curator-assigned tier. The support is two independently
    ascertained cohorts matched post-publication (PMID:26220823) plus
    subsequent unrelated families with distinct alleles (PMID:29410513,
    PMID:29362492) and experimental demonstration that patient alleles reduce
    enzyme function (PMID:37675463).
  evidence:
  - reference: PMID:26220823
    reference_title: "Matching two independent cohorts validates DPH1 as a gene responsible for autosomal recessive intellectual disability with short stature, craniofacial, and ectodermal anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together, these data show that recessive pathogenic variants in DPH1 are
      causative of a developmental phenotype in humans.
    explanation: >-
      The conclusion of the study that established DPH1 as the causal gene, by
      matching a North American founder cohort to a Saudi Arabian family.
  - reference: PMID:30877278
    reference_title: "DPH1 syndrome: two novel variants and structural and functional analyses of seven missense variants identified in syndromic patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using a diphtheria toxin ADP-ribosylation assay, we have analyzed the
      activity of seven identified variants and demonstrated compromised
      function for five of them
    explanation: >-
      The first functional test of patient DPH1 alleles, and the largest such
      series. Note the assay is itself a diphtheria toxin assay: it measures
      residual diphthamide by how much toxin can ADP-ribosylate, which is the
      same coupling this entry's pathograph records between the inborn error
      and the toxin.
  - reference: PMID:30877278
    reference_title: "DPH1 syndrome: two novel variants and structural and functional analyses of seven missense variants identified in syndromic patients."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The results show correlation between loss of activity, reduced size of the
      opening to the catalytic site, and changes in the size of the catalytic
      site with clinical severity.
    explanation: >-
      A genotype-phenotype correlation running from modelled catalytic-site
      geometry through measured residual activity to clinical severity, which is
      the only quantitative severity predictor reported for this disease.
      Graded COMPUTATIONAL because the structural part is a homology model with
      molecular dynamics rather than an experimental structure.
  variants:
  - name: c.17T>A (p.Met6Lys)
    description: >-
      Founder missense allele in a North American genetic isolate, homozygous in
      four affected individuals. In silico predictors called it benign and
      tolerated, so pathogenicity rests on segregation, the founder-allele
      frequency, and the later functional work on the pathway.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:26220823
      reference_title: "Matching two independent cohorts validates DPH1 as a gene responsible for autosomal recessive intellectual disability with short stature, craniofacial, and ectodermal anomalies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The A variant was never seen in a homozygous state, but it was seen in 5
        of 1098 chromosomes, giving a minor allele frequency of 0.46% in the
        population.
      explanation: >-
        Establishes the allele as a founder variant segregating in the isolate
        and absent in homozygous form from unaffected members of it.
  - name: c.701T>C (p.Leu234Pro)
    description: >-
      Homozygous missense allele in an extended consanguineous Saudi Arabian
      family whose phenotype was originally read as 3C (Ritscher-Schinzel)
      syndrome with renal involvement. Central nervous system malformations and
      early lethality were more frequent in this family than in the founder
      cohort.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:26220823
      reference_title: "Matching two independent cohorts validates DPH1 as a gene responsible for autosomal recessive intellectual disability with short stature, craniofacial, and ectodermal anomalies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Central nervous system malformations and early lethality, in particular,
        were more frequent in the Saudi Arabian patients, which could reflect
        severity of pathogenic variant, or other genetic factors
      explanation: >-
        Records that this allele sits at a more severe point of the phenotypic
        spectrum than the founder missense allele.
  - name: p.Leu125Pro and p.Tyr112Cys
    description: >-
      Two further missense alleles whose function was measured directly, in four
      new patients from two families. Both reduce DPH1 activity in the
      diphtheria-toxin ADP-ribosylation assay, placing them with p.Leu234Pro,
      p.Leu164Pro and the p.Ala411Argfs*91 frameshift among the five of seven
      tested alleles shown to be functionally compromised. Grouped in one record
      because the source reports them as a set within one functional series and
      does not separate their phenotypic effects.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30877278
      reference_title: "DPH1 syndrome: two novel variants and structural and functional analyses of seven missense variants identified in syndromic patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We have identified four new patients (from two different families)
        carrying novel variants in DPH1, enriching the clinical delineation of
        the DPH1 syndrome.
      explanation: Reports the patients and that the alleles were novel at publication.
    - reference: PMID:30877278
      reference_title: "DPH1 syndrome: two novel variants and structural and functional analyses of seven missense variants identified in syndromic patients."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        demonstrated compromised function for five of them [p.(Leu234Pro);
        p.(Ala411Argfs*91); p.(Leu164Pro); p.(Leu125Pro); and p.(Tyr112Cys)]
      explanation: >-
        Names the five alleles with measured loss of activity, which is what
        makes these two functionally characterised rather than inferred.
  - name: c.1227delG (p.Ala411Argfs*91)
    description: >-
      Homozygous frameshift allele in a consanguineous family with two affected
      siblings, who had agenesis of the corpus callosum and cleft palate and no
      renal findings.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:29410513
      reference_title: "A novel homozygous DPH1 mutation causes intellectual disability and unique craniofacial features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        By wholeexome sequencing, a homozygous frameshift mutation in DPH1
      explanation: >-
        Reports the homozygous frameshift genotype in this family. The quote
        stops before the allele itself because the reference validator strips
        bracketed text and the source writes the protein change as
        p.[Ala411Argfs*91]; that allele is carried in this variant's name.
        The same sentence attributes the familial condition to it.
  - name: c.749+39G>A (deep intronic)
    description: >-
      Homozygous deep intronic variant in a sibling pair who had carried a
      clinical diagnosis of Fine-Lubinsky syndrome for years. Chromosomal
      microarray and quad exome sequencing were both non-diagnostic; a research
      reanalysis found the variant, and RNA sequencing on fibroblasts showed
      markedly reduced DPH1 transcript consistent with abnormal splicing
      followed by nonsense-mediated decay. The practical lesson is that this
      allele class is invisible to a standard exome pipeline, so a negative
      exome does not exclude the diagnosis.
    clinical_significance: PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:39166428
      reference_title: "Recessive loss-of-function variants in DPH1 identified as the molecular cause in a sibling pair previously diagnosed with Fine-Lubinsky syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a research reanalysis of their exome sequencing data revealed that both
        were homozygous for an intronic c.749+39G>A
      explanation: Reports the allele and how it was found after a non-diagnostic clinical work-up.
    - reference: PMID:39166428
      reference_title: "Recessive loss-of-function variants in DPH1 identified as the molecular cause in a sibling pair previously diagnosed with Fine-Lubinsky syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        RNAseq analysis performed on RNA from fibroblasts revealed significantly
        reduced expression of DPH1 transcripts suggestive of abnormal splicing
        followed by nonsense mediated mRNA decay.
      explanation: >-
        The functional validation that makes this intronic change a
        loss-of-function allele rather than a variant of uncertain
        significance.
  - name: c.289delG (p.Glu97Lysfs*8) and c.491T>C (p.Leu164Pro)
    description: >-
      Compound heterozygous pair in a patient from a non-consanguineous family,
      the first such genotype reported for this disease, presenting with airway
      obstruction and external genital anomalies in addition to the core
      features.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:29362492
      reference_title: "Novel compound heterozygous DPH1 mutations in a patient with the unique clinical features of airway obstruction and external genital abnormalities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We used WES to identify novel compound heterozygous mutations in DPH1
        (c.289delG, p.Glu97Lysfs*8 and c.491T>C, p.Leu164Pro) in a patient from
        a nonconsanguineous family presenting with intellectual disability, a
        short stature, craniofacial abnormalities, and external genital
        abnormalities.
      explanation: Reports the compound heterozygous genotype and the associated phenotype.
pathophysiology:
- name: DPH1 Loss of Function
  description: >-
    Biallelic hypomorphic DPH1 variants reduce the activity of the DPH1 subunit
    of the DPH1-DPH2 heterodimer. Reduction rather than abolition is the rule:
    complete inactivation of diphthamide synthesis is embryonic or perinatally
    lethal in animals, so a living affected individual necessarily retains
    residual activity.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
  genes:
  - preferred_term: DPH1
    term:
      id: hgnc:3003
      label: DPH1
  molecular_functions:
  - preferred_term: 2-(3-amino-3-carboxypropyl)histidine synthase activity
    modifier: DECREASED
    term:
      id: GO:0090560
      label: 2-(3-amino-3-carboxypropyl)histidine synthase activity
  - preferred_term: 4Fe-4S cluster binding by the DPH1-DPH2 heterodimer
    term:
      id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
  downstream:
  - target: Failure of eEF2 Diphthamide Synthesis
    causal_link_type: DIRECT
    description: >-
      The DPH1-DPH2 heterodimer catalyses the first committed step of
      diphthamide biosynthesis, so reduced DPH1 activity reduces flux through
      the whole four-step pathway.
    evidence:
    - reference: PMID:37675463
      reference_title: "DPH1 and DPH2 variants that confer susceptibility to diphthamide deficiency syndrome in human cells and yeast models."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The molecular cause of the syndrome is reduced activity of
        diphthamide-synthesizing enzymes, which compromises the placement of
        diphthamide on translation elongation factor 2 (eEF2).
      explanation: States the causal step from reduced enzyme activity to absent eEF2 modification.
  evidence:
  - reference: PMID:37675463
    reference_title: "DPH1 and DPH2 variants that confer susceptibility to diphthamide deficiency syndrome in human cells and yeast models."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      In all cases, diphthamide synthesis of the homozygous or compound
      heterozygous carriers of variant alleles appeared to be reduced but not
      completely abolished.
    explanation: >-
      Supports grading the lesion as partial rather than complete loss of
      function. evidence_source stays IN_VITRO here, unlike the other quotes
      from this paper's introduction: the sentence reports what the enzyme
      assays on patient-derived alleles showed, not a clinical observation, so
      the evidence it describes is in vitro even though the patients are human.
      quote_role records that it is the introduction's summary of published
      assays rather than this paper's own.
- name: Failure of eEF2 Diphthamide Synthesis
  description: >-
    The DPH1-DPH2 iron-sulfur heterodimer, with electrons donated by DPH3 and
    DPH4, converts histidine 715 of human eEF2 to a 3-amino-3-carboxypropyl
    intermediate; DPH5, DPH7 and DPH6 then complete the modification. Reduced
    first-step activity leaves eEF2 under-modified at this single residue. eEF2
    is non-redundant, so there is no parallel pathway to compensate.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: diphthamide biosynthesis on eEF2 histidine 715
    modifier: DECREASED
    term:
      id: GO:0017183
      label: protein histidyl modification to diphthamide
  downstream:
  - target: Reduced Translational Fidelity at Elongation
    causal_link_type: DIRECT
    description: >-
      Structural work places diphthamide in the ribosomal decoding centre,
      where it contacts mRNA and rRNA; without it, reading-frame maintenance
      degrades.
    evidence:
    - reference: PMID:32576952
      reference_title: "Diphthamide-deficiency syndrome: a novel human developmental disorder and ribosomopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: >-
        Structural analysis of eEF2 inside the ribosome indicates that
        diphthamide may act as a pawl linking with both mRNA and rRNA in the
        decoding center averting reading frame errors
      explanation: >-
        Gives the structural basis for the step from missing modification to
        frameshift-permissive elongation. Graded IN_VITRO rather than
        COMPUTATIONAL: this is experimental structure determination of the
        ribosome, not an in-silico prediction. Quoted from this paper's
        introduction summarising that published work.
  evidence:
  - reference: PMID:37675463
    reference_title: "DPH1 and DPH2 variants that confer susceptibility to diphthamide deficiency syndrome in human cells and yeast models."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      An iron-sulfur (FeS) cluster containing DPH1/DPH2 heterodimer that needs
      DPH3/DPH4 for electron donation generates 3-amino-3-carboxypropyl
      (ACP)-modified histidine at position His715 of human eEF2.
    explanation: >-
      Identifies the enzyme complex, the cofactor requirement and the exact
      modified residue. Quoted from the introduction's summary of the
      established pathway.
- name: Reduced Translational Fidelity at Elongation
  description: >-
    Bulk protein synthesis continues, but elongation becomes error-prone and
    permits -1 frameshifting. Loss of diphthamide also lowers selenocysteine
    incorporation at recoded SECIS-UGA codons and shifts tRNA synthetase
    expression, so the consequence is a reweighted proteome rather than a
    global translational arrest. This distinguishes the disease from
    ribosomopathies that limit ribosome production.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: maintenance of translational reading frame during elongation
    modifier: DECREASED
    term:
      id: GO:0006450
      label: regulation of translational fidelity
  - preferred_term: translational elongation
    term:
      id: GO:0006414
      label: translational elongation
  downstream:
  - target: Preactivation of Oxidative Stress and NF-kappaB Responses
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37675463
      reference_title: "DPH1 and DPH2 variants that confer susceptibility to diphthamide deficiency syndrome in human cells and yeast models."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: >-
        In consequence, diphthamide deficiency triggers stress responses such as
        hypersensitivity towards oxidative stress and NF-kappaB pathway
        pre-activation in experimental human cell models
      explanation: >-
        States the causal step from diphthamide deficiency to the two stress
        programs, in cell models. Quoted from the introduction's summary of
        prior cell-model work.
  - target: Impaired Craniofacial Neural Crest Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The neural crest link is established by conditional deletion in mouse
      rather than by a measured fidelity defect in human craniofacial tissue,
      so the edge is indirect.
    evidence:
    - reference: PMID:26220823
      reference_title: "Matching two independent cohorts validates DPH1 as a gene responsible for autosomal recessive intellectual disability with short stature, craniofacial, and ectodermal anomalies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      quote_role: BACKGROUND
      snippet: >-
        Conditional ablation of Dph1 in neural crest cells resulted in
        craniofacial abnormalities with hypoplastic nasal bone and lower jaw
      explanation: >-
        Tissue-restricted loss of the same gene reproduces craniofacial
        maldevelopment, which supports the edge by inference from mouse to
        human. Quoted from this clinical paper's discussion of published mouse
        work, not from its own cohort data.
  - target: Impaired Somatic Growth and Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      No source traces a path from reduced translational accuracy to growth
      restriction or to the neurodevelopmental deficit, so the intermediates
      are recorded as unknown rather than the edge being asserted as direct.
  evidence:
  - reference: PMID:22869748
    reference_title: "Diphthamide modification on eukaryotic elongation factor 2 is needed to assure fidelity of mRNA translation and mouse development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We confirmed that the diphthamide modification is essential for eEF2 to
      prevent -1 frameshifting during translation and show that the
      Gly(717)-to-Arg mutation cannot rescue this defect.
    explanation: >-
      The primary demonstration that the modification prevents -1
      frameshifting, cited directly rather than through a later paper's summary
      of it.
  - reference: PMID:22869748
    reference_title: "Diphthamide modification on eukaryotic elongation factor 2 is needed to assure fidelity of mRNA translation and mouse development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      eEF2(G717R/G717R)/OVCA1(-/-) double mutant mice displayed the milder
      phenotypes of the eEF2(G717R/G717R) mice, suggesting that the embryonic
      lethality of OVCA1(-/-) mice is due to diphthamide deficiency
    explanation: >-
      A genetic epistasis result establishing that it is loss of the
      diphthamide modification, rather than any other function of the DPH1
      protein, that produces the developmental phenotype. This is the
      strongest available support for routing the whole pathograph through
      this node.
  - reference: PMID:37675463
    reference_title: "DPH1 and DPH2 variants that confer susceptibility to diphthamide deficiency syndrome in human cells and yeast models."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Thereby, overall ribosomal protein synthesis can still occur, but
      translation accuracy is affected at the elongation state by permitting
      frameshifts to occur
    explanation: >-
      States that capacity for protein synthesis is retained while accuracy is
      lost, which is the distinction this node turns on. Quoted from the
      introduction's summary of published yeast and cell work.
  - reference: PMID:32576952
    reference_title: "Diphthamide-deficiency syndrome: a novel human developmental disorder and ribosomopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      In line with that, loss of diphthamide influences the expression levels of
      tRNA aminoacyl synthetases and importantly, affects the expression of
      selenoproteins via reduced selenocysteine incorporation at recoded
      SECIS-UGA codons
    explanation: >-
      Supports the reweighted-proteome description, naming the selenoprotein and
      synthetase consequences. Quoted from the introduction's summary of prior
      work.
- name: Preactivation of Oxidative Stress and NF-kappaB Responses
  description: >-
    Diphthamide-deficient cells sit with oxidative-stress and NF-kappaB
    transcriptional programs partly engaged before any exogenous stress, and are
    hypersensitive to oxidative challenge and to tumour-necrosis-factor-mediated
    death signalling. This is a cell-level consequence demonstrated in
    engineered human lines, not a measurement made in patient tissue.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: INCREASED
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  evidence:
  - reference: PMID:32576952
    reference_title: "Diphthamide-deficiency syndrome: a novel human developmental disorder and ribosomopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Diphthamide deficiency also correlates with preinduction of stress
      pathways and gene signatures in mammalian cells, including those
      associated with oxidative stress responses
    explanation: >-
      Supports the node's claim that stress programs are preinduced in
      diphthamide-deficient cells. Quoted from the introduction's summary of
      prior mammalian cell work.
- name: Impaired Craniofacial Neural Crest Development
  description: >-
    Cranial neural crest derivatives are disproportionately affected, which is
    the developmental account of the skull shape and facial features. Mouse
    conditional deletion of Dph1 restricted to neural crest produces hypoplastic
    nasal bone and lower jaw, and the gene lies within the Miller-Dieker
    critical deletion region, which is what prompted that experiment.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: neural crest cell development
    modifier: DECREASED
    term:
      id: GO:0014032
      label: neural crest cell development
  downstream:
  - target: Scaphocephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cleft palate
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:24895408
    reference_title: "Role of OVCA1/DPH1 in craniofacial abnormalities of Miller-Dieker syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Conditional ablation of Ovca1 in neural crest cells, but not in cranial
      paraxial mesoderm, also results in cleft palate and shortened lower jaw
      phenotypes, similar to Ovca1-null embryos.
    explanation: >-
      The primary experiment behind this node, cited directly rather than
      through another paper's description of it. The lineage specificity is the
      load-bearing part: deleting the gene in neural crest reproduces the
      craniofacial phenotype and deleting it in paraxial mesoderm does not, so
      the requirement is restricted to the lineage this node names.
  - reference: PMID:24895408
    reference_title: "Role of OVCA1/DPH1 in craniofacial abnormalities of Miller-Dieker syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression of transgenic myc-tagged Ovca1 in craniofacial structures can
      partially rescue the cleft palate and shortened mandible of Ovca1-null
      embryos.
    explanation: >-
      The rescue arm, which is what makes the requirement causal rather than
      correlative.
  - reference: PMID:24895408
    reference_title: "Role of OVCA1/DPH1 in craniofacial abnormalities of Miller-Dieker syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Interestingly, Ovca1-null mutants are resistant to conditional expression
      of diphtheria toxin subunit A in both neural crest cell and paraxial
      mesoderm derivatives.
    explanation: >-
      Confirms that the craniofacial requirement runs through diphthamide
      synthesis specifically: losing the enzyme removes the residue that
      diphtheria toxin needs, so the null tissue is toxin-resistant. This is
      the same modified histidine that `Diphtheria` in this knowledge base
      models from the toxin's side.

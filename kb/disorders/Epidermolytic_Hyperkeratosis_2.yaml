- name: Cutaneous TH17 Inflammation
  biological_scale: TISSUE
  description: >-
    Epidermolytic ichthyosis skin shows raised TH17-related cytokines in the
    epidermis and CCR6+ TH17 cells in the dermis. Patients with KRT10 variants
    have responded to IL-17A blockade in a case series, but a placebo-controlled
    trial across adult congenital ichthyoses was negative, so the contribution
    of this axis to disease severity remains uncertain. No source links this
    node to the IL-18 node, so no edge is drawn between them.

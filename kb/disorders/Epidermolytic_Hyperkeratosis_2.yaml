    reference_title: "Generalized and naevoid epidermolytic ichthyosis in Denmark: clinical and mutational findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion epidermolytic ichthyosis is a rare disease with a prevalence of approximately 1 in 350,000 in Denmark and a high percentage of de novo mutations (75%)."
    explanation: National cohort prevalence estimate for epidermolytic ichthyosis, both keratin genes combined.
  - reference: PMID:22930352
    reference_title: "Generalized and naevoid epidermolytic ichthyosis in Denmark: clinical and mutational findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five families had mutations in K1 and 6 families had mutations in K10."
    explanation: KRT10 accounts for roughly half of genotyped families in the same cohort.

    term:
      id: MONDO:0700245
      label: epidermolytic hyperkeratosis 2B, autosomal recessive
  description: >-
    Recessive form caused by biallelic KRT10 nonsense, frameshift or splice
    variants that trigger transcript decay and leave the epidermis without keratin
    10 protein. Heterozygous carriers are clinically unaffected. Reported
    severity ranges from a lethal neonatal course to a mild, self-improving
    phenotype when a leaky splice allele leaves residual keratin 10.
  genes:
  - preferred_term: KRT10

animal_models:
- name: Mutant keratin 10 transgenic mouse
  species: Mouse
  genotype: Transgene expressing a mutant human keratin 10 in the suprabasal epidermis
  publication: PMID:1379726
  description: >-
    Transgenic mice expressing a mutant keratin 10 gene develop the
    epidermolytic hyperkeratosis phenotype, the first in vivo evidence that
    suprabasal keratin mutations underlie the human disease.
  modeled_mechanisms:
  - target: Suprabasal Keratinocyte Cytolysis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Mutant K10 expression reproduces suprabasal pathology and basal hyperproliferation.
    limitations: >-
      Transgenic overexpression of an engineered mutant rather than a
      heterozygous knock-in of a patient allele at the endogenous locus.
    evidence:
    - reference: PMID:1379726
      reference_title: "Transgenic mice expressing a mutant keratin 10 gene reveal the likely genetic basis for epidermolytic hyperkeratosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We have discovered that transgenic mice expressing a mutant keratin 10 gene have the EH phenotype"
      explanation: The dominant mutant K10 transgene reproduces the epidermolytic phenotype.
- name: Keratin 10 null mouse
  species: Mouse
  genotype: Krt10 -/-
  publication: PMID:11408568
  description: >-
    Mice lacking keratin 10 form a normal epidermis without fragility at birth
    because K5/K14 persist suprabasally; adults show basal hyperproliferation
    without cytolysis. This contrasts with human biallelic KRT10 null patients,
    who have epidermolytic ichthyosis with blistering.
  modeled_mechanisms:
  - target: Suprabasal Keratinocyte Cytolysis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: Loss of K10 in mice does not produce suprabasal cytolysis or blistering.
    limitations: >-
      Species difference in keratin redundancy: mouse epidermis compensates for
      K10 loss with suprabasal K5/K14 and novel K1/K14/K15 filaments, whereas
      human K10-null epidermis blisters despite induction of K6, K16 and K17.
    evidence:
    - reference: PMID:11408568
      reference_title: "Formation of a normal epidermis supported by increased stability of keratins 5 and 14 in keratin 10 null mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we show that the loss of K10, the most prominent epidermal protein, allowed the formation of a normal epidermis in neonatal mice without signs of fragility or wound-healing response."
      explanation: Neonatal K10-null mice lack the fragility seen in human recessive disease.
    - reference: PMID:12077355
      reference_title: "Hyperproliferation, induction of c-Myc and 14-3-3sigma, but no cell fragility in keratin-10-null mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Unlike most keratin mutant mice, the epidermis of adult K10-/- mice showed no cytolysis but displayed hyperproliferation of basal keratinocytes and an increased cell size."
      explanation: Adult K10-null mice also lack cytolysis.
  - target: Compensatory Epidermal Hyperproliferation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Adult K10-null mice show basal keratinocyte hyperproliferation.
    evidence:
    - reference: PMID:12077355
      reference_title: "Hyperproliferation, induction of c-Myc and 14-3-3sigma, but no cell fragility in keratin-10-null mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Unlike most keratin mutant mice, the epidermis of adult K10-/- mice showed no cytolysis but displayed hyperproliferation of basal keratinocytes and an increased cell size."
      explanation: Basal hyperproliferation occurs without cytolysis in adult K10-null mice.
notes: >-
  Scope. This entry covers the germline KRT10 epidermolytic ichthyoses that MONDO
  places under MONDO:0958184: the dominant form MONDO:0700248, the recessive null
  form MONDO:0700245, and annular epidermolytic ichthyosis 1 MONDO:0100303, each
  a has_subtypes row. It mirrors KRT1_Keratinopathies, which covers the KRT1
  allelic series. Ichthyosis with confetti (MONDO:0012208, congenital reticular
  ichthyosiform erythroderma) is not a subtype here: MONDO places it under
  keratinopathic ichthyosis rather than under MONDO:0958184, it is caused by
  either KRT10 or KRT1 frameshifts into an arginine-rich alternative reading
  frame that sends keratin 10 to the nucleolus, and its revertant mosaicism is a
  mechanism the epidermolytic forms lack (PMID:20798280); it needs its own entry.
  Epidermolytic epidermal nevi due to postzygotic KRT10 variants are likewise
  outside this entry. Several sources cited here (the Danish prevalence, the
  German cohort itch and pain figures, the IL-18 study) pool KRT1 and KRT10
  patients, and the NLRP3 aggregation result used a mutant KRT1 construct.
  The 2026-09-10 Bookshelf index read by `just check-genereviews` lists no
  GeneReviews chapter for epidermolytic ichthyosis, so the clinical baseline is
  the StatPearls chapter and the primary literature.

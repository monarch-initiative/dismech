    snippet: "EI is caused by pathogenic variants in the genes KRT1 and KRT10, encoding the proteins keratin 1 (KRT1) and keratin 10 (KRT10), respectively, and is primarily transmitted by autosomal-dominant inheritance, although recessive inheritance caused by nonsense variants in KRT10 is also described."

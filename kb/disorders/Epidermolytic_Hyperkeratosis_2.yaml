  evidence:
  - reference: PMID:9036939
    reference_title: "A novel dinucleotide mutation in keratin 10 in the annular epidermolytic ichthyosis variant of bullous congenital ichthyosiform erythroderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analysis revealed a novel tandem CG to GA 2-bp mutation in the same allele of keratin 10 in affected individuals, resulting in an arginine to glutamate substitution at residue 83 (R83E) of the 2B helical segment. We conclude that annular epidermolytic ichthyosis should be considered a variant of bullous congenital ichthyosiform erythroderma."
    explanation: Identifies a KRT10 2B-segment variant and places annular epidermolytic ichthyosis within the epidermolytic ichthyosis spectrum.
  - reference: PMID:9856845
    reference_title: "A novel helix termination mutation in keratin 10 in annular epidermolytic ichthyosis, a variant of bullous congenital ichthyosiform erythroderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analysis of this family revealed a novel mutation resulting in an isoleucine to threonine substitution at residue 107 (codon 446) within the highly conserved helix termination motif at the end of the rod domain of keratin 10."
    explanation: A second, independent KRT10 family with annular epidermolytic ichthyosis carries a helix termination motif variant.

- name: Keratinocyte NLRP3 Inflammasome Activation and IL-18 Release
  biological_scale: CELLULAR
  description: >-
    Serum and skin IL-18 are raised in epidermolytic ichthyosis and serum IL-18
    tracks severity. In keratinocytes expressing mutant keratin, NLRP3 and ASC
    cluster around the keratin aggregates and mature IL-18 release increases.
    The cell study used a mutant KRT1 construct, and the patient series did not
    separate KRT1 from KRT10 patients, so its application to KRT10 disease is
    inferred.

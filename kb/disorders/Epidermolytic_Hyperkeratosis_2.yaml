  description: >-
    Dominant variant of KRT10 epidermolytic ichthyosis with bullous ichthyosis in
    early childhood, later flexural and extensor lichenified hyperkeratotic
    plaques, and intermittent flares of annular, polycyclic, erythematous scaly
    plaques on the trunk and proximal limbs. Reported KRT10 variants lie in the 2B
    helical segment and its helix termination motif. MONDO places this class under
    both MONDO:0958184 and MONDO:0011870 annular epidermolytic ichthyosis; its
    KRT1 sibling, MONDO:0859574, is a subtype row of KRT1_Keratinopathies.

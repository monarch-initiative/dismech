pathophysiology:
- name: KRT10 Dominant-Negative Rod-Domain Variant
  conforms_to: "keratin_intermediate_filament_fragility#Dominant-Negative Keratin Variant in a Filament Assembly Domain"
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense variant in a conserved rod-domain motif of keratin 10,
    most often at Arg10 at the start of the 1A segment or in the 2B segment and
    helix termination motif, yields a K10 chain that still forms heterodimers with
    keratin 1 but poisons filament assembly and elongation.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    gene:
      preferred_term: KRT10
      term:
        id: hgnc:6413
        label: KRT10
    description: >-
      Germline heterozygous missense variants, frequently arising de novo.
  genes:
  - preferred_term: KRT10
    term:
      id: hgnc:6413
      label: KRT10
  biological_processes:
  - preferred_term: keratin intermediate filament assembly
    term:
      id: GO:0045109
      label: intermediate filament organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:1380725
    reference_title: "Mutations in the rod domains of keratins 1 and 10 in epidermolytic hyperkeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two other families, affected individuals had mutations in the highly conserved amino terminal of the rod domain of keratin 10. Structural analysis of these mutations predicts that heterodimer formation would be unaffected, although filament assembly and elongation would be severely compromised."
    explanation: KRT10 rod-domain mutations in affected families, with the dominant-negative prediction that heterodimers form but filaments do not assemble.
  - reference: PMID:7508181
    reference_title: "Preferential sites in keratin 10 that are mutated in epidermolytic hyperkeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results from this work support the hypothesis that the beginning of the 1A rod domain segment in keratin 10 contains preferential sites for disease-causing mutation in EH."
    explanation: Identifies the start of the K10 1A segment as the mutational hotspot.
  - reference: PMID:7508181
    reference_title: "Preferential sites in keratin 10 that are mutated in epidermolytic hyperkeratosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro functional assays performed with peptides corresponding to the 1A mutations in these families show severely diminished capacity to disaggregate preformed keratin intermediate filaments, in comparison with a wild-type control peptide."
    explanation: Peptide assays show the 1A variants alter the filament-interaction behaviour of the helix initiation motif.
  downstream:
  - target: Keratin Filament Network Collapse and Aggregation
    causal_link_type: DIRECT
    description: The mutant K10 chain is incorporated into the K1/K10 network and causes it to collapse into aggregates.
- name: Biallelic KRT10 Null Alleles and Keratin 10 Absence
  conforms_to: "keratin_intermediate_filament_fragility#Dominant-Negative Keratin Variant in a Filament Assembly Domain"
  biological_scale: MOLECULAR
  subtypes:
  - EHK2B
  description: >-
    Homozygous or compound heterozygous KRT10 nonsense, frameshift and splice
    variants cause transcript decay and complete absence of keratin 10 protein in
    the epidermis. The suprabasal network then lacks its type I partner; wound
    keratins K6, K16 and K17 are induced but do not compensate. One normal KRT10
    allele is sufficient for network formation, so carriers are unaffected. This
    node conforms to the module's variant-initiation node as the loss-of-function
    route into the same filament failure, not as a dominant-negative variant.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    gene:
      preferred_term: KRT10
      term:
        id: hgnc:6413
        label: KRT10
    description: >-
      Biallelic null alleles; compound heterozygosity with a leaky splice allele
      has also been reported.
  genes:
  - preferred_term: KRT10
    term:
      id: hgnc:6413
      label: KRT10
  biological_processes:
  - preferred_term: nonsense-mediated decay of KRT10 transcripts
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    modifier: INCREASED
  evidence:
  - reference: PMID:16505000
    reference_title: "A human keratin 10 knockout causes recessive epidermolytic hyperkeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Semi-quantitative RT-PCR and western blot analysis demonstrated degradation of the KRT10 transcript, resulting in complete absence of keratin K10 protein in the epidermis and cultured keratinocytes of homozygous patients."
    explanation: Direct demonstration of transcript degradation and absent K10 protein in patient tissue.
  - reference: PMID:29277919
    reference_title: "Recessive epidermolytic ichthyosis results from loss of keratin 10 expression, regardless of the mutation location."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blot analysis showed complete absence of keratin 10 protein in the patient's skin, suggesting early protein degradation."
    explanation: An independent recessive family with an exon 1 nonsense variant also lacks K10 protein.
  - reference: PMID:18219278
    reference_title: "Mild recessive bullous congenital ichthyosiform erythroderma due to a previously unidentified homozygous keratin 10 nonsense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the unaffected, heterozygous carriers of the mutation indicate that the K10 peptide from one normal allele alone is sufficient for keratin network formation."
    explanation: Explains why heterozygous null carriers are unaffected, in contrast to dominant-negative missense carriers.
  downstream:
  - target: Keratin Filament Network Collapse and Aggregation

    snippet: "Unlike most keratin mutant mice, the epidermis of adult K10-/- mice showed no cytolysis but displayed hyperproliferation of basal keratinocytes and an increased cell size."
    explanation: K10 loss alone increases basal proliferation in mice, relevant to the recessive null form.
  - reference: PMID:16505000
    reference_title: "A human keratin 10 knockout causes recessive epidermolytic hyperkeratosis."

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequence analysis revealed a homozygous nonsense mutation of the KRT10 gene in the affected family members, leading to a premature termination codon (p.Q434X), whereas the clinically unaffected consanguineous parents were both heterozygous carriers of the mutation."
      explanation: Homozygous affected children with heterozygous unaffected parents establishes recessive transmission.
  evidence:

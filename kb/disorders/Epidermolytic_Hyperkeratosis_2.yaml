genetic:
- name: KRT10 heterozygous dominant-negative variants
  gene_term:
    preferred_term: KRT10
    term:
      id: hgnc:6413
      label: KRT10
  association: Causative
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    Heterozygous missense variants and small in-frame changes in the conserved
    1A helix initiation motif (Arg10 recurrent), the 2B segment and the helix
    termination motif. Mild atypical disease resembling peeling skin syndrome has
    been reported with L12 linker variants. Severity is more variable than with
    KRT1: in a German cohort KRT10 patients were spread evenly across localized,
    intermediate and severe forms. This row covers subtypes EHK2A and
    AEI1; `Genetic.subtype` is single-valued, so those rows carry the reciprocal
    link through their own `genes` descriptors. KRT10 frameshifts into the
    alternative arginine-rich reading frame cause ichthyosis with confetti,
    which is a different disease and is not covered here.
  evidence:
  - reference: PMID:21271994
    reference_title: "Expanding the keratin mutation database: novel and recurrent mutations and genotype-phenotype correlations in 28 patients with epidermolytic ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most cases of severe EI, heterozygous single point mutations are found at the highly conserved helix boundary motifs of KRT1 and KRT10 that play a critical role in filament formation."
    explanation: Heterozygous point mutations at KRT10 helix boundary motifs cause severe epidermolytic ichthyosis.
  - reference: PMID:39072839
    reference_title: "Variants in the L12 linker domain of KRT10 are causal to atypical epidermolytic ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report three different novel missense variants in the L12 linker domain of KRT10 in patients with an atypical, milder form of EI resembling peeling skin syndrome."
    explanation: Extends the allelic series to linker variants with a milder phenotype.
  - reference: PMID:38741524
    reference_title: "Epidermolytic ichthyosis: Clinical spectrum and burden of disease in a large German cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with keratin 1 mutations tended to have severe EI, while the three forms were evenly distributed in those with keratin 10 mutations."
    explanation: In a 48-patient cohort graded localized, intermediate or severe, KRT10 patients spread evenly across the three severity forms, unlike KRT1 patients.
  - reference: PMID:20798280
    reference_title: "Mitotic recombination in patients with ichthyosis causes reversion of dominant mutations in KRT10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, no revertant clones have been reported, or seen in our clinics, in patients with dominant negative or recessive mutations in keratin 10 that cause a distinct disease, epidermolytic ichthyosis (also known as epidermolytic hyperkeratosis)"
    explanation: Distinguishes KRT10 epidermolytic ichthyosis, without revertant clones, from ichthyosis with confetti.
- name: KRT10 biallelic null variants
  gene_term:
    preferred_term: KRT10
    term:
      id: hgnc:6413
      label: KRT10
  association: Causative
  relationship_type: CAUSATIVE
  subtype: EHK2B
  inheritance:
  - name: Autosomal Recessive
  notes: >-
    Homozygous nonsense or splice variants, and compound heterozygosity for a
    nonsense variant and a leaky splice variant, abolish or reduce keratin 10.
  evidence:
  - reference: PMID:29277919
    reference_title: "Recessive epidermolytic ichthyosis results from loss of keratin 10 expression, regardless of the mutation location."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of the patient's genomic DNA revealed a novel homozygous nonsense mutation residing within the proximal part KRT10 first exon. The mutation was found to co-segregate with the disease phenotype in an autosomal recessive fashion."
    explanation: Homozygous KRT10 nonsense variant co-segregating recessively.
  - reference: PMID:31278741
    reference_title: "Skin fragility caused by biallelic KRT10 mutations: an intriguing form of self-improving epidermolytic ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The causative factors were found to be one nonsense mutation in KRT10 that leads to mRNA decay, and one synonymous variant that affects the donor splice site of exon 3."
    explanation: Compound heterozygous null and leaky splice alleles in a mild case.

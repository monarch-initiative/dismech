prevalence:
- population: Denmark
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.29
  notes: >-
    Approximately 1 in 350,000 for epidermolytic ichthyosis as a whole, of which
    the KRT10 form is a part: six of the eleven genotyped Danish families carried
    a KRT10 variant and five a KRT1 variant. No KRT10-specific population
    estimate was found.
  evidence:

name: Epidermolytic Hyperkeratosis 2
creation_date: "2026-09-28T12:49:03Z"
category: Mendelian
description: >-
  Epidermolytic hyperkeratosis 2 is the KRT10 form of epidermolytic ichthyosis, a
  keratinopathic ichthyosis of the suprabasal epidermis. Most patients carry a
  heterozygous missense variant in the helix initiation motif at the start of the
  1A rod segment or the helix termination motif at the end of the 2B rod segment
  of keratin 10, the type I partner of keratin 1. The mutant chain is incorporated
  into K1/K10 heterodimers and blocks filament assembly and elongation, so the
  keratin network of spinous and granular keratinocytes collapses into perinuclear
  tonofilament clumps and the cells lyse. Affected newborns have erythroderma,
  blisters and erosions; blistering becomes less frequent with age while
  hyperkeratosis and ichthyotic scale increase. A minority of families carry
  biallelic KRT10 null alleles that abolish keratin 10 protein and cause a
  recessive form, and helix termination or 2B-domain variants produce the annular
  epidermolytic ichthyosis variant with episodic polycyclic plaques. Compared with
  KRT1 disease, KRT10 disease usually spares the palms and soles.

      description names acrocapitofemoral dysplasia (IHH) as a member. The
      MONDO parent MONDO:0019695 acromelic dysplasia agrees.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists. The 2003 molecular report includes five affected individuals in two families, whereas the clinical comparison in the 2025 report tabulates four of those individuals plus two Turkish and two Pakistani patients. Thus its eight-person table is not a complete count of all molecularly reported individuals. The scanned 2003 full text explicitly says that a fifth patient was identified after the initial four. The four unblended molecular families therefore contribute at least nine individuals, rather than eight. A separate 2025 Syrian child with IHH and other skeletal-dysplasia gene variants has a blended phenotype and is not pooled into these phenotype denominators.
  evidence:
  - reference: PMID:40045933
    reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Up till now, only six cases of ACFD have been reported from Belgian, Dutch
      (Mortier et al. 2003; Hellemans et al. 2003), and Turkish families (Cubuk
      and Duz 2021).
    explanation: >-
      This is the later report's stated caseload, which omits the additional fifth individual in the 2003 molecular study. Its table remains useful as an explicitly defined eight-person comparison, not a complete census.
  - reference: PMID:34530144
    reference_title: "Acrocapitofemoral dysplasia: Novel mutation in IHH in two adult patients from the third family in the literature and progression of the disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only four child patients from two families have been reported."
    explanation: >-
      The adult report summarizes four earlier children. This does not supersede the five molecularly characterized individuals in the 2003 report.
  - reference: PMID:12632327
    reference_title: "Homozygous mutations in IHH cause acrocapitofemoral dysplasia, an autosomal recessive disorder with cone-shaped epiphyses in hands and hips."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both affected individuals of family 1 are homozygous for a 137C-->T transition (P46L), and the three patients in family 2 are homozygous for a 569T-->C transition (V190A).
    explanation: >-
      Two plus three establishes five individuals in the original molecular report; adding the two subsequent sibships gives at least nine across the four families.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The unblended ACFD families reported here have homozygous IHH missense variants, consistent with autosomal recessive inheritance. Tested parents carry heterozygous variants. Both Pakistani carrier parents had short stature with clinically normal hands; that observation should not be generalized to every carrier. The original molecular paper discusses subtle radiographic hand-bone shortening in some parents without the typical BDA1 phenotype. Carrier effects and penetrance remain incompletely characterized.
  evidence:
  - reference: PMID:12632327
    reference_title: "Homozygous mutations in IHH cause acrocapitofemoral dysplasia, an autosomal recessive disorder with cone-shaped epiphyses in hands and hips."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both affected individuals of family 1 are homozygous for a 137C-->T
      transition (P46L), and the three patients in family 2 are homozygous for a
      569T-->C transition (V190A).
    explanation: Homozygosity for the causal variant in all affected members of the two founding families.
  - reference: PMID:40045933
    reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The parents were heterozygous carriers, while both affected individuals
      carried the homozygous mutant allele
    explanation: Segregation consistent with autosomal recessive inheritance in the fourth family.
genetic:
- name: IHH
  gene_term:
    preferred_term: IHH
    term:
      id: hgnc:5956
      label: IHH
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Four homozygous missense variants are known, one per family: c.137C>T
    p.(Pro46Leu), c.569T>C p.(Val190Ala), c.478C>T p.(Arg160Cys) and c.518C>A
    p.(Ala173Asp). All lie in the amino-terminal signaling fragment (IHH-N),
    away from the central cluster of residues (codons 95-154) that carries the
    dominant brachydactyly type A1 variants. The 2025 report describes the ACFD
    variants as lying in "amino acids 201-308"; that range does not fit its own
    list of variant positions (46-190) and is not used here.
  evidence:
  - reference: PMID:12632327
    reference_title: "Homozygous mutations in IHH cause acrocapitofemoral dysplasia, an autosomal recessive disorder with cone-shaped epiphyses in hands and hips."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using a candidate-gene approach, we identified two missense mutations in
      the amino-terminal signaling domain of the gene encoding Indian hedgehog
      (IHH).
    explanation: Identifies IHH as the causal gene after linkage to 2q35-q36.
  - reference: PMID:19277064
    reference_title: Brachydactyly A-1 mutations restricted to the central region of the N-terminal active fragment of Indian Hedgehog.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of the BDA1 mutations occur in a restricted area of the N-terminal
      active fragment of the IHH and are in contrast to those mutations causing
      an autosomal recessive acrocapitofemoral dysplasia, whose mutations are
      located at the distal N- and C-terminal regions of IHH-N and are
      physically separated from the BDA1-causing mutations.
    explanation: >-
      Places the recessive ACFD variants at the ends of IHH-N, apart from the
      dominant BDA1 hotspot.
  variants:
  - name: IHH c.137C>T p.(Pro46Leu)
    description: Homozygous in the two affected members of family 1 (2003).
    evidence:
    - reference: PMID:12632327
      reference_title: "Homozygous mutations in IHH cause acrocapitofemoral dysplasia, an autosomal recessive disorder with cone-shaped epiphyses in hands and hips."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both affected individuals of family 1 are homozygous for a 137C-->T
        transition (P46L)
      explanation: Reports the variant and its homozygous state.
  - name: IHH c.569T>C p.(Val190Ala)
    description: Homozygous in the three affected members of family 2 (2003).
    evidence:
    - reference: PMID:12632327
      reference_title: "Homozygous mutations in IHH cause acrocapitofemoral dysplasia, an autosomal recessive disorder with cone-shaped epiphyses in hands and hips."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the three patients in family 2 are homozygous for a 569T-->C transition
        (V190A)
      explanation: Reports the variant and its homozygous state.
  - name: IHH c.478C>T p.(Arg160Cys)
    description: Homozygous in two adult siblings from a Turkish family (2021).
    evidence:
    - reference: PMID:34530144
      reference_title: "Acrocapitofemoral dysplasia: Novel mutation in IHH in two adult patients from the third family in the literature and progression of the disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe two adult patients with ACFD with a novel homozygous
        c.478C>T (p.Arg160Cys) mutation in IHH in the third family of the
        literature.
      explanation: Reports the third ACFD variant.
  - name: IHH c.518C>A p.(Ala173Asp)
    description: >-
      Homozygous in two siblings from a Pakistani family (2025). Classified
      likely pathogenic by the reporting authors under ACMG criteria. In
      silico modeling places Ala173 in the core of the domain.
    evidence:
    - reference: PMID:40045933
      reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This variant caused the substitution of Alanine with Aspartate at amino
        acid position 173 (NP_002172.2: p.(Ala173Asp)) in the IHH protein.
      explanation: >-
        Reports the fourth ACFD variant (c.518C>A in NM_002181.4), found
        homozygous in both affected siblings.
pathophysiology:
- name: Biallelic IHH Signaling-Domain Missense Variants
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Homozygous missense substitutions at conserved residues of the IHH
    amino-terminal signaling fragment, the secreted, lipid-modified part of the
    protein that binds Patched receptors. No truncating ACFD allele has been
    reported.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
  gene:
    preferred_term: IHH
    term:
      id: hgnc:5956
      label: IHH
  evidence:
  - reference: PMID:12632327
    reference_title: "Homozygous mutations in IHH cause acrocapitofemoral dysplasia, an autosomal recessive disorder with cone-shaped epiphyses in hands and hips."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two mutant amino acids are strongly conserved and predicted to be
      located outside the region where brachydactyly type A-1 mutations are
      clustered.
    explanation: Conservation of the mutated residues and their position relative to the BDA1 cluster.
  downstream:
  - target: Reduced IHH Signaling Output
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced pathway output is inferred for the disorder. Modeling of p.Ala173Asp predicts destabilization, whereas p.Val190Ala has experimental evidence of reduced IHH-N abundance. These findings do not establish an identical biochemical defect for every allele or demonstrate absent intrinsic signaling activity.
    evidence:
    - reference: PMID:40045933
      reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: COMPUTATIONAL
      snippet: >-
        This variant is likely to disrupt the essential core structure of the
        protein domain due to the size and charge difference of the wild-type
        and mutant residues, leading to a loss of hydrophobic interactions within
        the core, potentially causing protein folding problems.
      explanation: >-
        Structural modeling and molecular dynamics of p.Ala173Asp predict core
        destabilization. This is a prediction, not a measured loss of signaling.
  - target: Reduced V190A IHH-N Abundance
    causal_link_type: DIRECT
    description: >-
      The V190A allele reduces the abundance of the signaling fragment in a heterologous expression assay; the study attributes this predominantly to reduced stability, with a smaller effect on autoprocessing.
    evidence:
    - reference: PMID:34070546
      reference_title: Highly Conserved C-Terminal Region of Indian Hedgehog N-Fragment Contributes to Its Auto-Processing and Multimer Formation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        ACFD-associated mutation V190A ... which is closed to the KSEH in the C-terminus of IHH-N, affected the self-cleavage slightly but reduced protein stability obviously (Figure S5)
      explanation: >-
        Wang et al. tested the disease-associated V190A substitution in an IHH expression system. They interpreted the fragment immunoblots as a slight processing defect and a larger stability defect. This does not establish the effects of the other ACFD alleles or quantify signaling in patient cartilage.
- name: Reduced V190A IHH-N Abundance
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    The ACFD-associated p.Val190Ala IHH protein yields reduced IHH-N abundance in transfected cells. Wang et al. interpreted the N- and C-terminal fragment immunoblots as showing reduced stability with a smaller effect on precursor self-cleavage. Protein turnover kinetics and the magnitude of this defect in human growth-plate cartilage were not established. This allele-specific result is distinct from the computational destabilization prediction for p.Ala173Asp.
  evidence:
  - reference: PMID:34070546
    reference_title: Highly Conserved C-Terminal Region of Indian Hedgehog N-Fragment Contributes to Its Auto-Processing and Multimer Formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ACFD-associated mutation V190A ... which is closed to the KSEH in the C-terminus of IHH-N, affected the self-cleavage slightly but reduced protein stability obviously (Figure S5)
    explanation: >-
      Wang et al. tested the disease-associated V190A substitution in an IHH expression system. They interpreted the fragment immunoblots as a slight processing defect and a larger stability defect. This does not establish the effects of the other ACFD alleles or quantify signaling in patient cartilage.
  downstream:
  - target: Reduced IHH Signaling Output
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Less available ligand could reduce tissue-level pathway activation even if the remaining ligand retains signaling activity. This link is an inference, not a measurement in patient cartilage.
    evidence:
    - reference: PMID:34070546
      reference_title: Highly Conserved C-Terminal Region of Indian Hedgehog N-Fragment Contributes to Its Auto-Processing and Multimer Formation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        V190A mutation may cause disease in part by reducing the IHH-N protein level.
      explanation: >-
        The authors propose reduced ligand abundance as a disease mechanism; its contribution to the human growth-plate phenotype remains inferred.
- name: Reduced IHH Signaling Output
  biological_scale: MOLECULAR
  description: >-
    Reduced effective Hedgehog signaling is proposed in growth-plate chondrocytes and perichondrium. Mouse Ihh deletion reduces ciliary Smoothened and nuclear Gli1. In ACFD, human tissue-level output remains unmeasured: V190A can lower IHH-N abundance, while a preliminary thesis reporter assay found preserved activity when the amount of secreted V190A ligand was normalized. Reduced ligand availability, spatial distribution and intrinsic receptor activation are distinct possible mechanisms.
  biological_processes:
  - preferred_term: Smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: DECREASED
  cell_types:

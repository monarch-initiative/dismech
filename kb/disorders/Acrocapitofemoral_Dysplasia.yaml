  - target: Ectopic Chondrocyte Hypertrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Embryonic experiments identify an IHH-PTHrP feedback brake on hypertrophy. In the postnatal deletion model, PTHrP persists but its distribution and that of its receptor are abnormal; a simple absence of PTHrP is not demonstrated. Translation of these model findings to ACFD remains provisional.
    evidence:
    - reference: PMID:8662546
      reference_title: Regulation of rate of cartilage differentiation by Indian hedgehog and PTH-related protein.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        PTHrP mediates the effects of Ihh through the formation of a negative
        feedback loop that modulates the rate of chondrocyte differentiation.
      explanation: >-
        The IHH-PTHrP loop is the known intermediate linking IHH output to
        the rate of hypertrophic differentiation.
    - reference: PMID:17409191
      reference_title: Indian Hedgehog produced by postnatal chondrocytes is essential for maintaining a growth plate and trabecular bone.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        postnatal deletion of Ihh from chondrocytes affects the regular distribution of PTHrP and its receptor expression
      explanation: >-
        Postnatal deletion alters the spatial PTHrP system rather than simply abolishing PTHrP expression.
  - target: Loss of Growth Plate Columnar Organization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      IHH supports entry of periarticular cells into the columnar compartment independently of PTHrP; postnatal deletion disrupts the columns despite residual PTHrP.
    evidence:
    - reference: PMID:15951842
      reference_title: Indian hedgehog stimulates periarticular chondrocyte differentiation to regulate growth plate length independently of PTHrP.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results demonstrate that Ihh acts on periarticular chondrocytes to stimulate their differentiation, thereby regulating the columnar cell mass independently of PTHrP.
      explanation: >-
        Mouse developmental genetics identifies a PTHrP-independent contribution to columnar cell mass.
    - reference: PMID:17409191
      reference_title: Indian Hedgehog produced by postnatal chondrocytes is essential for maintaining a growth plate and trabecular bone.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ihh is essential to induce columnar chondrocyte differentiation to maintain a growth plate, even after birth, despite the presence of PTHrP protein in the remaining chondrocytes in the growth plate at P7 in mutant mice
      explanation: >-
        The postnatal model retains PTHrP protein but loses normal growth-plate organization.

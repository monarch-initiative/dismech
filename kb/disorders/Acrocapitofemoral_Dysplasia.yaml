  - target: Relative macrocephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The head is large relative to a body shortened by reduced endochondral
      growth. Head circumference ranges from the 3rd to the 98th centile in the
      published patients, so the head is not enlarged in absolute terms.
phenotypes:
- category: Growth
  name: Disproportionate short stature
  frequency: VERY_FREQUENT
  description: >-
    Postnatal-onset short stature with short limbs. It is present in all eight
    published patients, ranging from -3 SD in the Belgian and Dutch children to
    about -10 SD in the Pakistani siblings.
  phenotype_term:
    preferred_term: Disproportionate short stature
    term:
      id: HP:0003498
      label: Disproportionate short stature
  evidence:
  - reference: PMID:40045933
    reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

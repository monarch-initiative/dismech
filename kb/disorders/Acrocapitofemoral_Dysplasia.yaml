      explanation: Growth plate histology in the model.
- name: Aggrecan-lineage Ihh deletion (Acan-creERT; Ihh floxed) mouse
  species: Mouse
  genotype: Acan-creERT; Ihh(fl/fl), tamoxifen-induced
  publication: PMID:34820473
  description: >-
    Inducible deletion of Ihh from aggrecan-expressing cells. The authors
    present it as a model of human IHH-related chondrodysplasias, including
    ACFD, and used it to test the Smoothened agonist SAG.
  modeled_mechanisms:
  - target: Reduced IHH Signaling Output
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reduced ciliary Smoothened and nuclear Gli1 in Ihh-deficient chondrocytes.
    limitations: >-
      A conditional deletion model with residual Ihh expression and broad aggrecan-lineage targeting, not an ACFD missense model. Smoothened and Gli1 were measured in cultured articular chondrocytes, not directly in patient growth plates.
    readouts:
    - name: Ciliary Smoothened and nuclear Gli1 in chondrocytes
      target: Reduced IHH Signaling Output
      direction: DECREASED
      interpretation: Direct pathway-activity readout downstream of Patched.
      evidence:
      - reference: PMID:34820473
        reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Lower levels of Smo in the cilium or Gli1 protein in the nucleus were
          detected in Ihh-deficient chondrocytes than in control chondrocytes.
        explanation: The measured readout and its direction.
    evidence:
    - reference: PMID:34820473
      reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Smoothen agonist (SAG) promoted Hh activity and rescued chondrocyte
        proliferation and differentiation by stimulating smoothened trafficking
        to the cilium in Ihh-silenced cells.
      explanation: >-
        Rescue with a Smoothened agonist shows the defect sits upstream of
        Smoothened, which is where reduced ligand acts.
  - target: Narrow chest
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The mice have short stature, a short spine and a narrow thorax. Respiratory failure attributed to rib shortening caused the 23 deaths among 83 vehicle-treated mutants; 60 survived to the study endpoint.
    limitations: >-
      The mouse model includes lethal thoracic restriction in a subset. This is not established as a typical ACFD outcome; human respiratory manifestations and animal mortality should not be equated.
    evidence:
    - reference: PMID:34820473
      reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The results showed that the phenotype of Ihh-deficient mice (Ihhcko)
        closely mimicked that of humans with Ihh gene mutation-related skeletal
        dysplasia defects, including short stature with short spine and trunk,
        narrow thorax
      explanation: Thoracic and stature phenotype of the model.
    - reference: PMID:34820473
      reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ihhcko mice treated with vehicle, which had a survival rate of 72.3% (60/83)
      explanation: >-
        The explicit denominator corrects a misleading reading of the same paper as showing universal mortality.
discussions:
- discussion_id: acfd_missense_vs_null_models
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced IHH Signaling Output
  - pathophysiology#Biallelic IHH Signaling-Domain Missense Variants
  prompt: >-
    How do the individual ACFD alleles alter ligand abundance, processing, signaling potency and spatial range in human cartilage?
  rationale: >-
    Functional evidence exists but is uneven. Wang et al. (2021) found reduced V190A IHH-N abundance, interpreted as a stability defect with a smaller processing effect. Cunningham's 2008 MSc thesis found reduced secreted V190A ligand but preserved LIGHT2 reporter activity after concentration normalization. That thesis corrected an initial immunoblot band misidentification, discovered that its intended P46L construct was wild type, and reported a media/insulin confound in the V190A ATDC5 assay; those results do not establish normal human chondrogenesis or a P46L effect. Hellemans' 2006 doctoral thesis found no differences among wild-type, ACFD and BDA1 IHH-overexpressing chicken micromass cultures. These preliminary assays may miss concentration-dependent or spatial defects. The p.Ala173Asp evidence remains computational. Mouse deletion models establish IHH requirements but cannot resolve allele-specific effects or tissue restriction.
  evidence:
  - reference: PMID:40045933
    reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      In silico modeling and dynamic simulation analysis revealed that the
      variant disturbed the core structure of the domain and destabilized the
      loop region and the region surrounding the variant.
    explanation: >-
      Computational evidence for p.Ala173Asp; it is not the only functional evidence available for the disorder.
  - reference: PMID:34070546
    reference_title: Highly Conserved C-Terminal Region of Indian Hedgehog N-Fragment Contributes to Its Auto-Processing and Multimer Formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ACFD-associated mutation V190A ... which is closed to the KSEH in the C-terminus of IHH-N, affected the self-cleavage slightly but reduced protein stability obviously (Figure S5)
    explanation: >-
      Wang et al. tested the disease-associated V190A substitution in an IHH expression system. They interpreted the fragment immunoblots as a slight processing defect and a larger stability defect. This does not establish the effects of the other ACFD alleles or quantify signaling in patient cartilage.
  - reference: url:https://www.collectionscanada.gc.ca/obj/thesescanada/vol2/002/MR48445.PDF
    reference_title: "https://www.collectionscanada.gc.ca/obj/thesescanada/vol2/002/MR48445.PDF"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The V190A mutation was the only mutant that induced a comparable level of relative luciferase activity
    explanation: >-
      Cunningham (2008), MSc thesis, chapter 4: secreted V190A IHH-N retained reporter activity when conditioned media were normalized for ligand abundance by immunoblot densitometry. This preliminary heterologous-cell experiment distinguishes ligand quantity from activity per amount of ligand; it is not evidence of normal signaling in patient growth plates.
  - reference: url:https://backoffice.biblio.ugent.be/download/472261/1879896
    reference_title: "https://backoffice.biblio.ugent.be/download/472261/1879896"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Comparison of the cultures infected with wild-type IHH, ACFD-IHH or BDA1-IHH did not reveal any differences.
    explanation: >-
      Hellemans (2006), doctoral thesis, general discussion: chicken limb-bud micromass cultures overexpressing IHH variants showed no detected differences. The experiment included c.137C>T and c.569T>C equivalents of the ACFD alleles. Overexpression and a coarse differentiation readout may miss quantitative or spatial defects; this was preliminary thesis work.
  proposed_experiments:
  - experiment_id: exp_acfd_allele_signaling_assays
    name: Compare ACFD allele processing, ligand availability and signaling potency
    description: >-
      Express full-length wild-type IHH and sequence-confirmed P46L, R160C, A173D and V190A constructs alongside BDA1 controls. Separately quantify precursor processing, secreted ligand and dose-normalized reporter activation, then test spatial signaling in a cartilage-relevant system. Use full-length protein for processing and secretion assays; expressing IHH-N alone would bypass those steps. Control media composition and avoid interpreting a saturating overexpression assay as proof of normal signaling range.
    would_support:
    - pathophysiology#Reduced IHH Signaling Output
    supporting_outcome:
    - >-
      Reduced, but not absent, pathway activation for all four alleles would
      support a hypomorphic mechanism consistent with a recessive,
      skeleton-restricted phenotype.
    would_refute:
    - pathophysiology#Reduced IHH Signaling Output
    refuting_outcome:
    - >-
      Normal dose-normalized reporter activation would refute an obligatory intrinsic potency defect, but would not refute reduced ligand abundance or altered spatial availability. Normal tissue-level signaling across controlled expression levels would challenge the reduced-output model.
- discussion_id: acfd_carrier_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - inheritance#Autosomal Recessive
  prompt: >-
    Do heterozygous carriers of ACFD alleles have short stature or subtle hand
    changes?
  rationale: >-
    Carrier phenotype is not wholly unstudied. The original 2003 molecular paper, reprinted in Hellemans' thesis (paper p.1044), describes subtle phalangeal or metacarpal shortening in parents without typical BDA1; pelvic radiographs were normal in the Belgian parents examined. The Pakistani parents had short stature and clinically normal hands. Heterozygous IHH variants can also cause dominant short stature. Systematic age-, sex- and family-adjusted data are needed to determine the penetrance and clinical significance of ACFD carrier findings.
  evidence:
  - reference: PMID:40045933
    reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The height of the father (53 years old) and the mother (45 years old) was
      short, with 155 cm (-3.0SD) and 140.2 cm (-3.6 SD), respectively, but
      their hands were normal, with normal fingers.
    explanation: Short stature in both obligate carriers in one family.
  - reference: PMID:29155992
    reference_title: IHH Gene Mutations Causing Short Stature With Nonspecific Skeletal Abnormalities and Response to Growth Hormone Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identified IHH variants segregate with short stature in a dominant
      inheritance pattern.
    explanation: Heterozygous IHH variants are an established cause of dominant short stature.
notes: >-
  Phenotype counts refer to the explicitly tabulated patients and exclude NA/NR from assessed denominators; the small series does not establish universal population frequencies. Unilateral ptosis, pes planus and hypertrichosis are reported family-level findings with uncertain attribution to IHH. No disease-specific interventional study was identified in ClinicalTrials.gov as of 2026-09-27. Growth-hormone responses reported for heterozygous IHH-related short stature are not established treatment evidence for biallelic ACFD.

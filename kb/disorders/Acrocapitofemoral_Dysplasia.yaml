    snippet: >-
      Despite the age difference among the ACFD patients reported to date
      (Table 2), early growth plate closure was evident in all of them, which
      led to the shortening of long tubular bones in the arms and legs, along
      with cone-shaped epiphyses.
    explanation: >-

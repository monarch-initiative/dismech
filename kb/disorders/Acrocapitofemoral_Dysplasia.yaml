- name: Premature Growth Plate Closure
  biological_scale: TISSUE
  description: >-
    Affected growth plates can close prematurely, often before puberty, permanently shortening the hand bones and long bones. Cone-shaped epiphyses occur during this process and may disappear after fusion; timing differs by skeletal site. The egg-shaped capital femoral epiphysis and short femoral neck are characteristic. The eight patients tabulated in 2025 are not all known molecularly reported patients.

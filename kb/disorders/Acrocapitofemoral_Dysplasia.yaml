diagnosis:
- name: Skeletal radiographic assessment
  description: >-
    The combination of hand epiphyseal abnormalities and the short femoral neck with egg-shaped capital epiphysis supports recognition of ACFD. Adult films may instead show fused plates, very short femoral necks, altered metacarpal configuration and phalangeal fusion; loss of childhood cone-shaped appearances does not exclude the diagnosis.
  evidence:
  - reference: PMID:34530144
    reference_title: "Acrocapitofemoral dysplasia: Novel mutation in IHH in two adult patients from the third family in the literature and progression of the disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The reported cases showed a middle phalanges which fused with distal phalanges in the fifth toes, the typical configuration of metacarpals, radial angulation and extremely short femoral neck. These findings could help the diagnosis of ACFD in adult patients.
    explanation: >-
      Adult diagnostic clues differ from childhood epiphyseal appearances.
  diagnosis_term:
    preferred_term: Bone Radiography
    term:
      id: NCIT:C137876
      label: Bone Radiography
- name: Molecular testing for biallelic IHH variants
  description: >-
    Exome sequencing identified the IHH variant in the Pakistani proband; Sanger sequencing confirmed the variant and segregation in affected siblings and parents. Molecular findings should be interpreted with the radiographic phenotype, particularly when additional skeletal-dysplasia gene variants could produce a blended presentation.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:40045933
    reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing (WES) followed by Sanger sequencing was carried out for mutational screening.
    explanation: >-
      Exome discovery with Sanger confirmation in the reported family.
  - reference: PMID:40045933
    reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The parents were heterozygous carriers, while both affected individuals carried the homozygous mutant allele
    explanation: >-
      Family segregation supports the molecular interpretation.
treatments:
- name: Smoothened agonist SAG (preclinical)
  action_category: THERAPEUTIC
  context: Experimental treatment in conditional Ihh-deletion mice and cultured mouse chondrocytes; no established human ACFD efficacy
  description: >-
    SAG activates Smoothened downstream of IHH. It improved skeletal growth and survival in conditional Ihh-deletion mice; starting at postnatal day 7 produced greater growth benefit than starting at day 14. Cartilage and growth-plate rescue was partial. The study also reported intestinal hyperplasia and bowel-obstruction deaths, so its broad statement of no toxicity should not be taken as a safety conclusion. These results do not establish a treatment regimen for patients with ACFD.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: SAG (Smoothened agonist)
      term:
        id: CHEBI:138438
        label: 3-chloro-N-[trans-4-(methylamino)cyclohexyl]-N-[3-(pyridin-4-yl)benzyl]-1-benzothiophene-2-carboxamide
  target_mechanisms:
  - target: Reduced IHH Signaling Output
    treatment_effect: RESTORES
    description: >-
      Activating Smoothened restores downstream signaling readouts in the conditional-deletion model, bypassing deficient IHH input.
    evidence:
    - reference: PMID:34820473
      reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        SAG treatment resulted in dramatically increased Smo translocation to the primary cilium and Gli1 accumulation in the nucleus
      explanation: >-
        SAG restores pathway readouts downstream of the missing ligand in cultured mouse articular chondrocytes. It does not correct the IHH genotype.
  evidence:
  - reference: PMID:34820473
    reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SAG treatment resulted in dramatically increased Smo translocation to the primary cilium and Gli1 accumulation in the nucleus
    explanation: >-
      SAG restores pathway readouts downstream of the missing ligand in cultured mouse articular chondrocytes. It does not correct the IHH genotype.
  - reference: PMID:34820473
    reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      earlier treatment with SAG beginning on P7 was more effective in preventing the dwarfism phenotype compared to the treatment beginning on P14.
    explanation: >-
      The comparison concerns timing in neonatal mice; it does not establish clinical timing for children.
  - reference: PMID:34820473
    reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      SAG can more effectively rescue the defective bone but just partially rescue the growth plate and cartilage.
    explanation: >-
      The discussion qualifies the degree of rescue; normal growth-plate biology was not fully restored.
  - reference: PMID:34820473
    reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a few animals treated with SAG had intestinal hyperplasia, showing increased thickness of the smooth muscle layer, which raises the possibility of bowel obstruction.
    explanation: >-
      The full-text toxicity observations materially qualify the abstract's reassurance.
  - reference: PMID:34820473
    reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      none of the animals in the vehicle-treated wild-type group died (0/83), while one animal died from bowel obstruction in the SAG-treated wild-type group (1/41).
    explanation: >-
      A reported adverse outcome in treated wild-type animals. The paper's other mortality totals are not fully consistent, so they are not pooled into an additional safety estimate.

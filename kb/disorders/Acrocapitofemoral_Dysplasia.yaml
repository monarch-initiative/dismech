name: Acrocapitofemoral Dysplasia
creation_date: "2026-09-24T20:42:38Z"
category: Mendelian
description: >-
  Acrocapitofemoral dysplasia (ACFD) is an ultra-rare autosomal recessive skeletal dysplasia caused by homozygous missense variants in the amino-terminal signaling domain of IHH (Indian hedgehog). It presents with postnatal-onset disproportionate short stature with short limbs, brachydactyly, a narrow thorax and a relatively large head, with normal intelligence. The defining radiographic signs are cone-shaped epiphyses, mainly in the hands and hips, and an egg-shaped capital femoral epiphysis on a short femoral neck. These are followed by early, prepubertal closure of the growth plates, which permanently shortens the tubular bones of the hands and the long bones of the limbs. A published cell study found reduced IHH-N abundance, interpreted as reduced protein stability with a slight processing defect for p.Val190Ala. The growth-plate mechanism is supported mainly by mouse genetics: IHH secreted by prehypertrophic chondrocytes drives chondrocyte proliferation and paces hypertrophic differentiation through a PTHrP feedback loop, and postnatal loss of chondrocyte IHH disorganizes the growth plate and fuses it prematurely. Allele-specific effects on signaling in human cartilage remain unresolved.
synonyms:
- ACFD

- name: Brachydactyly Type A1 (IHH-related)
  description: >-
    The dominant allelic disorder. Heterozygous IHH variants cause shortened or
    absent middle phalanges, often with mild short stature, but without the
    proximal femoral changes or generalized early growth plate closure of ACFD.
    The two disorders map to separate regions of IHH-N.
  evidence:
  - reference: PMID:19277064
    reference_title: Brachydactyly A-1 mutations restricted to the central region of the N-terminal active fragment of Indian Hedgehog.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of the BDA1 mutations occur in a restricted area of the N-terminal
      active fragment of the IHH and are in contrast to those mutations causing
      an autosomal recessive acrocapitofemoral dysplasia
    explanation: Distinguishes the two allelic IHH disorders by variant location.
animal_models:
- name: Postnatal chondrocyte Ihh deletion (Col2a1-creERT; Ihh floxed) mouse
  species: Mouse
  genotype: Col2a1-creERT; Ihh(fl/fl), tamoxifen-induced after birth
  publication: PMID:17409191
  description: >-
    Tamoxifen-induced deletion of Ihh from chondrocytes after birth. This
    avoids the embryonic lethality of the constitutive null and isolates the
    postnatal growth plate phase in which ACFD becomes apparent.
  modeled_mechanisms:
  - target: Accelerated Hypertrophic Differentiation and Loss of Columnar Organization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces loss of columnar structure and ectopic hypertrophy in the
      postnatal growth plate.
    limitations: >-
      Complete deletion of Ihh from chondrocytes, whereas ACFD patients carry
      homozygous missense alleles whose residual activity is unknown. The
      mice also lose trabecular bone and articular surface, which are not
      established features of the human disease.
    evidence:
    - reference: PMID:17409191
      reference_title: Indian Hedgehog produced by postnatal chondrocytes is essential for maintaining a growth plate and trabecular bone.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        postnatal deletion of Ihh resulted in loss of columnar structure,
        premature vascular invasion, and formation of ectopic hypertrophic
        chondrocytes in the growth plate
      explanation: Growth plate histology in the model.
  - target: Premature Growth Plate Closure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces premature growth plate fusion and dwarfism.
    limitations: >-
      Mouse growth plates do not close physiologically the way human ones do at
      puberty, so the timing is not directly comparable to prepubertal closure
      in patients.
    evidence:
    - reference: PMID:17409191
      reference_title: Indian Hedgehog produced by postnatal chondrocytes is essential for maintaining a growth plate and trabecular bone.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, destruction of the articular surface in long bones and
        premature fusion of growth plates of various endochondral bones was
        evident, resulting in dwarfism in mutant mice.
      explanation: Premature growth plate fusion and dwarfism in the model.
- name: Aggrecan-lineage Ihh deletion (Acan-creERT; Ihh floxed) mouse
  species: Mouse
  genotype: Acan-creERT; Ihh(fl/fl), tamoxifen-induced
  publication: PMID:34820473
  description: >-
    Inducible deletion of Ihh from aggrecan-expressing cells. The authors
    present it as a model of human IHH-related chondrodysplasias, including
    ACFD, and used it to test the Smoothened agonist SAG.
  modeled_mechanisms:
  - target: Reduced IHH Signaling Output
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reduced ciliary Smoothened and nuclear Gli1 in Ihh-deficient chondrocytes.
    limitations: >-
      A deletion, not an ACFD missense allele. The Smoothened and Gli1 readouts
      were taken in cultured articular chondrocytes from the mice.
    readouts:
    - name: Ciliary Smoothened and nuclear Gli1 in chondrocytes
      target: Reduced IHH Signaling Output
      direction: DECREASED
      interpretation: Direct pathway-activity readout downstream of Patched.
      evidence:
      - reference: PMID:34820473
        reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Lower levels of Smo in the cilium or Gli1 protein in the nucleus were
          detected in Ihh-deficient chondrocytes than in control chondrocytes.
        explanation: The measured readout and its direction.
    evidence:
    - reference: PMID:34820473
      reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Smoothen agonist (SAG) promoted Hh activity and rescued chondrocyte
        proliferation and differentiation by stimulating smoothened trafficking
        to the cilium in Ihh-silenced cells.
      explanation: >-
        Rescue with a Smoothened agonist shows the defect sits upstream of
        Smoothened, which is where reduced ligand acts.
  - target: Narrow chest
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The mice have short stature, a short spine and a narrow thorax, and die
      of respiratory failure from rib shortening.
    limitations: >-
      Thoracic restriction in the mice is lethal. No ACFD patient has been
      reported with respiratory failure, so the mouse phenotype is more severe
      than the human one.
    evidence:
    - reference: PMID:34820473
      reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The results showed that the phenotype of Ihh-deficient mice (Ihhcko)
        closely mimicked that of humans with Ihh gene mutation-related skeletal
        dysplasia defects, including short stature with short spine and trunk,
        narrow thorax
      explanation: Thoracic and stature phenotype of the model.
discussions:
- discussion_id: acfd_missense_vs_null_models
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced IHH Signaling Output
  - pathophysiology#Biallelic IHH Signaling-Domain Missense Variants
  prompt: >-
    Do the ACFD missense alleles reduce IHH signaling, by how much, and through
    which step (protein stability, secretion, Patched binding or signaling
    range), given that every mechanistic model of the disease is a complete or
    conditional Ihh deletion?
  rationale: >-
    All four ACFD alleles are homozygous missense changes. The only direct
    evidence about what they do is an in silico prediction for p.Ala173Asp.
    The mouse growth plate data come from Ihh-null or conditionally deleted
    animals. Those models recapitulate early growth plate closure and dwarfism,
    but they cannot say whether ACFD alleles are hypomorphs, unstable proteins
    or receptor-binding mutants. They also cannot explain why the phenotype is
    restricted to the skeleton when a null allele disrupts many
    Hedgehog-dependent tissues. The 2003 report placed the ACFD residues
    outside the BDA1 cluster, which suggests a different molecular defect from
    the dominant alleles. BDA1 alleles have been assayed for Patched binding
    and stability; ACFD alleles have not.
  evidence:
  - reference: PMID:40045933
    reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      In silico modeling and dynamic simulation analysis revealed that the
      variant disturbed the core structure of the domain and destabilized the
      loop region and the region surrounding the variant.
    explanation: The only allele-level mechanistic data for ACFD are computational.
  proposed_experiments:
  - experiment_id: exp_acfd_allele_signaling_assays
    name: Cell-based signaling and stability assays of the four ACFD IHH alleles
    description: >-
      Express wild-type and P46L, R160C, A173D and V190A IHH-N in a Hedgehog
      reporter system (for example Gli-luciferase in responsive fibroblasts, or
      chondrogenic differentiation of a mesenchymal line). Measure secretion,
      processing, Patched1 binding and pathway activation side by side with a
      BDA1 allele.
    would_support:
    - pathophysiology#Reduced IHH Signaling Output
    supporting_outcome:
    - >-
      Reduced, but not absent, pathway activation for all four alleles would
      support a hypomorphic mechanism consistent with a recessive,
      skeleton-restricted phenotype.
    would_refute:
    - pathophysiology#Reduced IHH Signaling Output
    refuting_outcome:
    - >-
      Normal signaling in reporter assays would indicate that the alleles act
      through a step the assay does not capture, such as long-range transport
      in cartilage matrix.
- discussion_id: acfd_carrier_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - inheritance#Autosomal Recessive
  prompt: >-
    Do heterozygous carriers of ACFD alleles have short stature or subtle hand
    changes?
  rationale: >-
    Heterozygous IHH variants cause dominant short stature with nonspecific
    skeletal changes, and in the Pakistani ACFD family both carrier parents had
    short stature (-3.0 and -3.6 SD) with normal hands. Carrier heights in the
    other three families are not reported in the available abstracts. If ACFD
    alleles have a heterozygous effect, the disorder would sit on a dosage
    continuum with IHH-related short stature, rather than being strictly
    recessive.
  evidence:
  - reference: PMID:40045933
    reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The height of the father (53 years old) and the mother (45 years old) was
      short, with 155 cm (-3.0SD) and 140.2 cm (-3.6 SD), respectively, but
      their hands were normal, with normal fingers.
    explanation: Short stature in both obligate carriers in one family.
  - reference: PMID:29155992
    reference_title: IHH Gene Mutations Causing Short Stature With Nonspecific Skeletal Abnormalities and Response to Growth Hormone Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identified IHH variants segregate with short stature in a dominant
      inheritance pattern.
    explanation: Heterozygous IHH variants are an established cause of dominant short stature.
notes: >-
  No GeneReviews chapter covers acrocapitofemoral dysplasia (checked with
  `just check-genereviews`). The original clinical delineation (Mortier et
  al. 2003, PMID:12624140) is a letter with no PubMed abstract, so its findings
  are cited here through the 2003 molecular report and the 2021 and 2025 case
  reports that tabulate it. Unilateral ptosis, pes planus and hypertrichosis
  were reported only in the Pakistani siblings and are not curated as ACFD
  phenotypes, because an association with the IHH genotype has not been shown.
  No disease-specific treatment exists. The Smoothened agonist SAG restored
  growth in an Ihh-deficient mouse model (PMID:34820473) but has not been
  given to patients.
references:
- reference: PMID:12624140
  title: "Acrocapitofemoral dysplasia: an autosomal recessive skeletal dysplasia with cone shaped epiphyses in the hands and hips."

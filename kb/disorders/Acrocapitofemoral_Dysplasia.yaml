name: Acrocapitofemoral Dysplasia
creation_date: "2026-09-24T20:42:38Z"
category: Mendelian
description: >-
  Acrocapitofemoral dysplasia (ACFD) is an ultra-rare autosomal recessive
  skeletal dysplasia caused by homozygous missense variants in the
  amino-terminal signaling domain of IHH (Indian hedgehog). It presents with
  postnatal-onset disproportionate short stature with short limbs,
  brachydactyly, a narrow thorax and a relatively large head, with normal
  intelligence. The defining radiographic signs are cone-shaped epiphyses,
  mainly in the hands and hips, and an egg-shaped capital femoral epiphysis on
  a short femoral neck. These are followed by early, prepubertal closure of the
  growth plates, which permanently shortens the tubular bones of the hands and
  the long bones of the limbs. The mechanism is inferred from mouse genetics:
  IHH secreted by prehypertrophic chondrocytes drives chondrocyte proliferation
  and paces hypertrophic differentiation through a PTHrP feedback loop, and
  postnatal loss of chondrocyte IHH disorganizes the growth plate and fuses it
  prematurely. No functional assay of an ACFD allele has been published.
synonyms:
- ACFD
disease_term:
  preferred_term: Acrocapitofemoral Dysplasia
  term:
    id: MONDO:0011907
    label: acrocapitofemoral dysplasia
parents:
- acromelic dysplasia
- osteochondrodysplasia
classifications:
  isds_skeletal_category:
  - classification_value: acromelic_dysplasias
    notes: >-
      Group 17 "Acromelic dysplasias" of the 2023 ISDS Nosology of Genetic
      Skeletal Disorders (Unger et al., PMID:36779427), whose schema enum
      description names acrocapitofemoral dysplasia (IHH) as a member. The
      MONDO parent MONDO:0019695 acromelic dysplasia agrees.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population estimate exists. Four molecularly confirmed families have been
    published: Belgian and Dutch families in 2003, a Turkish sibship in 2021 and
    a Pakistani sibship in 2025. The published patient counts do not agree with
    each other. The 2003 molecular report describes two patients in family 1 and
    three in family 2, while the 2021 and 2025 reports count four children from
    the first two families. A 2025 report of a Syrian child homozygous for an
    IHH variant, with a second homozygous variant in a short-rib thoracic
    dysplasia gene, a heterozygous COL11A1 variant and a blended phenotype
    that includes cardiac anomalies (PMID:40771183), is not counted here as a
    typical case.
  evidence:
  - reference: PMID:40045933
    reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Up till now, only six cases of ACFD have been reported from Belgian, Dutch
      (Mortier et al. 2003; Hellemans et al. 2003), and Turkish families (Cubuk
      and Duz 2021).
    explanation: >-
      Gives the published caseload before the fourth family, which is all the
      occurrence data that exist for this disorder.
  - reference: PMID:34530144
    reference_title: "Acrocapitofemoral dysplasia: Novel mutation in IHH in two adult patients from the third family in the literature and progression of the disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only four child patients from two families have been reported."
    explanation: Caseload before the Turkish family was added.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every reported patient is homozygous for an IHH missense variant, and every
    family is consanguineous or from a founder population. Parents who were
    tested are heterozygous carriers with normal hands. In the Pakistani family
    both carrier parents had short stature (-3.0 and -3.6 SD). Heterozygous IHH
    variants cause brachydactyly type A1 or dominant short stature, so a mild
    carrier phenotype is plausible, but it has not been studied systematically
    (see discussions).
  evidence:
  - reference: PMID:12632327
    reference_title: "Homozygous mutations in IHH cause acrocapitofemoral dysplasia, an autosomal recessive disorder with cone-shaped epiphyses in hands and hips."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both affected individuals of family 1 are homozygous for a 137C-->T
      transition (P46L), and the three patients in family 2 are homozygous for a
      569T-->C transition (V190A).
    explanation: Homozygosity for the causal variant in all affected members of the two founding families.
  - reference: PMID:40045933
    reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The parents were heterozygous carriers, while both affected individuals
      carried the homozygous mutant allele
    explanation: Segregation consistent with autosomal recessive inheritance in the fourth family.
genetic:
- name: IHH
  gene_term:
    preferred_term: IHH
    term:
      id: hgnc:5956
      label: IHH
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Four homozygous missense variants are known, one per family: c.137C>T
    p.(Pro46Leu), c.569T>C p.(Val190Ala), c.478C>T p.(Arg160Cys) and c.518C>A
    p.(Ala173Asp). All lie in the amino-terminal signaling fragment (IHH-N),
    away from the central cluster of residues (codons 95-154) that carries the
    dominant brachydactyly type A1 variants. The 2025 report describes the ACFD
    variants as lying in "amino acids 201-308"; that range does not fit its own
    list of variant positions (46-190) and is not used here.
  evidence:
  - reference: PMID:12632327
    reference_title: "Homozygous mutations in IHH cause acrocapitofemoral dysplasia, an autosomal recessive disorder with cone-shaped epiphyses in hands and hips."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using a candidate-gene approach, we identified two missense mutations in
      the amino-terminal signaling domain of the gene encoding Indian hedgehog
      (IHH).
    explanation: Identifies IHH as the causal gene after linkage to 2q35-q36.
  - reference: PMID:19277064
    reference_title: Brachydactyly A-1 mutations restricted to the central region of the N-terminal active fragment of Indian Hedgehog.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of the BDA1 mutations occur in a restricted area of the N-terminal
      active fragment of the IHH and are in contrast to those mutations causing
      an autosomal recessive acrocapitofemoral dysplasia, whose mutations are
      located at the distal N- and C-terminal regions of IHH-N and are
      physically separated from the BDA1-causing mutations.
    explanation: >-
      Places the recessive ACFD variants at the ends of IHH-N, apart from the
      dominant BDA1 hotspot.
  variants:
  - name: IHH c.137C>T p.(Pro46Leu)
    description: Homozygous in the two affected members of family 1 (2003).
    evidence:
    - reference: PMID:12632327
      reference_title: "Homozygous mutations in IHH cause acrocapitofemoral dysplasia, an autosomal recessive disorder with cone-shaped epiphyses in hands and hips."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both affected individuals of family 1 are homozygous for a 137C-->T
        transition (P46L)
      explanation: Reports the variant and its homozygous state.
  - name: IHH c.569T>C p.(Val190Ala)
    description: Homozygous in the three affected members of family 2 (2003).
    evidence:
    - reference: PMID:12632327
      reference_title: "Homozygous mutations in IHH cause acrocapitofemoral dysplasia, an autosomal recessive disorder with cone-shaped epiphyses in hands and hips."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the three patients in family 2 are homozygous for a 569T-->C transition
        (V190A)
      explanation: Reports the variant and its homozygous state.
  - name: IHH c.478C>T p.(Arg160Cys)
    description: Homozygous in two adult siblings from a Turkish family (2021).
    evidence:
    - reference: PMID:34530144
      reference_title: "Acrocapitofemoral dysplasia: Novel mutation in IHH in two adult patients from the third family in the literature and progression of the disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe two adult patients with ACFD with a novel homozygous
        c.478C>T (p.Arg160Cys) mutation in IHH in the third family of the
        literature.
      explanation: Reports the third ACFD variant.
  - name: IHH c.518C>A p.(Ala173Asp)
    description: >-
      Homozygous in two siblings from a Pakistani family (2025). Classified
      likely pathogenic by the reporting authors under ACMG criteria. In
      silico modeling places Ala173 in the core of the domain.
    evidence:
    - reference: PMID:40045933
      reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This variant caused the substitution of Alanine with Aspartate at amino
        acid position 173 (NP_002172.2: p.(Ala173Asp)) in the IHH protein.
      explanation: >-
        Reports the fourth ACFD variant (c.518C>A in NM_002181.4), found
        homozygous in both affected siblings.
pathophysiology:
- name: Biallelic IHH Signaling-Domain Missense Variants
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Homozygous missense substitutions at conserved residues of the IHH
    amino-terminal signaling fragment, the secreted, lipid-modified part of the
    protein that binds Patched receptors. No truncating ACFD allele has been
    reported.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
  gene:
    preferred_term: IHH
    term:
      id: hgnc:5956
      label: IHH
  evidence:
  - reference: PMID:12632327
    reference_title: "Homozygous mutations in IHH cause acrocapitofemoral dysplasia, an autosomal recessive disorder with cone-shaped epiphyses in hands and hips."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two mutant amino acids are strongly conserved and predicted to be
      located outside the region where brachydactyly type A-1 mutations are
      clustered.
    explanation: Conservation of the mutated residues and their position relative to the BDA1 cluster.
  downstream:
  - target: Reduced IHH Signaling Output
    causal_link_type: DIRECT
    description: >-
      The substitutions are predicted to destabilize the signaling domain and
      lower the amount of active ligand. This is supported by in silico modeling
      of one allele only; no ACFD allele has been tested in a cell-based
      Hedgehog signaling assay.
    evidence:
    - reference: PMID:40045933
      reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: COMPUTATIONAL
      snippet: >-
        This variant is likely to disrupt the essential core structure of the
        protein domain due to the size and charge difference of the wild-type
        and mutant residues, leading to a loss of hydrophobic interactions within
        the core, potentially causing protein folding problems.
      explanation: >-
        Structural modeling and molecular dynamics of p.Ala173Asp predict core
        destabilization. This is a prediction, not a measured loss of signaling.
- name: Reduced IHH Signaling Output
  biological_scale: MOLECULAR
  description: >-
    Less Hedgehog pathway activation in growth plate chondrocytes and
    perichondrium. When IHH binds Patched, Smoothened is released into the
    primary cilium and activates GLI transcription factors; with less IHH, less
    Smoothened reaches the cilium and GLI1 output falls. In ACFD the reduction
    is inferred from genetics and from mouse Ihh loss-of-function models. It
    has not been measured in patient cells.
  biological_processes:
  - preferred_term: Smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: DECREASED
  cell_types:
  - preferred_term: prehypertrophic chondrocyte
    term:
      id: CL:0020022
      label: prehypertrophic chondrocyte
  locations:
  - preferred_term: epiphyseal plate
    term:
      id: UBERON:0002516
      label: epiphyseal plate
  evidence:
  - reference: PMID:34820473
    reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Lower levels of Smo in the cilium or Gli1 protein in the nucleus were
      detected in Ihh-deficient chondrocytes than in control chondrocytes.
    explanation: >-
      Chondrocytes from Acan-creERT;Ihh-floxed mice show reduced ciliary
      Smoothened and nuclear Gli1, the pathway readouts of reduced IHH input.
  - reference: PMID:8662546
    reference_title: Regulation of rate of cartilage differentiation by Indian hedgehog and PTH-related protein.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ihh is expressed in the prehypertrophic chondrocytes of cartilage elements, where it regulates the rate of hypertrophic differentiation."
    explanation: Establishes the prehypertrophic chondrocyte as the IHH source (chick and mouse limb data).
  downstream:
  - target: Reduced Growth Plate Chondrocyte Proliferation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34820473
      reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The results of bromodeoxyuridine (BrdU) staining showed that Ihh
        deletion inhibited chondrocyte proliferation, and this effect was
        rescued by SAG treatment
      explanation: >-
        Deleting Ihh lowers chondrocyte proliferation, and a Smoothened agonist
        restores it. This places the proliferation defect downstream of reduced
        pathway output.
  - target: Accelerated Hypertrophic Differentiation and Loss of Columnar Organization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced IHH-induced PTHrP expression in the periarticular perichondrium
    description: >-
      IHH induces PTHrP, which holds proliferating chondrocytes back from
      hypertrophy. Less IHH weakens this brake. IHH also drives periarticular
      chondrocytes into the columnar zone independently of PTHrP.
    evidence:
    - reference: PMID:8662546
      reference_title: Regulation of rate of cartilage differentiation by Indian hedgehog and PTH-related protein.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        PTHrP mediates the effects of Ihh through the formation of a negative
        feedback loop that modulates the rate of chondrocyte differentiation.
      explanation: >-
        The IHH-PTHrP loop is the known intermediate linking IHH output to
        the rate of hypertrophic differentiation.
    - reference: PMID:15951842
      reference_title: Indian hedgehog stimulates periarticular chondrocyte differentiation to regulate growth plate length independently of PTHrP.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results demonstrate that Ihh acts on periarticular chondrocytes to
        stimulate their differentiation, thereby regulating the columnar cell
        mass independently of PTHrP.
      explanation: Adds the PTHrP-independent route by which IHH sets the size of the columnar zone.
- name: Reduced Growth Plate Chondrocyte Proliferation
  biological_scale: CELLULAR
  description: >-
    Fewer proliferating chondrocytes in the growth plate. The mouse Ihh-null
    and conditional-deletion phenotypes both show this. It reduces the
    cartilage template available for longitudinal growth.
  biological_processes:
  - preferred_term: chondrocyte proliferation
    term:
      id: GO:0035988
      label: chondrocyte proliferation
    modifier: DECREASED
  cell_types:
  - preferred_term: columnar chondrocyte
    term:
      id: CL:0000744
      label: columnar chondrocyte
  evidence:
  - reference: PMID:10465785
    reference_title: Indian hedgehog signaling regulates proliferation and differentiation of chondrocytes and is essential for bone formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutants display markedly reduced chondrocyte proliferation, maturation of
      chondrocytes at inappropriate position, and a failure of osteoblast
      development in endochondral bones.
    explanation: >-
      Ihh-null mouse embryos show reduced chondrocyte proliferation. This is a
      complete null, more severe than the human missense alleles.
  downstream:
  - target: Premature Growth Plate Closure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A smaller proliferative pool, together with faster hypertrophy, exhausts
      the growth plate early.
    evidence:
    - reference: PMID:17409191
      reference_title: Indian Hedgehog produced by postnatal chondrocytes is essential for maintaining a growth plate and trabecular bone.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results demonstrate, for the first time, that postnatal
        chondrocyte-derived Ihh is essential for maintaining the growth plate
        and articular surface and is required for sustaining trabecular bone and
        skeletal growth.
      explanation: Postnatal Ihh deletion shows that IHH is required to maintain the growth plate.
- name: Accelerated Hypertrophic Differentiation and Loss of Columnar Organization
  biological_scale: CELLULAR
  description: >-
    Chondrocytes become hypertrophic too early and in the wrong place, the
    columnar arrangement breaks down, and vascular invasion comes early. The
    ACFD authors proposed this in 2003 as the cause of early growth plate
    closure. The direct evidence comes from postnatal chondrocyte-specific
    Ihh deletion in mice.
  biological_processes:
  - preferred_term: chondrocyte hypertrophy
    term:
      id: GO:0003415
      label: chondrocyte hypertrophy
    modifier: INCREASED
  - preferred_term: growth plate cartilage chondrocyte differentiation
    term:
      id: GO:0003418
      label: growth plate cartilage chondrocyte differentiation
    modifier: ABNORMAL
  cell_types:
  - preferred_term: hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  evidence:
  - reference: PMID:17409191
    reference_title: Indian Hedgehog produced by postnatal chondrocytes is essential for maintaining a growth plate and trabecular bone.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      postnatal deletion of Ihh resulted in loss of columnar structure,
      premature vascular invasion, and formation of ectopic hypertrophic
      chondrocytes in the growth plate
    explanation: Direct histology of the postnatal growth plate after Ihh deletion from chondrocytes.
  - reference: PMID:40045933
    reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Ultimately, the rate of chondrocyte differentiation would have increased,
      causing early growth plate closure and bone shortening, as proposed by
      Hellemans et al. (2003).
    explanation: >-
      The ACFD authors attribute the human phenotype to faster chondrocyte
      differentiation. They restate the 2003 proposal; it is a hypothesis and
      was not measured in patient tissue.
  downstream:
  - target: Premature Growth Plate Closure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17409191
      reference_title: Indian Hedgehog produced by postnatal chondrocytes is essential for maintaining a growth plate and trabecular bone.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, destruction of the articular surface in long bones and
        premature fusion of growth plates of various endochondral bones was
        evident, resulting in dwarfism in mutant mice.
      explanation: In the same mice, the disorganized growth plate goes on to fuse prematurely.
- name: Premature Growth Plate Closure
  biological_scale: TISSUE
  description: >-
    Growth plates close early, before puberty. Epiphyses are cone-shaped while
    they are still open (hands, proximal femur, proximal humerus, distal tibia)
    and are later lost as the plates fuse. In all eight patients tabulated in
    2025, longitudinal growth of the tubular bones of the hands and the long
    bones of the limbs was permanently reduced. Growth of the proximal femur is
    most visibly affected: the capital epiphysis is egg-shaped and the femoral
    neck is very short.
  biological_processes:
  - preferred_term: endochondral bone growth
    term:
      id: GO:0003416
      label: endochondral bone growth
    modifier: DECREASED
  locations:
  - preferred_term: epiphyseal plate
    term:
      id: UBERON:0002516
      label: epiphyseal plate
  - preferred_term: head of femur
    term:
      id: UBERON:0006767
      label: head of femur
  - preferred_term: neck of femur
    term:
      id: UBERON:0007119
      label: neck of femur
  evidence:
  - reference: PMID:40045933
    reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the age difference among the ACFD patients reported to date
      (Table 2), early growth plate closure was evident in all of them, which
      led to the shortening of long tubular bones in the arms and legs, along
      with cone-shaped epiphyses.
    explanation: Early growth plate closure across all published patients.
  - reference: PMID:34820473
    reference_title: SAG therapy restores bone growth and reduces enchondroma incidence in a model of skeletal chondrodysplasias caused by Ihh deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Consistent with our results, postnatal deletion of Ihh with Col2-creERT by
      administration of TM caused premature fusion of growth plates of various
      endochondral bones in mice, resulting in dwarfism in mutant mice.
    explanation: A second group restates the premature-fusion result from postnatal Ihh deletion.
  downstream:
  - target: Premature epimetaphyseal fusion
    causal_link_type: DIRECT
  - target: Cone-shaped epiphyses of the hand phalanges
    causal_link_type: DIRECT
    description: >-
      The cone shape is the radiographic form of an epiphysis that is fusing
      into its metaphysis early.
    evidence:
    - reference: PMID:40045933
      reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        early growth plate closure was evident in all of them, which led to the
        shortening of long tubular bones in the arms and legs, along with
        cone-shaped epiphyses
      explanation: Links early closure to the cone-shaped epiphyses.
  - target: Short middle phalanges
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40045933
      reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        The egg-shaped femoral head with a short femoral neck and shortened
        tubular bones in the hands especially middle phalanges, are due to early
        prepubertal closure of the growth plate (Hellemans et al. 2003).
      explanation: >-
        Restates the 2003 interpretation that early closure is what shortens
        the hand bones and the femoral neck.
  - target: Brachydactyly
    causal_link_type: DIRECT
  - target: Short metacarpals
    causal_link_type: DIRECT
  - target: Short femoral neck
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40045933
      reference_title: A Novel Biallelic Variant in IHH Causing Acrocapitofemoral Dysplasia in a Pakistani Family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        The egg-shaped femoral head with a short femoral neck and shortened
        tubular bones in the hands especially middle phalanges, are due to early
        prepubertal closure of the growth plate
      explanation: Attributes the short femoral neck to early closure of the proximal femoral growth plate.
  - target: Egg-shaped capital femoral epiphysis
    causal_link_type: DIRECT
  - target: Limb undergrowth
    causal_link_type: DIRECT
  - target: Short humerus
    causal_link_type: DIRECT
  - target: Short tibia
    causal_link_type: DIRECT
  - target: Disproportionate short stature
    causal_link_type: DIRECT
  - target: Narrow chest
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A narrow thorax with short ribs follows from reduced endochondral rib
      growth. In the Ihh-deficient mouse, rib shortening restricts the chest

discussions:

- discussion_id: controversy_transcriptional_versus_direct_ubiquitination_route
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Increased RHOBTB2 Protein Abundance
  - pathophysiology#Deregulated Ion Channel Gene Expression
  prompt: >-
    Does accumulated RHOBTB2 deregulate ion channels by changing their transcription, or by
    ubiquitinating the channel proteins directly?
  rationale: >-
    Both accounts explain the same endpoint and neither is excluded. The transcriptional
    account has the more direct evidence - channel genes are enriched among differentially
    expressed genes in two independent systems, a fly overexpression model and an inducible
    human cell line. The direct-substrate account is what RHOBTB2's known biology predicts:
    it is a substrate adaptor for a CUL3 ubiquitin ligase, so acting on channel proteins
    themselves is its native mode of action, and a transcriptional effect would be the
    indirect one for such a protein. What is missing is an identified channel substrate; no
    source available to this entry validates an ion channel as a RHOBTB2-CUL3 target. The
    entry therefore marks the edge from accumulation to channel deregulation
    INDIRECT_UNKNOWN_INTERMEDIATES and tags it to both hypothesis groups rather than
    committing to a route. The distinction is not academic: a transcriptional mechanism
    predicts a delayed, cumulative phenotype amenable to transcriptional intervention, while
    direct ubiquitination predicts a faster, protein-level effect with different therapeutic
    handles.
  proposed_experiments:
  - experiment_id: exp_ubiquitinome_of_accumulated_rhobtb2
    name: Ubiquitinome and channel-protein turnover under RHOBTB2 accumulation
    description: >-
      In neurons expressing a BTB-domain hotspot variant, measure ion channel protein
      half-lives and ubiquitination state alongside their transcript levels. If channel
      protein turnover changes without a matching transcript change, the direct-substrate
      account is supported; if protein changes track transcript changes, the
      transcriptional account is.

- discussion_id: gap_what_the_gtpase_domain_variants_do
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Domain-Specific Divergence of Cellular Consequence
  - pathophysiology#Reduced Sodium-Potassium ATPase Abundance
  prompt: >-
    GTPase-domain variants do not alter excitability yet do reduce Na+/K+-ATPase most
    strongly. What phenotype does that combination produce?
  rationale: >-
    The two lines of evidence sit awkwardly together and the entry does not smooth them.
    In the iPSC system, GTPase-domain missense variants produced no excitability phenotype,
    which is why this entry scopes itself to the BTB-domain disorder. In the inducible cell
    system, the same domain class showed the most prominent loss of Na+/K+-ATPase, an effect
    that would ordinarily be expected to disturb ion homeostasis and hence excitability.
    Either the Na+/K+-ATPase reduction is insufficient on its own to change firing in that
    preparation, or the two systems differ in a way that matters, or the GTPase-domain
    variants cause a different disorder whose phenotype is not the one being measured. The
    founding electrophysiology paper favours the last reading, concluding that other RHOBTB2
    variant classes act by different pathomechanisms. Resolving this determines whether
    GTPase-domain variants belong in a separate entry.
  proposed_experiments:
  - experiment_id: exp_gtpase_variant_ion_homeostasis
    name: Ion homeostasis and excitability in GTPase-domain variant neurons
    description: >-
      Measure Na+/K+-ATPase abundance, intracellular sodium, and firing properties in the
      same GTPase-domain-variant iPSC neurons, rather than in separate systems. If the
      pump loss is reproduced in neurons without an excitability change, the two findings
      are genuinely dissociable and the GTPase arm needs its own mechanistic account.

- discussion_id: gap_dosage_duality_too_little_and_too_much
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Increased RHOBTB2 Protein Abundance
  prompt: >-
    If accumulation causes encephalopathy and loss is reported to permit tumour formation,
    what is the tolerated range of RHOBTB2 abundance, and does it differ by tissue?
  rationale: >-
    RHOBTB2 is unusual in being reported as pathogenic in both directions - accumulation in
    this disorder, loss of function in the tumour-suppressor literature. The neuronal data
    make the asymmetry concrete: complete loss produced no excitability phenotype in iPSC
    neurons, so neurons appear to tolerate absence while not tolerating excess. That is the
    opposite of the tissue sensitivity a simple dosage model would predict if one threshold
    governed both. Any therapeutic strategy aimed at lowering mutant RHOBTB2 needs this
    range, because the floor is set by a different tissue than the ceiling.
  proposed_experiments:
  - experiment_id: exp_graded_rhobtb2_dosage_series
    name: Graded RHOBTB2 abundance series in neurons
    description: >-
      Titrate RHOBTB2 abundance across a range spanning null to several-fold overexpression
      in the same neuronal preparation and map excitability against level, to establish
      where the neuronal phenotype begins and whether it is continuous or thresholded.

notes: >-
  Scope: this entry curates DEE64, the disorder caused by heterozygous missense variants in
  the BTB-domain-encoding region. RHOBTB2 GTPase-domain missense variants and biallelic
  truncating variants are associated with other neurological and neurodevelopmental
  phenotypes that the electrophysiology paper concludes act by different pathomechanisms;
  they are referenced here for contrast and are deliberately not modeled as part of DEE64.
  The deep-research report used to build this entry proposed GO:0004871 for the GTPase-domain
  function; that term is obsolete and was not used. It also advised excluding CL:0000598 on
  the ground that it is "dendritic cell" - the exclusion was right but the reason was not,
  since CL:0000598 is pyramidal neuron. No cell type narrower than neuron is bound here,
  because the iPSC recordings are from mature differentiated neurons without a stated
  cortical subtype.

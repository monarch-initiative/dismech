name: RHOBTB2-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-20T06:45:00Z"
category: Mendelian
synonyms:
- Developmental and epileptic encephalopathy 64
- DEE64
- EIEE64
- RHOBTB2-related neurodevelopmental disorder
description: >-
  RHOBTB2-related developmental and epileptic encephalopathy (DEE64) is caused by
  heterozygous de novo missense variants clustering in the BTB-domain-encoding region of
  RHOBTB2, an atypical Rho GTPase that serves as a substrate-specific adaptor for a
  CUL3-based ubiquitin ligase complex - and that is itself a substrate of that complex.
  The pathogenic variants impair RHOBTB2's own proteasomal turnover, so the mutant protein
  accumulates. The disorder is therefore not a loss of function: complete loss of RHOBTB2
  does not reproduce the electrophysiological phenotype, and neither do missense variants
  in the GTPase domain. Affected individuals have early-onset epilepsy, severe
  intellectual disability, postnatal microcephaly and movement disorders.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 64
  term:
    id: MONDO:0033373
    label: developmental and epileptic encephalopathy, 64
parents:
- Epilepsy
- Neurological Disease
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous and de novo, with several recurrent variants.
  evidence:
  - reference: PMID:29276004
    reference_title: "Missense Variants in RHOBTB2 Cause a Developmental and Epileptic Encephalopathy in Humans, and Altered Levels Cause Neurological Defects in Drosophila."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have now identified de novo missense variants clustering in the
      BTB-domain-encoding region of RHOBTB2 in ten individuals with a similar phenotype,
      including early-onset epilepsy, severe intellectual disability, postnatal
      microcephaly, and movement disorders"
    explanation: >-
      Establishes the de novo heterozygous architecture, the BTB-domain clustering, and the
      core phenotype in the founding ten-patient cohort.

pathophysiology:

- name: RHOBTB2 BTB-Domain Missense Variant
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Variants cluster in the BTB-domain-encoding region, and three
    were already recurrent in the founding cohort. Domain location is not incidental
    detail here - it is what separates this disorder from the other RHOBTB2-related
    phenotypes, because GTPase-domain variants and biallelic truncating variants do not
    produce the same cellular consequence.
  evidence:
  - reference: PMID:29276004
    reference_title: "Missense Variants in RHOBTB2 Cause a Developmental and Epileptic Encephalopathy in Humans, and Altered Levels Cause Neurological Defects in Drosophila."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "de novo missense variants clustering in the BTB-domain-encoding region of
      RHOBTB2 in ten individuals with a similar phenotype"
    explanation: >-
      Locates the pathogenic variants to the BTB-domain-encoding region.
  downstream:
  - target: Impaired Proteasomal Degradation of RHOBTB2
    causal_link_type: DIRECT
    description: >-
      The variant acts first on the protein's own turnover.

- name: Impaired Proteasomal Degradation of RHOBTB2
  biological_scale: MOLECULAR
  description: >-
    RHOBTB2 binds the CUL3 ubiquitin ligase scaffold through its first BTB domain and is
    itself a substrate of that complex, so a BTB-domain variant disrupts the protein's own
    destruction rather than only its adaptor function. This node is the turnover defect;
    the resulting abundance change is curated separately below because they are measured
    separately and, in the GTPase-domain variants, they come apart.
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  cellular_components:
  - preferred_term: cullin-RING ubiquitin ligase complex
    term:
      id: GO:0031461
      label: cullin-RING ubiquitin ligase complex
  evidence:
  - reference: PMID:15107402
    reference_title: "RhoBTB2 is a substrate of the mammalian Cul3 ubiquitin ligase complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that RhoBTB2 binds to the ubiquitin ligase scaffold, Cul3, via
      its first BTB domain and show in vitro and in vivo that RhoBTB2 is a substrate for a
      Cul3-based ubiquitin ligase complex"
    explanation: >-
      Establishes the baseline biology this disorder subverts - RHOBTB2 is both adaptor and
      substrate, and the BTB domain is the CUL3-binding interface.
  - reference: PMID:15107402
    reference_title: "RhoBTB2 is a substrate of the mammalian Cul3 ubiquitin ligase complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that a RhoBTB2 missense mutant identified in a lung cancer cell line
      is neither able to bind Cul3 nor is it regulated by the ubiquitin/proteasome system,
      resulting in increased RhoBTB2 protein levels in vivo"
    explanation: >-
      Prior demonstration, in a cancer-derived allele, that a missense change can uncouple
      RHOBTB2 from its own degradation and raise its abundance - the same logic the DEE64
      variants follow.
  downstream:
  - target: Increased RHOBTB2 Protein Abundance
    causal_link_type: DIRECT
    description: >-
      Reduced turnover raises the steady-state pool.

- name: Increased RHOBTB2 Protein Abundance
  biological_scale: MOLECULAR
  description: >-
    Mutant RHOBTB2 accumulates above wild-type levels. This is the node that makes the
    disorder a gain rather than a loss, and it is the reason a knockout is not a model of
    it. Later work adds subcellular detail: hotspot mutants accumulate specifically in the
    nucleus and mitochondria, and GTPase-domain mutants do not accumulate at all.
  evidence:
  - reference: PMID:29276004
    reference_title: "Missense Variants in RHOBTB2 Cause a Developmental and Epileptic Encephalopathy in Humans, and Altered Levels Cause Neurological Defects in Drosophila."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon transfection of HEK293 cells, we found that mutant RHOBTB2 was more
      abundant than the wild-type, most likely because of impaired degradation in the
      proteasome"
    explanation: >-
      The abundance measurement and its proposed cause, in the founding study.
  - reference: PMID:41478322
    reference_title: "Mutant-specific dysfunction of RHOBTB2 impairs mitochondrial function and Na(+)/K(+)-ATPase levels in a cell model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "GTPase-domain mutants such as D92H and W217C showed no significant difference
      in RHOBTB2 protein levels compared with WT, while hotspot mutants (R461H, R485C,
      R489Q) exhibited increased RHOBTB2 protein levels with nuclear and mitochondrial
      accumulation"
    explanation: >-
      Separates the two variant classes by abundance and adds the subcellular localisation
      of the accumulated protein. Residue numbering follows the cited publication.
  downstream:
  - target: Deregulated Ion Channel Gene Expression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The route from accumulated RHOBTB2 to channel deregulation is not established - see
      the competing-hypotheses discussion.
    hypothesis_groups:
    - transcriptional_deregulation_model
    - direct_substrate_ubiquitination_model

- name: Deregulated Ion Channel Gene Expression
  biological_scale: CELLULAR
  description: >-
    Transcriptomic work in flies overexpressing RhoBTB found ion channel genes enriched
    among the differentially expressed set, and the enriched molecular functions among
    downregulated genes are receptor, channel and transporter activities. An independent
    inducible cell model found the R489Q hotspot mutant robustly downregulates
    ion-channel-related genes.
  notes: >-
    Term binding: the measurement here is on ion-channel gene EXPRESSION, not on transporter
    activity, so the node binds GO:0010468 regulation of gene expression with a more specific
    free-text preferred_term. The obvious ion-channel-flavoured alternatives do not work.
    GO:0032413 is negative regulation of ion transmembrane transporter activity, whose baked-in
    direction contradicts a DYSREGULATED modifier and whose subject is activity rather than
    expression; its non-directional parent GO:0032412 is obsolete. There is no GO term for
    regulation of ion-channel gene expression specifically, so the specificity is carried by
    preferred_term rather than by a worse-fitting bound term.
  biological_processes:
  - preferred_term: regulation of ion channel gene expression
    modifier: DYSREGULATED
    term:
      id: GO:0010468
      label: regulation of gene expression
  evidence:
  - reference: PMID:39849855
    reference_title: "Deregulated ion channels contribute to RHOBTB2-associated developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We now found enrichment for ion channels among the differentially expressed
      genes from RNA-Seq on fly heads overexpressing RhoBTB"
    explanation: >-
      The transcriptomic finding that first implicated channel deregulation.
  - reference: PMID:39849855
    reference_title: "Deregulated ion channels contribute to RHOBTB2-associated developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "All significantly enriched molecular functions among the downregulated genes
      are linked to neurotransmitter receptor activity, ion channel activity or
      transmembrane transporter activity"
    explanation: >-
      Records that the deregulation is directional and concentrated in exactly the gene
      classes that set excitability.
  - reference: PMID:41478322
    reference_title: "Mutant-specific dysfunction of RHOBTB2 impairs mitochondrial function and Na(+)/K(+)-ATPase levels in a cell model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "induction of the R489Q mutant caused a robust downregulation of ion
      channel-related genes, supporting its potential role in disrupting neuronal
      excitability"
    explanation: >-
      Independent replication of channel-gene downregulation in a human cell model with an
      inducible hotspot mutant.
  downstream:
  - target: Altered Neuronal Excitability
    causal_link_type: DIRECT
    description: >-
      Changed channel complement alters the firing properties of the neuron.

- name: Altered Neuronal Excitability
  biological_scale: CELLULAR
  description: >-
    Patch-clamp recordings from human iPSC-derived neurons show increased action potential
    firing frequency at all current injections, increased AP half width, and decreased
    depolarization speed. The direction is curated as measured rather than summarised as
    "hyperexcitability", because the three parameters do not all point the same way - the
    cell fires more often but each spike is broader and rises more slowly.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:39849855
    reference_title: "Deregulated ion channels contribute to RHOBTB2-associated developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Neurons with variants in the BTB domain region show increased AP firing
      frequency compared to the wildtype (WT)"
    explanation: >-
      The firing-rate measurement in patient-variant human neurons.
  - reference: PMID:39849855
    reference_title: "Deregulated ion channels contribute to RHOBTB2-associated developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "neurons with variants in the BTB domain region present with decreased
      depolarization speed (G) and increased AP half width (F)"
    explanation: >-
      The two waveform parameters, which move in the opposite direction to what a simple
      hyperexcitability account would predict and are therefore recorded explicitly.
  downstream:
  - target: Seizures and Developmental Encephalopathy
    causal_link_type: DIRECT
    description: >-
      Altered excitability is the proposed cellular substrate for the clinical phenotype.

- name: Domain-Specific Divergence of Cellular Consequence
  biological_scale: MOLECULAR
  description: >-
    A negative-result node, curated because it carries more weight than most positive ones
    here. In the same iPSC system, GTPase-domain missense variants and complete loss of
    RHOBTB2 produced no excitability phenotype, while BTB-domain variants did. This
    excludes haploinsufficiency as the mechanism of DEE64 and is what makes the
    accumulation account the operative one.
  evidence:
  - reference: PMID:39849855
    reference_title: "Deregulated ion channels contribute to RHOBTB2-associated developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This revealed significantly altered neuronal activity and excitability
      resulting from BTB domain variants but not from GTPase domain variants or upon
      complete loss of RHOBTB2"
    explanation: >-
      The three-way dissociation in a single experimental system. The "not upon complete
      loss" clause is the part that rules out haploinsufficiency.
  - reference: PMID:39849855
    reference_title: "Deregulated ion channels contribute to RHOBTB2-associated developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "suggests different pathomechanisms for other RHOBTB2-related neurological and
      neurodevelopmental phenotypes associated with missense variants in the GTPase domain
      or bi-allelic truncating variants"
    explanation: >-
      The authors' own conclusion that the other RHOBTB2 variant classes act by different
      mechanisms, which is why this entry scopes itself to the BTB-domain disorder.

- name: Reduced Sodium-Potassium ATPase Abundance
  biological_scale: MOLECULAR
  description: >-
    A separate molecular arm, and the one that complicates the tidy BTB-versus-GTPase
    story. Mutant RHOBTB2 lowers Na+/K+-ATPase protein through a lysosome-dependent route,
    and the effect is most prominent in the GTPase-domain mutants - the same class that
    shows no excitability phenotype. Curated as its own node rather than folded into the
    excitability chain, because it is a distinct measurement in a different variant class.
  evidence:
  - reference: PMID:41478322
    reference_title: "Mutant-specific dysfunction of RHOBTB2 impairs mitochondrial function and Na(+)/K(+)-ATPase levels in a cell model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "expression of mutant RHOBTB2 led to a reduction in Na+/K+-ATPase protein
      levels via a lysosome-dependent degradation pathway"
    explanation: >-
      Establishes the effect and the degradation route, which is lysosomal rather than
      proteasomal - a different pathway from the one that handles RHOBTB2 itself.
  - reference: PMID:41478322
    reference_title: "Mutant-specific dysfunction of RHOBTB2 impairs mitochondrial function and Na(+)/K(+)-ATPase levels in a cell model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This effect was particularly prominent in GTPase-domain mutants (D92H and
      W217C), suggesting a mechanistic link between mutant RHOBTB2 and impaired ion
      homeostasis"
    explanation: >-
      Locates the effect predominantly in the variant class that does not alter
      excitability, which is why this arm is not drawn into the BTB excitability chain.

- name: Impaired Mitochondrial Respiration
  biological_scale: CELLULAR
  description: >-
    Mitochondrial respiration is impaired by some mutants and not others, cutting across
    the domain boundary: one hotspot mutant and one GTPase-domain mutant, but not the rest.
    Curated because the accumulated hotspot protein localises to mitochondria, which makes
    a mitochondrial consequence mechanistically plausible rather than incidental.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:41478322
    reference_title: "Mutant-specific dysfunction of RHOBTB2 impairs mitochondrial function and Na(+)/K(+)-ATPase levels in a cell model."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "the R489Q and W217C mutants impaired mitochondrial respiration, whereas other
      mutants did not show detectable mitochondrial dysfunction"
    explanation: >-
      Curated PARTIAL because the finding holds for two of the mutants tested and
      explicitly not for the others, so it is a variant-specific rather than a
      disease-general mechanism.

- name: Seizures and Developmental Encephalopathy
  biological_scale: ORGANISM
  description: >-
    The clinical syndrome - early-onset epilepsy with severe intellectual disability,
    postnatal microcephaly and movement disorders.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  evidence:
  - reference: PMID:29276004
    reference_title: "Missense Variants in RHOBTB2 Cause a Developmental and Epileptic Encephalopathy in Humans, and Altered Levels Cause Neurological Defects in Drosophila."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ten individuals with a similar phenotype, including early-onset epilepsy,
      severe intellectual disability, postnatal microcephaly, and movement disorders"
    explanation: >-
      The clinical phenotype as defined in the founding cohort.

mechanistic_hypotheses:
- hypothesis_group_id: transcriptional_deregulation_model
  status: CANONICAL
  description: >-
    Accumulated RHOBTB2 indirectly dysregulates transcription of ion channel and receptor
    genes, and the resulting change in channel complement alters excitability. This is the
    account the transcriptomic data most directly support, in both the fly overexpression
    model and the inducible human cell model.
  evidence:
  - reference: PMID:39849855
    reference_title: "Deregulated ion channels contribute to RHOBTB2-associated developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We now found enrichment for ion channels among the differentially expressed
      genes from RNA-Seq on fly heads overexpressing RhoBTB"
    explanation: >-
      Transcriptomic evidence for channel-gene deregulation downstream of excess RhoBTB.

- hypothesis_group_id: direct_substrate_ubiquitination_model
  status: ALTERNATIVE
  description: >-
    RHOBTB2, or the RHOBTB2-CUL3 complex, ubiquitinates ion channels or their regulators
    directly, so impaired turnover or mistargeting of the channel proteins themselves
    drives the excitability change without requiring a transcriptional step. RHOBTB2 is a
    substrate adaptor by function, so this is the mechanism its known biology would
    predict. It is currently the less directly evidenced of the two: no source available to
    this entry identifies an ion channel as a validated RHOBTB2-CUL3 substrate.
  evidence:
  - reference: PMID:15107402
    reference_title: "RhoBTB2 is a substrate of the mammalian Cul3 ubiquitin ligase complex."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "RhoBTB2 binds to the ubiquitin ligase scaffold, Cul3, via its first BTB
      domain"
    explanation: >-
      Supports the premise that RHOBTB2 operates as a CUL3 adaptor, which is what makes
      direct substrate ubiquitination a live hypothesis. Curated PARTIAL because it
      establishes the capability, not that any channel is such a substrate.


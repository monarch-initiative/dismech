  description: >-
    The primary diagnostic modality. Every reported case has been ascertained molecularly,
    and the trio design is what establishes the de novo status that the variant
    interpretation depends on - a heterozygous missense variant in RHOBTB2 is only
    interpretable as causative once both parents are shown not to carry it.
  diagnosis_term:

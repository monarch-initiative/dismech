treatments:
- name: Antiseizure Medication
  description: >-
    Management is symptomatic, with antiseizure drugs the mainstay. Response is genuinely
    variable rather than uniformly poor: 4 of the 7 patients with epilepsy in the
    movement-disorder series achieved seizure freedom, one infant remained seizure-free on
    oral sodium valproate over three months of follow-up, and valproate, carbamazepine and
    pyridoxine are each reported to work well in some patients - while another patient
    retained only partial control on triple therapy. No agent has disease-specific efficacy
    evidence, and no trial exists, so the agents named here are those reported to have
    helped rather than a recommended sequence.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  evidence:
  - reference: PMID:39831600
    reference_title: "RHOBTB2 Variant p.Arg511Gln Causes Developmental and Epileptic Encephalopathy Type 64 in an Infant: A Case Report and Hotspot Variant Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The treatment of epilepsy-related encephalopathy associated with RHOBTB2
      variants primarily relies on symptomatic treatment, with antiepileptic drugs (AEDs)
      being the mainstay"
    explanation: >-
      Establishes that management is symptomatic and drug-based.
  - reference: PMID:39831600
    reference_title: "RHOBTB2 Variant p.Arg511Gln Causes Developmental and Epileptic Encephalopathy Type 64 in an Infant: A Case Report and Hotspot Variant Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some patients respond well to valproate, carbamazepine, and pyridoxine"
    explanation: >-
      Names the three agents bound as therapeutic_agent, and is the basis for describing the
      response as variable rather than uniformly partial.
  - reference: PMID:39831600
    reference_title: "RHOBTB2 Variant p.Arg511Gln Causes Developmental and Epileptic Encephalopathy Type 64 in an Infant: A Case Report and Hotspot Variant Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with oral sodium valproate was initiated, and the patient
      remained seizure‐free during follow‐up"
    explanation: >-
      A single-patient success on valproate monotherapy, quoted through the operative word.
      The source's hyphens are U+2010 and are reproduced here. The quote stops before "over
      3 months" only because the source separates the numeral from the unit with a thin
      space (U+2009), which does not survive transcription.
  - reference: PMID:33504645
    reference_title: "RHOBTB2 Mutations Expand the Phenotypic Spectrum of Alternating Hemiplegia of Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven patients had epilepsy, but of these, 4 patients achieved seizure
      freedom"
    explanation: >-
      The cohort-level counterexample to a uniformly drug-resistant reading: a majority of
      the patients with epilepsy in this series became seizure-free.
  - reference: PMID:35315256
    reference_title: "Developmental and epileptic encephalopathy related to a heterozygous variant of the RHOBTB2 gene: A case report from French Guiana."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "she is under a triple antiepileptic medication with partial control of her
      epileptic seizures"
    explanation: >-
      Curated PARTIAL: the other side of the variability, a patient retaining only partial
      control on triple therapy.
  notes: >-
    An earlier draft of this entry described patients as achieving "at best partial control
    on multi-drug regimens". That was contradicted by the entry's own cited sources and has
    been corrected: seizure freedom is reported both at cohort level (4 of 7) and in a
    single-patient report on valproate monotherapy. The drug-resistant-epilepsy phenotype
    curated above remains accurate for the patients in whom it is reported; the two coexist
    because response varies across the reported population, and neither generalizes.
    The accumulation mechanism suggests lowering mutant protein abundance as a rational
    target, but no such approach has been tested, and the dosage discussion records why the
    therapeutic window is not yet defined.


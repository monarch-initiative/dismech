genetic:
- name: RHOBTB2
  gene_term:
    preferred_term: RHOBTB2
    term:
      id: hgnc:18756
      label: RHOBTB2
  relationship_type: CAUSATIVE
  association: >-
    Heterozygous de novo missense variants in the BTB-domain-encoding region of RHOBTB2
    cause DEE64 by impairing the protein's own proteasomal degradation, so that mutant
    RHOBTB2 accumulates. The variant spectrum is dominated by two arginine hotspots within
    the BTB domain, Arg483 and Arg511, which together account for roughly half of the ~30
    reported variants across ~60 reported cases; p.Arg511Gln, p.Arg483His and p.Arg511Trp
    each individually exceed a 10 percent incidence rate. Both hotspot residues are
    non-conserved across species, which is one reason the mechanism could not be read off
    conservation alone.
  evidence:
  - reference: PMID:29276004
    reference_title: "Missense Variants in RHOBTB2 Cause a Developmental and Epileptic Encephalopathy in Humans, and Altered Levels Cause Neurological Defects in Drosophila."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have established missense variants in the BTB-domain-encoding region of
      RHOBTB2 as causative for a developmental and epileptic encephalopathy"
    explanation: >-
      The gene-disease assertion, scoped to the BTB-domain-encoding region.
  - reference: PMID:39831600
    reference_title: "RHOBTB2 Variant p.Arg511Gln Causes Developmental and Epileptic Encephalopathy Type 64 in an Infant: A Case Report and Hotspot Variant Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than half of the variants are located at Arg483 and Arg511 within the BTB
      domain; however, the underlying mechanism of action of these hotspot variants remains
      unexplored"
    explanation: >-
      Locates the two hotspot residues and quantifies their share of the variant spectrum.
      The second clause is quoted deliberately: the source itself records that the hotspot
      mechanism is unexplained, which is the same gap this entry's discussions describe.
  - reference: PMID:39831600
    reference_title: "RHOBTB2 Variant p.Arg511Gln Causes Developmental and Epileptic Encephalopathy Type 64 in an Infant: A Case Report and Hotspot Variant Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 60 cases of DEE patients with RHOBTB2 variants have been reported,
      with approximately 50% of variants located at Arg483 and Arg511"
    explanation: >-
      Gives the reported case count alongside the hotspot share.
  - reference: PMID:39831600
    reference_title: "RHOBTB2 Variant p.Arg511Gln Causes Developmental and Epileptic Encephalopathy Type 64 in an Infant: A Case Report and Hotspot Variant Analysis."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "We screened 10 recurrent RHOBTB2 variants, and homology analysis revealed
      that Arg483, Arg507, and Arg511 are non‐conserved residues"
    explanation: >-
      Curated COMPUTATIONAL because this is a sequence homology analysis. The source's
      hyphen is U+2010 and is reproduced here rather than the quote being cut short of it.
  notes: >-
    Variant residue numbering differs between publications - the founding cohort and the
    2026 inducible-cell study use different numbering for the hotspot residues - and each
    is quoted here as published rather than reconciled to one convention, since no source
    available to this entry states the mapping.
    RHOBTB2 has a separate identity as a candidate tumour suppressor, where loss of
    function rather than accumulation is the disease-relevant direction. That literature is
    not curated here, but it is the reason the dosage argument in the discussions matters:
    the same gene is reported to be pathogenic when there is too little of it and when
    there is too much.


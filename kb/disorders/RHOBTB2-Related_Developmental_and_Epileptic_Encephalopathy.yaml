  notes: >-
    Deliberately left without an exposure_term. ECTO was searched: its temperature terms
    (e.g. ECTO:1000007 exposure to high temperature environment) describe exposure to a hot
    environment, whereas the source says only "hyperthermia" without specifying whether the
    raised temperature was febrile or environmental. Binding an environmental-heat term
    would assert a route the source does not report, and no term is better than a wrong one.


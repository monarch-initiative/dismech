environmental:
- name: Hyperthermia
  description: >-
    Hyperthermia is reported as a trigger for acute encephalopathy and epileptic seizures in
    at least five patients. It does not cause the disorder - that is entirely genetic - but
    it precipitates acute decompensation on top of it, which is what makes it worth
    recording as an exposure acting on a mechanism rather than as a phenotype.
  influences_mechanisms:
  - target: Seizures and Developmental Encephalopathy
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Precipitates acute encephalopathy and seizures in an already-susceptible brain. How
      raised temperature interacts with the accumulated-protein mechanism is not established
      by any source available to this entry, hence the unknown intermediates.
    evidence:
    - reference: PMID:35315256
      reference_title: "Developmental and epileptic encephalopathy related to a heterozygous variant of the RHOBTB2 gene: A case report from French Guiana."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "At least five patients were reported to have acute encephalopathy and
        epileptic seizures triggered by hyperthermia or head trauma"

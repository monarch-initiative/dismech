    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When B. procyonis eggs are ingested by a paratenic host, such as a mouse
      or human, and the L3 larvae are released, the larvae penetrate the
      intestinal wall and migrate through the bloodstream
    explanation: >-
      The B. procyonis life-cycle review states that L3 larvae released in
      paratenic hosts penetrate the gut wall and enter the bloodstream.
- name: Hematogenous Somatic Larval Migration
  biological_scale: ORGANISM
  description: >-
    Third-stage larvae migrate through the bloodstream and disseminate to
    somatic tissues. Migration to the CNS or eye is accidental rather than
    directed neurotropism, but it is the branch that drives the most important
    clinical disease.
  downstream:
  - target: CNS Larval Invasion
    causal_link_type: DIRECT

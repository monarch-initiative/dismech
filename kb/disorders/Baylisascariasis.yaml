    preferred_term: Baylisascaris serology
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  description: >-
    Recombinant BpRAG1 immunoblot on serum, and sometimes CSF, is a key
    noninvasive diagnostic method for suspected neural or ocular
    Baylisascariasis when interpreted with clinical and exposure findings.
  evidence:
  - reference: PMID:40671903
    reference_title: "Human infections with the raccoon roundworm, Baylisascaris procyonis: A scoping review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Serological testing results were reported for 36 individuals, 32 (89%)
      with neurological disease (with or without concurrent ocular disease) and
      4 (11%) with solely ocular disease. All were positive.
    explanation: >-
      The scoping review supports serology as the commonly reported diagnostic
      test in published neural and ocular cases.

name: Baylisascariasis
creation_date: '2026-11-14T09:01:04Z'
synonyms:
- raccoon roundworm infection
- Baylisascaris larva migrans
category: Infectious Disease
description: >-
  Baylisascariasis is a zoonotic Ascaridida nematode infection caused by the
  raccoon roundworm Baylisascaris procyonis. Raccoons are the definitive host
  and shed thick-shelled eggs in feces, often at latrines; eggs embryonate in
  the environment and remain viable for years. Humans are accidental paratenic
  hosts after ingesting embryonated eggs from raccoon feces or fecally
  contaminated soil. Larvae hatch, penetrate the intestinal wall, and migrate
  hematogenously through tissues; accidental entry into the central nervous
  system or eye causes severe neural larva migrans with eosinophilic
  meningoencephalitis or ocular larva migrans, often presenting as diffuse
  unilateral subacute neuroretinitis.
disease_term:
  preferred_term: Baylisascariasis
  term:
    id: MONDO:0000297
    label: baylisascariasis
parents:
- Ascaridida infectious disease
infectious_agent:
- name: Baylisascaris procyonis
  infectious_agent_term:
    preferred_term: Baylisascaris procyonis
    term:
      id: NCBITaxon:6259
      label: Baylisascaris procyonis
  description: >-
    Raccoon roundworm nematode in the family Ascarididae. B. procyonis normally
    matures in raccoons but produces severe neural, ocular, and visceral larva
    migrans after infective eggs are ingested by humans or other nondefinitive
    paratenic hosts.
  evidence:
  - reference: PMID:26960940
    reference_title: "Update on Baylisascariasis, a Highly Pathogenic Zoonotic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Baylisascaris procyonis, the raccoon roundworm, infects a wide range of
      vertebrate animals, including humans, in which it causes a particularly
      severe type of larva migrans.
    explanation: >-
      The review identifies B. procyonis as the raccoon roundworm and as the
      Baylisascariasis agent responsible for severe human larva migrans.
  - reference: PMID:16223954
    reference_title: Baylisascariasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Baylisascariasis in humans is caused by infection with the nematode
      parasite Baylisascaris procyonis.
    explanation: >-
      The earlier clinical-microbiology review directly names B. procyonis as
      the causative nematode in humans.
agent_life_cycle:
  description: >-
    B. procyonis has a direct raccoon cycle and an indirect predator-prey cycle.
    Adult worms inhabit the small intestine of raccoons; females shed eggs into
    feces, eggs embryonate to infective third-stage larvae in the environment,
    and young raccoons can acquire infection directly by ingesting eggs. Humans
    and small vertebrates are paratenic hosts in which released larvae penetrate
    the intestine and migrate through somatic tissues rather than maturing to
    adults. Raccoons can then regain the parasite by eating infected paratenic
    hosts.
  hosts:
  - preferred_term: raccoon
    term:
      id: NCBITaxon:9654
      label: Procyon lotor
    role: definitive host
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: accidental paratenic host
    description: >-
      Larvae migrate through human tissues after egg ingestion, but people do
      not support adult intestinal worm development or onward egg shedding.
  life_cycle_stages:
  - name: Embryonated egg
    description: >-
      Thick-shelled eggs are shed in raccoon feces and become infective in
      contaminated soil, latrines, rooftops, decks, woodpiles, or other
      peridomestic sites after the first-stage larva develops into an infective
      third-stage larva inside the egg.
    evidence:
    - reference: PMID:40742893
      reference_title: "Baylisascariasis (Raccoon Roundworm Infection) in Two Unrelated Children - Los Angeles County, California, 2024."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        Raccoons, the primary definitive host of B. procyonis, can shed millions
        of roundworm eggs in their feces every day. Eggs become infective after
        2–4 weeks in the environment and can survive for years.
      explanation: >-
        The MMWR background summarizes raccoon egg shedding, environmental
        embryonation, and long-term viability.
  - name: Somatic third-stage larva
    life_cycle_stage_term:
      preferred_term: parasitic worm stage
      term:
        id: OPL:0000082
        label: parasitic worm stage
    description: >-
      After embryonated eggs hatch in a paratenic host, third-stage larvae
      penetrate the intestine, migrate through blood to the viscera, CNS, and
      eyes, and may become encapsulated in granulomas rather than molting into
      intestinal adult worms.
    evidence:
    - reference: PMID:26960940
      reference_title: "Update on Baylisascariasis, a Highly Pathogenic Zoonotic Infection."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        When B. procyonis eggs are ingested by a paratenic host, such as a
        mouse or human, and the L3 larvae are released, the larvae penetrate the
        intestinal wall and migrate through the bloodstream to reach other
        organs and tissues, including the CNS and eyes
      explanation: >-
        The life-cycle section describes L3 larvae as the tissue-migrating stage
        in paratenic hosts and identifies the CNS and eyes as destinations.
  evidence:
  - reference: PMID:26960940
    reference_title: "Update on Baylisascariasis, a Highly Pathogenic Zoonotic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The direct (monoxenous) life cycle involves only raccoons (Procyon lotor)
      as well-adapted definitive hosts, and infection is achieved via the
      ingestion of embryonated eggs from the environment.
    explanation: >-
      Supports raccoons as definitive hosts infected directly by environmental
      embryonated eggs.
  - reference: PMID:26960940
    reference_title: "Update on Baylisascariasis, a Highly Pathogenic Zoonotic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Raccoons are well-adapted hosts for B. procyonis—they exhibit a high
      susceptibility to infection, and they release a significant number of eggs
      into the environment each day, typically at latrines
    explanation: >-
      Establishes raccoons as the egg-shedding reservoir host and latrines as a
      focal environmental contamination site.
transmission:
- name: Embryonated egg ingestion from raccoon fecal contamination
  description: >-
    Humans acquire B. procyonis by accidentally ingesting infective eggs from
    raccoon latrines, raccoon feces, or soil and fomites contaminated with
    raccoon feces.
  evidence:
  - reference: PMID:16223954
    reference_title: Baylisascariasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Humans become infected by accidentally ingesting infective B. procyonis
      eggs from raccoon latrines or articles contaminated with their feces.
    explanation: >-
      The review defines accidental ingestion of infective eggs from raccoon
      latrines or contaminated articles as the human transmission route.
  - reference: PMID:40742893
    reference_title: "Baylisascariasis (Raccoon Roundworm Infection) in Two Unrelated Children - Los Angeles County, California, 2024."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Epidemiologic investigations identified raccoon feces that had fallen from
      a rooftop latrine (i.e., a communal raccoon defecation site) as the
      possible source of exposure for the adolescent.
    explanation: >-
      A 2024 pediatric case investigation traced one plausible exposure to a
      rooftop raccoon latrine contaminating a household entrance.
epidemiology:
- name: Pica or geophagia near raccoon latrines
  description: >-
    The classic high-risk group is infants and young children, especially those
    with pica, geophagia, developmental disability, or direct access to raccoon
    latrines and raccoon-contaminated soil around homes and play areas.
  factors:
  - raccoon latrines
  - raccoon feces
  - pica
  - geophagia
  - developmental disability
  evidence:
  - reference: PMID:40671903
    reference_title: "Human infections with the raccoon roundworm, Baylisascaris procyonis: A scoping review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pica or geophagia were reported to have been observed before the onset of
      disease for 12 individuals, 8 (75%) of whom were under the age of 5.
    explanation: >-
      The 2025 scoping review summarizes reported pica and geophagia in the
      published human case literature.
  - reference: PMID:40671903
    reference_title: "Human infections with the raccoon roundworm, Baylisascaris procyonis: A scoping review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The presence of raccoon latrines on the property was linked to 4
      infections.
    explanation: >-
      The scoping review supports raccoon latrines near human habitats as a
      recognized exposure source in reported cases.
prevalence:
- population: Published human infections through 2025
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    A 2025 scoping review identified 60 published human infections. The review
    cannot estimate population prevalence or the relative frequency of neural
    versus ocular disease because it is limited to published diagnosed cases,
    but it documents the severe reported spectrum: most cases had neurological
    disease, reported neurological outcomes included death or residual deficits
    in most patients, and most ocular-only cases with reported outcomes had
    permanent vision loss.
  evidence:
  - reference: PMID:40671903
    reference_title: "Human infections with the raccoon roundworm, Baylisascaris procyonis: A scoping review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Sixty infections were identified. Most (38, 75%) were in males and the
      median age was 2.9 y (range: 9 mo to 73 y). Forty-seven (78%)
      individuals had neurological disease (9 with concurrent ocular disease),
      11 had ocular disease alone, 1 had eosinophilic cardiac pseudotumor, and 1
      was an incidental autopsy finding.
    explanation: >-
      Gives the total published human infection count and major clinical
      categories in the scoping review.
  - reference: PMID:40671903
    reference_title: "Human infections with the raccoon roundworm, Baylisascaris procyonis: A scoping review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Outcomes were reported for 42 individuals with neurological disease: 8
      (19%) died, 4 (10%) fully recovered, and the remaining 30 (71%) had mild
      to significant neurological residual deficits.
    explanation: >-
      Summarizes the severe outcomes reported for neural larva migrans cases in
      the scoping review.
progression:
- phase: Environmental Exposure and Larval Migration
  notes: >-
    After egg ingestion, released larvae penetrate the intestinal wall and
    disseminate through blood to tissues. Humans are accidental paratenic hosts,
    so disease is caused by migrating larvae and the inflammatory response to
    them rather than adult intestinal egg shedding.
  evidence:
  - reference: PMID:40671903
    reference_title: "Human infections with the raccoon roundworm, Baylisascaris procyonis: A scoping review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      ingestion of infectious eggs in some non-reservoir species (e.g., humans)
      can also result in larva migrans, in which larvae migrate throughout the
      body, with disease developing in response to damage from the migrating
      larvae and resulting immune response.
    explanation: >-
      Defines human disease as larva migrans caused by tissue migration after
      infectious egg ingestion.
- phase: Neural or Ocular Larva Migrans
  notes: >-
    Larvae can accidentally reach the CNS or retina. Neural larva migrans
    presents as severe eosinophilic meningoencephalitis, whereas ocular larva
    migrans often manifests as diffuse unilateral subacute neuroretinitis.
  evidence:
  - reference: PMID:23829916
    reference_title: Baylisascaris larva migrans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Migration of the larvae of this parasite is recognized as a cause of
      clinical neural larva migrans (NLM) in humans, primarily children.
    explanation: >-
      Identifies Baylisascaris larval migration as the cause of human neural
      larva migrans.
  - reference: PMID:23829916
    reference_title: Baylisascaris larva migrans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This parasite can also cause ocular larva migrans (OLM) which usually
      presents as diffuse unilateral subacute neuroretinitis (DUSN).
    explanation: >-
      Identifies ocular larva migrans and diffuse unilateral subacute
      neuroretinitis as the core ocular presentation.
- phase: Residual or Fatal Neurologic Outcomes
  notes: >-
    Published neural larva migrans cases often leave residual neurologic
    deficits, and death has been reported in a minority of neurologic cases.
  evidence:
  - reference: PMID:40671903
    reference_title: "Human infections with the raccoon roundworm, Baylisascaris procyonis: A scoping review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Outcomes were reported for 42 individuals with neurological disease: 8
      (19%) died, 4 (10%) fully recovered, and the remaining 30 (71%) had mild
      to significant neurological residual deficits.
    explanation: >-
      The 2025 scoping review quantified fatal and residual-deficit outcomes
      among reported neural larva migrans cases.

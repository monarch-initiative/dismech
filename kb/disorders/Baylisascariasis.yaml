treatments:
- name: Albendazole with corticosteroids
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: albendazole
      term:
        id: CHEBI:16664
        label: albendazole
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  description: >-
    Suspected Baylisascariasis is treated empirically with albendazole to kill
    migrating larvae plus corticosteroids to limit eosinophilic inflammation.
    Outcome depends strongly on timing because delayed treatment after CNS
    invasion often leaves severe neurologic sequelae.
  target_mechanisms:
  - target: Hematogenous Somatic Larval Migration
  - target: CNS Larval Invasion
  - target: Eosinophilic Meningoencephalitis
  evidence:
  - reference: PMID:26960940
    reference_title: "Update on Baylisascariasis, a Highly Pathogenic Zoonotic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients recovering with fewer severe sequelae have been reported in
      recent years, reinforcing the current recommendation that early treatment
      with albendazole and corticosteroids should be initiated at the earliest
      suspicion of baylisascariasis.
    explanation: >-
      The update review supports early albendazole plus corticosteroids when
      Baylisascariasis is suspected.
  - reference: PMID:40742893
    reference_title: "Baylisascariasis (Raccoon Roundworm Infection) in Two Unrelated Children - Los Angeles County, California, 2024."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      In cases in which suspicion of exposure is high (e.g., known oral exposure
      to raccoon feces), treatment with oral albendazole (25–50 mg/kg per day
      for 10–20 days) might be appropriate, and should be initiated as soon as
      possible after ingestion of infectious material, ideally within three days
    explanation: >-
      The MMWR background gives the post-exposure early-treatment window for
      high-suspicion oral exposure.
- name: Laser photocoagulation of intraocular larvae
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: laser photocoagulation
    term:
      id: NCIT:C217424
      label: Laser Photocoagulation
  description: >-
    Visible intraocular larvae can be destroyed by retinal laser
    photocoagulation; albendazole and corticosteroids may also be used, but
    established visual loss often persists.
  target_mechanisms:
  - target: Retinal Larva Localization
  evidence:
  - reference: PMID:23829916
    reference_title: Baylisascaris larva migrans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Intraocular larvae can be destroyed by photocoagulation although

      initiating human exposure.
- name: Larval Hatching and Intestinal Wall Penetration
  biological_scale: TISSUE
  description: >-
    In the accidental human paratenic host, ingested eggs hatch to release L3
    larvae that penetrate the intestinal wall rather than remaining in the
    intestinal lumen to mature.
  locations:
  - preferred_term: intestinal wall
    term:
      id: UBERON:0001262
      label: wall of intestine
  downstream:
  - target: Hematogenous Somatic Larval Migration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26960940

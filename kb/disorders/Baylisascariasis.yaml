    snippet: >-
      Migration of B. procyonis to brain and eye tissues is considered to be
      accidental, a consequence of somatic migration and dissemination
    explanation: >-
      Supports modeling CNS and eye invasion as accidental branches from
      disseminated larval migration.
- name: CNS Larval Invasion
  biological_scale: TISSUE
  description: >-
    B. procyonis larvae that disseminate through the bloodstream can
    accidentally invade the central nervous system during somatic migration,
    where continued migration and growth damage neural tissue.
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  downstream:

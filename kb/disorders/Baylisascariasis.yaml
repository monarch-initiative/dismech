  found_in:
  - Baylisascariasis-literature-sweep-codex.md
  findings:
  - statement: A 2025 scoping review identified 60 published human infections and found neurological disease in 47 of them.
    supporting_text: >-
      Sixty infections were identified. Most (38, 75%) were in males and the
      median age was 2.9 y (range: 9 mo to 73 y). Forty-seven (78%)
      individuals had neurological disease (9 with concurrent ocular disease),
      11 had ocular disease alone, 1 had eosinophilic cardiac pseudotumor, and
      1 was an incidental autopsy finding.

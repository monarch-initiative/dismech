phenotypes:
- name: Cutaneous Venous Malformations
  description: >-
    Blue, soft, compressible papules or rubbery nodules may be present at birth or appear later. A congenital
    dominant venous malformation, over ten times the area of the other visible lesions, often presents first.
    Smaller lesions can cluster and become hyperkeratotic on palms and soles. Lesions can enlarge during puberty
    or pregnancy. Some patients have few visible skin lesions or none.
  phenotype_term:
    preferred_term: Venous malformation
    term:
      id: HP:0012721
      label: Venous malformation
  evidence:
  - &id008
    reference: PMID:34976762
    reference_title: 'Blue rubber bleb nevus syndrome: a single-center case series in 12 years.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Cutaneous lesions were present in 7/8 patients (87.5%), it appeared as the initial
      symptom in 6 patients
      (Figure 1), 1 patient (#2) skin lesions occurred in the 7th year of the course
      of disease.
    explanation: >-
      Skin lesions can be absent initially or entirely; this pediatric referral series
      is not a population-frequency
      estimate.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Affected individuals often have a congenital single large VM, a so-called dominant VM ... which represents the first manifestation of BRBN syndrome.
    explanation: The congenital dominant lesion is a recognized initial manifestation; the intervening parenthesis defines its size as greater than ten times the other visible lesions.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: They occur on any surface of the skin and mucosa and tend to aggregate and become hyperkeratotic, with a predilection for the palms and soles.
    explanation: BRBN lesions can show characteristic palmoplantar clustering and hyperkeratosis.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Rapid expansion in the size of the lesions can be observed after trauma or hormonal modulation (e.g., during puberty or pregnancy).
    explanation: The chapter describes hormonal enlargement across TEK-related venous malformations.
  category: Dermatologic
  notes: These are venous malformations (HP:0012721). The historical name does not denote the melanocytic lesion represented by HP:0100814 Blue nevus.
- name: Gastrointestinal Hemorrhage
  description: >-
    Occult or overt gastrointestinal bleeding ranges from intermittent loss to severe
    hemorrhage. In the European
    44-patient cohort, bleeding was the most frequent reported complication (54.3%);
    this is a selected clinical
    cohort.
  phenotype_term:
    preferred_term: Gastrointestinal hemorrhage
    term:
      id: HP:0002239
      label: Gastrointestinal hemorrhage
  evidence:

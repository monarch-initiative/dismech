discussions:
- discussion_id: brbns_model_transfer
  prompt: Which downstream effects are shared by BRBN double variants and other TEK-mutant malformations?
  rationale: >-
    Direct BRBN-allele HUVEC evidence establishes activation and survival phenotypes.
    Much of the FOXO1, PDGFB,
    mural-cell and drug-combination work instead uses L914F, while older AKT experiments
    use R849W. Allele-specific
    differences and cell context limit transfer. Molecular links are therefore scoped
    as related-model evidence
    rather than complete demonstrations of human BRBN pathogenesis.
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Reduced Endothelial PDGFB Expression
  evidence:
  - *id002
  - *id018
- discussion_id: brbns_emerging_inhibition
  prompt: Can PI3K inhibition or combination therapy improve durable control of BRBNS?
  rationale: >-
    Alpelisib corrects cellular phenotypes in TEK- and PIK3CA-mutant HUVECs, and ponatinib
    plus rapamycin regresses
    established L914F xenografts. The 2026 rapamycin-alpelisib mouse experiment used
    cells pretreated for 48
    hours before implantation, with a DMSO comparator; it demonstrates reduced lesion
    formation rather than
    systemic treatment of established lesions. Its in vivo comparison did not establish
    superiority over another
    drug combination. p53 changes are associated readouts, not a demonstrated necessary
    mediator. These results
    do not establish a BRBNS regimen or long-term clinical safety.
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Systemic Sirolimus
  evidence:
  - reference: PMID:26637981
    reference_title: Somatic Activating PIK3CA Mutations Cause Venous Malformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      The p110α-specific inhibitor BYL719 restores all abnormal phenotypes tested,
      in PIK3CA- as well as TEK-mutant
      HUVECs, demonstrating that they operate via the same pathogenic pathways.
    explanation: >-
      Cellular pharmacology of related venous-malformation models.
    quote_role: PRIMARY_RESULT
  - reference: PMID:42411503
    reference_title: AKT-mTOR/P53 PathwayDriven RapamycinAlpelisib Efficacy in Animal Models of TIE2Mutant Venous Malformations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      The results demonstrated a marked reduction in vessel sprouting in the 3D model
      and inhibited both lesion
      size and angiogenesis in the xenograft mouse model.
    explanation: >-
      The full methods specify cell pretreatment before implantation; no systemic
      treatment of established
      mouse lesions was tested.
    quote_role: PRIMARY_RESULT
- discussion_id: brbns_familial_cns_boundary
  prompt: How should familial CNS-predominant cases labeled BRBNS be classified?
  rationale: >-
    A reported father-son pair had skin venous malformations, seizures and cerebral
    vascular lesions, but lacked
    genetic assessment; the son had no significant colonoscopic abnormality and the
    father had non-cavernomatous
    arteriovenous lesions at autopsy. Such reports warrant molecular differential
    diagnosis rather than establishing
    dominant transmission, a uniform cerebral phenotype or a KRIT1 modifier for molecularly
    defined BRBNS.
  kind: KNOWLEDGE_GAP
  attaches_to:
  - inheritance#Somatic Mosaic
  evidence:
  - reference: PMID:32318009
    reference_title: 'Blue Rubber Bleb Nevus Syndrome With Multiple Cavernoma-Like Lesions on MRI: A Familial Case Report and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Unfortunately, no genetic assessment was performed due to the lack of this specific
      testing in our hospital.
    explanation: >-
      The familial report does not establish an inherited TEK variant or a molecular
      BRBN diagnosis.
    quote_role: PRIMARY_RESULT

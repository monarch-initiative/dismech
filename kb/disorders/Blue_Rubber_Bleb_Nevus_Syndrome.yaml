    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: both cause ligand-independent activation of TIE2, and increase survival, invasion,
      and colony formation when expressed in human umbilical vein endothelial cells
    explanation: Documents the increased survival and invasion that follow from the mutation.
  downstream:
  - target: Ectatic Mural-Cell-Poor Venous Channels
    description: Endothelial cells that do not die accumulate into expanding channels.
    evidence:
    - reference: PMID:27519652
      reference_title: Blue Rubber Bleb Nevus (BRBN) Syndrome Is Caused by Somatic TEK (TIE2)
        Mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: both cause ligand-independent activation of TIE2, and increase survival, invasion,
        and colony formation when expressed in human umbilical vein endothelial cells
      explanation: Increased endothelial survival and colony formation is the cellular
        behaviour that builds the expanded channel.
- name: PDGFB Downregulation and Mural Cell Deficiency
  description: >-
    AKT-dependent regulation of FOXO1 reduces endothelial PDGFB expression.
    Because PDGFB is the signal by which endothelium recruits pericytes and
    smooth muscle, mutant vessels are covered by fewer mural cells, which is the
    structural reason the channels are floppy and prone to dilate.
  cell_types:
  - preferred_term: pericyte
    term:
      id: CL:0000669
      label: pericyte
  - preferred_term: smooth muscle cell
    term:
      id: CL:0000192
      label: smooth muscle cell
  evidence:
  - reference: PMID:32867785
    reference_title: AKT/FOXO1 axis links cross-talking of endothelial cell and pericyte in
      TIE2-mutated venous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: VMs with TIE2-L914F mutation showed lower expression of PDGFB and α-SMA than
      normal veins.
    explanation: Carries both halves of this node - reduced PDGFB and reduced α-SMA, the
      marker of the mural-cell deficiency itself.
  downstream:
  - target: Ectatic Mural-Cell-Poor Venous Channels
    description: Without adequate mural cell support the vessel wall cannot resist dilatation.
    evidence:
    - reference: PMID:32867785
      reference_title: AKT/FOXO1 axis links cross-talking of endothelial cell and pericyte in
        TIE2-mutated venous malformations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: VMs with TIE2-L914F mutation showed lower expression of PDGFB
      explanation: Reduced PDGFB in the malformed vessels links the signalling defect to the
        mural-cell-poor wall.
- name: Ectatic Mural-Cell-Poor Venous Channels
  description: >-
    The convergent structural lesion: dilated, thin-walled venous channels lined
    by endothelium and poorly invested with smooth muscle. These are the
    malformations seen in skin and bowel, and they enlarge over time rather than
    involuting.

- name: Localised Intravascular Coagulopathy
  description: >-
    Clot formation and fibrinolysis within malformed venous channels can elevate D-dimer;
    more severe consumption
    can lower fibrinogen and increase procedural bleeding risk. Sluggish flow is the
    proposed initiating condition.
    D-dimer is not a specific test for BRBNS, and normal values do not exclude small
    venous malformations.
  biological_scale: TISSUE
  evidence:
  - &id005
    reference: PMID:19917952
    reference_title: Elevated D-dimer level in the differential diagnosis of venous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      All patients with multifocal venous malformations (5 with sporadic multifocal
      VM and 2 with BRBN) had
      very high D-dimer levels (≥5.649μg/ml).
    explanation: >-
      Both BRBN patients had high D-dimer; this small subgroup does not estimate disease-wide
      prevalence.
    quote_role: PRIMARY_RESULT
  - reference: PMID:19917952
    reference_title: Elevated D-dimer level in the differential diagnosis of venous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In one of the BRBN patients, the high D-dimers were associated with low fibrinogen
      level (95mg/dl), similar
      to two reported BRBN patients, who had acute or chronic disseminated intravascular
      coagulopathy13, 14.
    explanation: >-
      Documents low fibrinogen in one BRBN participant; the cited prior reports are
      background, not extra participants.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Elevated D-Dimer
    description: >-
      Fibrin formation and breakdown are reflected by elevated circulating D-dimer.
    causal_link_type: DIRECT
    evidence:

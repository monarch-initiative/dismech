  - target: Chronic Gastrointestinal Blood Loss
    description: Thin-walled bowel lesions bleed into the gut lumen.
    evidence:
    - reference: PMID:40074320
      reference_title: 'Blue rubber bleb nevus syndrome: A case report and literature review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: venous malformations in multiple organs, including the skin, gastrointestinal
        tract, liver, and lungs
      explanation: Places the malformations in the gastrointestinal tract, the site of the
        bleeding this edge asserts.
- name: Chronic Gastrointestinal Blood Loss
  description: >-
    Clinical endpoint. The bowel malformations bleed slowly and repeatedly rather
    than catastrophically, producing occult loss, melena and progressive
    iron-deficiency anaemia. This is the dominant source of morbidity and the
    endpoint against which treatment is judged, since haemoglobin and transfusion
    requirement are the practical outcome measures.
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:33416235
    reference_title: 'Efficacy and Safety of Sirolimus for Blue Rubber Bleb Nevus Syndrome:
      A Prospective Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The characteristic gastrointestinal (GI) bleeding from multiple VM lesions causes
      severe chronic anemia which renders most patients depend on lifelong blood transfusion
      and frequent endoscopic treatment with dismayed outcomes.
    explanation: States the causal link from multifocal lesion bleeding to chronic anaemia and
      transfusion dependence.
- name: Localised Intravascular Coagulopathy
  description: >-
    Venous stasis within the ectatic channels consumes clotting factors locally,
    producing a chronic consumptive coagulopathy with elevated D-dimer and
    sometimes low fibrinogen. It is the eighth and final step of the causal chain,
    the disease's most specific laboratory marker, and the reason these patients
    carry both thrombotic and perioperative bleeding risk.
  biological_processes:
  - preferred_term: blood coagulation
    modifier: DYSREGULATED
    term:
      id: GO:0007596
      label: blood coagulation
  evidence:
  - reference: PMID:19917952
    reference_title: Elevated D-dimer level in the differential diagnosis of venous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Elevated D-dimer level is highly specific for VMs (pure, combined, or syndromic)
    explanation: Establishes elevated D-dimer as a highly specific marker of venous
      malformation, the laboratory signature of this node.

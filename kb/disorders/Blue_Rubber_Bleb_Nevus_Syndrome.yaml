  association: Gain of Function
  variants:
  - name: T1105N-T1106P
    description: >-
      The recurrent BRBN-associated double allele p.Thr1105Asn-p.Thr1106Pro occurs
      in cis. Its enrichment differs
      from the p.Tyr897Cys-p.Arg915Cys allele recurrent in multifocal sporadic VM;
      genotype does not replace
      clinical assessment of the syndrome boundary.
    evidence:
    - reference: PMID:27519652
      reference_title: Blue Rubber Bleb Nevus (BRBN) Syndrome Is Caused by Somatic TEK (TIE2) Mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        T1105N-T1106P is recurrent in blue rubber bleb nevus, whereas Y897C-R915C
        is recurrent in sporadically
        occurring multifocal venous malformation
      explanation: >-
        Identifies the recurrent alleles in their respective clinical groups.
      quote_role: PRIMARY_RESULT
  notes: >-
    TEK encodes TIE2. Lesional somatic gain-of-function variants, often paired in
    cis, are the principal established
    cause. Variant identity, mosaic burden and lesion distribution contribute to phenotypic
    diversity; a single
    recurrent allele does not define every clinical case.
  evidence:
  - *id007
  - *id001
diagnosis:
- name: Clinical assessment of multifocal venous malformations
  description: >-
    Evaluate cutaneous, mucosal and gastrointestinal lesions with attention to sparse
    or late-appearing skin
    findings. Clinical phenotype and lesional molecular testing distinguish BRBNS
    from other multifocal vascular
    disorders.
  evidence:
  - *id008
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Gastrointestinal lesions (grape-like mucosal venous nodules), documented by
      endoscopy, colonoscopy, or
      magnetic resonance imaging, are pathognomonic of BRBN syndrome.
    explanation: >-
      Gastrointestinal lesion morphology is a central diagnostic clue; atypical or
      familial presentations require
      differential diagnosis.
    quote_role: REVIEW_SYNTHESIS
- name: Lesional TEK sequencing
  description: >-
    Prioritize affected vascular tissue and sequencing sensitive to low-level mosaicism;
    a negative blood test
    does not exclude a lesional variant. A TEK variant of uncertain significance alone
    does not establish the
    diagnosis.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Sequence analysis of DNA derived from clinically affected tissue samples ‒ preferably
      from the vascular
      lesion, requiring a surgical or skin biopsy ‒ should be prioritized for genetic
      testing.
    explanation: >-
      GeneReviews recommends affected tissue because of mosaicism.
    quote_role: REVIEW_SYNTHESIS
- name: Endoscopic assessment including the small bowel
  description: >-
    Upper/lower endoscopy and capsule endoscopy map gastrointestinal lesions. Capsule
    studies can detect small-bowel
    lesions missed on other tests; the selected six positive examinations in one series
    do not establish 100%
    diagnostic sensitivity. Consider patency assessment or imaging when obstruction
    is suspected. Endoscopic
    ultrasound helps determine depth before treating a large lesion.
  diagnosis_term:
    preferred_term: Endoscopic Procedure
    term:
      id: NCIT:C16546
      label: Endoscopic Procedure
  evidence:
  - *id009
  - reference: PMID:36277742
    reference_title: Endoscopic and Surgical Management of Blue Rubber Bleb Nevus Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      An initial endoscopic ultrasound was performed to evaluate the gastric lesions
      because of concern of
      transmural involvement given their size, but the lesions were found to arise
      from the submucosa.
    explanation: >-
      EUS established lesion depth before endoscopic resection.
    quote_role: PRIMARY_RESULT
- name: MRI assessment of lesion extent
  description: >-
    MRI evaluates deeper extension and multiorgan lesion burden; whole-body imaging
    can be considered for multifocal
    disease. Imaging complements rather than replaces gastrointestinal endoscopy.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Consider whole-body MRI. ... To evaluate risk of internal lesions
    explanation: >-
      The multifocal-VM assessment table recommends considering whole-body MRI.
    quote_role: REVIEW_SYNTHESIS
- name: Blood count and iron studies
  description: >-
    Measure hemoglobin and iron status and investigate occult gastrointestinal loss
    when anemia is unexplained.
  evidence:
  - *id003
- name: Coagulation assessment
  description: >-
    D-dimer and fibrinogen help identify localized intravascular coagulopathy and
    inform procedural planning.
    The reported 96.5% D-dimer specificity concerns venous components among vascular-anomaly
    referrals, not
    BRBNS in the general population; normal values do not rule out a venous malformation.
  diagnosis_term:
    preferred_term: Coagulation Study
    term:
      id: NCIT:C62662
      label: Coagulation Study
  markers: D-dimer; fibrinogen
  evidence:
  - *id005
  - reference: PMID:19917952
    reference_title: Elevated D-dimer level in the differential diagnosis of venous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Among the 85 patients without VM, D-dimer levels were elevated only in 3 patients;
      the specificity of
      the dosage was 96.5% (95% confidence interval, 92.5%-100%).
    explanation: >-
      Specifies the comparator group underlying the specificity estimate.
    quote_role: PRIMARY_RESULT
treatments:
- name: Systemic Sirolimus
  description: >-
    Specialist-directed off-label mTOR inhibition can reduce bleeding and lesion burden
    in diffuse or difficult-to-treat
    BRBNS. The prospective eleven-patient study reported improvement over twelve months;
    longer-term response
    varies and relapse may follow withdrawal. Oral ulcers and other adverse effects
    require monitoring. No
    cure, uniform response or site-independent efficacy is established.
  evidence:
  - reference: PMID:33416235
    reference_title: 'Efficacy and Safety of Sirolimus for Blue Rubber Bleb Nevus Syndrome: A Prospective Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The average lesion size was reduced by 7.4% (P < 0.001), 9.3% (P < 0.001), and
      13.0% (P < 0.05) at 3,
      6, and 12 months of sirolimus treatment, respectively.
    explanation: >-
      Eleven patients were followed in a single-arm prospective study; there was no
      randomized comparator.
    quote_role: PRIMARY_RESULT
  - reference: PMID:33416235
    reference_title: 'Efficacy and Safety of Sirolimus for Blue Rubber Bleb Nevus Syndrome: A Prospective Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Only 1 patient received blood transfusion once during the study.
    explanation: >-
      Reports observed transfusion use during the study, not guaranteed lifelong transfusion
      independence.
    quote_role: PRIMARY_RESULT
  - reference: PMID:33416235
    reference_title: 'Efficacy and Safety of Sirolimus for Blue Rubber Bleb Nevus Syndrome: A Prospective Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Grade 1-2 adverse effects including oral ulcers (81.8%), acne (27.3%), transient
      elevation of liver enzymes
      (18.2%), and hair loss (9.1%) were observed.
    explanation: >-
      Adverse effects in this small cohort were mild, but this does not establish
      long-term safety.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34976762
    reference_title: 'Blue rubber bleb nevus syndrome: a single-center case series in 12 years.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Patient  # 1 received sirolimus for more than 8 years with limited success,
      still experienced intermittent
      GI bleeding and severe anemia
    explanation: >-
      Documents incomplete response despite prolonged treatment.
    quote_role: PRIMARY_RESULT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: PI3K-AKT-mTOR Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      mTOR inhibition targets the signaling pathway. Clinical benefit is supported
      separately from the related-variant
      molecular assays.
    evidence:
    - reference: PMID:32867785
      reference_title: AKT/FOXO1 axis links cross-talking of endothelial cell and pericyte in TIE2-mutated venous malformations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        Our results showed that RAPA down-regulated the phosphorylation of AKT, FOXO1,
        and mTOR, especially
        in the TIE2-L914F mutant group (Fig. 5a, b).
      explanation: >-
        A molecular response in L914F HUVECs supports pathway inhibition, indirectly
        for BRBN.
      quote_role: PRIMARY_RESULT
- name: Iron Replacement
  description: >-
    Replaces iron lost through chronic gastrointestinal bleeding; it does not stop
    the bleeding or remove venous
    malformations.
  evidence:
  - &id010
    reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Iron replacement or transfusions in case of anemia from chronic bleeding
    explanation: >-
      GeneReviews separates supportive correction of anemia from treatment of the
      lesions.
    quote_role: REVIEW_SYNTHESIS
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Iron supplement
  target_mechanisms:
  - target: Iron Deficiency Anemia
    treatment_effect: INHIBITS
    description: Replenishes iron and treats the resulting anemia; it does not inhibit gastrointestinal blood loss.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
      reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        Iron replacement or transfusions in case of anemia from chronic bleeding
      explanation: >-
        GeneReviews separates supportive correction of anemia from treatment of the
        lesions.
      quote_role: REVIEW_SYNTHESIS
- name: Blood Transfusion
  description: >-
    Corrects severe or symptomatic anemia when clinically indicated. Transfusion requirements
    vary with disease
    severity and response to lesion-directed or systemic treatment.
  evidence:
  - *id010
  treatment_term:
    preferred_term: Blood Transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
- name: Endoscopic Treatment of Bowel Lesions
  description: >-
    Accessible mucosal or submucosal lesions can be treated by sclerotherapy, resection
    or other endoscopic
    methods. Depth and extent guide selection; transmural lesions may require surgery
    because of perforation
    risk. Combined sirolimus and lauromacrogol success in a single case cannot isolate
    each treatment effect.
  evidence:
  - &id011
    reference: PMID:36277742
    reference_title: Endoscopic and Surgical Management of Blue Rubber Bleb Nevus Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Through a combination of methylene blue-hetastarch injection for lifting and
      snare resection with a 1.5
      cm Cook AcuSnare (ENDO CUT Q-3), removal of the gastric and colon lesions was
      achieved successfully by
      EMR.
    explanation: >-
      Documents actual endoscopic treatment rather than inferring efficacy from bleeding
      alone.
    quote_role: PRIMARY_RESULT
  - reference: PMID:39867693
    reference_title: 'Case Report: Combination of sirolimus and endoscopic lauromacrogol sclerotherapy in the management of blue rubber bleb nevus syndrome with gastric tract bleeding.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      After 1 year of treatment, the patient showed no signs of anemia or gastrointestinal
      tract bleeding.
    explanation: >-
      One child received both sirolimus and endoscopic lauromacrogol; benefit cannot
      be attributed separately
      to either intervention.
    quote_role: PRIMARY_RESULT
  treatment_term:
    preferred_term: Endoscopic Procedure
    term:
      id: NCIT:C16546
      label: Endoscopic Procedure
  target_mechanisms:
  - target: Chronic Gastrointestinal Blood Loss
    treatment_effect: INHIBITS
    description: >-
      Removing or obliterating selected bleeding lesions can reduce blood loss; incomplete
      treatment can leave
      other active lesions.
    evidence:
    - *id011
- name: Surgical Treatment of Gastrointestinal Lesions
  description: >-
    Resection or ligation can control bleeding from focal or extensive lesions in
    selected patients. Planning
    aims to preserve bowel length and account for transmural disease. A ten-patient
    series used extensive combined
    procedures with durable control in most patients; morbidity, incomplete removal
    and recurrence remain considerations.
    Obstruction or intussusception can require urgent surgery.
  evidence:
  - &id012
    reference: PMID:15729077
    reference_title: 'Blue rubber bleb nevus syndrome: surgical eradication of gastrointestinal bleeding.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Only 1 patient who had a less extensive procedure developed recurrent GI bleeding.
      The mean follow-up
      period was 5.0 years (range 2.9-10.3 years).
    explanation: >-
      Selected surgical series of ten patients; mean 137 lesions removed per operation,
      not evidence that all
      BRBNS is surgically curable.
    quote_role: PRIMARY_RESULT
  - reference: PMID:32664167
    reference_title: 'Blue rubber bleb nevus syndrome with the complication of intussusception: A case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      An emergency laparotomy was performed, and postoperative management included
      blood transfusions and oral
      iron supplementation for 2 weeks.
    explanation: >-
      Direct treatment of an acute intussusception complication.
    quote_role: PRIMARY_RESULT
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Chronic Gastrointestinal Blood Loss
    treatment_effect: INHIBITS
    description: >-
      Removing or obliterating selected bleeding lesions can reduce blood loss; incomplete
      treatment can leave
      other active lesions.
    evidence:
    - *id012
- name: Management of Localized Intravascular Coagulopathy
  description: >-
    A vascular-anomalies and hematology team assesses coagulation before invasive
    procedures. Low-molecular-weight
    heparin can be used for painful intralesional thrombosis or perioperative coagulopathy,
    with the plan individualized
    to lesion burden, fibrinogen and active bleeding.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      If lesions are painful and D-dimers are elevated, LMWH can also be used to treat
      the associated pain.
    explanation: >-
      Expert guidance for TEK-related venous malformations; treatment must account
      for the individual bleeding
      context.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Low-molecular-weight heparin (LMWH) should be administered prior to any invasive procedure (sclerotherapy and/or surgery) to avoid disseminated intravascular coagulopathy.
    explanation: GeneReviews recommends procedural prophylaxis for TEK-related venous malformations; timing depends on fibrinogen and D-dimer results and the specialist assessment of bleeding risk.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Low molecular weight heparin
      term:
        id: NCIT:C2578
        label: Low Molecular Weight Heparin
  target_mechanisms:
  - target: Localised Intravascular Coagulopathy
    treatment_effect: INHIBITS
    description: Anticoagulation reduces intralesional thrombotic activity and aims to prevent worsening consumption around procedures.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
      reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: Low-molecular-weight heparin (LMWH) should be administered prior to any invasive procedure (sclerotherapy and/or surgery) to avoid disseminated intravascular coagulopathy.
      explanation: GeneReviews recommends procedural prophylaxis for TEK-related venous malformations; timing depends on fibrinogen and D-dimer results and the specialist assessment of bleeding risk.
- name: Clinical and Laboratory Surveillance
  description: >-
    Review lesions and symptoms with a vascular-anomalies team. Follow blood count
    and iron indices for gastrointestinal
    bleeding, and D-dimer/fibrinogen for coagulation risk, especially before procedures.
    Sirolimus requires
    clinical and laboratory monitoring for toxicity and dose adjustment. Consider
    neurological assessment and
    appropriate imaging when symptoms or lesion distribution suggest CNS involvement.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Individuals on sirolimus should be closely followed at the beginning and throughout
      the course of their
      treatment, in order to modify the dosage as well as manage adverse events.
    explanation: >-
      Expert monitoring recommendation.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Annually or more frequently in case of symptoms (fatigue, bloody stools)
    explanation: >-
      The gastrointestinal surveillance table recommends at least annual review, intensified
      by symptoms.
    quote_role: REVIEW_SYNTHESIS
- name: Genetic Counseling
  description: >-
    Explain the usual postzygotic mosaic origin, limits of negative blood testing
    and low expected family recurrence.
    Do not apply the 50% transmission estimate for germline TEK-related VMCM to typical
    somatic BRBNS; an apparent
    familial presentation needs reassessment.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Counseling for recurrence risk in ... -related unifocal VM, MSVM, and BRBN syndrome
      should emphasize that, while no pregnancy is at zero risk, all evidence suggests
      that the risk of recurrence for these disorders is not increased compared to
      the general population.
    explanation: >-
      Disease-specific counseling distinguishes somatic BRBN from inherited VMCM.
    quote_role: REVIEW_SYNTHESIS
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Avoidance of High-Estrogen Contraceptive Pills
  description: Avoid high-estrogen contraceptive pills because venous malformations can enlarge or become symptomatic with estrogen exposure; contraceptive selection requires individual clinical assessment.
  therapeutic_modality: OTHER
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Contraceptive pills with high estrogen concentration should be avoided, as VM are estrogen responsive.
    explanation: GeneReviews identifies high-estrogen contraceptive pills as a circumstance to avoid in TEK-related venous malformations.
- name: Sclerotherapy of Symptomatic Cutaneous and Soft-Tissue Lesions
  description: Sclerotherapy can reduce symptomatic venous-malformation volume, either alone or before surgery. Selection depends on anatomy and procedural coagulation assessment. This recommendation comes from TEK-related venous-malformation guidance, rather than a BRBN-specific comparative trial.
  treatment_term:
    preferred_term: Sclerotherapy
    term:
      id: NCIT:C62732
      label: Sclerotherapy
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Sclerotherapy is the first-line treatment for VM. It is performed to decrease the volume of the VM before surgery or as monotherapy in individuals in whom surgery is not technically feasible.
    explanation: TEK-related venous-malformation guidance supports lesion-directed sclerotherapy, including symptomatic skin and soft-tissue disease.
- name: Excision of Selected Cutaneous and Soft-Tissue Lesions
  description: Small lesions can be excised when complete removal is feasible without functional or anatomic harm. Extensive disease may be inaccessible or incompletely treated.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: If the lesion is small and complete resection is possible without anatomic or functional consequences, surgical excision should be performed as the treatment of choice.
    explanation: Small accessible lesions may be excised; incomplete cure and anatomic limitations remain possible.
animal_models:
- name: HUVEC-TIE2-L914F xenograft
  species: Mouse (Mus musculus)
  genotype: TIE2-mutant human endothelial cell xenograft
  category: Xenograft
  description: >-
    Subcutaneous HUVEC-TIE2-L914F xenografts in immunodeficient mice form ectatic
    vascular channels. Systemic
    ponatinib plus rapamycin induced regression of established lesions; withdrawal
    caused rebound that topical
    rapamycin suppressed. L914F models common TEK-mutant VM rather than the recurrent
    BRBN double allele or
    its gastrointestinal distribution.
  genes:
  - preferred_term: TEK
    term:
      id: hgnc:11724
      label: TEK
  associated_phenotypes:
  - Venous malformation
  modeled_mechanisms:
  - target: PI3K-AKT-mTOR Pathway Activation
    relationship: PERTURBS
    description: >-
      Used to test pharmacological suppression of the pathway node, reading out lesion
      regression.
    fidelity: MODERATE
    limitations: >-
      Single L914F overexpression in implanted cells, immunodeficient host, short
      follow-up and subcutaneous
      lesions. It does not establish treatment efficacy or safety in BRBNS patients.
    evidence:
    - reference: PMID:30626204
      reference_title: Ponatinib Combined With Rapamycin Causes Regression of Murine Venous Malformation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Combination treatment with the ABL kinase inhibitor ponatinib and rapamycin caused VM regression in a xenograft model based on injection of HUVEC-TIE2-L914F.
      explanation: Lesion regression under pathway inhibition is the readout that grounds this model link.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:30626204
    reference_title: Ponatinib Combined With Rapamycin Causes Regression of Murine Venous Malformation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Combination treatment with the ABL kinase inhibitor ponatinib and rapamycin caused VM regression in a xenograft model based on injection of HUVEC-TIE2-L914F.
    explanation: A result from the model itself - lesion regression in the HUVEC-TIE2-L914F xenograft under combined pathway inhibition.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: Mosaic TIE2-L914F transgenic mouse
  species: Mouse (Mus musculus)
  genotype: CMV-Cre; Rosa26-TIE2-L914F transgene
  category: Transgenic
  description: >-
    Variable CMV-Cre recombination activates the L914F transgene during development.
    Mutant offspring show
    partial embryonic lethality; survivors develop enlarged venous/capillary lesions
    and increased D-dimer.
    This models mosaic TEK-driven VM, with no demonstrated BRBN double-cis genotype
    or gastrointestinal bleeding
    phenotype.
  evidence:
  - &id013
    reference: PMID:42059767
    reference_title: Constitutive, Mosaic Expression of TIE2 p.L914F During Mouse Development Causes Venous Malformation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      surviving CMV-Cre;TIE2L914F mice developed massively enlarged venous/capillary
      vessels in various tissues,
      reminiscent of the VM phenotype.
    explanation: >-
      The mosaic transgenic model produces VM-like lesions, not a demonstrated BRBN-specific
      phenotype.
    quote_role: PRIMARY_RESULT
  modeled_mechanisms:
  - target: Ectatic Mural-Cell-Poor Venous Channels
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-

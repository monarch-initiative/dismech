    reference_title: 'Blue rubber bleb nevus syndrome: A European multicenter cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Gastrointestinal bleeding is the most common complication (54.3 %), requiring
      endoscopic treatment (36.4
      %) by various techniques.
    explanation: >-
      Reports the cohort-specific complication frequency.
    quote_role: PRIMARY_RESULT
  category: Gastrointestinal
- name: Iron Deficiency Anemia

- name: Chronic Gastrointestinal Blood Loss
  description: >-
    Gastrointestinal venous malformations can bleed intermittently or continuously,
    producing occult blood
    loss, melena or hematochezia. Severe overt bleeding can occur; chronic iron deficiency
    is common but not
    every patient is transfusion dependent.
  biological_scale: ORGANISM

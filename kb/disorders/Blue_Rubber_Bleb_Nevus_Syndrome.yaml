disease_term:
  preferred_term: blue rubber bleb nevus
  term:
    id: MONDO:0007203
    label: blue rubber bleb nevus
notes: >-
  Naming: despite "nevus" in the eponym, the lesions are venous malformations,
  not nevi and not tumours. The International Society for the Study of Vascular
  Anomalies classifies the condition among multifocal venous malformations. The
  cutaneous phenotype therefore binds HP:0012721 Venous malformation, which is
  the term the sibling vascular-anomaly entries use. The melanocytic HP:0100814
  Blue nevus matches the eponym but would have been wrong.

  The pathograph is organised as a single causal chain from the somatic TEK
  double mutation through constitutive TIE2 activation and PI3K-AKT-mTOR to two
  parallel consequences - suppressed endothelial apoptosis, and PDGFB
  downregulation with mural-cell deficiency - which converge on the ectatic
  vessel and thence on gastrointestinal bleeding. Sirolimus targets the pathway
  node rather than any lesion, which is why it works across sites.

  PIK3CA is recorded with relationship_type BIOMARKER rather than CAUSATIVE. Its
  cited study concerns venous malformations with no detected TEK mutation, so it
  is an alternative driver of the same PI3K-AKT axis in the wider lesion class
  rather than a cause of this syndrome. PDGFB is deliberately absent from the
  genetic section: it is not mutated here, and its downregulation is an expression
  finding already carried by the PDGFB Downregulation and Mural Cell Deficiency
  node.

  Known extension points: a datasets section; phenotype frequency and onset data,
  which the research report gives but which are not traceable to a quotable cached
  sentence; alpelisib and the rapamycin-alpelisib combination as emerging targeted
  therapy; video capsule endoscopy and whole-body T2 MRI as additional diagnostic
  modalities; intussusception and volvulus as the emergency surgical
  complications; and the further model systems in the research report, including
  an endothelium-specific zebrafish model and a genetic mosaic TIE2 p.L914F
  mouse.

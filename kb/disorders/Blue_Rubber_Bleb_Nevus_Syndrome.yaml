    reference_title: 'Blue rubber bleb nevus syndrome: A case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: colonoscopy demonstrated multiple blue vascular tumors
    explanation: Endoscopy visualising the multifocal lesions is what establishes the
      gastrointestinal component of the diagnosis.
treatments:
- name: Systemic Sirolimus
  description: >-
    First-line systemic therapy for diffuse or unresectable disease. Sirolimus
    inhibits mTOR, the node downstream of the constitutively active TIE2-PI3K-AKT
    axis. In a prospective study of BRBNS it reduced lesion size and raised
    haemoglobin, with only grade 1-2 adverse effects.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  target_mechanisms:
  - target: PI3K-AKT-mTOR Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      mTOR inhibition acts directly on the pathway node that the mutant receptor
      drives, which is why it is effective irrespective of lesion site.
    evidence:
    - reference: PMID:33416235
      reference_title: 'Efficacy and Safety of Sirolimus for Blue Rubber Bleb Nevus Syndrome:
        A Prospective Study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The average lesion size was reduced by 7.4% (P < 0.001), 9.3% (P < 0.001), and
        13.0% (P < 0.05) at 3, 6, and 12 months of sirolimus treatment, respectively.
      explanation: Lesion shrinkage is the anti-lesion readout showing mTOR inhibition acts on
        the malformation itself, not only on the anaemia.
  evidence:
  - reference: PMID:33416235
    reference_title: 'Efficacy and Safety of Sirolimus for Blue Rubber Bleb Nevus Syndrome:
      A Prospective Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hemoglobin increased significantly after 6- and 12-month treatment
    explanation: Prospective evidence that sirolimus raises haemoglobin in BRBNS.
  - reference: PMID:26783326
    reference_title: Efficacy and Safety of Sirolimus in the Treatment of Complicated Vascular
      Anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a total of 47 patients had a partial response, 3 patients had stable disease,
      and 7 patients had progressive disease
    explanation: A phase II trial in complicated vascular anomalies more broadly. Note the
      responses were partial rather than complete, and this cohort is not BRBNS-specific, so
      it supports activity rather than cure.
- name: Transfusion and Iron Replacement
  description: >-
    Supportive management of the anaemia rather than the malformations. It is the
    mainstay for low-burden disease and the fallback when lesions are too diffuse
    to treat directly.
  treatment_term:
    preferred_term: blood transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Chronic Gastrointestinal Blood Loss

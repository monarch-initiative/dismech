  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  association: Gain of Function
  variants:
  - name: T1105N-T1106P
    description: >-
      The recurrent double cis allele of blue rubber bleb nevus syndrome
      specifically, distinguishing it from Y897C-R915C which recurs in sporadic
      multifocal venous malformation.
    evidence:
    - reference: PMID:27519652
      reference_title: Blue Rubber Bleb Nevus (BRBN) Syndrome Is Caused by Somatic TEK (TIE2)
        Mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: T1105N-T1106P is recurrent in blue rubber bleb nevus, whereas Y897C-R915C is

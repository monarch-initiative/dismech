name: Blue Rubber Bleb Nevus Syndrome
creation_date: '2026-08-31T12:00:00Z'
synonyms:
- Bean syndrome
- blue rubber bleb naevus syndrome
- BRBNS
description: >-
  Blue rubber bleb nevus syndrome, also called Bean syndrome, is a rare and
  almost always sporadic multifocal venous malformation disorder. It is defined
  by the coexistence of characteristic cutaneous venous malformations - soft,
  blue-violaceous, compressible "blebs" with a predilection for the palms and
  soles - and multifocal gastrointestinal venous malformations, predominantly of
  the small bowel, which are effectively pathognomonic. The gastrointestinal
  lesions bleed chronically, producing recurrent and often transfusion-dependent
  iron-deficiency anaemia that is the principal source of morbidity. Despite the
  name, the lesions are venous malformations rather than nevi or tumours, and
  the International Society for the Study of Vascular Anomalies classifies the
  condition among multifocal venous malformations. The cause is post-zygotic
  somatic mosaic activating mutation of TEK, which encodes the endothelial
  receptor tyrosine kinase TIE2; multifocal disease is characteristically driven
  by double mutations in cis on the same allele. These produce ligand-independent
  TIE2 activation signalling through PI3K-AKT-mTOR, which suppresses endothelial
  apoptosis and, through an AKT/FOXO1 axis, reduces PDGFB and mural-cell
  recruitment, yielding dilated smooth-muscle-poor venous channels that enlarge
  and bleed. Management is stratified by lesion burden, from iron and transfusion
  through endoscopic and surgical treatment to systemic mTOR inhibition with
  sirolimus for diffuse or unresectable disease.
categories:
- Vascular Anomaly
- Venous Malformation
- Somatic Mosaic Disorder
parents:
- venous malformation

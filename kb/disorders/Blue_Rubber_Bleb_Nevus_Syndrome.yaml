diagnosis:
- name: Coagulation testing for localised intravascular coagulopathy
  description: >-
    D-dimer is the most useful laboratory test. It is only moderately sensitive
    but highly specific for venous malformation, so an elevated level supports the
    diagnosis and flags the coagulopathy that carries thrombotic and
    perioperative bleeding risk.
  diagnosis_term:
    preferred_term: coagulation study
    term:
      id: NCIT:C62662
      label: Coagulation Study
  markers: D-dimer
  evidence:
  - reference: PMID:19917952
    reference_title: Elevated D-dimer level in the differential diagnosis of venous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the specificity of the dosage was 96.5% (95% confidence interval, 92.5%-100%)
    explanation: Quantifies the high specificity that makes D-dimer useful for confirming
      venous malformation.
- name: Endoscopic assessment of gastrointestinal lesions
  description: >-
    Endoscopy, including capsule study of the small bowel, both establishes the
    gastrointestinal lesion burden that is effectively pathognomonic and provides
    the route for treatment. Most of the clinical problem in this disease is
    finding occult small-bowel lesions.
  diagnosis_term:
    preferred_term: endoscopic biopsy
    term:
      id: NCIT:C15389
      label: Endoscopic Biopsy

- name: Ectatic Mural-Cell-Poor Venous Channels
  description: >-
    Malformed, dilated blood-filled venous channels occur in skin, bowel and sometimes
    other tissues. Direct
    BRBNS histology shows thin or flattened endothelium, intralesional thrombosis
    and calcification. Variable
    mural-cell investment is described across TEK-related malformations; cellular
    signaling experiments provide
    an indirect explanation for the tissue architecture.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:34976762
    reference_title: 'Blue rubber bleb nevus syndrome: a single-center case series in 12 years.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The surgery slices showed that there were proliferative and dilated cavernous
      vascular cavities under
      the mucosa lined by normal or thin or flat endothelium with varying amounts,
      the cavities were full of
      red blood cells, some of which could be seen thrombus organization and calcification
      in different degrees,
      suggesting VMs.
    explanation: >-
      Direct histology of resected BRBNS lesions shows dilated blood-filled channels
      and intralesional thrombus
      organization.
    quote_role: PRIMARY_RESULT

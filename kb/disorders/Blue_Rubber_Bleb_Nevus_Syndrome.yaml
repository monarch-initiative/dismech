  description: >-
    A marker of local intravascular clot turnover. It is common in extensive venous malformations but neither
    unique to BRBNS nor obligatory in every patient. GeneReviews reports elevated D-dimer in more than 80%
    of individuals with VMCM and BRBN syndrome; this combined clinical summary is not a BRBN-specific population
    estimate.
  phenotype_term:
    preferred_term: Elevated circulating D-dimer concentration
    term:

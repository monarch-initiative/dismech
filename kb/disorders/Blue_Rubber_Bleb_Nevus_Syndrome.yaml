    quote_role: REVIEW_SYNTHESIS
inheritance:
- name: Somatic Mosaic
  description: >-
    The usual molecularly defined disorder is postzygotic somatic mosaicism. GeneReviews
    reports no confirmed
    vertical transmission or sibling recurrence and considers recurrence risk comparable
    to the general population;
    this does not establish a literally zero risk. An apparent dominant family history
    warrants reassessment
    for familial TEK-related cutaneomucosal malformations or other vascular disorders.
    Historical familial
    cases labeled BRBNS often lack molecular confirmation.
  inheritance_term:
    preferred_term: somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  evidence:
  - &id001
    reference: PMID:27519652
    reference_title: Blue Rubber Bleb Nevus (BRBN) Syndrome Is Caused by Somatic TEK (TIE2) Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In contrast to common unifocal venous malformation, which is most often caused
      by the somatic L914F TIE2
      mutation, multifocal forms are predominantly caused by double (cis) mutations,
      that is, two somatic mutations
      on the same allele of the gene.
    explanation: >-
      Double cis alleles predominate in multifocal disease; this is not a requirement
      demonstrated in every
      clinically diagnosed patient.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader
    reference_title: TEK-Related Venous Malformations - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      No confirmed vertical transmission or sib recurrence has been reported to date.
    explanation: >-
      Describes the observed inheritance evidence for somatic TEK-related phenotypes,
      including BRBN syndrome.
    quote_role: REVIEW_SYNTHESIS
pathophysiology:
- name: Somatic Activating TEK Variants
  description: >-
    Activating TEK variants are present in affected tissues, often at low mosaic allele
    fractions. Double mutations
    in cis predominate in BRBNS and other multifocal TEK-related malformations. Identical
    variants across sampled
    lesions support a shared mutant lineage; the developmental timing and precise
    founding cell cannot be reconstructed
    from sequencing alone.
  biological_scale: MOLECULAR
  evidence:
  - &id007
    reference: PMID:27519652
    reference_title: Blue Rubber Bleb Nevus (BRBN) Syndrome Is Caused by Somatic TEK (TIE2) Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We discovered somatic mutations in TEK, the gene encoding TIE2, in 15 of 17
      individuals with blue rubber
      bleb nevus syndrome.
    explanation: >-
      Lesional sequencing establishes TEK as the principal identified cause in this
      series; the two unsolved
      individuals are not assigned an unobserved genotype.
    quote_role: PRIMARY_RESULT
  - *id001

      class in the absence of a population estimate.
inheritance:
- name: Somatic Mosaic
  description: >-
    Almost always sporadic. The causal TEK mutations arise post-zygotically in an
    endothelial-lineage cell, so the disorder is mosaic and not transmitted; the
    multifocal presentation reflects the distribution of the mutant clone rather
    than germline inheritance.
  inheritance_term:
    preferred_term: somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  evidence:
  - reference: PMID:27519652
    reference_title: Blue Rubber Bleb Nevus (BRBN) Syndrome Is Caused by Somatic TEK (TIE2)
      Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: multifocal forms are predominantly caused by double (cis) mutations
    explanation: Establishes the somatic double-mutation architecture underlying multifocal
      disease.
pathophysiology:
- name: Somatic TEK Double Mutation
  description: >-
    A post-zygotic somatic mutation of TEK arises in an endothelial-lineage cell.
    Multifocal disease, including BRBNS, is characteristically driven by double
    mutations in cis - two somatic changes on the same allele - which distinguishes
    it from the single somatic alleles typical of unifocal sporadic venous
    malformation.
  cell_types:
  - preferred_term: vein endothelial cell
    term:
      id: CL:0002543
      label: vein endothelial cell
  evidence:
  - reference: PMID:27519652
    reference_title: Blue Rubber Bleb Nevus (BRBN) Syndrome Is Caused by Somatic TEK (TIE2)
      Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: multifocal forms are predominantly caused by double (cis) mutations
    explanation: Establishes the double cis somatic mutation as the genetic architecture of
      multifocal venous malformation.
  downstream:
  - target: Ligand-Independent TIE2 Activation
    description: The mutant receptor autophosphorylates without angiopoietin ligand.
    evidence:
    - reference: PMID:27519652
      reference_title: Blue Rubber Bleb Nevus (BRBN) Syndrome Is Caused by Somatic TEK (TIE2)
        Mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: both cause ligand-independent activation of TIE2, and increase survival, invasion,
        and colony formation when expressed in human umbilical vein endothelial cells
      explanation: Demonstrates in endothelial cells that the mutations activate TIE2 without
        ligand.
- name: Ligand-Independent TIE2 Activation
  description: >-
    The mutant TIE2 receptor signals constitutively rather than in response to
    angiopoietin. In endothelial cells this increases survival, invasion and
    colony formation, the cellular phenotypes that underlie lesion growth.
  cell_types:
  - preferred_term: vein endothelial cell
    term:
      id: CL:0002543
      label: vein endothelial cell
  biological_processes:
  - preferred_term: Tie signaling pathway
    modifier: INCREASED
    term:
      id: GO:0048014
      label: Tie signaling pathway
  evidence:
  - reference: PMID:27519652
    reference_title: Blue Rubber Bleb Nevus (BRBN) Syndrome Is Caused by Somatic TEK (TIE2)
      Mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: both cause ligand-independent activation of TIE2, and increase survival, invasion,
      and colony formation when expressed in human umbilical vein endothelial cells
    explanation: Establishes constitutive receptor activation and the endothelial phenotypes
      it produces.
  downstream:
  - target: PI3K-AKT-mTOR Pathway Activation
    description: Constitutive TIE2 signalling activates the downstream PI3K-AKT axis.
    evidence:
    - reference: PMID:15526080
      reference_title: Functional analysis of a mutant form of the receptor tyrosine kinase
        Tie2 causing venous malformations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The anti-apoptotic kinase Akt was constitutively activated in cells expressing
        mutant receptor
      explanation: Shows AKT is constitutively active downstream of the mutant receptor.
- name: PI3K-AKT-mTOR Pathway Activation
  description: >-
    Constitutive TIE2 signalling drives the PI3K-AKT-mTOR axis. This is the
    branch point of the disease: it both suppresses endothelial apoptosis and,
    through AKT-dependent regulation of FOXO1, reduces PDGFB expression. It is
    also the node that sirolimus acts on, which is why mTOR inhibition is
    effective across lesion types.
  cell_types:
  - preferred_term: vein endothelial cell
    term:
      id: CL:0002543
      label: vein endothelial cell
  biological_processes:
  - preferred_term: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: INCREASED
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  evidence:
  - reference: PMID:15526080
    reference_title: Functional analysis of a mutant form of the receptor tyrosine kinase Tie2
      causing venous malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Dominant-negative Akt inhibited the pro-survival activity of mutant Tie2
    explanation: Blocking AKT abolishes the pro-survival effect, establishing AKT as the
      required downstream mediator.
  downstream:
  - target: Endothelial Apoptosis Suppression
    description: AKT signalling suppresses endothelial cell death and sustains the lesion.
    evidence:
    - reference: PMID:15526080
      reference_title: Functional analysis of a mutant form of the receptor tyrosine kinase
        Tie2 causing venous malformations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The anti-apoptotic kinase Akt was constitutively activated in cells expressing
        mutant receptor
      explanation: Identifies the anti-apoptotic activity of the constitutively active kinase.
  - target: PDGFB Downregulation and Mural Cell Deficiency
    description: An AKT/FOXO1 axis reduces PDGFB and with it pericyte recruitment.
    evidence:
    - reference: PMID:32867785
      reference_title: AKT/FOXO1 axis links cross-talking of endothelial cell and pericyte
        in TIE2-mutated venous malformations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: RAPA ameliorated the physiological function of mutant ECs by inhibiting AKT-mTOR
        pathway, but also facilitated the nuclear location of FOXO1 and the expression of PDGFB
      explanation: Directly evidences the AKT/FOXO1/PDGFB axis this edge asserts, since inhibiting
        AKT restores FOXO1 nuclear localisation and PDGFB expression.
- name: Endothelial Apoptosis Suppression
  description: >-
    Mutant endothelial cells resist apoptosis and show increased survival,
    invasion and colony formation. The lesion therefore persists and expands
    rather than remodelling.
  cell_types:
  - preferred_term: vein endothelial cell
    term:
      id: CL:0002543

- name: PI3K-AKT-mTOR Pathway Activation
  description: >-
    Constitutive TIE2 signalling drives the PI3K-AKT-mTOR axis. This is the
    branch point of the disease: it both suppresses endothelial apoptosis and,
    through AKT-dependent regulation of FOXO1, reduces PDGFB expression. It is
    also the node that sirolimus acts on, which is why mTOR inhibition is
    effective across lesion types.
  cell_types:

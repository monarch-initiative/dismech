        the sporadic multifocal one.
  notes: >-
    Encodes the endothelial receptor tyrosine kinase TIE2. Somatic activating
    mutations cause the disease, and multifocal presentations including BRBNS are
    characteristically driven by double mutations in cis on the same allele. The
    mutations act by gain of function, producing ligand-independent receptor
    activation.
  evidence:

    id: MONDO:0007203
    label: blue rubber bleb nevus
notes: >-
  Naming: despite "nevus" in the eponym, the lesions are venous malformations,
  not nevi and not tumours. The International Society for the Study of Vascular
  Anomalies classifies the condition among multifocal venous malformations. HPO
  has no venous-malformation term, so the cutaneous phenotype binds the broader
  HP:0025015 Abnormal vascular morphology with a more specific preferred_term;
  the melanocytic HP:0100814 Blue nevus would have been wrong despite matching
  the name.

  The pathograph is organised as a single causal chain from the somatic TEK
  double mutation through constitutive TIE2 activation and PI3K-AKT-mTOR to two
  parallel consequences - suppressed endothelial apoptosis, and PDGFB
  downregulation with mural-cell deficiency - which converge on the ectatic
  vessel and thence on gastrointestinal bleeding. Sirolimus targets the pathway
  node rather than any lesion, which is why it works across sites.

  Known extension points: a datasets section; clinical_trials, including the
  NCT00975819 phase II sirolimus trial; localised intravascular coagulopathy with
  elevated D-dimer as both a diagnostic biomarker and a complication, which the
  research report describes but for which no directly quotable cached source was
  fetched; endoscopic and surgical treatment entries; alpelisib and the
  rapamycin-alpelisib combination as emerging targeted therapy; and the
  additional model systems described in the research report, including an
  endothelium-specific zebrafish model and a genetic mosaic TIE2 p.L914F mouse.

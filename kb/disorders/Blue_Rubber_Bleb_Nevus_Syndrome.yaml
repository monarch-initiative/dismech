differential_diagnoses:
- name: Other TEK-related venous malformations
  description: >-
    Germline cutaneomucosal VMCM, somatic multifocal VM and BRBN share TEK involvement
    but differ in inheritance,
    lesion distribution and typical alleles. A somatic TEK result alone does not resolve
    every boundary presentation.
  evidence:
  - reference: PMID:41327934
    reference_title: A Case of Multifocal Venous Malformation With Two Somatic Pathogenic Variants in the TEK Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Clinically, this case resembled multifocal sporadic VM; however, the genetic
      profile was consistent with
      blue rubber bleb nevus syndrome, suggesting this case may represent an intermediate
      phenotype between
      the two entities.
    explanation: >-
      A tissue-genotyped case illustrates a boundary phenotype; no anemia was reported.
    quote_role: PRIMARY_RESULT
- name: Maffucci syndrome
  description: >-
    Multiple enchondromas support Maffucci syndrome in a person with cutaneous and
    gastrointestinal vascular
    lesions. Gastrointestinal involvement alone is not an absolute discriminator.
  evidence:
  - reference: PMID:15670176
    reference_title: Maffucci's syndrome with extensive gastrointestinal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      However, after recognition of the characteristic enchondromata, this diagnosis
      has been revised to Maffucci's
      syndrome.
    explanation: >-
      A child previously labeled BRBNS was reclassified after skeletal findings.
    quote_role: PRIMARY_RESULT
- name: Glomuvenous malformation
  description: >-
    Glomuvenous lesions have distinct morphology and mural glomus cells. D-dimer is
    often normal, but this
    test is an adjunct rather than a sole diagnostic rule.
  evidence:
  - reference: PMID:19917952
    reference_title: Elevated D-dimer level in the differential diagnosis of venous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Venous malformations: 69/172 patients (40.1%); 5/5 with multifocal sporadic
      VM, 2/2 with BRBN, 62/149
      with a solitary VM, and 0/16 with GVM.
    explanation: >-
      Reports the different D-dimer findings across subgroups in this referral cohort.
    quote_role: PRIMARY_RESULT
- name: PIK3CA-related venous malformations
  description: >-
    PIK3CA can drive other venous malformations through overlapping AKT signaling.
    It is not established as
    a BRBNS diagnostic biomarker by the cited study, and gene-specific clinical and
    histologic differences
    were observed.
  evidence:
  - reference: PMID:26637981
    reference_title: Somatic Activating PIK3CA Mutations Cause Venous Malformation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Nevertheless, significant genotype-phenotype correlations in lesion localization
      and histology are observed
      between individuals with mutations in PIK3CA versus TEK, pointing to gene-specific
      effects.
    explanation: >-
      Contradicts an assertion that these lesions are clinically and histologically
      indistinguishable.
    quote_role: PRIMARY_RESULT

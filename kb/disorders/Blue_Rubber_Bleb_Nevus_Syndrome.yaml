name: Blue Rubber Bleb Nevus Syndrome
creation_date: '2026-08-31T12:00:00Z'
synonyms:
- Bean syndrome
- blue rubber bleb naevus syndrome
- BRBNS
description: >-
  Blue rubber bleb nevus syndrome (BRBNS; Bean syndrome) is a multifocal venous malformation
  disorder, usually
  caused by postzygotic activating TEK variants. Recurrent double mutations in cis
  activate the endothelial
  TIE2 receptor. Cutaneous lesions are soft, blue and compressible; gastrointestinal
  lesions, often involving
  the small bowel, can cause occult or overt bleeding and iron-deficiency anemia.
  Typical skin lesions may
  be sparse or absent, and diagnosis can be delayed. Lesions may also affect deeper
  tissues and other organs,
  and localized intravascular coagulopathy can accompany extensive disease. Management
  combines correction
  of iron deficiency, lesion-directed endoscopic or surgical treatment, and specialist-directed
  systemic sirolimus
  when appropriate. Much of the downstream signaling model derives from other TEK-mutant
  venous malformations
  and must be distinguished from direct BRBNS evidence.
categories:
- Vascular Anomaly
- Venous Malformation
- Somatic Mosaic Disorder
parents:
- venous malformation
prevalence:
- population: Worldwide
  notes: >-
    Population prevalence is unknown. Published case counts and specialist cohorts
    do not provide a population
    denominator.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1967/?report=reader

- name: Residual MET Channel Function from Hypomorphic TMC1 Alleles
  description: >-
    An alternative initiating lesion class. Some recessive TMC1 genotypes - the missense
    alleles p.Asn199Ile, p.Ser596Arg and p.Arg389Gln, and the donor-splice allele c.1404+1G>T
    that skips exon 16 and removes 60 amino acids - segregate with hearing loss that is less
    than profound. The same six-family series also includes a family homozygous for
    p.Arg34Ter, the nonsense founder allele that elsewhere accompanies profound loss, so this
    node is a class of outcome with a characteristic set of alleles rather than a genotype
    rule; allele class does not predict severity on its own. The authors' interpretation is hypo-functional rather than absent
    mechanotransduction channel activity, which places the lesion on the same axis as
    complete loss of function but short of it. This node exists separately because it has its
    own evidence and its own distinct clinical output, and because it is the part of the
    disease where residual hearing, and therefore amplification rather than implantation,
    becomes relevant. The residual-activity interpretation is an inference from the human
    audiometric severity plus the allele class; single-channel recordings have not been
    reported for these specific human alleles.

name: Autosomal Recessive Nonsyndromic Hearing Loss 7
category: Mendelian
creation_date: '2026-11-10T00:00:00Z'
synonyms:
- DFNB7
- DFNB11
- DFNB7/11
- DFNB7/B11
- autosomal recessive nonsyndromic deafness 7
- deafness, autosomal recessive 7
- autosomal recessive deafness 7
- TMC1 autosomal recessive nonsyndromic deafness
- autosomal recessive nonsyndromic deafness caused by mutation in TMC1
description: >-
  DFNB7/11 is congenital, bilateral, nonsyndromic sensorineural hearing loss caused by
  biallelic pathogenic variants in TMC1, the gene encoding the pore-forming subunit of the
  mechanoelectrical transduction (MET) channel at the tips of cochlear hair-cell stereocilia.
  The DFNB7 and DFNB11 loci on chromosome 9q were mapped independently and resolved to the
  same gene when TMC1 was positionally cloned in 2002. Loss of TMC1 removes the channel pore,
  so sound-evoked transduction current never develops in mature auditory hair cells; the hair
  cells then, in mouse models of the disease, fail to acquire their adult electrophysiological
  properties and degenerate; the cochlea produces no sound-evoked neural output. Reported
  recessive genotypes span nonsense, frameshift, splice-site, copy-number, missense and
  in-frame alleles, and the severity is not read off the allele class: truncating and splice
  genotypes usually give severe-to-profound loss from birth, hypomorphic missense and in-frame
  alleles that retain residual channel function are associated with moderate-to-severe or
  moderate-to-profound loss, and the recurrent nonsense allele p.Arg34Ter appears in families
  at both ends of that range. Vestibular function is
  usually described as spared, which mouse work attributes to persistent TMC2 expression in
  vestibular hair cells, but direct human vestibular data are sparse. Management is auditory
  rehabilitation - hearing aids where residual hearing allows, and cochlear implantation for
  severe-to-profound loss, with good reported speech outcomes after early implantation. AAV
  TMC1 gene replacement restores auditory function in mouse models but has not entered human
  trials. The allelic dominant disease DFNA36 (MONDO:0011708), which is postlingual and
  progressive, is a separate entity and is out of scope for this entry.

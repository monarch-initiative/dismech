  - reference: PMID:31761710
    reference_title: >-
      TMC1 and TMC2 Proteins Are Pore-Forming Subunits of Mechanosensitive Ion Channels.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Here we express TMC1 from the green sea turtle (CmTMC1) and TMC2 from the budgerigar
      (MuTMC2) in insect cells, purify and reconstitute the proteins, and show that
      liposome-reconstituted CmTMC1 and MuTMC2 proteins possess ion channel activity.
    explanation: >-
      Reconstitution in liposomes shows that TMC1 alone carries channel activity, so its
      removal removes a channel; the proteins are non-mammalian orthologs, which is the limit
      of this evidence.
- name: Absent Hair Cell Mechanoelectrical Transduction Current
  description: >-
    Without a TMC1 pore, cochlear inner and outer hair cells generate no sound-evoked
    mechanoelectrical transduction current. Nothing compensates in the mature cochlea: Tmc2
    is expressed only transiently in cochlear hair cells after birth, whereas Tmc1 expression
    persists, so the neonatal window in which TMC2 can carry transduction closes. Single
    deletion of Tmc1 in mouse abolishes hearing, and a humanized knock-in of a human recessive
    missense allele is deaf from birth for the same reason. Structurally normal hair bundles
    were reported for the Tmc1/Tmc2 double null rather than for the single null, and TMC
    proteins are in any case required for normal stereociliary bundle development, so this
    node claims loss of the current and not preservation of bundle architecture. The same TMC2 timing is the accepted explanation for the vestibular
    sparing of this disease, because vestibular hair cells keep expressing TMC2 into
    adulthood; that branch is discussed rather than modeled as a causal node, since
    persistence of TMC2 is not caused by the TMC1 lesion.

      abolishing it, which is why this branch ends in a measurable audiogram rather than in no
      response at all. The edge is drawn to the same node as the null branch so that the two
      lesion classes share one consequence, with the degree difference carried by the
      phenotype edges.
    intermediate_mechanisms:
    - >-
      Residual mechanoelectrical transduction current in hair cells carrying a hypomorphic
      allele, with the hair-cell maturation and degeneration steps presumed attenuated rather
      than absent; neither has been measured for these human alleles.
  - target: Moderate hearing impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:

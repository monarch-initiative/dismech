- name: Loss of the TMC1 Pore Subunit from the Stereociliary MET Complex
  description: >-
    TMC1 is the pore-forming subunit of the mechanoelectrical transduction channel and
    localizes, with TMC2, to the tips of the shorter and middle rows of hair-cell
    stereocilia, where transduction occurs. Cysteine-mutagenesis mapping places four
    transmembrane domains, S4 to S7, in the channel pore, and reconstituted TMC1 carries
    mechanically gated ion channel activity on its own. When TMC1 is absent or non-functional
    the complex loses its permeation pathway; the residual scaffold of tip-link and auxiliary
    proteins - PCDH15, LHFPL5, TMIE and CIB2/CIB3 - remains without a conducting channel.

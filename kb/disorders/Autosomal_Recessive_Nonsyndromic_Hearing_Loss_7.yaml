  - reference: PMID:23871232
    reference_title: >-
      TMC1 and TMC2 are components of the mechanotransduction channel in hair cells of the
      mammalian inner ear.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Cells that expressed Tmc2 had high calcium permeability and large single-channel
      currents, while cells with mutant Tmc1 had reduced calcium permeability and reduced

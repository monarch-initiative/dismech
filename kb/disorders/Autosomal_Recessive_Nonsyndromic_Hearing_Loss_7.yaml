- name: Failed Hair Cell Functional Maturation
  description: >-
    Hair cells deprived of transduction current do not complete their postnatal functional
    maturation. In the deafness (dn) mouse, which carries a recessive Tmc1 deletion
    equivalent in class to the human truncating alleles, hair cells appear normal while
    immature and then fail to acquire the potassium currents that mark maturation, and the
    inner hair cell exocytotic machinery retains immature features into adulthood.
    Independent work manipulating the transduction apparatus shows the dependence runs
    through the MET current itself, and that it is also required to maintain the mature
    state, with adult cells reverting towards a pre-hearing phenotype when the current is
    removed. The mouse cochlea matures postnatally while the human cochlea is functional
    before birth, so the timing of this step does not transfer directly to human disease.

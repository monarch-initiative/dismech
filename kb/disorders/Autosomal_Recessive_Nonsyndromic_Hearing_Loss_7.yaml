diagnosis:
- name: Newborn hearing screening and diagnostic audiometry
  description: >-
    Because the loss is congenital and bilateral, affected infants are usually identified by
    universal newborn hearing screening and then characterized by diagnostic auditory
    brainstem response testing and age-appropriate audiometry. Severity is graded by pure-tone
    average, and distortion-product otoacoustic emissions are absent in profound cases because
    outer hair cells do not function. Nothing in the audiogram is specific to TMC1: the
    phenotype is indistinguishable from other congenital severe-to-profound recessive losses,
    so audiometry establishes the deficit and genetic testing establishes the cause.
  diagnosis_term:
    preferred_term: audiometric test
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:34523024
    reference_title: >-
      Prevalence and clinical features of autosomal dominant and recessive TMC1-associated
      hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      pure-tone average calculated from the audiometric thresholds at four frequencies
    explanation: >-
      The measurement by which severity is assigned in this literature, which is what makes
      the degree phenotypes in this entry comparable between cohorts.
  - reference: PMID:35883470
    reference_title: Optimized AAV Vectors for TMC1 Gene Therapy in a Humanized Mouse Model of DFNB7/11.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      ABR and DPOAE thresholds were equivalent to those of wild-type mice across the entire
      frequency range.
    explanation: >-
      Supports the statement that distortion-product otoacoustic emissions are abnormal in
      this disease, by the route available: in the humanized recessive model, DPOAE thresholds
      reached wild-type levels only after gene replacement, so they were not at wild-type
      levels before it. Indirect, and from mouse, because no human DPOAE series for TMC1
      genotypes has been published.
  - reference: PMID:26969326
    reference_title: >-
      Comprehensive genetic testing in the clinical evaluation of 1119 patients with hearing
      loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The diagnostic rate varied considerably based on phenotype and was highest for patients
      with a positive family history of hearing loss or when the loss was congenital and
      symmetric.
    explanation: >-
      Indirect: it supports the diagnostic strategy rather than the test itself - the
      congenital, symmetric, familial presentation of DFNB7/11 is exactly the phenotype with
      the highest molecular yield.
- name: Multigene panel or exome sequencing with copy-number analysis
  description: >-
    Molecular diagnosis is made by a hearing-loss gene panel or exome sequencing, usually
    after GJB2/GJB6 testing, with copy-number analysis included because TMC1 deletions occur.
    In consanguineous families, autozygosity or homozygosity mapping narrows the search
    before sequencing, and targeted single-variant testing is appropriate where a population
    founder allele is known - p.Arg34Ter in Pakistani and Saudi families, p.Arg512Ter in
    Finnish families.
  diagnosis_term:
    preferred_term: hearing loss gene panel or exome sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31854501
    reference_title: >-
      Identification of TMC1 as a relatively common cause for nonsyndromic hearing loss in the
      Saudi population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      we used a combination of autozygome-guided candidate gene mutation analysis and targeted
      next generation sequencing in 366 families with HL previously shown to lack mutations in
      GJB2
    explanation: >-
      The testing strategy that actually finds these families: GJB2 first, then
      autozygosity-guided analysis plus targeted sequencing.
  - reference: PMID:26969326
    reference_title: >-
      Comprehensive genetic testing in the clinical evaluation of 1119 patients with hearing
      loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Testing resulted in identification of the underlying genetic cause for hearing loss in
      440 patients (39%).
    explanation: >-
      The diagnostic yield of comprehensive sequencing in an unselected hearing-loss cohort,
      which is the setting in which a TMC1 diagnosis is made clinically.
  - reference: PMID:34523024
    reference_title: >-
      Prevalence and clinical features of autosomal dominant and recessive TMC1-associated
      hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Next-generation sequencing was performed for the 63 genes reported to cause
      non-syndromic hearing loss as described in a previous report
    explanation: >-
      A worked example of the panel approach, and the method by which this cohort's recessive
      TMC1 genotypes were ascertained.
- name: Prenatal and preimplantation testing for a known familial genotype
  description: >-
    Once both pathogenic TMC1 alleles are known in a family, targeted prenatal diagnosis is
    available and has been reported in practice. This is testing for a known familial
    genotype rather than screening, and it presupposes a completed molecular diagnosis in the
    proband.
  diagnosis_term:
    preferred_term: targeted prenatal variant testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33423255
    reference_title: >-
      [Analysis of TMC1 gene variants and prenatal diagnosis in four Chinese families affected
      with deafness].
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Prenatal diagnosis revealed that none of the fetuses were affected. Follow-up confirmed
      that all newborns had normal hearing.
    explanation: >-
      Prenatal testing for known familial TMC1 variants, carried out in three couples with the
      predicted outcome confirmed after birth.
- name: Temporal bone imaging
  description: >-
    CT or MRI of the temporal bones is part of the work-up of a child with congenital
    severe-to-profound hearing loss, and in DFNB7/11 it is expected to be normal: the lesion is
    molecular, in the hair-cell transduction apparatus, not structural. Its diagnostic value is
    therefore in what it excludes - an enlarged vestibular aqueduct or other inner-ear
    malformation, which points to SLC26A4 rather than TMC1 - and in implant planning. No
    imaging series specific to TMC1 genotypes has been published; the figure below is for a
    pediatric genetic hearing-loss cohort of which one child had a TMC1 diagnosis.
  diagnosis_term:
    preferred_term: temporal bone computed tomography or magnetic resonance imaging
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  evidence:
  - reference: PMID:34744965
    reference_title: >-
      Peripheral Vestibular Dysfunction Is a Common Occurrence in Children With Non-syndromic
      and Syndromic Genetic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      These included magnetic resonance imaging (MRI) of the temporal bones in 39/44 (89%)
      subjects and fine cut non-contrast computed tomography (CT) of the temporal bones in
      39/44 (89%).
    explanation: >-
      Documents the imaging actually performed in the pre-implant work-up of children with
      genetic hearing loss, which is the clinical setting of this row.
  - reference: PMID:34744965
    reference_title: >-
      Peripheral Vestibular Dysfunction Is a Common Occurrence in Children With Non-syndromic
      and Syndromic Genetic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      No imaging abnormalities were identified in 37/44 (84%) subjects, a cochlear abnormality
      was identified in 3/44 (7%), and a cochleo-vestibular abnormality was identified in 4/44
      (9%)
    explanation: >-
      The cohort-level expectation: most children with genetic hearing loss have normal
      temporal-bone imaging. Indirect for this entry because the cohort is mixed-genotype, with
      a single TMC1 child, so the figure supports the expectation rather than a TMC1-specific
      rate.
- name: Preoperative vestibular testing before cochlear implantation
  description: >-
    Vestibular testing - videonystagmography, rotary chair, video head impulse testing and
    vestibular evoked myogenic potentials - is performed before cochlear implantation in
    children with genetic hearing loss. For this disease it is also the only route to human
    data on whether vestibular function is spared, and the result is not the expected one: in
    the one published series with formal preoperative testing, the single TMC1 child had an
    abnormal rotary chair result and is counted as having peripheral vestibular loss, and TMC1
    is one of the six of eight non-syndromic causes in which that series found measurable
    vestibular effects. One child cannot settle the question, and the decisive limitation is
    not the sample size alone: whether that child's genotype was recessive DFNB7/11 or
    dominant DFNA36 is in supplementary material that the cached record does not carry, so the
    observation cannot be attributed to this entry's disease with certainty.
  notes: >-
    No diagnosis_term is bound. NCIT has no vestibular-function-testing term reachable from
    the sources available in this session: the committed cache/ncit/terms.csv contains no term
    whose label matches /vestibular/i, the EBI OLS adapter was unreachable, and NCI EVS REST
    queries `search?term=vestibular+function+test&type=contains`,
    `search?term=Vestibular+Function&type=startsWith` and
    `search?term=vestibular&type=contains&pageSize=40` filtered for
    test/function/nystagm/myogenic/assessment/caloric returned no usable concept. The previous
    draft bound NCIT:C38036 Audiometric Test here, which is misleading for a purely vestibular
    battery, so the binding was dropped in favour of the free-text preferred term above.
    A term request is the right follow-up.
  evidence:
  - reference: PMID:34744965
    reference_title: >-
      Peripheral Vestibular Dysfunction Is a Common Occurrence in Children With Non-syndromic
      and Syndromic Genetic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Vestibular testing included videonystagmography, rotary chair, video head impulse
      testing, and/or vestibular evoked myogenic potentials.
    explanation: >-
      Names the preoperative battery as used in a pediatric cochlear-implant programme, which
      is the clinical setting in which a child with DFNB7/11 would be assessed.
  - reference: PMID:34744965
    reference_title: >-
      Peripheral Vestibular Dysfunction Is a Common Occurrence in Children With Non-syndromic
      and Syndromic Genetic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In particular, we show measurable effects on the peripheral vestibular system for
      mutations in six of eight causes of apparent genetic non-syndromic hearing loss.
    explanation: >-
      The authors' own generalization, and TMC1 is one of the eight non-syndromic causes
      tabulated in that series; its row records an abnormal rotary chair result and counts the
      child as having peripheral vestibular loss. This is the one human vestibular datum for
      the gene, and it points away from sparing rather than towards it.
  - reference: PMID:34744965
    reference_title: >-
      Peripheral Vestibular Dysfunction Is a Common Occurrence in Children With Non-syndromic
      and Syndromic Genetic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The most common cause of non-syndromic HL was due to mutations in GJB2 (n = 13) followed
      by MYO15A (3), MYO6 (2), POU3F4 (2), TMPRSS3 (1), CDH23 (1), TMC1 (1), and ESRRB (1).
    explanation: >-
      Fixes the size of that datum: exactly one TMC1 child, which is why the finding is
      recorded as a counterweight to the sparing claim rather than as its refutation. Indirect
      because the sentence gives the cohort composition rather than the vestibular result.
treatments:
- name: Cochlear Implantation
  description: >-
    Cochlear implantation is the standard intervention for the severe-to-profound loss that
    most DFNB7/11 genotypes produce. The biological rationale is favourable: the lesion is in
    the hair cell, so the spiral ganglion and auditory nerve - the structures an implant
    stimulates - are not the primary target of the disease. Reported outcomes are good. In an
    Italian series of three genotype-confirmed children, speech perception, nonverbal
    cognition and speech performance after implantation were comparable to children with
    DFNB1, and the authors explicitly did not reproduce the variable outcomes reported
    earlier in the literature. The Finnish cohort reports good speech perception in noise
    where diagnosis and rehabilitation were early. Both series are small and the inference
    that spiral ganglion integrity explains the result is from the biology of the lesion
    rather than from histology or electrophysiology in these patients.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_phenotypes:
  - preferred_term: Profound hearing impairment
    term:
      id: HP:0012715
      label: Profound hearing impairment
  - preferred_term: Severe hearing impairment
    term:
      id: HP:0012714
      label: Severe hearing impairment
  target_mechanisms:
  - target: Loss of Sound-Evoked Cochlear Output
    treatment_effect: BYPASSES
    description: >-
      An implant replaces the missing transduction step by stimulating auditory nerve fibres
      directly, so it bypasses the absent cochlear output rather than correcting the hair-cell
      lesion. It does nothing about hair-cell degeneration, which continues.
  evidence:
  - reference: PMID:33352559
    reference_title: >-
      Auditory Outcome after Cochlear Implantation in Children with DFNB7/11 Caused by
      Pathogenic Variants in TMC1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The patients showed an excellent functional outcome after CI; speech perception,
      nonverbal cognition, and speech performance were comparable to those of patients with
      DFNB1 deafness.
    explanation: >-
      Genotype-confirmed DFNB7/11 outcome data benchmarked against the commonest recessive
      deafness, in three children from two families.
  - reference: PMID:33352559
    reference_title: >-
      Auditory Outcome after Cochlear Implantation in Children with DFNB7/11 Caused by
      Pathogenic Variants in TMC1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Our results do not support the variable auditory outcome reported in the literature,
      which may be affected by several social and environmental factors and by the genetic
      background.
    explanation: >-
      The authors' own statement that their results conflict with earlier reports of variable
      outcome, which is why this entry treats implant outcome as good but not uniformly
      established.
  - reference: PMID:35407445
    reference_title: >-
      Clinical and Genetic Characteristics of Finnish Patients with Autosomal Recessive and
      Dominant Non-Syndromic Hearing Loss Due to Pathogenic TMC1 Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      individuals in this cohort who were diagnosed early and received timely hearing
      rehabilitation with hearing aids and cochlear implants (CI) have reached good speech
      perception in noise
    explanation: >-
      A second cohort with good implant outcomes, and the source of the timing qualifier:
      early diagnosis and early rehabilitation are what the good outcomes are associated with.
- name: Hearing Aids
  description: >-
    Amplification is appropriate where residual hearing exists, which in this disease means
    predominantly the hypomorphic genotypes with moderate-to-severe loss. The Finnish cohort
    used hearing aids and implants together across its recessive patients. Devices do not
    alter the cochlear lesion and are a rehabilitation rather than a disease-modifying
    measure.
  therapeutic_modality: DEVICE
  target_phenotypes:
  - preferred_term: Moderate hearing impairment
    term:
      id: HP:0012713
      label: Moderate hearing impairment
  target_mechanisms:
  - target: Residual MET Channel Function from Hypomorphic TMC1 Alleles
    treatment_effect: MODULATES
    description: >-
      Amplification raises the acoustic signal reaching a cochlea that still transduces
      partially, so it exploits the residual channel function of hypomorphic genotypes rather
      than restoring the missing function.
  notes: >-
    No NCIT clinical-action term is bound. Following the repository's device rule, a hearing
    aid is a device rather than a clinical action, and the cochlear-implant row above shows
    the qualifier pattern used when a device accompanies a procedure; fitting an aid is not a
    procedure, so the row carries no treatment_term.
  evidence:
  - reference: PMID:35407445
    reference_title: >-
      Clinical and Genetic Characteristics of Finnish Patients with Autosomal Recessive and
      Dominant Non-Syndromic Hearing Loss Due to Pathogenic TMC1 Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      received timely hearing rehabilitation with hearing aids and cochlear implants
    explanation: >-
      Documents hearing aids as part of the rehabilitation actually delivered to this
      recessive TMC1 cohort, alongside implantation.
- name: Auditory and Speech Rehabilitation
  description: >-
    Habilitation of spoken language accompanies amplification or implantation, and the timing
    of rehabilitation rather than the device alone is what the reported outcomes track.
    Because the loss is prelingual, the intervention window coincides with language
    acquisition.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: auditory and speech rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_phenotypes:
  - preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
  evidence:
  - reference: PMID:35407445
    reference_title: >-
      Clinical and Genetic Characteristics of Finnish Patients with Autosomal Recessive and
      Dominant Non-Syndromic Hearing Loss Due to Pathogenic TMC1 Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Comparison of the genetic data with the outcome of CI rehabilitation increases our
      understanding of the extent to which underlying pathogenic gene variants explain the
      differences in CI rehabilitation outcomes.
    explanation: >-
      Frames rehabilitation outcome as the clinical endpoint of interest in TMC1 hearing loss,
      and the genotype as only one of its determinants.
- name: Genetic Counseling and Carrier Testing
  description: >-
    Counseling covers the 25% recurrence risk for siblings, carrier testing of relatives, and
    reproductive options including prenatal or preimplantation testing for a known familial
    genotype. It is particularly relevant in consanguineous communities and in populations
    carrying a founder allele, which is where most reported families come from.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  notes: >-
    The 25% sibling recurrence risk in the description is the Mendelian expectation for an
    autosomal recessive trait, not a figure measured in a TMC1 cohort, so it carries no
    evidence item.
  evidence:
  - reference: PMID:33423255
    reference_title: >-
      [Analysis of TMC1 gene variants and prenatal diagnosis in four Chinese families affected
      with deafness].
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Prenatal diagnosis was provided for three couples through Sanger sequencing.
    explanation: >-
      Counseling and reproductive testing delivered in practice to families with known
      biallelic TMC1 genotypes.
- name: AAV-Mediated TMC1 Gene Replacement
  description: >-
    Preclinical only. Delivering a wild-type Tmc1 or Tmc2 coding sequence to hair cells with
    adeno-associated viral vectors restores sensory transduction, auditory brainstem
    responses and behavioural responses in Tmc1-mutant mice; later vectors recover inner and
    outer hair cell function, improve hair-cell survival and, in a humanized model carrying
    the equivalent of the human recessive p.N199I allele, bring ABR and DPOAE thresholds to
    wild-type levels across the frequency range. Three caveats carry over to any human
    application. The earliest and most complete rescues were in neonatal mice, a developmental
    stage corresponding to the human fetal inner ear, so the therapeutic window is the central
    translational problem - but it is not a closed one: the same vector partially recovered
    hearing in the recessive Baringo model with later-stage treatment, allele suppression
    worked in the mature Beethoven ear, and rescue has been reported in 2- to 8-week-old mice.
    Over-expression is not simply better: adding a WPRE element to boost Tmc1 expression gave
    inferior outcomes, which makes gene dosage an open design question. And a ClinicalTrials.gov search for TMC1 returned no registered studies, so no
    human efficacy or safety data exist. The allele-specific RNAi and Cas9-editing approaches
    in this literature target dominant DFNA36 alleles and do not apply to recessive loss of
    function.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: AAV TMC1 gene replacement
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: TMC1 Biallelic Loss of Function
    treatment_effect: RESTORES
    description: >-
      Gene augmentation supplies a functional copy of the coding sequence, so it acts at the
      initiating lesion rather than downstream of it. It can only help while hair cells
      survive, which couples its window to the degeneration node.
  evidence:
  - reference: PMID:26157030
    reference_title: Tmc gene therapy restores auditory function in deaf mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Exogenous Tmc1 or its closely related ortholog, Tmc2, were capable of restoring sensory
      transduction, auditory brainstem responses, and acoustic startle reflexes in otherwise
      deaf mice
    explanation: >-
      The founding proof of principle, in mouse models the authors identify as models of
      DFNB7/11 and DFNA36.
  - reference: PMID:35883470
    reference_title: Optimized AAV Vectors for TMC1 Gene Therapy in a Humanized Mouse Model of DFNB7/11.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      We found broad-spectrum, durable recovery of auditory function in Tmc1-p.N193I mice
      injected with AAV9-PHP.B-CB6-hTMC1-WPRE.
    explanation: >-
      The strongest preclinical result for this entry specifically, because the model carries
      the equivalent of a human recessive DFNB7/11 missense allele rather than a null.
  - reference: PMID:36574989
    reference_title: >-
      Mutation-agnostic RNA interference with engineered replacement rescues Tmc1-related
      hearing loss.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      However, WPRE-enhanced Tmc1 expression resulted in inferior outcomes, suggesting a role
      for gene dosage optimization in future TMC1 gene therapy development.
    explanation: >-
      The dosage caution. Indirect for this entry because the construct was tested in a
      dominant DFNA36 model, but the dosage finding is about Tmc1 expression level and
      therefore bears on any replacement strategy.
animal_models:
- name: deafness (dn) mouse
  species: Mouse
  genotype: Tmc1 dn/dn - spontaneous 1.6-kb genomic deletion encompassing exon 14 of Tmc1
  publication: PMID:11850618
  description: >-
    The spontaneous recessive allele that led to the gene. It is the closest available model
    of the human truncating genotypes: homozygotes lack auditory responses, their hair cells
    look normal while immature and then fail to acquire the maturation potassium currents,
    and hair cells degenerate progressively. Because it is a spontaneous deletion rather than
    an engineered human variant, it models the allele class and not any particular human
    variant.
  evidence:
  - reference: PMID:16627570
    reference_title: >-
      Tmc1 is necessary for normal functional maturation and survival of inner and outer hair
      cells in the mouse cochlea.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      The deafness (dn) and Beethoven (Bth) mutant mice are models for profound congenital
      deafness (DFNB7/B11) and progressive hearing loss (DFNA36), respectively
    explanation: >-
      The explicit assignment of this model to the recessive human disease curated here.
  modeled_mechanisms:
  - target: TMC1 Biallelic Loss of Function
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A homozygous genomic deletion removing a coding exon, matching the loss-of-function
      class that dominates the human recessive allelic spectrum.
    limitations: >-
      A spontaneous mouse deletion, not a human variant; allele-specific residual function
      cannot be studied in it.
    evidence:
    - reference: PMID:11850618
      reference_title: >-
        Dominant and recessive deafness caused by mutations of a novel gene, TMC1, required
        for cochlear hair-cell function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        We detected a 1.6-kb genomic deletion encompassing exon 14 of Tmc1 in the recessive
        deafness
      explanation: >-
        Identifies the lesion in this model as a recessive deletion of Tmc1 coding sequence.
  - target: Failed Hair Cell Functional Maturation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Mutant hair cells fail to acquire the potassium currents of functional maturation and
      keep immature exocytotic properties into adulthood.
    limitations: >-
      Mouse cochlear maturation is postnatal whereas the human cochlea is functional before
      birth, so the developmental timing of this step does not transfer.
    readouts:
    - name: Acquisition of maturation potassium currents in inner and outer hair cells
      target: Failed Hair Cell Functional Maturation
      direction: DECREASED
      interpretation: >-
        The currents that define functional maturation are not acquired, which is the
        measurement this node asserts.
      evidence:
      - reference: PMID:16627570
        reference_title: >-
          Tmc1 is necessary for normal functional maturation and survival of inner and outer
          hair cells in the mouse cochlea.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: >-
          From around P8 for OHCs and P12 for IHCs, mutants fail to acquire ... of the K+
          currents which contribute to their normal functional maturation
        explanation: >-
          The readout itself: the maturation potassium currents are not acquired in the
          recessive dn/dn mutant, with the age at which each hair-cell type fails. The ellipsis
          bridges the parenthesised allele list, whose dominant Bth alleles are out of scope
          for this entry.
  - target: Cochlear Hair Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Hair-cell damage and loss progress in the homozygote, with absent compound action
      potentials preceding cell loss.
    limitations: >-
      No human histopathology exists for DFNB7/11, so mouse degeneration is the only evidence
      for this node and its human counterpart remains inferred.
    evidence:
    - reference: PMID:16627570
      reference_title: >-
        Tmc1 is necessary for normal functional maturation and survival of inner and outer
        hair cells in the mouse cochlea.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: Mutant mice exhibited progressive hair cell damage and loss.
      explanation: >-
        The degeneration measurement itself in the Tmc1 mutant, which is the mechanism this
        row claims the model recapitulates.
- name: Tmc1 targeted deletion mouse
  species: Mouse
  genotype: Tmc1 targeted deletion, homozygous
  publication: PMID:22105175
  description: >-
    The engineered null. Homozygotes are deaf with structurally normal hair cells, and
    vestibular function is preserved because vestibular hair cells continue to express TMC2.
    This model is the basis of the vestibular-sparing explanation for the human disease and is
    the recipient for most of the gene-replacement work.
  evidence:
  - reference: PMID:22105175
    reference_title: >-
      Mechanotransduction in mouse inner ear hair cells requires transmembrane channel-like
      genes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Tmc2 expression was transient in early postnatal mouse cochlear hair cells but persisted
      in vestibular hair cells.
    explanation: >-
      The expression-timing result that explains why this single-null model is deaf with
      preserved balance, which is what makes it the usable model of the human disease.
  modeled_mechanisms:
  - target: Absent Hair Cell Mechanoelectrical Transduction Current
    relationship: PARTIALLY_RECAPITULATES
    fidelity: HIGH
    description: >-
      Cochlear transduction is lost in the mature cochlea while vestibular transduction
      survives, which is the organ-selective pattern of the human disease.
    limitations: >-
      Complete loss of all hair-cell mechanotransduction requires deleting Tmc2 as well, so
      the single null is informative for the cochlea and understates the in vitro channel
      biology; it is "partial" in that sense rather than in auditory severity.
    evidence:
    - reference: PMID:22105175
      reference_title: >-
        Mechanotransduction in mouse inner ear hair cells requires transmembrane channel-like
        genes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Since the identity of these ion channels is unknown, and mutations in the gene
        encoding transmembrane channel-like 1 (TMC1) cause hearing loss without vestibular
        dysfunction in both mice and humans, we investigated the contribution of Tmc1 and the
        closely related Tmc2 to mechanotransduction in mice.
      explanation: >-
        States the organ-selective phenotype shared by mouse and human, which is what this
        model recapitulates and why it was built.
- name: Tmc1 Tmc2 double knockout mouse
  species: Mouse
  genotype: Tmc1 and Tmc2 double targeted deletion, homozygous for both
  publication: PMID:22105175
  description: >-
    The double null abolishes all hair-cell mechanotransduction and adds profound vestibular
    dysfunction. It is the decisive experiment for the channel's identity and for TMC2
    redundancy, but it over-models the human disease: people with biallelic TMC1 variants
    retain TMC2, so the vestibular arm of this phenotype is not part of DFNB7/11.
  evidence:
  - reference: PMID:22105175
    reference_title: >-
      Mechanotransduction in mouse inner ear hair cells requires transmembrane channel-like
      genes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      mice had profound vestibular dysfunction, deafness, and structurally normal hair cells
      that lacked all mechanotransduction activity
    explanation: >-
      The double-null result: all mechanotransduction lost, with vestibular dysfunction added
      to deafness, which is both why this model settled the channel's identity and the respect
      in which it exceeds the human disease. The quote starts after the parenthesised genotype
      abbreviations given in this model's genotype field.
  modeled_mechanisms:
  - target: Absent Hair Cell Mechanoelectrical Transduction Current
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Complete loss of mechanotransduction in structurally normal hair cells, rescued by
      re-expressing either TMC protein.
    limitations: >-
      Humans with DFNB7/11 have intact TMC2, so the vestibular dysfunction of this genotype
      is an artefact of the model with respect to the human disease.
    evidence:
    - reference: PMID:22105175
      reference_title: >-
        Mechanotransduction in mouse inner ear hair cells requires transmembrane channel-like
        genes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        mice had profound vestibular dysfunction, deafness, and structurally normal hair cells
        that lacked all mechanotransduction activity
      explanation: >-
        The double-null phenotype: complete loss of mechanotransduction with intact hair-cell
        structure, plus the vestibular dysfunction that makes this genotype an over-model of
        the human disease. The quote begins after the parenthesised genotype abbreviations,
        which are given in this model's genotype field.
    - reference: PMID:22105175
      reference_title: >-
        Mechanotransduction in mouse inner ear hair cells requires transmembrane channel-like
        genes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Expression of either exogenous TMC1 or TMC2 rescued mechanotransduction in ... mutant
        hair cells.
      explanation: >-
        The rescue arm of the same experiment, which establishes that the absent transduction
        is caused by the missing TMC proteins and is reversible in principle. The ellipsis
        bridges the parenthesised double-null genotype.
- name: Humanized Tmc1 p.N193I knock-in mouse
  species: Mouse
  genotype: Tmc1 p.N193I knock-in, homozygous - equivalent of human TMC1 p.Asn199Ile
  publication: PMID:35883470
  description: >-
    The only model carrying the mouse equivalent of a human DFNB7/11 recessive allele. It has
    profound congenital hearing loss through loss of hair-cell transduction and was built as
    a gene-therapy testbed, which also makes it the model whose translational limits matter
    most: the mouse cochlea matures after birth while the human cochlea does not, so the
    injection window that works here has no straightforward human equivalent.
  evidence:
  - reference: PMID:35883470
    reference_title: Optimized AAV Vectors for TMC1 Gene Therapy in a Humanized Mouse Model of DFNB7/11.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      TMC1 forms the mechanosensory transduction channel in mice and humans and is necessary
      for auditory function.
    explanation: >-
      The premise on which this humanized model was built, and the cross-species claim that
      makes a mouse knock-in of a human allele informative.
  modeled_mechanisms:
  - target: Absent Hair Cell Mechanoelectrical Transduction Current
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A human missense allele, in its mouse equivalent, produces profound congenital deafness
      specifically through loss of hair-cell sensory transduction.
    limitations: >-
      Cochlear development is postnatal in mouse and prenatal in human, which limits what the
      model says about the timing of any intervention.
    evidence:
    - reference: PMID:35883470
      reference_title: Optimized AAV Vectors for TMC1 Gene Therapy in a Humanized Mouse Model of DFNB7/11.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        To further develop inner-ear gene therapy, we engineered a novel mouse model bearing a
        human mutation in the transmembrane channel-1 gene (Tmc1) and characterized the
        auditory phenotype of the mice.
      explanation: >-
        Identifies the model as a humanized knock-in built on a human TMC1 mutation, which is
        what gives it high fidelity for this entry.
- name: Baringo mouse
  species: Mouse
  genotype: Tmc1 Baringo recessive allele, homozygous
  publication: PMID:33212302
  description: >-
    A recessive Tmc1 hearing-loss model, and the one that matters most for the therapeutic
    window: AAV9-PHP.B Tmc1 replacement partially recovered hearing in it even when given at a
    later stage, where the same vector in the Tmc1 knockout was effective neonatally. It is
    therefore the counterexample to the claim that rescue is confined to the neonatal cochlea,
    and the recessive counterpart of the adult-treated Beethoven work. The cached abstract does
    not state the Baringo allele's identity or the treatment age, so neither is asserted here.
  modeled_mechanisms:
  - target: TMC1 Biallelic Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      A recessive Tmc1 allele producing hearing loss, used as the recessive test bed for
      delayed gene replacement.
    limitations: >-
      The abstract names the model without characterising its allele, so its allele class
      relative to the human truncating and hypomorphic genotypes cannot be stated from the
      cache; the treatment age described only as "later-stage" is likewise not quantified
      there.
    evidence:
    - reference: PMID:33212302
      reference_title: >-
        Single and Dual Vector Gene Therapy with AAV9-PHP.B Rescues Hearing in Tmc1 Mutant Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        The same treatment in a recessive Tmc1 hearing-loss model, Baringo, partially recovers
        hearing even with later-stage treatment.
      explanation: >-
        Identifies Baringo as a recessive Tmc1 model and records the partial rescue after
        later-stage treatment, which is the finding that makes this row worth carrying.
  evidence:
  - reference: PMID:33212302
    reference_title: >-
      Single and Dual Vector Gene Therapy with AAV9-PHP.B Rescues Hearing in Tmc1 Mutant Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Efficient rescue of outer hair cell function and lack of hearing recovery with
      later-stage treatment remain issues to be solved.
    explanation: >-
      States the problem this model was used to attack - recovery after later-stage treatment -
      which is why it is the relevant model for the translational-window discussion.
- name: Beethoven (Bth) mouse
  species: Mouse
  genotype: Tmc1 Bth - dominant missense p.Met412Lys, heterozygous and homozygous
  publication: PMID:11850623
  description: >-
    Recorded here as a negative control rather than as a model of this disease. Bth carries a
    dominant missense allele orthologous to the human DFNA36 variant p.Met418Lys and models
    progressive postlingual hearing loss. It is the most widely used TMC1 model in
    gene-therapy work, so results obtained in it are routinely cited in TMC1 therapy
    discussions; for DFNB7/11 the inheritance class and the clinical course are both wrong,
    and conclusions from it transfer only where the mechanism is allele-independent.
  evidence:
  - reference: PMID:11850623
    reference_title: Beethoven, a mouse model for dominant, progressive hearing loss DFNA36.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Here we describe the phenotype of the Beethoven (Bth) mouse mutant and a missense
      mutation in Tmc1 (transmembrane cochlear-expressed gene 1).
    explanation: >-
      Identifies what this model is - a dominant missense allele of Tmc1 - which is the fact
      that puts it outside this entry's recessive loss-of-function disease.
  modeled_mechanisms:
  - target: TMC1 Biallelic Loss of Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Bth is a dominant, channel-altering allele, not a biallelic loss of function, and the
      phenotype it produces is progressive rather than congenital.
    limitations: >-
      Any inference from Bth to DFNB7/11 has to be justified at the level of mechanism;
      allele-specific strategies developed in it, such as RNAi and Cas9 editing of the mutant
      allele, do not apply to recessive loss of function at all.
    evidence:
    - reference: PMID:11850623
      reference_title: Beethoven, a mouse model for dominant, progressive hearing loss DFNA36.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Progressive hearing loss (DFNA36) and profound congenital deafness (DFNB7/B11) are
        caused by dominant and recessive mutations of the human ortholog, TMC1
      explanation: >-
        The paper's own framing separates the dominant disease it models from the recessive
        disease this entry curates.
- name: Zebrafish tmc1, tmc2a and tmc2b mutants
  species: Zebrafish
  genotype: CRISPR-generated single, double and triple tmc1/tmc2a/tmc2b mutants
  publication: PMID:32167554
  description: >-
    A comparative model showing that subunit requirements are not conserved: zebrafish
    hearing does not require Tmc1 specifically, and only the triple mutant is deaf. It is
    useful for channel biology and as a caution against reading subunit requirements across
    species, and it is not a model of the human disease.
  evidence:
  - reference: PMID:32167554
    reference_title: Tmc proteins are essential for zebrafish hearing where Tmc1 is not obligatory.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Hearing however is absent in triple-mutant zebrafish that lack Tmc1, Tmc2a and Tmc2b.
    explanation: >-
      Zebrafish hearing needs some Tmc protein but not Tmc1 specifically, which is the
      species difference that limits this model.
  modeled_mechanisms:
  - target: Loss of the TMC1 Pore Subunit from the Stereociliary MET Complex
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Loss of tmc1 alone does not abolish zebrafish hearing, because tmc2a and tmc2b are
      redundant with it in that organ.
    limitations: >-
      Species-specific subunit redundancy, so the model cannot be used to argue about the
      consequences of human TMC1 loss.
    evidence:
    - reference: PMID:32167554
      reference_title: Tmc proteins are essential for zebrafish hearing where Tmc1 is not obligatory.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Surprisingly, our approach using multiple mutant alleles demonstrates that hearing in
        zebrafish is not dependent on Tmc1, nor is it fully dependent on Tmc2a and Tmc2b.
      explanation: >-
        Refutes the proposition that this model reproduces the human lesion's consequence:
        zebrafish hearing survives loss of Tmc1.
differential_diagnoses:
- name: Autosomal dominant nonsyndromic hearing loss 36 (DFNA36)
  description: >-
    The allelic disease, caused by heterozygous channel-altering TMC1 variants. It is the
    differential that matters most, because the gene is the same and only the genotype and
    the clinical course separate them: DFNA36 is postlingual and progressive with
    high-frequency predominance, while DFNB7/11 is congenital and severe-to-profound. A
    heterozygous TMC1 variant in a child with congenital profound loss is therefore not a
    DFNB7/11 diagnosis until the second allele is found.
  evidence:
  - reference: PMID:34523024
    reference_title: >-
      Prevalence and clinical features of autosomal dominant and recessive TMC1-associated
      hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      TMC1-associated ARNSHL cases show congenital severe-to-profound hearing loss, whereas
      ADNSHL cases show late-onset progressive hearing loss with predominant deterioration in
      the higher frequencies.
    explanation: The clinical discriminator between the two TMC1 diseases, in one sentence.
- name: GJB2-related nonsyndromic hearing loss (DFNB1)
  description: >-
    The commonest recessive nonsyndromic hearing loss, and the test that precedes TMC1
    analysis in practice rather than a diagnosis distinguished from it clinically. Cohorts
    that find TMC1 are usually GJB2-negative by design, and implant outcomes in DFNB7/11 are
    benchmarked against DFNB1. The two are separated by genotype, not by audiogram.
  evidence:
  - reference: PMID:31854501
    reference_title: >-
      Identification of TMC1 as a relatively common cause for nonsyndromic hearing loss in the
      Saudi population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      we used a combination of autozygome-guided candidate gene mutation analysis and targeted
      next generation sequencing in 366 families with HL previously shown to lack mutations in
      GJB2
    explanation: >-
      Shows the practical ordering: GJB2 is excluded first, and TMC1 is sought in what remains.
  - reference: PMID:33352559
    reference_title: >-
      Auditory Outcome after Cochlear Implantation in Children with DFNB7/11 Caused by
      Pathogenic Variants in TMC1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      speech perception, nonverbal cognition, and speech performance were comparable to those
      of patients with DFNB1 deafness
    explanation: >-
      Indirect for the differential itself: it shows the two diseases are compared rather than
      distinguished on outcome, which is why genotype is the only discriminator.
- name: OTOF-related auditory neuropathy spectrum disorder (DFNB9)
  description: >-
    The differential that changes management. DFNB9 is a presynaptic ribbon-synapse disorder
    in which outer hair cells work, so otoacoustic emissions are initially present and
    newborn OAE-based screening can pass an affected child, whereas in DFNB7/11 the outer
    hair cells themselves are non-functional. A child with absent ABR and preserved OAEs is a
    candidate for OTOF testing rather than TMC1 testing, and the distinction also matters
    because OTOF gene therapy has reached human trials while TMC1 gene therapy has not.
  evidence:
  - reference: PMID:33256196
    reference_title: "The Many Faces of DFNB9: Relating OTOF Variants to Hearing Impairment."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      As is true for all forms of auditory neuropathy or synaptopathy, newborn hearing
      screening that tests for OAEs, e.g., with distortion product otoacoustic emissions
      (DPOAEs) or transient evoked otoacoustic emissions (TEOAEs), fail to detect a hearing
      disorder in most cases, as OAEs are initially present.
    explanation: >-
      The audiological discriminator: emissions are preserved in otoferlin deficiency, which
      is the opposite of the profound DFNB7/11 phenotype in which outer hair cell function is
      lost. Evidence source is OTHER because this is a review.
- name: SLC26A4-related sensorineural hearing loss (DFNB4 / Pendred syndrome)
  description: >-
    The other differential that changes management. Like DFNB7/11 it reaches
    severe-to-profound bilateral loss in early childhood, but it comes with an inner ear
    malformation, fluctuating and sometimes progressive thresholds, vestibular symptoms and,
    in Pendred syndrome, thyroid involvement - so it is identified on imaging and followed
    differently. Temporal-bone imaging is the step that separates them, since it is expected
    to be normal in DFNB7/11.
  evidence:
  - reference: PMID:20301640
    reference_title: SLC26A4-Related Sensorineural Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Manifestations of vestibular dysfunction (such as head-tilting, vomiting, and/or delayed
      ambulation or clumsiness in a child who previously walked well) can precede or accompany
      the fluctuations in hearing typical of this disorder.
    explanation: >-
      The clinical features that distinguish this disease from DFNB7/11 - fluctuating hearing
      and overt vestibular manifestations - in a GeneReviews chapter for the differential
      disease.
  - reference: PMID:20301640
    reference_title: SLC26A4-Related Sensorineural Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      characterized by inner ear malformations also associated with vestibular dysfunction
    explanation: >-
      The structural finding that makes temporal-bone imaging the discriminating test, since
      imaging is expected to be normal in DFNB7/11.
- name: Other recessive nonsyndromic hearing-loss genes and Usher syndrome
  description: >-
    MYO15A, CDH23, TMPRSS3 and the rest of the DFNB series present with the same congenital
    severe-to-profound bilateral audiogram and are distinguished only by genotype, which is
    why a multigene panel rather than sequential single-gene testing is the diagnostic route.
    Usher syndrome types 1 and 2 belong on the list as the syndromic possibility that a
    nonsyndromic diagnosis must exclude: type 1 adds congenital vestibular areflexia and
    retinitis pigmentosa, and CDH23 and PCDH15 cause both nonsyndromic and Usher phenotypes.
    This entry does not assert retinal findings in TMC1 disease; the one 2025 report proposing
    a syndromic expansion of the TMC1 spectrum is a single family and states its claim as a
    proposal.
  evidence:
  - reference: PMID:26969326
    reference_title: >-
      Comprehensive genetic testing in the clinical evaluation of 1119 patients with hearing
      loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Pathogenic variants were found in 49 genes
    explanation: >-
      The genetic heterogeneity that defines this differential: 49 genes carried the causative
      variants in one clinical cohort, so the audiogram cannot select among them.
  - reference: PMID:40100472
    reference_title: >-
      Whole exome sequencing diagnosing syndromic and non-syndromic hearing loss with
      expansion of the phenotypic spectrum related to TMC1 variants.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      as well as possible expansion of the phenotypic spectrum of the TMC1 gene
    explanation: >-
      The one report proposing a syndromic expansion of the TMC1 phenotype states it as a
      possible expansion, from a single family, so no syndromic phenotype is asserted in this
      entry and the syndromic conditions remain differentials rather than features.
discussions:
- discussion_id: dfnb7_what_kills_the_hair_cells
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does loss of the mechanotransduction current by itself kill cochlear hair cells in
    recessive TMC1 null genotypes, or is a separate TMC1-dependent survival function
    involved?
  rationale: >-
    The pathograph links absent transduction to hair-cell degeneration with an edge marked
    INDIRECT_UNKNOWN_INTERMEDIATES, and that marking is the honest state of the literature
    rather than a placeholder. Three positions are live. First, loss of current alone could
    be sufficient: the MET current is required to establish and then to maintain the mature
    inner hair cell, and adult cells revert towards a pre-hearing phenotype when it is
    removed, so a cell deprived of it from the start never reaches a stable mature state.
    Second, TMC1 might have a function beyond the pore: the 2006 characterization of the dn
    mouse, written before the channel role was established, proposed trafficking or an
    intracellular regulatory signal, and nothing has formally excluded an additional role
    even though the pore function is now settled. Third, the one worked-out death pathway -
    reduced stereociliary PMCA2 density, raised hair-bundle calcium, mitochondrial
    dysfunction, scramblase activity and apoptosis - was demonstrated in semidominant Tmc1
    alleles whose hair cells still had MET current at postnatal day 6, which is precisely
    the configuration a null genotype does not have. So the best-characterized route to hair
    cell death in Tmc1 mutants is the one least applicable to this entry's disease. The
    rescue experiments bound the question from the other side: restoring Tmc1 improves
    hair-cell survival, so whatever the route, it is downstream of the gene lesion and is
    interruptible while cells remain.
  attaches_to:
  - disease#Autosomal Recessive Nonsyndromic Hearing Loss 7
  - pathophysiology#Absent Hair Cell Mechanoelectrical Transduction Current
  - pathophysiology#Cochlear Hair Cell Degeneration
  proposed_experiments:
  - experiment_id: dfnb7_apoptosis_panel_in_null_hair_cells
    experiment_design: DESCRIPTIVE_PROFILING
    name: Apoptosis assay panel in Tmc1 null and humanized p.N193I hair cells
    description: >-
      Apply the postnatal day 6 assay panel used for the semidominant alleles - Calcein-AM,
      MitoTracker, MitoLight and Annexin V - to Tmc1 null and humanized p.N193I hair cells,
      which have no MET current at any age, and ask whether mitochondrial dysfunction and
      scramblase activity appear on the same schedule as in the conducting mutants.
    readouts:
    - name: Mitochondrial membrane potential and phosphatidylserine externalization at P6
      target: pathophysiology#Cochlear Hair Cell Degeneration
      interpretation: >-
        Early apoptotic signal in a genotype with no current would show that absent
        transduction is sufficient; its absence would place the published calcium route
        outside this entry's genotypes.
  - experiment_id: dfnb7_pmca2_density_in_null
    experiment_design: TARGETED_PERTURBATION
    name: Stereociliary PMCA2 density in a Tmc1 null cochlea
    description: >-
      Quantify stereociliary PMCA2 in Tmc1 null hair bundles. If reduced PMCA2 density
      requires a conducting mutant channel, it should be normal in the null, which separates
      the calcium route from the null phenotype curated here.
    readouts:
    - name: PMCA2 immunolabel density in hair bundles
      target: pathophysiology#Cochlear Hair Cell Degeneration
      interpretation: >-
        Normal PMCA2 in the null would confine the PMCA2/calcium mechanism to semidominant
        alleles.
  - experiment_id: dfnb7_protein_versus_current_deprivation
    experiment_design: TARGETED_PERTURBATION
    name: Conditional Tmc1 deletion versus pharmacological MET block
    description: >-
      Compare hair-cell survival after conditional Tmc1 deletion at successive postnatal ages
      with survival after pharmacological block of the MET channel over the same interval, to
      ask whether absence of the protein and absence of the current have the same consequence.
    readouts:
    - name: Hair cell counts along the cochlear spiral after each manipulation
      target: pathophysiology#Cochlear Hair Cell Degeneration
      interpretation: >-
        Equivalent loss would support current deprivation as the whole mechanism; greater
        loss without the protein would imply an additional TMC1-dependent survival function.
  evidence:
  - reference: PMID:40100636
    reference_title: Hair cell apoptosis and deafness in Tmc1 mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      These markers demonstrated mitochondrial dysfunction in Tmc1 mutants, even at P6 when
      MET currents were still present.
    explanation: >-
      The observation that creates the gap: in these alleles hair-cell death is already
      under way while transduction current persists, so current loss is not the trigger
      there - and it cannot be assumed to be the trigger in nulls either.
  - reference: PMID:40100636
    reference_title: Hair cell apoptosis and deafness in Tmc1 mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Two methods of blocking the stereociliary PMCA2 Ca2+ pump both elicited scramblase
      activity, suggesting that apoptosis is promoted by elevation of hair bundle [Ca2+].
    explanation: >-
      The proposed death route in its strongest experimental form. Indirect for this entry
      because the genotypes studied were semidominant and retained channel function.
  - reference: PMID:30108254
    reference_title: >-
      Transgenic Tmc2 expression preserves inner ear hair cells and vestibular function in
      mice lacking Tmc1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      We conclude that TMC1 provides some additional necessary function, not provided by TMC2.
    explanation: >-
      The strongest current support for the second position: TMC2 can carry transduction in
      the cochlea yet does not preserve hearing, so TMC1 contributes something beyond a
      conducting pore. The experiment does not say what that function is, which is why the
      position remains open rather than established.
  - reference: PMID:16627570
    reference_title: >-
      Tmc1 is necessary for normal functional maturation and survival of inner and outer hair
      cells in the mouse cochlea.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      We propose that Tmc1 is involved in trafficking of molecules to the plasma membrane or
      serves as an intracellular regulatory signal for differentiation of immature hair cells
      into fully functional auditory receptors.
    explanation: >-
      The non-channel hypothesis, stated by the authors of the dn-mouse characterization
      before TMC1 was shown to form the pore. It is cited as a historical alternative that
      has been superseded as the primary mechanism, not as a competing account of the pore.
  - reference: PMID:33212302
    reference_title: >-
      Single and Dual Vector Gene Therapy with AAV9-PHP.B Rescues Hearing in Tmc1 Mutant Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Here, we demonstrate that AAV9-PHP.B gene therapy can promote hair cell survival and
      successfully rescues hearing in three distinct mouse models of hearing loss.
    explanation: >-
      Bounds the question from the intervention side: hair-cell death in Tmc1 mutants is
      preventable by supplying the gene, so it is a consequence of the lesion whatever the
      intervening steps are.
- discussion_id: dfnb7_vestibular_sparing_human_evidence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is vestibular function normal in people with biallelic TMC1 variants, and does the mouse
    TMC2-persistence explanation hold in humans, given that the one child who was formally
    tested had peripheral vestibular loss?
  rationale: >-
    Vestibular sparing is one of the most frequently repeated statements about this disease
    and one of the least directly measured, and the only formal human measurement points the
    other way. The mechanism offered is specific and testable: cochlear Tmc2 expression is
    transient after birth whereas vestibular Tmc2 expression persists, so vestibular hair
    cells retain a functional channel when TMC1 is lost. In mouse the supporting evidence is
    strong - single Tmc1 deletion is deaf with preserved balance, the double null adds
    profound vestibular dysfunction, and inducible TMC2 expression restores vestibular
    transduction and balance without restoring hearing. The human side does not match. The
    largest clinical cohort reports that most TMC1-associated patients had no vestibular
    symptoms, but it records symptoms rather than test results and is dominated by dominant
    DFNA36 cases. The one pediatric series with formal preoperative vestibular testing
    contains a single TMC1 child, and that child had an abnormal rotary chair result and is
    counted as having peripheral vestibular loss; TMC1 is among the six of eight non-syndromic
    causes in which that series found measurable vestibular effects, and peripheral vestibular
    loss affected about half of its non-syndromic group overall. One child does not refute
    sparing, and the limitation that actually prevents it from doing so is not the sample size
    but the attribution: the genotype class of that child - recessive DFNB7/11 or dominant
    DFNA36 - sits in supplementary material the cached record does not carry, so the finding
    cannot be assigned to this entry's disease with certainty. What can be said is that the
    human default should not be "normal": the prior from the same series is that peripheral
    vestibular loss is common in genetic hearing loss, and the one relevant measurement is
    abnormal. This matters clinically, because balance assessment before implantation and
    motor-milestone surveillance in infancy depend on it, and mechanistically, because the
    human relevance of the whole TMC2-redundancy argument is what is being assumed.
  attaches_to:
  - disease#Autosomal Recessive Nonsyndromic Hearing Loss 7
  - pathophysiology#Absent Hair Cell Mechanoelectrical Transduction Current
  - diagnosis#Preoperative vestibular testing before cochlear implantation
  proposed_experiments:
  - experiment_id: dfnb7_human_vestibular_phenotyping
    experiment_design: HUMAN_OBSERVATIONAL
    name: Vestibular phenotyping of a genotype-confirmed biallelic TMC1 series
    description: >-
      Video head impulse testing, vestibular evoked myogenic potentials, rotary chair testing
      and age-appropriate motor milestones in a consecutive series of genotype-confirmed
      biallelic TMC1 patients, reported by genotype class rather than pooled with other
      hearing-loss genes.
    readouts:
    - name: Vestibular function test results by TMC1 genotype class
      target: disease#Autosomal Recessive Nonsyndromic Hearing Loss 7
      interpretation: >-
        Normal results across a series would convert the mouse-derived sparing claim into a
        human finding; abnormal results would make the disease vestibulo-cochlear rather than
        purely auditory.
  - experiment_id: dfnb7_human_tmc2_expression_timing
    experiment_design: DESCRIPTIVE_PROFILING
    name: TMC2 expression timing in human vestibular and cochlear tissue
    description: >-
      Measure TMC2 transcript and protein in human vestibular and cochlear sensory epithelium
      across development, since the redundancy argument rests entirely on an expression-timing
      difference established in mouse.
    readouts:
    - name: TMC2 transcript and protein level by inner-ear organ and developmental stage
      target: pathophysiology#Absent Hair Cell Mechanoelectrical Transduction Current
      interpretation: >-
        Persistent vestibular and transient cochlear expression in human tissue would
        transfer the mouse explanation; similar timing in both organs would remove it.
  evidence:
  - reference: PMID:22105175
    reference_title: >-
      Mechanotransduction in mouse inner ear hair cells requires transmembrane channel-like
      genes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Our data also suggest that persistent TMC2 expression in vestibular hair cells may
      preserve vestibular function in humans with hearing loss caused by TMC1 mutations.
    explanation: >-
      The explanation as its authors state it, with their own hedge: a suggestion extended
      from mouse expression timing to humans, not a human measurement.
  - reference: PMID:30108254
    reference_title: >-
      Transgenic Tmc2 expression preserves inner ear hair cells and vestibular function in
      mice lacking Tmc1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      The cellular rescue leads to recovery of balance but not auditory function.
    explanation: >-
      The cleanest demonstration that TMC2 can sustain vestibular but not mature cochlear
      function, which is the asymmetry the sparing argument needs.
  - reference: PMID:34523024
    reference_title: >-
      Prevalence and clinical features of autosomal dominant and recessive TMC1-associated
      hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Most of the TMC1-associated HL patients identified in this study did not have vestibular
      symptoms and only two patients had episodes of vertigo.
    explanation: >-
      The largest human observation available, and a weak one for this entry: it records
      symptoms rather than vestibular function tests, and the cohort is mostly dominant
      DFNA36 cases rather than the recessive genotypes curated here.
  - reference: PMID:34744965
    reference_title: >-
      Peripheral Vestibular Dysfunction Is a Common Occurrence in Children With Non-syndromic
      and Syndromic Genetic Hearing Loss.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In particular, we show measurable effects on the peripheral vestibular system for
      mutations in six of eight causes of apparent genetic non-syndromic hearing loss.
    explanation: >-
      Refutes the generalization that TMC1 hearing loss spares the vestibular system, as far as
      one tested child can: TMC1 is one of the eight causes tabulated, its row records an
      abnormal rotary chair result, and the paper counts that child as having peripheral
      vestibular loss.
  - reference: PMID:34744965
    reference_title: >-
      Peripheral Vestibular Dysfunction Is a Common Occurrence in Children With Non-syndromic
      and Syndromic Genetic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Overall, the rate of PVL was slightly higher in the syndromic vs. the non-syndromic group
      (60 and 49%, respectively).
    explanation: >-
      The base rate that sets the prior: about half of children with non-syndromic genetic
      hearing loss in this series had peripheral vestibular loss, so normal vestibular function
      is not the default expectation for an untested TMC1 cohort.
- discussion_id: dfnb7_beethoven_allele_scope
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    How much of the TMC1 therapeutic and mechanistic literature built on the Beethoven mouse
    applies to recessive DFNB7/11?
  rationale: >-
    Beethoven is the most-used TMC1 mouse, and it models the wrong disease for this entry. It
    carries a dominant missense allele orthologous to the human DFNA36 variant p.Met418Lys
    and produces progressive, higher-frequency-predominant loss, which is why it became the
    standard testbed for translational hearing-loss work. Two consequences follow. First, the
    allele-specific strategies developed in it do not transfer at all: RNAi suppression of the
    mutant allele and allele-specific Cas9 disruption both depend on there being a mutant
    allele to silence, and a recessive null genotype has nothing to silence and no wild-type
    copy to protect. Second, the findings that are about delivery, dosage, timing or hair-cell
    survival rather than about the allele do carry over, but each needs that justification
    stated rather than assumed. The mutation-agnostic RNAi-plus-replacement construct is the
    interesting middle case: it was tested in the dominant model, yet its finding that
    WPRE-boosted Tmc1 expression gave worse outcomes is a statement about Tmc1 dosage and
    therefore bears on recessive replacement too. The curation rule applied in this entry is
    that a Beethoven result is cited only where the mechanism being claimed is
    allele-independent, and the Beethoven model itself is recorded with
    FAILS_TO_RECAPITULATE so the mismatch is visible in the graph rather than only in prose.
  attaches_to:
  - disease#Autosomal Recessive Nonsyndromic Hearing Loss 7
  - animal_models#Beethoven (Bth) mouse
  - treatments#AAV-Mediated TMC1 Gene Replacement
  evidence:
  - reference: PMID:11850623
    reference_title: Beethoven, a mouse model for dominant, progressive hearing loss DFNA36.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Here we describe the phenotype of the Beethoven (Bth) mouse mutant and a missense
      mutation in Tmc1 (transmembrane cochlear-expressed gene 1).
    explanation: >-
      Identifies the model's allele as a dominant missense variant, which is the basis of the
      scope limit discussed here.
  - reference: PMID:30686588
    reference_title: >-
      Targeted Allele Suppression Prevents Progressive Hearing Loss in the Mature Murine Model
      of Human TMC1 Deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      we show that RNAi-mediated gene silencing can slow progression of hearing loss, improve
      inner hair cell survival, and prevent stereocilia bundle degeneration in the mature
      Beethoven mouse, a model of human TMC1 deafness
    explanation: >-
      An allele-suppression result obtained in the dominant model. It is cited here to mark
      what does not transfer: there is no mutant transcript to silence in a recessive null
      genotype.
  - reference: PMID:31270503
    reference_title: >-
      Allele-specific gene editing prevents deafness in a model of dominant progressive
      hearing loss.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      we screened 14 Cas9/gRNA combinations for specific and efficient disruption of a
      nucleotide substitution that causes the dominant progressive hearing loss, DFNA36
    explanation: >-
      The second allele-specific strategy, explicitly scoped to DFNA36 by its authors, and so
      explicitly outside this entry.
- discussion_id: dfnb7_aav_tmc1_translational_distance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What stands between AAV TMC1 rescue in mice and a treatment for a child with DFNB7/11?
  rationale: >-
    The preclinical result is strong and the translational gap is specific, though narrower
    than the early literature implied. The earliest and most complete rescues were in neonatal
    mouse inner ears, a developmental stage that corresponds to the human fetal cochlea,
    because the mouse cochlea matures after birth and the human cochlea before it - so an
    agent given to a human infant arrives at a later developmental point than those
    experiments. Later work has pushed the window outward rather than confirming it as closed:
    AAV9-PHP.B Tmc1 replacement in the recessive Baringo model partially recovered hearing
    with later-stage treatment, an artificial-microRNA vector was effective in the mature
    Beethoven ear in the first gene-therapy study in an adult murine model of human deafness,
    and the sentence immediately after the "neonate mice" statement quoted below reports
    rescue in 2- to 8-week-old mice and concludes the time window is wider than previously
    thought. What remains genuinely open is how far outward it extends in a disease where the
    cells are failing to mature and beginning to degenerate from birth, and how any of this
    maps onto a human cochlea that is already mature at birth. Three further unknowns sit on
    top of the timing problem.
    Dosage is not monotonic: adding a WPRE element to raise Tmc1 expression made outcomes
    worse, so more transgene is not better. Biodistribution is not confined to the injected
    ear - viral nucleic acid reached the contralateral ear, brain and liver in the humanized
    model, without overt toxicity in that study but as a finding that a human programme would
    have to address. And the comparator is not placebo but cochlear implantation, which
    already produces good speech outcomes in this disease, so a gene therapy would have to
    improve on an effective standard rather than fill a void. As of this curation a
    ClinicalTrials.gov search for TMC1 returned no registered studies.
  attaches_to:
  - treatments#AAV-Mediated TMC1 Gene Replacement
  - pathophysiology#Cochlear Hair Cell Degeneration
  - animal_models#Humanized Tmc1 p.N193I knock-in mouse
  - animal_models#Baringo mouse
  proposed_experiments:
  - experiment_id: dfnb7_delayed_delivery_window
    experiment_design: TARGETED_PERTURBATION
    name: Rescue efficacy as a function of age at injection in a humanized recessive model
    description: >-
      Deliver the optimized AAV9-PHP.B hTMC1 construct to humanized Tmc1 p.N193I mice at
      progressively later ages, past the point where hair-cell degeneration has begun, and
      measure ABR and DPOAE thresholds and hair-cell survival against the neonatal benchmark.
    readouts:
    - name: ABR and DPOAE thresholds by age at injection
      target: pathophysiology#Loss of Sound-Evoked Cochlear Output
      interpretation: >-
        The age at which rescue is lost defines the therapeutic window in a model whose
        genotype matches human disease, which is the quantity a human programme needs.
  - experiment_id: dfnb7_dosage_titration
    experiment_design: TARGETED_PERTURBATION
    name: Transgene dosage titration for TMC1 replacement
    description: >-
      Titrate hTMC1 expression across a range spanning sub-physiological to supraphysiological
      levels in a recessive model, since a WPRE-enhanced construct produced inferior outcomes
      and the shape of the dose-response curve is unknown.
    readouts:
    - name: Auditory thresholds and hair-cell survival versus transgene expression level
      target: pathophysiology#TMC1 Biallelic Loss of Function
      interpretation: >-
        Identifies whether there is a therapeutic window in expression level as well as in
        time, and whether overexpression is actively harmful.
  evidence:
  - reference: PMID:34523024
    reference_title: >-
      Prevalence and clinical features of autosomal dominant and recessive TMC1-associated
      hearing loss.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      However, this timing is equivalent to the developmental stage of the inner ear of the
      human fetus and makes clinical application difficult.
    explanation: >-
      States the timing problem: neonatal mouse injections correspond to the human fetal inner
      ear. Quoted with the following item, because the sentence immediately after this one in
      the same paper reverses its force. Evidence source is OTHER - the quote is this clinical
      review's commentary on mouse gene-therapy timing, not a result of its own human cohort.
  - reference: PMID:34523024
    reference_title: >-
      Prevalence and clinical features of autosomal dominant and recessive TMC1-associated
      hearing loss.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      reported gene therapy for 2- to 8-week-old mice and prevented hearing deterioration in
      these model mice, suggesting the appropriate time-window for gene therapy will be wider
      than previously thought
    explanation: >-
      The sentence directly after the one above, and the reason this entry does not say the
      window is confined to the neonatal cochlea. The quote begins after the parenthesised
      citation year.
  - reference: PMID:33212302
    reference_title: >-
      Single and Dual Vector Gene Therapy with AAV9-PHP.B Rescues Hearing in Tmc1 Mutant Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      The same treatment in a recessive Tmc1 hearing-loss model, Baringo, partially recovers
      hearing even with later-stage treatment.
    explanation: >-
      The strongest counterexample for this entry specifically, because Baringo is a recessive
      Tmc1 model and the treatment was given later than neonatally; the recovery is partial,
      which is the honest size of the result.
  - reference: PMID:30686588
    reference_title: >-
      Targeted Allele Suppression Prevents Progressive Hearing Loss in the Mature Murine Model
      of Human TMC1 Deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Herein, we report the first study to test gene therapy in an adult murine model of human
      deafness.
    explanation: >-
      Treatment of a mature murine ear, which shows the mature cochlea is reachable at all.
      Indirect for this entry because the adult model treated was the dominant Beethoven
      mouse and the strategy was allele suppression rather than replacement.
  - reference: PMID:30686588
    reference_title: >-
      Targeted Allele Suppression Prevents Progressive Hearing Loss in the Mature Murine Model
      of Human TMC1 Deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Although these studies report varying degrees of success, all treatments have targeted
      developing inner ears in neonatal mice, a time point in the structural maturation of the
      cochlea prior to 26 weeks gestational age in humans.
    explanation: >-
      Quantifies the same gap in human developmental terms - before 26 weeks of gestation -
      which is the sharpest statement of it in this literature.
  - reference: PMID:35883470
    reference_title: Optimized AAV Vectors for TMC1 Gene Therapy in a Humanized Mouse Model of DFNB7/11.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Biodistribution analysis revealed viral DNA/RNA in the contralateral ear, brain, and
      liver but no overt toxicity.
    explanation: >-
      The safety observation a human programme inherits: vector spreads beyond the injected
      ear, with no overt toxicity in this study.
  - reference: PMID:36574989
    reference_title: >-
      Mutation-agnostic RNA interference with engineered replacement rescues Tmc1-related
      hearing loss.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      However, application of such approaches is limited by the infeasibility of development
      and validation of novel constructs for each variant.
    explanation: >-
      The practical argument for mutation-agnostic over variant-specific constructs, which is
      directly relevant to a disease with 125 reported alleles and no single common variant
      outside founder populations.
- discussion_id: dfnb7_cochlear_implant_outcome_variability
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Are cochlear-implant outcomes in DFNB7/11 uniformly good, or genuinely variable?
  rationale: >-
    Two positions coexist. The Italian series of three genotype-confirmed children reports
    excellent outcomes - speech perception, nonverbal cognition and speech performance
    comparable to DFNB1 recipients - and its authors state plainly that their results do not
    support the variable outcome described in the literature, attributing that reported
    variability to social, environmental and genetic-background factors. The Finnish cohort
    agrees, with the qualifier that the good outcomes belong to patients diagnosed early and
    rehabilitated promptly. The counter-position is the earlier literature the Italian group
    is arguing against, which reported variable functional results after implantation in
    DFNB7/11. Mechanistically, good outcomes are what the lesion predicts: the defect is in
    the hair cell, so the spiral ganglion and auditory nerve an implant stimulates should be
    comparatively preserved. That prediction is an inference from where the lesion sits,
    since no spiral-ganglion histology or electrically-evoked neural measurement has been
    reported for a TMC1 patient, and the mouse chain does include degeneration downstream of
    hair-cell loss in sensorineural disease generally. The practical question is whether
    genotype adds anything to the established non-genetic predictors of implant outcome, and
    with three to eleven patients per series the honest answer is that it is unresolved.
  attaches_to:
  - treatments#Cochlear Implantation
  - pathophysiology#Loss of Sound-Evoked Cochlear Output
  evidence:
  - reference: PMID:33352559
    reference_title: >-
      Auditory Outcome after Cochlear Implantation in Children with DFNB7/11 Caused by
      Pathogenic Variants in TMC1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      but the functional outcome after cochlear implantation (CI) described in the literature
      is variable
    explanation: >-
      The authors' own statement of the position they go on to dispute, which is what makes
      this a controversy rather than a settled point.
  - reference: PMID:33352559
    reference_title: >-
      Auditory Outcome after Cochlear Implantation in Children with DFNB7/11 Caused by
      Pathogenic Variants in TMC1 Gene.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Our results do not support the variable auditory outcome reported in the literature,
      which may be affected by several social and environmental factors and by the genetic
      background.
    explanation: >-
      The refutation, from three genotype-confirmed children. Small, and the authors offer
      non-genetic explanations for the discrepancy rather than claiming the earlier reports
      were wrong about their own patients.
  - reference: PMID:35407445
    reference_title: >-
      Clinical and Genetic Characteristics of Finnish Patients with Autosomal Recessive and
      Dominant Non-Syndromic Hearing Loss Due to Pathogenic TMC1 Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      individuals in this cohort who were diagnosed early and received timely hearing
      rehabilitation with hearing aids and cochlear implants (CI) have reached good speech
      perception in noise
    explanation: >-
      Independent support for good outcomes, with the timing qualifier that is the strongest
      candidate explanation for the disagreement.
- discussion_id: dfnb7_unexplained_locus_linkage
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Do the DFNB7/11-linked families without a coding TMC1 variant carry non-coding TMC1
    alleles, or is there a second deafness gene in the interval?
  rationale: >-
    Mutation analysis of families linked to the locus identified TMC1 coding variants in
    seven families, while six families with linkage to the locus had no coding variant. The
    authors
    considered both explanations - non-coding TMC1 variants or an additional deafness gene in
    the region - and then tested the easier one: copy-number analysis of TMC1 and sequencing
    of 15 additional candidate genes in the interval produced no proven pathogenic change,
    which left both hypotheses standing. The question has practical weight for diagnosis,
    because a family with convincing linkage and a negative TMC1 panel result is not thereby
    excluded from this disease, and the modern answer would come from short-read or
    long-read genome sequencing over the locus rather than from more candidate-gene work.
  attaches_to:
  - genetic#TMC1
  - disease#Autosomal Recessive Nonsyndromic Hearing Loss 7
  proposed_experiments:
  - experiment_id: dfnb7_noncoding_locus_sequencing
    experiment_design: HUMAN_OBSERVATIONAL
    name: Genome sequencing across the DFNB7/11 interval in unexplained linked families
    description: >-
      Short-read and long-read genome sequencing of the linked interval in families with
      DFNB7/11 linkage and no coding TMC1 variant, with RNA from an accessible tissue where
      TMC1 is expressed, to look for deep-intronic, regulatory and structural alleles before
      invoking a second gene.
    readouts:
    - name: Non-coding or structural TMC1 variants segregating with deafness
      target: genetic#TMC1
      interpretation: >-
        A segregating regulatory or deep-intronic allele would resolve these families to
        TMC1; a clean interval would strengthen the second-gene hypothesis.
  evidence:
  - reference: PMID:18616530
    reference_title: >-
      Mutation analysis of TMC1 identifies four new mutations and suggests an additional
      deafness gene at loci DFNA36 and DFNB7/11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The analysis of copy number variations in TMC1 as well as DNA sequencing of 15
      additional candidate genes did not reveal any proven pathogenic changes, leaving both
      hypotheses open.
    explanation: >-
      The authors' own conclusion that the question is unresolved, after the two obvious
      follow-up analyses returned nothing.
- discussion_id: dfnb7_per_locus_entry_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Should DFNB7/11 remain a standalone per-locus entry, or be folded into a TMC1-related
    hearing loss entry alongside DFNA36?
  rationale: >-
    This entry follows the established per-locus pattern: about 25
    Autosomal_Recessive_Nonsyndromic_Hearing_Loss_* entries already exist, and the disease
    has its own MONDO class, its own OMIM phenotype number and a single conserved mechanism.
    Two alternatives were considered and rejected for now. A gene-dyadic name such as
    "TMC1-Related Hearing Loss" would be broader than this entry, because it would also cover
    dominant DFNA36, which has a different inheritance pattern, a postlingual progressive
    course and a channel-altering rather than loss-of-function mechanism; under the project's
    naming scope rule the broader name is the worse one, so the numbered MONDO-derived name
    was kept and the gene-based aliases went into synonyms. A subtype row under a TMC1 parent
    was also checked for: the genetics-gap series that listed this MONDO ID with a
    MYO6_Hearing_Loss parent is closed, and MYO6_Hearing_Loss carries only DFNA22 and DFNB37
    as has_subtypes rows, so no duplicate exists. The general lumping policy for numbered
    DFNA/DFNB entries is open upstream in dismech#9863 and does not block this entry; if that
    issue settles on a per-gene lumping, this entry and the DFNA36 stub are the two records
    that would merge.
  attaches_to:
  - disease#Autosomal Recessive Nonsyndromic Hearing Loss 7
  notes: >-
    No literature evidence is attached because this is a curation-scope question about the
    knowledgebase rather than a claim about the disease. The cross-references are
    dismech#9863 for the lumping policy, dismech#12209 and dismech#12211 for the closed
    genetics-gap series that listed a MYO6 parent, and MONDO:0011708 for DFNA36.
notes: >-
  Curation provenance and the checks behind it.


  Phenotype baseline. There is no disease- or gene-specific GeneReviews chapter for DFNB7/11
  or for TMC1. `just check-genereviews --online` on this file reports TAGGED_OVERVIEW: the one
  chapter that covers the disease, PMID:20301607 NBK1434 "Genetic Hearing Loss Overview.", is
  in the Overview format and is marked "[purpose statement only]", so its cached abstract is a
  statement of purpose with no clinical characteristics and there is nothing in it to
  cross-check phenotypes against. The online pass found it through the gene symbol TMC1 rather
  than the disease name, and no gene-scoped chapter exists. The phenotype baseline here was
  therefore taken from the best available cohort and clinical series instead: PMID:34523024
  (Japanese cohort of about 12,000 nonsyndromic hearing-loss patients, which is the largest
  source separating recessive from dominant TMC1 phenotypes), PMID:33352559 (three
  genotype-confirmed DFNB7/11 children with implant outcomes), PMID:31854501 (12 Saudi
  families), PMID:35407445 (8 Finnish families) and PMID:26879195 (6 families at the
  hypomorphic end). The StatPearls line of the same check reports NO_CHAPTER.


  ClinGen gene-disease validity. ClinGen's Hearing Loss Gene Curation Expert Panel classifies
  TMC1 for this disease as Definitive, autosomal recessive, SOP4, dated 2017-02-15 in
  cache/clingen/gene_validity.csv. It is not recorded as a structured `gene_disease_validity`
  assertion because its identifier predates the CGGV scheme: the row's assertion URL carries
  `CGGCIEX:assertion_5658`, `scripts/check_gene_validity.py` matches only
  `CGGV:assertion_...`, and `just clingen-rebuild --id CGGCIEX:assertion_5658 --csv-only` was
  run and answered "CGGCIEX:assertion_5658 not found in ClinGen index", writing no cache file.
  This was checked rather than assumed, and it follows the precedent recorded in
  kb/disorders/Usher_Syndrome_Type_3.yaml for the CLRN1 assertion. The classification is
  stated in the TMC1 `genetic` row's `features` instead, with its date and SOP. `just
  check-gene-validity` on this file reports zero findings in every class, including
  `unsourced`, because no CLINGEN-classified assertion is recorded here to be sourced.


  Duplicate and scope checks before writing. No existing kb/ entry carries MONDO:0010967: a
  grep of kb/ and stubs/ finds the ID only in this file and in the grouping stub
  stubs/Hearing_Loss_Disorder.yaml, and no disorder file mentions DFNB7 or DFNB11 as a word.
  kb/disorders/MYO6_Hearing_Loss.yaml was checked specifically, because the closed
  genetics-gap issues dismech#12209 and dismech#12211 both listed MONDO:0010967 under a
  MYO6_Hearing_Loss parent: that file's `has_subtypes` carries DFNA22 (MONDO:0011660) and
  DFNB37 only, so this entry duplicates nothing. `just preflight-claim-conflict MONDO:0010967
  --self-issue 17003 --self-branch caufieldjh/curate-dfnb7` reported no other open claim or
  PR. The standalone per-locus entry follows the pattern of the roughly 25 existing
  Autosomal_Recessive_Nonsyndromic_Hearing_Loss_* entries; the general lumping policy for
  numbered DFNA/DFNB diseases is open in dismech#9863 and is cross-referenced in the
  dfnb7_per_locus_entry_scope discussion rather than pre-empted here.


  Out of scope. DFNA36, the dominant postlingual progressive disease caused by heterozygous
  channel-altering TMC1 alleles such as p.Asp572Asn and p.Met418Lys, is MONDO:0011708 and has
  its own stub. It is excluded from every section of this entry. The Beethoven (Bth) mouse
  models DFNA36 and is recorded in `animal_models` with FAILS_TO_RECAPITULATE so that the
  mismatch is visible in the graph, because it is the model most of the TMC1 gene-therapy
  literature uses; the dfnb7_beethoven_allele_scope discussion sets out which of those
  results transfer. The audiometric decline rate of 1.0 dB per year reported by PMID:34523024
  is a DFNA36 figure and is deliberately not used here.


  Reference validation and one re-check. The deep-research report
  research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_7-deep-research-claude_code.md
  (provider claude_code, 2026-11-10) carries `needs_review: true` with one unresolved
  identifier, PMID:34523024, and one quote that could not be checked for the same reason. That
  identifier was re-checked rather than taken on trust or dropped: `references_cache/
  PMID_34523024.md` holds the record as `content_type: full_text_xml` (Nishio & Usami,
  Hum Genet 2022, DOI 10.1007/s00439-021-02364-2), so the report's failure was a lookup
  failure rather than a fabricated identifier, and every snippet quoted from it here verifies
  against that cached text. The report's term validation flagged two labelling slips, neither
  of which affects this entry: it wrote "DOID" as the label of DOID:0110520 and a fragment of
  a heading as the label of UBERON:0001844 (correct label: cochlea, which is what this file
  binds). `just preflight-dr` on the report returns PASS with TMC1 named 62 times.


  Vestibular status. No vestibular phenotype is asserted, positively or negatively, and the
  commonly repeated statement that balance is normal in this disease is not adopted here.
  That statement rests on mouse TMC2 persistence plus symptom reporting in a mostly-dominant
  cohort. The only human series with formal preoperative vestibular testing (PMID:34744965)
  contains one TMC1 child, and its Table 2 row for TMC1 records an abnormal rotary chair
  result and counts that child as having peripheral vestibular loss, with TMC1 among the six
  of eight non-syndromic causes in which the series found measurable vestibular effects. One
  child cannot settle the question, and the reason is attribution rather than sample size
  alone: that child's genotype class - recessive DFNB7/11 or dominant DFNA36 - is in
  supplementary material the cached record does not carry. No phenotype is therefore asserted,
  the finding is recorded in the vestibular `diagnosis` row and in the
  dfnb7_vestibular_sparing_human_evidence discussion (which carries it as a REFUTE item
  against the sparing generalization), and the human default taken here is "unknown, probably
  not normal" rather than "spared".


  Module conformance. Two pathophysiology nodes conform to sensorineural_hair_cell_loss:
  "TMC1 Biallelic Loss of Function" to "Cochlear Sensory Epithelium Insult", which is the
  substitution that module's notes ask for (a specific stereocilia/mechanotransduction gene
  defect in place of the generic insult), and "Cochlear Hair Cell Degeneration" to "Hair Cell
  Mechanotransduction Failure and Death". Three module nodes were deliberately not conformed
  to. "Cochlear Ionic Homeostasis Disruption and Oxidative Stress" is a connexin,
  potassium-recycling, noise and ototoxicity amplifier; no cited source reports disrupted
  endocochlear potential or oxidative stress in TMC1 disease, and conforming to it would
  import a mechanism this entry has no evidence for. "Cochlear Amplification Loss and Spiral
  Ganglion Neuron Degeneration" bundles amplification loss with spiral ganglion degeneration,
  and no TMC1 source reports spiral ganglion loss - the preserved auditory nerve is in fact
  the premise of the implant rationale here. "Progressive Sensorineural Hearing Loss" names a
  progressive course, whereas the classic DFNB7/11 loss is congenital and essentially stable;
  the entry's consequence node is "Loss of Sound-Evoked Cochlear Output" instead.


  Terms. HPO, CL, GO, UBERON and NCIT labels were verified against the configured sources
  before binding (OLS for HP and NCIT, the committed cache/cl, cache/go, cache/uberon and
  cache/ncit term tables for the rest, since OLS was intermittently unreachable during this
  session). The vestibular-testing diagnosis row binds no term, and the searches behind that
  decision are recorded in the row's own `notes`. No GO term is bound for the hair-cell
  maturation node, because the failed maturation described in the sources is a composite of
  potassium-current acquisition and exocytotic maturation rather than one annotated process.
  No `percentage:` value is set on any `prevalence` record: that slot is deprecated for new
  records in favour of `measure_type`, `prevalence_class` and `rate_per_100000`, and the three
  cohort shares here have no population denominator to convert into a rate, so they are
  carried as `case_fractions` in the genetic section and in each record's `notes`.


  Red-team review before the PR. The entry was reviewed in a separate pass against the
  dismech-pr-review rubric before being committed, and the following were found and fixed:
  a readout about maturation potassium currents whose snippet was a gene-expression sentence;
  a claim that the vestibular literature was silent on TMC1, when the one child with formal
  testing in PMID:34744965 in fact had peripheral vestibular loss (see Vestibular status
  above); a statement that effective gene-therapy injections were neonatal in every
  successful study, which two of this entry's own references refute and which rested on a
  quote clipped immediately before the sentence that widens the window; a structural-normality
  claim attributed to the single Tmc1 null rather than the double null; three model rows whose
  evidence was a background opening sentence rather than a result; an unquantified "most
  genotypes are truncating" claim that the nearest cited data lean against; a back-computed
  denominator in the unexplained-linkage discussion; a hypomorphic allele list that omitted
  p.Arg34Ter, the one truncating allele among those six families; a Saudi allele count that
  silently included the dominant p.Asp572Asn; and an over-general stereocilium binding where
  GO:0032426 stereocilium tip exists. The review also prompted the additions below.


  Added after review. A `differential_diagnoses` section, with the two differentials that
  change management (OTOF/DFNB9, where otoacoustic emissions are preserved and OAE-based
  newborn screening can pass an affected child, and SLC26A4/DFNB4-Pendred, which is
  identified on imaging) plus DFNA36, GJB2/DFNB1 and the panel-level genetic heterogeneity;
  four references were fetched for it and for the founder-allele claims (PMID:33256196,
  PMID:20301640, PMID:15605408, PMID:29533536). A temporal-bone imaging diagnosis row. The
  Baringo mouse, the one recessive Tmc1 model in which later-stage treatment worked. The
  per-gene TMC1 figure from the unselected Iowa series (10 of 440 diagnoses, 2.3%, 8
  recessive), which is in that paper's cached full-text table rather than its abstract, and
  the combined DFNA36-plus-DFNB7/11 burden estimate of about 2% of genetic hearing loss.
  PMID:40100472, previously listed in `references:` and cited nowhere, is now cited in the
  differential-diagnoses row that records why no syndromic phenotype is asserted.


  Superseded skepticism. PMID:27410728 ("Is TMC1 the Hair Cell Mechanotransducer Channel?",
  2016) set out four lines of evidence against TMC1 being the pore and was read during
  curation. It is not cited as evidence because the two findings it asked for arrived
  afterwards - pore mapping by cysteine mutagenesis in TMC1/TMC2-null hair cells
  (PMID:30138589) and channel activity from reconstituted TMC1 in liposomes (PMID:31761710) -
  so quoting its doubts beside the current nodes would misrepresent the state of the field
  rather than record a live controversy.


  Not modeled. The vestibular branch is not a pathophysiology node. Persistent TMC2
  expression in vestibular hair cells is not caused by the TMC1 lesion, so an edge from the
  lesion to it would assert a causal relation that does not exist; it is described in the
  "Absent Hair Cell Mechanoelectrical Transduction Current" node and discussed separately.
  The transgenic Tmc2 rescue mice (PMID:30108230, PMID:30108254) are cited in that discussion
  rather than listed as models of the disease, since they are rescue constructs. The TMC1
  copy-number gradient along the cochlea (PMID:29872055), the lipid-scramblase proposal for
  TMC1/TMC2 (PMID:35921424), the MET complex partners PCDH15 (PMID:25114259) and the
  C. elegans complex structure (PMID:36224384) were read and are not given nodes: each is
  channel biology rather than a step in this disease's causal chain, and PMID:29872055 and
  PMID:25114259 are cited where they do carry a disease-relevant claim. No `environmental:`
  section is present: the disease has no environmental cause, and the only exposure-related
  advice in the literature (avoid ototoxic drugs and noise to protect residual hearing) is
  general paediatric hearing-loss advice rather than a mechanism of this disease.

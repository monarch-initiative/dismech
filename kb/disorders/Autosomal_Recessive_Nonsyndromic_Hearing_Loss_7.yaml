- name: Loss of Sound-Evoked Cochlear Output
  description: >-
    With no transduction current and a degenerating sensory epithelium, the cochlea produces
    no sound-evoked electrical output: compound action potentials and auditory brainstem
    responses are absent, and distortion-product otoacoustic emissions are absent because
    outer hair cells do not function. Notably, the failure of output precedes the loss of
    cells - homozygous mutants never show compound action potentials even at ages when many
    apical hair cells survive - so this node is driven by both the transduction and the
    degeneration arms of the chain. The afferent auditory pathway itself is not the primary

- name: Cochlear Hair Cell Degeneration
  description: >-
    Hair cells that never transduce are progressively lost. The deafness (dn) mouse carrying
    a recessive Tmc1 exon deletion shows hair-cell degeneration, and longitudinal work on the
    same allele reports progressive hair-cell damage and loss after the failed maturation
    window. Because mammalian cochlear hair cells do not regenerate, this is the irreversible
    step of the disorder, and it is the node at which the entry conforms to the central
    effector of the sensorineural hair cell loss module. Two qualifications apply. First, the
    death pathway for recessive null genotypes is not established: the stereociliary PMCA2 /
    bundle-calcium / mitochondrial route was demonstrated for semidominant Tmc1 alleles whose
    hair cells still have MET current at P6, not for nulls. Second, hair-cell loss has never
    been examined in a person with DFNB7/11 and cannot be short of post-mortem histology, so
    the human form of this node is inferred from the mouse. Gene-replacement experiments
    showing enhanced hair-cell survival after restoring Tmc1 are the strongest evidence that
    the loss is a consequence of the gene lesion rather than an independent process.

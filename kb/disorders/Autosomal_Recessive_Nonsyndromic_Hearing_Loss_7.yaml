  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >-
    Hearing loss at the DFNB7/11 locus segregates as an autosomal recessive trait, with
    affected individuals homozygous or compound heterozygous for TMC1 variants and unaffected
    parents heterozygous carriers. Most families in the founding and follow-up studies are
    consanguineous, and the disease is recurrently found by homozygosity or autozygosity
    mapping of markers flanking the locus. Penetrance is recorded as COMPLETE because every
    reported biallelic genotype was ascertained through an affected individual and no
    unaffected biallelic carrier has been described; no penetrance study exists for this
    disease, so the value is an inference from ascertainment rather than a measured figure,
    and it carries no evidence item for that reason.
  evidence:
  - reference: PMID:11850618
    reference_title: >-
      Dominant and recessive deafness caused by mutations of a novel gene, TMC1, required
      for cochlear hair-cell function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We identified eight mutations in a new gene, transmembrane cochlear-expressed gene 1
      (TMC1), in a DFNA36 family and eleven DFNB7/B11 families.
    explanation: >-
      The founding report that assigned recessive deafness at DFNB7/B11 to TMC1 in eleven
      families, establishing the recessive inheritance of this entry's disease alongside the
      separate dominant DFNA36 entity.
  - reference: PMID:33423255
    reference_title: >-
      [Analysis of TMC1 gene variants and prenatal diagnosis in four Chinese families
      affected with deafness].
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: All parents were heterozygous carriers of the variants.
    explanation: >-
      Segregation evidence for recessive inheritance in four families: affected probands
      carry biallelic TMC1 variants and both parents are unaffected heterozygotes.
  - reference: PMID:17877751
    reference_title: >-
      Identities, frequencies and origins of TMC1 mutations causing DFNB7/B11 deafness in
      Pakistan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We screened affected family members for homozygosity at short-tandem repeats flanking
      known autosomal recessive (DFNB) deafness loci, followed by TMC1 sequence analysis in
      families segregating deafness linked to DFNB7/B11.
    explanation: >-
      The recessive mapping strategy by which DFNB7/11 families are identified, which depends
      on the homozygosity expected under autosomal recessive inheritance in consanguineous
      pedigrees.
pathophysiology:
- name: TMC1 Biallelic Loss of Function
  description: >-
    Homozygous or compound heterozygous pathogenic TMC1 variants abolish or reduce the
    function of transmembrane channel-like protein 1 in cochlear hair cells. The reported
    recessive allelic spectrum spans nonsense, frameshift, splice-site, copy-number, missense
    and in-frame classes. No published breakdown quantifies their relative shares for TMC1
    specifically; in the one unselected hearing-loss cohort that reports variant classes
    across all recessive diagnoses, missense alleles were the largest single class, so this
    node does not claim that truncating alleles predominate. This is the initiating lesion of the disease and the node at which the
    disorder specializes the generic cochlear sensory-epithelium insult of the
    sensorineural hair cell loss module. The dominant DFNA36 alleles p.Asp572Asn and
    p.Met418Lys act by a different, channel-altering mechanism and are outside this entry.

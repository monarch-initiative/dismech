genetic:
- name: TMC1
  gene_term:
    preferred_term: TMC1
    term:
      id: hgnc:16513
      label: TMC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Transmembrane channel-like protein 1, encoded at 9q21.13 with 24 exons in the main
    transcript NM_138691. It is the pore-forming subunit of the hair-cell MET channel,
    structurally related to the TMEM16/OSCA superfamily, assembling as a dimer with
    transmembrane domains S4 to S7 lining the pore. ClinGen's Hearing Loss Gene Curation
    Expert Panel classifies the TMC1 relationship to autosomal recessive nonsyndromic
    hearing loss 7 as Definitive (SOP4, 2017-02-15, from the panel's gene-validity export).
    That assertion predates the CGGV identifier scheme and is recorded under the identifier
    CGGCIEX:assertion_5658, which the repository's ClinGen cache builder does not index, so
    it is not cited here as a structured gene_disease_validity reference; this was checked
    rather than assumed, as described in notes.
  notes: >-
    Recessive genotypes are homozygous or compound heterozygous and span nonsense,
    frameshift, splice-site, in-frame deletion, missense and copy-number classes. As of the
    2022 review 125 pathogenic TMC1 variants had been reported, of which only 8 were
    assigned to the dominant DFNA36 phenotype. Founder and recurrent alleles include
    p.Arg34Ter (Pakistan and Saudi Arabia), p.Arg389Ter (Turkish families, and 4 of 243
    unrelated deaf Sudanese individuals), p.Arg512Ter (Finland) and p.Asp684His, whose
    identical haplotype in three homozygous Xiamen families supports a founder origin in that
    part of China. Linkage to DFNB7/11 without a
    coding TMC1 variant has been reported in a minority of families, leaving open either
    non-coding TMC1 alleles or a second gene in the interval. No human modifier gene has
    been shown; the TMC2 paralogue modifies the organ distribution of the phenotype in mouse
    but is not a human modifier locus.
  evidence:
  - reference: PMID:34523024
    reference_title: >-
      Prevalence and clinical features of autosomal dominant and recessive TMC1-associated
      hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      TMC1 is a causative gene for both autosomal dominant non-syndromic hearing loss
      (DFNA36) and autosomal recessive non-syndromic hearing loss (DFNB7/11). To date, 125
      pathogenic variants in TMC1 have been reported.
    explanation: >-
      Establishes the gene-disease relationship for the recessive phenotype and the size of
      the reported pathogenic allelic spectrum.
  - reference: PMID:18616530
    reference_title: >-
      Mutation analysis of TMC1 identifies four new mutations and suggests an additional
      deafness gene at loci DFNA36 and DFNB7/11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The absence of TMC1 mutations in the remaining six linked families implies the presence
      of mutations outside the coding region of this gene or alternatively at least one
      additional deafness-causing gene in this region.
    explanation: >-
      The unexplained-linkage caveat in the authors' own words: linkage to the interval is not
      the same as a coding TMC1 variant, which limits how completely the locus is explained.
  - reference: PMID:18259073
    reference_title: >-
      TMC1 but not TMC2 is responsible for autosomal recessive nonsyndromic hearing impairment
      in Tunisian families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Mutations of the transmembrane channel-like gene 1 (TMC1) have been shown to cause
      autosomal dominant and recessive forms of nonsyndromic HI linked to the loci DFNA36 and
      DFNB7/B11, respectively.
    explanation: >-
      Independent confirmation of the gene-locus assignment in a North African cohort, from
      the study that also excluded the paralogue TMC2 as a cause in those families.
  case_fractions:
  - population: >-
      557 large consanguineous Pakistani families segregating autosomal recessive deafness
    case_fraction_percent: 3.4
    cohort_size: 557
    notes: >-
      Nineteen families with TMC1 as the cause, from nine distinct alleles. An
      ascertainment-driven denominator from a consanguineous population.
    evidence:
    - reference: PMID:17877751
      reference_title: >-
        Identities, frequencies and origins of TMC1 mutations causing DFNB7/B11 deafness in
        Pakistan.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        Overall, 9 different TMC1 mutations account for deafness in 19 (3.4%) of the 557
        Pakistani families.
      explanation: The case fraction and its denominator as the source states them.
  - population: >-
      440 molecular diagnoses in an unselected United States clinical hearing-loss series of
      1,119 patients
    case_fraction_percent: 2.3
    cohort_size: 440
    notes: >-
      Ten TMC1 diagnoses among 440, of which 8 were recessive (2.2% of the recessive
      diagnoses) and 2 dominant. The least ascertainment-biased denominator available, and the
      figure comes from the paper's per-gene table in the cached full text rather than its
      abstract.
    evidence:
    - reference: PMID:26969326
      reference_title: >-
        Comprehensive genetic testing in the clinical evaluation of 1119 patients with hearing
        loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: TMC1 | 10 | 2.3 | 2 | 3.2 | 8 | 2.2
      explanation: >-
        The per-gene table row: 10 diagnoses, 2.3% of all 440, 2 dominant and 8 recessive.
  - population: 366 Saudi hearing-loss families previously shown to lack GJB2 variants
    case_fraction_percent: 3.3
    cohort_size: 366
    notes: >-
      Twelve families with five causative TMC1 alleles, four of them recessive and one the
      dominant p.Asp572Asn, so this fraction is for TMC1 disease of either inheritance class
      rather than for DFNB7/11 alone. The GJB2-negative selection raises the share relative to
      an unselected cohort.
    evidence:
    - reference: PMID:31854501
      reference_title: >-
        Identification of TMC1 as a relatively common cause for nonsyndromic hearing loss in
        the Saudi population.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        We identified 12 families that carried five causative TMC1 mutations
      explanation: >-
        The numerator and allele count for this case fraction, against the 366-family
        GJB2-negative denominator named in the same abstract.
  variants:
  - name: c.100C>T (p.Arg34Ter)
    description: >-
      The most recurrent recessive TMC1 allele. A founder allele in Pakistan, where it causes
      deafness in 1.8% of 557 families, and in Saudi Arabia, where 8 of 12 TMC1 families share
      it with linkage disequilibrium across flanking SNPs. It was also detected among
      African-American and northern European control samples, which the authors read as
      evidence that TMC1 alleles contribute to the genetic load of deafness beyond the
      populations where they were first mapped.
    gene:
      preferred_term: TMC1
      term:
        id: hgnc:16513
        label: TMC1
    evidence:
    - reference: PMID:17877751
      reference_title: >-
        Identities, frequencies and origins of TMC1 mutations causing DFNB7/B11 deafness in
        Pakistan.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        Genotype analysis of p.R34X-linked markers indicates that it arose from a common
        founder.
      explanation: Haplotype evidence for a single founder origin of this allele in Pakistan.
    - reference: PMID:17877751
      reference_title: >-
        Identities, frequencies and origins of TMC1 mutations causing DFNB7/B11 deafness in
        Pakistan.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        We also detected p.R34X among normal control samples of African-American and northern
        European origins, raising the possibility that p.R34X and other mutations of TMC1 are
        prevalent contributors to the genetic load of deafness across a variety of populations
        and continents.
      explanation: >-
        The carrier observation outside the mapped populations, quoted with the authors' own
        hedge, since a control carrier is a heterozygote and not an affected individual.
    - reference: PMID:31854501
      reference_title: >-
        Identification of TMC1 as a relatively common cause for nonsyndromic hearing loss in
        the Saudi population.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        Eight families in our cohort were found to share the pathogenic p.Arg34Ter mutation and
        linkage disequilibrium was observed between p.Arg34Ter and SNPs investigated.
      explanation: The same allele as a founder in a second Middle Eastern population.
  - name: c.1534C>T (p.Arg512Ter)
    description: >-
      Nonsense allele enriched in the Finnish population and interpreted as a founder variant
      there. It appears in recessive genotypes with congenital moderate-to-profound hearing
      loss in the Finnish cohort.
    gene:
      preferred_term: TMC1
      term:
        id: hgnc:16513
        label: TMC1
    evidence:
    - reference: PMID:35407445
      reference_title: >-
        Clinical and Genetic Characteristics of Finnish Patients with Autosomal Recessive and
        Dominant Non-Syndromic Hearing Loss Due to Pathogenic TMC1 Variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        We show that the TMC1 c.1534C>T, p.(Arg512*) variant is likely a founder variant that
        is enriched in the Finnish population.
      explanation: The founder interpretation and population, as the cohort study states it.
  - name: c.1404+1G>T
    description: >-
      Donor splice-site transversion found homozygous in families with moderate-to-severe
      loss. Patient cDNA shows skipping of exon 16 and loss of 60 amino acids, making this a
      measured in-frame hypomorphic allele rather than a predicted one, and it is the clearest
      molecular anchor for the hypomorphic branch of the pathograph.
    gene:
      preferred_term: TMC1
      term:
        id: hgnc:16513
        label: TMC1
    evidence:
    - reference: PMID:26879195
      reference_title: Recessive mutations of TMC1 associated with moderate to severe hearing loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        TMC1 cDNA sequence from affected subjects homozygous for the donor splice site
        transversion c.1404 + 1G > T revealed skipping of exon 16, deleting 60 amino acids from
        the TMC1 protein.
      explanation: >-
        RNA-level characterization in affected subjects, which is what distinguishes this
        allele from a splice prediction.
  - name: c.1165C>T (p.Arg389Ter)
    description: >-
      Recurrent nonsense allele reported in Turkish families and, in the deep-research
      literature survey, in Sudanese families. It is one of the two previously known alleles
      recovered in the Turkish mutation-analysis series.
    gene:
      preferred_term: TMC1
      term:
        id: hgnc:16513
        label: TMC1
    evidence:
    - reference: PMID:18616530
      reference_title: >-
        Mutation analysis of TMC1 identifies four new mutations and suggests an additional
        deafness gene at loci DFNA36 and DFNB7/11.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        The pathogenic variants we found included two known mutations, c.100C>T and c.1165C>T,
        and four new mutations, c.2350C>T, c.776+1G>A, c.767delT and c.1166G>A.
      explanation: >-
        Places this allele among the recurrent ones in a Turkish recessive cohort, alongside
        the p.Arg34Ter allele.
    - reference: PMID:15605408
      reference_title: >-
        Novel TMC1 structural and splice variants associated with congenital nonsyndromic
        deafness in a Sudanese pedigree.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        The c.1165C>T ... mutation was also observed in four out of 243 unrelated deaf Sudanese
        individuals, but none of the mutations was found among 292 normal hearing controls.
      explanation: >-
        The Sudanese recurrence with its denominator and a control comparison, which is the
        basis for calling this allele recurrent outside Turkey. The ellipsis bridges the
        bracketed protein-level name of the same variant.
  - name: c.2050G>C (p.Asp684His)
    description: >-
      Missense allele recurrent in the Xiamen area of south-eastern China, homozygous in the
      probands of three families and found in compound heterozygotes with four other TMC1
      alleles in a school-based series. Haplotype analysis across 53 SNPs found the homozygous
      probands' haplotypes identical, which is the basis for a local founder effect.
    gene:
      preferred_term: TMC1
      term:
        id: hgnc:16513
        label: TMC1
    evidence:
    - reference: PMID:29533536
      reference_title: >-
        Mutation spectra and founder effect of TMC1 in patients with non-syndromic deafness in
        Xiamen area, China.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        The probands of three families were found to be homozygous for TMC1 c.2050G>C, and
        their parents were all heterozygous for the TMC1 c.2050G>C mutation.
      explanation: >-
        Homozygosity in affected probands with heterozygous parents: the recessive segregation
        of this allele in the three index families.
    - reference: PMID:29533536
      reference_title: >-
        Mutation spectra and founder effect of TMC1 in patients with non-syndromic deafness in
        Xiamen area, China.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: The haplotypes of the probands of families with TMC1 c.2050G>C were identical.
      explanation: >-
        The haplotype result behind the founder-effect interpretation for this allele.
    - reference: PMID:33423255
      reference_title: >-
        [Analysis of TMC1 gene variants and prenatal diagnosis in four Chinese families
        affected with deafness].
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: and homozygosity of c.2050G>C (p.D684H) in family 4
      explanation: >-

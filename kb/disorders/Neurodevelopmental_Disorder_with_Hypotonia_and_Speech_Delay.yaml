      Eukaryotic initiation factor-4A2 (EIF4A2) is an ATP-dependent RNA
      helicase and a member of the DEAD-box protein family that recognizes the
      5' cap structure of mRNAs, allows mRNA to bind to the ribosome, and plays
      an important role in microRNA-regulated gene repression.
    explanation: >-
      The discovery paper's statement of eIF4A2's normal role in cap-dependent
      initiation; this is a background summary of prior work, not a result of

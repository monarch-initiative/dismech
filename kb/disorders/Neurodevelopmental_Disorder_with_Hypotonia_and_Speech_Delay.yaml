pathophysiology:
- name: Rare EIF4A2 Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    NEDHSS is caused by extremely rare de novo mono-allelic or inherited
    bi-allelic variants in EIF4A2, which encodes the DEAD-box ATP-dependent RNA
    helicase eIF4A2 (DDX2B). Molecular modelling of the reported variants
    predicts that they perturb structural interactions within key domains of
    the protein. DEAD-box helicases are built from two conserved RecA-like
    domains that jointly form the RNA- and ATP-binding surface, so substitutions
    within or between these domains are expected to alter RNA binding, ATP
    hydrolysis, or the coupling between them.

      2023).
    explanation: >-
      An independent 2024 review states the variant classes (missense and loss
      of function) and confirms the gene-disease pairing; this is a review
      summary of other authors' work rather than primary data, hence OTHER.
  downstream:
  - target: Impaired eIF4A2 Helicase and ATPase Function
    causal_link_type: DIRECT
    description: >-
      Substitutions predicted to perturb the RNA- and ATP-binding domains
      directly compromise the helicase cycle of the protein.
  - target: Reduced eIF4A2 Protein Dosage
    causal_link_type: DIRECT
    description: >-
      Frameshift and other truncating EIF4A2 alleles reduce the amount of
      eIF4A2 protein produced, a dosage rather than an activity lesion.
- name: Impaired eIF4A2 Helicase and ATPase Function
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    eIF4A2 uses ATP binding and hydrolysis to remodel RNA. The disease variants
    are predicted to perturb the interfaces that couple ATP hydrolysis to RNA
    duplex remodelling. Both loss and gain of function are proposed for
    different alleles: in the Drosophila rescue assay some variant cDNAs behaved
    as hypomorphs while others produced variant-specific defects not explained
    by simple loss of activity, and the discovery authors concluded that both
    mechanisms operate. The helicase activity itself is functionally required -
    helicase-dead eIF4A2 mutants fail to rescue eIF4A2 depletion in embryonic
    stem cells - so an activity lesion is mechanistically sufficient to matter.

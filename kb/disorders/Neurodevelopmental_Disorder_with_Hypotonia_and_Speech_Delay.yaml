      miRNA-mediated repression.
  - reference: PMID:31791371
    reference_title: eIF4A2 drives repression of translation at initiation by Ccr4-Not through purine-rich motifs in the 5'UTR.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      eIF4A2 exerts its repressive effect by binding purine-rich motifs which
      are enriched in the 5'UTR of target mRNAs directly upstream of the AUG
      start codon.
    explanation: >-
      Defines the cis-element through which eIF4A2 imposes repression at

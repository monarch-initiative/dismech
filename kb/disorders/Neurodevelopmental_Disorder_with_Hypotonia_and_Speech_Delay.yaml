name: Neurodevelopmental Disorder with Hypotonia and Speech Delay, With or Without Seizures
creation_date: '2026-08-15T00:00:00Z'
category: Mendelian
synonyms:
- NEDHSS
- EIF4A2-related neurodevelopmental disorder
- EIF4A2-related disorder
description: >-
  Neurodevelopmental disorder with hypotonia and speech delay, with or without
  seizures (NEDHSS; OMIM:620455) is a rare Mendelian neurodevelopmental
  disorder caused by rare variants in EIF4A2, which encodes eukaryotic
  translation initiation factor 4A isoform 2 (eIF4A2), an ATP-dependent
  DEAD-box RNA helicase of the cap-dependent translation initiation machinery.
  The defining 2023 cohort described 15 individuals from 14 families with
  global developmental delay, impaired intellectual development with poor or
  absent speech, gross and fine motor delay, hypotonia, epilepsy and structural
  brain anomalies. Both de novo mono-allelic and inherited bi-allelic variants
  occur; neurodegeneration was reported predominantly in the bi-allelic group.
  Mechanistically eIF4A2 sits at two opposing points in mRNA translational
  control: within eIF4F it resolves 5' untranslated region secondary structure
  so the 43S preinitiation complex can be recruited and scan, and within the
  Ccr4-Not complex it acts as a major effector of microRNA-mediated
  translational repression. Disease variants are proposed to act through both
  loss and gain of function, and the resulting deregulation of a specific
  neuronal and developmental mRNA translation program - rather than a global
  collapse of protein synthesis - is the proposed route to the
  neurodevelopmental phenotype. EIF4A2 haploinsufficiency additionally
  underlies an allelic adolescent- to adult-onset dominant dystonia-tremor
  syndrome, placing EIF4A2 among the translational-machinery genes that produce
  both early neurodevelopmental and later-onset movement phenotypes.

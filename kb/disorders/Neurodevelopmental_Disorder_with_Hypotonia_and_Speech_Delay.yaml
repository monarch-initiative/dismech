inheritance:
- name: Autosomal dominant, de novo
  description: >-
    Most reported probands carry a heterozygous de novo EIF4A2 variant. In the
    defining cohort the mono-allelic variants were de novo and were the arm
    modelled functionally in Drosophila. A separate case series reported a
    proband with somatic/germline EIF4A2 mosaicism, which is compatible with a
    dominant mechanism and expands the observed genotypic spectrum.
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:36528028
    reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on 15 individuals from 14 families presenting with
      global developmental delay, intellectual disability, hypotonia,
      epilepsy, and structural brain anomalies, all of whom have extremely
      rare de novo mono-allelic or inherited bi-allelic variants in EIF4A2
    explanation: >-
      Explicitly records de novo mono-allelic variants as one of the two modes
      of inheritance in the defining cohort.
- name: Autosomal recessive, inherited bi-allelic
  description: >-
    A second group of affected individuals carry inherited bi-allelic EIF4A2
    variants. This arm is clinically distinguished by the predominance of
    reported neurodegeneration, so mode of inheritance in NEDHSS is not a
    purely formal distinction but tracks a difference in natural history.

  - reference: PMID:31180491
    reference_title: DEAD-box helicase eIF4A2 inhibits CNOT7 deadenylation activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that the DEAD-box helicases eIF4A2 and DDX6 interact

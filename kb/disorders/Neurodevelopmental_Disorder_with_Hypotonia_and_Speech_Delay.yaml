    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: DEAD-box proteins contain two conserved domains that both contribute to RNA and ATP binding.
    explanation: >-
      Crystallographic work including the human eIF4A2 (DDX2B) DEAD domain
      establishes the two-domain architecture that the disease variants are
      predicted to perturb.
  - reference: PMID:39149612
    reference_title: The role of DEAD- and DExH-box RNA helicases in neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In more detail, missense and loss-of-function variants in EIF4A2 (DDX2B)

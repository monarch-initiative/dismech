- name: Genetic Counseling
  description: >-
    Counselling must be genotype-specific in this disorder because the two modes
    of inheritance carry very different recurrence risks: a de novo
    mono-allelic variant implies a low (but non-zero, given reported mosaicism)
    recurrence risk, whereas inherited bi-allelic variants imply a 25%
    recurrence risk for future pregnancies. The reported mosaic proband is the
    reason parental mosaicism cannot be assumed absent.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36528028
    reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on 15 individuals from 14 families presenting with
      global developmental delay, intellectual disability, hypotonia,
      epilepsy, and structural brain anomalies, all of whom have extremely
      rare de novo mono-allelic or inherited bi-allelic variants in EIF4A2
    explanation: >-
      The coexistence of de novo mono-allelic and inherited bi-allelic
      inheritance in the same disorder is precisely what makes genotype-specific
      counselling necessary.
  - reference: PMID:41186122
    reference_title: Two Novel Pediatric Cases of EIF4A2-Related Disorder With Refractory Infantile Spasms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this case series, we describe two patients with pathogenic EIF4A2
      variants, including one of the first detailed reports of a patient with
      EIF4A2 mosaicism, to add to the growing catalog of genotypic variability
      in this disorder, as well as a novel phenotypic finding of absent
      cochlear nerve.
    explanation: >-
      Reported mosaicism is the reason recurrence risk after an apparently de
      novo variant cannot be quoted as zero.
discussions:
- discussion_id: nedhss_lof_vs_gof_unresolved
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which specific EIF4A2 alleles act by loss of function and which by gain of
    function, and does the mechanism class predict the clinical phenotype?
  attaches_to:
  - pathophysiology#Impaired eIF4A2 Helicase and ATPase Function
  - pathophysiology#Rare EIF4A2 Variant
  rationale: >-
    The discovery paper concludes that both loss and gain of function operate,
    but the assignment rests on a Drosophila rescue assay scoring pupal
    lethality and variant-specific behavioural and developmental defects. No
    biochemical measurement of ATPase or helicase activity, RNA binding, or
    eIF4F/Ccr4-Not incorporation has been reported for any patient allele. Until
    that is done the direction of effect for a newly identified variant cannot
    be predicted, which blocks both variant interpretation and any dosage-based
    therapeutic reasoning. This is the load-bearing mechanistic uncertainty in
    the entry.
  proposed_experiments:
  - experiment_id: nedhss_exp_biochemistry
    name: Biochemical characterisation of patient eIF4A2 alleles
    description: >-
      Express and purify each reported patient eIF4A2 variant and measure
      RNA-stimulated ATPase activity, RNA duplex unwinding, and RNA binding
      affinity relative to wild-type protein.
    decision_criterion: >-
      Alleles clustering into a reduced-activity group and a
      normal-or-increased-activity group, matching the loss- versus
      gain-of-function assignment inferred from the fly assay.
    would_support:
    - pathophysiology#Impaired eIF4A2 Helicase and ATPase Function
    would_refute:
    - pathophysiology#Impaired eIF4A2 Helicase and ATPase Function
  - experiment_id: nedhss_exp_complex_incorporation
    name: eIF4F versus Ccr4-Not partitioning of variant eIF4A2
    description: >-
      Quantify incorporation of each variant eIF4A2 into eIF4F and into
      Ccr4-Not (CNOT1 MA3/MIF4G binding) by co-immunoprecipitation, to test
      whether disease alleles shift the balance between the activating and the
      repressive arm.
    would_support:
    - pathophysiology#Loss of eIF4A2-Ccr4-Not-Mediated Translational Repression
  evidence:
  - reference: PMID:36528028
    reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Overall, our findings reveal that EIF4A2 variants cause a genetic
      neurodevelopmental syndrome with both LOF and gain of function as
      underlying mechanisms.
    explanation: >-
      The dual-mechanism conclusion that the gap asks to resolve at allele
      resolution.
- discussion_id: nedhss_human_neuronal_translatome_missing
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the eIF4A2-dependent translation program characterised in mouse
    embryonic stem cells and Drosophila actually correspond to the program that
    fails in developing human neurons in NEDHSS?
  attaches_to:
  - pathophysiology#Deregulated Neurodevelopmental mRNA Translation Program
  - pathophysiology#Deregulated Cap-Dependent Translation Initiation and 43S Scanning
  rationale: >-
    Every functional characterisation of what eIF4A2 does to a developmental
    program comes from a non-human, non-neuronal system: mouse embryonic stem
    cells (pluripotency factors, histone H3.3, Zscan4) and Drosophila (dpp
    signalling, wing and eye morphogenesis). The one human-cell dataset is
    fibroblasts from the allelic dystonia families, assaying a single Ccr4-Not
    target. No human neuron, cortical organoid, or patient iPSC-derived neural
    model of EIF4A2 has been reported, and no neuronal translatome has been
    measured. This is a translational-validity question rather than a simple
    absence of evidence: the model data exist and are strong, but the mRNA
    targets that matter are cell-type-specific by the models' own logic, so
    their transfer to human neurons is the open question. It matters because
    the identity of the mis-translated neuronal transcripts is what any
    mechanism-directed therapy would have to act on.
  proposed_experiments:
  - experiment_id: nedhss_exp_ipsc_neurons
    name: Patient iPSC-derived cortical neuron translatome
    description: >-
      Derive iPSCs from EIF4A2-variant probands and isogenic controls,
      differentiate to cortical neurons, and profile the translatome by ribosome
      profiling with paired RNA-seq and proteomics.
    decision_criterion: >-
      Identification of a reproducible set of transcripts with altered
      translational efficiency in variant neurons, enriched for
      neurodevelopmental function.
    would_support:
    - pathophysiology#Deregulated Neurodevelopmental mRNA Translation Program
    would_refute:
    - pathophysiology#Deregulated Neurodevelopmental mRNA Translation Program
  - experiment_id: nedhss_exp_eclip_neurons
    name: eIF4A2 eCLIP in human neural cells
    description: >-
      Map eIF4A2 RNA-binding sites in human neural progenitors and neurons by
      eCLIP-seq and test whether the mouse ESC target set is conserved or
      whether a distinct neuronal target set is bound.
    would_support:
    - pathophysiology#Deregulated Cap-Dependent Translation Initiation and 43S Scanning
  - experiment_id: nedhss_exp_organoid_structure
    name: Cortical organoid model of the structural brain phenotype
    description: >-
      Test whether EIF4A2-variant cortical organoids reproduce a structural or
      progenitor-proliferation abnormality corresponding to the structural brain
      anomalies seen on patient imaging.
    would_support:
    - pathophysiology#Disrupted Brain Development with Structural Brain Anomalies
  evidence:
  - reference: PMID:35353581
    reference_title: eIF4A2 targets developmental potency and histone H3.3 transcripts for translational control of stem cell pluripotency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Accordingly, knockdown of eIF4A2 disrupts ESC proteome, causing the loss
      of ESC identity.
    explanation: >-
      The model result whose transfer to human neurons is unvalidated: the
      identity program measured is pluripotency, not neurodevelopment.
  - reference: PMID:36882295
    reference_title: Exploring the targeting spectrum of rocaglates among eIF4A homologs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      mice lacking eIF4A2 are viable, whereas those lacking eIF4A1 are not,
      indicating the latter to be essential
    explanation: >-
      Sharpens the mismatch: the constitutive mouse Eif4a2 knockout is viable
      and has not been reported to model the human neurodevelopmental phenotype,
      so the obvious rodent model does not obviously fit.
- discussion_id: nedhss_epileptogenesis_mechanism_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what route does deregulated eIF4A2-dependent translation produce
    epileptic spasms, and is the epilepsy a consequence of the structural brain
    anomaly or an independent network effect?
  attaches_to:
  - pathophysiology#Cortical Network Hyperexcitability and Epileptogenesis
  rationale: >-
    Epilepsy is a defining feature and the reported semiology (electrographically
    negative spasms evolving to refractory infantile spasms) is specific enough
    to be mechanistically informative, yet nothing is known about how EIF4A2
    dysfunction produces it. Neither the structural-lesion hypothesis nor an
    independent excitability hypothesis has been tested, and no electrophysiology
    in any EIF4A2 model has been reported. Resolving this would determine
    whether antiseizure choice should follow the structural-epilepsy playbook or
    something disorder-specific.
  proposed_experiments:
  - experiment_id: nedhss_exp_neuronal_excitability
    name: Excitability phenotyping of EIF4A2-variant neurons
    description: >-
      Measure intrinsic excitability and network burst behaviour of
      EIF4A2-variant iPSC-derived neurons on multielectrode arrays and by
      patch-clamp, with isogenic controls.
    decision_criterion: >-
      A reproducible hyperexcitable phenotype in variant neurons in the absence
      of any structural abnormality would support an independent network effect.
    would_support:
    - pathophysiology#Cortical Network Hyperexcitability and Epileptogenesis
    would_refute:
    - pathophysiology#Cortical Network Hyperexcitability and Epileptogenesis
  - experiment_id: nedhss_exp_imaging_epilepsy_correlation
    name: Imaging-epilepsy correlation across the reported cohort
    description: >-
      Correlate the specific structural brain anomaly with seizure type, onset
      age, and treatment refractoriness across all reported EIF4A2 individuals
      to test whether epilepsy tracks the structural lesion.
    would_support:
    - pathophysiology#Disrupted Brain Development with Structural Brain Anomalies
  evidence:
  - reference: PMID:41186122
    reference_title: Two Novel Pediatric Cases of EIF4A2-Related Disorder With Refractory Infantile Spasms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both cases presented here involve patients who developed subtle,
      initially electrographically negative, epileptic spasms before going on to
      develop characteristic findings of infantile spasms requiring hormonal
      treatment.
    explanation: >-
      The specific, unexplained epilepsy phenotype the gap is about.
- discussion_id: nedhss_stress_granule_arm
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    Does impaired eIF4A2-dependent stress granule formation contribute to
    NEDHSS, and could it explain the neurodegeneration seen in the bi-allelic
    group?
  attaches_to:
  - pathophysiology#Progressive Neurodegeneration in Bi-allelic Disease
  rationale: >-
    eIF4A2 is sumoylated at K226 and is recruited to stress granules, and cells
    unable to sumoylate eIF4A2 form stress granules poorly. Defective stress
    granule dynamics is a recurring theme in neurodegeneration, which makes this
    an attractive candidate route to the degenerative arm of NEDHSS that is
    absent from the mono-allelic group. The hypothesis is explicitly untested in
    this disease: no patient allele has been assayed for stress granule
    behaviour, no reported variant affects K226, and the stress granule work was
    done in unrelated cell lines. It is recorded as an emerging hypothesis, not
    curated as a pathophysiology node.
  proposed_experiments:
  - experiment_id: nedhss_exp_stress_granules
    name: Stress granule dynamics in EIF4A2-variant cells
    description: >-
      Challenge EIF4A2-variant patient fibroblasts and iPSC-derived neurons with
      arsenite and other stressors and quantify stress granule number,
      persistence and eIF4A2 recruitment relative to controls.
    decision_criterion: >-
      Impaired or persistent stress granule formation in bi-allelic variant
      cells relative to heterozygous and control cells.
    would_support:
    - pathophysiology#Progressive Neurodegeneration in Bi-allelic Disease
    would_refute:
    - pathophysiology#Progressive Neurodegeneration in Bi-allelic Disease
  evidence:
  - reference: PMID:27160682
    reference_title: Sumoylation of eIF4A2 affects stress granule formation.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, we demonstrate that the inability to sumoylate eIF4A2 results
      in impaired stress granule formation, indicating a new role for
      sumoylation in the stress response.
    explanation: >-
      Establishes that eIF4A2 is required for normal stress granule formation;
      support is PARTIAL because the link to NEDHSS neurodegeneration is
      hypothetical and the experiments used a sumoylation-site mutant, not a
      patient allele.
  - reference: PMID:36528028
    reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neurodegeneration was predominantly reported in individuals with bi-allelic variants.
    explanation: >-
      The clinical observation the hypothesis is trying to explain.
  - reference: PMID:39149612
    reference_title: The role of DEAD- and DExH-box RNA helicases in neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aberrant formation of stress granules is an important feature of NDD
      associated pathogenic variants in DHX30 and DDX3x (Lessel et al., 2017;
      Lennox et al., 2020; Mannucci et al., 2021).
    explanation: >-
      Establishes that aberrant stress granule formation is an established
      disease mechanism for two other neurodevelopmental RNA-helicase genes,
      which is the precedent that makes the hypothesis worth testing for
      EIF4A2. Tagged OTHER because it is a review statement about other
      authors' findings.
- discussion_id: nedhss_cohort_too_small
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the full phenotypic spectrum, natural history and genotype-phenotype
    correlation of NEDHSS beyond the 15 individuals of the defining cohort?
  attaches_to:
  - pathophysiology#Global Neurodevelopmental Impairment
  rationale: >-
    The entity rests on a single 15-person cohort plus a two-patient series.
    Frequencies in this entry are therefore small-denominator estimates derived
    from a group-level presenting-features sentence; several features named in
    OMIM and MedGen (poor or absent speech, inability to walk, tube feeding)
    could not be given an independent numerator from any abstract-level source
    and are curated here without frequency bands. Adult outcomes are unknown,
    and whether the mono-allelic and bi-allelic arms differ in anything beyond
    neurodegeneration cannot be assessed.
  proposed_experiments:
  - experiment_id: nedhss_exp_international_cohort
    name: International EIF4A2 cohort with HPO-coded deep phenotyping
    description: >-
      Assemble additional EIF4A2 probands through GeneMatcher, DECIPHER and
      diagnostic laboratories and collect standardised HPO-coded phenotyping
      with per-feature counts, so that frequency bands can be derived rather
      than inferred.
    would_support:
    - pathophysiology#Global Neurodevelopmental Impairment
  - experiment_id: nedhss_exp_natural_history
    name: Longitudinal natural history of the mono-allelic and bi-allelic arms
    description: >-
      Follow mono-allelic and bi-allelic individuals prospectively for
      regression, seizure course, ambulation, feeding status and communication
      outcome, to characterise the degenerative arm.
    would_support:
    - pathophysiology#Progressive Neurodegeneration in Bi-allelic Disease
  evidence:
  - reference: PMID:36528028
    reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on 15 individuals from 14 families presenting with
      global developmental delay, intellectual disability, hypotonia,
      epilepsy, and structural brain anomalies, all of whom have extremely
      rare de novo mono-allelic or inherited bi-allelic variants in EIF4A2
    explanation: >-
      Defines the cohort size that limits every frequency and natural-history
      statement in this entry.
notes: >-
  Named-entity-confusion (NEC) preflight. MONDO:0957541 was verified with OAK
  (`runoak -i sqlite:obo:mondo info MONDO:0957541 -O obo`) on 2026-08-15 and
  carries xref OMIM:620455, xref MEDGEN:1841290, and relationship RO:0004003 to
  HGNC:3284 (EIF4A2), matching the gene and OMIM identity asserted throughout
  this entry. This disorder sits in a large series of near-identically named
  "neurodevelopmental disorder with ..." OMIM entities and its causal gene sits
  in a paralogue family, so two specific confusions were checked and excluded:
  (i) EIF4A3, which is an exon junction complex component sharing only 66%
  identity with eIF4A1 and causes Richieri-Costa-Pereira syndrome, and (ii)
  EIF4A1, the 90%-identical paralogue with no established Mendelian disease. No
  evidence sourced from EIF4A1 or EIF4A3 literature is used for a human
  disease claim in this entry; PMID:36882295 is cited only for the paralogue
  distinction itself and for eIF4A biochemistry.

  Deep research. `just research-disorder falcon` was run for this disorder
  (report at
  `research/Neurodevelopmental_Disorder_with_Hypotonia_and_Speech_Delay-deep-research-falcon.md`,
  Edison/Falcon, 27.6 min, 4 citations). `just preflight-dr <report>
  MONDO:0957541` PASSED: EIF4A2 mentioned 54 times as the top gene, and the
  report's OMIM 620455 matches the MONDO xref. The report's substantive
  contribution was one new lead, the Lederbauer et al. 2024 Front Mol Neurosci
  review (PMID:39149612), which is now cited here for gene-disease validity,
  developmental brain expression, and the DEAD/DExH-box helicase differential.
  It did not surface the 2026 pediatric case series (PMID:41186122), the
  EIF4A2 dystonia paper (PMID:37485550), or any of the eIF4A2-Ccr4-Not
  mechanism literature; those were found by direct PubMed search. Its output
  was treated as leads only - every PMID cited here was independently fetched
  with `just fetch-reference`, and every snippet was verified to be an exact
  substring of the cached record before use.

  Ontology-term caution. Two ontology identifiers suggested by the falcon report
  were rejected after OAK verification: HP:0002463, offered for "Delayed speech
  and language development", is actually "Language impairment" (the correct term
  is HP:0000750, used here), and UBERON:0002596, offered for "cerebral cortex",
  is actually "ventral posterior nucleus of thalamus" (UBERON:0000956 is
  cerebral cortex; this entry uses UBERON:0000955 brain, which is the granularity
  the sources support). The report also proposed an OpenTargets association
  score and a set of NCIT intervention names without codes; neither was used.

  GeneReviews baseline. No GeneReviews chapter exists for NEDHSS or for
  EIF4A2-related disorder. The PubMed query `EIF4A2 GeneReviews[All Fields]`
  (run 2026-08-15) returns a single hit, PMID:20301334 "Monogenic Isolated
  Dystonia Overview", which is a dystonia gene overview rather than a chapter on
  this entity; its cached abstract does not mention EIF4A2 and it is therefore
  not used as a phenotype baseline. The query `neurodevelopmental disorder with
  hypotonia and speech delay[TI] GeneReviews[TI]` returns no results.

  Evidence ceiling. The defining publication (PMID:36528028, Am J Hum Genet
  2023 - PubMed also carries a duplicate record for the same article,
  PMID:36868207, whose cache is empty and which is deliberately not cited) is
  not open access; PMC9892767 and the OpenAlex green-OA record both
  expose only the abstract, so the cached reference contains abstract-level text
  only. Every human-clinical claim in this entry is therefore anchored on the
  cohort-level presenting-features sentence rather than on the paper's Table 1.
  Several features listed in OMIM and MedGen - poor or absent speech, inability
  to walk in the more severely affected, feeding difficulties requiring tube
  feeding - could not be supported with a verifiable quoted snippet from any
  accessible source. Speech delay is curated as a phenotype with PARTIAL support
  and no frequency band; inability to walk and tube feeding are deliberately NOT
  curated as phenotypes rather than sourced to an unquotable claim. This is
  recorded as an open curation gap in the `nedhss_cohort_too_small` discussion
  and should be revisited if the full text becomes accessible.

  Frequency derivation. NO phenotype in this entry carries a `frequency:` band.
  The only cohort-level source sentence names global developmental delay,
  intellectual disability, hypotonia, epilepsy and structural brain anomalies as
  presenting features of 15 individuals, but its "all of whom" clause attaches
  to the EIF4A2 variants, not to the phenotype list, so it is a composite
  descriptor and does not license a per-feature 15/15 numerator. An earlier
  revision of this entry assigned VERY_FREQUENT to those five features on
  exactly that reading; the bands were removed on review. For seizures the
  omission is positively justified rather than merely cautious: the MONDO/OMIM
  label qualifier "with or without seizures" states that seizures are not
  obligate, so any band derived from the ascertained cohort would contradict the
  entity definition. Per CLAUDE.md, omit the band rather than fabricate its
  justification.

  Variants. No `variants:` block is curated. The one EIF4A2 allele with
  published protein-level characterisation, the frameshift deletion
  c.896_897del, belongs to the allelic dystonia-tremor families and not to
  NEDHSS, so recording it under MONDO:0957541 with a PATHOGENIC significance
  would assert - to KGX and graph consumers, which never see the prose caveat -
  that it is pathogenic for this disease. Its haploinsufficiency evidence is
  instead carried, correctly scoped as a molecular claim about the gene, on the
  `Reduced eIF4A2 Protein Dosage` pathophysiology node. An empty variants
  section is the honest outcome while PMID:36528028's Table 1 remains
  inaccessible.

  Scope boundary. The allelic adolescent- to adult-onset EIF4A2 dystonia-tremor
  syndrome (PMID:37485550) is deliberately NOT merged into this entry: no
  dystonia is reported in the NEDHSS cohort and no developmental delay defines
  the dystonia families. It is curated as a differential diagnosis. Its
  patient-fibroblast data are used here only as mechanism evidence for what
  reduced EIF4A2 dosage does to the eIF4A2-Ccr4-Not repression machinery - a
  molecular claim about the gene, not a clinical claim about NEDHSS - and each
  such evidence item is scoped accordingly.

  Model-system linkage. Both the Drosophila humanised rescue model and the two
  non-animal experimental models carry `modeled_mechanisms` links into the
  pathograph, with explicit `limitations` on every link, because none of them is
  a human neuronal system. The mouse Eif4a2 knockout is viable and has not been
  reported as a model of this disorder, so it is mentioned in the animal-model
  `notes` rather than curated as a model.

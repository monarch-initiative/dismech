  - reference: PMID:35353581
    reference_title: eIF4A2 targets developmental potency and histone H3.3 transcripts for translational control of stem cell pluripotency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The binding peaks of eIF4A2 are enriched in mRNAs, particularly at 5′
      untranslated region (5′UTR) and the immediate neighboring region of coding
      sequence (CDS), an mRNA translation initiation region (TIR) that is
      crucial for the regulation of translation initiation
    explanation: >-

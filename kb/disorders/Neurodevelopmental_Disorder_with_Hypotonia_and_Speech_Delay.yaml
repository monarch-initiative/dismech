genetic:
- name: EIF4A2
  gene_term:
    preferred_term: EIF4A2
    term:
      id: hgnc:3284
      label: EIF4A2
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  association: >-
    EIF4A2 (eukaryotic translation initiation factor 4A2, also known as DDX2B)
    is the single causal gene for NEDHSS. Both extremely rare de novo
    mono-allelic variants and inherited bi-allelic variants have been reported,
    across 15 individuals from 14 families, with a further mosaic proband
    described subsequently. Causality rests on the recurrence of ultra-rare
    variants across unrelated families, molecular modelling showing perturbation
    of key protein domains, and in vivo Drosophila rescue assays in which human
    EIF4A2 wild-type cDNA rescued eIF4A loss-of-function pupal lethality while
    the variant cDNAs failed or only incompletely rescued it. The evidence
    supports both loss- and gain-of-function as operating mechanisms across the
    allelic series, which is why the entry does not model a single directional
    dosage lesion.
  evidence:
  - reference: PMID:36528028
    reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on 15 individuals from 14 families presenting with
      global developmental delay, intellectual disability, hypotonia,
      epilepsy, and structural brain anomalies, all of whom have extremely
      rare de novo mono-allelic or inherited bi-allelic variants in EIF4A2
    explanation: >-
      The gene-disease association statement: 15 affected individuals from 14
      unrelated families all carry ultra-rare EIF4A2 variants.
  - reference: PMID:36528028
    reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In comparison, the EIF4A2 variant cDNAs failed or incompletely rescued
      the lethality.
    explanation: >-
      Functional in vivo evidence for variant pathogenicity from the Drosophila
      rescue assay.
  - reference: PMID:36528028
    reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Overall, our findings reveal that EIF4A2 variants cause a genetic
      neurodevelopmental syndrome with both LOF and gain of function as
      underlying mechanisms.
    explanation: >-
      The authors' own summary of the mechanism class supported by their

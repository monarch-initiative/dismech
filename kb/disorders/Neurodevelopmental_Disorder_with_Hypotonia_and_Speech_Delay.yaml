  - reference: PMID:31180491
    reference_title: DEAD-box helicase eIF4A2 inhibits CNOT7 deadenylation activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together, these data show that the fate of an mRNA is dependent on the
      specific recruitment of either eIF4A2 or DDX6 to the CCR4-NOT complex
      which results in different pathways for translational repression and mRNA
      deadenylation.
    explanation: >-
      Shows that eIF4A2 occupancy of Ccr4-Not determines whether a target mRNA
      is repressed or deadenylated, so losing eIF4A2 changes target mRNA fate.
  - reference: PMID:37485550
    reference_title: "Dystonia Linked to EIF4A2 Haploinsufficiency: A Disorder of Protein Translation Dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

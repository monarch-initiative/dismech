animal_models:
- name: Drosophila eIF4A LOF rescue with human EIF4A2 variant cDNA
  species: Drosophila melanogaster
  genotype: eIF4A loss-of-function with transgenic human EIF4A2 wild-type or variant cDNA
  genes:
  - preferred_term: EIF4A2
    term:
      id: hgnc:3284
      label: EIF4A2
  description: >-
    The humanised fly assay used to establish pathogenicity of the mono-allelic
    EIF4A2 variants. Loss of the fly orthologue eIF4A causes pupal lethality;
    this lethality is fully rescued by expression of human wild-type EIF4A2
    cDNA, whereas the patient variant cDNAs failed or only incompletely rescued
    it. Expression of the variants also produced variant-specific behavioural
    and developmental defects, which is the observation that led the authors to
    invoke gain of function in addition to loss of function.
  associated_phenotypes:
  - Pupal lethality on eIF4A loss of function
  - Variant-specific behavioural defects
  - Variant-specific developmental defects
  publication: PMID:36528028
  modeled_mechanisms:
  - target: Rare EIF4A2 Variant
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Tests each human EIF4A2 patient allele for its ability to substitute for
      the endogenous fly orthologue, providing the in vivo pathogenicity
      assignment for the variants curated in this entry.
    limitations: >-
      The fly orthologue eIF4A is a single gene standing in for the human
      eIF4A1/eIF4A2 pair, and the readouts (pupal lethality, wing and eye
      morphogenesis) are invertebrate developmental endpoints with no direct
      counterpart in human brain development.
    evidence:
    - reference: PMID:36528028
      reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To determine the pathogenicity of the EIF4A2 variants in vivo, we
        examined the mono-allelic variants in Drosophila melanogaster (fruit
        fly) and identified variant-specific behavioral and developmental
        defects.
      explanation: >-
        States the purpose and result of the assay: in vivo pathogenicity
        assessment of the human variants.
  - target: Impaired eIF4A2 Helicase and ATPase Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Incomplete rescue by the variant cDNAs, relative to complete rescue by
      wild-type EIF4A2, is the in vivo evidence that the variants impair
      eIF4A2 function; variant-specific extra phenotypes are the evidence that
      some alleles do more than lose function.
    limitations: >-
      The assay scores organismal viability and morphology rather than helicase
      or ATPase biochemistry, so it reports that function is impaired without
      resolving which step of the helicase cycle fails.
    evidence:
    - reference: PMID:36528028
      reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our loss-of-function (LOF) rescue assay demonstrated a pupal lethality
        phenotype induced by loss of eIF4A, which was fully rescued with human
        EIF4A2 wild-type (WT) cDNA expression.
      explanation: >-
        Establishes the rescue baseline against which the variant cDNAs were
        scored.
    - reference: PMID:36528028
      reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In comparison, the EIF4A2 variant cDNAs failed or incompletely rescued
        the lethality.
      explanation: >-
        The variant arm of the same assay, showing impaired function of the
        patient alleles.
  - target: Deregulated Neurodevelopmental mRNA Translation Program
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The fly orthologue regulates a developmental signalling and stem-cell
      identity program, so the model shows that eIF4A dysfunction perturbs a
      developmental program - but the specific program is dpp signalling in fly
      tissues, not a human neuronal translation program.
    limitations: >-
      Fidelity is LOW for this node: decapentaplegic signalling, eye and wing
      morphogenesis have no human neurodevelopmental counterpart, and no
      neuronal translatome measurement was made in the model.
    evidence:
    - reference: PMID:36528028
      reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The fruit fly homolog of EIF4A2 is eIF4A, a negative regulator of
        decapentaplegic (dpp) signaling that regulates embryo patterning, eye
        and wing morphogenesis, and stem cell identity determination.
      explanation: >-
        Defines the developmental program the fly orthologue controls, and by
        the same token the species gap that limits transfer to human neurons.
  evidence:
  - reference: PMID:36528028
    reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our loss-of-function (LOF) rescue assay demonstrated a pupal lethality
      phenotype induced by loss of eIF4A, which was fully rescued with human
      EIF4A2 wild-type (WT) cDNA expression.
    explanation: >-
      Establishes the model system and its core result.
  notes: >-
    A constitutive Eif4a2 knockout mouse exists and is viable, in contrast to
    the lethal Eif4a1 knockout; it has not been reported as a NEDHSS model and
    is therefore not curated as one here.
experimental_models:
- name: EIF4A2-variant patient-derived fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: PATIENT_DERIVED
  description: >-
    Primary skin fibroblasts from carriers of a heterozygous EIF4A2 frameshift
    deletion and, as a comparator, from individuals with bi-allelic EIF4A2
    variants. Used to measure eIF4A2 protein abundance, the level of the
    Ccr4-Not target IMP1, and eIF4A2-Ccr4-Not colocalization, providing the only
    human-cell readout of what EIF4A2 lesions do to the translational
    repression machinery.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:37485550
  modeled_mechanisms:
  - target: Reduced eIF4A2 Protein Dosage
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Quantifies eIF4A2 protein in human cells carrying the patient allele,
      directly establishing the haploinsufficient state.
    evidence:
    - reference: PMID:37485550
      reference_title: "Dystonia Linked to EIF4A2 Haploinsufficiency: A Disorder of Protein Translation Dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In patient-derived fibroblasts, eIF4A2 production amounted to only 50% of the normal quantity.
      explanation: The measurement that grounds the dosage node.
  - target: Loss of eIF4A2-Ccr4-Not-Mediated Translational Repression
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the repression defect in human cells: reduced
      eIF4A2-Ccr4-Not colocalization with de-repression of the Ccr4-Not target
      IMP1, scaling with eIF4A2 dosage across heterozygous and bi-allelic lines.
    limitations: >-
      Fibroblasts are not neurons, the donors carry the allelic dystonia-tremor
      phenotype rather than NEDHSS, and IMP1 is a single surrogate target rather
      than a neuronal translatome.
    evidence:
    - reference: PMID:37485550
      reference_title: "Dystonia Linked to EIF4A2 Haploinsufficiency: A Disorder of Protein Translation Dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Moreover, eIF4A2 and Ccr4-Not displayed significantly diminished
        colocalization in dystonia patient cells.
      explanation: >-
        Shows the assembly defect directly in human patient-derived cells.
    - reference: PMID:37485550
      reference_title: "Dystonia Linked to EIF4A2 Haploinsufficiency: A Disorder of Protein Translation Dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        By complementing the analyses with fibroblasts bearing EIF4A2 biallelic
        mutations, we established a correlation between IMP1 expression
        alterations and eIF4A2 functional dosage.
      explanation: >-
        Demonstrates dose-dependence of the repression defect across genotypes.
  evidence:
  - reference: PMID:37485550
    reference_title: "Dystonia Linked to EIF4A2 Haploinsufficiency: A Disorder of Protein Translation Dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Western blotting and immunocytochemical studies were performed in
      patient-derived fibroblasts.
    explanation: Describes the model system and the assays performed in it.
- name: eIF4A2-knockdown mouse embryonic stem cells
  experimental_model_type: CELL_LINE
  cell_source: OTHER
  description: >-
    Mouse embryonic stem cells subjected to shRNA knockdown of eIF4A2, with
    wild-type and helicase-dead rescue arms, profiled by eCLIP-seq, ribosome
    profiling, SILAC proteomics and RNA-seq. This is the system that defines
    what eIF4A2 actually does to a developmental translation program, and it
    supplies the negative control that eIF4A2 loss does not reduce global
    translation.
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  publication: PMID:35353581
  modeled_mechanisms:
  - target: Deregulated Neurodevelopmental mRNA Translation Program
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Depleting eIF4A2 reshapes the proteome and changes cell identity,
      demonstrating that eIF4A2 dosage sets a developmental translation program.
    limitations: >-
      Pluripotent mouse stem cells are not developing human neurons, and the
      identity program measured (pluripotency versus two-cell totipotency) is
      not the neurodevelopmental program that fails in NEDHSS; the transfer to
      neurons is an inference.
    evidence:
    - reference: PMID:35353581
      reference_title: eIF4A2 targets developmental potency and histone H3.3 transcripts for translational control of stem cell pluripotency.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Accordingly, knockdown of eIF4A2 disrupts ESC proteome, causing the loss
        of ESC identity.
      explanation: >-
        Establishes the proteome-remodelling consequence of eIF4A2 loss; support
        is PARTIAL because the cell type is not neural.
  - target: Deregulated Cap-Dependent Translation Initiation and 43S Scanning
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      eCLIP-seq localises eIF4A2 to the translation initiation region, and
      OP-puro incorporation shows that global translation is unchanged on
      eIF4A2 loss, which is what scopes this node to selective rather than
      global initiation failure.
    limitations: >-
      Measured in mouse pluripotent cells rather than human neurons; whether the
      same transcript selectivity applies in the developing human brain is
      untested.
    evidence:
    - reference: PMID:35353581
      reference_title: eIF4A2 targets developmental potency and histone H3.3 transcripts for translational control of stem cell pluripotency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The binding peaks of eIF4A2 are enriched in mRNAs, particularly at 5′
        untranslated region (5′UTR) and the immediate neighboring region of
        coding sequence (CDS), an mRNA translation initiation region (TIR) that
        is crucial for the regulation of translation initiation
      explanation: >-
        Direct measurement of where eIF4A2 binds relative to the initiation
        site.
  - target: Impaired eIF4A2 Helicase and ATPase Function
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      The rescue arm discriminates protein presence from catalytic activity:
      wild-type eIF4A2 restores the knockdown phenotype while helicase-dead
      DQAD and NEAD mutants do not.
    limitations: >-
      The helicase-dead mutants are engineered catalytic-site substitutions, not
      the patient alleles, so the experiment shows that helicase activity is
      required without showing that the disease variants abolish it.
    evidence:
    - reference: PMID:35353581
      reference_title: eIF4A2 targets developmental potency and histone H3.3 transcripts for translational control of stem cell pluripotency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In addition, only wild-type (WT), but not helicase activity dead mutants
        (DQAD and NEAD) of eIF4A2 (15), can rescue the eIF4A2 KD effects on ESC
        proliferation, morphology, and the expression of differentiation and 2C
        transcripts
      explanation: >-
        Establishes that the catalytic activity of eIF4A2, not merely its
        presence, is required for the developmental program.
  evidence:
  - reference: PMID:35353581
    reference_title: eIF4A2 targets developmental potency and histone H3.3 transcripts for translational control of stem cell pluripotency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      As initiation is the rate-limiting step of translation, we carried out an
      RNA interference screen for key translation initiation factors required to
      maintain embryonic stem cell (ESC) identity.
    explanation: Describes the model system and screen that identified eIF4A2.
diagnosis:
- name: Trio exome or genome sequencing
  description: >-
    NEDHSS has no pathognomonic clinical signature; every reported individual
    was ascertained through genomic testing for unexplained global developmental
    delay, intellectual disability, hypotonia and epilepsy. Trio-based exome or
    genome sequencing is the practical diagnostic route because it both finds
    the ultra-rare EIF4A2 variant and establishes whether it is de novo
    mono-allelic or inherited bi-allelic - a distinction that carries prognostic
    weight, since neurodegeneration predominates in the bi-allelic group, and
    determines recurrence counselling. The defining cohort was assembled from
    clinical and research sequencing programs including the Genomics England
    100,000 Genomes Project and a commercial diagnostic laboratory.
  evidence:
  - reference: PMID:36528028
    reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on 15 individuals from 14 families presenting with
      global developmental delay, intellectual disability, hypotonia,
      epilepsy, and structural brain anomalies, all of whom have extremely
      rare de novo mono-allelic or inherited bi-allelic variants in EIF4A2
    explanation: >-
      Diagnosis rests on identifying an ultra-rare EIF4A2 variant and
      determining its zygosity and inheritance, which is what trio sequencing
      provides.
  - reference: PMID:41186122
    reference_title: Two Novel Pediatric Cases of EIF4A2-Related Disorder With Refractory Infantile Spasms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the rapid adoption and increasing use of genetic testing in pediatric
      neurology, the discovery and characterization of novel pathogenic variants
      resulting in neurodevelopmental and seizure disorders are becoming more
      common.
    explanation: >-
      Confirms genetic testing in pediatric neurology as the route by which
      these patients are identified.
- name: Assessment for mosaicism when parental testing is uninformative
  description: >-
    A mosaic EIF4A2 proband has been reported, so a negative or low-level result
    on standard sequencing does not exclude the diagnosis in a clinically
    compatible child. Deep sequencing of the proband, and testing of a second
    tissue, should be considered when the phenotype fits but a heterozygous call
    is ambiguous.
  evidence:
  - reference: PMID:41186122
    reference_title: Two Novel Pediatric Cases of EIF4A2-Related Disorder With Refractory Infantile Spasms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this case series, we describe two patients with pathogenic EIF4A2
      variants, including one of the first detailed reports of a patient with
      EIF4A2 mosaicism, to add to the growing catalog of genotypic variability
      in this disorder, as well as a novel phenotypic finding of absent
      cochlear nerve.
    explanation: >-
      Documents mosaicism in this disorder, which is the reason to consider
      mosaic-aware testing.
- name: Neuroimaging and EEG
  description: >-
    Brain MRI is indicated because structural brain anomalies are a defining
    feature. Dedicated high-resolution imaging of the internal auditory canal
    should be added when there is any hearing concern, because absent cochlear
    nerve has been reported in this disorder and cochlear nerve aplasia is the
    one hearing-loss aetiology in which a cochlear implant cannot work - so the
    imaging result, not the audiogram, determines whether implantation is even
    an option. EEG has a specific pitfall in this disorder: the epileptic spasms
    reported in both patients of the 2026 series were initially
    electrographically negative, so a normal early EEG does not exclude evolving
    infantile spasms and repeat or prolonged video-EEG is warranted when spells
    are described.
  evidence:
  - reference: PMID:41186122
    reference_title: Two Novel Pediatric Cases of EIF4A2-Related Disorder With Refractory Infantile Spasms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both cases presented here involve patients who developed subtle,
      initially electrographically negative, epileptic spasms before going on to
      develop characteristic findings of infantile spasms requiring hormonal
      treatment.
    explanation: >-
      Directly documents the electrographically negative onset that motivates
      repeat EEG.
  - reference: PMID:41186122
    reference_title: Two Novel Pediatric Cases of EIF4A2-Related Disorder With Refractory Infantile Spasms.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this case series, we describe two patients with pathogenic EIF4A2
      variants, including one of the first detailed reports of a patient with
      EIF4A2 mosaicism, to add to the growing catalog of genotypic variability
      in this disorder, as well as a novel phenotypic finding of absent
      cochlear nerve.
    explanation: >-
      Reports absent cochlear nerve in this disorder, which is the finding that
      makes dedicated internal-auditory-canal imaging worthwhile; support is
      PARTIAL because the source recommends no imaging protocol.
  - reference: PMID:36528028
    reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on 15 individuals from 14 families presenting with
      global developmental delay, intellectual disability, hypotonia,
      epilepsy, and structural brain anomalies, all of whom have extremely
      rare de novo mono-allelic or inherited bi-allelic variants in EIF4A2
    explanation: >-
      Structural brain anomalies are a defining feature, which is the indication
      for brain MRI.
differential_diagnoses:
- name: EIF4A2-related dystonia-tremor syndrome
  description: >-
    The principal allelic differential. Heterozygous truncating EIF4A2 alleles
    causing haploinsufficiency have been shown to underlie a dominant
    dystonia-tremor syndrome with adolescence- to adulthood-onset, a very
    different age of onset and phenotype from pediatric NEDHSS. The two share a
    gene and a molecular lesion (impaired eIF4A2-Ccr4-Not repression) but not a
    clinical presentation, and this entry deliberately does not merge them: no
    dystonia is reported in the NEDHSS cohort and no developmental delay defines
    the dystonia families. When an EIF4A2 variant is found, age of onset and the
    presence or absence of developmental delay separate the two.
  evidence:
  - reference: PMID:37485550
    reference_title: "Dystonia Linked to EIF4A2 Haploinsufficiency: A Disorder of Protein Translation Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings demonstrate that EIF4A2 haploinsufficiency underlies a
      previously unrecognized dominant dystonia-tremor syndrome.
    explanation: >-
      Establishes the allelic movement-disorder entity that must be
      distinguished from NEDHSS.
  - reference: PMID:37485550
    reference_title: "Dystonia Linked to EIF4A2 Haploinsufficiency: A Disorder of Protein Translation Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The disease was characterized by adolescence- to adulthood-onset dystonia with tremor.
    explanation: >-
      The age of onset and semiology that separate this entity from pediatric
      NEDHSS.
- name: Other translational-machinery neurodevelopmental disorders
  description: >-
    Variants in other components of the translation-initiation apparatus produce
    overlapping neurodevelopmental phenotypes, including EIF2AK2-related
    neurodevelopmental delay and dystonia. The shared theme of translational
    deregulation across both early neurodevelopmental and later-onset dystonic
    conditions means that a clinical picture of developmental delay with a
    movement disorder should prompt consideration of this whole gene group
    rather than EIF4A2 alone. Discrimination is by sequencing, not by phenotype.
  evidence:
  - reference: PMID:37485550
    reference_title: "Dystonia Linked to EIF4A2 Haploinsufficiency: A Disorder of Protein Translation Dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Variants in the translational regulator EIF2AK2 were first linked to
      neurodevelopmental-delay phenotypes, followed by their implication in
      dystonia.
    explanation: >-
      Names the closest mechanistic neighbour gene and its parallel
      developmental-plus-dystonia phenotype; this is background framing rather
      than a result of the study, hence OTHER.
  - reference: PMID:37485550
    reference_title: "Dystonia Linked to EIF4A2 Haploinsufficiency: A Disorder of Protein Translation Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The data imply that translational deregulation is more broadly linked to
      both early neurodevelopmental phenotypes and later-onset dystonic
      conditions.
    explanation: >-
      States the shared mechanistic axis that defines this differential
      category.
- name: Other DEAD/DExH-box RNA helicase neurodevelopmental disorders
  description: >-
    EIF4A2 is one of a small set of DEAD/DExH-box RNA helicase genes definitely
    associated with a primary neurodevelopmental disorder, alongside DDX3X
    (Snijders Blok-type syndromic X-linked intellectual developmental disorder),
    DDX6 (intellectual developmental disorder with impaired language and
    dysmorphic facies), DHX30 (neurodevelopmental disorder with variable motor
    and language impairment), DHX16 and DHX37. These share the RNA-helicase
    mechanism class and, for EIF4A2, DDX3X, DDX6 and DHX30, strong expression
    throughout human brain development. The clinical phenotypes overlap
    substantially (developmental delay, language impairment, hypotonia,
    seizures), so discrimination is by sequencing rather than by examination -
    which is the practical argument for a broad NDD panel or exome rather than
    single-gene testing.
  evidence:
  - reference: PMID:39149612
    reference_title: The role of DEAD- and DExH-box RNA helicases in neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Similarly, a broad spectrum of variants in DDX3X is associated with
      Syndromic X-linked intellectual developmental disorder of the Snijders
      Blok type
    explanation: >-
      Names the closest same-family differential; this is a review summary of
      other authors' cohorts rather than primary data, hence OTHER.
  - reference: PMID:39149612
    reference_title: The role of DEAD- and DExH-box RNA helicases in neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Out of the already established NDD-associated DExH/DEAD-box RNA helicase
      genes, EIF4A2 (DDX2B), DDX3X, DDX6 and DHX30, showed a strong expression
      during all developmental periods.
    explanation: >-
      Groups EIF4A2 with the specific helicase genes that share both a
      neurodevelopmental phenotype and strong developmental brain expression,
      defining the boundary of this differential category.
- name: EIF4A3-related Richieri-Costa-Pereira syndrome
  description: >-
    A named-entity trap rather than a clinical differential. EIF4A3 is a
    paralogue of EIF4A2 sharing 66% amino acid identity with eIF4A1, but it is a
    component of the exon junction complex rather than a translation-initiation
    factor, and biallelic EIF4A3 repeat expansions cause Richieri-Costa-Pereira
    syndrome, a craniofacial and limb malformation disorder with a completely
    different presentation. EIF4A1, the closest paralogue at 90% identity, has
    no established Mendelian disease. Literature searches on "EIF4A" must be
    disambiguated to the correct paralogue before evidence is used.
  evidence:
  - reference: PMID:36882295
    reference_title: Exploring the targeting spectrum of rocaglates among eIF4A homologs.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In humans, eIF4A1 and eIF4A2 are implicated in translation initiation and
      share 90% amino acid identity, while eIF4A3 is a component of the exon
      junction complex (EJC) and shares 66% amino acid identity with eIF4A1.
    explanation: >-
      Establishes that eIF4A3 is functionally distinct from eIF4A2 despite the
      shared family name, which is the basis for keeping the disorders apart.
treatments:
- name: Antiseizure Pharmacotherapy and Hormonal Therapy for Infantile Spasms
  description: >-
    Seizure management is empiric and syndrome-directed. Both patients in the
    2026 pediatric series progressed to infantile spasms that required hormonal
    treatment (the standard first-line approach to infantile spasms), and the
    series title records the spasms as refractory. No EIF4A2-specific antiseizure
    strategy has been established and no efficacy data exist for this disorder.
    The practical implication of the reported course is that spasms should be
    looked for actively and treated promptly, not that any particular agent is
    preferred.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Infantile spasms
    term:
      id: HP:0012469
      label: Infantile spasms
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:41186122
    reference_title: Two Novel Pediatric Cases of EIF4A2-Related Disorder With Refractory Infantile Spasms.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both cases presented here involve patients who developed subtle,
      initially electrographically negative, epileptic spasms before going on to
      develop characteristic findings of infantile spasms requiring hormonal
      treatment.
    explanation: >-
      Documents that hormonal treatment for infantile spasms was required;
      support is PARTIAL because no response or outcome data are reported and
      the series describes the spasms as refractory.
  notes: >-
    `therapeutic_modality` is deliberately omitted. The only agent class the
    source documents is hormonal therapy for infantile spasms; ACTH is a
    peptide while prednisolone and vigabatrin are small molecules, and no
    specific agent is named, so any platform tag would be an unsupported
    assertion.
- name: Developmental, Physical and Communication Therapy
  description: >-
    Because global developmental delay, hypotonia and poor or absent speech are
    the core disability, multidisciplinary developmental support - physical and
    occupational therapy for hypotonia and motor delay, and speech and
    alternative-communication support for the speech deficit - is the mainstay
    of care. No disorder-specific rehabilitation protocol has been published;
    this is standard practice for a severe global neurodevelopmental disorder
    and is curated here as supportive care rather than as an evidence-based
    disease-modifying intervention.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:36528028
    reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized by intellectual disability, hypotonia, and epilepsy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on 15 individuals from 14 families presenting with
      global developmental delay, intellectual disability, hypotonia,
      epilepsy, and structural brain anomalies, all of whom have extremely
      rare de novo mono-allelic or inherited bi-allelic variants in EIF4A2
    explanation: >-
      Establishes the developmental delay and hypotonia that motivate
      rehabilitation input; support is PARTIAL because the source reports no
      therapy or outcome data.
- name: Hearing Habilitation
  description: >-
    Absent cochlear nerve has been reported in this disorder. Because a
    non-existent cochlear nerve is the one hearing-loss aetiology in which a
    cochlear implant cannot work, habilitation for an affected child may
    require an auditory brainstem implant or a visual/manual communication
    route rather than a cochlear implant. This is inference from the anatomical
    finding, not a reported intervention in an EIF4A2 patient. The diagnostic
    step that must precede any implantation decision - dedicated imaging of the
    internal auditory canal - is curated in `diagnosis` rather than here.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing habilitation and assistive listening
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Absent cochlear nerve
    term:
      id: HP:6000988
      label: Cochlear nerve aplasia
  evidence:

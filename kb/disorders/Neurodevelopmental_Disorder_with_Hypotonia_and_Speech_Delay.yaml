- name: Loss of eIF4A2-Ccr4-Not-Mediated Translational Repression
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Separately from its activating role in eIF4F, eIF4A2 is a major effector of
    the repressive microRNA pathway. It binds the MA3 and MIF4G domains of
    CNOT1 - competing with DDX6 for the same site - and, once incorporated into
    Ccr4-Not, represses target mRNAs at the initiation step by binding
    purine-rich motifs in the 5' UTR immediately upstream of the AUG. Which
    helicase is recruited also determines the fate of the transcript: eIF4A2
    inhibits CNOT7 deadenylase activity whereas DDX6 enhances it, so
    eIF4A2-bound mRNAs keep longer poly(A) tails. In EIF4A2-variant patient
    fibroblasts this arm is measurably broken: eIF4A2 and Ccr4-Not show
    significantly reduced colocalization and the Ccr4-Not target IMP1 is
    abnormally elevated.

- name: Deregulated Neurodevelopmental mRNA Translation Program
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Because eIF4A2 both activates initiation on some transcripts and represses
    others via Ccr4-Not, its disruption reshapes a specific translational
    program rather than reducing protein output globally. In embryonic stem
    cells, eIF4A2 activates translation of pluripotency-factor and histone H3.3
    mRNAs while restricting the totipotent two-cell program, and its knockdown
    disrupts the proteome and causes loss of cell identity - the clearest
    experimental demonstration that eIF4A2 dosage sets a developmental cell-fate
    program through translation. The disease-relevant claim, that the equivalent
    program in developing human neurons is what fails in NEDHSS, is an extension
    from stem-cell and invertebrate systems and is therefore provisional.
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell

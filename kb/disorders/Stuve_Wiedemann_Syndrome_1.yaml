name: Stuve-Wiedemann Syndrome 1
creation_date: "2026-08-20T02:56:36Z"
category: Mendelian
description: >-
  Stuve-Wiedemann syndrome 1 (STWS1) is a rare autosomal recessive bent-bone
  dysplasia caused by biallelic loss-of-function variants in LIFR, which
  encodes the leukemia inhibitory factor receptor. Failed LIF/CNTF-family
  gp130–JAK–STAT3 signaling in chondrocytes and autonomic/sensory neurons
  produces congenital bowing of the long bones with osteopenia, camptodactyly,
  and a life-threatening neonatal dysautonomia (temperature instability,
  swallowing dysfunction, and respiratory distress). Historically labeled
  neonatal Schwartz-Jampel syndrome type 2, it is genetically and
  mechanistically distinct from HSPG2/perlecan Schwartz-Jampel syndrome.
disease_term:
  preferred_term: Stuve-Wiedemann syndrome 1
  term:
    id: MONDO:0800043
    label: Stüve-Wiedemann syndrome 1
parents:
- hereditary disease
- Skeletal Dysplasia
synonyms:
- STWS
- STWS1
- Stuve-Wiedemann syndrome
- Stüve-Wiedemann syndrome
- Stüve-Wiedemann dysplasia
- Schwartz-Jampel syndrome type 2
- neonatal Schwartz-Jampel syndrome
- SJS2
notes: >-
  LUMP/SPLIT: this entry models only LIFR-related Stuve-Wiedemann syndrome 1
  (MONDO:0800043; OMIM:601559). The IL6ST-related phenocopy Stuve-Wiedemann
  syndrome 2 (MONDO:0030756; OMIM:619751; "extended Stuve-Wiedemann syndrome"
  in Chen et al., PMID:31914175) remains a separate stub
  (stubs/Stuve-Wiedemann_Syndrome_2.yaml) because gp130 (IL6ST) is the shared
  co-receptor for many IL-6-family cytokines, complete IL6ST loss abolishes
  IL-6/IL-11/IL-27/OSM/LIF responses rather than LIFR-selective signaling, and
  the ISDS 2023 bent-bone group lists "Stuve-Wiedemann dysplasia (LIFR)"
  specifically. The parent grouping MONDO:0031280 is recorded as a broadMatch,
  not as the primary disease_term. This entity must not be folded into
  Schwartz-Jampel syndrome (HSPG2/perlecan; kb/disorders/Schwartz-Jampel_Syndrome.yaml).

  No dedicated GeneReviews chapter was found (PubMed searches
  "Stuve-Wiedemann GeneReviews[All Fields]" and "LIFR GeneReviews"; the sole
  GeneReviews-tagged hit, PMID:40521311, is a prenatal ultrasound series that
  searched GeneReviews as a literature source, not a GeneReviews chapter).

  Orphanet structured cache for ORPHA:3206 could not be rebuilt in this
  worktree (en_product1.xml not present); prevalence is recorded from the
  published case literature rather than an Orphanet epidemiology class.
  Mikelonis et al. 2014 (PMID:24618404) prints OMIM  # 610559 in the abstract;
  the canonical OMIM phenotype number for LIFR-related STWS is 601559
  (Warnier et al. 2022; MONDO xref).

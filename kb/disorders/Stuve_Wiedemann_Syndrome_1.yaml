differential_diagnoses:
- name: Schwartz-Jampel syndrome (HSPG2/perlecan)
  description: >-
    Historical "SJS type 2" was STWS. True Schwartz-Jampel syndrome is the
    HSPG2/perlecan chondrodystrophic myotonia with mask-like face and
    neuromyotonia, not LIFR dysautonomia.
  distinguishing_features:
  - Causal gene HSPG2 rather than LIFR
  - Myotonia/neuromyotonia from AChE-anchor failure, not JAK/STAT3 loss
  - No hyperthermic dysautonomic lethality as the defining course
  evidence:
  - reference: PMID:14740318
    reference_title: Null leukemia inhibitory factor receptor (LIFR) mutations in Stuve-Wiedemann/Schwartz-Jampel type 2 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude, therefore, that SWS and SJS2 represent a single clinically and genetically homogeneous condition due to null mutations in the LIFR gene on chromosome 5p13.
    explanation: >-
      Separates historical SJS type 2 (now STWS/LIFR) from HSPG2 SJS.
- name: Campomelic dysplasia (SOX9)
  description: >-
    Another ISDS bent-bone dysplasia. Distinguished by SOX9-related scapular
    hypoplasia, 11 pairs of ribs, sex reversal in many 46,XY infants, and
    absence of LIFR-type dysautonomia.
  distinguishing_features:
  - Causal gene SOX9 rather than LIFR
  - Hypoplastic scapulae and 11 rib pairs
  - 46,XY sex reversal in many affected infants
  evidence:
  - reference: PMID:35461249
    reference_title: "Clinical overview and outcome of the Stuve-Wiedemann syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Involvement of scapulae and pelvis is typical of CD, since enlarged metaphysis and diaphyseal cortical thickening at the concavity of long bones are suggestive of SWS
    explanation: >-
      Contrasts campomelic dysplasia's scapular/pelvic involvement with the
      STWS long-bone concavity pattern.
- name: Stuve-Wiedemann syndrome 2 / extended STWS (IL6ST)
  description: >-
    Complete GP130 (IL6ST) loss causes a lethal Stuve-Wiedemann-like skeletal
    and neonatal lung phenotype plus thrombocytopenia, dermatitis, renal
    anomalies, and defective acute-phase response. Broader cytokine failure
    than LIFR-null STWS1.
  distinguishing_features:
  - Causal gene IL6ST rather than LIFR
  - Absent responses to IL-6, IL-11, IL-27, OSM, and LIF
  - Extra-skeletal immune, hematologic, cutaneous, and renal features
  evidence:
  - reference: PMID:31914175
    reference_title: Absence of GP130 cytokine receptor signaling causes extended Stüve-Wiedemann syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe three unrelated families with at least five affected individuals who presented with lethal Stüve-Wiedemann-like syndrome characterized by skeletal dysplasia and neonatal lung dysfunction with additional features such as congenital thrombocytopenia, eczematoid dermatitis, renal abnormalities, and defective acute-phase response.
    explanation: >-
      Defines the IL6ST phenocopy as an extended, broader syndrome rather than
      classic LIFR STWS1.
discussions:
- discussion_id: stws1_lifr_mouse_perinatal_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Chondrogenesis and Bone Remodeling
  - pathophysiology#Autonomic and Sensory Neuron Dysfunction
  prompt: >-
    How faithfully does perinatal-lethal Lifr-null mouse osteopenia and
    astrocyte loss represent the human STWS1 natural history, in which some
    patients survive infancy with accumulating orthopedic disease as
    dysautonomia lessens?
  rationale: >-
    Ware et al. 1995 show that homozygous Lifr disruption is lethal on the
    day of birth, with reduced fetal bone volume and reduced astrocytes.
    Human STWS1 has high but not universal infant mortality (42% before age
    2 in Warnier et al.), and survivors have a distinct later phenotype the
    mouse cannot reach. The skeletal remodeling direction is concordant; the
    autonomic crisis phenotype and childhood course are not demonstrated in
    the mouse.
  proposed_experiments:
  - experiment_id: exp_stws1_conditional_lifr_postnatal
    name: Conditional or hypomorphic Lifr alleles with postnatal survival
    description: >-
      Generate conditional or hypomorphic Lifr alleles that permit postnatal
      survival, then perform thermoregulatory, swallowing, and serial skeletal
      phenotyping aligned to the human two-phase natural history (infant
      dysautonomia, then childhood orthopedic accumulation).
    experiment_type:
      preferred_term: conditional gene knockout
  evidence:
  - reference: PMID:7789261
    reference_title: Targeted disruption of the low-affinity leukemia inhibitory factor receptor gene causes placental, skeletal, neural and metabolic defects and results in perinatal death.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pleiotropic defects in the mutant animals preclude survival beyond the day of birth.
    explanation: >-
      Documents the perinatal-lethality mismatch with human survivors.

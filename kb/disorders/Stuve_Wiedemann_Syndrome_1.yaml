classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Hereditary skeletal dysplasia (ISDS bent-bone group); Harrison's
      genetics/heritable-disease Part rather than an organ-system Part.
      Neonatal autonomic/respiratory crises are prominent but are modeled as
      mechanism and phenotype, not as additional Harrison's Parts.
  isds_skeletal_category:
  - classification_value: bent_bone_dysplasia
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (11th edition;
      Unger et al., PMID:36779427), group 20 "Bent bones dysplasia group",
      listed there as "Stuve-Wiedemann dysplasia (LIFR)". In the 2019 revision
      (PMID:31633310) the same group was numbered 18. Placement is recorded
      from the nosology table rather than from an abstract-quotable sentence.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    STWS1 segregates as an autosomal recessive trait; affected individuals
    carry biallelic (homozygous or compound heterozygous) LIFR loss-of-function
    variants and heterozygous parents are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:14740318
    reference_title: Null leukemia inhibitory factor receptor (LIFR) mutations in Stuve-Wiedemann/Schwartz-Jampel type 2 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stuve-Wiedemann syndrome (SWS) is a severe autosomal recessive condition characterized by bowing of the long bones, with cortical thickening, flared metaphyses with coarsened trabecular pattern, camptodactyly, respiratory distress, feeding difficulties, and hyperthermic episodes responsible for early lethality.
    explanation: >-
      Landmark gene-identification paper states autosomal recessive inheritance
      as part of the defining clinical description.
pathophysiology:
- name: Biallelic LIFR Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic LIFR null or truncating variants destabilize the transcript and
    prevent formation of functional leukemia inhibitory factor receptor,
    removing the ligand-specific chain of the LIFR–gp130 heterodimer.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    allelic_hit_role: BIALLELIC_INACTIVATION
    description: >-
      Homozygous or compound-heterozygous germline loss-of-function alleles
      (frameshift, nonsense, splice, or other null) of LIFR.
  genes:
  - preferred_term: LIFR
    term:
      id: hgnc:6597
      label: LIFR
  molecular_functions:
  - preferred_term: leukemia inhibitory factor receptor activity
    term:
      id: GO:0004923
      label: leukemia inhibitory factor receptor activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:14740318
    reference_title: Null leukemia inhibitory factor receptor (LIFR) mutations in Stuve-Wiedemann/Schwartz-Jampel type 2 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 14 distinct mutations were identified in the 19 families.
    explanation: >-
      Establishes LIFR as the causal gene across a multi-family SWS/SJS2 series.
  - reference: PMID:14740318
    reference_title: Null leukemia inhibitory factor receptor (LIFR) mutations in Stuve-Wiedemann/Schwartz-Jampel type 2 syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies indicated that these mutations alter the stability of LIFR messenger RNA transcripts, resulting in the absence of the LIFR protein and in the impairment of the JAK/STAT3 signaling pathway in patient cells.
    explanation: >-
      Patient-cell assays show that the alleles are null at the mRNA and protein
      level, not merely mapping hits.
  downstream:
  - target: Failed LIF-Family gp130 JAK-STAT3 Signaling
- name: Failed LIF-Family gp130 JAK-STAT3 Signaling
  biological_scale: CELLULAR
  description: >-
    Without LIFR, LIF and related IL-6-family ligands cannot assemble a
    productive LIFR–gp130 receptor complex, so JAK-mediated STAT3 signaling
    (and associated MAPK/PI3K output) fails in target cells. This is
    LIFR-selective; complete IL6ST/gp130 loss abolishes a broader cytokine
    set and is modeled separately as STWS2.
  biological_processes:

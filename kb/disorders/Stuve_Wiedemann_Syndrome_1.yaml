- name: Autonomic and Sensory Neuron Dysfunction
  biological_scale: TISSUE
  description: >-
    Failed LIF/CNTF-family signaling in autonomic and sensory neurons produces
    the dysautonomia that dominates neonatal lethality: temperature instability
    with hyperthermic crises, abnormal sweating, reduced pain sensation,
    absent corneal and tendon reflexes, and swallowing/respiratory failure.
    This is not the perlecan/AChE neuromuscular-junction mechanism of
    Schwartz-Jampel syndrome.

    reference_title: Neuropathies of Stüve-Wiedemann Syndrome due to mutations in leukemia inhibitory factor receptor (LIFR) gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Stüve-Wiedemann syndrome (STWS; OMIM  # 610559) is a rare disease that results in dysfunction of the autonomic nervous system, which controls involuntary processes such as breathing rate and body temperature.
    explanation: >-
      Neuropathy-focused review identifies autonomic failure (breathing and
      temperature) as the neural arm of LIFR-related STWS. The abstract's
      OMIM  # 610559 is the known Mikelonis typo; the disease identity is LIFR.
  - reference: PMID:7789261
    reference_title: Targeted disruption of the low-affinity leukemia inhibitory factor receptor gene causes placental, skeletal, neural and metabolic defects and results in perinatal death.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Astrocyte numbers are reduced in the spinal cord and brain stem.
    explanation: >-
      Lifr-null mice show a neural developmental deficit, supporting a

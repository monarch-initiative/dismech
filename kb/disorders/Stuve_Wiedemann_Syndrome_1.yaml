progression:
- phase: Neonatal and infantile high-mortality phase
  age_range: Birth to 2 years
  notes: >-
    Birth through age 2 is dominated by dysautonomic respiratory failure,
    aspiration, and hyperthermic crises. Warnier et al. report 42% mortality
    before age 2 versus 10% after age 2.
  evidence:
  - reference: PMID:35461249
    reference_title: "Clinical overview and outcome of the Stuve-Wiedemann syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality rate is higher during the first 2 years (42% <2 years; 10% >2 years) mainly due to respiratory failure, pulmonary arterial hypertension appearing to be a poor prognosis factor (mortality rate 63%).
    explanation: >-
      Quantifies the early-mortality natural history.
- phase: Childhood orthopedic accumulation in survivors
  age_range: After 2 years
  notes: >-
    After age 2, dysautonomia often lessens while joint restriction, spinal
    deformity, and fractures increase.
  evidence:
  - reference: PMID:35461249
    reference_title: "Clinical overview and outcome of the Stuve-Wiedemann syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After 2 years, orthopaedic symptoms significantly increase including joint mobility restriction (81%), spinal deformations (77%) and fractures (61%).
    explanation: >-
      Describes the survivor natural-history shift toward orthopedic disease.

animal_models:
- name: Lifr-null mouse
  species: Mouse
  genotype: Lifr targeted disruption (homozygous null)
  publication: PMID:7789261
  description: >-
    Homozygous Lifr knockout mice have placental, skeletal, neural and
    metabolic defects and die on the day of birth. Fetal bone volume is
    reduced more than three-fold with a six-fold increase in osteoclasts
    and severe perinatal osteopenia; astrocyte numbers are reduced in
    spinal cord and brainstem.
  genes:
  - preferred_term: LIFR
    term:
      id: hgnc:6597
      label: LIFR
  modeled_mechanisms:
  - target: Impaired Chondrogenesis and Bone Remodeling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Recapitulates low bone volume, osteoclast excess, and osteopenia.
    limitations: >-
      Perinatal lethality precludes modeling of the childhood survivor
      orthopedic phenotype (progressive scoliosis, recurrent fractures).
    evidence:
    - reference: PMID:7789261
      reference_title: Targeted disruption of the low-affinity leukemia inhibitory factor receptor gene causes placental, skeletal, neural and metabolic defects and results in perinatal death.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Fetal bone volume is reduced greater than three-fold and the number of osteoclasts is increased six-fold, resulting in severe osteopenia of perinatal bone.
      explanation: >-
        Direct skeletal readout of the remodeling node.
  - target: Autonomic and Sensory Neuron Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Neural developmental defects (reduced astrocytes) support a nervous-system
      requirement for LIFR but do not reproduce human dysautonomic crises.
    limitations: >-
      The mouse dies on the day of birth and does not exhibit the human
      infantile hyperthermic, swallowing, and sweating phenotype that
      dominates clinical care.
    evidence:
    - reference: PMID:7789261
      reference_title: Targeted disruption of the low-affinity leukemia inhibitory factor receptor gene causes placental, skeletal, neural and metabolic defects and results in perinatal death.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Astrocyte numbers are reduced in the spinal cord and brain stem.
      explanation: >-

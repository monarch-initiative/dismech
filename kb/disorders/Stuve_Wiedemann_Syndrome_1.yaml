    modifier: DECREASED
  evidence:
  - reference: PMID:14740318
    reference_title: Null leukemia inhibitory factor receptor (LIFR) mutations in Stuve-Wiedemann/Schwartz-Jampel type 2 syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies indicated that these mutations alter the stability of LIFR messenger RNA transcripts, resulting in the absence of the LIFR protein and in the impairment of the JAK/STAT3 signaling pathway in patient cells.
    explanation: >-
      Direct functional readout that LIFR-null patient cells fail JAK/STAT3
      signaling.
  - reference: PMID:24618404
    reference_title: "Stüve-Wiedemann syndrome: LIFR and associated cytokines in clinical course and etiology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      LIFR signaling usually follows the JAK/STAT3 pathway, and is initiated by several interleukin-6-type cytokines.
    explanation: >-
      Review statement placing LIFR in the IL-6-family JAK/STAT3 cascade that
      this node represents.

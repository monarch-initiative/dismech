name: Immunodeficiency 127
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  Immunodeficiency-127 (IMD127) is an autosomal recessive inborn error of
  immunity caused by biallelic loss-of-function variants in TNF. It is
  remarkable for how narrow it is: affected individuals mount normal clinical
  and biological inflammatory responses, have normal blood leukocyte subset
  development, and tolerate BCG vaccination — yet they develop recurrent
  pulmonary tuberculosis, typically from the late teens. The narrowness is not
  absolute. One of the two reported patients also had culture-positive Listeria
  monocytogenes septic shock during pregnancy, and the authors argue TNF
  deficiency contributed, since patient macrophages control Listeria poorly in
  vitro. Listeria, like M. tuberculosis, is an intramacrophagic organism, so the
  better statement of the defect is that it affects macrophage control of
  intramacrophagic bacteria rather than M. tuberculosis alone. The mechanism is
  restricted to the macrophage: TNF is required in an autocrine
  loop for the GM-CSF-dependent maturation of the respiratory burst in
  monocyte-derived and alveolar macrophages, and without it those cells cannot
  mount the oxidative killing that controls Mycobacterium tuberculosis. This
  separates IMD127 from chronic granulomatous disease, where the respiratory
  burst is absent in every phagocyte and susceptibility is broad, and it
  supplies the mechanistic explanation for the well-known tuberculosis risk of
  therapeutic TNF blockade.
parents:
- hereditary disease
- inborn error of immunity
- primary immunodeficiency disease
classifications:
  iuis_category:
    classification_value: innate immunity defect
    notes: >-
      Mendelian susceptibility to mycobacterial disease sits in the IUIS
      "Defects in intrinsic and innate immunity" table; TNF deficiency is a
      macrophage-intrinsic effector defect within that group.
disease_term:
  preferred_term: immunodeficiency 127
  term:
    id: MONDO:0975832
    label: immunodeficiency 127

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both reported index patients were homozygous for a private loss-of-function
    TNF variant.
  evidence:
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report two adults with recurrent pulmonary tuberculosis who are homozygous for a private loss-of-function TNF variant."
    explanation: Homozygosity for a loss-of-function TNF allele in both index patients establishes recessive inheritance.

pathophysiology:
- name: Biallelic TNF Loss of Function
  description: >-
    Homozygous private loss-of-function variants in TNF abolish production of
    tumor necrosis factor.
  biological_scale: MOLECULAR
  downstream:
  - target: Absent Macrophage TNF Production
    causal_link_type: DIRECT
    description: >-
      The loss-of-function genotype is expressed as failure of the encoded
      cytokine to be produced by the patients' myeloid cells.
    evidence:
    - reference: PMID:39198650
      reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Their leukocytes, including monocytes and monocyte-derived macrophages (MDMs) do not produce TNF, even after stimulation with IFN"
      explanation: Patient leukocytes carrying the variant fail to produce TNF, linking the genotype to the absent cytokine.
  genetic_context:
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    allele_type: frameshift insertion
    description: >-
      Both affected first cousins are homozygous for the private
      c.190_191ins20 (p.P64Lfs*13) frameshift allele; heterozygous relatives are
      unaffected.
  molecular_functions:
  - preferred_term: tumor necrosis factor receptor binding
    term:
      id: GO:0005164
      label: tumor necrosis factor receptor binding
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two adults with recurrent pulmonary tuberculosis who are homozygous for a private loss-of-function TNF variant"
    explanation: Identifies the causal genotype as biallelic loss of function in TNF.

- name: Absent Macrophage TNF Production
  description: >-
    Patient leukocytes, including monocytes and monocyte-derived macrophages,
    produce no TNF even when stimulated with IFN-gamma. Notably this defect does
    not extend to inflammation generally: the patients mount normal clinical and
    biological inflammatory responses, and blood leukocyte subset development is
    normal.
  biological_scale: CELLULAR
  downstream:
  - target: Impaired Macrophage Respiratory Burst
    causal_link_type: DIRECT
    description: >-
      Loss of the autocrine TNF signal prevents GM-CSF-matured macrophages from
      acquiring a competent respiratory burst. That the link is causal and
      TNF-dependent is shown by rescue: adding TNF back to TNF-deficient
      iPSC-derived macrophages restores the burst.
    evidence:
    - reference: PMID:39198650
      reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The stimulation of TNF-deficient iPS-cell-derived macrophages with TNF rescued the respiratory burst."
      explanation: Restoring TNF restores the respiratory burst, establishing that the absent cytokine causes the burst defect rather than merely accompanying it.
  cell_types:
  - preferred_term: monocyte-derived macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: tumor necrosis factor production
    term:
      id: GO:0032640
      label: tumor necrosis factor production
    modifier: ABSENT
  evidence:
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their leukocytes, including monocytes and monocyte-derived macrophages (MDMs) do not produce TNF, even after stimulation with IFN"
    explanation: Directly documents absent TNF production by patient monocytes and macrophages.

- name: Impaired Macrophage Respiratory Burst
  description: >-
    GM-CSF-matured monocyte-derived macrophages and alveolar macrophage-like
    cells from TNF-deficient patients show an impaired respiratory burst. The
    same defect is reproduced in TNF- and TNFR1-deficient iPSC-derived
    macrophages, and phenocopied in healthy-control macrophages differentiated
    with TNF blockers in vitro and in lung macrophages treated with TNF blockers
    ex vivo — which is why therapeutic TNF blockade carries tuberculosis risk.
    Crucially the defect is confined to this macrophage compartment rather than
    affecting all phagocytes.
  biological_scale: CELLULAR
  downstream:
  - target: Failure of Macrophage Control of Mycobacterium tuberculosis
    causal_link_type: DIRECT
    description: >-
      The oxidative burst is the effector step by which macrophages restrict
      intracellular M. tuberculosis, so its loss removes that control.
    evidence:
    - reference: PMID:39198650
      reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Human TNF is required for respiratory-burst-dependent immunity to Mycobacterium tuberculosis in macrophages"
      explanation: States that the immunity lost is specifically the respiratory-burst-dependent macrophage control of M. tuberculosis.
  - target: Failure of Macrophage Control of Listeria monocytogenes
    causal_link_type: DIRECT
    description: >-
      The same macrophage compartment fails to control Listeria monocytogenes,
      another intramacrophagic organism, and TNF add-back restores that control.
    evidence:
    - reference: PMID:39198650
      reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, TNF signalling in human GM-CSF-matured MDMs is crucial for the control of L. monocytogenes infection and/or replication."
      explanation: States the causal dependence of Listeria control on TNF signalling in the same macrophage population.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  - preferred_term: GM-CSF-matured monocyte-derived macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: respiratory burst
    term:
      id: GO:0045730
      label: respiratory burst
    modifier: DECREASED
  - preferred_term: superoxide metabolic process
    term:
      id: GO:0006801
      label: superoxide metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "an impairment in the respiratory burst was observed in granulocyte-macrophage colony-stimulating factor (GM-CSF)-matured MDMs and alveolar macrophage-like (AML) cells"
    explanation: Documents the respiratory burst impairment in the two macrophage populations from patients.
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TNF- or TNFR1-deficient induced pluripotent stem (iPS)-cell-derived GM-CSF-matured macrophages"
    explanation: TNFR1 deficiency phenocopies TNF deficiency, identifying TNFR1 as the receptor through which the signal acts.
  - reference: PMID:10878503
    reference_title: "Tumor necrosis factor receptor 2 plays a minor role for mycobacterial immunity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Tumor necrosis factor (TNF) signalling via the TNF receptor 1 (TNF-R1) is required for host resistance to mycobacterial infection."
    explanation: >-
      Supports attributing the signal specifically to TNFR1 rather than TNFR2,
      which the entry asserts. Indirect because it is a murine BCG-infection
      comparison of receptor knockouts rather than a human study of this
      disorder.
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "healthy control MDMs and AML cells differentiated with TNF blockers in vitro, and in lung macrophages treated with TNF blockers ex vivo"
    explanation: >-
      Pharmacological TNF blockade in control macrophages phenocopies the
      genetic defect, which is what grounds the parallel with anti-TNF
      tuberculosis risk.
  - reference: PMID:29459143
    reference_title: "ESCMID Study Group for Infections in Compromised Hosts (ESGICH) Consensus Document on the safety of targeted and biological therapies: an infectious diseases perspective (Soluble immune effector molecules [I]: anti-tumor necrosis factor-α agents)."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "anti-TNF-α therapy (infliximab, adalimumab, golimumab, certolizumab pegol and etanercept) is associated with a two-to four-fold increase in the risk of active tuberculosis"
    explanation: >-
      Quantifies the clinical counterpart of the in-vitro blockade result - a
      two-to-fourfold rise in active tuberculosis on anti-TNF therapy. Indirect
      for this disorder because it is a consensus safety review of therapeutic
      blockade rather than a study of inherited TNF deficiency.
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "No defect in ROS production was observed in neutrophils and monocytes from P1 and P2 after stimulation with PMA, suggesting that the defect was macrophage specific"
    explanation: >-
      Establishes that the burst defect is confined to macrophages and spares
      neutrophils and monocytes. This is what the macrophage-restriction claim
      and the macrophage_restricted_burst_defect discussion rest on.
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings contrast with those for patients with inherited complete deficiency of the respiratory burst across all phagocytes, who are prone to multiple infections"
    explanation: >-
      Draws the contrast with chronic granulomatous disease, where the burst is
      absent in every phagocyte and susceptibility is correspondingly broad.

- name: Failure of Macrophage Control of Listeria monocytogenes
  description: >-
    The same macrophage defect impairs control of a second intramacrophagic
    organism. GM-CSF-matured monocyte-derived macrophages from both patients
    yielded more Listeria monocytogenes colony-forming units than controls, and
    TNF stimulation reduced viable bacteria — the same rescue logic that
    establishes the respiratory burst edge. Infliximab-treated control
    macrophages reproduce the phenotype. This is why the defect is better stated
    as impaired control of intramacrophagic bacteria than as
    M. tuberculosis-specific.
  biological_scale: CELLULAR
  downstream:
  - target: Severe Listeria infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      One of the two patients developed culture-positive Listeria septic shock
      during pregnancy. Pregnancy is itself a risk factor for listeriosis, so
      the authors present TNF deficiency as a contributing rather than sufficient
      cause; the edge is recorded as indirect for that reason.
    evidence:
    - reference: PMID:39198650
      reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The pregnancy may itself have contributed to the development of listeriosis"
      explanation: >-
        The authors explicitly qualify the causal attribution, which is why this
        edge is not marked DIRECT.
  cell_types:
  - preferred_term: GM-CSF-matured monocyte-derived macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
    modifier: DECREASED
  evidence:
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Stimulation of the patients' cells with TNF led to a decrease in viable L. monocytogenes levels"
    explanation: >-
      TNF add-back reduces viable Listeria in patient macrophages, establishing
      the control defect as TNF-dependent rather than incidental.
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TNF deficiency may have also had an important role, as TNF-deficient mice are susceptible to Listeria and the rates of Listeria infection/replication were clearly high in the patients"
    explanation: >-
      The authors' own argument that TNF deficiency contributed to the clinical
      listeriosis rather than it being an incidental pregnancy complication.

- name: Failure of Macrophage Control of Mycobacterium tuberculosis
  description: >-
    Without a competent respiratory burst, macrophages cannot restrict
    Mycobacterium tuberculosis. The defect is selective rather than absent
    elsewhere: immunity to weakly virulent mycobacteria — including BCG — and to
    many other infectious agents is preserved, so these individuals are not
    broadly infection-prone, but control of at least one other intramacrophagic
    organism, Listeria monocytogenes, is also impaired.
  biological_scale: ORGANISM
  downstream:
  - target: Recurrent pulmonary tuberculosis
    causal_link_type: DIRECT
    description: >-
      Loss of macrophage control of M. tuberculosis is expressed clinically as
      recurrent pulmonary tuberculosis in otherwise healthy adults.
    evidence:
    - reference: PMID:39198650
      reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we report two adults with recurrent pulmonary tuberculosis who are homozygous for a private loss-of-function TNF variant."
      explanation: Connects the TNF genotype to the recurrent pulmonary tuberculosis phenotype in the index patients.
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
    modifier: DECREASED
  evidence:
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Human TNF is required for respiratory-burst-dependent immunity to Mycobacterium tuberculosis in macrophages but is surprisingly redundant otherwise, including for inflammation and immunity to weakly virulent mycobacteria and many other infectious agents."
    explanation: States both the lost function and the striking narrowness of the defect, which is what defines this disease.

phenotypes:
- category: Infectious
  name: Recurrent pulmonary tuberculosis
  description: >-
    Recurrent pulmonary infection with Mycobacterium tuberculosis in otherwise
    healthy adults, typically presenting from the late teens. Relapse occurs but
    most episodes respond to standard antituberculous treatment.
  phenotype_term:
    preferred_term: Recurrent pulmonary tuberculosis
    term:
      id: HP:0032262
      label: Pulmonary tuberculosis
    temporality: RECURRENT
  evidence:
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report two adults with recurrent pulmonary tuberculosis who are homozygous for a private loss-of-function TNF variant."
    explanation: Reports recurrent pulmonary tuberculosis as the presenting and defining phenotype.

- category: Infectious
  name: Severe Listeria infection
  description: >-
    Culture-positive Listeria monocytogenes septic shock with clinical
    chorioamnionitis at 28 weeks of pregnancy in one of the two reported
    patients, treated successfully with trimethoprim-sulfamethoxazole and
    ampicillin. Pregnancy is itself a risk factor for listeriosis, so this is
    presented by the authors as a contributing rather than sufficient
    consequence of TNF deficiency; the supporting in-vitro finding is that
    patient macrophages control Listeria poorly and are rescued by TNF.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Severe Listeria infection
    term:
      id: HP:5210020
      label: Severe Listeria infection
  evidence:
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood cultures were positive for Listeria monocytogenes."
    explanation: Documents culture-confirmed listeriosis in one of the two reported patients.
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the two patients had listeriosis during pregnancy."
    explanation: States the frequency within the reported cohort, one of two.

progression:
- phase: Onset of tuberculosis
  age_range: late second decade
  notes: >-
    P1 was diagnosed with pulmonary tuberculosis at 19 years and P2 at 18 years,
    with relapse in P2 eight months after a six-month HRZE course. Neither had
    disease in childhood despite BCG vaccination, so the susceptibility only
    becomes apparent with adult Mycobacterium tuberculosis exposure.
  evidence:
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was diagnosed with pulmonary TB at the age of 19 years, presenting with dry cough, pleuritic pain, fever"
    explanation: Records age at first tuberculosis episode in the first patient.
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the age of 18 years, he presented with left pulmonary TB with pleural effusion, which was treated for 6 months with HRZE. Then, 8 months later, he was hospitalized due to a relapse of TB."
    explanation: Records age at onset and the relapse that defines the recurrent course in the second patient.

environmental:
- name: Exposure to Mycobacterium tuberculosis
  description: >-
    An obligate trigger rather than a risk factor. The TNF-null genotype is
    clinically silent without Mycobacterium tuberculosis challenge, and both
    patients were otherwise healthy between episodes.
  exposure_term:
    preferred_term: exposure to Mycobacterium tuberculosis
  review_notes: >-
    Left deliberately unbound. ECTO:3000134 "exposure to Mycobacterium
    tuberculosis" resolves in EBI OLS but is absent from the pinned
    sqlite:obo:ecto build that just validate-terms consults, so binding it fails
    term validation today. ECTO:3000133 "exposure to Mycobacterium tuberculosis
    subsp. tuberculosis" is the only near neighbour and is narrower than the
    claim. Rebind once the local ECTO build is refreshed rather than
    substituting a term that does not mean this.
  influences_mechanisms:
  - target: Failure of Macrophage Control of Mycobacterium tuberculosis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Infection supplies the organism that the TNF-deficient macrophage cannot
      control; without exposure there is no disease.
    evidence:
    - reference: PMID:39198650
      reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we studied two first-cousin Colombian adults with unexplained recurrent pulmonary TB but no adverse reaction to live BCG vaccination"
      explanation: The contrast between virulent M. tuberculosis causing disease and live BCG being tolerated shows the exposure is agent-specific.
  evidence:
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Human TNF is required for respiratory-burst-dependent immunity to Mycobacterium tuberculosis in macrophages but is surprisingly redundant otherwise, including for inflammation and immunity to weakly virulent mycobacteria and many other infectious agents."
    explanation: Establishes that M. tuberculosis specifically, and not mycobacteria generally, is the organism this defect fails against.

genetic:
- name: TNF
  notes: >-
    A homozygous private frameshift variant in TNF, c.190_191ins20
    (p.P64Lfs*13) in exon 2, segregating in a large consanguineous Colombian
    family. The two affected individuals are first cousins. The frameshift
    destroys the mature TNF homology domain, abolishing intracellular,
    transmembrane and secreted TNF.
  gene_term:
    preferred_term: TNF
    term:
      id: hgnc:11892
      label: TNF
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  variants:
  - name: "NM_000594.4:c.190_191ins20 (p.Pro64LeufsTer13)"
    description: >-
      A 20-nucleotide insertion in exon 2 causing a frameshift from codon 64
      with a premature termination codon 13 residues downstream, destroying the
      mature TNF homology domain. Private to the kindred and homozygous in both
      affected first cousins.
    type: frameshift insertion
    clinical_significance: PATHOGENIC
    gene:
      preferred_term: TNF
      term:
        id: hgnc:11892
        label: TNF
    functional_effects:
    - type: LOSS_OF_FUNCTION
      description: >-
        Abolishes production of intracellular, transmembrane and secreted TNF,
        and so all TNF receptor binding.
    evidence:
    - reference: PMID:39198650
      reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pedigree of two related kindreds showing familial segregation of the c.190_191ins20 (p.P64Lfs*13) TNF allele."
      explanation: Names the allele in both cDNA and protein notation and documents its familial segregation.
  evidence:
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two adults with recurrent pulmonary tuberculosis who are homozygous for a private loss-of-function TNF variant"
    explanation: Establishes TNF as the causal gene and the variants as homozygous loss of function.
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pedigree of two related kindreds showing familial segregation of the c.190_191ins20 (p.P64Lfs*13) TNF allele."
    explanation: Names the specific frameshift allele and documents its familial segregation.
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied two related patients from a large consanguineous family from Colombia"
    explanation: Records the consanguineous kindred in which the private homozygous allele was ascertained.

experimental_models:
- name: TNF- and TNFR1-deficient iPSC-derived GM-CSF-matured macrophages
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cell-derived macrophages deficient in TNF or its
    receptor TNFR1, matured with GM-CSF. Used both to reproduce the patient
    respiratory burst defect and, by TNF add-back, to demonstrate that the
    defect is TNF-dependent and reversible.
  modeled_mechanisms:
  - target: Impaired Macrophage Respiratory Burst
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      TNF- and TNFR1-deficient iPSC-derived macrophages reproduce the impaired
      respiratory burst seen in patient cells, and the deficiency is corrected
      by exogenous TNF.
    limitations: >-
      An engineered human cell model rather than patient tissue, and macrophages
      matured in vitro do not fully reproduce the alveolar niche in which
      tuberculosis is actually controlled.
    readouts:
    - name: Respiratory burst in GM-CSF-matured macrophages
      target: Impaired Macrophage Respiratory Burst
      direction: RESTORED
      interpretation: >-
        Adding TNF back to TNF-deficient iPSC-derived macrophages restores the
        respiratory burst, establishing TNF-dependence of the node.
      evidence:
      - reference: PMID:39198650
        reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The stimulation of TNF-deficient iPS-cell-derived macrophages with TNF rescued the respiratory burst."
        explanation: Reports the rescue measurement in this model system.
    evidence:
    - reference: PMID:39198650
      reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "TNF- or TNFR1-deficient induced pluripotent stem (iPS)-cell-derived GM-CSF-matured macrophages"
      explanation: Identifies the model system used to reproduce the macrophage respiratory burst defect.

- name: Patient monocyte-derived alveolar macrophage-like cells
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Alveolar macrophage-like cells generated from the monocytes of both patients
    and of healthy controls - primary patient cells carrying the actual disease
    genotype, in the macrophage type relevant to pulmonary tuberculosis. Used for
    both the oxidative burst measurement and the live Mycobacterium tuberculosis
    infection.
  modeled_mechanisms:
  - target: Failure of Macrophage Control of Mycobacterium tuberculosis
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      The closest available system to the disease-defining event: live
      M. tuberculosis infection of patient-derived cells from the compartment
      where the disease occurs.
    limitations: >-
      Monocyte-derived cells matured in vitro approximate but do not reproduce
      the alveolar niche, and only two patients exist to derive them from.
    readouts:
    - name: Mycobacterium tuberculosis replication in patient AML cells
      target: Failure of Macrophage Control of Mycobacterium tuberculosis
      direction: DECREASED
      interpretation: >-
        Baseline replication was comparable to controls, so nothing was
        restored; the measured effect is a TNF-driven decrease in replication,
        showing that TNF signalling is what limits the organism in this
        compartment.
      evidence:
      - reference: PMID:39198650
        reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The replication of M. tuberculosis was similar in AML cells from patients with TNF deficiency and healthy controls but was strongly decreased by TNF stimulation"
        explanation: Reports the mycobacterial replication measurement and its TNF dependence in patient-derived alveolar macrophage-like cells.
    evidence:
    - reference: PMID:39198650
      reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we infected AML cells generated from healthy controls and TNF-deficient patients with live M. tuberculosis in the presence or absence of TNF"
      explanation: Identifies the model as patient-derived AML cells infected with live M. tuberculosis, not the iPSC line.

diagnosis:
- name: Absent TNF production on leukocyte stimulation
  description: >-
    The functional signature is close to pathognomonic: patient leukocytes,
    including monocytes and monocyte-derived macrophages, produce no TNF even
    after stimulation with IFN-gamma, LPS, BCG or Listeria. Combined with an
    impaired macrophage respiratory burst and normal blood leukocyte subsets,
    this points at the diagnosis, which is then confirmed by sequencing.
  evidence:
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their leukocytes, including monocytes and monocyte-derived macrophages (MDMs) do not produce TNF, even after stimulation with IFN"
    explanation: The absent-TNF-production assay that identifies the disorder functionally.

differential_diagnoses:
- name: Chronic granulomatous disease
  description: >-
    The closest mechanistic mimic and the one this entry is defined against. In
    CGD the respiratory burst is absent across all phagocytes, so patients are
    prone to multiple infections including BCG disease; here it is confined to
    the macrophage compartment and susceptibility is correspondingly narrow.
  distinguishing_features:
  - Neutrophil and monocyte ROS production is normal in TNF deficiency and absent in CGD.
  - BCG vaccination is tolerated in TNF deficiency and causes disease in CGD.
  evidence:
  - reference: PMID:39198650
    reference_title: "Tuberculosis in otherwise healthy adults with inherited TNF deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings contrast with those for patients with inherited complete deficiency of the respiratory burst across all phagocytes, who are prone to multiple infections"
    explanation: States the contrast between pan-phagocyte burst deficiency and this macrophage-restricted defect.

- name: Mendelian susceptibility to mycobacterial disease from IFN-gamma circuit defects
  description: >-
    The other monogenic route to mycobacterial disease. Defects in the
    IL-12/IL-23/IFN-gamma circuit (IL12RB1, TYK2, IFNGR1/2, STAT1, ISG15) also
    predispose to tuberculosis, but severe IFN-gamma defects additionally cause
    BCG disease, which TNF deficiency does not.
  distinguishing_features:
  - IFN-gamma production and downstream signalling are intact in TNF deficiency.
  - BCG vaccination is tolerated in TNF deficiency but causes disease in severe IFN-gamma circuit defects.
  evidence:
  - reference: PMID:32055999
    reference_title: "The monogenic basis of human tuberculosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rare inborn errors of immunity, such as autosomal recessive, complete IL-12R"
    explanation: >-
      Establishes the monogenic differential for tuberculosis against which this
      disorder is distinguished. Indirect because it is a review of the wider
      MSMD/TB genetics field predating the description of TNF deficiency.

treatments:
- name: Standard Antituberculous Chemotherapy
  description: >-
    Both patients were treated with the standard HRZE regimen (isoniazid,
    rifampicin, pyrazinamide, ethambutol). Most episodes respond, although
    relapse occurs. There is no treatment directed at the underlying TNF deficiency.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Failure of Macrophage Control of Mycobacterium tuberculosis
    description: >-
      Antituberculous chemotherapy acts on the organism rather than restoring
      macrophage oxidative killing, so it treats episodes without correcting the
      underlying susceptibility.

discussions:
- discussion_id: tnf_addback_prevents_recurrence
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does recombinant TNF or another agent that restores the macrophage
    respiratory burst reduce tuberculosis recurrence in TNF-deficient
    individuals?
  attaches_to:
  - treatments#Standard Antituberculous Chemotherapy
  - pathophysiology#Impaired Macrophage Respiratory Burst
  rationale: >-
    TNF add-back restores the respiratory burst in TNF-deficient iPSC-derived
    macrophages in vitro, which identifies a directly druggable node. Whether
    that translates into reduced recurrence in patients is untested, and only
    two individuals have been reported.

- discussion_id: macrophage_restricted_burst_defect
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is the respiratory burst defect confined to GM-CSF-matured
    monocyte-derived and alveolar macrophages rather than all phagocytes?
  attaches_to:
  - pathophysiology#Impaired Macrophage Respiratory Burst
  rationale: >-
    The narrowness of this disorder relative to chronic granulomatous disease
    turns on that restriction. Patients with inherited complete deficiency of
    the respiratory burst across all phagocytes are prone to multiple
    infections including BCG disease, whereas TNF-deficient individuals are
    susceptible only to tuberculosis. What makes the alveolar macrophage
    compartment TNF-dependent is not established.

references:
- reference: PMID:39198650
  title: Tuberculosis in otherwise healthy adults with inherited TNF deficiency.

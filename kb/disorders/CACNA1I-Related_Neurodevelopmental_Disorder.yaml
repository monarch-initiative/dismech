    evidence:
    - reference: PMID:33704440
      reference_title: "CACNA1I gain-of-function mutations differentially affect channel gating and cause neurodevelopmental disorders."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Computer modelling of thalamic reticular nuclei neurons indicated that the altered gating properties of the Cav3.3 disease variants lower the threshold and increase the duration and frequency of action potential firing."
      explanation: Simulation results for the gain-of-function variants.

  - target: Hyperpolarized and Slowed Cav3.3 Gating
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: >-
      Heterologous overexpression of the mutant channel alone, without
      wild-type co-expression or neuronal context.
    evidence:
    - reference: PMID:33704440
      reference_title: "CACNA1I gain-of-function mutations differentially affect channel gating and cause neurodevelopmental disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutations resulted in slowed kinetics of current activation, inactivation, and deactivation, and in hyperpolarizing shifts of the voltage-dependence of activation and inactivation, with Cav3.3-I860N showing the strongest and Cav3.3-I860M the weakest effect."
      explanation: Gating measurements in this system.
  - target: Reduced Cav3.3 Current and Accelerated Gating
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: Heterologous overexpression without neuronal context.
    evidence:
    - reference: PMID:40825030
      reference_title: "Two pairs of CACNA1I (CaV3.3) variants with opposite effects on channel function cause neurodevelopmental disorders of varying severity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "While substitution A398E leads to a gain of channel function, A398V results in decreased current density, accelerated gating kinetics, and a decreased neuronal excitability."
      explanation: A398V measurements in the same system.
computational_models:
- name: NEURON thalamic reticular neuron model with Cav3.3 variant gating
  description: >-
    Hodgkin-Huxley simulation of a thalamic neuron in which the T-type
    conductance parameters are replaced by those measured for wild-type and
    variant Cav3.3, used to compare rheobase, firing frequency and burst
    duration across variants, including a simulated 1:1 heterozygous state.
  model_type: PHYSIOLOGICAL
  model_software: NEURON
  publication: PMID:33704440
  modeled_mechanisms:
  - target: Thalamic Reticular Neuron Hyperexcitability
    relationship: PERTURBS
    fidelity: LOW
    model_scale: CELLULAR
    limitations: >-
      A single-cell model using HEK293T-derived channel parameters; it has no
      network connectivity and has not been checked against recordings from

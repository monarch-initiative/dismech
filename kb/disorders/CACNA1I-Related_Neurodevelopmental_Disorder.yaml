- name: Hyperpolarized and Slowed Cav3.3 Gating
  biological_scale: MOLECULAR
  description: >-
    Mutant Cav3.3 channels activate and inactivate at more negative voltages
    and inactivate and deactivate more slowly, so they open more readily and
    stay open longer. The magnitude differs by variant: I860N is strongest and
    I860M weakest at residue 860, and M1425I is stronger than M1425V,
    paralleling clinical severity.
  genes:

- name: Disrupted Thalamic Sleep Spindle Rhythmogenesis
  biological_scale: TISSUE
  description: >-
    Cav3.3 drives the oscillatory bursting of thalamic reticular neurons that
    generates NREM sleep spindles; Cav3.3 knockout mice lose this bursting and
    have weakened spindle oscillations. Altered spindles are proposed, not
    shown, in CACNA1I-related neurodevelopmental disorder.
  locations:
  - preferred_term: thalamic reticular nucleus
    term:
      id: UBERON:0001903
      label: thalamic reticular nucleus
  biological_processes:
  - preferred_term: sleep
    term:
      id: GO:0030431
      label: sleep
    modifier: ABNORMAL
  evidence:
  - reference: PMID:21808016
    reference_title: "The Ca(V)3.3 calcium channel is the major sleep spindle pacemaker in thalamus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We report the characterization of a transgenic Ca(V)3.3(-/-) mouse line and demonstrate that Ca(V)3.3 channels are indispensable for nRt function and for sleep spindles, a hallmark of natural sleep."
    explanation: Loss of Cav3.3 disrupts spindles; the gain-of-function direction is untested.
  - reference: PMID:26612388
    reference_title: "Suppression of Sleep Spindle Rhythmogenesis in Mice with Deletion of CaV3.2 and CaV3.3 T-type Ca(2+) Channels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "The CaV3.3 subtype dominates nRt rhythmic bursting and mediates a substantial fraction of spindle power in the NREM sleep EEG."
    explanation: Summary of the knockout findings that place Cav3.3 at the spindle generator.
  - reference: PMID:40825030
    reference_title: "Two pairs of CACNA1I (CaV3.3) variants with opposite effects on channel function cause neurodevelopmental disorders of varying severity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The T-type voltage-gated calcium channel CaV3.3 is expressed in GABAergic neurons of the thalamic reticular nucleus (TRN), where its pacemaking activity controls sleep spindle rhythmogenesis during the non-rapid eye movement (NREM) phase of natural sleep."
    explanation: Background physiology linking Cav3.3 to spindles.
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - cav33_sleep_spindle_disruption
    evidence:
    - reference: PMID:40825030
      reference_title: "Two pairs of CACNA1I (CaV3.3) variants with opposite effects on channel function cause neurodevelopmental disorders of varying severity."
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      snippet: "It is therefore well conceivable that distortion of these sleep spindles, due to either increased or reduced CaV3.3 activity, contributes to the neurodevelopmental delay and intellectual disability in the CACNA1I patients."
      explanation: Hypothesis stated in the discussion.

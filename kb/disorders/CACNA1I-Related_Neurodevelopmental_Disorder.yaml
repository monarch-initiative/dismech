- name: Calcium Overload-Associated Neuronal Developmental Injury
  biological_scale: CELLULAR
  description: >-
    Proposed consequence of chronic calcium entry through gain-of-function
    Cav3.3: aberrant synapse formation and neuronal differentiation and loss
    of neurons during brain development, producing global developmental delay,
    absent speech, hypotonia, cerebral visual impairment and, in some patients,
    brain atrophy and delayed myelination. Hypothetical; not demonstrated in
    neurons.
  cell_types:
  - preferred_term: neuron

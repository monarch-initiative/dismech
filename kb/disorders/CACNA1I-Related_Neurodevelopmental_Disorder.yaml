diagnosis:
- name: Exome sequencing
  description: >-
    Reported cases were identified by exome sequencing (trio, duo or quad) or
    a multigene neurodevelopmental panel. Because gain- and partial
    loss-of-function alleles occur at the same residue, the effect of a novel
    missense variant cannot be predicted from its position.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:40825030
    reference_title: "Two pairs of CACNA1I (CaV3.3) variants with opposite effects on channel function cause neurodevelopmental disorders of varying severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio exome sequencing in patients 1, 2, and 3 and their healthy parents revealed the de novo heterozygous c.1193C > A; p.(Ala398Glu) variant in patient 1 and the same de novo heterozygous c.1193C > T; p.(Ala398Val) variant in patients 2 and 3."
    explanation: Diagnosis by trio exome sequencing.
differential_diagnoses:
- name: Other Gate-Modifying Calcium Channelopathies
  description: >-
    De novo gain-of-function missense variants at activation-gate positions of
    other calcium channel genes cause overlapping neurodevelopmental
    disorders: CACNA1G (Cav3.1) disease with cerebellar atrophy, and CACNA1E
    (Cav2.3) and CACNA1A (Cav2.1) developmental and epileptic
    encephalopathies. Distinguished by the gene. KB entries exist for the
    CACNA1E and CACNA1A disorders.
  evidence:
  - reference: PMID:29878067
    reference_title: "De novo mutation screening in childhood-onset cerebellar atrophy identifies gain-of-function mutations in the CACNA1G calcium channel gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified four patients with de novo CACNA1G mutations. They all display severe motor and cognitive impairment, cerebellar atrophy as well as variable features such as facial dysmorphisms, digital anomalies, microcephaly and epilepsy."
    explanation: The CACNA1G (Cav3.1) disorder, distinguished by cerebellar atrophy.
  - reference: PMID:40825030
    reference_title: "Two pairs of CACNA1I (CaV3.3) variants with opposite effects on channel function cause neurodevelopmental disorders of varying severity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The de novo variant p.(Gly352Arg) was reported in nine individuals with seizures, developmental delay, and movement disorders."
    explanation: The CACNA1E variant next to the residue corresponding to Cav3.3 A398.
- name: Schizophrenia
  description: >-
    CACNA1I is a schizophrenia risk gene through common variants; in a
    Swedish cohort, rare patient-derived alleles altered the voltage
    dependence of Cav3.3 while reduced current density was enriched in
    controls. One adult with a gain-of-function p.(Met1425Val) variant
    developed psychosis, but schizophrenia risk alleles are not reported to
    cause the developmental phenotype of this disorder.
  evidence:
  - reference: PMID:34919654
    reference_title: "Analysing an allelic series of rare missense variants of CACNA1I in a Swedish schizophrenia cohort."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our analysis of this allelic series of coding CACNA1I variants revealed that reduced CaV3.3 channel current density was the dominant phenotype associated with rare CACNA1I coding alleles derived from control subjects, whereas rare CACNA1I alleles from schizophrenia patients encoded CaV3.3 channels with altered responses to voltages."
    explanation: Functional profile of schizophrenia-cohort alleles, distinct from the neurodevelopmental disorder.
  - reference: PMID:36592228
    reference_title: "Ca(V)3.3 Channelopathies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Previously, CACNA1I, the gene encoding CaV3.3, had been described as schizophrenia risk gene."
    explanation: Separate gene-disease relationship.
animal_models:
- name: Cav3.3 knockout mouse
  species: Mus musculus
  genotype: Cacna1i-/-
  publication: PMID:21808016
  description: >-
    Constitutive Cav3.3 null mouse. It models loss of the channel, relevant to
    the partial loss-of-function allele and to the sleep spindle hypothesis,
    not to the gain-of-function alleles. No knock-in of a disease variant has
    been reported.
  modeled_mechanisms:
  - target: Disrupted Thalamic Sleep Spindle Rhythmogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Loss of reticular neuron bursting and weakened spindle oscillations.
    limitations: >-
      A complete null in mouse, whereas patients are heterozygous and most
      carry gain-of-function alleles; spindle changes have not been sought in
      patients.
    evidence:
    - reference: PMID:21808016
      reference_title: "The Ca(V)3.3 calcium channel is the major sleep spindle pacemaker in thalamus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The absence of Ca(V)3.3 channels prevented oscillatory bursting in the low-frequency (4-10 Hz) range in nRt cells but spared tonic discharge."
      explanation: Burst loss in reticular neurons of the knockout.

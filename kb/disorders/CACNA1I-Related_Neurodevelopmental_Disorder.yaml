name: CACNA1I-Related Neurodevelopmental Disorder
creation_date: "2026-10-23T17:31:43Z"
category: Mendelian
synonyms:
- neurodevelopmental disorder with speech impairment and with or without seizures
- CACNA1I-related neurodevelopmental disorder
description: >-
  Autosomal dominant neurodevelopmental disorder caused by heterozygous, mostly
  de novo, missense variants in CACNA1I, which encodes the pore-forming alpha1
  subunit of the low-voltage-activated (T-type) calcium channel Cav3.3. About a
  dozen affected individuals have been reported. The phenotype ranges from
  borderline intellectual functioning or mild to moderate intellectual
  disability with speech delay, sometimes with late or no seizures, to a severe
  disorder with global developmental delay, absent speech, muscular hypotonia,
  early-onset epilepsy, cerebral visual impairment and feeding difficulties
  requiring gastrostomy. Microcephaly, autistic and stereotypic behaviour,
  ADHD, psychosis in one adult, postnatal growth retardation, brain atrophy,
  delayed myelination and, in one patient, brain iron accumulation have been
  described. The functionally tested variants cluster at the cytoplasmic ends
  of the S5 and S6 helices that form the channel activation gate. Most are gain
  of function, shifting activation and inactivation to more negative voltages
  and slowing inactivation and deactivation, which enlarges the window current
  and raises calcium influx at rest; one recurrent variant (p.Ala398Val) is a
  partial loss of function and is associated with developmental delay without
  seizures. Proposed mechanisms are calcium overload of developing neurons and
  hyperexcitability of thalamic reticular nucleus neurons, where Cav3.3 is
  highly expressed. The non-selective T-type channel blocker ethosuximide
  improved seizure control in one patient.
disease_term:
  preferred_term: neurodevelopmental disorder with speech impairment and with or without seizures
  term:
    id: MONDO:0859313
    label: neurodevelopmental disorder with speech impairment and with or without seizures
parents:
- Mendelian neurodevelopmental disorder
- Calcium channelopathy
notes: >-
  MONDO:0859313 cross-references OMIM:620114. No GeneReviews chapter exists for
  this disorder. CACNA1I is also a schizophrenia risk gene through common
  variants and rare missense alleles; that association is a different
  gene-disease relationship and is not curated here.
inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous missense variants. Most arose de novo; one p.(Ile860Met)
    family shows transmission from a mildly affected mother to two affected
    children. One p.(Ala398Glu) carrier had an allele balance of 0.2-0.25,
    suggesting somatic mosaicism in the sampled tissue.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:33704440
    reference_title: "CACNA1I gain-of-function mutations differentially affect channel gating and cause neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.(Ile860Met) variant, affecting a residue in the putative channel gate at the cytoplasmic end of the IIS6 segment, was identified in three family members with variable cognitive impairment."
    explanation: Three heterozygous carriers across two generations of one family.
  - reference: PMID:33704440
    reference_title: "CACNA1I gain-of-function mutations differentially affect channel gating and cause neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CACNA1I variants p.(Ile860Asn) and p.(Ile1306Thr) were de novo in Patients 1 and 5, respectively, while Patient 6 carried the heterozygous p.(Met1425Ile) variant absent in his mother."
    explanation: De novo heterozygous occurrence in the severely affected probands.
  - reference: PMID:40825030
    reference_title: "Two pairs of CACNA1I (CaV3.3) variants with opposite effects on channel function cause neurodevelopmental disorders of varying severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio exome sequencing in patients 1, 2, and 3 and their healthy parents revealed the de novo heterozygous c.1193C > A; p.(Ala398Glu) variant in patient 1 and the same de novo heterozygous c.1193C > T; p.(Ala398Val) variant in patients 2 and 3."
    explanation: Three further de novo heterozygous probands with unaffected parents.
  - reference: PMID:40825030
    reference_title: "Two pairs of CACNA1I (CaV3.3) variants with opposite effects on channel function cause neurodevelopmental disorders of varying severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "we identified CACNA1I as a disease gene for autosomal dominant neurodevelopmental disorders"
    explanation: The authors' own summary of the mode of inheritance established in their 2021 report.
mechanistic_hypotheses:
- hypothesis_group_id: cav33_calcium_overload
  hypothesis_label: Calcium overload of developing neurons from gain-of-function Cav3.3 channels
  status: EMERGING
  description: >-
    Enlarged, hyperpolarized window currents and slowed channel closure raise
    calcium entry through mutant Cav3.3 at rest and during firing; chronic
    calcium load from early development is proposed to impair synapse
    formation and neuronal differentiation and cause neuronal loss, giving
    developmental delay and structural brain change. The calcium load has been
    inferred from recombinant-channel recordings; it has not been measured in
    patient neurons or a knock-in model.
  evidence:
  - reference: PMID:33704440
    reference_title: "CACNA1I gain-of-function mutations differentially affect channel gating and cause neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, calcium toxicity in neurons expressing the Cav3.3 variants is one likely cause of the neurodevelopmental phenotype."
    explanation: Authors' inference from the increased calcium influx measured in HEK293T cells.
- hypothesis_group_id: cav33_trn_hyperexcitability
  hypothesis_label: Thalamic reticular neuron hyperexcitability drives seizures
  status: EMERGING
  description: >-
    Gain-of-function Cav3.3 lowers the firing threshold and prolongs bursts of
    thalamic reticular nucleus neurons in computer simulations, which is
    proposed to destabilize thalamocortical rhythms and cause seizures. Support
    comes from simulations and heterologous expression in chromaffin cells; the
    partial loss-of-function p.(Ala398Val) allele lacks both the simulated
    hyperexcitability and seizures.
  evidence:
  - reference: PMID:40825030
    reference_title: "Two pairs of CACNA1I (CaV3.3) variants with opposite effects on channel function cause neurodevelopmental disorders of varying severity."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Here the simulation of action potentials in TRN neurons demonstrates that, even when co-expressed with wild-type in a 1:1 ratio, corresponding to the heterozygous genotype in the patients, the gain-of-function CaV3.3 variants cause hyperexcitability."
    explanation: Simulated hyperexcitability of reticular neurons in the heterozygous state.
  - reference: PMID:40825030
    reference_title: "Two pairs of CACNA1I (CaV3.3) variants with opposite effects on channel function cause neurodevelopmental disorders of varying severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The lack of seizures in the two independent p.(Ala398Val) patients correlates with the absence of increased neuronal excitability in this variant."
    explanation: Seizures segregate with simulated hyperexcitability across alleles.
- hypothesis_group_id: cav33_sleep_spindle_disruption
  hypothesis_label: Distorted thalamic sleep spindles impair neurodevelopment
  status: EMERGING
  description: >-
    Cav3.3 is the pacemaker channel for sleep spindles in thalamic reticular
    neurons. Either increased or reduced Cav3.3 activity is proposed to distort
    spindle rhythmogenesis and the sleep-dependent thalamocortical plasticity it
    supports, contributing to developmental delay and intellectual disability.
    No sleep recordings of patients have been reported.
  evidence:
  - reference: PMID:40825030
    reference_title: "Two pairs of CACNA1I (CaV3.3) variants with opposite effects on channel function cause neurodevelopmental disorders of varying severity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is therefore well conceivable that distortion of these sleep spindles, due to either increased or reduced CaV3.3 activity, contributes to the neurodevelopmental delay and intellectual disability in the CACNA1I patients."
    explanation: The hypothesis as stated by the authors; it is not tested in the paper.
pathophysiology:
- name: CACNA1I Gain-of-Function Missense Variants
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense substitutions at the cytoplasmic ends of S5 and S6
    helices that form the Cav3.3 activation gate: p.(Ala398Glu) in IS6,
    p.(Ile860Asn) and p.(Ile860Met) in IIS6, p.(Ile1306Thr) in IIIS5, and
    p.(Met1425Ile) and p.(Met1425Val) in IIIS6 (NM_021096.4). Structure
    modelling indicates that the substitutions add stabilizing hydrogen bonds
    that slow gate movement.
  genes:
  - preferred_term: CACNA1I
    term:
      id: hgnc:1396
      label: CACNA1I
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:33704440
    reference_title: "CACNA1I gain-of-function mutations differentially affect channel gating and cause neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two additional individuals with global developmental delay, hypotonia, and epilepsy, the variants p.(Ile1306Thr) and p.(Met1425Ile), substituting residues at the cytoplasmic ends of IIIS5 and IIIS6, respectively, were found."
    explanation: Gate-region variants in severely affected patients.
  - reference: PMID:33704440
    reference_title: "CACNA1I gain-of-function mutations differentially affect channel gating and cause neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Structure modelling suggests that by introducing stabilizing hydrogen bonds the mutations slow the kinetics of the channel gate and cause the gain-of-function effect in Cav3.3 channels."
    explanation: Homology modelling of the structural basis of the gain of function.
  - reference: PMID:40825030
    reference_title: "Two pairs of CACNA1I (CaV3.3) variants with opposite effects on channel function cause neurodevelopmental disorders of varying severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report three newly identified activation-gate-modifying heterozygous missense variants of CACNA1I, found in four unrelated patients with neurodevelopmental disease with or without seizures."
    explanation: Three further gate-region variants.
  downstream:
  - target: Hyperpolarized and Slowed Cav3.3 Gating
    causal_link_type: DIRECT
    description: The substitutions alter voltage dependence and kinetics of the mutant channel itself.
    evidence:
    - reference: PMID:33704440
      reference_title: "CACNA1I gain-of-function mutations differentially affect channel gating and cause neurodevelopmental disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutations resulted in slowed kinetics of current activation, inactivation, and deactivation, and in hyperpolarizing shifts of the voltage-dependence of activation and inactivation, with Cav3.3-I860N showing the strongest and Cav3.3-I860M the weakest effect."
      explanation: Patch-clamp recordings of the four variants in HEK293T cells.
    - reference: PMID:40825030
      reference_title: "Two pairs of CACNA1I (CaV3.3) variants with opposite effects on channel function cause neurodevelopmental disorders of varying severity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we found that the two substitutions of M1425 both result in a gain of channel function including left-shifted voltage-dependence of activation and inactivation, slowed inactivation and deactivation kinetics, and increased neuronal excitability."
      explanation: The same gating change for p.(Met1425Ile) and p.(Met1425Val).
- name: CACNA1I Partial Loss-of-Function Missense Variant
  biological_scale: MOLECULAR
  description: >-
    The recurrent de novo p.(Ala398Val) substitution in IS6, found in two
    unrelated patients, changes the same residue as the gain-of-function
    p.(Ala398Glu) but has the opposite effect on channel function.

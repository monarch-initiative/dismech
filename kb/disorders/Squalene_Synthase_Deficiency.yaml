    the farnesol shunt directly and distinguish SQSD from the post-squalene sterol
    defects, which are identified instead by the sterol that accumulates.
  biomarker_term:
    preferred_term: farnesol-derived dicarboxylic acids
    term:
      id: CHEBI:35692
      label: dicarboxylic acid
  evidence:
  - reference: PMID:32027475
    reference_title: Squalene Synthase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with SQSD have a unique urine metabolic profile with increased
      saturated and unsaturated branched-chain dicarboxylic acids and glucuronides
      derived from farnesol.
    explanation: GeneReviews description of the diagnostic urine profile.
  readouts:
  - target: Farnesol Shunt to Dicarboxylic Acids and Glucuronides
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      The excreted acids and glucuronides are the end products of the shunt that
      opens when squalene synthase is absent.

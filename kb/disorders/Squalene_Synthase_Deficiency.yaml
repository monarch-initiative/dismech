animal_models:
- name: Fdft1 null mouse
  species: Mouse
  genotype: Fdft1(-/-)
  publication: PMID:10521476
  description: >-
    Constitutive squalene synthase knockout. Heterozygotes are normal with
    unchanged hepatic cholesterol synthesis despite halved enzyme activity;
    homozygotes die around midgestation with growth retardation and defective
    neural tube closure, and neither maternal dietary squalene nor cholesterol
    rescues them.
  modeled_mechanisms:
  - target: Disrupted Cholesterol-Dependent Embryonic Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Shows that endogenous squalene synthase activity is required for embryonic,
      particularly neural, development.
    limitations: >-
      Complete loss of the enzyme is embryonic lethal, whereas the human patients
      survive with partial-function alleles, so the model shows the severe extreme
      rather than the human malformation pattern.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The authors attribute lethality partly to the immaturity of the murine
        chorioallantoic circulation at midgestation, a placental constraint that
        may not apply in the same way to the human embryo.
    evidence:
    - reference: PMID:10521476
      reference_title: Embryonic lethality and defective neural tube closure in mice lacking squalene synthase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The mice homozygous for the disrupted SS gene (SS-/-) were embryonic lethal
        around midgestation.
      explanation: The null phenotype.
  evidence:
  - reference: PMID:10521476
    reference_title: Embryonic lethality and defective neural tube closure in mice lacking squalene synthase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The lethal phenotype was not rescued by supplementing the dams either with
      dietary squalene or cholesterol.
    explanation: Maternal sterol supplementation does not rescue the embryo.
  - reference: PMID:21247357
    reference_title: >-
      Defects in cholesterol synthesis genes in mouse and in humans: lessons for
      drug development and safer treatments.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The Mvk knockout is early embryonic lethal in the mouse, the absence of Fdft1
      is lethal at E9.5-12.5 dpc, while the Cyp51 knockouts die at 15.0 dpc.
    explanation: >-
      Places the Fdft1 null lethality within the pattern that earlier-acting
      sterol enzymes give earlier lethality.

- name: Liver-specific Fdft1 knockout mouse (L-SSKO)
  species: Mouse
  genotype: Liver-specific Fdft1 deletion (Cre-loxP)
  publication: PMID:25755092
  description: >-
    Hepatocyte squalene synthase ablation. Hepatic cholesterol synthesis is almost
    abolished, plasma cholesterol and triglyceride fall in the fed state, and a
    transient liver dysfunction with moderate hepatomegaly is attributed by the
    authors to increased farnesol production.
  modeled_mechanisms:
  - target: Reduced De Novo Cholesterol Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Loss of the enzyme abolishes hepatic cholesterol synthesis.
    limitations: >-
      Liver only; the extrahepatic tissues that matter for the human phenotype
      retain the enzyme and supply cholesterol to the liver.
    evidence:
    - reference: PMID:25755092
      reference_title: >-
        Plasma cholesterol-lowering and transient liver dysfunction in mice lacking
        squalene synthase in the liver.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-

name: Squalene Synthase Deficiency
creation_date: '2026-10-14T12:36:44Z'
category: Mendelian
description: >-
  Squalene synthase deficiency (SQSD) is an ultra-rare autosomal recessive inborn
  error of cholesterol biosynthesis caused by biallelic FDFT1 variants. FDFT1
  encodes squalene synthase, which condenses two molecules of farnesyl diphosphate
  into squalene, the first committed step of sterol synthesis. Loss of the enzyme
  reduces endogenous cholesterol synthesis and diverts the accumulating farnesyl
  diphosphate into farnesol and farnesol-derived dicarboxylic acids and
  glucuronides, which are excreted in urine and form the diagnostic signature.
  Clinically the disease resembles Smith-Lemli-Opitz syndrome: facial dysmorphism,
  neonatal-onset generalized seizures, nonspecific structural brain malformations,
  cortical visual impairment, optic nerve hypoplasia, profound developmental delay
  and intellectual disability, 2-3 toe syndactyly, dry skin with marked
  photosensitivity, and genital malformations in males.
disease_term:
  preferred_term: squalene synthase deficiency
  term:
    id: MONDO:0032566
    label: squalene synthase deficiency
synonyms:
- SQSD
notes: >-
  Published human data are limited to the three index patients of the 2018
  report (PMID:29909962) and the GeneReviews chapter written by the same group,
  so no phenotype frequencies are recorded. Phenotypes listed only in the
  GeneReviews management section (hypospadias, cryptorchidism, congenital heart
  defects, spasticity, constipation, dysphagia, sleep disturbance) are carried
  with indirect evidence because the summary presupposes rather than reports them.
parents:
- Cholesterol biosynthesis disorder
- Inborn Error of Metabolism
references:
- reference: PMID:32027475
  title: Squalene Synthase Deficiency.
  tags:
  - GeneReviews
- reference: PMID:29909962
  title: >-
    Squalene Synthase Deficiency: Clinical, Biochemical, and Molecular
    Characterization of a Defect in Cholesterol Biosynthesis.

pathophysiology:
- name: Biallelic Hypomorphic FDFT1 Variants
  biological_scale: MOLECULAR
  description: >-
    Recessive FDFT1 variants identified by exome sequencing in the three index
    patients. The one variant characterized functionally acts through a partial
    splicing defect together with altered promoter and/or enhancer activity, so
    some normal transcript is retained. Partial rather than complete loss is
    what the mouse data predict for a viable human disease, since complete loss
    of the enzyme is embryonic lethal in the mouse.
  genes:
  - preferred_term: FDFT1
    term:
      id: hgnc:3629
      label: FDFT1
  molecular_functions:
  - preferred_term: squalene synthase activity
    modifier: DECREASED
    term:
      id: GO:0051996
      label: squalene synthase [NAD(P)H] activity
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:29909962
    reference_title: >-
      Squalene Synthase Deficiency: Clinical, Biochemical, and Molecular
      Characterization of a Defect in Cholesterol Biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing was used to identify recessive disease-causing
      variants in FDFT1.
    explanation: Establishes biallelic FDFT1 variants as the cause of the disease.
  - reference: PMID:29909962
    reference_title: >-
      Squalene Synthase Deficiency: Clinical, Biochemical, and Molecular
      Characterization of a Defect in Cholesterol Biosynthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional characterization of one variant demonstrated a partial splicing
      defect and altered promoter and/or enhancer activity
    explanation: >-
      The functional assays behind this sentence are cell-based, so this item is
      graded IN_VITRO; it shows that at least one allele reduces expression
      through splicing and regulatory effects.
  downstream:
  - target: Deficient Squalene Synthase Activity
    causal_link_type: DIRECT
    description: The variants reduce production of functional squalene synthase.

- name: Deficient Squalene Synthase Activity
  biological_scale: MOLECULAR
  description: >-
    Squalene synthase (farnesyl-diphosphate farnesyltransferase 1) catalyzes the
    reductive head-to-head condensation of two farnesyl diphosphate molecules to
    squalene, the first step committed to sterol rather than to other isoprenoid
    products. Its loss blocks the pathway at the branch point.
  molecular_functions:
  - preferred_term: squalene synthase activity
    modifier: DECREASED
    term:
      id: GO:0051996
      label: squalene synthase [NAD(P)H] activity
  cellular_components:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  evidence:
  - reference: PMID:24531458
    reference_title: Structural insights into the catalytic mechanism of human squalene synthase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Squalene synthase (SQS) is a divalent metal-ion-dependent enzyme that
      catalyzes the two-step reductive `head-to-head' condensation of two
      molecules of farnesyl pyrophosphate to form squalene using presqualene
      diphosphate (PSPP) as an intermediate.
    explanation: >-
      Defines the reaction lost in the disease, from crystal structures of the
      human enzyme.
  - reference: PMID:30578317
    reference_title: >-
      The ER membrane protein complex promotes biogenesis of sterol-related
      enzymes maintaining cholesterol homeostasis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Insertion of the weakly hydrophobic tail-anchor (TA) of SQS into the ER
      membrane by the EMC ensures sufficient flux through the sterol biosynthetic
      pathway
    explanation: >-
      Places the enzyme in the endoplasmic reticulum membrane and ties the amount
      of correctly inserted enzyme to sterol pathway flux.
  - reference: PMID:29909962
    reference_title: >-
      Squalene Synthase Deficiency: Clinical, Biochemical, and Molecular
      Characterization of a Defect in Cholesterol Biosynthesis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FDFT1 encodes for an evolutionarily conserved enzyme, squalene synthase (SS,
      farnesyl-pyrophosphate farnesyl-transferase 1), which catalyzes the first
      committed step in cholesterol biosynthesis.
    explanation: Identifies the enzyme encoded by the disease gene and its position in the pathway.
    quote_role: BACKGROUND
  - reference: PMID:29909962
    reference_title: >-
      Squalene Synthase Deficiency: Clinical, Biochemical, and Molecular
      Characterization of a Defect in Cholesterol Biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The metabolite profile in plasma and urine suggested that their defect was
      at the level of squalene synthase.
    explanation: Places the block at squalene synthase from patient metabolite profiles.
  downstream:
  - target: Reduced De Novo Cholesterol Synthesis
    causal_link_type: DIRECT
    description: Flux from farnesyl diphosphate into squalene and on to cholesterol falls.
    evidence:
    - reference: PMID:25755092
      reference_title: >-
        Plasma cholesterol-lowering and transient liver dysfunction in mice lacking
        squalene synthase in the liver.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Hepatic SS activity of L-SSKO mice was reduced by >90%. In addition,
        cholesterol biosynthesis in the liver slices was almost eliminated.
      explanation: >-
        Tissue-specific ablation of the enzyme abolishes cholesterol synthesis in
        that tissue, which is the edge asserted here.
  - target: Farnesyl Diphosphate Accumulation
    causal_link_type: DIRECT
    description: The substrate upstream of the block accumulates.
    evidence:
    - reference: PMID:9083051
      reference_title: >-
        Farnesol-derived dicarboxylic acids in the urine of animals treated with
        zaragozic acid A or with farnesol.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Farnesyl diphosphate, the substrate for squalene synthase, accumulates in
        the presence of zaragozic acid A, a squalene synthase inhibitor.
      explanation: >-
        Pharmacological inhibition of the same enzyme in animals produces substrate
        accumulation; the genetic deficiency removes the same activity.
      directness: INDIRECT

- name: Reduced De Novo Cholesterol Synthesis
  biological_scale: CELLULAR
  description: >-
    Endogenous cholesterol synthesis falls in every tissue that depends on it.
    The developing embryo and the brain, which cannot draw on circulating
    lipoprotein cholesterol, are the tissues where the shortfall is expected to
    matter most.
  biological_processes:
  - preferred_term: cholesterol biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006695
      label: cholesterol biosynthetic process
  evidence:
  - reference: PMID:25755092
    reference_title: >-
      Plasma cholesterol-lowering and transient liver dysfunction in mice lacking
      squalene synthase in the liver.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      liver-specific ablation of SS inhibits hepatic cholesterol biosynthesis and
      induces hypolipidemia without increasing significant mortality
    explanation: Loss of squalene synthase reduces cholesterol synthesis in vivo.
  downstream:
  - target: Impaired Cholesterol-Dependent Hedgehog Signaling
    causal_link_type: DIRECT
    hypothesis_groups:
    - sqsd_hedgehog_by_analogy
    description: >-
      Sonic hedgehog is activated by covalent attachment of cholesterol, so a
      cholesterol shortfall is expected to impair the morphogen pathway. Inferred
      for SQSD by analogy with the post-squalene defects; not tested in SQSD.
    evidence:
    - reference: PMID:15539288
      reference_title: The function of cholesterol in embryogenesis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The protein SHH is expressed in the notochord of the CNS in the early
        embryo and is activated by being cleaved autocatalytically, with
        simultaneous covalent attachment of cholesterol to the N-terminal fragment
      explanation: >-
        States the molecular dependency of hedgehog signaling on cholesterol that
        this edge relies on.
      directness: INDIRECT
  - target: Disrupted Cholesterol-Dependent Embryonic Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - sqsd_cholesterol_deficit
    description: >-
      Cholesterol is needed for embryonic development, particularly of the nervous
      system; the knockout mouse shows the extreme of this dependency.
    evidence:
    - reference: PMID:10521476
      reference_title: Embryonic lethality and defective neural tube closure in mice lacking squalene synthase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We speculate that cholesterol is required for the development, particularly
        of the nervous system, and that the chorioallantoic circulatory system is
        not mature enough to supply the rapidly growing embryos with maternal
        cholesterol at this developmental stage.
      explanation: >-
        The authors attribute the embryonic phenotype of the null mouse to absent
        endogenous cholesterol at a stage when maternal supply cannot compensate.
    - reference: PMID:29909962
      reference_title: >-
        Squalene Synthase Deficiency: Clinical, Biochemical, and Molecular
        Characterization of a Defect in Cholesterol Biosynthesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Mendelian disorders of cholesterol biosynthesis typically result in
        multi-system clinical phenotypes, underlining the importance of cholesterol
        in embryogenesis and development.
      explanation: >-
        Frames the human malformation phenotype as a consequence of insufficient
        cholesterol during development, as for the other sterol synthesis defects.

- name: Impaired Cholesterol-Dependent Hedgehog Signaling
  biological_scale: CELLULAR
  description: >-
    Reduced sonic hedgehog signaling in the developing embryo secondary to
    insufficient cholesterol. Experimental cholesterol deficiency in rodents
    produces the limb, genital, brain and facial malformations of
    Smith-Lemli-Opitz syndrome with loss of ventral neural tube Shh expression.
    For SQSD this node is an inference by analogy: no study has measured hedgehog
    signaling in FDFT1-deficient tissue.
  biological_processes:
  - preferred_term: sonic hedgehog signaling
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  evidence:
  - reference: PMID:10564872
    reference_title: >-
      Absence of ventral cell populations in the developing brain in a rat model of
      the Smith-Lemli-Opitz syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      They provide further evidence that cholesterol-deficiency-induced HPE
      originates from impaired Shh signaling activity in the ventral neural tube.
    explanation: >-
      Links cholesterol deficiency to impaired Shh signaling in the embryonic brain,
      in a pharmacological model of a different (post-squalene) block.
    directness: INDIRECT
  downstream:
  - target: Disrupted Cholesterol-Dependent Embryonic Development
    causal_link_type: DIRECT
    hypothesis_groups:
    - sqsd_hedgehog_by_analogy
    description: Impaired morphogen signaling disturbs embryonic patterning.

- name: Farnesyl Diphosphate Accumulation
  biological_scale: MOLECULAR
  description: >-
    Farnesyl diphosphate, the substrate of squalene synthase, builds up behind
    the block.
  chemical_entities:
  - preferred_term: farnesyl diphosphate
    modifier: INCREASED
    term:
      id: CHEBI:17407
      label: 2-trans,6-trans-farnesyl diphosphate
  evidence:
  - reference: PMID:9083051
    reference_title: >-
      Farnesol-derived dicarboxylic acids in the urine of animals treated with
      zaragozic acid A or with farnesol.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Farnesyl diphosphate, the substrate for squalene synthase, accumulates in
      the presence of zaragozic acid A, a squalene synthase inhibitor.
    explanation: Direct statement that squalene synthase blockade causes substrate accumulation.
  downstream:
  - target: Farnesol Shunt to Dicarboxylic Acids and Glucuronides
    causal_link_type: DIRECT
    description: >-
      Excess farnesyl diphosphate is dephosphorylated to farnesol and oxidized to
      farnesoic acid and farnesol-derived dicarboxylic acids, or conjugated.
    evidence:
    - reference: PMID:9083051
      reference_title: >-
        Farnesol-derived dicarboxylic acids in the urine of animals treated with
        zaragozic acid A or with farnesol.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The profile of urinary dicarboxylic acids from rats fed farnesol was
        virtually identical to that produced by treating with zaragozic acid A,
        establishing that these dicarboxylic acids are farnesol-derived.
      explanation: >-
        Shows that the acids excreted when squalene synthase is blocked come from
        farnesol, which places farnesol between the accumulated substrate and the
        excreted products.

- name: Farnesol Shunt to Dicarboxylic Acids and Glucuronides
  biological_scale: MOLECULAR
  description: >-
    Carbon diverted from sterol synthesis is converted to farnesol and then to
    saturated and unsaturated branched-chain dicarboxylic acids and farnesol
    glucuronides. In animals treated with a squalene synthase inhibitor this is
    the major fate of the diverted carbon, and the urinary profile it produces is
    the biochemical signature of the human disease. In inhibitor-treated mice
    farnesol formation was not detected, which the authors read as rapid onward
    conversion to farnesoic acid and dicarboxylic acids in the liver, so the
    measurable products are the acids and conjugates rather than farnesol itself.
  notes: >-
    Farnesol is not bound as an increased chemical entity: the mouse study found
    no detectable farnesol, and the cited human source reports farnesol-derived
    products rather than a farnesol concentration.
  biological_processes:
  - preferred_term: farnesol metabolic process
    modifier: INCREASED
    term:
      id: GO:0016487
      label: farnesol metabolic process
  chemical_entities:
  - preferred_term: farnesol-derived dicarboxylic acids
    modifier: INCREASED
    term:
      id: CHEBI:35692
      label: dicarboxylic acid
  evidence:
  - reference: PMID:9083051
    reference_title: >-
      Farnesol-derived dicarboxylic acids in the urine of animals treated with
      zaragozic acid A or with farnesol.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The high level of FDDCAs that were found suggests that their synthesis is the
      major metabolic fate for carbon diverted from cholesterol synthesis by a
      squalene synthase inhibitor.
    explanation: Identifies the shunt as the dominant fate of the diverted carbon.
  - reference: PMID:9647670
    reference_title: >-
      Massive production of farnesol-derived dicarboxylic acids in mice treated with
      the squalene synthase inhibitor zaragozic acid A.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These metabolites were found to be produced only in the liver and not in the
      kidney.
    explanation: Localizes production of the shunt metabolites to the liver.
  - reference: PMID:9647670
    reference_title: >-
      Massive production of farnesol-derived dicarboxylic acids in mice treated with
      the squalene synthase inhibitor zaragozic acid A.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We were unable to detect any farnesol formation in the zaragozic acid-treated
      animals which indicates that FPP is readily converted to farnesoic acid and
      dicarboxylic acids in the liver.
    explanation: Supports the statement that free farnesol does not accumulate measurably.
  - reference: PMID:32027475
    reference_title: Squalene Synthase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with SQSD have a unique urine metabolic profile with increased
      saturated and unsaturated branched-chain dicarboxylic acids and glucuronides
      derived from farnesol.
    explanation: Shows the same shunt operating in patients.

- name: Disrupted Cholesterol-Dependent Embryonic Development
  biological_scale: TISSUE
  description: >-
    Developmental programs that require locally synthesized cholesterol are
    disturbed, producing the Smith-Lemli-Opitz-like pattern of brain, facial,
    digital and genital malformations. Which developmental pathway mediates this
    in SQSD has not been established; hedgehog signaling is the leading candidate
    by analogy with the post-squalene defects (see the hedgehog node).
  evidence:
  - reference: PMID:10521476
    reference_title: Embryonic lethality and defective neural tube closure in mice lacking squalene synthase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      E9.5-10.5 SS-/- embryos exhibited severe growth retardation and defective
      neural tube closure.
    explanation: >-
      Complete loss of the enzyme in the mouse disrupts early neural development,
      the severe end of the developmental phenotype.
  - reference: PMID:29909962
    reference_title: >-
      Squalene Synthase Deficiency: Clinical, Biochemical, and Molecular
      Characterization of a Defect in Cholesterol Biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report three individuals with profound developmental delay, brain
      abnormalities, 2-3 syndactyly of the toes, and facial dysmorphisms,
      resembling Smith-Lemli-Opitz syndrome
    explanation: The human developmental phenotype in the three index patients.
  - reference: PMID:9375918
    reference_title: >-
      Limb, genital, CNS, and facial malformations result from gene/environment-induced
      cholesterol deficiency: further evidence for a link to sonic hedgehog.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although not previously directly linked to cholesterol deficiency in
      experimental animals, limb and external genital defects were a notable outcome
      in this multifactorially-based cholesterol deficiency model.
    explanation: >-
      Experimental cholesterol deficiency reproduces the limb and genital arm of
      the malformation pattern shared by SQSD and Smith-Lemli-Opitz syndrome.
    directness: INDIRECT
  downstream:
  - target: Structural Brain Malformations
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Facial Dysmorphism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: 2-3 Toe Syndactyly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Genital Malformations in Males
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Optic Nerve Hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hypospadias
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cryptorchidism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Congenital Heart Defects
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

mechanistic_hypotheses:
- hypothesis_group_id: sqsd_cholesterol_deficit
  hypothesis_label: Developmental cholesterol deficit causes the malformation pattern
  status: CANONICAL
  description: >-
    The SLOS-like malformations follow from insufficient endogenous cholesterol
    during embryogenesis. Supported by the embryonic lethality and neural tube
    defects of the Fdft1 null mouse, which maternal cholesterol does not rescue,
    and by the shared phenotype across the Mendelian sterol synthesis defects.
- hypothesis_group_id: sqsd_hedgehog_by_analogy
  hypothesis_label: Impaired cholesterol-dependent hedgehog signaling mediates the malformations
  status: EMERGING
  description: >-
    Cholesterol deficiency is proposed to act through reduced sonic hedgehog
    signaling, as in experimental cholesterol-deficiency models of
    Smith-Lemli-Opitz syndrome. No study has tested hedgehog signaling in
    FDFT1-deficient cells or tissue, so for SQSD this remains an inference by
    analogy.


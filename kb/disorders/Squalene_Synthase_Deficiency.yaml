  evidence:
  - reference: PMID:32027475
    reference_title: Squalene Synthase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Squalene synthase deficiency (SQSD) is a rare inborn error of cholesterol
      biosynthesis with multisystem clinical manifestations similar to
      Smith-Lemli-Optiz syndrome.
    explanation: GeneReviews names the clinical resemblance to Smith-Lemli-Opitz syndrome.
  - reference: PMID:20104611
    reference_title: >-
      Cyclopia (synophthalmia) in Smith-Lemli-Opitz syndrome: First reported case
      and consideration of mechanism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

- name: Oligodendrocyte-specific Fdft1 knockout mouse
  species: Mouse
  genotype: Oligodendrocyte-specific Fdft1 deletion
  publication: PMID:15793579
  description: >-
    Mice unable to synthesize cholesterol in myelin-forming oligodendrocytes.
    The abstract does not name the targeted gene; the record's MeSH indexing
    lists Farnesyl-Diphosphate Farnesyltransferase deficiency.
  evidence:
  - reference: PMID:15793579
    reference_title: High cholesterol level is essential for myelin membrane growth.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutant oligodendrocytes survived, but CNS myelination was severely perturbed,
      and mutant mice showed ataxia and tremor.
    explanation: >-
      Shows that cell-autonomous cholesterol synthesis is required for normal CNS
      myelination.


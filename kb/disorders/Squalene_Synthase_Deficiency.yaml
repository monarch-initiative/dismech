        with characteristic urine metabolites on urine organic acids analysis
      explanation: The urine profile alone is sufficient to establish the diagnosis.

genetic:
- name: FDFT1
  gene_term:
    preferred_term: FDFT1
    term:
      id: hgnc:3629
      label: FDFT1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic germline variants cause SQSD. Somatic biallelic inactivation and
    promoter hypermethylation of FDFT1 in skin cause forms of porokeratosis, a
    separate disease curated in Porokeratosis; that association is not part of
    this entry. FDFT1 lies in the 8p23.1 interval affected by a recurrent
    NAHR-mediated deletion; a population-genetic model (PMID:36180924) predicts
    this deletion to be a common SQSD allele, so chromosomal microarray or genome
    sequencing can find an allele that exome sequencing misses. No ClinGen gene-disease validity assertion for FDFT1 was found in
    the committed ClinGen export (`grep -i FDFT1 cache/clingen/gene_validity.csv`
    returns nothing).
  evidence:
  - reference: PMID:29909962
    reference_title: >-
      Squalene Synthase Deficiency: Clinical, Biochemical, and Molecular
      Characterization of a Defect in Cholesterol Biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing was used to identify recessive disease-causing
      variants in FDFT1.
    explanation: Identifies FDFT1 as the disease gene.
  - reference: PMID:32027475
    reference_title: Squalene Synthase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: identification of biallelic pathogenic variants in FDFT1 by molecular genetic testing
    explanation: GeneReviews diagnostic criterion naming biallelic FDFT1 variants.
  - reference: PMID:36180924
    reference_title: >-
      Sequencing individual genomes with recurrent genomic disorder deletions: an
      approach to characterize genes for autosomal recessive rare disease traits.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "FDFT1 | Squalene synthase deficiency, MIM# 618156 | 8p23.1 | 9.495x10-6 | 5.1 | 55, 53, 53 | 38 | 2.52x10-5"
    explanation: >-
      A population-genetic model places FDFT1 inside the recurrent 8p23.1
      NAHR deletion and predicts that this deletion is the leading contributor to
      SQSD burden, carried by about 55 percent of affected individuals (Table 2,
      column "Top 3 allele contribution to disease"). This is a modeled estimate
      from population allele frequencies, not an observed patient series, but it
      argues for copy-number analysis alongside sequencing.


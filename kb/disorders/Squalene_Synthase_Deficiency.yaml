- name: Smith-Lemli-Opitz syndrome
  description: >-
    The most common cholesterol biosynthesis defect and the main clinical mimic,
    sharing the dysmorphic facies, brain involvement, developmental delay and 2-3
    toe syndactyly.
  distinguishing_features:
  - Farnesol-derived dicarboxylic acids and glucuronides on urine organic acid analysis favor SQSD.
  - Elevated 7-dehydrocholesterol favors Smith-Lemli-Opitz syndrome.
  - Biallelic FDFT1 variants confirm SQSD; DHCR7 variants confirm Smith-Lemli-Opitz syndrome.
  disease_term:
    preferred_term: Smith-Lemli-Opitz syndrome
    term:

        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In a cell spreading assay, subject-derived fibroblasts showed significant enrichment in cells occupied by filopodia."
        explanation: Readout measured in patient fibroblasts.
        quote_role: PRIMARY_RESULT
    - name: Filopodia after FRAX486 treatment
      target: Actin Cytoskeleton Dysregulation
      direction: RESTORED
      interpretation: PAK1 kinase inhibition normalizes the filopodia phenotype.
      evidence:
      - reference: PMID:30290153
        reference_title: "Activating Mutations in PAK1, Encoding p21-Activated Kinase 1, Cause a Neurodevelopmental Disorder."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Interestingly, application of the PAK1 inhibitor FRAX486 completely reversed this cellular phenotype."
        explanation: Pharmacological rescue in patient fibroblasts.
        quote_role: PRIMARY_RESULT

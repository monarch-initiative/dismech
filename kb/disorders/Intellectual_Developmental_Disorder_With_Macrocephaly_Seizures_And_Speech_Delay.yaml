      reference_title: "Activating Mutations in PAK1, Encoding p21-Activated Kinase 1, Cause a Neurodevelopmental Disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In a cell spreading assay, subject-derived fibroblasts showed significant enrichment in cells occupied by filopodia."

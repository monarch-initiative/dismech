    snippet: "PAK1's kinase activity is autoinhibited by homodimerization, whereas CDC42 or RAC1 binding causes PAK1 activation by dimer dissociation."
    explanation: States the normal autoinhibitory mechanism the variants disturb.
    quote_role: BACKGROUND
  - reference: PMID:11804587
    reference_title: "Pak1 kinase homodimers are autoinhibited in trans and dissociated upon activation by Cdc42 and Rac1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The dimerized Pak1 adopts a trans-inhibited conformation: the N-terminal inhibitory portion of one Pak1 molecule in the dimer binds and inhibits the catalytic domain of the other."

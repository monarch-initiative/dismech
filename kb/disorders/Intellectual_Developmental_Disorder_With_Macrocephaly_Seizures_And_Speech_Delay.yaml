  publication: PMID:30290153
  description: >-
    Patient fibroblasts were used to measure downstream PAK1 target
    phosphorylation, PAK1 kinase activity and filopodia formation during cell
    spreading, with and without the PAK1 inhibitor FRAX486.
  modeled_mechanisms:
  - target: Enhanced PAK1 Downstream Kinase Signaling
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reports increased phosphorylation of JNK, AKT and c-JUN.
    limitations: >-
      Fibroblasts are not the affected cell type; signalling in neural
      progenitors or neurons carrying the variants has not been measured.
    readouts:
    - name: Phosphorylation of JNK, AKT and c-JUN
      target: Enhanced PAK1 Downstream Kinase Signaling
      direction: INCREASED
      interpretation: Increased activity of PAK1 targets in patient cells.
      evidence:
      - reference: PMID:30290153
        reference_title: "Activating Mutations in PAK1, Encoding p21-Activated Kinase 1, Cause a Neurodevelopmental Disorder."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We identified enhanced phosphorylation of the PAK1 targets JNK and AKT in fibroblasts of one subject and of c-JUN in those of both subjects compared with control subjects."
        explanation: Readout measured in patient fibroblasts.
        quote_role: PRIMARY_RESULT
  - target: Actin Cytoskeleton Dysregulation
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Patient fibroblasts form excess filopodia during spreading, reversed by
      FRAX486.
    limitations: >-
      The filopodia phenotype is in fibroblasts, not neurons, so it shows that
      the variants alter PAK1-dependent actin remodelling but not how this
      affects neuronal growth or brain size.
    readouts:
    - name: Fraction of spreading cells occupied by filopodia
      target: Actin Cytoskeleton Dysregulation
      direction: INCREASED
      interpretation: Excess actin-based protrusions in patient cells.

    explanation: Structural modelling of Leu470Arg, Ser133Pro, Pro121Ser and Ser110Thr predicts weakened autoinhibition.
  - reference: PMID:37820543
    reference_title: "A PAK1 Mutational Hotspot Within the Regulatory CRIPaK Domain is Associated With Severe Neurodevelopmental Disorders in Children."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Computational studies suggested a defective autoinhibition presumably due to impaired PAK1 autoregulation as a result of the recurrent substitution."
    explanation: Modelling of the recurrent Met143 hotspot predicts defective autoinhibition.

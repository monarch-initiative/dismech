- name: Postnatal Megalencephaly
  biological_scale: TISSUE
  description: >-
    Head circumference is normal at birth and rises above the 99th percentile
    in infancy or childhood. MRI shows that the large head reflects a large
    brain (megalencephaly), with or without ventriculomegaly. Increased white
    matter N-acetyl aspartate in one proband led the authors to suggest
    increased neuronal growth as the cause, which has not been tested.
  locations:

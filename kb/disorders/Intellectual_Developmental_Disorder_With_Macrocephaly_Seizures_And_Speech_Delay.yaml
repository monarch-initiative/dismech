    directness: INDIRECT
  - reference: PMID:31504246
    reference_title: "De novo variants in PAK1 lead to intellectual disability with macrocephaly and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All identified variants are located within or close to the autoinhibitory switch domain that is necessary for trans-inhibition of resting PAK1 dimers."
    explanation: Positional clustering of four further de novo variants at the trans-inhibitory interface.
  - reference: PMID:31504246

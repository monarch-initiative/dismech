name: Intellectual Developmental Disorder With Macrocephaly Seizures And Speech Delay
creation_date: "2026-10-30T12:00:00Z"
category: Mendelian
synonyms:
- IDDMSSD
- PAK1-related neurodevelopmental disorder
description: >-
  Autosomal dominant neurodevelopmental disorder caused by heterozygous, almost
  always de novo, missense variants in PAK1, which encodes p21-activated kinase
  1, a serine/threonine kinase effector of the RHO GTPases RAC1 and CDC42.
  Affected children have global developmental delay, mild to profound
  intellectual disability, absent or severely delayed speech, and postnatal
  (secondary) macrocephaly from megalencephaly, often with ventriculomegaly and
  corpus callosum or white matter anomalies. Seizures are reported in most
  patients, frequently febrile, and are drug-resistant in some, alongside
  hypotonia, ataxic gait and autistic behaviour. The variants cluster in the
  autoinhibitory region and the kinase domain; those tested reduce the
  autoinhibitory homodimerization that normally keeps PAK1 inactive, and are
  regarded as activating, gain-of-function alleles.
disease_term:
  preferred_term: intellectual developmental disorder with macrocephaly, seizures, and speech delay
  term:
    id: MONDO:0032568
    label: intellectual developmental disorder with macrocephaly, seizures, and speech delay
parents:

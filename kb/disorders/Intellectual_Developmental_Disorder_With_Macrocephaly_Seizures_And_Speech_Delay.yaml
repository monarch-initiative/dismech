- name: Actin Cytoskeleton Dysregulation
  biological_scale: CELLULAR
  description: >-
    PAK1 couples RAC1 and CDC42 to actin reorganization. Patient fibroblasts
    spread with an excess of filopodia, and the ATP-competitive PAK1 inhibitor
    FRAX486 fully reversed this, tying the cellular phenotype to PAK1 kinase
    activity. In neurons, PAK1 activation shapes the actin dynamics of neurite
    outgrowth, and a PAK1-LIMK1-cofilin route has been proposed; neither has
    been measured with patient alleles in neurons.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast

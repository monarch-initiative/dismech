    snippet: "Increased total levels of NAA were detected in the MRI of Proband 3 and could possibly be related to the increased growth of neurons as a cause of megalencephaly in PAK1-related disorders."
    explanation: A single proband's spectroscopy finding offered as a possible cellular basis; a hypothesis.
  - reference: PMID:21115725
    reference_title: "p21-Activated kinases 1 and 3 control brain size through coordinating neuronal complexity and synaptic properties."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We showed that double-knockout (DK) mice lacking both PAK1 and PAK3 were born healthy, with normal brain size and structure, but severely impaired in postnatal brain growth, resulting in a dramatic reduction in brain volume."
    explanation: >-
      Loss of PAK1 and PAK3 in mice limits postnatal brain growth, showing that
      group I PAK activity sets postnatal brain size; patients carry activating
      alleles and show the opposite, postnatal overgrowth.

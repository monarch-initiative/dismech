- Neurodevelopmental disorder
inheritance:
- name: Autosomal Dominant
  description: >-
    A single heterozygous PAK1 missense variant is sufficient. Nearly all
    reported variants arose de novo in the proband; one de novo variant was
    present at low allele fraction in blood, consistent with post-zygotic
    mosaicism in that individual.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:31392718
    reference_title: "p21 protein-activated kinase 1 is associated with severe regressive autism, and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report an individual with a novel autosomal dominant disorder characterized by severe regressive autism, intellectual disability, and epilepsy."
    explanation: Describes the PAK1 disorder as autosomal dominant in a proband with a de novo variant.
  - reference: PMID:31504246
    reference_title: "De novo variants in PAK1 lead to intellectual disability with macrocephaly and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using trio exome sequencing, we identified de novo heterozygous missense variants in PAK1 in four unrelated individuals with intellectual disability, macrocephaly and seizures."
    explanation: Heterozygous de novo variants in four unrelated probands, consistent with dominant inheritance.
pathophysiology:
- name: PAK1 Autoinhibitory Homodimerization Loss
  biological_scale: MOLECULAR
  description: >-
    Resting PAK1 is a trans-inhibited homodimer in which the autoinhibitory
    switch domain of each monomer covers the kinase domain of the other; RAC1
    or CDC42 binding dissociates the dimer and activates the kinase. Disease
    variants sit in the N-terminal regulatory region (Thr84 in the GTPase
    binding region; Ser110, Pro121, Tyr131, Asn132, Ser133 and the Met143
    hotspot) or in the kinase domain at its contact surface with the
    inhibitory switch (Tyr429, Leu470). Reduced dimerization was measured for
    Tyr131Cys and Tyr429Cys; for the other variants it is inferred from
    structural modelling.

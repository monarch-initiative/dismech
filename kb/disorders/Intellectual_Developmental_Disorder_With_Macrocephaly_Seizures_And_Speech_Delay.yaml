genetic:
- name: PAK1
  gene_term:
    preferred_term: PAK1
    term:
      id: hgnc:8590
      label: PAK1
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    All reported alleles are heterozygous missense variants, de novo where
    parents were tested (NM_002576 unless stated). Regulatory region:
    c.251C>G p.(Thr84Arg), c.328T>A p.(Ser110Thr), c.361C>T p.(Pro121Ser),
    c.362C>T p.(Pro121Leu) (NM_001128620), c.392A>G p.(Tyr131Cys), c.396C>A
    p.(Asn132Lys), c.397T>C p.(Ser133Pro), and the Met143 hotspot c.427A>G
    p.(Met143Val), c.428T>C p.(Met143Thr) and c.428T>A p.(Met143Lys)
    (NM_001128620). Kinase domain: c.1286A>G p.(Tyr429Cys), c.1409T>G
    p.(Leu470Arg), c.1409T>A p.(Leu470Gln), and p.(Ile312Ser), p.(Asp407Asn),
    p.(Met453Thr), p.(Leu470Pro) and p.(Ile476Thr) from one Chinese series,
    plus c.1427T>C in a further Chinese proband. Leu470Pro was mosaic in blood
    (VAF 13.4%). The Thr84Arg proband also carries a de novo 1q44 deletion, so
    part of her phenotype may have a second cause. No truncating allele has
    been reported, PAK1 is depleted of missense variation in the population,
    and Pak1 knockout mice are viable without gross abnormalities, which
    argues against loss of function as the mechanism.
  evidence:
  - reference: PMID:30290153
    reference_title: "Activating Mutations in PAK1, Encoding p21-Activated Kinase 1, Cause a Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the de novo PAK1 mutations c.392A>G (p.Tyr131Cys) and c.1286A>G (p.Tyr429Cys) in two unrelated subjects with developmental delay, secondary macrocephaly, seizures, and ataxic gait."
    explanation: First two de novo PAK1 probands.
  - reference: PMID:31504246
    reference_title: "De novo variants in PAK1 lead to intellectual disability with macrocephaly and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using trio exome sequencing, we identified de novo heterozygous missense variants in PAK1 in four unrelated individuals with intellectual disability, macrocephaly and seizures."
    explanation: Four further unrelated de novo probands.
  - reference: PMID:31504246
    reference_title: "De novo variants in PAK1 lead to intellectual disability with macrocephaly and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PAK1 shows fewer missense variants than expected by chance with a z-score of 4.16 (Lek et al., 2016), suggesting that heterozygous missense variants are less tolerated."
    explanation: Population constraint on PAK1 missense variation.
  - reference: PMID:31504246
    reference_title: "De novo variants in PAK1 lead to intellectual disability with macrocephaly and seizures."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Another piece of evidence supporting a gain-of-function mechanism for the identified variants in our patients is that PAK1 homozygous knockout (Pak1−/−) mice appear to be viable with no gross abnormalities."
    explanation: Knockout mice lack the disease phenotype, arguing against loss of function.
  - reference: PMID:37820543
    reference_title: "A PAK1 Mutational Hotspot Within the Regulatory CRIPaK Domain is Associated With Severe Neurodevelopmental Disorders in Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified by whole-exome sequencing three novel de novo variants in PAK1 (NM_001128620: c.427A>G, p.Met143Val; c.428T>C, p.Met143Thr; c.428T>A, p.Met143Lys) as the underlying cause of the disease in our families."
    explanation: Recurrent Met143 hotspot in three families.
  - reference: PMID:41124873
    reference_title: "Novel PAK1 variants related to a variable phenotypic spectrum ranging from mild developmental delay to infantile epileptic spasms syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants were missense, and one of which was a mosaic variant (Leu470Pro), with a variant allele fraction of 13.4 % (13/97)."
    explanation: Five further de novo missense variants, one mosaic.
  - reference: PMID:36905087
    reference_title: "PAK1 c.1409 T > a (p. Leu470Gln) de novo variant affects the protein kinase domain, leading to epilepsy, macrocephaly, spastic quadriplegia, and hydrocephalus: Case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined assessment of the eight pathogenic PAK1 missense variants reveal that the variants cluster in either the protein kinase or autoregulatory domains."
    explanation: Domain clustering of the pathogenic missense variants.
  - reference: PMID:36937657
    reference_title: "The molecular basis of p21-activated kinase-associated neurodevelopmental disorders: From genotype to phenotype."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, PAK1 mutations are dominant gain of function, PAK2 mutations generate haploinsufficiency, whereas PAK3 pathogenic variations have various functional consequences."
    explanation: Review classifying PAK1 disease alleles as dominant gain of function.
    quote_role: REVIEW_SYNTHESIS

notes: >-
  No GeneReviews chapter covers PAK1-related disorder. A 2025 series pooled 16
  published patients (PMID:41124873). The mechanism of the seizures has not
  been studied in this disorder, so the seizure branch is not conformed to the
  epilepsy_excitation_inhibition_imbalance module. Pak1 knockout mice have
  fewer cortical pyramidal neurons and a smaller neural progenitor pool
  (PMID:26043730), and Pak1/Pak3 double knockouts have impaired postnatal
  brain growth (PMID:21115725), the opposite direction to the overgrowth seen
  in patients; no animal model carrying a patient allele has been reported. A NanoBRET
  assay confirms that PAK1 inhibitors engage full-length PAK1 Tyr429Cys in
  primary neurons (PMID:42904645).

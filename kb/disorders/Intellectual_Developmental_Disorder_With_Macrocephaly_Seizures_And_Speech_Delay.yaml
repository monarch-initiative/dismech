- name: Constitutive PAK1 Kinase Activation
  biological_scale: MOLECULAR
  description: >-
    Released from dimer-mediated autoinhibition, mutant PAK1 is expected to
    have increased basal kinase activity. In patient fibroblasts only a trend
    toward higher kinase activity was measured, so the activating effect rests
    on that trend, the reduced dimerization and the increased phosphorylation
    of downstream targets.

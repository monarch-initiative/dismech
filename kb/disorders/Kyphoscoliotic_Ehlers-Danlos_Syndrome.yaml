name: Kyphoscoliotic Ehlers-Danlos Syndrome
category: Mendelian
creation_date: "2026-09-15T21:15:24Z"
description: >
  Kyphoscoliotic Ehlers-Danlos syndrome (kEDS) is an autosomal recessive
  connective-tissue disorder characterized by congenital or early-onset
  hypotonia, progressive kyphoscoliosis, generalized joint hypermobility, and
  skin fragility. It is genetically heterogeneous, with two known causal
  genes acting at different steps of collagen biosynthesis: PLOD1 (kEDS-PLOD1,
  formerly EDS type VIA, ~90% of molecularly confirmed cases), encoding lysyl
  hydroxylase 1, which hydroxylates telopeptide lysine residues required for
  mature collagen crosslink formation; and FKBP14 (kEDS-FKBP14, formerly EDS
  type VIB), encoding an ER-resident peptidyl-prolyl isomerase/chaperone
  implicated in procollagen folding, whose deficiency additionally causes
  myopathy and hearing impairment not typical of kEDS-PLOD1. MONDO retired the
  single umbrella term for this disease (MONDO:0034024) in favor of two
  gene-specific child concepts; this entry is anchored on MONDO:0016002
  ("Ehlers-Danlos syndrome, kyphoscoliotic type 1"), which now carries the
  general "kyphoscoliotic Ehlers-Danlos syndrome"/"kEDS"/"EDS VI" synonyms and
  represents the common PLOD1-related form, with the FKBP14-related form
  modeled as a subtype anchored on its own MONDO:0013800 term.
disease_term:
  preferred_term: Kyphoscoliotic Ehlers-Danlos Syndrome
  term:
    id: MONDO:0016002
    label: Ehlers-Danlos syndrome, kyphoscoliotic type 1
synonyms:
- kEDS
- EDS VI
- EDS type VI
- Ehlers-Danlos syndrome, kyphoscoliotic type
- PLOD1-kEDS
- kyphoscoliotic EDS due to lysyl hydroxylase 1 deficiency
notes: >
  The generic MONDO umbrella term for kyphoscoliotic EDS (MONDO:0034024) is
  obsolete, with no single non-obsolete replacement; MONDO instead provides
  two sibling gene-specific children (MONDO:0016002 for PLOD1-related type 1,
  MONDO:0013800 for FKBP14-related type 2), both direct subclasses of
  MONDO:0020066 (Ehlers-Danlos syndrome). This entry anchors on MONDO:0016002
  because it carries the general kEDS/EDS-VI synonyms and PLOD1-kEDS accounts
  for the large majority of reported cases; FKBP14-kEDS is curated as a
  has_subtypes entry with its own MONDO term, following the precedent set by
  Musculocontractural_Ehlers-Danlos_Syndrome.yaml for a genetically
  heterogeneous EDS subtype.

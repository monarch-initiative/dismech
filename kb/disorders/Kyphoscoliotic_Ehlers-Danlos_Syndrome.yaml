    evidence_source: IN_VITRO
    snippet: "We demonstrate that FKBP14 is localized in the endoplasmic reticulum (ER) and that deficiency of FKBP14 leads to enlarged ER cisterns in dermal fibroblasts in vivo. Furthermore, indirect immunofluorescence of FKBP14-deficient fibroblasts indicated an altered assembly of the extracellular matrix in vitro."
    explanation: The original FKBP14 disease-gene report directly demonstrates that FKBP14 loss disrupts ER structure and extracellular matrix assembly in patient fibroblasts.

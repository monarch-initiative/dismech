    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of FKBP14-kEDS is established in a proband by the identification of biallelic pathogenic variants in FKBP14 by molecular genetic testing."
    explanation: GeneReviews establishes biallelic FKBP14 pathogenic variants as diagnostic of FKBP14-kEDS.
  - reference: PMID:36054293

    evidence_source: IN_VITRO
    snippet: "these phenotypic features could be correlated with the functions of FKBP22, which preferentially binds to type III, VI and X collagens, but not to type I, II or V collagens"
    explanation: Documents the collagen-type substrate preference of FKBP22 (FKBP14) that underlies which collagens are affected by its loss of function.
  downstream:
  - target: Impaired Procollagen Folding and Secretion

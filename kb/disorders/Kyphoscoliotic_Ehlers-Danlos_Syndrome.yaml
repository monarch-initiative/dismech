histopathology:
- name: Abnormal Dermal Collagen Fibril Ultrastructure
  description: >
    Transmission electron microscopy of skin biopsies shows collagen fibrils
    of variable, abnormally increased diameter with loss of the normal
    circular cross-sectional contour and irregular interfibrillar spacing,
    a finding reported as distinct from other EDS subtypes; elastic fibers
    are structurally normal.
  evidence:
  - reference: PMID:21699693
    reference_title: "Phenotypic variability of the kyphoscoliotic type of Ehlers-Danlos syndrome (EDS VIA): clinical, molecular and biochemical delineation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diameters of the collagen fibrils were significantly increased with loss of the normal circular shape. In particular those fibrils with abnormally increased diameters showed a greater deviation from circular shape (Figure 1). The elastic fibers presented normal ultrastructural features."
    explanation: Direct electron-microscopic description of the dermal collagen fibril abnormality in kEDS-PLOD1 skin biopsies.
animal_models:
- name: Warmblood Fragile Foal Syndrome (WFFS) horse
  species: Horse
  genotype: PLOD1 c.2032G>A (homozygous)
  publication: PMID:31502696
  modeled_mechanisms:
  - target: PLOD1 Loss-of-Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >
      A naturally occurring recessive PLOD1 missense variant in Warmblood
      horses causes Warmblood fragile foal syndrome type 1 (WFFS), a fatal
      connective-tissue fragility disorder and the equine counterpart of
      human kEDS-PLOD1.
    limitations: >
      Homozygous WFFS foals typically show severe perinatal/neonatal
      connective-tissue rupture and do not survive, a substantially more
      severe and earlier-lethal course than human kEDS-PLOD1, which is
      generally compatible with survival to adulthood; the cited study is a
      Thoroughbred allele-frequency and racing-injury screening report
      rather than a primary phenotypic characterization of WFFS.
    evidence:
    - reference: PMID:31502696
      reference_title: "Warmblood fragile foal syndrome type 1 mutation (PLOD1 c.2032G>A) is not associated with catastrophic breakdown and has a low allele frequency in the Thoroughbred breed."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: MODEL_ORGANISM
      snippet: "A variant in the procollagen-lysine, 2-oxoglutarate 5-dioxygenase1 gene (PLOD1 c.2032G>A) was shown to cause Warmblood fragile foal syndrome type 1 (WFFS), a fatal recessive defect of the connective tissue."
      explanation: Background sentence in this Thoroughbred-screening paper establishing that the cited PLOD1 variant causes a fatal recessive equine connective-tissue disorder, the naturally-occurring animal counterpart of kEDS-PLOD1.
  notes: >
    This naturally-occurring equine variant is the only PLOD1- or
    FKBP14-specific animal model identified in the cached literature; no
    engineered PLOD1 or FKBP14 knockout/knock-in mouse model with published
    phenotyping data was found. PMID:34712265, a narrative review of animal
    models across all EDS subtypes, confirms that engineered mouse and
    zebrafish models exist for many EDS-associated genes, but its abstract
    does not itself supply reproducible genotype/phenotype data for a
    PLOD1- or FKBP14-specific model suitable for a modeled_mechanisms entry
    here. A separately-cached PMID:34850861 (a CRISPR/Cas9 mouse model) is
    for musculocontractural EDS caused by CHST14/dermatan-sulfate-pathway
    variants -- a different EDS subtype and an unrelated gene/pathway -- and
    is deliberately not cited here to avoid Named Entity Confusion.
diagnosis:
- name: Molecular Genetic Testing of PLOD1 or FKBP14
  description: >
    The definitive diagnostic test for kEDS. PLOD1-kEDS is established in a
    proband with characteristic clinical features and biallelic pathogenic
    variants in PLOD1; FKBP14-kEDS is established by biallelic pathogenic
    variants in FKBP14. Sequence analysis alone misses structural variants
    (notably the recurrent PLOD1 exon 10-16 duplication), so
    deletion/duplication analysis is needed when only one or no pathogenic
    variant is found by sequencing.
  evidence:
  - reference: PMID:20301635
    reference_title: "PLOD1-Related Kyphoscoliotic Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of PLOD1-kEDS is established in a proband with characteristic clinical features and biallelic pathogenic variants in PLOD1 identified by molecular genetic testing."
    explanation: GeneReviews states the molecular diagnostic criterion for PLOD1-kEDS.
  - reference: PMID:31132235
    reference_title: "FKBP14 Kyphoscoliotic Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of FKBP14-kEDS is established in a proband by the identification of biallelic pathogenic variants in FKBP14 by molecular genetic testing."
    explanation: GeneReviews states the molecular diagnostic criterion for FKBP14-kEDS.
  - reference: PMID:37433679
    reference_title: "FKBP14 kyphoscoliotic Ehlers-Danlos syndrome misdiagnosed as Larsen syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular diagnosis is particularly crucial for all individuals who have a history of significant vascular events in the setting of a clinical diagnosis only."
    explanation: Case report of a patient clinically misdiagnosed with Larsen syndrome for over 40 years, later found by molecular testing to have FKBP14-kEDS, illustrating why molecular confirmation rather than clinical impression alone is required.
- name: Clinical Suggestive Criteria (2017 International EDS Classification)
  description: >
    kEDS is one of the 13 EDS subtypes for which the 2017 International EDS
    Classification defines a set of clinical criteria suggestive of the
    diagnosis. As with nearly all non-hypermobile EDS subtypes, these
    clinical criteria are suggestive only: definitive diagnosis of both
    kEDS-PLOD1 and kEDS-FKBP14 requires molecular confirmation of biallelic
    pathogenic variants. For FKBP14-kEDS specifically, the clinical criteria
    require congenital muscular hypotonia together with congenital or
    early-onset kyphoscoliosis, plus generalized joint hypermobility or
    further gene-specific/supportive features; a subsequent 23-patient
    cohort refined these into explicit major criteria (severe generalized
    hypotonia at birth with improvement in infancy and delayed motor
    milestones; early-onset progressive kyphoscoliosis; joint hypermobility
    without pronounced contractures; foot deformities; and a normal or
    decreased urinary lysyl:hydroxylysyl pyridinoline ratio) and minor
    criteria (hyperelastic skin with follicular hyperkeratosis and easy
    bruising; myopathy; and hearing impairment).
  evidence:
  - reference: DOI:10.1002/ajmg.c.31552
    reference_title: "The 2017 international classification of the Ehlers–Danlos syndromes"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For each of the subtypes, we propose a set of clinical criteria that are suggestive for the diagnosis. However, in view of the vast genetic heterogeneity and phenotypic variability of the EDS subtypes, and the clinical overlap between EDS subtypes, but also with other HCTDs, the definite diagnosis of all EDS subtypes, except for the hypermobile type, relies on molecular confirmation with identification of (a) causative genetic variant(s)."
    explanation: The international consensus nosology establishes that kEDS has suggestive clinical criteria but, like all non-hypermobile EDS subtypes, requires molecular confirmation for definitive diagnosis.
  - reference: PMID:31132235
    reference_title: "FKBP14 Kyphoscoliotic Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical diagnostic criteria rely on the finding of congenital muscular hypotonia AND congenital or early-onset kyphoscoliosis in addition to generalized joint hypermobility or further gene-specific and/or supportive clinical features."
    explanation: GeneReviews states the specific clinical suggestive criteria for FKBP14-kEDS.
  - reference: PMID:28617417
    reference_title: "A cohort of 17 patients with kyphoscoliotic Ehlers-Danlos syndrome caused by biallelic mutations in FKBP14: expansion of the clinical and mutational spectrum and description of the natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the major diagnostic criteria are (i) severe generalized hypotonia at birth with marked muscle weakness that improves in infancy, and delayed gross motor milestones; (ii) early-onset progressive (kypho)scoliosis; (iii) joint hypermobility without pronounced contractures; (iv) foot deformities; and (v) normal or decreased ratio of lysyl pyridinoline to hydroxylysyl pyridinoline in urine. Minor criteria include (i) hyperelastic skin with follicular hyperkeratosis, easy bruising, and occasional abnormal scarring; (ii) myopathy as seen clinically by reduced strength and endurance and confirmed in some patients by histology and muscle imaging; and (iii) hearing impairment that is predominantly sensorineural and may not be present in all individuals."
    explanation: This 23-patient cohort study defines the explicit major and minor clinical diagnostic criteria for FKBP14-kEDS, stated to have informed the redraft of the 2017 International Nosology of EDS.
- name: Urinary Pyridinoline Crosslink Ratio Testing
  description: >
    A fast, non-invasive, cost-effective biochemical screening test for
    PLOD1-kEDS specifically: if only one pathogenic PLOD1 variant or variants
    of uncertain significance are found, a markedly increased urinary
    lysyl-pyridinoline to hydroxylysyl-pyridinoline (LP:HP) crosslink ratio
    supports the diagnosis.
  evidence:
  - reference: PMID:20301635
    reference_title: "PLOD1-Related Kyphoscoliotic Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "testing for a markedly increased ratio of deoxypyridinoline to pyridinoline cross-links in urine measured by high-performance liquid chromatography (a highly sensitive, specific, and inexpensive test) may be necessary for confirmation of the diagnosis"
    explanation: GeneReviews describes the urinary pyridinoline crosslink ratio as a confirmatory diagnostic test for PLOD1-kEDS.
genetic:
- name: PLOD1
  gene_term:
    preferred_term: PLOD1
    term:
      id: hgnc:9081
      label: PLOD1
  relationship_type: CAUSATIVE
  subtype: kEDS-PLOD1
  notes: >
    Encodes procollagen-lysine,2-oxoglutarate 5-dioxygenase 1 (lysyl
    hydroxylase 1, LH1), the enzyme responsible for telopeptide lysine
    hydroxylation in fibrillar procollagens. Pathogenic variants include
    missense, nonsense, splice-site, and small indel changes, plus a
    recurrent Alu-mediated 8.9-kb intragenic duplication of exons 10-16 that
    is the single most common cause of the disorder.
  evidence:
  - reference: PMID:20301635
    reference_title: "PLOD1-Related Kyphoscoliotic Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of PLOD1-kEDS is established in a proband with characteristic clinical features and biallelic pathogenic variants in PLOD1 identified by molecular genetic testing."
    explanation: GeneReviews establishes biallelic PLOD1 pathogenic variants as diagnostic of PLOD1-kEDS.
  - reference: PMID:21699693
    reference_title: "Phenotypic variability of the kyphoscoliotic type of Ehlers-Danlos syndrome (EDS VIA): clinical, molecular and biochemical delineation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "among them an 8.9-kb duplication of seven exons (exon 10-16) is the most common cause of the disorder"
    explanation: Identifies the recurrent 8.9-kb exon 10-16 duplication as the most common PLOD1 pathogenic variant.
- name: FKBP14
  gene_term:
    preferred_term: FKBP14
    term:
      id: hgnc:18625
      label: FKBP14
  relationship_type: CAUSATIVE
  subtype: kEDS-FKBP14
  notes: >
    Encodes FKBP14 (FKBP22), an ER-resident FK506-binding-protein-family
    peptidyl-prolyl isomerase implicated in procollagen chaperoning.
    c.362dupC p.(Glu122Argfs*7) is the most frequently reported recurrent
    FKBP14 pathogenic variant across published cohorts, identified in
    multiple unrelated families in both the 2018 cohort study and
    subsequent case reports; the cached literature did not supply a
    verifiable cohort-wide percentage for how large a share of pathogenic
    alleles it represents, so no specific figure is stated here.

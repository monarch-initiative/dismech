  - preferred_term: peptidyl-prolyl cis-trans isomerase activity
    modifier: DECREASED
    term:
      id: GO:0003755
      label: peptidyl-prolyl cis-trans isomerase activity
  evidence:
  - reference: PMID:24821723
    reference_title: "A substrate preference for the rough endoplasmic reticulum resident protein FKBP22 during collagen biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The absence of FKBP22 leads to a kyphoscoliotic type of Ehlers-Danlos syndrome (EDS), and this type of EDS is classified as EDS type VI, which can also be caused by a deficiency in lysyl-hydroxylase 1."
    explanation: Establishes FKBP22 (FKBP14) loss as a cause of kEDS, alongside PLOD1 deficiency.
  downstream:
  - target: Impaired Procollagen Folding and Secretion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24821723
      reference_title: "A substrate preference for the rough endoplasmic reticulum resident protein FKBP22 during collagen biosynthesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "FKBP22 catalyzes the folding of type III collagen and interacts with type III collagen, type VI collagen, and type X collagen, but not with type I collagen, type II collagen, or type V collagen"
      explanation: Directly shows FKBP22/FKBP14 catalyzes procollagen folding, so its loss impairs that folding step.
- name: Impaired Procollagen Folding and Secretion
  biological_scale: CELLULAR
  subtypes:
  - kEDS-FKBP14
  description: >
    Loss of FKBP14 chaperone/isomerase activity impairs correct folding and
    ER-to-Golgi trafficking of procollagen molecules, with a substrate
    preference for type III, type VI, and type X collagen rather than the
    type I/II/V collagens handled by lysyl hydroxylase 1 -- a difference
    proposed to explain why kEDS-FKBP14 has a broader phenotype (myopathy,
    hearing loss) than kEDS-PLOD1.
  biological_processes:
  - preferred_term: protein folding in endoplasmic reticulum
    modifier: DECREASED
    term:
      id: GO:0034975
      label: protein folding in endoplasmic reticulum
  evidence:
  - reference: PMID:36054293
    reference_title: "Kyphoscoliotic Ehlers-Danlos syndrome caused by pathogenic variants in FKBP14: Further insights into the phenotypic spectrum and pathogenic mechanisms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "With immunocytochemistry on dermal fibroblasts, we provide the first evidence for intracellular retention of types III and VI collagen in EDS-FKBP14."
    explanation: Direct cellular evidence that FKBP14 loss causes intracellular retention (impaired secretion) of procollagen.
  - reference: PMID:24821723
    reference_title: "A substrate preference for the rough endoplasmic reticulum resident protein FKBP22 during collagen biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These restrictive interactions might help explain the broader phenotype observed in patients that lack FKBP22."
    explanation: Proposes that FKBP22's restricted collagen-type substrate preference underlies the broader kEDS-FKBP14 phenotype relative to kEDS-PLOD1.
  downstream:
  - target: Defective Collagen Crosslink Maturation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36054293
      reference_title: "Kyphoscoliotic Ehlers-Danlos syndrome caused by pathogenic variants in FKBP14: Further insights into the phenotypic spectrum and pathogenic mechanisms."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "With immunocytochemistry on dermal fibroblasts, we provide the first evidence for intracellular retention of types III and VI collagen in EDS-FKBP14."
      explanation: Impaired procollagen folding leads to intracellular retention rather than proper secretion and downstream crosslink maturation.
- name: Defective Collagen Crosslink Maturation
  biological_scale: MOLECULAR
  description: >
    Whether from deficient telopeptide hydroxylation (kEDS-PLOD1) or impaired
    procollagen folding (kEDS-FKBP14), fibrillar collagen molecules fail to
    form mature, stable crosslinks, converging on the same downstream defect
    in collagen fibril assembly shared by both molecular subtypes.
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: DECREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  downstream:
  - target: Disorganized Dermal and Vascular Collagen Fibrils
    causal_link_type: DIRECT
- name: Disorganized Dermal and Vascular Collagen Fibrils
  biological_scale: TISSUE
  description: >
    Poorly crosslinked collagen fibrils are structurally weaker and abnormally
    organized in skin, joint capsule/ligament, vascular wall, and scleral
    connective tissue, reducing their tensile strength.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Skin Fragility and Poor Wound Healing
    causal_link_type: DIRECT
  - target: Joint Hypermobility and Instability
    causal_link_type: DIRECT
  - target: Arterial Wall Fragility
    causal_link_type: DIRECT
  - target: Ocular Globe Fragility
    causal_link_type: DIRECT
- name: Skin Fragility and Poor Wound Healing
  biological_scale: TISSUE
  description: >
    Weakened dermal collagen produces hyperextensible, easily bruised,
    friable skin with atrophic scarring and impaired wound healing.
  downstream:
  - target: Hyperextensible Skin
  - target: Fragile Skin
- name: Joint Hypermobility and Instability
  biological_scale: TISSUE
  description: >
    Reduced tensile strength of periarticular connective tissue (joint
    capsule, ligament) produces generalized joint laxity and dislocations.
  downstream:
  - target: Generalized Joint Hypermobility
  - target: Recurrent Joint Dislocations
- name: Arterial Wall Fragility
  biological_scale: TISSUE
  description: >
    Defective collagen crosslinking weakens the arterial wall, predisposing
    to spontaneous rupture and dissection of medium-sized arteries.
  cell_types:
  - preferred_term: fibroblast of the aortic adventitia
    term:
      id: CL:0002547
      label: fibroblast of the aortic adventitia
  downstream:
  - target: Arterial Rupture and Dissection
- name: Ocular Globe Fragility
  biological_scale: TISSUE
  description: >
    Scleral and corneal connective tissue weakness produces blue sclerae,
    refractive error, and risk of globe rupture or retinal detachment.
  downstream:
  - target: Ocular Abnormality

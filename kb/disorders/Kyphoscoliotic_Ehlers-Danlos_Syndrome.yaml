    modifier: DECREASED
    term:
      id: GO:0008475
      label: procollagen-lysine 5-dioxygenase activity
  evidence:
  - reference: PMID:21699693
    reference_title: "Phenotypic variability of the kyphoscoliotic type of Ehlers-Danlos syndrome (EDS VIA): clinical, molecular and biochemical delineation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is caused by a deficiency of the collagen-modifying enzyme procollagen-lysine, 2-oxoglutarate 5-dioxygenase 1 (LH1; EC 1.14.11.4; MIM 153454; PLOD1 or lysyl hydroxylase 1)"
    explanation: Establishes PLOD1/LH1 enzymatic identity and its loss as the cause of kEDS-PLOD1.
  downstream:
  - target: Deficient Telopeptide Lysyl Hydroxylation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21699693
      reference_title: "Phenotypic variability of the kyphoscoliotic type of Ehlers-Danlos syndrome (EDS VIA): clinical, molecular and biochemical delineation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This enzyme plays an important role as a post-translational modifying enzyme in collagen biosynthesis through both hydroxylation of lysyl residues in -Xaa-Lys-Gly- collagen sequences to hydroxylysyl residues"
      explanation: Directly links loss of LH1 enzymatic activity to failure of collagen lysyl hydroxylation.
- name: Deficient Telopeptide Lysyl Hydroxylation
  biological_scale: MOLECULAR
  subtypes:
  - kEDS-PLOD1
  description: >
    Loss of LH1 activity prevents hydroxylation of lysine residues in the
    telopeptide regions of fibrillar procollagens, so the resulting
    crosslinks are lysine-derived rather than hydroxylysine-derived.
  biological_processes:
  - preferred_term: peptidyl-lysine hydroxylation
    modifier: DECREASED
    term:
      id: GO:0017185
      label: peptidyl-lysine hydroxylation
  evidence:
  - reference: PMID:21699693
    reference_title: "Phenotypic variability of the kyphoscoliotic type of Ehlers-Danlos syndrome (EDS VIA): clinical, molecular and biochemical delineation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lysyl hydroxylase deficiency results in underhydroxylation of lysyl residues and underglycosylation of hydroxylysyl residues in collagens and, hence, impaired cross-link formation with consequent mechanical instability of the affected tissues"
    explanation: Establishes that LH1 deficiency causes underhydroxylation of collagen lysyl residues.
  downstream:
  - target: Defective Collagen Crosslink Maturation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21699693
      reference_title: "Phenotypic variability of the kyphoscoliotic type of Ehlers-Danlos syndrome (EDS VIA): clinical, molecular and biochemical delineation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "lysyl hydroxylase deficiency results in underhydroxylation of lysyl residues and underglycosylation of hydroxylysyl residues in collagens and, hence, impaired cross-link formation with consequent mechanical instability of the affected tissues"
      explanation: Directly links underhydroxylation to impaired collagen crosslink formation.
- name: FKBP14 Loss-of-Function
  biological_scale: MOLECULAR
  subtypes:
  - kEDS-FKBP14
  description: >
    Biallelic loss-of-function variants in FKBP14 disrupt its
    peptidyl-prolyl isomerase/chaperone activity in the endoplasmic
    reticulum.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: FKBP14
    term:
      id: hgnc:18625
      label: FKBP14

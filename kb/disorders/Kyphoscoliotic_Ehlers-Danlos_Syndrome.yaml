      id: hgnc:9081
      label: PLOD1
  description: >
    Caused by biallelic loss-of-function variants in PLOD1, encoding lysyl
    hydroxylase 1 (LH1). This is the common form of kEDS, characterized by
    hypotonia, generalized joint hypermobility, early-onset kyphoscoliosis,
    skin fragility, and ocular abnormality, with a distinctive risk of
    arterial rupture and dissection.
  evidence:
  - reference: PMID:20301635
    reference_title: "PLOD1-Related Kyphoscoliotic Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PLOD1-related kyphoscoliotic Ehlers-Danlos syndrome (PLOD1-kEDS) is characterized by hypotonia, generalized joint hypermobility, early-onset kyphoscoliosis, skin fragility, and ocular abnormality."
    explanation: GeneReviews summary establishes the core PLOD1-kEDS phenotype.
- name: kEDS-FKBP14
  display_name: kEDS-FKBP14 (kyphoscoliotic type 2, EDS VIB)
  subtype_term:
    preferred_term: FKBP14-related kyphoscoliotic Ehlers-Danlos syndrome
    term:
      id: MONDO:0013800
      label: Ehlers-Danlos syndrome, kyphoscoliotic type, 2
  genes:
  - preferred_term: FKBP14
    term:
      id: hgnc:18625
      label: FKBP14
  description: >
    Caused by biallelic loss-of-function variants in FKBP14, encoding an
    ER-resident FK506-binding-protein-family peptidyl-prolyl isomerase.
    Distinguished from kEDS-PLOD1 by additional myopathy and sensorineural
    hearing impairment, with congenital hypotonia that typically improves
    during childhood.
  evidence:
  - reference: PMID:31132235
    reference_title: "FKBP14 Kyphoscoliotic Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FKBP14 kyphoscoliotic Ehlers-Danlos syndrome (FKBP14-kEDS) is characterized by congenital muscle hypotonia and weakness (typically improving during childhood), progressive scoliosis, joint hypermobility, hyperelastic skin, gross motor developmental delay, myopathy, and hearing impairment."
    explanation: GeneReviews summary establishes the core FKBP14-kEDS phenotype, distinguishing it from PLOD1-kEDS by myopathy and hearing impairment.

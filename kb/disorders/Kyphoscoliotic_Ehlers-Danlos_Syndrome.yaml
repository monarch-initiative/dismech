- name: Defective Collagen Crosslink Maturation
  biological_scale: MOLECULAR
  description: >
    Whether from deficient telopeptide hydroxylation (kEDS-PLOD1) or impaired
    procollagen folding (kEDS-FKBP14), fibrillar collagen molecules fail to
    form mature, stable crosslinks, converging on the same downstream defect
    in collagen fibril assembly shared by both molecular subtypes.
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: DECREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  evidence:
  - reference: PMID:21699693
    reference_title: "Phenotypic variability of the kyphoscoliotic type of Ehlers-Danlos syndrome (EDS VIA): clinical, molecular and biochemical delineation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lysyl hydroxylase deficiency results in underhydroxylation of lysyl residues and underglycosylation of hydroxylysyl residues in collagens and, hence, impaired cross-link formation with consequent mechanical instability of the affected tissues"
    explanation: Establishes that the collagen crosslink defect is the point of convergence producing mechanically unstable connective tissue.
  downstream:
  - target: Disorganized Dermal and Vascular Collagen Fibrils
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21699693
      reference_title: "Phenotypic variability of the kyphoscoliotic type of Ehlers-Danlos syndrome (EDS VIA): clinical, molecular and biochemical delineation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Abnormal electron microscopy findings (Figure 1) included variable diameters of the collagen fibrils, irregular interfibrillar space in addition to irregular ragged outlines in cross sections."
      explanation: Direct ultrastructural evidence that impaired crosslink maturation produces disorganized, abnormally shaped collagen fibrils in skin biopsies.

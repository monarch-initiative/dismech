biochemical:
- name: Urinary lysyl-pyridinoline to hydroxylysyl-pyridinoline ratio
  subtype: kEDS-PLOD1
  presence: INCREASED
  context: >
    Deficient lysyl hydroxylase 1 activity in kEDS-PLOD1 skews collagen
    crosslinking toward lysine-derived (lysyl-pyridinoline) rather than
    hydroxylysine-derived (hydroxylysyl-pyridinoline) crosslinks, raising the
    urinary total LP:HP ratio; this is a fast, non-invasive, and diagnostic
    biochemical test for kEDS-PLOD1.
  biomarker_term:
    preferred_term: urinary lysyl-pyridinoline to hydroxylysyl-pyridinoline ratio
    term:
      id: CHEBI:64753
      label: lysyl-pyridinoline cross-link
  readouts:
  - target: Defective Collagen Crosslink Maturation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      An elevated urinary LP:HP ratio reports the shift away from mature
      hydroxylysine-derived collagen crosslinks caused by LH1 deficiency.
  evidence:
  - reference: PMID:21699693
    reference_title: "Phenotypic variability of the kyphoscoliotic type of Ehlers-Danlos syndrome (EDS VIA): clinical, molecular and biochemical delineation."
    supports: SUPPORT

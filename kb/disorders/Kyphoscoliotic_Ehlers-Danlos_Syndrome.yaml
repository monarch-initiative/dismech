    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the previously reported c.362dupC; p.(Glu122Argfs*7) variant, a novel missense variant (c.587A>G; p.(Asp196Gly)) and a start codon variant (c.2T>G; p.?)"
    explanation: Documents reported FKBP14 pathogenic variant types, including the recurrent c.362dupC frameshift founder allele.
  - reference: PMID:41366145
    reference_title: "Surgical management of progressive spinal deformities in FKBP14-associated Ehlers-Danlos syndrome: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A female patient with genetically confirmed FKBP14-associated EDS (homozygous c.362dupG p.E122RfsX7 mutation) was followed from infancy through age 10 at a tertiary pediatric center."
    explanation: An independent case report documenting the identical p.(Glu122Argfs*7)/p.E122RfsX7 frameshift protein consequence in an unrelated patient (the cDNA change is given here as c.362dupG rather than c.362dupC; whether this is the same recurrent variant under a notation discrepancy or a distinct change producing the same frameshift could not be confirmed from the cached text).

    evidence:
    - reference: PMID:14556245
      reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Altered expression of Alpha 4, through either a change in translational efficiency, mRNA stability or splicing, could explain the clinical phenotype in these boys and the phenotypic overlap with Opitz GBBB syndrome"
      explanation: The authors propose the Alpha 4/PP2A perturbation explains the callosal and other malformations.
  - target: Impaired Craniofacial and Optic Fissure Morphogenesis
    description: >
      Dysregulated PP2A signaling is proposed to disrupt craniofacial and optic
      fissure development, producing coloboma, micrognathia/retrognathia, and ear
      anomalies, paralleling the midline defects of Opitz GBBB syndrome.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - igbp1_pp2a_dosage_developmental_mechanism
    evidence:
    - reference: PMID:14556245
      reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "could explain the clinical phenotype in these boys and the phenotypic overlap with Opitz GBBB syndrome"
      explanation: The proposed mechanism extends to the craniofacial/ocular malformations shared with Opitz GBBB syndrome.

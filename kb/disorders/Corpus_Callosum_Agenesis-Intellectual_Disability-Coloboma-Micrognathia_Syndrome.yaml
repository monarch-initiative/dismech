    snippet: "Alpha 4 is a regulatory subunit of the major cellular phosphatase, PP2A, that has recently been shown to interact with MID1, the product of the gene mutated in X-linked Opitz GBBB syndrome"
    explanation: Establishes Alpha 4 (IGBP1) as a PP2A regulatory subunit interacting with MID1, the mechanistic basis for the proposed pathophysiology.
  - reference: PMID:9792806
    reference_title: "Regulation of protein phosphatase 2A catalytic activity by alpha4 protein and its yeast homolog Tap42."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The association of alpha4 and Tap42 with PP2A-C inhibited the phosphatase activity toward 4E-BP1"
    explanation: In vitro biochemistry establishes that alpha4 (IGBP1) binds the PP2A catalytic subunit and modulates its phosphatase activity toward an mTOR-pathway substrate, defining the molecular function perturbed by IGBP1 dysregulation.
  downstream:
  - target: Impaired forebrain commissural and craniofacial morphogenesis
    description: >
      Altered Alpha 4/PP2A regulation during embryogenesis is proposed to
      underlie the callosal agenesis and craniofacial/ocular malformations,
      paralleling the developmental defects of Opitz GBBB syndrome.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

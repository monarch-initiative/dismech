      reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Altered expression of Alpha 4, through either a change in translational efficiency, mRNA stability or splicing, could explain the clinical phenotype in these boys"

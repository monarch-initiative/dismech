inheritance:
- name: X-linked recessive inheritance
  description: >
    The disorder segregated in an X-linked recessive pattern in the two affected
    brothers, with the causative IGBP1 (Alpha 4) locus at Xq13. It is cataloged
    in OMIM as X-linked syndromic intellectual disability 28 (MRXS28).
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:14556245
    reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in both we have identified adjacent alterations (-57delT and T-55A) in the Alpha 4 gene located within this interval"
    explanation: The two affected brothers share variants at the X-linked Alpha 4 (IGBP1) locus, consistent with X-linked recessive inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence or incidence estimate exists. The syndrome has been
    reported in a single family (two affected brothers) in the original 2003
    description, with no independently published second family identified. Curated
    as cases-in-literature / not-yet-documented; no numeric rate is asserted.
  evidence:
  - reference: PMID:14556245
    reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two brothers with a unique pattern of malformations"
    explanation: The defining report describes a single family of two affected brothers, the only cases documented in the literature.
mechanistic_hypotheses:
- hypothesis_group_id: igbp1_pp2a_dosage_developmental_mechanism
  hypothesis_label: IGBP1/Alpha 4 dosage dysregulation of PP2A as the developmental mechanism
  status: EMERGING
  description: >-
    The proposed disease mechanism is that the 5'-regulatory IGBP1 (Alpha 4)
    variants alter Alpha 4 protein dosage (via changed translational efficiency,
    mRNA stability, or splicing), perturbing PP2A-regulated dephosphorylation
    during embryonic midline and craniofacial development. Because Alpha 4 is
    itself regulated by MID1 - the E3 ubiquitin ligase mutated in the
    phenotypically overlapping X-linked Opitz GBBB syndrome - dysregulated Alpha 4
    dosage is proposed as a shared mechanistic node for the callosal, ocular, and
    craniofacial malformations. This remains a hypothesis stated in the primary
    literature: no knock-in mouse or patient-cell functional confirmation of the
    specific variants has been reported, and the IGBP1-XLID gene association
    itself has been flagged as needing replication.
  evidence:
  - reference: PMID:14556245
    reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Altered expression of Alpha 4, through either a change in translational efficiency, mRNA stability or splicing, could explain the clinical phenotype in these boys and the phenotypic overlap with Opitz GBBB syndrome"
    explanation: The primary report frames the Alpha 4 dosage-dysregulation mechanism as a hypothesis, consistent with an EMERGING status.
pathophysiology:
- name: IGBP1 5'-Regulatory Variants
  biological_scale: MOLECULAR
  description: >
    The two affected brothers carried adjacent nucleotide changes (-57delT and
    T-55A) in the 5' regulatory region of IGBP1 (the Alpha 4 gene) at Xq13, not
    present in 410 control chromosomes. As non-coding regulatory variants they
    are proposed to act on IGBP1 expression rather than to alter Alpha 4 protein
    structure.
  genes:
  - preferred_term: IGBP1
    term:
      id: hgnc:5461
      label: IGBP1
  evidence:
  - reference: PMID:14556245
    reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in both we have identified adjacent alterations (-57delT and T-55A) in the Alpha 4 gene located within this interval"
    explanation: Identifies the adjacent 5'-regulatory IGBP1 (Alpha 4) variants shared by the two affected brothers.
  - reference: PMID:14556245
    reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The double nucleotide change identified in this family was not observed in 410 control chromosomes, suggesting that it may be a pathogenetic change"
    explanation: Absence from 410 control chromosomes supports pathogenicity of the regulatory variants.
  downstream:
  - target: Altered Alpha 4 (IGBP1) Protein Dosage
    description: >
      The 5'-regulatory variants are proposed to change IGBP1 expression through
      altered translational efficiency, mRNA stability, or splicing, shifting
      Alpha 4 protein dosage.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - igbp1_pp2a_dosage_developmental_mechanism
    evidence:
    - reference: PMID:14556245
      reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Altered expression of Alpha 4, through either a change in translational efficiency, mRNA stability or splicing"
      explanation: The authors propose the regulatory variants change Alpha 4 expression/dosage.
- name: Altered Alpha 4 (IGBP1) Protein Dosage
  biological_scale: MOLECULAR
  description: >
    Changed Alpha 4 (IGBP1) protein dosage resulting from the regulatory
    variants. Alpha 4 is a regulatory subunit of protein phosphatase 2A (PP2A),
    so altered Alpha 4 levels are proposed to feed forward into PP2A regulation.
  genes:
  - preferred_term: IGBP1
    term:
      id: hgnc:5461
      label: IGBP1
  evidence:
  - reference: PMID:14556245
    reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alpha 4 is a regulatory subunit of the major cellular phosphatase, PP2A, that has recently been shown to interact with MID1, the product of the gene mutated in X-linked Opitz GBBB syndrome"
    explanation: Establishes Alpha 4 (IGBP1) as a PP2A regulatory subunit whose dosage change would act through PP2A.
  downstream:
  - target: Dysregulated PP2A Holoenzyme Dephosphorylation
    description: >
      Because Alpha 4 binds and modulates the PP2A catalytic subunit, altered
      Alpha 4 dosage is proposed to dysregulate PP2A-dependent dephosphorylation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - igbp1_pp2a_dosage_developmental_mechanism
    evidence:
    - reference: PMID:9792806
      reference_title: "Regulation of protein phosphatase 2A catalytic activity by alpha4 protein and its yeast homolog Tap42."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The association of alpha4 and Tap42 with PP2A-C inhibited the phosphatase activity toward 4E-BP1"
      explanation: Alpha 4 binding of the PP2A catalytic subunit changes its phosphatase activity, the link from Alpha 4 dosage to PP2A dysregulation.
- name: Dysregulated PP2A Holoenzyme Dephosphorylation
  biological_scale: MOLECULAR
  description: >
    Perturbed PP2A-dependent protein dephosphorylation, the major cellular
    serine/threonine phosphatase activity that Alpha 4 regulates (including
    toward mTOR-pathway substrates such as 4E-BP1). This is the proposed
    proximal biochemical consequence that couples to developmental morphogenesis.
  molecular_functions:
  - preferred_term: PP2A regulatory (Alpha 4) subunit activity
    term:
      id: GO:0019888
      label: protein phosphatase regulator activity
    modifier: ABNORMAL
  cellular_components:

progression:
- phase: Congenital, static course
  age_range: Birth onward
  notes: >
    The structural malformations (agenesis of the corpus callosum, coloboma,
    micrognathia/retrognathia, ear anomalies) are congenital and non-progressive;
    intellectual disability and sensorineural hearing loss are lifelong. The one
    documented dynamic exception was the cardiac involvement in one brother, whose
    ventricular septal defect and patent ductus arteriosus resolved spontaneously.
  evidence:
  - reference: PMID:14556245
    reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "One brother had choanal atresia and cardiac defects consisting of ventricular septal defect (VSD) and patent ductus arteriosus (PDA) which resolved spontaneously."
    explanation: The spontaneously-resolving cardiac defects are the one dynamic exception to an otherwise static congenital course.

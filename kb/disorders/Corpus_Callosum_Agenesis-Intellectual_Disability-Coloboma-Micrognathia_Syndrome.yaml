inheritance:
- name: X-linked recessive inheritance
  description: >
    The disorder segregated in an X-linked recessive pattern in the two affected
    brothers, with the causative IGBP1 (Alpha 4) locus at Xq13. It is cataloged
    in OMIM as X-linked syndromic intellectual disability 28 (MRXS28).
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:14556245
    reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "in both we have identified adjacent alterations (-57delT and T-55A) in the Alpha 4 gene located within this interval"
    explanation: The two affected brothers share variants at the X-linked Alpha 4 (IGBP1) locus, consistent with X-linked recessive inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence or incidence estimate exists. The syndrome has been
    reported in a single family (two affected brothers) in the original 2003
    description, with no independently published second family identified.
  evidence:
  - reference: PMID:14556245
    reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We describe two brothers with a unique pattern of malformations that includes coloboma (iris, optic nerve), high forehead, severe retrognathia, mental retardation, and agenesis of the corpus callosum (ACC)."
    explanation: The defining report describes a single family of two affected brothers, the only cases documented in the literature.
mechanistic_hypotheses:
- hypothesis_group_id: igbp1_pp2a_dosage_developmental_mechanism
  hypothesis_label: IGBP1/Alpha 4 dosage dysregulation of PP2A as the developmental mechanism
  status: EMERGING
  description: >-
    The proposed disease mechanism is that the 5'-regulatory IGBP1 (Alpha 4)
    variants alter Alpha 4 protein dosage (via changed translational efficiency,
    mRNA stability, or splicing), perturbing PP2A-regulated dephosphorylation
    during embryonic midline and craniofacial development. Because Alpha 4 is
    itself regulated by MID1 - the E3 ubiquitin ligase mutated in the
    phenotypically overlapping X-linked Opitz GBBB syndrome - dysregulated Alpha 4
    dosage is proposed as a shared mechanistic node for the callosal, ocular, and
    craniofacial malformations. This remains a hypothesis stated in the primary
    literature: no knock-in mouse or patient-cell functional confirmation of the
    specific variants has been reported, and the IGBP1-XLID gene association
    itself has been flagged as needing replication.
  evidence:
  - reference: PMID:14556245
    reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Altered expression of Alpha 4, through either a change in translational efficiency, mRNA stability or splicing, could explain the clinical phenotype in these boys and the phenotypic overlap with Opitz GBBB syndrome"
    explanation: The primary report frames the Alpha 4 dosage-dysregulation mechanism as a hypothesis, consistent with an EMERGING status.
pathophysiology:
- name: IGBP1 5'-Regulatory Variants
  biological_scale: MOLECULAR
  description: >
    The two affected brothers carried adjacent nucleotide changes (-57delT and
    T-55A) in the 5' regulatory region of IGBP1 (the Alpha 4 gene) at Xq13, not
    present in 410 control chromosomes. As non-coding regulatory variants they
    are proposed to act on IGBP1 expression rather than to alter Alpha 4 protein
    structure.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
  genes:
  - preferred_term: IGBP1
    term:

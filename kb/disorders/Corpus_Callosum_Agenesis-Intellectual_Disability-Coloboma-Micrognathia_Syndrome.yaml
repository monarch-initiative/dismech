genetic:
- name: IGBP1
  association: Causal 5'-regulatory-region variants (Alpha 4 gene)
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: IGBP1
    term:
      id: hgnc:5461
      label: IGBP1
  notes: >
    IGBP1 (the Alpha 4 gene) at Xq13 encodes a regulatory subunit of protein
    phosphatase 2A (PP2A). The two affected brothers carried adjacent changes
    (-57delT and T-55A) in the gene's 5' regulatory region, not present in 410
    control chromosomes.
  variants:
  - name: -57delT and T-55A (adjacent 5'-regulatory IGBP1/Alpha 4 variants)
    description: >
      Adjacent single-nucleotide changes in the 5' regulatory region of IGBP1
      (Alpha 4), proposed to alter translational efficiency, mRNA stability, or
      splicing. Absent from 410 control chromosomes.
    evidence:
    - reference: PMID:14556245
      reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "The double nucleotide change identified in this family was not observed in 410 control chromosomes, suggesting that it may be a pathogenetic change"
      explanation: The adjacent IGBP1 variants were absent from controls, supporting pathogenicity.
  evidence:
  - reference: PMID:14556245
    reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "in both we have identified adjacent alterations (-57delT and T-55A) in the Alpha 4 gene located within this interval"
    explanation: Identifies IGBP1 (Alpha 4) as the candidate causative gene at Xq13.
- name: MID1
  association: Mechanistic interactor (not mutated in the reported family)
  relationship_type: COOPERATING
  gene_term:
    preferred_term: MID1
    term:
      id: hgnc:7095
      label: MID1
  notes: >
    MID1 is not mutated in the reported family but is the mechanistic bridge to
    the syndrome's phenotypic overlap with X-linked Opitz GBBB syndrome: MID1 is
    the microtubule-associated E3 ubiquitin ligase (mutated in Opitz GBBB) that
    physically interacts with Alpha 4 (IGBP1) to regulate PP2A. It is modeled as
    a cooperating locus in the shared Alpha 4/PP2A developmental pathway rather
    than a causative gene for this disorder.
  evidence:
  - reference: PMID:14556245
    reference_title: "A new X-linked syndrome with agenesis of the corpus callosum, mental retardation, coloboma, micrognathia, and a mutation in the Alpha 4 gene at Xq13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Alpha 4 is a regulatory subunit of the major cellular phosphatase, PP2A, that has recently been shown to interact with MID1, the product of the gene mutated in X-linked Opitz GBBB syndrome"
    explanation: Establishes the Alpha 4 (IGBP1)-MID1 interaction as the mechanistic link to the overlapping Opitz GBBB phenotype.
discussions:
- discussion_id: disc_ccaidc_igbp1_causality_replication
  prompt: >-
    Is IGBP1 (the Alpha 4 gene) definitively the cause of corpus callosum
    agenesis-intellectual disability-coloboma-micrognathia syndrome, or does the
    gene-disease relationship still require independent replication?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#IGBP1 5'-Regulatory Variants
  rationale: >-
    The IGBP1 assignment rests on a single family (two brothers) with adjacent
    5'-regulatory variants and a proposed, not demonstrated, functional
    consequence. A systematic reassessment of X-linked intellectual disability
    genes against large-scale control exome data placed IGBP1 among genes for
    which replication studies are warranted, so the causal relationship should
    be treated as provisional until additional families or functional data are
    reported.
  evidence:
  - reference: PMID:23871722
    reference_title: "XLID-causing mutations and associated genes challenged in light of data from large-scale human exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We also highlight 15 other genes (CCDC22, CLIC2, CNKSR2, FRMPD4, HCFC1, IGBP1, KIAA2022, KLF8, MAOA, NAA10, NLGN3, RPL10, SHROOM4, ZDHHC15, and ZNF261) for which replication studies are warranted"
    explanation: A large-scale XLID reassessment explicitly lists IGBP1 among genes whose disease implication needs independent replication.
  posed_date: "2026-07-30T00:00:00Z"
  notes: >-
    Consistent with the ultra-rare, single-family basis of the syndrome; the
    IGBP1/Alpha 4 mechanism (PP2A regulation, MID1 interaction) is biologically
    plausible but the human genetic evidence remains limited.
- discussion_id: disc_ccaidc_igbp1_mouse_model_gap
  prompt: >-
    Does any Igbp1 (Alpha 4) mouse model recapitulate the human corpus callosum
    agenesis-coloboma-craniofacial phenotype, and can such a model confirm the
    proposed Alpha 4 dosage/PP2A developmental mechanism?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Dysregulated PP2A Holoenzyme Dephosphorylation
  rationale: >-
    No Igbp1 mouse allele has been shown to reproduce the syndrome's central
    developmental phenotype (agenesis of the corpus callosum, coloboma,
    craniofacial anomalies); reported Igbp1 mouse phenotypes concern other
    systems. The absence of a phenotype-recapitulating animal model leaves the
    proposed Alpha 4 dosage/PP2A developmental mechanism functionally
    unconfirmed and is a distinct gap from the human-genetics replication gap.
  posed_date: "2026-07-30T00:00:00Z"
  notes: >-
    Complements the human-genetics replication gap by separating functional
    confirmation of the Alpha 4/PP2A developmental mechanism in an animal model
    from identification of additional affected families.

name: Corpus Callosum Agenesis-Intellectual Disability-Coloboma-Micrognathia Syndrome
category: Mendelian
creation_date: "2026-07-30T00:00:00Z"
synonyms:
- Graham-Cox syndrome
- MRXS28
- Intellectual disability, X-linked, syndromic 28
- Mental retardation, X-linked, syndromic 28
- Agenesis of the corpus callosum-intellectual disability-coloboma-micrognathia syndrome
- Corpus callosum, agenesis of, with impaired intellectual development, ocular coloboma and micrognathia, X-linked recessive
description: >
  Corpus callosum agenesis-intellectual disability-coloboma-micrognathia
  syndrome (Graham-Cox syndrome; X-linked syndromic intellectual disability 28,
  MRXS28) is an ultra-rare X-linked recessive multiple congenital
  anomalies-intellectual disability syndrome. It was delineated in two brothers
  with the recurrent pattern of ocular coloboma (iris and optic nerve), facial
  dysmorphism (high forehead, severe retrognathia/micrognathia, low-set cupped
  ears), intellectual disability, agenesis of the corpus callosum, sensorineural
  hearing loss, skeletal anomalies (pectus excavatum, scoliosis) and short
  stature. The affected brothers carried adjacent variants in the 5' regulatory
  region of IGBP1 (the Alpha 4 gene) at Xq13. IGBP1/Alpha 4 is a regulatory
  subunit of protein phosphatase 2A (PP2A) that interacts with MID1, the E3
  ubiquitin-ligase product of the gene mutated in X-linked Opitz GBBB syndrome,
  and the disorder shows clinical overlap with Opitz GBBB syndrome.

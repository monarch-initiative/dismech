      label: protein dephosphorylation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:9792806
    reference_title: "Regulation of protein phosphatase 2A catalytic activity by alpha4 protein and its yeast homolog Tap42."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a potential regulatory role of alpha4 and Tap42 to inibit the phosphatase activity of PP2A-C toward the physiologically relevant substrate in the mTOR signaling"
    explanation: Defines the dysregulated PP2A dephosphorylation (including toward mTOR-pathway substrates) that Alpha 4 controls.
  downstream:
  - target: Impaired Forebrain Commissural Morphogenesis
    description: >
      Dysregulated PP2A signaling during embryogenesis is proposed to disrupt
      forebrain commissural development, producing agenesis of the corpus
      callosum.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:

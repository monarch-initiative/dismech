genetic:
- name: Autosomal Recessive PMPCB Deficiency
  gene_term:
    preferred_term: PMPCB
    term:
      id: hgnc:9119
      label: PMPCB
  inheritance:
  - name: Autosomal recessive
    penetrance: COMPLETE
    expressivity: VARIABLE
    description: >
      Biallelic (homozygous or compound heterozygous) PMPCB variants; parents are
      carriers. Expressivity is variable, ranging from lethal early-childhood
      neurodegeneration to a milder adult-surviving phenotype driven by residual
      splicing.
    evidence:
    - reference: PMID:29576218
      reference_title: "Mutations in PMPCB Encoding the Catalytic Subunit of the Mitochondrial Presequence Protease Cause Neurodegeneration in Early Childhood."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified biallelic variants in PMPCB in individuals of four families
        including one family with two affected siblings with neurodegeneration and
        cerebellar atrophy.
      explanation: >
        Biallelic transmission across four families establishes autosomal
        recessive inheritance.
  variants:
  - name: PMPCB p.Arg175 missense variants
    description: >
      Missense variants at the recurrent residue Arg175 (p.Arg175Cys, seen in
      multiple unrelated individuals; p.Arg175His in another) are the most
      commonly reported PMPCB variants. Arg175 is a conserved residue that
      stabilizes the protein fold; the original cohort carried only missense
      variants.
    gene:
      preferred_term: PMPCB
      term:
        id: hgnc:9119
        label: PMPCB
    evidence:
    - reference: PMID:38374165
      reference_title: "Leigh syndrome with developmental regression and ataxia due to a novel splicing variant in the PMPCB gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This has been seen in two other individuals, p.Arg175His present in a
        third, indicating this is a common recurring site for variation.
      explanation: >
        Documents Arg175 as a recurrent PMPCB variation site (p.Arg175Cys and
        p.Arg175His).
  - name: PMPCB c.1330-2A>T splice variant
    description: >
      The first reported PMPCB splice-site variant, c.1330-2A>T, causes skipping
      of exon 12 (confirmed by an exon-trapping minigene assay). In compound
      heterozygosity it was associated with a milder, adult-surviving phenotype,
      attributed to residual normally spliced PMPCB mRNA.
    gene:
      preferred_term: PMPCB
      term:
        id: hgnc:9119
        label: PMPCB
    evidence:
    - reference: PMID:38374165
      reference_title: "Leigh syndrome with developmental regression and ataxia due to a novel splicing variant in the PMPCB gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A minigene assay confirms this variant results in aberrant splicing and
        skipping of exon 12.
      explanation: >
        Functional confirmation that the c.1330-2A>T variant causes exon-12
        skipping.
environmental:
- name: Intercurrent febrile illness
  description: >
    As in other Leigh-like mitochondrial disorders, febrile or intercurrent
    illness precipitates acute neurological decompensation and developmental
    regression in PMPCB disease. In the adult-surviving patient, regression
    followed an episode of otitis media; across reported cases the Leigh-like
    features are often associated with febrile illness. Prompt treatment of
    intercurrent infection is the corresponding clinical priority.
  notes: >
    exposure_term left unbound. ECTO has no clean single term for "intercurrent
    febrile illness / minor infection as a metabolic-decompensation trigger";
    the concept is a nonspecific physiological stressor rather than a chemical or
    defined-agent exposure. The claim is nonetheless evidenced for PMPCB disease
    as cited below.
  influences_mechanisms:
  - target: Developmental Regression
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >
      Febrile/intercurrent illness triggers the Leigh-like regression episodes
      characteristic of PMPCB disease.
    evidence:
    - reference: PMID:38374165
      reference_title: "Leigh syndrome with developmental regression and ataxia due to a novel splicing variant in the PMPCB gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The described phenotype included typical Leigh-like features of
        developmental regression and basal ganglia lesions, often associated with
        febrile illness, and with prominent cerebellar atrophy and increased T2
        signal of the cerebellar cortex.
      explanation: >
        States that the regression/basal-ganglia phenotype is often associated
        with febrile illness, i.e. the exposure triggers the episodes.
  evidence:
  - reference: PMID:38374165
    reference_title: "Leigh syndrome with developmental regression and ataxia due to a novel splicing variant in the PMPCB gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was diagnosed with otitis media and subsequently admitted to hospital
      for five weeks with presumed encephalitis. She had regressed losing the
      ability to sit and speak
    explanation: >
      Documents an intercurrent infection (otitis media) preceding acute
      regression in a PMPCB patient.
treatments:
- name: Supportive Care
  description: >
    No disease-modifying therapy exists. Management is symptomatic and
    supportive: seizure control, dystonia management, nutritional support,
    rehabilitation, and prompt treatment of intercurrent infections, which are
    documented precipitants of Leigh-like decompensation.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Anticonvulsant Therapy
  description: >
    Seizure management with standard antiepileptic drugs. No PMPCB-specific
    pharmacogenomic interactions are known.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: Physical Therapy and Rehabilitation
  description: >
    Physical, occupational, and speech therapy for the motor, ataxic, and
    communication deficits arising from basal-ganglia and cerebellar
    degeneration.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
- name: Genetic Counseling
  description: >
    Autosomal-recessive inheritance with 25% recurrence risk per pregnancy for
    carrier parents. Carrier and cascade testing available once the familial
    variants are known; reproductive options include prenatal diagnosis and
    preimplantation genetic testing.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
animal_models:
- species: Zebrafish
  genotype: pmpcb-/- (functional null)
  description: >
    Zebrafish larvae with functional pmpcb deficiency show reduced neural cells,
    uncompacted myelin, and dysfunctional locomotor behavior, driven by decreased
    mitochondrial membrane potential, insufficient ATP synthesis, elevated ROS
    and ER stress, neural-cell apoptosis, and impaired WNT/beta-catenin
    signaling. Rescue with a WNT agonist (BIO), creatine, the ER-stress
    scavenger 4-phenylbutyric acid, or glial-driven pmpcb re-expression mitigates
    the CNS defects. Recapitulates the CNS-degeneration mechanism but not the
    specific basal-ganglia/cerebellar human imaging phenotype.
  associated_phenotypes:
  - Reduced neural cell number
  - Uncompacted myelin
  - Locomotor dysfunction
  - Decreased mitochondrial membrane potential
  - Neural cell apoptosis
  evidence:
  - reference: PMID:41999531
    reference_title: "Pmpcb modulates zebrafish neurogenesis and stress resistance via regulating mitochondria metabolism and function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      zebrafish larvae with a functional deficiency of pmpcb (pmpcb-/-) exhibited
      reduced neural cells, uncompacted myelin, and dysfunctional locomotor
      behaviors.
    explanation: >
      Establishes the zebrafish pmpcb-null neurodevelopmental/CNS phenotype used
      to model MMDS6.
- species: Saccharomyces cerevisiae
  genotype: Mas1 (MPP beta ortholog) carrying patient PMPCB variants
  description: >
    Introduction of the patient PMPCB variants into the homologous yeast Mas1
    protein produced a severe growth and MPP processing defect with accumulation
    of mitochondrial precursor proteins and early impairment of iron-sulfur
    cluster biogenesis. Used to demonstrate causality of the variants for the
    MPP-processing and Fe-S defect; does not model neurological features.
  associated_phenotypes:
  - MPP processing defect
  - Mitochondrial precursor protein accumulation
  - Impaired iron-sulfur cluster biogenesis
  evidence:
  - reference: PMID:29576218
    reference_title: "Mutations in PMPCB Encoding the Catalytic Subunit of the Mitochondrial Presequence Protease Cause Neurodegeneration in Early Childhood."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      resulted in a severe growth and MPP processing defect leading to the
      accumulation of mitochondrial precursor proteins and early impairment of
      the biogenesis of iron-sulfur clusters
    explanation: >
      Yeast complementation demonstrates the PMPCB variants cause the
      MPP-processing and Fe-S biogenesis defect.
diagnosis:
- name: Molecular Genetic Testing
  description: >
    Definitive diagnosis rests on identifying biallelic pathogenic PMPCB
    variants by exome sequencing or a mitochondrial/nuclear gene panel, with
    confirmation of biparental inheritance. No GeneReviews chapter exists for
    PMPCB/MMDS6.
  evidence:
  - reference: PMID:29576218
    reference_title: "Mutations in PMPCB Encoding the Catalytic Subunit of the Mitochondrial Presequence Protease Cause Neurodegeneration in Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified biallelic variants in PMPCB in individuals of four families
    explanation: >
      Diagnosis is established by identifying biallelic PMPCB variants, as in
      the original four-family cohort.
- name: Brain MRI
  description: >
    Brain MRI shows the Leigh-like pattern: symmetrical basal-ganglia signal
    change (putaminal atrophy and hyperintensity) with prominent cerebellar
    atrophy and increased T2 signal of the cerebellar cortex.
  evidence:
  - reference: PMID:38374165
    reference_title: "Leigh syndrome with developmental regression and ataxia due to a novel splicing variant in the PMPCB gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI brain showed basal ganglia and cerebellar atrophy"
    explanation: >
      Brain MRI documents the basal-ganglia and cerebellar findings used to
      support the diagnosis.
- name: Frataxin Processing / MPP Functional Assay
  description: >
    In research settings, accumulation of the frataxin processing intermediate
    in patient-derived cells is a sensitive functional readout of impaired MPP
    activity and supports the diagnosis at the mechanistic level.
  evidence:
  - reference: PMID:29576218
    reference_title: "Mutations in PMPCB Encoding the Catalytic Subunit of the Mitochondrial Presequence Protease Cause Neurodegeneration in Early Childhood."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      accumulation of the processing intermediate of frataxin, a sensitive
      substrate for MPP dysfunction.
    explanation: >
      Accumulation of the frataxin processing intermediate in patient cells is a
      sensitive functional readout of PMPCB/MPP deficiency.
- name: Mitochondrial Respiratory Chain Enzyme Testing
  description: >
    Assay of respiratory chain enzyme activities in biopsy tissue can show
    decreased activity of iron-sulfur cluster-containing complexes, reflecting
    the Fe-S biogenesis defect. Not disease-specific.
  evidence:
  - reference: PMID:29576218
    reference_title: "Mutations in PMPCB Encoding the Catalytic Subunit of the Mitochondrial Presequence Protease Cause Neurodegeneration in Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      decreased activity in iron-sulfur cluster-containing respiratory chain
      complexes
    explanation: >
      Biopsy shows decreased Fe-S respiratory chain complex activity, a
      diagnostic biochemical correlate of the mechanism.
differential_diagnoses:
- name: Friedreich Ataxia
  description: >
    Shares ataxia and impaired frataxin/Fe-S biology, but is caused by a GAA
    repeat expansion in FXN with characteristic cardiac involvement and later
    onset. PMPCB disease reaches frataxin dysfunction indirectly (failed
    processing) and presents as an infantile Leigh-like syndrome. Repeat-expansion
    testing distinguishes the two.
- name: Leigh Syndrome (Other Causes)
  description: >
    PMPCB disease presents as a Leigh-like syndrome; over 100 nuclear genes cause
    Leigh syndrome, so genetic testing is required to identify PMPCB as the cause.
- name: PMPCA-Related Cerebellar Ataxia (SCAR2)
  description: >
    Biallelic variants in PMPCA, the alpha (substrate-recognition) subunit of the
    same MPP heterodimer, cause a cerebellar ataxia. The paralogous subunit
    defect is the closest mechanistic mimic; distinguished by gene testing.
- name: Other Multiple Mitochondrial Dysfunctions Syndromes
  description: >
    MMDS types 1-5 and 9 (NFU1, BOLA3, IBA57, ISCA2, ISCA1, FDXR and others)
    are direct Fe-S cluster assembly defects sharing the Fe-S/respiratory-chain
    phenotype; PMPCB (MMDS6) reaches it indirectly via a presequence-protease
    defect.
references:
- reference: PMID:29576218
  title: Mutations in PMPCB Encoding the Catalytic Subunit of the Mitochondrial Presequence Protease Cause Neurodegeneration in Early Childhood.
- reference: PMID:38374165
  title: Leigh syndrome with developmental regression and ataxia due to a novel splicing variant in the PMPCB gene.
- reference: PMID:41999531
  title: Pmpcb modulates zebrafish neurogenesis and stress resistance via regulating mitochondria metabolism and function.
notes: >
  MMDS6 is the numbered form of the multiple mitochondrial dysfunctions syndrome
  series that fits the Fe-S "series" least well: PMPCB encodes the catalytic
  subunit of the mitochondrial processing peptidase, not an iron-sulfur scaffold,
  and reaches the shared Fe-S/respiratory-chain phenotype indirectly, in large
  part through failed maturation of frataxin. The parent MONDO:0017338 (fatal
  multiple mitochondrial dysfunctions syndrome) has been ruled a GROUPING, so
  MMDS6 is curated here as its own single-gene disease. No GeneReviews chapter
  exists for PMPCB/MMDS6. This entry was curated from a Claude Code literature
  sweep; every snippet is an exact substring of the cited PubMed record, and
  model-organism (zebrafish/yeast) evidence is kept distinct from human evidence
  via evidence_source and is never the sole support for a human phenotype.

pathophysiology:
- name: PMPCB Catalytic Subunit Deficiency
  biological_scale: MOLECULAR
  description: >
    Biallelic PMPCB variants reduce PMPCB protein levels and the proteolytic
    activity of the mitochondrial processing peptidase (MPP). PMPCB is the
    catalytic beta subunit of MPP, a heterodimeric metalloendopeptidase that
    cleaves the N-terminal presequences of the majority of nuclear-encoded
    mitochondrial precursor proteins imported into the matrix. The alpha subunit
    (PMPCA) recognizes substrate while the beta subunit carries the catalytic
    metalloprotease site; both are required for processing.
  genes:
  - preferred_term: PMPCB
    term:
      id: hgnc:9119
      label: PMPCB
  molecular_functions:
  - preferred_term: metalloendopeptidase activity
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: mitochondrial protein processing
    term:
      id: GO:0034982
      label: mitochondrial protein processing
    modifier: DECREASED
  evidence:
  - reference: PMID:29576218
    reference_title: "Mutations in PMPCB Encoding the Catalytic Subunit of the Mitochondrial Presequence Protease Cause Neurodegeneration in Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PMPCB encodes the catalytic subunit of the essential mitochondrial
      processing protease (MPP), which is required for maturation of the majority
      of mitochondrial precursor proteins.
    explanation: >
      Establishes PMPCB as the catalytic subunit of MPP and the role of MPP in
      maturing mitochondrial precursor proteins.
  - reference: PMID:38374165
    reference_title: "Leigh syndrome with developmental regression and ataxia due to a novel splicing variant in the PMPCB gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PMPCB gene codes for the catalytic β sub-unit of the mitochondrial
      processing protease (MPP). MPP consists of two subunits, α and β, encoded
      by separate genes
    explanation: >
      Confirms the two-subunit MPP architecture and PMPCB as the catalytic
      beta subunit.
  downstream:
  - target: Impaired Mitochondrial Presequence and Frataxin Processing
    causal_link_type: DIRECT
- name: Impaired Mitochondrial Presequence and Frataxin Processing
  biological_scale: MOLECULAR
  description: >
    Loss of MPP proteolytic activity impairs cleavage of imported mitochondrial
    precursor proteins. Frataxin, an especially sensitive MPP substrate, is not
    matured normally, so its processing intermediate accumulates in patient
    fibroblasts, induced pluripotent stem cells, and differentiated
    neuroepithelial stem cells. Because frataxin is a core factor for
    iron-sulfur cluster biogenesis, its failed maturation is the principal
    indirect route by which a protease defect produces the Fe-S phenotype shared
    with the rest of the MMDS series and with Friedreich ataxia.
  biological_processes:
  - preferred_term: mitochondrial protein processing
    term:
      id: GO:0034982
      label: mitochondrial protein processing
    modifier: DECREASED
  evidence:
  - reference: PMID:29576218
    reference_title: "Mutations in PMPCB Encoding the Catalytic Subunit of the Mitochondrial Presequence Protease Cause Neurodegeneration in Early Childhood."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      showed reduced PMPCB levels and accumulation of the processing intermediate
      of frataxin, a sensitive substrate for MPP dysfunction.
    explanation: >
      Patient-derived cells show reduced PMPCB and accumulation of the frataxin
      processing intermediate, the direct readout of impaired MPP processing.
  downstream:
  - target: Impaired Iron-Sulfur Cluster Biogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29576218
      reference_title: "Mutations in PMPCB Encoding the Catalytic Subunit of the Mitochondrial Presequence Protease Cause Neurodegeneration in Early Childhood."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        resulted in a severe growth and MPP processing defect leading to the
        accumulation of mitochondrial precursor proteins and early impairment of
        the biogenesis of iron-sulfur clusters
      explanation: >
        Introducing the patient variants into the homologous yeast Mas1 protein
        links the MPP processing defect causally to impaired iron-sulfur cluster
        biogenesis.
- name: Impaired Iron-Sulfur Cluster Biogenesis
  biological_scale: MOLECULAR
  description: >
    Defective presequence/frataxin processing produces an early impairment of
    iron-sulfur (Fe-S) cluster biogenesis. Fe-S clusters are indispensable
    cofactors for a broad range of enzymes, including several respiratory chain
    complexes and cytosolic Fe-S-dependent enzymes.
  biological_processes:
  - preferred_term: iron-sulfur cluster assembly
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:29576218
    reference_title: "Mutations in PMPCB Encoding the Catalytic Subunit of the Mitochondrial Presequence Protease Cause Neurodegeneration in Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      biallelic mutations in PMPCB cause defects in MPP proteolytic activity
      leading to dysregulation of iron-sulfur cluster biogenesis and triggering a
      complex neurological phenotype of neurodegeneration in early childhood.
    explanation: >
      The authors' overall conclusion places dysregulated Fe-S biogenesis
      downstream of the MPP proteolytic defect and upstream of neurodegeneration.
  downstream:
  - target: Respiratory Chain and Fe-S Enzyme Dysfunction
    causal_link_type: DIRECT
- name: Respiratory Chain and Fe-S Enzyme Dysfunction
  biological_scale: CELLULAR
  description: >
    Loss of Fe-S cluster supply decreases the activity of iron-sulfur
    cluster-containing respiratory chain complexes and disables mitochondrial and
    cytosolic Fe-S-dependent enzymes, documented in biopsy material from an
    affected individual. The result is impaired oxidative phosphorylation.
  biological_processes:
  - preferred_term: electron transport chain
    term:
      id: GO:0022900
      label: electron transport chain
    modifier: DECREASED
  evidence:
  - reference: PMID:29576218
    reference_title: "Mutations in PMPCB Encoding the Catalytic Subunit of the Mitochondrial Presequence Protease Cause Neurodegeneration in Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of biopsy materials of an affected individual revealed changes and
      decreased activity in iron-sulfur cluster-containing respiratory chain
      complexes and dysfunction of mitochondrial and cytosolic Fe-S
      cluster-dependent enzymes.
    explanation: >
      Direct human biopsy evidence of decreased Fe-S respiratory chain complex
      activity and Fe-S enzyme dysfunction.
  downstream:
  - target: Neuronal Energy Failure and Oxidative Stress
    causal_link_type: DIRECT
  - target: Basal Ganglia and Cerebellar Neurodegeneration
    causal_link_type: DIRECT
- name: Neuronal Energy Failure and Oxidative Stress
  biological_scale: CELLULAR
  description: >
    In a zebrafish pmpcb-null model, decreased mitochondrial membrane potential
    and insufficient ATP synthesis raise reactive oxygen species and endoplasmic
    reticulum stress, driving neural-cell apoptosis and impaired WNT/beta-catenin
    signaling. This model-organism evidence details the cellular consequences of
    the same catalytic deficiency; it corroborates but does not by itself
    establish the human phenotype.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: response to oxidative stress
    term:

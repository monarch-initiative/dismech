name: Multiple Mitochondrial Dysfunctions Syndrome 6
category: Genetic
creation_date: "2026-09-05T00:00:00Z"
synonyms:
- MMDS6
- PMPCB-related mitochondrial neurodegeneration
- Mitochondrial processing peptidase beta subunit deficiency
description: >
  Multiple mitochondrial dysfunctions syndrome 6 (MMDS6; MONDO:0054785; OMIM
  #617954) is an ultra-rare autosomal-recessive childhood-onset mitochondrial
  neurodegeneration caused by biallelic variants in PMPCB (7q22.1), which encodes
  the catalytic beta subunit of the mitochondrial processing peptidase (MPP). MPP
  is the essential protease that cleaves the N-terminal presequences of the
  majority of nuclear-encoded mitochondrial precursor proteins after matrix
  import. Unlike the Fe-S-scaffold forms of the MMDS series, PMPCB is a
  presequence protease rather than an iron-sulfur assembly factor; it reaches the
  shared iron-sulfur/respiratory-chain phenotype indirectly, in significant part
  through failure to mature frataxin (a sensitive MPP substrate and a core Fe-S
  biogenesis factor). Reduced MPP activity leads to accumulation of the frataxin
  processing intermediate, impaired iron-sulfur cluster biogenesis, decreased
  activity of Fe-S-containing respiratory chain complexes, and neurodegeneration
  in early childhood. The clinical picture is a Leigh-like syndrome of
  developmental regression with symmetrical basal-ganglia lesions and prominent
  cerebellar atrophy, ataxia, and variable dystonia and epilepsy, with onset
  typically by 12 months and frequent death in childhood. Only about six
  individuals from four to five families have been reported; all original cases
  carried missense variants (recurrent at residue Arg175), and one splice-site
  variant has since been described in a milder, adult-surviving patient. No
  disease-modifying therapy exists; management is supportive.

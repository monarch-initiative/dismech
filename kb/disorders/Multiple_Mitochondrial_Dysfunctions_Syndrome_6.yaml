      consequent neural cell apoptosis.
    explanation: >
      Zebrafish pmpcb-null model links energy failure to ROS/ER stress and
      neural apoptosis, the cellular mechanism downstream of respiratory chain
      dysfunction.
  downstream:
  - target: Basal Ganglia and Cerebellar Neurodegeneration
    causal_link_type: DIRECT
- name: Basal Ganglia and Cerebellar Neurodegeneration
  biological_scale: TISSUE
  description: >
    Progressive neurodegeneration with a predilection for the basal ganglia and
    cerebellum. Imaging shows symmetrical basal-ganglia lesions (Leigh-like
    pattern, e.g. putaminal atrophy and hyperintensity) and prominent cerebellar
    atrophy. This tissue-level degeneration is the proximate cause of the
    developmental regression, ataxia, dystonia, and epilepsy that define the
    clinical syndrome.
  cell_types:

    reference_title: "Pmpcb modulates zebrafish neurogenesis and stress resistance via regulating mitochondria metabolism and function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the decrease in mitochondrial membrane potential and insufficient ATP
      synthesis in pmpcb-/- zebrafish contributes to elevated reactive oxygen

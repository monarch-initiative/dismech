environmental:
- name: Occupational Cadmium Exposure
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: INHALATION
      notes: >-
        Fume and dust inhalation is the occupational route and the
        higher-bioavailability one: roughly 10% of inhaled cadmium is absorbed
        against roughly 5% of ingested cadmium.
    exposure_duration:
    - classification_value: CHRONIC
      notes: >-
        The nephropathy and osteomalacia are cumulative-burden diseases; cadmium's
        10-30 year biological half-life means occupational exposure integrates
        over a working lifetime.
    - classification_value: ACUTE
      notes: >-
        Recorded in parallel for the single high-dose fume exposures that produce
        chemical pneumonitis, a mechanistically distinct presentation from the
        chronic accumulation arm.
    iarc_carcinogen_group:
      classification_value: GROUP_1
      notes: >-
        IARC has classified cadmium and cadmium compounds as Group 1,
        carcinogenic to humans, since 1993, primarily on excess lung cancer in
        occupationally exposed cohorts. Recorded on the exposure because it is a
        property of the agent.
      evidence:
      - reference: PMID:12746140
        reference_title: "Cadmium, lung and prostate cancer: a systematic review of recent epidemiological data."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Cadmium (Cd) and its compounds were classified as \"carcinogenic to humans (Group 1)\" by IARC in 1993"
        explanation: Source for the IARC Group 1 assignment recorded on this exposure.
    ghs_health_hazard_class:
    - classification_value: CARCINOGENICITY
    - classification_value: STOT_REPEATED_EXPOSURE
      notes: >-
        The proximal tubular nephropathy and osteomalacia are target-organ
        toxicity from repeated exposure, a separate hazard class from the
        carcinogenicity listing.
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
  influences_mechanisms:
  - target: Cadmium Absorption and Systemic Distribution
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Industrial processes generate cadmium fume and dust that workers inhale,
      and inhaled cadmium is the higher-bioavailability route into the body at
      this node.
    evidence:
    - reference: PMID:18072106
      reference_title: "Cadmium exposure: health hazards of silver cottage industry in developing countries."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Silver is mixed with cadmium and then used to make silver jewelry. During this process there is a formation of cadmium fumes, and the workers inhale the fumes."
      explanation: >-
        Documents cadmium fume formation during silver jewelry manufacture and
        its inhalation by workers, the occupational inhalational route into
        the body.
  - target: Acute Pulmonary Injury
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      High-dose fume inhalation injures the alveolar epithelium directly at the
      portal of entry, without requiring the systemic accumulation that drives
      the chronic renal and skeletal arms. This is why acute cadmium poisoning
      presents as a lung disease while chronic poisoning does not.
    evidence:
    - reference: PMID:16933734
      reference_title: "Acute lung injury due to cadmium inhalation--a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Heavy metal inhalation is a rare cause of acute lung injury. Among the various heavy metals, cadmium is more commonly known to cause acute lung injury."
      explanation: >-
        Directly attributes acute lung injury to inhaled cadmium, the edge from
        the inhalational exposure to the pulmonary node.

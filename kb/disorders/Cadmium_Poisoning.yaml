- name: Zinc-Finger Displacement and DNA Repair Inhibition
  description: >-
    Cadmium is a weak direct mutagen; its genotoxicity is largely indirect and
    runs through the zinc-finger fold. Cd(2+) substitutes for the structural
    Zn(II) held tetrahedrally by cysteine thiolates and histidine imidazoles in
    zinc-finger domains, and cadmium-driven oxidative stress independently
    oxidises those thiolate donors. Because several DNA-repair proteins
    (nucleotide-excision and mismatch-repair components) are zinc-finger
    proteins, the displacement inhibits repair without altering the underlying
    gene sequence - a loss-of-function-like lesion imposed on the proteome
    rather than encoded in the genome. This node is the mechanistic bridge from
    the systemic cadmium burden to the carcinogenic arm, and is why cadmium
    behaves as a co-mutagen and repair inhibitor rather than as a classical
    DNA-adduct-forming carcinogen.
  conforms_to: "genome_instability_mutation#Failure of DNA Damage Surveillance and Repair"
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: zinc ion binding
    modifier: ABNORMAL
    term:
      id: GO:0008270
      label: zinc ion binding
  biological_processes:
  - preferred_term: DNA repair
    modifier: DECREASED
    term:
      id: GO:0006281
      label: DNA repair
  evidence:
  - reference: PMID:16310985
    reference_title: "Damage of zinc fingers in DNA repair proteins, a novel molecular mechanism in carcinogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "soluble compounds of definite carcinogenic metals and metalloids, such as arsenic, cadmium and nickel, and putative carcinogens, including cobalt and lead, inhibit zinc finger containing DNA repair proteins"
    explanation: >-
      Cell-culture and ex vivo work showing cadmium inhibits zinc-finger-containing
      DNA repair proteins, the molecular lesion this node models.
  - reference: PMID:16310985
    reference_title: "Damage of zinc fingers in DNA repair proteins, a novel molecular mechanism in carcinogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Zinc fingers can thus be compromised by a substitution of Zn(II) with another metal ion"
    explanation: >-
      States the substitution mechanism - a competing divalent cation replacing the
      structural Zn(II) - that makes cadmium a zinc-finger poison.
  - reference: PMID:38922068
    reference_title: "Cadmium Exposure: Mechanisms and Pathways of Toxicity and Implications for Human Health."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The epigenetic effects of Cd, including DNA methylation and histone modifications, are also explored to explain its long-term impact on gene expression and disease manifestation"
    explanation: >-
      Review situating cadmium's epigenetic dysregulation alongside the genotoxic
      arm as a second route to long-term altered gene expression. Evidence source
      is OTHER because this is a review article.
  downstream:
  - target: Cadmium-Associated Carcinogenesis
    description: >-
      Impaired repair fidelity allows damage from cadmium-driven oxidative stress
      and from co-exposures to persist and accumulate, the substrate for malignant
      transformation.
    evidence:
    - reference: PMID:16310985
      reference_title: "Damage of zinc fingers in DNA repair proteins, a novel molecular mechanism in carcinogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This reactivity can therefore be regarded as a novel molecular mechanism in carcinogenesis."
      explanation: >-
        The cited work draws exactly this edge: zinc-finger damage in DNA repair
        proteins as a mechanism of carcinogenesis.
- name: Cadmium-Associated Carcinogenesis
  description: >-
    Cadmium and its compounds have been classified by IARC as carcinogenic to
    humans (Group 1) since 1993, on the strength of excess lung cancer in
    occupationally exposed cohorts together with animal tumour data. The
    contemporary evidence base, reviewed across biological-sample studies,
    supports a causal role at the lung, pancreas and bladder, with total cancer
    risk and mortality correlating with measured cadmium body burden. Site
    attribution is deliberately not curated uniformly: the prostate association
    was not confirmed on cohort update, and breast and prostate evidence remains
    weak or inconclusive. Latency is that of chemical carcinogenesis - years to
    decades - which is why this arm is a feature of chronic rather than acute
    cadmium poisoning.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  - preferred_term: pancreas
    term:
      id: UBERON:0001264
      label: pancreas
  - preferred_term: urinary bladder
    term:
      id: UBERON:0001255
      label: urinary bladder
  evidence:
  - reference: PMID:12746140

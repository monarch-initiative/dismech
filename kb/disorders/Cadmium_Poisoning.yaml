    explanation: "Case report confirms initial good response to calcium and vitamin D in cadmium-induced osteomalacia."
- name: Supportive ICU Care
  description: >-
    For acute cadmium inhalation with pulmonary involvement, intensive care
    including mechanical ventilation for ARDS and continuous renal replacement
    therapy (CRRT) for concurrent renal failure may be required.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41000307
    reference_title: "Clinical characteristics, management, and outcomes of cadmium poisoning: a systematic review of case reports and case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For patients with concurrent lung and kidney involvement, mechanical ventilation and continuous renal replacement therapy (CRRT) may be required."
    explanation: "Systematic review confirms need for ICU-level care in severe acute cadmium poisoning."
- name: Exposure Cessation and Prevention
  description: >-
    Removal from cadmium exposure source is essential. Occupational hygiene
    measures include adequate ventilation, personal protective equipment, and
    workplace monitoring. Public health interventions include environmental
    remediation of contaminated soil and water, and regulatory limits on
    cadmium in food and consumer products.
  evidence:
  - reference: PMID:23800513
    reference_title: "Ailing bones and failing kidneys: a case of chronic cadmium toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, an early diagnosis and prevention of further exposure are important."
    explanation: "Emphasizes the importance of preventing further cadmium exposure given lack of effective treatment."
  - reference: PMID:31974582
    reference_title: "Hypophosphataemic osteomalacia due to cadmium exposure in the silver industry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "regulatory agencies and policy makers ought to survey the silver industry and ensure that the metals used are within permissible safe limits of exposure."
    explanation: "Calls for occupational regulation to prevent cadmium exposure in the silver industry."
classifications:
  harrisons_chapter:
  - classification_value: POISONING_ENVENOMATION
    notes: >-
      Cadmium poisoning is a heavy-metal intoxication and sits with the other
      metal poisonings. The renal and skeletal manifestations that dominate the
      chronic form are consequences of the intoxication, not a separate
      nosological home.
  - classification_value: ENVIRONMENTAL_EXPOSURES
    notes: >-
      Carried in parallel because the dominant global disease burden is chronic
      low-dose environmental and dietary exposure rather than acute poisoning
      events.
  ilo_agent_category:
  - classification_value: cadmium
    notes: >-
      ILO List of Occupational Diseases (revised 2010), item 1.1.2 "Diseases
      caused by cadmium or its compounds" - the chemical-agent item covering the
      non-malignant occupational disease (acute pneumonitis, chronic tubular
      nephropathy, osteomalacia).
  - classification_value: cancer_cadmium
    notes: >-
      ILO item 3.1.17 "Cancer caused by cadmium and its compounds". Recorded
      alongside item 1.1.2 rather than instead of it: the ILO list keeps
      occupational cancers in a separate section from the organ-system items, so
      a single agent with both malignant and non-malignant effects takes an item
      in each. This is the same orthogonality asbestos exhibits, not a
      contradiction.
  eu_occupational_category:
  - classification_value: cadmium_compounds
    notes: >-
      European schedule of occupational diseases (Commission Recommendation
      2003/670/EC as amended), Annex I item 105 "Cadmium or compounds thereof".
      The European schedule lists cadmium as a single chemical-agent item and
      does not split the malignant outcome into a separate entry the way the ILO
      list does.
genetic:
- name: SLC39A8
  gene_term:
    preferred_term: SLC39A8
    term:
      id: hgnc:20862
      label: SLC39A8
  relationship_type: SUSCEPTIBILITY
  association: >-
    ZIP8, a zinc/bicarbonate symporter expressed in the S3 segment of the renal
    proximal tubule, is one of the apical transporters through which cadmium
    enters tubular cells. It is a toxicokinetic determinant of how much filtered
    cadmium is reabsorbed rather than excreted, not a cause of the disease.
  notes: >-
    Cadmium poisoning is an acquired toxic disorder with no causal gene, so every
    entry in this section is a modifier of toxicokinetics or of detoxification
    capacity. The common A391T (rs13107325) variant reduces ZIP8 transport
    activity; its consequence for human cadmium handling specifically has not
    been measured, so no directional susceptibility claim is curated for it here.
  evidence:
  - reference: PMID:22534978
    reference_title: "Roles of ZIP8, ZIP14, and DMT1 in transport of cadmium and manganese in mouse kidney proximal tubule cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The knockdown of ZIP8, ZIP14 or DMT1 by siRNA transfection significantly reduced the uptake of Cd(2+) and Mn(2+) from the apical membrane."
    explanation: >-
      siRNA knockdown establishes ZIP8 as a functional route of apical cadmium
      uptake in proximal tubule cells; no single transporter dominates.
  - reference: PMID:22534978
    reference_title: "Roles of ZIP8, ZIP14, and DMT1 in transport of cadmium and manganese in mouse kidney proximal tubule cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ZIP8 and ZIP14 expressed in the S3 segment of proximal tubules play significant roles in the absorption of Cd(2+) and Mn(2+) in the kidney"
    explanation: >-
      Localises the transporter to the S3 segment, the nephron site where cadmium
      accumulates and where the proximal tubular injury of this disease begins.
  - reference: PMID:35784893
    reference_title: "The Allelic Variant A391T of Metal Ion Transporter ZIP8 (SLC39A8) Leads to Hypotension and Enhanced Insulin Resistance."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "the single-nucleotide polymorphism (SNP) variant A391T (rs13107325) is associated with numerous human traits"
    explanation: >-
      Establishes that a common functional variant of this transporter exists and
      is phenotypically consequential. PARTIAL because the traits studied are
      blood pressure and insulin resistance, not cadmium handling - the link to
      cadmium susceptibility is inferred from the transporter's role, not measured.
- name: SLC39A14
  gene_term:
    preferred_term: SLC39A14
    term:
      id: hgnc:20858
      label: SLC39A14
  relationship_type: SUSCEPTIBILITY
  association: >-
    ZIP14 acts alongside ZIP8 in the S3 segment of the proximal tubule as a route
    of apical cadmium uptake, contributing to renal cadmium accumulation.
  evidence:
  - reference: PMID:22534978
    reference_title: "Roles of ZIP8, ZIP14, and DMT1 in transport of cadmium and manganese in mouse kidney proximal tubule cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ZIP8 and ZIP14 expressed in the S3 segment of proximal tubules play significant roles in the absorption of Cd(2+) and Mn(2+) in the kidney"
    explanation: >-
      Directly assigns ZIP14 a significant role in renal cadmium absorption at the
      segment where cadmium concentrates.
- name: SLC11A2
  gene_term:
    preferred_term: SLC11A2
    term:
      id: hgnc:10908
      label: SLC11A2
  relationship_type: SUSCEPTIBILITY
  association: >-
    DMT1 is the iron-cadmium shared divalent metal transporter. It is the
    molecular basis of the best-documented gene-environment interaction in this
    disease: intestinal DMT1 is upregulated in iron deficiency, so iron-deplete
    individuals absorb more cadmium from an identical dietary dose. It also
    contributes to apical cadmium uptake in the renal proximal tubule.
  evidence:
  - reference: PMID:22534978
    reference_title: "Roles of ZIP8, ZIP14, and DMT1 in transport of cadmium and manganese in mouse kidney proximal tubule cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The knockdown of ZIP8, ZIP14 or DMT1 by siRNA transfection significantly reduced the uptake of Cd(2+) and Mn(2+) from the apical membrane."
    explanation: >-
      Establishes DMT1 as a functional cadmium uptake route in proximal tubule
      cells, complementing its better-known intestinal role.
  - reference: PMID:20204475
    reference_title: "Catch me if you can! Novel aspects of cadmium transport in mammalian cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "uptake of free Cd(2+) has been demonstrated for the Fe(2+)/H(+) cotransporter divalent metal transporter 1."
    explanation: >-
      Identifies DMT1 as the iron cotransporter that also carries free cadmium,
      the shared-route mechanism behind the iron-deficiency interaction.
- name: MT1A
  gene_term:
    preferred_term: MT1A
    term:
      id: hgnc:7393
      label: MT1A
  relationship_type: MODIFIER
  association: >-
    Metallothionein sequesters cadmium as the relatively inert Cd-metallothionein
    complex and is the body's principal endogenous defence against free Cd(2+).
    Individual differences in inducible metallothionein capacity set where the
    balance falls between safe storage and free-ion toxicity at a given body
    burden.
  notes: >-
    Curated as a MODIFIER rather than a SUSCEPTIBILITY locus because the cited
    evidence documents inter-individual variation in metallothionein level at a
    given renal cadmium burden; specific MT1A/MT2A promoter variants and their
    effect sizes are not established in the cited source. MT2A is curated
    separately.
  evidence:
  - reference: PMID:19834257
    reference_title: "Individual susceptibility to cadmium toxicity and metallothionein gene polymorphisms: with references to current status of occupational cadmium exposure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cadmium accumulates in the renal cortex by the long-term exposure along with increased concentrations of metallothionein, an important protein for protection from cadmium toxicity."
    explanation: >-
      States metallothionein's protective role and its co-accumulation with
      cadmium in the renal cortex, the target organ of chronic toxicity.
  - reference: PMID:19834257
    reference_title: "Individual susceptibility to cadmium toxicity and metallothionein gene polymorphisms: with references to current status of occupational cadmium exposure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "some individuals have lower metallothionein levels despite increased cadmium accumulation in the kidneys"
    explanation: >-
      Documents the inter-individual variation in metallothionein response that
      makes this a susceptibility modifier rather than a uniform protective factor.

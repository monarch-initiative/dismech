    explanation: "Documents reduced bone density in a cadmium-exposed patient. Marked PARTIAL: the same patient had nephropathy, so this single clinical observation cannot separate a direct bone-cell effect from the renal phosphate-wasting route, and cannot support the independence claim."
  downstream:
  - target: Defective Bone Mineralization

    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Tobacco plants concentrate cadmium from soil, so smoking is an
      inhalational cadmium source and the dominant non-occupational one. Note
      the cited sentence establishes smoking as a recognized risk factor for
      cadmium poisoning; it does not itself measure the absorbed dose.

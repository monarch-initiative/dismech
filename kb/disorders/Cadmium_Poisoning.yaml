    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cadmium (Cd) and its compounds were classified as \"carcinogenic to humans (Group 1)\" by IARC in 1993"
    explanation: >-
      Establishes the IARC Group 1 classification and its basis in cadmium-exposed
      worker cohorts.
  - reference: PMID:38480109
    reference_title: "Cadmium in biological samples and site-specific cancer risk and mortality: A systematic review of original articles and meta-analyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Current data consistently suggest a causal role of exposure to cadmium in pancreas, lung, and bladder carcinogenesis."
    explanation: >-
      Systematic review of 9 meta-analyses and 57 original articles giving the
      sites where a causal role is currently supported.
  - reference: PMID:12746140
    reference_title: "Cadmium, lung and prostate cancer: a systematic review of recent epidemiological data."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The association between cadmium exposure and prostate cancer was not confirmed in the latest available updates."
    explanation: >-
      Carried as a qualification, not a refutation of the node: the same review that
      establishes the Group 1 classification withdraws support for the prostate site
      specifically, which is why site attribution here is not uniform.
  downstream:

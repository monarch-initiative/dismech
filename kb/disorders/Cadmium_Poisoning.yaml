discussions:
- discussion_id: gap_cadmium_direct_osteoblast_toxicity
  prompt: >-
    Does cadmium impair osteoblast function and promote osteoclastic resorption
    directly, independently of the renal phosphate wasting that drives
    cadmium osteomalacia?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Proposed Direct Bone-Cell Toxicity
  rationale: >-
    Cadmium-exposed patients who develop bone disease characteristically also
    have proximal tubular injury with phosphate wasting, so clinical
    observations of reduced bone density cannot separate a direct bone-cell
    effect from the established renal route. No osteoblast-culture or animal
    skeletal evidence is currently curated in this entry, so the direct arm is
    recorded as an unresolved mechanism rather than an asserted one.
  proposed_experiments:
  - experiment_id: exp_cadmium_osteoblast_direct_toxicity
    name: Osteoblast and osteoclast culture under cadmium exposure
    description: >-
      Expose primary or iPSC-derived osteoblasts and osteoclasts to cadmium at
      concentrations achievable in bone, reading out osteoblast differentiation
      markers, alkaline phosphatase activity, mineralization, and RANKL/OPG
      balance, to establish whether cadmium acts on bone cells directly.
  - experiment_id: exp_cadmium_bone_loss_independent_of_renal_route
    name: Skeletal outcomes with and without renal phosphate wasting
    description: >-
      Compare skeletal outcomes in cadmium-exposed animals with and without
      established renal tubular phosphate wasting, testing whether bone loss
      still occurs when the renal route is absent or corrected. This is the
      experiment that would settle the independence claim.
  evidence:
  - reference: PMID:18072106
    reference_title: "Cadmium exposure: health hazards of silver cottage industry in developing countries."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We will present a case of cadmium induced peripheral neuropathy, nephropathy, and decreased bone density."
    explanation: >-
      The available human observation couples reduced bone density with
      nephropathy in the same patient, which is exactly why the question of a
      direct-versus-renal route remains open.

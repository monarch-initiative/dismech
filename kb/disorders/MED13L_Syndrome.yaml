      severe phenotypes, including epilepsy and severe motor impairment, whereas
      p.Gly1899Arg and p.Thr2162Met were associated with milder manifestations.
    explanation: Assigns the severe clinical correlate to this exon-15 allele.
  - reference: PMID:36798993
    reference_title: "MED13L and its disease-associated variants influence the dendritic development of cerebral cortical neurons in the mammalian brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      There, we found that overexpression of the p.P866L variant resulted in reduced
      number and length of dendrites of cortical layer II/III pyramidal neurons.
    explanation: In vivo neuronal readout of the variant's functional consequence.
- name: MED13L c.2605C>T (p.Pro869Ser)
  description: >-

      accumulated in the nucleus, while the p.S2163L and p.S2177Y variants were
      diffusely distributed in the cytoplasm.
    explanation: >-
      In vivo demonstration that disease-associated missense alleles differ in
      subcellular behaviour, supporting allele-specific mechanisms.
  downstream:
  - target: Neurodevelopmental transcriptional dysregulation
    description: >-
      Destabilised or mislocalised MED13L fails to support CKM-gated neurodevelopmental
      transcription.
- name: Neurodevelopmental transcriptional dysregulation
  biological_scale: CELLULAR
  description: >
    Reduced or dysfunctional MED13L dysregulates RNA polymerase II-dependent
    neurodevelopmental gene programs. Mechanistically, MED13L acts by priming
    transcriptional activation of key cortical developmental genes (including Neurod2,
    Sox5, Auts2 and Nfib), a priming step mediated by MED13L binding to core Mediator
    that licenses the complex to associate with RNA Pol II. Loss impairs neural
    progenitor differentiation and cortical neurogenesis, and reduces dendritic
    number and length in cortical pyramidal neurons — the cellular substrate for
    intellectual disability, motor speech impairment, and hypotonia.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:

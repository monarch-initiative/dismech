    reference_title: "MED13L Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dysmorphic facial features, including depressed nasal bridge, bulbous nose, and hypotonic open mouth, are present in most individuals."
    explanation: GeneReviews documents the characteristic facial gestalt attributable to craniofacial developmental dysregulation.
  downstream:
  - target: Distinctive facial dysmorphism
    description: Disrupted craniofacial (neural-crest) developmental programs produce the recognizable MED13L facial gestalt.
  - target: Hearing impairment
    description: Disrupted otic developmental programs contribute to hearing impairment in a subset of patients.

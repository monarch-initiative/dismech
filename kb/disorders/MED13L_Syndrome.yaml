animal_models:
- species: Mus musculus
  genotype: Med13l heterozygous germline deletion (exon 11)
  description: >-
    Heterozygous Med13l mice are smaller than wild-type littermates and over 60% show
    craniofacial anomalies (pug snout with midface hypoplasia, or crooked snout), plus
    discontinuous squamosal sutures in a subset. They recapitulate the growth delay and
    craniofacial arm of the human syndrome, and notably do not show a significant
    cardiac functional defect — consistent with the reduced cardiac penetrance now
    recognised in patients.
  genes:
  - preferred_term: MED13L
    term:
      id: hgnc:22962
      label: MED13L
  associated_phenotypes:
  - Growth delay
  - Midface hypoplasia
  evidence:
  - reference: PMID:40919805
    reference_title: "Heterozygous Med13l mice recapitulate a developmental growth delay and craniofacial anomalies seen in MED13L syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We observed Med13l HET mice are smaller than wildtype (WT) littermates, and over
      60% of them exhibited one of two craniofacial anomalies: a pug snout with midface
      hypoplasia or a crooked snout.
    explanation: Quantifies the growth and craniofacial phenotype of the heterozygous model.
  - reference: PMID:40919805
    reference_title: "Heterozygous Med13l mice recapitulate a developmental growth delay and craniofacial anomalies seen in MED13L syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Med13l HET mice represent a novel research tool for MED13L syndrome.
    explanation: Positions the model as a preclinical research tool for the disorder.
- species: Mus musculus
  genotype: Med13l homozygous and heterozygous knockout
  description: >-
    A dosage series: homozygous Med13l knockout causes neonatal lethality with reduced
    brain volume and cortical thickness, while heterozygous mice are viable and display
    impaired learning and memory, reduced motor coordination, heightened anxiety and
    microcephaly with simplified cortical neuronal morphology. Single-cell
    transcriptomics localises the defect to impaired neural progenitor differentiation.
  genes:
  - preferred_term: MED13L
    term:
      id: hgnc:22962
      label: MED13L
  associated_phenotypes:
  - Microcephaly
  - Impaired learning and memory
  - Reduced motor coordination
  evidence:
  - reference: PMID:40775066
    reference_title: "Regulation of cortical neurogenesis by MED13L via transcriptional priming and its implications for MED13L syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additionally, heterozygous mice show microcephaly with simplified neuronal
      morphology in the motor cortex.
    explanation: >-
      Documents the neuroanatomical phenotype of the heterozygous model, including in
      motor cortex, the region relevant to the human motor-speech phenotype.
  - reference: PMID:40775066
    reference_title: "Regulation of cortical neurogenesis by MED13L via transcriptional priming and its implications for MED13L syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Single-cell transcriptomics and immunofluorescence reveal severe cortical
      neurogenesis deficits in Med13l knockout embryos, driven by impaired neural
      progenitor differentiation.
    explanation: Identifies the cellular locus of the neurodevelopmental defect.
- species: Danio rerio
  genotype: med13b morpholino knockdown (morphant)
  description: >-
    Knockdown of the zebrafish MED13L orthologue med13b produces defective cranial
    neural crest cell migration with downstream cartilage deformities and abnormal
    distribution of developing neurons; the neuronal phenotype is rescued by full-length
    human MED13L mRNA, establishing specificity.
  genes:
  - preferred_term: MED13L
    term:
      id: hgnc:22962
      label: MED13L
  associated_phenotypes:
  - Craniofacial cartilage deformity
  - Defective cranial neural crest migration
  evidence:
  - reference: PMID:25137640
    reference_title: "Impaired development of neural-crest cell-derived organs and intellectual disability caused by MED13L haploinsufficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Knockdown of MED13L orthologue in zebrafish, med13b, showed early defective
      migration of cranial neural crest cells (NCCs) that contributed to cartilage
      structure deformities in the later stage, recapitulating craniofacial anomalies
      seen in human patients.
    explanation: Links MED13L loss to the neural crest migration defect.
  - reference: PMID:25137640
    reference_title: "Impaired development of neural-crest cell-derived organs and intellectual disability caused by MED13L haploinsufficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, we observed abnormal distribution of developing neurons in different
      brain regions of med13b morphant embryos, which could be rescued upon introduction
      of full-length human MED13L mRNA.
    explanation: >-
      Cross-species rescue with human MED13L mRNA establishes that the phenotype is
      MED13L-specific rather than an off-target morpholino effect.
experimental_models:
- name: MED13L patient-derived skin fibroblasts
  description: >-
    Fibroblasts from an individual carrying the MED13L S1497F/fs allele, used as the
    readout system for cyclin C subcellular localisation, mitochondrial morphology,
    respiration, mtDNA copy number and oxidative-stress sensitivity. The system
    supports pharmacological rescue and is therefore the closest thing MED13L syndrome
    currently has to a drug-screening assay.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens

- name: MED13L heterozygous pathogenic variants
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: MED13L
    term:
      id: hgnc:22962
      label: MED13L
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    expressivity: VARIABLE
    description: >-
      Missense-variant carriers, particularly at the exon 15-17 hotspot, show a more
      severe phenotype with more frequent epilepsy and cardiac defects than carriers
      of premature-truncating variants.
    evidence:
    - reference: PMID:40228085
      reference_title: "MED13L Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        MED13L syndrome is an autosomal dominant disorder.
      explanation: Confirms the mode of inheritance.
    - reference: PMID:40389839
      reference_title: "Contribution of families using the GenIDA database to the description of MED13L syndrome and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A comprehensive review of published cases showed that patients with missense
        variants have more severe impairments, including increased cardiac defects,
        global developmental delay, and a higher incidence of epilepsy, than patients
        with premature truncated variants.
      explanation: >-
        Documents variant-class-dependent expressivity across the pooled published
        literature.
  features: >
    MED13L syndrome is caused by heterozygous pathogenic variants in MED13L
    (12q24.21). The great majority arise de novo. The allelic spectrum spans
    whole-gene and intragenic deletions and duplications, frameshift, nonsense and
    canonical-splice variants (all acting through haploinsufficiency) and missense
    variants clustering in two hotspots at exons 15-17 and 25-31. Missense carriers
    are systematically more severely affected. Rare recurrence in siblings is
    explained by parental gonadal/germinal mosaicism, which has been documented
    directly in sperm and is the reason prenatal or preimplantation testing is offered
    despite the predominance of de novo events.
  evidence:
  - reference: PMID:40228085
    reference_title: "MED13L Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of probands reported to date whose parents have undergone molecular
      genetic testing have the disorder as the result of a pathogenic variant that
      occurred as a de novo event in the proband.
    explanation: Establishes de novo predominance.
  - reference: PMID:40228085
    reference_title: "MED13L Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rarely, individuals diagnosed with MED13L syndrome have the disorder as the
      result of a pathogenic variant inherited from a mosaic, apparently unaffected
      parent.
    explanation: >-
      Documents parental mosaicism as the recurrence mechanism, the basis for the
      recurrence-risk counselling below.
  - reference: PMID:34654706
    reference_title: "MED13L-related intellectual disability due to paternal germinal mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now present the first case of paternal germinal mosaicism for a missense
      MED13L variant causing MRFACD syndrome in one of the father's children and being
      the likely cause of intellectual disability and facial dysmorphism in the other.
    explanation: >-
      First direct demonstration of paternal germinal mosaicism, converting a
      theoretical recurrence risk into a documented one.
  - reference: PMID:34654706
    reference_title: "MED13L-related intellectual disability due to paternal germinal mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      De novo disruption of the MED13L gene by deletions, duplications, or sequence
      variants has been identified as deleterious.
    explanation: Summarises the breadth of the pathogenic allelic spectrum.
  - reference: PMID:29511999
    reference_title: "MED13L-related intellectual disability: involvement of missense variants and delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified seven de novo missense variations, in addition to

- name: MED13L missense destabilisation and mislocalisation
  biological_scale: MOLECULAR
  description: >
    Pathogenic missense variants cluster in two hotspots (exons 15-17 and 25-31).
    Functional characterisation shows they reduce MED13L protein stability, several
    mislocalise the protein to the cytoplasm, and 3D modelling predicts disrupted
    contact with the CDK8 kinase module. Most therefore behave as loss-of-function.
    The exon-15 alleles p.Pro866Leu and p.Pro869Ser stand out clinically, correlating
    with epilepsy and severe motor impairment, and p.Pro869Ser retains relatively
    stable, partly nuclear expression — the basis for the contested non-dosage
    mechanism captured in `med13l_missense_non_haploinsufficient`.

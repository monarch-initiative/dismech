    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features suggesting a neurocristopathy may be explained by animal
      model studies indicating involvement of the Mediator complex subunit 13 in
      neural crest induction.
    explanation: >-
      Records the clinical inference of a neurocristopathy that the zebrafish work

inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >
    MED13L syndrome is autosomal dominant with variable expressivity: variant class
    stratifies severity, and missense carriers, especially at the exon 15-17 hotspot,
    have more epilepsy, more cardiac defects and more severe global developmental
    delay than carriers of premature-truncating variants.
    Most probands carry a de novo variant;
    recurrence in siblings of unaffected parents is explained by parental gonadal or
    germinal mosaicism, documented directly at ~30-50% of sperm cells in one family.
    Recurrence risk counselling therefore cannot simply quote a de novo population
    baseline.
  evidence:
  - reference: PMID:40228085
    reference_title: "MED13L Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MED13L syndrome is an autosomal dominant disorder.
    explanation: Confirms the inheritance mode.
  - reference: PMID:40389839
    reference_title: "Contribution of families using the GenIDA database to the description of MED13L syndrome and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A comprehensive review of published cases showed that patients with missense
      variants have more severe impairments, including increased cardiac defects,
      global developmental delay, and a higher incidence of epilepsy, than patients
      with premature truncated variants.
    explanation: Supports the variable-expressivity statement with a variant-class axis.
diagnosis:
- name: Clinical whole-exome or genome sequencing
  description: >
    The diagnosis is established by identifying a heterozygous pathogenic MED13L
    variant. Sequencing is the primary route because most pathogenic alleles are
    single-nucleotide or small indel variants invisible to microarray, and because the
    facial gestalt overlaps several other syndromic ID entities. Trio testing
    establishes de novo status, which carries pathogenicity weight.
  diagnosis_term:
    preferred_term: clinical whole-exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: Heterozygous pathogenic or likely pathogenic MED13L variant
  markers: MED13L
  evidence:
  - reference: PMID:40228085
    reference_title: "MED13L Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of MED13L syndrome is established in a proband with a heterozygous
      pathogenic variant in MED13L identified by molecular genetic testing.
    explanation: States the diagnostic criterion.
  - reference: PMID:34211152
    reference_title: "Exome and genome sequencing for pediatric patients with congenital anomalies or intellectual disability: an evidence-based clinical guideline of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We strongly recommend that ES/GS be considered as a first- or second-tier test
      for patients with CA/DD/ID.
    explanation: >-
      Places exome/genome sequencing in the recommended diagnostic pathway for the
      clinical presentation MED13L patients arrive with.
- name: Chromosomal microarray analysis
  description: >
    Chromosomal microarray remains a first-tier test for unexplained developmental
    delay and detects the intragenic and whole-gene 12q24.21 deletions and duplications
    that account for a minority of MED13L cases. It is normal in most MED13L patients,
    so a normal microarray does not exclude the diagnosis and should prompt sequencing.
  diagnosis_term:
    preferred_term: chromosomal microarray testing
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  results: >-
    Normal in most; detects 12q24.21 intragenic or whole-gene MED13L deletions and
    duplications in the CNV subset
  markers: 12q24.21
  evidence:
  - reference: PMID:23403903
    reference_title: "Dosage changes of MED13L further delineate its role in congenital heart defects and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using high resolution molecular karyotyping, we identified two intragenic de novo
      frameshift deletions, likely resulting in haploinsufficiency, in two patients with
      a similar phenotype of hypotonia, moderate ID, conotruncal heart defect and facial
      anomalies.
    explanation: Demonstrates the CNV detection route to a MED13L diagnosis.
  - reference: PMID:20466091
    reference_title: "Consensus statement: chromosomal microarray is a first-tier clinical diagnostic test for individuals with developmental disabilities or congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Available evidence strongly supports the use of CMA in place of G-banded
      karyotyping as the first-tier cytogenetic diagnostic test for patients with
      DD/ID, ASD, or MCA.
    explanation: >-
      Establishes microarray's first-tier position in the diagnostic pathway that
      precedes MED13L sequencing.
- name: Echocardiography
  description: >
    Baseline echocardiography at diagnosis. Because congenital heart defects occur in a
    minority rather than the majority, this is calibrated as a one-time baseline screen
    with cardiology follow-up only if abnormal, not as intensive surveillance.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  results: >-
    Normal in the majority; detects conotruncal defects, ventricular septal defect or
    persistent foramen ovale in the affected minority
  evidence:
  - reference: PMID:29511999
    reference_title: "MED13L-related intellectual disability: involvement of missense variants and delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypotonia, ataxia, and recognizable facial gestalt were frequent findings, but
      not congenital heart defects.
    explanation: >-
      Supports calibrating cardiac assessment as a baseline screen rather than
      intensive surveillance.
  - reference: PMID:29046205
    reference_title: "[Clinical phenotype and genetic analysis of MED13L syndrome]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "echocardiography showed ventricular septal defect"
    explanation: Illustrates the lesion type detected when echocardiography is abnormal.
- name: Electroencephalography
  description: >
    EEG on clinical suspicion of seizures, with a lower threshold in carriers of
    exon 15-17 missense variants given their markedly higher epilepsy frequency.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  results: Epileptiform abnormalities, which may be present without clinical seizures
  evidence:
  - reference: PMID:32646507
    reference_title: "Report of a de novo c.2605C > T (p.Pro869Ser) change in the MED13L gene and review of the literature for MED13L-related intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of these patients, 44.4% had epileptic seizures.
    explanation: >-
      Quantifies the seizure burden in the missense subset that justifies a lower EEG
      threshold in those carriers.
  - reference: PMID:29511999
    reference_title: "MED13L-related intellectual disability: involvement of missense variants and delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that patients carrying missense mutations had more frequently epilepsy
      and showed a more severe phenotype.
    explanation: Supports genotype-stratified epilepsy surveillance.
differential_diagnoses:
- name: MED13-related intellectual developmental disorder (MRD61)
  description: >-
    The paralogous CKM-hinge disorder. Both are autosomal dominant CDK8-kinase-module
    disorders with intellectual disability and prominent speech impairment, and the
    two proteins occupy the same structural position in the module.
  distinguishing_features:
  - MED13L has a recognisable facial gestalt and a far larger reported cohort (~100 vs ~26 cases).
  - MED13 carries ophthalmologic features not reported in MED13L, notably Duane anomaly.
  - MED13L syndrome is defined by a motor speech disorder; MED13 is described as producing a language-dominant phenotype.
  disease_term:
    preferred_term: Intellectual developmental disorder 61
    term:
      id: MONDO:0032485
      label: intellectual developmental disorder 61
  evidence:
  - reference: PMID:29740699
    reference_title: "De novo mutations in MED13, a component of the Mediator complex, are associated with a novel neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in several other genes encoding subunits of Mediator have been
      previously shown to associate with DD/ID, including MED13L, a paralog of MED13.
    explanation: >-
      Establishes MED13 and MED13L as paralogous disease genes within the same module,
      the basis for their mutual differential-diagnosis relationship.
- name: MED12-related intellectual disability syndrome
  description: >-
    The X-linked member of the CDK8 kinase module allelic series (FG/Opitz-Kaveggia,
    Lujan-Fryns, Ohdo-Maat-Kievit-Brunner), sharing intellectual disability and
    hypotonia with MED13L syndrome.
  distinguishing_features:
  - X-linked inheritance with predominantly affected males, versus autosomal dominant de novo events in MED13L.
  - Distinct facial and behavioural profiles across the MED12 allelic series.
  disease_term:
    preferred_term: MED12-related intellectual disability syndrome
    term:
      id: MONDO:0100000
      label: MED12-related intellectual disability syndrome
  evidence:
  - reference: PMID:30905399
    reference_title: "De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in MED12, MED13, and MED13L were previously identified in syndromic
      developmental disorders with overlapping phenotypes.
    explanation: >-
      States the phenotypic overlap between the MED12, MED13 and MED13L disorders that
      makes MED12-related intellectual disability a differential for MED13L syndrome.
- name: Chromosome 1p36 deletion syndrome
  description: >-
    A recurrent microdeletion syndrome that overlaps MED13L syndrome in facial gestalt,
    particularly straight/horizontal eyebrows, deep-set eyes and midface hypoplasia,
    and in the combination of intellectual disability with congenital heart disease.
  distinguishing_features:
  - 1p36 deletion is detectable on chromosomal microarray, whereas most MED13L variants are not.
  - Overlapping facial features prompted the explicit recommendation to consider MED13L when 1p36 testing is negative.
  disease_term:
    preferred_term: chromosome 1p36 deletion syndrome
    term:
      id: MONDO:0011929
      label: chromosome 1p36 deletion syndrome
  evidence:
  - reference: PMID:25712080
    reference_title: "Novel de novo heterozygous loss-of-function variants in MED13L and further delineation of the MED13L haploinsufficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haploinsufficiency for MED13L should be considered in the differential diagnosis
      of the 1p36 microdeletion syndrome, due to overlapping dysmorphic facial features
      in some patients.
    explanation: >-
      Direct recommendation to place MED13L in the 1p36 differential on facial-gestalt
      grounds.
- name: Kleefstra syndrome
  description: >-
    EHMT1-related syndromic intellectual disability whose facial gestalt has been
    explicitly noted to resemble that of individual MED13L patients.
  distinguishing_features:
  - Resolved by identifying an EHMT1 variant or 9q34.3 deletion on molecular testing.
  disease_term:
    preferred_term: Kleefstra syndrome
    term:
      id: MONDO:0012455
      label: Kleefstra syndrome
  evidence:
  - reference: PMID:28645799
    reference_title: "Genotype-phenotype evaluation of MED13L defects in the light of a novel truncating and a recurrent missense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first patient indicates some facial resemblance to Kleefstra syndrome as a
      novel differential diagnosis, and the second patient shows, for the first time,
      recurrence of a MED13L missense mutation (p.(Asp860Gly)).
    explanation: >-
      Introduces Kleefstra syndrome as a MED13L differential on the basis of facial
      resemblance.
- name: 22q11.2 deletion syndrome
  description: >-
    Shares the combination of intellectual disability with conotruncal congenital heart
    disease, and the more common MED13L facial gestalt has been noted to resemble it.
  distinguishing_features:
  - 22q11.2 deletion adds palatal anomalies, hypocalcaemia and immune deficiency, none of which are MED13L features.
  - The deletion is detectable on chromosomal microarray.
  disease_term:
    preferred_term: 22q11.2 deletion syndrome
    term:
      id: MONDO:0018923
      label: 22q11.2 deletion syndrome
  evidence:
  - reference: PMID:28645799
    reference_title: "Genotype-phenotype evaluation of MED13L defects in the light of a novel truncating and a recurrent missense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The latter are especially important in the differential diagnosis of 1p36 deletion
      and Kleefstra syndromes, while the more common facial gestalt shows some
      resemblance to 22q11.2 deletion syndrome.
    explanation: >-
      Places 22q11.2 deletion syndrome in the MED13L facial differential alongside 1p36
      and Kleefstra.
- name: Cornelia de Lange syndrome
  description: >-
    MED13L variants have been recovered from cohorts clinically suspected of Cornelia
    de Lange syndrome but negative for cohesin-pathway genes, so MED13L belongs in the
    CdLS-like differential.
  distinguishing_features:
  - Classic CdLS features (synophrys, limb reduction defects, prenatal growth restriction) are not core MED13L features.
  - Resolved by identifying NIPBL or another cohesin-pathway variant.
  disease_term:
    preferred_term: Cornelia de Lange syndrome
    term:
      id: MONDO:0016033
      label: Cornelia de Lange syndrome
  evidence:
  - reference: PMID:31337854
    reference_title: "Comprehensive genetic analysis of 57 families with clinically suspected Cornelia de Lange syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systematic clinical evaluation of all patients using a recently proposed clinical
      scoring system showed that ZMYND11, MED13L, and PHIP abnormality may cause CdLS or
      CdLS-like.
    explanation: >-
      Demonstrates MED13L variants being ascertained through a CdLS-suspected cohort,
      establishing the differential empirically.
treatments:
- name: Speech and Language Therapy
  description: >
    The highest-priority developmental intervention. Because the MED13L speech
    phenotype is specifically a motor speech disorder (apraxia and/or dysarthria)
    rather than a nonspecific delay, assessment should screen explicitly for apraxia so
    that motor-speech techniques and, for minimally verbal or nonverbal children,
    augmentative and alternative communication are introduced early.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: Speech apraxia
    term:
      id: HP:0011098
      label: Speech apraxia
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:40993520
    reference_title: "MED13L-related disorder characterized by severe motor speech impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children would benefit from early referrals to speech therapy to assess their
      speech, language, and support needs.
    explanation: >-
      Direct recommendation from the deep-phenotyping study that established the motor
      speech phenotype.
  - reference: PMID:40993520
    reference_title: "MED13L-related disorder characterized by severe motor speech impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals who completed in-person articulation testing met diagnostic
      criteria for speech apraxia, dysarthria, or both.
    explanation: >-
      Justifies apraxia/dysarthria-specific assessment rather than generic language
      therapy.
- name: Physical Therapy
  description: >
    Physiotherapy from infancy for hypotonia, motor delay and the coordination and
    balance problems associated with ataxia and, in some children, vestibular weakness.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Generalized hypotonia
    term:
      id: HP:0001290
      label: Generalized hypotonia
  - preferred_term: Motor delay
    term:
      id: HP:0001270
      label: Motor delay
  evidence:
  - reference: PMID:40228085
    reference_title: "MED13L Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      assessment of mobility and self-help skills at each visit
    explanation: >-
      GeneReviews surveillance guidance establishes ongoing motor assessment as
      standard care, the trigger for physiotherapy input.
- name: Occupational Therapy
  description: >
    Occupational therapy as part of the multidisciplinary developmental package,
    targeting self-help skills and the significant visual-motor integration deficits
    demonstrated on standardized testing.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  evidence:
  - reference: PMID:40993520
    reference_title: "MED13L-related disorder characterized by severe motor speech impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Those who were able to complete motor testing demonstrated significant deficits
      in visual motor integration (mean 57.08, SD 9.26).
    explanation: >-
      Quantifies the visual-motor integration deficit that occupational therapy
      addresses.
- name: Ophthalmologic Surveillance
  description: >
    Baseline ophthalmologic evaluation at diagnosis with periodic review for changes in
    visual acuity and strabismus, with refractive correction and strabismus treatment per
    ophthalmologist when abnormalities are found. Registry data showing 72-76% visual
    involvement make this a higher-yield surveillance target than earlier clinic-based
    reports implied.
  action_category: MONITORING
  treatment_term:
    preferred_term: vision assessment
    term:
      id: NCIT:C156778
      label: Vision Assessment
  evidence:
  - reference: PMID:40228085
    reference_title: "MED13L Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      assess for changes in visual acuity and strabismus per treating ophthalmologist
    explanation: GeneReviews surveillance recommendation for ocular manifestations.
  - reference: PMID:40389839
    reference_title: "Contribution of families using the GenIDA database to the description of MED13L syndrome and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The GenIDA series identified a higher prevalence of visual impairment (76%) and
      highlighted under-recognized musculoskeletal issues, such as foot deformities,
      which had previously received little attention.
    explanation: >-
      Quantifies the burden that justifies routine rather than symptom-triggered
      ophthalmologic review.
- name: Audiologic and Vestibular Surveillance
  description: >
    Annual audiology evaluation, extended — on the strength of the first objective
    vestibulometry performed in this disorder — to comprehensive audiovestibular
    assessment, since vestibular weakness had never previously been looked for and was
    found.
  action_category: MONITORING
  treatment_term:
    preferred_term: hearing examination
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:40228085
    reference_title: "MED13L Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      audiology evaluation annually or as needed

- name: MED13L c.2597C>T (p.Pro866Leu)
  description: >-
    Recurrent exon-15 hotspot missense allele. Functionally characterised as
    destabilising with cytoplasmic mislocalisation, consistent with loss of function,
    and clinically associated with a severe phenotype including epilepsy and severe
    motor impairment. In mouse cortical neurons the orthologous variant reduces the
    number and length of dendrites.
  clinical_significance: PATHOGENIC
  type: missense

  - reference: PMID:40500968
    reference_title: "MED13L pathogenic missense variants impair protein stability and interaction, underlying diverse clinical outcomes."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      3D protein modeling suggested that these missense variants may disrupt MED13L's
      interaction with the CDK8 kinase module, leading to functional deficits.
    explanation: >-
      Provides the structural rationale linking missense position to impaired CKM
      assembly.
  - reference: PMID:29511999
    reference_title: "MED13L-related intellectual disability: involvement of missense variants and delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Missense variants clustered in two mutation hot-spots, i.e., exons 15-17 and

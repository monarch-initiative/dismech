- name: Cyclin C nuclear release and mitochondrial dysfunction
  biological_scale: CELLULAR
  description: >
    Cyclin C is retained in the nucleus by the MED13L-anchored CKM. When MED13L is
    lost, cyclin C is aberrantly released to the cytoplasm even in unstressed cells,
    where its CKM-independent activity drives mitochondrial fission. Patient
    fibroblasts carrying a MED13L frameshift allele show mitochondrial fragmentation,
    a six-fold reduction in respiration, reduced mtDNA copy number and hypersensitivity
    to oxidative stress. This is a candidate secondary, bioenergetic arm of the
    disease; it has been demonstrated in fibroblasts, not neurons.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: mitochondrial fission
    term:
      id: GO:0000266
      label: mitochondrial fission
    modifier: INCREASED
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:35198885
    reference_title: "Aberrant cyclin C nuclear release induces mitochondrial fragmentation and dysfunction in MED13L syndrome fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, the fibroblasts exhibited reduced mtDNA copy number, reduction in
      mitochondrial membrane integrity, and hypersensitivity to oxidative stress.
    explanation: >-
      Characterises the mitochondrial phenotype of MED13L-mutant patient cells beyond
      morphology alone.
  - reference: PMID:35198885
    reference_title: "Aberrant cyclin C nuclear release induces mitochondrial fragmentation and dysfunction in MED13L syndrome fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In conclusion, this study found that mitochondrial dysfunction is an underlying
      defect in cells harboring the MED13L S1497 F/fs allele and identified cyclin C
      mis-localization as the likely cause.
    explanation: Attributes the mitochondrial defect specifically to cyclin C mislocalisation.
  downstream:
  - target: Intellectual disability
    description: >-
      A bioenergetic contribution to the cognitive phenotype, predicted if the cyclin C
      release demonstrated in patient fibroblasts also occurs in neurons. Flagged as
      inference: no neuronal data exist.
  - target: Generalized hypotonia
    description: >-
      Reduced oxidative capacity is a plausible contributor to the near-universal
      hypotonia, on the same fibroblast-to-muscle inference as above.
  notes: >-
    Demonstrated in a single patient fibroblast line. Retained as a mechanism node
    rather than folded into the haploinsufficiency node because it is the one MED13L
    mechanism with a pharmacological rescue already shown in patient-derived cells.
    The two downstream edges are explicitly inferential — the cyclin C release is shown
    in fibroblasts, not in neurons or muscle.

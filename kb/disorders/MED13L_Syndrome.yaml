genetic:
- name: MED13L heterozygous pathogenic variants (haploinsufficiency)
  association: Causative
  gene_term:
    preferred_term: MED13L
    term:
      id: hgnc:22962
      label: MED13L
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:40228085
      reference_title: "MED13L Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The majority of probands reported to date whose parents have undergone molecular genetic testing have the disorder as the result of a pathogenic variant that occurred as a de novo event in the proband."
      explanation: Heterozygous, mostly de novo MED13L variants are consistent with autosomal dominant inheritance.
  features: >
    MED13L syndrome is caused by heterozygous pathogenic variants in MED13L, most arising
    de novo. The variant spectrum includes loss-of-function alleles (frameshift, nonsense,
    splice-site, intragenic and whole-gene deletions) causing haploinsufficiency, as well as
    missense variants, including the recurrent p.Asp860Gly. Parental germline/somatic
    mosaicism has been documented and is relevant to recurrence-risk counseling. Over 100
    cases have been reported.
  evidence:
  - reference: PMID:29959045
    reference_title: "Is MED13L-related intellectual disability a recognizable syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 8 individuals had de novo MED13L aberrations, including two intragenic microdeletions, two frameshift, three nonsense variants, and one missense variant."
    explanation: Documents the predominantly de novo, loss-of-function-weighted variant spectrum of MED13L syndrome.
  - reference: PMID:24781760
    reference_title: "Further confirmation of the MED13L haploinsufficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MED13L haploinsufficiency syndrome has been described in two patients and is characterized by moderate intellectual disability (ID), conotruncal heart defects, facial abnormalities and hypotonia."
    explanation: Confirms the haploinsufficiency mechanism and core phenotype of the syndrome.
  - reference: PMID:28645799
    reference_title: "Genotype-phenotype evaluation of MED13L defects in the light of a novel truncating and a recurrent missense mutation."

    explanation: Establishes the positional clustering of pathogenic missense alleles.
  - reference: PMID:36798993
    reference_title: "MED13L and its disease-associated variants influence the dendritic development of cerebral cortical neurons in the mammalian brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In overexpression assays using cortical neurons from embryonic mouse cerebral

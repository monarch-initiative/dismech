  - statement: Blocking cyclin C mitochondrial localisation partially restores organelle function
  evidence:
  - reference: PMID:35198885
    reference_title: "Aberrant cyclin C nuclear release induces mitochondrial fragmentation and dysfunction in MED13L syndrome fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Unstressed MED13L S1497 F/fs patient fibroblasts exhibited aberrant cytoplasmic
      cyclin C localization, mitochondrial fragmentation, and a 6-fold reduction in
      respiration.
    explanation: Defines the assay readouts available in this model system.
- name: In utero electroporation of mouse cortex with MED13L variants
  description: >-
    In utero electroporation of embryonic mouse cortex with wild-type or
    disease-associated MED13L missense constructs, plus knockdown-with-rescue, giving a
    variant-level functional readout on subcellular localisation, dendritic growth,
    spine morphology, migration and axon elongation. This is the closest available
    assay for classifying MED13L variants of uncertain significance.
  experimental_model_type: OTHER
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  publication: PMID:36798993
  findings:
  - statement: Missense variants differ in nuclear versus cytoplasmic distribution
  - statement: MED13L knockdown abrogates dendritic growth and is rescued by RNAi-resistant wild-type but not by variant constructs
  evidence:
  - reference: PMID:36798993
    reference_title: "MED13L and its disease-associated variants influence the dendritic development of cerebral cortical neurons in the mammalian brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, we show that mMED13L-knockdown abrogated dendritic growth in vivo,
      and this effect was significantly rescued by co-electroporation of an
      RNAi-resistant mMED13L, but weakly by the p.T2162M variant, and not at all by the
      p.S2163L variant.
    explanation: >-
      Demonstrates the rescue-based design that converts the assay into a variant
      classifier.
- name: iPSC-derived neural progenitor CRISPRi Perturb-seq platform
  description: >-
    A scalable Perturb-seq platform (CRISPRi perturbation plus single-cell RNA-seq) in
    human WTC11 induced pluripotent stem cells carrying dCas9-KRAB, differentiated to
    neural progenitor cells, applied to 60 high-confidence autism risk genes and read out
    with structural topic modelling to assess cell fate and differentiation stage
    simultaneously. MED13L is one of only four genes whose effect replicated in an
    independent dataset. This is the closest thing MED13L currently has to a human
    iPSC-derived neuronal model system, and it addresses the gap left by the cyclin-C
    work, which is fibroblast-only — but note it assays CRISPRi repression of the gene
    rather than patient variants, so it models dosage loss, not allele-specific effects.
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: >-
    Human WTC11 iPSC line with dCas9-KRAB knocked into the CLYBL safe-harbour locus
    (Allen Institute), differentiated to neural progenitor cells
  culture_system: >-
    Monolayer forebrain-directed NPC differentiation (dual-SMAD inhibition), transduced
    with pooled sgRNA lentivirus in two independently differentiated biological
    replicates and read out by CROP-seq-style sgRNA-enriched single-cell RNA-seq
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  publication: PMID:39386704
  findings:
  - statement: MED13L repression alters neural cell fate and differentiation stage, replicated in an independent dataset
  evidence:
  - reference: PMID:39386704
    reference_title: "A scalable, high-throughput neural development platform identifies shared impact of ASD genes on cell fate and differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Repression of ASD risk genes led to changes in topic proportions and effects of four
      genes (DEAF1, KMT2A, MED13L, and MYT1L) were validated in an independent dataset.
    explanation: >-
      MED13L is one of four genes whose neural-development effect replicated independently
      in this platform.
  - reference: PMID:39386704
    reference_title: "A scalable, high-throughput neural development platform identifies shared impact of ASD genes on cell fate and differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To identity convergent pathways in NDD genes, we optimized Perturb-seq, a method
      combining CRISPR perturbation with single-cell RNA sequencing (scRNA-seq), and
      applied structural topic modeling (STM) to simultaneously assess impact on cell fate
      and developmental stage.
    explanation: Describes the platform and the readouts available in this model system.
  notes: >-
    Preprint (bioRxiv) with a PubMed record. Recorded because it is the only human neural
    model system currently reporting a replicated MED13L effect; treat the finding as
    provisional pending peer review.

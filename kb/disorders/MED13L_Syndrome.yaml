    reference_title: "Molecular and Functional Characterisation of a Novel Intragenic 12q24.21 Deletion Resulting in MED13L Haploinsufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The analysis of the proband's cDNA sample allowed for specifying the regions of
      the breakpoints and identifying the heterozygous deletion that spanned exons 3 to
      10 of MED13L, which has not been reported previously.
    explanation: Molecular definition of the deletion allele.
  - reference: PMID:37512036
    reference_title: "Molecular and Functional Characterisation of a Novel Intragenic 12q24.21 Deletion Resulting in MED13L Haploinsufficiency Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After MED13L gene editing was performed, reduced cell viability; an accelerated
      aging process; and inhibition of the RB1, E2F1, and CCNC gene expression were
      found to exist.
    explanation: >-
      CRISPR knockdown of MED13L in control fibroblasts reproduces cellular
      consequences, supporting dosage loss as the operative mechanism.
- name: MED13L de novo frameshift variants c.3765delC and c.607dupT
  description: >-
    Two de novo frameshift alleles identified in an ID cohort selected on the facial
    gestalt (bulbous nasal tip, short mouth, straight eyebrows), confirming that
    gestalt-led ascertainment reaches MED13L.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Approximately 100 cases had been reported in the literature as of the early
    2020s, and larger aggregations (102 published cases plus a 41-patient GenIDA
    family-reported series) have since been assembled. No population-based
    prevalence estimate exists. Despite the ultra-rare case count, MED13L is
    repeatedly described as one of the more frequent single-gene causes of
    syndromic intellectual disability in unbiased exome cohorts, so the true
    prevalence is likely higher than the published case count implies.
  evidence:
  - reference: PMID:34654706
    reference_title: "MED13L-related intellectual disability due to paternal germinal mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MED13L-related intellectual disability or MRFACD syndrome (Mental
      retardation and distinctive facial features with or without cardiac defects;
      MIM # 616789) is one of the most common forms of syndromic intellectual
      disability with about a hundred cases reported so far.
    explanation: >-
      Establishes both the cumulative published case count (~100) and the
      characterisation of MED13L as one of the more common syndromic ID entities.
  - reference: PMID:40389839
    reference_title: "Contribution of families using the GenIDA database to the description of MED13L syndrome and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study focused on MED13L syndrome, analyzing data from 41 patients in the
      GenIDA database and comparing it with 102 cases from the scientific literature
      and 6 new descriptions of patients from our medical center.
    explanation: Documents the size of the assembled MED13L literature and registry cohorts.
- population: Unbiased developmental-disorder exome cohorts
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Ascertainment note rather than a rate: MED13L was identified as one of the most
    commonly mutated intellectual-disability genes in the Deciphering Developmental
    Disorders Study, which is the main argument that clinic-based case counts
    understate the true frequency.
  evidence:
  - reference: PMID:28645799
    reference_title: "Genotype-phenotype evaluation of MED13L defects in the light of a novel truncating and a recurrent missense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the fact that MED13L was found to be one of the most common ID genes
      in the Deciphering Developmental Disorders Study
    explanation: >-
      Supports the claim that MED13L is a high-yield gene in unbiased developmental
      disorder cohorts despite a modest published case count.
mechanistic_hypotheses:
- hypothesis_group_id: med13l_haploinsufficiency
  hypothesis_label: MED13L haploinsufficiency (dosage loss) as the primary disease mechanism
  status: CANONICAL
  description: >
    Heterozygous deletion, frameshift, nonsense, and canonical-splice variants
    reduce functional MED13L dosage below a developmental threshold, reducing the
    pool of intact CKM available to dock on core Mediator and dysregulating
    CKM-gated RNA polymerase II transcription during development. Supported by the
    predominance of loss-of-function alleles among patients, a recognisable shared
    phenotype across deletion and truncating cases, and recapitulation in
    heterozygous Med13l mice with embryonic/neonatal lethality of the homozygous
    null.
  applies_to_subtypes:
  - Loss-of-function (deletion / truncating / splice)
  evidence:
  - reference: PMID:23403903
    reference_title: "Dosage changes of MED13L further delineate its role in congenital heart defects and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using high resolution molecular karyotyping, we identified two intragenic de
      novo frameshift deletions, likely resulting in haploinsufficiency, in two
      patients with a similar phenotype of hypotonia, moderate ID, conotruncal heart
      defect and facial anomalies.
    explanation: >-
      De novo intragenic dosage-loss alleles produce a shared recognisable phenotype,
      the founding argument for haploinsufficiency.
  - reference: PMID:24781760
    reference_title: "Further confirmation of the MED13L haploinsufficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients show features of the MED13L haploinsufficiency syndrome, except
      for the heart defects, thus further confirming the existence of the MED13L
      haploinsufficiency syndrome.
    explanation: >-
      Independent splice and multi-exon deletion alleles reproduce the syndrome,
      confirming dosage loss as the mechanism.
  - reference: PMID:40775066
    reference_title: "Regulation of cortical neurogenesis by MED13L via transcriptional priming and its implications for MED13L syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While homozygous Med13l knockout exhibit neonatal lethality accompanied by
      reduced brain volume and cortical thickness, heterozygous mice are viable and
      display hallmarks of MED13L syndrome, including impaired learning and memory,
      reduced motor coordination, and heightened anxiety.
    explanation: >-
      Mouse dosage series shows the heterozygous state is sufficient to produce the
      syndrome phenotype while complete loss is lethal.
  - reference: PMID:29511999
    reference_title: "MED13L-related intellectual disability: involvement of missense variants and delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that patients carrying missense mutations had more frequently epilepsy
      and showed a more severe phenotype.
    explanation: >-
      Qualifies the pure-dosage model: missense carriers are systematically more
      severely affected than truncating carriers, which simple haploinsufficiency
      does not predict.
- hypothesis_group_id: med13l_missense_non_haploinsufficient
  hypothesis_label: A subset of recurrent missense variants act through a mechanism other than simple dosage loss
  status: EMERGING
  description: >
    Most pathogenic MED13L missense variants destabilise the protein and mislocalise
    it to the cytoplasm, behaving as loss-of-function. At least one recurrent
    exon-15 allele, p.Pro869Ser, retains comparatively stable expression and partial
    nuclear localisation while associating with a more severe, epilepsy-enriched
    phenotype than truncating alleles — a pattern more consistent with a
    dominant-negative or neomorphic effect on the assembled CKM than with
    haploinsufficiency. This remains an inference from cell-based localisation and
    stability assays plus genotype-phenotype correlation; no direct demonstration of
    dominant-negative action on Mediator function has been published.
  applies_to_subtypes:
  - Missense (exon 15-17 and 25-31 hotspots)
  evidence:
  - reference: PMID:40500968
    reference_title: "MED13L pathogenic missense variants impair protein stability and interaction, underlying diverse clinical outcomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We identified significant reductions in protein stability across these
      variants, with some exhibiting aberrant cytoplasmic localization, suggesting
      disruptions in structural integrity and function.
    explanation: >-
      Functional characterisation of five recurrent missense alleles showing
      heterogeneous, not uniformly loss-of-function, behaviour.
  - reference: PMID:40500968
    reference_title: "MED13L pathogenic missense variants impair protein stability and interaction, underlying diverse clinical outcomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In particular, exon 15 variants (p.Pro866Leu and p.Pro869Ser) correlated with
      severe phenotypes, including epilepsy and severe motor impairment, whereas
      p.Gly1899Arg and p.Thr2162Met were associated with milder manifestations.
    explanation: >-
      Ties variant position to clinical severity, the genotype-phenotype anchor for
      the non-haploinsufficiency hypothesis.
  - reference: PMID:32646507
    reference_title: "Report of a de novo c.2605C > T (p.Pro869Ser) change in the MED13L gene and review of the literature for MED13L-related intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our case further demonstrates that Pro869Ser is a hotspot mutation of the
      MED13L gene.
    explanation: >-
      Establishes p.Pro869Ser as a recurrent allele, a prerequisite for the
      allele-specific mechanism claim.
  - reference: PMID:28645799
    reference_title: "Genotype-phenotype evaluation of MED13L defects in the light of a novel truncating and a recurrent missense mutation."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Notably, our in silico modelling predicted this missense mutation to decrease
      the stability of an alpha-helix and thereby affecting the MED13L secondary
      structure, while the majority of published missense mutations remain variants
      of uncertain significance.
    explanation: >-
      Counterweight: structural prediction for at least some missense alleles points
      back to destabilisation (loss-of-function), and most missense variants remain
      VUS.
  notes: >-
    Treat the severity stratification as preliminary. The same study that reports
    p.Pro869Ser as stable and nuclear reports four other missense alleles behaving as
    classic loss-of-function, so this hypothesis applies to specific alleles rather
    than to missense variants as a class.
- hypothesis_group_id: med13l_isolated_dtga
  hypothesis_label: MED13L missense variants as a cause of isolated dextro-transposition of the great arteries
  status: DEPRECATED
  description: >
    The gene entered the literature in 2003-2004 as a candidate for isolated
    d-transposition of the great arteries, and that framing persisted for a decade.
    Subsequent syndromic cohorts redefined the entity as a neurodevelopmental
    haploinsufficiency disorder in which congenital heart defects are a minority,
    variably penetrant feature, and the original missense alleles are now largely
    classified as variants of uncertain significance. The isolated-d-TGA association
    is retained here as the historical entry point to the gene, not as a supported
    current mechanism.
  applies_to_subtypes:
  - Isolated d-transposition of the great arteries
  evidence:
  - reference: PMID:15175163
    reference_title: "A set of consensus mammalian mediator subunits identified by multidimensional protein identification technology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, we identify as Mediator-associated proteins the CDK8-like
      cyclin-dependent kinase CDK11 and the TRAP240-like KIAA1025 protein (MED13L),
      which is mutated in patients with the congenital heart defect transposition of
      the great arteries (TGA).
    explanation: >-
      Records the original framing of MED13L (then KIAA1025/TRAP240-like) as a
      transposition-of-the-great-arteries gene.
  - reference: PMID:25758992
    reference_title: "Redefining the MED13L syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report eight patients with predominantly novel MED13L variants who
      lack such complex congenital heart malformations.
    explanation: >-
      Directly refutes obligate cardiac involvement and reframes MED13L as a
      syndromic neurodevelopmental disorder.
  - reference: PMID:23403903
    reference_title: "Dosage changes of MED13L further delineate its role in congenital heart defects and intellectual disability."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings show that MED13L haploinsufficiency in contrast to the previously
      observed missense mutations cause a distinct syndromic phenotype.
    explanation: >-
      Separates the syndromic dosage-loss entity from the earlier isolated-d-TGA
      missense reports.
  - reference: PMID:28645799
    reference_title: "Genotype-phenotype evaluation of MED13L defects in the light of a novel truncating and a recurrent missense mutation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent reports of 22 further patients diagnosed by genome-wide testing
      further delineated the syndrome with expansion of the phenotypic spectrum and
      showed reduced penetrance for congenital heart defects.
    explanation: >-
      Documents reduced cardiac penetrance, undermining a conotruncal-specific gene
      model.
- hypothesis_group_id: med13l_med13_paralog_compensation
  hypothesis_label: MED13/MED13L paralog compensation modulates expressivity
  status: EMERGING
  description: >
    MED13 and MED13L are mutually exclusive occupants of the same structural position
    in the CKM and are partially redundant: combined cardiomyocyte deletion of both is
    lethal where either single deletion is tolerated. Incomplete, tissue-dependent
    compensation by the intact paralog is a candidate explanation for the variable
    expressivity of MED13L syndrome — in particular for why cardiac involvement is
    penetrant in only a minority — and, if druggable, a candidate therapeutic axis.
    No direct human evidence links paralog expression level to phenotype severity.
  evidence:
  - reference: PMID:40989238
    reference_title: "Med13 and Med13L: Critical redundant players in basal cardiac function and gene expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Med13 and Med13L are mutually exclusive paralogs within the kinase submodule of
      the Mediator complex that have been shown to have partially redundant functions
      in embryonic development and transcription, but their combined roles have not
      been investigated in the adult heart.
    explanation: >-
      States the mutual exclusivity and partial redundancy that the compensation
      hypothesis rests on.
  - reference: PMID:40989238
    reference_title: "Med13 and Med13L: Critical redundant players in basal cardiac function and gene expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Med13/13L knockout resulted in decreased cardiac function leading to lethal
      heart failure in a median timeframe of 6 weeks from the start of tamoxifen.
    explanation: >-
      Combined loss is lethal where single-paralog loss is tolerated, the functional
      signature of redundancy.
  - reference: PMID:40919805
    reference_title: "Heterozygous Med13l mice recapitulate a developmental growth delay and craniofacial anomalies seen in MED13L syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Med13l HET mice recapitulate MED13L syndrome phenotypes including a
      developmental growth delay and craniofacial anomalies.
    explanation: >-
      Heterozygous Med13l loss produces growth and craniofacial phenotypes but not a
      cardiac functional defect, consistent with — though not proof of — cardiac
      compensation by Med13.
  notes: >-
    The available redundancy evidence is cardiac and murine. Whether the same buffering
    operates in developing human cortex, where the dominant MED13L phenotype arises, is
    untested.
- hypothesis_group_id: med13l_cyclin_c_mitochondrial
  hypothesis_label: Cyclin C nuclear release and mitochondrial fragmentation as a secondary disease mechanism
  status: EMERGING
  description: >
    MED13L tethers the cyclin C-CDK8 kinase module to Mediator; cyclin C also has a
    CKM-independent cytoplasmic role driving stress-induced mitochondrial fission and
    regulated cell death. In patient fibroblasts carrying a MED13L frameshift allele,
    cyclin C is aberrantly cytoplasmic even without stress, with mitochondrial
    fragmentation and markedly reduced respiration; blocking cyclin C mitochondrial
    localisation partially rescues organelle function. If this operates in neurons it
    would add a bioenergetic component to the intellectual disability phenotype and
    would be pharmacologically approachable independently of transcription. Currently
    demonstrated only in fibroblasts from a single patient allele.
  applies_to_subtypes:
  - Loss-of-function (deletion / truncating / splice)
  evidence:
  - reference: PMID:35198885
    reference_title: "Aberrant cyclin C nuclear release induces mitochondrial fragmentation and dysfunction in MED13L syndrome fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Unstressed MED13L S1497 F/fs patient fibroblasts exhibited aberrant cytoplasmic
      cyclin C localization, mitochondrial fragmentation, and a 6-fold reduction in
      respiration.
    explanation: >-
      Primary observation linking a MED13L patient allele to cyclin C mislocalisation
      and a measurable bioenergetic deficit.
  - reference: PMID:35198885
    reference_title: "Aberrant cyclin C nuclear release induces mitochondrial fragmentation and dysfunction in MED13L syndrome fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pharmacological or genetic approaches preventing cyclin C-mitochondrial
      localization corrected the fragmented mitochondrial phenotype and partially
      restored organelle function.
    explanation: >-
      Rescue experiment establishes cyclin C mislocalisation as causal for the
      mitochondrial phenotype rather than a bystander effect, and defines the
      candidate therapeutic handle.
  notes: >-
    Evidence is from one patient fibroblast line carrying a single frameshift allele.
    Whether the same cyclin C release occurs in MED13L-haploinsufficient neurons, and
    whether it contributes measurably to the neurodevelopmental phenotype, is untested.
pathophysiology:
- name: CKM hinge anchoring by MED13L
  biological_scale: MOLECULAR
  description: >
    MED13L, like its paralog MED13, is the physical hinge of the Mediator CDK8 kinase
    module (CKM, comprising MED13/MED13L, MED12/MED12L, CDK8/CDK19 and cyclin C). The
    subunit adopts an Argonaute-like bi-lobal fold, and a large intrinsically
    disordered region within it forms the principal CKM contact with core Mediator.
    That same disordered region sterically occludes the RNA polymerase II and MED26
    binding surfaces, so MED13L abundance and structural integrity gate reversible
    CKM-core docking and thereby the switch between Mediator's repressive and
    permissive states.
  genes:
  - preferred_term: MED13L
    term:
      id: hgnc:22962
      label: MED13L
  - preferred_term: MED13
    term:
      id: hgnc:22474
      label: MED13
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  molecular_functions:
  - preferred_term: transcription coregulator activity
    term:
      id: GO:0003712
      label: transcription coregulator activity
  evidence:
  - reference: PMID:39321804
    reference_title: "Structural basis of the human transcriptional Mediator regulated by its dissociable kinase module."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The CKM binds to multiple regions on cMED through both MED12 and MED13,
      including a large intrinsically disordered region (IDR) in the latter.
    explanation: >-
      Cryo-EM of the complete human Mediator identifies the MED13 intrinsically
      disordered region as the CKM-core interface.
  - reference: PMID:39321804
    reference_title: "Structural basis of the human transcriptional Mediator regulated by its dissociable kinase module."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Notably, the MED13 IDR obstructs the recruitment of RNA Pol II/MED26 onto cMED
      by direct occlusion of their respective binding sites, leading to functional
      repression of cMED-dependent transcription.
    explanation: >-
      Defines the structural mechanism by which the hinge subunit represses
      Mediator-dependent transcription, the function lost on MED13L dosage reduction.
  - reference: PMID:33523904
    reference_title: "Structure and noncanonical Cdk8 activation mechanism within an Argonaute-containing Mediator kinase module."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Unexpectedly, Med13 has a characteristic Argonaute-like bi-lobal architecture.
    explanation: Establishes the structural fold of the MED13/MED13L hinge subunit.
  - reference: PMID:33523904
    reference_title: "Structure and noncanonical Cdk8 activation mechanism within an Argonaute-containing Mediator kinase module."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Numerous pathogenic mutations causative for neurodevelopmental disorders and
      cancer congregate in CKM subunits.
    explanation: >-
      Connects the CKM structure to the disease burden carried by its subunits,
      including MED13L.
  - reference: PMID:35198885
    reference_title: "Aberrant cyclin C nuclear release induces mitochondrial fragmentation and dysfunction in MED13L syndrome fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MED13L controls transcription by tethering the cyclin C-Cdk8 kinase module (CKM)
      to the Mediator complex.
    explanation: States the MED13L-specific tethering role directly.
  downstream:
  - target: MED13L haploinsufficiency
    description: >-
      Reduced MED13L protein reduces the pool of intact CKM competent to dock on core
      Mediator.
  - target: SCF-FBW7 control of MED13L abundance
    description: >-
      Because the hinge is the rate-limiting CKM-core contact, ubiquitin-mediated
      turnover of MED13L sets CKM-core stoichiometry.
- name: SCF-FBW7 control of MED13L abundance
  biological_scale: MOLECULAR
  description: >
    The SCF-Fbw7 ubiquitin ligase binds CDK8-Mediator and targets both MED13 and
    MED13L for proteasomal degradation. This is the only characterised E3-ligase
    control of MED13L abundance, and because MED13/MED13L physically link the CKM to
    Mediator, Fbw7-dependent turnover sets the kinetics of CKM dissociation from the
    core complex. Loss of Fbw7 increases CKM-Mediator association, the reciprocal of
    the dosage reduction seen in MED13L syndrome.
  genes:
  - preferred_term: MED13L
    term:
      id: hgnc:22962
      label: MED13L
  - preferred_term: FBXW7
    term:
      id: hgnc:16712
      label: FBXW7
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence:
  - reference: PMID:23322298
    reference_title: "The SCF-Fbw7 ubiquitin ligase degrades MED13 and MED13L and regulates CDK8 module association with Mediator."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that Fbw7, a tumor suppressor and ubiquitin ligase, binds to
      CDK8-Mediator and targets MED13/13L for degradation.
    explanation: >-
      Establishes SCF-Fbw7 as the E3 ligase controlling MED13L protein abundance.
  - reference: PMID:23322298
    reference_title: "The SCF-Fbw7 ubiquitin ligase degrades MED13 and MED13L and regulates CDK8 module association with Mediator."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MED13/13L physically link the CDK8 module to Mediator, and Fbw7 loss increases
      CDK8 module-Mediator association.
    explanation: >-
      Shows MED13L abundance is directly coupled to CKM-core occupancy, the dosage
      axis perturbed in MED13L syndrome.
  downstream:
  - target: MED13L haploinsufficiency
    description: >-
      Turnover of the remaining wild-type allele's product further lowers functional
      MED13L in a haploinsufficient cell, making degradation kinetics a candidate
      modifier and therapeutic target.
- name: MED13L haploinsufficiency
  biological_scale: MOLECULAR
  description: >
    Heterozygous loss-of-function alleles — whole-gene and intragenic deletions,
    frameshift, nonsense, and canonical splice variants — halve functional MED13L
    dosage. The reduced pool of intact CKM dysregulates RNA polymerase II-dependent
    transcriptional programs during development. Dosage loss is sufficient to produce
    the syndrome: heterozygous Med13l mice reproduce growth, craniofacial, learning
    and motor phenotypes, while homozygous loss is embryonic/neonatal lethal.
  genes:
  - preferred_term: MED13L
    term:
      id: hgnc:22962
      label: MED13L
  biological_processes:
  - preferred_term: transcription by RNA polymerase II
    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
    modifier: DECREASED
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:23403903
    reference_title: "Dosage changes of MED13L further delineate its role in congenital heart defects and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe for the first time, three patients with copy number changes
      affecting MED13L and delineate a recognizable MED13L haploinsufficiency
      syndrome.
    explanation: Founding delineation of the dosage-loss syndrome.
  - reference: PMID:37512036
    reference_title: "Molecular and Functional Characterisation of a Novel Intragenic 12q24.21 Deletion Resulting in MED13L Haploinsufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on these findings, heterozygous intragenic 12q24.21 deletion in the
      affected individual resulted in MED13L haploinsufficiency due to the premature
      termination of protein translation, therefore leading to MED13L
      haploinsufficiency syndrome.
    explanation: >-
      Traces an intragenic deletion through premature translation termination to
      haploinsufficiency at the protein level.

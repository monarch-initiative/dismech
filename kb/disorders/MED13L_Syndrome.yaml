treatments:
- name: Speech and Language Therapy
  description: >
    Early and intensive speech and language therapy is recommended to address the profound
    communication impairment that is among the most consistent and severe features of
    MED13L syndrome.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech therapy
    term:
      id: MAXO:0000930
      label: speech therapy
- name: Genetic Counseling
  description: >
    Genetic counseling is recommended for affected families. Most cases are de novo, but
    parental mosaicism has been documented, so parental testing and recurrence-risk
    assessment are warranted.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240

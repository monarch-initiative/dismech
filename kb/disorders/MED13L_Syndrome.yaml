    reference_title: "Regulation of cortical neurogenesis by MED13L via transcriptional priming and its implications for MED13L syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While homozygous Med13l knockout exhibit neonatal lethality accompanied by
      reduced brain volume and cortical thickness, heterozygous mice are viable and
      display hallmarks of MED13L syndrome, including impaired learning and memory,
      reduced motor coordination, and heightened anxiety.
    explanation: >-
      Establishes the mouse dosage series and shows heterozygous loss is sufficient
      for the syndrome phenotype.

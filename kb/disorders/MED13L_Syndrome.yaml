name: MED13L Syndrome
creation_date: '2026-07-31T00:00:00Z'
category: Mendelian
synonyms:
- MRFACD
- Impaired intellectual development and distinctive facial features with or without cardiac defects
- MED13L haploinsufficiency syndrome
- MED13L-related intellectual disability
- Cardiac anomalies - developmental delay - facial dysmorphism syndrome
- Asadollahi-Rauch syndrome
description: >
  MED13L syndrome (MRFACD; MED13L haploinsufficiency syndrome) is a rare autosomal
  dominant neurodevelopmental disorder caused by heterozygous, predominantly de novo
  pathogenic variants in MED13L, which encodes mediator complex subunit 13-like. MED13L
  is the paralog of MED13 and, like MED13, is part of the dissociable CDK8 kinase module
  that reversibly associates with the core Mediator transcriptional coactivator complex.
  Pathogenic loss-of-function (frameshift, nonsense, splice, intragenic deletion) and
  missense variants act through haploinsufficiency to disrupt Mediator-dependent
  transcription in developing tissues. MED13L syndrome is the most common and most
  syndromic of the Mediator kinase-module disorders, characterized by mild-to-profound
  developmental delay and intellectual disability, muscular hypotonia, marked speech and
  language impairment (often near-absent speech), a recognizable facial gestalt (depressed
  nasal bridge, bulbous nose, upslanting palpebral fissures, macrostomia, open-mouth
  appearance), and congenital heart defects with variable penetrance (notably transposition
  of the great arteries and other conotruncal lesions). Additional features include
  behavioral abnormalities (autistic features), seizures, ataxia and coordination problems,
  corpus callosum and myelination abnormalities, and hearing impairment. The gene was first
  linked to isolated transposition of the great arteries (2003), and the haploinsufficiency
  syndrome was delineated and progressively redefined from 2013 onward; over 100 cases have
  now been reported. It is also known as Asadollahi-Rauch syndrome.

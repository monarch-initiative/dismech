- name: MED13L intragenic deletion of exons 3-10 (12q24.21)
  description: >-
    Novel heterozygous intragenic deletion resolved at cDNA level, predicted to
    truncate the protein and remove the MedPIWI and Med13_C domains, functionally
    confirmed to cause haploinsufficiency.
  clinical_significance: PATHOGENIC
  type: deletion
  gene:
    preferred_term: MED13L

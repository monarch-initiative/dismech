datasets:
- accession: "geo:GSE298801"
  title: Cardiomyocyte-specific Deletion of Med13 and Med13L Results in Dysregulated Gene Expression and Lethal Heart Failure
  description: >-
    Bulk RNA-seq from adult murine cardiomyocytes after inducible knockout of Med13 and
    Med13L. Included on the MED13L entry because it is the primary evidence for
    MED13/MED13L functional redundancy, which underpins the paralog-compensation
    hypothesis for MED13L's variable cardiac penetrance.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: BULK_RNA_SEQ
  sample_count: 8
  sample_types:
  - preferred_term: cardiomyocyte
    tissue_term:
      preferred_term: heart
      term:
        id: UBERON:0000948
        label: heart
  conditions:
  - Med13/Med13L cardiomyocyte-specific double knockout
  - wild-type control
  genes:
  - preferred_term: MED13
    term:
      id: hgnc:22474
      label: MED13
  - preferred_term: MED13L
    term:
      id: hgnc:22962
      label: MED13L
  publication: PMID:40989238
  findings:
  - statement: Med13 and Med13L are functionally redundant in adult cardiomyocytes
  - statement: Combined knockout causes lethal heart failure with fibrotic and calcium-handling gene dysregulation
  evidence:
  - reference: PMID:40989238
    reference_title: "Med13 and Med13L: Critical redundant players in basal cardiac function and gene expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Med13/13L knockout resulted in decreased cardiac function leading to lethal heart
      failure in a median timeframe of 6 weeks from the start of tamoxifen.
    explanation: >-
      Establishes the redundancy result that this dataset supports and that the
      paralog-compensation hypothesis rests on.
review_notes: >-
  Curated from an Anthropic-generated systematic-review pipeline output for MED13L that
  was held out from the dismech repository during its own generation. Every claim was
  re-derived here against PubMed abstracts under the dismech evidence policy: the
  pipeline's snippets were verbatim spans of its own review text rather than of source
  abstracts, so none were reused directly. Claims whose only support was a pipeline
  snippet not present in the cited abstract were dropped rather than reworded — notably
  the congenital-heart-defect frequency of 15/72 (20.8%) attributed to PMID:37512036,
  the hypotonia/speech/MRI frequencies of 70%/99%/45% attributed to PMID:33930262, and
  the seizure frequency of 15/68 (22%) attributed to PMID:39619418, all of which appear
  only in those papers' full text. The corresponding phenotype frequency bands here are
  instead anchored on PMID:40993520 and PMID:28645799, which state comparable figures in
  their abstracts. Four sources cited by the pipeline have no PubMed record and were
  therefore not usable under the PMID-plus-verified-snippet policy: DOI
  10.1101/2022.03.30.486486, 10.21508/1027-4065-2022-67-1-101-107, 10.4172/jpb.s2-004,
  and 10.64898/2026.06.01.729270.

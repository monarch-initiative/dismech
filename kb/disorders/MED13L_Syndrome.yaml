external_assertions:
- name: ClinVar variant-interpretation landscape for MED13L
  source: ClinVar
  assertion_type: variant_interpretation_summary
  external_id: hgnc:22962
  url: https://www.ncbi.nlm.nih.gov/clinvar/?term=MED13L%5Bgene%5D
  description: >-
    As of 2026-07-30 ClinVar holds 1,825 MED13L variant records, of which 542 are
    pathogenic or likely pathogenic and 1,058 are of uncertain significance. The
    interpretive burden is the point: VUS outnumber P/LP roughly two to one, which is why
    the functional assays curated in `experimental_models` (protein stability and
    subcellular localisation, in utero electroporation rescue) matter clinically rather
    than only mechanistically.
  notes: >-
    Recorded without an evidence item. ClinVar is not a snippet-validated structured source
    in this repository, so these counts come from a point-in-time NCBI E-utilities query
    (`esearch db=clinvar term="MED13L[gene]"` and its clinsig-filtered variants, run
    2026-07-30) and will drift. They are recorded for scale, not as a citable assertion.
    Note the source pipeline reported different figures (1,813 total / 235 P/LP / 606 VUS)
    from an earlier snapshot; the counts above are the re-queried values.

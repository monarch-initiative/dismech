    evidence_source: MODEL_ORGANISM
    snippet: >-
      Knockdown of MED13L orthologue in zebrafish, med13b, showed early defective
      migration of cranial neural crest cells (NCCs) that contributed to cartilage
      structure deformities in the later stage, recapitulating craniofacial anomalies
      seen in human patients.
    explanation: >-
      Direct model-organism evidence that MED13L loss impairs cranial neural crest
      migration and produces the craniofacial phenotype.

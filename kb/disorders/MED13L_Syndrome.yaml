pathophysiology:
- name: Disrupted Mediator complex transcriptional regulation
  description: >
    MED13L is a subunit of the CDK8 kinase module (CKM) of the Mediator complex, the
    dissociable regulatory cap that reversibly tethers to the Mediator core to gate RNA
    polymerase II-dependent transcription. MED13L tethers the cyclin C-CDK8 kinase module
    to the Mediator complex. Heterozygous loss-of-function and missense variants act
    through haploinsufficiency to disrupt Mediator-dependent transcriptional control of
    developmental gene-expression programs. MED13L belongs to the group of CDK8-kinase
    module-associated disease genes, alongside its paralog MED13 and MED12, MED12L, CDK8,
    and CDK19.
  genes:
  - preferred_term: MED13L
    term:
      id: hgnc:22962
      label: MED13L
  biological_processes:
  - preferred_term: transcription by RNA polymerase II
    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:35198885
    reference_title: "Aberrant cyclin C nuclear release induces mitochondrial fragmentation and dysfunction in MED13L syndrome fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MED13L controls transcription by tethering the cyclin C-Cdk8 kinase module (CKM) to the Mediator complex."
    explanation: Establishes MED13L's structural role tethering the cyclin C-CDK8 kinase module to Mediator, the basis for its transcriptional-regulatory function.
  - reference: PMID:40500968
    reference_title: "MED13L pathogenic missense variants impair protein stability and interaction, underlying diverse clinical outcomes."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "3D protein modeling suggested that these missense variants may disrupt MED13L's interaction with the CDK8 kinase module, leading to functional deficits."
    explanation: Provides gene-specific mechanistic evidence that pathogenic MED13L missense variants perturb CKM interactions.
  downstream:
  - target: Cyclin C mislocalization and mitochondrial dysfunction
    description: >-
      Loss of MED13L tethering can release cyclin C from the nucleus, engaging its
      CKM-independent cytoplasmic role in mitochondrial fragmentation.
  - target: Neurodevelopmental transcriptional dysregulation
    description: >-
      Mediator/CKM dysfunction perturbs neuronal developmental gene-expression programs
      that contribute to developmental delay, language impairment, and intellectual disability.
  - target: Cardiac developmental transcriptional dysregulation
    description: >-
      Mediator dysfunction perturbs cardiac developmental transcriptional programs,
      contributing to conotruncal congenital heart defects in a subset of patients.
  - target: Craniofacial and sensory developmental dysregulation
    description: >-
      Because Mediator is required for transcription of nearly all RNA polymerase II genes,
      MED13L dysfunction perturbs craniofacial and sensory developmental programs,
      contributing to the recognizable facial gestalt and hearing impairment.
- name: Cyclin C mislocalization and mitochondrial dysfunction
  description: >
    Beyond its role tethering the kinase module to Mediator, MED13L loss can cause aberrant
    cytoplasmic release of cyclin C, which has a CKM-independent role directing
    stress-induced mitochondrial fragmentation and regulated cell death. In patient
    fibroblasts carrying a MED13L truncating allele, mislocalized cyclin C drives
    mitochondrial fragmentation, reduced respiration, and hypersensitivity to oxidative
    stress, identifying a mitochondrial-dysfunction arm of MED13L syndrome pathophysiology.
  biological_processes:
  - preferred_term: mitochondrial fragmentation
    term:
      id: GO:0000266
      label: mitochondrial fission
    modifier: INCREASED
  evidence:
  - reference: PMID:35198885
    reference_title: "Aberrant cyclin C nuclear release induces mitochondrial fragmentation and dysfunction in MED13L syndrome fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In conclusion, this study found that mitochondrial dysfunction is an underlying defect in cells harboring the MED13L S1497 F/fs allele and identified cyclin C mis-localization as the likely cause."
    explanation: Establishes cyclin C mislocalization and consequent mitochondrial dysfunction as a mechanistic arm of MED13L syndrome.
- name: Neurodevelopmental transcriptional dysregulation
  description: >
    Downstream of MED13L/Mediator dysfunction, neuronal gene-expression programs are
    dysregulated during brain development, contributing to intellectual disability, global
    developmental delay, profound language impairment, hypotonia, and behavioral phenotypes.
    Single-cell transcriptomic studies in Med13l knockout mice show that MED13L orchestrates
    cortical neurogenesis by transcriptional priming of key developmental genes, and that its
    loss produces severe cortical neurogenesis deficits through impaired neural progenitor
    differentiation.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of neuron differentiation
    term:
      id: GO:0045664
      label: regulation of neuron differentiation
    modifier: DYSREGULATED
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:40775066
    reference_title: "Regulation of cortical neurogenesis by MED13L via transcriptional priming and its implications for MED13L syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Single-cell transcriptomics and immunofluorescence reveal severe cortical neurogenesis deficits in Med13l knockout embryos, driven by impaired neural progenitor differentiation."
    explanation: scRNA-seq directly demonstrates cortical neurogenesis deficits in Med13l knockout, providing mechanistic insight into the neurodevelopmental phenotype.
  downstream:
  - target: Intellectual disability
    description: Disrupted neuronal developmental programs contribute to the core cognitive impairment.
  - target: Global developmental delay
    description: Early milestone acquisition is impaired downstream of neuronal transcriptional dysregulation.
  - target: Delayed speech and language development
    description: Language acquisition is especially sensitive to the disrupted neurodevelopmental program in MED13L syndrome.
  - target: Hypotonia
    description: Disrupted neurodevelopmental programs contribute to muscular hypotonia, compounding motor delay.
  - target: Autistic features
    description: Variable downstream neurobehavioral manifestations include autistic features in a subset of individuals.
  - target: Seizures
    description: Disrupted cortical network formation predisposes to seizures in a subset of patients.
  - target: Corpus callosum abnormalities
    description: Disturbed midline/commissural morphogenesis contributes to corpus callosum abnormalities.
  - target: White matter abnormalities
    description: Dysregulated myelination programs contribute to white matter/myelination abnormalities on MRI.
  - target: Ataxia and coordination problems
    description: Disrupted cerebellar/motor developmental programs contribute to ataxia and impaired coordination.
- name: Cardiac developmental transcriptional dysregulation
  description: >
    MED13L was first identified through its disruption in isolated transposition of the
    great arteries (TGA), a conotruncal septation defect. In MED13L syndrome, Mediator
    dysfunction perturbs cardiac developmental transcriptional programs, contributing to
    congenital heart defects with variable penetrance, ranging from patent foramen ovale
    to septal defects to transposition of the great arteries. Mouse genetics demonstrate
    that Med13 and Med13L function redundantly in the heart.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:

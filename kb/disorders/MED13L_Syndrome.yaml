    term:
      id: UBERON:0000948
      label: heart
  biological_processes:
  - preferred_term: heart morphogenesis
    term:
      id: GO:0003007
      label: heart morphogenesis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:14638541
    reference_title: "Missense mutations and gene interruption in PROSIT240, a novel TRAP240-like gene, in patients with congenital heart defect (transposition of the great arteries)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Missense mutations and gene interruption in PROSIT240, a novel TRAP240-like gene, in patients with congenital heart defect (transposition of the great arteries)."
    explanation: The original gene-disease link, identifying MED13L (then PROSIT240/TRAP240-like) disruption in patients with transposition of the great arteries.
  - reference: PMID:40989238
    reference_title: "Med13 and Med13L: Critical redundant players in basal cardiac function and gene expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Previous studies have linked mutations in the Mediator complex, specifically Mediator 13 (Med13) and Mediator 13-like (Med13L), with both congenital heart defects and cardiovascular diseases."
    explanation: Confirms the established link between MED13/MED13L and congenital heart defects, supporting the cardiac developmental arm.
  downstream:
  - target: Congenital heart defects
    description: Perturbed cardiac transcriptional programs contribute to the variable conotruncal congenital heart phenotype.
- name: Craniofacial and sensory developmental dysregulation
  description: >
    Because the Mediator complex is required for transcription of essentially all RNA
    polymerase II genes, MED13L dysfunction perturbs developmental gene-expression programs
    in craniofacial and sensory tissues, producing the recognizable MED13L facial gestalt
    (depressed nasal bridge, bulbous nose, upslanting palpebral fissures, macrostomia,
    open-mouth appearance) and, in a subset, hearing impairment and ocular/vision issues.
  cell_types:

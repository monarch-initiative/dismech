name: MED13L Syndrome
creation_date: '2026-07-30T00:00:00Z'
category: Mendelian
synonyms:
- MED13L haploinsufficiency syndrome
- MED13L-related intellectual disability
- MRFACD
- Mental retardation and distinctive facial features with or without cardiac defects
- Asadollahi-Rauch syndrome
- Impaired intellectual development and distinctive facial features with or without
  cardiac defects
description: >
  MED13L syndrome (MRFACD) is an autosomal dominant neurodevelopmental disorder
  caused by heterozygous, predominantly de novo variants in MED13L, the paralog of
  MED13 within the CDK8 kinase module (CKM) of the Mediator transcriptional
  coactivator complex. The core phenotype is moderate-to-severe intellectual
  disability with disproportionately severe speech impairment, hypotonia, motor
  delay, and a recognizable facial gestalt (depressed/broad nasal bridge, bulbous
  nasal tip, hypotonic open mouth, upslanted palpebral fissures). Congenital heart
  defects — historically considered a defining feature because the gene was first
  implicated through isolated dextro-transposition of the great arteries — are now
  recognised as a minority, variably penetrant finding. Deep phenotyping shows the
  speech phenotype is specifically a motor speech disorder (apraxia and/or
  dysarthria) rather than a nonspecific language delay. Loss-of-function alleles
  (whole-gene and intragenic deletions, frameshift, nonsense, canonical splice)
  act through haploinsufficiency; missense variants cluster in two hotspots
  (exons 15-17 and 25-31) and are associated with a more severe, epilepsy-enriched
  presentation, with at least one recurrent allele (p.Pro869Ser) behaving unlike
  simple dosage loss in functional assays. MED13L is one of the more frequently
  implicated genes in syndromic intellectual disability, with roughly 100 cases
  described in the literature.
disease_term:
  preferred_term: MED13L syndrome
  term:
    id: MONDO:0014773
    label: cardiac anomalies - developmental delay - facial dysmorphism syndrome
parents:
- Autosomal dominant syndromic intellectual disability
- Neurodevelopmental disorder
- CDK8-kinase module-associated disorder
notes: >-
  This entry is the MED13L-specific counterpart of `MED13_Syndrome`. MED13L is also
  represented as a molecular subtype of the `Mediator Complex Neurodevelopmental
  Disorder` grouping entry; that entry remains the cross-subtype view, while this
  entry carries the MED13L-specific mechanism graph, variant-class stratification,
  and management detail.

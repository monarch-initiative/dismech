    term:
      id: GO:0048813
      label: dendrite morphogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:40775066
    reference_title: "Regulation of cortical neurogenesis by MED13L via transcriptional priming and its implications for MED13L syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Single-cell transcriptomics and immunofluorescence reveal severe cortical
      neurogenesis deficits in Med13l knockout embryos, driven by impaired neural
      progenitor differentiation.
    explanation: >-
      Locates the primary cellular defect at neural progenitor differentiation during
      corticogenesis.
  - reference: PMID:40775066
    reference_title: "Regulation of cortical neurogenesis by MED13L via transcriptional priming and its implications for MED13L syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Integrative multi-omics analyses reveal that MED13L orchestrates cortical
      neurogenesis by priming the transcriptional activation of key developmental
      genes, including Neurod2, Sox5, Auts2, and Nfib.
    explanation: >-
      Identifies the specific transcriptional-priming mechanism and its downstream
      target genes.
  - reference: PMID:36798993
    reference_title: "MED13L and its disease-associated variants influence the dendritic development of cerebral cortical neurons in the mammalian brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Taken together, our results demonstrate that MED13L expression is relevant to
      corticogenesis and influences the dendritic branching characteristics of
      cortical excitatory neurons.
    explanation: >-
      Establishes a MED13L requirement for dendritic development in cortical
      excitatory neurons.
  downstream:
  - target: Intellectual disability
    description: >-
      Disrupted cortical neurogenesis and dendritic development underlie the core
      cognitive impairment.
  - target: Motor speech disorder
    description: >-
      Impaired corticogenesis in motor-speech networks produces the apraxia/dysarthria
      that dominates the MED13L communication phenotype.
  - target: Global developmental delay
    description: Early milestone acquisition is impaired across domains.
  - target: Generalized hypotonia
    description: >-
      Disrupted neurodevelopmental programs contribute to the near-universal hypotonia.
  - target: Motor delay
    description: Delayed acquisition of motor milestones, with mean walking age near 2 years.
  - target: Seizure
    description: >-
      Disrupted cortical network formation predisposes to seizures, disproportionately
      in missense carriers.
  - target: Gastrointestinal problems
    description: >-
      Hypotonia and impaired oromotor and gut motor control contribute to the
      gastrointestinal and feeding difficulties affecting over half of individuals.
  - target: Abnormality of the musculoskeletal system
    description: >-
      Distal limb, digit and foot deformities arise partly secondary to the central
      hypotonia and reduced motor loading.
  - target: Scoliosis
    description: >-
      Secondary to long-standing axial hypotonia, which is why spinal assessment is
      recommended at every visit.
  - target: Autistic behavior
    description: Neurobehavioral manifestations including autistic features.
  - target: Abnormal brain morphology
    description: >-
      Disturbed corticogenesis and myelination contribute to the MRI abnormalities

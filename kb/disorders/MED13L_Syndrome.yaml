  notes: >-
    MED13L syndrome is the most commonly reported Mediator kinase-module disorder, with
    over 100 individuals described in the literature and in registries (e.g., ~108
    MED13L participants in Simons Searchlight as of 2024). No population-based prevalence
    estimate is yet available.

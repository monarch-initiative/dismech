    reference_title: "Further confirmation of the MED13L haploinsufficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first patient has a de novo mutation in the splice acceptor site of exon 5 of
      MED13L. cDNA analysis showed this mutation results in an in-frame deletion,
      removing 15 amino acids in middle of the conserved MED13L N-terminal domain.
    explanation: >-
      cDNA-level confirmation of the splice consequence, one of the few MED13L alleles

pathophysiology:
- name: MED11 complex-stability failure
  description: >
    MED11 is a subunit of the head module of the Mediator complex. The recurrent homozygous
    C-terminal p.Arg109Ter variant does not abolish the protein but disrupts its conserved
    C-terminus, impairing binding to partner subunits and destabilizing the MED11-MED22-MED17
    four-helix bundle. This implicates Mediator-complex stability, rather than simple loss of
    protein, in brain development and neurodegeneration. MED11 belongs to the group of Mediator
    complex-associated disease genes.

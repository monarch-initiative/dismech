      label: regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:36001086
    reference_title: "A homozygous MED11 C-terminal variant causes a lethal neurodegenerative disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of the C-terminal of MED subunit 11 may affect its binding efficiency to other MED subunits, thus implicating the MED-complex stability in brain development and neurodegeneration."
    explanation: Establishes Mediator-complex destabilization as the disease mechanism.
  downstream:
  - target: Progressive neurodegeneration
    description: >-
      Mediator-complex destabilization disrupts developmental and maintenance transcription,
      producing progressive widespread neurodegeneration.
- name: Progressive neurodegeneration
  description: >
    Downstream of MED11 complex-stability failure, a severe neurodegenerative process produces
    congenital microcephaly, profound neurodevelopmental impairment, an exaggerated startle
    response, refractory myoclonic seizures, progressive widespread neurodegeneration, and
    premature death; neonatal respiratory failure is common.

name: MED11-Related Disorder
creation_date: '2026-07-31T00:00:00Z'
category: Mendelian
synonyms:
- Neurodegeneration with developmental delay, early respiratory failure, myoclonic seizures, and brain abnormalities
- NDDRSB
- MED11-related lethal neurodegenerative disease
description: >
  MED11-related disorder (NDDRSB) is a rare, lethal autosomal recessive neurodegenerative
  disorder caused by a recurrent homozygous C-terminal variant (p.Arg109Ter) in MED11, a subunit
  of the head module of the Mediator transcriptional coactivator complex. The truncation removes
  the conserved C-terminal residues and destabilizes the MED11-MED22-MED17 four-helix bundle,
  impairing Mediator-complex assembly. It is the most severe MEDopathy: affected individuals have
  congenital microcephaly, neonatal respiratory failure, profound neurodevelopmental impairment,
  an exaggerated startle response, refractory myoclonic seizures, progressive widespread
  neurodegeneration, and premature death. The variant does not abolish protein but disrupts the
  C-terminus, implicating Mediator-complex stability in brain development and neurodegeneration.

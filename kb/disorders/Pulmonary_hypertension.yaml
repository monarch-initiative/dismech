- accession: geo:GSE126322
  title: Remodeling of active endothelial enhancers is associated with aberrant gene-regulatory networks in pulmonary arterial hypertension [ChIP-seq]
  description: Pulmonary Arterial Hypertension (PAH) is a cardiovascular disease characterized by progressively increasing blood pressure as a result of obliteration and loss of pulmonary arteries. We have extracted pulmonary arterial endothelial cells from lungs of a cohort of PAH patients (n=10) and controls (n=9), cultured the cells for 3-5 passages, and performed chromatin (H3K27ac, H3K4me1, and H3K4me3 ChIP-Seq), expression (RNA-Seq) and chromatin interaction profiling (ChIA-PET). We observed a large-scale remodelling of the active chromatin landscape at enhancers while promoters and gene expression remained unchanged.

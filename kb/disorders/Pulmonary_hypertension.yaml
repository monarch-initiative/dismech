  - target: Tricuspid Regurgitation
    description: >-
      As the pressure-loaded right ventricle dilates, the tricuspid annulus is
      distorted and the leaflets no longer coapt.
    causal_link_type: DIRECT
  - target: Edema
    description: >-
      Once the right ventricle decompensates, raised right-sided filling
      pressures are transmitted into the systemic venous bed and produce
      dependent oedema.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Fatigue
    description: >-
      A right ventricle that cannot deliver an adequate cardiac output limits
      systemic oxygen delivery, which patients report as persistent tiredness.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Syncope
    description: >-
      When the fixed pulmonary vascular resistance prevents any rise in cardiac
      output on exertion, cerebral perfusion falls and exertional syncope
      results.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Chest Pain
    description: >-
      The hypertrophied, high-pressure right ventricle outgrows its coronary
      supply, and the resulting subendocardial ischaemia presents as chest pain.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Palpitations
    description: >-
      Right atrial and ventricular dilatation provides the substrate for the
      supraventricular arrhythmias that patients perceive as palpitations.

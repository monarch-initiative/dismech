- name: PVOD/PCH
  display_name: Pulmonary veno-occlusive disease and/or pulmonary capillary haemangiomatosis
  subtype_term:
    preferred_term: pulmonary veno-occlusive disease and/or pulmonary capillary haemangiomatosis
    term:
      id: MONDO:0018554
      label: pulmonary veno-occlusive disease and/or pulmonary capillary haemangiomatosis
  curated_in: Pulmonary_Veno_Occlusive_Disease_And_Or_Pulmonary_Capillary_Haemangiomatosis
  description: >
    The pulmonary venous and capillary form, and the reason EIF2AK4 appears in
    this entry's genetic section: bi-allelic EIF2AK4 variants cause the
    hereditary forms of PVOD and PCH, which are recessive and a separate entity
    from the dominant arterial disease the other eight genes cause. It is
    curated in full at
    kb/disorders/Pulmonary_Veno_Occlusive_Disease_And_Or_Pulmonary_Capillary_Haemangiomatosis.yaml.
  genes:
  - preferred_term: EIF2AK4
    term:
      id: hgnc:19687
      label: EIF2AK4
  evidence:
  - reference: PMID:29540357
    reference_title: "Pulmonary arterial hypertension: pathogenesis and clinical management."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Independent studies examining families with autosomal recessive forms of
      either PVOD or PCH identified bi-allelic mutations ofEIF2AK4 (orGCN2), the
      gene encoding eukaryotic translation initiation factor 2 α kinase, as the
      mutation underlying the hereditary forms of these conditions.
    explanation: >-
      Source for the EIF2AK4 binding on this row and for the recessive
      inheritance that separates this stratum from the dominant arterial
      disease. The snippet is quoted exactly as the cached record holds it,
      including the two places where the record's text joins a word to the
      following gene symbol.
- name: Secondary Pulmonary Hypertension
  description: Pulmonary hypertension that occurs as a result of other diseases such as left heart disease, chronic lung disease, or thromboembolic disease.
  review_notes: >-
    MONDO does not have a single term for "secondary pulmonary hypertension" as it
    is
    a clinical classification. Specific secondary causes have individual terms:
    MONDO:0013024 (chronic thromboembolic), MONDO:0017157 (due to lung disease/hypoxia).

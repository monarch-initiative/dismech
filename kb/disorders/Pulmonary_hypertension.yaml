name: Pulmonary_hypertension
creation_date: '2025-12-04T16:57:31Z'
description: >-
  Pulmonary hypertension is a hemodynamic disorder defined by abnormally elevated
  mean pulmonary arterial pressure. In pulmonary arterial hypertension,
  endothelial dysfunction and an imbalance of vasoactive mediators drive
  vasoconstriction and obstructive remodeling of the small pulmonary arteries
  (heritable forms involve BMPR2 and related TGF-beta pathway genes); other
  groups arise from left heart disease, lung disease, or chronic thromboembolism.
  Rising pulmonary vascular resistance imposes right ventricular overload,
  leading to right heart failure.
category: Cardiovascular Disorder
parents:
- Heart Disease
- Lung Disease
has_subtypes:
- name: Pulmonary Arterial Hypertension (PAH)
  subtype_term:
    preferred_term: pulmonary arterial hypertension
    term:
      id: MONDO:0015924
      label: pulmonary arterial hypertension
  description: A type of pulmonary hypertension characterized by high blood pressure in the arteries that supply the lungs, often idiopathic or associated with other conditions.
  children:
  - Heritable PAH
  - Idiopathic PAH
  - PVOD/PCH
- name: Heritable PAH
  display_name: Heritable pulmonary arterial hypertension (HPAH)
  subtype_term:
    preferred_term: heritable pulmonary arterial hypertension
    term:
      id: MONDO:0017148
      label: heritable pulmonary arterial hypertension
  curated_in: Heritable_Pulmonary_Arterial_Hypertension
  description: >
    The Mendelian stratum of pulmonary arterial hypertension, and the home of
    every gene listed in this entry's genetic section. This row binds the eight
    that cause the arterial disease; EIF2AK4, the ninth, is bound on the
    PVOD/PCH row below because the disease it causes is a venous and capillary
    one. All nine are curated in full at
    kb/disorders/Heritable_Pulmonary_Arterial_Hypertension.yaml, which carries
    them plus GDF2, ATP13A3, KDR and CAPNS1, seven gene-defined subtype rows,
    and a ten-node pathograph that twelve of those thirteen genes reach. This row is a pointer so the stratum stays discoverable from the
    umbrella; the mechanism content deliberately lives there and is not
    duplicated here.

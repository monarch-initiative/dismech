notes: >
  The nine genes in this entry's genetic section are all pulmonary arterial
  hypertension genes, and all nine are already curated at
  kb/disorders/Heritable_Pulmonary_Arterial_Hypertension.yaml - which carries
  four more (GDF2, ATP13A3, KDR, CAPNS1), seven gene-defined subtype rows, and
  a ten-node pathograph with twelve of its thirteen genes wired into it. None of
  the nine reaches a mechanism node here. That is the correct state for a
  clinical umbrella, not a wiring gap to close: building the molecular cascade
  on this entry would duplicate the child entry rather than curate anything,
  and a flat gene list on an entry this heterogeneous says less than the pointer
  does. The three strata that hold the genetics are therefore
  recorded here as curated_in pointer rows under the existing pulmonary arterial
  hypertension row - Heritable PAH, Idiopathic PAH and PVOD/PCH - each bound to
  its own MONDO term, each a descendant of this entry's MONDO:0005149, and each
  naming the entry where its mechanism is curated. EIF2AK4 in particular belongs with
  the PVOD/PCH row: it causes a recessive venous and capillary disease, which
  this entry's own association text for that gene already said.

  MONDO:0013458, the hyperuricemia-pulmonary hypertension-renal failure-alkalosis
  (HUPRA) syndrome caused by SARS2, is filed by MONDO below this entry's term
  and is deliberately not curated as a subtype of it. MONDO does file it as a direct
  child of MONDO:0005149, but it gives it two further parents - inherited renal
  tubular disease (MONDO:0015962) and mitochondrial oxidative phosphorylation
  disorder (MONDO:0016387) - and the concept is a multisystem mitochondrial
  aminoacyl-tRNA synthetase disorder of infancy in which pulmonary hypertension
  is one of four cardinal features alongside hyperuricaemia, progressive renal
  failure and metabolic alkalosis. A has_subtypes row here would assert that it
  is a kind of pulmonary hypertension, which it is not; it is a disease that has
  pulmonary hypertension. The knowledge base already reasons about the term at
  kb/disorders/SARS1-Related_Neurodevelopmental_Disorder.yaml, where it is a
  differential_diagnoses row written to stop the SARS1/SARS2 paralogue
  confusion, and that row records its MONDO classification under mitochondrial
  oxidative phosphorylation and inherited renal tubular disease. A
  differential_diagnoses row does not retire a concept from the MONDO curation
  queue, so stubs/Hyperuricemia-pulmonary_Hypertension-renal_Failure-alkalosis_Syndrome.yaml was added to say the disease needs its own
  entry rather than a row here. Nothing here cites the HUPRA clinical
  literature: the placement rests on the term's MONDO classification and on the
  differential named above, and a curator taking the stub on should start from
  the primary reports.

  Two defects recorded and deliberately not changed, because both would move
  something other entries or projects may reference. This entry's top-level
  name is the file-stem form
  "Pulmonary_hypertension" rather than a display name, and its single prevalence
  record is prevalence_class RARE with the deprecated free-text percentage field
  and no measure_type, which is hard to defend for an umbrella whose commonest
  forms are secondary to left heart and lung disease.
discussions:
- discussion_id: openq_ph_glp1_direct_mechanism
  prompt: >-
    Do GLP-1 receptor agonists act directly on the pulmonary vasculature to
    produce any benefit in pulmonary hypertension, and if so through which
    pathway: inflammatory signalling, endothelial nitric oxide, endothelin-1,
    or mitochondrial regulation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  rationale: >-
    GLP-1 receptor expression in pulmonary arterial smooth muscle is shown in
    human and non-human primate tissue, but available studies do not establish
    that it is higher there than in systemic vascular smooth muscle. The four
    candidate pathways in the prompt come from the review's general synthesis
    of GLP-1 receptor signalling, not from PH-specific data. Liraglutide
    reduced right ventricular pressures and remodelling in monocrotaline- and
    hypoxia-induced models that mainly resemble Group 1 PAH, and semaglutide
    improved right ventricular mitochondrial measures in a pressure-overload
    model. Human evidence is observational or indirect from HFpEF studies,
    enriched for Group 2 or unclassified PH, and lacks catheterization-confirmed
    PH endpoints. The authors conclude the evidence supports a mechanistic
    hypothesis and a preclinical signal, not clinical efficacy in PH.
  evidence:
  - reference: PMID:42747605
    reference_title: "GLP-1 Receptor Agonists in Pulmonary Hypertension: Mechanistic Rationale, Preclinical Evidence, and Clinical Knowledge Gaps."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Current evidence supports a mechanistic hypothesis and a preclinical signal, not clinical efficacy in PH."
    explanation: The review's conclusion that a direct mechanism and clinical benefit in PH are unproven, which is the open question this discussion records.
  - reference: PMID:42747605
    reference_title: "GLP-1 Receptor Agonists in Pulmonary Hypertension: Mechanistic Rationale, Preclinical Evidence, and Clinical Knowledge Gaps."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "available studies do not establish greater expression in pulmonary than systemic vascular smooth muscle"
    explanation: Supports the rationale's statement that pulmonary-selective GLP-1 receptor expression is not established.
  - reference: PMID:42747605
    reference_title: "GLP-1 Receptor Agonists in Pulmonary Hypertension: Mechanistic Rationale, Preclinical Evidence, and Clinical Knowledge Gaps."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In monocrotaline- and hypoxia-induced models that primarily resemble Group 1 pre-capillary pulmonary arterial hypertension (PAH), liraglutide reduced right ventricular pressures or hypertrophy and pulmonary vascular remodelling"
    explanation: The review's summary of the preclinical signal; graded OTHER because the review reports other studies' animal results rather than performing them.
  - reference: PMID:42747605
    reference_title: "GLP-1 Receptor Agonists in Pulmonary Hypertension: Mechanistic Rationale, Preclinical Evidence, and Clinical Knowledge Gaps."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "available human evidence is observational or derived indirectly from HFpEF studies, involves populations likely enriched for Group 2 or unclassified PH, and lacks prespecified, catheterization-confirmed PH endpoints"
    explanation: Supports the rationale's description of the human evidence as indirect and lacking haemodynamic PH endpoints.
review_notes: Pulmonary hypertension is a complex condition characterized by elevated blood pressure in the pulmonary arteries, leading to right heart strain and failure over time. Symptoms are diverse, with dyspnea, fatigue, and chest pain being common presentations. Diagnosis typically involves imaging and hemodynamic assessments, while treatment focuses on reducing pulmonary pressures and improving symptoms.

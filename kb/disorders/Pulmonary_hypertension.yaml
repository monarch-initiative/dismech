    endothelium and endocardial cells, which does not describe the pulmonary artery.
    GO:0001837 epithelial to mesenchymal transition, used in an earlier draft, asserts an
    epithelial substrate that the endothelial cell annotated here is not. Note also that the
    evidence cited on this node supports endothelial dysfunction rather than the transition
    itself, so the description's mention of it rests on the wider literature rather than on
    a quoted source here.

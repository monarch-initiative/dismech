  evidence:
  - reference: PMID:31406341
    reference_title: "Molecular genetic framework underlying pulmonary arterial hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although familial PAH most often has an autosomal-dominant pattern of
      inheritance, cases of incomplete penetrance and evidence of genetic
      heterogeneity support a model of PAH as a Mendelian disorder with complex
      disease features.
    explanation: >-
      Establishes the heritable stratum as a Mendelian, autosomal-dominant and
      genetically heterogeneous entity, which is what makes it a distinct
      subtype of this umbrella rather than a description of it. Evidence source
      is OTHER because the publication is a review.
  - reference: PMID:31406341
    reference_title: "Molecular genetic framework underlying pulmonary arterial hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the past 6 years, additional pathways involved in PAH susceptibility
      have been described through the identification of deleterious genetic
      variants in potassium channels (KCNK3 and ABCC8) and transcription factors
      (TBX4 and SOX17), among others.
    explanation: >-
      Sources four of the genes bound on this row and groups them by the
      mechanism class each acts through - channel versus transcription factor -
      which is the division the target entry's pathograph models and the reason
      the genes are not collapsed onto one node anywhere. Evidence source is
      OTHER because the publication is a review.
  review_notes: >-
    ABCC8 is named by the cited review as a PAH susceptibility gene and is a
    genetic record on neither this entry nor the target entry. It is not added
    here because this row is a pointer; it belongs on
    Heritable_Pulmonary_Arterial_Hypertension, where the other susceptibility
    genes are recorded.

- accession: geo:GSE314466
  title: Global knockout of melanoma differentiation-associated protein 5 protects mice from chronic hypoxia/SU5416-induced pulmonary hypertension
  description: Pulmonary arterial hypertension (PAH) is a severe disease affecting the pulmonary arteries, causing increased blood pressure due to narrowing of the pulmonary artery lumen. Aberrant proliferation of endothelial cells (ECs) and smooth muscle cells (SMCs), along with a dysregulation of the immune response, contributes to arterial remodeling. We hypothesized that the cytosolic RNA receptor melanoma differentiation-associated protein 5 (MDA5) contributes to PAH by dysregulating pulmonary vascular cell function and immune cell response. In lung tissue from control patients and PAH patients, MDA5 immunoreactivity was widely distributed throughout the pulmonary artery wall.

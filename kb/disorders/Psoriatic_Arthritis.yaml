- accession: ega:EGAS00001006288
  title: Combined – whole blood and skin fibroblasts - transcriptomic analysis in Psoriatic arthritis.
  description: Whole blood RNA sequencing was performed longitudinally in 27 subjects with PsA at the beginning, one month and six months after treatment and response to therapy was defined at 6 months. As control groups 7 healthy individuals and 9 subjects with rheumatoid arthritis were recruited combined with public RNA-sequencing datasets from patients with psoriasis and systemic lupus erythematous. Differential expression analysis and weighted gene co-expression network analysis were performed to identify gene expression signatures, while deconvolution and flow cytometry to characterize the peripheral blood immune cell profile.

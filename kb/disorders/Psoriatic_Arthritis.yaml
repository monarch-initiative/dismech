- name: Disordered Bone Remodeling
  description: >-
    Psoriatic arthritis is characterized by paradoxical bone pathology with
    concurrent osteoclast-mediated periarticular erosion/osteolysis and
    pathologic juxta-articular new bone formation (enthesophytes and
    syndesmophytes), distinguishing it from rheumatoid arthritis. Circulating
    RANKL and M-CSF promote osteoclastogenesis and correlate with radiographic
    erosion and osteolysis scores, whereas entheseal mesenchymal activation via
    Wnt/BMP, PGE2, IL-17, and IL-22 drives periosteal bone apposition.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: Osteoclast differentiation
    modifier: INCREASED
    term:

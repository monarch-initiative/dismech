      explanation: PsA risk alleles map preferentially to open regulatory chromatin in primary CD8+ memory T cells.
  - target: Enthesitis as a Primary Event
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Genetic susceptibility lowers thresholds to biomechanical stress and
      danger signals at entheses, predisposing to innate and IL-23/Th17-driven
      entheseal inflammation.

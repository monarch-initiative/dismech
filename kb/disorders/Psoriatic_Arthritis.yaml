    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dactylitis was documented in 260 patients (48%); 69% of the episodes were recorded at presentation to the clinic. Dactylitis affected feet only in 65% of cases, hands only in 24%, and both hands and feet in 12%."
    explanation: Prospective cohort of 537 PsA patients documents dactylitis in 48% overall, involving the hands in 36% of dactylitis cases (~17% of the cohort).

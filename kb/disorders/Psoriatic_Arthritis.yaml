pathophysiology:
- name: MHC Class I and IL-23/Th17 Susceptibility Variants
  description: >-
    Germline susceptibility variants across MHC class I alleles (HLA-C*06:02,
    HLA-B*27) and non-MHC immune signaling loci (IL23R, IL12B, TRAF3IP2, TYK2)
    confer genetic predisposition to psoriatic arthritis, enriching in open
    chromatin of CD8+ memory T cells and sensitizing antigen presentation and
    IL-23/IL-17/TYK2 signaling pathways to biomechanical and mucosal triggers.
  biological_scale: MOLECULAR

    explanation: Activated T-cell infiltrates drive inflammatory processes across both joint tissues and psoriatic skin.
- name: Gut Dysbiosis and the Skin-Joint-Gut Axis
  description: >-
    Gut microbiome dysbiosis contributes to psoriatic arthritis pathogenesis
    through altered immune homeostasis, imbalance of short- and medium-chain
    fatty acid-producing bacteria, and increased intestinal permeability. The
    co-occurrence of PsA with inflammatory bowel disease supports a shared
    gut-skin-joint inflammatory axis.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: Inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954

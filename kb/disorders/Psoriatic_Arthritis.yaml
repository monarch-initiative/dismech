  downstream:
  - target: CD8+ and Th17 Lymphocyte Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      MHC class I antigen-presentation alleles and IL-23/Th17/TYK2
      susceptibility variants lower activation thresholds of CD8+ memory T
      cells and Th17 lymphocytes.
    evidence:

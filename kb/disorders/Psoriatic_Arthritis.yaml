- name: Enthesitis as a Primary Event
  description: >-
    Enthesitis at tendon and ligament insertion sites is a hallmark lesion of
    psoriatic arthritis and often an initiating musculoskeletal event: lowered
    thresholds to physiological mechanical stress trigger local PGE2 release,
    chemokine expression, influx of innate immune cells and activation of
    resident IL-23-responsive T cells and group 3 innate lymphoid cells
    producing IL-17 and TNF-alpha, with extension across the synovio-entheseal
    complex and digits.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: group 3 innate lymphoid cell
    term:
      id: CL:0001071
      label: group 3 innate lymphoid cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response

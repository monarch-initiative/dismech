environmental:
- name: Obesity
  description: >-
    Elevated body mass index displays a dose-dependent prospective association
    with incident psoriatic arthritis both among patients with psoriasis and in
    the general population, compounded by adipose overproduction of
    pro-inflammatory cytokines including TNF-alpha, IL-1, IL-6, and IL-8.
  exposure_term:
    preferred_term: obesity and elevated body mass index
  notes: >-
    ECTO and XCO have no human risk-factor term for obesity or elevated body
    mass index (OLS searches of ecto and xco for "obesity" and "body mass"
    returned 0 matches).
  disease_effect: PREDISPOSES
  causal_role: RISK_FACTOR
  influences_mechanisms:
  - target: Cytokine Pathway Activation
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Adipose tissue in obese individuals overproduces TNF-alpha, IL-1, IL-6,
      and IL-8, amplifying systemic and musculoskeletal pro-inflammatory
      cytokine signaling.
    evidence:
    - reference: PMID:22586165
      reference_title: "Obesity and the risk of psoriatic arthritis: a population-based study."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "The adipose tissue in obese individuals is a site of overproduction of important inflammatory cytokines such as tumour necrosis factor α, interleukin 1, IL-6 and IL-8, 9 10 and the resulting abnormal inflammatory milieu may contribute to the pathophysiology of psoriatic conditions."
      explanation: Adipose cytokine overproduction (TNF-alpha, IL-1, IL-6, IL-8) contributes to systemic inflammatory amplification in psoriatic disease.
  evidence:
  - reference: PMID:22586165
    reference_title: "Obesity and the risk of psoriatic arthritis: a population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with psoriasis patients with BMI <25 kg/m(2), the RRs for developing PsA were 1.09 (0.93-1.28) for BMIs from 25.0 to 29.9, 1.22 (1.02-1.47) for BMIs from 30.0 to 34.9 and 1.48 (1.20-1.81) for BMIs ≥35.0."
    explanation: Population-based cohort of 75,395 psoriasis patients demonstrates a graded BMI-dependent increase in incident PsA risk.
- name: Mechanical Stress and Physical Trauma (Deep Koebner Phenomenon)
  description: >-
    Biomechanical loading and physical microtrauma at tendon/ligament insertion
    sites and synovio-entheseal complexes act as local triggers of enthesitis
    and peripheral arthritis in genetically susceptible individuals ('deep
    Koebner' phenomenon).
  exposure_term:
    preferred_term: mechanical stress and physical trauma
  notes: >-
    ECTO and XCO lack a human biomechanical-loading or physical-trauma exposure
    term (OLS searches of ecto and xco for "mechanical", "trauma", and "injury"
    returned 0 ECTO terms and only experimental animal injury or clinical
    mechanical-ventilation/restraint terms in XCO).
  disease_effect: TRIGGERS
  causal_role: COMPONENT_CAUSE
  influences_mechanisms:
  - target: Enthesitis as a Primary Event
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Mechanical loading and physical trauma at entheses directly initiate
      exaggerated local inflammatory responses and enthesitis in PsA.
    evidence:
    - reference: PMID:32159793
      reference_title: "Enthesitis in psoriatic arthritis (Part 1): pathophysiology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Exaggerated inflammatory responses to mechanical stress in patients with PsA lead to initiation of enthesitis."
      explanation: Directly links biomechanical stress at entheses to initiation of enthesitis in PsA.
  evidence:
  - reference: PMID:32159793
    reference_title: "Enthesitis in psoriatic arthritis (Part 1): pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In such patients, long-standing inflammation may be triggered by mechanical stress or trauma [13]."
    explanation: Mechanical stress or physical trauma triggers persistent musculoskeletal inflammation in susceptible PsA patients.
  - reference: PMID:21715249
    reference_title: "Psoriatic arthritis: from a dermatological perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The triggering role of physical stress is seen in the \"deep Koebner\" phenomenon, which causes inflammation in the synovial membrane and in enthesis, resulting in peripheral arthritis."
    explanation: Characterizes physical stress via the deep Koebner phenomenon as a trigger of enthesitis and synovitis in PsA.
diagnosis:
- name: CASPAR Clinical Classification Assessment
  description: >-
    Clinical evaluation using the ClASsification criteria for Psoriatic
    ARthritis (CASPAR): established inflammatory articular disease (joint,
    spine, or entheseal) plus at least 3 points from current psoriasis (2
    points), personal or family history of psoriasis, dactylitis,
    juxta-articular new bone formation on plain radiographs, rheumatoid factor
    negativity, and psoriatic nail dystrophy (specificity 98.7%, sensitivity
    91.4%).
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:16871531
    reference_title: "Classification criteria for psoriatic arthritis: development of new criteria from a large international study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CASPAR (ClASsification criteria for Psoriatic ARthritis) criteria consisted of established inflammatory articular disease with at least 3 points from the following features: current psoriasis (assigned a score of 2; all other features were assigned a score of 1), a history of psoriasis (unless current psoriasis was present), a family history of psoriasis (unless current psoriasis was present or there was a history of psoriasis), dactylitis, juxtaarticular new bone formation, rheumatoid factor negativity, and nail dystrophy."
    explanation: Prospective multicenter study of 588 PsA cases and 536 inflammatory arthritis controls establishing the CASPAR criteria.
- name: Conventional Radiography of Peripheral and Axial Joints
  description: >-
    Plain radiographs of hands, feet, spine, and sacroiliac joints are the
    standard baseline imaging modality to evaluate characteristic PsA
    structural lesions including juxta-articular new bone formation (a CASPAR
    criterion), periarticular erosions, joint-space narrowing, and osteolysis.
  diagnosis_term:
    preferred_term: X-Ray Imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:39421802
    reference_title: "Imaging in psoriatic arthritis: established methods and emerging techniques."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Radiography is the standard method for assessment of joint disease in PsA since it is affordable, accessible, and safe."
    explanation: Establishes conventional radiography as the standard baseline imaging modality for joint disease assessment in PsA.
  - reference: PMID:20796300
    reference_title: "Circulating mediators of bone remodeling in psoriatic arthritis: implications for disordered osteoclastogenesis and bone erosion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiographs were scored for erosion, joint-space narrowing, osteolysis, and new bone formation."
    explanation: Plain radiography of the hands and feet quantifies erosions, joint-space narrowing, osteolysis, and juxta-articular new bone formation in PsA.
- name: Musculoskeletal Ultrasonography
  description: >-
    High-resolution grayscale and Doppler musculoskeletal ultrasonography
    sensitively detects and monitors peripheral PsA synovitis, enthesitis,
    tenosynovitis, dactylitis, and cortical structural lesions prior to plain
    radiographic changes.
  diagnosis_term:
    preferred_term: Ultrasound Imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:39421802
    reference_title: "Imaging in psoriatic arthritis: established methods and emerging techniques."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "US exhibits high sensitivity in detecting, characterizing, and monitoring pathologies related to PsA, including synovitis, enthesitis, tenosynovitis, and dactylitis."
    explanation: Supports musculoskeletal ultrasonography for sensitive detection and monitoring of peripheral PsA synovitis, enthesitis, tenosynovitis, and dactylitis.
  - reference: PMID:39421802
    reference_title: "Imaging in psoriatic arthritis: established methods and emerging techniques."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "US is a sensitive method for detecting peripheral PsA inflammation and structural lesions."
    explanation: Confirms high sensitivity of ultrasonography for peripheral inflammatory and structural lesions in PsA.
- name: Magnetic Resonance Imaging
  description: >-
    Magnetic resonance imaging detects and quantifies peripheral synovitis,
    tenosynovitis, enthesitis, bone marrow edema (osteitis), erosions, and bone
    proliferation, and serves as the most sensitive modality for active
    inflammatory sacroiliitis and spondylitis in axial PsA.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:39421802
    reference_title: "Imaging in psoriatic arthritis: established methods and emerging techniques."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "High-resolution MRI can detect and quantify inflammatory synovitis, tenosynovitis, and osteitis as well as enthesitis, bone erosions, bone proliferation, and JSN."
    explanation: Supports MRI for detecting and quantifying both soft-tissue/osseous inflammation and structural joint damage in PsA.
  - reference: PMID:39421802
    reference_title: "Imaging in psoriatic arthritis: established methods and emerging techniques."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "While MRI generally has lower resolution than CT and as a result slightly poorer sensitivity in identifying axial PsA (axPsA) structural lesions, it is the most sensitive technique in identifying the inflammatory component of sacroiliitis, spondylitis, and enthesitis."
    explanation: Establishes MRI as the most sensitive imaging modality for axial inflammatory sacroiliitis, spondylitis, and enthesitis in PsA.
treatments:
- name: Conventional Synthetic DMARD Therapy
  description: >-
    Conventional synthetic disease-modifying antirheumatic drugs, with
    methotrexate preferred, initiated rapidly in active peripheral arthritis as
    first-line disease-modifying therapy before biologic escalation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  target_mechanisms:
  - target: CD8+ and Th17 Lymphocyte Activation
    treatment_effect: INHIBITS
    description: >-
      Methotrexate suppresses T-lymphocyte activation and synovial inflammatory
      infiltration in active peripheral PsA.
    evidence:
    - reference: PMID:38499325
      reference_title: "EULAR recommendations for the management of psoriatic arthritis with pharmacological therapies: 2023 update."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In patients with peripheral arthritis, rapid initiation of conventional synthetic disease-modifying antirheumatic drugs is recommended and methotrexate preferred."
      explanation: 2023 EULAR guidelines recommend rapid initiation of methotrexate for active peripheral inflammatory arthritis in PsA.
  evidence:
  - reference: PMID:38499325
    reference_title: "EULAR recommendations for the management of psoriatic arthritis with pharmacological therapies: 2023 update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In patients with peripheral arthritis, rapid initiation of conventional synthetic disease-modifying antirheumatic drugs is recommended and methotrexate preferred."
    explanation: The 2023 EULAR recommendations advise rapid initiation of conventional synthetic DMARDs with methotrexate preferred for peripheral arthritis in psoriatic arthritis.
- name: TNF Inhibitor Biologic Therapy
  description: >-
    Monoclonal and receptor-fusion tumor necrosis factor inhibitors
    (adalimumab, infliximab, etanercept) control peripheral arthritis,
    enthesitis, dactylitis, and axial spondylitis, with monoclonal TNF
    inhibitors specifically preferred when uveitis or inflammatory bowel
    disease is present.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: anti-TNF biologic therapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
    - preferred_term: infliximab
      term:
        id: NCIT:C1789
        label: Infliximab
    - preferred_term: etanercept
      term:
        id: NCIT:C2381
        label: Etanercept
  target_mechanisms:
  - target: Cytokine Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      Neutralizes TNF-alpha signaling across synovial, entheseal, axial, skin,
      intestinal, and uveal tissues.
    evidence:
    - reference: PMID:29893226
      reference_title: "The pathogenesis of psoriatic arthritis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Cytokine inhibitors, mainly those specific for tumour necrosis factor and, more recently, the interleukin 23-T-helper-17 cell pathway, have been highly successful in the treatment of disease manifestations in several different tissues"
      explanation: Anti-TNF biologics suppress TNF-driven multi-tissue inflammation in PsA.
  evidence:
  - reference: PMID:23818708
    reference_title: "Dactylitis in psoriatic arthritis: prevalence and response to therapy in the biologic era."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate analysis showed that treatment with anti-TNF agents was a significant predictor of improvement in dactylitis at 12 months (relative risk 0.528, 95% CI 0.283-0.985, p = 0.045)."
    explanation: Longitudinal PsA cohort evidence showing significant improvement of dactylitis with anti-TNF therapy.
  - reference: PMID:38499325
    reference_title: "EULAR recommendations for the management of psoriatic arthritis with pharmacological therapies: 2023 update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inflammatory bowel disease and uveitis, if present, should influence drug choices, with monoclonal tumour necrosis factor inhibitors proposed."
    explanation: EULAR 2023 recommendations specifically direct toward monoclonal TNF inhibitors when IBD or uveitis accompanies PsA.
- name: IL-17A Biologic Therapy
  description: >-
    Monoclonal antibodies selectively neutralizing interleukin-17A (secukinumab
    and ixekizumab) improve peripheral arthritis, enthesitis, dactylitis, axial
    disease, and skin/nail psoriasis, and are favored when relevant skin
    psoriasis is present.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: anti-IL-17A biologic therapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: secukinumab
      term:
        id: NCIT:C152315
        label: Secukinumab
    - preferred_term: ixekizumab
      term:
        id: NCIT:C174646
        label: Ixekizumab
  target_mechanisms:
  - target: Cytokine Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      Directly neutralizes IL-17A effector cytokine signaling downstream of
      both adaptive Th17 cells and TNF-independent innate mast cells.
    evidence:
    - reference: PMID:26135703
      reference_title: "Secukinumab, a human anti-interleukin-17A monoclonal antibody, in patients with psoriatic arthritis (FUTURE 2): a randomised, double-blind, placebo-controlled, phase 3 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A significantly higher proportion of patients achieved an ACR20 at week 24 with secukinumab 300 mg (54 [54%] patients; odds ratio versus placebo 6·81, 95% CI 3·42-13·56; p<0·0001), 150 mg (51 [51%] patients; 6·52, 3·25-13·08; p<0·0001)"
      explanation: Phase 3 FUTURE 2 trial demonstrates significant clinical efficacy of anti-IL-17A blockade with secukinumab in active PsA.
  evidence:
  - reference: PMID:26135703
    reference_title: "Secukinumab, a human anti-interleukin-17A monoclonal antibody, in patients with psoriatic arthritis (FUTURE 2): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subcutaneous secukinumab 300 mg and 150 mg improved the signs and symptoms of psoriatic arthritis, suggesting that secukinumab is a potential future treatment option for patients with this disorder."
    explanation: Phase 3 FUTURE 2 RCT evidence supporting secukinumab for active PsA.
  - reference: PMID:27553214
    reference_title: "Ixekizumab, an interleukin-17A specific monoclonal antibody, for the treatment of biologic-naive patients with active psoriatic arthritis: results from the 24-week randomised, double-blind, placebo-controlled and active (adalimumab)-controlled period of the phase III trial SPIRIT-P1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significantly more patients treated with ixekizumab achieved an ACR20 response with IXEQ2W (62.1%) or IXEQ4W (57.9%) than placebo (30.2%) (p≤0.001; non-responder imputation method)."
    explanation: Phase III SPIRIT-P1 trial demonstrates significant week-24 ACR20 efficacy of ixekizumab in biologic-naive active PsA.
  - reference: PMID:38499325
    reference_title: "EULAR recommendations for the management of psoriatic arthritis with pharmacological therapies: 2023 update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Relevant skin psoriasis should orient towards bDMARDs targeting interleukin (IL)-23p40, IL-23p19, IL-17A and IL-17A/F inhibitors."
    explanation: 2023 EULAR recommendations endorse IL-17A targeted bDMARDs, particularly when relevant skin psoriasis is active.
- name: IL-17A and IL-17F Dual Inhibitor Therapy (Bimekizumab)
  description: >-
    Bimekizumab is a humanized IgG1 monoclonal antibody that selectively
    neutralizes both interleukin-17A and interleukin-17F homodimers and
    heterodimers, achieving superior joint and skin responses in active PsA and
    recommended among IL-17-pathway bDMARDs in the 2023 EULAR guidelines.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: dual anti-IL-17A/IL-17F biologic therapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: bimekizumab
      term:
        id: NCIT:C171829
        label: Bimekizumab
  target_mechanisms:
  - target: Cytokine Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      Simultaneously neutralizes IL-17A and IL-17F effector cytokine signaling
      across synovial, entheseal, and cutaneous tissues.
    evidence:
    - reference: PMID:36493791
      reference_title: "Bimekizumab in patients with psoriatic arthritis, naive to biologic treatment: a randomised, double-blind, placebo-controlled, phase 3 trial (BE OPTIMAL)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Bimekizumab is a monoclonal IgG1 antibody that selectively inhibits interleukin (IL)-17A and IL-17F."
      explanation: Establishes dual selective neutralization of IL-17A and IL-17F by bimekizumab.
  evidence:
  - reference: PMID:36493791
    reference_title: "Bimekizumab in patients with psoriatic arthritis, naive to biologic treatment: a randomised, double-blind, placebo-controlled, phase 3 trial (BE OPTIMAL)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At week 16, significantly more patients receiving bimekizumab (189 [44%] of 431) reached ACR50 response versus placebo (28 [10%] of 281; odds ratio 7·1 [95% CI 4·6-10·9], p<0·0001; adalimumab 64 [46%] of 140)."
    explanation: Phase 3 BE OPTIMAL trial demonstrates significantly higher week-16 ACR50 response with bimekizumab versus placebo in biologic-naive PsA.
  - reference: PMID:38499325
    reference_title: "EULAR recommendations for the management of psoriatic arthritis with pharmacological therapies: 2023 update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Relevant skin psoriasis should orient towards bDMARDs targeting interleukin (IL)-23p40, IL-23p19, IL-17A and IL-17A/F inhibitors."
    explanation: 2023 EULAR recommendations include IL-17A/F dual blockade among recommended bDMARDs for PsA with relevant skin psoriasis.
- name: IL-23 Pathway Biologic Therapy
  description: >-
    Biologic monoclonal antibodies targeting the IL-23p19 subunit (guselkumab,
    risankizumab) or shared IL-12/23p40 subunit (ustekinumab) inhibit upstream
    IL-23-driven Th17 and innate lymphoid activation in active peripheral PsA
    and cutaneous psoriasis, including after prior TNF inhibitor exposure.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: anti-IL-23 biologic therapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: guselkumab
      term:
        id: NCIT:C150390
        label: Guselkumab
    - preferred_term: risankizumab
      term:
        id: NCIT:C152227
        label: Risankizumab
    - preferred_term: ustekinumab
      term:
        id: NCIT:C84237
        label: Ustekinumab
  target_mechanisms:
  - target: Cytokine Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      Blocks IL-23 receptor engagement via p19 or p40 subunit neutralization,
      suppressing downstream IL-17 and IL-22 production.
    evidence:
    - reference: PMID:32178765
      reference_title: "Guselkumab in patients with active psoriatic arthritis who were biologic-naive or had previously received TNFα inhibitor treatment (DISCOVER-1): a double-blind, randomised, placebo-controlled phase 3 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Guselkumab, a specific inhibitor of interleukin-23 (IL-23) via IL-23 p19 subunit binding, significantly improved psoriatic arthritis signs and symptoms with an acceptable safety profile in a phase 2 trial."
      explanation: Guselkumab selectively binds IL-23p19 to block IL-23 pathway signaling in PsA.
  evidence:
  - reference: PMID:32178765
    reference_title: "Guselkumab in patients with active psoriatic arthritis who were biologic-naive or had previously received TNFα inhibitor treatment (DISCOVER-1): a double-blind, randomised, placebo-controlled phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ACR20 at week 24 was achieved by significantly greater proportions of patients in the guselkumab every 4 weeks group (76 [59%] of 128 [95% CI 50-68]) and every 8 weeks group (66 [52%] of 127 ... ) than in the placebo group (28 [22%] of 126 ... ), with percentage differences versus placebo of 37% (95% CI 26-48) for the every 4 weeks group and 30% (19-41) for the every 8 weeks group (both p<0·0001)."
    explanation: Phase 3 DISCOVER-1 trial establishes clinical efficacy of guselkumab in biologic-naive and TNF-inhibitor-experienced PsA patients.
  - reference: PMID:34911706
    reference_title: "Efficacy and safety of risankizumab for active psoriatic arthritis: 24-week results from the randomised, double-blind, phase 3 KEEPsAKE 1 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At week 24, a significantly greater proportion of patients receiving risankizumab achieved the primary endpoint of ACR20 (57.3% vs placebo, 33.5%; p<0.001)."
    explanation: Phase 3 KEEPsAKE 1 trial demonstrates significant week-24 ACR20 efficacy of IL-23p19 inhibition with risankizumab in active PsA.
  - reference: PMID:23769296
    reference_title: "Efficacy and safety of ustekinumab in patients with active psoriatic arthritis: 1 year results of the phase 3, multicentre, double-blind, placebo-controlled PSUMMIT 1 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More ustekinumab-treated (87 of 205 [42·4%] in the 45 mg group and 101 of 204 [49·5%] in the 90 mg group) than placebo-treated (47 of 206 [22·8%]) patients achieved ACR20 at week 24 (p<0·0001 for both comparisons); responses were maintained at week 52."
    explanation: Phase 3 PSUMMIT 1 trial establishes clinical efficacy of IL-12/23p40 blockade with ustekinumab in active PsA.
  - reference: PMID:38499325
    reference_title: "EULAR recommendations for the management of psoriatic arthritis with pharmacological therapies: 2023 update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Relevant skin psoriasis should orient towards bDMARDs targeting interleukin (IL)-23p40, IL-23p19, IL-17A and IL-17A/F inhibitors."
    explanation: 2023 EULAR recommendations endorse IL-23p40 and IL-23p19 inhibitors for PsA, particularly with active skin psoriasis.
- name: JAK Inhibitor Therapy
  description: >-
    Oral Janus kinase inhibitors (tofacitinib and selective JAK1 inhibitor
    upadacitinib) inhibit intracellular JAK-STAT cytokine signaling,
    demonstrating phase III efficacy in OPAL Broaden/Beyond and SELECT-PsA 1,
    and are recommended primarily after bDMARD failure or when bDMARDs are
    inappropriate.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: JAK inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tofacitinib
      term:
        id: CHEBI:71200
        label: tofacitinib
    - preferred_term: upadacitinib
      term:
        id: NCIT:C152802
        label: Upadacitinib
  target_mechanisms:
  - target: Cytokine Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      Inhibits intracellular Janus kinase signal transduction downstream of
      multiple PsA pro-inflammatory cytokine receptors.
    evidence:
    - reference: PMID:30118353
      reference_title: "Tofacitinib for the treatment of psoriasis and psoriatic arthritis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Tofacitinib efficacy was demonstrated in PsA by the OPAL Broaden and OPAL Beyond phase-III studies, and received FDA and EMA approval."
      explanation: Phase III trial efficacy of oral JAK inhibition confirms intracellular JAK-STAT cytokine signaling as a therapeutic target in PsA.
  evidence:
  - reference: PMID:30118353
    reference_title: "Tofacitinib for the treatment of psoriasis and psoriatic arthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tofacitinib efficacy was demonstrated in PsA by the OPAL Broaden and OPAL Beyond phase-III studies, and received FDA and EMA approval."
    explanation: Phase III OPAL Broaden and OPAL Beyond trial evidence supporting tofacitinib in PsA.
  - reference: PMID:33789011
    reference_title: Trial of Upadacitinib and Adalimumab for Psoriatic Arthritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The percentage of patients who had an ACR20 response at week 12 was 70.6% with 15-mg upadacitinib, 78.5% with 30-mg upadacitinib, 36.2% with placebo (P<0.001 for both upadacitinib doses vs. placebo), and 65.0% with adalimumab."
    explanation: Phase 3 SELECT-PsA 1 trial demonstrates significant week-12 ACR20 superiority of upadacitinib over placebo and noninferiority of 15-mg upadacitinib to adalimumab.
  - reference: PMID:38499325
    reference_title: "EULAR recommendations for the management of psoriatic arthritis with pharmacological therapies: 2023 update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Use of Janus kinase inhibitors is proposed primarily after bDMARD failure, taking relevant risk factors into account, or in case bDMARDs are not an appropriate choice."
    explanation: EULAR 2023 positioning of JAK inhibitors after bDMARD failure in PsA management.
- name: PDE4 Inhibitor Therapy (Apremilast)
  description: >-
    Oral targeted synthetic phosphodiesterase 4 inhibition with apremilast
    elevates intracellular cAMP to downregulate pro-inflammatory cytokine
    expression while increasing IL-10, providing an oral option for active
    peripheral PsA (particularly milder oligoarticular disease with limited
    skin involvement or when bDMARDs/JAK inhibitors are unsuitable).
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

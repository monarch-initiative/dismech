    Genetically primed CD8+ memory T cells and T-helper 17 lymphocytes infiltrate
    synovial membranes and psoriatic skin and expand in response to mucosal and
    tissue triggers, driving adaptive T-cell-mediated musculoskeletal and
    cutaneous inflammation upstream of effector cytokine cascades.

    snippet: "Seven of these have previously been reported for psoriasis (MHC, TRAF3IP2, IL12B, IL23R, IL23A-STAT2, TNIP1, TYK2) (Table 1)."
    explanation: Immunochip association analysis of 1,962 PsA cases and 8,923 controls confirms genome-wide significant MHC and IL-23/Th17/TYK2 susceptibility loci.

      label: synovial joint
  - preferred_term: enthesis
    term:
      id: UBERON:0035845
      label: enthesis
  downstream:
  - target: Arthritis
    causal_link_type: DIRECT
    description: >-
      Periarticular bone erosion, joint-space narrowing, and juxta-articular
      new bone formation compound structural peripheral arthritis.
  - target: Spondylitis
    causal_link_type: DIRECT
    description: >-
      Axial syndesmophyte formation and sacroiliac bone remodeling contribute
      to structural spondylitis.
  - target: Osteolysis
    causal_link_type: DIRECT
    description: >-
      Heightened RANKL- and M-CSF-driven osteoclastogenesis causes severe
      periarticular bone resorption and osteolysis.
    evidence:
    - reference: PMID:20796300
      reference_title: "Circulating mediators of bone remodeling in psoriatic arthritis: implications for disordered osteoclastogenesis and bone erosion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In patients with PsA, M-CSF and RANKL, but not Dkk-1, concentrations positively correlated with radiographic erosion, joint-space narrowing, and osteolysis scores."
      explanation: Directly links circulating osteoclastogenic mediators M-CSF and RANKL to radiographic erosion and osteolysis in PsA patients.
  evidence:

- name: Innate Immune Activation and IL-17-Expressing Mast Cells
  description: >-
    Innate immune cells, particularly c-Kit-positive mast cells, play a
    predominant role in psoriatic synovial inflammation. Mast cells constitute
    the major IL-17-expressing cell population in spondyloarthritis synovium,
    and this mast cell/IL-17 axis operates independently of TNF blockade.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: IL-17 production
    modifier: INCREASED
    term:
      id: GO:0032620
      label: interleukin-17 production
  locations:
  - preferred_term: synovial membrane
    term:
      id: UBERON:0002018
      label: synovial membrane of synovial joint
  downstream:
  - target: Cytokine Pathway Activation
    causal_link_type: DIRECT
    description: >-
      Synovial mast cells are the dominant IL-17-producing population in
      spondyloarthritis synovium, and depleting their signaling ex vivo lowers
      IL-17 and other proinflammatory cytokines, placing this innate cell
      population upstream of cytokine pathway activation.
    evidence:
    - reference: PMID:21968742
      reference_title: "Interleukin-17-positive mast cells contribute to synovial inflammation in spondylarthritis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Ex vivo targeting of synovial mast cells with the c-Kit inhibitor imatinib mesylate significantly decreased the production of IL-17 as well as other proinflammatory cytokines in synovial tissue cultures."
      explanation: >-
        Inhibiting mast cell signaling ex vivo reduces synovial IL-17 and other
        proinflammatory cytokine output, supporting a causal contribution to
        cytokine pathway activation.
  evidence:
  - reference: PMID:21968742
    reference_title: "Interleukin-17-positive mast cells contribute to synovial inflammation in spondylarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mast cells expressed significantly more interleukin-17 (IL-17) in SpA than in RA synovitis, and mast cells constituted the major IL-17-expressing cell population in the SpA synovium"
    explanation: Human synovial biopsy analysis demonstrates mast cells as the major IL-17-expressing population in spondyloarthritis synovium.
  - reference: PMID:21968742

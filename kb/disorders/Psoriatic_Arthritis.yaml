- accession: dbgap:phs000982
  title: Genetic Analysis of Psoriasis and Psoriatic Arthritis
  description:  This study is a genome-wide study of genetic associations with psoriatic arthritis (PsA), an inflammatory musculoskeletal condition that develops in up to 30% of people who have chronic psoriasis skin lesions. 1,526 cases affected with psoriatic arthritis and 1,508 unaffected controls were recruited and typed on the Illumina HumanOmni1-Quad BeadChip array. After application of quality control measures to both samples and SNPs, genotypes for 791,217 autosomal SNPs were available for 1,430 PsA cases and 1,417 controls.

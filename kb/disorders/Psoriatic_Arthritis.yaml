- name: "Dactylitis (finger)"
  category: Musculoskeletal
  frequency: OCCASIONAL
  diagnostic: true
  description: >-
    Diffuse painful swelling of an entire finger ('sausage digit'); in a
    prospective cohort of 537 PsA patients, dactylitis occurred in 48% overall
    and involved the hands in 36% of dactylitis cases (24% hands only and 12%
    both hands and feet, corresponding to roughly 17% of all PsA patients), and
    is a scored item in the CASPAR classification criteria.
  notes: >-
    HPO represents dactylitis with separate finger (HP:0031090) and toe
    (HP:0031091) terms and has no parent Dactylitis term (OLS search of HP for
    "dactylitis").
  phenotype_term:

disease_term:
  preferred_term: psoriatic arthritis
  term:
    id: MONDO:0011849
    label: psoriatic arthritis
description: >-
  Psoriatic arthritis (PsA) is a chronic, seronegative, immune-mediated
  inflammatory spondyloarthropathy that presents with inflammation of the
  synovial joints and entheses, including those of the axial skeleton,
  generally occurring in individuals with cutaneous or nail psoriasis. Clinical
  domains comprise peripheral arthritis, enthesitis, dactylitis, axial
  spondylitis, and skin and nail psoriasis, with uveitis and inflammatory bowel
  disease as characteristic extra-articular associations. Genetic susceptibility
  involves MHC class I alleles (HLA-C*06:02 and HLA-B*27) together with
  non-MHC IL-23/Th17 and NF-kappaB signaling loci (IL23R, IL12B, TRAF3IP2,
  TYK2), interacting with biomechanical stress at entheses and gut dysbiosis to
  activate innate and adaptive IL-23/IL-17, TNF, and JAK-STAT pathways and drive
  paradoxical bone erosion alongside juxta-articular new bone formation.
notes: >-
  No ClinGen gene-disease validity assertion or GeneReviews chapter exists for
  psoriatic arthritis (MONDO:0011849; data/clingen/gene_validity.csv snapshot
  2026-10-04; Bookshelf index snapshot 2026-09-10).
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      Psoriatic arthritis is a seronegative spondyloarthritis and is covered
      with the immune-mediated, inflammatory, and rheumatologic disorders;
      this is its primary clinical home.
    evidence:
    - reference: PMID:36902329
      reference_title: "Psoriatic Arthritis: Pathogenesis and Targeted Therapies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Psoriatic arthritis (PsA), a heterogeneous chronic inflammatory immune-mediated disease characterized by musculoskeletal inflammation (arthritis, enthesitis, spondylitis, and dactylitis), generally occurs in patients with psoriasis."
      explanation: >-
        The review characterises PsA as a chronic inflammatory immune-mediated
        disease with musculoskeletal inflammation, which is the subject matter
        of Harrison's Immune-Mediated, Inflammatory, and Rheumatologic Part.
  - classification_value: DERMATOLOGY
    notes: >-
      PsA is defined by its association with psoriasis, and skin and nail
      disease is one of its core disease domains, which Harrison's covers
      separately in the dermatology Part.
    evidence:
    - reference: PMID:35761070
      reference_title: "Group for Research and Assessment of Psoriasis and Psoriatic Arthritis (GRAPPA): updated treatment recommendations for psoriatic arthritis 2021."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Literature searches covered treatments for the key domains of PsA: peripheral arthritis, axial disease, enthesitis, dactylitis, and skin and nail psoriasis"
      explanation: >-
        Skin and nail psoriasis constitute a core domain of psoriatic arthritis.

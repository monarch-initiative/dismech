  notes: Identified by GEO DataSets index search for Psoriatic Arthritis (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE266295
  title: A novel immunosenescent CD8+ T cell subset in patients with Ankylosing Spondylitis and Psoriatic Arthritis links spontaneous motility to telomere shortening and dysfunction
  description: 'Objectives: A pathogenetic role of CD8+ T lymphocytes in ankylosing spondylitis (AS) and other spondyloarthritis (SpA) is sustained by genome-wide association studies (GWAS) as well as the expansion of public T cell clonotypes in the target tissues. This study focuses on CD8+ T cells from AS and psoriatic arthritis (PsA) patients with the aim to correlate their phenotype and function with motility. Methods: Peripheral blood CD8+ and CD4+ T cells were isolated from AS (n= 128), PsA (n= 60) and rheumatoid arthritis (RA, n= 74) patients and healthy donors (HD, n= 79). Transwell migration assay was performed in the presence of different chemokines.'

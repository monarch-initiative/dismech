    supports: SUPPORT
    snippet: "Research has identified several immune-inflammatory pathways defined by cytokines (IL-23/IL-17, TNF), leading to the development of efficacious therapeutic targets."
    explanation: The abstract links cytokine pathways to targeted therapies in psoriatic arthritis.
  - reference: PMID:38499325
    reference_title: "EULAR recommendations for the management of psoriatic arthritis with pharmacological therapies: 2023 update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Relevant skin psoriasis should orient towards bDMARDs targeting interleukin (IL)-23p40, IL-23p19, IL-17A and IL-17A/F inhibitors."
    explanation: The 2023 EULAR recommendations direct biologic choice toward IL-23 and IL-17 targeted bDMARDs when relevant skin psoriasis is present.

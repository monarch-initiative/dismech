datasets:
- accession: geo:GSE277596
  title: Dissection of the immune landscape in Psoriatic Arthritis patients
  description: Despite significant advancements in psoriatic arthritis (PsA) treatment modalities, a considerable proportion of patients continue to experience persistent joint inflammation and functional impairment, unresponsive to the armamentarium of biological disease-modifying antirheumatic drugs (bDMARDs) or Janus kinase (JAK) inhibitors. The etiology of resistance in these cases is complex, likely involving intricate immunological and genetic factors which are currently mostly unknown. Identifying novel biomarkers and targets for refractory disease is urgently needed.
  organism:

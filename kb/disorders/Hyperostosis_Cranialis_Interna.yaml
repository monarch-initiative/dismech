name: Hyperostosis Cranialis Interna
creation_date: "2026-08-29T00:00:00Z"
category: Mendelian
synonyms:
- HCIN
- hyperostosis cranialis interna
description: >-
  Hyperostosis cranialis interna is an autosomal dominant sclerosing bone
  dysplasia in which the calvaria and skull base thicken progressively from the
  inside. As the bone grows inward it narrows the neuroforamina, and the disease
  presents as sequential entrapment of cranial nerves rather than as anything
  skeletal: loss of smell, visual and facial sensory impairment, recurrent facial
  palsy, hearing loss and vestibular areflexia, usually beginning in the second
  decade.

  Its defining feature is what it spares. This is the only genetic bone dysplasia
  confined to the craniofacial area; the rest of the skeleton is normal. That
  distinguishes it from the sclerosing dysplasias it otherwise resembles, van
  Buchem disease, sclerosteosis, craniometaphyseal dysplasia and
  Camurati-Engelmann disease, all of which involve the long bones. Two other
  observations sharpen the picture: the thickening is almost entirely of the
  inner table, and the deposited bone is less dense than normal cortical bone, so
  this is not simply more of the same tissue. Histology shows increased bone
  formation with normal tissue architecture, and biochemical markers are normal.

  The molecular cause is a dominant L441R substitution in SLC39A14, which encodes
  the zinc transporter ZIP14. The mutant protein is not trafficked to the plasma
  membrane and instead accumulates zinc inside the cell, which hyperactivates
  cAMP-CREB and NFAT signalling. Conditional mice overexpressing the equivalent
  allele in osteoblasts reproduce the cellular mechanism, with a marked increase
  in cortical thickness from enhanced endosteal bone formation.

  They reproduce it in the wrong bones. The thickening appears in the long bones,
  while the calvaria, the one site that defines the human disease, shows no
  phenotype at all: calvarial thickness and porosity are not significantly
  different from controls. The authors say they were surprised by this and call
  it truly opposite to what is seen in patients. The same calvarial sparing
  appears in the plain Zip14 null, so it is not an artefact of the knock-in
  construct. The open question this leaves is therefore not why the human disease
  is confined to the skull, but why murine calvariae appear protected from a
  zinc-handling lesion that affects the rest of the same animal's skeleton.

  The model also shows something the human disease does not: osteoporotic
  trabecular bone alongside the thickened long-bone cortex. The authors note this
  mirrors the disparate actions of oestrogen on the two bone compartments.
  Whether HCI patients have an unrecognised trabecular phenotype, or whether this
  is an artefact of overexpression, is unresolved and is recorded as a gap rather
  than assumed either way.

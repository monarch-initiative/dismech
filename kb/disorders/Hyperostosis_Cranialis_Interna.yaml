  features: >-
    A dominant L441R missense substitution, found by whole-exome sequencing. The
    gene lies within the 8p21 interval to which the disease had earlier been
    mapped by linkage, and the three candidate genes examined at that time, BMP1,
    LOXL2 and ADAM28, were excluded by sequencing. That earlier work correctly
    predicted the answer would be a gene not previously implicated in sclerosing
    bone dysplasia.
  evidence:
  - reference: PMID:29621230
    reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identified by whole-exome sequencing a dominant mutation (L441R) in
      SLC39A14 (ZIP14).
    explanation: Identifies the causal gene and allele.
  - reference: PMID:23640157
    reference_title: Localization of the gene for hyperostosis cranialis interna to chromosome 8p21 with analysis of three candidate genes.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linkage analysis in a family with HCI resulted in the localization of the
      disease-causing gene to a region on chromosome 8p21 delineated by markers
      D8S282 and D8S382.
    explanation: >-
      Records the linkage interval that preceded gene identification. Graded
      PARTIAL because it localises without identifying, and its three candidate
      genes were all subsequently excluded.
prevalence:
- population: Three related Dutch families
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The disease has been described essentially in one extended kindred: three
    related Dutch families with common progenitors, 32 individuals across five
    generations, with 12 affected over four generations in one report and 13
    affected in another. Isolated case reports have since appeared. No population
    prevalence exists.
  evidence:
  - reference: PMID:23640157
    reference_title: Localization of the gene for hyperostosis cranialis interna to chromosome 8p21 with analysis of three candidate genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Until today the disease has been described in only three related Dutch
      families with common progenitors and which consist of 32 individuals over
      five generations. HCI was observed in 12 family members over four
      generations.
    explanation: >-
      States the entire reported cohort at the time, which is the basis for the
      cohort caveat recorded in this entry's notes.
differential_diagnoses:
- name: Hyperostosis frontalis interna
  description: >-
    Thickening of the inner table of the frontal bone, common, usually
    incidental, and strongly associated with older women. It is a radiological
    finding rather than a Mendelian disease, and it is the entity most often
    confused with this one in the literature.
  distinguishing_features:
  - Confined to the frontal bone rather than involving the calvaria and skull base together
  - Not familial
  - Does not narrow the neuroforamina or produce cranial nerve deficits
  - No SLC39A14 variant
  notes: >-
    This is the sense-B usage described in this entry's notes. Case reports using
    the phrase hyperostosis cranialis interna for this finding are not evidence
    about the Mendelian disease.
- name: Van Buchem disease and sclerosteosis
  description: >-
    Sclerosing bone dysplasias of the SOST pathway that also thicken the skull
    and entrap cranial nerves, and are therefore the closest genuine mimics.
  distinguishing_features:
  - Both involve the long bones as well as the skull, which hyperostosis cranialis interna does not
  - Sclerosteosis additionally features syndactyly and gigantism
  evidence:
  - reference: PMID:23640157
    reference_title: Localization of the gene for hyperostosis cranialis interna to chromosome 8p21 with analysis of three candidate genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Examples are Van Buchem disease, sclerosteosis, craniometaphyseal
      dysplasia, and Camurati-Engelmann disease. However, in these cases the long
      bones are affected as well.
    explanation: >-
      Names the mimicking dysplasias and states the discriminator, long-bone
      involvement.
- name: Craniometaphyseal dysplasia and Camurati-Engelmann disease
  description: >-
    Further sclerosing dysplasias with craniofacial hyperostosis and cranial
    nerve compromise.
  distinguishing_features:
  - Both affect the long bones
  - Craniometaphyseal dysplasia by definition involves the metaphyses
  - Camurati-Engelmann disease involves the diaphyses
  evidence:
  - reference: PMID:23640157
    reference_title: Localization of the gene for hyperostosis cranialis interna to chromosome 8p21 with analysis of three candidate genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Examples are Van Buchem disease, sclerosteosis, craniometaphyseal
      dysplasia, and Camurati-Engelmann disease. However, in these cases the long
      bones are affected as well.
    explanation: >-
      Lists both among the sclerosing dysplasias distinguished by long-bone
      involvement.

progression:
- phase: Presymptomatic radiological phase
  notes: >-
    Hyperostosis is detectable on imaging before any deficit appears. This is the
    window the management recommendation targets, since decompression is advised
    in the presymptomatic period in high-risk individuals, and it is the reason
    at-risk relatives are imaged and monitored rather than merely counselled.
- phase: Early symptomatic phase
  age_range: second decade
  notes: >-
    First symptoms typically appear in the second decade. Facial nerve
    involvement is often recurrent rather than fixed at this stage, which is what
    makes it the point at which decompression can still preserve function.
  evidence:
  - reference: PMID:20140965
    reference_title: "Phenotypic manifestations and management of hyperostosis cranialis interna, a hereditary bone dysplasia affecting the calvaria and the skull base."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      its first symptoms often presenting during the second decade
    explanation: Gives the typical age at which deficits begin.
- phase: Established deficit phase
  notes: >-
    Progressive bone overgrowth converts recurrent deficits into fixed ones as
    successive nerves are compromised. Facial and vestibulocochlear dysfunction
    dominate.
  evidence:
  - reference: PMID:20140965
    reference_title: "Phenotypic manifestations and management of hyperostosis cranialis interna, a hereditary bone dysplasia affecting the calvaria and the skull base."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The progressive bone overgrowth causes entrapment and dysfunction of
      cranial nerves I, II, V, VII, and VIII
    explanation: >-
      Describes the progressive entrapment that defines this phase.
  review_notes: >-
    A plateau after the fourth decade is described in the deep-research report
    and would matter clinically, because it would close the intervention window
    this entry's treatment logic is built around. It is not curated as its own
    phase because no cached source states it, and a phase boundary asserted
    without a citation would be exactly the kind of claim this entry otherwise
    avoids. Worth adding if a source is located.

diagnosis:
- name: Cranial Computed Tomography
  description: >-
    The diagnostic test. Computed tomography shows thickening concentrated in the
    inner table across frontal, parietal, temporal and occipital regions, and
    measures the neuroforamina whose narrowing produces the symptoms. It also
    shows the feature that distinguishes this bone from ordinary hyperostosis:
    the deposited tissue is less attenuated than normal cortical bone. Because
    the disease is progressive and decompression is advised before deficits are
    established, imaging has a surveillance role in at-risk relatives and not
    only a diagnostic one.
  diagnosis_term:
    preferred_term: Computed Tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  results: >-
    Thickening of the inner table of the calvaria and skull base with reduced
    attenuation relative to normal cortical bone, and narrowing of the
    neuroforamina, in a skeleton that is otherwise normal.
  evidence:
  - reference: PMID:22194361
    reference_title: Imaging features and progression of hyperostosis cranialis interna.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linear measurements were performed of the inner table, the medulla, and the
      outer table of different skull locations, and attenuation (density)
      measurements of the same regions were recorded. Neuroforamina widths were
      recorded as well.
    explanation: >-
      Describes the measurements that constitute the radiological diagnosis,
      including the neuroforaminal widths that predict nerve compromise.
  notes: >-
    Skeletal survey is worth stating as a negative: the rest of the skeleton is
    normal, and that normality is what separates this disease from van Buchem
    disease, sclerosteosis, craniometaphyseal dysplasia and Camurati-Engelmann
    disease, all of which involve the long bones.
- name: Neurophysiological and Audiovestibular Monitoring
  description: >-
    Surveillance is what makes the treatment logic work. The entry's management
    argument is to decompress before a nerve is lost, which requires detecting
    encroachment while it is still reversible. The recommended panel is tone and
    speech audiometry, brainstem evoked response audiometry and vestibular
    testing for the eighth nerve, with visual evoked potentials for the optic
    nerve alongside radiological and ophthalmological examination.

    The single most useful measure is the BERA I-V interpeak latency, which the
    source states can determine nerve encroachment reliably. Blink and masseter
    reflexes are explicitly not advised for routine use, because the symmetrical
    bilateral nature of the disease degrades their sensitivity to 25-37.5 percent
    and a single registration is correspondingly uninformative.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  results: >-
    Increased hearing thresholds and increased BERA latency in 60 to 70 percent
    of affected subjects, vestibular abnormalities in about half, and preserved
    otoacoustic emissions throughout.
  evidence:
  - reference: PMID:23622937
    reference_title: Neurophysiologic, audiometric and vestibular function tests in patients with hyperostosis cranialis interna.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we advise monitoring of vestibulocochlear nerve function with tone and
      speech audiometry, BERA and vestibular tests. VEPs are important to monitor
      optic nerve function in combination with radiological and ophthalmologic
      examination. We do not advise the routine use of blink and masseter reflex.
    explanation: >-
      States the recommended monitoring panel and, equally usefully, the two
      tests that are not worth doing.
  - reference: PMID:23622937
    reference_title: Neurophysiologic, audiometric and vestibular function tests in patients with hyperostosis cranialis interna.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The inter-peak latency I-V parameter in BERA has the ability to determine
      nerve encroachment reliably.
    explanation: >-
      Identifies the single measure that detects nerve encroachment, which is the
      decision the surveillance exists to inform.
  notes: >-
    The NCIT binding is imperfect and flagged rather than hidden. This is a panel
    of evoked-potential and audiovestibular tests, not electroencephalography;
    NCIT:C38054 Electroencephalography is the nearest reachable
    clinical-procedure term for evoked-potential recording, and no term covering
    the composite panel exists. A curator may reasonably prefer to split this
    into separate entries or leave it unbound.
- name: Molecular Confirmation of SLC39A14
  description: >-
    Identifying the SLC39A14 variant confirms the diagnosis and, more usefully,
    identifies at-risk relatives before symptoms appear. That matters here more
    than in most sclerosing dysplasias, because the management recommendation is
    to decompress accessible nerves in the presymptomatic period in high-risk
    individuals, which requires knowing who they are.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29621230
    reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identified by whole-exome sequencing a dominant mutation (L441R) in
      SLC39A14 (ZIP14).
    explanation: >-
      Establishes the testable molecular lesion.
  notes: >-
    Biochemical testing does not contribute. Bone turnover parameters are normal
    in patients, so there is no laboratory signature to screen on and the
    diagnosis rests on imaging plus genotype.

animal_models:
- name: Osteoblast-conditional L438R Zip14 knock-in mouse
  species: Mouse
  genotype: Conditional knock-in overexpressing L438R Zip14 in osteoblasts
  publication: PMID:29621230
  description: >-
    Conditional knock-in mice overexpressing the mouse equivalent of the human
    L441R allele, restricted to osteoblasts. They develop a severe skeletal
    phenotype with a drastic increase in cortical thickness driven by enhanced
    endosteal bone formation, which is the pathology seen in patients. They also
    develop an osteoporotic trabecular phenotype that the human disease is not
    known to show.
  evidence:
  - reference: PMID:29621230
    reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Conditional knock-in mice overexpressing L438R Zip14 in osteoblasts have a
      severe skeletal phenotype marked by a drastic increase in cortical
      thickness due to an enhanced endosteal bone formation, resembling the
      underlying pathology in HCI patients.
    explanation: >-
      Establishes the model and the authors' own claim that it resembles the
      human pathology.
  modeled_mechanisms:
  - target: Enhanced Endosteal Bone Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the cortical arm of the disease, and does so cell-autonomously
      in osteoblasts, which is what establishes the osteoblast as the effector
      cell.
    limitations: >-
      Three limits. The construct overexpresses the mutant allele rather than
      carrying it at endogenous dose, so the severity is not comparable to a
      patient's. The phenotype is generalised skeletal rather than confined to
      the skull, which is the single most distinctive feature of the human
      disease and the one the model does not reproduce. And the mice develop
      osteoporotic trabecular bone, which is not a described feature of HCI, so
      the model adds a phenotype as well as missing one.
    readouts:
    - name: Cortical thickness
      target: Enhanced Endosteal Bone Formation
      direction: INCREASED
      interpretation: >-
        The cortical arm of the human phenotype, reproduced by the same endosteal
        mechanism.
      evidence:
      - reference: PMID:29621230
        reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          a drastic increase in cortical thickness due to an enhanced endosteal
          bone formation
        explanation: Reports the cortical measurement behind this readout.
    - name: Trabecular bone mass
      target: Enhanced Endosteal Bone Formation
      direction: DECREASED
      interpretation: >-
        A divergence from the human disease rather than a confirmation of it. The
        authors interpret the opposite effects on the two compartments as
        mirroring the disparate actions of oestrogen.
      evidence:
      - reference: PMID:29621230
        reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Remarkably, L438R Zip14 also generates an osteoporotic trabecular bone
          phenotype.
        explanation: >-
          Reports the trabecular finding. Graded PARTIAL because it is a model
          observation with no human counterpart established.
treatments:
- name: Surgical Decompression of Entrapped Cranial Nerves
  therapeutic_modality: SURGERY
  description: >-
    The only treatment that addresses the actual injury. Because the nerve damage
    is mechanical and progressive, the recommendation is to decompress accessible
    nerves early in the symptomatic period, or even before symptoms in high-risk
    family members, rather than to wait for established deficit. Reported
    procedures include bilateral decompression of the internal auditory canals
    and middle-fossa facial nerve decompression. Nothing treats the underlying
    bone overgrowth.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Cranial nerve compression
    term:
      id: HP:0001293
      label: Cranial nerve compression
  - preferred_term: Facial palsy secondary to cranial hyperostosis
    term:
      id: HP:0007285
      label: Facial palsy secondary to cranial hyperostosis
  evidence:
  - reference: PMID:20140965
    reference_title: "Phenotypic manifestations and management of hyperostosis cranialis interna, a hereditary bone dysplasia affecting the calvaria and the skull base."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical decompression of the accessible impaired cranial nerves is advised
      in the early symptomatic period or even in the presymptomatic period in
      high-risk individuals.
    explanation: >-
      States the recommendation and, importantly, its timing, which is the
      substantive clinical claim.
  - reference: PMID:19371457
    reference_title: "Facial nerve decompression via middle fossa approach for hyperostosis cranialis interna: a feasible therapeutic approach."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the use of bilateral surgical decompression of the internal
      auditory canals to treat hyperostosis cranialis interna in an eight-year-old
      girl presenting with bilateral facial palsy
    explanation: >-
      A worked example of the procedure. Graded PARTIAL because it is a single
      case demonstrating feasibility, not an outcome study.
  notes: >-
    Treatment is otherwise symptomatic. No medical therapy modifies the bone
    phenotype, and none has been trialled in this disease.
discussions:
- discussion_id: hci_mouse_lacks_cranial_confinement
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    What confines hyperostosis to the skull in patients, when the osteoblast
    conditional mouse develops a generalised skeletal phenotype?
  attaches_to:
  - pathophysiology#Calvarial and Skull Base Hyperostosis
  - animal_models#Mouse
  rationale: >-
    Cranial confinement is the defining feature of this disease and the one thing
    that separates it from every other sclerosing bone dysplasia. The mouse
    reproduces the cellular mechanism convincingly, cortical thickening by
    enhanced endosteal formation in osteoblasts, but not the anatomical
    restriction: its phenotype is generalised, and it additionally develops
    trabecular osteoporosis that patients are not described as having.

    So the model explains how the bone forms and not where. Candidate
    explanations are untested: regional differences in ZIP14 expression or zinc
    handling between neural-crest-derived cranial osteoblasts and mesoderm-derived
    axial ones; a modifier in the single kindred; or an artefact of
    overexpression, since the construct is not at endogenous dose. Distinguishing
    them would need an endogenous-dose knock-in and comparison of cranial against
    long-bone osteoblasts from the same animal.
  evidence:
  - reference: PMID:22194361
    reference_title: Imaging features and progression of hyperostosis cranialis interna.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HCI is the only genetic bone dysplasia known that is confined to the
      craniofacial area.
    explanation: >-
      Establishes cranial confinement as the defining human feature that the
      model does not reproduce.
  - reference: PMID:29621230
    reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Remarkably, L438R Zip14 also generates an osteoporotic trabecular bone
      phenotype.
    explanation: >-
      Documents a model phenotype with no described human counterpart, which is
      the second half of the mismatch.
- discussion_id: hci_single_kindred_generalisability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which features of the described phenotype belong to the disease and which
    belong to the kindred it was described in?
  attaches_to:
  - phenotypes#
  - prevalence#Three related Dutch families
  rationale: >-
    Essentially the whole clinical description rests on three related Dutch
    families with common progenitors. Everything an entry can say about which
    nerves are affected, in what order, at what age and how severely is therefore
    conditioned on one genetic background and one allele. No frequency band is
    asserted anywhere in this entry for that reason. Independent kindreds with
    different SLC39A14 alleles would be needed to separate disease from family,
    and until then the natural history recorded here should be read as the
    history of that pedigree.
  evidence:
  - reference: PMID:23640157
    reference_title: Localization of the gene for hyperostosis cranialis interna to chromosome 8p21 with analysis of three candidate genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Until today the disease has been described in only three related Dutch
      families with common progenitors
    explanation: >-
      States the limitation that the entire clinical description derives from one
      extended kindred.

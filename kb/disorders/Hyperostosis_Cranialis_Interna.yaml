notes: >-
  Sourcing note. The curation stub for this disease carried no causal gene, and
  that reflects the ontology rather than the literature. MONDO:0007765 currently
  carries a feature relation and a parent class and no causal-gene relation, so
  the stub enrichment had nothing to copy, while SLC39A14 was identified by
  whole-exome sequencing in 2018. The observation is recorded here for whoever
  maintains that mapping; this entry does not propose what should be done about
  it. The gene is treated as established on the strength of the identification
  report plus its conditional mouse models, and the earlier linkage work that
  placed the locus at 8p21 and excluded BMP1, LOXL2 and ADAM28 is retained as
  mapping history rather than presented as an open question.

  Named Entity Confusion hazard, and the reason one paper in the reference cache
  is not cited. The string "hyperostosis cranialis interna" is used in two
  incompatible senses. The first is this Mendelian disease: autosomal dominant,
  SLC39A14 p.Leu441Arg, described in one extended Dutch kindred. The second is a
  loose radiological label for sporadic thickening of the internal skull table,
  overlapping hyperostosis frontalis interna and Morgagni-Stewart-Morel syndrome,
  used in isolated case reports with no family history and no genetic testing.

  Only the first is this entry. PMID:40091967, a 2025 case report of
  cerebrospinal fluid leak, was fetched and read and is deliberately not cited:
  it describes the aetiology as unknown, which the 2018 gene identification
  superseded, and discusses the condition alongside hyperostosis frontalis
  interna without reporting genetic testing. A skull-base CSF leak is a
  plausible complication of skull-base hyperostosis and the observation may well
  be real, but using a second-sense case report to establish a phenotype of the
  first-sense disease is precisely the confusion this note exists to prevent.
  The same applies to the 2023 cadaveric report of hyperostosis
  fronto-parieto-occipitalis.

  Cohort note. Essentially the entire clinical description of this disease comes
  from three related Dutch families with common progenitors, 32 individuals over
  five generations, of whom 12 to 13 were affected. Every frequency and every
  natural-history statement in this entry inherits that limitation, and no
  frequency band is asserted anywhere for that reason. A single kindred cannot
  distinguish features of the disease from features of the family.
pathophysiology:
- name: SLC39A14 L441R Substitution
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A dominant missense substitution, L441R, in SLC39A14, identified by
    whole-exome sequencing. The gene encodes ZIP14, a zinc transporter that
    normally sits in the plasma membrane. The lesion is not loss of the
    transporter as such but loss of its correct location.
  gene:
    preferred_term: SLC39A14
    description: >-
      Encodes the ZIP14 zinc transporter; a dominant L441R substitution causes
      hyperostosis cranialis interna.
    term:
      id: hgnc:20858
      label: SLC39A14
  genetic_context:
    gene:
      preferred_term: SLC39A14
      term:
        id: hgnc:20858
        label: SLC39A14
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
    description: >-
      Heterozygous missense substitution acting dominantly. The functional
      category is left UNKNOWN deliberately: the allele causes mistrafficking and
      intracellular zinc accumulation with downstream signalling hyperactivation,
      which is neither simple loss of transporter function nor a clean gain, and
      no source classifies it.
  evidence:

- name: Calvarial and Skull Base Hyperostosis
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Thickening is significant across frontal, parietal, temporal and occipital
    regions and is mainly of the inner table. The deposited hyperostotic bone is
    less attenuated than normal cortical bone on computed tomography, which is a
    concrete sign that the excess tissue differs in quality and not only in
    quantity. The process is confined to the skull; the rest of the skeleton is
    unaffected, which is unique among genetic bone dysplasias.
  locations:
  - preferred_term: cranium
    term:
      id: UBERON:0003128
      label: cranium
  evidence:
  - reference: PMID:22194361
    reference_title: Imaging features and progression of hyperostosis cranialis interna.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was significant thickening of the skull in the frontal, parietal,
      temporal, and occipital regions, which was mainly due to thickening of the
      inner table of the skull. The attenuation of the deposited hyperostotic
      bone was lower than normal cortical bone.
    explanation: >-
      Quantifies the distribution of thickening and reports the reduced
      attenuation of the deposited bone.
  - reference: PMID:22194361
    reference_title: Imaging features and progression of hyperostosis cranialis interna.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HCI is the only genetic bone dysplasia known that is confined to the
      craniofacial area.
    explanation: >-
      States the sparing of the rest of the skeleton, the feature that separates
      this disorder from the sclerosing dysplasias it resembles.
  downstream:
  - target: Cranial Nerve Entrapment
    causal_link_type: DIRECT
    description: >-
      Inward bone growth narrows the neuroforamina through which the cranial
      nerves pass.
    evidence:
    - reference: PMID:22194361
      reference_title: Imaging features and progression of hyperostosis cranialis interna.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The observed radiologic abnormalities explain the possible impairment of
        the olfactory, optic, trigeminal, facial, and vestibulocochlear nerves.
      explanation: >-
        Connects the imaging findings directly to the specific cranial nerves
        affected.
- name: Cranial Nerve Entrapment
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Stenosis of the neuroforamina entraps cranial nerves I, II, V, VII and VIII,
    and this is how the disease presents. Symptoms typically begin in the second
    decade and progress, with facial and vestibulocochlear dysfunction reported
    most often. Because the compression is mechanical and progressive, the
    therapeutic logic is decompression before the nerve is lost rather than
    treatment of the bone.
  notes: >-
    No GO binding. GO:0021545 cranial nerve development was considered and
    rejected: it denotes the progression of cranial nerves from formation to
    mature structure, which is a developmental process. In this disease the
    nerves develop normally and are mechanically compressed in the second decade,
    so annotating development would assert a neurodevelopmental disorder that
    this is not. The node is anchored by its HP-bound phenotypes and by the
    cranium location on its parent node instead.
  evidence:
  - reference: PMID:20140965
    reference_title: "Phenotypic manifestations and management of hyperostosis cranialis interna, a hereditary bone dysplasia affecting the calvaria and the skull base."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The progressive bone overgrowth causes entrapment and dysfunction of
      cranial nerves I, II, V, VII, and VIII, its first symptoms often presenting
      during the second decade.
    explanation: >-
      Names the affected nerves and the typical age of onset.
  - reference: PMID:20140965
    reference_title: "Phenotypic manifestations and management of hyperostosis cranialis interna, a hereditary bone dysplasia affecting the calvaria and the skull base."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Facial and vestibulocochlear nerve dysfunction are most frequently reported.
    explanation: >-
      Identifies which nerve deficits dominate the presentation.

    preferred_term: Abnormality of the sense of smell
    term:
      id: HP:0004408
      label: Abnormality of the sense of smell
  evidence:
  - reference: PMID:23640157
    reference_title: Localization of the gene for hyperostosis cranialis interna to chromosome 8p21 with analysis of three candidate genes.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      nerve entrapment that leads to recurrent facial nerve palsy, disturbance of
      the sense of smell
    explanation: >-
      Reports disturbance of the sense of smell. The source does not grade its
      severity.
  notes: >-
    Bound to HP:0004408, defined as an anomaly in the ability to perceive and
    distinguish scents, because that is what the cited source reports: a
    disturbance of the sense of smell, neither graded nor described as complete.
    HP:0000458 Anosmia asserts inability and HP:0004409 Hyposmia asserts reduced
    sensitivity; the source states neither.

    One tension is recorded rather than hidden. The HPO disease annotation for
    OMIM:144755 carries HP:0000458 Anosmia, so a curator following the
    annotation rather than the cited sentence would bind differently. This entry
    follows the sentence because that is the evidence attached to this
    phenotype, while the Headache phenotype below is annotation-derived and says
    so.
- category: Ophthalmologic
  name: Visual Impairment
  description: >-
    Visual impairment from optic nerve entrapment at the optic canal.
  phenotype_term:
    preferred_term: Visual impairment
    term:
      id: HP:0000505
      label: Visual impairment
  evidence:
  - reference: PMID:23640157
    reference_title: Localization of the gene for hyperostosis cranialis interna to chromosome 8p21 with analysis of three candidate genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hearing and vision impairments, impairment of facial sensibility
    explanation: Reports vision impairment among the entrapment deficits.
- category: Neurologic
  name: Facial Hypoesthesia
  description: >-
    Reduced facial sensation from trigeminal nerve entrapment. The fifth nerve is
    named in the mechanism and in the entrapment list, and this phenotype records
    its clinical consequence.
  phenotype_term:
    preferred_term: Trigeminal anesthesia
    term:
      id: HP:0031912
      label: Trigeminal anesthesia
  evidence:
  - reference: PMID:23640157
    reference_title: Localization of the gene for hyperostosis cranialis interna to chromosome 8p21 with analysis of three candidate genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hearing and vision impairments, impairment of facial sensibility
    explanation: >-
      Reports impaired facial sensibility, the trigeminal deficit.
  notes: >-
    HP:0031912 is defined as decreased or absent sensation in the distribution of
    the trigeminal nerve, which supplies the face and mouth. It therefore covers
    the impairment of facial sensibility the source reports, and is the most
    specific term that accurately represents the claim. The generic
    HP:0033748 Hypoesthesia describes decreased touch anywhere in the body and
    loses the anatomy that makes this finding diagnostic.
- category: Ophthalmologic
  name: Optic Atrophy
  description: >-
    The structural correlate of second-nerve entrapment, complementing the
    functional visual impairment curated above.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  notes: >-
    Curated from the HPO disease annotation for OMIM:144755, recorded as
    provenance rather than quoted. The annotation records no frequency, and none
    is asserted here.
- category: Neurologic
  name: Headache
  description: >-
    Headache is reported in this disease. No mechanism is asserted here: the
    attribution to raised intracranial and ocular pressure appears in secondary
    sources but is not supported by anything in this entry's reference cache, and
    stating it would be an uncited causal claim.
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  notes: >-
    Curated from the HPO disease annotation for OMIM:144755, recorded as
    provenance rather than quoted, since HPOA is a derived annotation. No
    frequency band is asserted, consistent with the rest of this entry: the
    annotation derives from the same single kindred, so a fraction here would
    describe that family rather than the disease.

    An Orphanet record, ORPHA:443098, attributes the headache to raised ocular
    and intracranial pressure and would supply a quotable row for that mechanism.
    It is not curated because the Orphanet bulk XML is not present in this
    checkout and fetching it would add manifest churn unrelated to this entry.
    Worth adding when someone next refreshes that source.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant, established across four generations of three related
    Dutch families with common progenitors.
  evidence:
  - reference: PMID:20140965
    reference_title: "Phenotypic manifestations and management of hyperostosis cranialis interna, a hereditary bone dysplasia affecting the calvaria and the skull base."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disorder appears to have an autosomal-dominant transmission pattern.
    explanation: States the inheritance pattern from the pedigree analysis.
genetic:
- name: SLC39A14
  gene_term:
    preferred_term: SLC39A14
    term:
      id: hgnc:20858
      label: SLC39A14
  association: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    A dominant L441R missense substitution, found by whole-exome sequencing. The
    gene lies within the 8p21 interval to which the disease had earlier been
    mapped by linkage, and the three candidate genes examined at that time, BMP1,
    LOXL2 and ADAM28, were excluded by sequencing. That earlier work correctly
    predicted the answer would be a gene not previously implicated in sclerosing
    bone dysplasia.

    The variant is reported as NM_001128431.4:c.1322T>G, p.Leu441Arg, in exon 8,
    and appears in ClinVar as VCV000523143 classified Pathogenic. That record's
    review status is no assertion criteria provided, which is the honest weak
    point in an otherwise strong gene-disease case and is recorded here rather
    than left for a reader to discover.
  evidence:
  - reference: PMID:29621230
    reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identified by whole-exome sequencing a dominant mutation (L441R) in
      SLC39A14 (ZIP14).
    explanation: Identifies the causal gene and allele.
  - reference: PMID:23640157
    reference_title: Localization of the gene for hyperostosis cranialis interna to chromosome 8p21 with analysis of three candidate genes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linkage analysis in a family with HCI resulted in the localization of the
      disease-causing gene to a region on chromosome 8p21 delineated by markers
      D8S282 and D8S382.
    explanation: >-
      Records the linkage interval that preceded gene identification. Localises
      the gene without identifying it, hence INDIRECT; its three candidate genes
      were all subsequently excluded.
prevalence:
- population: Three related Dutch families
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The disease has been described essentially in one extended kindred: three
    related Dutch families with common progenitors, 32 individuals across five
    generations, with 12 affected over four generations in one report and 13
    affected in another. Isolated case reports have since appeared. No population
    prevalence exists.
  evidence:
  - reference: PMID:23640157
    reference_title: Localization of the gene for hyperostosis cranialis interna to chromosome 8p21 with analysis of three candidate genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Until today the disease has been described in only three related Dutch
      families with common progenitors and which consist of 32 individuals over
      five generations. HCI was observed in 12 family members over four
      generations.
    explanation: >-
      States the entire reported cohort at the time, which is the basis for the
      cohort caveat recorded in this entry's notes.
differential_diagnoses:
- name: Hypermanganesemia with dystonia 2
  disease_term:
    preferred_term: hypermanganesemia with dystonia 2
    term:
      id: MONDO:0014864
      label: hypermanganesemia with dystonia 2
  description: >-
    The other SLC39A14 disease, and the reason this entry carries a differential
    that shares no phenotype with it. Biallelic loss-of-function variants in the
    same gene cause an autosomal recessive manganese transporter defect
    presenting as rapidly progressive childhood-onset parkinsonism-dystonia,
    with no skeletal involvement.
  distinguishing_features:
  - Autosomal recessive, not dominant
  - Loss of manganese transport, not mistrafficking with intracellular zinc accumulation
  - Neurological presentation in childhood, with no hyperostosis and no cranial nerve entrapment
  - Chelation with disodium calcium edetate lowers blood manganese and can produce striking improvement
  evidence:
  - reference: PMID:27231142
    reference_title: Mutations in SLC39A14 disrupt manganese homeostasis and cause childhood-onset parkinsonism-dystonia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identified a cohort of patients with a novel autosomal recessive manganese
      transporter defect caused by mutations in SLC39A14
    explanation: >-
      Establishes that the same gene causes a recessive manganese-transport
      disease distinct from this one.
  - reference: PMID:27231142
    reference_title: Mutations in SLC39A14 disrupt manganese homeostasis and cause childhood-onset parkinsonism-dystonia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chelation with disodium calcium edetate lowers blood manganese levels in
      patients and can lead to striking clinical improvement.
    explanation: >-
      Establishes that the recessive disease is treatable by chelation, which is
      the fact that makes the allelic boundary a safety matter rather than a
      taxonomic one.
  notes: >-
    This is a gene collision rather than a name collision, and it cuts the
    opposite way from the naming hazard recorded in this entry's notes. A
    curator or clinician reasoning from the gene symbol could carry the
    chelation therapy across the boundary. It does not transfer: that treatment
    addresses manganese overload from a recessive transport failure, whereas the
    lesion here is a dominant mistrafficking allele causing intracellular zinc
    accumulation, and no chelation evidence exists for it.

- name: Hyperostosis frontalis interna
  description: >-
    Thickening of the inner table of the frontal bone, common, usually
    incidental, and strongly associated with older women. It is a radiological
    finding rather than a Mendelian disease, and it is the entity most often
    confused with this one in the literature.
  distinguishing_features:
  - Confined to the frontal bone rather than involving the calvaria and skull base together
  - Not familial
  - Does not narrow the neuroforamina or produce cranial nerve deficits
  - No SLC39A14 variant
  notes: >-
    This is the sense-B usage described in this entry's notes. Case reports using
    the phrase hyperostosis cranialis interna for this finding are not evidence
    about the Mendelian disease.
- name: Van Buchem disease and sclerosteosis
  description: >-
    Sclerosing bone dysplasias of the SOST pathway that also thicken the skull
    and entrap cranial nerves, and are therefore the closest genuine mimics.
  distinguishing_features:
  - Both involve the long bones as well as the skull, which hyperostosis cranialis interna does not
  - Sclerosteosis additionally features syndactyly and gigantism
  evidence:
  - reference: PMID:23640157
    reference_title: Localization of the gene for hyperostosis cranialis interna to chromosome 8p21 with analysis of three candidate genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Examples are Van Buchem disease, sclerosteosis, craniometaphyseal
      dysplasia, and Camurati-Engelmann disease. However, in these cases the long
      bones are affected as well.
    explanation: >-
      Names the mimicking dysplasias and states the discriminator, long-bone
      involvement.
- name: Craniometaphyseal dysplasia and Camurati-Engelmann disease
  description: >-
    Further sclerosing dysplasias with craniofacial hyperostosis and cranial
    nerve compromise.
  distinguishing_features:
  - Both affect the long bones
  - Craniometaphyseal dysplasia by definition involves the metaphyses
  - Camurati-Engelmann disease involves the diaphyses
  evidence:
  - reference: PMID:23640157
    reference_title: Localization of the gene for hyperostosis cranialis interna to chromosome 8p21 with analysis of three candidate genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Examples are Van Buchem disease, sclerosteosis, craniometaphyseal
      dysplasia, and Camurati-Engelmann disease. However, in these cases the long
      bones are affected as well.
    explanation: >-
      Lists both among the sclerosing dysplasias distinguished by long-bone
      involvement.

progression:
- phase: Presymptomatic radiological phase
  notes: >-
    Hyperostosis is detectable on imaging before any deficit appears. This is the
    window the management recommendation targets, since decompression is advised
    in the presymptomatic period in high-risk individuals, and it is the reason
    at-risk relatives are imaged and monitored rather than merely counselled.
- phase: Early symptomatic phase
  age_range: second decade
  notes: >-
    First symptoms typically appear in the second decade. Facial nerve
    involvement is often recurrent rather than fixed at this stage, which is what
    makes it the point at which decompression can still preserve function.
  evidence:
  - reference: PMID:20140965
    reference_title: "Phenotypic manifestations and management of hyperostosis cranialis interna, a hereditary bone dysplasia affecting the calvaria and the skull base."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      its first symptoms often presenting during the second decade
    explanation: Gives the typical age at which deficits begin.
- phase: Established deficit phase
  notes: >-
    Progressive bone overgrowth converts recurrent deficits into fixed ones as
    successive nerves are compromised. Facial and vestibulocochlear dysfunction
    dominate.
  evidence:
  - reference: PMID:20140965
    reference_title: "Phenotypic manifestations and management of hyperostosis cranialis interna, a hereditary bone dysplasia affecting the calvaria and the skull base."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The progressive bone overgrowth causes entrapment and dysfunction of
      cranial nerves I, II, V, VII, and VIII
    explanation: >-
      Describes the progressive entrapment that defines this phase.
  review_notes: >-
    A plateau after the fourth decade is described in the deep-research report
    and would matter clinically, because it would close the intervention window
    this entry's treatment logic is built around. It is not curated as its own
    phase because no cached source states it, and a phase boundary asserted
    without a citation would be exactly the kind of claim this entry otherwise
    avoids. Worth adding if a source is located.

diagnosis:
- name: Cranial Computed Tomography
  description: >-
    The diagnostic test. Computed tomography shows thickening concentrated in the
    inner table across frontal, parietal, temporal and occipital regions, and
    measures the neuroforamina whose narrowing produces the symptoms. It also
    shows the feature that distinguishes this bone from ordinary hyperostosis:
    the deposited tissue is less attenuated than normal cortical bone. Because
    the disease is progressive and decompression is advised before deficits are
    established, imaging has a surveillance role in at-risk relatives and not
    only a diagnostic one.
  diagnosis_term:
    preferred_term: Computed Tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  results: >-
    Thickening of the inner table of the calvaria and skull base with reduced
    attenuation relative to normal cortical bone, and narrowing of the
    neuroforamina, in a skeleton that is otherwise normal.
  evidence:
  - reference: PMID:22194361
    reference_title: Imaging features and progression of hyperostosis cranialis interna.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linear measurements were performed of the inner table, the medulla, and the
      outer table of different skull locations, and attenuation (density)
      measurements of the same regions were recorded. Neuroforamina widths were
      recorded as well.
    explanation: >-
      Describes the measurements that constitute the radiological diagnosis,
      including the neuroforaminal widths that predict nerve compromise.
  notes: >-
    Skeletal survey is worth stating as a negative: the rest of the skeleton is
    normal, and that normality is what separates this disease from van Buchem
    disease, sclerosteosis, craniometaphyseal dysplasia and Camurati-Engelmann
    disease, all of which involve the long bones.
- name: Audiometric Testing
  description: >-
    Tone and speech audiometry is the first arm of vestibulocochlear
    surveillance, and it is what detects the hearing loss while it is still
    progressing. Increased hearing thresholds were found in 60 to 70 percent of
    affected subjects.
  diagnosis_term:
    preferred_term: Audiometric Test
    term:
      id: NCIT:C38036
      label: Audiometric Test
  results: >-
    Increased hearing thresholds in 60 to 70 percent of affected subjects, with
    otoacoustic emissions preserved because the cochlea is not affected.
  evidence:
  - reference: PMID:23622937
    reference_title: Neurophysiologic, audiometric and vestibular function tests in patients with hyperostosis cranialis interna.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we advise monitoring of vestibulocochlear nerve function with tone and
      speech audiometry, BERA and vestibular tests.
    explanation: >-
      Recommends tone and speech audiometry as part of vestibulocochlear
      monitoring.
  - reference: PMID:23622937
    reference_title: Neurophysiologic, audiometric and vestibular function tests in patients with hyperostosis cranialis interna.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased hearing thresholds and increased BERA latency times were found in
      60-70%.
    explanation: >-
      Quantifies the yield of audiometric and brainstem-response testing, which
      is the statistic this entry's results field reports.
- name: Brainstem Evoked Response Audiometry
  description: >-
    The single most useful measure in this disease. The I-V interpeak latency
    determines nerve encroachment reliably, which is precisely the decision the
    surveillance exists to inform, since the management argument is to decompress
    before a nerve is lost.
  diagnosis_term:
    preferred_term: Evoked Response Audiometry
    term:
      id: NCIT:C85857
      label: Evoked Response Audiometry
  results: >-
    Increased BERA latency times in 60 to 70 percent of affected subjects; the
    I-V interpeak latency identifies nerve encroachment.
  evidence:
  - reference: PMID:23622937
    reference_title: Neurophysiologic, audiometric and vestibular function tests in patients with hyperostosis cranialis interna.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The inter-peak latency I-V parameter in BERA has the ability to determine
      nerve encroachment reliably.
    explanation: >-
      Identifies the measure that detects nerve encroachment.
- name: Vestibular Testing and Visual Evoked Potentials
  description: >-
    Electronystagmography covers the vestibular half of eighth-nerve function,
    with abnormalities in about half of patients. Visual evoked potentials
    monitor the optic nerve and are recommended in combination with radiological
    and ophthalmological examination rather than alone.
  diagnosis_term:
    preferred_term: electronystagmography and visual evoked potentials
    term:
      id: NCIT:C215111
      label: Neuroelectrophysiology Test
  results: >-
    Vestibular abnormalities in about half of patients.
  evidence:
  - reference: PMID:23622937
    reference_title: Neurophysiologic, audiometric and vestibular function tests in patients with hyperostosis cranialis interna.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VEPs are important to monitor optic nerve function in combination with
      radiological and ophthalmologic examination. We do not advise the routine
      use of blink and masseter reflex.
    explanation: >-
      States the role of visual evoked potentials and, equally usefully, the two
      tests not worth performing routinely.
  - reference: PMID:23622937
    reference_title: Neurophysiologic, audiometric and vestibular function tests in patients with hyperostosis cranialis interna.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      50% of the patients had vestibular abnormalities.
    explanation: >-
      Quantifies the vestibular yield reported in this entry's results field.
  notes: >-
    Bound to NCIT:C215111 Neuroelectrophysiology Test, defined as a diagnostic
    tool measuring electrical signals produced by nerves and muscles. NCIT has no
    term for electronystagmography, for vestibular function testing, or for
    visual evoked potentials in general, so this is the accurate broader term
    with preferred_term carrying the specificity. An earlier version bound
    NCIT:C85857 Evoked Response Audiometry, which is an auditory term and is
    correctly used on the brainstem-response entry above; using it here made one
    identifier stand for two different tests.

    Splitting electronystagmography and visual evoked potentials into separate
    entries would be better still, since they monitor different nerves and carry
    different statistics.

    Blink and masseter reflexes are explicitly not advised for routine use: the
    symmetrical bilateral nature of the disease reduces sensitivity across the
    single-registration tests to 25 to 37.5 percent, a range that includes visual
    evoked potentials, which are nonetheless still recommended because they cover
    a nerve nothing else in the panel reaches.
- name: 18F-Fluoride PET/CT
  description: >-
    The only test here that quantifies disease activity rather than describing
    structure, which is why it is not redundant with computed tomography. Uptake
    is significantly higher in the sphenoid bone and clivus of affected family
    members, and visual assessment of the scans distinguishes disease severity
    and shows how the disturbance of bone metabolism evolves over life. That
    makes it the natural instrument for the surveillance this entry's management
    argument depends on, since the decision to decompress turns on whether the
    process is still advancing.

    The study was done in this kindred: nine affected family members, seven
    unaffected relatives and nine unrelated controls.
  diagnosis_term:
    preferred_term: 18F-fluoride positron emission tomography and computed tomography
    term:
      id: NCIT:C103512
      label: Positron Emission Tomography and Computed Tomography Scan
  results: >-
    Significantly higher 18F-fluoride uptake in the sphenoid bone and clivus of
    affected individuals, with standardised uptake values measured at frontal
    bone, sphenoid bone, petrous bone and clivus.
  evidence:
  - reference: PMID:21079950
    reference_title: Bone metabolic activity in hyperostosis cranialis interna measured with 18F-fluoride PET.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (18)F-Fluoride uptake is statistically significantly higher in the sphenoid
      bone and clivus regions of affected family members.
    explanation: >-
      The quantitative finding that distinguishes affected from unaffected
      relatives, and the basis for treating this as a measure of disease
      activity.
  - reference: PMID:21079950
    reference_title: Bone metabolic activity in hyperostosis cranialis interna measured with 18F-fluoride PET.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Visual assessment of the scans of HCI patients is relevant in detecting
      disease severity and the pattern of disturbed bone metabolism throughout
      life.
    explanation: >-
      Establishes the surveillance role: severity grading and longitudinal
      tracking of the metabolic process.
  notes: >-
    The NCIT binding names the modality pairing rather than the tracer. NCIT has
    no 18F-fluoride term, so preferred_term carries the tracer, which is the part
    that makes this a bone-metabolism measurement rather than a structural scan.

- name: Molecular Confirmation of SLC39A14
  description: >-
    Identifying the SLC39A14 variant confirms the diagnosis and, more usefully,
    identifies at-risk relatives before symptoms appear. That matters here more
    than in most sclerosing dysplasias, because the management recommendation is
    to decompress accessible nerves in the presymptomatic period in high-risk
    individuals, which requires knowing who they are.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29621230
    reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identified by whole-exome sequencing a dominant mutation (L441R) in
      SLC39A14 (ZIP14).
    explanation: >-
      Establishes the testable molecular lesion.
  notes: >-
    Biochemical testing does not contribute. Bone turnover parameters are normal
    in patients, so there is no laboratory signature to screen on and the
    diagnosis rests on imaging plus genotype.

animal_models:
- name: Osteoblast-conditional L438R Zip14 knock-in mouse
  species: Mouse
  genotype: Conditional knock-in overexpressing L438R Zip14 in osteoblasts
  publication: PMID:29621230
  description: >-
    Conditional knock-in mice overexpressing the mouse equivalent of the human
    L441R allele, restricted to osteoblasts. They develop a severe skeletal
    phenotype with a drastic increase in cortical thickness driven by enhanced
    endosteal bone formation, which is the pathology seen in patients. They also
    develop an osteoporotic trabecular phenotype that the human disease is not
    known to show.
  evidence:
  - reference: PMID:29621230
    reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Conditional knock-in mice overexpressing L438R Zip14 in osteoblasts have a
      severe skeletal phenotype marked by a drastic increase in cortical
      thickness due to an enhanced endosteal bone formation, resembling the
      underlying pathology in HCI patients.
    explanation: >-
      Establishes the model and the authors' own claim that it resembles the
      human pathology.
  modeled_mechanisms:
  - target: Enhanced Endosteal Bone Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the cortical arm of the disease, and does so cell-autonomously
      in osteoblasts, which is what establishes the osteoblast as the effector
      cell.
    limitations: >-
      Three limits. The construct overexpresses the mutant allele rather than
      carrying it at endogenous dose, so the severity is not comparable to a
      patient's. The anatomy is not merely unconfined, it is inverted: the
      hyperostosis appears in the long bones while the calvaria shows no
      phenotype at all, with calvarial thickness and porosity not significantly
      different from controls. The authors say they were surprised by this and
      call it truly opposite to what is seen in patients. And the trabecular
      compartment moves the other way, becoming osteoporotic, which patients do
      not show. So the model misses the one bone that defines the human disease
      and adds a compartment-level change the disease does not have.
    evidence:
    - reference: PMID:29621230
      reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Conditional knock-in mice overexpressing L438R Zip14 in osteoblasts have
        a severe skeletal phenotype marked by a drastic increase in cortical
        thickness due to an enhanced endosteal bone formation, resembling the
        underlying pathology in HCI patients.
      explanation: >-
        Supports treating this model as informative for the endosteal
        bone-formation node, which is the arm it does reproduce.
    readouts:
    - name: Cortical thickness
      target: Enhanced Endosteal Bone Formation
      direction: INCREASED
      interpretation: >-
        The cortical arm of the human phenotype, reproduced by the same endosteal
        mechanism.
      evidence:
      - reference: PMID:29621230
        reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          a drastic increase in cortical thickness due to an enhanced endosteal
          bone formation
        explanation: Reports the cortical measurement behind this readout.
    - name: Trabecular bone mass
      target: Enhanced Endosteal Bone Formation
      direction: DECREASED
      interpretation: >-
        A divergence from the human disease rather than a confirmation of it. The
        authors interpret the opposite effects on the two compartments as
        mirroring the disparate actions of oestrogen.
      evidence:
      - reference: PMID:29621230
        reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Remarkably, L438R Zip14 also generates an osteoporotic trabecular bone
          phenotype.
        explanation: >-
          Reports the trabecular finding. It has no established human
          counterpart, which is what makes it a divergence from the human disease
          rather than a confirmation of it.
  - target: Calvarial and Skull Base Hyperostosis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The model produces no calvarial phenotype, so it does not reproduce the
      lesion that defines this disease. This is the structural counterpart of the
      HUMAN_MODEL_MISMATCH discussion, which previously carried the claim only as
      prose in limitations.
    limitations: >-
      Murine calvariae are unaffected while the appendicular skeleton and
      vertebral column are, and the bone that is affected is osteoporotic rather
      than hyperostotic. The same calvarial sparing appears in the plain Zip14
      null, so it is not an artefact of the knock-in construct. Whether a
      protective mechanism exists in murine calvariae that humans lack is
      undetermined, so this negative result constrains the model rather than the
      human mechanism.
    evidence:
    - reference: PMID:29621230
      reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        were surprised to see no calvarial phenotype as this is truly opposite of
        what we see in HCI
      explanation: >-
        States the failure in the authors' own words. Graded SUPPORT because the
        quote supports the claim that the model fails; the negative direction is
        carried by relationship FAILS_TO_RECAPITULATE.
    - reference: PMID:29621230
      reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        found that loss of endogenous Zip14 did not affect the calvariae, even
        though the appendicular skeleton and vertebral column were osteoporotic
      explanation: >-
        The same calvarial sparing in the plain null, which rules out the
        knock-in construct as the explanation.
treatments:
- name: Surgical Decompression of Entrapped Cranial Nerves
  therapeutic_modality: SURGERY
  description: >-
    The only treatment that addresses the actual injury. Because the nerve damage
    is mechanical and progressive, the recommendation is to decompress accessible
    nerves early in the symptomatic period, or even before symptoms in high-risk
    family members, rather than to wait for established deficit. Reported
    procedures include bilateral decompression of the internal auditory canals
    and middle-fossa facial nerve decompression. Nothing treats the underlying
    bone overgrowth.
  treatment_term:
    preferred_term: cranial nerve decompression
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Cranial Nerve Entrapment
    description: >-
      Decompression addresses the entrapment itself, which is the mechanism every
      deficit in this disease runs through.
  target_phenotypes:
  - preferred_term: Cranial nerve compression
    term:
      id: HP:0001293
      label: Cranial nerve compression
  - preferred_term: Facial palsy secondary to cranial hyperostosis
    term:
      id: HP:0007285
      label: Facial palsy secondary to cranial hyperostosis
  evidence:
  - reference: PMID:20140965
    reference_title: "Phenotypic manifestations and management of hyperostosis cranialis interna, a hereditary bone dysplasia affecting the calvaria and the skull base."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical decompression of the accessible impaired cranial nerves is advised
      in the early symptomatic period or even in the presymptomatic period in
      high-risk individuals.
    explanation: >-
      States the recommendation and, importantly, its timing, which is the
      substantive clinical claim.
  - reference: PMID:19371457
    reference_title: "Facial nerve decompression via middle fossa approach for hyperostosis cranialis interna: a feasible therapeutic approach."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the use of bilateral surgical decompression of the internal
      auditory canals to treat hyperostosis cranialis interna in an eight-year-old
      girl presenting with bilateral facial palsy
    explanation: >-
      A worked example of the procedure: a single case demonstrating
      feasibility, not an outcome study.
  - reference: PMID:19371457
    reference_title: "Facial nerve decompression via middle fossa approach for hyperostosis cranialis interna: a feasible therapeutic approach."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mimic function recovered. One year post-operatively, the right and left
      facial sides had been restored to House-Brackmann grades I and II,
      respectively.
    explanation: >-
      The outcome, which is the part that matters for a treatment recommending
      early intervention: facial function recovered and was near-normal at one
      year.
  - reference: PMID:19371457
    reference_title: "Facial nerve decompression via middle fossa approach for hyperostosis cranialis interna: a feasible therapeutic approach."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical decompression of the internal auditory canal is recommended
      therapeutically, but may also be performed prophylactically in younger
      patients with hyperostosis cranialis interna.
    explanation: >-
      Second-source corroboration of the prophylactic timing that this entry's
      management argument rests on.
  notes: >-
    Treatment is otherwise symptomatic. No medical therapy modifies the bone
    phenotype, and none has been trialled in this disease.
  review_notes: >-
    Hearing rehabilitation is not curated and the omission is a gap rather than a
    judgement. Deafness is the dominant morbidity here, and auditory brainstem
    implantation is the option when the cochlear nerve is no longer functional.
    It carries a disease-specific hazard: cerebral vasospasm after auditory
    brainstem implantation has been reported in a patient with this syndrome
    (PMID:21665359, from the same group that characterised the kindred). That
    report has no abstract retrievable through the usual route, so no compliant
    snippet could be quoted and nothing is asserted here. Recorded so the safety
    signal is visible to the next curator rather than lost, and so that whoever
    can obtain the full text knows what to look for.
discussions:
- discussion_id: hci_formation_versus_resorption
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the excess bone in this disease driven by increased formation, decreased
    resorption, or both?
  attaches_to:
  - pathophysiology#Enhanced Endosteal Bone Formation
  rationale: >-
    The node is graded ESTABLISHED on the strength of patient histology showing
    increased bone formation with normal tissue structure, and that is what the
    cached source says. But the two mouse models point different ways: the
    osteoblast conditional knock-in implicates increased formation, while the
    published ZIP14 null work has been read as implicating decreased resorption.
    Those are different mechanistic claims with different therapeutic
    implications, and nothing in the reference cache adjudicates between them.

    The distinction is not academic. If the excess is a resorption failure, the
    osteoclast is the effector cell and this entry names the wrong one; the
    formation reading is the one the human histology supports, which is why it is
    curated, but a curator should know the alternative exists.
- discussion_id: hci_metal_levels_never_measured
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are serum and tissue zinc, manganese and iron levels in patients with
    this disease?
  attaches_to:
  - pathophysiology#Intracellular Zinc Accumulation
  - differential_diagnoses#Hypermanganesemia with dystonia 2
  rationale: >-
    The mechanism curated here is a metal-transport defect producing
    intracellular zinc accumulation, and that has been shown in cells. It has
    never been measured in a patient: no serum or tissue zinc, manganese or iron
    levels have been reported in this disease.

    The gap is sharper than it looks because of the allelic disease. Biallelic
    loss of the same transporter causes manganese accumulation that is
    measurable in blood and treatable by chelation. Whether the dominant
    mistrafficking allele produces any systemic metal disturbance at all is
    unknown, and the answer bears directly on whether the chelation boundary this
    entry draws is a boundary of mechanism or merely one of untested assumption.
- discussion_id: hci_murine_calvarial_sparing
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why are murine calvariae spared by a lesion that produces calvarial
    hyperostosis in patients?
  attaches_to:
  - pathophysiology#Calvarial and Skull Base Hyperostosis
  - animal_models#Osteoblast-conditional L438R Zip14 knock-in mouse
  rationale: >-
    Cranial confinement is the defining feature of this disease and the one thing
    that separates it from every other sclerosing bone dysplasia. The mouse
    reproduces the cellular mechanism convincingly, cortical thickening by
    enhanced endosteal formation in osteoblasts, but it does so in the long bones
    and not in the skull. The mice develop no calvarial phenotype at all, with
    calvarial thickness and porosity indistinguishable from controls, while the
    long bones carry the thickened cortex and an osteoporotic trabecular
    compartment. The same sparing appears in the plain null, so the question is
    not why the human disease is confined to the skull but why murine calvariae
    appear protected from a zinc-handling lesion affecting every other bone in
    the same animal. The authors pose exactly that and leave it open.

    So the model explains how the bone forms and not where. Candidate
    explanations are untested: regional differences in ZIP14 expression or zinc
    handling between neural-crest-derived cranial osteoblasts and mesoderm-derived
    axial ones; a species-specific calvarial protective mechanism; or an artefact
    of overexpression, since the construct is not at endogenous dose. Distinguishing
    them would need an endogenous-dose knock-in and comparison of cranial against
    long-bone osteoblasts from the same animal.
  evidence:
  - reference: PMID:22194361
    reference_title: Imaging features and progression of hyperostosis cranialis interna.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HCI is the only genetic bone dysplasia known that is confined to the
      craniofacial area.
    explanation: >-
      Establishes cranial confinement as the defining human feature that the
      model does not reproduce.
  - reference: PMID:29621230
    reference_title: Conditional mouse models support the role of SLC39A14 (ZIP14) in Hyperostosis Cranialis Interna and in bone homeostasis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Remarkably, L438R Zip14 also generates an osteoporotic trabecular bone
      phenotype.
    explanation: >-
      Documents a model phenotype with no described human counterpart, which is
      the second half of the mismatch.
- discussion_id: hci_single_kindred_generalisability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which features of the described phenotype belong to the disease and which
    belong to the kindred it was described in?
  attaches_to:
  - phenotypes#
  - prevalence#Three related Dutch families
  rationale: >-
    Essentially the whole clinical description rests on three related Dutch
    families with common progenitors. Everything an entry can say about which
    nerves are affected, in what order, at what age and how severely is therefore
    conditioned on one genetic background and one allele. No frequency band is
    asserted anywhere in this entry for that reason. Independent kindreds with
    different SLC39A14 alleles would be needed to separate disease from family,
    and until then the natural history recorded here should be read as the
    history of that pedigree.
  evidence:
  - reference: PMID:23640157
    reference_title: Localization of the gene for hyperostosis cranialis interna to chromosome 8p21 with analysis of three candidate genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Until today the disease has been described in only three related Dutch
      families with common progenitors
    explanation: >-
      States the limitation that the entire clinical description derives from one
      extended kindred.

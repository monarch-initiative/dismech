genetic:
- name: ARNT2
  gene_term:
    preferred_term: ARNT2
    term:
      id: hgnc:16876
      label: ARNT2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic loss-of-function variants cause WEDAS. The index family carried a
    homozygous frameshift, c.1373_1374dupTC (p.Tyr459Argfs*52), with
    nonsense-mediated decay and loss of transcript/protein. Additional homozygous
    splice and frameshift variants have since been reported in a few further
    families; gain-of-function and dominant-negative mechanisms have not been
    demonstrated. No external gene-disease validity classification (e.g. ClinGen)
    was located for the ARNT2-WEDAS pair at curation time, so gene_disease_validity
    is left absent.
  variants:
  - name: c.1373_1374dupTC (p.Tyr459Argfs*52)
    description: Homozygous two-base frameshift duplication in exon 13 introducing a premature termination codon 52 residues downstream, triggering nonsense-mediated decay; the founding WEDAS variant (ClinVar represents it on the current transcript as c.1372_1373dup, p.Tyr459fs).
    variant_type: duplication
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24022475
      reference_title: ARNT2 mutation causes hypopituitarism, post-natal microcephaly, visual and renal anomalies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Homozygosity mapping and exome sequencing revealed a novel homozygous frameshift mutation in the basic helix-loop-helix transcription factor gene ARNT2 (c.1373_1374dupTC) in affected individuals.
      explanation: Identifies the causative homozygous frameshift variant.
  evidence:
  - reference: PMID:24022475
    reference_title: ARNT2 mutation causes hypopituitarism, post-natal microcephaly, visual and renal anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: This mutation results in absence of detectable levels of ARNT2 transcript and protein from patient fibroblasts compared with controls, consistent with nonsense-mediated decay of the mutant transcript and loss of ARNT2 function.
    explanation: Establishes loss of function as the gene-disease mechanism.
  - reference: PMID:41363294
    reference_title: Webb-Dattani syndrome in a 17-year-old girl.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Genetic testing confirmed a homozygous pathogenic variant in the ARNT2 gene, consistent with Webb–Dattani syndrome.
    explanation: Independent molecular confirmation of a homozygous ARNT2 variant in a later case.
inheritance:
- name: Autosomal recessive
  description: >-
    WEDAS is autosomal recessive. Reported families are consanguineous and
    affected individuals are homozygous for a loss-of-function ARNT2 variant,
    with unaffected heterozygous parents; a founder effect is plausible for the
    Saudi families. Penetrance appears high in confirmed biallelic cases, but the
    published series are too small for a numerical estimate.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24022475
    reference_title: ARNT2 mutation causes hypopituitarism, post-natal microcephaly, visual and renal anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We have identified a homozygous mutation in the ARNT2 gene segregating between affected individuals as the cause of a congenital brain malformation syndrome with a highly unusual and distinct combination of clinical manifestations.
    explanation: Homozygous segregation in a consanguineous family supports autosomal recessive inheritance.

    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Arnt2 is an indispensable transcription factor for the development of the hypothalamus, and suggest that Arnt2 is an obligatory partner molecule of Sim1 in the developmental process of the neuroendocrinological cell lineages.
    explanation: Mouse knockout establishes Arnt2 as the obligate Sim1 partner in hypothalamic neuroendocrine development.
  downstream:
  - target: Defective Hypothalamic Neurosecretory Neuron Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of SIM1-ARNT2 activity blocks terminal differentiation of magnocellular and parvocellular neurosecretory neurons in the paraventricular and supraoptic nuclei. Demonstrated in Arnt2-null mice and inferred in humans from the parallel endocrine phenotype.
    evidence:
    - reference: PMID:11318878
      reference_title: Defective development of secretory neurones in the hypothalamus of Arnt2-knockout mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: secretory neurones identified by the expression of neurosecretory hormone such as arginine vasopressin, oxytocin, corticotrophin-releasing hormone and somatostatin are completely absent in SON and PVN in the mutant Arnt2 mice.
      explanation: Directly demonstrates loss of neurosecretory neurons in Arnt2-null hypothalamus.
  - target: Impaired Postnatal Forebrain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: ARNT2 is expressed in the developing and post-natal cortex; its loss impairs post-natal brain growth and myelination. The specific target genes in human forebrain are not established.

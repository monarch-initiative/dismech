  Curated from the primary ARNT2 family literature: the delineating report of six
  affected children (Webb et al., 2013, PMID:24022475), the Arnt2-knockout mouse
  that established the obligate SIM1-ARNT2 role in hypothalamic neurosecretory
  development (Hosoya et al., 2001, PMID:11318878, model-organism evidence), and a
  long-term follow-up of a molecularly confirmed patient surviving to 17 years
  (PMID:41363294). Literature is thin (a few families); mouse data strongly support
  the hypothalamic neurosecretory mechanism while the human steps are inferred, and
  the renal and visual causal edges are developmental inferences from ARNT2
  expression rather than direct human tissue studies. No GeneReviews chapter exists
  for this ultra-rare disorder (checked against the committed Bookshelf index). The
  heterozygous-ARNT2 obesity/hypomorph literature was deliberately excluded as not
  pertaining to recessive WEDAS.

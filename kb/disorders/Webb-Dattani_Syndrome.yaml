      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: In two children (Patients V:13 and V:17) there was evidence of post-retinal pathway dysfunction indicated by attenuated and poorly defined flash visual-evoked potentials.
      explanation: Localizes the visual lesion to the post-retinal pathway served by ARNT2 expression.
  - target: Abnormal Kidney and Urinary Tract Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: ARNT2 is expressed in the developing renal tubules; its loss is associated with congenital anomalies of the kidneys and urinary tract. The direct-versus-neurogenic contribution to bladder dysfunction is not resolved.
    evidence:
    - reference: PMID:24022475

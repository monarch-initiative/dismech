    quote_role: BACKGROUND
    directness: DIRECT
    snippet: ARNT2 is a member of the basic HLH-PAS (Per-ARNT-Sim homology) subfamily of transcription factors, containing a basic HLH DNA-binding domain in addition to a PAS domain that mediates heterodimerization with other basic HLH/PAS proteins in order to form functional DNA binding complexes
    explanation: Describes the bHLH-PAS domain structure and heterodimerization required for ARNT2 transcriptional function.
  - reference: PMID:11318878

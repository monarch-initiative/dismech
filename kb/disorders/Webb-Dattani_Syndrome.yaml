    reference_title: ARNT2 mutation causes hypopituitarism, post-natal microcephaly, visual and renal anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Homozygosity mapping and exome sequencing revealed a novel homozygous frameshift mutation in the basic helix-loop-helix transcription factor gene ARNT2 (c.1373_1374dupTC) in affected individuals.
    explanation: Identifies the causative homozygous ARNT2 frameshift variant in the index family.
  downstream:
  - target: ARNT2 Transcript and Protein Loss
    causal_link_type: DIRECT
    description: The premature termination codon triggers nonsense-mediated decay, so patient fibroblasts have greatly reduced ARNT2 transcript and little or no detectable protein.
    evidence:
    - reference: PMID:24022475
      reference_title: ARNT2 mutation causes hypopituitarism, post-natal microcephaly, visual and renal anomalies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: This mutation results in absence of detectable levels of ARNT2 transcript and protein from patient fibroblasts compared with controls, consistent with nonsense-mediated decay of the mutant transcript and loss of ARNT2 function.
      explanation: Directly demonstrates transcript and protein loss consistent with nonsense-mediated decay.
- name: ARNT2 Transcript and Protein Loss
  description: >-
    Quantitative RT-PCR showed a 50- to 150-fold reduction of ARNT2 transcript in
    patient fibroblasts, with correspondingly reduced protein on Western blot,
    establishing loss of ARNT2 as the disease mechanism rather than a
    gain-of-function or dominant-negative effect.
  role: mechanism
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: ARNT2
    term:
      id: hgnc:16876
      label: ARNT2
  evidence:
  - reference: PMID:24022475
    reference_title: ARNT2 mutation causes hypopituitarism, post-natal microcephaly, visual and renal anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: As shown in Fig. 2D, the patient samples had a 50 to 150-fold reduction in ARNT2 transcript levels compared with controls.
    explanation: Quantifies the transcript reduction supporting loss of function.
  downstream:
  - target: Failure of SIM1-ARNT2 Transcriptional Activity
    causal_link_type: DIRECT
    description: Without ARNT2 protein the SIM1-ARNT2 heterodimer cannot form, so SIM1/ARNT2-dependent developmental transcription fails.
    evidence:
    - reference: PMID:24022475
      reference_title: ARNT2 mutation causes hypopituitarism, post-natal microcephaly, visual and renal anomalies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: One of the known dimerization partners of ARNT2 is SIM1, a homologue of the Drosophila single-minded transcription factor, which is a critical regulator of neuronal differentiation during CNS development
      explanation: Establishes SIM1 as the key ARNT2 dimerization partner whose joint activity is lost.
- name: Failure of SIM1-ARNT2 Transcriptional Activity
  description: >-
    ARNT2 is a bHLH-PAS transcription factor whose PAS domain mediates
    heterodimerization with partner bHLH-PAS proteins - notably SIM1 - to form
    functional DNA-binding complexes in the nucleus. Loss of ARNT2 abolishes this
    heterodimeric transcriptional activity during hypothalamic, forebrain, visual
    and renal development.
  role: mechanism
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

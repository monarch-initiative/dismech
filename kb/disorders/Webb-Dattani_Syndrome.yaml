name: Webb-Dattani Syndrome
creation_date: "2026-10-30T10:58:05Z"
category: Mendelian
disease_term:
  preferred_term: Webb-Dattani syndrome
  term:
    id: MONDO:0014404
    label: Webb-Dattani syndrome
synonyms:
- WEDAS
- hypothalamic insufficiency-secondary microcephaly-visual impairment-urinary anomalies syndrome
parents:
- Congenital Hypopituitarism
- Neurodevelopmental Disorder
description: >-
  Webb-Dattani syndrome (WEDAS) is a severe autosomal-recessive
  neurodevelopmental and neuroendocrine disorder caused by biallelic
  loss-of-function variants in ARNT2, a nuclear basic helix-loop-helix (bHLH)-PAS
  transcription factor that is the obligate heterodimeric partner of SIM1 in
  hypothalamic development. Loss of ARNT2 function disrupts terminal
  differentiation of hypothalamic neurosecretory neurons, producing congenital
  hypothalamo-pituitary insufficiency - in particular arginine-vasopressin
  (central diabetes insipidus) and ACTH/cortisol deficiency presenting in the
  neonatal period - together with secondary (post-natal, progressive)
  microcephaly, frontotemporal hypoplasia, thin corpus callosum and delayed
  myelination, severe global developmental delay, seizures, spastic tetraplegia,
  post-retinal/cortical visual impairment, and congenital anomalies of the
  kidneys and urinary tract. It was delineated in a single highly consanguineous
  Saudi family of six affected children (Webb et al., 2013); the literature
  remains confined to a few families, so quantitative statements derive from
  very small series and are not population estimates.
pathophysiology:
- name: Biallelic ARNT2 Loss of Function
  description: >-
    Homozygous (or compound-heterozygous) loss-of-function variants in ARNT2 are
    the Mendelian cause of WEDAS. The index family carried a homozygous two-base
    frameshift duplication, c.1373_1374dupTC (p.Tyr459Argfs*52), that segregated
    with disease and was heterozygous in unaffected parents.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION

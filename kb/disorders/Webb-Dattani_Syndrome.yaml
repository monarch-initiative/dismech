  - target: Abnormal Visual Pathway Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: ARNT2 is expressed in the developing neural retina and post-retinal visual pathway; its loss produces post-retinal/chiasmal visual dysfunction with preserved retinal responses.

- name: Defective Hypothalamic Neurosecretory Neuron Differentiation
  description: >-
    Failure of SIM1-ARNT2 transcription leaves the paraventricular and supraoptic
    nuclei hypocellular and lacking terminally differentiated neurosecretory
    neurons, so the hypothalamic hormones that drive the anterior pituitary (CRH,
    TRH, somatostatin) and the posterior pituitary (vasopressin, oxytocin) are
    deficient. This underlies the congenital hypothalamo-pituitary insufficiency
    of WEDAS.
  role: mechanism

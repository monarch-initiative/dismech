- name: Abnormal Visual Pathway Development
  description: >-
    ARNT2 is expressed in the developing neural retina and post-retinal visual
    pathway. Affected children have severe visual impairment with normal globes
    and fundi and preserved electroretinograms but attenuated visual-evoked
    potentials, localizing the lesion to the post-retinal/chiasmal and cortical
    visual pathway.
  role: mechanism
  biological_scale: TISSUE

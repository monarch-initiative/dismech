    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: All children demonstrated no clinical response to light with minimal pupil responses. Ophthalmic examination of the globe and fundi were normal.
    explanation: Severe visual impairment with a structurally normal eye points to a post-retinal pathway lesion.

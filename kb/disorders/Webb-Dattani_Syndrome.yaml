    Affected children have normal brain volume at birth but develop progressive
    frontotemporal hypoplasia, thin corpus callosum and globally delayed
    myelination over the first months of life, indicating a post-natal
    requirement for ARNT2 in brain growth and maintenance rather than a purely
    prenatal malformation.

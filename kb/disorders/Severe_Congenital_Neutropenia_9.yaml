name: Severe Congenital Neutropenia 9
creation_date: "2026-10-20T19:40:00Z"
category: Mendelian
description: >-
  Severe congenital neutropenia 9 (SCN9, CLPB-SCN) is an autosomal dominant
  disorder of granulopoiesis caused by heterozygous missense variants in CLPB,
  the ATP-dependent AAA+ disaggregase of the mitochondrial intermembrane space.
  In the defining series the variants cluster near the ATP-binding pocket of
  the nucleotide-binding domain, though later carriers also have ankyrin- and
  D2-domain variants; mutant subunits associate with wild-type CLPB and inhibit its ATPase
  and disaggregase activity in a dominant-negative manner. Granulocytic
  precursors expressing the variants die by apoptosis and fail to
  differentiate, giving a myeloid maturation arrest in the marrow and severe
  neutropenia with recurrent bacterial infections from infancy. Unlike the
  other CLPB disorders, most patients have neutropenia alone, without the
  neurological disease or 3-methylglutaconic aciduria of the recessive form
  (type VIIB) or of the dominant neurological form (type VIIA). Myelodysplasia
  has been reported. Treatment is G-CSF, with hematopoietic stem cell
  transplantation for patients refractory to it. Whether SCN9 and type VIIA are
  one disorder is an open question.
disease_term:
  preferred_term: neutropenia, severe congenital, 9, autosomal dominant
  term:
    id: MONDO:0030726
    label: neutropenia, severe congenital, 9, autosomal dominant
synonyms:
- SCN9
- CLPB-SCN
- CLPB-related severe congenital neutropenia
- Autosomal dominant severe congenital neutropenia due to CLPB variants
parents:
- Severe Congenital Neutropenia
- Inborn Error of Immunity
notes: >-
  Scope: this entry covers heterozygous CLPB variants with neutropenia as the
  main or only feature, OMIM 619813 (MONDO:0030726). The dominant CLPB disorder
  with neurological involvement and 3-methylglutaconic aciduria, OMIM 619835,
  is curated as 3-methylglutaconic_Aciduria_Type_VIIA, and the recessive form,
  OMIM 616271, as 3-methylglutaconic_Aciduria_Type_VIIB. The boundary between
  the two dominant disorders is unsettled; it is recorded as a knowledge gap in
  both entries. Some sources pool all monoallelic patients (PMID:41719910) or
  report heterozygous patients with and without neurological disease together
  (PMID:35499078); where they are cited, the description says so. The only
  ClinGen gene-disease validity record for CLPB in
  cache/clingen/gene_validity.csv is for Leigh syndrome (MONDO:0009723), a
  different disease, so no gene_disease_validity assertion is recorded.
  The GeneReviews CLPB Deficiency chapter (PMID:27891836) covers biallelic
  disease and the dominant form it describes with neurological involvement;
  it does not name this disorder. Its management guidance is cited here as
  indirect support.

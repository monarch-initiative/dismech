    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "We found that CLPB-deficient 32Dcl3 cells showed a decreased mitochondrial membrane potential and increased levels of insoluble HAX1 aggregates in mitochondria, as compared to control cells."
    explanation: Mitochondrial depolarisation in CLPB-deficient myeloblasts.
  - reference: PMID:39644357
    reference_title: Mitochondrial CLPB is a pro-survival factor at the onset of granulocytic differentiation of mouse myeloblastic cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Moreover, we found that increased apoptosis of CLPB-deficient cells is linked to production of reactive oxygen species (ROS)."
    explanation: Excess ROS production in CLPB-deficient myeloblasts.
  downstream:
  - target: Granulocytic Precursor Apoptosis
    causal_link_type: DIRECT

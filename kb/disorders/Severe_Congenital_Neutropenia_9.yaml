discussions:
- discussion_id: gap_scn9_vs_mgca7a_boundary
  prompt: >-
    Are severe congenital neutropenia 9 and 3-methylglutaconic aciduria type
    VIIA two disorders, or one dominant CLPB disorder with variable
    neurological expression?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#
  - phenotypes#Neurological involvement
  - phenotypes#3-Methylglutaconic aciduria
  rationale: >-
    Both are caused by heterozygous CLPB missense variants that inhibit
    wild-type CLPB dominant-negatively, and R561 is mutated in both. The
    separating features, neurological disease and 3-methylglutaconic aciduria,
    occur in some heterozygous patients, and the aciduria was not measured in
    about half of the published neutropenia cases.
  evidence:
  - reference: PMID:40194906
    reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "It remains to be established whether the distinction between dominant CLPB deficiency (MGA 7A) and CLPB-SCN is scientifically valid or if these entities represent, in fact, one disorder."
    explanation: Review stating the boundary is unresolved.
  - reference: PMID:40194906
    reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The distinction based on the lack of 3-MGA-uria in isolated CLPB-related neutropenia needs to be further studied, as this parameter was not assessed in 9 out of 20 published cases, since it had not been linked with neutropenia before."
    explanation: The biochemical criterion separating the two was often not measured.
- discussion_id: gap_scn9_mild_phenotype
  prompt: >-
    Why do variants that severely inhibit wild-type CLPB in vitro produce a
    relatively mild, often isolated neutropenia that can resolve with age?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Dominant-Negative Inhibition of CLPB Disaggregase
  - phenotypes#Congenital neutropenia
  rationale: >-
    Mixed-oligomer assays show the variants abolish most disaggregase activity,
    and myeloid cell models show severely impaired respiration, yet patients
    usually have neutropenia alone, often responsive to G-CSF, and in one
    cohort counts normalized with age. Dosage of the mutant subunit in vivo,
    tissue-specific compensation, and the developmental timing of the marrow
    defect are untested explanations.
  evidence:
  - reference: PMID:40194906
    reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A perplexing issue is why the SCN-related variants, with such a devastating influence on the ATPase and disaggregase activity on the wild-type protein in vitro, result in a relatively mild phenotype in patients."
    explanation: Review naming the mismatch between in vitro severity and clinical mildness.

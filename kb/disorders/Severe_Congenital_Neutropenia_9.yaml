    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32573439
      reference_title: Skd3 (human ClpB) is a potent mitochondrial protein disaggregase that is inactivated by 3-methylglutaconic aciduria-linked mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "In wild-type cells, HAX1 remained predominantly soluble (Figure 7d,e). However, when Skd3 was deleted HAX1 became predominantly insoluble (Figure 7d,e). Thus, Skd3 is essential for HAX1 solubility in cells."
      explanation: Intermembrane space proteostasis failure upon CLPB loss renders HAX1 insoluble.
- name: HAX1 Insolubility
  description: >-
    HAX1 is a direct partner and stimulatory cofactor of CLPB and depends on it
    for solubility. HAX1 deficiency itself causes severe congenital neutropenia
    (Kostmann syndrome), which links CLPB dysfunction to the neutrophil lineage.
    HAX1 insolubility has been shown in CLPB-deficient cells, not with the
    dominant variants of this disorder, and one such variant (R561Q) still
    binds HAX1.
  biological_scale: MOLECULAR

    term:
      id: GO:0005758
      label: mitochondrial intermembrane space
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  evidence:
  - reference: PMID:34115842
    reference_title: Heterozygous variants of CLPB are a cause of severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These CLPB variants associate with wild-type CLPB and inhibit its adenosine triphosphatase and disaggregase activity in a dominant-negative fashion."
    explanation: The variants of this disorder bind and inhibit wild-type CLPB.
  - reference: PMID:36170828
    reference_title: "Unique structural features govern the activity of a human mitochondrial AAA+ disaggregase, Skd3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, SCN-linked subunits sharply inhibit disaggregase activity, whereas MGCA7-linked subunits do not."
    explanation: Mixed-hexamer experiments show SCN-linked subunits poison wild-type CLPB, unlike recessive-disease subunits.
  downstream:
  - target: Intermembrane Space Protein Aggregation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32573439
      reference_title: Skd3 (human ClpB) is a potent mitochondrial protein disaggregase that is inactivated by 3-methylglutaconic aciduria-linked mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Using Gene Ontology (GO) analysis for cellular component, we found that proteins in the inner mitochondrial membrane and intermembrane space were enriched in the insoluble fraction in the absence of Skd3"
      explanation: Loss of CLPB disaggregase activity causes insolubility of inner membrane and intermembrane space proteins in CLPB-deficient cells.
  - target: Impaired Mitochondrial Respiration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34115842
      reference_title: Heterozygous variants of CLPB are a cause of severe congenital neutropenia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Finally, expression of CLPB variants is associated with impaired mitochondrial function but does not render cells more sensitive to endoplasmic reticulum stress."
      explanation: Dominant-negative SCN9 CLPB variants impair mitochondrial function in cellular models.
- name: Intermembrane Space Protein Aggregation
  description: >-
    Without disaggregase activity, proteins of the mitochondrial intermembrane
    space and inner membrane, including the anti-apoptotic protein HAX1,
    become insoluble.
  biological_scale: MOLECULAR

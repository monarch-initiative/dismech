      explanation: Places SCN9 among inherited hematopoietic disorders of granulopoiesis.
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      An inborn error of immunity (congenital defect of phagocyte number)
      presenting with severe neutropenia and recurrent bacterial infections.
    evidence:
    - reference: PMID:41383606
      reference_title: "The genetic landscape of congenital neutropenia in Poland: summary of the nationwide screening campaign."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Severe congenital neutropenia (SCN) is a rare immunodeficiency disorder characterized by impaired granulopoiesis."
      explanation: Classifies severe congenital neutropenia as an inborn immunodeficiency disorder.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Autosomal dominant Mendelian disorder caused by germline heterozygous
      missense variants in CLPB.
    evidence:
    - reference: PMID:34115842
      reference_title: Heterozygous variants of CLPB are a cause of severe congenital neutropenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing of 104 persons with congenital neutropenia identified heterozygous missense variants of CLPB (caseinolytic peptidase B) in 5 severe congenital neutropenia cases, with 5 more cases identified through additional sequencing efforts or clinical sequencing."
      explanation: Establishes the monogenic germline etiology of SCN9.
  iuis_category:
    classification_value: phagocyte defect
    notes: >-
      Congenital defect of phagocyte number (IUIS Table 5 congenital
      neutropenias). IUIS 2022 Table 5 indexes CLPB under recessive
      3-methylglutaconic aciduria (OMIM 616254) prior to separate listing of
      autosomal dominant SCN9 (OMIM 619813); dominant CLPB-SCN patients are
      ascertained in inborn-errors-of-immunity cohorts with isolated congenital
      neutropenia.
    evidence:
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      snippet: "3-Methylglutaconic aciduria CLPB AR 616254"
      explanation: >-
        IUIS 2022 Table 5 places CLPB deficiency among congenital defects of
        phagocyte number; indirect because the table row cites the autosomal
        recessive entry rather than naming dominant SCN9 separately.
    - reference: PMID:35499078
      reference_title: HAX1-dependent control of mitochondrial proteostasis governs neutrophil granulocyte differentiation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In our Care-for-Rare repository for inborn errors of immunity (refer to https://www.care-for-rare.org), we identified 4 patients with heterozygous variants in the CLPB gene (Table 1)."
      explanation: Documents ascertainment of heterozygous CLPB severe congenital neutropenia within an inborn errors of immunity registry.
notes: >-
  Scope: this entry covers heterozygous CLPB variants with neutropenia as the
  main or only feature, OMIM 619813 (MONDO:0030726). The dominant CLPB disorder
  with neurological involvement and 3-methylglutaconic aciduria, OMIM 619835,
  is curated as 3-methylglutaconic_Aciduria_Type_VIIA, and the recessive form,
  OMIM 616271, as 3-methylglutaconic_Aciduria_Type_VIIB. The boundary between
  the two dominant disorders is unsettled; it is recorded as a knowledge gap in
  both entries. Some sources pool all monoallelic patients (PMID:41719910) or
  report heterozygous patients with and without neurological disease together
  (PMID:35499078); where they are cited, the description says so. The only
  ClinGen gene-disease validity record for CLPB in
  cache/clingen/gene_validity.csv is for Leigh syndrome (MONDO:0009723), a
  different disease, so no gene_disease_validity assertion is recorded.
  The GeneReviews CLPB Deficiency chapter (PMID:27891836) covers biallelic
  disease and the dominant form it describes with neurological involvement;
  it does not name this disorder. Its management guidance is cited here as
  indirect support.

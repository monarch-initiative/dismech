inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous CLPB missense variant causes the disease. Each
    child of an affected person has a 50% chance of inheriting it.
    GeneReviews states that all reported dominant CLPB cases arose de novo;
    that statement concerns its dominant form with neurological involvement,
    and the SCN9 sources cited here do not say whether their variants were
    de novo or inherited.
  evidence:
  - reference: PMID:27891836
    reference_title: CLPB Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "CLPB deficiency associated with specific heterozygous CLPB pathogenic variants is inherited in an autosomal dominant manner."
    explanation: >-
      GeneReviews states dominant inheritance for specific heterozygous CLPB
      variants. Its dominant form is the one with neurological involvement, so
      this supports SCN9 indirectly.
  - reference: PMID:27891836
    reference_title: CLPB Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Each child of an individual with a heterozygous CLPB pathogenic variant has a 50% chance of inheriting the pathogenic variant."
    explanation: Transmission risk for a heterozygous CLPB variant, from the GeneReviews chapter that does not name SCN9.
  - reference: PMID:34115842
    reference_title: Heterozygous variants of CLPB are a cause of severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of 104 persons with congenital neutropenia identified heterozygous missense variants of CLPB (caseinolytic peptidase B) in 5 severe congenital neutropenia cases, with 5 more cases identified through additional sequencing efforts or clinical sequencing."
    explanation: Heterozygous CLPB variants in ten patients with severe congenital neutropenia.
  - reference: PMID:41383606
    reference_title: "The genetic landscape of congenital neutropenia in Poland: summary of the nationwide screening campaign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten patients were carriers of heterozygous CLPB variants, including known p.Arg297Trp and p.Arg598Cys changes, associated with isolated dominant neutropenia and a novel p.Arg599Cys variant located as well in the ATPase domain."
    explanation: A national cohort with ten further heterozygous carriers with dominant neutropenia.
prevalence:
- population: Polish national congenital neutropenia cohort
  measure_type: CASES_IN_LITERATURE
  notes: >-
    No population prevalence is available for CLPB-related neutropenia itself;
    congenital neutropenia overall has an estimated prevalence of 3 to 17 per
    million individuals across national registries. In the Polish nationwide
    screening campaign, CLPB variants accounted for 10% of genetically
    diagnosed congenital neutropenia (10 of 102 patients), the same share as
    SBDS; the exome series that defined the disorder called heterozygous CLPB
    variants a relatively common cause of congenital neutropenia.
  evidence:
  - reference: PMID:41383606
    reference_title: "The genetic landscape of congenital neutropenia in Poland: summary of the nationwide screening campaign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: "According to several national registries, the prevalence of congenital neutropenia is estimated to be 3–17 per million individuals, with ELANE variations as the most frequent cause of its genetic background (38–41)."
    explanation: Registry prevalence estimate for congenital neutropenia overall rather than CLPB-specific disease.
  - reference: PMID:41383606
    reference_title: "The genetic landscape of congenital neutropenia in Poland: summary of the nationwide screening campaign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CLPB-related neutropenia also accounted for 10% of cases, followed by defects in the TCIRG1 (eight cases), CXCR4 (seven cases), and SRP72 genes (seven cases)."
    explanation: Share of genetically diagnosed congenital neutropenia attributable to CLPB in Poland.
  - reference: PMID:34115842
    reference_title: Heterozygous variants of CLPB are a cause of severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together, these data show that heterozygous CLPB variants are a new and relatively common cause of congenital neutropenia and should be considered in the evaluation of patients with congenital neutropenia."
    explanation: The defining series describes the cause as relatively common within congenital neutropenia.
- population: Published literature (isolated SCN9 and dominant CLPB cohorts)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2025 synthesis tabulated 20 published monoallelic CLPB patients across
    initial cohorts, 13 of whom had the isolated SCN9 phenotype (OMIM 619813)
    and 7 the neurodevelopmental type VIIA phenotype; the Polish national
    screening campaign reported 10 heterozygous CLPB carriers with childhood
    neutropenia.
  evidence:
  - reference: PMID:40194906
    reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "So far, 39 patients with biallelic pathogenic variants in CLPB (MGA 7B) have been described ... whereas for the dominant variants (MGA 7A and CLPB-SCN) 20 cases have been reported"
    explanation: Literature case count of 20 dominant CLPB cases (13 classified under isolated SCN9 in Table 1 of the review) prior to the Polish national cohort.
genetic:
- name: CLPB
  gene_term:
    preferred_term: CLPB
    term:
      id: hgnc:30664
      label: CLPB
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    In the defining series and the Care-for-Rare patients, the heterozygous
    missense variants cluster near the ATP-binding pocket of the C-terminal
    nucleotide-binding domain (p.Arg561Gln, p.Gly560Arg, p.Arg620His;
    PMID:35499078). The Polish carriers include ATPase-domain variants
    (p.Arg598Cys, p.Arg599Cys) and also variants in the ankyrin and D2
    domains, among them p.Arg297Trp (PMID:41383606). The arginine finger R561
    is the most frequently mutated residue across monoallelic CLPB disease.
  evidence:
  - reference: PMID:34115842
    reference_title: Heterozygous variants of CLPB are a cause of severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, the CLPB variants are distinct, consisting of heterozygous variants that cluster near the adenosine triphosphate-binding pocket."
    explanation: The causal variants are heterozygous and cluster near the ATP-binding pocket.
  - reference: PMID:35499078
    reference_title: HAX1-dependent control of mitochondrial proteostasis governs neutrophil granulocyte differentiation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surprisingly, we also identify monoallelic CLPB variants (G560R, R561Q, and R620H) associated with severe congenital neutropenia."
    explanation: Independent heterozygous variants in the ATP-binding domain in a second patient series.
  - reference: PMID:41383606
    reference_title: "The genetic landscape of congenital neutropenia in Poland: summary of the nationwide screening campaign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous CLPB alterations were located not only in the ATP domain, e.g., p.Arg598Cys, which has been described to affect mitochondrial function and induce apoptosis leading to neutropenia (28, 29), but also in the ankyrin and D2 domains, which turned out to affect CLPB oligomerization (data not shown)."
    explanation: Not all causal variants are in the ATP-binding domain.
  - reference: PMID:40194906
    reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations of this residue have been reported in nine unrelated patients, the largest number for any CLPB amino acid."
    explanation: >-
      R561 is the most frequently mutated residue in monoallelic CLPB disease.
      The count pools both dominant disorders, including R561W carriers with
      3-methylglutaconic aciduria.
  variants:
  - name: p.Arg561Gln (R561Q)
    description: >-
      Heterozygous missense substitution at the arginine finger (Arg561) of the
      C-terminal nucleotide-binding domain associated with severe congenital
      neutropenia without elevated urinary 3-methylglutaconic acid; retains HAX1
      binding in vitro.
    evidence:
    - reference: PMID:35499078
      reference_title: HAX1-dependent control of mitochondrial proteostasis governs neutrophil granulocyte differentiation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Surprisingly, we also identify monoallelic CLPB variants (G560R, R561Q, and R620H) associated with severe congenital neutropenia."
      explanation: Identifies heterozygous p.Arg561Gln in severe congenital neutropenia.
    - reference: PMID:40194906
      reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "E557K, G560G, R561G and R561Q are located in the conserved stretch including the arginine finger, with R561G and R561Q affecting the arginine finger itself."
      explanation: Places p.Arg561Gln directly at the conserved arginine finger of the CLPB nucleotide-binding domain.
    - reference: PMID:40194906
      reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Patients harbouring the R561W variant have elevated urinary levels of 3‐MGA, whereas patients with R561G and R561Q variants do not"
      explanation: Notes absence of elevated urinary 3-methylglutaconic acid in reported R561Q carriers.
    - reference: PMID:35499078
      reference_title: HAX1-dependent control of mitochondrial proteostasis governs neutrophil granulocyte differentiation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "While the R561Q mutant is competent for HAX1 binding (Figure 2G)"
      explanation: Demonstrates preserved HAX1 binding for the R561Q variant in vitro.
  - name: p.Gly560Arg (G560R)
    description: >-
      Heterozygous missense substitution in the C-terminal nucleotide-binding
      domain associated with severe congenital neutropenia; decreases wild-type
      CLPB disaggregase activity below 50% in 1:1 mixed oligomers.
    evidence:
    - reference: PMID:35499078
      reference_title: HAX1-dependent control of mitochondrial proteostasis governs neutrophil granulocyte differentiation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Surprisingly, we also identify monoallelic CLPB variants (G560R, R561Q, and R620H) associated with severe congenital neutropenia."
      explanation: Identifies heterozygous p.Gly560Arg in severe congenital neutropenia.
    - reference: PMID:40194906
      reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The oligomeric status has been described for the dominant variants K404T, P427L and G560R, which were assessed as a 1:1 mix with the wild‐type protein."
      explanation: Documents 1:1 mixed-oligomer biochemical characterization of G560R with wild-type CLPB.
    - reference: PMID:40194906
      reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The dominant mutations, K404T, P427L, N496K, E557K, G560R, R561G and R620C, also decreased the disaggregase activity of the wild‐type subunits in mixed oligomers. For all analysed variants, the observed disaggregase activity was lower than 50% of the activity of the wild type protein, which demonstrates that the dominant phenotype of the disorder is brought about by the inhibitory effect of mutant subunits on the wild type ones in mixed oligomers."
      explanation: Shows G560R reduces disaggregase activity below 50% of wild type in mixed oligomers.
  - name: p.Arg620His (R620H)
    description: >-
      Heterozygous missense substitution at sensor-2 residue Arg620 in the
      C-terminal nucleotide-binding domain associated with severe congenital
      neutropenia.
    evidence:
    - reference: PMID:35499078
      reference_title: HAX1-dependent control of mitochondrial proteostasis governs neutrophil granulocyte differentiation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Surprisingly, we also identify monoallelic CLPB variants (G560R, R561Q, and R620H) associated with severe congenital neutropenia."
      explanation: Identifies heterozygous p.Arg620His in severe congenital neutropenia.
    - reference: PMID:36170828
      reference_title: "Unique structural features govern the activity of a human mitochondrial AAA+ disaggregase, Skd3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "For protomers P2–P5, these pockets are well resolved, revealing a bound ATP that is contacted by canonical Walker A (K387), Walker B (E455), sensor-1 (N496), and sensor-2 (R620) residues (Figures 2E and S2I)."
      explanation: Identifies Arg620 as the canonical sensor-2 residue contacting bound ATP in the CLPB nucleotide-binding pocket.
  - name: p.Arg598Cys
    description: >-
      Known heterozygous ATPase-domain missense variant associated with isolated
      autosomal dominant neutropenia, impaired mitochondrial function, and
      precursor apoptosis.
    evidence:
    - reference: PMID:41383606
      reference_title: "The genetic landscape of congenital neutropenia in Poland: summary of the nationwide screening campaign."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Ten patients were carriers of heterozygous CLPB variants, including known p.Arg297Trp and p.Arg598Cys changes, associated with isolated dominant neutropenia and a novel p.Arg599Cys variant located as well in the ATPase domain."
      explanation: Documents p.Arg598Cys in isolated dominant neutropenia in the Polish cohort.
    - reference: PMID:41383606
      reference_title: "The genetic landscape of congenital neutropenia in Poland: summary of the nationwide screening campaign."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Heterozygous CLPB alterations were located not only in the ATP domain, e.g., p.Arg598Cys, which has been described to affect mitochondrial function and induce apoptosis leading to neutropenia (28, 29), but also in the ankyrin and D2 domains, which turned out to affect CLPB oligomerization (data not shown)."
      explanation: Summarizes the reported mitochondrial dysfunction and apoptosis associated with p.Arg598Cys.
  - name: p.Arg599Cys
    description: >-
      Heterozygous ATPase-domain missense variant identified in the Polish

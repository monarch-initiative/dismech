  - target: Impaired Mitochondrial Respiration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Intermembrane Space Protein Aggregation
  description: >-
    Without disaggregase activity, proteins of the mitochondrial intermembrane
    space and inner membrane, including the anti-apoptotic protein HAX1,
    become insoluble.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein refolding
    term:
      id: GO:0042026
      label: protein refolding
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial intermembrane space
    term:
      id: GO:0005758
      label: mitochondrial intermembrane space
  evidence:
  - reference: PMID:32573439
    reference_title: Skd3 (human ClpB) is a potent mitochondrial protein disaggregase that is inactivated by 3-methylglutaconic aciduria-linked mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Using Gene Ontology (GO) analysis for cellular component, we found that proteins in the inner mitochondrial membrane and intermembrane space were enriched in the insoluble fraction in the absence of Skd3"
    explanation: >-
      Shown in CLPB knockout cells; the dominant-negative variants are expected
      to act through the same loss of disaggregase activity.
  downstream:
  - target: HAX1 Insolubility
    causal_link_type: DIRECT
- name: HAX1 Insolubility
  description: >-
    HAX1 is a direct partner and stimulatory cofactor of CLPB and depends on it
    for solubility. HAX1 deficiency itself causes severe congenital neutropenia
    (Kostmann syndrome), which links CLPB dysfunction to the neutrophil lineage.
    HAX1 insolubility has been shown in CLPB-deficient cells, not with the
    dominant variants of this disorder, and one such variant (R561Q) still
    binds HAX1.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HAX1
    term:
      id: hgnc:16915
      label: HAX1
  evidence:
  - reference: PMID:32573439
    reference_title: Skd3 (human ClpB) is a potent mitochondrial protein disaggregase that is inactivated by 3-methylglutaconic aciduria-linked mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "In wild-type cells, HAX1 remained predominantly soluble (Figure 7d,e). However, when Skd3 was deleted HAX1 became predominantly insoluble (Figure 7d,e). Thus, Skd3 is essential for HAX1 solubility in cells."
    explanation: CLPB is required for HAX1 solubility; shown in knockout cells.
  - reference: PMID:42244541
    reference_title: HAX1 drives assembly and activation of the mitochondrial intermembrane space chaperone CLPB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Through biochemical reconstitution, we here find that HAX1 is a direct stimulatory cofactor of CLPB."
    explanation: HAX1 and CLPB act as one functional unit.
  - reference: PMID:39644357
    reference_title: Mitochondrial CLPB is a pro-survival factor at the onset of granulocytic differentiation of mouse myeloblastic cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "We found that CLPB-deficient 32Dcl3 cells showed a decreased mitochondrial membrane potential and increased levels of insoluble HAX1 aggregates in mitochondria, as compared to control cells."
    explanation: Insoluble HAX1 accumulates in CLPB-deficient mouse myeloblastic cells, the lineage that fails in this disorder.
  - reference: PMID:35499078
    reference_title: HAX1-dependent control of mitochondrial proteostasis governs neutrophil granulocyte differentiation.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "While the R561Q mutant is competent for HAX1 binding (Figure 2G)"
    explanation: At least one SCN variant does not lose HAX1 binding, so the HAX1 step is not shown for every variant.
  downstream:
  - target: Granulocytic Precursor Apoptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Neutrophil Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35499078
      reference_title: HAX1-dependent control of mitochondrial proteostasis governs neutrophil granulocyte differentiation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "we defined a potentially novel functional CLPB/HAX1/(PRKD2)/HSP27 axis with critical importance for the differentiation of neutrophil granulocytes and, thus, elucidated molecular and metabolic mechanisms underlying congenital neutropenia in patients with HAX1 deficiency as well as bi- and monoallelic mutations in CLPB."
      explanation: Places the CLPB/HAX1 axis upstream of neutrophil differentiation, including in monoallelic CLPB patients.
- name: Impaired Mitochondrial Respiration
  description: >-
    In overexpression models, myeloid cells expressing SCN-associated CLPB
    variants alongside wild-type CLPB show impaired mitochondrial function and
    severely reduced respiration, without increased sensitivity to endoplasmic
    reticulum stress. These models may not reflect patient cells. In
    CLPB-knockout mouse myeloblasts, apoptosis at the onset of differentiation
    is linked to reactive oxygen species; that link has not been shown with
    the SCN variants themselves.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cellular respiration
    term:
      id: GO:0045333
      label: cellular respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:34115842
    reference_title: Heterozygous variants of CLPB are a cause of severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, expression of CLPB variants is associated with impaired mitochondrial function but does not render cells more sensitive to endoplasmic reticulum stress."
    explanation: Expression of the variants of this disorder impairs mitochondrial function.
  - reference: PMID:40194906
    reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "MOLM-13 cells overexpressing selected SCN-related CLPB variants in addition to the native wild-type protein, which were studied as a model of the disease, demonstrated severely impaired respiration"
    explanation: Review summary of the respiration defect in a myeloid cell model of this disorder.
  - reference: PMID:40194906
    reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Neither CLPB knockout nor overexpression of the dominant negative pathogenic CLPB variants accurately reflect the respiratory phenotype of patient cells."
    explanation: The same review cautions that the overexpression models do not match patient cells.
  downstream:
  - target: Mitochondrial ROS Accumulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      No source shows that the respiratory defect is the origin of the excess
      reactive oxygen species; both are reported in CLPB-deficient cells.
- name: Mitochondrial ROS Accumulation
  description: >-
    CLPB-deficient myeloblasts lose mitochondrial membrane potential and
    produce excess reactive oxygen species when induced to differentiate, and
    their apoptosis depends on it: N-acetylcysteine, free fatty acids or
    citrate protect them. Shown in CLPB-knockout mouse 32Dcl3 cells, not with
    the dominant SCN variants.
  biological_scale: CELLULAR
  cell_types:

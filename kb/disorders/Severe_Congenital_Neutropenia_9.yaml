    reference_title: Heterozygous variants of CLPB are a cause of severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These CLPB variants associate with wild-type CLPB and inhibit its adenosine triphosphatase and disaggregase activity in a dominant-negative fashion."
    explanation: The variants of this disorder bind and inhibit wild-type CLPB.
  - reference: PMID:36170828
    reference_title: "Unique structural features govern the activity of a human mitochondrial AAA+ disaggregase, Skd3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, SCN-linked subunits sharply inhibit disaggregase activity, whereas MGCA7-linked subunits do not."
    explanation: Mixed-hexamer experiments show SCN-linked subunits poison wild-type CLPB, unlike recessive-disease subunits.
  downstream:

    evidence:
    - reference: PMID:41383606
      reference_title: "The genetic landscape of congenital neutropenia in Poland: summary of the nationwide screening campaign."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patient P73 with CLPB, p.Arg599Cys change, developed MDS at the age of 11, underwent HSCT, and survived, but suffered from post-transplant immune thrombocytopenia."
      explanation: Documents p.Arg599Cys in a heterozygous SCN9 carrier complicated by myelodysplastic syndrome.
  - name: p.Arg297Trp
    description: >-
      Heterozygous missense variant outside the C-terminal ATP-binding pocket
      associated with isolated autosomal dominant congenital neutropenia.
    evidence:
    - reference: PMID:41383606
      reference_title: "The genetic landscape of congenital neutropenia in Poland: summary of the nationwide screening campaign."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Ten patients were carriers of heterozygous CLPB variants, including known p.Arg297Trp and p.Arg598Cys changes, associated with isolated dominant neutropenia and a novel p.Arg599Cys variant located as well in the ATPase domain."
      explanation: Documents p.Arg297Trp in isolated dominant congenital neutropenia.
pathophysiology:
- name: Dominant-Negative Inhibition of CLPB Disaggregase
  description: >-
    Mutant CLPB subunits associate with wild-type subunits and inhibit both the
    ATPase and the disaggregase activity of the complex. Subunits carrying
    recessive-disease variants do not do this, which is why a single dominant
    allele causes disease while a single recessive allele does not.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CLPB
    term:
      id: hgnc:30664
      label: CLPB
  molecular_functions:
  - preferred_term: ATP-dependent protein disaggregase activity
    term:
      id: GO:0140545
      label: ATP-dependent protein disaggregase activity
    modifier: DECREASED
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  cellular_components:

phenotypes:
- name: Congenital neutropenia
  description: >-
    Severe neutropenia, presenting in the first year of life in most patients
    and later in childhood in some. In the Polish cohort neutrophil counts
    normalized with age in all heterozygous carriers.
  category: Hematological
  phenotype_term:
    preferred_term: Severe congenital neutropenia
    term:
      id: HP:0025826
      label: Severely decreased neutrophil count
  evidence:
  - reference: PMID:34115842
    reference_title: Heterozygous variants of CLPB are a cause of severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of 104 persons with congenital neutropenia identified heterozygous missense variants of CLPB (caseinolytic peptidase B) in 5 severe congenital neutropenia cases, with 5 more cases identified through additional sequencing efforts or clinical sequencing."
    explanation: Severe congenital neutropenia defines the disorder.
  - reference: PMID:35499078
    reference_title: HAX1-dependent control of mitochondrial proteostasis governs neutrophil granulocyte differentiation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, 3 of 4 patients (patients 1, 2, and 3) presented with severe neutropenia in the first year, and patient 4 presented with severe neutropenia in the seventh year of life leading to recurrent bacterial infections."
    explanation: Onset in infancy in most heterozygous patients, later in one.
  - reference: PMID:41383606
    reference_title: "The genetic landscape of congenital neutropenia in Poland: summary of the nationwide screening campaign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with heterozygous CLPB changes had neutropenia in childhood, but ANC normalized with age."
    explanation: Neutropenia in childhood that resolves with age in this cohort.
  sequelae:
  - target: Recurrent bacterial infections

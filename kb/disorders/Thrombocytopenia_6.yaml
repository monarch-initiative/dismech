name: Thrombocytopenia 6
creation_date: "2026-11-10T14:16:37Z"
category: Mendelian
synonyms:
- THC6
- thrombocytopenia type 6
- hereditary thrombocytopenia with early-onset myelofibrosis
- SRC-related thrombocytopenia
- SRC-RT
disease_term:
  preferred_term: thrombocytopenia 6
  term:
    id: MONDO:0014837
    label: thrombocytopenia 6
parents:
- Inherited thrombocytopenia
description: >-
  Thrombocytopenia 6 (THC6; OMIM:616937) is an autosomal dominant syndromic
  inherited platelet disorder caused by the germline heterozygous SRC
  c.1579G>A p.(Glu527Lys) (E527K) gain-of-function variant, the only disease
  allele reported. The substitution sits next to the C-terminal regulatory
  tyrosine that holds SRC in its closed, inactive conformation, so the kinase
  is constitutively active. In megakaryocytes the hyperactive kinase drives
  excess podosome formation and actin reorganization and blocks proplatelet
  formation, giving a lifelong macrothrombocytopenia with large, size-variable
  platelets that are poor in alpha granules and hyporeactive to collagen.
  Expressivity is highly variable, within and between families: some carriers
  have isolated thrombocytopenia, while others have early-onset myelofibrosis
  with hypercellular, trilineage-dysplastic marrow, splenomegaly, osteoporosis
  with fractures, premature loss of teeth and mild facial dysmorphism. A
  third family added immune dysregulation with recurrent infections and
  neurological features (language impairment, epilepsy), and a response to
  splenectomy and corticosteroids that led to an initial diagnosis of immune
  thrombocytopenia.
notes: >-
  Fewer than ten families are reported, so no phenotype frequency below is a
  population estimate; frequencies are omitted rather than inferred from one
  pedigree. No GeneReviews chapter exists for this disease or for SRC (offline
  Bookshelf index, cache/bookshelf/genereviews.csv). The entry keeps the
  numbered MONDO name: "Src-related thrombocytopenia" (SRC-RT) is used as a
  disease name in one primary report (PMID:35349645) and is recorded as a
  synonym, but is not yet a recurring or MONDO-recorded name. Myelofibrosis is
  curated here as a phenotype of the germline disorder; whether THC6
  predisposes to myeloid neoplasia has not been studied, and no somatic
  neoplasm is in scope for this entry.
inheritance:

    which is the appearance that prompts a primary myelofibrosis differential.
  diagnosis_term:
    preferred_term: bone marrow biopsy
    term:
      id: NCIT:C15193
      label: Bone Marrow Biopsy
  evidence:
  - reference: PMID:26936507
    reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with myelofibrosis have hypercellular bone marrow with trilineage dysplasia"
    explanation: The marrow findings in affected members of the founding pedigree.
- name: Molecular genetic testing
  description: >-
    Definitive. Sequencing identifies the single recurrent SRC c.1579G>A
    p.(Glu527Lys) allele; the gene was found by genome sequencing and all
    reported families carry the same substitution, so targeted testing of
    relatives is straightforward once it is known.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:26936507
    reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used genome sequencing and Human Phenotype Ontology patient coding to identify a gain-of-function mutation in SRC causing thrombocytopenia, myelofibrosis, bleeding, and bone pathologies in nine cases."
    explanation: Sequencing established the diagnosis in the founding pedigree.
differential_diagnoses:
- name: Immune thrombocytopenia
  description: >-
    The clinically important confusion. Four adults in the third kindred were
    diagnosed with ITP, responded to corticosteroids and were splenectomised
    with a sustained platelet rise, so a response to ITP-directed treatment
    does not exclude this disorder and had led to splenectomy in people whose
    thrombocytopenia was inherited.
  disease_term:
    preferred_term: immune thrombocytopenia
    term:
      id: MONDO:0008558
      label: autoimmune thrombocytopenic purpura
  distinguishing_features:
  - A multigenerational family history of thrombocytopenia
  - Large and giant platelets with an immature platelet fraction above 15%
  - The SRC p.E527K genotype
  evidence:
  - reference: PMID:35349645
    reference_title: "Src-related thrombocytopenia: a fine line between a megakaryocyte dysfunction and an immune-mediated disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four adults from the family were diagnosed with immune thrombocytopenia (ITP) and underwent splenectomy, achieving sustained platelet counts >75 × 109/L for several years"
    explanation: Members of a genetically confirmed kindred carried an ITP diagnosis and were treated as such.
- name: Gray platelet syndrome
  description: >-
    Patient platelets lack alpha granules and so resemble gray platelet
    syndrome on electron microscopy, and both disorders can show premature
    myelofibrosis and splenomegaly. The platelet population here is
    size-heterogeneous rather than uniformly large, which gray platelet
    syndrome is not.
  disease_term:
    preferred_term: gray platelet syndrome
    term:
      id: MONDO:0007686
      label: gray platelet syndrome
  distinguishing_features:
  - Both abnormally large and abnormally small platelets rather than uniformly large ones
  - Autosomal dominant transmission, against the recessive NBEAL2 disease
  evidence:
  - reference: PMID:26936507
    reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, some other features of our cases are not typical for classic GPS, such as the presence of both abnormally large and small platelets without any type of granules and lacking internal membranes"
    explanation: The authors state which features separate their cases from classic gray platelet syndrome.
- name: Congenital amegakaryocytic thrombocytopenia
  description: >-
    Raised plasma thrombopoietin is otherwise characteristic of
    MPL-inactivating disease, so the elevated levels here can point the wrong
    way. Progenitor culture separates them: CAMT stem cells fail to make
    megakaryocytes with thrombopoietin, while these produce more.
  disease_term:
    preferred_term: congenital amegakaryocytic thrombocytopenia
    term:
      id: MONDO:0800451
      label: congenital amegakaryocytic thrombocytopenia
  distinguishing_features:
  - Megakaryocyte colony output is increased rather than absent in thrombopoietin-supplemented culture
  - Marrow is hypercellular with abundant dysplastic megakaryocytes rather than amegakaryocytic
  evidence:
  - reference: PMID:26936507
    reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, hematopoietic stem cells (HSCs) from CAMT cases cannot form MKs in the presence of TPO, whereas SRC mutant blood stem cells produced more MK but also more myeloid (GEMM) colonies"
    explanation: Contrasts the progenitor behaviour of the two disorders directly.
- name: Other inherited thrombocytopenias
  description: >-
    The referral diagnosis in the founding pedigree was inherited
    thrombocytopenia with early-onset myelofibrosis, and all then-known
    inherited thrombocytopenia genes were excluded before SRC was found. The
    combination of both small and large platelets, raised thrombopoietin,
    increased marrow megakaryocytes and trilineage dysplasia did not match any
    of them.
  distinguishing_features:
  - Both unusually small and unusually large platelets in the same film
  - Elevated plasma thrombopoietin with increased rather than reduced marrow megakaryocytes
  evidence:
  - reference: PMID:26936507
    reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the previously described ITs matched entirely with the platelet phenotype in our cases"
    explanation: States that the phenotype did not fit the inherited thrombocytopenias known at the time.
treatments:
- name: Antifibrinolytic Therapy
  description: >-
    Tranexamic acid for mucosal bleeding and as cover for surgery or
    childbirth. No trial has been run in this disease; the practice is the
    general one for inherited thrombocytopenia and is cited as such.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Abnormal bleeding
  evidence:
  - reference: PMID:32527953
    reference_title: "Inherited thrombocytopenias: history, advances and perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tranexamic acid or local measures are the most frequent options for mild bleeding and tranexamic acid is counseled prior to surgery or childbirth if the thrombocytopenia is severe, with platelet concentrates on standby"
    explanation: >-
      A review of inherited thrombocytopenia as a class, not of this disease;
      the recommendation is extrapolated and the entry says so.
- name: Platelet Transfusion
  description: >-
    Reserved for severe bleeding and for surgical cover, again by
    extrapolation from inherited thrombocytopenia practice rather than from
    any series in this disease.
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Abnormal bleeding
  evidence:
  - reference: PMID:18278172
    reference_title: Congenital disorders associated with platelet dysfunctions.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Transfusion of platelets remains the most common treatment of severe bleeding, management with desmopressin is common for mild disorders"
    explanation: >-
      A review of congenital platelet disorders as a class; the practice is
      extrapolated to this disease, which has no transfusion series of its own.
- name: Corticosteroid Therapy
  description: >-
    Given to members of the third kindred under an ITP diagnosis, with a rise
    in platelet count. The response is real but does not make the disorder
    immune-mediated, and it is the reason the inherited cause was missed in
    that family for years.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Thrombocytopenia
  evidence:
  - reference: PMID:35349645
    reference_title: "Src-related thrombocytopenia: a fine line between a megakaryocyte dysfunction and an immune-mediated disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increases in platelet counts were also observed after corticosteroid therapy"
    explanation: Observed platelet response in genetically confirmed carriers.
- name: Splenectomy
  description: >-
    Four adults of the third kindred were splenectomised under an ITP
    diagnosis and held platelet counts above 75 x 10^9/L for years. Three
    members of the founding pedigree were also splenectomised, and there the
    platelet count and morphology did not correct. Recorded because it was
    done and because the genetic diagnosis is what prevents it being done
    again on the wrong indication, not as a recommended treatment.
  treatment_term:
    preferred_term: splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  target_mechanisms:
  - target: Thrombocytopenia
  evidence:
  - reference: PMID:35349645
    reference_title: "Src-related thrombocytopenia: a fine line between a megakaryocyte dysfunction and an immune-mediated disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four adults from the family were diagnosed with immune thrombocytopenia (ITP) and underwent splenectomy, achieving sustained platelet counts >75 × 109/L for several years"
    explanation: A sustained platelet response after splenectomy in the third kindred.
  - reference: PMID:26936507
    reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Three cases underwent splenectomy, which did not correct the platelet count or their atypical morphology."
    explanation: >-
      In the founding pedigree splenectomy did not work, so the response seen
      in the third kindred is not a general property of the disease.
- name: SRC Kinase Inhibition
  description: >-
    Investigational and not given to any patient. A small-molecule SRC
    inhibitor partly restored proplatelet formation in patient-derived and in
    E527K-transduced megakaryocytes in culture, which is the proof of concept
    for targeting the kinase. No clinical trial exists, and SRC-family
    inhibitors themselves cause thrombocytopenia and bleeding, so the step to
    patients is not a small one.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: SRC-family tyrosine kinase inhibitor
      term:
        id: NCIT:C1967
        label: Tyrosine Kinase Inhibitor
  target_mechanisms:
  - target: Impaired Proplatelet Formation
    evidence:
    - reference: PMID:26936507
      reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Addition of SRC inhibitor-1 starting from culture day 1 could partially restore proplatelet formation for case 31, whereas it had no discernible effect on control or unaffected cells"
      explanation: Rescue of the proplatelet defect in patient megakaryocytes in culture.
  evidence:
  - reference: PMID:26936507
    reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overactive SRC in patient-derived MKs causes a reduction in proplatelet formation, which can be rescued by SRC kinase inhibition"
    explanation: States the rescue that makes SRC inhibition a candidate target.
- name: Genetic Counseling
  description: >-
    Each child of a carrier has a one-in-two chance of inheriting the allele.
    Counselling also covers the variable expressivity, since an affected
    relative may have isolated thrombocytopenia or the full syndrome with
    myelofibrosis and bone disease.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35349645
    reference_title: "Src-related thrombocytopenia: a fine line between a megakaryocyte dysfunction and an immune-mediated disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Src-related thrombocytopenia (SRC-RT) is a rare autosomal dominant, inherited platelet disorder resulting from the p.E527K heterozygous germline gain-of-function variant of Src."
    explanation: >-
      Supports the autosomal dominant transmission the counselling is based on.
      The recurrence risk itself is the arithmetic of that mode of inheritance
      and is not separately cited.
animal_models:
- name: Zebrafish src E525K mRNA overexpression
  species: Zebrafish
  genotype: wild type injected with src mRNA carrying E525K, the zebrafish equivalent of human E527K
  publication: PMID:26936507
  genes:
  - preferred_term: src
    term:
      id: ZFIN:ZDB-GENE-030131-3809
      label: src
  description: >-
    The only in vivo model in the disease direction. Mutant mRNA is injected
    into embryos, which then show reduced thrombocytes and smaller bones; a
    SRC inhibitor in the fish water prevents the bone change. The gene bound
    here is zebrafish src, the ortholog of human SRC (hgnc:11283); E525K is
    the zebrafish residue corresponding to human E527K.
  modeled_mechanisms:
  - target: Altered Bone Remodeling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Embryos injected with mutant src grow significantly smaller bones, and
      src-depleted embryos grow larger ones, matching the direction of the
      human osteoporosis against the osteopetrosis of SRC loss.
    limitations: >-
      Larval bone at 5 days post-fertilisation is not adult bone remodelling,
      and the model works by transient mRNA overexpression rather than a
      heterozygous germline allele at endogenous dosage.
    readouts:
    - name: Bone size at 5 days post-fertilisation
      target: Altered Bone Remodeling
      direction: DECREASED
      interpretation: Skeletal correlate of the bone node in this model.
      evidence:
      - reference: PMID:26936507
        reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "E525K src–injected embryos at 5 dpf have significantly smaller bones compared to wild-type–injected embryos, and this change was absent when SRC inhibitor-1 was added to the fish water"
        explanation: The bone measurement, and its reversal by SRC inhibition.
    evidence:
    - reference: PMID:26936507
      reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Expression of mutated src in zebrafish recapitulates patients' blood and bone phenotypes."
      explanation: The authors' own summary of what the model reproduces.
  - target: Impaired Proplatelet Formation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Thrombocyte numbers fall in mutant embryos, but the mechanism this node
      states cannot be modelled in zebrafish at all.
    limitations: >-
      Zebrafish thrombopoiesis has neither megakaryocyte endomitosis nor
      proplatelet formation with loss of the nucleus, so a reduced thrombocyte
      count in this model is not evidence about proplatelet formation. The
      reduction in GFP-positive thrombocytes also did not reach statistical
      significance on triplicate injection.
    evidence:
    - reference: PMID:26936507
      reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "several aspects known for human megakaryopoiesis, including MK endomitosis and proplatelet formation with loss of the nucleus, are not present in zebrafish"
      explanation: The authors state the species difference that puts this node out of the model's reach.
- name: Src knockout mouse
  species: Mouse
  genotype: Src-/-
  publication: PMID:7689855
  genes:
  - preferred_term: Src
    term:
      id: MGI:98397
      label: Src
  description: >-
    The gene deleted is mouse Src, the ortholog of human SRC (hgnc:11283).
    A loss-of-function model, the opposite perturbation to the human disease.
    It is included because its bone phenotype is the mirror image: these mice
    develop osteopetrosis from osteoclasts that cannot form ruffled borders,
    where patients lose bone. That opposition is what ranked SRC first in the
    phenotype-matching search that found the gene.
  modeled_mechanisms:
  - target: Altered Bone Remodeling
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Deleting Src raises bone density; the human gain-of-function allele
      lowers it. The model establishes that SRC activity sets osteoclast
      resorption, and nothing more about this disease.
    limitations: >-
      Loss of function rather than gain, homozygous rather than heterozygous,
      and the direction of the bone phenotype is reversed. These mice have
      normal platelet counts and no bleeding, so the model says nothing about
      the haematological disease.
    readouts:
    - name: Osteoclast ruffled border formation
      target: Altered Bone Remodeling
      direction: ABOLISHED
      interpretation: The osteoclast defect behind the osteopetrosis of SRC loss.
      evidence:
      - reference: PMID:7689855
        reference_title: Histomorphometric and immunocytochemical studies of src-related osteopetrosis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Histomorphometric analysis of vertebrae and humeri from 9-10 month old src-mutant mice has revealed that the osteopetrosis persists and that osteoclasts from these older mice also fail to form ruffled borders."
        explanation: The persisting bone phenotype and its cellular basis.
    evidence:
    - reference: PMID:26936507
      reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, the Src–/– mouse presented with increased bone density (osteopetrosis), which is the opposite of the osteoporosis of the pedigree cases"
      explanation: >-
        Supports treating this model as informative for the bone node by
        stating the direction it runs in: its bone phenotype is the opposite of
        the patients'. The negative claim itself is carried by the link's
        FAILS_TO_RECAPITULATE relationship, not by this item.
- name: Hck/Src double knockout mouse
  species: Mouse
  genotype: hck-/- src-/-
  publication: PMID:8634424
  genes:
  - preferred_term: Src
    term:
      id: MGI:98397
      label: Src
  - preferred_term: Hck
    term:
      id: MGI:96052
      label: Hck
  description: >-
    The genes deleted are mouse Src, the ortholog of human SRC (hgnc:11283),
    and mouse Hck, a second Src-family kinase that no report implicates in
    this human disease.
    Also loss of function, and included only for the marrow-environment
    result: severe osteopetrosis in these mice drives extramedullary
    haematopoiesis, anaemia and leukopenia, and transplant experiments show
    the defect lies in the marrow environment rather than in the stem cells.
  modeled_mechanisms:
  - target: Altered Bone Remodeling
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Shows that a bone phenotype arising from SRC-family loss can by itself
      displace haematopoiesis from the marrow. The direction of the bone
      change is again the reverse of the human disease.
    limitations: >-
      Double loss of function in two kinases, against a single heterozygous
      gain-of-function allele in patients; the splenomegaly here follows
      osteopetrosis, while in patients it follows myelofibrosis.
    evidence:
    - reference: PMID:8634424
      reference_title: Deficiency of the Hck and Src tyrosine kinases results in extreme levels of extramedullary hematopoiesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "surviving animals develop a severe form of osteopetrosis, resulting in extreme levels of splenic extramedullary hematopoiesis, anemia, and leukopenia"
      explanation: The marrow-environment consequence of SRC-family loss in bone.
experimental_models:
- name: Patient-derived megakaryocyte culture
  description: >-
    Blood stem cells from three members of the founding pedigree, grown with
    thrombopoietin. They form abundant immature megakaryocytes that make
    almost no proplatelets, and a SRC inhibitor partly restores proplatelet
    formation. This is the closest thing to the human mechanism anyone has
    put in a dish.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  genes:
  - preferred_term: SRC
    term:
      id: hgnc:11283
      label: SRC
  publication: PMID:26936507
  modeled_mechanisms:
  - target: Impaired Proplatelet Formation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Patient megakaryocytes reproduce the proplatelet defect in culture, and
      inhibiting SRC partly reverses it.
    limitations: >-
      Three cases from one pedigree, and the culture lacks the marrow niche
      and the sinusoidal vessel wall that proplatelet extension happens
      against in vivo.
    readouts:
    - name: Proplatelet-forming megakaryocytes in culture
      target: Impaired Proplatelet Formation
      direction: DECREASED
      interpretation: Direct cellular measurement of the node.
      evidence:
      - reference: PMID:26936507
        reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Blood stem cells of three pedigree cases, when cultured with TPO, formed numerous immature MKs with almost no proplatelets"
        explanation: The proplatelet measurement in patient-derived cells.
    evidence:
    - reference: PMID:26936507
      reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Overactive SRC in patient-derived MKs causes a reduction in proplatelet formation, which can be rescued by SRC kinase inhibition"
      explanation: Links the cultured defect to SRC activity by rescue.
  - target: Megakaryocyte Podosome Excess and Actin Disorganization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Active-SRC-positive podosome rosettes appear in patient megakaryocytes

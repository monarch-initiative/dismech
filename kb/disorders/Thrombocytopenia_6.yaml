    reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Morphological examination of platelets from three cases by electron microscopy (EM) shows heterogeneous-sized platelets"
    explanation: Electron microscopy of patient platelets in the founding pedigree.
- name: Platelet aggregometry
  description: >-

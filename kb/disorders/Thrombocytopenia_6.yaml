clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Expressivity ranges from isolated thrombocytopenia with no bleeding to
    early-onset myelofibrosis with splenomegaly, osteoporosis with fractures,
    premature edentulism and, in one member of the founding pedigree, fatal
    bleeding. The burden is set by which end of that range a person sits at,
    and nothing yet predicts which.
  evidence:
  - reference: PMID:35349645
    reference_title: "Src-related thrombocytopenia: a fine line between a megakaryocyte dysfunction and an immune-mediated disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical features ranged from isolated thrombocytopenia to complex syndromic manifestations characterized by thrombocytopenia, bleeding, myelofibrosis, splenomegaly, and bone disease."
    explanation: States the range of severity across reported patients.
  - reference: PMID:26936507
    reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied a three-generation pedigree with a dominant inheritance of bleeding with fatal consequences for one of the nine cases."
    explanation: The severe end of the range, in the founding pedigree.
discussions:
- discussion_id: thc6_myeloid_malignancy_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does germline SRC p.E527K carry a risk of myeloid neoplasia, as several
    other inherited thrombocytopenia genes do?
  rationale: >-
    Patients have hypercellular marrow with trilineage dysplasia, expanded
    myeloid and megakaryocyte colony output and early myelofibrosis, and SRC
    is an oncogene. That combination is what raises the question. No cohort is
    large enough or followed long enough to answer it, and no reported patient
    has developed a myeloid neoplasm. The entry therefore records no
    predisposition claim in either direction; the marrow findings are curated
    as phenotypes of the germline disorder.
  attaches_to:
  - pathophysiology#Expanded Myeloid and Megakaryocyte Progenitor Output
  - phenotypes#Myelofibrosis
  - phenotypes#Trilineage marrow dysplasia
  posed_by: "dismech curation (issue #16965)"
- discussion_id: thc6_variable_expressivity_modifiers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether a carrier of the single recurrent SRC p.E527K
    allele has isolated thrombocytopenia or the full syndrome with
    myelofibrosis, bone disease and neurological features?
  rationale: >-
    Every reported family carries the same substitution, so genotype cannot
    explain the range, which runs from a 2-year-old with isolated
    non-syndromic thrombocytopenia to fatal bleeding and juvenile
    myelofibrosis. Expressivity varies within single pedigrees as well as
    between them, which argues against ascertainment alone. No modifier locus,
    environmental factor or somatic second event has been looked for.
  attaches_to:
  - genetic#SRC
  - clinical_burden#
  posed_by: "dismech curation (issue #16965)"
- discussion_id: thc6_immune_consumption_component
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    How much of the thrombocytopenia is failed production and how much is
    immune-mediated consumption?
  rationale: >-
    The founding pedigree's mechanism is a production defect, and splenectomy
    there corrected neither the count nor the morphology. In the third
    kindred, four adults held platelet counts above 75 x 10^9/L for years
    after splenectomy and rose on corticosteroids, and their platelets showed
    constitutive BTK and phospholipase C-gamma-2 activation with increased
    ERK phosphorylation in B cells. Both observations are solid and they do
    not sit comfortably together. The authors read it as production failure
    plus a consumptive component; which dominates in a given patient is
    unsettled, and it decides whether immune-directed treatment is ever
    appropriate.
  attaches_to:
  - pathophysiology#Constitutive BTK and PLCG2 Signaling
  - pathophysiology#Impaired Proplatelet Formation
  - treatments#Splenectomy
  posed_by: "dismech curation (issue #16965)"
- discussion_id: thc6_no_mammalian_gain_of_function_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    No mammalian model carries the gain-of-function allele, so is the mouse
    bone biology transferable to a disease that runs in the opposite
    direction?
  rationale: >-
    Both mouse models are knockouts and both give osteopetrosis, the reverse
    of the patients' osteoporosis; they also have normal platelet counts and
    no bleeding. The zebrafish model does carry the activating allele and does
    reproduce the smaller-bone direction, but zebrafish have neither
    megakaryocyte endomitosis nor proplatelet formation, so they cannot model
    the haematological mechanism at all. No knock-in mouse and no patient
    iPSC-derived megakaryocyte line has been reported, which leaves every in
    vivo statement about the haematological disease resting on three families
    and on culture work.
  attaches_to:
  - pathophysiology#Altered Bone Remodeling
  - pathophysiology#Impaired Proplatelet Formation
  posed_by: "dismech curation (issue #16965)"

pathophysiology:
- name: Constitutive SRC Kinase Activation
  description: >-
    Glu527 sits next to Tyr530, the C-terminal tyrosine whose phosphorylation
    holds SRC in its closed, autoinhibited conformation. The E527K
    substitution is predicted to break that clamp, and the variant protein
    shows raised kinase activity and activation-loop Tyr419
    phosphorylation. In patient platelets the active form of SRC
    predominates and overall tyrosine phosphorylation is increased.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION

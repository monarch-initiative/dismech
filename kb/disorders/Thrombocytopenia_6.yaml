      reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Patient-derived and E527K-transduced MKs show Y419 SRC-positive stained podosomes that induce altered actin organization"
      explanation: The podosome and actin finding in patient cells.
- name: Lentiviral E527K-transduced megakaryocyte culture
  description: >-
    Healthy-donor stem cells transduced with E527K SRC and differentiated to
    megakaryocytes. It separates the allele from the patients' genetic
    background: the same proplatelet defect appears on a normal background.

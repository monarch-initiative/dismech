diagnosis:
- name: Complete blood count with platelet indices
  description: >-
    The first-line test. Platelet counts are variable even within one kindred,
    the mean platelet volume is raised and the immature platelet fraction is
    high, so a normal count in one relative does not exclude the variant in
    another.
  diagnosis_term:
    preferred_term: complete blood count with platelet indices
    term:
      id: NCIT:C28133
      label: Blood Cell Count
  evidence:
  - reference: PMID:35349645
    reference_title: "Src-related thrombocytopenia: a fine line between a megakaryocyte dysfunction and an immune-mediated disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients presented with rather variable platelet counts (38-139 × 109/L), mildly impaired platelet function, >15% immature platelet fraction, and with a significant proportion of large-giant platelets."
    explanation: Gives the count range, the immature platelet fraction and the large-platelet finding that the blood count reports.
- name: Peripheral blood film morphology
  description: >-
    Light microscopy of the film shows reduced platelet numbers with a
    proportion that appear grey for want of alpha granules, alongside both
    unusually large and unusually small forms.
  diagnosis_term:
    preferred_term: peripheral blood film microscopy
    term:
      id: NCIT:C16853
      label: Microscopy
  evidence:
  - reference: PMID:26936507
    reference_title: "A dominant gain-of-function mutation in universal tyrosine kinase SRC causes thrombocytopenia, myelofibrosis, bleeding, and bone pathologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microscopic inspection of the blood film showed a reduced number of platelets, of which about 10 to 30% have a grayish appearance because of a lack of α-granules"
    explanation: The blood film finding in the founding pedigree.
- name: Platelet electron microscopy
  description: >-
    Electron microscopy confirms the size heterogeneity and the alpha-granule
    paucity that give the platelets a gray-platelet-like appearance.
  diagnosis_term:
    preferred_term: platelet electron microscopy
    term:
      id: NCIT:C16854
      label: Electron Microscopy
  evidence:

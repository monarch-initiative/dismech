    spondylo-epi-metaphyseal involvement and characteristic lacy iliac changes,
    typically without intellectual disability or microcephaly.
  evidence:
  - reference: PMID:23042644
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

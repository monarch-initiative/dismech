genetic:
- name: RASGRP2
  gene_term:
    preferred_term: RASGRP2
    term:
      id: hgnc:9879
      label: RASGRP2
  relationship_type: CAUSATIVE
  notes: >-
    Encodes CalDAG-GEFI. Biallelic loss of function causes the disorder;
    reported alleles include c.G742T, c.706C>T (p.Q236X) and c.887G>A (p.C296Y).
    The gene is expressed in neutrophils as well as platelets and CalDAG-GEFI is
    described as critical for integrin signalling in both, yet the clinical
    phenotype is platelet-restricted - patient neutrophils show normal integrin
    expression, with the abnormality detectable only as impaired
    manganese-induced fibrinogen binding in vitro. This dissociation, not the
    gene's expression pattern, is what distinguishes the disorder from leukocyte
    adhesion deficiency III.
  evidence:
  - reference: PMID:24958846
    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional deficiencies were confined to platelets and megakaryocytes with no leukocyte alteration. This contrasts with the phenotype seen in type III leukocyte adhesion deficiency caused by the absence of kindlin-3."
    explanation: >-
      Supports the lineage restriction and the explicit contrast with LAD-III
      drawn in this gene block.
  - reference: PMID:28762304
    reference_title: Identification of two novel mutations in RASGRP2 affecting platelet CalDAG-GEFI expression and function in patients with bleeding diathesis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient neutrophils showed normal integrin expression, but impaired Mn2+-induced fibrinogen binding."
    explanation: >-
      PARTIAL - it qualifies the "no leukocyte alteration" statement by
      demonstrating a detectable in vitro neutrophil abnormality without
      clinical consequence, which is the nuance this block records.

diagnosis:
- name: Aggregometry with a Phorbol-Ester Arm, Plus Receptor Quantitation
  diagnosis_term:
    preferred_term: platelet aggregation measurement
    term:
      id: NCIT:C103427
      label: Platelet Aggregation Measurement
  description: >-
    The disorder imitates Glanzmann thrombasthenia on a standard workup, and two
    additions separate them. First, quantify surface alphaIIbbeta3 - it is
    normal here and deficient there. Second, include a phorbol ester (PMA) arm
    on the aggregometry panel: PMA activates protein kinase C downstream of the
    missing exchange factor, so aggregation is preserved with PMA while failing
    to ADP, collagen and the other physiological agonists. Prolonged PFA-100
    closure times with a normal platelet count and morphology complete the
    picture, and sequencing confirms. Without the PMA arm the two disorders are
    not distinguishable by aggregometry alone.
  evidence:
  - reference: PMID:28762304
    reference_title: Identification of two novel mutations in RASGRP2 affecting platelet CalDAG-GEFI expression and function in patients with bleeding diathesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet phenotyping showed: prolonged PFA-100 closure times; normal expression of major glycoprotein receptors"
    explanation: >-
      Establishes the two findings that open the workup - an abnormal global
      closure time with normal receptor expression.
  - reference: PMID:28762304
    reference_title: Identification of two novel mutations in RASGRP2 affecting platelet CalDAG-GEFI expression and function in patients with bleeding diathesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "platelet αIIbβ3 activation, as assessed by fibrinogen binding, was greatly impaired in response to all agonists except PMA"
    explanation: >-
      Supports the discriminating PMA arm on which this diagnostic entry turns.
- name: RASGRP2 Molecular Genetic Testing
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    Targeted inherited-platelet-disorder multigene panel testing or whole-exome
    sequencing establishes the molecular diagnosis by identifying biallelic
    pathogenic RASGRP2 variants, distinguishing BDPLT18 definitively from
    Glanzmann thrombasthenia and other qualitative platelet disorders.
  results: Biallelic pathogenic or likely pathogenic variants in RASGRP2 confirm the diagnosis.
  evidence:
  - reference: PMID:27235135
    reference_title: "Novel mutations in RASGRP2, which encodes CalDAG-GEFI, abrogate Rap1 activation, causing platelet dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By using a panel of 71 genes, we identified a homozygous change (c.1142C>T) in exon 10 of RASGRP2 in a 9-year-old child of Chinese origin (family 1)."
    explanation: Demonstrates diagnostic confirmation using a targeted inherited bleeding/platelet gene panel.
  - reference: PMID:28637664
    reference_title: "Expanded repertoire of RASGRP2 variants responsible for platelet dysfunction and severe bleeding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven cases harbored 11 different, previously unreported RASGRP2 variants that were biallelic and likely pathogenic."
    explanation: High-throughput sequencing across inherited bleeding cohorts establishes biallelic RASGRP2 variants as the molecular diagnostic standard.
treatments:
- name: Platelet Transfusion
  description: >-
    Transfusion of functional donor platelets supplies CalDAG-GEFI-competent
    platelets to treat or prevent severe mucocutaneous, surgical, or dental
    hemorrhage, required at least once in 78% of reported biallelic RASGRP2
    cases. Clinical refractoriness requiring rFVIIa has been reported, and in a
    Rasgrp2-/- mouse model transfusion efficacy is blunted when dysfunctional
    endogenous platelets are recruited into the forming plug without
    participating in clot contraction.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion

    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, the PKC- and ADP-dependent pathways allow residual platelet activation in the absence of functional CalDAG-GEFI."
    explanation: >-
      States the residual pathway and its persistence despite loss of the
      exchange factor.
  downstream:
  - target: Impaired Integrin alphaIIbbeta3 Inside-Out Activation
    causal_link_type: DIRECT
    description: >-
      Partially offsets the activation defect rather than abolishing it, which
      is why this node is curated as an escape route into the same effector.
- name: Impaired Rac1-Dependent Platelet Spreading and Adhesion Under Flow
  role: effector
  biological_scale: CELLULAR
  description: >-
    A cytoskeletal arm separate from integrin activation: patient platelets fail
    to form thrombi under flow and fail to spread normally, and this is
    attributed to reduced Rac1 GTP-binding rather than to the Rap1-integrin
    route. It is the more sensitive readout of the two - heterozygotes, who do
    not bleed and whose platelet aggregation is normal, nonetheless fail to
    adhere under flow and to spread like their homozygous relatives, so this arm
    detects a defect that the aggregation arm does not.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: DECREASED
  evidence:
  - reference: PMID:24958846
    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation impairs the platelet's ability to form thrombi under flow and spread normally as a consequence of reduced Rac1 GTP-binding."
    explanation: >-
      States the flow and spreading defects and their attribution to Rac1, which
      is what separates this node from the Rap1-integrin arm.
  - reference: PMID:24958846
    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous did not suffer from bleeding and have normal platelet aggregation; however, their platelets mimicked homozygous ones by failing to undergo normal adhesion under flow and spreading."
    explanation: >-
      Supports the claim that this arm is the more sensitive readout, being

- name: Failure of CalDAG-GEFI-Dependent Rap1 Activation
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The rate-limiting lesion. CalDAG-GEFI is activated by rising cytoplasmic
    calcium downstream of phospholipase-C-coupled agonist receptors, and its
    main target is Rap1, the small GTPase that regulates integrin-mediated
    adhesion. Patient platelets show reduced ability to activate Rap1, and
    expressing the mutant protein in HEK293T cells abolishes Rap1 activation on
    stimulation - a heterologous confirmation that separates the molecular
    defect from anything else in the patient's platelet.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  molecular_functions:

experimental_models:
- name: Patient megakaryocyte culture with wild-type RASGRP2 rescue
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Cultured megakaryocytes from patients, transfected with wild-type RASGRP2.
    The rescue corrects the functional deficiency, which closes the causal loop
    between the variant and the platelet phenotype in the patient's own cells
    rather than in a heterologous line.
  modeled_mechanisms:
  - target: Failure of CalDAG-GEFI-Dependent Rap1 Activation
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Restoring wild-type CalDAG-GEFI in patient megakaryocytes corrects the
      functional defect, establishing sufficiency of the gene for the phenotype.
    limitations: >-
      Cultured megakaryocytes, not circulating platelets, so the rescue is
      measured in the precursor rather than in the anucleate cell that does the
      haemostatic work; and transfection gives supraphysiological, transient
      expression rather than the endogenous regulation the gene normally has.
    readouts:

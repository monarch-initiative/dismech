    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing, we identified the culprit mutation (cG742T) in the RAS guanyl-releasing protein-2 (RASGRP2) gene coding for calcium- and DAG-regulated guanine exchange factor-1 (CalDAG-GEFI)."
    explanation: >-
      The gene-discovery statement establishing RASGRP2 as causal.
  - reference: PMID:28762304
    reference_title: Identification of two novel mutations in RASGRP2 affecting platelet CalDAG-GEFI expression and function in patients with bleeding diathesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis identified two new homozygous variants in RASGRP2: c.706C>T (p.Q236X) and c.887G>A (p.C296Y). In both patients, CalDAG-GEFI protein was not detectable in platelet lysates"
    explanation: >-
      Supports the additional alleles and the loss of detectable protein
      described in this node.
  - reference: PMID:27235135
    reference_title: "Novel mutations in RASGRP2, which encodes CalDAG-GEFI, abrogate Rap1 activation, causing platelet dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CalDAG-GEFI expression was markedly reduced in platelets from all patients, and by using a novel in vitro assay, we found that the nucleotide exchange activity was dramatically reduced in CalDAG-GEFI p.Ser381Phe."
    explanation: >-
      Direct biochemical demonstration that a catalytic-domain RASGRP2 variant
      dramatically reduces CalDAG-GEFI nucleotide exchange activity.
  downstream:
  - target: Failure of CalDAG-GEFI-Dependent Rap1 Activation
    causal_link_type: DIRECT
    description: >-
      CalDAG-GEFI is the calcium-responsive exchange factor for Rap1 in
      platelets, so its loss removes that activation route.
- name: Failure of CalDAG-GEFI-Dependent Rap1 Activation
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The rate-limiting lesion. CalDAG-GEFI is activated by rising cytoplasmic
    calcium downstream of phospholipase-C-coupled agonist receptors, and its
    main target is Rap1, the small GTPase that regulates integrin-mediated
    adhesion. Patient platelets show reduced ability to activate Rap1, and
    expressing the mutant protein in HEK293T cells abolishes Rap1 activation on
    stimulation - a heterologous confirmation that separates the molecular
    defect from anything else in the patient's platelet.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: Rap protein signal transduction
    term:
      id: GO:0032486
      label: Rap protein signal transduction
    modifier: DECREASED
  evidence:
  - reference: PMID:24958846
    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelets from individuals carrying the mutation present a reduced ability to activate Rap1 and to perform proper αIIbβ3 integrin inside-out signaling."
    explanation: >-
      Direct patient evidence for the Rap1 activation defect and its coupling to
      integrin inside-out signalling.
  - reference: PMID:24958846
    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of CalDAG-GEFI mutant in HEK293T cells abolished Rap1 activation upon stimulation."
    explanation: >-
      Heterologous confirmation that the variant itself, rather than some other
      platelet abnormality, causes the Rap1 defect.
  downstream:
  - target: Impaired Integrin alphaIIbbeta3 Inside-Out Activation
    causal_link_type: DIRECT
    description: >-
      Rap1 is the immediate upstream regulator of talin/kindlin-mediated
      integrin activation.
  - target: Impaired Rac1-Dependent Platelet Spreading and Adhesion Under Flow
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A second, cytoskeletal consequence, reported as following from reduced
      Rac1 GTP-binding rather than directly from Rap1.
- name: Impaired Integrin alphaIIbbeta3 Inside-Out Activation
  role: effector
  biological_scale: CELLULAR
  conforms_to: "primary_hemostatic_plug_failure#Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling"
  description: >-
    The integrin is expressed normally - major glycoprotein receptor levels are
    normal in patients - but fibrinogen binding is greatly impaired in response
    to every agonist tested except phorbol ester. That single exception is
    mechanistically the most informative result in the disorder: phorbol ester
    activates protein kinase C directly, downstream of the missing exchange
    factor, and it restores aggregation, which localizes the block precisely to
    the CalDAG-GEFI step and demonstrates that a parallel PKC route to the same
    integrin exists and is intact.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: integrin inside-out activation
    term:
      id: GO:0033622
      label: integrin activation
    modifier: DECREASED
  evidence:
  - reference: PMID:28762304
    reference_title: Identification of two novel mutations in RASGRP2 affecting platelet CalDAG-GEFI expression and function in patients with bleeding diathesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "platelet αIIbβ3 activation, as assessed by fibrinogen binding, was greatly impaired in response to all agonists except PMA"
    explanation: >-
      States both the integrin activation defect and the phorbol-ester exception
      that localizes the block, which is the core claim of this node.
  - reference: PMID:28762304
    reference_title: Identification of two novel mutations in RASGRP2 affecting platelet CalDAG-GEFI expression and function in patients with bleeding diathesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "normal expression of major glycoprotein receptors; severely reduced platelet aggregation response to ADP and collagen (both patients)"
    explanation: >-
      Supports the combination that defines a functional rather than structural
      thrombasthenia - normal receptor expression with lost aggregation.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      Without integrin activation the platelets cannot bridge into an aggregate.
  - target: Impaired Platelet Aggregation with Normal Receptor Expression
    causal_link_type: DIRECT
    description: >-
      Loss of agonist-stimulated integrin alphaIIbbeta3 activation produces
      severely impaired platelet aggregation despite normal surface glycoprotein
      levels.
    evidence:
    - reference: PMID:28762304
      reference_title: Identification of two novel mutations in RASGRP2 affecting platelet CalDAG-GEFI expression and function in patients with bleeding diathesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "normal expression of major glycoprotein receptors; severely reduced platelet aggregation response to ADP and collagen (both patients)"
      explanation: Connects the inside-out integrin activation defect directly to the diagnostic aggregometry phenotype.
- name: Residual PKC- and ADP-Dependent Platelet Activation
  role: adaptive_escape
  biological_scale: CELLULAR
  description: >-
    The compensating pathway, and a real one rather than a theoretical
    possibility. PKC- and ADP-dependent signalling allows residual platelet
    activation in the absence of functional CalDAG-GEFI, which is why the
    aggregation defect is severe but not absolute and why the disorder's
    severity varies. Its existence is also what makes CalDAG-GEFI a plausible
    antithrombotic target: a pathway with a backup can be blocked without
    abolishing haemostasis outright.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet activation
    term:
      id: GO:0030168
      label: platelet activation
    modifier: DECREASED
  evidence:
  - reference: PMID:24958846
    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, the PKC- and ADP-dependent pathways allow residual platelet activation in the absence of functional CalDAG-GEFI."
    explanation: >-
      States the residual pathway and its persistence despite loss of the
      exchange factor.
  downstream:
  - target: Impaired Integrin alphaIIbbeta3 Inside-Out Activation
    causal_link_type: DIRECT
    description: >-
      Partially offsets the activation defect rather than abolishing it, which
      is why this node is curated as an escape route into the same effector.
- name: Impaired Rac1-Dependent Platelet Spreading and Adhesion Under Flow
  role: effector
  biological_scale: CELLULAR
  description: >-
    A cytoskeletal arm separate from integrin activation: patient platelets fail
    to form thrombi under flow and fail to spread normally, and this is
    attributed to reduced Rac1 GTP-binding rather than to the Rap1-integrin
    route. It is the more sensitive readout of the two - heterozygotes, who do
    not bleed and whose platelet aggregation is normal, nonetheless fail to
    adhere under flow and to spread like their homozygous relatives, so this arm
    detects a defect that the aggregation arm does not.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: DECREASED
  evidence:
  - reference: PMID:24958846
    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation impairs the platelet's ability to form thrombi under flow and spread normally as a consequence of reduced Rac1 GTP-binding."
    explanation: >-
      States the flow and spreading defects and their attribution to Rac1, which
      is what separates this node from the Rap1-integrin arm.
  - reference: PMID:24958846
    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous did not suffer from bleeding and have normal platelet aggregation; however, their platelets mimicked homozygous ones by failing to undergo normal adhesion under flow and spreading."
    explanation: >-
      Supports the claim that this arm is the more sensitive readout, being
      abnormal in non-bleeding heterozygotes.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Contributes to the haemostatic failure, though the heterozygote data show
      it is not on its own sufficient to cause bleeding.

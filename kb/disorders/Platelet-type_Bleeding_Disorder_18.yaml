  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_f4401e99-145a-4b93-aa73-6854b8037895-2019-09-27T135300.165Z
    evidence:
    - reference: CGGV:assertion_f4401e99-145a-4b93-aa73-6854b8037895-2019-09-27T135300.165Z
      reference_title: "RASGRP2 / platelet-type bleeding disorder 18 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "RASGRP2 | HGNC:9879 | platelet-type bleeding disorder 18 | MONDO:0014386 | AR | Definitive"
      explanation: ClinGen Platelet Disorders Expert Panel classifies the autosomal recessive RASGRP2-BDPLT18 gene-disease relationship as Definitive.
  notes: >-
    Encodes CalDAG-GEFI. Biallelic loss of function causes the disorder;
    reported alleles include c.G742T, c.706C>T (p.Q236X), c.887G>A (p.C296Y),
    c.1142C>T (p.Ser381Phe), c.337C>T (p.Arg113X), c.914G>A (p.Gly305Asp), and
    c.1490delT (p.Phe497SerfsTer22).
    The gene is expressed in neutrophils as well as platelets and CalDAG-GEFI is
    described as critical for integrin signalling in both, yet the clinical
    phenotype is platelet-restricted - patient neutrophils show normal integrin
    expression, with the abnormality detectable only as impaired
    manganese-induced fibrinogen binding in vitro. This dissociation, not the
    gene's expression pattern, is what distinguishes the disorder from leukocyte
    adhesion deficiency III.
  evidence:
  - reference: PMID:24958846
    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional deficiencies were confined to platelets and megakaryocytes with no leukocyte alteration. This contrasts with the phenotype seen in type III leukocyte adhesion deficiency caused by the absence of kindlin-3."
    explanation: >-
      Supports the lineage restriction and the explicit contrast with LAD-III
      drawn in this gene block.
  - reference: PMID:28762304
    reference_title: Identification of two novel mutations in RASGRP2 affecting platelet CalDAG-GEFI expression and function in patients with bleeding diathesis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient neutrophils showed normal integrin expression, but impaired Mn2+-induced fibrinogen binding."
    explanation: >-
      Qualifies the absence of clinical leukocyte disease by demonstrating a
      detectable in vitro neutrophil integrin-binding abnormality without
      clinical immunodeficiency.
  variants:
  - name: c.742G>T (p.Gly248Trp)
    description: >-
      Founding homozygous missense variant positioned at the interface between
      the CDC25 catalytic domain and Rap1, identified in three siblings with
      severe bleeding; markedly reduces CalDAG-GEFI catalytic nucleotide
      exchange activity and abolishes Rap1 activation.
    evidence:
    - reference: PMID:24958846
      reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Using whole-exome sequencing, we identified the culprit mutation (cG742T) in the RAS guanyl-releasing protein-2 (RASGRP2) gene coding for calcium- and DAG-regulated guanine exchange factor-1 (CalDAG-GEFI)."
      explanation: Identifies the founding homozygous RASGRP2 c.742G>T variant in the index family.
    - reference: PMID:27235135
      reference_title: "Novel mutations in RASGRP2, which encodes CalDAG-GEFI, abrogate Rap1 activation, causing platelet dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The reduction in the catalytic activity was similar to that observed with purified CalDAG-GEFI bearing a Gly248Trp substitution, the only other known CalDAG-GEFI mutation in humans"
      explanation: Identifies the Gly248Trp amino-acid substitution encoded by the founding RASGRP2 mutation and demonstrates strongly reduced GEF catalytic activity in purified protein assays.
    - reference: PMID:27235135
      reference_title: "Novel mutations in RASGRP2, which encodes CalDAG-GEFI, abrogate Rap1 activation, causing platelet dysfunction."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Notably, whereas Gly248 is positioned in the interface between the CDC25 domain and Rap1,5 Ser381 localizes to an adjacent region"
      explanation: Places Gly248 at the interface between the CDC25 catalytic domain and Rap1 on structural modeling.
  - name: c.1142C>T (p.Ser381Phe)
    description: >-
      Homozygous missense substitution in the CDC25 catalytic domain in exon 10,
      dramatically reducing both platelet CalDAG-GEFI levels and in vitro
      nucleotide exchange activity.
    evidence:
    - reference: PMID:27235135
      reference_title: "Novel mutations in RASGRP2, which encodes CalDAG-GEFI, abrogate Rap1 activation, causing platelet dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "By using a panel of 71 genes, we identified a homozygous change (c.1142C>T) in exon 10 of RASGRP2 in a 9-year-old child of Chinese origin (family 1). This variant led to a p.Ser381Phe substitution in the CDC25 catalytic domain of CalDAG-GEFI."
      explanation: Identifies the homozygous catalytic-domain missense variant c.1142C>T (p.Ser381Phe).
  - name: p.Gly305Asp
    description: >-
      Homozygous missense substitution at the GEF-Rap1 interface reported in two
      brothers with severe lifelong epistaxis and markedly reduced platelet
      CalDAG-GEFI expression.
    evidence:
    - reference: PMID:28726538
      reference_title: "Marked bleeding diathesis in patients with platelet dysfunction due to a novel mutation in RASGRP2, encoding CalDAG-GEFI (p.Gly305Asp)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We here report platelet function studies for two brothers (P1 and P2) expressing a novel variant of RASGRP2, CalDAG-GEFI(p.Gly305Asp)."
      explanation: Reports the p.Gly305Asp variant in two affected brothers with severe bleeding.
  - name: c.1490delT (p.Phe497SerfsTer22)
    description: >-
      Homozygous frameshift truncating variant near the C-terminal domain in a
      large kindred with severe mucocutaneous and postoperative bleeding.
    evidence:
    - reference: PMID:30046681
      reference_title: "Phenotype analysis and clinical management in a large family with a novel truncating mutation in RASGRP2, the CalDAG-GEFI encoding gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "DNA analysis by whole exome sequencing within the BRIDGE-BPD consortium (Cambridge, UK), allowed us to highlight a homozygous c.1490delT predicted to give rise to a p.F497Sfs*22 truncating mutation near to the C-terminal domain of CalDAG-GEFI."
      explanation: Identifies the homozygous truncating variant c.1490delT (p.Phe497SerfsTer22).
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic RASGRP2 loss of function. Recessive in the strong sense - a single
    normal allele is sufficient to prevent bleeding, even though heterozygote
    platelets are demonstrably abnormal in flow adhesion and spreading assays.
  evidence:
  - reference: PMID:24958846
    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous did not suffer from bleeding and have normal platelet aggregation"
    explanation: >-
      Establishes the clinically recessive inheritance directly.
animal_models:
- name: Rasgrp2-/- knockout mouse
  species: Mouse
  genotype: Rasgrp2-/-
  background: C57BL/6J
  publication: PMID:38992342
  description: >-
    Constitutive Rasgrp2-/- mice lack platelet CalDAG-GEFI, fail to activate
    integrin alphaIIbbeta3 or contract whole-blood clots in thromboelastography
    with platelet mapping, and model competition between dysfunctional
    endogenous platelets and transfused wild-type platelets during hemostatic
    plug formation.
  modeled_mechanisms:
  - target: Failure of Primary Hemostatic Plug Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Rasgrp2-/- whole blood fails to contract clots and endogenous
      dysfunctional platelets are recruited to the forming plug without
      participating in clot contraction, requiring a ~2:1 mutant-to-wild-type
      transfusion ratio to restore hemostasis.
    limitations: >-
      Murine Rasgrp2 knockout models complete loss of CalDAG-GEFI in inbred
      mice rather than spontaneous human mucocutaneous bleeding episodes.
    evidence:
    - reference: PMID:38992342
      reference_title: "Utility of thromboelastography with platelet mapping for monitoring platelet transfusion in qualitative platelet disorders."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We recently demonstrated that hemostatic efficacy of transfused platelets is limited by dysfunctional endogenous platelets in a mouse model of IPD-18 (Rasgrp2-/- mice), as dysfunctional platelets were recruited to the forming hemostatic plug but did not participate in clot contraction."
      explanation: Demonstrates defective primary hemostatic plug contraction and competition by endogenous Rasgrp2-/- platelets during transfusion in vivo.
    - reference: PMID:38992342
      reference_title: "Utility of thromboelastography with platelet mapping for monitoring platelet transfusion in qualitative platelet disorders."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Rasgrp2-/- WB samples did not contract in TEG-PM, consistent with a critical role of this protein in αIIbβ3 activation."
      explanation: Confirms absent whole-blood platelet-mediated clot contraction due to failed alphaIIbbeta3 activation in Rasgrp2-/- mice.
experimental_models:
- name: Patient megakaryocyte culture with wild-type RASGRP2 rescue
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Cultured megakaryocytes from patients, transfected with wild-type RASGRP2.
    The rescue corrects the functional deficiency, which closes the causal loop
    between the variant and the platelet phenotype in the patient's own cells
    rather than in a heterologous line.
  modeled_mechanisms:
  - target: Failure of CalDAG-GEFI-Dependent Rap1 Activation
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Restoring wild-type CalDAG-GEFI in patient megakaryocytes corrects the
      functional defect, establishing sufficiency of the gene for the phenotype.
    limitations: >-
      Cultured megakaryocytes, not circulating platelets, so the rescue is
      measured in the precursor rather than in the anucleate cell that does the
      haemostatic work; and transfection gives supraphysiological, transient
      expression rather than the endogenous regulation the gene normally has.
    readouts:

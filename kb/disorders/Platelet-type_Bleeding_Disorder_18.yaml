differential_diagnoses:
- name: Glanzmann Thrombasthenia
  description: >-
    The disorder this one imitates. Both give absent or severely reduced
    aggregation with a normal platelet count and morphology; here the integrin
    is expressed normally and PMA-induced aggregation is preserved, whereas in
    Glanzmann thrombasthenia the receptor itself is deficient or non-functional
    and no agonist works. Flow cytometry for alphaIIbbeta3 plus a PMA arm on
    aggregometry separates them.
  evidence:
  - reference: PMID:28762304
    reference_title: Identification of two novel mutations in RASGRP2 affecting platelet CalDAG-GEFI expression and function in patients with bleeding diathesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "normal expression of major glycoprotein receptors; severely reduced platelet aggregation response to ADP and collagen (both patients); aggregation response to PAR1 and arachidonic acid markedly impaired in one patient; PMA-induced aggregation unaffected"
    explanation: >-
      Documents both discriminating features - preserved receptor expression and
      preserved PMA response.
- name: Leukocyte Adhesion Deficiency III (FERMT3/kindlin-3)
  description: >-
    The other inherited disorder of integrin inside-out activation, and the
    closest mechanistic relative. Kindlin-3 loss breaks integrin activation in
    leukocytes as well as platelets, so LAD-III adds recurrent infection to a
    thrombasthenia-like bleeding phenotype. This disorder is
    platelet-restricted.
  evidence:
  - reference: PMID:24958846
    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional deficiencies were confined to platelets and megakaryocytes with no leukocyte alteration. This contrasts with the phenotype seen in type III leukocyte adhesion deficiency caused by the absence of kindlin-3."
    explanation: >-
      States the contrast that is the discriminator between the two disorders.
  - reference: PMID:21781244
    reference_title: Advances in our understanding of the molecular basis of disorders of platelet function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Leukocyte adhesion deficiency-III combines Glanzmann thrombasthenia with infections and defects of kindlin-3, a mediator of integrin activation."
    explanation: >-
      Independent statement of the LAD-III phenotype used for this
      differential.
notes: >-
  Conformance: this entry conforms to `primary_hemostatic_plug_failure` through
  the SIGNALLING arm - `#Impaired Platelet Activation, Granule Secretion, and
  Integrin Inside-Out Signalling` - which the module reserves for lesions
  upstream of the integrin. It deliberately does NOT conform to
  `#Failure of Integrin alphaIIbbeta3-Mediated Platelet Aggregation` even though
  aggregation fails, because the module gates that arm on failure of the
  aggregation step itself and here the integrin is normal and PMA-induced
  aggregation is preserved. This entry is the module's worked example of exactly
  the distinction that arm's guidance is written to protect.

  Curation note on the `Residual PKC- and ADP-Dependent Platelet Activation`
  node. It is given `role: adaptive_escape` and an edge into the integrin node
  because it is a genuine parallel route that partially offsets the block, not a
  separate disease mechanism. It matters twice over: it explains why the
  aggregation defect is severe rather than absolute, and it is the basis of the
  therapeutic inversion the source draws - a pathway with an intact backup is a
  safer antithrombotic target than one without.

  The antithrombotic-target claim in the description is the source's own
  conclusion and is reported as such; nothing here should be read as evidence
  that a CalDAG-GEFI inhibitor exists or has been tested clinically.

  Evidence base: the index family and mechanism from PMID:24958846, two further
  alleles with detailed platelet phenotyping from PMID:28762304, and the LAD-III
  contrast independently from PMID:21781244. No prevalence record is included -
  the disorder is known from a small number of families and no denominator has
  been published.

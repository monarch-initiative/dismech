phenotypes:
- category: Hematologic
  name: Impaired Platelet Aggregation with Normal Receptor Expression
  description: >-
    Severely reduced aggregation to ADP and collagen with normal expression of
    the major platelet glycoprotein receptors - the combination that defines a
    functional rather than a structural thrombasthenia. Aggregation to PMA is
    unaffected.
  phenotype_term:
    preferred_term: Impaired platelet aggregation
    term:
      id: HP:0003540
      label: Impaired platelet aggregation
  frequency: OBLIGATE
  evidence:
  - reference: PMID:28762304
    reference_title: Identification of two novel mutations in RASGRP2 affecting platelet CalDAG-GEFI expression and function in patients with bleeding diathesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severely reduced platelet aggregation response to ADP and collagen (both patients); aggregation response to PAR1 and arachidonic acid markedly impaired in one patient; PMA-induced aggregation unaffected"
    explanation: >-
      Reports the aggregation profile including the PMA exception, in both
      reported patients - supporting the OBLIGATE band for the aggregation
      defect itself.
- category: Hematologic
  name: Normal Platelet Count and Morphology
  description: >-
    Curated as a positive finding because it is diagnostically load-bearing:
    unlike Bernard-Soulier syndrome or gray platelet syndrome, there is no
    thrombocytopenia and no morphological clue, so the disorder can only be
    reached through function testing and sequencing.
  phenotype_term:
    preferred_term: Normal platelet count and morphology
  notes: >-
    Deliberately carries NO `term:`. The previous binding
    (`HP:0011869 Abnormal platelet function`) was wrong twice over: it asserts an
    abnormality where a normal result is the curated finding, and it describes
    function where this finding is about count and morphology. The HPO has no
    class for a normal count-and-morphology result, so no term is bound rather
    than a misleading one; a new-term request would be the durable fix.
  evidence:
  - reference: PMID:28762304
    reference_title: Identification of two novel mutations in RASGRP2 affecting platelet CalDAG-GEFI expression and function in patients with bleeding diathesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The homozygous patients had normal platelet and neutrophil counts and morphology."
    explanation: >-
      Supports normal counts and morphology in both lineages, which is what
      makes this a pure function disorder.
- category: Hematologic
  name: Abnormal Bleeding
  description: >-
    Childhood-onset mucocutaneous, surgical, and post-dental extraction bleeding,
    frequently severe enough to require blood or platelet transfusion.
  phenotype_term:
    preferred_term: Abnormal bleeding
    term:
      id: HP:0001892
      label: Abnormal bleeding
  frequency: OBLIGATE
  evidence:
  - reference: PMID:24958846
    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three siblings affected by severe bleeding"
    explanation: >-
      Establishes bleeding as the presenting feature in the index family.
  - reference: PMID:28637664
    reference_title: "Expanded repertoire of RASGRP2 variants responsible for platelet dysfunction and severe bleeding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cases with biallelic RASGRP2 variants had abnormal mucocutaneous, surgical, and dental bleeding from childhood, requiring ≥1 blood or platelet transfusion in 78% of cases."
    explanation: >-
      Confirms childhood-onset mucocutaneous, surgical, and dental bleeding across
      a multi-family cohort of biallelic RASGRP2 cases.
  sequelae:

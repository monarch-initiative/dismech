        reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Rescue experiments on cultured patient megakaryocytes corrected the functional deficiency after transfection with wild-type RASGRP2."
        explanation: >-
          Reports the rescue measurement behind this readout.
    evidence:
    - reference: PMID:24958846
      reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
      supports: SUPPORT
      evidence_source: IN_VITRO

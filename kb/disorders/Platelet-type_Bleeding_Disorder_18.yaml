description: >-
  Platelet-type bleeding disorder 18 is an autosomal recessive severe bleeding
  disorder caused by biallelic loss of RASGRP2, which encodes CalDAG-GEFI - the
  calcium- and diacylglycerol-regulated guanine nucleotide exchange factor that
  activates the small GTPase Rap1 downstream of agonist receptors. Rap1 in turn
  drives integrin alphaIIbbeta3 from its resting to its ligand-binding
  conformation, so this is a signalling disorder that produces a functional
  thrombasthenia: the integrin is present in normal amounts and is structurally
  normal, and it simply never gets switched on.

  The disorder is a clean natural experiment in how the inside-out pathway is
  wired, and two features make it more informative than a straightforward
  knockout. First, the block is not total - PKC- and ADP-dependent pathways
  provide a parallel route to integrin activation, so patient platelets retain
  residual responsiveness and can still be activated directly by phorbol ester
  bypassing the receptor layer entirely. Second, the defect is
  lineage-restricted to platelets and megakaryocytes with no leukocyte
  abnormality, which is exactly what separates it from leukocyte adhesion
  deficiency III, where loss of kindlin-3 breaks integrin activation in white
  cells as well and adds infection to the bleeding. The therapeutic corollary is
  striking and runs in the opposite direction: a single normal allele is enough
  to prevent bleeding entirely, which makes CalDAG-GEFI an unusually attractive
  antithrombotic target.
pathophysiology:
- name: Biallelic Loss of Function in RASGRP2
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component"
  description: >-
    Biallelic RASGRP2 variants abolish CalDAG-GEFI. The index family carried
    c.G742T, identified by whole-exome sequencing in three siblings with severe
    bleeding; nonsense (p.Q236X) and missense (p.C296Y) alleles have since been
    reported homozygously with no detectable CalDAG-GEFI protein in platelet
    lysates. Both null and expressed-but-dysfunctional alleles occur, so protein
    absence is not a requirement for the diagnosis.
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION

    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelets from individuals carrying the mutation present a reduced ability to activate Rap1 and to perform proper αIIbβ3 integrin inside-out signaling."
    explanation: >-
      Direct patient evidence for the Rap1 activation defect and its coupling to

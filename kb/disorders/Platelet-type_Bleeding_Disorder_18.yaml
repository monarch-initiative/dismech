    description: >-
      Rap1 is the immediate upstream regulator of talin/kindlin-mediated
      integrin activation.
  - target: Impaired Rac1-Dependent Platelet Spreading and Adhesion Under Flow
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A second, cytoskeletal consequence, reported as following from reduced
      Rac1 GTP-binding rather than directly from Rap1.
- name: Impaired Integrin alphaIIbbeta3 Inside-Out Activation
  role: effector
  biological_scale: CELLULAR
  conforms_to: "primary_hemostatic_plug_failure#Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling"
  description: >-
    The integrin is expressed normally - major glycoprotein receptor levels are
    normal in patients - but fibrinogen binding is greatly impaired in response
    to every agonist tested except phorbol ester. That single exception is
    mechanistically the most informative result in the disorder: phorbol ester
    activates protein kinase C directly, downstream of the missing exchange
    factor, and it restores aggregation, which localizes the block precisely to
    the CalDAG-GEFI step and demonstrates that a parallel PKC route to the same
    integrin exists and is intact.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: integrin inside-out activation
    term:
      id: GO:0033622
      label: integrin activation
    modifier: DECREASED
  evidence:
  - reference: PMID:28762304
    reference_title: Identification of two novel mutations in RASGRP2 affecting platelet CalDAG-GEFI expression and function in patients with bleeding diathesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "platelet αIIbβ3 activation, as assessed by fibrinogen binding, was greatly impaired in response to all agonists except PMA"
    explanation: >-
      States both the integrin activation defect and the phorbol-ester exception
      that localizes the block, which is the core claim of this node.
  - reference: PMID:28762304
    reference_title: Identification of two novel mutations in RASGRP2 affecting platelet CalDAG-GEFI expression and function in patients with bleeding diathesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "normal expression of major glycoprotein receptors; severely reduced platelet aggregation response to ADP and collagen (both patients)"
    explanation: >-
      Supports the combination that defines a functional rather than structural
      thrombasthenia - normal receptor expression with lost aggregation.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      Without integrin activation the platelets cannot bridge into an aggregate.
- name: Residual PKC- and ADP-Dependent Platelet Activation
  role: adaptive_escape
  biological_scale: CELLULAR
  description: >-
    The compensating pathway, and a real one rather than a theoretical
    possibility. PKC- and ADP-dependent signalling allows residual platelet
    activation in the absence of functional CalDAG-GEFI, which is why the
    aggregation defect is severe but not absolute and why the disorder's
    severity varies. Its existence is also what makes CalDAG-GEFI a plausible
    antithrombotic target: a pathway with a backup can be blocked without
    abolishing haemostasis outright.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet activation
    term:
      id: GO:0030168

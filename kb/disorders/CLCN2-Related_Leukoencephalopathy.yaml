name: CLCN2-Related Leukoencephalopathy
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: leukoencephalopathy with mild cerebellar ataxia and white matter edema
  term:
    id: MONDO:0014292
    label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
description: >-
  CLCN2-related leukoencephalopathy (LKPAT; also abbreviated CC2L) is an
  autosomal recessive leukodystrophy caused by biallelic loss-of-function
  variants in CLCN2, the gene encoding the voltage-gated chloride channel
  ClC-2. It is not a demyelinating or a hypomyelinating disease. The primary
  lesion is a failure of glial chloride and water handling, and the white
  matter abnormality is intramyelinic oedema - fluid trapped between the
  lamellae of otherwise intact myelin sheaths - rather than myelin loss. That
  distinction is what makes the disorder unusually mild for a leukodystrophy
  with such striking imaging: the founding cohort's clinical features were
  cerebellar ataxia, spasticity, chorioretinopathy with visual field defects,
  optic neuropathy, cognitive defects and headaches, and the GeneReviews
  chapter records that affected individuals remain ambulatory and rarely
  become blind.

  The imaging phenotype is far more uniform than the clinical one. The disease
  was discovered by working backwards from a distinctive MRI pattern -
  symmetrical signal abnormality of the posterior limbs of the internal
  capsules, the midbrain cerebral peduncles and the middle cerebellar
  peduncles, with restricted diffusion indicating myelin vacuolation - and
  that pattern remains the practical route to diagnosis. The largest published
  series states explicitly that the imaging appearance is uniform while the
  phenotypic expression is highly heterogeneous, spanning subclinical adults
  ascertained only by imaging or infertility through to prominent seizures,
  severe spastic paraplegia and developmental delay.

  ClC-2 is expressed in the plasma membrane of almost all mammalian cells, and
  the two non-neurological manifestations of the disorder follow directly from
  that: chorioretinal degeneration from loss of the channel in retinal pigment
  epithelium, and male infertility from loss in Sertoli cells.
  Cell-type-specific mouse deletions assign each organ phenotype to its own
  cell type, and show that the leukodystrophy requires the channel to be lost from both
  astrocytes and oligodendrocytes.

  CLCN2 is a two-disease gene, and the two diseases are mechanistic mirror
  images. Biallelic loss of function produces this recessive CNS/retinal/
  testicular disorder; heterozygous gain-of-function variants that hold ClC-2
  open at the glomerulosa resting potential produce dominant familial
  hyperaldosteronism type II, an adrenal disease with no reported white matter
  involvement. That contrast - direction of effect, dose, and target tissue -
  is curated explicitly below and is the single most important thing to get
  right when reading a CLCN2 variant report. It is also why the existing
  dismech entry kb/disorders/Familial_Hyperaldosteronism.yaml is a companion to
  this one rather than a duplicate of it.
parents:
- Leukodystrophy
synonyms:
- LKPAT
- CC2L
- CLCN2-related leukoencephalopathy
- leukoencephalopathy with ataxia
- ClC-2 chloride channel deficiency
- leukoencephalopathy with mild cerebellar ataxia and white matter edema
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      The disorder is defined by a central white matter lesion and its clinical
      burden is overwhelmingly neurological - ataxia, spasticity, cognitive
      impairment, headache, seizures. The two extra-neurological features are
      chorioretinal degeneration and male infertility; neither redirects the
      chapter assignment, because the retinal lesion is a degeneration of the
      pigment epithelium driven by the same channel defect rather than an
      ophthalmological disease in its own right, and the infertility is a
      single-organ consequence of Sertoli-cell channel loss. No cardiac, renal,
      hepatic, skeletal or haematological involvement has been reported. The
      allelic adrenal disorder (familial hyperaldosteronism type II) would be
      ENDOCRINOLOGIC, but it is a different MONDO entity and is curated
      elsewhere.
    evidence:
    - reference: PMID:26539602
      reference_title: "CLCN2-Related Leukoencephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CLCN2-related leukoencephalopathy is characterized by nonspecific neurologic findings, mild visual impairment from chorioretinopathy or optic atrophy, male infertility, and characteristic findings on brain MRI."
      explanation: The GeneReviews summary enumerates the whole clinical burden; it is neurologic plus a visual and a reproductive manifestation, which is the basis for the single NEUROLOGIC chapter assignment.
notes: >-
  Entity verification, run before any content was written. `runoak -i
  sqlite:obo:mondo info MONDO:0014292 -O obo` returns label "leukoencephalopathy
  with mild cerebellar ataxia and white matter edema", `relationship: RO:0004003
  HGNC:2020 ! CLCN2`, `is_a: MONDO:0019046 ! leukodystrophy`, xrefs including
  OMIM:615651, Orphanet:363540, MEDGEN:1638681, and the synonyms "LKPAT" and
  "leukoencephalopathy with ataxia". `runoak relationships -p RO:0004003
  MONDO:0014292` independently confirms the single gene HGNC:2020. The gene
  record `runoak -i sqlite:obo:hgnc info hgnc:2020 -O obo` gives symbol CLCN2,
  name "chloride voltage-gated channel 2", omim:600570, UniProt P51788, and
  alias symbols CLC2, ClC-2 and EJM6. The ClC-2 alias matters for reading the
  literature: most of the mechanistic papers cited here name the protein ClC-2
  or CLC-2 and never write the string CLCN2.

  NEC preflight. Every source used here was checked for the dominant gene
  before being accepted. A PubMed search for `CLCN2 leukoencephalopathy` on
  2026-08-01 returned 38 records; all clinical and mechanistic records used in
  this entry name CLCN2/ClC-2 as the subject gene. Three records returned by
  that search were read and deliberately excluded as off-target rather than
  cherry-picked: PMID:40140900 is about skin colour pattern in the corn snake,
  PMID:39232641 is a GJB1/Cx32 leukoencephalopathy case report in which CLCN2
  appears only as a differential, and PMID:29079544 is a biochemical
  retrospective on megalencephalic leukoencephalopathy with subcortical cysts
  in which MLC1 rather than CLCN2 is the dominant gene. The two genes that
  recur most often alongside CLCN2 in the accepted sources - HEPACAM/GlialCAM
  and MLC1 - are its own auxiliary-subunit partners, not a competing disease
  entity, and they are curated here as mechanism partners and as a
  differential, never as the causal gene.

  Allelic scope, and why this entry does not overlap
  kb/disorders/Familial_Hyperaldosteronism.yaml. `runoak -i sqlite:obo:mondo
  relationships -p RO:0004003 --direction down HGNC:2020` returns exactly three
  MONDO terms: MONDO:0014292 (this entry, OMIM:615651), MONDO:0011576 (familial
  hyperaldosteronism type II, OMIM:605635) and MONDO:0011875 (epilepsy,
  idiopathic generalized, susceptibility to, 11; OMIM:607628). Only the first
  is curated here. FH-II is curated as an allelic differential diagnosis, with
  the direction-of-effect contrast spelled out; the existing
  Familial_Hyperaldosteronism entry already models FH-II's CLCN2 arm as a
  gain-of-function adrenal mechanism and was read before this entry was
  written. No content was copied from it and it was not modified.

  The third term, MONDO:0011875, is a problem and is recorded as such rather
  than propagated. That susceptibility entity derives from Haug et al. 2003
  (PMID:12612585), which Nature Genetics RETRACTED in 2009 (PMID:19710717).
  Blanz et al. (PMID:17567819) separately reported that several ClC-2 sequence
  abnormalities previously found in patients with epilepsy most likely
  represent innocuous polymorphisms, and that neither heterozygous nor
  homozygous ClC-2 knock-out mice had lowered seizure thresholds. MONDO and
  OMIM nonetheless still carry the CLCN2-EIG11 association. This entry does
  NOT treat heterozygous CLCN2 variants as an epilepsy susceptibility factor.
  It does separately record that seizures occur in a minority of genuinely
  biallelic LKPAT patients - a different claim, resting on a different
  genotype, and one that the modern cohorts do support. The open question is
  filed as a discussion below. This is offered as an upstream ontology
  observation, not as an action taken: no ontology file was edited.

  Evidence base and its limits. There is no single defining cohort. The disease
  rests on the 2013 founding study of six molecularly solved patients
  (PMID:23707145), the 2024 twelve-patient multicentre series (PMID:38173802,
  the largest to date), a 2025 four-patient Japanese series (PMID:40199115),
  the GeneReviews chapter (PMID:26539602, last updated 2021-05-20) and a
  scattering of single-case reports. Three of the sources used here are short
  reports indexed by PubMed WITHOUT an abstract (PMID:25128180, PMID:28473625,
  PMID:25745790). For those three the article title is the only verbatim text
  in the cache, so it is the text quoted, and each such evidence item says so
  in its `explanation`. No claim in this entry rests solely on one of them.
  Full texts were not retrievable for most of the literature sources (publisher
  403 on Lancet, JNeurosci, JBC and OUP), so every snippet here is from an
  abstract, a GeneReviews summary, or the open-access full text of
  PMID:29403011, PMID:31615979, PMID:24647135 and PMID:38345841.

  Structured-source evidence was unavailable. `data/orphadata/` and
  `data/clingen/` in this checkout contain only `MANIFEST.yaml` with no
  downloaded payload, and `just fetch-reference ORPHA:363540` fails with "No
  source found for reference type". No Orphanet prevalence class and no ClinGen
  gene-disease-validity classification could therefore be quoted. Per the scope
  rules the manifests were not touched. This is recorded as a gap, not as an
  assertion that no such classification exists.

  Frequency bands are deliberately omitted from every phenotype. The published
  denominators are small (6, then 12, then 4 patients per series) and the
  series are ascertained in different ways - the founding study and the
  Japanese series both selected patients on the MRI pattern before genotyping,
  which inflates the apparent penetrance of the imaging finding and deflates
  everything else. Where a count is known it is stated in that phenotype's
  `notes` instead of being converted into a FrequencyEnum band.

  Onset is left unbound rather than assigned an enum. The founding cohort split
  three adult-onset against four childhood-onset; the 2024 series reports "a
  broad range of age of onset"; the Japanese patients all became symptomatic
  after age 30. No single HPO onset interval represents the disorder.

  Terms used here were each verified with OAK on 2026-08-01, and three
  candidate bindings were discarded in the process: GO:0030104 (water
  homeostasis) and GO:0005615 (extracellular space) are both obsolete and were
  replaced by GO:0050891 and by prose respectively; HP:0001145
  (Chorioretinopathy) is obsolete, so the chorioretinal phenotype is bound to
  HP:0000532 with the clinical term kept in `preferred_term`. HP:0001251 is
  labelled "Ataxia" in HPO with "Cerebellar ataxia" as an EXACT synonym, so the
  cardinal phenotype uses that identifier with the clinical name as
  `preferred_term` rather than a fabricated "cerebellar ataxia" identifier.
  GlialCAM's HGNC-approved symbol is HEPACAM (hgnc:26361), not "GLIALCAM"; the
  approved symbol is used wherever a gene identifier is bound and the protein
  name GlialCAM is used in prose, matching the literature.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Two damaging CLCN2 alleles are required. Every molecularly solved patient
    reported has been homozygous or compound heterozygous, and heterozygous
    parents and relatives are not described as affected. The mouse data agree
    and are unusually explicit on this point: heterozygous loss of ClC-2 had no
    detectable functional or morphological consequence in the knockout line.

    Penetrance is recorded as UNKNOWN rather than complete, and the reason is
    specific rather than a generic hedge. Two published biallelic individuals
    were essentially asymptomatic at ascertainment - one man found through
    infertility with only subclinical leukodystrophy, and one homozygote for
    p.His590Pro reported as a subclinical form of LKPAT - while other biallelic
    individuals have severe spastic paraplegia and developmental delay. Because
    both series that define the disorder recruited on the MRI pattern, the
    denominator of biallelic carriers who never come to medical attention is
    unmeasured. A carrier frequency for the recurrent Japanese allele c.61dupC
    is known (allele frequency 0.002152) but the corresponding number of
    affected homozygotes has not been ascertained, so no penetrance estimate
    can be derived from it and none is asserted here.
  penetrance: UNKNOWN
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CLCN2-related leukoencephalopathy is inherited in an autosomal recessive manner."
    explanation: Direct statement of the mode of inheritance in the GeneReviews chapter.
  - reference: PMID:23707145
    reference_title: "Brain white matter oedema due to ClC-2 chloride channel deficiency: an observational analytical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified homozygous or compound-heterozygous mutations in CLCN2 in three adult and three paediatric patients."
    explanation: The founding study reports only biallelic genotypes, establishing the recessive architecture at the point of gene discovery.
  - reference: PMID:17567819
    reference_title: "Leukoencephalopathy upon disruption of the chloride channel ClC-2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The heterozygous loss of ClC-2 had no detectable functional or morphological consequences."
    explanation: Independent animal evidence that a single damaged allele is insufficient, which is the mechanistic basis of the recessive pattern.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Thirty-one individuals from thirty families as of the last GeneReviews
    revision (2021-05-20). The count is a literature census, not a population
    estimate, and it predates the twelve-patient 2024 series and the
    four-patient 2025 Japanese series, so the current published total is
    higher. No population-based prevalence study exists and Orphanet's
    epidemiology record could not be consulted in this checkout. The disorder
    is presumed substantially underdiagnosed: the 2026 literature review
    attributes the small case count to high variability in clinical
    presentation leading to underdiagnosis, and the only two series that
    systematically screened for the disease found it by searching for the MRI
    pattern first.
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date CLCN2-related leukoencephalopathy has been reported or identified in 31 individuals from 30 families."
    explanation: The literature census underlying the ULTRA_RARE band, quoted verbatim with its own denominator.
  - reference: PMID:36565320
    reference_title: "Brain imaging findings in CLCN2-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With only 31 cases published in the literature, its precise pathophysiology is uncertain, clinical manifestations are nonspecific and little is known in terms of prognosis."
    explanation: An independent 2023 source giving the same census figure and stating explicitly that the small denominator limits what is known.
  - reference: PMID:41822756
    reference_title: "Identification of a novel CLCN2 homozygous variant in a man with leukoencephalopathy and infertility: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "due to high variability in clinical presentation leading to underdiagnosis, very few cases have been reported since its first description in 2013"
    explanation: Supports treating the case census as an ascertainment floor rather than as a prevalence estimate.
- population: Japanese population
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    A single recurrent allele, c.61dupC (p.Leu21Profs*27), was carried by all
    four patients in the 2025 Japanese series and by all four previously
    reported Japanese cases, and has not been reported outside Japan. Its
    reported allele frequency in the Japanese population is 0.002152. The
    authors raise the possibility of a relatively high prevalence of the
    disease in Japan; they do not compute one, and neither does this record. A
    homozygote frequency derived from that allele frequency under
    Hardy-Weinberg would ignore compound heterozygotes, unknown penetrance and
    the ascertainment route (patients were selected on middle cerebellar
    peduncle signs), so no `rate_per_100000` is asserted. This record exists to
    hold the founder-allele observation, not to state a rate.
  evidence:
  - reference: PMID:40199115
    reference_title: "Clinical, neuroimaging and genetic findings in the Japanese case series of CLCN2-related leukoencephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The allele frequency of c.61dupC in the Japanese population is 0.002152, raising the possibility of a relatively high prevalence of CC2L in Japan."
    explanation: >-
      Quotes the allele frequency and the authors' own hedged inference. Marked
      PARTIAL because the source supports a founder-allele observation and an
      explicitly speculative prevalence possibility, not a prevalence estimate.
pathophysiology:
- name: Biallelic Loss-of-Function CLCN2 Variants
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is biallelic damage to CLCN2 at 3q27, encoding the
    ClC-2 chloride channel. The reported allelic spectrum is broad and includes
    nonsense (p.Trp570*, p.Arg610*, p.Arg753*), frameshift (c.61dupC,
    p.Leu21Profs*27), canonical splice (c.983+2T>A) and missense
    (p.Ala500Val, p.Ala506Val, p.His590Pro) changes. No consistent
    genotype-phenotype correlation has been established across that spectrum -
    the same class of allele has been reported in a subclinical adult and in a
    child with severe spastic paraplegia - which is why this entry does not
    model severity as an allelic property the way an entry with a defined
    hypomorph would.
  genes:
  - preferred_term: CLCN2
    term:
      id: hgnc:2020
      label: CLCN2
  evidence:
  - reference: PMID:23707145
    reference_title: "Brain white matter oedema due to ClC-2 chloride channel deficiency: an observational analytical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified homozygous or compound-heterozygous mutations in CLCN2 in three adult and three paediatric patients."
    explanation: Establishes CLCN2 as the causal gene and the biallelic genotype at the point of discovery.
  - reference: PMID:40199115
    reference_title: "Clinical, neuroimaging and genetic findings in the Japanese case series of CLCN2-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic loss-of-function variants in CLCN2 lead to CLCN2-related leukoencephalopathy (CC2L), also called leukoencephalopathy with ataxia (LKPAT)."
    explanation: States the variant class and both disease abbreviations in one sentence, confirming that CC2L and LKPAT denote this entity.
  downstream:
  - target: Reduced ClC-2 Channel Function and Surface Expression
    causal_link_type: DIRECT
    description: >-
      Truncating and splice alleles remove the protein; the characterised
      missense alleles reduce its function without necessarily removing it.
      Both converge on the same reduction in functional channel at the plasma
      membrane.
- name: Reduced ClC-2 Channel Function and Surface Expression
  biological_scale: MOLECULAR
  description: >-
    ClC-2 is a broadly expressed plasma membrane chloride channel modulated by
    voltage, cell swelling and pH, and it is the one mammalian CLC homolog that
    is activated by hyperpolarization rather than by depolarization. Cryo-EM of
    the human channel places the gate in an N-terminal 15-residue hairpin
    peptide that occludes the chloride permeation pathway from the cytoplasmic
    side - a ball-and-chain mechanism - and that hairpin is conserved among
    species variants of CLC-2 but absent from the other CLC homologs. Against
    that background, the leukodystrophy-causing alleles act by two separable
    routes rather than one. Functional characterisation of most of the reported
    disease alleles showed that they reduce channel function AND impair plasma
    membrane expression, and dissection of p.Ala500Val attributed the loss to
    both defective gating and increased cellular and plasma-membrane turnover.
    The practical consequence is that a variant can be pathogenic here without
    abolishing the protein: a partly mistrafficked, partly mis-gated channel is
    sufficient.
  genes:
  - preferred_term: CLCN2
    term:
      id: hgnc:2020
      label: CLCN2
  molecular_functions:
  - preferred_term: voltage-gated chloride channel activity
    modifier: DECREASED
    term:
      id: GO:0005247
      label: voltage-gated chloride channel activity
  protein_complexes:
  - preferred_term: chloride channel complex
    modifier: DECREASED
    term:
      id: GO:0034707
      label: chloride channel complex
  cellular_components:
  - preferred_term: plasma membrane
    term:
      id: GO:0005886
      label: plasma membrane
  chemical_entities:
  - preferred_term: chloride
    term:
      id: CHEBI:17996
      label: chloride
  evidence:
  - reference: PMID:23707145
    reference_title: "Brain white matter oedema due to ClC-2 chloride channel deficiency: an observational analytical study."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found evidence that the CLCN2 mutations result in loss of function of ClC-2."
    explanation: Establishes the direction of effect for the disease alleles, which is what separates this disorder from the allelic gain-of-function adrenal phenotype.
  - reference: PMID:28905383
    reference_title: "Leukoencephalopathy-causing CLCN2 mutations are associated with impaired Cl(-) channel function and trafficking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we characterised most of these mutations that reduce the function of the chloride channel ClC-2 and impair its plasma membrane (PM) expression."
    explanation: Systematic functional evidence that the disease alleles impair both activity and surface delivery, which is why the node bundles function with surface expression.
  - reference: PMID:28905383
    reference_title: "Leukoencephalopathy-causing CLCN2 mutations are associated with impaired Cl(-) channel function and trafficking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Detailed biochemical and electrophysiological analyses of the Ala500Val mutation revealed that defective gating and increased cellular and PM turnover contributed to defective A500V-ClC-2 functional expression."
    explanation: Resolves the loss into two distinct molecular defects - gating and turnover - for the one allele that was dissected in detail.
  - reference: PMID:38345841
    reference_title: "CryoEM structures of the human CLC-2 voltage-gated chloride channel reveal a ball-and-chain gating mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Among the nine mammalian CLC homologs, CLC-2 is uniquely activated by hyperpolarization, rather than depolarization, of the plasma membrane."
    explanation: Establishes the biophysical property that makes ClC-2 a chloride conductance available at resting and hyperpolarized potentials, which is the basis for its homeostatic rather than excitatory role in glia.
  - reference: PMID:38345841
    reference_title: "CryoEM structures of the human CLC-2 voltage-gated chloride channel reveal a ball-and-chain gating mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we support a model in which the N-terminal hairpin of CLC-2 stabilizes a closed state of the channel by blocking the cytoplasmic Cl--permeation pathway"
    explanation: Identifies the structural gate whose regulation is what gain- and loss-of-function alleles push in opposite directions.
  - reference: PMID:17567819
    reference_title: "Leukoencephalopathy upon disruption of the chloride channel ClC-2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ClC-2 is a broadly expressed plasma membrane chloride channel that is modulated by voltage, cell swelling, and pH."
    explanation: Establishes the channel's expression breadth and its modulation by cell swelling, the property that ties it to volume and water handling.
  downstream:
  - target: Impaired GlialCAM-MLC1-ClC-2 Glial Complex Function
    causal_link_type: DIRECT
    description: >-
      Reduced surface stability of the channel is what the glial auxiliary
      subunits normally counteract, so the complex arm branches from here
      rather than from the variant node.
  - target: Loss of ClC-2 from the Panglial Syncytium
    causal_link_type: DIRECT
- name: Impaired GlialCAM-MLC1-ClC-2 Glial Complex Function
  biological_scale: MOLECULAR
  description: >-
    ClC-2 does not act alone in glia. GlialCAM (HGNC-approved symbol HEPACAM)
    is its auxiliary subunit: it binds ClC-2, targets it to cell junctions,
    increases the currents it carries and changes its functional properties,
    and it does the same for MLC1, so the three proteins behave as one glial
    complex. This node matters for two reasons that pull in opposite
    directions. First, GlialCAM and MLC1 partially rescue disease-causing
    ClC-2 mutants - GlialCAM restores mutant function by modifying gating and
    restores surface levels by impeding turnover, and that rescue requires
    ClC-2 to be localised at cell-cell junctions - so the residual severity of
    a CLCN2 allele in vivo is set jointly by the allele and by how much the
    partners can compensate. Second, the same complex is the point of
    convergence with megalencephalic leukoencephalopathy with subcortical
    cysts: MLC1 and HEPACAM are the MLC genes, GlialCAM is important for
    modifying ClC-2's biophysical properties specifically in oligodendrocytes,
    the cells chiefly affected by vacuolization, and mouse Glialcam and Mlc1
    nulls vacuolate myelin much as Clcn2 nulls do.

    The compensation is nonetheless not the whole story of the MLC side of the
    axis. Crossing Glialcam-null mice to a knock-in carrying a constitutively
    open ClC-2 did not rescue their leukodystrophy, from which the authors
    conclude that GlialCAM-induced changes in the biophysical properties of
    ClC-2 are irrelevant for GLIALCAM-related leukodystrophy. That is a
    negative result about MLC pathogenesis, not about this disorder, and it is
    recorded here so the complex is not overread as a single shared mechanism.
  genes:
  - preferred_term: HEPACAM
    term:
      id: hgnc:26361
      label: HEPACAM
  - preferred_term: MLC1
    term:
      id: hgnc:17082
      label: MLC1
  cellular_components:
  - preferred_term: cell-cell junction
    term:
      id: GO:0005911
      label: cell-cell junction
  - preferred_term: astrocyte end-foot
    term:
      id: GO:0097450
      label: astrocyte end-foot
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  - preferred_term: Bergmann glial cell
    term:
      id: CL:0000644
      label: Bergmann glial cell
  notes: >-
    Nomenclature check, because two names are in play for one gene. The protein
    the literature calls GlialCAM is encoded by the gene whose HGNC-approved
    symbol is HEPACAM (hgnc:26361, verified with OAK on 2026-08-01); there is no
    approved HGNC symbol "GLIALCAM". MONDO's MLC entities are indexed under both
    names. The gene descriptors above therefore use HEPACAM while the prose uses
    GlialCAM, matching the cited papers.
  evidence:
  - reference: PMID:22405205
    reference_title: "GlialCAM, a protein defective in a leukodystrophy, serves as a ClC-2 Cl(-) channel auxiliary subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "GlialCAM targets ClC-2 to cell junctions, increases ClC-2 mediated currents, and changes its functional properties."
    explanation: Defines the auxiliary-subunit relationship on which the rest of the node depends.

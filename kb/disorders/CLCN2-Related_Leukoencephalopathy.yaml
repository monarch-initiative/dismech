- name: Loss of ClC-2 from the Panglial Syncytium
  biological_scale: CELLULAR
  description: >-
    The cellular substrate of the disease is the panglial syncytium - the
    coupled network of astrocytes, oligodendrocytes and ependymal cells that
    handles ion and water movement between the vasculature, the interstitium
    and the myelin. ClC-2 was detected in all components of that syncytium in
    normal human brain, enriched in astrocytic endfeet at the perivascular
    basal lamina, in the glia limitans and in ependymal cells. Removing it does
    not damage neurons: in the knockout mouse, neuronal morphology seemed
    normal while the white matter vacuolated. Conditional deletion resolves the
    requirement further, and the answer is that neither glial cell type alone
    is sufficient - leukodystrophy was fully developed only when ClC-2 was
    disrupted in both astrocytes and oligodendrocytes. That two-cell
    requirement is the strongest available argument that the lesion is a
    failure of the coupled syncytium rather than of a single cell type.

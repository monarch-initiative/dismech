      label: oligodendrocyte
  notes: >-
    The potassium and water bindings are the weakest links in this node and are
    marked DYSREGULATED rather than given a direction for that reason. The
    cited sources assert disturbed ion and water homeostasis at the level of the
    tissue; no source quoted here measures extracellular potassium or water
    content in a CLCN2 patient or in a Clcn2-null mouse. The mechanistic

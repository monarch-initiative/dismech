- name: Retinal Pigment Epithelial ClC-2 Loss and Chorioretinal Degeneration
  biological_scale: CELLULAR
  description: >-
    The visual arm of the disease is a chorioretinal degeneration rather than a
    primary optic neuropathy, although optic atrophy is also reported.
    Cell-type-specific deletion in mice localises it unambiguously: retinal
    degeneration depends on loss of ClC-2 in retinal pigment epithelial cells.
    A second mouse line carrying an early stop codon in Clcn2 loses
    photoreceptors severely by 14 days of age, and that loss is preceded by
    elongation of the RPE apical microvilli - a structural change in the
    supporting epithelium before the sensory cells die, which is the order the
    RPE-primary model predicts. Human ophthalmological findings match the
    localisation: macular atrophy with pigment epithelium atrophy and choroidal
    capillary atrophy in one detailed case. Clinically the result is mild -
    visual field defects and mild visual impairment, with blindness rare.

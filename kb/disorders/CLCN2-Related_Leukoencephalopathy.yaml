genetic:
- name: CLCN2
  association: >-
    Biallelic loss-of-function variants are causal for CLCN2-related
    leukoencephalopathy. Heterozygous GAIN-of-function variants in the same gene
    cause a different, dominant disease (familial hyperaldosteronism type II);
    direction of effect, not merely the gene, determines the phenotype.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: CLCN2
    term:
      id: hgnc:2020
      label: CLCN2
  notes: >-
    Gene record, verified with OAK on 2026-08-01. hgnc:2020, symbol CLCN2, name
    "chloride voltage-gated channel 2", MIM 600570, UniProt P51788, aliases
    CLC2, ClC-2 and EJM6. The EJM6 alias is a fossil of the retracted
    juvenile-myoclonic-epilepsy association discussed in the entry `notes`.

    Allelic spectrum reported for this disorder. Truncating: c.1709G>A
    p.Trp570*, c.1828C>T p.Arg610*, c.61dupC p.Leu21Profs*27 (the allele
    carried by every reported Japanese patient) and c.2257C>T p.Arg753*.
    Splice: c.983+2T>A (novel in the 2025 Japanese series). Missense:
    p.Ala500Val (the allele dissected functionally), p.Ala506Val (reported in
    2026 in a Chinese man) and p.His590Pro (subclinical). Patient ancestry is
    not stated in the cached text for the other alleles and is therefore not
    asserted. All are biallelic in the affected individuals. The list is
    not exhaustive - the 2024 series added three novel likely pathogenic
    missense variants that the abstract does not name.

    No genotype-phenotype correlation is asserted. The 2026 review states
    plainly that the prevalence and genotype-phenotype correlations of LKPAT
    remain unclear, and the published cases bear that out: a homozygous
    nonsense allele (p.Arg753*) was found in a woman with a mild adult-onset
    syndrome, while the severe spastic paraplegia and developmental delay of
    the 2024 series were not attributed to a distinct allele class. Anyone
    reading a CLCN2 report should not infer severity from allele type.

    Founder allele. c.61dupC (p.Leu21Profs*27) was present in all four patients
    of the 2025 Japanese series and in all four previously reported Japanese
    cases, and has not been reported outside Japan. Its Japanese allele
    frequency is 0.002152. That is an allele frequency, not a carrier
    frequency and not a disease prevalence; no derived rate is recorded
    anywhere in this entry.

    Direction-of-effect contrast, the point most likely to be got wrong. The
    same gene carries a dominant gain-of-function disease. In familial
    hyperaldosteronism type II, heterozygous CLCN2 variants (recurrently
    p.Arg172Gln) increase the channel's open probability at the adrenal
    glomerulosa resting potential; the resulting chloride efflux depolarizes
    the cell, opens voltage-gated calcium channels and induces aldosterone
    synthase. That is the opposite manipulation of the same gate that the
    ball-and-chain N-terminal hairpin controls. Three consequences follow for
    variant interpretation. A heterozygous CLCN2 missense variant in a
    hypertensive patient and a biallelic CLCN2 genotype in a patient with
    middle-cerebellar-peduncle signal change are not the same finding and are
    not on the same allelic series. Loss-of-function alleles are not expected
    to cause hyperaldosteronism, and none has been reported to. And carriers of
    a single loss-of-function allele are unaffected, which is why the recessive
    disease and the dominant one differ in dose as well as in direction.
  evidence:
  - reference: PMID:40199115
    reference_title: "Clinical, neuroimaging and genetic findings in the Japanese case series of CLCN2-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the patients carried at least one allele of c.61dupC (p.Leu21Profs*27) in CLCN2, including compound heterozygosity with either the novel pathogenic variant c.983 + 2 T > A or the previously reported pathogenic variant c.1828C > T (p.Arg610*)."
    explanation: Names the recurrent Japanese allele and two of the trans alleles, and documents the compound-heterozygous architecture.
  - reference: PMID:41822756
    reference_title: "Identification of a novel CLCN2 homozygous variant in a man with leukoencephalopathy and infertility: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence and genotype-phenotype correlations of LKPAT remain unclear, as do the pathogenic mechanisms of CLCN2 variants."
    explanation: Direct support for the deliberate refusal to assert a genotype-phenotype correlation in this entry.
  - reference: PMID:29403011
    reference_title: "CLCN2 chloride channel mutations in familial hyperaldosteronism type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutant channels show gain of function, with higher open probabilities at the glomerulosa resting potential."
    explanation: Establishes the opposite direction of effect for the allelic adrenal disease, which is the contrast this entry exists partly to make explicit.
  - reference: PMID:33187987
    reference_title: "Cellular basis of ClC-2 Cl(-) channel-related brain and testis pathologies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutations that cause the loss of ClC-2 function lead to retinal and testicular degeneration and leukodystrophy, whereas gain-of-function mutations cause hyperaldosteronism."
    explanation: A single sentence stating the whole allelic architecture of the gene, from the group that made both mouse models.
phenotypes:
- name: Cerebellar ataxia
  category: Neurologic
  diagnostic: true
  description: >-
    The cardinal neurological feature and the reason the disorder's MONDO label
    and its LKPAT abbreviation both name ataxia. It begins as action tremor and
    gait instability after initially normal motor development and is
    characteristically mild; the affected structure is the middle cerebellar
    peduncle. It is present across all series, from the founding cohort through
    the largest series to the Japanese patients.
  phenotype_term:
    preferred_term: Cerebellar ataxia
    term:
      id: HP:0001251
      label: Ataxia
    severity: MILD
  notes: >-
    HP:0001251 is labelled "Ataxia" in HPO with "Cerebellar ataxia" as an EXACT
    synonym (verified with OAK, 2026-08-01); there is no separate non-obsolete
    "Cerebellar ataxia" identifier, so the clinical term is carried in
    `preferred_term`. `severity: MILD` reflects the consistent wording of the
    GeneReviews chapter and of the Japanese series, not a graded scale score;
    the 2024 series shows that severe presentations exist.
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurologic findings include mild ataxia (action tremor and gait instability following initially normal motor development; occasionally, mild spasticity)"
    explanation: Characterises the ataxia, its severity and its evolution from initially normal motor development.
  - reference: PMID:40199115
    reference_title: "Clinical, neuroimaging and genetic findings in the Japanese case series of CLCN2-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "demonstrated neurological signs including cerebellar ataxia, pyramidal signs, and mild cognitive impairment, consistent with previous reports"
    explanation: Independent confirmation in a fourth-continent cohort, with the authors noting concordance with earlier series.
- name: Gait ataxia
  category: Neurologic
  description: >-
    Gait instability is typically the presenting complaint and the first
    functional consequence of the cerebellar involvement. Its significance is
    as much in what it does not do: affected individuals remain ambulatory and
    do not require support for walking, which is the single most useful
    prognostic statement available for this disease.
  phenotype_term:
    preferred_term: Gait ataxia
    term:
      id: HP:0002066
      label: Gait ataxia
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals remain ambulatory, do not require support for walking, and rarely become blind."
    explanation: Establishes the functional ceiling of the gait disorder, which is the clinically actionable part of this phenotype.
- name: Action tremor
  category: Neurologic
  description: >-
    Action tremor is named by GeneReviews as one of the two components of the
    early ataxia, and a tremulous presentation has been reported prominently
    enough to be the subject of its own imaging case report. It is not a rest
    tremor and the disorder is not parkinsonian.
  phenotype_term:
    preferred_term: Action tremor
    term:
      id: HP:0002345
      label: Action tremor
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mild ataxia (action tremor and gait instability following initially normal motor development"
    explanation: Names action tremor as a component of the presenting cerebellar syndrome.
  - reference: PMID:31291907
    reference_title: "CLCN2-related leukoencephalopathy: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 38-year-old woman presented with mild hand tremor, scanning speech, nystagmus, cerebellar ataxia in the upper limbs, memory decline, tinnitus, and dizziness."
    explanation: A worked single-case presentation containing the tremor alongside the rest of the cerebellar and audiovestibular cluster.
- name: Spasticity
  category: Neurologic
  description: >-
    Pyramidal involvement follows from oedema in the posterior limbs of the
    internal capsules, which carry the corticospinal tract. It spans a wide
    severity range: GeneReviews describes it as occasional and mild, the
    founding cohort listed it among the clinical features, and the largest
    series added severe spastic paraplegia to the recognised spectrum.
  phenotype_term:
    preferred_term: Spasticity
    term:
      id: HP:0001257
      label: Spasticity
  notes: >-
    The severity range here is the widest of any feature in the disorder and no
    `severity` qualifier is asserted for that reason. GeneReviews (2021) says
    "occasionally, mild spasticity"; PMID:38173802 (2024) adds "severe spastic
    paraplegia". Both are quoted below rather than averaged.
  evidence:
  - reference: PMID:23707145
    reference_title: "Brain white matter oedema due to ClC-2 chloride channel deficiency: an observational analytical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features were variable and included cerebellar ataxia, spasticity, chorioretinopathy with visual field defects, optic neuropathy, cognitive defects, and headaches."
    explanation: Lists spasticity among the founding cohort's features.
  - reference: PMID:38173802
    reference_title: "Expanding the phenotypic spectrum of CLCN2-related leucoencephalopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings expand the phenotypic spectrum of CLCN2-related leucoencephalopathy by adding prominent seizures, severe spastic paraplegia and developmental delay."
    explanation: Documents the severe end of the pyramidal spectrum, which the earlier literature did not contain.
- name: Cognitive impairment
  category: Neurologic
  description: >-
    Cognitive involvement is present in some but not all affected individuals
    and is typically mild, only rarely severe. In adult-onset cases it presents
    as memory decline or mild cognitive impairment rather than as a dementia
    syndrome.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cognitive impairment in some (typically mild, rarely severe)"
    explanation: States both the incomplete occurrence and the severity distribution.
  - reference: PMID:40199115
    reference_title: "Clinical, neuroimaging and genetic findings in the Japanese case series of CLCN2-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cerebellar ataxia, pyramidal signs, and mild cognitive impairment"
    explanation: Independent confirmation of the mild cognitive phenotype in adult-onset patients.
- name: Headache
  category: Neurologic
  description: >-
    Headache occurs in a subset and, when it occurs, is described as
    intermittent, severe and diffuse. It appears in the founding cohort and
    again among the clinical features of the largest series, and in at least
    one recent report prominent facial pain was the leading complaint. It is
    plausibly the most direct clinical read-out of a disorder of brain water
    handling, but no source consulted here demonstrates that link.
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
    temporality: RECURRENT
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "headaches in some (usually intermittent, severe, and diffuse)"
    explanation: Characterises the headache and supports both the incomplete occurrence and the RECURRENT temporality.
  - reference: PMID:38173802
    reference_title: "Expanding the phenotypic spectrum of CLCN2-related leucoencephalopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features included a variable combination of ataxia, headache, spasticity, seizures and other symptoms with a broad range of age of onset."
    explanation: Confirms headache as a recurring feature in the largest independent series.
- name: Chorioretinopathy
  category: Ophthalmologic
  description: >-
    Degeneration of the chorioretinal complex - macular atrophy, pigment
    epithelium atrophy, choroidal capillary atrophy - arising from loss of
    ClC-2 in the retinal pigment epithelium. It is the commoner of the two
    routes to visual impairment in this disorder and is usually mild.
  phenotype_term:
    preferred_term: Chorioretinopathy
    term:
      id: HP:0000532
      label: Abnormal chorioretinal morphology
  notes: >-
    HP:0001145 ("Chorioretinopathy") is obsolete in HPO (verified with OAK,
    2026-08-01), so the clinical term is carried in `preferred_term` and the
    binding is to the non-obsolete parent HP:0000532. The more specific
    HP:0000533 (Chorioretinal atrophy) would fit the one detailed case report
    but not the term the founding study and GeneReviews use across the cohort,
    so the parent is bound deliberately rather than by omission.
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mild visual impairment from chorioretinopathy or optic atrophy"
    explanation: Names chorioretinopathy as a cause of the visual impairment and states its severity.
  - reference: PMID:31291907
    reference_title: "CLCN2-related leukoencephalopathy: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An ophthalmologic examination indicated macular atrophy, pigment epithelium atrophy and choroidal capillary atrophy."
    explanation: Gives the specific structures involved in a single well-characterised patient.
- name: Optic atrophy
  category: Ophthalmologic
  description: >-
    Optic neuropathy is the second route to visual impairment and is reported
    alongside the chorioretinopathy in both the founding cohort and the
    GeneReviews summary. Whether the two are independent consequences of
    channel loss in different ocular and anterior-visual-pathway tissues, or
    the optic atrophy is secondary to the retinal degeneration, is not resolved
    by any source consulted here.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  evidence:
  - reference: PMID:23707145
    reference_title: "Brain white matter oedema due to ClC-2 chloride channel deficiency: an observational analytical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "chorioretinopathy with visual field defects, optic neuropathy, cognitive defects, and headaches"
    explanation: Lists optic neuropathy as a distinct feature alongside the chorioretinopathy in the founding cohort.
- name: Visual field defect
  category: Ophthalmologic
  description: >-
    Visual field loss is the functional consequence of the chorioretinal
    degeneration and was reported as accompanying it in the founding cohort. It
    is generally mild; blindness is explicitly described as rare.
  phenotype_term:
    preferred_term: Visual field defect
    term:
      id: HP:0001123
      label: Visual field defect
  evidence:
  - reference: PMID:23707145
    reference_title: "Brain white matter oedema due to ClC-2 chloride channel deficiency: an observational analytical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "chorioretinopathy with visual field defects"
    explanation: Pairs the field defect with its retinal substrate in the founding cohort.
- name: Male infertility
  category: Reproductive
  description: >-
    Male infertility is a core feature of the disorder in the GeneReviews
    characterisation and has twice been the finding that brought an otherwise
    minimally symptomatic man to genetic diagnosis. The mechanism is
    Sertoli-cell channel loss. Human penetrance is uncertain - see the
    discussion below on the fertility conflict.
  phenotype_term:
    preferred_term: Male infertility
    term:
      id: HP:0003251
      label: Male infertility
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mild visual impairment from chorioretinopathy or optic atrophy, male infertility, and characteristic findings on brain MRI"
    explanation: Lists male infertility among the defining features of the disorder.
  - reference: PMID:25128180
    reference_title: "Subclinical leukodystrophy and infertility in a man with a novel homozygous CLCN2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subclinical leukodystrophy and infertility in a man with a novel homozygous CLCN2 mutation."
    explanation: >-
      This report is indexed by PubMed without an abstract, so the article title
      is the only verbatim text in the cache and is what is quoted. It documents
      the co-occurrence of infertility with a subclinical leukodystrophy in a
      homozygous man, which is the ascertainment route this phenotype describes.
- name: Azoospermia
  category: Reproductive
  description: >-
    Where the infertility has been characterised at the level of semen
    analysis, azoospermia is the finding, matching the azoospermia of the
    Clcn2 early-stop mouse. It is the more specific statement of the male
    reproductive phenotype and is reported in at least one biallelic patient.
  phenotype_term:
    preferred_term: Azoospermia
    term:
      id: HP:0000027
      label: Azoospermia
  evidence:
  - reference: PMID:41822756
    reference_title: "Identification of a novel CLCN2 homozygous variant in a man with leukoencephalopathy and infertility: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, the patient had a history of azoospermia."
    explanation: Documents azoospermia specifically, rather than infertility generically, in a biallelic patient.
- name: Hearing impairment
  category: Otologic
  description: >-
    Auditory symptoms occur in a subset. The mechanistic link is unusually
    direct for this disorder: the one conduction measurement made in the mouse
    was a decreased conduction velocity in the central auditory pathway, so the
    hearing loss is best understood as central and conductive-in-the-tract
    rather than cochlear. No audiological localisation study has been published
    in a patient.
  phenotype_term:
    preferred_term: Hearing impairment
    term:
      id: HP:0000365
      label: Hearing impairment
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "auditory symptoms in some (hearing loss, tinnitus, vertigo)"
    explanation: Names hearing loss among the auditory symptoms and marks them as occurring in a subset.
  - reference: PMID:17567819
    reference_title: "Leukoencephalopathy upon disruption of the chloride channel ClC-2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a decreased conduction velocity in neurons of the central auditory pathway"
    explanation: The mouse electrophysiology supporting a central rather than cochlear localisation for the auditory phenotype.
- name: Tinnitus
  category: Otologic
  description: >-
    Reported both in the GeneReviews summary of auditory symptoms and in an
    individual case presentation alongside the cerebellar features.
  phenotype_term:
    preferred_term: Tinnitus
    term:
      id: HP:0000360
      label: Tinnitus
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "auditory symptoms in some (hearing loss, tinnitus, vertigo)"
    explanation: Lists tinnitus among the recognised auditory symptoms.
  - reference: PMID:31291907
    reference_title: "CLCN2-related leukoencephalopathy: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "memory decline, tinnitus, and dizziness"
    explanation: Individual case documentation of tinnitus with the rest of the syndrome.
- name: Vertigo
  category: Otologic
  description: >-
    Vertigo completes the audiovestibular cluster. It is worth separating from
    the gait ataxia in the history, because the two coexist and a purely
    cerebellar reading of unsteadiness will miss the vestibular component.
  phenotype_term:
    preferred_term: Vertigo
    term:
      id: HP:0002321
      label: Vertigo
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "auditory symptoms in some (hearing loss, tinnitus, vertigo)"
    explanation: Names vertigo among the auditory and vestibular symptoms.
- name: Depression
  category: Psychiatric
  description: >-
    Psychiatric symptoms occur in a subset and GeneReviews specifies depression
    and schizophrenia-like symptoms. Only the depression component is bound as a
    phenotype node, which is why the node is named for it rather than for the
    broader psychiatric category. They are worth recording because a
    leukodystrophy presenting first to psychiatry is a well-known route to
    delayed diagnosis, and because the MRI pattern is diagnostic once obtained.
  phenotype_term:
    preferred_term: Depression
    term:
      id: HP:0000716
      label: Depression
  notes: >-
    Only depression is bound to an HPO term. The source's other wording is
    "schizophrenia-like symptoms", which is deliberately NOT bound to HP:0100753
    (Schizophrenia): a schizophrenia-like presentation is not a diagnosis of
    schizophrenia, and binding it would overstate what the chapter says. The
    quoted snippet preserves the original wording so the distinction survives
    into the evidence.
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "psychiatric symptoms in some (depression and schizophrenia-like symptoms)"
    explanation: The full psychiatric characterisation, quoted intact so that the "-like" qualifier is preserved rather than resolved into a diagnosis.
- name: Seizure
  category: Neurologic
  description: >-
    Seizures occur in a minority. Their status has genuinely changed over time
    and that history matters. GeneReviews (2021) placed epilepsy among findings
    whose relationship to the disorder was not yet established, but the 2024
    twelve-patient series explicitly added prominent seizures to the phenotypic
    spectrum. This is a claim about biallelic patients and is entirely separate
    from the retracted association between heterozygous CLCN2 variants and
    idiopathic generalized epilepsy discussed in the entry `notes`.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:38173802
    reference_title: "Expanding the phenotypic spectrum of CLCN2-related leucoencephalopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features included a variable combination of ataxia, headache, spasticity, seizures and other symptoms with a broad range of age of onset."
    explanation: Documents seizures as a feature of biallelic patients in the largest series.
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "It is not yet known if the findings occurring in a few individuals (i.e., epilepsy and paroxysmal kinesigenic dyskinesia) are part of the phenotypic spectrum or unrelated findings."
    explanation: >-
      Marked PARTIAL: this is the 2021 position, which withholds judgement. It
      is retained rather than dropped because the disagreement between it and
      the 2024 series is itself the current state of knowledge.
- name: Paroxysmal dyskinesia
  category: Neurologic
  description: >-
    Paroxysmal kinesigenic dyskinesia has been reported as a secondary movement
    disorder in a patient with a CLCN2 mutation, and paroxysmal non-kinesigenic
    dyskinesia has since been reported as an isolated presentation. GeneReviews
    lists it among findings whose relationship to the disorder is unproven, and
    that caution is retained here.
  phenotype_term:
    preferred_term: Paroxysmal dyskinesia
    term:
      id: HP:0007166
      label: Paroxysmal dyskinesia
  notes: >-
    HP:0007166 (Paroxysmal dyskinesia) has no children in HPO (checked with
    `runoak descendants -p i`, 2026-08-01), so the kinesigenic/non-kinesigenic
    distinction cannot be expressed in the binding and is carried in the
    description instead.
  evidence:
  - reference: PMID:25745790
    reference_title: "Secondary paroxysmal kinesigenic dyskinesia associated with CLCN2 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary paroxysmal kinesigenic dyskinesia associated with CLCN2 gene mutation."
    explanation: >-
      This short report is indexed by PubMed without an abstract, so the article
      title is the only verbatim text in the cache and is what is quoted. It
      records the association and, by using the word "secondary", frames the
      dyskinesia as a consequence of the structural lesion.
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "epilepsy and paroxysmal kinesigenic dyskinesia) are part of the phenotypic spectrum or unrelated findings"
    explanation: Marked PARTIAL because GeneReviews explicitly declines to decide whether this feature belongs to the disorder.
- name: Global developmental delay
  category: Neurologic
  description: >-
    Developmental delay was added to the recognised spectrum by the 2024 series
    and is not part of the classical description. In the founding cohort the
    paediatric patients had a more diffuse white matter abnormality than the
    adults, which is at least consistent with a greater developmental impact of
    early-onset disease, though no source consulted here tests that.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:38173802
    reference_title: "Expanding the phenotypic spectrum of CLCN2-related leucoencephalopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "adding prominent seizures, severe spastic paraplegia and developmental delay"
    explanation: The source that introduced developmental delay into the phenotypic spectrum.
- name: Scanning Speech
  category: Neurologic
  description: >-
    Scanning speech - the cerebellar dysarthria - is reported in individual
    cases alongside the limb ataxia and is the expected speech consequence of
    middle cerebellar peduncle involvement.
  phenotype_term:
    preferred_term: Scanning speech
    term:
      id: HP:0002168
      label: Scanning speech
  evidence:
  - reference: PMID:31291907
    reference_title: "CLCN2-related leukoencephalopathy: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mild hand tremor, scanning speech, nystagmus, cerebellar ataxia in the upper limbs"
    explanation: Documents scanning speech in a characterised patient together with the rest of the cerebellar syndrome.
- name: Nystagmus
  category: Neurologic
  description: >-
    Nystagmus is reported in individual patients and belongs to the cerebellar
    rather than the retinal arm of the disorder.
  phenotype_term:
    preferred_term: Nystagmus
    term:
      id: HP:0000639
      label: Nystagmus
  evidence:
  - reference: PMID:31291907
    reference_title: "CLCN2-related leukoencephalopathy: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "scanning speech, nystagmus, cerebellar ataxia in the upper limbs"
    explanation: Documents nystagmus as part of the cerebellar presentation.
- name: Leukoencephalopathy
  category: Neurologic
  diagnostic: true
  description: >-
    The defining abnormality, present in every reported patient. It is
    characterised as intramyelinic oedema rather than demyelination, and its
    distribution is the tract-selective pattern described in the imaging
    findings below. Because both major series recruited on the imaging pattern,
    the apparent universality of this phenotype is partly an artefact of
    ascertainment; no source consulted here reports a molecularly confirmed
    biallelic patient with a normal brain MRI.
  phenotype_term:
    preferred_term: Leukoencephalopathy
    term:
      id: HP:0002352
      label: Leukoencephalopathy
  evidence:
  - reference: PMID:36565320
    reference_title: "Brain imaging findings in CLCN2-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CLCN2-related leukoencephalopathy is a rare autosomal-recessive disease caused by a loss-of-function mutation in the ClC-2 chloride channel, which is fundamental in ion and water brain homeostasis."
    explanation: States the leukoencephalopathy as the defining feature and ties it to the ion-and-water mechanism.
  - reference: PMID:31291907
    reference_title: "CLCN2-related leukoencephalopathy: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CC2L is a rare condition characterized by diffuse edema involving specific fiber tracts that pass through the brainstem."
    explanation: Names the lesion as oedema and captures both its diffuseness and its tract selectivity in one sentence.
imaging_findings:
- name: Symmetrical T2 Hyperintensity of the Posterior Limbs of the Internal Capsules, Cerebral Peduncles and Middle Cerebellar Peduncles
  modality: MRI
  description: >-
    The diagnostic pattern. Symmetrical T2/DWI high signal involving the
    posterior limbs of the internal capsules, the midbrain cerebral peduncles
    and the middle cerebellar peduncles, with variable additional cerebral
    white matter involvement. It was present in all twelve patients of the
    largest series and was the criterion by which both that cohort and the
    Japanese cohort were assembled. Recognising it is the practical trigger for
    CLCN2 sequencing.
  phenotype_term:
    preferred_term: Hyperintensity of cerebral white matter on MRI
    term:
      id: HP:0030890
      label: Hyperintensity of cerebral white matter on MRI
  located_in:
    preferred_term: middle cerebellar peduncle
    term:
      id: UBERON:0002152
      label: middle cerebellar peduncle
  laterality: BILATERAL
  diagnostic: true
  evidence:
  - reference: PMID:38173802
    reference_title: "Expanding the phenotypic spectrum of CLCN2-related leucoencephalopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients demonstrated typical MRI changes, including hyperintensity on T2-weighted images in the posterior limbs of the internal capsules, midbrain cerebral peduncles, middle cerebellar peduncles and cerebral white matter."
    explanation: The pattern, its universality in the largest series, and the T2 weighting on which it is seen.
  - reference: PMID:40199115
    reference_title: "Clinical, neuroimaging and genetic findings in the Japanese case series of CLCN2-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "typical MRI findings of symmetrical high signal intensities on the DWIs/T2WIs of the middle cerebellar peduncles (MCPs)"
    explanation: Confirms the symmetry and the middle-cerebellar-peduncle emphasis, and adds the diffusion-weighted sequence.
  - reference: PMID:36565320
    reference_title: "Brain imaging findings in CLCN2-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroimaging plays a fundamental role in the identification of CLCN2-related leukoencephalopathy, which has a typical magnetic resonance imaging pattern that, when recognized, should promote proper genetic study for diagnostic confirmation."
    explanation: States the clinical use of the pattern - imaging pattern recognition as the trigger for genetic testing - which is why this finding is marked diagnostic.
- name: Restricted Diffusion in the Affected Tracts
  modality: MRI
  description: >-
    Diffusion restriction in the involved structures is the imaging signature
    that distinguishes intramyelinic oedema from myelin loss: water trapped
    between myelin lamellae is restricted, whereas the free water of a
    demyelinated tract is not. In adults the restriction is confined to the
    three named structures; in children the cerebral white matter is more
    diffusely involved. Practically, a leukodystrophy with persistent
    restricted diffusion in the middle cerebellar peduncles is a short
    differential.
  phenotype_term:
    preferred_term: Abnormal diffusion weighted cerebral MRI morphology
    term:
      id: HP:0032615
      label: Abnormal diffusion weighted cerebral MRI morphology
  spatial_extent: MULTIFOCAL
  diagnostic: true
  notes: >-
    HPO has no "restricted diffusion" term (OAK search, 2026-08-01, returns only
    HP:0032615 in the diffusion branch and it has no descendants), so the
    specific finding is carried in `preferred_term` and description. The
    `spatial_extent: MULTIFOCAL` reflects the adult pattern of several discrete
    involved tracts; in paediatric patients the same finding is DIFFUSE, which
    is stated in the description rather than modelled as a second record.
  evidence:
  - reference: PMID:23707145
    reference_title: "Brain white matter oedema due to ClC-2 chloride channel deficiency: an observational analytical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI showed restricted diffusion suggesting myelin vacuolation that was confined to the specified white matter structures in adult patients, and more diffusely involved the brain white matter in paediatric patients."
    explanation: The primary description of the diffusion restriction, its interpretation as myelin vacuolation, and its age-dependent extent.
diagnosis:
- name: MRI pattern recognition
  description: >-
    In practice the diagnosis starts with the scan, not the gene. The clinical
    syndrome is nonspecific enough that it will not by itself suggest CLCN2,
    while the imaging pattern - symmetrical involvement of the posterior limbs
    of the internal capsules, the midbrain cerebral peduncles and the middle
    cerebellar peduncles with restricted diffusion - is distinctive and, once
    recognised, should prompt targeted genetic study. Both cohort studies that
    have expanded the disease used exactly this route, screening undiagnosed
    leukoencephalopathy with middle-cerebellar-peduncle signs.
  evidence:
  - reference: PMID:36565320
    reference_title: "Brain imaging findings in CLCN2-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which has a typical magnetic resonance imaging pattern that, when recognized, should promote proper genetic study for diagnostic confirmation"
    explanation: "States the diagnostic algorithm directly: recognise the pattern, then sequence."
  - reference: PMID:40199115
    reference_title: "Clinical, neuroimaging and genetic findings in the Japanese case series of CLCN2-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We searched for pathogenic variants of CLCN2 in a case series of undiagnosed leukoencephalopathy accompanied by MCP signs, which led to the identification of four Japanese patients with CC2L."
    explanation: A worked example of the algorithm succeeding, and simultaneously the reason the imaging phenotype looks fully penetrant in the literature.
- name: Molecular genetic testing for biallelic CLCN2 variants
  description: >-
    The diagnosis is established by identifying biallelic pathogenic CLCN2
    variants. Two interpretation points follow from the published spectrum.
    First, both truncating and missense alleles are causal and a missense
    variant should not be discounted - the allele whose loss of function is
    best characterised experimentally, p.Ala500Val, is a missense change whose
    defect is in gating and turnover rather than in protein absence. Second,
    phase must be established, because heterozygotes are unaffected and because
    a heterozygous CLCN2 variant has an entirely different clinical meaning in
    the context of hypertension (see the differential on familial
    hyperaldosteronism type II). In populations where a founder allele exists -
    c.61dupC in Japan - it should be looked for specifically.
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CLCN2-related leukoencephalopathy is established in a proband by identification of biallelic pathogenic variants in CLCN2 on molecular genetic testing."
    explanation: The formal diagnostic criterion.
  - reference: PMID:28905383
    reference_title: "Leukoencephalopathy-causing CLCN2 mutations are associated with impaired Cl(-) channel function and trafficking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Characterisation of most mutations found in CLCN2 in patients with CC2L leukodystrophy show that they cause a reduction in function of the chloride channel ClC-2."
    explanation: Functional evidence supporting the interpretation of missense alleles as loss-of-function, which is the interpretive point this test description makes.
- name: Ophthalmologic and audiologic assessment
  description: >-
    Formal ophthalmological review is warranted at diagnosis and periodically
    thereafter, because chorioretinopathy and optic atrophy are core features
    that can be asymptomatic early, and audiologic assessment because hearing
    loss, tinnitus and vertigo occur in a subset. GeneReviews recommends both
    every two to three years alongside an annual neurological examination.
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annual: neurologic examination. Every 2-3 years: ophthalmologic examination and audiologic assessment."
    explanation: The surveillance schedule, quoted verbatim from the GeneReviews management section.
- name: Semen analysis in affected males
  description: >-
    Semen analysis is warranted in affected males of reproductive age, both for
    counselling and because azoospermia is a recognised manifestation. It
    should not be presented as inevitable: at least one affected man has
    fathered two children.
  evidence:
  - reference: PMID:40199115
    reference_title: "Clinical, neuroimaging and genetic findings in the Japanese case series of CLCN2-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One male patient had two children, supporting preserved fertility"
    explanation: Supports the counselling caveat that fertility is not uniformly lost, which is the reason this test is framed as assessment rather than as expected confirmation.
differential_diagnoses:
- name: Familial hyperaldosteronism type II
  disease_term:
    preferred_term: familial hyperaldosteronism type II
    term:
      id: MONDO:0011576
      label: familial hyperaldosteronism type II
  description: >-
    The allelic disorder, and the most important entry in this list even though
    no clinician would ever confuse the two presentations. FH-II is caused by
    heterozygous GAIN-of-function variants in CLCN2 - the same gene, the
    opposite direction of effect, and a dominant rather than recessive dose.
    The mechanism is tissue-specific in a way that explains why one gene
    produces two unrelated diseases. In adrenal zona glomerulosa cells the
    chloride equilibrium potential sits depolarized relative to rest, so
    opening ClC-2 depolarizes the cell; the depolarization opens voltage-gated
    calcium channels and induces aldosterone synthase, producing autonomous
    aldosterone excess. In glia the same channel is doing homeostatic work -
    buffering the chloride, potassium and water fluxes of the panglial
    syncytium - and losing it produces intramyelinic oedema. The knock-in mouse
    carrying a constitutively open ClC-2 develops the adrenal disease; the
    knockout mouse develops the white matter disease. They are not points on
    one severity spectrum.

    The reason this belongs in a differential list at all is variant
    interpretation rather than clinical differentiation. A laboratory that
    reports "a CLCN2 variant" has said nothing until zygosity and direction of
    effect are established. dismech curates FH-II in
    kb/disorders/Familial_Hyperaldosteronism.yaml, which models its CLCN2 arm
    as a gain-of-function adrenal mechanism; that entry was read before this one
    was written and was not modified.
  distinguishing_features:
  - FH-II is autosomal dominant and caused by heterozygous variants; this disorder requires two loss-of-function alleles and heterozygous carriers are unaffected.
  - The FH-II alleles increase ClC-2 open probability at the glomerulosa resting potential (gain of function); the LKPAT alleles reduce channel function and plasma membrane expression (loss of function).
  - FH-II presents as early-onset primary aldosteronism with hypertension, suppressed renin and variable hypokalaemia; no white matter, retinal or testicular involvement has been reported in it.
  - This disorder presents with a leukoencephalopathy on MRI, cerebellar ataxia, chorioretinopathy and male infertility; hyperaldosteronism has not been reported in it.
  - The recurrent FH-II allele p.Arg172Gln has been seen four times independently, one of those occurrences de novo (a second, different FH-II allele, p.Met22Lys, was also de novo); the LKPAT alleles are private or population-specific (c.61dupC in Japan) and are transmitted, not de novo.
  - "The two mouse models differ accordingly: the constitutively open Clcn2op knock-in reproduces primary aldosteronism, while the Clcn2 knockout reproduces white matter vacuolation."
  notes: >-
    MONDO:0011576 was verified with OAK (`runoak -i sqlite:obo:mondo
    relationships -p RO:0004003 --direction down HGNC:2020`), which returns it,
    MONDO:0014292 and MONDO:0011875 as the only three CLCN2 disease terms; its
    xref is OMIM:605635. It is the same term already bound as the FH-II subtype
    in kb/disorders/Familial_Hyperaldosteronism.yaml.
  evidence:
  - reference: PMID:33187987
    reference_title: "Cellular basis of ClC-2 Cl(-) channel-related brain and testis pathologies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutations that cause the loss of ClC-2 function lead to retinal and testicular degeneration and leukodystrophy, whereas gain-of-function mutations cause hyperaldosteronism."
    explanation: The allelic contrast stated in one sentence by the group that generated both the loss-of-function and the constitutively-open mouse lines.
  - reference: PMID:29403011
    reference_title: "CLCN2 chloride channel mutations in familial hyperaldosteronism type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CLCN2 encodes a voltage-gated chloride channel expressed in adrenal glomerulosa that opens at hyperpolarized membrane potentials. Channel opening depolarizes glomerulosa cells and induces expression of aldosterone synthase, the rate-limiting enzyme for aldosterone biosynthesis."
    explanation: The tissue-specific mechanism by which opening the channel is pathogenic in the adrenal, which is the mechanistic reason the same gene yields two opposite diseases.
  - reference: PMID:29403011
    reference_title: "CLCN2 chloride channel mutations in familial hyperaldosteronism type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight probands had novel heterozygous variants in CLCN2, including two de novo mutations and four independent occurrences of a mutation encoding an identical p.Arg172Gln substitution"
    explanation: Documents the heterozygous, partly de novo, recurrent-allele architecture of FH-II, which differs on every axis from the biallelic transmitted architecture of this disorder.
  - reference: PMID:31615979
    reference_title: "Pathogenesis of hypertension in a mouse model for human CLCN2 related hyperaldosteronism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Clcn2op mice display typical features of human PA, including high serum aldosterone in the presence of low renin activity, marked hypertension and hypokalemia."
    explanation: Shows that a constitutively open ClC-2 is sufficient for the adrenal disease in vivo, completing the mirror-image comparison with the knockout.
- name: Megalencephalic leukoencephalopathy with subcortical cysts
  disease_term:
    preferred_term: megalencephalic leukoencephalopathy with subcortical cysts
    term:
      id: MONDO:0011391
      label: megalencephalic leukoencephalopathy with subcortical cysts
  description: >-
    The closest mechanistic relative, and the one differential where the
    overlap is molecular rather than merely radiological. MLC is caused by
    variants in MLC1 or in HEPACAM (GlialCAM) - the two proteins that form a
    complex with ClC-2 in glia. All three lesions produce vacuolating white
    matter disease with intramyelinic fluid, and GlialCAM is required for
    targeting both MLC1 and ClC-2 to specialised glial domains and for
    modifying ClC-2's properties in oligodendrocytes, the cells chiefly
    affected by vacuolization. The three diseases are best thought of as
    lesions at different points of one glial ion-and-water module.

    Clinically they separate cleanly, which is why this is a differential and
    not a subtype relationship. MLC begins with infantile macrocephaly and
    shows diffusely swollen white matter with anterior temporal and
    frontoparietal subcortical cysts; CLCN2-related leukoencephalopathy has
    normal head size and a tract-selective pattern without cysts.
  distinguishing_features:
  - MLC presents with infantile-onset macrocephaly; macrocephaly is not a feature of CLCN2-related leukoencephalopathy.
  - Subcortical cysts in the anterior temporal and frontoparietal regions are characteristic of MLC and are not part of the CLCN2 imaging pattern.
  - MLC involves the cerebral white matter diffusely and swollen; the CLCN2 pattern is tract-selective, centred on the posterior limbs of the internal capsules, cerebral peduncles and middle cerebellar peduncles.
  - The causal genes differ - MLC1 or HEPACAM in MLC, CLCN2 here - even though the three proteins act as one complex; a remitting dominant form of MLC exists with HEPACAM variants, whereas CLCN2-related leukoencephalopathy is uniformly recessive.
  - MLC follows a progressive course with increasing seizures, spasticity and cognitive decline and loss of ambulation; CLCN2-related leukoencephalopathy characteristically preserves ambulation.
  notes: >-
    MONDO:0011391 was verified with OAK; its Orphanet xref is Orphanet:2478 and
    it carries "MLC" and "Van der Knaap syndrome" as exact synonyms. The
    clinical contrast in the distinguishing features is taken from that MONDO
    term's Orphanet-sourced definition text; it is presented as reasoned
    clinical context rather than as a quoted finding, which is why no evidence
    item carries it. The evidence items below support only the molecular
    convergence, which is the claim this differential is really making. There is
    no dismech entry for MLC at the time of writing.
  evidence:
  - reference: PMID:24647135
    reference_title: "Disrupting MLC1 and GlialCAM and ClC-2 interactions in leukodystrophy entails glial chloride channel dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Defects in the astrocytic membrane protein MLC1, the adhesion molecule GlialCAM or the chloride channel ClC-2 underlie human leukoencephalopathies."
    explanation: Establishes that the three genes cause one family of leukoencephalopathies, which is the basis for treating MLC as the mechanistic differential.
  - reference: PMID:24647135
    reference_title: "Disrupting MLC1 and GlialCAM and ClC-2 interactions in leukodystrophy entails glial chloride channel dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "suggest that ClC-2 participates in the pathogenesis of megalencephalic leukoencephalopathy with subcortical cysts"
    explanation: States the reciprocal claim - that the channel contributes to MLC pathogenesis - which is what makes the relationship a shared module rather than a coincidence.
  - reference: PMID:28905383
    reference_title: "Leukoencephalopathy-causing CLCN2 mutations are associated with impaired Cl(-) channel function and trafficking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The membrane protein MLC1, which is defective in MLC, also contributes to the stabilisation of ClC-2 at the plasma membrane, providing further support for the view that GlialCAM, MLC1 and ClC-2 form a protein complex in glial cells."
    explanation: Direct biochemical evidence for the ternary complex that unifies the two diseases.
- name: Charcot-Marie-Tooth disease X-linked dominant 1
  disease_term:
    preferred_term: Charcot-Marie-Tooth disease X-linked dominant 1
    term:
      id: MONDO:0010549
      label: Charcot-Marie-Tooth disease X-linked dominant 1
  description: >-
    The empirically demonstrated radiological mimic. When the founding study
    recruited seven patients on the basis of the CLCN2 imaging pattern, six
    turned out to have CLCN2 variants and the seventh had an X-linked family
    history and a mutation in GJB1, encoding connexin 32 - that is, CMTX1. GJB1
    is a gap-junction protein of myelinating glia, so the convergence is not
    accidental: a lesion of glial coupling produces the same intramyelinic
    fluid signature. Any patient whose MRI suggests CLCN2 and whose sequencing
    is negative should be assessed for GJB1, and the pedigree is the first
    discriminator.
  distinguishing_features:
  - CMTX1 is X-linked with male predominance and no male-to-male transmission; CLCN2-related leukoencephalopathy is autosomal recessive and affects both sexes equally.
  - CMTX1's core phenotype is a peripheral neuropathy with distal weakness, wasting and areflexia; the CLCN2 mouse shows that its intramyelinic lesion spares the peripheral nervous system, and peripheral neuropathy is not a feature of the human disorder.
  - The CNS white matter changes in CMTX1 are classically transient and episodic, often provoked; the CLCN2 abnormality is persistent.
  - Chorioretinopathy and male infertility point to CLCN2 and have no counterpart in CMTX1.
  notes: >-
    MONDO:0010549 was verified with OAK, including its gene (`runoak
    relationships -p RO:0004003 MONDO:0010549` returns HGNC:4283 GJB1),
    confirming that the "GJB1, encoding connexin 32" of the founding study maps
    to this MONDO term. There is no dismech entry for CMTX1 at the time of
    writing.
  evidence:
  - reference: PMID:23707145
    reference_title: "Brain white matter oedema due to ClC-2 chloride channel deficiency: an observational analytical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The remaining paediatric patient had an X-linked family history and a mutation in GJB1, encoding connexin 32."
    explanation: Documents a real patient recruited on the CLCN2 imaging pattern who turned out to have GJB1 disease - direct evidence that this is a genuine radiological differential rather than a theoretical one.
  - reference: PMID:17567819
    reference_title: "Leukoencephalopathy upon disruption of the chloride channel ClC-2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Fluid-filled spaces appeared between myelin sheaths of the central but not the peripheral nervous system."
    explanation: Supports the peripheral-nervous-system distinguishing feature - the CLCN2 lesion is CNS-restricted, whereas CMTX1 is fundamentally a peripheral neuropathy.
- name: Leukoencephalopathy with brain stem and spinal cord involvement-high lactate syndrome
  disease_term:
    preferred_term: leukoencephalopathy with brain stem and spinal cord involvement-high lactate syndrome
    term:
      id: MONDO:0012622
      label: leukoencephalopathy with brain stem and spinal cord involvement-high lactate syndrome
  description: >-
    LBSL, caused by biallelic DARS2 variants, is the other recessive
    leukoencephalopathy in which selective involvement of specific brainstem
    and cerebellar tracts - including the middle cerebellar peduncles and the
    pyramidal tracts within the internal capsule - is the diagnostic hallmark,
    and in which slowly progressive ataxia and spasticity are the clinical
    core. It is the differential most likely to be raised by a neuroradiologist
    looking at the same scan.
  distinguishing_features:
  - LBSL shows selective involvement of the dorsal columns and the spinal lateral corticospinal tracts and characteristically involves the spinal cord; spinal cord involvement is not part of the described CLCN2 pattern in humans.
  - Elevated lactate on MR spectroscopy in the abnormal white matter is characteristic of LBSL and gives it its name; the reported spectroscopy abnormality in a CLCN2 patient was a reduced choline peak, not raised lactate.
  - The causal gene differs - DARS2, a mitochondrial aspartyl-tRNA synthetase, versus CLCN2 - so the mechanism is mitochondrial translation rather than glial ion homeostasis.
  - Chorioretinopathy and male infertility are features of the CLCN2 disorder and not of LBSL.
  notes: >-
    MONDO:0012622 was verified with OAK, including its gene (HGNC:25538 DARS2).
    The distinguishing features are reasoned clinical and radiological
    contrasts drawn from the two entities' established descriptions and are not
    quoted, which is why no evidence item is attached; the reduced-choline
    observation in a CLCN2 patient is from the title of PMID:38975464, which was
    surfaced in the literature search but not cached or cited as evidence. There
    is no dismech entry for LBSL at the time of writing.
- name: Leukoencephalopathy with vanishing white matter
  disease_term:
    preferred_term: leukoencephalopathy with vanishing white matter
    term:
      id: MONDO:0800448
      label: leukoencephalopathy with vanishing white matter
  description: >-
    VWM is included because it is the other recessive leukodystrophy in which
    the white matter appears to fill with fluid, and because both disorders can
    present in adults with ataxia and spasticity. The distinction is that in
    VWM the white matter is genuinely rarefied and cystically degenerating -
    approaching the signal of cerebrospinal fluid on all sequences - whereas in
    CLCN2 disease the myelin is structurally intact with water between its
    lamellae, which is why the CLCN2 lesion restricts diffusion and the VWM
    lesion does not.
  distinguishing_features:
  - VWM white matter approaches CSF signal on all sequences with progressive rarefaction; the CLCN2 abnormality shows restricted diffusion, indicating trapped rather than free water.
  - VWM characteristically deteriorates episodically after febrile illness or minor head trauma; no such stress-provoked deterioration is described in CLCN2-related leukoencephalopathy.
  - VWM is caused by biallelic variants in the EIF2B1-EIF2B5 genes and involves the integrated stress response, an unrelated mechanism.
  - The CLCN2 pattern is tract-selective and includes the middle cerebellar peduncles; VWM involves the cerebral hemispheric white matter diffusely.
  notes: >-
    MONDO:0800448 was verified with OAK and matches the disease_term already
    bound in kb/disorders/Leukoencephalopathy_With_Vanishing_White_Matter.yaml,
    which was consulted for the VWM clinical description used here. Note that
    OAK also returns MONDO:0011380 for the same name, which is OBSOLETE and was
    not used. The distinguishing features are reasoned contrasts rather than
    quotations, so no evidence item is attached.
treatments:
- name: Supportive and symptomatic care
  description: >-
    No disease-modifying therapy exists. Management is supportive: physical
    therapy and rehabilitation to maintain motor function, special education
    where needed, treatment of headache, and guidance for visual impairment.
    Because the natural history is comparatively benign - ambulation preserved,
    blindness rare - the realistic goal is maintenance of function rather than
    arrest of progression.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supportive care including physical therapy and rehabilitation to improve motor function, special education as needed, treatment of headache, guidance for visual impairment."
    explanation: The GeneReviews management recommendation, quoted in full; it is the entire evidence base for treatment in this disorder.
- name: Physical therapy and rehabilitation
  description: >-
    Physical therapy and rehabilitation are recommended specifically to improve
    motor function, targeting the cerebellar and pyramidal components of the
    syndrome. No trial evidence exists in this disorder; the recommendation is
    expert consensus in the GeneReviews chapter.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "physical therapy and rehabilitation to improve motor function"
    explanation: Names the intervention and its stated goal.
- name: Genetic counseling
  description: >-
    Counselling follows the standard autosomal recessive arithmetic: with two
    heterozygous parents, each sib has a 25% chance of being affected, a 50%
    chance of being an asymptomatic carrier and a 25% chance of being
    unaffected and not a carrier. Carrier testing, prenatal testing and
    preimplantation genetic testing are possible once the familial variants are
    known. Two disease-specific caveats belong in the conversation. Penetrance
    and expressivity are not established - biallelic individuals have been
    reported who were subclinical - so a prenatal genotype cannot be translated
    into a predicted severity. And male fertility should be discussed without
    being presented as uniformly lost.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If both parents are known to be heterozygous for a CLCN2 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: The recurrence risk figures, quoted verbatim rather than restated, since they are the quantitative content of the counselling.
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "carrier testing for at-risk family members and prenatal and preimplantation genetic testing for CLCN2-related leukoencephalopathy are possible"
    explanation: Supports the reproductive-options component of counselling.
- name: Evaluation and surveillance of at-risk relatives
  description: >-
    Clarifying the genetic status of older and younger sibs of a proband is
    recommended so that those who would benefit from early diagnosis and
    routine surveillance for motor, cognitive, visual and hearing impairment
    can be identified. The rationale is stronger here than for most
    leukodystrophies precisely because the disorder can be subclinical: a sib
    identified genetically may have imaging abnormalities and no symptoms.
  treatment_term:
    preferred_term: evaluation of relatives at risk
    term:
      id: NCIT:C92803
      label: Genetic Screening
  notes: >-
    The recommended action is clarification of the genetic status of sibs, so
    the binding is to NCIT:C92803 (Genetic Screening, "Testing to determine if
    there is a predisposition or indication of a possible genetic or a
    chromosomal abnormality") rather than to the generic NCIT:C15747
    (Supportive Care) used by treatments[0]. Verified with OAK on 2026-08-01:
    NCIT:C92803 is_a NCIT:C15709 (Genetic Testing) and its ancestors include
    both NCIT:C15419 (Disease Screening) and the NCIT:C25218 root the
    TreatmentTerm enum requires, so it is the more specific valid term. The
    sibling NCIT:C62694 (Mutation Carrier Screening) was considered and
    rejected: sibs here are at 25% risk of being affected, and the stated
    purpose is early diagnosis and surveillance, not carrier ascertainment.
  evidence:
  - reference: PMID:26539602
    reference_title: "CLCN2-Related Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is appropriate to clarify the genetic status of older and younger sibs of a proband in order to identify as early as possible those who would benefit from early diagnosis and routine surveillance for motor, cognitive, vision, and hearing impairment."
    explanation: The recommendation and its stated purpose, quoted verbatim.
animal_models:
- species: Mus musculus
  genotype: Clcn2 knockout (constitutive null)
  category: Knockout
  description: >-
    The constitutive Clcn2 knockout is the founding model and the reason the
    human disease was looked for at all: the 2013 human study opens by noting
    that mutant mouse models suggested ClC-2 has functions in ion and water
    homoeostasis but that this had not been confirmed in human beings. The
    model recapitulates the human lesion closely - widespread white matter
    vacuolation of brain and spinal cord progressing with age, with
    fluid-filled spaces between myelin sheaths of the central but not the
    peripheral nervous system - and it also reproduces the extra-neurological arms, since
    Clcn2 disruption in mice had already been shown to cause testicular and
    retinal degeneration.

    Its two most informative results are negative ones. Neuronal morphology
    seemed normal despite the vacuolation, which is what makes the disease
    glial. And neither heterozygous nor homozygous knockouts had lowered
    seizure thresholds, which - together with the finding that several ClC-2
    sequence abnormalities in epilepsy patients are probably innocuous
    polymorphisms - is the animal half of the case against the retracted
    CLCN2-epilepsy association.

    Fidelity limits worth stating. The mouse is a complete null while most
    human patients carry missense or compound-heterozygous genotypes with
    residual function; the model therefore represents the severe end of the
    molecular spectrum. Its neurological deficits were mild, so it does not
    model the ataxia and spasticity that dominate the human presentation, and
    the human tract selectivity - internal capsule, cerebral peduncle, middle
    cerebellar peduncle - is not reported as such in the mouse, whose
    vacuolation is described as widespread.
  associated_phenotypes:
  - Widespread white matter vacuolation of brain and spinal cord, progressive with age
  - Fluid-filled spaces between central but not peripheral myelin sheaths
  - Blindness
  - Decreased conduction velocity in the central auditory pathway
  - Normal neuronal morphology
  - No lowered seizure threshold in heterozygotes or homozygotes
  evidence:
  - reference: PMID:17567819
    reference_title: "Leukoencephalopathy upon disruption of the chloride channel ClC-2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We now show that the white matter of the brain and spinal cord of ClC-2 knock-out mice developed widespread vacuolation that progressed with age."
    explanation: The core phenotype of the model and its progressive course.
  - reference: PMID:17567819
    reference_title: "Leukoencephalopathy upon disruption of the chloride channel ClC-2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A human mutation leading to a heterozygous loss of ClC-2 has previously been reported to be associated with epilepsy, whereas the disruption of Clcn2 in mice led to testicular and retinal degeneration."
    explanation: Records both the prior retinal and testicular phenotypes of the model and, in the same sentence, the epilepsy claim that this paper went on to undermine.
  - reference: PMID:17567819
    reference_title: "Leukoencephalopathy upon disruption of the chloride channel ClC-2."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Sequencing of a large collection of human DNA and electrophysiological analysis showed that several ClC-2 sequence abnormalities previously found in patients with epilepsy most likely represent innocuous polymorphisms."
    explanation: Marked REFUTE because it argues against the CLCN2-idiopathic-generalized-epilepsy association that MONDO and OMIM still record, and that this entry deliberately does not adopt.
- species: Mus musculus
  genotype: Clcn2 nmf240 (ENU-induced early stop, homozygous)
  category: Chemically induced loss-of-function allele
  description: >-
    An independent, chemically induced Clcn2 allele found in an ENU mutagenesis
    screen for abnormal retinal fundi, carrying a nucleotide 1063 C-to-T change
    that converts a glutamine to a stop codon. Its value is that it arose
    without targeting and nonetheless reproduces the same triad -
    photoreceptor degeneration, leukoencephalopathy in multiple brain areas and
    male sterility - which the authors themselves note closely resembles the
    knockout. That convergence from a different mutational origin is what makes
    the mouse phenotype attributable to Clcn2 rather than to a targeting
    artefact.

    The line also contributes the temporal ordering within the retinal arm:
    photoreceptor loss at 14 days is preceded by elongation of the retinal
    pigment epithelium apical microvilli, placing the epithelium upstream of
    the sensory cells. A heterozygous finding is reported - a reduced
    electroretinogram light peak with normal retinal histology - which has no
    established human counterpart, since human heterozygotes are not described
    as affected; it is recorded here as a model observation, not as a
    subclinical human carrier phenotype.
  associated_phenotypes:
  - Severe photoreceptor loss at 14 days of age
  - Elongation of RPE apical microvilli preceding photoreceptor loss
  - Leukoencephalopathy in multiple brain areas
  - Male sterility
  - Reduced ERG light peak in heterozygotes despite normal retinal histology
  evidence:
  - reference: PMID:20071672
    reference_title: "Photoreceptor degeneration, azoospermia, leukoencephalopathy, and abnormal RPE cell function in mice expressing an early stop mutation in CLCN2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sequencing identified a missense C-T mutation at nucleotide 1063 in Clcn2 that converts a glutamine to a stop codon."
    explanation: Identifies the allele, which is what makes this an independent replication of the knockout rather than a second look at the same line.
  - reference: PMID:20071672
    reference_title: "Photoreceptor degeneration, azoospermia, leukoencephalopathy, and abnormal RPE cell function in mice expressing an early stop mutation in CLCN2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The nmf240 phenotype closely resembles that reported for Clcn2 knockout mice."
    explanation: The authors' own statement of convergence between the two independent loss-of-function alleles.
- species: Mus musculus
  genotype: Cell-type-specific Clcn2 deletion (retinal pigment epithelium, Sertoli cells, astrocytes, oligodendrocytes)
  category: Conditional knockout
  description: >-
    The conditional series is the most informative model work on this disorder
    because it converts a multi-organ phenotype into cell-type attributions.
    Deleting ClC-2 from retinal pigment epithelial cells produces the retinal
    degeneration and deleting it from Sertoli cells produces the testicular
    degeneration, so each extra-neurological arm has a single responsible cell
    type. The white matter arm behaves differently: leukodystrophy was fully
    developed only when ClC-2 was disrupted in both astrocytes and
    oligodendrocytes. That is a statement about a coupled network rather than a
    cell, and it is the strongest available evidence for the panglial framing
    used throughout this entry.

    The same study carries a negative result that constrains how the
    GlialCAM-MLC1-ClC-2 complex should be read. Crossing Glialcam-null mice to
    a knock-in mimicking GlialCAM-induced opening of ClC-2 did not rescue their
    leukodystrophy, leading the authors to conclude that GlialCAM-induced
    changes in ClC-2's biophysical properties are irrelevant for
    GLIALCAM-related leukodystrophy. That result concerns MLC pathogenesis, not
    this disorder, but it is the reason this entry does not claim that the
    three diseases share one mechanism outright.
  associated_phenotypes:
  - Retinal degeneration on RPE-specific deletion
  - Testicular degeneration on Sertoli-cell-specific deletion
  - Full leukodystrophy only on combined astrocyte and oligodendrocyte deletion
  evidence:
  - reference: PMID:33187987
    reference_title: "Cellular basis of ClC-2 Cl(-) channel-related brain and testis pathologies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We now used cell type-specific deletion of ClC-2 in mice to show that retinal and testicular degeneration depend on a loss of ClC-2 in retinal pigment epithelial cells and Sertoli cells, respectively, whereas leukodystrophy was fully developed only when ClC-2 was disrupted in both astrocytes and oligodendrocytes."
    explanation: The complete cell-type attribution for all three organ phenotypes, in one sentence.
  - reference: PMID:33187987
    reference_title: "Cellular basis of ClC-2 Cl(-) channel-related brain and testis pathologies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data indicate that GlialCAM-induced changes in biophysical properties of ClC-2 are irrelevant for GLIALCAM-related leukodystrophy."
    explanation: The negative result limiting how far the shared-complex model can be pushed, recorded so the convergence with MLC is not overstated.
discussions:
- discussion_id: clcn2-lof-gof-tissue-specificity
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why does biallelic loss of ClC-2 spare the adrenal cortex, and why does
    heterozygous gain of function spare the brain, when the channel is
    expressed in the plasma membrane of almost all mammalian cells?
  rationale: >-
    The two CLCN2 diseases are usually described as "opposite direction of
    effect", which is true but incomplete: it does not explain the tissue
    segregation. Two partial answers are visible in the cited literature and
    neither has been tested directly. The first is electrochemical - in
    glomerulosa cells the chloride equilibrium potential lies depolarized
    relative to the resting potential, so a chloride conductance is
    depolarizing and therefore aldosterone-inducing, whereas in glia the same
    conductance serves bulk ion and water flux; on this account gain of
    function is only pathogenic where the driving force makes opening the
    channel an excitatory event. The second is dose - the CNS disease requires
    two damaged alleles and heterozygous knockout mice have no detectable
    phenotype, so a single gain-of-function allele may simply not perturb glial
    homeostasis enough to matter. Resolving this is not academic: it determines
    whether an FH-II patient should ever have a brain MRI, and whether a
    biallelic LKPAT patient should have aldosterone and renin measured. No
    published study reports either investigation.
  attaches_to:
  - "pathophysiology#Reduced ClC-2 Channel Function and Surface Expression"
  - "genetic#CLCN2"
  proposed_experiments:
  - experiment_id: clcn2-fh2-brain-mri
    name: Brain MRI in a series of genotyped FH-II patients
    description: >-
      Image the CLCN2 gain-of-function carriers already identified in the
      familial hyperaldosteronism cohorts, looking specifically at the
      posterior limbs of the internal capsules, cerebral peduncles and middle
      cerebellar peduncles. A negative result would establish the tissue
      segregation as a clinical fact rather than an absence of looking.
  - experiment_id: clcn2-lkpat-aldosterone-renin
    name: Aldosterone and renin profiling in biallelic LKPAT patients
    description: >-
      Measure plasma aldosterone, renin and potassium in molecularly confirmed
      biallelic patients to test whether loss of ClC-2 produces a
      hypoaldosteronism phenotype that has simply never been looked for.
  - experiment_id: clcn2-glia-ecl-measurement
    name: Direct measurement of the glial chloride driving force
    description: >-
      Measure the chloride equilibrium potential and resting potential in
      astrocytes and oligodendrocytes in situ, to test the electrochemical
      explanation directly against the dose explanation.
- discussion_id: clcn2-retracted-epilepsy-association
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Should CLCN2 still be regarded as an idiopathic generalized epilepsy
    susceptibility gene, given that the founding paper was retracted but that
    seizures do occur in biallelic patients?
  rationale: >-
    Three positions are on the record and they have not been reconciled. The
    original claim (Haug et al. 2003, PMID:12612585) that heterozygous CLCN2
    variants are associated with idiopathic generalized epilepsies was
    RETRACTED by Nature Genetics in 2009 (PMID:19710717), and Blanz et al.
    independently reported that several of the implicated sequence
    abnormalities are probably innocuous polymorphisms and that Clcn2 knockout
    mice have normal seizure thresholds. Yet OMIM still carries phenotype
    607628 (EIG11) and MONDO still asserts `MONDO:0011875 RO:0004003 HGNC:2020`,
    so an automated gene-disease pipeline will continue to surface CLCN2 as an
    epilepsy gene. Meanwhile the seizures reported in genuinely biallelic
    patients are real and increasing - GeneReviews in 2021 declined to say
    whether epilepsy belongs to the phenotype, and the 2024 series added
    prominent seizures to the spectrum. The two claims are separable
    (heterozygous susceptibility versus biallelic symptomatic epilepsy) and
    conflating them is the actual risk. This entry adopts the second and
    rejects the first.
  attaches_to:
  - "phenotypes#Seizure"
  - "genetic#CLCN2"
  proposed_experiments:
  - experiment_id: clcn2-eig11-curation-review
    name: Formal gene-disease validity reassessment of CLCN2-EIG11
    description: >-
      A ClinGen-style gene-disease validity classification of the
      CLCN2-idiopathic generalized epilepsy relationship, which would give
      downstream ontologies an authoritative basis on which to retire or
      qualify MONDO:0011875 and OMIM 607628.
  - experiment_id: clcn2-biallelic-epilepsy-phenotyping
    name: Systematic EEG and seizure phenotyping of a biallelic cohort
    description: >-
      Prospective EEG and seizure ascertainment across the known biallelic
      patients, to establish what fraction have epilepsy and whether it tracks
      the extent of white matter involvement - which would settle whether the
      seizures are a consequence of the structural lesion or a separate
      channel-level effect.
  notes: >-
    This discussion is the reason the entry `notes` flag MONDO:0011875 as an
    upstream ontology issue. No ontology file was edited and no MONDO change is
    proposed here; the observation is recorded for whoever maintains that
    mapping.
- discussion_id: clcn2-male-fertility-conflict
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is male infertility an obligate consequence of biallelic CLCN2 loss of
    function in humans, as it is in the mouse?
  rationale: >-
    The mouse is unambiguous: Sertoli-cell-specific deletion produces
    testicular degeneration, and the independent early-stop allele produces
    male sterility. The human data are not. Male infertility is listed among
    the defining features of the disorder in GeneReviews, was the ascertaining
    finding in at least two reported men, and azoospermia is documented in a
    biallelic patient - yet the Japanese series reports a male patient who had
    two children, which the authors read as preserved fertility. Three
    explanations are live and they differ in what they imply for counselling:
    residual channel function in specific genotypes (the Japanese patients all
    carry the frameshift c.61dupC in trans to another allele, so this is
    testable), an age- or exposure-dependent decline such that fertility is
    preserved early and lost later, or a genuine species difference in how
    absolutely Sertoli-cell ClC-2 is required. Until this is settled, affected
    men should not be told that infertility is certain, nor that it is
    unlikely.
  attaches_to:
  - "pathophysiology#Sertoli Cell ClC-2 Loss and Testicular Degeneration"
  - "phenotypes#Male infertility"
  proposed_experiments:
  - experiment_id: clcn2-semen-analysis-series
    name: Systematic semen analysis across the known biallelic male cohort
    description: >-
      Semen analysis with genotype annotation in every reported biallelic adult
      male, which would establish the actual penetrance of the reproductive
      phenotype and test the residual-function hypothesis directly against the
      genotype.
  - experiment_id: clcn2-testicular-histology
    name: Testicular histology or imaging in an infertile biallelic man
    description: >-
      Determine whether the human lesion is Sertoli-cell/tubular degeneration
      as in the mouse, which no published human study has established.
- discussion_id: clcn2-tract-selectivity-unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is the oedema confined to the posterior limbs of the internal capsules,
    the cerebral peduncles and the middle cerebellar peduncles, when ClC-2 is
    lost from glia throughout the brain?
  rationale: >-
    The tract selectivity is the most reproducible feature of the disease and
    the least explained. Every source describes the pattern; none accounts for
    it. Candidate explanations - regional differences in ClC-2 expression
    level, in the availability of the GlialCAM/MLC1 partners, in
    astrocyte-oligodendrocyte coupling density, in axon calibre and therefore in
    activity-dependent potassium load, or simply in the compactness of these
    heavily myelinated tracts - are all plausible and none has been tested. The
    gap matters because the answer would predict which tracts to watch in a
    presymptomatic biallelic sib, and because the same selectivity question
    applies to the tract patterns of other ion-and-water leukodystrophies.
  attaches_to:
  - "pathophysiology#Tract-Selective White Matter Involvement"
  proposed_experiments:
  - experiment_id: clcn2-regional-expression-mapping
    name: Regional mapping of ClC-2, GlialCAM and MLC1 in human white matter
    description: >-
      Quantify the three complex components across the internal capsule,
      cerebral peduncle, middle cerebellar peduncle and unaffected tracts in
      normal post-mortem human brain, to test whether the affected tracts are
      simply the ones most dependent on the complex.
  - experiment_id: clcn2-mouse-tract-quantification
    name: Quantitative regional analysis of vacuolation in the Clcn2 knockout
    description: >-
      Ask whether the mouse, whose vacuolation is described only as
      "widespread", in fact shows the same regional gradient when measured
      rather than described - which would make it a usable model for the
      selectivity question.
- discussion_id: clcn2-no-human-neuropathology
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Has the intramyelinic oedema of this disorder ever been demonstrated in
    human tissue, or is the lesion inferred entirely from mouse pathology plus
    human MRI?
  rationale: >-
    This is a fidelity question rather than an absence of evidence, which is
    why it is filed as HUMAN_MODEL_MISMATCH. The ultrastructural demonstration
    of fluid between myelin lamellae comes from the Clcn2 knockout mouse. The
    human contribution to that claim is twofold and neither part is tissue from
    a patient: restricted diffusion on MRI, which is an inference from a water
    compartment rather than a direct observation, and immunohistochemistry plus
    electron microscopy of ClC-2 localisation performed on post-mortem brains
    of individuals WITHOUT neurological disorders - control tissue establishing
    where the protein normally sits, not what happens when it is lost. No
    neuropathological examination of a molecularly confirmed CLCN2 patient
    appears in any source consulted here. The inference is strong and this
    entry accepts it, but the gap should not be invisible: the human lesion is
    modelled, not observed.
  attaches_to:
  - "pathophysiology#Intramyelinic Oedema and Myelin Vacuolation"
  - "pathophysiology#Loss of ClC-2 from the Panglial Syncytium"
  proposed_experiments:
  - experiment_id: clcn2-patient-neuropathology
    name: Neuropathological examination of a molecularly confirmed patient
    description: >-
      Electron microscopy of affected white matter from an autopsy or biopsy of
      a biallelic patient, to confirm directly that the human lesion is
      intramyelinic fluid rather than another cause of restricted diffusion.
  - experiment_id: clcn2-ipsc-glia-coculture
    name: Patient iPSC-derived astrocyte-oligodendrocyte co-culture
    description: >-
      An iPSC line from a CLCN2 patient already exists in the literature.
      Deriving astrocytes and oligodendrocytes from it and measuring chloride
      and volume handling in co-culture would test the two-cell requirement
      found in the mouse in human cells, without needing patient tissue.
  notes: >-
    The existence of a patient-derived iPSC line is from PMID:32278302, which
    was found in the literature search, read for its title and abstract, and
    deliberately not cached or cited as evidence - it is a resource
    announcement, and the claim it supports here is a proposed experiment
    rather than an assertion about the disease.
- discussion_id: clcn2-ascertainment-and-penetrance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What fraction of people with biallelic loss-of-function CLCN2 genotypes are
    symptomatic, given that every published cohort was recruited on the MRI
    pattern?
  rationale: >-
    Both defining cohorts selected patients by imaging before genotyping, which
    guarantees that the imaging phenotype looks fully penetrant and leaves the
    clinical penetrance unmeasured. Two published biallelic individuals were
    essentially asymptomatic - a man ascertained through infertility with
    subclinical leukodystrophy, and a p.His590Pro homozygote reported as a
    subclinical form of LKPAT - so the asymptomatic tail is known to exist and
    is entirely unquantified. The Japanese founder allele provides the one
    tractable route to an answer: its allele frequency in that population is
    known, so a biobank-scale genotype-first search would give an unbiased
    denominator. Until that is done, no penetrance figure should be quoted for
    this disorder, and this entry quotes none.
  attaches_to:
  - "phenotypes#Leukoencephalopathy"
  proposed_experiments:
  - experiment_id: clcn2-genotype-first-biobank
    name: Genotype-first ascertainment of biallelic CLCN2 carriers in a Japanese biobank
    description: >-
      Identify c.61dupC homozygotes and compound heterozygotes in a
      population biobank and phenotype them prospectively with MRI, neurological
      examination, ophthalmology and semen analysis. This is the only design
      that can produce an unbiased penetrance estimate, and the founder allele
      makes it feasible in exactly one population.
  - experiment_id: clcn2-family-cascade-imaging
    name: MRI of genotyped but asymptomatic biallelic sibs
    description: >-
      Image biallelic relatives identified through cascade testing rather than
      through symptoms, to establish whether the imaging phenotype precedes the
      clinical one universally or is itself incompletely penetrant.

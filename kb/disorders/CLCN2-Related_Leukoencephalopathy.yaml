- name: Intramyelinic Oedema and Myelin Vacuolation
  biological_scale: TISSUE
  description: >-
    The lesion that defines the disease is fluid accumulating within the myelin
    sheath itself. In the knockout mouse the white matter of brain and spinal
    cord developed widespread vacuolation that progressed with age, with
    fluid-filled spaces appearing between myelin sheaths of the central but not
    the peripheral nervous system. The peripheral sparing is diagnostically
    important and is not incidental: it says the lesion tracks the panglial
    syncytium, which is a CNS structure, rather than myelin as such.

    Naming this correctly matters clinically. This is oedema, not demyelination
    and not hypomyelination: the myelin is present and the water is between its
    lamellae. That is why the MRI shows restricted diffusion rather than the
    free-water signal of myelin loss, why the disease is compatible with
    decades of near-normal function, and why the imaging can look far worse
    than the patient.

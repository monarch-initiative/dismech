- name: Impaired Conduction in Affected White Matter Tracts
  biological_scale: TISSUE
  description: >-
    Fluid between myelin lamellae degrades saltatory conduction without
    destroying the axon. The direct measurement comes from the mouse, where
    despite widespread vacuolation the neurological deficits were mild and
    included a decreased conduction velocity in neurons of the central auditory
    pathway. That single observation is the mechanistic bridge from the imaging
    lesion to the clinical picture, and it also explains the shape of the
    clinical picture: slowed conduction in the affected tracts, not axonal
    loss, which is why the deficits are mild, why they are dominated by the
    tracts that happen to be involved, and why hearing loss and tinnitus appear
    in a disorder that does not otherwise look otological. Human tractography
    in one patient found reduced fibre number and increased radial diffusivity
    with unchanged axial diffusivity - the profile expected from a myelin-water
    lesion sparing axons.

- name: Tract-Selective White Matter Involvement
  biological_scale: TISSUE
  description: >-
    The oedema is not distributed at random. In adults it is confined to the
    posterior limbs of the internal capsules, the midbrain cerebral peduncles
    and the middle cerebellar peduncles; in children it involves the cerebral
    white matter more diffusely as well. The 2024 series found this pattern in
    all twelve patients and the Japanese series used it as the screening
    criterion, so it is the most reproducible feature of the disease. Why these
    particular tracts is unresolved and is filed as a knowledge gap below; the
    honest statement is that the selectivity is an empirical fact without a
    mechanistic explanation, and that no property of the panglial syncytium has
    been shown to differ in these tracts.

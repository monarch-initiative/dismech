- name: Failure of Glial Chloride and Extracellular Ion Homeostasis
  biological_scale: CELLULAR
  description: >-
    With the dominant resting chloride conductance of the glial network
    removed, the syncytium can no longer buffer the ion and water fluxes that
    accompany neuronal activity. The founding study framed the disorder in
    exactly these terms - it belongs to an emerging group of disorders
    affecting brain ion and water homoeostasis - and the mouse work reaches the
    same conclusion from the other direction, attributing the pathology of
    Clcn2 disruption to disturbed extracellular ion homeostasis. Chloride is
    the primary carrier, but the consequence is not chloride-specific: glial
    potassium clearance during high neuronal activity requires an accompanying
    anion flux, and water follows osmotically, so a chloride conductance defect
    presents as a volume and water problem. The channel's own modulation by
    cell swelling closes that loop, making ClC-2 both an effector and a sensor
    of glial volume.

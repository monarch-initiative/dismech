- name: Mild Cerebellar and Pyramidal Syndrome
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint of the white matter arm. Involvement of the middle
    cerebellar peduncles produces cerebellar signs - action tremor, gait
    instability, later frank ataxia and dysarthria; involvement of the
    posterior limbs of the internal capsules, which carry the corticospinal
    tract, produces pyramidal signs and spasticity. The syndrome is
    characteristically mild and non-progressive enough that affected
    individuals remain ambulatory and do not require support for walking, but
    the 2024 series established that this is a central tendency rather than a
    rule: severe spastic paraplegia and developmental delay are within the
    spectrum. Cognitive impairment, when present, is typically mild and only
    rarely severe.

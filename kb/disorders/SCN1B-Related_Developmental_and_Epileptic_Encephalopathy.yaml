genetic:
- name: SCN1B
  association: Biallelic pathogenic variants
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    SCN1B encodes the beta-1 and beta-1B non-pore-forming subunits of the
    voltage-gated sodium channel. Reported DEE52 variants are missense and cluster
    in the extracellular immunoglobulin loop domain: c.136C>T p.R46C, c.178C>T
    p.R60C, c.472G>A p.V158M, p.R85C, c.265C>T p.R89C, and p.R125C. Dosage matters:
    monoallelic variants cause the milder GEFS+ spectrum and cardiac disorders
    including Brugada syndrome and atrial fibrillation, while biallelic variants
    cause this encephalopathy. Expressivity varies even within a sibship - two
    siblings homozygous for p.R89C had similar epilepsy but the younger still had
    normal development.
  gene_term:
    preferred_term: SCN1B
    term:
      id: hgnc:10586
      label: SCN1B
  evidence:
  - reference: PMID:33901312
    reference_title: "Homozygous SCN1B variants causing early infantile epileptic encephalopathy 52 affect voltage-gated sodium channel function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified nine patients from four unrelated families harboring three biallelic variants in SCN1B"
    explanation: >-
      Reports the specific causal variants in the largest cohort.
  - reference: PMID:33901312
    reference_title: "Homozygous SCN1B variants causing early infantile epileptic encephalopathy 52 affect voltage-gated sodium channel function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In humans, inherited heterozygous SCN1B variants have been associated with mild-to-moderate epileptic disorders within the genetic epilepsy with febrile seizures plus (GEFS+) spectrum."
    explanation: >-
      Establishes the dosage-dependent phenotypic distinction.
  - reference: PMID:31465153
    reference_title: "Developmental and epileptic encephalopathy in two siblings with a novel, homozygous missense variant in SCN1B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her 4-year-old brother had a similar epilepsy phenotype, but still displays normal development."
    explanation: >-
      Documents intrafamilial variability in developmental outcome.


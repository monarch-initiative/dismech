    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a rare, severe developmental and epileptic encephalopathy featuring infantile onset refractory seizures followed by developmental stagnation or regression"
    explanation: >-
      Confirms refractoriness and the associated developmental course.
  downstream:
  - target: Developmental Stagnation and Regression
    causal_link_type: DIRECT

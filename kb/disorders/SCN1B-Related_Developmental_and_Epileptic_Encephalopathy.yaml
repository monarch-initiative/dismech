  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Seizure Generation and Epileptogenesis"
  description: >-
    Seizures begin in the first months of life as multifocal myoclonus and evolve to
    focal, myoclonic, and generalized tonic-clonic seizures with myoclonic status

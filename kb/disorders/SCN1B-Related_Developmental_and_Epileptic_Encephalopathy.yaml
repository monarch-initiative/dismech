name: SCN1B-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
synonyms:
- DEE52
- EIEE52
- early infantile epileptic encephalopathy 52
- SCN1B-linked developmental and epileptic encephalopathy
- developmental and epileptic encephalopathy 52
description: >-
  SCN1B-related developmental and epileptic encephalopathy (DEE52) is a severe
  autosomal recessive epilepsy caused by biallelic variants in SCN1B, which encodes
  the beta-1 and beta-1B subunits of the voltage-gated sodium channel. Beta-1 does
  not form a pore. It is a single-transmembrane immunoglobulin-domain protein that
  modulates the gating of pore-forming alpha subunits (Nav1.1, Nav1.2, Nav1.6 in
  brain, Nav1.5 in heart), chaperones them to the membrane, and separately acts as
  a cell adhesion molecule. Losing it therefore does not remove a current; it
  detunes several currents at once, in a cell-type-specific way. Affected children
  present in the first months of life with fever-triggered focal, myoclonic, and
  generalized seizures and myoclonic status epilepticus, followed by developmental
  stagnation or regression, with hypotonia, spasticity, ataxia, and in some cases
  sensorineural hearing loss. Because SCN1B is expressed in heart as well as brain,
  DEE52 carries a cardiac arrhythmia substrate alongside the seizures, and the risk
  of sudden unexpected death in epilepsy is high. Monoallelic SCN1B variants cause
  the much milder GEFS+ spectrum and cardiac disorders such as Brugada syndrome and
  atrial fibrillation; this entry covers the biallelic encephalopathy.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 52
  term:
    id: MONDO:0033361
    label: developmental and epileptic encephalopathy, 52
parents:
- Neurodevelopmental Disorder
- Genetic Disease

inheritance:
- name: Autosomal recessive
  description: >-
    DEE52 requires two pathogenic SCN1B alleles, usually homozygous in consanguineous
    families. Heterozygous carriers are unaffected by the encephalopathy - one
    functional allele suffices for normal control of excitability - although
    monoallelic variants are separately linked to the milder GEFS+ spectrum.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:33901312
    reference_title: "Homozygous SCN1B variants causing early infantile epileptic encephalopathy 52 affect voltage-gated sodium channel function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, biallelic variants cause early infantile epileptic encephalopathy 52"
    explanation: >-
      States the biallelic requirement and its contrast with monoallelic disease.
  - reference: PMID:19710327
    reference_title: "A functional null mutation of SCN1B in a patient with Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the seizure susceptibility of Scn1b(+/-) mice was similar to wild type, suggesting that, like the parents of this patient, one functional SCN1B allele is sufficient for normal control of electrical excitability"
    explanation: >-
      Explains why heterozygous carriers are unaffected.

pathophysiology:
- name: Biallelic SCN1B Loss-of-Function Variant
  biological_scale: MOLECULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  description: >-
    Two pathogenic SCN1B alleles are present, typically homozygous missense variants
    clustered in the extracellular immunoglobulin loop domain (p.R46C, p.R60C,
    p.R85C, p.R89C, p.V158M, p.R125C). This node records the genomic lesion; the
    several distinct protein-level consequences are modeled downstream.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:33901312
    reference_title: "Homozygous SCN1B variants causing early infantile epileptic encephalopathy 52 affect voltage-gated sodium channel function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified nine patients from four unrelated families harboring three biallelic variants in SCN1B"
    explanation: >-
      Establishes the biallelic genotype in the largest reported cohort.
  - reference: PMID:31465153
    reference_title: "Developmental and epileptic encephalopathy in two siblings with a novel, homozygous missense variant in SCN1B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the vicinity of other epileptic encephalopathy-associated missense variants that are biallelic and located in the extracellular immunoglobulin loop domain of the protein"
    explanation: >-
      Locates the pathogenic variants in the immunoglobulin loop domain.
  downstream:
  - target: Loss of Beta-1 Subunit Cell-Surface Expression
    causal_link_type: DIRECT
    description: >-
      Some variants, such as p.R125C, prevent the subunit from reaching the membrane.
  - target: Loss of Beta-1-Mediated Modulation of Sodium Channel Gating
    causal_link_type: DIRECT
    description: >-
      Other variants reach the surface normally but fail to modulate the alpha subunit.
  - target: Disrupted Beta-1 Immunoglobulin-Domain Cell Adhesion
    causal_link_type: DIRECT
    description: >-
      Variants in the immunoglobulin loop compromise the adhesion function, which is
      independent of channel gating.

- name: Loss of Beta-1 Subunit Cell-Surface Expression
  biological_scale: MOLECULAR
  description: >-
    Trafficking-defective variants are expressed at normal total cellular levels but
    fail to reach the plasma membrane, producing a functional null. This is a
    trafficking failure and is separable from whether a surface-resident subunit
    works.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:19710327
    reference_title: "A functional null mutation of SCN1B in a patient with Dravet syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical characterization of p.R125C in a heterologous system demonstrated little to no cell surface expression despite normal total cellular expression."
    explanation: >-
      Documents the trafficking defect with preserved total expression.
  downstream:
  - target: Loss of Beta-1-Mediated Modulation of Sodium Channel Gating
    causal_link_type: DIRECT
    description: >-
      A subunit absent from the membrane cannot modulate the alpha subunit there.

- name: Loss of Beta-1-Mediated Modulation of Sodium Channel Gating
  biological_scale: MOLECULAR
  description: >-
    The alpha subunit no longer receives normal beta-1 modulation. Critically, this
    happens even for variants whose surface expression is indistinguishable from
    wild type, which is why it is a separate claim from the trafficking node.
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31709768
    reference_title: "SCN1B-linked early infantile developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "showed cell surface expression of the mutant beta1 subunit, similar to wild-type (WT), but with loss of normal beta1-mediated modification of human Nav 1.1-generated sodium current"
    explanation: >-
      Demonstrates loss of modulation with intact surface expression, separating this
      node from the trafficking node.
  downstream:
  - target: Altered Sodium Channel Voltage Dependence and Availability
    causal_link_type: DIRECT
    description: >-
      Unmodulated alpha subunits gate at shifted voltages.

- name: Altered Sodium Channel Voltage Dependence and Availability
  biological_scale: MOLECULAR
  description: >-
    Conductance-voltage relationships and channel availability shift toward more
    depolarized potentials across Nav1.1, Nav1.2, and Nav1.6, and recovery from fast
    inactivation slows for some variant-channel pairings. The effect is
    variant-specific and channel-subtype-specific rather than uniform.
  biological_processes:
  - preferred_term: sodium ion transmembrane transport
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33901312
    reference_title: "Homozygous SCN1B variants causing early infantile epileptic encephalopathy 52 affect voltage-gated sodium channel function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed a shift toward more depolarizing potentials of conductance-voltage relationships"
    explanation: >-
      Reports the depolarizing shift in the conductance-voltage relationship.
  - reference: PMID:33901312
    reference_title: "Homozygous SCN1B variants causing early infantile epileptic encephalopathy 52 affect voltage-gated sodium channel function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "and detected a slower recovery from fast inactivation for NaV 1.1/beta1V158M"
    explanation: >-
      Documents the variant-specific slowing of recovery from fast inactivation.
  downstream:
  - target: Increased Forebrain Pyramidal Neuron Firing
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered channel gating changes the intrinsic excitability of specific
      forebrain pyramidal populations.
  - target: Reduced Purkinje Cell Transient and Resurgent Sodium Current
    causal_link_type: DIRECT
    description: >-
      In cerebellar Purkinje cells the same loss of modulation reduces sodium current
      density.
  - target: Cardiomyocyte Ionic Current Remodeling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cardiac cells express SCN1B and show their own current changes.

- name: Disrupted Beta-1 Immunoglobulin-Domain Cell Adhesion
  biological_scale: MOLECULAR
  description: >-
    Beta-1 is an immunoglobulin superfamily cell adhesion molecule that binds beta-1
    subunits on neighbouring cells, other adhesion molecules, and extracellular
    matrix. Pathogenic variants cluster in exactly this domain, so the adhesion role
    is compromised alongside the gating role. Nothing about channel biophysics
    measures this arm.
  biological_processes:
  - preferred_term: cell adhesion
    term:
      id: GO:0007155
      label: cell adhesion
    modifier: ABNORMAL
  evidence:
  - reference: PMID:40923316
    reference_title: "Ataxia and cerebellar hypoexcitability in a mouse model of SCN1B-linked Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Non-pore-forming beta1 subunits function as channel modulators and chaperones to the plasma membrane as well as immunoglobulin superfamily cell adhesion molecules (CAMs) that interact with other beta1 subunits on adjacent cells, with other CAMs, or with extracellular matrix molecules"
    explanation: >-
      States the adhesion function as distinct from channel modulation.
  - reference: PMID:31465153
    reference_title: "Developmental and epileptic encephalopathy in two siblings with a novel, homozygous missense variant in SCN1B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "located in the extracellular immunoglobulin loop domain of the protein, which mediates interaction of the beta-1 subunit with cellular adhesion molecules"
    explanation: >-
      Places the pathogenic variants in the adhesion-mediating domain.
  downstream:
  - target: Altered Cerebellar Neuronal Pathfinding
    causal_link_type: DIRECT
    description: >-
      Loss of adhesion signalling disturbs the guidance of developing cerebellar
      neurons.
  - target: Reduced Subicular Pyramidal Dendritic Arborization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dendritic arbors are reduced in the mutant, plausibly through the
      adhesion/developmental arm rather than through channel gating.

- name: Altered Cerebellar Neuronal Pathfinding
  biological_scale: TISSUE
  description: >-
    Neuronal pathfinding in the cerebellum is severely altered in Scn1b-null mice, a
    developmental wiring defect distinct from the excitability changes measured in
    the same tissue.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: axon extension involved in axon guidance
    term:
      id: GO:0048846
      label: axon extension involved in axon guidance
    modifier: ABNORMAL
  evidence:
  - reference: PMID:40923316
    reference_title: "Ataxia and cerebellar hypoexcitability in a mouse model of SCN1B-linked Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In Scn1b null cerebellum, neuronal pathfinding is severely altered"
    explanation: >-
      Documents the cerebellar pathfinding defect.
  downstream:
  - target: Cerebellar Purkinje Cell and Interneuron Hypoexcitability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Miswired cerebellar circuitry accompanies the measured excitability changes,
      though the causal ordering between them is not established.

- name: Reduced Purkinje Cell Transient and Resurgent Sodium Current
  biological_scale: CELLULAR
  description: >-
    Scn1b-null Purkinje cells carry reduced transient and resurgent sodium current
    densities. Resurgent current is what allows Purkinje cells to fire at high rates,
    so this is a specific biophysical loss rather than a general reduction in
    excitability.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: sodium ion transmembrane transport
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:40923316
    reference_title: "Ataxia and cerebellar hypoexcitability in a mouse model of SCN1B-linked Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Scn1b null PCs have reduced transient and resurgent sodium current densities."
    explanation: >-
      Reports the specific sodium current deficit in Purkinje cells.
  downstream:
  - target: Cerebellar Purkinje Cell and Interneuron Hypoexcitability
    causal_link_type: DIRECT
    description: >-
      Reduced sodium current raises the action-potential threshold and limits
      repetitive firing.

- name: Cerebellar Purkinje Cell and Interneuron Hypoexcitability
  biological_scale: CELLULAR
  description: >-
    Purkinje cells and cerebellar interneurons show increased thresholds for action
    potential initiation and decreased repetitive firing frequency. Note the
    direction: in the cerebellum SCN1B loss makes neurons LESS excitable, which is
    the opposite of what happens in the forebrain pyramidal populations.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: membrane depolarization during action potential
    term:
      id: GO:0086010
      label: membrane depolarization during action potential
    modifier: DECREASED
  evidence:
  - reference: PMID:40923316
    reference_title: "Ataxia and cerebellar hypoexcitability in a mouse model of SCN1B-linked Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Scn1b null PCs and interneurons in cerebellar slices have increased thresholds for action potential initiation and decreased repetitive firing frequency compared with WT."
    explanation: >-
      Directly measures the cerebellar hypoexcitability.
  downstream:
  - target: Loss of Cerebellar Motor Output
    causal_link_type: DIRECT
    description: >-
      Reduced Purkinje firing degrades the cerebellar contribution to motor control.
  - target: Loss of Cerebellar Seizure-Terminating Output
    causal_link_type: DIRECT
    description: >-
      Cerebellar output to other brain regions can terminate seizures, so its loss
      is proposed to worsen seizure severity.

- name: Loss of Cerebellar Motor Output
  biological_scale: ORGANISM
  description: >-
    Degraded cerebellar output manifests as ataxia. This is the motor consequence,
    separate from the seizure consequence of the same hypoexcitability.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:40923316
    reference_title: "Ataxia and cerebellar hypoexcitability in a mouse model of SCN1B-linked Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We propose that reduced PC excitability underlies the ataxic phenotype of Scn1b mice."
    explanation: >-
      Attributes the ataxia to reduced Purkinje cell excitability.

- name: Loss of Cerebellar Seizure-Terminating Output
  biological_scale: TISSUE
  description: >-
    Cerebellar projections can act to terminate seizures. With Purkinje cells
    hypoexcitable, that brake is weakened, which is proposed to exacerbate seizure
    severity rather than to initiate seizures.
  evidence:
  - reference: PMID:40923316
    reference_title: "Ataxia and cerebellar hypoexcitability in a mouse model of SCN1B-linked Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "because cerebellar output to other areas of the brain can result in termination of seizures, we propose that PC hypoexcitability exacerbates the severe phenotype of this mouse model"
    explanation: >-
      States the proposed seizure-exacerbating role of cerebellar hypoexcitability.
  downstream:
  - target: Refractory Multifocal and Generalized Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A weakened seizure-terminating mechanism contributes to seizure severity.

- name: Increased Forebrain Pyramidal Neuron Firing
  biological_scale: CELLULAR
  description: >-
    Subicular and layer 2/3 pyramidal neurons fire action potentials at increased
    rates in an Scn1b mutant mouse, attributable to increased input resistance rather
    than to a change in sodium current density. The effect is regionally restricted -
    layer 5 and CA1 pyramidal neurons are unchanged.
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:
  - preferred_term: membrane depolarization during action potential
    term:
      id: GO:0086010
      label: membrane depolarization during action potential
    modifier: INCREASED
  evidence:
  - reference: PMID:24747835
    reference_title: "Reduced dendritic arborization and hyperexcitability of pyramidal neurons in a Scn1b-based model of Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Patch-clamp analysis showed that mutant subicular and layer 2/3 pyramidal neurons had increased action potential firing rates, presumably as a consequence of their increased input resistance."
    explanation: >-
      Reports the increased firing and its proposed input-resistance mechanism.
  - reference: PMID:24747835
    reference_title: "Reduced dendritic arborization and hyperexcitability of pyramidal neurons in a Scn1b-based model of Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These changes were not seen in L5 or CA1 pyramidal neurons."
    explanation: >-
      Establishes the regional restriction of the effect.
  downstream:
  - target: Regionally Restricted Network Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      Increased pyramidal firing in specific regions creates a localized
      hyperexcitable substrate.

- name: Reduced Subicular Pyramidal Dendritic Arborization
  biological_scale: CELLULAR
  description: >-
    Subicular pyramidal neurons have reduced dendritic arbors in the Scn1b mutant.
    A smaller arbor raises input resistance, which is the mechanism proposed for the
    firing change, so this structural finding is upstream of the functional one
    rather than a restatement of it.
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:
  - preferred_term: dendrite development
    term:
      id: GO:0016358
      label: dendrite development
    modifier: DECREASED
  evidence:
  - reference: PMID:24747835
    reference_title: "Reduced dendritic arborization and hyperexcitability of pyramidal neurons in a Scn1b-based model of Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Morphological analysis of subicular pyramidal neurons revealed reduced dendritic arborization."
    explanation: >-
      Reports the dendritic morphology change.
  downstream:
  - target: Increased Forebrain Pyramidal Neuron Firing
    causal_link_type: DIRECT
    description: >-
      Reduced arborization increases input resistance, the proposed proximate cause
      of the increased firing rate.

- name: Regionally Restricted Network Hyperexcitability
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Spontaneous synaptic activity is increased in the subiculum but not in CA1,
    supporting a regional rather than global seizure mechanism. This is a
    circuit-level property distinct from the single-cell firing measurements that
    support it.
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  evidence:
  - reference: PMID:24747835
    reference_title: "Reduced dendritic arborization and hyperexcitability of pyramidal neurons in a Scn1b-based model of Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This raised the concept of a regional seizure mechanism that was supported by data showing increased spontaneous synaptic activity in the subiculum but not CA1."
    explanation: >-
      Establishes the regional seizure mechanism at circuit level.
  downstream:
  - target: Refractory Multifocal and Generalized Seizures
    causal_link_type: DIRECT
    description: >-
      A regionally hyperexcitable substrate generates recurrent seizures.

- name: Hyperthermia-Sensitized Seizure Threshold
  biological_scale: ORGANISM
  description: >-
    Seizures are triggered by fever in patients and by induced hyperthermia in the
    mouse models. Temperature sensitivity is a distinct property of the substrate,
    not simply a consequence of how excitable it is at baseline.
  evidence:
  - reference: PMID:40763036
    reference_title: "Altered cardiac excitability and arrhythmia in models of SCN1B-linked developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "have spontaneous and hyperthermia-induced generalized seizures and SUDEP"
    explanation: >-
      Documents hyperthermia-induced seizures in the knock-in mouse.
  - reference: PMID:31709768
    reference_title: "SCN1B-linked early infantile developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "then focal seizures and myoclonic status epilepticus (SE) at 3 months, triggered by fever"
    explanation: >-
      Documents fever-triggered seizures in an affected child.
  downstream:
  - target: Refractory Multifocal and Generalized Seizures
    causal_link_type: DIRECT
    description: >-
      Fever repeatedly precipitates the clinical seizures.


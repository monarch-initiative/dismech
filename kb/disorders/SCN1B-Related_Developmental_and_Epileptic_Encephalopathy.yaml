- name: Cardiomyocyte Ionic Current Remodeling
  biological_scale: CELLULAR
  description: >-
    SCN1B is expressed in heart as well as brain. Cardiomyocytes carrying the DEE52
    variant show increased transient outward potassium current in mouse, and
    increased sodium current, late sodium current, and transient outward potassium
    current in patient-derived iPSC cardiomyocytes. Increased transient outward
    current is the change common to both species.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: ventricular cardiac muscle cell action potential
    term:
      id: GO:0086005
      label: ventricular cardiac muscle cell action potential
    modifier: ABNORMAL
  evidence:
  - reference: PMID:40763036
    reference_title: "Altered cardiac excitability and arrhythmia in models of SCN1B-linked developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient-derived iPSC-CMs with biallelic SCN1B-c.265C>T variant expression showed increased sodium current (INa), late INa, and Ito current densities."
    explanation: >-
      Measures the current changes in human patient-derived cardiomyocytes.
  - reference: PMID:40763036
    reference_title: "Altered cardiac excitability and arrhythmia in models of SCN1B-linked developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "while mouse and human cardiac AP waveforms have critical differences, increased Ito is common to both models of DEE52"
    explanation: >-
      Identifies the current change that is conserved across species.
  downstream:
  - target: Cardiac Arrhythmia Susceptibility
    causal_link_type: DIRECT
    description: >-
      Altered repolarizing and depolarizing currents form an electrical arrhythmia
      substrate.

- name: Ventricular Fibrosis
  biological_scale: TISSUE
  description: >-
    Heart sections from the DEE52 knock-in mouse reveal ventricular fibrosis - a
    structural substrate for arrhythmia that is separate from, and additional to, the
    ionic current changes.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:40763036
    reference_title: "Altered cardiac excitability and arrhythmia in models of SCN1B-linked developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "heart sections revealed ventricular fibrosis"
    explanation: >-
      Documents the structural cardiac change.
  downstream:
  - target: Cardiac Arrhythmia Susceptibility
    causal_link_type: DIRECT
    description: >-
      Fibrosis provides a structural substrate for reentrant arrhythmia.

- name: Cardiac Arrhythmia Susceptibility
  biological_scale: ORGANISM
  description: >-
    The combined electrical and structural substrates make the heart susceptible to

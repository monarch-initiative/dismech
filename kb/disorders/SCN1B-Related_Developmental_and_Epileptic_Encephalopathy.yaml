animal_models:
- name: Scn1b-null mouse
  species: Mouse
  genotype: Scn1b homozygous null
  publication: PMID:40923316
  description: >-
    Constitutive Scn1b knockout mice have spontaneous generalized seizures from the
    second postnatal week, are ataxic, show severely altered cerebellar neuronal
    pathfinding, and die of SUDEP in 100% of cases before weaning.
  modeled_mechanisms:
  - target: Cerebellar Purkinje Cell and Interneuron Hypoexcitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Provides the direct electrophysiological evidence for the cerebellar arm.
    limitations: >-
      A constitutive null is a more complete lesion than the missense variants that
      cause human DEE52, and 100% pre-weaning SUDEP is far more severe than the human
      course, in which children survive for years.
    readouts:
    - name: Purkinje cell action potential threshold and repetitive firing frequency
      target: Cerebellar Purkinje Cell and Interneuron Hypoexcitability
      direction: DECREASED
      interpretation: >-
        Purkinje cells and interneurons are less excitable, not more.
      evidence:
      - reference: PMID:40923316
        reference_title: "Ataxia and cerebellar hypoexcitability in a mouse model of SCN1B-linked Dravet syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Scn1b null PCs and interneurons in cerebellar slices have increased thresholds for action potential initiation and decreased repetitive firing frequency compared with WT."
        explanation: >-
          Reports the slice electrophysiology behind this readout.
    evidence:
    - reference: PMID:40923316
      reference_title: "Ataxia and cerebellar hypoexcitability in a mouse model of SCN1B-linked Dravet syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Scn1b null mice model DS, with spontaneous generalized seizures that start in the second week of life."
      explanation: >-
        Establishes the model's seizure phenotype.
  - target: Loss of Cerebellar Motor Output
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mice are ataxic, matching the ataxia reported in patients.
    limitations: >-
      Mouse gait analysis and human ataxia are assessed differently, and the human
      ataxia is reported clinically without the electrophysiological attribution the
      mouse provides.
    evidence:
    - reference: PMID:40923316
      reference_title: "Ataxia and cerebellar hypoexcitability in a mouse model of SCN1B-linked Dravet syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we show that Scn1b null mice are ataxic."
      explanation: >-
        Establishes the ataxic phenotype.
- name: Scn1b-c.265C>T (p.R89C) knock-in mouse
  species: Mouse
  genotype: Scn1b c.265C>T homozygous knock-in (p.R89C)
  publication: PMID:40763036
  description: >-
    Knock-in mice carrying the human DEE52 p.R89C variant have spontaneous and
    hyperthermia-induced generalized seizures with SUDEP, increased cardiomyocyte
    transient outward potassium current, ventricular fibrosis, and susceptibility to
    pacing-induced arrhythmia.
  modeled_mechanisms:
  - target: Cardiomyocyte Ionic Current Remodeling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Carries the exact human variant, and the increased transient outward current it
      shows is reproduced in patient-derived iPSC cardiomyocytes.
    limitations: >-
      Mouse and human cardiac action potential waveforms differ critically - the
      mouse repolarizes largely through the transient outward current - so only the
      shared increase in that current can be carried across; the increased sodium and
      late sodium currents seen in human iPSC cardiomyocytes were not the mouse finding.
    readouts:
    - name: Transient outward potassium current density in cardiomyocytes
      target: Cardiomyocyte Ionic Current Remodeling
      direction: INCREASED
      interpretation: >-
        Repolarizing current is increased, altering the action potential waveform.
      evidence:
      - reference: PMID:40763036
        reference_title: "Altered cardiac excitability and arrhythmia in models of SCN1B-linked developmental and epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Scn1bC89/C89 mouse CMs showed increased transient outward potassium current (Ito) density and heart sections revealed ventricular fibrosis."
        explanation: >-
          Reports the current measurement behind this readout.
    evidence:
    - reference: PMID:40763036
      reference_title: "Altered cardiac excitability and arrhythmia in models of SCN1B-linked developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice with homozygous expression of the DEE52 variant Scn1b-c.265C>T, predicting p.R89C, have spontaneous and hyperthermia-induced generalized seizures and SUDEP."
      explanation: >-
        Establishes that the model reproduces the human seizure and SUDEP phenotype.
- name: Scn1b-based Dravet model mouse (subicular hyperexcitability)
  species: Mouse
  genotype: Scn1b mutant based on a human beta-1 subunit mutation
  publication: PMID:24747835
  description: >-
    A mouse model based on a human SCN1B mutation, showing region-restricted
    pyramidal neuron hyperexcitability with reduced dendritic arborization and,
    notably, no change in GABAergic interneuron firing or synaptic properties.
    Retigabine, which lowers input resistance, protected against thermal seizures.
  modeled_mechanisms:
  - target: Increased Forebrain Pyramidal Neuron Firing
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Provides the direct evidence for the regionally restricted pyramidal
      hyperexcitability arm and for its input-resistance mechanism.
    limitations: >-
      The mechanism is inferred from slice recordings in a mouse carrying one
      human-derived mutation and has not been confirmed in human neurons; regional
      restriction to subiculum and layer 2/3 may not map onto human cortical anatomy.
    readouts:
    - name: Action potential firing rate in subicular and layer 2/3 pyramidal neurons
      target: Increased Forebrain Pyramidal Neuron Firing
      direction: INCREASED
      interpretation: >-
        Pyramidal neurons in specific regions fire more, attributed to raised input
        resistance rather than altered sodium current density.
      evidence:
      - reference: PMID:24747835
        reference_title: "Reduced dendritic arborization and hyperexcitability of pyramidal neurons in a Scn1b-based model of Dravet syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "mutant subicular and layer 2/3 pyramidal neurons had increased action potential firing rates, presumably as a consequence of their increased input resistance"
        explanation: >-
          Reports the patch-clamp measurement behind this readout.
    evidence:
    - reference: PMID:24747835
      reference_title: "Reduced dendritic arborization and hyperexcitability of pyramidal neurons in a Scn1b-based model of Dravet syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous mutant mice shared phenotypic features and pharmaco-sensitivity with Dravet syndrome."
      explanation: >-
        Establishes the model's phenotypic and pharmacological validity.

experimental_models:
- name: Patient-derived iPSC cardiomyocytes (SCN1B c.265C>T)
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cell cardiomyocytes derived from two DEE52 patients
    homozygous for SCN1B c.265C>T, used to test the cardiac arm directly in human
    cells.
  publication: PMID:40763036
  modeled_mechanisms:
  - target: Cardiomyocyte Ionic Current Remodeling
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The only human-cell measurement of the cardiac electrophysiological consequence
      of the DEE52 genotype.
    limitations: >-
      iPSC cardiomyocytes are electrophysiologically immature relative to adult
      ventricular myocytes, so absolute current densities should not be read as adult
      human values; and the cells cannot report the structural fibrosis arm.
    readouts:
    - name: Sodium, late sodium, and transient outward potassium current densities
      target: Cardiomyocyte Ionic Current Remodeling
      direction: INCREASED
      interpretation: >-
        Multiple currents are increased in patient-derived human cardiomyocytes.
      evidence:
      - reference: PMID:40763036
        reference_title: "Altered cardiac excitability and arrhythmia in models of SCN1B-linked developmental and epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Patient-derived iPSC-CMs with biallelic SCN1B-c.265C>T variant expression showed increased sodium current (INa), late INa, and Ito current densities."
        explanation: >-
          Reports the current measurements behind this readout.
    evidence:
    - reference: PMID:40763036
      reference_title: "Altered cardiac excitability and arrhythmia in models of SCN1B-linked developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "studied induced pluripotent stem cell cardiomyocytes (iPSC-CMs) derived from 2 SCN1B-c.265C>T DEE52 patients"

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare. Nine patients from four unrelated consanguineous families in the
    largest single report, with a handful of additional families described
    elsewhere. No formal population prevalence figure has been published.
  evidence:
  - reference: PMID:33901312
    reference_title: "Homozygous SCN1B variants causing early infantile epileptic encephalopathy 52 affect voltage-gated sodium channel function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only a few individuals with EIEE52 have been reported so far, and a disease-causing mechanism remains unclear."
    explanation: >-
      States the small size of the published cohort, which is what supports an
      ultra-rare class rather than a numeric rate.

discussions:
- discussion_id: controversy_interneuron_versus_pyramidal_substrate
  prompt: >-
    Does SCN1B-related DEE arise through the same GABAergic interneuron
    hypoexcitability that underlies SCN1A-related Dravet syndrome, or through a
    fundamentally different substrate of regionally restricted pyramidal neuron
    hyperexcitability driven by increased input resistance?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Increased Forebrain Pyramidal Neuron Firing
  - pathophysiology#Regionally Restricted Network Hyperexcitability
  - pathophysiology#Cerebellar Purkinje Cell and Interneuron Hypoexcitability
  rationale: >-
    Because SCN1B and SCN1A variants produce overlapping clinical pictures, it is
    routinely assumed that SCN1B disease works through the SCN1A mechanism - beta-1
    loss detunes Nav1.1, Nav1.1 loss impairs interneurons, interneuron failure
    disinhibits the cortex. The Scn1b mouse contradicts the middle step directly: no
    changes in firing or synaptic properties of GABAergic interneurons were observed,
    explicitly in contrast with Scn1a-based models, and the hyperexcitability was
    instead in subicular and layer 2/3 pyramidal neurons via increased input
    resistance from reduced dendritic arborization. The cerebellar work complicates
    this further rather than settling it, since there GABAergic neurons ARE
    hypoexcitable - so cell-type effects appear to be region-dependent rather than
    uniform. This matters therapeutically: the input-resistance account predicts
    benefit from a potassium channel opener, and retigabine did protect these mice
    from thermal seizures, which is not a prediction the interneuron model makes.
  evidence:
  - reference: PMID:24747835
    reference_title: "Reduced dendritic arborization and hyperexcitability of pyramidal neurons in a Scn1b-based model of Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, no changes in firing or synaptic properties of gamma-aminobutyric acidergic interneurons from mutant mice were observed, which is in contrast with Scn1a-based models of Dravet syndrome."
    explanation: >-
      The direct contradiction of the interneuron account in the SCN1B model.
  - reference: PMID:24747835
    reference_title: "Reduced dendritic arborization and hyperexcitability of pyramidal neurons in a Scn1b-based model of Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results suggest a novel mechanism of disease genesis in genetic epilepsy and demonstrate an effective mechanism-based treatment of the disease."
    explanation: >-
      The authors present this as a distinct disease mechanism with its own
      therapeutic prediction.
  - reference: PMID:40923316
    reference_title: "Ataxia and cerebellar hypoexcitability in a mouse model of SCN1B-linked Dravet syndrome."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "GABAergic neurons in the Scn1b null cerebellar cortex are overall hypoexcitable"
    explanation: >-
      Shows GABAergic hypoexcitability does occur in SCN1B disease, but in cerebellum
      rather than forebrain, so cell-type effects are region-dependent.
  proposed_experiments:
  - experiment_id: exp_celltype_conditional_scn1b_deletion
    name: Interneuron-restricted versus pyramidal-restricted Scn1b deletion
    description: >-
      Compare conditional Scn1b deletion restricted to forebrain GABAergic
      interneurons against deletion restricted to excitatory pyramidal neurons,
      scoring spontaneous seizure burden, thermal seizure threshold, and input
      resistance in each population, to establish which cell type is sufficient to
      produce the epilepsy phenotype.

- discussion_id: gap_cardiac_arrhythmia_in_patients
  prompt: >-
    Do children with SCN1B-related DEE actually experience clinically detectable
    cardiac arrhythmia, and would cardiac surveillance or antiarrhythmic management
    reduce SUDEP in this population?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiac Arrhythmia Susceptibility
  - pathophysiology#Elevated Risk of Sudden Unexpected Death in Epilepsy
  rationale: >-
    The dual neuro-cardiac SUDEP hypothesis is well supported at the level of
    substrate: the knock-in mouse has ventricular fibrosis and pacing-inducible
    arrhythmia, and patient-derived cardiomyocytes show increased currents. What is
    missing is the clinical link. No published series reports Holter monitoring,
    ECG surveillance, or documented arrhythmia in SCN1B-DEE52 patients, so the step
    from "arrhythmogenic substrate exists" to "arrhythmia contributes to these
    children's deaths" is inference. It is actionable inference - if borne out it
    would justify cardiac surveillance in a population currently managed purely as
    neurological - which is exactly why it should not be curated as though settled.
  evidence:
  - reference: PMID:40763036
    reference_title: "Altered cardiac excitability and arrhythmia in models of SCN1B-linked developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although the mechanisms of SUDEP remain unclear, we hypothesize that, in addition to seizures, SUDEP in some instances involves cardiac arrhythmias"
    explanation: >-
      The authors state the cardiac contribution as a hypothesis rather than an
      established fact.
  - reference: PMID:40763036
    reference_title: "Altered cardiac excitability and arrhythmia in models of SCN1B-linked developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No biomarkers exist to predict the extent of SUDEP risk in individual patients other than the presence of variants in specific genes"
    explanation: >-
      Confirms the absence of any validated clinical risk marker, which is the gap.
  proposed_experiments:
  - experiment_id: exp_cardiac_surveillance_cohort_dee52
    name: Prospective cardiac surveillance in an SCN1B-DEE52 cohort
    description: >-
      Enrol genetically confirmed DEE52 patients in prospective ECG and ambulatory
      rhythm monitoring, with repolarization interval measurement and event
      correlation, to establish whether the model-predicted arrhythmia substrate
      produces detectable clinical events.

- discussion_id: mismatch_null_mouse_versus_human_missense
  prompt: >-
    How much of the Scn1b-null mouse phenotype - 100% pre-weaning SUDEP, severe
    cerebellar pathfinding failure - reflects human DEE52, given that every reported
    human genotype is missense and affected children survive for years?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Cerebellar Neuronal Pathfinding
  - pathophysiology#Cerebellar Purkinje Cell and Interneuron Hypoexcitability
  rationale: >-
    Most of the mechanistic detail curated here for the cerebellar arm comes from the
    constitutive null. But the human variants are missense changes in the
    immunoglobulin loop, and at least one of them - p.R85C - reaches the cell surface
    normally, so it is not a null at the level of protein presence. The p.R125C
    variant is a functional null and the p.R89C knock-in is not, yet both cause DEE52,
    which suggests the human phenotype is reached from more than one point on the
    dose-response curve. The severe developmental pathfinding failure seen in the null
    cerebellum may therefore over-represent what a surface-expressed missense variant
    does, and no human neuropathology exists to check it against.
  evidence:
  - reference: PMID:40923316
    reference_title: "Ataxia and cerebellar hypoexcitability in a mouse model of SCN1B-linked Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Scn1b null mice model DEE52, with generalized seizures beginning in the second week of life and sudden unexpected death in epilepsy (SUDEP) in 100% of mice prior to weaning"
    explanation: >-
      Establishes the severity of the null phenotype against which human survival
      must be compared.
  - reference: PMID:31709768
    reference_title: "SCN1B-linked early infantile developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "showed cell surface expression of the mutant beta1 subunit, similar to wild-type (WT)"
    explanation: >-
      Shows a human pathogenic variant that is not a protein null, unlike the mouse
      model.
  - reference: PMID:19710327
    reference_title: "A functional null mutation of SCN1B in a patient with Dravet syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these data suggest a functional SCN1B null phenotype"
    explanation: >-
      Shows that another human variant IS a functional null, so human genotypes span
      the range rather than sitting at one point.
  proposed_experiments:
  - experiment_id: exp_knockin_allelic_series_cerebellum
    name: Cerebellar phenotype across an Scn1b knock-in allelic series
    description: >-
      Compare cerebellar pathfinding, Purkinje cell sodium currents, and ataxia across
      knock-in mice carrying surface-expressed missense variants (p.R85C, p.R89C), the
      trafficking-null p.R125C, and the constitutive null, to establish how much of
      the developmental cerebellar phenotype requires complete absence of the protein.

- discussion_id: gap_hearing_loss_mechanism
  prompt: >-
    By what mechanism does biallelic SCN1B loss produce sensorineural hearing loss -
    through beta-1's channel-modulating role in brainstem auditory pathway neurons,
    through its cell adhesion role in cochlear or auditory nerve development, or as a
    consequence of the encephalopathy itself?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Beta-1 Immunoglobulin-Domain Cell Adhesion
  rationale: >-
    Bilateral sensorineural hearing loss with brainstem auditory pathway involvement
    is reported, but no node in this pathograph explains it, and nothing in the mouse
    literature addresses the auditory system. The two candidate arms - channel
    modulation and cell adhesion - predict different things: an adhesion-mediated
    developmental defect would be fixed and present from birth, whereas an
    excitability defect in auditory brainstem neurons might be modifiable. Because
    hearing loss in a child with no expressive development is easy to miss and
    consequential for the little communication that remains possible, whether it is
    an expected feature worth screening for is a practical question, not only a
    mechanistic one.
  evidence:
  - reference: PMID:31709768
    reference_title: "SCN1B-linked early infantile developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Auditory brainstem response (ABR) showed bilateral hearing loss."
    explanation: >-
      Documents the phenotype that currently has no mechanistic account.
  - reference: PMID:40923316
    reference_title: "Ataxia and cerebellar hypoexcitability in a mouse model of SCN1B-linked Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Non-pore-forming beta1 subunits function as channel modulators and chaperones to the plasma membrane as well as immunoglobulin superfamily cell adhesion molecules (CAMs)"
    explanation: >-
      Names the two candidate functional arms that could account for the auditory
      phenotype.
  proposed_experiments:
  - experiment_id: exp_auditory_phenotyping_scn1b_mice
    name: Auditory brainstem response phenotyping in Scn1b mouse models
    description: >-
      Measure auditory brainstem responses and cochlear histology in Scn1b-null and
      knock-in mice, and in mice carrying a variant that selectively disrupts adhesion
      while preserving channel modulation, to determine which functional arm accounts
      for the hearing loss.

- discussion_id: gap_sodium_channel_blocker_avoidance
  prompt: >-
    Should sodium-channel-blocking anti-seizure medications be avoided in
    SCN1B-related DEE, as they are in SCN1A-related Dravet syndrome, or does the
    beta-1 subunit mechanism change that calculus?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Sodium Channel Voltage Dependence and Availability
  - pathophysiology#Refractory Multifocal and Generalized Seizures
  rationale: >-
    In SCN1A-related Dravet syndrome sodium-channel blockers are avoided because
    they further impair Nav1.1 in interneurons that are already underactive. The
    same reasoning is often extended to SCN1B by analogy, and the analogy is
    plausible - both lesions reduce sodium-channel function. But the Scn1b mouse
    contradicts the interneuron premise the SCN1A rule rests on, showing no
    interneuron changes and instead pyramidal hyperexcitability driven by input
    resistance. If that is the operative mechanism, the SCN1A avoidance rule does not
    transfer, and the mechanism-matched prediction from the same study points the
    other way, toward agents that lower input resistance. The published evidence
    reports only that carbamazepine failed among several drugs, which is
    refractoriness rather than harm, so the question is genuinely open and is
    curated here rather than asserted as a contraindication in the treatments block.
  evidence:
  - reference: PMID:33901312
    reference_title: "Homozygous SCN1B variants causing early infantile epileptic encephalopathy 52 affect voltage-gated sodium channel function."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures were refractory to antiepileptic drugs (AEDs), including carbamazepine and clonazepam."
    explanation: >-
      The only published statement about carbamazepine here documents failure to
      control seizures, not aggravation, so it cannot support a contraindication.
  - reference: PMID:24747835
    reference_title: "Reduced dendritic arborization and hyperexcitability of pyramidal neurons in a Scn1b-based model of Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, no changes in firing or synaptic properties of gamma-aminobutyric acidergic interneurons from mutant mice were observed, which is in contrast with Scn1a-based models of Dravet syndrome."
    explanation: >-
      Undercuts the interneuron premise on which the SCN1A sodium-channel-blocker
      avoidance rule rests, which is why transfer of that rule cannot be assumed.
  - reference: PMID:24747835
    reference_title: "Reduced dendritic arborization and hyperexcitability of pyramidal neurons in a Scn1b-based model of Dravet syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The antiepileptic drug retigabine, a K+ channel opener that reduces input resistance, dampened action potential firing and protected mutant mice from thermal seizures."
    explanation: >-
      The mechanism-matched prediction from the same model, which is a different drug
      class from the one the SCN1A rule addresses.
  proposed_experiments:
  - experiment_id: exp_sodium_blocker_challenge_in_scn1b_models
    name: Sodium-channel-blocker challenge in Scn1b versus Scn1a models
    description: >-
      Compare seizure burden and thermal seizure threshold under carbamazepine or
      lacosamide in Scn1b knock-in mice against Scn1a-haploinsufficient mice, to test
      whether the aggravation seen in the SCN1A model occurs in the SCN1B model at
      all, and pair it with a retrospective review of medication exposure in
      genetically confirmed DEE52 patients.


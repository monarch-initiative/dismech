treatments:
- name: Bilateral pallidal deep brain stimulation
  description: >-
    Bilateral globus pallidus internus (GPi) deep brain stimulation for
    medically refractory VPS16-related dystonia. In a multicenter cohort of 26
    patients, about three-quarters responded, with greater motor improvement
    from stimulation of the ventroposterior GPi; spasticity and fixed skeletal
    deformities present before surgery predicted a poorer response.

name: VPS16-Related Dystonia
creation_date: "2026-11-06T19:00:00Z"
category: Mendelian
description: >-
  VPS16-related dystonia (dystonia 30, DYT30) is an autosomal dominant
  early-onset movement disorder caused by heterozygous loss-of-function variants
  or microdeletions in VPS16, which encodes a core subunit of the HOPS
  (homotypic fusion and vacuole protein sorting) endolysosomal tethering
  complex. Haploinsufficiency of VPS16 impairs autophagosome-lysosome fusion and
  causes lysosomal vacuolar abnormalities, leading to progressive generalized
  dystonia with a craniocaudal gradient (predominant cervical, oromandibular,
  bulbar, and upper-limb involvement) often accompanied by neuropsychiatric
  comorbidities or myoclonus.

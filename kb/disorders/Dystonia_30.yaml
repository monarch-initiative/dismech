treatments:
- name: Bilateral pallidal deep brain stimulation
  description: >-
    Bilateral globus pallidus internus (GPi) deep brain stimulation for
    medically refractory VPS16-related dystonia. In a multicenter cohort of 26
    patients, about three-quarters responded, with greater motor improvement
    from stimulation of the ventroposterior GPi; spasticity and fixed skeletal
    deformities present before surgery predicted a poorer response.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: bilateral GPi deep brain stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  target_mechanisms:
  - target: Generalized dystonia
    treatment_effect: MODULATES
    description: >-
      Pallidal stimulation modulates the dystonic motor network downstream of
      the VPS16/HOPS lysosomal defect; it improves the dystonic motor phenotype
      without correcting the underlying molecular lesion.
    evidence:
    - reference: PMID:40539388
      reference_title: "Deep Brain Stimulation for VPS16-Related Dystonia: A Multicenter Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Most patients (19/26, 73%) were considered responders."
      explanation: Pallidal DBS improved the dystonia phenotype in most patients in the cohort.

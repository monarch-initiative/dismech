genetic:
- name: VPS16
  gene_term:
    preferred_term: VPS16
    term:
      id: hgnc:14584
      label: VPS16
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    VPS16 (chromosome 20p13; a core subunit of the CORVET/HOPS endolysosomal
    tethering complexes) causes autosomal-dominant early-onset dystonia 30
    (DYT30, OMIM 619291) through heterozygous loss-of-function variants
    (nonsense, frameshift, splice, severe missense) and at least one
    microdeletion, acting by haploinsufficiency. Biallelic VPS16 variants
    separately cause an autosomal-recessive mucopolysaccharidosis-like
    neurodevelopmental syndrome, a distinct entity. DYT30 belongs to the
    HOPS-associated neurological disorders (HOPSANDs) alongside VPS41 and VPS11.
  evidence:
  - reference: PMID:32808683
    reference_title: "Loss-of-Function Variants in HOPS Complex Genes VPS16 and VPS41 Cause Early Onset Dystonia Associated with Lysosomal Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Analysis revealed a significant burden for VPS16 (Fisher's exact test p value, 6.9 × 109 )."
    explanation: Exome burden analysis establishes VPS16 as the causative dystonia gene.
notes: >-
  Dystonia 30 (DYT30, OMIM 619291; MONDO:0025691) is autosomal-dominant
  early-onset generalized dystonia caused by heterozygous loss-of-function
  variants in VPS16, a subunit of the HOPS endolysosomal tethering complex.
  Dystonia begins in childhood/adolescence with predominant cervical, bulbar,
  orofacial and upper-limb involvement and generalizes; a subset has additional
  neuropsychiatric/developmental comorbidities. The mechanism is impaired
  HOPS-mediated autophagosome/endosome-lysosome fusion with lysosomal
  dysfunction (vacuolar abnormalities in patient cells), placing DYT30 among the
  HOPS-associated neurological disorders (HOPSANDs, with VPS41 and VPS11).

  Distinct from, though allelic with, the autosomal-recessive biallelic-VPS16
  mucopolysaccharidosis-like neurodevelopmental syndrome. The founding report is
  Steel et al. 2020 (PMID:32808683, Ann Neurol), a weighted exome burden
  analysis of 138 individuals. The abstract establishes the gene, the
  loss-of-function mechanism, the dystonia distribution, and the lysosomal
  abnormality; it is cached abstract-only, so specific variant alleles are not
  exact-quote cited from it here. Bilateral pallidal deep brain stimulation
  outcomes are cited from the multicenter DYT-VPS16 cohort of Svorenova et al.
  2025 (PMID:40539388, Ann Neurol). No GeneReviews chapter covers VPS16-related
  dystonia.

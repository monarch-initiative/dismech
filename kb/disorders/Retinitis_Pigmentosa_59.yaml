animal_models:
- name: Rod-specific Dhdds knockout mouse
  species: Mus musculus
  genotype: Dhdds flx/flx; Rho-iCre75
  publication: PMID:32526701
  description: >-
    Conditional ablation of Dhdds in rods. Mild dysfunction at 4 weeks is
    followed by almost complete loss of rods and cones by 6 weeks despite
    preserved retinal protein N-glycosylation.
  genes:
  - preferred_term: DHDDS
    term:
      id: hgnc:20603
      label: DHDDS
  modeled_mechanisms:
  - target: Rod Photoreceptor Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      Complete rod-specific gene ablation rather than a patient hypomorphic
      allele; degeneration is far faster than in patients and cones are lost
      within weeks.
    evidence:
    - reference: PMID:32526701
      reference_title: "Retinal Degeneration Caused by Rod-Specific Dhdds Ablation Occurs without Concomitant Inhibition of Protein N-Glycosylation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        rapid photoreceptor degeneration ensued, resulting in almost complete
        loss of rods and cones by PN 6 weeks
      explanation: Photoreceptor degeneration after rod-specific ablation.
  - target: Impaired Photoreceptor Protein N-Glycosylation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: UNKNOWN
    limitations: >-
      Residual dolichol pools may sustain glycosylation until degeneration,
      so absence of hypoglycosylation in this model does not exclude a
      transient or protein-specific defect.
    evidence:
    - reference: PMID:32526701
      reference_title: "Retinal Degeneration Caused by Rod-Specific Dhdds Ablation Occurs without Concomitant Inhibition of Protein N-Glycosylation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Retina dolichol levels were markedly decreased by PN 4 weeks in
        Dhddsflx/flx iCre+ mice, relative to controls; despite this,
        N-glycosylation of retinal proteins, including opsin (the dominant
        rod-specific glycoprotein), persisted in Dhddsflx/flx iCre+ mice.
      explanation: Opsin glycosylation is preserved in the model.
- name: RPE-specific Dhdds knockout mouse
  species: Mus musculus
  genotype: Dhdds flx/flx; VMD2-Cre
  publication: PMID:32245241
  description: >-
    Conditional ablation of Dhdds in the retinal pigment epithelium, producing
    RPE atrophy, RPE transmigration and secondary photoreceptor loss with large
    scotopic ERG reductions by three months.
  genes:
  - preferred_term: DHDDS
    term:
      id: hgnc:20603
      label: DHDDS
  modeled_mechanisms:
  - target: Retinal Pigment Epithelium Dysfunction
    relationship: PERTURBS
    fidelity: UNKNOWN
    limitations: >-
      Tissue-restricted null allele; whether RPE is primarily affected by the
      patient hypomorphic alleles is not established.
    evidence:
    - reference: PMID:32245241
      reference_title: "Selective Ablation of Dehydrodolichyl Diphosphate Synthase in Murine Retinal Pigment Epithelium (RPE) Causes RPE Atrophy and Retinal Degeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results indicate that RPE dysfunction contributes to DHDDS
        mutation-mediated pathology and suggests a more complicated disease
        mechanism than simply disruption of glycosylation.
      explanation: RPE Dhdds loss drives retinal degeneration.
- name: Dhdds K42E knock-in mouse
  species: Mus musculus
  genotype: Dhdds K42E/K42E
  publication: PMID:32272552
  description: >-
    CRISPR knock-in of the human founder allele. No overt photoreceptor
    degeneration or N-glycosylation defect, but marked gliosis, shortened
    dolichols in retina, liver and brain, selective ERG b-wave loss, inner
    nuclear layer thinning and outer plexiform layer disruption.
  genes:
  - preferred_term: DHDDS
    term:
      id: hgnc:20603
      label: DHDDS
  modeled_mechanisms:
  - target: Dolichol Chain-Length Shortening
    relationship: RECAPITULATES
    fidelity: HIGH

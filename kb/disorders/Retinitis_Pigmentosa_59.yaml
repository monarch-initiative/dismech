biochemical:
- name: Increased plasma and urinary dolichol-18 to dolichol-19 ratio
  presence: Present in affected individuals; intermediate in carriers
  context: >-
    Plasma and urine, liquid chromatography-mass spectrometry. Dolichol-18
    replaces dolichol-19 as the dominant species; the D18/D19 ratio separates
    patients from carriers and carriers from non-carriers.
  evidence:
  - reference: PMID:24078709
    reference_title: "Aberrant dolichol chain lengths as biomarkers for retinitis pigmentosa caused by impaired dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Receiver operating characteristic (ROC) analysis shows that plasma and
      urinary D18/D19 ratios can unambiguously discriminate patients from
      carriers, and carriers from normal individuals.
    explanation: Diagnostic performance of the dolichol ratio.
- name: Serum transferrin glycosylation
  presence: Usually normal
  context: >-
    Serum or plasma transferrin isoelectric focusing. Normal in all members of
    the index exome family; one adult K42E homozygote with a multisystem
    phenotype had an elevated mono-oligo/di-oligo transferrin ratio.
  evidence:
  - reference: PMID:24664694
    reference_title: "Mutation K42E in dehydrodolichol diphosphate synthase (DHDDS) causes recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patterns of plasma transferrin isoelectric focusing gel were normal in
      all family members, indicating no significant abnormality in protein
      glycosylation.
    explanation: Normal transferrin glycosylation in K42E homozygotes.
diagnosis:
- name: DHDDS molecular genetic testing
  description: >-
    Diagnosis is confirmed by biallelic DHDDS variants on inherited retinal
    disease panel or exome sequencing. In patients of Ashkenazi Jewish
    ancestry, targeted testing for K42E together with the MAK Alu insertion
    explains about a third of recessive RP and can precede panel testing.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:25255364
    reference_title: "Two specific mutations are prevalent causes of recessive retinitis pigmentosa in North American patients of Jewish ancestry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, their screening constitutes an alternative procedure to
      large-scale tests for patients belonging to this ethnic group,
      especially in time-sensitive situations.
    explanation: Founder-allele screening strategy for Jewish-ancestry patients.
- name: Full-field electroretinography and retinal examination
  description: >-
    Full-field ERG documents rod and cone dysfunction, usually nondetectable
    responses by the time of referral; fundus examination shows the classic
    RP triad.
  diagnosis_term:
    preferred_term: Retinal Examination
    term:
      id: NCIT:C101217

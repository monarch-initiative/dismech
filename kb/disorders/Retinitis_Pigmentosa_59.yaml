discussions:
- discussion_id: rp59_nonsyndromic_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a partial loss of a ubiquitously required dolichol-synthesis
    enzyme cause disease confined to the retina in almost all patients?
  attaches_to:
  - pathophysiology#DHDDS Cis-Prenyltransferase Partial Loss of Function
  - pathophysiology#Systemic Protein Hypoglycosylation
  rationale: >-
    DHDDS is expressed in every tissue tested and dolichol chain shortening is
    measurable in blood, urine, liver and brain, yet systemic involvement has
    been reported only once. Candidate explanations include photoreceptor
    demand for dolichol in outer-segment membrane renewal, cell-type
    differences in residual activity, and genetic modifiers such as ALG6.
  evidence:
  - reference: PMID:21295282
    reference_title: "A missense mutation in DHDDS, encoding dehydrodolichyl diphosphate synthase, is associated with autosomal-recessive retinitis pigmentosa in Ashkenazi Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: RT-PCR analysis in 21 human tissues revealed ubiquitous expression of DHDDS.
    explanation: Ubiquitous expression contrasts with retina-restricted disease.
  - reference: PMID:36362109
    reference_title: "Vertebrate Animal Models of RP59: Current Status and Future Prospects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Finally, to date, none of the mouse models have shed light on the reason
      why RP59 is non-syndromic.
    explanation: The question is explicitly open.
- discussion_id: rp59_k42e_mouse_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the K42E knock-in mouse, which develops inner-retinal synaptic
    dysfunction without photoreceptor loss, model the human rod-cone
    degeneration, or is the photoreceptor phenotype species-specific?
  attaches_to:
  - pathophysiology#Rod Photoreceptor Degeneration
  - pathophysiology#Photoreceptor-to-Bipolar Cell Synaptic Transmission Defect
  - animal_models#Dhdds K42E knock-in mouse
  rationale: >-
    The patient allele in mice reproduces the dolichol shortening but not the
    defining photoreceptor degeneration, while the human disease is a
    rod-cone dystrophy with early macular involvement. Mice lack a macula,
    and a b-wave-selective defect has not been sought in early-stage
    patients, so the synaptic mechanism may be a mouse feature or an early
    human feature that is masked by the time ERGs are recorded.
  evidence:
  - reference: PMID:32272552
    reference_title: "Lack of Overt Retinal Degeneration in a K42E Dhdds Knock-In Mouse Model of RP59."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Retinas of DhddsK42E/K42E mice exhibited grossly normal histological
      organization from 1 to 12 months of age.
    explanation: The knock-in mouse lacks the human photoreceptor degeneration.
  - reference: PMID:36362109
    reference_title: "Vertebrate Animal Models of RP59: Current Status and Future Prospects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Additionally, unlike the human or nonhuman primate retina, the mouse
      retina lacks a cone-rich macula or fovea.
    explanation: Anatomical basis for the species mismatch.

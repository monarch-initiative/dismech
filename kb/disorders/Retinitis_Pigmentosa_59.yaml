      label: retinal rod cell
  evidence:
  - reference: PMID:21295282
    reference_title: "A missense mutation in DHDDS, encoding dehydrodolichyl diphosphate synthase, is associated with autosomal-recessive retinitis pigmentosa in Ashkenazi Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DHDDS is a key enzyme in the pathway of dolichol, which plays an
      important role in N-glycosylation of many glycoproteins, including
      rhodopsin.
    explanation: Rationale linking DHDDS to rhodopsin glycosylation.
  - reference: PMID:24664694
    reference_title: "Mutation K42E in dehydrodolichol diphosphate synthase (DHDDS) causes recessive retinitis pigmentosa."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patterns of plasma transferrin isoelectric focusing gel were normal in
      all family members, indicating no significant abnormality in protein
      glycosylation.
    explanation: No systemic glycosylation defect in K42E homozygotes.
  - reference: PMID:32272552
    reference_title: "Lack of Overt Retinal Degeneration in a K42E Dhdds Knock-In Mouse Model of RP59."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Hence, retinas of DhddsK42E/K42E mice exhibited no overt signs of
      degeneration, yet were markedly gliotic, but without evidence of
      compromised protein N-glycosylation.
    explanation: The patient allele does not reduce retinal N-glycosylation in mice.
  - reference: PMID:32526701
    reference_title: "Retinal Degeneration Caused by Rod-Specific Dhdds Ablation Occurs without Concomitant Inhibition of Protein N-Glycosylation."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Retina dolichol levels were markedly decreased by PN 4 weeks in

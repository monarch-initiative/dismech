    evidence:
    - reference: PMID:37443173
      reference_title: "A Dhdds K42E knock-in RP59 mouse model shows inner retina pathology and defective synaptic transmission."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Electroretinograms (ERGs) of mutant mice exhibited reduced b-wave

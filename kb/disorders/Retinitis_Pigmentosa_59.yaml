- name: Impaired Photoreceptor Protein N-Glycosylation
  description: >-
    Proposed deficit in N-glycosylation of rhodopsin and other photoreceptor
    glycoproteins from limiting dolichol supply. Direct tests have not found it:
    patient transferrin glycosylation is normal, and neither rod-specific
    Dhdds knockout nor K42E knock-in mouse retina shows loss of protein
    N-glycosylation. The node is kept to record the contested model and the
    evidence against it.

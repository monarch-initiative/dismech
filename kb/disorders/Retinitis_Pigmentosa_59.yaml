    causal_link_type: UNKNOWN
    hypothesis_groups:
    - cdg_hypoglycosylation_model
  - target: Rod Photoreceptor Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - glycosylation_independent_dolichol_model
  - target: Photoreceptor-to-Bipolar Cell Synaptic Transmission Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - inner_retina_synaptic_model
    evidence:

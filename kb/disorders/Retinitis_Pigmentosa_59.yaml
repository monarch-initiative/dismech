      reference_title: "A Dhdds K42E knock-in RP59 mouse model shows inner retina pathology and defective synaptic transmission."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we report that the Dol isoprenylogue species in retina, liver,
        and brain of the K42E mouse model are statistically shorter than in the
        corresponding tissues of age-matched controls, as reported in blood and
        urine of RP59 patients.
      explanation: The human biochemical signature is reproduced.
  - target: Rod Photoreceptor Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    limitations: >-
      Mouse retina lacks a macula and fovea, and outer nuclear layer thickness
      is preserved to at least 12 months, whereas patients lose rod function by
      their twenties.
    evidence:
    - reference: PMID:32272552
      reference_title: "Lack of Overt Retinal Degeneration in a K42E Dhdds Knock-In Mouse Model of RP59."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Hence, retinas of DhddsK42E/K42E mice exhibited no overt signs of
        degeneration, yet were markedly gliotic, but without evidence of

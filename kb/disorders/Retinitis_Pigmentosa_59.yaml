name: Retinitis Pigmentosa 59
creation_date: "2026-09-30T19:45:00Z"
category: Mendelian
disease_term:
  preferred_term: retinitis pigmentosa 59
  term:
    id: MONDO:0013468
    label: retinitis pigmentosa 59
description: >-
  Retinitis pigmentosa 59 (RP59, DHDDS-related retinal degeneration) is an
  autosomal recessive rod-cone dystrophy caused by biallelic hypomorphic
  variants in DHDDS, which encodes the catalytic subunit of the
  cis-prenyltransferase complex that, together with NgBR (NUS1), synthesizes
  the polyprenyl backbone of dolichol, the lipid carrier for protein
  N-glycosylation. Almost all reported patients carry the founder missense
  variant c.124A>G (p.Lys42Glu, K42E), homozygously or in trans with p.Thr206Ala
  or another allele; the variant is concentrated in the Ashkenazi Jewish
  population, where DHDDS is one of the two commonest causes of recessive RP.
  Symptoms of night blindness and peripheral field loss typically begin in the
  second decade, electroretinographic responses are usually nondetectable by the
  time patients are examined, and macular involvement and loss of central
  photoreceptors occur earlier than in other common recessive forms. Patients
  show a characteristic shift of plasma and urinary dolichols toward shorter
  chain lengths (dolichol-18 replacing dolichol-19 as the dominant species),
  while serum transferrin glycosylation is generally normal, so the disease is
  usually non-syndromic despite the ubiquitous requirement for dolichol. How a
  partial loss of cis-prenyltransferase activity produces retina-restricted
  degeneration is unresolved: rod-specific Dhdds ablation and K42E knock-in
  mice degenerate or become dysfunctional without detectable loss of retinal
  protein N-glycosylation, and knock-in mice point to an inner-retinal synaptic
  defect rather than primary photoreceptor loss. A single adult K42E homozygote
  with a late-onset multisystem type 1 congenital disorder of glycosylation
  phenotype has been reported. No disease-specific therapy exists.
synonyms:
- RP59
- retinitis pigmentosa type 59
- DHDDS retinitis pigmentosa
- retinitis pigmentosa caused by mutation in DHDDS
- congenital disorder of glycosylation, type Ibb
- congenital disorder of glycosylation, type 1bb
- DHDDS-related inherited retinal degeneration
parents:
- Retinitis pigmentosa
- Inherited Retinal Dystrophy
references:
- reference: PMID:20301590
  title: Nonsyndromic Retinitis Pigmentosa Overview.
  tags:
  - GeneReviews
notes: >-
  Scope. This entry covers the recessive, retina-predominant disease caused by
  biallelic DHDDS variants (MONDO:0013468, the OMIM RP59 / CDG1BB record). MONDO
  places it under both retinitis pigmentosa and DHDDS-CDG (MONDO:1040054). The
  fatal infantile multisystem type I CDG reported in one child compound
  heterozygous for a DHDDS nonsense and a splice-site variant (PMID:27343064)
  belongs to the broader DHDDS-CDG concept rather than to RP59 and is not
  curated here. The dominant de novo DHDDS disorder with developmental delay,
  seizures, myoclonus and later neurodegeneration (PMID:34382076) is a distinct
  MONDO disease and is also out of scope; in this knowledge base DHDDS is
  otherwise mentioned only as a gene in a developmental and epileptic
  encephalopathy discovery series inside
  Autosomal_Dominant_Non-Syndromic_Intellectual_Disability. ClinGen's Retina
  Gene Curation Expert Panel classifies DHDDS as Definitive for DHDDS-CDG
  (MONDO:1040054, autosomal recessive); because that assertion is made against
  the broader MONDO concept rather than this entry's disease term, it is not
  recorded under gene_disease_validity. The entry is a member of the
  Retinitis Pigmentosa grouping but not of the Congenital Disorders of
  Glycosylation grouping, whose necessary criterion is a defect that perturbs
  protein N-glycosylation: transferrin glycosylation is normal in almost all
  RP59 patients and retinal N-glycosylation is preserved in both mouse
  models, so the N-glycosylation nodes here are recorded as hypothetical or
  single-case. A DHDDS-CDG entry for the multisystem biallelic disease would
  be the natural member of that grouping. GeneReviews has no DHDDS-specific
  chapter; the Nonsyndromic Retinitis Pigmentosa Overview (PMID:20301590) covers
  RP generally, and its PubMed record holds only the overview's statement of
  purpose, so it supplies no DHDDS-specific phenotype baseline. Mouse retinas lack a cone-rich macula, which limits how well
  knock-in models can test the early macular involvement seen in patients.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic DHDDS variants. The founder K42E allele was
    identified homozygously by homozygosity mapping in Ashkenazi Jewish families
    with autosomal recessive RP; compound heterozygotes K42E/T206A and K42E/R98W
    have also been reported. Heterozygous carriers are unaffected but show an
    intermediate shift in dolichol chain length.
  evidence:
  - reference: PMID:21295282
    reference_title: "A missense mutation in DHDDS, encoding dehydrodolichyl diphosphate synthase, is associated with autosomal-recessive retinitis pigmentosa in Ashkenazi Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis revealed a founder homozygous missense mutation,
      c.124A>G (p.Lys42Glu), in the dehydrodolichyl diphosphate synthase gene
      (DHDDS) in 20 AJ patients with RP of 15 unrelated families.
    explanation: >-
      Homozygosity mapping and sequencing in 15 families establish recessive
      inheritance of the founder K42E allele.
  - reference: PMID:24078709
    reference_title: "Aberrant dolichol chain lengths as biomarkers for retinitis pigmentosa caused by impaired dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      K42E/K42E and K42E/T206A patients have significantly higher plasma and
      urinary D18/D19 ratios than K42E and T206A carriers.
    explanation: >-
      Documents homozygous and compound heterozygous affected genotypes and
      separates them biochemically from heterozygous carriers.
prevalence:
- population: Ashkenazi Jewish (ethnically matched controls, Israel)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 310.6
  notes: >-
    K42E carrier frequency of 1 in 322 ethnically matched Ashkenazi Jewish
    control individuals (100000/322). A single observed carrier, so the
    estimate is imprecise.
  evidence:
  - reference: PMID:21295282
    reference_title: "A missense mutation in DHDDS, encoding dehydrodolichyl diphosphate synthase, is associated with autosomal-recessive retinitis pigmentosa in Ashkenazi Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation was found heterozygously in 1 out of 322 ethnically matched
      normal control individuals.
    explanation: Direct count of K42E carriers among Ashkenazi Jewish controls.
- population: General population (all ancestries)
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    No population prevalence estimate has been published. Outside the Ashkenazi
    Jewish population the disease is rare; within it, DHDDS accounts for
    roughly one third of genetically solved recessive RP.
  evidence:
  - reference: PMID:36362109
    reference_title: "Vertebrate Animal Models of RP59: Current Status and Future Prospects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While the frequency of RP59 is rare in the general population, it has
      been estimated RP59 accounts for nearly one-third of RP cases involving
      Ashkenazi Jewish patients.
    explanation: Review statement of overall rarity with enrichment in Ashkenazi Jews.
  - reference: PMID:21295283
    reference_title: "Whole-exome sequencing links a variant in DHDDS to retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified Lys42Glu variant likely arose from an ancestral founder,
      because eight of the nine identified alleles in 27,174 control
      chromosomes were of confirmed Ashkenazi Jewish ethnicity.
    explanation: >-
      The K42E allele is very rare in unselected control chromosomes and is
      largely confined to Ashkenazi Jewish ancestry.
genetic:
- name: DHDDS
  gene_term:
    preferred_term: DHDDS
    term:
      id: hgnc:20603
      label: DHDDS
  relationship_type: CAUSATIVE
  association: Causative
  variant_origin: GERMLINE
  features: >-
    Biallelic hypomorphic missense variants. The founder c.124A>G (p.Lys42Glu)
    lies near the active site and lowers catalytic efficiency; p.Thr206Ala has
    been found only in trans with K42E in patients, and its pathogenicity is
    supported by the dolichol profile of K42E/T206A patients and by knock-in
    mice. p.Arg98Trp has been reported in trans with K42E in a single patient.
  case_fractions:
  - population: Ashkenazi Jewish families with RP and a known genetic cause (Israel)
    case_fraction_percent: 33.0
    notes: >-
      Share of genetically solved families in a cohort of 230 Ashkenazi Jewish
      RP families, of which 37% were solved; DHDDS K42E was second only to the
      MAK Alu insertion.
    evidence:
    - reference: PMID:29276052
      reference_title: "Nonsyndromic Retinitis Pigmentosa in the Ashkenazi Jewish Population: Genetic and Clinical Aspects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most prevalent RP-causing mutations are the Alu insertion
        (c.1297_8ins353, p.K433Rins31*) in the male germ cell-associated kinase
        (MAK) gene (39% of families with a known genetic cause for RP) and
        c.124A>G, p.K42E in dehydrodolichol diphosphate synthase (DHDDS) (33%).
      explanation: Quantifies the DHDDS K42E share among solved Ashkenazi Jewish RP families.
  - population: North American recessive or isolate RP patients reporting Jewish ancestry
    case_fraction_percent: 8.6
    cohort_size: 35
    evidence:
    - reference: PMID:25255364
      reference_title: "Two specific mutations are prevalent causes of recessive retinitis pigmentosa in North American patients of Jewish ancestry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified the MAK and DHDDS mutations homozygously in only 2.1% and
        0.8%, respectively, of patients of mixed ethnicity, but in 25.7% and
        8.6%, respectively, of cases reporting Jewish ancestry.
      explanation: Homozygous K42E accounts for 8.6% of Jewish-ancestry cases screened.
  - population: North American recessive or isolate RP patients of mixed ethnicity
    case_fraction_percent: 0.8
    cohort_size: 240
    evidence:
    - reference: PMID:25255364
      reference_title: "Two specific mutations are prevalent causes of recessive retinitis pigmentosa in North American patients of Jewish ancestry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified the MAK and DHDDS mutations homozygously in only 2.1% and
        0.8%, respectively, of patients of mixed ethnicity, but in 25.7% and
        8.6%, respectively, of cases reporting Jewish ancestry.
      explanation: Homozygous K42E is uncommon outside Jewish-ancestry patients.
  evidence:
  - reference: PMID:21295282
    reference_title: "A missense mutation in DHDDS, encoding dehydrodolichyl diphosphate synthase, is associated with autosomal-recessive retinitis pigmentosa in Ashkenazi Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis revealed a founder homozygous missense mutation,
      c.124A>G (p.Lys42Glu), in the dehydrodolichyl diphosphate synthase gene
      (DHDDS) in 20 AJ patients with RP of 15 unrelated families.
    explanation: Discovery of DHDDS as the RP59 gene in Ashkenazi Jewish families.
  - reference: PMID:21295283
    reference_title: "Whole-exome sequencing links a variant in DHDDS to retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a single, one-generation, nonsyndromic RP family, we have identified a
      gene, dehydrodolichol diphosphate synthase (DHDDS), demonstrating the
      power of combining whole-exome sequencing with rapid in vivo studies.
    explanation: Independent co-discovery of DHDDS by exome sequencing.
  - reference: PMID:28130426
    reference_title: "Genetic analysis of 10 pedigrees with inherited retinal degeneration by exome sequencing and phenotype-genotype association."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The DHDDS gene was screened for mutations in the remaining two pedigrees
      with Ashkenazi Jewish ancestry.
    explanation: >-
      Targeted DHDDS screening in Ashkenazi Jewish pedigrees, which identified
      K42E and the then-novel T206A allele.
  - reference: PMID:24078709
    reference_title: "Aberrant dolichol chain lengths as biomarkers for retinitis pigmentosa caused by impaired dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dolichol analysis also provides evidence that the T206A mutation is RP-causative.
    explanation: Biochemical support for T206A as a second pathogenic allele.
- name: ALG6 F304S modifier variant
  gene_term:
    preferred_term: ALG6
    term:
      id: hgnc:23157
      label: ALG6
  relationship_type: MODIFIER
  features: >-
    The common ALG6 p.Phe304Ser polymorphism, which does not itself cause CDG,
    was associated with a shift in retinal disease distribution among K42E
    homozygotes: more severe macular cone disease with milder peripheral rod
    disease. Based on 11 patients.
  evidence:
  - reference: PMID:38256083
    reference_title: "Inherited Retinal Degeneration Caused by Dehydrodolichyl Diphosphate Synthase Mutation-Effect of an ALG6 Modifier Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ALG6 variant, (F304S), was correlated with greater macular cone
      disease severity and less peripheral rod disease severity.
    explanation: Candidate modifier association in a small K42E patient series.
mechanistic_hypotheses:
- hypothesis_group_id: cdg_hypoglycosylation_model
  hypothesis_label: Photoreceptor protein hypoglycosylation (RP59 as a congenital disorder of glycosylation)
  status: ALTERNATIVE
  description: >-
    The original model: reduced cis-prenyltransferase activity limits
    dolichol-linked oligosaccharide supply, rhodopsin and other photoreceptor
    glycoproteins are underglycosylated, and rods degenerate as in
    rhodopsin glycosylation-site mutants. Zebrafish knockdown supports it, but
    normal transferrin glycosylation in patients and preserved retinal
    N-glycosylation in both rod-specific knockout and K42E knock-in mice argue
    against it as the primary retinal mechanism.
  evidence:
  - reference: PMID:21295283
    reference_title: "Whole-exome sequencing links a variant in DHDDS to retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Zebrafish studies showed virtually identical photoreceptor defects as
      observed with N-linked glycosylation-interfering mutations in the
      light-sensing protein rhodopsin.
    explanation: Phenocopy of glycosylation-defective rhodopsin in dhdds morphant zebrafish.
  - reference: PMID:32526701
    reference_title: "Retinal Degeneration Caused by Rod-Specific Dhdds Ablation Occurs without Concomitant Inhibition of Protein N-Glycosylation."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings challenge the conventional mechanistic view of RP59 as a
      congenital disorder of glycosylation.
    explanation: Rod degeneration occurred with retinal N-glycosylation preserved.
- hypothesis_group_id: glycosylation_independent_dolichol_model
  hypothesis_label: Glycosylation-independent photoreceptor dolichol deficit
  status: EMERGING
  description: >-
    Reduced or chain-shortened dolichol in photoreceptors damages them through a
    route other than bulk N-glycosylation, for example by destabilizing the
    outer-segment disc membranes in which dolichol is thought to influence
    fluidity and fusion.
  evidence:
  - reference: PMID:24664694
    reference_title: "Mutation K42E in dehydrodolichol diphosphate synthase (DHDDS) causes recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we believe that the mutation may lead to low dolichol levels in
      photoreceptor outer segments, resulting in unstable membrane structure
      that leads to photoreceptor degeneration.
    explanation: Authors' proposed membrane mechanism, stated as a hypothesis.
  - reference: PMID:32526701
    reference_title: "Retinal Degeneration Caused by Rod-Specific Dhdds Ablation Occurs without Concomitant Inhibition of Protein N-Glycosylation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Retina dolichol levels were markedly decreased by PN 4 weeks in
      Dhddsflx/flx iCre+ mice, relative to controls; despite this,
      N-glycosylation of retinal proteins, including opsin (the dominant
      rod-specific glycoprotein), persisted in Dhddsflx/flx iCre+ mice.
    explanation: Dolichol loss and degeneration without detectable hypoglycosylation.
- hypothesis_group_id: inner_retina_synaptic_model
  hypothesis_label: Photoreceptor-to-bipolar synaptic transmission defect
  status: EMERGING
  description: >-
    In K42E and T206A knock-in mice the earliest and dominant defect is a
    reduced ERG b-wave with preserved a-wave, inner nuclear layer thinning and
    loss of bipolar and amacrine cells, suggesting defective transmission from
    photoreceptors to the inner retina. A corresponding human signature has not
    been demonstrated, because most patients already have nondetectable ERGs.
  evidence:
  - reference: PMID:37443173
    reference_title: "A Dhdds K42E knock-in RP59 mouse model shows inner retina pathology and defective synaptic transmission."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results suggest that the underlying cause of DHDDS K42E variant
      driven RP59 retinal pathology is defective synaptic transmission from
      outer to inner retina.
    explanation: Knock-in model conclusion that motivates this hypothesis.
  - reference: PMID:40574710
    reference_title: "Dhdds T206A and Dhdds K42E knock-in mouse models of retinitis pigmentosa 59 are phenotypically similar."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We propose that the physiological basis of retinal dysfunction in RP59
      involves defective photoreceptor to bipolar cell synaptic transmission
      with concomitant bipolar/amacrine cell degeneration.
    explanation: Replicated with the second patient allele, T206A.
- hypothesis_group_id: rpe_contribution_model
  hypothesis_label: Retinal pigment epithelium contribution
  status: EMERGING
  description: >-
    Loss of DHDDS in the retinal pigment epithelium is sufficient to cause RPE
    atrophy and secondary photoreceptor loss in mice, and patients show early
    macular autofluorescence changes; whether RPE involvement is primary in
    human RP59 is unresolved, and one patient histology showed relative RPE
    preservation.
  evidence:
  - reference: PMID:32245241
    reference_title: "Selective Ablation of Dehydrodolichyl Diphosphate Synthase in Murine Retinal Pigment Epithelium (RPE) Causes RPE Atrophy and Retinal Degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results indicate that RPE dysfunction contributes to DHDDS
      mutation-mediated pathology and suggests a more complicated disease
      mechanism than simply disruption of glycosylation.
    explanation: RPE-specific Dhdds ablation produces retinal degeneration.
pathophysiology:
- name: DHDDS Cis-Prenyltransferase Partial Loss of Function
  description: >-
    DHDDS forms the catalytic subunit of the heterotetrameric
    cis-prenyltransferase with the NgBR (NUS1) subunit, which condenses
    isopentenyl diphosphate onto farnesyl diphosphate to build the polyprenyl
    diphosphate backbone of dolichol. The RP59 K42E substitution destabilizes
    the active site, raises the Km for farnesyl diphosphate and lowers kcat,
    leaving substantial residual activity. DHDDS is expressed ubiquitously and
    is concentrated in rod and cone inner segments in the human retina.
  biological_scale: MOLECULAR
  conforms_to: "photoreceptor_degeneration#Photoreceptor Gene Defect"
  genes:
  - preferred_term: DHDDS
    term:
      id: hgnc:20603
      label: DHDDS
  - preferred_term: NUS1 (NgBR)
    term:
      id: hgnc:21042
      label: NUS1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Biallelic missense variants (K42E homozygous; K42E/T206A; K42E/R98W).
  molecular_functions:
  - preferred_term: dehydrodolichyl diphosphate synthase activity
    modifier: DECREASED
    term:
      id: GO:0045547
      label: ditrans,polycis-polyprenyl diphosphate synthase [(2E,6E)-farnesyl diphosphate specific] activity
  cellular_components:
  - preferred_term: dehydrodolichyl diphosphate synthase complex
    term:
      id: GO:1904423
      label: dehydrodolichyl diphosphate synthase complex
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: cone photoreceptor cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:24664694
    reference_title: "Mutation K42E in dehydrodolichol diphosphate synthase (DHDDS) causes recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified mutation changes the highly conserved residue Lys42 to
      Glu, resulting in lower catalytic efficiency.
    explanation: K42E lowers DHDDS catalytic efficiency.
  - reference: PMID:32817466
    reference_title: "Structural elucidation of the cis-prenyltransferase NgBR/DHDDS complex reveals insights in regulation of protein glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      this interpretation is consistent with the observation that K42E
      mutation increases the KM for FPP, decreases kcat, but has no effect on
      IPP binding
    explanation: Kinetic basis of the partial loss of function.
  - reference: PMID:33077723
    reference_title: "Structural basis of heterotetrameric assembly and disease mutations in the human cis-prenyltransferase complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we reveal that hcis-PT exhibits a heterotetrameric assembly in
      solution, consisting of two catalytic dehydrodolichyl diphosphate
      synthase (DHDDS) and inactive Nogo-B receptor (NgBR) heterodimers.
    explanation: Defines DHDDS as the catalytic subunit of the complex with NgBR.
  - reference: PMID:33077723
    reference_title: "Structural basis of heterotetrameric assembly and disease mutations in the human cis-prenyltransferase complex."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We noticed that within the timeframe of the simulations, the K42E
      mutation results in active-site destabilization, including the
      C-terminus of NgBR
    explanation: Molecular dynamics model of how K42E perturbs the active site.
  - reference: PMID:21295282
    reference_title: "A missense mutation in DHDDS, encoding dehydrodolichyl diphosphate synthase, is associated with autosomal-recessive retinitis pigmentosa in Ashkenazi Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical analysis of the human retina with anti-DHDDS
      antibodies revealed intense labeling of the cone and rod photoreceptor
      inner segments.
    explanation: DHDDS protein is concentrated in photoreceptor inner segments.
  downstream:
  - target: Dolichol Chain-Length Shortening
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32817466
      reference_title: "Structural elucidation of the cis-prenyltransferase NgBR/DHDDS complex reveals insights in regulation of protein glycosylation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: K42E also causes product chain shortening (25, 49), which will be discussed below.
      explanation: The mutant enzyme makes shorter polyprenyl products.
- name: Dolichol Chain-Length Shortening

    reference_title: "Aberrant dolichol chain lengths as biomarkers for retinitis pigmentosa caused by impaired dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dolichol-18 (D18) became the dominant dolichol species in patients
      instead of dolichol-19 (D19) in normal individuals.
    explanation: Chain-length shift in patient plasma and urine.
  - reference: PMID:37443173
    reference_title: "A Dhdds K42E knock-in RP59 mouse model shows inner retina pathology and defective synaptic transmission."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report that the Dol isoprenylogue species in retina, liver, and
      brain of the K42E mouse model are statistically shorter than in the
      corresponding tissues of age-matched controls, as reported in blood and
      urine of RP59 patients.
    explanation: The same shortening occurs in retina of the knock-in model.
  downstream:

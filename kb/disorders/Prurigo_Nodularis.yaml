    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Based on two phase 3 clinical trials, dupilumab (an IL-4R a monoclonal antibody simultaneously antagonizing IL-4 and IL-13) has become the ﬁrst the U.S. Food and Drug Administration (FDA)/European Medicines Agency (EMA)/China National Medical Products Administration (NMPA)-approved treatment for adult patients with PN. C ompared to placebo, signi ﬁcant improvements in weekly average worst itch numeric rating scale (WI-NRS) with dupilumab were observed as early as week 3 in PRIME and week 4 in PRIME2 ( 134)."

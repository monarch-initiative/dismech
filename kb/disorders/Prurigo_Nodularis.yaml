  evidence:
  - reference: PMID:38345154
    reference_title: "Prurigo nodularis: new insights into pathogenesis and novel therapeutics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "There is a role for type 2 inflammation in PN in addition to T-helper (Th)17 and Th22-mediated inflammation."
    explanation: Establishes the role of type 2 inflammation in prurigo nodularis pathogenesis.
  - reference: DOI:10.3389/fimmu.2023.1301817
    reference_title: Molecular mechanisms of pruritus in prurigo nodularis
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The expression of IL-4, IL-13, and IL-4 receptor (IL-4R) is upregulated in prurigo nodules, with IL-4 correlating with the intensity of itch ( 8, 11, 26, 27). IL-4 is primarily expressed in T lymphocytes and basophils, whereas IL-13 is primarily expressed in eosinophils (26). Studies have shown that IL-4 and IL-13 activate itch-sensitive neurons in both humans and mice through IL-4R a (28)."
    explanation: Documents upregulation of IL-4, IL-13, and IL-4R in prurigo nodules, their cellular sources (T cells, basophils, eosinophils), and direct activation of itch-sensitive neurons via IL-4Ralpha.
  - reference: DOI:10.3389/fimmu.2023.1301817
    reference_title: Molecular mechanisms of pruritus in prurigo nodularis
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition, IL-4 and IL-13 exert pruritogenic effects by recruiting eosinophils and mast cells, driving IgE synthesis, and interacting with IL-31 ( 30 ). They promote ﬁbroblast proliferation, differentiation, and synthesis of extracellular matrix proteins such as periostin in the dermis, mediating PN-associated skin ﬁbrosis and itch (20)."
    explanation: Shows that IL-4 and IL-13 recruit eosinophils and mast cells and promote dermal fibroblast proliferation and extracellular matrix synthesis in prurigo nodularis.
  downstream:
  - target: Cutaneous Neural Sensitization
    causal_link_type: DIRECT
    description: IL-4 and IL-13 activate itch-sensitive sensory neurons through IL-4Ralpha and amplify neuronal sensitivity to pruritogenic stimuli.
    evidence:
    - reference: DOI:10.3389/fimmu.2023.1301817
      reference_title: Molecular mechanisms of pruritus in prurigo nodularis
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Studies have shown that IL-4 and IL-13 activate itch-sensitive neurons in both humans and mice through IL-4R a (28). They also amplify neuronal responses to various pruritogenic stimuli, including histamine-dependent and histamine-independent pathways, thereby contributing to neuronal sensitization ( 29)."
      explanation: Demonstrates that IL-4 and IL-13 directly activate and sensitize itch-sensing neurons via IL-4Ralpha.
  - target: Profibrotic Fibroblast Activation and Extracellular Matrix Remodeling
    causal_link_type: DIRECT
    description: IL-4 and IL-13 promote dermal fibroblast proliferation, differentiation, and extracellular matrix protein synthesis.
    evidence:
    - reference: DOI:10.3389/fimmu.2023.1301817
      reference_title: Molecular mechanisms of pruritus in prurigo nodularis
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "They promote ﬁbroblast proliferation, differentiation, and synthesis of extracellular matrix proteins such as periostin in the dermis, mediating PN-associated skin ﬁbrosis and itch (20)."
      explanation: Establishes that type 2 cytokines IL-4 and IL-13 drive dermal fibroblast proliferation and extracellular matrix production in prurigo nodularis.
- name: IL-31 and IL-6 Family Neuroimmune Signaling
  description: >-
    Markedly elevated lesional and serum IL-31 (secreted primarily by Th2 cells
    and dermal CD11c+ myeloid dendritic cells) and upregulated IL-6 and MAPK12
    signal through heterodimeric IL-31RA/OSMRB receptors and the JAK1/STAT3/STAT6
    pathway in lesional skin. IL-31/IL-31RA signaling promotes sensory nerve
    axon sprouting, sensitizes pruriceptive neurons, and drives downstream
    keratinocyte proliferation and profibrotic fibroblast responses.
  biological_scale: MOLECULAR

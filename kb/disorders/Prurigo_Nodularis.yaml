    explanation: Primary publication generating the single-cell RNA-seq dataset of prurigo nodularis skin.
- accession: geo:GSE233280
  title: Single-cell RNA sequencing reveals dysregulated fibroblast subclusters in prurigo nodularis
  description: Prurigo nodularis (PN) is an intensely pruritic, inflammatory skin disease with a poorly understood pathogenesis. Thus, we performed single-cell transcriptomic profiling of 28,695 lesional and non-lesional PN cells. Lesional PN has increased dysregulated fibroblasts (FBs) and myofibroblasts. FBs in lesional PN were shifted towards a cancer-associated fibroblast (CAF)-like phenotype, with POSTN+WNT5A+ CAFs increased in PN, and similarly so in squamous cell carcinoma. A multi-center cohort study revealed an increased risk of SCC and CAF-associated malignancies (breast and colorectal) in PN patients.

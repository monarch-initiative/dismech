pathophysiology:
- name: Cutaneous Type 2 Inflammation
  description: >-
    Cutaneous and systemic type 2 helper T-cell (Th2) activation with increased
    expression of IL-4, IL-13, and IL-4 receptor alpha in prurigo nodules and
    elevated circulating IL-13. IL-4 (primarily from T lymphocytes and basophils)
    and IL-13 (primarily from eosinophils) directly activate and sensitize
    itch-sensitive neurons via IL-4Ralpha, recruit eosinophils and mast cells,
    and promote dermal fibroblast proliferation and extracellular matrix
    synthesis.
  biological_scale: CELLULAR

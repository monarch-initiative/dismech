    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we performed NanoString-based transcriptomic profiling on lesional skin biopsies from patients with PN (n = 26), those with atopic dermatitis (n = 25), those with psoriasis (n = 15), and healthy controls (n = 12) using a custom neuroinflammation-focused panel."
    explanation: Primary publication reporting the NanoString transcriptomic dataset of prurigo nodularis, atopic dermatitis, psoriasis, and healthy control skin biopsies.
- accession: geo:GSE273559
  title: Single-cell profiling of prurigo nodularis demonstrates immune-stromal crosstalk driving profibrotic responses and reversal with nemolizumab
  description: Prurigo nodularis (PN) is a chronic neuroimmune skin disease characterized by bilaterally distributed pruritic hyperkeratotic nodules on extremities and trunk. Neuroimmune dysregulation and chronic scratching are believed to both induce and maintain the characteristic lesions. This study sought to provide a comprehensive view of the molecular pathogenesis of PN at the single-cell level to identify and outline key pathologic processes and the cell types involved. Features that distinguish PN skin from the skin of patients with atopic dermatitis were of particular interest.
  organism:

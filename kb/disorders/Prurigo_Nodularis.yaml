differential_diagnoses:
- name: Atopic Dermatitis
  disease_term:
    preferred_term: atopic dermatitis
    term:
      id: MONDO:0004980
      label: atopic eczema
  description: >-
    Atopic dermatitis frequently coexists with prurigo nodularis (present or
    predisposed in approximately half of patients) and shares type 2 immune
    activation, but prurigo nodularis represents a distinct clinical and
    transcriptomic entity.
  distinguishing_features:
  - Prurigo nodularis is distinguished histologically and transcriptomically from atopic dermatitis by prominent papillary dermal fibrosis driven by COL11A1+ fibroblasts, stromal remodeling, and neurovascular dysregulation rather than the strong type 2 epidermal response typical of atopic dermatitis.
  evidence:
  - reference: PMID:37506977
    reference_title: Single-cell profiling of prurigo nodularis demonstrates immune-stromal crosstalk driving profibrotic responses and reversal with nemolizumab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Activation of fibrotic responses is the main distinguishing feature between PN and atopic dermatitis skin."
    explanation: Single-cell transcriptomic comparison establishes dermal fibrotic activation as the primary feature distinguishing prurigo nodularis from atopic dermatitis.
  - reference: DOI:10.3389/fimmu.2023.1301817
    reference_title: Molecular mechanisms of pruritus in prurigo nodularis
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although AD and PN are both type 2 inﬂammatory diseases, recent transcriptomic studies have clearly revealed that PN is separated from AD. PN does not harbor the strong type 2 response pattern that is typically found in AD but is rather characterized by stromal remodeling and neurovascular dysregulation (6– 11)."
    explanation: Contrasts the stromal remodeling and neurovascular dysregulation of prurigo nodularis with the strong type 2 inflammatory profile of atopic dermatitis.

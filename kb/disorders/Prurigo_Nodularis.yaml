  - reference: PMID:41333131
    reference_title: Nanostring Transcriptomic Analysis Highlights IL-6 Family and TGF-β Pathways in the Pathogenesis of Prurigo Nodularis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The upregulation of IL-6, MAPK12, and IL-31 further supported neuroimmune dysregulation in PN."
    explanation: Lesional skin transcriptomics in 26 patients with prurigo nodularis confirms upregulation of IL-6, MAPK12, and IL-31.
  - reference: DOI:10.3389/fimmu.2023.1301817
    reference_title: Molecular mechanisms of pruritus in prurigo nodularis
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "IL-31 is mainly secreted by Th2 cells, and dermal CD11c + myeloid dendritic cells are an important source of IL-31 in PN ( 33, 34)."
    explanation: Identifies Th2 cells and dermal CD11c+ myeloid dendritic cells as the primary cellular sources of IL-31 in prurigo nodularis.
  - reference: DOI:10.3389/fimmu.2023.1301817
    reference_title: Molecular mechanisms of pruritus in prurigo nodularis
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In PN lesions, this receptor is also notably increased, and the intensity of pruritus in PN is closely related to the number of IL-31+ cells and IL- 31Ra+ cells in the dermis ( 33). IL-31 promotes sprouting of skin sensory nerve axons and enhances their sensitivity to pruritogens (41, 42)."
    explanation: Documents upregulation of the IL-31RA/OSMRB receptor complex in prurigo nodularis dermis and IL-31-driven sensory nerve sprouting and sensitization.
  - reference: DOI:10.3389/fimmu.2023.1301817
    reference_title: Molecular mechanisms of pruritus in prurigo nodularis
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Several key cytokines, such as IL-4, IL-13, IL-31, and OSM, play roles in propagating pruritus and in ﬂammation in PN through the JAK-STAT signaling pathway, particularly involving JAK1, STAT3, and STAT6 ( 28, 45, 108)."
    explanation: Establishes that IL-31 and related cytokines propagate pruritus and inflammation in prurigo nodularis via JAK1, STAT3, and STAT6 signaling.
  downstream:
  - target: Cutaneous Neural Sensitization
    causal_link_type: DIRECT
    description: IL-31 directly activates IL-31RA/OSMRB on sensory neurons and enhances neuronal sensitivity to pruritogens.
    evidence:
    - reference: DOI:10.3389/fimmu.2023.1301817
      reference_title: Molecular mechanisms of pruritus in prurigo nodularis
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "IL-31 promotes sprouting of skin sensory nerve axons and enhances their sensitivity to pruritogens (41, 42)."
      explanation: Demonstrates that IL-31 enhances sensory neuron sensitivity to pruritogens.
  - target: NGF-Driven Dermal Neuronal Hyperplasia
    causal_link_type: DIRECT
    description: IL-31 promotes sprouting of cutaneous sensory nerve axons and sustains NGF-mediated neuronal dysregulation.
    evidence:
    - reference: DOI:10.3389/fimmu.2023.1301817
      reference_title: Molecular mechanisms of pruritus in prurigo nodularis
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Blocking IL-31R a not only effectively inhibits pruritus signaling but also alleviates downstream Th2 and Th17 in ﬂammatory responses, suppresses nerve growth factor (NGF)-mediated neuronal dysregulation, and reverses the activation of keratinocyte proliferation and pro- ﬁbrotic reactions (23, 43, 44)."
      explanation: Shows that IL-31RA signaling drives NGF-mediated neuronal dysregulation, keratinocyte proliferation, and profibrotic responses in prurigo nodularis.
  - target: Epidermal Keratinocyte Hyperproliferation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: IL-31/IL-31RA signaling promotes epidermal keratinocyte proliferation, which is reversed by IL-31RA blockade with nemolizumab.
    evidence:
    - reference: PMID:37506977
      reference_title: Single-cell profiling of prurigo nodularis demonstrates immune-stromal crosstalk driving profibrotic responses and reversal with nemolizumab.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "This study further shows the broad effect of nemolizumab on PN cell types, with a prominent effect driving COL11A1+ fibroblast and keratinocyte responses toward normal."
      explanation: Reversal of pathological keratinocyte responses by IL-31RA blockade with nemolizumab supports IL-31 signaling as an upstream driver of keratinocyte hyperproliferation.
  - target: Profibrotic Fibroblast Activation and Extracellular Matrix Remodeling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: IL-31/IL-31RA signaling promotes profibrotic COL11A1+ dermal fibroblast activation, which is normalized by nemolizumab.
    evidence:
    - reference: PMID:37506977
      reference_title: Single-cell profiling of prurigo nodularis demonstrates immune-stromal crosstalk driving profibrotic responses and reversal with nemolizumab.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "This study further shows the broad effect of nemolizumab on PN cell types, with a prominent effect driving COL11A1+ fibroblast and keratinocyte responses toward normal."
      explanation: Normalization of COL11A1+ fibroblast transcriptional programs by nemolizumab demonstrates that IL-31RA signaling drives profibrotic fibroblast activation in prurigo nodularis.
- name: Th17 and Th22 Cutaneous Inflammation
  description: >-
    Increased lesional infiltration of CD4+ T-helper 17 (Th17) cells and
    systemic and cutaneous Th22 polarization with elevated expression of IL-17
    and IL-22 in prurigo nodularis lesions, driving excessive proliferation and
    impaired differentiation of epidermal keratinocytes as well as keratinocyte
    secretion of pruritogenic mediators.

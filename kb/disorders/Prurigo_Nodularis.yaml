- name: Nemolizumab
  description: >-
    Monoclonal antibody targeting the IL-31 receptor A (IL-31RA) that blocks
    IL-31-driven pruritus, significantly reduces peak pruritus and skin lesion
    severity in randomized clinical trials, and reverses pathological COL11A1+
    fibroblast and keratinocyte transcriptional responses in prurigo nodularis
    skin.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Monoclonal Antibody Therapy

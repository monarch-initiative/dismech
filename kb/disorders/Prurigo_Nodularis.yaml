name: Prurigo Nodularis
creation_date: '2026-02-02T00:16:36Z'
description: >-
  Prurigo nodularis is a chronic neuroimmune skin disease characterized by
  intensely pruritic, hyperkeratotic nodules that arise from a self-perpetuating
  itch-scratch cycle. Sustained scratching and a type 2-skewed inflammatory
  milieu (IL-31, IL-4, IL-13) alongside Th17/Th22 polarization promote dermal
  fibrosis and neural hyperplasia with increased dermal nerve fibers,
  sensitizing pruriceptive pathways and lowering the itch threshold. This
  neuroimmune cross-talk maintains the nodules long after any initiating
  dermatologic, systemic, or neuropsychiatric trigger, making the condition
  refractory and self-sustaining.

notes: >-
  Prurigo nodularis exhibits clinical and molecular heterogeneity across
  disease endotypes (including varying degrees of type 2 inflammation,
  coexistent atopic predisposition in roughly half of patients, or underlying
  myelopathy/spinal disc disease) as well as racial and ethnic variation in
  dermal fibrosis severity. While single-cell and spatial transcriptomic
  studies (GSE273559, GSE233280) clearly separate prurigo nodularis from atopic
  dermatitis by its papillary dermal COL11A1+ and POSTN+WNT5A+ profibrotic
  fibroblast expansion, the initiating triggers of the self-sustaining
  itch-scratch cycle remain incompletely defined.

genetic:
- name: TAB2
  gene_term:
    preferred_term: TAB2
    term:
      id: hgnc:17075
      label: TAB2
  relationship_type: CAUSATIVE
  notes: >-
    TAB2 is at 6q25.1. Deletions ranging from 1.68 to 14.31 Mb and intragenic truncating
    variants give indistinguishable phenotypes.
  evidence:
  - reference: PMID:20493459
    reference_title: "Haploinsufficiency of TAB2 causes congenital heart defects in humans."
    supports: SUPPORT

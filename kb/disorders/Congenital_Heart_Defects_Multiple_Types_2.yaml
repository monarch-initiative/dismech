animal_models:
- name: Cardiomyocyte-specific Tab2 knockout mouse
  species: Mouse
  genotype: Tab2 fl/fl; alphaMHC-MerCreMer, tamoxifen-induced
  publication: PMID:34990405
  description: >-
    Tamoxifen-inducible cardiomyocyte-restricted deletion of Tab2 in the adult mouse
    heart. Because deletion is postnatal and cardiomyocyte-limited, this model isolates
    the myocardial survival arm of TAB2 function from its developmental arm.
  modeled_mechanisms:
  - target: RIPK1-Dependent Cardiomyocyte Death
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Deletion produces RIPK1 kinase activation with apoptotic and necroptotic
      cardiomyocyte death, ventricular dilation, fibrosis and contractile dysfunction,
      and the phenotype is rescued by genetically inactivating RIPK1.
    limitations: >-
      The model is a homozygous conditional knockout in adult cardiomyocytes, whereas
      human disease is constitutional heterozygous haploinsufficiency. It therefore
      speaks to the cardiomyopathy arm only and cannot model the developmental cardiac
      malformations, and the severity is greater than the human course.
    evidence:
    - reference: PMID:34990405
      reference_title: "TAB2 deficiency induces dilated cardiomyopathy by promoting RIPK1-dependent apoptosis and necroptosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cardiomyocyte-specific deletion of Tab2 in mice triggered dilated cardiomyopathy with massive apoptotic and necroptotic cell death."
      explanation: Supports treating this model as informative for the cardiomyocyte death node.
  - target: Dilated cardiomyopathy
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Genetic inactivation of RIPK1 kinase activity rescued cardiac remodeling and
      dysfunction, identifying RIPK1 as the effector and a candidate therapeutic target.
    limitations: >-
      The rescue is genetic (Ripk1-K45A knockin) rather than pharmacological, and has
      not been tested in humans or against constitutional haploinsufficiency.
    evidence:
    - reference: PMID:34990405
      reference_title: "TAB2 deficiency induces dilated cardiomyopathy by promoting RIPK1-dependent apoptosis and necroptosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Strikingly, genetic inactivation of RIPK1 with Ripk1-K45A knockin effectively rescued cardiac remodeling and dysfunction in Tab2-deficient mice."
      explanation: Documents the rescue arm, which is what establishes RIPK1 as causal rather than correlated.
- name: Zebrafish tab2 morphant
  species: Zebrafish
  genotype: tab2 morpholino knockdown, titrated
  publication: PMID:20493459
  description: >-
    Graded morpholino knockdown of tab2 in zebrafish embryos, used to test dosage
    sensitivity during cardiac development.
  modeled_mechanisms:
  - target: Disturbed Cardiac Morphogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Titrated reduction of tab2 expression produces cardiac defects, supporting a
      dosage-sensitive developmental requirement.
    limitations: >-
      Morpholino knockdown is transient and subject to off-target effects, and the
      zebrafish heart is two-chambered, so specific human lesions such as mitral valve
      disease cannot be modelled.
    evidence:
    - reference: PMID:20493459
      reference_title: "Haploinsufficiency of TAB2 causes congenital heart defects in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a critical, dosage-sensitive role during development was demonstrated by the cardiac defects observed upon titrated knockdown of tab2 expression in zebrafish embryos"
      explanation: Supports treating this model as informative for the developmental morphogenesis node.
diagnosis:
- name: Echocardiography
  description: >-
    Echocardiography defines the structural lesion and the functional defect. Because
    cardiomyopathy can appear after a normal initial study, a single echocardiogram
    establishes the baseline rather than excluding disease.
  diagnosis_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:28464518
    reference_title: "6q25.1 (TAB2) microdeletion syndrome: Congenital heart defects and cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that patients with a TAB2 deletion be screened longitudinally for systolic heart failure, even if an initial echocardiogram is normal."
    explanation: States both the modality and the reason a single normal study does not discharge the patient.
- name: Copy-number and sequence testing
  description: >-
    Both a 6q25.1 deletion and an intragenic TAB2 variant produce the same phenotype,
    so a testing strategy that looks for only one of them will miss half the cases.
    Chromosomal microarray detects the deletions, which range from 1.68 to 14.31 Mb;
    sequencing detects the truncating variants.
  evidence:
  - reference: PMID:34456334
    reference_title: "TAB2 deletions and variants cause a highly recognisable syndrome with mitral valve disease, cardiomyopathy, short stature and hypermobility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This identified 11 patients with a deletion containing TAB2 (size 1.68-14.31 Mb) and 14 patients from six families with novel truncating TAB2 variants."
    explanation: Documents that both lesion classes occur at comparable frequency, which is what makes a two-modality testing strategy necessary.
  - reference: PMID:34456334
    reference_title: "TAB2 deletions and variants cause a highly recognisable syndrome with mitral valve disease, cardiomyopathy, short stature and hypermobility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No substantial phenotypic differences were noted between patients with deletions and those with intragenic variants."
    explanation: Phenotype does not discriminate between the two lesion classes, so it cannot be used to choose the test.
treatments:
- name: Longitudinal cardiac surveillance
  description: >-
    Because cardiomyopathy can develop in the absence of a structural defect and after
    a normal initial echocardiogram, patients with a TAB2 deletion should be screened
    longitudinally for systolic heart failure.
  treatment_term:
    preferred_term: longitudinal echocardiographic monitoring for systolic heart failure
  therapeutic_modality: OTHER
  notes: >-
    treatment_term is deliberately left unbound. The TreatmentActionTerm enum is rooted
    at NCIT:C25218 (Clinical Intervention or Procedure); NCIT:C61256 Monitoring is not
    reachable from it, and NCIT:C15406 Cancer Screening names the wrong thing. No term
    beats a wrong one, so the concept is carried in preferred_term. The modality is
    recorded separately as OTHER: serial echocardiographic surveillance is a
    diagnostic monitoring programme rather than any of the therapeutic platforms the
    modality enum enumerates. DEVICE would be wrong - that value is defined as an
    implanted or external therapeutic device, and the echocardiogram here treats
    nothing.
  evidence:
  - reference: PMID:28464518
    reference_title: "6q25.1 (TAB2) microdeletion syndrome: Congenital heart defects and cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that patients with a TAB2 deletion be screened longitudinally for systolic heart failure, even if an initial echocardiogram is normal."
    explanation: States the surveillance recommendation and the reason a single normal echocardiogram does not discharge the patient.
  target_mechanisms:
  - target: Dilated cardiomyopathy
    description: >-
      Surveillance detects the cardiomyopathy phenotype earlier; it does not modify the
      underlying mechanism.
- name: Valve repair or replacement
  description: >-
    Surgical management of the valvular disease that dominates the structural
    phenotype, including the polyvalvular involvement seen in over half of
    individuals.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:34741306
    reference_title: "TAB2 variants cause cardiovascular heart disease, connective tissue disorder, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "77% of subjects (30/39) with TAB2 SNV had valvular defects and polyvalvular disease was noted in 56% (22/39)"
    explanation: Establishes the burden of valvular disease that surgical management addresses. The source quantifies the lesions rather than reporting operative outcomes, so this treatment is curated from the indication rather than from an efficacy claim.
  target_mechanisms:
  - target: Abnormal mitral valve morphology
    description: Corrects the structural lesion; it does not modify TAB2 dosage.
- name: Heart failure management
  description: >-
    Guideline-directed medical therapy for the dilated cardiomyopathy and systolic
    dysfunction seen in about half of individuals.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    therapeutic_agent is deliberately left empty. None of the sources cited by this
    entry names a drug or drug class used in these patients - they report the
    prevalence of the cardiomyopathy, not its management - and guideline-directed
    therapy for dilated cardiomyopathy is a multi-drug standard of care rather than an
    agent this disease selects for. Naming one here would be an unsourced assertion.
    The modality is recorded because that much is determinate.
  evidence:
  - reference: PMID:34741306
    reference_title: "TAB2 variants cause cardiovascular heart disease, connective tissue disorder, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over all TAB2 patients 51% (20/39) displayed a functional defect with dilated cardiomyopathy observed in 46% (18/39) of individuals"
    explanation: Quantifies the functional cardiac disease that medical therapy targets. As above, the source establishes the indication rather than reporting treatment outcomes.
  target_mechanisms:
  - target: Dilated cardiomyopathy
    description: Treats the functional consequence; it does not address the cell-death mechanism.
discussions:
- discussion_id: tab2_allelic_series_lof_and_gof
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#TAB2 Haploinsufficiency
  - pathophysiology#Impaired TAK1 Complex Signaling
  prompt: >-
    Is TAB2 disease uniformly a loss-of-function mechanism, and if not, what does the
    gain-of-function class do?
  rationale: >-
    This entry is built on haploinsufficiency, which is well supported for whole-gene
    deletions and truncating variants. A scalable luciferase screen of 47 TAB2 variants
    reported both loss-of-function and gain-of-function alleles with distinct
    phenotypes, and found that AP-1 rather than NF-kappaB activity separated pathogenic
    from benign. Two things follow that this entry cannot yet model. First, the
    pathograph has one molecular entry point, so a gain-of-function allele has nowhere
    to attach. Second, the genotype-phenotype split reported for partial
    loss-of-function variants runs opposite to the entity's name: those patients mostly
    do not have congenital heart disease, and instead have developmental delay,
    hypotonia and dysmorphic features. Whether that is a second mechanism, a dosage
    threshold effect, or ascertainment is open, and resolving it would change how the
    entry is structured rather than just adding an edge.
  evidence:
  - reference: DOI:10.1093/hmg/ddac252
    reference_title: "Assigning pathogenicity for TAB2 variants using a novel scalable functional assay and expanding TAB2 disease spectrum"
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Missense variant represents a major proportion of non-synonymous TAB2 variants reported in gnomAD (295/576) and Clinvar (16/73), most of which are variants of uncertain significance (VUSs)."
    explanation: Establishes that the missense class, where the gain-of-function alleles sit, is the numerically dominant and least interpreted part of the allelic series.
  - reference: DOI:10.1093/hmg/ddac252
    reference_title: "Assigning pathogenicity for TAB2 variants using a novel scalable functional assay and expanding TAB2 disease spectrum"
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "most patients with partial LOF variants do not exhibit congenital heart disease but high frequency of developmental delay, hypotonia and dysmorphic features"
    explanation: The genotype-phenotype observation that the current single-entry-point pathograph cannot represent.
- discussion_id: tab2_hearing_loss_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Hearing impairment
  prompt: >-
    By what route does reduced TAB2 dosage cause hearing loss?
  rationale: >-
    Hearing loss occurs in 18% of pooled subjects, which is well above the threshold at
    which this entry curates a phenotype, but nothing connects it to a mechanism node.
    The cohort that reports it groups it with myopia as an additional feature rather
    than with the connective tissue cluster, and no study has examined TAB2 in the
    cochlea or middle ear. It is therefore left with no incoming causal edge on
    purpose. Hanging it off the connective tissue node would assert a syndromic
    connective-tissue route by analogy with Stickler and Ehlers-Danlos syndromes, which
    is plausible and unsupported.
  evidence:
  - reference: PMID:34741306
    reference_title: "TAB2 variants cause cardiovascular heart disease, connective tissue disorder, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "15% (6/39) had myopia and 18% (7/39) experienced hearing loss"
    explanation: The frequency that makes the phenotype worth curating, and the grouping that shows the source does not place it under connective tissue involvement.
- discussion_id: tab2_syndromic_vs_nonsyndromic
  kind: CONTROVERSY
  attaches_to:
  - disease#
  prompt: >-
    Is TAB2 a non-syndromic congenital heart disease gene, as its MONDO and OMIM name
    implies, or a syndromic multisystem gene?
  rationale: >-
    The entity is named for congenital heart defects and is still listed by the
    American Heart Association as a cause of non-syndromic CHD, but the two largest
    cohorts published since both conclude it is syndromic. One found short stature,
    hypermobility and Noonan-like facies in roughly three quarters of patients and
    proposed the name TAB2-related syndrome; the other found extra-cardiac features in
    64% of individuals with single nucleotide variants and recommended TAB2 be listed
    as a syndromic CHD, cardiomyopathy and connective tissue disorder gene. This entry
    curates the syndromic phenotype while retaining the ontology label, and flags the
    mismatch rather than silently renaming the disease.
  evidence:
  - reference: PMID:34741306
    reference_title: "TAB2 variants cause cardiovascular heart disease, connective tissue disorder, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In light of our findings, we recommend that TAB2 be included on the list of genes that cause syndromic CHD, adult-onset cardiomyopathy, and connective tissue disorder."
    explanation: One cohort's explicit recommendation to reclassify the entity as syndromic.
  - reference: PMID:34456334
    reference_title: "TAB2 deletions and variants cause a highly recognisable syndrome with mitral valve disease, cardiomyopathy, short stature and hypermobility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TAB2 is associated not just with cardiac disease, but also with a distinct phenotype, with features overlapping with Noonan syndrome. We propose the name “TAB2-related syndrome”."
    explanation: The independent proposal of a syndromic name, which is the reason this entry carries TAB2-related syndrome as a synonym.

name: Congenital Heart Defects, Multiple Types, 2
creation_date: "2026-09-02T00:00:00Z"
description: >-
  Congenital heart defects, multiple types, 2 is the disorder caused by
  haploinsufficiency of TAB2. It was delineated from patients with 6q25.1 deletions
  whose smallest region of overlap contained TAB2, and confirmed by intragenic
  variants and by a balanced translocation disrupting the gene that cosegregated with
  familial congenital heart disease.

  TAB2 encodes TGF-beta activated kinase 1 binding protein 2, the adaptor that binds
  Lys63-linked polyubiquitin chains and links TNFR1 and other receptors to the TAK1
  signalling complex. Two consequences of losing it matter clinically and they are
  different from one another. In development, tab2 dosage is required for normal
  cardiac morphogenesis - titrated knockdown in zebrafish produces graded cardiac
  defects. In the mature myocardium, TAB2 restrains RIPK1: cardiomyocyte-specific
  deletion in mouse releases RIPK1 kinase activation and drives both apoptosis and
  necroptosis, producing dilated cardiomyopathy, and inactivating RIPK1 genetically
  rescues it. That is why a single gene defect yields both a structural malformation
  present at birth and a cardiomyopathy that can appear later, in a heart with no
  structural defect at all.

  The name is now the least accurate part of this entry. TAB2 was originally reported
  as a cause of non-syndromic congenital heart disease and is still listed that way by
  the American Heart Association, but the larger cohorts published since describe a
  multisystem disorder: about 80% of patients have cardiac disease, most often mitral
  valve defects or cardiomyopathy, while roughly 72% have short stature, 72% have
  joint hypermobility, and 80% have facial features suggestive of Noonan syndrome.
  Connective tissue involvement and developmental delay are common. Two groups have
  independently proposed reclassifying this as a syndromic entity, one of them
  proposing the name TAB2-related syndrome. The MONDO and OMIM label retained here
  reflects the original nomenclature rather than the current understanding.

  One management point follows directly from the mechanism and is easy to miss:
  because cardiomyopathy can develop without a structural defect and after a normal
  initial echocardiogram, patients with a TAB2 deletion should be screened
  longitudinally for systolic heart failure.
category: Mendelian
synonyms:
- CHTD2
- congenital heart malformation caused by mutation in TAB2
- TAB2-related syndrome
- 6q25.1 (TAB2) microdeletion syndrome
disease_term:
  preferred_term: congenital heart defects, multiple types, 2
  term:
    id: MONDO:0014000
    label: congenital heart defects, multiple types, 2
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous 6q25.1 deletions containing TAB2 and heterozygous intragenic TAB2
    variants produce the same phenotype, which is what establishes haploinsufficiency
    as the mechanism rather than a contiguous gene effect.
  evidence:
  - reference: PMID:34456334
    reference_title: "TAB2 deletions and variants cause a highly recognisable syndrome with mitral valve disease, cardiomyopathy, short stature and hypermobility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No substantial phenotypic differences were noted between patients with deletions and those with intragenic variants."
    explanation: Equivalence of deletion and intragenic variant phenotypes is the argument that the 6q25.1 deletion phenotype is TAB2 haploinsufficiency.
pathophysiology:
- name: TAB2 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygous deletion of 6q25.1 including TAB2, or a heterozygous loss-of-function
    variant within the gene, halves TAB2 dosage. The critical region was narrowed to
    850 kb on 6q25.1 and TAB2 identified within it; the causal role was then confirmed
    by intragenic missense variants and by a translocation disrupting TAB2 that
    cosegregated with familial congenital heart disease.
  genetic_context:
    gene:
      preferred_term: TAB2
      term:
        id: hgnc:17075
        label: TAB2
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:20493459
    reference_title: "Haploinsufficiency of TAB2 causes congenital heart defects in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype correlations in 12 patients carrying a chromosomal deletion on 6q delineated a critical 850 kb region on 6q25.1 harboring five genes."
    explanation: Establishes the critical deletion region from which TAB2 was identified.
  - reference: PMID:20493459
    reference_title: "Haploinsufficiency of TAB2 causes congenital heart defects in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, a balanced translocation was identified, cosegregating with familial CHD. Mapping of the breakpoints demonstrated that this translocation disrupts TAB2."
    explanation: A gene-disrupting translocation cosegregating with disease is independent evidence that TAB2 itself is causal.
  downstream:
  - target: Impaired TAK1 Complex Signaling
    causal_link_type: DIRECT
- name: Impaired TAK1 Complex Signaling
  biological_scale: MOLECULAR
  description: >-
    TAB2 is the adaptor that links TNFR1 and other receptors to the TAK1 complex by
    binding Lys63-linked polyubiquitin chains. Reduced TAB2 impairs that coupling. The
    consequence is not a single pathway output: TAB2 can act as a TAK1 activator or
    suppressor depending on cell type, and this node therefore branches into a
    developmental arm and a myocardial survival arm rather than into one effect.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:34990405
    reference_title: "TAB2 deficiency induces dilated cardiomyopathy by promoting RIPK1-dependent apoptosis and necroptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TGF-β–activated kinase 1 binding protein 2 (TAB2) is an adaptor protein linking signals from TNFR1 and other receptors to the TAK1 signaling complex by binding to Lys63-linked polyubiquitin chains"
    explanation: States the molecular function that is reduced by haploinsufficiency.
  - reference: PMID:34990405
    reference_title: "TAB2 deficiency induces dilated cardiomyopathy by promoting RIPK1-dependent apoptosis and necroptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Therefore, TAB2 may function as a TAK1 activator or suppressor depending on cell types or cellular contexts."
    explanation: Supports curating this node as branching rather than as a single directional pathway output.
  downstream:
  - target: Disturbed Cardiac Morphogenesis
    causal_link_type: DIRECT
  - target: RIPK1-Dependent Cardiomyocyte Death
    causal_link_type: DIRECT
  - target: Connective Tissue Matrix Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Disturbed Cardiac Morphogenesis
  biological_scale: TISSUE
  description: >-
    TAB2 is expressed in the developing human and zebrafish heart, and graded knockdown
    of tab2 in zebrafish embryos produces cardiac defects, establishing a
    dosage-sensitive developmental requirement. The resulting human lesions are
    predominantly valvular and outflow tract abnormalities together with septal
    defects.
  evidence:
  - reference: PMID:20493459
    reference_title: "Haploinsufficiency of TAB2 causes congenital heart defects in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a critical, dosage-sensitive role during development was demonstrated by the cardiac defects observed upon titrated knockdown of tab2 expression in zebrafish embryos"
    explanation: Demonstrates that the developmental requirement is dosage sensitive, which is what makes haploinsufficiency a plausible mechanism.
  downstream:
  - target: Abnormal mitral valve morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: RIPK1-Dependent Cardiomyocyte Death
  biological_scale: CELLULAR
  description: >-
    In the mature myocardium TAB2 suppresses RIPK1 kinase activation by mediating its
    phosphorylation at Ser321 through TAK1. Loss of TAB2 releases that restraint, and
    RIPK1 assembles either the RIPK1-FADD-caspase-8 apoptotic complex or the
    RIPK1-RIPK3 necroptotic complex. This is a survival mechanism operating in the
    formed heart, which is why cardiomyopathy can arise without any structural defect.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: necroptotic process
    term:
      id: GO:0070266
      label: necroptotic process
    modifier: INCREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:34990405
    reference_title: "TAB2 deficiency induces dilated cardiomyopathy by promoting RIPK1-dependent apoptosis and necroptosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cardiomyocyte-specific deletion of Tab2 in mice triggered dilated cardiomyopathy with massive apoptotic and necroptotic cell death."
    explanation: Establishes the cell-death mechanism and its cardiomyopathy consequence in a cardiomyocyte-restricted model.
  - reference: PMID:34990405
    reference_title: "TAB2 deficiency induces dilated cardiomyopathy by promoting RIPK1-dependent apoptosis and necroptosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TAB2 critically mediates RIPK1 phosphorylation at Ser321 via a TAK1-dependent mechanism, which prevents RIPK1 kinase activation and the formation of RIPK1-FADD-caspase-8 apoptotic complex or RIPK1-RIPK3 necroptotic complex"
    explanation: Specifies the molecular step by which TAB2 restrains RIPK1, which is the mechanism lost here.
  downstream:
  - target: Dilated cardiomyopathy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34990405
      reference_title: "TAB2 deficiency induces dilated cardiomyopathy by promoting RIPK1-dependent apoptosis and necroptosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "genetic inactivation of RIPK1 with Ripk1-K45A knockin effectively rescued cardiac remodeling and dysfunction in Tab2-deficient mice"
      explanation: Genetic rescue by blocking RIPK1 establishes that the cardiomyopathy is caused by this cell-death route rather than merely accompanied by it.
- name: Connective Tissue Matrix Involvement
  biological_scale: TISSUE
  description: >-
    The extra-cardiac half of the phenotype - short stature, joint hypermobility,
    abnormal skin texture and the facial gestalt - clusters as a connective tissue
    disorder, and most individuals with TAB2 single nucleotide variants present that
    way. The molecular route from reduced TAK1 signalling to matrix involvement is not
    established, so this node is curated as the tissue-level observation it is rather
    than as a mechanism, and its outgoing edges carry unknown intermediates.
  evidence:
  - reference: PMID:34741306
    reference_title: "TAB2 variants cause cardiovascular heart disease, connective tissue disorder, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most commonly co-occurring features with CHD or cardiomyopathy were facial dysmorphism, skeletal and connective tissue defects and most subjects with TAB2 variants present as a connective tissue disorder."
    explanation: Establishes the connective tissue phenotype as the dominant extra-cardiac cluster, which is what this node names.
  downstream:
  - target: Short stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Joint hypermobility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormality of connective tissue
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal facial shape
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

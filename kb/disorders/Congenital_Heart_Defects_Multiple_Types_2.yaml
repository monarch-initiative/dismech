discussions:
- discussion_id: tab2_syndromic_vs_nonsyndromic
  kind: CONTROVERSY
  attaches_to:
  - disease#
  prompt: >-
    Is TAB2 a non-syndromic congenital heart disease gene, as its MONDO and OMIM name
    implies, or a syndromic multisystem gene?
  rationale: >-
    The entity is named for congenital heart defects and is still listed by the
    American Heart Association as a cause of non-syndromic CHD, but the two largest
    cohorts published since both conclude it is syndromic. One found short stature,
    hypermobility and Noonan-like facies in roughly three quarters of patients and
    proposed the name TAB2-related syndrome; the other found extra-cardiac features in
    64% of individuals with single nucleotide variants and recommended TAB2 be listed
    as a syndromic CHD, cardiomyopathy and connective tissue disorder gene. This entry
    curates the syndromic phenotype while retaining the ontology label, and flags the
    mismatch rather than silently renaming the disease.
  evidence:
  - reference: PMID:34741306
    reference_title: "TAB2 variants cause cardiovascular heart disease, connective tissue disorder, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In light of our findings, we recommend that TAB2 be included on the list of genes that cause syndromic CHD, adult-onset cardiomyopathy, and connective tissue disorder."
    explanation: One cohort's explicit recommendation to reclassify the entity as syndromic.
  - reference: PMID:34456334
    reference_title: "TAB2 deletions and variants cause a highly recognisable syndrome with mitral valve disease, cardiomyopathy, short stature and hypermobility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TAB2 is associated not just with cardiac disease, but also with a distinct phenotype, with features overlapping with Noonan syndrome. We propose the name “TAB2-related syndrome”."
    explanation: The independent proposal of a syndromic name, which is the reason this entry carries TAB2-related syndrome as a synonym.

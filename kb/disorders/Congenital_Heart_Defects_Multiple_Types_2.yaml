    snippet: "we performed mutation analysis of TAB2 in 402 patients with a CHD, which revealed two evolutionarily conserved missense mutations"
    explanation: Documents the intragenic variant evidence that confirmed TAB2 as the causal gene in the critical region.
animal_models:
- name: Cardiomyocyte-specific Tab2 knockout mouse
  species: Mouse
  genotype: Tab2 fl/fl; alphaMHC-MerCreMer, tamoxifen-induced
  publication: PMID:34990405
  description: >-
    Tamoxifen-inducible cardiomyocyte-restricted deletion of Tab2 in the adult mouse
    heart. Because deletion is postnatal and cardiomyocyte-limited, this model isolates
    the myocardial survival arm of TAB2 function from its developmental arm.
  modeled_mechanisms:
  - target: RIPK1-Dependent Cardiomyocyte Death
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Deletion produces RIPK1 kinase activation with apoptotic and necroptotic
      cardiomyocyte death, ventricular dilation, fibrosis and contractile dysfunction,
      and the phenotype is rescued by genetically inactivating RIPK1.
    limitations: >-
      The model is a homozygous conditional knockout in adult cardiomyocytes, whereas
      human disease is constitutional heterozygous haploinsufficiency. It therefore
      speaks to the cardiomyopathy arm only and cannot model the developmental cardiac
      malformations, and the severity is greater than the human course.
    evidence:
    - reference: PMID:34990405
      reference_title: "TAB2 deficiency induces dilated cardiomyopathy by promoting RIPK1-dependent apoptosis and necroptosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cardiomyocyte-specific deletion of Tab2 in mice triggered dilated cardiomyopathy with massive apoptotic and necroptotic cell death."
      explanation: Supports treating this model as informative for the cardiomyocyte death node.
  - target: Dilated cardiomyopathy
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Genetic inactivation of RIPK1 kinase activity rescued cardiac remodeling and
      dysfunction, identifying RIPK1 as the effector and a candidate therapeutic target.
    limitations: >-
      The rescue is genetic (Ripk1-K45A knockin) rather than pharmacological, and has
      not been tested in humans or against constitutional haploinsufficiency.
    evidence:
    - reference: PMID:34990405
      reference_title: "TAB2 deficiency induces dilated cardiomyopathy by promoting RIPK1-dependent apoptosis and necroptosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Strikingly, genetic inactivation of RIPK1 with Ripk1-K45A knockin effectively rescued cardiac remodeling and dysfunction in Tab2-deficient mice."
      explanation: Documents the rescue arm, which is what establishes RIPK1 as causal rather than correlated.
- name: Zebrafish tab2 morphant
  species: Zebrafish
  genotype: tab2 morpholino knockdown, titrated
  publication: PMID:20493459
  description: >-
    Graded morpholino knockdown of tab2 in zebrafish embryos, used to test dosage
    sensitivity during cardiac development.
  modeled_mechanisms:
  - target: Disturbed Cardiac Morphogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Titrated reduction of tab2 expression produces cardiac defects, supporting a
      dosage-sensitive developmental requirement.
    limitations: >-
      Morpholino knockdown is transient and subject to off-target effects, and the
      zebrafish heart is two-chambered, so specific human lesions such as mitral valve
      disease cannot be modelled.
    evidence:
    - reference: PMID:20493459
      reference_title: "Haploinsufficiency of TAB2 causes congenital heart defects in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a critical, dosage-sensitive role during development was demonstrated by the cardiac defects observed upon titrated knockdown of tab2 expression in zebrafish embryos"
      explanation: Supports treating this model as informative for the developmental morphogenesis node.
diagnosis:
- name: Echocardiography
  description: >-
    Echocardiography defines the structural lesion and the functional defect. Because
    cardiomyopathy can appear after a normal initial study, a single echocardiogram
    establishes the baseline rather than excluding disease.
  diagnosis_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:28464518
    reference_title: "6q25.1 (TAB2) microdeletion syndrome: Congenital heart defects and cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that patients with a TAB2 deletion be screened longitudinally for systolic heart failure, even if an initial echocardiogram is normal."
    explanation: States both the modality and the reason a single normal study does not discharge the patient.
- name: Copy-number and sequence testing
  description: >-
    Both a 6q25.1 deletion and an intragenic TAB2 variant produce the same phenotype,
    so a testing strategy that looks for only one of them will miss half the cases.
    Chromosomal microarray detects the deletions, which range from 1.68 to 14.31 Mb;
    sequencing detects the truncating variants.
  evidence:
  - reference: PMID:34456334
    reference_title: "TAB2 deletions and variants cause a highly recognisable syndrome with mitral valve disease, cardiomyopathy, short stature and hypermobility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This identified 11 patients with a deletion containing TAB2 (size 1.68-14.31 Mb) and 14 patients from six families with novel truncating TAB2 variants."
    explanation: Documents that both lesion classes occur at comparable frequency, which is what makes a two-modality testing strategy necessary.
  - reference: PMID:34456334
    reference_title: "TAB2 deletions and variants cause a highly recognisable syndrome with mitral valve disease, cardiomyopathy, short stature and hypermobility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No substantial phenotypic differences were noted between patients with deletions and those with intragenic variants."
    explanation: Phenotype does not discriminate between the two lesion classes, so it cannot be used to choose the test.
treatments:
- name: Longitudinal cardiac surveillance
  description: >-
    Because cardiomyopathy can develop in the absence of a structural defect and after
    a normal initial echocardiogram, patients with a TAB2 deletion should be screened
    longitudinally for systolic heart failure.
  treatment_term:
    preferred_term: longitudinal echocardiographic monitoring for systolic heart failure
  notes: >-
    Deliberately left unbound. The TreatmentActionTerm enum is rooted at NCIT:C25218
    (Clinical Intervention or Procedure); NCIT:C61256 Monitoring is not reachable from
    it and NCIT:C15406 Cancer Screening names the wrong thing. No term beats a wrong
    one, so the concept is carried in preferred_term.
  evidence:
  - reference: PMID:28464518
    reference_title: "6q25.1 (TAB2) microdeletion syndrome: Congenital heart defects and cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that patients with a TAB2 deletion be screened longitudinally for systolic heart failure, even if an initial echocardiogram is normal."
    explanation: States the surveillance recommendation and the reason a single normal echocardiogram does not discharge the patient.
  target_mechanisms:
  - target: Dilated cardiomyopathy
    description: >-
      Surveillance detects the cardiomyopathy phenotype earlier; it does not modify the
      underlying mechanism.
- name: Valve repair or replacement
  description: >-
    Surgical management of the valvular disease that dominates the structural
    phenotype, including the polyvalvular involvement seen in over half of
    individuals.

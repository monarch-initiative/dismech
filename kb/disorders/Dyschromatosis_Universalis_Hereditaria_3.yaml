discussions:
- discussion_id: abcb6_inner_ear_model_vs_human
  prompt: >-
    Do the inner-ear findings of Abcb6-deficient mice and zebrafish correspond to hearing loss in
    people with ABCB6-related dyschromatosis universalis hereditaria?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - genetic#ABCB6
  rationale: >-
    Abcb6 knockout mice have a raised auditory brainstem response threshold and reduced hearing
    sensitivity, and zebrafish morphants show an inner-ear phenotype that human ABCB6 mRNA partially
    rescues, so the model evidence for a developmental role in the inner ear is positive and
    specific. The human side is not: high-frequency hearing loss is listed among the findings
    occasionally reported in dyschromatosis universalis hereditaria as a whole, a concept that is
    genetically heterogeneous, and no hearing phenotype is reported for an ABCB6-genotyped patient in
    the sources consulted here. This is a model-versus-human question rather than an absence of
    evidence, which is why it is recorded as HUMAN_MODEL_MISMATCH and why no hearing phenotype is
    curated on this entry. Resolving it needs audiometry in genotyped ABCB6 DUH patients.
  evidence:
  - reference: PMID:39557842
    reference_title: The role of ATP-binding Cassette subfamily B member 6 in the inner ear.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Further, we show that Abcb6 knockout mice exhibit an increased auditory brainstem response
      threshold, resulting in reduced hearing sensitivity.
    explanation: The mouse hearing deficit that makes the question worth asking.
  - reference: PMID:39557842
    reference_title: The role of ATP-binding Cassette subfamily B member 6 in the inner ear.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Co-injecting morpholinos with human ABCB6 mRNA partially rescues the morphant phenotype,
      suggesting that Abcb6 plays a developmental role in inner ear structures.
    explanation: >-
      The zebrafish arm, with a human-mRNA rescue, which is what makes the model result specific to
      this gene rather than a nonspecific morpholino effect.
  - reference: PMID:39557842
    reference_title: The role of ATP-binding Cassette subfamily B member 6 in the inner ear.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Dyschromatosis universalis hereditaria can also present with hearing loss.
    explanation: >-
      The human side of the question. INDIRECT and BACKGROUND because the sentence is this paper's
      framing of the clinical literature on dyschromatosis universalis hereditaria as a whole, which
      is genetically heterogeneous, rather than a hearing result in an ABCB6-genotyped patient.
notes: >-
  This entry covers the ABCB6 subtype only. The parent concept, dyschromatosis universalis
  hereditaria, is genetically heterogeneous, so the prevalence figure recorded here is for the parent
  and is an upper bound for this subtype.

  MONDO:0014169 is discussed in kb/disorders/Microphthalmia_with_Coloboma.yaml, which records that
  ABCB6's better-attested disease is this pigmentary disorder and explicitly claims nothing about
  pigmentary skin disease. The two entries are therefore complementary rather than overlapping, and
  the shared gene is real biology: the ocular examination of DUH carriers reported in PMID:24498303
  is recorded here as a phenotype.

  No GeneReviews chapter covers this disease, by disease name or through ABCB6.

  The mechanism by which a heterozygous missense allele produces dominant disease is not settled.
  PMID:24498303 proposes a dominant-negative effect, reasoning that its two alleles sit in the
  transmembrane domain and change the transporter's subcellular location rather than its expression
  level, while the ClinGen assertion transcribed above records the mechanism of disease as currently
  unknown. functional_impact_category is set to LOSS_OF_FUNCTION on the narrower claim that the
  mislocalised transporter does not perform its activity, which the G579E rescue failure supports
  directly; it is not a claim about how one defective allele dominates a normal one.

  The deep-research report for this entry is
  research/Dyschromatosis_Universalis_Hereditaria_3-deep-research-claude_code.md.

  Two further allele reports could not be used. PMID:25288164 and PMID:30430618 each describe novel
  ABCB6 variants in dyschromatosis universalis hereditaria, and both resolve to real records, but
  neither serves an abstract or full text that can be fetched here, so there is no sentence to quote
  and their variants are not curated. The ClinGen evidence summary counts nine missense variants
  across six publications, so the variant list in this entry is not complete.

  The zebrafish model carries no gene identifier. Zebrafish has two ABCB6 paralogs: NCBI Gene
  queries `abcb6[Gene Name] AND "Danio rerio"[Organism]` and
  `abcb6*[Gene Name] AND "Danio rerio"[Organism]` return abcb6a (NCBIGene:564067,
  ZFIN:ZDB-GENE-050517-9) and abcb6b (NCBIGene:100004801, ZFIN:ZDB-GENE-070912-584). PMID:24498303
  names its target only as the zebrafish ABCB6 homolog, written zABCB6, and places the morpholino
  design in supplementary Figure S5 of Text S1, so the paper's own text does not say which paralog
  the exon 6 and exon 8 morpholinos target. Binding either accession would be a guess between two
  real genes.

  The ocular findings are taken from the full text of PMID:24498303 rather than its abstract. The
  abstract reports only that ocular abnormalities were found in the DUH carriers; the full text names
  them, as an iris defect in two carriers of one family and a raised intraocular pressure in a third,
  with no eye abnormality in the examined carrier of a second family. Neither finding is coloboma,
  the ABCB6 eye phenotype that motivated the examination, and the same examination explicitly found
  no microphthalmia or anophthalmia, so this entry does not treat the DUH eye findings as the ocular
  ABCB6 phenotype under another name. The iris binding stays at HP:0000525 because HPO has no term
  for iris pitting.

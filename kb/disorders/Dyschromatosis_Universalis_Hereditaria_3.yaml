animal_models:
- name: zABCB6 morpholino knockdown zebrafish
  species: Zebrafish
  genotype: Morpholino knockdown targeting exons 6 and 8 of the zebrafish ABCB6 homolog
  description: >-
    Morpholinos against exons 6 and 8 of the zebrafish ABCB6 homolog, which correspond to exons 4 and
    7 of human ABCB6. Knockdown reduces the number of mature melanocytes in the head region at 5
    dpf, and co-injecting full-length human ABCB6 mRNA partially rescues that phenotype. No gene
    identifier is recorded because zebrafish has two ABCB6 paralogs and the paper does not say which
    one its morpholinos target; see the entry notes for the searches behind that statement.
  modeled_mechanisms:
  - target: Failure of Early Melanosome Maturation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Knockdown reduces mature melanocyte number, supporting a requirement for the transporter in
      melanocyte maturation.
    limitations: >-
      A morpholino knockdown models absence of the transporter, whereas the human disease is caused
      by heterozygous missense alleles that are mislocalised rather than absent. The readout is
      mature melanocyte number, not melanosome maturation, and the model does not reproduce the
      mottled pattern that defines the human disease.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is the number of mature melanocytes in a developing embryo. The node's
        quantity is the maturation state of melanosomes inside melanocytes.
    evidence:
    - reference: PMID:24498303
      reference_title: Genome-wide linkage, exome sequencing and functional analyses identify ABCB6 as the pathogenic gene of dyschromatosis universalis hereditaria.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the knockdown of ABCB6 expression was shown to cause the reduction of the number of mature
        melanocytes in zebrafish
      explanation: States the knockdown phenotype this link rests on.

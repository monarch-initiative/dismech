genetic:
- name: ABCB6
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ABCB6
    term:
      id: hgnc:47
      label: ABCB6
  notes: >-
    ABCB6 encodes an ATP-binding cassette transporter found on the membrane of early melanosomes,
    lysosomes and an endosome-like compartment. Reported DUH alleles are heterozygous missense
    changes and one frameshift. The same gene causes ocular coloboma, and the two phenotypes are
    linked rather than independent: ophthalmological examination of DUH mutation carriers found
    ocular abnormalities in them.
    ClinGen's General Inborn Errors of Metabolism panel rates this pair Moderate, reapproved under
    SOP12 on 2026-06-12 after a literature search found no additional data; that assertion is
    transcribed in gene_disease_validity below. relationship_type is CAUSATIVE despite the Moderate
    tier, on the strength of cosegregation in large pedigrees, absence from more than 1,900
    ethnically matched controls across two studies, and the zebrafish and cell-localisation work.
  gene_disease_validity:
  - validity_classification: MODERATE
    classified_by: CLINGEN
    external_id: CGGV:assertion_93bbbc0a-5f6f-4d80-b560-3265d7b89ed3-2026-06-12T160000.000Z
    evidence:

animal_models:
- name: ABCB6 knockout mouse
  species: Mouse
  genotype: Abcb6 knockout
  publication: PMID:29940187
  genes:
  - preferred_term: Abcb6
    term:
      id: MGI:1921354
      label: Abcb6
  description: >-
    A constitutive Abcb6 knockout mouse. Morphological analysis of its retinal pigment epithelium
    shows significantly fewer melanosomes, which is the in vivo counterpart of the melanosome
    maturation block that the siRNA and rescue experiments establish in cells.
  modeled_mechanisms:
  - target: Failure of Early Melanosome Maturation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Loss of the transporter reduces melanosome number in a pigmented epithelium in vivo,
      supporting the requirement for ABCB6 in melanosome maturation.
    limitations: >-
      The readout is melanosome number in the retinal pigment epithelium, not in skin melanocytes,
      and a knockout models absence of the transporter whereas the human disease is caused by
      heterozygous missense alleles that are mislocalised rather than absent. No mottled skin
      phenotype is reported for this mouse.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is melanosome number in the retinal pigment epithelium. The node's
        quantity is the maturation state of melanosomes inside skin melanocytes.
    evidence:
    - reference: PMID:29940187
      reference_title: ABCB6 Resides in Melanosomes and Regulates Early Steps of Melanogenesis Required for PMEL Amyloid Matrix Formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In line with the impairment of PMEL matrix formation in the absence of ABCB6, morphological
        analysis of the retinal pigment epithelium of ABCB6 knockout mice revealed a significant
        decrease of melanosome numbers.
      explanation: The in vivo melanosome deficit this link rests on.
- name: zABCB6 morpholino knockdown zebrafish
  species: Zebrafish
  genotype: Morpholino knockdown targeting exons 6 and 8 of the zebrafish ABCB6 homolog
  description: >-
    Morpholinos against exons 6 and 8 of the zebrafish ABCB6 homolog, which correspond to exons 4 and
    7 of human ABCB6. Knockdown reduces the number of mature melanocytes in the head region at 5
    dpf, and co-injecting full-length human ABCB6 mRNA partially rescues that phenotype. No gene
    identifier is recorded because zebrafish has two ABCB6 paralogs and the paper does not say which
    one its morpholinos target; see the entry notes for the searches behind that statement.
  modeled_mechanisms:
  - target: Failure of Early Melanosome Maturation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Knockdown reduces mature melanocyte number, supporting a requirement for the transporter in
      melanocyte maturation.
    limitations: >-
      A morpholino knockdown models absence of the transporter, whereas the human disease is caused
      by heterozygous missense alleles that are mislocalised rather than absent. The readout is
      mature melanocyte number, not melanosome maturation, and the model does not reproduce the
      mottled pattern that defines the human disease.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is the number of mature melanocytes in a developing embryo. The node's
        quantity is the maturation state of melanosomes inside melanocytes.
    evidence:
    - reference: PMID:24498303
      reference_title: Genome-wide linkage, exome sequencing and functional analyses identify ABCB6 as the pathogenic gene of dyschromatosis universalis hereditaria.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the knockdown of ABCB6 expression was shown to cause the reduction of the number of mature
        melanocytes in zebrafish
      explanation: States the knockdown phenotype this link rests on.

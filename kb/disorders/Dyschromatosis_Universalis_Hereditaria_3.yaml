- category: Ophthalmologic
  name: Ocular abnormality in ABCB6 variant carriers
  description: >-
    Ophthalmological examination of DUH carriers of ABCB6 mutations found ocular abnormalities. The
    source reports that finding without naming the abnormalities, so the binding stays at the
    organ-system level and is not narrowed to coloboma, even though coloboma is the ABCB6 ocular
    phenotype that prompted the examination. The finding is not constant: a separate
    21-affected-member family carrying p.Gln555Lys was examined and no ocular coloboma was found in
    any of them.
  phenotype_term:
    preferred_term: Ocular abnormality
    term:
      id: HP:0000478
      label: Abnormality of the eye
    coarse_binding_basis: SOURCE_UNSPECIFIED
  evidence:
  - reference: PMID:24498303
    reference_title: Genome-wide linkage, exome sequencing and functional analyses identify ABCB6 as the pathogenic gene of dyschromatosis universalis hereditaria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the involvement of ABCB6 mutations in coloboma, we performed ophthalmological examination
      of the DUH carriers of ABCB6 mutations and found ocular abnormalities in them.
    explanation: >-
      Reports ocular abnormalities in DUH carriers without specifying them, which is why the binding
      is left coarse.
  - reference: PMID:24224009
    reference_title: Novel mutations of ABCB6 associated with autosomal dominant dyschromatosis universalis hereditaria.
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the affected members in this family was found to have skin cancer or ocular coloboma.
    explanation: >-
      A second DUH family with a different ABCB6 allele had no ocular coloboma, so eye involvement
      is not a constant feature. Recorded as INDIRECT because the sentence reports the absence of
      coloboma specifically rather than the absence of the unspecified ocular abnormalities the
      supporting item describes.

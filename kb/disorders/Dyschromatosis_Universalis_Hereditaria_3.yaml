name: Dyschromatosis Universalis Hereditaria 3
creation_date: "2026-11-18T11:48:17Z"
category: Mendelian
description: >-
  Dyschromatosis universalis hereditaria 3 (DUH3) is an autosomal dominant pigmentary genodermatosis
  caused by heterozygous missense or frameshift variants in ABCB6, which encodes an ATP-binding
  cassette transporter of the melanosome and endosome membrane. Irregular hyperpigmented and
  hypopigmented macules appear in a mottled pattern over the trunk and limbs in infancy or early
  childhood, spread, and then stop progressing after adolescence. The two kinds of macule sit side by
  side because melanosome maturation fails unevenly: melanocytes under hyperpigmented skin carry more
  mature melanized melanosomes, while those under hypopigmented skin carry empty immature ones.
  Disease variants mislocalise the transporter, which is normally found in an endosome-like
  compartment and at dendrite tips, to the Golgi. ABCB6 variants also cause ocular coloboma, and
  ophthalmological examination of DUH carriers found ocular abnormalities, so the two phenotypes are
  connected rather than separate uses of one gene. The skin disease is cosmetic; no treatment is
  established.

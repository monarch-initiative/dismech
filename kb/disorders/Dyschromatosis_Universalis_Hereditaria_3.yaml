      explanation: The ClinGen gene-disease validity row for this gene and this disease.
  evidence:
  - reference: PMID:23519333
    reference_title: Mutations in ABCB6 cause dyschromatosis universalis hereditaria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our studies identified ABCB6 as the first pathogenic gene associated with DUH.
    explanation: The founding gene identification.
  - reference: PMID:24498303
    reference_title: Genome-wide linkage, exome sequencing and functional analyses identify ABCB6 as the pathogenic gene of dyschromatosis universalis hereditaria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genome-wide linkage (assuming autosomal dominant inheritance mode) and exome sequencing
      analyses identified ABCB6 as the disease candidate gene by discovering a coding mutation
      (c.1358C>T; p.Ala453Val) that co-segregates with the disease phenotype.
    explanation: Independent linkage and exome replication with cosegregation.
  variants:
  - name: p.Leu356Pro
    description: Missense variant c.1067T>C in exon 3, found in a five-generation Chinese DUH family.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23519333
      reference_title: Mutations in ABCB6 cause dyschromatosis universalis hereditaria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Exome sequencing identified a c.1067T>C (p.Leu356Pro) mutation in exon 3 of ABCB6 (ATP-binding
        cassette subfamily B, member 6) in the DUH family.
      explanation: Names the founding allele and the family it was found in.
  - name: p.Ala453Val
    description: >-
      Missense variant c.1358C>T in exon 7, cosegregating in one Chinese family and confirmed in
      further families by Sanger sequencing.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24498303
      reference_title: Genome-wide linkage, exome sequencing and functional analyses identify ABCB6 as the pathogenic gene of dyschromatosis universalis hereditaria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genome-wide linkage (assuming autosomal dominant inheritance mode) and exome sequencing
        analyses identified ABCB6 as the disease candidate gene by discovering a coding mutation
        (c.1358C>T; p.Ala453Val) that co-segregates with the disease phenotype.
      explanation: Names this allele and its cosegregation with the phenotype.
  - name: p.Ser322Lys
    description: >-
      Missense variant c.964A>C in exon 4, discovered in a second family where it was heterozygous
      in all seven affected and absent in all seven unaffected members.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24498303
      reference_title: Genome-wide linkage, exome sequencing and functional analyses identify ABCB6 as the pathogenic gene of dyschromatosis universalis hereditaria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Further mutation analysis of ABCB6 in four other DUH families and two sporadic cases by
        Sanger sequencing confirmed the mutation (c.1358C>T; p.Ala453Val) and discovered a second,
        co-segregating coding mutation (c.964A>C; p.Ser322Lys) in one of the four families.
      explanation: Reports this allele cosegregating in a second family.
  - name: p.Ser170Gly
    description: >-
      Missense variant c.508A>G in exon 1, found by mutational screening of sporadic DUH patients
      rather than in a pedigree, so it carries no cosegregation evidence.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23519333
      reference_title: Mutations in ABCB6 cause dyschromatosis universalis hereditaria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Two additional missense mutations, c.508A>G (p.Ser170Gly) in exon 1 and c.1736G>A
        (p.Gly579Glu) in exon 12 of ABCB6, were found in two out of six patients by mutational
        screening using sporadic DUH patients.
      explanation: Names this allele and the sporadic-patient screen it came from.
  - name: p.Gly382Arg
    description: >-
      Missense variant c.1144G>A, reported in a Saudi mother and son, which extends the allelic
      spectrum beyond the Chinese families that defined it.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:35024399
      reference_title: A novel mutation in ABCB6 associated with dyschromatosis universalis hereditaria in a Saudi family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here we describe 2 new cases of DUH in a Saudi mother and her son associated with a novel
        mutation (c.1144G>A; p.G382R) in the ABCB6 gene.
      explanation: Names the allele and the family it was found in.
  - name: c.459delC
    description: >-
      The one reported frameshift allele, found in an unrelated sporadic patient and absent from
      455 ethnically matched controls. Written g.776delC at the genomic level by the source.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24224009
      reference_title: Novel mutations of ABCB6 associated with autosomal dominant dyschromatosis universalis hereditaria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        An additional mutation (g.776 delC, c.459 delC) in ABCB6 was found in an unrelated sporadic
        patient.
      explanation: The only frameshift allele reported for this disease.
  - name: p.Gln555Lys
    description: >-
      Missense variant c.1663C>A, cosegregating perfectly with the skin phenotype in a large family
      and absent from 455 ethnically matched controls.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24224009
      reference_title: Novel mutations of ABCB6 associated with autosomal dominant dyschromatosis universalis hereditaria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A missense mutation (c.1663 C>A, p.Gln555Lys) in ABCB6 was identified in this family by exome
        and Sanger sequencing. The mutation perfectly cosegregated with the skin phenotype.
      explanation: Cosegregation of a further missense allele.
  - name: p.Gly579Glu
    description: >-
      Missense variant c.1736G>A in exon 12. In a melanocytic cell line it fails to restore PMEL
      fibril formation, so it is the DUH allele with a direct functional readout.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:29940187
      reference_title: ABCB6 Resides in Melanosomes and Regulates Early Steps of Melanogenesis Required for PMEL Amyloid Matrix Formation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        PMEL fibril formation and normal maturation of pigmented melanosomes could be restored by the
        overexpression of wild-type ABCB6 but not by variants containing an inactivating catalytic
        mutation (K629M) or the G579E DUH mutation.
      explanation: A rescue experiment showing this DUH allele is non-functional for melanosome maturation.

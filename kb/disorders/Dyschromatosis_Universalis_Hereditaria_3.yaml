differential_diagnoses:
- name: Dyschromatosis symmetrica hereditaria
  description: >-
    Also called reticulate acropigmentation of Dohi, caused by ADAR1 variants and distinguished by
    its acral rather than generalized distribution.
  distinguishing_features:
  - Acral distribution rather than trunk and extremities.
  evidence:
  - reference: PMID:37634201
    reference_title: Dyschromatosis universalis hereditaria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reticulate pigmentary dyschromatoses primarily include dyschromatosis universalis hereditaria
      (DUH), dyschromatosis symmetrica hereditaria (DSH) (Reticulate acropigmentation of Dohi), and
      unilateral dermatomal pigmentary dermatosis, which differ in their patterns of distribution.
    explanation: Separates the reticulate dyschromatoses by distribution.
- name: Other genetic subtypes of dyschromatosis universalis hereditaria
  description: >-
    DUH1 maps to 6q24.2-q25.2 without a named gene in the source consulted, DUH2 is autosomal
    recessive and associated with KITLG, and SASH1 and PER3 are also named. Only the ABCB6 subtype is
    curated here.
  distinguishing_features:
  - Variants in a gene other than ABCB6.
  - Autosomal recessive inheritance in DUH2.
  evidence:
  - reference: PMID:37634201
    reference_title: Dyschromatosis universalis hereditaria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most common gene involved in DUH is ABCB6, while the other genes include SASH 1, PER 3, and
      KITLG (DUH type 2).
    explanation: Names the other genes that cause clinically similar disease.
notes: >-
  This entry covers the ABCB6 subtype only. The parent concept, dyschromatosis universalis
  hereditaria, is genetically heterogeneous, so the prevalence figure recorded here is for the parent
  and is an upper bound for this subtype.

  MONDO:0014169 is discussed in kb/disorders/Microphthalmia_with_Coloboma.yaml, which records that
  ABCB6's better-attested disease is this pigmentary disorder and explicitly claims nothing about
  pigmentary skin disease. The two entries are therefore complementary rather than overlapping, and
  the shared gene is real biology: the ocular examination of DUH carriers reported in PMID:24498303
  is recorded here as a phenotype.

  No GeneReviews chapter covers this disease, by disease name or through ABCB6.

  The zebrafish model carries no gene identifier. PMID:24498303 names its target only as the
  zebrafish ABCB6 homolog, written zABCB6, and an Alliance gene search for abcb6 returned nothing,
  so no ZFIN or NCBIGene accession could be read from a source. The field is left out rather than
  filled with a guess.

  The ocular phenotype is bound at the organ-system level with coarse_binding_basis
  SOURCE_UNSPECIFIED. The source states that ocular abnormalities were found without saying which,
  and narrowing the binding to coloboma would assert something it does not say, even though coloboma
  is the ABCB6 eye phenotype that motivated the examination.

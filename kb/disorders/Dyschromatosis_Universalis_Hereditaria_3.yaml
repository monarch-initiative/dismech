  downstream:
  - target: Mislocalisation of ABCB6 to the Golgi Apparatus
    causal_link_type: DIRECT
- name: Mislocalisation of ABCB6 to the Golgi Apparatus
  biological_scale: CELLULAR
  description: >-
    Wild-type ABCB6 sits in an endosome-like compartment and at melanocyte dendrite tips. Disease
    variants are retained in the Golgi instead, so the transporter never reaches the membrane where
    it acts.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  evidence:
  - reference: PMID:23519333
    reference_title: Mutations in ABCB6 cause dyschromatosis universalis hereditaria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Examination of subcellular localization of wild-type ABCB6 in a B16 mouse melanoma cell line
      revealed that it is localized to the endosome-like compartment and dendrite tips, whereas
      disease-causing mutations of ABCB6 resulted in its retention in the Golgi apparatus.
    explanation: Shows the trafficking defect for disease alleles against wild type.
  downstream:
  - target: Failure of Early Melanosome Maturation
    causal_link_type: DIRECT
- name: Failure of Early Melanosome Maturation
  biological_scale: CELLULAR
  description: >-
    ABCB6 is required for the early steps of melanogenesis that build the PMEL amyloid matrix on
    which melanin is deposited. Without it, PMEL amyloidogenesis is impaired and pigmented
    melanosomes accumulate aberrant multilamellar material.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  biological_processes:
  - preferred_term: melanosome organization
    term:
      id: GO:0032438
      label: melanosome organization
    modifier: DECREASED
  evidence:
  - reference: PMID:29940187
    reference_title: ABCB6 Resides in Melanosomes and Regulates Early Steps of Melanogenesis Required for PMEL Amyloid Matrix Formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Depletion of ABCB6 by siRNA impaired PMEL amyloidogenesis in early melanosomes and induced
      aberrant accumulation of multilamellar aggregates in pigmented melanosomes.
    explanation: Loss of ABCB6 blocks the early melanosome step directly.
  - reference: PMID:29940187
    reference_title: ABCB6 Resides in Melanosomes and Regulates Early Steps of Melanogenesis Required for PMEL Amyloid Matrix Formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In line with the impairment of PMEL matrix formation in the absence of ABCB6, morphological
      analysis of the retinal pigment epithelium of ABCB6 knockout mice revealed a significant
      decrease of melanosome numbers.
    explanation: A knockout mouse shows fewer melanosomes, supporting the same step in vivo.
  downstream:
  - target: Uneven Melanosome Content Between Neighbouring Melanocytes
    causal_link_type: DIRECT
- name: Uneven Melanosome Content Between Neighbouring Melanocytes
  biological_scale: TISSUE
  description: >-
    The maturation block does not fall equally on every melanocyte, which is what makes the skin
    mottled rather than uniformly pale. Melanocytes under hyperpigmented skin hold more mature
    melanized melanosomes; those under hypopigmented skin hold empty immature ones.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  biological_processes:
  - preferred_term: pigmentation
    term:
      id: GO:0043473
      label: pigmentation
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:24224009
    reference_title: Novel mutations of ABCB6 associated with autosomal dominant dyschromatosis universalis hereditaria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathological analysis showed melanocytes in normal control's skin tissue and the
      hyperpigmented area contained more melanized, mature melanosomes than those within the
      hypopigmented areas. Empty immature melanosomes were found in the hypopigmented melanocytes.
    explanation: >-
      Patient skin histology showing the two macule types differ by melanosome maturity, which is the
      cellular basis of the mottled pattern.
  downstream:
  - target: Mottled pigmentation
    causal_link_type: DIRECT
  - target: Macular hyperpigmentation
    causal_link_type: DIRECT
  - target: Hypopigmented macule
    causal_link_type: DIRECT

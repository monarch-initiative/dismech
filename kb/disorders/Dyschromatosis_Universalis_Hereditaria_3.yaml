    explanation: Names lasers as tried, and states that they are not promising.
differential_diagnoses:
- name: Dyschromatosis symmetrica hereditaria
  description: >-
    Also called reticulate acropigmentation of Dohi, caused by ADAR1 variants and distinguished by
    its acral rather than generalized distribution.
  distinguishing_features:
  - Acral distribution rather than trunk and extremities.
  evidence:
  - reference: PMID:37634201
    reference_title: Dyschromatosis universalis hereditaria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reticulate pigmentary dyschromatoses primarily include dyschromatosis universalis hereditaria
      (DUH), dyschromatosis symmetrica hereditaria (DSH) (Reticulate acropigmentation of Dohi), and
      unilateral dermatomal pigmentary dermatosis, which differ in their patterns of distribution.
    explanation: Separates the reticulate dyschromatoses by distribution.
- name: Other genetic subtypes of dyschromatosis universalis hereditaria
  description: >-
    The autosomal dominant and recessive DUH loci were mapped to 6q24.2-q25.2 and 12q21-q23 by
    linkage before any gene was named. DUH2 is autosomal recessive and associated with KITLG, and
    SASH1 and PER3 are also named. Only the ABCB6 subtype is curated here.
  distinguishing_features:
  - Variants in a gene other than ABCB6.
  - Autosomal recessive inheritance in DUH2.
  evidence:
  - reference: PMID:37634201
    reference_title: Dyschromatosis universalis hereditaria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most common gene involved in DUH is ABCB6, while the other genes include SASH 1, PER 3, and
      KITLG (DUH type 2).
    explanation: Names the other genes that cause clinically similar disease.
  - reference: PMID:24498303
    reference_title: Genome-wide linkage, exome sequencing and functional analyses identify ABCB6 as the pathogenic gene of dyschromatosis universalis hereditaria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the genetic loci of DUH have been mapped to chromosome 6q24.2-q25.2 ... and 12q21-q23 ... by
      the linkage analysis
    explanation: Sources the two mapped DUH loci named in this differential.
notes: >-
  This entry covers the ABCB6 subtype only. The parent concept, dyschromatosis universalis
  hereditaria, is genetically heterogeneous, so the prevalence figure recorded here is for the parent
  and is an upper bound for this subtype.

  MONDO:0014169 is discussed in kb/disorders/Microphthalmia_with_Coloboma.yaml, which records that
  ABCB6's better-attested disease is this pigmentary disorder and explicitly claims nothing about
  pigmentary skin disease. The two entries are therefore complementary rather than overlapping, and
  the shared gene is real biology: the ocular examination of DUH carriers reported in PMID:24498303
  is recorded here as a phenotype.

  No GeneReviews chapter covers this disease, by disease name or through ABCB6.

  The mechanism by which a heterozygous missense allele produces dominant disease is not settled.
  PMID:24498303 proposes a dominant-negative effect, reasoning that its two alleles sit in the
  transmembrane domain and change the transporter's subcellular location rather than its expression
  level, while the ClinGen assertion transcribed above records the mechanism of disease as currently
  unknown. functional_impact_category is set to LOSS_OF_FUNCTION on the narrower claim that the
  mislocalised transporter does not perform its activity, which the G579E rescue failure supports
  directly; it is not a claim about how one defective allele dominates a normal one.

  The deep-research report for this entry is
  research/Dyschromatosis_Universalis_Hereditaria_3-deep-research-claude_code.md. It was produced by
  the claude_code provider rather than OpenScientist, which failed on every attempt in this batch,
  first on client-side timeouts and then on a server-side stream idle timeout (dismech#10387,
  dismech#18386); --fallback does not engage on a runtime failure, so the provider was switched by
  hand. just preflight-dr against MONDO:0014169 returns PASS, with ABCB6 the canonical MONDO gene and
  188 mentions in the report.

  The zebrafish model carries no gene identifier, and an earlier version of this entry gave the
  wrong reason for that. Zebrafish has two ABCB6 paralogs, not none: NCBI Gene queries
  `abcb6[Gene Name] AND "Danio rerio"[Organism]` and `abcb6*[Gene Name] AND "Danio rerio"[Organism]`
  return abcb6a (NCBIGene:564067, ZFIN:ZDB-GENE-050517-9) and abcb6b (NCBIGene:100004801,
  ZFIN:ZDB-GENE-070912-584). The earlier note said an Alliance search returned nothing; re-running it
  shows that search was malformed, since it returns a zero total for abcb6a as well, and a zero total
  from a query that cannot find a gene known to exist is silence rather than a negative answer.
  The reason the field is still left out is different: PMID:24498303 names its target only as the
  zebrafish ABCB6 homolog, written zABCB6, and places the morpholino design in supplementary
  Figure S5 of Text S1, so the paper's own text does not say which paralog the exon 6 and exon 8
  morpholinos target. Binding either ZFIN accession would be a guess between two real genes.

  The ocular phenotype is bound at the organ-system level with coarse_binding_basis
  SOURCE_UNSPECIFIED. The source states that ocular abnormalities were found without saying which,
  and narrowing the binding to coloboma would assert something it does not say, even though coloboma
  is the ABCB6 eye phenotype that motivated the examination.

- category: Ophthalmologic
  name: Iris abnormality
  description: >-
    Two of the examined ABCB6 carriers in one family had an iris defect on detailed ophthalmological
    examination, described by the source as abnormal pitting and lack of iris. HPO has no term for
    iris pitting, so the binding is the general iris morphology term. This is not coloboma, the
    ABCB6 eye phenotype that prompted the examination: the same examination found no microphthalmia
    or anophthalmia, and a third examined carrier in a second family had no eye findings at all.
  phenotype_term:
    preferred_term: Abnormal pitting and lack of iris
    term:
      id: HP:0000525
      label: Abnormality iris morphology
    coarse_binding_basis: NO_HPO_TERM
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:24498303
    reference_title: Genome-wide linkage, exome sequencing and functional analyses identify ABCB6 as the pathogenic gene of dyschromatosis universalis hereditaria.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the detailed clinical examination, visual-acuity testing and ocular imaging revealed that II5
      and III4 of the Family 1 had abnormal pitting lack of iris, and IV4 of the Family 1 had high
      intra-ocular pressure (L:24 mmHg; R:19 mmHg)
    explanation: >-
      Names the iris finding and the two carriers it was seen in, from the ophthalmological
      examination the study performed on its DUH carriers.
  - reference: PMID:24498303
    reference_title: Genome-wide linkage, exome sequencing and functional analyses identify ABCB6 as the pathogenic gene of dyschromatosis universalis hereditaria.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, no abnormal eye manifestations were found in the IV1 of the Family 2.
    explanation: >-
      The same examination found no eye abnormality in the examined carrier of the second family,
      so the ocular findings are not constant across carriers.
- category: Ophthalmologic
  name: Ocular hypertension

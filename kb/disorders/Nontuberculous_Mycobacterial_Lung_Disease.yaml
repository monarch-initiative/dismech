animal_models:
- name: Nrf2-deficient mouse MAC lung infection
  species: Mouse
  genotype: Nrf2 (Nfe2l2) knockout
  publication: PMID:33563837
  modeled_mechanisms:
  - target: Alveolar Macrophage Infection and Intracellular Persistence
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Nrf2-deficient mice infected with MAC show impaired phagolysosome
      formation and heavy intracellular bacterial burden in alveolar
      macrophages, modeling the intracellular-persistence node.
    limitations: >-
      A single-gene knockout in mice; Nrf2 dependence and the murine granuloma
      response may not fully reproduce human MAC lung disease, which arises in
      structurally or immunologically abnormal human hosts.
    readouts:
    - name: Intracellular MAC burden in alveolar macrophages
      target: Alveolar Macrophage Infection and Intracellular Persistence
      direction: INCREASED
      interpretation: >-
        Nrf2 loss increases intracellular bacterial load with little
        phagolysosome formation, the structural correlate of intracellular
        persistence.
      evidence:
      - reference: PMID:33563837
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "many infected alveolar macrophages from Nrf2-deficient mice contained a large number of intracellular MAC bacteria with little formation of phagolysosomes"
        explanation: Reports the intracellular-burden measurement behind this readout.
    evidence:
    - reference: PMID:33563837
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nrf2 is a critical regulator of host susceptibility to pulmonary MAC disease by promoting phagolysosome fusion and granuloma formation via activating Nramp1 and HO-1 genes, respectively."
      explanation: >-
        Supports treating the Nrf2-deficient mouse as informative for the
        alveolar-macrophage intracellular-persistence node.
notes: >-
  MONDO:0018469 (pulmonary non-tuberculous mycobacterial infection) carries the
  exact synonym "Nontuberculous Mycobacterial Lung Disease". Pathophysiology
  conforms to the intracellular_pathogen_persistence,
  bacterial_protein_synthesis_inhibition (macrolide target and ribosomal target
  resistance), and granuloma_formation modules. Curated de novo from primary
  literature (no deep-research provider run); environmental exposure is modeled
  as a pathophysiology node rather than an ECTO-bound environmental block.
  Evidence classified MODEL_ORGANISM for the mouse MAC-infection findings
  (PMID:33563837) and OTHER for reviews and the clinical practice guideline.
  Host susceptibility is split into distinct structural-airway and Th1-immune
  predisposition nodes, and the radiographic disease pattern is split into
  distinct nodular-bronchiectatic and fibrocavitary nodes. MAC-vs-M. abscessus
  and fibrocavitary-vs-nodular-bronchiectatic subtyping (via has_subtypes) is a
  possible future refinement.

diagnosis:
- name: ATS/ERS/ESCMID/IDSA diagnostic criteria
  description: >-
    Diagnosis of NTM lung disease requires the combination of compatible
    clinical and radiographic findings with microbiological confirmation
    (repeated culture of the same species from sputum, or a single positive
    bronchial wash/lavage, or compatible histopathology plus culture), and
    appropriate exclusion of alternative diagnoses. Culture confirmation is
    required to distinguish true disease from airway colonization.
  evidence:
  - reference: PMID:42437710
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis requires a combination of clinical, radiological, and microbiological criteria to distinguish true disease from colonization."
    explanation: >-
      Review states the combined clinical/radiological/microbiological
      diagnostic requirement. Evidence source is OTHER as this is a review.
  - reference: PMID:27134484
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Positive culture results from at least two separate expectorated sputum samples."
    explanation: >-
      States the microbiologic criterion (repeated positive sputum cultures) of
      the ATS/IDSA diagnostic criteria. Evidence source is OTHER as this is a
      review reproducing the consensus criteria.
treatments:
- name: Macrolide-based multidrug regimen for MAC pulmonary disease
  description: >-
    Guideline-based therapy for macrolide-susceptible MAC pulmonary disease is a
    regimen of at least three drugs — a macrolide (azithromycin preferred over
    clarithromycin), ethambutol, and a rifamycin (rifampicin) — continued for at
    least 12 months after sputum culture conversion. Parenteral amikacin or
    streptomycin is added for cavitary, advanced, or macrolide-resistant disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
    - preferred_term: clarithromycin
      term:
        id: CHEBI:3732
        label: clarithromycin
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Mycobacterial Ribosomal Translation (Macrolide Target)
    treatment_effect: INHIBITS
    description: >-
      The macrolide component binds the mycobacterial ribosome and arrests
      protein synthesis — the anchor of the regimen.
  - target: Requirement for Cell-Penetrant Antimicrobial Therapy
    description: >-
      Macrolides and rifamycins accumulate intracellularly, reaching NTM within
      alveolar macrophages.
  evidence:
  - reference: PMID:32636299
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In patients with macrolide-susceptible MAC pulmonary disease, we recommend a three-drug regimen that includes a macrolide over a three-drug regimen without a macrolide"
    explanation: >-
      ATS/ERS/ESCMID/IDSA guideline gives a strong recommendation for a
      macrolide-containing three-drug regimen. Evidence source is OTHER as this
      is a clinical practice guideline.
  - reference: PMID:32636299
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we suggest a treatment regimen with at least three drugs (including a macrolide and ethambutol) over a regimen with two drugs (a macrolide and ethambutol alone)"
    explanation: >-
      Guideline specifies the at-least-three-drug macrolide-plus-ethambutol
      backbone. Evidence source is OTHER as this is a clinical practice guideline.
- name: Rifampicin-based regimen for M. kansasii pulmonary disease
  description: >-
    Rifampicin-susceptible M. kansasii pulmonary disease is treated with a
    regimen of rifampicin, ethambutol, and either isoniazid or a macrolide, with
    high rates of treatment success.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
    - preferred_term: clarithromycin
      term:
        id: CHEBI:3732
        label: clarithromycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Requirement for Cell-Penetrant Antimicrobial Therapy
    description: >-
      Rifampicin and macrolides penetrate host cells to reach intracellular
      M. kansasii.
  evidence:
  - reference: PMID:32636299
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we suggest a regimen of rifampicin, ethambutol, and either isoniazid or macrolide"
    explanation: >-
      Guideline recommendation for rifampicin-susceptible M. kansasii pulmonary
      disease. Evidence source is OTHER as this is a clinical practice guideline.
- name: Amikacin liposome inhalation suspension for treatment-refractory MAC
  description: >-
    For MAC pulmonary disease that remains culture-positive after at least six
    months of guideline-based therapy, addition of amikacin liposome inhalation
    suspension (ALIS) to the oral regimen significantly increases sputum culture
    conversion (CONVERT trial). Parenteral amikacin is used instead for cavitary
    or advanced disease at initiation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amikacin
      term:
        id: CHEBI:2637
        label: amikacin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Requirement for Cell-Penetrant Antimicrobial Therapy
    description: >-
      Inhaled liposomal amikacin delivers a cell-penetrant aminoglycoside
      directly to the infected lung.
  evidence:
  - reference: PMID:30216086
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Addition of ALIS to GBT for treatment-refractory MAC lung disease achieved significantly greater culture conversion by Month 6 than GBT alone, with comparable rates of serious adverse events."
    explanation: >-
      The CONVERT randomized trial establishes the efficacy of ALIS added to
      guideline-based therapy in refractory MAC lung disease.
- name: Surgical resection as adjuvant therapy
  description: >-
    In selected patients with focal disease, drug-resistant isolates, cavitation,
    or complications such as hemoptysis or severe bronchiectasis, surgical
    resection of the diseased lung is used as an adjuvant to medical therapy.
  treatment_term:
    preferred_term: surgical resection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:32636299
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we suggest surgical resection as an adjuvant to medical therapy after expert consultation"
    explanation: >-
      Guideline conditionally recommends adjuvant surgical resection in selected
      patients. Evidence source is OTHER as this is a clinical practice guideline.

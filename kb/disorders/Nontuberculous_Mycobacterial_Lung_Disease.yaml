name: Nontuberculous Mycobacterial Lung Disease
creation_date: "2026-08-27T00:00:00Z"
category: Infectious Disease
description: >-
  Nontuberculous mycobacterial (NTM) lung disease is a chronic pulmonary
  infection caused by environmental mycobacteria other than the Mycobacterium
  tuberculosis complex and M. leprae, most commonly Mycobacterium avium complex
  (MAC), and also M. kansasii and the rapidly growing M. abscessus. NTM are
  ubiquitous in water and soil and are acquired by inhalation of aerosols;
  disease develops preferentially in hosts with structural lung disease
  (bronchiectasis, COPD, cystic fibrosis) or impaired immunity, and in slender
  postmenopausal women without recognized immunodeficiency. It presents
  insidiously with chronic cough, sputum, fatigue, and weight loss, and follows
  nodular-bronchiectatic or fibrocavitary radiographic patterns. Cure is
  difficult and requires prolonged multidrug macrolide-based regimens.
disease_term:
  preferred_term: Nontuberculous Mycobacterial Lung Disease
  term:
    id: MONDO:0018469
    label: pulmonary non-tuberculous mycobacterial infection
parents:
- Bacterial Infection
- Lung disease
infectious_agent:
- name: Mycobacterium avium complex
  infectious_agent_term:
    preferred_term: Mycobacterium avium complex (MAC)
    term:
      id: NCBITaxon:120793
      label: Mycobacterium avium complex (MAC)
  description: >-
    The most common cause of NTM lung disease worldwide; a slowly growing NTM
    complex that includes M. avium, M. intracellulare, and M. chimaera.
  evidence:
  - reference: PMID:33563837
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mycobacterium avium complex (MAC) is the most common cause of pulmonary NTM disease worldwide."
    explanation: >-
      Identifies MAC as the most common causative organism of NTM lung disease.
      The claim is the framing of a mouse MAC-infection study, so evidence_source
      is MODEL_ORGANISM.
- name: Mycobacteroides abscessus
  infectious_agent_term:
    preferred_term: Mycobacterium abscessus
    term:
      id: NCBITaxon:36809
      label: Mycobacteroides abscessus
  description: >-
    The most common rapidly growing NTM causing pulmonary disease; frequently
    macrolide-resistant via an inducible erm(41) gene, and difficult to cure.
  evidence:
  - reference: PMID:32636299
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "erythromycin resistance methylase\n(erm) gene, namederm(41), that results in\ninducible resistance to macrolides"
    explanation: >-
      ATS/ERS/ESCMID/IDSA guideline documents the inducible erm(41)-mediated
      macrolide resistance that characterizes M. abscessus. Evidence source is
      OTHER as this is a clinical practice guideline.
- name: Mycobacterium kansasii
  infectious_agent_term:
    preferred_term: Mycobacterium kansasii
    term:
      id: NCBITaxon:1768
      label: Mycobacterium kansasii
  description: >-
    A slowly growing NTM that is usually considered pathogenic when isolated and
    is treated with a rifampicin-based regimen.
  evidence:
  - reference: PMID:32636299
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we suggest a regimen of rifampicin, ethambutol, and either isoniazid or macrolide"
    explanation: >-
      Guideline recommends a rifampicin-based regimen for rifampicin-susceptible
      M. kansasii pulmonary disease. Evidence source is OTHER as this is a
      clinical practice guideline.
pathophysiology:
- name: Environmental NTM Exposure and Aerosol Inhalation
  description: >-
    NTM are environmental organisms ubiquitous in natural and engineered water
    systems (household plumbing, showerheads, hot tubs) and in soil. Their
    lipid-rich hydrophobic outer membrane promotes biofilm formation and ready
    aerosolization; inhalation of these aerosols is the major route by which
    pulmonary NTM disease is acquired.
  role: trigger
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:42437710
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nontuberculous mycobacteria (NTM) are environmental organisms increasingly recognized as important pathogens in pulmonary disease."
    explanation: >-
      Establishes NTM as environmental organisms causing pulmonary disease.
      Evidence source is OTHER as this is a review.
  - reference: PMID:30302953
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NTM are readily aerosolized from natural water and soils due to its surface hydrophobicity"
    explanation: >-
      Documents the aerosolization of NTM from water and soil that enables
      inhalational acquisition. Evidence source is OTHER as this is a review.
  - reference: PMID:30302953
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The most common routes for pulmonary NTM infection involve the inhalation of aerosols generated by hot tubs and showerheads."
    explanation: >-
      Identifies inhalation of household aerosols as the dominant route of
      pulmonary NTM infection. Evidence source is OTHER as this is a review.
  downstream:
  - target: Alveolar Macrophage Infection and Intracellular Persistence
    description: >-
      Inhaled aerosolized NTM reach the distal airways and are taken up by
      alveolar macrophages.
- name: Structural Lung Disease Predisposition
  description: >-
    Although exposure to NTM is nearly universal, clinical disease is uncommon,
    implicating host susceptibility. NTM lung disease develops preferentially in
    hosts with structural airway disease — non-cystic fibrosis bronchiectasis,
    COPD, cystic fibrosis, primary ciliary dyskinesia, prior TB, and
    pneumoconiosis — in which impaired mucociliary clearance permits the
    organism to establish and persist.
  role: predisposing_factor
  biological_scale: TISSUE
  evidence:
  - reference: PMID:30302953
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Exposure to NTM is quite common. However, NTM disease is relatively rare. This observation suggests that host susceptibility likely plays a key role in the development of NTM lung disease."
    explanation: >-
      Establishes that host susceptibility, not exposure alone, governs whether
      NTM lung disease develops. Evidence source is OTHER as this is a review.
  - reference: PMID:30302953
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NTM lung disease is more prevalent in patients with structural lung disease, such as cystic fibrosis, non-cystic fibrosis bronchiectasis, primary ciliary dyskinesia, chronic obstructive pulmonary disease (COPD), previous TB, and pneumoconiosis"
    explanation: >-
      Lists the structural lung diseases that predispose to NTM lung disease.
      Evidence source is OTHER as this is a review.
  downstream:
  - target: Alveolar Macrophage Infection and Intracellular Persistence
    description: >-
      Impaired structural airway defenses permit inhaled NTM to establish
      infection of alveolar macrophages.
- name: Impaired Th1 Immune Defense
  description: >-
    Impaired IL-12/IFN-gamma (Th1) immunity is the pivotal immune deficit that
    permits severe and disseminated MAC disease, and iatrogenic or acquired
    immunosuppression (HIV, transplantation, TNF-alpha inhibitors) likewise
    predisposes to NTM lung disease.
  role: predisposing_factor
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: T-helper 1 type immune response
    term:
      id: GO:0042088
      label: T-helper 1 type immune response
    modifier: DECREASED
  evidence:
  - reference: PMID:33563837
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Th1 immune responses, particularly the interleukin 12 (IL-12)/gamma interferon (IFN-γ) axis, are thought to be pivotal host factors in protection against disseminated MAC disease"
    explanation: >-
      Establishes the IL-12/IFN-gamma axis as the pivotal immune-defense pathway
      whose impairment predisposes to severe MAC disease. Evidence source is
      MODEL_ORGANISM as this is the framing of a mouse MAC-infection study.
  - reference: PMID:30302953
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "An immunosuppressed status, which is related to HIV infection, transplantation, or the use of tumor necrosis factor α inhibitor, is also associated with NTM disease"
    explanation: >-
      Documents iatrogenic and acquired immunosuppression as susceptibility
      factors. Evidence source is OTHER as this is a review.
  downstream:
  - target: Alveolar Macrophage Infection and Intracellular Persistence
    description: >-
      Impaired Th1 immunity permits inhaled NTM to survive within alveolar
      macrophages and establish infection.
- name: Alveolar Macrophage Infection and Intracellular Persistence
  description: >-
    Inhaled NTM are phagocytosed by alveolar macrophages, which are both the
    principal reservoir of infection and the main bacillus-killing cell. Like
    other intracellular mycobacteria, NTM subvert phagolysosomal maturation and
    persist intracellularly, shielded from humoral defenses and from
    poorly-cell-penetrant antibiotics such as the beta-lactams.
  role: trigger
  biological_scale: CELLULAR
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: Biological Process Involved in Interaction with Host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:33563837
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The Nrf2 system is activated in alveolar macrophages, the most important cells during MAC infection, as both the main reservoir of infection and bacillus-killing cells."
    explanation: >-
      Establishes the alveolar macrophage as both the reservoir of MAC infection
      and the effector cell. Evidence source is MODEL_ORGANISM as this is the
      framing of a mouse MAC-infection study.
  - reference: PMID:33563837
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "many infected alveolar macrophages from Nrf2-deficient mice contained a large number of intracellular MAC bacteria with little formation of phagolysosomes"
    explanation: >-
      Demonstrates intracellular MAC persistence in alveolar macrophages with
      impaired phagolysosome formation. Evidence source is MODEL_ORGANISM as
      this is a mouse-infection study.
  - reference: PMID:18611821
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The intracellular location of some microorganisms allow them to resist antibiotics with poor ability to penetrate eukaryotic cell membranes, such as the beta-lactam compounds."
    explanation: >-
      Supports the intracellular-niche gating principle that excludes
      poorly-penetrant beta-lactams. Evidence source is OTHER as this is a
      review article.
  downstream:
  - target: Granulomatous Inflammation
    description: >-
      Persistent intracellular NTM that individual macrophages cannot eradicate
      drive a chronic granulomatous immune response.
  - target: Requirement for Cell-Penetrant Antimicrobial Therapy
    description: >-
      The intracellular niche restricts effective therapy to agents that
      accumulate within host cells.
  - target: Nodular-Bronchiectatic Disease
    description: >-
      Chronic intracellular infection of the small airways sustains the
      inflammation that produces the nodular-bronchiectatic pattern.
    evidence:
    - reference: PMID:42437710
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Radiological patterns include nodular bronchiectatic disease and fibrocavitary disease."
      explanation: >-
        Review documents the nodular-bronchiectatic structural pattern that
        chronic infection produces. Evidence source is OTHER as this is a review.
  - target: Fibrocavitary Disease
    description: >-
      Chronic intracellular infection can instead progress to the upper-lobe
      fibrocavitary pattern.
    evidence:
    - reference: PMID:42437710
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Radiological patterns include nodular bronchiectatic disease and fibrocavitary disease."
      explanation: >-
        Review documents the fibrocavitary structural pattern that chronic
        infection produces. Evidence source is OTHER as this is a review.
- name: Requirement for Cell-Penetrant Antimicrobial Therapy
  description: >-
    Because NTM persist within host cells, therapeutic efficacy tracks the
    intracellular drug concentration achieved rather than the in vitro MIC
    alone. Effective regimens are built on cell-penetrant agents — macrolides
    (azithromycin/clarithromycin), rifamycins, and aminoglycosides — while
    cell-wall-active beta-lactams are not used as anchor therapy.
  role: therapeutic_vulnerability
  biological_scale: CELLULAR
  conforms_to: "intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials"
  biological_processes:
  - preferred_term: Response to Antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:28639230
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Therapeutic efficacy against intracellular pathogens has been correlated mainly with the intracellular concentrations achieved by the different antimicrobial agents."
    explanation: >-
      Establishes the cell-penetrant requirement that constrains drug choice for
      intracellular infection. Evidence source is OTHER as this is a review.
- name: Mycobacterial Ribosomal Translation (Macrolide Target)
  description: >-
    Macrolides (azithromycin, clarithromycin) — the non-negotiable anchor of
    MAC therapy — bind the bacterial ribosome and arrest mycobacterial protein
    synthesis. Baseline macrolide susceptibility of the causative strain is the
    most consistent predictor of treatment success.
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The ribosome is one of the main antibiotic targets in the bacterial cell."
    explanation: >-
      Establishes the bacterial ribosome as the class-level macrolide target,
      the step this node represents. Evidence source is OTHER as this is a
      review article.
  - reference: PMID:32636299
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "there is a clear correlation\nbetween baseline macrolide susceptibility of the causative strain and the\noutcome of treatment with macrolide-ethambutol-rifampicin regimens"
    explanation: >-
      Grounds the macrolide-target node specifically in MAC: baseline macrolide
      susceptibility of the strain predicts treatment outcome. Evidence source
      is OTHER as this is a clinical practice guideline.
  downstream:
  - target: Acquired Macrolide Resistance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Under macrolide pressure, mutations at the ribosomal target select for
      acquired macrolide resistance.
- name: Acquired Macrolide Resistance
  description: >-
    Loss of the macrolide target through mutation is the central resistance
    mechanism in NTM disease. In MAC, acquired macrolide resistance is due to
    point mutations in the 23S rRNA (rrl) gene; M. abscessus additionally
    carries inducible erm(41)-mediated resistance. Because macrolide
    susceptibility predicts cure, acquired resistance drives treatment failure.
  role: resistance_mechanism
  biological_scale: MOLECULAR
  conforms_to: "bacterial_protein_synthesis_inhibition#Ribosomal Target Resistance"
  biological_processes:
  - preferred_term: Response to Antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
    modifier: DECREASED
  evidence:
  - reference: PMID:32636299
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Acquired macrolide resistance inM. aviumcomplex is due to point mutations in the 23S rRNA (rrl) gene"
    explanation: >-
      Guideline states that acquired macrolide resistance in MAC arises from 23S
      rRNA (rrl) target mutations — resistance at the ribosomal target. Evidence
      source is OTHER as this is a clinical practice guideline.
  downstream:
  - target: Progressive Respiratory Decline
    description: >-
      Acquired macrolide resistance precipitates treatment failure and the
      lung-function decline that accompanies it.
    evidence:
    - reference: PMID:30302953
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "treatment failure was associated with a substantial decline in lung function in individuals with NTM lung disease"
      explanation: >-
        Links treatment failure — the clinical consequence of acquired
        resistance — to lung-function decline. Evidence source is OTHER as this
        is a review.
- name: Granulomatous Inflammation
  description: >-
    Failure to clear intracellular NTM presents the immune system with a
    persistent stimulus that individual macrophages cannot eradicate, driving
    sustained macrophage recruitment and organization into granulomas. This
    response both contains the organism and, when the infection persists,
    contributes to progressive lung damage and chronic constitutional symptoms.
    Consistent with a non-redundant role for macrophage/TNF-dependent
    containment, TNF-inhibitor therapy predisposes to NTM disease.
  role: amplifier
  biological_scale: TISSUE
  conforms_to: "granuloma_formation#Persistent Indigestible Stimulus"
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: INCREASED
  evidence:
  - reference: PMID:33563837
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Nrf2 is a critical regulator of host susceptibility to pulmonary MAC disease by promoting phagolysosome fusion and granuloma formation via activating Nramp1 and HO-1 genes, respectively."
    explanation: >-
      Establishes macrophage-driven granuloma formation as a component of the
      host response to pulmonary MAC. Evidence source is MODEL_ORGANISM as this
      is a mouse-infection study.
  downstream:
  - target: Nodular-Bronchiectatic Disease
    description: >-
      Chronic granulomatous inflammation of the small airways underlies the
      nodular-bronchiectatic pattern.
    evidence:
    - reference: PMID:42437710
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Radiological patterns include nodular bronchiectatic disease and fibrocavitary disease."
      explanation: >-
        Documents the nodular-bronchiectatic structural pattern. Evidence source
        is OTHER as this is a review.
  - target: Fibrocavitary Disease
    description: >-
      When the organism persists, granulomatous inflammation drives upper-lobe
      cavitary destruction.
    evidence:
    - reference: PMID:42437710
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Radiological patterns include nodular bronchiectatic disease and fibrocavitary disease."
      explanation: >-
        Documents the fibrocavitary structural pattern. Evidence source is OTHER
        as this is a review.
  - target: Fatigue
    description: >-
      Chronic granulomatous infection produces constitutional fatigue.
    evidence:
    - reference: PMID:42437710
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Clinical presentation is often insidious, with symptoms such as chronic cough, sputum production, fatigue, and weight loss."
      explanation: >-
        Review lists fatigue among the constitutional symptoms of NTM lung
        disease. Evidence source is OTHER as this is a review.
  - target: Weight loss
    description: >-
      Chronic granulomatous infection produces progressive weight loss.
    evidence:
    - reference: PMID:42437710
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Clinical presentation is often insidious, with symptoms such as chronic cough, sputum production, fatigue, and weight loss."
      explanation: >-
        Review lists weight loss among the constitutional symptoms of NTM lung
        disease. Evidence source is OTHER as this is a review.
  - target: Night sweats
    description: >-
      Chronic granulomatous infection produces night sweats among its
      constitutional symptoms.
    evidence:
    - reference: PMID:42070174
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "night sweats (55%)"
      explanation: >-
        Patient concept-elicitation interviews in NTM-PD identify night sweats
        as a frequent constitutional symptom. Evidence source is HUMAN_CLINICAL
        as this is a patient-interview study.
- name: Nodular-Bronchiectatic Disease
  description: >-
    The nodular-bronchiectatic form of NTM lung disease comprises small nodules
    and bronchiectasis, classically involving the right middle lobe and lingula,
    and is the more common, more indolent radiographic-pathological pattern.
  role: consequence
  biological_scale: TISSUE
  evidence:
  - reference: PMID:42437710
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Radiological patterns include nodular bronchiectatic disease and fibrocavitary disease."
    explanation: >-
      Documents the nodular-bronchiectatic radiographic pattern of NTM lung
      disease. Evidence source is OTHER as this is a review.
  downstream:
  - target: Bronchiectasis
    description: >-
      Bronchiectasis is the defining airway lesion of the nodular-bronchiectatic
      pattern.
    evidence:
    - reference: PMID:42437710
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Radiological patterns include nodular bronchiectatic disease and fibrocavitary disease."
      explanation: >-
        The nodular-bronchiectatic pattern is defined by bronchiectasis.
        Evidence source is OTHER as this is a review.
  - target: Chronic cough
    description: >-
      Chronic airway infection and bronchiectasis produce persistent cough.
    evidence:
    - reference: PMID:42437710
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Clinical presentation is often insidious, with symptoms such as chronic cough, sputum production, fatigue, and weight loss."
      explanation: >-
        Review lists chronic cough as a cardinal symptom. Evidence source is
        OTHER as this is a review.
  - target: Increased sputum production
    description: >-
      Chronic airway infection and bronchiectasis produce chronic sputum.
    evidence:
    - reference: PMID:42437710
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Clinical presentation is often insidious, with symptoms such as chronic cough, sputum production, fatigue, and weight loss."
      explanation: >-
        Review lists sputum production among the common symptoms. Evidence
        source is OTHER as this is a review.
  - target: Progressive Respiratory Decline
    description: >-
      Cumulative airway destruction contributes to progressive loss of lung
      function.
- name: Fibrocavitary Disease
  description: >-
    The fibrocavitary form comprises upper-lobe cavities resembling
    tuberculosis; it marks the more severe, faster-progressing phenotype with a
    stronger indication for treatment.
  role: consequence
  biological_scale: TISSUE
  evidence:
  - reference: PMID:42437710
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Radiological patterns include nodular bronchiectatic disease and fibrocavitary disease."
    explanation: >-
      Documents the fibrocavitary radiographic pattern of NTM lung disease.
      Evidence source is OTHER as this is a review.
  downstream:
  - target: Pulmonary cavity
    description: >-
      Upper-lobe cavitation is the defining lesion of the fibrocavitary
      pattern.
    evidence:
    - reference: PMID:42437710
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Radiological patterns include nodular bronchiectatic disease and fibrocavitary disease."
      explanation: >-
        The fibrocavitary pattern is defined by pulmonary cavitation. Evidence
        source is OTHER as this is a review.
  - target: Hemoptysis
    description: >-
      Cavitary and bronchiectatic airway destruction produces hemoptysis.
    evidence:
    - reference: PMID:19020369
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Other less common symptoms include dyspnea and hemoptysis."
      explanation: >-
        Review lists hemoptysis among the symptoms of NTM pulmonary infection.
        Evidence source is OTHER as this is a review.
  - target: Progressive Respiratory Decline
    description: >-
      Progressive cavitary parenchymal destruction drives loss of lung function.
- name: Progressive Respiratory Decline
  description: >-
    Untreated or refractory NTM lung disease is associated with progressive loss
    of lung function, impaired quality of life, and increased morbidity and
    mortality; treatment failure in particular is associated with substantial
    lung-function decline.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:30302953
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "treatment failure was associated with a substantial decline in lung function in individuals with NTM lung disease"
    explanation: >-
      Documents progressive lung-function decline as an outcome of NTM lung
      disease. Evidence source is OTHER as this is a review.
  downstream:
  - target: Dyspnea
    description: >-
      Progressive loss of lung function produces exertional breathlessness.
    evidence:
    - reference: PMID:42070174
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "shortness of breath (98%)"
      explanation: >-
        Patient concept-elicitation interviews in NTM-PD identify shortness of
        breath as a near-universal symptom. Evidence source is HUMAN_CLINICAL as
        this is a patient-interview study.

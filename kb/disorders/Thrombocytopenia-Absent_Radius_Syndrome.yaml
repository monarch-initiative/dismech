notes: >-
  Curated against MONDO:0010121 as the anchor. MONDO cross-references
  OMIM:274000, Orphanet:3320, NCIT:C99038, DECIPHER:64 and UMLS:C0175703 for
  this concept; the first two are recorded as external assertions, and the NCIT
  identifier is deliberately not placed in mappings.ncit_mappings, which the
  schema scopes to cancer entries.

  Two points a reviewer may want to check. First, the entry treats the
  genotype-to-phenotype relation as a dosage threshold rather than
  haploinsufficiency, which is what the healthy-carrier observation requires;
  the residual uncertainty about how the regulatory alleles lower Y14 is
  recorded as an open knowledge gap rather than smoothed over in the causal
  edge. Second, "Preserved thumbs" is intentionally left without an ontology
  binding: HPO has no positive term for a thumb preserved in the presence of
  radial aplasia, and binding a thumb-malformation term would assert the
  opposite of the finding.

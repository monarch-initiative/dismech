name: Thrombocytopenia-Absent Radius Syndrome
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  Thrombocytopenia-absent radius (TAR) syndrome is a congenital malformation
  syndrome that couples bilateral radial aplasia with a hypomegakaryocytic
  thrombocytopenia, and is defined clinically by the preservation of both
  thumbs. That last feature is the discriminator from the other syndromes
  pairing a radial ray defect with marrow failure, notably Fanconi anemia and
  radioulnar synostosis with amegakaryocytic thrombocytopenia, in which the
  thumbs are absent or hypoplastic. The cause is insufficiency of Y14, the
  RBM8A-encoded subunit of the exon junction complex. Nearly all patients are
  compound heterozygous for a rare null allele - usually a recurrent 200-kb
  microdeletion at 1q21.1, occasionally a truncating RBM8A variant - in trans
  with one of two common low-frequency non-coding SNPs in the RBM8A 5'UTR or
  first intron that reduce its transcription. Neither allele is sufficient
  alone: deletion carriers and individuals homozygous for the regulatory allele
  are healthy, so the disorder is a dosage threshold effect rather than simple
  haploinsufficiency. Thrombocytopenia is typically most severe in infancy and
  remits with age, while the skeletal defect is fixed at birth.
disease_term:
  preferred_term: thrombocytopenia-absent radius syndrome
  term:
    id: MONDO:0010121
    label: thrombocytopenia-absent radius syndrome
parents:
- hereditary disease
synonyms:
- TAR syndrome
- TAR
- thrombocytopenia with absent radii syndrome
- radial aplasia-thrombocytopenia syndrome
- absent radii and thrombocytopenia
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Formally autosomal recessive, but with a two-allele structure that makes the
    observed pedigrees look unlike a classic recessive disorder. Affected
    individuals carry a rare null allele in trans with a common low-frequency
    hypomorphic regulatory allele of RBM8A. Because null alleles are rare and
    often de novo while the hypomorphic allele is common in the population, the
    pedigree pattern shows few affected sibs, apparent parent-to-child
    transmission, and affected second- and third-degree relatives. Carriers of
    either allele alone, including individuals homozygous for the hypomorphic
    allele, are asymptomatic.
  evidence:
  - reference: PMID:20301781
    reference_title: Thrombocytopenia Absent Radius Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TAR syndrome is caused by compound heterozygosity for a null allele and an RBM8A hypomorphic allele and is inherited in an autosomal recessive manner.
    explanation: >-
      States the compound null-plus-hypomorph structure and its formal recessive
      classification.
  - reference: PMID:20301781
    reference_title: Thrombocytopenia Absent Radius Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a paucity of affected sibs, apparent parent-to-child transmission, and affected second- and third-degree relatives
    explanation: >-
      Records the pedigree features that depart from a textbook autosomal
      recessive disorder, which follow from the differing allele frequencies.
pathophysiology:
- name: Reduced RBM8A Gene Dosage
  biological_scale: MOLECULAR
  description: >-
    A rare null allele on one chromosome - most often the recurrent 200-kb
    interstitial microdeletion of 1q21.1, less often a frameshift or nonsense
    variant in RBM8A - is inherited in trans with one of two low-frequency
    non-coding SNPs in the RBM8A 5'UTR or first intron. The regulatory minor
    alleles sit in active regulatory elements and lower transcription from the
    remaining copy, so total RBM8A output falls below what either lesion
    produces on its own.
  genes:
  - preferred_term: RBM8A
    term:
      id: hgnc:9905
      label: RBM8A
  evidence:
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound inheritance of a rare null allele and one of two low-frequency SNPs in the regulatory regions of RBM8A, encoding the Y14 subunit of EJC, causes TAR.
    explanation: >-
      Establishes the two-allele genetic architecture that sets the reduced
      dosage.
  - reference: PMID:17236129
    reference_title: >-
      Complex inheritance pattern resembling autosomal recessive inheritance involving a microdeletion in thrombocytopenia-absent radius syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we describe a common interstitial microdeletion of 200 kb on chromosome 1q21.1 in all 30 investigated patients with TAR syndrome
    explanation: >-
      Identifies the recurrent null allele carried by the large majority of
      patients.
  - reference: PMID:17236129
    reference_title: >-
      Complex inheritance pattern resembling autosomal recessive inheritance involving a microdeletion in thrombocytopenia-absent radius syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results indicate that TAR syndrome is associated with a microdeletion on 1q21.1 that is necessary but not sufficient to cause the phenotype.
    explanation: >-
      Shows the deletion alone does not produce disease, which is what requires
      the second, regulatory allele.
  downstream:
  - target: Y14 Protein Insufficiency
    description: >-
      Lowered transcription from the non-deleted allele, with no output from the
      null allele, reduces the amount of Y14 protein produced.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22366785
      reference_title: >-
        Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show that the two regulatory SNPs result in diminished RBM8A transcription in vitro and that Y14 expression is reduced in platelets from individuals with TAR.
      explanation: >-
        Links the regulatory alleles to reduced transcription and confirms the
        resulting protein deficit in patient platelets.
- name: Y14 Protein Insufficiency
  biological_scale: MOLECULAR
  description: >-
    Y14 abundance falls below the level the most sensitive tissues require.
    This is a threshold effect rather than plain haploinsufficiency: carriers of
    the 1q21.1 deletion alone are healthy, and the regulatory SNPs alone have no
    measurable effect on platelet count, so only the combination drops Y14 low
    enough to matter, and it appears to do so in a cell-type- and
    developmental-stage-dependent way.
  evidence:
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data implicate Y14 insufficiency and, presumably, an EJC defect as the cause of TAR syndrome.
    explanation: >-
      States Y14 insufficiency as the proximate cause of the syndrome.
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      simple haploinsufficiency is not sufficient to create an aberrant phenotype as evidenced by the apparently healthy carriers of the 1q21.1 deletion
    explanation: >-
      Supports treating this node as a dosage threshold rather than
      haploinsufficiency, since one null allele alone is tolerated.
  downstream:
  - target: Exon Junction Complex Insufficiency
    description: >-
      Y14 is an obligate core subunit of the exon junction complex, so reduced
      Y14 limits how much functional complex can be assembled.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22366785
      reference_title: >-
        Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Y14 is one of the four components of the exon junction splicing complex (EJC), which is involved in basic cellular functions such as nuclear export and subcellular localization of specific transcripts
      explanation: >-
        Identifies Y14 as one of the four core EJC subunits, which is why its
        insufficiency constrains complex function.
- name: Exon Junction Complex Insufficiency
  biological_scale: MOLECULAR
  description: >-
    The exon junction complex is deposited on spliced mRNA and governs nuclear
    export, subcellular transcript localization, translational enhancement and
    nonsense-mediated decay. Reduced complex availability perturbs these
    post-transcriptional steps. TAR is the first human disorder attributed to
    deficiency of an EJC subunit, and the consequences are selective rather than
    global, falling hardest on megakaryopoiesis and on radial ray patterning.
  biological_processes:
  - preferred_term: nonsense-mediated mRNA decay
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    modifier: DECREASED
  cellular_components:
  - preferred_term: exon-exon junction complex
    term:
      id: GO:0035145
      label: exon-exon junction complex
    modifier: DECREASED
  evidence:
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data implicate Y14 insufficiency and, presumably, an EJC defect as the cause of TAR syndrome.
    explanation: >-
      Attributes the disorder to an exon junction complex defect downstream of
      the Y14 deficit.
  downstream:
  - target: Megakaryocyte Maturation Failure
    description: >-
      The megakaryocytic lineage is among the compartments least able to
      tolerate the reduced complex activity, and patient marrow is depleted of
      megakaryocytes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22366785
      reference_title: >-
        Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        TAR cases have low numbers of megakaryocytes, the platelet precursor cells that reside in the bone-marrow
      explanation: >-
        Establishes the megakaryocyte deficit in patients as the cellular
        consequence in the haematopoietic arm.
  - target: Radial Ray Developmental Failure
    description: >-
      The forelimb skeletal programme is the second compartment affected,
      producing the radial defect that is fixed at birth. A developmental
      stage-dependent effect has been proposed, since Evi1, the repressor
      predicted to bind the 5'UTR minor allele, is transiently expressed in
      emerging limb buds.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:17236129
      reference_title: >-
        Complex inheritance pattern resembling autosomal recessive inheritance involving a microdeletion in thrombocytopenia-absent radius syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thrombocytopenia-absent radius (TAR) syndrome is characterized by hypomegakaryocytic thrombocytopenia and bilateral radial aplasia in the presence of both thumbs.
      explanation: >-
        Establishes the radial aplasia as a defining consequence alongside the
        marrow phenotype.
- name: Megakaryocyte Maturation Failure
  biological_scale: CELLULAR
  description: >-
    Bone marrow shows reduced or absent megakaryocytes, so platelet production
    is curtailed at its source. The defect is not fixed for life: platelet
    counts characteristically improve through childhood, which distinguishes the
    haematological course from the static skeletal defect.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  biological_processes:
  - preferred_term: megakaryocyte differentiation
    term:
      id: GO:0030219
      label: megakaryocyte differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TAR cases have low numbers of megakaryocytes, the platelet precursor cells that reside in the bone-marrow
    explanation: >-
      Documents the reduced megakaryocyte population underlying this node.
  downstream:
  - target: Thrombocytopenia
    description: >-
      Fewer maturing megakaryocytes yield fewer circulating platelets, giving
      the hypomegakaryocytic thrombocytopenia that defines the disorder.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17236129
      reference_title: >-
        Complex inheritance pattern resembling autosomal recessive inheritance involving a microdeletion in thrombocytopenia-absent radius syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thrombocytopenia-absent radius (TAR) syndrome is characterized by hypomegakaryocytic thrombocytopenia and bilateral radial aplasia in the presence of both thumbs.
      explanation: >-
        Names the thrombocytopenia as hypomegakaryocytic, tying the platelet
        deficit to the marrow precursor deficit.
- name: Radial Ray Developmental Failure
  biological_scale: TISSUE
  description: >-
    Patterning of the radial ray fails bilaterally during limb development,
    giving absent radii. The failure is confined to the radius and spares the
    thumb, which is the anatomical signature separating TAR from the other
    radial ray syndromes with marrow involvement. Severity varies from isolated
    radial absence to near-total absence of the upper limbs, and lower limb,
    rib and vertebral anomalies may accompany it.
  biological_processes:
  - preferred_term: forelimb morphogenesis
    term:
      id: GO:0035136
      label: forelimb morphogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with preservation of the thumb, which distinguishes TAR from other syndromes that combine blood abnormalities with absence of the radius, such as Fanconi anemia
    explanation: >-
      Establishes that the developmental failure spares the thumb, the feature
      that separates this node from the radial ray defect of Fanconi anemia.
  downstream:
  - target: Bilateral radial aplasia
    description: >-
      Failure of radial ray patterning presents at birth as bilaterally absent
      radii.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20301781
      reference_title: Thrombocytopenia Absent Radius Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thrombocytopenia absent radius (TAR) syndrome is characterized by bilateral absence of the radii with the presence of both thumbs, and thrombocytopenia that is generally transient.
      explanation: >-
        Confirms bilateral radial absence as the presenting skeletal
        manifestation.
phenotypes:
- category: Hematologic
  name: Thrombocytopenia
  description: >-
    Hypomegakaryocytic thrombocytopenia, present at birth or developing within
    the first weeks to months of life. Counts are generally lowest in infancy
    and improve with age, so the haematological course is largely
    self-limiting, in contrast to the progressive marrow failure of Fanconi
    anemia. Cow's milk exposure and intercurrent illness can precipitate
    exacerbations.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  diagnostic: true
  notes: >-
    clinical_course is deliberately absent. ClinicalCourseEnum offers only
    PROGRESSIVE and STABLE, and this thrombocytopenia is neither: it is
    typically worst in infancy and remits with age. Recording either value
    would misstate the natural history, so the course is described in prose and
    carried by the cited evidence instead.
  evidence:
  - reference: PMID:20301781
    reference_title: Thrombocytopenia Absent Radius Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thrombocytopenia may be congenital or may develop within the first few weeks to months of life; in general, thrombocytopenic episodes decrease with age.
    explanation: >-
      Documents both the timing of onset and the tendency to remit, which is
      why the course is not modelled as static.
  sequelae:
  - target: Petechiae
    description: >-
      Reduced platelet counts produce the cutaneous bleeding that commonly
      brings infants to attention.
    evidence:
    - reference: PMID:20301781
      reference_title: Thrombocytopenia Absent Radius Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Platelet count when evidence of increased bleeding tendency (bruising, petechiae) occurs.
      explanation: >-
        Names bruising and petechiae as the bleeding manifestations monitored in
        this disorder.
- category: Skeletal
  name: Bilateral radial aplasia
  description: >-
    Bilateral absence of the radii, present in every reported patient and
    required for the clinical diagnosis. Severity of the wider skeletal
    involvement varies from isolated radial absence to near-total absence of the
    upper limbs.
  phenotype_term:
    preferred_term: Bilateral radial aplasia
    term:
      id: HP:0004977
      label: Bilateral radial aplasia
  diagnostic: true
  evidence:
  - reference: PMID:12471199
    reference_title: "Thrombocytopenia-absent radius syndrome: a clinical genetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All cases had a documented thrombocytopenia and bilateral radial aplasia, 47% had lower limb anomalies, 47% cow's milk intolerance, 23% renal anomalies, and 15% cardiac anomalies.
    explanation: >-
      All 34 patients in the cohort had bilateral radial aplasia, establishing
      it as an obligate feature.
- category: Skeletal
  name: Preserved thumbs
  description: >-
    Both thumbs are present despite bilateral radial aplasia. This dissociation
    is the single most useful bedside discriminator from the other radial ray
    syndromes with haematological involvement, in which the thumb is absent or
    hypoplastic. No positive HPO term exists for a preserved thumb in the
    presence of radial aplasia, so this phenotype is deliberately left unbound
    rather than annotated with a thumb-malformation term that would assert the
    opposite of what is meant.
  phenotype_term:
    preferred_term: Thumbs present despite bilateral radial aplasia
  diagnostic: true
  evidence:
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with preservation of the thumb, which distinguishes TAR from other syndromes that combine blood abnormalities with absence of the radius, such as Fanconi anemia
    explanation: >-
      States both the finding and its discriminating value against Fanconi
      anemia.
- category: Hematologic
  name: Megakaryocytopenia

treatments:
- name: Platelet Transfusion
  description: >-
    Platelet transfusion supports the thrombocytopenia during the high-risk
    infant period and around procedures. Because counts improve with age,
    transfusion is deliberately restricted in older individuals once the count
    exceeds a threshold, to limit alloimmunization and transfusion-transmitted
    infection.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Platelet Transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Thrombocytopenia
    description: >-
      Replaces circulating platelets that the marrow cannot produce, without
      correcting the underlying megakaryocyte defect.
    evidence:
    - reference: PMID:20301781
      reference_title: Thrombocytopenia Absent Radius Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Platelet transfusion for thrombocytopenia as needed
      explanation: >-
        Supports transfusion acting on the thrombocytopenia itself rather than
        on its cause.
  evidence:
  - reference: PMID:20301781
    reference_title: Thrombocytopenia Absent Radius Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Platelet transfusion for thrombocytopenia as needed
    explanation: >-
      Names platelet transfusion as the management of the thrombocytopenia.
- name: In Utero Platelet Transfusion
  description: >-
    Where TAR is recognised antenatally and severe fetal thrombocytopenia is
    confirmed by cordocentesis, platelets can be transfused into the umbilical
    vein before delivery. The aim is peripartum haemostasis at the point of
    greatest bleeding risk, not correction of the underlying defect. This is
    reported experience from case management rather than trial evidence.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Platelet Transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Thrombocytopenia
    description: >-
      Raises the fetal platelet count across delivery, when intracranial and
      other internal bleeding risk is highest.
    evidence:
    - reference: PMID:7845901
      reference_title: >-
        Prenatal evaluation and in utero platelet transfusion for thrombocytopenia absent radii syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Apheresis platelets were transfused into the umbilical vein to correct the thrombocytopenia and was followed by an uncomplicated delivery.
      explanation: >-
        Describes the intervention acting directly on the fetal platelet count.
  evidence:
  - reference: PMID:7845901
    reference_title: >-
      Prenatal evaluation and in utero platelet transfusion for thrombocytopenia absent radii syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that TAR syndrome can be readily identified prenatally on sonogram, and if severe thrombocytopenia is confirmed by cordocentesis, platelets should be transfused to diminish the risk of serious internal bleeding during and immediately after delivery.
    explanation: >-
      States the antenatal pathway and the recommendation to transfuse before
      delivery when severe thrombocytopenia is confirmed.
- name: Cow's Milk Avoidance
  description: >-
    Dietary exclusion of cow's milk. In this disorder it serves two purposes at
    once: it reduces the severity of the gastroenteritis, and it avoids
    exacerbations of the thrombocytopenia that milk exposure can precipitate.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

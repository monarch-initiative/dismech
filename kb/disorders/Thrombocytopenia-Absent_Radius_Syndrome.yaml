name: Thrombocytopenia-Absent Radius Syndrome
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  Thrombocytopenia-absent radius (TAR) syndrome is a congenital malformation
  syndrome that couples bilateral radial aplasia with a hypomegakaryocytic
  thrombocytopenia, and is defined clinically by the preservation of both
  thumbs. That last feature is the discriminator from the other syndromes
  pairing a radial ray defect with marrow failure, notably Fanconi anemia and
  radioulnar synostosis with amegakaryocytic thrombocytopenia, in which the
  thumbs are absent or hypoplastic. The cause is insufficiency of Y14, the
  RBM8A-encoded subunit of the exon junction complex. Nearly all patients are
  compound heterozygous for a rare null allele - usually a recurrent 200-kb
  microdeletion at 1q21.1, occasionally a truncating RBM8A variant - in trans
  with one of two common low-frequency non-coding SNPs in the RBM8A 5'UTR or
  first intron that reduce its transcription. Neither allele is sufficient
  alone: deletion carriers and individuals homozygous for the regulatory allele
  are healthy, so the disorder is a dosage threshold effect rather than simple
  haploinsufficiency. Thrombocytopenia is typically most severe in infancy and
  remits with age, while the skeletal defect is fixed at birth.

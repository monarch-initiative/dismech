treatments:
- name: Platelet Transfusion
  description: >-
    Platelet transfusion supports the thrombocytopenia during the high-risk
    infant period and around procedures. Because counts improve with age,
    transfusion is deliberately restricted in older individuals once the count
    exceeds a threshold, to limit alloimmunization and transfusion-transmitted
    infection.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Platelet Transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Thrombocytopenia
    description: >-
      Replaces circulating platelets that the marrow cannot produce, without
      correcting the underlying megakaryocyte defect.
  evidence:
  - reference: PMID:20301781
    reference_title: Thrombocytopenia Absent Radius Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Platelet transfusion for thrombocytopenia as needed
    explanation: >-
      Names platelet transfusion as the management of the thrombocytopenia.
- name: Cow's Milk Avoidance
  description: >-
    Dietary exclusion of cow's milk. In this disorder it serves two purposes at
    once: it reduces the severity of the gastroenteritis, and it avoids
    exacerbations of the thrombocytopenia that milk exposure can precipitate.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention

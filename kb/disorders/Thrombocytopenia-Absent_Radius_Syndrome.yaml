differential_diagnoses:
- name: Fanconi anemia
  disease_term:
    preferred_term: Fanconi anemia
    term:
      id: MONDO:0019391
      label: Fanconi anemia
  description: >-
    The principal differential, since both combine a radial ray defect with
    marrow failure.
  distinguishing_features:
  - >-
      The thumbs are the discriminator. In TAR the radii are absent but both
      thumbs are present; in Fanconi anemia a radial defect is accompanied by an
      absent or hypoplastic thumb.
  - >-
      The haematology also diverges: TAR causes an isolated thrombocytopenia
      that improves with age, whereas Fanconi anemia causes progressive
      pancytopenia with a substantial risk of clonal evolution.
  evidence:
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with preservation of the thumb, which distinguishes TAR from other syndromes that combine blood abnormalities with absence of the radius, such as Fanconi anemia
    explanation: >-
      Explicitly names Fanconi anemia as the syndrome that thumb preservation
      distinguishes TAR from.
- name: Radio-ulnar synostosis-amegakaryocytic thrombocytopenia syndrome
  disease_term:
    preferred_term: radio-ulnar synostosis-amegakaryocytic thrombocytopenia syndrome
    term:
      id: MONDO:0011555
      label: radio-ulnar synostosis-amegakaryocytic thrombocytopenia syndrome
  description: >-
    A second forearm-plus-thrombocytopenia syndrome that enters the neonatal
    differential.
  distinguishing_features:
  - >-
      The forearm lesion is a proximal radio-ulnar synostosis rather than radial
      aplasia.
  - >-
      The thrombocytopenia is amegakaryocytic and progresses toward marrow
      failure rather than remitting with age.
  notes: >-
    Distinguished on the described clinical features; no dismech entry exists
    for this disorder yet, so it is referenced by its MONDO term only.
animal_models:
- name: Zebrafish rbm8a morpholino knockdown
  species: Zebrafish
  genotype: rbm8a antisense morpholino knockdown
  publication: PMID:22366785
  description: >-
    Antisense morpholino knockdown of the zebrafish rbm8a orthologue, used to
    establish that Y14 is essential in vertebrate development.
  modeled_mechanisms:
  - target: Y14 Protein Insufficiency
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Demonstrates that Y14 is developmentally essential, but does not model the
      disease state. TAR is caused by a partial reduction in Y14 that leaves
      viable, largely healthy tissue outside the megakaryocytic and radial ray
      compartments; the morphant is a near-complete knockdown that is lethal
      within two days, producing global malformation rather than the selective
      TAR phenotype.
    limitations: >-
      Morpholino knockdown is transient and its severity is not titrated to the
      partial dosage reduction seen in patients, so the model cannot reproduce
      the tissue-selective, threshold-dependent nature of the human disorder.
      Lethality at two days post fertilization also precludes assessment of the
      limb and haematopoietic phenotypes of interest.
    evidence:
    - reference: PMID:22366785
      reference_title: >-
        Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        knock-down of the orthologous rbm8a transcript in Danio rerio by antisense morpholinos resulted in extreme malformations and death two days post fertilization
      explanation: >-
        Reports the lethal, globally malformed phenotype that departs from the
        selective human presentation.
discussions:
- discussion_id: rbm8a_regulatory_snp_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what molecular mechanism do the RBM8A 5'UTR and first-intron minor
    alleles reduce Y14 protein abundance in patients?
  attaches_to:
  - pathophysiology#Reduced RBM8A Gene Dosage
  rationale: >-
    The genetic association is settled and the protein deficit is measured in
    patient platelets, but the step between them is not established. Reporter
    assays show both minor alleles lower promoter activity in megakaryocytic and
    osteoblast lines, yet allele-specific expression in platelet RNA from
    healthy heterozygotes showed no difference between transcripts, so reduced
    transcription alone does not account for the observed protein reduction. The
    authors state the mechanism remains open and may differ between the two
    SNPs. This matters for curation because the causal edge from genotype to Y14
    insufficiency is currently supported by correlation plus a partially
    contradicted transcriptional model.
  evidence:
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It therefore still leaves open the question of the exact mechanism by which the non-coding SNPs lead to the decreased protein expression observed in TAR cases.
    explanation: >-
      The authors state the gap directly, immediately after reporting the
      negative allele-specific expression result.

differential_diagnoses:
- name: Fanconi anemia
  disease_term:
    preferred_term: Fanconi anemia
    term:
      id: MONDO:0019391
      label: Fanconi anemia
  description: >-
    The principal differential, since both combine a radial ray defect with
    marrow failure.
  distinguishing_features:
  - >-
      The thumbs are the discriminator. In TAR the radii are absent but both
      thumbs are present; in Fanconi anemia a radial defect is accompanied by an
      absent or hypoplastic thumb.
  - >-
      The haematology also diverges: TAR causes an isolated thrombocytopenia
      that improves with age, whereas Fanconi anemia causes progressive
      pancytopenia with a substantial risk of clonal evolution.
  evidence:
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with preservation of the thumb, which distinguishes TAR from other syndromes that combine blood abnormalities with absence of the radius, such as Fanconi anemia
    explanation: >-
      Explicitly names Fanconi anemia as the syndrome that thumb preservation
      distinguishes TAR from.
- name: Radio-ulnar synostosis-amegakaryocytic thrombocytopenia syndrome
  disease_term:
    preferred_term: radio-ulnar synostosis-amegakaryocytic thrombocytopenia syndrome
    term:
      id: MONDO:0011555
      label: radio-ulnar synostosis-amegakaryocytic thrombocytopenia syndrome
  description: >-
    A second forearm-plus-thrombocytopenia syndrome that enters the neonatal
    differential.
  distinguishing_features:
  - >-
      The forearm lesion is a proximal radio-ulnar synostosis rather than radial
      aplasia.
  - >-
      The thrombocytopenia is amegakaryocytic and progresses toward marrow
      failure rather than remitting with age.
  evidence:
  - reference: PMID:26581901
    reference_title: >-
      Mutations in MECOM, Encoding Oncoprotein EVI1, Cause Radioulnar Synostosis with Amegakaryocytic Thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radioulnar synostosis with amegakaryocytic thrombocytopenia (RUSAT) is an inherited bone marrow failure syndrome, characterized by thrombocytopenia and congenital fusion of the radius and ulna.
    explanation: >-
      Establishes the forearm lesion and marrow phenotype that distinguish RUSAT
      from the radial aplasia of TAR.
  notes: >-
    Distinguished on the described clinical features; no dismech entry exists
    for this disorder yet, so it is referenced by its MONDO term only. Worth
    noting that the two disorders converge on one transcription factor from
    opposite directions: RUSAT is caused by missense variants in MECOM, which
    encodes EVI1, and EVI1 is the repressor predicted to bind the minor allele
    of the TAR 5'UTR regulatory SNP. This is an observation about the
    literature, not a curated mechanistic claim in this entry.
animal_models:
- name: Zebrafish rbm8a morpholino knockdown
  species: Zebrafish
  genotype: rbm8a antisense morpholino knockdown
  publication: PMID:22366785
  description: >-
    Antisense morpholino knockdown of the zebrafish rbm8a orthologue, used to
    establish that Y14 is essential in vertebrate development.
  evidence:
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      knock-down of the orthologous rbm8a transcript in Danio rerio by antisense morpholinos resulted in extreme malformations and death two days post fertilization
    explanation: >-
      Attests that the model exists and was used in the defining study, a
      separate claim from whether it is informative for any given node.
  modeled_mechanisms:
  - target: Y14 Protein Insufficiency
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Demonstrates that Y14 is developmentally essential, but does not model the
      disease state. TAR is caused by a partial reduction in Y14 that leaves
      viable, largely healthy tissue outside the megakaryocytic and radial ray
      compartments; the morphant is a near-complete knockdown that is lethal
      within two days, producing global malformation rather than the selective
      TAR phenotype.
    limitations: >-
      Morpholino knockdown is transient and its severity is not titrated to the
      partial dosage reduction seen in patients, so the model cannot reproduce
      the tissue-selective, threshold-dependent nature of the human disorder.
      Lethality at two days post fertilization also precludes assessment of the
      limb and haematopoietic phenotypes of interest.
    evidence:
    - reference: PMID:22366785
      reference_title: >-
        Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        knock-down of the orthologous rbm8a transcript in Danio rerio by antisense morpholinos resulted in extreme malformations and death two days post fertilization
      explanation: >-
        Reports the lethal, globally malformed phenotype that departs from the
        selective human presentation.
discussions:
- discussion_id: rbm8a_regulatory_snp_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what molecular mechanism do the RBM8A 5'UTR and first-intron minor
    alleles reduce Y14 protein abundance in patients?
  attaches_to:
  - pathophysiology#Reduced RBM8A Gene Dosage
  rationale: >-
    The genetic association is settled and the protein deficit is measured in
    patient platelets, but the step between them is not established. Reporter
    assays show both minor alleles lower promoter activity in megakaryocytic and
    osteoblast lines, yet allele-specific expression in platelet RNA from
    healthy heterozygotes showed no difference between transcripts, so reduced
    transcription alone does not account for the observed protein reduction. The
    authors state the mechanism remains open and may differ between the two
    SNPs. This matters for curation because the causal edge from genotype to Y14
    insufficiency is currently supported by correlation plus a partially
    contradicted transcriptional model.
  evidence:
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It therefore still leaves open the question of the exact mechanism by which the non-coding SNPs lead to the decreased protein expression observed in TAR cases.
    explanation: >-
      The authors state the gap directly, immediately after reporting the
      negative allele-specific expression result.
- discussion_id: tpo_receptor_agonists_untested_in_tar
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Would thrombopoietin receptor agonists raise the platelet count in TAR
    syndrome, and is there any reason to expect them to?
  attaches_to:
  - treatments#
  - pathophysiology#Megakaryocyte Maturation Failure
  rationale: >-
    TPO-receptor agonists have accumulated real experience across the inherited
    thrombocytopenias, but the reported diagnoses are Wiskott-Aldrich, MYH9- and
    ANKRD26-related disease; TAR is not among them. The question is not purely
    empirical, because TAR patients have been reported to have elevated
    endogenous TPO with impaired responsiveness rather than TPO deficiency, so
    agonist therapy is not obviously indicated by the mechanism. Recorded as a
    gap rather than as a treatment: nothing here supports offering a TPO-RA in
    TAR, and nothing rules it out.
  evidence:
  - reference: PMID:33919295
    reference_title: >-
      Role of Thrombopoietin Receptor Agonists in Inherited Thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main diagnoses were Wiskott-Aldrich syndrome, MYH9-related disorder and ANKRD26-related thrombocytopenia.
    explanation: >-
      A systematic review of TPO-RA use across inherited thrombocytopenias whose
      reported diagnoses do not include TAR, which is what establishes the gap.
- discussion_id: ibmfs_classification_and_malignancy_risk
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should TAR be treated as an inherited bone marrow failure syndrome, and does
    it carry a leukemia predisposition?
  attaches_to:
  - clinical_burden#
  - phenotypes#Thrombocytopenia
  rationale: >-
    TAR is conventionally listed among the inherited bone marrow failure
    syndromes and is enrolled as one by the NCI natural-history cohort recorded
    under clinical_trials, but the haematological behaviour fits that label
    poorly and the literature says so directly. The thrombocytopenia is
    lineage-restricted and remits with age rather than progressing to
    pancytopenia, which is the opposite of the course in Fanconi anemia or
    dyskeratosis congenita. Leukemia in TAR is at case-report level: a 2017
    review counted four reported cases in the entire literature, and further
    single cases have appeared since, including Philadelphia-positive AML and
    juvenile myelomonocytic leukemia. Recorded as an interpretation rather than
    as a phenotype because the honest statement is a reported near-absence, and
    a handful of cases across a rare disease does not establish a predisposition.
    Curators should not infer a Fanconi-like surveillance requirement from the
    IBMFS label alone.
  evidence:
  - reference: PMID:28259746
    reference_title: >-
      Acute myeloid leukemia in a patient with thrombocytopenia with absent radii: A case report and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TAR syndrome is not generally associated with bone marrow failure or malignancy.
    explanation: >-
      States directly that neither marrow failure nor malignancy is a general
      feature, which is the claim this interpretation rests on.
  - reference: PMID:28259746
    reference_title: >-
      Acute myeloid leukemia in a patient with thrombocytopenia with absent radii: A case report and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only four cases of leukemia were reported in TAR patients in the literature: three acute myeloid leukemia (AML) and one acute lymphoblastic leukemia.
    explanation: >-
      Quantifies the reported malignancy experience, which is what makes this
      case-report level rather than an established predisposition.
diagnosis:
- name: Prenatal ultrasound detection of bilateral radial aplasia
  description: >-
    Bilateral absence of the radii is visible on routine second-trimester
    ultrasound, and with the thumbs intact it is suggestive enough to prompt
    targeted work-up. Recognition antenatally is what opens the door to
    cordocentesis and, where indicated, in utero transfusion.
  evidence:
  - reference: PMID:24053387
    reference_title: >-
      Prenatal diagnosis and post-mortem examination in a fetus with thrombocytopenia-absent radius (TAR) syndrome due to compound heterozygosity for a 1q21.1 microdeletion and a RBM8A hypomorphic allele: a case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The fetus had bilateral radial agenesis and humeral hypo/aplasia with intact thumbs, micrognathia and urinary anomalies
    explanation: >-
      Records the sonographic presentation, including the intact thumbs that
      point to TAR rather than to a thumb-absent radial ray syndrome.
- name: Preserved thumbs on examination of the hand
  description: >-
    Both thumbs are present despite bilateral radial aplasia. This dissociation
    is the key bedside discriminator from the other radial ray syndromes with
    haematological involvement, in which the thumb is absent or hypoplastic, and
    it is part of the clinical diagnostic triad. Recorded here as a diagnostic
    criterion rather than as a phenotype: a present, normally formed thumb is a
    normal finding, and HPO, being an ontology of phenotypic abnormalities, has
    no term for one. Its significance in TAR is entirely differential.
  evidence:
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with preservation of the thumb, which distinguishes TAR from other syndromes that combine blood abnormalities with absence of the radius, such as Fanconi anemia
    explanation: >-
      States the finding and its discriminating value against Fanconi anemia.
  - reference: PMID:20301781
    reference_title: Thrombocytopenia Absent Radius Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of TAR syndrome is established in a proband with bilateral absent radii, present thumbs, and thrombocytopenia.
    explanation: >-
      Places present thumbs in the clinical triad that establishes the diagnosis.
- name: Cordocentesis platelet count
  description: >-
    Fetal blood sampling confirms the thrombocytopenia and establishes whether
    it is severe enough to justify transfusion before delivery.
  evidence:
  - reference: PMID:7845901
    reference_title: >-
      Prenatal evaluation and in utero platelet transfusion for thrombocytopenia absent radii syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 37 weeks of pregnancy, a CBC obtained by cordocentesis under ultrasound guidance confirmed the diagnosis of thrombocytopenia absent radii (TAR) syndrome.
    explanation: >-
      Describes cordocentesis as the step that confirmed the diagnosis
      antenatally.
- name: Molecular confirmation of the two RBM8A alleles
  description: >-
    Diagnosis is confirmed by finding a null allele, usually the 1q21.1
    microdeletion, together with an RBM8A hypomorphic allele in trans. Testing
    for only one of the two is not sufficient, because carriers of either alone
    are healthy.
  evidence:
  - reference: PMID:20301781
    reference_title: Thrombocytopenia Absent Radius Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a heterozygous null allele (most often a minimally deleted 200-kb region including RBM8A at chromosome band 1q21.1) in a compound heterozygous state with a heterozygous RBM8A hypomorphic allele on molecular genetic testing confirms the diagnosis.
    explanation: >-
      States the two-allele finding that constitutes molecular confirmation.
variants:
- name: RBM8A rs139428292
  description: >-
    The recurrent low-frequency non-coding RBM8A regulatory allele, reported in
    trans with the 1q21.1 microdeletion in molecularly characterized patients.
    Named here because the entry otherwise refers to the regulatory alleles only
    by their position in the 5'UTR or first intron. Classified mLOE rather than
    LOE because the expression loss is modular, not global: reporter activity
    fell in megakaryocytic and osteoblast lines but not in endothelial or HEK293
    cells. That cell-type restriction is the same observation the entry uses to
    model the phenotype as tissue-selective. The caveat is that the evidence is
    reporter activity in cell lines rather than expression measured in primary
    megakaryocytes and limb bud, so "modular" is inferred from which lines
    responded. RBM8A itself is widely expressed, so a reviewer who judged the
    reduction to be global rather than cell-type restricted would classify this
    LOE instead.
  gene:
    preferred_term: RBM8A
    term:
      id: hgnc:9905
      label: RBM8A
  regulatory_category: mLOE
  evidence:
  - reference: PMID:22366785
    reference_title: >-
      Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The minor alleles were associated with significantly lower luciferase activity in human megakaryocytic CHRF and DAMI cell lines and the murine osteoblast cell line MC3T3.
    explanation: >-
      Shows reduced expression confined to megakaryocytic and osteoblast
      contexts, which is what makes this modular rather than global.
  - reference: PMID:24053387
    reference_title: >-
      Prenatal diagnosis and post-mortem examination in a fetus with thrombocytopenia-absent radius (TAR) syndrome due to compound heterozygosity for a 1q21.1 microdeletion and a RBM8A hypomorphic allele: a case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular studies demonstrated compound heterozygosity for the 1q21.1 microdeletion and the RBM8A rs139428292 variant at the hemizygous state, inherited from the mother and father, respectively
    explanation: >-
      Names the specific hypomorphic allele and confirms biparental inheritance
      of the two lesions.

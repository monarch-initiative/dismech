  Two points a reviewer may want to check. First, the entry treats the
  genotype-to-phenotype relation as a dosage threshold rather than
  haploinsufficiency, which is what the healthy-carrier observation requires;
  the residual uncertainty about how the regulatory alleles lower Y14 is
  recorded as an open knowledge gap rather than smoothed over in the causal
  edge. Second, preserved thumbs are recorded under diagnosis rather than as a
  phenotype. A present, normally formed thumb is a normal finding, and HPO is an
  ontology of phenotypic abnormalities, so it has no term for one; the finding
  matters here only as a discriminator from the thumb-absent radial ray
  syndromes, which is a diagnostic role rather than a phenotypic one.

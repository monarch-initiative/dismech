        reference_title: TBC1D24-Related Disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Once the TBC1D24 pathogenic variant(s) have been identified in an affected family member, prenatal and preimplantation genetic testing are possible."

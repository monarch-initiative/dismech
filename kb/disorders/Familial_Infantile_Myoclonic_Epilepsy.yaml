name: Familial Infantile Myoclonic Epilepsy
creation_date: "2026-10-25T00:00:00Z"
category: Mendelian
description: >-
  Familial infantile myoclonic epilepsy (FIME) is the autosomal recessive
  epilepsy in which TBC1D24 was first implicated. It was described in a large
  consanguineous Italian kindred whose affected members began having myoclonic
  seizures in the first year of life, sometimes with febrile or generalized
  tonic-clonic seizures. The myoclonic jerks are bilateral or focal, often
  occur without loss of consciousness, can run for long periods, and some are
  reflex-triggered. In that founding family seizures responded to treatment and
  development and intellect stayed normal over decades, which placed FIME at the
  mild end of what is now called the TBC1D24-related disorder continuum, opposite
  developmental and epileptic encephalopathy 16 and DOORS syndrome. Families
  reported since then with the same early-onset focal and generalized myoclonic
  presentation have had moderate intellectual disability or cerebellar atrophy,
  and GeneReviews now describes FIME with dysarthria and mild-to-moderate
  intellectual disability, so normal cognition is a feature of the original
  kindred rather than of the disorder as a whole. Seizures can persist into
  adulthood. The variants reported so far are missense or in-frame changes;
  the founding family's alleles fail to support TBC1D24-driven neurite growth
  in cultured neurons, and TBC1D24 binds the trafficking GTPase ARF6.
synonyms:
  - FIME
  - TBC1D24-related familial infantile myoclonic epilepsy
parents:
  - Myoclonic Epilepsy
  - Epilepsy
  - Neurological Disease
  - Genetic Disease

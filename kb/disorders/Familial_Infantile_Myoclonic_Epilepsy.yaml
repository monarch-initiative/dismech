inheritance:
  - name: Autosomal recessive inheritance
    description: >-
      FIME requires biallelic TBC1D24 pathogenic variants. It was the first
      idiopathic epilepsy mapped as an autosomal recessive trait, in a family
      descended from the intermarriage of two pairs of siblings.
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
      - reference: PMID:10741954
        reference_title: >-
          Mapping of a locus for a familial autosomal recessive idiopathic
          myoclonic epilepsy of infancy to chromosome 16p13.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The present report constitutes the first example of an idiopathic epilepsy that is inherited as an autosomal recessive trait."
        explanation: >-
          The linkage study of the founding kindred establishes recessive
          inheritance and maps the locus to 16p13, where TBC1D24 lies.
      - reference: PMID:25719194
        reference_title: TBC1D24-Related Disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The diagnosis of a TBC1D24-related disorder is established in an individual with suggestive findings biallelic TBC1D24 pathogenic variants when the mode of inheritance is autosomal recessive (i.e., DOORS syndrome, FIME, PME, EPRPDC, DEE, and DFNB)"
        explanation: >-
          GeneReviews lists FIME among the TBC1D24 phenotypes that are
          diagnosed by biallelic variants under autosomal recessive inheritance.
      - reference: PMID:25719194
        reference_title: TBC1D24-Related Disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Most TBC1D24-related disorders are inherited in an autosomal recessive manner (DOORS syndrome, FIME, PME, EPRPDC, and DEE [including EIMFS])."
        explanation: >-
          GeneReviews names FIME directly as autosomal recessive.
genetic:
  - name: TBC1D24
    notes: >-
      TBC1D24 (16p13.3) encodes a protein with a TBC (Rab-GAP-like) domain and a
      C-terminal TLDc domain; it binds the small GTPase ARF6 and is expressed
      mainly in cerebral cortex and hippocampus. The founding FIME family carries
      compound heterozygous D147H and A509V missense variants. Later FIME
      families carry homozygous E153K or an in-frame 12-bp deletion
      (c.241_252del12), so the FIME alleles reported so far all leave the
      protein in frame.
    gene_term:
      preferred_term: TBC1D24
      term:
        id: hgnc:29203
        label: TBC1D24
    relationship_type: CAUSATIVE
    variant_origin: GERMLINE
    evidence:
      - reference: PMID:20727515
        reference_title: TBC1D24, an ARF6-interacting protein, is mutated in familial infantile myoclonic epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "we found that two compound heterozygous missense mutations (D147H and A509V) in TBC1D24, a gene of unknown function, are responsible for FIME."
        explanation: >-
          Gene discovery in the founding kindred, identifying the two missense
          variants that cause FIME.
      - reference: PMID:25769375
        reference_title: Homozygous TBC1D24 mutation in two siblings with familial infantile myoclonic epilepsy (FIME) and moderate intellectual disability.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We found a homozygous missense mutation, c.457G>A/p.Glu153Lys, in the two affected brothers."
        explanation: >-
          A second, independent FIME family with a homozygous TBC1D24 missense
          variant, replicating the gene-disease association.
      - reference: PMID:35413638
        reference_title: "TBC1D24-related familial infantile multifocal myoclonus: Description of a new Chinese pedigree with a 20 year follow up."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Genetic analysis identified a homozygous TBC1D24 mutation (c.241_252del12) in the proband and his sisters."
        explanation: >-
          A third FIME family, here with a homozygous in-frame deletion.
pathophysiology:
  - name: Biallelic In-Frame TBC1D24 Variant Hypofunction
    description: >-
      Both TBC1D24 alleles carry missense or in-frame variants (D147H in the TBC
      domain and A509V in the TLDc domain in the founding family; homozygous
      E153K or an in-frame 12-bp deletion in later families). The founding
      alleles lose TBC1D24's neurite-promoting activity in cultured neurons.
      Partial rather than complete loss of function is inferred from the
      in-frame nature of the alleles and from the absence of the axon-formation
      defect in neurons from a mildly affected patient; it has not been measured
      directly. The protein is expressed mainly in cerebral cortex and
      hippocampus.

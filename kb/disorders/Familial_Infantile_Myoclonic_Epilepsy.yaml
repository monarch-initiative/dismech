        reference_title: TBC1D24-Related Disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Molecular genetic testing for the familial TBC1D24 pathogenic variant(s) in older and younger sibs of a proband is appropriate in order to identify as early as possible those who would benefit from early treatment of seizures and/or hearing loss."
        explanation: >-
          GeneReviews recommends cascade testing of sibs.
      - reference: PMID:25719194
        reference_title: TBC1D24-Related Disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "If both parents are known to be heterozygous for a TBC1D24 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being heterozygous, and a 25% chance of inheriting neither of the familial TBC1D24 pathogenic variants."
        explanation: >-

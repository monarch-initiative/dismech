  - name: Genetic counseling
    description: >-
      Recessive inheritance gives a 25% recurrence risk to sibs of a proband.
      GeneReviews recommends testing at-risk sibs so seizures can be treated
      early, and prenatal or preimplantation testing is possible once the
      familial variants are known.
    treatment_term:
      preferred_term: genetic counseling

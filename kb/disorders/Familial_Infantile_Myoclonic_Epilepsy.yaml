        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The diagnosis of a TBC1D24-related disorder is established in an individual with suggestive findings biallelic TBC1D24 pathogenic variants when the mode of inheritance is autosomal recessive (i.e., DOORS syndrome, FIME, PME, EPRPDC, DEE, and DFNB)"
        explanation: >-
          GeneReviews diagnostic criterion for FIME.
treatments:
  - name: Antiseizure pharmacotherapy
    description: >-
      Symptomatic pharmacologic management of seizures. Seizures in the founding
      family responded well to treatment, unlike the drug-resistant epilepsy that
      is common elsewhere in the TBC1D24 spectrum. No specific drug has been
      shown to be preferred in FIME.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: anticonvulsant agent therapy
      term:
        id: NCIT:C64172
        label: Anticonvulsant Therapy
    target_mechanisms:
      - target: Cortical Neuronal Hyperexcitability
        description: >-
          Antiseizure medications act on the hyperexcitable network rather than
          on the TBC1D24 lesion upstream of it.
    evidence:
      - reference: PMID:25719194
        reference_title: TBC1D24-Related Disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "symptomatic pharmacologic management for seizures"
        explanation: >-
          GeneReviews recommends symptomatic pharmacologic seizure management.
      - reference: PMID:11879364
        reference_title: "Familial infantile myoclonic epilepsy: clinical features in a large kindred with autosomal recessive inheritance."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FIME is a true idiopathic IME with unremarkable history, no neurologic or mental impairment, good response to treatment, and normal interictal EEG pattern."
        explanation: >-

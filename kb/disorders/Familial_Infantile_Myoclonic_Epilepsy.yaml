        reference_title: TBC1D24, an ARF6-interacting protein, is mutated in familial infantile myoclonic epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "we found that two compound heterozygous missense mutations (D147H and A509V) in TBC1D24, a gene of unknown function, are responsible for FIME."

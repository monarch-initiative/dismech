    downstream:
      - target: Cortical Neuronal Hyperexcitability
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: >-
          Proposed. The discovery paper argues that the neurite defect produces
          subtle cytoarchitectural changes, below the level of a visible
          lesion, that make cortical networks hyperexcitable. No tissue
          observation in patients supports the intermediate step.
        evidence:
          - reference: PMID:20727515
            reference_title: TBC1D24, an ARF6-interacting protein, is mutated in familial infantile myoclonic epilepsy.
            supports: SUPPORT
            directness: INDIRECT
            evidence_source: IN_VITRO
            snippet: "confirmed the emerging role of subtle cytoarchitectural alterations in the etiology of this group of common epileptic disorders."
            explanation: >-
              The authors' interpretation linking the neurite phenotype to
              cytoarchitectural alteration and epilepsy; it is a conclusion
              drawn from the cell assays rather than a tissue observation in

discussions:
  - discussion_id: fime_mild_end_of_tbc1d24_spectrum
    kind: KNOWLEDGE_GAP
    prompt: >-
      What makes the FIME alleles produce a mild, treatment-responsive myoclonic
      epilepsy when other biallelic TBC1D24 variants cause a lethal
      encephalopathy?
    attaches_to:
      - pathophysiology#Biallelic In-Frame TBC1D24 Variant Hypofunction
      - phenotypes#Intellectual disability
    rationale: >-
      The FIME alleles are missense or in-frame, and patient neurons from a mild
      case lack the axon-formation defect seen in severe cases, but neurite
      assays also show that the variants causing the most severe disease are not
      always the most disruptive in a dish. No study has measured synaptic
      vesicle recycling, v-ATPase regulation or oxidative-stress resistance with
      the D147H and A509V alleles, so whether FIME spares one of TBC1D24's
      functions is unknown. Cognitive outcome also differs between FIME
      families, which genotype alone does not yet explain.
    evidence:
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Neuronal outgrowth assays showed that some TBC1D24 mutations, associated with the most severe TBC1D24-associated disorders, are not necessarily the most disruptive to this gene function."
        explanation: >-
          Shows that severity cannot be read off a single neurite-outgrowth
          assay, which is why the basis of FIME's mildness is open.

      - reference: PMID:20727515
        reference_title: TBC1D24, an ARF6-interacting protein, is mutated in familial infantile myoclonic epilepsy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In situ hybridization analysis revealed that Tbc1d24 is mainly expressed at the level of the cerebral cortex and the hippocampus."
        explanation: >-
          Places the lesion in cortical and hippocampal neurons, the tissue in
          which the downstream network effect arises.
      - reference: PMID:20727515
        reference_title: TBC1D24, an ARF6-interacting protein, is mutated in familial infantile myoclonic epilepsy.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "By coimmunoprecipitation assay we found that TBC1D24 binds ARF6, a Ras-related family of small GTPases regulating exo-endocytosis dynamics."
        explanation: >-
          Grounds the small GTPase (ARF6) binding activity recorded on this
          node.
      - reference: PMID:30858606
        reference_title: TBC1D24 regulates axonal outgrowth and membrane trafficking at the growth cone in rodent and human neurons.
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: IN_VITRO
        snippet: "Reprogrammed neurons from a patient with severe developmental encephalopathy show significant axon formation defect that were absent from reprogrammed neurons of a patient with mild early onset epilepsy."
        explanation: >-
          Supports reading the mild-epilepsy alleles as partial rather than
          complete loss of function: neurons from a mildly affected patient
          lack the axon defect of severe disease. The patient was not
          specifically a FIME case, so the inference is indirect.
    downstream:
      - target: Altered ARF6-Dependent Membrane Trafficking
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: >-
          Proposed. TBC1D24 binds ARF6, a small GTPase that regulates
          exo-endocytosis, and TBC1D24 knockdown alters ARF6 activation; no
          study has measured ARF6 signalling with the FIME alleles.
        evidence:
          - reference: PMID:20727515
            reference_title: TBC1D24, an ARF6-interacting protein, is mutated in familial infantile myoclonic epilepsy.
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: "By coimmunoprecipitation assay we found that TBC1D24 binds ARF6, a Ras-related family of small GTPases regulating exo-endocytosis dynamics."
            explanation: >-
              Establishes the TBC1D24-ARF6 interaction on which this edge rests.
          - reference: PMID:30858606
            reference_title: TBC1D24 regulates axonal outgrowth and membrane trafficking at the growth cone in rodent and human neurons.
            supports: SUPPORT
            directness: INDIRECT
            evidence_source: IN_VITRO
            snippet: "The axonal phenotype was accompanied by an impairment of endocytosis at the growth cone and an altered activation of the TBC1D24 molecular partner ADP ribosylation factor 6."
            explanation: >-
              Loss of TBC1D24 by knockdown alters ARF6 activation; the FIME
              alleles themselves were not tested, so the link is inferred.
      - target: Impaired Synaptic Vesicle Endocytosis
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: >-
          Disease-associated TBC1D24 variants behave as loss-of-function alleles,
          and loss of TBC1D24 impairs presynaptic endocytosis. This edge is
          inferred for FIME: the synaptic studies used knockdown, knockout and
          an allelic series of other disease variants, not the FIME alleles.
        evidence:
          - reference: PMID:30335140
            reference_title: The epilepsy-associated protein TBC1D24 is required for normal development, survival and vesicle trafficking in mammalian neurons.
            supports: SUPPORT
            directness: INDIRECT
            evidence_source: MODEL_ORGANISM
            snippet: "The cellular studies reveal that disease-causing mutations that disrupt either of the conserved protein domains in TBC1D24 are implicated in neuronal development and survival and are likely acting as loss-of-function alleles."
            explanation: >-
              Supports treating pathogenic TBC1D24 variants, including ones in
              either domain as the FIME alleles are, as loss of function feeding
              into the synaptic defect.
  - name: Altered ARF6-Dependent Membrane Trafficking
    description: >-
      Proposed node. TBC1D24 interacts with ARF6, which regulates membrane
      exo-endocytosis, dendritic branching, spine formation and axonal
      extension. The discovery paper proposed this pathway as the route from
      TBC1D24 to brain hyperexcitability; whether the FIME alleles change ARF6
      signalling has not been measured.
    biological_scale: MOLECULAR
    cell_types:

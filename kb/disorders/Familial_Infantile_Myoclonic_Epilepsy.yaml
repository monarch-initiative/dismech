            explanation: >-
              The discovery paper's conclusion linking the pathway to
              hyperexcitability, inferred from the genetics and cell assays.
  - name: Impaired Synaptic Vesicle Endocytosis
    description: >-
      TBC1D24 positively regulates the v-ATPase and is needed for normal
      presynaptic endocytosis and vesicle reacidification. Loss of TBC1D24 in
      mouse neurons impairs endocytosis, enlarges the endosomal compartment and
      reduces spontaneous neurotransmission. This mechanism is shared across the
      TBC1D24 spectrum and has not been measured specifically with the FIME
      alleles.
    biological_scale: CELLULAR
    cell_types:

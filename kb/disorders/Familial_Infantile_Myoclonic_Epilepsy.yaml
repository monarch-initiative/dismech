          label: neuron
    biological_processes:
      - preferred_term: regulation of ARF protein signal transduction
        term:
          id: GO:0032012
          label: regulation of ARF protein signal transduction
    evidence:
      - reference: PMID:20727515
        reference_title: TBC1D24, an ARF6-interacting protein, is mutated in familial infantile myoclonic epilepsy.
        supports: SUPPORT
        quote_role: BACKGROUND
        evidence_source: IN_VITRO
        snippet: "The main recognized function of ARF6 in the nervous system is the regulation of dendritic branching, spine formation, and axonal extension."
        explanation: >-
          Describes the ARF6-regulated neuronal processes through which
          TBC1D24 dysfunction is proposed to act.
    downstream:
      - target: Reduced Neurite Outgrowth and Arborization
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: >-
          TBC1D24 overexpression lengthens and branches neurites, and the FIME
          variants cancel that effect. That ARF6 mediates the effect is the
          authors' proposal; the assay did not test ARF6 dependence.
        evidence:
          - reference: PMID:20727515
            reference_title: TBC1D24, an ARF6-interacting protein, is mutated in familial infantile myoclonic epilepsy.
            supports: SUPPORT
            directness: INDIRECT
            evidence_source: IN_VITRO
            snippet: "TBC1D24 overexpression resulted in a significant increase in neurite length and arborization and the FIME mutations significantly reverted this phenotype."
            explanation: >-
              Functional test of the FIME alleles showing loss of TBC1D24's
              neurite-promoting activity. It does not test whether ARF6
              mediates the effect, so it supports this edge only indirectly.
  - name: Reduced Neurite Outgrowth and Arborization
    description: >-
      With the FIME alleles, TBC1D24 no longer promotes neurite elongation and
      branching. The resulting defect is a subtle one in neuronal
      cytoarchitecture, not the gross failure of axon specification seen with
      the variants behind the severe TBC1D24 encephalopathies.
    biological_scale: CELLULAR
    cell_types:

        reference_title: The epilepsy-associated protein TBC1D24 is required for normal development, survival and vesicle trafficking in mammalian neurons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "genetic disruption of Tbc1d24 expression in the mouse leads to an impairment of endocytosis and an enlarged endosomal compartment in neurons with a decrease in spontaneous neurotransmission."
        explanation: >-
          Shows the presynaptic endocytic defect caused by reduced Tbc1d24 in
          mouse neurons.
      - reference: PMID:39758816
        reference_title: TBC1D24 interacts with the v-ATPase and regulates intraorganellar pH in neurons.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Furthermore, synaptic vesicles endocytosis and reacidification were impaired."
        explanation: >-
          Confirms impaired synaptic vesicle endocytosis and reacidification in
          Tbc1d24 knockout neurons.
    downstream:
      - target: Cortical Neuronal Hyperexcitability
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: >-
          Defective vesicle recycling is proposed as a common synaptic mechanism
          behind the epilepsies of the TBC1D24 spectrum.
        evidence:
          - reference: PMID:30335140
            reference_title: The epilepsy-associated protein TBC1D24 is required for normal development, survival and vesicle trafficking in mammalian neurons.
            supports: SUPPORT
            directness: INDIRECT
            evidence_source: MODEL_ORGANISM
            snippet: "These data reveal the essential role for TBC1D24 at the mammalian synapse and help to define common synaptic mechanisms that could underlie the varied effects of TBC1D24 mutations in neurological disease."
            explanation: >-
              The authors present the synaptic defect as a candidate common
              mechanism for TBC1D24 neurological disease; the link to seizures
              is proposed, not demonstrated.
  - name: Cortical Neuronal Hyperexcitability
    description: >-
      Hyperexcitable cortical networks generate the infantile-onset focal and
      generalized myoclonic seizures, the generalized tonic-clonic and febrile
      seizures, and the prolonged myoclonic attacks of FIME. FIME was described
      as an idiopathic epilepsy with no detectable brain lesion, interictal EEG
      is often normal despite frequent seizures, and in the founding family
      seizures persisted into adulthood.
    biological_scale: TISSUE
    locations:
      - preferred_term: cerebral cortex
        term:
          id: UBERON:0000956
          label: cerebral cortex
    evidence:
      - reference: PMID:20727515
        reference_title: TBC1D24, an ARF6-interacting protein, is mutated in familial infantile myoclonic epilepsy.
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: HUMAN_CLINICAL
        snippet: "unveiled the involvement of ARF6-dependent molecular pathway in brain hyperexcitability and seizures"
        explanation: >-
          Names brain hyperexcitability as the network state behind FIME
          seizures.
      - reference: PMID:11879364
        reference_title: "Familial infantile myoclonic epilepsy: clinical features in a large kindred with autosomal recessive inheritance."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FIME is a true idiopathic IME with unremarkable history, no neurologic or mental impairment, good response to treatment, and normal interictal EEG pattern."
        explanation: >-
          Idiopathic epilepsy with a normal interictal EEG in the founding
          family: the hyperexcitability is functional, without a structural
          lesion.

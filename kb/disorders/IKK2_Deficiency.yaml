  notes: >
    IKBKB encodes IKK2 (IKKbeta), the catalytic serine/threonine kinase of the
    canonical NF-kappaB pathway. The founder frameshift duplication c.1292dupG
    (exon 13) abolishes IKK2 expression, causing complete loss of function.
  evidence:
  - reference: PMID:24369075
    reference_title: "Deficiency of innate and acquired immunity caused by an IKBKB mutation."
    supports: SUPPORT

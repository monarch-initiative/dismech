animal_models:
- name: Ikbkb knockout mouse
  species: Mouse
  genotype: Ikbkb -/-
  publication: PMID:24369075
  description: >
    Constitutive Ikbkb (Ikk2) knockout is embryonic-lethal in mice, so the mouse
    null does not model the viable human combined immunodeficiency; the human
    phenotype indicates a more restricted role of IKK2-NF-kappaB signaling in
    humans than the mouse predicts.
  modeled_mechanisms:
  - target: Impaired Immune-Cell Activation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: The mouse null is embryonic-lethal and cannot recapitulate the viable human immunodeficiency.
    limitations: >
      Embryonic lethality precludes study of the immune phenotype in the complete
      mouse knockout, a species-divergence limitation.
    evidence:
    - reference: PMID:24369075
      reference_title: "Deficiency of innate and acquired immunity caused by an IKBKB mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although Ikk2 deficiency is lethal in mouse embryos, our observations suggest a more restricted, unique role of IKK2-NF-κB signaling in humans."
      explanation: Documents mouse embryonic lethality and the human-mouse divergence (a HUMAN_MODEL_MISMATCH).
notes: >
  IKK2 deficiency is a signaling SCID: unlike lymphopenic SCID, lymphocyte
  development and numbers are normal but activation through the canonical
  NF-kappaB pathway is lost. It is distinct from NEMO (IKBKG) deficiency, which
  affects the same pathway but also causes ectodermal dysplasia and is X-linked.
  Although Ikbkb knockout is embryonic-lethal in mice, human IKK2 deficiency is
  compatible with normal lymphocyte development, indicating a more restricted role
  of IKK2-NF-kappaB signaling in humans. A separate autosomal dominant gain-of-function
  IKBKB disorder (IMD15A) exists (e.g. p.V203I), the same gene in the opposite
  functional direction, and should not be confused with this loss-of-function entity.

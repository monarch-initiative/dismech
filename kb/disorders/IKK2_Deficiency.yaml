pathophysiology:
- name: IKK2 Loss of Function
  biological_scale: MOLECULAR
  description: >
    Biallelic IKBKB loss-of-function variants abolish expression of IKK2
    (IKKbeta), the catalytic kinase of the IKK complex that phosphorylates IkappaB
    to trigger canonical NF-kappaB activation.
  genetic_context:
    allele_type: INDEL
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: IkappaB kinase activity
    term:
      id: GO:0008384
      label: IkappaB kinase activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of Canonical NF-kappaB Activation
    causal_link_type: DIRECT
    description: Without IKK2, IkappaB is not phosphorylated and NF-kappaB is not released for nuclear translocation.
    evidence:
    - reference: PMID:24369075
      reference_title: "Deficiency of innate and acquired immunity caused by an IKBKB mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "leading to loss of expression of IKK2, a component of the IKK-nuclear factor κB (NF-κB) pathway"
      explanation: Loss of the IKK2 kinase directly disables the canonical NF-kappaB pathway.
- name: Failure of Canonical NF-kappaB Activation
  biological_scale: CELLULAR
  description: >
    Loss of IKK2 kinase activity prevents phosphorylation and degradation of
    IkappaB, so NF-kappaB is retained in the cytoplasm and canonical NF-kappaB
    target-gene transcription is not induced upon receptor engagement.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Impaired Immune-Cell Activation
    causal_link_type: DIRECT
    description: NF-kappaB is required to transduce activation signals from antigen, pattern-recognition, and cytokine receptors.
    evidence:
    - reference: PMID:24369075
      reference_title: "Deficiency of innate and acquired immunity caused by an IKBKB mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Immune cells from the patients had impaired responses to stimulation through T-cell receptors, B-cell receptors, toll-like receptors, inflammatory cytokine receptors, and mitogens."
      explanation: Documents the broad activation-signaling failure that follows loss of NF-kappaB activation.
- name: Impaired Immune-Cell Activation
  biological_scale: CELLULAR
  description: >
    Because canonical NF-kappaB cannot be activated, T cells, B cells, and innate
    immune cells fail to respond to receptor stimulation. Despite normal
    development and counts, circulating T and B cells remain almost exclusively
    naive and cannot mature into memory/effector subsets; regulatory T cells and
    gamma-delta T cells are absent.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  - preferred_term: gamma-delta T cell
    term:
      id: CL:0000798
      label: gamma-delta T cell
  downstream:
  - target: Hypogammaglobulinemia
    causal_link_type: DIRECT
    description: Failed B-cell activation and germinal-center reactions produce hypogammaglobulinemia.
  - target: Agammaglobulinemia
    causal_link_type: DIRECT
    description: In the most severe cases immunoglobulin is absent.
  - target: Systemic Combined Immunodeficiency
    causal_link_type: DIRECT
    description: Failure of lymphocyte activation and differentiation produces a combined humoral and cellular immunodeficiency.
    evidence:
    - reference: PMID:24369075
      reference_title: "Deficiency of innate and acquired immunity caused by an IKBKB mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patients had hypogammaglobulinemia or agammaglobulinemia, and their peripheral-blood B cells and T cells were almost exclusively of naive phenotype. Regulatory T cells and γδ T cells were absent."
      explanation: Documents the naive-only lymphocyte state and absent Treg/gamma-delta subsets underlying the immunodeficiency.
- name: Systemic Combined Immunodeficiency
  biological_scale: ORGANISM
  description: >
    The net result is a combined defect of adaptive and innate immunity:
    hypo- or agammaglobulinemia despite normal lymphocyte counts, with
    susceptibility to severe viral, bacterial, and fungal infection from infancy.
  downstream:
  - target: Recurrent infections
    causal_link_type: DIRECT
    description: The combined immunodeficiency manifests as severe, recurrent, early-onset infections.
    evidence:
    - reference: PMID:24369075
      reference_title: "Deficiency of innate and acquired immunity caused by an IKBKB mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "IKK2 deficiency results in an impaired response to activation stimuli in a variety of immune cells, leading to clinically relevant impairment of adaptive and innate immunity."
      explanation: States the clinical combined immunodeficiency that results.
  - target: Combined immunodeficiency
    causal_link_type: DIRECT
    description: The organism-level outcome is a clinical combined immunodeficiency.
  - target: Recurrent mycobacterial infections
    causal_link_type: DIRECT
    description: Impaired innate/adaptive immunity confers susceptibility to mycobacteria, including vaccine-strain BCG.
  - target: Recurrent fungal infections
    causal_link_type: DIRECT
    description: Susceptibility extends to fungal infection (chronic mucocutaneous candidiasis, pneumocystis).
  - target: Failure to thrive
    causal_link_type: DIRECT
    description: Early-onset severe infection is usually accompanied by failure to thrive.

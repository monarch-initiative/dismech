diagnosis:
- name: Combined immunodeficiency evaluation (TREC-negative)
  description: >
    Diagnosis rests on IKBKB sequencing plus functional demonstration of impaired
    NF-kappaB activation; critically, because lymphocyte development is normal,
    T-cell receptor excision circle (TREC) newborn screening is normal and misses
    IKBKB deficiency, so a normal TREC does not exclude it.
  evidence:
  - reference: PMID:30391351
    reference_title: "Clinical presentation, immunologic features, and hematopoietic stem cell transplant outcomes for IKBKB immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T-cell receptor excision circles were normal, meaning newborn screening by TREC analysis would miss IKBKB cases."
    explanation: States the key diagnostic pitfall - normal TREC newborn screening misses IKBKB deficiency.
treatments:
- name: Hematopoietic stem cell transplantation
  description: >
    Allogeneic hematopoietic stem cell transplantation replaces the IKK2-deficient
    hematopoietic system and is the definitive, potentially curative treatment for
    this SCID, as for other severe combined immunodeficiencies.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Impaired Immune-Cell Activation
    description: HSCT replaces the IKK2-deficient hematopoietic compartment, restoring NF-kappaB-competent immune cells; the only known curative therapy, though outcomes are guarded.
  evidence:
  - reference: PMID:30391351
    reference_title: "Clinical presentation, immunologic features, and hematopoietic stem cell transplant outcomes for IKBKB immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urgent HSCT, performed in eight patients, remains the only known curative therapy, although only three patients are survivors."
    explanation: Establishes HSCT as the only curative therapy and reports its guarded outcomes.
- name: Immunoglobulin replacement therapy
  description: Immunoglobulin replacement for the hypo-/agammaglobulinemia.
  therapeutic_modality: PROTEIN_REPLACEMENT

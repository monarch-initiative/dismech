name: IKK2 Deficiency
creation_date: "2026-09-03T14:13:55Z"
category: Mendelian
synonyms:
- severe combined immunodeficiency due to IKK2 deficiency
- combined immunodeficiency due to IKBKB deficiency
- IKBKB deficiency
- immunodeficiency 15B
- IMD15B
- IKK2 deficiency
description: >
  IKK2 deficiency (severe combined immunodeficiency due to IKK2 deficiency;
  immunodeficiency 15B) is an autosomal recessive inborn error of immunity caused
  by biallelic loss-of-function variants in IKBKB, the gene encoding IkappaB
  kinase 2 (IKK2/IKKbeta), the catalytic kinase of the canonical NF-kappaB
  activation pathway. It was defined in infants of Northern Cree ancestry
  homozygous for the IKBKB frameshift duplication c.1292dupG, which abolishes IKK2
  expression.

  Mechanistically the disease is a signaling defect rather than a developmental
  block: T-cell and B-cell development is essentially normal and lymphocyte counts
  are preserved, but without IKK2 the canonical NF-kappaB pathway cannot be
  activated downstream of the T-cell receptor, B-cell receptor, Toll-like
  receptors, and inflammatory cytokine receptors. The consequence is a combined
  immunodeficiency in which circulating T and B cells are almost exclusively of
  naive phenotype, regulatory T cells and gamma-delta T cells are absent, and
  patients have hypo- or agammaglobulinemia despite normal lymphocyte numbers.
  Onset is in infancy with life-threatening viral, bacterial, and fungal
  infections and failure to thrive; hematopoietic stem cell transplantation is
  the definitive treatment.

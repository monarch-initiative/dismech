      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_mechanisms:
  - target: Hypogammaglobulinemia
    description: Immunoglobulin replacement substitutes for the antibody the patient cannot produce.
  evidence:
  - reference: PMID:30391351
    reference_title: "Clinical presentation, immunologic features, and hematopoietic stem cell transplant outcomes for IKBKB immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoglobulin replacement was variable between patients and generally continued between 3- and 12-months post-HSCT."
    explanation: Documents immunoglobulin replacement use in the cohort.
- name: Anti-infective prophylaxis
  description: Antimicrobial prophylaxis against the broad infection susceptibility, continued long-term after transplant.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Recurrent infections
    description: Antimicrobial prophylaxis reduces the recurrent infections driven by the immunodeficiency.
  evidence:
  - reference: PMID:30391351

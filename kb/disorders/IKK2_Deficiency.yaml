notes: >
  IKK2 deficiency is a signaling SCID: unlike lymphopenic SCID, lymphocyte
  development and numbers are normal but activation through the canonical
  NF-kappaB pathway is lost. It is distinct from NEMO (IKBKG) deficiency, which
  affects the same pathway but also causes ectodermal dysplasia and is X-linked.
  Although Ikbkb knockout is embryonic-lethal in mice, human IKK2 deficiency is
  compatible with normal lymphocyte development, indicating a more restricted role
  of IKK2-NF-kappaB signaling in humans.

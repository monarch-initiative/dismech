review_notes: >-
  Kyasanur forest disease is split from Omsk hemorrhagic fever and Alkhurma
  hemorrhagic fever despite the close relationship among their tick-borne
  orthoflaviviruses: KFDV is maintained in the Indian Western Ghats by
  Haemaphysalis ticks with monkey-mortality sentinels, whereas Omsk hemorrhagic
  fever is a Russian Dermacentor/muskrat-water-vole disease and Alkhurma
  hemorrhagic fever is an Arabian Orthoflavivirus kyasanurense disease with
  different tick and livestock exposures. The KFDV endothelial-cell mechanism
  is anchored to a primary-cell infection study that measured endothelial
  activation, adhesion-molecule induction and dendritic-cell conditioned-media
  signaling; direct monolayer-permeability evidence is still absent, so the
  final vascular-permeability node is modeled as an indirect hemorrhagic-fever
  conformance rather than as a directly observed KFDV assay result.

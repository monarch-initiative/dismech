name: Kyasanur Forest Disease
creation_date: '2026-11-03T11:44:35Z'
category: Infectious
description: >-
  Kyasanur forest disease is an Indian Western Ghats tick-borne viral
  hemorrhagic fever caused by Kyasanur Forest disease virus, an orthoflavivirus
  maintained in an enzootic cycle involving Haemaphysalis ticks and forest
  vertebrates. Humans are incidental hosts infected mainly by bites of infected
  Haemaphysalis spinigera ticks while working in or near forests, plantations or
  cattle-grazing areas, or less commonly after contact with sick or dead
  monkeys. After a 3- to 8-day incubation, the first illness phase is an acute
  febrile syndrome with headache, severe myalgia, vomiting, leukopenia,
  thrombocytopenia, transaminitis and mucosal hemorrhage in a minority of
  patients; about 20% of cases relapse after remission into a second febrile
  phase dominated by neurologic symptoms. Primary human endothelial cells and
  monocyte-derived dendritic cells are permissive to KFDV in vitro: infected
  endothelial cells up-regulate E-selectin, ICAM1 and VCAM1, show increased
  leukocyte adhesion, and receive activating signals from infected dendritic
  cells, providing a direct and cytokine-mediated route into the shared viral
  hemorrhagic fever endothelial-injury program.
disease_term:
  preferred_term: Kyasanur forest disease
  term:
    id: MONDO:0017881
    label: Kyasanur forest disease
parents:
- Viral Hemorrhagic Fever
synonyms:
- KFD
- Monkey fever
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Kyasanur forest disease is geographically focal and many reported cases
    recover after the first febrile phase, but a sizeable minority has a
    biphasic neurologic relapse and severe outbreaks still carry measurable
    mortality; a 2000-2025 systematic review estimated a pooled 4% case
    fatality ratio among reported Indian cases.
  evidence:
  - reference: PMID:30381537
    reference_title: "Clinical & epidemiological significance of Kyasanur forest disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Up to 20 per cent of patients may present with biphasic illness"
    explanation: Documents the sizeable biphasic subgroup that drives the variable neurologic burden.
  - reference: PMID:42799065
    reference_title: "Epidemiology of Kyasanur forest disease in India, 2000-2025: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The pooled CFR was 4% (95% CI: 2-8)."
    explanation: Quantifies mortality in a systematic review of Indian KFD studies from 2000 to 2025.
infectious_agent:
- name: Kyasanur Forest disease virus
  description: >-
    Tick-borne, positive-sense RNA orthoflavivirus in the family Flaviviridae;
    the species is currently Orthoflavivirus kyasanurense and includes the
    Indian Kyasanur Forest disease virus and the closely related Alkhumra
    hemorrhagic fever virus from the Arabian Peninsula.
  infectious_agent_term:
    preferred_term: Orthoflavivirus kyasanurense
    term:
      id: NCBITaxon:3048170
      label: Orthoflavivirus kyasanurense
  evidence:
  - reference: PMID:41202828
    reference_title: "Kyasanur Forest disease: an emerging arboviral threat."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Kyasanur Forest disease is a neglected tick-borne viral haemorrhagic fever
      endemic to India's Western Ghats, caused by the Kyasanur Forest disease
      virus, a flavivirus transmitted by Haemaphysalis spinigera ticks.
    explanation: Identifies KFDV as the flaviviral cause of the disease and ties it to H. spinigera tick transmission.
agent_life_cycle:
  description: >-
    KFDV circulates in forests and ecotones of the Indian Western Ghats through
    ixodid ticks, especially Haemaphysalis spinigera, that acquire and maintain
    virus while feeding on primates, rodents, shrews and birds. Humans are
    dead-end incidental hosts; monkey deaths are outbreak sentinels, while tick
    infection sustains local transmission.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: incidental dead-end host
  - preferred_term: Haemaphysalis spinigera
    term:
      id: NCBITaxon:1134476
      label: Haemaphysalis spinigera
    role: vector and reservoir host
transmission:
- name: Haemaphysalis spinigera tick-bite transmission
  description: >-
    Humans are infected when a KFDV-infected hard tick, mainly H. spinigera in
    the endemic Western Ghats cycle, bites them during forest, farming,
    plantation, grazing or other outdoor exposures.
  evidence:
  - reference: PMID:30381537
    reference_title: "Clinical & epidemiological significance of Kyasanur forest disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Humans are infected by the bite of tick"
    explanation: Identifies tick bite as the human transmission route.
  - reference: PMID:42799065
    reference_title: "Epidemiology of Kyasanur forest disease in India, 2000-2025: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      KFDV circulation in ticks was reported in 11 studies (3466 tick pools
      tested, 116 positive), predominantly Haemaphysalis spinigera and
      Haemaphysalis turturis.
    explanation: Confirms that Indian field surveillance finds KFDV chiefly in Haemaphysalis tick pools.
- name: Exposure to infected sick or dead monkeys
  description: >-
    Sick or dead infected monkeys mark new foci and can expose nearby people
    either through contact with infected animal material or through infected
    ticks around the carcass.
  evidence:
  - reference: PMID:30401896
    reference_title: Kyasanur Forest disease virus infection activates human vascular endothelial cells and monocyte-derived dendritic cells.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Transmission of KFDV to humans occurs after an infected tick bite (mainly
      Haemaphysalis spinigera) or contact with an infected animal, mostly sick
      or dead monkeys.
    explanation: Identifies infected sick or dead monkeys as the main infected-animal exposure in KFD transmission.
prevalence:
- population: Endemic and outbreak districts along the Western Ghats of India
  measure_type: ANNUAL_INCIDENCE
  rate_denominator: POPULATION_PER_YEAR
  prevalence_class: RARE
  notes: >-
    KFDV circulation is focal to southern and western Indian forest ecotones.
    In studies from 2000-2025, 2798 cumulative KFD cases were identified in the
    evidence synthesis and confirmed activity had expanded beyond the original
    Karnataka focus into other Western Ghats states.
  evidence:
  - reference: PMID:42799065
    reference_title: "Epidemiology of Kyasanur forest disease in India, 2000-2025: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Of 2798 cumulative cases"
    explanation: Provides the cumulative confirmed-case count synthesized across contemporary Indian KFD studies.
  - reference: PMID:41202828
    reference_title: "Kyasanur Forest disease: an emerging arboviral threat."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "endemic to India's Western Ghats"
    explanation: Localizes endemic KFD to India's Western Ghats.
progression:
- phase: Incubation and first febrile phase
  duration: 3 to 8 days incubation followed by acute fever
  notes: >-
    After exposure, patients develop sudden fever with headache, generalized
    pain, prominent neck/back/extremity myalgia, conjunctival inflammation and
    gastrointestinal symptoms.
  evidence:
  - reference: PMID:30381537
    reference_title: "Clinical & epidemiological significance of Kyasanur forest disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The incubation period of KFDV in humans is 3-8 days"
    explanation: Establishes the incubation period before symptomatic KFD.
  - reference: PMID:30381537
    reference_title: "Clinical & epidemiological significance of Kyasanur forest disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the first phase, patients usually present with sudden onset of fever,
      headache and generalized body pain, especially of the neck, upper and
      lower back and extremities.
    explanation: Characterizes the acute febrile first phase and its headache/myalgia syndrome.
- phase: Early hemorrhagic manifestations
  duration: from days 3 to 4 after symptom onset
  notes: >-
    Mucosal inflammation, palatal maculopapular eruption, conjunctival
    congestion, hematemesis, epistaxis and rectal bleeding may appear during
    the first phase; persistent hemorrhage is associated with poor outcome.
  evidence:
  - reference: PMID:30381537
    reference_title: "Clinical & epidemiological significance of Kyasanur forest disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Haemorrhagic manifestations are part of initial phase and may begin 3-4
      days after onset of symptoms
    explanation: Places the hemorrhagic component within the initial febrile phase.
- phase: Secondary neurologic phase
  duration: 12 to 14 days in biphasic cases
  notes: >-
    Up to 20% of patients relapse into a second fever with drowsiness,
    disorientation, confusion, rare convulsion or loss of consciousness, while
    most patients recover from the first phase without neurologic relapse.
  evidence:
  - reference: PMID:30381537
    reference_title: "Clinical & epidemiological significance of Kyasanur forest disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Up to 20 per cent of patients may present with biphasic illness
    explanation: Quantifies the subgroup that develops a second phase after the first illness.
  - reference: PMID:30381537
    reference_title: "Clinical & epidemiological significance of Kyasanur forest disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Neurological features include drowsiness, transient disorientation,
      confusion, rarely convulsion and loss of consciousness.
    explanation: Lists the neurologic manifestations of the second phase.
pathophysiology:
- name: KFDV Infection of Human Vascular and Dendritic Cells
  description: >-
    KFDV can productively infect primary human vascular endothelial cells and
    monocyte-derived dendritic cells in vitro, placing viral replication in the
    two target-cell populations that couple tick-inoculated flaviviral
    replication to vascular activation.
  role: trigger
  biological_scale: CELLULAR
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  evidence:
  - reference: PMID:30401896
    reference_title: Kyasanur Forest disease virus infection activates human vascular endothelial cells and monocyte-derived dendritic cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      the first time that human ECs are permissive to KFDV infection, which
      leads to EC activation, release of interleukin (IL)-6, a marked increase
      in leukocyte adhesion molecule expression, and increased leukocyte
      adhesion. MoDCs are also permissive to KFDV infection
    explanation: Shows that human endothelial cells and monocyte-derived dendritic cells can both support KFDV infection.
  downstream:
  - target: Endothelial Cell Adhesion and Cytokine Activation
    description: Productive infection of endothelial cells and dendritic cells directly and indirectly activates endothelial inflammatory signaling.
- name: Endothelial Cell Adhesion and Cytokine Activation
  conforms_to: viral_hemorrhagic_fever_syndrome#Endothelial Activation and Damage
  description: >-
    KFDV-infected endothelial cells up-regulate the leukocyte adhesion molecules
    E-selectin, ICAM1 and VCAM1 and show increased leukocyte adhesion, while
    infected monocyte-derived dendritic cells release cytokines that activate
    endothelial cells by a paracrine route.
  role: central_effector
  biological_scale: CELLULAR
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: endothelial cell activation
    modifier: INCREASED
    term:
      id: GO:0042118
      label: endothelial cell activation
  evidence:
  - reference: PMID:30401896
    reference_title: Kyasanur Forest disease virus infection activates human vascular endothelial cells and monocyte-derived dendritic cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      ECs are permissive to KFDV infection, which leads to their activation, as
      demonstrated by the upregulation of E-selectin, intercellular adhesion
      molecule 1, and vascular cell adhesion molecule 1 at the mRNA and protein
      levels.
    explanation: Demonstrates direct endothelial activation after KFDV infection.
  - reference: PMID:30401896
    reference_title: Kyasanur Forest disease virus infection activates human vascular endothelial cells and monocyte-derived dendritic cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Supernatants from KFDV-infected moDCs caused EC activation, as measured
      by leukocyte adhesion.
    explanation: Demonstrates an indirect cytokine-mediated route from infected dendritic cells to endothelial activation.
  downstream:
  - target: Increased Vascular Permeability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Endothelial activation, inflammatory leukocyte adhesion, and junctional
      disorganization provide a plausible but not directly assayed route into
      vascular leak in human KFD.
- name: Increased Vascular Permeability
  conforms_to: viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability
  description: >-
    Severe KFD manifests the vascular-leak and hemostatic limb of the viral
    hemorrhagic fever syndrome, expressed clinically as mucosal hemorrhage,
    hematemesis, epistaxis and persistent bleeding; the in-vitro KFDV evidence
    supports the preceding endothelial activation step but has not directly
    measured monolayer permeability.
  role: terminal_effector
  biological_scale: TISSUE
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: regulation of vascular permeability
    modifier: ABNORMAL
    term:
      id: GO:0043114
      label: regulation of vascular permeability
  evidence:
  - reference: PMID:30381537
    reference_title: "Clinical & epidemiological significance of Kyasanur forest disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Persistence of haemorrhagic manifestations can lead to poor outcome.
    explanation: Links persistent KFD hemorrhagic manifestations to the clinically severe end of the vascular syndrome.
  - reference: PMID:30401896
    reference_title: Kyasanur Forest disease virus infection activates human vascular endothelial cells and monocyte-derived dendritic cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: >-
      The results indicate that ECs and moDCs can be targets for KFDV and that
      both direct and indirect mechanisms can contribute to EC activation.
    explanation: Supports the upstream endothelial-activation branch that is modeled as an indirect input into permeability.
  downstream:
  - target: Hematemesis
    description: Loss of vascular barrier integrity and thrombocytopenia permit gastrointestinal mucosal bleeding.
  - target: Epistaxis
    description: Loss of vascular barrier integrity and thrombocytopenia permit nasal mucosal bleeding.

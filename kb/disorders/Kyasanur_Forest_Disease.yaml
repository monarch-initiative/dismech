    term:
      id: UBERON:0001981
      label: blood vessel
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: regulation of vascular permeability
    modifier: INCREASED
    term:
      id: GO:0043114
      label: regulation of vascular permeability
  evidence:
  - reference: PMID:30381537
    reference_title: "Clinical & epidemiological significance of Kyasanur forest disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Persistence of haemorrhagic manifestations can lead to poor outcome.
    explanation: Links persistent KFD hemorrhagic manifestations to the clinically severe end of the vascular syndrome.
  - reference: PMID:30401896
    reference_title: Kyasanur Forest disease virus infection activates human vascular endothelial cells and monocyte-derived dendritic cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: >-
      The results indicate that ECs and moDCs can be targets for KFDV and that
      both direct and indirect mechanisms can contribute to EC activation.
    explanation: Supports the upstream endothelial-activation branch that is modeled as an indirect input into permeability.
  downstream:
  - target: Hematemesis
    description: Loss of vascular barrier integrity and thrombocytopenia permit gastrointestinal mucosal bleeding.
  - target: Epistaxis
    description: Loss of vascular barrier integrity and thrombocytopenia permit nasal mucosal bleeding.
  - target: Bleeding Per Rectum
    description: Loss of vascular barrier integrity and thrombocytopenia permit lower gastrointestinal mucosal bleeding.
  - target: Pulmonary Edema
    description: In fatal KFD, vascular leak can progress to pulmonary edema as the described main cause of death.

diagnosis:
- name: KFDV RT-PCR
  description: >-
    Nested RT-PCR and TaqMan real-time RT-PCR detect KFDV RNA in acute-phase
    serum and are suited to early laboratory confirmation before seroconversion.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:22874757
    reference_title: "Diagnosis of Kyasanur forest disease by nested RT-PCR, real-time RT-PCR and IgM capture ELISA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Both the assays detected KFD viral RNA in acute phase human serum samples
      and can provide early diagnosis of infection.
    explanation: Demonstrates acute-phase molecular detection of KFDV RNA by nested RT-PCR and real-time RT-PCR.
- name: KFDV IgM Capture ELISA
  description: >-
    IgM capture ELISA detects recent KFDV infection and complements RT-PCR for
    later or post-acute serologic confirmation.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458

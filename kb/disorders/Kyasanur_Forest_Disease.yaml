    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: tight junction organization
    modifier: ABNORMAL
    term:
      id: GO:0120193
      label: tight junction organization
  evidence:
  - reference: PMID:30401896
    reference_title: Kyasanur Forest disease virus infection activates human vascular endothelial cells and monocyte-derived dendritic cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Distinct ZO-1 staining was observed in uninfected cells, but the staining
      was slightly fragmented in KFDV-infected cells relative to the controls
      (Fig. 2d). In KFDV-infected cells, occludin immunoreactivity was
      substantially reduced relative to control cells
    explanation: Identifies ZO-1 and occludin changes at tight junctions in KFDV-infected endothelial monolayers.
  downstream:
  - target: Increased Vascular Permeability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Tight-junction fragmentation provides a plausible but still indirect and
      incompletely assayed route from KFDV-infected endothelium toward vascular
      leak in human KFD.
- name: Increased Vascular Permeability
  conforms_to: viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability
  description: >-
    Severe KFD manifests the vascular-leak and hemostatic limb of the viral
    hemorrhagic fever syndrome, expressed clinically as mucosal hemorrhage,
    hematemesis, epistaxis and persistent bleeding; the in-vitro KFDV evidence
    supports the preceding endothelial activation step but has not directly
    measured monolayer permeability.
  role: terminal_effector
  biological_scale: TISSUE
  locations:

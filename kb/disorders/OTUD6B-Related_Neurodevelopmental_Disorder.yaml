- name: Periorbital Edema
  description: >-
    Puffiness of the periorbital region was one of three facial features that led
    the reporting authors to describe the gestalt as Williams syndrome-like and to
    propose it as an expansion of the OTUD6B facial phenotype.
  notes: >-
    Attribution caveat. This observation comes from the single proband of
    PMID:34680978, who carries both a hemizygous OTUD6B c.873delA allele in trans
    with a paternally inherited 0.118 Mb 8q21.3 whole-gene deletion AND a
    heterozygous ZMIZ1 splice variant, c.1491 + 2T > C, shown by mRNA study to
    skip exon 14. ZMIZ1 causes its own autosomal dominant neurodevelopmental
    disorder with dysmorphic facies (MONDO:0032855), which is recorded in this
    entry's differential_diagnoses, so the facial gestalt in this proband cannot
    be attributed to OTUD6B alone. The authors themselves only "suggest" the
    expansion. Curated with supports PARTIAL for that reason. No frequency band
    is given: this is a single case with no denominator.

classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      The dominant clinical burden is neurodevelopmental: global developmental
      delay, intellectual disability, seizures, hypotonia, and structural brain
      abnormalities.
    evidence:
    - reference: PMID:28343629
      reference_title: "Biallelic Variants in OTUD6B Cause an Intellectual Disability Syndrome Associated with Seizures and Dysmorphic Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we report biallelic pathogenic variants in OTUD6B in 12 individuals from 6
        independent families with an intellectual disability syndrome associated
        with seizures and dysmorphic features
      explanation: >-
        The defining cohort establishes intellectual disability and seizures as the
        core presenting features, supporting a neurologic chapter assignment.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A monogenic, autosomal recessive Mendelian disorder diagnosed by exome or
      genome sequencing.
    evidence:
    - reference: PMID:35430327
      reference_title: "Novel biallelic variants affecting the OTU domain of the gene OTUD6B associate with severe intellectual disability syndrome and molecular dynamics simulations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Intellectual developmental disorder with dysmorphic facies, seizures, and
        distal limb anomalies (IDDFSDA) is an autosomal recessive multisystem
        disorder caused by compound heterozygous or homozygous variants in the gene
        OTUD6B
      explanation: >-
        States the Mendelian, autosomal recessive, single-gene basis of the disorder.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic (homozygous or compound heterozygous) OTUD6B
    variants. Reported families include consanguineous pedigrees with homozygous
    alleles and non-consanguineous pedigrees with compound heterozygous alleles.
    Heterozygous carrier parents are unaffected. Recurrence risk for siblings of an
    affected proband is 25 percent, and carrier testing plus genetic counseling are
    indicated for at-risk relatives.
  evidence:
  - reference: PMID:35430327
    reference_title: "Novel biallelic variants affecting the OTU domain of the gene OTUD6B associate with severe intellectual disability syndrome and molecular dynamics simulations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an autosomal recessive multisystem disorder caused by compound heterozygous
      or homozygous variants in the gene OTUD6B
    explanation: >-
      Directly states the autosomal recessive, biallelic requirement, including both
      the homozygous and compound heterozygous configurations.
  - reference: PMID:30364145
    reference_title: "First Replication of the Involvement of OTUD6B in Intellectual Disability Syndrome With Seizures and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The segregation in the family was confirmed by Sanger sequencing: the father
      (I1) was carrier of the c.324+1G>C mutation whereas the mother (I2) was
      heterozygous for c.405+1G>A.
    explanation: >-
      Documents biparental transmission of two different alleles to an affected
      compound heterozygous child, with unaffected heterozygous carrier parents.
prevalence:
- population: Worldwide reported literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 30 individuals had been reported worldwide as of the 2025 Chinese
    case report; that paper's own literature table enumerates 27 previously
    reported cases plus its index case. No population-based prevalence study
    exists. Orphanet assigns ORPHA:505237 a point-prevalence band of below 1 in
    1,000,000, which would correspond to the BELOW_1_IN_1000000 class and a rate
    of under 0.1 per 100,000; that band is recorded here as context only and is
    not adopted as the structured value, because no ORPHA cache record could be
    generated in this environment to carry a validated snippet (see the
    entry-level notes and #7622). The measure actually asserted is therefore the
    snippet-verifiable published case count.
  evidence:
  - reference: PMID:41188742
    reference_title: "Novel variant causing OTUD6B-related syndrome with ocular dysplasia and hypothyroidism: the first Chinese case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There have been < 30 reported cases globally without fundus and retinal
      lesions.
    explanation: >-
      Provides the published worldwide case count supporting an ultra-rare
      classification based on cases in the literature rather than a population rate.
pathophysiology:
- name: Biallelic OTUD6B Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    The disorder is initiated by inheritance of two damaging OTUD6B alleles. The
    reported allelic spectrum includes nonsense alleles, canonical splice-donor
    alleles that abolish normal splicing and trigger nonsense-mediated decay,
    frameshift alleles, and rare missense alleles within the catalytic OTU domain.
  genes:
  - preferred_term: OTUD6B
    term:
      id: hgnc:24281
      label: OTUD6B
  downstream:
  - target: Loss of OTUD6B Deubiquitinase Activity
    description: >-
      Damaging biallelic alleles remove or inactivate the OTU-domain
      deubiquitinating enzyme encoded by OTUD6B.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28343629
      reference_title: "Biallelic Variants in OTUD6B Cause an Intellectual Disability Syndrome Associated with Seizures and Dysmorphic Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our findings suggest a role for OTUD6B in proteasome function, establish
        that defective OTUD6B function underlies a multisystemic human disorder
      explanation: >-
        The authors frame the disease as arising from defective OTUD6B function,
        the direct consequence of the biallelic damaging alleles.
  - target: Allele-Dependent Residual OTUD6B Function
    description: >-
      Because different alleles leave different amounts of functional protein or
      differently destabilize the fold, the specific genotype sets the residual
      activity available to the developing organism.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35430327
      reference_title: "Novel biallelic variants affecting the OTU domain of the gene OTUD6B associate with severe intellectual disability syndrome and molecular dynamics simulations."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Our findings suggest that compound LOF and ultrarare missense variants may
        be contribute to the underlying variability expressivity associated with
        this disorder.
      explanation: >-
        Links the specific allele combination to the residual-function and
        expressivity axis. The awkward phrasing is quoted verbatim from the
        published abstract.
  molecular_functions:
  - preferred_term: cysteine-type deubiquitinase activity
    term:
      id: GO:0004843
      label: cysteine-type deubiquitinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:28343629
    reference_title: "Biallelic Variants in OTUD6B Cause an Intellectual Disability Syndrome Associated with Seizures and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report biallelic pathogenic variants in OTUD6B in 12 individuals from 6
      independent families with an intellectual disability syndrome associated
      with seizures and dysmorphic features
    explanation: >-
      Establishes biallelic OTUD6B variants as the initiating genetic lesion in the
      original multi-family discovery cohort.
  - reference: PMID:30364145
    reference_title: "First Replication of the Involvement of OTUD6B in Intellectual Disability Syndrome With Seizures and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Data analysis highlighted the presence of two heterozygous variants affecting
      exons 2 (c.324+1G>C) and 3 (c.405+1G>A) donor splice sites of the OTUD6B gene
    explanation: >-
      An independent replication family in which two canonical splice-donor alleles
      constitute the biallelic lesion.
- name: Loss of OTUD6B Deubiquitinase Activity
  biological_scale: MOLECULAR
  description: >-
    OTUD6B encodes a member of the ovarian tumor (OTU) domain subfamily of
    deubiquitinating enzymes, which remove ubiquitin from substrate proteins and
    thereby counterbalance E1/E2/E3 ubiquitin conjugation. Loss of this activity
    removes a node of control over ubiquitin-dependent protein turnover, trafficking,
    and signaling.
  molecular_functions:
  - preferred_term: cysteine-type deubiquitinase activity
    term:
      id: GO:0004843
      label: cysteine-type deubiquitinase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: protein deubiquitination
    term:
      id: GO:0016579
      label: protein deubiquitination
    modifier: DECREASED
  downstream:
  - target: Impaired 26S Proteasome Assembly
    description: >-
      Loss of OTUD6B activity is associated with defective incorporation of the 19S
      regulatory particle into the mature 26S proteasome in patient cells.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28343629
      reference_title: "Biallelic Variants in OTUD6B Cause an Intellectual Disability Syndrome Associated with Seizures and Dysmorphic Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Analysis of peripheral blood mononuclear cells from an affected subject
        showed reduced incorporation of 19S subunits into 26S proteasomes
      explanation: >-
        Cells lacking functional OTUD6B show the 19S incorporation defect,
        establishing the edge from lost deubiquitinase activity to impaired
        proteasome assembly. The intermediate steps are not resolved.
  - target: Dysregulated mTORC1-Linked Translation Initiation
    description: >-
      OTUD6B also acts on the translation initiation machinery downstream of mTORC1,
      so its loss removes a second, proteasome-independent output.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27864334
      reference_title: "Deubiquitinase OTUD6B Isoforms Are Important Regulators of Growth and Proliferation."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        OTUD6B associates with the protein synthesis initiation complex and
        modifies components of the 48S preinitiation complex.
      explanation: >-
        Establishes the physical and enzymatic link from OTUD6B to translation
        initiation. PARTIAL because the work is in a cancer cell line rather than
        a developmental model.
  evidence:
  - reference: PMID:28343629
    reference_title: "Biallelic Variants in OTUD6B Cause an Intellectual Disability Syndrome Associated with Seizures and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OTUD6B encodes a member of the ovarian tumor domain (OTU)-containing subfamily
      of deubiquitinating enzymes.
    explanation: >-
      Identifies the molecular function lost when OTUD6B is disrupted.
  - reference: PMID:33421002
    reference_title: "Studying OTUD6B-OTUB1 Protein-Protein Interaction by Low-Throughput GFP-Trap Assays and High-Throughput AlphaScreen Assays."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      we study the protein-protein interaction between the two deubiquitinating
      enzymes OTUB1 and OTUD6B and report for the first time that both proteins
      directly interact with each other
    explanation: >-
      Places OTUD6B within the deubiquitinase interaction network. This is
      supporting context for the enzyme's role in ubiquitin signaling, not direct
      evidence about the disease, hence PARTIAL.
- name: Allele-Dependent Residual OTUD6B Function
  biological_scale: MOLECULAR
  description: >-
    The severity of the clinical phenotype tracks the predicted functional severity
    of the specific OTUD6B alleles. Truncating and splice alleles that trigger
    nonsense-mediated decay give little or no product, whereas some missense alleles
    only locally destabilize the protein and others distort the overall fold. Molecular
    dynamics modeling of two OTU-domain missense alleles predicted localized
    destabilization for the allele found in a mildly affected individual and gross
    fold distortion for the allele found in a severely affected individual. In one
    replication family, residual wild-type splicing of under one percent, together
    with alleles that spare the short OTUD6B-2 isoform, was proposed to explain an
    unusually mild presentation.
  downstream:
  - target: Disrupted Embryonic Organogenesis and Growth
    description: >-
      The amount and quality of residual OTUD6B protein modulates how severely
      development is perturbed, producing the observed severity gradient from severe
      multisystem disease to mild intellectual disability.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35430327
      reference_title: "Novel biallelic variants affecting the OTU domain of the gene OTUD6B associate with severe intellectual disability syndrome and molecular dynamics simulations."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        our findings support that the clinical severity could be related with the
        predicted functional severity of the variations in OTUD6B
      explanation: >-
        Ties residual protein function directly to the severity of the resulting
        developmental phenotype.
  evidence:
  - reference: PMID:35430327
    reference_title: "Novel biallelic variants affecting the OTU domain of the gene OTUD6B associate with severe intellectual disability syndrome and molecular dynamics simulations."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      it is anticipated that Tyr216Cys in the earlier reported case with less severe
      IDDFSDA will lead to localized destabilization, whereas Ile274Arg in the
      presented index case with the severe IDDFSDA phenotype will lead to significant
      distortion in the overall fold of OTUD6B
    explanation: >-
      Structural modeling and molecular dynamics link predicted protein-level damage
      to observed clinical severity for two OTU-domain missense alleles.
  - reference: PMID:35430327
    reference_title: "Novel biallelic variants affecting the OTU domain of the gene OTUD6B associate with severe intellectual disability syndrome and molecular dynamics simulations."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      our findings support that the clinical severity could be related with the
      predicted functional severity of the variations in OTUD6B
    explanation: >-
      States the genotype-severity relationship explicitly as the study's conclusion.
  - reference: PMID:30364145
    reference_title: "First Replication of the Involvement of OTUD6B in Intellectual Disability Syndrome With Seizures and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we performed quantitative analysis by competitive-fluorescent RT-PCR showing
      that the proband presents less than 1% of the wild-type transcript
    explanation: >-
      Direct patient-RNA quantification of residual normal transcript, the measurable
      substrate of the residual-function idea.
- name: Impaired 26S Proteasome Assembly
  biological_scale: CELLULAR
  description: >-
    Peripheral blood mononuclear cells from an affected individual show reduced
    incorporation of 19S regulatory-particle subunits into 26S proteasomes. The
    mature 26S holoenzyme is formed by capping the 20S catalytic core with the 19S
    regulatory particle, so defective 19S incorporation reduces the pool of
    assembly-competent, ubiquitin-receptive proteasomes.
  cell_types:
  - preferred_term: peripheral blood mononuclear cell
    term:
      id: CL:2000001
      label: peripheral blood mononuclear cell
  cellular_components:
  - preferred_term: proteasome accessory complex (19S regulatory particle)
    term:
      id: GO:0022624
      label: proteasome accessory complex
  biological_processes:
  - preferred_term: proteasome assembly
    term:
      id: GO:0043248
      label: proteasome assembly
    modifier: DECREASED
  downstream:
  - target: Reduced Proteasomal Chymotrypsin-Like Activity
    description: >-
      Fewer correctly assembled 26S proteasomes yield lower measured peptidase
      activity in the same patient cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28343629
      reference_title: "Biallelic Variants in OTUD6B Cause an Intellectual Disability Syndrome Associated with Seizures and Dysmorphic Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        showed reduced incorporation of 19S subunits into 26S proteasomes,
        decreased chymotrypsin-like activity
      explanation: >-
        The same patient-cell experiment reports the assembly defect and the
        peptidase-activity deficit together, supporting the direct edge between
        them.
  evidence:
  - reference: PMID:28343629
    reference_title: "Biallelic Variants in OTUD6B Cause an Intellectual Disability Syndrome Associated with Seizures and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of peripheral blood mononuclear cells from an affected subject showed
      reduced incorporation of 19S subunits into 26S proteasomes
    explanation: >-
      Direct patient-cell measurement of the proteasome-assembly defect.
- name: Reduced Proteasomal Chymotrypsin-Like Activity
  biological_scale: MOLECULAR
  description: >-
    Chymotrypsin-like peptidase activity, the rate-limiting catalytic activity of the
    20S core, is decreased in patient peripheral blood mononuclear cells, indicating
    functionally reduced proteolytic throughput and not merely an assembly
    stoichiometry change.
  cellular_components:
  - preferred_term: proteasome complex
    term:
      id: GO:0000502
      label: proteasome complex
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  downstream:
  - target: Accumulation of Ubiquitin-Protein Conjugates
    description: >-
      Reduced proteolytic throughput leaves polyubiquitinated substrates undegraded.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28343629
      reference_title: "Biallelic Variants in OTUD6B Cause an Intellectual Disability Syndrome Associated with Seizures and Dysmorphic Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        decreased chymotrypsin-like activity, and accumulation of
        ubiquitin-protein conjugates
      explanation: >-
        The reduced peptidase activity and the conjugate build-up are reported in
        the same patient cells, supporting the direct degradation-failure edge.
  evidence:
  - reference: PMID:28343629
    reference_title: "Biallelic Variants in OTUD6B Cause an Intellectual Disability Syndrome Associated with Seizures and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      decreased chymotrypsin-like activity
    explanation: >-
      Reports the specific reduction of proteasome chymotrypsin-like peptidase
      activity in cells from an affected individual.
- name: Accumulation of Ubiquitin-Protein Conjugates
  biological_scale: CELLULAR
  description: >-
    Polyubiquitinated proteins accumulate in patient cells, the expected consequence
    of a reduced-capacity ubiquitin-proteasome system. This is the proteostatic
    lesion that the developing organism must tolerate.
  biological_processes:
  - preferred_term: ubiquitin-dependent protein catabolic process
    term:
      id: GO:0006511
      label: ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  downstream:
  - target: Impaired Cell Growth and Proliferation
    description: >-
      Failure to clear ubiquitinated regulatory proteins on schedule impairs the
      proliferative programs of developing tissues.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27864334
      reference_title: "Deubiquitinase OTUD6B Isoforms Are Important Regulators of Growth and Proliferation."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Deubiquitinases (DUB) are increasingly linked to the regulation of
        fundamental processes in normal and cancer cells, including DNA
        replication and repair, programmed cell death, and oncogenes and tumor
        suppressor signaling.

- name: Dysregulated mTORC1-Linked Translation Initiation
  biological_scale: CELLULAR
  description: >-
    Independently of the proteasome arm, OTUD6B regulates protein synthesis
    downstream of mTORC1. It associates with the protein synthesis initiation complex
    and modifies components of the 48S preinitiation complex, and its two main
    splicing isoforms act in opposing directions, with the long OTUD6B-1 isoform
    inhibitory and the short OTUD6B-2 isoform stimulatory. This work was performed in
    non-small cell lung cancer cell lines rather than in neural tissue, so its
    relevance to the human developmental phenotype is inferential.

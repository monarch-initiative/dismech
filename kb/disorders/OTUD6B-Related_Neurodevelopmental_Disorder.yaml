- name: OTUD6B biallelic pathogenic variants
  gene_term:
    preferred_term: OTUD6B
    term:
      id: hgnc:24281
      label: OTUD6B
  association: Biallelic pathogenic variants are causative for IDDFSDA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:35430327
      reference_title: "Novel biallelic variants affecting the OTU domain of the gene OTUD6B associate with severe intellectual disability syndrome and molecular dynamics simulations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        an autosomal recessive multisystem disorder caused by compound heterozygous
        or homozygous variants in the gene OTUD6B
      explanation: >-
        States the recessive, biallelic disease model for OTUD6B.
  notes: >-
    Reported disease alleles span several classes. Nonsense: c.271C>T p.(Gln91Ter)
    (Egyptian family) and c.433C>T p.(Arg145*) (Mexican case). Canonical splice
    donor: c.324+1G>C and c.405+1G>A (Italian replication case), functionally shown
    to cause exon 2 and exon 3 skipping with nonsense-mediated decay. Missense in the
    OTU domain: c.767G>T p.(Gly256Val), c.815T>G p.(Ile272Arg), plus Tyr216Cys and
    Ile274Arg analyzed by molecular dynamics. Compound heterozygous
    frameshift-plus-missense genotypes have also been reported, and in one proband
    the second hit was a 0.118 Mb paternally inherited 8q21.3 deletion spanning
    OTUD6B in trans with a maternal frameshift, so chromosomal microarray as well as
    sequencing can be needed to establish biallelic status. Reported missense alleles
    cluster in or immediately adjacent to the OTU catalytic domain. Transcript
    numbering follows NM_016023.5 and the 293-residue UniProt Q8N6M0 protein; note
    that the original 2017 paper's full text uses a longer isoform numbering, so
    residue positions quoted across papers are not directly comparable without
    checking the isoform. ClinGen classifies the OTUD6B-syndromic intellectual
    disability relationship as Definitive (AR, SOP10, Intellectual Disability and
    Autism Gene Curation Expert Panel, 2024-08-22); that structured assertion could
    not be cached as a CGGV reference here (see the entry-level notes), so it is
    recorded descriptively rather than as a validated snippet.
  evidence:
  - reference: PMID:28343629
    reference_title: "Biallelic Variants in OTUD6B Cause an Intellectual Disability Syndrome Associated with Seizures and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report biallelic pathogenic variants in OTUD6B in 12 individuals from 6
      independent families with an intellectual disability syndrome associated with
      seizures and dysmorphic features
    explanation: >-
      The gene-disease-establishing multi-family cohort.

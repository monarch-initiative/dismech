name: OTUD6B-Related Neurodevelopmental Disorder
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
description: >-
  OTUD6B-related neurodevelopmental disorder (intellectual developmental disorder
  with dysmorphic facies, seizures, and distal limb anomalies; IDDFSDA, MIM 617452)
  is an ultra-rare autosomal recessive multisystem disorder caused by biallelic
  variants in OTUD6B, which encodes an ovarian-tumor (OTU) domain deubiquitinating
  enzyme. The core clinical picture is global developmental delay and intellectual
  disability with seizures, a recognizable dysmorphic facial gestalt, poor pre- and
  postnatal growth, and characteristic distal limb findings (broad distal phalanges
  of thumbs and halluces, prominent interphalangeal joints, persistent fetal
  fingertip pads). Individuals with predicted loss-of-function alleles are more
  severely affected, with microcephaly, absent speech, hypotonia, feeding
  difficulties, structural brain abnormalities, and congenital heart disease;
  individuals carrying alleles with residual function can have mild to moderate
  intellectual disability with preserved speech and ambulation. Mechanistically,
  patient cells show reduced incorporation of 19S regulatory subunits into 26S
  proteasomes, decreased chymotrypsin-like proteasome activity, and accumulation
  of ubiquitin-protein conjugates, placing the disorder among the ubiquitin-proteasome
  system disorders of development.
notes: >-
  Named-entity-confusion guardrail. This entry is anchored strictly on
  MONDO:0044319 / OMIM:617452 / OTUD6B (HGNC:24281), confirmed by the MONDO
  `RO:0004003` gene-association relation. It is deliberately NOT merged with
  three closely named or closely related entities. (1) MONDO:0060596
  "neurodevelopmental disorder with dysmorphic facies and distal limb
  anomalies" is the BPTF-related disorder (NEDDFL) and is a different gene and
  a different MONDO entity; PMID:33522091 describes that BPTF entity and is
  therefore excluded from every OTUD6B claim in this entry, appearing only as
  evidence on the BPTF differential_diagnoses record. (2) MONDO:0032855
  "neurodevelopmental disorder with dysmorphic facies and distal skeletal
  anomalies" is likewise a separate entity. (3) Other OTU-family
  deubiquitinase disorders are distinct: OTUD5 causes an X-linked
  multiple-congenital-anomaly/neurodevelopmental syndrome, OTUD7A lies in the
  15q13.3 microdeletion interval, and OTUD1/OTUB1 appear in overlapping
  ubiquitin-signalling literature without being the cause of this disorder.
  Every citation used here was checked to name OTUD6B specifically. Most
  OTUD6B PubMed hits are cancer-biology or lncRNA (OTUD6B-AS1) papers that are
  unrelated to the Mendelian disorder and were excluded.

  Frequency discipline. Frequency bands here come from exactly two denominator
  sources, both recorded per phenotype in that phenotype's `notes:`. (1) The
  HPO disease-annotation file (phenotype.hpoa, checked directly against the
  current release) carries per-phenotype `n/m` counts for OMIM:617452 curated
  from the founding cohort PMID:28343629, e.g. Seizure 12/12, Microcephaly
  9/12, Generalized hypotonia 9/12, Feeding difficulties 9/12, Intrauterine
  growth retardation 7/12, Long palpebral fissure 6/12, Broad thumb 6/12,
  Atrial septal defect 3/6. (2) PMID:41188742 supplies an explicit denominator
  for the ocular phenotype. Where neither source applies the band is omitted
  rather than guessed. Important caveat on the HPOA counts: they derive from a
  single, ascertainment-biased 2017 cohort weighted toward severe
  loss-of-function genotypes, so they likely overstate severity across the full
  allelic spectrum. HPOA records Severe intellectual disability as 12/12, which
  is directly contradicted by the later mild cases (PMID:30364145,
  PMID:34354232); this entry therefore models the broader HP:0001249
  Intellectual disability rather than adopting the severe-ID annotation, and
  bands should be read as cohort-specific rather than population estimates.

  HPOA-annotated features not separately modeled here. phenotype.hpoa lists
  additional terms for OMIM:617452 that are not given their own phenotype
  entries: macrotia 7/12, short stature 7/12, decreased body weight 6/12, thin
  upper lip vermilion 6/12, prominent nasal bridge 5/12, scoliosis 5/12,
  retrognathia 4/12, overlapping toe 3/12, autistic behavior 3/12, hypoplasia
  of the corpus callosum 3/12, short neck 3/12, highly arched eyebrow 3/12,
  down-sloping shoulders 3/12, spastic tetraplegia 2/12, chronic constipation
  2/12, sacral dimple 2/12, brachycephaly 1/12, plus unquantified terms
  including inability to walk, ventriculomegaly, failure to thrive, hearing
  impairment, cryptorchidism, and talipes equinovarus. The reason for the
  omission is that these counts derive from the PMID:28343629 full-text table
  rather than from its abstract, and this entry takes its snippets from
  abstracts. That reason must not be overstated: references_cache/PMID_41188742.md
  is cached as full text and does contain a 28-case aggregate table carrying
  several of these rows (short stature 16/28, poor weight gain 14/28, scoliosis
  8/22, cryptorchidism 7/24, abnormal cranial MRI 13/24). Those rows are
  PDF-mangled and bundle several features per line, so they were judged too
  unreliable to quote, but they do exist, and quoting the primary full text is
  the right way to close this gap in a follow-up pass. Long philtrum was
  previously listed here as unsupported by any cached abstract; that was wrong,
  and it is now modeled as its own phenotype from the PMID:34680978 abstract.

  Blended phenotypes and attribution discipline. Three reported probands carry
  a second, independent pathogenic locus that contributes to the observed
  picture: RP1L1 causing the retinal degeneration in PMID:34354232, a
  heterozygous PKD1 variant contributing renal cystic disease in PMID:35707595,
  and a ZMIZ1 splice variant in PMID:34680978. These are co-occurring
  conditions, not OTUD6B modifiers. The RP1L1 retinal degeneration and the PKD1
  renal cystic disease are therefore not attributed to OTUD6B at all. The
  PMID:34680978 proband is handled differently, because that paper's authors
  explicitly propose their facial findings as an OTUD6B phenotype expansion: the
  Williams syndrome-like features (periorbital edema, hanging cheek, long and
  smooth philtrum) and the polydactyly are curated, but every one of them
  carries supports PARTIAL and a note naming the heterozygous ZMIZ1
  c.1491 + 2T > C exon-14-skipping variant as an unresolved confounder, with a
  cross-reference to the ZMIZ1 entry in differential_diagnoses.

  Structured-source citations unavailable. ClinGen has a Definitive
  gene-disease validity assertion for OTUD6B and syndromic intellectual
  disability (assertion 3c60103c-7d9b-4dca-aa03-151130c5d6db, SOP10, AR,
  Intellectual Disability and Autism Gene Curation Expert Panel, 2024-08-22),
  and Orphanet codes this disorder as ORPHA:505237. Neither a `CGGV:` nor an
  `ORPHA:` record could be generated into references_cache in this working
  environment, and the relevant data MANIFEST pins are stale and
  un-refreshable pending #7622, so no structured-source snippet is cited. The
  gene-disease relationship is instead supported here by primary literature.

  Not cited for snippets. PMID:31147255 (first Spanish case) and PMID:32181568
  (Alkuraya, phenotypic-expansion comment) are genuine OTUD6B disorder reports
  but have no abstract text in PubMed, so no verbatim snippet could be taken
  from them; they are recorded in the top-level references block only.

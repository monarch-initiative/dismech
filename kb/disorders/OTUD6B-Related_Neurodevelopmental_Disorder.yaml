diagnosis:
- name: Trio Exome Sequencing
  description: >-
    There are no formal clinical diagnostic criteria; the diagnosis is molecular.
    Trio-based exome sequencing is the appropriate first-line test for a child
    with global developmental delay, seizures, the distal limb findings, and a
    dysmorphic facial gestalt, and it is how the reported cases were ascertained.
    The trio design matters specifically because the disorder is autosomal
    recessive: phasing the two candidate alleles across the parents is what
    establishes that they are in trans, and it is also what identifies each
    parent as a carrier for counseling.
  diagnosis_term:
    preferred_term: trio exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: >-
    Biallelic OTUD6B variants in trans; reported alleles include splice-donor,
    frameshift, nonsense, and OTU-domain missense changes
  markers: OTUD6B (hgnc:24281)
  evidence:
  - reference: PMID:41188742
    reference_title: "Novel variant causing OTUD6B-related syndrome with ocular dysplasia and hypothyroidism: the first Chinese case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic gene variants were identified using whole exome trio sequencing
      (trioWES) and confirmed using Sanger sequencing.
    explanation: >-
      States the trio exome plus Sanger confirmation pathway that produced the
      molecular diagnosis in a genetically confirmed case.
  - reference: PMID:30364145
    reference_title: "First Replication of the Involvement of OTUD6B in Intellectual Disability Syndrome With Seizures and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing confirmed the segregation of the variants in the family,
      showing that both parents are carriers of one mutation.
    explanation: >-
      Documents the parental segregation step that establishes the two alleles
      are in trans, which is the reason the trio design is specified here.
- name: Chromosomal Microarray
  description: >-
    Chromosomal microarray is required alongside sequencing rather than being
    superseded by it. One reported proband is a compound heterozygote for an
    OTUD6B point mutation and a paternally inherited 0.118 Mb whole-gene deletion
    of 8q21.3; exome sequencing alone reports that individual as a single
    heterozygote and the diagnosis is missed. A single apparently heterozygous
    OTUD6B variant in a clinically compatible child should therefore prompt
    copy-number analysis of the locus.
  diagnosis_term:
    preferred_term: chromosomal microarray testing
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  results: >-
    May reveal a whole-gene or partial-gene 8q21.3 deletion supplying the second
    hit in trans with a sequence variant
  markers: 8q21.3
  evidence:
  - reference: PMID:34680978
    reference_title: "Compound Heterozygote of Point Mutation and Chromosomal Microdeletion Involving OTUD6B Coinciding with ZMIZ1 Variant in Syndromic Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cytogenomic microarray (CMA), whole exome sequencing (WES), and mRNA
      analysis were performed.
    explanation: >-
      Records the combined assay panel used to reach this diagnosis, with CMA run
      in parallel with sequencing rather than as a superseded first-tier test.
  - reference: PMID:34680978
    reference_title: "Compound Heterozygote of Point Mutation and Chromosomal Microdeletion Involving OTUD6B Coinciding with ZMIZ1 Variant in Syndromic Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The CMA showed a paternally inherited 0.118 Mb deletion of 8q21.3,
      chr8:92084087-92202189, with OTUD6B involved.
    explanation: >-
      The specific copy-number second hit that only microarray detected, which is
      what makes CMA non-optional in this disorder's workup.
- name: Reflex OTUD6B Testing in Suspected Rubinstein-Taybi or Kabuki Syndrome
  description: >-
    The facial gestalt overlaps two better-known syndromes, so affected children
    are commonly worked up for those first. The authors of the first replication
    report explicitly recommend screening OTUD6B in a child suspected of having
    Rubinstein-Taybi syndrome once CREBBP and EP300 are negative. An initial
    clinical suspicion of Kabuki syndrome has likewise been recorded in several
    affected individuals. This is actionable reflex testing rather than an
    academic differential.
  diagnosis_term:
    preferred_term: reflex OTUD6B genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Biallelic OTUD6B variants in a child previously worked up, negatively, for
    Rubinstein-Taybi or Kabuki syndrome
  evidence:
  - reference: PMID:30364145
    reference_title: "First Replication of the Involvement of OTUD6B in Intellectual Disability Syndrome With Seizures and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      appropriateness of screening OTUD6B in suspected Rubinstein-Taybi syndrome
      patients with negative results after the screening of the major genes
    explanation: >-
      The authors' own explicit reflex-testing recommendation, which is a
      diagnostic-pathway claim rather than a phenotype claim.
  - reference: PMID:38389298
    reference_title: "Biallelic OTUD6B variants associated with a Kabuki syndrome-like disorder in three siblings: A clinical report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      previous publications have reported an initial clinical suspicion for
      Kabuki syndrome (KS) in some affected individuals
    explanation: >-
      Documents that the Kabuki misdirection has actually occurred in practice,
      supporting the second half of the reflex-testing recommendation.
treatments:
- name: Antiseizure Pharmacotherapy
  description: >-
    Seizures are managed with standard antiseizure medication. Valproate was used to
    treat generalized tonic-clonic seizures in a reported individual with biallelic
    OTUD6B splice variants. There is no disorder-specific antiseizure protocol and no
    evidence that any particular agent is preferred in OTUD6B-related disease; drug
    choice follows general pediatric epilepsy practice and seizure semiology.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
  evidence:
  - reference: PMID:30364145
    reference_title: "First Replication of the Involvement of OTUD6B in Intellectual Disability Syndrome With Seizures and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 5 years, tonic-clonic seizures occurred, thus valproate treatment was
      started.
    explanation: >-
      Documents actual antiseizure pharmacotherapy in a genetically confirmed
      individual.
- name: Levothyroxine Replacement for Hypothyroidism
  description: >-
    Hypothyroidism recurs in unrelated affected individuals and is the one
    genuinely treatable manifestation of this disorder, which is why endocrine
    surveillance is recommended in the first place. Standard thyroid hormone
    replacement is used; nothing about the OTUD6B genotype changes the drug or
    the monitoring. In the reported Chinese case, levothyroxine was started in
    the week the newborn metabolic screen returned, and by 3 years 6 months the
    dose had been titrated down with thyroid function in the normal range on
    every check, so this is a treatment with a documented biochemical response
    in a genetically confirmed individual.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levothyroxine
      term:
        id: CHEBI:18332
        label: L-thyroxine
  evidence:
  - reference: PMID:41188742
    reference_title: "Novel variant causing OTUD6B-related syndrome with ocular dysplasia and hypothyroidism: the first Chinese case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She started levothyroxine sodium tablets that same week.
    explanation: >-
      Documents actual levothyroxine therapy in a genetically confirmed
      individual with OTUD6B-related hypothyroidism.
  - reference: PMID:41188742
    reference_title: "Novel variant causing OTUD6B-related syndrome with ocular dysplasia and hypothyroidism: the first Chinese case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At her last visit, age 3 years 6 months, the dose was down
      to 12.5  µg daily, with every thyroid check since 3monts
      age within the normal range.
    explanation: >-
      Records the biochemical response and dose titration on follow-up. Quoted
      verbatim from the cached full text including its typographic artifacts
      ("3monts"), per the never-retype rule.
- name: Endocrine and Immunologic Surveillance
  description: >-
    Because hypothyroidism and hypogammaglobulinemia have recurred in unrelated
    affected individuals and both are treatable, thyroid function testing and
    immunoglobulin quantification are recommended at diagnosis and on follow-up.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:32924626
    reference_title: "Comparison of Genetic Variants and Manifestations of OTUD6B-Related Disorder: The First Mexican Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the third patient with associated hypothyroidism and hypogammaglobulinemia,
      underscoring the value of screening for these conditions in other patients
    explanation: >-
      The authors explicitly recommend screening for these two treatable
      comorbidities in other affected individuals.
- name: Multidisciplinary Supportive Care
  description: >-
    Management is supportive and symptom-directed: seizure control, nutritional and
    feeding support for poor growth and feeding difficulty, developmental and
    rehabilitative therapies, cardiac evaluation for congenital heart disease, and
    dental care for the orodental phenotype. There is no disease-modifying therapy.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:32924626
    reference_title: "Comparison of Genetic Variants and Manifestations of OTUD6B-Related Disorder: The First Mexican Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The current challenge with this patient is to ensure medical management of his
      seizures and provide him with a better quality of life.
    explanation: >-
      Characterizes present-day management as symptomatic and quality-of-life
      focused rather than disease-modifying.
  - reference: PMID:32924626
    reference_title: "Comparison of Genetic Variants and Manifestations of OTUD6B-Related Disorder: The First Mexican Case."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The possibilities of additional therapeutic approaches may increase by
      understanding the physiopathology of the involved pathways.
    explanation: >-
      States that mechanism-targeted therapy does not yet exist and remains
      aspirational.
- name: Genetic Counseling and Carrier Testing
  description: >-
    Autosomal recessive inheritance gives a 25 percent sibling recurrence risk.
    Counseling should cover the recessive model, carrier testing of parents and
    at-risk relatives, and the option of prenatal or preimplantation testing once the
    familial variants are known. Consanguinity is common in reported families, and
    the RP1L1 experience in PMID:34354232 shows that a second independent recessive
    disorder can co-segregate and confound the phenotype, so exome or genome data
    should be reanalyzed in depth in consanguineous pedigrees.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34354232
    reference_title: "OTUD6B-associated intellectual disability: novel variants and genetic exclusion of retinal degeneration as part of a refined phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      demonstrating the need for in-depth analysis of WES data in consanguineous
      families to uncover simultaneous autosomal recessive disorders
    explanation: >-
      Directly supports the counseling and reanalysis recommendation for
      consanguineous families.
differential_diagnoses:
- name: BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
  disease_term:
    preferred_term: BPTF-related neurodevelopmental disorder (NEDDFL)
    term:
      id: MONDO:0060596
      label: neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
  description: >-
    A distinct autosomal dominant entity (MONDO:0060596, OMIM:617755) caused by
    heterozygous variants in BPTF (hgnc:3581). Its MONDO label differs from this
    disorder's by two words, which makes it the single most likely entity to be
    conflated with OTUD6B disease in a text or label-based search.
  distinguishing_features:
  - >-
    Molecular: BPTF (hgnc:3581) heterozygous, autosomal dominant and typically de
    novo, versus OTUD6B (hgnc:24281) biallelic and autosomal recessive. The
    inheritance mode alone separates them in almost every family.
  - >-
    Nomenclature: the near-identical MONDO labels are the hazard, not the
    phenotypes. Confirm the causative gene before importing any cohort data
    published under the "dysmorphic facies and distal limb anomalies" phrasing.
  notes: >-
    PMID:33522091 is cited here, and only here. It is a 25-individual NEDDFL
    cohort and it is exactly the kind of paper a label-based search would sweep
    into this entry by mistake; recording it against the differential is the
    honest place for it, and none of its phenotype data is used anywhere in the
    OTUD6B sections.
  evidence:
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurodevelopmental disorder with dysmorphic facies and distal limb
      anomalies (NEDDFL), defined primarily by developmental delay/intellectual
      disability, speech delay, postnatal microcephaly, and dysmorphic features,
      is a syndrome resulting from heterozygous variants in the dosage-sensitive
      bromodomain PHD finger chromatin remodeler transcription factor BPTF gene.
    explanation: >-
      Establishes in the source's own words that the near-identically labelled
      NEDDFL entity is caused by heterozygous BPTF variants, which is the
      molecular discriminator this differential turns on.
- name: ZMIZ1-related neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies
  disease_term:
    preferred_term: ZMIZ1-related neurodevelopmental disorder (NEDDFSA)
    term:
      id: MONDO:0032855
      label: neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies
  description: >-
    A distinct autosomal dominant entity (MONDO:0032855, OMIM:618659) caused by
    heterozygous variants in ZMIZ1 (hgnc:16493). Its label differs from this
    disorder's only in "skeletal" versus "limb". This is not only a label
    hazard: PMID:34680978 reports a proband who genuinely carries variants in
    both genes, so the two entities can co-occur in one patient.
  distinguishing_features:
  - >-
    Molecular: ZMIZ1 (hgnc:16493) heterozygous and autosomal dominant, versus
    biallelic recessive OTUD6B. ZMIZ1 is a transcriptional coregulator, not a
    deubiquitinase, so there is no shared mechanism to justify pooling evidence.
  - >-
    Co-occurrence, not just confusion: in PMID:34680978 the same 5-year-old girl
    carries a hemizygous OTUD6B c.873delA over a paternal 8q21.3 whole-gene
    deletion AND a heterozygous ZMIZ1 c.1491 + 2T > C splice variant confirmed by
    mRNA study to skip exon 14. Her Williams syndrome-like facial features
    (periorbital edema, hanging cheek, long and smooth philtrum) and her
    polydactyly are curated in this entry with supports PARTIAL for exactly this
    reason. Finding a ZMIZ1 variant therefore does not exclude OTUD6B disease,
    and vice versa.
  notes: >-
    Cross-reference: the phenotypes Periorbital Edema, Hanging Cheek, Long
    Philtrum, Smooth Philtrum, and Polydactyly in this entry all derive from the
    dual-locus PMID:34680978 proband and all name this differential in their
    attribution notes.
  evidence:
  - reference: PMID:34680978
    reference_title: "Compound Heterozygote of Point Mutation and Chromosomal Microdeletion Involving OTUD6B Coinciding with ZMIZ1 Variant in Syndromic Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The OTUD6B and ZMIZ1 genes were recently identified as causes of syndromic
      intellectual disability (ID) with shared phenotypes of facial dysmorphism,
      distal limb anomalies, and seizure disorders.
    explanation: >-
      States the phenotypic overlap that makes ZMIZ1 a differential for this
      disorder, in the authors' own words.
  - reference: PMID:34680978
    reference_title: "Compound Heterozygote of Point Mutation and Chromosomal Microdeletion Involving OTUD6B Coinciding with ZMIZ1 Variant in Syndromic Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OTUD6B- and ZMIZ1-related ID are inherited in autosomal recessive and
      autosomal dominant patterns, respectively.
    explanation: >-
      Sources the inheritance-mode discriminator that separates the two entities
      in nearly every family.
  - reference: PMID:34680978
    reference_title: "Compound Heterozygote of Point Mutation and Chromosomal Microdeletion Involving OTUD6B Coinciding with ZMIZ1 Variant in Syndromic Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This ZMIZ1 variant yielded exon 14 skipping, as evidenced by mRNA study.
    explanation: >-
      Functional confirmation that the second-locus ZMIZ1 allele in this proband
      is real and consequential, which is what makes it a genuine confounder for
      the facial phenotypes rather than an incidental finding.
- name: OTUD5-related multiple congenital anomalies syndrome
  disease_term:
    preferred_term: OTUD5-related multiple congenital anomalies-neurodevelopmental syndrome (MCAND)
    term:
      id: MONDO:0025351
      label: multiple congenital anomalies-neurodevelopmental syndrome, X-linked
  description: >-
    An X-linked disorder (MONDO:0025351, OMIM:301056) caused by hemizygous
    variants in OTUD5 (hgnc:25402), confirmed against the MONDO
    `RO:0004003` gene-association relation. OTUD5 is a member
    of the same OTU deubiquitinase family as OTUD6B, so the two share
    ubiquitin-signalling mechanism language and are frequently co-discussed in
    reviews of OTU-family disease.
  distinguishing_features:
  - >-
    Molecular: X-linked hemizygous OTUD5 in males, versus autosomal recessive
    biallelic OTUD6B in either sex.
  - >-
    Literature hazard: papers about "OTU deubiquitinase deficiency" may describe
    either gene. Check which gene the reported cohort actually carries variants
    in before citing it here.
- name: OTUD7A-related phenotypes and the 15q13.3 microdeletion syndrome
  disease_term:
    preferred_term: 15q13.3 microdeletion syndrome (the OTUD7A-containing interval)
    term:
      id: MONDO:0012774
      label: chromosome 15q13.3 microdeletion syndrome
  notes: >-
    The bound term is the contiguous-gene deletion syndrome (MONDO:0012774,
    OMIM:612001), not an OTUD7A gene-disease entity. MONDO carries no
    `RO:0004003` OTUD7A association on this term, and there is no separate clean
    MONDO entity for OTUD7A-related disease, so the deletion syndrome is the
    correct and only bindable target. The OTUD7A framing is retained in the
    description because the literature hazard is the gene-family adjacency, not
    the deletion syndrome's clinical picture.
  description: >-
    OTUD7A lies within the 15q13.3 microdeletion critical region and is another
    OTU-family gene implicated in neurodevelopmental disease, so it appears
    alongside OTUD6B in family-level reviews.
  distinguishing_features:
  - >-
    Molecular: a recurrent copy-number loss at 15q13.3 detected by
    chromosomal microarray, versus biallelic OTUD6B sequence variants detected
    by exome or gene-panel sequencing. Different assay, different mechanism.

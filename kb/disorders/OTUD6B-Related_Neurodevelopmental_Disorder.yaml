- name: Impaired Cell Growth and Proliferation
  biological_scale: CELLULAR
  description: >-
    Both the proteostatic arm and the translational arm converge on reduced growth
    and proliferative capacity. In cell models the two OTUD6B isoforms have opposing
    effects on DNA synthesis, so loss of the balanced isoform pair perturbs
    proliferation control rather than simply slowing it.
  notes: >-

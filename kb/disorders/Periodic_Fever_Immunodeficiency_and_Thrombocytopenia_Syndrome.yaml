name: Periodic Fever, Immunodeficiency, and Thrombocytopenia Syndrome
creation_date: "2026-09-06T19:15:00Z"
category: Mendelian
description: >-
  Periodic fever, immunodeficiency, and thrombocytopenia syndrome (PFIT) is an
  ultra-rare autosomal recessive disorder caused by biallelic loss-of-function
  variants in WDR1, which encodes actin-interacting protein 1 (Aip1), the
  cofactor that accelerates cofilin-mediated severing and depolymerisation of
  actin filaments. PFIT is an "actinopathy": one defect in actin filament
  turnover produces three clinically unrelated-looking problems at once. In
  monocytes it permits inflammasome hyperactivation and excess interleukin-18
  release, giving periodic fever with an extreme acute-phase response; in
  neutrophils it abolishes the polarisation and chemotaxis needed to reach a
  site of infection, giving recurrent infection, severe stomatitis and poor
  wound healing despite normal microbial killing; and in megakaryocytes it
  blocks the maturation step needed for platelet shedding, giving
  thrombocytopenia. The autoinflammatory arm is driven by IL-18 rather than
  IL-1-beta, which is why IL-1 blockade is at best partially effective and
  allogeneic haematopoietic stem cell transplantation, which replaces the whole
  mutant haematopoietic compartment, is the treatment that has worked.

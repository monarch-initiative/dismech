- name: Excess Interleukin-18 Production
  biological_scale: ORGANISM
  description: >-
    The autoinflammatory arm of PFIT runs through IL-18, not IL-1-beta. Serum
    IL-18 is high without a matching rise in IL-18-binding protein, so free
    bioactive IL-18 is increased, and patient cells secrete more IL-18 but not
    more IL-1-beta in culture. This is the mechanistic reason IL-1 blockade is
    only partially effective.
  biological_processes:
  - preferred_term: positive regulation of interleukin-18 production
    term:
      id: GO:0032741
      label: positive regulation of interleukin-18 production
    modifier: INCREASED
  evidence:
  - reference: PMID:27994071
    reference_title: "Autoinflammatory periodic fever, immunodeficiency, and thrombocytopenia (PFIT) caused by mutation in actin-regulatory gene WDR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had high serum levels of IL-18, without a corresponding increase in IL-18-binding protein or IL-1β, and their cells also secreted more IL-18 but not IL-1β in culture."
    explanation: >-
      Establishes both halves of the claim: IL-18 is elevated and unbuffered by
      its binding protein, and IL-1-beta is not elevated.
  downstream:
  - target: Recurrent fever
    description: >-
      Systemic IL-18-driven autoinflammation manifests as periodic febrile
      episodes with an extreme acute-phase response.
  - target: Increased circulating interleukin 18 concentration
    description: >-
      The directly measured serum correlate of this node.
- name: Defective Neutrophil Motility and Polarization
  biological_scale: CELLULAR
  description: >-
    Patient neutrophils cannot polarise, spread or move directionally, yet kill
    staphylococci normally once contact is made and mount an increased
    oxidative burst. The defect is therefore in getting to the infection, not
    in dealing with it, which is the distinctive shape of this immunodeficiency.
    Neutrophil nuclear lobes herniate and cytosolic regions are agranular.

    This node is contested across cohorts, and the REFUTE items below record
    it. The motility defect is the Kuhns cohort's central finding, but the
    founding PFIT family was measured in a Dunn chamber and showed no
    difference in velocity or chemotactic index, with the authors concluding
    that neutrophil dysfunction alone cannot account for the phenotype. The
    node is kept because the defect is real where it was found, not because
    the disagreement is settled.
  cell_types:
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: DECREASED
  evidence:
  - reference: PMID:27994071
    reference_title: "Autoinflammatory periodic fever, immunodeficiency, and thrombocytopenia (PFIT) caused by mutation in actin-regulatory gene WDR1."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We further assessed neutrophil migratory function from patient IV-4 using a modified Dunn chamber, and found no significant difference in velocity or chemotactic index (Fig. 5, A–C)."
    explanation: >-
      The founding PFIT family, measured directly, showed no migration
      defect. This contradicts the node for that cohort and is why the
      description calls the finding contested rather than settled.
  - reference: PMID:27994071
    reference_title: "Autoinflammatory periodic fever, immunodeficiency, and thrombocytopenia (PFIT) caused by mutation in actin-regulatory gene WDR1."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The neutrophil defects in these patients appeared relatively mild, as respiratory burst and phagocytosis were normal (Table S1)."
    explanation: >-
      The same paper grades the neutrophil abnormalities as mild,
      against the node's claim of a defining motility failure.
  - reference: PMID:27557945
    reference_title: "Cytoskeletal abnormalities and neutrophil dysfunction in WDR1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chemotaxis and chemokinesis were markedly impaired, but staphylococcal killing was normal, and neutrophil oxidative burst was increased both basally and on stimulation."
    explanation: >-
      Establishes the selective motility defect with preserved killing, the
      claim this node makes.
  - reference: PMID:27557945
    reference_title: "Cytoskeletal abnormalities and neutrophil dysfunction in WDR1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neutrophil spreading on glass and cell polarization were also impaired."
    explanation: >-
      Adds the polarisation and spreading defects named in this node.
  downstream:
  - target: Impaired Innate Host Defense at Barrier Surfaces
    description: >-
      Neutrophils that cannot reach a site of infection cannot clear it.
  - target: Impaired neutrophil chemotaxis
  - target: Abnormal neutrophil morphology
- name: Impaired Innate Host Defense at Barrier Surfaces
  biological_scale: ORGANISM
  description: >-
    Failure of neutrophil recruitment produces recurrent infection and,
    strikingly, severe oral inflammation that can scar to oral stenosis, plus
    impaired wound healing.
  evidence:
  - reference: PMID:27557945
    reference_title: "Cytoskeletal abnormalities and neutrophil dysfunction in WDR1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 3 families, we identified 4 children with recurrent infections and varying clinical manifestations including mild neutropenia, impaired wound healing, severe stomatitis with oral stenosis, and death."
    explanation: >-
      Lists the clinical consequences this node groups, in the cohort in which
      they were described.
  downstream:
  - target: Recurrent bacterial infections
  - target: Stomatitis
  - target: Poor wound healing
- name: Defective Immunological Synapse Formation in Lymphocytes
  biological_scale: CELLULAR
  description: >-
    The arm of the disease that the founding reports missed. Patient T cells
    accumulate atypical actin structures at the immunological synapse, with
    reduced calcium flux and mildly impaired proliferation on T-cell receptor
    stimulation. The B-cell compartment is affected more severely still:
    peripheral B lymphopenia, few marrow B-cell progenitors, no switched memory
    B cells, reduced clonal diversity, abnormal spreading, and increased
    apoptosis on receptor stimulation. So the immunodeficiency in PFIT is not
    only a neutrophil delivery problem; it has an adaptive component with its
    own mechanism at the same molecular step.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  cellular_components:
  - preferred_term: immunological synapse
    term:
      id: GO:0001772
      label: immunological synapse
  evidence:
  - reference: PMID:29751004
    reference_title: "Mutations affecting the actin regulator WD repeat-containing protein 1 lead to aberrant lymphoid immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, peripheral T cells from the patients accumulated atypical actin structures at the immunologic synapse and displayed reduced calcium flux and mildly impaired proliferation on T-cell receptor stimulation."
    explanation: >-
      The T-cell half of this node, measured in patient cells.
  - reference: PMID:29751004
    reference_title: "Mutations affecting the actin regulator WD repeat-containing protein 1 lead to aberrant lymphoid immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WDR1 deficiency was associated with even more severe abnormalities of the B-cell compartment, including peripheral B-cell lymphopenia, paucity of B-cell progenitors in the bone marrow, lack of switched memory B cells, reduced clonal diversity, abnormal B-cell spreading, and increased apoptosis on B-cell receptor/Toll-like receptor stimulation."
    explanation: >-
      The B-cell half, and the observation that it is the more severely
      affected compartment.
  - reference: PMID:29751004
    reference_title: "Mutations affecting the actin regulator WD repeat-containing protein 1 lead to aberrant lymphoid immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study identifies a novel role for WDR1 in adaptive immunity, highlighting WDR1 as a central regulator of actin turnover during formation of the B-cell and T-cell immunologic synapses."
    explanation: >-
      States the mechanism this node asserts: actin turnover at the synapse.
  downstream:
  - target: Decreased total B cell count
  - target: Impaired Innate Host Defense at Barrier Surfaces
    description: >-
      Loss of switched memory B cells and B lymphopenia add an antibody-side
      contribution to the same clinical infection burden.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Defective Megakaryocyte Maturation and Platelet Shedding
  biological_scale: CELLULAR
  description: >-
    Bone marrow from a PFIT patient contained small atypical megakaryocytes
    that had failed to develop a demarcating membrane system, the structure
    from which proplatelets are extended. Thrombocytopenia in PFIT is therefore
    a production defect at the shedding step, not peripheral destruction.
  cell_types:
  - preferred_term: Megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  biological_processes:
  - preferred_term: platelet formation
    term:
      id: GO:0030220
      label: platelet formation
    modifier: DECREASED
  evidence:
  - reference: PMID:27994071
    reference_title: "Autoinflammatory periodic fever, immunodeficiency, and thrombocytopenia (PFIT) caused by mutation in actin-regulatory gene WDR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed ultrastructural abnormalities of megakaryocytes in patient IV-4 (Fig"
    explanation: >-
      Records that the megakaryocyte abnormality was observed in patient
      marrow. Quoted short because the sentence continues into a figure
      callout; the morphological detail is in the next item.
  - reference: PMID:27994071
    reference_title: "Autoinflammatory periodic fever, immunodeficiency, and thrombocytopenia (PFIT) caused by mutation in actin-regulatory gene WDR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealing occasional small, atypical megakaryocytes, with no nucleus and failure of the development of the demarcating membrane system."
    explanation: >-
      The specific ultrastructural lesion: absent demarcating membrane system,
      which is the structure proplatelet shedding requires.
  - reference: PMID:17515402
    reference_title: "Mutations in the cofilin partner Aip1/Wdr1 cause autoinflammatory disease and macrothrombocytopenia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Macrothrombocytopenia is the result of megakaryocyte maturation defects, which lead to a failure of normal platelet shedding."
    explanation: >-
      The mouse experiment that establishes the causal step the human
      ultrastructure is read against. Indirect because it is a mouse hypomorph,
      and because platelet size transfers only partly: of the two index
      siblings, one had mean platelet volume consistently above the reference
      range and the other consistently within it, so the human phenotype is
      variable rather than uniformly normocytic. The next evidence item records
      that measurement.
  - reference: PMID:27994071
    reference_title: "Autoinflammatory periodic fever, immunodeficiency, and thrombocytopenia (PFIT) caused by mutation in actin-regulatory gene WDR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Patient IV-2 had mean MPV consistently greater than the reference range (with the exception of two measurements: mean MPV, 11.77 fl; range, 10.6–13.10), and significantly higher than her sibling both before and after HSCT (P < 0.0001, ANOVA)."
    explanation: >-
      Qualifies how far the mouse macrothrombocytopenia transfers: one of
      the two index siblings did have a raised mean platelet volume.
      Indirect because it bears on the fidelity of the mouse model rather
      than on the shedding mechanism itself.
  downstream:
  - target: Thrombocytopenia

pathophysiology:
- name: Biallelic WDR1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic WDR1 variants reduce the function of actin-interacting protein 1
    (Aip1). The index PFIT family carries a homozygous missense substitution
    affecting both transcripts; the neutrophil-dysfunction families carry
    biallelic variants affecting distinct antiparallel beta-strands of the
    protein.
  genetic_context:
    gene:
      preferred_term: WDR1
      term:
        id: hgnc:12754
        label: WDR1
    allele_type: missense
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:27994071
    reference_title: "Autoinflammatory periodic fever, immunodeficiency, and thrombocytopenia (PFIT) caused by mutation in actin-regulatory gene WDR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, homozygous missense L153F/L293F mutation in the actin regulatory gene WDR1 causes a new AID in humans, with periodic fevers, immunodeficiency, and intermittent thrombocytopenia (PFIT)."
    explanation: >-
      Names the causal gene, the zygosity and the substitution, and asserts
      causation for the syndrome this entry describes.
  - reference: PMID:27557945
    reference_title: "Cytoskeletal abnormalities and neutrophil dysfunction in WDR1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic mutations in WDR1 affecting distinct antiparallel β-strands of Aip1 were identified in all patients."
    explanation: >-
      Independent confirmation of biallelic WDR1 variants in a separate cohort
      of four children from three families.
  downstream:
  - target: Impaired Cofilin-Mediated Actin Filament Disassembly
    description: >-
      Aip1 is the accelerator of cofilin-mediated filament severing, so reduced
      Aip1 function slows actin filament turnover.
- name: Impaired Cofilin-Mediated Actin Filament Disassembly
  biological_scale: MOLECULAR
  description: >-
    Aip1/WDR1 preferentially disassembles cofilin-decorated actin filaments.
    With Aip1 function reduced, filaments that cofilin has already decorated are
    not cleared, and polymerised actin accumulates. Patient neutrophils carry
    roughly four times the normal F-actin content.
  biological_processes:
  - preferred_term: actin filament depolymerization
    term:
      id: GO:0030042
      label: actin filament depolymerization
    modifier: DECREASED
  evidence:
  - reference: PMID:29056508
    reference_title: "Functions of actin-interacting protein 1 (AIP1)/WD repeat protein 1 (WDR1) in actin filament dynamics and cytoskeletal regulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "AIP1 preferentially promotes disassembly of ADF/cofilin-decorated actin filaments but exhibits minimal effects on bare actin filaments."
    explanation: >-
      States the specific biochemical activity that is lost, and that it is
      selective for cofilin-decorated filaments rather than actin generally.
  - reference: PMID:27557945
    reference_title: "Cytoskeletal abnormalities and neutrophil dysfunction in WDR1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neutrophil F-actin was elevated fourfold, suggesting an abnormality in F-actin regulation."
    explanation: >-
      Quantifies the accumulation of polymerised actin in patient cells, the
      direct cellular readout of failed depolymerisation.
  - reference: PMID:27994071
    reference_title: "Autoinflammatory periodic fever, immunodeficiency, and thrombocytopenia (PFIT) caused by mutation in actin-regulatory gene WDR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found impaired actin dynamics in patient immune cells."
    explanation: >-
      Confirms the same actin-dynamics defect in the independent PFIT family.
  - reference: PMID:25448002
    reference_title: "Aip1 destabilizes cofilin-saturated actin filaments by severing and accelerating monomer dissociation from ends."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results indicate that Aip1 is a cofilin-dependent actin depolymerization factor and not a barbed-end-capping factor as was previously thought."
    explanation: >-
      Corrects what the lost activity actually is. Aip1 depolymerises rather
      than caps, which matters because a capping defect and a depolymerisation
      defect predict opposite changes in F-actin, and patient cells show F-actin
      accumulation.
  - reference: PMID:25448002
    reference_title: "Aip1 destabilizes cofilin-saturated actin filaments by severing and accelerating monomer dissociation from ends."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified Aip1 as a critical factor responsible for the severing and destabilization of actin filaments even in the presence of high amounts of cofilin."
    explanation: >-
      Explains why cofilin alone cannot compensate: at the cofilin
      concentrations found in lymphoid cells, severing needs Aip1.
  downstream:
  - target: Defective Immunological Synapse Formation in Lymphocytes
    description: >-
      B-cell and T-cell immunological synapses depend on Aip1-driven actin
      turnover.
  - target: Pyrin Sequestration by Mutant WDR1 Aggregates
    description: >-
      Mutant WDR1 protein aggregates, and the aggregates appear to trap pyrin.
    causal_link_type: DIRECT
  - target: Defective Neutrophil Motility and Polarization
    description: >-
      Neutrophil chemotaxis and polarisation depend on continuous actin
      turnover at the leading edge.
  - target: Defective Megakaryocyte Maturation and Platelet Shedding
    description: >-
      Megakaryocyte maturation and proplatelet shedding require cofilin/Aip1
      actin dynamics.
- name: Pyrin Sequestration by Mutant WDR1 Aggregates
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In HEK293T cells co-transfected with pyrin and mutant WDR1, the mutant
    protein forms aggregates that accumulate pyrin. The proposal is that this
    concentrates pyrin and so nucleates inflammasome assembly. This is an
    overexpression experiment in a heterologous cell line and the authors
    themselves state it only as a possibility, so the node is marked
    PROVISIONAL rather than asserted.
  evidence:
  - reference: PMID:27994071
    reference_title: "Autoinflammatory periodic fever, immunodeficiency, and thrombocytopenia (PFIT) caused by mutation in actin-regulatory gene WDR1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Mutant protein formed aggregates that appeared to accumulate pyrin; this could potentially precipitate inflammasome assembly."
    explanation: >-
      The only direct observation behind this node, and the reason it is
      PROVISIONAL: "appeared to" and "could potentially" are the authors' own
      hedges, and the experiment is transfected HEK293T cells rather than
      patient monocytes.
  downstream:
  - target: Inflammasome Hyperactivation in Monocytes
    description: >-
      Concentrating pyrin is proposed to lower the threshold for inflammasome
      assembly.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Inflammasome Hyperactivation in Monocytes
  biological_scale: CELLULAR
  description: >-
    Patient monocytes show increased caspase-1 cleavage, the biochemical
    signature of inflammasome activation.
  cell_types:

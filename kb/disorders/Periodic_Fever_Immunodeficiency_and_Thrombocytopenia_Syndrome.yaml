animal_models:
- name: Wdr1 hypomorphic (rd/rd) mouse
  species: Mouse
  genotype: Wdr1 hypomorphic allele, homozygous
  publication: PMID:17515402
  description: >-
    An allelic series at the mouse Wdr1 locus. Severe loss of function is
    embryonic lethal; hypomorphic alleles give autoinflammatory disease and
    macrothrombocytopenia. This model preceded and predicted the human
    syndrome, including its IL-18 dependence.
  modeled_mechanisms:
  - target: Defective Megakaryocyte Maturation and Platelet Shedding
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The mouse establishes the causal chain from Wdr1 hypomorphism through
      megakaryocyte maturation failure to defective platelet shedding.
    limitations: >-
      The mouse phenotype is uniform macrothrombocytopenia; in humans platelet
      size transfers only partly, with one of the two index siblings showing
      mean platelet volume consistently above the reference range and the other
      consistently within it. The human thrombocytopenia is otherwise described
      as intermittent and moderate.
    readouts:
    - name: Platelet count and megakaryocyte maturation stage
      target: Defective Megakaryocyte Maturation and Platelet Shedding
      direction: DECREASED
      interpretation: >-
        Reduced platelet output attributable to arrested megakaryocyte
        maturation.
      evidence:
      - reference: PMID:17515402
        reference_title: "Mutations in the cofilin partner Aip1/Wdr1 cause autoinflammatory disease and macrothrombocytopenia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Macrothrombocytopenia is the result of megakaryocyte maturation defects, which lead to a failure of normal platelet shedding."
        explanation: >-
          Reports the measurement and the causal attribution behind this
          readout.
    evidence:
    - reference: PMID:17515402
      reference_title: "Mutations in the cofilin partner Aip1/Wdr1 cause autoinflammatory disease and macrothrombocytopenia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These studies establish an essential requirement for Wdr1 in megakaryocytes and neutrophils, indicating that cofilin-mediated actin dynamics are critically important to the development and function of both cell types."
      explanation: >-
        Supports treating the mouse as informative for the megakaryocyte arm of
        the human disease.
  - target: Defective Neutrophil Motility and Polarization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Wdr1 mutant mouse neutrophils show impaired cytoskeletal responses and
      accumulate polymerised actin, as human patient neutrophils do.
    limitations: >-
      Whether the mouse is functionally immunodeficient was never established:
      the animals were housed in a relatively protected environment, so the
      clinical consequence that defines the human disease was not tested. The
      mouse inflammatory lesions are neutrophil-rich infiltrates, which is
      close to the opposite of the human picture of neutrophils failing to
      arrive.
    evidence:
    - reference: PMID:17515402
      reference_title: "Mutations in the cofilin partner Aip1/Wdr1 cause autoinflammatory disease and macrothrombocytopenia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cytoskeletal responses are impaired in Wdr1 mutant neutrophils."
      explanation: >-
        The cellular defect the model shares with the human disease, and the
        limit of what it demonstrates.
diagnosis:
- name: Biallelic WDR1 variants on molecular testing in a compatible phenotype
  description: >-
    The diagnosis rests on finding biallelic WDR1 variants in a child with
    periodic fever, recurrent infection and thrombocytopenia. Two findings are
    worth knowing because they are cheap and specific: neutrophil nuclear-lobe
    herniation on a smear, and a raised serum IL-18 with a normal or
    disproportionately low IL-1-beta.
  evidence:
  - reference: PMID:27557945
    reference_title: "Cytoskeletal abnormalities and neutrophil dysfunction in WDR1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic mutations in WDR1 affecting distinct antiparallel β-strands of Aip1 were identified in all patients."
    explanation: >-
      Establishes biallelic WDR1 variants as the molecular finding in every
      patient of the cohort.
differential_diagnoses:
- name: Other monogenic autoinflammatory actinopathies
  description: >-
    PFIT belongs to a recognised class rather than merely resembling one.
    Defects in ARPC1B, MKL1/MRTFA, DOCK8, WAS, DOCK11, ARPC5 and coronin-1A all
    combine immunodeficiency, cytopenia and autoinflammation from disordered
    actin regulation, and the class has a diagnostic shape: early-onset
    autoinflammatory skin and digestive disease with immunodeficiency plus
    thrombocytopenia or bleeding. Genetic testing is what separates the
    members.
  evidence:
  - reference: PMID:39644982
    reference_title: "Current landscape of monogenic autoinflammatory actinopathies: A literature review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis should be considered primarily when encountering an early-onset autoinflammatory skin and digestive disorder, along with a primary immunodeficiency and either thrombocytopenia or a bleeding tendency."
    explanation: >-
      States the class-level diagnostic trigger that puts PFIT and its
      differentials in the same frame.
  - reference: PMID:39644982
    reference_title: "Current landscape of monogenic autoinflammatory actinopathies: A literature review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Actinopathies with autoinflammatory manifestations represent a newly emerging subgroup of AID, associated with defects in the regulation of actin cytoskeleton dynamics."
    explanation: >-
      Defines the class this entry places PFIT in.
- name: Hereditary periodic fever syndromes
  description: >-
    Familial Mediterranean fever, TRAPS, mevalonate kinase deficiency and
    cryopyrin-associated periodic syndrome share the periodic-fever
    presentation. The combination with thrombocytopenia and a neutrophil
    migration defect, and the IL-18-dominant rather than IL-1-beta-dominant
    cytokine profile, separate PFIT from them.
discussions:
- discussion_id: pfit_pyrin_sequestration_evidence
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Pyrin Sequestration by Mutant WDR1 Aggregates
  prompt: >-
    Does mutant WDR1 sequester pyrin in patient monocytes, or is the aggregate
    an artefact of overexpression in HEK293T cells?
  rationale: >-
    The link from impaired actin turnover to inflammasome activation is the
    load-bearing step of the autoinflammatory arm, and it rests on a single
    co-transfection experiment in a heterologous cell line, reported by its
    authors with two hedges in one sentence. Patient monocytes show increased
    caspase-1 cleavage, so something activates the inflammasome; whether it is
    pyrin sequestration by aggregates is untested in a patient-derived cell.
    The node is marked PROVISIONAL for this reason.
  proposed_experiments:
  - experiment_id: pfit_pyrin_localisation_patient_monocytes
    name: Pyrin localisation in patient-derived monocytes
    description: >-
      Image endogenous pyrin and WDR1 in patient monocytes or
      patient-iPSC-derived macrophages at physiological expression, and ask
      whether pyrin co-localises with WDR1 aggregates.
    readouts:
    - name: Pyrin and WDR1 co-localisation
      target: pathophysiology#Pyrin Sequestration by Mutant WDR1 Aggregates
      direction: INCREASED
      interpretation: >-
        Co-localisation at endogenous expression would move the node off
        PROVISIONAL.
- discussion_id: pfit_il18_versus_il1_target
  kind: CONTROVERSY
  attaches_to:
  - pathophysiology#Excess Interleukin-18 Production
  - treatments#Interleukin-1 Blockade with Anakinra
  prompt: >-
    If PFIT autoinflammation is IL-18-driven, why did anakinra have any effect
    at all, and would IL-18 blockade work better?
  rationale: >-
    The cytokine data are unambiguous that IL-18 and not IL-1-beta is raised,
    yet anakinra produced a transient steroid-sparing effect. The authors
    themselves raise the possibility that anakinra partially antagonises IL-18,
    which would reconcile the two observations, but no PFIT patient has been
    treated with a specific IL-18 blocker such as recombinant IL-18-binding
    protein. Until one is, the mechanistic model predicts a therapy that has
    never been tested in this disease.
notes: >-
  On the deep-research report. An openscientist report was generated for this
  disease and reconciled into the entry after the first draft. It passed the
  Named Entity Confusion preflight (WDR1 mentioned 45 times, no rival gene, and
  the OMIM identifier matched MONDO's xref). Its most valuable contribution was
  PMID:29751004, a third cohort establishing a lymphoid arm that neither
  founding report describes; that node and its phenotypes exist because of the
  report. Every PMID taken from it was verified against PubMed before citation.

  One report-cited reference was deliberately not used: PMID:24840128, a
  cardiomyocyte-specific Wdr1 conditional knockout with cardiac hypertrophy and
  QT prolongation. No cardiac phenotype is reported in any human PFIT patient,
  so curating it would import an organ the disease does not involve. It is not
  cited and not committed.

  Three cohorts describe this disease from different ends and have never
  been formally reconciled. PMID:27994071 named PFIT from two siblings whose
  dominant problem was autoinflammation; PMID:27557945 described four children
  whose dominant problem was neutrophil dysfunction and named it a primary
  immunodeficiency, without using the term PFIT; PMID:29751004 described six
  patients whose dominant problem was lymphoid, and framed WDR1 deficiency as
  an adaptive-immunity disorder. This entry curates them as one disease because
  the gene, the biochemical lesion and the cell types are the same, but the
  three papers do not share a phenotype definition, and whether the phenotypic
  weighting reflects allele severity is unknown.

  Not curated, and why. No `datasets:` and no `clinical_trials:` - no verified
  accessions or trial registrations exist for a disease with twelve reported
  patients. No `environmental:` - no exposure is implicated. No `biochemical:`
  reference ranges - serum IL-18 is carried as a phenotype rather than a
  biomarker readout because no reference interval for it is given in either
  source. `directness` is set only where it was actually assessed. No count is
  given: this sentence said "four" and was correct until the previous review
  round added a fifth item, which is the second time a count in prose here has
  gone stale.

  On the OMIM 150550 cross-reference. MONDO:0007883 carries a historical xref
  to OMIM 150550, whose title is "lazy leukocyte syndrome". That looks alarming
  and is not: MONDO's own label for 0007883 is "periodic fever,
  immunodeficiency, and thrombocytopenia syndrome", so the binding is to the
  right concept and 150550 is a retitled MIM number rather than a different
  disease. Recorded here so the next curator does not re-litigate it. No
  `mappings:` block is added, because the entry cites no source that states the
  MIM number and its role, and the deep-research report is a lead rather than a
  citable authority for an identifier.

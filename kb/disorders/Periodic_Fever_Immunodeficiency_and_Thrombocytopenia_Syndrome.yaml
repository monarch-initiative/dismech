treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Replacing the mutant haematopoietic compartment addresses all three arms of
    the disease at once, because the neutrophil, monocyte and megakaryocyte
    defects are all cell-intrinsic to bone-marrow-derived cells. One PFIT
    patient transplanted at age 8 remained well and off all medication three
    years later, and transplantation corrected the immunological defect in one
    patient of the neutrophil-dysfunction cohort.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic haematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Defective Neutrophil Motility and Polarization
    description: >-
      Donor-derived neutrophils carry wild-type WDR1 and migrate normally.
  - target: Inflammasome Hyperactivation in Monocytes
    description: >-
      Donor-derived monocytes remove the source of excess IL-18.
  evidence:
  - reference: PMID:27994071
    reference_title: "Autoinflammatory periodic fever, immunodeficiency, and thrombocytopenia (PFIT) caused by mutation in actin-regulatory gene WDR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient IV-4 successfully underwent allogeneic hematopoietic stem cell transplantation (HSCT) at age 8, and remains well, off all medication, 3 yr later."
    explanation: >-
      The single reported durable outcome in PFIT, and the basis for treating
      transplantation as definitive rather than supportive.
  - reference: PMID:27994071
    reference_title: "Autoinflammatory periodic fever, immunodeficiency, and thrombocytopenia (PFIT) caused by mutation in actin-regulatory gene WDR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given that severe autoinflammation coexists with immunodeficiency and thrombocytopenia in PFIT, for the time being, we suggest that HSCT is the most appropriate treatment."
    explanation: >-
      The authors' explicit treatment recommendation, and their reasoning that
      it is the coexistence of the three arms that makes transplant the answer.
  - reference: PMID:27557945
    reference_title: "Cytoskeletal abnormalities and neutrophil dysfunction in WDR1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Allogeneic stem cell transplantation corrected the immunologic defect in 1 patient."
    explanation: >-
      An independent transplant outcome in the second cohort, restricted to the
      immunological arm.
  - reference: PMID:39644982
    reference_title: "Current landscape of monogenic autoinflammatory actinopathies: A literature review."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "In most cases, the severity of the conditions necessitates allogeneic marrow transplantation as a treatment option."
    explanation: >-
      Places transplantation as the usual answer across the actinopathy class.
      Graded INDIRECT because the statement is about autoinflammatory
      actinopathies as a group, not about PFIT specifically.
- name: Interleukin-1 Blockade with Anakinra
  description: >-
    Anakinra produced only a transient steroid-sparing effect and did not
    control the autoinflammatory episodes; the patient treated with it died at

      explanation: Shows the model reproduces the parathyroid limb.
- name: Gna11 knockout mouse
  species: Mouse
  genotype: Gna11 global ablation, heterozygous (Gna11+/-) and homozygous (Gna11-/-)
  publication: PMID:38530370
  description: >-
    Global Gna11 knockout mice have hypercalcaemia and mildly raised PTH, and also
    raised serum FGF23 with hypophosphataemia and, in homozygotes, systemic
    inflammation. Whether FGF23 is raised in human FHH2 has not been reported, so
    the FGF23 finding is recorded here only as a model observation.
  modeled_mechanisms:
  - target: Non-Suppressed Parathyroid Hormone Secretion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Hypercalcaemia with mildly raised PTH in Gna11-deficient mice.
    limitations: >-
      Complete or global gene ablation rather than a patient missense allele; the
      FGF23 and inflammatory findings have no human FHH2 counterpart yet.
    evidence:
    - reference: PMID:38530370
      reference_title: "Gα11 deficiency increases fibroblast growth factor 23 levels in a mouse model of familial hypocalciuric hypercalcemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Both Gna11+/- and Gna11-/- mice demonstrated hypercalcemia and mildly
        raised parathyroid hormone levels, consistent with FHH.
      explanation: Shows the knockout reproduces the FHH biochemistry.
discussions:
- discussion_id: fhh2_penetrance_and_biallelic_cases
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Hypercalcemia
  - inheritance#Autosomal dominant
  prompt: How penetrant is heterozygous GNA11 loss of function, and what does biallelic
    loss produce?
  rationale: >-
    The phenotype rests on fewer than ten kindreds. Some heterozygous carriers have
    been normocalcaemic, one adult's calcium normalised during follow-up, and the
    only reported homozygous proband had only mild hypercalcaemia while his
    heterozygous parents were normocalcaemic but hypocalciuric. Unlike CASR,
    biallelic GNA11 loss has not been shown to produce a severe neonatal disease.
    Larger genotype-first cohorts would settle penetrance.
  evidence:
  - reference: PMID:41240382
    reference_title: "A novel homozygous c.301T > C, p.Y101H variant in the GNA11 gene is implicated in familial hypocalciuric hypercalcemia type 2 in a proband with the heterozygous variant present in mother and father - A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Severe hypercalcemia may not occur in homozygous cases.
    explanation: The homozygous case did not have severe hypercalcaemia.
  - reference: PMID:42787214
    reference_title: "Case report: A Newly Identified G-protein Subunit α-11 Loss-of-Function Variant Causing Familial Hypocalciuric Hypercalcemia Type 2 in an Italian Kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genetic testing identified a novel heterozygous germline frameshift variant
      in GNA11 (c.980_981del, p.His327LeufsTer150) in the proband, his mother, and
      his 15-month-old normocalcemic daughter.
    explanation: A normocalcaemic heterozygous carrier child.
notes: >-
  Curated as a separate disease from FHH1 (CASR) and FHH3 (AP2S1) because the
  causal gene and its molecular lesion differ, and MONDO carries each as its own
  term. No GeneReviews chapter covers FHH2 (checked against the Bookshelf
  index). No mechanism module in kb/modules covers CaSR signalling, so no
  conforms_to is declared; FHH1 likewise declares none.

name: Familial Hypocalciuric Hypercalcemia 2
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
description: >-
  FHH2 is the rarest genetic form of familial hypocalciuric hypercalcaemia. It is
  caused by heterozygous loss-of-function variants in GNA11, which encodes the G
  protein alpha-11 subunit that couples the calcium-sensing receptor (CaSR) to
  phospholipase C. Where FHH1 blunts the receptor itself, FHH2 leaves the
  receptor intact and weakens the first step that carries its signal into the
  cell. The physiological result is the same: parathyroid and renal tubular
  cells need a higher extracellular calcium concentration before they respond,
  so the body's calcium set point is raised.

  The two consequences follow from the two tissues in which the CaSR-G-alpha-11
  pathway acts. In the parathyroid, PTH is not suppressed at a calcium level that
  should suppress it. In the kidney, calcium continues to be reabsorbed rather
  than excreted. Affected people therefore have lifelong mild hypercalcaemia,
  a PTH that is normal or modestly raised rather than suppressed, and low urinary
  calcium excretion, a picture that mimics mild primary hyperparathyroidism. Most
  are asymptomatic, and the clinical stakes are the same as in FHH1: recognising
  the disorder so that a parathyroidectomy that cannot correct it is avoided.

  The GNA11 locus is the mirror of autosomal dominant hypocalcaemia type 2, where
  gain-of-function GNA11 variants lower the set point instead. Fewer than ten
  FHH2 kindreds have been reported, so its phenotype range, penetrance and
  natural history rest on a handful of families and on mouse models.

  - reference: PMID:42787214
    reference_title: "Case report: A Newly Identified G-protein Subunit α-11 Loss-of-Function Variant Causing Familial Hypocalciuric Hypercalcemia Type 2 in an Italian Kindred."
    supports: SUPPORT

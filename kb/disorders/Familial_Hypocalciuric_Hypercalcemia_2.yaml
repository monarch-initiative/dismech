    reference_title: "Case report: A Newly Identified G-protein Subunit α-11 Loss-of-Function Variant Causing Familial Hypocalciuric Hypercalcemia Type 2 in an Italian Kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A similar biochemical profile in his mother suggested FHH.
    explanation: Family biochemistry contributed to the suspicion of FHH.
- name: Stepwise FHH Gene Sequencing
  description: >-
    Because FHH2 is rare, testing usually starts with CASR and AP2S1 codon 15 and
    proceeds to GNA11 when these are negative and suspicion remains; gene-panel
    testing covers all three at once. A rare GNA11 variant should be functionally
    characterised before being accepted as causal.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:27913609
    reference_title: "AP2S1 and GNA11 mutations - not a common cause of familial hypocalciuric hypercalcemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: If the results are negative and there is still suspicion of an inherited
      condition (i.e. family history), then GNA11 should be examined.
    explanation: Recommends GNA11 testing after negative CASR and AP2S1 testing.
treatments:
- name: Observation Without Intervention
  description: >-
    Most carriers are asymptomatic with stable mild hypercalcaemia and need no
    treatment beyond recognition of the diagnosis.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39163488
    reference_title: "Familial hypocalciuric hypercalcemia in an infant: diagnosis and management quandaries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Familial hypocalciuric hypercalcemia (FHH) is typically a benign condition
      characterized by elevated serum calcium, low urinary calcium excretion, and non-suppressed
      circulating levels of parathyroid hormone (PTH), usually requiring no intervention.
    explanation: States that FHH (including FHH2) usually needs no intervention.
    quote_role: BACKGROUND
    directness: INDIRECT
- name: Avoidance of Parathyroidectomy
  description: >-
    The glands are responding correctly to a pathway that under-reports calcium,
    so parathyroidectomy does not reset the set point. Recognising FHH is what
    prevents an unnecessary operation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:35566721
    reference_title: "Disorders of the Calcium Sensing Signaling Pathway: From Familial Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In children, adolescents and young adults with FHH the main challenge is
      to distinguish the condition from primary hyperparathyroidism and thereby to avoid
      unnecessary treatments including parathyroidectomy.
    explanation: States avoidance of parathyroidectomy as the goal of diagnosis across
      FHH subtypes.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- name: Cinacalcet
  description: >-
    A calcimimetic positive allosteric modulator of the CaSR, which raises the
    receptor's sensitivity and so offsets the weakened downstream signal. Used in
    one FHH2 proband with symptoms (headaches, constipation, pruritus) possibly
    attributable to hypercalcaemia, in whom it normalised ionised calcium.
    Supported also by cell and mouse studies. Reserved for symptomatic patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cinacalcet
      term:
        id: CHEBI:48390
        label: cinacalcet
  target_mechanisms:
  - target: Reduced CaSR-Coupled Phospholipase C Signaling
    description: Allosteric sensitisation of the receptor restores signalling through
      the mutant G-alpha-11.
  - target: Calcimimetic Occupancy of Parathyroid Calcium-Sensing Receptors
    treatment_effect: ACTIVATES
    description: >-
      Cinacalcet acts as a positive allosteric modulator at the calcium-sensing receptor, which is the receptor-level action this node represents.
    evidence:
    - reference: PMID:29680147
      reference_title: "Discovery and Development of Calcimimetic and Calcilytic Compounds."
      supports: SUPPORT
      evidence_source: OTHER
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: Calcimimetics are agonists or positive allosteric modulators of the CaR
      explanation: Establishes that this drug class acts as a positive allosteric modulator
        at the receptor this node represents.
  evidence:
  - reference: PMID:28833550
    reference_title: "Cinacalcet Rectifies Hypercalcemia in a Patient With Familial Hypocalciuric Hypercalcemia Type 2 (FHH2) Caused by a Germline Loss-of-Function Gα(11) Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Furthermore, in vivo administration of cinacalcet to the proband harboring
      the Phe220Ser Gα11 mutation, normalized serum ionized calcium concentrations.
    explanation: Clinical response in an FHH2 patient.
  - reference: PMID:28833550
    reference_title: "Cinacalcet Rectifies Hypercalcemia in a Patient With Familial Hypocalciuric Hypercalcemia Type 2 (FHH2) Caused by a Germline Loss-of-Function Gα(11) Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cinacalcet was administered to the FHH2 proband as he had symptoms such
      as headaches, constipation, and pruritus (Table 1), which may have been caused
      by the hypercalcemia.
    explanation: The indication in the treated proband, and its tentative attribution.
  - reference: PMID:26994139
    reference_title: "Allosteric Modulation of the Calcium-sensing Receptor Rectifies Signaling Abnormalities Associated with G-protein α-11 Mutations Causing Hypercalcemic and Hypocalcemic Disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cinacalcet and NPS-2143 rectified the Ca(2+) i responses of FHH2- and ADH2-associated
      Gα11 loss- and gain-of-function mutations, respectively.
    explanation: Cinacalcet restores signalling of FHH2 mutants in cells.
  - reference: PMID:29046478
    reference_title: "Cinacalcet corrects hypercalcemia in mice with an inactivating Gα11 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Cinacalcet (30mg/kg orally) significantly reduced plasma albumin-adjusted

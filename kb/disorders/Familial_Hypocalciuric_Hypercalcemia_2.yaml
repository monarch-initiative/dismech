    explanation: Normal bone density in a second FHH2 proband.
genetic:
- name: GNA11
  gene_term:
    preferred_term: GNA11
    term:
      id: hgnc:4379
      label: GNA11
  relationship_type: CAUSATIVE
  notes: >-
    GNA11 forms an allelic series with autosomal dominant hypocalcaemia type 2:
    loss-of-function alleles raise the calcium set point (FHH2) and
    gain-of-function alleles lower it (ADH2). FHH2 is the rarest FHH subtype;
    referral cohorts tested CASR first, then AP2S1, and found no or very few GNA11
    variants, and rare benign GNA11 variants occur in hypercalcaemic patients, so
    a novel GNA11 variant needs functional assessment before it is accepted as
    causal. No ClinGen gene-disease validity assertion was found for this pair in
    the committed ClinGen export.
  evidence:
  - reference: PMID:23802516
    reference_title: "Mutations affecting G-protein subunit α11 in hypercalcemia and hypocalcemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The kindred with familial hypocalciuric hypercalcemia type 2 had an in-frame
      deletion of a conserved Gα11 isoleucine (Ile200del), and one of the nine unrelated
      patients with familial hypocalciuric hypercalcemia had a missense GNA11 mutation
      (Leu135Gln).
    explanation: The founding identification of GNA11 variants in the original FHH2
      kindred and an unrelated FHH patient.
  - reference: PMID:26994139
    reference_title: "Allosteric Modulation of the Calcium-sensing Receptor Rectifies Signaling Abnormalities Associated with G-protein α-11 Mutations Causing Hypercalcemic and Hypocalcemic Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Germline loss- and gain-of-function mutations of G-protein α-11 (Gα11),
      which couples the calcium-sensing receptor (CaSR) to intracellular calcium (Ca(2+)
      i) signaling, lead to familial hypocalciuric hypercalcemia type 2 (FHH2) and
      autosomal dominant hypocalcemia type 2 (ADH2), respectively
    explanation: States the GNA11 allelic series described in the note.
    quote_role: BACKGROUND
  - reference: PMID:36970776
    reference_title: "GNA11 Variants Identified in Patients with Hypercalcemia or Hypocalcemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Thus, this study identified likely disease-causing GNA11 variants in <1%
      of probands with hypercalcemia or hypocalcemia and highlights the occurrence
      of GNA11 rare variants that are benign polymorphisms.
    explanation: Supports both the rarity of FHH2 and the caution about benign rare
      GNA11 variants.
  - reference: PMID:27913609
    reference_title: "AP2S1 and GNA11 mutations - not a common cause of familial hypocalciuric hypercalcemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We did not identify any pathogenic mutations in GNA11.
    explanation: No GNA11 cases among 33 CASR-negative suspected FHH patients, supporting
      its rarity.

    explanation: Hypocalciuria by the conventional cut-off in an FHH2 proband.
  - reference: PMID:38920275
    reference_title: "Loss-of-function Thr347Ala Variant in the G Protein Subunit-Α11 Causes Familial Hypocalciuric Hypercalcemia 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Heterozygous carriers of the GNA11 Thr347Ala variant had mild asymptomatic
      hypercalcemia, hypocalciuria, and inappropriately high normal PTH levels considering
      their elevated serum calcium levels.
    explanation: Hypocalciuria in a second FHH2 family.
- category: Biochemical
  name: Elevated or Inappropriately Normal Parathyroid Hormone
  description: >-
    PTH that is not suppressed despite hypercalcaemia. It is often within the
    reference interval, which is itself inappropriate at a raised calcium, and is
    sometimes modestly raised. This is the finding that puts primary
    hyperparathyroidism on the differential.
  phenotype_term:
    preferred_term: Elevated circulating parathyroid hormone level
    term:
      id: HP:0003165
      label: Elevated circulating parathyroid hormone level
  evidence:
  - reference: PMID:29046478
    reference_title: "Cinacalcet corrects hypercalcemia in mice with an inactivating Gα11 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: FHH2 is characterized by hypercalcemia, inappropriately normal or raised
      parathyroid hormone (PTH) concentrations, and normal or low urinary calcium excretion.
    explanation: States the PTH finding as part of the FHH2 biochemical triad.
    quote_role: BACKGROUND
  - reference: PMID:41240382
    reference_title: "A novel homozygous c.301T > C, p.Y101H variant in the GNA11 gene is implicated in familial hypocalciuric hypercalcemia type 2 in a proband with the heterozygous variant present in mother and father - A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Slightly elevated PTH (7.95 pmol/L), but normal phosphorus (1.19 mmol/L),
      alkaline phosphatase (271 U/L), magnesium (0.95 mmol/L), and albumin (43 g/L)
      levels were detected.
    explanation: A frankly (slightly) raised PTH in a GNA11 case.
- category: Dental
  name: Enamel Hypomineralization
  description: >-
    Patchy hypomineralised enamel co-segregating with hypercalcaemia in 10 patients
    from two families with a GNA11 whole-gene deletion or frameshift. Newly
    reported, so its frequency across FHH2 is unknown; it is the first enamel
    defect linked to a hypercalcaemic rather than a hypocalcaemic disorder.
  phenotype_term:
    preferred_term: Enamel hypomineralization
    term:
      id: HP:0006285
      label: Enamel hypomineralization
  evidence:
  - reference: PMID:42670332
    reference_title: "Abnormal Enamel Mineralization and Hypercalcemia due to GNA11 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we report 10 patients from 2 unrelated families in whom hypomineralized enamel
      co-segregated with hypercalcemia due to a complete deletion or frameshifting premature
      truncation (p.(Ser18Argfs*2)) of the guanine nucleotide-binding protein (G-protein)
      subunit α11 (GNA11) gene
    explanation: Reports enamel hypomineralisation co-segregating with GNA11 loss-of-function
      hypercalcaemia in two families.
- category: Renal
  name: Absence of Nephrolithiasis and Nephrocalcinosis
  description: >-
    Recorded as a negative phenotype because it separates FHH2, like FHH1, from
    primary hyperparathyroidism. It deliberately carries no phenotype_term and no
    frequency: binding HP:0000787 here would export as the opposite assertion.
    The evidence is a single kindred, so the claim is that renal calcification is
    not a feature of the reported cases, not that it never occurs.
  evidence:
  - reference: PMID:42787214
    reference_title: "Case report: A Newly Identified G-protein Subunit α-11 Loss-of-Function Variant Causing Familial Hypocalciuric Hypercalcemia Type 2 in an Italian Kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He had no evidence of kidney stones or nephrocalcinosis and demonstrated
      normal bone mineral density at dual-energy X-ray absorptiometry.
    explanation: No renal calcification and preserved bone density in an FHH2 proband.
- category: Musculoskeletal
  name: Preserved Bone Mineral Density
  description: >-
    Recorded as a negative finding: reported FHH2 patients have had normal bone
    density despite chronic non-suppressed PTH. Carries no phenotype_term for the
    same reason as the renal negative phenotype.
  evidence:
  - reference: PMID:42787214
    reference_title: "Case report: A Newly Identified G-protein Subunit α-11 Loss-of-Function Variant Causing Familial Hypocalciuric Hypercalcemia Type 2 in an Italian Kindred."
    supports: SUPPORT

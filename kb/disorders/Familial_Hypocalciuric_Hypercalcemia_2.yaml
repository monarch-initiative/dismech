diagnosis:
- name: Paired Serum Calcium and Intact PTH
  description: >-
    Hypercalcaemia with a PTH that is not suppressed establishes PTH-dependent
    hypercalcaemia and puts FHH and primary hyperparathyroidism on the
    differential; it does not separate them.
  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:29046478
    reference_title: "Cinacalcet corrects hypercalcemia in mice with an inactivating Gα11 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: FHH2 is characterized by hypercalcemia, inappropriately normal or raised
      parathyroid hormone (PTH) concentrations, and normal or low urinary calcium excretion.
    explanation: Names hypercalcaemia with non-suppressed PTH as the defining biochemistry
      that paired calcium and PTH measurement detects.
    quote_role: BACKGROUND
- name: Calcium/Creatinine Clearance Ratio
  description: >-
    Low calcium/creatinine clearance ratio points toward FHH. Family biochemical
    screening helps, since a relative with the same profile supports an inherited
    cause.
  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:

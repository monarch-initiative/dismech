- name: Gna11 Asp195Gly ENU mouse
  species: Mouse
  genotype: Gna11 Asp195Gly, heterozygous and homozygous
  publication: PMID:29046478
  description: >-
    An ENU-induced loss-of-function Gna11 allele. Heterozygous and homozygous mice
    are hypercalcaemic with normal or raised PTH and normal urinary calcium, and
    respond to cinacalcet.
  modeled_mechanisms:
  - target: Non-Suppressed Parathyroid Hormone Secretion
    relationship: RECAPITULATES

  downstream:
  - target: Hypercalcemia
    causal_link_type: DIRECT
    description: Continued PTH secretion holds serum calcium above the normal range.
  - target: Elevated or Inappropriately Normal Parathyroid Hormone
    causal_link_type: DIRECT
    description: The circulating readout of the parathyroid limb.
- name: Increased Renal Tubular Calcium Reabsorption
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    In the kidney the CaSR-G-alpha-11 pathway normally reduces tubular calcium
    reabsorption when blood calcium rises. With G-alpha-11 weakened, calcium is
    retained, so urinary calcium is low or inappropriately normal for the
    prevailing serum calcium. The renal mechanism is inferred from the CaSR
    pathway and from mouse data rather than measured directly in FHH2 patients.
  biological_processes:
  - preferred_term: renal tubular calcium reabsorption
    modifier: INCREASED
    term:
      id: GO:0006816
      label: calcium ion transport
  evidence:
  - reference: PMID:28833550
    reference_title: "Cinacalcet Rectifies Hypercalcemia in a Patient With Familial Hypocalciuric Hypercalcemia Type 2 (FHH2) Caused by a Germline Loss-of-Function Gα(11) Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: G-protein subunit α-11 (Gα11 ) couples the calcium-sensing receptor (CaSR)
      to phospholipase C (PLC)-mediated intracellular calcium (Ca2+i ) and mitogen-activated
      protein kinase (MAPK) signaling, which in the parathyroid glands and kidneys regulates
      parathyroid hormone release and urinary calcium excretion, respectively.
    explanation: Places the G-alpha-11 pathway in control of urinary calcium excretion
      in the kidney.
    quote_role: BACKGROUND
  - reference: PMID:29046478
    reference_title: "Cinacalcet corrects hypercalcemia in mice with an inactivating Gα11 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In vivo studies showed mutant heterozygous (Gna11+/195G) and homozygous
      (Gna11195G/195G) mice to be hypercalcemic with normal or increased plasma PTH
      concentrations and normal urinary calcium excretion.
    explanation: Urinary calcium stays normal despite hypercalcaemia in the mouse model,
      implying inappropriate renal calcium retention.
    directness: INDIRECT
  downstream:
  - target: Hypocalciuria
    causal_link_type: DIRECT
    description: Reabsorbed calcium does not appear in the urine.
  - target: Hypercalcemia
    causal_link_type: DIRECT
    description: Renal retention contributes to the circulating excess.
  - target: Absence of Nephrolithiasis and Nephrocalcinosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      With little calcium delivered to the urine, the stone-forming load seen in
      primary hyperparathyroidism does not arise.
- name: Calcimimetic Occupancy of Parathyroid Calcium-Sensing Receptors
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: casr_positive_allosteric_modulation#Calcimimetic Occupancy of the Parathyroid Calcium-Sensing Receptor
  description: >-
    Cinacalcet sensitises the calcium-sensing receptor on the parathyroid chief cell, acting at the receptor upstream of the GNA11 signalling defect, so that more signal passes through the partly functional mutant G-alpha-11 and parathyroid hormone secretion falls. The relation to the nodes above is pharmacological compensation, not causation, so this node asserts no downstream edge.
  molecular_functions:
  - preferred_term: calcium-sensing receptor activity
    modifier: INCREASED
    term:
      id: GO:0004930
      label: G protein-coupled receptor activity
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  locations:
  - preferred_term: parathyroid gland
    term:
      id: UBERON:0001132
      label: parathyroid gland
  genes:
  - preferred_term: CASR
    term:
      id: hgnc:1514
      label: CASR
  evidence:
  - reference: PMID:29534286
    reference_title: "Clinical Pharmacokinetics and Pharmacodynamics of Etelcalcetide, a Novel Calcimimetic for Treatment of Secondary Hyperparathyroidism in Patients With Chronic Kidney Disease on Hemodialysis."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Etelcalcetide binds the calcium-sensing receptor and increases its sensitivity
      to extracellular calcium, thereby decreasing secretion of parathyroid hormone (PTH)
      by chief cells
    explanation: States the receptor occupancy and sensitisation this node represents,
      and names the chief cell it acts on.
  - reference: PMID:28833550
    reference_title: Cinacalcet Rectifies Hypercalcemia in a Patient With Familial Hypocalciuric Hypercalcemia
      Type 2 (FHH2) Caused by a Germline Loss-of-Function Gα(11) Mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The loss-of-function associated with the Ser220 Gα11 mutant was rectified by treatment of
      cells with cinacalcet, which is a CaSR-positive allosteric modulator.
    explanation: This disease's own source, naming cinacalcet as a CaSR-positive allosteric modulator and
      showing it rectifies the Gα11 loss-of-function that defines FHH2.
phenotypes:
- category: Biochemical
  name: Hypercalcemia
  description: >-
    Mild, usually lifelong and asymptomatic. Penetrance is incomplete or variable:
    a carrier child was normocalcaemic, heterozygous parents of a homozygous
    proband were normocalcaemic, and one adult's calcium normalised during
    follow-up, so a normal calcium does not exclude the diagnosis.
  phenotype_term:
    preferred_term: Hypercalcemia
    term:
      id: HP:0003072
      label: Hypercalcemia
  evidence:
  - reference: PMID:38920275
    reference_title: "Loss-of-function Thr347Ala Variant in the G Protein Subunit-Α11 Causes Familial Hypocalciuric Hypercalcemia 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Heterozygous carriers of the GNA11 Thr347Ala variant had mild asymptomatic
      hypercalcemia, hypocalciuria, and inappropriately high normal PTH levels considering
      their elevated serum calcium levels.
    explanation: Mild asymptomatic hypercalcaemia in an FHH2 family.
  - reference: PMID:26729423
    reference_title: "A G-protein Subunit-α11 Loss-of-Function Mutation, Thr54Met, Causes Familial Hypocalciuric Hypercalcemia Type 2 (FHH2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe a 65-year-old woman who had hypercalcemia with normal circulating
      parathyroid hormone concentrations and hypocalciuria, features consistent with
      FHH
    explanation: Hypercalcaemia in a second FHH2 proband.
  - reference: PMID:42787214
    reference_title: "Case report: A Newly Identified G-protein Subunit α-11 Loss-of-Function Variant Causing Familial Hypocalciuric Hypercalcemia Type 2 in an Italian Kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings demonstrate that the normalization of serum calcium during
      follow-up does not necessarily exclude the diagnosis.
    explanation: Supports the variable course recorded in the description.
- category: Biochemical
  name: Hypocalciuria
  description: >-
    Low urinary calcium excretion relative to serum calcium, usually expressed as a
    calcium/creatinine clearance ratio below 0.01. It may be the only abnormality
    in some heterozygous carriers.
  phenotype_term:
    preferred_term: Hypocalciuria
    term:
      id: HP:0003127
      label: Hypocalciuria
  evidence:
  - reference: PMID:42787214
    reference_title: "Case report: A Newly Identified G-protein Subunit α-11 Loss-of-Function Variant Causing Familial Hypocalciuric Hypercalcemia Type 2 in an Italian Kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: mild hypercalcemia with normal PTH levels and low urinary calcium excretion

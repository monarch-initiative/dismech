- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single loss-of-function GNA11 allele is sufficient in the reported kindreds.
    One reported proband was homozygous for a GNA11 missense variant while both
    heterozygous parents were normocalcaemic but hypocalciuric, so the
    heterozygous state may be expressed as hypocalciuria alone; this rests on a
    single family (see discussions).
  evidence:
  - reference: PMID:28833550
    reference_title: "Cinacalcet Rectifies Hypercalcemia in a Patient With Familial Hypocalciuric Hypercalcemia Type 2 (FHH2) Caused by a Germline Loss-of-Function Gα(11) Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Heterozygous germline loss-of-function Gα11 mutations cause familial hypocalciuric
      hypercalcemia type 2 (FHH2)
    explanation: States that a single germline loss-of-function allele causes FHH2.
    quote_role: BACKGROUND
  - reference: PMID:41240382
    reference_title: "A novel homozygous c.301T > C, p.Y101H variant in the GNA11 gene is implicated in familial hypocalciuric hypercalcemia type 2 in a proband with the heterozygous variant present in mother and father - A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hypocalciuria without hypercalcemia can be detected in cases heterozygous
      for the GNA11 gene mutation.
    explanation: Reports that heterozygous carriers in this family expressed hypocalciuria
      without hypercalcaemia, qualifying the dominant expression.
pathophysiology:
- name: Heterozygous GNA11 Loss-of-Function Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A germline missense, in-frame deletion or frameshift variant in GNA11 that
    reduces the ability of G-alpha-11 to transmit CaSR activation to
    phospholipase C. Reported alleles include Leu135Gln, Ile200del, Thr54Met,
    Phe220Ser, Thr347Ala, the frameshifts His327LeufsTer150 and Ser18ArgfsTer2,
    and a whole-gene deletion. Structural work
    places the defects at the interface between the helical and GTPase domains
    (Thr54Met) and in the hydrophobic cleft that binds phospholipase C
    (Phe220Ser).
  genetic_context:
    gene:
      preferred_term: GNA11
      term:
        id: hgnc:4379
        label: GNA11
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: G-alpha-11 activation of phospholipase C
    modifier: DECREASED
    term:
      id: GO:0016004
      label: phospholipase activator activity
  evidence:
  - reference: PMID:28833550
    reference_title: "Cinacalcet Rectifies Hypercalcemia in a Patient With Familial Hypocalciuric Hypercalcemia Type 2 (FHH2) Caused by a Germline Loss-of-Function Gα(11) Mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In vitro studies involving transient transfection of WT and mutant Gα11
      proteins into HEK293 cells, which express the CaSR, showed the mutant Ser220
      Gα11 protein to impair CaSR-mediated Ca2+i and extracellular signal-regulated
      kinase 1/2 (ERK) MAPK signaling, consistent with diminished activation of PLC.
    explanation: Functional demonstration that an FHH2 allele reduces phospholipase
      C activation downstream of the CaSR.
  - reference: PMID:26729423
    reference_title: "A G-protein Subunit-α11 Loss-of-Function Mutation, Thr54Met, Causes Familial Hypocalciuric Hypercalcemia Type 2 (FHH2)."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Three-dimensional modeling revealed the Thr54Met mutation to be located
      at the interface between the Gα11 helical and GTPase domains, and to likely
      impair GDP binding and interdomain interactions.
    explanation: Structural modelling locating a second FHH2 allele at a domain interface
      needed for G-protein function.
  - reference: PMID:42787214
    reference_title: "Case report: A Newly Identified G-protein Subunit α-11 Loss-of-Function Variant Causing Familial Hypocalciuric Hypercalcemia Type 2 in an Italian Kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genetic testing identified a novel heterozygous germline frameshift variant
      in GNA11 (c.980_981del, p.His327LeufsTer150) in the proband, his mother, and
      his 15-month-old normocalcemic daughter.
    explanation: Adds a truncating-type (frameshift) allele to the FHH2 spectrum.
  downstream:
  - target: Reduced CaSR-Coupled Phospholipase C Signaling
    causal_link_type: DIRECT
    description: Weaker G-alpha-11 activity means less phospholipase C activation for
      a given degree of receptor occupancy.
  - target: Disrupted Enamel Mineralization
    causal_link_type: DIRECT
    description: >-
      Recently reported association; whether the enamel defect reflects G-alpha-11
      loss in ameloblasts or the systemic calcium disturbance is not established.
- name: Disrupted Enamel Mineralization
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Patchy hypomineralisation of primary and permanent enamel, reported in two
    families carrying a whole-gene GNA11 deletion or an early frameshift. Gna11 and
    G-alpha-11 are expressed in mouse ameloblasts and odontoblasts, and
    heterozygous Gna11 mice have delayed and reduced enamel mineralisation, which
    suggests a direct role for G-alpha-11 in tooth formation. Whether the
    missense alleles behind most FHH2 kindreds produce the same defect is unknown.
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: enamel mineralization
    modifier: DECREASED
    term:
      id: GO:0070166
      label: enamel mineralization
  evidence:
  - reference: PMID:42670332
    reference_title: "Abnormal Enamel Mineralization and Hypercalcemia due to GNA11 Variants."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the study of wild-type mouse tooth germs using combined molecular and protein
      analyses showed Gna11 and Gα11 protein expression in ameloblasts at the secretion
      and maturation stages, as well as in odontoblasts, suggesting a role for Gα11
      in tooth formation
    explanation: Places G-alpha-11 in the enamel-forming cells.
  - reference: PMID:42670332
    reference_title: "Abnormal Enamel Mineralization and Hypercalcemia due to GNA11 Variants."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the analysis of a mouse model of Familial Hypocalciuric Hypercalcemia 2
      (FHH2) revealed delayed onset of enamel mineralization in the continuously growing
      incisors and hypomineralized enamel in both incisor and molars of heterozygous
      (Gna11Tm1b+/-) mice
    explanation: Heterozygous Gna11 loss reduces enamel mineralisation in mice.
  downstream:
  - target: Enamel Hypomineralization
    causal_link_type: DIRECT
    description: The clinical finding produced by the defective mineralisation.
- name: Reduced CaSR-Coupled Phospholipase C Signaling
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Cells expressing the CaSR together with an FHH2 G-alpha-11 mutant need a
    higher extracellular calcium concentration to reach a half-maximal
    intracellular calcium or IP1 response; the concentration-response curve is
    shifted to the right, with no change in receptor surface expression.
  biological_processes:
  - preferred_term: CaSR-Gq/11-phospholipase C signaling
    modifier: DECREASED
    term:
      id: GO:0007200
      label: phospholipase C-activating G protein-coupled receptor signaling pathway
  evidence:
  - reference: PMID:23802516
    reference_title: "Mutations affecting G-protein subunit α11 in hypercalcemia and hypocalcemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: assessment on the basis of in vitro expression showed that familial hypocalciuric
      hypercalcemia type 2-associated mutations decreased the sensitivity of cells
      expressing calcium-sensing receptors to changes in extracellular calcium concentrations
    explanation: The founding functional result for FHH2 alleles - reduced cellular
      sensitivity to extracellular calcium.
  - reference: PMID:26729423
    reference_title: "A G-protein Subunit-α11 Loss-of-Function Mutation, Thr54Met, Causes Familial Hypocalciuric Hypercalcemia Type 2 (FHH2)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the Ca(2+) i responses after stimulation with Ca(2+) o of the mutant Met54
      Gα11 led to a rightward shift of the concentration-response curve
    explanation: Shows the rightward shift of the calcium concentration-response curve
      for a second allele.
  - reference: PMID:38920275
    reference_title: "Loss-of-function Thr347Ala Variant in the G Protein Subunit-Α11 Causes Familial Hypocalciuric Hypercalcemia 2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Whereas the variant did not impact Gα11 expression or CaSR cell surface
      expression levels, calcium displayed a moderately but significantly lower agonist
      potency at CaSR/Gα11-Thr347Ala-transfected cells compared with CaSR/Gα11-WT-transfected
      cells in the IP1 accumulation assay
    explanation: Shows reduced calcium potency at the receptor with unchanged receptor
      and G-protein expression, locating the defect in signal transduction.
  downstream:
  - target: Raised Extracellular Calcium Set Point
    causal_link_type: DIRECT
    description: Reduced cellular sensitivity to calcium translates, across the
      homeostatic loop, into regulation toward a higher serum calcium.
- name: Raised Extracellular Calcium Set Point
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The set point is the serum calcium concentration at which PTH secretion is
    half-maximal. Raising it is the single statement from which both the
    parathyroid and the renal features follow.
  evidence:
  - reference: PMID:35566721
    reference_title: "Disorders of the Calcium Sensing Signaling Pathway: From Familial Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: LOF of CaSR (in FHH1) or its downstream partner signaling proteins (in
      FHH2 and FHH3) result in an elevation of the body’s calcium set point, defined
      as the serum calcium concentration at which PTH secretion is half-maximal.
    explanation: States that loss of function of the downstream partner in FHH2 raises
      the calcium set point.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Non-Suppressed Parathyroid Hormone Secretion
    causal_link_type: DIRECT
    description: The parathyroid limb.
  - target: Increased Renal Tubular Calcium Reabsorption
    causal_link_type: DIRECT
    description: The renal limb, a direct action of the pathway in the kidney rather
      than a consequence of PTH.
- name: Non-Suppressed Parathyroid Hormone Secretion
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Parathyroid chief cells continue to secrete PTH at calcium concentrations that
    should suppress it. The glands are responding to an under-reported calcium
    level rather than acting autonomously.
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  biological_processes:
  - preferred_term: parathyroid hormone secretion
    modifier: INCREASED
    term:
      id: GO:0035898
      label: parathyroid hormone secretion
  evidence:
  - reference: PMID:28833550
    reference_title: "Cinacalcet Rectifies Hypercalcemia in a Patient With Familial Hypocalciuric Hypercalcemia Type 2 (FHH2) Caused by a Germline Loss-of-Function Gα(11) Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: G-protein subunit α-11 (Gα11 ) couples the calcium-sensing receptor (CaSR)
      to phospholipase C (PLC)-mediated intracellular calcium (Ca2+i ) and mitogen-activated
      protein kinase (MAPK) signaling, which in the parathyroid glands and kidneys regulates
      parathyroid hormone release and urinary calcium excretion, respectively.
    explanation: Places the G-alpha-11 pathway in control of PTH release in the parathyroid.
    quote_role: BACKGROUND
  - reference: PMID:29046478
    reference_title: "Cinacalcet corrects hypercalcemia in mice with an inactivating Gα11 mutation."

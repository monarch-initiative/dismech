    model_scale: ORGANISM
    description: Hypercalcaemia with non-suppressed PTH in mice carrying a loss-of-function
      Gna11 allele.
    limitations: >-
      Urinary calcium is normal rather than low in the mice, so the hypocalciuric
      element is reproduced only relative to the raised serum calcium. Asp195Gly

  evidence:
  - reference: PMID:27329244
    reference_title: "RNF43 germline and somatic mutation in serrated neoplasia pathway and its association with BRAF mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      as well as coincidental BRAF mutation in 62.5% of the serrated polyps
    explanation: >-
      Measured frequency of somatic BRAF mutation in the serrated polyps of the

    explanation: >-
      Background statement that BRAF or KRAS mutation is an early somatic event
      in sessile serrated adenomas generally.
  downstream:
  - target: Serrated Colorectal Polyps
    description: >-
      Somatic BRAF activation cooperates with RNF43 loss in serrated polyp
      formation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
phenotypes:
- category: Gastrointestinal
  name: Serrated Colorectal Polyps
  description: >-
    Multiple serrated colorectal polyps (sessile serrated lesions, traditional
    serrated adenomas, hyperplastic polyps), often large and proximal, in the
    reported kindreds. Not every carrier develops them.
  phenotype_term:
    preferred_term: Serrated colorectal polyps
    term:
      id: HP:0032222
      label: Serrated intestinal polyps
  evidence:
  - reference: PMID:27081527
    reference_title: "A deleterious RNF43 germline mutation in a severely affected serrated polyposis kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband developed microsatellite instability (MSI)– CRC age 23 years
      arising from a serrated polyp, in the setting of multiple (>50) large
      serrated polyps throughout the colon
    explanation: >-
      More than 50 large serrated polyps in a germline RNF43 carrier.
  - reference: PMID:39546056
    reference_title: "Germline pathogenic variants in RNF43 in patients with and without serrated polyposis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Colonoscopies in the probands of these families did not reveal any
      serrated polyps and/or CRC despite some of them being relatively old.
    explanation: >-
      Shows the phenotype is absent in some carriers, so no frequency is
      recorded.
  sequelae:
  - target: Colorectal Carcinoma
    description: >-
      Serrated polyps progress to carcinoma along the serrated neoplasia
      pathway.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- category: Neoplastic
  name: Colorectal Carcinoma
  description: >-
    Colorectal cancer, which can be early-onset in the reported kindreds (one
    proband at age 23). Population data show only a moderate overall risk
    increase, concentrated in N-terminal variants, and some carriers' cancers
    develop without contribution from the germline variant.
  phenotype_term:
    preferred_term: Colorectal cancer
    term:
      id: HP:0003003
      label: Colon cancer
  evidence:
  - reference: PMID:27081527
    reference_title: "A deleterious RNF43 germline mutation in a severely affected serrated polyposis kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband developed microsatellite instability (MSI)– CRC age 23 years
      arising from a serrated polyp, in the setting of multiple (>50) large
      serrated polyps throughout the colon
    explanation: >-
      Early-onset colorectal cancer arising from a serrated polyp in a germline
      RNF43 carrier.
  - reference: PMID:41443981
    reference_title: "Comparison between germline and somatic loss-of-function RNF43 mutations reveals different genotype-phenotype associations and provides insights into the genetic mechanisms of colorectal tumourigenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RNF43 is a CRC predisposition gene, but risks are moderate, the reported
      polyposis phenotype is often absent and molecular phenocopies can occur.
    explanation: >-
      Supports colorectal cancer as a phenotype while bounding the risk as
      moderate.

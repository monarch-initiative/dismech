    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      Primary MONDO identifier. MONDO defines this term by germline RNF43 variants
      (OMIM:617108 cross-reference) and places it as a child of the clinically defined
      hyperplastic polyposis syndrome.
  - term:
      id: MONDO:0015524
      label: hyperplastic polyposis syndrome
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO parent term for the clinically defined serrated polyposis syndrome (WHO
      endoscopic criteria, any or no germline cause). This entry covers only the
      RNF43-defined child; the clinical syndrome is broader and remains uncurated, so
      the mapping is broadMatch and does not retire the parent from the curation queue.
synonyms:
- SSPCS
- RNF43-associated serrated polyposis
- RNF43-related serrated polyposis
description: >-
  Sessile serrated polyposis cancer syndrome (SSPCS) is the germline,
  RNF43-defined form of serrated polyposis: an autosomal dominant predisposition
  to multiple serrated colorectal polyps and colorectal cancer caused by
  heterozygous loss-of-function variants in RNF43, a transmembrane E3 ubiquitin
  ligase that restrains Wnt signalling by ubiquitinating Frizzled receptors and
  targeting them for degradation. ClinGen classifies the RNF43-SSPCS relationship
  as Definitive (autosomal dominant). This entry is deliberately narrower than
  the clinical serrated polyposis syndrome (SPS), which is defined by WHO
  endoscopic criteria regardless of cause; RNF43 explains only a small minority of
  clinically defined SPS (0 to about 2% of tested cohorts in the series cited
  here), and the clinical syndrome is linked to smoking and other non-Mendelian
  factors. Conversely, population-based sequencing shows that many germline RNF43
  carriers have neither polyposis nor a notable family history, that colorectal
  cancer risk is moderate overall, and that risk is concentrated in N-terminal
  truncating variants. Mechanistically the entry is a germline two-hit
  predisposition: the polyps of carriers show second-hit RNF43 inactivation and
  frequent somatic BRAF mutation, placing them on the serrated neoplasia pathway.
  The somatic serrated-pathway colorectal cancers this syndrome predisposes to
  (for example BRAF V600E-mutant, CIMP-high colorectal cancer) are curated as
  separate entries and are not merged here.
notes: >-
  Lump/split. MONDO splits the RNF43-defined term (MONDO:0014919, OMIM:617108)
  from the clinically defined hyperplastic polyposis syndrome (MONDO:0015524,
  ORPHA:157798). This entry follows that split and curates the gene-defined
  child only. Clinical SPS without an RNF43 variant is not described by this
  entry's pathophysiology, and an RNF43 carrier who does not meet WHO criteria is
  still within this entry's genotype definition but may have no polyposis at all
  (see the discussions). The serrated pathway's somatic events (BRAF activation,
  CIMP, MLH1 promoter methylation) belong to the tumor entries such as
  BRAF_V600E_Mutant_Colorectal_Cancer; only the somatic BRAF mutation observed
  in carriers' polyps is recorded here, because it was measured in germline
  carriers.
inheritance:
- name: Autosomal dominant with incomplete penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Heterozygous germline RNF43 loss-of-function variants cosegregate with
    serrated polyposis in an autosomal dominant pattern in the reported kindreds.
    Penetrance is incomplete and probably lower than the family-based literature
    implied: carriers ascertained outside polyposis families often lack polyps,
    and colorectal cancer risk depends on where the truncation falls in the
    protein. No numeric penetrance estimate is recorded because none of the
    cited sources provides one.
  evidence:
  - reference: PMID:27329244
    reference_title: "RNF43 germline and somatic mutation in serrated neoplasia pathway and its association with BRAF mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In one out of four serrated polyposis families, we identified a germline
      RNF43 mutation that displayed autosomal dominant cosegregation with the
      serrated polyposis phenotype
    explanation: >-
      Family study showing dominant cosegregation of a germline RNF43 variant
      with serrated polyposis.
  - reference: CGGV:assertion_9abf2a1d-21a7-4ef7-99c7-b0b37d5acf38-2022-12-30T180000.000Z
    reference_title: "RNF43 / sessile serrated polyposis cancer syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "RNF43 | HGNC:18505 | sessile serrated polyposis cancer syndrome | MONDO:0014919 | AD | Definitive"
    explanation: >-
      ClinGen records the mode of inheritance for this gene-disease pair as
      autosomal dominant.
  - reference: PMID:39546056
    reference_title: "Germline pathogenic variants in RNF43 in patients with and without serrated polyposis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that the penetrance of RNF43-related disease is much
      lower than previously thought, and raise questions about the connection
      between RNF43 and disease.
    explanation: >-
      Four Danish families with likely pathogenic RNF43 variants, three without
      serrated polyps or colorectal cancer, support incomplete penetrance.
  - reference: PMID:41443981
    reference_title: "Comparison between germline and somatic loss-of-function RNF43 mutations reveals different genotype-phenotype associations and provides insights into the genetic mechanisms of colorectal tumourigenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In case-control analyses, germline RNF43 variants were associated with CRC
      risk (OR=2.696, p=0.010), but penetrance was much greater for germline
      mutations in the N-terminal half of the gene.
    explanation: >-
      Large case-control analysis (CORGI, 100,000 Genomes, UK Biobank) showing a
      moderate overall colorectal cancer risk and position-dependent penetrance.
pathophysiology:
- name: Germline Heterozygous RNF43 Loss of Function
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >-
    A heterozygous germline truncating (nonsense, frameshift) or other
    loss-of-function RNF43 variant is present in every cell and constitutes the
    first hit. RNF43 encodes a transmembrane RING-type E3 ubiquitin ligase, so
    the constitutional defect is a halving of a negative regulator of Wnt
    receptor abundance. ClinGen records heterozygous loss of function as the
    reported mechanism.
  role: trigger

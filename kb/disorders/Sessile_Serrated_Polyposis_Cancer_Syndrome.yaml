      snippet: "RNF43 | HGNC:18505 | sessile serrated polyposis cancer syndrome | MONDO:0014919 | AD | Definitive"
      explanation: ClinGen gene-disease validity record classifying this pair as Definitive (AD).
  notes: >-
    The Definitive classification is for the RNF43-defined MONDO term, not for
    clinical serrated polyposis syndrome as a whole. Position matters: in
    population data N-terminal germline truncations raised colorectal cancer risk
    while C-terminal truncations showed no increased risk, so a C-terminal
    variant should not be read as conferring the risks of the reported kindreds.
  evidence:
  - reference: PMID:41443981
    reference_title: "Comparison between germline and somatic loss-of-function RNF43 mutations reveals different genotype-phenotype associations and provides insights into the genetic mechanisms of colorectal tumourigenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline C-terminal mutations conferred no increased CRC risk."
    explanation: >-
      Genotype-phenotype result: risk is confined to N-terminal variants in this
      case-control analysis.
  - reference: PMID:41443981
    reference_title: "Comparison between germline and somatic loss-of-function RNF43 mutations reveals different genotype-phenotype associations and provides insights into the genetic mechanisms of colorectal tumourigenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, while 23 CRC/polyp cases and 47 controls from 100kGP or UKB had
      germline RNF43 mutations, cases often lacked multiple polyps or a notable
      family history.
    explanation: >-
      Germline RNF43 variants occur in unselected controls and in cases without
      polyposis, so carriage alone does not establish the syndrome.
diagnosis:
- name: Clinical diagnosis of serrated polyposis by WHO 2019 criteria
  description: >-
    The clinical syndrome is diagnosed endoscopically by cumulative serrated
    polyp count, size and location under the WHO 2019 criteria (at least 5
    serrated lesions proximal to the rectum, all at least 5 mm and at least 2 of
    10 mm or more; or more than 20 serrated lesions throughout the colon with at
    least 5 proximal to the rectum). These criteria define clinical SPS, not
    this RNF43-defined entry: a carrier may not meet them.
  diagnosis_term:
    preferred_term: colonoscopy
    term:
      id: NCIT:C16450
      label: Colonoscopy
  evidence:
  - reference: PMID:41002021
    reference_title: "Low Yield of Genetic Testing in Serrated Polyposis Syndrome."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (i) ≥5 serrated lesions/polyps proximal to the rectum all being ≥5 mm in
      size, with ≥2 being ≥10 mm in size or (ii) >20 serrated lesions/polyps of
      any size distributed throughout the large bowel, with ≥5 being proximal to
      the rectum
    explanation: >-
      States the WHO 2019 diagnostic criteria in the paper's introduction.
  - reference: PMID:35988960
    reference_title: "Serrated polyposis syndrome; epidemiology and management."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Both epigenetic and environmental factors, especially smoking, have been
      related to this syndrome, but the etiology of SPS remains uncertain and
      diagnosis is based on endoscopic criteria.
    explanation: >-
      Review stating that SPS diagnosis rests on endoscopic criteria and that
      non-genetic factors contribute.
- name: Germline multigene panel testing including RNF43
  description: >-
    Germline testing of a multigene colorectal cancer and polyposis panel that
    includes RNF43 identifies this entry. The yield of an RNF43 variant in
    clinically defined SPS is low: 1 of 139 panel-tested patients in a UK
    registry, 1 of 73 tested patients in a second UK series, and none of 26 in a
    Dutch cohort. Panel testing in SPS also detects other syndromes, notably Lynch
    syndrome and MUTYH-associated polyposis.
  diagnosis_term:
    preferred_term: germline genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:41002021
    reference_title: "Low Yield of Genetic Testing in Serrated Polyposis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On multigene panel testing, pathogenic germline variants were found in 4
      patients (2.9%), including 3 with Lynch syndrome (2 with PMS2 , one with
      MSH2 ) and one with an RNF43 variant.
    explanation: >-
      One RNF43 variant among 139 panel-tested WHO-criteria SPS patients at St
      Mark's Hospital.
  - reference: PMID:35128723
    reference_title: "Germline variant testing in serrated polyposis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventy-three patients underwent genetic testing and 15/73 (20.5%) were
      found to have germline variants, of which 7/73 (9.6%) had a pathogenic
      variant (MUTYH n = 2, SMAD4 n = 1, CHEK2 n = 2, POLD1 n = 1, and RNF43 n
      = 1).
    explanation: >-
      One RNF43 pathogenic variant among 73 tested SPS patients in Oxford.
  - reference: PMID:33098683
    reference_title: "RNF43 mutation analysis in serrated polyposis, sporadic serrated polyps and Lynch syndrome polyps."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No germline RNF43 pathogenic variants were detected in our SPS cohort."
    explanation: >-
      No RNF43 pathogenic variants in 26 SPS patients sequenced for all RNF43
      exons.
treatments:
- name: Colonoscopic Surveillance with Polypectomy
  description: >-
    Regular colonoscopy with removal of serrated and adenomatous polyps. The
    surveillance data come from clinically defined SPS cohorts, not from RNF43
    carriers specifically. In those cohorts advanced neoplasia is common during
    surveillance while colorectal cancer incidence is low, and a randomized
    trial could not show that a 3-year interval is non-inferior to a 2-year
    interval. For RNF43 carriers, the source recommends individually tailored
    colonoscopy taking account of variant position and polyp history.
  treatment_term:
    preferred_term: colonoscopic polypectomy
    term:
      id: NCIT:C51688
      label: Colonoscopic Polypectomy
  target_mechanisms:
  - target: Serrated Colorectal Polyps
    treatment_effect: INHIBITS
    description: >-
      Removes polyps before they progress; does not correct the germline
      defect.
  evidence:
  - reference: PMID:30068004
    reference_title: "High incidence of advanced colorectal neoplasia during endoscopic surveillance in serrated polyposis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with SPS have a substantial risk of developing advanced neoplasia
      under endoscopic surveillance, whereas CRC incidence is low.
    explanation: >-
      Multicentre SPS surveillance cohort (not genotyped for RNF43) supporting
      surveillance with polyp removal.
  - reference: PMID:42012787
    reference_title: "Endoscopic Surveillance in Serrated Polyposis Syndrome, Two or Three-Year Intervals: A Non-inferiority Randomized Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with serrated polyposis syndrome, extending colonoscopy
      surveillance to a three-year compared with a two-year interval yielded
      inconclusive evidence regarding non-inferiority for advanced neoplasia
      incidence.
    explanation: >-
      Randomized trial in WHO-criteria SPS; the surveillance interval is not
      settled.
  - reference: PMID:41443981
    reference_title: "Comparison between germline and somatic loss-of-function RNF43 mutations reveals different genotype-phenotype associations and provides insights into the genetic mechanisms of colorectal tumourigenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data do, however, suggest that once a germline RNF43 variant has been
      identified, a pragmatic screening approach is required, for example
      managing patients individually by regular colonoscopy, tailored to the
      position of the germline variant, polyp formation and progression over
      time.
    explanation: >-
      RNF43-specific management suggestion from the authors of the largest
      carrier study.
- name: Colectomy for Unmanageable Polyp Burden or Cancer
  description: >-
    (Sub)total colectomy is used when polyp burden cannot be controlled
    endoscopically or cancer develops; endoscopic surveillance of the remaining
    rectum or sigmoid continues afterwards. Data are from clinically defined SPS,
    not RNF43 carriers specifically.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: colectomy
    term:
      id: NCIT:C15209
      label: Colectomy
  target_mechanisms:
  - target: Colorectal Carcinoma
    treatment_effect: INHIBITS
    description: Removes the at-risk colon.
  evidence:
  - reference: PMID:31403493
    reference_title: "Low Incidence of Advanced Neoplasia in Serrated Polyposis Syndrome After (Sub)total Colectomy: Results of a 5-Year International Prospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(Sub)total colectomy mitigates much of the excess risk of CRC in patients with SPS."
    explanation: >-
      Prospective cohort of 48 SPS patients after colectomy with no colorectal
      cancer during follow-up.
  - reference: PMID:30068004
    reference_title: "High incidence of advanced colorectal neoplasia during endoscopic surveillance in serrated polyposis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After total colectomy, 17.9 % patients developed advanced neoplasia in the retained rectum."
    explanation: >-
      Supports continued rectal surveillance after colectomy.
- name: Genetic Counseling and Cascade Testing
  description: >-
    Genetic counseling for individuals with SPS and their relatives, and
    cascade testing of relatives once an RNF43 variant is found. Because
    penetrance is incomplete, counseling of carriers without polyposis is
    difficult and the value of predictive testing in healthy relatives is not
    settled.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31673925
    reference_title: "Hereditary or Not? Understanding Serrated Polyposis Syndrome."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Referral for genetic counseling and testing is recommended for
      individuals with serrated polyposis syndrome and a personal history of
      coexisting adenomatous polyposis or with a concerning family history and
      can be considered for all individuals with serrated polyposis syndrome.
    explanation: Review recommendation on when to refer for genetic counseling.
  - reference: PMID:39546056
    reference_title: "Germline pathogenic variants in RNF43 in patients with and without serrated polyposis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This highlights the complexity of genetic counseling in RNF43 positive
      families, and whether healthy relatives should be offered predictive
      testing.
    explanation: >-
      Danish family series raising the unresolved question of predictive
      testing in relatives.
discussions:
- discussion_id: rnf43_yield_in_clinical_sps
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#Sessile Serrated Polyposis Cancer Syndrome
  - genetic#RNF43
  prompt: >-
    How much of clinically defined serrated polyposis syndrome does germline
    RNF43 explain, and is the RNF43-defined entity a subtype of SPS or a
    separate predisposition that sometimes presents as SPS?
  rationale: >-
    MONDO places the RNF43-defined term under the clinical syndrome, but cohort
    yields of RNF43 in WHO-criteria SPS are low (none of 26 in a Dutch cohort, 1
    of 73 and 1 of 139 in two UK series, 5 of 304 in a multinational study cited
    as background), and a review puts all identifiable germline causes below 3%.
    In the other direction, population carriers often lack polyposis. The
    overlap between the two concepts is therefore partial in both directions,
    which is why this entry follows the MONDO split rather than lumping clinical
    SPS into it. Whether the residual clinical SPS has an undiscovered
    Mendelian cause, a polygenic or environmental basis (smoking is
    associated), or both, is open.
  evidence:
  - reference: PMID:33098683
    reference_title: "RNF43 mutation analysis in serrated polyposis, sporadic serrated polyps and Lynch syndrome polyps."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a large multinational cohort found five of 304 (1.6%) tested SPS patients
      with probably pathogenic RNF43 variants.
    explanation: >-
      Background citation of a multinational yield. The primary letters this
      sentence cites have no abstract in the reference cache, so the figure
      could not be checked against them; one of them (Buchanan et al., Gut 2017)
      is titled as reporting a lack of evidence for germline RNF43 variants in
      SPS, which shows how contested the yield is.
  - reference: PMID:31673925
    reference_title: "Hereditary or Not? Understanding Serrated Polyposis Syndrome."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      However, less than 3% of serrated polyposis syndrome cases are explained
      by identifiable germline mutations, with mutations in RNF43 being the only
      currently validated genetic cause.
    explanation: Review estimate of the germline-explained fraction of SPS.
  - reference: PMID:35988960
    reference_title: "Serrated polyposis syndrome; epidemiology and management."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Besides a small proportion of cases caused by germline mutations in RNF43,
      no clear genetic cause has been identified.
    explanation: Review stating that RNF43 explains only a small proportion of SPS.
- discussion_id: rnf43_penetrance_and_surveillance_start
  kind: KNOWLEDGE_GAP
  attaches_to:
  - inheritance#Autosomal dominant with incomplete penetrance
  - treatments#Colonoscopic Surveillance with Polypectomy
  prompt: >-
    What is the age-specific penetrance of germline RNF43 variants by variant
    position, and at what age should surveillance of an asymptomatic carrier
    (including a carrier identified as a child through cascade testing) begin?
  rationale: >-
    The family-based literature suggested a high-risk dominant syndrome, with
    colorectal cancer as early as age 23, but population sequencing shows a
    moderate overall risk concentrated in N-terminal variants, and Danish
    families include older carriers with normal colonoscopy. None of the sources
    cited in this entry gives an age to start colonoscopy in RNF43 carriers or
    addresses predictive testing of minors; the surveillance data come from
    adults with clinical SPS. This matters for pediatric cascade testing,
    because the case for testing a child depends on a surveillance action
    taken in childhood or early adulthood.
  evidence:
  - reference: PMID:41443981
    reference_title: "Comparison between germline and somatic loss-of-function RNF43 mutations reveals different genotype-phenotype associations and provides insights into the genetic mechanisms of colorectal tumourigenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In case-control analyses, germline RNF43 variants were associated with CRC
      risk (OR=2.696, p=0.010), but penetrance was much greater for germline
      mutations in the N-terminal half of the gene.
    explanation: Position-dependent risk without age-specific penetrance.
  - reference: PMID:39546056
    reference_title: "Germline pathogenic variants in RNF43 in patients with and without serrated polyposis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This highlights the complexity of genetic counseling in RNF43 positive
      families, and whether healthy relatives should be offered predictive
      testing.
    explanation: States that predictive testing of healthy relatives is unresolved.

- name: Somatic Second-Hit Inactivation of RNF43 in Colorectal Polyps
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  description: >-
    In the one germline-carrier family studied at the lesion level, all 16
    serrated polyps, 5 adenomas and 1 cancer examined showed second-hit
    inactivation of RNF43 by loss of heterozygosity or a somatic mutation. The
    second hit has not been examined in most other reported kindreds (the
    Australian kindred report states it was not determined), so its generality is
    inferred from this one family and from RNF43's tumour-suppressor behaviour in
    sporadic tumours.

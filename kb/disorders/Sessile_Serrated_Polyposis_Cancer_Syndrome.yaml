    causal_link_type: DIRECT
- name: Impaired Frizzled Ubiquitination and Wnt Receptor Turnover
  description: >-
    RNF43 and its homologue ZNRF3 ubiquitinate Frizzled receptors and route them
    to lysosomal degradation, keeping Wnt receptor levels low. Without RNF43,
    Frizzled receptors persist at the cell surface. This node is supported by
    cell-line and mouse work rather than by measurements in carriers' tissue.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Frizzled receptor degradation
    term:
      id: GO:0038018
      label: Wnt receptor catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:22895187
    reference_title: "Tumour suppressor RNF43 is a stem-cell E3 ligase that induces endocytosis of Wnt receptors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the HEK293T human cancer cell line, expression of RNF43 blocks Wnt
      responses and targets surface-expressed frizzled receptors to lysosomes.
    explanation: >-
      Cell-line evidence that RNF43 drives Frizzled receptor removal, the
      activity lost in this disease.
  - reference: PMID:22895187
    reference_title: "Tumour suppressor RNF43 is a stem-cell E3 ligase that induces endocytosis of Wnt receptors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We conclude that RNF43 and ZNRF3 reduce Wnt signals by selectively
      ubiquitinating frizzled receptors, thereby targeting these Wnt receptors
      for degradation.
    explanation: >-
      The authors' mechanistic conclusion: RNF43 ubiquitinates Frizzled for
      degradation.
  downstream:
  - target: Increased Wnt Signalling with Reduced R-spondin Dependence
    description: >-
      Persisting Frizzled receptors raise Wnt responsiveness of the epithelium.
    causal_link_type: DIRECT
- name: Increased Wnt Signalling with Reduced R-spondin Dependence
  description: >-
    Loss of RNF43 raises canonical Wnt signalling in intestinal stem cells and
    makes epithelial growth less dependent on the Wnt agonist R-spondin.
    Combined deletion of Rnf43 and Znrf3 in mouse intestinal epithelium produces
    adenomas rich in LGR5+ stem cells, and RNF43-mutant human serrated adenoma
    organoids and edited mouse colon organoids grow with less R-spondin1. How
    this Wnt gain leads specifically to serrated rather than conventional
    adenomatous morphology in human carriers is not established.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: LGR5+ intestinal crypt stem cell
    term:
      id: CL:0002250
      label: intestinal crypt stem cell
  biological_processes:
  - preferred_term: canonical Wnt signaling
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:22895187
    reference_title: "Tumour suppressor RNF43 is a stem-cell E3 ligase that induces endocytosis of Wnt receptors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we find that the related RNF43 and ZNRF3 transmembrane E3 ubiquitin
      ligases are uniquely expressed in LGR5+ stem cells.
    explanation: >-
      Places RNF43 in the intestinal crypt stem cell, the cell type bound on this
      node (mouse data).
  - reference: PMID:22895187
    reference_title: "Tumour suppressor RNF43 is a stem-cell E3 ligase that induces endocytosis of Wnt receptors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Simultaneous deletion of the two genes encoding these proteins in the
      intestinal epithelium of mice induces rapidly growing adenomas containing
      high numbers of Paneth and LGR5+ stem cells.
    explanation: >-
      In vivo consequence of losing RNF43 and ZNRF3 together in intestinal
      epithelium. It is a double-knockout, so it overstates the effect of RNF43
      loss alone.
  - reference: PMID:27329244
    reference_title: "RNF43 germline and somatic mutation in serrated neoplasia pathway and its association with BRAF mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functionally, organoid culture of serrated adenoma or mouse colon with
      CRISPR-induced RNF43 mutations had reduced dependency on R-spondin1.
    explanation: >-
      Organoid evidence that RNF43 loss lowers dependence on the Wnt agonist
      R-spondin1.
  downstream:
  - target: Serrated Colorectal Polyps
    description: >-
      Wnt gain in RNF43-null crypts contributes to serrated polyp formation; the
      intermediate steps in human colon are not defined.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Somatic BRAF Activation in Carrier Polyps
  description: >-
    In the germline RNF43 carrier family studied at the lesion level, 62.5% of
    serrated polyps also carried a somatic BRAF mutation, consistent with the
    serrated neoplasia pathway in which BRAF (or less often KRAS) mutation is an
    early somatic event. BRAF activation is recorded here as a cooperating
    somatic event in carriers' polyps, not as part of the germline mechanism.
    The downstream serrated-pathway tumour biology (CIMP, MLH1 promoter
    methylation, BRAF V600E-mutant carcinoma) is curated in the somatic tumour
    entries.
  role: modifier
  biological_scale: MOLECULAR
  gene:
    preferred_term: BRAF
    modifier: INCREASED
    term:
      id: hgnc:1097
      label: BRAF
  genetic_context:

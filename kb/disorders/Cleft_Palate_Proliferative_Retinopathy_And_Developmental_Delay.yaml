    reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One year later, on follow up examination, a new large vitreoretinal
      traction on the peripheral retinal region of the left eye was seen
    explanation: >-
      Demonstrates that a new sight-threatening lesion appeared between
      examinations, which is the case for continued surveillance.

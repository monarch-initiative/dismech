- name: Vitreoretinopathy
  category: Ocular
  description: >-
    A childhood-onset, progressive proliferative vitreoretinopathy. Reported
    findings include a thickened vitreous firmly adherent to the peripheral
    retina with traction, secondary retinal tears, a persistent hyaloid remnant
    at the disc, and straightened retinal vessels. In the fourth patient the
    progressive course and peripheral location were what excluded retinopathy of
    prematurity, for which he also had risk factors.
  phenotype_term:
    preferred_term: Progressive proliferative vitreoretinopathy
    term:
      id: HP:0007773
      label: Vitreoretinopathy
  evidence:
  - reference: PMID:35656379
    reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, the ophthalmological findings are consistent with early

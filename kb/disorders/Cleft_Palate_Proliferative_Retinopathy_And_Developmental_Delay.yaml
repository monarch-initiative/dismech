pathophysiology:
- name: GARP Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic LRRC32 variants remove or destabilise GARP, a type I transmembrane
    leucine-rich-repeat protein whose large ectodomain docks latent TGF-beta at
    the cell surface. The discovery families carry a homozygous stop-gain,
    p.(Arg544Ter), which truncates the protein before the transmembrane domain;
    the fourth patient carries a homozygous missense substitution, p.Ile327Thr,
    predicted on the GARP:latent-TGF-beta1 crystal structure to destabilise the
    leucine-rich-repeat solenoid. Neither allele has been shown biochemically to
    abolish GARP function, so loss of function is inferred from genotype,
    structure, and phenotype rather than demonstrated directly.
  genes:
  - preferred_term: LRRC32
    term:
      id: hgnc:4161
      label: LRRC32
  molecular_functions:
  - preferred_term: transforming growth factor beta binding
    term:
      id: GO:0050431
      label: transforming growth factor beta binding
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: LRRC32
      term:
        id: hgnc:4161
        label: LRRC32
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous germline LRRC32 alleles: the nonsense p.(Arg544Ter) in the
      discovery families and the missense p.Ile327Thr in the fourth patient.
  evidence:
  - reference: PMID:30976112
    reference_title: "Homozygous stop-gain variant in LRRC32, encoding a TGFβ receptor, associated with cleft palate, proliferative retinopathy, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a homozygous stop-gain variant in LRRC32 (c.1630C>T;
      p.(Arg544Ter)) in two families with developmental delay, cleft palate, and
      proliferative retinopathy.
    explanation: >-
      The discovery report establishes the homozygous truncating LRRC32 genotype
      in the affected families.
  - reference: PMID:35656379
    reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The p.327Ile > Thr is likely to destabilize the LRR structure, both by
      introducing a polar residue into a hydrophobic pocket and by, at the same
      time, introducing an unoccupied cavity that destabilizes the structure.
    explanation: >-
      Structural modelling on the GARP crystal structure predicts destabilisation
      of the leucine-rich-repeat ectodomain by the missense allele; this is a
      prediction, not a measured loss of function.
  downstream:
  - target: Failure of Latent TGF-beta Tethering at the Cell Surface
    causal_link_type: DIRECT
    description: >-
      GARP is the anchor itself, so losing it removes the tether rather than
      acting through an intermediate.
    evidence:
    - reference: PMID:19651619
      reference_title: GARP (LRRC32) is essential for the surface expression of latent TGF-beta on platelets and activated FOXP3+ regulatory T cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The knockdown of GARP mRNA with siRNA prevented surface latent TGF-beta
        expression on activated Tregs and recombinant latent TGF-beta1 is able
        to bind directly with GARP.
      explanation: >-
        Removing GARP removes surface latent TGF-beta in the cell type where the
        interaction was first mapped, which is the causal step this edge asserts.
- name: Failure of Latent TGF-beta Tethering at the Cell Surface
  biological_scale: MOLECULAR
  description: >-
    GARP binds the latency-associated peptide of pro-TGF-beta through
    intermolecular disulphide bonds and holds the resulting latent complex on the
    plasma membrane. Without GARP the latent complex is not presented at the cell
    surface. This step was worked out in regulatory T cells and platelets; the
    same requirement was later shown for membrane-associated latent TGF-beta3 in
    the palatal epithelium.
  molecular_functions:
  - preferred_term: transforming growth factor beta binding
    term:
      id: GO:0050431
      label: transforming growth factor beta binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: protein localization to plasma membrane
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
    modifier: DECREASED
  evidence:
  - reference: PMID:19651619
    reference_title: GARP (LRRC32) is essential for the surface expression of latent TGF-beta on platelets and activated FOXP3+ regulatory T cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that GARP or LRRC32, a leucine-rich repeat molecule of unknown
      function, is critical for tethering TGF-beta to the cell surface.
    explanation: >-
      Establishes the tethering function that is lost when GARP is absent.
  - reference: PMID:28912269
    reference_title: Glycoprotein A repetitions predominant (GARP) positively regulates transforming growth factor (TGF) β3 and is essential for mouse palatogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro studies confirmed that GARP and TGFβ3 directly interact and that
      GARP is indispensable for the surface expression of membrane-associated
      latent TGFβ3.
    explanation: >-
      Extends the tethering requirement to TGF-beta3, the isoform that matters
      for palatal fusion.
  downstream:
  - target: Deficient Local Activation of TGF-beta
    causal_link_type: DIRECT
    description: >-
      Latent TGF-beta must be held at the surface in the correct orientation for
      integrin-mediated release of the active cytokine, so failure of tethering
      is failure of the activation step.
    evidence:
    - reference: PMID:30361387
      reference_title: Structural basis of latent TGF-β1 presentation and activation by GARP on human regulatory T cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This finding reveals how GARP exploits an unusual medley of
        interactions, including fold complementation by the amino terminus of
        TGF-β1, to chaperone and orient the cytokine for binding and activation
        by αVβ8.
      explanation: >-
        The crystal structure shows that GARP's orientation of the latent
        complex is what permits integrin-mediated activation, making the tether
        and the activation step mechanistically inseparable.
- name: Deficient Local Activation of TGF-beta
  biological_scale: MOLECULAR
  description: >-
    With latent TGF-beta no longer presented at the cell surface, the integrin
    alphaVbeta6/alphaVbeta8-dependent release of active cytokine cannot proceed
    where GARP-expressing cells would normally supply it. The defect is in local,
    cell-contact-dependent availability of active TGF-beta rather than in
    synthesis of the cytokine or in the receptor-SMAD machinery itself.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:35656379
    reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Taken together, LRRC32 loss of function variants result in GARP
      dysfunction and consequently abnormal maturation and inactivation of
      TGF-β.
    explanation: >-
      The authors state the mechanistic conclusion that the disease-causing step
      is failure of TGF-beta maturation and activation.
  - reference: PMID:30361387
    reference_title: Structural basis of latent TGF-β1 presentation and activation by GARP on human regulatory T cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Regulatory T cells (Tregs) suppress immune cells within close proximity by
      activating latent TGF-β1 presented by GARP (glycoprotein A repetitions
      predominant) to integrin αVβ8 on their surface.
    explanation: >-
      Names the integrin-dependent activation step that GARP presentation
      enables; loss of GARP removes the substrate for that step.
  downstream:
  - target: Reduced SMAD2 Phosphorylation in Palatal Medial Edge Epithelium
    causal_link_type: DIRECT
    description: >-
      In the Garp-null mouse, absent GARP is accompanied by reduced SMAD2
      phosphorylation specifically in the medial edge epithelium of the palatal
      shelf, the readout of TGF-beta receptor signalling in that tissue.
    evidence:
    - reference: PMID:28912269
      reference_title: Glycoprotein A repetitions predominant (GARP) positively regulates transforming growth factor (TGF) β3 and is essential for mouse palatogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, we observed decreased apoptosis and SMAD2 phosphorylation
        in the medial edge epithelial cells of the palatal shelf of GARP KO
        embryos at embryonic day 14.5 (E14.5), indicating a defect in the TGFβ
        signaling pathway in the GARP-null developing palates.
      explanation: >-
        Directly links loss of GARP to a measured drop in TGF-beta pathway output
        in the tissue that fails.
  - target: Disordered Vitreoretinal Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The retinal arm is inferred from the requirement for TGF-beta in retinal
      development and from the human phenotype; the intervening cellular steps
      have not been identified, and the Garp-null mouse cannot supply them.
    evidence:
    - reference: PMID:30976112
      reference_title: "Homozygous stop-gain variant in LRRC32, encoding a TGFβ receptor, associated with cleft palate, proliferative retinopathy, and developmental delay."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our study establishes LRRC32 as a candidate disease-associated gene in
        humans and lends further support to the role of the TGFβ pathway in
        palatogenesis and retinal development.
      explanation: >-
        The discovery report advances the retinal arm as support for a TGF-beta
        role in retinal development, and its own hedged wording places the causal
        step short of demonstrated.
  - target: Impaired Central Nervous System Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Developmental delay is a constant feature of the syndrome, but no
      GARP-dependent step in human brain development has been identified, and the
      mouse literature had not implicated GARP in the central nervous system
      before these patients were reported.
    evidence:
    - reference: PMID:31053781
      reference_title: Truncation of TGF-β docking receptor GARP is linked to human disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        First, mouse studies have uncovered roles of GARP only
        in palatogenesis, immune tolerance and cancer immune
        evasion (Fig. 1), but these three cases suggest that GARP
        may play other roles including in development of the
        central nervous system and the retina.
      explanation: >-
        The commentary states that a central nervous system role for GARP is
        suggested by the patients rather than demonstrated, which is the claim
        this edge makes.
- name: Reduced SMAD2 Phosphorylation in Palatal Medial Edge Epithelium
  biological_scale: CELLULAR
  description: >-
    Fusion of the secondary palate requires TGF-beta3 signalling in the medial
    edge epithelium, whose cells normally undergo programmed cell death and
    epithelial-mesenchymal transformation to remove the midline epithelial seam.
    In GARP-null mouse embryos both SMAD2 phosphorylation and apoptosis in this
    cell population are reduced at embryonic day 14.5. This node is characterised
    entirely in the mouse; no human palatal tissue has been examined.
  cell_types:
  - preferred_term: medial edge epithelial cell of the palatal shelf
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: SMAD protein signal transduction
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
    modifier: DECREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: DECREASED
  evidence:
  - reference: PMID:28912269
    reference_title: Glycoprotein A repetitions predominant (GARP) positively regulates transforming growth factor (TGF) β3 and is essential for mouse palatogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, we observed decreased apoptosis and SMAD2 phosphorylation in
      the medial edge epithelial cells of the palatal shelf of GARP KO embryos at
      embryonic day 14.5 (E14.5), indicating a defect in the TGFβ signaling
      pathway in the GARP-null developing palates.
    explanation: >-
      The two measurements that define this node, made in the GARP knockout
      mouse.
  downstream:
  - target: Failure of Palatal Shelf Fusion
    causal_link_type: DIRECT
    description: >-
      The palatal phenotype of the GARP knockout copies that of the TGF-beta3
      knockout, including the reduction in SMAD phosphorylation, which is the
      argument that the signalling defect is what causes the fusion failure.
    evidence:
    - reference: PMID:28912269
      reference_title: Glycoprotein A repetitions predominant (GARP) positively regulates transforming growth factor (TGF) β3 and is essential for mouse palatogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Of note, the failure to develop the secondary palate and concurrent
        reduction of SMAD phosphorylation without other defects in GARP KO mice
        phenocopied TGFβ3 KO mice, although GARP has not been suggested
        previously to interact with TGFβ3.
      explanation: >-
        The phenocopy argument ties the reduced SMAD signal to the fusion failure
        rather than leaving the two as parallel observations.
- name: Failure of Palatal Shelf Fusion
  biological_scale: TISSUE
  description: >-
    The secondary palatal shelves grow out from the maxillary prominences,
    elevate above the tongue, appose at the midline, and fuse. Loss of the
    TGF-beta signal in the medial edge epithelium leaves the midline seam intact
    and the shelves unfused, producing an isolated cleft of the secondary palate
    without cleft lip.
  biological_processes:
  - preferred_term: secondary palate development
    term:
      id: GO:0062009
      label: secondary palate development
    modifier: DECREASED
  evidence:
  - reference: PMID:28912269
    reference_title: Glycoprotein A repetitions predominant (GARP) positively regulates transforming growth factor (TGF) β3 and is essential for mouse palatogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unexpectedly, the GARP KO mice died within 24 h after birth and exhibited
      defective palatogenesis without apparent abnormalities in other major
      organs.
    explanation: >-
      Establishes that removing GARP is by itself sufficient to break
      palatogenesis in vivo.
  - reference: PMID:22186724
    reference_title: "Palatogenesis: morphogenetic and molecular mechanisms of secondary palate development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the embryonic primary and secondary palatal shelves develop as outgrowths
      from
      the medial nasal and maxillary prominences, respectively, remodel and fuse
      to
      form the intact roof of the oral cavity
    explanation: >-
      A developmental-biology review describing the normal process whose failure
      this node names.
  downstream:
  - target: Cleft palate
    causal_link_type: DIRECT
    description: >-
      An unfused secondary palate is the cleft.
- name: Disordered Vitreoretinal Development
  biological_scale: TISSUE
  description: >-
    TGF-beta isoforms are expressed in the developing retina and are required for
    normal retinal morphogenesis; combined Tgfb2/Tgfb3 deficiency in mice
    produces gross retinal, lens, and corneal abnormality with retinal
    detachment. In CPPRDD the ocular disease is a progressive, childhood-onset
    vitreoretinopathy with a persistent hyaloid remnant, straightened retinal
    vessels, a thickened vitreous adherent to the peripheral retina, and traction
    with secondary retinal tears. How deficient GARP-dependent TGF-beta
    activation produces this specific vitreoretinal picture is not established.
  biological_processes:
  - preferred_term: retina development in camera-type eye
    term:
      id: GO:0060041
      label: retina development in camera-type eye
    modifier: DECREASED
  evidence:
  - reference: PMID:30976112
    reference_title: "Homozygous stop-gain variant in LRRC32, encoding a TGFβ receptor, associated with cleft palate, proliferative retinopathy, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The transforming growth factor-beta (TGFβ) signaling pathway is essential
      for palatogenesis and retinal development.
    explanation: >-
      States the premise on which the retinal arm of this syndrome is
      interpreted.
  - reference: PMID:12838410
    reference_title: Reduced programmed cell death in the retina and defects in lens and cornea of Tgfbeta2(-/-) Tgfbeta3(-/-) double-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report now that eyes of Tgfbeta2/Tgfbeta3 double-deficient mice display
      severe alterations in the morphology of the retina, lens, and cornea.
    explanation: >-
      Independent evidence that loss of TGF-beta ligand disrupts retinal
      morphogenesis, supporting the direction of this node although the model
      removes the ligands rather than the GARP tether.
  - reference: PMID:12838410
    reference_title: Reduced programmed cell death in the retina and defects in lens and cornea of Tgfbeta2(-/-) Tgfbeta3(-/-) double-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In Tgfbeta2(-/-) Tgfbeta3(-/-) and Tgfbeta2(-/-) Tgfbeta3(+/-) littermates
      the retina was consistently detached from the underlying pigment
      epithelium.
    explanation: >-
      Retinal detachment in TGF-beta-deficient mice is the closest model
      counterpart to the tractional retinal complications seen in patients.
  downstream:
  - target: Vitreoretinopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The clinical vitreoretinopathy is the observed consequence; the cellular
      steps between abnormal retinal development and the proliferative
      vitreoretinal picture have not been characterised.
- name: Impaired Central Nervous System Development
  biological_scale: ORGANISM
  description: >-
    Developmental delay is present in every published patient, and brain imaging
    in the discovery series showed ventriculomegaly and corpus callosum
    abnormalities. No GARP-dependent step in brain development has been
    identified, in mouse or in human tissue; the Garp-null mouse dies within a
    day of birth and no neurodevelopmental phenotype has been reported in it.
  biological_processes:
  - preferred_term: central nervous system development
    term:
      id: GO:0007417
      label: central nervous system development
    modifier: DECREASED
  evidence:
  - reference: PMID:31053781
    reference_title: Truncation of TGF-β docking receptor GARP is linked to human disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      First, mouse studies have uncovered roles of GARP only
      in palatogenesis, immune tolerance and cancer immune
      evasion (Fig. 1), but these three cases suggest that GARP
      may play other roles including in development of the
      central nervous system and the retina.
    explanation: >-
      The commentary explicitly identifies a central nervous system role for GARP
      as a possibility raised by the patients and not previously demonstrated.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The clinical consequence, with no established intervening mechanism.
phenotypes:

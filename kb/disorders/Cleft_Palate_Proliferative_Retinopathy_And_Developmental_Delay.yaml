name: Cleft Palate, Proliferative Retinopathy, and Developmental Delay
creation_date: '2026-09-07T00:00:00Z'
description: >-
  An ultra-rare autosomal recessive syndrome caused by biallelic loss-of-function
  variants in LRRC32, which encodes GARP (glycoprotein A repetitions predominant),
  the cell-surface docking receptor that tethers and presents latent TGF-beta.
  Affected individuals have cleft palate, a childhood-onset progressive
  proliferative vitreoretinopathy, and developmental delay, with growth
  restriction, microcephaly, and facial dysmorphism variably present. Only four
  patients from three families, all ascertained in Israel, had been published as
  of the most recent report; the gene-disease relationship rests on that small
  series plus a Garp-null mouse whose palate phenotype is a close match. The
  proximate steps linking deficient local TGF-beta activation to the retinal and
  neurodevelopmental arms are not established in humans.
category: Mendelian
synonyms:
- CPPRDD
- GARP deficiency
- cleft palate-retinopathy syndrome
- LRRC32-related cleft palate, retinopathy and developmental delay

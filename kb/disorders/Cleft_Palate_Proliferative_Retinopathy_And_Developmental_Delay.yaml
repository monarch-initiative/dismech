      proliferative retinopathy.
    explanation: >-
      Cleft palate is one of the three defining features of the discovery series.
  - reference: PMID:35656379
    reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
    supports: SUPPORT

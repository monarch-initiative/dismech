genetic:
- name: Biallelic LRRC32 loss-of-function variants
  gene_term:
    preferred_term: LRRC32
    term:
      id: hgnc:4161
      label: LRRC32
  relationship_type: CAUSATIVE
  notes: >-
    Two alleles are published. The homozygous nonsense c.1630C>T p.(Arg544Ter)
    segregated in the two families of the 2019 discovery series; it truncates
    GARP before the transmembrane domain and is predicted to leave a soluble
    product, but neither the abundance of that product nor its residual activity
    has been measured. The homozygous missense c.980T>C p.Ile327Thr in the fourth
    patient was classified a variant of uncertain significance under ACMG
    criteria (PM2, PP3, PP4) and was supported by structural modelling rather
    than by a functional assay. No ClinGen gene-disease validity assertion for
    LRRC32 was found in the local structured-source cache. Because both reports
    come from the same country and share a senior author, the four patients are
    not four independent ascertainments in the usual sense.
  variants:
  - name: c.1630C>T p.(Arg544Ter)
    description: >-
      Homozygous stop-gain in LRRC32 identified in two families in the discovery
      series.
  - name: c.980T>C p.Ile327Thr
    description: >-
      Homozygous missense in LRRC32 in the fourth patient, substituting a
      conserved isoleucine between leucine-rich repeats R11 and R12; classified a
      variant of uncertain significance.
  evidence:
  - reference: PMID:30976112
    reference_title: "Homozygous stop-gain variant in LRRC32, encoding a TGFβ receptor, associated with cleft palate, proliferative retinopathy, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study establishes LRRC32 as a candidate disease-associated gene in
      humans and lends further support to the role of the TGFβ pathway in
      palatogenesis and retinal development.
    explanation: >-
      The discovery report itself calls LRRC32 a candidate disease gene, which is
      the strength of claim this entry records.
  - reference: PMID:35656379
    reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we identified the homozygous c.980T > C variant in the LRRC32
      gene, which was not found in known databases.
    explanation: >-
      Documents the second published allele.
  - reference: PMID:35656379
    reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variant was classified variant of uncertain significance (VUS)

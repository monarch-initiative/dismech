  description: >-
    Cleft of the secondary palate, present in all published patients and repaired
    surgically. Cleft lip is not part of the reported phenotype.
  phenotype_term:
    preferred_term: Cleft palate
    term:
      id: HP:0000175
      label: Cleft palate
  evidence:
  - reference: PMID:30976112
    reference_title: "Homozygous stop-gain variant in LRRC32, encoding a TGFβ receptor, associated with cleft palate, proliferative retinopathy, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a homozygous stop-gain variant in LRRC32 (c.1630C>T;

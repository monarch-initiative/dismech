differential_diagnoses:
- name: Familial exudative vitreoretinopathy
  disease_term:
    preferred_term: familial exudative vitreoretinopathy
    term:
      id: MONDO:0019516
      label: exudative vitreoretinopathy
  description: >-
    FEVR produces peripheral vitreoretinal traction, retinal folds, and
    tractional detachment that can look like the ocular arm of this syndrome, but
    it arises from impaired Norrin/FZD4/beta-catenin signalling in retinal
    vascular endothelium rather than from deficient TGF-beta activation.
  distinguishing_features:
  - Cleft palate and developmental delay are not features of familial exudative vitreoretinopathy.
  - Familial exudative vitreoretinopathy is usually autosomal dominant (FZD4, LRP5, TSPAN12), with recessive and X-linked forms; this syndrome is recessive and LRRC32-related.
  - The FEVR retina has a peripheral avascular zone on fluorescein angiography, which has not been reported in this syndrome.
  notes: >-
    Listed on the strength of the shared ocular picture and the distinct
    molecular pathway. The sources cached for this entry do not perform a
    head-to-head comparison, and no fluorescein angiography has been published in
    an LRRC32 patient, so the third distinguishing feature is an absence of data
    rather than a demonstrated difference.
- name: Stickler syndrome
  disease_term:
    preferred_term: Stickler syndrome
    term:
      id: MONDO:0019354
      label: Stickler syndrome
  description: >-
    The closest clinical mimic. Stickler syndrome pairs cleft palate, often
    within a Pierre Robin sequence, with a vitreoretinopathy that leads to
    retinal detachment, so it reproduces two of the three defining features.
  distinguishing_features:
  - Stickler syndrome adds myopia, cataract, conductive and sensorineural hearing loss, midfacial underdevelopment, and early-onset degenerative joint disease, none of which has been reported in the LRRC32 patients.
  - Stickler syndrome is a collagen disorder (COL2A1, COL11A1, COL11A2 dominant; COL9A1, COL9A2, COL9A3 recessive), so molecular testing separates the two cleanly.
  - Developmental delay is not a feature of Stickler syndrome, whereas it is one of the three defining features here.
  evidence:
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Stickler syndrome is a connective tissue disorder that can include ocular
      findings of myopia, cataract, and retinal detachment; hearing loss that is
      both conductive and sensorineural; midfacial underdevelopment and cleft
      palate (either alone or as part of the Pierre Robin sequence); and
      early-onset degenerative joint disease.
    explanation: >-
      The GeneReviews clinical description establishes both the overlap (cleft
      palate with a retinal-detaching vitreoretinopathy) and the extra features
      that separate Stickler syndrome from this entry.
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of Stickler syndrome can be established in a proband with
      characteristic clinical features and/or a heterozygous pathogenic variant
      in COL2A1, COL11A1, or COL11A2 or biallelic pathogenic variants in COL9A1,
      COL9A2, or COL9A3 identified by molecular genetic testing.
    explanation: >-
      Names the causal genes that make the molecular distinction from LRRC32
      disease decisive.
  notes: >-
    Cited from the Stickler syndrome GeneReviews chapter. No GeneReviews chapter
    exists for the LRRC32 syndrome itself, and no source compares the two
    directly; the contrast drawn here is between the two clinical descriptions.
- name: Retinopathy of prematurity
  disease_term:
    preferred_term: retinopathy of prematurity
    term:
      id: MONDO:0006952
      label: retinopathy of prematurity
  description: >-
    This is not a theoretical confusion. The fourth published patient was born at
    34 weeks and carried a diagnosis of grade I retinopathy of prematurity from
    the neonatal period; his later vitreoretinal disease was initially attributed
    to it.
  distinguishing_features:
  - Retinopathy of prematurity does not progress in the way the reported patient's disease did, and the location of his lesions did not fit it.
  - Cleft palate, growth restriction, and developmental delay point to a syndromic diagnosis rather than a complication of prematurity.
  evidence:
  - reference: PMID:35656379
    reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the progressive nature and distinctive location of his
      retinopathy excluded retinopathy of prematurity as the cause of his
      ophthalmological disease.
    explanation: >-
      The authors state the reasoning by which they separated the two diagnoses
      in a patient who genuinely had both risk factors.
discussions:
- discussion_id: cpprdd_mouse_no_retinal_phenotype
  prompt: >-
    Does GARP loss cause the human vitreoretinopathy, given that the Garp-null
    mouse has no retinal phenotype but dies within 24 hours of birth?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Disordered Vitreoretinal Development
  - animal_models#Mouse
  rationale: >-
    The retinal arm of this syndrome has no animal counterpart. The only
    published GARP loss-of-function animal, the constitutive knockout mouse, dies
    within a day of birth with an isolated palatal defect and no reported retinal
    abnormality. The human vitreoretinopathy is childhood-onset and progressive,
    so the mouse is censored before the phenotype would appear. The negative
    result therefore neither supports nor refutes a GARP-dependent retinal
    mechanism, and the retinal arm of the pathophysiology rests on human
    observation in four patients plus the general requirement for TGF-beta in
    retinal development shown in ligand-knockout mice. The mismatch runs in both
    directions and the reverse half is the more interesting one: the mouse null
    is neonatally lethal and the patients are not, so either the human alleles
    are hypomorphic rather than null, or human development depends less
    absolutely on GARP than mouse development does. Whichever it is bears
    directly on how much of the mouse mechanism transfers.
  proposed_experiments:
  - experiment_id: exp_cpprdd_conditional_lrrc32_retina
    name: Postnatal and retina-restricted Lrrc32 deletion
    description: >-
      Bypass the neonatal lethality with a conditional Lrrc32 allele deleted
      either postnatally or in retinal and vitreous-associated lineages, then
      follow the eyes longitudinally with fundus imaging, optical coherence
      tomography, and fluorescein angiography into adulthood, scoring for
      persistent hyaloid vasculature, vitreous condensation, vitreoretinal
      traction, and retinal tears. A knock-in of the human p.(Arg544Ter) allele
      would test the patients' genotype rather than complete loss.
    would_support:
    - pathophysiology#Disordered Vitreoretinal Development
    supporting_outcome:
    - >-
      Conditional or knock-in animals surviving past the neonatal period develop
      a persistent hyaloid remnant and peripheral vitreoretinal traction
      resembling the human disease.
    refuting_outcome:
    - >-
      Animals surviving to adulthood have normal retinal and vitreous anatomy on
      serial imaging and histology, which would place the human retinal phenotype
      outside a direct GARP-dependent mechanism.
  evidence:
  - reference: PMID:35656379
    reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nevertheless, in the garp deficient murine model, retinal impairment was
      not observed (23). This may be explained by early lethality of the mice,
      which precludes later evolution of vitreoretinopathy.
    explanation: >-
      States the mismatch and the authors' own explanation for it.
  - reference: PMID:28912269
    reference_title: Glycoprotein A repetitions predominant (GARP) positively regulates transforming growth factor (TGF) β3 and is essential for mouse palatogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unexpectedly, the GARP KO mice died within 24 h after birth and exhibited
      defective palatogenesis without apparent abnormalities in other major
      organs.
    explanation: >-
      Establishes both the neonatal lethality that censors the model and the
      absence of other reported organ phenotypes.
  - reference: PMID:31053781
    reference_title: Truncation of TGF-β docking receptor GARP is linked to human disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Fourth, the current study also suggests that loss of
      GARP function does not cause acute lethality.
    explanation: >-
      States the reverse half of the mismatch: the human patients survive where
      the mouse null does not, which the commentary reads as a substantive
      finding about GARP rather than an incidental difference.
- discussion_id: cpprdd_tgfbeta_direction_paradox
  prompt: >-
    How does a lesion that reduces local TGF-beta activation produce a
    proliferative vitreoretinopathy, when TGF-beta is elevated in the vitreous of
    patients with the common proliferative vitreoretinal diseases?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disordered Vitreoretinal Development
  - pathophysiology#Deficient Local Activation of TGF-beta
  rationale: >-
    The mechanism curated here is deficient GARP-dependent activation of latent
    TGF-beta, so the expected ocular consequence is a developmental one. The
    clinical picture, however, is described as proliferative and is
    fibrocontractile: a thickened adherent vitreous exerting traction. In
    acquired proliferative vitreoretinopathy and proliferative diabetic
    retinopathy, TGF-beta is overexpressed in the vitreous and drives the
    contraction of preretinal membranes, the opposite direction of change. Either
    the lesion here is developmental and only resembles the acquired
    proliferative diseases superficially, or a local deficit of TGF-beta provokes
    a compensatory or dysregulated response elsewhere in the eye. The published
    material does not decide between these, and no vitreous TGF-beta measurement
    has ever been made in an LRRC32 patient.
  proposed_experiments:
  - experiment_id: exp_cpprdd_vitreous_tgfbeta
    name: TGF-beta isoform profiling of vitreous and preretinal membranes
    description: >-
      In any LRRC32 patient coming to vitrectomy, assay vitreous concentrations
      of active and total TGF-beta1, -beta2, and -beta3 alongside age-matched
      non-proliferative controls and acquired proliferative vitreoretinopathy
      controls, and stain any excised preretinal tissue for alpha-smooth muscle
      actin and phospho-SMAD2.
    would_support:
    - pathophysiology#Deficient Local Activation of TGF-beta
    supporting_outcome:
    - >-
      Vitreous active TGF-beta is low or normal rather than elevated, and excised
      tissue shows no phospho-SMAD2-positive myofibroblastic reaction, placing
      the lesion outside the acquired proliferative mechanism.
    refuting_outcome:
    - >-
      Vitreous active TGF-beta is elevated to the range seen in acquired
      proliferative vitreoretinopathy, which would mean the ocular disease is not
      a straightforward consequence of deficient TGF-beta activation.
  evidence:
  - reference: PMID:18952846
    reference_title: Role of TGF-beta in proliferative vitreoretinal diseases and ROCK as a therapeutic target.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TGF-beta is overexpressed in the vitreous of patients with proliferative
      vitreoretinal diseases and is also detectable in the contractile membranes.
    explanation: >-
      Establishes the direction of TGF-beta change in the acquired proliferative
      vitreoretinal diseases, which is what makes this mechanism
      counterintuitive. The paper is about proliferative diabetic retinopathy and
      acquired proliferative vitreoretinopathy, not about LRRC32 disease.
  - reference: PMID:35656379
    reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A thickened vitreous firmly attached to the retinal periphery was noted,
      with traction and secondary retinal tears.
    explanation: >-
      Describes the fibrocontractile character of the human ocular lesion that
      sits awkwardly with a loss-of-TGF-beta mechanism.
- discussion_id: cpprdd_truncated_garp_residual_function
  prompt: >-
    Is p.(Arg544Ter) a true null, and does it release a soluble GARP ectodomain
    that retains any ability to bind and activate latent TGF-beta?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#GARP Loss of Function
  - genetic#Biallelic LRRC32 loss-of-function variants
  rationale: >-
    The whole entry rests on GARP loss of function, and neither published allele
    has been assayed. The nonsense allele truncates before the transmembrane
    domain and would be predicted to yield a soluble ectodomain rather than no
    protein, and soluble GARP is not inert. The missense allele is supported only
    by structural modelling and remains a variant of uncertain significance. A
    related observation sharpens the question: no autoimmune disease was reported
    in the patients, despite GARP's established role in regulatory T cell
    TGF-beta presentation and immune tolerance, which is compatible with residual
    function, with redundancy from the related milieu molecule LRRC33, or with
    the immune phenotype simply not having been looked for.
  proposed_experiments:
  - experiment_id: exp_cpprdd_allele_function
    name: Functional characterisation of the two published LRRC32 alleles
    description: >-
      Express the p.(Arg544Ter) and p.Ile327Thr alleles in a GARP-null cell
      background alongside wild type, and measure GARP protein abundance, surface
      versus secreted distribution, co-immunoprecipitation with
      latency-associated peptide, surface latent TGF-beta1 by flow cytometry, and
      integrin-alphaVbeta8-dependent release of active TGF-beta in a reporter
      assay. Test patient-derived cells where available, and phenotype regulatory
      T cell surface latent TGF-beta in surviving patients.
    would_support:
    - pathophysiology#GARP Loss of Function
    supporting_outcome:
    - >-
      Both alleles abolish or sharply reduce surface presentation of latent
      TGF-beta and integrin-dependent activation relative to wild type.
    refuting_outcome:
    - >-
      Either allele supports near-normal surface presentation and activation,
      which would mean the curated mechanism is not the operative one for that
      genotype.
  evidence:
  - reference: PMID:35656379
    reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the proposed mechanism for a missense variant leading to loss of
      function effect would require further functional validation.
    explanation: >-
      The authors of the second allele say explicitly that the loss-of-function
      mechanism is unvalidated.
  - reference: PMID:30361387
    reference_title: Structural basis of latent TGF-β1 presentation and activation by GARP on human regulatory T cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Regulatory T cells (Tregs) suppress immune cells within close proximity by
      activating latent TGF-β1 presented by GARP (glycoprotein A repetitions
      predominant) to integrin αVβ8 on their surface.
    explanation: >-
      Names the regulatory T cell function that makes the absence of a reported
      immune phenotype in these patients worth explaining.
- discussion_id: cpprdd_case_count_and_spectrum
  prompt: >-
    Is the published four-patient series the whole phenotypic spectrum of
    LRRC32-related disease, and do LRRC32 variants found in unselected cleft
    palate cohorts represent the same entity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#Biallelic LRRC32 loss-of-function variants
  - prevalence#Published literature worldwide
  rationale: >-
    Four patients from three families, all ascertained in Israel and reported by
    two overlapping groups, define this disease. That is enough to make the
    gene-disease relationship credible and not enough to describe a spectrum: it
    is not known whether milder alleles produce isolated cleft palate or isolated
    vitreoretinopathy, whether the growth restriction and dysmorphism are
    constant, or what the natural history of the eye disease is beyond
    adolescence. An exome study of consanguineous Kuwaiti cleft lip and palate
    families subsequently reported a novel LRRC32 variant in a syndromic case,
    which is a lead worth following rather than a confirmed additional patient:
    that report does not state the zygosity, does not describe a retinopathy, and
    does not claim this diagnosis.
  proposed_experiments:
  - experiment_id: exp_cpprdd_lrrc32_cohort_screen
    name: Targeted LRRC32 screening of syndromic cleft palate and paediatric vitreoretinopathy cohorts
    description: >-
      Screen LRRC32 in two independent, deliberately different ascertainment
      frames, syndromic isolated cleft palate cohorts and unexplained paediatric
      vitreoretinopathy cohorts, and phenotype any biallelic carriers for the
      full triad, so the spectrum is described from both ends rather than from
      the craniofacial end alone.
    would_support:
    - genetic#Biallelic LRRC32 loss-of-function variants
    supporting_outcome:
    - >-
      Biallelic LRRC32 carriers are found in both frames and show overlapping but
      non-identical combinations of the triad, defining a spectrum.
    refuting_outcome:
    - >-
      No further biallelic carriers are found in either frame, leaving the entity
      confined to the reported Israeli families.
  evidence:
  - reference: PMID:41041957
    reference_title: Identification of Novel and Rare Gene Variants in Cleft Lip/Palate Patients From Kuwaiti Consanguineous Families by Exome Sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven rare gene variants were identified across all cases, including one
      novel variant (LRRC32) in a syndromic case
    explanation: >-
      Reports an LRRC32 variant in an independent syndromic cleft cohort. It
      establishes that LRRC32 recurs in this ascertainment frame; it does not
      state zygosity, does not report retinopathy, and does not make this
      diagnosis, which is why it is recorded as a lead rather than as a fifth
      case.
  - reference: PMID:35656379
    reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Table 1 summarizes the clinical, radiological and genetic features of all
      four cases reported so far.
    explanation: >-
      Fixes the size of the published series that this gap is about.
notes: >-
  SCOPE AND CONFOUNDING. The fourth published patient carries two recessive
  diseases: alongside the LRRC32 genotype he is homozygous for SLC22A5
  p.Glu452Lys and has primary carnitine deficiency, which the authors identify as
  the cause of his severe dilated cardiomyopathy and which responded to carnitine
  supplementation. Cardiomyopathy is therefore deliberately not curated as a
  phenotype of this syndrome. The same patient was born at 34 weeks with grade I
  intraventricular haemorrhage and necrotising enterocolitis, so his reduced
  cerebral white matter volume is confounded by the documented perinatal
  haemorrhage and is likewise left out of the phenotype list; the
  ventriculomegaly and corpus callosum abnormalities attributed to the earlier
  patients are curated instead.

  NO MODULE CONFORMANCE. Three candidate modules were checked and rejected.
  norrin_fzd4_retinal_vascular_development scopes itself to lesions in the
  Norrin-FZD4 system and explicitly excludes retinal neovascularization reached
  by other routes. aortopathy_tgfbeta_dysregulation models increased TGF-beta
  signalling in the aortic media, the opposite direction of change in a different
  organ. pharyngeal_arch_patterning_serial_homology models cleft palate arising
  from cranial neural crest and arch patterning, whereas the lesion here is a
  failure of TGF-beta signalling in the medial edge epithelium at the fusion
  step. A GARP/latent-TGF-beta-presentation module would be the natural home if
  the handful of diseases in that class ever justifies one.

  EVIDENCE LIMITS. There is no GeneReviews chapter for this disease (a PubMed
  search for one returned no result), no Orphanet record in the local structured
  cache, and no ClinGen gene-disease validity assertion found for LRRC32. Every
  claim about the syndrome itself traces to two primary reports and their
  accompanying commentary. Mechanistic evidence for the GARP-latent-TGF-beta step
  comes from regulatory T cell and platelet cell biology and is graded IN_VITRO
  accordingly; LRRC32/GARP has a large tumour-immunology and regulatory T cell
  literature that concerns the same protein but not this disease, and none of it
  is cited here as human disease evidence. The deep-research report for this
  entry additionally supplied gnomAD v4 constraint metrics and allele
  frequencies for LRRC32 and for p.(Arg544Ter). Those are not curated here: the
  numbers were not independently checked against gnomAD, and this repository has
  no reference-cache path for a gnomAD record, so citing them would have meant
  asserting them without a verifiable source.

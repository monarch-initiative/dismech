animal_models:
- name: Garp (Lrrc32) knockout mouse
  species: Mouse
  genotype: Lrrc32 (Garp) constitutive knockout, homozygous null
  publication: PMID:28912269
  description: >-
    A constitutive GARP knockout mouse generated to test GARP's role in organ
    development. Homozygous nulls die within 24 hours of birth with a cleft
    secondary palate and no other apparent major-organ abnormality, and show
    reduced SMAD2 phosphorylation and reduced apoptosis in the medial edge
    epithelium of the palatal shelf at E14.5. The palatal phenotype copies that
    of the TGF-beta3 knockout.
  genes:
  - preferred_term: LRRC32
    term:
      id: hgnc:4161
      label: LRRC32
  modeled_mechanisms:
  - target: Reduced SMAD2 Phosphorylation in Palatal Medial Edge Epithelium
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The node is defined by measurements made in this model: reduced SMAD2
      phosphorylation and reduced apoptosis in the palatal medial edge
      epithelium at E14.5.
    limitations: >-
      The corresponding human tissue has never been examined, so the cellular
      step is assumed rather than shown in patients.
    readouts:
    - name: SMAD2 phosphorylation in palatal medial edge epithelium at E14.5
      target: Reduced SMAD2 Phosphorylation in Palatal Medial Edge Epithelium
      direction: DECREASED
      interpretation: >-
        A direct readout of TGF-beta receptor signalling output in the epithelium
        that must fuse.
      evidence:
      - reference: PMID:28912269
        reference_title: Glycoprotein A repetitions predominant (GARP) positively regulates transforming growth factor (TGF) β3 and is essential for mouse palatogenesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Furthermore, we observed decreased apoptosis and SMAD2 phosphorylation
          in the medial edge epithelial cells of the palatal shelf of GARP KO
          embryos at embryonic day 14.5 (E14.5), indicating a defect in the TGFβ
          signaling pathway in the GARP-null developing palates.
        explanation: Reports the measurement and its direction.
    - name: Apoptosis in palatal medial edge epithelium at E14.5
      target: Reduced SMAD2 Phosphorylation in Palatal Medial Edge Epithelium
      direction: DECREASED
      interpretation: >-
        Programmed cell death removes the midline epithelial seam; its reduction
        is the cellular failure that leaves the seam intact.
      evidence:
      - reference: PMID:28912269
        reference_title: Glycoprotein A repetitions predominant (GARP) positively regulates transforming growth factor (TGF) β3 and is essential for mouse palatogenesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Furthermore, we observed decreased apoptosis and SMAD2 phosphorylation
          in the medial edge epithelial cells of the palatal shelf of GARP KO
          embryos at embryonic day 14.5 (E14.5), indicating a defect in the TGFβ
          signaling pathway in the GARP-null developing palates.
        explanation: Reports the measurement and its direction.
    evidence:
    - reference: PMID:28912269
      reference_title: Glycoprotein A repetitions predominant (GARP) positively regulates transforming growth factor (TGF) β3 and is essential for mouse palatogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our findings indicate that GARP is essential for normal morphogenesis of
        the palate and demonstrate that GARP plays a crucial role in regulating
        TGFβ3 signaling during embryogenesis.
      explanation: >-
        Supports treating this model as informative for the palatal signalling
        node.
  - target: Failure of Palatal Shelf Fusion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      GARP-null mice fail to develop the secondary palate, the same anatomical
      lesion seen in patients, and the defect is isolated to the palate among
      major organs.
    limitations: >-
      The mouse allele is a constitutive null while the human discovery allele is
      a late truncation that may leave a soluble product, so the mouse models the
      complete-loss end of the allelic series rather than the patients' genotype
      specifically.
    evidence:
    - reference: PMID:28912269
      reference_title: Glycoprotein A repetitions predominant (GARP) positively regulates transforming growth factor (TGF) β3 and is essential for mouse palatogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Unexpectedly, the GARP KO mice died within 24 h after birth and
        exhibited defective palatogenesis without apparent abnormalities in other
        major organs.
      explanation: >-
        The model reproduces the human palatal lesion.
  - target: Disordered Vitreoretinal Development
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      No retinal abnormality was observed in the GARP-deficient mouse, so the
      model does not reproduce the ocular arm of the human syndrome.
    limitations: >-
      The mice die within 24 hours of birth, which precludes the postnatal window
      in which the human vitreoretinopathy appears and progresses; the negative
      result therefore cannot distinguish a species difference from a censored
      observation, and cannot be used to argue that the retinal arm is not
      GARP-dependent.
    evidence:
    - reference: PMID:35656379
      reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Nevertheless, in the garp deficient murine model, retinal impairment was
        not observed (23). This may be explained by early lethality of the mice,
        which precludes later evolution of vitreoretinopathy.
      explanation: >-
        States both the negative retinal finding in the model and the lethality
        that limits its interpretation.
  evidence:
  - reference: PMID:35656379
    reference_title: A Novel Homozygous Missense Variant in the LRRC32 Gene Is Associated With a New Syndrome of Cleft Palate, Progressive Vitreoretinopathy, Growth Retardation, and Developmental Delay.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Accordingly, garp knockout mice had early lethality and also defective
      palatogenesis (23).
    explanation: >-
      The clinical report cites this mouse as the animal counterpart of the human
      palatal phenotype.

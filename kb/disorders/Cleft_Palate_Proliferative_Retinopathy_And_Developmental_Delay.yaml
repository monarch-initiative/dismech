  description: >-
    Early intervention and rehabilitation for the global developmental delay.
    Nothing specific to this syndrome has been published; the sources establish
    that delay is present in every patient, not what should be done about it.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL

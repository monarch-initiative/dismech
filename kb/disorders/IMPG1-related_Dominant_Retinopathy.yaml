pathophysiology:
- name: Dominant-Negative IMPG1 Variant
  description: >-
    A heterozygous IMPG1 allele produces an abnormal SPACR protein that acts in
    the interphotoreceptor matrix despite a normal allele. The prototypical
    change p.Leu238Arg sits at the start of the conserved N-terminal SEA1 domain;
    structural modeling predicts it destabilizes SEA1, but the mutant protein is
    produced at normal levels and is not mislocalized, so it is not a null
    allele. The founding study proposes a dominant-negative effect, the mutant
    behaving abnormally inside the extracellular matrix, which separates this
    disease from the recessive IMPG1 disease, where a single null allele is
    non-penetrant. A second codon-238 missense change (p.Leu238Pro) and the
    perifoveal-maculopathy change p.Leu579Pro are also heterozygous.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: IMPG1
    term:
      id: hgnc:6055
      label: IMPG1
  molecular_functions:
  - preferred_term: interphotoreceptor matrix structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
  evidence:
  - reference: PMID:23993198
    reference_title: Mutations in IMPG1 cause vitelliform macular dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Structural modeling indicates that the p.Leu238Arg substitution destabilizes the conserved SEA1 domain of SPACR."
    explanation: >-
      The dominant allele is predicted to destabilize the SEA1 domain of the
      secreted matrix protein.
  - reference: PMID:23993198
    reference_title: Mutations in IMPG1 cause vitelliform macular dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We speculate that the p.Leu238Arg change has a dominant-negative effect."
    explanation: >-
      The founding study proposes the dominant allele acts by a dominant-negative
      mechanism.
  - reference: PMID:23993198
    reference_title: Mutations in IMPG1 cause vitelliform macular dystrophies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "indicating that c.713T>G is not a null mutation and that the pathogenic effect of the mutant could be its abnormal behavior inside the extracellular matrix"
    explanation: >-
      Immunoblot and immunofluorescence showed the mutant is produced and
      correctly localized, so the dominant effect is abnormal behavior of SPACR
      within the matrix rather than loss of the protein.
  - reference: PMID:28644393
    reference_title: "Mutations in the Genes for Interphotoreceptor Matrix Proteoglycans, IMPG1 and IMPG2, in Patients with Vitelliform Macular Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the current finding of a second missense mutation affecting amino acid p.(Leu238) in a patient with VMD supports the causative role of defective IMPG1 molecules in disease via an as yet unknown dominant-negative effect or haploinsufficiency"
    explanation: >-
      A second independent codon-238 missense allele supports a defective-molecule
      (dominant-negative or haploinsufficient) mechanism.
  downstream:
  - target: Interphotoreceptor Matrix Disorganization
    causal_link_type: DIRECT
    description: >-
      The abnormal SPACR is deposited into the matrix, where it disrupts normal
      matrix assembly around photoreceptor outer segments.
- name: Interphotoreceptor Matrix Disorganization
  description: >-
    SPACR is made by rod and cone photoreceptors and, with SPACRCAN (IMPG2),
    supplies most of the chondroitin sulfate of the interphotoreceptor matrix and
    the cone-specific glycocalyx. An abnormal or reduced-function SPACR disturbs
    the organization of the matrix around the outer segments; loss of IMPG1 in
    mice removes chondroitin sulfate and the cone PNA glycocalyx from the
    outer-segment compartment and, in older animals, leaves the matrix
    vacuolated and disorganized.
  biological_scale: TISSUE
  cellular_components:
  - preferred_term: interphotoreceptor matrix
    term:
      id: GO:0033165
      label: interphotoreceptor matrix
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: DECREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:10601738
    reference_title: "Expression and characterization of the IPM 150 gene (IMPG1) product, a novel human photoreceptor cell-associated chondroitin-sulfate proteoglycan."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In situ hybridization analyses indicate that, in the eye, IPM 150 mRNA is expressed specifically by cone and rod photoreceptor cells."
    explanation: >-
      Establishes that the IMPG1 product is synthesized by rod and cone
      photoreceptors, the cells whose matrix is affected.
  - reference: PMID:32265257
    reference_title: Proteoglycan IMPG2 Shapes the Interphotoreceptor Matrix and Modulates Vision.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In normal retina, IMPG1 and IMPG2 occupy distinct IPM compartments, represent the main source of chondroitin sulfate and are fundamental for the constitution of the cone-specific glycocalyx stained by the PNA (peanut agglutinin) lectin marker."
    explanation: >-
      Knockout mice show that IMPG1 is a main source of IPM chondroitin sulfate
      and is needed for the cone glycocalyx.
  - reference: PMID:29777959
    reference_title: Extracellular matrix component expression in human pluripotent stem cell-derived retinal organoids recapitulates retinogenesis in vivo and reveals an important role for IMPG1 and CD44 in the development of photoreceptors and interphotoreceptor matrix.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Blocking the action of CD44 and IMPG1 in pluripotent stem cell derived retinal organoids affected the development of photoreceptors, their inner/outer segments and connecting cilia and disrupted IPM formation, with IMPG1 having an earlier and more significant impact."
    explanation: >-
      Antibody blockade of IMPG1 in human retinal organoids disrupted IPM
      formation, supporting a role for IMPG1 in building the human matrix.
  downstream:
  - target: Photoreceptor Outer Segment Disorganization
    causal_link_type: DIRECT
    description: >-
      The matrix holds outer segments in alignment; a disorganized matrix lets
      the outer segments lose alignment and shorten.
    evidence:
    - reference: PMID:36140676
      reference_title: SPACR Encoded by IMPG1 Is Essential for Photoreceptor Survival by Interplaying between the Interphotoreceptor Matrix and the Retinal Pigment Epithelium.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Alcian Blue staining of the IPM glycosaminoglycans showed that the photoreceptors of the Impg1−/− mice were disorganized with the loss of alignment of the photoreceptor OS."
      explanation: >-
        Staining of the IPM in knockout mice shows disorganized photoreceptors
        and loss of outer-segment alignment.
  - target: Subretinal Autofluorescent Material Accumulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A defective matrix is proposed to impair handling of shed outer-segment
      material by the RPE, leaving autofluorescent material in the subretinal
      space.
- name: Photoreceptor Outer Segment Disorganization
  description: >-
    Rod and cone outer segments lose their regular alignment and, in medaka
    knockdown, are shortened.

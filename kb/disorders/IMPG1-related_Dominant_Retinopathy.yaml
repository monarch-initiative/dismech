  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Monoallelic germline variants. The SEA1-domain missense change c.713T>G
    (p.Leu238Arg) segregates in three autosomal dominant vitelliform macular
    dystrophy families; a second codon-238 change c.713T>C (p.Leu238Pro) was

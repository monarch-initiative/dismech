animal_models:
- name: impg1 morpholino knockdown medaka
  species: Medaka
  genotype: impg1 morpholino knockdown
  publication: PMID:32817297
  description: >-
    Transient morpholino ablation of impg1 (and, separately, impg2) in medaka
    embryos shortened rod and cone outer segments, confirming a phenotype
    consistent with the human families.
  evidence:
  - reference: PMID:32817297
    reference_title: Pathogenic variants in IMPG1 cause autosomal dominant and autosomal recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using morpholino-mediated ablation of Impg1 and its paralog Impg2 in medaka fish, we confirmed a phenotype consistent with that observed in the families, including a decreased length of rod and cone photoreceptor outer segments."
    explanation: Outer-segment shortening after impg1 knockdown in fish.
  modeled_mechanisms:
  - target: Photoreceptor Outer Segment Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Shortened rod and cone outer segments in embryonic retina.
    limitations: >-
      Transient knockdown reduces impg1 rather than expressing the human dominant
      allele, so it models loss of SPACR, not the dominant-negative behavior of a
      heterozygous mutant protein; it reports outer-segment length only and not
      the adult-onset course or the vitelliform lesion.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        A morpholino knockdown in embryonic fish retina reduces impg1 dosage,
        whereas the human disease is caused by a heterozygous allele producing an
        abnormal protein alongside a normal one; the model therefore tests loss
        of the proteoglycan rather than the dominant-negative mechanism proposed
        for the human allele.
- name: Impg1 knockout mouse (Olivier 2022)
  species: Mouse
  genotype: Impg1-/- (floxed exon 6 deleted by CMV-Cre)
  background: C57BL/6J
  publication: PMID:36140676
  description: >-
    Constitutive Impg1 knockout with no detectable retinal SPACR. From 9 months,
    autofluorescent subretinal deposits across the fundus, falling scotopic and
    photopic ERG amplitudes, outer retinal thinning, disorganized IPM and outer
    segments, and RPE damage. Because it removes SPACR rather than expressing a
    mutant allele, it models the matrix-loss consequence shared by both IMPG1
    diseases, not the dominant-negative allele itself.
  evidence:
  - reference: PMID:36140676
    reference_title: SPACR Encoded by IMPG1 Is Essential for Photoreceptor Survival by Interplaying between the Interphotoreceptor Matrix and the Retinal Pigment Epithelium.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Impg1-/- mice provide a novel model for mechanistic investigations and the development of therapies for VMD and RP caused by IMPG1 pathogenic variants."
    explanation: The authors present the knockout as a model of IMPG1 retinopathy.
  modeled_mechanisms:
  - target: Subretinal Autofluorescent Material Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Autofluorescent hyperreflective deposits form between outer segments and RPE.
    limitations: >-
      Mice have no macula, so the deposits are scattered across the fundus rather
      than forming a single central vitelliform lesion, and the knockout removes
      SPACR rather than expressing the human dominant allele.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        A homozygous null removes SPACR entirely, whereas the dominant human
        disease retains one normal allele and adds an abnormal one; the model
        reproduces the subretinal deposit but through loss of the protein rather
        than the proposed dominant-negative matrix effect.
    evidence:
    - reference: PMID:36140676
      reference_title: SPACR Encoded by IMPG1 Is Essential for Photoreceptor Survival by Interplaying between the Interphotoreceptor Matrix and the Retinal Pigment Epithelium.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These autofluorescent spots in the Impg1−/− mice were also detectable by SD-OCT as hyperreflective deposits localized between the photoreceptors OS and the RPE"
      explanation: Shows the deposits sit in the same compartment as the human lesion.
discussions:
- discussion_id: impg1_dominant_negative_versus_haploinsufficiency
  prompt: >-
    Do the dominant IMPG1 alleles cause disease by a dominant-negative effect of
    the mutant SPACR within the interphotoreceptor matrix, or by
    haploinsufficiency, and do the available loss-of-function models address
    either?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Dominant-Negative IMPG1 Variant
  - animal_models#Mouse
  - animal_models#Medaka
  rationale: >-
    The founding study proposes a dominant-negative mechanism because the
    p.Leu238Arg protein is produced and correctly localized and is not a null,
    while a later study leaves dominant-negative effect and haploinsufficiency
    open. Both the Impg1 knockout mouse and the medaka morpholino knockdown
    reduce or remove SPACR, so they test the consequence of absent proteoglycan,
    not the behavior of a heterozygous mutant protein alongside a normal one.
    No model expressing a human dominant allele has been reported, so the
    mechanism of the dominant disease is not directly modeled.
  evidence:
  - reference: PMID:28644393
    reference_title: "Mutations in the Genes for Interphotoreceptor Matrix Proteoglycans, IMPG1 and IMPG2, in Patients with Vitelliform Macular Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the current finding of a second missense mutation affecting amino acid p.(Leu238) in a patient with VMD supports the causative role of defective IMPG1 molecules in disease via an as yet unknown dominant-negative effect or haploinsufficiency"
    explanation: >-
      A later study leaves the dominant mechanism open between dominant-negative
      effect and haploinsufficiency.
  proposed_experiments:
  - experiment_id: impg1_dominant_allele_knockin
    name: Knock-in of a human dominant IMPG1 allele
    description: >-
      Generate an animal or human retinal-organoid model expressing a dominant
      IMPG1 allele (for example p.Leu238Arg) alongside the wild-type allele, and
      test whether the mutant SPACR disrupts the matrix in the presence of normal
      SPACR, distinguishing a dominant-negative effect from haploinsufficiency.
    would_support:
    - pathophysiology#Dominant-Negative IMPG1 Variant
- discussion_id: impg1_dominant_vmd_versus_rp
  prompt: >-
    What determines whether a monoallelic IMPG1 variant presents as adult-onset
    vitelliform macular dystrophy or as retinitis pigmentosa?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Dominant VMD
  - has_subtypes#BCAMD RP
  rationale: >-
    The dominant IMPG1 disease spans a macular vitelliform presentation and a
    retinitis pigmentosa presentation, with the benign concentric annular
    macular dystrophy allele later reclassified as RP with early macular
    involvement. The prototypical vitelliform allele p.Leu238Arg lies in the
    N-terminal SEA1 domain of SPACR, whereas the p.Leu579Pro allele of the
    retinitis pigmentosa presentation lies in the C-terminal SEA2 domain,
    suggesting a possible SEA-domain genotype-phenotype correlation. Whether
    domain position, the specific substitution, or modifier loci such as IMPG2
    decide the presentation is not established.
  evidence:
  - reference: PMID:32817297
    reference_title: Pathogenic variants in IMPG1 cause autosomal dominant and autosomal recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the clinical diagnosis of the IMPG1 retinopathy-associated variant, originally described as benign concentric annular macular dystrophy, was also revised to RP with early macular involvement"
    explanation: >-
      A dominant allele once called a benign macular dystrophy was reclassified
      as retinitis pigmentosa, showing the presentations are not sharply
      separated.

- name: BCAMD RP
  display_name: Autosomal dominant IMPG1 retinitis pigmentosa (including benign concentric annular macular dystrophy)
  description: >-
    Autosomal dominant retinitis pigmentosa caused by monoallelic IMPG1
    variants, including the entity first described as benign concentric annular
    macular dystrophy (heterozygous p.Leu579Pro), which begins as a parafoveal
    maculopathy with preserved acuity and progresses to a retinitis
    pigmentosa-like picture with night blindness and attenuated retinal
    arterioles by the fourth to fifth decade; its diagnosis was later revised to
    retinitis pigmentosa with early macular involvement. A dominant IMPG1 splice
    variant was also identified in a family with autosomal dominant RP.

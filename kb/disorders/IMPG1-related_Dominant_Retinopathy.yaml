- name: Subretinal Autofluorescent Material Accumulation
  description: >-
    Autofluorescent, hyperreflective material accumulates between the
    photoreceptor outer segments and the RPE. In patients this forms the central
    vitelliform lesion; in Impg1 knockout mice, which lack a macula, equivalent
    autofluorescent deposits appear across the fundus with age. In IMPG1 disease
    the material sits above the RPE, unlike BEST1 disease, where it lies between
    the RPE and Bruch's membrane.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:36140676
    reference_title: SPACR Encoded by IMPG1 Is Essential for Photoreceptor Survival by Interplaying between the Interphotoreceptor Matrix and the Retinal Pigment Epithelium.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These autofluorescent spots in the Impg1−/− mice were also detectable by SD-OCT as hyperreflective deposits localized between the photoreceptors OS and the RPE"
    explanation: >-
      Places the deposits in the subretinal space, between outer segments and
      RPE, the compartment of the human vitelliform lesion.
  downstream:

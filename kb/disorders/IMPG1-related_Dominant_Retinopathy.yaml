inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Disease is caused by a single IMPG1 allele. The dominant missense allele
    p.Leu238Arg cosegregated with disease across the index family and was absent
    from unaffected members, but a simplex splice-variant case with unaffected
    heterozygous relatives shows the dominant alleles can be incompletely
    penetrant. Carriers of a single recessive null allele, by contrast, are
    unaffected, which is the basis for separating this entity from the recessive

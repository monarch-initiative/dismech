name: IMPG1-related Dominant Retinopathy
creation_date: "2026-10-31T00:00:00Z"
category: Mendelian
description: >-
  IMPG1-related dominant retinopathy is an inherited retinal disease caused by
  heterozygous (monoallelic) pathogenic variants in IMPG1, which encodes
  interphotoreceptor matrix proteoglycan 1 (SPACR, also IPM150), a secreted
  glycoprotein made by rod and cone photoreceptors and deposited in the
  interphotoreceptor matrix (IPM) that fills the subretinal space between
  photoreceptor outer segments and the retinal pigment epithelium (RPE). The
  prototypical allele is the SEA1-domain missense change p.Leu238Arg, found in
  three autosomal dominant vitelliform macular dystrophy families, which is not
  a null allele and is proposed to act by a dominant-negative mechanism within
  the matrix; a second missense change at the same codon (p.Leu238Pro), a
  dominant splice variant, and the perifoveal-maculopathy allele p.Leu579Pro are
  also reported. The clinical spectrum spans an adult-onset vitelliform macular
  dystrophy with a central subfoveal vitelliform deposit, normal or only mildly
  reduced electrooculogram Arden ratio, and mild slowly progressive central
  vision loss, and an autosomal dominant retinitis pigmentosa, including the
  entity first described as benign concentric annular macular dystrophy whose
  diagnosis was later revised to retinitis pigmentosa with early macular
  involvement. The ClinGen Retina Gene Curation Expert Panel classifies the
  monoallelic IMPG1 disease as Definitive and separates it from the biallelic
  (recessive) IMPG1 disease because carriers of a single recessive null allele
  are unaffected, whereas the dominant alleles cause disease in the
  heterozygous state with incomplete penetrance. No disease-specific treatment
  exists.
disease_term:
  preferred_term: IMPG1-related dominant retinopathy
  term:
    id: MONDO:1040036
    label: IMPG1-related dominant retinopathy
synonyms:
- autosomal dominant IMPG1 retinopathy
- autosomal dominant IMPG1-related vitelliform macular dystrophy
- autosomal dominant IMPG1-related retinitis pigmentosa
- benign concentric annular macular dystrophy
parents:
- Ophthalmological Disease
- Retinal Dystrophy
- Inherited retinal dystrophy
notes: >-
  Relation to other entries. The biallelic IMPG1 disease (MONDO:1040037,
  IMPG1-related recessive retinopathy) is a separate ClinGen entity curated in
  IMPG1-related_Recessive_Retinopathy.yaml and is not covered here; the two are
  split because a single recessive null allele is non-penetrant whereas the
  dominant alleles cause disease in the heterozygous state. Vitelliform macular
  dystrophy 4 (MONDO:0014508, OMIM 616151) is the IMPG1 vitelliform macular
  dystrophy of either inheritance mode; MONDO files it under adult-onset
  foveomacular vitelliform dystrophy (MONDO:0011979), where its dominant
  adult-onset form is already curated as the IMPG1-related subtype of
  Adult_Onset_Foveomacular_Vitelliform_Dystrophy. This entry does not rebind
  MONDO:0014508 as its own disease term; its dominant vitelliform subtype is the
  monoallelic part of VMD4 and maps to it with skos:broadMatch. Benign
  concentric annular macular dystrophy (MONDO:0007934, OMIM 153870) is a MONDO
  descendant of this term and is bound as the dominant retinitis-pigmentosa
  subtype. No GeneReviews chapter covers IMPG1 retinopathy.
has_subtypes:
- name: Dominant VMD
  display_name: Autosomal dominant IMPG1 vitelliform macular dystrophy
  description: >-
    Adult-onset vitelliform macular dystrophy in heterozygotes for an IMPG1
    SEA1-domain missense allele (p.Leu238Arg in three families, p.Leu238Pro in a
    simplex case): a single subfoveal round vitelliform deposit of
    autofluorescent material, in some individuals with additional small
    multifocal deposits, a mean visual acuity around 20/30, and a normal or only
    slightly reduced electrooculogram Arden ratio, which distinguishes it from
    Best disease. Reported age of onset is 20 to 45 years.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0014508
        label: vitelliform macular dystrophy 4
      mapping_predicate: skos:broadMatch
      mapping_justification: >-
        VMD4 is defined by MONDO as any vitelliform macular dystrophy caused by
        IMPG1 mutation, whatever the inheritance mode, so it is broader than this
        monoallelic dominant subtype. Its dominant adult-onset form is curated as
        the IMPG1-related subtype of
        Adult_Onset_Foveomacular_Vitelliform_Dystrophy.

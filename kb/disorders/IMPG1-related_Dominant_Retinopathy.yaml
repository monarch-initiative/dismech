- name: Photoreceptor Degeneration
  description: >-
    Rods and cones degenerate, with reduced central acuity in the vitelliform
    presentation and, in the retinitis pigmentosa presentation, night blindness,
    attenuated retinal vessels and progressive rod-cone dysfunction. In the
    benign concentric annular macular dystrophy family the perifoveal maculopathy
    evolved to a retinitis pigmentosa picture by the fourth to fifth decade.
  biological_scale: CELLULAR

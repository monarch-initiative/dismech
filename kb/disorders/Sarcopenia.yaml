name: Sarcopenia
creation_date: "2026-08-31T00:00:00Z"
category: Complex
parents:
- Musculoskeletal Disease
description: >-
  Sarcopenia is a progressive, generalised skeletal muscle disorder in which
  muscle strength, mass, and quality decline together, producing weakness, slow
  gait, falls, fractures, disability, and excess mortality. Contemporary
  consensus (EWGSOP2, AWGS 2019) treats it as a muscle disease — "muscle
  failure" — rather than an inevitable feature of ageing, and places low muscle
  strength, not low muscle mass, at the centre of the diagnosis. Primary
  (age-related) sarcopenia is diagnosed when ageing is the only apparent cause;
  secondary sarcopenia is driven by inactivity, undernutrition, or chronic
  disease (organ failure, malignancy, inflammatory disease), and is the more
  common form. Mechanistically the entry models a convergent chain in which
  motor neuron loss and neuromuscular junction transmission failure, mitochondrial
  dysfunction, inflammaging, satellite-cell exhaustion, anabolic resistance, and
  ubiquitin-proteasome proteolysis together tip muscle protein balance negative
  and preferentially destroy type II fibers.
synonyms:
- age-related muscle loss
- age-related sarcopenia
- primary sarcopenia
- muscle failure

notes: >-
  No MONDO term is bound. MONDO:0006516 ("sarcopenia") was obsoleted with the
  reason "out of scope - MONDO:excludeBiologicalProcess. This term represent a
  natural aging process, and not a disease.", so binding it would assert a
  retired class, and MONDO offers no replacement. The KB nonetheless treats
  sarcopenia as in scope: it carries its own billable ICD-10-CM code (M62.84,
  recorded under mappings), the EWGSOP2 consensus explicitly reclassifies it as
  a muscle disease rather than a normal ageing correlate, and it has a
  literature-grounded causal mechanism, which is the §1 scope test in
  docs/explanation/design-decisions.md. This is a live disagreement with MONDO,
  not an oversight — it is surfaced here rather than silently resolved, and is
  worth an upstream MONDO ticket, which has not been filed. See tracked_issues
  for what the MONDO tracker does and does not record here: the obsoletion came
  out of a bulk muscle-tissue-disorder branch review rather than an individually
  argued decision, and has not been challenged since.
  NCIT does code Sarcopenia (NCIT:C186726) and
  Acute Sarcopenia (NCIT:C189016), but both sit under NCIT:C3367 (Finding) and
  are not reachable from NCIT:C2991 (Disease or Disorder), so they fail the
  NCITDiseaseOrFindingTerm dynamic enum and are recorded here in prose rather
  than in mappings.ncit_mappings. No HPO term for sarcopenia as a whole exists
  either; the diagnostic triad is represented by component HP terms in
  phenotypes (HP:0003324, HP:0003199, HP:0001288).
  This entry follows Volumetric_Muscle_Loss in omitting disease_term rather than
  binding an inaccurate one.

mappings:
  icd10cm_mappings:
  - term:
      id: ICD10CM:M62.84
      label: Sarcopenia
    mapping_predicate: skos:exactMatch
    mapping_source: manual curation
    mapping_justification: >-
      ICD-10-CM M62.84 is the billable diagnosis code created for sarcopenia in
      2016; the obsoleted MONDO:0006516 also carried it as an exact match xref.

references:
- reference: PMID:30312372
  title: "Sarcopenia: revised European consensus on definition and diagnosis."
- reference: PMID:32033882
  title: "Asian Working Group for Sarcopenia: 2019 Consensus Update on Sarcopenia Diagnosis and Treatment."

has_subtypes:
- name: Primary
  display_name: Primary (age-related) sarcopenia
  description: >-
    Sarcopenia diagnosed when advancing age is the only apparent cause, with no
    identifiable contributing disease, immobilisation, or nutritional deficit.
  evidence:
  - reference: PMID:35053049
    reference_title: "Effect of Exercise on Secondary Sarcopenia: A Comprehensive Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sarcopenia is diagnosed as primary when there are no other specific causes."
    explanation: States the definitional criterion that separates primary from secondary sarcopenia.
- name: Secondary
  display_name: Secondary sarcopenia
  description: >-
    Sarcopenia attributable to an identifiable driver beyond ageing — disuse and
    immobilisation, inadequate energy or protein intake, or chronic disease such
    as organ failure, malignancy, or inflammatory disease. More common than the
    primary form.
  evidence:
  - reference: PMID:35053049
    reference_title: "Effect of Exercise on Secondary Sarcopenia: A Comprehensive Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, secondary sarcopenia occurs if other factors, including malignancy or organ failure, are evident in addition to aging."
    explanation: Defines secondary sarcopenia by the presence of a driver additional to ageing.
  - reference: PMID:35053049
    reference_title: "Effect of Exercise on Secondary Sarcopenia: A Comprehensive Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The prevalence of secondary sarcopenia is far greater than that of primary sarcopenia and requires special attention."
    explanation: Supports the claim that the secondary form is the more common one.
- name: T2DM-related
  display_name: Type 2 diabetes-related sarcopenia
  description: >-
    Muscle loss in type 2 diabetes, argued to be pathologically distinct from
    both primary sarcopenia and disuse atrophy. The distinguishing feature is a
    reduction in type I (slow oxidative) fibers, which inverts the type II
    preferential atrophy that characterises the primary form and is modelled in
    pathophysiology#Type II Myofiber Atrophy and Fiber-Type Shift. Insulin
    resistance, inflammation, and oxidative stress are the proposed drivers, and
    the mechanism is explicitly unresolved.
  review_notes: >-
    Recorded as a subtype rather than folded into Secondary because the fibre-type
    divergence is a mechanistic claim, not just an etiological label: the
    pathograph's type II atrophy node does not hold for it. No separate
    pathophysiology nodes are curated for this subtype, so the divergence is
    documented here rather than modelled; that is the honest state and a
    follow-up pass should either model it or demote this to a note under
    Secondary. Surfaced by the automated PR review on #10268.
  evidence:
  - reference: PMID:38854688
    reference_title: "Type 2 diabetes mellitus related sarcopenia: a type of muscle loss distinct from sarcopenia and disuse muscle atrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Unlike sarcopenia, T2DM-related sarcopenia is characterized by a reduction in type I fibers, and it differs from disuse muscle atrophy as well."
    explanation: >-
      States the fibre-type divergence that justifies separating this subtype,
      and that it is distinct from disuse atrophy as well as from primary
      sarcopenia.
  - reference: PMID:38854688
    reference_title: "Type 2 diabetes mellitus related sarcopenia: a type of muscle loss distinct from sarcopenia and disuse muscle atrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism involving insulin resistance, inflammatory status, and oxidative stress remains unclear."
    explanation: >-
      Records that the proposed drivers are named but the mechanism is
      unresolved, which is why no pathophysiology nodes are curated for it.
- name: Sarcopenic obesity
  display_name: Sarcopenic obesity
  description: >-
    Concurrent low muscle mass/strength and excess adiposity, in which
    adipose-derived inflammatory signalling and ectopic intramuscular lipid
    amplify anabolic resistance. Outcomes are worse than for either component
    alone.
  evidence:
  - reference: PMID:27891296
    reference_title: "Welcome to the ICD-10 code for sarcopenia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "He also established that obese persons with sarcopenia had worse outcomes than non-obese persons with sarcopenia and obese persons with intact muscle mass."
    explanation: Establishes sarcopenic obesity as a distinct stratum with worse outcomes.


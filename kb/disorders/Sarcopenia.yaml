genetic:
- name: ACTN3
  gene_term:
    preferred_term: ACTN3
    term:
      id: hgnc:165
      label: ACTN3
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:27861536
    reference_title: "Muscle-Related Polymorphisms (MSTN rs1805086 and ACTN3 rs1815739) Are Not Associated with Exceptional Longevity in Japanese Centenarians."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "No definite conclusions can be inferred in relation to EL owing to its lack of association with both rs1815739 and rs1805086."
    explanation: >-
      Recorded as NO_EVIDENCE, not REFUTE. This study genotypes the same ACTN3
      R577X polymorphism but tests it against exceptional longevity, not against
      sarcopenia, so it does not bear on the claim either way. It is cited to
      record that the nearest cached primary source was examined and found not
      to be about this disease, rather than leaving the gene silently unsourced.
  notes: >-
    The common R577X null polymorphism abolishes alpha-actinin-3, a structural
    protein of the fast-twitch (type II) fiber Z-disc. Because type II fibers are
    the ones sarcopenia preferentially destroys, the XX genotype is a plausible
    susceptibility allele for reduced muscle mass and power in old age -- a
    common-variant susceptibility factor, not a causal Mendelian locus.
    Recorded from the deep-research report as a lead: no primary-source snippet
    for the ACTN3-sarcopenia association was verified in this session, so no
    evidence item is attached rather than one manufactured, and the claim is
    deliberately scoped to plausibility. relationship_type is UNKNOWN rather
    than SUSCEPTIBILITY: the latter is defined in the schema as a variant
    conferring susceptibility and is the reading a machine query would take,
    which is more than the sourcing here supports. Tracked by the
    genetic-susceptibility knowledge gap in discussions.
- name: MSTN
  notes: >-
    Myostatin, the secreted TGF-beta-superfamily ligand that signals through the
    type II activin receptors to restrain muscle growth. It is the target of the
    leading investigational drug class in sarcopenia, so the gene is recorded here
    as the pharmacological entry point to the pathway modelled in
    pathophysiology#Myostatin and Activin Receptor Signalling.
    relationship_type is UNKNOWN because no variant-level gene-disease claim is
    made here: every value in GeneDiseaseRelationshipEnum except BIOMARKER and
    UNKNOWN is defined in terms of variants, and the evidence attached is a
    drug-mechanism statement, not a genetic finding. MSTN K153R (rs1805086)
    association studies exist and are cached (PMID:21283721, PMID:36360291) but
    test athletic strength phenotypes rather than sarcopenia, so they were not
    used.
  gene_term:
    preferred_term: MSTN
    term:
      id: hgnc:4223
      label: MSTN
  relationship_type: UNKNOWN
  evidence:
  - reference: PMID:33264516
    reference_title: "Safety and pharmacokinetics of bimagrumab in healthy older and obese adults with body composition changes in the older cohort."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bimagrumab is a human monoclonal antibody that blocks the ActRIIs, preventing the activity of myostatin and other negative skeletal muscle regulators."
    explanation: >-
      Identifies myostatin as a negative regulator of skeletal muscle acting via
      ActRIIs; the relevance to sarcopenia is via the therapeutic response, so
      the support is indirect.
- name: SCN4A
  notes: >-
    Encodes NaV1.4, the skeletal-muscle voltage-gated sodium channel whose
    localized depletion from the post-synaptic neuromuscular junction membrane
    underlies the excitability defect in pathophysiology#Postsynaptic NaV1.4
    Depletion. Implicated through protein-level loss in ageing muscle, not
    through a sarcopenia-associated germline variant — so relationship_type is
    BIOMARKER ("gene whose expression ... status serves as a ... biomarker
    without a required causal role") rather than MODIFIER, which the schema
    defines in terms of variants and which would contradict this note. The
    causal role of the lost gene product is modelled in the pathograph instead.
  gene_term:
    preferred_term: SCN4A
    term:
      id: hgnc:10591
      label: SCN4A
  relationship_type: BIOMARKER
  evidence:
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Across species, immunohistochemistry identified a localized reduction in the voltage-gated sodium channel specific for skeletal muscle (NaV1.4) at the post-synaptic NMJ membrane."
    explanation: Documents the loss of the SCN4A gene product at the junction in sarcopenia.

- name: Polygenic sarcopenia risk loci (UK Biobank)
  gene_term:
    preferred_term: IRS1
    term:
      id: hgnc:6125
      label: IRS1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:36771461
    reference_title: "Identification and Characterization of Genomic Predictors of Sarcopenia and Sarcopenic Obesity Using UK Biobank Data."
    supports: SUPPORT

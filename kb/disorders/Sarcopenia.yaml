differential_diagnoses:
- name: Cachexia
  description: >-
    Distinguished by weight loss: cachexia requires at least 5% weight loss in
    12 months or less plus additional criteria, and is typically a late-stage
    manifestation of chronic disease. Sarcopenia can occur at stable or even
    increased body weight (sarcopenic obesity).
  evidence:
  - reference: PMID:38225199
    reference_title: "Unraveling the causes of sarcopenia: Roles of neuromuscular junction impairment and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cachexia, a systemic wasting condition, is typically considered a late‐stage manifestation of chronic diseases, such as cancer, organ failure, or infections"
    explanation: States the distinction between cachexia and sarcopenia used here.
- name: Frailty
  description: >-
    A broader multisystem syndrome of reduced physiological reserve; sarcopenia is
    its principal muscular component but frailty additionally spans cognition,
    nutrition, and comorbidity.
  evidence:
  - reference: PMID:27891296
    reference_title: "Welcome to the ICD-10 code for sarcopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sarcopenia is the most important cause of frailty in older persons."
    explanation: Establishes the part-whole relationship that distinguishes the two constructs.
- name: Primary myopathy or muscular dystrophy
  description: >-
    Inherited or inflammatory muscle disease presenting with weakness and
    atrophy, but typically with a distinctive distribution, earlier onset, raised
    creatine kinase, or a causal genotype — none of which characterise sarcopenia.
    Note that some acquired neuromuscular conditions are formally included within
    secondary sarcopenia rather than excluded by it.
  evidence:
  - reference: PMID:38225199
    reference_title: "Unraveling the causes of sarcopenia: Roles of neuromuscular junction impairment and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In contrast, secondary sarcopenia is associated with various diseases (Figure 1) (Bauer et al., 2019; Chen et al., 2020; Nishikawa et al., 2016), such as intensive care unit‐acquired weakness (ICU‐AW), amyotrophic lateral sclerosis (ALS), and muscular atrophy due to inadequate exercise and nutrition, and often results in prolonged hospital stays and higher mortality rates"
    explanation: >-
      Supports the caveat that neuromuscular disease can fall inside the
      secondary-sarcopenia category rather than being a clean exclusion.

discussions:
- discussion_id: sarcopenia_nmj_reversibility_in_humans
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does reversing neuromuscular junction transmission failure improve strength in
    humans with sarcopenia, and how much of age-related weakness is attributable
    to this reversible excitability defect rather than to lost contractile tissue?
  attaches_to:
  - pathophysiology#Neuromuscular Junction Transmission Failure
  - treatments#ClC-1 Chloride Channel Inhibition
  rationale: >-
    The human evidence establishes that transmission failure tracks weakness
    severity; the rescue is rodent-only. The attributable fraction matters
    practically, because it sets the ceiling on what an excitability-targeting
    drug could achieve, and it is the one prediction that separates this model
    from the mass-centred account. It is also the question that would explain why
    myostatin-pathway drugs add mass without adding strength.
  proposed_experiments:
  - experiment_id: clc1_inhibition_rct_sarcopenia
    name: Randomised trial of ClC-1 inhibition in older adults with sarcopenia
    description: >-
      Placebo-controlled trial in older adults with confirmed sarcopenia,
      powered on maximal voluntary contraction, with single-fiber EMG measurement
      of transmission failure and DXA muscle mass as co-primary mechanistic
      readouts.
    would_support:
    - pathophysiology#Neuromuscular Junction Transmission Failure
    supporting_outcome:
    - >-
      Strength improves relative to placebo with no corresponding increase in
      appendicular lean mass, and the improvement tracks the reduction in
      measured transmission failure.
    refuting_outcome:
    - >-
      Transmission failure is reduced pharmacologically without any accompanying
      improvement in maximal voluntary contraction, indicating the deficit is not
      rate-limiting for force in humans.

- discussion_id: sarcopenia_rodent_inflammaging_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do rodent ageing models represent the inflammatory arm of human sarcopenia
    well enough to support translational inference about anti-inflammatory
    interventions?
  attaches_to:
  - pathophysiology#Chronic Low-Grade Inflammation
  - animal_models#Mouse
  rationale: >-
    The cross-species transcriptomic comparison found that rodents reproduce the
    mitochondrial changes of human sarcopenia at gene level but the inflammatory
    response only at pathway level. Evidence therefore exists in the model, but
    its fidelity to human inflammaging is the open question — the
    HUMAN_MODEL_MISMATCH case rather than a plain absence of evidence. This
    matters because inflammaging is one of the arms most often nominated as a
    drug target.

- discussion_id: sarcopenia_genetic_susceptibility_unverified
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which common genetic variants actually modify sarcopenia risk, and what is
    the effect size of the widely cited ACTN3 R577X association in older adults?
  attaches_to:
  - genetic#ACTN3
  rationale: >-
    The genetic section rests on leads carried forward from a deep-research
    report without primary-source verification in this session. The ACTN3 and
    GWAS claims are plausible and widely repeated, which is exactly the condition
    under which an unverified claim propagates. Recorded as an explicit gap so
    that a later curation pass verifies or removes them rather than inheriting
    them as established.


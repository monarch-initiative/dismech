  - reference: PMID:42511674
    reference_title: "Biomarkers and Early Mechanisms of Sarcopenia: Central Roles of Mitochondrial Dysfunction, Inflammaging, Cellular Senescence, and Neuromuscular Degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Among the candidate biomarkers, GDF-15, FGF-21, IL-6, TNF-α, CAF22, p16INK4a, p21/CDKN1A, IGF-1, and myostatin appear particularly promising for characterizing the biological heterogeneity of sarcopenia."
    explanation: Lists IGF-1 among the leading candidate biomarkers for sarcopenia.

diagnosis:
- name: Dual-energy X-ray absorptiometry for appendicular lean mass
  description: >-
    DXA-derived appendicular skeletal muscle mass indexed to height is the
    reference method for the muscle-quantity criterion. Office-based
    bioimpedance is the practical substitute; in a pilot comparison one
    consumer BIA scale captured every low-mass participant DXA identified.
  diagnosis_term:
    preferred_term: dual-energy X-ray absorptiometry
    term:
      id: NCIT:C48789
      label: Dual X-ray Absorptiometry
  evidence:
  - reference: PMID:38045877
    reference_title: "Addressing the Main Barrier to Sarcopenia Identification: Utility of Practical Office-Based Bioimpedance Tools Vs. Dual Energy X-ray Absorptiometry (DXA) Body Composition for Identification of Low Muscle Mass in Older Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OMRON captured all low MM participants identified by DXA plus all on DXA diagnostic borderline."
    explanation: >-
      Supports office bioimpedance as a usable substitute for DXA in identifying
      low muscle mass, with DXA as the stated gold standard.
  - reference: PMID:38045877
    reference_title: "Addressing the Main Barrier to Sarcopenia Identification: Utility of Practical Office-Based Bioimpedance Tools Vs. Dual Energy X-ray Absorptiometry (DXA) Body Composition for Identification of Low Muscle Mass in Older Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, sarcopenic obese is the most difficult phenotype, as obesity masks low muscle mass."
    explanation: >-
      Records the diagnostic pitfall specific to has_subtypes#Sarcopenic obesity,
      where adiposity conceals the muscle deficit.
- name: SARC-F screening questionnaire
  description: >-
    Five-item self-report screen recommended by EWGSOP2 for case-finding. The
    conventional cut-off of 4 or more is specific but insensitive; a
    cross-sectional primary-care study argues for lowering it to 2 or more.
  evidence:
  - reference: PMID:40711821
    reference_title: "Assessment of SARC-F Sensitivity for Probable Sarcopenia Among Community-Dwelling Older Adults: Cross-Sectional Questionnaire Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recommended threshold of ≥4 has low sensitivity and high specificity in identifying probable sarcopenia."
    explanation: Records the sensitivity limitation of the conventional SARC-F threshold.
  - reference: PMID:40711821
    reference_title: "Assessment of SARC-F Sensitivity for Probable Sarcopenia Among Community-Dwelling Older Adults: Cross-Sectional Questionnaire Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A SARC-F cut point of ≥2 yielded an area under the curve of 0.77 (95% CI 0.67-0.88), with sensitivity of 0.78, specificity of 0.75, accuracy of 0.77, positive predictive value of 0.31, and negative predictive value of 0.96."
    explanation: >-
      Gives the operating characteristics of the proposed lower threshold. Note
      the positive predictive value of 0.31, which is why SARC-F screens rather
      than diagnoses.

clinical_trials:
- name: NCT06643780
  status: UNKNOWN
  description: >-
    Randomized, double-blind, double-dummy, active-controlled trial of denosumab
    (RANKL inhibition) for sarcopenia in patients with underlying osteoporosis.
  evidence:
  - reference: PMID:40760465
    reference_title: "RANK-ligand inhibition to combat sarcopenia with underlying osteoporosis: a study protocol for a randomized, double-blind, double-dummy, active-controlled trial."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This study aims to investigate the effects of denosumab to treat sarcopenia in patients with underlying osteoporosis."
    explanation: States the trial's objective, from the published protocol.
  - reference: clinicaltrials:NCT06643780
    reference_title: "RANK-ligand Inhibition to Combat Sarcopenia with Underlying Osteoporosis: a Randomized, Double-blind, Double-dummy, Active-Controlled Trial"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The objective of this study was to conduct a randomized, double-blind, double-dummy active controlled trial to determine the efficacy of denosumab in treating sarcopenia with underlying osteoporosis."
    explanation: The ClinicalTrials.gov registration record establishing the trial's identity and design.
  notes: >-
    `phase` is deliberately omitted rather than set to NOT_APPLICABLE. That value
    is a positive claim that the study does not follow FDA phase classification,
    which is almost certainly false for a randomised double-blind drug trial; the

genetic:
- name: ACTN3
  gene_term:
    preferred_term: ACTN3
    term:
      id: hgnc:165
      label: ACTN3
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    The common R577X null polymorphism abolishes alpha-actinin-3, a structural
    protein of the fast-twitch (type II) fiber Z-disc. Because type II fibers are
    the ones sarcopenia preferentially destroys, the XX genotype is a plausible
    susceptibility allele for reduced muscle mass and power in old age -- a
    common-variant susceptibility factor, not a causal Mendelian locus.
    Recorded from the deep-research report as a lead: no primary-source snippet
    for the ACTN3-sarcopenia association was verified in this session, so no
    evidence item is attached rather than one manufactured, and the claim is
    deliberately scoped to plausibility. Tracked by the genetic-susceptibility
    knowledge gap in discussions.
- name: MSTN
  notes: >-
    Myostatin, the secreted TGF-beta-superfamily ligand that signals through the
    type II activin receptors to restrain muscle growth. It is the target of the
    leading investigational drug class in sarcopenia, so the gene is recorded here
    as the pharmacological entry point to the pathway modelled in
    pathophysiology#Myostatin and Activin Receptor Signalling.
  gene_term:
    preferred_term: MSTN
    term:
      id: hgnc:4223
      label: MSTN
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:33264516
    reference_title: "Safety and pharmacokinetics of bimagrumab in healthy older and obese adults with body composition changes in the older cohort."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bimagrumab is a human monoclonal antibody that blocks the ActRIIs, preventing the activity of myostatin and other negative skeletal muscle regulators."
    explanation: >-
      Identifies myostatin as a negative regulator of skeletal muscle acting via
      ActRIIs; the relevance to sarcopenia is via the therapeutic response, so
      the support is indirect.
- name: SCN4A
  notes: >-
    Encodes NaV1.4, the skeletal-muscle voltage-gated sodium channel whose
    localized depletion from the post-synaptic neuromuscular junction membrane
    underlies the excitability defect in pathophysiology#Postsynaptic NaV1.4
    Depletion. Implicated through protein-level loss in ageing muscle, not through
    a sarcopenia-associated germline variant.
  gene_term:
    preferred_term: SCN4A
    term:
      id: hgnc:10591
      label: SCN4A
  relationship_type: MODIFIER
  evidence:
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Across species, immunohistochemistry identified a localized reduction in the voltage-gated sodium channel specific for skeletal muscle (NaV1.4) at the post-synaptic NMJ membrane."
    explanation: Documents the loss of the SCN4A gene product at the junction in sarcopenia.

environmental:
- name: Sedentary lifestyle and physical inactivity
  description: >-
    Chronic low physical activity, prolonged bed rest, and immobilisation
    withdraw the mechanical loading that maintains muscle protein synthesis and
    motor unit function. This is the dominant modifiable driver of secondary
    sarcopenia and accelerates the primary form.
  exposure_term:
    preferred_term: exposure to sedentary lifestyle
    term:
      id: ECTO:6000004
      label: exposure to sedentary lifestyle
  effect: Accelerates muscle loss through disuse atrophy.
  evidence:
  - reference: PMID:40678078
    reference_title: "Molecular constraints of sarcopenia in the ageing muscle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Physical inactivity and immobility, often secondary to chronic illness or frailty, further accelerate sarcopenia by promoting disuse atrophy."
    explanation: States that inactivity and immobility accelerate sarcopenia via disuse atrophy.
  influences_mechanisms:
  - target: Negative Net Muscle Protein Balance
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Unloading removes the principal physiological stimulus to muscle protein
      synthesis, tipping the balance further toward degradation.
    evidence:
    - reference: PMID:38046952
      reference_title: "Ubiquitin-proteasome pathway in skeletal muscle atrophy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Historically, factors like age, physical activity, and prevailing diseases have swayed protein dynamics."
      explanation: >-
        Names physical activity as one of the determinants of the muscle protein
        synthesis/degradation balance this edge targets.

- name: Inadequate dietary protein intake
  description: >-
    Insufficient dietary protein and essential amino acids — from the anorexia of
    ageing, malabsorption, or restrictive diets — deprives ageing muscle of the
    anabolic substrate it already needs in larger quantities because of anabolic
    resistance. The two act together: the same intake that sufficed in youth is
    subthreshold in an old muscle.
  exposure_term:
    preferred_term: exposure to decreased protein in food
    term:
      id: ECTO:0400019
      label: exposure to decreased protein in food
  effect: Deprives ageing muscle of anabolic substrate.
  evidence:
  - reference: PMID:40678078
    reference_title: "Molecular constraints of sarcopenia in the ageing muscle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nutritional factors are also pivotal: anorexia of aging and reduced dietary protein intake lead to suboptimal nutrient availability."
    explanation: Supports reduced dietary protein intake as a nutritional driver in sarcopenia.
  influences_mechanisms:
  - target: Anabolic Resistance
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Low protein intake interacts with the raised anabolic threshold of ageing
      muscle, so the same deficit costs more synthesis than it would in youth.
    evidence:
    - reference: PMID:40678078
      reference_title: "Molecular constraints of sarcopenia in the ageing muscle."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Compounding this is anabolic resistance, a hallmark of aging muscle, in which higher levels of dietary protein and amino acids are required to stimulate muscle protein synthesis effectively."
      explanation: >-
        States the raised protein requirement that makes inadequate intake act on
        the anabolic-resistance node specifically.

- name: Regular resistance exercise
  description: >-
    Habitual progressive resistance and multicomponent training is the strongest
    protective exposure, acting on several arms of the mechanism at once —
    mechanical loading of the anabolic pathway, motor unit recruitment, and
    mitochondrial biogenesis. Modelled as a protective exposure here and as an
    intervention under treatments.
  exposure_term:
    preferred_term: exposure to exercise
    term:
      id: ECTO:6000002
      label: exposure to exercise
  effect: Protective against progression of muscle loss and weakness.
  evidence:
  - reference: PMID:42304276
    reference_title: "The intervention effects of resistance exercise on sarcopenia in older adults: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Resistance exercise exerts significant beneficial effects on handgrip strength, ASMI, gait speed, and physical performance, as assessed by the five-times sit-to-stand test, in older adults with sarcopenia."
    explanation: Meta-analytic support that resistance exercise improves the defining domains of sarcopenia.
  influences_mechanisms:
  - target: Negative Net Muscle Protein Balance
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: DIRECT
    description: >-
      Loading stimulates muscle protein synthesis and restrains the atrogene
      program, moving net balance back toward neutral.
    evidence:
    - reference: PMID:38046952
      reference_title: "Ubiquitin-proteasome pathway in skeletal muscle atrophy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Resistance training or anabolic hormonal stimuli can enhance protein synthesis, resulting in an increase in skeletal muscle cell protein synthesis, leading to an increase in muscle fiber size, a process known as skeletal muscle hypertrophy"
      explanation: >-
        States the mechanism by which resistance training acts on muscle protein
        balance, which is the edge asserted here.

treatments:
- name: Progressive Resistance Exercise Training
  description: >-
    Moderate-to-high intensity progressive resistance training, typically three
    sessions weekly, is the cornerstone intervention and the only one that
    reliably improves strength, mass, and physical performance together. Benefit
    is demonstrable even in frail and multimorbid older adults.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: exercise intervention
    term:
      id: NCIT:C62739
      label: Exercise Intervention
  target_mechanisms:
  - target: Negative Net Muscle Protein Balance
    description: Restores muscle protein balance by stimulating synthesis.
  - target: Loss of Skeletal Muscle Mass, Strength and Quality
    description: Directly improves the strength, mass, and performance domains.
  evidence:
  - reference: PMID:42304276
    reference_title: "The intervention effects of resistance exercise on sarcopenia in older adults: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled mean differences (MD) were 2.95 kg for handgrip strength, 0.15 m/s for gait speed, 0.25 kg/m² for ASMI, and -1.79 s for the five-times sit-to-stand test (all P<0.0001)."
    explanation: Quantifies the pooled effect of resistance exercise across all four outcome domains.
  - reference: PMID:42304276
    reference_title: "The intervention effects of resistance exercise on sarcopenia in older adults: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subgroup analysis of gait speed indicated that shorter intervention cycles (≤12 weeks), younger age (≤75 years), and a weekly training frequency of three sessions yielded larger effect sizes with higher heterogeneity"
    explanation: Supports the three-sessions-per-week regimen described here.

- name: Dietary Protein and Leucine Supplementation
  description: >-
    Increased daily protein intake (roughly 1.0-1.2 g/kg/day, higher with
    inflammatory disease) using high-quality leucine-rich protein, aimed at
    overcoming the raised anabolic threshold of ageing muscle. Most effective
    combined with resistance training rather than alone.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Anabolic Resistance
    description: Supplies substrate above the raised anabolic threshold.
  evidence:
  - reference: PMID:40678078
    reference_title: "Molecular constraints of sarcopenia in the ageing muscle."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Compounding this is anabolic resistance, a hallmark of aging muscle, in which higher levels of dietary protein and amino acids are required to stimulate muscle protein synthesis effectively."
    explanation: >-
      Gives the rationale for raising protein intake; it states the requirement
      rather than reporting a supplementation trial outcome, hence INDIRECT.
  notes: >-
    The precise intake targets in the description come from consensus and
    guideline sources not individually cited here. Treat the numbers as guidance
    rather than as a curated, snippet-verified claim.

- name: Bimagrumab (Anti-Activin Type II Receptor Antibody)
  description: >-
    Investigational human monoclonal antibody blocking the type II activin
    receptors, preventing myostatin and related ligands from restraining muscle
    growth. It reliably increases thigh muscle volume and lean body mass in older
    adults while reducing fat mass. Critically, the phase-1 study detected no
    accompanying change in muscle strength — the mass-versus-function dissociation
    that has recurred across the myostatin-pathway programme and is the main reason
    no drug is yet approved for sarcopenia.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bimagrumab
      term:
        id: NCIT:C116852
        label: Bimagrumab
  target_mechanisms:
  - target: Myostatin and Activin Receptor Signalling
    description: Blocks the receptor through which myostatin and activins restrain muscle growth.
  evidence:
  - reference: PMID:33264516
    reference_title: "Safety and pharmacokinetics of bimagrumab in healthy older and obese adults with body composition changes in the older cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single dose of bimagrumab rapidly increased TMV and LBM and decreased body adiposity in older adults."
    explanation: Supports the muscle mass and body composition effect in the target population.
  - reference: PMID:33264516
    reference_title: "Safety and pharmacokinetics of bimagrumab in healthy older and obese adults with body composition changes in the older cohort."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No change in muscle strength was detected in either bimagrumab group over the study period"
    explanation: >-
      Refutes the claim that the added mass translates into strength. Recorded as
      a separate REFUTE item rather than folded into the SUPPORT item above,
      because the same study cuts both ways on different parts of the claim.
  - reference: PMID:33264516
    reference_title: "Safety and pharmacokinetics of bimagrumab in healthy older and obese adults with body composition changes in the older cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bimagrumab was safe and well tolerated and demonstrated similar PK in older and obese adults."
    explanation: Supports the tolerability statement for this investigational agent.

- name: ClC-1 Chloride Channel Inhibition
  description: >-
    Preclinical strategy that raises muscle fiber excitability by lowering the
    resting chloride conductance, compensating for the reduced postsynaptic NaV1.4
    density rather than trying to restore it. In old rodents it improved
    neuromuscular transmission and muscle function. Distinctive because it targets
    the excitability lesion rather than muscle mass, and so predicts functional
    gain without mass gain — the converse of the myostatin-pathway drugs. No human
    data yet.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Neuromuscular Junction Transmission Failure
    description: Restores the safety factor for neuromuscular transmission.
  evidence:
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ClC-1 chloride ion channel inhibition enhanced muscle excitability and improved NMJ transmission and muscle function in old rodents."
    explanation: The preclinical result this treatment entry is based on.
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, these findings demonstrate that NMJ transmission deficits are a key, reversible driver of sarcopenia and reveal a novel therapeutic target for addressing muscle weakness in aging."
    explanation: States the therapeutic-target claim underlying this entry.
  notes: >-
    Preclinical only. No clinical trial of ClC-1 inhibition in sarcopenia has been
    registered as of this entry's creation, so no clinical_trials record accompanies it.

definitions:
- name: EWGSOP2 sarcopenia case definition
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The dominant European clinical algorithm. Case-find (SARC-F or clinical
    suspicion), then assess muscle strength — low strength alone establishes
    "probable sarcopenia" and is sufficient to start treatment. Confirm with low
    muscle quantity or quality (DXA, BIA, CT, or MRI). Grade severity by physical
    performance (gait speed, SPPB, TUG, 400 m walk); poor performance defines
    severe sarcopenia.
  evidence:
  - reference: PMID:30312372
    reference_title: "Sarcopenia: revised European consensus on definition and diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "focuses on low muscle strength as a key characteristic of sarcopenia, uses detection of low muscle quantity and quality to confirm the sarcopenia diagnosis, and identifies poor physical performance as indicative of severe sarcopenia"
    explanation: The consensus statement of the three-tier algorithm described here.
- name: AWGS 2019 sarcopenia case definition
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The Asian consensus, with population-specific cut-offs and separate community
    and hospital algorithms. Notably introduces "possible sarcopenia" — low
    strength or low physical performance alone — explicitly to enable lifestyle
    intervention in primary care before a confirmatory mass measurement is
    available.
  evidence:
  - reference: PMID:32033882
    reference_title: "Asian Working Group for Sarcopenia: 2019 Consensus Update on Sarcopenia Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AWGS 2019 also introduces \"possible sarcopenia,\" defined by either low muscle strength or low physical performance only, specifically for use in primary health care or community-based health promotion, to enable earlier lifestyle interventions."
    explanation: States the "possible sarcopenia" category and its intended use.

animal_models:
- name: Naturally aged C57BL/6 mouse (28 months)
  species: Mouse
  genotype: Wild-type C57BL/6, aged to 28 months
  publication: PMID:33580198
  description: >-
    Chronological-ageing model with a time course of phenotypic and
    transcriptomic measurements in gastrocnemius muscle, analysed alongside
    matched rat and human data. Its value is the cross-species comparison: it
    identifies which arms of human sarcopenia rodents actually reproduce.
  evidence:
  - reference: PMID:33580198
    reference_title: "Molecular and phenotypic analysis of rodent models reveals conserved and species-specific modulators of human sarcopenia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we generated a time series of phenotypic measurements and RNA sequencing data in mouse gastrocnemius muscle and analyzed them alongside analogous data from rats and humans."
    explanation: Describes the model and the cross-species design that makes it informative for human sarcopenia.
  modeled_mechanisms:
  - target: Loss of Skeletal Muscle Mass, Strength and Quality
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Aged mice lose muscle mass and grip strength together, reproducing the
      defining human combination rather than mass loss alone.
    limitations: >-
      Chronological age is a poor proxy for sarcopenia status even within the
      model; the authors argue muscle mass is the better indicator. Mouse
      lifespan compresses decades of human exposure, and laboratory mice lack
      the comorbidity burden that drives most human secondary sarcopenia.
    readouts:
    - name: All-limb grip strength
      target: Loss of Skeletal Muscle Mass, Strength and Quality
      direction: DECREASED
      interpretation: Functional correlate of the strength domain of the human triad.
      evidence:
      - reference: PMID:33580198
        reference_title: "Molecular and phenotypic analysis of rodent models reveals conserved and species-specific modulators of human sarcopenia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "All-limb grip strength decreased in parallel with muscle mass, reaching a 34.2 ± 3.4% loss in 28 months-old mice compared to 8–18 months-old mice"
        explanation: Reports the measured grip-strength decrement in this model.
    evidence:
    - reference: PMID:33580198
      reference_title: "Molecular and phenotypic analysis of rodent models reveals conserved and species-specific modulators of human sarcopenia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Sarcopenia, the age-related loss of skeletal muscle mass and function, affects 5-13% of individuals aged over 60 years."
      explanation: Frames the human condition the model is being used to represent.
  - target: Mitochondrial Dysfunction and Oxidative Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Transcriptomic comparison shows the mitochondrial arm of human sarcopenia
      is reproduced in rodents.
    limitations: >-
      Inflammatory changes are conserved only at pathway level, not gene level,
      so this model is a poor vehicle for the inflammaging arm specifically.
    evidence:
    - reference: PMID:33580198
      reference_title: "Molecular and phenotypic analysis of rodent models reveals conserved and species-specific modulators of human sarcopenia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Perturbations in the extracellular matrix are shared by rats, while mice recapitulate changes in RNA processing and autophagy."
      explanation: >-
        Establishes which arms this mouse model does and does not carry, which is
        what makes it informative for the mitochondrial/autophagy node in
        particular rather than for sarcopenia generally.
    readouts:
    - name: Muscle transcriptome mitochondrial gene signature
      target: Mitochondrial Dysfunction and Oxidative Stress
      direction: ALTERED
      interpretation: Cross-species conserved transcriptomic correlate of the mitochondrial node.
      evidence:
      - reference: PMID:33580198
        reference_title: "Molecular and phenotypic analysis of rodent models reveals conserved and species-specific modulators of human sarcopenia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that rodents recapitulate mitochondrial changes observed in human sarcopenia, while inflammatory responses are conserved at pathway but not gene level."
        explanation: Establishes both the conserved mitochondrial signature and the limitation noted above.

- name: Aged rat neuromuscular transmission model
  species: Rat
  genotype: Wild-type, aged
  publication: PMID:42424105
  description: >-
    Aged rats used to localise the sarcopenic transmission defect and to test
    both a sufficiency manipulation (acute NaV1.4 blockade in young adults) and a
    rescue (ClC-1 inhibition in old animals).
  evidence:
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Acute NaV1.4 inhibition with μ-conotoxin GIIIB in adult rats reproduced findings of NMJ transmission failure observed in aged rodents and humans."
    explanation: Establishes the rat preparation as reproducing the human transmission phenotype under a defined manipulation.
  modeled_mechanisms:
  - target: Neuromuscular Junction Transmission Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the human finding of NMJ transmission failure and adds the
      electrophysiological localisation to post-synaptic fiber excitability that
      human studies could not provide.
    limitations: >-
      The human arm establishes correlation with weakness severity but not the
      rescue; the ClC-1 benefit is rodent-only, so translation of the therapeutic
      claim is untested.
    readouts:
    - name: Neuromuscular junction transmission failure
      target: Neuromuscular Junction Transmission Failure
      direction: RESTORED
      interpretation: >-
        ClC-1 inhibition reverses the transmission deficit, supporting the
        excitability mechanism rather than fiber loss as its cause.
      evidence:
      - reference: PMID:42424105
        reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "ClC-1 chloride ion channel inhibition enhanced muscle excitability and improved NMJ transmission and muscle function in old rodents."
        explanation: The rescue result this readout records.
    evidence:
    - reference: PMID:42424105
      reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Preclinical experiments showed similar NMJ transmission failure in aged rodents that was associated with localized loss of muscle fiber excitability at the NMJ."
      explanation: Supports treating the aged rodent as informative for the human transmission node.


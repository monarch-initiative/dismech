pathophysiology:

- name: Alpha Motor Neuron Loss and Muscle Fiber Denervation
  description: >-
    Progressive age-related attrition of spinal alpha motor neurons withdraws
    innervation from the muscle fibers of the lost motor units. Denervated fibers
    are either rescued by collateral sprouting from a surviving neighbouring
    motor neuron or are lost, so motor neuron number sets an upper bound on how
    much contractile tissue can be maintained. Fast-twitch (type II) fibers are
    preferentially affected.
  biological_scale: CELLULAR
  role: trigger
  cell_types:
  - preferred_term: alpha motor neuron
    term:
      id: CL:0008038
      label: alpha motor neuron
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  biological_processes:
  - preferred_term: response to denervation
    term:
      id: GO:0014894
      label: response to denervation involved in regulation of muscle adaptation
    modifier: INCREASED
  evidence:
  - reference: PMID:29527694
    reference_title: "Failure to expand the motor unit size to compensate for declining motor unit numbers distinguishes sarcopenic from non-sarcopenic older men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age-related loss of muscle mass is related to the loss of innervating motor neurons and denervation of muscle fibres."
    explanation: States motor neuron loss and denervation as the substrate of age-related muscle loss.
  - reference: PMID:29527694
    reference_title: "Failure to expand the motor unit size to compensate for declining motor unit numbers distinguishes sarcopenic from non-sarcopenic older men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The motor unit numbers were reduced in all groups of old compared with young men"
    explanation: Reports the measured reduction in motor unit number with age in humans.
  - reference: PMID:40678078
    reference_title: "Molecular constraints of sarcopenia in the ageing muscle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Neurodegeneration and age-related muscle fibers denervation further exacerbate muscle loss, particularly affecting fast-twitch fibers, and reduce motor unit integrity."
    explanation: Supports the preferential effect on fast-twitch fibers and on motor unit integrity.
  downstream:
  - target: Neuromuscular Junction Transmission Failure
    causal_link_type: DIRECT
    description: >-
      Withdrawal and remodelling of motor nerve terminals destabilises the
      junction before frank fiber loss.
  - target: Failure of Compensatory Motor Unit Remodeling
    causal_link_type: DIRECT
    description: >-
      Declining motor neuron number is the deficit that collateral reinnervation
      must compensate for.

- name: Neuromuscular Junction Transmission Failure
  description: >-
    Transmission across the neuromuscular junction fails intermittently in weak
    older people and in aged rodents, in proportion to the severity of weakness.
    The lesion is postsynaptic and electrical rather than cholinergic: the
    skeletal-muscle voltage-gated sodium channel NaV1.4 is locally depleted from
    the post-synaptic membrane, so the endplate potential less reliably reaches
    threshold for a propagated action potential. Pharmacological NaV1.4 blockade
    in young adult rats reproduces the phenotype, and lowering the competing
    chloride conductance by inhibiting ClC-1 restores it — making this a
    reversible driver of weakness rather than a downstream marker of fiber loss.
  biological_scale: CELLULAR
  role: driver
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  cellular_components:
  - preferred_term: neuromuscular junction
    term:
      id: GO:0031594
      label: neuromuscular junction
  evidence:
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we demonstrate that weak older individuals exhibit NMJ transmission failure that correlates with muscle weakness severity."
    explanation: Establishes NMJ transmission failure in humans and its correlation with weakness severity.
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Preclinical experiments showed similar NMJ transmission failure in aged rodents that was associated with localized loss of muscle fiber excitability at the NMJ."
    explanation: Localises the defect to muscle fiber excitability at the junction in aged rodents.
  - reference: PMID:38225199
    reference_title: "Unraveling the causes of sarcopenia: Roles of neuromuscular junction impairment and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NMJ instability is considered to be an initiating and driving factor of the pathology of sarcopenia"
    explanation: Review support for placing NMJ instability upstream rather than as a consequence.
  downstream:
  - target: Type II Myofiber Atrophy and Fiber-Type Shift
    causal_link_type: DIRECT
  - target: Loss of Skeletal Muscle Mass, Strength and Quality
    causal_link_type: DIRECT
    description: >-
      Intermittent transmission failure reduces force output independently of how
      much contractile tissue remains, which is one reason strength falls faster
      than mass.
    evidence:
    - reference: PMID:42424105
      reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ClC-1 chloride ion channel inhibition enhanced muscle excitability and improved NMJ transmission and muscle function in old rodents."
      explanation: >-
        Rescuing transmission improves muscle function in old animals, which
        supports the edge from transmission failure to functional loss rather
        than merely their co-occurrence.

- name: Postsynaptic NaV1.4 Depletion
  description: >-
    Immunohistochemistry across humans and rodents shows a localized reduction of
    the skeletal-muscle voltage-gated sodium channel NaV1.4 (SCN4A) at the
    post-synaptic membrane of the neuromuscular junction. Acute pharmacological
    inhibition of NaV1.4 in adult rats is sufficient to reproduce the aged
    transmission phenotype, establishing the channel loss as a cause of the
    excitability defect rather than a correlate.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Across species, immunohistochemistry identified a localized reduction in the voltage-gated sodium channel specific for skeletal muscle (NaV1.4) at the post-synaptic NMJ membrane."
    explanation: Reports the cross-species localisation of NaV1.4 loss to the postsynaptic membrane.
  downstream:
  - target: Neuromuscular Junction Transmission Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42424105
      reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Acute NaV1.4 inhibition with μ-conotoxin GIIIB in adult rats reproduced findings of NMJ transmission failure observed in aged rodents and humans."
      explanation: >-
        A sufficiency experiment: blocking the channel in young animals produces
        the transmission failure, which is evidence for this edge specifically.

- name: Failure of Compensatory Motor Unit Remodeling
  description: >-
    Healthy ageing muscle offsets motor neuron loss by collateral reinnervation,
    enlarging the surviving motor units — measurable as larger motor unit
    potentials. Sarcopenic muscle does not: motor unit potentials in sarcopenic
    older men resemble those of young men rather than those of healthy or
    pre-sarcopenic older men. The distinguishing lesion in sarcopenia is
    therefore not denervation itself, which is near-universal with age, but the
    failure of the rescue mechanism.
  biological_scale: TISSUE
  locations:
  - preferred_term: musculature of limb
    term:
      id: UBERON:0004480
      label: musculature of limb
  evidence:
  - reference: PMID:29527694
    reference_title: "Failure to expand the motor unit size to compensate for declining motor unit numbers distinguishes sarcopenic from non-sarcopenic older men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest that a failure to expand the motor unit size distinguishes sarcopenic from pre-sarcopenic muscles."
    explanation: States the study's central finding, which is the claim of this node.
  - reference: PMID:29527694
    reference_title: "Failure to expand the motor unit size to compensate for declining motor unit numbers distinguishes sarcopenic from non-sarcopenic older men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reinnervation of denervated muscle fibres probably expands the motor unit size in the non-sarcopenic and pre-sarcopenic old, but not in the sarcopenic old."
    explanation: Contrasts successful with failed reinnervation across the sarcopenia spectrum.
  downstream:
  - target: Type II Myofiber Atrophy and Fiber-Type Shift
    causal_link_type: DIRECT
    description: Fibers not rescued by reinnervation atrophy and are lost.

- name: Mitochondrial Dysfunction and Oxidative Stress
  description: >-
    Ageing myofibers accumulate mitochondrial damage with reduced biogenesis,
    impaired oxidative phosphorylation, defective mitophagy, and excess reactive
    oxygen species. Because mitochondria are enriched on both sides of the
    neuromuscular junction and support its transmission, this deficit both
    destabilises the junction and lowers the ATP available for contraction and
    for protein synthesis, placing it upstream of several other arms of the chain.
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  role: driver
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  biological_processes:
  - preferred_term: cellular respiration
    term:
      id: GO:0045333
      label: cellular respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:42511674
    reference_title: "Biomarkers and Early Mechanisms of Sarcopenia: Central Roles of Mitochondrial Dysfunction, Inflammaging, Cellular Senescence, and Neuromuscular Degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mitochondrial dysfunction appears to represent an early upstream event that promotes excessive reactive oxygen species production, defective mitophagy, inflammatory activation, and cellular senescence."
    explanation: Supports placing mitochondrial dysfunction upstream of inflammation and senescence in this chain.
  - reference: PMID:33580198
    reference_title: "Molecular and phenotypic analysis of rodent models reveals conserved and species-specific modulators of human sarcopenia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that rodents recapitulate mitochondrial changes observed in human sarcopenia, while inflammatory responses are conserved at pathway but not gene level."
    explanation: Cross-species transcriptomic support that mitochondrial change is a conserved feature of sarcopenic muscle.
  downstream:
  - target: Neuromuscular Junction Transmission Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38225199
      reference_title: "Unraveling the causes of sarcopenia: Roles of neuromuscular junction impairment and mitochondrial dysfunction."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Mitochondrial dysfunction is increasingly recognized as a critical contributor to NMJ instability, which leads to skeletal muscle atrophy"
      explanation: Asserts the mitochondria-to-NMJ causal direction that this edge encodes.
  - target: Chronic Low-Grade Inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Muscle Satellite Cell Exhaustion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Chronic Low-Grade Inflammation
  description: >-
    Persistent sterile elevation of circulating IL-6 and TNF-alpha ("inflammaging")
    activates NF-kappaB signalling in myofibers, which drives the atrogene program
    and suppresses myogenic differentiation. It is a systemic input to muscle
    rather than a muscle-intrinsic lesion, which is why it links sarcopenia to the
    wider multimorbidity of ageing.
  biological_scale: ORGANISM
  conforms_to: "inflammaging#Chronic Low-Grade Sterile Inflammation"
  role: amplifier
  biological_processes:
  - preferred_term: positive regulation of NF-kappaB signalling
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: INCREASED
  evidence:
  - reference: PMID:42511674
    reference_title: "Biomarkers and Early Mechanisms of Sarcopenia: Central Roles of Mitochondrial Dysfunction, Inflammaging, Cellular Senescence, and Neuromuscular Degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Chronic inflammation, mediated primarily through IL-6 and TNF-α, further accelerates muscle catabolism and regenerative failure, whereas senescence-associated pathways impair satellite cell function and muscle repair."
    explanation: Names the mediators and the two consequences this node routes to downstream.
  - reference: PMID:38046952
    reference_title: "Ubiquitin-proteasome pathway in skeletal muscle atrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Various studies suggest that the gene expression of Atrogin-1 and MuRF1 is differentially regulated by FOXO and NF-κB pathways"
    explanation: >-
      Substantiates the NF-kappaB half of this node's claim and its GO
      annotation: NF-kappaB is one of the two pathways regulating the atrogene
      program, which the mediator snippet above does not itself state.
  downstream:
  - target: Ubiquitin-Proteasome Myofibrillar Proteolysis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Muscle Satellite Cell Exhaustion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Muscle Satellite Cell Exhaustion
  description: >-
    Skeletal muscle satellite cells — the resident stem cells that repair and
    regenerate myofibers — decline in number and in proliferative and
    differentiative capacity with age, in a niche degraded by chronic inflammation,
    mitochondrial dysfunction, and accumulating senescent cells. Regenerative
    failure converts what would be recoverable injury into permanent fiber loss.
  biological_scale: CELLULAR
  conforms_to: "stem_cell_exhaustion#Decline in Stem Cell Self-Renewal and Function"
  cell_types:
  - preferred_term: skeletal muscle satellite cell
    term:
      id: CL:0000594
      label: skeletal muscle satellite cell
  biological_processes:
  - preferred_term: skeletal muscle satellite cell proliferation
    term:
      id: GO:0014841
      label: skeletal muscle satellite cell proliferation
    modifier: DECREASED
  - preferred_term: skeletal muscle tissue regeneration
    term:
      id: GO:0043403
      label: skeletal muscle tissue regeneration
    modifier: DECREASED
  evidence:
  - reference: PMID:40678078
    reference_title: "Molecular constraints of sarcopenia in the ageing muscle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "With age, both the structure and function of these components deteriorate: myonuclei become disorganized, gene expression skews toward catabolic, inflammatory, and fibrotic pathways, and satellite cell numbers and activity decline."
    explanation: Supports the decline in satellite cell number and activity with age.
  downstream:
  - target: Type II Myofiber Atrophy and Fiber-Type Shift
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Myosteatosis and Intramuscular Fibro-Adipogenic Infiltration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Declining Anabolic Hormone Signalling
  description: >-
    Circulating growth hormone, IGF-1, testosterone, and estrogen fall with age
    (the sex-hormone half of that claim is what the cited evidence covers
    directly; the GH/IGF-1 decline is stated by the same reviews but is not
    separately quoted here). Because IGF-1 signalling through PI3K/AKT is the principal positive regulator
    of muscle protein content — driving mTOR-dependent synthesis while restraining
    FOXO-driven atrogene transcription — its withdrawal simultaneously weakens
    synthesis and releases the brake on degradation.
  biological_scale: ORGANISM
  role: driver
  evidence:
  - reference: PMID:40724988
    reference_title: "Sarcopenia: Current Insights into Molecular Mechanisms, Diagnostics, and Emerging Interventional Approaches."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Particular attention is given to the role of declining sex hormones, such as testosterone and estrogen, as key drivers of anabolic resistance and muscle loss during aging."
    explanation: Supports declining sex hormones as drivers of anabolic resistance and muscle loss.
  - reference: PMID:38046952
    reference_title: "Ubiquitin-proteasome pathway in skeletal muscle atrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The IGF-1/PI3K/AKT pathway, by inhibiting FOXO, prevents the upregulation of Atrogin-1 and suppresses muscle atrophy"
    explanation: >-
      Establishes the mechanism by which loss of IGF-1 signalling releases the
      atrogene program, linking this node to proteolysis downstream.
  downstream:
  - target: Anabolic Resistance
    causal_link_type: DIRECT
  - target: Ubiquitin-Proteasome Myofibrillar Proteolysis
    causal_link_type: DIRECT

- name: Anabolic Resistance
  description: >-
    Ageing muscle mounts a blunted muscle-protein-synthesis response to the same
    anabolic stimulus — dietary protein and leucine, or a bout of resistance
    exercise — so that a larger dose is needed to reach the same synthetic rate.
    Systems-level analysis indicates that no single age-related impairment
    accounts for it; the resistant phenotype emerges only when several dysregulated
    nutrient-sensing and signalling processes act together, which is why
    single-target interventions under-perform.
  biological_scale: CELLULAR
  role: driver
  notes: >-
    Deliberately not conformed to deregulated_nutrient_sensing. The closest
    module node, "Autophagy Suppression and Anabolic Bias", describes *active*
    mTORC1 holding autophagy suppressed; anabolic resistance is the inverse — a
    blunted mTORC1 response to feeding, annotated here as TORC1 signaling
    DECREASED. Conforming would assert the opposite of what this node claims.
    A module node for blunted anabolic signalling would be the right target if
    one is added.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: TORC1 signaling
    term:
      id: GO:0038202
      label: TORC1 signaling
    modifier: DECREASED
  evidence:
  - reference: PMID:42464764
    reference_title: "Multifactorial nature of anabolic resistance in ageing skeletal muscle: A systems modelling study."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Sarcopenia, the age-related loss of skeletal muscle mass and function, is primarily caused by anabolic resistance, which is the blunted stimulation of muscle protein synthesis (MPS) and impaired suppression of muscle protein breakdown following anabolic stimuli such as feeding."
    explanation: Defines anabolic resistance as modelled here and places it upstream of muscle loss.
  - reference: PMID:42464764
    reference_title: "Multifactorial nature of anabolic resistance in ageing skeletal muscle: A systems modelling study."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Instead, anabolic resistance emerged only when multiple impairments operated together."
    explanation: >-
      Supports the multifactorial claim in this node's description; the finding
      comes from a kinetic simulation, not a human feeding study.
  - reference: PMID:40678078
    reference_title: "Molecular constraints of sarcopenia in the ageing muscle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Compounding this is anabolic resistance, a hallmark of aging muscle, in which higher levels of dietary protein and amino acids are required to stimulate muscle protein synthesis effectively."
    explanation: Independent review support for the raised anabolic threshold.
  downstream:
  - target: Negative Net Muscle Protein Balance
    causal_link_type: DIRECT

- name: Myostatin and Activin Receptor Signalling
  description: >-
    Myostatin (GDF8) and activins signal through the type II activin receptors
    (ActRIIA/ActRIIB) and SMAD2/3 to restrain muscle growth, opposing
    IGF-1/AKT/mTOR anabolic signalling and reinforcing atrogene expression. The
    axis is the leading pharmacological target class in sarcopenia. Antibody
    blockade of the receptors increased thigh muscle volume and lean body mass in
    a phase-1 study of 24 healthy older and obese adults, which is the available
    evidence that the pathway restrains mass in ageing muscle — though that study
    did not reach significance on appendicular lean mass specifically, and no
    trial has yet shown the pathway is over-active in sarcopenia rather than
    merely blockable.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: activin receptor activity
    term:
      id: GO:0017002
      label: activin receptor activity
  evidence:
  - reference: PMID:33264516
    reference_title: "Safety and pharmacokinetics of bimagrumab in healthy older and obese adults with body composition changes in the older cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bimagrumab is a human monoclonal antibody that blocks the ActRIIs, preventing the activity of myostatin and other negative skeletal muscle regulators."
    explanation: Identifies the receptor and ligands of the axis modelled by this node.
  - reference: PMID:33264516
    reference_title: "Safety and pharmacokinetics of bimagrumab in healthy older and obese adults with body composition changes in the older cohort."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single dose of bimagrumab rapidly increased TMV and LBM and decreased body adiposity in older adults."
    explanation: >-
      Therapeutic blockade increasing muscle volume and lean mass in older adults
      supports the pathway restraining mass; the inference runs from the drug
      response back to the mechanism, hence INDIRECT.
  downstream:
  - target: Anabolic Resistance
    causal_link_type: DIRECT
  - target: Ubiquitin-Proteasome Myofibrillar Proteolysis
    causal_link_type: DIRECT

- name: Ubiquitin-Proteasome Myofibrillar Proteolysis
  description: >-
    FOXO3, de-repressed by weakened IGF-1/PI3K/AKT signalling and driven further
    by NF-kappaB, transcribes the muscle-specific E3 ubiquitin ligases atrogin-1
    (FBXO32) and MuRF1 (TRIM63), which ubiquitinate myofibrillar proteins for
    proteasomal destruction. This is the dominant degradative route in skeletal
    muscle atrophy, acting alongside autophagy-lysosomal, calpain, and caspase
    systems.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:38046952
    reference_title: "Ubiquitin-proteasome pathway in skeletal muscle atrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Atrogin-1 and MuRF1 are significantly upregulated by FOXO3 in all muscle atrophy scenarios"
    explanation: Names the transcription factor and the two E3 ligases central to this node.
  - reference: PMID:38046952
    reference_title: "Ubiquitin-proteasome pathway in skeletal muscle atrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the ubiquitin-proteasome pathway emerges as an especially cardinal avenue for intracellular protein degradation, wielding pronounced influence over the muscle atrophy trajectory"
    explanation: Supports treating the ubiquitin-proteasome route as the dominant degradative arm.
  downstream:
  - target: Negative Net Muscle Protein Balance
    causal_link_type: DIRECT

- name: Negative Net Muscle Protein Balance
  description: >-
    The convergence point of the anabolic and catabolic arms: when degradation
    persistently exceeds synthesis, myofiber protein content falls and atrophy
    follows. Muscle mass is maintained only while this balance is neutral, so both
    a blunted synthetic response and an accelerated degradative one produce the
    same result.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:38046952
    reference_title: "Ubiquitin-proteasome pathway in skeletal muscle atrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Under catabolic conditions, protein degradation surpasses synthesis, leading to muscle weakness and atrophy."
    explanation: States the balance claim that defines this node.
  downstream:
  - target: Type II Myofiber Atrophy and Fiber-Type Shift
    causal_link_type: DIRECT

- name: Type II Myofiber Atrophy and Fiber-Type Shift
  description: >-
    Fast-twitch type II fibers lose cross-sectional area preferentially, while
    fibers rescued by collateral reinnervation from slow motor neurons take on
    type I properties, producing fiber-type grouping and a net shift toward slow
    phenotype. Because type II fibers generate the highest power, this
    disproportionately costs explosive strength — the capacity needed to arrest a
    stumble — which is part of why strength declines faster than mass.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: type II (fast) skeletal muscle fiber
    term:
      id: CL:0000190
      label: fast muscle cell
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  biological_processes:
  - preferred_term: skeletal muscle atrophy
    term:
      id: GO:0014732
      label: skeletal muscle atrophy
    modifier: INCREASED
  evidence:
  - reference: PMID:40678078
    reference_title: "Molecular constraints of sarcopenia in the ageing muscle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Neurodegeneration and age-related muscle fibers denervation further exacerbate muscle loss, particularly affecting fast-twitch fibers, and reduce motor unit integrity."
    explanation: Supports the preferential loss of fast-twitch fibers via denervation.
  downstream:
  - target: Loss of Skeletal Muscle Mass, Strength and Quality
    causal_link_type: DIRECT

- name: Myosteatosis and Intramuscular Fibro-Adipogenic Infiltration
  description: >-
    Space vacated by lost myofibers is filled by adipose and fibrous tissue, and
    lipid also accumulates ectopically within fibers. Intramuscular ceramide
    accumulation impairs insulin signalling and suppresses protein synthesis via
    eIF2-alpha phosphorylation, so myosteatosis is not merely a passive
    radiological marker of poor muscle quality but feeds back onto anabolic
    resistance. This arm is amplified in sarcopenic obesity.
  biological_scale: TISSUE
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:25139155
    reference_title: "Muscle ectopic fat deposition contributes to anabolic resistance in obese sarcopenic old rats through eIF2α activation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Hence, OR were more prone to ectopic muscle lipid accumulation than YR, leading to decreased muscle protein anabolism."
    explanation: >-
      Old rats accumulate ectopic muscle lipid and lose protein anabolism,
      supporting the feedback from myosteatosis to reduced anabolism.
  downstream:
  - target: Anabolic Resistance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25139155
      reference_title: "Muscle ectopic fat deposition contributes to anabolic resistance in obese sarcopenic old rats through eIF2α activation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In C2C12 cells, palmitate-induced ceramide accumulation was associated with a decreased protein synthesis together with upregulated eIF2α phosphorylation."
      explanation: >-
        Gives the molecular step (ceramide to eIF2-alpha phosphorylation to
        reduced synthesis) that this edge asserts.
  - target: Loss of Skeletal Muscle Mass, Strength and Quality
    causal_link_type: DIRECT

- name: Loss of Skeletal Muscle Mass, Strength and Quality
  description: >-
    The clinical convergence node. Reduced contractile tissue, degraded muscle
    quality, and unreliable neuromuscular transmission together produce the
    measurable triad on which the diagnosis rests: low strength (the primary
    criterion), low muscle quantity or quality (confirmatory), and poor physical
    performance (which grades severity). Strength falls out of proportion to mass,
    which is why EWGSOP2 moved strength to the front of the definition.
  biological_scale: ORGANISM
  locations:
  - preferred_term: skeletal muscle organ
    term:
      id: UBERON:0014892
      label: skeletal muscle organ, vertebrate
  evidence:
  - reference: PMID:30312372
    reference_title: "Sarcopenia: revised European consensus on definition and diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sarcopenia is a progressive and generalised skeletal muscle disorder that is associated with increased likelihood of adverse outcomes including falls, fractures, physical disability and mortality."
    explanation: The consensus statement of the clinical endpoint this node represents.
  - reference: PMID:30312372
    reference_title: "Sarcopenia: revised European consensus on definition and diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these revised guidelines, muscle strength comes to the forefront, as it is recognised that strength is better than mass in predicting adverse outcomes"
    explanation: Supports the strength-over-mass claim made in this node's description.

mechanistic_hypotheses:
- hypothesis_group_id: nmj_excitability_failure
  hypothesis_label: Neuromuscular Junction Excitability Failure as a Reversible Driver
  status: EMERGING
  description: >-
    Holds that a substantial and pharmacologically reversible share of age-related
    weakness comes not from lost contractile tissue but from failure to reliably
    excite the tissue that remains — postsynaptic NaV1.4 depletion lowering the
    safety factor for neuromuscular transmission. Its distinguishing prediction is
    that restoring fiber excitability improves strength without changing muscle
    mass. Evidence is strong in aged rodents; the human data establish that
    transmission failure tracks weakness severity but do not yet include a
    therapeutic trial, so this is recorded as emerging rather than canonical.
  evidence:
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, these findings demonstrate that NMJ transmission deficits are a key, reversible driver of sarcopenia and reveal a novel therapeutic target for addressing muscle weakness in aging."
    explanation: >-
      The paper's own summary claim, which is the hypothesis this group states.
      Graded MODEL_ORGANISM because the reversibility half of the claim rests on
      the rodent rescue arm.
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This excitability defect, distinct from potential synaptic cholinergic transmission abnormalities, represents a novel disease mechanism of sarcopenia."
    explanation: >-
      Supports the specific claim that distinguishes this hypothesis: the lesion
      is one of fiber excitability rather than cholinergic transmission.
- hypothesis_group_id: canonical_multifactorial_convergence
  hypothesis_label: Canonical Multifactorial Convergence on Muscle Protein Balance
  status: CANONICAL
  description: >-
    The mainstream account: denervation, mitochondrial dysfunction, inflammaging,
    hormonal decline, satellite-cell exhaustion, and anabolic resistance are
    partially independent inputs that converge on a persistently negative muscle
    protein balance and on regenerative failure. It explains why single-target
    interventions have repeatedly failed to restore function and why exercise —
    which acts on many arms at once — remains the most effective treatment.
  evidence:
  - reference: PMID:38225199
    reference_title: "Unraveling the causes of sarcopenia: Roles of neuromuscular junction impairment and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sarcopenia is caused by complex and interdependent pathophysiological mechanisms, including aging, neuromuscular junction impairment, mitochondrial dysfunction, insulin resistance, lipotoxicity, endocrine factors, oxidative stress, and inflammation."
    explanation: Enumerates the interdependent inputs this hypothesis group asserts converge.
  - reference: PMID:42464764
    reference_title: "Multifactorial nature of anabolic resistance in ageing skeletal muscle: A systems modelling study."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Clinically, interventions targeting single mechanisms are unlikely to fully restore muscle anabolism in older adults, particularly when multiple impairments coexist."
    explanation: >-
      Supports the hypothesis's distinguishing prediction that single-target
      interventions under-perform; derived from simulation rather than trial data.


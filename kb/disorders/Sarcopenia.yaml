review_notes: >-
  Curated with a claude_code deep-research report (research/Sarcopenia-deep-research-claude_code.md;
  falcon was requested but its account was out of credits, so the run fell back
  and recorded the substitution in its own frontmatter). Every snippet in this
  entry was taken from a locally cached reference, not from the report body: the
  report attributes to EWGSOP2 a definition of sarcopenia as "a condition
  characterized by loss of muscle mass and function occurring as a natural part
  of aging process", which does not appear in that paper and inverts its actual
  position that sarcopenia is a muscle disease rather than a normal ageing
  correlate. The report's own reference validation was otherwise clean (37/37
  resolved, 0 off topic) and its term validation flagged MONDO:0006516 as
  obsolete, which is consistent with the finding recorded in notes.
  This entry was revised after an adversarial pre-PR review. That pass corrected
  three evidence_source misgradings (a review and an editorial graded
  HUMAN_CLINICAL, and a C2C12 cell-line result graded MODEL_ORGANISM rather than
  IN_VITRO), replaced two model-link evidence items whose exact quotes did not
  support the claims their explanations made, removed a conforms_to that pointed
  at a module node asserting the opposite of this entry's Anabolic Resistance
  node, rebound alpha motor neuron to the precise CL:0008038, corrected three
  genetic relationship_type values that asserted variant-level claims their own
  notes disclaimed, and sourced a previously uncited NF-kappaB claim.
  Consensus-statement citations (PMID:30312372, PMID:32033882) are left as
  HUMAN_CLINICAL. That is a deliberate, arguable call rather than an oversight:
  CLAUDE.md routes "expert consensus without data" to OTHER, but these papers
  synthesize human cohort data and the quoted passages are diagnostic criteria
  derived from it. A reviewer who prefers OTHER has a reasonable case.
  Gaps a future pass should close: the genetic section remains lead-quality
  rather than verified (see discussions) -- the ACTN3 entry is deliberately
  UNKNOWN with a NO_EVIDENCE citation rather than an asserted association, and
  the GWAS record is keyed on a single representative locus because the schema's
  genetic[] entries are gene-keyed. Vitamin D is recorded on association grounds
  with no interventional trial cited. The denosumab trial's phase and status are
  unverified placeholders pending a registry fetch. There are no comorbidity
  entries, despite sarcopenia being a well-documented convergence point for CKD,
  heart failure, COPD, cirrhosis, and cancer, and no computational_models record
  although PMID:42464764 is a published multiscale kinetic model of anabolic
  resistance in this disease. Sarcopenia is also a strong future
  candidate for a kb/modules/ mechanism module in the "disease-like phenotypes"
  family, since several existing entries (Werner_Syndrome, Cushings_Syndrome,
  Ovarian_High-Grade_Serous_Carcinoma) already reference it as a downstream
  convergence; that was left out of scope here because the module family
  convention expects both an HP and a MONDO identifier and sarcopenia has neither.

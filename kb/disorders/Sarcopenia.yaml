biochemical:
- name: Interleukin-6
  notes: >-
    Circulating IL-6 is a core inflammaging mediator and one of the most
    consistently nominated candidate biomarkers of sarcopenia. It reports on
    pathophysiology#Chronic Low-Grade Inflammation rather than on muscle mass
    directly.
  biomarker_term:
    preferred_term: interleukin-6
    term:
      id: NCIT:C20451
      label: Interleukin-6
  evidence:
  - reference: PMID:42511674
    reference_title: "Biomarkers and Early Mechanisms of Sarcopenia: Central Roles of Mitochondrial Dysfunction, Inflammaging, Cellular Senescence, and Neuromuscular Degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Chronic inflammation, mediated primarily through IL-6 and TNF-α, further accelerates muscle catabolism and regenerative failure, whereas senescence-associated pathways impair satellite cell function and muscle repair."
    explanation: Identifies IL-6 as a principal mediator of the inflammatory arm.
  readouts:
  - target: Chronic Low-Grade Inflammation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Circulating IL-6 is the one marker of the three in this section with
      evidence that it discriminates in older adults: a meta-analysis of 8,154
      patients against 33,967 controls found it elevated with a significant
      odds-ratio signal, and concluded it is usable as a peripheral inflammation
      marker where TNF and IL-1-beta are not. MONITORING rather than DIAGNOSTIC
      because that evidence is across age-related comorbidities generally, not a
      sarcopenia case-finding study; it tracks the inflammatory state this node
      represents, and no sarcopenia decision threshold exists for it.
    evidence:
    - reference: PMID:42511674
      reference_title: "Biomarkers and Early Mechanisms of Sarcopenia: Central Roles of Mitochondrial Dysfunction, Inflammaging, Cellular Senescence, and Neuromuscular Degeneration."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Chronic inflammation, mediated primarily through IL-6 and TNF-α, further accelerates muscle catabolism and regenerative failure"
      explanation: Supports the mapping this link encodes - IL-6 measures the inflammatory mechanism, rather than muscle mass directly.
    - reference: PMID:38495887
      reference_title: "Level of IL-6, TNF, and IL-1β and age-related diseases: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The potential diagnostic usefulness of IL-6 was confirmed by odds ratio (OR) analysis (OR: 1.03, 95% CI (1.01; 1.05), p=0.0029)."
      explanation: >-
        The quantitative basis for recording an endpoint context at all. Note how
        small the odds ratio is: the signal is real and the effect is marginal,
        which is consistent with the field's position that no single biomarker is
        yet usable alone.
- name: Tumor necrosis factor alpha
  notes: >-
    TNF-alpha, the second principal inflammaging cytokine implicated in muscle
    catabolism, nominated alongside IL-6 as a candidate circulating marker. The
    nomination does not survive contact with the measurement literature: see the
    readout link below, where a meta-analysis of over 42,000 subjects found
    circulating TNF did not separate older patients with comorbidities from
    controls. The mechanism claim and the biomarker claim come apart here, and
    the entry keeps both rather than dropping either.
  biomarker_term:
    preferred_term: tumor necrosis factor
    term:
      id: NCIT:C20535
      label: Tumor Necrosis Factor
  evidence:
  - reference: PMID:42511674
    reference_title: "Biomarkers and Early Mechanisms of Sarcopenia: Central Roles of Mitochondrial Dysfunction, Inflammaging, Cellular Senescence, and Neuromuscular Degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Among the candidate biomarkers, GDF-15, FGF-21, IL-6, TNF-α, CAF22, p16INK4a, p21/CDKN1A, IGF-1, and myostatin appear particularly promising for characterizing the biological heterogeneity of sarcopenia."
    explanation: Lists TNF-alpha among the leading candidate biomarkers for sarcopenia.
  readouts:
  - target: Chronic Low-Grade Inflammation
    relationship: READOUT_OF
    direction: POSITIVE
    interpretation: >-
      TNF-alpha mediates the inflammatory mechanism, so the mechanistic link is
      sound, but its performance as a circulating marker is not. The same
      meta-analysis that validated IL-6 found no significant difference in TNF
      between older patients with comorbidities and controls. endpoint_context is
      therefore deliberately omitted: there is no established use context to
      record, and tagging this MONITORING alongside IL-6 would assert a
      measurability the evidence contradicts.
    evidence:
    - reference: PMID:42511674
      reference_title: "Biomarkers and Early Mechanisms of Sarcopenia: Central Roles of Mitochondrial Dysfunction, Inflammaging, Cellular Senescence, and Neuromuscular Degeneration."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Chronic inflammation, mediated primarily through IL-6 and TNF-α, further accelerates muscle catabolism and regenerative failure"
      explanation: Supports the mechanistic half of this link - TNF-alpha is a mediator of the node it is mapped to.
    - reference: PMID:38495887
      reference_title: "Level of IL-6, TNF, and IL-1β and age-related diseases: a systematic review and meta-analysis."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "For TNF, however, the difference was statistically insignificant."
      explanation: >-
        Refutes the measurement half: circulating TNF did not separate older
        patients from controls in a meta-analysis of over 42,000 subjects.
        Recorded as REFUTE on the readout link rather than on the biomarker
        entry, because what fails is the claim that this analyte reports the
        node, not the claim that TNF-alpha participates in it.
    - reference: PMID:38495887
      reference_title: "Level of IL-6, TNF, and IL-1β and age-related diseases: a systematic review and meta-analysis."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "IL-6, unlike TNF and IL-1β, could be a useful and convenient marker of peripheral inflammation in older adults with various comorbidities."
      explanation: >-
        The authors' own conclusion, stated as a contrast that singles TNF out.
        Kept as a second REFUTE item because it generalizes the null above from
        one comparison to a usability verdict.
- name: Insulin-like growth factor 1
  notes: >-
    Reduced circulating IGF-1 reports on pathophysiology#Declining Anabolic
    Hormone Signalling. Like the other candidates it is not diagnostic on its
    own.
    No reference_ranges are recorded for any of the three markers in this
    section. None has an established sarcopenia decision threshold, and the
    cited review states outright that no single biomarker has sufficient
    diagnostic accuracy for routine use, so recording cut-offs would overstate
    the field.
  biomarker_term:
    preferred_term: insulin-like growth factor I
    term:
      id: NCIT:C16743
      label: Insulin-Like Growth Factor I
  evidence:
  - reference: PMID:42511674
    reference_title: "Biomarkers and Early Mechanisms of Sarcopenia: Central Roles of Mitochondrial Dysfunction, Inflammaging, Cellular Senescence, and Neuromuscular Degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Among the candidate biomarkers, GDF-15, FGF-21, IL-6, TNF-α, CAF22, p16INK4a, p21/CDKN1A, IGF-1, and myostatin appear particularly promising for characterizing the biological heterogeneity of sarcopenia."
    explanation: Lists IGF-1 among the leading candidate biomarkers for sarcopenia.
  readouts:
  - target: Declining Anabolic Hormone Signalling
    relationship: READOUT_OF
    direction: NEGATIVE
    interpretation: >-
      Direction is NEGATIVE because the linked node is a decline: higher
      circulating IGF-1 tracks with less of it, not more. endpoint_context is
      omitted - the human evidence here is a genetic association in UK Biobank
      rather than a study of IGF-1 measurement in a clinical pathway, so no use
      context has been established.
    evidence:
    - reference: PMID:38046952
      reference_title: "Ubiquitin-proteasome pathway in skeletal muscle atrophy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The IGF-1/PI3K/AKT pathway, by inhibiting FOXO, prevents the upregulation of Atrogin-1 and suppresses muscle atrophy"
      explanation: >-
        Establishes that IGF-1 is the ligand of the signalling axis this node
        names, which is what makes measuring it a readout of the node rather
        than a correlate of it.
    - reference: PMID:36771461
      reference_title: "Identification and Characterization of Genomic Predictors of Sarcopenia and Sarcopenic Obesity Using UK Biobank Data."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "whereas protective alleles were positively associated with bone mineral density, serum testosterone, IGF1, and 25-hydroxyvitamin D levels"
      explanation: >-
        Supports the NEGATIVE direction from the human side: alleles protective
        against sarcopenia track higher serum IGF-1. INDIRECT because this is a
        genetic association, not a measurement of IGF-1 against the mechanism.

diagnosis:
- name: Dual-energy X-ray absorptiometry for appendicular lean mass
  description: >-
    DXA-derived appendicular skeletal muscle mass indexed to height is the
    reference method for the muscle-quantity criterion. Office-based
    bioimpedance is the practical substitute; in a pilot comparison one
    consumer BIA scale captured every low-mass participant DXA identified.
  diagnosis_term:
    preferred_term: dual-energy X-ray absorptiometry
    term:
      id: NCIT:C48789
      label: Dual X-ray Absorptiometry
  evidence:
  - reference: PMID:38045877
    reference_title: "Addressing the Main Barrier to Sarcopenia Identification: Utility of Practical Office-Based Bioimpedance Tools Vs. Dual Energy X-ray Absorptiometry (DXA) Body Composition for Identification of Low Muscle Mass in Older Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OMRON captured all low MM participants identified by DXA plus all on DXA diagnostic borderline."
    explanation: >-
      Supports office bioimpedance as a usable substitute for DXA in identifying
      low muscle mass, with DXA as the stated gold standard.
  - reference: PMID:38045877
    reference_title: "Addressing the Main Barrier to Sarcopenia Identification: Utility of Practical Office-Based Bioimpedance Tools Vs. Dual Energy X-ray Absorptiometry (DXA) Body Composition for Identification of Low Muscle Mass in Older Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, sarcopenic obese is the most difficult phenotype, as obesity masks low muscle mass."
    explanation: >-
      Records the diagnostic pitfall specific to has_subtypes#Sarcopenic obesity,
      where adiposity conceals the muscle deficit.
- name: SARC-F screening questionnaire
  description: >-
    Five-item self-report screen recommended by EWGSOP2 for case-finding. The
    conventional cut-off of 4 or more is specific but insensitive; a
    cross-sectional primary-care study argues for lowering it to 2 or more.
  evidence:
  - reference: PMID:40711821
    reference_title: "Assessment of SARC-F Sensitivity for Probable Sarcopenia Among Community-Dwelling Older Adults: Cross-Sectional Questionnaire Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recommended threshold of ≥4 has low sensitivity and high specificity in identifying probable sarcopenia."
    explanation: Records the sensitivity limitation of the conventional SARC-F threshold.
  - reference: PMID:40711821
    reference_title: "Assessment of SARC-F Sensitivity for Probable Sarcopenia Among Community-Dwelling Older Adults: Cross-Sectional Questionnaire Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A SARC-F cut point of ≥2 yielded an area under the curve of 0.77 (95% CI 0.67-0.88), with sensitivity of 0.78, specificity of 0.75, accuracy of 0.77, positive predictive value of 0.31, and negative predictive value of 0.96."
    explanation: >-
      Gives the operating characteristics of the proposed lower threshold. Note
      the positive predictive value of 0.31, which is why SARC-F screens rather
      than diagnoses.

clinical_trials:
- name: NCT06643780
  status: UNKNOWN
  description: >-
    Randomized, double-blind, double-dummy, active-controlled trial of denosumab
    (RANKL inhibition) for sarcopenia in patients with underlying osteoporosis.
  evidence:
  - reference: PMID:40760465
    reference_title: "RANK-ligand inhibition to combat sarcopenia with underlying osteoporosis: a study protocol for a randomized, double-blind, double-dummy, active-controlled trial."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This study aims to investigate the effects of denosumab to treat sarcopenia in patients with underlying osteoporosis."
    explanation: States the trial's objective, from the published protocol.
  - reference: clinicaltrials:NCT06643780
    reference_title: "RANK-ligand Inhibition to Combat Sarcopenia with Underlying Osteoporosis: a Randomized, Double-blind, Double-dummy, Active-Controlled Trial"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The objective of this study was to conduct a randomized, double-blind, double-dummy active controlled trial to determine the efficacy of denosumab in treating sarcopenia with underlying osteoporosis."
    explanation: The ClinicalTrials.gov registration record establishing the trial's identity and design.
  notes: >-
    `phase` is deliberately omitted rather than set to NOT_APPLICABLE. That value
    is a positive claim that the study does not follow FDA phase classification,
    which is almost certainly false for a randomised double-blind drug trial; the
    ClinicalTrials.gov record fetched here is a summary and carries no phase
    field, and ClinicalTrialPhaseEnum has no UNKNOWN value. An omitted slot is
    the honest encoding. `status: UNKNOWN` is an explicit enum value and is kept.

progression:
- phase: Peak muscle mass and gradual decline
  age_range: 20-60 years
  notes: >-
    Muscle mass and strength peak in the third to fourth decade, plateau, then
    decline gradually from roughly age 40. Recorded from the deep-research
    report's synthesis; no single primary source for the trajectory was
    snippet-verified in this session, so no evidence item is attached.
- phase: Accelerated decline and clinical sarcopenia
  age_range: 60+ years
  notes: >-
    Decline accelerates after 60-70, when prevalence rises steeply and the
    diagnostic thresholds are crossed. Falls are the outcome most consistently
    attributable to sarcopenia in this phase.
  evidence:
  - reference: PMID:40898141
    reference_title: "Association between sarcopenia and falls, fractures, hospital readmission, and all-cause mortality in older adults with endocrine disorders: a longitudinal study of aging in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sarcopenia significantly increased the risk of falls (adjusted HR: 2.38, 95% CI: 1.06-5.35, P = 0.036) but was not associated with hospital readmissions (adjusted HR: 0.87, 95% CI: 0.49-1.53, P = 0.630), fractures (adjusted HR: 1.01, 95% CI: 0.20-3.92, P = 0.992), or all-cause mortality (adjusted HR: 1.81, 95% CI: 0.49-6.67, P = 0.374)."
    explanation: >-
      Quantifies the fall risk and, importantly, records the null results for
      fracture, readmission, and mortality in this cohort. Quoted in full rather
      than trimmed to the positive finding, because the consensus literature
      attributes all four outcomes to sarcopenia and this study supports only
      one of them.
  - reference: PMID:40898141
    reference_title: "Association between sarcopenia and falls, fractures, hospital readmission, and all-cause mortality in older adults with endocrine disorders: a longitudinal study of aging in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Impaired gait speed was a strong predictor of increased fall risk (adjusted HR: 5.00, 95%CI: 1.27 ~ 19.90, P = 0.022)"
    explanation: >-
      Supports the physical-performance domain as the component carrying the
      fall risk, consistent with EWGSOP2 using it to grade severity.

differential_diagnoses:
- name: Cachexia
  description: >-
    Distinguished by weight loss: cachexia requires at least 5% weight loss in
    12 months or less plus additional criteria, and is typically a late-stage
    manifestation of chronic disease. Sarcopenia can occur at stable or even
    increased body weight (sarcopenic obesity).
  evidence:
  - reference: PMID:38225199
    reference_title: "Unraveling the causes of sarcopenia: Roles of neuromuscular junction impairment and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cachexia, a systemic wasting condition, is typically considered a late‐stage manifestation of chronic diseases, such as cancer, organ failure, or infections"
    explanation: States the distinction between cachexia and sarcopenia used here.
- name: Frailty
  description: >-
    A broader multisystem syndrome of reduced physiological reserve; sarcopenia is
    its principal muscular component but frailty additionally spans cognition,
    nutrition, and comorbidity.
  evidence:
  - reference: PMID:27891296
    reference_title: "Welcome to the ICD-10 code for sarcopenia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sarcopenia is the most important cause of frailty in older persons."
    explanation: Establishes the part-whole relationship that distinguishes the two constructs.
- name: Primary myopathy or muscular dystrophy
  description: >-
    Inherited or inflammatory muscle disease presenting with weakness and
    atrophy, but typically with a distinctive distribution, earlier onset, raised
    creatine kinase, or a causal genotype — none of which characterise sarcopenia.
    Note that some acquired neuromuscular conditions are formally included within
    secondary sarcopenia rather than excluded by it.
  evidence:
  - reference: PMID:38225199
    reference_title: "Unraveling the causes of sarcopenia: Roles of neuromuscular junction impairment and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In contrast, secondary sarcopenia is associated with various diseases (Figure 1) (Bauer et al., 2019; Chen et al., 2020; Nishikawa et al., 2016), such as intensive care unit‐acquired weakness (ICU‐AW), amyotrophic lateral sclerosis (ALS), and muscular atrophy due to inadequate exercise and nutrition, and often results in prolonged hospital stays and higher mortality rates"
    explanation: >-
      Supports the caveat that neuromuscular disease can fall inside the
      secondary-sarcopenia category rather than being a clean exclusion.

discussions:
- discussion_id: sarcopenia_nmj_reversibility_in_humans
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does reversing neuromuscular junction transmission failure improve strength in
    humans with sarcopenia, and how much of age-related weakness is attributable
    to this reversible excitability defect rather than to lost contractile tissue?
  attaches_to:
  - pathophysiology#Neuromuscular Junction Transmission Failure
  - treatments#ClC-1 Chloride Channel Inhibition
  rationale: >-
    The human evidence establishes that transmission failure tracks weakness
    severity; the rescue is rodent-only. The attributable fraction matters
    practically, because it sets the ceiling on what an excitability-targeting
    drug could achieve, and it is the one prediction that separates this model
    from the mass-centred account. It is also the question that would explain why
    myostatin-pathway drugs add mass without adding strength.
  proposed_experiments:
  - experiment_id: clc1_inhibition_rct_sarcopenia
    name: Randomised trial of ClC-1 inhibition in older adults with sarcopenia
    description: >-
      Placebo-controlled trial in older adults with confirmed sarcopenia,
      powered on maximal voluntary contraction, with single-fiber EMG measurement
      of transmission failure and DXA muscle mass as co-primary mechanistic
      readouts.
    would_support:
    - pathophysiology#Neuromuscular Junction Transmission Failure
    supporting_outcome:
    - >-
      Strength improves relative to placebo with no corresponding increase in
      appendicular lean mass, and the improvement tracks the reduction in
      measured transmission failure.
    refuting_outcome:
    - >-
      Transmission failure is reduced pharmacologically without any accompanying
      improvement in maximal voluntary contraction, indicating the deficit is not
      rate-limiting for force in humans.

- discussion_id: sarcopenia_rodent_inflammaging_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do rodent ageing models represent the inflammatory arm of human sarcopenia
    well enough to support translational inference about anti-inflammatory
    interventions?
  attaches_to:
  - pathophysiology#Chronic Low-Grade Inflammation
  - animal_models#Naturally aged C57BL/6 mouse (28 months)
  rationale: >-
    The cross-species transcriptomic comparison found that rodents reproduce the
    mitochondrial changes of human sarcopenia at gene level but the inflammatory
    response only at pathway level. Evidence therefore exists in the model, but
    its fidelity to human inflammaging is the open question — the
    HUMAN_MODEL_MISMATCH case rather than a plain absence of evidence. This
    matters because inflammaging is one of the arms most often nominated as a
    drug target.
  proposed_experiments:
  - experiment_id: cross_species_muscle_inflammatory_profiling
    name: Species-matched inflammatory profiling of sarcopenic human and rodent muscle
    description: >-
      Profile the inflammatory transcriptome and cytokine content of skeletal
      muscle from aged humans and aged rodents stratified by measured sarcopenia
      status rather than by chronological age, and test whether the gene-level
      divergence reported across species is a true biological difference or an
      artefact of comparing animals and people matched on age instead of on
      muscle phenotype. The stratification is the point: the source study's own
      conclusion is that muscle mass, not age, indicates muscle health.
    would_support:
    - pathophysiology#Chronic Low-Grade Inflammation
    supporting_outcome:
    - >-
      Phenotype-matched aged rodents and humans show concordant muscle
      inflammatory gene expression, indicating the previously reported gene-level
      divergence came from age-matching rather than from species biology, and
      that rodent inflammaging findings can be carried across.
    refuting_outcome:
    - >-
      The divergence persists after phenotype matching, establishing that rodent
      muscle inflammaging is not a faithful model of the human arm and that
      anti-inflammatory targets validated only in rodents should not be assumed
      to translate.

- discussion_id: sarcopenia_genetic_susceptibility_unverified
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which common genetic variants actually modify sarcopenia risk, and what is
    the effect size of the widely cited ACTN3 R577X association in older adults?
  attaches_to:
  - genetic#ACTN3
  rationale: >-
    The genetic section rests on leads carried forward from a deep-research
    report without primary-source verification in this session. The ACTN3 and
    GWAS claims are plausible and widely repeated, which is exactly the condition
    under which an unverified claim propagates. Recorded as an explicit gap so
    that a later curation pass verifies or removes them rather than inheriting
    them as established.

- discussion_id: sarcopenia_mass_versus_strength_endpoints
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do interventions that reliably add muscle mass in older adults so often
    fail to add strength or physical function, and which mechanism should a
    sarcopenia trial's primary endpoint therefore measure?
  attaches_to:
  - pathophysiology#Loss of Skeletal Muscle Mass, Strength and Quality
  - pathophysiology#Neuromuscular Junction Transmission Failure
  - treatments#Bimagrumab (Anti-Activin Type II Receptor Antibody)
  - treatments#Myostatin Ligand Neutralization (Landogrozumab, Trevogrumab)
  - treatments#Selective Androgen Receptor Modulation (Enobosarm, MK-0773)
  rationale: >-
    The dissociation is now the single most consistent finding across this
    entry's pharmacological treatments, and it recurs across drug classes that
    share no mechanism. Bimagrumab raised lean body mass by 7% in older adults
    with sarcopenia and produced no functional difference from placebo; MK-0773
    raised lean mass in sarcopenic women with no strength or function gain;
    landogrozumab met its lean-mass endpoint while moving only some performance
    measures. Reading these as three separate disappointments misses that they
    are one result repeated. The pattern is not absolute: the earlier 40-person
    bimagrumab study did find gait-speed and walking-distance gains in its
    slowest-walking participants, which is itself a lead - it suggests the
    dissociation may be a question of who is treated rather than of what the
    drug does. Two explanations are on the table and they imply
    different drug-development programmes: either added mass is added
    low-quality tissue, or force production in aged muscle is limited by
    something other than contractile mass - excitability and neuromuscular
    transmission being the candidate this entry already models. Which is right
    determines whether strength, specific force, or mass belongs in the primary
    endpoint, and PMID:42706321 argues the field should shift away from mass.
  proposed_experiments:
  - experiment_id: mass_gain_quality_partition
    name: Partitioning drug-induced lean-mass gain into contractile quality and excitability
    description: >-
      In a trial of an agent with an established lean-mass effect, measure
      appendicular lean mass, single-fiber specific force from biopsy, and
      neuromuscular transmission by single-fiber EMG in the same participants
      before and after treatment, and test which of the two intermediate
      measures accounts for the gap between the mass change and the
      maximal-voluntary-contraction change.
    would_support:
    - pathophysiology#Neuromuscular Junction Transmission Failure
    supporting_outcome:
    - >-
      Mass rises without a corresponding rise in single-fiber specific force, and
      the residual weakness tracks unchanged transmission failure - indicating
      that force is limited by excitability and that mass-adding drugs cannot
      close the gap on their own.
    refuting_outcome:
    - >-
      Single-fiber specific force falls as mass rises, with transmission
      unchanged, indicating the added tissue is of lower contractile quality and
      that the problem is the anabolic drug's tissue product rather than the
      neuromuscular arm.


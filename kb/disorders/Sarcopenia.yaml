genetic:
- name: ACTN3
  gene_term:
    preferred_term: ACTN3
    term:
      id: hgnc:165
      label: ACTN3
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:27861536
    reference_title: "Muscle-Related Polymorphisms (MSTN rs1805086 and ACTN3 rs1815739) Are Not Associated with Exceptional Longevity in Japanese Centenarians."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "No definite conclusions can be inferred in relation to EL owing to its lack of association with both rs1815739 and rs1805086."
    explanation: >-
      Recorded as NO_EVIDENCE, not REFUTE. This study genotypes the same ACTN3
      R577X polymorphism but tests it against exceptional longevity, not against
      sarcopenia, so it does not bear on the claim either way. It is cited to
      record that the nearest cached primary source was examined and found not
      to be about this disease, rather than leaving the gene silently unsourced.
  notes: >-
    The common R577X null polymorphism abolishes alpha-actinin-3, a structural
    protein of the fast-twitch (type II) fiber Z-disc. Because type II fibers are
    the ones sarcopenia preferentially destroys, the XX genotype is a plausible
    susceptibility allele for reduced muscle mass and power in old age -- a
    common-variant susceptibility factor, not a causal Mendelian locus.
    Recorded from the deep-research report as a lead: no primary-source snippet
    for the ACTN3-sarcopenia association was verified in this session, so no
    evidence item is attached rather than one manufactured, and the claim is
    deliberately scoped to plausibility. relationship_type is UNKNOWN rather
    than SUSCEPTIBILITY: the latter is defined in the schema as a variant
    conferring susceptibility and is the reading a machine query would take,
    which is more than the sourcing here supports. Tracked by the
    genetic-susceptibility knowledge gap in discussions.
- name: MSTN
  notes: >-
    Myostatin, the secreted TGF-beta-superfamily ligand that signals through the
    type II activin receptors to restrain muscle growth. It is the target of the
    leading investigational drug class in sarcopenia, so the gene is recorded here
    as the pharmacological entry point to the pathway modelled in
    pathophysiology#Myostatin and Activin Receptor Signalling.
    relationship_type is UNKNOWN because no variant-level gene-disease claim is
    made here: every value in GeneDiseaseRelationshipEnum except BIOMARKER and
    UNKNOWN is defined in terms of variants, and the evidence attached is a
    drug-mechanism statement, not a genetic finding. MSTN K153R (rs1805086)
    association studies exist and are cached (PMID:21283721, PMID:36360291) but
    test athletic strength phenotypes rather than sarcopenia, so they were not
    used.
  gene_term:
    preferred_term: MSTN
    term:
      id: hgnc:4223
      label: MSTN
  relationship_type: UNKNOWN
  evidence:
  - reference: PMID:33264516
    reference_title: "Safety and pharmacokinetics of bimagrumab in healthy older and obese adults with body composition changes in the older cohort."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bimagrumab is a human monoclonal antibody that blocks the ActRIIs, preventing the activity of myostatin and other negative skeletal muscle regulators."
    explanation: >-
      Identifies myostatin as a negative regulator of skeletal muscle acting via
      ActRIIs; the relevance to sarcopenia is via the therapeutic response, so
      the support is indirect.
- name: SCN4A
  notes: >-
    Encodes NaV1.4, the skeletal-muscle voltage-gated sodium channel whose
    localized depletion from the post-synaptic neuromuscular junction membrane
    underlies the excitability defect in pathophysiology#Postsynaptic NaV1.4
    Depletion. Implicated through protein-level loss in ageing muscle, not
    through a sarcopenia-associated germline variant — so relationship_type is
    BIOMARKER ("gene whose expression ... status serves as a ... biomarker
    without a required causal role") rather than MODIFIER, which the schema
    defines in terms of variants and which would contradict this note. The
    causal role of the lost gene product is modelled in the pathograph instead.
  gene_term:
    preferred_term: SCN4A
    term:
      id: hgnc:10591
      label: SCN4A
  relationship_type: BIOMARKER
  evidence:
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Across species, immunohistochemistry identified a localized reduction in the voltage-gated sodium channel specific for skeletal muscle (NaV1.4) at the post-synaptic NMJ membrane."
    explanation: Documents the loss of the SCN4A gene product at the junction in sarcopenia.

- name: Polygenic sarcopenia risk loci (UK Biobank)
  gene_term:
    preferred_term: IRS1
    term:
      id: hgnc:6125
      label: IRS1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:36771461
    reference_title: "Identification and Characterization of Genomic Predictors of Sarcopenia and Sarcopenic Obesity Using UK Biobank Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By combining summary statistics of genome-wide association studies (GWAS) of handgrip strength, lean mass and walking pace, we have identified 78 independent SNPs (from 73 loci) associated with all three traits with consistent effect directions."
    explanation: >-
      Establishes the polygenic architecture recorded by this entry: 78 SNPs
      across 73 loci associated with all three sarcopenia-defining traits in the
      same direction.
  - reference: PMID:36771461
    reference_title: "Identification and Characterization of Genomic Predictors of Sarcopenia and Sarcopenic Obesity Using UK Biobank Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 78 SNPs, 55 polymorphisms were also associated with body fat percentage and 25 polymorphisms with type 2 diabetes (T2D), indicating that sarcopenia, obesity and T2D share many common risk alleles."
    explanation: >-
      Supports shared genetic architecture with adiposity and type 2 diabetes,
      which is the genetic counterpart of the sarcopenic-obesity subtype.
  notes: >-
    This is a stand-in record for a polygenic signal rather than a single-gene
    claim: the schema's genetic[] entries are gene-keyed, so IRS1 is used as the
    representative locus and the evidence describes the aggregate GWAS result.
    The other reported lean-mass loci (FTO, HSD17B11, VCAN, ADAMTSL3) and
    handgrip loci (ESR1, NOS3, KLF5, HLA-DQA1) are named here rather than given
    separate entries, because no per-gene primary source was verified for them
    in this session. Effect sizes are not recorded; a polygenic risk score is
    not clinically actionable for sarcopenia today.

environmental:
- name: Sedentary lifestyle and physical inactivity
  description: >-
    Chronic low physical activity, prolonged bed rest, and immobilisation
    withdraw the mechanical loading that maintains muscle protein synthesis and
    motor unit function. This is the dominant modifiable driver of secondary
    sarcopenia and accelerates the primary form.
  exposure_term:
    preferred_term: exposure to sedentary lifestyle
    term:
      id: ECTO:6000004
      label: exposure to sedentary lifestyle
  effect: Accelerates muscle loss through disuse atrophy.
  evidence:
  - reference: PMID:40678078
    reference_title: "Molecular constraints of sarcopenia in the ageing muscle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Physical inactivity and immobility, often secondary to chronic illness or frailty, further accelerate sarcopenia by promoting disuse atrophy."
    explanation: States that inactivity and immobility accelerate sarcopenia via disuse atrophy.
  influences_mechanisms:
  - target: Negative Net Muscle Protein Balance
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Unloading removes the principal physiological stimulus to muscle protein
      synthesis, tipping the balance further toward degradation.
    evidence:
    - reference: PMID:38046952
      reference_title: "Ubiquitin-proteasome pathway in skeletal muscle atrophy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Historically, factors like age, physical activity, and prevailing diseases have swayed protein dynamics."
      explanation: >-
        Names physical activity as one of the determinants of the muscle protein
        synthesis/degradation balance this edge targets.

- name: Inadequate dietary protein intake
  description: >-
    Insufficient dietary protein and essential amino acids — from the anorexia of
    ageing, malabsorption, or restrictive diets — deprives ageing muscle of the
    anabolic substrate it already needs in larger quantities because of anabolic
    resistance. The two act together: the same intake that sufficed in youth is
    subthreshold in an old muscle.
  exposure_term:
    preferred_term: exposure to decreased protein in food
    term:
      id: ECTO:0400019
      label: exposure to decreased protein in food
  effect: Deprives ageing muscle of anabolic substrate.
  evidence:
  - reference: PMID:40678078
    reference_title: "Molecular constraints of sarcopenia in the ageing muscle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nutritional factors are also pivotal: anorexia of aging and reduced dietary protein intake lead to suboptimal nutrient availability."
    explanation: Supports reduced dietary protein intake as a nutritional driver in sarcopenia.
  influences_mechanisms:
  - target: Anabolic Resistance
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Low protein intake interacts with the raised anabolic threshold of ageing
      muscle, so the same deficit costs more synthesis than it would in youth.
    evidence:
    - reference: PMID:40678078
      reference_title: "Molecular constraints of sarcopenia in the ageing muscle."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Compounding this is anabolic resistance, a hallmark of aging muscle, in which higher levels of dietary protein and amino acids are required to stimulate muscle protein synthesis effectively."
      explanation: >-
        States the raised protein requirement that makes inadequate intake act on
        the anabolic-resistance node specifically.

- name: Regular resistance exercise
  description: >-
    Habitual progressive resistance and multicomponent training is the strongest
    protective exposure, acting on several arms of the mechanism at once —
    mechanical loading of the anabolic pathway, motor unit recruitment, and
    mitochondrial biogenesis. Modelled as a protective exposure here and as an
    intervention under treatments.
  exposure_term:
    preferred_term: exposure to exercise
    term:
      id: ECTO:6000002
      label: exposure to exercise
  effect: Protective against progression of muscle loss and weakness.
  evidence:
  - reference: PMID:42304276
    reference_title: "The intervention effects of resistance exercise on sarcopenia in older adults: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Resistance exercise exerts significant beneficial effects on handgrip strength, ASMI, gait speed, and physical performance, as assessed by the five-times sit-to-stand test, in older adults with sarcopenia."
    explanation: Meta-analytic support that resistance exercise improves the defining domains of sarcopenia.
  influences_mechanisms:
  - target: Negative Net Muscle Protein Balance
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: DIRECT
    description: >-
      Loading stimulates muscle protein synthesis and restrains the atrogene
      program, moving net balance back toward neutral.
    evidence:
    - reference: PMID:38046952
      reference_title: "Ubiquitin-proteasome pathway in skeletal muscle atrophy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Resistance training or anabolic hormonal stimuli can enhance protein synthesis, resulting in an increase in skeletal muscle cell protein synthesis, leading to an increase in muscle fiber size, a process known as skeletal muscle hypertrophy"
      explanation: >-
        States the mechanism by which resistance training acts on muscle protein
        balance, which is the edge asserted here.

inheritance:
- name: Polygenic inheritance
  description: >-
    Sarcopenia risk is distributed across many common variants of small effect
    interacting with age, activity, nutrition, and comorbidity. There is no
    Mendelian mode of inheritance, and penetrance in the monogenic sense does
    not apply.
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  evidence:
  - reference: PMID:36771461
    reference_title: "Identification and Characterization of Genomic Predictors of Sarcopenia and Sarcopenic Obesity Using UK Biobank Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The substantial decline in skeletal muscle mass, strength, and gait speed is a sign of severe sarcopenia, which may partly depend on genetic risk factors."
    explanation: >-
      Supports a partial, multi-locus genetic contribution rather than a
      Mendelian one; the same study's 73-locus result is cited under genetic.

treatments:
- name: Progressive Resistance Exercise Training
  description: >-
    Moderate-to-high intensity progressive resistance training, typically three
    sessions weekly, is the cornerstone intervention and the only one that
    reliably improves strength, mass, and physical performance together. Benefit
    is demonstrable even in frail and multimorbid older adults.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: exercise intervention
    term:
      id: NCIT:C62739
      label: Exercise Intervention
  target_mechanisms:
  - target: Negative Net Muscle Protein Balance
    description: Restores muscle protein balance by stimulating synthesis.
  - target: Loss of Skeletal Muscle Mass, Strength and Quality
    description: Directly improves the strength, mass, and performance domains.
  evidence:
  - reference: PMID:42304276
    reference_title: "The intervention effects of resistance exercise on sarcopenia in older adults: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled mean differences (MD) were 2.95 kg for handgrip strength, 0.15 m/s for gait speed, 0.25 kg/m² for ASMI, and -1.79 s for the five-times sit-to-stand test (all P<0.0001)."
    explanation: Quantifies the pooled effect of resistance exercise across all four outcome domains.
  - reference: PMID:42304276
    reference_title: "The intervention effects of resistance exercise on sarcopenia in older adults: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subgroup analysis of gait speed indicated that shorter intervention cycles (≤12 weeks), younger age (≤75 years), and a weekly training frequency of three sessions yielded larger effect sizes with higher heterogeneity"
    explanation: Supports the three-sessions-per-week regimen described here.

- name: Dietary Protein and Leucine Supplementation
  description: >-
    Increased daily protein intake (roughly 1.0-1.2 g/kg/day, higher with
    inflammatory disease) using high-quality leucine-rich protein, aimed at
    overcoming the raised anabolic threshold of ageing muscle. Most effective
    combined with resistance training rather than alone.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Anabolic Resistance
    description: Supplies substrate above the raised anabolic threshold.
  evidence:
  - reference: PMID:40678078
    reference_title: "Molecular constraints of sarcopenia in the ageing muscle."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Compounding this is anabolic resistance, a hallmark of aging muscle, in which higher levels of dietary protein and amino acids are required to stimulate muscle protein synthesis effectively."
    explanation: >-
      Gives the rationale for raising protein intake; it states the requirement
      rather than reporting a supplementation trial outcome, hence INDIRECT.
  notes: >-
    The precise intake targets in the description come from consensus and
    guideline sources not individually cited here. Treat the numbers as guidance
    rather than as a curated, snippet-verified claim.

- name: Vitamin D Repletion
  description: >-
    Correction of vitamin D deficiency, recommended where a deficit is
    documented rather than as universal supplementation. Vitamin D status is one
    of the traits positively associated with the protective allele set in
    sarcopenia GWAS, and repletion is a standard adjunct alongside resistance
    training and protein intake.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholecalciferol (vitamin D3)
      term:
        id: CHEBI:28940
        label: calciol
  evidence:
  - reference: PMID:36771461
    reference_title: "Identification and Characterization of Genomic Predictors of Sarcopenia and Sarcopenic Obesity Using UK Biobank Data."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas protective alleles were positively associated with bone mineral density, serum testosterone, IGF1, and 25-hydroxyvitamin D levels, height, intelligence, cognitive performance, educational attainment, income, physical activity, ground coffee drinking"
    explanation: >-
      Genetically protective alleles track higher 25-hydroxyvitamin D, which
      supports vitamin D status as relevant to sarcopenia risk. INDIRECT: this
      is a genetic association, not a supplementation trial.
  notes: >-
    No interventional trial of vitamin D in sarcopenia is cited here. The
    deep-research report describes a 2024 RCT (eldecalcitol, DPVD ancillary
    study) reporting reduced sarcopenia onset in prediabetes, but that paper was
    not fetched or snippet-verified in this session, so the claim is not made.
    This treatment is therefore recorded on mechanism and association grounds
    only and should be strengthened with trial evidence.

- name: Bimagrumab (Anti-Activin Type II Receptor Antibody)
  description: >-
    Investigational human monoclonal antibody blocking the type II activin
    receptors, preventing myostatin and related ligands from restraining muscle
    growth. In a phase-1 study of 24 healthy older and obese volunteers it
    increased thigh muscle volume and lean body mass while reducing fat mass,
    although appendicular lean mass did not reach significance. Critically, the
    same study detected no
    accompanying change in muscle strength — the mass-versus-function dissociation
    that has recurred across the myostatin-pathway programme and is the main reason
    no drug is yet approved for sarcopenia.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bimagrumab
      term:
        id: NCIT:C116852
        label: Bimagrumab
  target_mechanisms:
  - target: Myostatin and Activin Receptor Signalling
    description: Blocks the receptor through which myostatin and activins restrain muscle growth.
  evidence:
  - reference: PMID:33264516
    reference_title: "Safety and pharmacokinetics of bimagrumab in healthy older and obese adults with body composition changes in the older cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single dose of bimagrumab rapidly increased TMV and LBM and decreased body adiposity in older adults."
    explanation: Supports the muscle mass and body composition effect in the target population.
  - reference: PMID:33264516
    reference_title: "Safety and pharmacokinetics of bimagrumab in healthy older and obese adults with body composition changes in the older cohort."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No change in muscle strength was detected in either bimagrumab group over the study period"
    explanation: >-
      Refutes the claim that the added mass translates into strength. Recorded as
      a separate REFUTE item rather than folded into the SUPPORT item above,
      because the same study cuts both ways on different parts of the claim.
  - reference: PMID:33264516
    reference_title: "Safety and pharmacokinetics of bimagrumab in healthy older and obese adults with body composition changes in the older cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bimagrumab was safe and well tolerated and demonstrated similar PK in older and obese adults."
    explanation: Supports the tolerability statement for this investigational agent.
  - reference: PMID:41248895
    reference_title: "Bimagrumab: Novel Medical Therapy for Inclusion Body Myositis, Sarcopenia, and Medication-Induced Lean Body Mass Loss."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It has improved muscle mass in patients with sarcopenia and posthip fracture recovery, while only showing minimal improvements in mobility and strength."
    explanation: >-
      A second, independent source for the mass-versus-function dissociation,
      and one that extends it beyond the phase-1 study to sarcopenia patients and
      post-hip-fracture recovery. Recorded as SUPPORT for the dissociation claim
      the description makes; the REFUTE item above carries the strength null from
      the primary trial.
  - reference: PMID:33074327
    reference_title: "Bimagrumab vs Optimized Standard of Care for Treatment of Sarcopenia in Community-Dwelling Older Adults: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bimagrumab was safe and well-tolerated and increased lean body mass by 7%"
    explanation: >-
      The mass effect measured in the population that matters - community-dwelling
      adults 70 and over meeting gait-speed and muscle criteria for sarcopenia -
      rather than in the healthy and obese volunteers of the phase 1 study.
  - reference: PMID:33074327
    reference_title: "Bimagrumab vs Optimized Standard of Care for Treatment of Sarcopenia in Community-Dwelling Older Adults: A Randomized Clinical Trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "This randomized clinical trial found no significant difference between participants treated with bimagrumab vs placebo among older adults with sarcopenia"
    explanation: >-
      The definitive negative result for this drug in this disease: a 6-month
      randomised trial whose primary endpoint was physical function, in which the
      7% lean-mass gain above did not produce a functional difference. This is
      the strongest single piece of evidence in the entry for the
      mass-versus-function dissociation, and it supersedes the phase 1 strength
      null as the reason no myostatin-pathway drug is approved.
  - reference: PMID:28653345
    reference_title: "Treatment of Sarcopenia with Bimagrumab: Results from a Phase II, Randomized, Controlled, Proof-of-Concept Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Participants with slower walking speed at baseline receiving bimagrumab had clinically meaningful and statistically significantly greater improvements in gait speed (mean 0.15 m/s, P = .009) and 6MWD (mean 82 m, P = .022) than those receiving placebo at Week 16."
    explanation: >-
      The one positive functional result for this drug in this disease, and the
      reason the dissociation recorded above is stated as a pattern rather than
      a law: in the slowest-walking participants of the earlier phase 2 study,
      the mass gain did come with a gait-speed and walking-distance gain. It is
      a subgroup finding in 40 participants, so it is recorded as a qualification
      and not as a refutation of the larger trial's null.

- name: RANK-Ligand Inhibition (Denosumab)
  description: >-
    Investigational repurposing of the anti-osteoporotic RANKL-inhibiting
    antibody denosumab for sarcopenia with underlying osteoporosis
    (osteosarcopenia). RANKL inhibition reduced muscle atrophy in earlier work,
    making it a candidate target. Under active randomised trial; no efficacy
    result in sarcopenia is available yet.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: denosumab
      term:
        id: NCIT:C61313
        label: Denosumab
  evidence:
  - reference: PMID:40760465
    reference_title: "RANK-ligand inhibition to combat sarcopenia with underlying osteoporosis: a study protocol for a randomized, double-blind, double-dummy, active-controlled trial."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Previous studies showed that nuclear factor-κB ligand (RANKL) inhibition could reduce muscle atrophy and could be a therapeutic target for treating sarcopenia."
    explanation: >-
      States the rationale for the target. Graded OTHER because the citation is
      a trial protocol reporting no results, and INDIRECT because the muscle
      effect is carried from prior studies rather than measured here.
  notes: >-
    Rationale-stage only. The cited document is a protocol; see
    clinical_trials#NCT06643780 for the trial itself.

- name: ClC-1 Chloride Channel Inhibition
  description: >-
    Preclinical strategy that raises muscle fiber excitability by lowering the
    resting chloride conductance, compensating for the reduced postsynaptic NaV1.4
    density rather than trying to restore it. In old rodents it improved
    neuromuscular transmission and muscle function. Distinctive because it targets
    the excitability lesion rather than muscle mass, and so predicts functional
    gain without mass gain — the converse of the myostatin-pathway drugs. No human
    data yet.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Neuromuscular Junction Transmission Failure
    description: Restores the safety factor for neuromuscular transmission.
  evidence:
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ClC-1 chloride ion channel inhibition enhanced muscle excitability and improved NMJ transmission and muscle function in old rodents."
    explanation: The preclinical result this treatment entry is based on.
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, these findings demonstrate that NMJ transmission deficits are a key, reversible driver of sarcopenia and reveal a novel therapeutic target for addressing muscle weakness in aging."
    explanation: States the therapeutic-target claim underlying this entry.
  notes: >-
    Preclinical only. The compound used is NMD670; no NCIT or CHEBI term for it
    was found, so therapeutic_agent is left unbound rather than bound to a
    broader class that would lose the identity. No clinical trial of ClC-1
    inhibition in sarcopenia was registered as of this entry's creation, so no
    clinical_trials record accompanies it.

- name: Urolithin A (Mitophagy Activator)
  description: >-
    Oral supplementation with urolithin A, a gut-microbial metabolite of dietary
    ellagitannins that activates mitophagy. It is one of the few agents in the
    sarcopenia pipeline with completed randomised trials in older adults, and the
    trials are instructive in opposite directions: a 4-month trial in middle-aged
    adults improved muscle strength but missed its primary endpoint of peak power
    output, and a 4-month trial in adults aged 65-90 improved muscle endurance
    but not its co-primary endpoints of 6-minute walk distance and maximal ATP
    production. Because it is produced from food polyphenols only by some gut
    microbiota, endogenous exposure varies widely between individuals.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: urolithin A
      term:
        id: CHEBI:168442
        label: Urolithin A
  target_mechanisms:
  - target: Mitochondrial Dysfunction and Oxidative Stress
    description: Activates mitophagy, clearing damaged mitochondria that ageing muscle fails to turn over.
  evidence:
  - reference: PMID:35584623
    reference_title: "Urolithin A improves muscle strength, exercise performance, and biomarkers of mitochondrial health in a randomized trial in middle-aged adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data show significant improvements in muscle strength"
    explanation: The strength result from the randomised middle-aged cohort.
  - reference: PMID:35584623
    reference_title: "Urolithin A improves muscle strength, exercise performance, and biomarkers of mitochondrial health in a randomized trial in middle-aged adults."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "do not notice a significant improvement on peak power output (primary endpoint)"
    explanation: >-
      Refutes the broader claim that urolithin A improves muscle function as
      prespecified. Recorded separately from the SUPPORT item because the same
      trial cuts both ways: the secondary strength measure moved and the primary
      endpoint did not.
  - reference: PMID:35050355
    reference_title: "Effect of Urolithin A Supplementation on Muscle Endurance and Mitochondrial Health in Older Adults: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urolithin A, compared with placebo, significantly improved muscle endurance"
    explanation: The endurance result in the 65-90 year old cohort, the age range that matters for sarcopenia.
  - reference: PMID:35050355
    reference_title: "Effect of Urolithin A Supplementation on Muscle Endurance and Mitochondrial Health in Older Adults: A Randomized Clinical Trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "These results showed no significant improvement with urolithin A supplementation compared with placebo."
    explanation: >-
      The null on this trial's primary endpoints (6-minute walk distance and
      maximal ATP production). Paired with the SUPPORT item above so the entry
      does not read as a clean positive trial, which it was not.
  - reference: PMID:32694802
    reference_title: "The mitophagy activator urolithin A is safe and induces a molecular signature of improved mitochondrial and cellular health in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that UA has a favourable safety profile (primary outcome)."
    explanation: First-in-human safety result in healthy sedentary elderly individuals, the basis for the later efficacy trials.
  notes: >-
    Two randomised trials, neither of which met its primary endpoint, both of
    which moved a secondary muscle-function measure. That pattern is recorded
    here rather than smoothed over, because it is the same mass-versus-function
    problem this entry's other pipeline treatments run into, reached from the
    opposite direction.

- name: Trigonelline (NAD+ Precursor)
  description: >-
    Naturally occurring alkaloid of coffee beans and fenugreek, also produced by
    the human gut microbiome, that enters the NAD+ pool through the
    Preiss-Handler pathway rather than through GPR109A. Serum trigonelline is
    lower in people with sarcopenia and tracks muscle strength, and dietary
    supplementation improves strength and fatigue resistance in ageing mice. No
    human interventional trial has been reported.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: trigonelline
      term:
        id: CHEBI:18123
        label: N-methylnicotinate
  target_mechanisms:
  - target: Mitochondrial Dysfunction and Oxidative Stress
    description: Raises the muscle NAD+ pool that declines with age, restoring mitochondrial respiration and biogenesis.
  evidence:
  - reference: PMID:38504132
    reference_title: "Trigonelline is an NAD(+) precursor that improves muscle function during ageing and is reduced in human sarcopenia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In humans, serum trigonelline levels are reduced with sarcopenia and correlate positively with muscle strength and mitochondrial oxidative phosphorylation in skeletal muscle."
    explanation: >-
      The human arm is observational: it establishes that trigonelline status
      tracks sarcopenia and strength, from which a therapeutic effect only
      follows by inference, hence INDIRECT.
  - reference: PMID:38504132
    reference_title: "Trigonelline is an NAD(+) precursor that improves muscle function during ageing and is reduced in human sarcopenia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Dietary trigonelline supplementation in male mice enhances muscle strength and prevents fatigue during ageing."
    explanation: The interventional result, which is rodent-only and male-only.
  notes: >-
    The mouse supplementation arm was conducted in male mice only; the entry does
    not claim a sex-general effect.

- name: Nicotinamide Riboside (NAD+ Precursor)
  description: >-
    Vitamin B3 form used as an oral NAD+ precursor. Chronic supplementation
    raises NAD+ in middle-aged and older adults and is well tolerated, so target
    engagement in humans is established; muscle benefit is not. Recorded here
    because that dissociation - a boosted NAD+ pool without a demonstrated
    strength gain - is the empirical constraint on the whole NAD+-repletion
    strategy in this disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: nicotinamide riboside
      term:
        id: CHEBI:15927
        label: N-ribosylnicotinamide
  target_mechanisms:
  - target: Mitochondrial Dysfunction and Oxidative Stress
    description: Supplies precursor to the age-depleted muscle NAD+ pool.
  evidence:
  - reference: PMID:29599478
    reference_title: "Chronic nicotinamide riboside supplementation is well-tolerated and elevates NAD(+) in healthy middle-aged and older adults."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "chronic supplementation with the NAD+ precursor vitamin, nicotinamide riboside (NR), is well tolerated and effectively stimulates NAD+ metabolism in healthy middle-aged and older adults"
    explanation: >-
      Establishes tolerability and target engagement in the relevant age group.
      INDIRECT for the treatment claim: the trial measured NAD+ metabolism, not
      muscle strength or mass.
  notes: >-
    PMID:42706321 states that efficacy appears limited, citing trials that found
    limited or no improvement in muscle strength and no benefit on regeneration
    after eccentric injury. Those primary trials were not fetched in this
    session, so the negative result is described here rather than asserted with
    a snippet. The same review records a further complication: an inducible
    muscle-specific Nampt knockout that lowered muscle NAD+ by 85% in adult mice
    produced no deficit in exercise capacity or myofibre size, which questions
    how much of the sarcopenia phenotype low NAD+ actually explains.

- name: Oleuropein (Mitochondrial Calcium Uniporter Activator)
  description: >-
    Olive-derived polyphenol identified in a 5,000-molecule screen as a specific
    activator of the mitochondrial calcium uniporter, acting through MICU1
    binding. It addresses a distinct mitochondrial lesion from the NAD+ agents:
    the regulator MCUR1 is downregulated in ageing human muscle and in
    sarcopenia, which limits the mitochondrial calcium uptake that is
    rate-limiting for mitochondrial activation during contraction. Preclinical
    only for muscle ageing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: oleuropein
      term:
        id: CHEBI:7747
        label: oleuropein
  target_mechanisms:
  - target: Mitochondrial Dysfunction and Oxidative Stress
    description: Restores mitochondrial calcium uptake, the rate-limiting step for mitochondrial activation during contraction.
  evidence:
  - reference: PMID:39603237
    reference_title: "Mitochondrial calcium uptake declines during aging and is directly activated by oleuropein to boost energy metabolism and skeletal muscle performance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we discovered a conserved downregulation of mitochondrial calcium uniporter regulator 1 (MCUR1) during skeletal muscle aging that associates with human sarcopenia and impairs mtCa2+ uptake and mitochondrial respiration"
    explanation: >-
      Establishes the target lesion in human sarcopenic muscle, from profiling of
      human muscle biopsies, which is what makes this compound relevant to this
      disease rather than to muscle performance generally.
  - reference: PMID:39603237
    reference_title: "Mitochondrial calcium uptake declines during aging and is directly activated by oleuropein to boost energy metabolism and skeletal muscle performance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Oleuropein activates mtCa2+ uptake and energy metabolism to enhance endurance and reduce fatigue in young and aged mice but not in muscle-specific MCU knockout (KO) mice."
    explanation: >-
      The interventional result plus its genetic control: the absence of effect
      in MCU knockouts is what establishes that the benefit runs through the
      named target rather than through general polyphenol antioxidant activity.

- name: Partial mTORC1 Inhibition (Rapamycin and Rapalogs)
  description: >-
    Counterintuitive strategy that treats sarcopenia by inhibiting, not
    stimulating, the canonical pro-growth kinase. Its premise is an empirical
    finding rather than a theoretical argument: mTORC1 is hyperactivated in
    sarcopenic muscle, and the chronic activation holds autophagy suppressed. Low
    doses of a rapalog in aged rats increased muscle mass and fiber
    cross-sectional area and reduced the transcriptional signature of
    neuromuscular junction denervation, so the effect reaches the neuromuscular
    arm and not only the myofibre. The dose is what separates this from
    immunosuppression; the immunosuppressive doses used in transplantation are not
    the regimen proposed here.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus (rapamycin)
      term:
        id: CHEBI:9168
        label: sirolimus
    - preferred_term: everolimus (RAD001)
      term:
        id: NCIT:C48387
        label: Everolimus
  target_mechanisms:
  - target: Ubiquitin-Proteasome Myofibrillar Proteolysis
    description: Restores autophagic flux that chronic mTORC1 activation suppresses, relieving the proteostatic burden on the myofiber.
  - target: Alpha Motor Neuron Loss and Muscle Fiber Denervation
    description: Reduces expression of denervation-associated genes in aged muscle.
  - target: Type II Myofiber Atrophy and Fiber-Type Shift
    description: Increases fiber cross-sectional area in aged muscle.
  evidence:
  - reference: PMID:31308131
    reference_title: "Partial Inhibition of mTORC1 in Aged Rats Counteracts the Decline in Muscle Mass and Reverses Molecular Signaling Associated with Sarcopenia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found mTORC1 (mammalian target of rapamycin complex 1), a well-established positive modulator of muscle mass, to be surprisingly hyperactivated in sarcopenic muscle."
    explanation: The observation that licenses inhibiting a growth kinase to treat a wasting disease.
  - reference: PMID:31308131
    reference_title: "Partial Inhibition of mTORC1 in Aged Rats Counteracts the Decline in Muscle Mass and Reverses Molecular Signaling Associated with Sarcopenia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "partial inhibition of the mTORC1 pathway counteracted sarcopenia, as determined by observing an increase in muscle mass and fiber type cross-sectional area in select muscle groups"
    explanation: >-
      The mass result, with the qualification the authors themselves attach to
      it: select muscle groups, not all.
  - reference: PMID:31308131
    reference_title: "Partial Inhibition of mTORC1 in Aged Rats Counteracts the Decline in Muscle Mass and Reverses Molecular Signaling Associated with Sarcopenia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "gene expression indicators of neuromuscular junction denervation were diminished using a low dose of a"
    explanation: Supports the denervation-arm target mechanism, and the low-dose qualifier this treatment turns on.
  - reference: PMID:29486228
    reference_title: "Long term rapamycin treatment improves mitochondrial DNA quality in aging mice."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "we observed a 57% decrease in deletion frequency, a 2.8-fold decrease in ETC deficient fibers, and a 3.4-fold increase in the number of mice without electron transport chain deficient fibers"
    explanation: >-
      Chronic rapamycin improves mitochondrial DNA quality in aged mouse
      quadriceps. INDIRECT for a sarcopenia treatment claim: the readout is
      mtDNA deletion burden and ETC-deficient fiber counts, not strength or mass.
  notes: >-
    No human trial in sarcopenia. PMID:42706321 notes that low-dose RAD001 trials
    in healthy older adults improved systemic inflammation and immune function
    and reduced infection rates, and argues intermittent low-dose regimens are
    the way around the immunosuppression that higher doses cause in an already
    immunosenescent population. Those trials were not fetched here.

- name: 15-PGDH Inhibition (Gerozyme Inhibition; MF-300)
  description: >-
    Small-molecule inhibition of 15-hydroxyprostaglandin dehydrogenase, the
    enzyme that degrades prostaglandin E2 and whose activity rises with age.
    Inhibiting the degradation rather than administering PGE2 restores PGE2 to
    the concentration found in young muscle, which is why the approach avoids the
    hypotension that exogenous PGE2 risks. It is the most pleiotropic agent in
    this entry and the one whose profile best matches the multifactorial
    aetiology: in aged mice a single target reaches the mitochondrial,
    proteostatic, satellite-cell and neuromuscular arms at once, and it increases
    specific force rather than mass alone. An orally available inhibitor
    (MF-300) has completed phase I.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Muscle Satellite Cell Exhaustion
    description: Restored PGE2 signalling increases muscle stem cell function and regenerative capacity.
  - target: Alpha Motor Neuron Loss and Muscle Fiber Denervation
    description: Increases motor neuron viability and promotes motor axon regeneration in chronically denervated aged muscle.
  - target: Neuromuscular Junction Transmission Failure
    description: Restores neuromuscular synapses after acute and chronic denervation.
  - target: Ubiquitin-Proteasome Myofibrillar Proteolysis
    description: Decreases ubiquitin-proteasome pathway activity and TGF-beta signalling while restoring autophagy.
  - target: Mitochondrial Dysfunction and Oxidative Stress
    description: Augments mitochondrial function and biogenesis in aged myofibers.
  - target: Loss of Skeletal Muscle Mass, Strength and Quality
    description: Increases aged muscle mass, strength and exercise performance together.
  evidence:
  - reference: PMID:33303683
    reference_title: "Inhibition of prostaglandin-degrading enzyme 15-PGDH rejuvenates aged muscle mass and strength."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We identifed increased amounts of 15-hydroxyprostaglandin dehydrogenase (15-PGDH), the prostaglandin E2 (PGE2)-degrading enzyme, as a hallmark of aged tissues, including skeletal muscle."
    explanation: >-
      Establishes the target's age-dependence, which is what makes it a gerozyme
      rather than a general muscle target. Quoted verbatim including the source's
      "identifed" typo.
  - reference: PMID:33303683
    reference_title: "Inhibition of prostaglandin-degrading enzyme 15-PGDH rejuvenates aged muscle mass and strength."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inhibition of 15-PGDH, by targeted genetic depletion or a small-molecule inhibitor, increased aged muscle mass, strength, and exercise performance."
    explanation: >-
      The efficacy result, with genetic and pharmacological arms agreeing, which
      is what distinguishes on-target effect from compound effect.
  - reference: PMID:33303683
    reference_title: "Inhibition of prostaglandin-degrading enzyme 15-PGDH rejuvenates aged muscle mass and strength."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "which augmented mitochondrial function and autophagy and decreased transforming growth factor"
    explanation: Names the downstream arms this treatment's mitochondrial and proteolytic target mechanisms encode.
  - reference: PMID:37820010
    reference_title: "Regeneration of neuromuscular synapses after acute and chronic denervation by inhibiting the gerozyme 15-prostaglandin dehydrogenase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In aged mice with chronic denervation of muscles, treatment with the 15-PGDH inhibitor increased motor neuron viability and restored neuromuscular junctions and function."
    explanation: >-
      The neuromuscular arm in the ageing context specifically, which is the
      evidence behind the denervation and NMJ target mechanisms.
  - reference: PMID:37820010
    reference_title: "Regeneration of neuromuscular synapses after acute and chronic denervation by inhibiting the gerozyme 15-prostaglandin dehydrogenase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treating mice with a small-molecule inhibitor of 15-PGDH promoted regeneration of motor axons and formation of neuromuscular synapses leading to an acceleration in recovery of force after an acute nerve crush injury."
    explanation: The acute-denervation arm, establishing that the effect includes motor axon regrowth and not only postsynaptic repair.
  notes: >-
    No published human efficacy data. PMID:42706321 reports that MF-300
    significantly increased strength and specific force after 12 weeks in aged
    mice, that a phase I trial found it safe, and that phase IIb trials are
    planned; the phase I and the aged-mouse dosing study are conference
    abstracts and a company release rather than indexed papers, so they are
    described here and not cited as evidence. No CHEBI or NCIT term for MF-300
    was found, so therapeutic_agent is omitted rather than bound to a broader
    class that would lose the identity.

- name: Myostatin Ligand Neutralization (Landogrozumab, Trevogrumab)
  description: >-
    Monoclonal antibodies that bind and neutralize myostatin itself, rather than
    the receptor bimagrumab blocks. In aged mice the approach raises muscle mass,
    strength and treadmill performance together. In the one phase 2 trial in the
    relevant population - adults 75 and over with recent falls and low strength
    and power - landogrozumab (LY2495655) met its primary endpoint of appendicular
    lean mass by 0.43 kg against placebo, and moved some but not all physical
    performance measures. Injection site reactions were markedly more common than
    with placebo.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: landogrozumab (LY2495655)
      term:
        id: NCIT:C99640
        label: Landogrozumab
    - preferred_term: trevogrumab (REGN1033)
      term:
        id: NCIT:C152733
        label: Trevogrumab
  target_mechanisms:
  - target: Myostatin and Activin Receptor Signalling
    description: Neutralizes the ligand rather than the receptor, removing myostatin's restraint on muscle growth.
  evidence:
  - reference: PMID:26516121
    reference_title: "Myostatin antibody (LY2495655) in older weak fallers: a proof-of-concept, randomised, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings show LY treatment increases lean mass and might improve functional measures of muscle power."
    explanation: >-
      The trial's own conclusion. Note the authors' hedge on function ("might")
      against the unhedged claim on mass, which is the pattern this entry records
      across the whole myostatin-pathway programme.
  - reference: PMID:26516121
    reference_title: "Myostatin antibody (LY2495655) in older weak fallers: a proof-of-concept, randomised, phase 2 trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No effect was detected for other performance-based measures."
    explanation: >-
      Refutes a general functional-improvement claim: some performance measures
      moved and others did not. Recorded separately from the SUPPORT item because
      the trial supports the mass claim and undercuts the broader function claim.
  - reference: PMID:26457176
    reference_title: "Myostatin blockade with a fully human monoclonal antibody induces muscle hypertrophy and reverses muscle atrophy in young and aged mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In aged mice, REGN1033 increased muscle mass and strength and improved physical performance during treadmill exercise."
    explanation: >-
      The preclinical aged-animal result for trevogrumab. Worth reading beside
      the human trial above: in mice mass and strength move together, in older
      adults they come apart, and that species gap is the central translational
      problem for this drug class.
  notes: >-
    Trevogrumab has no reported sarcopenia trial; it appears here for the aged
    mouse result and because it is the agent now being tested with semaglutide
    for GLP1RA-associated muscle loss (see the muscle-sparing co-therapy entry).

- name: Selective Androgen Receptor Modulation (Enobosarm, MK-0773)
  description: >-
    Non-steroidal androgen receptor ligands designed to be anabolic in muscle and
    bone while sparing prostate and hair-growth tissue, avoiding the
    supraphysiological testosterone doses that anabolic effect otherwise requires.
    Two phase II trials in the right population reached opposite conclusions about
    function: enobosarm improved both lean body mass and physical function in
    healthy elderly men and postmenopausal women over 12 weeks, whereas MK-0773
    raised lean mass in sarcopenic frail elderly women over 6 months without any
    strength or function gain over placebo.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: enobosarm
      term:
        id: NCIT:C69161
        label: Enobosarm
    - preferred_term: selective androgen receptor modulator
      term:
        id: NCIT:C147920
        label: Selective Androgen Receptor Modulator
  target_mechanisms:
  - target: Declining Anabolic Hormone Signalling
    description: Substitutes for the age-related fall in testosterone by stimulating the androgen receptor selectively in muscle.
  - target: Negative Net Muscle Protein Balance
    description: Androgen receptor stimulation raises muscle protein synthesis.
  evidence:
  - reference: PMID:22031847
    reference_title: "The selective androgen receptor modulator GTx-024 (enobosarm) improves lean body mass and physical function in healthy elderly men and postmenopausal women: results of a double-blind, placebo-controlled phase II trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GTx-024 treatment resulted in dose-dependent increases in total lean body mass that were statistically significant"
    explanation: The primary endpoint result for enobosarm.
  - reference: PMID:22031847
    reference_title: "The selective androgen receptor modulator GTx-024 (enobosarm) improves lean body mass and physical function in healthy elderly men and postmenopausal women: results of a double-blind, placebo-controlled phase II trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were also significant improvements in physical function"
    explanation: >-
      The functional result, which is the unusual part: most agents in this class
      move mass without moving function. Note the trial enrolled healthy elderly
      volunteers, not people with diagnosed sarcopenia.
  - reference: PMID:23732550
    reference_title: "A phase IIA randomized, placebo-controlled clinical trial to study the efficacy and safety of the selective androgen receptor modulator (SARM), MK-0773 in female participants with sarcopenia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The MK-0773-induced increase in LBM did not translate to improvement in strength or function vs. placebo."
    explanation: >-
      Refutes the claim that a SARM-driven lean-mass gain produces functional
      benefit, in the population that matters - women with diagnosed sarcopenia.
      This is the trial that most directly contradicts the enobosarm functional
      result above, and both are recorded rather than one being preferred.
  - reference: PMID:23732550
    reference_title: "A phase IIA randomized, placebo-controlled clinical trial to study the efficacy and safety of the selective androgen receptor modulator (SARM), MK-0773 in female participants with sarcopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A greater number of participants experienced elevated transaminases in the MK-0773 group vs. placebo, which resolved after discontinuation of study therapy."
    explanation: The hepatic safety signal, which is the specific long-term concern this class carries.
  notes: >-
    The two trials differ in population, duration, sex and background therapy, so
    the conflict on function is not necessarily a contradiction. The MK-0773
    trial gave every participant vitamin D and protein supplementation, and its
    authors attribute part of the placebo group's improvement to that, which
    would compress the between-group difference. MK-0773 has no NCIT term that
    resolved here, so the class term is bound alongside enobosarm rather than
    fabricating one.

- name: JAK-STAT Inhibition (Tofacitinib)
  description: >-
    Repurposing of an approved JAK inhibitor to treat weakness as a consequence of
    inflammatory signalling. In a randomised human study, 48 hours of tofacitinib
    before biopsy raised the maximum specific force of individual diaphragm
    myofibers by about 16% against placebo, with the same direction of effect in
    serratus anterior, alongside reduced muscle protein oxidation and reduced
    FoxO-ubiquitin-proteasome signalling. Distinctive in this entry because it
    changes contractile quality over two days, on a timescale that cannot involve
    hypertrophy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tofacitinib
      term:
        id: NCIT:C95800
        label: Tofacitinib
  target_mechanisms:
  - target: Chronic Low-Grade Inflammation
    description: Blocks JAK-STAT transduction of the inflammatory signals that drive the atrogene programme.
  - target: Ubiquitin-Proteasome Myofibrillar Proteolysis
    description: Suppresses FoxO-ubiquitin-proteasome signalling and muscle protein oxidation.
  - target: Loss of Skeletal Muscle Mass, Strength and Quality
    description: Raises single-fiber specific force, that is, contractile quality rather than quantity.
  evidence:
  - reference: PMID:39122555
    reference_title: "JAK inhibition with tofacitinib rapidly increases contractile force in human skeletal muscle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with a 15.7% greater mean maximum specific force (P = 0.0016)"
    explanation: >-
      The effect size, from patients randomised to tofacitinib or placebo for 48
      hours before biopsy. Graded HUMAN_CLINICAL because the randomisation and
      dosing were in people; the force measurement itself was made on biopsied
      single fibers.
  - reference: PMID:39122555
    reference_title: "JAK inhibition with tofacitinib rapidly increases contractile force in human skeletal muscle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The increased force was associated with reduced muscle protein oxidation and FoxO-ubiquitination-proteasome signaling, and increased levels of smooth muscle MYLK."
    explanation: The mechanistic correlates behind the inflammation and proteolysis target mechanisms recorded here.
  notes: >-
    Not a sarcopenia trial. Participants were surgical patients, not older adults
    with diagnosed sarcopenia, so this is evidence that JAK inhibition raises
    contractile force in human muscle, not that it treats this disease.
    PMID:42706321 makes the same caveat structurally: it is unclear whether the
    inflammation of sarcopenia resembles that of cancer or the other wasting
    conditions where anti-inflammatory agents have been tried, and the TNF decoy
    etanercept showed no effect on muscle mass in cancer trials.

- name: Apelin Receptor Agonism
  description: >-
    Replacement of an exerkine rather than blockade of a pathological signal.
    Apelin is a peptide released by contracting muscle whose production falls with
    age in both humans and rodents; mice lacking apelin or its receptor develop
    marked age-dependent muscle dysfunction, and restoring apelin signalling in
    aged mice improves muscle function through mitochondrial biogenesis,
    autophagy and anti-inflammatory pathways in myofibers while also acting on
    muscle stem cells. It is one of the mechanisms through which the review's
    vascular axis reaches muscle, since apelin acts on the endothelial APJ
    receptor.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Capillary Rarefaction and Impaired Muscle Perfusion
    description: Acts on the endothelial APJ receptor, the angiocrine arm of this treatment's effect.
  - target: Mitochondrial Dysfunction and Oxidative Stress
    description: Triggers mitochondrial biogenesis and autophagy in aged myofibers.
  - target: Muscle Satellite Cell Exhaustion
    description: Enhances regenerative capacity by acting on muscle stem cells.
  - target: Chronic Low-Grade Inflammation
    description: Engages anti-inflammatory pathways in myofibers.
  evidence:
  - reference: PMID:30061698
    reference_title: "The exerkine apelin reverses age-associated sarcopenia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "production of the endogenous peptide apelin, induced by muscle contraction, is reduced in an age-dependent manner in humans and rodents and is positively associated with the beneficial effects of exercise in older persons"
    explanation: >-
      The human arm, which establishes the deficiency this treatment would
      correct. INDIRECT: an age-dependent decline and an association with
      exercise benefit, not a trial of apelin administration.
  - reference: PMID:30061698
    reference_title: "The exerkine apelin reverses age-associated sarcopenia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "this peptide considerably enhanced muscle function by triggering mitochondriogenesis, autophagy and anti-inflammatory pathways in myofibers as well as enhancing the regenerative capacity by targeting muscle stem cells"
    explanation: The interventional rodent result, and the source of all four target mechanisms recorded above.
  notes: >-
    therapeutic_agent is omitted deliberately. The cited evidence is for the
    apelin peptide itself, which NCIT codes as a protein (NCIT:C104098) outside
    the pharmacologic-substance branch the schema's ChemicalEntityTerm enum
    draws from, so it cannot be bound in this slot. The clinical-stage agent of
    this class, azelaprag, does have a term (NCIT:C166746), but no evidence here
    is about azelaprag, so binding it would assert more than the citations
    support.
    The one apelin-pathway agent to reach a phase 2 trial, the apelin receptor
    agonist azelaprag combined with tirzepatide, was discontinued in the STRIDES
    trial for liver transaminitis, per PMID:42706321. That is a company
    announcement rather than an indexed paper, so it is described here and not
    cited as evidence. It matters for this entry because it is a safety signal
    against the most advanced clinical form of this strategy, not against the
    mechanism.

- name: VEGF Signalling Restoration
  description: >-
    Preclinical strategy addressing the vascular contribution to muscle ageing
    rather than muscle itself. Age raises production of the soluble VEGF decoy
    receptor sFlt-1, so VEGFA-driven capillary sprouting becomes insufficient; in
    mice, low-dose VEGFA overexpression counteracts this, prevents capillary
    loss, improves perfusion, and ameliorates sarcopenia among several other
    ageing pathologies while extending life span. No human muscle data.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Capillary Rarefaction and Impaired Muscle Perfusion
    description: Restores the VEGFA signalling that age-related sFlt-1 production renders insufficient.
  evidence:
  - reference: PMID:34326210
    reference_title: "Counteracting age-related VEGF signaling insufficiency promotes healthy aging and extends life span."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Increasing VEGF signaling prevented age-associated capillary loss, improved organ perfusion and function, and extended life span."
    explanation: The mechanism this treatment asserts, measured in aged mice.
  - reference: PMID:34326210
    reference_title: "Counteracting age-related VEGF signaling insufficiency promotes healthy aging and extends life span."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "amelioration of aging-associated pathologies including hepatic steatosis, sarcopenia, osteoporosis"
    explanation: >-
      Names sarcopenia specifically among the conditions improved, which is what
      makes this a candidate treatment for this entry rather than a general
      longevity result.
  notes: >-
    The intervention was genetic overexpression in mice, not a deliverable drug,
    so therapeutic_modality is OTHER rather than GENE_THERAPY: no vector-based
    therapeutic was tested. No therapeutic_agent is bound, because the NCIT VEGF
    terms name the protein or the receptor complex rather than an agent, and
    binding one would assert a specific therapeutic that does not exist.

- name: Nicotinamide plus Pyridoxine (Muscle Stem Cell Nutrition)
  description: >-
    Combination of two vitamins identified in a high-content imaging screen of
    food-derived molecules against human myogenic progenitors, so the target here
    is the muscle stem cell rather than the myofiber. The two synergize through
    CK1-mediated cytoplasmic beta-catenin activation and AKT signalling. Both
    decline with age and their levels associate with muscle mass and walking speed
    in older people; oral treatment accelerated regeneration and overcame
    age-related regenerative failure in mice. Both have a long history of safe
    human use, which is the practical argument for this combination over a novel
    chemical entity.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: nicotinamide
      term:
        id: CHEBI:17154
        label: nicotinamide
    - preferred_term: pyridoxine (vitamin B6)
      term:
        id: CHEBI:16709
        label: pyridoxine
  target_mechanisms:
  - target: Muscle Satellite Cell Exhaustion
    description: Stimulates muscle stem cell amplification and differentiation, overcoming the regenerative failure of ageing.
  evidence:
  - reference: PMID:39531334
    reference_title: "Nicotinamide and pyridoxine stimulate muscle stem cell expansion and enhance regenerative capacity during aging."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Oral treatment with a combination of NAM and PN accelerated muscle regeneration in vivo by stimulating MuSCs, increased muscle strength during recovery, and overcame MuSC dysfunction and regenerative failure during aging."
    explanation: The interventional result, including the ageing arm that makes it relevant to this disease rather than to injury repair generally.
  - reference: PMID:39531334
    reference_title: "Nicotinamide and pyridoxine stimulate muscle stem cell expansion and enhance regenerative capacity during aging."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Levels of NAM and bioactive PN spontaneously declined during aging in model organisms and interindependently associated with muscle mass and walking speed in a cohort of 186 aged people."
    explanation: >-
      The human observational arm establishing the deficiency. INDIRECT: an
      association in a cohort of 186, not a supplementation trial.
  notes: >-
    PMID:42706321 reports a randomised trial of NAM/PN after eccentric
    contraction injury in young volunteers that increased muscle stem cell
    numbers and de novo myofiber formation. That report is a medRxiv preprint
    and was not fetched here, so the human interventional result is not claimed.

- name: BIO101 (20-Hydroxyecdysone)
  description: >-
    Pharmaceutical-grade plant ecdysteroid that activates the MAS receptor, the
    protective arm of the renin-angiotensin-aldosterone system, and thereby
    AKT/mTOR-driven protein synthesis. In 22-month-old mice a 14-week oral course
    produced anabolic effects with improved running capacity and velocity;
    in vitro it also drives myoblast differentiation, and both effects are
    abolished by the MAS antagonist A779, which is what pins the mechanism to
    that receptor.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 20-hydroxyecdysone
      term:
        id: CHEBI:16587
        label: 20-hydroxyecdysone
  target_mechanisms:
  - target: Anabolic Resistance
    description: Raises AKT/mTOR-driven protein synthesis through MAS receptor activation.
  - target: Muscle Satellite Cell Exhaustion
    description: Promotes myoblast differentiation and fusion.
  evidence:
  - reference: PMID:38064183
    reference_title: "BIO101 stimulates myoblast differentiation and improves muscle function in adult and old mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Chronic BIO101 oral treatment induced AKT/mTOR activation and anabolic effects accompanied with improved physical performances in adult and old animals"
    explanation: The in vivo result in adult and 22-month-old mice, covering both the signalling and the performance claims.
  notes: >-
    The differentiation and MAS-dependence results come from C2C12 myoblasts and
    would be graded IN_VITRO; only the in vivo arm is cited here, so the entry
    does not rest a claim about animals on a cell-line result.

- name: Angiotensin II Type 1 Receptor Blockade (Losartan)
  description: >-
    Repurposing of a common antihypertensive, on the argument that AT1 receptor
    blockade lowers TGF-beta signalling and raises IGF1/AKT/mTOR signalling in
    muscle. In sarcopenic mice losartan reduced fibrosis after injury and
    protected against disuse atrophy during hindlimb immobilization - and
    notably, the protection against disuse ran through IGF1/AKT/mTOR rather than
    through the TGF-beta pathway the strategy was designed around. In older men
    the acute human study was essentially null: no effect on satellite cell
    number or myogenic pathways after a single bout of heavy resistance exercise,
    with greater suppression of myostatin mRNA as the one positive signal.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: losartan
      term:
        id: CHEBI:6541
        label: losartan
  target_mechanisms:
  - target: Myosteatosis and Intramuscular Fibro-Adipogenic Infiltration
    description: Reduces fibrotic remodelling after injury by blunting canonical and non-canonical TGF-beta signalling.
  - target: Anabolic Resistance
    description: Raises IGF1/AKT/mTOR signalling, the route by which it protected against disuse atrophy.
  evidence:
  - reference: PMID:21562229
    reference_title: "Losartan restores skeletal muscle remodeling and protects against disuse atrophy in sarcopenia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We showed that immobilized mice treated with losartan were protected against loss of muscle mass."
    explanation: The disuse-atrophy result in aged mice, which is the strongest preclinical claim for this repurposing.
  - reference: PMID:29040223
    reference_title: "Effect of Losartan on the Acute Response of Human Elderly Skeletal Muscle to Exercise."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In general, there does not seem to be any effect of AT1R blocking on satellite cell number or myogenic pathways in elderly men in the days after one bout of heavy-resistance exercise."
    explanation: >-
      Refutes translation of the rodent myogenic effect to older men, in the
      acute setting the trial tested. Recorded as REFUTE rather than omitted
      because it is the only human evidence for this strategy in this entry.
  - reference: PMID:29040223
    reference_title: "Effect of Losartan on the Acute Response of Human Elderly Skeletal Muscle to Exercise."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "losartan intake resulted in a greater suppression of myostatin messenger RNA"
    explanation: >-
      The one positive human signal, and the authors' own basis for suggesting
      long-term hypertrophic potential. INDIRECT: a transcript-level change, not
      a mass or strength outcome.
  notes: >-
    PMID:42706321 records that early observational work linked ACE-inhibitor use
    to better physical function in older women, but that recent meta-analyses
    have not confirmed muscle benefit for this drug class. Those sources were not
    fetched here. On present evidence this is a repurposing hypothesis with a
    null acute human study against it, not a candidate therapy.

- name: Muscle-Sparing Co-therapy During GLP1 Receptor Agonist Weight Loss
  description: >-
    A preventative rather than a treatment for established sarcopenia. GLP1
    receptor agonists produce large weight loss of which a substantial fraction
    is lean mass, and after the drug is stopped fat returns and muscle does not -
    so widespread incretin use is creating a new, iatrogenic route into
    sarcopenia in older people. Two co-therapy strategies have preclinical
    support: blocking the activin type II receptors or their ligands GDF8 and
    activin A alongside the incretin, which preserves or increases lean mass in
    obese mice and non-human primates while improving fat loss; and inhibiting
    15-PGDH, which restores post-injury myofiber growth and force in
    semaglutide-treated obese mice without compromising weight loss.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bimagrumab
      term:
        id: NCIT:C116852
        label: Bimagrumab
    - preferred_term: trevogrumab
      term:
        id: NCIT:C152733
        label: Trevogrumab
    - preferred_term: garetosmab
      term:
        id: NCIT:C170022
        label: Garetosmab
    - preferred_term: semaglutide
      term:
        id: NCIT:C152328
        label: Semaglutide
  target_mechanisms:
  - target: Myostatin and Activin Receptor Signalling
    description: ActRII or dual GDF8/activin A blockade removes the growth restraint that caloric deficit otherwise leaves unopposed.
  - target: Muscle Satellite Cell Exhaustion
    description: The 15-PGDH arm restores muscle stem cell function and myofiber growth during incretin-induced weight loss.
  - target: Loss of Skeletal Muscle Mass, Strength and Quality
    description: Preserves lean mass and contractile force during pharmacologically induced weight loss.
  evidence:
  - reference: PMID:38218536
    reference_title: "Antibody blockade of activin type II receptors preserves skeletal muscle mass and enhances fat loss during GLP-1 receptor agonism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Combination treatment with bimagrumab and semaglutide led to superior fat mass loss while simultaneously preserving lean mass despite reduced food intake."
    explanation: The receptor-blockade arm, in diet-induced obese mice.
  - reference: PMID:40360507
    reference_title: "GDF8 and activin A blockade protects against GLP-1-induced muscle loss while enhancing fat loss in obese male mice and non-human primates."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we report that dual blockade can also prevent muscle loss associated with glucagon-like peptide-1 receptor agonists - and even increase muscle mass - in both obese mice and non-human primates"
    explanation: >-
      The ligand-blockade arm, extended to non-human primates, which is the
      closest preclinical evidence to the human trials now running.
  - reference: PMID:42228536
    reference_title: "15-PGDH inhibition promotes muscle repair and strength recovery during GLP-1 receptor agonist-induced weight loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In a high fat diet-induced mouse model of obesity, semaglutide alone caused significant loss of muscle mass, while preserving contractile function."
    explanation: >-
      Establishes the harm this co-therapy is meant to prevent, and states the
      nuance: the mass loss came without a contractile-function loss in this
      model, so the risk is to reserve rather than to immediate strength.
  - reference: PMID:42228536
    reference_title: "15-PGDH inhibition promotes muscle repair and strength recovery during GLP-1 receptor agonist-induced weight loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PGDHi synergizes with semaglutide to boost postinjury muscle quality and muscle force without compromising weight loss."
    explanation: The 15-PGDH co-therapy arm, and the point that the muscle benefit does not come at the cost of the weight loss.
  notes: >-
    All the evidence here is preclinical. PMID:42706321 reports human phase II
    data - bimagrumab increasing weight loss while protecting lean mass in adults
    with obesity, and interim COURAGE results for trevogrumab plus garetosmab
    with semaglutide - but those are conference and company communications rather
    than indexed papers, so they are described and not cited. Whether preserved
    mass translates into preserved strength is explicitly open, which is the same
    question the myostatin-pathway entries in this file raise.
    therapeutic_modality is MONOCLONAL_ANTIBODY because the antibody arms
    dominate the entry; the 15-PGDH arm is a small molecule, and the slot is
    single-valued.

definitions:
- name: EWGSOP2 sarcopenia case definition
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The dominant European clinical algorithm. Case-find (SARC-F or clinical
    suspicion), then assess muscle strength — low strength alone establishes
    "probable sarcopenia" and is sufficient to start treatment. Confirm with low
    muscle quantity or quality (DXA, BIA, CT, or MRI). Grade severity by physical
    performance (gait speed, SPPB, TUG, 400 m walk); poor performance defines
    severe sarcopenia.
  evidence:
  - reference: PMID:30312372
    reference_title: "Sarcopenia: revised European consensus on definition and diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "focuses on low muscle strength as a key characteristic of sarcopenia, uses detection of low muscle quantity and quality to confirm the sarcopenia diagnosis, and identifies poor physical performance as indicative of severe sarcopenia"
    explanation: The consensus statement of the three-tier algorithm described here.
- name: AWGS 2019 sarcopenia case definition
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The Asian consensus, with population-specific cut-offs and separate community
    and hospital algorithms. Notably introduces "possible sarcopenia" — low
    strength or low physical performance alone — explicitly to enable lifestyle
    intervention in primary care before a confirmatory mass measurement is
    available.
  evidence:
  - reference: PMID:32033882
    reference_title: "Asian Working Group for Sarcopenia: 2019 Consensus Update on Sarcopenia Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AWGS 2019 also introduces \"possible sarcopenia,\" defined by either low muscle strength or low physical performance only, specifically for use in primary health care or community-based health promotion, to enable earlier lifestyle interventions."
    explanation: States the "possible sarcopenia" category and its intended use.

animal_models:
- name: Naturally aged C57BL/6 mouse (28 months)
  species: Mouse
  genotype: Wild-type C57BL/6, aged to 28 months
  publication: PMID:33580198
  description: >-
    Chronological-ageing model with a time course of phenotypic and
    transcriptomic measurements in gastrocnemius muscle, analysed alongside
    matched rat and human data. Its value is the cross-species comparison: it
    identifies which arms of human sarcopenia rodents actually reproduce.
  evidence:
  - reference: PMID:33580198
    reference_title: "Molecular and phenotypic analysis of rodent models reveals conserved and species-specific modulators of human sarcopenia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we generated a time series of phenotypic measurements and RNA sequencing data in mouse gastrocnemius muscle and analyzed them alongside analogous data from rats and humans."
    explanation: Describes the model and the cross-species design that makes it informative for human sarcopenia.
  modeled_mechanisms:
  - target: Loss of Skeletal Muscle Mass, Strength and Quality
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Aged mice lose muscle mass and grip strength together, reproducing the
      defining human combination rather than mass loss alone.
    limitations: >-
      Chronological age is a poor proxy for sarcopenia status even within the
      model; the authors argue muscle mass is the better indicator. Mouse
      lifespan compresses decades of human exposure, and laboratory mice lack
      the comorbidity burden that drives most human secondary sarcopenia.
    readouts:
    - name: All-limb grip strength
      target: Loss of Skeletal Muscle Mass, Strength and Quality
      direction: DECREASED
      interpretation: Functional correlate of the strength domain of the human triad.
      evidence:
      - reference: PMID:33580198
        reference_title: "Molecular and phenotypic analysis of rodent models reveals conserved and species-specific modulators of human sarcopenia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "All-limb grip strength decreased in parallel with muscle mass, reaching a 34.2 ± 3.4% loss in 28 months-old mice compared to 8–18 months-old mice"
        explanation: Reports the measured grip-strength decrement in this model.
    evidence:
    - reference: PMID:33580198
      reference_title: "Molecular and phenotypic analysis of rodent models reveals conserved and species-specific modulators of human sarcopenia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our study demonstrates that phenotypic measurements, such as muscle mass, are better indicators of muscle health than chronological age and should be considered when analyzing aging-related molecular data."
      explanation: >-
        Attests what makes this model informative for the mass/strength node
        specifically: its muscle-phenotype measurements, rather than the animals'
        chronological age, are what track muscle health.
  - target: Mitochondrial Dysfunction and Oxidative Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Transcriptomic comparison shows the mitochondrial arm of human sarcopenia
      is reproduced in rodents.
    limitations: >-
      Inflammatory changes are conserved only at pathway level, not gene level,
      so this model is a poor vehicle for the inflammaging arm specifically.
    evidence:
    - reference: PMID:33580198
      reference_title: "Molecular and phenotypic analysis of rodent models reveals conserved and species-specific modulators of human sarcopenia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that rodents recapitulate mitochondrial changes observed in human sarcopenia, while inflammatory responses are conserved at pathway but not gene level."
      explanation: >-
        States directly that the mitochondrial changes of human sarcopenia are
        reproduced in rodents, which is the claim this link makes; the same
        sentence carries the inflammatory-arm limitation recorded above.
    readouts:
    - name: Muscle transcriptome mitochondrial gene signature
      target: Mitochondrial Dysfunction and Oxidative Stress
      direction: ALTERED
      interpretation: Cross-species conserved transcriptomic correlate of the mitochondrial node.
      evidence:
      - reference: PMID:33580198
        reference_title: "Molecular and phenotypic analysis of rodent models reveals conserved and species-specific modulators of human sarcopenia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that rodents recapitulate mitochondrial changes observed in human sarcopenia, while inflammatory responses are conserved at pathway but not gene level."
        explanation: Establishes both the conserved mitochondrial signature and the limitation noted above.

- name: Naturally occurring sarcopenia in aged companion dogs and cats
  species: Dog
  genotype: Outbred companion animals, no genetic modification
  publication: PMID:22111652
  description: >-
    Spontaneous, naturally occurring age-related loss of lean body mass in pet
    dogs and cats. Its value is that it is not an induced model: the animals age
    in a shared human environment, over a lifespan long enough for the process to
    develop, and the veterinary literature separates it from disease-driven
    cachexia in the same species. That separation is the useful part — it is the
    same primary-versus-secondary distinction this entry draws, made
    independently in another species.
  notes: >-
    Recorded under `species: Dog` because the slot is single-valued; the cited
    source covers dogs and cats together and the claim is not dog-specific.
  evidence:
  - reference: PMID:22111652
    reference_title: "Cachexia and sarcopenia: emerging syndromes of importance in dogs and cats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As many of the diseases associated with muscle loss are more common in aging, cachexia and sarcopenia often are concurrent problems."
    explanation: >-
      Establishes the model population and its principal confound: in aged
      companion animals the age-related and disease-driven forms co-occur, so
      individual animals are not cleanly one or the other. This is a different
      claim from the link-level evidence, which is about what the model is
      informative for.
  modeled_mechanisms:
  - target: Loss of Skeletal Muscle Mass, Strength and Quality
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces age-related lean body mass loss arising without an underlying
      disease, in a long-lived outbred species sharing the human environment.
    limitations: >-
      The cited source is a veterinary review reporting lean body mass, not the
      strength and physical-performance measures that define human sarcopenia
      under EWGSOP2, so only the mass component of the target node is supported.
      No fibre-type, motor-unit, or neuromuscular-junction data are cited, and
      the review's principal subject is cachexia rather than sarcopenia. Graded
      LOW fidelity and PARTIALLY_RECAPITULATES for those reasons.
    evidence:
    - reference: PMID:22111652
      reference_title: "Cachexia and sarcopenia: emerging syndromes of importance in dogs and cats."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Sarcopenia, the loss of LBM that occurs with aging, is a related syndrome, although sarcopenia occurs in the absence of disease."
      explanation: >-
        Supports the link claim directly: what this model carries is age-related,
        disease-independent lean-mass loss, which is what makes it informative for
        the primary form of the target node rather than for secondary sarcopenia.

- name: Aged rat neuromuscular transmission model
  species: Rat
  genotype: Wild-type, aged
  publication: PMID:42424105
  description: >-
    Aged rats used to localise the sarcopenic transmission defect and to test
    both a sufficiency manipulation (acute NaV1.4 blockade in young adults) and a
    rescue (ClC-1 inhibition in old animals).
  evidence:
  - reference: PMID:42424105
    reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Acute NaV1.4 inhibition with μ-conotoxin GIIIB in adult rats reproduced findings of NMJ transmission failure observed in aged rodents and humans."
    explanation: Establishes the rat preparation as reproducing the human transmission phenotype under a defined manipulation.
  modeled_mechanisms:
  - target: Neuromuscular Junction Transmission Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the human finding of NMJ transmission failure and adds the
      electrophysiological localisation to post-synaptic fiber excitability that
      human studies could not provide.
    limitations: >-
      The human arm establishes correlation with weakness severity but not the
      rescue; the ClC-1 benefit is rodent-only, so translation of the therapeutic
      claim is untested.
    readouts:
    - name: Neuromuscular junction transmission safety factor
      target: Neuromuscular Junction Transmission Failure
      direction: RESTORED
      interpretation: >-
        ClC-1 inhibition reverses the transmission deficit, supporting the
        excitability mechanism rather than fiber loss as its cause.
      evidence:
      - reference: PMID:42424105
        reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "ClC-1 chloride ion channel inhibition enhanced muscle excitability and improved NMJ transmission and muscle function in old rodents."
        explanation: The rescue result this readout records.
    evidence:
    - reference: PMID:42424105
      reference_title: "Neuromuscular junction failure in sarcopenia is linked to NaV1.4 loss and reversed by ClC-1 inhibition."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Preclinical experiments showed similar NMJ transmission failure in aged rodents that was associated with localized loss of muscle fiber excitability at the NMJ."
      explanation: Supports treating the aged rodent as informative for the human transmission node.


  description: >-
    Sustained calcium loading activates the calcineurin-NFAT axis and drives a
    hypertrophic and profibrotic transcriptional programme, converting a
    reversible signalling failure into structural change. In the KATP knockout
    this arm is cyclosporine-sensitive, which is what identifies calcineurin as
    the mediator rather than a bystander.

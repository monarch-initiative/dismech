name: Dilated Cardiomyopathy 1O
creation_date: "2026-09-04T02:26:58Z"
category: Mendelian
synonyms:
- CMD1O
- DCM1O
- cardiomyopathy, dilated, 1O
- cardiomyopathy, dilated, type 1O
- dilated cardiomyopathy type 1O
- dilated cardiomyopathy with ventricular tachycardia
- cardiomyopathy, dilated, with ventricular tachycardia
- ABCC9 familial isolated dilated cardiomyopathy
- familial isolated dilated cardiomyopathy caused by mutation in ABCC9
- ABCC9-related dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 1O (CMD1O) is the ABCC9-attributed node of the familial
  isolated dilated cardiomyopathy series, and it is the one member of that series
  whose proposed lesion is not sarcomeric or cytoskeletal. ABCC9 encodes
  sulfonylurea receptor 2; its cardiac splice form SUR2A is the regulatory
  subunit that, with the Kir6.2 pore encoded by KCNJ11, builds the sarcolemmal
  ATP-sensitive potassium (KATP) channel of the ventricular cardiomyocyte. That
  channel is not a contractile element at all — it is a metabolic sensor, a
  nucleotide-gated rheostat that reads the cytosolic ATP/ADP ratio and adjusts
  action-potential duration and membrane-potential-dependent work to match
  available energy. The disease is therefore modelled here as a channelopathy
  route into dilated cardiomyopathy: the failure is in metabolic-stress
  adaptation, not in force generation.


  The two founding alleles both sit in exon 38, in conserved C-terminal sequence
  flanking the second catalytic ATPase pocket of SUR2A — a missense
  c.4537G>A p.(Ala1513Thr) and a frameshift c.4570_4572delTTAinsAAAT
  p.(Leu1524fs) that appends four aberrant residues and terminates early. The
  reported defect is correspondingly specific: recombinant mutant SUR2A
  redistributes the conformational states of its intrinsic ATP hydrolytic cycle,
  so the pore is no longer correctly gated by Mg-nucleotide occupancy. That is a
  catalytic/regulatory failure rather than an absence of potassium permeation,
  and this entry curates it at that level rather than collapsing it to generic
  loss of function.


  THE GENE-DISEASE RELATIONSHIP IS NOT ESTABLISHED. The ClinGen Dilated
  Cardiomyopathy Gene Curation Expert Panel classified ABCC9-dilated
  cardiomyopathy as LIMITED on 2024-11-15 under SOP10, and the same panel's
  published curation of 51 DCM genes recommends that only high-evidence genes
  drive clinical practice. The human evidence is two index cases from a
  323-patient screen, one affected but ungenotyped father, and a ClinVar spectrum
  dominated by variants of uncertain significance. The pathophysiology below is
  curated as a proposed mechanism, and the dispute is carried on the genetic
  block, in a dedicated discussion, and on the causal edges.


  CMD1O is not either of the other two ABCC9 diseases and must not be merged with
  them. AIMS (ABCC9-related intellectual disability and myopathy syndrome,
  curated separately) is autosomal RECESSIVE, caused by BIALLELIC loss of
  function, and presents with intellectual disability, myopathy and cerebral
  white matter disease — its heterozygous carriers show no conserved clinical
  pathology, which is precisely what CMD1O claims heterozygotes do have. Cantu
  syndrome is autosomal dominant but arises from GAIN-of-function ABCC9 variants
  and is mechanistically the opposite pole. CMD1O is the third position: dominant,
  cardiac-restricted, and attributed to a regulatory rather than a null defect.

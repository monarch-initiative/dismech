classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  channelopathy_category:
    classification_value: cardiac channelopathy
    notes: >-
      CMD1O is a KATP channelopathy of the ventricular cardiomyocyte. Note that
      the value is used here for a channel defect that presents as structural and
      contractile disease rather than as a primary rhythm syndrome in a
      structurally normal heart: ventricular tachycardia was prominent in both
      index cases, but the defining phenotype is chamber dilation with severely
      reduced systolic function. This is also why the entry conforms to
      cardiomyopathy_maladaptive_remodeling and NOT to
      cardiac_ion_channel_repolarization, whose scope is explicitly inherited
      arrhythmia syndromes in structurally normal hearts.
    evidence:
    - reference: PMID:20033705
      reference_title: "Human K(ATP) channelopathies: diseases of metabolic homeostasis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "KATP channelopathies implicated in patients with mechanical and/or electrical heart disease include dilated cardiomyopathy (with ventricular arrhythmia; CMD1O) and adrenergic atrial fibrillation."
      explanation: >-
        Names CMD1O explicitly as a KATP channelopathy with combined mechanical
        and electrical heart disease, which is the classification asserted here.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    There is no CMD1O-specific prevalence, incidence or carrier-frequency
    estimate, and none can be derived while the gene-disease relationship is
    classified as Limited. The only denominator in the literature is the founding
    screen — two ABCC9 variants among 323 people with idiopathic dilated
    cardiomyopathy — which is a yield within a selected case series and must not
    be converted into a population rate. Dilated cardiomyopathy as a whole has
    been estimated at approximately 1 in 250 adults; ABCC9 accounts for no
    established share of that.
  evidence:
  - reference: PMID:39394525
    reference_title: "Pathophysiology of dilated cardiomyopathy: from mechanisms to precision medicine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The prevalence of DCM has been estimated at approximately 1 in 250 adults"
    explanation: >-
      Supplies the all-cause dilated cardiomyopathy prevalence that frames this
      record. It is deliberately not a CMD1O figure, which is the point the
      record makes.
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Sex distribution is unknown for CMD1O; the two index cases were one woman and
    one man. Recorded here only because dilated cardiomyopathy overall carries a
    roughly 2:1 male excess that persists in genotype-positive patients, so a
    future CMD1O series should be read against that background rather than
    against an assumption of equal ascertainment.
  evidence:
  - reference: PMID:39895490
    reference_title: "Systematic Review, Meta-Analysis, and Population Study to Determine the Biologic Sex Ratio in Dilated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall DCM cohort had a 0.30 female proportion (95% CI, 0.28-0.32), corresponding to a male:female ratio (M:F) of 2.38:1."
    explanation: >-
      Quantifies the all-cause dilated cardiomyopathy sex ratio that this record
      uses as background. Not a CMD1O measurement.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    The asserted model is autosomal dominant: both founding probands carried a
    heterozygous ABCC9 variant. The 2004 report additionally describes an affected
    parent in one family from whom DNA was not available, so the transmission was
    never genotype-confirmed; that family detail sits in the paper's paywalled
    body and is recorded here as context rather than as cited evidence.
    Penetrance and expressivity are unknown from two families, and ClinGen's
    autosomal dominant classification of the gene-disease relationship is
    Limited rather than an endorsement of the mode. The contrast with the
    recessive ABCC9 disorder is
    load-bearing rather than incidental — in AIMS, heterozygous parents of
    biallelic probands show no conserved clinical pathology, so a single ABCC9
    loss-of-function allele is not on its own sufficient for the AIMS phenotype.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:15034580
    reference_title: "ABCC9 mutations identified in human dilated cardiomyopathy disrupt catalytic KATP channel gating."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Scanning of genomic DNA from individuals with heart failure and rhythm disturbances due to idiopathic dilated cardiomyopathy identified two mutations in ABCC9, which encodes the regulatory SUR2A subunit of the cardiac K(ATP) channel."
    explanation: >-
      The founding human genetic observation on which the dominant model rests:
      heterozygous variants ascertained in affected individuals.
  - reference: PMID:38217872
    reference_title: "Novel loss-of-function variants expand ABCC9-related intellectual disability and myopathy syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous parents do not show any conserved clinical pathology"
    explanation: >-
      Supports the separation of dominant CMD1O from recessive AIMS by an
      inference step - carriers of one AIMS allele do not manifest the AIMS
      phenotype, so any dominant ABCC9 cardiac disease has to be a different
      claim about a different allele class.
pathophysiology:
- name: ABCC9 C-Terminal Catalytic-Domain Variant
  description: >-
    A heterozygous exon-38 ABCC9 variant in conserved C-terminal sequence adjacent
    to the second catalytic ATPase pocket of SUR2A. The two founding alleles are a
    missense p.(Ala1513Thr) and a frameshift p.(Leu1524fs); neither is a simple
    whole-protein null, and the frameshift truncates within the nucleotide-binding
    region rather than removing the subunit. Their location is the mechanistic
    point - these residues sit where the receptor performs nucleotide catalysis,
    not where it conducts potassium.
  biological_scale: MOLECULAR
  downstream:
  - target: Aberrant SUR2A ATP Hydrolytic Cycle
    causal_link_type: DIRECT
    description: >-
      The variants were shown to alter the conformational behaviour of the
      recombinant receptor's own hydrolytic cycle.
    evidence:
    - reference: PMID:15034580
      reference_title: "ABCC9 mutations identified in human dilated cardiomyopathy disrupt catalytic KATP channel gating."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mutant SUR2A proteins showed aberrant redistribution of conformations in the intrinsic ATP hydrolytic cycle, translating into abnormal K(ATP) channel phenotypes with compromised metabolic signal decoding."
      explanation: >-
        Directly links the mutant protein to a disturbed ATP hydrolytic cycle,
        which is the step this edge asserts.
  evidence:
  - reference: PMID:15034580
    reference_title: "ABCC9 mutations identified in human dilated cardiomyopathy disrupt catalytic KATP channel gating."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These missense and frameshift mutations mapped to evolutionarily conserved domains adjacent to the catalytic ATPase pocket within SUR2A."
    explanation: >-
      States the allele class and the domain, which is what defines this node.
  - reference: PMID:39337275
    reference_title: "Unveiling the Spectrum of Minor Genes in Cardiomyopathies: A Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One is a frameshift mutation (c.4570_4572delinsAAAT, p.(Leu1524fs)) and the second one is a missense mutation (c.4537G>A, p.(Ala1513Thr)), both altering KATP channel function in vitro and suggesting a mechanistic link to DCM pathogenesis"
    explanation: >-
      Gives the coding and protein-level descriptions of both founding alleles as
      restated by a later review.
- name: Aberrant SUR2A ATP Hydrolytic Cycle
  description: >-
    SUR2A is an ABC protein and its nucleotide-binding domains hydrolyse ATP as
    part of normal channel operation; the hydrolytic cycle is the transduction
    step, not a housekeeping side reaction. In the mutant receptor the
    distribution of conformational states across that cycle is shifted, so the
    receptor no longer reports the prevailing Mg-nucleotide state faithfully to
    the pore. The defect is qualitative - regulation is displaced rather than
    simply reduced - which is why the modifier here is DYSREGULATED and not
    DECREASED.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: SUR2A nucleotide-binding-domain ATP hydrolysis
    modifier: DYSREGULATED
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
  downstream:
  - target: Defective Catalysis-Mediated KATP Pore Gating
    causal_link_type: DIRECT
    description: >-
      Disturbed catalysis in the regulatory subunit propagates to the gating of
      the Kir6.2 pore it controls.
    evidence:
    - reference: PMID:15034580
      reference_title: "ABCC9 mutations identified in human dilated cardiomyopathy disrupt catalytic KATP channel gating."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Defective catalysis-mediated pore regulation is thus a mechanism for channel dysfunction and susceptibility to dilated cardiomyopathy."
      explanation: >-
        The authors' own statement of the catalysis-to-pore-regulation step this
        edge draws.
  evidence:
  - reference: PMID:15034580
    reference_title: "ABCC9 mutations identified in human dilated cardiomyopathy disrupt catalytic KATP channel gating."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutant SUR2A proteins showed aberrant redistribution of conformations in the intrinsic ATP hydrolytic cycle, translating into abnormal K(ATP) channel phenotypes with compromised metabolic signal decoding."
    explanation: >-
      Establishes the hydrolytic-cycle abnormality as a measured property of the
      mutant proteins.
- name: Defective Catalysis-Mediated KATP Pore Gating
  description: >-
    The sarcolemmal KATP channel is an octamer of four SUR2A subunits around four
    Kir6.2 pores. With catalysis in SUR2A displaced, the pore's nucleotide
    sensitivity is set incorrectly: the channel is present and can conduct, but it
    is no longer under proper regulatory control by the cell's energetic state.
    That qualitative loss of regulatory control - rather than a quantitative drop
    in potassium current - is the reason this node carries LOSS_OF_FUNCTION rather
    than DECREASED.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: nucleotide-gated cardiac KATP channel activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0015272
      label: ATP-activated inward rectifier potassium channel activity
  downstream:
  - target: Compromised Metabolic Signal Decoding in the Cardiomyocyte
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15034580
      reference_title: "ABCC9 mutations identified in human dilated cardiomyopathy disrupt catalytic KATP channel gating."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mutant SUR2A proteins showed aberrant redistribution of conformations in the intrinsic ATP hydrolytic cycle, translating into abnormal K(ATP) channel phenotypes with compromised metabolic signal decoding."
      explanation: >-
        The same sentence states both the channel phenotype and the resulting
        failure to decode a metabolic signal, which is the edge asserted here.
  evidence:
  - reference: PMID:31061927
    reference_title: "Deletion of Sulfonylurea Receptor 2 in the Adult Myocardium Enhances Cardiac Glucose Uptake and Is Cardioprotective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The major ventricular cardiomyocyte KATP channel is composed of SUR2 and Kir6.2, encoded by ABCC9 and KCNJ11, respectively."
    explanation: >-
      Establishes the subunit composition of the channel whose gating this node
      describes, and so which cardiac channel an ABCC9 variant acts on.
  - reference: PMID:36170658
    reference_title: "Personalized Therapeutics for K(ATP)-Dependent Pathologies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ABCC9 gives rise to distinct SUR2A and SUR2B subunits that differ in the carboxyl terminal 42 amino acids."
    explanation: >-
      Explains why a C-terminal ABCC9 variant is isoform-relevant, since the
      cardiac SUR2A and vascular SUR2B forms differ precisely in that region.
- name: Compromised Metabolic Signal Decoding in the Cardiomyocyte
  description: >-
    In an intact ventricular cardiomyocyte the KATP channel behaves as a rheostat
    that couples the ATP/ADP ratio to membrane potential. When the receptor
    mis-reads that ratio, the coupling between energetic state and electrical
    behaviour is broken - the cell can no longer translate a metabolic signal into
    the appropriate change in potassium conductance and membrane potential.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:
      id: CL:0002131
      label: regular ventricular cardiac myocyte
  biological_processes:
  - preferred_term: metabolically gated potassium efflux
    modifier: DYSREGULATED
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
  - preferred_term: coupling of energetic state to membrane potential
    modifier: DYSREGULATED
    term:
      id: GO:0042391
      label: regulation of membrane potential
  downstream:
  - target: Failure of Metabolic-Electrical Adaptation Under Cardiac Stress
    causal_link_type: DIRECT
    description: >-
      The consequence of mis-decoding is only exposed when energetic demand rises,
      which is what makes this a stress-conditional lesion.
    evidence:
    - reference: PMID:15034580
      reference_title: "ABCC9 mutations identified in human dilated cardiomyopathy disrupt catalytic KATP channel gating."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Stress tolerance of the heart requires high-fidelity metabolic sensing by ATP-sensitive potassium (K(ATP)) channels that adjust membrane potential-dependent functions to match cellular energetic demand."
      explanation: >-
        States the premise this edge depends on - that the decoded metabolic
        signal is what confers stress tolerance, so mis-decoding shows up as
        failed adaptation.
  evidence:
  - reference: PMID:20033705
    reference_title: "Human K(ATP) channelopathies: diseases of metabolic homeostasis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KATP channels are metabolism-gated biosensors functioning as molecular rheostats that adjust membrane potential-dependent functions to match cellular energetic demands."
    explanation: >-
      Defines the normal decoding function whose failure this node describes.
  - reference: PMID:36170658
    reference_title: "Personalized Therapeutics for K(ATP)-Dependent Pathologies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ubiquitously expressed throughout the body, ATP-sensitive potassium (KATP) channels couple cellular metabolism to electrical activity in multiple tissues"
    explanation: >-
      Independent statement of the metabolism-to-electrical-activity coupling this
      node claims is broken.
- name: Failure of Metabolic-Electrical Adaptation Under Cardiac Stress
  description: >-
    This is the primary myocyte insult of CMD1O, and it is conditional rather than
    constitutive: at rest the heart is largely unremarkable, and the deficit
    emerges when adrenergic, ischemic, exercise or pressure load raises energetic
    demand and the myocyte cannot shorten its action potential and trim its
    membrane-potential-dependent work accordingly. The direct human demonstration
    is missing; the step is supported by KATP-deficient animals, in which baseline
    phenotypes are mild and the failure is unmasked by imposed stress.
  biological_scale: CELLULAR
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:
      id: CL:0002131
      label: regular ventricular cardiac myocyte
  biological_processes:
  - preferred_term: stress-adaptive shortening of the cardiac action potential
    modifier: DECREASED
    term:
      id: GO:0099622
      label: cardiac muscle cell membrane repolarization
  - preferred_term: myocardial response to ischemic and energetic stress
    modifier: DECREASED
    term:
      id: GO:0002931
      label: response to ischemia
  downstream:
  - target: Cytosolic Calcium Overload
    causal_link_type: DIRECT
    description: >-
      In the Kir6.2-null mouse the uncoupling of metabolic distress from membrane
      response is what sets calcium overload in motion. The step is
      pathway-level rather than ABCC9-allele-specific.
    evidence:
    - reference: PMID:16782803
      reference_title: "KCNJ11 gene knockout of the Kir6.2 KATP channel causes maladaptive remodeling and heart failure in hypertension."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Defective decoding of hypertension-induced metabolic distress signals in the K(ATP) channel knockout set in motion pathological calcium overload and aggravated cardiac remodeling through a calcium/calcineurin-dependent cyclosporine-sensitive pathway."
      explanation: >-
        Demonstrates the decoding-failure-to-calcium-overload step, but in a
        Kir6.2 pore knockout rather than in an ABCC9 regulatory-subunit variant,
        so it reaches CMD1O by an inference step across the channel complex.
  evidence:
  - reference: PMID:15910878
    reference_title: "Cardiac KATP channels in health and disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "K(ATP) channels have been further implicated in the adaptive cardiac response to chronic (patho)physiologic hemodynamic load, with K(ATP) channel deficiency affecting structural remodeling, rendering the heart vulnerable to calcium-dependent maladaptation and predisposing to heart failure."
    explanation: >-
      States the adaptive role under chronic load whose failure defines this node,
      and names the calcium-dependent maladaptation that follows it.
  - reference: PMID:16782803
    reference_title: "KCNJ11 gene knockout of the Kir6.2 KATP channel causes maladaptive remodeling and heart failure in hypertension."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The intact KCNJ11-encoded K(ATP) channel is thus a required safety element preventing hypertension-induced heart failure"
    explanation: >-
      Frames the channel as a stress-conditional safety element, supporting this
      node through the pore subunit rather than the regulatory subunit.
- name: Cytosolic Calcium Overload
  description: >-
    Loss of the KATP-dependent brake on membrane-potential-dependent calcium entry
    permits pathological calcium accumulation in the stressed myocyte. That this
    is the operative intermediate, and not merely a correlate, is shown by rescue:
    in the Kir6.2-null mouse the failing phenotype was corrected by controlling
    myocardial calcium influx by an alternative route, bypassing the uncoupled
    metabolic-electrical step entirely.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:
      id: CL:0002131
      label: regular ventricular cardiac myocyte
  biological_processes:
  - preferred_term: cardiomyocyte calcium homeostasis
    modifier: DYSREGULATED
    term:

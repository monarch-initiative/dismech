progression:
- phase: Early childhood presentation
  age_range: Onset in infancy or early childhood; diagnosis often delayed
  notes: >-
    Clinical features begin early (mean about 2 years) but diagnosis is frequently
    delayed by years because of the variable phenotype.
  evidence:
  - reference: PMID:30716504
    reference_title: "Long-Term Outcome of WHIM Syndrome in 18 Patients: High Risk of Lung Disease and HPV-Related Malignancies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical features manifested at 2.2 ± 2.6 years of age, whereas the disease
      diagnosis was delayed until 12.5 ± 10.4 years of age."
    explanation: Documents early onset and the substantial diagnostic delay.
- phase: Adult complications
  age_range: Adulthood
  notes: >-
    Long-term morbidity is dominated by chronic obstructive lung disease from
    recurrent pneumonia and by HPV- and EBV-associated malignancies.
  evidence:
  - reference: PMID:38442908
    reference_title: CXCR4 WHIM syndrome is a cancer predisposition condition for virus-induced malignancies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 40-year risk of malignancy was 39% (95% confidence interval [CI]: 6%-74%)."
    explanation: Quantifies the substantial cumulative cancer risk over adult life.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    WHIM syndrome causes lifelong severe cytopenias with recurrent bacterial
    infection from infancy, progressive bronchiectasis and chronic lung disease, and
    a high cumulative risk of virus-associated malignancy. Standard care is only
    partially effective; mechanism-based CXCR4 antagonists and transplantation have
    improved outcomes but the disease and its complications remain serious.
  evidence:
  - reference: PMID:30716504
    reference_title: "Long-Term Outcome of WHIM Syndrome in 18 Patients: High Risk of Lung Disease and HPV-Related Malignancies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with WHIM need careful monitoring and timely intervention for complications,
      mainly lung disease and HPV-related malignancies."
    explanation: Establishes the major long-term morbidities driving the HIGH burden assessment.
  - reference: PMID:38442908
    reference_title: CXCR4 WHIM syndrome is a cancer predisposition condition for virus-induced malignancies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 40-year risk of malignancy was 39% (95% confidence interval [CI]: 6%-74%)."
    explanation: The high cumulative malignancy risk supports the HIGH burden.
discussions:
- discussion_id: pdc_interferon_wart_susceptibility
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is susceptibility to human papillomavirus so disproportionate in WHIM
    syndrome relative to other immunodeficiencies, and how much is due to the
    plasmacytoid dendritic cell / type I interferon defect versus a cell-intrinsic
    keratinocyte CXCR4 effect?
  attaches_to:
  - pathophysiology#Plasmacytoid Dendritic Cell Deficiency
  - pathophysiology#CXCR4-Driven HPV Keratinocyte Transformation
  rationale: >-
    HPV susceptibility in WHIM syndrome exceeds what neutropenia and antibody
    deficiency alone predict. Two non-exclusive mechanisms are proposed: loss of
    plasmacytoid dendritic cell type I interferon output, and a cell-intrinsic effect
    of the gain-of-function receptor in HPV-infected keratinocytes that promotes
    transformation. Their relative contributions in patients are not established, and
    it is not settled why HPV in particular, rather than other viruses, dominates.
  evidence:
  - reference: PMID:20736454
    reference_title: "Defect of plasmacytoid dendritic cells in warts, hypogammaglobulinemia, infections, myelokathexis (WHIM) syndrome patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we hypothesized that the susceptibility of WHIM patients to warts is related
      to the abnormal homeostasis of plasmacytoid dendritic cells."
    explanation: States the interferon/pDC hypothesis for HPV susceptibility.
  - reference: PMID:21147466
    reference_title: "A pivotal role for CXCL12 signaling in HPV-mediated transformation of keratinocytes: clues to understanding HPV-pathogenesis in WHIM syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results establish a pivotal role for CXCL12 signaling in HPV-mediated
      transformation and provide a mechanistic basis for understanding HPV pathogenesis
      in WHIM syndrome."
    explanation: Provides the competing cell-intrinsic keratinocyte mechanism.
- discussion_id: human_model_mismatch_lymphopoiesis
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the mesenchymal stromal niche mechanism of B and T lymphopenia defined in
    the R334X mouse operate the same way in human WHIM syndrome bone marrow?
  attaches_to:
  - pathophysiology#Impaired B and T Lymphopoiesis
  rationale: >-
    The switch from an adipogenic to an osteolineage-prone marrow stroma with reduced
    IL-7, and the rescue of B-cell development by LTbetaR or CXCR4 blockade, are
    defined in the CXCR4 R334X mouse. Human lymphopenia is concordant at the level of
    reduced early B-progenitor output, but the stromal transcriptional mechanism has
    not been demonstrated directly in human marrow, so its translational validity is
    the open question.
  evidence:
  - reference: PMID:36149943
    reference_title: Dysregulated stem cell niches and altered lymphocyte recirculation cause B and T cell lymphopenia in WHIM syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Blocking LTβR or CXCR4 signaling restored IL-7 production and B cell development
      in WHIM mice."
    explanation: The stromal mechanism and its rescue are established in the mouse, not
      yet in human tissue, which defines the mismatch.
notes: >-
  Scope. This entry is WHIM syndrome 1 (MONDO:8000006), the CXCR4 gain-of-function
  form, which accounts for nearly all molecularly confirmed cases. WHIM syndrome 2
  is a distinct disease caused by CXCR2 variants and is not curated here; rare
  clinically typical patients with a wild-type CXCR4 open reading frame (some with a
  GRK3 defect) also exist and are outside this CXCR4 entry. Several cited functional
  studies (PMID:15026312, PMID:15536153, PMID:18274673) include such CXCR4-wild-type
  patients; snippets used from them describe the shared enhanced-CXCL12-response
  biology rather than the CXCR4 genotype.

  Mechanism confidence. The core chain, CXCR4 carboxy-terminal gain-of-function
  variant, impaired desensitization and internalization, enhanced CXCL12-CXCR4
  signaling and marrow leukocyte retention, is directly measured in patient cells
  and confirmed pharmacologically (leukocytes mobilize within hours of CXCR4
  blockade), and is graded established. An early three-patient study (PMID:15026312)
  reported no internalization defect while still finding enhanced chemotaxis; later
  patient-cell and systematic 14-variant analyses (PMID:36089616) found impaired
  internalization, which the entry follows. The lymphopoiesis, plasmacytoid
  dendritic cell and keratinocyte-transformation branches rest partly on mouse and
  in vitro work and are graded provisional.

  GeneReviews. No GeneReviews chapter for WHIM syndrome was found in PubMed
  (genereviews[book]) at the time of curation; myelokathexis and CXCR4 likewise
  returned none.

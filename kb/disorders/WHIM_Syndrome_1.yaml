- name: CXCR4-Driven HPV Keratinocyte Transformation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Oncogenic HPV16 and HPV18 induce CXCL12 and its receptors in keratinocytes
    through the E6 and E7 oncoproteins, and the autocrine loop controls motility and
    survival of infected cells. Expression of a WHIM gain-of-function CXCR4 mutant
    confers transforming capacity on HPV18-immortalized keratinocytes, offering a
    cell-intrinsic contribution to HPV-associated dysplasia and carcinoma alongside
    the immune defect.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:21147466
    reference_title: "A pivotal role for CXCL12 signaling in HPV-mediated transformation of keratinocytes: clues to understanding HPV-pathogenesis in WHIM syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Strikingly, expression of a WHIM syndrome-related gain-of-function CXCR4 mutant
      confers transforming capacity to HPV18-immortalized keratinocytes."
    explanation: Cell-culture evidence that the mutant receptor promotes transformation
      of HPV-infected keratinocytes.
  downstream:
  - target: HPV-associated squamous cell carcinoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed on in vitro grounds; the relative contributions of keratinocyte CXCR4
      signaling and impaired immune surveillance to carcinoma in patients are not
      established.

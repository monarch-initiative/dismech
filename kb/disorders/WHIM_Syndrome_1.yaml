treatments:
- name: Mavorixafor
  description: >-
    Oral, once-daily selective CXCR4 antagonist. In April 2024 it became the first
    therapy approved for WHIM syndrome (FDA), for patients aged 12 years and older,
    to increase circulating mature neutrophils and lymphocytes. In a phase 3
    placebo-controlled trial it increased time above the neutrophil and lymphocyte
    thresholds and reduced annualized infection rate by about 60%.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavorixafor
      term:
        id: CHEBI:138865
        label: AMD 070
  dosing_interval: once daily
  dosing_interval_days: 1
  target_phenotypes:
  - preferred_term: Chronic severe neutropenia
    term:
      id: HP:0410252
      label: Persistently decreased total neutrophil count
  - preferred_term: Lymphopenia
    term:
      id: HP:0001888
      label: Decreased total lymphocyte count
  target_mechanisms:
  - target: Enhanced CXCL12-CXCR4 Signaling
    treatment_effect: INHIBITS
    description: >-
      Mavorixafor blocks CXCL12 binding to CXCR4, antagonizing the hyperactive
      signaling and releasing sequestered leukocytes into the blood.
    evidence:
    - reference: PMID:38643510
      reference_title: "A phase 3 randomized trial of mavorixafor, a CXCR4 antagonist, for WHIM syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In 31 participants (mavorixafor, n = 14; placebo, n = 17), mavorixafor
        least squares (LS) mean TATANC was 15.0 hours and 2.8 hours for placebo (P < .001)."
      explanation: The CXCR4 antagonist increased time above the neutrophil threshold
        versus placebo, showing mechanism-based mobilization.
  evidence:
  - reference: PMID:39004659
    reference_title: "Mavorixafor: First Approval."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In April 2024, it became the first therapy to be approved for WHIM syndrome"
    explanation: Records the 2024 FDA approval of mavorixafor for WHIM syndrome.
  - reference: PMID:38643510
    reference_title: "A phase 3 randomized trial of mavorixafor, a CXCR4 antagonist, for WHIM syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annualized infection rates were 60% lower with mavorixafor vs placebo (LS
      mean 1.7 vs 4.2; nominal P = .007)"
    explanation: Phase 3 evidence of clinical benefit (reduced infection rate).
- name: Plerixafor
  description: >-
    Parenteral small-molecule CXCR4 antagonist used off-label as mechanism-based
    therapy. Low-dose plerixafor corrects panleukopenia in WHIM syndrome by
    mobilizing sequestered leukocytes; a phase 3 crossover trial found it noninferior
    to G-CSF for neutrophil maintenance and superior for lymphocyte counts.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: plerixafor
      term:
        id: CHEBI:125354
        label: plerixafor
  target_phenotypes:
  - preferred_term: Chronic severe neutropenia
    term:
      id: HP:0410252
      label: Persistently decreased total neutrophil count
  target_mechanisms:
  - target: Enhanced CXCL12-CXCR4 Signaling
    treatment_effect: INHIBITS
    description: >-
      Plerixafor competitively antagonizes CXCR4, releasing leukocytes retained by
      the hyperactive CXCL12-CXCR4 signal.
    evidence:
    - reference: PMID:21890643
      reference_title: The CXCR4 antagonist plerixafor corrects panleukopenia in patients with WHIM syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Plerixafor increased absolute lymphocyte, monocyte, and neutrophil counts
        in blood to normal without significant side effects in all 3 patients."
      explanation: CXCR4 blockade restores all three depleted lineages, confirming the
        mechanism-based effect.
  evidence:
  - reference: PMID:37561579
    reference_title: A phase III randomized crossover trial of plerixafor versus G-CSF for treatment of WHIM syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "plerixafor was noninferior to G-CSF for maintaining neutrophil counts of
      more than 500 cells/μL (P = 0.023) and was superior to G-CSF for maintaining lymphocyte
      counts above 1,000 cells/μL (P < 0.0001)."
    explanation: Phase 3 crossover evidence for plerixafor efficacy relative to G-CSF.
- name: Granulocyte Colony-Stimulating Factor
  description: >-
    G-CSF (filgrastim) raises the neutrophil count and has long been a standard
    treatment, but it does not correct the monocytopenia, lymphopenia or
    hypogammaglobulinemia, and long-term use can cause bone pain.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: colony-stimulating factor therapy
    term:
      id: NCIT:C15515
      label: Colony-Stimulating Factor Therapy
    therapeutic_agent:
    - preferred_term: filgrastim
      term:
        id: NCIT:C1474
        label: Filgrastim
  target_phenotypes:
  - preferred_term: Chronic severe neutropenia
    term:
      id: HP:0410252
      label: Persistently decreased total neutrophil count
  target_mechanisms:
  - target: Chronic severe neutropenia
    treatment_effect: MODULATES
    description: >-
      G-CSF drives residual granulopoiesis and neutrophil release, raising the blood
      neutrophil count without addressing the CXCR4 retention signal, so other
      cytopenias persist.
    evidence:
    - reference: PMID:30625055
      reference_title: Plerixafor for the Treatment of WHIM Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with WHIM syndrome are often treated with granulocyte colony-stimulating
        factor (G-CSF), which can increase neutrophil counts but does not affect cytopenias
        other than neutropenia."
      explanation: States that G-CSF raises neutrophils only and leaves the other cytopenias
        untreated.
  evidence:
  - reference: PMID:30716504
    reference_title: "Long-Term Outcome of WHIM Syndrome in 18 Patients: High Risk of Lung Disease and HPV-Related Malignancies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 50% of patients received antibiotic prophylaxis, whereas G-CSF
      and immunoglobulin treatments were used in 72% and 55% of patients, respectively."
    explanation: Documents G-CSF as a widely used treatment in the international cohort.

- name: Defective B Cell Memory and Isotype Switching
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    The circulating B-cell pool is small and oligoclonal, memory B cells are reduced,
    and switching from IgM to IgG after immunization is markedly impaired. Altered
    CXCR4 signaling in germinal center trafficking has been proposed as the cause.
    The defect is incomplete: vaccine responses can occur, which is why
    hypogammaglobulinemia is variable rather than constant.

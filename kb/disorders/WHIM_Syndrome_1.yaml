      label: neutrophil chemotaxis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:12692554
    reference_title: "Mutations in the chemokine receptor gene CXCR4 are associated with WHIM syndrome, a combined immunodeficiency disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the peripheral neutropenia, bone marrow aspirates from affected individuals
      contain abundant mature myeloid cells, a condition termed myelokathexis."
    explanation: Describes marrow retention of mature myeloid cells in patients.
  - reference: PMID:31313072
    reference_title: "WHIM Syndrome: from Pathogenesis Towards Personalized Medicine and Cure."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Myelokathexis is a unique form of non-cyclic severe congenital neutropenia
      caused by accumulation of mature and degenerating neutrophils in the bone marrow"
    explanation: Defines myelokathexis as marrow accumulation of mature, degenerating
      neutrophils.
  downstream:
  - target: Chronic severe neutropenia
    causal_link_type: DIRECT
    description: >-
      Neutrophils retained in the marrow do not reach the blood.
    evidence:
    - reference: PMID:30625055
      reference_title: Plerixafor for the Treatment of WHIM Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Myelokathexis is neutropenia caused by neutrophil retention in bone marrow."
      explanation: States the peripheral neutropenia is caused by marrow retention.
  - target: Myelokathexis
    causal_link_type: DIRECT
    description: >-
      Marrow retention of mature neutrophils is the pathological process the bone
      marrow finding of myelokathexis records.

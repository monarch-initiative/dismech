    Lymphopenia is evident at early progenitor stages. In knock-in mice the
    gain-of-function receptor impairs thymopoiesis and B-cell development; in the
    R334X mouse, marrow mesenchymal stromal cells switch from an adipogenic to an
    osteolineage-prone program with reduced IL-7 production, limiting lymphopoiesis.
    Human data are consistent but the stromal mechanism rests mainly on mouse work.

    term:
      id: GO:0038160
      label: CXCL12-activated CXCR4 signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:15536153
    reference_title: WHIM syndromes with different genetic anomalies are accounted for by impaired CXCR4 desensitization to CXCL12.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Circulating lymphocytes and neutrophils from all patients displayed similar
      functional alterations of CXCR4-mediated responses featured by a marked enhancement
      of G-protein-dependent responses."
    explanation: Patient neutrophils and lymphocytes show enhanced G protein-dependent
      CXCR4 responses.
  - reference: PMID:12692554
    reference_title: "Mutations in the chemokine receptor gene CXCR4 are associated with WHIM syndrome, a combined immunodeficiency disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lymphoblastoid cell lines carrying a 19-residue truncation mutation show
      significantly greater calcium flux relative to control cell lines in response to
      the CXCR4 ligand, SDF-1, consistent with dysregulated signaling by the mutant receptor."
    explanation: Increased calcium flux in patient-derived cells carrying a truncating
      variant.
  - reference: PMID:15026312
    reference_title: "Altered leukocyte response to CXCL12 in patients with warts hypogammaglobulinemia, infections, myelokathexis (WHIM) syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, the chemotactic response of both polymorphonuclear cells and T lymphocytes
      in response to CXCL12 is increased."
    explanation: Enhanced chemotaxis of patient neutrophils and T cells toward CXCL12.
  downstream:
  - target: Neutrophil Retention in Bone Marrow
    causal_link_type: DIRECT
    description: >-
      Excess responsiveness to the marrow CXCL12 gradient opposes egress of mature
      neutrophils into the blood.
    evidence:
    - reference: PMID:15026312
      reference_title: "Altered leukocyte response to CXCL12 in patients with warts hypogammaglobulinemia, infections, myelokathexis (WHIM) syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we suggest that the altered leukocyte response to CXCL12 may account for
        the pathologic retention of mature polymorphonuclear cells in the bone marrow
        (myelokathexis)"
      explanation: Proposes the enhanced CXCL12 response as the cause of marrow neutrophil
        retention, later supported by the pharmacological rescue.
  - target: Lymphocyte and Monocyte Sequestration
    causal_link_type: DIRECT
    description: >-
      The same retention signal holds lymphocytes and monocytes out of the blood,
      producing panleukopenia rather than isolated neutropenia.
    evidence:
    - reference: PMID:21890643
      reference_title: The CXCR4 antagonist plerixafor corrects panleukopenia in patients with WHIM syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These data provide the first pharmacologic evidence that panleukopenia
        in WHIM syndrome is caused by CXCL12-CXCR4 signaling-dependent leukocyte sequestration"
      explanation: Pharmacological blockade in patients shows the panleukopenia depends
        on CXCL12-CXCR4 signaling.
  - target: Impaired B and T Lymphopoiesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Desensitization-resistant CXCR4 disturbs lymphoid progenitor development in the
      marrow and thymus, partly through altered stromal niche function.
    evidence:
    - reference: PMID:22438253
      reference_title: Proper desensitization of CXCR4 is required for lymphocyte development and peripheral compartmentalization in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, Cxcr4(+/1013) mice show defective thymopoiesis and B-cell
        development, accounting for circulating lymphopenia."
      explanation: In a knock-in mouse carrying a desensitization-resistant receptor,
        lymphoid development is defective.
  - target: Plasmacytoid Dendritic Cell Deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Plasmacytoid dendritic cell generation and motility partly depend on CXCR4; how
      the gain-of-function receptor depletes them is not established.
    evidence:
    - reference: PMID:20736454
      reference_title: "Defect of plasmacytoid dendritic cells in warts, hypogammaglobulinemia, infections, myelokathexis (WHIM) syndrome patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These mutations confer an increased leukocyte response to the CXCR4-ligand
        CXCL12, resulting in abnormal homeostasis of many leukocyte types, including
        neutrophils and lymphocytes."
      explanation: Frames the dendritic cell defect as another consequence of the enhanced
        leukocyte response to CXCL12.
- name: Neutrophil Retention in Bone Marrow
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Myelokathexis: mature neutrophils accumulate in a hypercellular marrow with a
    shift toward mature forms and degenerate there, showing cytoplasmic vacuolation
    and hyperlobulated pyknotic nuclei, instead of being released into the blood. It
    is close to pathognomonic for WHIM syndrome.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  biological_processes:

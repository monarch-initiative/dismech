animal_models:
- name: CXCR4 R334X knock-in WHIM mouse
  species: Mouse
  genotype: Cxcr4(+/1013) heterozygous knock-in (murine equivalent of human R334X)
  publication: PMID:22438253
  description: >-
    A heterozygous Cxcr4 knock-in mouse expressing a desensitization-resistant
    receptor. It reproduces the enhanced leukocyte response to CXCL12, the
    leukopenia, and the defective B and T lymphopoiesis of WHIM syndrome, and the
    leukopenia is reversed by CXCR4 antagonists, establishing the causal role of the
    mutant receptor. A parallel R334X gain-of-function model was used to dissect the
    stromal niche contribution to lymphopenia.
  modeled_mechanisms:
  - target: Lymphocyte and Monocyte Sequestration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The knock-in mouse reproduces the peripheral leukopenia and its reversal by
      CXCR4 antagonists, matching the human sequestration mechanism.
    limitations: >-
      A murine 1013 truncation modeling the human R334X allele; species differences
      in marrow architecture and lymphoid compartments qualify the fit.
    evidence:
    - reference: PMID:22438253
      reference_title: Proper desensitization of CXCR4 is required for lymphocyte development and peripheral compartmentalization in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cxcr4(+/mutant(1013)) mice display leukocytes with enhanced responses to
        Cxcl12 and exhibit leukopenia as reported in patients."
      explanation: The model recapitulates the enhanced CXCL12 response and leukopenia
        of patients.
  - target: Impaired B and T Lymphopoiesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knock-in mouse shows defective thymopoiesis and B-cell development,
      reproducing the developmental component of the human lymphopenia.
    limitations: >-
      Mouse lymphoid ontogeny differs from human; the stromal-niche mechanism is best
      characterized in the separate R334X model.
    evidence:
    - reference: PMID:22438253
      reference_title: Proper desensitization of CXCR4 is required for lymphocyte development and peripheral compartmentalization in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, Cxcr4(+/1013) mice show defective thymopoiesis and B-cell
        development, accounting for circulating lymphopenia."
      explanation: The model reproduces the defective lymphopoiesis underlying the lymphopenia.
  evidence:
  - reference: PMID:22438253
    reference_title: Proper desensitization of CXCR4 is required for lymphocyte development and peripheral compartmentalization in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treatment with CXCL12/CXCR4 antagonists transiently reverses blood anomalies,
      further demonstrating the causal role of the mutant receptor in the leukopenia."
    explanation: Antagonist reversal in the model establishes it as informative for the
      human sequestration mechanism.

synonyms:
- WHIM syndrome
- WHIMS
- Warts, hypogammaglobulinemia, infections, and myelokathexis syndrome
- Warts-hypogammaglobulinemia-infections-myelokathexis syndrome
- Myelokathexis
- CXCR4-related WHIM syndrome
description: >-
  WHIM syndrome 1 is the CXCR4 form of WHIM syndrome, a rare autosomal dominant
  combined primary immunodeficiency named for its tetrad of warts,
  hypogammaglobulinemia, infections and myelokathexis. It is caused by
  heterozygous gain-of-function variants in CXCR4, most of them nonsense or
  frameshift variants that truncate the cytoplasmic carboxy-terminal tail of the
  receptor (R334X is the most common), and more rarely a charge-changing missense
  substitution in the same domain. The tail carries the phosphorylation sites that
  normally terminate signaling, so the mutant receptor resists CXCL12-induced
  desensitization and internalization and signals in an enhanced, prolonged
  fashion.

  The exaggerated response to CXCL12, the chemokine that holds leukocytes in the
  bone marrow, produces the defining hematopathology. Mature neutrophils are
  retained in the marrow (myelokathexis), where they become hypersegmented and
  degenerate, while the blood shows chronic severe neutropenia. Most patients are
  panleukopenic: lymphocytes (especially B cells), monocytes and plasmacytoid
  dendritic cells are also reduced, reflecting both leukocyte sequestration and
  defective B and T lymphopoiesis. Humoral immunity is impaired, with poor class
  switching, reduced memory B cells and variable hypogammaglobulinemia.

  Clinically, bacterial infections of the ears, sinuses, lungs and skin begin in
  infancy or early childhood, and recurrent pneumonia leads to bronchiectasis.
  Susceptibility to human papillomavirus is disproportionate: cutaneous and
  anogenital warts are refractory to treatment and can progress to HPV-associated
  squamous cell carcinoma, and EBV-associated lymphomas also occur. Conotruncal
  heart defects, including tetralogy of Fallot, and autoimmune complications are
  uncommon additional features. Standard care is G-CSF, immunoglobulin replacement
  and antibiotic prophylaxis; mechanism-based therapy with CXCR4 antagonists
  (plerixafor, and the oral agent mavorixafor, approved by the FDA in 2024 for
  patients aged 12 years and older) corrects the leukopenia by releasing
  sequestered leukocytes. Hematopoietic stem cell transplantation is curative in
  selected patients.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Disease results from a single heterozygous gain-of-function CXCR4 allele acting
    dominantly over the wild-type receptor. Familial transmission and de novo cases
    both occur; affected relatives can differ in which features of the tetrad they
    show.
  evidence:
  - reference: PMID:29066537
    reference_title: "How I treat warts, hypogammaglobulinemia, infections, and myelokathexis syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The disorder, which is inherited as an autosomal dominant trait, is caused
      by heterozygous mutations of the chemokine receptor CXCR4."
    explanation: Expert clinical review stating the autosomal dominant inheritance and
      the heterozygous CXCR4 cause.
  - reference: PMID:22596258
    reference_title: WHIM syndrome caused by a single amino acid substitution in the carboxy-tail of chemokine receptor CXCR4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a family with autosomal dominant inheritance of WHIM
      syndrome that is caused by a missense mutation in CXCR4, E343K (1027G → A)."
    explanation: A family study documenting autosomal dominant transmission with a CXCR4
      variant.
genetic:
- name: CXCR4
  gene_term:
    preferred_term: CXCR4
    term:
      id: hgnc:2561
      label: CXCR4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    CXCR4 encodes C-X-C chemokine receptor type 4, the G protein-coupled receptor
    for CXCL12 that retains hematopoietic cells in the bone marrow and directs
    lymphocyte development and trafficking. Disease alleles are heterozygous
    gain-of-function variants clustered in the carboxy-terminal cytoplasmic tail,
    which carries the phosphorylation sites for receptor desensitization and
    internalization. They were the first chemokine receptor variants shown to cause
    a human disease.
  evidence:
  - reference: PMID:12692554
    reference_title: "Mutations in the chemokine receptor gene CXCR4 are associated with WHIM syndrome, a combined immunodeficiency disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here the localization of the gene associated with WHIM syndrome
      to a region of roughly 12 cM on chromosome 2q21 and the identification of truncating
      mutations in the cytoplasmic tail domain of the gene encoding chemokine receptor
      4 (CXCR4)."
    explanation: The gene-discovery study mapping the disease to 2q21 and identifying
      truncating CXCR4 tail variants.
  variants:
  - name: Carboxy-terminal truncating CXCR4 variants
    description: >-
      Nonsense and frameshift variants that truncate the CXCR4 carboxy-terminus by
      10 to 19 amino acids, removing negative regulatory phosphorylation sites.
      R334X is the most common allele.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:22596258
      reference_title: WHIM syndrome caused by a single amino acid substitution in the carboxy-tail of chemokine receptor CXCR4.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Gain-of-function mutations that truncate the C-terminus of the chemokine
        receptor CXCR4 by 10-19 amino acids cause WHIM syndrome."
      explanation: States the truncating, gain-of-function character of the typical disease
        alleles.
    - reference: PMID:21890643
      reference_title: The CXCR4 antagonist plerixafor corrects panleukopenia in patients with WHIM syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we enrolled 3 unrelated adult patients with the most common WHIM mutation,
        CXCR4(R334X), in a phase 1 dose-escalation study."
      explanation: Identifies R334X as the most common WHIM allele.
  - name: E343K
    description: >-
      A missense variant in the same carboxy-terminal domain (c.1027G>A) segregating
      with autosomal dominant WHIM syndrome in one family; it increases signaling
      about twofold, like R334X, but has a weaker effect on blocking receptor
      down-regulation. Nomenclature follows the source.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:22596258
      reference_title: WHIM syndrome caused by a single amino acid substitution in the carboxy-tail of chemokine receptor CXCR4.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "CXCR4(E343K) mediated approximately 2-fold increased signaling in calcium
        flux and chemotaxis assays relative to wild-type CXCR4"
      explanation: Functional assays showing the missense variant is gain-of-function.
pathophysiology:
- name: CXCR4 Carboxy-Terminal Gain-of-Function Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A heterozygous germline CXCR4 variant truncates or alters the cytoplasmic
    carboxy-terminal tail of the receptor, the region responsible for its negative
    regulation. The mutant receptor is expressed on leukocytes, hematopoietic
    progenitors and non-hematopoietic cells including keratinocytes.
  genetic_context:
    genes:
    - preferred_term: CXCR4
      term:
        id: hgnc:2561
        label: CXCR4
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous nonsense, frameshift or missense variants in the CXCR4
      carboxy-terminal domain (for example R334X, E343K).
  evidence:
  - reference: PMID:22596258
    reference_title: WHIM syndrome caused by a single amino acid substitution in the carboxy-tail of chemokine receptor CXCR4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation is also located in the C-terminal domain, a region responsible
      for negative regulation of the receptor."
    explanation: Locates the disease variants in the carboxy-terminal domain that negatively
      regulates the receptor.
  - reference: PMID:30565238
    reference_title: "WHIM syndrome: Immunopathogenesis, treatment and cure strategies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "It results from heterozygous gain-of-function mutations in the chemokine
      receptor CXCR4 which is widely expressed on leukocytes and has profound influences
      on immune system homeostasis and organogenesis."
    explanation: Review summarizing the heterozygous gain-of-function lesion and broad
      leukocyte expression of CXCR4.
  downstream:
  - target: Impaired CXCR4 Desensitization and Internalization
    causal_link_type: DIRECT
    description: >-
      Loss or alteration of the tail phosphorylation sites prevents the
      GRK/beta-arrestin-mediated shutoff of the ligand-bound receptor.
    evidence:
    - reference: PMID:36089616
      reference_title: "Genotype-phenotype correlations in WHIM syndrome: a systematic characterization of CXCR4(WHIM) variants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All CXCR4 variants displayed impaired receptor trafficking, hyperactive
        downstream signaling, and enhanced chemotaxis in response to CXCL12."
      explanation: Cell-based analysis of 14 pathogenic variants showing every one impairs
        receptor trafficking.
  - target: CXCR4-Driven HPV Keratinocyte Transformation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same gain-of-function receptor in HPV-infected keratinocytes amplifies the
      autocrine CXCL12 loop that the viral oncoproteins induce.
- name: Impaired CXCR4 Desensitization and Internalization
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    After binding CXCL12 the mutant receptor is not efficiently desensitized or
    internalized, so it stays on the surface in a signaling-competent state.
    Recruitment of GRK6 and beta-arrestin 2 is impaired. The degree of the
    internalization defect across variants correlates with the severity of
    leukopenia and infection susceptibility.
  biological_processes:
  - preferred_term: desensitization of G protein-coupled receptor signaling pathway
    term:
      id: GO:0002029
      label: desensitization of G protein-coupled receptor signaling pathway
    modifier: DECREASED
  - preferred_term: G protein-coupled receptor internalization
    term:
      id: GO:0002031
      label: G protein-coupled receptor internalization
    modifier: DECREASED
  evidence:
  - reference: PMID:15536153
    reference_title: WHIM syndromes with different genetic anomalies are accounted for by impaired CXCR4 desensitization to CXCL12.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This phenomenon relies on the refractoriness of CXCR4 to be both desensitized
      and internalized in response to CXCL12."
    explanation: Patient leukocytes show the enhanced responses depend on failure of CXCR4
      desensitization and internalization.
  - reference: PMID:35947323
    reference_title: Disease Progression of WHIM Syndrome in an International Cohort of 66 Pediatric and Adult Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants affect the same CXCR4 region and impair CXCR4 internalization
      resulting in hyperactive signaling."
    explanation: Across 17 variants in a 66-patient cohort, all impair internalization.
  - reference: PMID:36089616
    reference_title: "Genotype-phenotype correlations in WHIM syndrome: a systematic characterization of CXCR4(WHIM) variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A strong correlation was found between CXCR4 internalization defect and severity
      of blood leukocytopenias and infection susceptibility"
    explanation: Links the magnitude of the internalization defect to clinical severity.
  downstream:
  - target: Enhanced CXCL12-CXCR4 Signaling
    causal_link_type: DIRECT
    description: >-
      A receptor that is not switched off after ligand binding produces enhanced and
      prolonged G protein- and beta-arrestin-dependent signaling.
    evidence:
    - reference: PMID:31313072
      reference_title: "WHIM Syndrome: from Pathogenesis Towards Personalized Medicine and Cure."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "WHIM syndrome is usually caused by autosomal dominant mutations in the
        G protein-coupled chemokine receptor CXCR4 that impair desensitization, resulting
        in enhanced and prolonged G protein- and β-arrestin-dependent responses."
      explanation: Review of all 105 published cases stating the step from impaired desensitization
        to enhanced signaling.
- name: Enhanced CXCL12-CXCR4 Signaling
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Neutrophils and lymphocytes from patients respond to CXCL12 with enhanced
    G protein-dependent signaling, increased calcium flux and increased chemotaxis.
    Because CXCL12 is the principal bone marrow retention signal, the result is an
    exaggeration of the normal homeostatic functions of the receptor.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:

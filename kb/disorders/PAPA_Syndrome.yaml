name: PAPA Syndrome
creation_date: '2026-09-03T00:00:00Z'
description: >-
  PAPA syndrome (pyogenic sterile arthritis, pyoderma gangrenosum, and acne) is a
  rare autosomal dominant monogenic autoinflammatory disease caused by heterozygous
  missense variants in PSTPIP1 (CD2BP1), classically p.A230T and p.E250Q in the
  coiled-coil domain. The variants severely reduce PSTPIP1 binding to the phosphatase
  PTP-PEST, leaving PSTPIP1 hyperphosphorylated with markedly increased avidity for
  pyrin; enhanced pyrin binding drives pyrin-inflammasome (ASC speck) assembly,
  caspase-1 activation, and IL-1beta overproduction, producing sterile neutrophilic
  inflammation that manifests as destructive pyogenic arthritis in childhood and,
  from puberty, pyoderma gangrenosum and severe cystic acne. IL-1 blockade and TNF
  inhibitors are the mainstay biologic therapies.
category: Mendelian
parents:
- Autoinflammatory Disease
- Inherited Disorder
disease_term:
  preferred_term: PAPA syndrome
  term:
    id: MONDO:0011462
    label: pyogenic arthritis-pyoderma gangrenosum-acne syndrome
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    PAPA syndrome is inherited in an autosomal dominant manner from heterozygous
    PSTPIP1 missense variants, with incomplete penetrance and markedly variable
    expressivity documented both between and within families. Each child of an
    affected individual has a 50% risk of inheriting the variant.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:21532836
    reference_title: "Clinical, Molecular, and Genetic Characteristics of PAPA Syndrome: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PAPA syndrome (Pyogenic Arthritis, Pyoderma gangrenosum, and Acne) is an autosomal dominant, hereditary auto-inflammatory disease arising from mutations in the PSTPIP1/CD2BP1 gene on chromosome 15q."
    explanation: The review states PAPA syndrome is autosomal dominant and arises from PSTPIP1/CD2BP1 mutations on chromosome 15q.
  - reference: PMID:22161697
    reference_title: "Brief report: genotype, phenotype, and clinical course in five patients with PAPA syndrome (pyogenic sterile arthritis, pyoderma gangrenosum, and acne)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This analysis of 5 patients demonstrates that mutations in PSTPIP1 are incompletely penetrant and variably expressed in the PAPA syndrome."
    explanation: Documents incomplete penetrance and variable expressivity of PSTPIP1 variants in PAPA syndrome.
prevalence:
- population: Worldwide (case reports and kindreds in the published literature)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    PAPA syndrome is exceptionally rare; the published literature consists of a
    small number of kindreds and sporadic cases rather than population-based rate
    estimates. No pooled numeric prevalence per 100,000 could be sourced, so the
    occurrence is recorded qualitatively as ultra-rare from the kindred/case counts.
  evidence:
  - reference: PMID:22161697
    reference_title: "Brief report: genotype, phenotype, and clinical course in five patients with PAPA syndrome (pyogenic sterile arthritis, pyoderma gangrenosum, and acne)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The only 2 mutations described, A230T and E250Q, have been found in 7 kindreds"
    explanation: Indicates the classic PAPA-causing variants had been reported in only a handful of kindreds, consistent with ultra-rare occurrence.
genetic:
- name: PSTPIP1
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: PSTPIP1
    term:
      id: hgnc:9580
      label: PSTPIP1
  notes: >-
    Heterozygous missense variants in the coiled-coil domain of PSTPIP1 (also known
    as CD2BP1) cause PAPA syndrome. The two classic, functionally validated
    variants are p.A230T and p.E250Q; both severely reduce binding to PTP-PEST,
    leaving PSTPIP1 hyperphosphorylated with markedly increased avidity for pyrin.
    (Distinct PSTPIP1 variants such as p.E250K underlie the more severe PAMI
    phenotype and are outside the scope of this classic-PAPA entry.)
  evidence:
  - reference: PMID:11971877
    reference_title: "Mutations in CD2BP1 disrupt binding to PTP PEST and are responsible for PAPA syndrome, an autoinflammatory disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "E250Q or A230T amino acid substitutions occur within a domain highly homologous to yeast cleavage furrow-associated protein CDC15."
    explanation: Identifies the two co-segregating PAPA-causing PSTPIP1/CD2BP1 missense substitutions in the coiled-coil domain.
  - reference: PMID:11971877
    reference_title: "Mutations in CD2BP1 disrupt binding to PTP PEST and are responsible for PAPA syndrome, an autoinflammatory disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Yeast two-hybrid assays demonstrate severely reduced binding between PTP PEST and both the E250Q and A230T mutant proteins."
    explanation: Establishes the functional consequence of the causal variants - loss of PTP-PEST binding.
pathophysiology:
- name: PSTPIP1 Gain-of-Function Activation
  description: >-
    PAPA-associated missense variants (p.A230T, p.E250Q) in the coiled-coil domain
    of PSTPIP1 severely reduce binding to the regulatory phosphatase PTP-PEST,
    releasing PSTPIP1 from dephosphorylation so that mutant protein accumulates in a
    hyperphosphorylated state.
  biological_scale: MOLECULAR
  gene:
    preferred_term: PSTPIP1
    term:
      id: hgnc:9580
      label: PSTPIP1
  molecular_functions:
  - preferred_term: PTP-PEST (protein phosphatase) binding
    modifier: DECREASED
    term:
      id: GO:0019903
      label: protein phosphatase binding
  downstream:
  - target: Enhanced PSTPIP1-Pyrin Binding
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:14595024
      reference_title: "Pyrin binds the PSTPIP1/CD2BP1 protein, defining familial Mediterranean fever and PAPA syndrome as disorders in the same pathway."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "PAPA-associated A230T and E250Q PSTPIP1/CD2BP1 mutations markedly increased pyrin binding as assayed by immunoprecipitation and, relative to WT, these mutants were hyperphosphorylated when coexpressed with c-Abl kinase."
      explanation: Links reduced PTP-PEST engagement (hyperphosphorylation) directly to increased pyrin binding.
  evidence:
  - reference: PMID:11971877
    reference_title: "Mutations in CD2BP1 disrupt binding to PTP PEST and are responsible for PAPA syndrome, an autoinflammatory disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Yeast two-hybrid assays demonstrate severely reduced binding between PTP PEST and both the E250Q and A230T mutant proteins."
    explanation: The causal variants abolish PTP-PEST binding, the initiating molecular lesion.
- name: Enhanced PSTPIP1-Pyrin Binding
  description: >-
    Hyperphosphorylated mutant PSTPIP1 binds pyrin (the MEFV gene product) with
    markedly increased avidity, mechanistically placing PAPA syndrome in the same
    pyrin pathway as familial Mediterranean fever.
  biological_scale: MOLECULAR
  downstream:
  - target: Pyrin Inflammasome Assembly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19584923
      reference_title: "Pyrin Modulates the Intracellular Distribution of PSTPIP1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "PSTPIP1 molecules with PAPA-associated mutations are recruited by pyrin to ASC specks with particularly high efficiency, suggesting a unique mechanism underlying the robust inflammatory phenotype of PAPA syndrome."
      explanation: Enhanced pyrin binding recruits mutant PSTPIP1 into ASC specks (inflammasome assembly) with high efficiency.
  evidence:
  - reference: PMID:14595024
    reference_title: "Pyrin binds the PSTPIP1/CD2BP1 protein, defining familial Mediterranean fever and PAPA syndrome as disorders in the same pathway."
    supports: SUPPORT

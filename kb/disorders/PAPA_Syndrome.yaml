    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PAPA syndrome typically presents with recurrent sterile, erosive arthritis in childhood, occurring spontaneously or after minor trauma, occasionally resulting in significant joint destruction. By puberty, joint symptoms tend to subside and cutaneous symptoms increase."
    explanation: Describes the childhood-onset recurrent sterile erosive arthritis and its temporal course.
  - reference: PMID:28251506
    reference_title: "Pyogenic arthritis, pyoderma gangrenosum, and acne (PAPA) syndrome: differential diagnosis of septic arthritis by regular detection of exceedingly high synovial cell counts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pyogenic arthritis, pyoderma gangrenosum and acne syndrome was diagnosed in a 42-year-old patient, after an unusual persistency of high synovial cell counts had been noticed."
    explanation: Documents the persistently high sterile synovial cell counts characteristic of the arthritis.

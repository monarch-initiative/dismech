discussions:
- discussion_id: papa_a230t_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Neutrophilic Sterile Inflammation
  prompt: >-
    Why does the PSTPIP1 A230T mouse reproduce systemic cytokine elevation but not
    the joint and skin lesions that define human PAPA syndrome?
  rationale: >-
    The A230T mouse recapitulates the inflammasome/cytokine arm (elevated
    circulating proinflammatory cytokines) yet fails to develop pyogenic arthritis
    or skin inflammation, so the causal step from IL-1-driven systemic inflammation
    to organ-specific neutrophilic tissue lesions is not established in vivo and may
    depend on species- or context-specific factors absent from the model.

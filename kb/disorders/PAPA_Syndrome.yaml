    Recurrent sterile, erosive (pyogenic) arthritis beginning in childhood,
    occurring spontaneously or after minor trauma; synovial fluid shows very high
    sterile neutrophil counts. Joint symptoms tend to subside by puberty.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Sterile pyogenic arthritis
    term:
      id: HP:0040310
      label: Sterile arthritis
    temporality: RECURRENT

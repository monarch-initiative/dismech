animal_models:
- name: PSTPIP1 A230T ectopic-expression mouse
  species: Mouse
  genotype: Ectopic expression of human PAPA-associated PSTPIP1 A230T
  description: >-
    Mice ectopically expressing mutant (A230T) PSTPIP1 show partial embryonic
    lethality, growth retardation, and elevated circulating proinflammatory
    cytokines, but do not develop the pyogenic arthritis or skin inflammation of
    human PAPA syndrome - a dissociation between the systemic cytokine phenotype and
    the organ-specific tissue lesions.
  publication: PMID:23293022
  modeled_mechanisms:
  - target: Excess IL-1beta Production
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Mutant PSTPIP1 expression elevates circulating proinflammatory cytokines,
      recapitulating the systemic cytokine arm of PAPA.
    limitations: >-
      The model reports elevated circulating proinflammatory cytokines broadly
      rather than an IL-1beta-specific measurement, and the analysis concluded
      PSTPIP1 is not an essential regulator of the Nlrp3/Aim2/Nlrc4 inflammasomes
      in this system.
    evidence:
    - reference: PMID:23293022
      reference_title: "Inflammation in mice ectopically expressing human Pyogenic Arthritis, Pyoderma Gangrenosum, and Acne (PAPA) Syndrome-associated PSTPIP1 A230T mutant proteins."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ectopic expression of the mutant but not the wild type PSTPIP1 in mice lead to partial embryonic lethality, growth retardation, and elevated level of circulating proinflammatory cytokines."
      explanation: Mutant PSTPIP1 raised circulating proinflammatory cytokines, partially modeling the systemic cytokine phenotype.
  - target: Sterile pyogenic arthritis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mouse model does not reproduce the defining pyogenic arthritis or skin
      inflammation of human PAPA syndrome.
    limitations: >-
      Despite systemic cytokine elevation, the mice fail to develop the pyogenic
      arthritis and skin inflammation that define human PAPA, indicating the
      organ-specific lesion formation is not captured by this model.
    evidence:
    - reference: PMID:23293022

- name: PSTPIP1 Cytoskeletal Adaptor Dysregulation
  description: >-
    Beyond the inflammasome arm, PSTPIP1 is an F-BAR/SH3 cytoskeletal adaptor that
    links CD2 to WASP-driven actin polymerization at the immunological synapse and
    regulates myeloid-cell migration. Perturbation of this cytoskeletal-regulatory
    function is proposed to contribute to the exaggerated neutrophil influx at sites
    of minor trauma (pathergy); the link to pathergy is inferential rather than
    demonstrated.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: actin filament organization
    term:
      id: GO:0007015
      label: actin filament organization
  downstream:
  - target: Neutrophilic Sterile Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:12530983
    reference_title: "The Wiskott-Aldrich syndrome protein acts downstream of CD2 and the CD2AP and PSTPIP1 adaptors to promote formation of the immunological synapse."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "PSTPIP1 acts downstream of CD2/CD2AP to link CD2 engagement to the WASp-evoked actin polymerization required for synapse formation and T cell activation."
    explanation: Establishes PSTPIP1's cytoskeletal adaptor role; its contribution to pathergy in PAPA is an inference from this normal function.
phenotypes:

  description: >-
    Interleukin-1 blockade with the recombinant IL-1 receptor antagonist anakinra
    targets the IL-1beta-driven mechanism and is most effective for the arthritis
    component; used successfully to control disease in reported patients.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
  target_mechanisms:
  - target: Excess IL-1beta Production
    description: Anakinra antagonizes IL-1 receptor signaling downstream of IL-1beta overproduction.
  evidence:
  - reference: PMID:22161697
    reference_title: "Brief report: genotype, phenotype, and clinical course in five patients with PAPA syndrome (pyogenic sterile arthritis, pyoderma gangrenosum, and acne)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His disease has been well controlled on a regimen of anakinra."
    explanation: A PAPA patient's disease was well controlled on anakinra (IL-1 blockade).

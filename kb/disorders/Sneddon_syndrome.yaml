pathophysiology:
- name: Monogenic Endothelial and Mural Cell Injury
  description: >-
    Sneddon syndrome is a clinically defined, etiologically heterogeneous
    syndrome, and a minority of cases have an identified monogenic cause acting
    on the small-vessel wall. Biallelic loss-of-function ADA2 variants (the
    disorder named deficiency of adenosine deaminase 2, curated separately in
    this knowledge base) produce compromised endothelial integrity with
    endothelial activation and inflammation. A homozygous NOTCH3 nonsense
    variant was reported in one consanguineous family with childhood-onset
    Sneddon syndrome; NOTCH3 acts in the mural cells of small vessels. Both
    converge on the occlusive small- and medium-vessel arteriopathy that defines
    the syndrome. Most patients referred with Sneddon syndrome carry neither
    lesion.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Notch signaling pathway
    term:
      id: GO:0007219
      label: Notch signaling pathway
    modifier: DECREASED
  genes:
  - preferred_term: ADA2
    term:
      id: hgnc:1839
      label: ADA2
  - preferred_term: NOTCH3
    term:
      id: hgnc:7883
      label: NOTCH3
  evidence:
  - reference: PMID:24552284
    reference_title: Early-onset stroke and vasculopathy associated with mutations in ADA2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skin, liver, and brain biopsies revealed vasculopathic changes
      characterized by compromised endothelial integrity, endothelial cellular
      activation, and inflammation.
    explanation: >-
      States the vessel-wall lesion produced by recessive ADA2 loss of function,
      which is the injury this node describes.
  - reference: PMID:32980981
    reference_title: >-
      A NOTCH3 homozygous nonsense mutation in familial Sneddon syndrome with
      pediatric stroke.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that impaired NOTCH3 signaling is one underlying
      disease mechanism and that bi-allelic loss-of-function mutation in NOTCH3
      is a cause of familial Sneddon syndrome with pediatric stroke.
    explanation: >-
      States the NOTCH3 arm of this node, in patients carrying the Sneddon
      syndrome diagnosis itself rather than a related vasculopathy.
  downstream:
  - target: Occlusive vasculopathy
    causal_link_type: DIRECT
    description: >-
      Injury to the endothelium and to the mural cells of small and medium
      arteries produces the subendothelial proliferation and luminal occlusion
      that define the Sneddon arteriopathy.

genetic:
- name: ADA2
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ADA2
    term:
      id: hgnc:1839
      label: ADA2
  notes: >-
    Biallelic loss-of-function ADA2 variants cause deficiency of adenosine
    deaminase 2 (DADA2), which is curated in this knowledge base as its own
    entry (MONDO:0014306) and is the entity ClinGen curates for this gene.
    ADA2 is recorded here because a minority of patients carrying the Sneddon
    syndrome diagnosis prove on testing to have DADA2: in the only series that
    genotyped an adult Sneddon-spectrum cohort, 6 of the 32 genotyped patients
    were biallelic. Plasma ADA2 activity separated the two groups with 100%
    sensitivity and specificity in that series, so in current practice DADA2 is
    the diagnosis that testing establishes rather than a subtype of Sneddon
    syndrome. Note the naming history: ADA2 was formerly CECR1, which is the
    symbol used throughout the 2014-2018 literature quoted below.
  evidence:
  - reference: PMID:30645994
    reference_title: >-
      Adenosine Deaminase Two and Immunoglobulin M Accurately Differentiate
      Adult Sneddon's Syndrome of Unknown Cause.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 73 participants were included in the study: 26 patients with
      PSnS with no CECR1 mutation (PSnS), 6 bi-allelic (DADA2 patients) and 7
      HHZ CECR1 mutations and 34 HC.
    explanation: >-
      Quantifies the ADA2-attributable share of an adult Sneddon-spectrum
      referral cohort, and is the source of the 6-of-32 figure in the note.
  - reference: PMID:30645994
    reference_title: >-
      Adenosine Deaminase Two and Immunoglobulin M Accurately Differentiate
      Adult Sneddon's Syndrome of Unknown Cause.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum IgM levels might be used as a triage tool and plasma ADA2 activity
      performs perfectly as a diagnostic test for DADA2 in adult patients within
      the SnS spectrum.
    explanation: >-
      Supports treating DADA2 as a diagnosis to be separated out of the Sneddon
      spectrum by testing, which is why this gene is recorded with that caveat
      rather than as a plain Sneddon syndrome subtype.
  - reference: PMID:30645994
    reference_title: >-
      Adenosine Deaminase Two and Immunoglobulin M Accurately Differentiate
      Adult Sneddon's Syndrome of Unknown Cause.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the use of the best indexes, plasma ADA2 activity differentiated PSnS
      from DADA2 with a sensitivity and specificity of 100.0%
    explanation: >-
      Sources the diagnostic-accuracy figure quoted in the note above.
  - reference: CGGV:assertion_e05f1338-6a58-4991-af3b-6433bd165a9f-2023-05-30T170000.000Z
    reference_title: ADA2 / deficiency of adenosine deaminase 2 (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ADA2 | HGNC:1839 | deficiency of adenosine deaminase 2 | MONDO:0100317 |
      AR | Definitive | SOP9 | Antibody Deficiencies Gene Curation Expert Panel
    explanation: >-
      Sources the note's statement that the gene-disease relationship ClinGen
      curates Definitive for ADA2 is deficiency of adenosine deaminase 2, not
      Sneddon syndrome.
  - reference: PMID:24552284
    reference_title: Early-onset stroke and vasculopathy associated with mutations in ADA2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loss-of-function mutations in CECR1 were associated with a spectrum of
      vascular and inflammatory phenotypes, ranging from early-onset recurrent
      stroke to systemic vasculopathy or vasculitis.
    explanation: >-
      Establishes recessive ADA2 loss of function as causal for the vasculopathy
      spectrum that includes the livedo-plus-stroke presentation.
- name: NOTCH3
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: NOTCH3
    term:
      id: hgnc:7883
      label: NOTCH3
  notes: >-
    A homozygous NOTCH3 nonsense variant, p.(Arg735Ter), was identified by
    exome sequencing in two affected siblings of one consanguineous family with
    childhood-onset Sneddon syndrome. This is a single-family report and the
    gene-disease relationship has not been curated by ClinGen for Sneddon
    syndrome; dominant NOTCH3 variants cause CADASIL, a different small-vessel
    disease of the brain. In the same study, exome sequencing of six further
    unrelated Sneddon patients found no rare variant in NOTCH3 or in ADA2,
    which is the direct evidence that neither gene accounts for most cases.
  evidence:
  - reference: PMID:32980981
    reference_title: >-
      A NOTCH3 homozygous nonsense mutation in familial Sneddon syndrome with
      pediatric stroke.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed whole-exome sequencing (WES) in 2 affected siblings of a
      consanguineous family with childhood-onset stroke and identified a
      homozygous nonsense mutation within the epidermal growth factor repeat
      (EGFr) 19 of NOTCH3, p.(Arg735Ter).
    explanation: >-
      The primary observation behind this record, including the specific allele
      quoted in the note.
  - reference: PMID:32980981
    reference_title: >-
      A NOTCH3 homozygous nonsense mutation in familial Sneddon syndrome with
      pediatric stroke.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found none of the patients to carry a rare variant (MAF < 0.01) in the
      NOTCH3 or in the ADA2 gene.
    explanation: >-
      The same study's negative result in six further Sneddon patients, which
      bounds how much of the syndrome either gene explains.
  - reference: PMID:32980981
    reference_title: >-
      A NOTCH3 homozygous nonsense mutation in familial Sneddon syndrome with
      pediatric stroke.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      NOTCH3 encodes a transmembrane receptor predominantly expressed in mural
      cells of small blood vessels that plays a critical role in their
      integrity
    explanation: >-
      Sources the mural-cell role this entry attributes to NOTCH3. Taken from
      the citing paper's introduction, where it restates established NOTCH3
      biology rather than reporting a result of its own, hence BACKGROUND.
- name: F5
  relationship_type: RISK_FACTOR
  gene_term:
    preferred_term: F5
    term:
      id: hgnc:3542
      label: F5
  notes: >-
    Heterozygous factor V Leiden was found at higher frequency in
    antiphospholipid-antibody-negative Sneddon syndrome than in
    antibody-positive Sneddon syndrome in a single 53-patient series. This is a
    thrombophilic susceptibility association in a subgroup, not a causal gene,
    and no clinical difference was found between carriers and non-carriers
    within the antibody-negative group. F5 is deliberately not wired to a
    pathophysiology node: this entry models no thrombophilia mechanism, and
    asserting one on the strength of a prevalence comparison would overstate
    what the cited study measured.
  evidence:
  - reference: PMID:12765305
    reference_title: Factor V Leiden mutation in Sneddon syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Factor V Leiden mutation was detected in six patients (11.3%),
      heterozygous in all. The frequency of this mutation was statistically
      higher in group 1 (6/31, 19.3%) than in group 2 (0/22; P = 0.035).
    explanation: >-
      The measured association, with the subgroup restriction that makes this a
      risk-factor record rather than a causal one.
  - reference: PMID:12765305
    reference_title: Factor V Leiden mutation in Sneddon syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Within aPL-negative SNS, the comparison of patients with versus without
      factor V Leiden mutation showed no difference for clinical data or
      familial history of thrombosis.
    explanation: >-
      The same study's negative result on clinical correlates, recorded so the
      association is not read as a phenotype-defining one.

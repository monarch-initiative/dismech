    modifier: INCREASED
  evidence:
  - reference: PMID:23827346
    reference_title: A human skeletal overgrowth mutation increases maximal velocity and blocks desensitization of guanylyl cyclase-B.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We conclude that the V883M mutation increases maximal velocity in the
      absence of CNP, eliminates the requirement for ATP in the CNP-dependent
      Km reduction, and disrupts the normal inactivation process.
    explanation: Enzyme kinetics show the receptor escapes ligand, ATP and desensitization control.
  - reference: PMID:28450398
    reference_title: Skeletal overgrowth-causing mutations mimic an allosterically activated conformation of guanylyl cyclase-B that is inhibited by 2,4,6,-trinitrophenyl ATP.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the A488P and R655C missense mutations result in a GC-B conformation that
      mimics the allosterically activated conformation
    explanation: A shared allosterically activated conformation across distinct activating alleles.
  - reference: PMID:28450398
    reference_title: Skeletal overgrowth-causing mutations mimic an allosterically activated conformation of guanylyl cyclase-B that is inhibited by 2,4,6,-trinitrophenyl ATP.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, 1 mm 2,4,6,-trinitrophenyl ATP inhibited all three mutants by as
      much as 80% but failed to inhibit WT-GC-B.
    explanation: Mutant-selective pharmacological inhibition in vitro, without patient data.
  - reference: PMID:22870295
    reference_title: An overgrowth disorder associated with excessive production of cGMP due to a gain-of-function mutation of the natriuretic peptide receptor 2 gene.

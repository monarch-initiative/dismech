pathophysiology:
- name: Heterozygous Activating NPR2 Variant
  description: >-
    A germline heterozygous NPR2 allele with an intracellular missense change
    or small in-frame deletion activates the NPR-B receptor. This is the
    initiating lesion of the disorder.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

- name: Tall stature
  category: Growth
  diagnostic: true
  description: >-
    Increased length can be present at birth, and height is above +2 SD
    through childhood and adulthood in most affected people. Some affected
    relatives are only borderline tall, consistent with polygenic background
    effects on height.
  phenotype_term:
    preferred_term: Tall stature
    term:

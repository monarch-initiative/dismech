      We identified a four-generation family with an overgrowth syndrome
      characterized by tall stature, macrodactyly of the great toes, scoliosis,
      coxa valga and slipped capital femoral epiphysis
    explanation: The defining toe phenotype in the Korean family.
  - reference: PMID:32282051
    reference_title: An Activating Deletion Variant in the Submembrane Region of Natriuretic Peptide Receptor-B Causes Tall Stature.

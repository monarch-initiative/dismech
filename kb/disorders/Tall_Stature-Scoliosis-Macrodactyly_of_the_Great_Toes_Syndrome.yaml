    reference_title: An Activating Deletion Variant in the Submembrane Region of Natriuretic Peptide Receptor-B Causes Tall Stature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mother's height was +2.77 standard deviation scores (SDS). The heights of
      her 2 daughters were +1.96 SDS at 7 years and +1.30 SDS at 4 years of
      age.
    explanation: Tall stature in the mother, with daughters still near the upper normal range.
- name: Macrodactyly of the great toes
  category: Skeletal
  diagnostic: true

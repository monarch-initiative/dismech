name: Tall Stature-Scoliosis-Macrodactyly of the Great Toes Syndrome
creation_date: "2026-10-09T12:00:00Z"
category: Mendelian
description: >-
  Tall stature-scoliosis-macrodactyly of the great toes syndrome (epiphyseal
  chondrodysplasia, Miura type; ECDM) is a rare autosomal dominant skeletal
  overgrowth disorder caused by heterozygous activating variants in NPR2, which
  encodes the C-type natriuretic peptide (CNP) receptor NPR-B (guanylyl
  cyclase-B). Activating alleles raise ligand-independent and CNP-stimulated
  cGMP production, and in a chondrocyte-targeted transgenic mouse the excess
  cartilage cGMP widens the growth plate and lengthens the long bones,
  vertebrae and digits. Affected people have tall stature, long and broad
  great toes, arachnodactyly, scoliosis, coxa valga, valgus deformity of the
  lower limbs, slipped capital femoral epiphysis and pseudoepiphyses of the
  phalanges, with marked intrafamilial variability. It is the mirror image of
  NPR2 loss of function, which causes short stature and acromesomelic
  dysplasia, Maroteaux type.
disease_term:
  preferred_term: Tall Stature-Scoliosis-Macrodactyly of the Great Toes Syndrome
  term:
    id: MONDO:0014401
    label: tall stature-scoliosis-macrodactyly of the great toes syndrome
synonyms:
- epiphyseal chondrodysplasia, Miura type
- Miura type epiphyseal chondrodysplasia
- ECDM
- tall stature-scoliosis-macrodactyly of the halluces syndrome
parents:
- Skeletal Dysplasia
notes: >-
  No disease-specific GeneReviews chapter exists for this disorder. MONDO:0014401
  carries the OMIM 615923 cross-reference, whose OMIM title is "epiphyseal
  chondrodysplasia, Miura type", and lists that name as a related synonym, so
  the Miura-type name and the tall stature-scoliosis-macrodactyly name refer to
  one NPR2-related entity and are lumped here. Orphanet ORPHA:329191 also
  links the recessive NPR3-related tall stature disorder (Boudin-Mortier
  syndrome, OMIM 619543), which is a separate disease with its own MONDO term
  and is recorded here only as a differential diagnosis. The NPR2 p.Arg655Cys
  allele was reported in a man with extreme tall stature without skeletal
  deformities; it is listed as an activating NPR2 allele but that proband does
  not show the toe and spinal features that define this syndrome.
prevalence:
- population: Published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A family-level count from a 2021 report, before which four families had
    been published. It is not a population rate.
  evidence:
  - reference: PMID:33073519
    reference_title: A new family with epiphyseal chondrodysplasia type Miura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epiphyseal chondrodysplasia, Miura type (ECDM) is a skeletal dysplasia
      with tall stature and distinctive skeletal features caused by
      heterozygous NPR2 pathogenic variants. Only four families have been
      reported.
    explanation: States that only four families had been reported when this fifth family was published.
progression:
- phase: Birth
  age_range: Neonatal period
  notes: >-
    Enlarged great toes and increased birth length can already be present at
    birth.
  evidence:
  - reference: PMID:22870295
    reference_title: An overgrowth disorder associated with excessive production of cGMP due to a gain-of-function mutation of the natriuretic peptide receptor 2 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Long and wide great toes were already present at birth.
    explanation: The original proband had enlarged great toes at birth.
- phase: Childhood growth
  age_range: Early childhood through adolescence
  notes: >-
    Great-toe enlargement progresses during childhood, and valgus deformities
    of the hips, knees and ankles can progress and lead to surgery.
  evidence:
  - reference: PMID:32282051
    reference_title: An Activating Deletion Variant in the Submembrane Region of Natriuretic Peptide Receptor-B Causes Tall Stature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They were referred for clinical genetic evaluation at the age of 6 and 4
      years, respectively, because of progressive macrodactyly of the great
      toes.
    explanation: Great-toe enlargement progressed during early childhood in both daughters.
  - reference: PMID:33073519
    reference_title: A new family with epiphyseal chondrodysplasia type Miura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive valgus deformities (at the hips, knees, and ankles) were the
      main complaints and necessitated orthopedic investigations and surgery.
    explanation: Progressive lower-limb valgus deformity was the main clinical problem during growth in this family.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    A single heterozygous activating NPR2 allele causes the disorder and
    segregates through two to four generations in the reported families.
    Severity differs within families: a mildly affected mother had severely
    affected children carrying the same allele.
  evidence:
  - reference: PMID:24259409
    reference_title: Overgrowth syndrome associated with a gain-of-function mutation of the natriuretic peptide receptor 2 (NPR2) gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel missense mutation of NPR2, c.1462G>C (p.Ala488Pro) was found to
      co-segregate with the phenotype in this family.
    explanation: Co-segregation of a heterozygous NPR2 allele through a four-generation family.
  - reference: PMID:22870295
    reference_title: An overgrowth disorder associated with excessive production of cGMP due to a gain-of-function mutation of the natriuretic peptide receptor 2 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a three-generation family with tall stature, scoliosis and
      macrodactyly of the great toes and a heterozygous p.Val883Met mutation in
      Npr2
    explanation: Vertical transmission of a heterozygous allele over three generations.
  - reference: PMID:33073519
    reference_title: A new family with epiphyseal chondrodysplasia type Miura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mother's phenotype was relatively mild: borderline tall stature and
      elongated halluces operated during childhood. The children were
      remarkably more severely affected
    explanation: Variable expressivity of the same p.Val883Met allele between mother and children.
genetic:
- name: NPR2
  gene_term:
    preferred_term: NPR2
    term:
      id: hgnc:7944
      label: NPR2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Heterozygous activating alleles cluster in the intracellular regions of
    NPR-B: the submembrane segment (p.Ala488Pro, p.Met482_Leu483del), the
    kinase homology domain (p.Arg655Cys) and the guanylyl cyclase domain
    (p.Val883Met). Loss-of-function NPR2 alleles cause the opposite, short
    stature phenotypes, so the direction of the variant's effect on receptor
    activity has to be established before an NPR2 variant is assigned to this
    disorder.
  variants:
  - name: p.Val883Met
    description: >-
      NM_003995 c.2647G>A, a missense variant in the conserved C-terminal
      guanylyl cyclase domain. It segregated in a three-generation Japanese
      family and was found again in a two-generation family with five affected
      members. In transfected cells it produces cGMP without CNP and blocks
      the normal desensitization of the receptor.
    gene:
      preferred_term: NPR2
      term:
        id: hgnc:7944
        label: NPR2
    variant_type: single nucleotide variant
    functional_effects:
    - function: guanylate cyclase activity
      description: Ligand-independent cGMP production and loss of time-dependent receptor inactivation.
      type: gain-of-function
    evidence:
    - reference: PMID:22870295
      reference_title: An overgrowth disorder associated with excessive production of cGMP due to a gain-of-function mutation of the natriuretic peptide receptor 2 gene.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        When expressed in HEK293A cells, the mutant Npr2 cDNA generated
        intracellular cGMP (cyclic guanosine monophosphate) in the absence of
        CNP ligand.
      explanation: Transfected-cell assay showing constitutive activity of the variant.
    - reference: PMID:33073519
      reference_title: A new family with epiphyseal chondrodysplasia type Miura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        all affected individuals had a heterozygous c.2647G>A (p.Val883Met)
        NPR2 variant in a highly conserved region in the carboxyl-terminal
        guanylyl cyclase domain
      explanation: Recurrence of the same allele in an independent family.
  - name: p.Ala488Pro
    description: >-
      c.1462G>C, a missense variant in the intracellular submembrane region,
      co-segregating in a four-generation Korean family. The mutant receptor is
      overactive at baseline and with CNP; biochemically it lowers the EC50 for
      CNP and the Km for GTP, and requires receptor phosphorylation for its
      CNP-dependent activation.
    gene:
      preferred_term: NPR2
      term:
        id: hgnc:7944
        label: NPR2
    variant_type: single nucleotide variant
    functional_effects:
    - function: guanylate cyclase activity
      description: Increased basal and CNP-stimulated receptor activity.
      type: gain-of-function
    evidence:
    - reference: PMID:24259409
      reference_title: Overgrowth syndrome associated with a gain-of-function mutation of the natriuretic peptide receptor 2 (NPR2) gene.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro transfection assay of the mutant NPR2 revealed overactivity of
        the mutant receptor at baseline as well as with the ligand.
      explanation: Functional evidence that the segregating allele is activating.
    - reference: PMID:28450398
      reference_title: Skeletal overgrowth-causing mutations mimic an allosterically activated conformation of guanylyl cyclase-B that is inhibited by 2,4,6,-trinitrophenyl ATP.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The A488P mutation decreased the EC50 5-fold, increased Vmax 2.6-fold,
        and decreased the Km 13-fold
      explanation: Enzyme kinetics of the mutant receptor in a heterologous expression system.
  - name: p.Met482_Leu483del
    description: >-
      c.1444_1449delATGCTG, a six-base in-frame deletion removing two residues
      of the intracellular submembrane region, found in a Dutch mother and her
      two daughters. Patient fibroblasts and transfected HEK-293 cells show
      raised basal and CNP-stimulated cGMP production.
    gene:
      preferred_term: NPR2
      term:
        id: hgnc:7944
        label: NPR2
    variant_type: deletion
    functional_effects:
    - function: guanylate cyclase activity
      description: Increased ligand-independent and CNP-stimulated cGMP synthesis.
      type: gain-of-function
    evidence:
    - reference: PMID:32282051
      reference_title: An Activating Deletion Variant in the Submembrane Region of Natriuretic Peptide Receptor-B Causes Tall Stature.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In proband's skin fibroblasts, basal cGMP levels and CNP-stimulated
        cGMP production were markedly increased compared with controls.
      explanation: Patient-derived cells show the deletion is activating.
  - name: p.Arg655Cys
    description: >-
      A missense variant in the kinase homology domain reported in a man with
      extreme tall stature but without the skeletal deformities of this
      syndrome. It increases CNP responsiveness and ATP-dependent allosteric
      activation and forms stable heterodimers with wild-type NPR-B. It is an
      activating NPR2 allele at the boundary of the clinical entity rather than
      a typical cause of it.
    gene:
      preferred_term: NPR2
      term:
        id: hgnc:7944
        label: NPR2
    variant_type: single nucleotide variant
    functional_effects:
    - function: guanylate cyclase activity
      description: Increased CNP-stimulated cGMP production in patient fibroblasts and transfected cells.
      type: gain-of-function
    evidence:
    - reference: PMID:24057292
      reference_title: An activating mutation in the kinase homology domain of the natriuretic peptide receptor-2 causes extremely tall stature without skeletal deformities.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        CNP-stimulated cGMP production by the mutant NPR2 was markedly
        increased in patient skin fibroblasts and transfected human embryonic
        kidney 293 cells.
      explanation: Functional evidence that p.Arg655Cys is activating.
    - reference: PMID:24057292
      reference_title: An activating mutation in the kinase homology domain of the natriuretic peptide receptor-2 causes extremely tall stature without skeletal deformities.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here we describe an extremely tall male without skeletal deformities,
        with a novel NPR2 mutation (p.Arg655Cys) located in the kinase
        homology domain.
      explanation: Records the narrower clinical presentation of the p.Arg655Cys carrier.

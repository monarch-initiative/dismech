differential_diagnoses:
- name: Marfan syndrome
  disease_term:
    preferred_term: Marfan syndrome
    term:
      id: MONDO:0007947
      label: Marfan syndrome
  description: >-
    Tall stature, arachnodactyly and scoliosis lead to suspicion of Marfan
    syndrome.
  distinguishing_features:
  - Macrodactyly of the great toes and phalangeal pseudoepiphyses point to an activating NPR2 variant.
  - An activating NPR2 allele with raised cGMP signalling confirms the diagnosis.
  evidence:
  - reference: PMID:24259409
    reference_title: Overgrowth syndrome associated with a gain-of-function mutation of the natriuretic peptide receptor 2 (NPR2) gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This overgrowth syndrome caused by a gain-of-function mutation at NPR2
      should be differentiated from Marfan or related syndromes
    explanation: The authors name Marfan and related syndromes as the main differential.
- name: Boudin-Mortier syndrome
  disease_term:
    preferred_term: NPR3-related tall stature
    term:
      id: MONDO:0859194
      label: Boudin-Mortier syndrome
  description: >-
    Recessive NPR3 loss of function produces a closely similar phenotype of
    tall stature, long great toes and extra epiphyses.
  distinguishing_features:
  - Autosomal recessive inheritance with biallelic NPR3 variants rather than a dominant NPR2 allele.
  evidence:
  - reference: PMID:40171685
    reference_title: Tall Stature and Scoliosis Associated With a Novel Homozygous Loss-of-Function Missense Variant in NPR3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NPR3-related tall stature is characterized by tall stature, elongated big
      toes, and additional epiphyses in hand and foot bones. The condition is
      caused by biallelic loss-of-function variants affecting natriuretic
      peptide receptor 3 (NPR3).
    explanation: The overlapping phenotype and distinct recessive NPR3 genetic basis.
- name: CNP overproduction from chromosomal rearrangement
  description: >-
    Translocations increasing CNP production cause a similar overgrowth
    phenotype through excess ligand rather than an activated receptor.
  distinguishing_features:
  - Activating NPR2 alleles occur with normal or low NT-proCNP, which argues against CNP overproduction.
  evidence:
  - reference: PMID:24259409
    reference_title: Overgrowth syndrome associated with a gain-of-function mutation of the natriuretic peptide receptor 2 (NPR2) gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      overproduction of CNP by chromosomal translocation and a gain-of-function
      mutation at NPR2 have been reported to be responsible for an overgrowth
      syndrome in three cases and one family, respectively.
    explanation: Places CNP overproduction alongside NPR2 activation as causes of a similar overgrowth syndrome.

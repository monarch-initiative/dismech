    reference_title: An overgrowth disorder associated with excessive production of cGMP due to a gain-of-function mutation of the natriuretic peptide receptor 2 gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results indicate that p.Val883Met is a constitutive active
      gain-of-function mutation
    explanation: The original study classifies the causal allele as gain of function.
  downstream:
  - target: Constitutive and CNP-Hypersensitive NPR-B Guanylyl Cyclase Activity
    causal_link_type: DIRECT
    description: >-
      The variant receptor is catalytically overactive without ligand and
      responds more strongly to low CNP concentrations.
    evidence:
    - reference: PMID:32282051
      reference_title: An Activating Deletion Variant in the Submembrane Region of Natriuretic Peptide Receptor-B Causes Tall Stature.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Consistently, assays with transfected HEK-293 cells showed markedly
        augmented baseline and ligand-dependent activity of mutant NPR-B.
      explanation: The deletion variant directly increases basal and ligand-dependent receptor activity.
- name: Constitutive and CNP-Hypersensitive NPR-B Guanylyl Cyclase Activity
  description: >-
    Activating NPR2 alleles hold the receptor in a conformation that mimics the
    allosterically (ATP-) activated state. Depending on the allele, basal
    maximal velocity rises, the Km for GTP and EC50 for CNP fall, the
    requirement for ATP or receptor phosphorylation changes, and normal
    desensitization is lost. The guanylyl cyclase is therefore driven outside
    its normal ligand and phosphorylation control, which is why the activity
    is annotated as gain of function rather than a quantitative increase. The
    ATP analogue TNP-ATP inhibits the mutant but not the wild-type receptor in
    vitro, an experimental lead with no clinical data.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: NPR2
    term:

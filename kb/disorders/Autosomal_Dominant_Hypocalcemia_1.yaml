genetic:
- name: CASR
  gene_term:
    preferred_term: CASR
    term:
      id: hgnc:1514
      label: CASR
  relationship_type: CAUSATIVE
  notes: >-
    The variants are typically heterozygous missense and clustered in the large
    extracellular domain, though transmembrane-domain variants also occur. Two
    things about the genotype-phenotype relationship are worth recording.
    Severity varies widely between carriers, so the variant does not by itself
    predict the clinical picture. And in the one study that tested it directly,
    the in vitro degree of receptor activation did not predict the clinical
    response to a calcilytic - so "activating" functions here as a qualitative
    classification, not a quantitative one that can be read off into a
    prediction.

    CASR is also one of the clearer allelic series in medicine, and reading ADH1
    against it is what makes "gain of function" mean something concrete here:
    heterozygous loss of function gives familial hypocalciuric hypercalcaemia,
    homozygous loss of function gives neonatal severe hyperparathyroidism, and
    heterozygous gain of function gives this disease. The same receptor, dosed in
    four directions.
  evidence:
  - reference: PMID:20374733
    reference_title: Calcium-sensing receptor and associated diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Heterozygous loss-of-function mutations cause familial (benign) hypocalciuric
      hypercalcemia (FHH) in which the lifelong mild hypercalcemia is generally asymptomatic.
      Homozygous inactivating mutations give rise to neonatal severe hyperparathyroidism
      (NSHPT) with extreme hypercalcemia and marked skeletal changes. Heterozygous activating
      mutations of the CASR cause autosomal dominant hypocalcemia (ADH) that may be asymptomatic
      or present with seizures in the neonatal period or childhood or later in life.
    explanation: The full allelic series in one passage, which is what places ADH1 at the
      gain-of-function end of a graded dosage relationship rather than treating it as an
      isolated phenotype.
  - reference: PMID:8813042
    reference_title: A familial syndrome of hypocalcemia with hypercalciuria due to mutations
      in the calcium-sensing receptor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Five heterozygous missense mutations (Asn118Lys, Phe128Leu, Thr151Met, Glu191Lys,
      and Phe612Ser) were detected in the extracellular domain of the calcium-sensing-receptor
      gene and shown to cosegregate with the disease.
    explanation: Establishes the allelic spectrum and its cosegregation across six kindreds.
  - reference: PMID:31063613
    reference_title: Treatment of Autosomal Dominant Hypocalcemia Type 1 With the Calcilytic
      NPSP795 (SHP635).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: There was significant variability in response clinically across genotypes.
    explanation: PARTIAL because it supports only the second half of the note - variability
      across genotypes - and speaks to drug response rather than to disease severity.

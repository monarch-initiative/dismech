name: Autosomal Dominant Hypocalcemia 1
creation_date: "2026-08-28T16:30:00Z"
category: Mendelian
description: >-
  Autosomal dominant hypocalcemia type 1 is caused by activating CASR variants that alter calcium-sensing
  receptor signaling. Inappropriately low or normal PTH despite hypocalcemia reflects a shifted parathyroid
  response; PTH can be nearly undetectable. Variant-dependent signaling, receptor abundance and tissue
  context influence the phenotype. Renal calcium loss may be excessive relative to the low circulating
  calcium even when absolute urine calcium is within its reference range. Overt hypercalciuria is variable
  and can emerge or worsen when calcium and active vitamin D raise serum calcium. Clinical manifestations
  range from asymptomatic biochemical findings to seizures, renal calcifications and impaired kidney function.
  A minority of variants cause an additional Bartter-like salt-wasting phenotype. PTH replacement bypasses
  deficient hormone secretion, whereas investigational calcilytics inhibit the abnormal receptor signal.

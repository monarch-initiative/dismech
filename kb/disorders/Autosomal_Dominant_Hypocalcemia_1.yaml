animal_models:
- name: Nuf mouse (Casr Leu723Gln)
  species: Mouse
  genotype: Casr Leu723Gln (Nuf), heterozygous and homozygous
  publication: PMID:33103030
  description: >-
    A spontaneous activating Casr allele giving hypocalcaemia, used as the ADH1
    model in which the calcilytic was tested alongside the human study.
  modeled_mechanisms:
  - target: Left-Shifted Calcium Set Point
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A germline activating Casr variant producing the same set-point lesion, in
      which pharmacological reversal of the shift can be tested directly.
    limitations: >-
      A single missense allele rather than the human allelic spectrum, so it
      cannot address the variability in clinical response between genotypes that
      the human study found. The mouse also corrected its plasma calcium on the
      calcilytic where the human study's calcium endpoints did not move, so the
      model is more responsive on that endpoint than the patients were.
    readouts:
    - name: Plasma PTH response to calcilytic
      target: Left-Shifted Calcium Set Point
      direction: RESTORED
      interpretation: >-
        A dose-dependent PTH rise on blocking the receptor shows that the
        suppressed secretion is actively driven by the mutant receptor rather
        than reflecting parathyroid failure.
      evidence:
      - reference: PMID:33103030
        reference_title: Calcilytic NPSP795 Increases Plasma Calcium and PTH in an Autosomal
          Dominant Hypocalcemia Type 1 Mouse Model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: NPSP795 significantly increased plasma PTH concentrations in a dose-dependent
          manner with the 30 mg/kg dose causing a maximal (≥10-fold) rise in PTH.
        explanation: The dose-response measurement behind this readout.
    - name: Plasma adjusted-calcium response to calcilytic
      target: Left-Shifted Calcium Set Point
      direction: RESTORED
      interpretation: >-
        The calcium endpoint that moved in the mouse but not in the human study,
        which is the crux of the translational question for this compound.
      evidence:
      - reference: PMID:33103030
        reference_title: Calcilytic NPSP795 Increases Plasma Calcium and PTH in an Autosomal
          Dominant Hypocalcemia Type 1 Mouse Model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: NPSP795 significantly increased plasma adjusted-calcium in Casr +/Nuf
          mice from 1.87 ± 0.03 mmol/L to 2.16 ± 0.06 mmol/L
        explanation: The measured calcium correction in the heterozygous mouse.
  - target: Ectopic Calcification
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The allele was originally found in a screen for eye mutants, and the mouse
      carries lens opacities and ectopic calcification alongside the mineral
      abnormalities - so it reproduces the entry's deposition node as well as its
      set-point node.
    limitations: >-
      The mouse's ectopic calcification and cataracts were characterised as part of
      the strain description rather than in a study designed to ask where and why
      deposition occurs, so the model corroborates that the phenotype follows from
      receptor activation without illuminating the mechanism this entry grades
      PROVISIONAL.
    evidence:
    - reference: PMID:15347804
      reference_title: Activating calcium-sensing receptor mutation in the mouse is associated
        with cataracts and ectopic calcification.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Nuf mice also display ectopic calcification, hypocalcemia, hyperphosphatemia,
        and inappropriately reduced levels of plasma parathyroid hormone.
      explanation: The phenotype list establishing that this model carries the deposition
        phenotype and the full mineral signature.
  evidence:
  - reference: PMID:33103030
    reference_title: Calcilytic NPSP795 Increases Plasma Calcium and PTH in an Autosomal
      Dominant Hypocalcemia Type 1 Mouse Model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Nuf mice, which have hypocalcemia in association with a gain-of-function CaSR
      mutation, Leu723Gln
    explanation: Establishes the model's genotype and that it reproduces the hypocalcaemic
      phenotype.
discussions:
- discussion_id: adh1_calcium_target_is_a_tradeoff
  kind: INTERPRETATION
  attaches_to:
  - pathophysiology#Renal Calcium Wasting
  - treatments#Calcitriol and Calcium Supplementation
  prompt: Why is the treatment target in ADH1 a low-normal serum calcium rather than a
    normal one?
  rationale: >-
    In most hypoparathyroidism, hypercalciuria has one cause - no PTH to drive
    distal reabsorption - and PTH replacement addresses it. In ADH1 there are two
    causes, and only one of them responds to anything conventional therapy does.
    The renal receptor is over-sensitive whatever the PTH is doing, so every
    increment of serum calcium is filtered into a tubule that will not reabsorb
    it normally.

    That makes the usual therapeutic logic run backwards. Correcting serum
    calcium to the middle of the reference range does not restore normal
    physiology; it maximises the filtered load at the site of the second lesion,
    and the documented consequences are nephrocalcinosis, stones and declining
    renal function. So the accepted target is deliberately sub-normal - enough
    calcium to prevent tetany and seizures, not enough to normalise the number.

    This is why the mechanism is modelled here as two limbs converging on renal
    calcium wasting rather than as a single hypoparathyroid state. An entry that
    recorded only "hypoparathyroidism causes hypercalciuria" would make the
    conventional treatment look adequate.
  evidence:
  - reference: PMID:8813042
    reference_title: A familial syndrome of hypocalcemia with hypercalciuria due to mutations
      in the calcium-sensing receptor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: treatment with vitamin D resulted in increased hypercalciuria, nephrocalcinosis,
      and renal impairment
    explanation: The observed harm from raising calcium by the conventional route.
  - reference: PMID:33112267
    reference_title: Recombinant human parathyroid hormone (1-84) is effective in CASR-associated
      hypoparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The traditional approach to treatment includes activated vitamin D but this
      further increases urinary calcium excretion.
    explanation: States the trade-off directly as the motivation for seeking an alternative.
- discussion_id: adh1_in_vitro_activation_does_not_predict_response
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#CASR
  - treatments#Calcilytic (Negative Allosteric Modulator of the CaSR)
  prompt: Why does the degree of in vitro receptor activation not predict a patient's
    response to a calcilytic?
  rationale: >-
    The mechanistic argument for calcilytics in ADH1 is clean: the receptor is
    too easily activated, so shift it back. The clinical study tested that
    argument in five patients with four different CASR variants and measured, in
    parallel, what the drug did to each variant receptor in cells. Every variant
    behaved as activating in vitro and every one was shifted by the drug in vitro
    - and yet the in vitro numbers did not correlate with any clinical parameter,
    and the clinical responses varied substantially between patients.

    That is a gap rather than a negative result. It means the assay that
    classifies a variant as activating - a calcium dose-response curve in a
    heterologous cell line - is not measuring the quantity that determines what
    happens in a patient. Candidate explanations include signalling that is
    biased between pathways in ways the readout does not capture,
    tissue-specific differences between parathyroid and tubule, and expression or
    trafficking effects that a stable overexpression system removes.

    Of those, biased signalling has since acquired direct evidence rather than
    remaining a suggestion. A de novo p.Leu723Arg variant was shown to lower the
    EC50 for calcium activation of G11 while leaving Gi, Gq and Gs unchanged - so
    a variant can be activating along one coupling route and not others. A
    dose-response assay that reads a single downstream output cannot distinguish
    that from uniform activation, and the patient carrying it presented with
    short stature and inconsistent hypercalciuria rather than the usual ADH1
    picture. That does not close the gap, since the calcilytic study's variants
    were not profiled this way, but it shows the mechanism is real and that the
    standard assay would miss it.

    Recording this matters for how the genotype is used. A variant curated as
    "gain of function, confirmed functionally" carries less predictive
    information than that phrase suggests, and this entry deliberately does not
    let the functional classification stand in for a prognosis.
  evidence:
  - reference: PMID:31063613
    reference_title: Treatment of Autosomal Dominant Hypocalcemia Type 1 With the Calcilytic
      NPSP795 (SHP635).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In vitro, all mutant CaRs were half-maximally activated (EC50 ) at lower
      concentrations of extracellular calcium (Ca2+o ) compared to wild-type (WT) CaR;
      NPSP795 exposure increased the EC50 for all CaR activity readouts. However, the in
      vitro responses to NPSP795 did not correlate with any clinical parameters.'
    explanation: The paired result - uniform in vitro behaviour, uncorrelated clinical
      behaviour - which is the gap itself.
  - reference: PMID:31063613
    reference_title: Treatment of Autosomal Dominant Hypocalcemia Type 1 With the Calcilytic
      NPSP795 (SHP635).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Albeit all mutations appear to be activating at the CaR, in vitro observations
      were not predictive of the in vivo phenotype or the response to calcilytics, suggesting
      that other parameters impact the response to the drug.
    explanation: The authors' own statement of the disconnect, quoted separately from the
      result that produced it.
  - reference: PMID:39658204
    reference_title: An activating calcium-sensing receptor variant with biased signaling
      reveals a critical residue for Gα11 coupling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Transient expression studies showed the Leu723Arg variant was normally expressed
      but resulted in a significantly lower EC50 for extracellular calcium activation of
      G11 but not other G proteins (ie, Gi, Gq, Gs).
    explanation: Direct evidence that a variant can be activating for one G-protein route
      and not others, which is one of the candidate explanations for the assay-to-clinic
      disconnect.
- discussion_id: adh1_vs_adh2_and_hypoparathyroidism
  kind: INTERPRETATION
  attaches_to:
  - diagnosis#CASR Sequencing
  prompt: What does ADH1 need to be distinguished from, and why does the distinction
    change management?
  rationale: >-
    Two differentials matter. The first is hypoparathyroidism from parathyroid
    destruction, surgery or agenesis. It looks similar - low calcium, low PTH,
    high phosphate - but has no renal limb, so calcium and vitamin D are
    appropriate treatment there and a compromise here. Distinguishing them is
    what the paired calcium/PTH plus a urinary calcium measurement is for, and it
    is why the original kindreds were relabelled from "autosomal dominant
    hypoparathyroidism".

    The second is ADH2, caused by activating variants of GNA11, the G-protein
    that transduces the receptor's signal. Because the lesion is one step
    downstream, the biochemistry is close to identical and sequencing is what
    separates them. The distinction is not academic for the calcilytic question:
    a drug that acts allosterically on the receptor has its target intact in
    ADH1, whereas in ADH2 the receptor is normal and the excess signalling begins
    beyond it - which is why the calcilytic effect in ADH2 was demonstrated in a
    mouse model rather than assumed to transfer.

    A third differential is acquired rather than inherited: activating
    autoantibodies against the receptor reproduce the ADH biochemistry with no
    CASR variant present. It is the differential a negative sequencing result
    should raise rather than close, and the mirror image of the inactivating
    autoantibodies that phenocopy familial hypocalciuric hypercalcaemia.
  evidence:
  - reference: PMID:28194447
    reference_title: Gα(11) mutation in mice causes hypocalcemia rectifiable by calcilytic
      therapy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Heterozygous germline gain-of-function mutations of G-protein subunit α11
      (Gα11), a signaling partner for the calcium-sensing receptor (CaSR), result in autosomal
      dominant hypocalcemia type 2 (ADH2).
    explanation: Defines ADH2 and its relationship to the receptor, which is the basis of
      the differential.
  - reference: PMID:20374733
    reference_title: Calcium-sensing receptor and associated diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Phenocopies of FHH or ADH are due to circulating CASR inactivating or activating
      autoantibodies, respectively.
    explanation: A third differential the genetic test settles - an acquired autoimmune
      phenocopy that reproduces the biochemistry with no CASR variant at all.

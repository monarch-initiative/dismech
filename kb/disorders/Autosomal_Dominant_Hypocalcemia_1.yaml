    description: Increased parathyroid CaSR signaling suppresses PTH release at lower calcium concentrations.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Impaired Renal Tubular Calcium Reabsorption
    description: Renal CaSR activation can reduce reabsorption, depending on allele, receptor expression and prevailing calcium. Low serum calcium may limit this branch at baseline.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Impaired Vasopressin-Dependent Water Reabsorption
    description: A candidate renal water-handling branch is supported by CaSR knock-in mice; its independent contribution in human ADH1 remains unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Reduced Renal MicroRNA Repression of CLDN14
    description: Selected activating variants reduce transcription of CLDN14-targeting microRNAs in a heterologous cell model.

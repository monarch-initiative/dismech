    reference_title: A familial syndrome of hypocalcemia with hypercalciuria due to mutations in the calcium-sensing receptor.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Analysis of the functional expression of three of the mutant receptors in HEK-293 cells demonstrated shifts in the dose-response curves so that the extracellular calcium concentrations needed to produce half-maximal increases in total inositol phosphate in the cells were significantly (P=0.02 to P<0.001) lower than those required for the wild-type receptor.
    explanation: The direct measurement of the leftward shift in the dose-response curve, which is the molecular claim this node makes. Graded IN_VITRO because it is a heterologous expression experiment in HEK-293 cells.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:32386559

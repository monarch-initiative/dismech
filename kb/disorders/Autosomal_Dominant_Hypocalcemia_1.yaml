    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The mGoF variants increased total and plasma membrane protein levels
    explanation: The two hypocalcemia-associated variants tested in HEK293 cells increased receptor abundance, contradicting a universal normal-expression mechanism.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:35879818
    reference_title: 'Autosomal Dominant Hypocalcemia Type 1: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There were six deletion variants and one nonsense variant.
    explanation: The published variant spectrum is predominantly, but not exclusively, missense.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: Increased Calcium-Sensing Receptor Signaling
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Many ADH1 variants increase signaling at lower extracellular calcium concentrations than wild-type
    CaSR. This is not a uniform shift of every pathway: Leu723Arg selectively enhanced G11 activation
    in HEK293 assays while Gq, Gi and Gs responses were unchanged. The molecular contacts proposed to
    explain that selectivity remain structural predictions.
  biological_processes:
  - preferred_term: calcium-sensing receptor signalling
    modifier: INCREASED
    term:
      id: GO:0007186
      label: G protein-coupled receptor signaling pathway
  downstream:

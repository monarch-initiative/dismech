    endpoint_context: DIAGNOSTIC
    interpretation: Reports the parathyroid limb of the receptor lesion.
    evidence:
    - reference: PMID:31063613
      reference_title: Treatment of Autosomal Dominant Hypocalcemia Type 1 With the Calcilytic
        NPSP795 (SHP635).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: NPSP795 increased plasma PTH levels in a concentration-dependent manner
        up to 129% above baseline (p = 0.013) at the highest exposure levels.
      explanation: PTH used as the pharmacodynamic readout of receptor signalling in ADH1
        patients, which is what makes it a readout of this node rather than only a
        diagnostic number.
- name: Urinary calcium excretion
  presence: Increased
  context: >-
    Measured as a 24-hour excretion or a calcium:creatinine ratio, and the
    variable that constrains treatment. It is why the therapeutic target in ADH1
    is a low-normal serum calcium rather than a normal one.
  biomarker_term:
    preferred_term: calcium(2+)
    term:
      id: CHEBI:29108
      label: calcium(2+)
  readouts:
  - target: Renal Calcium Wasting
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: Reports the renal limb, and tracks whether treatment is aggravating it.
    evidence:
    - reference: PMID:33112267
      reference_title: Recombinant human parathyroid hormone (1-84) is effective in CASR-associated
        hypoparathyroidism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Case 1 was a 9.4-year-old female whose 24-h urinary calcium decreased from

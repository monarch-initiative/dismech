inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single activating allele is sufficient, because the phenotype comes from
    the mutant receptor sensing calcium too well rather than from loss of the
    wild-type copy. De novo variants are common, so an absent family history
    does not argue against the diagnosis.
  evidence:
  - reference: PMID:7874174
    reference_title: Autosomal dominant hypocalcaemia caused by a Ca(2+)-sensing receptor
      gene mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conclude that this extracellular domain mutation increases the receptor's
      activity at low Ca2+ concentrations, causing hypocalcaemia in patients heterozygous
      for such a mutation.
    explanation: States both the dominant mechanism and that heterozygosity is sufficient.
has_subtypes:
- name: Isolated ADH1
  display_name: Isolated autosomal dominant hypocalcemia type 1
  description: >-
    The common presentation: hypocalcaemia with inappropriately low PTH and
    relative hypercalciuria, without a salt-wasting tubulopathy. Severity ranges
    from an incidental biochemical finding to seizures.
- name: Bartter type V
  display_name: ADH1 with Bartter syndrome type V
  description: >-
    A minority of activating CASR alleles additionally produce a salt-wasting
    tubulopathy with hypokalaemic metabolic alkalosis, hyperreninaemia and
    hyperaldosteronaemia. The extra limb is mechanistically explained: an
    activated receptor in the thick ascending limb inhibits the ROMK potassium
    channel, which is the channel mutated in Bartter syndrome type 2. This is
    curated as a subtype of ADH1 rather than as a separate Bartter entity,
    because the primary lesion is the same receptor.

    Nomenclature warning: the existing Bartter_Syndrome entry in this knowledge
    base carries an unrelated subtype also named Type 5, for transient antenatal
    Bartter syndrome caused by MAGED2. Both are called type 5 in the literature and
    they are different diseases with different genes. The name here is qualified as
    "ADH1 with Bartter syndrome type V" in display_name for that reason.
  evidence:
  - reference: PMID:12241879
    reference_title: Association between activating mutations of calcium-sensing receptor
      and Bartter's syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe two hypocalcaemic patients with deficient parathyroid hormone
      secretion who also showed characteristics of Bartter's syndrome. We found activating
      mutations of the gene for the calcium-sensing receptor (CASR) in both patients.
    explanation: The report establishing that activating CASR alleles can carry a Bartter
      phenotype alongside ADH1.
pathophysiology:
- name: Heterozygous CASR Gain-of-Function Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A missense variant, most often in the large extracellular domain, that makes
    the receptor easier to activate. The protein is expressed and trafficked
    normally; what changes is the calcium concentration at which it signals.
  genetic_context:
    gene:
      preferred_term: CASR
      term:
        id: hgnc:1514
        label: CASR
    functional_impact_category: GAIN_OF_FUNCTION
  molecular_functions:
  - preferred_term: calcium-sensing receptor activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004930
      label: G protein-coupled receptor activity
  downstream:
  - target: Left-Shifted Calcium Set Point
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:8813042
    reference_title: A familial syndrome of hypocalcemia with hypercalciuria due to mutations
      in the calcium-sensing receptor.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Analysis of the functional expression of three of the mutant receptors in
      HEK-293 cells demonstrated shifts in the dose-response curves so that the extracellular
      calcium concentrations needed to produce half-maximal increases in total inositol
      phosphate in the cells were significantly (P=0.02 to P<0.001) lower than those required
      for the wild-type receptor.
    explanation: The direct measurement of the leftward shift in the dose-response curve,
      which is the molecular claim this node makes. Graded IN_VITRO because it is a
      heterologous expression experiment in HEK-293 cells.
- name: Left-Shifted Calcium Set Point
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The receptor now reaches half-maximal signalling at a lower extracellular
    calcium concentration than the wild-type receptor does. Every downstream
    consequence follows from this one quantitative change, in whichever tissue
    the receptor is expressed.
  biological_processes:
  - preferred_term: calcium-sensing receptor signalling
    modifier: INCREASED
    term:
      id: GO:0007186
      label: G protein-coupled receptor signaling pathway
  downstream:
  - target: Suppressed Parathyroid Hormone Secretion
    causal_link_type: DIRECT
    description: >-
      In the parathyroid chief cell, where receptor activation is the signal to
      stop secreting.
  - target: Impaired Renal Tubular Calcium Reabsorption
    causal_link_type: DIRECT
    description: >-
      In the renal tubule, where the same receptor independently reduces calcium
      reabsorption. This limb does not require the parathyroid limb.
  evidence:
  - reference: PMID:7874174
    reference_title: Autosomal dominant hypocalcaemia caused by a Ca(2+)-sensing receptor
      gene mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Xenopus oocytes expressing the mutant receptor exhibit a larger increase in
      inositol 1,4,5-triphosphate in response to Ca2+ than oocytes expressing the wild-type
      receptor.
    explanation: The heterologous-expression measurement showing increased signalling
      output for the same calcium stimulus.
- name: Suppressed Parathyroid Hormone Secretion
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Parathyroid chief cells read the prevailing calcium as adequate and withhold
    PTH. Secretion is reduced, not abolished - measured PTH is typically
    low-normal rather than undetectable, which is precisely why the finding is
    described as inappropriate rather than absent.
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  biological_processes:
  - preferred_term: parathyroid hormone secretion
    modifier: DECREASED
    term:
      id: GO:0035898
      label: parathyroid hormone secretion
  downstream:
  - target: Hypocalcemia with Inappropriately Low PTH
    causal_link_type: DIRECT
  - target: Renal Calcium Wasting
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of PTH removes the hormone's own stimulus to distal tubular calcium
      reabsorption. This is the limb ADH1 shares with every other
      hypoparathyroidism.
  - target: Hyperphosphatemia
    causal_link_type: DIRECT
    description: >-
      PTH is phosphaturic, so withholding it raises serum phosphate.
  evidence:
  - reference: PMID:33112267
    reference_title: Recombinant human parathyroid hormone (1-84) is effective in CASR-associated
      hypoparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: which reduces PTH secretion from parathyroid cells despite low serum calcium
      levels
    explanation: States the parathyroid limb explicitly, including that it operates despite
      low serum calcium.
- name: Impaired Renal Tubular Calcium Reabsorption
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    The over-sensitive receptor in the renal tubule reduces calcium reabsorption
    directly. This is the limb that separates ADH1 from other causes of
    hypoparathyroidism, and it is why raising the filtered calcium load makes the
    renal picture worse rather than better.

    A route from the receptor to the transport defect has been traced.
    Claudin-14 is a negative regulator of the paracellular calcium pathway in the
    thick ascending limb, held in check by miR-9 and miR-374. ADH1 receptor
    variants repress transcription of those two microRNAs, which lifts the brake
    on claudin-14 and closes the paracellular route. The step is evidenced in
    cell and animal models rather than in patients, and is recorded here at that
    strength.
  biological_processes:
  - preferred_term: renal tubular calcium ion transport
    modifier: DECREASED
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
  genes:
  - preferred_term: CLDN14
    term:
      id: hgnc:2035
      label: CLDN14
  downstream:
  - target: Renal Calcium Wasting
    causal_link_type: DIRECT
  - target: Impaired Vasopressin-Dependent Water Reabsorption
    causal_link_type: DIRECT
    description: >-
      The same receptor is expressed in the collecting duct, where its activation
      opposes vasopressin action. This is a second renal consequence, parallel to
      the calcium one rather than downstream of it.
  evidence:
  - reference: PMID:33112267
    reference_title: Recombinant human parathyroid hormone (1-84) is effective in CASR-associated
      hypoparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the presence of CaSRs with increased sensitivity to calcium in the renal tubule
      also impairs reabsorption of calcium
    explanation: The renal limb stated as a mechanism independent of the parathyroid limb.
  - reference: PMID:37754292
    reference_title: Efficacy and Safety of Encaleret in Autosomal Dominant Hypocalcemia
      Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Gain-of-function CASR variants increase the sensitivity of the CaSR to extracellular
      calcium, reducing PTH secretion and renal calcium reabsorption and resulting in hypocalcemia,
      hyperphosphatemia, hypomagnesemia, and hypercalciuria.
    explanation: States both limbs and, importantly, names hypomagnesaemia among the
      cardinal biochemical consequences rather than as a Bartter-subtype feature.
  - reference: PMID:25071082
    reference_title: Epigenetic regulation of microRNAs controlling CLDN14 expression as
      a mechanism for renal calcium handling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The genetic mutations in the calcium-sensing receptor from patients with autosomal
      dominant hypocalcemia (ADH) repressed the transcription of miR-9 and miR-374 genes,
      and treatment with an HDAC inhibitor rescued the phenotypes of cell and animal models
      of ADH.
    explanation: The claudin-14 route stated for ADH variants specifically, with a
      pharmacological rescue in cell and animal models. This is the citation for the CLDN14
      descriptor on this node; the descriptor was previously carried on the strength of a
      deep-research lead alone, which PR review correctly flagged.
  - reference: PMID:25071082
    reference_title: Epigenetic regulation of microRNAs controlling CLDN14 expression as
      a mechanism for renal calcium handling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: miR-9 and miR-374 genes, which have been shown to repress the expression of
      claudin-14, the negative regulator of the paracellular pathway
    explanation: Establishes claudin-14's role as the brake on paracellular calcium
      reabsorption and the microRNAs that hold it, which is the intermediate step between
      the receptor and the transport defect.
- name: Impaired Vasopressin-Dependent Water Reabsorption
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Receptor activation in the collecting duct opposes vasopressin by driving down
    aquaporin-2. In a CaSR knock-in mouse modelling this disease the route was
    traced - less total AQP2, more AQP2 phosphorylated at the degradation site
    Ser261, higher phosphorylated p38MAPK and ATF1 upstream of it, and more of the
    AQP2-targeting miR-137 - and a calcilytic reversed it. This is the mechanism
    behind the urinary concentrating defect and the polyuria of the Bartter-type-V
    presentation. PROVISIONAL because the chain is established in the mouse and
    has not been demonstrated in patients.
  genes:
  - preferred_term: AQP2
    term:
      id: hgnc:634
      label: AQP2
  biological_processes:
  - preferred_term: renal water homeostasis
    modifier: DECREASED
    term:
      id: GO:0003091
      label: renal water homeostasis
  evidence:
  - reference: PMID:38367250
    reference_title: In vivo treatment with calcilytic of CaSR knock-in mice ameliorates
      renal phenotype reversing downregulation of the vasopressin-AQP2 pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we provide evidence that, with respect to wild-type mice, CaSR knock-in (KI)
      mice mimicking autosomal dominant hypocalcaemia, display a significant decrease in
      the total content of AQP2 associated with significantly higher levels of AQP2 phosphorylation
      at Ser261, a phosphorylation site involved in AQP2 degradation.
    explanation: The measured AQP2 defect in a knock-in mouse built to model this disease.
  - reference: PMID:38367250
    reference_title: In vivo treatment with calcilytic of CaSR knock-in mice ameliorates
      renal phenotype reversing downregulation of the vasopressin-AQP2 pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In vivo treatment of KI mice with the calcilytic JTT-305, a CaSR antagonist,
      increased AQP2 expression and reduced AQP2-targeting miRNA137 levels in KI mice.
    explanation: The pharmacological reversal, which is what attributes the AQP2 defect to
      receptor activity rather than to the hypocalcaemia it accompanies.
- name: Hypocalcemia with Inappropriately Low PTH
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The defining biochemical signature. The pairing matters more than either
    number: hypocalcaemia with a PTH that is merely low-normal is the finding
    that points at the receptor rather than at the gland.
  downstream:
  - target: Neuromuscular Irritability
    causal_link_type: DIRECT
  - target: Ectopic Calcification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic hypocalcaemia with hyperphosphataemia is associated with
      intracranial calcification, but the step from the disturbed
      calcium-phosphate product to deposition at specific sites is not resolved.
  evidence:
  - reference: PMID:31063613
    reference_title: Treatment of Autosomal Dominant Hypocalcemia Type 1 With the Calcilytic
      NPSP795 (SHP635).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individuals are hypocalcemic with inappropriately low parathyroid hormone
      (PTH) secretion and relative hypercalciuria.
    explanation: The three-part biochemical signature stated compactly in a clinical study
      of ADH1 patients.
- name: Renal Calcium Wasting
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Urinary calcium excretion is high relative to a serum calcium that is already
    low. Two independent inputs converge here - the absent PTH signal and the
    tubular receptor - which is why the hypercalciuria of ADH1 exceeds that of
    other hypoparathyroidisms and why it is hard to treat.
  downstream:
  - target: Ectopic Calcification
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sustained hypercalciuria supersaturates the tubular fluid, giving
      nephrocalcinosis and stones.
  evidence:
  - reference: PMID:33112267
    reference_title: Recombinant human parathyroid hormone (1-84) is effective in CASR-associated
      hypoparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The combination of both loss of PTH and gain of CaSR activity provides a dual
      mechanism for hypercalciuria in ADH1
    explanation: Names the convergence of the two upstream limbs on this node, which is
      the reason this entry models them separately.
- name: Hyperphosphatemia
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Raised serum phosphate, the expected consequence of withdrawing a phosphaturic
    hormone.
  evidence:
  - reference: PMID:37754292
    reference_title: Efficacy and Safety of Encaleret in Autosomal Dominant Hypocalcemia
      Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mean blood levels of intact PTH, magnesium, and 1,25-dihydroxy-vitamin D increased,
      whereas phosphorus levels and tubular reabsorption of phosphate decreased
    explanation: The phosphate response to restoring PTH, which demonstrates the phosphate
      elevation is PTH-dependent rather than incidental.
- name: Neuromuscular Irritability
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Reduced ionised calcium lowers the threshold for nerve and muscle
    depolarisation, giving paraesthesiae, carpopedal spasm, tetany and seizures.
    Severity is not simply a function of how low the calcium is: in one kindred
    four of seven affected members were symptomatic and the symptoms were
    explicitly unrelated to the degree of hypocalcaemia.
  evidence:
  - reference: PMID:22863393
    reference_title: Hypoparathyroidism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Although hypocalcemic patients commonly present with symptoms of neuromuscular
      irritability with perioral numbers paresthesias, tingling, seizures and, bronchospasm;
      hypocalcemia may be identified on the biochemical profile of an asymptomatic patient.
    explanation: Names the syndrome and its manifestations, and records that it may be
      absent altogether. The source's typo "numbers" for "numbness" is reproduced as
      published.
  - reference: PMID:16128246
    reference_title: 'A family with autosomal dominant hypocalcaemia with hypercalciuria
      (ADHH): mutational analysis, phenotypic variability and treatment challenges.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Four of seven affected individuals were symptomatic (seizures, abdominal pains
      and paraesthesias), unrelated to severity of hypocalcaemia.
    explanation: The observation that symptom burden does not track calcium level, measured
      within a single kindred carrying one variant.
- name: Ectopic Calcification
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Deposition of calcium salts outside bone - in the renal medulla as
    nephrocalcinosis and stones, and intracranially in the basal ganglia and
    cerebral cortex. PROVISIONAL because the renal and intracranial deposits do
    not share a single established mechanism: the renal deposits follow directly
    from supersaturated tubular fluid, while the intracranial ones accompany
    chronic hypocalcaemia and hyperphosphataemia without a resolved pathway, and
    conventional treatment contributes to the renal component.
  evidence:
  - reference: PMID:33112267
    reference_title: Recombinant human parathyroid hormone (1-84) is effective in CASR-associated
      hypoparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As a result, nephrocalcinosis and nephrolithiasis are more common in subjects
      with ADH1 than other forms of hypoparathyroidism
    explanation: Ties the renal deposits specifically to ADH1's extra renal limb rather
      than to hypoparathyroidism in general.

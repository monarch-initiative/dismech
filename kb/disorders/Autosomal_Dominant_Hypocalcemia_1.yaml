notes: >-
  Scope. This entry covers ADH1 (CASR) only. ADH2 (GNA11) is a separate MONDO
  term with a different gene and is treated here as a differential, not as a
  subtype - the two share a biochemical phenotype but not a lesion. The
  Bartter-type-V presentation is curated as a has_subtypes entry rather than
  being folded into the existing Bartter_Syndrome entry, because its primary
  lesion is the same receptor as the rest of ADH1 and it appears among this MONDO
  term's own synonyms.

  Gain of function, in two senses. Both schema slots are used here and they make
  different claims. The variant node carries genetic_context with
  functional_impact_category GAIN_OF_FUNCTION, because that is the consequence of
  the variant. The descriptor modifiers are separate: the receptor node uses
  GAIN_OF_FUNCTION because the receptor is signalling outside its normal
  regulatory constraint, while the downstream signalling node uses the
  quantitative INCREASED, since what is claimed there is an amount of signalling
  for a given calcium concentration.

  Molecular function term. GO has no "calcium-sensing receptor activity" term.
  The receptor node is bound to GO:0004930 (G protein-coupled receptor activity),
  which is accurate but less specific than the claim; preferred_term carries the
  specific reading. The same applies to GO:0006816 for the renal node, where GO
  has no term for renal tubular calcium reabsorption specifically.

  Nephrolithiasis label. HP:0000787 is carried here as "Nephrolithiasis", the
  label in this repository's HP cache. A live OLS lookup during curation returned
  "Kidney stone" for the same CURIE, so the two disagree; the cached label is what
  term validation checks against and is used.

  Prevalence. The 3.9 per 100,000 figure is quoted from a paper's introduction
  rather than from a primary epidemiological study, and the evidence item is
  graded OTHER for that reason.

  Deep research. An openscientist deep-research run was commissioned for this
  entry. The pathograph and the first eight references were built independently
  from PubMed before the report returned; the report was then read as a source of
  leads and contributed four further references (PMID:20374733, PMID:39658204,
  PMID:40086735 and the differentials they support). Every PMID was fetched with
  just fetch-reference and every snippet verified against the fetched cache
  rather than against the report's own quotation of it - which mattered, because
  three snippets initially taken from an abstract-metadata service did not match
  the fetched cache text word for word.

  What the report got wrong. Its term-validation section flagged one confabulated
  CL identifier (CL:1000456, named as a collecting-duct cell but actually a
  peritoneal mesothelial cell) among the terms it proposed; that term is not used
  here. It also gave MONDO:0008833 as this disease's identifier, where the
  curation stub and MONDO give MONDO:0011013 for "autosomal dominant hypocalcemia
  1"; the stub's identifier is used.

treatments:
- name: Calcitriol and Calcium Supplementation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Active vitamin D, with calcium supplementation when needed, can relieve symptomatic hypocalcemia.
    Treatment is titrated to symptoms and urinary calcium rather than routinely normalizing serum calcium,
    because raising calcium can aggravate renal losses. Some asymptomatic patients within an individualized
    target range and without hypercalciuria can be monitored without medication. Recommendations are based
    largely on small ADH1 studies and broader hypoparathyroidism practice.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

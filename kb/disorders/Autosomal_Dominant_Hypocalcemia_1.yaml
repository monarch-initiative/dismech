discussions:
- discussion_id: adh1_calcium_target_is_a_tradeoff
  kind: INTERPRETATION
  attaches_to:
  - pathophysiology#Renal Calcium Wasting
  - treatments#Calcitriol and Calcium Supplementation
  prompt: Why are symptoms and urinary calcium assessed together when titrating conventional treatment?
  rationale: >-
    PTH deficiency and direct renal CaSR effects can both impair calcium conservation. Baseline renal
    activation is allele- and calcium-dependent rather than obligatorily maximal in every patient. Raising
    serum calcium may recruit or worsen renal calcium losses, so symptom relief must be balanced against
    urine calcium and renal outcomes. This supports individualized targets, not withholding acute calcium
    treatment or assuming every patient has the same threshold.
  evidence:
  - reference: PMID:8813042
    reference_title: A familial syndrome of hypocalcemia with hypercalciuria due to mutations in the calcium-sensing receptor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: treatment with vitamin D resulted in increased hypercalciuria, nephrocalcinosis, and renal impairment
    explanation: The observed harm from raising calcium by the conventional route.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:33112267
    reference_title: Recombinant human parathyroid hormone (1-84) is effective in CASR-associated hypoparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The traditional approach to treatment includes activated vitamin D but this further increases urinary calcium excretion.
    explanation: States the trade-off directly as the motivation for seeking an alternative.
    quote_role: BACKGROUND
    directness: INDIRECT
  - reference: PMID:35313217
    reference_title: Differential parathyroid and kidney Ca(2+)-sensing receptor activation in autosomal dominant hypocalcemia 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: significant hypercalciuria was not observed in a ADH1 patient until blood Ca2+ was normalized.
    explanation: One retrospective patient observation supports treatment dependence, not universal absence of untreated hypercalciuria.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- discussion_id: adh1_in_vitro_activation_does_not_predict_response
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#CASR
  - treatments#Calcilytic (Negative Allosteric Modulator of the CaSR)
  prompt: How well can cellular variant assays predict individual calcilytic response?
  rationale: >-
    The five-adult NPSP795 study found no significant correlation between its cellular assay readouts
    and clinical PTH response. Small sample size, brief exposure and within-allele variability limit this
    negative result. Leu723Arg demonstrates G11-biased signaling in HEK293 cells, while other tested ADH1
    variants activate multiple pathways. This establishes possible assay dependence but does not prove
    that signaling bias caused clinical nonresponse or short stature. Proposed residue contacts and genotype-guided
    drug selection require further validation.
  evidence:
  - reference: PMID:31063613
    reference_title: Treatment of Autosomal Dominant Hypocalcemia Type 1 With the Calcilytic NPSP795 (SHP635).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In vitro, all mutant CaRs were half-maximally activated (EC50 ) at lower concentrations of extracellular calcium (Ca2+o ) compared to wild-type (WT) CaR; NPSP795 exposure increased the EC50 for all CaR activity readouts. However, the in vitro responses to NPSP795 did not correlate with any clinical parameters.'
    explanation: The paired result - uniform in vitro behaviour, uncorrelated clinical behaviour - which is the gap itself.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:31063613
    reference_title: Treatment of Autosomal Dominant Hypocalcemia Type 1 With the Calcilytic NPSP795 (SHP635).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Albeit all mutations appear to be activating at the CaR, in vitro observations were not predictive of the in vivo phenotype or the response to calcilytics, suggesting that other parameters impact the response to the drug.
    explanation: The authors' own statement of the disconnect, quoted separately from the result that produced it.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:39658204
    reference_title: An activating calcium-sensing receptor variant with biased signaling reveals a critical residue for Gα11 coupling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Transient expression studies showed the Leu723Arg variant was normally expressed but resulted in a significantly lower EC50 for extracellular calcium activation of G11 but not other G proteins (ie, Gi, Gq, Gs).
    explanation: Direct evidence that a variant can be activating for one G-protein route and not others, which is one of the candidate explanations for the assay-to-clinic disconnect.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- discussion_id: adh1_vs_adh2_and_hypoparathyroidism
  kind: INTERPRETATION
  attaches_to:
  - diagnosis#CASR Sequencing
  prompt: What does ADH1 need to be distinguished from, and why does the distinction change management?
  rationale: >-
    Low calcium with insufficient PTH occurs in ADH1, other genetic hypoparathyroidism and acquired parathyroid
    disorders. All may have renal treatment complications; urine calcium alone is not a definitive discriminator.
    Pathogenic activating CASR variants distinguish ADH1 from GNA11-related ADH2 and from other molecular
    causes. Activating CaSR autoantibodies are an acquired phenocopy, but a negative CASR test also warrants
    assessment of other genetic causes, surgery, autoimmunity and magnesium disturbances.
  evidence:
  - reference: PMID:28194447
    reference_title: Gα(11) mutation in mice causes hypocalcemia rectifiable by calcilytic therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Heterozygous germline gain-of-function mutations of G-protein subunit α11 (Gα11), a signaling partner for the calcium-sensing receptor (CaSR), result in autosomal dominant hypocalcemia type 2 (ADH2).
    explanation: Defines ADH2 and its relationship to the receptor, which is the basis of the differential.
    quote_role: BACKGROUND
    directness: INDIRECT
  - reference: PMID:20374733
    reference_title: Calcium-sensing receptor and associated diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Phenocopies of FHH or ADH are due to circulating CASR inactivating or activating autoantibodies, respectively.
    explanation: The review describes activating autoantibodies as one acquired phenocopy; negative CASR sequencing alone does not establish that diagnosis.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT

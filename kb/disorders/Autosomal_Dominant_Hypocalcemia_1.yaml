inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Usually caused by a heterozygous activating CASR variant, inherited or de novo. Variable expression
    and parental mosaicism mean that an unaffected parent or absent family history does not exclude ADH1.
    Rare biallelic cases have also been reported.
  evidence:
  - reference: PMID:7874174
    reference_title: Autosomal dominant hypocalcaemia caused by a Ca(2+)-sensing receptor gene mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conclude that this extracellular domain mutation increases the receptor's activity at low Ca2+ concentrations, causing hypocalcaemia in patients heterozygous for such a mutation.
    explanation: States both the dominant mechanism and that heterozygosity is sufficient.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:35879818
    reference_title: 'Autosomal Dominant Hypocalcemia Type 1: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Only one report described a patient with ADH1 with a homozygous CASR variant
    explanation: The systematic review identifies an exceptional biallelic case; the usual inheritance remains autosomal dominant.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
has_subtypes:
- name: Isolated ADH1
  display_name: Isolated autosomal dominant hypocalcemia type 1
  description: >-
    The common presentation: hypocalcaemia with inappropriately low PTH and
    relative hypercalciuria, without a salt-wasting tubulopathy. Severity ranges
    from an incidental biochemical finding to seizures.
- name: Bartter type V
  display_name: ADH1 with Bartter syndrome type V
  description: >-
    Some activating CASR variants additionally cause a Bartter-like salt-wasting tubulopathy with hypokalemic
    metabolic alkalosis, hyperreninemia and hyperaldosteronism. CaSR-mediated inhibition of renal potassium
    recycling is a proposed route to impaired thick ascending limb salt transport. The historical label
    Bartter type V here denotes CASR-related disease; MAGED2-related transient antenatal Bartter syndrome
    is a different entity.
  evidence:
  - reference: PMID:12241879
    reference_title: Association between activating mutations of calcium-sensing receptor and Bartter's syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe two hypocalcaemic patients with deficient parathyroid hormone secretion who also showed characteristics of Bartter's syndrome. We found activating mutations of the gene for the calcium-sensing receptor (CASR) in both patients.
    explanation: The report establishing that activating CASR alleles can carry a Bartter phenotype alongside ADH1.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
pathophysiology:
- name: Activating CASR Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Activating variants are usually heterozygous missense changes, but deletions and a nonsense variant
    have also been reported. Effects depend on the allele: reduced calcium-response thresholds, constitutive
    activation, altered G-protein selectivity or increased receptor abundance can contribute. Normal expression
    and trafficking observed for some variants do not generalize to all ADH1 alleles.

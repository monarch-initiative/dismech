name: Autosomal Dominant Hypocalcemia 1
creation_date: "2026-08-28T16:30:00Z"
category: Mendelian
description: >-
  ADH1 is a disease of a moved set point rather than a missing protein. The
  calcium-sensing receptor is a class C G-protein-coupled receptor that reads
  extracellular ionised calcium and, when that concentration rises, both
  suppresses parathyroid hormone secretion and reduces calcium reabsorption in
  the renal tubule. A heterozygous activating variant leaves the receptor intact
  and correctly located but shifts its dose-response curve to the left, so
  calcium concentrations that a normal receptor would read as low are read as
  sufficient.

  The consequence is hypocalcaemia that the body does not defend. PTH is not
  absent - it is inappropriately low for the calcium level, which is what
  distinguishes this from parathyroid destruction or agenesis. And because the
  same over-sensitive receptor is present in the renal tubule, calcium is being
  excreted at the same time as it is being lost from the circulation. That
  second limb is what makes ADH1 clinically distinct from other
  hypoparathyroidisms: hypercalciuria is driven both by the low PTH and by the
  receptor acting directly on the tubule, so it is worse than PTH deficiency
  alone would explain.

  The therapeutic consequence follows directly and is the reason the mechanism
  is worth stating precisely. Conventional treatment - calcium plus activated
  vitamin D - raises serum calcium by pushing more calcium through a kidney that
  is already wasting it, so correcting the symptom aggravates the renal lesion
  and drives nephrocalcinosis and stones. Treatments that act on the mechanism
  rather than the number, PTH replacement and negative allosteric modulators of
  the receptor, are therefore not merely alternatives but are aimed at a
  different point in the causal chain.

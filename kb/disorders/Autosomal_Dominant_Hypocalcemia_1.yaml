    treatment_effect: BYPASSES
    description: >-
      Raises circulating calcium without correcting CASR activation or restoring endogenous PTH secretion.
  evidence:
  - reference: PMID:8813042
    reference_title: A familial syndrome of hypocalcemia with hypercalciuria due to mutations in the calcium-sensing receptor.
    supports: SUPPORT

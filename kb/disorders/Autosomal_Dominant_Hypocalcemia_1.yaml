genetic:
- name: CASR
  gene_term:
    preferred_term: CASR
    term:
      id: hgnc:1514
      label: CASR
  relationship_type: CAUSATIVE
  notes: >-
    Most reported pathogenic variants are heterozygous missense changes, distributed across extracellular,
    transmembrane and intracellular domains. Deletions, a nonsense variant, parental mosaicism and a rare
    homozygous case have also been reported. Variant-specific expression and signaling effects matter;
    a five-person NPSP795 study did not establish a reliable relationship between cellular assays and
    clinical drug response. Loss-of-function CASR variants usually cause the opposite calcium phenotype
    and should not be interpreted as ADH1 merely because the gene matches.
  evidence:
  - reference: PMID:20374733
    reference_title: Calcium-sensing receptor and associated diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Heterozygous loss-of-function mutations cause familial (benign) hypocalciuric hypercalcemia (FHH) in which the lifelong mild hypercalcemia is generally asymptomatic. Homozygous inactivating mutations give rise to neonatal severe hyperparathyroidism (NSHPT) with extreme hypercalcemia and marked skeletal changes. Heterozygous activating mutations of the CASR cause autosomal dominant hypocalcemia (ADH) that may be asymptomatic or present with seizures in the neonatal period or childhood or later in life.
    explanation: The full allelic series in one passage, which is what places ADH1 at the gain-of-function end of a graded dosage relationship rather than treating it as an isolated phenotype.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:8813042
    reference_title: A familial syndrome of hypocalcemia with hypercalciuria due to mutations in the calcium-sensing receptor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Five heterozygous missense mutations (Asn118Lys, Phe128Leu, Thr151Met, Glu191Lys, and Phe612Ser) were detected in the extracellular domain of the calcium-sensing-receptor gene and shown to cosegregate with the disease.
    explanation: Establishes the allelic spectrum and its cosegregation across six kindreds.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:31063613
    reference_title: Treatment of Autosomal Dominant Hypocalcemia Type 1 With the Calcilytic NPSP795 (SHP635).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was significant variability in response clinically across genotypes.
    explanation: Documents variable short-term calcilytic response in five participants; it does not establish a genotype-based severity or drug-response prediction rule.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:27617113
    reference_title: Novel Mutation in the CASR Gene (p.Leu123Ser) in a Case of Autosomal Dominant Hypocalcemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sequencing analysis in the mother suggested mosaicism for the same variant, and she was clinically and biochemically unaffected.
    explanation: A clinically and biochemically normal parent mosaic for the proband's variant - the concrete case behind the inheritance block's claim that an absent family history does not argue against the diagnosis, and a warning that parental testing can mislead.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

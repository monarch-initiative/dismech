  - reference: PMID:35818129
    reference_title: 'Autosomal dominant hypocalcemia with a novel CASR mutation: a case
      study and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is caused by gain-of-function mutations in the calcium-sensing receptor
      gene (CASR) which affect PTH secretion from the parathyroid gland and calcium resorption
      in the kidney.
    explanation: Identifies CASR as the gene to sequence and states both tissues in which
      the receptor acts.
treatments:
- name: Calcitriol and Calcium Supplementation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The conventional treatment, and the one whose limitation defines the field.
    It raises serum calcium without touching the receptor, so it drives more
    calcium through a tubule that is already wasting it. Guidelines still
    recommend it, and the practical aim is a low-normal serum calcium that
    relieves symptoms rather than a normal one.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcitriol
      term:
        id: CHEBI:17823
        label: calcitriol
  target_mechanisms:
  - target: Hypocalcemia with Inappropriately Low PTH
    treatment_effect: BYPASSES
    description: >-
      Raises serum calcium by a route that does not involve PTH or the receptor,
      which is why it corrects the number without correcting the mechanism.
  evidence:
  - reference: PMID:8813042
    reference_title: A familial syndrome of hypocalcemia with hypercalciuria due to mutations
      in the calcium-sensing receptor.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: The hypocalcemia was associated with hypercalciuria, and treatment with vitamin
      D resulted in increased hypercalciuria, nephrocalcinosis, and renal impairment.
    explanation: PARTIAL because it documents the harm rather than the benefit - the
      observation that established why this treatment is a compromise.
- name: Recombinant Human PTH(1-84)
  therapeutic_modality: PEPTIDE
  description: >-
    Replaces the hormone the receptor is suppressing, addressing one of the two
    limbs. Patients with CASR variants were excluded from the pivotal
    hypoparathyroidism trials on the reasoning that the extra renal limb would
    blunt the effect on urinary calcium; a later case series found that it
    nevertheless improved hypercalciuria relative to conventional therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant parathyroid hormone
      term:
        id: NCIT:C62555
        label: Recombinant Parathyroid Hormone
  target_mechanisms:
  - target: Suppressed Parathyroid Hormone Secretion
    treatment_effect: RESTORES
    description: >-
      Supplies the hormone whose secretion is suppressed. It does not bind the
      renal receptor, so it addresses the tubular limb only through restoring PTH's
      own action on the distal tubule, not by correcting the receptor's
      sensitivity.
  evidence:
  - reference: PMID:33112267
    reference_title: Recombinant human parathyroid hormone (1-84) is effective in CASR-associated
      hypoparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We have described three subjects with ADH1 who were treated effectively with
      rhPTH(1-84). In all cases, hypercalciuria improved by comparison to treatment with
      conventional therapy consisting of calcium supplementation and calcitriol.
    explanation: The result, with its own scope stated - three subjects, compared against
      conventional therapy rather than against a control arm.
- name: Palopegteriparatide
  therapeutic_modality: PEPTIDE
  description: >-
    A long-acting PTH(1-34) prodrug giving continuous rather than pulsatile
    exposure. Reported in a paediatric ADH1 patient refractory to conventional
    therapy; the evidence base in this disease is a case report rather than a
    trial, and it is recorded at that strength.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Suppressed Parathyroid Hormone Secretion
    treatment_effect: RESTORES
    description: >-
      Replaces the suppressed hormone, as rhPTH(1-84) does, but with a duration of
      action intended to hold calcium steady rather than to peak and fall.
  evidence:
  - reference: PMID:42388864
    reference_title: 'Case Report: Palopegteriparatide as a novel therapeutic option in pediatric
      autosomal dominant hypocalcemia type 1.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Evidence on the use of long-acting PTH analogs in pediatric ADH1 remains scarce.
    explanation: PARTIAL because the authors state the evidence base is scarce; this is a
      single case, and the entry does not present it as established practice.
- name: Thiazide Diuretic
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The adjunct that acts on the renal limb. Thiazides enhance distal tubular
    calcium reabsorption, which is precisely the process the over-sensitive
    receptor impairs, and they are singled out as being of particular benefit in
    activating calcium-sensing receptor mutations rather than in
    hypoparathyroidism generally.

    Its presence is the reason the calcilytic entry below is described as acting
    on the receptor itself rather than as the only thing reaching the kidney: a
    thiazide reaches the renal limb, but downstream of the lesion and without
    touching the set point.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: thiazide diuretic
      term:
        id: NCIT:C49185
        label: Thiazide Diuretic
  target_mechanisms:
  - target: Renal Calcium Wasting
    treatment_effect: MODULATES
    description: >-
      Increases distal tubular calcium reabsorption, opposing the renal limb at its
      output rather than at its cause.
  evidence:
  - reference: PMID:22863393
    reference_title: Hypoparathyroidism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In the long-term management of hypoparathyroidism thiazide diuretics are of value
      as they enhance renal calcium reabsorption and increase serum calcium and are of particular
      benefit in those with activating mutations of the calcium-sensing receptor.
    explanation: States both the mechanism and, in the same sentence, that the benefit is
      genotype-specific to this disease - which is why it belongs here rather than as generic
      hypoparathyroidism management.
- name: Calcilytic (Negative Allosteric Modulator of the CaSR)
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The approach directed at the lesion itself: a negative allosteric modulator
    pushes the receptor's dose-response curve back towards normal, so it acts
    upstream of both limbs at once rather than on either output.

    The evidence has two generations and they say different things. NPSP795, in
    five adults over three days, raised PTH dose-dependently but did not
    significantly change fractional calcium excretion - proof of mechanism only.
    Encaleret, an oral calcilytic, was then given to 13 adults in an open-label
    phase 2b study and corrected hypocalcaemia and reduced hypercalciuria
    together, over 24 outpatient weeks. That second result is the one that matters
    for this entry's argument: it is the only intervention here that moves both
    sides of the trade-off in the same direction. It remains an open-label study
    of 13 patients, not a controlled trial.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Left-Shifted Calcium Set Point
    treatment_effect: INHIBITS
    description: >-
      Acts on the shifted set point directly, which is the node no other
      treatment reaches.
  evidence:
  - reference: PMID:31063613
    reference_title: Treatment of Autosomal Dominant Hypocalcemia Type 1 With the Calcilytic
      NPSP795 (SHP635).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: NPSP795 increased plasma PTH levels in subjects with ADH1 in a dose-dependent
      manner, and thus, serves as proof-of-concept that calcilytics could be an effective
      treatment for ADH1.
    explanation: PARTIAL because the authors themselves frame the result as proof of
      concept rather than as demonstrated efficacy.
  - reference: PMID:31063613
    reference_title: Treatment of Autosomal Dominant Hypocalcemia Type 1 With the Calcilytic
      NPSP795 (SHP635).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Fractional excretion of calcium (FECa) trended down but not significantly so.
    explanation: The negative result on the renal endpoint in the earlier compound, quoted
      separately so the limitation is recorded structurally rather than only in prose.
  - reference: PMID:37754292
    reference_title: Efficacy and Safety of Encaleret in Autosomal Dominant Hypocalcemia
      Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Encaleret corrected hypocalcemia and reduced hypercalciuria during the inpatient
      periods and the 24-week outpatient period.
    explanation: Both endpoints moving together, which is the result no other treatment in
      this entry achieves and the reason the calcilytic class is described as acting upstream
      of both limbs.
  - reference: PMID:37754292
    reference_title: Efficacy and Safety of Encaleret in Autosomal Dominant Hypocalcemia
      Type 1.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: In our study, encaleret appeared to restore physiologic mineral homeostasis in
      13 participants with ADH1. This molecularly targeted approach, pending further studies,
      may establish calcilytics as a potential treatment for ADH1.
    explanation: PARTIAL because the authors' own conclusion is hedged to a 13-participant
      open-label study pending further work, and this entry does not upgrade it.
  - reference: PMID:40086735

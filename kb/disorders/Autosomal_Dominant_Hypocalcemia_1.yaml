- name: Impaired Renal Tubular Calcium Reabsorption
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Activated renal CaSR can reduce tubular calcium reabsorption in addition to the loss of PTH-dependent
    reabsorption. In Nuf Leu723Gln mice, baseline hypocalcemia was associated with unchanged fractional
    calcium excretion and no increased CLDN14 readout; raising calcium with a vitamin D analog induced
    renal CaSR-associated changes. A retrospective human A784V case showed a similar treatment-dependent
    pattern. These observations qualify obligatory baseline renal activation and do not exclude stronger
    renal effects of other alleles.
  biological_processes:
  - preferred_term: calcium ion transport
    modifier: DECREASED
    term:
      id: GO:0006816
      label: calcium ion transport
  downstream:
  - target: Renal Calcium Wasting

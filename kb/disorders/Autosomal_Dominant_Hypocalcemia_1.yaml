diagnosis:
- name: Paired Serum Calcium and Intact PTH
  description: >-
    Measure ionized or albumin-adjusted calcium together with intact PTH, phosphate, magnesium and renal
    function. Inappropriately low or normal PTH supports hypoparathyroid physiology; the finding is not
    specific to CASR activation. Urinary calcium informs phenotype and treatment risk.

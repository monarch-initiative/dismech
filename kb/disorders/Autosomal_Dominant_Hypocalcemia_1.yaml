    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004930
      label: G protein-coupled receptor activity
  downstream:
  - target: Left-Shifted Calcium Set Point
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:8813042
    reference_title: A familial syndrome of hypocalcemia with hypercalciuria due to mutations
      in the calcium-sensing receptor.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Analysis of the functional expression of three of the mutant receptors in
      HEK-293 cells demonstrated shifts in the dose-response curves so that the extracellular
      calcium concentrations needed to produce half-maximal increases in total inositol
      phosphate in the cells were significantly (P=0.02 to P<0.001) lower than those required
      for the wild-type receptor.
    explanation: The direct measurement of the leftward shift in the dose-response curve,
      which is the molecular claim this node makes. Graded IN_VITRO because it is a
      heterologous expression experiment in HEK-293 cells.
- name: Left-Shifted Calcium Set Point
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The receptor now reaches half-maximal signalling at a lower extracellular
    calcium concentration than the wild-type receptor does. Every downstream
    consequence follows from this one quantitative change, in whichever tissue
    the receptor is expressed.
  biological_processes:
  - preferred_term: calcium-sensing receptor signalling
    modifier: INCREASED
    term:
      id: GO:0007186
      label: G protein-coupled receptor signaling pathway
  downstream:
  - target: Suppressed Parathyroid Hormone Secretion
    causal_link_type: DIRECT
    description: >-
      In the parathyroid chief cell, where receptor activation is the signal to
      stop secreting.
  - target: Impaired Renal Tubular Calcium Reabsorption
    causal_link_type: DIRECT
    description: >-
      In the renal tubule, where the same receptor independently reduces calcium
      reabsorption. This limb does not require the parathyroid limb.
  evidence:
  - reference: PMID:7874174
    reference_title: Autosomal dominant hypocalcaemia caused by a Ca(2+)-sensing receptor
      gene mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Xenopus oocytes expressing the mutant receptor exhibit a larger increase in
      inositol 1,4,5-triphosphate in response to Ca2+ than oocytes expressing the wild-type
      receptor.
    explanation: The heterologous-expression measurement showing increased signalling
      output for the same calcium stimulus.
- name: Suppressed Parathyroid Hormone Secretion
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Parathyroid chief cells read the prevailing calcium as adequate and withhold
    PTH. Secretion is reduced, not abolished - measured PTH is typically
    low-normal rather than undetectable, which is precisely why the finding is
    described as inappropriate rather than absent.
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  biological_processes:
  - preferred_term: parathyroid hormone secretion
    modifier: DECREASED
    term:
      id: GO:0035898
      label: parathyroid hormone secretion
  downstream:
  - target: Hypocalcemia with Inappropriately Low PTH
    causal_link_type: DIRECT
  - target: Renal Calcium Wasting
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of PTH removes the hormone's own stimulus to distal tubular calcium
      reabsorption. This is the limb ADH1 shares with every other
      hypoparathyroidism.
  - target: Hyperphosphatemia
    causal_link_type: DIRECT
    description: >-
      PTH is phosphaturic, so withholding it raises serum phosphate.
  evidence:
  - reference: PMID:33112267
    reference_title: Recombinant human parathyroid hormone (1-84) is effective in CASR-associated
      hypoparathyroidism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: which reduces PTH secretion from parathyroid cells despite low serum calcium
      levels
    explanation: States the parathyroid limb explicitly, including that it operates despite
      low serum calcium. Graded OTHER because the sentence is the paper's mechanistic
      background rather than a result of its own case series.
- name: Impaired Renal Tubular Calcium Reabsorption
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    The over-sensitive receptor in the renal tubule reduces calcium reabsorption
    directly. This is the limb that separates ADH1 from other causes of
    hypoparathyroidism, and it is why raising the filtered calcium load makes the
    renal picture worse rather than better.
  biological_processes:
  - preferred_term: renal tubular calcium ion transport
    modifier: DECREASED
    term:
      id: GO:0006816
      label: calcium ion transport
  downstream:
  - target: Renal Calcium Wasting
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33112267
    reference_title: Recombinant human parathyroid hormone (1-84) is effective in CASR-associated
      hypoparathyroidism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the presence of CaSRs with increased sensitivity to calcium in the renal tubule
      also impairs reabsorption of calcium
    explanation: The renal limb stated as a mechanism independent of the parathyroid limb.
- name: Hypocalcemia with Inappropriately Low PTH
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The defining biochemical signature. The pairing matters more than either
    number: hypocalcaemia with a PTH that is merely low-normal is the finding
    that points at the receptor rather than at the gland.
  downstream:
  - target: Neuromuscular Irritability
    causal_link_type: DIRECT
  - target: Ectopic Calcification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic hypocalcaemia with hyperphosphataemia is associated with
      intracranial calcification, but the step from the disturbed
      calcium-phosphate product to deposition at specific sites is not resolved.
  evidence:
  - reference: PMID:31063613
    reference_title: Treatment of Autosomal Dominant Hypocalcemia Type 1 With the Calcilytic
      NPSP795 (SHP635).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individuals are hypocalcemic with inappropriately low parathyroid hormone
      (PTH) secretion and relative hypercalciuria.
    explanation: The three-part biochemical signature stated compactly in a clinical study
      of ADH1 patients.
- name: Renal Calcium Wasting
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Urinary calcium excretion is high relative to a serum calcium that is already
    low. Two independent inputs converge here - the absent PTH signal and the
    tubular receptor - which is why the hypercalciuria of ADH1 exceeds that of
    other hypoparathyroidisms and why it is hard to treat.
  downstream:
  - target: Ectopic Calcification
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sustained hypercalciuria supersaturates the tubular fluid, giving
      nephrocalcinosis and stones.
  evidence:
  - reference: PMID:33112267
    reference_title: Recombinant human parathyroid hormone (1-84) is effective in CASR-associated
      hypoparathyroidism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The combination of both loss of PTH and gain of CaSR activity provides a dual
      mechanism for hypercalciuria in ADH1
    explanation: Names the convergence of the two upstream limbs on this node, which is
      the reason this entry models them separately.
- name: Hyperphosphatemia
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Raised serum phosphate, the expected consequence of withdrawing a phosphaturic
    hormone.
- name: Neuromuscular Irritability
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Reduced ionised calcium lowers the threshold for nerve and muscle
    depolarisation, giving paraesthesiae, carpopedal spasm, tetany and seizures.
    The severity tracks how quickly calcium falls as much as how low it is, which
    is part of why some carriers of the same variant are asymptomatic.
- name: Ectopic Calcification
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Deposition of calcium salts outside bone - in the renal medulla as
    nephrocalcinosis and stones, and intracranially in the basal ganglia and
    cerebral cortex. PROVISIONAL because the renal and intracranial deposits do
    not share a single established mechanism: the renal deposits follow directly
    from supersaturated tubular fluid, while the intracranial ones accompany
    chronic hypocalcaemia and hyperphosphataemia without a resolved pathway, and
    conventional treatment contributes to the renal component.
  evidence:
  - reference: PMID:33112267
    reference_title: Recombinant human parathyroid hormone (1-84) is effective in CASR-associated
      hypoparathyroidism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: As a result, nephrocalcinosis and nephrolithiasis are more common in subjects
      with ADH1 than other forms of hypoparathyroidism
    explanation: Ties the renal deposits specifically to ADH1's extra renal limb rather
      than to hypoparathyroidism in general.

animal_models:
- name: Nemf R86S mouse
  species: Mouse
  genotype: Nemf R86S homozygous (ENU-induced missense)
  description: >-
    An ENU-derived homozygous missense allele in the NFACT-N domain, near the
    conserved catalytic residues required for C-terminal tailing. The most
    severe of the two missense models, with a waddling gait from two weeks and
    a median lifespan of 20 days.
  publication: PMID:32934225
  modeled_mechanisms:
  - target: Motor Axon Degeneration with Neuromuscular Junction Denervation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces neuromuscular junction denervation and loss of myelinated
      motor axons, distally before proximally.
    limitations: >-
      The allele is a hypomorphic missense substitution rather than one of the
      truncating variants that cause most human cases, and the mice die within
      three weeks, so the model cannot speak to the chronic course or to the
      intellectual disability and speech delay that define the human disorder.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The model is informative for the axonal arm only. Neither the
        intellectual disability nor the speech delay that name the human
        disease has any counterpart measured in this mouse.

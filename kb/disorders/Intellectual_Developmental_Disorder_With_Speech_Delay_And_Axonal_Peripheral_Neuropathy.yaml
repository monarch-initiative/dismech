animal_models:
- name: Nemf R86S mouse
  species: Mouse
  genotype: Nemf R86S homozygous (ENU-induced missense)
  description: >-
    An ENU-derived homozygous missense allele in the NFACT-N domain, near the
    conserved catalytic residues required for C-terminal tailing. The most
    severe of the two missense models, with a waddling gait from two weeks and
    a median lifespan of 20 days.
  publication: PMID:32934225
  modeled_mechanisms:
  - target: Motor Axon Degeneration with Neuromuscular Junction Denervation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces neuromuscular junction denervation and loss of myelinated
      motor axons, distally before proximally.
    limitations: >-
      The allele is a hypomorphic missense substitution rather than one of the
      truncating variants that cause most human cases, and the mice die within
      three weeks, so the model cannot speak to the chronic course or to the
      intellectual disability and speech delay that define the human disorder.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The model is informative for the axonal arm only. Neither the
        intellectual disability nor the speech delay that name the human
        disease has any counterpart measured in this mouse.
    readouts:
    - name: Myelinated axon number in femoral nerve motor branch
      target: Motor Axon Degeneration with Neuromuscular Junction Denervation
      direction: DECREASED
      interpretation: Structural correlate of distal motor axon loss.
      evidence:
      - reference: PMID:32934225
        reference_title: "NEMF mutations that impair ribosome-associated quality control are associated with neuromuscular disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, by 16–18 days, R86S mice began to exhibit femoral motor myelinated axon loss (Supplementary Fig. 4a, b), which by late end-stage (8 weeks of age) was further reduced (~30%) (Fig. 2j, l, o) with a shift in axon diameter distribution indicative of the largest fibers being most impacted (Supplementary Fig. 4c)."
        explanation: Quantified motor axon loss with large-fibre predominance.
    evidence:
    - reference: PMID:32934225
      reference_title: "NEMF mutations that impair ribosome-associated quality control are associated with neuromuscular disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "revealing denervation and fragmentation of postsynaptic terminals in 8-week-old R86S mice"
      explanation: Supports treating this model as informative for the denervation node.
- name: Nemf R487G mouse
  species: Mouse
  genotype: Nemf R487G homozygous (ENU-induced missense)
  description: >-
    A second ENU missense allele, in the coil motif that assists A-site tRNA
    recruitment. Milder and slower than R86S: abnormal gait and hindlimb
    wasting from ten weeks, with survival beyond two years, and continuing
    proximal axon loss between 8 and 55 weeks.
  publication: PMID:32934225
  modeled_mechanisms:
  - target: Motor Axon Degeneration with Neuromuscular Junction Denervation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Progressive, adult-onset denervation and axon loss, closer in tempo to
      the human course than R86S but affecting the motor system selectively.
    limitations: >-
      Sensory axon loss was not detected in this allele, so it does not model
      the sensorimotor neuropathy patients have, and it carries no measured
      cognitive or speech phenotype.
    evidence:
    - reference: PMID:32934225
      reference_title: "NEMF mutations that impair ribosome-associated quality control are associated with neuromuscular disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nonetheless, NMJ occupancy was already decreased in R487G compared to wild-type mice at 8 weeks and denervation continued to progress with age (Fig. 2d–f)."
      explanation: Progressive denervation in the milder allele.
- name: Nemf D106 frameshift null mouse
  species: Mouse
  genotype: Nemf 296_297insT frameshift, homozygous null
  description: >-
    A CRISPR-derived frameshift allele producing no detectable full-length
    NEMF. More severe than either missense allele, with pre-weaning lethality
    by postnatal day 11, establishing that the missense alleles are hypomorphs.
  publication: PMID:32934225
  modeled_mechanisms:
  - target: Motor Axon Degeneration with Neuromuscular Junction Denervation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Complete loss of NEMF produces the same neuromuscular pathology, earlier
      and more severely, and extends it to the phrenic nerve. It is
      PARTIALLY_RECAPITULATES rather than RECAPITULATES because the genotype
      and the course both diverge from the human disease, as the divergences
      below record.
    limitations: >-
      Mice die before weaning, so the model has no developmental or cognitive
      readout and cannot represent a disorder whose patients reach adulthood.
      It is evidence about the allelic series rather than about the clinical
      phenotype.
    readouts:
    - name: Oxygen saturation and phrenic nerve integrity at end of life
      target: Motor Axon Degeneration with Neuromuscular Junction Denervation
      direction: DECREASED
      interpretation: >-
        Phrenic nerve degeneration is motor axon degeneration in the nerve that
        drives the diaphragm, so the respiratory failure is a readout of this
        node rather than a separate organ phenotype. One individual in the human
        cohort is tabulated with respiratory distress, but no prose in the
        source describes it, so no human phenotype is bound from it.
      evidence:
      - reference: PMID:32934225
        reference_title: "NEMF mutations that impair ribosome-associated quality control are associated with neuromuscular disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In addition, D106* mice display a respiratory distress phenotype at end-of-life, evident by decreased oxygen saturation (Supplementary Fig. 8j) and phrenic nerve degeneration (Supplementary Fig. 8k–m)."
        explanation: >-
          The two measurements behind this readout, oxygen saturation and
          phrenic nerve histology.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: INVALIDATING
      description: >-
        The quantity the model sets to zero is residual NEMF protein: no
        full-length NEMF is detectable in these mice. The corresponding human
        quantity is not zero but unmeasured. The oldest reported patient, aged
        28, carries a homozygous frameshift late in the coding sequence whose
        protein consequence was never assayed, so a complete protein null
        stands in for a genotype that may retain partial function.
    - divergence_type: TEMPORAL_SCOPE
      materiality: INVALIDATING
      description: >-
        The model's whole course is pre-weaning: death by postnatal day 11,
        against human survival into the third decade. Every measurement in it
        is therefore taken from an animal that never reached the developmental
        stage at which the human disorder is diagnosed.
    evidence:
    - reference: PMID:32934225
      reference_title: "NEMF mutations that impair ribosome-associated quality control are associated with neuromuscular disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "D106* mice exhibited a marked reduction in occupied NMJs in the MG at end-of-life (Supplementary Fig. 8c–e) along with a reduction in peripheral myelinated axons (Fig. 3e, Supplementary Fig. 8f–i)."
      explanation: Denervation and axon loss in the null allele.

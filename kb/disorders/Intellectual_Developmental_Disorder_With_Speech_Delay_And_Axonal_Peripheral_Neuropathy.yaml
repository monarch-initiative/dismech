name: Intellectual Developmental Disorder With Speech Delay And Axonal Peripheral Neuropathy
creation_date: "2026-11-01T00:00:00Z"
category: Mendelian
synonyms:
- IDDSAPN
- NEMF-related neurodevelopmental disorder with axonal neuropathy
description: >-
  Intellectual developmental disorder with speech delay and axonal peripheral
  neuropathy (IDDSAPN) is an autosomal recessive disorder caused by biallelic
  loss-of-function variants in NEMF, which encodes the nuclear export mediator
  factor. NEMF is the substrate-recognition component of ribosome-associated
  quality control (RQC), the pathway that disposes of incomplete nascent
  polypeptides left attached to tRNA in the 60S subunit after a ribosome
  stalls. NEMF holds the LTN1/Listerin E3 ligase on the obstructed subunit so
  the nascent chain is ubiquitylated, and independently elongates that chain
  with untemplated C-terminal tails, which both expose buried lysines to LTN1
  and act as degrons in their own right. Losing that surveillance leaves
  aberrant translation products to accumulate in neurons. Affected individuals
  have global developmental delay and intellectual disability with
  disproportionately severe speech delay, together with a length-dependent
  axonal sensorimotor polyneuropathy that produces distal weakness, distal
  amyotrophy, foot drop and foot deformity. Ataxia, hypotonia and
  kyphoscoliosis are common, and a minority have cerebral or cerebellar
  atrophy on imaging. The disorder is the first human disease attributed to a
  primary defect in RQC, so the pathway rather than any single downstream
  substrate is what the entry's mechanism turns on.
disease_term:
  preferred_term: intellectual developmental disorder with speech delay and axonal peripheral neuropathy
  term:

  notes: >-
    Reported disease alleles are predominantly biallelic loss-of-function
    nonsense, frameshift and canonical splice variants; missense variants at
    conserved residues also occur. One individual with a single de novo
    missense variant and a milder, later-onset neuropathy raises the
    possibility of a dominant-negative mechanism, which the authors state as a
    possibility rather than an established one and which no second report has
    confirmed.

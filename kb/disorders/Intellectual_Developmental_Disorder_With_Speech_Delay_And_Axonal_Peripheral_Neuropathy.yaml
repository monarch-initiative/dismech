    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sensory nerve action potentials could be recorded normally in bilateral medial and ulnar nerves, but was absent in bilateral sural nerves."
    explanation: >-
      The length-dependent sensory pattern that nerve conduction study
      contributes to the diagnosis.

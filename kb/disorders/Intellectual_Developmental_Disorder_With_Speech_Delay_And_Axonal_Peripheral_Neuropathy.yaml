differential_diagnoses:
- name: Spinal muscular atrophy
  description: >-
    The first consideration in an infant with floppiness, delayed motor
    milestones and reduced reflexes. It was the initial suspicion in the
    reported infant, and is excluded by SMN testing.
  distinguishing_features:
  - >-
    SMN1 deletion and sequence testing is negative in IDDSAPN, and creatine
    kinase is normal
  - >-
    Nerve conduction in IDDSAPN loses the sural sensory potentials, so the
    neuropathy is sensorimotor rather than purely motor
  evidence:
  - reference: PMID:38819420
    reference_title: "Intellectual Developmental Disorder with Speech Delay and Axonal Peripheral Neuropathy (IDDSAPN): A Mixed Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, serum creatinine phosphokinase was normal and the SMN gene deletion analysis/SMN gene sequencing was normal."
    explanation: >-
      Spinal muscular atrophy was tested for and excluded in the reported
      infant before exome sequencing was undertaken, and supports the first
      distinguishing feature.
  - reference: PMID:38819420
    reference_title: "Intellectual Developmental Disorder with Speech Delay and Axonal Peripheral Neuropathy (IDDSAPN): A Mixed Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sensory nerve action potentials could be recorded normally in bilateral medial and ulnar nerves, but was absent in bilateral sural nerves."
    explanation: >-
      Sural sensory loss in IDDSAPN, which is the second distinguishing
      feature. No claim is made here about spinal muscular atrophy's own
      electrophysiology, which these sources do not report.
- name: TECPR2-related hereditary sensory and autonomic neuropathy with intellectual disability
  description: >-
    One of the recessive disorders that, like IDDSAPN, combines impaired
    intellectual development with a peripheral neuropathy, and so is
    indistinguishable on the presenting picture alone.
  distinguishing_features:
  - Separated by the causal gene on sequencing
  - >-
    Named in the treating clinicians' own differential for coexisting
    developmental delay and peripheral neuropathy, so it is not separable on
    the presenting picture alone
  evidence:
  - reference: PMID:38819420
    reference_title: "Intellectual Developmental Disorder with Speech Delay and Axonal Peripheral Neuropathy (IDDSAPN): A Mixed Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we suspected mixed phenotype-like disorders with peripheral neuropathy and coexisting developmental delay (e.g., IDDSAPN, TECPR2-related hereditary sensory and autonomic neuropathy with ID, and MCM3AP-related peripheral neuropathy, autosomal recessive, with or without impaired intellectual development)"
    explanation: >-
      Named by the treating clinicians as part of the differential they worked
      through for exactly this presentation.
- name: MCM3AP-related peripheral neuropathy
  description: >-
    A recessive peripheral neuropathy with or without impaired intellectual
    development, considered in the same differential as IDDSAPN.
  distinguishing_features:
  - Separated by the causal gene on sequencing
  - >-
    Impaired intellectual development is optional in MCM3AP-related disease,
    where severe speech delay is close to constant in IDDSAPN
  evidence:
  - reference: PMID:38819420
    reference_title: "Intellectual Developmental Disorder with Speech Delay and Axonal Peripheral Neuropathy (IDDSAPN): A Mixed Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we suspected mixed phenotype-like disorders with peripheral neuropathy and coexisting developmental delay (e.g., IDDSAPN, TECPR2-related hereditary sensory and autonomic neuropathy with ID, and MCM3AP-related peripheral neuropathy, autosomal recessive, with or without impaired intellectual development)"
    explanation: >-
      Named in the same clinical differential as a recessive neuropathy with
      optional intellectual involvement.
discussions:
- discussion_id: nemf_ubiquitylation_versus_tailing_arm
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is human disease caused by loss of NEMF-dependent ubiquitylation of stalled
    nascent chains, by loss of its untemplated C-terminal tailing activity, or
    by both?
  rationale: >-
    NEMF has two separable degradative roles, and the two make different
    predictions about which substrates accumulate and which other pathway
    components could compensate. The yeast experiments that tie disease
    severity to tailing were done with substitutions equivalent to the mouse
    missense alleles, not with the truncating variants that cause most human
    cases, and a truncating allele removes both activities at once. So the
    allele class that is most common in patients is the one that cannot
    distinguish the two mechanisms.
  attaches_to:
  - pathophysiology#Ribosome-Associated Quality Control Failure
- discussion_id: nemf_mouse_lethality_versus_human_survival
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why do mice lacking NEMF die with motor neuron disease in infancy while
    people with biallelic loss-of-function variants survive to adulthood with
    intellectual disability and a slowly progressive neuropathy?
  rationale: >-
    The mismatch runs in both directions and is not a matter of severity
    alone. The mouse null dies by postnatal day 11 and the severe missense
    allele by about 20 days, whereas reported patients include individuals in
    their twenties; and the features that name the human disorder, the
    intellectual disability and the speech delay, have no counterpart measured
    in any of the three mouse models, which were characterised as neuromuscular
    degeneration models. Conversely the mouse work supplies the only
    mechanistic account of the axonal arm. Reading across therefore supports
    the neuropathy and says nothing about the cognitive phenotype, which is
    the part the single cellular model addresses instead.
  attaches_to:
  - pathophysiology#Motor Axon Degeneration with Neuromuscular Junction Denervation
  - pathophysiology#Impaired Axonal Outgrowth and Synapse Development

    label: intellectual developmental disorder with speech delay and axonal peripheral neuropathy
parents:
- Neurodevelopmental Disorder
- hereditary disease
notes: >-
  MONDO cross-references this disease as OMIM 619099 and carries IDDSAPN as an
  exact (abbreviation) synonym; it records NEMF as the causal gene and no
  descendant terms, so the entry is curated at the leaf. No GeneReviews
  chapter exists: the committed Bookshelf index (cache/bookshelf, snapshot
  2026-09-10) has no NEMF or IDDSAPN chapter, and a live PubMed search for
  `NEMF[gene] AND genereviews[book]` returned zero records. The phenotype
  baseline therefore rests on the two defining cohorts and one later case
  report. Reported case counts differ by source because they count different
  things: Martin et al. describe nine individuals from seven families, Ahmed
  et al. five further families, and the 2024 case report tabulates 26
  individuals from 14 kindreds across three publications including its own
  patient. Several features reported in single individuals, including preaxial
  polydactyly, thumb abduction anomalies, valgus knee position and squint, are
  recorded in that report as present only in a few cases and are not bound as
  phenotypes here. Brain atrophy, pectus excavatum, kyphoscoliosis and spastic
  paraplegia are deliberately left causally unconnected: the sources report
  them as findings without stating what produces them, and the mechanism
  linking RQC failure to a skeletal or imaging finding is not established.
  Two features are reported only inside the Martin et al. Table 1 grid and are
  deliberately not bound as phenotypes: tremor, marked present in 2 of 9
  individuals with 1 not ascertained, and respiratory distress, marked present
  in 1 of 9. Nothing in the running text of any cached source names either
  finding in a NEMF patient, and the table's own row cannot carry the claim,
  because snippet normalization reduces non-word characters to spaces and so
  strips exactly the plus and minus marks that hold the information: the tremor
  row normalizes to the three words "tremor n a". A quote that verifies while
  asserting nothing is a worse defect than an absent binding, so the findings
  are recorded here instead. The mouse respiratory phenotype, which does have
  running-text support, is kept as a readout on the Nemf D106 null model, where
  phrenic nerve degeneration is motor axon degeneration rather than a separate
  organ phenotype.
prevalence:
- population: Published cases worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence or carrier-frequency estimate has been published. The only
    occurrence figure available is a count of reported cases, pooled across the
    two defining cohorts and one later case report. Reported kindreds are
    Turkish, Iranian, Saudi, Indian, European and US, with no founder variant
    described.
  evidence:
  - reference: PMID:38819420
    reference_title: "Intellectual Developmental Disorder with Speech Delay and Axonal Peripheral Neuropathy (IDDSAPN): A Mixed Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Including the current reported case, a total of 26 cases of IDDSAPN from 14 kindreds have been reported to date in three different reports."
    explanation: >-
      The pooled published case count, which is the only occurrence measure the
      literature supports for this disorder.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic loss-of-function variants cause the disorder, and heterozygous
    carriers are unaffected. One reported individual carried only a single de
    novo missense variant and had a milder, later-onset phenotype, which the
    authors raise as possible dominant-negative action rather than established
    dominant inheritance.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:33048237
    reference_title: "Biallelic loss-of-function variants in NEMF cause central nervous system impairment and axonal polyneuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study demonstrates that disease-causing biallelic NEMF variants result in central nervous system impairment and other variable features."
    explanation: Establishes a biallelic, recessive mechanism across five families.
  - reference: PMID:32934225
    reference_title: "NEMF mutations that impair ribosome-associated quality control are associated with neuromuscular disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous mice exhibited no axonal degeneration, even past 2 years of age; thus, both alleles appear to behave in a purely recessive manner"
    explanation: >-
      Carrier mice are unaffected into old age, supporting recessive
      loss-of-function rather than a dominant effect of one mutant allele.
  - reference: "CGGV:assertion_67f2bf82-cc3e-4006-a8e6-3f6f1dcb2513-2023-10-04T160000.000Z"
    reference_title: "NEMF / intellectual developmental disorder with speech delay and axonal peripheral neuropathy (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is reported to be biallelic loss of function."
    explanation: ClinGen records biallelic loss of function as the disease mechanism.
pathophysiology:
- name: NEMF Biallelic Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Reported disease alleles are overwhelmingly nonsense, frameshift and
    canonical splice-site variants distributed across NEMF, carried homozygously
    in consanguineous families or as compound heterozygotes. Missense variants
    at conserved residues also occur. The mouse alleles that reproduce the
    phenotype show the same dose relationship: missense alleles behave as
    hypomorphs, and a frameshift null allele is more severe than either.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: NEMF
    term:
      id: hgnc:10663
      label: NEMF
  molecular_functions:
  - preferred_term: tRNA binding by NEMF, which supplies the alanyl-tRNA used for C-terminal tailing
    modifier: DECREASED
    term:
      id: GO:0000049
      label: tRNA binding
  - preferred_term: binding of the obstructed large ribosomal subunit by NEMF
    modifier: DECREASED
    term:
      id: GO:0043022
      label: ribosome binding
  evidence:
  - reference: PMID:35452614
    reference_title: "Ribosome-associated quality-control mechanisms from bacteria to humans."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Central players in RQC are the human ribosome- and tRNA-binding protein, NEMF, and its orthologs, yeast Rqc2 and bacterial RqcH, which sense large ribosomal subunits obstructed with nascent chains and then promote nascent-chain proteolysis."
    explanation: >-
      Names both activities the protein loses, which is what the two molecular
      function bindings on this node record: NEMF binds the obstructed large
      subunit and binds tRNA.
  - reference: PMID:33909987
    reference_title: "Convergence of mammalian RQC and C-end rule proteolytic pathways via alanine tailing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that mammalian NEMF has an additional, Listerin-independent proteolytic role, which, as in bacteria, is mediated by tRNA-Ala binding and Ala tailing."
    explanation: >-
      Ties the tRNA-binding activity specifically to alanyl-tRNA in mammalian
      cells, which is the substrate the tailing reaction consumes.
  - reference: PMID:33048237
    reference_title: "Biallelic loss-of-function variants in NEMF cause central nervous system impairment and axonal polyneuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The large consanguineous family confirms the phenotype-causative relationship with homozygous frameshift variant (NM_004713.6:c.2618del) as revealed by ES."
    explanation: Homozygous frameshift variant segregating in the index family.
  - reference: PMID:33048237
    reference_title: "Biallelic loss-of-function variants in NEMF cause central nervous system impairment and axonal polyneuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Linkage analysis of the family showed a significant single-point LOD of 4.5 locus."
    explanation: Formal linkage evidence for the locus in the index family.
  downstream:
  - target: Ribosome-Associated Quality Control Failure
    causal_link_type: DIRECT
    description: >-
      Loss of NEMF removes the factor that recognises the stalled
      nascent-chain-tRNA/60S intermediate, so the quality-control pathway
      cannot be initiated.
    evidence:
    - reference: PMID:35452614
      reference_title: "Ribosome-associated quality-control mechanisms from bacteria to humans."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Central players in RQC are the human ribosome- and tRNA-binding protein, NEMF, and its orthologs, yeast Rqc2 and bacterial RqcH, which sense large ribosomal subunits obstructed with nascent chains and then promote nascent-chain proteolysis."
      explanation: >-
        Identifies NEMF as the sensing component whose loss disables the
        pathway, in a review synthesising the field rather than reporting new
        data.
- name: Ribosome-Associated Quality Control Failure
  biological_scale: MOLECULAR
  description: >-
    NEMF performs two separable jobs on the obstructed 60S subunit. It
    stabilises LTN1/Listerin binding so the nascent chain is ubiquitylated,
    and it catalyses untemplated C-terminal tailing, which exposes
    ribosome-buried lysines to LTN1 and also creates a C-terminal degron read
    by CRL2-KLHDC10 and Pirh2 independently of Listerin. Disease-associated
    missense substitutions tested in the yeast ortholog selectively impair the
    tailing activity, and the severity of that biochemical defect tracks the
    severity of the corresponding mouse allele.
  biological_processes:
  - preferred_term: ribosome-associated ubiquitin-dependent degradation of stalled nascent chains
    modifier: DECREASED
    term:
      id: GO:1990116
      label: ribosome-associated ubiquitin-dependent protein catabolic process
  - preferred_term: untemplated C-terminal alanine and threonine tailing of nascent chains
    modifier: DECREASED
    term:
      id: GO:0140708
      label: CAT tailing
  evidence:
  - reference: PMID:35452614
    reference_title: "Ribosome-associated quality-control mechanisms from bacteria to humans."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In canonical eukaryotic RQC, NEMF stabilizes the LTN1/Listerin E3 ligase binding to obstructed ribosomal subunits for nascent-chain ubiquitylation."
    explanation: The ubiquitylation-targeting arm of NEMF function that is lost.
  - reference: PMID:33909987
    reference_title: "Convergence of mammalian RQC and C-end rule proteolytic pathways via alanine tailing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that mammalian NEMF has an additional, Listerin-independent proteolytic role, which, as in bacteria, is mediated by tRNA-Ala binding and Ala tailing."
    explanation: >-
      Establishes in mammalian cells that NEMF has a second, tailing-dependent
      degradative arm, so its loss removes two routes rather than one.
  - reference: PMID:32934225
    reference_title: "NEMF mutations that impair ribosome-associated quality control are associated with neuromuscular disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the Rqc2 R88S substitution caused a stronger defect in CAT tail formation in comparison to the K534G; this finding shows a striking correlation with the phenotypic severity of the respective mouse alleles"
    explanation: >-
      Reporter assays in cultured yeast carrying the disease-equivalent
      substitutions tie the degree of tailing failure to phenotype severity,
      which is the evidence that tailing loss is the operative defect.
  downstream:
  - target: Accumulation of Aberrant Nascent Polypeptide Chains
    causal_link_type: DIRECT
    description: >-
      With neither ubiquitylation nor tail-mediated proteolysis available, the
      incomplete chains the pathway exists to clear are left in the cell.
    evidence:
    - reference: PMID:33909987
      reference_title: "Convergence of mammalian RQC and C-end rule proteolytic pathways via alanine tailing."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Incompletely synthesized nascent chains obstructing large ribosomal subunits are targeted for degradation by ribosome-associated quality control (RQC)."
      explanation: >-
        States the pathway's substrate and purpose, so disabling it leaves
        that substrate undegraded. Framing sentence rather than this paper's
        own result.
- name: Accumulation of Aberrant Nascent Polypeptide Chains
  biological_scale: MOLECULAR
  description: >-
    Incomplete polypeptides are potentially toxic, and stalling additionally
    sequesters ribosomal subunits away from the translation-competent pool, so
    the consequence is both a proteotoxic burden and a drain on translational
    capacity. Neurons appear particularly exposed: NEMF is expressed more
    strongly in excitatory than inhibitory cortical neurons and most strongly
    in developing excitatory neurons. In Nemf-mutant mice the downstream
    cellular phenotype includes cytoplasmic mislocalisation and aggregation of
    proteins also implicated in adult neurodegeneration, alongside an
    Importin-beta-specific nuclear import block.
  evidence:
  - reference: PMID:32934225
    reference_title: "NEMF mutations that impair ribosome-associated quality control are associated with neuromuscular disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Ribosome stalling is a critical problem, as it sequesters ribosomal subunits from the translation-competent pool and, in addition, gives rise to aberrant (incomplete) nascent polypeptide chains that are potentially toxic."
    explanation: >-
      States the two harms that follow from unresolved stalling. Taken from
      the paper's introduction, where it restates established pathway biology.
  - reference: PMID:38819420
    reference_title: "Intellectual Developmental Disorder with Speech Delay and Axonal Peripheral Neuropathy (IDDSAPN): A Mixed Phenotype."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Expression of NEMF gene is relatively different between excitatory and inhibitory neurons of the cerebral cortex, with enriched expression in excitatory neurons and weaker expression in the other."
    explanation: >-
      Offers a reason the burden falls on particular neurons, cited by this
      case report from the earlier cohort rather than measured in it.
  - reference: PMID:39312574
    reference_title: "NEMF mutations in mice illustrate how Importin-β specific nuclear transport defects recapitulate neurodegenerative disease hallmarks."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we observe cytoplasmic mis-localization and aggregation of multiple proteins implicated in the pathogenesis of ALS/FTD and AD/ADRD, including TDP43, Importin-β, RanGap1, and Ran."
    explanation: >-
      The protein mislocalisation and aggregation this node's description
      reports, measured in the two missense mouse models. Whether it is
      downstream of the quality-control defect or a separate NEMF function is
      unresolved, so it is cited as an accompanying finding rather than as a
      step in the chain.
  downstream:
  - target: Impaired Axonal Outgrowth and Synapse Development
    causal_link_type: DIRECT
    description: >-
      Nemf knockdown in cultured cortical neurons impairs axon outgrowth and
      synapse formation, placing the developmental arm of the phenotype
      directly downstream of lost surveillance.
    evidence:
    - reference: PMID:33048237
      reference_title: "Biallelic loss-of-function variants in NEMF cause central nervous system impairment and axonal polyneuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We further revealed that knockdown (KD) of Nemf leads to impairment of axonal outgrowth and synapse development in cultured mouse primary cortical neurons."
      explanation: Direct experimental link from NEMF loss to the two developmental processes.
  - target: Motor Axon Degeneration with Neuromuscular Junction Denervation
    causal_link_type: DIRECT
    description: >-
      In three independent mouse models of NEMF deficiency the nervous system
      degenerates progressively, with distal axons lost before proximal ones.
    evidence:
    - reference: PMID:32934225
      reference_title: "NEMF mutations that impair ribosome-associated quality control are associated with neuromuscular disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we show that three independently-generated mouse models with mutations in a different component of the RQC complex, NEMF/Rqc2, develop progressive motor neuron degeneration."
      explanation: Three independent models converge on progressive degeneration.
- name: Impaired Axonal Outgrowth and Synapse Development
  biological_scale: CELLULAR
  description: >-
    Reduced NEMF in cultured cortical neurons shortens axons and reduces
    synapse formation. This is the arm of the mechanism that accounts for the
    central features, and it is a developmental failure rather than a
    degenerative one, consistent with delay and intellectual disability being
    present from infancy.
  biological_processes:
  - preferred_term: axon outgrowth in cortical neurons
    modifier: DECREASED
    term:
      id: GO:0007409
      label: axonogenesis
  - preferred_term: synapse formation in cortical neurons
    modifier: DECREASED
    term:
      id: GO:0007416
      label: synapse assembly
  cell_types:
  - preferred_term: cortical excitatory neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  evidence:
  - reference: PMID:33048237
    reference_title: "Biallelic loss-of-function variants in NEMF cause central nervous system impairment and axonal polyneuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We further revealed that knockdown (KD) of Nemf leads to impairment of axonal outgrowth and synapse development in cultured mouse primary cortical neurons."
    explanation: The measurement behind both annotated processes.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Delayed speech and language development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Motor delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Ataxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Dysarthria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Motor Axon Degeneration with Neuromuscular Junction Denervation
  biological_scale: TISSUE
  description: >-
    Mouse models lose neuromuscular junction occupancy and myelinated motor
    axons, with the largest-calibre fibres affected first and distal loss
    preceding loss at the lumbar ventral root. The authors read this as
    dying-back degeneration originating distally, which is the pattern a
    length-dependent axonal polyneuropathy takes in patients. Sensory axons
    are also reduced in the more severe allele, matching the sensorimotor
    rather than purely motor neuropathy recorded clinically.
  biological_processes:
  - preferred_term: maintenance of neuromuscular junction innervation
    modifier: DECREASED
    term:
      id: GO:0007528
      label: neuromuscular junction development
  cell_types:
  - preferred_term: lower motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  evidence:
  - reference: PMID:32934225
    reference_title: "NEMF mutations that impair ribosome-associated quality control are associated with neuromuscular disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "revealing denervation and fragmentation of postsynaptic terminals in 8-week-old R86S mice"
    explanation: Neuromuscular junction denervation in the severe missense model.
  - reference: PMID:32934225
    reference_title: "NEMF mutations that impair ribosome-associated quality control are associated with neuromuscular disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results suggest a neuronal dying-back mechanism, wherein the disease originates distally."
    explanation: >-
      Distal-before-proximal axon loss, the pattern underlying a
      length-dependent neuropathy.
  downstream:
  - target: Peripheral axonal neuropathy
    causal_link_type: DIRECT
    description: >-
      Loss of distal motor and sensory axons is what the nerve conduction
      abnormality measures.
    evidence:
    - reference: PMID:32934225
      reference_title: "NEMF mutations that impair ribosome-associated quality control are associated with neuromuscular disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, the more severe R86S allele may also cause a sensorimotor neuropathy, similar to Ltn1 mutant mice15."
      explanation: >-
        Sensory as well as motor axon loss in the severe allele, matching the
        sensorimotor neuropathy seen in patients.
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

discussions:
- discussion_id: nemf_ubiquitylation_versus_tailing_arm
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is human disease caused by loss of NEMF-dependent ubiquitylation of stalled
    nascent chains, by loss of its untemplated C-terminal tailing activity, or
    by both?
  rationale: >-
    NEMF has two separable degradative roles, and the two make different
    predictions about which substrates accumulate and which other pathway
    components could compensate. The yeast experiments that tie disease
    severity to tailing were done with substitutions equivalent to the mouse
    missense alleles, not with the truncating variants that cause most human
    cases, and a truncating allele removes both activities at once. So the
    allele class that is most common in patients is the one that cannot
    distinguish the two mechanisms.
  attaches_to:
  - pathophysiology#Ribosome-Associated Quality Control Failure
- discussion_id: nemf_mouse_lethality_versus_human_survival
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why do mice lacking NEMF die with motor neuron disease in infancy while
    people with biallelic loss-of-function variants survive to adulthood with
    intellectual disability and a slowly progressive neuropathy?
  rationale: >-
    The mismatch runs in both directions and is not a matter of severity
    alone. The mouse null dies by postnatal day 11 and the severe missense
    allele by about 20 days, whereas reported patients include individuals in
    their twenties; and the features that name the human disorder, the
    intellectual disability and the speech delay, have no counterpart measured
    in any of the three mouse models, which were characterised as neuromuscular
    degeneration models. Conversely the mouse work supplies the only
    mechanistic account of the axonal arm. Reading across therefore supports
    the neuropathy and says nothing about the cognitive phenotype, which is
    the part the single cellular model addresses instead.
  attaches_to:
  - pathophysiology#Motor Axon Degeneration with Neuromuscular Junction Denervation
  - pathophysiology#Impaired Axonal Outgrowth and Synapse Development

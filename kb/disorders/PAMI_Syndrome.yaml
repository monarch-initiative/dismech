    heterodimer MRP8/14 (calprotectin, S100A8/S100A9) without restraint. Serum
    MRP8/14 is roughly 20 times higher than in PAPA syndrome and far above levels
    in familial Mediterranean fever or systemic juvenile idiopathic arthritis; the
    circulating protein has normal S100A8 and S100A9 subunits. Lesional skin shows
    strong epidermal MRP8 and MRP14 expression.

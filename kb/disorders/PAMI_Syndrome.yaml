name: PAMI Syndrome
creation_date: "2026-10-13T10:00:00Z"
description: >-
  PSTPIP1-associated myeloid-related proteinemia inflammatory (PAMI) syndrome,
  originally described as hyperzincemia with functional zinc depletion and later
  as hyperzincemia and hypercalprotectinemia (Hz/Hc), is a rare early-onset
  autoinflammatory disease caused by heterozygous, usually de novo, PSTPIP1
  missense variants that reverse a negative charge in the coiled-coil (y-)domain,
  p.E250K in most patients and p.E257K in a few. The mutant protein binds pyrin
  more strongly than the PAPA-associated variant and is accompanied by
  uncontrolled release of the alarmin calprotectin (MRP8/14, S100A8/S100A9) from
  phagocytes; circulating calprotectin reaches levels far above those of other
  autoinflammatory diseases and carries zinc with it, so plasma zinc is markedly
  raised while unbound zinc and some tissue zinc measures are low. Patients have
  chronic systemic inflammation with anemia and neutropenia in nearly all cases,
  frequent thrombocytopenia, hepatosplenomegaly, lymphadenopathy, cutaneous
  inflammation including pyoderma gangrenosum, arthritis and growth failure.
  PAMI is allelic to PAPA syndrome (see the PAPA_Syndrome entry, caused by
  p.A230T and p.E250Q) but is kept as a separate disease because it has distinct
  causal variants and a distinct phenotype: hyperzincemia, calprotectin levels
  about 20-fold above PAPA, cytopenias, hepatosplenomegaly and failure to thrive
  are features not found in PAPA syndrome. No drug therapy is consistently
  effective and neutropenia persists on treatment; allogeneic hematopoietic stem
  cell transplantation has resolved the disease in a small series.
category: Mendelian
parents:
- Autoinflammatory Disease
- Inherited Disorder
- Disorder of Zinc Metabolism
synonyms:
- hyperzincemia with functional zinc depletion
- hyperzincemia and hypercalprotectinemia
- Hz/Hc syndrome
- PSTPIP1-associated myeloid-related proteinemia inflammatory syndrome
- recurrent infections-inflammatory syndrome due to zinc metabolism disorder syndrome

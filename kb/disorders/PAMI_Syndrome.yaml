inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Heterozygous PSTPIP1 E250K or E257K variants cause the disease; most arise de
    novo, but parent-to-child transmission occurs, with variable expressivity and
    apparent incomplete penetrance within families.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:26025129
    reference_title: "Single amino acid charge switch defines clinically distinct proline-serine-threonine phosphatase-interacting protein 1 (PSTPIP1)-associated inflammatory diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Parental DNA was available from patients P2 to P8, P12, and P13, which confirmed a de novo mutation in 8 patients. Patients P9 (father) and P8 (son) shared the same PSTPIP1 E250K mutation, and both were affected with a variable clinical expression."
    explanation: Heterozygous variants arise de novo in most tested trios and are transmitted father to son in one family, consistent with dominant inheritance with variable expressivity.
  - reference: PMID:33458872
    reference_title: "Rare cases of PAMI syndrome in both father and son with the same missense mutation in PSTPIP1 gene and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report PSTPIP1 mutation in both father and son who have leukopenia and acne-like lesions."
    explanation: A second father-son pair carrying the same heterozygous variant supports vertical (dominant) transmission.
  - reference: PMID:37628706
    reference_title: "PSTPIP1-Associated Myeloid-Related Proteinemia Inflammatory (PAMI) Syndrome: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the reviewed cases, 6 out of 26 involved an inheritance from one of their parents, while 20 cases (76%) were carriers of the de novo variants."
    explanation: Across 26 cases with parental data, most variants were de novo and a minority were inherited from a parent.
prevalence:
- population: Worldwide (published case reports and case series)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based estimate exists. A 2022 systematic literature search
    identified 43 genetically confirmed patients.
  evidence:
  - reference: PMID:37628706
    reference_title: "PSTPIP1-Associated Myeloid-Related Proteinemia Inflammatory (PAMI) Syndrome: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Out of the 43 included patients with PAMI syndrome, there were 24 females and 19 males."
    explanation: The systematic review counts 43 published patients, consistent with an ultra-rare disease.
genetic:
- name: PSTPIP1
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: PSTPIP1
    term:
      id: hgnc:9580
      label: PSTPIP1
  notes: >-
    PAMI-defining variants replace an acidic glutamate with a basic lysine in the
    coiled-coil (y-)domain: c.748G>A p.E250K (most patients) and c.769G>A p.E257K.
    The same codon carries the PAPA-associated p.E250Q, which changes the surface
    charge much less. A further variant, p.N236K, has been reported with a PAMI
    phenotype. No ClinGen gene-disease validity record for this disease was found
    in the reference cache.
  variants:
  - name: PSTPIP1 p.E250K
    description: >-
      Heterozygous c.748G>A missense variant in exon 11 replacing glutamate 250
      with lysine; present in 41 of 43 patients in the systematic review.
    type: missense
    evidence:
    - reference: PMID:26025129
      reference_title: "Single amino acid charge switch defines clinically distinct proline-serine-threonine phosphatase-interacting protein 1 (PSTPIP1)-associated inflammatory diseases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In patients P1 to P13, the heterozygous G>A transition at the c.748 position in exon 11 of the PSTPIP1 gene, leading to the missense p.E250K variant, was found."
      explanation: Identifies p.E250K as the causal variant in 13 of 14 Hz/Hc patients.
    - reference: PMID:37628706
      reference_title: "PSTPIP1-Associated Myeloid-Related Proteinemia Inflammatory (PAMI) Syndrome: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analysis of the PSTPIP1 gene revealed that in a significant majority of cases, 41 out of 43 (95%) exhibited the heterozygous E250K variant."
      explanation: p.E250K accounts for nearly all published cases.
  - name: PSTPIP1 p.E257K
    description: >-
      Heterozygous c.769G>A missense variant in exon 11 replacing glutamate 257
      with lysine; reported in a small number of patients.
    type: missense
    evidence:
    - reference: PMID:26025129
      reference_title: "Single amino acid charge switch defines clinically distinct proline-serine-threonine phosphatase-interacting protein 1 (PSTPIP1)-associated inflammatory diseases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In patient P14 the heterozygous G>A transition at c.769 position, also in exon 11 and leading to the missense p.E257K variant, was found."
      explanation: Identifies p.E257K as the second PAMI-causing charge-reversal variant.
  evidence:
  - reference: PMID:26025129
    reference_title: "Single amino acid charge switch defines clinically distinct proline-serine-threonine phosphatase-interacting protein 1 (PSTPIP1)-associated inflammatory diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirteen patients were heterozygous for a missense mutation in the PSTPIP1 gene, resulting in a p.E250K mutation, and 1 carried a mutation resulting in p.E257K."
    explanation: All 14 sequenced Hz/Hc patients carried a heterozygous PSTPIP1 charge-reversal variant.
  - reference: PMID:26025129
    reference_title: "Single amino acid charge switch defines clinically distinct proline-serine-threonine phosphatase-interacting protein 1 (PSTPIP1)-associated inflammatory diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "their absence in the database of genomic diversity (0% allele frequency for the 2 variants in the 1000 Genomes project), in silico analyses with the algorithms SIFT and Polyphen-2 (deleterious and probably damaging), and family-based cosegregation studies"
    explanation: Population absence, in silico prediction and cosegregation support pathogenicity of both variants.
pathophysiology:
- name: PSTPIP1 Coiled-Coil Charge Reversal
  description: >-
    The E250K and E257K substitutions sit on the convex face of the PSTPIP1 F-BAR
    dimer near the dimer interface and replace acidic glutamate with basic lysine,
    abolishing part of a large negative surface patch proposed to mediate binding
    of pyrin and PEST-family phosphatases. The PAPA-associated E250Q changes this
    patch much less.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: Usually de novo heterozygous missense variants p.E250K or p.E257K; occasionally inherited from an affected parent.
  gene:
    preferred_term: PSTPIP1
    term:
      id: hgnc:9580
      label: PSTPIP1
  molecular_functions:
  - preferred_term: PSTPIP1 binding to the LYP (PEST-family) phosphatase
    modifier: DECREASED
    term:
      id: GO:0019903
      label: protein phosphatase binding
  downstream:
  - target: Loss of PSTPIP1-LYP Phosphatase Binding
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35152348
      reference_title: "PSTPIP1-LYP phosphatase interaction: structural basis and implications for autoinflammatory disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our results showed that mutations R228C, D246N, E250Q, E250K and E257K, in addition to W232A, reduced the interaction with LYP"
      explanation: Binding assays show that both PAMI variants reduce PSTPIP1 binding to the LYP phosphatase.
  - target: Enhanced PSTPIP1-Pyrin Binding
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26025129
      reference_title: "Single amino acid charge switch defines clinically distinct proline-serine-threonine phosphatase-interacting protein 1 (PSTPIP1)-associated inflammatory diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Relative to the E250Q mutant, the E250K mutant exhibits markedly increased binding to pyrin"
      explanation: Coimmunoprecipitation in transfected cells shows that the PAMI variant increases pyrin binding beyond the PAPA variant.
  - target: Myeloid Bone Marrow Dysplasia
    causal_link_type: UNKNOWN
    description: >-
      Whether the cytopenias result from altered PSTPIP1 function in
      hematopoietic cells or from chronic inflammation has not been resolved.
    evidence:
    - reference: PMID:26025129
      reference_title: "Single amino acid charge switch defines clinically distinct proline-serine-threonine phosphatase-interacting protein 1 (PSTPIP1)-associated inflammatory diseases."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is yet unclear whether the hematologic findings are related to chronic inflammation or could be the result of altered PSTPIP1 function."
      explanation: The authors leave open a direct effect of mutant PSTPIP1 on hematopoiesis; the edge is recorded with unknown link type.
  evidence:
  - reference: PMID:26025129
    reference_title: "Single amino acid charge switch defines clinically distinct proline-serine-threonine phosphatase-interacting protein 1 (PSTPIP1)-associated inflammatory diseases."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Both mutants, p.E250K and p.E257K, substantially affect this negative patch of WT PSTPIP1 (Fig 2, E and F), whereas the influence of the PAPA syndrome mutant p.E250Q on the electrostatic potential is much less pronounced (Fig 2, G)."
    explanation: Electrostatic modeling of the PSTPIP1 dimer shows that the PAMI variants, unlike the PAPA variant, remove a negatively charged binding surface.
- name: Loss of PSTPIP1-LYP Phosphatase Binding
  description: >-
    PSTPIP1 residues E250 and E257 contact the PEST-family tyrosine phosphatase
    LYP (PTPN22) directly; the charge-reversal variants reduce this interaction,
    removing phosphatase regulation of PSTPIP1, which is then hyperphosphorylated.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: LYP (PEST-family phosphatase) binding
    modifier: DECREASED
    term:
      id: GO:0019903
      label: protein phosphatase binding
  downstream:
  - target: Enhanced PSTPIP1-Pyrin Binding
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Hyperphosphorylation of PSTPIP1 is the intermediate linking loss of phosphatase binding to increased pyrin binding.
    evidence:
    - reference: PMID:26025129
      reference_title: "Single amino acid charge switch defines clinically distinct proline-serine-threonine phosphatase-interacting protein 1 (PSTPIP1)-associated inflammatory diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Hz/Hc mutations altered protein binding of PSTPIP1, increasing interaction with pyrin through phosphorylation of PSTPIP1."
      explanation: Links altered PSTPIP1 binding and phosphorylation to increased pyrin interaction.
  evidence:
  - reference: PMID:35152348
    reference_title: "PSTPIP1-LYP phosphatase interaction: structural basis and implications for autoinflammatory disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The residues R228, D246, E250, and E257 of PSTPIP1 that are mutated in immunological diseases directly interact with LYP."
    explanation: The crystal structure places both PAMI-mutated residues at the LYP-binding interface.
  - reference: PMID:26025129
    reference_title: "Single amino acid charge switch defines clinically distinct proline-serine-threonine phosphatase-interacting protein 1 (PSTPIP1)-associated inflammatory diseases."

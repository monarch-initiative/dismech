    reference_title: "PSTPIP1-Associated Myeloid-Related Proteinemia Inflammatory (PAMI) Syndrome: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several authors have reported gastrointestinal involvement, with 16% of cases experiencing flare-ups of colitis and/or chronic diarrhea"
    explanation: Colitis or chronic diarrhea in 16% of reviewed patients.
biochemical:
- name: Serum calprotectin (MRP8/14)
  presence: Elevated
  context: >-
    Extremely raised serum MRP8/14 is the screening marker that prompts targeted
    PSTPIP1 testing; levels fall with partial treatment response.
  biomarker_term:
    preferred_term: Calprotectin
    term:
      id: NCIT:C105971
      label: Calprotectin
  evidence:
  - reference: PMID:27464597
    reference_title: "Alarming consequences - autoinflammatory disease spectrum due to mutations in proline-serine-threonine phosphatase-interacting protein 1."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "MRP8/14 serum levels are a hallmark of PAPA and PAMI and can be used as screening tool to initiate targeted genetic testing in suspected cases."
    explanation: Serum MRP8/14 is recommended as the screening test.
  - reference: PMID:26025129
    reference_title: "Single amino acid charge switch defines clinically distinct proline-serine-threonine phosphatase-interacting protein 1 (PSTPIP1)-associated inflammatory diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Partial response to treatment was accompanied in all 4 treated patients by a decrease of IL-8, IL-18, IL-33, IL-6, CCL18, MIF, MRP8/14, and zinc serum concentrations"
    explanation: MRP8/14 and zinc fall with partial treatment response.
- name: Serum interleukin-18
  presence: Elevated
  context: IL-18 is raised in all tested patients and higher than in PAPA syndrome.
  biomarker_term:
    preferred_term: Interleukin-18
    term:
      id: NCIT:C20520
      label: Interleukin-18
  evidence:
  - reference: PMID:37628706
    reference_title: "PSTPIP1-Associated Myeloid-Related Proteinemia Inflammatory (PAMI) Syndrome: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cytokine profiling performed in 15 cases revealed elevated levels of IL-18 in all tested patients (12 out of 12) and high levels of IL-1β in 13 out of 14 cases"
    explanation: IL-18 raised in 12 of 12 tested patients.
diagnosis:
- name: Serum zinc and calprotectin screening
  description: >-
    Measurement of serum zinc and MRP8/14 in patients with early-onset systemic
    inflammation and cytopenia; markedly raised values in all tested patients
    separate PAMI from PAPA syndrome and other autoinflammatory diseases.
  evidence:
  - reference: PMID:37628706
    reference_title: "PSTPIP1-Associated Myeloid-Related Proteinemia Inflammatory (PAMI) Syndrome: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Measuring serum levels of zinc and MRP 8/14 in these patients may facilitate early diagnosis and treatment, potentially improving patients’ quality of life and disease outcome."
    explanation: Recommends serum zinc and MRP8/14 as diagnostic screening tests.
- name: PSTPIP1 genetic testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Heterozygous PSTPIP1 p.E250K or p.E257K.
  evidence:
  - reference: PMID:34047005
    reference_title: "PAMI syndrome: A rare cause that can be easily misdiagnosed."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High-throughput sequencing analysis revealed a de novo heterozygous missense mutation (c.748G > A, p. Glu250Lys) in exon 11 of PSTPIP1 (NM_003978.5) in both patients, which supported a diagnosis of PAMI."
    explanation: Sequencing identified p.E250K and established the diagnosis in two misdiagnosed children.
treatments:
- name: Allogeneic hematopoietic stem cell transplantation
  description: >-
    In five patients transplanted for uncontrolled disease or myelodysplasia, all
    engrafted (one after a second transplant) and all were free of PAMI symptoms
    with donor chimerism at a median of 2.2 years; complications included
    hemophagocytic syndrome with graft rejection and a post-transplant
    inflammatory episode.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Uncontrolled Calprotectin Release from Phagocytes
    description: Replaces the mutant myeloid compartment that releases calprotectin.
  - target: Myeloid Bone Marrow Dysplasia
    description: Replaces the dysplastic hematopoiesis responsible for the cytopenias.
  evidence:
  - reference: PMID:33338535
    reference_title: "HSCT is effective in patients with PSTPIP1-associated myeloid-related proteinemia inflammatory (PAMI) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the last follow-up (median, 2.2 years), all 5 patients have predominantly or complete donor chimerism and adequate immune recovery and are free of any PAMI symptoms."
    explanation: All five transplanted patients became free of PAMI symptoms.
  - reference: PMID:33338535
    reference_title: "HSCT is effective in patients with PSTPIP1-associated myeloid-related proteinemia inflammatory (PAMI) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 5 patients engrafted; however, 1 patient at day +13 developed hemophagocytic syndrome, followed by graft rejection at day +17."
    explanation: Records the serious early complication in one patient.
- name: IL-1 blockade (anakinra, canakinumab)
  description: >-
    Partially effective in about half of treated patients, more often as
    monotherapy than anti-TNF agents; does not correct neutropenia or marrow
    involvement.
  therapeutic_modality: OTHER
  notes: >-
    therapeutic_modality is OTHER because anakinra is a recombinant receptor
    antagonist and canakinumab a monoclonal antibody.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
    - preferred_term: canakinumab
      term:
        id: NCIT:C80971
        label: Canakinumab
  target_mechanisms:
  - target: Pyrin Inflammasome Activation
    description: Blocks IL-1 signaling downstream of inflammasome activation.
  evidence:
  - reference: PMID:26025129
    reference_title: "Single amino acid charge switch defines clinically distinct proline-serine-threonine phosphatase-interacting protein 1 (PSTPIP1)-associated inflammatory diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Best responses were noted when using IL-1 inhibitors, either anakinra (n = 4) or canakinumab (n = 1), but there were a few patients who were unresponsive to this therapy (n = 5)."
    explanation: IL-1 inhibitors gave the best responses in half of treated patients.
  - reference: PMID:37628706
    reference_title: "PSTPIP1-Associated Myeloid-Related Proteinemia Inflammatory (PAMI) Syndrome: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, among the patients who received anti-IL1 therapy, 40% (6/15) showed significant improvement"
    explanation: Significant improvement in 6 of 15 patients on anti-IL-1 therapy.
  - reference: PMID:28628471
    reference_title: "Haematological involvement associated with a mild autoinflammatory phenotype, in two patients carrying the E250K mutation of PSTPIP1."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our case further confirms the lack of efficacy of anakinra on bone marrow involvement."
    explanation: Anakinra controlled inflammation but not marrow involvement.
- name: TNF inhibition
  description: Improves osteoarticular, cutaneous and systemic inflammation in a little over half of treated patients, mostly in combination with steroids or conventional DMARDs.
  therapeutic_modality: OTHER
  notes: >-
    therapeutic_modality is OTHER because the agents span monoclonal antibodies
    (adalimumab, infliximab) and a receptor fusion protein (etanercept).
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: etanercept
      term:
        id: NCIT:C2381
        label: Etanercept
    - preferred_term: infliximab
      term:
        id: NCIT:C1789
        label: Infliximab
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
  target_mechanisms:
  - target: Chronic Systemic Autoinflammation
    description: Reduces TNF-dependent systemic and tissue inflammation.
  evidence:
  - reference: PMID:37628706
    reference_title: "PSTPIP1-Associated Myeloid-Related Proteinemia Inflammatory (PAMI) Syndrome: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the other hand, anti-TNF treatment yielded variable results, with 57% (8/14) of patients showing improvement of osteoarticular and/or cutaneous manifestations and a reduction in biologic inflammation."
    explanation: Improvement in 8 of 14 patients on anti-TNF therapy.

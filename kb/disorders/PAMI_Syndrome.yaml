- name: Enhanced PSTPIP1-Pyrin Binding
  description: >-
    Mutant PSTPIP1 binds pyrin (the MEFV gene product) more strongly than the
    PAPA-associated E250Q protein. The increase is not explained by
    phosphorylation alone, implicating the coiled-coil charge change directly.
  biological_scale: MOLECULAR
  downstream:
  - target: Pyrin Inflammasome Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Release of pyrin from autoinhibition is the proposed, not demonstrated, intermediate.

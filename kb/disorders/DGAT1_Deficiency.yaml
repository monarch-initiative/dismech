diagnosis:
- name: DGAT1 sequencing
  description: >-
    Genetic testing, typically whole-exome sequencing, is the primary diagnostic
    modality. This is not merely convenient but necessary: endoscopy and biopsy
    are usually unremarkable in DGAT1 deficiency, so the biopsy-first pathway
    used for the structural congenital enteropathies does not make the diagnosis.

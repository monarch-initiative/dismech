treatments:
- name: Low-Fat Amino Acid Formula
  description: >-
    The treatment of choice, and a clean demonstration that the disorder is
    fat-load-dependent. A low-fat amino-acid-based formula for special medical
    purposes rapidly relieves diarrhea and vomiting and improves nutritional
    status and growth. The comparison that makes this specific is that neither
    hydrolysed formula nor high-medium-chain-triglyceride formula relieved the
    diarrhea in the same infants - so the benefit comes from lowering the fat
    load presented for absorption, not from altering protein hydrolysis or fatty
    acid chain length. Tolerance for dietary fat improves with age, allowing
    gradual liberalisation.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Failure of Enterocyte Triglyceride Packaging and Substrate Accumulation
    treatment_effect: INHIBITS
    description: >-
      Reducing dietary fat lowers the diacylglycerol and fatty acyl-CoA load
      presented to the enterocyte, limiting the accumulation of unesterified DGAT
      substrates in the mucosa without restoring enzyme activity.
    evidence:
    - reference: PMID:39548446
      reference_title: "A low-fat amino acid diet reverses intestinal failure and shows good growth trends in five infants with diacylglycerol transferase 1 (DGAT1) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Neither hydrolyzed nor high-medium chain triglyceride (MCT) formula
        significantly alleviated diarrheal symptoms; however, a low-fat amino
        acid diet rapidly relieved symptoms and significantly improved
        nutritional status, with infants showing better tolerance to dietary fat
        content with age.
      explanation: >-
        The controlled comparison establishing that the therapeutic variable is
        fat load specifically - hydrolysed and MCT formulas failed where the
        low-fat formula succeeded - which is why the treatment is modelled as
        acting on the substrate-accumulation node.
    - reference: PMID:39548446
      reference_title: "A low-fat amino acid diet reverses intestinal failure and shows good growth trends in five infants with diacylglycerol transferase 1 (DGAT1) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Low-fat amino acid FSMP formula and diets should be regarded as the first
        choice for the treatment of diarrhea in infants with DGAT1 deficiency.
      explanation: >-
        States the authors' recommendation that this be first-line therapy.
discussions:
- discussion_id: dgat1_substrate_injury_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what mechanism does accumulation of unesterified DGAT substrates in the
    intestinal mucosa produce diarrhea and protein loss, given that the mucosa is
    endoscopically and histologically unremarkable?
  rationale: >-
    The gene-to-phenotype link in DGAT1 deficiency is secure, but the step between
    them is not. The gene-discovery authors state explicitly that "the precise
    cause of diarrhea is unknown" and offer substrate buildup as a speculation.
    The gap is mechanistically important because the mucosa looks normal on
    endoscopy and routine histology, so whatever injures it does not produce the
    villous atrophy or structural lesion seen in the enterocyte-structural
    enteropathies, yet it is sufficient to cause protein-losing enteropathy. The
    causal edge from the central effector to the enteropathy node is therefore
    typed INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT. Resolving it also
    bears on the safety of pharmacological DGAT1 inhibition in adults, since the
    human null phenotype is the closest available read on complete target
    blockade.
  proposed_experiments:
  - experiment_id: dgat1_mucosal_lipidomics
    name: Lipidomic profiling of DGAT1-deficient patient intestinal biopsies
    description: >-
      Quantify diacylglycerol, fatty acyl-CoA and related species in mucosal
      biopsies from DGAT1-deficient patients on and off fat restriction, to test
      whether the proposed substrate accumulation occurs and whether its
      magnitude tracks symptom severity.
  - experiment_id: dgat1_enteroid_lipid_challenge
    name: Patient-derived enteroid barrier and lipid-challenge assay
    description: >-
      Challenge DGAT1-deficient patient-derived intestinal enteroids with graded
      fatty acid loads and measure transepithelial electrical resistance,
      macromolecular flux and cell death, to test whether lipid loading is
      sufficient to produce barrier failure of the kind that would cause
      protein-losing enteropathy without overt histological change.
notes: >-
  DGAT1 deficiency occupies a distinct mechanistic position among the congenital
  diarrheas and enteropathies and deliberately does NOT conform to the
  diet_induced_osmotic_diarrhea module, despite being dietarily triggered and
  dietarily treatable. That module models failure of a substrate-specific step at
  the apical brush border, where the offending nutrient is never absorbed and is
  retained in the lumen as an osmotic solute; here the fat IS absorbed and the
  lesion is intracellular, after uptake, so the diarrhea is not driven by a
  retained luminal osmole and the enteropathy involves protein loss rather than
  osmotic water flux. The superficial resemblance - a dietary constituent whose
  removal abolishes symptoms - is a good example of why the module's conformance
  criterion is the location and nature of the failed step rather than the
  responsiveness to diet. It is likewise distinct from abetalipoproteinemia and
  chylomicron retention disease, which impair chylomicron assembly and export
  downstream of normal triglyceride synthesis rather than blocking triglyceride
  synthesis itself.

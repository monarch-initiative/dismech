      DGAT1 is a key enzyme involved in TG synthesis. Diacylglycerol (DAG) and
      fatty acyl-coenzyme A are used as substrates to catalyze TGs
    explanation: >-
      States the enzymatic reaction whose loss defines this node - esterification
      of diacylglycerol with fatty acyl-CoA to form triglyceride. Evidence source
      is OTHER because this is the introductory review section of a clinical
      cohort report rather than a measurement made in it.
  downstream:
  - target: Failure of Enterocyte Triglyceride Packaging and Substrate Accumulation
    causal_link_type: DIRECT
- name: Failure of Enterocyte Triglyceride Packaging and Substrate Accumulation
  description: >-
    The rate-limiting step, and the point at which the disorder becomes
    fat-dependent. Within the enterocyte, triglyceride is either stored in
    cytoplasmic lipid droplets or packaged into chylomicrons for export to the
    lymphatic system; both routes require DGAT1-synthesised triglyceride. Without
    it, neither can proceed, and the unesterified DGAT substrates - diacylglycerol
    and fatty acyl-CoA - build up in the intestinal mucosa. This substrate
    accumulation, rather than the absence of triglyceride as such, is the
    proposed proximate cause of mucosal injury, and it explains the dose
    dependence on dietary fat: the more fat is presented for absorption, the more
    substrate accumulates.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Small-intestinal enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:

      hypogammaglobulinemia and hyperlipidemia. Endoscopy usually shows no
      specific changes
    explanation: >-
      Lists the protein-loss features of this node and records that endoscopy is
      typically unremarkable, the point that distinguishes this disorder from
      the structural enteropathies.
  downstream:
  - target: Fat-Dependent Diarrhea and Intestinal Failure
    causal_link_type: DIRECT
- name: Fat-Dependent Diarrhea and Intestinal Failure
  description: >-
    The clinical output. Severe watery diarrhea with vomiting, typically starting
    within the first two weeks of life, causing growth retardation and, untreated,
    intestinal failure that can be fatal - one of the two originally described
    siblings died at 17 months. The defining and therapeutically decisive feature
    of this node is its dependence on dietary fat load: symptoms remit on a
    low-fat amino acid formula and not on hydrolysed or medium-chain-triglyceride
    formulas, and tolerance for dietary fat improves with age. The second
    originally described child improved markedly with most symptoms resolved by
    10 to 12 months, so the natural history is not uniformly progressive.
  role: consequence
  biological_scale: ORGANISM

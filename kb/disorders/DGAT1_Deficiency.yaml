  features: >-
    Biallelic DGAT1 variants abolish diacylglycerol O-acyltransferase 1 activity.
    The index family carried a homozygous rare splice-site variant shown to be a
    total loss of function, with no detectable DGAT1 protein or activity.
    Compound heterozygous missense and other variants have since been reported,
    including in Chinese cohorts, and are associated with a broader phenotypic
    range including delayed onset.
  evidence:

name: DGAT1 Deficiency
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
synonyms:
- diarrhea 7, with exudative enteropathy
- congenital diarrhea 7
- DGAT1-related protein-losing enteropathy
- congenital chronic diarrhea with protein-losing enteropathy
description: >-
  DGAT1 deficiency is a rare autosomal recessive congenital diarrhea and
  enteropathy (CODE) caused by biallelic loss-of-function variants in DGAT1,
  which encodes diacylglycerol O-acyltransferase 1 - the enzyme catalysing the
  final, committed step of triglyceride synthesis in the enterocyte. It defines
  a mechanistic class of its own within the CODEs: neither a defect of a
  brush-border digestive step nor of an electrolyte transporter, but a failure of
  intracellular lipid handling *after* dietary fat has been absorbed across the
  apical membrane. Without DGAT1, absorbed diacylglycerol and fatty acyl-CoA
  cannot be esterified into triglyceride for packaging into lipid droplets and
  chylomicrons, so DGAT substrates accumulate within the intestinal mucosa and
  the enterocyte is injured. The clinical picture combines watery diarrhea and
  vomiting, beginning within the first two weeks of life in the classical
  presentation, with a distinctive protein-losing enteropathy - hypoalbuminemia,
  hypogammaglobulinemia and elevated fecal alpha-1-antitrypsin - and frequently
  hypertriglyceridemia. Endoscopy typically shows no specific mucosal
  abnormality, so the diagnosis rests on genetic testing rather than histology.
  The disorder is fat-dependent rather than fat-independent, which makes it
  treatable: a low-fat amino acid formula rapidly relieves symptoms, whereas
  hydrolysed and high-medium-chain-triglyceride formulas do not, and tolerance
  for dietary fat improves with age. Onset is not invariably neonatal - a
  delayed-onset presentation beginning at eight months of age has been reported.
  The disorder is of wider pharmacological interest because DGAT1 inhibitors
  have been developed for metabolic disease, and the human null phenotype is a
  direct read on the consequence of blocking that enzyme.

pathophysiology:
- name: Loss of Diacylglycerol O-Acyltransferase 1 Activity
  description: >-
    The initiating lesion. DGAT1 catalyses the final and committed step of
    triglyceride synthesis, esterifying diacylglycerol with fatty acyl-coenzyme A
    to form triacylglycerol. In the enterocyte this step is what converts the
    products of luminal fat digestion, once absorbed, into storable and
    exportable triglyceride. Biallelic loss-of-function variants abolish the
    enzyme entirely. Critically, this lesion sits downstream of luminal digestion
    and apical uptake, so it is not a brush-border defect: fat is absorbed into
    the cell normally and then cannot be processed.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Small-intestinal enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  molecular_functions:
  - preferred_term: Diacylglycerol O-acyltransferase activity
    term:
      id: GO:0004144
      label: diacylglycerol O-acyltransferase activity
    modifier: LOSS_OF_FUNCTION

  - reference: PMID:23114594
    reference_title: "DGAT1 mutation is linked to a congenital diarrheal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The precise cause of diarrhea is unknown, but we speculate that it relates
      to abnormal fat absorption and buildup of DGAT substrates in the intestinal
      mucosa.
    explanation: >-
      States the mucosal substrate-accumulation mechanism modelled by this node.
      The authors present it explicitly as a speculation, which is why the
      downstream causal link from this node is typed as having unknown
      intermediates rather than as direct.
  - reference: PMID:39548446
    reference_title: "A low-fat amino acid diet reverses intestinal failure and shows good growth trends in five infants with diacylglycerol transferase 1 (DGAT1) deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In intestinal cells, TGs are stored in lipid droplets (LDs) or packaged in
      chylomicrons, and then transported to the lymphatic system.
    explanation: >-
      Describes the two triglyceride-dependent routes - lipid droplets and
      chylomicrons - that fail when DGAT1 is absent.
  downstream:
  - target: Enteropathy with Intestinal Protein Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Enteropathy with Intestinal Protein Loss
  description: >-
    The effector node and the disorder's most distinctive feature. Mucosal injury
    produces an exudative (protein-losing) enteropathy in which serum proteins
    leak into the gut lumen, giving hypoalbuminemia, hypogammaglobulinemia and
    elevated stool alpha-1-antitrypsin, with peripheral edema when albumin falls
    far enough and susceptibility to recurrent infection when immunoglobulins do.
    Hypertriglyceridemia commonly accompanies it. The mucosa is nonetheless
    endoscopically and histologically unremarkable in most cases, which is why
    this disorder is missed by the biopsy-first diagnostic pathway that serves
    the structural enteropathies.
  role: effector
  biological_scale: TISSUE
  locations:
  - preferred_term: Small intestine

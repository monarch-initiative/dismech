inheritance:
- name: Autosomal dominant
  description: >-
    The common disease alleles -- p.Arg14del, p.Arg9Cys, p.Arg25Cys -- are heterozygous
    and act dominantly, with incomplete, age-dependent penetrance and markedly variable
    expressivity within a single family. The truncating p.Leu39Ter allele is the
    exception: heterozygotes show hypertrophy without contractile impairment, and only
    homozygotes develop lethal dilated cardiomyopathy, so that allele behaves
    recessively for the dilated phenotype.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:16432188
    reference_title: "A mutation in the human phospholamban gene, deleting arginine 14, results in lethal, hereditary cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By middle age, heterozygous individuals developed left ventricular dilation,
      contractile dysfunction, and episodic ventricular arrhythmias, with overt heart
      failure in some cases.
    explanation: >-
      Establishes that R14del heterozygotes are affected, which is what makes the
      allele dominant, and dates typical onset to middle age.
  - reference: PMID:12639993
    reference_title: "Human phospholamban null results in lethal dilated cardiomyopathy revealing a critical difference between mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The heterozygous individuals exhibited hypertrophy without diminished contractile
      performance. Strikingly, both individuals homozygous for L39stop developed dilated
      cardiomyopathy and heart failure, requiring cardiac transplantation at ages 16 and
      27.
    explanation: >-
      Documents the exception to dominant inheritance: the truncating L39stop allele
      produces the dilated phenotype only in homozygotes.
prevalence:
- population: Dutch dilated cardiomyopathy patients
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Share of a disease cohort attributable to the R14del founder allele, not a
    population rate. Founder-enriched and specific to the Netherlands.
  evidence:
  - reference: PMID:22820313
    reference_title: "Phospholamban R14del mutation in patients diagnosed with dilated cardiomyopathy or arrhythmogenic right ventricular cardiomyopathy: evidence supporting the concept of arrhythmogenic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We screened a cohort of 97 ARVC and 257 DCM unrelated index patients for PLN
      mutations and evaluated their clinical characteristics. PLN mutation R14del was
      identified in 12 (12 %) ARVC patients and in 39 (15 %) DCM patients.
    explanation: >-
      Quantifies the R14del share of Dutch dilated and arrhythmogenic cardiomyopathy
      index patients in the cohort that defined the founder effect.
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    No global prevalence, incidence, or carrier frequency has been established for
    PLN-related cardiomyopathy. Carriers are reported across Europe, North America,
    Japan and China, but every quantitative estimate available derives from
    founder-enriched Dutch or Greek ascertainment and should not be generalized.
  evidence:
  - reference: PMID:39297138
    reference_title: "Reassessing the Mechanisms of PLN-R14del Cardiomyopathy: From Calcium Dysregulation to S/ER Malformation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      So far, 2 founder PLN-R14del mutations have been identified, both leading to the
      development of analogous disease phenotypes in carriers. One founder mutation has
      its origin in Greece, whereas the other emanates from the Netherlands
    explanation: >-
      Establishes that the disease burden is concentrated in two founder lineages,
      which is why no worldwide rate can be inferred from the published cohorts.
pathophysiology:
- name: PLN Regulatory Domain Variant
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion is a germline variant in PLN. Pathogenic alleles cluster in
    the cytoplasmic regulatory domain that contacts SERCA2a and carries the Ser16/Thr17
    phosphorylation sites (p.Arg9Cys, p.Arg14del, p.Arg25Cys), or truncate the protein
    within transmembrane domain II (p.Leu39Ter). The downstream branches are
    allele-specific and are modelled separately rather than merged, because the three
    classes perturb the SERCA2a-phospholamban regulatory couple in different directions.
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: phospholamban inhibitor activity toward the SERCA2a calcium pump
    term:
      id: GO:0004857
      label: enzyme inhibitor activity
  evidence:
  - reference: PMID:37144056
    reference_title: "Phospholamban R14del disease: The past, the present and the future."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PLN is a 52 amino acid transmembrane protein that modulates Ca2+ homeostasis and
      cardiac contractility through reversible inhibition of the sarcoplasmic reticulum
      (SR) calcium ATPase (SERCA2a) activity.
    explanation: >-
      Establishes the normal function that the disease alleles disrupt: reversible
      inhibition of SERCA2a, which places the lesion in calcium reuptake rather than
      in force generation.
  - reference: PMID:40556736
    reference_title: "Genetic landscape of phospholamban cardiomyopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Variants in the PLN gene have been identified in patients with a wide range of
      phenotypes, including hypertrophic, dilated, and arrhythmogenic cardiomyopathies.
    explanation: >-
      Supports treating the PLN allelic series as heterogeneous rather than as one
      uniform phenotype, which is why the branches below are kept separate.
  downstream:
  - target: Non-Reversible SERCA2a Superinhibition
    causal_link_type: DIRECT
    hypothesis_groups:
    - pln_serca_superinhibition
    description: R14del branch.
    evidence:
    - reference: PMID:16432188
      reference_title: "A mutation in the human phospholamban gene, deleting arginine 14, results in lethal, hereditary cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Coexpression of the normal and mutant-PLN in HEK-293 cells resulted in
        sarcoplasmic reticulum Ca(2+)-ATPase superinhibition.
      explanation: >-
        Shows the R14del allele producing superinhibition of the pump in a
        reconstituted system, which is the step this edge asserts.
  - target: Protein Kinase A Sequestration by Mutant Phospholamban
    causal_link_type: DIRECT
    description: R9C branch.
    evidence:
    - reference: PMID:12610310
      reference_title: "Dilated cardiomyopathy and heart failure caused by a mutation in phospholamban."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Cellular and biochemical studies revealed that, unlike wild-type PLN, PLN(R9C)
        did not directly inhibit SERCA2a. Rather, PLN(R9C) trapped protein kinase A
        (PKA)
      explanation: >-
        Establishes that R9C acts by trapping PKA rather than by inhibiting the pump
        directly, which is the branch this edge selects.
  - target: Loss of Phospholamban Protein
    causal_link_type: DIRECT
    description: Truncating and null allele branch.
    evidence:
    - reference: PMID:12639993
      reference_title: "Human phospholamban null results in lethal dilated cardiomyopathy revealing a critical difference between mouse and human."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The expression of recombinant PLN-L39stop in human embryonic kidney (HEK) 293
        cells and adult rat cardiomyocytes showed no PLN inhibition of SR Ca(2+)-ATPase
        and the virtual absence of stable PLN expression
      explanation: >-
        Demonstrates that the truncating allele yields no stable protein and no pump
        inhibition, establishing this branch as loss of function.
  - target: Phospholamban Mislocalization and Sarco-Endoplasmic Reticulum Disorganization
    causal_link_type: DIRECT
    hypothesis_groups:
    - pln_ser_malformation
    description: >-
      R14del branch running in parallel with the calcium-handling branch.
    evidence:
    - reference: PMID:39297138
      reference_title: "Reassessing the Mechanisms of PLN-R14del Cardiomyopathy: From Calcium Dysregulation to S/ER Malformation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        recent studies raised controversy regarding the effect of PLN-R14del on SERCA
        activity and revealed a prominent role for abnormal PLN protein distribution and
        sarco/endoplasmic reticulum disorganization as underlying disease mechanism
      explanation: >-
        Supports a second, parallel consequence of the R14del allele that is not
        reducible to altered SERCA2a inhibition.

- name: Non-Reversible SERCA2a Superinhibition
  biological_scale: MOLECULAR
  description: >-
    In the R14del allele the mutant phospholamban superinhibits SERCA2a, and critically
    the inhibition is not relieved by protein kinase A phosphorylation. Beta-adrenergic
    stimulation therefore cannot restore calcium reuptake, so the brake on the pump
    becomes constitutive rather than regulated. Note that the magnitude and even the
    direction of the R14del effect on SERCA activity is disputed in more recent work;
    this node states the classical finding and the disagreement is recorded as a
    mechanistic hypothesis.
  biological_processes:
  - preferred_term: constitutive inhibition of the SERCA2a calcium pump
    modifier: INCREASED
    term:
      id: GO:1901895
      label: negative regulation of ATPase-coupled calcium transmembrane transporter activity
  evidence:
  - reference: PMID:16432188
    reference_title: "A mutation in the human phospholamban gene, deleting arginine 14, results in lethal, hereditary cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The dominant effect of the PLN-R14Del mutation could not be fully removed, even
      upon phosphorylation by protein kinase A.
    explanation: >-
      This is the defining property of the node: the inhibition is non-reversible,
      so the physiological release mechanism is unavailable.
  downstream:
  - target: Impaired Sarcoplasmic Reticulum Calcium Reuptake
    causal_link_type: DIRECT
    hypothesis_groups:
    - pln_serca_superinhibition
    evidence:
    - reference: PMID:16432188
      reference_title: "A mutation in the human phospholamban gene, deleting arginine 14, results in lethal, hereditary cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        by chronic suppression of sarcoplasmic reticulum Ca(2+)-ATPase activity, the
        nonreversible superinhibitory function of mutant PLN-R14Del may lead to
        inherited dilated cardiomyopathy
      explanation: >-
        States the causal step from sustained pump suppression to the calcium-handling
        defect and onward to the disease.

- name: Protein Kinase A Sequestration by Mutant Phospholamban
  biological_scale: MOLECULAR
  description: >-
    The R9C allele reaches the same physiological endpoint by a different route. Mutant
    phospholamban does not inhibit SERCA2a itself; it traps protein kinase A, which
    prevents phosphorylation of the wild-type phospholamban produced from the normal
    allele. The wild-type protein is therefore locked in its inhibitory, dephosphorylated
    state, and calcium transient decay slows.
  molecular_functions:
  - preferred_term: sequestration of cAMP-dependent protein kinase by mutant phospholamban
    modifier: INCREASED
    term:
      id: GO:0051018
      label: protein kinase A binding
  evidence:
  - reference: PMID:12610310
    reference_title: "Dilated cardiomyopathy and heart failure caused by a mutation in phospholamban."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      which blocked PKA-mediated phosphorylation of wild-type PLN and in turn delayed
      decay of calcium transients in myocytes
    explanation: >-
      Establishes the in-trans mechanism specific to R9C and its immediate functional
      consequence for calcium handling.
  downstream:
  - target: Impaired Sarcoplasmic Reticulum Calcium Reuptake
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12610310
      reference_title: "Dilated cardiomyopathy and heart failure caused by a mutation in phospholamban."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        delayed decay of calcium transients in myocytes
      explanation: >-
        Slowed calcium transient decay is the direct readout of impaired reuptake into
        the sarcoplasmic reticulum.

- name: Loss of Phospholamban Protein
  biological_scale: MOLECULAR
  description: >-
    The truncating p.Leu39Ter allele removes phospholamban rather than dysregulating it.
    No stable protein is made, what little is expressed is misrouted away from the
    sarcoplasmic reticulum, and SERCA2a is left uninhibited. This is the opposite
    perturbation from R14del superinhibition, and it is the reason this node feeds
    calcium dyshomeostasis directly rather than through the impaired-reuptake node.
    The human phenotype inverts the mouse: PLN ablation is well tolerated in mice but
    lethal in people.
  biological_processes:
  - preferred_term: loss of phospholamban inhibition of SERCA2a
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:1901895
      label: negative regulation of ATPase-coupled calcium transmembrane transporter activity
  evidence:
  - reference: PMID:12639993
    reference_title: "Human phospholamban null results in lethal dilated cardiomyopathy revealing a critical difference between mouse and human."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      where PLN was expressed, it was misrouted to the cytosol or plasma membrane
    explanation: >-
      Documents the mislocalization that accompanies the loss of stable phospholamban
      expression in the truncating allele.
  downstream:
  - target: Dysregulated Cardiomyocyte Calcium Homeostasis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12639993
      reference_title: "Human phospholamban null results in lethal dilated cardiomyopathy revealing a critical difference between mouse and human."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In contrast to reported benefits of PLN ablation in mouse heart failure, humans
        lacking PLN develop lethal dilated cardiomyopathy.
      explanation: >-
        Supports the edge from absent phospholamban to disordered calcium handling and
        human disease, and marks the species divergence explicitly.

- name: Impaired Sarcoplasmic Reticulum Calcium Reuptake
  biological_scale: CELLULAR
  description: >-
    Sustained inhibition of SERCA2a, whether by non-reversible superinhibition (R14del)
    or by loss of the phosphorylation release step (R9C), slows removal of cytosolic
    calcium into the sarcoplasmic reticulum during diastole. This is the shared
    convergence point of the two dominant missense branches.
  biological_processes:
  - preferred_term: sarcoplasmic reticulum calcium ion transport
    modifier: DECREASED
    term:
      id: GO:0070296
      label: sarcoplasmic reticulum calcium ion transport
  evidence:
  - reference: PMID:33020536
    reference_title: "The phenotypic characteristic observed by cardiac magnetic resonance in a PLN-R14del family."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations on PLN result in intracellular calcium disorder, myocardial contraction
      defect, and eventually heart failure and/or malignant ventricular arrhythmia.
    explanation: >-
      States the calcium-reuptake defect as the mechanistic consequence of PLN
      mutation and names the two clinical endpoints it drives.
  downstream:
  - target: Dysregulated Cardiomyocyte Calcium Homeostasis
    causal_link_type: DIRECT

- name: Phospholamban Mislocalization and Sarco-Endoplasmic Reticulum Disorganization
  biological_scale: CELLULAR
  description: >-
    A second consequence of the R14del allele, independent of the pump kinetics.
    Mutant phospholamban is abnormally distributed and the sarco/endoplasmic reticulum
    membrane becomes locally disorganized into malformed clusters. This is now
    considered a prominent, possibly primary, disease mechanism rather than a
    downstream epiphenomenon of calcium dysregulation.
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:39297138
    reference_title: "Reassessing the Mechanisms of PLN-R14del Cardiomyopathy: From Calcium Dysregulation to S/ER Malformation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Importantly, a recent in-depth investigation revealed that these aggregates
      consist of malformed sarco/endoplasmic reticulum (S/ER) clusters.
    explanation: >-
      Reframes the hallmark structures as malformed membrane clusters rather than
      simple protein aggregation, which is the claim of this node.
  downstream:
  - target: Impaired Autophagic Flux
    causal_link_type: DIRECT
    hypothesis_groups:
    - pln_ser_malformation
    evidence:
    - reference: PMID:39527246
      reference_title: "The phospholamban R14del generates pathogenic aggregates by impairing autophagosome-lysosome fusion."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our findings demonstrate that the expression of PLN-R14del results in diminished
        autophagic flux due to impaired fusion between autophagosomes and lysosomes.
      explanation: >-
        Establishes the causal step from expression of the mutant protein to the
        autophagy defect.

- name: Impaired Autophagic Flux
  biological_scale: CELLULAR
  description: >-
    R14del blocks autophagosome-lysosome fusion through aberrant recruitment of
    membrane-fusion machinery, itself partly mediated by altered calcium homeostasis.
    The degradative route that would clear the abnormal phospholamban-containing
    material is therefore unavailable, which is why the material accumulates.
  biological_processes:
  - preferred_term: autophagosome-lysosome fusion
    modifier: DECREASED
    term:
      id: GO:0061909
      label: autophagosome-lysosome fusion
  - preferred_term: autophagy
    modifier: DECREASED
    term:
      id: GO:0006914
      label: autophagy
  evidence:
  - reference: PMID:39527246
    reference_title: "The phospholamban R14del generates pathogenic aggregates by impairing autophagosome-lysosome fusion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanistically, this defect is linked to aberrant recruitment of key membrane
      fusion proteins to autophagosomes, which is mediated in part by changes in Ca2+
      homeostasis.
    explanation: >-
      Gives the molecular basis of the fusion block and links it back to the calcium
      branch of the mechanism.
  downstream:
  - target: Perinuclear Phospholamban-Positive Deposits
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39527246
      reference_title: "The phospholamban R14del generates pathogenic aggregates by impairing autophagosome-lysosome fusion."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We determined that PLN aggregates contain autophagic proteins, indicating
        inefficient degradation via the autophagy pathway.
      explanation: >-
        Ties the deposits directly to failed autophagic degradation, which is the
        causal claim of this edge.

- name: Perinuclear Phospholamban-Positive Deposits
  biological_scale: CELLULAR
  description: >-
    Perinuclear phospholamban-immunoreactive material is the histopathological hallmark
    of R14del cardiomyopathy and is not seen in desmosomal arrhythmogenic cardiomyopathy,
    ischemic cardiomyopathy, or control hearts. It is specific enough to be diagnostically
    suggestive on explanted myocardium.
  evidence:
  - reference: PMID:33928785
    reference_title: "Unfolded Protein Response as a Compensatory Mechanism and Potential Therapeutic Target in PLN R14del Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PLN immunolabeling revealed perinuclear aggregations in PLN R14del tissues (7±2%)
      but were absent in ARVC, ICM, and control hearts
    explanation: >-
      Documents the deposits in human R14del myocardium and their absence from the two
      main differential diagnoses, establishing disease specificity.
  downstream:
  - target: Endoplasmic Reticulum Stress and Unfolded Protein Response Activation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33928785
      reference_title: "Unfolded Protein Response as a Compensatory Mechanism and Potential Therapeutic Target in PLN R14del Cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Single-cell RNA sequencing revealed the induction of the unfolded protein
        response (UPR) pathway in PLN R14del compared with isogenic control hiPSC-CMs.
      explanation: >-
        Establishes UPR induction as a consequence of the R14del proteostatic burden in
        isogenic human cardiomyocytes.

- name: Endoplasmic Reticulum Stress and Unfolded Protein Response Activation
  biological_scale: CELLULAR
  description: >-
    The unfolded protein response is activated in R14del cardiomyocytes and in patient
    myocardium. Its role is compensatory, not pathogenic: silencing any of the three
    UPR branches worsens contractility, and pharmacological UPR activation improves it.
    The node is therefore drawn as a protective response embedded in the injury
    cascade, not as a cause of the contractile deficit.
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  evidence:
  - reference: PMID:33928785
    reference_title: "Unfolded Protein Response as a Compensatory Mechanism and Potential Therapeutic Target in PLN R14del Cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Silencing of each of the 3 main UPR signaling branches (IRE1, ATF6, or PERK) by
      siRNA exacerbated the contractile dysfunction of PLN R14del hiPSC-CMs.
    explanation: >-
      Loss-of-function across all three branches worsening contractility is what
      establishes the response as protective rather than injurious.
  downstream:
  - target: Cardiomyocyte Contractile Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Drawn as indirect and partial: the UPR restrains the contractile deficit rather
      than producing it, so the arrow records that this compensatory node sits on the
      path to contractile failure without being its cause.

- name: Dysregulated Cardiomyocyte Calcium Homeostasis
  biological_scale: CELLULAR
  description: >-
    The convergence point of all allele branches. Cytosolic calcium handling across the
    contraction-relaxation cycle is disordered, whether from too much SERCA2a inhibition
    (R14del, R9C) or from none at all (null alleles). Both directions are maladaptive in
    the human heart.
  biological_processes:
  - preferred_term: calcium ion transmembrane transport
    modifier: DYSREGULATED
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
  - preferred_term: regulation of cardiac muscle contraction
    modifier: DYSREGULATED
    term:
      id: GO:0055117
      label: regulation of cardiac muscle contraction
  evidence:
  - reference: PMID:37144056
    reference_title: "Phospholamban R14del disease: The past, the present and the future."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In its dephosphorylated state, PLN interacts with SERCA2a and inhibits its affinity
      for Ca2+
    explanation: >-
      Establishes the regulatory couple whose disturbance defines this node, and the
      state the mutant alleles lock it into.
  downstream:
  - target: Cardiomyocyte Contractile Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33928785
      reference_title: "Unfolded Protein Response as a Compensatory Mechanism and Potential Therapeutic Target in PLN R14del Cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Modeling of the PLN R14del cardiomyopathy with isogenic pairs of hiPSC-CMs
        recapitulated the contractile deficit associated with the disease in vitro.
      explanation: >-
        Isogenic pairs differing only at the PLN locus show the contractile deficit,
        which attributes it to the mutation-driven calcium lesion rather than to
        genetic background.
  - target: Arrhythmogenic Substrate Formation
    causal_link_type: DIRECT
    description: >-
      Disordered calcium cycling supports triggered activity independently of
      structural remodeling, which is one reason arrhythmia can precede dilation.

- name: Cardiomyocyte Contractile Dysfunction
  biological_scale: CELLULAR
  description: >-
    Reduced force generation by the cardiomyocyte, secondary to the calcium-handling
    lesion and the proteostatic burden. It is reproducible in isogenic human iPSC
    cardiomyocytes differing only at the PLN locus, and in both two-dimensional
    monolayers and three-dimensional engineered heart tissue.
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: regulation of cardiac muscle contraction
    modifier: DECREASED
    term:
      id: GO:0055117

notes: >-
  Scope and lump/split. This entry is kept separate from the sarcomeric and
  cytoskeletal dilated cardiomyopathies on mechanism and on management, not on
  nomenclature. The lesion is in sarcoplasmic-reticulum calcium reuptake - the
  phospholamban-SERCA2a regulatory couple - rather than in force generation or force
  transmission, and R14del carriers are managed with a variant-specific arrhythmia risk
  model that supersedes ejection-fraction-based defibrillator criteria.

  Allelic heterogeneity is curated explicitly rather than merged. R14del superinhibits
  SERCA2a irreversibly and mislocalizes phospholamban; R9C does not inhibit the pump at
  all but sequesters protein kinase A; L39stop abolishes the protein and behaves
  recessively for the dilated phenotype. Quantitative statements about penetrance,
  arrhythmic risk, and disease frequency in this entry derive from Dutch R14del founder
  cohorts and should not be transferred to other alleles or ancestries.

  The disputed mechanism is recorded as two hypothesis groups rather than resolved.
  Whether the primary lesion is altered SERCA2a kinetics or sarco/endoplasmic-reticulum
  malformation with proteostatic failure is unsettled in the primary literature, and
  both branches are drawn in the pathograph with their edges tagged to the corresponding
  hypothesis group.

  Not curated here. Experimental PLN-directed therapies - antisense silencing, AAV9-CRISPR
  disruption of the mutant allele, autophagy and unfolded-protein-response modulation -
  are preclinical, and no approved PLN-specific therapy exists; they are omitted from
  `treatments` rather than listed as options. A phase 1 study of AZD4063 in PLN-R14del
  dilated cardiomyopathy was described in the deep-research report but is not curated,
  because its registry status could not be confirmed at curation time. The canine PLN
  p.Arg9His cardiomyopathy reported as a spontaneous comparative model is likewise not
  curated: it is a different allele from any modelled here and no citable record for it
  was verified.

  Source note. The Edison/falcon deep-research report for this disease
  (`research/Dilated_Cardiomyopathy_1P-deep-research-falcon.md`) carried no PMIDs, only
  DOIs, and every reference used here was resolved to a PMID and re-fetched before use.
  Two HPO identifiers the report suggested name entirely different concepts and were
  discarded: it gave `HP:0001738` for "Left ventricular systolic dysfunction" (the term
  is *Exocrine pancreatic insufficiency*; the correct term is `HP:0025169`) and
  `HP:0031540` for "Low-voltage electrocardiogram" (the term is *Linear IgG deposits
  along the epidermal basement membrane zone*; the correct term is `HP:0025077`,
  *Decreased QRS voltage*). The report's own term-validation section reported 28/28
  terms resolved, which is consistent - both CURIEs do exist - and is a reminder that
  resolution is not correctness.

  - target: Left ventricular systolic dysfunction
    causal_link_type: DIRECT
  - target: Ventricular Dilatation and Pump Failure
    causal_link_type: DIRECT

- name: Cardiomyocyte Injury and Death
  biological_scale: CELLULAR
  description: >-
    Persistent contractile and proteostatic stress leads to cardiomyocyte injury and
    loss, which is the trigger for the replacement fibrosis that follows. Direct
    quantification of cardiomyocyte death in PLN disease is limited; the node is
    inferred from the histological end state of fibrofatty replacement in explanted
    myocardium, and is flagged accordingly.
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cardiac muscle cell apoptotic process
    modifier: INCREASED
    term:
      id: GO:0010659
      label: cardiac muscle cell apoptotic process
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:39297138
    reference_title: "Reassessing the Mechanisms of PLN-R14del Cardiomyopathy: From Calcium Dysregulation to S/ER Malformation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At the histological level, severe cardiac fibrosis or fibrofatty-replacement is
      observed in tissues from patients with end-stage heart failure due to PLN-R14del
      cardiomyopathy.
    explanation: >-
      Replacement fibrosis is the histological signature of antecedent myocyte loss,
      which is the basis for inferring this node.
  downstream:
  - target: Myocardial Replacement Fibrosis
    causal_link_type: DIRECT

- name: Myocardial Replacement Fibrosis
  biological_scale: TISSUE
  description: >-
    Fibrous, sometimes fibrofatty, replacement of lost myocardium. In PLN disease it has
    a characteristic distribution: subepicardial late gadolinium enhancement in the
    lateral wall of the left ventricle, sometimes with linear mid-wall septal
    enhancement, together with elevated extracellular volume on T1 mapping. Critically,
    it is detectable in young carriers whose ventricular structure and function are
    still normal, which is what makes cardiac magnetic resonance an early rather than a
    confirmatory test.
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  cell_types:
  - preferred_term: cardiac fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  locations:
  - preferred_term: left ventricular lateral wall
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:33020536
    reference_title: "The phenotypic characteristic observed by cardiac magnetic resonance in a PLN-R14del family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      members underwent cardiac magnetic resonance (CMR) examination showed a strikingly
      similar pattern of late gadolinium enhancement (LGE)-Sub-epicardial involvement in
      the left ventricular (LV) lateral wall with or without linear mid-wall enhancement
      in the interventricular septum. The former one can also present in younger
      PLN-R14del carriers despite completely normal LV structure and function.
    explanation: >-
      Establishes both the characteristic distribution of the fibrosis and its
      occurrence before any structural or functional abnormality.
  - reference: PMID:33020536
    reference_title: "The phenotypic characteristic observed by cardiac magnetic resonance in a PLN-R14del family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meanwhile, T1 mapping also found significantly increased extracellular volume
      (ECV) in PLN-R14del carriers.
    explanation: >-
      Independent, quantitative tissue-characterization support for expanded
      interstitium in carriers.
  downstream:
  - target: Arrhythmogenic Substrate Formation
    causal_link_type: DIRECT
    description: >-
      Patchy fibrosis interposed between surviving myocyte bundles creates the
      conduction heterogeneity that supports reentry.
  - target: Myocardial fibrosis
    causal_link_type: DIRECT
  - target: Ventricular Dilatation and Pump Failure
    causal_link_type: DIRECT

- name: Arrhythmogenic Substrate Formation
  biological_scale: TISSUE
  description: >-
    The combination of patchy replacement fibrosis and disordered calcium cycling
    produces conduction heterogeneity and triggered activity. This node is the reason
    the disease is managed as an arrhythmogenic cardiomyopathy: malignant ventricular
    arrhythmia and sudden death can occur while ejection fraction is still preserved,
    so conventional ejection-fraction-based defibrillator thresholds under-detect risk.
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  evidence:
  - reference: PMID:22820313
    reference_title: "Phospholamban R14del mutation in patients diagnosed with dilated cardiomyopathy or arrhythmogenic right ventricular cardiomyopathy: evidence supporting the concept of arrhythmogenic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      R14del+ patients diagnosed with DCM showed an arrhythmogenic phenotype, and SCD at
      young age can be the presenting symptom. These findings support the concept of
      'arrhythmogenic cardiomyopathy'.
    explanation: >-
      Establishes that the arrhythmic substrate is a defining feature of the disease and
      can manifest before, or instead of, a heart-failure presentation.
  - reference: PMID:32555305
    reference_title: "The phospholamban p.(Arg14del) pathogenic variant leads to cardiomyopathy with heart failure and is unreponsive to standard heart failure therapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Heterozygous PLN-R14del mice demonstrated increased susceptibility to ex vivo
      induced arrhythmias, and cardiomyopathy at 18 months of age, which was not
      accelerated by isoproterenol infusion.
    explanation: >-
      Shows inducible arrhythmia susceptibility in the heterozygous knock-in, the
      genotype that matches human carriers.
  downstream:
  - target: Ventricular arrhythmia
    causal_link_type: DIRECT
  - target: Ventricular tachycardia
    causal_link_type: DIRECT
  - target: Ventricular fibrillation
    causal_link_type: DIRECT
  - target: Premature ventricular contractions
    causal_link_type: DIRECT
  - target: Sudden cardiac death
    causal_link_type: DIRECT
  - target: Syncope
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Ventricular Dilatation and Pump Failure
  biological_scale: ORGANISM
  description: >-
    Progressive myocyte loss and remodeling produce chamber dilatation with falling
    ejection fraction, and ultimately clinical heart failure requiring mechanical
    circulatory support or transplantation. In PLN disease this endpoint frequently
    arrives after, not before, the arrhythmic manifestations.
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  biological_processes:
  - preferred_term: heart contraction
    modifier: ABNORMAL
    term:
      id: GO:0060047
      label: heart contraction
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:16432188
    reference_title: "A mutation in the human phospholamban gene, deleting arginine 14, results in lethal, hereditary cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By middle age, heterozygous individuals developed left ventricular dilation,
      contractile dysfunction, and episodic ventricular arrhythmias, with overt heart
      failure in some cases.
    explanation: >-
      Documents dilatation, contractile failure, and overt heart failure as the
      organ-level endpoint in R14del carriers.
  downstream:
  - target: Dilated cardiomyopathy
    causal_link_type: DIRECT
  - target: Congestive heart failure
    causal_link_type: DIRECT
  - target: Exercise intolerance
    causal_link_type: DIRECT
  - target: Exertional dyspnea
    causal_link_type: DIRECT
phenotypes:
- name: Ventricular arrhythmia
  category: Cardiovascular
  description: >-
    Malignant ventricular arrhythmia is the dominant clinical risk in R14del carriers
    and is the endpoint the variant-specific risk model predicts. In the 679-carrier
    Dutch cohort roughly one in ten carriers reached a composite of sustained
    ventricular arrhythmia, appropriate defibrillator intervention, or aborted sudden
    death within a median 4.3 years.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Ventricular arrhythmia
    term:
      id: HP:0004308
      label: Ventricular arrhythmia
  evidence:
  - reference: PMID:34113975
    reference_title: "Prediction of ventricular arrhythmia in phospholamban p.Arg14del mutation carriers-reaching the frontiers of individual risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During a median follow-up of 4.3 years (IQR 1.7-7.4), 72 (10.6%) carriers
      experienced malignant VA.
    explanation: >-
      Quantifies the incidence of malignant ventricular arrhythmia in the largest
      published carrier cohort.

- name: Ventricular tachycardia
  category: Cardiovascular
  description: >-
    Sustained and non-sustained ventricular tachycardia occur in carriers and form part
    of the composite malignant-arrhythmia endpoint used for risk stratification.
  phenotype_term:
    preferred_term: Ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  evidence:
  - reference: PMID:34113975
    reference_title: "Prediction of ventricular arrhythmia in phospholamban p.Arg14del mutation carriers-reaching the frontiers of individual risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant VA was defined as sustained VA, appropriate ICD intervention, or
      (aborted) sudden cardiac death.
    explanation: >-
      Defines sustained ventricular arrhythmia as a component of the outcome observed in
      this cohort.

- name: Ventricular fibrillation
  category: Cardiovascular
  description: >-
    Ventricular fibrillation is an endpoint of the arrhythmic substrate and one route to
    sudden death or aborted cardiac arrest in carriers.
  phenotype_term:
    preferred_term: Ventricular fibrillation
    term:
      id: HP:0001663
      label: Ventricular fibrillation
  evidence:
  - reference: PMID:34113975
    reference_title: "Prediction of ventricular arrhythmia in phospholamban p.Arg14del mutation carriers-reaching the frontiers of individual risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Appropriate ICD intervention is classified as ICD therapy (antitachycardia pacing
      or shock) for VF/VT.
    explanation: >-
      Records ventricular fibrillation among the treated arrhythmic events in the carrier
      cohort.

- name: Premature ventricular contractions
  category: Cardiovascular
  description: >-
    Ventricular ectopic burden on 24-hour ambulatory monitoring is both a common finding
    and an independent predictor of malignant arrhythmia, which is why rhythm monitoring
    is part of carrier surveillance rather than only of symptomatic assessment.
  phenotype_term:
    preferred_term: Premature ventricular contraction
    term:
      id: HP:0006682
      label: Premature ventricular contraction
  evidence:
  - reference: PMID:34113975
    reference_title: "Prediction of ventricular arrhythmia in phospholamban p.Arg14del mutation carriers-reaching the frontiers of individual risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Significant predictors were left ventricular ejection fraction, premature
      ventricular contraction count/24 h, amount of negative T waves, and presence of
      low-voltage electrocardiogram.
    explanation: >-
      Establishes ventricular ectopic count as a measured and prognostically significant
      phenotype in carriers.

- name: Sudden cardiac death
  category: Cardiovascular
  description: >-
    Sudden cardiac death can be the presenting event, including at young ages, and
    families carry a substantial burden of early sudden death. This is the outcome that
    drives defibrillator decisions ahead of ejection-fraction thresholds.
  phenotype_term:
    preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:22820313
    reference_title: "Phospholamban R14del mutation in patients diagnosed with dilated cardiomyopathy or arrhythmogenic right ventricular cardiomyopathy: evidence supporting the concept of arrhythmogenic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The average age of 26 family members who died of SCD was 37.7 years.
    explanation: >-
      Documents sudden cardiac death at a mean age in the fourth decade among relatives
      of R14del index patients.

- name: Syncope
  category: Cardiovascular
  description: >-
    Syncope and presyncope occur as a consequence of ventricular arrhythmia and are
    treated as red-flag symptoms in carrier surveillance.
  phenotype_term:
    preferred_term: Syncope
    term:
      id: HP:0001279
      label: Syncope
  evidence:
  - reference: PMID:34113975
    reference_title: "Prediction of ventricular arrhythmia in phospholamban p.Arg14del mutation carriers-reaching the frontiers of individual risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Aborted SCD is defined as basic life support for cardiac arrest with return of
      stable circulation.
    explanation: >-
      Cited for the transient-loss-of-consciousness endpoint spectrum in this cohort;
      indirect, because the cohort records aborted sudden death rather than syncope as a
      separately tabulated phenotype.

- name: Dilated cardiomyopathy
  category: Cardiovascular
  description: >-
    Left ventricular, sometimes biventricular, dilatation with impaired systolic
    function. Dilatation may be a late feature: fibrosis and ventricular ectopy commonly
    precede any change in chamber size.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:16432188
    reference_title: "A mutation in the human phospholamban gene, deleting arginine 14, results in lethal, hereditary cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through genetic screening of dilated cardiomyopathy patients, we identified a
      previously uncharacterized deletion of arginine 14 (PLN-R14Del) in the coding
      region of the phospholamban (PLN) gene in a large family with hereditary heart
      failure.
    explanation: >-
      Establishes dilated cardiomyopathy as the presenting phenotype in the family in
      which the R14del allele was identified.

- name: Left ventricular systolic dysfunction
  category: Cardiovascular
  description: >-
    Reduced left ventricular ejection fraction. It is a predictor in the R14del risk
    model, but is explicitly not sufficient on its own for arrhythmic risk assessment,
    because malignant arrhythmia occurs in carriers with preserved function.
  phenotype_term:
    preferred_term: Left ventricular systolic dysfunction
    term:
      id: HP:0025169
      label: Left ventricular systolic dysfunction
  evidence:
  - reference: PMID:34113975
    reference_title: "Prediction of ventricular arrhythmia in phospholamban p.Arg14del mutation carriers-reaching the frontiers of individual risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Significant predictors were left ventricular ejection fraction, premature
      ventricular contraction count/24 h, amount of negative T waves, and presence of
      low-voltage electrocardiogram.
    explanation: >-
      Records reduced ejection fraction as a measured phenotype and a component of the
      variant-specific risk model.

- name: Congestive heart failure
  category: Cardiovascular
  description: >-
    Clinical heart failure follows progressive systolic impairment, and in advanced
    disease leads to mechanical circulatory support or transplantation. R14del carriers
    with dilated cardiomyopathy come to transplantation far more often than
    non-carriers with the same diagnosis.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:22820313
    reference_title: "Phospholamban R14del mutation in patients diagnosed with dilated cardiomyopathy or arrhythmogenic right ventricular cardiomyopathy: evidence supporting the concept of arrhythmogenic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with R14del- DCM patients, R14del+ DCM patients more often demonstrated
      appropriate implantable cardioverter defibrillator discharge (47 % vs. 10 % , P <
      0.001), cardiac transplantation (18 % vs. 2 % , P < 0.001)
    explanation: >-
      The nine-fold excess of cardiac transplantation over genotype-negative dilated
      cardiomyopathy quantifies the end-stage heart-failure burden of the allele.

- name: Exercise intolerance
  category: Cardiovascular
  description: >-
    Reduced functional capacity accompanies progressive systolic impairment and is a
    common presenting complaint once the disease becomes symptomatic.
  phenotype_term:
    preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  evidence:
  - reference: PMID:37144056
    reference_title: "Phospholamban R14del disease: The past, the present and the future."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      Arrhythmogenic cardiomyopathy (ACM), a genetic disease with a prevalence of
      approximately 1:5,000, is characterized by life-threatening ventricular arrhythmias
      and sudden cardiac death (SCD) in apparently healthy young adults
    explanation: >-
      Cited for the disease context in which reduced functional capacity arises;
      indirect, because this review states the arrhythmic and sudden-death burden rather
      than tabulating exercise tolerance itself.

- name: Exertional dyspnea
  category: Cardiovascular
  description: >-
    Breathlessness on exertion is the typical heart-failure symptom of the dilated
    presentation.
  phenotype_term:
    preferred_term: Exertional dyspnea
    term:
      id: HP:0002875
      label: Exertional dyspnea
  evidence:
  - reference: PMID:12610310
    reference_title: "Dilated cardiomyopathy and heart failure caused by a mutation in phospholamban."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      an inherited human dilated cardiomyopathy with refractory congestive heart failure
      is caused by a dominant Arg --> Cys missense mutation at residue 9 (R9C) in
      phospholamban (PLN)
    explanation: >-
      Cited for the refractory congestive heart failure syndrome of which exertional
      dyspnea is the cardinal symptom; indirect, because the abstract names the syndrome
      rather than the individual symptom.

- name: Decreased QRS voltage
  category: Cardiovascular
  description: >-
    Low QRS voltage on the surface electrocardiogram is a characteristic, though not
    universal or diagnostic, feature, present in roughly half of R14del carriers. It is
    an independent predictor in the variant-specific arrhythmia risk model.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Decreased QRS voltage
    term:
      id: HP:0025077
      label: Decreased QRS voltage
  evidence:
  - reference: PMID:22820313
    reference_title: "Phospholamban R14del mutation in patients diagnosed with dilated cardiomyopathy or arrhythmogenic right ventricular cardiomyopathy: evidence supporting the concept of arrhythmogenic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A low voltage electrocardiogram was present in 46 % of R14del carriers.
    explanation: >-
      Gives the observed frequency of low QRS voltage among carriers, which supports the
      FREQUENT band.

- name: T-wave inversion
  category: Cardiovascular
  description: >-
    Lateral or precordial T-wave inversion is part of the characteristic
    electrocardiographic signature, and the number of negative T waves is a predictor in
    the R14del arrhythmia risk model.
  phenotype_term:
    preferred_term: T-wave inversion
    term:
      id: HP:0010872
      label: T-wave inversion
  evidence:
  - reference: PMID:34113975
    reference_title: "Prediction of ventricular arrhythmia in phospholamban p.Arg14del mutation carriers-reaching the frontiers of individual risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      amount of negative T waves, and presence of low-voltage electrocardiogram
    explanation: >-
      Establishes negative T waves as a counted electrocardiographic phenotype with
      independent prognostic weight in carriers.

- name: Myocardial fibrosis
  category: Cardiovascular
  description: >-
    Subepicardial late gadolinium enhancement in the left ventricular lateral wall, with
    or without linear mid-wall septal enhancement, and elevated extracellular volume on
    T1 mapping. Its detectability in structurally normal carriers is what makes cardiac
    magnetic resonance an early-detection tool in this disease.
  phenotype_term:
    preferred_term: Myocardial fibrosis
    term:
      id: HP:0001685
      label: Myocardial fibrosis
  evidence:
  - reference: PMID:33020536
    reference_title: "The phenotypic characteristic observed by cardiac magnetic resonance in a PLN-R14del family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings highlight the special role of CMR to phenotyping PLN-induced
      cardiomyopathy patients and distinguish them from other types of cardiomyopathy.
    explanation: >-
      Supports the fibrosis pattern as characteristic enough to separate PLN disease
      from other cardiomyopathies on imaging.
genetic:
- name: PLN
  gene_term:
    preferred_term: PLN
    term:
      id: hgnc:9080
      label: PLN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PLN encodes phospholamban, a 52-amino-acid sarcoplasmic reticulum transmembrane
    protein that reversibly inhibits SERCA2a, an inhibition relieved by protein kinase A
    phosphorylation at Ser16 and CaMKII phosphorylation at Thr17. It is the sole
    causative gene for this entry. The allelic series is mechanistically heterogeneous
    and the alleles are curated separately below rather than merged, because they
    perturb the phospholamban-SERCA2a couple in different directions. p.Arg9Leu,
    p.Arg9His and p.Arg25Cys are further reported alleles that are not separately
    curated here and require individual ACMG/AMP assessment.
  variants:
  - name: PLN p.Arg14del
    description: >-
      NM_002667.5:c.40_42delAGA, p.(Arg14del); also written R14del or R14. An in-frame
      single-codon deletion in the cytoplasmic regulatory domain and the best-studied
      PLN allele, with independent founder lineages in the northern Netherlands and in
      Greece. It produces SERCA2a superinhibition that protein kinase A phosphorylation
      cannot relieve, and in parallel mislocalizes phospholamban into malformed
      sarco/endoplasmic-reticulum clusters that block autophagic flux. Clinically it
      carries a high arrhythmic burden, and it is the only allele for which a validated
      variant-specific arrhythmia risk model exists.
    clinical_significance: PATHOGENIC
    type: in-frame deletion
    evidence:
    - reference: PMID:16432188
      reference_title: "A mutation in the human phospholamban gene, deleting arginine 14, results in lethal, hereditary cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Coexpression of the normal and mutant-PLN in HEK-293 cells resulted in
        sarcoplasmic reticulum Ca(2+)-ATPase superinhibition.
      explanation: >-
        Coexpression of normal with mutant protein producing superinhibition is the
        experiment establishing the dominant-negative character of this specific allele.
    - reference: PMID:22820313
      reference_title: "Phospholamban R14del mutation in patients diagnosed with dilated cardiomyopathy or arrhythmogenic right ventricular cardiomyopathy: evidence supporting the concept of arrhythmogenic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Haplotype analysis revealed a common founder, estimated to be between 575 and 825
        years old.
      explanation: >-
        Establishes the founder status of this allele, which is why cohort-derived
        estimates for it are population-specific rather than general to PLN disease.
  - name: PLN p.Arg9Cys
    description: >-
      A missense allele at residue 9, reported in an inherited dilated cardiomyopathy
      with refractory congestive heart failure. Its mechanism is distinct from R14del:
      the mutant protein does not itself inhibit SERCA2a but sequesters protein kinase A,
      preventing phosphorylation of the wild-type phospholamban made from the normal
      allele. The inhibitory brake is therefore applied in trans, by the wild-type
      protein, rather than by the mutant.
    clinical_significance: PATHOGENIC
    type: missense
    evidence:
    - reference: PMID:12610310
      reference_title: "Dilated cardiomyopathy and heart failure caused by a mutation in phospholamban."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Cellular and biochemical studies revealed that, unlike wild-type PLN, PLN(R9C)
        did not directly inhibit SERCA2a. Rather, PLN(R9C) trapped protein kinase A
        (PKA)
      explanation: >-
        States the allele-specific mechanism explicitly and contrasts it with wild-type
        behaviour, which is the basis for curating R9C separately from R14del.
    - reference: PMID:12610310
      reference_title: "Dilated cardiomyopathy and heart failure caused by a mutation in phospholamban."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Transgenic PLN(R9C) mice recapitulated human heart failure with premature death.
      explanation: >-
        Model-organism support that this allele is sufficient to cause the heart-failure
        phenotype.
  - name: PLN p.Leu39Ter
    description: >-
      A nonsense allele (T116G, L39stop) truncating the protein within transmembrane
      domain II. It is a true null: essentially no stable phospholamban is produced,
      what little is made is misrouted away from the sarcoplasmic reticulum, and SERCA2a
      is left uninhibited. It is also the allele that breaks the dominant pattern -
      heterozygotes show hypertrophy with preserved contractility, and only homozygotes
      develop dilated cardiomyopathy, requiring transplantation in adolescence or early
      adulthood. Human phospholamban deficiency is therefore lethal, the inverse of the
      well-tolerated PLN-null mouse.
    clinical_significance: PATHOGENIC
    type: nonsense
    evidence:
    - reference: PMID:12639993
      reference_title: "Human phospholamban null results in lethal dilated cardiomyopathy revealing a critical difference between mouse and human."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The heterozygous individuals exhibited hypertrophy without diminished contractile
        performance. Strikingly, both individuals homozygous for L39stop developed dilated
        cardiomyopathy and heart failure, requiring cardiac transplantation at ages 16 and
        27.
      explanation: >-
        Establishes the recessive behaviour of this allele for the dilated phenotype,
        which is the reason it cannot be merged with the dominant missense alleles.
  evidence:
  - reference: PMID:40556736
    reference_title: "Genetic landscape of phospholamban cardiomyopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The growing number of identified variants highlights the previously
      underappreciated role of PLN in cardiac pathophysiology.
    explanation: >-
      Supports curating PLN as a gene with an expanding allelic series rather than a
      single-variant locus.
  - reference: PMID:37144056
    reference_title: "Phospholamban R14del disease: The past, the present and the future."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The PLN-R14del variant in specific is recognized as the cause in an increasing
      number of patients worldwide
    explanation: >-
      Establishes the gene-disease relationship as causative and identifies which allele
      accounts for most of the recognized burden.

treatments:
- name: Guideline-Directed Heart Failure Pharmacotherapy
  description: >-
    Standard heart-failure therapy for carriers with reduced ejection fraction. The
    evidence is extrapolated from general heart-failure trials rather than generated in
    PLN disease, and this is a real limitation: in the knock-in mouse neither eplerenone
    nor metoprolol improved cardiac function or survival, and a completed randomized
    trial of eplerenone in presymptomatic R14del carriers was run precisely because the
    question was open. No PLN-directed disease-modifying therapy is approved.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Ventricular Dilatation and Pump Failure
    description: >-
      Acts on the neurohormonal drive of adverse remodeling at the organ level, not on
      the calcium-handling lesion.
    evidence:
    - reference: PMID:32555305
      reference_title: "The phospholamban p.(Arg14del) pathogenic variant leads to cardiomyopathy with heart failure and is unreponsive to standard heart failure therapy."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Neither eplerenone nor metoprolol administration improved cardiac function or
        survival.
      explanation: >-
        A negative result in the genotype-matched mouse, cited to record that standard
        heart-failure drugs did not modify the disease in that model.
  evidence:
  - reference: PMID:32555305
    reference_title: "The phospholamban p.(Arg14del) pathogenic variant leads to cardiomyopathy with heart failure and is unreponsive to standard heart failure therapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Administration of standard heart failure therapy did not rescue the phenotype,
      underscoring the need for better understanding of the pathophysiology of
      PLN-R14del-associated cardiomyopathy.
    explanation: >-
      Supports curating this treatment as symptomatic rather than disease-modifying;
      indirect, because the result is from the mouse model rather than a carrier trial.

- name: Implantable Cardioverter-Defibrillator
  description: >-
    Defibrillator implantation for sudden-death prevention. The decision in R14del
    carriers is deliberately not made on ejection fraction alone: a variant-specific
    model combining ejection fraction, 24-hour ventricular ectopic count, number of
    negative T waves, and low QRS voltage discriminates arrhythmic risk substantially
    better (C-statistic 0.83) than the earlier generic PLN model (0.68). This is the
    single most consequential way PLN disease is managed differently from the sarcomeric
    dilated cardiomyopathies.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:
  - target: Arrhythmogenic Substrate Formation
    description: >-
      Does not modify the substrate; terminates the arrhythmias it generates.
    evidence:
    - reference: PMID:22820313
      reference_title: "Phospholamban R14del mutation in patients diagnosed with dilated cardiomyopathy or arrhythmogenic right ventricular cardiomyopathy: evidence supporting the concept of arrhythmogenic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        R14del+ DCM patients more often demonstrated appropriate implantable
        cardioverter defibrillator discharge (47 % vs. 10 % , P < 0.001)
      explanation: >-
        Appropriate discharges in nearly half of carriers, against a tenth of
        genotype-negative patients, evidences the device acting on a genotype-specific
        arrhythmic substrate.
  evidence:
  - reference: PMID:34113975
    reference_title: "Prediction of ventricular arrhythmia in phospholamban p.Arg14del mutation carriers-reaching the frontiers of individual risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study aims to improve risk stratification for primary prevention implantable
      cardioverter defibrillator (ICD) implantation by developing a new mutation-specific
      prediction model for malignant ventricular arrhythmia (VA) in phospholamban (PLN)
      p.Arg14del mutation carriers.
    explanation: >-
      Establishes that defibrillator selection in this disease is driven by a
      variant-specific model rather than generic criteria.
  - reference: PMID:34113975
    reference_title: "Prediction of ventricular arrhythmia in phospholamban p.Arg14del mutation carriers-reaching the frontiers of individual risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The multivariable model had an excellent discriminative ability {C-statistic 0.83
      [95% confidence interval (CI) 0.78-0.88]}. Applying the existing PLN risk model to
      the complete cohort yielded a C-statistic of 0.68 (95% CI 0.61-0.75).
    explanation: >-
      Quantifies the gain of the variant-specific model over the generic one, which is
      the justification for using it.

- name: Catheter Ablation of Ventricular Tachycardia
  description: >-
    Considered for recurrent monomorphic ventricular tachycardia or repeated
    defibrillator shocks. It addresses reentry around the fibrotic substrate and is
    adjunctive to, not a substitute for, defibrillator therapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac catheter ablation
    term:
      id: NCIT:C100068
      label: Cardiac Ablation
  target_mechanisms:
  - target: Arrhythmogenic Substrate Formation
    description: >-
      Interrupts reentrant circuits within the fibrotic substrate.

- name: Heart Transplantation
  description: >-
    Definitive therapy for end-stage disease, preceded in many carriers by durable
    mechanical circulatory support. R14del carriers with a dilated presentation reach
    transplantation far more often than genotype-negative patients with the same
    diagnosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Heart Transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  target_mechanisms:
  - target: Ventricular Dilatation and Pump Failure
    description: >-
      Replaces the failing organ; it does not act on any upstream node.
    evidence:
    - reference: PMID:22820313
      reference_title: "Phospholamban R14del mutation in patients diagnosed with dilated cardiomyopathy or arrhythmogenic right ventricular cardiomyopathy: evidence supporting the concept of arrhythmogenic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        cardiac transplantation (18 % vs. 2 % , P < 0.001)
      explanation: >-
        Quantifies transplantation rates in carriers against genotype-negative dilated
        cardiomyopathy patients.

- name: Genetic Counseling and Cascade Testing
  description: >-
    First-degree relatives of a carrier are offered counseling and targeted testing for
    the familial variant, followed by longitudinal electrocardiography, ambulatory rhythm
    monitoring, echocardiography and periodic cardiac magnetic resonance if
    genotype-positive. Most carriers in published cohorts enter care through family
    screening rather than symptoms, which is what makes this the highest-yield
    intervention in the disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34113975
    reference_title: "Prediction of ventricular arrhythmia in phospholamban p.Arg14del mutation carriers-reaching the frontiers of individual risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of the final cohort (83%) were family members of an index patient and
      most subjects were asymptomatic at baseline (85%).
    explanation: >-
      Shows that cascade screening, not symptomatic presentation, is how most carriers
      are identified.

clinical_trials:
- name: NCT01857856
  phase: PHASE_III
  status: COMPLETED
  description: >-
    iPHORECAST. Randomized study of eplerenone in presymptomatic PLN R14del carriers,
    testing whether antifibrotic mineralocorticoid-receptor blockade delays onset of
    overt disease. 84 participants.
  target_phenotypes:
  - preferred_term: Myocardial fibrosis
    term:
      id: HP:0001685
      label: Myocardial fibrosis
  evidence:
  - reference: clinicaltrials:NCT01857856
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The investigators hypothesize that treatment of presymptomatic PLN R14del-carriers
      with eplerenone, which by virtue of its mineralocorticoid(aldosterone)-blocking
      properties is a strong antifibrotic agent, reduces disease progression and
      postpones onset of overt disease.
    explanation: >-
      States the trial's hypothesis, which targets the fibrosis node of this entry's
      pathograph in presymptomatic carriers.

- name: NCT04978987
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    DECIPHER-PLN. Observational multi-omics cohort profiling plasma, cardiac and
    skeletal muscle from R14del carriers across the severity range, plus patient-derived
    iPSC cardiomyocytes, to identify disease-specific pathways and the modifiers behind
    the disease's very variable penetrance. Approximately 103 participants.
  evidence:
  - reference: clinicaltrials:NCT04978987
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subjects with a heterozygous PLN R14del mutation show a wide variety in phenotype.
      Within the same family, patients can present either with over heart failure in
      their 20's or completely asymptomatic until at least their 70's. So far, no
      modifiers have been identified.
    explanation: >-
      Documents the unexplained variable expressivity that this cohort was designed to
      resolve, and confirms no modifier is yet established.
mechanistic_hypotheses:
- hypothesis_group_id: pln_serca_superinhibition
  hypothesis_label: SERCA2a Superinhibition Model
  status: CANONICAL
  description: >-
    The original and long-dominant model, and the one the calcium arm of this entry's
    pathograph is built on: mutant phospholamban chronically suppresses SERCA2a
    activity in a manner that protein kinase A phosphorylation cannot relieve, so
    sarcoplasmic-reticulum calcium reuptake is persistently impaired and contractile
    and electrical dysfunction follow. It originates in the coexpression experiments
    that accompanied the discovery of the R14del allele in 2006.
  evidence:
  - reference: PMID:16432188
    reference_title: "A mutation in the human phospholamban gene, deleting arginine 14, results in lethal, hereditary cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, by chronic suppression of sarcoplasmic reticulum Ca(2+)-ATPase activity, the
      nonreversible superinhibitory function of mutant PLN-R14Del may lead to inherited
      dilated cardiomyopathy and premature death in both humans and mice.
    explanation: >-
      States the canonical model in full, from sustained pump suppression through to the
      clinical phenotype.

- hypothesis_group_id: pln_ser_malformation
  hypothesis_label: Sarco/Endoplasmic Reticulum Malformation and Proteostasis Model
  status: EMERGING
  description: >-
    A competing, non-mutually-exclusive model holding that the primary lesion is
    abnormal phospholamban distribution and malformed sarco/endoplasmic-reticulum
    membrane architecture, with the downstream proteostatic and autophagic failure that
    follows, rather than altered SERCA2a kinetics. Two observations drive it: the
    direction and magnitude of the R14del effect on SERCA activity is disputed across
    systems, and the hallmark perinuclear structures turn out on close inspection to be
    clustered membrane rather than protein aggregate. The distinction is not academic -
    it decides whether therapeutic effort should go to the SERCA axis or to correcting
    membrane architecture and autophagic flux. Both arms are curated as parallel
    branches in this entry's pathograph because the relative contribution is unsettled,
    not because both are established.
  evidence:
  - reference: PMID:39297138
    reference_title: "Reassessing the Mechanisms of PLN-R14del Cardiomyopathy: From Calcium Dysregulation to S/ER Malformation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Strategies targeting sarco/endoplasmic reticulum malformation may, therefore, prove
      more effective than SERCA activity modulation.
    explanation: >-
      States the therapeutic consequence that distinguishes this model from the canonical
      one, which is why the two are curated as separate hypothesis groups.
  - reference: PMID:39297138
    reference_title: "Reassessing the Mechanisms of PLN-R14del Cardiomyopathy: From Calcium Dysregulation to S/ER Malformation."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      However, recent studies raised controversy regarding the effect of PLN-R14del on
      SERCA activity
    explanation: >-
      Cited against the canonical superinhibition model: the SERCA effect that model
      rests on is itself contested.

animal_models:
- name: PLN-R14del knock-in mouse
  species: Mouse
  genotype: Pln p.(Arg14del) knock-in, heterozygous and homozygous
  publication: PMID:32555305
  description: >-
    Knock-in mouse carrying the human R14del lesion. Heterozygotes, the genotype that
    matches human carriers, develop inducible arrhythmia susceptibility and a
    cardiomyopathy only at 18 months. Homozygotes show an accelerated course with
    dilatation, contractile failure, low ECG voltages, fibrosis, phospholamban
    aggregation and early death - useful for testing therapies quickly, but not the
    human genotype.
  modeled_mechanisms:
  - target: Arrhythmogenic Substrate Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Heterozygous animals reproduce the arrhythmic susceptibility that defines the
      human disease.
    limitations: >-
      Arrhythmia is induced ex vivo rather than observed spontaneously, and beta-adrenergic
      challenge did not accelerate disease as it might be expected to in carriers.
    evidence:
    - reference: PMID:32555305
      reference_title: "The phospholamban p.(Arg14del) pathogenic variant leads to cardiomyopathy with heart failure and is unreponsive to standard heart failure therapy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygous PLN-R14del mice demonstrated increased susceptibility to ex vivo
        induced arrhythmias, and cardiomyopathy at 18 months of age, which was not
        accelerated by isoproterenol infusion.
      explanation: >-
        Supports treating the heterozygous mouse as informative for the arrhythmic
        substrate, at the genotype that matches human carriers.
  - target: Perinuclear Phospholamban-Positive Deposits
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Homozygous animals reproduce the hallmark phospholamban-positive material seen in
      human myocardium.
    limitations: >-
      Only the homozygous animals show it on this timescale, and homozygosity is
      essentially absent among human carriers, so the finding is reached through a
      genotype the disease does not normally present with.
    evidence:
    - reference: PMID:32555305
      reference_title: "The phospholamban p.(Arg14del) pathogenic variant leads to cardiomyopathy with heart failure and is unreponsive to standard heart failure therapy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Homozygous PLN-R14del mice exhibited an accelerated phenotype including cardiac
        dilatation, contractile dysfunction, decreased ECG potentials, high susceptibility
        to ex vivo induced arrhythmias, myocardial fibrosis, PLN protein aggregation, and
        early mortality.
      explanation: >-
        Records phospholamban aggregation alongside the other disease features in the
        homozygous animals.
  evidence:
  - reference: PMID:32555305
    reference_title: "The phospholamban p.(Arg14del) pathogenic variant leads to cardiomyopathy with heart failure and is unreponsive to standard heart failure therapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In conclusion, our novel PLN-R14del mouse model exhibits most features of human
      disease.
    explanation: >-
      Supports treating this model as informative for the disease overall, with "most"
      rather than all features being the stated scope.

- name: PLN-null mouse (comparative)
  species: Mouse
  genotype: Pln knockout
  publication: PMID:12639993
  description: >-
    Cited as a negative comparator rather than as a disease model. Phospholamban
    ablation is well tolerated in the mouse and even enhances cardiac function, whereas
    the equivalent human null state produces lethal dilated cardiomyopathy. The species
    divergence is the reason PLN knockdown was historically viewed as a therapeutic
    strategy and why that inference does not transfer.
  modeled_mechanisms:
  - target: Loss of Phospholamban Protein
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mouse does not reproduce the human consequence of absent phospholamban.
    limitations: >-
      The direction of effect is inverted between species: mice lacking phospholamban
      show enhanced calcium reuptake and contractility with no adverse outcome, while
      humans lacking it develop lethal dilated cardiomyopathy. Any therapeutic argument
      resting on murine PLN ablation therefore does not carry to patients, and complete
      phospholamban depletion is a specific safety concern for silencing approaches.
    evidence:
    - reference: PMID:12639993
      reference_title: "Human phospholamban null results in lethal dilated cardiomyopathy revealing a critical difference between mouse and human."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In contrast to reported benefits of PLN ablation in mouse heart failure, humans
        lacking PLN develop lethal dilated cardiomyopathy.
      explanation: >-
        Directly states the species divergence, which is what makes this a
        failure-to-recapitulate rather than a partial model.
  evidence:
  - reference: PMID:12639993
    reference_title: "Human phospholamban null results in lethal dilated cardiomyopathy revealing a critical difference between mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In mice, disruption of the PLN gene encoding phospholamban (PLN) or expression of
      dominant-negative PLN mutants enhances SR and cardiac function, but effects of PLN
      mutations in humans are unknown.
    explanation: >-
      Records the murine baseline against which the human finding was the surprise,
      establishing why this model is cited as a comparator.
discussions:
- discussion_id: pln_null_mouse_human_divergence
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Phospholamban ablation is benign, even beneficial, in the mouse but lethal in
    humans. Which species is informative for the consequences of reducing phospholamban,
    and what does that mean for silencing and gene-editing strategies that lower mutant
    or total PLN?
  attaches_to:
  - pathophysiology#Loss of Phospholamban Protein
  - animal_models#Mouse
  rationale: >-
    This is a mismatch rather than a gap: the murine evidence is abundant and
    unambiguous, it simply points the opposite way. Mice lacking phospholamban show
    enhanced sarcoplasmic-reticulum function and normal lifespan, which historically
    made PLN suppression look like an attractive heart-failure target; the human
    L39stop homozygotes instead required transplantation in their teens and twenties.
    The discrepancy matters directly for therapy, because the leading experimental
    approaches in R14del disease act by reducing mutant or total phospholamban, and the
    safety margin for depletion cannot be read off the mouse.
  evidence:
  - reference: PMID:12639993
    reference_title: "Human phospholamban null results in lethal dilated cardiomyopathy revealing a critical difference between mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to reported benefits of PLN ablation in mouse heart failure, humans
      lacking PLN develop lethal dilated cardiomyopathy.
    explanation: >-
      States the mismatch directly, in the same sentence, for both species.

- discussion_id: pln_r14del_penetrance_modifiers
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines whether a PLN R14del carrier remains asymptomatic into their
    seventies or reaches end-stage heart failure in their twenties? No genetic,
    epigenetic, or environmental modifier is validated.
  attaches_to:
  - genetic#PLN
  - clinical_trials#NCT04978987
  rationale: >-
    Penetrance is incomplete and age-dependent and expressivity varies widely within a
    single family carrying one founder allele, so the variance cannot be attributed to
    allelic heterogeneity. Without a modifier, risk stratification has to rest entirely
    on acquired phenotypic markers - ejection fraction, ectopic burden, T-wave changes,
    QRS voltage - which is why the arrhythmia risk model looks the way it does. A
    completed multi-omics cohort was designed around this question and had not
    identified a modifier at the time of its registration.
  evidence:
  - reference: clinicaltrials:NCT04978987
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Within the same family, patients can present either with over heart failure in
      their 20's or completely asymptomatic until at least their 70's. So far, no
      modifiers have been identified.
    explanation: >-
      Establishes both the magnitude of the unexplained variability and that no modifier
      was known when the cohort was designed to look for one.


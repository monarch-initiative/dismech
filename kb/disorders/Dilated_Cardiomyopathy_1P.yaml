name: Dilated Cardiomyopathy 1P
creation_date: "2026-09-04T02:26:58Z"
synonyms:
- CMD1P
- dilated cardiomyopathy type 1P
- cardiomyopathy, dilated, 1P
- PLN-related cardiomyopathy
- phospholamban cardiomyopathy
- familial isolated dilated cardiomyopathy caused by mutation in PLN
description: >-
  Dilated cardiomyopathy 1P is the Mendelian designation for cardiomyopathy caused by
  germline variants in PLN, which encodes phospholamban, the 52-amino-acid sarcoplasmic
  reticulum membrane protein that reversibly inhibits the cardiac calcium pump SERCA2a.
  The primary lesion is therefore in sarcoplasmic-reticulum calcium reuptake -- the
  relaxation arm of excitation-contraction coupling -- and not in the sarcomere, which
  separates this entry mechanistically from the sarcomeric and cytoskeletal dilated
  cardiomyopathies. Contemporary practice increasingly calls the disease PLN-related
  cardiomyopathy because carriers may present with dilated cardiomyopathy, with a
  left-dominant arrhythmogenic cardiomyopathy, or with ventricular arrhythmia and
  subepicardial fibrosis while chamber dimensions are still normal.

  The PLN alleles are not mechanistically interchangeable and this entry does not
  merge them. p.Arg14del (c.40_42delAGA, "R14del"), a Dutch and Greek founder variant
  and by far the best-characterized allele, superinhibits SERCA2a in a way that
  protein kinase A phosphorylation cannot relieve, and additionally mislocalizes
  phospholamban into malformed sarco/endoplasmic-reticulum clusters that impair
  autophagic flux. p.Arg9Cys acts differently: it does not itself inhibit SERCA2a but
  sequesters protein kinase A, blocking phosphorylation of the wild-type phospholamban
  in trans. The truncating p.Leu39Ter allele is a true null in which phospholamban
  protein is essentially absent -- heterozygotes are hypertrophic with preserved
  contractility, while homozygotes develop lethal dilated cardiomyopathy, the inverse
  of the benign phenotype of the PLN-null mouse. R14del carries a high arrhythmic
  burden that drives defibrillator decisions on a variant-specific risk model rather
  than on ejection fraction alone.

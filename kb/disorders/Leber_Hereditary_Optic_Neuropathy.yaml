has_subtypes:
- name: MT-ND4
  display_name: "m.11778G>A (MT-ND4)"
  description: >
    Widely reported as the most frequent primary LHON mtDNA variant
    worldwide and as the one with the poorest natural prognosis for
    spontaneous visual recovery; both statements are the consensus clinical
    view rather than claims curated here against a quantitative source. It is
    the genotype targeted by lenadogene nolparvovec gene therapy and the
    genotype enrolled in the RESCUE, REVERSE, REFLECT and RESTORE trials.
    Risk of visual failure is increased on mtDNA haplogroup J2 and decreased
    on haplogroup H.

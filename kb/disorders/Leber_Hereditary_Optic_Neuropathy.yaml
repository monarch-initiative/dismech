discussions:
- discussion_id: gap_lhon_penetrance_determinants
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    What determines which carriers of a primary LHON mtDNA variant convert to
    visual loss, and can conversion risk be predicted prospectively for an
    individual?
  attaches_to:
  - pathophysiology#Penetrance Modulation by Genetic Background and Environmental Triggers
  rationale: >
    Primary LHON susceptibility variants occur in roughly 1 in 1,000 people —
    far more common than manifest disease — and even the best-characterised
    modifiers (mtDNA haplogroup, sex, smoking) leave most of the variance in
    conversion unexplained. No validated biomarker predicts conversion, and
    contemporary registry estimates of lifetime risk (17.5% in males, 5.4% in
    females) are substantially lower than older textbook figures, which has
    direct consequences for genetic counselling and for powering prevention
    trials in asymptomatic carriers.
  proposed_experiments:
  - experiment_id: exp_lhon_carrier_conversion_cohort
    name: Prospective biomarker cohort of asymptomatic LHON mtDNA carriers
    description: >
      Follow a large multicentre cohort of asymptomatic primary-variant
      carriers with serial spectral-domain OCT (peripapillary RNFL, macular
      GCL), colour vision, contrast sensitivity, and electrophysiology
      (PERG/photopic negative response) to identify structural or functional
      changes that precede conversion, and estimate their positive predictive
      value for visual loss.
    experiment_type:
      preferred_term: prospective longitudinal biomarker cohort study
    decision_criterion: >
      Identification of a pre-conversion measure whose change predicts
      subsequent visual loss with clinically useful sensitivity and
      specificity.
    would_support:
    - Conversion is preceded by a detectable subclinical structural or functional decline that can be used to time intervention.
    would_refute:
    - Conversion is abrupt and unheralded by any measurable pre-clinical change, making carrier surveillance non-informative.
  - experiment_id: exp_lhon_nuclear_modifier_gwas
    name: Nuclear modifier association study in discordant carrier sibships
    description: >
      Perform genome-wide (or exome-wide) association and rare-variant burden
      testing on affected versus unaffected carriers drawn from the same
      pedigrees, matched for mtDNA haplogroup and smoking exposure, to
      identify nuclear loci that modulate conversion independently of the
      known mtDNA and environmental modifiers.
    experiment_type:
      preferred_term: within-family genetic modifier association study
    decision_criterion: >
      Replicated association of one or more nuclear loci with conversion after
      conditioning on haplogroup and smoking.
    would_support:
    - Nuclear genetic background is a material determinant of LHON penetrance.
    would_refute:
    - Residual penetrance variance is environmental or stochastic rather than nuclear-genetic.
  evidence:
  - reference: PMID:34670133
    reference_title: "Establishing risk of vision loss in Leber hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "previously-17.5% for males and 5.4% for females."
    explanation: Contemporary registry risk estimates are markedly lower than historical figures, underscoring the unresolved penetrance question.
  - reference: PMID:34670133
    reference_title: "Establishing risk of vision loss in Leber hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "women, older adults, and younger children are also at risk."
    explanation: Shows that the classic young-adult-male stereotype under-describes who is at risk, an open counselling problem.
- discussion_id: gap_lhon_gene_therapy_effect_identifiability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Does intravitreal allotopic MT-ND4 gene therapy produce a real treatment
    effect over natural history, given that sham-injected fellow eyes improved
    to the same degree as treated eyes?
  attaches_to:
  - pathophysiology#Complex I Subunit Missense Mutation
  rationale: >
    In RESCUE and REVERSE the within-patient design was invalidated by
    bilateral improvement after unilateral injection, plausibly explained by
    contralateral vector transfer demonstrated in nonhuman primates. Without
    an independent untreated control arm, the durable improvement observed to
    five years cannot be cleanly separated from spontaneous recovery. This is
    the central unresolved question for LHON gene therapy.
  proposed_experiments:
  - experiment_id: exp_lhon_gt_independent_control_trial
    name: Gene therapy trial with a between-patient untreated comparator
    description: >
      Run a randomised trial in which the comparator is an independent
      untreated (or rigorously matched external natural-history) group of
      patients rather than the fellow eye, stratified by genotype and time
      from symptom onset, so that the treatment effect is identifiable in the
      presence of contralateral vector spread.
    experiment_type:
      preferred_term: randomised controlled trial with between-patient comparator
    decision_criterion: >
      A statistically significant difference in best-corrected visual acuity
      between treated patients and the independent untreated comparator.
    would_support:
    - Allotopic ND4 gene therapy confers visual benefit beyond spontaneous recovery.
    would_refute:
    - The observed improvement reflects natural history rather than the vector.
  evidence:
  - reference: PMID:33298565
    reference_title: "Bilateral visual improvement with unilateral gene therapy injection for Leber hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unexpectedly, sustained visual improvement was observed in both"
    explanation: The bilateral improvement is precisely what makes the treatment effect unidentifiable in these trials.
  - reference: PMID:33298565
    reference_title: "Bilateral visual improvement with unilateral gene therapy injection for Leber hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "between the two treatment groups, was not met (P = 0.894)."
    explanation: The primary endpoint failure is a direct statement of the identifiability problem.
- discussion_id: gap_lhon_nqo1_idebenone_pharmacogenetics
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Is NQO1 genotype a clinically actionable predictor of idebenone response
    in LHON?
  attaches_to:
  - pathophysiology#Complex I Electron Transfer Deficiency
  rationale: >
    Idebenone's mechanism requires NQO1-mediated reduction before it can
    shuttle electrons to complex III, so variants lowering NQO1 protein levels
    are a mechanistically coherent candidate explanation for non-response —
    and the unreduced, oxidized drug actively inhibits complex I, so the
    stakes are higher than simple inefficacy. Aleo et al. (2024) demonstrated
    both the molecular effect and a corresponding clinical signal, but the
    clinical arm was a retrospective analysis of an already-treated cohort
    rather than a prospective genotype-stratified trial, and the authors
    themselves put it no more strongly than "suggest consideration". Whether
    NQO1 genotype should actually gate or modify prescribing is unresolved.
  proposed_experiments:
  - experiment_id: exp_lhon_nqo1_stratified_idebenone_trial
    name: NQO1-genotype-stratified prospective idebenone trial
    description: >
      Prospectively stratify LHON patients starting idebenone by NQO1
      genotype/protein level and compare pre-specified visual-acuity response
      endpoints between strata, with paired measurement of NQO1 protein and
      idebenone reduction capacity in patient-derived cells.
    experiment_type:
      preferred_term: prospective pharmacogenetic stratified interventional study
    decision_criterion: >
      A clinically meaningful difference in idebenone response between
      low-NQO1 and normal-NQO1 strata.
    would_support:
    - NQO1 genotype should guide idebenone prescribing or dosing in LHON.
    would_refute:
    - NQO1 status does not usefully predict idebenone response, and non-response is driven by other factors.
  evidence:
  - reference: PMID:38272025
    reference_title: "Genetic variants affecting NQO1 protein levels impact the efficacy of idebenone treatment in Leber hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "can neither predict nor understand the non-responders."
    explanation: >-
      States the open problem this discussion records: idebenone
      non-responders can currently be neither predicted nor explained.
  - reference: PMID:38272025
    reference_title: "Genetic variants affecting NQO1 protein levels impact the efficacy of idebenone treatment in Leber hereditary optic neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "suggest consideration of patient NQO1 genotype and mitochondrial DNA mutation in \nthe context of idebenone therapy."
    explanation: >-
      The proposed answer is offered as a consideration rather than a
      validated rule, which is precisely why this remains an open gap
      requiring a prospective stratified trial.

notes: >
  Scope and boundary notes. (1) This entry covers Leber hereditary optic
  neuropathy (MONDO:0010788, OMIM 535000) — the mtDNA complex I optic
  neuropathy. It is a completely different entity from Leber congenital
  amaurosis, an early-onset retinal dystrophy that shares only the eponym;
  dismech curates the latter separately (Leber_Congenital_Amaurosis_10,
  Leber_Congenital_Amaurosis_with_Early-Onset_Deafness). The NEC preflight
  against MONDO:0010788 (OMIM:535000, Orphanet:104, "mitochondrial oxidative
  phosphorylation disorder") was run before any deep-research content was
  used, and the Edison report was confirmed to be about the correct entity.
  (2) Autosomal dominant optic atrophy is the paired inherited mitochondrial
  optic neuropathy and is curated separately
  (Autosomal_Dominant_Optic_Atrophy_Plus, Behr_Syndrome); it is modelled here
  only as a differential diagnosis. (3) arLHON is curated as a subtype rather
  than a separate entry because its clinical phenotype and mechanism (a
  nuclear complex I lesion converging on the same RGC bioenergetic failure)
  copy classical LHON; MONDO:0030309 exists for it should a split later be
  preferred. (4) Deliberately omitted for lack of snippet-verifiable primary
  sources at curation time: quantitative genotype-specific spontaneous
  recovery rates, the Madrid capture-recapture prevalence figures, the
  Slovenian VFQ-25 quality-of-life and productivity-loss estimates, and the
  vitamin B12 deficiency association — all appeared in the Edison deep-research
  report but could not be traced to a citable abstract with an exact quotable
  snippet. The NQO1 idebenone-response modifier was previously on that list in
  error: PMID:38272025 is a real, quotable source and the claim is now fully
  evidenced on the NQO1 `genetic` record, the Idebenone treatment, and the
  `gap_lhon_nqo1_idebenone_pharmacogenetics` discussion. (5) Known ontology
  gap: UBERON has no papillomacular bundle class — see the notes on the
  "Papillomacular Bundle Axonal Degeneration" pathophysiology node.

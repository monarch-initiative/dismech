- name: Complex I Electron Transfer Deficiency
  biological_scale: MOLECULAR
  description: >
    Mutant complex I transfers electrons from NADH to ubiquinone
    inefficiently. Proton pumping across the inner membrane falls, the
    NADH/NAD+ redox couple shifts, and the coupled ATP-generating capacity of
    oxidative phosphorylation is reduced. The severity of the biochemical
    lesion is not uniform across the three primary variants: transmitochondrial
    cybrid work shows a frank assembly and catalytic-activity defect for
    m.3460G>A, whereas m.11778G>A and m.14484T>C are generally reported to
    impair coupling efficiency and raise ROS with comparatively better
    preserved catalytic activity, so this node should be read as a shared
    functional endpoint rather than an identical molecular block. Idebenone's
    therapeutic rationale is to accept electrons via NQO1 and deliver them
    downstream to complex III, partly bypassing this block.
  biological_processes:
  - preferred_term: mitochondrial electron transport, NADH to ubiquinone
    term:

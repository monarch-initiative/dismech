- name: NQO1
  gene_term:
    preferred_term: NQO1
    term:
      id: hgnc:2874
      label: NQO1
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  association: >
    NQO1 is not a cause of LHON but a pharmacogenetic modifier of treatment
    response. Idebenone must be reduced by the cytosolic NAD(P)H
    oxidoreductase I (NQO1) before it can shuttle electrons to complex III;
    two polymorphic variants drastically reduce NQO1 protein levels in the
    homozygous or compound heterozygous state, which hampers that reduction.
    In a retrospective analysis of a large idebenone-treated LHON cohort,
    patients carrying those genotypes had the poorest therapy response,
    particularly on the m.3460G>A/MT-ND1 background. The authors frame this as
    grounds to *consider* NQO1 genotype alongside the mtDNA mutation, not as
    validated genotype-guided prescribing.
  evidence:
  - reference: PMID:38272025
    reference_title: "Genetic variants affecting NQO1 protein levels impact the efficacy of idebenone treatment in Leber hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "or compound heterozygous NQO1 variants have the poorest therapy response, \nparticularly if carrying the m.3460G>A/MT-ND1 LHON mutation."
    explanation: >-
      Retrospective analysis of a large idebenone-treated LHON cohort,
      classified by therapy response, showing that patients homozygous or
      compound heterozygous for the NQO1 variants respond worst — the core
      clinical claim for treating NQO1 as a response modifier.
  - reference: PMID:38272025
    reference_title: "Genetic variants affecting NQO1 protein levels impact the efficacy of idebenone treatment in Leber hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "two polymorphic variants drastically reduce NQO1 protein levels when homozygous \nor compound heterozygous. This hampers idebenone reduction."
    explanation: >-
      Supplies the molecular mechanism linking NQO1 genotype to drug
      pharmacology: the variants lower NQO1 protein and thereby impair the
      reduction step idebenone depends on.
  - reference: PMID:38272025
    reference_title: "Genetic variants affecting NQO1 protein levels impact the efficacy of idebenone treatment in Leber hereditary optic neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "suggest consideration of patient NQO1 genotype and mitochondrial DNA mutation in \nthe context of idebenone therapy."
    explanation: >-
      The authors' own framing is that the findings "suggest consideration" of

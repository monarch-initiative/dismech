- name: Papillomacular Bundle Axonal Degeneration
  biological_scale: TISSUE
  description: >
    Ultrastructural morphometry of LHON optic nerves shows 95-99% depletion
    of the nerve fiber population, with surviving fibers confined to the
    periphery and a marked loss of axons below 1 micron in diameter — the
    P-cell population that forms the papillomacular bundle. This anatomical
    selectivity is what converts a generalized bioenergetic defect into the
    characteristic clinical picture of dense central/centrocecal scotoma and
    dyschromatopsia with relative sparing of peripheral fields and pupillary
    responses.

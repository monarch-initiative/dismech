pathophysiology:
- name: Complex I Subunit Missense Mutation
  biological_scale: MOLECULAR
  description: >
    The initiating lesion is a missense point mutation in a gene encoding a
    core subunit of respiratory-chain complex I (NADH:ubiquinone
    oxidoreductase). The large majority of molecularly resolved classical
    cases carry one of three usually homoplasmic mtDNA variants — m.11778G>A
    in MT-ND4, m.3460G>A in MT-ND1, or m.14484T>C in MT-ND6, which together
    are responsible for the majority of LHON cases worldwide. In arLHON the
    equivalent lesion is biallelic disruption of a nuclear complex I subunit
    or assembly/maintenance factor (DNAJC30, NDUFS2, MCAT, NDUFA12). Because
    mtDNA is present in every cell, the mutation itself is systemic; the
    disease phenotype is not.

    snippet: "subjects (68%) had a clinically relevant recovery in BCVA from baseline in at"
    explanation: >-
      Quantifies the proportion achieving clinically relevant recovery at week
      96, but this is a single-arm responder rate that includes sham-injected
      eyes and has no independent untreated comparator, so it cannot be
      attributed to the vector.
  - reference: PMID:39699886

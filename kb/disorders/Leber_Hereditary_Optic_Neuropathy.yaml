inheritance:
- name: Mitochondrial inheritance
  description: >
    Classical LHON is caused by pathogenic variants in the mitochondrial
    genome and is transmitted exclusively down the maternal line. An affected
    or carrier woman transmits the variant to all of her offspring; an
    affected man transmits it to none. Most carriers are homoplasmic, but
    heteroplasmy occurs in a minority and means that a maternal relative of a
    proband may not carry the variant at all — molecular testing of each
    at-risk relative is therefore required rather than assumed transmission.
    Penetrance is incomplete and both sex- and age-dependent.
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:20301353
    reference_title: "Leber Hereditary Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "transmitted strictly by maternal inheritance."
    explanation: GeneReviews states that LHON mtDNA variants are transmitted strictly maternally.
  - reference: PMID:20301353
    reference_title: "Leber Hereditary Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "variant cannot transmit the variant to any of his offspring."
    explanation: Confirms that affected or carrier males do not transmit the mtDNA variant, the defining asymmetry of maternal inheritance.
  - reference: PMID:20301353
    reference_title: "Leber Hereditary Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "complicated by the sex- and age-dependent penetrance of the primary mtDNA"
    explanation: Establishes that penetrance is both sex- and age-dependent, not complete.
  - reference: PMID:12518276

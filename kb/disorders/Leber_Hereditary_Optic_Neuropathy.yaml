    - reference: PMID:37071596
      reference_title: "Autosomal recessive Leber hereditary optic neuropathy, a new neuro-ophthalmo-genetic paradigm."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "vessels around the optic nerve and swelling of the retinal nerve fibre layer."
      explanation: Describes the acute-phase RNFL swelling that precedes the chronic RNFL-loss phase.
  notes: >
    Ontology gap (UBERON new-term request candidate): there is no UBERON class
    for the **papillomacular bundle**, the specific arcuate fascicle of
    small-caliber retinal ganglion cell axons running from the macula to the
    temporal optic disc. Searches of the current UBERON release for
    "papillomacular", "maculopapillary", and "macular bundle" all return
    nothing. This node is therefore anchored on the two closest available
    parents — `UBERON:0001793` nerve fiber layer of retina and
    `UBERON:0000941` cranial nerve II — neither of which captures the
    sub-bundle whose selective loss is the defining anatomical lesion of LHON
    and of mitochondrial optic neuropathies generally. The same gap will
    affect any entry curating dominant optic atrophy, toxic/nutritional optic
    neuropathy, or other papillomacular-predominant disease, so a term request
    would have cross-entry value.

- name: Optic Atrophy and Irreversible Central Vision Loss
  biological_scale: ORGANISM
  description: >
    The clinical endpoint: bilateral, painless, subacute central visual
    failure with dense central or centrocecal scotoma, severe dyschromatopsia,
    and optic atrophy. Visual acuity commonly deteriorates to the level of
    legal blindness and then plateaus, and the loss is generally irreversible.
    Spontaneous recovery does occur and is genotype-dependent, being most
    frequent with m.14484T>C and least with m.11778G>A; the quoted recovery
    percentages vary widely between series and are not curated here (see
    `notes`).

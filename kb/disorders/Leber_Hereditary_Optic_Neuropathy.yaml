      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: Penetrance Modulation by Genetic Background and Environmental Triggers
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      This node exists to hold exactly this: the factors that gate whether a
      carrier converts to visual loss. Smoking is graded above the other two
      exposures pointing here because its evidence is measured at the node
      itself rather than around it, reporting clinical penetrance as a number
      and holding the association independent of sex and alcohol.
    evidence:
    - reference: PMID:19525327
      reference_title: "Gene-environment interactions in Leber hereditary optic neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a strong and consistent association between visual loss and smoking, independent of gender and alcohol intake, leading to a clinical penetrance of 93% in men who smoked"
      explanation: >-
        Penetrance is this node's own subject, and the sentence gives it as a
        figure while holding the association independent of sex and alcohol.
    - reference: PMID:20301353
      reference_title: "Leber Hereditary Optic Neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Individuals in whom a LHON-causing mtDNA variant has been identified should be strongly advised not to smoke and to moderate alcohol intake, avoiding binge-drinking episodes"
      explanation: >-
        GeneReviews converts the association into an avoidance recommendation
        for carriers, which is the clinical form of a penetrance-gating claim.
        Graded above the structurally similar avoidance sentence carried by

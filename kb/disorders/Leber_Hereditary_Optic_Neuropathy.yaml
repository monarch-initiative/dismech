- name: Lenadogene Nolparvovec Gene Therapy
  description: >
    Lenadogene nolparvovec (GS010, rAAV2/2-ND4) is a single intravitreal
    AAV2 vector delivering a nuclear-encoded, mitochondrially targeted
    wild-type ND4 (allotopic expression) for m.11778G>A/MT-ND4 LHON. Across
    the RESCUE, REVERSE, REFLECT, and RESTORE programme, sustained bilateral
    visual improvement was observed for up to five years with a good safety
    profile apart from intraocular inflammation. Interpretation is materially
    confounded: sham-injected fellow eyes improved to essentially the same
    degree as treated eyes, so the within-patient primary endpoints were not
    met. A nonhuman-primate study found transfer of viral vector DNA to the
    contralateral, non-injected eye, which offers a plausible mechanistic
    explanation for that bilateral effect but also removes the fellow eye as
    an independent control. Gene therapy is therefore promising but not
    established routine care.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
    therapeutic_agent:
    - preferred_term: lenadogene nolparvovec
      term:
        id: NCIT:C174939
        label: Lenadogene Nolparvovec
  target_mechanisms:
  - target: Complex I Electron Transfer Deficiency
    treatment_effect: RESTORES
    description: >
      Allotopic expression of a nuclear-encoded, mitochondrially targeted
      wild-type ND4 transgene supplies functional ND4 protein to the
      mitochondrion, complementing the mutant mtDNA-encoded subunit and
      restoring complex I electron transfer. The predicate is RESTORES, not
      INHIBITS: the causal mtDNA mutation itself is neither removed nor
      edited and persists after treatment, so the therapy acts on the
      downstream functional deficiency rather than on the lesion.
  evidence:
  - reference: PMID:33298565
    reference_title: "Bilateral visual improvement with unilateral gene therapy injection for Leber hereditary optic neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Unexpectedly, sustained visual improvement was observed in both"
    explanation: Improvement in both treated and sham eyes means the trial cannot attribute the improvement to the vector, so this is partial rather than full support.
  - reference: PMID:33298565
    reference_title: "Bilateral visual improvement with unilateral gene therapy injection for Leber hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the anterior segment, retina, and optic nerve of the contralateral noninjected"
    explanation: Nonhuman primate biodistribution data support contralateral vector transfer as the mechanism of the bilateral effect.
  - reference: PMID:33298565
    reference_title: "Bilateral visual improvement with unilateral gene therapy injection for Leber hereditary optic neuropathy."
    supports: PARTIAL

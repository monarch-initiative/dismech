- name: ATP Deficit and Reactive Oxygen Species Overproduction
  biological_scale: CELLULAR
  description: >
    The combination of a bioenergetic shortfall and increased electron leak
    creates chronic oxidative stress. Cybrid experiments show directly that
    the primary mutations raise mitochondrial ROS production while lowering
    ATP output and membrane potential, and that this is coupled to apoptotic
    activation (cytochrome c release, BAK/BAX, cleaved caspases) and impaired
    PINK1/parkin mitophagy. Why the resulting injury is confined to retinal
    ganglion cells remains unsettled. One proposed explanation is that RGCs
    regulate superoxide unusually tightly and that LHON mutations subvert
    that regulation — but the supporting measurement was made in the RGC-5
    cell line, which was subsequently shown not to be of retinal ganglion
    cell origin, so this should be treated as an unconfirmed hypothesis. The
    better-supported account of selective vulnerability is the anatomical one
    given in the downstream node: the long, partly unmyelinated intraretinal
    axon segment imposes an exceptionally high and spatially distributed ATP
    demand.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "but heteroplasmy was detected in approximately 12% of individuals."
    explanation: Quantifies the minority of LHON carriers who are heteroplasmic rather than homoplasmic.
  - reference: PMID:20301353
    reference_title: "Leber Hereditary Optic Neuropathy."
    supports: SUPPORT

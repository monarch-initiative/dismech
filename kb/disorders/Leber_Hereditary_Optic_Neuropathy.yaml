      exclude LHON — an important qualifier on the maternal-inheritance model.
- name: Autosomal recessive
  description: >
    A clinically indistinguishable autosomal recessive form (arLHON,
    OMIM 619382) is caused by biallelic variants in nuclear genes encoding
    complex I subunits or assembly/maintenance factors — DNAJC30 (the
    p.Tyr51Cys founder allele, prevalent in Central and Eastern Europe),
    NDUFS2, MCAT, and NDUFA12. arLHON should be considered whenever the LHON
    phenotype is convincing but mtDNA testing is unrevealing. Notably, arLHON
    retains the same male predominance and incomplete penetrance as
    mtDNA-driven LHON.
  inheritance_term:

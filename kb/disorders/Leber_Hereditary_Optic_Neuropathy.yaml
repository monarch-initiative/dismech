- name: Retinal Ganglion Cell Degeneration and Apoptosis
  biological_scale: CELLULAR
  description: >
    Retinal ganglion cells are the selectively vulnerable cell type in LHON
    and in mitochondrial optic neuropathies generally. Their long,
    partly unmyelinated intraretinal axons impose a high and spatially
    distributed energy demand that a complex-I-deficient mitochondrial
    population cannot sustain, and the cells die by apoptosis. Ganglion cell
    layer thinning on OCT can precede overt optic atrophy.

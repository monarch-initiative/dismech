histopathology:
- name: Near-Total Optic Nerve Fiber Depletion with Peripheral Sparing
  description: >
    Light and electron microscopy of optic nerves from molecularly
    characterised LHON cases shows depletion of the nerve fiber population of
    95-99%, with the few surviving fibers confined to the periphery of the
    nerve. This is the tissue-level correlate of the clinical optic atrophy.
  evidence:
  - reference: PMID:11190025
    reference_title: "Leber's hereditary optic neuropathy differentially affects smaller axons in the optic nerve."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LHON varied from 95% to 99%. Those fibers that were spared were limited to the"
    explanation: Direct post-mortem morphometry quantifying the magnitude of fiber loss and the peripheral distribution of survivors.
- name: Preferential Loss of Sub-Micron (P-Cell) Axons
  description: >
    Axon-caliber spectra generated from electron micrographs show a marked
    diminution of the first peak (axons under 1 micron in diameter) with
    relative emphasis of a second peak around 2 microns, indicating
    preferential loss of the smallest axons — the P-cell population that
    forms the papillomacular bundle — and relative preservation of the larger
    M-cell fibers. This is the histopathological basis for the clinical
    combination of dyschromatopsia and central scotoma with preserved
    pupillary responses.
  diagnostic: false
  evidence:
  - reference: PMID:11190025
    reference_title: "Leber's hereditary optic neuropathy differentially affects smaller axons in the optic nerve."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed a marked diminution of the first peak of axons of less than 1 micron in"
    explanation: Quantifies the selective loss of the smallest axon calibers on morphometry.
  - reference: PMID:11190025
    reference_title: "Leber's hereditary optic neuropathy differentially affects smaller axons in the optic nerve."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "preferential loss of the smallest axons corresponding to the P-cell population."
    explanation: Identifies the lost population as the P-cells that subserve central and colour vision.
  notes: >
    Based on ultrastructural study of two molecularly characterised LHON optic
    nerves; the sample is small, as is inevitable for post-mortem optic nerve
    material in a non-lethal disease.


name: Leber Hereditary Optic Neuropathy
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Leber hereditary optic neuropathy
  term:
    id: MONDO:0010788
    label: Leber hereditary optic neuropathy
description: >
  Leber hereditary optic neuropathy (LHON) is the prototypical maternally
  inherited mitochondrial DNA (mtDNA) disease: missense point mutations in
  mtDNA-encoded subunits of respiratory-chain complex I — most commonly
  m.11778G>A (MT-ND4), m.3460G>A (MT-ND1), and m.14484T>C (MT-ND6) — impair
  NADH-to-ubiquinone electron transfer, reducing ATP output and perturbing
  redox/superoxide handling. The consequence is remarkably tissue-restricted:
  retinal ganglion cells (RGCs), and preferentially the smallest-caliber
  P-cell axons of the papillomacular bundle, undergo bioenergetic failure and
  apoptosis, producing subacute, painless, bilateral (usually sequential)
  central visual loss in otherwise healthy young adults, followed by
  irreversible optic atrophy. Two features dominate the genetics and set LHON
  apart from a simple Mendelian model. First, penetrance is strikingly
  incomplete and sex-biased — most carriers never lose vision, and males are
  affected several-fold more often than females — so a pathogenic mtDNA
  genotype is emphatically not equivalent to disease. Second, this penetrance
  gap is only partly filled by established modifiers: mtDNA haplogroup
  background (haplogroup J subclades raise risk for m.11778G>A and
  m.14484T>C; haplogroup H lowers it for m.11778G>A), sex, and above all
  environmental triggers, with tobacco smoking the best-established
  modifiable risk factor and heavy alcohol a secondary one. An additional
  nuclear-genetic contribution is widely suspected but remains unresolved and
  is recorded here as an open knowledge gap rather than an asserted
  mechanism. A phenocopying
  autosomal recessive form (arLHON) caused by biallelic nuclear variants —
  most notably the DNAJC30 p.Tyr51Cys founder allele in Central/Eastern
  Europe, and also NDUFS2, MCAT, and NDUFA12 — has broken the historical
  dogma that all LHON is maternally transmitted. Idebenone, a short-chain
  quinone that bypasses complex I, is the only authorised disease-specific
  drug (EMA, exceptional circumstances); intravitreal allotopic MT-ND4 gene
  therapy (lenadogene nolparvovec) has shown sustained bilateral visual
  improvement but its trials were confounded by contralateral-eye improvement
  after unilateral injection. LHON must not be confused with Leber congenital
  amaurosis, a mechanistically unrelated early-onset retinal dystrophy.
synonyms:
- LHON
- Leber optic atrophy
- Leber hereditary optic atrophy
- optic atrophy, Leber type

progression:
- phase: Acute and subacute phase
  age_range: Typically 15-30 years, with onset from childhood to late adulthood
  notes: >
    Painless blurring and dyschromatopsia begin in one eye; the fellow eye
    follows within weeks to a few months. Fundus signs include disc hyperemia,
    peripapillary telangiectatic microangiopathy, and RNFL pseudoedema without
    fluorescein leakage. Visual acuity falls rapidly, usually reaching a nadir
    around four months, and most macular ganglion cell loss is complete within
    the first six months.
  evidence:
  - reference: PMID:37071596
    reference_title: "Autosomal recessive Leber hereditary optic neuropathy, a new neuro-ophthalmo-genetic paradigm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with an acute phase of sudden and severe vision loss, telangiectatic and tortuous"
    explanation: Defines the acute phase and its characteristic fundus signs.
  - reference: PMID:39364415
    reference_title: "Recognizing Leber's Hereditary Optic Neuropathy to avoid delayed diagnosis and misdiagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "onset is typically between 15 and 30 years, but variability exists."
    explanation: Establishes the peak onset window with acknowledged variability.
  - reference: PMID:20301353
    reference_title: "Leber Hereditary Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "of those who lose their vision doing so before age 50 years."
    explanation: Establishes the age distribution of onset across the affected population.
- phase: Chronic phase
  age_range: From approximately 12 months after symptom onset
  notes: >
    RNFL swelling gives way to progressive RNFL loss, temporal then diffuse
    optic disc pallor, and established optic atrophy with a stable severe
    central deficit. Delayed partial or (rarely) substantial recovery may
    still occur after a year, most often with the m.14484T>C genotype and in
    arLHON.
  evidence:
  - reference: PMID:37071596
    reference_title: "Autosomal recessive Leber hereditary optic neuropathy, a new neuro-ophthalmo-genetic paradigm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is followed by a chronic phase of retinal nerve fibre layer loss, but"
    explanation: Defines the chronic RNFL-loss phase and the possibility of partial or full recovery.

diagnosis:
- name: Targeted mtDNA Testing for the Three Primary Variants
  description: >
    Molecular diagnosis rests on identifying one of the three common primary
    mtDNA variants in a proband with a consistent clinical history. This
    targeted test is the recommended first-line investigation; if it is
    negative and suspicion persists, comprehensive mtDNA sequencing with
    heteroplasmy-sensitive methods should follow, and then a nuclear
    inherited-optic-neuropathy panel including DNAJC30, NDUFS2, MCAT, and
    NDUFA12.
  evidence:
  - reference: PMID:20301353
    reference_title: "Leber Hereditary Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "consistent clinical history and/or one of three common mitochondrial DNA (mtDNA)"
    explanation: GeneReviews defines the diagnostic basis of LHON.
  - reference: PMID:39364415
    reference_title: "Recognizing Leber's Hereditary Optic Neuropathy to avoid delayed diagnosis and misdiagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing for the three most common LHON mutations is recommended"
    explanation: Supports targeted testing of the three common variants as the recommended first step.
- name: Optical Coherence Tomography
  description: >
    Spectral-domain OCT of the peripapillary RNFL and macular ganglion cell
    layer documents acute-phase RNFL thickening followed by severe thinning,
    and can detect ganglion cell loss before overt optic atrophy. It is a key
    tool for early recognition of LHON and for avoiding misdiagnosis as
    inflammatory optic neuritis.
  evidence:
  - reference: PMID:39364415
    reference_title: "Recognizing Leber's Hereditary Optic Neuropathy to avoid delayed diagnosis and misdiagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "assists clinicians in early recognition of LHON and help avoiding misdiagnosis."
    explanation: Establishes the role of OCT in early recognition and avoidance of misdiagnosis.

differential_diagnoses:
- name: Inflammatory Optic Neuritis
  description: >
    The most frequent and most consequential misdiagnosis. LHON is commonly
    mistaken for inflammatory optic neuritis associated with multiple
    sclerosis, AQP4-NMOSD, or MOGAD, which delays appropriate treatment.
  distinguishing_features:
  - LHON is painless, whereas inflammatory optic neuritis is typically painful on eye movement.
  - LHON shows peripapillary telangiectasia and RNFL pseudoedema without fluorescein leakage.
  - Early macular ganglion cell loss on OCT favours LHON.
  - Corticosteroids and plasma exchange treat inflammatory optic neuritis but not LHON.
  evidence:
  - reference: PMID:39364415
    reference_title: "Recognizing Leber's Hereditary Optic Neuropathy to avoid delayed diagnosis and misdiagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Misdiagnosis, often as inflammatory optic neuritis, delays treatment, compounded"
    explanation: Names inflammatory optic neuritis as the dominant misdiagnosis and its clinical consequence.
  - reference: PMID:39364415
    reference_title: "Recognizing Leber's Hereditary Optic Neuropathy to avoid delayed diagnosis and misdiagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "considering clinical clues such as ocular pain, fundus appearance and visual"
    explanation: Identifies ocular pain, fundus appearance, and visual recovery as the discriminating clues.
- name: Autosomal Dominant Optic Atrophy
  description: >
    The other common inherited optic neuropathy of young adults. Like LHON it
    is a mitochondrial disease of the retinal ganglion cell, but it is caused
    by nuclear OPA1 mutations rather than mtDNA complex I variants.
  distinguishing_features:
  - Insidious, slowly progressive, bilaterally symmetric childhood-onset visual loss rather than subacute sequential loss.
  - Autosomal dominant transmission rather than strict maternal transmission.
  - Caused by nuclear OPA1 variants rather than primary mtDNA complex I variants.
  evidence:
  - reference: PMID:19001017
    reference_title: "Inherited mitochondrial optic neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Leber hereditary optic neuropathy (LHON) and autosomal dominant optic atrophy"
    explanation: Establishes DOA as the paired inherited mitochondrial optic neuropathy that must be distinguished from LHON.
  - reference: PMID:19001017
    reference_title: "Inherited mitochondrial optic neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "families have mutations in the OPA1 gene, which codes for an inner mitochondrial"
    explanation: Identifies the nuclear OPA1 aetiology that distinguishes DOA from mtDNA-driven LHON.
- name: Toxic and Nutritional Optic Neuropathy
  description: >
    Toxic and nutritional optic neuropathies both mimic LHON and may aggravate
    it, since they converge on the same papillomacular bundle. Occupational
    solvent exposure and mitochondrial-toxic drugs should be elicited in the
    history.
  distinguishing_features:
  - An identifiable toxic exposure or nutritional deficiency is present.
  - No maternal pedigree of visual failure.
  - May improve when the exposure is removed or the deficiency corrected.
  - Molecular mtDNA testing resolves the distinction.
  evidence:
  - reference: PMID:38540197
    reference_title: "The Optic Nerve at Stake: Update on Environmental Factors Modulating Expression of Leber's Hereditary Optic Neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we review recent knowledge of the extrinsic determinants of LHON"
    explanation: Supports the overlap between environmental/toxic determinants and LHON expression that underlies this differential; the review does not itself perform the differential-diagnostic comparison.

treatments:
- name: Idebenone
  description: >
    Idebenone is a short-chain benzoquinone/coenzyme Q10 analogue that, after
    NQO1-mediated reduction, can accept electrons and deliver them to complex
    III, partly bypassing the defective complex I while also limiting
    oxidative injury. It is the only disease-specific drug authorised for
    LHON (European Medicines Agency, under exceptional circumstances), given
    at 900 mg/day (300 mg three times daily). The pivotal RHODOS randomised
    placebo-controlled trial did not meet its primary endpoint but favoured
    idebenone in secondary analyses, particularly in patients with discordant
    visual acuities at baseline; the later externally controlled LEROS study
    met its primary endpoint and confirmed long-term efficacy in the
    subacute/dynamic and chronic phases, with effect size varying by disease
    phase and causative variant. Benefit is greatest when treatment begins
    within the first year of visual loss.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: idebenone
      term:
        id: CHEBI:31687
        label: idebenone
  target_mechanisms:
  - target: Complex I Electron Transfer Deficiency
    treatment_effect: BYPASSES
    description: >
      Reduced idebenone shuttles electrons directly to complex III, partially
      bypassing the mutant complex I block and restoring some downstream
      electron flux and ATP synthesis. The predicate is BYPASSES rather than
      INHIBITS because idebenone does not suppress the defect — it routes
      electrons around it via an alternative path.
  evidence:
  - reference: PMID:20301353
    reference_title: "Leber Hereditary Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "idebenone, particularly those treated within the first year of onset of visual"
    explanation: GeneReviews states that visual benefit is seen particularly in those treated within the first year.
  - reference: PMID:21788663
    reference_title: "A randomized placebo-controlled trial of idebenone in Leber's hereditary optic neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "statistical significance in the intention to treat population."
    explanation: The RHODOS primary endpoint was not met in the intention-to-treat population, so the randomized evidence is partial rather than definitive.
  - reference: PMID:21788663
    reference_title: "A randomized placebo-controlled trial of idebenone in Leber's hereditary optic neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "discordant visual acuities are the most likely to benefit from idebenone"
    explanation: >-
      Identifies the subgroup in which the randomized trial found benefit, but
      the finding came from a post hoc interaction analysis after the
      prespecified primary endpoint failed, so it is hypothesis-generating
      rather than confirmatory.
  - reference: PMID:21788663
    reference_title: "A randomized placebo-controlled trial of idebenone in Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Idebenone was safe and well tolerated."
    explanation: Supports the safety and tolerability of the 900 mg/day regimen.
  - reference: PMID:38428428
    reference_title: "Therapeutic benefit of idebenone in patients with Leber hereditary optic neuropathy: The LEROS nonrandomized controlled trial."
    supports: SUPPORT

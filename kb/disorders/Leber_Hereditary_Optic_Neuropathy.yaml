- name: Avoidance of Smoking and Heavy Alcohol
  description: >
    The only intervention with a documented effect on penetrance is exposure
    avoidance. Individuals in whom a LHON-causing mtDNA variant has been
    identified should be strongly advised not to smoke and to moderate
    alcohol intake, avoiding binge-drinking episodes, and to avoid other
    putative triggers such as head trauma, industrial toxins, and drugs with
    mitochondrial toxic effects. The treatment is bound to the NCIT smoking
    cessation intervention term because smoking is the dominant and only
    well-evidenced modifiable trigger; alcohol moderation and other
    trigger-avoidance advice are delivered in the same counselling encounter
    but have no more specific NCIT clinical-action term.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: smoking cessation and trigger-avoidance counselling
    term:
      id: NCIT:C15372
      label: Smoking Cessation Intervention
  target_mechanisms:
  - target: Penetrance Modulation by Genetic Background and Environmental Triggers
    treatment_effect: MODULATES
    description: >
      Removing the dominant environmental trigger lowers the probability that
      a carrier crosses the retinal ganglion cell decompensation threshold.
      The predicate is MODULATES rather than INHIBITS because the target node
      bundles risk-raising and risk-lowering modifiers, so the intervention
      shifts the balance rather than suppressing the node outright.

    explanation: Characterizes the rapidity and severity of the visual endpoint and its age distribution.

- name: Penetrance Modulation by Genetic Background and Environmental Triggers
  biological_scale: ORGANISM
  description: >
    LHON is not a deterministic monogenic disease. Most carriers of a primary
    mtDNA variant never lose vision; conversion is gated by additional
    factors that act on the bioenergetic threshold of the retinal ganglion
    cell. Three modifier classes are established. (1) mtDNA haplogroup
    background: risk of visual failure is higher for m.11778G>A on haplogroup
    J2 and for m.14484T>C on haplogroup J1, higher for m.3460G>A on haplogroup
    K, and significantly lower for m.11778G>A on haplogroup H, with MT-CYB
    substitutions offering a mechanistic explanation. (2) Sex: males are
    affected four to five times more often than females, an asymmetry not
    explicable by maternal transmission alone. (3) Environmental exposure:
    smoking is strongly and consistently associated with visual loss
    independent of sex and alcohol, with clinical penetrance reaching 93% in
    men who smoked; heavy alcohol intake shows a weaker trend. This node is
    the mechanistic bridge between genotype and the observed low penetrance
    (17.5% of males and 5.4% of females in a contemporary Australian registry
    cohort). Those two penetrance figures are not in conflict and must not be
    compared directly: the 93% figure is conditional on smoking and comes
    from LHON-affected pedigrees ascertained through probands, whereas the
    17.5%/5.4% figures are unconditional lifetime risks from a registry that
    includes 4,948 largely asymptomatic carriers. The registry authors state
    explicitly that historically higher male rates are not supported by their
    data. The same ascertainment caveat separates the clinical carrier
    prevalence recorded under `prevalence` (11.82 per 100,000) from the
    population-genomic susceptibility estimate of roughly 1 in 1,000.
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  evidence:
  - reference: PMID:17668373
    reference_title: "Clinical expression of Leber hereditary optic neuropathy is affected by the mitochondrial DNA-haplogroup background."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "haplogroup J (J2 for 11778G-->A and J1 for 14484T-->C) and when the 3460G-->A"
    explanation: Establishes haplogroup J subclades as risk-raising backgrounds for two of the three primary variants.
  - reference: PMID:17668373
    reference_title: "Clinical expression of Leber hereditary optic neuropathy is affected by the mitochondrial DNA-haplogroup background."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "significantly less when 11778G-->A occurs in haplogroup H."
    explanation: Documents the protective haplogroup H background, the mirror image of the haplogroup J risk effect.
  - reference: PMID:19525327
    reference_title: "Gene-environment interactions in Leber hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and alcohol intake, leading to a clinical penetrance of 93% in men who smoked."
    explanation: Quantifies the dominant environmental modifier of penetrance.
  - reference: PMID:20301353
    reference_title: "Leber Hereditary Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "are four to five times more likely to be affected than females"
    explanation: States the sex bias that any penetrance model must explain.
  downstream:
  - target: Retinal Ganglion Cell Degeneration and Apoptosis
    description: >
      Modifier factors determine whether the underlying complex I defect
      crosses the threshold at which retinal ganglion cells decompensate and
      die, converting an asymptomatic carrier into an affected individual.
    evidence:
    - reference: PMID:19525327
      reference_title: "Gene-environment interactions in Leber hereditary optic neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "consistent association between visual loss and smoking, independent of gender"
      explanation: A modifier exposure (smoking) is directly associated with whether a carrier suffers visual loss, which is exactly the causal step asserted by this edge.
    - reference: PMID:38540197
      reference_title: "The Optic Nerve at Stake: Update on Environmental Factors Modulating Expression of Leber's Hereditary Optic Neuropathy."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "that the incidence of genetic LHON susceptibility is around 1 in 1000, much"
      explanation: The carrier frequency greatly exceeding disease prevalence implies that factors beyond the primary variant gate conversion, but the figure itself speaks to prevalence rather than to the causal step, so this is partial support.


- name: Non-lymphoid tissue purine metabolite toxicity
  biological_scale: CELLULAR
  description: >-
    Because adenosine deaminase is ubiquitously expressed, the deoxyadenosine and
    dATP that accumulate in its absence are not confined to thymocytes. Two of the
    same molecular routes that damage developing lymphocytes operate in
    non-lymphoid cells: 2'-deoxyadenosine irreversibly inactivates
    S-adenosylhomocysteine hydrolase, so S-adenosylhomocysteine accumulates and
    inhibits transmethylation; and dATP inhibits ribonucleotide reductase,
    depleting the deoxynucleotide pool and impairing DNA synthesis in any
    proliferating cell. This node is the entry point for the extra-immune
    features of ADA deficiency — neurocognitive, auditory, skeletal, pulmonary
    and hepatic — which none of the other five SCID subtypes in this entry share.
  molecular_functions:
  - preferred_term: S-adenosylhomocysteine hydrolase activity
    modifier: DECREASED

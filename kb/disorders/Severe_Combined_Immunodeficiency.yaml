        Reports the behavioural abnormalities this edge terminates in.
  - target: Sensorineural hearing loss
    description: >-
      Bilateral sensorineural deafness occurs at roughly ten times the rate seen
      after transplant for immunodeficiencies confined to the immune system, in
      children with no structural, genetic, drug or infective cause, including
      children transplanted without conditioning.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27579027
      reference_title: "Adenosine Deaminase Deficiency - More Than Just an Immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "bilateral sensorineural deafness has been investigated as a non-immunological manifestation of ADA deficiency"
      explanation: >-
        States the attribution of the auditory phenotype to the metabolic lesion
        rather than to the immunodeficiency or its treatment.
  - target: Costochondral abnormalities
    description: >-
      Costochondral abnormality and skeletal dysplasia are common in ADA
      deficiency, and ADA-deficient mice show reduced bone formation from impaired
      osteoblast function. Whether the human bone phenotype follows from the
      purine lesion or from the immunodeficiency is explicitly unresolved, so this
      edge is the weakest of the five.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27579027
      reference_title: "Adenosine Deaminase Deficiency - More Than Just an Immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "It is common for patients with ADA deficiency to display costochondral abnormalities and skeletal dysplasia"
      explanation: >-
        Reports the skeletal phenotype in patients that this edge terminates in.
    - reference: PMID:27579027
      reference_title: "Adenosine Deaminase Deficiency - More Than Just an Immunodeficiency."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "it is unknown whether these bony defects are caused by the disrupted purine metabolism or the underlying immunodeficiency"
      explanation: >-
        Withholds the attribution this edge makes: the same review states the
        causal assignment to purine metabolism is not settled for bone.
  - target: Elevated hepatic transaminases
    description: >-
      Hepatic involvement is the thinnest arm of the human evidence — transaminase
      elevation of unknown aetiology is reported but hepatic dysfunction is rare in
      patients, while ADA-deficient mice die perinatally of hepatocyte degeneration.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27579027
      reference_title: "Adenosine Deaminase Deficiency - More Than Just an Immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "elevated serum transaminase levels may be seen in patients with ADA deficiency: this is indicative of liver damage and often etiology is unknown"
      explanation: >-
        Reports the hepatic laboratory abnormality in patients that this edge
        terminates in, and records that its aetiology is often unestablished.
  - target: Pulmonary alveolar proteinosis
    description: >-
      Pulmonary alveolar proteinosis occurred in 43.8% of ADA-deficient patients
      and in none of the patients with other forms of SCID, with no clinical or
      immunological difference between the ADA patients who developed it and those
      who did not — which is what places it on this branch rather than on the
      infectious consequences of the immunodeficiency.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27579027

inheritance:
- name: X-linked recessive inheritance
  description: >-
    The most common form of SCID in Western populations, X-linked SCID, is caused
    by hemizygous IL2RG variants and is inherited in an X-linked recessive pattern.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:20301584
    reference_title: "X-Linked Severe Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of typical and atypical X-SCID is established in a male proband with suggestive findings and a hemizygous pathogenic variant in IL2RG identified by molecular genetic testing."
    explanation: X-SCID is established by a hemizygous IL2RG variant in male probands, consistent with X-linked recessive inheritance.
- name: Autosomal recessive inheritance
  description: >-
    Most non-X-linked SCID subtypes (ADA, RAG1, RAG2, IL7R, JAK3, DCLRE1C/Artemis)
    are inherited in an autosomal recessive pattern, and these forms predominate in
    populations with high consanguinity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pattern of inheritance of SCID may be X-linked or autosomal recessive."
    explanation: SCID is inherited as either X-linked or autosomal recessive, with the autosomal recessive forms covering ADA, RAG1/2, IL7R, JAK3, and Artemis deficiency.
has_subtypes:
- name: X-linked SCID
  display_name: X-linked SCID (IL2RG deficiency, T-B+NK-)
  description: >-
    Caused by hemizygous loss-of-function variants in IL2RG encoding the common
    gamma chain. Immunophenotype is T-B+NK- (absent T and NK cells, present but
    non-functional B cells). Historically described as the most common form in
    Western populations at roughly half of cases, but that figure comes from
    referral-centre transplant cohorts; population-based newborn screening finds
    a substantially lower share (see the IL2RG case_fractions record).
  review_notes: >-
    The "~50% of cases" figure previously asserted here was removed as
    ascertainment-biased. PMID:25138334 found IL2RG accounted for only 19% of
    SCID detected by population-based TREC newborn screening and states
    explicitly that this is in contrast to nearly half of cases in published
    referral-centre cohorts, attributing the difference to increased
    ascertainment of autosomal recessive SCID by unbiased screening. Both
    numbers are real; they describe different populations.
  genes:
  - preferred_term: IL2RG
    term:
      id: hgnc:6010
      label: IL2RG
  evidence:
  - reference: PMID:25138334
    reference_title: "Newborn screening for severe combined immunodeficiency in 11 screening programs in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the proportion of IL2RG deficient X-linked SCID in our study (19%) is in contrast to nearly half of cases in published cohorts from referral centers that treat SCID"
    explanation: >-
      Supports the description's distinction between the referral-cohort figure
      of roughly half and the lower population-based share.
- name: ADA deficiency
  display_name: Adenosine deaminase deficiency (ADA-SCID, T-B-NK-)
  description: >-
    A systemic purine metabolic disorder (~15% of SCID) in which deficiency of
    adenosine deaminase causes accumulation of toxic deoxyadenosine metabolites
    that are lymphotoxic, producing a T-B-NK- immunophenotype with absent humoral
    and cellular immunity. Unlike the other subtypes here, ADA deficiency spans a
    graded spectrum: about 80% present as typical infantile ADA-SCID and 15%-20%
    as a later-onset combined immunodeficiency (ADA-CID).
  genes:
  - preferred_term: ADA
    term:
      id: hgnc:186
      label: ADA
  evidence:
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ADA deficiency is the most severe form of SCID and is known to occur in 15% of total SCID patients."
    explanation: Quantifies the ADA share of SCID cases asserted in this subtype description.
  - reference: PMID:20301656
    reference_title: "Adenosine Deaminase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ADA deficiency phenotypic spectrum includes typical early-onset severe combined immunodeficiency (ADA-SCID), diagnosed in infancy (about 80% of individuals), and less severe \"delayed\" or \"late-onset\" combined immunodeficiency (ADA-CID), diagnosed in older children and adults (15%-20% of individuals)."
    explanation: Supports the 80% typical-SCID / 15%-20% delayed-onset split within ADA deficiency.
- name: RAG1/RAG2 deficiency
  display_name: RAG1/RAG2 deficiency (T-B-NK+)
  description: >-
    Autosomal recessive SCID caused by defects in the recombination-activating
    genes RAG1 or RAG2, which block V(D)J recombination of antigen-receptor genes.
    Immunophenotype is T-B-NK+; hypomorphic alleles can cause Omenn syndrome. Most
    common form in consanguineous populations.
  genes:
  - preferred_term: RAG1
    term:
      id: hgnc:9831
      label: RAG1
  - preferred_term: RAG2
    term:
      id: hgnc:9832
      label: RAG2
- name: IL7R deficiency
  display_name: IL7R alpha-chain deficiency (T-B+NK+)
  description: >-
    Autosomal recessive SCID caused by defects in the IL-7 receptor alpha chain,
    impairing IL-7 signaling required for T-cell development. Immunophenotype is
    T-B+NK+ (B and NK cells preserved).
  genes:
  - preferred_term: IL7R
    term:
      id: hgnc:6024
      label: IL7R
- name: JAK3 deficiency
  display_name: JAK3 deficiency (T-B+NK-)
  description: >-
    Autosomal recessive SCID caused by defects in Janus kinase 3, the signaling
    kinase coupled to the common gamma chain. The immunophenotype (T-B+NK-) mirrors
    X-linked SCID because JAK3 acts immediately downstream of the gamma chain.
  genes:
  - preferred_term: JAK3
    term:
      id: hgnc:6193
      label: JAK3
- name: Artemis deficiency
  display_name: Artemis (DCLRE1C) deficiency (radiosensitive T-B-NK+)
  description: >-
    Autosomal recessive, radiosensitive SCID caused by defects in DCLRE1C/Artemis,
    a nuclease required for hairpin opening during V(D)J recombination and for
    non-homologous end-joining DNA repair. Immunophenotype is T-B-NK+ with
    increased cellular radiosensitivity.
  genes:
  - preferred_term: DCLRE1C
    term:
      id: hgnc:17642
      label: DCLRE1C
- name: Reticular dysgenesis
  display_name: Reticular dysgenesis (AK2 deficiency, T-B-NK-)
  description: >-
    Autosomal recessive SCID caused by biallelic AK2 (adenylate kinase 2) defects,
    accounting for about 2% of children with SCID. Unlike the other subtypes, the
    block is in survival of haematopoietic precursors rather than in a
    lymphoid-specific signalling, recombination, or metabolic pathway, so both
    innate and adaptive immunity fail: profound neutropenia/absent granulocytes
    accompanies the lymphoid deficiency. It is the most severe SCID form, with
    fatal septicaemia within days of birth if untreated.
  genes:
  - preferred_term: AK2
    term:
      id: hgnc:362
      label: AK2
  evidence:
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation of the AK2 gene causes reticular dysgenesis (RD), an autosomal recessive disorder occurring in 2% of children with SCID."
    explanation: Establishes AK2 as the cause of reticular dysgenesis and its share of SCID cases.
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reticular dysgenesis is the most serious type of SCID that is associated with absent granulocytes, lymphocytes, hypoplasia of the primary and secondary lymphoid organs and fatal septicemia within days after birth."
    explanation: Supports the combined myeloid-plus-lymphoid failure and the neonatal lethality distinguishing this subtype.
genetic:
- name: IL2RG
  subtype: X-linked SCID
  gene_term:
    preferred_term: IL2RG
    term:
      id: hgnc:6010
      label: IL2RG
  association: Causative
  features: >-
    Hemizygous loss-of-function variants in IL2RG (common cytokine-receptor gamma
    chain) cause X-linked SCID. IL2RG is the single most frequently implicated
    SCID gene in both referral cohorts and population screening, but its share of
    cases differs sharply by ascertainment (see case_fractions).
  case_fractions:
  - population: United States, 11 TREC newborn-screening programs (52 screened SCID cases)
    case_fraction_percent: 19.0
    cohort_size: 52
    notes: >-
      Population-based ascertainment. The same paper contrasts this with the
      roughly one-half share seen in referral-centre transplant cohorts and
      attributes the gap to better detection of autosomal recessive SCID by
      unbiased newborn screening rather than to a real difference in IL2RG
      frequency.
    evidence:
    - reference: PMID:25138334
      reference_title: "Newborn screening for severe combined immunodeficiency in 11 screening programs in the United States."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations in the X chromosome–linked IL2RG gene, encoding the cytokine receptor common γ chain, accounted for only 19% of cases."
      explanation: Gives the population-based IL2RG share of screened SCID cases.
    - reference: PMID:25138334
      reference_title: "Newborn screening for severe combined immunodeficiency in 11 screening programs in the United States."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "our lower proportion of IL2RG-deficient SCID is likely to reflect increased ascertainment of autosomal recessive SCID cases by population-based screening"
      explanation: The authors' own explanation for why the screened share is below the referral-cohort figure.
  - population: Indian multi-institutional SCID cohort (162 patients with a molecular diagnosis)
    case_fraction_percent: 22.2

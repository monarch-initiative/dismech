  name: Hypoplasia of the thymus
  description: >-
    A small, dysplastic thymus depleted of developing thymocytes produces the
    characteristic absent thymic shadow on chest imaging.
  notes: >-
    Ontology term corrected from HP:0005359 "Aplasia of the thymus" to
    HP:0000778 "Hypoplasia of the thymus". In typical SCID the thymic
    epithelial rudiment is present but hypoplastic/dysplastic because it is not
    populated by thymocytes; true thymic APLASIA (athymia) is the lesion of
    complete DiGeorge syndrome and FOXN1 deficiency, which are distinct
    entities. The absent thymic shadow on radiography reflects hypoplasia, not
    absence of the organ. This is also not a universal SCID finding - CORO1A

- name: Receptor-proximal T-cell receptor signaling defect
  description: >-
    In CD3D and LAT deficiency signalling through the pre-T-cell receptor and T-cell
    receptor fails at or immediately below the receptor, by two different routes.
    CD3delta is an invariant chain of the complex itself, so its loss leaves no
    signalling-competent receptor to assemble; LAT is the transmembrane adaptor that
    propagates the signal from a receptor that is intact, so its loss leaves the
    receptor silent. Thymocyte development arrests at the
    double-negative to double-positive transition, giving a T-B+NK+ immunophenotype.
    This is a fifth mechanism class alongside cytokine receptor signaling, V(D)J
    recombination and DNA repair, purine metabolism, and haematopoietic precursor
    survival, and it is the class the CD45/PTPRC and other CD3-chain deficiencies
    also belong to.
  biological_scale: CELLULAR

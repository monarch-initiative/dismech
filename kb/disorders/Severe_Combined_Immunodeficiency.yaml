      snippet: "Recombinase activating gene 1 (RAG1) defects, causing impairment of V(D) J lymphocyte antigen receptor recombination, were detected in 4 typical and 4 leaky SCID cases, 1 of the latter with Omenn syndrome, accounting for 15% of all 52 cases."
      explanation: Gives the RAG1 share of population-screened SCID cases and its typical/leaky split.
  evidence:
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."

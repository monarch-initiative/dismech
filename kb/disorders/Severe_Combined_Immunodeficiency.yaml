treatments:
- name: Hematopoietic stem cell transplantation
  description: >-
    Allogeneic hematopoietic stem cell transplantation is the definitive curative
    treatment for SCID, reconstituting a functional immune system; outcomes are best
    when performed early, before the onset of infections.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Blocked T-lymphocyte development
    treatment_effect: RESTORES
    description: Donor hematopoietic stem cells reconstitute thymic T-cell development and adaptive immunity.
  notes: >-
    Conditioning is genotype-dependent, not one protocol for all SCID. In the
    radiosensitive DNA-repair subtypes (Artemis/DCLRE1C, and by the same logic
    LIG4, NHEJ1, PRKDC) alkylator-based conditioning carries increased toxicity
    and is preferably avoided, which is one of the practical reasons a molecular
    diagnosis is sought before transplant rather than after.
  evidence:
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haematopoietic stem cell transplantation (HSCT) is the treatment of choice."
    explanation: HSCT is the curative treatment of choice for SCID.
  - reference: PMID:25138334
    reference_title: "Newborn screening for severe combined immunodeficiency in 11 screening programs in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "overall SCID survival was 45 of 52 (87%), while 45 of 49 treated infants (92%) survived"
    explanation: >-
      Quantifies the survival achieved when SCID is detected by newborn
      screening and treated early, supporting the claim that outcomes are best
      when transplant precedes infection.
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "radiosensitive forms of SCID are prone to develop increased toxicity to alkylator-based chemotherapeutic agents used in the conditioning regimen for HSCT"
    explanation: >-
      Qualifies the treatment: the conditioning regimen must be adapted in
      radiosensitive genotypes, so HSCT is not uniformly deliverable across SCID
      subtypes.
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pre-transplant conditioning regimens are preferably avoided in patients with radiosensitive forms of SCID."
    explanation: States the genotype-specific management consequence recorded in this treatment's notes.
- name: Hematopoietic stem cell gene therapy
  description: >-
    Autologous hematopoietic stem cell gene therapy corrects the causative gene in
    the patient's own stem cells; it is an established alternative to allogeneic HSCT
    for ADA-SCID (Strimvelis) and has shown clinical success for X-linked and other
    SCID forms.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  therapeutic_modality: GENE_THERAPY
  target_mechanisms:
  - target: Blocked T-lymphocyte development
    treatment_effect: RESTORES
    description: Gene-corrected autologous stem cells restore lymphocyte development and adaptive immunity.
  evidence:
  - reference: PMID:38355973
    reference_title: "Long-term and real-world safety and efficacy of retroviral gene therapy for adenosine deaminase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term persistence of multilineage gene-corrected cells, metabolic detoxification, immune reconstitution and decreased infection rates were observed."
    explanation: Retroviral hematopoietic stem cell gene therapy provides durable multilineage engraftment, immune reconstitution, and reduced infections in ADA-SCID.
  - reference: PMID:38355973
    reference_title: "Long-term and real-world safety and efficacy of retroviral gene therapy for adenosine deaminase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2 years intervention-free survival (no need for long-term enzyme replacement therapy or allogeneic hematopoietic stem cell transplantation) of 88% (95% confidence interval 78.7-98.4%)"
    explanation: >-
      Quantifies the durability of the benefit — the proportion of treated
      patients needing neither ongoing ERT nor rescue allogeneic transplant.
  - reference: PMID:38355973
    reference_title: "Long-term and real-world safety and efficacy of retroviral gene therapy for adenosine deaminase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient from the named patient program developed a T cell leukemia related to treatment 4.7 years after GT and is currently in remission."
    explanation: >-
      Records the insertional-oncogenesis risk of retroviral gene therapy — a
      treatment-related leukaemia in the long-term cohort — so the entry does
      not present gene therapy as risk-free.
  notes: >-
    Retroviral vectors carry an insertional-oncogenesis risk that is not
    hypothetical: one treatment-related T-cell leukaemia occurred in the 43-patient
    long-term ADA-SCID cohort. The authors nonetheless judge the risk-benefit
    balance favourable and call for continued long-term safety monitoring.
- name: Enzyme replacement therapy with pegademase (PEG-ADA)
  description: >-
    For ADA deficiency, enzyme replacement therapy with PEGylated adenosine
    deaminase corrects the metabolic defect, providing protection against infection;
    it is often used to stabilize patients before curative HSCT or gene therapy.
  treatment_term:
    preferred_term: enzyme replacement or supplementation therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
    therapeutic_agent:
    - preferred_term: pegademase bovine
      term:
        id: NCIT:C77484
        label: Pegademase Bovine
  target_mechanisms:
  - target: Toxic purine metabolite accumulation
    treatment_effect: INHIBITS
    description: Exogenous PEGylated ADA clears toxic deoxyadenosine/adenosine, correcting the lymphotoxic metabolic defect.
  evidence:
  - reference: PMID:20301656
    reference_title: "Adenosine Deaminase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "enzyme replacement therapy (ERT) by intramuscular administration of PEGylated ADA"
    explanation: Enzyme replacement therapy with PEGylated ADA is a targeted treatment correcting the ADA metabolic defect.
  - reference: PMID:20301656
    reference_title: "Adenosine Deaminase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Often, ERT is initiated first to rapidly correct the metabolic defect and to protect against serious infections as well as neurologic/behavioral abnormalities. It is discontinued at the time HSCT or HSC-GT is performed."
    explanation: >-
      Supports the bridging role asserted in this treatment's description, and
      specifies that ERT is stopped once curative therapy is delivered rather
      than continued alongside it.
  notes: >-
    ERT is a bridge, not an endpoint: it is started to correct the metabolite
    burden quickly and is discontinued when HSCT or gene therapy is performed.
    Prolonged ERT with declining lymphocyte counts is itself a trigger for
    lymphoma surveillance.
- name: Immunoglobulin replacement therapy
  description: >-
    Intravenous (or subcutaneous) immunoglobulin replacement provides passive humoral
    protection while patients await or recover from definitive immune reconstitution.
  treatment_term:
    preferred_term: immunoglobulin infusion therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_phenotypes:
  - preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  evidence:

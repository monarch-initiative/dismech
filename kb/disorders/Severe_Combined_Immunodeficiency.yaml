- name: Defective haematopoietic precursor survival
  description: >-
    In reticular dysgenesis, loss of adenylate kinase 2 disrupts cellular and
    mitochondrial energy homeostasis in haematopoietic precursors themselves.
    Because the lesion is bioenergetic rather than lymphoid-specific, both
    myeloid and lymphoid output fail: granulocytes are absent alongside
    lymphocytes, and innate as well as adaptive immunity is lost. This is the
    one SCID mechanism class in this entry whose consequences extend outside the
    lymphoid lineage.

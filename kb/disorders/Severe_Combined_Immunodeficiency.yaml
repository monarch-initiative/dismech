treatments:
- name: Hematopoietic stem cell transplantation
  description: >-
    Allogeneic hematopoietic stem cell transplantation is the definitive curative
    treatment for SCID, reconstituting a functional immune system; outcomes are best
    when performed early, before the onset of infections.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Blocked T-lymphocyte development
    treatment_effect: RESTORES
    description: Donor hematopoietic stem cells reconstitute thymic T-cell development and adaptive immunity.
  notes: >-
    Conditioning is genotype-dependent, not one protocol for all SCID. In the
    radiosensitive DNA-repair subtypes (Artemis/DCLRE1C, and by the same logic
    LIG4, NHEJ1, PRKDC) alkylator-based conditioning carries increased toxicity
    and is preferably avoided, which is one of the practical reasons a molecular
    diagnosis is sought before transplant rather than after.
  evidence:
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haematopoietic stem cell transplantation (HSCT) is the treatment of choice."
    explanation: HSCT is the curative treatment of choice for SCID.
  - reference: PMID:25138334
    reference_title: "Newborn screening for severe combined immunodeficiency in 11 screening programs in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "overall SCID survival was 45 of 52 (87%), while 45 of 49 treated infants (92%) survived"
    explanation: >-
      Quantifies the survival achieved when SCID is detected by newborn
      screening and treated early, supporting the claim that outcomes are best
      when transplant precedes infection.
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "radiosensitive forms of SCID are prone to develop increased toxicity to alkylator-based chemotherapeutic agents used in the conditioning regimen for HSCT"
    explanation: >-
      Qualifies the treatment: the conditioning regimen must be adapted in
      radiosensitive genotypes, so HSCT is not uniformly deliverable across SCID
      subtypes.
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Pre-transplant conditioning regimens are preferably avoided in patients with radiosensitive forms of SCID."
    explanation: States the genotype-specific management consequence recorded in this treatment's notes.
- name: Hematopoietic stem cell gene therapy
  description: >-
    Autologous hematopoietic stem cell gene therapy corrects the causative gene in
    the patient's own stem cells; it is an established alternative to allogeneic HSCT
    for ADA-SCID (Strimvelis) and has shown clinical success for X-linked and other
    SCID forms.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  therapeutic_modality: GENE_THERAPY
  target_mechanisms:
  - target: Blocked T-lymphocyte development
    treatment_effect: RESTORES
    description: Gene-corrected autologous stem cells restore lymphocyte development and adaptive immunity.
  evidence:
  - reference: PMID:38355973
    reference_title: "Long-term and real-world safety and efficacy of retroviral gene therapy for adenosine deaminase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term persistence of multilineage gene-corrected cells, metabolic detoxification, immune reconstitution and decreased infection rates were observed."
    explanation: Retroviral hematopoietic stem cell gene therapy provides durable multilineage engraftment, immune reconstitution, and reduced infections in ADA-SCID.
  - reference: PMID:38355973
    reference_title: "Long-term and real-world safety and efficacy of retroviral gene therapy for adenosine deaminase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2 years intervention-free survival (no need for long-term enzyme replacement therapy or allogeneic hematopoietic stem cell transplantation) of 88% (95% confidence interval 78.7-98.4%)"
    explanation: >-
      Quantifies the durability of the benefit — the proportion of treated
      patients needing neither ongoing ERT nor rescue allogeneic transplant.
  - reference: PMID:38355973
    reference_title: "Long-term and real-world safety and efficacy of retroviral gene therapy for adenosine deaminase deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient from the named patient program developed a T cell leukemia related to treatment 4.7 years after GT and is currently in remission."
    explanation: >-
      Records the insertional-oncogenesis risk of retroviral gene therapy — a
      treatment-related leukaemia in the long-term cohort — so the entry does
      not present gene therapy as risk-free.
  notes: >-
    Retroviral vectors carry an insertional-oncogenesis risk that is not
    hypothetical: one treatment-related T-cell leukaemia occurred in the 43-patient
    long-term ADA-SCID cohort. The authors nonetheless judge the risk-benefit
    balance favourable and call for continued long-term safety monitoring.
- name: Enzyme replacement therapy with pegademase (PEG-ADA)
  description: >-
    For ADA deficiency, enzyme replacement therapy with PEGylated adenosine
    deaminase corrects the metabolic defect, providing protection against infection;
    it is often used to stabilize patients before curative HSCT or gene therapy.
  treatment_term:
    preferred_term: enzyme replacement or supplementation therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
    therapeutic_agent:
    - preferred_term: pegademase bovine
      term:
        id: NCIT:C77484
        label: Pegademase Bovine
  target_mechanisms:
  - target: Toxic purine metabolite accumulation
    treatment_effect: INHIBITS
    description: Exogenous PEGylated ADA clears toxic deoxyadenosine/adenosine, correcting the lymphotoxic metabolic defect.
  evidence:
  - reference: PMID:20301656
    reference_title: "Adenosine Deaminase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "enzyme replacement therapy (ERT) by intramuscular administration of PEGylated ADA"
    explanation: Enzyme replacement therapy with PEGylated ADA is a targeted treatment correcting the ADA metabolic defect.
  - reference: PMID:20301656
    reference_title: "Adenosine Deaminase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Often, ERT is initiated first to rapidly correct the metabolic defect and to protect against serious infections as well as neurologic/behavioral abnormalities. It is discontinued at the time HSCT or HSC-GT is performed."
    explanation: >-
      Supports the bridging role asserted in this treatment's description, and
      specifies that ERT is stopped once curative therapy is delivered rather
      than continued alongside it.
  notes: >-
    ERT is a bridge, not an endpoint: it is started to correct the metabolite
    burden quickly and is discontinued when HSCT or gene therapy is performed.
    Prolonged ERT with declining lymphocyte counts is itself a trigger for
    lymphoma surveillance.
- name: Immunoglobulin replacement therapy
  description: >-
    Intravenous (or subcutaneous) immunoglobulin replacement provides passive humoral
    protection while patients await or recover from definitive immune reconstitution.
  treatment_term:
    preferred_term: immunoglobulin infusion therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_phenotypes:
  - preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  evidence:
  - reference: PMID:20301656
    reference_title: "Adenosine Deaminase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "use of immunoglobulin infusions and antibiotics, particularly prophylaxis against Pneumocystis jirovecii pneumonia"
    explanation: Immunoglobulin infusions are an explicit part of supportive management for the profound antibody deficiency seen in SCID.
- name: Pneumocystis jirovecii pneumonia prophylaxis
  description: >-
    Antimicrobial prophylaxis, particularly against Pneumocystis jirovecii pneumonia,
    is a standard supportive measure to prevent opportunistic infection pending
    immune reconstitution.
  treatment_term:
    preferred_term: antimicrobial agent therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Pneumonia
    term:
      id: HP:0002090
      label: Pneumonia
  evidence:
  - reference: PMID:20301656
    reference_title: "Adenosine Deaminase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "particularly prophylaxis against Pneumocystis jirovecii pneumonia (formerly Pneumocystis carinii) and fungal infections"
    explanation: Prophylaxis against Pneumocystis jirovecii pneumonia is a standard supportive measure in SCID.
- name: Protective isolation and avoidance of live vaccines and non-irradiated blood products
  description: >-
    Until immune reconstitution is achieved, exposure avoidance is itself
    treatment. Live viral vaccines — given to the infant or to household contacts
    — can cause disseminated vaccine-strain disease; non-irradiated blood products
    can cause transfusion-associated graft-versus-host disease in a patient with
    no T cells to reject donor lymphocytes; and breast milk is withheld pending
    maternal CMV status. Live rotavirus vaccine is the specific exposure that
    newborn-screening programmes act on first, because it is administered at the
    age at which screened infants are still awaiting definitive therapy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: infection-exposure avoidance and protective isolation
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  evidence:
  - reference: PMID:20301584
    reference_title: "X-Linked Severe Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "live viral vaccines for the affected individual as well as household contacts; transfusion of non-irradiated blood products"
    explanation: >-
      Names the two exposures this treatment exists to prevent, including the
      household-contact extension of the live-vaccine restriction.
  - reference: PMID:25138334
    reference_title: "Newborn screening for severe combined immunodeficiency in 11 screening programs in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All infants with T-cell lymphopenia were directed to avoid infectious exposures, transfusions (except with cytomegalovirus-negative, irradiated blood products), and live rotavirus vaccines until such time as immune compromise was no longer present."
    explanation: >-
      Documents this as applied practice across 11 newborn-screening programmes,
      including the CMV-negative irradiated-product qualifier and the
      live-rotavirus-vaccine restriction.
prevalence:
- population: United States (11 TREC newborn-screening programs, 3,030,083 infants)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.7
  rate_low: 1.25
  rate_high: 2.17
  notes: >-
    Population-based TREC newborn screening across 11 US programs identified
    SCID in 1 in 58,000 infants (95% CI 1/46,000-1/80,000), i.e. 1.7 per
    100,000 (CI 1.25-2.17). This is substantially higher than the ~1 in 100,000
    incidence previously inferred from retrospective clinical diagnoses,
    reflecting under-ascertainment of infants who died of infection before
    diagnosis.
  evidence:
  - reference: PMID:25138334
    reference_title: "Newborn screening for severe combined immunodeficiency in 11 screening programs in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Newborn screening in 11 programs in the United States identified SCID in 1 in 58 000 infants, with high survival."
    explanation: Provides the population-based US birth prevalence of SCID from universal TREC newborn screening.
  - reference: PMID:25138334
    reference_title: "Newborn screening for severe combined immunodeficiency in 11 screening programs in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Newborn screening has provided a new, population-based incidence of SCID of 1 in 58 000 births, higher than the incidence of 1 in 100 000 suggested from retrospective clinical diagnoses."
    explanation: Documents that newborn screening revised the SCID incidence upward relative to retrospective clinical ascertainment.
  - reference: PMID:33551023
    reference_title: "SCID newborn screening: What we've learned."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "by 2019 all states in the United States had adopted versions of it in their public health programs"
    explanation: >-
      Supports the universality of US TREC newborn screening (the basis for
      population-level ascertainment) but does not itself report an incidence
      figure; it was previously cited as the source of the 1/58,000 number,
      which it does not contain.
- population: Navajo Nation (Navajo Area Indian Health Service TREC screening)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 28.6
  rate_low: 25.0
  rate_high: 158.7
  notes: >-
    A founder effect, not a different disease. SCID birth prevalence in the
    Navajo Nation is roughly 1 in 3,500 (95% CI 1/630-1/4,000), about seventeen
    times the overall US screened rate, driven by a frequent DCLRE1C (Artemis)
    founder variant estimated to cause SCID in 1 in 2,000 births. Rates
    converted from the reported 1-in-N figures; the confidence interval is wide
    because the screened denominator is small.
  evidence:
  - reference: PMID:25138334
    reference_title: "Newborn screening for severe combined immunodeficiency in 11 screening programs in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence was not significantly different in any state program but as expected was higher in the Navajo Nation (1/3500; 95%CI, 1/630-1/4000), where a frequent founder mutation in DCLRE1C, encoding a DNA repair protein, causes SCID in an estimated 1 in 2000 births."
    explanation: Gives the Navajo Nation birth prevalence, its confidence interval, and the DCLRE1C founder variant responsible.
- population: Worldwide (literature estimate, per live birth)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.9
  rate_low: 1.33
  rate_high: 2.5
  notes: >-
    Review estimate of 1 in 40,000 to 1 in 75,000 live births (1.33-2.5 per
    100,000), recorded alongside the US screened figure because it is derived
    from the literature rather than from a single screened population. It is
    consistent with the 1-in-58,000 US newborn-screening result and above the
    older 1-in-100,000 retrospective clinical estimate.
  evidence:
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of SCID varies between 1 in 40,000 to 75,000 per live birth."
    explanation: Supplies the worldwide literature range for SCID birth incidence.
progression:
- phase: Onset of symptoms in infancy
  age_range: First months of life
  notes: >-
    In a 277-child Indian multi-institutional cohort the median age of symptom
    onset was 2.5 months and the median age at diagnosis 5 months — a roughly
    2.5-month diagnostic lag during which infants are unprotected.
  evidence:
  - reference: PMID:33628209
    reference_title: "Clinical, Immunological, and Molecular Features of Severe Combined Immune Deficiency: A Multi-Institutional Experience From India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median (inter-quartile range) age of onset of clinical symptoms and diagnosis was 2.5 months (1, 5) and 5 months (3.5, 8), respectively."
    explanation: Gives the median ages of symptom onset and of diagnosis in a large clinically ascertained SCID cohort.
- phase: Clinical presentation before newborn screening
  subtype: X-linked SCID
  age_range: Three to six months
  notes: >-
    The historical presentation, and still the presentation wherever TREC
    screening is not in place: infants come to attention only once recurrent,
    persistent, or opportunistic infection has begun.
  evidence:
  - reference: PMID:20301584
    reference_title: "X-Linked Severe Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prior to universal newborn screening (NBS) for SCID most males with typical X-SCID came to medical attention between ages three and six months because of recurrent infections, persistent infections, and infections with opportunistic organisms."
    explanation: Gives the pre-screening age and mode of presentation for typical X-SCID.
- phase: Presymptomatic detection by newborn screening
  subtype: X-linked SCID
  age_range: First weeks of life
  notes: >-
    Newborn screening did not just move diagnosis earlier, it changed what the
    disease looks like at presentation: the typical index case is now a
    well-appearing infant with an abnormal TREC result rather than a sick one.
  evidence:
  - reference: PMID:20301584
    reference_title: "X-Linked Severe Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With universal NBS for SCID, the common presentation for typical X-SCID is now an asymptomatic, healthy-appearing male infant."
    explanation: Documents the shift to presymptomatic presentation under universal newborn screening.
- phase: Later-onset atypical disease
  subtype: X-linked SCID
  age_range: First years of life or later
  notes: >-
    Hypomorphic IL2RG alleles produce a later-onset spectrum that newborn
    screening usually does not catch, dominated by immune dysregulation rather
    than by the absent-immunity picture of typical SCID.
  evidence:
  - reference: PMID:20301584
    reference_title: "X-Linked Severe Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotypic spectrum of X-linked severe combined immunodeficiency (X-SCID) ranges from typical X-SCID (early-onset disease in males that is fatal if not treated with hematopoietic stem cell transplantation [HSCT] or gene therapy) to atypical X-SCID (later-onset disease comprising phenotypes caused by variable immunodeficiency, immune dysregulation, and/or autoimmunity)."
    explanation: Defines the typical/atypical split and places atypical disease at later onset.
  - reference: PMID:20301584
    reference_title: "X-Linked Severe Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recurrent upper and lower respiratory tract infections with bronchiectasis; Omenn syndrome, a clinical phenotype caused by immune dysregulation; X-SCID combined immunodeficiency (often with recurrent infections, warts, and dermatitis); immune dysregulation and autoimmunity; or Epstein-Barr virus-related lymphoproliferative complications."
    explanation: Enumerates the specific later-onset atypical X-SCID presentations.
- phase: Death in infancy without immune reconstitution
  age_range: First one to two years
  notes: >-
    Untreated SCID is uniformly fatal in early childhood; the ADA-SCID figure
    below is the best-quantified example.
  evidence:
  - reference: PMID:20301656
    reference_title: "Adenosine Deaminase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If immune function is not restored with enzyme replacement therapy (ERT), gene therapy, or hematopoietic stem cell transplantation (HSCT), children with ADA-SCID rarely survive beyond age one to two years."
    explanation: States the untreated natural history and the three interventions that alter it.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Untreated SCID is fatal in infancy, and the only treatments that change that
    are transplantation, gene therapy, or (for ADA) enzyme replacement — each of
    which requires specialist centres, conditioning chemotherapy, and prolonged
    protective isolation. Where those services are not readily accessible the
    burden is starkly visible: in a 277-child Indian cohort only 8.3% reached
    transplant and 75.8% died. Where newborn screening and transplant are
    available, survival exceeds 85%, so the burden is dominated by access and by
    time-to-diagnosis rather than by any intrinsic untreatability.
  evidence:
  - reference: PMID:33628209
    reference_title: "Clinical, Immunological, and Molecular Features of Severe Combined Immune Deficiency: A Multi-Institutional Experience From India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 23 children (8.3%) received hematopoietic stem cell transplantation (HSCT). Of these, 11 are doing well post-HSCT. Mortality was recorded in 210 children (75.8%)."
    explanation: Quantifies mortality and the low proportion reaching curative therapy in a setting without newborn screening.
  - reference: PMID:25138334
    reference_title: "Newborn screening for severe combined immunodeficiency in 11 screening programs in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "overall SCID survival was 45 of 52 (87%), while 45 of 49 treated infants (92%) survived"
    explanation: Gives the contrasting survival achievable with newborn screening and prompt definitive therapy.
diagnosis:
- name: Lymphocyte subset flow cytometry
  description: >-
    Flow cytometric enumeration of T, B, and NK cells — with naive/memory CD4
    subsetting — is the confirmatory test after an abnormal newborn screen and
    the routine route to diagnosis outside screening programmes. The T/B/NK
    pattern also assigns the likely mechanism class before sequencing returns.
  diagnosis_term:
    preferred_term: flow cytometry procedure
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Though the diagnosis of SCID is usually established by flow cytometry-based tests, genetic diagnosis is often needed for genetic counselling, prognostication, and modification of pre-transplant chemotherapeutic agents."
    explanation: Establishes flow cytometry as the usual diagnostic modality and states why genetic testing is still required.
- name: TREC newborn screening
  description: >-
    Quantification of T-cell receptor excision circles by PCR on Guthrie-card
    dried blood spots detects failed thymic T-cell output before infection
    begins. It is the first immune disorder accepted for population-based
    screening and is now universal across US states.
  diagnosis_term:
    preferred_term: newborn screening
    term:
      id: NCIT:C81178
      label: Newborn Screening
  notes: >-
    The assay measures a by-product of T-cell receptor recombination, so it is
    blind to defects acting *after* that step. MHC class II deficiency, ZAP70
    deficiency, and late-onset ADA deficiency can all screen normal — a real
    false-negative class rather than an assay-quality problem.
  evidence:
  - reference: PMID:33551023
    reference_title: "SCID newborn screening: What we've learned."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The T-cell receptor excision circle test, developed in 2005, proved to be successful in pilot studies starting in the period 2008 to 2010, and by 2019 all states in the United States had adopted versions of it in their public health programs."
    explanation: Documents the TREC test and its adoption as universal US newborn screening.
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Assessment of T cell receptor excision circles (TRECs) in the dried blood spots is an effective screening method developed in the United States for the identification of infants with SCID patients and other forms of T-cell lymphopenia."
    explanation: Describes the assay substrate and its target condition.
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "normal TREC levels can be seen in defects of lymphocyte maturation beyond VDJ recombination steps such as ZAP70 defect and MHC class II deficiency"
    explanation: Records the systematic blind spot of TREC screening noted for this test.
  - reference: PMID:25138334
    reference_title: "Newborn screening for severe combined immunodeficiency in 11 screening programs in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "more than 80% lack a positive family history"
    explanation: >-
      Explains why population-wide screening rather than targeted family testing
      is required: most affected infants have no family history to prompt it.
- name: Molecular genetic testing
  description: >-
    Sanger or next-generation sequencing identifies the causative gene. Beyond
    confirming the diagnosis, the genotype changes management: it determines
    genetic counselling, prognosis, and whether alkylator-based pre-transplant
    conditioning is safe.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic diagnosis can be established by Sanger or Next-Generation sequencing (NGS)."
    explanation: Names the sequencing modalities used for molecular diagnosis of SCID.
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Though the diagnosis of SCID is usually established by flow cytometry-based tests, genetic diagnosis is often needed for genetic counselling, prognostication, and modification of pre-transplant chemotherapeutic agents."
    explanation: Supports the three management consequences of the genotype asserted in this description.
- name: ADA enzyme and metabolite testing
  description: >-
    ADA deficiency has a biochemical diagnosis independent of the immune
    phenotype: red-cell ADA catalytic activity below 1%, or elevated adenosine
    and deoxyadenosine on tandem mass spectrometry. The metabolite assay also
    detects the later-onset ADA-CID cases that TREC screening misses.
  diagnosis_term:
    preferred_term: biochemical enzyme and metabolite assay
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  notes: >-
    `diagnosis_term` is bound to a generic NCIT action term because NCIT has no
    clinical-action term for red-cell enzyme activity or tandem
    mass-spectrometry metabolite quantitation specific enough to be worth
    asserting; the free-text `preferred_term` carries the actual test.
  evidence:
  - reference: PMID:20301656
    reference_title: "Adenosine Deaminase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ADA deficiency is established in a proband with suggestive findings either by biochemical testing showing <1% of ADA catalytic activity in red blood cells or in extracts of dried blood spots (valid in untransfused individuals), or by molecular genetic testing identifying biallelic pathogenic variants in ADA."
    explanation: Gives the biochemical diagnostic threshold and its molecular alternative.
  - reference: PMID:20301656
    reference_title: "Adenosine Deaminase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening specific for ADA deficiency can also be performed by detection of elevated levels of adenosine (Ado) and deoxyadenosine (dAdo) by tandem mass spectrometry (TMS)."
    explanation: Documents the tandem mass-spectrometry metabolite screen for ADA deficiency.
definitions:
- name: PIDTC 2022 typical SCID criteria
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Typical SCID requires fewer than 0.05 x 10^9 autologous T cells/L on
    repetitive testing, plus at least one of: a pathogenic variant in a
    SCID-associated gene; very low or undetectable TRECs or under 20% of CD4 T
    cells expressing naive markers; or transplacentally engrafted maternal T
    cells.
  evidence:
  - reference: PMID:36456361
    reference_title: "The diagnosis of severe combined immunodeficiency (SCID): The Primary Immune Deficiency Treatment Consortium (PIDTC) 2022 Definitions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with typical SCID must have less than 0.05 × 109 autologous T cells/L on repetitive testing, with either pathogenic variant(s) in a SCID-associated gene, very low/undetectable T-cell receptor excision circles or less than 20% of CD4 T cells expressing naive markers, and/or transplacental maternally engrafted T cells."
    explanation: The PIDTC 2022 consensus definition of typical SCID quoted verbatim.
- name: PIDTC 2022 leaky/atypical SCID criteria
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Leaky/atypical SCID covers patients with less profoundly impaired autologous
    T-cell differentiation, requiring two or more of: low T-cell numbers,
    oligoclonal T cells, low TRECs, and under 20% of CD4 T cells expressing naive
    markers, together with either a pathogenic SCID-gene variant or reduced
    T-cell proliferation to certain mitogens.
  evidence:
  - reference: PMID:36456361
    reference_title: "The diagnosis of severe combined immunodeficiency (SCID): The Primary Immune Deficiency Treatment Consortium (PIDTC) 2022 Definitions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with less profoundly impaired autologous T-cell differentiation are designated as having leaky/atypical SCID, with 2 or more of these: low T-cell numbers, oligoclonal T cells, low T-cell receptor excision circles, and less than 20% of CD4 T cells expressing naive markers."
    explanation: The PIDTC 2022 consensus definition of leaky/atypical SCID quoted verbatim.
- name: PIDTC 2022 Omenn syndrome criteria
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Omenn syndrome requires a generalized erythematous rash and absent
    transplacentally acquired maternal engraftment, plus two or more of
    eosinophilia, elevated IgE, lymphadenopathy, and hepatosplenomegaly.
  evidence:
  - reference: PMID:36456361
    reference_title: "The diagnosis of severe combined immunodeficiency (SCID): The Primary Immune Deficiency Treatment Consortium (PIDTC) 2022 Definitions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Omenn syndrome requires a generalized erythematous rash, absent transplacentally acquired maternal engraftment, and 2 or more of these: eosinophilia, elevated IgE, lymphadenopathy, hepatosplenomegaly."
    explanation: The PIDTC 2022 consensus definition of Omenn syndrome quoted verbatim.
- name: PIDTC 2022 scope exclusion
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Thymic stromal defects and other causes of secondary T-cell deficiency are
    excluded from the definition of SCID. This is why complete DiGeorge syndrome
    and FOXN1 athymia, which also present with profound T-cell lymphopenia and an
    absent thymic shadow, are not curated as SCID subtypes here.
  evidence:
  - reference: PMID:36456361
    reference_title: "The diagnosis of severe combined immunodeficiency (SCID): The Primary Immune Deficiency Treatment Consortium (PIDTC) 2022 Definitions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thymic stromal defects and other causes of secondary T-cell deficiency are excluded from the definition of SCID."
    explanation: States the boundary the consensus definition draws around SCID.
notes: >-
  SCID is curated as a CURATE_ROOT_WITH_SUBTYPES entry: the root captures the shared
  final-common-pathway mechanism (gene defect -> blocked T-lymphocyte development ->
  absent adaptive immunity -> early life-threatening infection and failure to thrive),
  while has_subtypes records the major genetic forms grouped by mechanism class
  (cytokine signaling: IL2RG/JAK3/IL7R; V(D)J recombination/DNA repair: RAG1/RAG2/
  DCLRE1C; purine metabolism: ADA; haematopoietic precursor survival: AK2/reticular
  dysgenesis). Immunophenotypes follow the classic T/B/NK framework. Newborn screening
  uses the T-cell receptor excision circle (TREC) assay.

  Two things this entry deliberately does not do. It does not enumerate every SCID
  gene: more than 20 are described, and PRKDC, LIG4, NHEJ1, CD45/PTPRC, the CD3
  subunits, CORO1A, PNP, and IL2RA all fall inside one of the four mechanism classes
  already modelled, so adding them would multiply subtypes without adding a mechanism.
  And it does not assert a single per-gene case fraction: `genetic[].case_fractions`
  records IL2RG, RAG1, IL7R, and ADA shares separately per cohort, because the numbers
  differ by roughly twofold between referral-centre series and population-based newborn
  screening, and by ancestry. The 19%-versus-"nearly half" gap for IL2RG is an
  ascertainment artefact that PMID:25138334 diagnoses explicitly; presenting either
  figure alone would be wrong.

      snippet: "Molecular diagnosis was obtained in 162 patients - IL2RG (36), RAG1 (26), ADA (19), RAG2 (17), JAK3 (15), DCLRE1C (13), IL7RA (9)"
      explanation: Gives the IL2RG count and cohort denominator behind this case fraction.

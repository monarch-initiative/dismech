    receptor assembly; RAG1 defects are among the most common autosomal recessive
    causes of SCID, especially in consanguineous populations.
  case_fractions:
  - population: United States, 11 TREC newborn-screening programs (52 screened SCID cases)
    case_fraction_percent: 15.0
    cohort_size: 52
    notes: >-

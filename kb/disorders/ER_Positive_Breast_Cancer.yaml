name: ER-Positive Breast Cancer
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Estrogen receptor-positive (ER+) breast cancer is the most common molecularly-defined
  subtype of breast cancer, representing approximately 70-80% of cases. It is
  characterized by expression of estrogen receptor alpha (ERα), which drives tumor
  growth in response to estrogen. ER+ breast cancer encompasses the luminal A and
  luminal B intrinsic subtypes, with generally favorable prognosis especially for
  luminal A tumors. Treatment centers on endocrine therapy to block estrogen signaling,
  with CDK4/6 inhibitors revolutionizing treatment of metastatic disease.
categories:
- Molecularly-Defined Cancer
- Breast Cancer Subtype
- Solid Tumor
parents:
- breast carcinoma
has_subtypes:
- name: Luminal A Breast Cancer
  subtype_term:
    preferred_term: luminal A breast carcinoma
    term:
      id: MONDO:0021116
      label: luminal A breast carcinoma
  description: >-
    ER+/HER2- with low proliferation (Ki-67 <20%). Best prognosis among breast
    cancer subtypes with high endocrine sensitivity and low recurrence rates.
    Often does not require chemotherapy.
  evidence:
  - reference: PMID:19436038
    reference_title: "Ki67 index, HER2 status, and prognosis of patients with luminal B breast cancer."
    supports: PARTIAL
    snippet: >-
      Luminal B tumors have higher proliferation and poorer prognosis than luminal
      A tumors.
    explanation: >-
      Supports luminal A versus luminal B prognostic and proliferation differences,
      but does not directly support all subtype-defining criteria in this descriptor.
- name: Luminal B Breast Cancer
  subtype_term:
    preferred_term: luminal B breast carcinoma
    term:
      id: MONDO:0021115
      label: luminal B breast carcinoma
  description: >-
    ER+/HER2- with high proliferation (Ki-67 ≥20%) or ER+/HER2+. Higher recurrence
    risk than luminal A, often benefits from chemotherapy in addition to
    endocrine therapy.
  evidence:
  - reference: PMID:19436038
    reference_title: "Ki67 index, HER2 status, and prognosis of patients with luminal B breast cancer."
    supports: PARTIAL
    snippet: >-
      the 10-year breast cancer-specific survival was 79% (95% CI = 76% to 83%)
      for luminal A, 64% (95% CI = 59% to 70%) for luminal B
    explanation: >-
      Supports worse survival for luminal B versus luminal A, but does not directly
      support all biomarker and treatment details in this descriptor.
pathophysiology:
- name: Estrogen Receptor Activation
  description: >-
    ER+ breast cancer is driven by estrogen-dependent activation of the estrogen
    receptor alpha (ERα), a nuclear hormone receptor that functions as a
    ligand-activated transcription factor. Estrogen binding induces receptor
    dimerization, DNA binding, and transcriptional activation of target genes.
  evidence:
  - reference: PMID:41549581
    reference_title: "Targeting Estrogen Pathways in Breast Cancer: A Review of Current Therapies and Emerging Strategies."
    supports: PARTIAL
    snippet: At the heart of this subtype is the estrogen signaling pathway, especially the estrogen receptor alpha (ERα), which plays a major role in the development, growth, and response to these cancers.
    explanation: This supports ERalpha pathway centrality, but not the full mechanistic detail in this descriptor.
  cell_types:
  - preferred_term: luminal epithelial cell of mammary gland
    term:
      id: CL:0002326
      label: luminal epithelial cell of mammary gland
  biological_processes:
  - preferred_term: intracellular estrogen receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0030520
      label: estrogen receptor signaling pathway
  downstream:
  - target: Estrogen-Driven Transcription
    description: Activated ER binds DNA and regulates target genes
- name: Estrogen-Driven Transcription
  description: >-
    Activated ERα binds estrogen response elements (EREs) in target gene promoters,
    recruiting coactivators and driving transcription of genes promoting cell
    cycle progression (CCND1), survival (BCL2), and growth factor signaling
    (IGF1R, EGFR). This creates estrogen-dependent tumor growth.
  biological_processes:
  - preferred_term: positive regulation of transcription by RNA polymerase II
    modifier: INCREASED
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
  downstream:
  - target: Cell Cycle Progression
    description: ER target genes drive proliferation
- name: Cell Cycle Progression
  conforms_to: "evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control"
  description: >-
    ER signaling drives expression of cyclin D1 (CCND1), which complexes with
    CDK4/6 to phosphorylate Rb and promote G1-S transition. This creates the
    therapeutic rationale for CDK4/6 inhibitors in ER+ breast cancer. The
    cyclin D1-CDK4/6-Rb axis is the loss-of-cell-cycle-checkpoint-control node of
    the evading-growth-suppressors hallmark, substituting ER-driven cyclin D1
    overexpression for the module's generic RB/p53-axis lesion.
  biological_processes:
  - preferred_term: G1/S transition of mitotic cell cycle
    modifier: INCREASED
    term:
      id: GO:0000082
      label: G1/S transition of mitotic cell cycle
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
- name: PI3K-AKT-mTOR Pathway Activation
  conforms_to: "sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation"
  description: >-
    Activating PIK3CA hotspot mutations (E542K, E545K, H1047R; ~40% of HR+
    tumors), AKT1 E17K mutation, and PTEN loss drive constitutive PI3K-AKT-mTOR
    signaling. This pathway cross-talks with and can bypass ER signaling,
    sustaining proliferation and survival and contributing to endocrine
    resistance. It is the therapeutic target of alpelisib (PI3Kalpha),
    capivasertib (AKT), and everolimus (mTOR). This is the
    constitutive-mitogenic-pathway-activation node of the
    sustaining-proliferative-signaling hallmark,
    substituting the PIK3CA/AKT1/PTEN lesion for the module's generic RTK/RAS/PI3K
    driver.
  biological_processes:
  - preferred_term: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: INCREASED
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  - preferred_term: TOR signaling
    modifier: INCREASED
    term:
      id: GO:0031929
      label: TOR signaling
  evidence:
  - reference: PMID:23000897
    reference_title: "Comprehensive molecular portraits of human breast tumours."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Somatic mutations in only three genes (TP53, PIK3CA and GATA3)
      occurred at >10% incidence across all breast cancers
    explanation: >-
      TCGA identifies PIK3CA as one of the three most recurrently mutated genes in
      breast cancer, establishing PI3K-pathway activation as a core somatic driver
      (enriched in the luminal/ER+ subtypes).
  - reference: PMID:31091374
    reference_title: "Alpelisib for PIK3CA-Mutated, Hormone Receptor-Positive Advanced Breast Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PIK3CA mutations occur in approximately 40% of patients with hormone
    explanation: >-
      SOLAR-1 quantifies PIK3CA mutation frequency (~40%) in HR+/HER2- breast
      cancer, the actionable lesion targeted by alpelisib.
- name: ESR1 Mutation-Driven Endocrine Resistance
  description: >-
    ESR1 ligand-binding-domain missense mutations (hotspots Y537S, Y537N, Y537C,
    D538G) produce constitutive, ligand-independent ER activation. These are rare
    in primary tumors but emerge in a substantial fraction of
    aromatase-inhibitor-pretreated metastatic tumors, conferring acquired
    resistance to estrogen
    deprivation. This node is the rationale for oral SERDs (elacestrant) active
    against ESR1-mutant disease.
  biological_processes:
  - preferred_term: constitutive ligand-independent estrogen receptor signaling
    modifier: INCREASED
    term:
      id: GO:0030520
      label: estrogen receptor signaling pathway
  evidence:
  - reference: PMID:34392831
    reference_title: "ESR1 mutation as an emerging clinical biomarker in metastatic hormone receptor-positive breast cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ESR1 mutations are a common cause of acquired resistance to the backbone of
      therapy, estrogen deprivation by aromatase inhibition
    explanation: >-
      Establishes ESR1 ligand-binding-domain mutation as a principal mechanism of
      acquired resistance to aromatase-inhibitor endocrine therapy in metastatic
      HR+ disease.

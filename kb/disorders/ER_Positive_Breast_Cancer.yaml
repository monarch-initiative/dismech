- name: Fulvestrant
  description: >-
    Selective estrogen receptor degrader (SERD) that binds ER, blocking its
    function and promoting its degradation. Used in metastatic disease,
    particularly after progression on other endocrine therapy, and as the
    endocrine backbone for combination with CDK4/6, PI3K, and AKT inhibitors.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Estrogen Receptor Activation
    treatment_effect: INHIBITS
    description: >-
      Fulvestrant competitively binds ER, blocks receptor dimerization and
      function, and promotes ER degradation, shutting down estrogen-driven ER
      signaling.
  evidence:
  - reference: PMID:26947331
    reference_title: "Fulvestrant plus palbociclib versus fulvestrant plus placebo for treatment of hormone-receptor-positive, HER2-negative metastatic breast cancer that progressed on previous endocrine therapy (PALOMA-3): final analysis of the multicentre, double-blind, phase 3 randomised controlled trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fulvestrant plus palbociclib was associated with significant and consistent
      improvement in progression-free survival compared with fulvestrant plus
      placebo
    explanation: >-
      PALOMA-3 supports fulvestrant as the endocrine backbone in
      HR+/HER2-negative metastatic disease when combined with a CDK4/6 inhibitor;
      the design does not
      isolate fulvestrant monotherapy efficacy, hence PARTIAL.
  treatment_term:

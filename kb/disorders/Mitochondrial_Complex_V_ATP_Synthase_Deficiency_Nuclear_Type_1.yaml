      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In this case biosynthesis of ATPase is down-regulated due to a block at the early stage of enzyme assembly-formation of the F(1) catalytic part."
      explanation: >-
        The review's statement of the causal step: the assembly block is what
        produces the enzyme deficiency.
  evidence:
  - reference: PMID:19933271
    reference_title: "Defining the pathogenesis of the human Atp12p W94R mutation using a Saccharomyces cerevisiae yeast model."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Studies in yeast have shown that a deficiency in Atp12p prevents assembly of the extrinsic domain (F(1)) of complex V and renders cells unable to make ATP through oxidative phosphorylation."
    explanation: The conserved assembly-factor function that the disease allele removes.
  - reference: PMID:33238568
    reference_title: "Human Mitochondrial Pathologies of the Respiratory Chain and ATP Synthase: Contributions from Studies of Saccharomyces cerevisiae."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ATPAF2, the homolog of the yeast Atp12 chaperone that interacts with the α subunit of F1 during assembly of this ATP synthase module"
    explanation: The molecular identity of the lost function.

- name: Progressive Neurodegeneration with Energy Failure
  biological_scale: ORGANISM
  description: >-
    Failure of aerobic ATP synthesis produces lactic acidosis with
    3-methylglutaconic aciduria, and in the developing brain a progressive
    degeneration — cortical-subcortical atrophy followed within months by
    basal ganglia atrophy — with severe developmental impairment. The child
    died at 14 months during an intercurrent infection, consistent with the
    heightened vulnerability of mitochondrial disease to catabolic stress.
  downstream:

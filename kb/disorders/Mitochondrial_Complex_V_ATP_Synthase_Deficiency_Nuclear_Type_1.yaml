    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Lactic Acidosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39016153
    reference_title: "Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A homozygous c.280T>A substitution in ATPAF2 gene was found in a girl with dysmorphic features, cortical- subcortical brain atrophy followed by basal ganglia atrophy and metabolic acidosis, who died at the age of 14 months."
    explanation: The progressive neurodegenerative and metabolic course of the single case.

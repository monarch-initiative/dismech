experimental_models:
- name: Saccharomyces cerevisiae atp12 deletion / humanized ATPAF2 strain
  experimental_model_type: OTHER
  description: >-
    The functional proof of pathogenicity for the single human allele. A yeast
    atp12 deletion loses F1 assembly and respiratory growth; plasmid-borne
    wild-type human ATPAF2 rescues it, and the W94R mutant protein is
    insoluble in that background. The equivalent yeast substitution behaves
    differently unless the yeast-specific factor Fmc1p is also removed, so
    the humanized-rescue arm, not the yeast-mutant arm, is the informative
    comparison for the human disease.
  evidence:
  - reference: PMID:19933271
    reference_title: "Defining the pathogenesis of the human Atp12p W94R mutation using a Saccharomyces cerevisiae yeast model."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We have investigated the impact of the pathogenic W94R mutation on Atp12p structure/function."
    explanation: >-
      States the purpose of the model; graded OTHER because yeast is neither
      an animal model nor a cultured-cell system in this schema's sense.
  modeled_mechanisms:
  - target: Loss of ATP12 F1 Assembly Factor Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The humanized system reproduces the loss of function: wild-type human
      Atp12p complements the yeast deletion, while the patient's W94R protein
      is insoluble and cannot.
    limitations: >-
      Yeast Atp12p operates alongside Fmc1p, a yeast mitochondrial protein
      not found in higher eukaryotes, and the yeast-equivalent substitution
      (W103R) is soluble unless FMC1 is also deleted — so the yeast-native
      arm of the model diverges from human biology and only the
      humanized-rescue arm carries over.
    readouts:
    - name: Respiratory growth rescue by human ATPAF2
      target: Loss of ATP12 F1 Assembly Factor Function
      direction: RESTORED
      interpretation: >-
        Wild-type human Atp12p restores respiratory growth of the deletion
        strain, demonstrating conserved assembly-factor function that the
        disease allele lacks.
      evidence:
      - reference: PMID:19933271
        reference_title: "Defining the pathogenesis of the human Atp12p W94R mutation using a Saccharomyces cerevisiae yeast model."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "Plasmid-borne wild type human Atp12p rescues the respiratory defect of a yeast ATP12 deletion mutant (Deltaatp12)."
        explanation: The complementation measurement behind this readout.
    evidence:
    - reference: PMID:19933271
      reference_title: "Defining the pathogenesis of the human Atp12p W94R mutation using a Saccharomyces cerevisiae yeast model."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "we provide evidence that the primary effect of the substitution is on the dynamic properties of Atp12p"
      explanation: >-
        The model's mechanistic conclusion about how W94R destroys the
        assembly-factor function.
treatments:
- name: Supportive Care
  description: >-
    No ATPAF2-specific therapy, trial, or treatment-response report exists.
    Management is supportive and phenotype-directed, following general
    mitochondrial-disease practice: nutritional support, antiseizure therapy
    where needed, and avoidance of fasting and catabolic stress during
    intercurrent illness.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
notes: >-
  Entry created as part of the mitochondrial ATP synthase deficiency tranche
  surfaced by the human genetic-interaction BPM pilot
  (experiments/human_gi_bpm/): ATPAF2 sits in the OXPHOS query module of the
  Billmann 2026 HAP1 map. A single-patient disease: every clinical claim here
  derives from the one 2004 index case (PMID:14757859), whose clinical detail
  is quoted via the cached full texts of the 2024 systematic review
  (PMID:39016153) and the 2020 yeast-contributions review (PMID:33238568)
  because the index paper's abstract carries only the molecular finding.
  Sibling entries: Nuclear Type 2 (TMEM70) and Nuclear Type 3 (ATP5F1E); the
  maternally inherited MT-ATP6/MT-ATP8 diseases are separate entries.

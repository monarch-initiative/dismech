genetic:
- name: ATPAF2
  notes: >-
    ATPAF2 (17p11.2; historically ATP12) encodes a nuclear-encoded
    mitochondrial matrix protein that chaperones the F1 alpha subunit during
    assembly of the catalytic alpha3-beta3 hexamer of complex V. One
    pathogenic allele is known: c.280T>A (p.Trp94Arg), homozygous in the
    single reported patient. Tryptophan 94 is the most conserved position of
    the protein.
  gene_term:
    preferred_term: ATPAF2
    term:
      id: hgnc:18802
      label: ATPAF2
  relationship_type: CAUSATIVE
  variants:
  - name: ATPAF2 c.280T>A (p.Trp94Arg)
    description: >-
      The only reported disease-causing ATPAF2 allele, homozygous in the index
      patient from a consanguineous family. The substitution replaces a
      conserved neutral tryptophan with a basic arginine; in the yeast model
      it renders the human protein insoluble rather than altering its charge
      environment, implicating a change in the protein's dynamic properties.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:39016153
      reference_title: "Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "A homozygous c.280T>A substitution in ATPAF2 gene was found in a girl with dysmorphic features, cortical- subcortical brain atrophy followed by basal ganglia atrophy and metabolic acidosis, who died at the age of 14 months."
      explanation: The allele and its clinical context as summarized by the 2024 systematic review.
    - reference: PMID:19933271
      reference_title: "Defining the pathogenesis of the human Atp12p W94R mutation using a Saccharomyces cerevisiae yeast model."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The W94R mutation alters the protein at the most highly conserved position in the Pfam sequence and renders HuAtp12p insoluble in the background of Deltaatp12."
      explanation: Conservation and the biochemical consequence of the substitution in the yeast system.
  evidence:
  - reference: PMID:14757859
    reference_title: "Respiratory chain complex V deficiency due to a mutation in the assembly gene ATP12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extensive molecular analysis of five nuclear and two mitochondrial genes revealed a mutation in the ATP12 assembly gene in one patient."
    explanation: The index molecular diagnosis.
  - reference: PMID:14757859
    reference_title: "Respiratory chain complex V deficiency due to a mutation in the assembly gene ATP12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge, this is the first report of a pathogenic mutation in a human nuclear encoded ATPase assembly gene."
    explanation: Establishes the historic priority of ATPAF2 among nuclear assembly-gene causes.
pathophysiology:
- name: Loss of ATP12 F1 Assembly Factor Function
  biological_scale: MOLECULAR
  description: >-
    ATPAF2/Atp12 binds the F1 alpha subunit and prevents nonproductive
    alpha/beta aggregation during formation of the catalytic alpha3-beta3
    hexamer. The W94R substitution destroys this chaperone function — in the
    humanized yeast system the wild-type human protein rescues an atp12
    deletion while the mutant protein is insoluble — so the F1 catalytic head
    cannot be built.
  role: trigger
  genes:
  - preferred_term: ATPAF2
    term:
      id: hgnc:18802
      label: ATPAF2
  biological_processes:
  - preferred_term: mitochondrial ATP synthase complex assembly
    term:
      id: GO:0033615
      label: mitochondrial proton-transporting ATP synthase complex assembly
    modifier: DECREASED
  downstream:

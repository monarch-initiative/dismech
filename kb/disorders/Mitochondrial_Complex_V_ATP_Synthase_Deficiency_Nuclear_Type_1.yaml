name: Mitochondrial Complex V (ATP Synthase) Deficiency, Nuclear Type 1
creation_date: "2026-09-16T02:30:00Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex V (ATP synthase) deficiency, nuclear type 1
  term:
    id: MONDO:0011421
    label: mitochondrial complex V (ATP synthase) deficiency, nuclear type 1
description: >-
  Mitochondrial complex V (ATP synthase) deficiency nuclear type 1 (MC5DN1) is
  the ATPAF2-related form of isolated ATP synthase deficiency. ATPAF2
  (historically ATP12) is not a structural subunit but an assembly factor: the
  human homolog of the yeast Atp12 chaperone, which binds the F1 alpha subunit
  during construction of the catalytic alpha3-beta3 head and prevents its
  nonproductive aggregation. Its 2004 identification was the first report of a
  pathogenic mutation in a human nuclear-encoded ATPase assembly gene — before
  it, complex V deficiency had been attributed only to mitochondrial MT-ATP6
  mutations.

  The entire genetically confirmed literature is one patient: a girl born to
  healthy consanguineous Moroccan parents, homozygous for c.280T>A
  (p.Trp94Arg), with severe neonatal encephalopathy, dysmorphic features,
  lactic acidosis and 3-methylglutaconic aciduria, cortical-subcortical brain
  atrophy followed by basal ganglia atrophy, and death at 14 months during an
  intercurrent infection. The 2024 systematic review of ATP synthase disorders
  still lists a single ATPAF2 case, so every phenotype "frequency" here is an
  observation in one child, not a population estimate.

  The mechanistic case is nonetheless strong: patient tissues show severe,
  predominantly isolated loss of assembled complex V, and yeast provides the
  functional proof — wild-type human ATPAF2 rescues the respiratory defect of
  a yeast atp12 deletion, the mutant gene does not, and the W94R substitution
  falls at the most conserved position of the protein. MC5DN1 is distinguished
  from the far more common TMEM70-related MC5DN2, from the structural-subunit
  deficiency MC5DN3 (ATP5F1E), and from the maternally inherited
  MT-ATP6/MT-ATP8 diseases, all separate dismech entries.

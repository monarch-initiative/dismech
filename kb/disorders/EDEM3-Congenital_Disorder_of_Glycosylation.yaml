  notes: >-
    Twelve affected individuals from seven families in the single published
    series, two of them of Portuguese Romani origin. No later case reports
    are known.
  evidence:
  - reference: PMID:34143952
    reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
    supports: SUPPORT

  - reference: PMID:34143952
    reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In family 4, a bi-allelic nonsense variant, c.940A>T (p.Arg314∗), was found, resulting from maternal uniparental isodisomy of chromosome 1."

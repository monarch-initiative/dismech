experimental_models:
- name: EDEM3-CDG patient fibroblasts with EDEM3 complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Skin fibroblasts from affected individuals in families 1 and 3, studied by
    [2-3H]mannose pulse-chase N-glycan analysis before and after
    re-expression of wild-type EDEM3.
  publication: PMID:34143952
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Deficient ER Mannose Trimming
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Patient fibroblasts fail to trim M8B and M5 during the chase.
    limitations: >-
      Fibroblasts are not neural cells, so the model says nothing about the
      neurodevelopmental phenotype.
    evidence:
    - reference: PMID:34143952
      reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "After 2 h of chase, the peaks for M7 and M4 did not appear in the cells of affected individuals (Figure 3B), indicating that the 1,2-alpha mannose residues were not removed from the M8B and M5 N-glycans during the chase, which is consistent with the absence of the biological function of EDEM3 (Figure 3A)."
      explanation: >-
        The trimming defect measured directly in patient cells.
discussions:
- discussion_id: edem3_cdg_neurodevelopmental_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Deficient ER Mannose Trimming
  - phenotypes#Neurodevelopmental Delay
  prompt: >-
    How does loss of EDEM3 mannose trimming cause developmental delay and
    intellectual disability when brain MRI is normal?
  rationale: >-
    Every mechanistic study of EDEM3 deficiency has used fibroblasts,
    lymphoblastoid cells, plasma or cancer cell lines. No neural cell or
    organoid model exists, and the knockout mouse has no obvious neurological
    phenotype, so the causal edges from the glycan defect to the developmental
    phenotypes rest on genetic association alone. Measuring ERAD substrate
    clearance and ER stress in patient-derived neurons would test whether
    slower ERAD, altered stress signalling, or a change in the glycosylation of
    specific neural glycoproteins is responsible.
- discussion_id: edem3_cdg_upr_direction
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Blunted PERK-Mediated Unfolded Protein Response
  prompt: >-
    Does EDEM3 loss blunt or activate the unfolded protein response?
  rationale: >-
    Patient lymphoblastoid cells show blunted PERK induction under tunicamycin,
    which the authors read either as an impaired response or as increased
    capacity to clear misfolded protein. EDEM3 knockout hepatoma cells instead
    show ER stress and apoptosis. The comparison uses three patient cell lines
    and a cancer cell line, so the direction in the tissues that matter is
    unknown.
- discussion_id: edem3_cdg_mouse_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Altered Plasma and Cellular High-Mannose N-Glycan Profile
  prompt: >-
    Why does the Edem3 knockout mouse reproduce most of the human glycan
    defect but not the neurodevelopmental phenotype or the reduced Man3:Man4
    ratio?
  rationale: >-
    The mouse shares the reduced Man5:Man9, Man6:Man9 and Man7:Man9 ratios but
    not the reduced Man3:Man4 ratio, and its largest change is at a different
    trimming step, which the authors attribute to a difference in substrate
    specificity between human and mouse EDEM3. It shows only reduced brain and
    body weight. Whether the missing neurological phenotype reflects species
    differences in EDEM3 substrates, compensation by EDEM1, or insufficiently
    detailed behavioural testing is untested.
notes: >-
  The entry name follows the gene-prefixed naming used for other CDG entries
  (for example DHRSX-Congenital_Disorder_of_Glycosylation); the MONDO label is
  used verbatim in disease_term.

  The human clinical evidence is a single series of 12 individuals from seven
  families (PMID:34143952), so every phenotype frequency is an n=12 figure. No
  later case reports are known, and no GeneReviews chapter covers EDEM3-CDG.

  The congenital_disorder_of_glycosylation module is not used as a conformance
  target. Its shared lesion is protein hypoglycosylation after defective
  lipid-linked oligosaccharide assembly or Golgi processing; EDEM3-CDG instead
  impairs ER mannose trimming, and transferrin glycosylation is normal.

  EDEM3 variants also influence plasma triglycerides (a common missense
  variant, p.Pro746Ser, lowers them by about 5%), but fasting triglycerides
  were normal in the EDEM3-CDG individuals tested, so triglycerides are not
  curated as a feature of the disease.

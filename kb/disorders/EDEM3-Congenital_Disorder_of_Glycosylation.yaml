name: EDEM3-Congenital Disorder of Glycosylation
creation_date: "2026-09-28T15:00:00Z"
category: Mendelian
description: >-
  EDEM3-CDG (congenital disorder of glycosylation type 2v) is an autosomal
  recessive neurodevelopmental disorder caused by biallelic loss-of-function
  variants in EDEM3, an endoplasmic reticulum alpha-1,2-mannosidase of the
  glycoside hydrolase 47 family. EDEM3 trims mannose from high-mannose
  N-glycans, chiefly Man8GlcNAc2 isomer B to Man7-5GlcNAc2, which marks
  misfolded glycoproteins for ER-associated degradation (ERAD); it also trims
  total cellular glycoproteins. Twelve affected individuals from seven families
  have been described, all with developmental delay or intellectual disability
  and speech delay, half with hypotonia, and most with mild facial dysmorphism
  (hypoplastic alae nasi, thin upper lip, increased nasal height). Brain MRI was
  normal where performed. Unlike most CDGs, transferrin isoform screening is
  normal; diagnosis rests on a distinctive plasma high-mannose N-glycan profile
  with reduced Man3-Man7 species, a raised Man9:Man3 ratio and a reduced
  Man3:Man4 ratio. Patient cells also show blunted PERK induction under ER
  stress. How loss of mannose trimming leads to the neurodevelopmental
  phenotype is not known.

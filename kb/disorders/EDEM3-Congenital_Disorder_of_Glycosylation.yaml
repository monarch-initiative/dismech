pathophysiology:
- name: Biallelic EDEM3 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Mostly protein-truncating EDEM3 variants (frameshift, nonsense and splice
    donor) that trigger nonsense-mediated mRNA decay, leaving about 17-18% of
    normal transcript and no detectable EDEM3 protein in patient cells. One
    family carries two missense variants in the GH47 mannosidase domain. EDEM1,
    which performs an overlapping trimming step, is not upregulated.
  genetic_context:
    gene:
      preferred_term: EDEM3
      term:
        id: hgnc:16787
        label: EDEM3
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Deficient ER Mannose Trimming
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34143952
      reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "After 2 h of chase, the peaks for M7 and M4 did not appear in the cells of affected individuals (Figure 3B), indicating that the 1,2-alpha mannose residues were not removed from the M8B and M5 N-glycans during the chase, which is consistent with the absence of the biological function of EDEM3 (Figure 3A)."
      explanation: >-
        Pulse-chase labelling of patient fibroblasts shows the trimming
        products fail to appear when EDEM3 is lost.
  evidence:
  - reference: PMID:34143952
    reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "and could be rescued with cycloheximide (CHX), an inhibitor of NMD, suggesting that the bi-allelic c.1859del frameshift variant triggers NMD"
    explanation: >-
      Cycloheximide rescue of EDEM3 mRNA in patient lymphoblastoid cells shows
      the frameshift allele is degraded by nonsense-mediated decay.
  - reference: PMID:34143952
    reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These demonstrated the absence of EDEM3 in individual IV-4 (family 1) and individual II-1 (family 3) consistent with loss of function of EDEM3 (Figure 3C)."
    explanation: >-
      No EDEM3 protein on immunoblot of patient fibroblasts.
  - reference: PMID:34143952
    reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "EDEM1 levels were at 97% of normal levels (p = 0.9373) in fibroblast cell lines from affected individuals (Figure 2C)."
    explanation: >-
      The paralog EDEM1 is not upregulated to compensate.
- name: Deficient ER Mannose Trimming
  biological_scale: MOLECULAR
  description: >-
    Without EDEM3, alpha-1,2-linked mannose is not trimmed from Man8GlcNAc2
    isomer B to Man7-5GlcNAc2, and Man5GlcNAc2 is not trimmed to Man4GlcNAc2,
    with accumulation of Glc1Man5GlcNAc2 in patient fibroblasts. The authors
    suggest that this Man5 species may come from the lipid-linked
    oligosaccharide precursor rather than from trimming, which would imply an
    additional effect on precursor synthesis; this is speculative. In purified
    enzyme assays EDEM3 alone converts M8B to M7, M6 and M5 and is a major
    alpha-1,2-mannosidase for this second trimming step.
  molecular_functions:
  - preferred_term: mannosyl-oligosaccharide 1,2-alpha-mannosidase activity
    term:
      id: GO:0004571
      label: mannosyl-oligosaccharide 1,2-alpha-mannosidase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: mannose trimming involved in glycoprotein ERAD pathway
    term:
      id: GO:1904382
      label: mannose trimming involved in glycoprotein ERAD pathway
    modifier: DECREASED
  downstream:
  - target: Altered Plasma and Cellular High-Mannose N-Glycan Profile
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34143952
      reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Stepwise ratio analysis for plasma N-linked polymannose species showed a reduction of M7:M8 that is significant in affected individuals, consistent with EDEM3’s being the key enzyme in trimming M8B to M7 on secreted glycoproteins (Table S3)."
      explanation: >-
        The plasma glycan ratios in patients reflect the missing M8B-to-M7
        trimming step.
  - target: Impaired Glycoprotein ER-Associated Degradation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred for patients. Mannose trimming generates the glycan signal that
      targets misfolded glycoproteins for ERAD, and loss of EDEM1 and EDEM3
      together delays ERAD in cultured cells, but degradation of ERAD substrates
      has not been measured in EDEM3-CDG patient cells.
    evidence:
    - reference: PMID:34698634
      reference_title: "Purified EDEM3 or EDEM1 alone produces determinant oligosaccharide structures from M8B in mammalian glycoprotein ERAD."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Accordingly, degradation of human ATF6α, a transmembrane-type gpERAD substrate, and mCD3-δ-ΔTM-HA, a soluble gpERAD substrate, was markedly delayed in EDEM1, 3-DKO cells"
      explanation: >-
        Loss of EDEM1 and EDEM3 together delays degradation of glycoprotein
        ERAD substrates. Indirect because the cells lack both paralogs and are
        not patient cells.
  - target: Neurodevelopmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The link from the glycan defect to the neurodevelopmental phenotype rests
      on genetic association only. The intervening cellular steps are unknown,
      no neural model of EDEM3 deficiency exists, and the authors state that
      the mechanism remains to be determined.
    evidence:
    - reference: PMID:34143952
      reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "In conclusion, we show that bi-allelic EDEM3 variants cause EDEM3-CDG, a CDG with non-specific developmental delay and/or intellectual disability."
      explanation: >-
        Establishes that EDEM3 loss causes the developmental phenotype without
        identifying the mechanism.
    - reference: PMID:34143952
      reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Further functional studies are necessary to determine the precise pathophysiological mechanism of EDEM3-CDG."
      explanation: >-
        The authors' own statement that the mechanism is unknown, which is
        why this edge is typed as having unknown intermediates.
  - target: Blunted PERK-Mediated Unfolded Protein Response
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed link. The authors connect the Glc1Man5GlcNAc2 accumulation seen
      in patient fibroblasts to an impaired unfolded protein response, and
      offer two readings of the blunted PERK induction: an impaired response,
      or an increased capacity to eliminate misfolded proteins. Neither has
      been tested.
    evidence:
    - reference: PMID:34143952
      reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "G1M5 accumulation is a marker for an impaired UPR"
      explanation: >-
        The authors' rationale for testing the UPR, based on the trimming
        defect observed in patient cells.
    - reference: PMID:34143952
      reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "suggesting that the UPR is impaired in EDEM3-CDG or that these cell lines have an increased capacity to eliminate misfolded proteins"
      explanation: >-
        The authors' interpretation, which leaves the causal direction open.
  evidence:
  - reference: PMID:34698634
    reference_title: "Purified EDEM3 or EDEM1 alone produces determinant oligosaccharide structures from M8B in mammalian glycoprotein ERAD."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, EDEM3 is a major α1,2-mannosidase for the second step from M8B."
    explanation: >-
      Purified-enzyme assays identify EDEM3 as the main enzyme for the step
      lost in patients.
  - reference: PMID:34143952
    reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In human cells, Man5GlcNAc2 to Man4GlcNAc2 conversion is also diminished with an increase of Glc1Man5GlcNAc2."
    explanation: >-
      A second trimming defect, at Man5GlcNAc2, in patient fibroblasts.
  - reference: PMID:16431915
    reference_title: "EDEM3, a soluble EDEM homolog, enhances glycoprotein endoplasmic reticulum-associated degradation and mannose trimming."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overexpression of EDEM3 also greatly stimulates mannose trimming not only from misfolded alpha1-AT null (Hong Kong) but also from total glycoproteins"
    explanation: >-
      EDEM3 trims total cellular glycoproteins, not only ERAD substrates,
      which explains why its loss changes the global N-glycan profile.
- name: Altered Plasma and Cellular High-Mannose N-Glycan Profile
  biological_scale: ORGANISM
  description: >-
    Secreted and cellular glycoproteins carry fewer trimmed high-mannose
    glycans. Patient plasma shows reduced Man3-Man7 species with normal or
    mildly raised Man8 and Man9, giving reduced Man5:Man9, Man6:Man9, Man7:Man9
    and Man3:Man4 ratios and a raised Man9:Man3 ratio. Transferrin
    glycosylation, the standard CDG screen, is normal.
  biological_processes:
  - preferred_term: N-glycan processing
    term:
      id: GO:0006491
      label: N-glycan processing
    modifier: ABNORMAL
  downstream:
  - target: Abnormal High-Mannose N-Glycan Level
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34143952
      reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "M9:M3 was increased in all 12 affected individuals."
      explanation: >-
        The glycan profile change is the measured laboratory abnormality.
  evidence:
  - reference: PMID:34143952
    reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The N-glycan profiles from affected individuals showed decreased levels of low mannose N-glycan species M3–M7 (Figure 3C) with preserved normal M8 and M9 or sometimes mildly increased abundance of M9 as compared to control subjects."
    explanation: >-
      Plasma N-glycan profiling in all 12 affected individuals.
- name: Impaired Glycoprotein ER-Associated Degradation
  biological_scale: CELLULAR
  description: >-
    Trimmed high-mannose glycans are the signal recognised by the lectins that
    deliver misfolded glycoproteins to ERAD. EDEM3 overexpression accelerates
    ERAD of misfolded glycoproteins, and combined EDEM1 and EDEM3 loss delays
    it. Slower clearance of misfolded glycoproteins is therefore the expected
    consequence of EDEM3 loss, but it has not been measured in patient cells.
  biological_processes:
  - preferred_term: ERAD pathway
    term:
      id: GO:0036503
      label: ERAD pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:16431915
    reference_title: "EDEM3, a soluble EDEM homolog, enhances glycoprotein endoplasmic reticulum-associated degradation and mannose trimming."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "EDEM3 accelerates glycoprotein ERAD in transfected HEK293 cells, as shown by increased degradation of misfolded alpha1-antitrypsin variant (null (Hong Kong)) and of TCRalpha."
    explanation: >-
      EDEM3 promotes ERAD of misfolded glycoproteins.
- name: Blunted PERK-Mediated Unfolded Protein Response
  biological_scale: CELLULAR
  description: >-
    Lymphoblastoid cells from affected individuals induce PERK (EIF2AK3) mRNA
    less than control cells after tunicamycin (measured by quantitative PCR
    only); ATF6 and IRE1 changes
    were not significant (three patient and three control lines). In contrast,
    EDEM3 knockout in hepatoma cells activates ER stress and apoptosis, so the
    direction of the stress response appears to depend on the cell type.
  biological_processes:
  - preferred_term: PERK-mediated unfolded protein response
    term:
      id: GO:0036499
      label: PERK-mediated unfolded protein response
    modifier: DECREASED
  evidence:
  - reference: PMID:34143952
    reference_title: "Bi-allelic variants in the ER quality-control mannosidase gene EDEM3 cause a congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Affected individuals’ mRNA from family 1 showed significantly decreased induction of PERK expression when compared to controls (p = 0.020), whereas ATF6 and IRE1 did not change significantly (p = 0.423 and p = 0.091, respectively)."
    explanation: >-
      Blunted PERK induction in patient lymphoblastoid cells.
  - reference: PMID:39838427
    reference_title: "The endoplasmic reticulum degradation-enhancing α-mannosidase-like protein 3 attenuates the unfolded protein response and has pro-survival and pro-viral roles in hepatoma cells and hepatocellular carcinoma patients."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "In turn, significant UPR activation and apoptosis occur in EDEM3 knockout cells."
    explanation: >-
      In EDEM3 knockout hepatoma cells, EDEM3 loss activates rather than
      blunts ER stress signalling. The cells are a cancer line, not patient cells, so this may
      reflect cell context rather than contradict the patient finding.

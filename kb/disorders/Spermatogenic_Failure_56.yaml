pathophysiology:
- name: Loss of the DNAH10 Inner-Arm Dynein Heavy Chain
  description: >-
    Biallelic frameshift and missense variants abolish or sharply reduce
    DNAH10 along the sperm flagellum. DNAH10 is one of the three heavy chains
    of the double-headed inner dynein arm f (IDA f / I1), with DNAH2 and
    DNAH12.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DNAH10
    term:
      id: hgnc:2941
      label: DNAH10
  molecular_functions:
  - preferred_term: minus-end-directed microtubule motor activity
    modifier: DECREASED
    term:
      id: GO:0008569
      label: minus-end-directed microtubule motor activity
  cellular_components:
  - preferred_term: Inner dynein arm
    term:
      id: GO:0036156
      label: inner dynein arm
  downstream:
  - target: Co-Depletion of Inner-Arm Dynein Heavy Chains from the Sperm Flagellum
    causal_link_type: DIRECT
    description: Without DNAH10, its inner-arm partners are lost from the flagellum.
  - target: Impaired Intramanchette Transport During Spermiogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown in a mouse study; DNAH10 is proposed to bridge UCHL3 and PACRG
      in the manchette, but how this relates to its axonemal role is unclear.
  evidence:
  - reference: PMID:34237282
    reference_title: "Bi-allelic mutations of DNAH10 cause primary male infertility with asthenoteratozoospermia in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "spermatozoa from the men harboring bi-allelic DNAH10 variants exhibited an absence or markedly reduced staining intensity of DNAH10 and other IDA components, including DNAH2 and DNAH6"
    explanation: Loss of DNAH10 protein from patient sperm.
  - reference: PMID:39996363
    reference_title: "Novel bi-allelic variants in DNAH10 lead to multiple morphological abnormalities of sperm flagella and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "immunofluorescence staining revealed loss of DNAH10 protein signals along sperm flagella"
    explanation: Independent confirmation in Pakistani patients carrying missense variants.
  - reference: PMID:40898283
    reference_title: "DNAH10 mutation cause primary ciliary dyskinesia with defects of IDAf complex assembly and lung fibrosis manifestation."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The IDAf complex comprises intermediate chains (DNAI3, DNAI4, DNAI7), light chains (DYNLRB1, DYNRB2, DYNLL1), and heavy chains (DNAH2, DNAH10, DNAH12)."
    explanation: Analysis of published cryo-EM axoneme structures places DNAH10 as a heavy chain of IDA f.
- name: Co-Depletion of Inner-Arm Dynein Heavy Chains from the Sperm Flagellum
  description: >-
    Patient sperm lose the inner-arm heavy chains DNAH2 and DNAH6 (and in a
    second cohort DNAH1) along with DNAH10, indicating that DNAH10 is needed
    for these inner-arm dyneins to assemble in or remain in the axoneme.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Inner dynein arm assembly
    term:
      id: GO:0036159
      label: inner dynein arm assembly
    modifier: DECREASED
  downstream:

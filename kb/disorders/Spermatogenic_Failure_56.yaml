- name: Impaired Intramanchette Transport During Spermiogenesis
  description: >-
    In DNAH10-deficient spermatids the manchette functions abnormally and
    axonemal proteins are mislocalized. DNAH10 enhances binding between
    the deubiquitinase UCHL3 and PACRG, which UCHL3 stabilizes. The study is
    indexed with Mice and Humans in MeSH; the abstract does not say which
    observations come from which species, and this route has not been shown
    in patient tissue.
  biological_scale: CELLULAR
  cell_types:

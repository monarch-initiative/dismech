    reference_title: "Novel bi-allelic variants in DNAH10 lead to multiple morphological abnormalities of sperm flagella and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing revealed that these variants follow an autosomal recessive mode of inheritance."
    explanation: Recessive segregation in two Pakistani families.
  - reference: CGGV:assertion_0128b225-6f43-4ed2-b111-a50dde1b25e5-2026-05-07T190000.000Z

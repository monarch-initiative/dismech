mechanistic_hypotheses:
- hypothesis_group_id: dnah10_sperm_vs_motile_cilia_spectrum
  hypothesis_label: DNAH10 loss is usually limited to the sperm flagellum but can also cause primary ciliary dyskinesia
  status: EMERGING
  description: >-
    Most men with SPGF56 have no reported respiratory or laterality
    symptoms, yet one homozygous DNAH10 missense patient had full primary
    ciliary dyskinesia with asthenoteratozoospermia, and Dnah10 knockout and
    knock-in mice develop respiratory infection and hydrocephalus. Whether
    allele type, residual function or incomplete ciliary assessment explains
    the difference is unresolved; none of the SPGF56 cohorts reports
    systematic ciliary testing.
  evidence:
  - reference: PMID:39996363
    reference_title: "Novel bi-allelic variants in DNAH10 lead to multiple morphological abnormalities of sperm flagella and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "causing asthenoteratozoospermia with MMAF without PCD symptoms in patients from two unrelated Pakistani families"
    explanation: Sperm-restricted disease in two families.
  - reference: PMID:37314648
    reference_title: "Dynein axonemal heavy chain 10 deficiency causes primary ciliary dyskinesia in humans and mice."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient manifested sinusitis, bronchiectasis, situs inversus, and asthenoteratozoospermia."
    explanation: A DNAH10 patient with both sperm and motile cilia disease contradicts a strictly sperm-restricted requirement.
  - reference: PMID:37314648
    reference_title: "Dynein axonemal heavy chain 10 deficiency causes primary ciliary dyskinesia in humans and mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Dnah10-knockout mice recapitulated the phenotypes of PCD, including chronic respiratory infection, male infertility, and hydrocephalus"
    explanation: The knockout mice have ciliary disease as well as infertility.
  - reference: PMID:40898283
    reference_title: "DNAH10 mutation cause primary ciliary dyskinesia with defects of IDAf complex assembly and lung fibrosis manifestation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "we demonstrated the presence of loss-of-function mutations in the DNAH10 gene among two families affected by primary ciliary dyskinesia"
    explanation: A second report of DNAH10 loss of function in families with respiratory PCD, against a sperm-restricted requirement.

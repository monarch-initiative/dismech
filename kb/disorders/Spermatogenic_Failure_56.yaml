name: Spermatogenic Failure 56
creation_date: "2026-10-14T00:00:00Z"
category: Mendelian
synonyms:
- SPGF56
- spermatogenic failure 56
- DNAH10-related asthenoteratozoospermia
- DNAH10-related multiple morphological abnormalities of the sperm flagella
description: >-
  Spermatogenic failure 56 (SPGF56) is autosomal recessive male infertility
  caused by biallelic variants in DNAH10, which encodes an axonemal inner
  dynein arm heavy chain expressed mainly in the testis. Structural studies
  place DNAH10 in the double-headed inner dynein arm f (IDA f, also called
  I1) together with the heavy chains DNAH2 and DNAH12. Affected men have
  asthenoteratozoospermia with multiple morphological abnormalities of the
  sperm flagella (MMAF): absent, short, coiled and irregular flagella, often
  with misshapen (pyriform or tapered) heads. Patient sperm lack inner dynein
  arms and lose DNAH10 together with other inner-arm heavy chains (DNAH1,
  DNAH2, DNAH6).

  Dnah10 knockout and knock-in mice reproduce male infertility and MMAF, and
  in mice DNAH10 also bridges the UCHL3-PACRG complex during
  intramanchette transport, which may explain the head defects. Most
  reported men have no respiratory symptoms, but biallelic DNAH10 variants
  have also been reported with primary ciliary dyskinesia, and the knockout
  mice show ciliary disease, so SPGF56 lies on a spectrum with DNAH10-related
  primary ciliary dyskinesia. ICSI restores fertilization and has given live
  births.
disease_term:
  preferred_term: spermatogenic failure 56
  term:
    id: MONDO:0030430
    label: spermatogenic failure 56
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references this disease as OMIM 619515. ClinGen splits
  DNAH10-related disease into two curations, spermatogenic failure 56
  (Moderate) and primary ciliary dyskinesia (Limited); the SPGF56 curation
  counts the PCD proband of PMID:37314648 among its eight probands, so the
  two entities overlap in the source data. PMID:40592014 reports DNAH2,
  DNAH6 and DNAH10 patients together, and its abstract does not separate
  their ICSI results by gene. A single oligoasthenoteratozoospermia patient
  carrying homozygous missense variants in both SUN5 and DNAH10
  (PMID:40373254) is not used, because the SUN5 variant is the likelier
  explanation for its head-tail coupling defect. Abstract-only caches:
  PMID:34237282, PMID:34657236, PMID:37314648, PMID:41058558 and
  PMID:40592014.
inheritance:
- name: Autosomal recessive

    explanation: Identifies endocarditis as a recognized complication of septicemic E. rhusiopathiae disease.
treatments:
- name: Antibiotic therapy
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  description: >-
    Penicillin and ceftriaxone retain low MICs against E. rhusiopathiae; intrinsic
    vancomycin resistance makes early species identification important in endocarditis.
  evidence:
  - reference: PMID:12408347
    reference_title: "Susceptibility of Erysipelothrix rhusiopathiae to antimicrobial agents and home disinfectants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RESULTS: Penicillin and ceftriaxone, with low minimum inhibitory concentrations
      (MICs) (MIC90 0.03 mg/l and 0.125 mg/l, respectively), remained active against
      E. rhusiopathiae and should continue to be recommended for treatment.
      Ciprofloxacin MICs were particularly low (MIC90 0.06 mg/l), offering an
      alternative agent for the penicillin allergic patient. Erysipelothrix
      rhusiopathiae is still resistant to vancomycin (MIC90 64 mg/l), highlighting
      the importance of early diagnosis of E. rhusiopathiae infection in cases of
      endocarditis.
    explanation: Establishes beta-lactam susceptibility, an additional ciprofloxacin option, and clinically important vancomycin resistance.

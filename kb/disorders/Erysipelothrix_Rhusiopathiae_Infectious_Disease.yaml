treatments:
- name: Antibiotic therapy
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: penicillin G
      term:
        id: CHEBI:18208
        label: benzylpenicillin
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
    - preferred_term: ciprofloxacin
      term:
        id: CHEBI:100241
        label: ciprofloxacin
  description: >-
    Penicillin G is the drug of choice, with ceftriaxone and ciprofloxacin as
    alternatives; intrinsic vancomycin resistance makes early species
    identification important in endocarditis.
  target_mechanisms:
  - target: Septicemic dissemination
    description: >-
      Beta-lactams clear invasive E. rhusiopathiae, but its intrinsic vancomycin
      resistance means empiric vancomycin fails, so early identification matters
      in septicemia and endocarditis.
    evidence:
    - reference: PMID:26693283
      reference_title: "Tenosynovitis of a digit due to Erysipelothrix rhusiopathiae: case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Penicillin, cephalosporins, fluoroquinolones and lincosamides are the
        main antibiotic categories used for treatment against infections due to
        Erysipelothrix.
      explanation: Names the antibiotic classes used against Erysipelothrix, supporting beta-lactam-based therapy of the invasive infection.
  evidence:
  - reference: PMID:12408347
    reference_title: "Susceptibility of Erysipelothrix rhusiopathiae to antimicrobial agents and home disinfectants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RESULTS: Penicillin and ceftriaxone, with low minimum inhibitory concentrations
      (MICs) (MIC90 0.03 mg/l and 0.125 mg/l, respectively), remained active against
      E. rhusiopathiae and should continue to be recommended for treatment.
      Ciprofloxacin MICs were particularly low (MIC90 0.06 mg/l), offering an
      alternative agent for the penicillin allergic patient. Erysipelothrix
      rhusiopathiae is still resistant to vancomycin (MIC90 64 mg/l), highlighting
      the importance of early diagnosis of E. rhusiopathiae infection in cases of
      endocarditis.
    explanation: Establishes beta-lactam susceptibility, an additional ciprofloxacin option, and clinically important vancomycin resistance.
  - reference: PMID:26693283
    reference_title: "Tenosynovitis of a digit due to Erysipelothrix rhusiopathiae: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In cases of bactaeremia or endocarditis, 4 to 6 weeks of continuous
      antibiotic therapy is considered an effective treatment period.
    explanation: Records the 4-to-6-week treatment duration for bacteremia or endocarditis.
diagnosis:
- name: Full-thickness dermal biopsy
  description: >-
    Because E. rhusiopathiae resides in the deeper dermis, erysipeloid diagnosis
    requires a biopsy of the entire thickness of the skin.
  diagnosis_term:
    preferred_term: full-thickness skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: PMID:26693283
    reference_title: "Tenosynovitis of a digit due to Erysipelothrix rhusiopathiae: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In cases of erysipeloid, biopsy samples should be taken of the entire
      thickness of the dermis, as the bacterium lies in the deeper layers of the
      skin.
    explanation: Supports full-thickness dermal biopsy as the diagnostic sampling method for erysipeloid.
- name: Blood culture with biochemical identification
  description: >-
    Sepsis or endocarditis is diagnosed by blood culture, with species
    identification resting on Gram stain, morphology, motility, and H2S
    production.
  diagnosis_term:
    preferred_term: blood culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:26693283
    reference_title: "Tenosynovitis of a digit due to Erysipelothrix rhusiopathiae: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Identification should be based on Gram stain, morphology, motility, and
      hemolytic and biochemical properties, especially production of H2S [2].
    explanation: Supports Gram stain plus H2S production as the identifying features on culture.
  - reference: PMID:26693283
    reference_title: "Tenosynovitis of a digit due to Erysipelothrix rhusiopathiae: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "When sepsis or endocarditis is diagnosed, a standard blood culture should be performed."
    explanation: Supports blood culture as the diagnostic procedure when sepsis or endocarditis is suspected.
progression:
- phase: Erysipeloid clinical course
  notes: >-
    Erysipeloid is a mild, self-limiting cutaneous infection lasting 2 to 4 weeks.
  evidence:
  - reference: PMID:26693283
    reference_title: "Tenosynovitis of a digit due to Erysipelothrix rhusiopathiae: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is a mild, cutaneous infection, lasting between 2 and 4 weeks and usually
      self-limiting.
    explanation: Records the self-limiting 2-to-4-week course of erysipeloid.

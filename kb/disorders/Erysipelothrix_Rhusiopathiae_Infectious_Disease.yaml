name: Erysipelothrix Rhusiopathiae Infectious Disease
creation_date: "2026-09-25T16:49:06Z"
category: Infectious Disease
disease_term:
  preferred_term: Erysipelothrix rhusiopathiae infectious disease
  term:
    id: MONDO:0006752
    label: Erysipelothrix rhusiopathiae infectious disease
description: >-
  Erysipelothrix rhusiopathiae infectious disease is a bacterial infection caused
  by Erysipelothrix rhusiopathiae. Human infection is acquired mainly through
  occupational contact with contaminated animals, animal products, wastes, or soil
  and ranges from localized cutaneous erysipeloid to a rare septicemic form often
  complicated by endocarditis.
parents:
- Erysipelothrix infectious disease
synonyms:
- erysipeloid
infectious_agent:
- name: Erysipelothrix rhusiopathiae
  infectious_agent_term:
    preferred_term: Erysipelothrix rhusiopathiae
    term:
      id: NCBITaxon:1648
      label: Erysipelothrix rhusiopathiae
  description: >-
    A small Gram-positive bacillus that causes erysipeloid and invasive
    Erysipelothrix infection in humans.
  evidence:
  - reference: PMID:19733019
    reference_title: "Erysipelothrix rhusiopathiae."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Erysipelothrix rhusiopathiae is a facultative, non-spore-forming, non-acid-fast, small, Gram-positive bacillus."
    explanation: Identifies E. rhusiopathiae as the bacterial species underlying the MONDO agent-defined disease.
  - reference: PMID:26693283
    reference_title: "Tenosynovitis of a digit due to Erysipelothrix rhusiopathiae: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erysipelothrix rhusiopathiae is a Gram-positive bacterium that in humans causes skin infections, such as erysipeloid, as a result of direct contact with contaminated animals or their waste or products."
    explanation: Supports E. rhusiopathiae as a human pathogen that causes erysipeloid.
transmission:
- name: Animal and environmental cutaneous inoculation
  description: >-
    Human infections are occupationally associated zoonoses acquired when
    contaminated animals, animal products, wastes, or soil contact abraded skin.
  evidence:
  - reference: PMID:19733019
    reference_title: "Erysipelothrix rhusiopathiae."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infection due to E. rhusiopathiae in humans is occupationally related,
      principally occurring as a result of contact with contaminated animals,
      their products or wastes, or soil.
    explanation: Supports occupational animal-, waste-, product-, and soil-associated exposure as the main human transmission context.
pathophysiology:
- name: Neuraminidase-mediated host cell attachment and invasion
  description: >-
    E. rhusiopathiae neuraminidase promotes bacterial attachment to and
    subsequent invasion of host cells, an early virulence step enabling both the
    cutaneous and invasive forms of infection.
  molecular_functions:
  - preferred_term: neuraminidase activity
    modifier: INCREASED
    term:
      id: GO:0004308
      label: exo-alpha-sialidase activity
  evidence:
  - reference: PMID:19733019
    reference_title: "Erysipelothrix rhusiopathiae."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The presence of a hyaluronidase and neuraminidase has been recognised, and
      it was shown that neuraminidase plays a significant role in bacterial
      attachment and subsequent invasion into host cells.
    explanation: Establishes neuraminidase-mediated attachment and host-cell invasion as an E. rhusiopathiae virulence mechanism.
  downstream:
  - target: Cutaneous erysipeloid infection
    description: >-
      Neuraminidase-driven attachment and invasion at an inoculation site
      establishes the localized cutaneous infection.
  - target: Generalized (diffuse) cutaneous infection
    description: >-
      Attachment and invasion at the inoculation site can progress to the rarer
      generalized cutaneous form with systemic features.
  - target: Septicemic dissemination
    description: >-
      By inference, the same attachment and invasion machinery may permit
      deeper invasion and bloodstream dissemination in the rare invasive form.
      The review documents neuraminidase in attachment and invasion but does not
      directly attribute septicemia to it.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Cutaneous erysipeloid infection
  description: >-
    Direct exposure to contaminated animals or their products can inoculate
    E. rhusiopathiae into skin, producing the localized cutaneous lesion form
    called erysipeloid.
  evidence:
  - reference: PMID:19733019
    reference_title: "Erysipelothrix rhusiopathiae."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Three forms of human disease have been recognised since then. These include
      a localised cutaneous lesion form, erysipeloid, a generalised cutaneous form
      and a septicaemic form often associated with endocarditis.
    explanation: Establishes erysipeloid as the localized cutaneous form of human E. rhusiopathiae infection.
  - reference: PMID:26693283
    reference_title: "Tenosynovitis of a digit due to Erysipelothrix rhusiopathiae: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erysipelothrix rhusiopathiae is a Gram-positive bacterium that in humans causes skin infections, such as erysipeloid, as a result of direct contact with contaminated animals or their waste or products."
    explanation: Links direct contact with contaminated animal material to erysipeloid skin infection.
  downstream:
  - target: Localized erysipeloid lesion
    description: >-
      Localized cutaneous infection produces the erysipeloid skin lesion.
  - target: Lymphadenopathy
    description: >-
      Regional lymphatic drainage of the cutaneous focus produces lymphadenopathy
      and lymphangitis in about a third of patients.
  - target: Arthritis
    description: >-
      Contiguous or reactive spread of the local infection produces adjacent
      arthritis.
  - target: Tenosynovitis
    description: >-
      Deeper extension of hand infection produces tenosynovitis.
- name: Generalized (diffuse) cutaneous infection
  description: >-
    A rarer generalized cutaneous form of erysipeloid, distinct from the
    localized lesion and the septicemic form, that is accompanied by systemic
    symptoms such as fever, severe headache, and polyarthritis.
  evidence:
  - reference: PMID:19733019
    reference_title: "Erysipelothrix rhusiopathiae."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Three forms of human disease have been recognised since then. These include
      a localised cutaneous lesion form, erysipeloid, a generalised cutaneous form
      and a septicaemic form often associated with endocarditis.
    explanation: Establishes the generalized cutaneous form as one of the three recognized human forms.
  - reference: PMID:26693283
    reference_title: "Tenosynovitis of a digit due to Erysipelothrix rhusiopathiae: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diffuse cutaneous form is even rarer, combined with systemic symptoms
      such as fever, severe headache and even polyarthritis.
    explanation: Characterizes the diffuse cutaneous form and its systemic features (fever, polyarthritis).
  downstream:
  - target: Fever
    description: >-
      The generalized cutaneous form is accompanied by systemic fever.
  - target: Arthritis
    description: >-
      The generalized cutaneous form can be accompanied by polyarthritis.
- name: Septicemic dissemination
  description: >-
    The rarest and most severe form is septicemia. Bacteremia risk is increased
    in hosts with diabetes, immunosuppression, alcoholism, or renal failure.
  evidence:
  - reference: PMID:26693283
    reference_title: "Tenosynovitis of a digit due to Erysipelothrix rhusiopathiae: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most severe form of infection, though the rarest, due to Erysipelothrix
      is septicaemia, which is almost always related to endocarditis.
    explanation: Supports septicemia as the severe invasive branch that is almost always linked to endocarditis.
  - reference: PMID:26693283
    reference_title: "Tenosynovitis of a digit due to Erysipelothrix rhusiopathiae: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Risk factors for bactaeremia include diabetes, immunosuppression, alcoholism"
    explanation: Records host comorbidities (diabetes, immunosuppression, alcoholism) that predispose to E. rhusiopathiae bacteremia.
  downstream:
  - target: Endocardial valve infection
    description: >-
      Bloodstream dissemination seeds the endocardium, almost always producing
      endocarditis.
- name: Endocardial valve infection
  description: >-
    Septicemic E. rhusiopathiae seeds cardiac valves, with a high rate of valve
    replacement and mortality up to 40%. (The source names the aortic valve as
    most often affected, but that sentence carries an inline citation marker
    that the snippet validator strips asymmetrically, so the node is stated at
    the valve level the quote can support.)
  evidence:
  - reference: PMID:26693283
    reference_title: "Tenosynovitis of a digit due to Erysipelothrix rhusiopathiae: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      with 35% of patients requiring replacement. Mortality is up to 40%,
      regardless of antibiotic treatment.
    explanation: Supports valve endocarditis with high replacement and mortality rates.
  downstream:
  - target: Endocarditis
    description: >-
      Valve infection manifests clinically as Erysipelothrix endocarditis.

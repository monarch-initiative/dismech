inheritance:
- name: Autosomal recessive
  description: >-
    Two homozygous and two compound heterozygous PKHD1L1 genotypes were reported in four unrelated families.
    Segregation was confirmed in Families 1, 2 and 4. The parents in Family 3 did not participate, and a competing
    homozygous MYO7A variant limits causal attribution in that proband. The reported pedigrees support recessive
    inheritance, without establishing population penetrance.

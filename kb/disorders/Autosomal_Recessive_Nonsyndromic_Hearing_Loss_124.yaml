animal_models:
- name: Pkhd1l1 conditional knockout mouse using Atoh1-Cre
  species: Mouse
  genotype: Pkhd1l1 fl/fl; Atoh1-Cre+ (conditional exon 10 deletion)
  background: Mixed C57BL/6N/129S4/CBA; homozygous Cdh23ahl
  publication: PMID:31444330
  genes:
  - preferred_term: PKHD1L1
    term:
      id: hgnc:20313
      label: PKHD1L1
  description: >-
    Conditional exon 10 deletion causes loss of the upper stereociliary coat, progressive auditory impairment,
    later bundle pathology and increased noise vulnerability. Early gross morphology, FM1-43 uptake and initial
    attachment-crown formation are preserved in the tested assays. Atoh1-Cre activity is not strictly limited
    to hair cells; the constitutive knockout corroborates hearing impairment independently of persistent Cre
    expression.
  modeled_mechanisms:
  - target: Loss of the Stereocilia Surface Coat at Stereocilia Tips
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      This model is how the coat was identified as a PKHD1L1 structure at all: the coat at the tips is absent
      in the mutant and present in littermate controls, on tannic-acid stained transmission electron microscopy.
    limitations: >-
      The coat has never been examined in human hair cells, in a patient or otherwise, so the identity of the
      human structure with the mouse one is assumed from protein orthology. The loss is also partial in a specific
      sense that should not be lost: only the upper coat goes, and the paper suggests the lower coat is made
      of different proteins.
    readouts:
    - name: Density of the electron-dense surface coat at stereocilia tips
      target: Loss of the Stereocilia Surface Coat at Stereocilia Tips
      direction: DECREASED
      interpretation: >-
        Tannic-acid staining intensity across the stereocilia membrane falls at the tips in mutants and is
        unchanged at the bases.
      evidence:
      - reference: PMID:31444330
        reference_title: "PKHD1L1 is a coat protein of hair-cell stereocilia and is required for normal hearing."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PKHD1L1-deficient mice show a large decrease of the surface coat intensity only at the tips of stereocilia"
        explanation: The measurement and its restriction to the upper stereocilia.
    evidence:
    - reference: PMID:31444330
      reference_title: "PKHD1L1 is a coat protein of hair-cell stereocilia and is required for normal hearing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "PKHD1L1-deficient mice lack the surface coat at the upper but not lower regions of stereocilia, and they develop progressive hearing loss."
      explanation: >-
        Establishes this model as the system in which the coat-PKHD1L1 relationship was demonstrated.
  - target: Impaired Stereocilia Bundle Maintenance
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      This line supports the maintenance hypothesis through preserved early gross morphology followed by stereocilia
      loss and later bundle disorganization. Neonatal dye uptake and initial attachment findings do not rule
      out all transduction or attachment abnormalities.
    limitations: >-
      Mice carry Cdh23ahl on a mixed background, and littermate comparisons do not eliminate interaction with
      that sensitizing allele. Stereocilia counts come from small numbers of cochleae. Human bundle pathology
      has not been measured. Atoh1-Cre also acts in some supporting cells and sensory neurons.
    readouts:
    - name: Missing stereocilia per outer hair cell bundle by row
      target: Impaired Stereocilia Bundle Maintenance
      direction: INCREASED
      interpretation: >-
        Stereocilia are lost from the shortest row first and from taller rows with age, most in the high-frequency
        base.
      evidence:
      - reference: PMID:39482437
        reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "stereocilia loss was most significant in the shortest row, progressing to the taller rows with age; most prominently in, but not limited to, the high frequency basal region"
        explanation: The readout, its direction and its spatial pattern.
    - name: Stereocilin localisation at tectorial-membrane attachment crowns
      target: Impaired Stereocilia Bundle Maintenance
      direction: UNCHANGED
      interpretation: >-
        Stereocilin localization is preserved at the tested ages, supporting initial attachment-crown formation
        without proving lifelong normal mechanical attachment.
      evidence:
      - reference: PMID:39482437
        reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We therefore conclude that PKHD1L1 is not required for the localization of STRC to attachment crowns or horizontal top connectors."
        explanation: The negative readout, as the authors state it.
    evidence:
    - reference: PMID:39482437
      reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results suggest a role for PKHD1L1 in establishing robust sensory hair bundles during development, necessary for maintaining bundle cohesion and function in response to acoustic trauma and aging."
      explanation: >-
        The authors' summary of what this model shows, which is the claim the node makes.
  - target: Reduced Resilience to Acoustic Overexposure
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: >-
      The noise arm. Six-week-old mutants and littermate controls received the same two-hour 94 dB SPL bandpass
      exposure; controls recovered to baseline by two weeks and mutants did not, at two weeks or at eight.
    limitations: >-
      Fidelity is UNKNOWN, not LOW, and the distinction is deliberate: the experiment is well controlled and
      the result is clear, but there is no human observation of any kind to compare it against, so how faithfully
      it represents a human patient cannot be assessed. Two further limits belong on the result itself. Threshold
      shifts were measured against an 80 dB SPL ceiling, and the mutants' baseline high-frequency thresholds
      already sit near that ceiling, so the measured shift understates the damage at exactly the frequencies
      where the disease is worst. And the exposure paradigm is a single laboratory dose, not the chronic, variable
      noise history a person accumulates.
    readouts:
    - name: Auditory brainstem response threshold shift at 8 weeks after noise
      target: Reduced Resilience to Acoustic Overexposure
      direction: INCREASED
      interpretation: >-
        Mutant thresholds remain elevated 8 weeks after an exposure from which controls fully recover - a permanent
        rather than temporary threshold shift.
      evidence:
      - reference: PMID:39482437
        reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These data therefore show the noise exposure, normally only sufficient to cause TTS in normal mice, leads to PTS in PKHD1L1-deficient mice."
        explanation: The readout stated as the genotype contrast.
    evidence:
    - reference: PMID:38459354
      reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
      supports: NO_EVIDENCE
      evidence_source: HUMAN_CLINICAL
      snippet: "Further research will be needed to determine the effect of age or noise trauma on the potential progression of PKHD1L1-linked hearing loss."
      explanation: >-
        Recorded on the link rather than omitted, because it is what fixes the fidelity call: the human paper
        names age and noise as untested, so the model result has no human comparator. Graded NO_EVIDENCE because
        the sentence reports the absence of a study, not a result.
  - target: Cochlear Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Both models and humans have auditory impairment, but their measured onset and course differ. The 2019
      conditional-mouse study detected high-frequency threshold elevations at three weeks; the 2024 study detected
      them at six weeks with slower spread to lower frequencies. Human loss was congenital or presumed congenital,
      with quantitatively slow progression documented in one proband.
    limitations: >-
      The onset divergence is the substantive limitation and is the subject of an open human-model mismatch
      discussion. There is a second, quieter one: the two studies of this same line disagree in degree, the
      later one finding threshold elevations less pronounced and slower to spread than the earlier, which the
      authors attribute to the recordings being made in different institutions. Any quantitative claim taken
      from this model should carry that.
    readouts:
    - name: Auditory brainstem response and distortion product thresholds across frequency and age
      target: Cochlear Hearing Loss
      direction: INCREASED
      interpretation: >-
        Thresholds rise - worse hearing - from three weeks at high frequencies and across all frequencies by
        six months.
      evidence:
      - reference: PMID:31444330
        reference_title: "PKHD1L1 is a coat protein of hair-cell stereocilia and is required for normal hearing."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PKHD1L1-deficient mice show elevated thresholds in response to high-frequency tones"
        explanation: The readout and where in the frequency range it starts.
    evidence:
    - reference: PMID:39482437
      reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both conditional and constitutive PKHD1L1 knockout mice develop high-frequency hearing loss progressing to lower frequencies with age."
      explanation: >-
        Two independent knockout designs give the same endpoint, which is what supports treating this model
        as informative for the human phenotype despite the timing difference.

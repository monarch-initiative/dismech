- name: Loss of the Stereocilia Surface Coat at Stereocilia Tips
  biological_scale: MOLECULAR
  description: >-
    PKHD1L1 immunogold labeling is enriched near stereocilia tips in developing mouse cochlear hair cells.
    Conditional knockout markedly reduces tannic-acid-stained coat material at the upper stereocilia while
    preserving the lower coat. The six reconstructed P4 outer hair-cell bundles came from one cochlear sample.
    Immunogold density measures relative labeling, not molecule counts, and does not establish that PKHD1L1
    alone comprises the upper coat.

discussions:
- discussion_id: dfnb124_onset_species_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Impaired Stereocilia Bundle Maintenance"
  - "pathophysiology#Cochlear Hearing Loss"
  prompt: >-
    How do developmental timing and allele-specific effects contribute to differences in observed auditory
    onset among humans, mice and zebrafish?
  rationale: >-
    Human hearing loss was congenital or presumed congenital; the best-followed proband had slow childhood
    progression. Mouse high-frequency deficits were detected at three or six weeks in different studies, and
    later stereocilia pathology supports a maintenance defect after grossly preserved early development. Zebrafish
    double mutants show larval auditory impairment. These observations use different developmental stages,
    alleles and measurements. Developmental timing, residual allele function and species-specific biology are
    plausible explanations, but none is established. Undetectable adult antibody labeling does not prove absence
    of all PKHD1L1 protein, and the neonatal FM1-43 assay does not establish normal lifetime transduction.
  evidence:
  - reference: PMID:39482437
    reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings reveal that PKHD1L1-deficient mice display no disruption to bundle cohesion or tectorial membrane attachment-crown formation during development."
    explanation: "Preserved gross developmental morphology in the tested mouse assays."
  - reference: PMID:39482437
    reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Anti-PKHD1L1 labeling intensity gradually decreased with development, was largely gone by P10, and completely cleared in mature hair cells at P21."
    explanation: >-
      Loss of immunolabeling supports temporally restricted detectability; it does not rank explanations for
      human onset.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bilateral congenital SNHL which is nonsyndromic and mild–moderate to severe"
    explanation: "The human half: present at birth."
  - reference: PMID:36960824
    reference_title: "A conserved function of Pkhd1l1, a mammalian hair cell stereociliary coat protein, in regulating hearing in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "in contrast to Pkhd1l1 mutant mice, which develop progressive hearing loss, the double mutant zebrafish exhibited statistically significant hearing loss even from the larval stage"
    explanation: >-
      Larval impairment provides an additional species comparison using a different auditory assay.
  proposed_experiments:
  - experiment_id: exp_dfnb124_developmental_timing
    name: Establish when the human lesion appears
    description: >-
      Two complementary approaches. First, examine the surface coat and bundle morphology in PKHD1L1-deficient
      mouse cochlea at prenatal and early postnatal ages with the sensitive methods used later, to test whether
      a subtle developmental deficit precedes the six-week onset. Second, differentiate hair-cell-like cells
      from patient-derived induced pluripotent stem cells carrying the human alleles and ask whether the coat
      forms at all, which would separate a construction defect from a maintenance defect without needing patient
      cochlea.
- discussion_id: dfnb124_noise_untested_in_humans
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Resilience to Acoustic Overexposure
  - treatments#Hearing-conservation counseling
  prompt: >-
    Does DFNB124 increase human noise susceptibility beyond the general risks associated with hazardous noise?
  rationale: >-
    Conditional knockout mice retain hearing deficits after a noise exposure from which control littermates
    recover. The human series did not establish genotype-specific noise susceptibility. General hearing-conservation
    counseling is appropriate under genetic-hearing-loss guidance, independently of this unresolved mouse-to-human
    extrapolation. Longitudinal audiometry and exposure histories could test whether an additional DFNB124-specific
    vulnerability exists.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "Further research will be needed to determine the effect of age or noise trauma on the potential progression of PKHD1L1-linked hearing loss."
    explanation: >-
      The gap stated by the authors of the human paper. Graded NO_EVIDENCE because the sentence reports that
      no study exists, which neither supports nor refutes the claim.
  - reference: PMID:39482437
    reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, PKHD1L1-deficient mice are susceptible to permanent hearing loss following moderate acoustic overexposure, which induces only temporary hearing threshold shifts in wild-type mice."
    explanation: The animal result that makes the untested human question worth asking.
- discussion_id: dfnb124_family3_myo7a_confound
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "phenotypes#Severe Hearing Impairment"
  - "genetic#PKHD1L1"
  prompt: >-
    Is the severe end of the DFNB124 range real, or does it belong to a second gene?
  rationale: >-
    Family 3 carries homozygous PKHD1L1 p.His2479Gln and MYO7A p.Leu375Val. Both calls had high read coverage,
    but parental segregation and functional testing were unavailable. MYO7A was deprioritized using prediction
    and conservation, which does not exclude pathogenicity. The source explicitly allows PKHD1L1 causation,
    incidental PKHD1L1 variation, or contributions from both genes. Audiometry was performed in ambient noise
    without a soundproof environment. Severe loss is retained as a reported observation with attribution uncertainty
    and without a frequency estimate.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome analysis revealed two homozygous missense variants of interest: one in PKHD1L1 c.7437C>A, p.(His2479Gln) and one in MYO7A (NM_000260.4:c.1123C>G, p.(Leu375Val))."
    explanation: The two candidate variants in this proband, both homozygous.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The homozygous variant in MYO7A, with a coverage of 198 high quality reads, was deprioritized given uncertain and neutral in silico predictions with respect to impact on protein structure and function"
    explanation: >-
      How the alternative was handled, and the basis on which it was set aside - prediction rather than experiment.
  proposed_experiments:
  - experiment_id: exp_dfnb124_his2479gln_function
    name: Functional test of PKHD1L1 p.(His2479Gln) and MYO7A p.(Leu375Val)
    description: >-
      Assess both variants in appropriately validated functional systems, alongside segregation and additional
      unrelated cases when available. Fragment stability and MYO7A motor/trafficking assays could add evidence,
      but neither a positive nor a negative isolated assay would by itself settle clinical causation.

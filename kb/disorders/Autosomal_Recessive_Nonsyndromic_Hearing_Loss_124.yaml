  external_id: OMIM:620794
  url: https://omim.org/entry/620794
  description: >-
    The OMIM phenotype record for DFNB124, and the identifier under which the entity was
    designated. Recorded here rather than under mappings because the DiseaseMappings class
    carries only ICD-10-CM, ICD-11, MONDO and NCIT slots.
  evidence:
  - reference: PMID:39482437
    reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "recently designated as autosomal recessive deafness-124 (DFNB124) in the OMIM database (entry #620794)"
    explanation: >-
      The OMIM number, cited from a paper that states it. Graded OTHER because the sentence

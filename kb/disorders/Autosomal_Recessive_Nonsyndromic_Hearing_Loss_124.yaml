name: Autosomal Recessive Nonsyndromic Hearing Loss 124
category: Mendelian
creation_date: "2026-09-03T00:00:00Z"
synonyms:
- DFNB124
- deafness, autosomal recessive 124
- autosomal recessive deafness 124
- PKHD1L1-related hearing loss
description: >-
  DFNB124 is autosomal recessive nonsyndromic sensorineural hearing loss associated with biallelic PKHD1L1
  variants. The founding human series described four unrelated probands with bilateral congenital or presumed-congenital
  hearing loss, ranging from mild-moderate to severe. Quantitative progression over nine years was documented
  in one proband; another was described as progressive. Attribution in the most severely affected proband remains
  uncertain because of a competing homozygous MYO7A variant. PKHD1L1 is a large, predominantly extracellular
  membrane protein associated with the developmental stereocilia surface coat. Knockout mice lose the upper
  stereociliary coat and subsequently develop stereocilia loss, bundle disorganization and progressive hearing
  impairment. Gross early bundle morphology and FM1-43 uptake were preserved under the tested conditions; these
  results do not establish normal mechanotransduction throughout life. Increased vulnerability to noise was
  demonstrated in mice, but has not been established in the reported human families. Human cochlear coat pathology
  and the relationship between developmental protein expression and later bundle maintenance remain unresolved.

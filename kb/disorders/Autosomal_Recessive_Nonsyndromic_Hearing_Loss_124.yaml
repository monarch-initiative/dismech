- name: Impaired Stereocilia Bundle Maintenance
  biological_scale: CELLULAR
  description: >-
    Mouse knockout findings support impaired long-term bundle maintenance despite preserved gross early morphology.
    P3 planar polarity, P4 explants cultured for three days before FM1-43 uptake assessment, stereocilin localization
    and tectorial-membrane imprints did not show major deficits in the tested assays. FM1-43 uptake is a proxy
    for channel permeability and does not establish normal mechanotransduction currents at all ages. Immunolabeling
    declines during early postnatal development and is undetectable by P21 with the antibody used. The authors
    propose that early PKHD1L1 expression establishes durable bundles, but adult protein below detection or
    lacking the antibody epitope cannot be excluded.

  measure_type: CASES_IN_LITERATURE
  notes: >-
    The 2024 founding paper described four unrelated probands from the United States, Iran, Pakistan and China.
    Population prevalence, penetrance and founder effects cannot be inferred from this series. Family 4 came
    from a subset of 449 exome-sequenced probands within a 1450-person hearing-loss cohort; testing was not
    uniform. Neither one in 1450 nor one in 449 establishes a population rate or an upper bound on disease
    frequency.

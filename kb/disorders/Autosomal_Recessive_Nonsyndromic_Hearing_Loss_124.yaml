- name: Progressive Stereocilia Loss
  biological_scale: CELLULAR
  description: >-
    In conditional knockout mice, missing outer hair-cell stereocilia are detectable from six weeks. Loss is
    most pronounced in the shortest row, progressing to taller rows with age, especially in the basal cochlea.
    This distribution suggests a role beyond tall-row tectorial-membrane attachment. Human stereocilia loss
    has not been directly examined.

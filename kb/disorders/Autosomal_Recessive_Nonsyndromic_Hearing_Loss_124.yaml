inheritance:
- name: Autosomal recessive
  description: >-
    All four reported families segregate biallelic PKHD1L1 variants. Two are consanguineous
    with homozygous alleles - an Iranian family with p.(Arg3381Ter) and a Pakistani family
    with p.(His2479Gln) - and two are non-consanguineous with compound heterozygous pairs.
    Parents are heterozygous carriers with normal hearing.

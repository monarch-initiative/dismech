    snippet: "The proband was compound heterozygous for missense variants, c.385G>A, p.(Gly129Ser) and c.3941G>T, p.(Gly1314Val)"
    explanation: >-
      Compound heterozygous genotype of Family 1.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing revealed that the proband was homozygous for the c.10141C>T, p.(Arg3381Ter) nonsense variant"
    explanation: >-
      Homozygous nonsense genotype of Family 2; its molecular consequence is predicted.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro functional assessment indicated that both engineered PKHD1L1 p.(Gly129Ser) and p.(Gly1314Val) mutant constructs significantly reduced the folding and structural stabilities of the expressed protein fragments, providing further evidence to support pathogenicity of these variants."
    explanation: >-
      The functional evidence for the two missense alleles, and its precise scope: folding and structural stability
      of expressed fragments, measured by nanoDSF.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Minigene assay of the c.1813G>A p.(Gly605Arg) variant, located at the boundary of exon 17, revealed exon skipping leading to an in-frame deletion of 48 amino acids."
    explanation: >-
      Exon skipping in HEK293 and HeLa minigene assays; patient cochlear splicing was not measured.

- name: Genetic Counselling and Cascade Testing
  description: >-
    Provide nondirective counseling and family testing after establishing a molecular diagnosis. When both
    parents carry confirmed pathogenic alleles for the same autosomal recessive hearing disorder, each pregnancy
    has a 25% chance of an affected child. Verify the familial variants and their segregation before applying
    this risk; uncertain causation in Family 3 requires particular caution. Counseling is relevant to consanguineous
    and non-consanguineous families alike.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If both parents are known to be heterozygous for an autosomal recessive hearing loss-related pathogenic variant, each sib of the proband has at conception a 25% chance of having hearing loss, a 50% chance of having no hearing loss and being a carrier, and a 25% chance of having no hearing loss and not being a carrier.
    explanation: General recessive recurrence risk, conditional on established parental pathogenic variants.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Carrier testing for relatives who may have a hearing loss-related pathogenic variant requires prior identification of the pathogenic variants in the family.
    explanation: Condition for informative cascade testing.

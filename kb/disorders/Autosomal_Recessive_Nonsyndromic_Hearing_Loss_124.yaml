- name: Progressive Stereocilia Loss and Bundle Disorganisation
  biological_scale: CELLULAR
  description: >-
    Stereocilia go missing, beginning in the shortest row and progressing to the taller rows
    with age, and most prominently but not exclusively in the high-frequency basal region.
    Bundle disorganisation is not visible at six weeks, is present at fourteen weeks, and is
    more severe by nine months. The short-row-first pattern is itself an argument against a
    tectorial-membrane mechanism, because attachment crowns form only on the tallest row.

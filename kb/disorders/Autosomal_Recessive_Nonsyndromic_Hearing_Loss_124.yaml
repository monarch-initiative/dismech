- name: Communication and language support
  description: Establish communication goals with the individual and family and provide early access to language, speech-language services and educational support as appropriate. These are general measures for childhood hearing loss, not evidence of an additional neurodevelopmental phenotype in DFNB124.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: On initial evaluation of individuals with hearing loss, the goals for communication must be established with a focus on equipping individuals with language and appropriate access to language.
    explanation: General management guidance applicable to the auditory phenotype.
- name: Hearing-conservation counseling
  description: Counsel about avoiding repeated hazardous noise exposure as general care for documented hearing loss. The knockout-mouse finding strengthens a research rationale but does not establish increased human DFNB124 susceptibility or a disease-specific protective effect.

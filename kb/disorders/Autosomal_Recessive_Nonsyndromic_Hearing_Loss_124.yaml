    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Both conditional and constitutive PKHD1L1 knockout mice develop high-frequency hearing loss progressing to lower frequencies with age."
    explanation: >-
      The mouse endpoint in two independent knockout designs, which rules out a Cre-transgene artefact as the
      source of the phenotype.
  downstream:

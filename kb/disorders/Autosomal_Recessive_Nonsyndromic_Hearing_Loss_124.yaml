- name: Reduced Resilience to Acoustic Overexposure
  biological_scale: CELLULAR
  description: >-
    In six-week-old conditional knockout mice, 94 dB SPL octave-band noise at 8-16 kHz for two hours produces
    ABR and DPOAE threshold shifts persisting to eight weeks. Cre-negative floxed littermates recover to baseline
    by two weeks. Post-noise mutant bundles show missing or shortened tall-row stereocilia and disorganization.
    This genotype-dependent vulnerability is demonstrated in mice; increased susceptibility in humans remains
    untested.
  cellular_components:
  - preferred_term: stereocilium bundle
    term:
      id: GO:0032421
      label: stereocilium bundle
  cell_types:

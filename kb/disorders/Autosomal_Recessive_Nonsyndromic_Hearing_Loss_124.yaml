  notes: >-
    Only this node declares conformance to sensorineural_hair_cell_loss, and the omissions
    are deliberate rather than incomplete curation. The module's chain runs insult to
    "Cochlear Ionic Homeostasis Disruption and Oxidative Stress" to "Hair Cell
    Mechanotransduction Failure and Death". Neither middle node can be conformed here. There
    is no evidence of any ionic or oxidative disturbance in PKHD1L1 deficiency - it has not
    been looked for - and conforming to the mechanotransduction node would assert something
    the data contradict: FM1-43 loads normally in PKHD1L1-deficient hair cells, so
    transduction is not the failing step. The module's own notes invite hereditary
    nonsyndromic deafness to substitute a stereocilia gene at the insult node, and that
    would be defensible for the PKHD1L1 node, but a conformance that then skips two of the
    module's three intermediate steps says less than it appears to. The terminal node is
    where the two accounts genuinely meet.

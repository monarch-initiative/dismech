- name: Cochlear Hearing Loss
  biological_scale: ORGANISM
  conforms_to: "sensorineural_hair_cell_loss#Progressive Sensorineural Hearing Loss"
  description: >-
    The human endpoint is bilateral congenital or presumed-congenital sensorineural hearing loss with variable
    severity. Slow progression was quantified in Family 1 and progression was also described in Family 2. The
    adult course and general progression rate are unknown. Conditional and constitutive knockout mice show
    high-frequency hearing impairment extending to lower frequencies with age.
  notes: >-
    Conformance is limited to the module endpoint, with progression documented in a subset of humans and in
    mice. The module intermediate involving mechanotransduction failure and hair-cell death is not asserted:
    neonatal FM1-43 uptake does not establish normal lifetime transduction, and the cited studies do not demonstrate
    this combined intermediate in DFNB124. Human congenital onset is a timing descriptor, not a consequence
    of progressive hearing loss.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple lines of evidence collectively associate PKHD1L1 with nonsyndromic mild-moderate to severe sensorineural hearing loss."
    explanation: The human endpoint and its severity range, as the defining paper states it.

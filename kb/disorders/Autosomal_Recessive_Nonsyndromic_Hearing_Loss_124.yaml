notes: >-
  The mechanism is supported chiefly by knockout mice and allele-level in-vitro assays; human cochlear pathology
  has not been directly observed. The nonsyndromic scope reflects the founding human series, not an assertion
  that all PKHD1L1 biology is confined to hearing. General genetic-hearing-loss guidance supplies testing,
  habilitation, counseling and noise-avoidance principles; it does not supply DFNB124-specific frequencies
  or treatment outcomes. OTOF-directed therapy and unrelated noncochlear PKHD1L1 associations do not establish
  treatment or syndromic manifestations for DFNB124. PMID:32555200 describes reuse of six P4 mouse bundles
  from the earlier localization study, rather than independent biological replication. The human paper reports
  normal eye, cardiac and developmental assessments; positive ontology annotations for these features are therefore
  not adopted as DFNB124 manifestations.

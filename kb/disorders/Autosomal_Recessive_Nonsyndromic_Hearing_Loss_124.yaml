notes: >-
  Scope decision: curated as a DISEASE. One gene, one proximal lesion - the missing surface
  coat on the upper stereocilia - and one clinical picture. There are no member diseases to
  unite and this is not a subtype of any curated entry. Its MONDO parent, MONDO:0019588
  hearing loss, autosomal recessive, is an ontology grouping of dozens of unrelated DFNB
  loci and is not a dismech entry. The stub is deleted by this change.

  On the HPOA annotations for MONDO:0968981, which are not used. The Monarch/HPOA set for
  this term carries five phenotypes, all sourced to PMID:38459354: sensorineural hearing
  impairment, abnormal vestibular function, abnormality of the eye, intellectual disability,
  and abnormality of the cardiovascular system. The bottom three contradict the paper they
  cite - it reports the ophthalmology exam, the electrocardiogram and development as normal,
  and states in terms that syndromic involvement was excluded in all four probands. That
  sentence is quoted on the hearing phenotype in this entry. The most likely explanation is
  an import that lost the negation from an OMIM clinical synopsis. The vestibular annotation
  traces to a single episode of benign paroxysmal positional vertigo in one proband which
  resolved after an Epley manoeuvre, and which the paper does not treat as part of the
  phenotype. None of the four is curated here. This is worth reporting upstream; it is
  plausibly systematic rather than specific to this term.

  On module conformance. Only the terminal node conforms to sensorineural_hair_cell_loss,
  and the reasoning is on that node. The short version is that conforming to the module's
  "Hair Cell Mechanotransduction Failure and Death" node would assert a mechanism the data
  contradict - FM1-43 loads normally in PKHD1L1-deficient hair cells - and that its ionic and
  oxidative-stress node has simply never been investigated in this disease. Note that the
  neighbouring cochlear entries Autosomal_Recessive_Nonsyndromic_Hearing_Loss_103 and
  Autosomal_Recessive_Nonsyndromic_Hearing_Loss_104 declare no conformance at all, while
  Noise_Induced_Hearing_Loss conforms at five nodes; this entry sits between them
  deliberately rather than by omission.

  Where this entry and the neighbouring cochlear entries should agree, and where they should
  not. DFNB103 (CLIC5) is a lesion at the stereocilia taper, on the inside of the membrane,
  tethering it to the actin core. DFNB124 is on the outside, at the tips, and is a coat
  rather than a tether. Neither is a transduction or synaptic disease. The one substantive
  claim this entry makes about the bundle surface that a reader might want to carry across is
  narrow: PKHD1L1 forms the upper part of the coat and not the lower, so "the stereocilia
  coat" is not one thing, and an entry elsewhere that treats it as a single structure would
  be overreaching.

  What is deliberately not curated. There is no biochemical, histopathology or imaging block;
  no patient tissue or cochlear imaging has been published. There are no clinical trials -
  none is registered for this gene or disorder. Cochlear implantation is not curated as a
  treatment, and noise avoidance is not curated as a treatment; both are argued in the
  treatments notes and the noise discussion. The Cell Image Library deposits behind the
  immunogold FIB-SEM localisation (PMID:32555200) are not curated as a datasets record
  because this repository has no prefix for that archive and the dataset verifier could not
  resolve one; the paper is cited in the top-level references instead.

  On the deep-research report.
  research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_124-deep-research-falcon.md is
  committed with this entry. Its Named Entity Confusion preflight passes: PKHD1L1 is
  mentioned 50 times against 7 for the next token, and it correctly identifies MYO7A as the
  competing gene in Family 3 rather than as a second cause of the disease. All eleven of its
  references resolved. It added nothing this entry does not contain, which is expected given
  that the disease has one clinical paper; its useful contribution was independent
  confirmation that no clinical trial and no Orphanet record exist. Its one obsolete term
  suggestion, GO:0032429, is not used, and every ontology term here was resolved through OLS
  and checked against the label the service returned.

  On PKHD1L1's non-cochlear biology, which is extensive and none of which is DFNB124: it is
  summarised in the genetic notes rather than here, because the point is about the gene
  rather than about curation scope.

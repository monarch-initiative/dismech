genetic:
- name: PKHD1L1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PKHD1L1
    term:
      id: hgnc:20313
      label: PKHD1L1
  notes: >-
    Reported genotypes, using NM_177531.6 and NP_803875.2, were c.385G>A/p.Gly129Ser in trans with c.3941G>T/p.Gly1314Val;
    homozygous c.10141C>T/p.Arg3381Ter; homozygous c.7437C>A/p.His2479Gln; and c.1813G>A/p.Gly605Arg in trans
    with c.8452_8468del/p.Leu2818TyrfsTer5. Functional evidence differs among alleles: recombinant mouse-fragment
    stability assays support the first pair, and minigene splicing supports c.1813G>A. Truncation/decay effects
    are predicted; p.His2479Gln remains particularly uncertain because of the competing MYO7A variant and absent
    parental segregation. These are reported disease-associated alleles, not a blanket clinical classification
    of pathogenicity. The human paper describes a 4243-residue protein; the mouse papers use a 4249-residue
    sequence. PKHD1L1 is distinct from PKHD1, the polycystic-kidney-disease gene.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we provide data to support that mutations in PKHD1L1 cause human nonsyndromic autosomal recessive congenital, mild–moderate to severe SNHL."
    explanation: The gene-disease relationship as established by the defining paper.
  - reference: PMID:31444330
    reference_title: "PKHD1L1 is a coat protein of hair-cell stereocilia and is required for normal hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "we identify Polycystic Kidney and Hepatic Disease 1-Like 1 (PKHD1L1), a large, mostly extracellular protein of 4249 amino acids with a single transmembrane domain"
    explanation: >-
      Architecture of the mouse protein; the human and mouse sequence lengths must not be conflated or attributed
      to signal-peptide inclusion without evidence.
diagnosis:
- name: PKHD1L1 sequencing in unexplained bilateral congenital sensorineural hearing loss
  description: >-
    Exome sequencing identified the four reported biallelic genotypes, including Family 4 through reanalysis.
    General genetic-hearing-loss guidance supports a multigene panel or genomic testing, with explicit confirmation
    that PKHD1L1 is covered. Interpret variants with segregation, phase, current pathogenicity assessment and
    the phenotype; a pair of uncertain variants does not by itself establish causation. Family 3 illustrates
    the need to investigate competing genes.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study serves as a call to clinical laboratories to include careful screening of PKHD1L1 biallelic variants in patients with a hearing loss ranging from mild–moderate to severe."
    explanation: The diagnostic recommendation the paper makes, and the severity range it targets.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The homozygous variant in MYO7A, with a coverage of 198 high quality reads, was deprioritized given uncertain and neutral in silico predictions with respect to impact on protein structure and function"
    explanation: >-
      How the second candidate was handled in the one family where two plausible homozygous variants were present.
      It was deprioritised on prediction, not excluded by function.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initial exome analysis was negative; sequencing data were reanalyzed after this manuscript was deposited as a preprint in medRxiv"
    explanation: >-
      The fourth family was solved by reanalysing an exome that had already been reported as negative, once
      the gene became known. That is the practical argument for periodic reinterpretation in undiagnosed hearing
      loss, and it is the reason a negative exome predating 2024 does not exclude this diagnosis.

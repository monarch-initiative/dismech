pathophysiology:
- name: PKHD1L1 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of PKHD1L1, which encodes a 4243-amino-acid protein that is almost
    entirely extracellular - a large ectodomain of IPT repeats, a single transmembrane
    helix, and a cytoplasmic tail of only a handful of residues. The reported human alleles
    span the mutation classes: a nonsense variant p.(Arg3381Ter) predicted to trigger
    nonsense-mediated decay, a frameshift p.(Leu2818TyrfsTer5), a variant annotated as
    missense, p.(Gly605Arg), that a minigene assay shows is really a splice allele causing
    exon 17 skipping, and two missense alleles whose recombinant protein fragments are
    measurably destabilised.
  genes:
  - preferred_term: PKHD1L1

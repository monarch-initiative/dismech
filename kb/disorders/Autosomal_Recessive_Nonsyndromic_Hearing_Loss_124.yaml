environmental:
- name: Moderate acoustic overexposure
  description: >-
    In six-week-old conditional knockout mice, 94 dB SPL octave-band noise at 8-16 kHz for two hours produces
    ABR and DPOAE threshold shifts persisting to eight weeks. Cre-negative floxed littermates recover to baseline
    by two weeks. Post-noise mutant bundles show missing or shortened tall-row stereocilia and disorganization.
    This genotype-dependent vulnerability is demonstrated in mice; increased susceptibility in humans remains
    untested.
  exposure_term:
    preferred_term: exposure to sound radiation
    term:
      id: ECTO:8000044
      label: exposure to sound radiation
  influences_mechanisms:
  - target: Reduced Resilience to Acoustic Overexposure
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      The exposure is what converts the latent bundle fragility into permanent damage. It does not cause the
      disease - the mutant bundle deteriorates with age without any noise challenge - so the effect is EXACERBATES
      rather than TRIGGERS.
    evidence:
    - reference: PMID:39482437
      reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "These data therefore show the noise exposure, normally only sufficient to cause TTS in normal mice, leads to PTS in PKHD1L1-deficient mice."
      explanation: >-
        The exposure acting on the mechanism, stated as a genotype-dependent conversion of a temporary shift
        into a permanent one.
  evidence:
  - reference: PMID:39482437
    reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Furthermore, PKHD1L1-deficient mice are susceptible to permanent hearing loss following moderate acoustic overexposure, which induces only temporary hearing threshold shifts in wild-type mice."
    explanation: >-
      Entry-level evidence that acoustic overexposure is a factor in this disease at all, separate from the
      claim about which mechanism it acts on.
  notes: >-
    This is a mouse modifier experiment in a genetic hearing disorder. Human DFNB124 noise susceptibility and
    prevention efficacy have not been established in the cited studies.
prevalence:

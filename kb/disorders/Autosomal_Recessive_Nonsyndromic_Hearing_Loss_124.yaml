    term:
      id: CL:0000601
      label: cochlear outer hair cell
  mechanism_confidence: PROVISIONAL
  notes: >-
    This node has no human evidence at all. It is entirely a mouse finding, and the human
    paper explicitly names it as an open question rather than a described feature of
    DFNB124. It is curated as a node, rather than left out or buried in prose, because it is
    a structural gene-environment interaction with an environmental entry pointing at it,
    and because leaving it out would hide the one place where this disease might be
    modifiable. mechanism_confidence is PROVISIONAL to mark the species gap, and the
    corresponding discussion states it.

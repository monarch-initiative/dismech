    allele_type: nonsense, frameshift, splice-disrupting and destabilising missense variants
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Two families are homozygous and two compound heterozygous. The zygosity slot records
      COMPOUND_HETEROZYGOUS because that is the configuration in the family with the fullest
      functional workup; the homozygous families are described here rather than by a second
      value, since the slot is single-valued.
    notes: >-
      LOSS_OF_FUNCTION is used for the block because FunctionalImpactEnum defines it as
      "complete or partial reduction of normal gene product function", which covers both the
      nonsense allele and the destabilising missense ones. It is worth being explicit about
      how much of that is measured. For p.(Arg3381Ter) the loss is predicted from
      nonsense-mediated decay, not demonstrated. For the two missense alleles what was
      measured is a fall in the thermal-folding stability of recombinant protein fragments -
      about 6 degrees of onset temperature for p.(Gly129Ser) and about 9 degrees of melting
      temperature for p.(Gly1314Val) - which is a strong argument that the folded protein is
      less stable, and an inference rather than a demonstration that PKHD1L1 function in a
      hair bundle is reduced. No patient hair cell has been examined.

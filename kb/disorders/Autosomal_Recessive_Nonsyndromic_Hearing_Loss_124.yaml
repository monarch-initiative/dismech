    term:
      id: CL:0000601
      label: cochlear outer hair cell
  mechanism_confidence: PROVISIONAL
  notes: >-
    Human transfer is provisional. The exposure experiment does not establish a clinical noise threshold or
    a DFNB124-specific prevention effect.

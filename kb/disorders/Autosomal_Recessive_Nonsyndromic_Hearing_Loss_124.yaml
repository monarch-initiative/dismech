name: Autosomal Recessive Nonsyndromic Hearing Loss 124
category: Mendelian
creation_date: "2026-09-03T00:00:00Z"
synonyms:
- DFNB124
- deafness, autosomal recessive 124
- autosomal recessive deafness 124
- PKHD1L1-related hearing loss
description: >-
  DFNB124 is bilateral, nonsyndromic sensorineural hearing loss caused by biallelic
  variants in PKHD1L1. Its interest for this knowledge base is where in the hair bundle the
  lesion sits. The cochlear entries curated alongside it fail in the bundle's actin core and
  taper (CLIC5, DFNB103), in transduction, or at the synapse. PKHD1L1 is none of those: it
  is a very large, almost entirely extracellular protein that sits on the outside of the
  stereocilia, and it is the first identified molecular component of the electron-dense
  surface coat that decorates them.

  That coat had been described morphologically for decades without anyone knowing what it
  was made of. Mice lacking PKHD1L1 in hair cells lose it - specifically at the upper part
  of the stereocilia, where PKHD1L1 is concentrated, while the coat at the stereocilia
  bases is unaffected. So the lesion is compartmentalised twice over: it is on the
  extracellular surface rather than inside the cell, and it is on the upper stereocilia
  rather than the whole length.

  The ordering of events is the second thing this entry should say clearly, because it is
  unusual for a hair-bundle gene. Development is normal. PKHD1L1-deficient mice show no
  disruption of bundle cohesion and no failure of tectorial-membrane attachment-crown
  formation; stereocilin localises correctly and the bundle imprints in the tectorial
  membrane still form. Mechanotransduction is intact - FM1-43 loads normally. Only from
  about six weeks of age do stereocilia start to go missing and bundles lose coherence,
  beginning in the shortest row and in the high-frequency base. This is a maintenance
  failure of a bundle that was built correctly, not a developmental malformation, and it is
  what separates PKHD1L1 from the link and transduction genes whose mutants have severely
  damaged bundles from the start.

  A third finding has no human counterpart yet and is worth stating as such. A noise dose
  that produces only a temporary threshold shift in wild-type mice produces a permanent one
  in PKHD1L1-deficient mice, with tall-row stereocilia loss on top of the short-row loss
  that ageing alone causes. That is a gene-environment interaction, and it is curated here
  as one - but nobody has measured noise susceptibility in a person with DFNB124, and the
  human paper says so explicitly.

  In humans the picture is four unrelated families, congenital and bilateral, mild-moderate
  to severe, and only slowly progressive: the best-documented proband gained 5 to 8 dB of
  threshold over nine years. That is a different time course from the mouse, which hears
  normally at first and then deteriorates, and closer to the zebrafish double mutant, which
  is already impaired as a larva. The disagreement is recorded as a human-model mismatch
  rather than smoothed over, because almost all of the mechanism comes from the mouse.

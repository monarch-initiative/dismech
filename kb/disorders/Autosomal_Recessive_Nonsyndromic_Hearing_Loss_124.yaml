- name: Progressive Cochlear Hearing Loss
  biological_scale: ORGANISM
  conforms_to: "sensorineural_hair_cell_loss#Progressive Sensorineural Hearing Loss"
  description: >-
    The clinical endpoint: bilateral sensorineural hearing loss of cochlear origin, ranging
    from mild-moderate to severe. In the mouse it begins at high frequencies and spreads to
    lower ones with age, in both the conditional and the constitutive knockout. In humans it
    is present from early childhood and worsens slowly rather than steeply.

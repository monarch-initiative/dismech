- name: Reduced Resilience to Acoustic Overexposure
  biological_scale: CELLULAR
  description: >-
    A noise dose calibrated to cause only a temporary threshold shift in wild-type mice
    causes a permanent one in PKHD1L1-deficient mice. Control thresholds recover to baseline
    by two weeks; mutant thresholds do not, at two weeks or at eight. Morphologically the
    difference shows as tall-row stereocilia loss and disorganisation after noise, on top of
    the short-row loss that ageing alone produces. The bundle that develops without a coat
    is therefore not just slower to fail with age - it is less able to absorb an acoustic
    insult.
  cellular_components:
  - preferred_term: stereocilium bundle

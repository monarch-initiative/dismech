pathophysiology:
- name: Biallelic PKHD1L1 Functional Impairment
  biological_scale: MOLECULAR
  description: >-
    Reported biallelic PKHD1L1 variants are consistent with reduced protein function, with allele-dependent
    evidence. p.Arg3381Ter and p.Leu2818TyrfsTer5 are predicted truncating alleles. p.Gly129Ser and p.Gly1314Val
    destabilized recombinant mouse PKHD1L1 fragments carrying the corresponding substitutions; full-length
    protein function was not measured. c.1813G>A, annotated p.Gly605Arg, caused exon 17 skipping in HEK293
    and HeLa minigene assays. The contribution of p.His2479Gln remains uncertain because functional testing
    and parental segregation were unavailable and the proband also carried a homozygous MYO7A variant.
  genes:
  - preferred_term: PKHD1L1
    term:
      id: hgnc:20313
      label: PKHD1L1
  genetic_context:
    genes:
    - preferred_term: PKHD1L1
      term:
        id: hgnc:20313
        label: PKHD1L1
    allele_type: nonsense, frameshift, splice-disrupting and destabilising missense variants
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Two reported genotypes were homozygous and two compound heterozygous; no single zygosity value represents
      the disease-level node.
    notes: >-
      Reduced function is the proposed shared mechanism, not a measured property of every allele. Nonsense-mediated
      decay of p.Arg3381Ter is predicted. NanoDSF measured decreased folding stability of recombinant fragments,
      not full-length activity in a hair cell. Exon skipping was measured in minigenes, not patient cochlear
      RNA. p.His2479Gln lacks direct functional evidence.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT

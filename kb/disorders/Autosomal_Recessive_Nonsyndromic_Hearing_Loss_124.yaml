    preferred_term: Bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
  notes: >-
    OBLIGATE is used because the source states this of all four probands, and because a
    nonsyndromic deafness entity is ascertained through the hearing loss so no unaffected
    biallelic carrier could have been reported. The denominator is nevertheless four
    probands.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bilateral congenital SNHL which is nonsyndromic and mild–moderate to severe"
    explanation: The phenotype, its laterality, and its severity range in one clause.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional syndromic involvement was excluded in all four probands."
    explanation: >-
      The statement that makes the entity nonsyndromic, and the reason the entry curates no
      eye, cardiac or cognitive phenotype.
- name: Congenital Onset of Hearing Impairment
  category: Ear
  description: >-
    Hearing loss is present from birth or infancy. The proband of Family 1 failed newborn
    hearing screening bilaterally; the proband of Family 2 was clinically diagnosed at two
    and a half months. In Family 4 the loss is believed congenital by parental report but
    newborn screening was not performed.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
  notes: >-
    The source is not perfectly self-consistent on this point and the entry follows the more
    cautious of its two statements. Its introduction says all four probands presented with
    bilateral congenital hearing loss; its discussion says the presentation is congenital
    "in the majority of patients". VERY_FREQUENT rather than OBLIGATE records the weaker
    claim, which is also the one supported by the case descriptions, where one family's
    congenital onset rests on parental report without a newborn screen.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although presenting congenitally in the majority of patients, the degree of hearing impairment in the patients we present is fairly broad"
    explanation: >-
      The cautious form of the onset claim, and the same sentence's statement that severity
      varies widely.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She did not pass a newborn hearing screen bilaterally."
    explanation: >-
      The one proband in whom congenital onset is documented by a screening test rather than
      inferred.
- name: Slowly Progressive Hearing Impairment
  category: Ear
  description: >-
    Where serial audiometry exists, thresholds worsen slowly. The proband of Family 1 was
    followed roughly every six months from age four to age thirteen and gained 5 dB of
    pure-tone average in the right ear and 8 dB in the left over that period - progression,
    but at a pace an order of magnitude below the several decibels a year seen in DFNB103.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  notes: >-
    FREQUENT rather than more, because serial audiometry over years is reported for one
    proband. The other three are single or short-interval assessments, which cannot
    establish progression either way.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "consistently demonstrated a slowly progressive mild to moderate SNHL bilaterally"
    explanation: >-
      The progression claim, from the one proband with nine years of serial pure-tone
      audiometry.
- name: Severe Hearing Impairment
  category: Ear
  description: >-
    The severe end of the range. The proband of Family 3 had bilateral severe loss, and the
    proband of Family 2 moderate-to-severe loss at all frequencies by age nine.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Severe sensorineural hearing impairment
    term:
      id: HP:0008625
      label: Severe sensorineural hearing impairment
  notes: >-
    A caveat belongs with this phenotype rather than in a footnote. The severe proband,
    Family 3, is also the one where causation is least secure: he carries a homozygous MYO7A
    p.(Leu375Val) variant in addition to the homozygous PKHD1L1 p.(His2479Gln), and the
    authors state that the PKHD1L1 variant could be incidental, or that both could
    contribute to a more severe loss. So the severe pole of this disease's range is
    supported by the least clean of the four families. That is why the frequency is
    OCCASIONAL and why the caveat is recorded here.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "his audiometric testing demonstrated a bilateral severe SNHL"
    explanation: The severe pole of the reported range, in the Family 3 proband.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has progressed to a bilateral moderate to severe degree. Pure-tone audiometry shows moderate to severe SNHL at all frequencies."
    explanation: >-
      The Family 2 proband, whose loss reached moderate-to-severe by age nine and who has the
      cleanest genotype in the series, a homozygous nonsense allele.
- name: Absent Otoacoustic Emissions
  category: Ear
  description: >-
    Absent distortion product otoacoustic emissions with normal tympanometry in the proband
    of Family 4, which localises the failure to the outer hair cells rather than the middle
    ear. Emissions were by contrast present bilaterally in the proband of Family 2 despite
    moderate-to-severe loss.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Absent otoacoustic emissions
    term:
      id: HP:6000182
      label: Absent otoacoustic emissions
  notes: >-
    Curated because it is the only human measurement in the series that speaks to cell type,
    and because it is not uniform: one proband has absent emissions and another has
    preserved ones. Both facts are recorded rather than the convenient one alone.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DPOAEs were absent in both ears, and the tympanograms were normal, suggesting dysfunction of the outer hair cells."
    explanation: The finding and the inference the clinicians drew from it.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Speech audiometry understanding is 100% at a comfortable listening level, and the otoacoustic emissions were present bilaterally."
    explanation: >-
      The contrary observation in another proband, recorded so the phenotype is not read as
      uniform across the series.
environmental:
- name: Moderate acoustic overexposure
  description: >-
    A noise dose in the temporary-threshold-shift range. In PKHD1L1-deficient mice a
    two-hour exposure to 94 dB SPL bandpass noise at six weeks of age produces a permanent
    threshold shift, where genotype-matched controls given the same exposure recover to
    baseline within two weeks. This is the one modifiable factor identified for this
    disease, and it has been tested only in mice.
  exposure_term:
    preferred_term: exposure to sound radiation
    term:
      id: ECTO:8000044
      label: exposure to sound radiation
  influences_mechanisms:
  - target: Reduced Resilience to Acoustic Overexposure
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      The exposure is what converts the latent bundle fragility into permanent damage. It
      does not cause the disease - the mutant bundle deteriorates with age without any noise
      challenge - so the effect is EXACERBATES rather than TRIGGERS.
    evidence:
    - reference: PMID:39482437
      reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "These data therefore show the noise exposure, normally only sufficient to cause TTS in normal mice, leads to PTS in PKHD1L1-deficient mice."
      explanation: >-
        The exposure acting on the mechanism, stated as a genotype-dependent conversion of a
        temporary shift into a permanent one.
  evidence:
  - reference: PMID:39482437
    reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Furthermore, PKHD1L1-deficient mice are susceptible to permanent hearing loss following moderate acoustic overexposure, which induces only temporary hearing threshold shifts in wild-type mice."
    explanation: >-
      Entry-level evidence that acoustic overexposure is a factor in this disease at all,
      separate from the claim about which mechanism it acts on.
  notes: >-
    No human data. Nobody has measured noise susceptibility, occupational or recreational
    noise history, or threshold trajectory after noise in a person with DFNB124, and the
    human paper names this as an open question. The exposure is curated because the
    structural claim - that this genotype converts a survivable noise dose into a
    destructive one - is a real one with an obvious clinical implication if it holds in
    people, not because it has been shown in people.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence estimate exists. Four unrelated families - from the United States, Iran,
    Pakistan and China - have been reported, in one 2024 paper. The geographic spread is
    worth noting because it argues against a founder effect and for the gene being
    genuinely, if rarely, mutated worldwide. The defining paper argues the true frequency is
    probably higher than the case count suggests, on the grounds that mild-to-moderate
    hearing loss is under-tested; that is an argument about ascertainment rather than a
    measurement, and no rate_per_100000 is given because none has been reported.

    One real denominator does exist and is worth recording even though it cannot be turned
    into a rate: the fourth proband was found in a Henan cohort of 1450 hearing loss probands,
    and only on reanalysis of an exome that had first been read as negative. One family in
    1450 ascertained hearing-loss probands is a ceiling on how common this is among people
    already referred for deafness genetics, not a population figure.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing was performed on DNA of four families segregating autosomal recessive nonsyndromic sensorineural hearing loss."
    explanation: The number of families, which is the whole published denominator.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PKHD1L1 testing in individuals with mild-moderate hearing loss may identify further affected families."
    explanation: >-
      The authors' own ascertainment argument, which is why the case count should not be
      read as an upper bound.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This set comprises a total of 1450 hearing loss probands mainly from Henan Province, China, and it includes syndromic and nonsyndromic hearing loss."
    explanation: >-
      The one cohort denominator in the series, from which a single family was identified.
progression:
- phase: Congenital and early childhood
  notes: >-
    Hearing loss is present from birth or within the first months in the reported probands,
    ranging from mild-moderate to severe. This is the phase in which the diagnosis is
    normally made, through newborn screening or early paediatric audiology.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bilateral congenital SNHL which is nonsyndromic and mild–moderate to severe"
    explanation: The state of hearing at presentation.
- phase: Slow progression through childhood
  notes: >-
    Thresholds worsen slowly over years where they have been followed. The longest series is
    nine years in one proband, with 5 to 8 dB of change; that is enough to establish
    progression and far too little to give a rate that could be extrapolated. Nothing is
    known about the adult course - the oldest reported patient is thirteen - and whether the
    late deterioration and noise vulnerability seen in adult mice have human counterparts is
    unknown.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "consistently demonstrated a slowly progressive mild to moderate SNHL bilaterally"
    explanation: The pace of change over the longest documented follow-up in the series.
genetic:
- name: PKHD1L1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PKHD1L1
    term:
      id: hgnc:20313
      label: PKHD1L1
  notes: >-
    PKHD1L1, also called fibrocystin-L, is at 8q23.1 and encodes a 4243-amino-acid type-I
    transmembrane protein: a very large ectodomain built from about fourteen predicted IPT
    repeats, a 20-residue transmembrane segment, and a cytoplasmic tail of roughly eight
    residues. The proportions matter mechanistically - a protein this lopsided is a surface
    structure, not a signalling receptor, and the disease is correspondingly a defect of the
    stereocilia exterior. It is the paralogue of PKHD1, in which biallelic variants cause
    autosomal recessive polycystic kidney disease; no kidney or liver phenotype has been
    reported in DFNB124.

    The gene has substantial non-cochlear biology that does not belong in this entry.
    Knockdown in the mouse dentate gyrus raises seizure susceptibility through loss of KCC2,
    it marks a lung lymphatic endothelial population, it appears as a candidate prognostic
    marker in lung adenocarcinoma, and it turns up in female-infertility association loci.
    None of that has a human DFNB124 counterpart, and the defining paper says as much about
    the seizure work specifically. That a gene with this much pleiotropy in model systems
    nevertheless produces a strictly nonsyndromic human phenotype is a real observation
    about the entity, not an omission.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we provide data to support that mutations in PKHD1L1 cause human nonsyndromic autosomal recessive congenital, mild–moderate to severe SNHL."
    explanation: The gene-disease relationship as established by the defining paper.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no evidence that mutations in PKHD1L1 lead to seizures in humans"
    explanation: >-
      The scoping statement for the gene's other biology, made by the authors themselves in
      the context of the mouse seizure work.
  - reference: PMID:31444330
    reference_title: "PKHD1L1 is a coat protein of hair-cell stereocilia and is required for normal hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "we identify Polycystic Kidney and Hepatic Disease 1-Like 1 (PKHD1L1), a large, mostly extracellular protein of 4249 amino acids with a single transmembrane domain"
    explanation: >-
      The protein's architecture, which is what makes an extracellular-surface mechanism the
      expected one. Note the residue count differs between papers because one includes the
      signal peptide.
diagnosis:
- name: PKHD1L1 sequencing in unexplained bilateral congenital sensorineural hearing loss
  description: >-
    In all four families the diagnosis came from exome sequencing performed for undiagnosed
    recessive hearing loss, not from a targeted test - PKHD1L1 was not on hearing-loss gene
    panels when these families were studied. The practical consequence the authors draw is
    that PKHD1L1 should now be included, and specifically that it should be looked for in
    the mild-to-moderate range, where testing is less often pursued. The one interpretive
    trap in the series is worth carrying into practice: in the family with the most severe
    loss, a homozygous MYO7A variant was found alongside the homozygous PKHD1L1 variant, and
    which one is causal was not resolved.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study serves as a call to clinical laboratories to include careful screening of PKHD1L1 biallelic variants in patients with a hearing loss ranging from mild–moderate to severe."
    explanation: The diagnostic recommendation the paper makes, and the severity range it targets.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The homozygous variant in MYO7A, with a coverage of 198 high quality reads, was deprioritized given uncertain and neutral in silico predictions with respect to impact on protein structure and function"
    explanation: >-
      How the second candidate was handled in the one family where two plausible homozygous
      variants were present. It was deprioritised on prediction, not excluded by function.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initial exome analysis was negative; sequencing data were reanalyzed after this manuscript was deposited as a preprint in medRxiv"
    explanation: >-
      The fourth family was solved by reanalysing an exome that had already been reported as
      negative, once the gene became known. That is the practical argument for periodic
      reinterpretation in undiagnosed hearing loss, and it is the reason a negative exome
      predating 2024 does not exclude this diagnosis.
treatments:
- name: Hearing Amplification and Audiological Management
  description: >-
    Hearing aids are the reported management. The proband of Family 2, whose loss is
    moderate to severe, uses them bilaterally; nothing else is reported for any of the four
    patients. Amplification does not act on the mechanism - it raises the signal reaching a
    cochlea whose amplifier is failing.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing amplification with a hearing aid
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Outer Hair Cell Dysfunction and Loss of Cochlear Amplification
    treatment_effect: BYPASSES
    description: >-
      Amplification substitutes external gain for the lost cochlear amplifier. It does not
      restore outer hair cell function or slow the bundle degeneration.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband currently uses hearing aids bilaterally."
    explanation: >-
      The only treatment reported for any patient in the series, in the proband with
      moderate-to-severe loss.
- name: Genetic Counselling and Cascade Testing
  description: >-
    Counselling for a recessive condition with a 25 percent sibling recurrence risk, in a
    setting where family history is usually absent because heterozygous carriers hear
    normally - the parents in every reported family had normal hearing. Two of the four
    families are consanguineous, which is where cascade testing and recurrence counselling
    have the most to offer. Counselling does not act on the mechanism; it is included
    because it is the one intervention the genotype itself indicates.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing at this locus confirmed the homozygous variant and revealed that the parents were both heterozygous carriers of the c.10141C>T, p.(Arg3381Ter) substitution."
    explanation: >-
      Carrier status confirmed in both parents of one proband, which is the finding
      counselling and cascade testing act on.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband is a 9-year-old Iranian male of Lur ethnicity born to healthy consanguineous (first cousin) parents with subjectively normal hearing."
    explanation: >-
      Consanguinity with normal-hearing parents, which is the family structure in which
      recurrence counselling matters most and in which family history is least informative.
  notes: >-
    Cochlear implantation is deliberately not curated. It is standard for severe-to-profound
    sensorineural hearing loss and would look right here, but no DFNB124 patient has been
    reported to have received one, the loss in this series does not reach the profound range,
    and importing the indication would attribute to these four patients an intervention
    recorded only in other people. Avoidance of noise exposure is likewise not curated as a
    treatment: it follows from the mouse result rather than from any human study, and it is
    recorded where that provenance is visible, as an environmental entry and an open
    discussion.
animal_models:
- name: Hair-cell-specific Pkhd1l1 conditional knockout mouse
  species: Mouse
  genotype: Pkhd1l1 fl/fl; Atoh1-Cre+ (hair-cell-specific deletion of exon 10)
  background: C57BL/6J-derived, carrying the Cdh23ahl age-related hearing loss allele
  publication: PMID:31444330
  genes:
  - preferred_term: PKHD1L1
    term:
      id: hgnc:20313
      label: PKHD1L1
  description: >-
    The model that carries nearly all of the mechanism in this entry. Deleting Pkhd1l1 in
    hair cells removes the stereocilia surface coat at the tips while leaving development,
    mechanotransduction and tectorial-membrane attachment intact, and produces progressive
    hearing loss beginning at high frequencies. The same line, followed for longer in a
    second study, gives the bundle-maintenance and noise-susceptibility results; a
    constitutive knockout made subsequently reproduces the hearing phenotype, which
    addresses the possibility that the Atoh1-Cre transgene rather than the deletion drives it.
  modeled_mechanisms:
  - target: Loss of the Stereocilia Surface Coat at Stereocilia Tips
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      This model is how the coat was identified as a PKHD1L1 structure at all: the coat at
      the tips is absent in the mutant and present in littermate controls, on tannic-acid
      stained transmission electron microscopy.
    limitations: >-
      The coat has never been examined in human hair cells, in a patient or otherwise, so the
      identity of the human structure with the mouse one is assumed from protein orthology.
      The loss is also partial in a specific sense that should not be lost: only the upper
      coat goes, and the paper suggests the lower coat is made of different proteins.
    readouts:
    - name: Density of the electron-dense surface coat at stereocilia tips
      target: Loss of the Stereocilia Surface Coat at Stereocilia Tips
      direction: DECREASED
      interpretation: >-
        Tannic-acid staining intensity across the stereocilia membrane falls at the tips in
        mutants and is unchanged at the bases.
      evidence:
      - reference: PMID:31444330
        reference_title: "PKHD1L1 is a coat protein of hair-cell stereocilia and is required for normal hearing."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PKHD1L1-deficient mice show a large decrease of the surface coat intensity only at the tips of stereocilia"
        explanation: The measurement and its restriction to the upper stereocilia.
    evidence:
    - reference: PMID:31444330
      reference_title: "PKHD1L1 is a coat protein of hair-cell stereocilia and is required for normal hearing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "PKHD1L1-deficient mice lack the surface coat at the upper but not lower regions of stereocilia, and they develop progressive hearing loss."
      explanation: >-
        Establishes this model as the system in which the coat-PKHD1L1 relationship was
        demonstrated.
  - target: Failure of Stereocilia Bundle Maintenance After Normal Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The full time course - normal development, then progressive loss of stereocilia and
      bundle coherence from six weeks - was established in this line, together with the
      negative controls that rule out an attachment-crown or transduction mechanism.
    limitations: >-
      The background carries Cdh23ahl, the age-related hearing loss allele of C57BL/6, which
      is a confound for any age-dependent cochlear phenotype; the first study addressed it by
      comparing littermates rather than by moving the allele off the background. Bundle
      damage was scored by counting missing stereocilia on scanning electron microscopy in
      small numbers of cochleae. And no human bundle has been examined, so the correspondence
      to the human disease is inferred entirely from the shared gene.
    readouts:
    - name: Missing stereocilia per outer hair cell bundle by row
      target: Failure of Stereocilia Bundle Maintenance After Normal Development
      direction: INCREASED
      interpretation: >-
        Stereocilia are lost from the shortest row first and from taller rows with age, most
        in the high-frequency base.
      evidence:
      - reference: PMID:39482437
        reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "stereocilia loss was most significant in the shortest row, progressing to the taller rows with age; most prominently in, but not limited to, the high frequency basal region"
        explanation: The readout, its direction and its spatial pattern.
    - name: Stereocilin localisation at tectorial-membrane attachment crowns
      target: Failure of Stereocilia Bundle Maintenance After Normal Development
      direction: UNCHANGED
      interpretation: >-
        A real negative: the attachment-crown protein is where it should be in mutant
        bundles, so crown formation is not the failing step.
      evidence:
      - reference: PMID:39482437
        reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We therefore conclude that PKHD1L1 is not required for the localization of STRC to attachment crowns or horizontal top connectors."
        explanation: The negative readout, as the authors state it.
    evidence:
    - reference: PMID:39482437
      reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results suggest a role for PKHD1L1 in establishing robust sensory hair bundles during development, necessary for maintaining bundle cohesion and function in response to acoustic trauma and aging."
      explanation: >-
        The authors' summary of what this model shows, which is the claim the node makes.
  - target: Reduced Resilience to Acoustic Overexposure
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: >-
      The noise arm. Six-week-old mutants and littermate controls received the same two-hour
      94 dB SPL bandpass exposure; controls recovered to baseline by two weeks and mutants
      did not, at two weeks or at eight.
    limitations: >-
      Fidelity is UNKNOWN, not LOW, and the distinction is deliberate: the experiment is well
      controlled and the result is clear, but there is no human observation of any kind to
      compare it against, so how faithfully it represents a human patient cannot be assessed.
      Two further limits belong on the result itself. Threshold shifts were measured against
      an 80 dB SPL ceiling, and the mutants' baseline high-frequency thresholds already sit
      near that ceiling, so the measured shift understates the damage at exactly the
      frequencies where the disease is worst. And the exposure paradigm is a single laboratory
      dose, not the chronic, variable noise history a person accumulates.
    readouts:
    - name: Auditory brainstem response threshold shift at 8 weeks after noise
      target: Reduced Resilience to Acoustic Overexposure
      direction: INCREASED
      interpretation: >-
        Mutant thresholds remain elevated 8 weeks after an exposure from which controls fully
        recover - a permanent rather than temporary threshold shift.
      evidence:
      - reference: PMID:39482437
        reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These data therefore show the noise exposure, normally only sufficient to cause TTS in normal mice, leads to PTS in PKHD1L1-deficient mice."
        explanation: The readout stated as the genotype contrast.
    evidence:
    - reference: PMID:38459354
      reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
      supports: NO_EVIDENCE
      evidence_source: HUMAN_CLINICAL
      snippet: "Further research will be needed to determine the effect of age or noise trauma on the potential progression of PKHD1L1-linked hearing loss."
      explanation: >-
        Recorded on the link rather than omitted, because it is what fixes the fidelity call:
        the human paper names age and noise as untested, so the model result has no human
        comparator. Graded NO_EVIDENCE because the sentence reports the absence of a study,
        not a result.
  - target: Progressive Cochlear Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model produces sensorineural hearing loss of cochlear origin, which is the human
      endpoint, but on a different schedule. Mouse hearing is normal at first and then
      declines from about three weeks at high frequencies, spreading to lower ones with age.
      Human hearing loss is present at birth or within months and then worsens only slowly.
    limitations: >-
      The onset divergence is the substantive limitation and is the subject of an open
      human-model mismatch discussion. There is a second, quieter one: the two studies of
      this same line disagree in degree, the later one finding threshold elevations less
      pronounced and slower to spread than the earlier, which the authors attribute to the
      recordings being made in different institutions. Any quantitative claim taken from this
      model should carry that.
    readouts:
    - name: Auditory brainstem response and distortion product thresholds across frequency and age
      target: Progressive Cochlear Hearing Loss
      direction: INCREASED
      interpretation: >-
        Thresholds rise - worse hearing - from three weeks at high frequencies and across all
        frequencies by six months.
      evidence:
      - reference: PMID:31444330
        reference_title: "PKHD1L1 is a coat protein of hair-cell stereocilia and is required for normal hearing."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PKHD1L1-deficient mice show elevated thresholds in response to high-frequency tones"
        explanation: The readout and where in the frequency range it starts.
    evidence:
    - reference: PMID:39482437
      reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both conditional and constitutive PKHD1L1 knockout mice develop high-frequency hearing loss progressing to lower frequencies with age."
      explanation: >-
        Two independent knockout designs give the same endpoint, which is what supports
        treating this model as informative for the human phenotype despite the timing
        difference.
- name: pkhd1l1a/pkhd1l1b double mutant zebrafish
  species: Zebrafish
  genotype: pkhd1l1a and pkhd1l1b CRISPR-Cas9 loss-of-function alleles, double homozygous
  publication: PMID:36960824
  genes:
  - preferred_term: PKHD1L1
    term:
      id: hgnc:20313
      label: PKHD1L1
  description: >-
    Zebrafish carry two pkhd1l1 paralogues, and knocking out both gives auditory impairment
    that is already present in the larva. The line matters here for one specific reason: its
    time course resembles the human disease more closely than the mouse's does, which is what
    makes the mouse-human onset difference a species question rather than a curation error.
  modeled_mechanisms:
  - target: Progressive Cochlear Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Auditory function is impaired, establishing that the gene's role in hearing is
      conserved across vertebrates, and the early onset is the closer match to the human
      congenital presentation.
    limitations: >-
      Fidelity is LOW for structural reasons rather than experimental ones. Zebrafish have no
      cochlea, no outer hair cells and no tectorial membrane, so nothing in this model can
      speak to the amplification and bundle-maintenance mechanism the mouse establishes; the
      readout is a behavioural startle response, not an audiogram. Two paralogues had to be
      removed together, which has no human counterpart. And the resemblance of its time
      course to the human one is a resemblance, not evidence about mechanism.
    readouts:
    - name: Auditory-evoked startle response at the larval stage
      target: Progressive Cochlear Hearing Loss
      direction: DECREASED
      interpretation: >-
        Double mutant larvae respond less to sound, so hearing is already impaired before any
        progressive process could have operated.
      evidence:
      - reference: PMID:36960824
        reference_title: "A conserved function of Pkhd1l1, a mammalian hair cell stereociliary coat protein, in regulating hearing in zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the double mutant zebrafish exhibited statistically significant hearing loss even from the larval stage"
        explanation: The readout and the age at which it is present.
    evidence:
    - reference: PMID:36960824
      reference_title: "A conserved function of Pkhd1l1, a mammalian hair cell stereociliary coat protein, in regulating hearing in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "in contrast to Pkhd1l1 mutant mice, which develop progressive hearing loss, the double mutant zebrafish exhibited statistically significant hearing loss even from the larval stage"
      explanation: >-
        The comparison that makes this model informative here: the two animal models disagree
        about onset, and the human phenotype sits on the zebrafish side of that disagreement.
discussions:
- discussion_id: dfnb124_onset_species_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Failure of Stereocilia Bundle Maintenance After Normal Development"
  - "pathophysiology#Progressive Cochlear Hearing Loss"
  prompt: >-
    Why does the mouse hear normally and then deteriorate, when the humans and the zebrafish
    are impaired from the start?
  rationale: >-
    Filed as a mismatch rather than a knowledge gap because the experiments were done and
    the answers disagree.

    The mouse is unambiguous. Bundles develop normally, cohesion and tectorial-membrane
    attachment are intact, mechanotransduction works, and only from six weeks do stereocilia
    start to disappear. The whole mechanistic account in this entry - a coat that is needed
    for maintenance rather than for construction - rests on that ordering.

    The humans do not fit it. All four probands presented congenitally or within the first
    months, and the best-followed of them changed by 5 to 8 dB over nine years. That is a
    disease that is already established at birth and then barely moves, which is close to the
    inverse of the mouse. The zebrafish double mutant sits on the human side: impaired as a
    larva.

    Several explanations are available and none has been tested. Human cochlear development
    is largely complete before birth while the mouse cochlea matures postnatally, so a mouse
    deficit that appears at six weeks may correspond to a human deficit that appears in
    utero - in which case the two are the same lesion on different clocks and there is no
    real mismatch, and it is the explanation the expression data most favour: PKHD1L1 protein
    is on the bundle only for the first ten postnatal days in the mouse and is completely
    cleared by day 21, three weeks before the bundle begins to fail, so whatever it does it
    does during development and the later failure is a delayed consequence. Shift that
    developmental window to its human equivalent, which closes before birth, and a congenital
    human phenotype is what the same mechanism predicts. Alternatively the human alleles are
    hypomorphic rather than null, which
    would predict a milder and different course from a conditional knockout; the two missense
    alleles are destabilising rather than abolishing. Or the coat may simply do more in the
    developing human bundle than in the mouse.

    Why it matters for how this entry should be read: the maintenance-not-construction claim,
    which is the most interesting thing about the disease, is a mouse claim. If the human
    lesion turns out to be developmental, most of the pathograph would need re-reading -
    although the coat's identity and its compartmental restriction would survive intact.
  evidence:
  - reference: PMID:39482437
    reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings reveal that PKHD1L1-deficient mice display no disruption to bundle cohesion or tectorial membrane attachment-crown formation during development."
    explanation: "The mouse half of the mismatch: development is normal."
  - reference: PMID:39482437
    reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Anti-PKHD1L1 labeling intensity gradually decreased with development, was largely gone by P10, and completely cleared in mature hair cells at P21."
    explanation: >-
      The observation that makes the developmental-timing explanation the leading one: the
      protein is absent from the bundle for three weeks before the phenotype appears, so the
      mouse lesion is set during development even though it is read out in adulthood.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bilateral congenital SNHL which is nonsyndromic and mild–moderate to severe"
    explanation: "The human half: present at birth."
  - reference: PMID:36960824
    reference_title: "A conserved function of Pkhd1l1, a mammalian hair cell stereociliary coat protein, in regulating hearing in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "in contrast to Pkhd1l1 mutant mice, which develop progressive hearing loss, the double mutant zebrafish exhibited statistically significant hearing loss even from the larval stage"
    explanation: >-
      The third species, and the reason the disagreement cannot be dismissed as a peculiarity
      of one model.
  proposed_experiments:
  - experiment_id: exp_dfnb124_developmental_timing
    name: Establish when the human lesion appears
    description: >-
      Two complementary approaches. First, examine the surface coat and bundle morphology in
      PKHD1L1-deficient mouse cochlea at prenatal and early postnatal ages with the sensitive
      methods used later, to test whether a subtle developmental deficit precedes the
      six-week onset. Second, differentiate hair-cell-like cells from patient-derived induced
      pluripotent stem cells carrying the human alleles and ask whether the coat forms at all,
      which would separate a construction defect from a maintenance defect without needing
      patient cochlea.
- discussion_id: dfnb124_noise_untested_in_humans
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Reduced Resilience to Acoustic Overexposure"
  - treatments#
  prompt: >-
    Are people with DFNB124 more vulnerable to noise, and should they be counselled to avoid
    it?
  rationale: >-
    This is the gap with the most direct clinical consequence in the entry, and it is
    completely open.

    The mouse result is clean: a dose that gives wild-type mice a temporary threshold shift
    gives PKHD1L1-deficient mice a permanent one, with tall-row stereocilia damage to match.
    If that transferred, it would mean that a child with DFNB124 has a modifiable risk factor
    - noise avoidance and hearing protection - on top of an otherwise untreatable condition.

    Nothing about it has been tested in a person. The human paper names age and noise trauma
    as open questions rather than reporting on them. No noise history is recorded for any of
    the four probands, no threshold trajectory around a noise exposure exists, and the oldest
    patient is thirteen, so the cumulative-exposure years where it would matter most have not
    happened yet.

    The entry therefore curates the exposure structurally, as an environmental entry with an
    EXACERBATES link and a PROVISIONAL node, and does not curate noise avoidance as a
    treatment. The distinction is not pedantry: a treatments entry would read as a
    recommendation for these patients, and no such recommendation has been made by anyone who
    has seen one.

    Closing the gap needs no new technology - a noise history and serial audiometry in the
    existing patients, or a targeted question in the next cohort report, would start it.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "Further research will be needed to determine the effect of age or noise trauma on the potential progression of PKHD1L1-linked hearing loss."
    explanation: >-
      The gap stated by the authors of the human paper. Graded NO_EVIDENCE because the
      sentence reports that no study exists, which neither supports nor refutes the claim.
  - reference: PMID:39482437
    reference_title: "PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function and resilience to noise exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, PKHD1L1-deficient mice are susceptible to permanent hearing loss following moderate acoustic overexposure, which induces only temporary hearing threshold shifts in wild-type mice."
    explanation: The animal result that makes the untested human question worth asking.
- discussion_id: dfnb124_family3_myo7a_confound
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "phenotypes#Severe Hearing Impairment"
  - "genetic#PKHD1L1"
  prompt: >-
    Is the severe end of the DFNB124 range real, or does it belong to a second gene?
  rationale: >-
    Family 3 supplies the severe pole of this disease's reported severity range and is the
    weakest of the four families.

    Its proband is homozygous for PKHD1L1 p.(His2479Gln) and also homozygous for MYO7A
    p.(Leu375Val). MYO7A is a well-established deafness gene; PKHD1L1 was not one when this
    family was studied. Both variants were covered by more than 150 high-quality reads, so
    this is not a calling artefact. The MYO7A variant was deprioritised because in silico
    predictions were neutral and the affected residue is not conserved - which is reasonable
    triage and is not functional evidence. No functional assay was done on either variant in
    this family, and no further follow-up of the individual was possible.

    The authors are explicit that three readings remain open: the PKHD1L1 variant is causal,
    the PKHD1L1 variant is incidental and MYO7A is causal, or both contribute to a loss more
    severe than PKHD1L1 alone would give. The third would explain why this is the most
    severely affected proband in the series.

    Two consequences for how the entry reads. The severe phenotype is curated as OCCASIONAL
    with the confound recorded on it, not as an established part of the range. And the
    p.(His2479Gln) allele is the one PKHD1L1 missense variant with no direct functional data
    - the nanoDSF work was done on the Family 1 alleles, and this one rests on an AlphaFold2
    model placing it in a conserved site.
  evidence:
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome analysis revealed two homozygous missense variants of interest: one in PKHD1L1 c.7437C>A, p.(His2479Gln) and one in MYO7A (NM_000260.4:c.1123C>G, p.(Leu375Val))."
    explanation: The two candidate variants in this proband, both homozygous.
  - reference: PMID:38459354
    reference_title: "PKHD1L1, a gene involved in the stereocilia coat, causes autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The homozygous variant in MYO7A, with a coverage of 198 high quality reads, was deprioritized given uncertain and neutral in silico predictions with respect to impact on protein structure and function"
    explanation: >-
      How the alternative was handled, and the basis on which it was set aside - prediction
      rather than experiment.
  proposed_experiments:
  - experiment_id: exp_dfnb124_his2479gln_function
    name: Functional test of PKHD1L1 p.(His2479Gln) and MYO7A p.(Leu375Val)
    description: >-
      Apply to p.(His2479Gln) the same nanoDSF thermal-stability assay used on the Family 1
      alleles, on a recombinant fragment spanning the predicted nickel-binding site, and test
      the MYO7A variant in a motor-function or trafficking assay. A destabilising result for
      the PKHD1L1 allele and a neutral one for MYO7A would settle which gene the severe
      phenotype belongs to.
external_assertions:

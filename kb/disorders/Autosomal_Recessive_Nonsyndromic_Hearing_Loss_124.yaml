- name: Loss of the Stereocilia Surface Coat at Stereocilia Tips
  biological_scale: MOLECULAR
  description: >-
    PKHD1L1 is the first identified molecular component of the electron-dense surface coat
    on hair-cell stereocilia. Immunogold electron microscopy puts it towards the stereocilia
    tips, at highest density in the top 300 nanometres, in all three rows and preferentially
    in the high-frequency base of the cochlea. Mice lacking it in hair cells lose the coat
    at the upper part of the stereocilia while the coat at the bases is unaffected - so the
    coat is not one substance, and PKHD1L1 accounts for the upper portion of it.

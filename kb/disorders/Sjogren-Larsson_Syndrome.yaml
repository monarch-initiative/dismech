treatments:
- name: Zileuton
  description: >
    Zileuton, a 5-lipoxygenase inhibitor, reduces synthesis of leukotriene B4
    and cysteinyl leukotrienes, targeting the LTB4 arm of the metabolic defect.
    An open-label trial reported improved pruritus and general well-being; a
    subsequent double-blind placebo-controlled crossover study did not confirm a
    pruritus benefit, so the evidence is mixed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zileuton
      term:
        id: CHEBI:10112
        label: zileuton
  target_phenotypes:
  - preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  target_mechanisms:
  - target: Leukotriene B4 Accumulation
    treatment_effect: INHIBITS
    description: >
      Zileuton inhibits 5-lipoxygenase, lowering leukotriene B4 synthesis and
      thereby the accumulated pruritogenic LTB4 that this node represents.
  evidence:
  - reference: PMID:11795678
    reference_title: "Clinical and biochemical effects of zileuton in patients with the Sjogren-Larsson syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Favourable effects were found on pruritus score (P = 0.006), general well-being, and background activity of electroencephalographic studies."
    explanation: An open-label trial of zileuton showed improvement in pruritus and general well-being in SLS patients.
  - reference: PMID:32021380
    reference_title: "Sjogren-Larsson Syndrome: Mechanisms and Management."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "could not be replicated in a double-blind cross over study involving 10 SLS patients"
    explanation: >-
      A subsequent double-blind crossover RCT did not replicate the open-label
      pruritus benefit, so the evidence for zileuton is mixed.

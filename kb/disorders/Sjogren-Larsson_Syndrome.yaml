biochemical:
- name: Elevated Long-Chain Fatty Alcohols
  notes: >
    Long-chain fatty alcohols accumulate markedly (about 25-fold in SLS
    keratinocytes), the primary biochemical consequence of the impaired
    fatty alcohol:NAD oxidoreductase (fatty alcohol cycle).
  evidence:
  - reference: PMID:32021380
    reference_title: "Sjogren-Larsson Syndrome: Mechanisms and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "accumulating to 25 fold more fatty alcohols in SLS keratinocytes"
    explanation: Quantifies the ~25-fold fatty alcohol accumulation in SLS keratinocytes.
- name: Profound Urinary Leukotriene B4 Excretion
  notes: >
    SLS uniquely shows profound urinary excretion of leukotriene B4 (with
    elevated omega-hydroxy-LTB4 and absent omega-carboxy-LTB4), reflecting the
    FALDH block in LTB4 omega-oxidation — a specific, non-invasive marker.
  evidence:
  - reference: PMID:32021380
    reference_title: "Sjogren-Larsson Syndrome: Mechanisms and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SLS is the only condition described with profound urinary excretion of LTB4"
    explanation: Documents the SLS-specific profound urinary LTB4 excretion.
histopathology:
- name: Epidermal Hyperkeratosis with Defective Lamellar Bodies
  description: >
    Skin biopsy shows pronounced hyperkeratosis, papillomatosis, and acanthosis;
    ultrastructurally there is global disruption of lamellar body formation and
    secretion, the direct observational correlate of the epidermal barrier
    defect.
  evidence:
  - reference: PMID:32021380
    reference_title: "Sjogren-Larsson Syndrome: Mechanisms and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "pronounced hyperkeratosis, papillomatosis and acanthosis"
    explanation: Documents the light-microscopic skin findings in SLS.
  - reference: PMID:32021380
    reference_title: "Sjogren-Larsson Syndrome: Mechanisms and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "global disruption of lamellar body formation and secretion"
    explanation: Documents the ultrastructural lamellar-body disruption anchoring the epidermal-barrier node.
- name: Cortical, Basal Ganglia, and Cerebellar Neuronal Degeneration
  description: >
    Neuropathology shows degeneration of neurons in the cerebral cortex and
    basal ganglia, with Purkinje cell loss in the cerebellum, alongside white
    matter demyelination.

discussions:
- discussion_id: gap_sls_accumulation_to_symptoms_mechanism
  prompt: >-
    By which mechanism does fatty aldehyde/alcohol accumulation actually produce
    the cutaneous and neurologic injury of SLS — bulk membrane lipid
    accumulation, formation of reactive aldehyde Schiff-base adducts with
    amine-containing lipids/proteins, defective eicosanoid (leukotriene)
    metabolism, or a combination?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Accumulation of Fatty Aldehydes and Fatty Alcohols
  - pathophysiology#CNS Myelin and Membrane Lipid Disruption
  rationale: >-
    The edges from metabolite accumulation to the skin and CNS phenotypes are
    modeled as INDIRECT_UNKNOWN_INTERMEDIATES because the proximate injurious
    mechanism is not established. Authoritative review explicitly frames the
    pathogenesis as one (or a combination) of three competing hypotheses.
    Resolving which dominates in skin versus brain would sharpen the mechanism
    model and guide whether therapy should target lipid accumulation, aldehyde
    reactivity, or eicosanoid signaling.
  evidence:
  - reference: PMID:16996289
    reference_title: "Sjogren-Larsson syndrome: molecular genetics and biochemical pathogenesis of fatty aldehyde dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pathogenesis of the cutaneous and neurologic symptoms is thought to result from abnormal lipid accumulation in the membranes of skin and brain; the formation of aldehyde Schiff base adducts with amine-containing lipids or proteins; or defective eicosanoid metabolism."
    explanation: Directly states the three competing pathogenic hypotheses, defining the knowledge gap.
- discussion_id: openq_sls_ltb4_therapy_neurologic_benefit
  prompt: >-
    Does lowering leukotriene B4 (e.g., with the 5-lipoxygenase inhibitor
    zileuton) modify the neurologic and cognitive disease of SLS, or does it
    relieve only the LTB4-driven pruritus?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Leukotriene B4 Accumulation
  - phenotype#Pruritus
  rationale: >-
    In the open-label zileuton trial, pruritus and general well-being improved
    but neuropsychological testing did not change over the treatment period,
    leaving open whether LTB4-directed therapy has any disease-modifying effect
    on the central nervous system component, or whether the neurologic disease is
    driven by a distinct (lipid-accumulation/adduct) mechanism unaffected by
    5-lipoxygenase inhibition.
  evidence:
  - reference: PMID:11795678
    reference_title: "Clinical and biochemical effects of zileuton in patients with the Sjogren-Larsson syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuropsychological test results did not change significantly. There was, however, a clinically important trend towards improvement in the speed of information processing."
    explanation: Zileuton improved pruritus but neuropsychological results showed no significant change (only a non-significant trend), motivating the question of whether LTB4-directed therapy is disease-modifying for the CNS.
- discussion_id: model_mismatch_sls_aldh3a2_ko_mouse
  prompt: >-
    Does the Aldh3a2-knockout mouse faithfully model the human SLS
    leukoencephalopathy — and is its proposed mechanism (a decrease in the
    myelin lipid 2-hydroxygalactosylceramide) the operative mechanism in humans,
    where the ether-lipid/plasmalogen model instead dominates?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Ether-Lipid (Plasmalogen) Metabolism Disruption
  - pathophysiology#CNS Myelin and Membrane Lipid Disruption
  rationale: >-
    The Aldh3a2-KO mouse reproduces several SLS-like neurobehavioral
    abnormalities and implicates decreased 2-hydroxygalactosylceramide and
    impaired long-chain-base (sphingolipid) metabolism in neurons. This is
    model-system evidence whose translational validity is uncertain: the human
    CNS mechanism remains unestablished and the leading human hypothesis is
    ether-lipid/plasmalogen disruption of myelin, not the sphingolipid route the
    mouse foregrounds. Whether the murine mechanism operates in human SLS is the
    open question.
  evidence:
  - reference: PMID:30085884
    reference_title: "Neural symptoms in a gene knockout mouse model of Sjögren-Larsson syndrome are associated with a decrease in 2-hydroxygalactosylceramide."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Aldh3a2 KO mice showed several abnormalities corresponding to SLS symptoms in behavioral tests, including increased paw slips on a balance beam and light-induced anxiety."
    explanation: >-
      The KO mouse recapitulates several SLS-like behavioral abnormalities,
      providing the model-system evidence whose fidelity to the human CNS
      mechanism is the subject of this mismatch.

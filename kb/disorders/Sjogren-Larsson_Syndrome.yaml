name: Sjogren-Larsson Syndrome
creation_date: "2026-07-29T18:10:00Z"
category: Mendelian
disease_term:
  preferred_term: Sjogren-Larsson syndrome
  term:
    id: MONDO:0010031
    label: Sjogren-Larsson syndrome
description: >
  Sjogren-Larsson syndrome (SLS) is a rare autosomal recessive neurocutaneous
  inborn error of lipid metabolism caused by deficiency of fatty aldehyde
  dehydrogenase (FALDH), encoded by ALDH3A2 on chromosome 17p11.2. FALDH oxidizes
  long-chain aliphatic aldehydes derived from fatty alcohols, ether
  glycerolipids, sphingolipids, and leukotriene B4; its loss causes accumulation
  of fatty aldehydes and fatty alcohols that disrupt membrane and skin-barrier
  lipids and myelin. SLS is defined by the classic triad of congenital
  ichthyosis, spastic diplegia (or tetraplegia), and intellectual disability,
  with a pathognomonic ophthalmologic finding of glistening white dots
  (crystalline maculopathy) in the retina, periventricular leukoencephalopathy,
  severe pruritus, and frequent preterm birth.
parents:
- Mendelian disease
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:32021380
      reference_title: "Sjogren-Larsson Syndrome: Mechanisms and Management."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Sjogren Larsson syndrome (SLS) is a rare autosomal recessive inborn error of lipid metabolism due to mutations in the ALDH3A2 that result in a deficiency of fatty aldehyde dehydrogenase (FALDH)."
      explanation: Characterizes SLS as an autosomal recessive inborn error of metabolism, supporting the Mendelian/metabolic Part.
  - classification_value: NEUROLOGIC
pathophysiology:
- name: ALDH3A2 Loss of Function
  biological_scale: MOLECULAR
  description: >
    Biallelic loss-of-function variants in ALDH3A2 (on 17p11.2) abolish the
    activity of fatty aldehyde dehydrogenase (FALDH), a microsomal NAD-dependent
    enzyme. More than 70 pathogenic ALDH3A2 variants have been reported,
    including missense substitutions, deletions, insertions, and splicing errors.
  molecular_functions:
  - preferred_term: long-chain fatty aldehyde dehydrogenase (NAD+) activity
    term:
      id: GO:0050061
      label: long-chain fatty aldehyde dehydrogenase (NAD+) activity
    modifier: DECREASED
  downstream:
  - target: Impaired Fatty Aldehyde Oxidation
    description: Loss of FALDH removes the enzyme that oxidizes fatty aldehydes.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:8528251
    reference_title: "Sjogren-Larsson syndrome is caused by mutations in the fatty aldehyde dehydrogenase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLS patients have a profound deficiency in fatty aldehyde dehydrogenase (FALDH) activity."
    explanation: Establishes that SLS is caused by profound FALDH deficiency from ALDH3A2 mutations.
- name: Impaired Fatty Aldehyde Oxidation
  biological_scale: MOLECULAR
  description: >
    FALDH normally catalyzes the oxidation of long-chain fatty aldehyde to fatty
    acid, the aldehyde-oxidizing step of the fatty alcohol cycle. Its loss blocks
    oxidation of fatty aldehydes arising from fatty alcohols, ether
    glycerolipids, sphingolipids, and leukotriene B4.
  biological_processes:
  - preferred_term: fatty acid metabolic process
    term:
      id: GO:0006631
      label: fatty acid metabolic process
    modifier: DECREASED
  downstream:
  - target: Accumulation of Fatty Aldehydes and Fatty Alcohols
    description: Blocked oxidation causes substrate accumulation.
    causal_link_type: DIRECT
  - target: Leukotriene B4 Accumulation
    description: >
      FALDH also inactivates leukotriene B4 by oxidizing its omega-aldehyde
      intermediate; loss of this step allows LTB4 to accumulate.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16996289
    reference_title: "Sjogren-Larsson syndrome: molecular genetics and biochemical pathogenesis of fatty aldehyde dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FALDH oxidizes fatty aldehyde substrates arising from metabolism of fatty alcohols, leukotriene B4, ether glycerolipids and other potential sources such as sphingolipids"
    explanation: Identifies the FALDH substrates whose oxidation fails, including fatty alcohols, LTB4, ether glycerolipids, and sphingolipids.
- name: Accumulation of Fatty Aldehydes and Fatty Alcohols
  biological_scale: MOLECULAR
  description: >
    Undegraded long-chain fatty aldehydes and fatty alcohols accumulate. Reactive
    fatty aldehydes can form Schiff-base adducts with amine-containing lipids and
    proteins, and altered lipids are incorporated into cellular membranes,
    disrupting membrane integrity in skin, brain, and eye.
  biological_processes:
  - preferred_term: aldehyde metabolic process
    term:
      id: GO:0006081
      label: aldehyde metabolic process
    modifier: ABNORMAL
  downstream:
  - target: Defective Lamellar Body Formation and Secretion
    description: Abnormal membrane lipids yield defective epidermal lamellar bodies.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Ether-Lipid (Plasmalogen) Metabolism Disruption
    description: >
      Fatty alcohol is the precursor for ether-glycerolipid synthesis;
      accumulation and altered flux disturb plasmalogen homeostasis.
    causal_link_type: DIRECT
  - target: Fatty Aldehyde Schiff-Base Adduct Formation
    description: Reactive fatty aldehydes form covalent Schiff-base adducts.
    causal_link_type: DIRECT
  - target: Retinal Crystalline Lipid Deposition
    description: Abnormal lipids deposit in the perifoveal retina.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:32021380
    reference_title: "Sjogren-Larsson Syndrome: Mechanisms and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Deficiency of fatty acid aldehyde dehydrogenase (FALDH) causes an accumulation of fatty alcohols and fatty aldehydes, leading to altered cell-membrane integrity primarily affecting skin, eyes, and the central nervous system."
    explanation: States that fatty alcohol/aldehyde accumulation alters cell-membrane integrity in skin, eyes, and CNS.
- name: Defective Lamellar Body Formation and Secretion
  conforms_to: "epidermal_cornification_failure#Defective Cornified Envelope Assembly and Lamellar Lipid Delivery"
  biological_scale: CELLULAR
  description: >
    In the absence of FALDH, keratinocytes of the stratum granulosum produce
    defective lamellar bodies that are empty or lack their cargo membranes and
    show impaired exocytosis, so the lipid precursors of the stratum corneum
    barrier are not properly delivered.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  downstream:
  - target: Epidermal Water-Barrier Disruption
    description: Defective lamellar-body delivery yields an abnormal stratum corneum barrier.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21695018
    reference_title: "The role of fatty aldehyde dehydrogenase in epidermal structure and function."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the absence of FALDH, the skin produces lamellar bodies that are empty, lack their surrounding vesicle membranes or contain granular contents rather then the usual cargo membranes."
    explanation: Documents the defective lamellar bodies underlying the epidermal barrier defect in SLS.
- name: Epidermal Water-Barrier Disruption
  conforms_to: "epidermal_cornification_failure#Stratum Corneum Permeability Barrier Failure"
  biological_scale: TISSUE
  description: >
    The abnormal lipid composition of the stratum corneum multilamellar
    membranes produces a disrupted epidermal water-permeability barrier, the
    substrate for the clinical ichthyosis.
  biological_processes:
  - preferred_term: establishment of skin barrier
    term:
      id: GO:0061436
      label: establishment of skin barrier
    modifier: DECREASED
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  downstream:
  - target: Ichthyosis
    description: A disrupted water barrier produces the clinical ichthyosis.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21695018
    reference_title: "The role of fatty aldehyde dehydrogenase in epidermal structure and function."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "An abnormal lipid composition of the SC membranes often results in a disrupted water barrier and the clinical appearance of ichthyosis."
    explanation: Links the abnormal stratum corneum lipid composition to a disrupted water barrier and ichthyosis.
- name: Ether-Lipid (Plasmalogen) Metabolism Disruption
  biological_scale: MOLECULAR
  description: >
    FALDH participates in ether-glycerolipid (plasmalogen) metabolism, for which
    fatty alcohol is a precursor. Plasmalogens are highly abundant in myelin, so
    disturbed ether-lipid/plasmalogen homeostasis is the leading proposed route
    from the metabolic block to the central leukoencephalopathy.
  downstream:
  - target: CNS Myelin and Membrane Lipid Disruption
    description: Disturbed plasmalogen homeostasis impairs myelin membrane lipids.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:32021380
    reference_title: "Sjogren-Larsson Syndrome: Mechanisms and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Plasmalogens are particularly abundant lipids in myelin membrane, comprising 40–50% of the total Phoshatidylethanolamine"
    explanation: Establishes plasmalogens as a dominant myelin membrane lipid, the basis for the ether-lipid route to leukoencephalopathy.
- name: Fatty Aldehyde Schiff-Base Adduct Formation
  biological_scale: MOLECULAR
  description: >
    Reactive accumulated fatty aldehydes form covalent Schiff-base adducts with
    amine-containing phospholipids and proteins, proposed as an essential
    pathogenic mechanism and the rationale for aldehyde-scavenger therapy
    (reproxalap).
  evidence:
  - reference: PMID:32021380
    reference_title: "Sjogren-Larsson Syndrome: Mechanisms and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Since fatty aldehyde adduct formation is an essential pathogenic mechanism in SLS, it is possible theoretically that aldehyde scavengers could be used to scavenge or compete as therapeutic targets for endogenously produced aldehydes."
    explanation: States fatty-aldehyde adduct formation as an essential pathogenic mechanism and the rationale for aldehyde scavengers.
- name: CNS Myelin and Membrane Lipid Disruption
  biological_scale: TISSUE
  description: >
    Abnormal accumulation of fatty alcohols and aldehydes disrupts myelin and
    neural membrane lipids, producing a periventricular-predominant
    leukoencephalopathy with a characteristic abnormal lipid peak at 1.3 ppm on
    cerebral MR spectroscopy.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  locations:
  - preferred_term: white matter
    term:
      id: UBERON:0002316
      label: white matter
  downstream:
  - target: Leukoencephalopathy
    description: Myelin lipid disruption produces periventricular leukoencephalopathy.
    causal_link_type: DIRECT
  - target: Spastic Diplegia
    description: White-matter (corticospinal) involvement produces spasticity.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual Disability
    description: Cerebral involvement impairs cognitive development.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizures
    description: Cortical/white-matter involvement predisposes to seizures.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Dysarthria
    description: Pseudobulbar involvement produces dysarthric speech.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Contractures
    description: Chronic spasticity leads to fixed joint contractures.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - spasticity-driven joint immobility
  evidence:
  - reference: PMID:10227616
    reference_title: "Sjogren-Larsson syndrome: clinical and MRI/MRS findings in FALDH-deficient patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI and 1H MRS findings suggest an accumulation of long-chain fatty alcohol intermediates, resulting in retarded myelination and dysmyelination"
    explanation: >-
      MRI/MR-spectroscopy directly links accumulated long-chain fatty alcohol
      intermediates to retarded myelination and dysmyelination, supporting this
      node's myelin-lipid-disruption mechanism.
- name: Leukotriene B4 Accumulation
  biological_scale: MOLECULAR
  description: >
    FALDH normally oxidizes the omega-aldehyde intermediate in leukotriene B4
    degradation; its loss makes LTB4 degradation defective, so this potent
    pruritogenic eicosanoid accumulates. This node is the target of the
    5-lipoxygenase inhibitor zileuton.
  downstream:
  - target: Pruritus
    description: Accumulated LTB4, a potent pruritogen, drives severe itch.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - leukotriene B4-mediated pruritogenic signaling
  - target: Premature Birth
    description: >
      Elevated leukotriene B4 (reported in amniotic fluid) is hypothesized to
      contribute to the high rate of preterm birth; the causal link is not
      established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:11795678
    reference_title: "Clinical and biochemical effects of zileuton in patients with the Sjogren-Larsson syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The degradation of leukotriene (LT) B4 is one of the defective metabolic routes in SLS."
    explanation: Establishes defective LTB4 degradation as a metabolic consequence of FALDH deficiency in SLS.
- name: Retinal Crystalline Lipid Deposition
  biological_scale: TISSUE
  description: >
    Abnormal lipid accumulation in the perifoveal retina produces glistening
    white dots (a crystalline maculopathy / juvenile macular dystrophy), a
    pathognomonic ophthalmologic feature of SLS.
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  downstream:
  - target: Macular Crystals
    description: Perifoveal lipid deposits appear as glistening white dots.
    causal_link_type: DIRECT
  - target: Photophobia
    description: Macular involvement is associated with photophobia.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31512987
    reference_title: "Sjogren-Larsson syndrome: a complex metabolic disease with a distinctive ocular phenotype."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "characterized by a distinctive crystalline maculopathy, congenital ichthyosis, spasticity and intellectual disability"
    explanation: Identifies the distinctive crystalline maculopathy as a defining ocular feature of SLS.

genetic:
- name: SLC34A2
  gene_term:
    preferred_term: SLC34A2
    term:
      id: hgnc:11020
      label: SLC34A2
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    Encodes NaPi-IIb, the type IIb sodium-dependent phosphate cotransporter.
    Biallelic loss-of-function variants cause the disease, and were identified
    independently by two groups in 2006. Loss of transport does not require loss
    of protein: some variants reach the membrane but cannot move phosphate, which
    the 2026 cryo-EM structures rationalise by showing that transport depends on
    sodium-driven conformational transitions rather than on the transporter merely
    being present. Sibling transporters SLC34A1 and SLC34A3 cause renal
    phosphate-wasting disease, so the same protein family produces very different
    disease depending on which epithelium expresses it.
  evidence:
  - reference: PMID:17095743
    reference_title: Mutations in the SLC34A2 gene are associated with pulmonary alveolar microlithiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From this region, we have identified a gene that has mutations in all patients with pulmonary alveolar microlithiasis."
    explanation: >-
      The second independent 2006 identification of the gene, quoted at its actual
      finding rather than at its title: a positional search that recovered
      mutations in every patient studied.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic variants required. Consanguinity and familial clustering are common,
    with affected siblings frequently reported.
biochemical:
- name: Serum MCP-1 and surfactant protein D
  notes: >-
    Candidate serum biomarkers identified in the mouse model and, importantly,
    confirmed in serum from patients rather than left as a murine finding. Both
    track the consequences of stone burden: MCP-1 rises and falls with the
    macrophage response to microliths, and SP-D falls when phosphate restriction
    reduces lung injury in the model. Neither is validated as a clinical monitoring
    tool, and no threshold is curated here.
  presence: INCREASED
  evidence:
  - reference: PMID:26560359
    reference_title: "Modeling pulmonary alveolar microlithiasis by epithelial deletion of the Npt2b sodium phosphate cotransporter reveals putative biomarkers and strategies for treatment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cytokine and surfactant protein elevations in the alveolar lavage and serum of PAM mice and confirmed in serum from PAM patients identify serum MCP-1 (monocyte chemotactic protein 1) and SP-D (surfactant protein D) as potential biomarkers."
    explanation: >-
      Identifies both candidate biomarkers and states that the elevations were
      confirmed in patient serum. Tagged MODEL_ORGANISM because the publication is
      the mouse study; the human confirmation is reported within it rather than as
      a separate clinical series.
diagnosis:
- name: Diagnosis by characteristic radiographic appearance with genetic confirmation
  description: >-
    Unusually among rare lung diseases, the diagnosis can rest on imaging. The
    calcific micronodular sandstorm appearance is close to pathognomonic, and
    biallelic SLC34A2 variants confirm it, so lung biopsy is not required. This
    matters practically, since the alternative in a diffuse infiltrative lung
    disease is usually a surgical biopsy.
  evidence:
  - reference: PMID:32964001
    reference_title: "Pulmonary alveolar microlithiasis: no longer in the stone age."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of PAM can confidently be based on typical radiographic findings and genetic testing proving rare biallelic SCL34A2 gene variants."
    explanation: >-
      States both diagnostic pillars and the confidence attached to them. Note the
      source contains a typographical transposition of the gene symbol, quoted
      verbatim as required.
- name: Incidental radiographic detection
  description: >-
    Most patients are found by accident, on imaging obtained for an unrelated
    reason, at a point when they have no symptoms at all. The mismatch between a
    dramatic radiograph and a well patient is itself a diagnostic clue rather than
    a reason to doubt the film.
  evidence:
  - reference: PMID:32964001
    reference_title: "Pulmonary alveolar microlithiasis: no longer in the stone age."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many patients are asymptomatic and the diagnosis is made at random."
    explanation: >-
      States the incidental route to diagnosis, which is the usual one in this
      disease.
treatments:
- name: Lung Transplantation
  description: >-
    The only effective treatment, and the only one that alters outcome. Both
    single and bilateral procedures are performed for end-stage disease.
    Microliths have not been documented to recur in transplanted lungs, which is
    not merely a good outcome but a mechanistic result: it indicates the defect is
    intrinsic to the lung epithelium rather than a systemic disorder of mineral
    handling that would recalcify any lung installed.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Loss of Phosphate Reuptake from Alveolar Lining Fluid
    treatment_effect: RESTORES
    description: >-
      Replaces the epithelium that carries the transporter defect, restoring
      normal alveolar phosphate handling in the graft. This is why the treatment
      is curative for the lung rather than palliative, and why non-recurrence in
      grafts is the expected result rather than a lucky one.
    evidence:
    - reference: PMID:8215680
      reference_title: Sequential bilateral lung transplantation for pulmonary alveolar microlithiasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Eighteen months postoperatively, he continues to do well with normalized pulmonary and cardiac function"
      explanation: >-
        Documents normalisation of both pulmonary and cardiac function after
        transplantation in a patient with severe pre-operative pulmonary
        hypertension.
  evidence:
  - reference: PMID:37259144
    reference_title: New insights in the genetic variant spectrum of SLC34A2 in pulmonary alveolar microlithiasis; a systematic review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is currently no cure for PAM, and the only effective treatment is lung transplantation"
    explanation: >-
      States plainly that transplantation is the only effective treatment, which
      is the claim this record carries.
- name: Supportive Care
  description: >-
    What most patients actually receive: vaccination against respiratory
    pathogens, antibiotics for intercurrent infection, and long-term oxygen once
    respiratory failure develops. None of it modifies the underlying process.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34970102
    reference_title: "Pulmonary Alveolar Microlithiasis - A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with PAM should be offered preventative and symptomatic treatments such as vaccinations and oxygen therapy when needed."
    explanation: >-
      Names the components of supportive management recommended for this disease.
  - reference: PMID:39735153
    reference_title: "Lung Function Decline in Pulmonary Alveolar Microlithiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PAM management is basically supportive using vaccines, antibiotics in recurrent infections, or long-term oxygen when respiratory failure is determined."
    explanation: >-
      Independent statement of the same supportive components, including
      antibiotics for recurrent infection.
- name: Etidronate
  description: >-
    Bisphosphonate therapy tried on the reasoning that a drug inhibiting mineral
    deposition in bone might inhibit it in lung. The result is the most interesting
    negative in the disease: radiographic improvement has been reported in some
    children over sustained treatment, but the response varies even between family
    members carrying identical variants, and benefit in adults is limited.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: etidronic acid
      term:
        id: CHEBI:4907
        label: etidronic acid
  evidence:
  - reference: PMID:33246992
    reference_title: Pulmonary alveolar microlithiasis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "there are no proven treatments for PAM"
    explanation: >-
      Refutes a claim of proven pharmacological benefit for any agent in this
      disease. Recorded as REFUTE rather than omitted so that a reader learns the
      obvious candidates have been tried, not that nobody thought of them.
  notes: >-
    The variable etidronate response within families sharing a variant is
    curated as a knowledge gap rather than as evidence of efficacy, because
    identical genotypes responding differently is a statement about unidentified
    modifiers rather than about the drug.
- name: Whole-Lung Saline Lavage
  description: >-
    Therapeutic lavage, borrowed from the management of pulmonary alveolar
    proteinosis where it is genuinely effective. It does not work here, and the
    reason is instructive rather than incidental: proteinosis fills the alveoli
    with material that can be washed out, whereas the stones of this disease are
    frequently larger than the airway lumen and simply will not come. Recovering
    some microliths in the effluent is not the same as clearing the burden.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:33246992
    reference_title: "Pulmonary alveolar microlithiasis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "there are no proven treatments for PAM"
    explanation: >-
      Refutes proven benefit for this procedure along with every other
      non-transplant option. Curated as its own record rather than bundled, because
      the reason saline lavage fails here is specific to the physical form of the
      deposits and is worth stating.
- name: Whole-Lung EDTA Chelation Lavage (Preclinical)
  description: >-
    The mechanistically motivated successor to saline lavage: rather than trying to
    rinse the stones out, dissolve them. Microliths recovered by lavage dissolve
    readily in EDTA, and therapeutic EDTA lavage reduces stone burden in the mouse.
    This is the difference between rinsing gravel and dissolving it, and it has not
    been tried in humans.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Microlith Formation
    treatment_effect: INHIBITS
    description: >-
      Acts on the accumulated stones themselves by chelating the calcium that holds
      them together, reducing burden rather than preventing formation.
    evidence:
    - reference: PMID:26560359
      reference_title: "Modeling pulmonary alveolar microlithiasis by epithelial deletion of the Npt2b sodium phosphate cotransporter reveals putative biomarkers and strategies for treatment."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Microliths isolated by bronchoalveolar lavage readily dissolve in EDTA, and therapeutic whole-lung EDTA lavage reduces the burden of stones in the lungs."
      explanation: >-
        Demonstrates both that the stones are chemically dissolvable and that lavage
        with a chelator reduces burden in vivo.
  evidence:
  - reference: PMID:26560359
    reference_title: "Modeling pulmonary alveolar microlithiasis by epithelial deletion of the Npt2b sodium phosphate cotransporter reveals putative biomarkers and strategies for treatment."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Microliths isolated by bronchoalveolar lavage readily dissolve in EDTA, and therapeutic whole-lung EDTA lavage reduces the burden of stones in the lungs."
    explanation: >-
      PARTIAL because the result is entirely murine. No human has been treated this
      way, and whole-lung lavage with a chelating agent would require its own safety
      case before that could change.
- name: Dietary Phosphate Restriction (Preclinical)
  description: >-
    Restricting dietary phosphate attacks the supply side of the mechanism. In the
    mouse it both prevents microlith formation in young animals and diminishes
    established deposits within four weeks, which is the only evidence anywhere that
    the burden of existing stones can be reduced by anything other than removing the
    lung. Human dietary restriction has been attempted and lowered serum phosphate
    without arresting the disease, so the murine result should not be read as
    translated.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Phosphate Accumulation and Calcium Phosphate Supersaturation
    treatment_effect: INHIBITS
    description: >-
      Reduces the phosphate available to supersaturate the alveolar lining fluid,
      acting upstream of nucleation rather than on stones already formed.
    evidence:
    - reference: PMID:26560359
      reference_title: "Modeling pulmonary alveolar microlithiasis by epithelial deletion of the Npt2b sodium phosphate cotransporter reveals putative biomarkers and strategies for treatment."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A low-phosphate diet prevents microlith formation in young animals and reduces lung injury on the basis of reduction in serum SP-D."
      explanation: >-
        Demonstrates prevention in young animals with a biomarker correlate of
        reduced lung injury.
  evidence:
  - reference: PMID:26560359
    reference_title: "Modeling pulmonary alveolar microlithiasis by epithelial deletion of the Npt2b sodium phosphate cotransporter reveals putative biomarkers and strategies for treatment."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "A low-phosphate diet prevents microlith formation in young animals and reduces lung injury on the basis of reduction in serum SP-D."
    explanation: >-
      PARTIAL because the demonstration is murine and prevention in young animals is
      a different claim from benefit in an adult patient who already has a lung full
      of stones. Reported human dietary restriction lowered serum phosphate without
      halting progression.
- name: Genetic Counselling
  description: >-
    Autosomal recessive recurrence risk and cascade testing of siblings, who are
    frequently affected and often asymptomatic at the point the proband is
    diagnosed.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
animal_models:
- name: Epithelial Npt2b-deletion mouse (Slc34a2 conditional knockout)
  species: Mouse
  genotype: Lung-epithelial conditional deletion of Slc34a2 (Npt2b)
  publication: PMID:26560359
  description: >-
    Conditional deletion of the transporter in lung epithelium reproduces the
    human disease closely, and is the system in which the causal role of the
    stones and the two most promising therapeutic leads were established. Its
    most valuable feature is that it supports intervention experiments the human
    disease cannot.
  modeled_mechanisms:
  - target: Microlith-Driven Macrophage Inflammation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The model demonstrates the causal direction between stones and inflammation
      by adoptive transfer into wild-type lungs, with resolution as the stones
      clear. That design distinguishes consequence from coincidence in a way no
      human observation can.
    limitations: >-
      The transfer experiment introduces a bolus of pre-formed stones rather than
      the slow accumulation of decades, so the kinetics of inflammation and
      resolution need not match the chronic human course.
    readouts:
    - name: Serum MCP-1 following microlith transfer
      target: Microlith-Driven Macrophage Inflammation
      direction: INCREASED
      interpretation: >-
        Rise and subsequent fall of serum MCP-1 tracks the inflammatory response
        to stone burden and its resolution with clearance.
      evidence:
      - reference: PMID:26560359
        reference_title: Modeling pulmonary alveolar microlithiasis by epithelial deletion of the Npt2b sodium phosphate cotransporter reveals putative biomarkers and strategies for treatment.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Microliths introduced by adoptive transfer into the lungs of wild-type mice produce marked macrophage-rich inflammation and elevation of serum MCP-1 that peaks at 1 week and resolves at 1 month, concomitant with clearance of stones."
        explanation: >-
          The measurement behind this readout, including both its rise and its
          resolution.
    evidence:
    - reference: PMID:26560359
      reference_title: Modeling pulmonary alveolar microlithiasis by epithelial deletion of the Npt2b sodium phosphate cotransporter reveals putative biomarkers and strategies for treatment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "epithelial deletion of Npt2b in mice results in a progressive pulmonary process characterized by diffuse alveolar microlith accumulation"
      explanation: >-
        Establishes that epithelial deletion reproduces progressive microlith
        accumulation, which is what makes the model informative for this node.
  evidence:
  - reference: PMID:26560359
    reference_title: Modeling pulmonary alveolar microlithiasis by epithelial deletion of the Npt2b sodium phosphate cotransporter reveals putative biomarkers and strategies for treatment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Microliths isolated by bronchoalveolar lavage readily dissolve in EDTA, and therapeutic whole-lung EDTA lavage reduces the burden of stones in the lungs."
    explanation: >-
      Establishes chelation lavage as a preclinical lead, and by contrast explains
      why saline lavage in humans failed: the problem is dissolving the stones,
      not rinsing them.
discussions:
- discussion_id: pam_etidronate_discordant_response
  prompt: >-
    Why do family members carrying identical SLC34A2 variants respond differently
    to etidronate, and what determines whether the disease progresses at all?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Microlith Formation
  - pathophysiology#Interstitial Fibrosis and Restrictive Physiology
  rationale: >-
    Two independent observations point at the same missing factor. Etidronate has
    been reported to produce radiographic improvement in some patients while
    relatives with the same variant do not respond, and the natural history
    bifurcates, remaining static in some patients while progressing to fibrosis
    and respiratory failure in others. Identical genotypes with divergent
    outcomes is a statement about modifiers rather than about the primary defect,
    and nothing is currently known about what they are. Until that is understood,
    prognosis cannot be given from genotype and drug response cannot be
    predicted.
  proposed_experiments:
  - experiment_id: pam_discordant_relative_profiling
    name: Modifier search in genotype-identical, phenotype-discordant relatives
    description: >-
      Identify families containing multiple SLC34A2-homozygous individuals
      discordant for rate of progression or for etidronate response, and perform
      whole-genome sequencing together with measurement of local mineral handling
      in bronchoalveolar lavage fluid. Genotype-identical relatives are the only
      design that holds the primary defect constant while the outcome varies.
- discussion_id: pam_untried_gene_directed_therapy
  prompt: >-
    Why has no gene-directed or transporter-replacement therapy been attempted for
    a disease that appears to be an unusually favourable target?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Phosphate Reuptake from Alveolar Lining Fluid
  rationale: >-
    The theoretical case is strong on every axis that usually matters. The disease
    is monogenic and recessive, so restoring function rather than silencing a
    dominant product is sufficient; the target cell is a single, defined
    population; the organ is directly accessible to inhaled delivery; the mouse
    indicates the phenotype is at least partly reversible when stone burden falls;
    and the disease progresses slowly enough to leave a wide therapeutic window.
    Despite this, no gene therapy, gene editing, or RNA therapeutic programme
    exists, and no interventional clinical trial has ever been registered with
    this disease as its condition. The gap is one of attention rather than of
    biology, and is recorded here because that is itself worth knowing.
  proposed_experiments:
  - experiment_id: pam_aav_epithelial_rescue
    name: Inhaled AAV-mediated SLC34A2 restoration in the Npt2b-deletion mouse
    description: >-
      Deliver SLC34A2 to alveolar type II cells by inhaled or intratracheal
      vector in the conditional-deletion mouse, in animals with established stone
      burden rather than at prevention stage, and measure microlith burden,
      inflammatory markers, and lung mechanics. Treating established disease is
      the condition that matters, since human patients are diagnosed after stones
      have already formed.
differential_diagnoses:
- name: Pulmonary alveolar proteinosis
  description: >-
    The most important differential and the source of chronic confusion, since it
    shares the acronym PAP against PAM, the word alveolar, and a crazy-paving
    appearance on CT. The mechanism is entirely different: impaired
    GM-CSF-dependent surfactant clearance by alveolar macrophages, producing
    lipoproteinaceous filling rather than calcified stones. Both autoimmune and
    hereditary forms are separately curated in this knowledge base. Distinguished
    definitively by the calcific density of the deposits on CT and by lavage
    findings.
- name: Testicular microlithiasis
  description: >-
    A separate entity that touches this gene sideways and is included to record
    how weak that link actually is. The original SLC34A2 paper reported, in
    subjects with testicular microlithiasis, two rare variants in a small number
    of subjects, one synonymous and one noncoding. That is a hypothesis rather
    than an established association, and the paper's own title, which describes
    the variants as possibly associated, should not be allowed to do work the
    results do not support.
- name: Metastatic pulmonary calcification
  description: >-
    Calcium deposition in lung secondary to systemic disturbance of calcium and
    phosphate handling, most often in chronic kidney disease or
    hyperparathyroidism. Distinguished by the systemic biochemical abnormality,
    which is absent in this disease: serum calcium and phosphate are characteristically
    normal here, because the defect is local to the alveolar surface rather than
    systemic.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A literature review assembled 576 published cases, which is the most useful
    available measure of how much has been described rather than a population
    rate. Per-million incidence figures circulating for this disease live in
    review full text rather than in any abstract and are not curated as evidence
    here. Reported clustering is real, with Turkey, Italy, Japan, and India
    contributing disproportionately, most plausibly reflecting founder variants
    and consanguinity rather than environmental exposure.
  evidence:
  - reference: PMID:15554073
    reference_title: "Pulmonary alveolar microlithiasis: report on 576 cases published in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms were absent in more than half the patients; dyspnoea, cough and chest pain were reported in the other cases."
    explanation: >-
      The 576-case literature review, cited for the scale of the assembled
      literature and the symptom distribution within it rather than for a rate.

name: Pulmonary Alveolar Microlithiasis
creation_date: "2026-08-16T00:00:00Z"
description: >-
  Pulmonary alveolar microlithiasis is an autosomal recessive lung disease in
  which the air spaces slowly fill with stones. It is caused by biallelic
  loss-of-function variants in SLC34A2, encoding NaPi-IIb, the sodium-dependent
  phosphate transporter that sits on the air-facing membrane of the alveolar type
  II cell.

  The mechanism is unusually clean for a lung disease. Surfactant, the
  phospholipid film that keeps alveoli from collapsing, is continually made,
  used, and broken down, and its breakdown liberates free phosphate into the thin
  fluid layer coating the alveolus. NaPi-IIb is the bailer that pumps that
  phosphate back into the cell. Remove the bailer and phosphate accumulates until
  the lining fluid supersaturates, calcium precipitates with it, and concentrically
  laminated calcium phosphate concretions form in the air spaces themselves.

  The stones are not inert gravel. Transferring microliths into the lungs of
  normal mice produces macrophage-rich inflammation that resolves as the stones
  are cleared, which makes the inflammation a consequence of the stones rather
  than a parallel process, and makes stone burden a plausible therapeutic target
  rather than merely a marker. Over decades the disease progresses from an
  incidental radiographic finding in an asymptomatic person to fibrosis,
  restriction, and death from respiratory failure and cor pulmonale, and the only
  effective treatment is lung transplantation.

  One clinical observation carries real mechanistic weight: microliths do not
  recur in transplanted lungs. That says the defect is intrinsic to the lung
  epithelium rather than a systemic disorder of mineral handling raining calcium
  onto whatever lung is installed, which is consistent with a transporter
  expressed at the alveolar surface and is the reason transplantation is curative
  rather than merely palliative.
category: Mendelian
disease_term:
  preferred_term: Pulmonary Alveolar Microlithiasis
  term:
    id: MONDO:0009928
    label: pulmonary alveolar microlithiasis
synonyms:
- PAM
- Microlithiasis alveolar pulmonary
- SLC34A2-related pulmonary alveolar microlithiasis
notes: >-
  Naming hazard, and it is the main one for this entry. PAM is chronically
  confused with pulmonary alveolar PROTEINOSIS, which shares the acronym, the
  word alveolar, and the crazy-paving appearance on CT, and has an entirely
  different mechanism (GM-CSF signalling and surfactant clearance by macrophages,
  not phosphate transport). Both forms of proteinosis are separately curated in
  this knowledge base and appear here as differentials. A second, subtler
  collision is testicular microlithiasis, a real entity that touches the same
  gene sideways and is discussed below with the weak evidence it actually has.

  Module conformance. The fibrotic arm conforms to `fibrotic_response`. This
  entry is also a natural flagship conformer for an ectopic-calcification or
  microlith-formation module of the Xogenesis kind, since microlith formation is
  a pathological-structure-formation process with a discrete product; no such
  module exists yet and none was stretched to fit.

  Evidence tiers. Several widely repeated figures for this disease, including the
  per-million incidence, the 53-patient Japanese cohort, and the count of
  reported transplants, live in the full text of review articles rather than in
  any abstract. They are described in prose here where useful but are not curated
  as evidence, because a snippet must be quotable from the cited record.

  Deliberately not curated. Three PMIDs cited by the source deep-research report
  (PMID:41019964, PMID:37663718, PMID:42194933) do not resolve to records and
  were flagged as probable confabulations by the report's own reference
  validation. Nothing in this entry rests on them.
pathophysiology:
- name: Biallelic SLC34A2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous loss-of-function variants in SLC34A2,
    identified independently by two groups in 2006 in unrelated families. Some
    variants abolish the protein outright. Others reduce transport without
    abolishing production: in oocyte expression studies the Thr468del protein was
    synthesised and detected in the membrane while moving no more phosphate than
    uninjected controls. The authors of that work decline to claim a clean
    membrane-resident-but-transport-dead mechanism, concluding instead that the
    mutant either does not function properly or is not sufficiently expressed in
    the membrane, or both, and that hedge is preserved here. Either way the
    practical consequence holds: detecting the transporter protein does not
    establish that it works.
  molecular_functions:
  - preferred_term: NaPi-IIb sodium-dependent phosphate transport
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005436
      label: sodium:phosphate symporter activity
  evidence:
  - reference: PMID:16960801
    reference_title: Mutations in SLC34A2 cause pulmonary alveolar microlithiasis and are possibly associated with testicular microlithiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified six homozygous exonic mutations in the seven unrelated patients with PAM we studied."
    explanation: >-
      One of the two 2006 papers establishing SLC34A2 as the causal gene, quoted
      at its primary genetic finding.
  - reference: PMID:35443721
    reference_title: "Impaired phosphate transport in SLC34A2 variants in patients with pulmonary alveolar microlithiasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although the protein from the Thr468del construct was synthesised and expressed in the oocyte membrane, phosphate transport was similar to non-injected control oocytes."
    explanation: >-
      Evidence for the second allelic route: a variant protein that is made and
      detected in the membrane while transporting no more phosphate than an
      uninjected control.
  - reference: PMID:35443721
    reference_title: "Impaired phosphate transport in SLC34A2 variants in patients with pulmonary alveolar microlithiasis."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "the Thr468del mutant does not function properly or may not be sufficiently expressed in the membrane, or a combination of both"
    explanation: >-
      PARTIAL, and included specifically to carry the authors' own hedge rather
      than the cleaner claim their data are often used for. They decline to
      separate impaired function from insufficient membrane expression, so this
      node states the disjunction they state rather than resolving it for them.
  downstream:
  - target: Loss of Phosphate Reuptake from Alveolar Lining Fluid
    causal_link_type: DIRECT
    description: >-
      Loss of the transporter, or of its transport activity, removes the only
      significant route by which phosphate leaves the alveolar space.
- name: Loss of Phosphate Reuptake from Alveolar Lining Fluid
  biological_scale: MOLECULAR
  description: >-
    NaPi-IIb normally sits on the apical, air-facing membrane of the alveolar type
    II cell and uses the sodium gradient to haul phosphate out of the lining fluid
    and back into the cell. Structural work has since shown the transporter works
    by an elevator mechanism, in which the phosphate-binding site rides through
    the membrane and sodium binding drives the transition between states, which
    explains how a variant can disable transport without removing the protein.
  cell_types:
  - preferred_term: alveolar type II cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  biological_processes:
  - preferred_term: phosphate ion transmembrane transport
    modifier: DECREASED
    term:
      id: GO:0035435
      label: phosphate ion transmembrane transport
  evidence:
  - reference: PMID:37259144
    reference_title: New insights in the genetic variant spectrum of SLC34A2 in pulmonary alveolar microlithiasis; a systematic review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Normally, phosphate will be cleared from the alveolar space by transport via NaPi-2b located in the apical membrane of the alveolar type II cell."
    explanation: >-
      States the normal physiology this node breaks, including the cell type and
      the membrane face on which the transporter sits.
  - reference: PMID:42520113
    reference_title: "Structures of the sodium-coupled phosphate importer SLC34A2 reveal a distinct architecture and gating mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Na+ shapes the Pi-binding pocket and drives the transition from the outward-open to occluded state"
    explanation: >-
      Structural basis for sodium-driven transport, which is why a variant can
      abolish transport activity while leaving the protein in place.
  downstream:
  - target: Phosphate Accumulation and Calcium Phosphate Supersaturation
    causal_link_type: DIRECT
    description: >-
      Phosphate liberated by surfactant phospholipid breakdown has nowhere to go.
- name: Phosphate Accumulation and Calcium Phosphate Supersaturation
  biological_scale: TISSUE
  description: >-
    Phosphate released by the continual catabolism of surfactant phospholipid
    accumulates in the alveolar lining fluid until the fluid supersaturates with
    respect to calcium phosphate, at which point calcium precipitates with it.
    This is the step at which a transport defect becomes a mineral one.
  biological_processes:
  - preferred_term: phosphate ion transmembrane transport
    modifier: DECREASED
    term:
      id: GO:0035435
      label: phosphate ion transmembrane transport
  evidence:
  - reference: PMID:37259144
    reference_title: New insights in the genetic variant spectrum of SLC34A2 in pulmonary alveolar microlithiasis; a systematic review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this leads to an excess of phosphate in the alveolar lumen with subsequent precipitation of extracellular calcium"
    explanation: >-
      States the accumulation and the resulting calcium precipitation, which is
      exactly the transition this node models.
  downstream:
  - target: Microlith Formation
    causal_link_type: DIRECT
    description: >-
      Precipitated calcium phosphate organises into discrete concretions.
- name: Microlith Formation
  biological_scale: TISSUE
  description: >-
    Concentrically laminated calcium phosphate concretions accumulate within the
    alveolar air spaces. They are the defining lesion, the source of the
    characteristic sandstorm radiograph, and, importantly, the driver of what
    follows rather than an end product of it.
  biological_processes:
  - preferred_term: pathological biomineral formation in the alveolar space
    modifier: INCREASED
    term:
      id: GO:0031214
      label: biomineral tissue development
  evidence:
  - reference: PMID:33246992
    reference_title: Pulmonary alveolar microlithiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pulmonary alveolar microlithiasis (PAM) is a rare hereditary disease of abnormal phosphate transport associated with accumulation of calcium phosphate crystals within the alveolar airspaces of the lung."
    explanation: >-
      Names the composition and the location of the deposits in one sentence, and
      attributes them to abnormal phosphate transport.
  downstream:
  - target: Microlith-Driven Macrophage Inflammation
    causal_link_type: DIRECT
    description: >-
      Demonstrated by adoptive transfer rather than inferred: stones placed in a
      normal lung provoke inflammation, and the inflammation resolves as they are
      cleared.
  - target: Alveolar Phospholipidosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Surfactant accumulation was an unexpected finding in the mouse model. It
      closes a loop back to the surfactant biology that supplies the phosphate in
      the first place, but the intermediates between stone burden and
      phospholipidosis are not established.
  - target: Interstitial Fibrosis and Restrictive Physiology
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reached through the inflammatory response to the stones rather than by
      direct mechanical injury.
- name: Microlith-Driven Macrophage Inflammation
  biological_scale: TISSUE
  description: >-
    Macrophage-rich inflammation provoked by the stones themselves. The evidence
    here is unusually strong for a causal claim in a rare disease, because it is a
    reversibility experiment: microliths transferred into wild-type mouse lungs
    produce inflammation that peaks at one week and resolves at one month as the
    stones are cleared. That the inflammation goes away with the stones is what
    makes stone burden a target rather than a bystander.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  evidence:
  - reference: PMID:26560359
    reference_title: Modeling pulmonary alveolar microlithiasis by epithelial deletion of the Npt2b sodium phosphate cotransporter reveals putative biomarkers and strategies for treatment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Microliths introduced by adoptive transfer into the lungs of wild-type mice produce marked macrophage-rich inflammation and elevation of serum MCP-1 that peaks at 1 week and resolves at 1 month, concomitant with clearance of stones."
    explanation: >-
      The adoptive-transfer and resolution result, which establishes the direction
      of causation between stones and inflammation rather than merely their
      co-occurrence.
  downstream:
  - target: Interstitial Fibrosis and Restrictive Physiology
    causal_link_type: DIRECT
    description: >-
      Chronic macrophage-driven inflammation drives the fibrotic remodelling that
      produces restriction.
- name: Alveolar Phospholipidosis
  biological_scale: CELLULAR
  description: >-
    Accumulation of surfactant phospholipid in the alveolar space, found
    unexpectedly in the epithelial Npt2b-deletion mouse. It is worth carrying
    because it is mechanistically odd: the same lipid whose breakdown supplies the
    phosphate that forms the stones also accumulates, which suggests the
    transporter defect perturbs surfactant handling more broadly than the simple
    phosphate-bailing account predicts.
  evidence:
  - reference: PMID:26560359
    reference_title: Modeling pulmonary alveolar microlithiasis by epithelial deletion of the Npt2b sodium phosphate cotransporter reveals putative biomarkers and strategies for treatment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "epithelial deletion of Npt2b in mice results in a progressive pulmonary process characterized by diffuse alveolar microlith accumulation"
    explanation: >-
      Establishes the mouse model and its progressive microlith phenotype. The
      phospholipidosis is reported in the same sentence in the source as an
      unexpected component of that phenotype.
- name: Interstitial Fibrosis and Restrictive Physiology
  biological_scale: TISSUE
  description: >-
    Progressive interstitial fibrosis with restrictive ventilatory defect and
    falling diffusion capacity. This is the arm that conforms to the conserved
    fibrotic response, with alveolar epithelial injury and stone-driven
    inflammation as the disease-specific upstream trigger.
  conforms_to: "fibrotic_response#Architectural Distortion and Organ Dysfunction"
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:22941890
    reference_title: "Pulmonary alveolar microlithiasis: two case reports and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While it remains static in some patients, it progresses into pulmonary fibrosis, respiratory failure and cor pulmonale in others."
    explanation: >-
      States the fibrotic progression and its endpoints, and simultaneously records
      that the course bifurcates rather than progressing uniformly.
  downstream:
  - target: Restrictive ventilatory defect
    causal_link_type: DIRECT
    description: >-
      Fibrosis stiffens the lung and reduces volumes.
  - target: Cor pulmonale
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reached through hypoxic pulmonary vasoconstriction and vascular remodelling
      secondary to the parenchymal disease, rather than through a primary
      pulmonary arteriopathy.
  - target: Respiratory failure
    causal_link_type: DIRECT
    description: >-
      The terminal common pathway and the usual cause of death.

- name: Intraalveolar nodular calcifications
  category: Imaging
  description: >-
    The defining finding: innumerable tiny calcific densities filling the alveolar
    spaces, producing the sandstorm or micronodular appearance that usually makes
    the diagnosis on a chest radiograph obtained for another reason.
  phenotype_term:
    preferred_term: Intraalveolar nodular calcifications
    term:
      id: HP:0006514
      label: Intraalveolar nodular calcifications
  evidence:
  - reference: PMID:33246992
    reference_title: Pulmonary alveolar microlithiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pulmonary alveolar microlithiasis (PAM) is a rare hereditary disease of abnormal phosphate transport associated with accumulation of calcium phosphate crystals within the alveolar airspaces of the lung."
    explanation: >-
      Establishes the intraalveolar location and calcium phosphate composition of
      the deposits that produce this radiographic finding.
- name: Asymptomatic at diagnosis
  category: Clinical
  description: >-
    A curated positive finding rather than an absence, because it is the usual
    presentation and it shapes the whole natural history. More than half of
    patients have no symptoms when the disease is found, typically on imaging
    performed for an unrelated reason, and the striking mismatch between a
    dramatic radiograph and a well patient is itself diagnostically suggestive.
  frequency: FREQUENT
  evidence:
  - reference: PMID:15554073
    reference_title: "Pulmonary alveolar microlithiasis: report on 576 cases published in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms were absent in more than half the patients; dyspnoea, cough and chest pain were reported in the other cases."
    explanation: >-
      More than half of a 576-case literature series were asymptomatic, which
      supports the FREQUENT band (30 to 79 per cent) for this finding.
- name: Exertional dyspnea
  category: Respiratory
  description: >-
    The leading symptom once the disease becomes symptomatic, alongside dry cough
    and chest pain.
  phenotype_term:
    preferred_term: Exertional dyspnea
    term:
      id: HP:0002875
      label: Exertional dyspnea
  evidence:
  - reference: PMID:32964001
    reference_title: "Pulmonary alveolar microlithiasis: no longer in the stone age."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When symptomatic, dyspnoea, cough, chest pain and fatigue are common complaints."
    explanation: >-
      Names the symptom quartet, with the explicit conditional that these apply
      once the patient is symptomatic at all.
- name: Restrictive ventilatory defect
  category: Physiology
  description: >-
    Restriction on pulmonary function testing as fibrosis advances. Notably, many
    patients have entirely normal physiology despite a florid radiograph, which is
    part of the same radiographic-clinical dissociation that characterises the
    disease.
  phenotype_term:
    preferred_term: Restrictive ventilatory defect
    term:
      id: HP:0002091
      label: Restrictive ventilatory defect
  evidence:
  - reference: PMID:22941890
    reference_title: "Pulmonary alveolar microlithiasis: two case reports and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many patients are asymptomatic and the majority of patients either have normal or restrictive pulmonary function."
    explanation: >-
      Records restriction as the abnormal pattern when there is one, and
      simultaneously that normal physiology is common.
- name: Cor pulmonale
  category: Cardiovascular
  description: >-
    Right heart failure secondary to advanced parenchymal lung disease, and part
    of the terminal picture. The associated pulmonary hypertension here is
    secondary to lung disease and hypoxia rather than a primary pulmonary
    arteriopathy, which is why this phenotype is bound to cor pulmonale rather
    than to a pulmonary arterial hypertension term.
  phenotype_term:
    preferred_term: Cor pulmonale
    term:
      id: HP:0001648
      label: Cor pulmonale
  evidence:
  - reference: PMID:22941890
    reference_title: "Pulmonary alveolar microlithiasis: two case reports and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While it remains static in some patients, it progresses into pulmonary fibrosis, respiratory failure and cor pulmonale in others."
    explanation: >-
      Names cor pulmonale as an endpoint of the progressive course.

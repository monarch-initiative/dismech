pathophysiology:
- name: EMILIN1 Loss of Function
  description: >-
    Biallelic truncating EMILIN1 variants abolish EMILIN1, an elastic fiber
    component located at the interface between fibrillin microfibrils and the
    elastin core.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: EMILIN1

- name: Emilin1 knockout mouse (Zacchigna 2006)
  species: Mouse
  genotype: Emilin1-/-
  publication: PMID:16530041
  description: >-
    Emilin1 knockout mice have increased blood pressure, increased peripheral
    vascular resistance and reduced vessel size, with increased vascular
    TGF-beta signaling; hypertension is rescued by inactivating one Tgfb1
    allele. Hypertension is not listed as a feature in the human sources cited
    in this entry.
  modeled_mechanisms:
  - target: Aberrant Growth Factor Signaling
    relationship: MEASURES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: Increased TGF-beta signaling in the vascular wall of knockout mice.
    limitations: >-
      No human TGF-beta signaling data were available in a cached source, so
      whether the mouse finding transfers to the human vascular phenotype is
      unknown.
    evidence:
    - reference: PMID:16530041
      reference_title: Emilin1 links TGF-beta maturation to blood pressure homeostasis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: genetic inactivation of Emilin1 causes increased TGF-beta signaling in the vascular wall
      explanation: Vascular TGF-beta readout in the knockout.

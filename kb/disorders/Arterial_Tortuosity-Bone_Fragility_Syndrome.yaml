name: EMILIN1-Related Arterial Tortuosity Syndrome
creation_date: "2026-11-03T19:15:04Z"
category: Mendelian
disease_term:
  preferred_term: arterial tortuosity-bone fragility syndrome
  term:
    id: MONDO:0971179
    label: arterial tortuosity-bone fragility syndrome
description: >-
  Autosomal recessive heritable connective tissue disorder caused by biallelic
  loss-of-function variants in EMILIN1, which encodes a structural component
  of the elastic fiber network located at the interface between the fibrillin
  microfibril scaffold and the elastin core. The defining report describes an
  entity combining arterial tortuosity, aneurysm formation, cutis laxa and
  bone fragility, resembling EFEMP2 (fibulin-4)-related autosomal recessive
  cutis laxa type 1B. Onset is in the neonatal period or early childhood.
  Absence of EMILIN1 impairs extracellular deposition of EFEMP2 and lysyl
  oxidase activity, so elastogenesis and collagen crosslinking are both
  defective; Emilin1 knockout mice show elastic fiber, collagen fibril and
  trabecular bone abnormalities. ClinGen counts five probands from two
  publications, all male.
synonyms:
- arterial tortuosity-bone fragility syndrome
parents:
- inherited cutis laxa
- hereditary disorder of connective tissue
notes: >-
  Naming: the MONDO label is arterial tortuosity-bone fragility syndrome; the
  entry name uses the MONDO exact synonym EMILIN1-related arterial tortuosity
  syndrome, which MONDO attributes to ClinGen and which the ClinGen
  gene-disease validity record names as its preferred term. The file slug keeps
  the MONDO label. This entry is distinct from SLC2A10-related arterial
  tortuosity syndrome (Arterial_Tortuosity_Syndrome) and from the
  EFEMP2-related cutis laxa it resembles. Allelic heterozygous EMILIN1
  phenotypes are separate entities and are not folded in here, as ClinGen
  decided under its lumping and splitting guidelines: an autosomal dominant
  connective tissue disorder with aortic aneurysms and sensorimotor peripheral
  neuropathy reported in one family with the signal-peptide missense p.A22T
  (Capuano et al. 2016, PMID:26462740), and autosomal dominant distal
  hereditary motor neuronopathy (HMND10, OMIM 620080), curated as the
  dHMN-EMILIN1 subtype of Distal_Hereditary_Motor_Neuronopathy_Autosomal_Dominant.
  The cited human sources are abstracts and the ClinGen evidence summary;
  per-patient frequencies from the Adamo et al. 2022 full text (Table 1) could
  not be checked against a cached copy and are not recorded. No Orphanet entry
  or GeneReviews chapter was found for this disorder.

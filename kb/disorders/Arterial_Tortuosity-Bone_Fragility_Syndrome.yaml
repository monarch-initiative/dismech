    reference_title: "EMILIN1 / arterial tortuosity-bone fragility syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These studies showed reduced EMILIN1 positive signals from elastic fibers
      in the skin and elastin core abnormalities.
    explanation: ClinGen summary of the skin elastic fiber findings.
  downstream:
  - target: Arterial tortuosity
    description: >-
      Elastic fiber failure in the arterial wall is the proposed basis for the
      vascular phenotype; the step is inferred from the shared EFEMP2-LOX
      mechanism with cutis laxa type 1B rather than shown directly in the
      cited abstracts.
  - target: Aortic root aneurysm
    description: >-
      Inferred from the same elastic fiber defect in the aortic wall; not
      shown directly in the cited abstracts.
  - target: Cutis laxa
    description: Defective dermal elastic fibers underlie loose skin.
- name: Defective Collagen Fibrillogenesis
  description: >-
    Reduced LOX-mediated collagen crosslinking and abnormal collagen fiber
    ultrastructure in skin and aorta, with abnormal trabecular bone formation
    and strength in Emilin1 knockout femora.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: ABNORMAL
    term:
      id: GO:0030199
      label: collagen fibril organization
  evidence:
  - reference: PMID:36351433
    reference_title: EMILIN1 deficiency causes arterial tortuosity with osteopenia and connects impaired elastogenesis with defective collagen fibrillogenesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: >-
      Collagen fiber ultrastructure and histopathology in EMILIN1- or
      EFEMP2-deficient skin and aorta corroborate these findings
    explanation: >-
      Ultrastructural collagen findings in deficient skin and aorta; the
      sentence does not say whether the tissue was human, mouse or both, so it
      is graded OTHER.
  - reference: PMID:36351433
    reference_title: EMILIN1 deficiency causes arterial tortuosity with osteopenia and connects impaired elastogenesis with defective collagen fibrillogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: murine Emilin1-/- femora show abnormal trabecular bone formation and strength
    explanation: Bone involvement shown in the knockout mouse.
  downstream:
  - target: Increased susceptibility to fractures
    description: >-
      The authors connect the collagen defect to bone fragility; in mice it is
      shown as abnormal trabecular bone and strength, not as fractures, so the
      link to human fractures is inferred.
- name: Aberrant Growth Factor Signaling
  description: >-
    Emilin1 binds proTGF-beta and prevents its maturation by furin
    convertases; Emilin1 knockout mice show increased TGF-beta signaling in the
    vascular wall. The defining human report describes aberrant growth factor
    signaling, but which human phenotypes this contributes to is not
    established in the cited sources, so no causal edge to a phenotype is
    drawn.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: TGF-beta receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  evidence:
  - reference: PMID:16530041
    reference_title: Emilin1 links TGF-beta maturation to blood pressure homeostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Emilin1 inhibits TGF-beta signaling by binding specifically to the
      proTGF-beta precursor and preventing its maturation by furin convertases
      in the extracellular space
    explanation: Mechanism of EMILIN1 restraint of TGF-beta, from mouse work.
  - reference: PMID:16530041
    reference_title: Emilin1 links TGF-beta maturation to blood pressure homeostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: genetic inactivation of Emilin1 causes increased TGF-beta signaling in the vascular wall
    explanation: Increased vascular TGF-beta signaling in the knockout mouse.

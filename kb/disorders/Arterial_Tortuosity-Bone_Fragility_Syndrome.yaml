- name: Emilin1 knockout mouse (Adamo 2022)
  species: Mouse
  genotype: Emilin1-/-
  publication: PMID:36351433
  description: >-
    Emilin1-null mice show bone, collagen and elastic fiber abnormalities,
    including abnormal trabecular bone formation and strength in the femur.
  modeled_mechanisms:

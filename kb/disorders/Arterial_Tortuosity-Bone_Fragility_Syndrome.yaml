diagnosis:
- name: Trio exome sequencing
  description: >-
    The one published post-discovery case was diagnosed by trio exome
    sequencing, which found compound heterozygous EMILIN1 truncating variants
    in trans. The diagnostic laboratory reported both as variants of unknown
    significance and did not link them to the recessive disorder, while OMIM
    listed EMILIN1 only for the autosomal dominant disorder (OMIM 620080); the
    clinicians corrected the interpretation.
  diagnosis_term:
    preferred_term: trio exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing

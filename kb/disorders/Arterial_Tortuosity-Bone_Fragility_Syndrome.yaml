    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      While EMILIN1 is listed in OMIM as causing an autosomal dominant disorder
      (OMIM # 620080), there are no current OMIM entries for clinically
      heterogeneous disorders with an autosomal recessive mode of inheritance

      label: extracellular matrix structural constituent
  evidence:
  - reference: CGGV:assertion_be7af692-0751-4da3-a24a-b28cf4675b4d-2025-06-05T160000.000Z
    reference_title: "EMILIN1 / arterial tortuosity-bone fragility syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The mechanism of pathogenicity is reported to be loss of function.
    explanation: ClinGen states the disease mechanism as loss of function.
  - reference: PMID:36351433
    reference_title: EMILIN1 deficiency causes arterial tortuosity with osteopenia and connects impaired elastogenesis with defective collagen fibrillogenesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      EMILIN1 (elastin-microfibril-interface-located-protein-1) is a structural
      component of the elastic fiber network and localizes to the interface
      between the fibrillin microfibril scaffold and the elastin core.
    explanation: >-
      Background on where EMILIN1 sits in the elastic fiber; its role as a
      structural component of the elastic fiber network is the basis for
      binding the extracellular matrix structural constituent function, which
      truncating loss-of-function variants abolish.
  downstream:
  - target: Impaired EFEMP2 Deposition and LOX Activity
    description: >-
      Absence of EMILIN1 impairs extracellular deposition of EFEMP2
      (fibulin-4) and lysyl oxidase activity.
- name: Impaired EFEMP2 Deposition and LOX Activity
  description: >-
    Without EMILIN1, the elastogenic protein EFEMP2 (fibulin-4) is poorly
    deposited in the extracellular matrix and lysyl oxidase (LOX) levels and
    enzyme activity fall, shown in patient material and in Emilin1 knockout
    mice. This places EMILIN1 deficiency on the same EFEMP2-LOX axis as
    EFEMP2-related cutis laxa type 1B.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: LOX
    term:
      id: hgnc:6664
      label: LOX
  molecular_functions:
  - preferred_term: lysyl oxidase activity
    modifier: DECREASED
    term:
      id: GO:0004720
      label: protein-lysine 6-oxidase activity
  evidence:
  - reference: PMID:36351433
    reference_title: EMILIN1 deficiency causes arterial tortuosity with osteopenia and connects impaired elastogenesis with defective collagen fibrillogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In both humans and mice, absence of EMILIN1 impairs EFEMP2 extracellular
      matrix deposition and LOX activity resulting in impaired elastogenesis,
      reduced collagen crosslinking, and aberrant growth factor signaling.
    explanation: >-
      The sentence pools patient-derived and mouse data; it is graded as human
      here because it states the finding in patients, and the mouse arm is
      recorded separately under animal_models.
  - reference: CGGV:assertion_be7af692-0751-4da3-a24a-b28cf4675b4d-2025-06-05T160000.000Z
    reference_title: "EMILIN1 / arterial tortuosity-bone fragility syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: They also showed impaired EFEMP2 deposition and reduced LOX levels and enzyme activity.
    explanation: ClinGen summary of the functional data.
  downstream:
  - target: Impaired Elastogenesis
    description: Reduced EFEMP2 deposition and LOX activity impair elastic fiber formation.
  - target: Defective Collagen Fibrillogenesis
    description: Reduced LOX activity lowers collagen crosslinking.
  - target: Aberrant Growth Factor Signaling
    description: The defining report lists aberrant growth factor signaling among the consequences.
- name: Impaired Elastogenesis
  description: >-
    Defective elastic fiber assembly, with reduced EMILIN1 signal on skin
    elastic fibers and abnormal elastin cores.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: elastic fiber assembly

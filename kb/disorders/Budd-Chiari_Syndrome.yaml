- name: Renal Impairment
  description: >-
    Renal impairment is common in Budd-Chiari syndrome and reflects splanchnic
    pooling, reduced effective circulating volume, and hepatorenal physiology
    analogous to that seen in advanced cirrhosis with ascites. Worsening renal
    function is an important marker of disease severity and may improve with
    decompression of the venous outflow obstruction.
  category: Renal
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Renal insufficiency
    term:
      id: HP:0000083
      label: Renal insufficiency

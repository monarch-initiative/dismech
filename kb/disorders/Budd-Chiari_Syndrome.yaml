phenotypes:
- name: Ascites
  description: >-
    Ascites is the hallmark feature of Budd-Chiari syndrome, arising when hepatic
    venous outflow obstruction raises sinusoidal pressure and drives filtration of
    protein-rich interstitial fluid into the peritoneal cavity. The resulting
    progressive abdominal distension is often the presenting complaint and may be
    refractory until the venous obstruction is relieved.
  category: Hepatic
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Ascites
    term:
      id: HP:0001541
      label: Ascites
  evidence:
  - reference: PMID:32982109
    reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The typical and most common form of clinical presentation of BCS is the
      chronic one, with a slow-onset pain in the right upper abdomen, jaundice
      (not always present in chronic form), hepatosplenomegaly, progressive
      abdominal swelling/stretching (due to ascites), haematemesis (due to
      esophageal varices caused by portal hypertension);
    explanation: >-
      The clinical review explicitly lists ascites-related abdominal distension
      as part of common chronic Budd-Chiari presentation.
  - reference: ORPHA:131
    reference_title: "Budd-Chiari syndrome (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0001541 | Ascites | Very frequent (99-80%)"
    explanation: Orphanet supports ascites as a very frequent Budd-Chiari phenotype.
- name: Abdominal Pain
  description: >-
    Right upper quadrant abdominal pain in Budd-Chiari syndrome reflects acute or
    progressive hepatic congestion, with stretching of the liver capsule as the
    congested liver enlarges. The pain is typically slow in onset in the common
    chronic form but can be severe in acute or fulminant presentations.
  category: Gastrointestinal
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Abdominal pain
    term:
      id: HP:0002027
      label: Abdominal pain
  evidence:
  - reference: PMID:32982109
    reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The typical and most common form of clinical presentation of BCS is the
      chronic one, with a slow-onset pain in the right upper abdomen, jaundice
      (not always present in chronic form), hepatosplenomegaly, progressive
      abdominal swelling/stretching (due to ascites), haematemesis (due to
      esophageal varices caused by portal hypertension);
    explanation: >-
      This supports right upper abdominal pain as a common clinical manifestation.
- name: Hepatomegaly
  description: >-
    Hepatomegaly in Budd-Chiari syndrome results from passive congestion of the
    liver behind the obstructed hepatic venous outflow tract, with engorged
    sinusoids and interstitial edema enlarging the organ. The caudate lobe, which
    often drains directly into the inferior vena cava, may hypertrophy and become
    especially prominent.
  category: Hepatic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Hepatomegaly
    term:
      id: HP:0002240
      label: Hepatomegaly
  evidence:
  - reference: PMID:32982109

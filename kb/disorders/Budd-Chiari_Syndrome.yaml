    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      50% of patients can manifest renal impairment[31-33].
    explanation: >-
      The review reports renal impairment in half of patients with chronic
      Budd-Chiari syndrome, supporting common renal involvement.
- name: Portal Hypertension
  description: >-
    Portal hypertension in Budd-Chiari syndrome arises directly from the increased
    intrahepatic resistance produced by hepatic venous outflow obstruction and
    sinusoidal congestion. Sustained elevation of portal pressure underlies the
    ascites, splenomegaly, and varices that characterize the disorder and is a
    primary target for prophylaxis and shunting therapy.
  category: Hepatic
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Portal hypertension
    term:
      id: HP:0001409
      label: Portal hypertension
  evidence:
  - reference: PMID:23868034
    reference_title: "The Budd-Chiari syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A therapeutic strategy has been proposed where anticoagulation, correction
      of risk factors, diuretics and prophylaxis for portal hypertension are used
      first; then angioplasty for shortlength venous stenosis; then Transjugular
      Intrahepatic Portosystemic Shunt (TIPS); and ultimately liver transplantation.
    explanation: >-
      The management review identifies portal hypertension as a disease
      consequence requiring prophylaxis.
  - reference: ORPHA:131
    reference_title: "Budd-Chiari syndrome (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0001409 | Portal hypertension | Very frequent (99-80%)"
    explanation: Orphanet supports portal hypertension as a very frequent Budd-Chiari phenotype.
- name: Jaundice
  description: >-
    Jaundice in Budd-Chiari syndrome reflects hepatocellular dysfunction from
    congestive, hypoxic liver injury behind the obstructed venous outflow. It is
    variable and not always present in the chronic form, becoming more prominent
    in acute or fulminant presentations with significant hepatic impairment.
  category: Hepatic
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Jaundice
    term:
      id: HP:0000952
      label: Jaundice
  evidence:
  - reference: PMID:32982109
    reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The typical and most common form of clinical presentation of BCS is the
      chronic one, with a slow-onset pain in the right upper abdomen, jaundice
      (not always present in chronic form), hepatosplenomegaly, progressive
      abdominal swelling/stretching (due to ascites), haematemesis (due to
      esophageal varices caused by portal hypertension);
    explanation: >-
      Jaundice is explicitly listed in the common chronic presentation, with the
      caveat that it is not always present.
- name: Esophageal Varices
  description: >-
    Esophageal varices form as portosystemic collaterals when the portal
    hypertension of Budd-Chiari syndrome diverts blood through the gastroesophageal
    venous plexus. These dilated submucosal veins are prone to rupture, and
    variceal bleeding presenting as hematemesis is a major cause of morbidity in
    the chronic disease.
  category: Gastrointestinal
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Esophageal varices
    term:

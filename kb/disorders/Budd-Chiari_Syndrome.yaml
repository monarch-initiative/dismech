    snippet: >-
      The blockage of hepatic veins causes liver damage and can lead to
      cirrhosis and, on long-term, to hepatocellular carcinoma development;
      therefore, these serum alpha-fetoprotein levels must be monitored in
      these patients[34].
    explanation: >-

datasets:
- accession: geo:GSE228205
  title: Effect of endovascular treatment on gene expression in patients with Budd-Chiari syndrome
  description: Budd-Chiari syndrome (BCS) results in sinusoidal congestion and hepatocyte apoptosis, which can further progress to liver fibrosis, cirrhosis, and hepatocellular carcinoma. Endovascular (EV) treatment has been the primary therapeutic method and achieved excellent outcomes. However, whether EV treatment could reverse liver cirrhosis in patients with BCS is still unclear. To investigate the effect of endovascular treatment on liver cirrhosis in patients with Budd-Chiari syndrome, we performed gene expression profiling analysis of the liver from patients with or without EV treatment.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 8
  notes: Identified by GEO DataSets index search for Budd-Chiari Syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.

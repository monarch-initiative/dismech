name: Budd-Chiari Syndrome
creation_date: "2026-05-06T11:55:49Z"
category: Complex
description: >-
  Budd-Chiari syndrome is a hepatic venous outflow obstruction disorder in
  which thrombosis or stenosis of hepatic veins or the terminal inferior vena
  cava causes hepatic congestion, portal hypertension, and liver injury.
disease_term:
  preferred_term: Budd-Chiari syndrome
  term:
    id: MONDO:0010947
    label: Budd-Chiari syndrome
parents:
- Vascular Disorder
- Hepatic Venous Outflow Obstruction
synonyms:
- BCS
- Hepatic venous outflow obstruction
- Hepatic vein thrombosis
has_subtypes:
- name: Primary Budd-Chiari Syndrome
  description: >-
    Budd-Chiari syndrome caused by intrinsic venous pathology such as
    thrombosis, webs, or endophlebitis.
  evidence:
  - reference: PMID:32982109
    reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BCS is classified as primary if the obstruction is attributed to venous pathology such as thrombosis, webs, or endophlebitis"
    explanation: Defines primary Budd-Chiari syndrome by intrinsic venous pathology.
- name: Secondary Budd-Chiari Syndrome
  description: >-
    Budd-Chiari syndrome caused by extrinsic compression or invasion of the
    hepatic venous outflow tract.
  evidence:
  - reference: PMID:32982109
    reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "secondary in cases of extraluminal compression such as tumours, abscess, cysts, and pericardial conditions"
    explanation: Defines secondary Budd-Chiari syndrome by extraluminal compression.
- name: Classical Budd-Chiari Syndrome
  description: >-
    Primary Budd-Chiari syndrome involving the hepatic veins.
  evidence:
  - reference: PMID:32982109
    reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "primary BCS is classified as “classical BCS” if the obstruction involves the hepatic veins"
    explanation: Defines classical Budd-Chiari syndrome by hepatic-vein involvement.
- name: Hepatic Vena Cava Budd-Chiari Syndrome
  description: >-
    Primary Budd-Chiari syndrome involving the intrahepatic or suprahepatic
    inferior vena cava.
  evidence:
  - reference: PMID:32982109
    reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the “hepatic vena cava BCS” if the intra- and/or supra-hepatic portion of the IVC is obstructed"
    explanation: Defines hepatic vena cava Budd-Chiari syndrome by inferior-vena-cava obstruction.
pathophysiology:
- name: Systemic Prothrombotic Predisposition
  description: >-
    Primary Budd-Chiari syndrome commonly occurs in patients with acquired or
    inherited prothrombotic conditions, especially myeloproliferative disorders.
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  genes:
  - preferred_term: JAK2
    term:
      id: hgnc:6192
      label: JAK2
  - preferred_term: F5
    term:
      id: hgnc:3542
      label: F5
  evidence:
  - reference: PMID:19012988
    reference_title: "Primary Budd-Chiari syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple risk factors have been identified and are often combined in the
      same patient.
    explanation: >-
      This supports multifactorial prothrombotic susceptibility in primary
      Budd-Chiari syndrome.
  - reference: PMID:19012988
    reference_title: "Primary Budd-Chiari syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myeloproliferative diseases of atypical presentation account for nearly
      50% of patients; their diagnosis can be made by showing the V617F mutation
      in Janus tyrosine kinase-2 gene of peripheral blood granulocytes and,
      should this mutation be absent, by showing clusters of dystrophic
      megacaryocytes at bone marrow biopsy.
    explanation: >-
      This supports myeloproliferative disease and JAK2 V617F testing as a
      central prothrombotic context for Budd-Chiari syndrome.
  - reference: PMID:32982109
    reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      among these, up to 87% can have occult myeloproliferative diseases[29].
    explanation: >-
      Among idiopathic Budd-Chiari cases, occult myeloproliferative disease is
      frequently unmasked on detailed hematologic work-up, underscoring the
      centrality of myeloproliferative prothrombotic states.
  downstream:
  - target: Hepatic vein thrombosis
    description: >-
      Prothrombotic states can produce hepatic vein thrombosis, the classic
      obstructive lesion in primary Budd-Chiari syndrome.
    evidence:
    - reference: PMID:19012988
      reference_title: "Primary Budd-Chiari syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Primary Budd-Chiari syndrome is characterized by a blocked hepatic venous outflow tract at various levels from small hepatic veins to inferior vena cava, resulting from thrombosis or its fibrous sequellae."
      explanation: Supports thrombosis as the lesion linking prothrombotic predisposition to primary Budd-Chiari syndrome.
  - target: Hepatic Venous Outflow Obstruction
    description: >-
      Prothrombotic states promote hepatic venous thrombosis or fibrous
      sequelae that block hepatic venous outflow.
    evidence:
    - reference: PMID:19012988
      reference_title: "Primary Budd-Chiari syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Primary Budd-Chiari syndrome is characterized by a blocked hepatic venous outflow tract at various levels from small hepatic veins to inferior vena cava, resulting from thrombosis or its fibrous sequellae."
      explanation: Supports thrombosis and fibrous sequelae as causes of hepatic venous outflow obstruction.
- name: Hepatic Venous Outflow Obstruction
  conforms_to: "portal_hypertension#Increased Intrahepatic Vascular Resistance"
  description: >-
    Obstruction of hepatic venous drainage raises sinusoidal pressure and causes
    hepatic congestion.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  evidence:
  - reference: PMID:19012988
    reference_title: "Primary Budd-Chiari syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary Budd-Chiari syndrome is characterized by a blocked hepatic venous
      outflow tract at various levels from small hepatic veins to inferior vena
      cava, resulting from thrombosis or its fibrous sequellae.
    explanation: >-
      This review directly defines primary Budd-Chiari syndrome as hepatic
      venous outflow obstruction caused by thrombosis or fibrous sequelae.
  - reference: PMID:32982109
    reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BCS develops from a spectrum of diseases determining hepatic venous
      outflow obstruction, both thrombotic and non-thrombotic.
    explanation: >-
      This full-text review supports both thrombotic and non-thrombotic causes
      of hepatic venous outflow obstruction in Budd-Chiari syndrome.
  downstream:
  - target: Portal Hypertension and Congestive Liver Injury
    description: >-
      Hepatic venous obstruction increases sinusoidal pressure, impairs portal
      flow, and causes congestive liver injury.
    evidence:
    - reference: PMID:32982109
      reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The obstruction of the hepatic veins results in increase of hepatic sinusoidal pressure, sinusoid dilation, and filtration of interstitial fluid, which leads to ascites; in addition, there is increase in the intrahepatic resistances and, therefore, decrease in portal venous flow, leading to hypoxic damage of hepatocytes[14]."
      explanation: Directly links venous obstruction to sinusoidal hypertension, impaired portal flow, and hypoxic liver injury.
  - target: Fever
    description: >-
      Acute or inflammatory presentations of hepatic venous outflow obstruction
      may include fever.
    evidence:
    - reference: ORPHA:131
      reference_title: "Budd-Chiari syndrome (Orphanet structured-database record)"
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "HP:0001945 | Fever | Frequent (79-30%)"
      explanation: >-
        Supports fever as a frequent associated manifestation of Budd-Chiari
        syndrome; its placement on the acute outflow-obstruction branch is a
        clinically inferred route rather than a mechanism asserted by Orphanet.
- name: Portal Hypertension and Congestive Liver Injury
  conforms_to: "portal_hypertension#Portal Hypertension"
  description: >-
    Sustained hepatic venous congestion drives portal hypertension, ascites,
    hepatomegaly, and progressive liver dysfunction.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: response to hypoxia
    term:
      id: GO:0001666
      label: response to hypoxia
    modifier: INCREASED
  evidence:
  - reference: PMID:32982109
    reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The obstruction of the hepatic veins results in increase of hepatic
      sinusoidal pressure, sinusoid dilation, and filtration of interstitial
      fluid, which leads to ascites; in addition, there is increase in the
      intrahepatic resistances and, therefore, decrease in portal venous flow,
      leading to hypoxic damage of hepatocytes[14].
    explanation: >-
      This mechanistic passage links venous obstruction to sinusoidal
      hypertension, ascites, impaired portal flow, and hepatocyte hypoxic injury.
  downstream:
  - target: Portal Hypertension
    description: >-
      Hepatic venous congestion increases intrahepatic resistance and portal
      pressure.
    evidence:
    - reference: PMID:32982109
      reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "there is increase in the intrahepatic resistances and, therefore, decrease in portal venous flow"
      explanation: Supports increased intrahepatic resistance and impaired portal flow as the basis of portal hypertension.
  - target: Ascites
    description: >-
      Raised hepatic sinusoidal pressure drives fluid filtration into the
      peritoneal cavity.
    evidence:
    - reference: PMID:32982109
      reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The obstruction of the hepatic veins results in increase of hepatic sinusoidal pressure, sinusoid dilation, and filtration of interstitial fluid, which leads to ascites"
      explanation: Directly supports sinusoidal hypertension and filtration as the cause of ascites.
  - target: Hepatomegaly
    description: >-
      Passive hepatic congestion enlarges the liver.
    evidence:
    - reference: PMID:32982109
      reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "jaundice (not always present in chronic form), hepatosplenomegaly, progressive abdominal swelling/stretching (due to ascites)"
      explanation: >-
        The source establishes hepatomegaly as a manifestation of chronic
        Budd-Chiari syndrome; the route from passive hepatic congestion is
        clinically inferred.
  - target: Splenomegaly
    description: >-
      Portal hypertension produces congestive splenic enlargement.
    evidence:
    - reference: PMID:32982109
      reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "jaundice (not always present in chronic form), hepatosplenomegaly, progressive abdominal swelling/stretching (due to ascites)"
      explanation: >-
        The source establishes splenomegaly as part of the chronic presentation;
        the route from portal hypertension is clinically inferred.
  - target: Jaundice
    description: >-
      Congestive hepatocyte injury can impair bilirubin handling and produce

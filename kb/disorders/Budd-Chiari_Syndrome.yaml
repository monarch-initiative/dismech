- name: Congestive Hepatic Fibrosis
  description: >-
    Untreated hepatic venous outflow obstruction can cause rapid congestive
    fibrosis and progressive liver failure.
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  cell_types:
  - preferred_term: hepatic stellate cell
    term:
      id: CL:0000632
      label: hepatic stellate cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:32982109
    reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If left untreated, the natural course of the disease is extremely
      unfavorable with a mortality rate of 50% in 2 years, while the 3-year
      survival rate of untreated patients is < 10%, as the venous outflow
      obstruction leads to hepatic congestion and fulminant fibrosis, typically
      within 3 mo[11].
    explanation: >-
      This supports hepatic congestion progressing to fulminant fibrosis in
      untreated Budd-Chiari syndrome.
  downstream:
  - target: Cirrhosis
    description: >-
      Persistent congestive fibrosis can progress to cirrhosis.
    evidence:
    - reference: PMID:32982109
      reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The blockage of hepatic veins causes liver damage and can lead to cirrhosis and, on long-term, to hepatocellular carcinoma development"
      explanation: Supports chronic hepatic venous obstruction and injury progressing to cirrhosis.
  - target: Acute hepatic failure
    description: >-
      Fulminant congestive hepatic injury can progress to acute hepatic failure.
    evidence:
    - reference: ORPHA:131
      reference_title: "Budd-Chiari syndrome (Orphanet structured-database record)"
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "HP:0006554 | Acute hepatic failure | Occasional (29-5%)"
      explanation: Supports acute hepatic failure as an occasional severe outcome of Budd-Chiari syndrome.
  - target: Hepatocellular Carcinoma
    description: >-
      Chronic congestive fibrosis and cirrhosis provide a background for
      long-term hepatocellular carcinoma development.
    evidence:
    - reference: PMID:32982109
      reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The blockage of hepatic veins causes liver damage and can lead to cirrhosis and, on long-term, to hepatocellular carcinoma development"
      explanation: Directly supports long-term hepatocellular carcinoma development after chronic hepatic venous obstruction and cirrhosis.

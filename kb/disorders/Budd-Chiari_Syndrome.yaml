- name: Hepatocellular Carcinoma
  description: >-
    Hepatocellular carcinoma is a recognized long-term complication of chronic
    Budd-Chiari syndrome, arising on the background of congestive cirrhosis.
    Because of this risk, serum alpha-fetoprotein and imaging surveillance are
    recommended in patients with established disease.
  category: Hepatic

    evidence:
    - reference: PMID:32982109
      reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "jaundice (not always present in chronic form), hepatosplenomegaly, progressive abdominal swelling/stretching (due to ascites)"
      explanation: >-
        The source establishes jaundice as a manifestation of Budd-Chiari
        syndrome; the route from congestive hepatocyte injury is clinically
        inferred.
  - target: Esophageal Varices
    description: >-
      Portal hypertension diverts blood through gastroesophageal collateral
      veins.
    evidence:
    - reference: PMID:32982109
      reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "haematemesis (due to esophageal varices caused by portal hypertension)"
      explanation: Directly links portal hypertension to esophageal varices.
  - target: Gastrointestinal hemorrhage
    description: >-
      Variceal rupture or portal-hypertensive bleeding can manifest as

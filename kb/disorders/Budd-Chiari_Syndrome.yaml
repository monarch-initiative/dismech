histopathology:
- name: Centrilobular Congestive Hepatopathy
  description: >-
    Liver biopsy in Budd-Chiari syndrome characteristically shows high-grade
    venous congestion with sinusoidal dilatation, centrilobular (zone 3) liver
    cell atrophy and fibrosis, and thrombosis of the terminal hepatic venules,
    reflecting downstream congestion behind the obstructed hepatic venous
    outflow tract.
  evidence:
  - reference: PMID:32982109
    reference_title: "Transjugular intrahepatic portosystemic shunt for Budd-Chiari syndrome: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pathologic findings are represented by high-grade venous congestion with
      sinusoidal dilation, centrilobular liver cell atrophy and fibrosis, and
      thrombosis of the terminal hepatic venules.
    explanation: >-
      The review describes the characteristic liver-biopsy pathology of
      Budd-Chiari syndrome.
diagnosis:
- name: Hepatic venous outflow imaging
  description: >-
    Doppler ultrasound, CT, or MRI can noninvasively demonstrate the hepatic
    venous or inferior vena cava obstruction and collateral consequences that
    establish the diagnosis.
  diagnosis_term:
    preferred_term: diagnostic imaging
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  results: >-
    Demonstration of hepatic venous outflow tract obstruction supports
    Budd-Chiari syndrome.
  evidence:
  - reference: PMID:19012988
    reference_title: "Primary Budd-Chiari syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Doppler-ultrasound, computed tomography or magnetic resonance imaging of
      hepatic veins and inferior vena cava are usually successful in
      demonstrating non-invasively the obstacle or its consequences, the
      collaterals to hepatic veins or inferior vena cava.
    explanation: >-
      This supports noninvasive imaging of hepatic veins and inferior vena cava
      for diagnosis.

- name: Spermatocyte Arrest Before Pachytene and Germ Cell Apoptosis
  description: >-
    Spermatocytes that cannot pair, synapse and repair their breaks arrest
    at a zygotene-like stage before pachytene and are eliminated, so no
    post-meiotic germ cells form. In Kash5-null testes widespread apoptosis
    is seen in about 30% of tubule cross sections.

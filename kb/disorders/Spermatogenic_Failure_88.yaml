name: Spermatogenic Failure 88
creation_date: "2026-10-22T20:30:00Z"
category: Mendelian
description: >-
  Spermatogenic failure 88 (SPGF88) is autosomal recessive male infertility
  with non-obstructive azoospermia caused by biallelic variants in KASH5
  (formerly CCDC155). KASH5 is a germ-cell-specific KASH-domain protein of the
  outer nuclear membrane. With SUN1 in the inner nuclear membrane it forms the
  meiotic LINC complex, which couples the telomeres of prophase I chromosomes,
  across the nuclear envelope, to cytoplasmic dynein. KASH5 is itself a dynein
  activating adaptor. The resulting telomere-led chromosome movements bring
  homologous chromosomes together. Without KASH5, homologs fail to pair and
  synapse, meiotic DNA double-strand breaks stay unrepaired, and spermatocytes
  arrest at a zygotene-like stage before pachytene, so no post-meiotic germ
  cells or sperm are produced. Kash5-null mice reproduce the meiotic arrest.
  Reported families are consanguineous or carry two rare alleles, including
  frameshift, splice-site, missense and copy-number variants.
disease_term:
  preferred_term: spermatogenic failure 88
  term:
    id: MONDO:0957821
    label: spermatogenic failure 88
parents:
- Spermatogenic Failure
- Male infertility
- Genetic Disease
synonyms:
- SPGF88
- spermatogenic failure 88
- KASH5-related non-obstructive azoospermia
- CCDC155-related male infertility
notes: >-
  MONDO cross-references this disease as OMIM 620547. Scope: this entry
  covers the male phenotype only. Biallelic KASH5 variants also cause female
  premature ovarian insufficiency or diminished ovarian reserve, recorded by
  MONDO as a separate disease, premature ovarian failure 22 (MONDO:0957822),
  which has its own curation stub; the female phenotypes are therefore not
  curated here, although several cited families include affected sisters.
  A homozygous KASH5 missense variant reported in a woman with recurrent
  hydatidiform moles (PMID:42503564) likewise belongs to the female
  phenotype and is not used. No GeneReviews chapter exists for this disease.
  No ClinGen gene-disease validity curation for KASH5 was found in the
  committed ClinGen export. No treatment is curated: none of the cited
  reports describes sperm retrieval or assisted reproduction in an affected
  man, and meiotic arrest before pachytene leaves no post-meiotic germ cells
  to retrieve in the biopsies described. Abstract-only caches: PMID:35674372,
  PMID:35587281, PMID:35708642, PMID:42443317 and PMID:29790874.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic KASH5 variants: homozygous frameshift and
    missense variants in consanguineous families, recessive variants in a
    Middle Eastern consanguineous family, and compound heterozygous
    splice-site variants in a sporadic patient.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:35587281
    reference_title: "Homozygous missense mutation in CCDC155 disrupts the transmembrane distribution of CCDC155 and SUN1, resulting in non-obstructive azoospermia and premature ovarian insufficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified a novel homozygous missense mutation in CCDC155 ... in a pair of familial NOA and POI patients whose parents were first cousins"
    explanation: Homozygous variant from a first-cousin marriage segregating with gametogenic failure.
  - reference: PMID:36864840
    reference_title: "A homozygous KASH5 frameshift mutation causes diminished ovarian reserve, recurrent miscarriage, and non-obstructive azoospermia in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the retained variants, a frameshift mutation in KASH5 was identified recessively segregating with the infertility and recurrent miscarriage within the family"
    explanation: Recessive segregation of a homozygous frameshift in a second consanguineous family.
  - reference: PMID:29790874
    reference_title: "Point-of-care whole-exome sequencing of idiopathic male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In five of eight families, we identified rare deleterious recessive variants in CCDC155, NANOS2, SPO11, TEX14, and WNK3 segregating with disease."
    explanation: First report of recessive CCDC155 (KASH5) variants segregating with non-obstructive azoospermia.
pathophysiology:
- name: KASH5 Loss of Function
  description: >-
    Biallelic KASH5 variants remove the protein or keep it out of the nuclear
    envelope. A homozygous frameshift abolishes KASH5 in the patient's testis.
    The missense p.Leu197Pro in the coiled-coil domain blocks nuclear
    envelope distribution of KASH5 and with it the nuclear-envelope enrichment
    of its partner SUN1. The transmembrane-domain variant p.Leu535Gln
    misroutes KASH5 to mitochondria in cultured cells, and a splice-site
    variant reported in women with ovarian insufficiency weakens nuclear
    envelope localization and SUN1 binding. Splice-site variants found in a
    man with meiotic arrest cause exon skipping in minigene assays.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KASH5
    term:
      id: hgnc:26520
      label: KASH5
  molecular_functions:
  - preferred_term: Dynein light intermediate chain binding
    term:
      id: GO:0051959
      label: dynein light intermediate chain binding
    modifier: DECREASED
  cellular_components:
  - preferred_term: Meiotic LINC complex
    term:
      id: GO:0034993
      label: meiotic nuclear membrane microtubule tethering complex
  downstream:
  - target: Uncoupling of Meiotic Telomeres from Cytoplasmic Dynein
    causal_link_type: DIRECT
    description: >-
      Without KASH5 at the outer nuclear membrane, the SUN1-bound telomere
      attachment sites lose their connection to dynein.
    evidence:
    - reference: PMID:35587281
      reference_title: "Homozygous missense mutation in CCDC155 disrupts the transmembrane distribution of CCDC155 and SUN1, resulting in non-obstructive azoospermia and premature ovarian insufficiency in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "eventually leading to disruptive NE anchoring of chromosome-induced meiotic arrest in both sexes"
      explanation: Patient-variant study linking loss of KASH5 nuclear envelope distribution to failed chromosome anchoring at the envelope.
  evidence:
  - reference: PMID:36864840
    reference_title: "A homozygous KASH5 frameshift mutation causes diminished ovarian reserve, recurrent miscarriage, and non-obstructive azoospermia in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation leads to the absence of KASH5 protein expression in testes and non-obstructive azoospermia (NOA) due to meiotic arrest before the pachytene stage in the affected brother."
    explanation: KASH5 protein is absent from the testis of a man homozygous for a frameshift.
  - reference: PMID:35587281
    reference_title: "Homozygous missense mutation in CCDC155 disrupts the transmembrane distribution of CCDC155 and SUN1, resulting in non-obstructive azoospermia and premature ovarian insufficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This rare missense mutation with lesions in the conserved CC domain of CCDC155 blocked nuclear envelope (NE) distribution and subsequently prevented NE-specific enrichment of Sad1- and UNC84-domain-containing 1 either ex vivo or in vitro"
    explanation: The patient missense variant keeps KASH5, and secondarily SUN1, out of the nuclear envelope.
  - reference: PMID:33980926
    reference_title: "A human infertility-associated KASH5 variant promotes mitochondrial localization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that the L535Q substitution perturbs KASH5 localization to the ER and ONM and instead results in mistargeting to the mitochondria membrane"
    explanation: Cell-based study of the azoospermia-associated transmembrane variant.
  - reference: PMID:35708642
    reference_title: "Homozygous Variant in KASH5 Causes Premature Ovarian Insufficiency by Disordered Meiotic Homologous Pairing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro studies found the variant disturbed the nuclear membrane localization of KASH5 and its binding with SUN1."
    explanation: >-
      A splice-site variant found in women with ovarian insufficiency
      impairs the same nuclear membrane localization and SUN1 binding; cited
      for the molecular lesion, not for the female phenotype.
  - reference: PMID:42443317
    reference_title: "Novel variants in LINC and TTM complexes of meiotic chromosome dynamics are associated with meiotic arrest and non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Minigene assays demonstrated that the splice-site variants in KASH5 (c.149-1G>A; c.876+1G>A), TERB2 (c.522A>G), and MAJIN (c.219+1G>T) induced aberrant exon-skipping events."
    explanation: Minigene assays show both splice-site alleles of a compound heterozygous NOA patient disrupt KASH5 splicing.
- name: Uncoupling of Meiotic Telomeres from Cytoplasmic Dynein
  description: >-
    In meiotic prophase I, telomeres attach to the inner nuclear membrane
    through SUN1, and KASH5 links SUN1 across the envelope to cytoplasmic
    dynein, for which it is an activating adaptor; KASH5 also binds the
    kinesin KIF5B. In Kash5-null mouse spermatocytes telomeres still attach
    to the envelope, but they are no longer coupled to the microtubule
    motors that move them and cluster them into the meiotic bouquet.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Primary spermatocyte
    term:
      id: CL:0000656
      label: primary spermatocyte
  biological_processes:
  - preferred_term: Meiotic telomere clustering
    term:
      id: GO:0045141
      label: meiotic telomere clustering
    modifier: DECREASED
  molecular_functions:
  - preferred_term: Dynein complex binding
    term:
      id: GO:0070840
      label: dynein complex binding
    modifier: DECREASED
  downstream:
  - target: Failed Homologous Chromosome Pairing and Synapsis
    causal_link_type: DIRECT
    description: Telomere-led movement is what brings homologs together, so its loss leaves homologs unpaired.
    evidence:
    - reference: PMID:24062341
      reference_title: "A mammalian KASH domain protein coupling meiotic chromosomes to the cytoskeleton."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings demonstrate that telomere attachment to the NE is insufficient to promote pairing and that telomere attachment sites must be coupled to cytoplasmic dynein and the microtubule system to ensure meiotic progression."
      explanation: The Kash5 knockout separates telomere attachment from telomere movement and shows movement is needed for pairing.
  evidence:
  - reference: PMID:22826121
    reference_title: "A conserved KASH domain protein associates with telomeres, SUN1, and dynactin during mammalian meiosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results suggest that KASH5 connects the telomere-associated SUN1 protein to the cytoplasmic force-generating mechanism involved in meiotic chromosome movement."
    explanation: Mouse spermatocyte study placing KASH5 between SUN1-bound telomeres and the cytoplasmic motor.
  - reference: PMID:35703493
    reference_title: "The KASH5 protein involved in meiotic chromosomal movements is a novel dynein activating adaptor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the meiosis-specific nuclear-envelope protein KASH5 is a dynein activating adaptor: KASH5 directly binds dynein using a mechanism conserved among activating adaptors and converts dynein into a processive motor."
    explanation: Reconstitution shows KASH5 activates dynein motility.
  - reference: PMID:36946995
    reference_title: "The meiotic LINC complex component KASH5 is an activating adaptor for cytoplasmic dynein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Altogether, we show that the transmembrane protein KASH5 is an activating adaptor for dynein and shed light on the hierarchy of assembly of KASH5-dynein-dynactin complexes."
    explanation: Independent confirmation of the dynein adaptor function.
  - reference: PMID:40501626
    reference_title: "Kinesin drive meiotic chromosome dynamics via interaction with the KASH5-LINC complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Altogether, our findings identify kinesins, particularly KIF5B, as a previously unrecognized component of the force-generating machinery that drives chromosome movement during meiotic prophase I, acting through KASH5 as a specific nuclear membrane adaptor."
    explanation: Mouse spermatocyte and recombinant-protein study adding kinesin to the motors coupled through KASH5.
- name: Failed Homologous Chromosome Pairing and Synapsis
  description: >-
    Homologous chromosomes do not pair, and the synaptonemal complex does
    not form along full-length homologs. A proband with two rare KASH5
    variants arrested at a zygotene-like stage with deficient pairing and
    synapsis, and Kash5-null mouse spermatocytes never show fully synapsed
    homologs.
  biological_scale: CELLULAR
  conforms_to: "meiotic_prophase_failure#Meiotic Prophase I Entry and Homolog Pairing"
  cell_types:

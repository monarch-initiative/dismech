- name: Persistent Unrepaired Meiotic DNA Double-Strand Breaks
  description: >-
    Programmed meiotic DNA double-strand breaks are made but not resolved.
    Spermatocytes of a homozygous missense patient failed to complete meiosis
    with unresolved break repair, and Kash5-null spermatocytes accumulate
    breaks that are never repaired.

name: Autosomal Recessive Nonsyndromic Hearing Loss 59
creation_date: "2026-11-15T22:39:51Z"
category: Mendelian
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 59
  term:
    id: MONDO:0012445
    label: autosomal recessive nonsyndromic hearing loss 59
synonyms:
- DFNB59
- PJVK autosomal recessive nonsyndromic deafness
- autosomal recessive nonsyndromic deafness caused by mutation in PJVK
- deafness, autosomal recessive 59
description: >-
  Autosomal recessive nonsyndromic sensorineural hearing loss caused by biallelic
  pathogenic variants in PJVK, which encodes pejvakin, a gasdermin-family protein.
  The phenotype is heterogeneous. The first two missense alleles were found in
  families with auditory neuropathy, in which abnormal auditory brainstem
  responses point to a neural defect, while most other alleles cause hearing loss
  of cochlear origin. Severity, onset and course vary: three Spanish cases have
  stable, severe to profound loss, a Chinese family has prelingual onset, and a
  Pakistani family has progressive loss. In mice,
  pejvakin is associated with peroxisomes and is needed for their noise-induced
  proliferation and for pexophagy, so pejvakin-deficient hair cells and auditory
  neurons are hypervulnerable to sound and develop oxidative stress. Pejvakin also
  sits at stereociliary rootlets with TRIOBP and maintains hair-bundle
  architecture. Whether the neural phenotype reflects a requirement for pejvakin
  in neurons is unresolved: hair-cell-specific deletion reproduces the deafness in
  mice, while neuron-specific deletion does not. DFNB59 is a rare cause of
  recessive nonsyndromic hearing loss, and two reported patients had apparent good
  outcomes after unilateral cochlear implantation.
parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
- Hereditary Hearing Loss

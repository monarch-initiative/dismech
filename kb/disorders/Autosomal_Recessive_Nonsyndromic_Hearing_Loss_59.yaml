  - reference: PMID:30936319
    reference_title: "Pejvakin-mediated pexophagy protects auditory hair cells against noise-induced damage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "They suggest that pejvakin acts as a redox-activated pexophagy receptor/adaptor, thereby identifying a previously unknown function of gasdermin family proteins."
    explanation: >-
      The authors propose that pejvakin is a redox-activated pexophagy
      receptor or adaptor, the activity bound on this node.
- name: Impaired Noise-Induced Peroxisome Proliferation and Pexophagy
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Pejvakin is associated with peroxisomes. In wild-type mice, noise rapidly
    raises cochlear Pjvk transcription, triggers peroxisome proliferation in
    hair cells and primary auditory neurons, and induces selective autophagic
    degradation of peroxisomes (pexophagy) in hair cells. In pejvakin-deficient
    mice, noise does not induce pexophagy and peroxisomes fail to proliferate.
  cell_types:
  - preferred_term: auditory hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  biological_processes:
  - preferred_term: pexophagy
    modifier: DECREASED
    term:
      id: GO:0000425
      label: pexophagy
  - preferred_term: peroxisome proliferation
    modifier: DECREASED
    term:
      id: GO:0016559
      label: peroxisome fission
  downstream:
  - target: Cochlear Oxidative Stress and Sound Hypervulnerability
    description: >-
      Adaptive peroxisome proliferation is the cochlea's antioxidant response to
      noise, so its failure leaves noise-induced oxidative stress unchecked.
    evidence:
    - reference: PMID:26544938
      reference_title: "Hypervulnerability to Sound Exposure through Impaired Adaptive Proliferation of Peroxisomes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results reveal that the antioxidant activity of peroxisomes protects the auditory system against noise-induced damage."
      explanation: Peroxisomal antioxidant activity protects the auditory system against noise.
    - reference: PMID:30936319
      reference_title: "Pejvakin-mediated pexophagy protects auditory hair cells against noise-induced damage."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Overall, our results demonstrate that pexophagy plays a key role in noise-induced peroxisome proliferation and identify defective pexophagy as a cause of noise-induced hearing loss."
      explanation: Defective pexophagy causes noise-induced hearing loss in mice.
  evidence:
  - reference: PMID:26544938
    reference_title: "Hypervulnerability to Sound Exposure through Impaired Adaptive Proliferation of Peroxisomes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Subcellular analysis revealed that pejvakin is associated with peroxisomes and required for their oxidative-stress-induced proliferation."
    explanation: Pejvakin is required for oxidative-stress-induced peroxisome proliferation.
  - reference: PMID:26544938
    reference_title: "Hypervulnerability to Sound Exposure through Impaired Adaptive Proliferation of Peroxisomes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Noise exposure rapidly upregulates Pjvk cochlear transcription in wild-type mice and triggers peroxisome proliferation in hair cells and primary auditory neurons."
    explanation: Noise normally induces pejvakin and peroxisome proliferation in hair cells and neurons.
  - reference: PMID:30936319
    reference_title: "Pejvakin-mediated pexophagy protects auditory hair cells against noise-induced damage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that sound overstimulation induces an early and rapid selective autophagic degradation of peroxisomes (pexophagy) in auditory hair cells from wild-type, but not pejvakin-deficient (Pjvk-/-), mice."
    explanation: Sound-induced pexophagy fails in pejvakin-deficient hair cells.
- name: Cochlear Oxidative Stress and Sound Hypervulnerability
  role: effector
  biological_scale: CELLULAR
  conforms_to: "sensorineural_hair_cell_loss#Cochlear Ionic Homeostasis Disruption and Oxidative Stress"
  description: >-
    Pejvakin-deficient cochleas show marked oxidative stress and impaired
    antioxidant defences, and their hair-cell peroxisomes become structurally
    abnormal after the onset of hearing. Hair cells and auditory pathway neurons
    of pejvakin-deficient mice and of patients are exceptionally vulnerable to
    sound. Pejvakin-deficient mice have variable auditory phenotypes, and their
    hearing thresholds correlated with the number of pups per cage, suggesting
    that even pup vocalizations may be harmful. The process is bound as
    response to oxidative stress with a DECREASED modifier because the lesion
    is the failed antioxidant response; it is the oxidative stress itself that
    increases.
  cell_types:
  - preferred_term: auditory hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  biological_processes:
  - preferred_term: antioxidant defence
    modifier: DECREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  downstream:
  - target: Outer Hair Cell Dysfunction and Degeneration
    description: >-
      Sound exposure damages the vulnerable hair cells.
    evidence:

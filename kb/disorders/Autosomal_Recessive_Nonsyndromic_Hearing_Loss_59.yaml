- name: Disrupted Stereocilia Architecture and Mechanotransduction
  role: effector
  biological_scale: CELLULAR
  description: >-
    Pejvakin-deficient hair cells form normal stereociliary rootlets, but before
    the onset of hearing their hair bundles lose some mechanotransducing
    shorter-row stereocilia, the remaining stereocilia have overextended tips and
    vary more in height and width, and mechanotransduction is affected.
  cell_types:
  - preferred_term: auditory hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  biological_processes:
  - preferred_term: auditory receptor cell stereocilium organization
    modifier: ABNORMAL
    term:
      id: GO:0060088
      label: auditory receptor cell stereocilium organization
  downstream:
  - target: Outer Hair Cell Dysfunction and Degeneration
    description: >-
      The stereocilia defect is cell-autonomous and critical for hair cell
      function.
    evidence:
    - reference: PMID:28209736
      reference_title: "Pejvakin, a Candidate Stereociliary Rootlet Protein, Regulates Hair Cell Function in a Cell-Autonomous Manner."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Unlike previous studies of Pjvk alleles with neuronal dysfunction, our findings reveal a cell-autonomous role of pejvakin in maintaining stereocilia architecture that is critical for hair cell function."
      explanation: Maintaining stereocilia architecture is the hair-cell-autonomous role of pejvakin.
  - target: Prelingual sensorineural hearing impairment
    description: >-
      In mice the hair-bundle defect is already present before the onset of
      hearing, a developmental origin consistent with hearing loss that
      precedes speech acquisition.
    evidence:
    - reference: PMID:28209736
      reference_title: "Pejvakin, a Candidate Stereociliary Rootlet Protein, Regulates Hair Cell Function in a Cell-Autonomous Manner."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Hair cells of pejvakin-deficient mice develop normal rootlets, but hair bundle morphology and mechanotransduction are affected before the onset of hearing."
      explanation: >-
        The defect predates hearing onset in mice. INDIRECT for human
        prelingual onset because the timing is inferred from a mouse model.
  evidence:
  - reference: PMID:28209736
    reference_title: "Pejvakin, a Candidate Stereociliary Rootlet Protein, Regulates Hair Cell Function in a Cell-Autonomous Manner."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Hair cells of pejvakin-deficient mice develop normal rootlets, but hair bundle morphology and mechanotransduction are affected before the onset of hearing."
    explanation: Hair bundle structure and mechanotransduction are abnormal before hearing onset.
  - reference: PMID:28209736
    reference_title: "Pejvakin, a Candidate Stereociliary Rootlet Protein, Regulates Hair Cell Function in a Cell-Autonomous Manner."
    supports: SUPPORT

    snippet: "Some mechanotransducing shorter row stereocilia are missing, whereas the remaining ones exhibit overextended tips and a greater variability in height and width."
    explanation: Describes the stereocilia defects in pejvakin-deficient hair cells.
- name: Outer Hair Cell Dysfunction and Degeneration
  role: effector
  biological_scale: CELLULAR
  description: >-
    In mice, pejvakin is needed in hair cells, and in outer hair cells
    specifically, for normal hearing. Deleting Pjvk in all hair cells or only in
    outer hair cells causes early-onset profound hearing loss, and deleting it
    in adult outer hair cells causes slowly progressive hearing loss with outer
    hair cell degeneration followed by inner hair cell loss. Pejvakin's
    C-terminal domain binds ROCK2 and IQGAP1, which points to a role in Rho
    signalling.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  locations:
  - preferred_term: organ of Corti
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  downstream:
  - target: Sensorineural hearing impairment
    description: >-
      Hair cell loss produces hearing loss of cochlear origin.
    evidence:
    - reference: PMID:28209736
      reference_title: "Pejvakin, a Candidate Stereociliary Rootlet Protein, Regulates Hair Cell Function in a Cell-Autonomous Manner."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we demonstrate that loss of pejvakin in hair cells, but not in neurons, causes profound hearing loss and outer hair cell degeneration in mice."
      explanation: >-
        Hair-cell loss of pejvakin causes profound hearing loss in mice.
        INDIRECT for the human phenotype because it is a mouse model.
  - target: Progressive sensorineural hearing impairment
    description: >-
      Pejvakin loss in mature outer hair cells gives slowly progressive loss.
    evidence:
    - reference: PMID:28089576
      reference_title: "Conditional deletion of pejvakin in adult outer hair cells causes progressive hearing loss in mice."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "By contrast, loss of Pjvk in adult OHCs causes a slowly progressive hearing loss associated with OHC degeneration and delayed loss of inner hair cells (IHCs), indicating a primary role for pejvakin in regulating OHC function and survival."
      explanation: >-
        Adult outer-hair-cell deletion causes progressive hearing loss in mice.
        INDIRECT for the human phenotype because it is a mouse model.
  evidence:
  - reference: PMID:28089576
    reference_title: "Conditional deletion of pejvakin in adult outer hair cells causes progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we demonstrate that mice with conditional ablation of the Pjvk gene in all sensory hair cells or only in outer hair cells (OHCs) show similar auditory phenotypes with early-onset profound hearing loss."
    explanation: Outer hair cell deletion alone reproduces the profound hearing loss.
  - reference: PMID:28089576
    reference_title: "Conditional deletion of pejvakin in adult outer hair cells causes progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that pejvakin is required to sustain OHC activity and survival in a cell-autonomous manner likely involving regulation of Rho signaling."
    explanation: Pejvakin sustains outer hair cell survival, likely through Rho signalling.
  - reference: PMID:28089576
    reference_title: "Conditional deletion of pejvakin in adult outer hair cells causes progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using the C-terminal domain of pejvakin as bait, we identified in a cochlear cDNA library ROCK2, an effector for the small GTPase Rho, and the scaffold protein IQGAP1, involved in modulating actin dynamics."
    explanation: >-
      An interaction screen with pejvakin's C-terminal domain identifies the Rho

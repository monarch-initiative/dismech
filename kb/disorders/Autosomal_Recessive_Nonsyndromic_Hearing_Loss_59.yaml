    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The numbers of reported cases and pathogenic variants are still small to establish accurate genotype-phenotype correlations."
    explanation: Few DFNB59 cases and variants have been reported.
  - reference: PMID:25631766
    reference_title: "Identification of a novel mutation of PJVK in the Chinese non-syndromic hearing loss population with low prevalence of the PJVK mutations."
    supports: SUPPORT

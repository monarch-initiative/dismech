pathophysiology:
- name: Biallelic PJVK Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Biallelic germline PJVK variants, missense and frameshift, remove pejvakin
    function. Pejvakin is a 352-residue gasdermin-family protein, a paralog of
    DFNA5. It binds LC3B through an LC3-interacting region and is proposed to
    act as a redox-activated receptor for pexophagy; its two C-terminal
    cysteines, C328 and C343, are needed for the LC3B interaction and for
    pexophagy. The patient variant p.C343S replaces one of them.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline PJVK variants, including the missense alleles p.R183W
      and p.C343S and the frameshift allele p.C312Wfs*19.
  genes:
  - preferred_term: PJVK
    term:
      id: hgnc:29502
      label: PJVK
  molecular_functions:
  - preferred_term: autophagy cargo adaptor activity
    modifier: DECREASED
    term:
      id: GO:0160247
      label: autophagy cargo adaptor activity
  downstream:
  - target: Impaired Noise-Induced Peroxisome Proliferation and Pexophagy
    description: >-
      Without pejvakin, noise does not recruit LC3B to peroxisomes, so the
      selective degradation and renewal of peroxisomes fails.
    evidence:
    - reference: PMID:30936319
      reference_title: "Pejvakin-mediated pexophagy protects auditory hair cells against noise-induced damage."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Noise overexposure triggers recruitment of the autophagosome-associated protein MAP1LC3B (LC3B; microtubule-associated protein 1 light chain 3β) to peroxisomes in wild-type, but not Pjvk-/-, mice."
      explanation: Pejvakin loss abolishes noise-induced LC3B recruitment to peroxisomes in mice.
  - target: Disrupted Stereocilia Architecture and Mechanotransduction
    description: >-
      Pejvakin binds the rootlet protein TRIOBP at the base of stereocilia, and
      deafness-associated variants disrupt that localization.
    evidence:
    - reference: PMID:28209736
      reference_title: "Pejvakin, a Candidate Stereociliary Rootlet Protein, Regulates Hair Cell Function in a Cell-Autonomous Manner."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Pejvakin binds to and colocalizes with the rootlet component TRIOBP at the base of stereocilia in injectoporated hair cells, a pattern that is disrupted by deafness-associated PJVK mutations."
      explanation: Patient variants disrupt pejvakin's rootlet localization in injectoporated hair cells.
  - target: Auditory Pathway Neuronal Dysfunction
    description: >-
      A knock-in of the patient R183W allele gives a neuronal electrophysiology
      phenotype, but neuron-specific deletion in another mouse study left
      hearing intact, so a direct neuronal requirement is contested.
    evidence:
    - reference: PMID:16804542
      reference_title: "Mutations in the gene encoding pejvakin, a newly identified protein of the afferent auditory pathway, cause DFNB59 auditory neuropathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, Dfnb59 knock-in mice, homozygous for the R183W variant identified in one DFNB59 family, show abnormal auditory brainstem responses indicative of neuronal dysfunction along the auditory pathway."
      explanation: >-
        Mice carrying the patient R183W allele show brainstem-response
        abnormalities read as neuronal dysfunction. INDIRECT because it is a
        mouse model.
    - reference: PMID:28209736
      reference_title: "Pejvakin, a Candidate Stereociliary Rootlet Protein, Regulates Hair Cell Function in a Cell-Autonomous Manner."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast to recent studies, we demonstrate that pejvakin in auditory neurons is not essential for normal hearing in mice."
      explanation: Neuron-specific loss of pejvakin does not impair hearing in this mouse study.
  evidence:
  - reference: PMID:16804542
    reference_title: "Mutations in the gene encoding pejvakin, a newly identified protein of the afferent auditory pathway, cause DFNB59 auditory neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report on DFNB59, a newly identified gene on chromosome 2q31.1-q31.3 mutated in four families segregating autosomal recessive auditory neuropathy."
    explanation: PJVK mutations in the discovery families establish the causal lesion.
  - reference: PMID:16804542
    reference_title: "Mutations in the gene encoding pejvakin, a newly identified protein of the afferent auditory pathway, cause DFNB59 auditory neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pejvakin is a paralog of DFNA5, a protein of unknown function also involved in deafness."
    explanation: Places pejvakin in the DFNA5 (gasdermin) family.
  - reference: PMID:30936319
    reference_title: "Pejvakin-mediated pexophagy protects auditory hair cells against noise-induced damage."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also show that pejvakin-LC3B binding involves an LC3-interacting region within the predicted chaperone domain of pejvakin."
    explanation: Pejvakin binds the autophagosome protein LC3B, the adaptor activity bound on this node.
  - reference: PMID:30936319

- name: Auditory Pathway Neuronal Dysfunction
  role: effector
  biological_scale: CELLULAR
  description: >-
    Pejvakin is expressed in the cell bodies of neurons along the afferent
    auditory pathway, including all spiral ganglion neurons of the human
    cochlea, where it is also found in nuclei. The first DFNB59 families had
    auditory neuropathy, and mice homozygous for the patient R183W variant have
    abnormal auditory brainstem responses. Whether pejvakin is required in
    neurons is contested, because neuron-specific deletion did not impair
    hearing in another mouse study.
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  locations:
  - preferred_term: spiral ganglion
    term:
      id: UBERON:0000395
      label: cochlear ganglion
  downstream:

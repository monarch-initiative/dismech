environmental:
- name: Sound exposure
  description: >-
    Sound damages the auditory system of pejvakin-deficient mice and patients
    far more than normal. Noise normally induces pejvakin and the peroxisome
    proliferation and pexophagy it mediates, so without pejvakin the oxidative
    stress that sound causes goes unbuffered. Pejvakin-deficient mice have
    variable hearing thresholds that correlated with the number of pups per
    cage, suggesting that even everyday sound such as pup vocalizations may be
    harmful.
  exposure_term:
    preferred_term: sound exposure
    term:
      id: ECTO:8000044
      label: exposure to sound radiation
  evidence:
  - reference: PMID:26544938
    reference_title: "Hypervulnerability to Sound Exposure through Impaired Adaptive Proliferation of Peroxisomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sound or electrical stimulation show that the cochlear sensory hair cells and auditory pathway neurons of Pjvk(-/-) mice and patients are exceptionally vulnerable to sound."
    explanation: >-
      Hair cells and auditory neurons of pejvakin-deficient mice and patients
      are exceptionally vulnerable to sound. The sentence reports both mice and
      patients.
  - reference: PMID:26544938
    reference_title: "Hypervulnerability to Sound Exposure through Impaired Adaptive Proliferation of Peroxisomes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Noise exposure rapidly upregulates Pjvk cochlear transcription in wild-type mice and triggers peroxisome proliferation in hair cells and primary auditory neurons."
    explanation: Noise normally induces pejvakin and the peroxisome response it mediates.
  influences_mechanisms:
  - target: Cochlear Oxidative Stress and Sound Hypervulnerability
    environmental_effect: EXACERBATES
    description: >-
      Sound exposure drives oxidative stress that pejvakin-deficient cochleas
      cannot buffer, worsening hair cell and auditory neuron damage.
    evidence:
    - reference: PMID:26544938
      reference_title: "Hypervulnerability to Sound Exposure through Impaired Adaptive Proliferation of Peroxisomes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Direct sound or electrical stimulation show that the cochlear sensory hair cells and auditory pathway neurons of Pjvk(-/-) mice and patients are exceptionally vulnerable to sound."
      explanation: >-
        Sound harms the pejvakin-deficient auditory system. The sentence reports
        both mice and patients.
    - reference: PMID:26544938
      reference_title: "Hypervulnerability to Sound Exposure through Impaired Adaptive Proliferation of Peroxisomes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Correlation between their hearing thresholds and the number of pups per cage suggest a possible harmful effect of pup vocalizations."
      explanation: Even everyday cage sound appears to worsen hearing in pejvakin-deficient mice.
    - reference: PMID:30936319
      reference_title: "Pejvakin-mediated pexophagy protects auditory hair cells against noise-induced damage."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Overall, our results demonstrate that pexophagy plays a key role in noise-induced peroxisome proliferation and identify defective pexophagy as a cause of noise-induced hearing loss."
      explanation: Defective pejvakin-mediated pexophagy makes noise cause hearing loss in mice.

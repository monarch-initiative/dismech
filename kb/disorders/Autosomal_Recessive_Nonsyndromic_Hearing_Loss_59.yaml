      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "Auditory neuropathy is a particular type of hearing impairment in which neural transmission of the auditory signal is impaired, while cochlear outer hair cells remain functional."
      explanation: Defines auditory neuropathy as impaired neural transmission with functional outer hair cells.
  evidence:

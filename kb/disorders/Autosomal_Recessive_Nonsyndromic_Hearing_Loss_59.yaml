discussions:
- discussion_id: dfnb59_neuronal_versus_hair_cell_requirement
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Auditory Pathway Neuronal Dysfunction
  - phenotypes#Auditory neuropathy spectrum disorder
  prompt: >-
    Do the auditory neuropathy findings in some DFNB59 patients reflect a
    requirement for pejvakin in auditory neurons, when hair-cell-specific
    deletion reproduces the deafness in mice and neuron-specific deletion does
    not?
  rationale: >-
    The first DFNB59 families had auditory neuropathy, pejvakin is expressed in
    human spiral ganglion neurons, and the R183W knock-in mouse shows abnormal
    brainstem responses consistent with neuronal dysfunction. Conditional
    deletion in mice instead places the requirement in hair cells, and most
    PJVK alleles cause hearing loss of cochlear origin. The answer bears on
    predicting cochlear implant benefit, since an implant bypasses hair cells
    but not a neuronal lesion.
  evidence:
  - reference: PMID:28209736
    reference_title: "Pejvakin, a Candidate Stereociliary Rootlet Protein, Regulates Hair Cell Function in a Cell-Autonomous Manner."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Unlike previous studies of Pjvk alleles with neuronal dysfunction, our findings reveal a cell-autonomous role of pejvakin in maintaining stereocilia architecture that is critical for hair cell function."
    explanation: Mouse studies disagree on whether the pejvakin defect is neuronal or hair-cell-autonomous.
  - reference: PMID:32917362
    reference_title: "Generation and pathological characterization of a transgenic mouse model carrying a missense PJVK mutation."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Previous clinical studies have revealed that PJVK mutations might be associated with a wide spectrum of auditory manifestations, ranging from hearing loss of pure cochlear origin to that involving the retrocochlear central auditory pathway."
    explanation: The human phenotype spans cochlear and retrocochlear hearing loss.
notes: >-
  The only GeneReviews chapter covering PJVK is the Genetic Hearing Loss Overview
  (PMID:20301607), an Overview-format chapter whose cached abstract is a statement
  of purpose with no clinical characteristics, so it is not used as a phenotype
  baseline; the phenotypes come from the family and cohort reports cited here.
  DFNB59 is curated as its own entry rather than as a subtype of
  Auditory_Neuropathy because most PJVK alleles cause hearing loss of cochlear
  origin and the curated mechanism lies mainly in hair cells (peroxisomal
  antioxidant defence and stereocilia maintenance) rather than at the synapse.

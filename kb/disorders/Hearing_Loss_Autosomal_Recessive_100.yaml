inheritance:
- name: Autosomal recessive
  description: >-
    Both reported families are consanguineous Pakistani kindreds in which affected
    individuals are homozygous for PPIP5K2 c.2510G>A and unaffected relatives are
    not. Penetrance and expressivity are recorded as UNKNOWN rather than COMPLETE
    and CONSISTENT: only two families and a single allele have been described, which
    is too little to support a quantitative statement either way. Worth noting for
    counselling is that human heterozygotes are unaffected, whereas heterozygous
    Ppip5k2 gene-trap mice show a measurable high-frequency threshold shift and
    basal-turn outer hair cell loss - so the mouse allele behaves semi-dominantly
    while the human allele does not.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  expressivity: UNKNOWN
  evidence:
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome enrichment followed by massive parallel sequencing revealed a c.2510G>A transition variant in PPIP5K2 that segregated with DFNB100-associated hearing loss in two large apparently unrelated Pakistani families."
    explanation: >-
      Records segregation of a single homozygous allele with hearing loss in two
      consanguineous families, the basis for the recessive assignment.
genetic:
- name: PPIP5K2
  gene_term:
    preferred_term: PPIP5K2
    term:
      id: hgnc:29035
      label: PPIP5K2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PPIP5K2 (diphosphoinositol pentakisphosphate kinase 2, 5q21.1) encodes a large
    bifunctional enzyme with an N-terminal kinase domain, a histidine acid
    phosphatase domain, and an intrinsically disordered region. Despite the
    phosphatase-family fold it is the kinase activity that defines the protein's
    role, synthesising InsP8 from 5-InsP7. Humans carry a paralogue, PPIP5K1, but
    in mouse inner ear Ppip5k1 transcript levels in hair cells, supporting cells and
    ganglion neurons are up to 100-fold below Ppip5k2, which is why loss of PPIP5K2
    function is not buffered in the cochlea. The gene also carries the aliases
    HISPPD1, VIP2, IP7K2 and CFAP160; the last is a cilia-and-flagella designation
    and is not the basis of the hearing phenotype described here.
  variants:
  - name: PPIP5K2 c.2510G>A p.(Arg837His)
    description: >-
      The only PPIP5K2 allele so far associated with human disease. It substitutes an
      arginine conserved from Drosophila to human, nine residues C-terminal to the
      histidine that is catalytically essential for IP8 phosphatase activity in the
      yeast orthologue, and it is present in all eleven annotated PPIP5K2 splice
      isoforms. It was absent from 180 ethnically matched Pakistani controls and sits
      at 0.000146 in ExAC. A shared flanking haplotype in the two families indicates a
      founder allele rather than two independent mutational events.
    gene:
      preferred_term: PPIP5K2
      term:
        id: hgnc:29035
        label: PPIP5K2
    evidence:
    - reference: PMID:29590114
      reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "SNPs linked to PPIP5K2 were genotyped in affected individuals of the PKDF041 and PKDF751 families, and the flanking haplotype was consistent with a founder effect for c.2510G>A variant (S3 Table)."
      explanation: >-
        Establishes that the two families share a founder allele, which is why the
        entry describes a single allele rather than allelic heterogeneity.
    - reference: PMID:29590114
      reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We did not detect this variant in 180 ethnically-matched Pakistani control samples"
      explanation: >-
        Population control data supporting pathogenicity of the allele in these families.
  evidence:
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a severe-to-profound sensorineural hearing loss locus, DFNB100 on chromosome 5q13.2-q23.2."
    explanation: >-
      Names the DFNB100 locus that PPIP5K2 was subsequently identified within.
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Yet surprisingly, as far as we are aware, our work provides the first description of any amino acid variant in either PPIP5K1 or PPIP5K2 that is both functionally-significant and associates with a human disorder."
    explanation: >-
      The authors' own statement that no PPIP5K1 or PPIP5K2 variant had previously
      been tied to human disease. Graded OTHER because it is a claim about the state
      of the literature rather than a result from a study design.
pathophysiology:
- name: PPIP5K2 Arg837His Catalytic Imbalance
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The Arg837His substitution lies in the histidine acid phosphatase domain of
    PPIP5K2, whose kinase and phosphatase activities compete to set the 5-InsP7/InsP8
    balance. Purified recombinant PPIP5K2-R837H has 21% lower IP8 phosphatase activity
    than wild type and, rather than being self-correcting, accumulates 60% more IP8 in
    the kinase assay. The two arms therefore act in the same direction, and the authors
    attribute the disproportionate kinase effect to altered conformational coupling
    between the domains.
  molecular_functions:
  - preferred_term: PPIP5K2 IP8 phosphatase activity
    term:
      id: GO:0008486
      label: diphosphoinositol-polyphosphate diphosphatase activity
    modifier: DECREASED
  - preferred_term: PPIP5K2 5-InsP7 kinase activity
    term:
      id: GO:0000829
      label: diphosphoinositol pentakisphosphate kinase activity
    modifier: INCREASED
  genetic_context:
    gene:
      preferred_term: PPIP5K2
      term:
        id: hgnc:29035
        label: PPIP5K2
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: HYPERMORPHIC
    description: >-
      Recorded as HYPERMORPHIC on the net enzymatic output, because the allele raises
      production of the InsP8 signal. This is a judgement over a bifunctional enzyme
      and is worth stating explicitly: the phosphatase arm is partially lost while the
      kinase arm is gained, so neither PARTIAL_LOSS_OF_FUNCTION nor a plain
      GAIN_OF_FUNCTION describes the allele on its own, and the single-valued slot
      forces a choice. The paper's own framing is the increase - it calls the
      equivalent mouse allele a hyper kinase.
  downstream:
  - target: Increased Metabolic Flux from 5-InsP7 to InsP8
    causal_link_type: DIRECT
    description: >-
      Reduced dephosphorylation combined with increased phosphorylation shifts the
      steady state of the interconversion toward InsP8.
  evidence:
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The IP8 phosphatase activity of the PPIP5K2R837H protein was reduced by 21% (*p< 0.05) as compared to the WT protein (Fig 2E)."
    explanation: >-
      Direct enzymatic measurement of the phosphatase arm, on FLAG-tagged protein
      immunopurified from HEK293 cells.
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Assays that used PPIP5K2R837H accumulated 60% higher levels of IP8 compared to assays that contained WT protein (Fig 2F)."
    explanation: >-
      Direct enzymatic measurement of the kinase arm in the same system, showing the
      two arms act in the same direction rather than cancelling.
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To the best of our knowledge, this is the first study demonstrating the necessity of PP-IP metabolism for inner ear development and hearing function."
    explanation: >-
      Supports the entry's framing that inositol pyrophosphate metabolism is a mechanism
      class newly implicated in hearing, rather than a restatement of a known cochlear
      pathway. Graded OTHER because it is a novelty claim about the literature, not a
      result of the study's own design.
- name: Increased Metabolic Flux from 5-InsP7 to InsP8
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    The catalytic imbalance is expected to raise cellular InsP8 relative to 5-InsP7.
    This is the step the founding study could measure only indirectly: PP-IP levels in
    the inner ear are at sub- to low-micromolar concentrations and were not assayed in
    vivo, so the flux claim rests on radiolabelled HEK293 cells lacking both PPIP5Ks
    and on the enzymology above.
  biological_processes:
  - preferred_term: inositol pyrophosphate (PP-IP) turnover
    term:
      id: GO:0071543
      label: diphosphoinositol polyphosphate metabolic process
    modifier: DYSREGULATED
  chemical_entities:
  - preferred_term: diphosphoinositol polyphosphate
    term:
      id: CHEBI:64604
      label: diphosphoinositol polyphosphate
    modifier: INCREASED
  downstream:
  - target: Disrupted Inositol Pyrophosphate Homeostasis in the Cochlear Sensory Epithelium
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      How a raised InsP8 signal is transduced into hair-cell injury is not established;
      the founding report offers pro-apoptotic PP-IP signalling and bioenergetic
      imbalance as competing possibilities without testing either.
  evidence:
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical analyses revealed that, compared to WT human PPIP5K2, the PPIP5K2R837H variant exhibited lower phosphatase activity and higher kinase activity, indicating it promotes increased metabolic flux from 5-IP7 to IP8 in vivo."
    explanation: >-
      The authors' interpretation of their enzymology as a directional flux change. The
      in vivo extension is their inference; the measurements are cell-free and cell-line.
- name: Disrupted Inositol Pyrophosphate Homeostasis in the Cochlear Sensory Epithelium
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "sensorineural_hair_cell_loss#Cochlear Sensory Epithelium Insult"
  description: >-
    PPIP5K2 is the dominant PPIP5K expressed in the organ of Corti, and it is present
    in cochlear and vestibular hair cells, supporting cells, spiral ganglion neurons
    and all three layers of the stria vascularis. Because Ppip5k1 runs up to 100-fold
    lower in these same cells, there is no paralogous buffer, and the cochlear sensory
    epithelium bears a hereditary metabolic lesion from birth. This is the module's
    generic cochlear insult with a PP-IP metabolic defect substituted for the usual
    stereociliary or connexin lesion.
  cell_types:
  - preferred_term: cochlear hair cell
    term:
      id: CL:0000855
      label: sensory hair cell
  biological_processes:
  - preferred_term: sensory perception of sound
    term:
      id: GO:0007605
      label: sensory perception of sound
    modifier: ABNORMAL
  downstream:
  - target: Outer Hair Cell Dysfunction and Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Selective vulnerability of outer hair cells is observed, but why outer rather
      than inner hair cells is unexplained.
  evidence:
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that in mouse inner ear, PPIP5K2 is expressed in the cochlear and vestibular sensory hair cells, supporting cells and spiral ganglion neurons."
    explanation: >-
      Places the enzyme in the cochlear cell types the module's insult node names.
      Mouse immunolocalisation; human inner-ear tissue was not examined.
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Transcriptome analysis indicates that Ppip5k2 is the major Ppip5k gene to be expressed in the mouse cochlear and vestibular sensory hair cells, supporting cells as well as in ganglion neurons, while levels of Ppip5k1 expression in these cells are up to 100-fold lower (gEAR, SHIELD) [28]."
    explanation: >-
      Supports the absence of paralogous redundancy in the cochlea, which is why a
      PPIP5K2 defect is not compensated there.
- name: Outer Hair Cell Dysfunction and Degeneration
  role: effector
  biological_scale: CELLULAR
  description: >-
    Outer hair cells are the cell type that fails. In affected humans this is shown
    functionally: transient evoked otoacoustic emissions are absent, which localises
    the defect to outer hair cells while the middle ear is normal on tympanometry. In
    the Ppip5k2 gene-trap mouse it is shown histologically: outer hair cells are
    significantly reduced in the basal turn at P150 while inner hair cell counts are
    unchanged. No human temporal-bone histology exists, so the cellular lesion in
    humans is inferred from the emissions test.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  downstream:
  - target: Loss of Cochlear Amplification
    causal_link_type: DIRECT
    description: >-
      Outer hair cells generate the cochlear amplifier, so their dysfunction and loss
      removes it.
  evidence:
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Humans who are homozygous for the c.2510G>A variant failed transient evoked otoacoustic emission tests, indicating an outer hair cell functional defect."
    explanation: >-
      The human evidence that the lesion is at the outer hair cell.
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although no difference was observed in the number of IHCs, a statistically significant (p<0.01) reduction in OHCs was observed in the basal turn (Fig 5B)."
    explanation: >-
      The histological counterpart in mouse, and the source of the claim that the loss
      is selective for outer over inner hair cells.
- name: Loss of Cochlear Amplification
  role: consequence
  biological_scale: TISSUE
  description: >-
    Without functioning outer hair cells the cochlea loses its active amplifier, and
    the sensitivity and frequency selectivity it provides. In humans the endpoint is
    prelingual severe-to-profound loss across the audiometric range; in the mouse it
    is a late-onset, progressive, high-frequency threshold elevation with reduced ABR
    wave I amplitude. The two do not match, and the human phenotype is the more severe.
  downstream:
  - target: Prelingual bilateral severe-to-profound sensorineural hearing loss
    causal_link_type: DIRECT
    description: >-
      Loss of cochlear amplification is the proximate cause of the audiometric deficit.
  evidence:
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, these affected individuals (V:2, V:3, V:5) failed a transient evoked otoacoustic emission test, which is indicative of defective outer hair cell function."
    explanation: >-
      Absent evoked emissions are the direct clinical readout of a failed cochlear
      amplifier in these patients.
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice homozygous for a targeted deletion of the Ppip5k2 phosphatase domain exhibit degeneration of cochlear outer hair cells and elevated hearing thresholds."
    explanation: >-
      Links outer hair cell degeneration to a measured threshold elevation, in the
      mouse. Graded MODEL_ORGANISM; the mouse deficit is milder and later than the
      human one, which is recorded as a discussion.
phenotypes:
- category: Clinical
  name: Prelingual bilateral severe-to-profound sensorineural hearing loss
  description: >-
    Present in all affected individuals of both families. Pure-tone air and bone
    conduction audiometry from 250 to 8,000 Hz showed profound bilateral loss; family
    history recorded no hearing from birth. Tympanometry was normal in the three
    affected individuals of PKDF751 who were tested, excluding a conductive component;
    that result is reported in the source but is not separately quotable here, so it is
    carried as description rather than as its own phenotype row.
  phenotype_term:
    preferred_term: Prelingual bilateral severe-to-profound sensorineural hearing loss
    term:
      id: HP:0000399
      label: Prelingual sensorineural hearing impairment
  evidence:
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals of both families have prelingual bilateral severe to profound sensorineural hearing loss (Fig 1C and 1D)."
    explanation: >-
      States the defining phenotype, its laterality, severity and prelingual onset.
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to family history no hearing was noted since birth in all of the affected individuals."
    explanation: >-
      Supports congenital rather than acquired or postlingual onset. This is family
      report, not newborn screening, and is graded accordingly in the notes.
- category: Clinical
  name: Absent transient evoked otoacoustic emissions
  description: >-
    Three affected individuals of family PKDF751 tested at 19, 23 and 26 years failed
    transient evoked otoacoustic emission testing while a normal-hearing relative did
    not, localising the lesion to the outer hair cells rather than the middle ear.
  phenotype_term:
    preferred_term: Absent transient evoked otoacoustic emissions
    term:
      id: HP:6000182
      label: Absent otoacoustic emissions
  diagnostic: true
  evidence:
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, these affected individuals (V:2, V:3, V:5) failed a transient evoked otoacoustic emission test, which is indicative of defective outer hair cell function."
    explanation: >-
      Direct report of the finding in named affected individuals.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Only two consanguineous Pakistani families, PKDF041 and PKDF751, sharing one
    founder allele, have been reported. No population-based prevalence estimate exists
    for DFNB100, and no numeric rate is recorded here because none has been measured.
    The ULTRA_RARE band is a qualitative tier used with CASES_IN_LITERATURE, which is
    permitted precisely because it presupposes no numeric estimate.
  evidence:
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome enrichment followed by massive parallel sequencing revealed a c.2510G>A transition variant in PPIP5K2 that segregated with DFNB100-associated hearing loss in two large apparently unrelated Pakistani families."
    explanation: >-
      Establishes that the reported case material is two families, which is the basis
      for the CASES_IN_LITERATURE measure.
- population: ExAC aggregate exome cohort
  measure_type: CARRIER_FREQUENCY
  rate_per_100000: 14.6
  rate_denominator: POPULATION
  notes: >-
    Allele frequency of c.2510G>A in ExAC was 0.000146, normalised here to 14.6 per
    100,000. This is an allele frequency for one variant in an aggregate exome
    reference set, not a measured carrier rate in any defined population, and it is
    not a disease prevalence. No `prevalence_class` is set because a qualitative tier
    must not be combined with a populated numeric rate.
  evidence:
  - reference: PMID:29590114
    reference_title: "Mutations in Diphosphoinositol-Pentakisphosphate Kinase PPIP5K2 are associated with hearing loss in human and mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the c.2510G>A variant of PPIP5K2 is at a low frequency (0.000146) in the ExAC database"
    explanation: >-
      Source of the frequency figure and of the authors' reading that the allele is not
      a common polymorphism.
diagnosis:

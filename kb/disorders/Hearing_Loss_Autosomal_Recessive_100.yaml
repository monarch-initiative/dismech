name: Hearing Loss Autosomal Recessive 100
category: Mendelian
creation_date: "2026-09-08T00:00:00Z"
synonyms:
- DFNB100
- deafness, autosomal recessive 100
- PPIP5K2-related nonsyndromic hearing loss
description: >-
  DFNB100 is autosomal recessive nonsyndromic sensorineural hearing loss caused by
  biallelic variants in PPIP5K2, which encodes one of the two human diphosphoinositol
  pentakisphosphate kinases. It is defined by a single founder missense allele,
  c.2510G>A p.(Arg837His), homozygous in two large consanguineous Pakistani families
  (PKDF041 and PKDF751) that together delimit the DFNB100 locus on chromosome 5.
  Affected individuals have prelingual, bilateral, severe-to-profound sensorineural
  hearing loss with normal tympanometry, absent transient evoked otoacoustic
  emissions, no overt vestibular dysfunction, and no retinal degeneration.

  The mechanism is what distinguishes this entry from the other numbered DFNB loci.
  PPIP5K2 is a bifunctional enzyme that interconverts the inositol pyrophosphates
  5-InsP7 and InsP8 through mutually competing kinase and phosphatase domains. The
  Arg837His substitution sits in the phosphatase domain, and in vitro it both lowers
  IP8 phosphatase activity and raises 5-IP7 kinase activity, so the net effect is
  increased metabolic flux toward InsP8 rather than a simple loss of enzyme. The
  route to deafness therefore runs through inositol pyrophosphate signalling rather
  than through a structural, gap-junction or ion-transport lesion; the founding report
  presents it as the first demonstration that PP-IP metabolism is required for inner
  ear function at all.

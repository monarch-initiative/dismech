prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Hennekam syndrome is very rare, with CCBE1 accounting for approximately 25%
    of all Hennekam syndrome cases. No population-based rate has been reported;
    the class here reflects the small number of published cases.
  evidence:
  - reference: PMID:24913602
    reference_title: Hennekam syndrome can be caused by FAT4 mutations and be allelic to Van Maldergem syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It can be caused by mutations in CCBE1 which are found in approximately
      25 % of cases.
    explanation: >-
      Quantifies the CCBE1 fraction of Hennekam syndrome cases (~25%); the
      quote does not itself state a population prevalence.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    HKLLS1 can combine disabling lymphedema with intestinal lymphangiectasia,
    protein-losing enteropathy and variable intellectual disability. Severe
    prenatal disease can cause fetal death. Among 13 CCBE1-positive cohort
    members, two needed nocturnal respiratory support and two others died in
    childhood or early adulthood from respiratory problems. These observations
    establish severe respiratory morbidity without a population mortality estimate
    or a specific pulmonary mechanism. Surviving patients may require recurrent
    paracentesis, nutritional therapy and immunoglobulin replacement, with missed
    school and work. Severity and treatment requirements vary; peripheral edema
    and protein loss can improve with dietary management.
  evidence:
  - reference: DOI:10.1159/000342486
    reference_title: Evaluation of Clinical Manifestations in Patients with Severe Lymphedema with and
      without CCBE1 Mutations
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: TwoCCBE1positive cases needed respiratory support at night, and 2 otherCCBE1positive cases
      died in childhood or early adulthood due to respiratory problems.
    explanation: The genotype-stratified cohort directly documents severe respiratory outcomes in
      CCBE1-positive patients, without resolving the individual pulmonary causes.
  - reference: PMID:26686525
    reference_title: A Multiplex Kindred with Hennekam Syndrome due to Homozygosity for a CCBE1 Mutation
      that does not Prevent Protein Expression.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: P2, like his sister, had his childhood and adulthood complicated by relapsing painful
      chylous ascites, frequent peritoneal drainage, and hospital admissions, with missed days from school
      and work.
    explanation: The homozygous CCBE1 siblings document the long-term burden of ascites and its treatment.
  - reference: PMID:30564329
    reference_title: "Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema syndrome-1."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Following fetal demise, dilation and evacuation was performed.
    explanation: This outcome concerns the fourth pregnancy, molecularly confirmed to carry both CCBE1 variants.
progression:
- phase: Prenatal presentation
  age_range: Fetal life
  notes: >-
    In severely affected pregnancies the lymphatic failure is already manifest
    in utero as non-immune hydrops fetalis, cystic hygroma, pleural and
    pericardial effusions and ascites, and may recur across pregnancies in a
    family. Prenatal onset is what brings some families to whole-exome
    sequencing before any postnatal phenotype is available.
  evidence:
  - reference: PMID:30564329
    reference_title: "Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema syndrome-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing (WES) was used to determine the etiology of
      recurrent hydrops fetalis in this case of Hennekam
      lymphangiectasia-lymphedema syndrome-1.
    explanation: >-
      Establishes recurrent prenatal hydrops as a presenting phase of HKLLS1.
- phase: Congenital and infantile lymphedema
  age_range: Birth through infancy
  notes: Edema may be present at birth and involve the limbs, genitalia and face. Intrauterine facial
    edema has been proposed to influence facial development, but facial dysmorphism is not universal in
    molecularly confirmed CCBE1 disease.
  evidence:
  - reference: PMID:30564329
    reference_title: Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema
      syndrome-1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The edema is usually congenital and often progressive, generally including the limbs, genitalia,
      and face.
    explanation: Dates the onset of lymphedema to birth and states its typical distribution.
- phase: Childhood and later course
  age_range: Childhood onward
  notes: 'Persistent enteric protein loss may cause hypoalbuminemia, hypogammaglobulinemia and nutritional
    growth impairment. Growth can improve after puberty, and speech delay can resolve. Seizures reported
    in historical mixed-genotype Hennekam series should not be assigned a frequency in HKLLS1: none occurred
    in the 13 CCBE1-positive patients of the genotype-stratified cohort. There are no validated disease
    stages.'
  evidence:
  - reference: PMID:26686525
    reference_title: A Multiplex Kindred with Hennekam Syndrome due to Homozygosity for a CCBE1 Mutation
      that does not Prevent Protein Expression.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: However, he continued to have growth delay until puberty, after which both height and weight
      normalized for age.
    explanation: Documents catch-up growth rather than inevitable progressive growth failure.
  - reference: DOI:10.1159/000342486
    reference_title: Evaluation of Clinical Manifestations in Patients with Severe Lymphedema with and
      without CCBE1 Mutations
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Seizures did not occur in the group of molecularly confirmed HS patients, but were found
      in 6 of the HS cases without molecular confirmation.
    explanation: Distinguishes the CCBE1-positive cohort from clinically diagnosed Hennekam patients;
      absence in this cohort does not establish that seizures can never occur in HKLLS1.
discussions:
- discussion_id: mismatch_ccbe1_models_nonlymphatic_phenotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: How do CCBE1 variants produce the variable neurodevelopmental and craniofacial findings beyond
    their established effect on lymphatic development?
  attaches_to:
  - pathophysiology#Generalized lymphatic dysplasia
  - phenotypes#Intellectual disability
  - phenotypes#Midface retrusion
  - phenotypes#Depressed nasal bridge
  - phenotypes#Hypertelorism
  - phenotypes#Epicanthus
  - phenotypes#Delayed speech and language development
  - phenotypes#Microcephaly
  rationale: The models summarized here establish a role for CCBE1 in lymphatic development, while human
    CCBE1-positive cases establish variable cognitive, speech, head-size and facial findings. The clinical
    sources do not demonstrate a causal route to each finding. Intrauterine facial edema is a proposed
    explanation for facial morphology, but a direct developmental contribution has not been excluded.
    These observations therefore remain without asserted causal edges.
  notes: Recorded as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because model-system evidence for
    the lymphatic mechanism is strong; what is uncertain is how far that evidence transfers to the non-lymphatic
    arms of the human phenotype.
  evidence:
  - reference: PMID:21778431
    reference_title: CCBE1 is essential for mammalian lymphatic vascular development and enhances the
      lymphangiogenic effect of vascular endothelial growth factor-C in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Mutant mice die prenatally. Proximity ligation assays indicate that vascular endothelial
      growth factor receptor 3 activation appears unaltered in mutants.
    explanation: Prenatal lethality is the concrete reason the mouse model cannot report on the postnatal
      neurodevelopmental phenotype; the assays reported in the same sentence pair are lymphatic-signalling
      readouts, which is the only arm of the disease this model addresses.
  - reference: DOI:10.1159/000342486
    reference_title: Evaluation of Clinical Manifestations in Patients with Severe Lymphedema with and
      without CCBE1 Mutations
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: We conclude thatCCBE1mutations cause a widespread and severe form of lymphatic dysplasia,
      associated with variable intellectual disabilities, unusual facial morphology and infrequently malformations.
    explanation: This conclusion concerns CCBE1-positive patients and establishes the human nonlymphatic
      findings whose mechanisms remain unresolved.
- discussion_id: gap_ccbe1_domain_genotype_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the domain in which a CCBE1 variant falls predict clinical severity in
    HKLLS1?
  attaches_to:
  - genetic#CCBE1
  - pathophysiology#CCBE1 loss of function
  rationale: >-
    The domain-deletion knock-in series shows a clear functional hierarchy -
    collagen-repeat loss phenocopies the null while EGF-domain loss still
    permits rudimentary lymphatics - and the same ordering held for two Hennekam
    patient mutations, one per domain. Two alleles is a demonstration, not a
    predictor. With roughly a dozen reported CCBE1 variants across about
    seventeen probands and no systematic functional assay applied across them,
    it is not established whether domain position explains the wide clinical
    variability, which ranges from recurrent prenatal hydrops to a child with
    imaging-detected lymphangiectasia and no measurable protein loss.
  evidence:
  - reference: PMID:25814692
    reference_title: "Functional Dissection of the CCBE1 Protein: A Crucial Requirement for the Collagen Repeat Domain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, a Hennekam syndrome mutation within the collagen domain has
      a stronger effect than a Hennekam syndrome mutation within the EGF
      domain.
    explanation: >-
      Establishes the domain-dependent severity signal that this gap asks
      whether to generalize; it rests on two patient alleles.
  - reference: PMID:30564329
    reference_title: "Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema syndrome-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      at least 12 different CCBE1 variants have been reported in at least
      seventeen probands
    explanation: >-
      Bounds the size of the reported allelic series, which is what makes a
      genotype-phenotype rule unestablished rather than merely uncurated.
- discussion_id: gap_hennekam_unexplained_molecular_fraction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What fraction of clinically diagnosed Hennekam syndrome remains molecularly
    unexplained after CCBE1, FAT4 and ADAMTS3 testing, and how many further
    genes account for it?
  attaches_to:
  - genetic#CCBE1
  - prevalence#Worldwide
  rationale: >-
    CCBE1 explains only about a quarter of clinically diagnosed Hennekam
    syndrome. FAT4 and ADAMTS3 account for further subsets, but a substantial
    residue has no molecular diagnosis, and additional candidate genes have been
    proposed on single families. This directly limits the epidemiology of
    HKLLS1: published case counts are for the clinical syndrome rather than for
    molecularly confirmed CCBE1 disease, so no prevalence figure specific to
    HKLLS1 can be derived from them.
  evidence:
  - reference: PMID:24913602
    reference_title: "Hennekam syndrome can be caused by FAT4 mutations and be allelic to Van Maldergem syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It can be caused by mutations in CCBE1 which are found in approximately
      25 % of cases.
    explanation: >-
      Quantifies the unexplained fraction that motivates this gap.
  - reference: PMID:28985353
    reference_title: "Loss of ADAMTS3 activity causes Hennekam lymphangiectasia-lymphedema syndrome 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They account for about one third of all primary lymphedema cases,
      underscoring the existence of additional genetic factors.
    explanation: >-
      Documents that the known primary-lymphedema gene set leaves most cases

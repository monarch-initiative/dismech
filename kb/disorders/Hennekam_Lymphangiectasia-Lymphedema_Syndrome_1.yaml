    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgery may improve limb size and restore some function in severe lymphedema that does not respond to conservative treatment.
    explanation: >-
      States both the benefit and the restriction to conservative-treatment

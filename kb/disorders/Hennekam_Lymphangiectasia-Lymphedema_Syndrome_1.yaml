- name: Intestinal lymphangiectasia
  biological_scale: TISSUE
  description: >-
    Dilated intestinal lymphatics leak protein-rich lymph into the gut,
    producing protein-losing enteropathy with hypoalbuminemia,
    hypogammaglobulinemia, and lymphopenia.
  evidence:
  - reference: PMID:2624276
    reference_title: Autosomal recessive intestinal lymphangiectasia and lymphedema, with facial anomalies and mental retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on two male and two female relatives with intestinal
      lymphangiectasia; severe lymphedema of limbs, genitalia, and face; facial
      anomalies; seizures; mild growth retardation; and moderate mental
      retardation.
    explanation: >-
      The original clinical description documents intestinal lymphangiectasia as
      a core feature of Hennekam syndrome; that family was later shown to be
      FAT4-related (PMID:24913602), and the CCBE1-anchored corroboration is in
      the matching phenotype entry.
  downstream:
  - target: Protein-losing enteropathy
    description: >-
      Enteric loss of lymph depletes serum albumin and immunoglobulins.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18294365
      reference_title: "Primary intestinal lymphangiectasia (Waldmann's disease)."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        dilated intestinal lacteals resulting in lymph leakage into the small
        bowel lumen and responsible for protein-losing enteropathy leading to
        lymphopenia, hypoalbuminemia and hypogammaglobulinemia
      explanation: >-
        Establishes the general mechanism of this edge: dilated intestinal
        lacteals leak lymph into the bowel lumen and produce protein-losing
        enteropathy. The review describes primary intestinal lymphangiectasia
        (Waldmann disease); the lymphangiectasia-to-enteropathy step is the same
        one operating in HKLLS1.

- name: CCBE1 domain-deletion knock-in mice
  species: Mus musculus
  genotype: CCBE1 delta-Collagen and CCBE1 delta-EGF knock-in alleles
  category: KNOCK_IN
  publication: PMID:25814692
  genes:
  - preferred_term: CCBE1
    term:
      id: hgnc:29426
      label: CCBE1
  description: >-
    Knock-in mice expressing CCBE1 lacking either the collagen repeats or the
    EGF domains, read out alongside zebrafish rescue and in vitro VEGF-C
    processing. Collagen-domain deletion fully phenocopies the null, whereas
    EGF-domain deletion still permits rudimentary lymphatics. The same
    asymmetry holds for two Hennekam syndrome patient mutations, one in each
    domain, which is what makes this an allele-specific model of the human
    disorder rather than a generic knockout.
  evidence:
  - reference: PMID:25814692
    reference_title: "Functional Dissection of the CCBE1 Protein: A Crucial Requirement for the Collagen Repeat Domain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We analyzed the functionality of several CCBE1 deletion mutants by
      generating knock-in mice expressing these mutants, by analyzing their
      ability to enhance Vegfc signaling in vivo in zebrafish, and by testing
      their ability to induce VEGFC processing in vitro.
    explanation: >-
      Describes the knock-in allelic series and the assays used to read it out.
  modeled_mechanisms:
  - target: CCBE1 loss of function
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Maps loss of CCBE1 function onto specific protein domains, and shows that
      a Hennekam syndrome mutation in the collagen repeats is more damaging than
      one in an EGF domain - a structural account of why HKLLS1 alleles differ
      in severity.
    limitations: >-
      The severity ordering was established for two patient mutations, so it
      supports a domain-level rule rather than a validated genotype-phenotype
      predictor for individual HKLLS1 alleles. The knock-ins delete whole
      domains, which is a more drastic lesion than most patient missense
      variants.
    readouts:
    - name: Lymphatic vessel formation in domain-deletion embryos
      target: CCBE1 loss of function
      description: >-
        Comparison of lymphatic development in CCBE1 delta-Collagen versus
        CCBE1 delta-EGF knock-in embryos, each against CCBE1 knockout mice.
      direction: DECREASED
      interpretation: >-
        Collagen-domain loss is equivalent to whole-protein loss while
        EGF-domain loss is partial, so the collagen repeats carry most of the
        VEGF-C-activating function whose loss causes HKLLS1.
      evidence:
      - reference: PMID:25814692
        reference_title: "Functional Dissection of the CCBE1 Protein: A Crucial Requirement for the Collagen Repeat Domain."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          although CCBE1ΔCollagen mice fully phenocopy CCBE1 knock-out mice,
          CCBE1ΔEGF knock-in embryos still form rudimentary lymphatics
        explanation: >-
          Reports the graded lymphatic phenotype that grounds this readout.
    evidence:
    - reference: PMID:25814692
      reference_title: "Functional Dissection of the CCBE1 Protein: A Crucial Requirement for the Collagen Repeat Domain."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, a Hennekam syndrome mutation within the collagen domain has
        a stronger effect than a Hennekam syndrome mutation within the EGF
        domain.
      explanation: >-
        Ties the domain-deletion series directly to Hennekam syndrome patient
        alleles, which is what makes this model informative for the human
        loss-of-function node.
  - target: Impaired pro-VEGF-C proteolytic activation
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The same allelic series was read out directly on VEGF-C processing, so it
      assays the proteolytic activation step itself rather than only its
      downstream consequence. Collagen-domain deletion abolishes processing
      while EGF-domain deletion does not, which assigns the cleavage-supporting
      function of CCBE1 to the collagen repeats.
    limitations: >-
      The processing readout is an in vitro assay on deletion constructs, not a
      measurement of endogenous VEGF-C maturation in a patient or in the
      knock-in animal. It establishes which domain carries the activity rather
      than quantifying how much activation a given patient allele retains.
    readouts:
    - name: VEGF-C proteolytic processing in vitro
      target: Impaired pro-VEGF-C proteolytic activation
      description: >-
        Ability of each CCBE1 deletion construct to induce cleavage of
        pro-VEGF-C, compared against full-length CCBE1.
      direction: ABOLISHED
      interpretation: >-
        Loss of the collagen repeats abolishes VEGF-C processing while loss of
        the EGF domains does not, placing the activating function of CCBE1 at
        this node in the collagen repeats.
      evidence:
      - reference: PMID:25814692
        reference_title: "Functional Dissection of the CCBE1 Protein: A Crucial Requirement for the Collagen Repeat Domain."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Third, CCBE1ΔEGF, similarly to CCBE1, but not CCBE1ΔCollagen could
          activate VEGFC processing in vitro.
        explanation: >-
          Reports the processing measurement behind this readout and its
          direction for each construct.
    evidence:
    - reference: PMID:25814692
      reference_title: "Functional Dissection of the CCBE1 Protein: A Crucial Requirement for the Collagen Repeat Domain."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We analyzed the functionality of several CCBE1 deletion mutants by
        generating knock-in mice expressing these mutants, by analyzing their
        ability to enhance Vegfc signaling in vivo in zebrafish, and by testing
        their ability to induce VEGFC processing in vitro.
      explanation: >-
        Names VEGF-C processing as one of the three assays this model series was
        read out on, which is what makes it informative for the activation node
        specifically.
differential_diagnoses:
- name: Hennekam lymphangiectasia-lymphedema syndrome 2
  disease_term:
    preferred_term: Hennekam lymphangiectasia-lymphedema syndrome 2
    term:
      id: MONDO:0014454
      label: Hennekam lymphangiectasia-lymphedema syndrome 2
  description: >-
    FAT4-related Hennekam syndrome is clinically overlapping and distinguished by
    molecular testing; it accounts for a subset of CCBE1 mutation-negative cases.
  evidence:
  - reference: PMID:24913602
    reference_title: "Hennekam syndrome can be caused by FAT4 mutations and be allelic to Van Maldergem syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent targeted mutation analysis of FAT4 in a cohort of 24 CCBE1
      mutation-negative Hennekam syndrome patients identified homozygous or
      compound heterozygous mutations in four additional families.
    explanation: >-
      Establishes FAT4-related Hennekam syndrome as a distinct molecular entity
      found specifically among CCBE1 mutation-negative patients. The abstract
      does not compare the two Hennekam subtypes clinically, so this supports
      the genotype separation only, not a claim that they are clinically
      indistinguishable.

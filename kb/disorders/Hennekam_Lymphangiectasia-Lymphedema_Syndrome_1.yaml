animal_models:
- name: Ccbe1 knockout mouse
  species: Mouse
  genotype: Ccbe1 null (homozygous knockout)
  publication: PMID:30564329
  description: >-
    Constitutive Ccbe1 knockout mice lack lymphatic vessels entirely and die
    prenatally with severe hydrops. The model captures the severe prenatal end of
    the human phenotypic spectrum well - the CCBE1-confirmed human case in the
    same report presented as recurrent nonimmune hydrops fetalis - but a complete
    null is more severe than the biallelic hypomorphic and missense genotypes
    seen in surviving HKLLS1 patients, so it cannot model the postnatal
    lymphedema, enteropathy and cognitive phenotype that dominates human disease.
  modeled_mechanisms:
  - target: Generalized lymphatic dysplasia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Absence of lymphatic vessels is the extreme form of the lymphatic
      maldevelopment this node describes, and the prenatal hydrops matches the
      severe end of the human presentation.
    limitations: >-
      A constitutive null is more severe than most human HKLLS1 genotypes.
      Prenatal lethality means the model cannot report on the postnatal
      lymphedema, protein-losing enteropathy, or intellectual disability that
      define the surviving human phenotype, and the human disorder produces
      dysplastic lymphatics rather than their complete absence.

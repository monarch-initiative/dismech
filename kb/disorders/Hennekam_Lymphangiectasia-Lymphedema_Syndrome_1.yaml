prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Hennekam syndrome is very rare, with CCBE1 accounting for approximately 25%
    of all Hennekam syndrome cases. No population-based rate has been reported;
    the class here reflects the small number of published cases.
  evidence:
  - reference: PMID:24913602
    reference_title: Hennekam syndrome can be caused by FAT4 mutations and be allelic to Van Maldergem syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It can be caused by mutations in CCBE1 which are found in approximately
      25 % of cases.
    explanation: >-
      Quantifies the CCBE1 fraction of Hennekam syndrome cases (~25%); the
      quote does not itself state a population prevalence.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    HKLLS1 combines lifelong, often disabling lymphedema of limbs, genitalia and
    face with intestinal lymphangiectasia causing protein-losing enteropathy,
    and with intellectual disability and seizures. At the severe end the
    lymphatic failure presents in utero as recurrent non-immune hydrops fetalis,
    which is a recurrent-pregnancy-loss burden as well as a neonatal one. There
    is no curative therapy: management is dietary control of the enteropathy and
    decongestive therapy for the edema, both of which are permanent
    commitments. HIGH rather than VARIABLE reflects the severity of the
    disorder at its typical presentation, not uniformity across patients:
    expressivity is wide, and a mildly affected child may have
    imaging-detected intestinal lymphangiectasia with no measurable protein
    loss and no seizures.
  evidence:
  - reference: PMID:2624276
    reference_title: "Autosomal recessive intestinal lymphangiectasia and lymphedema, with facial anomalies and mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on two male and two female relatives with intestinal
      lymphangiectasia; severe lymphedema of limbs, genitalia, and face; facial
      anomalies; seizures; mild growth retardation; and moderate mental
      retardation.
    explanation: >-
      The originally-described family shows the multisystem burden - severe
      lymphedema plus enteropathy plus seizures plus cognitive impairment -
      co-occurring in affected individuals. That family was later shown to be
      FAT4-related (PMID:24913602), so it establishes the burden of the Hennekam
      phenotype rather than of the CCBE1 subtype specifically; the
      CCBE1-confirmed sources cited alongside carry the subtype anchoring.
  - reference: PMID:29560340
    reference_title: "Hennekam Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is no curative therapy at this time, but rehabilitative treatments
      including complete decongestive therapy for edema control appeared to be
      beneficial.
    explanation: >-
      Establishes that management is supportive and open-ended, with no
      disease-modifying option, which is a major component of the burden.
  - reference: PMID:30564329
    reference_title: "Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema syndrome-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing (WES) was used to determine the etiology of
      recurrent hydrops fetalis in this case of Hennekam
      lymphangiectasia-lymphedema syndrome-1.
    explanation: >-
      Documents the severe prenatal end of the spectrum, where the disorder
      presents as recurrent hydrops fetalis.
progression:
- phase: Prenatal presentation
  age_range: Fetal life
  notes: >-
    In severely affected pregnancies the lymphatic failure is already manifest
    in utero as non-immune hydrops fetalis, cystic hygroma, pleural and
    pericardial effusions and ascites, and may recur across pregnancies in a
    family. Prenatal onset is what brings some families to whole-exome
    sequencing before any postnatal phenotype is available.
  evidence:
  - reference: PMID:30564329
    reference_title: "Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema syndrome-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing (WES) was used to determine the etiology of
      recurrent hydrops fetalis in this case of Hennekam
      lymphangiectasia-lymphedema syndrome-1.
    explanation: >-
      Establishes recurrent prenatal hydrops as a presenting phase of HKLLS1.
- phase: Congenital and infantile lymphedema
  age_range: Birth through infancy
  notes: >-
    Edema is usually present at birth and involves the limbs, genitalia and
    face. Facial appearance is distinctive from birth, attributed at least in
    part to intrauterine facial edema. Intestinal lymphangiectasia may be
    detected early on imaging before any protein-loss pattern is measurable.
  evidence:
  - reference: PMID:30564329
    reference_title: "Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema syndrome-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The edema is usually congenital and often progressive, generally
      including the limbs, genitalia, and face.
    explanation: >-
      Dates the onset of lymphedema to birth and states its typical
      distribution.
- phase: Childhood progressive course
  age_range: Childhood onward
  notes: >-
    The edema is often progressive rather than static, and the enteric protein
    loss from intestinal lymphangiectasia accumulates into hypoalbuminemia,
    hypogammaglobulinemia, lymphopenia and growth failure. Developmental delay
    and, in about a third of patients, seizures become apparent over the same
    interval. There are no validated disease stages, so these phases describe
    the reported natural history rather than a staging system.
  evidence:
  - reference: PMID:30564329
    reference_title: "Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema syndrome-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The edema is usually congenital and often progressive, generally
      including the limbs, genitalia, and face.
    explanation: >-
      States that the lymphedema is progressive rather than stable after its
      congenital onset.
  - reference: PMID:29560340
    reference_title: "Hennekam Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About 33% of cases of Hennekam syndrome patients have seizures, varying
      from absences to tonic or atonic attacks
    explanation: >-
      Sources the seizure fraction stated in this phase.
  - reference: PMID:18294365
    reference_title: "Primary intestinal lymphangiectasia (Waldmann's disease)."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      dilated intestinal lacteals resulting in lymph leakage into the small
      bowel lumen and responsible for protein-losing enteropathy leading to
      lymphopenia, hypoalbuminemia and hypogammaglobulinemia
    explanation: >-
      Supplies the biochemical consequences that accumulate during this phase.
      The review describes primary intestinal lymphangiectasia rather than
      HKLLS1, so the inference is that the same enteropathy operating in HKLLS1
      produces the same laboratory profile.
discussions:
- discussion_id: mismatch_ccbe1_models_nonlymphatic_phenotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the available CCBE1 animal models say anything about the intellectual
    disability, seizures and craniofacial features of HKLLS1, or only about its
    lymphatic arm?
  attaches_to:
  - pathophysiology#Generalized lymphatic dysplasia
  - phenotypes#Intellectual disability
  rationale: >-
    Every model that grounds the mechanism of this entry reads out lymphatic
    development alone. Ccbe1-null mice die prenatally, so no postnatal
    neurodevelopmental or craniofacial phenotype can be scored in them, and
    zebrafish have no counterpart to human cognition or facial morphology. The
    intellectual disability is therefore supported by human clinical
    observation only, and the mechanism connecting lymphatic dysplasia to it is
    not addressed by any model in this entry. That matters because the causal
    route is genuinely open: the facial appearance is usually attributed to
    intrauterine facial edema, a secondary consequence of the lymphatic lesion,
    but whether the cognitive impairment arises the same way, from an
    independent developmental role of CCBE1, or from seizures and nutritional
    compromise, is unresolved.
  notes: >-
    Recorded as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because
    model-system evidence for the lymphatic mechanism is strong; what is
    uncertain is how far that evidence transfers to the non-lymphatic arms of
    the human phenotype.
  evidence:
  - reference: PMID:21778431
    reference_title: "CCBE1 is essential for mammalian lymphatic vascular development and enhances the lymphangiogenic effect of vascular endothelial growth factor-C in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutant mice die prenatally. Proximity ligation assays indicate that
      vascular endothelial growth factor receptor 3 activation appears
      unaltered in mutants.
    explanation: >-
      Prenatal lethality is the concrete reason the mouse model cannot report on
      the postnatal neurodevelopmental phenotype; the assays reported in the
      same sentence pair are lymphatic-signalling readouts, which is the only
      arm of the disease this model addresses.
  - reference: PMID:2624276
    reference_title: "Autosomal recessive intestinal lymphangiectasia and lymphedema, with facial anomalies and mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on two male and two female relatives with intestinal
      lymphangiectasia; severe lymphedema of limbs, genitalia, and face; facial
      anomalies; seizures; mild growth retardation; and moderate mental
      retardation.
    explanation: >-
      The cognitive and craniofacial features are established in humans, which
      is what makes their absence from the model systems a mismatch rather than
      an absence of phenotype. This is the originally-described family, later
      shown to be FAT4-related (PMID:24913602); the gap is stated for the
      Hennekam phenotype the CCBE1 subtype shares, and no CCBE1-confirmed report
      addresses the mechanism linking lymphatic dysplasia to cognition either.
- discussion_id: gap_ccbe1_domain_genotype_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the domain in which a CCBE1 variant falls predict clinical severity in
    HKLLS1?
  attaches_to:
  - genetic#CCBE1
  - pathophysiology#CCBE1 loss of function
  rationale: >-
    The domain-deletion knock-in series shows a clear functional hierarchy -
    collagen-repeat loss phenocopies the null while EGF-domain loss still
    permits rudimentary lymphatics - and the same ordering held for two Hennekam
    patient mutations, one per domain. Two alleles is a demonstration, not a
    predictor. With roughly a dozen reported CCBE1 variants across about
    seventeen probands and no systematic functional assay applied across them,
    it is not established whether domain position explains the wide clinical
    variability, which ranges from recurrent prenatal hydrops to a child with
    imaging-detected lymphangiectasia and no measurable protein loss.
  evidence:
  - reference: PMID:25814692
    reference_title: "Functional Dissection of the CCBE1 Protein: A Crucial Requirement for the Collagen Repeat Domain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, a Hennekam syndrome mutation within the collagen domain has
      a stronger effect than a Hennekam syndrome mutation within the EGF
      domain.
    explanation: >-
      Establishes the domain-dependent severity signal that this gap asks
      whether to generalize; it rests on two patient alleles.
  - reference: PMID:30564329
    reference_title: "Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema syndrome-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      at least 12 different CCBE1 variants have been reported in at least
      seventeen probands
    explanation: >-
      Bounds the size of the reported allelic series, which is what makes a
      genotype-phenotype rule unestablished rather than merely uncurated.
- discussion_id: gap_hennekam_unexplained_molecular_fraction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What fraction of clinically diagnosed Hennekam syndrome remains molecularly
    unexplained after CCBE1, FAT4 and ADAMTS3 testing, and how many further
    genes account for it?
  attaches_to:
  - genetic#CCBE1
  - prevalence#Worldwide
  rationale: >-
    CCBE1 explains only about a quarter of clinically diagnosed Hennekam
    syndrome. FAT4 and ADAMTS3 account for further subsets, but a substantial
    residue has no molecular diagnosis, and additional candidate genes have been
    proposed on single families. This directly limits the epidemiology of
    HKLLS1: published case counts are for the clinical syndrome rather than for
    molecularly confirmed CCBE1 disease, so no prevalence figure specific to
    HKLLS1 can be derived from them.
  evidence:
  - reference: PMID:24913602
    reference_title: "Hennekam syndrome can be caused by FAT4 mutations and be allelic to Van Maldergem syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It can be caused by mutations in CCBE1 which are found in approximately
      25 % of cases.
    explanation: >-
      Quantifies the unexplained fraction that motivates this gap.
  - reference: PMID:28985353
    reference_title: "Loss of ADAMTS3 activity causes Hennekam lymphangiectasia-lymphedema syndrome 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They account for about one third of all primary lymphedema cases,
      underscoring the existence of additional genetic factors.
    explanation: >-
      Documents that the known primary-lymphedema gene set leaves most cases
      unexplained, the wider context in which the Hennekam residue sits.

      explanation: >-
        States that the generalized lymphatic maldevelopment of HKLLS1 acts
        preferentially on the intestine, which is the step this edge asserts.
  - target: Lymphedema
    description: >-
      Impaired lymphatic drainage in the limbs, genitalia, and face causes
      lymphedema.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30564329
      reference_title: "Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema syndrome-1."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-

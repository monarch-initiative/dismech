    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive intestinal lymphangiectasia and lymphedema, with
      facial anomalies and mental retardation.
    explanation: >-
      Dietary management is the standard supportive approach for the intestinal
      lymphangiectasia and protein-losing enteropathy documented in this
      syndrome; evidence supports the underlying lesion the diet targets.

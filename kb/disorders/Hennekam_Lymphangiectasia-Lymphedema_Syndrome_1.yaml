name: Hennekam lymphangiectasia-lymphedema syndrome 1
creation_date: "2026-08-02T00:00:00Z"
description: >-
  Hennekam lymphangiectasia-lymphedema syndrome 1 (HKLLS1) is an autosomal
  recessive generalized lymphatic dysplasia caused by biallelic mutations in
  CCBE1. It is characterized by the triad of intestinal lymphangiectasia,
  peripheral and facial lymphedema, and intellectual disability, together with a
  characteristic flat facial appearance (flat face, depressed nasal bridge,
  hypertelorism, epicanthal folds, small mouth, and dental anomalies).
  Intestinal lymphangiectasia causes protein-losing enteropathy with
  hypoalbuminemia, hypogammaglobulinemia, and lymphopenia. CCBE1 is a secreted
  extracellular-matrix protein essential for lymphangiogenesis, acting as a
  cofactor that promotes ADAMTS3-mediated proteolytic activation of pro-VEGF-C;
  loss of CCBE1 function impairs VEGF-C/VEGFR-3 signaling and lymphatic vessel
  development. CCBE1 mutations account for approximately 25% of Hennekam syndrome
  cases and were the first genetic cause identified for the disorder.
category: Mendelian
parents:
- Hennekam syndrome
- hereditary disease
synonyms:
- CCBE1 Hennekam syndrome
- HKLLS1
- generalized lymphatic dysplasia, CCBE1-related
disease_term:
  preferred_term: Hennekam lymphangiectasia-lymphedema syndrome 1
  term:
    id: MONDO:0009337
    label: Hennekam lymphangiectasia-lymphedema syndrome 1
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      HKLLS1 is a monogenic autosomal recessive disorder of a developmental
      signalling pathway (CCBE1-ADAMTS3-VEGF-C/VEGFR-3), so it sits in
      Harrison's genetics-and-disease part alongside other Mendelian
      developmental syndromes.
  - classification_value: CARDIOVASCULAR
    notes: >-
      The primary lesion is in the lymphatic vasculature, which Harrison's
      covers within the vascular-disease part (chronic venous disease and
      lymphedema). Recorded alongside the genetic assignment rather than
      instead of it, because the mechanism is developmental but the affected
      organ system is vascular.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    HKLLS1 is inherited in an autosomal recessive manner; affected individuals
    carry biallelic (homozygous or compound heterozygous) CCBE1 mutations,
    frequently in the setting of parental consanguinity.
  evidence:
  - reference: PMID:19935664
    reference_title: Mutations in CCBE1 cause generalized lymph vessel dysplasia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous and compound heterozygous mutations in seven subjects paired
      with functional analysis in a zebrafish model identify CCBE1 as one of few
      genes causing primary generalized lymph-vessel dysplasia in humans.
    explanation: >-
      Homozygous and compound heterozygous CCBE1 genotypes establish autosomal
      recessive inheritance for HKLLS1.
pathophysiology:
- name: CCBE1 loss of function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function mutations in CCBE1 reduce the activity of a
    secreted extracellular-matrix protein required for lymphangiogenesis.
  genes:
  - preferred_term: CCBE1
    term:
      id: hgnc:29426
      label: CCBE1
  evidence:
  - reference: PMID:19935664
    reference_title: Mutations in CCBE1 cause generalized lymph vessel dysplasia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping identified a critical chromosomal region containing
      CCBE1, the human ortholog of a gene essential for lymphangiogenesis in
      zebrafish.
    explanation: >-
      Identifies CCBE1 as the causal gene and situates it as an essential
      lymphangiogenesis factor.
  - reference: PMID:25814692
    reference_title: "Functional Dissection of the CCBE1 Protein: A Crucial Requirement for the Collagen Repeat Domain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      deleting the collagen domains of CCBE1 has a much stronger effect on
      CCBE1 activity than deleting the EGF domains
    explanation: >-
      Domain-dissection knock-in mouse and zebrafish data show the collagen
      repeats of CCBE1 are crucial for its VEGF-C-activating, lymphangiogenic
      function that is lost in HKLLS1.
  - reference: PMID:26686525
    reference_title: "A Multiplex Kindred with Hennekam Syndrome due to Homozygosity for a CCBE1 Mutation that does not Prevent Protein Expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our findings show that the mutant CCBE1 C174Y protein is not
      loss-of-function by loss-of-expression.
    explanation: >-
      Qualifies what "loss of function" means at this node for one recurrent
      patient allele: C174Y is not loss-of-function by failure to make the
      protein, since transfected cells show increased expression and secretion.
      That is an in vitro result and does not describe patient tissue, where
      the same paper finds CCBE1 scarce in affected intestinal lymphatics. The
      paper offers two unresolved explanations, quoted in the items below, so
      the node should be read as loss of CCBE1 activity without a settled
      account of whether the protein is absent, misfolded, or degraded in vivo.
  - reference: PMID:26686525
    reference_title: "A Multiplex Kindred with Hennekam Syndrome due to Homozygosity for a CCBE1 Mutation that does not Prevent Protein Expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The CCBE1 C174Y mutation confers increased intracellular protein
      expression and secretion in vitro concurrent with a paucity of CCBE1
      protein in vivo by immunohistochemistry
    explanation: >-
      The authors' own reconciliation of the two halves. Curated so the in vitro
      expression result above is not read as describing patients, in whom the
      protein is scarce in the affected tissue.
  - reference: PMID:26686525
    reference_title: "A Multiplex Kindred with Hennekam Syndrome due to Homozygosity for a CCBE1 Mutation that does not Prevent Protein Expression."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Alternatively, the mutant protein may be rapidly degraded in physiological
      conditions in vivo
    explanation: >-
      Records that the mechanism is offered as a hypothesis rather than a
      result. Graded OTHER rather than IN_VITRO because the sentence is a
      discussion-section proposal about what happens in vivo and reports no
      experiment of its own. Quoted so this node does not assert a settled
      account of why
      CCBE1 is scarce in patient tissue when the source explicitly does not
      have one.
  downstream:
  - target: Impaired pro-VEGF-C proteolytic activation
    description: >-
      CCBE1 is the cofactor that lets ADAMTS3 cleave pro-VEGF-C into its mature
      active form; without it, that cleavage step fails.
    evidence:
    - reference: PMID:24552833
      reference_title: CCBE1 enhances lymphangiogenesis via A disintegrin and metalloprotease with thrombospondin motifs-3-mediated vascular endothelial growth factor-C activation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        it promotes proteolytic cleavage of the otherwise poorly active
        29/31-kDa form of VEGF-C by the A disintegrin and metalloprotease with
        thrombospondin motifs-3 protease, resulting in the mature 21/23-kDa form
        of VEGF-C, which induces increased VEGF-C receptor signaling.
      explanation: >-
        Defines the molecular mechanism by which CCBE1 enables VEGF-C activation;
        loss of CCBE1 removes this cofactor activity.
- name: Impaired pro-VEGF-C proteolytic activation
  biological_scale: MOLECULAR
  description: >-
    CCBE1 and the protease ADAMTS3 form a complex that cleaves the poorly active
    29/31-kDa form of pro-VEGF-C into the mature 21/23-kDa ligand. Loss of CCBE1
    removes the cofactor, so this proteolytic maturation step fails and little
    active VEGF-C is produced. CCBE1's two domains contribute differently: the
    C-terminal collagen-like domain drives the cleavage activity, while the
    N-terminal EGF-like domain colocalizes pro-VEGF-C with its protease at the
    lymphatic endothelial cell surface.
  notes: >-
    This node is about the proteolytic maturation of pro-VEGF-C, not about how
    much VEGF-C is present. Serum VEGF-C was no different from healthy controls
    in two genotype-confirmed CCBE1 patients (PMID:26686525), so a normal total
    VEGF-C level does not argue against this node and should not be read as
    evidence for or against it.
  molecular_functions:
  - preferred_term: metalloendopeptidase activity of the ADAMTS3-CCBE1 complex
    modifier: DECREASED
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
  evidence:
  - reference: PMID:24552833
    reference_title: CCBE1 enhances lymphangiogenesis via A disintegrin and metalloprotease with thrombospondin motifs-3-mediated vascular endothelial growth factor-C activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      it promotes proteolytic cleavage of the otherwise poorly active
      29/31-kDa form of VEGF-C by the A disintegrin and metalloprotease with
      thrombospondin motifs-3 protease, resulting in the mature 21/23-kDa form
      of VEGF-C, which induces increased VEGF-C receptor signaling.
    explanation: >-
      Defines the cleavage this node names and the cofactor role CCBE1 plays in
      it.
  - reference: PMID:27159393
    reference_title: "Proteolytic activation defines distinct lymphangiogenic mechanisms for VEGFC and VEGFD."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      an ADAMTS3-CCBE1 complex can form independently of VEGFR3 and is required
      to convert VEGFC, but not VEGFD, into an active ligand
    explanation: >-
      Establishes that CCBE1 and ADAMTS3 act as a complex and that the complex
      is required for VEGF-C activation specifically, which is why loss of
      CCBE1 is not compensated by VEGF-D.
  - reference: PMID:28687807
    reference_title: "Efficient activation of the lymphangiogenic growth factor VEGF-C requires the C-terminal domain of VEGF-C and the N-terminal domain of CCBE1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The N-terminal EGF-like domain of CCBE1 increased VEGFR-3 signaling by
      colocalizing pro-VEGF-C with its activating protease to the lymphatic
      endothelial cell surface.
    explanation: >-
      Resolves the two separable contributions of CCBE1 to this step, which is
      what makes domain-specific patient alleles differ in severity.
  downstream:
  - target: Failed lymphangiogenesis
    description: >-
      Without mature VEGF-C, VEGFR-3 signaling in lymphatic endothelial cells is
      not driven and lymphatic vessels fail to form.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24523457
      reference_title: Ccbe1 regulates Vegfc-mediated induction of Vegfr3 signaling during embryonic lymphangiogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Vegfc- and Vegfr3-dependent Erk signaling is impaired in the absence of
        Ccbe1.
      explanation: >-
        Shows the signalling consequence of the failed activation step in a
        Ccbe1 loss-of-function animal, which is the step this edge asserts.
- name: Failed lymphangiogenesis
  biological_scale: CELLULAR
  description: >-
    Without VEGF-C/VEGFR-3 drive, lymphatic endothelial cells are still
    specified but fail to bud, migrate and assemble into lymphatic vessels.

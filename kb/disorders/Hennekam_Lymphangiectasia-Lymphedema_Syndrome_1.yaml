name: Hennekam lymphangiectasia-lymphedema syndrome 1
creation_date: "2026-08-02T00:00:00Z"
description: >-
  Hennekam lymphangiectasia-lymphedema syndrome 1 (HKLLS1) is an autosomal
  recessive generalized lymphatic dysplasia caused by biallelic mutations in
  CCBE1. It is characterized by the triad of intestinal lymphangiectasia,
  peripheral and facial lymphedema, and intellectual disability, together with a
  characteristic flat facial appearance (flat face, depressed nasal bridge,
  hypertelorism, epicanthal folds, small mouth, and dental anomalies).
  Intestinal lymphangiectasia causes protein-losing enteropathy with
  hypoalbuminemia, hypogammaglobulinemia, and lymphopenia. CCBE1 is a secreted
  extracellular-matrix protein essential for lymphangiogenesis, acting as a
  cofactor that promotes ADAMTS3-mediated proteolytic activation of pro-VEGF-C;
  loss of CCBE1 function impairs VEGF-C/VEGFR-3 signaling and lymphatic vessel
  development. CCBE1 mutations account for approximately 25% of Hennekam syndrome
  cases and were the first genetic cause identified for the disorder.
category: Mendelian
parents:
- Hennekam syndrome
- hereditary disease
synonyms:
- CCBE1 Hennekam syndrome
- HKLLS1
- generalized lymphatic dysplasia, CCBE1-related

- discussion_id: gap_ccbe1_subtype_phenotype_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which historical Hennekam findings are established specifically in CCBE1 disease?
  attaches_to:
  - genetic#CCBE1
  rationale: The original 1989 family was later shown to have FAT4 disease. Its narrow mouth, dental and
    ear findings cannot alone establish those phenotypes in HKLLS1, and a general statement that ADAMTS3
    cases have similar faces does not supply CCBE1-specific observations. The Lee rehabilitation patient
    with pulmonary lymphangiectasia had no genetic testing. These findings are omitted pending direct
    subtype support. Total lymphopenia is a recognized consequence of intestinal lymph loss generally,
    but the reviewed CCBE1 reports document normal total lymphocyte counts or selected lymphocyte subsets
    rather than a confirmed low total count. This remains a possible complication rather than an observed
    subtype phenotype. Seizures were absent in the 13 CCBE1-positive cohort; this does not establish absolute
    exclusion.
  evidence:
  - reference: DOI:10.1159/000342486
    reference_title: Evaluation of Clinical Manifestations in Patients with Severe Lymphedema with and
      without CCBE1 Mutations
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Seizures did not occur in the group of molecularly confirmed HS patients, but were found
      in 6 of the HS cases without molecular confirmation.
    explanation: The genotype-stratified comparison shows why historical Hennekam seizure estimates should
      not be imported into HKLLS1.
- discussion_id: gap_ccbe1_additional_findings_mechanisms
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What mechanisms explain the associated thyroid, hernia and fetal structural findings?
  attaches_to:
  - phenotypes#Hypothyroidism
  - phenotypes#Inguinal hernia
  - phenotypes#Umbilical hernia
  - phenotypes#Cystic hygroma
  - phenotypes#Pulmonary hypoplasia
  - phenotypes#Metopic synostosis
  - phenotypes#Congenital diaphragmatic hernia
  rationale: The clinical reports document these findings without establishing their causal routes. The
    C174Y siblings had hypothyroidism and hernias; whether these reflect lymphatic disease or additional
    developmental effects is unresolved. Cystic hygroma and pulmonary hypoplasia were observed in an ungenotyped
    fetus from the CCBE1 family, so both individual genetic attribution and a detailed mechanism remain
    uncertain. Causal edges are withheld. Metopic synostosis and diaphragmatic hernia were isolated CCBE1-positive
    cohort findings without a demonstrated causal route. Growth hormone deficiency was also named in one
    cohort case, but the narrative does not supply the testing needed to choose a specific HPO binding;
    this is retained as a curation lead. Isolated neoplasms and uncertain polydactyly are not generalized
    into established CCBE1 disease associations.
  evidence:
  - reference: PMID:26686525
    reference_title: A Multiplex Kindred with Hennekam Syndrome due to Homozygosity for a CCBE1 Mutation
      that does not Prevent Protein Expression.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: In adulthood, both P1 and P2 developed hypothyroidism treated with levothyroxine.
    explanation: Documents the thyroid phenotype without establishing its mechanism.
  - reference: PMID:30564329
    reference_title: Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema
      syndrome-1.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: An autopsy described a female fetus with a cystic hygroma, serous (nonchylous) pleural and
      pericardial effusions, congested liver, hypoplastic lungs, and a “markedly enlarged, hyperplastic
      thyroid gland”.
    explanation: The fetal structural findings were observed in the second pregnancy, which could not
      be genotyped.
- discussion_id: gap_ccbe1_compartment_specific_fluid_mechanisms
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which drainage, leakage and oncotic mechanisms produce pleural effusions and ascites in CCBE1 disease?
  attaches_to:
  - pathophysiology#Generalized lymphatic dysplasia
  - phenotypes#Pleural effusion
  - phenotypes#Ascites
  - phenotypes#Chylous ascites
  rationale: CCBE1-positive patients have pleural effusions and fetal ascites, and other confirmed
    patients have recurrent chylous ascites. These observations establish the clinical associations
    but do not resolve the compartment-specific routes of fluid accumulation. Impaired drainage,
    lymphatic leakage and reduced oncotic pressure may contribute differently. The ultrasound of
    the confirmed fetus did not characterize the fluid, and the sibling report did not locate a
    peritoneal leak. These passages do not themselves attribute each effusion to dysplasia as a causal
    claim, so those arrows are withheld. Unknown intermediates alone would not preclude an indirectly
    supported causal edge; the missing evidence here is for the compartment-specific causal attribution.
  evidence:
  - reference: PMID:30564329
    reference_title: Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema
      syndrome-1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Ultrasound images of hydropic fetus from G4 pregnancy. A, Fetal chest demonstrating pleural
      effusions; B, fetal head demonstrating scalp edema; C, fetal abdomen demonstrating ascites
    explanation: The confirmed fetus had pleural effusions and ascites; ultrasound establishes their
      presence rather than the mechanism or composition of the fluid.
  - reference: PMID:26686525
    reference_title: A Multiplex Kindred with Hennekam Syndrome due to Homozygosity for a CCBE1 Mutation
      that does not Prevent Protein Expression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report two HS siblings, born to consanguineous parents of Turkish ancestry, whose clinical
      phenotype also includes protein losing enteropathy, painful relapsing chylous ascites, and hypogammaglobulinemia.
    explanation: The molecularly confirmed siblings establish chylous ascites, but this co-occurrence
      does not identify the anatomical route of lymph leakage or exclude other contributors.

  - target: Pericardial effusion
    description: Impaired lymphatic fluid drainage can contribute to recurrent pericardial fluid accumulation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:40394495

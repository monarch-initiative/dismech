  - target: Lymphedema
    description: Impaired lymphatic drainage in the limbs, genitalia, and face causes lymphedema.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30564329
      reference_title: Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam

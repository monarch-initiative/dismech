name: Hennekam lymphangiectasia-lymphedema syndrome 1
creation_date: "2026-08-02T00:00:00Z"
description: >-
  Hennekam lymphangiectasia-lymphedema syndrome 1 (HKLLS1) is an autosomal
  recessive generalized lymphatic dysplasia caused by biallelic mutations in
  CCBE1. It is characterized by the triad of intestinal lymphangiectasia,
  peripheral and facial lymphedema, and intellectual disability, together with a
  characteristic flat facial appearance (flat face, depressed nasal bridge,
  hypertelorism, epicanthal folds, small mouth, and dental anomalies).
  Intestinal lymphangiectasia causes protein-losing enteropathy with
  hypoalbuminemia, hypogammaglobulinemia, and lymphopenia. CCBE1 is a secreted
  extracellular-matrix protein essential for lymphangiogenesis, acting as a
  cofactor that promotes ADAMTS3-mediated proteolytic activation of pro-VEGF-C;
  loss of CCBE1 function impairs VEGF-C/VEGFR-3 signaling and lymphatic vessel
  development. CCBE1 mutations account for approximately 25% of Hennekam syndrome
  cases and were the first genetic cause identified for the disorder.
category: Mendelian
parents:
- Hennekam syndrome
- hereditary disease
synonyms:
- CCBE1 Hennekam syndrome
- HKLLS1
- generalized lymphatic dysplasia, CCBE1-related
disease_term:
  preferred_term: Hennekam lymphangiectasia-lymphedema syndrome 1
  term:
    id: MONDO:0009337
    label: Hennekam lymphangiectasia-lymphedema syndrome 1
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    HKLLS1 is inherited in an autosomal recessive manner; affected individuals
    carry biallelic (homozygous or compound heterozygous) CCBE1 mutations,
    frequently in the setting of parental consanguinity.
  evidence:
  - reference: PMID:19935664
    reference_title: Mutations in CCBE1 cause generalized lymph vessel dysplasia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous and compound heterozygous mutations in seven subjects paired
      with functional analysis in a zebrafish model identify CCBE1 as one of few
      genes causing primary generalized lymph-vessel dysplasia in humans.
    explanation: >-
      Homozygous and compound heterozygous CCBE1 genotypes establish autosomal
      recessive inheritance for HKLLS1.
pathophysiology:
- name: CCBE1 loss of function
  description: >-
    Biallelic loss-of-function mutations in CCBE1 reduce the activity of a
    secreted extracellular-matrix protein required for lymphangiogenesis.
  genes:
  - preferred_term: CCBE1
    term:
      id: hgnc:29426
      label: CCBE1
  evidence:
  - reference: PMID:19935664
    reference_title: Mutations in CCBE1 cause generalized lymph vessel dysplasia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping identified a critical chromosomal region containing
      CCBE1, the human ortholog of a gene essential for lymphangiogenesis in
      zebrafish.
    explanation: >-
      Identifies CCBE1 as the causal gene and situates it as an essential
      lymphangiogenesis factor.
  - reference: DOI:10.1161/CIRCRESAHA.116.304949
    reference_title: Functional Dissection of the CCBE1 Protein.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      deleting the collagen domains of CCBE1 has a much stronger effect on
      CCBE1 activity than deleting the EGF domains
    explanation: >-
      Domain-dissection knock-in mouse and zebrafish data show the collagen
      repeats of CCBE1 are crucial for its VEGF-C-activating, lymphangiogenic
      function that is lost in HKLLS1.
  downstream:
  - target: Impaired VEGF-C activation and lymphangiogenesis
    description: >-
      CCBE1 promotes ADAMTS3-mediated proteolytic maturation of pro-VEGF-C;
      loss of CCBE1 reduces mature VEGF-C and downstream VEGFR-3 signaling in
      lymphatic endothelial cells.
    evidence:
    - reference: PMID:24552833
      reference_title: CCBE1 enhances lymphangiogenesis via A disintegrin and metalloprotease with thrombospondin motifs-3-mediated vascular endothelial growth factor-C activation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        it promotes proteolytic cleavage of the otherwise poorly active
        29/31-kDa form of VEGF-C by the A disintegrin and metalloprotease with
        thrombospondin motifs-3 protease, resulting in the mature 21/23-kDa form
        of VEGF-C, which induces increased VEGF-C receptor signaling.
      explanation: >-
        Defines the molecular mechanism by which CCBE1 enables VEGF-C activation;
        loss of CCBE1 removes this cofactor activity.
- name: Impaired VEGF-C activation and lymphangiogenesis
  description: >-
    Reduced VEGF-C/VEGFR-3 signaling impairs lymphatic endothelial cell
    migration and lymphatic vessel formation, producing generalized lymphatic
    dysplasia.
  cell_types:
  - preferred_term: lymphatic endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  biological_processes:
  - preferred_term: lymphangiogenesis
    term:
      id: GO:0001946
      label: lymphangiogenesis
  evidence:
  - reference: PMID:24523457
    reference_title: Ccbe1 regulates Vegfc-mediated induction of Vegfr3 signaling during embryonic lymphangiogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Vegfc- and Vegfr3-dependent Erk signaling is impaired in the absence of
      Ccbe1.
    explanation: >-
      Zebrafish loss-of-function data show that Ccbe1 is required for
      VEGFC/VEGFR3 downstream signaling that drives lymphangiogenesis.
  downstream:
  - target: Generalized lymphatic dysplasia
    description: >-
      Defective lymphangiogenesis produces malformed, dysfunctional lymphatic
      vessels throughout the body.
    evidence:
    - reference: PMID:24523457
      reference_title: Ccbe1 regulates Vegfc-mediated induction of Vegfr3 signaling during embryonic lymphangiogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The role of CCBE1 orthologs is highly conserved in zebrafish, mice and
        humans with mutations in CCBE1 causing generalized lymphatic dysplasia
        and lymphedema (Hennekam syndrome).
      explanation: >-
        Links impaired CCBE1-dependent lymphangiogenesis to the generalized
        lymphatic dysplasia phenotype of Hennekam syndrome.
- name: Generalized lymphatic dysplasia
  description: >-
    Widespread lymphatic vessel dysplasia impairs lymph drainage and underlies
    the intestinal lymphangiectasia, lymphedema, and serous effusions of the
    syndrome.
  cell_types:
  - preferred_term: lymphatic endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  evidence:
  - reference: PMID:19935664
    reference_title: Mutations in CCBE1 cause generalized lymph vessel dysplasia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphedema, lymphangiectasias, mental retardation and unusual facial
      characteristics define the autosomal recessive Hennekam syndrome.
    explanation: >-
      Establishes the generalized lymphatic phenotype (lymphedema and
      lymphangiectasias) as defining features of the disorder.
  downstream:
  - target: Intestinal lymphangiectasia
    description: >-
      Dysplastic intestinal lymphatics dilate and leak lymph into the gut lumen.
    causal_link_type: DIRECT
  - target: Lymphedema
    description: >-
      Impaired lymphatic drainage in the limbs, genitalia, and face causes
      lymphedema.
    causal_link_type: DIRECT
- name: Intestinal lymphangiectasia
  description: >-
    Dilated intestinal lymphatics leak protein-rich lymph into the gut,
    producing protein-losing enteropathy with hypoalbuminemia,
    hypogammaglobulinemia, and lymphopenia.
  evidence:
  - reference: PMID:2624276
    reference_title: Autosomal recessive intestinal lymphangiectasia and lymphedema, with facial anomalies and mental retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on two male and two female relatives with intestinal
      lymphangiectasia; severe lymphedema of limbs, genitalia, and face; facial
      anomalies; seizures; mild growth retardation; and moderate mental
      retardation.
    explanation: >-
      The original clinical description documents intestinal lymphangiectasia as
      a core feature of the syndrome.
  downstream:
  - target: Protein-losing enteropathy
    description: >-
      Enteric loss of lymph depletes serum albumin and immunoglobulins.
    causal_link_type: DIRECT

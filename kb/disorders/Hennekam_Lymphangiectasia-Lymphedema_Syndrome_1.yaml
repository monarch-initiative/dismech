    snippet: >-
      Hennekam lymphangiectasia-lymphedema syndrome is an autosomal recessive
      disorder, with 25% of patients having mutations in CCBE1.
    explanation: >-
      States the CCBE1 fraction against the named Hennekam
      lymphangiectasia-lymphedema syndrome rather than against a broader
      clinical cohort.
  variants:
  - name: p.Leu229fs (c.683_684insT)
    description: >-
      Maternally inherited pathogenic loss-of-function frameshift CCBE1 variant;
      listed in gnomAD in 14 of 277,032 chromosomes, consistent with a rare
      recessive disease allele.
    evidence:
    - reference: PMID:30564329
      reference_title: "Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema syndrome-1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A maternally inherited variant, p.Leu229fs (c.683_684insT), was detected
        and confirmed by Sanger sequencing
      explanation: >-
        A specific pathogenic loss-of-function frameshift CCBE1 allele.
    - reference: PMID:30564329
      reference_title: "Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema syndrome-1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        listed in the Genome Aggregation Database (gnomAD) Browser in 14 out of
        277 032 chromosomes
      explanation: >-
        Population allele frequency of the frameshift variant, consistent with a
        rare recessive disease allele.
  - name: p.Arg158Cys (c.472C>T)
    description: >-
      Recurrent missense CCBE1 allele, reported homozygous in an infant with
      intestinal lymphangiectasia and ascites and separately as one half of a
      compound heterozygous genotype (with c.521G>A) in a second child.
    evidence:
    - reference: PMID:32629717
      reference_title: "Intestinal lymphangiectasia in a 3-month-old girl: A case report of Hennekam syndrome caused by CCBE1 mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genetic investigations identified the genomic variant c.472C>T of the
        CCBE1 gene, coding for a protein variant (p.Arg158Cys), in homozygosity.
      explanation: >-
        Establishes the allele and its protein consequence in a homozygous
        HKLLS1 patient.
    - reference: PMID:32472549
      reference_title: "[Variant analysis of CCBE1 gene in a case of Hennekam lymphangiectasia-lymphedema syndrome type 1]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The patient was found to carry compound heterozygote variants (c.521G>A
        and c.472C>T) of the CCBE1 gene, which were respectively inherited from
        his parents.
      explanation: >-
        Independent recurrence of c.472C>T, here in trans with c.521G>A, which
        is what distinguishes a recurrent disease allele from a private one.
  - name: p.Cys174Tyr (C174Y)
    description: >-
      Recurrent homozygous missense CCBE1 allele, reported in two Turkish
      siblings of consanguineous parents and previously in a Dutch kindred. It
      is one of a cluster of alleles hitting cysteine residues in the EGF
      domain, whose disulfide linkages make them likely to disrupt the domain's
      tertiary structure. Functionally it is notable for a split result: in
      transfected cells the mutant protein shows increased intracellular
      expression and increased secretion, yet CCBE1 is scarce in the patients'
      own intestinal tissue by immunohistochemistry. The authors leave the
      reconciliation open between a secreted-but-misfolded protein and one that
      is rapidly degraded in vivo, so this allele is not loss-of-expression at
      the synthesis level without being a protein that is present where it is
      needed.
    evidence:
    - reference: PMID:26686525
      reference_title: "A Multiplex Kindred with Hennekam Syndrome due to Homozygosity for a CCBE1 Mutation that does not Prevent Protein Expression."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified by whole exome and Sanger sequencing the homozygous CCBE1
        C174Y mutation in both siblings. This mutation had been previously
        reported in another HS kindred from the Netherlands.
      explanation: >-
        Establishes the allele, its homozygous state in affected siblings, and
        its independent recurrence in a second kindred.
    - reference: PMID:25925991
      reference_title: "A novel CCBE1 mutation leading to a mild form of hennekam syndrome: case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All of these mutations affect cysteine residues within the EGF domain
        and given the disulfide linkages within EGF domains, it is reasonable
        to assume all of them will disrupt the tertiary structure of the domain
        to a certain degree.
      explanation: >-
        Places C174Y in the EGF-domain cysteine cluster and gives the structural
        reason those alleles are damaging, which complements the domain-level
        result from the knock-in mouse series.
  - name: p.Cys98Trp (p.C98W)
    description: >-
      Homozygous missense CCBE1 allele identified in a consanguineous family.
      Notable because the child had lymphatic dysplasia with protein-losing
      enteropathy but no intellectual disability and no dysmorphism, marking the
      mild end of the HKLLS1 spectrum.
    evidence:
    - reference: PMID:25925991
      reference_title: "A novel CCBE1 mutation leading to a mild form of hennekam syndrome: case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified several large stretches of homozygosity in the patient
        that allowed us to sort the variants found in the patient's exome to
        identify p.C98W in CCBE1 as the likely pathogenic variant.
      explanation: >-
        Establishes the allele and how it was ascertained.
    - reference: PMID:25925991
      reference_title: "A novel CCBE1 mutation leading to a mild form of hennekam syndrome: case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The patient we describe here has a lymphatic dysplasia without
        intellectual disability or dysmorphism caused by mutation in CCBE1,
        highlighting the phenotypic variability that can be seen with
        abnormalities in this gene.
      explanation: >-
        Documents the attenuated phenotype attached to this allele, and is the
        source for the wide expressivity recorded in clinical_burden.
  - name: p.Asp104Asn (c.310G>A)
    description: >-
      Paternally inherited missense CCBE1 allele in two affected brothers with
      primary lymphedema, in trans with p.Leu27Pro. It sits adjacent to other
      known pathogenic CCBE1 mutations, and zebrafish assay showed loss of
      function.
    evidence:
    - reference: PMID:27345729
      reference_title: "Expanding the genotypic spectrum of CCBE1 mutations in Hennekam syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The presumed paternally inherited NM_133459.3:c.310G>A; p.(Asp104Asn),
        lies adjacent to other known pathogenic CCBE1 mutations
      explanation: >-
        Establishes the allele, its inheritance, and its position relative to
        known pathogenic variants.
    - reference: PMID:27345729
      reference_title: "Expanding the genotypic spectrum of CCBE1 mutations in Hennekam syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Functional analysis in a zebrafish model of lymphatic disease showed
        that both mutations lead to CCBE1 loss of function, confirming the
        pathogenicity of these variants and expanding the genotypic spectrum of
        lymphatic disorders.
      explanation: >-
        Functional confirmation that this allele is loss-of-function rather than
        an incidental rare variant.
  - name: p.Leu27Pro (c.80T>C)
    description: >-
      Maternally inherited missense CCBE1 allele in the CCBE1 signal peptide,
      in trans with p.Asp104Asn. The signal peptide had not previously been
      implicated in disease, so this allele extends the mutable region of the
      protein beyond the collagen and EGF domains.
    evidence:
    - reference: PMID:27345729
      reference_title: "Expanding the genotypic spectrum of CCBE1 mutations in Hennekam syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the maternally inherited NM_133459.3:c.80T>C; p.(Leu27Pro) lies in the
        CCBE1 signal peptide, which has not previously been associated with
        disease
      explanation: >-
        Establishes the allele and the novelty of its location within CCBE1.
  - name: p.Thr112Ile (c.335C>T)
    description: >-
      Paternally inherited likely-pathogenic missense CCBE1 variant, in trans
      with the frameshift allele (compound heterozygosity).
    evidence:
    - reference: PMID:30564329
      reference_title: "Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema syndrome-1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A paternally inherited variant, p.Thr112Ile (c.335C>T) variant was
        detected and confirmed by Sanger sequencing
      explanation: >-
        A specific likely-pathogenic missense CCBE1 allele in trans with the
        frameshift variant.
diagnosis:
- name: Molecular genetic testing of CCBE1
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequencing and deletion/duplication analysis of CCBE1 confirms the diagnosis
    in individuals with syndromic generalized lymphatic dysplasia; a panel or
    exome approach also covers FAT4 and ADAMTS3.
  results: >-
    Biallelic pathogenic CCBE1 variants confirm HKLLS1.
  evidence:
  - reference: PMID:19935664
    reference_title: Mutations in CCBE1 cause generalized lymph vessel dysplasia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping identified a critical chromosomal region containing
      CCBE1, the human ortholog of a gene essential for lymphangiogenesis in
      zebrafish.
    explanation: >-
      Supports molecular confirmation by identification of causal CCBE1
      variants.
- name: Lymphoscintigraphy
  diagnosis_term:
    preferred_term: lymphoscintigraphy
    term:
      id: NCIT:C67262
      label: Lymphoscintigraphy
  description: >-
    Radionuclide lymphatic imaging demonstrates the site of lymph leakage and
    confirms intestinal lymphangiectasia non-invasively.
  results: >-
    Abnormal tracer leakage into the abdomen indicates intestinal
    lymphangiectasia.
  evidence:
  - reference: PMID:32629717
    reference_title: "Intestinal lymphangiectasia in a 3-month-old girl: A case report of Hennekam syndrome caused by CCBE1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphoscintigraphy with 99m-Tc-nanocolloid demonstrated abnormal leakage
      of the tracer in the abdomen as evidence of IL.
    explanation: >-
      Documents lymphoscintigraphy establishing intestinal lymphangiectasia in a
      homozygous-CCBE1 patient.
- name: Stool alpha-1-antitrypsin measurement
  diagnosis_term:
    preferred_term: alpha-1 antitrypsin measurement
    term:
      id: NCIT:C80167
      label: Alpha-1 Antitrypsin Measurement
  description: >-
    Faecal alpha-1-antitrypsin is the standard confirmation of enteric protein
    loss, since the protein is not actively secreted or absorbed by the gut and
    resists intestinal degradation. It is the test that establishes
    protein-losing enteropathy independently of where the lesion sits.
  results: >-
    Raised stool alpha-1-antitrypsin with low serum albumin confirms
    protein-losing enteropathy.
  notes: >-
    Endoscopic biopsy is not a reliable substitute here. In a molecularly
    confirmed HKLLS1 patient with raised stool alpha-1-antitrypsin, endoscopic
    biopsies were reported as normal, because the lymphangiectasia can be
    segmental and patchy and so missed by sampling.
  evidence:
  - reference: PMID:40394495
    reference_title: "Recurrent pericardial effusion due to Hennekam lymphangiectasia-lymphedema syndrome: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the disease course, laboratory tests showed decreased blood albumin
      and increased stool α1-antitrypsin, while endoscopy biopsies were normal.
    explanation: >-
      In a molecularly confirmed HKLLS1 patient, stool alpha-1-antitrypsin was
      the abnormal test while endoscopic biopsy was not, which supports both the
      diagnostic value of this assay and the caveat recorded in notes.
treatments:
- name: Dietary management of protein-losing enteropathy
  description: >-
    A low-fat, high-protein diet enriched in medium-chain triglycerides reduces
    intestinal lymphatic load and enteric protein loss from intestinal
    lymphangiectasia; supplemental nutrition supports growth.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Protein-losing enteropathy
    description: >-
      Reducing long-chain-triglyceride load lowers intestinal lymphatic
      pressure, so less protein-rich lymph is lost into the gut. This acts on
      the enteropathy itself rather than replacing what has been lost.
    evidence:
    - reference: PMID:19449286
      reference_title: "Evidence for medium chain triglycerides in the treatment of primary intestinal lymphangiectasia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        17 of 27 cases (63%) treated with MCT had complete resolution of
        symptoms while only 10 of 28 (35.7%) patients in group B showed
        complete resolution.
      explanation: >-
        Quantifies the effect of the MCT diet on the enteropathy across 55
        collected cases. The series is primary intestinal lymphangiectasia
        rather than HKLLS1, so this is the general efficacy of the intervention
        against the mechanism HKLLS1 produces.
  evidence:
  - reference: PMID:29560340
    reference_title: "Hennekam Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients may require a high-protein, low-fat diet with medium-chain
      triglyceride supplementation in the case
    explanation: >-
      Directly supports a high-protein, low-fat, medium-chain-triglyceride diet
      for the protein-losing enteropathy of Hennekam syndrome.
  - reference: PMID:32629717
    reference_title: "Intestinal lymphangiectasia in a 3-month-old girl: A case report of Hennekam syndrome caused by CCBE1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      serum albumin and IgG rose to normal values after 3 months (4.3 g/dL and
      501 mg/dL, respectively)
    explanation: >-
      In a homozygous-CCBE1 infant managed with parenteral then enteral
      nutrition, correcting the enteric protein loss restored both albumin and
      IgG. This is the on-disease evidence that the nutritional arm addresses
      the cause; no immunoglobulin was given in that case.
  - reference: PMID:19449286
    reference_title: "Evidence for medium chain triglycerides in the treatment of primary intestinal lymphangiectasia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality for Group A was 1 out of 27 (3.7%), while mortality in group B
      was 5 of 28 (17.85%) patients.
    explanation: >-
      Reports the mortality difference between MCT-treated and untreated
      intestinal lymphangiectasia, which is why this diet is the cornerstone
      rather than one option among several. The series is primary intestinal
      lymphangiectasia, not HKLLS1.
  - reference: PMID:26686525
    reference_title: "A Multiplex Kindred with Hennekam Syndrome due to Homozygosity for a CCBE1 Mutation that does not Prevent Protein Expression."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      without necessitating albumin or immunoglobulin replacement for 15 months
    explanation: >-
      In a genotype-confirmed CCBE1 patient, optimizing the
      medium-chain-triglyceride diet normalized serum protein and immunoglobulin
      and removed the need for replacement therapy for 15 months. This is the
      causal ordering the entry argues for - the diet acts on the enteric loss
      itself, while replacement substitutes for what is lost.
- name: Lymphedema supportive care
  description: >-
    Complete decongestive therapy (compression, manual lymphatic drainage,
    exercise, skin care) manages the lymphedema; a Hennekam case showed measurable
    limb-circumference reduction with this approach.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:29560340
    reference_title: "Hennekam Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      rehabilitative treatments including complete decongestive therapy for
      edema control appeared to be beneficial
    explanation: >-
      The case report concludes that complete decongestive therapy was
      beneficial for edema control in a patient with Hennekam syndrome.
  - reference: PMID:29560340
    reference_title: "Hennekam Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      upper arm, from 22 cm to 19 cm; forearm, from 22.5 cm to 21 cm,
      respectively.
    explanation: >-
      Complete decongestive therapy produced a measurable reduction in
      upper-arm and forearm circumference in a Hennekam syndrome patient.
- name: Supportive and multidisciplinary care
  description: >-
    Management is symptomatic and multidisciplinary, including nutritional
    support, monitoring for hypoalbuminemia and immunodeficiency, and developmental
    and educational support according to the individual's findings.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26686525
    reference_title: A Multiplex Kindred with Hennekam Syndrome due to Homozygosity for a CCBE1 Mutation
      that does not Prevent Protein Expression.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Both siblings had a history of mild development delay requiring extra scholarly assistance
      to pass primary school, compared to their healthy unaffected siblings.
    explanation: The CCBE1 siblings required educational support alongside treatment for enteropathy;
      this supports individualized multidisciplinary care rather than a subtype-specific protocol.
- name: Genetic counseling
  description: >-
    Counsel families about autosomal recessive inheritance, 25% sibling
    recurrence risk, carrier testing, and reproductive options.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:19935664
    reference_title: Mutations in CCBE1 cause generalized lymph vessel dysplasia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous and compound heterozygous mutations in seven subjects paired
      with functional analysis in a zebrafish model identify CCBE1 as one of few
      genes causing primary generalized lymph-vessel dysplasia in humans.
    explanation: >-
      Autosomal recessive biallelic inheritance is the basis for recurrence-risk
      counseling.
- name: Immunoglobulin replacement therapy
  description: >-
    The hypogammaglobulinemia of HKLLS1 is a secondary immunodeficiency driven
    by enteric loss of immunoglobulin, not a primary defect of B-cell
    development, so the dietary control of lymph loss is the treatment that
    addresses the cause. Immunoglobulin replacement is used for symptomatic
    hypogammaglobulinemia alongside it; intravenous administration does not
    always achieve satisfactory plasma levels, and subcutaneous administration
    has been reported to do better in intestinal lymphangiectasia. Two
    genotype-confirmed CCBE1 patients in one kindred document its use in HKLLS1
    itself, one of whom no longer needed replacement once the
    medium-chain-triglyceride diet was optimized.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_mechanisms:
  - target: Decreased circulating immunoglobulin concentration
    description: >-
      Replaces the immunoglobulin lost into the gut rather than correcting the
      enteric loss itself.
    evidence:
    - reference: PMID:26934740
      reference_title: "Secondary hypogammaglobulinemia in Waldmann's disease treated with subcutaneous immunoglobulins."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe here the case of a patient with PIL and severe
        hypogammaglobulinemia treated with immunoglobulins.
      explanation: >-
        Establishes that this treatment is directed at the hypogammaglobulinemia
        of intestinal lymphangiectasia, which is the node this link names. The
        case is primary intestinal lymphangiectasia rather than HKLLS1, so the
        link rests on the shared enteric-loss mechanism.
  evidence:
  - reference: PMID:26934740
    reference_title: "Secondary hypogammaglobulinemia in Waldmann's disease treated with subcutaneous immunoglobulins."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The administration of intravenous immunoglobulins does not always lead to
      satisfactory plasma levels and therefore the replacement therapy with
      immunoglobulins is controversial.
    explanation: >-
      Documents both the use of immunoglobulin replacement for the secondary
      hypogammaglobulinemia of intestinal lymphangiectasia and the caveat about
      intravenous dosing. The report is of a primary intestinal lymphangiectasia
      patient rather than a molecularly confirmed HKLLS1 patient, so the
      transfer rests on the shared enteric-loss mechanism.
  - reference: PMID:26686525
    reference_title: "A Multiplex Kindred with Hennekam Syndrome due to Homozygosity for a CCBE1 Mutation that does not Prevent Protein Expression."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was treated with albumin and immunoglobulin replacements (750 mg/kg
      every 2 weeks), aggressive diuresis (furosemide and aldactone), and
      modified diet (20 % protein, 50 % carbohydrate, 30% fat of which 50% are
      composed of medium-chain triglycerides) with significant improvement in
      edema, protein losing enteropathy, and hypogammaglobulinemia
    explanation: >-
      Immunoglobulin replacement with a stated dose in a genotype-confirmed
      CCBE1 C174Y patient, with improvement in the hypogammaglobulinemia it
      targets. This is the on-disease support the link previously lacked; note
      it was given alongside a medium-chain-triglyceride diet, so the two arms
      were not separated in this patient.
  - reference: PMID:26686525
    reference_title: "A Multiplex Kindred with Hennekam Syndrome due to Homozygosity for a CCBE1 Mutation that does not Prevent Protein Expression."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hypogammaglobulinemia (615 mg/dL) requiring intravenous immunoglobulin
      substitution (30 gm every 3 to 4 weeks)
    explanation: >-
      A second genotype-confirmed patient in the same kindred on ongoing
      intravenous immunoglobulin, which establishes the treatment as a
      continuing requirement rather than a one-off in this disorder.
- name: Octreotide for refractory protein-losing enteropathy
  description: >-
    Second-line pharmacotherapy for intestinal lymphangiectasia when the
    medium-chain-triglyceride diet fails to control enteric protein loss. It is
    costly and requires parenteral administration. No HKLLS1-specific trial
    exists; the evidence is from intestinal lymphangiectasia generally.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: octreotide
      term:
        id: CHEBI:7726
        label: octreotide
  target_mechanisms:
  - target: Protein-losing enteropathy
    description: >-
      Used to reduce enteric protein loss when dietary management alone is
      insufficient.
    evidence:
    - reference: PMID:14723832
      reference_title: "Primary Intestinal Lymphangiectasia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Octreotide has been helpful in cases in which treatment with MCT has
        failed, but it is costly and requires parenteral administration.
      explanation: >-
        Places octreotide's action on the enteropathy itself, after dietary
        management, which is the node and the position this link asserts.
  evidence:
  - reference: PMID:14723832
    reference_title: "Primary Intestinal Lymphangiectasia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Octreotide has been helpful in cases in which treatment with MCT has
      failed, but it is costly and requires parenteral administration.
    explanation: >-
      Positions octreotide as second-line after MCT for intestinal
      lymphangiectasia, with its cost and route as the stated drawbacks. The
      source addresses primary intestinal lymphangiectasia rather than HKLLS1,
      so this is the general management of the enteropathy this disease causes.
animal_models:
- name: Ccbe1-null mouse
  species: Mus musculus
  genotype: Ccbe1 constitutive null (Ccbe1 mutant embryos)
  category: KNOCKOUT
  publication: PMID:21778431
  genes:
  - preferred_term: CCBE1
    term:
      id: hgnc:29426
      label: CCBE1
  description: >-
    The first mammalian model of CCBE1 deficiency. Ccbe1 mutant embryos specify
    PROX1-positive lymphatic endothelial cells within the cardinal vein but fail
    to bud and migrate from it, so no definitive lymphatic structures form, and
    the embryos die prenatally. Recombinant CCBE1 has little lymphangiogenic
    activity alone yet strongly potentiates VEGF-C in a corneal micropocket
    assay, which is what established CCBE1 as necessary but not sufficient for
    lymphangiogenesis.
  evidence:
  - reference: PMID:21778431
    reference_title: "CCBE1 is essential for mammalian lymphatic vascular development and enhances the lymphangiogenic effect of vascular endothelial growth factor-C in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Collagen- and calcium-binding EGF domains 1 (CCBE1) has been associated
      with Hennekam syndrome, in which patients have lymphedema,
      lymphangiectasias, and other cardiovascular anomalies.
    explanation: >-
      States the gene-disease relationship this mouse was made to model, which
      is what makes a Ccbe1-null animal relevant to HKLLS1.
  modeled_mechanisms:
  - target: Failed lymphangiogenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Loss of Ccbe1 in the mouse blocks budding and migration of Prox1-positive
      lymphatic endothelial cells from the cardinal vein, which is exactly the
      cellular step this node names.
    limitations: >-
      The model speaks to the cellular step, not to the upstream activation
      node: VEGFR-3 activation appeared unaltered in the mutants by proximity
      ligation assay, so this animal does not itself demonstrate reduced
      receptor signalling and is not linked to the proteolytic-activation node.
      Being a constitutive null, it also models complete loss rather than the
      hypomorphic alleles many patients carry.
    evidence:
    - reference: PMID:21778431

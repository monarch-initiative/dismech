      and review of the literature.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: She was diagnosed with a protein losing enteropathy secondary to segmental primary intestinal
      lymphangiectasia.
    explanation: Direct CCBE1 evidence links intestinal lymphangiectasia to enteric protein loss.

  - reference: PMID:26686525
    reference_title: "A Multiplex Kindred with Hennekam Syndrome due to Homozygosity for a CCBE1 Mutation that does not Prevent Protein Expression."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found a strong decrease of lymphatic vessels, with a corresponding
      diminished expression of CCBE1, by immunohistochemistry of the patients'
      intestinal biopsies
    explanation: >-
      Human intestinal tissue from CCBE1-mutant patients shows the lymphatic
      vessel loss this node asserts. The rest of the support for this node is
      from zebrafish and mouse, so this is the observation that anchors it in
      human disease rather than in model systems.
  downstream:
  - target: Generalized lymphatic dysplasia
    description: >-
      Defective lymphangiogenesis produces malformed, dysfunctional lymphatic
      vessels throughout the body.
    evidence:
    - reference: PMID:24523457
      reference_title: Ccbe1 regulates Vegfc-mediated induction of Vegfr3 signaling during embryonic lymphangiogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The role of CCBE1 orthologs is highly conserved in zebrafish, mice and
        humans with mutations in CCBE1 causing generalized lymphatic dysplasia
        and lymphedema (Hennekam syndrome).
      explanation: >-
        Links impaired CCBE1-dependent lymphangiogenesis to the generalized
        lymphatic dysplasia phenotype of Hennekam syndrome.
- name: Generalized lymphatic dysplasia
  biological_scale: TISSUE
  description: >-
    Widespread lymphatic vessel dysplasia impairs lymph drainage and underlies
    the intestinal lymphangiectasia, lymphedema, and serous effusions of the
    syndrome.
  cell_types:
  - preferred_term: lymphatic endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  evidence:
  - reference: PMID:19935664
    reference_title: Mutations in CCBE1 cause generalized lymph vessel dysplasia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphedema, lymphangiectasias, mental retardation and unusual facial
      characteristics define the autosomal recessive Hennekam syndrome.
    explanation: >-
      Establishes the generalized lymphatic phenotype (lymphedema and
      lymphangiectasias) as defining features of the disorder.
  downstream:
  - target: Intestinal lymphangiectasia
    description: >-
      Dysplastic intestinal lymphatics dilate and leak lymph into the gut lumen.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30564329
      reference_title: "Novel mutation in CCBE 1 as a cause of recurrent hydrops fetalis from Hennekam lymphangiectasia-lymphedema syndrome-1."

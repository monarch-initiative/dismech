    snippet: All patients carryingCCBE1mutations had lymphedema of the limbs, unusual face and lymphangiectasia
      in the gut, representing the most distinctive features of the syndrome.
    explanation: The genotype-stratified cohort documents limb lymphedema in the CCBE1-positive group.

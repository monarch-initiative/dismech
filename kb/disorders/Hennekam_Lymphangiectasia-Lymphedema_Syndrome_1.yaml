- name: Lymphedema
  category: Lymphatic
  diagnostic: true
  description: Limb lymphedema is a core feature of generalized lymphatic dysplasia. Genital and facial
    edema can accompany it; distribution and severity vary.
  notes: Edema is often described as progressive in Hennekam syndrome, but the course is not
    uniformly progressive in CCBE1 disease. Peripheral lymphedema regressed after dietary optimization
    in a molecularly confirmed adult, so no uniform PROGRESSIVE qualifier is assigned.
  phenotype_term:
    preferred_term: Lymphedema
    term:
      id: HP:0001004
      label: Lymphedema
    temporality: CHRONIC

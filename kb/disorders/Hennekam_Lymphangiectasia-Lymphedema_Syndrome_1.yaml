      respectively.
    explanation: >-
      Complete decongestive therapy produced a measurable reduction in
      upper-arm and forearm circumference in a Hennekam syndrome patient.
- name: Lymphedema surgery
  description: >-
    Surgery is a treatment of last resort for lymphedema, reserved for severe
    disease that has not responded to conservative decongestive management. It
    can improve limb size and restore some function. The published Hennekam case
    managed with complete decongestive therapy did not proceed to surgery, the
    lymphedema not being severe enough to cause functional limitation, which
    illustrates where the threshold sits in practice.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure

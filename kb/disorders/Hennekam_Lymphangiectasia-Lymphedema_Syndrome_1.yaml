treatments:
- name: Dietary management of protein-losing enteropathy
  description: >-
    A low-fat, high-protein diet enriched in medium-chain triglycerides reduces
    intestinal lymphatic load and enteric protein loss from intestinal
    lymphangiectasia; supplemental nutrition supports growth.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:29560340
    reference_title: "Hennekam Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients may require a high-protein, low-fat diet with medium-chain
      triglyceride supplementation in the case
    explanation: >-
      Directly supports a high-protein, low-fat, medium-chain-triglyceride diet
      for the protein-losing enteropathy of Hennekam syndrome.
  - reference: PMID:18294365
    reference_title: "Primary intestinal lymphangiectasia (Waldmann's disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of fat in the diet prevents chyle engorgement of the intestinal lymphatic vessels thereby preventing their rupture with its ensuing lymph loss. Medium-chain triglycerides are absorbed directly into the portal venous circulation and avoid lacteal overloading.
    explanation: >-
      Gives the mechanism by which the diet works, which is what makes it a
      mechanism-directed rather than merely nutritional intervention: long-chain
      fat is withheld to stop the lacteals engorging and rupturing, and
      medium-chain triglycerides bypass them via the portal circulation.
  - reference: PMID:18294365
    reference_title: "Primary intestinal lymphangiectasia (Waldmann's disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The need for dietary control appears to be permanent, because clinical and biochemical findings reappear after low-fat diet withdrawal.
    explanation: >-
      Establishes that the dietary restriction is indefinite, since the
      biochemical abnormalities return on withdrawal.
- name: Lymphedema supportive care
  description: >-
    Complete decongestive therapy (compression, manual lymphatic drainage,
    exercise, skin care) manages the lymphedema; a Hennekam case showed measurable
    limb-circumference reduction with this approach.
  therapeutic_modality: BEHAVIORAL

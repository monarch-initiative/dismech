datasets:
- accession: geo:GSE333903
  title: Human metapneumovirus and mumps virus alter the m6A landscapes in THP-1-derived immature dendritic cells
  description: N6-methyladenosine (m6A) is a widespread mRNA modification that regulates RNA metabolism and influences virus-induced immune responses. We performed MeRIP-seq to profile m6A landscapes in THP-1-derived immature dendritic cells (THP-iDCs) before and after infection with Human metapneumovirus (hMPV, NL/00/1) or mumps virus (MuV, JL2). Integration of m6A modifications on key innate immune transcripts with transcriptomic data, together with m6A levels on cellular and viral RNA, revealed a dual role of m6A in viral replication and host immune regulation. These datasets provide a resource for exploring epitranscriptomic regulation during hMPV and MuV infection.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 12
  notes: Identified by GEO DataSets index search for Mumps (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE333647
  title: m6A modification landscapes of human metapneumovirus, mumps virus, and host A549 cell RNAs revealed by single-base-resolution GLORI-seq [A549 GLORI]
  description: N6-methyladenosine (m6A) is a common modification on mRNA. Multiple viruses exploit host m6A machinery to modify their own genomic RNA and mRNA, thereby facilitating viral replication and evasion of host innate immune surveillance. In this study, we employed the single-base-resolution high-throughput sequencing technique glyoxal and nitrite-mediated deamination of unmethylated adenosines (GLORI) to identify m6A modification sites on the RNAs of Human metapneumovirus (hMPV, NL/1/00 strain) and Mumps virus (MuV, JL2 strain), as well as to characterize the m6A landscapes of the host cell transcriptome in A549 lung epithelial cells.
  organism:
    preferred_term: human
    term:

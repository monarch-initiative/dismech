      explanation: Gives the case fraction and names the cohorts it applies to.
  evidence:
  - reference: PMID:24777450
    reference_title: "RAF1 mutations in childhood-onset dilated cardiomyopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings provide new mechanistic insights and potential therapeutic
      targets for RAF1-associated DCM and further expand the clinical spectrum of
      RAF1-related human disorders.
    explanation: >-
      The discovery report's own causal conclusion, and its framing of the entity
      as an expansion of the RAF1 clinical spectrum rather than a form of Noonan
      syndrome.
  - reference: PMID:30762279
    reference_title: "Prevalence of pathogenic and likely pathogenic variants in the RASopathy genes in patients who have had panel testing for cardiomyopathy."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified four patients (5.41%) with pathogenic or likely pathogenic
      variants in HRAS, PTPN11 and RAF1 (two individuals). Indication for testing
      for all four individuals was HCM.
    explanation: >-
      Counter-evidence recorded deliberately. In a clinical cardiomyopathy panel
      cohort that included 24 dilated cardiomyopathy cases and 9 with combined
      noncompaction and dilated disease, every pathogenic RASopathy-gene finding
      came from a patient tested for hypertrophic cardiomyopathy. It does not
      refute the gene-disease relationship, but it refutes any expectation that
      RAF1 is a frequent yield in unselected dilated cardiomyopathy, and it is why
      the discovery case fraction is not generalised.
animal_models:
- name: Zebrafish cardiac expression of DCM-associated RAF1 mutants
  species: Zebrafish
  genotype: >-
    Constitutive embryonic expression of human dilated-cardiomyopathy-associated
    RAF1 missense mutants
  description: >-
    The in vivo model behind the CMD1NN mechanism. Zebrafish embryos constitutively
    expressing the dilated-cardiomyopathy RAF1 mutants developed a heart failure
    phenotype accompanied by AKT hyperactivation, and treatment with rapamycin
    rescued it. The rescue arm is what makes this model do mechanistic work rather
    than merely demonstrate toxicity: it places mTOR in the causal path.
  publication: PMID:24777450
  modeled_mechanisms:
  - target: mTOR Pathway Activation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model reproduces the AKT-hyperactivated, mTOR-dependent cardiac failure
      that this node asserts, and the rapamycin rescue establishes the dependence
      rather than merely the correlation.
    limitations: >-
      Constitutive transgenic expression is not the human genetic situation, which
      is a single heterozygous missense allele at endogenous dosage; overexpression
      can produce signalling phenotypes that a heterozygous allele would not. The
      zebrafish heart is two-chambered and regenerative, so chamber dilation,
      chronic fibrosis and the human developmental timescale are not modelled.
    readouts:
    - name: Rapamycin rescue of the cardiac failure phenotype
      target: mTOR Pathway Activation
      direction: RESTORED
      interpretation: >-
        Pharmacological mTOR inhibition reverses the mutant phenotype, which is the
        measurement that places mTOR signalling in the causal chain.
      evidence:
      - reference: PMID:24777450

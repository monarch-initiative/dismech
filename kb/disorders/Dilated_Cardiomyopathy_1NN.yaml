name: Dilated Cardiomyopathy 1NN
creation_date: "2026-09-02T00:00:00Z"
synonyms:
- CMD1NN
- DCM1NN
- dilated cardiomyopathy type 1NN
- cardiomyopathy, dilated, 1NN
- RAF1 familial isolated dilated cardiomyopathy
- RAF1-related childhood-onset dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 1NN (CMD1NN, OMIM 615916) is the RAF1-related member of
  the numbered familial isolated dilated cardiomyopathy series. It is the
  mechanistically awkward member of that series and the reason it is curated
  separately: RAF1 is a RASopathy gene, and the phenotype normally produced by a
  disease-causing RAF1 allele is the opposite one. Noonan-syndrome RAF1 alleles
  cluster in two hotspots around Ser259, raise kinase activity, enhance ERK
  activation, and produce hypertrophic cardiomyopathy in 95% of hotspot carriers.
  The alleles reported in CMD1NN behave differently. Dhandapany and colleagues
  resequenced 513 dilated cardiomyopathy cases against 1,150 matched controls
  across South Indian, North Indian and Japanese cohorts, found rare functional
  RAF1 variants in all three, and showed biochemically that these mutants left
  ERK activation largely unaltered while hyperactivating AKT in a BRAF-dependent
  manner. Cardiac expression of the mutants in zebrafish produced heart failure
  with AKT hyperactivation that rapamycin rescued, implicating the AKT-mTOR arm
  rather than the ERK arm that drives the RASopathy hypertrophic phenotype. The
  disease presents as isolated, predominantly childhood-onset left ventricular
  dilation with systolic dysfunction, without the facial, growth or developmental
  features of Noonan syndrome. Evidence rests almost entirely on that 2014
  discovery report and its models; ClinGen has curated RAF1 for Noonan syndrome
  (Definitive) but has no gene-disease validity assertion for RAF1-dilated
  cardiomyopathy, and that gap is recorded explicitly below rather than papered
  over.
category: Genetic

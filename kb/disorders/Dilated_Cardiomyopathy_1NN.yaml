treatments:
- name: Heart Failure Pharmacotherapy
  description: >-
    Guideline-directed heart-failure therapy for the manifest phenotype, dosed for
    age. There is no RAF1-directed or CMD1NN-specific approved therapy, so
    management is phenotype-based and identical to that for other genetic dilated
    cardiomyopathies.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: Heart Transplantation
  description: >-
    Advanced, refractory disease is an indication for transplantation, which is a
    common outcome in severe childhood-onset cardiomyopathy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  evidence:
  - reference: PMID:30384889
    reference_title: "Genetic Basis of Severe Childhood-Onset Cardiomyopathies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Childhood cardiomyopathies are progressive and often lethal disorders,
      forming the most common cause of heart failure in children.
    explanation: >-
      Supports the severity that makes transplantation a realistic endpoint in this
      disease class. INDIRECT because the cohort is childhood cardiomyopathy
      generally.
discussions:
- discussion_id: cmd1nn_gene_disease_validity_unadjudicated
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Would RAF1-dilated cardiomyopathy survive a formal ClinGen gene-disease
    validity curation as an entity distinct from RAF1-Noonan syndrome?
  attaches_to:
  - genetic#RAF1
  rationale: >-
    ClinGen's RASopathy Gene Curation Expert Panel has curated RAF1 against Noonan
    syndrome and classified it Definitive. No ClinGen assertion exists for
    RAF1 against dilated cardiomyopathy, so the entity's gene-disease validity has
    never been graded by the body whose gradings this knowledge base otherwise
    treats as authoritative. The supporting human genetic evidence is
    concentrated in a single 2014 case-control resequencing report, and a
    subsequent clinical panel cohort found pathogenic RASopathy-gene variants only
    among patients tested for hypertrophic cardiomyopathy. This is a gap in
    adjudication rather than a positive refutation - the mechanism evidence is
    strong and independent - but it is the reason this entry does not describe the
    gene-disease relationship as definitive.
  evidence:
  - reference: CGGV:assertion_85645d27-2056-4ad3-9593-8d7739aa4121-2024-10-23T160000.000Z
    reference_title: "RAF1 / Noonan syndrome (Definitive)"
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      RAF1 | HGNC:9829 | Noonan syndrome | MONDO:0018997 | AD | Definitive
    explanation: >-
      Shows the disease against which ClinGen has actually curated RAF1. The
      absence of a corresponding dilated-cardiomyopathy row is the gap.
- discussion_id: cmd1nn_zebrafish_overexpression_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does constitutive transgenic expression of a RAF1 mutant in a zebrafish embryo
    model what a single heterozygous RAF1 missense allele does to a human
    ventricle?
  attaches_to:
  - pathophysiology#mTOR Pathway Activation
  - animal_models#Zebrafish
  rationale: >-
    The only in vivo evidence for the AKT-mTOR mechanism comes from constitutive
    expression of the mutants in zebrafish embryos. Human CMD1NN is heterozygosity
    for a missense allele at endogenous dosage in a four-chambered,
    non-regenerative heart that dilates over years. Overexpression can drive
    signalling outputs that a heterozygous allele does not, and the zebrafish
    readout was heart failure in an embryo rather than progressive chamber
    dilation. The mismatch matters specifically for the therapeutic inference: the
    rapamycin rescue is the strongest reason to think mTOR inhibition might be
    disease-modifying in patients, and it is exactly the result the model's
    non-physiological expression level puts most at risk.
  proposed_experiments:
  - experiment_id: exp_cmd1nn_isogenic_ipsc_allele_comparison
    name: Isogenic human cardiomyocyte comparison of DCM and HCM RAF1 alleles
    description: >-
      Introduce the reported CMD1NN alleles into human iPSC-derived cardiomyocytes
      or engineered cardiac tissue at endogenous dosage, alongside isogenic
      controls and a Noonan hotspot allele, and measure AKT, mTOR and ERK
      signalling together with contractile function. This is the experiment that
      would show whether the AKT-over-ERK split holds at heterozygous dosage in
      human myocardium, and it has already been done for the Noonan
      p.Ser257Leu allele but not for the dilated-cardiomyopathy alleles.
    would_support:
    - pathophysiology#BRAF-Dependent AKT Hyperactivation
    - pathophysiology#mTOR Pathway Activation
    supporting_outcome:
    - >-
      Heterozygous CMD1NN alleles raise AKT and mTOR pathway activity without
      substantially raising ERK activity, and impair contractile function, in
      isogenic human cardiomyocytes.
    would_refute:
    - pathophysiology#BRAF-Dependent AKT Hyperactivation
    refuting_outcome:
    - >-
      At endogenous heterozygous dosage the CMD1NN alleles produce no measurable
      AKT or mTOR change relative to isogenic controls, indicating the signalling
      phenotype was an artefact of overexpression.
notes: >-
  Lump/split decision: curated as a standalone Disease rather than as a
  has_subtypes entry on Noonan_Syndrome. The considerations were as follows.

  For separation. CMD1NN has its own MONDO term (MONDO:0014396) and its own OMIM
  phenotype number (615916), and MONDO places it under familial isolated dilated
  cardiomyopathy (MONDO:0700335), not under Noonan syndrome. The phenotype is
  isolated - dilated, without the facial, growth or developmental features that
  define a RASopathy. Most importantly the signalling lesion runs the other way:
  the Noonan RAF1 alleles increase kinase activity and enhance ERK activation and
  produce hypertrophy, while the dilated-cardiomyopathy alleles leave ERK largely
  unaltered and hyperactivate AKT. Folding CMD1NN into Noonan_Syndrome as a
  subtype would have placed a non-syndromic, ERK-neutral, dilated phenotype inside
  an entry whose RAF1 pathophysiology node is explicitly "RAF1 Kinase
  Hyperactivation" driving "Cardiomyocyte Hypertrophy" - the conforming node would
  have contradicted its parent.

  What the separation does NOT rest on. The issue that commissioned this entry
  proposed that Noonan RAF1 alleles cluster in the CR2 domain while the CMD1NN
  alleles sit in the CR3/kinase domain, and that this domain segregation justifies
  the split. That was checked and is not clean enough to assert. The six alleles
  listed in the discovery supplement span the CR2-CR3 linker region
  (p.Ala237Thr, p.Thr310Ala, p.Pro332Ala), the kinase domain (p.Leu603Pro) and the
  C-terminal tail (p.His626Arg, p.Thr641Met), while Noonan-associated alleles occur
  both around Ser259 and in the C-terminus. The C-terminal region in particular
  hosts both classes: the DCM-associated L603 and the HCM-associated S612T/L613V
  are separated by fewer than ten residues (PMID:36927384). The defensible
  statement is functional, not positional - the classes differ in the direction of
  their effect on kinase activity and in which downstream arm they engage - and
  that is what this entry asserts.

  Evidence scope. The human genetic evidence is essentially one report
  (PMID:24777450); the mechanism rests on its biochemistry and its zebrafish model.
  No ClinGen gene-disease validity assertion exists for RAF1-dilated
  cardiomyopathy, and a 2019 clinical panel cohort found RASopathy-gene pathogenic
  variants only in hypertrophic-cardiomyopathy referrals (PMID:30762279). Both are
  recorded as structured content - the first as a KNOWLEDGE_GAP discussion, the
  second as a REFUTE evidence item on the gene - rather than left as prose caveats.

  Named entity confusion. The acronym CMD1NN is flagged for ambiguity, and there is
  a documented real-world instance of the label being misapplied: a 2025 case report
  describes a laboratory report annotating RAF1 p.Ser257Leu as "dilated
  cardiomyopathy type 1NN" in a child who in fact had Noonan syndrome with
  hypertrophic cardiomyopathy. p.Ser257Leu is a Noonan hotspot allele and is not a
  CMD1NN allele. Identity here is anchored on MONDO:0014396 / OMIM 615916 and on
  the discovery allele set, not on the acronym.

  Deliberately not done. CMD1NN was not added to
  kb/groupings/Familial_Dilated_Cardiomyopathy.yaml in this change, although it is a
  MONDO child of that grouping's mapped term (MONDO:0700335) and belongs there. The
  grouping's rationale enumerates the mechanistic classes its members represent, and
  a signalling-kinase lesion would be a new one requiring a prose edit; a
  concurrent curation branch is adding another member to the same file, and both
  edits landing blind would conflict. The membership addition is left as a
  follow-up. No treatment entry was created for rapamycin or mTOR inhibition: the
  rescue is preclinical, and it is recorded where it belongs, as a RESTORED readout
  on the zebrafish model.

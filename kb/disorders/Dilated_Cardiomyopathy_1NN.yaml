inheritance:
- name: Autosomal dominant
  description: >-
    CMD1NN is classified as an autosomal dominant trait (OMIM 615916). The
    reported alleles are heterozygous missense substitutions in RAF1, and the
    disease is described in the RASopathy cardiomyopathy literature as an
    inherited RAF1 phenotype. The direct evidence for the mode of inheritance is
    weaker than for the mechanism: the discovery report was a case-control
    resequencing study rather than a large pedigree study, and no
    penetrance estimate specific to RAF1 dilated cardiomyopathy has been
    published, so no penetrance value is recorded here.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:26380542
    reference_title: "Cardiomyopathies in Noonan syndrome and the other RASopathies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, inherited abnormalities in one pathway gene, RAF1, cause
      pediatric-onset dilated cardiomyopathy.
    explanation: >-
      States that the RAF1 dilated cardiomyopathy alleles are inherited rather
      than exclusively de novo, which is the part of the dominant-transmission
      claim this review directly supports. It is INDIRECT for the dominant mode
      itself, which the sentence does not name.
  - reference: PMID:26380542
    reference_title: "Cardiomyopathies in Noonan syndrome and the other RASopathies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Noonan syndrome and related disorders (Noonan syndrome with multiple
      lentigines, Costello syndrome, cardiofaciocutaneous syndrome, Noonan
      syndrome with loose anagen hair, and other related traits) are autosomal
      dominant traits.
    explanation: >-
      Establishes autosomal dominant transmission for heterozygous RAF1-pathway
      alleles generally. It is INDIRECT because the sentence enumerates the
      syndromic RASopathies, not CMD1NN, and is cited here only as the pathway-level
      precedent for a heterozygous missense allele acting dominantly.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    No population prevalence has been established for CMD1NN. The frequently
    quoted "~9%" figure is a case fraction among childhood-onset dilated
    cardiomyopathy in the three discovery cohorts, not a population rate, and is
    recorded as such under `genetic` rather than here.
pathophysiology:
- name: RAF1 Missense Variant Altering Kinase Activity
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The initiating lesion is a rare heterozygous missense substitution in RAF1,
    encoding the RAF-1 (CRAF) serine/threonine kinase of the RAS-MAPK pathway.
    What distinguishes the dilated-cardiomyopathy alleles from the
    Noonan-syndrome ones is not merely their position but the direction of their
    effect on the kinase. The Noonan hotspots flank Ser259 and raise kinase
    activity; the dilated-cardiomyopathy alleles have been reported to have
    reduced kinase activity relative to the hypertrophic-cardiomyopathy alleles
    and to leave the residues critical to regulation unaltered. Molecular
    dynamics of the C-terminal variants makes the same point at residue
    resolution: the DCM-associated p.Leu603Pro substitution drives the kinase
    domain into an inactive conformation, while the HCM-associated S612T and
    L613V substitutions - only a few residues away - stabilise an active one. A
    single gain-of-function or loss-of-function label is therefore not warranted
    across the reported CMD1NN allele set, and none is asserted here.
  genes:
  - preferred_term: RAF1
    term:
      id: hgnc:9829
      label: RAF1
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: RAF-1 serine/threonine kinase activity
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24777450
    reference_title: "RAF1 mutations in childhood-onset dilated cardiomyopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On the basis of resequencing of 513 DCM cases and 1,150 matched controls
      from various cohorts of distinct ancestry, we discovered rare, functional
      RAF1 mutations in 3 of the cohorts (South Indian, North Indian and
      Japanese).
    explanation: >-
      Establishes the trigger lesion - rare functional RAF1 variants - and the
      case-control ascertainment in three independent cohorts that supports it.
  - reference: PMID:36927384
    reference_title: "Molecular analyses of the C-terminal CRAF variants associated with cardiomyopathy reveal their opposing impacts on the active conformation of the kinase domain."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The experimental data suggest that genetic alternation at position 603
      impairs, while those at positions 612/613 enhance the CRAF kinase activity.
    explanation: >-
      States the opposing directional effect of neighbouring C-terminal CRAF
      substitutions, which is the residue-level basis for treating the
      dilated-cardiomyopathy alleles as a distinct functional class rather than
      as more RASopathy gain-of-function alleles.
  - reference: PMID:36927384
    reference_title: "Molecular analyses of the C-terminal CRAF variants associated with cardiomyopathy reveal their opposing impacts on the active conformation of the kinase domain."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      the substitution of Leucine 603 for proline transits the kinase domain to a
      state that exhibits the molecular hallmarks of an inactive kinase, for
      example, a closed activation loop
    explanation: >-
      Gives the structural mechanism by which the DCM-associated p.Leu603Pro
      allele impairs the kinase. INDIRECT because it is a molecular dynamics
      simulation rather than a measurement in patient tissue.
  - reference: PMID:29696744
    reference_title: "NGS testing for cardiomyopathy: Utility of adding RASopathy-associated genes."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      variants have been reported to be functionally distinct, with the
      DCM-associated variants having reduced kinase activity compared to
      HCM-associated variants and unaltered residues critical to regulation
    explanation: >-
      Independent restatement, from a clinical cardiomyopathy sequencing service,
      that the dilated- and hypertrophic-cardiomyopathy RAF1 alleles form
      functionally distinct classes.
  downstream:
  - target: BRAF-Dependent AKT Hyperactivation
    causal_link_type: DIRECT
    description: >-
      The altered RAF-1 kinase redirects signalling into the AKT arm rather than
      amplifying ERK.
    evidence:
    - reference: PMID:24777450
      reference_title: "RAF1 mutations in childhood-onset dilated cardiomyopathy."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Biochemical studies showed that DCM-associated RAF1 mutants had altered
        kinase activity, resulting in largely unaltered ERK activation but in AKT
        that was hyperactivated in a BRAF-dependent manner.
      explanation: >-
        Directly links the mutant kinase to AKT hyperactivation and records that
        ERK activation was largely unaltered, which is the edge this node asserts.
- name: BRAF-Dependent AKT Hyperactivation
  biological_scale: MOLECULAR
  role: effector
  description: >-
    In cells expressing the dilated-cardiomyopathy RAF1 mutants, AKT is
    hyperactivated, and that hyperactivation depends on BRAF - the paralogous RAF
    kinase - rather than on RAF-1 acting directly. ERK activation is largely
    unaltered. This is the node that separates CMD1NN from RAF1 Noonan syndrome
    at the level of signalling: the Noonan hotspot mutants show increased kinase
    activity with enhanced ERK activation, and it is that ERK amplification that
    the RASopathy literature implicates in pathological cardiomyocyte
    hypertrophy.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: AKT signaling
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: INCREASED
  - preferred_term: ERK1/ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  evidence:
  - reference: PMID:24777450
    reference_title: "RAF1 mutations in childhood-onset dilated cardiomyopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Biochemical studies showed that DCM-associated RAF1 mutants had altered
      kinase activity, resulting in largely unaltered ERK activation but in AKT
      that was hyperactivated in a BRAF-dependent manner.
    explanation: >-
      The primary evidence for this node, including the BRAF dependence and the
      absence of a substantial ERK effect. The ERK1/ERK2 cascade term is bound
      without a modifier for exactly that reason - no directional change is claimed.
  - reference: PMID:17603483
    reference_title: "Gain-of-function RAF1 mutations cause Noonan and LEOPARD syndromes with hypertrophic cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Ectopically expressed RAF1 mutants from the two HCM hotspots had increased
      kinase activity and enhanced ERK activation, whereas non-HCM-associated
      mutants were kinase impaired.
    explanation: >-
      The contrasting Noonan-syndrome result. Cited as INDIRECT support because it
      characterises a different allele class; it is what establishes that the
      absence of ERK amplification in the dilated-cardiomyopathy mutants is a
      genuine discriminator rather than an assay limitation.
  downstream:
  - target: mTOR Pathway Activation
    causal_link_type: DIRECT
    description: >-
      Hyperactive AKT drives the downstream mTOR growth and protein-synthesis
      program.
    evidence:
    - reference: PMID:24777450
      reference_title: "RAF1 mutations in childhood-onset dilated cardiomyopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Constitutive expression of these mutants in zebrafish embryos resulted in
        a heart failure phenotype with AKT hyperactivation that was rescued by
        treatment with rapamycin.
      explanation: >-
        Rapamycin is an mTOR inhibitor, so rescue of the AKT-hyperactivated
        phenotype by rapamycin places mTOR downstream of AKT in this disease. It
        is INDIRECT because the mTOR step is inferred from the pharmacology of the
        rescuing agent rather than measured directly in the report abstract.
- name: mTOR Pathway Activation
  biological_scale: CELLULAR
  role: effector
  description: >-
    Increased signalling through mTOR reprograms cardiomyocyte growth, protein
    synthesis and autophagic turnover. The evidence that this step is load-bearing
    in CMD1NN is pharmacological rather than observational: rapamycin, an mTOR
    inhibitor, rescued the cardiac phenotype produced by the mutants in zebrafish.
    This is the step that makes the disease mechanistically interesting - and, in
    principle, druggable in a way the RASopathy hypertrophic cardiomyopathies are
    not, since those are targeted at the MEK/ERK arm instead.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: TOR signaling
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: INCREASED
  evidence:
  - reference: PMID:24777450
    reference_title: "RAF1 mutations in childhood-onset dilated cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Constitutive expression of these mutants in zebrafish embryos resulted in a
      heart failure phenotype with AKT hyperactivation that was rescued by
      treatment with rapamycin.
    explanation: >-
      Rapamycin rescue is the evidence that mTOR signalling mediates the cardiac
      phenotype. INDIRECT because mTOR involvement is inferred from the target of
      the rescuing drug.
  downstream:
  - target: Ventricular Dilation and Systolic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dysregulated growth and remodelling signalling in the cardiomyocyte
      culminates in chamber dilation and falling contractile performance. The
      intermediate sarcomeric and metabolic lesions in CMD1NN have not been
      demonstrated, which is why this edge is not marked DIRECT.
- name: Ventricular Dilation and Systolic Dysfunction
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    The defining structural lesion: left ventricular or biventricular enlargement
    with impaired contraction, not explained by abnormal loading conditions or
    coronary artery disease. In CMD1NN this is reached from a signalling lesion
    rather than from a sarcomeric or cytoskeletal one, which is unusual within the
    numbered dilated cardiomyopathy series, where the causal lesion is more often
    sarcomeric, Z-disc, nuclear-envelope, proteostatic or post-transcriptional.
  cell_types:

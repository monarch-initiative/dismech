diagnosis:
- name: Echocardiography
  description: >-
    First-line and usually diagnostic: left ventricular internal dimensions and
    ejection fraction establish the dilated, hypocontractile phenotype. Nothing
    about the imaging is RAF1-specific, and the echocardiogram is also where the
    principal differential call is made - wall hypertrophy rather than dilation
    points to the RASopathy phenotype instead.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:31073128
    reference_title: "Dilated cardiomyopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Echocardiography and other imaging techniques are required to assess
      ventricular dysfunction and adverse myocardial remodelling
    explanation: >-
      Establishes imaging as the required modality for assessing the ventricular
      dysfunction that defines the phenotype.
- name: Cardiomyopathy Gene Panel Including RASopathy Genes
  description: >-
    Molecular confirmation requires a cardiomyopathy panel that actually contains
    RAF1. This is not automatic: RASopathy genes were historically absent from
    cardiomyopathy panels, and the case for including them was made on the
    strength of the hypertrophic phenotype, where the yield is highest. A RAF1
    variant of uncertain significance does not establish CMD1NN; phenotype fit,
    population frequency, segregation, allele class and functional data all have
    to be weighed, and the historical CMD1NN allele list carries mixed in-silico
    predictions.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29696744
    reference_title: "NGS testing for cardiomyopathy: Utility of adding RASopathy-associated genes."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      was recently associated with pediatric-onset dilated cardiomyopathy (DCM)
    explanation: >-
      The rationale, from a clinical sequencing service, for carrying RAF1 on a
      cardiomyopathy panel that will be ordered for dilated as well as
      hypertrophic phenotypes.
  - reference: PMID:30762279
    reference_title: "Prevalence of pathogenic and likely pathogenic variants in the RASopathy genes in patients who have had panel testing for cardiomyopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that the RASopathy genes should be included on multi-gene
      panels for cardiomyopathy to increase diagnostic yield for individuals with
      HCM.
    explanation: >-
      Supports panel inclusion of the RASopathy genes, while being explicit that
      the demonstrated yield in that cohort was in hypertrophic cardiomyopathy -
      the caveat that makes this diagnostic route weaker for CMD1NN than the
      recommendation alone suggests.

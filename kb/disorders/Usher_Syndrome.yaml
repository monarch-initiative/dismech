  description: >
    Congenital profound bilateral sensorineural hearing loss,
    absent vestibular responses, and
    adolescent-onset retinitis pigmentosa. Caused by biallelic mutations in
    MYO7A (USH1B), USH1C (harmonin), CDH23 (USH1D), PCDH15 (USH1F), or USH1G
    (SANS/sans).
  evidence:
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Usher syndrome type I (USH1) is characterized by congenital bilateral profound sensorineural hearing loss, vestibular areflexia, and adolescent-onset retinitis pigmentosa (RP)."
    explanation: Supports the defining auditory, vestibular, and retinal presentation of USH1.
- name: USH2
  display_name: Usher syndrome type 2
  subtype_term:
    preferred_term: Usher syndrome type 2
    term:
      id: MONDO:0016484
      label: Usher syndrome type 2
  description: >
    Moderate-to-severe congenital hearing loss that is sloping
    (worse at high frequencies), intact or variable vestibular responses, and
    progressive retinitis pigmentosa. Caused by biallelic
    mutations in USH2A (usherin), ADGRV1 (USH2C, GPR98/VLGR1), or WHRN (USH2D,

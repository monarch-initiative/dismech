    explanation: >-
      GeneReviews recommends physical therapy for the vestibular dysfunction and
      imbalance of USH1.
- name: Cochlear Implantation
  description: >
    Cochlear implantation should be considered for the severe-to-profound
    sensorineural hearing loss of USH1 as young as medically feasible, typically
    before age one year.
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329

    reference_title: "Usher Syndrome Type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of manifestations: Early fitting of hearing aids and speech training."
    explanation: GeneReviews recommends early hearing-aid fitting for the hearing loss of USH2.
- name: Speech and Multimodal Communication Support
  description: >-
    Pair hearing technology with early speech/audioverbal therapy where auditory
    communication is pursued, and offer sign language from infancy so a robust
    communication modality is available before and alongside devices.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Timely audioverbal therapy following cochlear implantation is required for the development of speech."
    explanation: Supports timely audioverbal therapy after implantation in USH1.
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sign language is recommended as early as birth to stimulate communication and language development prior to hearing aids and/or cochlear implants and is used throughout life as an additional means of communication when cochlear implants are not working or accessible, or as a primary means of communication for those using a nonauditory modality."
    explanation: Supports early and lifelong access to sign language rather than device-only communication.
- name: Low-Vision Rehabilitation and Psychosocial Support
  description: >-
    Provide orientation and adaptive-skills training as vision declines, with
    school or vocational rehabilitation and recurring mental-health support for
    affected people and families.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skills for adjusting to progressive vision loss can be accessed through school, vocational rehabilitation, or training programs."
    explanation: Supports adaptive and vocational rehabilitation for progressive vision loss.
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Counseling for individuals living with USH1 and family members is recommended to manage mental health throughout the disease course, beginning in childhood and again as vision loss progresses."
    explanation: Supports longitudinal mental-health counseling for affected people and families.
- name: Audiologic and Ophthalmologic Surveillance
  description: >-
    Perform at least annual audiologic surveillance for people using hearing
    aids or cochlear implants and annual multimodal retinal surveillance,
    beginning before visual symptoms in USH1 and by childhood in USH2, to track
    function and identify treatable complications.
  evidence:
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annual audiometry and tympanometry in those with cochlear implants or hearing aids to assure adequate auditory stimulation."
    explanation: Supports annual audiologic surveillance for device users.
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annual ophthalmologic evaluation with fundus photography, visual acuity, visual field testing, electroretinography, optical coherence tomography, and fundus autofluorescence prior to the onset of visual manifestations."
    explanation: Supports annual multimodal ophthalmologic surveillance before visual manifestations in USH1.
  - reference: PMID:20301515
    reference_title: "Usher Syndrome Type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annual fundus photography, visual acuity, visual field, electroretinography, optical coherence tomography, and fundus autofluorescence from age ten years."
    explanation: Supports annual retinal surveillance from age ten in USH2.
- name: Smoking Avoidance and Sunlight Protection
  description: >-
    Counsel against tobacco smoking and recommend sunglasses and a cap to limit
    bright-light exposure as modifiable precautions for retinitis pigmentosa.
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Rod-cone dystrophy
    term:
      id: HP:0000510
      label: Rod-cone dystrophy
  evidence:
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exposure to bright sunlight and smoking tobacco can accelerate progression of RP. Refrain from smoking and avoid exposing eyes to sunlight by wearing sunglasses and a cap."
    explanation: GeneReviews supports smoking avoidance and sunlight protection as precautions intended to limit RP progression.
- name: Genetic Counseling
  description: >
    Genetic counseling addresses the autosomal recessive recurrence risk and
    informs reproductive decision-making.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301515
    reference_title: "Usher Syndrome Type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "USH2 is inherited in an autosomal recessive manner. Each subsequent pregnancy of a couple who have had a child with Usher syndrome type II has a 25% chance of resulting in an affected child"
    explanation: Supports genetic counseling for the autosomal recessive recurrence risk of Usher syndrome.
- name: Gene Therapy
  description: >
    Investigational gene-replacement, gene-editing, and antisense-oligonucleotide
    approaches target retinal degeneration; these approaches remain investigational.
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:32995707
    reference_title: "Usher syndrome: clinical features, molecular genetics and advancing therapeutics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While there is currently no available approved treatment for the RP, various therapeutic strategies are in development or in clinical trials for Usher syndrome, including gene replacement, gene editing, antisense oligonucleotides and small molecule drugs."
    explanation: Documents the investigational gene-replacement/editing/ASO strategies targeting the retinal degeneration, none yet approved.
- name: Ultevursen (QR-421a)
  description: >-
    Investigational antisense oligonucleotide (AON) that induces skipping of
    USH2A exon 13, which contains the recurrent c.2299delG and c.2276G>T
    pathogenic variants. Exon skipping is intended to produce a shortened
    usherin protein. Preclinical zebrafish and patient-derived
    photoreceptor-precursor studies support the splice-modulation concept; ultevursen is being
    evaluated by intravitreal injection in the Phase 2b LUNA trial.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  aso_details:
    aso_mechanism: SPLICE_MODULATION_EXON_SKIPPING
    target_gene:
      preferred_term: USH2A
      term:
        id: hgnc:12601
        label: USH2A
    target_transcript: USH2A pre-mRNA
    target_exon: exon 13
    conjugation: UNCONJUGATED
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Usher Protein Complex Loss of Function
    treatment_effect: MODULATES
    description: >-
      In the USH2A exon-13 molecular subgroup, QR-421a induces exon 13 skipping
      upstream of tissue-level auditory and retinal consequences; this does not
      assert restored human protein-complex function or clinical efficacy.
    evidence:
    - reference: PMID:33895329
      reference_title: Antisense oligonucleotide-based treatment of retinitis pigmentosa caused by USH2A exon 13 mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Lead candidate QR-421a induced a concentration-dependent exon 13 skipping in
        induced pluripotent stem cell (iPSC)-derived photoreceptor precursors from an
        Usher syndrome patient homozygous for the c.2299delG mutation.
      explanation: Directly supports splice modulation in patient-derived photoreceptor precursors, scoped to USH2A exon 13.
  evidence:
  - reference: PMID:33895329
    reference_title: Antisense oligonucleotide-based treatment of retinitis pigmentosa caused by USH2A exon 13 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in USH2A are among the most common causes of syndromic and
      non-syndromic retinitis pigmentosa (RP). The two most recurrent
      mutations in USH2A, c.2299delG and c.2276G > T, both reside in exon 13.
    explanation: >-
      Establishes exon 13 as the site of the two most common USH2A pathogenic
      variants, the rationale for an exon-13-skipping therapeutic strategy.
  - reference: PMID:33895329
    reference_title: Antisense oligonucleotide-based treatment of retinitis pigmentosa caused by USH2A exon 13 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Lead candidate QR-421a induced a concentration-dependent exon 13 skipping in
      induced pluripotent stem cell (iPSC)-derived photoreceptor precursors from an
      Usher syndrome patient homozygous for the c.2299delG mutation.
    explanation: >-
      Patient-derived photoreceptor-precursor evidence directly supports
      QR-421a-mediated USH2A exon 13 skipping; it does not establish clinical efficacy.
  - reference: clinicaltrials:NCT06627179
    reference_title: A Two-Year Double-masked, Randomized, Sham-Controlled Study to Evaluate the Efficacy, Safety and Tolerability of Ultevursen in Subjects With Retinitis Pigmentosa (RP) Due to Mutations in Exon 13 of the USH2A Gene
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this Phase 2b study is to evaluate the safety and tolerability of ultevursen administered via intravitreal injection (IVT) in subjects with Retinitis Pigmentosa (RP) due to mutations in exon 13 of the USH2A gene.
    explanation: >-
      Registry record for the ongoing LUNA trial confirms Phase 2b evaluation,
      intravitreal administration, and the USH2A exon-13 molecular scope.

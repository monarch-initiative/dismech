diagnosis:
- name: Audiologic and retinal functional evaluation
  description: >-
    Establish the clinical phenotype with subjective and electrophysiologic
    hearing and retinal testing.
  results: >-
    The combination and time course of sensorineural hearing loss, retinal
    dysfunction, and vestibular findings distinguish the classical USH1, USH2,
    and USH3 presentations.
  evidence:
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of USH1 is established in a proband with characteristic findings on electrophysiologic and subjective tests of hearing and retinal function."
    explanation: GeneReviews establishes combined hearing and retinal functional testing as the clinical diagnostic route for USH1.
  - reference: PMID:20301515
    reference_title: "Usher Syndrome Type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of USH2 is established in a proband using electrophysiologic and subjective tests of hearing and retinal function."
    explanation: GeneReviews establishes combined hearing and retinal functional testing as the clinical diagnostic route for USH2.
- name: Molecular genetic confirmation
  description: >-
    Identify biallelic pathogenic variants in an Usher-associated gene to confirm
    the diagnosis or establish it when clinical features are inconclusive.
  evidence:
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of biallelic pathogenic variants in one of five genes – MYO7A, USH1C, CDH23, PCDH15, and USH1G – confirms the diagnosis."
    explanation: Establishes molecular confirmation for the five classic USH1 genes.
  - reference: PMID:20301515
    reference_title: "Usher Syndrome Type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of biallelic pathogenic variants in one of three genes – ADGRV1, USH2A, or WHRN – establishes the diagnosis if clinical features are inconclusive."
    explanation: Establishes molecular confirmation for the three classic USH2 genes.
treatments:
- name: Vestibular Physical Therapy
  description: >
    Physical therapy / vestibular rehabilitation is recommended to manage the
    vestibular dysfunction and imbalance of USH1 throughout the disease course,
    beginning in childhood.

animal_models:
- name: Pdzd7 interaction zebrafish model
  species: Zebrafish (Danio rerio)
  genotype: Pdzd7 knockdown alone and in combination with ush2a or gpr98 perturbation
  category: Knockdown interaction model
  description: >-
    Pdzd7 knockdown produces an Usher-like phenotype and worsens retinal-cell
    death when combined with ush2a or gpr98 perturbation. It supports genetic
    interaction and retinal-modifier biology but does not reproduce the full
    human auditory-retinal disease or distinguish all classical subtypes.
  associated_phenotypes:
  - Retinal cell death
  modeled_mechanisms:
  - target: Photoreceptor Connecting Cilium Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      Knockdown in zebrafish is a developmental perturbation and does not establish
      the magnitude or clinical course of PDZD7 modification in humans.
    description: >-
      Combined perturbation changes retinal-cell survival and Gpr98 localization
      near the photoreceptor connecting cilium.
    evidence:

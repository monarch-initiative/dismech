review_notes: >-
  The 2026 re-review separates auditory hair-bundle and retinal periciliary
  mechanisms rather than treating one tissue defect as causally downstream of
  the other. All retained causal edges now carry claim-level evidence, and the
  photoreceptor-trafficking model is explicitly provisional where the cited
  mouse data say "suggests." Diagnosis, communication and low-vision support,
  surveillance, current gene/antisense trials, and a primary zebrafish modifier
  model were added. The record retains the classical USH1/USH2/USH3 framework
  while acknowledging PDZD7-associated modifier/digenic observations; it does
  not promote sparsely reported extra-sensory findings to core phenotypes without
  directly scoped evidence.

name: COX20-Related COX Deficiency
category: Mendelian
creation_date: '2026-06-15T00:00:00Z'
synonyms:
- COX20 deficiency
- FAM36A deficiency
- Mitochondrial complex IV deficiency, nuclear type 11
- MC4DN11
- COX20-related cytochrome c oxidase deficiency
description: COX20-related mitochondrial complex IV deficiency is an autosomal recessive disorder caused by biallelic COX20 (FAM36A) variants. COX20 stabilizes newly synthesized COX2 and supports its maturation and incorporation into complex IV. Splice defects and protein-destabilizing variants reduce functional COX20. The clinical spectrum includes infantile hypotonia, childhood-onset sensory-predominant neuropathy, sensory or cerebellar ataxia, dysarthria, dystonia, and variable visual, motor and cognitive involvement. Progression can cause loss of independent walking, although severity and tempo vary. Normal lactate, brain MRI, early nerve-conduction studies or fibroblast respiratory assays do not exclude the disorder.
disease_term:
  preferred_term: COX20-related COX deficiency (MC4DN11)
  term:
    id: MONDO:0033645
    label: mitochondrial complex IV deficiency, nuclear type 11
parents:
- Mitochondrial Disease
- Inborn Error of Metabolism
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: Mendelian, autosomal recessive nuclear-gene mitochondrial disorder; Harrison's covers primary mitochondrial disease under the genetics/environment Part.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: An inborn error of mitochondrial energy metabolism involving complex IV assembly.
  - classification_value: NEUROLOGIC
    notes: The clinical spectrum prominently involves sensory neuropathy, ataxia and movement disorders.
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: Nuclear-encoded defect of mitochondrial respiratory chain Complex IV biogenesis; a primary mitochondrial disease.
  icimd_category:
  - classification_value: complex_iv_subunits_and_assembly_factors
    notes: 'ICIMD (Ferreira et al. 2021, PMID:33340416): group "Nuclear-encoded complex IV subunit and assembly factor defects" under category "Disorders of nuclear-encoded oxidative phosphorylation". COX20/FAM36A is a nuclear-encoded inner-membrane chaperone required for COX2 maturation.'
pathophysiology:
- name: Aberrant COX20 Splicing
  description: Variants at or near splice donors reduce productive COX20 transcripts. The recurrent c.41A>G coding-position variant removes 20 bases from exon 1; c.157+3G>C promotes an exon-2-skipped noncoding transcript.
  evidence:
  - reference: PMID:35651336
    reference_title: Compound Heterozygous COX20 Variants Impair the Function of Mitochondrial Complex IV to Cause a Syndrome Involving Ophthalmoplegia and Visual Failure.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: TA clone sequencing demonstrated that aligned with the reference sequence (NM_198076.6), the c.41A > G mutation led to a 20 bp deletion in exon 1.
    explanation: Patient-fibroblast transcript sequencing demonstrates the splice effect of the coding-position variant.
  - reference: PMID:30656193
    reference_title: Novel pathogenic COX20 variants causing dysarthria, ataxia, and sensory neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: One variant (IVS2+3G>C), located near intron-2’s splice donor site, resulted in increased expression of the ΔEXON2 mRNA.
    explanation: Patient RNA analysis identifies a distinct exon-2 splicing defect.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: COX20
    term:
      id: hgnc:26970
      label: COX20
  downstream:
  - target: COX20 Protein Deficiency
    description: Loss of productive transcript reduces COX20 abundance.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30656193
      reference_title: Novel pathogenic COX20 variants causing dysarthria, ataxia, and sensory neuropathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Consistent with this finding, protein analysis revealed no detectable COX20 protein present
      explanation: Immunoblotting of patient fibroblasts demonstrates loss of detectable COX20.
- name: COX20 Protein Instability
  description: S33L and W74C substitutions accelerate COX20 turnover in transfected cells. Mutant proteins retain mitochondrial inner-membrane localization.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6180070
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6180070
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: mutant COX20, especially W74C-COX20, were degraded faster than wild-type, suggesting that the two missense variants affected the protein half-life of COX20.
    explanation: Cycloheximide-chase experiments support instability of S33L and W74C proteins.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: COX20
    term:
      id: hgnc:26970
      label: COX20
  downstream:
  - target: COX20 Protein Deficiency
    description: Accelerated turnover reduces steady-state COX20 abundance.

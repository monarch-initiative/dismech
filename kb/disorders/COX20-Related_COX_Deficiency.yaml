      reference_title: Mitochondrial Complex IV Deficiency Nuclear Type 11 Caused by a Novel Start-Lost Variant in the COX20 Gene.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: In silico analysis revealed the absence of downstream in-frame methionine codons
      explanation: The proposed loss of translation rests on sequence analysis, not a functional protein assay.

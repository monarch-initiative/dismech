      snippet: The asymptomatic parents and sister of the patients were heterozygous carriers, following the characteristics of family segregation
      explanation: Segregation supports recessive inheritance.
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1224/
      reference_title: Primary Mitochondrial Disorders Overview - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: OTHER
      snippet: each sib of an affected individual has at conception a 25% chance of being affected
      explanation: The autosomal-recessive section applies when both parents carry a causative variant.
      quote_role: REVIEW_SYNTHESIS
  evidence:
  - reference: PMID:33751098
    reference_title: Bi-allelic loss of function variants in COX20 gene cause autosomal recessive sensory neuronopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified eight unrelated families from the eastern Chinese population carrying a founder variant c.41A>G (p.Lys14Arg) within COX20 in either a homozygous or compound heterozygous state.
    explanation: The shared haplotype supports a founder allele in this cohort, not a disease prevalence estimate.
  notes: ClinGen classified COX20-related mitochondrial disease as Definitive on 17 February 2022 under MONDO:0044970. That broader concept differs from the MONDO:0033645 binding of this entry, so the source is supporting context rather than a formal same-disease gene_disease_validity assertion.

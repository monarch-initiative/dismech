discussions:
- discussion_id: cox20-tissue-vulnerability
  prompt: Why do similar COX20 defects produce different central and peripheral neurological phenotypes?
  kind: OPEN_QUESTION
  status: OPEN
  rationale: Cellular respiratory defects and large-fiber pathology support bioenergetic disease, but genotype-severity relationships and the selective vulnerability of sensory neurons remain unresolved. Mouse single-cell expression analysis suggests enrichment in proprioceptive populations; this is computational context rather than proof of a human cell-specific mechanism.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6180070
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6180070
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: was preferentially expressed in two proprioceptive populations (termed NF4 and NF5).
    explanation: The result comes from reanalysis of a mouse dorsal-root-ganglion single-cell database.
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6711551
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6711551
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Unfortunately, a clear genotype/phenotype correlation could not be established
    explanation: The literature synthesis explicitly identifies this limitation.
    quote_role: REVIEW_SYNTHESIS

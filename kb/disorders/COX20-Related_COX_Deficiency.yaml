notes: Clinical subgroups describe overlapping presentations, not proven distinct molecular diseases. Population prevalence, penetrance and a reliable genotype-prognosis relationship have not been established. The general mitochondrial GeneReviews chapter provides clinical context; its broader phenotype frequencies and mitochondrial-DNA inheritance rules do not describe this nuclear-gene disorder.
has_subtypes:
- name: Infantile hypotonia presentation
  description: Infantile hypotonia and developmental or movement abnormalities without prominent neuropathy at assessment. Neuropathy can be absent or evolve later.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6711551
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6711551
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Only 3/27 patients (11.4%) presented with infantile hypotonia immediately after birth.
    explanation: The authors proposed a descriptive phenotype cluster; boundaries are not a validated genotype-based taxonomy.
    quote_role: REVIEW_SYNTHESIS
- name: Childhood axonal neuropathy presentation
  description: Childhood sensory-predominant axonal neuropathy, frequently with ataxia and variable motor involvement.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6711551
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6711551
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: patients (20/27 patients, 74.1%) present with axonal neuropathy and associated clinical signs, with an onset age ranging from 1 to 17 years;
    explanation: The authors proposed a descriptive phenotype cluster; boundaries are not a validated genotype-based taxonomy.
    quote_role: REVIEW_SYNTHESIS
- name: Neuropathy and dystonia-ataxia overlap
  description: Overlapping neuropathy, dystonia and cerebellar manifestations, often with later emergence of dystonia.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6711551
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6711551
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a third group (4/27 patients; 14.8%) present with a neuropathy/DYTCA overlapping syndrome with an onset age ranging from 1.9 to 12 years.
    explanation: The authors proposed a descriptive phenotype cluster; boundaries are not a validated genotype-based taxonomy.
    quote_role: REVIEW_SYNTHESIS
diagnosis:
- name: Molecular confirmation
  diagnosis_term:
    preferred_term: DNA Sequencing
    term:
      id: NCIT:C153598
      label: DNA Sequencing
  description: Identify biallelic causative COX20 variants with a panel that includes COX20, exome or genome sequencing, and segregation testing. A negative panel that omitted COX20 does not exclude it.
  evidence:
  - reference: PMID:35651336
    reference_title: Compound Heterozygous COX20 Variants Impair the Function of Mitochondrial Complex IV to Cause a Syndrome Involving Ophthalmoplegia and Visual Failure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Exome sequencing revealed two compound heterozygous variants of the COX20 gene (c.222G > T and c.41A > G) that co-segregated with the disorder in both patients.
    explanation: Exome analysis and family segregation established the molecular diagnosis.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1224/
    reference_title: Primary Mitochondrial Disorders Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Molecular genetic testing is used to establish the diagnosis.
    explanation: General mitochondrial guidance supports molecular confirmation.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:41010014
    reference_title: Mitochondrial Complex IV Deficiency Nuclear Type 11 Caused by a Novel Start-Lost Variant in the COX20 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a gene panel for hereditary neuropathies, which did not include the COX20 gene, revealed no significant findings.
    explanation: The negative earlier panel had a gene-content limitation.
- name: Nerve-conduction studies
  diagnosis_term:
    preferred_term: Nerve Conduction Velocity Test
    term:
      id: NCIT:C88502
      label: Nerve Conduction Velocity Test
  description: Assess sensory amplitudes and distribution alongside motor conduction. Sensory studies may be normal early, so repeat testing is appropriate when the clinical syndrome progresses.
  evidence:
  - reference: PMID:37095481
    reference_title: 'Clinical and genetic characteristics of children with COX20-associated mitochondrial disorder: case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At the age of 4.5, the patient underwent magnetic resonance imaging (MRI) and nerve conduction tests, but all the results were normal.
    explanation: The initial study was normal.
  - reference: PMID:37095481
    reference_title: 'Clinical and genetic characteristics of children with COX20-associated mitochondrial disorder: case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, the examination of nerve conduction performed on him again revealed severe axonal sensory neuropathy.
    explanation: Repeat testing at age five demonstrated the evolving sensory neuropathy.
- name: Brain and spinal MRI
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: Assess cerebellar, cerebral and spinal changes when indicated. Cord atrophy may coexist with normal cerebellar imaging, and entirely normal MRI does not exclude the disorder.
  evidence:
  - reference: PMID:41010014
    reference_title: Mitochondrial Complex IV Deficiency Nuclear Type 11 Caused by a Novel Start-Lost Variant in the COX20 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cerebellar atrophy was absent on all imaging studies
    explanation: The adult case had normal cerebellar structure despite cord atrophy.
  - reference: PMID:41010014
    reference_title: Mitochondrial Complex IV Deficiency Nuclear Type 11 Caused by a Novel Start-Lost Variant in the COX20 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Spinal cord MRI performed at the age of 20 years demonstrated cervical and thoracic cord atrophy
    explanation: Both cord regions were involved.
  - reference: PMID:37095481
    reference_title: 'Clinical and genetic characteristics of children with COX20-associated mitochondrial disorder: case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: An MRI of his brain and spine showed a normal result.
    explanation: The child had genetically confirmed disease despite normal imaging.
- name: Lactate testing
  diagnosis_term:
    preferred_term: Lactic Acid Measurement
    term:
      id: NCIT:C79450
      label: Lactic Acid Measurement
  description: Lactate can be elevated but is often normal. A normal concentration does not exclude mitochondrial disease or COX20 deficiency.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6711551
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6711551
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Standard laboratory analyses detected mildly elevated serum lactate levels in 4/17 of patients (23.5%)
    explanation: Only a minority of tested cases in the literature compilation had elevated lactate.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1224/
    reference_title: Primary Mitochondrial Disorders Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Normal plasma or CSF lactic acid concentration does not exclude the presence of a mitochondrial disorder.
    explanation: GeneReviews explicitly cautions against exclusion on a normal lactate result.
    quote_role: REVIEW_SYNTHESIS
- name: Tissue and cellular functional studies
  diagnosis_term:
    preferred_term: Respiratory-chain enzymology and complex IV assembly analysis
  description: Respiratory-chain enzymology, COX histochemistry, immunoblotting, blue-native electrophoresis and RNA studies can support variant interpretation. Sensitivity differs by assay, tissue and genotype; normal fibroblast OXPHOS does not negate a molecular diagnosis.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6711551
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6711551
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Biochemical investigation revealed an isolated complex IV defect in the skeletal muscle of two patients and normal OXPHOS activity in the fibroblasts of three patients.
    explanation: The literature review documents tissue-dependent assay findings.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:23125284
    reference_title: A mutation in the FAM36A gene, the human ortholog of COX20, impairs cytochrome c oxidase assembly and is associated with ataxia and muscle hypotonia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cells affected by the mutation accumulate subassemblies of complex IV that contain COX1 but are almost devoid of COX2 protein.
    explanation: Patient-fibroblast subassemblies demonstrate failed incorporation of COX2.
  notes: The composite combines enzyme assays, protein-complex analysis and RNA studies. NCIT search 'l~Enzyme Activity' returns the activity concept NCIT:C180567, which is not a diagnostic procedure; it is not substituted for this combination.
- name: Prenatal familial-variant testing
  diagnosis_term:
    preferred_term: Prenatal molecular testing of familial COX20 variants
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: After defining familial variants, prenatal testing can determine fetal genotype. Amniocentesis identified an affected fetus and chorionic-villus testing in a later pregnancy identified a heterozygous carrier in one reported family. Testing and reproductive decisions require nondirective counseling.
  evidence:
  - reference: PMID:39897410
    reference_title: 'Prenatal Counseling and Diagnosis of COX20 Gene-Related Mitochondrial Complex IV Deficiency: A Case Report and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the mother of the patient underwent amniocentesis during a subsequent pregnancy. The procedure confirmed that the fetus carried identical mutations in the COX20 gene as the proband.
    explanation: A family received prenatal molecular testing.
  - reference: PMID:39897410
    reference_title: 'Prenatal Counseling and Diagnosis of COX20 Gene-Related Mitochondrial Complex IV Deficiency: A Case Report and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: WES detected only the heterozygous mutation c.41A>G (p.Lys14Arg), consistent with the maternal genotype.
    explanation: A subsequent chorionic-villus sample was heterozygous, followed by birth of an unaffected child.
experimental_models:
- name: COX20-depleted HEK293T cells
  experimental_model_type: CELL_LINE
  description: siRNA and TALEN-based COX20 depletion demonstrate rapid COX2 turnover, assembly intermediates and residual complex IV activity. COX20-FLAG permits rescue and interaction studies.
  evidence:
  - reference: PMID:24403053
    reference_title: Human COX20 cooperates with SCO1 and SCO2 to mature COX2 and promote the assembly of cytochrome c oxidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: newly synthesized COX2 is unstable and most of it is rapidly degraded within 2 h of the chase
    explanation: Pulse-chase analysis in COX20-silenced cells identifies reduced COX2 stability rather than a primary synthesis defect.
  - reference: PMID:24403053
    reference_title: Human COX20 cooperates with SCO1 and SCO2 to mature COX2 and promote the assembly of cytochrome c oxidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We propose that COX20 acts as a chaperone in the early steps of COX2 maturation, stabilizing the newly synthesized protein and presenting COX2 to its metallochaperone module
    explanation: Protein-interaction experiments motivate the COX2 presentation model; direct copper transport by COX20 is not established.
    directness: INDIRECT
  modeled_mechanisms:
  - target: COX2 Instability
    relationship: RECAPITULATES
    description: Pulse-chase analysis shows rapid COX2 turnover.
    evidence:
    - reference: PMID:24403053
      reference_title: Human COX20 cooperates with SCO1 and SCO2 to mature COX2 and promote the assembly of cytochrome c oxidase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: newly synthesized COX2 is unstable and most of it is rapidly degraded within 2 h of the chase
      explanation: Pulse-chase analysis in COX20-silenced cells identifies reduced COX2 stability rather than a primary synthesis defect.
    model_scale: CELLULAR
    fidelity: MODERATE
    limitations: Culture findings do not establish clinical treatment efficacy or the full neurological phenotype.
  - target: Reduced Complex IV Assembly
    relationship: RECAPITULATES
    description: Engineered cells accumulate assembly intermediates.
    evidence:
    - reference: PMID:24403053
      reference_title: Human COX20 cooperates with SCO1 and SCO2 to mature COX2 and promote the assembly of cytochrome c oxidase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Mitochondria lacking COX20 accumulate CIV subassemblies containing COX1 and COX4
      explanation: The engineered human-cell system reproduces the assembly lesion.
    model_scale: CELLULAR
    fidelity: MODERATE
    limitations: Culture findings do not establish clinical treatment efficacy or the full neurological phenotype.
- name: Patient fibroblast complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: Patient fibroblasts support RNA, protein, assembly and respiratory analyses. Wild-type lentiviral or adenoviral COX20 restores cellular function in reported lines; other patients can have normal routine enzyme assays.
  evidence:
  - reference: PMID:30656193
    reference_title: Novel pathogenic COX20 variants causing dysarthria, ataxia, and sensory neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Consistent with this finding, protein analysis revealed no detectable COX20 protein present
    explanation: Immunoblotting of patient fibroblasts demonstrates loss of detectable COX20.
  - reference: PMID:23125284
    reference_title: A mutation in the FAM36A gene, the human ortholog of COX20, impairs cytochrome c oxidase assembly and is associated with ataxia and muscle hypotonia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lentiviral complementation of patient's fibroblasts with wild-type FAM36A increases the complex IV activity as well as the amount of holocomplex IV and of individual subunits.
    explanation: Genetic complementation supports COX20 causality in culture.
  - reference: PMID:35651336

  inheritance:
  - name: Autosomal recessive
    description: When both parents carry a causative allele, each pregnancy has a 25% affected risk, 50% carrier risk and 25% chance of inheriting neither familial allele.
    evidence:
    - reference: PMID:35651336
      reference_title: Compound Heterozygous COX20 Variants Impair the Function of Mitochondrial Complex IV to Cause a Syndrome Involving Ophthalmoplegia and Visual Failure.
      supports: SUPPORT

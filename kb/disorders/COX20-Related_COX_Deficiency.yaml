genetic:
- name: Biallelic COX20 variants
  gene_term:
    preferred_term: COX20
    term:
      id: hgnc:26970
      label: COX20
  features: Splice-disrupting, missense, nonsense and reported start-loss variants cause a variable recessive phenotype. The c.41A>G allele is recurrent and a shared haplotype supports an eastern Chinese founder effect. The linked p.Gly114Ser variant in the Otero families was considered likely benign and is not assigned causality.
  variants:
  - name: COX20 c.41A>G (p.Lys14Arg)
    description: Recurrent coding-position splice-disrupting variant; exon-1 deletion creates p.Gly8ValfsTer2. A protein-only K14R construct does not reproduce the splice effect.
    gene:
      preferred_term: COX20
      term:
        id: hgnc:26970
        label: COX20
    evidence:
    - reference: PMID:35651336
      reference_title: Compound Heterozygous COX20 Variants Impair the Function of Mitochondrial Complex IV to Cause a Syndrome Involving Ophthalmoplegia and Visual Failure.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: TA clone sequencing demonstrated that aligned with the reference sequence (NM_198076.6), the c.41A > G mutation led to a 20 bp deletion in exon 1.
      explanation: Patient-fibroblast transcript sequencing demonstrates the splice effect of the coding-position variant.
    variant_type: single nucleotide variant
  - name: COX20 c.157+3G>C
    description: Splice-donor-region variant associated with exon-2 skipping and loss of full-length RNA.
    gene:
      preferred_term: COX20
      term:
        id: hgnc:26970
        label: COX20
    evidence:
    - reference: PMID:30656193
      reference_title: Novel pathogenic COX20 variants causing dysarthria, ataxia, and sensory neuropathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: One variant (IVS2+3G>C), located near intron-2’s splice donor site, resulted in increased expression of the ΔEXON2 mRNA.
      explanation: Patient RNA supports altered splicing.
    variant_type: single nucleotide variant
    genomic_contexts:
    - intron
  - name: COX20 c.154A>C (p.Thr52Pro)
    description: Founding homozygous variant with reduced protein and altered transcript splicing.
    gene:
      preferred_term: COX20
      term:
        id: hgnc:26970
        label: COX20
    evidence:
    - reference: PMID:24202787
      reference_title: Recessive dystonia-ataxia syndrome in a Turkish family caused by a COX20 (FAM36A) mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: By exome sequencing, we identified a homozygous missense mutation (c.154A >C; p.Thr52Pro) in both patients in exon 2 of the COX20 (FAM36A) gene
      explanation: The two siblings carried the founding allele.
    variant_type: single nucleotide variant
  - name: COX20 p.Ser33Leu and p.Trp74Cys
    description: Missense substitutions with accelerated turnover in expression assays; W74C is encoded by c.222G>T.
    gene:
      preferred_term: COX20
      term:
        id: hgnc:26970
        label: COX20
    evidence:
    - reference: url:https://oup.silverchair-cdn.com/article-minimal/6180070
      reference_title: https://oup.silverchair-cdn.com/article-minimal/6180070
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: mutant COX20, especially W74C-COX20, were degraded faster than wild-type, suggesting that the two missense variants affected the protein half-life of COX20.
      explanation: Cycloheximide-chase experiments support instability of S33L and W74C proteins.
    variant_type: single nucleotide variant
  - name: COX20 c.157+7A>G
    description: A minigene assay, performed because patient RNA was unavailable, showed exon-2 skipping.
    gene:
      preferred_term: COX20
      term:
        id: hgnc:26970
        label: COX20
    evidence:
    - reference: url:https://oup.silverchair-cdn.com/article-minimal/6180070
      reference_title: https://oup.silverchair-cdn.com/article-minimal/6180070
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: variant therefore caused the skipping of exon 2 resulting in a premature stop codon p.Ser15Valfs*11.
      explanation: The result is from a transfected minigene, not patient RNA.
    variant_type: single nucleotide variant
    genomic_contexts:
    - intron
  - name: COX20 c.42+1G>A
    description: Splice-donor variant reported in trans with c.41A>G; both affect the exon-1 donor.
    gene:
      preferred_term: COX20
      term:
        id: hgnc:26970
        label: COX20
    evidence:
    - reference: url:https://oup.silverchair-cdn.com/article-minimal/6711551
      reference_title: https://oup.silverchair-cdn.com/article-minimal/6711551
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: cause a uniform splice defect of exon 1 resulting in a 20-base pair cDNA deletion at the 3′ end in more than 90% of the transcripts
      explanation: Patient RNA/proteomics support the combined splice defect.
    variant_type: single nucleotide variant
    genomic_contexts:
    - intron
  - name: COX20 c.259C>T (p.Gln87Ter)
    description: Nonsense allele found in trans with c.41A>G in multiple families.
    gene:
      preferred_term: COX20
      term:
        id: hgnc:26970
        label: COX20
    evidence:
    - reference: PMID:39897410
      reference_title: 'Prenatal Counseling and Diagnosis of COX20 Gene-Related Mitochondrial Complex IV Deficiency: A Case Report and Literature Review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: whole-exome sequencing (WES) revealed compound heterozygous mutations in the COX20 gene (c.41A>G, p.Lys14Arg and c.259C>T, p.Gln87Ter)
      explanation: The prenatal-counseling family supplies unambiguous variant notation.
    variant_type: single nucleotide variant
  - name: COX20 c.2T>C (p.Met1?)
    description: Start-loss allele reported in a 2025 patient on NM_198076.6. The authors classified it as pathogenic, while earlier ClinVar submissions were uncertain; complete loss of expression was predicted rather than experimentally shown.
    gene:
      preferred_term: COX20
      term:
        id: hgnc:26970
        label: COX20
    evidence:

- name: COX2 Instability
  description: 'Newly synthesized COX2 turns over rapidly in COX20-depleted HEK293T cells. This model result is not uniform across patient cultures: two 2021 patient lines retained normal steady-state COX2.'
  evidence:
  - reference: PMID:24403053
    reference_title: Human COX20 cooperates with SCO1 and SCO2 to mature COX2 and promote the assembly of cytochrome c oxidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: newly synthesized COX2 is unstable and most of it is rapidly degraded within 2 h of the chase
    explanation: Pulse-chase analysis in COX20-silenced cells identifies reduced COX2 stability rather than a primary synthesis defect.
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6180070
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6180070
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: Western blot analysis revealed COX2 protein was not affected in the fibroblasts of Patients 1 and 5.
    explanation: The patient lines refute a universal reduction in steady-state COX2.
  biological_scale: MOLECULAR
  downstream:
  - target: Reduced Complex IV Assembly
    description: Reduced stable COX2 limits incorporation into the holoenzyme.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

animal_models:
- name: Saccharomyces cerevisiae cox20 deletion
  species: Saccharomyces cerevisiae
  genotype: cox20 deletion
  description: The deletion produces a respiratory-growth defect rescued by native yeast Cox20 but not human COX20 despite mitochondrial import. Yeast Cox2 has a cleaved N-terminal precursor absent from human COX2, limiting direct functional interchangeability.
  evidence:
  - reference: PMID:24403053
    reference_title: Human COX20 cooperates with SCO1 and SCO2 to mature COX2 and promote the assembly of cytochrome c oxidase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: ScCox20-HA complemented the respiratory defect of Δcox20 yeast, but the human protein did not
    explanation: Native yeast complementation supports the conserved respiratory role; lack of cross-species complementation limits extrapolation.
  modeled_mechanisms:
  - target: Reduced Complex IV Activity
    relationship: RECAPITULATES
    description: The model reproduces impaired respiratory function associated with Cox20 loss.
    evidence:
    - reference: PMID:24403053
      reference_title: Human COX20 cooperates with SCO1 and SCO2 to mature COX2 and promote the assembly of cytochrome c oxidase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: ScCox20-HA complemented the respiratory defect of Δcox20 yeast, but the human protein did not
      explanation: Native yeast complementation supports the conserved respiratory role; lack of cross-species complementation limits extrapolation.
    model_scale: CELLULAR
    fidelity: MODERATE
    limitations: Yeast precursor processing differs from human COX2 maturation, and the model does not reproduce neurological disease.
histopathology:
- name: Large myelinated nerve-fiber depletion
  description: Sural nerve biopsy can show marked depletion of large myelinated fibers, with axonal degeneration in the 2021 series. Fiber loss alone should not be interpreted as proof of primary demyelination.
  evidence:
  - reference: PMID:35651336
    reference_title: Compound Heterozygous COX20 Variants Impair the Function of Mitochondrial Complex IV to Cause a Syndrome Involving Ophthalmoplegia and Visual Failure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pronounced depletion of large myelinated fibers by approximately 80% in the MGT-stained sural nerve
    explanation: The proband biopsy documents large-fiber loss; this does not by itself establish primary demyelination.
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6180070
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6180070
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sural nerve biopsy in Patient 5 showed marked loss of large and medium myelinated fibres and chronic axonal degeneration
    explanation: The independent biopsy supports chronic axonal pathology.
- name: Muscle denervation atrophy
  description: Angulated atrophic muscle fibers without ragged-red fibers were seen in the older sibling in the 2022 visual-impairment report.
  evidence:
  - reference: PMID:35651336
    reference_title: Compound Heterozygous COX20 Variants Impair the Function of Mitochondrial Complex IV to Cause a Syndrome Involving Ophthalmoplegia and Visual Failure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: numerous angulated atrophic fibers with an angular shape and decreased size, indicating atrophic fibers and denervation atrophy
    explanation: Muscle histology documents denervation rather than a universal primary myopathic pattern.
biochemical:

      explanation: Cycloheximide-chase experiments support instability of S33L and W74C proteins.
- name: COX20 Protein Deficiency
  description: Loss of functional COX20 removes a COX2-specific chaperone and assembly adaptor. Patient fibroblasts can have nearly absent protein despite normal routine respiratory-enzyme assays.
  evidence:
  - reference: PMID:30656193
    reference_title: Novel pathogenic COX20 variants causing dysarthria, ataxia, and sensory neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Consistent with this finding, protein analysis revealed no detectable COX20 protein present
    explanation: Immunoblotting of patient fibroblasts demonstrates loss of detectable COX20.
  - reference: PMID:24403053
    reference_title: Human COX20 cooperates with SCO1 and SCO2 to mature COX2 and promote the assembly of cytochrome c oxidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We propose that COX20 acts as a chaperone in the early steps of COX2 maturation, stabilizing the newly synthesized protein and presenting COX2 to its metallochaperone module
    explanation: Protein-interaction experiments motivate the COX2 presentation model; direct copper transport by COX20 is not established.
    directness: INDIRECT

- name: COX20 splice and protein-stability assays
  experimental_model_type: CELL_LINE
  description: Minigene analysis supports c.157+7A>G-associated exon-2 skipping; tagged-protein expression and cycloheximide chase distinguish S33L/W74C protein instability from the c.41A>G splice defect. Proteasome inhibition in these assays is not an established treatment.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6180070
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6180070
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: mutant COX20, especially W74C-COX20, were degraded faster than wild-type, suggesting that the two missense variants affected the protein half-life of COX20.
    explanation: Cycloheximide-chase experiments support instability of S33L and W74C proteins.
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6180070

- name: Reduced muscle coenzyme Q10
  presence: Reported in a family
  context: Documented in the Turkish sibling report; not established as a universal biochemical feature.
  evidence:
  - reference: PMID:24202787
    reference_title: Recessive dystonia-ataxia syndrome in a Turkish family caused by a COX20 (FAM36A) mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Biochemical analyses revealed a mitochondrial respiratory chain complex IV and a coenzyme Q10 deficiency in a muscle biopsy.
    explanation: The muscle assay found both abnormalities.

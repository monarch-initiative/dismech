genetic:
- name: NR3C1
  association: Inactivating germline variants in NR3C1 (point mutations, insertions, deletions)
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: NR3C1
    term:
      id: hgnc:7978
      label: NR3C1
  notes: >-
    NR3C1 is the only established cause of primary generalized glucocorticoid
    resistance. Some patients with a compatible phenotype carry no detectable
    NR3C1 variant, and other glucocorticoid-signaling factors are suspected in
    those cases. Dominant-negative ligand-binding-domain variants transmit as
    autosomal dominant; others transmit recessively, so inheritance and severity
    depend on the specific functional defect. No ClinGen gene-disease validity
    assertion exists for this gene-disease pair, so no gene_disease_validity is
    recorded.
  variants:
  - name: D641V
    description: >-
      Valine for aspartate at residue 641 in the ligand-binding domain, the first
      NR3C1 point mutation identified in this disorder; it reduces ligand-binding
      affinity and transactivation without a dominant-negative effect.
    evidence:
    - reference: PMID:1704018
      reference_title: Point mutation causing a single amino acid substitution in the hormone binding domain of the glucocorticoid receptor in familial glucocorticoid resistance.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: which substituted valine for aspartic acid at amino acid residue 641. The propositus was homozygous while the other relatives were heterozygous for the mutation.
      explanation: Identifies the D641V ligand-binding-domain substitution and its zygosity from sequencing the first reported kindred.
    - reference: PMID:1704018
      reference_title: Point mutation causing a single amino acid substitution in the hormone binding domain of the glucocorticoid receptor in familial glucocorticoid resistance.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: The binding affinity for dexamethasone of the Val 641-mutant receptor was threefold lower than that of the wild type receptor.
      explanation: Reduced ligand-binding affinity of the mutant receptor.
  - name: I747M
    description: >-
      Isoleucine to methionine at residue 747 near helix 12 of the ligand-binding
      domain; it decreases ligand binding and transactivation and acts as a
      dominant-negative inhibitor of the wild-type receptor via abnormal p160
      coactivator interaction.
    evidence:
    - reference: PMID:12050230
      reference_title: A novel, C-terminal dominant negative mutation of the GR causes familial glucocorticoid resistance through abnormal interactions with p160 steroid receptor coactivators.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: the mutant GR functioned as a dominant negative inhibitor of wild-type receptor-induced transactivation
      explanation: Establishes the dominant-negative behavior of the I747M variant.
  evidence:

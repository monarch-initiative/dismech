notes: >-
  In a 2026 systematic review of 71 cases from 43 families (PMID:41038576),
  zygosity strongly shaped severity: homozygous or compound-heterozygous cases
  presented earlier and with markedly higher rates of hypertension and
  hypokalemia than heterozygous cases. In the French MUTA-GR multicenter study
  (PMID:29444898), heterozygous NR3C1 variants accounted for 5% of 100 patients
  evaluated for bilateral adrenal incidentalomas with hypertension and/or
  biochemical hypercortisolism without Cushingoid signs. Acquired or
  tissue-specific glucocorticoid resistance (asthma, inflammatory disease,
  glucocorticoid-resistant leukemia) is a distinct entity and is out of scope
  here.

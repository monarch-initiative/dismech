- name: Blunted HPA-Axis Negative Feedback
  description: >-
    Target-tissue insensitivity extends to the hypothalamus and pituitary, so
    cortisol fails to suppress CRH and ACTH normally. This is demonstrated
    clinically as resistance to dexamethasone suppression.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:6282933
    reference_title: Primary cortisol resistance in man. A glucocorticoid receptor-mediated disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Plasma ACTH concentration was high, and both were resistant to adrenal suppression by dexamethasone.
    explanation: Demonstrates failure of glucocorticoid negative feedback.
  downstream:
  - target: Compensatory HPA-Axis Activation
    causal_link_type: DIRECT
- name: Compensatory HPA-Axis Activation
  description: >-
    The axis is upregulated to overcome peripheral resistance, raising CRH, ACTH,
    and cortisol. Cortisol rises until it partially overcomes the resistance, at
    the expense of ACTH hypersecretion-related pathology.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: corticotropin-releasing hormone secretion
    term:
      id: GO:0043396
      label: corticotropin-releasing hormone secretion
    modifier: INCREASED
  evidence:
  - reference: PMID:18319312
    reference_title: 'Generalized glucocorticoid resistance: clinical aspects, molecular mechanisms, and implications of a rare genetic disorder.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: A consequent increase in the activity of the hypothalamic-pituitary-adrenal axis compensates for the reduced sensitivity of peripheral tissues to glucocorticoids at the expense of ACTH hypersecretion-related pathology.
    explanation: Describes compensatory HPA-axis activation and ACTH hypersecretion.

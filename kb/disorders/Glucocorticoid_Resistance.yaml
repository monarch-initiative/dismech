      snippet: The molecular basis of the condition has been ascribed to mutations in the human glucocorticoid receptor (hGR) gene, which impair glucocorticoid signal transduction and reduce tissue sensitivity to glucocorticoids.
      explanation: Links the NR3C1 variant to impaired receptor signal transduction.
- name: Impaired Glucocorticoid Receptor Signal Transduction
  description: >-
    Mutant receptors show reduced ligand-binding affinity, reduced
    transactivation of glucocorticoid-responsive genes, delayed nuclear
    translocation, and abnormal coactivator interaction. DNA-binding is usually
    preserved.
  biological_scale: MOLECULAR
  biological_processes:

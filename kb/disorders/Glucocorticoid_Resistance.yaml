inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous NR3C1 variants that exert a dominant-negative effect on the
    wild-type receptor cause autosomal dominant disease; the I747M ligand-binding
    domain variant is a worked example.
  evidence:
  - reference: PMID:12050230
    reference_title: A novel, C-terminal dominant negative mutation of the GR causes familial glucocorticoid resistance through abnormal interactions with p160 steroid receptor coactivators.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: We conclude that the mutation at amino acid 747 of the GR causes familial, autosomal dominant glucocorticoid resistance by decreasing ligand binding affinity and transcriptional activity, and by exerting a negative transdominant effect on the wild-type receptor.
    explanation: Establishes a dominant-negative, autosomal dominant mechanism for an NR3C1 ligand-binding-domain variant.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    NR3C1 variants that do not exert a dominant-negative effect transmit
    recessively; homozygous or compound-heterozygous defects produce the most
    severe, early-onset presentations.
  evidence:
  - reference: PMID:15070967
    reference_title: 'Natural glucocorticoid receptor mutants causing generalized glucocorticoid resistance: molecular genotype, genetic transmission, and clinical phenotype.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: each of the above hGRalpha mutations imparts different functional defects upon the glucocorticoid signal transduction pathway, which explains the autosomal recessive or dominant transmission of the disorder
    explanation: Functional differences among mutant receptors account for both recessive and dominant transmission.
pathophysiology:
- name: NR3C1 Inactivating Variant

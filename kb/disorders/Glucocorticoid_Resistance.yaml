    Point mutations, insertions, or deletions in NR3C1 impair the human
    glucocorticoid receptor. All reported Chrousos syndrome cases to date carry
    an NR3C1 defect.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE

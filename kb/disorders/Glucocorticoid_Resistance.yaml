notes: >-
  Zygosity shapes severity: a 2026 systematic review found homozygous or
  compound-heterozygous cases present earlier and with markedly higher rates of
  hypertension and hypokalemia than heterozygous cases. Heterozygous NR3C1
  variants are more common than once thought; the French MUTA-GR study found a 5%
  prevalence of heterozygous NR3C1 mutations among patients with bilateral
  adrenal incidentalomas and biochemical hypercortisolism without Cushing's
  signs. No GeneReviews chapter exists for this disorder (the only Bookshelf hit
  for "glucocorticoid" in the cached index is StatPearls NBK560897, a general
  glucocorticoid physiology chapter, which is not a disease baseline). Acquired
  or tissue-specific glucocorticoid resistance (asthma, inflammatory disease,
  glucocorticoid-resistant leukemia) is a distinct entity and is out of scope
  here.

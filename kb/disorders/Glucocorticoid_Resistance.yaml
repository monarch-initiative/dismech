    reference_title: 'Natural glucocorticoid receptor mutants causing generalized glucocorticoid resistance: molecular genotype, genetic transmission, and clinical phenotype.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: All five mutants studied demonstrate varying degrees of decreased affinity for the ligand in a standard dexamethasone binding assay, but preserve their ability to bind DNA.
    explanation: Reduced ligand affinity with preserved DNA binding across mutant receptors.
  - reference: PMID:15070967
    reference_title: 'Natural glucocorticoid receptor mutants causing generalized glucocorticoid resistance: molecular genotype, genetic transmission, and clinical phenotype.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: The nondominant negative mutants, hGRalphaV571A, D641V, and V729I, show delayed translocation into the nucleus after exposure to ligand.
    explanation: Documents delayed nuclear translocation of mutant receptors.
  downstream:

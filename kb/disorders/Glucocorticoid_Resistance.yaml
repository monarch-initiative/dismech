    explanation: Excess circulating cortisol overwhelms 11-beta-hydroxysteroid dehydrogenase type 2 in distal nephron cells, activating mineralocorticoid receptors and driving sodium reabsorption.
  - reference: PMID:29444898
    reference_title: 'Significant prevalence of NR3C1 mutations in incidentally discovered bilateral adrenal hyperplasia: results of the French MUTA-GR Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Potassium and aldosterone levels were lower in mutated patients (3.6\u2009±\u20090.2 vs 4.1\u2009±\u20090.5\u2009mmol/L, P\u2009=\u20090.01, and 17.3\u2009±\u20099.9 vs 98.6\u2009±\u2009115.4\u2009pg/mL, P\u2009=\u20090.0011, respectively) without elevated renin levels, consistent with pseudohypermineralocorticism."
    explanation: NR3C1-mutated patients in the French MUTA-GR cohort exhibit lower serum potassium and suppressed aldosterone without elevated renin, confirming non-aldosterone pseudohypermineralocorticism.

description: >-
  Primary generalized glucocorticoid resistance (Chrousos syndrome) is a rare
  genetic disorder of generalized, partial target-tissue insensitivity to
  glucocorticoids caused by inactivating variants in NR3C1, which encodes the
  human glucocorticoid receptor. Because peripheral tissues respond poorly to
  cortisol, hypothalamic-pituitary-adrenal negative feedback is blunted and the
  axis is compensatorily upregulated, raising cortisol and ACTH. The excess ACTH
  drives adrenal overproduction of steroids with mineralocorticoid activity
  (deoxycorticosterone, corticosterone) and of adrenal androgens, so affected
  individuals present with hypertension, hypokalemic alkalosis, and/or
  hyperandrogenism, together with adrenal hyperplasia, while cortisol-dependent
  functions are largely preserved and stigmata of Cushing's syndrome are absent.
  The clinical spectrum ranges from asymptomatic to severe; homozygous or
  compound-heterozygous defects present earlier and more severely than
  heterozygous ones. This entry covers the primary (NR3C1-based) Mendelian
  disorder, not acquired or tissue-specific glucocorticoid resistance seen in
  conditions such as asthma, inflammatory disease, or hematologic malignancy.

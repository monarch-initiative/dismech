    reference_title: Novel insights into the molecular mechanisms underlying generalized glucocorticoid resistance and hypersensitivity syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Any genetic defects in the NR3C1gene that encodes the hGR may cause Primary Generalized Glucocorticoid Resistance or Hypersensitivity Syndromes
    explanation: Establishes NR3C1 defects as the cause of the disorder.
  - reference: PMID:28742501
    reference_title: Novel insights into the molecular mechanisms underlying generalized glucocorticoid resistance and hypersensitivity syndromes.

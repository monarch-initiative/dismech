name: Alveolar echinococcosis
creation_date: "2026-11-14T00:00:00Z"
category: Infectious Disease
description: >-
  Alveolar echinococcosis is a Northern-Hemisphere zoonotic helminth infection
  caused by the larval metacestode stage of Echinococcus multilocularis. Adult
  tapeworms live in canids such as foxes and dogs and shed eggs in feces; wild
  rodents are the usual intermediate hosts, and humans become aberrant
  intermediate hosts after ingesting eggs from contaminated food, water, or
  hands. The parasite seeds the liver through the portal circulation and grows
  as a pseudotumoral infiltrative metacestode lesion that mimics hepatic
  malignancy, invades biliary and vascular structures, can extend into
  neighboring organs or metastasize hematogenously, and requires either complete
  R0 resection plus benzimidazole therapy or long-term parasitostatic
  benzimidazole suppression when surgery is not feasible.
disease_term:
  preferred_term: alveolar echinococcosis
  term:
    id: MONDO:0017282
    label: alveolar echinococcosis
parents:
- Echinococcosis
- Liver disorder
- Digestive system infectious disorder
synonyms:
- Echinococcus multilocularis infection
- Hepatic alveolar echinococcosis
- Alveolar hydatid disease
notes: >-
  Lump/split decision: alveolar echinococcosis is kept as the
  E. multilocularis clinical form of Echinococcosis, parallel to the existing
  Cystic_Echinococcosis and Polycystic_Echinococcosis entries. It is
  species-specific and clinically distinct: unlike E. granulosus cystic disease
  it forms an infiltrative hepatic metacestode that is staged and managed like a
  malignant liver process, and unlike E. vogeli polycystic disease it is
  maintained in a Northern-Hemisphere canid-rodent cycle.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Alveolar echinococcosis is rare, slow and often hepatic for years, but it
    behaves as a malignant parasitosis once active lesions expand. Irreversible
    biliary and vascular damage drives prognosis; cure requires complete R0
    resection of early limited disease, and advanced inoperable disease depends
    on lifelong parasitostatic benzimidazoles.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cure is only available for early and limited hepatic disease amenable to
      R0-surgical resection. Advanced disease, ineligible for surgery, is
      treated with benzimidazoles with a parasitostatic effect on Echinococcus
      multilocularis.
    explanation: >-
      States why AE is burdensome: definitive cure is anatomically limited, and
      inoperable disease is suppressed rather than eradicated.
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The prognosis of alveolar echinococcosis ranges from excellent to poor
      depending mainly on the extent of hepatopathy induced by irreversible
      damage to the biliary and vascular system of the liver.
    explanation: >-
      Links long-term prognosis to the irreversible hepatobiliary and vascular
      injury caused by the infiltrative lesion.
infectious_agent:
- name: Echinococcus multilocularis
  description: >-
    Taeniid cestode whose larval metacestode stage causes alveolar
    echinococcosis in aberrant intermediate human hosts.
  infectious_agent_term:
    preferred_term: Echinococcus multilocularis
    term:
      id: NCBITaxon:6211
      label: Echinococcus multilocularis
  evidence:
  - reference: PMID:34524197
    reference_title: "Alveolar echinococcosis: what triggers emergence in North America, Central Europe and Asia?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Infection with the larval (metacestode) stage of Echinococcus
      multilocularis causes alveolar echinococcosis (AE), a serious hepatic
      disorder.
    explanation: >-
      Identifies E. multilocularis metacestodes as the larval agent of AE.
agent_life_cycle:
  description: >-
    Adult E. multilocularis tapeworms live in canid definitive hosts, including
    foxes and dogs, and shed eggs in feces. Wild rodents serve as usual
    intermediate hosts in the natural cycle. Humans accidentally occupy the
    intermediate-host position after ingesting eggs; released oncospheres cross
    the gut wall and reach the liver through the portal vein, where the
    metacestode develops but does not close the canid-rodent cycle.
  hosts:
  - preferred_term: Canidae
    role: definitive host family including foxes and dogs
    term:
      id: NCBITaxon:9608
      label: Canidae
  - preferred_term: domestic dog
    role: definitive host
    term:
      id: NCBITaxon:9615
      label: Canis lupus familiaris
  - preferred_term: fox
    role: definitive host
    term:
      id: NCBITaxon:9625
      label: Vulpes
  - preferred_term: wild rodents
    role: usual intermediate hosts in the sylvatic cycle
    term:
      id: NCBITaxon:9989
      label: Rodentia
  - preferred_term: human
    role: aberrant intermediate host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  life_cycle_stages:
  - name: Adult tapeworm in the canid intestine
    life_cycle_stage_term:
      preferred_term: adult tapeworm stage
      term:
        id: OPL:0000237
        label: adult parasitic worm stage
    description: >-
      Adult E. multilocularis inhabits the small intestine of canid definitive
      hosts such as foxes and dogs.
    evidence:
    - reference: PMID:39311470
      reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The adult stage of this Taeniid flatworm resides in the small intestine
        of canids, such as foxes and dogs.
      explanation: >-
        Places the adult tapeworm stage in the small intestine of canid
        definitive hosts.
  - name: Egg stage shed in canid feces
    life_cycle_stage_term:
      preferred_term: egg shed in canid feces
      term:
        id: OPL:0000180
        label: egg stage
    description: >-
      Adult worms release eggs that leave the canid host in feces and
      contaminate the environment.
    evidence:
    - reference: PMID:39311470
      reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        This worm lays eggs, which are eliminated in the environment with the
        feces of the host.
      explanation: >-
        Supports egg shedding from definitive hosts into the environment.
  - name: Rodent oncosphere migration to the liver
    description: >-
      Rodents ingest eggs in the natural intermediate-host phase; released
      larvae cross the intestine and disseminate to the liver through the portal
      vein.
    evidence:
    - reference: PMID:39311470
      reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        wild rodents, which are usual intermediate hosts, ingest eggs, which
        hatch in the intestine and release larvae, which than translocate across
        the intestinal barrier towards the liver through the portal vein
      explanation: >-
        Names rodents as usual intermediate hosts and describes the intestinal
        and portal migration that seeds the liver.
  - name: Human hepatic metacestode stage
    description: >-
      Humans are aberrant intermediate hosts in whom the larval metacestode
      expands within the liver and produces disease without returning to the
      canid definitive host.
    evidence:
    - reference: PMID:39311470
      reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Humans, as aberrant intermediate hosts, become infected by ingesting
        eggs through contaminated water, food or hands.
      explanation: >-
        Supports the accidental human intermediate-host position and the
        fecal-oral egg exposure.
    - reference: PMID:39311470
      reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In the remaining patients, the metacestode will indefinitely grow in the
        liver, leading to a cancer-like disease leading to death in the absence
        of treatment
      explanation: >-
        Supports hepatic metacestode growth as the human disease stage.
transmission:
- name: Fecal-oral egg ingestion
  description: >-
    Humans acquire E. multilocularis by ingesting eggs that originated in canid
    feces and contaminated food, water, or hands.
  evidence:
  - reference: PMID:28212790
    reference_title: "The Echinococcoses: Diagnosis, Clinical Management and Burden of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The echinococcoses are chronic, parasitic diseases that are acquired after
      ingestion of infective taeniid tapeworm eggs from certain species of the
      genus Echinococcus.
    explanation: >-
      States the egg-ingestion route for Echinococcus diseases.
  - reference: PMID:39311470
    reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Humans, as aberrant intermediate hosts, become infected by ingesting eggs
      through contaminated water, food or hands.
    explanation: >-
      Specifies water, food, and hands as human fecal-oral exposure vehicles.
prevalence:
- population: Northern Hemisphere, especially China
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Alveolar echinococcosis is a rare but regionally endemic zoonosis restricted
    to the Northern Hemisphere, with China carrying most recognized cases.
  evidence:
  - reference: PMID:34161992
    reference_title: Hepatic Alveolar Echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      HAE is present only in the Northern Hemisphere, predominantly in China.
    explanation: >-
      Establishes the broad geographic distribution and China-heavy burden of
      hepatic AE.
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is endemic in the Northern Hemisphere with more than 90% of cases
      occurring in China.
    explanation: >-
      Refines the distribution with the current estimate that most cases occur
      in China.
pathophysiology:
- name: Egg Ingestion and Portal Liver Seeding
  description: >-
    Ingested eggs release larvae that cross the intestinal barrier and reach the
    liver through the portal venous system, establishing the human metacestode.
  downstream:
  - target: Infiltrative Hepatic Metacestode Growth
    causal_link_type: DIRECT
    description: >-
      Portal delivery to the liver seeds the larval stage that expands as the
      metacestode lesion.
  evidence:
  - reference: PMID:39311470
    reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Humans, as aberrant intermediate hosts, become infected by ingesting eggs
      through contaminated water, food or hands.
    explanation: >-
      Identifies the exposure that initiates the portal-seeding branch.
- name: Infiltrative Hepatic Metacestode Growth
  description: >-
    E. multilocularis metacestodes grow as infiltrative, pseudotumoral
    intrahepatic masses, directly damaging liver parenchyma and resembling a
    malignant liver process.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: Pseudotumoral Hepatic Lesion
    causal_link_type: DIRECT
    description: >-
      The intrahepatic metacestode mass is the lesion detected by ultrasound,
      CT, and MRI.
  - target: Biliary and Vascular Invasion
    causal_link_type: DIRECT
    description: >-
      Local infiltrative growth extends to the biliary and vascular structures
      that determine complications and prognosis.
  evidence:
  - reference: PMID:34161992
    reference_title: Hepatic Alveolar Echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hepatic alveolar echinococcosis (HAE) is a rare but severe zoonosis caused
      by the pseudotumoral intrahepatic development of the larval stage of the
      tapeworm Echinococcus multilocularis.
    explanation: >-
      Identifies the intrahepatic pseudotumoral larval lesion as the core lesion
      of HAE.
  - reference: PMID:30755313
    reference_title: "Hepatic alveolar hydatid disease (Echinococcus multilocularis), a mimic of liver malignancy: a review for the radiologist in non-endemic areas."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is rare compared to cystic echinococcosis (CE), but like CE commonly
      affects the liver.
    explanation: >-
      Supports the liver as the principal affected organ.
- name: Biliary and Vascular Invasion
  description: >-
    Central infiltration and compression of bile ducts, portal venous branches,
    hepatic veins, and the inferior vena cava drive cholestasis, portal
    hypertension, Budd-Chiari physiology, secondary biliary sclerosis, and
    progressive liver-function loss.
  downstream:
  - target: Jaundice
    causal_link_type: DIRECT
    description: Biliary involvement can present as painless jaundice.
  - target: Portal Hypertension
    causal_link_type: DIRECT
    description: >-
      Portal-vein compression or thrombosis, hepatic-vein or vena-cava
      obstruction, and cirrhosis can converge on portal hypertension.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Painless jaundice is a sign of infiltration of the liver hilum and central
      biliary vessel involvement.
    explanation: >-
      Connects central biliary infiltration to the jaundice phenotype.
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alveolar echinococcosis-related portal hypertension can develop due to
      posthepatic pathology, intrahepatic pathology and prehepatic pathology.
    explanation: >-
      Supports vascular and biliary sequelae as causes of portal hypertension.
- name: Metastasis-like Local Extension and Hematogenous Spread
  description: >-
    Advanced hepatic lesions can extend into adjacent abdominal organs and seed
    distant organs such as lung or brain through hematogenous dissemination.
  downstream:
  - target: Multiorgan Alveolar Echinococcosis
    causal_link_type: DIRECT
    description: >-
      Spread beyond the liver produces extrahepatic lesions that are staged by
      the N and M portions of the WHO-IWGE PNM system.
  evidence:
  - reference: PMID:28212790
    reference_title: "The Echinococcoses: Diagnosis, Clinical Management and Burden of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      clinical manifestations associated with AE resemble those of a
      'malignant', silently-progressing liver disease, with local tissue
      infiltration and metastases.
    explanation: >-
      Describes the malignant-like local infiltration and metastatic behavior of
      AE.
phenotypes:
- name: Pseudotumoral Hepatic Lesion
  category: Digestive
  description: >-
    Alveolar metacestodes appear as hepatic mass lesions with variable solid,
    cystic, necrotic, and calcified imaging components that can mimic
    malignancy.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Radiologically, alveolar echinococcosis manifestations are
      morphologically diverse and should be considered in the differential
      diagnosis of malignant and benign liver lesions.
    explanation: >-
      Supports hepatic pseudotumor-like lesions as a core radiologic phenotype.
- name: Right Upper Quadrant Pain
  category: Digestive
  description: >-
    Hepatic lesions can be detected during evaluation of right-upper-quadrant
    or other abdominal complaints.
  phenotype_term:
    preferred_term: right upper quadrant pain
    term:
      id: HP:0002027
      label: Abdominal pain
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most alveolar echinococcosis liver lesions are discovered in patients
      assessed for right upper quadrant pain, other nonspecific general
      complaints or raised liver enzymes.
    explanation: >-
      Reports right-upper-quadrant pain as one presentation that prompts
      discovery of AE liver lesions.
- name: Jaundice
  category: Digestive
  description: >-
    Infiltration of the liver hilum and central biliary structures can cause
    painless jaundice.
  phenotype_term:
    preferred_term: Jaundice
    term:
      id: HP:0000952
      label: Jaundice
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Painless jaundice is a sign of infiltration of the liver hilum and central
      biliary vessel involvement.
    explanation: >-
      Supports jaundice as a manifestation of central biliary infiltration.
- name: Portal Hypertension
  category: Digestive
  description: >-
    Advanced alveolar echinococcosis can produce portal hypertension through
    prehepatic, intrahepatic, or posthepatic vascular and biliary injury.
  phenotype_term:
    preferred_term: Portal hypertension
    term:
      id: HP:0001409
      label: Portal hypertension
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alveolar echinococcosis-related portal hypertension can develop due to
      posthepatic pathology, intrahepatic pathology and prehepatic pathology.
    explanation: >-
      Supports portal hypertension as a vascular complication of AE.
- name: Multiorgan Alveolar Echinococcosis
  category: Systemic
  description: >-
    Extrahepatic extension or hematogenous metastasis can involve neighboring
    organs or distant organs and is tracked in the N and M domains of PNM
    staging.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It describes the extension of the parasitic mass in the liver (P), the
      involvement of neighboring organs (N) and metastases (M)
    explanation: >-
      Identifies neighboring-organ involvement and metastases as staged
      components of AE extent.
diagnosis:
- name: Hepatic Ultrasonography
  description: >-
    Ultrasound is the key first-line modality for hepatic AE and can identify
    characteristic lesions and calcifications.
  diagnosis_term:
    preferred_term: Ultrasound Imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:34161992
    reference_title: Hepatic Alveolar Echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ultrasonography is the key first-line diagnostic procedure, with specific
      serology providing confirmation in 95% of the cases.
    explanation: >-
      Establishes ultrasound as the first-line diagnostic procedure.
- name: Echinococcus Serology
  description: >-
    Serology with Echinococcus antigens is used in the diagnostic workup and can
    confirm compatible imaging findings.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Highly sensitive ELISA tests with purified or recombinant Echinococcus
      antigens (EgHF, Em2, Em2+, recEm18-ELISA) are used as the first step in a
      two-step-procedure.
    explanation: >-
      Supports Echinococcus antigen serology as part of the AE diagnostic
      algorithm.
- name: Echinococcus multilocularis PCR
  description: >-
    Histopathology and E. multilocularis-specific PCR or sequencing can confirm
    the parasite in biopsied tissue when imaging and serology are insufficient
    or when malignancy is suspected.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:39311470
    reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      parasite identification (histopathology or molecular biology such as
      E. multilocularis-specific qPCR or DNA sequencing)
    explanation: >-
      Names PCR and DNA sequencing as parasite-identification techniques in the
      AE diagnostic workup.
treatments:
- name: R0 Surgical Resection
  description: >-
    Complete surgical excision of all AE lesions is the only curative treatment
    and is reserved for lesions in which an R0 resection is feasible; expert
    consensus pairs surgery with postoperative benzimidazole treatment.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Surgical treatment is the only treatment that can cure alveolar
      echinococcosis.
    explanation: >-
      Establishes complete surgery as the only curative approach.
- name: Albendazole or Mebendazole Suppressive Therapy
  description: >-
    Benzimidazoles, chiefly albendazole or mebendazole, are the recommended
    parasitostatic drugs for AE. They are used after complete resection to
    prevent relapse and as long-term or lifelong suppression in inoperable
    disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: albendazole
      term:
        id: CHEBI:16664
        label: albendazole
  evidence:
  - reference: PMID:39311470
    reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Benzimidazoles are the only compounds recommended for the treatment of AE;
      however, these are parasitostatic, which means that the parasite can
      resume growth when treatment is interrupted.
    explanation: >-
      Establishes benzimidazoles as the recommended drug class and explains why
      therapy must continue when lesions are not completely removed.
environmental:
- name: Immunosuppression
  description: >-
    Therapeutic or pathologic immunosuppression increases the chance that
    exposure progresses to active AE and accelerates growth and metastatic
    dissemination once active disease is present.
  effect: Predisposes to active and disseminated alveolar echinococcosis.
  influences_mechanisms:
  - target: Infiltrative Hepatic Metacestode Growth
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Impaired protective immunity permits faster metacestode growth and spread.
    evidence:
    - reference: PMID:39311470
      reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        immunocompromized individuals are more at risk for developing the
        disease, with an accelerated course, and a higher risk of metastatic
        dissemination
      explanation: >-
        Links immunocompromise to active disease risk, faster progression, and
        metastatic spread.
  evidence:
  - reference: PMID:34524197
    reference_title: "Alveolar echinococcosis: what triggers emergence in North America, Central Europe and Asia?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      AE develops in a few healthy individuals, but preferentially in
      immunosuppressed patients.
    explanation: >-
      Establishes immunosuppression as a host susceptibility factor for
      symptomatic AE.
differential_diagnoses:
- name: Hepatic Malignancy
  description: >-
    AE hepatic lesions can resemble cholangiocarcinoma or metastases and are
    therefore a major malignant mimic on imaging and clinical presentation.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Since infiltrative growth is similar to carcinomatous spread, alveolar
      echinococcosis is considered a malignant parasitosis.
    explanation: >-
      Explains why hepatic cancers enter the radiologic differential.
- name: Cystic Echinococcosis
  description: >-
    Some AE lesions have cystic or pseudocystic appearance and must not be
    mistaken for inactive cystic echinococcosis, because cyst-sterilizing
    techniques used for cystic disease can be harmful in AE.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Misclassifying alveolar echinococcosis as cystic echinococcosis is a major
      pitfall, which can lead to catastrophic outcomes if cyst-sterilizing
      techniques are applied
    explanation: >-
      Identifies cystic echinococcosis as a high-stakes mimic of AE.

      id: HP:0000952
      label: Jaundice
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Painless jaundice is a sign of infiltration of the liver hilum and central
      biliary vessel involvement.
    explanation: >-
      Supports jaundice as a manifestation of central biliary infiltration.
- name: Portal Hypertension
  category: Digestive
  description: >-
    Advanced alveolar echinococcosis can produce portal hypertension through
    prehepatic, intrahepatic, or posthepatic vascular and biliary injury.
  phenotype_term:
    preferred_term: Portal hypertension
    term:
      id: HP:0001409
      label: Portal hypertension
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alveolar echinococcosis-related portal hypertension can develop due to
      posthepatic pathology, intrahepatic pathology and prehepatic pathology.
    explanation: >-
      Supports portal hypertension as a vascular complication of AE.
- name: Multiorgan Alveolar Echinococcosis
  category: Systemic
  description: >-
    Extrahepatic extension or hematogenous metastasis can involve neighboring
    organs or distant organs and is tracked in the N and M domains of PNM
    staging.
  notes: >-
    Left unbound: AE involvement of neighboring organs and distant
    metastasis-like lesions is staged by the PNM system but has no exact
    non-neoplastic multiorgan-infection HPO term in the cached HP labels.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It describes the extension of the parasitic mass in the liver (P), the
      involvement of neighboring organs (N) and metastases (M)
    explanation: >-
      Identifies neighboring-organ involvement and metastases as staged
      components of AE extent.
- name: Fatigue
  category: Systemic
  description: Advanced AE can present with fatigue, mimicking malignancy or tuberculosis.
  phenotype_term:
    preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In advanced alveolar echinococcosis, patients may present with fatigue,
      night sweats and weight loss, mimicking malignant disease or tuberculosis.
    explanation: >-
      Names fatigue as a constitutional manifestation of advanced AE.
- name: Night Sweats
  category: Systemic
  description: Advanced AE can present with night sweats in a malignant mimic pattern.
  phenotype_term:

      Names weight loss as a constitutional manifestation of advanced AE.
- name: Budd-Chiari Syndrome
  category: Hepatic
  description: >-
    Infiltration of the hepatic segment of the inferior vena cava can obstruct
    hepatic venous outflow and produce chronic Budd-Chiari syndrome.
  phenotype_term:
    preferred_term: Budd-Chiari syndrome
    term:
      id: HP:0002639
      label: Budd-Chiari syndrome
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alveolar echinococcosis-related infiltration of the hepatic segment of the
      inferior vena cava causes chronic Budd–Chiari syndrome and progressive
      damage to liver tissue and liver cirrhosis.
    explanation: >-
      Supports chronic Budd-Chiari syndrome from AE involvement of hepatic venous
      outflow.
- name: Pulmonary Metastasis-like Alveolar Echinococcosis
  category: Respiratory
  description: >-
    The lung is the most common distant organ involved by hematogenous
    metastasis-like spread from hepatic AE.
  notes: >-
    Left unbound: a gitignore-independent search of the cached HPO labels for
    lung or pulmonary metastasis terms found only neoplastic terms, whereas AE
    lung lesions are infectious metacestodes rather than true neoplasms.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Distant metastases are most common in the lung but can be found in every
      organ.
    explanation: >-
      Identifies the lung as the commonest distant site for AE metastasis-like
      dissemination.
  - reference: PMID:37567730
    reference_title: >-
      Vascular pathology in patients with alveolar echinococcosis: framework for
      assessment and clinical management - a retrospective case series.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Distant metastases and/or extrahepatic manifestations were present in 16
      patients (8.6%) with 14 cases of (7.5%) lung metastases.
    explanation: >-
      Documents lung involvement as the main distant site in a liver-AE clinical
      series.
histopathology:
- name: Necrotic AE lesion with PAS-positive laminated layer
  description: >-
    Biopsy or resection specimens show necrotic areas and E. multilocularis
    laminated layers that stain with periodic acid-Schiff; the laminated layer
    helps distinguish alveolar from cystic echinococcosis.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Histopathological presentation of alveolar echinococcosis is characterized
      by necrotic areas and the detection of laminated layers on Periodic
      acid–Schiff (PAS) reaction.
    explanation: >-
      Identifies the necrotic lesion and PAS-positive laminated layer used for
      tissue diagnosis.
- name: Metacestode microcysts with germinative and laminated layers
  description: >-
    AE metacestodes comprise parasite microcysts with an inner germinative cell
    layer and outer acellular polysaccharide laminated layer within host tissue.
  evidence:
  - reference: PMID:39311470
    reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The larvae consist in an agglomerate of host tissues and parasitic
      microcysts, each one consisting in a vesicle with a liquid core, an inner
      layer of cells (germinative layer) and an outer acellular polysaccharidic
      layer (laminated layer).
    explanation: >-
      Describes the parasite microcyst architecture seen within AE lesions.
diagnosis:
- name: Hepatic Ultrasonography
  description: >-
    Ultrasound is the key first-line modality for hepatic AE and can identify
    characteristic lesions and calcifications.
  diagnosis_term:
    preferred_term: Ultrasound Imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:34161992
    reference_title: Hepatic Alveolar Echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ultrasonography is the key first-line diagnostic procedure, with specific
      serology providing confirmation in 95% of the cases.
    explanation: >-
      Establishes ultrasound as the first-line diagnostic procedure.
- name: Echinococcus Serology
  description: >-
    Serology with Echinococcus antigens is used in the diagnostic workup and can
    confirm compatible imaging findings.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Highly sensitive ELISA tests with purified or recombinant Echinococcus
      antigens (EgHF, Em2, Em2+, recEm18-ELISA) are used as the first step in a
      two-step-procedure.
    explanation: >-
      Supports Echinococcus antigen serology as part of the AE diagnostic
      algorithm.
- name: Echinococcus multilocularis PCR
  description: >-
    Histopathology and E. multilocularis-specific PCR or sequencing can confirm
    the parasite in biopsied tissue when imaging and serology are insufficient
    or when malignancy is suspected.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:39311470
    reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      parasite identification (histopathology or molecular biology such as
      E. multilocularis-specific qPCR or DNA sequencing)
    explanation: >-
      Names PCR and DNA sequencing as parasite-identification techniques in the
      AE diagnostic workup.
- name: Hepatic MRI or CT staging
  description: >-
    Abdominal MRI or CT is used for initial radiologic staging of the hepatic
    parasite mass and neighboring-organ spread; CT of the chest and brain CT or
    MRI evaluate distant disease.
  diagnosis_term:
    preferred_term: Diagnostic Imaging Testing
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Primary evaluation of alveolar echinococcosis patients includes
      radiological staging by abdominal MRI or CT, CT-chest and cCT/cMRI.
    explanation: >-
      Supports MRI and CT for primary radiologic staging of hepatic, thoracic,
      and cerebral AE extent.
- name: FDG-PET or PET/CT viability assessment
  description: >-
    FDG-PET, often combined with CT or MRI, measures perilesional inflammatory
    metabolic activity as an indirect marker of parasite viability.
  diagnosis_term:
    preferred_term: FDG-Positron Emission Tomography and Computed Tomography Scan
    term:
      id: NCIT:C137817
      label: FDG-Positron Emission Tomography and Computed Tomography Scan
  evidence:
  - reference: PMID:39311470
    reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Imaging techniques can be useful for the assessment of parasite viability,
      especially positron emission tomography (PET) imaging, which can be used to
      detect the metabolic activity of periparasitic immune infiltrate
    explanation: >-
      Supports PET-based assessment of parasite viability through periparasitic
      inflammatory activity.
- name: recEm18 ELISA activity monitoring
  description: >-
    recEm18 serology is used with PET or MRI to judge disease activity and to
    guide individualized decisions about stopping benzimidazole suppression.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Negative FDG PET/CT or MRI results combined with negative serology
      (recEm18 ELISA) are used to guide ending benzimidazole treatment in
      alveolar echinococcosis patients
    explanation: >-
      Identifies recEm18 ELISA as part of activity monitoring during
      benzimidazole follow-up.
treatments:
- name: R0 Surgical Resection
  description: >-
    Complete surgical excision of all AE lesions is the only curative treatment
    and is reserved for lesions in which an R0 resection is feasible; expert
    consensus pairs surgery with postoperative benzimidazole treatment.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
  target_mechanisms:
  - target: Infiltrative Hepatic Metacestode Growth
    treatment_effect: INHIBITS
    description: >-
      Complete resection removes the viable parasite lesion that would otherwise
      keep expanding locally.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Surgical treatment is the only treatment that can cure alveolar
      echinococcosis.
    explanation: >-
      Establishes complete surgery as the only curative approach.
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      According to the current expert consensus, patients receive postoperative
      benzimidazole treatment for a duration of 2 years.
    explanation: >-
      Supports benzimidazole coverage after curative-intent R0 resection.
- name: Liver Transplantation
  description: >-
    Liver transplantation is a last-resort option for otherwise incurable AE with
    severe hepatic dysfunction, used only in carefully selected patients because
    immunosuppression can favor relapse or progression.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: Infiltrative Hepatic Metacestode Growth
    treatment_effect: INHIBITS
    description: >-
      Transplantation replaces the diseased liver when AE has caused otherwise
      incurable hepatic dysfunction.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Liver transplantation is a last resort in patients of otherwise incurable
      disease.
    explanation: >-
      Supports transplantation as a last-resort treatment for otherwise
      incurable AE.
- name: Ex vivo liver resection and autotransplantation
  description: >-
    ELRA removes the liver for back-table lesion resection and reconstruction
    before autotransplanting the remnant, extending radical surgery to selected
    advanced AE with portal, hepatic-vein, caval, arterial, or biliary
    involvement, including end-stage lesions and Budd-Chiari presentations.
  notes: >-
    Bound to generic NCIT:C15329 Surgical Procedure because a
    gitignore-independent search of cached NCIT labels did not identify an exact
    ex vivo liver resection and autotransplantation term; Hepatectomy and Liver
    Transplantation are narrower near matches for only parts of the procedure.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Infiltrative Hepatic Metacestode Growth
    treatment_effect: INHIBITS
    description: >-
      ELRA permits radical resection and vascular or biliary reconstruction for
      lesions that cannot be treated by conventional in situ hepatectomy.
  evidence:
  - reference: PMID:41754385
    reference_title: >-
      Alveolar Echinococcosis in the Early 2020s: A Systematic Review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      ex vivo liver resection and autotransplantation (ELRA), where a
      significant portion of the liver is extracted, lesion resection is
      performed, and then the remaining tissue is autotransplanted back into the
      patient
    explanation: >-
      Defines ELRA as resection of the explanted liver followed by
      autotransplantation of the remaining tissue.
  - reference: PMID:41754385
    reference_title: >-
      Alveolar Echinococcosis in the Early 2020s: A Systematic Review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Generally, ELRA is indicated for patients with lesions extending towards
      the portal vein, hepatic veins, and/or arteries (P4 on the PNM scale),
      with or without neighboring organ invasion (N0 or N1) and metastases (M0
      or M1)
    explanation: >-
      Supports ELRA as an option for advanced AE with major portal, hepatic
      venous, arterial, neighboring-organ, or distant involvement.
- name: Repeated ERCP with balloon dilatation or stenting
  description: >-
    Endoscopic retrograde cholangiography with balloon dilatation or stenting is
    used to restore bile flow across AE-related central biliary stenoses.
  target_mechanisms:
  - target: Recurrent Biliary Obstruction and Secondary Biliary Sclerosis
    treatment_effect: RESTORES
    description: >-
      Endoscopic dilation or stenting mechanically reopens obstructed central
      bile ducts.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Biliary infiltration and obstruction are treated by repeated ERCP with
      balloon dilatation or stenting until bile flow is restored
    explanation: >-
      Supports ERCP dilation or stenting for AE biliary obstruction.
- name: Albendazole or Mebendazole Suppressive Therapy
  description: >-
    Benzimidazoles, chiefly albendazole or mebendazole, are the recommended
    parasitostatic drugs for AE. They are used after complete resection to
    prevent relapse and as long-term or lifelong suppression in inoperable
    disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: albendazole
      term:
        id: CHEBI:16664
        label: albendazole
    - preferred_term: mebendazole
      term:
        id: CHEBI:6704
        label: mebendazole
  target_mechanisms:
  - target: Infiltrative Hepatic Metacestode Growth
    treatment_effect: INHIBITS
    description: >-
      Albendazole and mebendazole suppress growth of viable metacestode cells.
  evidence:
  - reference: PMID:39311470
    reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Benzimidazoles are the only compounds recommended for the treatment of AE;
      however, these are parasitostatic, which means that the parasite can
      resume growth when treatment is interrupted.
    explanation: >-
      Establishes benzimidazoles as the recommended drug class and explains why
      therapy must continue when lesions are not completely removed.
environmental:
- name: Immunosuppression
  description: >-
    Therapeutic or pathologic immunosuppression increases the chance that
    exposure progresses to active AE and accelerates growth and metastatic
    dissemination once active disease is present.
  effect: Predisposes to active and disseminated alveolar echinococcosis.
  influences_mechanisms:
  - target: Periparasitic Immune Infiltration and Tolerance
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Impaired protective immunity shifts the periparasitic host response toward
      weaker metacestode control, permitting faster growth and spread.
    evidence:
    - reference: PMID:39311470
      reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        immunocompromized individuals are more at risk for developing the
        disease, with an accelerated course, and a higher risk of metastatic
        dissemination
      explanation: >-
        Links immunocompromise to active disease risk, faster progression, and
        metastatic spread.
  evidence:
  - reference: PMID:34524197
    reference_title: "Alveolar echinococcosis: what triggers emergence in North America, Central Europe and Asia?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      AE develops in a few healthy individuals, but preferentially in
      immunosuppressed patients.
    explanation: >-
      Establishes immunosuppression as a host susceptibility factor for
      symptomatic AE.
differential_diagnoses:
- name: Hepatic Malignancy
  description: >-
    AE hepatic lesions can resemble cholangiocarcinoma or metastases and are
    therefore a major malignant mimic on imaging and clinical presentation.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Since infiltrative growth is similar to carcinomatous spread, alveolar
      echinococcosis is considered a malignant parasitosis.
    explanation: >-
      Explains why hepatic cancers enter the radiologic differential.
- name: Cystic Echinococcosis
  description: >-
    Some AE lesions have cystic or pseudocystic appearance and must not be
    mistaken for inactive cystic echinococcosis, because cyst-sterilizing
    techniques used for cystic disease can be harmful in AE.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Misclassifying alveolar echinococcosis as cystic echinococcosis is a major
      pitfall, which can lead to catastrophic outcomes if cyst-sterilizing
      techniques are applied
    explanation: >-
      Identifies cystic echinococcosis as a high-stakes mimic of AE.

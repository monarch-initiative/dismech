name: Alveolar echinococcosis
creation_date: "2026-11-14T00:00:00Z"
category: Infectious Disease
description: >-
  Alveolar echinococcosis is a Northern-Hemisphere zoonotic helminth infection
  caused by the larval metacestode stage of Echinococcus multilocularis. Adult
  tapeworms live in canids such as foxes and dogs and shed eggs in feces; wild
  rodents are the usual intermediate hosts, and humans become aberrant
  intermediate hosts after ingesting eggs from contaminated food, water, or
  hands. In humans, the metacestode develops in the liver and grows as a
  pseudotumoral infiltrative lesion that mimics hepatic malignancy, invades
  biliary and vascular structures, can extend into neighboring organs or
  metastasize hematogenously, and requires either complete R0 resection plus
  benzimidazole therapy or long-term parasitostatic benzimidazole suppression
  when surgery is not feasible.
disease_term:
  preferred_term: alveolar echinococcosis
  term:
    id: MONDO:0017282
    label: alveolar echinococcosis
parents:
- Echinococcosis
- Liver disorder
- Digestive system infectious disorder
synonyms:
- Echinococcus multilocularis infection
- Hepatic alveolar echinococcosis
- Alveolar hydatid disease
notes: >-
  Lump/split decision: alveolar echinococcosis is kept as the
  E. multilocularis clinical form of Echinococcosis, parallel to the existing
  Cystic_Echinococcosis and Polycystic_Echinococcosis entries. It is
  species-specific and clinically distinct: unlike E. granulosus cystic disease
  it forms an infiltrative hepatic metacestode that is staged and managed like a
  malignant liver process, and unlike E. vogeli polycystic disease it is
  maintained in a Northern-Hemisphere canid-rodent cycle.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Alveolar echinococcosis is rare, slow and often hepatic for years, but it
    behaves as a malignant parasitosis once active lesions expand. Irreversible
    biliary and vascular damage drives prognosis; cure requires complete R0
    resection of early limited disease, and advanced inoperable disease depends
    on lifelong parasitostatic benzimidazoles.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cure is only available for early and limited hepatic disease amenable to
      R0-surgical resection. Advanced disease, ineligible for surgery, is
      treated with benzimidazoles with a parasitostatic effect on Echinococcus
      multilocularis.
    explanation: >-
      States why AE is burdensome: definitive cure is anatomically limited, and
      inoperable disease is suppressed rather than eradicated.
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The prognosis of alveolar echinococcosis ranges from excellent to poor
      depending mainly on the extent of hepatopathy induced by irreversible
      damage to the biliary and vascular system of the liver.
    explanation: >-
      Links long-term prognosis to the irreversible hepatobiliary and vascular
      injury caused by the infiltrative lesion.
infectious_agent:
- name: Echinococcus multilocularis
  description: >-
    Taeniid cestode whose larval metacestode stage causes alveolar
    echinococcosis in aberrant intermediate human hosts.
  infectious_agent_term:
    preferred_term: Echinococcus multilocularis
    term:
      id: NCBITaxon:6211
      label: Echinococcus multilocularis
  evidence:
  - reference: PMID:34524197
    reference_title: "Alveolar echinococcosis: what triggers emergence in North America, Central Europe and Asia?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Infection with the larval (metacestode) stage of Echinococcus
      multilocularis causes alveolar echinococcosis (AE), a serious hepatic
      disorder.
    explanation: >-
      Identifies E. multilocularis metacestodes as the larval agent of AE.
agent_life_cycle:
  description: >-
    Adult E. multilocularis tapeworms live in canid definitive hosts, including
    foxes and dogs, and shed eggs in feces. Wild rodents serve as usual
    intermediate hosts in the natural cycle. Humans accidentally occupy the
    intermediate-host position after ingesting eggs; released larvae develop in
    the liver as metacestodes but do not close the canid-rodent cycle.
  hosts:
  - preferred_term: Canidae
    role: definitive host family including foxes and dogs
    term:
      id: NCBITaxon:9608
      label: Canidae
  - preferred_term: domestic dog
    role: definitive host
    term:
      id: NCBITaxon:9615
      label: Canis lupus familiaris
  - preferred_term: fox
    role: definitive host
    term:
      id: NCBITaxon:9625
      label: Vulpes
  - preferred_term: wild rodents
    role: usual intermediate hosts in the sylvatic cycle
    term:
      id: NCBITaxon:9989
      label: Rodentia
  - preferred_term: human
    role: aberrant intermediate host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  life_cycle_stages:
  - name: Adult tapeworm in the canid intestine
    life_cycle_stage_term:
      preferred_term: adult tapeworm stage
      term:
        id: OPL:0000237
        label: adult parasitic worm stage
    description: >-
      Adult E. multilocularis inhabits the small intestine of canid definitive
      hosts such as foxes and dogs.
    evidence:
    - reference: PMID:39311470
      reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The adult stage of this Taeniid flatworm resides in the small intestine
        of canids, such as foxes and dogs.
      explanation: >-
        Places the adult tapeworm stage in the small intestine of canid
        definitive hosts.
  - name: Egg stage shed in canid feces
    life_cycle_stage_term:
      preferred_term: egg shed in canid feces
      term:
        id: OPL:0000180
        label: egg stage
    description: >-
      Adult worms release eggs that leave the canid host in feces and
      contaminate the environment.
    evidence:
    - reference: PMID:39311470
      reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        This worm lays eggs, which are eliminated in the environment with the
        feces of the host.
      explanation: >-
        Supports egg shedding from definitive hosts into the environment.
  - name: Rodent oncosphere migration to the liver
    description: >-
      Rodents ingest eggs in the natural intermediate-host phase; released
      larvae cross the intestine and disseminate to the liver through the portal
      vein.
    evidence:
    - reference: PMID:39311470
      reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        wild rodents, which are usual intermediate hosts, ingest eggs, which
        hatch in the intestine and release larvae, which than translocate across
        the intestinal barrier towards the liver through the portal vein
      explanation: >-
        Names rodents as usual intermediate hosts and describes the intestinal
        and portal migration that seeds the liver.
  - name: Human hepatic metacestode stage
    description: >-
      Humans are aberrant intermediate hosts in whom the larval metacestode
      expands within the liver and produces disease without returning to the
      canid definitive host.
    evidence:
    - reference: PMID:39311470
      reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Humans, as aberrant intermediate hosts, become infected by ingesting
        eggs through contaminated water, food or hands.
      explanation: >-
        Supports the accidental human intermediate-host position and the
        fecal-oral egg exposure.
    - reference: PMID:39311470
      reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In the remaining patients, the metacestode will indefinitely grow in the
        liver, leading to a cancer-like disease leading to death in the absence
        of treatment
      explanation: >-
        Supports hepatic metacestode growth as the human disease stage.
transmission:
- name: Fecal-oral egg ingestion
  description: >-
    Humans acquire E. multilocularis by ingesting eggs that originated in canid
    feces and contaminated food, water, or hands.
  evidence:
  - reference: PMID:28212790
    reference_title: "The Echinococcoses: Diagnosis, Clinical Management and Burden of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The echinococcoses are chronic, parasitic diseases that are acquired after
      ingestion of infective taeniid tapeworm eggs from certain species of the
      genus Echinococcus.
    explanation: >-
      States the egg-ingestion route for Echinococcus diseases.
  - reference: PMID:39311470
    reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Humans, as aberrant intermediate hosts, become infected by ingesting eggs
      through contaminated water, food or hands.
    explanation: >-
      Specifies water, food, and hands as human fecal-oral exposure vehicles.
prevalence:
- population: Northern Hemisphere, especially China
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Alveolar echinococcosis is a rare but regionally endemic zoonosis restricted
    to the Northern Hemisphere, with China carrying most recognized cases.
  evidence:
  - reference: PMID:34161992
    reference_title: Hepatic Alveolar Echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hepatic alveolar echinococcosis (HAE) is a rare but severe zoonosis
      caused by the pseudotumoral intrahepatic development of the larval stage
      of the tapeworm Echinococcus multilocularis. HAE is present only in the
      Northern Hemisphere, predominantly in China.
    explanation: >-
      Establishes the broad geographic distribution and China-heavy burden of
      hepatic AE.
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is endemic in the Northern Hemisphere with more than 90% of cases
      occurring in China.
    explanation: >-
      Refines the distribution with the current estimate that most cases occur
      in China.
stages:
- name: WHO-IWGE PNM staging
  description: >-
    The WHO Informal Working Group on Echinococcosis PNM system stages hepatic
    parasite-mass extension, neighboring-organ involvement, and distant
    metastases for alveolar echinococcosis using a malignancy-like framework.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It describes the extension of the parasitic mass in the liver (P), the
      involvement of neighboring organs (N) and metastases (M)
    explanation: >-
      Identifies the P, N, and M components used to stage the malignant-like
      growth pattern of AE.
pathophysiology:
- name: Egg Ingestion and Hepatic Larval Establishment
  description: >-
    Ingested eggs establish the human hepatic E. multilocularis metacestode
    stage that drives alveolar echinococcosis.
  downstream:
  - target: Infiltrative Hepatic Metacestode Growth
    causal_link_type: DIRECT
    description: >-
      Human egg ingestion is upstream of the liver metacestode lesion that
      expands as the active parasite mass.
  evidence:
  - reference: PMID:39311470
    reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Humans, as aberrant intermediate hosts, become infected by ingesting eggs
      through contaminated water, food or hands.
    explanation: >-
      Identifies the exposure that initiates the hepatic metacestode branch.
- name: Infiltrative Hepatic Metacestode Growth
  description: >-
    E. multilocularis metacestodes grow as infiltrative, pseudotumoral
    intrahepatic masses, directly damaging liver parenchyma and resembling a
    malignant liver process.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: Pseudotumoral Hepatic Lesion
    causal_link_type: DIRECT
    description: >-
      The intrahepatic metacestode mass is the lesion detected by ultrasound,
      CT, and MRI.
  - target: Periparasitic Immune Infiltration and Tolerance
    causal_link_type: DIRECT
    description: >-
      Viable metacestodes are surrounded by a host immune infiltrate that
      constrains, tolerates, and helps wall off the parasite.
  - target: Biliary Infiltration and Obstruction
    causal_link_type: DIRECT
    description: >-
      Local infiltrative growth reaches central bile ducts and can obstruct
      biliary drainage.
  - target: Vascular Infiltration and Thrombosis
    causal_link_type: DIRECT
    description: >-
      Local infiltrative growth reaches the portal vein, hepatic veins, and
      inferior vena cava.
  - target: Direct Extrahepatic Extension
    causal_link_type: DIRECT
    description: >-
      Locally advanced lesions can extend from the liver into adjacent organs.
  - target: Hematogenous Distant Dissemination
    causal_link_type: DIRECT
    description: >-
      Advanced lesions can seed distant organs through hematogenous spread.
  evidence:
  - reference: PMID:34161992
    reference_title: Hepatic Alveolar Echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hepatic alveolar echinococcosis (HAE) is a rare but severe zoonosis caused
      by the pseudotumoral intrahepatic development of the larval stage of the
      tapeworm Echinococcus multilocularis.
    explanation: >-
      Identifies the intrahepatic pseudotumoral larval lesion as the core lesion
      of HAE.
  - reference: PMID:30755313
    reference_title: "Hepatic alveolar hydatid disease (Echinococcus multilocularis), a mimic of liver malignancy: a review for the radiologist in non-endemic areas."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is rare compared to cystic echinococcosis (CE), but like CE commonly
      affects the liver.
    explanation: >-
      Supports the liver as the principal affected organ.
- name: Periparasitic Immune Infiltration and Tolerance
  description: >-
    E. multilocularis metacestodes induce a mixed periparasitic infiltrate of
    CD4-positive T cells, B cells, plasma cells, and macrophages, with
    regulatory T-cell signals such as FGL-2 dampening antiparasitic immunity.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  evidence:
  - reference: PMID:39311470
    reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      treatment with albendazole increases periparasite infiltration by immune
      cells (T CD4+ cells, B cells, plasmocytes, macrophages) and decreases the
      expression of FGL-2, a mediator secreted by T regulator cells (Tregs)
    explanation: >-
      Names the host immune cells around AE lesions and the Treg-associated
      FGL-2 mediator relevant to immune tolerance.
  downstream:
  - target: Late Periparasitic Fibrosis
    causal_link_type: DIRECT
    description: >-
      A late excessive Th1/Th2 host response walls off the lesion with
      periparasitic fibrosis.
- name: Late Periparasitic Fibrosis
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  description: >-
    Excess late Th1/Th2 inflammation around the metacestode produces
    periparasitic fibrosis that can limit drug diffusion into the lesion.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:39311470
    reference_title: "Chemotherapy for the treatment of alveolar echinococcosis: Where are we?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      an excessive Th1/Th2 response, as observed in the late stage of the disease,
      is responsible for periparasitic fibrosis, limiting diffusion of drugs
    explanation: >-
      Links late host immunity to periparasitic fibrosis and its effect on drug
      penetration.
- name: Biliary Infiltration and Obstruction
  description: >-
    Central infiltration and compression of bile ducts drive painless jaundice,
    recurrent or chronic obstruction, cholangitis risk, and secondary biliary
    sclerosis.
  downstream:
  - target: Jaundice
    causal_link_type: DIRECT
    description: Biliary involvement can present as painless jaundice.
  - target: Recurrent Biliary Obstruction and Secondary Biliary Sclerosis
    causal_link_type: DIRECT
    description: >-
      Chronic alveolar-echinococcosis obstruction of central bile ducts causes
      secondary biliary sclerosis and can progress to cirrhosis.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Painless jaundice is a sign of infiltration of the liver hilum and central
      biliary vessel involvement.
    explanation: >-
      Connects central biliary infiltration to the jaundice phenotype.
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alveolar echinococcosis-related recurrent and chronic biliary obstruction
      leads to secondary biliary sclerosis and ultimately cirrhosis
    explanation: >-
      Supports the chronic obstructive biliary branch.
- name: Recurrent Biliary Obstruction and Secondary Biliary Sclerosis
  description: >-
    Recurrent obstruction of central bile ducts by AE strictures, debris, or
    necrotic-cavity communication drives secondary biliary injury.
  locations:
  - preferred_term: biliary tree
    term:
      id: UBERON:0001173
      label: biliary tree
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Recurrent cholangitis, cholangiosepsis or liver abscess can occur even if
      alveolar echinococcosis-related stenoses of central bile ducts are treated
      with stenting and balloon dilation by repeated endoscopic retrograde
      cholangiography (ERC).
    explanation: >-
      Identifies central bile-duct stenoses and recurrent biliary infection as
      complications of AE biliary obstruction.
- name: Vascular Infiltration and Thrombosis
  description: >-
    Infiltration or compression of the portal vein, hepatic veins, or inferior
    vena cava can cause portal-vein thrombosis, Budd-Chiari physiology, and
    portal hypertension.
  downstream:
  - target: Portal Hypertension
    causal_link_type: DIRECT
    description: >-
      Portal-vein compression or thrombosis, hepatic-vein or vena-cava
      obstruction, and cirrhosis can converge on portal hypertension.
  - target: Budd-Chiari Syndrome
    causal_link_type: DIRECT
    description: >-
      Infiltration of hepatic venous drainage can produce chronic Budd-Chiari
      syndrome.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alveolar echinococcosis-related portal hypertension can develop due to
      posthepatic pathology, intrahepatic pathology and prehepatic pathology.
    explanation: >-
      Supports vascular and biliary sequelae as causes of portal hypertension.
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alveolar echinococcosis-related infiltration of the hepatic segment of the
      inferior vena cava causes chronic Budd–Chiari syndrome and progressive
      damage to liver tissue and liver cirrhosis.
    explanation: >-
      Links inferior-vena-cava infiltration to Budd-Chiari physiology and liver
      injury.
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alveolar echinococcosis-related infiltration or compression of the portal
      vein causes portal vein thrombosis, sometimes with cavernous portal vein
      transformation.
    explanation: >-
      Supports portal-vein involvement as a cause of portal venous obstruction.
  - reference: PMID:37567730
    reference_title: >-
      Vascular pathology in patients with alveolar echinococcosis: framework for
      assessment and clinical management - a retrospective case series.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Over all 69 patients (37.1%) fulfilled radiological criteria for vascular
      involvement. PV was affected in 24.7% (45), HV in 22.6% (42), IVC in 13.4%
      (25) and HA in 5.9% (11).
    explanation: >-
      A 186-patient clinical series documents portal-vein, hepatic-vein,
      inferior-vena-cava, and hepatic-artery involvement in AE.
- name: Direct Extrahepatic Extension
  description: >-
    Advanced hepatic lesions can directly infiltrate neighboring organs, the N
    domain in the WHO-IWGE PNM staging system.
  downstream:
  - target: Multiorgan Alveolar Echinococcosis
    causal_link_type: DIRECT
    description: >-
      Neighboring-organ involvement produces extrahepatic lesions tracked in PNM
      staging.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It describes the extension of the parasitic mass in the liver (P), the
      involvement of neighboring organs (N) and metastases (M)
    explanation: >-
      Defines neighboring-organ involvement as part of AE PNM staging.
- name: Hematogenous Distant Dissemination
  description: >-
    In later disease, hematogenous dissemination can establish distant
    metastasis-like AE lesions, most often in the lung and less often in the
    brain, bone, or other sites.
  downstream:
  - target: Multiorgan Alveolar Echinococcosis
    causal_link_type: DIRECT
    description: >-
      Distant spread produces extrahepatic lesions tracked in PNM staging.
  - target: Pulmonary Metastasis-like Alveolar Echinococcosis
    causal_link_type: DIRECT
    description: >-
      The lung is the most common distant site of metastasis-like AE spread.
  evidence:
  - reference: PMID:28212790
    reference_title: "The Echinococcoses: Diagnosis, Clinical Management and Burden of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      clinical manifestations associated with AE resemble those of a
      'malignant', silently-progressing liver disease, with local tissue
      infiltration and metastases.
    explanation: >-
      Describes the malignant-like metastatic behavior of AE.
  - reference: PMID:41754385
    reference_title: >-
      Alveolar Echinococcosis in the Early 2020s: A Systematic Review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In later stages of infection, the parasitic lesion may spread through the
      hematogenous dissemination of protoscoleces to other organs, with the most
      common secondary sites of infection being the lung and brain
    explanation: >-
      Supports hematogenous spread to distant lung and brain lesions.
phenotypes:
- name: Pseudotumoral Hepatic Lesion
  category: Digestive
  description: >-
    Alveolar metacestodes appear as hepatic mass lesions with variable solid,
    cystic, necrotic, and calcified imaging components that can mimic
    malignancy.
  notes: >-
    Left unbound: a gitignore-independent search of cached HPO labels did not
    identify a specific non-neoplastic hepatic mass term that matches an
    E. multilocularis pseudotumoral lesion.
  evidence:
  - reference: PMID:42676261
    reference_title: Alveolar echinococcosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Radiologically, alveolar echinococcosis manifestations are
      morphologically diverse and should be considered in the differential
      diagnosis of malignant and benign liver lesions.
    explanation: >-
      Supports hepatic pseudotumor-like lesions as a core radiologic phenotype.

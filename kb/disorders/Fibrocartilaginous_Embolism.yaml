environmental:
- name: Axial loading or Valsalva-associated spinal pressure
  description: >-
    Physical exertion, heavy lifting (such as squats), minor trauma, or
    Valsalva-like maneuvers acutely elevate intradiscal and venous pressure and
    precipitate vertical disc herniation and fibrocartilaginous embolization.

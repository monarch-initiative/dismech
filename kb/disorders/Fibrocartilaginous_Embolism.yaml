prevalence:
- population: Published cases worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    Systematic review up to 2014 identified 67 reported cases (41
    histologically confirmed and 26 clinically suspected), while referral-center
    cohorts attribute 5.5% of acute spinal cord infarctions to FCE, indicating
    substantial antemortem under-recognition.
  evidence:
  - reference: PMID:26833287
    reference_title: "Fibrocartilaginous embolism: a comprehensive review of an under-studied cause of spinal cord infarction and proposed diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A total of 67 cases of FCE were found, 41 tissue-confirmed and 26
      clinically suspected.
    explanation: Systematic literature synthesis identified 67 published tissue-confirmed or clinically suspected FCE cases.
  - reference: PMID:20825469
    reference_title: "Clinically suspected fibrocartilaginous embolism: clinical characteristics, treatments, and outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 164 patients with acute spinal cord infarction seen during the study
      timeframe, 9 (5.5%; 95% CI 2.5, 10.2%) met inclusion criteria for high
      likelihood of FCE (6 men, 3 women; median age 46 years old, range 21-64).
    explanation: Mayo Clinic referral-center series establishes that clinically suspected FCE accounts for 5.5% of acute spinal cord infarctions.
progression:
- phase: Hyperacute pain onset and rapid myelopathic nadir
  notes: >-
    Severe axial back, neck, or radicular pain frequently heralds or
    accompanies deficit onset after physical exertion or Valsalva, followed by
    rapid progression to maximal motor and sensory deficits typically within 4
    to 36 hours.
  evidence:
  - reference: PMID:30264146
    reference_title: "Characteristics of Spontaneous Spinal Cord Infarction and Proposed Diagnostic Criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spontaneous SCI presented with rapid severe deficits (eg, paralysis) (102
      patients [77%] nadir within 12 hours) (Table 1); 31 patients (23%) had a
      more prolonged time to nadir; however, all but 1 patient had a component
      of rapid decline with severe deficits within 12 hours.
    explanation: Defines the characteristic rapid time-to-nadir within 12 hours in spontaneous spinal cord infarction including suspected FCE.
  - reference: PMID:14970983
    reference_title: "Fibrocartilaginous embolism--an uncommon cause of spinal cord infarction: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a previously healthy 16-year-old boy with sudden onset of back
      pain and progressive paraparesis within 36 hours after lifting exercises
      in a squat position.
    explanation: Illustrates post-exertional back pain progressing to severe paraparesis within 36 hours.
- phase: Subacute stabilization and chronic functional recovery
  notes: >-
    Neurologic disability at nadir is typically severe (median modified Rankin
    Scale 4), with partial motor and functional recovery over months of
    intensive rehabilitation and chronic focal cystic myelomalacia on follow-up
    spinal MRI.
  evidence:
  - reference: PMID:20825469
    reference_title: "Clinically suspected fibrocartilaginous embolism: clinical characteristics, treatments, and outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients were severely affected (median modified Rankin Scale 4,
      median Barthel index 45; mean time to evaluation 57 days).
    explanation: Documents severe functional impairment among patients with clinically suspected FCE.
  - reference: PMID:37873837
    reference_title: "Acute Presentation and Long-Term Rehabilitation Follow-Up of Ischemic Myelopathy Due to Clinically Suspected Fibrocartilaginous Embolism in an Adolescent Male: A Case Report and Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He subsequently received inpatient rehabilitation treatment for four
      months, after which he was followed as an outpatient for a total period of
      16 months. While significant neurological and functional gains were
      achieved during this period, he also experienced some worsening.
    explanation: Tracks prolonged inpatient and outpatient rehabilitation course following FCE ischemic myelopathy.
pathophysiology:
- name: Pressure-related intervertebral disc injury
  description: >-
    Axial loading of the vertebral column, heavy lifting, or minor trauma
    combined with a Valsalva maneuver acutely elevates intradiscal pressure and
    drives vertical herniation or extrusion of gelatinous nucleus pulposus
    material through endplate defects or into peridiscal vascular channels.
  role: trigger
  biological_scale: TISSUE
  node_class: INJURY
  cell_types:
  - preferred_term: Nucleus pulposus cell
    term:
      id: CL:0002564
      label: nucleus pulposus cell of intervertebral disc
  locations:
  - preferred_term: intervertebral disk
    term:
      id: UBERON:0001066
      label: intervertebral disk
  - preferred_term: vertebra
    term:
      id: UBERON:0002412
      label: vertebra
  downstream:
  - target: Nucleus pulposus fibrocartilage embolization
    description: Elevated intradiscal pressure forces nucleus pulposus fibrocartilage into perivertebral venous or arterial channels.
  - target: Back pain
    description: Acute intervertebral disc disruption and raised intradiscal pressure elicit sudden axial back or neck pain at onset.
  evidence:
  - reference: PMID:14970983
    reference_title: "Fibrocartilaginous embolism--an uncommon cause of spinal cord infarction: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      An increased intradiskal pressure resulting from axial loading of the
      vertebral column with a concomitant Valsalva maneuver is thought to be the
      initiating event for the embolus.
    explanation: Identifies axial loading with Valsalva-induced intradiscal pressure elevation as the initiating mechanical injury.
  - reference: PMID:30264146
    reference_title: "Characteristics of Spontaneous Spinal Cord Infarction and Proposed Diagnostic Criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of patients with a suspected fibrocartilaginous embolism, 10 of 19 (53%)
      showed nearby/adjacent intervertebral disc extrusions.
    explanation: Demonstrates adjacent intervertebral disc extrusion in over half of clinically suspected FCE patients on spine MRI.
- name: Nucleus pulposus fibrocartilage embolization
  description: >-
    Displaced nucleus pulposus fibrocartilaginous fragments enter vertebral
    body sinusoids, Batson venous plexus, or persistent discal/radicular
    vessels and travel retrogradely under elevated intrathoracic/intra-abdominal
    pressure into radicular, anterior spinal, or central sulcal arteries,
    mechanically occluding the lumen.
  biological_scale: TISSUE
  node_class: MECHANICAL_OBSTRUCTION_AND_STENOSIS
  locations:
  - preferred_term: intervertebral disk
    term:
      id: UBERON:0001066
      label: intervertebral disk
  - preferred_term: anterior spinal artery
    term:
      id: UBERON:0005431
      label: anterior spinal artery
  downstream:
  - target: Spinal cord infarction
    description: Intraluminal fibrocartilaginous emboli occlude spinal arterial perfusion and cause downstream parenchymal infarction.
  evidence:
  - reference: PMID:14970983
    reference_title: "Fibrocartilaginous embolism--an uncommon cause of spinal cord infarction: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is postulated that an acute vertical disk herniation of the nucleus
      pulposus material can lead to spinal cord infarction by a retrograde
      embolization to the central artery.
    explanation: States the retrograde vascular embolization mechanism from vertical nucleus pulposus herniation to central spinal arteries.
  - reference: DOI:10.1177/0883073809355822
    reference_title: "Spinal Cord Infarction Due to Fibrocartilaginous Embolization: The Role of Diffusion Weighted Imaging and Short-Tau Inversion Recovery Sequences"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Fibrocartilaginous embolization is a rare cause of ischemic myelopathy
      caused by embolization of intersomatic disk nucleus pulposus into spinal
      vasculature during Valsalva-like maneuvers.
    explanation: Independently confirms embolization of nucleus pulposus material into spinal vessels during Valsalva-like maneuvers.
- name: Spinal cord infarction
  description: >-
    Arterial occlusion by non-thrombotic fibrocartilaginous material produces
    cytotoxic edema, hypoxia, and ischemic necrosis predominantly in the
    anterior spinal artery territory (anterior horns, corticospinal tracts,
    anterolateral spinothalamic tracts, and lateral autonomic horns), evolving
    into T2-hyperintense cord lesions and chronic cystic myelomalacia.
  biological_scale: TISSUE
  node_class: ISCHEMIA_AND_INFARCTION

    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Fibrocartilaginous Embolism (FCE) has been reported to represent 5.5% of
      spinal cord infarctions.
    explanation: Establishes FCE as a recognized etiology of spinal cord infarction.
  - reference: PMID:37456462
    reference_title: Incomplete Anterior Spinal Artery Syndrome Responsive to Intrathecal Baclofen.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The typical presentation of an ASA stroke is paraparesis or paraplegia,
      bilateral loss of pain and temperature sensation, and fecal or urinary
      incontinence; the underlying neural structures responsible for these
      symptoms include the corticospinal tracts and anterior horns,
      anterolateral spinothalamic tracts, and lateral horns, respectively.
    explanation: Maps anterior spinal artery ischemia onto injury of corticospinal tracts, anterior horns, spinothalamic tracts, and lateral autonomic horns.
- name: Acute ischemic myelopathy
  description: >-
    Ischemic injury to spinal motor, spinothalamic, and autonomic pathways
    produces hyperacute or rapidly progressive motor paralysis (paraplegia,
    paraparesis, or tetraplegia depending on cervical versus thoracolumbar
    level), dissociated pain/temperature sensory loss, acute spinal shock with
    areflexia, and neurogenic sphincter incontinence.
  role: consequence
  biological_scale: ORGANISM
  node_class: NEURAL_CIRCUIT_AND_NETWORK_DYSFUNCTION
  locations:
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  downstream:
  - target: Acute myelopathy
    description: Abrupt loss of spinal cord tract conduction manifests clinically as acute non-inflammatory myelopathy.
  - target: Lower-limb paralysis
    description: Bilateral corticospinal and anterior horn infarction at thoracic or lumbar levels causes paraplegia.
  - target: Paraparesis
    description: Incomplete thoracolumbar corticospinal/anterior horn ischemia causes lower-limb weakness (paraparesis).
  - target: Tetraplegia
    description: Cervical spinal cord infarction produces four-limb paralysis (quadriplegia/tetraplegia).
  - target: Somatic sensory dysfunction
    description: Spinothalamic and dorsal tract ischemia produces bilateral sensory loss with a spinal sensory level.
  - target: Impaired pain sensation
    description: Anterolateral spinothalamic tract infarction selectively impairs pain and temperature sensation below the lesion.
  - target: Areflexia
    description: Acute anterior horn and spinal shock produce absent tendon reflexes and flaccid tone at presentation.
  - target: Urinary incontinence
    description: Lateral horn and descending autonomic tract injury causes neurogenic bladder and urinary incontinence.
  - target: Bowel incontinence
    description: Disruption of spinal autonomic pathways causes loss of anal sphincter control and fecal incontinence.
  evidence:
  - reference: PMID:37873837
    reference_title: "Acute Presentation and Long-Term Rehabilitation Follow-Up of Ischemic Myelopathy Due to Clinically Suspected Fibrocartilaginous Embolism in an Adolescent Male: A Case Report and Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present the case of an otherwise healthy 17-year-old student who
      experienced sudden onset of severe low-back pain amidst intensive physical
      training, which rapidly deteriorated to complete sensory-motor paralysis
      of his lower limbs.
    explanation: Documents acute transition from exertional back pain to complete lower-limb sensorimotor myelopathy.
  - reference: PMID:30264146
    reference_title: "Characteristics of Spontaneous Spinal Cord Infarction and Proposed Diagnostic Criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rapid onset of severe deficits reaching nadir within 12 hours was typical
      (102 [77%]); some had a stuttering decline (31 [23%]). Sensory loss
      occurred in 126 patients (95%), selectively affecting pain/temperature in
      49 (39%).
    explanation: Quantifies rapid motor nadir and selective spinothalamic sensory loss in spontaneous spinal cord infarction.

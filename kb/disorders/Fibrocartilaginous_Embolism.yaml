    explanation: Supports structured inpatient and outpatient rehabilitation as the mainstay of post-infarction management.
- name: Empiric Intravenous Methylprednisolone During Acute Myelopathy Work-up
  description: >-
    High-dose intravenous methylprednisolone is frequently administered
    empirically during initial evaluation while inflammatory transverse myelitis

    description: Cytotoxic edema and parenchymal necrosis produce characteristic T2-hyperintense and DWI-restricted intrinsic spinal cord lesions.
  - target: Acute ischemic myelopathy
    description: Infarction of anterior horn motor neurons and long white-matter tracts causes abrupt sensorimotor and autonomic myelopathy.
  evidence:
  - reference: PMID:26833287
    reference_title: "Fibrocartilaginous embolism: a comprehensive review of an under-studied cause of spinal cord infarction and proposed diagnostic criteria."
    supports: SUPPORT

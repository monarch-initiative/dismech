name: Fibrocartilaginous Embolism
creation_date: "2026-05-05T11:41:54Z"
updated_date: "2026-11-12T00:00:00Z"
description: >-
  Fibrocartilaginous embolism (FCE) is a rare non-atherosclerotic vascular
  cause of acute spinal cord infarction in which nucleus pulposus
  fibrocartilage from an intervertebral disc enters the spinal vasculature and
  occludes radicular, anterior spinal, or central sulcal arteries, accounting
  for roughly 5.5% of acute spinal cord infarctions. Often precipitated by
  axial vertebral loading, lifting, minor trauma, or a concomitant Valsalva
  maneuver, FCE produces hyperacute back or neck pain followed within hours by
  rapidly progressive motor paralysis (paraplegia or tetraplegia), spinothalamic
  pain and temperature sensory loss, and autonomic bladder and bowel
  dysfunction, frequently mimicking acute transverse myelitis.
category: Complex

diagnosis:
- name: Spinal Magnetic Resonance Imaging with Diffusion-Weighted Sequences
  description: >-
    Spine MRI (sagittal/axial T2, STIR, and diffusion-weighted/ADC imaging)
    identifies intrinsic T2-hyperintense cord infarction ("owl-eyes" or
    pencil-like patterns), cytotoxic diffusion restriction, and adjacent
    intervertebral disc extrusions or Schmorl nodes while ruling out cord
    compression; note that hyperacute MRI within the first 24 hours can be
    initially normal in ~24% of cases.
  diagnosis_term:
    preferred_term: Spinal MRI
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    T2-hyperintense spinal cord lesion with DWI/ADC restriction and nearby
    intervertebral disc extrusion without extrinsic cord compression supports
    suspected FCE.
  evidence:
  - reference: DOI:10.1177/0883073809355822
    reference_title: "Spinal Cord Infarction Due to Fibrocartilaginous Embolization: The Role of Diffusion Weighted Imaging and Short-Tau Inversion Recovery Sequences"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic criteria are based on patient’s clinical history, magnetic
      resonance evidence of T2-hyperintense spinal cord lesion, and exclusion of
      other causes of ischemic myelopathy.
    explanation: Establishes spinal MRI T2 lesion characterization as central to antemortem FCE diagnosis.
  - reference: DOI:10.1177/0883073809355822
    reference_title: "Spinal Cord Infarction Due to Fibrocartilaginous Embolization: The Role of Diffusion Weighted Imaging and Short-Tau Inversion Recovery Sequences"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present 2 pediatric cases of progressive paraplegia attributed to
      fibrocartilaginous embolization in which short-tau inversion recovery and
      diffusion-weighted imaging sequences played a pivotal role showing the
      ischemic nature of spinal cord lesions.
    explanation: Demonstrates the confirmatory role of DWI and STIR sequences in proving ischemic myelopathy in FCE.
- name: Lumbar Puncture and Non-Inflammatory CSF Exclusion Work-up
  description: >-
    Lumbar puncture and cerebrospinal fluid analysis (cell count, protein, IgG
    index, oligoclonal bands, infectious PCRs, and AQP4/MOG serology) typically
    demonstrate non-inflammatory CSF (92% without pleocytosis), distinguishing
    vascular FCE infarction from inflammatory, infectious, or autoimmune
    transverse myelitis.
  diagnosis_term:
    preferred_term: Lumbar puncture
    term:
      id: NCIT:C15327
      label: Lumbar Puncture
  results: >-
    Absence of CSF pleocytosis, oligoclonal bands, or infectious/autoimmune
    markers supports vascular spinal cord infarction over inflammatory myelitis.
  evidence:
  - reference: PMID:30264146
    reference_title: "Characteristics of Spontaneous Spinal Cord Infarction and Proposed Diagnostic Criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance imaging shows confirmatory (eg, vertebral body infarct)
      and supportive findings while excluding other etiologies; cerebrospinal
      fluid was usually noninflammatory (92%).
    explanation: Confirms non-inflammatory CSF in 92% of spontaneous spinal cord infarctions as a key discriminator against myelitis.
  - reference: PMID:14970983
    reference_title: "Fibrocartilaginous embolism--an uncommon cause of spinal cord infarction: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory investigation showed no evidence of infectious, autoimmune,
      inflammatory, or neoplastic causes.
    explanation: Supports laboratory exclusion of infectious, autoimmune, and inflammatory mimics in suspected FCE.
- name: Clinical Diagnostic Criteria Assessment
  description: >-
    Structured neurological examination and application of validated spontaneous
    spinal cord infarction / FCE clinical criteria integrate hyperacute nadir
    (<12 h), exertional trigger, spinothalamic deficit pattern, and exclusion of
    aortic or compressive causes when postmortem histology is unavailable.
  diagnosis_term:
    preferred_term: Neurologic examination
    term:
      id: NCIT:C81313
      label: Neurologic Examination
  evidence:
  - reference: PMID:26833287
    reference_title: "Fibrocartilaginous embolism: a comprehensive review of an under-studied cause of spinal cord infarction and proposed diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The 41 tissue proven cases are summarized and a schematic approach to the
      clinical diagnosis of FCE, deducted from their clinical findings, is
      presented.
    explanation: Supports structured clinical diagnostic criteria derived from histologically proven FCE cases.
treatments:
- name: Supportive Care and Multidisciplinary Neurorehabilitation
  description: >-
    No proven chondrolytic or recanalizing therapy exists for fibrocartilaginous
    emboli; management centers on hemodynamic support, neurogenic bladder/bowel
    and thromboembolism prophylaxis, and intensive inpatient and outpatient
    physical rehabilitation to maximize motor and functional recovery.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Multidisciplinary neurorehabilitation and supportive care
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Acute ischemic myelopathy
    treatment_effect: MODULATES
    description: Intensive neurorehabilitation promotes neuroplastic motor recovery and functional adaptation after ischemic cord injury.
    evidence:
    - reference: PMID:37873837
      reference_title: "Acute Presentation and Long-Term Rehabilitation Follow-Up of Ischemic Myelopathy Due to Clinically Suspected Fibrocartilaginous Embolism in an Adolescent Male: A Case Report and Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        He subsequently received inpatient rehabilitation treatment for four
        months, after which he was followed as an outpatient for a total period
        of 16 months. While significant neurological and functional gains were
        achieved during this period, he also experienced some worsening.
      explanation: Documents neurological and functional gains achieved through multidisciplinary rehabilitation after FCE myelopathy.
  evidence:
  - reference: PMID:37873837

    reference_title: "Expanding the Phenotypic Spectrum of GPI Anchoring Deficiency Due to Biallelic Variants in GPAA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients in this cohort are currently or were previously managed on the ketogenic diet."
    explanation: Documents use of the ketogenic diet in GPAA1 deficiency.
  - reference: PMID:34703884
    reference_title: "Expanding the Phenotypic Spectrum of GPI Anchoring Deficiency Due to Biallelic Variants in GPAA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

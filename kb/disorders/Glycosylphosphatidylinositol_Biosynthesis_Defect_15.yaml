    reference_title: "A Novel Homozygous GPAA1 Variant in a Patient with a Glycosylphosphatidylinositol Biosynthesis Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When he was 15 months, the cerebellum was normal. When he was 33 months old, after the molecular diagnosis, magnetic resonance imaging was repeated, showing cerebellar atrophy."
    explanation: Serial imaging documenting acquired cerebellar atrophy.
  - reference: PMID:34703884
    reference_title: "Expanding the Phenotypic Spectrum of GPI Anchoring Deficiency Due to Biallelic Variants in GPAA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acquired, rather than congenital, cerebellar abnormalities may prove to be a common feature of the disorder, not yet fully appreciated as most children have MRI scans after onset of clinical manifestations caused by the presence of cerebellar atrophy."
    explanation: Authors' interpretation that the cerebellar lesion is acquired.
  - reference: PMID:34703884
    reference_title: "Expanding the Phenotypic Spectrum of GPI Anchoring Deficiency Due to Biallelic Variants in GPAA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The second patient did not have neuroimaging until age 21 years; this demonstrated cerebellar atrophy, which has been stable on repeat imaging at ages 25 and 29 years."
    explanation: Shows the atrophy need not progress in adulthood.
  - reference: PMID:37510348
    reference_title: "A Novel Homozygous GPAA1 Variant in a Patient with a Glycosylphosphatidylinositol Biosynthesis Defect."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Reduced activity of the complex does not grossly affect the structure of the brain, but it impairs cerebellum micro-organization and Purkinje cell dendritic arborization"
    explanation: >-
      Background citation of mouse work on reduced GPI biosynthesis in the
      developing cerebellum. It is not about GPAA1, so the link to this
      disorder is indirect.
  - reference: PMID:32179897
    reference_title: "CNS glycosylphosphatidylinositol deficiency results in delayed white matter development, ataxia and premature death in a novel mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "The mutants show progressive decline with severe ataxia consistent with defects in cerebellar development. We show that the mutants have reduced myelination and defective Purkinje cell development."
    explanation: >-
      CNS-specific Piga knockout mice develop ataxia with Purkinje-cell and
      myelination defects. Piga acts at a different step of the same pathway,
      so this supports GPI deficiency in general, not GPAA1 specifically, as a
      cause of the cerebellar lesion.
- name: Impaired Osteoblast Bone Formation
  biological_scale: CELLULAR
  description: >-
    Hypothesized mechanism for osteopenia: reduced surface alkaline
    phosphatase on osteoblasts lowers bone formation. This is the authors'
    hypothesis, not a measured result, and epilepsy, antiseizure drugs and
    reduced mobility independently lower bone density in these patients.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  downstream:
  - target: Osteopenia
    hypothesis_groups:
    - osteoblast_alkaline_phosphatase_hypothesis
  evidence:
  - reference: PMID:34703884
    reference_title: "Expanding the Phenotypic Spectrum of GPI Anchoring Deficiency Due to Biallelic Variants in GPAA1."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Osteopenia and osteoporosis are hypothesized to be secondary to decreased alkaline phosphatase (ALP) expression on the surface of osteoblasts, impairing their function and leading to decreased bone formation and therefore bone mineral density."
    explanation: States the mechanism as a hypothesis; recorded as indirect support only.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_gpi_transamidase_deficiency_model
  hypothesis_label: Canonical GPI Transamidase Deficiency Model
  status: CANONICAL
  description: >-
    Biallelic hypomorphic GPAA1 variants lower GPI transamidase activity, so
    fewer proteins receive a GPI anchor and the surface density of the
    GPI-anchored protein class falls. Because that class is important in
    neural and cerebellar development, the result is developmental delay,
    epilepsy and cerebellar atrophy. Supported by reduced GPI-anchored
    proteins on patient leukocytes and fibroblasts and by partial rescue with
    wild-type GPAA1.
- hypothesis_group_id: osteoblast_alkaline_phosphatase_hypothesis
  hypothesis_label: Osteoblast Alkaline Phosphatase Hypothesis for Osteopenia
  status: EMERGING
  description: >-
    Reduced GPI-anchored alkaline phosphatase on the osteoblast surface lowers
    bone formation and so bone mineral density. Proposed by analogy across GPI
    deficiencies; not measured in GPAA1 patients, and confounded by epilepsy,
    antiseizure drugs and immobility.
discussions:
- discussion_id: gpaa1_no_mammalian_model
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does partial loss of GPAA1 produce acquired cerebellar atrophy, given
    that no mammalian GPAA1 model has been described?
  attaches_to:
  - pathophysiology#Acquired Cerebellar Degeneration
  rationale: >-
    The cerebellar mechanism currently rests on patient imaging and on
    background work with reduced transamidase activity in general. The only
    GPAA1-deficient animal reported is a zebrafish made to study vascular
    anomalies, whose neurological phenotype was not described. A hypomorphic
    mammalian model would test whether the atrophy is Purkinje-cell loss and
    when it begins.
- discussion_id: gpaa1_which_gpi_anchored_protein
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which GPI-anchored proteins, or which combination, mediate the epilepsy
    and developmental impairment in GPAA1 deficiency?
  attaches_to:
  - pathophysiology#Reduced Cell-Surface GPI-Anchored Proteins
  - pathophysiology#Impaired Neural GPI-Anchored Protein Function
  rationale: >-
    The chain from reduced GPI anchoring to epilepsy is a class-level argument.
    No study has identified the responsible proteins, so the edge into the
    neural node has unknown intermediates and no protein-specific treatment
    target can be named.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transduction of fibroblasts with a lentivirus encoding the wild-type protein partially rescued the deficiency of GPI-anchored proteins."
    explanation: Rescue experiment tying the surface deficit to GPAA1 loss.
  - reference: PMID:34703884

  description: >-
    Symptomatic seizure control is the main treatment and is often
    unsuccessful. No anticonvulsant has been shown to work better than
    another in GPAA1 deficiency.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticonvulsant therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  target_mechanisms:

pathophysiology:
- name: Biallelic Hypomorphic GPAA1 Variants
  biological_scale: MOLECULAR
  description: >-
    Biallelic GPAA1 variants. The founding cohort carried two frameshift
    alleles, one intronic splice-region allele that lowered GPAA1 mRNA, and
    six missense alleles; the pooled 2026 review counts 28 variants, mostly
    missense, with frameshift, splicing and one nonsense allele. No patient
    has two null alleles, so the disease state is read as partial rather than
    complete loss of GPAA1 function.
  genes:
  - preferred_term: GPAA1
    term:
      id: hgnc:4446
      label: GPAA1
    modifier: DECREASED
  genetic_context:
    description: >-
      Germline biallelic GPAA1 alleles; both compound heterozygous and
      homozygous patients are reported, so zygosity is left unset. At least
      one allele in every reported patient is a missense or splice allele.
    allelic_events:
    - MISSENSE_VARIANT

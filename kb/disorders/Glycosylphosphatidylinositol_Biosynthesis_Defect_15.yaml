    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Acquired Cerebellar Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Osteoblast Bone Formation

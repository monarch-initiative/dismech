    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, flow cytometry assays support the pathogenicity of the variants by demonstrating reduction in CD16 in granulocytes."
    explanation: Independent cohort confirming reduced granulocyte CD16.
- name: Impaired Neural GPI-Anchored Protein Function
  biological_scale: CELLULAR
  description: >-
    GPI-anchored proteins in the nervous system take part in axon growth,
    regeneration, synapse formation and synaptic plasticity. Their reduction
    is the proposed route to the developmental delay, hypotonia and epilepsy,
    but no study has attributed these features to a particular GPI-anchored
    protein in GPAA1 deficiency.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron

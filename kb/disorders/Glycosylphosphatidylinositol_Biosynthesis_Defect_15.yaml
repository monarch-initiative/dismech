- name: Acquired Cerebellar Degeneration
  biological_scale: TISSUE
  description: >-
    Cerebellar atrophy, often with vermian involvement, that appears to
    develop after birth: a patient with a normal cerebellum at 15 months had
    atrophy at 33 months, and another had atrophy on follow-up imaging at age
    2 years that was not reported initially. Its absence on an early scan
    therefore does not exclude the diagnosis. In the oldest patient the
    atrophy was stable between ages 21 and 29.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  downstream:
  - target: Cerebellar atrophy
  - target: Ataxia
  - target: Nystagmus
  - target: Dysarthria
  - target: Dysmetria

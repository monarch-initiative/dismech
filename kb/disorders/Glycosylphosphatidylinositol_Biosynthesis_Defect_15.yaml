    explanation: Reports a partial response in a patient on the ketogenic diet.
- name: Bone Health Monitoring
  description: >-
    Bone density should be monitored because osteopenia is reported and
    epilepsy, antiseizure medication and immobility add fracture risk.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34703884
    reference_title: "Expanding the Phenotypic Spectrum of GPI Anchoring Deficiency Due to Biallelic Variants in GPAA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the independent association of osteopenia and osteoporosis with epilepsy, antiepileptic use, and decreased mobility, one may anticipate patients with GPAA1 deficiency are at risk of fractures, and bone health should be promoted and monitored."
    explanation: Recommends bone-health monitoring in GPAA1 deficiency.

- name: Impaired GPI Anchor Attachment to Precursor Proteins
  biological_scale: MOLECULAR
  description: >-
    The GPI transamidase complex in the endoplasmic reticulum cleaves the
    C-terminal GPI attachment signal of precursor proteins and transfers the
    GPI anchor to the new C terminus. PIGK carries the catalytic residues;
    structural work indicates GPAA1 is not itself catalytic but is required
    for the complex to work.
  biological_processes:
  - preferred_term: attachment of GPI anchor to protein
    term:
      id: GO:0016255
      label: attachment of GPI anchor to protein
    modifier: DECREASED
  downstream:
  - target: Reduced Cell-Surface GPI-Anchored Proteins
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29100095
    reference_title: "Mutations in GPAA1, Encoding a GPI Transamidase Complex Protein, Cause Developmental Delay, Epilepsy, Cerebellar Atrophy, and Osteopenia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "This complex orchestrates the attachment of the GPI anchor to the C terminus of precursor proteins in the endoplasmic reticulum."
    explanation: Defines the step GPAA1 participates in.
  - reference: PMID:38963495
    reference_title: "Structure and Function of the Glycosylphosphatidylinositol Transamidase, a Transmembrane Complex Catalyzing GPI Anchoring of Proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "While the structural data confirm the catalytic role of PIGK, which likely uses a caspase-like mechanism to cleave the proproteins, they suggest that unlike previously proposed, GPAA1 is not a catalytic subunit."
    explanation: Clarifies GPAA1's role in the complex; supports describing it as essential but non-catalytic.
  - reference: PMID:38963495
    reference_title: "Structure and Function of the Glycosylphosphatidylinositol Transamidase, a Transmembrane Complex Catalyzing GPI Anchoring of Proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Consistent with the assembly mechanisms and the active site architecture, most of the disease mutations occur near the active site or the subunit interfaces."
    explanation: Places disease variants where they would be expected to impair assembly or catalysis of the complex.
- name: Reduced Cell-Surface GPI-Anchored Proteins
  biological_scale: CELLULAR
  description: >-
    Precursor proteins that are not anchored do not reach the cell surface as
    GPI-anchored proteins, so the surface density of the whole class falls.
    Patient leukocytes showed reduced FLAER (total GPI-anchored proteins), CD16
    and CD59; patient fibroblasts showed reduced CD73 and CD109. Lentiviral
    re-expression of wild-type GPAA1 partly rescued the fibroblast deficit.
    With over 150 GPI-anchored proteins, no single one has been shown to
    account for any clinical feature.
  cell_types:
  - preferred_term: granulocyte
    term:
      id: CL:0000094
      label: granulocyte
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:

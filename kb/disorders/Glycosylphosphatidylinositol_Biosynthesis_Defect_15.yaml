name: Glycosylphosphatidylinositol Biosynthesis Defect 15
creation_date: "2026-10-14T16:00:00Z"
category: Mendelian
synonyms:
- GPIBD15
- GPAA1 deficiency
- GPAA1-related GPI deficiency
disease_term:
  preferred_term: glycosylphosphatidylinositol biosynthesis defect 15
  term:
    id: MONDO:0060627
    label: glycosylphosphatidylinositol biosynthesis defect 15
parents:
- Disorder of GPI Anchor Biosynthesis
- Congenital Disorder of Glycosylation
- Inborn Error of Metabolism
- Epilepsy
description: >-
  Glycosylphosphatidylinositol biosynthesis defect 15 (GPIBD15) is an
  autosomal recessive inherited GPI deficiency caused by biallelic variants in
  GPAA1. GPAA1 is one of five subunits of the GPI transamidase complex (with
  PIGK, PIGS, PIGT and PIGU), which in the endoplasmic reticulum cleaves the
  C-terminal attachment signal of precursor proteins and joins the completed
  GPI anchor to the new C terminus. When the complex fails, precursor proteins
  are not anchored and the surface density of the whole GPI-anchored protein
  class falls: reduced FLAER, CD16 and CD59 on leukocytes and reduced CD73 and
  CD109 on fibroblasts were shown in the founding report, and re-expressing
  wild-type GPAA1 partly restored them. No patient carries two null alleles,
  which suggests some residual GPAA1 function is needed for survival. The
  clinical picture is global developmental delay and hypotonia in essentially
  every patient, early-onset and often drug-resistant epilepsy (most often
  generalized tonic-clonic and myoclonic seizures, frequently fever-sensitive),
  cerebellar atrophy that appears to be acquired rather than congenital,
  cerebellar signs such as ataxia, nystagmus, dysarthria and dysmetria, and
  osteopenia. Unlike the late-pathway GPI defects, serum alkaline phosphatase
  is normal or low, not raised. About two dozen patients have been published,
  the oldest followed into adulthood.
notes: >-
  Case counts, not cohort frequencies. The founding report (Nguyen et al. 2017)
  described ten individuals from five families; Castle et al. 2021 added seven;
  a 2026 Seizure review pooled five new and nineteen published patients. The
  frequencies for developmental delay, hypotonia and epilepsy are over all 24;
  the seizure-type, fever-sensitivity and cerebellar-atrophy percentages are
  over the subset with data, whose size the abstract does not state. All
  carry the uncertainty of a series this small.

  Two reports are deliberately kept out of the phenotype list. A single Chinese
  patient with GPIBD15 also had periodic fever with raised inflammatory markers
  that responded to glucocorticoids (PMID:38112147); one case does not
  establish the fever as part of the disease. Separately, a heterozygous GPAA1
  missense variant (c.968A>G) segregated with familial vascular anomalies in
  one large pedigree (PMID:32533362). That is a dominant, vascular claim about
  a single family, not the recessive neurodevelopmental disorder curated here,
  and it is not merged into this entry.

  No GeneReviews chapter covers GPAA1 or the inherited GPI deficiencies as a
  group.
classifications:
  icimd_category:
  - classification_value: lipid_glycosylation
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416) group "Disorders of lipid
      glycosylation", which the classification scopes to include
      glycosylphosphatidylinositol biosynthesis. GPAA1 acts at the transamidase
      step that attaches the completed anchor to protein.

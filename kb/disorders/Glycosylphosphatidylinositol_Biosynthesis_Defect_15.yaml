    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "flow-cytometry analysis of five available individual samples showed that several GPI-anchored proteins had decreased cell-surface abundance in leukocytes (FLAER, CD16, and CD59) or fibroblasts (CD73 and CD109)"
    explanation: Direct measurement of reduced surface GPI-anchored proteins in patient cells.
  - reference: PMID:29100095

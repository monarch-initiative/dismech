biochemical:
- name: Serum alkaline phosphatase
  presence: Normal or decreased
  notes: >-
    Normal in five and low in one of six tested patients. No patient with a
    GPI transamidase defect has had raised alkaline phosphatase, which
    separates this group from the hyperphosphatasia GPI disorders.
  evidence:
  - reference: PMID:34703884
    reference_title: "Expanding the Phenotypic Spectrum of GPI Anchoring Deficiency Due to Biallelic Variants in GPAA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alkaline phosphatase was within the normal range in 5 individuals and low in 1 individual, as has been noted in other transamidase defects."
    explanation: Alkaline phosphatase results in the cohort.
  - reference: PMID:34703884
    reference_title: "Expanding the Phenotypic Spectrum of GPI Anchoring Deficiency Due to Biallelic Variants in GPAA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients described in the literature with pathogenic variants in GPI-transamidase complex genes have elevated ALP."
    explanation: Generalizes the absence of hyperphosphatasia to transamidase defects.
genetic:
- name: GPAA1
  gene_term:
    preferred_term: GPAA1
    term:
      id: hgnc:4446
      label: GPAA1
  relationship_type: CAUSATIVE
  notes: >-
    GPAA1 encodes a non-catalytic subunit of the GPI transamidase complex
    (PIGK, PIGS, PIGT, PIGU, GPAA1). Defects in the other subunits cause
    related inherited GPI deficiencies with overlapping neurological
    phenotypes.
  evidence:
  - reference: PMID:29100095
    reference_title: "Mutations in GPAA1, Encoding a GPI Transamidase Complex Protein, Cause Developmental Delay, Epilepsy, Cerebellar Atrophy, and Osteopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report bi-allelic mutations in GPAA1 in ten individuals from five families."
    explanation: Founding gene-disease report.
  - reference: PMID:34703884
    reference_title: "Expanding the Phenotypic Spectrum of GPI Anchoring Deficiency Due to Biallelic Variants in GPAA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten novel variants were identified in 7 patients."
    explanation: Independent replication in a second cohort.
diagnosis:
- name: Flow cytometry for GPI-anchored protein surface expression
  description: >-
    CD16 on granulocytes is the most consistently reduced marker. FLAER and
    CD59 on leukocytes, and CD73 and CD109 on fibroblasts, were reduced in the
    founding cohort, but in a later series CD55, CD59 and FLAER were only
    slightly reduced or unchanged. There is no GPAA1-specific profile; the
    assay supports the pathogenicity of variants found by sequencing.
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:34703884
    reference_title: "Expanding the Phenotypic Spectrum of GPI Anchoring Deficiency Due to Biallelic Variants in GPAA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GPAA1 deficiency does not demonstrate a characteristic pattern; however, measuring GPI-APs through flow cytometry remains a mechanism by which functional consequences of GPAA1 variants can be investigated."
    explanation: States both the use and the limit of the assay.
  - reference: PMID:34703884
    reference_title: "Expanding the Phenotypic Spectrum of GPI Anchoring Deficiency Due to Biallelic Variants in GPAA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CD55, CD59, and total GPI-AP levels in these individuals showed slightly decreased or no change in the levels compared with healthy controls."
    explanation: Shows that markers other than CD16 may be normal.
- name: Exome sequencing
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    The founding patients were diagnosed by exome sequencing; the phenotype is
    not specific enough among inherited GPI deficiencies to suggest GPAA1
    without it.
  evidence:
  - reference: PMID:29100095
    reference_title: "Mutations in GPAA1, Encoding a GPI Transamidase Complex Protein, Cause Developmental Delay, Epilepsy, Cerebellar Atrophy, and Osteopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing, we identified two frameshift mutations"
    explanation: Diagnostic method used in the founding cohort.

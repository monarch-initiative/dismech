name: Sengers syndrome
creation_date: '2026-01-27T00:22:49Z'
description: >-
  Sengers syndrome is an autosomal recessive mitochondrial disorder caused by
  pathogenic variants in AGK, which encodes acylglycerol kinase, a mitochondrial
  enzyme involved in lipid signaling and a component of the TIM22 carrier-protein
  import complex. Loss of AGK function disrupts TIM22-mediated import of
  inner-membrane carrier proteins and mitochondrial phospholipid metabolism,
  producing oxidative phosphorylation deficiency. The disorder is defined by the
  clinical tetrad of congenital cataracts, hypertrophic cardiomyopathy,
  mitochondrial myopathy with exercise intolerance, and lactic acidosis, with
  severe neonatal forms frequently progressing to congestive heart failure.
category: Mendelian
parents: []
disease_term:
  preferred_term: Sengers syndrome
  term:
    id: MONDO:0008922
    label: Sengers syndrome
synonyms:
- Cardiomyopathy, familial hypertrophic, with congenital cataract and mitochondrial myopathy
- Cataract-cardiomyopathy syndrome
- Cardiomyopathy-cataract-mitochondrial myopathy syndrome
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  - classification_value: CARDIOVASCULAR
  - classification_value: NEUROLOGIC
  mechanistic_category:
  - classification_value: mitochondrial disease
  icimd_category:
  - classification_value: mitochondrial_membrane_biogenesis_and_remodeling
    notes: >-
      AGK phosphorylates monoacylglycerol and diacylglycerol to generate
      lysophosphatidic acid and phosphatidic acid for mitochondrial phospholipid
      and cardiolipin biosynthesis, placing Sengers syndrome among disorders of
      mitochondrial membrane biogenesis and remodeling.
    evidence:
    - reference: DOI:10.1007/s10545-014-9759-7
      reference_title: "Inborn errors of metabolism in the biosynthesis and remodelling of phospholipids"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Here we provide an overview on both pathophysiology and the extremely heterogeneous clinical presentations of the disorders reported so far (Sengers syndrome (due to mutations in AGK), MEGDEL syndrome (or SERAC defect, SERAC1), Barth syndrome (or TAZ defect, TAZ)"
      explanation: This review groups Sengers syndrome with Barth and MEGDEL syndromes as inborn errors of mitochondrial phospholipid biosynthesis and remodeling.
  - classification_value: mitochondrial_protein_import
    notes: >-
      AGK is a structural subunit of the mitochondrial inner-membrane TIM22
      carrier translocase complex, placing Sengers syndrome among disorders of
      mitochondrial protein import.
    evidence:
    - reference: DOI:10.3390/ijms222413484
      reference_title: "Characterization of a Novel Splicing Variant in Acylglycerol Kinase (AGK) Associated with Fatal Sengers Syndrome"
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: "AGK, a mitochondrial acylglycerol kinase, is not only involved in lipid signaling but is also a component of the TIM22 complex in the inner mitochondrial membrane, which mediates the import of a subset of membrane proteins."
      explanation: Establishes that AGK is a component of the inner mitochondrial membrane TIM22 protein import complex.

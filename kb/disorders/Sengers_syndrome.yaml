      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Targeted mitochondrial gene panel or clinical exome sequencing to identify
    biallelic pathogenic variants in AGK, providing definitive molecular
    confirmation of Sengers syndrome.
  presence: Positive
  results: >-
    Identification of homozygous or compound heterozygous loss-of-function,
    splice-site, or missense variants in AGK.
  evidence:
  - reference: PMID:34164355
    reference_title: "Case Report: Two Chinese Infants of Sengers Syndrome Caused by Mutations in AGK Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing of a boy revealed a homozygous pathogenic variant for Sengers syndrome in AGK (c.1131+2T>C) which was classified as likely pathogenic according to the ACMG guideline; besides, his skeletal muscle biopsy and transmission electron microscope presented obvious abnormity."
    explanation: Demonstrates confirmatory molecular genetic diagnosis of Sengers syndrome by identifying a homozygous pathogenic AGK variant alongside skeletal muscle biopsy findings.
  - reference: PMID:38933059
    reference_title: "A neonate with a spongy failing heart - What could it be?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the presence of cardiac left ventricular non compaction, horse-shoe kidney and family history of neonatal death and pregnancy loss clinical exome sequencing was done. It detected a homozygous missense variant in exon 6 of the AGK gene suggestive of Senger's syndrome."
    explanation: Shows clinical exome sequencing establishing the diagnosis of Sengers syndrome in a neonate presenting with left ventricular noncompaction.
  - reference: DOI:10.3390/ijms222413484
    reference_title: "Characterization of a Novel Splicing Variant in Acylglycerol Kinase (AGK) Associated with Fatal Sengers Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using the patient’s DNA, we performed targeted sequencing of 314 nuclear genes encoding respiratory chain complex subunits and proteins implicated in mitochondrial oxidative phosphorylation (OXPHOS)."
    explanation: Demonstrates targeted nuclear mitochondrial gene panel sequencing used to identify pathogenic AGK variants in Sengers syndrome.
- name: Echocardiography
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    Transthoracic echocardiography assesses ventricular wall thickness, chamber
    dimensions, left ventricular ejection fraction, and myocardial trabeculation
    to detect hypertrophic cardiomyopathy, dilated cardiomyopathy, or left
    ventricular noncompaction and monitor progression to heart failure.
  presence: Positive
  results: >-
    Concentric septal and posterior left ventricular wall hypertrophy, reduced
    ejection fraction in decompensated heart failure, or prominent ventricular
    trabeculations and deep intertrabecular recesses.
  evidence:
  - reference: PMID:34164355
    reference_title: "Case Report: Two Chinese Infants of Sengers Syndrome Caused by Mutations in AGK Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Echocardiography showed hypertrophic cardiomyopathy with a maximum septal thickness of 8 mm, a posterior wall thickness of 8 mm, no outflow tract obstruction, enlargement of left ventricle, and ejection fraction of 39% (Figure 1b)."
    explanation: Documents echocardiographic findings of septal and posterior wall hypertrophy, left ventricular enlargement, and reduced ejection fraction in infantile Sengers syndrome.
  - reference: PMID:38933059
    reference_title: "A neonate with a spongy failing heart - What could it be?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2D Echocardiogram revealed severe Left ventricular dysfunction with prominent trabeculations and deep recesses in the left ventricle suggestive of Left ventricular non-compaction."
    explanation: Documents 2D echocardiographic detection of left ventricular noncompaction and severe systolic dysfunction in neonatal Sengers syndrome.
- name: Skeletal Muscle Biopsy and OXPHOS/ANT1 Assessment
  diagnosis_term:
    preferred_term: skeletal muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  description: >-
    Histochemical, ultrastructural, and biochemical evaluation of skeletal
    muscle biopsy tissue or patient fibroblasts, including immunoblotting for
    adenine nucleotide translocator 1 (ANT1) and respiratory chain
    spectrophotometry. Routine pyruvate oxidation and enzyme measurements may be
    normal, whereas immunoblotting demonstrates severe ANT1 protein depletion
    and spectrophotometry shows decreased OXPHOS complex I and V activity.
  presence: Positive
  results: >-
    Strongly reduced skeletal muscle ANT1 protein on immunoblot, abnormal
    mitochondrial ultrastructure and lipid accumulation on transmission electron
    microscopy, and reduced respiratory chain complex I and V activity.
  evidence:
  - reference: DOI:10.1002/ana.10214
    reference_title: "Adenine nucleotide translocator 1 deficiency associated with Sengers syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In immunoblot analysis, the protein content of the mitochondrial adenine nucleotide translocator 1 (ANT1) was found to be strongly reduced in the muscle tissues of two unrelated patients with Sengers syndrome."
    explanation: Establishes skeletal muscle immunoblot detection of severe ANT1 protein depletion as a characteristic tissue finding in Sengers syndrome.
  - reference: DOI:10.1002/ana.10214
    reference_title: "Adenine nucleotide translocator 1 deficiency associated with Sengers syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sengers syndrome is characterized by congenital cataracts, hypertrophic cardiomyopathy, mitochondrial myopathy, and lactic acidosis, but no abnormalities have been found with routine mitochondrial biochemical diagnostics (the determination of pyruvate oxidation rates and enzyme measurements)."
    explanation: Highlights the diagnostic pitfall that routine mitochondrial pyruvate oxidation and enzyme assays can be normal despite severe ANT1 depletion.
  - reference: DOI:10.3390/ijms222413484
    reference_title: "Characterization of a Novel Splicing Variant in Acylglycerol Kinase (AGK) Associated with Fatal Sengers Syndrome"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Decreases in the oxygen consumption rate (OCR) and the OCR:ECAR (extracellular acidification rate) ratio in the patient’s fibroblasts indicated reduced electron flow through the respiratory chain, and spectrophotometry revealed decreased activity of OXPHOS complexes I and V."
    explanation: Shows that cellular respirometry and spectrophotometry detect reduced oxygen consumption and complex I and V deficiency in fatal Sengers syndrome.
- name: Ophthalmologic Examination
  diagnosis_term:
    preferred_term: ophthalmologic examination
    term:
      id: NCIT:C120698
      label: Ophthalmoscopy
  notes: >-
    NCIT:C120698 (Ophthalmoscopy) is used as the closest cached NCIT ophthalmic
    diagnostic procedure term; clinical detection of congenital cataracts in
    neonates and infants combines red-reflex ophthalmoscopy with general
    ophthalmic and slit-lamp examination.
  description: >-
    Ophthalmic evaluation in neonates and infants to detect bilateral congenital
    or early developmental cataracts, which are often the initial presenting
    sign of Sengers syndrome.
  presence: Positive
  results: >-
    Bilateral congenital or infantile lens opacities (leukocoria or absent red
    reflex) requiring cataract extraction.
  evidence:
  - reference: DOI:10.1186/s13052-022-01370-y
    reference_title: "Long term follow-up in two siblings with Sengers syndrome: Case report"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sengers syndrome is characterized by congenital cataract, hypertrophic cardiomyopathy, mitochondrial myopathy, and lactic acidosis associated with mutations in AGK gene."
    explanation: Confirms congenital cataract as a cardinal diagnostic feature of Sengers syndrome.

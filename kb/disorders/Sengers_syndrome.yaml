      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Sengers syndrome is inherited in an autosomal recessive pattern, typically
    due to biallelic AGK variants (homozygous or compound heterozygous) with
    unaffected carrier parents.
  evidence:
  - reference: PMID:34164355
    reference_title: "Case Report: Two Chinese Infants of Sengers Syndrome Caused by Mutations in AGK Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sengers syndrome (OMIM #212350) is a rare autosomal recessive disorder due to mutations in acylglycerol kinase (AGK) gene."
    explanation: This explicitly states autosomal recessive inheritance due to AGK variants.
  - reference: PMID:34164355
    reference_title: "Case Report: Two Chinese Infants of Sengers Syndrome Caused by Mutations in AGK Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing of a boy revealed a homozygous pathogenic variant for Sengers syndrome in AGK (c.1131+2T>C) which was classified as likely pathogenic according to the ACMG guideline"
    explanation: Identification of a homozygous AGK variant supports autosomal recessive inheritance.
progression:
- phase: Severe neonatal-onset form
  age_range: Neonatal period to infancy
  notes: >-
    Rapidly progressive infantile form presenting at birth or in the neonatal
    period with congenital cataracts, severe hypertrophic or dilated/noncompaction
    cardiomyopathy, and refractory lactic acidosis, frequently resulting in
    infantile death from progressive heart failure (with 86.4% of reported fatal
    cases dying within 3 years of age).
  evidence:
  - reference: PMID:34164355
    reference_title: "Case Report: Two Chinese Infants of Sengers Syndrome Caused by Mutations in AGK Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease was first described by Sengers in 1975 with the hallmark signs of hypertrophic cardiomyopathy, congenital cataract, mitochondrial myopathy, and lactic acidosis after exercise and can be further divided into two clinical forms including a severe neonatal form that can cause infantile death and a benign form with better prognosis (1, 2)."
    explanation: Distinguishes the severe neonatal lethal clinical form from the benign chronic form of Sengers syndrome.
  - reference: PMID:34164355
    reference_title: "Case Report: Two Chinese Infants of Sengers Syndrome Caused by Mutations in AGK Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In terms of mortality, Sengers syndrome is a highly malignant disease, with a total mortality rate of 57.9% (22/38). Importantly, the death rate varied at different ages, namely, 86.4% (19/22) within 3 years of age, 77.3% (17/22) within 1 year of age, and 31.8% (7/22) during the neonatal period."
    explanation: Quantifies early-life mortality in Sengers syndrome, with 86.4% of reported deaths occurring within the first 3 years of life and 77.3% within the first year.
  - reference: DOI:10.3390/ijms222413484
    reference_title: "Characterization of a Novel Splicing Variant in Acylglycerol Kinase (AGK) Associated with Fatal Sengers Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe the case of an infant carrying a novel homozygous AGK variant, c.518+1G>A, who was born with congenital cataracts, pielic ectasia, critical congenital dilated myocardiopathy, and hyperlactacidemia and died 20 h after birth."
    explanation: Documents a fulminant neonatal presentation of Sengers syndrome with death within 20 hours of birth.
  - reference: PMID:8526648
    reference_title: "Cardiac transplantation for hypertrophic cardiomyopathy associated with Sengers syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive cardiac failure is the cause of death in most patients."
    explanation: Identifies progressive heart failure as the primary cause of mortality in Sengers syndrome.
- phase: Chronic benign form with adult survival
  age_range: Infancy to adulthood
  notes: >-
    More slowly progressive clinical form characterized by congenital cataracts,
    childhood-onset or stable hypertrophic cardiomyopathy, skeletal myopathy, and
    exercise-induced lactic acidosis, allowing survival into adulthood, although
    few reported patients have been followed beyond the second decade of life.
  evidence:
  - reference: DOI:10.1186/s13052-022-01370-y
    reference_title: "Long term follow-up in two siblings with Sengers syndrome: Case report"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical course ranges from a severe fatal neonatal form, to a more benign form allowing survival into adulthood, to an isolated form of congenital cataract."
    explanation: Documents the chronic benign clinical course permitting survival into adulthood alongside the severe neonatal and isolated cataract presentations.
  - reference: DOI:10.1186/s13052-022-01370-y
    reference_title: "Long term follow-up in two siblings with Sengers syndrome: Case report"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus far few reported cases have survived the second decade at their latest examination, and no natural history data are available for the disease."
    explanation: Notes that across all reported Sengers syndrome cases, only a few patients have documented follow-up beyond the second decade of life, and natural history data remain scarce.

differential_diagnoses:
- name: Barth syndrome
  disease_term:
    preferred_term: Barth syndrome
    term:
      id: MONDO:0010543
      label: Barth syndrome
  description: >
    X-linked mitochondrial disorder with cardiomyopathy and metabolic features
    that can overlap with Sengers syndrome.
  distinguishing_features:
  - X-linked inheritance and neutropenia are typical for Barth syndrome.
  - Cardiolipin remodeling defects due to TAZ variants distinguish it from AGK-related Sengers syndrome.
  evidence:
  - reference: DOI:10.1007/s10545-014-9759-7
    reference_title: "Inborn errors of metabolism in the biosynthesis and remodelling of phospholipids"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sengers syndrome (due to mutations in AGK), MEGDEL syndrome (or SERAC defect, SERAC1), Barth syndrome (or TAZ defect, TAZ)"
    explanation: This review lists Barth syndrome alongside Sengers syndrome among phospholipid metabolism disorders.
- name: 3-methylglutaconic aciduria with deafness, encephalopathy, and Leigh-like syndrome
  disease_term:
    preferred_term: 3-methylglutaconic aciduria with deafness, encephalopathy, and Leigh-like syndrome
    term:
      id: MONDO:0013875
      label: 3-methylglutaconic aciduria with deafness, encephalopathy, and Leigh-like syndrome
  description: >
    SERAC1-related mitochondrial disorder (MEGDEL syndrome) with multisystem
    involvement and overlapping metabolic features.
  distinguishing_features:
  - Prominent deafness and Leigh-like neurodegeneration are typical.
  - SERAC1-related disease has a different genetic cause than AGK-related Sengers syndrome.
  evidence:
  - reference: DOI:10.1007/s10545-014-9759-7
    reference_title: "Inborn errors of metabolism in the biosynthesis and remodelling of phospholipids"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sengers syndrome (due to mutations in AGK), MEGDEL syndrome (or SERAC defect, SERAC1), Barth syndrome (or TAZ defect, TAZ)"
    explanation: This review lists MEGDEL syndrome as a related phospholipid metabolism disorder to consider in the differential.
- name: Adenine nucleotide translocator 1 (ANT1) deficiency
  description: Reduced ANT1 protein and activity can present with overlapping mitochondrial cardiomyopathy and myopathy features.
  distinguishing_features:
  - ANT1 protein content and transport activity are markedly reduced in muscle, yet sequence and linkage analyses may exclude ANT1 as the primary genetic cause.
  evidence:
  - reference: DOI:10.1002/ana.10214
    reference_title: "Adenine nucleotide translocator 1 deficiency associated with Sengers syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In immunoblot analysis, the protein content of the mitochondrial adenine nucleotide translocator 1 (ANT1) was found to be strongly reduced in the muscle tissues of two unrelated patients with Sengers syndrome."
    explanation: The abstract documents reduced ANT1 protein in muscle, a key differential consideration.
  - reference: DOI:10.1002/ana.10214
    reference_title: "Adenine nucleotide translocator 1 deficiency associated with Sengers syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis and linkage analysis showed that ANT1 was not the primary genetic cause of Sengers syndrome."
    explanation: This supports distinguishing ANT1 deficiency from primary AGK-related Sengers syndrome.

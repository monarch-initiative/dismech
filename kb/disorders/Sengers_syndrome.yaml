  - target: Congestive heart failure
    description: Severe cardiomyopathy and bioenergetic failure drive heart failure in Sengers syndrome.
  - target: Developmental cataract
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired mitochondrial bioenergetics may contribute to congenital and

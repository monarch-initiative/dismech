imaging_findings:
- name: Heterogeneous pediatric intracranial mass on MRI and DWI
  modality: MRI
  description: >-
    Compared with pediatric medulloblastoma in one retrospective case-control
    cohort, AT/RT more often showed cystic degeneration, hemorrhage,
    supratentorial ventriculomegaly, and peritumoral edema, with a lower mean
    apparent-diffusion-coefficient value. These features are supportive and not
    pathognomonic.
  located_in:
    preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  diagnostic: false
  evidence:
  - reference: PMID:42384062
    reference_title: A case-control study of MRI features in pediatric atypical teratoid rhabdoid tumor and medulloblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI features, including more cystic degeneration, hemorrhage, supratentorial ventriculomegaly, and peritumoral edema, combined with a lower ADC value may provide reliable information to differentiate AT/RT from MB in children."
    explanation: The 32-AT/RT versus 82-medulloblastoma comparison supports a bounded, differential-imaging pattern rather than a diagnostic rule.
diagnosis:
- name: Integrated histologic, immunophenotypic, and molecular diagnosis
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  markers: INI1/SMARCB1 loss or, rarely, BRG1/SMARCA4 loss; DNA methylation class
  description: >-
    Diagnosis integrates embryonal/rhabdoid morphology with loss of INI1 or
    BRG1 and molecular confirmation. DNA methylation profiling is especially
    useful for subgroup assignment and morphologically or age-atypical cases.
  evidence:
  - reference: PMID:41374972
    reference_title: "Atypical Teratoid Rhabdoid Tumor: How Tumor Diagnostic Methods in the Laboratory Have Evolved over the Past 40 Years."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A comprehensive, multimodal diagnostic approach combining histologic, immunophenotypic, and molecular data is essential to accurately identify AT/RT and guide clinical management, particularly in diagnostically ambiguous or atypical cases."
    explanation: The diagnostic review directly supports integrated testing and bounds its importance in ambiguous presentations.
- name: Germline SMARCB1 and SMARCA4 assessment
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  markers: Constitutional pathogenic SMARCB1 or SMARCA4 variant
  description: >-
    Paired tumor and constitutional assessment identifies rhabdoid tumor
    predisposition and informs family counseling; a germline result is not
    required for tumor diagnosis.
  evidence:
  - reference: PMID:32105509
    reference_title: "Efficacy of High-Dose Chemotherapy and Three-Dimensional Conformal Radiation for Atypical Teratoid/Rhabdoid Tumor: A Report From the Children's Oncology Group Trial ACNS0333."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten of 64 patients tested had germline deletions or mutations ofSMARCB1."
    explanation: Prospective paired testing demonstrates a clinically material germline fraction in AT/RT.
differential_diagnoses:
- name: Medulloblastoma and other embryonal CNS tumors
  description: >-
    AT/RT can share primitive embryonal fields and pediatric posterior-fossa
    imaging with medulloblastoma. Loss of INI1 or BRG1 and confirmatory molecular
    profiling distinguish AT/RT; MRI patterns can inform but cannot replace tissue diagnosis.
  distinguishing_features:
  - INI1 or BRG1 nuclear loss supports AT/RT.
  - DNA methylation classification separates AT/RT from medulloblastoma classes.
  - Cystic change, hemorrhage, ventriculomegaly, edema, and lower ADC favored AT/RT in one case-control MRI study.
  evidence:
  - reference: PMID:8683283
    reference_title: "Central nervous system atypical teratoid/rhabdoid tumors of infancy and childhood: definition of an entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This tumor is typically misdiagnosed as a primitive neuroectodermal tumor (PNET) primarily because 70% of ATT/RhTs contain fields indistinguishable from classic PNETs."
    explanation: The foundational 52-case pathology series directly documents the morphologic overlap underlying this differential.
  - reference: PMID:42384062
    reference_title: A case-control study of MRI features in pediatric atypical teratoid rhabdoid tumor and medulloblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI features, including more cystic degeneration, hemorrhage, supratentorial ventriculomegaly, and peritumoral edema, combined with a lower ADC value may provide reliable information to differentiate AT/RT from MB in children."
    explanation: A contemporary case-control study supports adjunctive MRI distinctions while not claiming imaging suffices for diagnosis.
- name: Choroid plexus carcinoma, CRINET, poorly differentiated chordoma, and epithelioid sarcoma
  description: >-
    These INI1-related or morphologically overlapping entities are relevant in
    unusual locations, age groups, and composite tumors. Anatomic context,
    immunophenotype, genetics, and methylation class must be integrated.
  distinguishing_features:
  - Tumor location and lineage-specific morphology/immunophenotype.
  - Retained versus lost INI1 or BRG1 in the appropriate diagnostic context.
  - Entity-specific DNA methylation and genomic profile.
  evidence:
  - reference: PMID:41374972
    reference_title: "Atypical Teratoid Rhabdoid Tumor: How Tumor Diagnostic Methods in the Laboratory Have Evolved over the Past 40 Years."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Differential considerations, including epithelioid sarcoma, poorly differentiated chordoma, CRINET, choroid plexus carcinoma, and rare composite tumors, further complicate the diagnostic landscape."
    explanation: The diagnostic review explicitly enumerates these differential considerations.

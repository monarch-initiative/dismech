  - reference: PMID:40726147
    reference_title: A cycling, progenitor-like cell population at the base of atypical teratoid rhabdoid tumor subtype differentiation trajectories.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By directing tumor cells along their respective subtype-specific trajectories, we were able to induce a shift toward more differentiated, non-proliferative states."
    explanation: Patient-derived tumoroid perturbation shows that the precursor-like state is experimentally linked to proliferation and differentiation arrest.

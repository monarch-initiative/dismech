    reference_title: "Efficacy of High-Dose Chemotherapy and Three-Dimensional Conformal Radiation for Atypical Teratoid/Rhabdoid Tumor: A Report From the Children's Oncology Group Trial ACNS0333."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsets of patients who can be cured with less therapy may exist. The goal must be to continue to improve survival and reduce toxicity with refinements in therapy based on integration of biologic and clinical risk factors."

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, a shared cycling, intermediate precursor cell (IPC)-like cell population, interspersed throughout tumors, was consistently present within all ATRT samples."
    explanation: >-
      Single-cell patient-tumor data directly demonstrate the shared cycling

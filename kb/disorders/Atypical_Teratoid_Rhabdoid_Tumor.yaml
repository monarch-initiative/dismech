- discussion_id: gap_atrt_risk_adapted_therapy
  prompt: Which molecular and clinical strata can safely receive less toxic therapy, and which need novel intensification?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Intensive Multiagent Chemotherapy
  - treatments#Adjuvant Radiation Therapy
  rationale: >-
    Subgroup and germline associations are based on small strata, while intensive
    multimodal therapy has substantial acute and long-term toxicity. Existing
    studies do not establish validated subgroup-specific de-escalation rules.

- accession: ega:EGAS50000000811
  title: Measles oncolytic virus as an immunotherapy for recurrent/refractory pediatric medulloblastoma and atypical teratoid rhabdoid tumor
  description: Pediatric recurrent medulloblastoma (MB) and atypical teratoid rhabdoid tumor (ATRT) are largely incurable and warrant novel therapies. We investigated a) the safety of a measles virus variant, MV-NIS, in a pediatric phase 1 study and b) the mechanisms of MV-NIS and potential benefit of combination with immune checkpoint inhibition (ICI). Pediatric patients with recurrent MB or ATRT were treated with intratumoral injections for local recurrence or via lumbar puncture for disseminated recurrence. We evaluated local immune responses to MV-NIS with and without ICI via single-cell and bulk RNA sequencing in an intracranial, immunocompetent, syngeneic murine model.
  organism:
    preferred_term: human

name: Atypical Teratoid/Rhabdoid Tumor
creation_date: '2026-04-12T20:00:00Z'
description: >-
  Atypical teratoid/rhabdoid tumor (AT/RT) is a highly aggressive embryonal
  central nervous system tumor that predominantly affects infants and young
  children. AT/RT is defined by SMARCB1 loss and, rarely, SMARCA4 loss within
  the SWI/SNF chromatin-remodeling complex. Consistent with dismech cancer
  curation guidance, this entry treats AT/RT as the disease-level mechanism
  graph and models TYR, SHH, MYC, and the rare molecularly distinct
  SMARCA4-deficient group as subtype facets rather than separate disorder pages.
categories:
- Central Nervous System Neoplasm
- Pediatric Brain Tumor
- Embryonal Tumor
- Molecularly Defined Tumor
- SWI/SNF-Deficient Tumor
parents:
- rhabdoid tumor
disease_term:
  preferred_term: atypical teratoid rhabdoid tumor
  term:
    id: MONDO:0020560
    label: atypical teratoid rhabdoid tumor
epidemiology:
- name: Infant-predominant pediatric brain tumor
  description: >-
    AT/RT is rare among pediatric brain tumors overall but disproportionately
    represented in infants and children younger than 3 years of age.
  evidence:
  - reference: PMID:22988546
    reference_title: "Atypical teratoid rhabdoid tumor: current therapy and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Atypical teratoid rhabdoid tumors (ATRTs) are rare central nervous system tumors that comprise approximately 1-2% of all pediatric brain tumors; however, in patients less than 3 years of age this tumor accounts for up to 20% of cases."
    explanation: >-
      This review provides the standard disease-level epidemiology framing used
      clinically for AT/RT, highlighting its enrichment in infants and very
      young children.
prevalence:
- population: United States SEER 17 registries, 2001-2021
  measure_type: ANNUAL_INCIDENCE
  rate_per_100000: 0.084
  notes: >-
    Population-based incidence estimate from 393 registered cases. This is an
    annual incidence measure, not disease prevalence.
  evidence:
  - reference: PMID:39832059
    reference_title: Descriptive epidemiology and prognostic factors of atypical teratoid/rhabdoid tumors in the United States, 2001-2021.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 393 patients were included in our analysis. Most patients developed tumors at less than 1 year of age (33.6%). The overall incidence was 0.084 per 100,000 population."
    explanation: The SEER analysis directly reports the cohort size, age concentration, and annual population incidence.
progression:
- phase: Early relapse
  age_range: Birth to 22 years in ACNS0333
  notes: >-
    Relapse risk is front-loaded after treatment: 91% of documented treatment
    failures in ACNS0333 occurred within two years of enrollment.
  evidence:
  - reference: PMID:32105509
    reference_title: "Efficacy of High-Dose Chemotherapy and Three-Dimensional Conformal Radiation for Atypical Teratoid/Rhabdoid Tumor: A Report From the Children's Oncology Group Trial ACNS0333."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty treatment failures (91%) occurred by 2 years from enrollment."
    explanation: The prospective cooperative-group cohort directly establishes the early concentration of relapse events.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    AT/RT has high mortality, rapid early relapse, treatment-related mortality,
    and substantial late-effect risk from intensive chemotherapy, stem-cell
    rescue, and radiotherapy. Contemporary therapy improves survival but does
    not make prognosis uniformly favorable.
  evidence:
  - reference: PMID:32105509
    reference_title: "Efficacy of High-Dose Chemotherapy and Three-Dimensional Conformal Radiation for Atypical Teratoid/Rhabdoid Tumor: A Report From the Children's Oncology Group Trial ACNS0333."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four-year EFS and overall survival for the entire cohort were 37% (95% CI, 25% to 49%) and 43% (95% CI, 31% to 55%), respectively."
    explanation: Prospective ACNS0333 outcomes support a high disease-level mortality and recurrence burden despite intensive multimodal care.
  - reference: PMID:42453193
    reference_title: A multi-institutional report of children with atypical teratoid rhabdoid tumor treated with intensive multimodal therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 4-year EFS and OS for the entire cohort were 49% and 53%, respectively."
    explanation: A 2026 multi-institutional cohort confirms that substantial mortality and events persist with contemporary intensive therapy.
has_subtypes:
- name: TYR
  display_name: AT/RT-TYR
  classification: molecular
  description: >-
    Consensus methylation-defined molecular subgroup of AT/RT. It is retained as
    a flat subtype facet within the AT/RT disease graph rather than as a separate
    dismech disease page.
  evidence:
  - reference: PMID:41374972
    reference_title: "Atypical Teratoid Rhabdoid Tumor: How Tumor Diagnostic Methods in the Laboratory Have Evolved over the Past 40 Years."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The integration of immunohistochemical markers with advanced molecular diagnostics-including next-generation sequencing, DNA methylation profiling, and gene enrichment analyses-has facilitated robust tumor classification and the identification of three molecular subgroups: TYR, SHH, and MYC."
    explanation: >-
      This review explicitly names TYR as one of the three consensus molecular
      subgroups used to facet AT/RT without implying a separate disease page.
- name: SHH
  display_name: AT/RT-SHH
  classification: molecular
  description: >-
    Consensus methylation-defined molecular subgroup of AT/RT. It is modeled as
    a molecular subgroup axis inside the AT/RT page. Integrated profiling has
    further resolved SHH-1A, SHH-1B, and SHH-2 patterns with distinct age,
    location, and germline-SMARCB1 distributions; these are retained here as
    within-SHH heterogeneity rather than promoted to independent disorders.
  evidence:
  - reference: PMID:41374972
    reference_title: "Atypical Teratoid Rhabdoid Tumor: How Tumor Diagnostic Methods in the Laboratory Have Evolved over the Past 40 Years."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The integration of immunohistochemical markers with advanced molecular diagnostics-including next-generation sequencing, DNA methylation profiling, and gene enrichment analyses-has facilitated robust tumor classification and the identification of three molecular subgroups: TYR, SHH, and MYC."
    explanation: >-
      This review explicitly names SHH as one of the three consensus molecular
      subgroups used to facet AT/RT.
  - reference: PMID:35501487
    reference_title: ATRT-SHH comprises three molecular subgroups with characteristic clinical and histopathological features and prognostic significance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consensus clustering of DNA methylation profiles and confirmatory t-SNE analysis of 65 ATRT-SHH yielded three robust molecular subgroups, i.e., SHH-1A, SHH-1B and SHH-2."
    explanation: Integrated molecular analysis directly supports reproducible within-SHH subdivision without treating those patterns as separate diseases.
- name: MYC
  display_name: AT/RT-MYC
  classification: molecular
  description: >-
    Consensus methylation-defined molecular subgroup of AT/RT. It is modeled as

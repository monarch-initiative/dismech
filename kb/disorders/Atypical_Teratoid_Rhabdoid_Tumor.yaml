- name: SMARCA4
  display_name: AT/RT-SMARCA4
  classification: molecular
  description: >-
    Rare SMARCA4-deficient AT/RT forms a molecular group distinct from the three
    SMARCB1-deficient consensus subgroups. It is associated with younger age,
    more germline variants, and inferior prognosis, although case numbers are
    small.
  evidence:
  - reference: DOI:10.1007/s00401-020-02250-7
    reference_title: Atypical teratoid/rhabdoid tumors (ATRTs) with SMARCA4 mutation are molecularly distinct from SMARCB1-deficient cases
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that they form a separate group segregating from SMARCB1 mutated ATRTs and from other SMARCA4-deficient tumors like small cell carcinoma of the ovary, hypercalcemic type (SCCOHT) or SMARCA4 mutated extra-cranial malignant rhabdoid tumors."
    explanation: DNA methylation profiling of 14 AT/RT-SMARCA4 tumors directly establishes a separate molecular group.
pathophysiology:
- name: SMARCB1 or SMARCA4 Inactivation
  biological_scale: MOLECULAR
  description: >-
    AT/RT is defined by inactivation of the SWI/SNF core subunits SMARCB1 and,
    more rarely, SMARCA4. This is the shared disease-defining lesion across the
    AT/RT molecular subgroups.
  genes:
  - preferred_term: SMARCB1
    term:
      id: hgnc:11103
      label: SMARCB1
  - preferred_term: SMARCA4
    term:
      id: hgnc:11100
      label: SMARCA4
  protein_complexes:
  - preferred_term: SWI/SNF complex
    term:
      id: GO:0016514
      label: SWI/SNF complex
  evidence:
  - reference: PMID:41374972
    reference_title: "Atypical Teratoid Rhabdoid Tumor: How Tumor Diagnostic Methods in the Laboratory Have Evolved over the Past 40 Years."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "AT/RT now encompasses CNS tumors characterized by SMARCB1 (INI-1) or SMARCA4 (BRG-1) alterations within the SWI/SNF chromatin-remodeling complex."
    explanation: >-
      This review directly defines AT/RT by SMARCB1 or SMARCA4 alterations in
      the SWI/SNF complex, supporting the disease-defining initiating lesion.
  downstream:
  - target: SWI/SNF Chromatin Remodeling Defect
    description: Core subunit loss disables normal SWI/SNF chromatin remodeling
    evidence:
    - reference: PMID:40121526
      reference_title: SWI/SNF complexes govern ontology-specific transcription factor function in MYC-subtype atypical teratoid rhabdoid tumor.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "SMARCB1-dependent SWI/SNF integrates transcriptional functions of lineage-specific TFs into a core regulatory circuit that depends on the AP-1 subunit c-JUN, whose expression is determined by a SMARCB1-dependent super-enhancer that is lost in ATRT-MYC."
      explanation: Perturbation studies directly connect SMARCB1-dependent SWI/SNF function to the regulatory circuitry lost in AT/RT.
  - target: EZH2 Enzymatic Dependency
    description: SMARCB1 loss creates a preclinical dependency on EZH2 activity in rhabdoid tumors, including the AT/RT disease context.
    evidence:
    - reference: PMID:23620515
      reference_title: Durable tumor regression in genetically altered malignant rhabdoid tumors by inhibition of methyltransferase EZH2.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Inactivation of the switch/sucrose nonfermentable complex component SMARCB1 is extremely prevalent in pediatric malignant rhabdoid tumors (MRTs) or atypical teratoid rhabdoid tumors. This alteration is hypothesized to confer oncogenic dependency on EZH2 in these cancers."
      explanation: The publication explicitly places the proposed EZH2 dependency downstream of SMARCB1 inactivation in MRT/ATRT; direct dependency experiments were performed in SMARCB1-mutant MRT models.
- name: SWI/SNF Chromatin Remodeling Defect
  biological_scale: MOLECULAR
  description: >-
    Loss of SMARCB1 or SMARCA4 impairs the SWI/SNF chromatin-remodeling machinery,
    shifting AT/RT biology toward an epigenetically driven tumor state.
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: ABNORMAL
    term:
      id: GO:0006338
      label: chromatin remodeling
  evidence:
  - reference: PMID:40121526
    reference_title: SWI/SNF complexes govern ontology-specific transcription factor function in MYC-subtype atypical teratoid rhabdoid tumor.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observe that an activating protein 1 (AP-1)-dependent transcriptional regulatory network is lost in ATRT, and AP-1 and lineage-specific TFs TEAD1 and ZIC2 require SMARCB1 for enhancer binding."
    explanation: >-
      Functional molecular experiments, rather than disease definition alone,
      show how SMARCB1 loss disables lineage-transcription-factor enhancer binding.
  downstream:
  - target: Subtype-Specific Enhancer Dysregulation
    description: Epigenetic dysregulation segregates into distinct subgroup programs
    evidence:
    - reference: PMID:40121526
      reference_title: SWI/SNF complexes govern ontology-specific transcription factor function in MYC-subtype atypical teratoid rhabdoid tumor.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We observe that an activating protein 1 (AP-1)-dependent transcriptional regulatory network is lost in ATRT, and AP-1 and lineage-specific TFs TEAD1 and ZIC2 require SMARCB1 for enhancer binding."
      explanation: Functional experiments directly link the SWI/SNF defect to loss of enhancer-bound lineage regulatory networks.
- name: Subtype-Specific Enhancer Dysregulation
  biological_scale: MOLECULAR
  description: >-
    Despite a simple recurrent genetic landscape, AT/RT segregates into distinct
    epigenetic subgroups with different enhancer states and regulatory networks.
  biological_processes:
  - preferred_term: regulation of gene expression
    modifier: ABNORMAL
    term:
      id: GO:0010468
      label: regulation of gene expression
  evidence:
  - reference: PMID:26923874
    reference_title: "Atypical Teratoid/Rhabdoid Tumors Are Comprised of Three Epigenetic Subgroups with Distinct Enhancer Landscapes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three distinct molecular subgroups of ATRTs, associated with differences in demographics, tumor location, and type of SMARCB1 alterations, were identified."
    explanation: >-
      This methylation and integrated molecular profiling study identifies the
      three consensus molecular subgroups within AT/RT.
  - reference: PMID:26923874
    reference_title: "Atypical Teratoid/Rhabdoid Tumors Are Comprised of Three Epigenetic Subgroups with Distinct Enhancer Landscapes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-genome bisulfite sequencing and H3K27Ac chromatin-immunoprecipitation sequencing of primary tumors, however, revealed clear differences, leading to the identification of subgroup-specific regulatory networks and potential therapeutic targets."
    explanation: >-
      This provides direct human-tumor evidence that subgroup biology is driven
      by enhancer and regulatory-network differences rather than additional
      recurrent coding mutations.
  - reference: PMID:37020038
    reference_title: "Atypical teratoid/rhabdoid tumoroids reveal subgroup-specific drug vulnerabilities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that ATRT tumoroids retain subgroup-specific epigenetic and gene expression profiles."
    explanation: >-
      In vitro AT/RT tumoroids recapitulate subgroup-specific epigenetic and
      transcriptional programs, reinforcing the atomic subgroup-program node.
  downstream:
  - target: Cycling Progenitor-Like Tumor State
    description: Subtype trajectories share a proliferative intermediate-precursor-like state
    evidence:
    - reference: PMID:40726147
      reference_title: A cycling, progenitor-like cell population at the base of atypical teratoid rhabdoid tumor subtype differentiation trajectories.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Furthermore, a shared cycling, intermediate precursor cell (IPC)-like cell population, interspersed throughout tumors, was consistently present within all ATRT samples."
      explanation: Single-cell analysis of patient tumors directly connects subgroup differentiation trajectories to a shared cycling precursor-like population.
- name: Cycling Progenitor-Like Tumor State
  biological_scale: CELLULAR
  description: >-
    Patient tumors contain a shared cycling intermediate-precursor-like cell
    population at the base of subtype-specific differentiation trajectories.
    Patient-derived tumoroids can be shifted toward differentiated,
    non-proliferative states, supporting differentiation arrest as an assayable
    contributor to malignant growth rather than inferring proliferation from
    clinical tempo alone.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:

- name: EZH2 Enzymatic Dependency
  biological_scale: MOLECULAR
  description: >-
    SMARCB1-deficient rhabdoid tumor models show dependence on EZH2 enzymatic
    activity. In AT/RT patient molecular data, tumor-specific DNA
    hypermethylation is associated with PRC2 and suppressed neural-development
    genes. This is a preclinical mechanistic vulnerability, not established
    clinical efficacy of EZH2 inhibition.
  evidence:
  - reference: PMID:23620515
    reference_title: Durable tumor regression in genetically altered malignant rhabdoid tumors by inhibition of methyltransferase EZH2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The compound induces apoptosis and differentiation specifically in SMARCB1-deleted MRT cells."
    explanation: Selective EZH2 inhibition directly induced differentiation and apoptosis in SMARCB1-deleted rhabdoid tumor cells.
  - reference: DOI:10.26508/lsa.202302088
    reference_title: Aberrant DNA methylation distorts developmental trajectories in atypical teratoid/rhabdoid tumors
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AT/RT-unique DNA hypermethylation was associated with polycomb repressive complex 2 and linked to suppressed genes with a role in neural development and tumorigenesis."
    explanation: Primary-tumor methylation and expression analysis directly links the AT/RT epigenetic state to PRC2-associated repression of neural-development programs.
  downstream:
  - target: Cycling Progenitor-Like Tumor State
    description: EZH2/PRC2-associated repression helps maintain a low-differentiation malignant state.
    evidence:
    - reference: PMID:23620515
      reference_title: Durable tumor regression in genetically altered malignant rhabdoid tumors by inhibition of methyltransferase EZH2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The compound induces apoptosis and differentiation specifically in SMARCB1-deleted MRT cells."
      explanation: Releasing EZH2 activity experimentally drives differentiation, supporting the direction from dependency toward maintenance of the progenitor-like state.
    - reference: DOI:10.26508/lsa.202302088
      reference_title: Aberrant DNA methylation distorts developmental trajectories in atypical teratoid/rhabdoid tumors
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These results highlight and characterize the role of DNA hypermethylation in AT/RT malignancy and halted neural cell differentiation."
      explanation: Human-tumor molecular data independently connects the epigenetic state to halted neural differentiation.

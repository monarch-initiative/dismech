datasets:
- accession: ega:EGAS00001008108
  title: A cycling, progenitor-like cell population at the root of atypical teratoid rhabdoid tumor subtype differentiation trajectories.
  description: 'Background: Atypical teratoid rhabdoid tumors (ATRTs), characterized by the loss of SMARCB1, are among the most lethal pediatric central nervous system (CNS) tumors. Three molecular subtypes have been identified, each defined by distinct molecular and clinical features. No subtype-specific treatments are available, highlighting the necessity to better understand inter- and intra-subtype heterogeneity. Methods: We generated a single-nucleus transcriptome atlas of ATRTs, validated by single-cell ATAC-seq and spatial transcriptomics, to study subtype-specific differentiation trajectories.'
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("atypical teratoid rhabdoid tumor"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'

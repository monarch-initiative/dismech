name: Chlamydia Pneumoniae Pneumonia
creation_date: "2026-09-27T04:25:27Z"
description: >
  Chlamydia pneumoniae pneumonia is an atypical community-acquired pneumonia
  caused by the obligate intracellular bacterium Chlamydia pneumoniae. The
  infection spreads between people, replicates in epithelial cells inside a
  chlamydial inclusion, and requires cell-penetrant ribosome-active therapy such
  as a macrolide rather than a beta-lactam.
category: Infectious Disease
parents:
- Bacterial Respiratory Infection
synonyms:
- Chlamydophila pneumoniae pneumonia
- Chlamydia pneumonia
- TWAR pneumonia
- Chlamydial pneumonia due to Chlamydia pneumoniae
infectious_agent:
- name: Chlamydia pneumoniae
  infectious_agent_term:
    preferred_term: Chlamydia pneumoniae
    term:
      id: NCBITaxon:83558
      label: Chlamydia pneumoniae
  description: >-
    The human-adapted, obligate intracellular Chlamydia species formerly known
    as Chlamydophila pneumoniae and historically called TWAR.
  evidence:
  - reference: PMID:15895932
    reference_title: "[Chlamydia: diagnostic and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chlamydia are obligate intracellular bacteria.
    explanation: >-
      Establishes the genus-level obligate intracellular lifestyle that applies
      to C. pneumoniae.
  - reference: PMID:2181028
    reference_title: "A new respiratory tract pathogen: Chlamydia pneumoniae strain TWAR."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chlamydia pneumoniae strain TWAR, the new third species of Chlamydia, is a
      common cause of pneumonia and other acute respiratory tract infections.
    explanation: >-
      Identifies the TWAR organism as Chlamydia pneumoniae and as a respiratory
      pathogen that causes pneumonia.
transmission:
- name: Person-to-person respiratory spread
  description: >-
    C. pneumoniae spreads between people with a long incubation period,
    producing slow outbreaks and reinfections rather than requiring a bird or
    livestock reservoir.
  evidence:
  - reference: PMID:2181028
    reference_title: "A new respiratory tract pathogen: Chlamydia pneumoniae strain TWAR."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The infection is transmitted from person to person, apparently with a long
      incubation period.
    explanation: >-
      Review evidence supporting the person-to-person spread and long incubation
      period of C. pneumoniae infection.
pathophysiology:
- name: Droplet Exposure and Obligate Intracellular Infection
  role: trigger
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  description: >
    Inhaled C. pneumoniae elementary bodies attach to the respiratory epithelium
    and enter host cells, then replicate within a membrane-bound chlamydial
    inclusion. That intracellular niche is why therapy has to use agents that
    penetrate host cells rather than hydrophilic beta-lactams.
  cell_types:
  - preferred_term: respiratory epithelial cell
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:15895932
    reference_title: "[Chlamydia: diagnostic and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chlamydia are obligate intracellular bacteria.
    explanation: >-
      Supports the intracellular-pathogen conformance for C. pneumoniae.
  downstream:
  - target: Respiratory Epithelial Cytadherence and IL-8 Signaling
    description: >-
      Host-cell adherence initiates the epithelial proinflammatory response.
  - target: Ciliated Bronchial Epithelial Ciliostasis
    description: >-
      Infection impairs ciliary motion in the bronchial epithelium.
  - target: Epithelial Apoptosis Resistance
    description: >-
      Intracellular growth in respiratory epithelial cells blocks host-cell
      apoptotic signaling.
  - target: IFN-gamma-Induced Aberrant Body Persistence
    description: >-
      Interferon-gamma exposure shifts intracellular C. pneumoniae toward a
      persistent aberrant-body morphology in vitro.
  - target: Atypical Chlamydia pneumoniae Pneumonia
    description: >-
      Intracellular replication in the respiratory tract produces atypical
      pneumonia.
  - target: Requirement for Cell-Penetrant Antimicrobials
    description: >-
      The intracellular inclusion restricts therapy to antimicrobials that reach
      C. pneumoniae inside infected host cells.
  - target: Chlamydial Ribosomal Translation (Macrolide Target)
    description: >-
      The organism depends on its bacterial ribosome, the molecular target of
      macrolides, tetracyclines, and fluoroquinolones.

- name: Respiratory Epithelial Cytadherence and IL-8 Signaling
  role: mechanism
  description: >
    C. pneumoniae attachment to respiratory epithelial cells directly initiates
    proinflammatory signaling, including IL-8 production by lung epithelial
    cells, which can recruit neutrophils into the infected airway.
  cell_types:
  - preferred_term: respiratory epithelial cell
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  biological_processes:
  - preferred_term: positive regulation of interleukin-8 production
    term:
      id: GO:0032757
      label: positive regulation of interleukin-8 production
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: INCREASED
  evidence:
  - reference: PMID:12540537
    reference_title: Induction of proinflammatory cytokines in human lung epithelial cells during Chlamydia pneumoniae infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      heparin treatment of C. pneumoniae significantly reduced its ability to
      induce interleukin 8 (IL-8) and tumor necrosis factor alpha (TNF-alpha) mRNA
      in human lung carcinoma cells, indicating that cytadherence is an important
      early stimulus for induction of proinflammatory mediators
    explanation: >-
      In vitro infection of human lung epithelial cells showing that
      C. pneumoniae cytadherence itself contributes to IL-8/TNF-alpha induction.
  downstream:
  - target: Apoptotic Neutrophil Macrophage Transfer
    description: >-
      IL-8-driven neutrophil recruitment supplies short-lived phagocytes that can
      transfer hidden intracellular organisms to macrophages after apoptosis.
  - target: Atypical Chlamydia pneumoniae Pneumonia
    description: >-
      Epithelial infection and cytokine signaling drive lower-airway
      inflammation and the pneumonia phenotype.

- name: Ciliated Bronchial Epithelial Ciliostasis
  role: mechanism
  description: >
    C. pneumoniae directly arrests ciliary beating in infected bronchial
    epithelium, impairing mucociliary clearance and contributing to respiratory
    pathogenesis.
  cell_types:
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  biological_processes:
  - preferred_term: cilium movement
    term:
      id: GO:0003341
      label: cilium movement
    modifier: DECREASED
  evidence:
  - reference: PMID:7751703
    reference_title: Chlamydia pneumoniae-induced ciliostasis in ciliated bronchial epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      C. pneumoniae, known to cause respiratory infections, had a marked
      ciliastatic effect, completely aborting ciliary motion within 48 h.
    explanation: >-
      Ex vivo infection of ciliated bronchial epithelial cells showing that
      C. pneumoniae can directly halt airway ciliary movement.
  downstream:
  - target: Atypical Chlamydia pneumoniae Pneumonia
    description: >-
      Failed ciliary clearance contributes to respiratory infection pathogenesis.
  - target: Cough
    description: >-
      Impaired mucociliary clearance irritates the infected airway.

- name: Epithelial Apoptosis Resistance
  role: mechanism
  description: >
    Infected epithelial cells with large chlamydial inclusions resist drug- and
    death-receptor-induced apoptosis, preserving the intracellular niche long
    enough for bacterial replication.
  cell_types:
  - preferred_term: respiratory epithelial cell
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  biological_processes:
  - preferred_term: negative regulation of apoptotic process
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:11705971
    reference_title: Epithelial cells infected with Chlamydophila pneumoniae (Chlamydia pneumoniae) are resistant to apoptosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the infected cells, mitochondria did not respond to apoptotic stimuli by
      the release of apoptogenic factors required for the activation of caspases.
      Consequently, active caspase-3 was absent in infected cells.
    explanation: >-
      Shows that C. pneumoniae infection blocks mitochondrial apoptotic signaling
      in epithelial cells.
  downstream:
  - target: Atypical Chlamydia pneumoniae Pneumonia
    description: >-
      Preserved infected epithelial cells sustain the replicative niche during
      lower-airway infection.

- name: Apoptotic Neutrophil Macrophage Transfer
  role: mechanism
  description: >
    C. pneumoniae can hide inside neutrophils that later undergo apoptosis and
    are efferocytosed by macrophages, a transfer route that enhances replication
    compared with direct macrophage infection.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:19547701
    reference_title: Chlamydia pneumoniae hides inside apoptotic neutrophils to silently infect and propagate in macrophages.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      C. pneumoniae infection of macrophages via apoptotic PMN results in
      enhanced replicative activity of chlamydiae when compared to direct
      infection of macrophages, which results in persistence of the pathogen.
    explanation: >-
      Primary-cell transfer experiments showing that infected apoptotic
      neutrophils can deliver C. pneumoniae into macrophages and improve
      intracellular replication.
  downstream:
  - target: Atypical Chlamydia pneumoniae Pneumonia
    description: >-
      Macrophage transfer expands the infected phagocyte compartment in the
      inflamed lung.

- name: IFN-gamma-Induced Aberrant Body Persistence
  role: modifier
  description: >
    Gamma interferon restricts C. pneumoniae replication through
    indoleamine-2,3-dioxygenase activity, producing a persistent state with
    atypical inclusions and aberrant bodies in vitro.
  biological_processes:
  - preferred_term: response to type II interferon
    term:
      id: GO:0034341
      label: response to type II interferon
  evidence:
  - reference: PMID:11705979
    reference_title: Characterization of Chlamydia pneumoniae persistence in HEp-2 cells treated with gamma interferon.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This study demonstrated the effects of gamma interferon (IFN-gamma)-mediated
      indoleamine 2,3-dioxygenase activity on C. pneumoniae persistence in HEp-2
      cells, inclusion morphology, and ultrastructure.
    explanation: >-
      Establishes a C. pneumoniae-specific IFN-gamma/indoleamine-2,3-dioxygenase
      persistence system in vitro.
  downstream: []

- name: Atypical Chlamydia pneumoniae Pneumonia
  role: consequence
  description: >
    Respiratory infection can progress from mild upper-airway disease to an
    atypical community-acquired pneumonia with cough, fever, and pulmonary rales.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:2181028
    reference_title: "A new respiratory tract pathogen: Chlamydia pneumoniae strain TWAR."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chlamydia pneumoniae strain TWAR, the new third species of Chlamydia, is a
      common cause of pneumonia and other acute respiratory tract infections.
    explanation: >-
      Review evidence placing C. pneumoniae among the causes of pneumonia and
      other acute respiratory tract infection.
  downstream:
  - target: Pneumonia
    description: >-
      Lower-airway inflammation manifests clinically as atypical pneumonia.
  - target: Cough
    description: >-
      Bronchial epithelial infection and inflammation irritate the airway.
  - target: Fever
    description: >-
      The inflammatory pneumonia produces systemic fever in a subset of cases.
  - target: Chest Pain
    description: >-
      Pneumonic airway inflammation can present with chest pain in hospitalized
      pediatric cases.
  - target: Eosinophilia
    description: >-
      Hospitalized pediatric cases show higher eosinophil counts than a
      Mycoplasma pneumoniae pneumonia comparator cohort.
  - target: Increased Circulating IgA
    description: >-
      Severe pediatric cases can carry higher serum IgA.

- name: Requirement for Cell-Penetrant Antimicrobials
  role: therapeutic_vulnerability
  conforms_to: "intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials"
  description: >
    C. pneumoniae replicates inside host cells, so effective therapy has to enter
    cells and retain activity against the intracellular organism. Macrolides,
    tetracyclines, and newer fluoroquinolones meet that gating requirement.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:15895932
    reference_title: "[Chlamydia: diagnostic and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment should use an antibiotic with good intracellular bioavailability
      such as tetracycline, macrolides and new generation fluoroquinolones.
    explanation: >-
      Review support that chlamydial therapy has to use agents with good
      intracellular bioavailability.
  downstream: []

- name: Chlamydial Ribosomal Translation (Macrolide Target)
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >
    C. pneumoniae depends on 70S-ribosome translation inside host cells. Macrolides
    such as azithromycin bind the bacterial 50S ribosomal subunit and combine a
    ribosomal molecular target with the cell penetration needed to reach the
    intracellular inclusion.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:15895932
    reference_title: "[Chlamydia: diagnostic and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment should use an antibiotic with good intracellular bioavailability
      such as tetracycline, macrolides and new generation fluoroquinolones.
    explanation: >-
      Review support for choosing intracellularly bioavailable protein-synthesis
      inhibitors or fluoroquinolones against chlamydial infection.
  downstream: []
phenotypes:
- category: Respiratory
  name: Pneumonia
  description: >
    Atypical community-acquired pneumonia is the defining lower-respiratory
    manifestation of this entry.
  phenotype_term:
    preferred_term: Pneumonia
    term:
      id: HP:0002090
      label: Pneumonia
  evidence:
  - reference: PMID:2181028
    reference_title: "A new respiratory tract pathogen: Chlamydia pneumoniae strain TWAR."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chlamydia pneumoniae strain TWAR, the new third species of Chlamydia, is a
      common cause of pneumonia and other acute respiratory tract infections.
    explanation: >-
      Establishes pneumonia as a respiratory disease caused by C. pneumoniae.
- category: Respiratory
  name: Cough
  description: >
    Cough was the predominant symptom in a 291-child retrospective cohort of
    C. pneumoniae pneumonia.
  phenotype_term:
    preferred_term: Cough
    term:
      id: HP:0012735
      label: Cough
  evidence:
  - reference: PMID:41210234
    reference_title: "Epidemiological and clinical analysis of 291 children diagnosed with Chlamydia pneumoniae pneumonia: a 10-year retrospective study in Shijiazhuang, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cough was the predominant clinical manifestation (141 patients, 98.60%),
      followed by fever (44.80% of patients; median peak temperature: 38.20 °C).
    explanation: >-
      In this hospitalized pediatric cohort, cough was the most frequent clinical
      manifestation of C. pneumoniae pneumonia.
- category: Constitutional
  name: Fever
  description: >
    Fever commonly accompanies C. pneumoniae pneumonia, but its frequency varies
    by cohort and setting.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:41210234
    reference_title: "Epidemiological and clinical analysis of 291 children diagnosed with Chlamydia pneumoniae pneumonia: a 10-year retrospective study in Shijiazhuang, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cough was the predominant clinical manifestation (141 patients, 98.60%),
      followed by fever (44.80% of patients; median peak temperature: 38.20 °C).
    explanation: >-
      This 291-child cohort reported fever in 44.80% of C. pneumoniae pneumonia
      admissions.
- category: Respiratory
  name: Chest Pain
  description: >
    Chest pain was more frequent in a hospitalized pediatric CPP cohort than in a
    contemporaneous Mycoplasma pneumoniae pneumonia cohort.
  phenotype_term:
    preferred_term: Chest pain
    term:
      id: HP:0100749
      label: Chest pain
  evidence:
  - reference: PMID:40775274
    reference_title: Comparative analysis of Chlamydia pneumoniae pneumonia (CPP) and Mycoplasma pneumoniae pneumonia in children and risk factors of severe CPP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CPP patients were significantly older than MPP patients (mean age: 10.53 ±
      2.89 vs. 6.68 ± 2.88, p < 0.05) and exhibited longer durations of cough and
      higher rates of chest pain (p < 0.05).
    explanation: >-
      Pediatric comparator evidence that chest pain is enriched among children
      hospitalized with C. pneumoniae pneumonia relative to M. pneumoniae
      pneumonia.
- category: Hematologic
  name: Eosinophilia
  description: >
    Eosinophil counts were higher in hospitalized children with CPP than in a
    Mycoplasma pneumoniae comparator cohort and were proposed as a candidate
    marker of severe pediatric CPP in that retrospective analysis.
  phenotype_term:
    preferred_term: Increased total eosinophil count
    term:
      id: HP:0001880
      label: Increased total eosinophil count
  evidence:
  - reference: PMID:40775274
    reference_title: Comparative analysis of Chlamydia pneumoniae pneumonia (CPP) and Mycoplasma pneumoniae pneumonia in children and risk factors of severe CPP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory findings revealed significantly elevated white blood cell (WBC)
      and eosinophil (EOS) counts in CPP versus MPP (p < 0.05). Severe CPP
      accounted for 6.8% of cases, and binary logistic regression identified
      eosinophil count as a potential biomarker for severe CPP (p < 0.05).
    explanation: >-
      Supports increased eosinophil count as a laboratory finding enriched in CPP
      and potentially associated with severe disease in children.
- category: Laboratory
  name: Increased Circulating IgA
  description: >
    Elevated serum IgA was independently associated with severe CPP in one
    pediatric case-control study and remains an unvalidated severity marker.
  phenotype_term:
    preferred_term: Increased circulating IgA concentration
    term:
      id: HP:0003261
      label: Increased circulating IgA concentration
  evidence:
  - reference: PMID:42327901
    reference_title: "Risk factors for severe Chlamydia pneumoniae pneumonia in children: a retrospective case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multivariate analysis identified decreased lymphocyte percentage (OR =
      0.943, 95% CI 0.895-0.994) and elevated IgA (OR = 2.227, 95% CI
      1.284-3.972) as factors associated with severe CPP.
    explanation: >-
      Supports elevated IgA as an independent laboratory correlate of severe
      pediatric C. pneumoniae pneumonia in a retrospective study.
treatments:
- name: Azithromycin
  description: >
    Macrolide antibiotic used for C. pneumoniae pneumonia because it penetrates
    host cells and arrests bacterial protein synthesis at the 50S ribosomal
    subunit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  target_mechanisms:
  - target: Requirement for Cell-Penetrant Antimicrobials
    treatment_effect: INHIBITS
    description: >-
      Azithromycin accumulates inside host cells, satisfying the cell-penetrant
      drug requirement imposed by an intracellular Chlamydia species.
  - target: Chlamydial Ribosomal Translation (Macrolide Target)
    treatment_effect: INHIBITS
    description: >-
      Azithromycin binds the 50S ribosomal subunit and inhibits intracellular
      chlamydial protein synthesis.
  - target: Droplet Exposure and Obligate Intracellular Infection
    treatment_effect: INHIBITS
    description: >-
      Inhibiting intracellular protein synthesis clears the organism from
      infected respiratory cells.
  evidence:
  - reference: PMID:15895932
    reference_title: "[Chlamydia: diagnostic and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment should use an antibiotic with good intracellular bioavailability
      such as tetracycline, macrolides and new generation fluoroquinolones.
    explanation: >-
      The cell-penetrant-drug requirement for chlamydial infection explains why
      azithromycin, a macrolide, is active while poorly penetrant beta-lactams are
      inappropriate.
notes: >-
  Created as part of the Respiratory Infections project. The entry is deliberately
  species-scoped to Chlamydia pneumoniae; the available MONDO term
  MONDO:0025598 is broader ("pneumonia caused by chlamydia"), so disease_term was
  omitted rather than binding the species entry to a genus-level pneumonia as
  exact.

name: Chlamydia Pneumoniae Pneumonia
creation_date: "2026-09-27T04:25:27Z"
description: >
  Chlamydia pneumoniae pneumonia is an atypical community-acquired pneumonia
  caused by the obligate intracellular bacterium Chlamydia pneumoniae. The
  infection spreads between people, replicates in epithelial cells inside a
  chlamydial inclusion, and requires cell-penetrant ribosome-active therapy such
  as a macrolide rather than a beta-lactam.
category: Infectious Disease
parents:
- Bacterial Respiratory Infection
synonyms:
- Chlamydophila pneumoniae pneumonia
- Chlamydia pneumonia
- TWAR pneumonia
- Chlamydial pneumonia due to Chlamydia pneumoniae
infectious_agent:
- name: Chlamydia pneumoniae
  infectious_agent_term:
    preferred_term: Chlamydia pneumoniae
    term:
      id: NCBITaxon:83558
      label: Chlamydia pneumoniae
  description: >-
    The human-adapted, obligate intracellular Chlamydia species formerly known
    as Chlamydophila pneumoniae and historically called TWAR.
  evidence:
  - reference: PMID:15895932
    reference_title: "[Chlamydia: diagnostic and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chlamydia are obligate intracellular bacteria.
    explanation: >-
      Establishes the genus-level obligate intracellular lifestyle that applies
      to C. pneumoniae.
  - reference: PMID:2181028
    reference_title: "A new respiratory tract pathogen: Chlamydia pneumoniae strain TWAR."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chlamydia pneumoniae strain TWAR, the new third species of Chlamydia, is a
      common cause of pneumonia and other acute respiratory tract infections.
    explanation: >-
      Identifies the TWAR organism as Chlamydia pneumoniae and as a respiratory
      pathogen that causes pneumonia.
transmission:
- name: Person-to-person respiratory spread
  description: >-
    C. pneumoniae spreads between people with a long incubation period,
    producing slow outbreaks and reinfections rather than requiring a bird or
    livestock reservoir.
  evidence:
  - reference: PMID:2181028
    reference_title: "A new respiratory tract pathogen: Chlamydia pneumoniae strain TWAR."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The infection is transmitted from person to person, apparently with a long
      incubation period.
    explanation: >-
      Review evidence supporting the person-to-person spread and long incubation
      period of C. pneumoniae infection.
pathophysiology:
- name: Droplet Exposure and Obligate Intracellular Infection
  role: trigger
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  description: >
    Inhaled C. pneumoniae elementary bodies attach to the respiratory epithelium
    and enter host cells, then replicate within a membrane-bound chlamydial
    inclusion. That intracellular niche is why therapy has to use agents that
    penetrate host cells rather than hydrophilic beta-lactams.
  cell_types:
  - preferred_term: respiratory epithelial cell
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:15895932
    reference_title: "[Chlamydia: diagnostic and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chlamydia are obligate intracellular bacteria.
    explanation: >-
      Supports the intracellular-pathogen conformance for C. pneumoniae.
  downstream:
  - target: Respiratory Epithelial Cytadherence and IL-8 Signaling
    description: >-
      Host-cell adherence initiates the epithelial proinflammatory response.
  - target: Atypical Chlamydia pneumoniae Pneumonia
    description: >-
      Intracellular replication in the respiratory tract produces atypical
      pneumonia.
  - target: Chlamydial Ribosomal Translation (Macrolide Target)
    description: >-
      The organism depends on its bacterial ribosome, the molecular target of
      macrolides, tetracyclines, and fluoroquinolones.

- name: Respiratory Epithelial Cytadherence and IL-8 Signaling
  role: mechanism
  description: >
    C. pneumoniae attachment to respiratory epithelial cells directly initiates
    proinflammatory signaling, including IL-8 production by lung epithelial
    cells, which can recruit neutrophils into the infected airway.
  cell_types:
  - preferred_term: respiratory epithelial cell
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  biological_processes:
  - preferred_term: positive regulation of interleukin-8 production
    term:
      id: GO:0032757
      label: positive regulation of interleukin-8 production
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: INCREASED
  evidence:
  - reference: PMID:12540537
    reference_title: Induction of proinflammatory cytokines in human lung epithelial cells during Chlamydia pneumoniae infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      heparin treatment of C. pneumoniae significantly reduced its ability to
      induce interleukin 8 (IL-8) and tumor necrosis factor alpha (TNF-alpha) mRNA
      in human lung carcinoma cells, indicating that cytadherence is an important
      early stimulus for induction of proinflammatory mediators
    explanation: >-
      In vitro infection of human lung epithelial cells showing that
      C. pneumoniae cytadherence itself contributes to IL-8/TNF-alpha induction.
  downstream:
  - target: Atypical Chlamydia pneumoniae Pneumonia
    description: >-
      Epithelial infection and cytokine signaling drive lower-airway
      inflammation and the pneumonia phenotype.

- name: Atypical Chlamydia pneumoniae Pneumonia
  role: consequence
  description: >
    Respiratory infection can progress from mild upper-airway disease to an
    atypical community-acquired pneumonia with cough, fever, and pulmonary rales.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:2181028
    reference_title: "A new respiratory tract pathogen: Chlamydia pneumoniae strain TWAR."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chlamydia pneumoniae strain TWAR, the new third species of Chlamydia, is a
      common cause of pneumonia and other acute respiratory tract infections.
    explanation: >-
      Review evidence placing C. pneumoniae among the causes of pneumonia and
      other acute respiratory tract infection.
  downstream: []

- name: Chlamydial Ribosomal Translation (Macrolide Target)
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >
    C. pneumoniae depends on 70S-ribosome translation inside host cells. Macrolides
    such as azithromycin bind the bacterial 50S ribosomal subunit and combine a
    ribosomal molecular target with the cell penetration needed to reach the
    intracellular inclusion.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:15895932
    reference_title: "[Chlamydia: diagnostic and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment should use an antibiotic with good intracellular bioavailability
      such as tetracycline, macrolides and new generation fluoroquinolones.
    explanation: >-
      Review support for choosing intracellularly bioavailable protein-synthesis
      inhibitors or fluoroquinolones against chlamydial infection.
  downstream: []
phenotypes:
- category: Respiratory
  name: Pneumonia
  description: >
    Atypical community-acquired pneumonia is the defining lower-respiratory
    manifestation of this entry.
  phenotype_term:
    preferred_term: Pneumonia
    term:
      id: HP:0002090
      label: Pneumonia
  evidence:
  - reference: PMID:2181028
    reference_title: "A new respiratory tract pathogen: Chlamydia pneumoniae strain TWAR."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chlamydia pneumoniae strain TWAR, the new third species of Chlamydia, is a
      common cause of pneumonia and other acute respiratory tract infections.
    explanation: >-
      Establishes pneumonia as a respiratory disease caused by C. pneumoniae.
- category: Respiratory
  name: Cough
  description: >
    Cough was the predominant symptom in a 291-child retrospective cohort of
    C. pneumoniae pneumonia.
  phenotype_term:
    preferred_term: Cough
    term:
      id: HP:0012735
      label: Cough
  evidence:
  - reference: PMID:41210234
    reference_title: "Epidemiological and clinical analysis of 291 children diagnosed with Chlamydia pneumoniae pneumonia: a 10-year retrospective study in Shijiazhuang, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cough was the predominant clinical manifestation (141 patients, 98.60%),
      followed by fever (44.80% of patients; median peak temperature: 38.20 °C).
    explanation: >-
      In this hospitalized pediatric cohort, cough was the most frequent clinical
      manifestation of C. pneumoniae pneumonia.
- category: Constitutional
  name: Fever
  description: >
    Fever commonly accompanies C. pneumoniae pneumonia, but its frequency varies
    by cohort and setting.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:41210234
    reference_title: "Epidemiological and clinical analysis of 291 children diagnosed with Chlamydia pneumoniae pneumonia: a 10-year retrospective study in Shijiazhuang, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cough was the predominant clinical manifestation (141 patients, 98.60%),
      followed by fever (44.80% of patients; median peak temperature: 38.20 °C).
    explanation: >-
      This 291-child cohort reported fever in 44.80% of C. pneumoniae pneumonia
      admissions.
treatments:
- name: Azithromycin
  description: >
    Macrolide antibiotic used for C. pneumoniae pneumonia because it penetrates
    host cells and arrests bacterial protein synthesis at the 50S ribosomal
    subunit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  target_mechanisms:
  - target: Requirement for Cell-Penetrant Antimicrobials
    treatment_effect: INHIBITS
    description: >-
      Azithromycin accumulates inside host cells, satisfying the cell-penetrant
      drug requirement imposed by an intracellular Chlamydia species.
  - target: Chlamydial Ribosomal Translation (Macrolide Target)
    treatment_effect: INHIBITS
    description: >-
      Azithromycin binds the 50S ribosomal subunit and inhibits intracellular
      chlamydial protein synthesis.
  - target: Droplet Exposure and Obligate Intracellular Infection
    treatment_effect: INHIBITS
    description: >-
      Inhibiting intracellular protein synthesis clears the organism from
      infected respiratory cells.
  evidence:
  - reference: PMID:15895932
    reference_title: "[Chlamydia: diagnostic and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment should use an antibiotic with good intracellular bioavailability
      such as tetracycline, macrolides and new generation fluoroquinolones.
    explanation: >-
      The cell-penetrant-drug requirement for chlamydial infection explains why
      azithromycin, a macrolide, is active while poorly penetrant beta-lactams are
      inappropriate.
notes: >-
  Created as part of the Respiratory Infections project. The entry is deliberately
  species-scoped to Chlamydia pneumoniae; the available MONDO term
  MONDO:0025598 is broader ("pneumonia caused by chlamydia"), so disease_term was
  omitted rather than binding the species entry to a genus-level pneumonia as
  exact.

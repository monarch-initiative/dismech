genetic:
- name: F5
  gene_term:
    preferred_term: F5
    term:
      id: hgnc:3542
      label: F5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_beaa3af3-7d91-4d53-b081-de0e660c16c6-2020-03-25T160000.000Z
    evidence:
    - reference: CGGV:assertion_beaa3af3-7d91-4d53-b081-de0e660c16c6-2020-03-25T160000.000Z
      reference_title: "F5 / congenital factor V deficiency (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "| F5 | HGNC:3542 | congenital factor V deficiency | MONDO:0009210 | AR | Definitive | SOP6 | Hemostasis/Thrombosis Gene Curation Expert Panel | 2020-03-25T16:00:00.000Z |"
      explanation: >-
        ClinGen's Hemostasis/Thrombosis GCEP classifies the F5-congenital factor V
        deficiency relationship (autosomal recessive) as Definitive.
  notes: >-
    F5 is on chromosome 1q24 and spans 25 exons. The disorder is genetically
    heterogeneous, with missense variants predominating and the remainder null
    (nonsense, frameshift, splice-site, large deletions distributed across the
    gene); no single founder variant dominates, and routine exon-focused
    sequencing misses an appreciable fraction of alleles (large deletions,
    non-canonical splice variants), so multiplex ligation-dependent probe
    amplification is needed alongside sequencing. Per-gene case fractions are not
    curated because F5 is the sole causative locus.
  evidence:
  - reference: PMID:19486170
    reference_title: "Factor 5 mutation profile in German patients with homozygous and heterozygous factor V deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 42 genetic alterations (of which 33 were uniquely different mutations), comprising 19 missense mutations, eight nonsense mutations, four small deletions and two splice site mutations, were identified by this study."
    explanation: >-
      Documents the mutational spectrum of F5 in a genotyped cohort.
  - reference: PMID:42074284
    reference_title: "Genetic and Clinical Characteristics of Russian Patients with Congenital Factor V Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, 3 of 15 causal variants (20%)—including two large deletions and a non-canonical splice-altering variant—would not have been reliably detected using routine exon-focused sequencing alone."
    explanation: >-
      Supports the note that routine sequencing misses a fraction of F5 alleles,
      which is why MLPA is needed.
biochemical:
- name: Factor V coagulant activity (FV:C)
  biomarker_term:
    preferred_term: factor V coagulant activity
    term:
      id: NCIT:C98726
      label: Factor V Measurement
  loinc_term:
    id: LOINC:3193-0
    label: Coagulation factor V activity actual/normal in Platelet poor plasma by Coagulation assay
  presence: DECREASED
  readouts:
  - target: Reduced Functional Plasma Factor V
    relationship: READOUT_OF
    description: >-
      FV:C measures the functional consequence of the genetic lesion at the level
      of circulating protein activity, and defines the conventional severity
      strata.
  reference_ranges:
  - loinc_term:
      id: LOINC:3193-0
      label: Coagulation factor V activity actual/normal in Platelet poor plasma by Coagulation assay
    unit: "% of normal FV:C"
    population: patients with congenital factor V deficiency
    interpretation_bands:
    - name: Severe deficiency
      upper_bound: 1.0
      unit: "% of normal FV:C"
      abnormal_flag: CRITICAL_LOW
      severity: SEVERE
    - name: Moderate deficiency
      lower_bound: 1.0
      upper_bound: 10.0
      unit: "% of normal FV:C"
      abnormal_flag: LOW
      severity: MODERATE
    - name: Mild deficiency
      lower_bound: 10.0
      unit: "% of normal FV:C"
      abnormal_flag: LOW
      severity: MILD
    notes: >-
      The severity bands are the plasma FV:C strata, stated as a percentage of
      normal. Mild is above 10%, moderate 1-10%, severe below 1%. They grade the
      deficiency; they predict bleeding only weakly (see the knowledge gap on
      activity-severity discordance). LOINC carries no method-less identity
      code for factor V activity, as with the factor VIII and factor IX codes
      Hemophilia_A.yaml and Hemophilia_B.yaml bind: every factor V activity
      code names a method. The one-stage coagulation assay is bound here
      because that is the assay this entry's cited sources describe (FV:C is
      the standard clotting-based coagulant activity assay, not the
      chromogenic alternative).
    evidence:
    - reference: PMID:35593819
      reference_title: "Factor V Deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Mild factor V deficiency is identified by plasma activity greater than 10% of normal. Moderate deficiency shows activity from 1% to 10%, and severe deficiency presents with activity less than 1%."
      explanation: >-
        Source for the three severity bands encoded here.
  evidence:
  - reference: PMID:40421928
    reference_title: "Nationwide Study on Factor V Deficiency in China: Clinical Characteristics, Genotype, and Treatment Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study cohort comprised 45 patients with confirmed FV:C reductions (undetectable to 48%), including six mild (FV:C >10%), 31 moderate (FV:C 1%-10%), and eight severe (FV:C <1%) patients."
    explanation: >-
      Applies the FV:C severity strata to a national cohort, confirming the assay
      is the quantity that grades the disease.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.1
  rate_denominator: POPULATION
  notes: >-
    Reported as approximately 1 in 1,000,000 in the homozygous (severe) form,
    which normalises to 0.1 per 100,000.
  evidence:
  - reference: PMID:19598066
    reference_title: "Factor V deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Congenital factor V (FV) deficiency is a bleeding disorder associated with mild to severe hemorrhagic symptoms and a prevalence in the general population of 1 in 1,000,000 in the homozygous form."
    explanation: >-
      States the worldwide frequency normalised in this record.
  - reference: PMID:39191405
    reference_title: "Clinical, Laboratory, and Molecular Aspects of Factor V Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Congenital FV deficiency is a rare bleeding disorder with an incidence of 1 per million live births, considering the most severe homozygous form."
    explanation: >-
      An independent review statement of the same order-of-magnitude frequency.
diagnosis:
- name: Coagulation screen
  description: >-
    The screening picture that prompts factor-specific assays: prolonged
    prothrombin time and prolonged activated partial thromboplastin time with a
    normal thrombin time, because the defect is in the common pathway and spares
    the fibrinogen-to-fibrin step.
  diagnosis_term:
    preferred_term: coagulation screening blood test
    term:
      id: NCIT:C217390
      label: Diagnostic Blood Testing
  evidence:
  - reference: PMID:35593819
    reference_title: "Factor V Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Initial laboratory evaluation shows prolonged prothrombin time and activated partial thromboplastin time (aPTT) with a normal thrombin time. A low plasma factor V level confirms the diagnosis."
    explanation: >-
      States the screening abnormalities and that a low factor V level confirms
      the diagnosis.
- name: Plasma mixing study
  description: >-
    Distinguishes an inherited factor deficiency from an acquired inhibitor:
    correction of the prolonged PT and aPTT on mixing with normal plasma
    indicates a deficiency, while persistent prolongation indicates an inhibitor.
  diagnosis_term:
    preferred_term: plasma mixing coagulation test
    term:
      id: NCIT:C217390
      label: Diagnostic Blood Testing
  evidence:
  - reference: PMID:35593819
    reference_title: "Factor V Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Improvement of these parameters after mixing suggests an inherited form, with normal plasma replacing the missing factor. Persistent prothrombin time and aPTT prolongation after mixing indicates an acquired form, as an inhibitor in the patient's plasma prevents normalization."
    explanation: >-
      States the interpretation of the mixing study that distinguishes inherited
      from acquired factor V deficiency.
- name: F5 sequencing
  description: >-
    Confirms the diagnosis, establishes the inheritance pattern for counselling,
    and identifies the causative variants. Multiplex ligation-dependent probe
    amplification is needed alongside sequencing because routine exon-focused
    sequencing misses large deletions and some splice variants.
  diagnosis_term:
    preferred_term: F5 genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42074284
    reference_title: "Genetic and Clinical Characteristics of Russian Patients with Congenital Factor V Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiplex ligation-dependent probe amplification (MLPA) was used to detect large deletions and duplications."
    explanation: >-
      Documents the assays used to achieve a complete molecular diagnosis.
differential_diagnoses:
- name: Acquired factor V deficiency
  description: >-
    An autoantibody-mediated factor V deficiency, clinically and by coagulation
    screen resembling the congenital form but of later onset and distinguished by
    a plasma mixing study that fails to correct. It is a different entity, often
    following exposure to bovine thrombin, surgery, malignancy or antibiotics.
  disease_term:
    preferred_term: acquired factor V deficiency
    term:
      id: MONDO:0035737
      label: acquired factor V deficiency
  evidence:
  - reference: PMID:35593819
    reference_title: "Factor V Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Persistent prothrombin time and aPTT prolongation after mixing indicates an acquired form, as an inhibitor in the patient's plasma prevents normalization."
    explanation: >-
      States the mixing-study finding that distinguishes acquired from congenital
      factor V deficiency.
- name: Combined factor V and factor VIII deficiency
  description: >-
    A separate autosomal recessive disorder caused by LMAN1 or MCFD2 defects in
    the ER-to-Golgi cargo receptor that transports both factor V and factor VIII.
    Both factors are mildly to moderately reduced together, which the isolated
    factor assay distinguishes from isolated factor V deficiency.
  disease_term:
    preferred_term: combined deficiency of factor V and factor VIII
    term:
      id: MONDO:0018175
      label: combined deficiency of factor V and factor VIII
  evidence:
  - reference: PMID:19141156
    reference_title: "Factor V deficiency: a concise review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "FV deficiency can be caused by mutations in the FV gene or in genes encoding components of a putative cargo receptor that transports FV (and factor VIII) from the endoplasmic reticulum to the Golgi."
    explanation: >-
      Names the cargo-receptor mechanism that produces combined FV and FVIII
      deficiency, the entity this differential separates out.
treatments:
- name: Fresh frozen plasma
  description: >-
    The mainstay of treatment, because no factor-V-specific concentrate is
    licensed. Plasma supplies intact factor V; dosing targets a haemostatic
    factor V level (commonly above 20 IU/dL), and because the plasma half-life of
    factor V is short, repeated infusions are needed. Virus-inactivated
    (solvent-detergent) plasma is preferred.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Fresh Frozen Plasma Transfusion
    term:
      id: NCIT:C116475
      label: Fresh Frozen Plasma Transfusion
    therapeutic_agent:
    - preferred_term: fresh frozen plasma
  notes: >-
    The therapeutic agent is left unbound: NCIT:C89783 Fresh Frozen Plasma is a
    biospecimen term, not a pharmacologic substance, so it is not a valid
    ChemicalEntityTerm; the transfusion action carries the binding.
  target_mechanisms:
  - target: Reduced Functional Plasma Factor V
    treatment_effect: RESTORES
    description: >-
      Donor plasma supplies functional factor V, restoring the prothrombinase
      cofactor at the node immediately downstream of the genetic lesion.
  evidence:
  - reference: PMID:39191405
    reference_title: "Clinical, Laboratory, and Molecular Aspects of Factor V Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The mainstay of treatment includes fresh-frozen plasma, preferentially virus-inactivated."
    explanation: >-
      States fresh frozen plasma as the mainstay and the preference for
      virus-inactivated product.
  - reference: PMID:39022653
    reference_title: "Rare inherited coagulation disorders: no longer orphan and neglected."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Because of the relatively short plasma half-life of FV (16-36 hours), daily infusions are required to keep FV at hemostatic levels (ie, above 20 IU/dL)"
    explanation: >-
      States the haemostatic target level and why repeated infusions are needed.
- name: Platelet transfusion
  description: >-
    Used when plasma alone is ineffective, exploiting the platelet factor V pool
    that localises to the site of bleeding. Platelet concentrates have been
    combined with plasma for refractory bleeding.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Platelet Transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Residual Platelet Factor V
    treatment_effect: RESTORES
    description: >-
      Transfused platelets deliver factor V/Va that localises at the injury site,
      supplementing the patient's platelet-derived pool.
  evidence:
  - reference: PMID:39022653
    reference_title: "Rare inherited coagulation disorders: no longer orphan and neglected."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "a combination of platelet concentrates and SD-FFP has been used when SD-FFP alone was ineffective"
    explanation: >-
      States the rationale for platelet transfusion and its use when plasma alone
      fails.
- name: Antifibrinolytic therapy
  description: >-
    Tranexamic acid, used for mucosal and minor bleeding and as cover for minor
    procedures. It does not correct the coagulation defect; it protects the clot
    that does form from premature lysis, so it is adjunctive.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Impaired Fibrin Clot Formation
    treatment_effect: MODULATES
    description: >-
      Inhibiting plasminogen activation prolongs survival of the weak clot that
      forms, acting on clot persistence rather than on thrombin generation.
  evidence:
  - reference: PMID:19141156
    reference_title: "Factor V deficiency: a concise review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Antifibrinolytics can also provide benefit, especially for mucosal bleeding."
    explanation: >-
      States the indication for antifibrinolytics in factor V deficiency.
- name: Recombinant activated factor VII
  description: >-
    A bypassing agent used off-label for severe bleeding, for patients with
    factor V inhibitors, or where plasma causes allergy or volume overload. It
    increases thrombin generation at the injury site rather than replacing
    factor V.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant activated factor VII (eptacog alfa)
      term:
        id: NCIT:C81125
        label: Eptacog Alfa
  target_mechanisms:
  - target: Reduced Thrombin Generation
    treatment_effect: BYPASSES
    description: >-
      Pharmacological activated factor VII drives thrombin generation at the site
      of injury, bypassing the factor V cofactor deficit rather than correcting it.
  evidence:
  - reference: PMID:39022653
    reference_title: "Rare inherited coagulation disorders: no longer orphan and neglected."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Off-label recombinant FVIIa (rFVIIa) was successfully used in cases with FV inhibitors (not infrequent) or allergy to FFP or to avoid volume overload"
    explanation: >-
      States the indications for recombinant activated factor VII in factor V
      deficiency.
  - reference: PMID:40788998
    reference_title: "Inhibitor Development in Severe Congenital Factor V Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bleeding control was achieved with recombinant factor VIIa."
    explanation: >-
      A worked case of bleeding controlled with recombinant activated factor VII
      in a patient who had developed a factor V inhibitor.
- name: Liver transplantation
  description: >-
    Definitive cure for the most severe cases, since factor V is synthesised in
    the liver. Reserved for patients with life-threatening bleeding unmanageable
    by plasma; it corrects factor V levels and abolishes the need for infusions.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: Reduced Functional Plasma Factor V
    treatment_effect: RESTORES
    description: >-
      A donor liver synthesises normal factor V, permanently restoring the
      circulating pool.
  evidence:
  - reference: PMID:29250911
    reference_title: "Management of intracranial hemorrhage in severe factor V deficiency and definitive treatment with liver transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He received an orthotopic liver transplant at age 5 months, resulting in correction of his FV levels. He has not required any plasma infusions post-transplantation and has had no further bleeding episodes."
    explanation: >-
      A worked case in which liver transplantation corrected factor V levels and
      cured the bleeding phenotype.
animal_models:
- name: F5 knockout mouse
  species: Mouse
  genotype: Fv-/- (targeted deletion of coagulation factor V)
  publication: PMID:8900278
  description: >-
    The Cui et al. (1996) factor V knockout. About half of homozygous embryos die
    at embryonic day 9-10, possibly from a yolk-sac vascular abnormality; the rest
    reach term but die of massive haemorrhage within two hours of birth. The model
    established the absolute requirement for factor V in prothrombinase activity
    and revealed a developmental role for the coagulation system.
  evidence:
  - reference: PMID:8900278
    reference_title: "Fatal haemorrhage and incomplete block to embryogenesis in mice lacking coagulation factor V."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The remaining Fv-/- mice progress normally to term, but die from massive haemorrhage within 2 hours of birth."
    explanation: >-
      Reports the fatal perinatal bleeding phenotype of complete factor V loss.
  modeled_mechanisms:
  - target: Systemic Bleeding Tendency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Complete absence of factor V produces fatal spontaneous bleeding,
      reproducing the organism-level bleeding tendency.
    limitations: >-
      Total factor V deficiency is embryonic or perinatally lethal in the mouse,
      whereas human disease is a survivable chronic diathesis in which some
      residual factor V (plasma or platelet) is essentially always present. The
      model cannot report the human natural history, genotype-phenotype relation,
      or long-term treatment, and its lethality is why human complete deficiency
      is so rare.
    evidence:
    - reference: PMID:8900278
      reference_title: "Fatal haemorrhage and incomplete block to embryogenesis in mice lacking coagulation factor V."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "approximately half of homozygous embryos deficient in factor V (Fv-/-), which have been generated by gene targeting, die at embryonic day (E) 9-10, possibly as a result of an abnormality in the yolk-sac vasculature."
      explanation: >-
        Reports the embryonic lethality that is the model's key divergence from
        the survivable human disease.
- name: F5 transgene-rescued mouse
  species: Mouse
  genotype: Tg(Malb-Fv);Fv-/- (liver-directed low-level factor V minigene on a null background)
  publication: PMID:10669158
  description: >-
    A factor V minigene expressed at under 0.1% of normal in the liver rescues
    Fv-/- mice through the perinatal period to adulthood without spontaneous
    haemorrhage, demonstrating that minimal factor V expression suffices for
    survival - a plausible explanation for why nearly all human patients retain
    some residual factor V.
  evidence:
  - reference: PMID:10669158
    reference_title: "Rescue of fatal neonatal hemorrhage in factor V deficient mice by low level transgene expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Rescued Tg+,Fv-/- mice have undetectable FV (<0.1%) in both plasma and platelet compartments, but survive the perinatal period and mature to adulthood without spontaneous hemorrhage."
    explanation: >-
      Shows that below-detection factor V rescues survival, the model's central
      finding.
  modeled_mechanisms:
  - target: Systemic Bleeding Tendency
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Minimal liver-directed factor V expression rescues the otherwise fatal
      bleeding of the null mouse, modelling the viability threshold rather than
      the symptomatic human phenotype.
    limitations: >-
      The transgene is expressed from a heterologous promoter at a fixed low
      level, not from the native locus, so it tests a viability threshold rather
      than reproducing any particular human genotype or its bleeding pattern.
    evidence:
    - reference: PMID:10669158
      reference_title: "Rescue of fatal neonatal hemorrhage in factor V deficient mice by low level transgene expression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that FV present at <0.1% is sufficient to support postnatal survival."
      explanation: >-
        States the viability threshold this rescue model establishes.
- name: F5 Thr1898Met knock-in mouse
  species: Mouse
  genotype: F5 Thr1898Met missense knock-in (CRISPR/Cas9 homology-directed repair, homozygous)
  publication: PMID:40455764
  description: >-
    A 2025 CRISPR knock-in carrying a missense variant chosen in silico to give a
    mild phenotype. Homozygotes are viable with no spontaneous bleeding, reduced
    factor V activity (around 24.5%) and prolonged PT and aPTT - the first viable
    pathological mouse model of the disease, usable for testing new therapies.
  evidence:
  - reference: PMID:40455764
    reference_title: "Development of a novel and viable knock-in factor V deficiency murine model: Utility for an ultra-rare disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A viable FV-deficient mouse model was generated by introducing a missense mutation in FV. The model exhibits a mild phenotype of the disease, akin to that observed in humans."
    explanation: >-
      The authors' statement that the knock-in is a viable model with a mild
      human-like phenotype.
  modeled_mechanisms:
  - target: Reduced Functional Plasma Factor V
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      A missense knock-in reproduces the reduced circulating factor V activity and
      the prolonged clotting times of mild human disease in a viable animal.
    limitations: >-
      The model carries one engineered missense allele chosen for mildness, so it
      represents the mild end of the spectrum and does not reproduce severe or
      null-allele disease or its intracranial-haemorrhage risk.
    readouts:
    - name: Plasma factor V activity
      target: Reduced Functional Plasma Factor V
      direction: DECREASED
      interpretation: Reduced factor V activity in homozygous knock-in mice.
      evidence:
      - reference: PMID:40455764
        reference_title: "Development of a novel and viable knock-in factor V deficiency murine model: Utility for an ultra-rare disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "FV levels in homozygous animals were 24.5% ± 5.1"
        explanation: >-
          Quantifies the reduced factor V activity in the knock-in mouse.
- name: fv mutant zebrafish
  species: Zebrafish
  genotype: fv homozygous nonsense mutant (ENU-induced, premature stop in exon 2)
  publication: PMID:38874909
  description: >-
    An ENU-derived factor V nonsense zebrafish line. Homozygous larvae show
    prolonged time to occlusion after venous laser injury and poor survival
    beyond 12 days post-fertilisation; the line phenocopies human parahaemophilia
    and is a tool for drug screening.
  evidence:
  - reference: PMID:38874909
    reference_title: "Characterization of zebrafish coagulation cofactors Fviii and Fv mutants and modeling hemophilia A and factor V deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous and heterozygous 5 days post fertilization (dpf) larvae for fviii and fv deficient mutants exhibited prolonged time to occlusion after venous laser injury compared to wild-type controls."
    explanation: >-
      Reports the haemostatic defect in the factor V mutant zebrafish.
  modeled_mechanisms:

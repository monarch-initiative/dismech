    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Loss of fv delays clot occlusion after vascular injury, reproducing the
      impaired clot formation of the human disease in a screenable vertebrate.
    limitations: >-
      Zebrafish tolerate factor V loss longer than mammals, and the paper reports
      an apparently dominant pattern in the fish, so the inheritance and timing do

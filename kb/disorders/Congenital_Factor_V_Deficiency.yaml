discussions:
- discussion_id: fv_activity_severity_discordance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does plasma factor V activity predict bleeding severity so poorly, and
    can platelet factor V or thrombin generation do better?
  attaches_to:
  - pathophysiology#Systemic Bleeding Tendency
  - pathophysiology#Preserved Platelet-Dependent Thrombin Generation
  rationale: >-
    Patients with undetectable plasma factor V range from mild bleeders to
    neonates with fatal intracranial haemorrhage, and plasma FV:C does not sort
    them. The leading candidate explanations - residual platelet factor V and low
    TFPI sustaining thrombin generation - are supported by case-level work, and
    thrombin generation in platelet-rich plasma may track bleeding better than a
    one-stage plasma assay, but no prospective study has established a platelet or
    thrombin-generation measure as a clinical predictor. This bears directly on
    which laboratory value should set a prophylaxis threshold.
  evidence:
  - reference: PMID:19438479
    reference_title: "Advances in understanding the bleeding diathesis in factor V deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "While the reasons for this variable phenotypic expression are largely unknown, several observations from different laboratories indicate platelets as crucial players in FV deficiency."
    explanation: >-
      States that the reasons for the variable phenotype are largely unknown and
      points to platelets as the leading candidate, which is the gap here.
- discussion_id: fv_no_licensed_concentrate
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can a factor-V-specific replacement therapy be developed and licensed?
  attaches_to:
  - treatments#
  rationale: >-
    Factor V deficiency is the rare bleeding disorder still without a licensed
    factor-specific concentrate, unlike factor X and factor XIII deficiencies.
    Two candidates have reached preclinical or in-vitro stage - a plasma-derived
    factor V concentrate that corrects clotting times and thrombin generation in
    patient plasma, and an engineered activated factor V (superFVa) - but neither
    has completed human trials, so plasma and platelet transfusion remain the only
    options.
  evidence:
  - reference: PMID:41167601
    reference_title: "From Fresh Frozen Plasma to First-in-Human: Bringing Coagulation Factor V Deficiency into Therapeutic Trials."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Congenital factor V (FV) deficiency, affecting approximately 1 in 1 million individuals worldwide, remains among the rare bleeding disorders (RBDs) without a licensed factor-specific replacement therapy."
    explanation: >-
      States the unmet therapeutic need this gap is about.
  - reference: PMID:29578313
    reference_title: "\"In vitro\" correction of the severe factor V deficiency-related coagulopathy by a novel plasma-derived factor V concentrate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The novel plasma-derived FV concentrate was effective to correct \"in vitro\" severe FV deficiency in patients."
    explanation: >-
      A candidate concentrate shown to work in vitro, the preclinical state of
      the art this gap tracks.

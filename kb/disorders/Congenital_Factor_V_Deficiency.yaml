notes: >-
  Scope: this entry covers congenital (inherited) factor V deficiency only.
  Acquired factor V deficiency and combined factor V and factor VIII deficiency
  are different entities and appear only as differential diagnoses. Type I
  (CRM-negative) and type II (CRM-positive) are not curated as separate diseases
  because they converge on the same prothrombinase cofactor defect; the two
  patterns are illustrated instead on the Reduced Functional Plasma Factor V node
  (a type I null allele and a type II missense variant). The deep-research report
  under research/ was used only as a lead list; every claim here was verified
  against primary PubMed sources fetched into references_cache/.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Symptomatic disease requires two defective F5 alleles, homozygous or compound
    heterozygous. Heterozygous carriers have approximately half-normal factor V
    levels and are usually asymptomatic.
  evidence:
  - reference: PMID:19598066
    reference_title: "Factor V deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with FV deficiency and clinically significant manifestations (mainly involving mucosal tracts) show very low or unmeasurable plasma FV levels and are usually homozygous or compound heterozygous for mutations located in the FV gene ( F5)."
    explanation: >-
      States the biallelic requirement for symptomatic disease. Graded OTHER with
      quote_role REVIEW_SYNTHESIS because the source is a narrative review.
  - reference: PMID:19598066
    reference_title: "Factor V deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Heterozygous carriers have approximately half-normal levels of FV and are usually asymptomatic."
    explanation: >-
      States the asymptomatic carrier state recorded in this block's description.
pathophysiology:
- name: Biallelic F5 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous variants in F5 on chromosome 1q24.
    Missense substitutions predominate; the reported spectrum also includes
    nonsense, frameshift, splice-site and large-deletion alleles, with more than
    two thirds of the published severe-deficiency alleles being null mutations
    that reduce factor V expression.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: hepatocyte, the principal site of factor V synthesis
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:
  - target: Reduced Functional Plasma Factor V
    description: >-
      The variant protein is either not made, not secreted, or secreted in a form
      that cannot act as a prothrombinase cofactor.
  evidence:
  - reference: PMID:19598066
    reference_title: "Factor V deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A total of 56 mutations have been published to date as being responsible for severe or moderately severe FV deficiency; more than two thirds of these are null mutations (mainly decreasing FV expression), with the remaining being missense mutations (usually impairing FV secretion)."
    explanation: >-
      Describes the mutational spectrum and the predominance of null alleles that
      reduce factor V expression.
  - reference: PMID:9576178
    reference_title: "Severe coagulation factor V deficiency caused by a 4 bp deletion in the factor V gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of the 5'- and 3'-untranslated, coding and adjacent regions of the factor V gene revealed the presence of a 4 bp deletion in exon 13."
    explanation: >-
      A worked homozygous null allele, the first reported F5 mutation causing a
      type I quantitative deficiency.
- name: Reduced Functional Plasma Factor V
  biological_scale: MOLECULAR
  description: >-
    The functional deficit measured in plasma as factor V coagulant activity
    (FV:C). In type I disease the immunoreactive antigen falls with it; in type II
    a dysfunctional molecule is still present at near-normal antigen. Residual
    activity grades the deficiency into mild, moderate and severe strata but
    predicts bleeding only weakly.
  molecular_functions:
  - preferred_term: factor V cofactor available for prothrombinase assembly
    modifier: DECREASED
    term:
      id: GO:0008047
      label: enzyme activator activity
  downstream:
  - target: Impaired Prothrombinase Cofactor Function
    description: >-
      Less circulating functional factor V means less factor Va available to
      serve as the prothrombinase cofactor.
  evidence:
  - reference: PMID:9576178
    reference_title: "Severe coagulation factor V deficiency caused by a 4 bp deletion in the factor V gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have studied a young girl with very mild bleeding symptoms and undetectable levels of plasma factor V antigen and activity (<0.3% and <1.6% of normal, respectively)."
    explanation: >-
      Documents concordantly reduced factor V activity and antigen (a type I
      pattern) in a genetically confirmed patient.
  - reference: PMID:24787990
    reference_title: "Functional characterization of a novel missense mutation, His147Arg, in A1 domain of FV protein causing type II deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The His147Arg mutation was associated with normal antigen levels, both in cell lysates and conditioned media, whereas FV activity was significantly reduced to 63.5 ± 17.0%."
    explanation: >-
      A type II pattern - preserved antigen against reduced activity - shown by
      expression study, the structural counterpart of the type I case above.
- name: Impaired Prothrombinase Cofactor Function
  biological_scale: MOLECULAR
  description: >-
    The non-redundant step. Activated factor V (factor Va) is the non-enzymatic
    cofactor of the prothrombinase complex, assembling with factor Xa on an
    anionic phospholipid surface and accelerating prothrombin cleavage far beyond
    what factor Xa achieves alone. Because both the extrinsic and intrinsic arms
    of the cascade converge on this common-pathway step, neither can compensate
    for the defect.
  biological_processes:
  - preferred_term: blood coagulation, common pathway
    modifier: DECREASED
    term:
      id: GO:0072377
      label: blood coagulation, common pathway
  cell_types:
  - preferred_term: activated platelet supplying the anionic phospholipid surface
    term:
      id: CL:0000233
      label: platelet
  downstream:
  - target: Reduced Thrombin Generation
    description: >-
      Less functional prothrombinase converts less prothrombin to thrombin.
  evidence:
  - reference: PMID:35593819
    reference_title: "Factor V Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Either thrombin or factor Xa converts factor V to the plasma cofactor of the prothrombinase complex. This complex, composed of calcium, phospholipids, factor Va, and factor Xa, is essential for converting prothrombin to thrombin."
    explanation: >-
      States the composition of prothrombinase and the cofactor role of factor Va
      that this node depends on.
- name: Reduced Thrombin Generation
  biological_scale: MOLECULAR
  description: >-
    The functional common denominator of the disease. Thrombin is needed both to
    cleave fibrinogen to fibrin and to amplify its own generation through feedback
    activation of factors V, VIII and XI, so a prothrombinase deficit propagates
    rather than being buffered.
  biological_processes:
  - preferred_term: blood coagulation
    modifier: DECREASED
    term:
      id: GO:0007596
      label: blood coagulation
  downstream:
  - target: Impaired Fibrin Clot Formation
    description: >-
      Insufficient thrombin to convert fibrinogen to fibrin at the rate a
      haemostatic plug requires.
  evidence:
  - reference: PMID:18695002
    reference_title: "Low plasma levels of tissue factor pathway inhibitor in patients with congenital factor V deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thrombin generation in FV-deficient plasma was only measurable at high tissue factor concentrations"
    explanation: >-
      Documents the reduced thrombin generation of factor-V-deficient plasma that
      this node asserts.
- name: Impaired Fibrin Clot Formation
  biological_scale: TISSUE
  description: >-
    Failure to form a stable fibrin network at sites of vascular injury. This is
    the step the routine coagulation screen measures, and it is why both the
    prothrombin time and the activated partial thromboplastin time are prolonged
    while the thrombin time, which tests the fibrinogen-to-fibrin step directly,
    remains normal.
  biological_processes:
  - preferred_term: blood coagulation, fibrin clot formation
    modifier: DECREASED
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
  downstream:
  - target: Systemic Bleeding Tendency
    description: >-
      A slowly formed or unstable clot fails to secure haemostasis, producing
      spontaneous and provoked bleeding.
  - target: Prolonged prothrombin time
  - target: Prolonged partial thromboplastin time
  evidence:
  - reference: PMID:35593819
    reference_title: "Factor V Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Initial laboratory evaluation shows prolonged prothrombin time and activated partial thromboplastin time (aPTT) with a normal thrombin time."
    explanation: >-
      States the simultaneous prolongation of both screening tests with a normal
      thrombin time that a common-pathway defect predicts.
- name: Systemic Bleeding Tendency
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint. Bleeding is predominantly mucocutaneous but can be
    intracranial in the most severely affected. Severity broadly tracks residual
    factor V activity, but the correlation is imperfect and this entry does not
    overstate it.
  downstream:
  - target: Epistaxis
  - target: Gingival bleeding
  - target: Bruising susceptibility
  - target: Subcutaneous hemorrhage
  - target: Menorrhagia
  - target: Prolonged bleeding after surgery
  - target: Prolonged bleeding after dental extraction
  - target: Joint hemorrhage
  - target: Intramuscular hematoma
  - target: Gastrointestinal hemorrhage
  - target: Abnormal umbilical stump bleeding
  - target: Intracranial hemorrhage
    description: >-
      The most feared complication, concentrated in neonates and infants with
      the lowest factor V levels.
  - target: Post-partum hemorrhage
  evidence:
  - reference: PMID:42074284
    reference_title: "Genetic and Clinical Characteristics of Russian Patients with Congenital Factor V Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, congenital FV deficiency most commonly presents with epistaxis, easy bruising, hematomas, and menorrhagia. Severe manifestations, such as gastrointestinal bleeding, hematuria, hemarthrosis, or central nervous system hemorrhage, are relatively uncommon"
    explanation: >-
      Enumerates the common and the severe bleeding manifestations wired to this
      node.
  - reference: PMID:9886321
    reference_title: "Symptoms of inherited factor V deficiency in 35 Iranian patients."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severity of bleeding symptoms was only partially related to the degree of factor V deficiency in plasma."
    explanation: >-
      Records the limit on the severity claim. Marked INDIRECT because it
      constrains how strongly residual activity predicts bleeding rather than
      asserting the bleeding tendency itself.
- name: Residual Platelet Factor V
  biological_scale: CELLULAR
  description: >-
    About a fifth to a quarter of the body's factor V is stored in platelet
    alpha-granules, acquired by megakaryocyte endocytosis of plasma factor V
    rather than synthesised in the platelet. In patients with undetectable plasma
    factor V, a measurable platelet-derived factor V/Va pool can persist and be
    released locally at a wound, where it is the predominant cofactor for
    thrombin generation at the platelet surface. This pool, not any residual
    plasma factor V, is the leading explanation for the mild phenotype of many
    severely deficient patients.
  cell_types:
  - preferred_term: platelet storing factor V in alpha-granules
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: megakaryocyte endocytosing plasma factor V
    term:
      id: CL:0000556
      label: megakaryocyte
  cellular_components:
  - preferred_term: platelet alpha granule, the factor V store
    term:
      id: GO:0031091
      label: platelet alpha granule
  downstream:
  - target: Preserved Platelet-Dependent Thrombin Generation
    description: >-
      Locally released platelet factor V/Va supports thrombin generation at the
      platelet surface despite absent plasma factor V.
  evidence:
  - reference: PMID:25896652
    reference_title: "Platelets and platelet-derived factor Va confer hemostatic competence in complete factor V deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "release of the patient's platelet-derived FV/Va (7% of normal) following platelet activation resulted in robust thrombin generation, similar to that in an individual with normal plasma- and platelet-derived FV concentrations"
    explanation: >-
      Shows that platelet-derived factor V/Va alone supports near-normal thrombin
      generation in an individual with no detectable plasma factor V.
  - reference: PMID:19861681
    reference_title: "Residual platelet factor V ensures thrombin generation in patients with severe congenital factor V deficiency and mild bleeding symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with undetectable plasma FV may contain functional FV in their platelets. In combination with low TFPI level, residual platelet FV allows sufficient thrombin generation to rescue these patients from fatal bleeding."
    explanation: >-
      States the protective role of residual platelet factor V, together with low
      TFPI, in patients with undetectable plasma factor V.
- name: Low Plasma Tissue Factor Pathway Inhibitor
  biological_scale: MOLECULAR
  description: >-
    Factor-V-deficient plasma carries physiologically low levels of tissue factor
    pathway inhibitor, possibly because factor V affects TFPI stability or
    clearance in vivo. The reduced TFPI lowers the factor V threshold needed for
    minimal thrombin generation and so works alongside residual platelet factor V
    to protect deficient patients from severe bleeding.
  genes:
  - preferred_term: TFPI
    term:
      id: hgnc:11760
      label: TFPI
  molecular_functions:
  - preferred_term: tissue factor pathway inhibitor serine protease inhibitor activity
    modifier: DECREASED
    term:
      id: GO:0004867
      label: serine-type endopeptidase inhibitor activity
  downstream:
  - target: Preserved Platelet-Dependent Thrombin Generation
    description: >-
      Lower TFPI lifts the inhibitory brake on the initiating tissue-factor
      complex, reducing the factor V requirement for thrombin generation.
  evidence:
  - reference: PMID:18695002
    reference_title: "Low plasma levels of tissue factor pathway inhibitor in patients with congenital factor V deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma TFPI antigen and activity levels were indeed lower (P < .001) in FV-deficient patients (n = 11; 4.0 +/- 1.0 ng/mL free TFPI) than in controls (n = 20; 11.5 +/- 4.8 ng/mL)"
    explanation: >-
      Quantifies the reduced TFPI in factor-V-deficient patients.
  - reference: PMID:18695002
    reference_title: "Low plasma levels of tissue factor pathway inhibitor in patients with congenital factor V deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low TFPI levels decreased the FV requirement for minimal thrombin generation in FV-deficient plasma to less than 1% and might therefore protect FV-deficient patients from severe bleeding."
    explanation: >-
      States how low TFPI lowers the factor V threshold for thrombin generation,
      which is the protective edge asserted here.
- name: Preserved Platelet-Dependent Thrombin Generation
  biological_scale: CELLULAR
  description: >-
    The convergence of residual platelet factor V and low TFPI: enough thrombin
    is generated at the activated platelet surface to secure a minimally
    haemostatic clot even when plasma factor V is undetectable. This is the
    mechanistic reason bleeding severity is discordant with plasma FV:C, and it
    is why a patient can be protected whose plasma assay reads zero.
  cell_types:
  - preferred_term: activated platelet surface where thrombin is generated
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet-surface thrombin generation
    term:
      id: GO:0007596
      label: blood coagulation
  evidence:
  - reference: PMID:25896652
    reference_title: "Platelets and platelet-derived factor Va confer hemostatic competence in complete factor V deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "resulted in robust thrombin generation, similar to that in an individual with normal plasma- and platelet-derived FV concentrations"
    explanation: >-
      Direct support: in an individual with no detectable plasma factor V,
      platelet-derived factor V/Va sustains near-normal thrombin generation.
  - reference: PMID:21320286
    reference_title: "Homozygous F5 deep-intronic splicing mutation resulting in severe factor V deficiency and undetectable thrombin generation in platelet-rich plasma."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggest that thrombin generation in PRP may predict bleeding tendency in patients with undetectable plasma FV"
    explanation: >-
      The mirror-image case: a severely affected patient whose platelet-rich
      plasma generates no thrombin. Marked INDIRECT because it supports the node
      through the negative/predictive direction rather than demonstrating
      preserved generation itself.

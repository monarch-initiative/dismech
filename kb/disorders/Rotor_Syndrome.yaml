      diagnosis, reassuring the patient, and avoiding unnecessary invasive and
      costly diagnostic procedures.
    explanation: >-
      States the clinical purpose of diagnosis in a disorder needing no
      treatment. Evidence source is HUMAN_CLINICAL because this is the
      conclusion of a patient case report.
  - reference: PMID:35860851
    reference_title: "Benign inheritable disorders of bilirubin metabolism manifested by conjugated hyperbilirubinemia-A narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although classically viewed as benign conditions requiring no treatment,
      they lately gained an increased interest since recent studies suggested
      that mutations in the responsible genes leading to hyperbilirubinemia, as
      well as minor genetic variants, may result in an increased susceptibility
      to drug toxicity.
    explanation: >-
      Qualifies the no-treatment position with a
      suggested, unestablished drug-toxicity susceptibility. Evidence source is
      OTHER because this is a narrative review.
- name: Pharmacotherapy Monitoring for OATP1B1/1B3 Substrate Drug Toxicity
  description: >-
    Because complete absence of OATP1B1 and OATP1B3 impairs hepatic uptake of
    numerous anionic drugs and their metabolites, patients should be carefully
    monitored for drug-induced toxicity when prescribed OATP1B1/1B3 substrate
    medications such as statins (HMG-CoA reductase inhibitors), anticancer
    agents, antiepileptics, and antibiotics.
  action_category: MONITORING
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Combined OATP1B1 and OATP1B3 Deficiency
    treatment_effect: MODULATES
    description: >-
      Compensates for the loss of OATP1B1/1B3-mediated hepatic drug uptake by
      monitoring for elevated systemic exposure and toxicity of substrate drugs.
    evidence:

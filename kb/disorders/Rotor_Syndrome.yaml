    reference_title: "Gene replacement therapy for genetic hepatocellular jaundice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients with Rotor syndrome, bilirubin (re)uptake is impaired due to
      the deficiency of two basolateral/sinusoidal hepatocellular membrane
      proteins, organic anion-transporting polypeptide 1B1 (OATP1B1) and
      OATP1B3.
    explanation: >-
      States the two deficient transporters, their membrane localisation, and
      the transport step lost - the defining claim of this node. Evidence source
      is OTHER because this is a review.
  - reference: PMID:35860851
    reference_title: "Benign inheritable disorders of bilirubin metabolism manifested by conjugated hyperbilirubinemia-A narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rotor syndrome (caused by the simultaneous presence of mutations in
      SLCO1B1 and SLCO1B3 genes)
    explanation: >-
      Establishes that simultaneous lesions in both genes are required, the
      genetic feature that separates Rotor syndrome from the single-gene
      hereditary hyperbilirubinaemias. Evidence source is OTHER because this is
      a narrative review.
  - reference: PMID:36157610
    reference_title: "Rotor Syndrome Presenting as Dubin-Johnson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional extended molecular analysis of genes implicated in bilirubin
      metabolism found a homozygous deletion of a region encompassing exons 4-16
      of SLCO1B3 gene (encoding OATP1B3) and all SLCO1B1 exons (encoding
      OATP1B1), thereby establishing Rotor syndrome diagnosis.
    explanation: >-
      A genetically confirmed human example showing that a single deletion
      spanning both adjacent loci produces the required double deficiency.
      Evidence source is HUMAN_CLINICAL because this is a patient case report
      with molecular analysis.
  downstream:
  - target: Failure of Hepatic Bilirubin Conjugate Reuptake and Storage
    causal_link_type: DIRECT
    description: >-
      Without OATP1B1 and OATP1B3 the hepatocyte cannot recapture bilirubin
      conjugates from sinusoidal blood.
  - target: Porphyrinuria
    causal_link_type: DIRECT
    description: >-
      Loss of OATP1B1/1B3-mediated hepatic porphyrin uptake increases urinary
      coproporphyrin excretion.
    evidence:
    - reference: PMID:35860851
      reference_title: "Benign inheritable disorders of bilirubin metabolism manifested by conjugated hyperbilirubinemia-A narrative review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The OATP1B1/3 abnormality also explains other diagnostic traits of RS:
        decrease plasma clearance of anionic diagnostic dyes such as BSP (also a
        substrate of these proteins), reduced visualization of the liver by
        anionic cholescintigraphic radiotracers such as 99mTc‐HIDA, as well as
        increased urinary coproporphyrin excretion (resulting from the
        interaction of several porphyrins with OATP1B1).
      explanation: >-
        Directly attributes increased urinary coproporphyrin excretion in Rotor
        syndrome to loss of OATP1B1/1B3-mediated hepatic porphyrin uptake.

- name: Failure of Hepatic Bilirubin Conjugate Reuptake and Storage
  description: >-
    Even under physiological conditions a fraction of newly formed bilirubin
    conjugates is secreted across the sinusoidal membrane into blood by MRP3 and
    then recaptured by OATP1B1 and OATP1B3 for re-excretion into bile. Rotor
    syndrome breaks that recapture limb, so conjugates that leave the hepatocyte
    are not retrieved and accumulate in plasma. Conjugation and canalicular
    export are intact, which is why the liver is not pigmented and why the
    disorder is mechanistically distinct from Dubin-Johnson syndrome despite an
    almost identical biochemical presentation.
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "bilirubin_conjugation_transport#Hyperbilirubinaemia"
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:

name: Rotor Syndrome
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
description: >-
  A benign, non-progressive autosomal recessive disorder of bilirubin transport
  caused by the simultaneous loss of both sinusoidal organic anion uptake
  transporters OATP1B1 (SLCO1B1) and OATP1B3 (SLCO1B3). Because the two
  transporters are functionally redundant, Rotor syndrome requires biallelic
  loss of both genes - most often through a single deletion spanning the
  adjacent SLCO1B1 and SLCO1B3 loci - which distinguishes it genetically from
  every other hereditary hyperbilirubinaemia. Loss of hepatic reuptake of the
  bilirubin conjugates that normally re-enter the hepatocyte from sinusoidal
  blood produces chronic, predominantly conjugated hyperbilirubinaemia with
  normal liver tests, no haemolysis, and, unlike Dubin-Johnson syndrome, a
  normally coloured liver. It requires no treatment. The clinical importance is
  twofold: making the diagnosis prevents an escalating and invasive workup for
  more serious liver disease, and OATP1B1/1B3 are major hepatic uptake
  transporters for many drugs, so their complete absence is expected to alter
  drug disposition.
disease_term:
  preferred_term: Rotor syndrome
  term:
    id: MONDO:0009379
    label: Rotor syndrome
parents:
- Liver Disease
- Inherited Metabolic Disorder
pathophysiology:
- name: Combined OATP1B1 and OATP1B3 Deficiency
  description: >-
    Complete loss of both sinusoidal organic anion transporting polypeptides
    OATP1B1 (encoded by SLCO1B1) and OATP1B3 (encoded by SLCO1B3) abolishes
    hepatocellular reuptake of organic anions, including the bilirubin
    conjugates that normally re-enter the hepatocyte from sinusoidal blood after
    MRP3-mediated basolateral efflux. Both transporters must be lost: they are
    functionally redundant, so a lesion in either alone is insufficient. The
    genes are adjacent on chromosome 12, and a single homozygous deletion
    spanning both loci has been reported as a cause.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "bilirubin_conjugation_transport#Conjugated Bilirubin Transport Failure"
  genes:
  - preferred_term: SLCO1B1
    term:
      id: hgnc:10959
      label: SLCO1B1
  - preferred_term: SLCO1B3
    term:
      id: hgnc:10961
      label: SLCO1B3
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: bilirubin transport
    term:
      id: GO:0015723
      label: bilirubin transport
    modifier: DECREASED
  evidence:
  - reference: PMID:25315738
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients with Rotor syndrome, bilirubin (re)uptake is impaired due to
      the deficiency of two basolateral/sinusoidal hepatocellular membrane
      proteins, organic anion-transporting polypeptide 1B1 (OATP1B1) and
      OATP1B3.
    explanation: >-
      States the two deficient transporters, their membrane localisation, and
      the transport step lost - the defining claim of this node. Evidence source
      is OTHER because this is a review.
  - reference: PMID:35860851
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rotor syndrome (caused by the simultaneous presence of mutations in
      SLCO1B1 and SLCO1B3 genes)
    explanation: >-
      Establishes that simultaneous lesions in both genes are required, the
      genetic feature that separates Rotor syndrome from the single-gene
      hereditary hyperbilirubinaemias. Evidence source is OTHER because this is
      a narrative review.
  - reference: PMID:36157610
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional extended molecular analysis of genes implicated in bilirubin
      metabolism found a homozygous deletion of a region encompassing exons 4-16
      of SLCO1B3 gene (encoding OATP1B3) and all SLCO1B1 exons (encoding
      OATP1B1), thereby establishing Rotor syndrome diagnosis.
    explanation: >-
      A genetically confirmed human example showing that a single deletion
      spanning both adjacent loci produces the required double deficiency.
      Evidence source is HUMAN_CLINICAL because this is a patient case report
      with molecular analysis.
  downstream:
  - target: Failure of Hepatic Bilirubin Conjugate Reuptake and Storage
    causal_link_type: DIRECT
    description: >-
      Without OATP1B1 and OATP1B3 the hepatocyte cannot recapture bilirubin
      conjugates from sinusoidal blood.

- name: Failure of Hepatic Bilirubin Conjugate Reuptake and Storage
  description: >-
    Even under physiological conditions a fraction of newly formed bilirubin
    conjugates is secreted across the sinusoidal membrane into blood by MRP3 and
    then recaptured by OATP1B1 and OATP1B3 for re-excretion into bile. Rotor
    syndrome breaks that recapture limb, so conjugates that leave the hepatocyte
    are not retrieved and accumulate in plasma. Conjugation and canalicular
    export are intact, which is why the liver is not pigmented and why the
    disorder is mechanistically distinct from Dubin-Johnson syndrome despite an
    almost identical biochemical presentation.
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "bilirubin_conjugation_transport#Hyperbilirubinaemia"
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: bilirubin transport
    term:
      id: GO:0015723
      label: bilirubin transport
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:36157610
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rotor and Dubin-Johnson syndromes are rare autosomal recessive liver
      diseases characterized by chronic conjugated hyperbilirubinemia, caused by
      the absence of the hepatic function OATP1B1/B3 (leading to impaired
      hepatic bilirubin reuptake and storage) and MRP2 transporters (leading to
      impaired hepatic bilirubin excretion), respectively.
    explanation: >-
      States precisely the mechanism of this node - impaired hepatic reuptake
      and storage - and contrasts it with the excretion defect of Dubin-Johnson
      syndrome. Evidence source is OTHER because this sentence states the
      general mechanism of the two disorders rather than the reported patient's
      own findings.
  - reference: PMID:24459177
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Human MRP3 is the only basolateral efflux pump shown to transport
      bilirubin glucuronides.
    explanation: >-
      Identifies the efflux limb whose conjugates the OATP transporters normally
      recapture, completing the sinusoidal cycle this node interrupts. Evidence
      source is OTHER because this is a review of hepatobiliary transport.
  - reference: PMID:25315738
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both disorders are benign and not progressive and are characterised by
      elevated serum levels of mainly conjugated bilirubin.
    explanation: >-
      Records the biochemical outcome of this node and its benign,
      non-progressive course - the guardrail against curating Rotor syndrome as
      a progressive liver disease. Evidence source is OTHER because this is a
      review.
phenotypes:
- category: Clinical
  name: Intermittent Jaundice
  description: >-
    Mild, intermittent icterus, often with no other symptoms and no stigmata of
    chronic liver disease. Notably there is no pruritus, which is what separates
    this from cholestasis at the bedside.
  phenotype_term:
    preferred_term: Jaundice
    term:
      id: HP:0000952
      label: Jaundice
    temporality: RECURRENT
  evidence:
  - reference: PMID:36157610
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 42-year-old man with no relevant past medical history presented with
      intermittent mild icterus and no signs of chronic liver disease.
    explanation: >-
      Documents the presenting phenotype in a genetically confirmed patient,
      including the absence of chronic liver disease signs. Evidence source is
      HUMAN_CLINICAL because this is a case report.
- category: Laboratory
  name: Conjugated Hyperbilirubinaemia
  description: >-
    Chronic predominantly conjugated hyperbilirubinaemia with bilirubinuria, in
    the presence of normal transaminases, alkaline phosphatase, GGT, albumin,
    and prothrombin time, and no haemolysis.
  phenotype_term:
    preferred_term: Conjugated hyperbilirubinemia
    term:
      id: HP:0002908
      label: Conjugated hyperbilirubinemia
    temporality: CHRONIC
  evidence:
  - reference: PMID:36157610
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory tests were notable for hyperbilirubinemia (total 7.97 mg/dL,
      direct 5.37 mg/dL), bilirubinuria, no signs of hemolysis, normal liver
      tests and lipids profile.
    explanation: >-
      Quantifies the biochemical phenotype and documents the normal liver tests
      and absent haemolysis that define it as an isolated transport defect.
      Evidence source is HUMAN_CLINICAL because this is a patient case report.
biochemical:
- name: Conjugated Bilirubin
  presence: INCREASED
  context: >-
    Predominantly conjugated (direct) hyperbilirubinaemia with bilirubinuria.
    One genetically confirmed patient presented with total bilirubin 7.97 mg/dL
    and direct 5.37 mg/dL alongside entirely normal AST, ALT, GGT, alkaline
    phosphatase, albumin, and prothrombin time.
  biomarker_term:
    preferred_term: conjugated bilirubin
    term:
      id: CHEBI:16990
      label: bilirubin IXalpha
  readouts:
  - target: Failure of Hepatic Bilirubin Conjugate Reuptake and Storage
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A raised direct bilirubin fraction with wholly normal liver biochemistry
      and no haemolysis reports an isolated defect of bilirubin conjugate
      handling rather than hepatocellular injury or biliary obstruction.
    evidence:
    - reference: PMID:36157610
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Laboratory tests were notable for hyperbilirubinemia (total 7.97 mg/dL,
        direct 5.37 mg/dL), bilirubinuria, no signs of hemolysis, normal liver
        tests and lipids profile.
      explanation: >-
        Provides the measured readout in a confirmed case. Evidence source is
        HUMAN_CLINICAL because this is a patient case report.
- name: Urinary Coproporphyrin
  presence: INCREASED
  context: >-
    Classically, total urinary coproporphyrin excretion is increased two- to
    five-fold in Rotor syndrome with isomer I usually below 75-80% of the total
    - the pattern that historically distinguished it from Dubin-Johnson
    syndrome, where total excretion is normal but isomer I exceeds 80%. This
    discriminator is not reliable in individual patients: a genetically
    confirmed Rotor case has been reported with normal total coproporphyrin and
    86% isomer I, a profile that reads as Dubin-Johnson syndrome. Molecular
    testing, not coproporphyrin analysis, establishes the diagnosis.
  readouts:
  - target: Combined OATP1B1 and OATP1B3 Deficiency
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Altered coproporphyrin handling reports loss of OATP-dependent organic
      anion uptake, but the isomer pattern overlaps with Dubin-Johnson syndrome
      often enough that it cannot stand alone.
    evidence:
    - reference: PMID:36157610
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Contrary to DJS, in RS, total coproporphyrin excretion in urine is
        increased and isomer I is usually <75-80%, in line with the interaction
        of several porphyrins with OATP1B1
      explanation: >-
        States the classical Rotor coproporphyrin signature and links it
        mechanistically to OATP1B1. Evidence source is OTHER because this
        sentence reports the general rule from the literature rather than the
        case patient's own measurement.
    - reference: PMID:36157610
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Total urinary coproporphyrin was normal with predominance of isomer I
        (86% of total urinary coproporphyrin output).
      explanation: >-
        Marked PARTIAL because it refutes the reliability of this readout in
        individual patients: these values are the Dubin-Johnson pattern, yet the
        patient had genetically confirmed Rotor syndrome. Evidence source is
        HUMAN_CLINICAL because this is a measurement in a reported patient.
genetic:
- name: SLCO1B1
  notes: >-
    Encodes OATP1B1. Rotor syndrome requires loss of this transporter together
    with OATP1B3; loss of SLCO1B1 alone does not cause the disorder because the
    two transporters are functionally redundant. A reported homozygous deletion
    removed all SLCO1B1 exons together with exons 4-16 of the adjacent SLCO1B3.
  gene_term:
    preferred_term: SLCO1B1
    term:
      id: hgnc:10959
      label: SLCO1B1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:35860851
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rotor syndrome (caused by the simultaneous presence of mutations in
      SLCO1B1 and SLCO1B3 genes)
    explanation: >-
      Establishes SLCO1B1 as one of the two genes that must both be affected.
      Evidence source is OTHER because this is a narrative review.
- name: SLCO1B3
  notes: >-
    Encodes OATP1B3, adjacent to SLCO1B1 on chromosome 12. Must be lost together
    with SLCO1B1 for the Rotor phenotype to appear.
  gene_term:
    preferred_term: SLCO1B3
    term:
      id: hgnc:10961
      label: SLCO1B3
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:36157610
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional extended molecular analysis of genes implicated in bilirubin
      metabolism found a homozygous deletion of a region encompassing exons 4-16
      of SLCO1B3 gene (encoding OATP1B3) and all SLCO1B1 exons (encoding
      OATP1B1), thereby establishing Rotor syndrome diagnosis.
    explanation: >-
      Documents a specific causal lesion affecting both genes in a confirmed
      patient. Evidence source is HUMAN_CLINICAL because this is a case report
      with molecular analysis.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Rotor syndrome is transmitted in an autosomal recessive manner. Because two
    functionally redundant transporters must both be lost, the practical
    requirement is biallelic inactivation of SLCO1B1 and SLCO1B3 together -
    frequently satisfied by a homozygous deletion spanning both adjacent loci.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:36157610
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rotor and Dubin-Johnson syndromes are rare autosomal recessive liver
      diseases characterized by chronic conjugated hyperbilirubinemia
    explanation: >-
      States the mode of inheritance. Evidence source is OTHER because this
      sentence states the general property of the two disorders rather than a
      pedigree finding in the reported patient.
- name: Digenic inheritance
  description: >-
    Rotor syndrome is formally DIGENIC: pathogenic variants are required in both
    SLCO1B1 and SLCO1B3, because the OATP1B1 and OATP1B3 transporters they
    encode are functionally redundant and loss of either alone is silent. It
    resembles monogenic autosomal recessive inheritance in practice only because
    the two genes are adjacent on chromosome 12 and so are unlikely to segregate
    independently - a homozygous deletion commonly removes both. This makes
    Rotor syndrome one of the clearest examples of digenic inheritance among the
    hereditary hyperbilirubinaemias, and distinguishes it from Dubin-Johnson
    syndrome, whose conjugated hyperbilirubinaemia arises from a single gene.
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  evidence:
  - reference: PMID:23236639
    reference_title: Rotor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rotor syndrome is inherited in an autosomal recessive digenic manner that
      clinically resembles monogenic autosomal recessive inheritance.
    explanation: >-
      GeneReviews states the digenic mode explicitly and explains why it
      presents as though monogenic. Evidence source is HUMAN_CLINICAL because
      GeneReviews chapters synthesise clinical and molecular findings in
      affected individuals.
  - reference: PMID:23236639
    reference_title: Rotor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (Although Rotor syndrome is a digenic disorder, pathogenic variants in
      SLCO1B1 and SLCO1B3 are unlikely to segregate independently.
    explanation: >-
      Gives the reason the digenic disorder behaves as a monogenic recessive one
      in pedigrees - the two loci are adjacent and co-segregate. Evidence source
      is HUMAN_CLINICAL because this is GeneReviews genetic counselling
      guidance derived from affected families.
treatments:
- name: Diagnosis and Reassurance
  description: >-
    No treatment is required. As with Dubin-Johnson syndrome, the benefit of
    establishing the diagnosis is to reassure the patient and stop an
    escalating, invasive, and costly workup for more serious liver disease. The
    unresolved question is drug handling: OATP1B1 and OATP1B3 are major hepatic
    uptake transporters, and their complete absence is expected to change the
    disposition of their substrate drugs, though no specific prescribing
    guidance follows from the current evidence.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36157610
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With this case, we aim to highlight the necessity of establishing a
      diagnosis, reassuring the patient, and avoiding unnecessary invasive and
      costly diagnostic procedures.
    explanation: >-
      States the clinical purpose of diagnosis in a disorder needing no
      treatment. Evidence source is HUMAN_CLINICAL because this is the
      conclusion of a patient case report.
  - reference: PMID:35860851
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Although classically viewed as benign conditions requiring no treatment,
      they lately gained an increased interest since recent studies suggested
      that mutations in the responsible genes leading to hyperbilirubinemia, as
      well as minor genetic variants, may result in an increased susceptibility
      to drug toxicity.
    explanation: >-
      Marked PARTIAL because it qualifies the no-treatment position with a
      suggested, unestablished drug-toxicity susceptibility. Evidence source is
      OTHER because this is a narrative review.
discussions:
- discussion_id: rotor_coproporphyrin_discriminator_unreliable
  kind: KNOWLEDGE_GAP
  prompt: >-
    How reliably does urinary coproporphyrin isomer analysis distinguish Rotor
    syndrome from Dubin-Johnson syndrome in individual patients?
  attaches_to:
  - "pathophysiology#Combined OATP1B1 and OATP1B3 Deficiency"
  rationale: >-
    The textbook rule - increased total coproporphyrin with isomer I below
    75-80% in Rotor syndrome, normal total with isomer I above 80% in
    Dubin-Johnson syndrome - has been contradicted by a genetically confirmed
    Rotor patient whose profile matched the Dubin-Johnson pattern exactly. The
    reported explanation invokes a coincidental heterozygous ABCC2 variant
    modulating porphyrin excretion, which if generally true would mean the
    discriminator is sensitive to common variation in a third gene. No study
    quantifies the test's performance against molecular diagnosis. Curators
    should not treat the coproporphyrin pattern as diagnostic.
  proposed_experiments:
  - experiment_id: coproporphyrin_vs_molecular_diagnosis_cohort
    name: Coproporphyrin pattern versus molecular diagnosis in a genotyped cohort
    description: >-
      Measuring urinary coproporphyrin total and isomer fractions in a cohort of
      patients with molecularly confirmed Rotor or Dubin-Johnson syndrome, and
      reporting sensitivity and specificity against genotype, would establish
      whether the classical discriminator has any residual diagnostic value.


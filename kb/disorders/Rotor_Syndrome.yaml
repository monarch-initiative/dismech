      OATP1B3.
    explanation: >-
      States the two deficient transporters, their membrane localisation, and
      the transport step lost - the defining claim of this node. Evidence source
      is OTHER because this is a review.
  - reference: PMID:35860851
    reference_title: "Benign inheritable disorders of bilirubin metabolism manifested by conjugated hyperbilirubinemia-A narrative review."
    supports: SUPPORT

inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Rotor syndrome is transmitted in an autosomal recessive manner. Because two
    functionally redundant transporters must both be lost, the practical
    requirement is biallelic inactivation of SLCO1B1 and SLCO1B3 together -
    frequently satisfied by a homozygous deletion spanning both adjacent loci.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:36157610
    reference_title: "Rotor Syndrome Presenting as Dubin-Johnson Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rotor and Dubin-Johnson syndromes are rare autosomal recessive liver
      diseases characterized by chronic conjugated hyperbilirubinemia
    explanation: >-
      States the mode of inheritance. Evidence source is OTHER because this
      sentence states the general property of the two disorders rather than a
      pedigree finding in the reported patient.
- name: Digenic inheritance
  description: >-
    Rotor syndrome is formally DIGENIC: pathogenic variants are required in both
    SLCO1B1 and SLCO1B3, because the OATP1B1 and OATP1B3 transporters they
    encode are functionally redundant and loss of either alone is silent. It
    resembles monogenic autosomal recessive inheritance in practice only because
    the two genes are adjacent on chromosome 12 and so are unlikely to segregate
    independently - a homozygous deletion commonly removes both. This makes
    Rotor syndrome one of the clearest examples of digenic inheritance among the
    hereditary hyperbilirubinaemias, and distinguishes it from Dubin-Johnson
    syndrome, whose conjugated hyperbilirubinaemia arises from a single gene.
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  evidence:
  - reference: PMID:23236639
    reference_title: Rotor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rotor syndrome is inherited in an autosomal recessive digenic manner that
      clinically resembles monogenic autosomal recessive inheritance.
    explanation: >-
      GeneReviews states the digenic mode explicitly and explains why it
      presents as though monogenic. Evidence source is HUMAN_CLINICAL because
      GeneReviews chapters synthesise clinical and molecular findings in
      affected individuals.
  - reference: PMID:23236639
    reference_title: Rotor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (Although Rotor syndrome is a digenic disorder, pathogenic variants in
      SLCO1B1 and SLCO1B3 are unlikely to segregate independently.
    explanation: >-
      Gives the reason the digenic disorder behaves as a monogenic recessive one
      in pedigrees - the two loci are adjacent and co-segregate. Evidence source
      is HUMAN_CLINICAL because this is GeneReviews genetic counselling
      guidance derived from affected families.

pathophysiology:
- name: Combined OATP1B1 and OATP1B3 Deficiency
  description: >-
    Complete loss of both sinusoidal organic anion transporting polypeptides
    OATP1B1 (encoded by SLCO1B1) and OATP1B3 (encoded by SLCO1B3) abolishes
    hepatocellular reuptake of organic anions, including the bilirubin
    conjugates that normally re-enter the hepatocyte from sinusoidal blood after
    MRP3-mediated basolateral efflux. Both transporters must be lost: they are
    functionally redundant, so a lesion in either alone is insufficient. The
    genes are adjacent on chromosome 12, and a single homozygous deletion
    spanning both loci has been reported as a cause.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "bilirubin_conjugation_transport#Conjugated Bilirubin Transport Failure"

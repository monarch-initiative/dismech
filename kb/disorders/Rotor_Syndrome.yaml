    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:36157610
    reference_title: "Rotor Syndrome Presenting as Dubin-Johnson Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rotor and Dubin-Johnson syndromes are rare autosomal recessive liver
      diseases characterized by chronic conjugated hyperbilirubinemia, caused by
      the absence of the hepatic function OATP1B1/B3 (leading to impaired
      hepatic bilirubin reuptake and storage) and MRP2 transporters (leading to
      impaired hepatic bilirubin excretion), respectively.
    explanation: >-
      States precisely the mechanism of this node - impaired hepatic reuptake
      and storage - and contrasts it with the excretion defect of Dubin-Johnson
      syndrome. Evidence source is OTHER because this sentence states the
      general mechanism of the two disorders rather than the reported patient's
      own findings.
  - reference: PMID:24459177
    reference_title: "The roles of MRP2, MRP3, OATP1B1, and OATP1B3 in conjugated hyperbilirubinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Human MRP3 is the only basolateral efflux pump shown to transport
      bilirubin glucuronides.
    explanation: >-
      Identifies the efflux limb whose conjugates the OATP transporters normally
      recapture, completing the sinusoidal cycle this node interrupts. Evidence
      source is OTHER because this is a review of hepatobiliary transport.
  - reference: PMID:25315738
    reference_title: "Gene replacement therapy for genetic hepatocellular jaundice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both disorders are benign and not progressive and are characterised by
      elevated serum levels of mainly conjugated bilirubin.
    explanation: >-
      Records the biochemical outcome of this node and its benign,
      non-progressive course - the guardrail against curating Rotor syndrome as
      a progressive liver disease. Evidence source is OTHER because this is a
      review.
  downstream:
  - target: Conjugated Hyperbilirubinaemia
    causal_link_type: DIRECT
    description: >-
      Failure of sinusoidal OATP1B1/1B3-mediated reuptake causes bilirubin
      glucuronides secreted via MRP3 to accumulate in plasma.
    evidence:
    - reference: PMID:35860851
      reference_title: "Benign inheritable disorders of bilirubin metabolism manifested by conjugated hyperbilirubinemia-A narrative review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In RS, this reuptake is hampered, causing increased plasma bilirubin
        glucuronide levels and jaundice.
      explanation: >-
        Links hampered sinusoidal reuptake of bilirubin glucuronides directly to
        elevated plasma conjugated bilirubin levels.

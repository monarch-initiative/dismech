- name: Urinary Coproporphyrin
  presence: INCREASED
  context: >-
    Classically, total urinary coproporphyrin excretion is increased two- to
    five-fold in Rotor syndrome with isomer I usually below 75-80% of the total
    - the pattern that historically distinguished it from Dubin-Johnson
    syndrome, where total excretion is normal but isomer I exceeds 80%. This
    discriminator is not reliable in individual patients: a genetically
    confirmed Rotor case has been reported with normal total coproporphyrin and
    86% isomer I, a profile that reads as Dubin-Johnson syndrome. Molecular
    testing, not coproporphyrin analysis, establishes the diagnosis.

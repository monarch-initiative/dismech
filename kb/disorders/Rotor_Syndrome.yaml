    isolated, predominantly conjugated hyperbilirubinaemia and absence of
    cholestatic liver injury, evaluating hepatocellular uptake of anionic
    cholescintigraphic radiotracers such as 99mTc-HIDA.
  results: >-
    Typical Rotor syndrome pattern with markedly reduced or absent
    visualization of the liver by anionic cholescintigraphic radiotracers
    (99mTc-HIDA) due to impaired OATP1B1/1B3-mediated hepatic uptake.
  evidence:
  - reference: PMID:23236639
    reference_title: Rotor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Rotor syndrome is established in a proband with
      isolated, predominantly conjugated hyperbilirubinemia without cholestatic
      liver injury and typical findings on cholescintigraphy.
    explanation: >-
      GeneReviews establishes typical findings on cholescintigraphy in a
      proband with isolated predominantly conjugated hyperbilirubinemia as the
      primary clinical route to diagnosis.
  - reference: PMID:35860851
    reference_title: "Benign inheritable disorders of bilirubin metabolism manifested by conjugated hyperbilirubinemia-A narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The OATP1B1/3 abnormality also explains other diagnostic traits of RS:
      decrease plasma clearance of anionic diagnostic dyes such as BSP (also a
      substrate of these proteins), reduced visualization of the liver by
      anionic cholescintigraphic radiotracers such as 99mTc‐HIDA, as well as
      increased urinary coproporphyrin excretion (resulting from the interaction
      of several porphyrins with OATP1B1).
    explanation: >-
      Specifies reduced liver visualization with 99mTc-HIDA cholescintigraphy as
      a characteristic diagnostic finding of OATP1B1/1B3 deficiency.
- name: Molecular Genetic Testing of SLCO1B1 and SLCO1B3
  presence: Positive
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Molecular genetic testing identifying biallelic pathogenic variants or a
    contiguous deletion affecting both SLCO1B1 and SLCO1B3 confirms the
    diagnosis when cholescintigraphy is unavailable or not recommended, or when
    urinary coproporphyrin isomer results overlap with Dubin-Johnson syndrome.
  results: >-
    Biallelic pathogenic variants or homozygous deletion encompassing both
    SLCO1B1 and SLCO1B3.
  evidence:
  - reference: PMID:23236639
    reference_title: Rotor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of biallelic pathogenic variants in SLCO1B1 and SLCO1B3 on
      molecular genetic testing can confirm the diagnosis when cholescintigraphy
      is either not available or not recommended due to risks associated with
      the procedure.
    explanation: >-
      Establishes molecular genetic testing of SLCO1B1 and SLCO1B3 as a
      confirmatory diagnostic route when cholescintigraphy is unavailable or
      not recommended.
  - reference: PMID:36157610
    reference_title: "Rotor Syndrome Presenting as Dubin-Johnson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional extended molecular analysis of genes implicated in bilirubin
      metabolism found a homozygous deletion of a region encompassing exons 4-16
      of SLCO1B3 gene (encoding OATP1B3) and all SLCO1B1 exons (encoding
      OATP1B1), thereby establishing Rotor syndrome diagnosis.
    explanation: >-
      Demonstrates molecular genetic diagnosis of Rotor syndrome in a patient
      whose urinary coproporphyrin isomer profile mimicked Dubin-Johnson
      syndrome.
- name: Urinary Coproporphyrin Excretion Analysis
  presence: Positive
  diagnosis_term:
    preferred_term: Urine Chemistry Measurement
    term:
      id: NCIT:C61044
      label: Urine Chemistry Measurement
  description: >-
    Quantification of total urinary coproporphyrin excretion and isomer I/III
    fractions aids in differentiating Rotor syndrome from Dubin-Johnson
    syndrome, although overlap in individual cases means it cannot stand alone
    without cholescintigraphy or molecular confirmation.
  results: >-
    Total urinary coproporphyrin excretion typically increased 2.5- to 5-fold,
    with coproporphyrin isomer I reported as typically <65% of total
    (occasionally >80%) in PMID:35860851 and usually <75-80% in PMID:36157610.
  evidence:
  - reference: PMID:35860851
    reference_title: "Benign inheritable disorders of bilirubin metabolism manifested by conjugated hyperbilirubinemia-A narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In RS, the total urinary coproporphyrins are increased 2.5 to 5‐fold, and
      the ratio of isomer I to isomer III is high, but usually lower than in DJS
      and similar to other hepatobiliary diseases, typically <65% (though
      occasionally >80%).
    explanation: >-
      Gives the typical 2.5- to 5-fold elevation in total urinary
      coproporphyrins and the <65% (occasionally >80%) isomer I proportion.
  - reference: PMID:35860851
    reference_title: "Benign inheritable disorders of bilirubin metabolism manifested by conjugated hyperbilirubinemia-A narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The OATP1B1/3 abnormality also explains other diagnostic traits of RS:
      decrease plasma clearance of anionic diagnostic dyes such as BSP (also a
      substrate of these proteins), reduced visualization of the liver by
      anionic cholescintigraphic radiotracers such as 99mTc‐HIDA, as well as
      increased urinary coproporphyrin excretion (resulting from the interaction
      of several porphyrins with OATP1B1).
    explanation: >-
      Summarizes the diagnostic laboratory and imaging traits of Rotor syndrome
      resulting from OATP1B1/1B3 deficiency.
treatments:
- name: Diagnosis and Reassurance
  description: >-
    No specific treatment is required. As with Dubin-Johnson syndrome, the
    primary clinical value of establishing the diagnosis is to reassure the
    patient of its benign, non-progressive course and prevent an escalating,
    invasive, and costly workup for cholestatic or hepatocellular liver disease.
    Although no adverse drug effects have been documented in individuals with
    Rotor syndrome per GeneReviews, complete absence of OATP1B1 and OATP1B3 is
    expected to impair hepatic uptake and alter systemic exposure of substrate
    medications (such as HMG-CoA reductase inhibitors/statins, anticancer
    agents, antiepileptics, and antibiotics), warranting prescriber caution and
    clinical monitoring when these agents are used.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:23236639
    reference_title: Rotor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of manifestations: No treatment required."
    explanation: >-
      GeneReviews management summary stating that Rotor syndrome requires no
      active medical treatment.
  - reference: PMID:36157610
    reference_title: "Rotor Syndrome Presenting as Dubin-Johnson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With this case, we aim to highlight the necessity of establishing a
      diagnosis, reassuring the patient, and avoiding unnecessary invasive and
      costly diagnostic procedures.
    explanation: >-
      States the clinical purpose of diagnosis in a disorder needing no
      treatment. Evidence source is HUMAN_CLINICAL because this is the
      conclusion of a patient case report.
  - reference: PMID:23236639
    reference_title: Rotor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although no adverse drug effects have been documented in persons with
      Rotor syndrome, the absence of the hepatic proteins SLCO1B1 and SLCO1B3
      may have serious consequences for liver uptake – and thus for the toxicity
      of numerous commonly used drugs and/or their metabolites.
    explanation: >-
      GeneReviews precaution noting that while no adverse drug reactions have
      been documented in Rotor syndrome, loss of OATP1B1/1B3 hepatic uptake
      creates a theoretical risk of substrate drug toxicity.
  - reference: PMID:35860851
    reference_title: "Benign inheritable disorders of bilirubin metabolism manifested by conjugated hyperbilirubinemia-A narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with DJS and RS present an altered hepatobiliary metabolism that
      predispose them to drug toxicity. As such, physicians should careful
      monitor these patients when prescribing anticancer, antiepileptic,
      antibiotics and statis, as enumerated in Tables 2 and 3.
    explanation: >-
      Narrative review recommending clinical caution and monitoring when
      prescribing OATP1B1/1B3 substrate drugs (statins, anticancer agents,
      antiepileptics, antibiotics).
discussions:
- discussion_id: rotor_coproporphyrin_discriminator_unreliable
  kind: KNOWLEDGE_GAP
  prompt: >-
    How reliably does urinary coproporphyrin isomer analysis distinguish Rotor
    syndrome from Dubin-Johnson syndrome in individual patients?
  attaches_to:
  - "pathophysiology#Combined OATP1B1 and OATP1B3 Deficiency"
  rationale: >-
    The textbook rule - increased total coproporphyrin with isomer I below
    75-80% in Rotor syndrome, normal total with isomer I above 80% in
    Dubin-Johnson syndrome - has been contradicted by a genetically confirmed
    Rotor patient whose profile matched the Dubin-Johnson pattern exactly. The
    reported explanation invokes a coincidental heterozygous ABCC2 variant
    modulating porphyrin excretion, which if generally true would mean the
    discriminator is sensitive to common variation in a third gene. No study
    quantifies the test's performance against molecular diagnosis. Curators
    should not treat the coproporphyrin pattern as diagnostic.
  proposed_experiments:
  - experiment_id: coproporphyrin_vs_molecular_diagnosis_cohort
    name: Coproporphyrin pattern versus molecular diagnosis in a genotyped cohort
    description: >-
      Measuring urinary coproporphyrin total and isomer fractions in a cohort of
      patients with molecularly confirmed Rotor or Dubin-Johnson syndrome, and
      reporting sensitivity and specificity against genotype, would establish
      whether the classical discriminator has any residual diagnostic value.


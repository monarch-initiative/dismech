      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Contrary to DJS, in RS, total coproporphyrin excretion in urine is
        increased and isomer I is usually <75–80%, in line with the interaction
        of several porphyrins with OATP1B1
      explanation: >-
        States the classical Rotor coproporphyrin signature and links it
        mechanistically to OATP1B1. Evidence source is OTHER because this
        sentence reports the general rule from the literature rather than the
        case patient's own measurement.
    - reference: PMID:36157610
      reference_title: "Rotor Syndrome Presenting as Dubin-Johnson Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Total urinary coproporphyrin was normal with predominance of isomer I
        (86% of total urinary coproporphyrin output).
      explanation: >-
        Refutes the reliability of this readout in
        individual patients: these values are the Dubin-Johnson pattern, yet the
        patient had genetically confirmed Rotor syndrome. Evidence source is
        HUMAN_CLINICAL because this is a measurement in a reported patient.

name: Rotor Syndrome
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
description: >-
  A benign, non-progressive autosomal recessive disorder of bilirubin transport
  caused by the simultaneous loss of both sinusoidal organic anion uptake
  transporters OATP1B1 (SLCO1B1) and OATP1B3 (SLCO1B3). Because the two
  transporters are functionally redundant, Rotor syndrome requires biallelic
  loss of both genes - most often through a single deletion spanning the
  adjacent SLCO1B1 and SLCO1B3 loci - which distinguishes it genetically from
  every other hereditary hyperbilirubinaemia. Loss of hepatic reuptake of the
  bilirubin conjugates that normally re-enter the hepatocyte from sinusoidal
  blood produces chronic, predominantly conjugated hyperbilirubinaemia with
  normal liver tests, no haemolysis, and, unlike Dubin-Johnson syndrome, a
  normally coloured liver. It requires no treatment. The clinical importance is
  twofold: making the diagnosis prevents an escalating and invasive workup for
  more serious liver disease, and OATP1B1/1B3 are major hepatic uptake
  transporters for many drugs, so their complete absence is expected to alter
  drug disposition.

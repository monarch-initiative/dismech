treatments:
- name: Diagnosis and Reassurance
  description: >-
    No treatment is required. As with Dubin-Johnson syndrome, the benefit of
    establishing the diagnosis is to reassure the patient and stop an
    escalating, invasive, and costly workup for more serious liver disease. The
    unresolved question is drug handling: OATP1B1 and OATP1B3 are major hepatic
    uptake transporters, and their complete absence is expected to change the
    disposition of their substrate drugs, though no specific prescribing
    guidance follows from the current evidence.

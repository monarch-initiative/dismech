    snippet: >-
      We now report that mutations in the gene encoding pericentrin
      (PCNT)--resulting in the loss of pericentrin from the centrosome, where it
      has key functions anchoring both structural and regulatory
      proteins--also cause Seckel syndrome.
    explanation: >-

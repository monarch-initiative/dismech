      substudy cohort.
  - reference: PMID:20358609
    reference_title: >-
      Majewski osteodysplastic primordial dwarfism type II (MOPD II): expanding
      the vascular phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on previous studies, a neurovascular screening program was
      implemented and 13 (52%) of these patients have been found to have cerebral
      neurovascular abnormalities including moyamoya angiopathy and/or
      intracranial aneurysms.
    explanation: >-
      Independent registry cohort documenting the prevalence of moyamoya and
      intracranial aneurysm on systematic screening.

- name: Insulin Resistance and Diabetes
  description: >-
    Severe insulin resistance and early-onset diabetes are common in PCNT
    deficiency but are not congenital — they emerge during childhood and
    adolescence. Pericentrin knockdown in adipocytes does not impair proximal
    insulin signaling but does impair insulin-stimulated glucose uptake in
    proportion to a defect in cell proliferation and adipogenesis, suggesting
    partial failure of adipocyte differentiation rather than a receptor-proximal
    signaling lesion.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:21270239
    reference_title: >-
      Genetic defects in human pericentrin are associated with severe insulin
      resistance and diabetes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 21 patients with genetic defects in PCNT, 18 had insulin resistance,
      which was severe in the majority of subjects.
    explanation: >-
      Quantifies the prevalence and severity of insulin resistance in a
      PCNT-deficient cohort.
  - reference: PMID:21270239
    reference_title: >-
      Genetic defects in human pericentrin are associated with severe insulin
      resistance and diabetes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Knockdown of pericentrin in adipocytes had no effect on proximal insulin
      signaling but produced a twofold impairment in insulin-stimulated glucose
      uptake, approximately commensurate with an associated defect in cell
      proliferation and adipogenesis.
    explanation: >-
      Adipocyte knockdown data link the metabolic phenotype to the same
      proliferation/differentiation defect rather than to proximal insulin
      signaling.
phenotypes:
- category: Growth
  name: Severe Pre- and Postnatal Growth Restriction
  description: >-
    Severe intrauterine growth retardation followed by severe postnatal growth
    failure. Adult stature averages approximately 100 cm. Short stature becomes
    progressively disproportionate through childhood because of shortening of
    the distal and middle limb segments.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Intrauterine growth retardation
    term:
      id: HP:0001511
      label: Intrauterine growth retardation
  evidence:
  - reference: PMID:15368497
    reference_title: >-
      Majewski osteodysplastic primordial dwarfism type II (MOPD II): natural
      history and clinical findings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The remarkable features of MOPD II are: severe intrauterine growth
      retardation (IUGR), severe postnatal growth retardation; relatively
      proportionate head size at birth which progresses to true and
      disproportionate microcephaly; progressive disproportion of the short
      stature secondary to shortening of the distal and middle segments of the
      limbs
    explanation: >-
      Natural-history series of 58 affected individuals documenting the growth
      phenotype.

differential_diagnoses:
- name: Microcephalic Osteodysplastic Primordial Dwarfism Type I
  description: >-
    The other numbered MOPD entity, and the most important nomenclature-driven
    confusion. Despite the shared name, MOPD I is a mechanistically unrelated
    disorder caused by biallelic variants in RNU4ATAC (minor spliceosome), not
    PCNT (centrosome). MOPD I is distinguished by profound intellectual
    disability, structural brain malformation, sparse hair and dry skin, and
    death typically in infancy — none of which are typical of MOPD II.
  disease_term:
    preferred_term: microcephalic osteodysplastic primordial dwarfism type I
    term:
      id: MONDO:0008871
      label: microcephalic osteodysplastic primordial dwarfism type I
  distinguishing_features:
  - MOPD II has near-normal intelligence; MOPD I has profound intellectual disability
  - MOPD II has no primary structural brain malformation; MOPD I has lissencephaly, corpus callosum and cerebellar vermis anomalies
  - MOPD II permits survival into adulthood; MOPD I is historically lethal in infancy
  - MOPD II has a distinctive later-onset vasculopathy, dental, and metabolic phenotype not seen in MOPD I
  - Causal gene differs (PCNT vs RNU4ATAC), as does the cellular mechanism (centrosome vs minor spliceosome)
  evidence:
  - reference: PMID:21979914
    reference_title: Mechanisms and pathways of growth failure in primordial dwarfism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      mRNA splicing (U4atac), and centrosome function (CEP152, PCNT, and CPAP)
    explanation: >-
      Places U4atac (MOPD I) and PCNT (MOPD II) in distinct mechanistic classes
      within the same clinical group, which is the basis for curating them as
      separate entries.
- name: Seckel Syndrome
  description: >-
    Also a microcephalic primordial dwarfism, and historically the label applied
    to many individuals later shown to have PCNT variants. Distinguished from
    MOPD II by less severe growth retardation, different radiographic skeletal
    findings, and more frequent intellectual disability.
  disease_term:
    preferred_term: Seckel syndrome
    term:
      id: MONDO:0019342
      label: Seckel syndrome
  distinguishing_features:
  - MOPD II shows more severe growth retardation than Seckel syndrome
  - MOPD II has characteristic radiological skeletal abnormalities
  - Intellectual disability is absent or mild in MOPD II but more frequent in Seckel syndrome
  evidence:
  - reference: PMID:19643772
    reference_title: >-
      Molecular analysis of pericentrin gene (PCNT) in a series of 24
      Seckel/microcephalic osteodysplastic primordial dwarfism type II (MOPD II)
      families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MOPD II is distinct from SCKL by more severe growth retardation,
      radiological abnormalities, and absent or mild mental retardation.
    explanation: >-
      States the clinical discriminators between MOPD II and Seckel syndrome.
discussions:
- discussion_id: mopd2_vasculopathy_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the cell-biological link between pericentrin loss at the centrosome
    and the MOPD II vasculopathy (moyamoya, intracranial aneurysm, premature
    coronary artery disease)?
  attaches_to:
  - "pathophysiology#Global Vasculopathy"
  rationale: >-
    The vasculopathy is the leading cause of death in MOPD II but is not
    straightforwardly explained by the progenitor-proliferation deficit that
    accounts for the growth and microcephaly phenotype. It is curated here as a
    parallel arm downstream of the cellular lesion, with the intervening
    mechanism left explicitly unspecified rather than asserted. A
    smooth-muscle-cell-autonomous account involving HSF1-driven HMGCR
    upregulation and ER stress has been proposed in the recent literature, but
    no citable abstract could be verified against a cached reference during this
    curation session, so it is not asserted here.
  proposed_experiments:
  - experiment_id: mopd2_smc_pcnt_vascular_challenge
    name: Smooth-muscle-restricted PCNT loss-of-function vascular challenge
    description: >-
      Smooth-muscle-cell-restricted Pcnt loss-of-function models with vascular
      challenge, paired with human MOPD II vessel-wall transcriptomics, to test
      whether the vasculopathy is smooth-muscle-cell-autonomous and whether it
      proceeds through a phenotypic-switching program independent of serum lipid
      levels.
- discussion_id: mopd2_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do constitutive Pcnt-null mouse models reproduce the severe microcephaly and
    primordial dwarfism seen in humans with biallelic PCNT loss of function, and
    if not, does the discrepancy reflect a species difference in progenitor
    biology rather than a flaw in the centrosome-dysfunction model?
  attaches_to:
  - "pathophysiology#Reduced Progenitor Proliferation and Global Cell Number Deficit"
  rationale: >-
    The centrosome-dysfunction account of MOPD II rests largely on human
    patient-cell data (disorganized spindles, chromosome missegregation,
    defective ATR-dependent checkpoint signaling). Rodent models of microcephaly
    genes generally understate the human phenotype, plausibly because the
    lissencephalic mouse cortex has a much smaller outer subventricular zone and
    basal progenitor compartment than the gyrencephalic human cortex, so a
    progenitor-proliferation defect has less to act on. Until this is resolved,
    the translational validity of mouse Pcnt data for the human growth and
    microcephaly phenotype is an open question.
  proposed_experiments:
  - experiment_id: mopd2_organoid_vs_mouse_progenitor
    name: Human organoid versus mouse cortex progenitor comparison
    description: >-
      Compare PCNT-null human iPSC-derived cerebral organoids (which retain
      outer radial glia and an expanded outer subventricular zone) against
      Pcnt-null mouse cortex for progenitor pool size, spindle orientation, and
      division mode; test whether restoring human-specific basal progenitor
      amplification in mouse models unmasks the microcephaly phenotype.
notes: >-
  MOPD II and MOPD type I share a clinical name and a place in the microcephalic
  primordial dwarfism group but are distinct diseases with distinct genes,
  distinct mechanisms, distinct natural histories, distinct MONDO and OMIM
  identifiers, and separate GeneReviews chapters. They are therefore curated as
  two dismech entries, not one; see the differential_diagnoses block and the
  Microcephalic_Osteodysplastic_Primordial_Dwarfism_Type_I entry.

  Deep-research provenance: research/Microcephalic_Osteodysplastic_Primordial_Dwarfism_Type_II-deep-research-claude_code.md
  (claude_code provider; the falcon/Edison provider returned HTTP 402 Payment
  Required and could not be run). Two identifier errors in that report were
  caught and corrected during curation: the MONDO ID (report said
  MONDO:0008034; the correct term verified with OAK is MONDO:0008872) and the
  PCNT HGNC ID (report said HGNC:8720; the correct ID verified with OAK is
  hgnc:16068). The report's smooth-muscle-cell HSF1/HMGCR atherogenesis
  mechanism and its statin-repurposing proposal were deliberately NOT curated as
  pathophysiology or treatment: the supporting article is a 2023 JCI Insight
  paper with no PMID recoverable in this session, so no snippet could be
  verified against a cached abstract. The vascular mechanism is instead recorded
  as an explicit KNOWLEDGE_GAP discussion.

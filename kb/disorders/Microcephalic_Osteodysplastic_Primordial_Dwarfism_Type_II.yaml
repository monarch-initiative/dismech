name: Microcephalic Osteodysplastic Primordial Dwarfism Type II
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Microcephalic osteodysplastic primordial dwarfism type II (MOPD II, Majewski
  osteodysplastic primordial dwarfism type II) is the most common form of
  microcephalic primordial dwarfism. It is caused by biallelic loss-of-function
  variants in PCNT, which encodes the pericentriolar-material scaffold protein
  pericentrin. Loss of pericentrin from the centrosome disorganizes the mitotic
  spindle, causes chromosome missegregation, and impairs ATR-dependent
  checkpoint signaling, depleting proliferating progenitor pools and producing
  extreme pre- and postnatal growth failure with severe microcephaly. Unlike
  most microcephaly syndromes — and unlike the mechanistically unrelated MOPD
  type I — cognition is typically near-normal, and the dominant morbidity and
  mortality come from later-onset multisystem complications: a slender-bone
  skeletal dysplasia, near-universal abnormal dentition, insulin resistance and
  diabetes, chronic kidney disease, and a global vasculopathy (moyamoya,
  intracranial aneurysms, premature coronary artery disease).
category: Mendelian

      Seckel/microcephalic osteodysplastic primordial dwarfism type II (MOPD II)
      families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is therefore concluded that, despite variable severity, MOPDII is a
      genetically homogeneous condition due to loss-of-function of pericentrin.
    explanation: >-
      A second independent series confirms genetic homogeneity and the
      loss-of-function mechanism.
  downstream:
  - target: Centrosome and Mitotic Spindle Disorganization

- name: Centrosome and Mitotic Spindle Disorganization
  description: >-
    Pericentrin anchors both structural and regulatory proteins at the
    centrosome, including gamma-tubulin ring complexes that nucleate spindle
    microtubules. Its absence disorganizes the mitotic spindle and causes
    chromosome missegregation in dividing cells. This node substitutes PCNT for
    the generic centrosome/spindle lesion of the neural progenitor
    centrosome-spindle module.
  biological_scale: CELLULAR
  conforms_to: "neural_progenitor_centrosome_spindle_dysfunction#Centrosome and Mitotic Spindle Perturbation"

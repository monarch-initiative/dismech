progression:
- phase: Static growth deficit with progressive multisystem complications
  notes: >-
    The core growth and microcephaly phenotype is established prenatally and is
    essentially fixed. Superimposed on it is a set of progressive, later-onset
    complications — skeletal (hip disease, scoliosis), dental, cerebrovascular,
    metabolic, and renal — which dominate morbidity and mortality. Neurovascular
    risk is present throughout the shortened lifespan, with moyamoya presenting
    earlier than aneurysms.
  evidence:
  - reference: PMID:34016138
    reference_title: >-
      Microcephalic osteodysplastic primordial dwarfism type II is associated
      with global vascular disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In general, the age at diagnosis for moyamoya was younger than aneurysms,
      but the risk for neurovascular disease was throughout the shortened
      lifespan.
    explanation: >-
      Documents the age-stratified vascular risk pattern and the shortened
      lifespan.

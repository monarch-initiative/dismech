pathophysiology:
- name: Biallelic PCNT Loss of Function
  description: >-
    Biallelic nonsense, frameshift, splice-site, or small indel variants in PCNT
    (21q22.3) abolish production of functional pericentrin, an unusually large
    coiled-coil scaffold protein of the pericentriolar material. Sequence
    analysis detects the great majority of pathogenic alleles; missense variants
    are a minor contributor. Some individuals originally reported as having
    Seckel syndrome carry PCNT loss-of-function variants and are, on review,
    clinically compatible with MOPD II.
  biological_scale: MOLECULAR
  role: trigger

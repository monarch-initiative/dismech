- category: Neurologic
  name: Near-Normal Intelligence Despite Extreme Microcephaly
  description: >-
    In contrast to most microcephaly syndromes, and in explicit contrast to MOPD
    type I, cognition in MOPD II is typically near-normal or only mildly
    affected. Cognitive impairment when present is usually attributable to
    stroke rather than to the primary developmental lesion. This dissociation
    between brain volume and cognitive outcome is a defining and mechanistically
    notable feature of the disorder. The evidence items below are recorded as
    REFUTE against the intellectual-disability annotation: they document the
    ABSENCE of intellectual disability as a positive discriminating feature.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:18174396
    reference_title: Mutations in the pericentrin (PCNT) gene cause primordial dwarfism.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adults with this rare inherited condition have an average height of 100
      centimeters and a brain size comparable to that of a 3-month-old baby, but
      are of near-normal intelligence.
    explanation: >-
      Explicitly documents near-normal intelligence, refuting an intellectual
      disability annotation for MOPD II.
  - reference: PMID:19643772
    reference_title: >-
      Molecular analysis of pericentrin gene (PCNT) in a series of 24
      Seckel/microcephalic osteodysplastic primordial dwarfism type II (MOPD II)
      families.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MOPD II is distinct from SCKL by more severe growth retardation,
      radiological abnormalities, and absent or mild mental retardation.
    explanation: >-
      Independent confirmation that cognitive impairment is absent or mild, used
      here as a discriminator from Seckel syndrome.

genetic:
- name: PCNT
  gene_term:
    preferred_term: PCNT
    term:
      id: hgnc:16068
      label: PCNT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PCNT (21q22.3) encodes pericentrin, a large coiled-coil scaffold protein of
    the pericentriolar material that anchors structural and regulatory proteins
    at the centrosome. Biallelic loss-of-function variants — nonsense,
    frameshift, splice-site, and small indels — cause MOPD II. The condition is
    genetically homogeneous: PCNT accounts for essentially all molecularly
    solved cases.
  evidence:
  - reference: PMID:18174396
    reference_title: Mutations in the pericentrin (PCNT) gene cause primordial dwarfism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using genetic linkage analysis, we find that biallelic loss-of-function
      mutations in the centrosomal pericentrin (PCNT) gene on chromosome 21q22.3
      cause microcephalic osteodysplastic primordial dwarfism type II (MOPD II)
      in 25 patients.
    explanation: >-
      Gene-disease discovery evidence.
  - reference: PMID:19643772
    reference_title: >-
      Molecular analysis of pericentrin gene (PCNT) in a series of 24
      Seckel/microcephalic osteodysplastic primordial dwarfism type II (MOPD II)
      families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      13 distinct mutations were identified in 5/16 SCKL and 8/8 MOPDII
      including five stop mutations, five frameshift mutations, two splice site
      mutations, and one apparent missense mutation affecting the last base of
      exon 19.
    explanation: >-
      Documents the variant spectrum and the 8/8 detection rate in clinically
      diagnosed MOPD II.

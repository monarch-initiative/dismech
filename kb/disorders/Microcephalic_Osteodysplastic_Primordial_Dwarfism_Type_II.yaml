- name: Defective ATR-Dependent Checkpoint Signaling
  description: >-
    Pericentrin loss also impairs ATR-dependent DNA damage checkpoint signaling,
    the same pathway disrupted by hypomorphic ATR variants in Seckel syndrome.
    This provides the first mechanistic link between a structural centrosomal
    protein and DNA damage signaling and explains why the centrosomal and
    DNA-damage-response classes of microcephalic primordial dwarfism converge on
    one clinical phenotype.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: DECREASED
  evidence:
  - reference: PMID:18157127
    reference_title: >-
      Mutations in pericentrin cause Seckel syndrome with defective
      ATR-dependent DNA damage signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, we find that cells of individuals with Seckel syndrome due to
      mutations in PCNT (PCNT-Seckel) have defects in ATR-dependent checkpoint
      signaling, providing the first evidence linking a structural centrosomal
      protein with DNA damage signaling.
    explanation: >-
      Direct demonstration of impaired ATR-dependent checkpoint signaling in
      PCNT-deficient patient cells.
  downstream:
  - target: Reduced Progenitor Proliferation and Global Cell Number Deficit

- name: Reduced Progenitor Proliferation and Global Cell Number Deficit
  description: >-
    Impaired mitotic fidelity and checkpoint signaling reduce the proliferative
    output of rapidly dividing progenitor pools during embryonic and fetal
    development — neural progenitors in the cortical germinal zones, and growth
    plate chondrocytes and osteoblasts in the skeleton. Because the lesion is in
    a ubiquitously required mitotic apparatus rather than a tissue-restricted
    program, the deficit is global rather than organ-selective, which is what
    makes the resulting growth failure "primordial" (prenatal in onset and never
    caught up).
  biological_scale: CELLULAR
  cell_types:

discussions:
- discussion_id: mcph_human_model_species_mismatch
  prompt: >-
    Which MCPH mechanisms require gyrencephalic or human neural models because
    lissencephalic rodents under-reproduce the relevant progenitor biology?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Neural-Progenitor Proliferation and Survival Failure
  - experimental_models#CIT kinase-dead and frameshift human forebrain organoids
  rationale: >-
    CIT kinase-dead mice fail to reproduce the human microcephaly phenotype,
    while human forebrain organoids reveal severe cytoarchitectural and
    cytokinesis-polarity defects. ASPM ferrets and human organoids also model
    outer-radial-glia biology that is sparse in mouse cortex. Cross-model
    agreement should therefore be evaluated mechanism by mechanism rather than
    treating a negative mouse phenotype as disproof.
  evidence:
  - reference: PMID:39316437
    reference_title: Modeling primary microcephaly with human brain organoids reveals fundamental roles of CIT kinase activity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we created the CitKI/KI mouse model and found that it did not phenocopy
      human microcephaly, unlike biallelic CitFS/FS animals.
    explanation: The CIT allelic models provide direct evidence of a human–mouse phenotype mismatch.
- discussion_id: mcph_tp53_translation_gap
  prompt: >-
    Can apoptosis be modulated safely enough to preserve neural progenitors
    without allowing genomically damaged cells to persist?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Mitotic Stress, DNA Damage, and TP53-Linked Apoptosis
  rationale: >-
    TP53-linked apoptosis is a convergence point across many MCPH models and is
    pharmacologically tractable in principle, but it also protects developing
    tissue from cells with segregation, cytokinesis, or DNA-repair defects.
    Rescue of size alone is therefore not an adequate safety or efficacy
    endpoint.
  evidence:
  - reference: PMID:37457016
    reference_title: The impact of TP53 activation and apoptosis in primary hereditary microcephaly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In consideration of the potential druggability of cell apoptotic
      pathways, a better understanding of their role in MCPH may significantly
      facilitate the development of translational approaches.
    explanation: The review explicitly identifies apoptosis as a potentially druggable but unresolved translational target.
- discussion_id: mcph_numbering_and_disease_boundary
  prompt: >-
    How should future MCPH loci be incorporated while preserving the boundary
    between classic isolated MCPH, syndromic microcephaly, primordial dwarfism,
    and broader cortical-malformation disorders?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Heterogeneous Biallelic MCPH Gene Dysfunction
  rationale: >-
    The numbered series is actively evolving: a 2021 review listed MCPH1-28, a
    2023 mechanism review referred to MCPH1-30, and CETN3-associated disease was
    reported in 2025 and is now represented as MCPH31 in MONDO. Historical
    numbering alone cannot determine current ontology ancestry or whether a
    phenotype should be lumped into this umbrella.
  evidence:
  - reference: PMID:35111754
    reference_title: "Autosomal Recessive Primary Microcephaly: Not Just a Small Brain."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "twenty-eight MCPH-related genes"
    explanation: The review supplies a dated snapshot that demonstrates evolution of the locus series.
  - reference: PMID:40926052
    reference_title: CETN3 deficiency induces microcephaly by disrupting neural stem/progenitor cell fate through impaired centrosome assembly and RNA splicing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As CETN3 has not been previously linked to microcephaly"
    explanation: The CETN3 discovery illustrates continuing expansion beyond earlier numbered snapshots.
review_notes: >-
  Full review completed 2026-07-23. Scope was reconciled against the live
  MONDO:0016660 descendant hierarchy rather than copied from a historical locus
  table. The review retained 28 current descendants (MCPH1-17, MCPH19-25, and
  MCPH28-31), excluded historically numbered MCPH18/26/27 from subtype
  assertions because they are not current descendants, and explicitly noted
  the ZNF335 primordial-dwarfism boundary. ClinGen gene-validity assertions
  were audited locally for ASPM, CDK5RAP2, WDR62, and CENPJ. ClinicalTrials.gov
  searches found one completed genotype-phenotype observational MCPH study
  (NCT01565005) and no disease-specific interventional efficacy trial. NCBI GEO
  searches retained four directly relevant numbered-MCPH transcriptomic
  resources (GSE325064, GSE244463, GSE211990, and GSE83465). The pathograph
  intentionally separates centrosome/spindle, genome-integrity, cytokinesis,
  and noncanonical ribosome/cilium/lipid-transport routes before their
  convergence on reduced neural-progenitor output.

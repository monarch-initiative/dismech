name: Autosomal Recessive Primary Microcephaly
creation_date: "2026-05-13T12:00:00Z"
category: Mendelian
description: >-
  Autosomal recessive primary microcephaly (MCPH) is a genetically
  heterogeneous group of prenatal brain-growth disorders characterized by
  primary microcephaly and usually intellectual or developmental impairment.
  The classic phenotype has a small cerebral cortex with simplified gyration
  and few major extracranial anomalies, but individual genetic subtypes can
  include cortical malformations, spasticity, epilepsy, ataxia, short stature,
  or other syndromic features. Biallelic variants disrupt multiple processes
  needed to expand the fetal neural-progenitor pool, including centrosome and
  spindle organization, chromosome segregation and DNA repair, cytokinesis,
  membrane trafficking, lipid transport, ribosome biogenesis, and ciliary
  dynamics. These lesions converge variably on mitotic delay, DNA damage,
  TP53-linked apoptosis, premature differentiation, and reduced cortical-neuron
  output.
synonyms:
- MCPH
- microcephaly primary hereditary
- primary hereditary microcephaly
- autosomal recessive primary microcephaly
- microcephaly vera
parents:
- Microcephaly
- Mendelian Disorder
- Neurological Disorder

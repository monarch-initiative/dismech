treatments:
- name: Multidisciplinary developmental and supportive care
  description: >-
    Management is symptomatic and individualized. Developmental pediatrics,
    neurology, speech-language therapy, physical and occupational therapy,
    educational planning, behavioral support, and social-work services are
    coordinated according to functional needs. No disease-modifying therapy has
    established efficacy across MCPH.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:35188728
    reference_title: WDR62 Primary Microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment is symptomatic. Care by a multidisciplinary team (often
      including a pediatric neurologist, developmental pediatrician,
      speech-language pathologist, occupational and physical therapist, medical
      geneticist, and social worker) is recommended.
    explanation: GeneReviews defines multidisciplinary symptomatic management for WDR62-MCPH.
- name: Seizure and spasticity management
  description: >-
    Epilepsy and spasticity are treated according to standard neurologic care,
    with surveillance for new seizures, treatment response, tone-related
    functional limitations, and therapy needs.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:32239881
    reference_title: ASPM Primary Microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The management of epilepsy and spasticity is per standard care."
    explanation: ASPM GeneReviews directly supports standard symptom-directed management.
- name: Genetic counseling and reproductive testing
  description: >-
    Molecular subtype confirmation enables carrier testing for at-risk
    relatives, counseling about the 25% recurrence risk when both parents are
    carriers, targeted prenatal diagnosis, and preimplantation genetic testing.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32239881
    reference_title: ASPM Primary Microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once the ASPM pathogenic variants have been identified in an affected
      family member, carrier testing for at-risk relatives, prenatal testing
      for a pregnancy at increased risk, and preimplantation genetic testing
      are possible.
    explanation: GeneReviews directly supports family testing and reproductive options.
clinical_trials:
- name: NCT01565005
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    This completed observational study compared neuroradiologic and cognitive
    phenotypes across genetically defined MCPH groups and Fanconi anemia. It
    enrolled 98 participants and was not a disease-modifying intervention.
    ClinicalTrials.gov was audited on 2026-07-23; no MCPH-specific
    interventional efficacy study was identified.
  evidence:
  - reference: clinicaltrials:NCT01565005
    reference_title: "Microcephaly Genetic Deficiency in Neural Progenitors: Genotyping, Phenotyping and Functional Neuro-anatomy and Neurobiology Comparative Primitive Microcephaly (MCPH) and the Fanconi Anemia (FA)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compare neuroradiological phenotype and cognitive functioning of MCPH
      patients caused by ASPM mutations already characterized and published
      (Passemard et al. 2009a) with other MCPH-related patients
    explanation: The registry record establishes the study's genotype-phenotype observational purpose.

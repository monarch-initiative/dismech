      id: MONDO:0016660
      label: autosomal recessive primary microcephaly
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
notes: >-
  This entry follows the current MONDO:0016660 hierarchy rather than assuming
  that every historically numbered MCPH locus remains within one disease
  umbrella. The current hierarchy contains 28 descendants: MCPH1-MCPH17,
  MCPH19-MCPH25, and MCPH28-MCPH31. MCPH18 (WDFY3), MCPH26 (LMNB1), and MCPH27
  (LMNB2) are not current descendants and are therefore not asserted as
  subtypes here. Conversely, the hierarchy includes a ZNF335-associated
  microcephalic primordial-dwarfism entity, illustrating that the ontology
  umbrella extends beyond the narrowest “isolated classic MCPH” phenotype.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Functional impact ranges from relatively preserved daily autonomy with
    borderline or mild intellectual disability to severe developmental
    disability, epilepsy, spasticity, ataxia, and major cortical
    malformations. Burden is strongly genotype- and variant-dependent.
  evidence:
  - reference: PMID:35726608
    reference_title: Neurological outcome in WDR62 primary microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intellectual disability was severe in four patients, moderate in four,
      and mild in three.
    explanation: A systematically assessed WDR62 cohort demonstrates wide variation in cognitive burden.
  - reference: PMID:42141383
    reference_title: "Elucidating the Genetic Landscape, Phenotypic Spectrum, and Pathogenic Mechanisms in a Turkish Cohort with Primary Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the MCPH group, borderline to mild intellectual disability,
      independent of microcephaly severity, and behavioral abnormalities were
      prominent
    explanation: A contemporary cohort documents the milder end of the MCPH functional spectrum.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    The numbered MCPH entities in this entry are caused by biallelic pathogenic
    variants. For a couple who are both heterozygous for the same
    disease-causing gene, each pregnancy has a 25% affected recurrence risk.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:32239881
    reference_title: ASPM Primary Microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ASPM-MCPH is inherited in an autosomal recessive manner."
    explanation: GeneReviews explicitly states autosomal recessive inheritance for the most common MCPH subtype.
  - reference: PMID:35188728
    reference_title: WDR62 Primary Microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WDR62-MCPH is inherited in an autosomal recessive manner."
    explanation: GeneReviews independently confirms recessive inheritance for MCPH2.
prevalence:
- population: General population
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.4
  notes: >-
    This is a literature estimate for MCPH as a group, not a registry-derived
    prevalence for every subtype.
  evidence:
  - reference: PMID:35111754
    reference_title: "Autosomal Recessive Primary Microcephaly: Not Just a Small Brain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of MCPH differs from 1:10,000 in populations with a high
      rate of consanguineous marriage to 1:250,000 in the general population
    explanation: The review provides the general-population estimate.
- population: Populations with a high rate of consanguineous marriage
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 10
  notes: >-
    The elevated estimate reflects population structure and recessive
    inheritance; it should not be generalized to all populations.
  evidence:
  - reference: PMID:35111754
    reference_title: "Autosomal Recessive Primary Microcephaly: Not Just a Small Brain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of MCPH differs from 1:10,000 in populations with a high
      rate of consanguineous marriage to 1:250,000 in the general population
    explanation: The review provides the high-consanguinity population estimate.
progression:
- phase: Prenatal brain-growth restriction
  age_range: Prenatal to birth
  notes: >-
    The defining brain-growth deficit begins prenatally; microcephaly is
    usually apparent at birth, although WDR62-related disease can become
    evident during the first year.
  evidence:
  - reference: PMID:32239881
    reference_title: ASPM Primary Microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "usually present at birth and always present before age one year"
    explanation: GeneReviews defines the early course of ASPM-related MCPH.
- phase: Lifelong neurodevelopmental course
  age_range: Childhood through adulthood
  notes: >-
    Cognitive, communication, motor, behavioral, and epilepsy needs require
    longitudinal surveillance. Most disease reflects a developmental deficit,
    but subtype-specific progression can occur.
  evidence:
  - reference: PMID:35726608
    reference_title: Neurological outcome in WDR62 primary microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified progressive ataxia in the second decade of life in one
      patient, which should encourage clinicians to follow up patients in the
      long term.
    explanation: The WDR62 cohort identifies a progressive late complication and supports long-term follow-up.

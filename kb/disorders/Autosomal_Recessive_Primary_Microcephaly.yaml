diagnosis:
- name: Head-circumference measurement and developmental phenotyping
  description: >-
    Serial occipitofrontal-circumference measurements establish congenital or
    early primary microcephaly, while neurologic, developmental, behavioral,
    growth, and dysmorphology assessment determines whether the presentation is
    classic or syndromic.
  results: >-
    A markedly reduced head circumference present at birth or before age one,
    together with a compatible neurodevelopmental phenotype, supports primary
    microcephaly and prompts etiologic testing.
  evidence:
  - reference: PMID:32239881
    reference_title: ASPM Primary Microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "usually present at birth and always present before age one year"
    explanation: GeneReviews supplies a practical clinical recognition threshold and timing.
- name: Brain magnetic resonance imaging
  description: >-
    MRI characterizes brain volume, gyral simplification, callosal or
    infratentorial abnormalities, and subtype-associated malformations such as
    pachygyria, heterotopia, schizencephaly, or microlissencephaly.
  results: >-
    A small brain with simplified gyration supports classic MCPH; major
    malformations refine subtype prioritization and prognosis.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: MAXO:0000424
      label: magnetic resonance imaging procedure
  evidence:
  - reference: PMID:35726608
    reference_title: Neurological outcome in WDR62 primary microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain malformations, including pachygyria, neuronal heterotopia,
      schizencephaly, and microlissencephaly, were present in 11 out of 15
      patients.
    explanation: Systematic MRI phenotyping identifies clinically important WDR62 malformations.
- name: Molecular genetic testing
  description: >-
    Because the umbrella is highly heterogeneous, a comprehensive
    microcephaly/neurodevelopmental panel, exome sequencing, or genome
    sequencing is generally more efficient than sequential single-gene testing.
    Copy-number analysis and segregation studies should be considered according
    to presentation and assay design.
  results: >-
    Biallelic pathogenic variants in a recognized MCPH gene establish a
    molecular subtype and enable recurrence-risk counseling, carrier testing,
    prenatal diagnosis, and preimplantation genetic testing.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: MAXO:0000533
      label: molecular genetic testing
  evidence:
  - reference: PMID:42141383
    reference_title: "Elucidating the Genetic Landscape, Phenotypic Spectrum, and Pathogenic Mechanisms in a Turkish Cohort with Primary Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing was performed on probands, 52 of whom had consanguineous
      parents. The diagnostic yield was 53.1%.
    explanation: A contemporary 87-patient cohort demonstrates the utility of exome sequencing.
  - reference: PMID:32239881
    reference_title: ASPM Primary Microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of ASPM-MCPH is established in a proband with biallelic
      pathogenic variants in ASPM identified by molecular genetic testing.
    explanation: GeneReviews defines molecular confirmation for the common ASPM subtype.
differential_diagnoses:
- name: Syndromic primary microcephaly
  description: >-
    Many Mendelian syndromes cause prenatal microcephaly but have major
    extracranial anomalies or a broader malformation pattern and should not be
    automatically collapsed into classic MCPH.
  distinguishing_features:
  - Major congenital anomalies, disproportionate growth failure, metabolic disease, or multisystem involvement favor a syndromic diagnosis.
  - Molecular testing assigns the causal disorder even when head-size severity overlaps.
  evidence:
  - reference: PMID:42141383
    reference_title: "Elucidating the Genetic Landscape, Phenotypic Spectrum, and Pathogenic Mechanisms in a Turkish Cohort with Primary Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It differs from syndromic primary microcephaly (PM) by the lack of
      syndromic features and major brain malformations.
    explanation: The cohort explicitly distinguishes classic MCPH from syndromic primary microcephaly.
- name: Secondary or acquired microcephaly
  description: >-
    Postnatal brain-growth deceleration or atrophy can follow infection,
    hypoxic-ischemic injury, teratogenic exposure, metabolic disease, or
    neurodegeneration and requires an exposure, imaging, and temporal workup.
  distinguishing_features:
  - Normal head size at birth followed by deceleration favors secondary microcephaly.
  - Brain atrophy, destructive lesions, or a documented acquired insult weighs against classic MCPH.
  evidence:
  - reference: PMID:35111754
    reference_title: "Autosomal Recessive Primary Microcephaly: Not Just a Small Brain."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Microcephaly or reduced head circumference results from a multitude of
      abnormal developmental processes affecting brain growth and/or leading
      to brain atrophy.
    explanation: The review frames impaired prenatal growth and brain atrophy as distinct etiologic routes.
- name: Other genetic primary-microcephaly spectra
  description: >-
    Dominant primary microcephalies, microcephalic primordial dwarfism,
    sensorineural syndromes, and broader malformations of cortical development
    overlap with MCPH but can have different inheritance, systemic findings,
    and disease boundaries.
  distinguishing_features:
  - Dominant or de novo inheritance argues against a numbered autosomal recessive MCPH subtype.
  - Marked proportional short stature, sensory disease, or a major cortical-malformation pattern may indicate an adjacent disease spectrum.
  evidence:
  - reference: PMID:37443841
    reference_title: "Genetic Primary Microcephalies: When Centrosome Dysfunction Dictates Brain and Body Size."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      isolated PMs with or without malformations of cortical development and
      PMs associated with short stature (microcephalic dwarfism) or

      reference_title: "CDKN1B / multiple endocrine neoplasia type 4 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CDKN1B | HGNC:1785 | multiple endocrine neoplasia type 4 | MONDO:0012552 | AD | Definitive"
      explanation: >-
        ClinGen Hereditary Cancer Gene Curation Expert Panel assertion,
        classified 2018-12-21.
  evidence:
  - reference: PMID:17030811
    reference_title: "Germ-line mutations in p27Kip1 cause a multiple endocrine neoplasia syndrome in rats and humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings demonstrate that germ-line mutations in p27(Kip1) can
      predispose to the development of multiple endocrine tumors in both rats
      and humans.
    explanation: >-
      The defining gene-disease observation, made jointly in the MENX rat and
      in a human kindred.
  notes: >-
    CDKN1B lies at 12p13.1 and encodes p27-Kip1, an intrinsically disordered
    cyclin-dependent kinase inhibitor. Variant classification is a live problem
    in this gene: a French series re-examined 77 previously published patients
    across 26 studies and retained only 29 as carrying class 4 or 5 variants,
    so published MEN4 phenotype frequencies depend heavily on which
    reclassification is applied. A distinct non-coding mechanism is
    established - a 4 bp deletion in a conserved upstream open reading frame of
    the 5-prime untranslated region lowers translational reinitiation at the
    CDKN1B start codon without altering transcript level - so a coding-only
    analysis can miss a causal allele.
  variants:
  - name: c.-456_-453delCCTT
    description: >-
      A four-base deletion in the conserved upstream open reading frame of the
      CDKN1B 5-prime untranslated region. It lengthens the upstream open
      reading frame peptide and shortens the intercistronic space, reducing
      reinitiation at the CDKN1B start codon and lowering p27 protein without
      reducing messenger RNA. Reported in a woman with acromegaly and a
      well-differentiated nonfunctioning pancreatic endocrine neoplasm whose
      tumour showed no loss of heterozygosity.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23555276
      reference_title: "A novel mutation in the upstream open reading frame of the CDKN1B gene causes a MEN4 phenotype."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        both wild type and mutated alleles were expressed in blood cells in
        almost equal amounts, suggesting that the identified deletion does not
        alter mRNA steady state levels, and therefore probably does not alter
        either transcription or mRNA stability
      explanation: >-
        Establishes that this allele acts translationally, which is what makes
        it a non-coding mechanism a coding-only analysis would miss.
diagnosis:
- name: CDKN1B sequencing in MEN1-phenotype, MEN1-negative patients
  description: >-
    MEN4 is established by finding a germline heterozygous pathogenic CDKN1B
    variant. The clinical trigger is a MEN1-like presentation - most often
    primary hyperparathyroidism with or without a pituitary adenoma - in
    someone with no pathogenic MEN1 variant. Sequencing should cover the
    5-prime untranslated region as well as the coding sequence, because an
    established pathogenic mechanism lies in an upstream open reading frame
    outside the coding exons.
  evidence:
  - reference: PMID:37733893
    reference_title: "Multiple Endocrine Neoplasia Type 4."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of MEN4 is established in a proband with a germline
      heterozygous pathogenic variant in CDKN1B identified by molecular genetic
      testing.
    explanation: >-
      The diagnostic criterion itself: the diagnosis rests on the molecular
      finding, not on the clinical pattern, which is only what prompts testing.
  - reference: PMID:38288531
    reference_title: "Beyond MEN1, When to Think About MEN4? Retrospective Study on 5600 Patients in the French Population and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although CDKN1B mutations are frequently suggested to explain cases of
      genetically negative MEN1, the prevalence and phenotype of MEN4 patients
      is poorly known, and genetic counseling is unclear.
    explanation: >-
      States the clinical situation in which CDKN1B is tested, and that the
      yield and counselling implications remain poorly defined.

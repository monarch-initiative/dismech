prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence estimate exists. Fewer than 100 cases had been reported in
    the two decades after the syndrome's description in 2006, and the
    systematic review that assembled the largest series found 65 individuals
    across 20 publications. The qualitative tier is used because the sources
    characterise rarity without supplying a numeric estimate or naming a
    measure.
  evidence:
  - reference: PMID:36520683
    reference_title: "Multiple endocrine neoplasia type 4: a new member of the MEN family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MEN4 is an extremely rare disease, which most frequently affects women
      around 50 years of age.
    explanation: >-
      The systematic review's own summary of rarity, and of the age and sex
      distribution of ascertained cases.
pathophysiology:
- name: Germline CDKN1B Loss-of-Function Variant
  description: >-
    A germline heterozygous loss-of-function variant in CDKN1B is present in
    every cell. Reported routes to reduced protein include nonsense and
    frameshift alleles, missense changes that accelerate proteasomal turnover
    or mislocalise the protein out of the nucleus, and non-coding variants in
    the 5-prime untranslated region that disrupt an upstream open reading frame
    and lower translational reinitiation at the CDKN1B start codon.
  role: trigger
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  molecular_functions:
  - preferred_term: cyclin-dependent protein serine/threonine kinase inhibitor activity
    modifier: DECREASED
    term:
      id: GO:0004861
      label: cyclin-dependent protein serine/threonine kinase inhibitor activity
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    gene:
      preferred_term: CDKN1B
      term:
        id: hgnc:1785
        label: CDKN1B
    description: >-
      Germline heterozygous CDKN1B loss of function, by coding or 5-prime
      untranslated region mechanisms.
  evidence:
  - reference: PMID:17030811
    reference_title: "Germ-line mutations in p27Kip1 cause a multiple endocrine neoplasia syndrome in rats and humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings demonstrate that germ-line mutations in p27(Kip1) can
      predispose to the development of multiple endocrine tumors in both rats
      and humans.
    explanation: >-
      Establishes germline CDKN1B loss of function as the cause of the
      syndrome, in the paper that defined it.
  downstream:
  - target: Reduced Nuclear p27 Dosage
    causal_link_type: DIRECT
    description: >-
      Each route converges on less functional p27 protein in the nucleus.
- name: Reduced Nuclear p27 Dosage
  description: >-
    The amount of functional nuclear p27-Kip1 falls. In the upstream open
    reading frame mechanism this happens without any change in transcript
    level: both the wild-type and the mutant allele are transcribed in
    comparable amounts, and the deficit is in translation rather than in
    message. In most reported tumours the remaining wild-type allele is neither
    lost nor silenced at the transcript level, so the cell is left
    haploinsufficient rather than null.
  role: intermediate
  biological_scale: MOLECULAR
  node_class: PROTEIN_ABUNDANCE_LOSS
  cellular_components:
  - preferred_term: nucleus
    term:
      id: GO:0005634
      label: nucleus
  evidence:
  - reference: PMID:23555276
    reference_title: "A novel mutation in the upstream open reading frame of the CDKN1B gene causes a MEN4 phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      both wild type and mutated alleles were expressed in blood cells in
      almost equal amounts, suggesting that the identified deletion does not
      alter mRNA steady state levels, and therefore probably does not alter
      either transcription or mRNA stability
    explanation: >-
      Shows the deficit is translational rather than transcriptional for the
      upstream open reading frame allele, and that the wild-type allele keeps
      being expressed.
  - reference: PMID:30990521
    reference_title: "Clinical Features of Multiple Endocrine Neoplasia Type 4: Novel Pathogenic Variant and Review of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      reduced expression of p27 was observed in a LOH-negative tumor,
      indicating that CDKN1B haploinsufficiency may lead to tumor development
    explanation: >-
      The observation the dosage model rests on: p27 is reduced in a tumour
      that has not lost its second allele. Quoted from the paper's discussion,
      where it synthesises earlier reports, hence REVIEW_SYNTHESIS.
  downstream:
  - target: Release of the G1/S Restriction Point
    causal_link_type: DIRECT
    description: >-
      Less p27 means weaker inhibition of cyclin E- and cyclin A-CDK2
      complexes.
  - target: Somatic Second Hit at CDKN1B
    causal_link_type: DIRECT
    description: >-
      In a minority of tumours the remaining wild-type allele is also lost,
      taking the cell from reduced dosage to none.
- name: Somatic Second Hit at CDKN1B
  description: >-
    The minority route. In some MEN4 tumours loss of heterozygosity removes
    the retained wild-type allele, and loss of p27 staining has been seen in a
    parathyroid adenoma. This is the classical two-hit mechanism, and it is
    modelled here as a branch rather than as the trunk, because it is found in
    a minority of samples investigated while most tumours show reduced p27
    with both alleles intact.
  role: intermediate
  biological_scale: MOLECULAR
  node_class: GENOME_INSTABILITY
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
    gene:
      preferred_term: CDKN1B
      term:
        id: hgnc:1785
        label: CDKN1B
    description: >-
      Somatic loss of the retained wild-type CDKN1B allele in tumour tissue.
  evidence:
  - reference: PMID:30990521
    reference_title: "Clinical Features of Multiple Endocrine Neoplasia Type 4: Novel Pathogenic Variant and Review of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In accordance with previous publications, we observed LOH in a minority
      of the samples available for investigation
    explanation: >-
      States that loss of heterozygosity occurs but in a minority, which is
      exactly why this is curated as a branch and not as the main mechanism.
  downstream:
  - target: Clonal Expansion of Hormone-Secreting Endocrine Cells
    causal_link_type: DIRECT
    description: >-
      Complete loss of p27 in a cell that has taken a second hit removes the
      restraint entirely rather than reducing it.
- name: Release of the G1/S Restriction Point
  description: >-
    p27-Kip1 is a potent inhibitor of cyclin E- and cyclin A-CDK2. Reduced
    nuclear p27 weakens that restraint and releases the G1 to S restriction
    point. This step is canonical p27 cell-cycle biology; it has not been
    measured directly in human MEN4 tumour tissue in any source retrieved, and
    is recorded here as the inferential link between the protein deficit and
    clonal expansion.
  role: intermediate
  biological_scale: CELLULAR
  node_class: PROLIFERATION_EXPANSION
  biological_processes:
  - preferred_term: G1/S transition of mitotic cell cycle
    modifier: INCREASED
    term:
      id: GO:0000082
      label: G1/S transition of mitotic cell cycle
  - preferred_term: negative regulation of cell population proliferation
    modifier: DECREASED
    term:
      id: GO:0008285
      label: negative regulation of cell population proliferation
  notes: >-
    Left uncited on purpose. The inhibition of cyclin E- and cyclin A-CDK2 by
    p27 is canonical cell-cycle biology, but no source retrieved for this entry
    measures it in human MEN4 tumour tissue, so no paper supports the step as a
    claim about this disease. Rather than attach a general p27 reference and
    let it read as MEN4 evidence, the node states the inference and carries no
    evidence item.
  downstream:
  - target: Clonal Expansion of Hormone-Secreting Endocrine Cells
    causal_link_type: DIRECT
    description: >-
      Released proliferative drive in an endocrine lineage permits monoclonal
      expansion.
- name: Clonal Expansion of Hormone-Secreting Endocrine Cells
  description: >-
    Expansion occurs in hormone-producing endocrine lineages, giving a
    monoclonal adenoma whose parent cell still secretes. Parathyroid chief
    cells are the commonest lineage and corticotrophs, somatotrophs and
    lactotrophs the next; pancreatic and enteroendocrine lineages account for
    the neuroendocrine tumours. Because the adenoma retains the secretory
    programme of its parent cell, the clinical picture is autonomous hormone
    output rather than mass effect alone.
  role: intermediate
  biological_scale: TISSUE
  node_class: PROLIFERATION_EXPANSION
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  - preferred_term: corticotroph
    term:
      id: CL:0002309
      label: corticotroph
  evidence:
  - reference: PMID:36520683
    reference_title: "Multiple endocrine neoplasia type 4: a new member of the MEN family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary hyperparathyroidism as a uniglandular disease is the leading
      pathology.
    explanation: >-
      Identifies the parathyroid lineage as the dominant site of expansion, and
      records that it is usually a single gland rather than multiglandular
      disease.
  downstream:
  - target: Primary hyperparathyroidism
    causal_link_type: DIRECT
    description: >-
      A parathyroid adenoma secreting parathyroid hormone autonomously produces
      hypercalcaemia.
  - target: Anterior pituitary adenoma
    causal_link_type: DIRECT
    description: >-
      Expansion in a pituitary lineage gives a hormone-secreting or
      nonfunctioning anterior pituitary adenoma.
  - target: Gastroenteropancreatic neuroendocrine tumour
    causal_link_type: DIRECT
    description: >-
      Expansion in pancreatic or enteroendocrine lineages gives a
      well-differentiated neuroendocrine tumour.
phenotypes:
- name: Primary hyperparathyroidism
  category: Clinical
  description: >-
    The cardinal manifestation and the first in most patients, presenting as
    hypercalcaemia from autonomous parathyroid hormone secretion. It is usually
    uniglandular (86% single adenoma) and recurs in only about 6%, both of
    which distinguish it from the multiglandular, recurrence-prone
    hyperparathyroidism of MEN1. Median age at diagnosis is about 51 years,
    with the reported range extending down to 15 years, and the large majority
    of reported cases are women.
  frequency: 75% of symptomatic individuals (36/48)
  phenotype_term:
    preferred_term: Primary hyperparathyroidism
    term:
      id: HP:0008200
      label: Primary hyperparathyroidism
  evidence:
  - reference: PMID:36520683
    reference_title: "Multiple endocrine neoplasia type 4: a new member of the MEN family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary hyperparathyroidism as a uniglandular disease is the leading
      pathology.
    explanation: >-
      The systematic review's finding that hyperparathyroidism leads the
      phenotype and is usually single-gland disease.
  - reference: PMID:36520683
    reference_title: "Multiple endocrine neoplasia type 4: a new member of the MEN family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequently affected endocrine organ was the parathyroid gland
      (36/48, 75%; uniglandular disease 31/36, 86%), followed by the pituitary
      gland (21/48, 44%; hormone-secreting 16/21, 76%), the endocrine pancreas
      (7/48, 15%), and the thyroid gland (4/48, 8%).
    explanation: >-
      Carries every organ frequency this entry records, with the denominators
      the review used, so the figures are quoted rather than asserted.
  - reference: PMID:36520683
    reference_title: "Multiple endocrine neoplasia type 4: a new member of the MEN family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In five patients, either multi-glandular (5/36, 14%) and/or recurrent
      disease (2/36, 6%) was diagnosed.
    explanation: >-
      Supports the two figures that distinguish MEN4 hyperparathyroidism from
      the multiglandular, recurrence-prone disease of MEN1.
  - reference: PMID:30990521
    reference_title: "Clinical Features of Multiple Endocrine Neoplasia Type 4: Novel Pathogenic Variant and Review of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypercalcemia due to primary hyperparathyroidism and pituitary tumors are
      common in MEN4.
    explanation: >-
      Independent case-plus-review series agreeing that hyperparathyroidism and
      pituitary tumours are the common manifestations.
  sequelae:
  - target: Hypercalcemia
    description: >-
      Autonomous parathyroid hormone secretion raises serum calcium.
- name: Hypercalcemia
  category: Laboratory
  description: >-
    Hypercalcaemia from parathyroid hormone excess, often mild and frequently
    found in people who are asymptomatic. Its complications in reported MEN4
    cases include nephrolithiasis, nephrocalcinosis and reduced bone density.
  phenotype_term:
    preferred_term: Hypercalcemia
    term:
      id: HP:0003072
      label: Hypercalcemia
  evidence:
  - reference: PMID:30990521
    reference_title: "Clinical Features of Multiple Endocrine Neoplasia Type 4: Novel Pathogenic Variant and Review of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypercalcemia due to primary hyperparathyroidism and pituitary tumors are
      common in MEN4.
    explanation: >-
      States hypercalcaemia as a common manifestation and attributes it to
      primary hyperparathyroidism.
- name: Anterior pituitary adenoma
  category: Clinical
  description: >-
    Anterior pituitary adenomas occur in a substantial minority, at a median
    age of about 39 years with a reported range from 5 to 79 years. About
    three-quarters are hormone-secreting - corticotroph, lactotroph and
    somatotroph lesions - and the remainder nonfunctioning. Germline CDKN1B
    loss of function is also a recognised cause of paediatric Cushing disease,
    with or without the wider MEN4 phenotype, which is the main reason this
    syndrome reaches paediatric practice.
  frequency: 44% of symptomatic individuals (21/48)
  phenotype_term:
    preferred_term: Pituitary adenoma
    term:
      id: HP:0002893
      label: Pituitary adenoma
  evidence:
  - reference: PMID:32232325
    reference_title: "Germline CDKN1B Loss-of-Function Variants Cause Pediatric Cushing's Disease With or Without an MEN4 Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Even though pituitary neuroendocrine tumors are a well-known component of
      the syndrome, only 2 cases of Cushing's disease (CD) have so far been
      described in this setting.
    explanation: >-
      Establishes pituitary neuroendocrine tumours as a recognised component
      and sets out how rarely Cushing disease had been reported before this
      paediatric series.
- name: Gastroenteropancreatic neuroendocrine tumour
  category: Clinical
  description: >-
    Well-differentiated gastroenteropancreatic neuroendocrine tumours,
    including nonfunctioning pancreatic lesions and gastrinomas, occur in a
    minority. They are explicitly less prevalent than in MEN1, which is one of
    the practical differences between the two syndromes, but they are the
    manifestation most often metastatic at presentation.
  frequency: 19% of symptomatic individuals (9/48)
  phenotype_term:
    preferred_term: Neuroendocrine neoplasm
    term:
      id: HP:0100634
      label: Neuroendocrine neoplasm
  evidence:
  - reference: PMID:30990521
    reference_title: "Clinical Features of Multiple Endocrine Neoplasia Type 4: Novel Pathogenic Variant and Review of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gastrointestinal neuroendocrine tumors appear to be less prevalent in
      MEN4 than in MEN1.
    explanation: >-
      States the contrast with MEN1 directly, which is the basis for recording
      this as a less frequent manifestation than the parathyroid and pituitary
      disease.
- name: Papillary thyroid carcinoma
  category: Clinical
  description: >-
    Papillary thyroid carcinoma occurred in 8% of symptomatic individuals in
    the systematic review, all of them women and most multifocal, at a median
    age in the sixth decade. It is not part of the MEN1 tumour spectrum, so it
    is one of the features that argues for looking at CDKN1B rather than MEN1.
  frequency: 8% of symptomatic individuals (4/48)
  phenotype_term:
    preferred_term: Papillary thyroid carcinoma
    term:
      id: HP:0002895
      label: Papillary thyroid carcinoma
  evidence:
  - reference: PMID:36520683
    reference_title: "Multiple endocrine neoplasia type 4: a new member of the MEN family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequently affected endocrine organ was the parathyroid gland
      (36/48, 75%; uniglandular disease 31/36, 86%), followed by the pituitary
      gland (21/48, 44%; hormone-secreting 16/21, 76%), the endocrine pancreas
      (7/48, 15%), and the thyroid gland (4/48, 8%).
    explanation: >-
      Gives the thyroid frequency with its denominator alongside the other
      organ frequencies.
- name: Adrenocortical tumour
  category: Clinical
  description: >-
    Adrenocortical lesions, cortisol-secreting or nonfunctioning, occur in a
    small minority.
  frequency: about 6% of symptomatic individuals (3/48)
  phenotype_term:
    preferred_term: adrenal tumour
    term:
      id: HP:0100631
      label: Neoplasm of the adrenal gland
  evidence:
  - reference: PMID:37733893
    reference_title: "Multiple Endocrine Neoplasia Type 4."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Well-differentiated endocrine tumors of the gastroenteropancreatic tract,
      carcinoid tumors, and adrenocortical tumors can also occur.
    explanation: >-
      The GeneReviews statement of the less common tumour types, including
      adrenocortical lesions.
  - reference: PMID:36520683
    reference_title: "Multiple endocrine neoplasia type 4: a new member of the MEN family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were three patients with tumors of the adrenal gland (1× bilateral
      nonfunctioning, 1× bilateral with suspicion of cyclic cortisol
      secretion, and 1x unilateral with subclinical cortisol secretion)
    explanation: >-
      The count behind the adrenal frequency, with the functional status of
      each case - two of the three secrete subclinically or cyclically rather
      than overtly.
- name: Carcinoid tumour
  category: Clinical
  description: >-
    Two carcinoid tumours are reported across the systematic review's 48
    symptomatic individuals: a thymic atypical carcinoid presenting with
    ectopic Cushing syndrome, and a metastatic lung carcinoid. The thymic
    count in that review is two patients, but only one of those is a
    carcinoid - the other is a thymic hyperplasia causing myasthenia gravis -
    so a thymus-based denominator would overstate the carcinoid frequency.
  frequency: two reported carcinoids among 48 symptomatic individuals
  phenotype_term:
    preferred_term: Carcinoid tumor
    term:
      id: HP:0100570
      label: Carcinoid tumor
  evidence:
  - reference: PMID:37733893
    reference_title: "Multiple Endocrine Neoplasia Type 4."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Well-differentiated endocrine tumors of the gastroenteropancreatic tract,
      carcinoid tumors, and adrenocortical tumors can also occur.
    explanation: >-
      The GeneReviews statement naming carcinoid tumours in the spectrum.
  - reference: PMID:36520683
    reference_title: "Multiple endocrine neoplasia type 4: a new member of the MEN family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      thymic hyperplasia causing myasthenia gravis, 1× atypical carcinoid
      tumor causing ectopic Cushing's syndrome). Finally, one patient
      presented with a carcinoid tumor of the lungs (metastatic)
    explanation: >-
      Identifies the two reported carcinoids and, in the same sentence, the
      thymic hyperplasia that is not one - which is why this entry does not
      use the thymic count as a carcinoid frequency.
- name: ACTH-secreting pituitary adenoma causing Cushing disease
  category: Clinical
  description: >-
    Corticotroph adenomas secreting ACTH drive cortisol excess. Germline
    CDKN1B loss of function is a recognised cause of paediatric Cushing
    disease, with or without the wider MEN4 phenotype, and that is the main
    route by which this syndrome reaches paediatric practice.
  phenotype_term:
    preferred_term: Increased circulating cortisol level
    term:
      id: HP:0003118
      label: Increased circulating cortisol level
  evidence:
  - reference: PMID:37733893
    reference_title: "Multiple Endocrine Neoplasia Type 4."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Anterior pituitary adenomas can secrete adrenocorticotrophic hormone
      (ACTH), growth hormone (GH), prolactin, or are nonfunctional
      (nonsecreting) adenomas.
    explanation: >-
      Names ACTH among the hormones these adenomas secrete.
- name: Growth hormone-secreting pituitary adenoma
  category: Clinical
  description: >-
    Somatotroph adenomas secreting growth hormone produce acromegaly, or

name: Multiple Endocrine Neoplasia Type 4
creation_date: "2026-11-19T16:24:19Z"
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Endocrine Neoplasia
synonyms:
- MEN4
- CDKN1B multiple endocrine neoplasia
- multiple endocrine neoplasia caused by mutation in CDKN1B
- multiple endocrine neoplasia, type IV
description: >-
  Multiple endocrine neoplasia type 4 (MEN4) is an autosomal dominant
  hereditary endocrine tumour predisposition syndrome caused by germline
  loss-of-function variants in CDKN1B at 12p13.1, which encodes the
  cyclin-dependent kinase inhibitor p27-Kip1. It presents as a MEN1-like
  phenotype in people without a MEN1 variant: primary hyperparathyroidism is
  the cardinal and usually first manifestation, followed by anterior pituitary
  adenomas and, less often, gastroenteropancreatic neuroendocrine tumours,
  carcinoid and adrenocortical lesions. Two features separate it from MEN1 in
  practice. The clinical course is later and milder - hyperparathyroidism
  presents around the fifth decade rather than the third, is usually
  uniglandular rather than multiglandular, and recurs less often - and
  gastroenteropancreatic neuroendocrine tumours are less prevalent. The third
  difference is mechanistic and is the one this entry models: most MEN4 tumours
  carry no somatic second hit, so the operative mechanism appears to be
  haploinsufficiency for p27 rather than the classical Knudson two-hit
  inactivation that drives MEN1.
notes: >-
  Relation to MEN1. MEN1 is referred to throughout as the comparator that
  defines MEN4 clinically - MEN4 is diagnosed in people with a MEN1-like
  phenotype and no MEN1 variant - and not as a second disease curated here.
  kb/disorders/Multiple_Endocrine_Neoplasia_Type_1.yaml and
  kb/disorders/Multiple_Endocrine_Neoplasia_Type_2.yaml already exist, so this
  entry is their sibling rather than a subtype of either.

  The two-hit question is deliberately not forced. MEN1 is curated in this
  repository as a textbook Knudson two-hit syndrome, and it would be easy to
  copy that shape here. The evidence does not support it: a somatic second hit
  is found in a minority of MEN4 tumours (loss of heterozygosity in 2 of 5 in
  the Danish family's tumours, both parathyroid), and in most reported tumours
  no second hit is found at all, with both alleles still transcribed. Whether
  the operative mechanism is haploinsufficiency or epigenetic silencing of the
  remaining allele is unresolved. The pathophysiology below therefore models a
  dosage mechanism with the second-hit route recorded as the minority branch,
  and this entry does not declare conformance to the germline two-hit module
  that MEN1 conforms to.

  Numbers are given with their denominators rather than pooled. The phenotype
  frequencies differ between the GeneReviews review, the Singeisen systematic
  review (48 symptomatic individuals of 65) and the Chevalier series (29
  symptomatic patients after variant reclassification), because the inclusion
  rules differ - symptomatic only, all carriers, or reclassified class 4/5
  variants only. This entry cites the systematic review for frequency and names
  the others rather than averaging them.

  No formal quality-of-life instrument has ever been applied to MEN4. That is
  a genuine gap rather than an omission.

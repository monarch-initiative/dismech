inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    MEN4 segregates as an autosomal dominant predisposition; most affected
    individuals have an affected parent, and de novo variants occur. Which
    tumours develop, and when, varies widely - 56% of symptomatic individuals
    in the systematic review had only one affected endocrine organ, and 10% had
    four. Asymptomatic carriers are recognised, so penetrance is not complete.
  evidence:
  - reference: PMID:17030811
    reference_title: "Germ-line mutations in p27Kip1 cause a multiple endocrine neoplasia syndrome in rats and humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Expanded pedigree analysis shows that the mutation is associated with the
      development of an MEN1-like phenotype in multiple generations.
    explanation: >-
      The founding human observation, establishing vertical transmission of a
      MEN1-like phenotype with a germline CDKN1B variant.
  - reference: CGGV:assertion_b07f8882-dd5e-4831-9926-f8b4c2a8c265-2018-12-21T154854.477Z

    MEN4 segregates as an autosomal dominant predisposition; most affected
    individuals have an affected parent, and de novo variants occur. Which
    tumours develop, and when, varies widely - 56% of symptomatic individuals
    in the systematic review had only one affected endocrine organ, and 10% had
    four. Asymptomatic carriers are recognised, so penetrance is not complete.

genetic:
- name: CDKN1B
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: CDKN1B
    term:
      id: hgnc:1785
      label: CDKN1B
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_b07f8882-dd5e-4831-9926-f8b4c2a8c265-2018-12-21T154854.477Z

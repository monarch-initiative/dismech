animal_models:
- name: MENX rat (Cdkn1b frameshift)
  species: Rat
  species_term:
    preferred_term: Rat
    term:
      id: NCBITaxon:10116
      label: Rattus norvegicus
  genotype: Cdkn1b homozygous frameshift
  publication: PMID:17030811
  genes:
  - preferred_term: Cdkn1b
    term:
      id: RGD:69062
      label: Cdkn1b
  description: >-
    MENX is a spontaneous multiple endocrine neoplasia-like syndrome in the
    rat, and it is where this disease was found. Mapping the MENX locus
    identified a homozygous Cdkn1b frameshift, and that result is what prompted
    the search for a germline CDKN1B variant in MEN1-mutation-negative
    patients. The model is therefore not a post-hoc recapitulation but the
    origin of the gene-disease hypothesis.
  modeled_mechanisms:
  - target: Germline CDKN1B Loss-of-Function Variant
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      A germline Cdkn1b frameshift causing a dramatic reduction in p27
      protein, with a tumour spectrum overlapping human MEN.
    limitations: >-
      The inheritance does not match. MENX is recessive and the affected rats
      are homozygous, whereas human MEN4 is dominant and patients are
      heterozygous. The rat therefore models near-complete p27 loss rather than
      the reduced-dosage state that the human entry's trunk is built on, which
      is the mechanism most in question.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is near-complete p27 loss in a homozygous animal.
        The human quantity is a roughly halved p27 dose in a heterozygote.
        The deeper deficit stands in for the reduced-dosage state, so the
        model cannot adjudicate haploinsufficiency. This is a choice of
        genotype rather than a limit of the species - a rat can carry a
        heterozygous Cdkn1b allele.
  - target: Reduced Nuclear p27 Dosage
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The frameshift reduces p27 protein, which is the step the human dosage
      model also turns on.
    readouts:
    - name: p27 protein level
      target: Reduced Nuclear p27 Dosage
      direction: DECREASED
      interpretation: >-
        Confirms that the frameshift reduces p27 protein, the step the human
        dosage model also turns on.
      evidence:
      - reference: PMID:17030811
        reference_title: "Germ-line mutations in p27Kip1 cause a multiple endocrine neoplasia syndrome in rats and humans."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          As a consequence of the mutation, MENX-affected rats show dramatic
          reduction in p27(Kip1) protein.
        explanation: >-
          The measured protein consequence in the model.
  evidence:
  - reference: PMID:17030811
    reference_title: "Germ-line mutations in p27Kip1 cause a multiple endocrine neoplasia syndrome in rats and humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The tumor spectrum in MENX overlaps those of human multiple endocrine
      neoplasia (MEN) types 1 and 2.
    explanation: >-
      Establishes the model's phenotypic relevance to human MEN, which is what
      made the mapping result worth pursuing in patients.
discussions:
- discussion_id: men4_haploinsufficiency_vs_silencing
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is tumourigenesis in MEN4 driven by p27 haploinsufficiency, or by
    epigenetic silencing of the retained wild-type CDKN1B allele?
  attaches_to:
  - pathophysiology#Reduced Nuclear p27 Dosage
  - pathophysiology#Somatic Second Hit at CDKN1B
  rationale: >-
    This is the open question the entry is built around, and it is why the
    pathograph models a dosage mechanism with a second-hit branch rather than
    the two-hit trunk used for MEN1. Loss of heterozygosity is observed in a
    minority of tumours; in the rest, p27 is reduced while both alleles remain
    present and transcribed. Two explanations fit that observation equally
    well - true haploinsufficiency, where half the normal dose is not enough in
    a susceptible endocrine cell, or silencing of the remaining allele by a
    mechanism that leaves the sequence intact. They are not distinguishable
    from the published data, and they differ in what they predict: under
    haploinsufficiency no second event is needed, so tumour initiation is a
    matter of cell-type sensitivity to p27 dose, whereas under silencing there
    is still a second hit and it is simply not visible to sequence-based
    assays.
  proposed_experiments:
  - experiment_id: men4_allele_specific_expression
    name: Allele-specific expression and methylation in MEN4 tumours without LOH
    description: >-
      Take MEN4 tumours shown to retain both CDKN1B alleles and ask whether the
      wild-type allele is still transcribed, by allele-specific expression
      assay, and whether its promoter is methylated. Silencing predicts loss of
      wild-type transcript with intact sequence; haploinsufficiency predicts
      both alleles transcribed with p27 protein reduced roughly by half.
    would_support:
    - pathophysiology#Reduced Nuclear p27 Dosage
    supporting_outcome:
    - >-
      Both alleles transcribed at comparable levels with p27 protein reduced
      and no promoter methylation.
    would_refute:
    - pathophysiology#Reduced Nuclear p27 Dosage
    refuting_outcome:
    - >-
      Wild-type transcript absent or strongly reduced with an intact sequence,
      which would make the retained allele functionally lost and restore a
      two-hit reading.

      rate of progression.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    High in pediatric-onset TUBB4A leukodystrophy. The infantile forms
    involve loss of ambulation, refractory dystonia, dysarthria and dysphonia
    requiring speech therapy and often gastrostomy, and lifelong dependence on
    adaptive equipment and multidisciplinary care. Surveillance requirements are
    substantial: swallowing and feeding evaluation to reduce aspiration risk,
    nutritional support, orthopaedic assessment for joint dislocation and
    scoliosis, and annual neurologic and cardiac review. The 58-caregiver burden
    study applies to pediatric-onset leukodystrophy and is not generalized to
    DYT-TUBB4A, whose burden profile can be materially different.
  evidence:

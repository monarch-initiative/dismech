inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A heterozygous pathogenic TUBB4A variant is sufficient across the spectrum,
    but origin differs by subtype. H-ABC is usually simplex and de novo; parental
    somatic mosaicism has been documented, so recurrence risk is not zero after
    negative parental blood testing. DYT-TUBB4A is usually inherited and was
    mapped in a multigenerational family. An affected individual has a 50% chance
    of transmitting the variant to each child.
  evidence:
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TUBB4A-related neurologic disorders are inherited in an autosomal dominant
      manner.
    explanation: >-
      GeneReviews states the inheritance mode for the whole phenotypic spectrum.
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis is established in a proband with characteristic clinical
      and/or brain MRI findings and a heterozygous TUBB4A pathogenic variant
      identified by molecular genetic testing.
    explanation: >-
      Confirms that a single heterozygous variant is sufficient for diagnosis.
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 11 patients described in that publication had the same heterozygous
      c.745G>A (p.D249N) mutation, which was a de novo change in all patients
      studied, except in one family where somatic mosaicism was detected in the
      clinically unaffected mother.
    explanation: >-
      Documents both the usual de novo H-ABC origin and the parental-mosaicism
      exception; this evidence is not generalized to DYT-TUBB4A.
  - reference: PMID:23595291
    reference_title: Whispering dysphonia (DYT4 dystonia) is caused by a mutation in the TUBB4 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A study was undertaken to identify the gene underlying DYT4 dystonia, a
      dominantly inherited form of spasmodic dysphonia combined with other focal
      or generalized dystonia and a characteristic facies and body habitus, in an
      Australian family.
    explanation: >-
      Establishes the inherited familial pattern at the DYT-TUBB4A pole.
pathophysiology:
- name: Altered Beta-Tubulin 4A (TUBB4A) Function
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense variants alter the brain-enriched beta-tubulin 4A
    isotype, but this locus-level trigger does not imply one downstream mechanism.
    H-ABC and DYT-associated alleles have divergent cellular effects, so the
    graph immediately separates an H-ABC oligodendrocyte/grey-matter branch from
    a cautious DYT neuronal branch.
  genetic_context:
    functional_impact_category: UNKNOWN
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      UNKNOWN is deliberate at the umbrella level. p.Arg2Trp and p.Asp249Asn were
      interpreted as antimorphic, p.Gln424His showed a gain-of-function growth
      pattern, and p.Arg2Gly showed no prominent dynamics change. p.Cys239Phe and
      p.Arg262His are established H-ABC alleles without equivalent functional
      testing in the cached evidence. Variant origin is omitted because H-ABC is
      usually de novo whereas DYT-TUBB4A is often inherited.
  genes:
  - preferred_term: TUBB4A
    term:
      id: hgnc:20774
      label: TUBB4A
  evidence:
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using live-cell imaging of disease-relevant oligodendrocytes and total
      internal reflection fluorescence microscopy of whole-cell lysates, we
      observed divergent impact on microtubule polymerization and microtubule
      integration, partially reflecting the observed pleiotropy.
    explanation: >-
      Establishes both the molecular lesion (perturbed polymerization and
      incorporation) and its non-uniformity across disease-causing alleles.
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Moreover, in silico simulations demonstrated that the mutants rarely adopted
      a straight heterodimer conformation in contrast to wild type.
    explanation: >-
      Structural evidence for allele-specific conformational effects; it is not
      used to assign one functional-impact category across the spectrum.
  downstream:
  - target: H-ABC Antimorphic Microtubule Dysfunction
    causal_link_type: DIRECT
    description: >-
      The studied p.Arg2Trp and p.Asp249Asn H-ABC alleles reduce incorporation and
      microtubule growth and were interpreted as antimorphic.
  - target: DYT-TUBB4A-Associated Neuronal Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      DYT alleles act through a distinct neuronal route, but p.Arg2Gly and
      p.Gln424His do not share one experimentally established molecular effect.
- name: H-ABC Antimorphic Microtubule Dysfunction
  role: TRIGGER
  biological_scale: MOLECULAR
  subtypes:
  - H-ABC
  conforms_to: "cns_myelin_failure#Oligodendrocyte-Lineage or Myelin-Membrane Insult"
  description: >-
    In the studied H-ABC alleles p.Arg2Trp and p.Asp249Asn, mutant heterodimers
    incorporate less efficiently, grow more slowly, and can act as steric blocks
    during assembly. This antimorphic mechanism is limited to those tested
    alleles; it is not assigned to p.Cys239Phe or p.Arg262His merely because they
    also cause H-ABC.
  genetic_context:
    functional_impact_category: DOMINANT_NEGATIVE
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      Applies to the experimentally studied H-ABC p.Arg2Trp and p.Asp249Asn
      substitutions. The functional category records their reported antimorphic
      behavior and is not a spectrum-wide assertion.
  genes:
  - preferred_term: TUBB4A
    term:
      id: hgnc:20774
      label: TUBB4A
  evidence:
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Therefore, we suggest an antimorphic conformational change in the H-ABC
      mutants, but not to a complete loss of function of the affected tubulin
      heterodimers. Hence, the H-ABC mutants might act as steric hindrances during
      microtubule assembly.
    explanation: >-
      Supplies the antimorphic interpretation for the tested H-ABC variants.
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      On the other side of the phenotypic spectrum, the H-ABC-causing mutations
      p.R2W and p.D249N showed significantly reduced growth dynamics.
    explanation: >-
      Directly identifies the two H-ABC alleles to which the reduced-growth claim
      applies.
  downstream:
  - target: Oligodendrocyte Dysfunction and Myelin Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired microtubule assembly and oligodendrocyte process formation
    description: >-
      Severe microtubule-dynamics disruption impairs oligodendrocyte maturation
      and myelin production.
  - target: Basal Ganglia and Cerebellar Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      H-ABC also has a parallel neuronal/grey-matter arm, but its route from the
      allele-specific tubulin defect is not resolved.
- name: DYT-TUBB4A-Associated Neuronal Dysfunction
  biological_scale: CELLULAR
  subtypes:
  - DYT-TUBB4A
  description: >-
    The DYT-associated p.Arg2Gly allele altered neuronal morphology while leaving
    tubulin quantity, polymerization, oligodendrocyte morphology, and myelin-gene
    expression unchanged in the reported cellular study. p.Gln424His instead
    increased microtubule growth dynamics, consistent with gain of function.
    These allele-specific observations support a neuronal branch independent of
    H-ABC myelin failure, but do not yet establish a single intervening pathway.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:28973395
    reference_title: TUBB4A mutations result in specific neuronal and oligodendrocytic defects that closely match clinically distinct phenotypes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, the DYT4 mutation that leads to phenotypes attributable to neuronal
      dysfunction results in altered neuronal morphology, but with unchanged
      tubulin quantity and polymerization, with normal oligodendrocyte morphology
      and myelin gene expression.
    explanation: >-
      Supports a neuronal, non-myelin route for p.Arg2Gly without asserting a
      microtubule-dynamics defect.
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      When compared to WT TUBB4A, the dystonia-associated mutants showed either
      no differences (p.R2G) or considerably increased growth dynamics (p.Q424H).
    explanation: >-
      Preserves the different functional results for the two tested DYT alleles.
  downstream:
  - target: Dystonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The neuronal defect is associated with generalized dystonia.
  - target: Laryngeal Dystonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Laryngeal involvement produces the characteristic whispering dysphonia.
  - target: Dysphonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Voice impairment is a cardinal manifestation of DYT-TUBB4A.
- name: Oligodendrocyte Dysfunction and Myelin Failure
  subtypes:
  - H-ABC
  conforms_to: "cns_myelin_failure#Oligodendrocyte Differentiation Arrest and Death"
  biological_scale: CELLULAR
  description: >-
    In H-ABC, oligodendrocyte differentiation, process formation, and myelin
    production are impaired. The D249N allelic mouse series identifies Mbp mRNA
    transport from the oligodendrocyte soma to the sheath as one vulnerable
    microtubule-dependent function. The A302T taiep rat instead shows increased
    tubulin post-translational modifications associated with stability, warning
    that the direction of microtubule disturbance and the neuronal contribution
    are allele- and model-specific rather than universal.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: DECREASED
  - preferred_term: microtubule-based transport
    term:
      id: GO:0099111
      label: microtubule-based transport
    modifier: DECREASED
  evidence:
  - reference: PMID:41566774
    reference_title: Therapeutic suppression of Tubb4a rescues H-ABC leukodystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, the microtubule function of Mbp mRNA transport from the OL
      soma to the myelin sheath is retained.
    explanation: >-
      Identifies the specific microtubule-dependent oligodendrocyte function at
      stake - Mbp mRNA transport to the sheath - by showing it is preserved when
      the mutant transcript is suppressed.
  - reference: PMID:42044700
    reference_title: H-ABC tubulinopathy exhibits a cytoskeletal defect associated with microtubule stability.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Compared to controls, taiep rats displayed significantly elevated levels
      of tubulin acetylation and detyrosination within white matter regions.
    explanation: >-
      Animal-model evidence for an oligodendrocyte cytoskeletal defect associated
      with microtubule stability; it is not classified as an in-vitro result.
  downstream:
  - target: CNS Hypomyelination
    causal_link_type: DIRECT
    description: >-
      Failure of oligodendrocyte myelin production produces the hypomyelination
      seen on MRI.
  - target: Progressive Motor and Bulbar Decline
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - deficient CNS myelin and impaired long-tract conduction
    description: >-
      Loss of myelinated-tract function contributes to the H-ABC motor decline,
      alongside the parallel grey-matter arm.
- name: Basal Ganglia and Cerebellar Neurodegeneration
  subtypes:
  - H-ABC
  biological_scale: TISSUE
  description: >-
    H-ABC has a grey-matter arm parallel to hypomyelination. The common pattern
    includes progressive caudate, putaminal, and cerebellar atrophy, but it is not
    obligatory: a p.Arg262His patient retained stable caudate and putaminal size
    over seven years, and mild thalamic atrophy occurred in other followed
    patients. The D249N mouse shows striatal and cerebellar granule-neuron loss.
    This node is H-ABC-specific and is not used to explain DYT-TUBB4A, which can
    have normal neuroimaging.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:32463361
    reference_title: TUBB4A mutations result in both glial and neuronal degeneration in an H-ABC leukodystrophy mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additionally, a significant loss occurs in the cerebellar granular
      neurons and striatal neurons in Tubb4aD249N/D249N mice.
    explanation: >-
      Reports measured loss of cerebellar granule and striatal neurons, the
      neuronal arm of this node.
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A subset of individuals with late-infantile onset progress to
      hypomyelination with atrophy of the basal ganglia and cerebellum.
    explanation: >-
      Documents the structural atrophy of basal ganglia and cerebellum that
      occurs in a subset of the spectrum.
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The second novel mutation, p.R262H, was found in a patient with a typical
      clinical presentation for H-ABC, but with a novel neuroimaging phenotype,
      given the absence of atrophy of the putamen and caudate nucleus despite 7
      years of follow-up.
    explanation: >-
      Directly prevents the common atrophy pattern from being modeled as
      obligatory or diagnostic.
  downstream:
  - target: Dystonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Striatal pathology plausibly contributes to H-ABC dystonia, but the
      patient-level route is not demonstrated.
  - target: Ataxia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - cerebellar neuronal loss and circuit dysfunction
    description: Cerebellar degeneration produces ataxia, intention tremor and dysmetria.
  - target: Cerebellar Atrophy
    causal_link_type: DIRECT
    description: The structural correlate of the cerebellar arm.
  - target: Abnormal Basal Ganglia Morphology
    causal_link_type: DIRECT
    description: >-
      The structural correlate of the caudate and putaminal arm, with documented
      exceptions and no claim of universal thalamic sparing.
  - target: Progressive Motor and Bulbar Decline
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - striatal and cerebellar circuit dysfunction
    description: >-
      Extrapyramidal and cerebellar degeneration contribute to the progressive
      decline in motor and bulbar function.
- name: CNS Hypomyelination
  subtypes:
  - H-ABC
  conforms_to: "cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath"
  biological_scale: TISSUE
  description: >-
    Deficient CNS myelin is characteristic of H-ABC and other pediatric TUBB4A
    presentations, but severity varies. In the three longitudinally imaged H-ABC
    patients in PMID:24706558 it was generalized in two and focal and milder in
    one. That three-patient observation is not converted into an obligatory
    frequency claim for H-ABC or the umbrella disorder.
  evidence:
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Brain imaging at the time of developmental loss typically identifies
      hypomyelination.
    explanation: >-
      Establishes hypomyelination as the characteristic imaging finding at the
      point of clinical decline.
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypomyelination was found in all patients and was generalized in Patients 1
      (Fig. 1B,D) and 2 (Fig. 1F,H), but focal and milder in Patient 3.
    explanation: >-
      Establishes variable extent in the three longitudinally studied patients;
      it does not establish a population-wide obligatory frequency.
  downstream:
  - target: CNS Hypomyelination Phenotype
    causal_link_type: DIRECT
    description: The MRI-defined phenotype itself.
- name: Progressive Motor and Bulbar Decline
  subtypes:
  - H-ABC
  biological_scale: ORGANISM
  description: >-
    The H-ABC clinical endpoint combines four systems:
    pyramidal tracts (spasticity, brisk reflexes, Babinski), extrapyramidal
    system (rigidity, dystonia, choreoathetosis, oculogyric crisis, perioral
    dyskinesia), cerebellum (ataxia, intention tremor, dysmetria) and bulbar
    function (dysarthria, dysphonia, swallowing). It intentionally does not
    conform to the white-matter module because the grey- and white-matter arms
    both contribute.
  evidence:
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Progressive neurologic findings reflect involvement of the pyramidal tracts
      (spasticity, brisk deep tendon reflexes, and Babinski sign), extrapyramidal
      system (rigidity, dystonia, choreoathetosis, oculogyric crisis, and perioral
      dyskinesia), cerebellum (ataxia, intention tremor, dysmetria), and bulbar
      function (dysarthria, dysphonia, and swallowing).
    explanation: >-
      Enumerates the four systems whose progressive involvement constitutes the
      clinical decline.
  downstream:
  - target: Spasticity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - pyramidal tract dysfunction
    description: Pyramidal tract involvement.
  - target: Dysarthria
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - bulbar and cerebellar motor dysfunction
    description: Bulbar involvement.
  - target: Dysphonia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - bulbar motor dysfunction
    description: Voice impairment from bulbar involvement in H-ABC.
  - target: Dysphagia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - bulbar swallowing dysfunction
    description: Progressive bulbar involvement impairs swallowing.
  - target: Rigidity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - extrapyramidal circuit dysfunction
    description: Extrapyramidal involvement produces rigidity.
  - target: Choreoathetosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - extrapyramidal circuit dysfunction
    description: Extrapyramidal involvement produces choreoathetosis.
  - target: Intention Tremor
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - cerebellar circuit dysfunction
    description: Cerebellar involvement produces intention tremor.
  - target: Dysmetria
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - cerebellar circuit dysfunction
    description: Cerebellar involvement produces dysmetria.
  - target: Developmental Regression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of previously acquired milestones is the presenting event in the
      late-infantile form.
  - target: Loss of Ambulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - progressive pyramidal, extrapyramidal, and cerebellar dysfunction
    description: Motor decline typically costs independent walking.
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hypotonia occurs in severe pediatric presentations.
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Seizures occur in a minority of H-ABC patients.
  - target: Nystagmus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The route to the oculomotor finding is not established.
  - target: Sensorineural Hearing Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The route to hearing impairment is not established.
has_subtypes:
- name: H-ABC
  display_name: Hypomyelination with atrophy of the basal ganglia and cerebellum (HLD6)
  classification: clinical_phenotype
  subtype_term:
    preferred_term: leukodystrophy, hypomyelinating, 6
    term:
      id: MONDO:0012905
      label: "leukodystrophy, hypomyelinating, 6"
  description: >-
    The ontology-grounded H-ABC/HLD6 subtype, typically pediatric onset with
    progressive pyramidal, extrapyramidal, cerebellar, and bulbar dysfunction.
    Hypomyelination and caudate, putaminal, or cerebellar atrophy are important
    imaging features but are variable over time and by allele; p.Arg262His was
    associated with typical clinical H-ABC without caudate or putaminal atrophy
    after seven years. MONDO:0012905 is retained only here and does not make the
    umbrella disorder synonymous with a leukodystrophy.
  genes:
  - preferred_term: TUBB4A
    term:
      id: hgnc:20774
      label: TUBB4A
  evidence:
  - reference: PMID:41566774
    reference_title: Therapeutic suppression of Tubb4a rescues H-ABC leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recurring variant p.Asp249Asn (D249N) presents in infancy with
      dystonia, communication deficits, and loss of ambulation during the first
      decade of life.
    explanation: >-
      Characterizes the recurrent H-ABC allele and its clinical course.
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The second novel mutation, p.R262H, was found in a patient with a typical
      clinical presentation for H-ABC, but with a novel neuroimaging phenotype,
      given the absence of atrophy of the putamen and caudate nucleus despite 7
      years of follow-up.
    explanation: >-
      Establishes that the eponymous basal-ganglia atrophy is not obligatory.
- name: DYT-TUBB4A
  display_name: DYT-TUBB4A (DYT4 dystonia, whispering dysphonia)
  classification: clinical_phenotype
  description: >-
    Juvenile- or adult-onset dystonia, historically DYT4, commonly featuring
    laryngeal dystonia and whispering dysphonia. Familial inheritance is well
    documented, and neuroimaging can be normal. No subtype ontology term is
    assigned because none is available in the frozen local term cache.

pathophysiology:
- name: Altered Beta-Tubulin 4A (TUBB4A) Function
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Heterozygous variants alter TUBB4A, the brain-specific beta-tubulin 4A
    isotype. Unlike the cortical-malformation tubulinopathies, the affected
    isotype's critical expression is in oligodendrocytes and in basal ganglia and
    cerebellar neurons rather than in migrating cortical neurons. The variants
    perturb microtubule polymerization and the mutant subunit's incorporation into
    the microtubule network, and in silico the mutant heterodimers rarely adopt
    the straight conformation of wild type. Crucially the perturbation is not
    uniform: variants causing dystonia and variants causing H-ABC have divergent
    molecular effects, which is what makes this a genuinely pleiotropic locus
    rather than a single mechanism read out at different severities.
  genetic_context:
    functional_impact_category: UNKNOWN
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      Disease alleles are heterozygous missense variants. The mechanism class is
      recorded as UNKNOWN deliberately, and the reason is specific to this locus:
      the two clinical poles have DIFFERENT molecular effects, so a single
      functional_impact_category cannot be correct for the gene as a whole.
      Severity does track with the ratio of mutant to preserved wild-type tubulin
      in an allelic mouse series, which is a dose-dependent dominant effect, but
      whether that is dominant-negative poisoning or a gain of an aberrant
      function has not been resolved and may differ between the dystonia and
      H-ABC alleles. See the gap_tubb4a_pleiotropy_mechanism discussion.
  genes:
  - preferred_term: TUBB4A
    term:
      id: hgnc:20774
      label: TUBB4A
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: microtubule polymerization
    term:
      id: GO:0046785
      label: microtubule polymerization
    modifier: DYSREGULATED
  - preferred_term: microtubule cytoskeleton organization
    term:
      id: GO:0000226
      label: microtubule cytoskeleton organization
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using live-cell imaging of disease-relevant oligodendrocytes and total
      internal reflection fluorescence microscopy of whole-cell lysates, we
      observed divergent impact on microtubule polymerization and microtubule
      integration, partially reflecting the observed pleiotropy.
    explanation: >-
      Establishes both the molecular lesion (perturbed polymerization and
      incorporation) and its non-uniformity across disease-causing alleles.
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Moreover, in silico simulations demonstrated that the mutants rarely adopted
      a straight heterodimer conformation in contrast to wild type.
    explanation: >-
      Structural correlate of the polymerization defect - mutant heterodimers do
      not hold the geometry a straight protofilament requires.
  - reference: PMID:42044700
    reference_title: H-ABC tubulinopathy exhibits a cytoskeletal defect associated with microtubule stability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings suggest a link between H-ABC and greater microtubule
      stability in oligodendrocytes, a change that may limit their ability to
      properly myelinate axons
    explanation: >-
      Independent evidence that the H-ABC lesion is one of excessive microtubule
      stability in oligodendrocytes, complementing the polymerization findings.
  downstream:
  - target: Oligodendrocyte Dysfunction and Myelin Failure
    description: >-
      Perturbed microtubule function in oligodendrocytes compromises the
      microtubule-dependent transport required to build and maintain myelin.
  - target: Basal Ganglia and Cerebellar Neurodegeneration
    description: >-
      The same lesion drives degeneration of basal ganglia and cerebellar
      neurons, an arm that is separate from the myelin arm rather than downstream
      of it.
- name: Oligodendrocyte Dysfunction and Myelin Failure
  biological_scale: CELLULAR
  description: >-
    Oligodendrocytes fail to produce and maintain normal myelin. The
    microtubule-dependent step identified in the mouse model is transport of Mbp
    (myelin basic protein) mRNA from the oligodendrocyte soma out to the myelin
    sheath - a cargo-delivery function that a destabilized microtubule network
    cannot perform. The result is hypomyelination rather than demyelination:
    myelin is never adequately laid down, which is why brain imaging at the time
    of developmental loss shows hypomyelination.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: DECREASED
  - preferred_term: microtubule-based transport
    term:
      id: GO:0099111
      label: microtubule-based transport
    modifier: DECREASED
  evidence:
  - reference: PMID:41566774
    reference_title: Therapeutic suppression of Tubb4a rescues H-ABC leukodystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, the microtubule function of Mbp mRNA transport from the OL
      soma to the myelin sheath is retained.
    explanation: >-
      Identifies the specific microtubule-dependent oligodendrocyte function at
      stake - Mbp mRNA transport to the sheath - by showing it is preserved when
      the mutant transcript is suppressed.
  - reference: PMID:32463361
    reference_title: TUBB4A mutations result in both glial and neuronal degeneration in an H-ABC leukodystrophy mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additionally, a significant loss occurs in the cerebellar granular
      neurons and striatal neurons in Tubb4aD249N/D249N mice.
    explanation: >-
      Documents neuronal loss in striatum and cerebellar granule layer
      alongside the myelin deficit, which is why this entry curates the myelin
      and neurodegeneration arms as parallel branches rather than one downstream
      of the other.
  downstream:
  - target: CNS Hypomyelination
    description: >-
      Failure of oligodendrocyte myelin production produces the hypomyelination
      seen on MRI.
  - target: Progressive Motor and Bulbar Decline
    description: >-
      Loss of myelinated tract function contributes to the progressive pyramidal,
      extrapyramidal, cerebellar and bulbar findings.
- name: Basal Ganglia and Cerebellar Neurodegeneration
  biological_scale: TISSUE
  description: >-
    A parallel neuronal arm. Basal ganglia and cerebellar neurons degenerate,
    producing the atrophy that gives H-ABC the second half of its name and that
    underlies the dystonia, choreoathetosis, rigidity and ataxia of the clinical
    picture. Mouse modelling shows the degeneration is genuinely neuronal as well
    as glial, so this is not simply a consequence of the myelin defect. In the
    milder adult-onset dystonia form, this arm dominates and the myelin arm may be
    clinically silent.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:32463361
    reference_title: TUBB4A mutations result in both glial and neuronal degeneration in an H-ABC leukodystrophy mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additionally, a significant loss occurs in the cerebellar granular
      neurons and striatal neurons in Tubb4aD249N/D249N mice.
    explanation: >-
      Reports measured loss of cerebellar granule and striatal neurons, the
      neuronal arm of this node.
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A subset of individuals with late-infantile onset progress to
      hypomyelination with atrophy of the basal ganglia and cerebellum.
    explanation: >-
      Documents the structural atrophy of basal ganglia and cerebellum that
      defines the H-ABC presentation.
  downstream:
  - target: Dystonia
    description: >-
      Basal ganglia degeneration produces the extrapyramidal movement disorder
      that dominates most presentations.
  - target: Ataxia
    description: Cerebellar degeneration produces ataxia, intention tremor and dysmetria.
  - target: Cerebellar Atrophy
    description: The structural correlate of the cerebellar arm.
  - target: Progressive Motor and Bulbar Decline
    description: >-
      Extrapyramidal and cerebellar degeneration contribute to the progressive
      decline in motor and bulbar function.
- name: CNS Hypomyelination
  biological_scale: TISSUE
  description: >-
    The radiological signature. Brain MRI at the time of developmental loss
    typically shows hypomyelination, which is the finding that brings TUBB4A into
    the differential in a child losing milestones.
  evidence:
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Brain imaging at the time of developmental loss typically identifies
      hypomyelination.
    explanation: >-
      Establishes hypomyelination as the characteristic imaging finding at the
      point of clinical decline.
  downstream:
  - target: CNS Hypomyelination Phenotype
    description: The MRI-defined phenotype itself.
- name: Progressive Motor and Bulbar Decline
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint, and the reason this disorder is described as
    progressive where the cortical-malformation tubulinopathies are static. The
    decline reflects four anatomically distinct systems failing together:
    pyramidal tracts (spasticity, brisk reflexes, Babinski), extrapyramidal
    system (rigidity, dystonia, choreoathetosis, oculogyric crisis, perioral
    dyskinesia), cerebellum (ataxia, intention tremor, dysmetria) and bulbar
    function (dysarthria, dysphonia, swallowing). Rate of progression varies with
    disease severity.
  evidence:
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Progressive neurologic findings reflect involvement of the pyramidal tracts
      (spasticity, brisk deep tendon reflexes, and Babinski sign), extrapyramidal
      system (rigidity, dystonia, choreoathetosis, oculogyric crisis, and perioral
      dyskinesia), cerebellum (ataxia, intention tremor, dysmetria), and bulbar
      function (dysarthria, dysphonia, and swallowing).
    explanation: >-
      Enumerates the four systems whose progressive involvement constitutes the
      clinical decline.
  downstream:
  - target: Spasticity
    description: Pyramidal tract involvement.
  - target: Dysarthria and Dysphonia
    description: Bulbar involvement.
  - target: Developmental Regression
    description: >-
      Loss of previously acquired milestones is the presenting event in the
      late-infantile form.
  - target: Loss of Ambulation
    description: Motor decline typically costs independent walking.

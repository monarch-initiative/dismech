genetic:
- name: TUBB4A
  association: Causative
  gene_term:
    preferred_term: TUBB4A (beta-tubulin 4A)
    term:
      id: hgnc:20774
      label: TUBB4A
  notes: >-
    TUBB4A encodes the brain-specific beta-tubulin 4A isotype. It is a pleiotropic
    locus in which heterozygous missense variants produce H-ABC, other pediatric
    hypomyelinating presentations, or DYT-TUBB4A. p.Arg2Trp and p.Asp249Asn have
    tested antimorphic effects; p.Gln424His alone has an explicit gain-of-function
    result; p.Arg2Gly lacks a prominent microtubule-dynamics defect. p.Cys239Phe
    and p.Arg262His are preserved as H-ABC alleles without importing a mechanism
    from the tested variants.
  evidence:
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in the brain-specific β-tubulin 4A (TUBB4A) gene cause a broad
      spectrum of diseases, ranging from dystonia (DYT-TUBB4A) to hypomyelination
      with atrophy of the basal ganglia and cerebellum (H-ABC).
    explanation: >-
      Establishes TUBB4A as causative across the full phenotypic spectrum this
      entry curates. This framing statement is a literature summary, so OTHER is
      used rather than HUMAN_CLINICAL.
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A p.C239F mutation was found in one of the originally described H-ABC
      patients, for whom we provide follow-up 11 years after the original
      publication. The second novel mutation, p.R262H, was found in a patient
      with a typical clinical presentation for H-ABC
    explanation: >-
      Preserves both additional H-ABC alleles without assigning them the
      functional results measured for p.Arg2Trp or p.Asp249Asn.
  - reference: PMID:23595291
    reference_title: Whispering dysphonia (DYT4 dystonia) is caused by a mutation in the TUBB4 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genome sequencing revealed a missense variant in the TUBB4 (tubulin
      beta-4; Arg2Gly) gene as the likely cause of disease.
    explanation: Establishes the familial p.Arg2Gly DYT allele.
diagnosis:
- name: Brain magnetic resonance imaging
  description: >-
    MRI can identify hypomyelination and, in H-ABC, caudate, putaminal, or
    cerebellar atrophy. These findings raise suspicion but are not obligatory:
    an H-ABC p.Arg262His case lacked caudate and putaminal atrophy after seven

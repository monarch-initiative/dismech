progression:
- phase: Onset, spanning infancy to adulthood
  age_range: Infancy to adulthood
  notes: >-
    Onset age is the primary axis of the spectrum: early-infantile gives
    hypomyelination with developmental stagnation, encephalopathy, seizures and
    hypotonia; late-infantile gives acquisition then regression with dystonia;
    juvenile or adult onset gives milder disease including isolated dystonia.
  evidence:
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TUBB4A-related neurologic disorders comprise a phenotypic spectrum ranging
      in onset from infancy to adulthood.
    explanation: States the onset range that structures the whole spectrum.
- phase: Progressive multi-system neurologic decline
  age_range: Variable, following onset
  notes: >-
    Pyramidal, extrapyramidal, cerebellar and bulbar systems become progressively
    involved. Rate of progression varies with disease severity. Cognition is
    variably affected and usually less severely than motor function - a point
    that matters for goal-setting, since communication and comprehension may
    substantially outrun motor capacity.
  evidence:

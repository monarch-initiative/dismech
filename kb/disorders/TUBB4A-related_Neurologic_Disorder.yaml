clinical_burden:
  burden_level: HIGH
  rationale: >-
    High across most of the spectrum. The infantile and late-infantile forms
    involve loss of ambulation, refractory dystonia, dysarthria and dysphonia
    requiring speech therapy and often gastrostomy, and lifelong dependence on
    adaptive equipment and multidisciplinary care. Surveillance requirements are
    substantial: swallowing and feeding evaluation to reduce aspiration risk,
    nutritional support, orthopaedic assessment for joint dislocation and
    scoliosis, and annual neurologic and cardiac review. The adult-onset dystonia
    form is materially less impairing.
  evidence:
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Routine evaluations of swallowing and feeding to reduce the risk of
      aspiration; nutritional support to prevent malnutrition; orthopedic
      assessment to detect musculoskeletal issues including joint dislocations
      and scoliosis.
    explanation: >-
      The surveillance schedule is a direct measure of the ongoing care burden.

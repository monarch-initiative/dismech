- name: Tubb4a-suppressing antisense oligonucleotide (preclinical)
  description: >-
    The first disease-modifying strategy, and preclinical only. The rationale
    comes from an allelic mouse series showing that disease severity correlates
    with mutant Tubb4a expression and with relative preservation of wild-type
    tubulin - so lowering the mutant transcript should help even without repairing
    it. A single intracerebroventricular dose of a Tubb4a-targeted ASO in
    postnatal Tubb4a D249N/KO mice drastically extended lifespan, improved motor
    phenotypes, reduced seizures, prevented myelin and oligodendrocyte loss, and
    recovered visual evoked potential latencies. A stated limitation is that the
    ASO fails to reach cerebellar granule neurons by any tested route, so the
    cerebellar arm of the disease may be untreated by this approach. There is no
    human trial; this must not be curated anywhere as an available therapy.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  aso_details:
    aso_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: TUBB4A
      term:
        id: hgnc:20774
        label: TUBB4A
    target_transcript: Tubb4a mRNA
  target_mechanisms:
  - target: Altered Beta-Tubulin 4A (TUBB4A) Function
    treatment_effect: INHIBITS
    description: >-
      Selectively reducing Tubb4a transcript lowers the mutant subunit burden at
      the trigger node, shifting the mutant-to-wild-type tubulin ratio that
      severity tracks with.
    evidence:
    - reference: PMID:41566774
      reference_title: Therapeutic suppression of Tubb4a rescues H-ABC leukodystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we identified a well-tolerated Tubb4a-targeted antisense oligonucleotide
        (ASO) candidate that selectively reduces Tubb4a
      explanation: >-
        Establishes the agent and its mechanism of action on this node -
        selective reduction of the Tubb4a transcript.
  evidence:
  - reference: PMID:41566774
    reference_title: Therapeutic suppression of Tubb4a rescues H-ABC leukodystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, single intracerebroventricular administration of ASO in postnatal
      Tubb4aD249N/KO mice drastically extends its lifespan, improves motor
      phenotypes, and reduces seizures.
    explanation: >-
      Reports the efficacy readouts of the preclinical proof of concept.
  - reference: PMID:41566774
    reference_title: Therapeutic suppression of Tubb4a rescues H-ABC leukodystrophy.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A major limitation we noted is that ASOs fail to target cerebellar granule
      neurons even with multiple routes of administration in the brain.
    explanation: >-
      The authors' own stated limitation, recorded so the cerebellar gap is not
      lost when this strategy is cited.
  notes: >-
    Preclinical mouse proof-of-concept only as of 2026-08. The authors describe it
    as the first preclinical proof-of-concept for Tubb4a suppression via ASO as a
    disease-modifying therapy for H-ABC.

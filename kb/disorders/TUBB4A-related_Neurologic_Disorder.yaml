discussions:
- discussion_id: gap_tubb4a_pleiotropy_mechanism
  prompt: >-
    Why do TUBB4A variants in the same gene produce either isolated adult-onset
    dystonia or infantile hypomyelinating leukodystrophy, and is a single
    functional_impact_category ever correct for this locus?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Beta-Tubulin 4A (TUBB4A) Function
  - pathophysiology#H-ABC Antimorphic Microtubule Dysfunction
  - pathophysiology#DYT-TUBB4A-Associated Neuronal Dysfunction
  rationale: >-
    TUBB4A is the clearest pleiotropy problem in the tubulin family. Two
    observations pull in different directions. On one hand, the dystonia-causing
    variants (p.R2G, p.Q424H) and the H-ABC-causing variants (p.R2W, p.D249N) have
    demonstrably divergent effects on microtubule polymerization and on
    incorporation into the network in disease-relevant oligodendrocytes - which
    argues the two poles are mechanistically distinct, not one mechanism at two
    doses. Note the pointed detail that R2G and R2W affect the SAME residue and
    fall on opposite clinical poles. On the other hand, an allelic mouse series
    shows severity correlating cleanly with mutant expression and preserved
    wild-type tubulin, which is exactly what a single dose-dependent mechanism
    would look like. Both cannot be the whole story. The authors of the divergence
    study are careful to say the mechanisms explain the pleiotropy only
    "partially". Until this resolves, this entry records
    functional_impact_category as UNKNOWN rather than picking a value that would
    be wrong for half the alleles, and curators should not import a mechanism
    class from another tubulin gene by analogy.
  evidence:
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we investigated whether TUBB4A mutations causing either DYT-TUBB4A
      (p.R2G and p.Q424H) or H-ABC (p.R2W and p.D249N) exhibit differential
      effects at the molecular and cellular levels.
    explanation: >-
      Names the allele pairs, including the two different substitutions at
      residue 2 that fall on opposite clinical poles.
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      In conclusion, for most of the examined variants, we deciphered potential
      molecular disease mechanisms that may lead to the diverse clinical
      manifestations and phenotype severity across and within each TUBB4A-related
      disease.
    explanation: >-
      The authors' own hedging - potential mechanisms, most variants - which is
      why this stays an open gap.
  - reference: PMID:41566774
    reference_title: Therapeutic suppression of Tubb4a rescues H-ABC leukodystrophy.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      disease severity correlates with the expression of mutant Tubb4a and
      relative preservation of wild-type tubulin
    explanation: >-
      The dose-dependent evidence that pulls against a purely allele-specific
      mechanism model.
- discussion_id: gap_tubb4a_cerebellar_aso_gap
  prompt: >-
    Can a Tubb4a-suppressing ASO reach cerebellar granule neurons, and if not,
    does the cerebellar arm of H-ABC remain untreated by an otherwise effective
    therapy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Basal Ganglia and Cerebellar Neurodegeneration
  rationale: >-
    The ASO proof-of-concept is striking on the myelin arm - extended lifespan,
    improved motor phenotypes, fewer seizures, preserved oligodendrocytes and
    myelin. But the authors flag one failure plainly: the ASO does not reach
    cerebellar granule neurons by any route of brain administration they tried.
    That matters more here than it would for a disorder with a single mechanism,
    because this entry curates cerebellar degeneration as a parallel arm rather
    than as a consequence of demyelination - the mouse work shows both glial and
    neuronal degeneration. If the arms are truly parallel, an intervention that
    rescues myelin and misses the cerebellum treats part of the disease, and the
    residual cerebellar phenotype would only become visible once the animals live
    long enough to show it. Resolving this needs either a delivery route that
    reaches granule neurons or long-term outcome data in treated animals with
    cerebellar-specific readouts.
  evidence:
  - reference: PMID:41566774
    reference_title: Therapeutic suppression of Tubb4a rescues H-ABC leukodystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A major limitation we noted is that ASOs fail to target cerebellar granule
      neurons even with multiple routes of administration in the brain.
    explanation: The stated delivery failure that defines this gap.
  - reference: PMID:32463361
    reference_title: TUBB4A mutations result in both glial and neuronal degeneration in an H-ABC leukodystrophy mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additionally, a significant loss occurs in the cerebellar granular
      neurons and striatal neurons in Tubb4aD249N/D249N mice.
    explanation: >-
      Cerebellar granule neurons are specifically among the cells lost, which is
      what makes an ASO that cannot reach them consequential.
notes: >-
  Created 2026-08-20 while closing out the tubulin-family disease coverage gap
  identified in docs/reports/tubulinopathies-grouping-review-2026-08-20.md. That
  review named TUBB4A as deliberately out of scope for the Tubulinopathies
  grouping; this entry is the other half of that decision - out of the grouping,
  but not out of the knowledge base.

  Deliberately NOT a member of the Tubulinopathies grouping and NOT conformed to
  microtubule_dependent_neuronal_migration_failure. H-ABC is modeled with a
  postnatal oligodendrocyte/myelin arm and a parallel grey-matter arm, while
  DYT-TUBB4A has an independent cautious neuronal branch. Only the H-ABC myelin
  nodes conform to cns_myelin_failure; neither the grey-matter branch, the mixed
  clinical endpoint, nor the DYT branch conforms.

  functional_impact_category is UNKNOWN at the umbrella trigger by deliberate
  choice - see gap_tubb4a_pleiotropy_mechanism. The H-ABC p.Arg2Trp/p.Asp249Asn
  branch records the reported antimorphic effect, while p.Gln424His alone has an
  explicit gain-of-function result and p.Arg2Gly lacks a prominent dynamics
  change. No mechanism is imported to p.Cys239Phe or p.Arg262His.

  The taiep A302T rat has predominantly oligodendrocyte/white-matter abnormalities
  associated with greater microtubule stability, whereas the homozygous D249N
  mouse has both neuronal and glial degeneration. This model contrast is why the
  two H-ABC arms remain parallel and why neither animal allele is treated as a
  universal model of all TUBB4A disease.

  The ASO treatment is preclinical mouse work only. It is curated with
  target_mechanisms because it acts on a modeled node, but its status is stated in
  the treatment description, its notes, and the linked discussion. It is NOT
  conformed to the antisense_oligonucleotide_therapy module: per the repository's
  curation guidance, new conformance to that module's RNase-H knockdown branch is
  deferred pending a separate trigger/evidence audit.

  All evidence snippets are quoted from existing local reference-cache content,
  none from titles. No reference cache was fetched or edited for this review.

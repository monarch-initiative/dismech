name: TUBB4A-related Neurologic Disorder
creation_date: "2026-08-20T16:00:00Z"
category: Mendelian
disease_term:
  preferred_term: TUBB4A-related neurologic disorder
  term:
    id: MONDO:0800470
    label: TUBB4A-related neurologic disorder
description: >-
  TUBB4A-related neurologic disorder is an autosomal dominant allelic spectrum
  that spans pediatric-onset hypomyelinating and neurodegenerative disease and
  juvenile- or adult-onset dystonia. Hypomyelination with atrophy of the basal
  ganglia and cerebellum (H-ABC; hypomyelinating leukodystrophy 6) is an
  ontology-grounded subtype of this spectrum, not a synonym for the umbrella
  disorder. Its white-matter and grey-matter abnormalities are parallel features:
  hypomyelination may be diffuse or mild and focal, while caudate and putaminal
  atrophy can be absent even after years of follow-up. DYT-TUBB4A (historically
  DYT4 or whispering dysphonia) is a distinct, usually inherited movement-disorder
  presentation with prominent laryngeal and generalized dystonia and typically
  normal neuroimaging.

  The molecular effects are allele specific. The studied H-ABC p.Arg2Trp and
  p.Asp249Asn substitutions have antimorphic effects on microtubule assembly,
  whereas the DYT-associated p.Arg2Gly substitution produced neuronal morphology
  changes without a prominent microtubule-dynamics defect and p.Gln424His showed
  increased growth dynamics consistent with gain of function. The p.Cys239Phe and
  p.Arg262His H-ABC alleles expand the clinical and imaging spectrum but have not
  been assigned those tested functional mechanisms. This heterogeneity is why no
  single functional-impact category or variant origin is asserted for the
  umbrella disorder.

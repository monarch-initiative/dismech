genetic:
- name: SLC30A2
  gene_term:
    preferred_term: SLC30A2
    term:
      id: hgnc:11013
      label: SLC30A2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The variants are in the mother, and the infant is affected through her milk; an affected infant may not carry the
    maternal allele. Common ZnT2 missense variants such as T288S are associated with markers of breast dysfunction and
    low milk volume in lactating women but have not been shown to cause infant zinc deficiency; see the mechanistic
    hypothesis on lactation performance.
  gene_disease_validity:

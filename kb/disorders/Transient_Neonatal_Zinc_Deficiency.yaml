mechanistic_hypotheses:
- hypothesis_group_id: znt2_lactation_performance
  hypothesis_label: >-
    ZnT2 dysfunction also impairs mammary secretory function and milk volume
  status: EMERGING
  description: >-
    Beyond lowering milk zinc, loss of ZnT2 in mice disrupts alveolar architecture, epithelial polarity and secretion and
    reduces milk volume, and the common human T288S variant is associated with breast stress markers and was found in
    women producing low milk volume. Whether disease-causing alleles in mothers of affected infants also reduce milk
    volume has not been shown; the human data are small series and in vitro studies of a common variant.
  evidence:
  - reference: PMID:25851903
    reference_title: Essential Role for Zinc Transporter 2 (ZnT2)-mediated Zinc Transport in Mammary Gland Development and Function during Lactation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Loss of ZnT2 led to reduced milk volume and milk containing less protein, fat, and lactose compared with wild-type littermates
    explanation: Knockout mice show a lactation defect beyond low milk zinc.
  - reference: PMID:29476070
    reference_title: A genetic variant in SLC30A2 causes breast dysfunction during lactation by inducing ER stress, oxidative stress and epithelial barrier defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we report that women who harbor a common ZnT2 variant (T288S) present with elevated levels of several oxidative and endoplasmic reticulum (ER) stress markers in their breast milk.
    explanation: Breast stress markers in lactating carriers of a common variant.
  - reference: PMID:32320289
    reference_title: A common genetic variant in zinc transporter ZnT2 (Thr288Ser) is present in women with low milk volume and alters lysosome function and cell energetics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we determined a common mutation in SLC30A2/ZnT2 substituting serine for threonine at amino acid 288 (Thr288Ser) was found in 20% of women producing low milk volume (n = 2/10) but was not identified in women producing normal volume.
    explanation: Small series linking the variant with low milk volume.
discussions:
- discussion_id: tnzd_penetrance_modifiers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do some exclusively breastfed infants of mothers carrying a pathogenic SLC30A2 variant stay well, and which
    infant or maternal factors (prematurity, birth order, antenatal exposures, the second maternal allele) decide it?
  attaches_to:
  - inheritance#Autosomal Dominant (maternal genotype)
  - pathophysiology#Inadequate Zinc Intake of the Exclusively Breastfed Infant
  rationale: >-
    Penetrance is incomplete, and in at least one family an earlier sibling breastfed by the same heterozygous mother was
    unaffected; the authors raised antenatal proton pump inhibitor exposure in the second pregnancy as a possible
    contributor, which a single case cannot test.
  evidence:
  - reference: PMID:37082517
    reference_title: "Think zinc: Transient nutritional deficiency related to novel maternal SLC30A2 mutation potentially precipitated by antenatal proton pump inhibitor exposure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A previous baby did not have zinc deficiency but the mother had taken a proton pump inhibitor (PPI) during the second pregnancy.
    explanation: Discordant siblings of one carrier mother.
  - reference: PMID:37082517
    reference_title: "Think zinc: Transient nutritional deficiency related to novel maternal SLC30A2 mutation potentially precipitated by antenatal proton pump inhibitor exposure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Antenatal PPI exposure may plausibly contribute to transient infantile zinc deficiency.
    explanation: The proposed modifier is a hypothesis from one case.
- discussion_id: tnzd_carrier_frequency
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How many lactating women carry SLC30A2 variants that lower milk zinc enough to cause infant deficiency, and would
    maternal carrier screening prevent disease?
  attaches_to:
  - prevalence#General population (ExAC exomes), genotype-based estimate of at-risk newborns
  rationale: >-
    The only population estimate comes from predicted deleteriousness of ExAC alleles checked in a cell assay, and common
    variants also alter milk zinc. Measured milk zinc and genotype in an unselected cohort of lactating women would
    settle the frequency.
  evidence:
  - reference: PMID:41866816
    reference_title: "Transient Neonatal Zinc Deficiency due to Maternal Variants in SLC30A2 : An Emerging and Atypical Candidate Gene for Maternal Carrier Screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: carrier screening may provide a unique opportunity to proactively identify females with known pathogenic SLC30A2 variants that would impart risk to their future breastfed children and breast milk recipients.
    explanation: Proposes maternal carrier screening.
  - reference: PMID:26293594
    reference_title: Exome Sequencing of SLC30A2 Identifies Novel Loss- and Gain-of-Function Variants Associated with Breast Cell Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found that 36% of women tested carried non-synonymous ZnT2 variants, all of whom had milk Zn levels that were distinctly above or below those in women without variants.
    explanation: Common variants alter milk zinc, complicating carrier interpretation.

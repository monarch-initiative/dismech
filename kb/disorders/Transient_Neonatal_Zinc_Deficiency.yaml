- name: Impaired Zinc Loading of Lactocyte Secretory Vesicles
  biological_scale: CELLULAR
  role: cellular defect (mother)
  description: >-
    In the lactating breast, prolactin signaling induces ZnT2, which concentrates zinc into acidic secretory vesicles of
    lactocytes for release into milk. Loss of ZnT2 function leaves zinc in the cytoplasm instead of in the vesicles that
    carry it into milk. ZnT2-null mice additionally show disorganized alveoli, unpolarized epithelium and impaired vesicle
    acidification and secretion.

    evidence_source: HUMAN_CLINICAL
    snippet: The absence of the maternal SLC30A2 variant in the proband underscores diagnostic challenges in evaluating for TNZD, as primary variant analysis is typically limited to the proband in trio testing.
    explanation: Trio testing focused on the proband can miss a maternal-only variant.

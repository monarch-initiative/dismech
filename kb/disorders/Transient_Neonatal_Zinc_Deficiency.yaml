    evidence_source: HUMAN_CLINICAL
    snippet: "a heterozygous SLC30A2 variant of uncertain significance (VUS) (c.927G>C; p.Trp309Cys) was identified in the proband's mother, which was notably absent in the proband."
    explanation: The affected infant did not carry the maternal variant, so the infant's genotype is not what causes the disease.
  - reference: PMID:23741301

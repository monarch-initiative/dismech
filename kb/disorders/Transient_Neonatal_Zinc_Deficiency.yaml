    reference_title: A dominant negative heterozygous G87R mutation in the zinc transporter, ZnT-2 (SLC30A2), results in transient neonatal zinc deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These findings establish that inactivating ZnT-2 mutations are an underlying basis of TNZD and provide the first evidence for the dominant inheritance of heterozygous ZnT-2 mutations via negative dominance due to homodimer formation.
    explanation: Establishes inactivating maternal ZnT2 variants as the cause.

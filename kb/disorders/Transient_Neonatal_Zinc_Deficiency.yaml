name: Transient Neonatal Zinc Deficiency
creation_date: "2026-10-31T14:00:00Z"
category: Mendelian
description: >-
  Zinc deficiency of the exclusively breastfed infant caused by a genetic defect in the mother. Loss-of-function
  variants in SLC30A2, which encodes the vesicular zinc transporter ZnT2 of lactating mammary epithelial cells, reduce
  zinc import into the secretory vesicles that carry zinc into milk, so the mother produces milk with a markedly low zinc
  concentration while her own serum zinc is normal. One heterozygous variant is usually enough (autosomal dominant, by
  haploinsufficiency or, for some missense alleles, a dominant-negative effect through ZnT2 homodimers); compound
  heterozygous and homozygous mothers have also been reported. The infant, whose own genotype is irrelevant to the
  disease, develops the acrodermatitis enteropathica-like syndrome of zinc deficiency during exclusive breastfeeding:
  periorificial and acral dermatitis, alopecia, diarrhea, irritability and growth faltering, with low serum zinc and low
  alkaline phosphatase. Oral zinc given to the infant resolves it rapidly, maternal zinc supplementation does not raise
  milk zinc, and the deficiency does not recur after weaning, which separates it from acrodermatitis enteropathica.
  Many reported low-milk-zinc cases are preterm infants, whose zinc demand is high.

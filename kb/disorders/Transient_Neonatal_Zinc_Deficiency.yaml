    explanation: Genetic testing is done on the mother.
differential_diagnoses:
- name: Acrodermatitis enteropathica
  disease_term:
    preferred_term: acrodermatitis enteropathica
    term:
      id: MONDO:0008713
      label: acrodermatitis enteropathica
  description: >-
    Autosomal recessive intestinal zinc malabsorption from biallelic SLC39A4 (ZIP4) variants in the infant. Skin and
    systemic signs are the same, but deficiency persists after weaning and requires continued zinc.
  distinguishing_features:
  - Biallelic SLC39A4 variants in the infant rather than SLC30A2 variants in the mother.
  - Deficiency persists after weaning instead of resolving.
  evidence:
  - reference: PMID:25468189
    reference_title: "Genetic causes and gene–nutrient interactions in mammalian zinc deficiencies: acrodermatitis enteropathica and transient neonatal zinc deficiency as examples."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: AE is fatal if zinc is not supplied to the infant after weaning, whereas TNZD is a genetic defect of the mother limiting the supply of zinc in the milk, and therefore the infant usually will obtain enough zinc once weaned.
    explanation: Contrasts the course and the carrier of the defect in the two diseases.
  - reference: PMID:26598882
    reference_title: Overview of Inherited Zinc Deficiency in Infants and Children.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: AE is an autosomal recessive disorder caused by mutations of the ZIP4 gene, consequently resulting in defective absorption of zinc in the small intestine.
    explanation: Mechanism of the differential diagnosis.
  - reference: PMID:32278324
    reference_title: A novel homozygous mutation p.E88K in maternal SLC30A2 gene as a cause of transient neonatal zinc deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sanger sequencing of the AE-causing gene SLC39A4 revealed no mutations in genomic DNA from the infant, excluding the possibility of AE.
    explanation: Infant SLC39A4 sequencing is used to exclude acrodermatitis enteropathica.
- name: Transient symptomatic zinc deficiency with normal milk zinc
  description: >-
    Breastfed, mostly preterm infants can develop the same syndrome when their zinc requirement exceeds the supply from
    milk of normal zinc content. Maternal milk zinc is normal and no SLC30A2 defect is implied.
  distinguishing_features:
  - Normal zinc concentration in the mother's milk.
  - Usually preterm infants with high zinc requirements.
  evidence:
  - reference: PMID:19907411
    reference_title: "A case of transient zinc deficiency in a breast-fed preterm infant successfully treated with oral zinc supplementation: review of zinc metabolism and related diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Transient zinc deficiency due to increased zinc requirements in breast-fed mainly preterm infants is a condition similar to acrodermatitis enteropathica
    explanation: Describes the requirement-driven form in preterm breastfed infants.
  - reference: PMID:19907411
    reference_title: "A case of transient zinc deficiency in a breast-fed preterm infant successfully treated with oral zinc supplementation: review of zinc metabolism and related diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the mother's serum and milk had normal zinc values.
    explanation: Normal milk zinc separates this form from the SLC30A2 disease.
- name: Maternal nutritional zinc deficiency
  description: >-
    Low milk zinc can accompany low maternal serum zinc from maternal nutritional deficiency; both can improve with
    maternal zinc supplementation, unlike the SLC30A2 defect.
  distinguishing_features:
  - Low maternal serum zinc.
  - Milk zinc rises after maternal zinc supplementation.
  evidence:
  - reference: PMID:32832457
    reference_title: "Transient Symptomatic Zinc Deficiency in a Breastfed Infant Associated with Low Zinc Levels in Maternal Serum and Breast Milk Improving after Zinc Supplementation: An Uncommon Phenotype?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mother also had low serum and breast milk zinc concentration and both improved after oral zinc therapy indicating a non-heritable phenotype.
    explanation: Maternal supplementation corrected milk zinc in a non-genetic case.
treatments:
- name: Oral Zinc Supplementation of the Infant
  description: >-
    Oral zinc given to the infant (zinc sulfate, zinc gluconate or polaprezinc at 1 to 3 mg/kg/day in reported cases)
    resolves the skin lesions and other signs within days to weeks. Breastfeeding can continue during supplementation,
    and zinc can be stopped after weaning without relapse.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: oral zinc supplementation
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zinc sulfate
      term:
        id: CHEBI:35176
        label: zinc sulfate
    - preferred_term: zinc gluconate
      term:
        id: CHEBI:29708
        label: Zinc gluconate
  target_mechanisms:
  - target: Systemic Zinc Deficiency of the Breastfed Infant
  evidence:
  - reference: PMID:28665435
    reference_title: The role of the zinc transporter SLC30A2/ZnT2 in transient neonatal zinc deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Importantly, zinc supplementation of these zinc-deficient infants effectively and rapidly resolves these TNZD symptoms.
    explanation: Review statement of treatment response.
  - reference: PMID:41866816
    reference_title: "Transient Neonatal Zinc Deficiency due to Maternal Variants in SLC30A2 : An Emerging and Atypical Candidate Gene for Maternal Carrier Screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Zinc supplementation in the infant led to rapid clinical improvement.
    explanation: Response to infant zinc in a recent case.
  - reference: PMID:37082517
    reference_title: "Think zinc: Transient nutritional deficiency related to novel maternal SLC30A2 mutation potentially precipitated by antenatal proton pump inhibitor exposure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A rapid improvement was noted within days of starting 3 mg/kg/day zinc sulfate supplementation
    explanation: Dose and response in a case with a heterozygous maternal variant.
  - reference: PMID:40371305
    reference_title: "Transient neonatal zinc deficiency in a 3-month-old infant: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Zinc gluconate was started to aim for an elemental zinc dose of 1 mg/kg/day.
    explanation: Lower-dose regimen used in another case.
  - reference: PMID:23741301
    reference_title: "Compound heterozygous mutations in SLC30A2/ZnT2 results in low milk zinc concentrations: a novel mechanism for zinc deficiency in a breast-fed infant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Zinc supplementation was stopped after the start of the weaning diet, after which the infant's serum zinc level remained within normal ranges.
    explanation: No relapse after stopping zinc at weaning.
  - reference: PMID:36967740
    reference_title: Novel SLC30A2 mutations in the pathogenesis of transient neonatal zinc deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: these symptoms can be alleviated by oral zinc supplementation, and the affected infant can successfully thrive without zinc supplementation after weaning.
    explanation: Supplementation is needed only until weaning.
- name: Maternal Zinc Supplementation
  description: >-
    Giving zinc to the mother does not raise milk zinc when the cause is an SLC30A2 defect, so it is not a treatment for
    this disease; it can help when low milk zinc reflects maternal nutritional deficiency.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: maternal oral zinc supplementation
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Impaired Zinc Secretion into Breast Milk
  evidence:
  - reference: PMID:17065149
    reference_title: Identification of a mutation in SLC30A2 (ZnT-2) in women with low milk zinc concentration that results in transient neonatal zinc deficiency.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: This condition is not corrected by maternal zinc supplementation, supporting the speculation that it results from an inherited genetic condition.
    explanation: Refutes maternal supplementation as an effective treatment.
  - reference: PMID:3220631
    reference_title: Self-limiting acrodermatitis enteropathica. A follow-up study of three interrelated families.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL

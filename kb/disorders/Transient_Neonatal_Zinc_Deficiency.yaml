- name: Inadequate Zinc Intake of the Exclusively Breastfed Infant
  biological_scale: ORGANISM
  role: transmission step (mother to infant)
  description: >-
    An infant whose only food is low-zinc milk receives too little zinc for its growth, whatever its own genotype. Term
    infants are born with hepatic zinc stores and then depend on milk; preterm infants have a high zinc demand, which is
    why many reported cases of low-milk-zinc deficiency are preterm. Introducing other foods at weaning restores intake.
  evidence:
  - reference: PMID:28665435
    reference_title: The role of the zinc transporter SLC30A2/ZnT2 in transient neonatal zinc deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Consequently, infants exclusively breastfed with zinc-deficient breast milk develop severe zinc deficiency.
    explanation: Exclusive breastfeeding is the route by which the maternal defect reaches the infant.
  - reference: PMID:41866816
    reference_title: "Transient Neonatal Zinc Deficiency due to Maternal Variants in SLC30A2 : An Emerging and Atypical Candidate Gene for Maternal Carrier Screening."

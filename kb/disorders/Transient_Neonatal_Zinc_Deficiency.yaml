environmental:
- name: Exclusive breastfeeding by an affected mother
  description: >-
    The disease requires that the infant's zinc supply comes from the affected mother's milk. Weaning and complementary
    foods end the exposure.
  exposure_term:
    preferred_term: exposure to human milk via ingestion
    term:
      id: ECTO:0070224
      label: exposure to human milk (raw) via ingestion
  evidence:
  - reference: PMID:17065149
    reference_title: Identification of a mutation in SLC30A2 (ZnT-2) in women with low milk zinc concentration that results in transient neonatal zinc deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Breast milk normally contains adequate zinc to meet infant requirements up to six months of age; however, transient neonatal zinc deficiency has been documented in exclusively breastfed infants of women with low milk zinc concentration.
    explanation: The condition arises in exclusively breastfed infants of mothers with low milk zinc.
  influences_mechanisms:
  - target: Inadequate Zinc Intake of the Exclusively Breastfed Infant
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Exclusive feeding on low-zinc milk is the route by which the maternal defect produces infant deficiency.
    evidence:
    - reference: PMID:28665435
      reference_title: The role of the zinc transporter SLC30A2/ZnT2 in transient neonatal zinc deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: Consequently, infants exclusively breastfed with zinc-deficient breast milk develop severe zinc deficiency.
      explanation: Exclusive breastfeeding with zinc-deficient milk produces the deficiency.
    - reference: PMID:24456035
      reference_title: Transient neonatal zinc deficiency due to a new autosomal dominant mutation in gene SLC30A2 (ZnT-2).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: TNZD becomes clinically evident during breastfeeding and is resolved by weaning and the introduction of complementary nutrition.
      explanation: Onset during breastfeeding and resolution at weaning tie the disease to the exposure.

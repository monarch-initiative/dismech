      snippet: "SLC30A2 | HGNC:11013 | zinc deficiency, transient neonatal | MONDO:0011973 | AD | Definitive"
      explanation: ClinGen classifies the SLC30A2 to transient neonatal zinc deficiency relationship, autosomal dominant, as definitive.
  evidence:

notes: >-
  Who carries the variant. The disease-causing genotype is the mother's and the phenotype is the infant's: the infant
  need not carry the maternal SLC30A2 variant at all (PMID:41866816 reports a proband who did not inherit it). The
  schema has no slot that states whose genotype a genetic record, a genetic_context or an inheritance block describes,
  or that marks a disease as transmitted through a parent's phenotype (here, milk composition) rather than through the
  child's genome. In this entry the genetic record, the inheritance block and the first three pathophysiology nodes
  describe the mother, and every node from "Inadequate Zinc Intake of the Exclusively Breastfed Infant" onward describes
  the infant; the role field of each node says which. The phenotype "Low Breast Milk Zinc Concentration" is a maternal
  finding (HPO has a term for it) recorded because it is the diagnostic link between the two individuals. No GeneReviews
  chapter covers this disease or SLC30A2 (PubMed searches '"transient neonatal zinc deficiency"[TI] AND
  genereviews[book]' and 'SLC30A2[TIAB] AND genereviews[book]' both returned no chapter). Transient symptomatic zinc
  deficiency in preterm infants fed milk of normal zinc content is a related but distinct condition and is recorded as a
  differential diagnosis, not as a subtype.
pathophysiology:
- name: Maternal SLC30A2 Loss of Function
  biological_scale: MOLECULAR
  role: initiating lesion (mother)
  description: >-
    Germline SLC30A2 variants in the mother inactivate ZnT2, the zinc transporter that loads zinc into the secretory
    vesicles of lactating mammary epithelial cells. Missense alleles act in two ways. H54R and G87R mutants are retained
    in the endoplasmic reticulum or aggregate perinuclearly and are unstable, and G87R also pulls wild-type ZnT2 into
    nonfunctional dimers (dominant negative). G280R, T312M and E355Q hit residues for zinc coordination or permeation,
    still reach vesicles and do not inhibit the wild-type protein, implying haploinsufficiency. Splice-altering and
    promoter variants have also been reported. A single heterozygous allele usually suffices; compound heterozygous
    (W152R with S296L) and homozygous (E88K) mothers have also been described, the latter with earlier onset in the
    infant.

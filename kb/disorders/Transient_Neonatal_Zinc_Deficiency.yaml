inheritance:
- name: Autosomal Dominant (maternal genotype)
  description: >-
    Inheritance describes the mother: one SLC30A2 loss-of-function allele in the lactating woman is usually sufficient,
    and biallelic maternal genotypes have also been reported. Penetrance is incomplete and expressivity variable, with
    some exclusively breastfed infants of carrier mothers mildly affected or unaffected. Whether a given infant is
    affected depends on exclusive breastfeeding by an affected mother, not on the infant inheriting the allele.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: CGGV:assertion_c4bde390-ff71-42de-949c-2ebd37f18b1a-2025-01-24T050000.000Z
    reference_title: SLC30A2 / zinc deficiency, transient neonatal (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The condition typically follows an autosomal dominant inheritance pattern, though compound heterozygous and homozygous variants have been reported in mothers of early-onset TNZD infants
    explanation: ClinGen summary of the mode of inheritance.
  - reference: CGGV:assertion_c4bde390-ff71-42de-949c-2ebd37f18b1a-2025-01-24T050000.000Z
    reference_title: SLC30A2 / zinc deficiency, transient neonatal (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: TNZD exhibits incomplete penetrance and variable expressivity, with some exclusively breastfed infants showing mild or no symptoms
    explanation: ClinGen summary of penetrance.
  - reference: PMID:25468189
    reference_title: "Genetic causes and gene–nutrient interactions in mammalian zinc deficiencies: acrodermatitis enteropathica and transient neonatal zinc deficiency as examples."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Mutations in this transporter cause transient neonatal zinc deficiency (TNZD) with symptoms similar to AE but with autosomal dominant inheritance.
    explanation: Review statement of autosomal dominant inheritance.
  - reference: PMID:41866816
    reference_title: "Transient Neonatal Zinc Deficiency due to Maternal Variants in SLC30A2 : An Emerging and Atypical Candidate Gene for Maternal Carrier Screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: effectively evaluating for TNZD can be challenging because the infant's genotype does not reliably reflect the mother's genotype.
    explanation: The relevant genotype is the mother's.

    reference_title: Identification of a mutation in SLC30A2 (ZnT-2) in women with low milk zinc concentration that results in transient neonatal zinc deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of genomic DNA detected a mis-sense mutation (Ade-->Gua) that substitutes a conserved histidine at amino acid 54 with arginine (H54R) in SLC30A2 (ZnT-2) that is present in both affected subjects and several other siblings."
    explanation: First maternal SLC30A2 variant identified in women whose breastfed infants developed zinc deficiency.
  - reference: PMID:22733820
    reference_title: A dominant negative heterozygous G87R mutation in the zinc transporter, ZnT-2 (SLC30A2), results in transient neonatal zinc deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we identified and characterized a novel heterozygous G87R ZnT-2 mutation in two unrelated Ashkenazi Jewish mothers with infants displaying TNZD."
    explanation: Heterozygous maternal G87R variant in two unrelated families.
  - reference: PMID:22733820
    reference_title: A dominant negative heterozygous G87R mutation in the zinc transporter, ZnT-2 (SLC30A2), results in transient neonatal zinc deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "co-transfection experiments with both mutant and WT transporters revealed a dominant negative effect of G87R ZnT-2 over the WT ZnT-2; this was associated with mislocalization, decreased stability, and loss of zinc transport activity of the WT ZnT-2 due to homodimerization observed upon immunoprecipitation experiments."
    explanation: Dominant-negative mechanism for one heterozygous missense allele.
  - reference: PMID:24451381
    reference_title: In situ dimerization of multiple wild type and mutant zinc transporters in live cells using bimolecular fluorescence complementation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We further show that BiFC recapitulated the pathogenic role that ZnT mutations play in transient neonatal zinc deficiency.
    explanation: Live-cell dimerization assay of wild-type and mutant ZnT2, the basis of the dominant-negative model.
  - reference: PMID:27137936
    reference_title: "Molecular Basis of Transient Neonatal Zinc Deficiency: NOVEL ZnT2 MUTATIONS DISRUPTING ZINC BINDING AND PERMEATION."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Collectively, our findings establish that some heterozygous loss of function ZnT2 mutations disrupt zinc binding and zinc permeation, thereby suggesting a haploinsufficiency state for the unaffected WT ZnT2 allele in TNZD pathogenesis."
    explanation: Haploinsufficiency mechanism for alleles that do not inhibit the wild-type protein.
  - reference: PMID:23741301
    reference_title: "Compound heterozygous mutations in SLC30A2/ZnT2 results in low milk zinc concentrations: a novel mechanism for zinc deficiency in a breast-fed infant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The two mutations were found on different alleles, indicating that the genotype of the mother with low milk zinc was compound heterozygous.
    explanation: Biallelic maternal genotype (W152R and S296L).
  - reference: PMID:32278324
    reference_title: A novel homozygous mutation p.E88K in maternal SLC30A2 gene as a cause of transient neonatal zinc deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Compared to the heterozygous condition, a homozygous mutation seems to result in a more significant decrease in zinc secretion and a more rapid onset of TNZD.
    explanation: Homozygous maternal genotype with earlier infant onset.
  - reference: PMID:36967740
    reference_title: Novel SLC30A2 mutations in the pathogenesis of transient neonatal zinc deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The other two mothers exhibited multiple heterozygous mutations in the SLC30A2 promoter, the first mutations in the SLC30A2 regulatory region reported to date.
    explanation: Regulatory (promoter) variants extend the allelic spectrum beyond coding missense changes.
  - reference: PMID:30893306
    reference_title: ZnT2 is an electroneutral proton-coupled vesicular antiporter displaying an apparent stoichiometry of two protons per zinc ion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bafilomycin A1, a specific inhibitor of vacuolar-type proton ATPase (V-ATPase) which alkalizes acidic vesicles, abolished ZnT2-dependent zinc transport into intracellular vesicles.
    explanation: ZnT2 transport depends on the vesicular proton gradient, supporting its zinc:proton antiporter function.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutant forms of UBIAD1 associated with Schnyder corneal dystrophy (SCD), a human eye disease characterized by corneal accumulation of cholesterol, are sequestered in the ER and block reductase degradation."
    explanation: Establishes ER sequestration of SCD-mutant UBIAD1 and its coupling to blocked reductase degradation.
  - reference: PMID:27121042

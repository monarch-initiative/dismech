- name: Increased Corneal Cholesterol Biosynthesis
  description: >-
    Sustained HMGCR activity raises local cholesterol synthesis in corneal
    cells. Because the defect is intrinsic to the corneal cells themselves
    rather than to circulating lipoproteins, the resulting sterol excess is
    corneal even when serum lipids are normal, which is the basis for regarding
    SCD as a local corneal metabolic defect.

    explanation: >-
      Establishes autophagy-dependent control of the SCD-associated
      ultrastructural lesion; PARTIAL because the cells carry no UBIAD1 variant.
discussions:
- discussion_id: mk4_versus_hmgcr_arm
  kind: CONTROVERSY
  prompt: >-
    Does impaired menaquinone-4 synthesis contribute to corneal disease in
    Schnyder corneal dystrophy, or is blocked HMGCR ERAD sufficient to explain
    the phenotype?
  attaches_to:
  - pathophysiology#Impaired Menaquinone-4 Synthesis
  - pathophysiology#Blocked Sterol-Accelerated HMGCR ERAD
  rationale: >-
    Both arms are demonstrably abnormal in SCD, but they make different
    predictions. The HMGCR arm predicts corneal sterol accumulation and is
    confirmed in knock-in mice. The MK-4 arm predicts vitamin-K-dependent
    deficits, and SCD patients do have elevated inactive matrix Gla protein, yet
    they lack the systemic phenotypes of MK-4 or VKD-carboxylation deficiency,
    and MK-4 activity per variant does not track severity (the hotspot N102S
    retains most of its activity). Resolving this matters therapeutically: if
    the MK-4 arm contributes, vitamin K2 supplementation becomes a candidate
    intervention; if not, only the ERAD axis is worth targeting.
  status: OPEN
  evidence:
  - reference: PMID:34813684
    reference_title: "Naturally occurring UBIAD1 mutations differentially affect menaquinone biosynthesis and vitamin K-dependent carboxylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, the G186R mutation significantly affected both MK-4 biosynthesis and VKD carboxylation. Other mutations exhibit varying degrees of effects on MK-4 biosynthesis and VKD carboxylation."
    explanation: Shows heterogeneous, non-severity-tracking effects of SCD variants on the MK-4 arm.
- discussion_id: n100s_mouse_cholesterol_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does the Ubiad1 N100S knock-in mouse develop anterior corneal deposits
    without any detectable increase in corneal cholesterol, when the defining
    human lesion is corneal cholesterol accumulation?
  attaches_to:
  - pathophysiology#Corneal Cholesterol and Phospholipid Deposition
  rationale: >-
    The N100S mouse models the human N102S hotspot yet shows mitochondrial
    abnormality and altered glycerophosphoglycerols rather than cholesterol
    excess, while the G184R knock-in line does accumulate corneal free
    cholesterol. Species differences in cholesterol metabolism are the authors'
    proposed explanation, but the discrepancy is unresolved and matters for
    choosing a preclinical model: a therapeutic candidate that normalizes
    cholesterol would show no benefit in the N100S line regardless of whether it
    works in humans.
  status: OPEN
  evidence:
  - reference: PMID:29977031
    reference_title: "A Mouse Model of Schnyder Corneal Dystrophy with the N100S Point Mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The Ubiad1N100S mouse provides a promising animal model of SCD revealing that mitochondrial dysfunction is a prominent component of the disease. The different phenotype in human and mouse may due to difference in cholesterol metabolism between species."
    explanation: States the mismatch and the authors' species-difference explanation.

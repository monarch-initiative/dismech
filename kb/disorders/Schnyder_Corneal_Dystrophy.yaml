  downstream:
  - target: ER Sequestration of Mutant UBIAD1
    causal_link_type: DIRECT
    description: >-
      The missense substitution lowers UBIAD1 affinity for GGpp, so the mutant
      protein fails to undergo the GGpp-triggered release that normally licenses
      its exit from the ER.
    evidence:
    - reference: PMID:30785396
      reference_title: "Schnyder corneal dystrophy-associated UBIAD1 inhibits ER-associated degradation of HMG CoA reductase in mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "SCD-associated UBIAD1 resists GGpp-induced release and is sequestered in ER to inhibit ERAD."
      explanation: Directly links the SCD variant to failed GGpp-triggered release and ER sequestration.
  - target: Impaired Menaquinone-4 Synthesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - mk4_deficiency_model
    description: >-
      The same substitutions reduce the enzyme's capacity to prenylate vitamin K
      to MK-4, in at least some cases through the same reduced GGpp affinity.

experimental_models:
- name: Ex vivo 3D human corneal stroma model
  description: >-
    Long-term (over 3 months) 3D outgrowths of corneal stroma-derived
    mesenchymal stem-like cells from cadaveric explants spontaneously develop
    multilamellar bodies, the ultrastructural lesion associated with SCD. MLB
    abundance rises with autophagy induction (serum starvation, rapamycin) and
    falls with autophagy inhibition (3-methyladenine), making the system a
    tractable platform for testing autophagy-directed intervention. It is a
    phenocopy model: the cells carry no UBIAD1 variant, so it models the lesion
    rather than the genetic cause.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:28872183
  modeled_mechanisms:
  - target: Corneal Cholesterol and Phospholipid Deposition
    evidence:
    - reference: PMID:28872183
      reference_title: "Ex vivo 3D human corneal stroma model for Schnyder corneal dystrophy - role of autophagy in its pathogenesis and resolution."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "MLB formation in long-standing CSMSC cultures could serve as a potential ex vivo model for studying corneal stroma diseases, including SCD."
      explanation: >-
        The authors propose the system as a model of the SCD corneal deposit
        lesion; PARTIAL because it reproduces the multilamellar-body lesion
        without carrying a UBIAD1 variant.
  evidence:
  - reference: PMID:28872183

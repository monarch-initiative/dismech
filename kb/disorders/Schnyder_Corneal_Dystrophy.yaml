  description: >-
    CRISPR/Cas9 knock-in of the mouse equivalent of the human N102S hotspot
    variant. Heterozygotes and homozygotes develop hyper-reflective anterior
    corneal deposits, but, unlike the human disease and unlike the G184R line,
    no difference in corneal cholesterol was detectable by filipin staining or
    lipidomics. Instead the model shows abnormal mitochondrial morphology and

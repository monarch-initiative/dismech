        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The aged Ubiad1G184R/+ mice exhibited corneal opacification and free cholesterol accumulation, phenocopying clinical manifestations of SCD patients."
        explanation: Reports the measured corneal opacification and cholesterol accumulation.
    evidence:

- Corneal dystrophy
- Hereditary disease
notes: >-
  Naming: the International Committee for Classification of Corneal Dystrophies
  (IC3D) renamed this entity from "Schnyder crystalline corneal dystrophy" to
  "Schnyder corneal dystrophy" precisely because crystals are absent in roughly
  half of patients, and crystal-free (acrystalline) patients were being
  systematically misdiagnosed. Both names remain in the literature and the older
  one is retained as a synonym here.

  Central discoid corneal dystrophy (CDCD), once reported as a separate
  dystrophy, was shown by UBIAD1 sequencing (p.Asp240Asn) to be a variant of SCD
  and is therefore carried as a synonym rather than a distinct entry.

  Scope: SCD is modeled here as a disease of local corneal cholesterol
  metabolism. Systemic hypercholesterolemia is reported in about two-thirds of
  patients, but is also enriched among unaffected members of SCD pedigrees, so
  it is curated as an associated finding and not as a step in the causal chain.

  Not curated as a phenotype: the classic literature describes a triad of
  corneal crystals, hypercholesterolemia, and genu valgum. Skeletal findings
  (genu valgum, occasionally scoliosis) are reported in only a small minority of
  families, show marked intrafamilial discordance, and could not be supported
  here by a quotable primary abstract, so no skeletal phenotype is asserted. If
  a suitable primary source is identified this should be revisited.

  Datasets: no `datasets:` block is curated. GEO discovery returned only two
  GENE_ONLY candidates, both rejected on relevance triage: GSE229792 is a breast
  cancer study of UBIAD1/CoQ10 in cell stiffening, and GSE266552 profiles
  hepatic lipid metabolism in Ubiad1+/- mice, a null-heterozygote genotype with
  no corneal phenotype and no reference to SCD. Both are the classic gene-only
  failure mode where searching the causal gene surfaces whatever that gene is
  otherwise studied for, so neither is recorded as an SCD dataset.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    SCD segregates as a fully dominant trait with high penetrance, caused by
    heterozygous UBIAD1 missense variants. Penetrance is age-dependent rather
    than truly reduced: corneal findings emerge and progress along a predictable
    age schedule, so young carriers may be clinically unaffected at examination
    (recorded as INCOMPLETE, the closest available enum value). Expressivity is
    variable: the presence and extent of corneal crystals, degree of stromal
    haze, and presence of systemic findings differ substantially between
    carriers of the same variant, including within a single family. De novo
    variants are rare but documented, so a negative family history does not
    exclude the diagnosis.
  evidence:
  - reference: PMID:21540632
    reference_title: "Differential diagnosis of Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCD is inherited as an autosomal dominant trait with high penetrance and has been mapped to the UBIAD1 gene on chromosome 1p36.3."
    explanation: States the inheritance mode, penetrance, and the causal locus.
  - reference: PMID:27382485
    reference_title: "Identification of the First De Novo UBIAD1 Gene Mutation Associated with Schnyder Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a novel heterozygous de novo missense mutation in UBIAD1, p.(Thr103Ile), identified in a patient with classic clinical features of SCD. This highlights the value of genetic testing in clinical diagnostic settings, even in the absence of a positive family history."
    explanation: Documents de novo occurrence, establishing that absent family history does not exclude SCD.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate has been published. SCD is
    consistently described as ultra-rare; the largest natural-history cohort
    assembled at a referral center since 1989 comprised 115 affected individuals
    from 34 families, and secondary sources quote an estimate below 1 in
    1,000,000 without a primary epidemiological study behind it. The qualitative
    class is recorded rather than a numeric rate to avoid implying a
    measurement that does not exist.
  evidence:
  - reference: PMID:18427632
    reference_title: "Visual morbidity in thirty-four families with Schnyder crystalline corneal dystrophy (an American Ophthalmological Society thesis)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Retrospective case series of 115 affected individuals from 34 SCCD families identified since 1989."
    explanation: >-
      Indirect support only: the size of the largest referral-center series
      accumulated over nearly two decades indicates very low worldwide
      ascertainment, but does not itself measure prevalence.
pathophysiology:
- name: UBIAD1 Missense Variant
  description: >-
    A heterozygous missense variant in UBIAD1 (1p36.22) substitutes a highly
    conserved residue in the prenyltransferase domain or an adjacent
    transmembrane helix. Over 20 SCD-associated UBIAD1 variants are known;
    p.Asn102Ser is a recurrent hotspot found in unrelated families of both
    European and Asian ancestry. The variants act by conferring an abnormal,
    persistent interaction with HMG-CoA reductase rather than by simple loss of
    catalytic activity.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genetic_context:
    gene:
      preferred_term: UBIAD1
      term:
        id: hgnc:30791
        label: UBIAD1
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      SCD variants are heterozygous germline missense changes. The
      disease-driving consequence is a gain, not a loss: the mutant protein
      sustains an abnormal, GGpp-resistant association with HMGCR that wild-type
      UBIAD1 releases, so it acquires a persistent HMGCR-stabilizing activity.
      Catalytic MK-4 synthesis is reduced in parallel, so the allele is
      simultaneously hypomorphic for its enzymatic function; the single
      controlled value records the dominant, phenotype-driving arm, since
      per-variant MK-4 activity does not track with the SCD phenotype.
  molecular_functions:
  - preferred_term: prenyltransferase activity
    term:
      id: GO:0004659
      label: prenyltransferase activity
    modifier: DECREASED

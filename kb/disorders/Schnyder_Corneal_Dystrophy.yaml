    reference_title: "Schnyder corneal dystrophy-associated UBIAD1 inhibits ER-associated degradation of HMG CoA reductase in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Corneas from aged knockin mice exhibit signs of opacification and sterol overaccumulation."
    explanation: Independent knock-in line confirming corneal opacification and sterol overaccumulation.
- name: Ubiad1 N100S knock-in mouse
  species: Mus musculus
  genotype: Ubiad1 N100S point-mutation knock-in (heterozygous and homozygous)
  category: CRISPR/Cas9 knock-in mouse model of the human N102S hotspot variant
  genes:

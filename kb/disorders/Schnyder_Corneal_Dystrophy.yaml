name: Schnyder Corneal Dystrophy
creation_date: "2026-08-09T00:00:00Z"
category: Mendelian
description: >-
  Schnyder corneal dystrophy (SCD) is a rare autosomal-dominant anterior corneal
  stromal dystrophy caused by heterozygous missense variants in UBIAD1, a
  prenyltransferase that synthesizes the vitamin K2 subtype menaquinone-4 (MK-4)
  from geranylgeranyl pyrophosphate (GGpp). SCD is a disorder of local corneal
  cholesterol handling rather than a systemic lipid-storage disease, and the
  dominant mechanism is a gain of an abnormal protein-protein interaction. Under
  normal conditions sterols trigger UBIAD1 binding to HMG-CoA reductase (HMGCR),
  transiently sparing it from sterol-accelerated ER-associated degradation
  (ERAD), and rising GGpp then releases UBIAD1 so that HMGCR is degraded and
  UBIAD1 traffics on to the Golgi. SCD-associated UBIAD1 resists this
  GGpp-triggered release, stays sequestered in the ER, competes with Insig-1 for
  HMGCR, and thereby blocks HMGCR ERAD, stabilizing the rate-limiting enzyme of
  cholesterol synthesis and driving accumulation of unesterified cholesterol and
  phospholipid in the corneal epithelium, Bowman layer, and anterior stroma. The
  clinical course is strikingly age-predictable: central corneal haze and/or
  crystals, then arcus lipoides in the third decade, then midperipheral haze in
  the late fourth decade. Because scattering from corneal cholesterol degrades
  bright-light vision preferentially, patients lose photopic vision and complain
  of glare while scotopic acuity stays good into middle age. Contrary to the
  historical name "Schnyder crystalline corneal dystrophy", only about half of
  affected patients ever have visible corneal crystals, which is why the IC3D
  dropped "crystalline" from the disease name.
disease_term:
  preferred_term: Schnyder corneal dystrophy
  term:
    id: MONDO:0007374
    label: Schnyder corneal dystrophy
synonyms:
- SCD
- SCCD
- Schnyder crystalline corneal dystrophy
- Hereditary crystalline corneal dystrophy of Schnyder
- Central crystalline dystrophy of Schnyder
- Central discoid corneal dystrophy
parents:

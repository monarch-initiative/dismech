    snippet: "Results of this characterization support a model in which UBIAD1 continuously cycles between the ER and medial-trans Golgi of isoprenoid-replete cells."
    explanation: Describes the normal GGpp-regulated ER-Golgi cycling that the SCD variant disrupts.
  - reference: PMID:32188638
    reference_title: "Schnyder corneal dystrophy-associated UBIAD1 is defective in MK-4 synthesis and resists autophagy-mediated degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Sequestration in the ER protects SCD-associated UBIAD1 from autophagy and allows intracellular accumulation of the mutant protein, which amplifies the inhibitory effect on reductase ERAD."
    explanation: Shows ER sequestration is self-amplifying by protecting the mutant protein from autophagic clearance.
  downstream:
  - target: Blocked Sterol-Accelerated HMGCR ERAD
    causal_link_type: DIRECT
    hypothesis_groups:
    - hmgcr_stabilization_model
    description: >-
      ER-retained mutant UBIAD1 outcompetes Insig-1 for binding to HMGCR,
      removing the adaptor required to commit HMGCR to ubiquitin-dependent
      ER-associated degradation.
    evidence:
    - reference: PMID:31323021
      reference_title: "Schnyder corneal dystrophy-associated UBIAD1 mutations cause corneal cholesterol accumulation by stabilizing HMG-CoA reductase."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast to the Golgi localization of wild-type UBIAD1, SCD-associated mutants mainly resided in the endoplasmic reticulum (ER) and competed with Insig-1 for HMGCR binding, thereby preventing HMGCR from degradation and increasing cholesterol biosynthesis."
      explanation: States the Insig-1 competition step linking ER retention to blocked HMGCR degradation.

- name: Blocked Sterol-Accelerated HMGCR ERAD
  description: >-
    HMG-CoA reductase is normally subject to sterol-accelerated, ER-associated
    degradation, a feedback arm that shuts down the mevalonate pathway when
    sterols are abundant. Sterols promote UBIAD1-HMGCR binding, which
    transiently spares the enzyme so that nonsterol isoprenoid synthesis can
    continue; GGpp then displaces UBIAD1 and permits maximal degradation.
    SCD-mutant UBIAD1 cannot be displaced, so HMGCR escapes ERAD and
    accumulates, as demonstrated in cultured cells, in patient-derived material,
    and in knock-in mice, where HMGCR protein accumulates across several
    tissues.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: ERAD pathway
    term:

- name: Progressive Corneal Opacification and Light Scattering
  description: >-
    Deposition follows a highly age-predictable spatial sequence: central
    corneal haze and/or crystals first, arcus lipoides in the third decade, then
    midperipheral haze in the late fourth decade. The optical consequence is
    asymmetric across lighting conditions, since scattering degrades
    bright-light (photopic) vision and produces disabling glare while scotopic
    acuity is comparatively preserved into middle age. Cumulative opacification
    drives progressive visual disability and, in most patients, corneal surgery
    by the seventh decade.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  evidence:
  - reference: PMID:21540632
    reference_title: "Differential diagnosis of Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The corneal findings in SCD are very predictable depending on the age of the individual, with initial central corneal haze and/or crystals, subsequent appearance of arcus lipoides in the third decade and formation of midperipheral haze in the late fourth decade."
    explanation: Defines the age-staged spatial progression of corneal opacification.
  - reference: PMID:18427632
    reference_title: "Visual morbidity in thirty-four families with Schnyder crystalline corneal dystrophy (an American Ophthalmological Society thesis)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although excellent scotopic vision continues until middle age in SCCD, most patients had PKP by the 7th decade. SCCD causes progressive corneal opacification, which may result in glare and disproportionate loss of photopic vision."
    explanation: Documents the photopic-versus-scotopic dissociation and the surgical endpoint.
mechanistic_hypotheses:
- hypothesis_group_id: hmgcr_stabilization_model
  hypothesis_label: HMGCR stabilization (blocked ERAD) drives corneal cholesterol accumulation
  status: CANONICAL
  description: >-
    The dominant model. SCD-associated UBIAD1 is sequestered in the ER, competes
    with Insig-1 for HMG-CoA reductase, and blocks its sterol-accelerated
    ER-associated degradation. The stabilized reductase sustains cholesterol
    synthesis, producing corneal sterol overaccumulation. The model is supported
    by concordant cell-biological, biochemical, and knock-in mouse evidence, and
    it explains why the disease is corneal-local and why systemic statins are
    not expected to correct the corneal defect.
  evidence:
  - reference: PMID:31323021
    reference_title: "Schnyder corneal dystrophy-associated UBIAD1 mutations cause corneal cholesterol accumulation by stabilizing HMG-CoA reductase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In summary, these results demonstrate that SCD-associated mutations of UBIAD1 impair its ER-to-Golgi transportation and enhance its interaction with HMGCR."
    explanation: Summary statement of the canonical mechanism.
  - reference: PMID:30785396
    reference_title: "Schnyder corneal dystrophy-associated UBIAD1 inhibits ER-associated degradation of HMG CoA reductase in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results establish the physiological significance of UBIAD1 in cholesterol homeostasis and indicate inhibition of HMGCR ERAD contributes to SCD pathogenesis."
    explanation: In vivo endorsement of the ERAD-inhibition model as contributing to SCD pathogenesis.
- hypothesis_group_id: mk4_deficiency_model
  hypothesis_label: Impaired menaquinone-4 (vitamin K2) synthesis contributes to corneal disease
  status: ALTERNATIVE
  description: >-
    A competing/contributing model in which reduced UBIAD1 prenyltransferase
    output, i.e. loss of endogenous MK-4, is itself pathogenic for the cornea,
    consistent with evidence that vitamin K metabolism is active in human cornea
    and abnormal in SCD keratocytes. The main argument against it as the primary
    driver is that per-variant MK-4 activity does not correlate with SCD
    severity (the hotspot N102S retains most MK-4 activity), and SCD patients
    lack the systemic phenotypes expected from MK-4 or vitamin-K-dependent
    carboxylation deficiency.
  evidence:
  - reference: PMID:32602245
    reference_title: "High expression of Matrix Gla Protein in Schnyder corneal dystrophy patients points to an active role of vitamin K in corneal health."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In primary keratocytes from SCD patients, a highly increased MGP expression and presence of immature MGP forms were detected. Significantly elevated plasma concentration of inactive MGP was found in SCD patients."
    explanation: Demonstrates a measurably abnormal vitamin-K-dependent readout in SCD corneal cells and plasma.
  - reference: PMID:34813684
    reference_title: "Naturally occurring UBIAD1 mutations differentially affect menaquinone biosynthesis and vitamin K-dependent carboxylation."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "However, SCD patients do not exhibit typical phenotypes associated with defects of MK-4 or VKD carboxylation."
    explanation: Argues against MK-4 deficiency being sufficient to explain the SCD phenotype.
phenotypes:
- category: Ocular
  name: Corneal Opacity
  description: >-
    Bilateral, progressive corneal clouding. Central subepithelial and anterior
    stromal haze is the earliest and most consistent finding; midperipheral haze
    is added in the late fourth decade. In patients without crystals, haze plus
    arcus is the entire presenting picture, which is the usual reason for
    diagnostic delay.
  phenotype_term:
    preferred_term: Corneal opacity
    term:
      id: HP:0007957
      label: Corneal opacity
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:40141754
    reference_title: "Case Report of Schnyder Corneal Dystrophy-A Rare Lipid Metabolic Disorder of the Cornea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Schnyder corneal dystrophy (SCD) is a rare autosomal dominant disorder characterized by bilateral corneal opacification due to abnormal cholesterol and phospholipid deposition."
    explanation: Bilateral corneal opacification is the defining clinical feature of the disease.
  - reference: PMID:32280528
    reference_title: "Multimodal Imaging Features of Schnyder Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Slit-lamp examination showed central stromal opacities, arcus lipoides, and midperipheral haze."
    explanation: >-
      All seven eyes in this histology-confirmed series showed central stromal
      opacity, supporting the VERY_FREQUENT band alongside the disease
      definition itself.

- category: Ocular
  name: Corneal Crystals
  description: >-
    Needle-shaped, birefringent, ring- or disc-shaped crystalline cholesterol
    deposits in the subepithelium, Bowman layer, and anterior stroma. Present in
    only about half of affected patients despite the historical disease name;
    when present they make the diagnosis obvious, and when absent the diagnosis
    is frequently missed.
  phenotype_term:
    preferred_term: Corneal crystals
    term:
      id: HP:0000531
      label: Corneal crystals
  frequency: FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:19398911
    reference_title: "Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The configuration of the progressive corneal clouding is predictable on the basis of age and, contrary to many older publications, only 54% of affected patients were found to have corneal crystals."
    explanation: >-
      Quantifies crystal frequency at 54% in the 115-patient cohort, which maps
      to the FREQUENT band (30-79%).
  - reference: PMID:37484611
    reference_title: "Deep phototherapeutic keratectomy for Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Slit-lamp examination revealed needle-like subepithelial crystalline depositions and prominent arcus lipoides bilaterally."
    explanation: Describes the characteristic needle-like subepithelial crystal morphology.

- category: Ocular
  name: Corneal Arcus (Arcus Lipoides)
  description: >-
    A peripheral corneal lipid ring appearing characteristically in the third
    decade, decades earlier than age-related arcus senilis. Premature arcus in a
    young adult with central corneal haze is a strong diagnostic pointer to SCD,
    and in crystal-free patients it may be the most conspicuous sign.
  phenotype_term:
    preferred_term: Corneal arcus
    term:
      id: HP:0001084
      label: Corneal arcus
  diagnostic: true
  notes: >-
    No frequency band is asserted. The literature places arcus lipoides in the
    age-staged sequence from the third decade onward, implying it is common in
    adults, but no source quantifies the proportion of affected patients, and
    the band is age-dependent by construction.
  evidence:
  - reference: PMID:21540632
    reference_title: "Differential diagnosis of Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "subsequent appearance of arcus lipoides in the third decade"
    explanation: Establishes premature arcus lipoides in the third decade as part of the age-staged phenotype.
  - reference: PMID:30223810
    reference_title: "Schnyder corneal dystrophy and associated phenotypes caused by novel and recurrent mutations in the UBIAD1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corneal arcus and stromal haze were the most prominent phenotypical feature in two probands."
    explanation: Shows arcus can dominate the presentation, supporting a FREQUENT rather than universal band.

- category: Ocular
  name: Progressive Loss of Photopic Visual Acuity
  description: >-
    Slowly progressive reduction in best-corrected visual acuity that is
    disproportionately worse in bright light. Scotopic vision stays good until
    middle age, so a patient may report severe daytime disability with a
    near-normal dim-light examination, a dissociation that is characteristic of
    SCD and a key counseling point.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:18427632
    reference_title: "Visual morbidity in thirty-four families with Schnyder crystalline corneal dystrophy (an American Ophthalmological Society thesis)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BCVA at > or =40 years was decreased compared to <40 (P < .0001), although mean BCVA was > 20/30 in both groups."
    explanation: Quantifies age-related decline in best-corrected acuity within the natural-history cohort.
  - reference: PMID:19398911
    reference_title: "Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although scotopic vision remains good until old age, disproportionate loss of photopic vision with frequent complaints of glare necessitates penetrating keratoplasty in the majority of patients over 50 years of age."
    explanation: Establishes the photopic-selective loss and its near-universal progression to surgery after 50.

- category: Ocular
  name: Glare and Photophobia
  description: >-
    Disabling glare and light sensitivity produced by scattering of incident
    light off corneal cholesterol deposits. Glare is frequently the symptom that
    drives patients to surgery even when Snellen acuity is only mildly reduced.
  phenotype_term:
    preferred_term: Photophobia
    term:
      id: HP:0000613
      label: Photophobia
  evidence:
  - reference: PMID:19398911
    reference_title: "Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients often complained of glare preoperatively, which most likely resulted from light scattering from the corneal cholesterol."
    explanation: Documents glare as a prominent presurgical symptom and attributes it to corneal cholesterol.
  - reference: PMID:40141754
    reference_title: "Case Report of Schnyder Corneal Dystrophy-A Rare Lipid Metabolic Disorder of the Cornea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 55-year-old female presented with persistent photophobia, blepharospasm, and corneal discomfort."
    explanation: Photophobia as a presenting complaint in a clinically diagnosed SCD patient.

- category: Metabolic
  name: Hypercholesterolemia
  description: >-
    Elevated serum cholesterol, reported in roughly two-thirds of SCD patients.
    Curated deliberately as an associated finding rather than a disease
    mechanism: hypercholesterolemia is also over-represented among clinically
    unaffected members of SCD pedigrees, so it does not explain the corneal
    lesion, which is driven by a cell-local defect.
  phenotype_term:
    preferred_term: Hypercholesterolemia
    term:
      id: HP:0003124
      label: Hypercholesterolemia
  frequency: FREQUENT
  evidence:
  - reference: PMID:21540632
    reference_title: "Differential diagnosis of Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although 2/3 of SCD patients also have systemic hypercholesterolemia, the incidence of hypercholesterolemia is also increased in unaffected members of SCD pedigrees."
    explanation: >-
      Supplies both the roughly two-thirds frequency (mapping to FREQUENT) and
      the caveat that it is not disease-specific within pedigrees.
  - reference: PMID:30223810
    reference_title: "Schnyder corneal dystrophy and associated phenotypes caused by novel and recurrent mutations in the UBIAD1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mild dyslipidemia was found in all three individuals tested."
    explanation: Independent cohort confirming dyslipidemia among SCD probands.
histopathology:
- name: Lipid Vacuolization of Basal Epithelium and Interlamellar Stroma
  description: >-
    Corneal buttons from keratoplasty show vacuolization of basal epithelial
    cells and empty spaces between stromal lamellae, corresponding to lipid that
    was dissolved out during routine processing, so lipid-preserving stains are
    required to demonstrate the deposits directly.
  evidence:
  - reference: PMID:32280528
    reference_title: "Multimodal Imaging Features of Schnyder Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histology revealed vacuolization of the basal epithelial cells and empty interlamellar stromal vacuoles."
    explanation: Direct histopathologic description from seven histology-confirmed corneal buttons.
  - reference: PMID:24608252
    reference_title: "Phenotype-genotype correlation in patients with Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The histological examination revealed multiple empty widenings of the corneal lamellae that could represent lipids removed from the specimen."
    explanation: Independent confirmation that the apparent stromal spaces represent extracted lipid.
- name: Multilamellar Bodies
  description: >-
    Concentric cytoplasmic membrane whorls formed through an autophagy-dependent
    mechanism. Their presence in the cornea is associated with SCD, and in an ex
    vivo 3D corneal stroma model their abundance rises with autophagy induction
    and falls with autophagy inhibition.
  evidence:
  - reference: PMID:28872183
    reference_title: "Ex vivo 3D human corneal stroma model for Schnyder corneal dystrophy - role of autophagy in its pathogenesis and resolution."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Multilamellar bodies (MLBs) are concentric cytoplasmic membranes which form through an autophagy-dependent mechanism. In the cornea, the presence of MLBs is associated with Schnyder corneal dystrophy (SCD)."
    explanation: Establishes multilamellar bodies as the SCD-associated ultrastructural lesion and their autophagy dependence.
imaging_findings:
- name: Anterior Stromal Hyperreflectivity on AS-OCT
  modality: OCT
  description: >-
    Spectral-domain anterior segment OCT shows diffuse stromal hyperreflectivity
    maximal in the anterior stroma, with epithelial hyperreflectivity and
    hyporeflective stromal striae. AS-OCT is particularly valuable in
    crystal-free patients and in children, where slit-lamp findings are subtle.
  laterality: BILATERAL
  diagnostic: true
  evidence:
  - reference: PMID:32280528
    reference_title: "Multimodal Imaging Features of Schnyder Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SD-OCT cross sections and en face scans showed diffuse hyperreflectivity of the anterior, mid, and posterior stroma with a maximum in the anterior stroma, hyporeflective stromal striae, and epithelial hyperreflectivity."
    explanation: Defines the characteristic AS-OCT signature of SCD.
  - reference: PMID:30223810
    reference_title: "Schnyder corneal dystrophy and associated phenotypes caused by novel and recurrent mutations in the UBIAD1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the Czech probands, SD-OCT confirmed accumulation of reflective material in the anterior stroma."
    explanation: Independent confirmation of anterior stromal reflective accumulation on SD-OCT.
genetic:
- name: UBIAD1
  gene_term:
    preferred_term: UBIAD1
    term:
      id: hgnc:30791
      label: UBIAD1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    UBIAD1 (UbiA prenyltransferase domain containing 1, 1p36.22, formerly TERE1)
    is the sole established SCD gene. Disease-causing alleles are heterozygous
    missense substitutions clustered in the prenyltransferase domain and
    adjacent transmembrane helices; more than 20 are known. p.Asn102Ser is a
    recurrent hotspot found in unrelated European and Asian families rather than
    a single founder haplotype. Genotype-phenotype correlation is generally
    absent, with the notable exception of p.Thr175Ile, which produces prominent
    diffuse haze typically without crystals. Several variants (including
    p.Thr120Arg) fall in the FARM motif, underlining its importance. The gene
    has two coding exons, so Sanger sequencing is an adequate diagnostic
    strategy.
  evidence:
  - reference: PMID:18176953
    reference_title: "Genetic analysis of 14 families with Schnyder crystalline corneal dystrophy reveals clues to UBIAD1 protein function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results suggest that N102S may be a mutation hot spot because the affected families were unrelated including Caucasian and Asian individuals."
    explanation: Establishes N102S as a recurrent hotspot across ancestries rather than a founder allele.
  - reference: PMID:18176953
    reference_title: "Genetic analysis of 14 families with Schnyder crystalline corneal dystrophy reveals clues to UBIAD1 protein function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no genotype phenotype correlation except for the T175I mutation which demonstrated prominent diffuse corneal haze, typically without corneal crystals."
    explanation: Documents the single recognized genotype-phenotype correlation in SCD.
  - reference: PMID:30084067
    reference_title: "Clinical diversity in patients with Schnyder corneal dystrophy-a novel and known UBIAD1 pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The novel p.Thr120Arg is the fourth SCD-causing variant lying within the FARM motif of the UBIAD1 protein, which underlines a high importance of this motif for SCD pathogenesis."
    explanation: Highlights clustering of pathogenic variants within the FARM motif.
  - reference: PMID:20489584
    reference_title: "Newly reported p.Asp240Asn mutation in UBIAD1 suggests central discoid corneal dystrophy is a variant of Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our newly reported UBIAD1 mutation suggests that CDCD is actually a variant of SCD."
    explanation: Basis for absorbing central discoid corneal dystrophy into SCD as a synonym rather than a separate entity.
biochemical:
- name: Inactive (Desphospho-Uncarboxylated) Matrix Gla Protein
  notes: >-
    Matrix Gla protein (MGP) is a vitamin-K-dependent protein that is abundant
    and predominantly mature in normal human cornea. SCD keratocytes show
    increased MGP expression with immature forms, and SCD patients have elevated
    plasma inactive (desphospho-uncarboxylated) MGP, indicating poor vascular
    vitamin K status. This is currently the clearest biochemical readout of the
    vitamin K arm of UBIAD1 dysfunction in patients, and raises an unresolved
    question about cardiovascular risk in SCD.
  evidence:
  - reference: PMID:32602245
    reference_title: "High expression of Matrix Gla Protein in Schnyder corneal dystrophy patients points to an active role of vitamin K in corneal health."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Systemic MGP findings reveal a poor vascular VK status in SCD patients and indicate that SCD may lead to cardiovascular consequences."
    explanation: Reports elevated inactive MGP as a systemic vitamin-K-status biomarker in SCD.
treatments:
- name: Phototherapeutic Keratectomy
  description: >-
    Excimer-laser ablation of the anterior cornea to remove subepithelial and
    anterior stromal crystals and haze. Often preferred as first-line surgery
    for visually significant anterior disease because it is tissue-sparing and
    avoids the graft-related risks of keratoplasty; deep, multizone/multipass
    techniques extend its reach. The principal limitation is cumulative corneal
    thinning, which caps the number of feasible retreatments, so preoperative
    pachymetry is required. It is palliative, not disease-modifying: the
    underlying UBIAD1 defect persists and deposits can re-form.
  treatment_term:
    preferred_term: Surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Corneal Cholesterol and Phospholipid Deposition
    treatment_effect: INHIBITS
    description: >-
      Physically ablates the deposit-laden anterior cornea rather than altering
      the metabolic defect that generates the deposits.
    evidence:
    - reference: PMID:15084868
      reference_title: "Phototherapeutic keratectomy in Schnyder crystalline corneal dystrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PTK may be effective in the treatment of SCCD, especially if the crystals are the cause of visual disturbance."
      explanation: Ties the benefit of PTK specifically to removal of the crystalline deposits.
  evidence:
  - reference: PMID:37484611
    reference_title: "Deep phototherapeutic keratectomy for Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 22 months of follow-up, the best-corrected visual acuity had increased from 0.5 to 0.9 in the right eye and from 0.3 to 0.9 in the left eye."
    explanation: Documents visual gain after deep PTK in an SCD patient.
  - reference: PMID:37484611
    reference_title: "Deep phototherapeutic keratectomy for Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PTK can increase patients' visual acuity and eliminate the need for aggressive management through penetrating keratoplasty or deep anterior lamellar keratoplasty."
    explanation: Supports PTK as a keratoplasty-sparing first-line option.
  - reference: PMID:15084868
    reference_title: "Phototherapeutic keratectomy in Schnyder crystalline corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No recurrence was detected after 68 months of follow-up."
    explanation: Indicates durable benefit over almost six years in one reported case.

- name: Penetrating Keratoplasty
  description: >-
    Full-thickness corneal transplantation, reserved for advanced disease or
    when PTK is insufficient or precluded by corneal thickness. It is the
    endpoint for most patients by the seventh decade. Long-term outcomes in SCD
    are good: in one pedigree followed for a mean of 8.8 years there was no
    graft rejection and no disease recurrence. Deep anterior lamellar
    keratoplasty is an alternative that preserves the (unaffected) host
    endothelium.
  treatment_term:
    preferred_term: Penetrating keratoplasty
    term:
      id: NCIT:C222070
      label: Penetrating Keratoplasty
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Progressive Corneal Opacification and Light Scattering
    treatment_effect: INHIBITS
    description: >-
      Replaces the opacified cornea with clear donor tissue, restoring the
      optical pathway without addressing the causal UBIAD1 defect.
    evidence:
    - reference: PMID:29319599
      reference_title: "Long-Term Outcome After Penetrating Keratoplasty in a Pedigree With the G177E Mutation in the UBIAD1 Gene for Schnyder Corneal Dystrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Preoperatively, BCVA ranged from logarithm of the minimum angle of resolution (logMAR) 1.7 to logMAR 0.22; yet, it was found that BCVA had improved to logMAR 0.02 at 3 years postoperatively."
      explanation: Quantifies restoration of visual acuity after replacing the opacified cornea.
  evidence:
  - reference: PMID:18427632
    reference_title: "Visual morbidity in thirty-four families with Schnyder crystalline corneal dystrophy (an American Ophthalmological Society thesis)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PKP was reported in 20 of 37 (54%) patients > or =50 years and 10 of 13 (77%) of patients > or =70."
    explanation: Establishes the age-dependent likelihood of requiring keratoplasty.
  - reference: PMID:29319599
    reference_title: "Long-Term Outcome After Penetrating Keratoplasty in a Pedigree With the G177E Mutation in the UBIAD1 Gene for Schnyder Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all eyes, no disease recurrence or corneal graft rejection was observed during the follow-up period, and graft transparency was maintained."
    explanation: Long-term graft survival without recurrence in a genotyped SCD pedigree.

- name: Genetic Counseling and Cascade Screening
  description: >-
    Autosomal dominant transmission with a 50% offspring risk, high but
    age-dependent penetrance, and variable expressivity make counseling
    important. Because UBIAD1 has only two coding exons, targeted Sanger
    sequencing resolves most cases; testing is worthwhile even without a family
    history given documented de novo variants, and is especially useful in
    children and in crystal-free patients where the clinical diagnosis is
    ambiguous.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:30223810
    reference_title: "Schnyder corneal dystrophy and associated phenotypes caused by novel and recurrent mutations in the UBIAD1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although de novo occurrence of mutations in UBIAD1 is extremely rare, SCD should be considered in the differential diagnosis of bilateral corneal haze and/or crystal deposition, especially in children."
    explanation: Supports genetic evaluation in children and in apparently sporadic presentations.
  - reference: PMID:27382485
    reference_title: "Identification of the First De Novo UBIAD1 Gene Mutation Associated with Schnyder Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This highlights the value of genetic testing in clinical diagnostic settings, even in the absence of a positive family history."
    explanation: Direct endorsement of genetic testing regardless of family history.

- name: Systemic Lipid-Lowering Therapy (Not Corneal Disease-Modifying)
  description: >-
    Statins are appropriately prescribed for the concurrent systemic
    hypercholesterolemia seen in about two-thirds of patients, but there is no
    evidence they alter the corneal disease, and there is a mechanistic reason
    to expect them not to. The SCD lesion acts by blocking degradation of
    HMG-CoA reductase, the very enzyme statins inhibit, so the mutant protein
    directly opposes the compensatory turnover that statin therapy depends on.
    This entry is curated to record the absence of corneal benefit, not to
    recommend statins for SCD.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: HMG-CoA reductase inhibitor
      term:
        id: NCIT:C1655
        label: HMG-CoA Reductase Inhibitor
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:32188638
    reference_title: "Schnyder corneal dystrophy-associated UBIAD1 is defective in MK-4 synthesis and resists autophagy-mediated degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings have important implications not only for the understanding of SCD etiology but also for the efficacy of cholesterol-lowering statin therapy, which becomes limited, in part, because of UBIAD1-mediated inhibition of reductase ERAD."
    explanation: >-
      Provides the mechanistic basis for expecting limited statin efficacy where
      UBIAD1 inhibits reductase ERAD.
  notes: >-
    No disease-modifying pharmacotherapy for the corneal lesion exists.
    Restoring HMGCR ERAD or correcting UBIAD1 ER retention are plausible future
    targets but remain at the preclinical stage.
diagnosis:
- name: Slit-Lamp Biomicroscopy
  description: >-
    Slit-lamp examination is the first-line clinical assessment and, in typical
    cases with visible crystals, is sufficient to raise the diagnosis. It
    demonstrates the characteristic combination of central stromal opacity,
    arcus lipoides, and midperipheral haze, but crystals are absent in roughly
    half of affected individuals, so a negative slit-lamp crystal finding does
    not exclude the diagnosis.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Central stromal opacities, arcus lipoides, and midperipheral haze; corneal
    crystals in a minority of eyes.
  evidence:
  - reference: PMID:32280528
    reference_title: "Multimodal Imaging Features of Schnyder Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Slit-lamp examination showed central stromal opacities, arcus lipoides, and midperipheral haze. Corneal crystals were found in 2 out of 7 eyes."
    explanation: >-
      Documents the slit-lamp findings and the limited sensitivity of crystals
      as a slit-lamp sign.
- name: Anterior Segment Imaging (SD-OCT and In Vivo Confocal Microscopy)
  description: >-
    High-resolution anterior segment imaging confirms the diagnosis when
    slit-lamp findings are equivocal. SD-OCT localizes hyperreflective material
    to the anterior stroma, and in vivo confocal microscopy resolves the
    individual crystalline and hyperreflective deposits in epithelium and
    stroma.
  diagnosis_term:
    preferred_term: in vivo confocal microscopy
    term:
      id: NCIT:C16853
      label: Microscopy
  results: >-
    Diffuse stromal hyperreflectivity maximal anteriorly on SD-OCT, with
    needle-shaped and rectangular crystals and hyperreflective epithelial and
    stromal deposits on confocal microscopy.
  evidence:
  - reference: PMID:32280528
    reference_title: "Multimodal Imaging Features of Schnyder Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High-resolution multimodal imaging demonstrates the characteristic features of SCD which involve both the corneal epithelium and stroma, and it provides diagnosis confirmation even in eyes with no visible corneal crystals at slit-lamp examination."
    explanation: >-
      States that multimodal imaging confirms the diagnosis in exactly the
      crystal-negative eyes where slit-lamp examination is insufficient.
  - reference: PMID:32280528
    reference_title: "Multimodal Imaging Features of Schnyder Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IVCM revealed hyperreflective deposits in the epithelium and throughout the stroma, thin subepithelial nerves, and needle-shaped and rectangular crystals."
    explanation: Documents the confocal microscopy findings reported by this modality.
- name: Molecular Genetic Testing of UBIAD1
  description: >-
    Sanger sequencing of the UBIAD1 coding exons is the confirmatory test for
    this autosomal-dominant Mendelian disorder. It is decisive in the
    presentations where imaging is least helpful — early disease in children and
    apparently sporadic cases arising from de novo variants.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >-
    A heterozygous pathogenic UBIAD1 missense variant, most often at the N102 or
    G177 hotspot residues.
  evidence:
  - reference: PMID:30223810
    reference_title: >-
      Schnyder corneal dystrophy and associated phenotypes caused by novel and
      recurrent mutations in the UBIAD1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UBIAD1 coding exons were amplified and Sanger sequenced in each proband."
    explanation: >-
      Documents Sanger sequencing of the UBIAD1 coding exons as the molecular
      diagnostic method applied to each proband.
  - reference: PMID:30223810
    reference_title: >-
      Schnyder corneal dystrophy and associated phenotypes caused by novel and
      recurrent mutations in the UBIAD1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although de novo occurrence of mutations in UBIAD1 is extremely rare, SCD should be considered in the differential diagnosis of bilateral corneal haze and/or crystal deposition, especially in children."
    explanation: >-
      Supports molecular testing in apparently sporadic and paediatric
      presentations, where the clinical phenotype alone is least conclusive.
differential_diagnoses:
- name: Crystalline and lipid keratopathies
  description: >-
    Crystal-forming corneal disorders and systemic lipid-metabolism disorders
    with corneal opacification. The crystal-free half of SCD patients is where
    misdiagnosis concentrates: bilateral central corneal haze with premature
    arcus in a young adult, with or without a family history, should prompt
    UBIAD1 testing.
  distinguishing_features:
  - SCD is autosomal dominant with an age-predictable sequence of central haze, then arcus lipoides in the third decade, then midperipheral haze, and a characteristically spared corneal endothelium.
  - LCAT deficiency, fish-eye disease, and Tangier disease are autosomal recessive and are accompanied by characteristic systemic lipoprotein abnormalities.
  - Cystinosis and tyrosinemia have systemic (renal, hepatic, dermatologic) features absent in SCD.
  - Paraproteinemic crystalline keratopathy accompanies multiple myeloma or monoclonal gammopathy, detectable on serum and urine protein electrophoresis.
  - Infectious crystalline keratopathy is typically unilateral and follows corneal surgery or chronic topical corticosteroid use.
  evidence:
  - reference: PMID:21540632
    reference_title: "Differential diagnosis of Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The differential diagnosis of the SCD patient includes other diseases with crystalline deposits such as cystinosis, tyrosinemia, Bietti crystalline dystrophy, hyperuricemia/gout, multiple myeloma, monoclonal gammopathy, infectious crystalline keratopathy, and Dieffenbachia keratitis."
    explanation: Enumerates the crystalline-deposit differential.
  - reference: PMID:21540632
    reference_title: "Differential diagnosis of Schnyder corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diseases of systemic lipid metabolism that cause corneal opacification, such as lecithin-cholesterol acyltransferase deficiency, fish eye disease and Tangier disease, should also be considered although these are autosomal recessive disorders."
    explanation: Enumerates the systemic lipid-disorder differential and the inheritance-mode discriminator.
animal_models:
- name: Ubiad1 G184R/+ knock-in mouse
  species: Mus musculus
  genotype: Ubiad1 G184R/+ heterozygous knock-in
  category: Knock-in mouse model of Schnyder corneal dystrophy (ERAD-inhibition mechanism)
  genes:
  - preferred_term: UBIAD1
    term:
      id: hgnc:30791
      label: UBIAD1
  description: >-
    Heterozygous knock-in of the mouse orthologue of a human SCD variant.
    Because complete Ubiad1 knockout is embryonic lethal, the heterozygous
    knock-in is the tractable in vivo model. Aged animals accumulate HMGCR in
    multiple tissues and develop corneal opacification with free cholesterol
    accumulation, recapitulating the human corneal phenotype and validating the
    ERAD-inhibition mechanism in vivo. Limitation: the model does not reproduce
    the human age-staged spatial progression (central crystals, then arcus
    lipoides, then midperipheral haze), and crystal formation specifically is
    not reported.
  modeled_mechanisms:
  - target: Blocked Sterol-Accelerated HMGCR ERAD
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Knock-in of the SCD-associated variant reproduces the molecular lesion in
      vivo: mutant UBIAD1 is sequestered in the ER, HMGCR ERAD is inhibited, and
      HMGCR accumulates in several tissues.
    readouts:
    - name: HMGCR protein abundance in tissue
      target: Blocked Sterol-Accelerated HMGCR ERAD
      direction: INCREASED

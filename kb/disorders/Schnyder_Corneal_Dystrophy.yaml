    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of genes in our interval led to the identification of five putative causal mutations in gene UBIAD1, in our family as well as in four other small families of various geographic origins."
    explanation: One of the two 2007 studies that established UBIAD1 as the SCD gene.
  - reference: PMID:17962451
    reference_title: "Mutations in the UBIAD1 gene on chromosome short arm 1, region 36, cause Schnyder crystalline corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Predictions of the protein structure indicated that a prenyl-transferase domain and several transmembrane helices are affected by these mutations."
    explanation: Localizes SCD variants to the prenyltransferase domain and transmembrane helices.
  - reference: PMID:31323021
    reference_title: "Schnyder corneal dystrophy-associated UBIAD1 mutations cause corneal cholesterol accumulation by stabilizing HMG-CoA reductase."
    supports: SUPPORT

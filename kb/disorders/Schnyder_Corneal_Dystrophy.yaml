    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SCD-associated mutations in UBIAD1 block its displacement from reductase in the presence of geranylgeraniol, thereby preventing degradation of reductase."
    explanation: Identifies the exact molecular defect, failure of geranylgeraniol-induced displacement from HMGCR.
  - reference: PMID:25742604

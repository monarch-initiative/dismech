- name: Corneal Cholesterol and Phospholipid Deposition
  description: >-
    Unesterified cholesterol, cholesterol esters, and phospholipids accumulate
    in the basal corneal epithelium, Bowman layer, and anterior-to-mid stroma.
    In roughly half of patients the lipid organizes into needle-shaped,
    birefringent subepithelial and anterior stromal crystals; in the remainder
    it produces only diffuse haze. Ultrastructurally the deposits present as
    multilamellar bodies and, on histology, as vacuolization of basal epithelial
    cells and empty interlamellar stromal vacuoles where lipid was dissolved out
    during processing. The corneal endothelium is characteristically spared.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED

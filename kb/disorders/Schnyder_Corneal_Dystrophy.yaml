      snippet: "We observed reduced MK-4 synthesis by UBIAD1 altered by SCD mutations p.N102S, p.G177R/E, and p.D112N, and molecular models showed p.G177-mutant UBIAD1 disrupted transmembrane helices and active site residues."
      explanation: Demonstrates reduced MK-4 synthetic activity for several SCD variants.

- name: ER Sequestration of Mutant UBIAD1
  description: >-
    Wild-type UBIAD1 cycles between the ER and the medial-trans Golgi, with GGpp
    abundance acting as the switch: when GGpp is plentiful UBIAD1 is released
    from HMGCR and moves to the Golgi, and when GGpp falls UBIAD1 is trapped in
    the ER. SCD-associated UBIAD1 is constitutively trapped in the ER regardless
    of GGpp, mislocalizing the protein to the compartment where HMGCR resides.
    ER sequestration additionally shields the mutant protein from
    autophagy-mediated degradation, so it accumulates intracellularly and
    amplifies its own downstream effect.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport

    explanation: Describes the normal regulatory switch that SCD variants break.
  - reference: PMID:30785396
    reference_title: "Schnyder corneal dystrophy-associated UBIAD1 inhibits ER-associated degradation of HMG CoA reductase in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We now report knockin mice expressing SCD-associated UBIAD1 accumulate HMGCR in several tissues resulting from ER sequestration of mutant UBIAD1 and inhibition of HMGCR ERAD."
    explanation: In vivo confirmation that the SCD variant blocks HMGCR ERAD and causes HMGCR accumulation.
  downstream:
  - target: Increased Corneal Cholesterol Biosynthesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - hmgcr_stabilization_model
    description: >-
      Stabilized HMGCR raises flux through the rate-limiting step of the
      mevalonate pathway, increasing cholesterol synthesis.
    evidence:
    - reference: PMID:31323021
      reference_title: "Schnyder corneal dystrophy-associated UBIAD1 mutations cause corneal cholesterol accumulation by stabilizing HMG-CoA reductase."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The stabilization of HMGCR by UBIAD1 increases cholesterol biosynthesis and eventually causes cholesterol accumulation in the cornea."
      explanation: States the causal step from HMGCR stabilization to increased cholesterol synthesis.

- name: Impaired Menaquinone-4 Synthesis
  description: >-
    UBIAD1 is the human menaquinone-4 (vitamin K2) biosynthetic enzyme,
    prenylating vitamin K precursors using GGpp. SCD-associated variants have
    reduced MK-4 synthetic activity, plausibly through reduced GGpp affinity.
    The contribution of this arm to corneal disease is uncertain and is curated
    as an alternative rather than the canonical mechanism: SCD patients do not
    show the phenotypes expected from MK-4 or vitamin-K-dependent carboxylation
    deficiency, and per-variant MK-4 activity does not track with clinical
    severity. A vitamin-K readout is nonetheless measurably abnormal in SCD
    keratocytes and plasma.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL

        snippet: "We now report knockin mice expressing SCD-associated UBIAD1 accumulate HMGCR in several tissues resulting from ER sequestration of mutant UBIAD1 and inhibition of HMGCR ERAD."
        explanation: Reports the measured tissue HMGCR accumulation underlying this readout.
    evidence:

  - reference: PMID:33117025
    reference_title: "Spaceflight Associated Neuro-Ocular Syndrome (SANS): A Systematic Review and Future Directions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      even with persistent anatomic and physiologic neuro-ocular changes, any
      functional impact has been correctable with spectacles
    explanation: >-
      Systematic review notes functional visual changes are correctable
      with spectacles, though structural changes may persist.
environmental:
- name: Microgravity Exposure
  influences_mechanisms:
  - target: Cephalad Fluid Shift in Microgravity
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Microgravity is not a risk factor for this entry, it is the condition
      without which none of it happens, and the node is named for it. Direct
      because the step is mechanical rather than biological: removing the
      hydrostatic gradient redistributes fluid headward, which is what the
      node describes. The fetched item is the authors' own conclusion and
      names both ends of this edge.
    evidence:
    - reference: PMID:21849212
      reference_title: "Optic disc edema, globe flattening, choroidal folds, and hyperopic shifts observed in astronauts after long-duration space flight."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We hypothesize that the optic nerve and ocular changes we describe may result from cephalad fluid shifts brought about by prolonged microgravity exposure"
      explanation: >-
        Names prolonged microgravity exposure and the cephalad fluid shift in
        one sentence, which is exactly this edge. Graded support to match this
        paper's existing grading on this node, though the authors write it as
        a hypothesis and the word belongs on the record.
    - reference: PMID:31162175
      reference_title: "Gravitational Influence on Intraocular Pressure: Implications for Spaceflight and Disease."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Over the last 10 years, ~1 in 3 astronauts flying long-duration ISS missions have presented with ≥1 of these ocular findings."
      explanation: >-
        Reports that about one in three astronauts on long-duration station
        missions showed at least one of these ocular findings. It sizes how
        often the exposure is followed by the disease and says nothing about
        the fluid shift at this node.
    - reference: PMID:37072472
      reference_title: "Spaceflight associated neuro-ocular syndrome (SANS): an update on potential microgravity-based pathophysiology and mitigation development."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Long-duration spaceflight is associated with neurologic and ophthalmic clinical and imaging findings in astronauts termed spaceflight associated neuro-ocular syndrome (SANS)."
      explanation: >-
        States that long-duration spaceflight is associated with the
        neurologic and ophthalmic findings that define the syndrome. An
        association at the level of the whole disease.
  description: >
    Prolonged exposure to microgravity during spaceflight is the primary
    environmental factor driving SANS. The condition is predominantly seen
    after missions of 6 months or longer aboard the International Space Station.
    Over the last 10 years, approximately 1 in 3 astronauts flying long-duration
    ISS missions have presented with one or more SANS findings.
  evidence:
  - reference: PMID:31162175
    reference_title: "Gravitational Influence on Intraocular Pressure: Implications for Spaceflight and Disease."
    supports: SUPPORT

- name: Elevated Ambient Carbon Dioxide
  influences_mechanisms:
  - target: Elevated Intracranial Pressure
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The two slots here are deliberately telling different stories, and the
      difference is the point. The link type is known because the schema asks
      what the field knows: hypercapnic cerebral vasodilation raising
      intracranial pressure is well-characterised physiology, and this
      exposure's own description names that step. The predicate is the weaker
      one because it answers a different question, whether that edge operates
      in this population at cabin concentrations, which the source declines
      to say. Recorded as modulating rather than predisposing on the source's
      own
      instruction. The exposure entry describes cabin carbon dioxide raising
      intracranial pressure through cerebral vasodilation, but the cited
      review states outright that the physiologic role of carbon dioxide
      remains ill defined and lists it among its open questions. Both items
      are carried so the candidate mechanism and the authors' refusal to
      commit to it travel together, and the predicate matches the weaker of
      the two.
    evidence:
    - reference: PMID:32047839
      reference_title: "Spaceflight associated neuro-ocular syndrome (SANS) and the neuro-ophthalmologic effects of microgravity: a review and an update."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The ongoing debate has prompted revisiting some of the other risk factors including carbon dioxide and in particular the role of hypercapnia in increased ICP"
      explanation: >-
        Names carbon dioxide and the intracranial pressure at this node in one
        clause. Partial because it reports a debate being revisited rather
        than a result, and it is the closest any cited sentence comes to this
        edge.
    - reference: PMID:32047839
      reference_title: "Spaceflight associated neuro-ocular syndrome (SANS) and the neuro-ophthalmologic effects of microgravity: a review and an update."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Since astronauts are exposed to these elevated CO2 levels in addition to MG the possible physiologic role of CO2 remains ill defined"
      explanation: >-
        The bound on the claim, in the same paper's words: carbon dioxide is
        confounded with microgravity because astronauts meet both at once, and
        its physiologic role is not defined. This is why the link modulates
        rather than predisposes.
    - reference: PMID:32047839
      reference_title: "Spaceflight associated neuro-ocular syndrome (SANS) and the neuro-ophthalmologic effects of microgravity: a review and an update."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL

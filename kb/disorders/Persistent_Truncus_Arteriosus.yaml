progression:
- phase: Fetal and immediate newborn period
  notes: >
    The lesion is fully formed by week eight of gestation and is well tolerated in utero,
    because the fetal circulation is already a parallel mixing circuit. At birth, high
    neonatal pulmonary vascular resistance still limits pulmonary flow, so the infant may
    look deceptively well. Increasingly the diagnosis is made antenatally or by newborn pulse
    oximetry rather than by clinical deterioration.
- phase: Neonatal decompensation
  notes: >
    Over the first days to weeks pulmonary vascular resistance falls physiologically,
    pulmonary blood flow rises steeply, and the infant develops high-output heart failure.
    This is when repair is performed, and the window is narrow. Contemporary in-hospital
    mortality around repair is about 10.8 percent, with prematurity, stroke, necrotising
    enterocolitis, and venous thrombosis as independent risk factors.
  evidence:
  - reference: PMID:32557823
    reference_title: "Outcomes of truncus arteriosus repair and predictors of mortality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, 3009 neonates met inclusion criteria; a total of 326 patients died during the hospitalization (10.8%)."
    explanation: Contemporary national in-hospital mortality across 3009 neonates.
  - reference: PMID:32557823
    reference_title: "Outcomes of truncus arteriosus repair and predictors of mortality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "necrotizing enterocolitis (aOR = 3.10; 95% CI: 1.24-7.74; P = .015) and presence of venous thrombosis (aOR = 13.5; 95% CI: 6.7-27.2; P < .001)"
    explanation: Gives two of the independent mortality risk factors with their adjusted odds ratios in the same cohort.
- phase: Untreated progression to fixed pulmonary vascular disease
  notes: >
    Without repair, sustained systemic-pressure pulmonary flow produces irreversible
    pulmonary vascular obstructive disease within the first year or two, converting an
    operable lesion into an inoperable one. This is the natural history that neonatal repair
    exists to pre-empt, and it is why deferring surgery is not a conservative option here.
  evidence:
  - reference: PMID:38884754
    reference_title: "Molecular Pathways and Animal Models of Truncus Arteriosus."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "a single common outflow vessel persists resulting in a serious clinical condition known as persistent truncus arteriosus or common arterial trunk"
    explanation: Characterises the unrepaired lesion as a serious condition; PARTIAL because the specific pulmonary vascular endpoint is not described.
- phase: Post-repair surveillance and reintervention
  notes: >
    Repair is not a cure but a conversion into a different chronic problem. The right
    ventricle to pulmonary artery conduit is fixed in size while the child is not, so it is
    outgrown and must be replaced serially through childhood and adolescence. Truncal valve
    regurgitation frequently progresses and drives further reoperation independently of the
    conduit.
diagnosis:
- name: Transthoracic echocardiography
  description: >
    The diagnostic test. It demonstrates the single trunk overriding the ventricular septal
    defect, the number and competence of the truncal valve cusps, the origin pattern of the
    pulmonary arteries that determines the anatomic subtype, and any arch anomaly. It is also
    the test that must be complete before surgery, because the operative plan depends on
    these details.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
- name: 22q11.2 deletion testing
  description: >
    Should be performed in every infant with this diagnosis, not only in those who look
    syndromic. Guidelines specifically name truncus arteriosus as an indication, and the
    reason is practical: the deletion changes perioperative management through hypocalcaemia
    and immunodeficiency, changes recurrence counselling for the parents, and identifies
    neurodevelopmental and psychiatric risks long before they would otherwise be visible.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:32049433
    reference_title: "22q11.2 deletion syndrome and congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "New guidelines suggest screening for a 22q11.2 deletion in the patient with tetralogy of Fallot, truncus arteriosus, interrupted aortic arch type B, conoventricular septal defects as well as those with an isolated aortic arch anomaly."
    explanation: Names truncus arteriosus explicitly as a guideline-level indication for deletion testing.
  - reference: PMID:32049433
    reference_title: "22q11.2 deletion syndrome and congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early identification of a 22q11.2 deletion in the neonate or infant when other syndromic features may not be apparent allows for timely parental screening for reproductive counseling and anticipatory evaluation of cardiac and noncardiac features."
    explanation: States why testing should not wait for syndromic features to declare themselves.
- name: Whole-genome or whole-exome sequencing in deletion-negative cases
  description: >
    Sequencing has real yield in patients without the deletion. In a Japanese series of 11
    deletion-negative patients, five carried pathogenic TMEM260 variants and two more carried
    de novo variants in GATA6 and NOTCH1, so a majority of the cohort received a molecular
    diagnosis. The yield is population-dependent, since the TMEM260 signal rests on a local
    founder variant, which is itself an argument for sequencing rather than for targeted
    panels built elsewhere.
  diagnosis_term:
    preferred_term: whole genome sequencing
    term:
      id: NCIT:C101294
      label: Whole Genome Sequencing
  evidence:
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed whole-genome sequencing of 11 Japanese patients having TA without 22q11.2 deletion. Among five patients, we identified pathogenic variants in TMEM260"
    explanation: Demonstrates the diagnostic yield of sequencing in deletion-negative patients.
- name: Genetic counselling
  description: >
    Follows from the genetic result and is a distinct clinical action. Counselling differs
    sharply by mechanism: a de novo 22q11.2 deletion carries low recurrence risk but a fifty
    percent transmission risk for the affected child, whereas biallelic TMEM260 disease is
    autosomal recessive with a one in four sibling recurrence risk and identifiable carrier
    parents.
  diagnosis_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32049433
    reference_title: "22q11.2 deletion syndrome and congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "allows for timely parental screening for reproductive counseling and anticipatory evaluation of cardiac and noncardiac features"
    explanation: States the reproductive-counselling purpose that the genetic diagnosis serves.
treatments:
- name: Neonatal complete surgical repair
  description: >
    The definitive treatment and the only one that changes the outcome. The ventricular septal
    defect is closed so the trunk becomes the aorta and arises from the left ventricle alone,
    the pulmonary arteries are separated from the trunk, and continuity from the right
    ventricle to the pulmonary arteries is re-established with a conduit. It is performed in
    the neonatal period, before pulmonary vascular disease develops, and it carries an
    in-hospital mortality around one in ten in contemporary national data.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac surgery
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_mechanisms:
  - target: Unobstructed pulmonary blood flow at systemic pressure
    treatment_effect: INHIBITS
    description: >
      Separating the pulmonary arteries from the trunk and interposing a conduit removes the
      pulmonary bed's exposure to systemic pressure and unrestricted flow.
    evidence:
    - reference: PMID:32557823
      reference_title: "Outcomes of truncus arteriosus repair and predictors of mortality."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overall, 3009 neonates met inclusion criteria; a total of 326 patients died during the hospitalization (10.8%)."
      explanation: Establishes neonatal repair as standard practice at national scale and quantifies its mortality.
  - target: Obligatory mixing of systemic and pulmonary venous return
    treatment_effect: INHIBITS
    description: >
      Closing the ventricular septal defect commits the trunk to the left ventricle and
      abolishes the obligatory admixture.
    evidence:
    - reference: PMID:38884754
      reference_title: "Molecular Pathways and Animal Models of Truncus Arteriosus."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "the outflow tract of the heart is divided into two distinct channels to separate the oxygenated systemic blood flow from the deoxygenated pulmonary circulation"
      explanation: States the separation of circulations that the operation restores surgically; PARTIAL because the source describes normal development rather than the operation.
  evidence:
  - reference: PMID:32557823
    reference_title: "Outcomes of truncus arteriosus repair and predictors of mortality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "necrotizing enterocolitis (aOR = 3.10; 95% CI: 1.24-7.74; P = .015) and presence of venous thrombosis (aOR = 13.5; 95% CI: 6.7-27.2; P < .001)"
    explanation: Identifies comorbidities carrying the highest adjusted operative risk, which is what perioperative planning acts on.
- name: Serial right ventricle to pulmonary artery conduit replacement
  description: >
    A consequence of the repair rather than a treatment of the disease. The conduit does not
    grow, so it is outgrown and becomes obstructive, and it is replaced repeatedly through
    childhood and adolescence. This converts a neonatal emergency into a lifelong surgical
    relationship, and it is the main reason these patients need permanent congenital cardiology
    follow-up rather than discharge after successful repair.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac surgery
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_mechanisms:
  - target: Pulmonary vascular obstructive disease
    treatment_effect: INHIBITS
    description: >
      Maintaining an unobstructed conduit preserves the low-pressure separation of the
      pulmonary circulation that the original repair created.
- name: Preoperative anticongestive medical therapy
  description: >
    Diuresis and afterload reduction to control pulmonary overcirculation while the infant is
    prepared for surgery. It is a holding measure with a specific trap: supplemental oxygen
    lowers pulmonary vascular resistance and therefore increases pulmonary flow, so generous
    oxygen makes the physiology worse in an infant whose saturation looks reassuringly high.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diuretic
      term:
        id: NCIT:C448
        label: Diuretic
  target_mechanisms:
  - target: Pulmonary overcirculation and volume-overload heart failure
    treatment_effect: MODULATES
    description: >
      Diuresis and afterload reduction relieve congestion without altering the anatomy that
      causes it.
- name: Extracorporeal membrane oxygenation
  description: >
    Rescue support, used in about seven percent of these admissions. Its association with a
    very high mortality odds ratio should be read as severity marking rather than harm: it is
    used in infants who are dying, and the confounding by indication is total.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: extracorporeal membrane oxygenation
    term:
      id: NCIT:C171507
      label: Extracorporeal Membrane Oxygenation
  target_mechanisms:
  - target: Perioperative myocardial ischaemia
    treatment_effect: BYPASSES
    description: >
      Extracorporeal support maintains systemic perfusion and oxygenation while the injured
      myocardium recovers.
    evidence:
    - reference: PMID:32557823
      reference_title: "Outcomes of truncus arteriosus repair and predictors of mortality."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Extracorporeal membrane oxygenation utilization was 7.1%."
      explanation: Quantifies how often extracorporeal support is used in this population.
  evidence:
  - reference: PMID:32557823
    reference_title: "Outcomes of truncus arteriosus repair and predictors of mortality."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients who received extracorporeal membrane oxygenation support or had cardiac catheterization procedure during the hospitalization had increased odds of mortality"
    explanation: Reports the mortality association; PARTIAL and directionally uninterpretable as a treatment effect, because the sickest infants are the ones cannulated.
genetic:
- name: TBX1
  gene_term:
    preferred_term: TBX1
    term:
      id: hgnc:11592
      label: TBX1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    TBX1 sits within the 22q11.2 deleted region and haploinsufficiency for it is regarded as
    the principal driver of the conotruncal phenotype in the deletion syndrome. It is curated
    as causative in that dosage context rather than as a gene in which point mutations are
    the usual route to this malformation. The deletion is present in an estimated 12 to 35
    percent of truncus arteriosus cases and is the single largest identified cause.
  evidence:
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common cause of TA is 22q11.2 deletion syndrome, accounting for 12-35% of all TA cases."
    explanation: Quantifies the deletion's contribution, which is the basis for treating this locus as the leading cause.
  - reference: PMID:38884753
    reference_title: "Human Genetics of Truncus Arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Integrated human genetics and molecular/developmental biology studies have revealed that truncus arteriosus is highly associated with 22q11.2 deletion syndrome."
    explanation: Independent statement of the association from a genetics review.
- name: TMEM260
  gene_term:
    preferred_term: TMEM260
    term:
      id: hgnc:20185
      label: TMEM260
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    Biallelic loss-of-function TMEM260 variants cause structural heart defects and renal
    anomalies syndrome, and account for a large share of deletion-negative truncus arteriosus
    in Japan. The mechanism is autosomal recessive, which matters for counselling because it
    gives a one in four sibling recurrence risk rather than the low recurrence of a de novo
    deletion. The Japanese signal rests on a single founder variant, c.1617del, estimated to
    have arisen about 23 000 years ago and carried at 0.36 percent allele frequency, so the
    gene's share of cases is expected to be population-specific rather than universal.
  evidence:
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among five patients, we identified pathogenic variants in TMEM260; the biallelic loss-of-function variants of which have recently been associated with structural heart defects and renal anomalies syndrome (SHDRA)."
    explanation: Establishes biallelic TMEM260 loss of function as a cause in five of 11 deletion-negative patients.
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the allele frequency of the c.1617del variant in the Japanese population (0.36%), approximately 26% of Japanese patients afflicted with TA could harbor homozygous c.1617del variants."
    explanation: Quantifies the founder variant's projected population-level contribution, and by construction its population specificity.
- name: NKX2-6
  gene_term:
    preferred_term: NKX2-6
    term:
      id: hgnc:32940
      label: NKX2-6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    A homozygous F151L homeodomain variant was mapped by autozygosity in a large
    consanguineous family with common arterial trunk. The gene is expressed in pharyngeal
    endoderm and embryonic outflow tract myocardium, which fits. The instructive complication
    is that mice homozygous for a targeted Nkx2.6 mutation are normal, with Nkx2.5 expression
    expanding into the territory Nkx2.6 vacates, so the mouse null is rescued by functional
    complementation that apparently does not operate in the human. That makes this locus a
    worked example of why a normal knockout phenotype does not refute a human genetic finding.
  evidence:
  - reference: PMID:15649947
    reference_title: "Common arterial trunk associated with a homeodomain mutation of NKX2.6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have used autozygosity mapping of a large consanguineous family segregating CAT to map the causative locus to chromosome 8p21. An F151L mutation was identified in the homeodomain of NKX2.6"
    explanation: The mapping and variant identification in a segregating consanguineous family.
  - reference: PMID:15649947
    reference_title: "Common arterial trunk associated with a homeodomain mutation of NKX2.6."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Introduction of F157L into human NKX2.5 substantially reduced its transcription activating function, its synergism with partners at the atrial natriuretic factor (ANF) and connexin-40 (Cx40) promoters and its specific DNA binding."
    explanation: Functional evidence for the variant's effect, obtained in the NKX2.5 surrogate because NKX2.6 targets were unknown.
- name: GATA6
  gene_term:
    preferred_term: GATA6
    term:
      id: hgnc:4174
      label: GATA6
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >
    A de novo pathogenic GATA6 variant was identified in one deletion-negative patient in the
    Japanese whole-genome sequencing series, consistent with the wider role of GATA-family
    transcription factors in conotruncal development.
  evidence:
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one patient, we identified a de novo pathogenic variant in GATA6"
    explanation: The single-patient de novo finding, curated at the strength the source supports.
- name: NOTCH1
  gene_term:
    preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  relationship_type: UNKNOWN
  variant_origin: DE_NOVO
  notes: >
    A de novo variant described by the authors as probably pathogenic was found in one
    deletion-negative patient. Curated with relationship_type UNKNOWN rather than causative
    because the source itself qualifies the classification, and a single probably-pathogenic
    de novo variant in a gene with a broad cardiac phenotype does not establish this
    malformation as its consequence.
  evidence:
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "in another patient, we identified a de novo probably pathogenic variant in NOTCH1"
    explanation: The authors' own hedged classification, which is the reason this gene is not curated as causative.
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: >-
      A structural congenital cardiovascular malformation. The syndromic 22q11.2-deleted
      subgroup additionally carries immune, endocrine, and neurodevelopmental features that
      fall outside this chapter, but the entity curated here is the cardiac lesion.
inheritance:
- name: Autosomal dominant, 22q11.2 deletion
  description: >
    The 22q11.2 deletion is usually de novo but is transmitted as an autosomal dominant trait
    once present, so an affected individual has a fifty percent transmission risk. This is the
    mode that applies to the largest identified genetic subgroup, and it is why deletion
    testing changes reproductive counselling for the patient as well as for the parents.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:32049433
    reference_title: "22q11.2 deletion syndrome and congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early identification of a 22q11.2 deletion in the neonate or infant when other syndromic features may not be apparent allows for timely parental screening for reproductive counseling and anticipatory evaluation of cardiac and noncardiac features."
    explanation: States the reproductive-counselling consequence that follows from the dominant transmission of the deletion.
- name: Autosomal recessive, biallelic TMEM260 or NKX2-6
  description: >
    Biallelic loss-of-function variants in TMEM260 and biallelic homeodomain-disrupting
    variants in NKX2-6 both cause this malformation recessively. The counselling implication is
    opposite to the deletion case: a one in four sibling recurrence risk with carrier parents,
    rather than a low recurrence risk with a fifty percent transmission risk. Both were found
    in consanguineous or founder settings, which is where recessive causes surface first.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the biallelic loss-of-function variants of which have recently been associated with structural heart defects and renal anomalies syndrome (SHDRA)"
    explanation: Establishes biallelic, and therefore recessive, inheritance for the TMEM260 route.
  - reference: PMID:32198970
    reference_title: "NKX2-6 related congenital heart disease: Biallelic homeodomain-disrupting variants and truncus arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two consanguineous families with TA were previously identified to have homozygous nonsense variants within the gene NKX2-6."
    explanation: Establishes homozygous, and therefore recessive, inheritance for the NKX2-6 route, in the consanguineous setting where it was found.
environmental:
- name: Maternal pregestational diabetes
  description: >
    The best-established non-genetic risk factor, and the only modifiable one. The National
    Birth Defects Prevention Study puts the adjusted odds ratio for this malformation at 14.9
    (95% CI 7.6 to 29.3), one of a handful of defects in that study exceeding a ten-fold
    increased risk. Unlike the genetic causes, this one is preventable in principle, which is
    why it carries prevention weight out of proportion to the fraction of cases it explains. No
    mechanism is asserted here: the source states the teratogenic mechanism is unknown.
  influences_mechanisms:
  - target: Cardiac neural crest and second heart field program disruption
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Maternal hyperglycaemia during the fifth to eighth week of gestation is proposed to
      perturb the neural crest and second heart field program during outflow tract septation.
    evidence:
    - reference: PMID:31454511
      reference_title: "Specific birth defects in pregnancies of women with diabetes: National Birth Defects Prevention Study, 1997-2011."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "the teratogenic mechanism behind the increase risk for birth defects is still unknown"
      explanation: PARTIAL, and deliberately so. This edge asserts that the exposure acts on the neural crest and second heart field program, and the source states plainly that the teratogenic mechanism is unknown. The association is strong and disease-specific; the step from association to this particular developmental mechanism is not evidenced, and the snippet records that rather than papering over it.
  evidence:
  - reference: PMID:31454511
    reference_title: "Specific birth defects in pregnancies of women with diabetes: National Birth Defects Prevention Study, 1997-2011."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "truncus arteriosus (adjusted odds ratio, 14.9; 95% confidence interval, 7.6-29.3)"
    explanation: The disease-specific adjusted effect estimate from the National Birth Defects Prevention Study, and the strongest available evidence for this exposure. A roughly fifteen-fold adjusted odds ratio with a confidence interval well clear of one places this malformation among the defects most strongly associated with pregestational diabetes.
  - reference: PMID:31454511
    reference_title: "Specific birth defects in pregnancies of women with diabetes: National Birth Defects Prevention Study, 1997-2011."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "For some defect categories, and particularly for pregestational diabetes, there were few exposed cases, leading to imprecise estimates."
    explanation: The authors' own precision caveat, which is why the confidence interval on the truncus arteriosus estimate is as wide as it is; PARTIAL because it qualifies the estimate rather than supporting the association.
  notes: >
    No ECTO term is bound. Maternal pregestational diabetes is a maternal disease state rather
    than an exposure to an agent, and the ECTO exposure hierarchy has no term that expresses it
    without asserting a specific chemical exposure the sources do not support.

    A retinoic-acid mechanism is often proposed for diabetic embryopathy, namely
    hyperglycaemia-induced disturbance of embryonic retinoic acid catabolism sensitising the
    conotruncal field. It was in an earlier draft of this description and has been removed. The
    deep-research report sources it only to PMC identifiers that were never fetched or verified,
    and the one study cited here states outright that the teratogenic mechanism is unknown.
    Recording it as a lead in notes is honest; asserting it in a description backed by a source
    that disclaims it is not.
experimental_models:
- name: Splotch mutant mouse
  description: >
    The founding genetic model, and the experiment that established the cardiac neural crest as
    the tissue of origin for this malformation. Homozygous Sp1H mutants fail to septate the
    truncus arteriosus and develop persistent truncus arteriosus with an ostium opening to the
    right ventricle, together with aortic arch variants and thymic, parathyroid, and
    ultimobranchial body defects. That pattern is the point: the same mutation affects every
    structure the neural crest populates, which is the argument that the cardiac lesion is a
    neurocristopathy rather than a local septation failure. The model dies mid-gestation, so it
    cannot address postnatal physiology at all.
  experimental_model_type: OTHER
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  modeled_mechanisms:
  - target: Cardiac neural crest and second heart field program disruption
    description: >
      Splotch disrupts neural-crest-derived cell populations, which is the trigger node here.
  - target: Failure of aorticopulmonary septation
    description: >
      The mutant reproduces the septation failure itself.
  publication: PMID:2619088
  evidence:
  - reference: PMID:2619088
    reference_title: "Persistent truncus arteriosus in the Splotch mutant mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It is shown that in homozygous mutant embryos, the septation of the truncus arteriosus does not proceed normally, resulting in persistent truncus arteriosus."
    explanation: Direct recapitulation of the human malformation from a neural crest defect.
  - reference: PMID:2619088
    reference_title: "Persistent truncus arteriosus in the Splotch mutant mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results provide indirect evidence, that cells contributing to the aortic arches and the septum of the truncus arteriosus in mice are derived from the neural crest."
    explanation: The inference that makes this model mechanistically informative rather than merely phenocopying, and the basis for the trigger node in this entry.
  - reference: PMID:2619088
    reference_title: "Persistent truncus arteriosus in the Splotch mutant mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The development of the thymus, the parathyroid and the ultimobranchial bodies are also variably affected in mutants."
    explanation: The extracardiac involvement that parallels the 22q11.2 phenotype in humans and supports a shared pharyngeal and neural-crest origin.
- name: Tbx1 conditional null mouse with beta-catenin dosage rescue
  description: >
    The canonical model for the 22q11.2 route, and the one that identifies the molecular error.
    Inactivating Tbx1 in anterior heart field mesoderm produces premature expression of
    pro-differentiation genes and a persistent truncus arteriosus, so the defect is one of
    developmental timing rather than of cell absence. Removing one allele of beta-catenin
    rescues the outflow tract defect in 61 percent of double mutants, which establishes an
    antagonistic relationship between the two pathways and shows the malformation is
    developmentally reversible in principle. That is the closest thing to a mechanistic target
    this disease has.
  experimental_model_type: OTHER
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  modeled_mechanisms:
  - target: Cardiac neural crest and second heart field program disruption
    description: >
      Tbx1 inactivation in anterior heart field mesoderm models the second heart field arm of
      the trigger node, complementing the neural crest arm modelled by Splotch.
  - target: Failure of aorticopulmonary septation
    description: >
      The mutant reproduces the failure of septation between aorta and pulmonary trunk.
  publication: PMID:28346476
  evidence:
  - reference: PMID:28346476
    reference_title: "Reduced dosage of β-catenin provides significant rescue of cardiac outflow tract anomalies in a Tbx1 conditional null mouse model of 22q11.2 deletion syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inactivation of Tbx1 in the anterior heart field (AHF) mesoderm in the mouse results in premature expression of pro-differentiation genes and a persistent truncus arteriosus (PTA) in which septation does not form between the aorta and pulmonary trunk."
    explanation: States both the phenotype and the molecular error behind it, premature differentiation rather than loss of the progenitor population.
  - reference: PMID:28346476
    reference_title: "Reduced dosage of β-catenin provides significant rescue of cardiac outflow tract anomalies in a Tbx1 conditional null mouse model of 22q11.2 deletion syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "When both alleles of Tbx1 and one allele of β-catenin were inactivated in the Mef2c-AHF-Cre domain, 61% of them (n = 34) showed partial or complete rescue of the PTA defect."
    explanation: The genetic rescue, which is the strongest evidence that this is a dosage-sensitive signalling imbalance rather than an irrecoverable structural loss.
prevalence:
- population: Critical congenital heart disease
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >
    Truncus arteriosus accounts for about 4 percent of all critical congenital heart disease,
    the subset requiring intervention in the newborn period. This is a share of a diagnostic
    category rather than a population rate, and is recorded as such.
  evidence:
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TA accounts for 4% of all critical congenital heart diseases."
    explanation: The share of critical congenital heart disease attributable to this lesion.
- population: 22q11.2 deletion syndrome, livebirths
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 20.0
  notes: >
    The deletion syndrome that causes 12 to 35 percent of truncus arteriosus has an estimated
    prevalence of 1 in 4000 to 6000 livebirths, with 60 to 80 percent of those having a
    cardiac malformation. Recorded here as denominator context for the leading genetic cause,
    not as the prevalence of this malformation.
  evidence:
  - reference: PMID:32049433
    reference_title: "22q11.2 deletion syndrome and congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 22q11.2 deletion syndrome has an estimated prevalence of 1 in 4-6,000 livebirths."
    explanation: Birth prevalence of the deletion syndrome.
  - reference: PMID:32049433
    reference_title: "22q11.2 deletion syndrome and congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 60-80% of patients have a cardiac malformation most commonly including a subset of conotruncal defects"
    explanation: The cardiac penetrance of the deletion, which converts its birth prevalence into a conotruncal-disease denominator.
differential_diagnoses:
- name: Tetralogy of Fallot with pulmonary atresia
  description: >
    The closest anatomic mimic, and separating them is consequential rather than academic.
    Both can present as a ventricular septal defect with a single visible outflow vessel. The
    distinction is whether pulmonary arteries arise from that vessel, as they do in truncus,
    or are supplied through a duct or aortopulmonary collaterals, as in pulmonary atresia.
    Physiology follows anatomy in opposite directions: truncus floods the lungs and needs
    pulmonary flow restricted, whereas pulmonary atresia starves them and needs the duct kept
    open with prostaglandin.
  evidence:
  - reference: PMID:32049433
    reference_title: "22q11.2 deletion syndrome and congenital heart disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "a subset of conotruncal defects (tetralogy of Fallot, truncus arteriosus, interrupted aortic arch type B)"
    explanation: Places the two lesions in the same conotruncal family sharing a genetic cause; PARTIAL because the source does not address their differentiation.
- name: Aortopulmonary window
  description: >
    Also produces a communication between aorta and pulmonary artery with pulmonary
    overcirculation, but the semilunar valves are two and separate, and the ventricular septum
    is usually intact. The count of semilunar valves is the discriminating observation on
    echocardiography.
  evidence:
  - reference: PMID:15649947
    reference_title: "Common arterial trunk associated with a homeodomain mutation of NKX2.6."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "A common arterial trunk (CAT) is often diagnosed as PTA in the absence of evidence of embryological mechanism."
    explanation: Notes explicitly that the diagnostic label is applied on appearance without embryologic confirmation, which is the reasoning gap this differential exploits; PARTIAL because aortopulmonary window is not named.
- name: Structural heart defects and renal anomalies syndrome
  description: >
    Not a competing cardiac diagnosis but a syndromic context that changes what else to look
    for. Biallelic TMEM260 loss of function produces this syndrome, so an infant with truncus
    arteriosus and no 22q11.2 deletion warrants renal imaging, and the recurrence counselling
    is recessive rather than de novo.
  evidence:
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the biallelic loss-of-function variants of which have recently been associated with structural heart defects and renal anomalies syndrome (SHDRA)"
    explanation: Links the genetic finding to the extracardiac syndrome that should then be evaluated.
clinical_burden:
  burden_level: HIGH
  rationale: >
    A critical congenital heart lesion that is uniformly fatal in infancy without surgery, and
    whose surgical treatment still carries about 10.8 percent in-hospital mortality in
    contemporary national data. Repair is not curative: the right ventricle to pulmonary
    artery conduit is outgrown and must be replaced serially through childhood, and truncal
    valve regurgitation drives further reoperation, so survivors carry a lifelong surgical and
    surveillance burden.
  notes: >
    A substantial minority carry a 22q11.2 deletion, which adds hypocalcaemia,
    immunodeficiency, palatal and feeding disorders, and neurodevelopmental and psychiatric
    morbidity to the cardiac disease. Those patients have more perioperative complications than
    non-syndromic patients but do not, in the reported data, have higher surgical mortality,
    so the syndromic burden is chiefly a matter of complication management and lifelong
    non-cardiac care rather than of operative survival.
  evidence:
  - reference: PMID:32557823
    reference_title: "Outcomes of truncus arteriosus repair and predictors of mortality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, 3009 neonates met inclusion criteria; a total of 326 patients died during the hospitalization (10.8%)."
    explanation: Contemporary in-hospital mortality in a national neonatal cohort.
  - reference: PMID:32049433
    reference_title: "22q11.2 deletion syndrome and congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac patients with a 22q11.2 deletion do not generally experience higher mortality upon surgical intervention but suffer more peri-operative complications than their non-syndromic counterparts."
    explanation: Separates the syndromic complication burden from operative mortality, which is the distinction the notes above rest on.
discussions:
- discussion_id: deletion_positive_survival_paradox
  prompt: >
    Why do infants with truncus arteriosus and a 22q11.2 deletion appear to have an inverse
    risk of in-hospital death despite carrying more comorbidity?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiac neural crest and second heart field program disruption
  - pathophysiology#Perioperative myocardial ischaemia
  rationale: >
    The national inpatient analysis found 22q11.2 deletion associated with an inverse risk of
    death despite more non-cardiac comorbidity, and a separate review reports that deletion
    patients have more perioperative complications without higher surgical mortality. Taken
    at face value the finding is paradoxical. Several explanations compete and imply different
    things. Deletion-positive infants are identified earlier and enter tertiary care sooner,
    so the association may be a surrogate for timely referral rather than a biological
    protection. Their anatomy may differ systematically, and there is a hint of this in an
    older series where deletion-positive patients were enriched for types with pulmonary
    stenosis, which would restrict pulmonary flow and postpone decompensation. Or the finding
    may be an artefact of administrative coding, since a deletion diagnosis has to be recorded
    to be counted and is more likely to be recorded in survivors who reach genetic testing.
    The last of these would make the result an artefact of exactly the data source that
    produced it.
  proposed_experiments:
  - experiment_id: exp_pta_deletion_status_outcome_registry
    name: Prospective registry comparison of outcomes by 22q11.2 status with anatomic and referral covariates
    description: >-
      In a multicentre congenital cardiac surgical registry with universal deletion testing at
      diagnosis, compare operative and one-year mortality by deletion status, adjusting for Van
      Praagh anatomic subtype, presence of pulmonary or truncal valve stenosis, coronary
      anomaly, age at referral, and preoperative clinical state.
    decision_criterion: >-
      A persisting survival advantage after adjustment for anatomy and referral timing would
      point to a genuine biological or care-pathway effect worth explaining; loss of the
      association on adjustment would establish it as confounding and would retire the
      paradox.
  evidence:
  - reference: PMID:32557823
    reference_title: "Outcomes of truncus arteriosus repair and predictors of mortality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "22q11.2 deletion syndrome was associated with an inverse risk of death despite having more noncardiac comorbidities"
    explanation: The observation that creates the controversy.
  - reference: PMID:9316541
    reference_title: "Truncus arteriosus communis associated with chromosome 22q11 deletion."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In truncus arteriosus communis, the rare type A3 with major aortopulmonary collateral arteries and pulmonary ostial stenosis and type A1 with pulmonary artery stenosis are associated with del 22q11."
    explanation: Supports the anatomic-difference explanation, since the deletion-associated subtypes carry pulmonary flow restriction; PARTIAL because the series of 15 patients is small and outcomes are not reported.
- discussion_id: nkx2_6_mouse_human_discrepancy
  prompt: >
    Why does a targeted Nkx2.6 mutation leave mice normal when a homozygous NKX2.6 homeodomain
    variant causes common arterial trunk in humans?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiac neural crest and second heart field program disruption
  - pathophysiology#Failure of aorticopulmonary septation
  rationale: >
    The human evidence is strong: autozygosity mapping in a large consanguineous family
    localised the lesion to 8p21, the variant sits in the homeodomain, and the corresponding
    substitution in the NKX2.5 surrogate substantially reduced transcriptional activation, DNA
    binding, and synergy at target promoters. Yet Nkx2.6 null mice are normal, and the reason
    appears to be that Nkx2.5 expression expands into the territory Nkx2.6 vacates. If that
    complementation is mouse-specific, then the mouse null is simply the wrong assay for this
    gene and its normality carries no evidential weight against the human finding. If instead
    complementation also operates in humans, then a simple loss-of-function model cannot be
    right and the F151L variant is doing something a null does not, most plausibly acting as a
    dominant negative on shared NKX partners. The two readings imply different variant
    interpretation rules for this gene in a clinical laboratory, which is why this is not
    merely a modelling curiosity. The human side of the discrepancy has since strengthened:
    further individuals with biallelic homeodomain-disrupting NKX2-6 variants have been
    reported, so the association no longer rests on the single original kindred while the
    mouse null remains normal.
  proposed_experiments:
  - experiment_id: exp_nkx26_knockin_versus_null
    name: Comparison of an Nkx2.6 F151L knock-in against an Nkx2.6 null on matched backgrounds
    description: >-
      Generate a knock-in mouse carrying the orthologous homeodomain substitution alongside a
      true null on the same background, assess outflow tract septation in both, and map Nkx2.5
      expression domains in each to determine whether the compensatory expansion occurs in the
      knock-in as it does in the null.
    decision_criterion: >-
      A septation defect in the knock-in but not the null would establish a dominant-negative
      rather than loss-of-function mechanism and would mean null alleles should not be equated
      with this missense variant; normality of both, with equivalent Nkx2.5 expansion, would
      confirm that mouse complementation makes the model uninformative for this human gene.
  evidence:
  - reference: PMID:15649947
    reference_title: "Common arterial trunk associated with a homeodomain mutation of NKX2.6."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice homozygous for a targeted mutation of Nkx2.6 are normal. However, in these mice, it has been shown that Nkx2.5 expression expands into regions lacking Nkx2.6, suggesting functional complementation."
    explanation: States the mismatch and the compensation hypothesis proposed to explain it, in the same paper that reports the human variant.
  - reference: PMID:32198970
    reference_title: "NKX2-6 related congenital heart disease: Biallelic homeodomain-disrupting variants and truncus arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two consanguineous families with TA were previously identified to have homozygous nonsense variants within the gene NKX2-6."
    explanation: Independent replication of the human association, which is what makes the normal mouse null a genuine discrepancy rather than a reason to doubt the original report.
  - reference: PMID:32198970
    reference_title: "NKX2-6 related congenital heart disease: Biallelic homeodomain-disrupting variants and truncus arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NKX2-6 is a known downstream target of TBX1, an important transcriptional regulator implicated in the cardiac phenotype of 22q11.2 microdeletion syndrome."
    explanation: Places NKX2-6 downstream of TBX1, which unifies the recessive NKX2-6 route and the dominant 22q11.2 route into one pathway and is why both are curated against the same trigger node.
- discussion_id: population_specific_genetic_architecture
  prompt: >
    Is the genetic architecture of deletion-negative truncus arteriosus population-specific, and
    what does that mean for genetic testing offered outside the populations it was described in?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiac neural crest and second heart field program disruption
  rationale: >
    TMEM260 emerged as a major cause of deletion-negative truncus arteriosus in Japan, but the
    signal rests on a founder variant carried at 0.36 percent allele frequency in that
    population and estimated to be about 23 000 years old. A founder allele's contribution is
    by construction a property of the population, not of the gene, so the projection that about
    a quarter of Japanese cases are homozygous for it says nothing about how often TMEM260
    explains cases elsewhere. Two practical consequences follow and neither is settled. A
    targeted panel built on the Japanese finding may have low yield in other populations, while
    a broad sequencing approach would find whatever the local architecture is. And the absence
    of comparable studies elsewhere means the field currently cannot distinguish "TMEM260 is a
    Japanese founder effect" from "TMEM260 is a general cause that was first found in Japan."
  proposed_experiments:
  - experiment_id: exp_pta_multiancestry_sequencing
    name: Multi-ancestry whole-genome sequencing of deletion-negative truncus arteriosus
    description: >-
      Sequence deletion-negative truncus arteriosus cohorts recruited across several ancestries,
      report diagnostic yield by gene and by ancestry, and test specifically whether biallelic
      TMEM260 loss of function contributes outside East Asian populations and at what frequency.
    decision_criterion: >-
      A comparable TMEM260 contribution across ancestries would establish it as a general cause
      and justify including it on universal panels; a contribution confined to populations
      carrying the founder allele would establish the architecture as population-specific and
      would argue for genome-wide sequencing rather than transplanted panels.
  evidence:
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study highlights TMEM260, especially c.1617del, as a major genetic cause of TA in the Japanese population."
    explanation: The authors localise their own claim to the Japanese population, which is the premise of this question.
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, no major causes of TA other than 22q11.2 deletion have been reported."
    explanation: States the prior state of knowledge that a single-population study has now changed, and by implication how thin the comparative evidence is.
- discussion_id: majority_of_cases_genetically_unexplained
  prompt: >
    What accounts for the majority of truncus arteriosus cases that carry neither a 22q11.2
    deletion nor an identified monogenic cause?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiac neural crest and second heart field program disruption
  - pathophysiology#Failure of aorticopulmonary septation
  rationale: >
    The deletion explains 12 to 35 percent of cases. Sequencing in deletion-negative patients
    has now identified TMEM260, GATA6, and NOTCH1 variants, but in a single small
    population-specific cohort. Across the whole disease, most cases still have no molecular
    diagnosis. Three candidate explanations are open. There may be further monogenic causes
    that adequately powered multi-ancestry sequencing will find, which the recent TMEM260
    result makes plausible. Causation may be substantially oligogenic or multifactorial, with
    the developmental program failing on a combination of variants none of which is
    individually diagnostic. Or non-genetic causes may account for a real share, with maternal
    pregestational diabetes and retinoic-acid-pathway exposures the leading candidates and
    plausibly interacting with genotype. These are not exclusive, and distinguishing their
    relative contributions determines whether the right investment is deeper sequencing or
    exposure epidemiology.
  proposed_experiments:
  - experiment_id: exp_pta_trio_sequencing_with_exposure_data
    name: Trio sequencing of unexplained truncus arteriosus with linked maternal exposure data
    description: >-
      Sequence parent-child trios for cases negative for 22q11.2 deletion and known monogenic
      causes, quantify the de novo variant burden in outflow-tract developmental genes against
      matched controls, and link each case to prospectively recorded maternal pregestational
      diabetes status and periconceptional retinoid exposure.
    decision_criterion: >-
      Significant de novo burden in outflow-tract developmental pathways would support further
      monogenic causes and justify deeper sequencing; a null burden with strong exposure
      association would redirect effort to exposure epidemiology and prevention.
  evidence:
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common cause of TA is 22q11.2 deletion syndrome, accounting for 12-35% of all TA cases. However, no major causes of TA other than 22q11.2 deletion have been reported."
    explanation: Quantifies the explained fraction and states that the remainder was unaccounted for before this study.
  - reference: PMID:38884753
    reference_title: "Human Genetics of Truncus Arteriosus."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Other congenital malformation syndromes and variants in genes encoding TBX, GATA, and NKX transcription factors and some signaling proteins have also been reported as its etiology."
    explanation: Documents the scattered additional genetic causes reported to date; PARTIAL because it does not quantify what share of cases they explain.
notes: >
  Terminology. Curated as persistent truncus arteriosus, MONDO:0018072, which is the same
  entity as common arterial trunk. One source notes that a common arterial trunk is often
  labelled persistent truncus arteriosus without embryologic confirmation, so the two names
  are treated as synonyms of a single curated entity here rather than as separable entities.

  Anatomic subtypes. The Collett and Edwards and Van Praagh classifications are referenced in
  descriptions but are not curated as has_subtypes entries, because the mechanism curated here
  is shared across all of them and the subtypes differ in the origin pattern of the pulmonary
  arteries rather than in pathogenesis. Van Praagh type A4, with interrupted aortic arch, is
  captured through the interrupted aortic arch phenotype instead.

  Module conformance. One node conforms to pulmonary_vascular_remodeling. The fit is at the
  obstructive-remodelling node only: the upstream trigger here is unrestricted high-pressure
  high-flow exposure of a normal pulmonary bed rather than the endothelial and BMPR2 lesion
  the module's earlier nodes model, so conformance is deliberately declared at the single node
  where the mechanisms genuinely converge.

  Truncal valve ontology. Truncal valve regurgitation is curated against HP:0001659 Aortic
  regurgitation, because HPO has no truncal valve term and the truncal valve is the common
  semilunar valve from which the aortic valve would otherwise have formed. The preferred_term
  states the specific claim. This is a deliberate looser binding, not an oversight.

  Phenotypes not curated. Truncal valve stenosis and coarctation of the aorta are real
  features of this lesion, but no cached reference states either in a quotable sentence, and
  unlike right aortic arch there is not even a case-series observation to cite. They are named
  here so the gap is recorded rather than invisible. The frequencies quoted in the
  deep-research narrative (roughly 25 percent and 10 percent) are not used, since their sources
  were not fetched.

  Deliberately unevidenced descriptions. Several nodes, phenotypes, treatments, and
  progression phases carry a description with no evidence block: the single-trunk physiology
  consequences (cyanosis, overcirculation, pulmonary vascular obstructive disease), the
  clinical presentation (tachypnoea, failure to thrive, congestive heart failure), conduit
  reintervention, and preoperative anticongestive therapy. These are well-established, but the
  cached references for this entry do not contain a sentence that states them. Following the
  evidence SOP, the description is kept and the evidence block omitted rather than attaching a
  methods or objective sentence that would verify as an exact quote while supporting a
  different claim. This lowers the compliance score, which is the correct trade.

  Deep-research provenance. Curated from a claude_code deep-research report
  (research/Persistent_Truncus_Arteriosus-deep-research-claude_code.md) treated as leads only.
  The NEC preflight returned SKIP because MONDO records no causal gene for MONDO:0018072;
  manual checks confirmed the entity, with the report's gene profile (TMEM260, NKX2-6, TBX1,
  NKX2-5) and its OMIM 217095 consistent with the intended disease. Five identifiers suggested
  by the provider were verified against OAK and found to point at unrelated concepts
  (HP:0001719 is Double outlet right ventricle, not Truncus arteriosus, which is HP:0001660;
  CL:0002350 is endocardial cell, not cardiac neural crest cell; UBERON:0004151 is cardiac
  chamber, not outflow tract; hgnc:2673 is DAP3, not NKX2-6; hgnc:26160 is THNSL1, not
  TMEM260). All were corrected before curation. The report itself correctly warned against
  curating OMIM 226000, endocardial fibroelastosis, against this entity.

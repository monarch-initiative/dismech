name: Persistent Truncus Arteriosus
creation_date: '2026-08-09T00:00:00Z'
category: Congenital
description: >
  Persistent truncus arteriosus, or common arterial trunk, is a cyanotic conotruncal
  malformation in which the embryonic outflow tract fails to septate, so a single arterial
  trunk arises from the heart through one semilunar valve, overrides a ventricular septal
  defect, and supplies the coronary, pulmonary, and systemic circulations from a common
  source. It is a defect of the cardiac neural crest and second heart field developmental
  unit, and 22q11.2 deletion syndrome is its single largest identified cause. The postnatal
  physiology is dictated by what the anatomy does not do: because there is no pulmonary
  outflow obstruction, pulmonary blood flow is set entirely by the ratio of pulmonary to
  systemic vascular resistance, so as pulmonary resistance falls in the first days of life
  the lungs are flooded at systemic pressure. The newborn is therefore mildly cyanosed but
  in high-output heart failure, and the untreated course runs to irreversible pulmonary
  vascular obstructive disease within the first year or two, at which point repair becomes
  impossible. Neonatal surgical repair, closing the ventricular septal defect and
  interposing a right ventricle to pulmonary artery conduit, is the standard of care, and
  the conduit must then be replaced repeatedly as the child grows.
disease_term:
  preferred_term: persistent truncus arteriosus
  term:
    id: MONDO:0018072
    label: persistent truncus arteriosus
parents:
- Congenital heart defect
- Conotruncal malformation
synonyms:
- Truncus arteriosus communis
- Common arterial trunk
- Truncus arteriosus
pathophysiology:
- name: Cardiac neural crest and second heart field program disruption
  description: >
    The outflow tract is built by two cell populations acting together: cardiac neural crest
    cells migrating through pharyngeal arches three, four, and six to form the elastogenic
    smooth muscle of the aorticopulmonary septum, and second heart field mesoderm adding
    myocardium to the elongating outflow tract. Their crosstalk is patterned by TBX, GATA,
    and NKX transcription factors and by FGF, BMP, and Wnt signalling. Disruption anywhere
    in this unit, whether by 22q11.2 deletion, a monogenic variant, or a teratogen, converges
    on the same failure.
  biological_scale: CELLULAR
  role: trigger
  cell_types:
  - preferred_term: Cardiac neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: cardiac neural crest cell development involved in outflow tract morphogenesis
    term:
      id: GO:0061309
      label: cardiac neural crest cell development involved in outflow tract morphogenesis
    modifier: DECREASED
  - preferred_term: neural crest cell migration
    term:
      id: GO:0001755
      label: neural crest cell migration
    modifier: DECREASED
  locations:
  - preferred_term: Outflow tract
    term:
      id: UBERON:0004145
      label: outflow tract
  downstream:
  - target: Failure of aorticopulmonary septation
    causal_link_type: DIRECT
    description: >
      Without a properly specified and positioned neural-crest-derived septal population, the
      conotruncal ridges do not fuse and no aorticopulmonary septum forms.
    evidence:
    - reference: PMID:38884754
      reference_title: "Molecular Pathways and Animal Models of Truncus Arteriosus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we will review molecular pathways and the cells that are known to play a role in the formation and development of the outflow tract and how genetic manipulation of these pathways in animal models can result in common arterial trunk"
      explanation: States that genetic manipulation of the outflow-tract developmental pathways in animal models reproduces the human malformation, which is the evidence that this cellular program is the causal locus.
  evidence:
  - reference: PMID:38884753
    reference_title: "Human Genetics of Truncus Arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other congenital malformation syndromes and variants in genes encoding TBX, GATA, and NKX transcription factors and some signaling proteins have also been reported as its etiology."
    explanation: Identifies the transcription-factor families whose disruption produces the malformation, which is what makes this a developmental-program defect rather than a single-gene disease.
- name: Failure of aorticopulmonary septation
  description: >
    The defining embryologic event, occurring in weeks five to eight of human gestation. The
    conotruncal ridges fail to fuse and spiral, so no aorticopulmonary septum divides the
    common trunk into aorta and pulmonary trunk. The same septal deficiency accounts for the
    ventricular septal defect, because the conal septum that would have closed the outflow
    portion of the interventricular septum is absent or malformed. That is why the ventricular
    septal defect here is not an independent second lesion but part of the same failure.
  biological_scale: TISSUE
  role: mechanism
  biological_processes:
  - preferred_term: outflow tract septum morphogenesis
    term:
      id: GO:0003148
      label: outflow tract septum morphogenesis
    modifier: LOSS_OF_FUNCTION
  locations:
  - preferred_term: Truncus arteriosus
    term:
      id: UBERON:0002061
      label: truncus arteriosus
  - preferred_term: Outflow tract septum
    term:
      id: UBERON:0004142
      label: outflow tract septum
  downstream:
  - target: Single arterial trunk overriding a ventricular septal defect
    causal_link_type: DIRECT
    description: >
      The unseptated trunk persists as a single vessel with one semilunar valve, sitting over
      the unclosed outflow portion of the interventricular septum.
    evidence:
    - reference: PMID:15649947
      reference_title: "Common arterial trunk associated with a homeodomain mutation of NKX2.6."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Persistent truncus arteriosus (PTA) is a failure of septation of the cardiac outflow tract (OFT) into the pulmonary artery and the aorta."
      explanation: Defines the malformation as the direct structural consequence of the septation failure.
  evidence:
  - reference: PMID:38884754
    reference_title: "Molecular Pathways and Animal Models of Truncus Arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When the process of outflow tract septation fails, a single common outflow vessel persists resulting in a serious clinical condition known as persistent truncus arteriosus or common arterial trunk."
    explanation: States the septation-failure-to-single-vessel step as the definition of the disease.
- name: Single arterial trunk overriding a ventricular septal defect
  description: >
    The anatomic result. One vessel leaves the heart through a single semilunar valve and
    gives rise to the coronary arteries, the pulmonary arteries, and the systemic
    circulation. Because both ventricles eject into it across a large non-restrictive
    ventricular septal defect, systemic and pulmonary venous return mix obligatorily at the
    trunk, and both ventricles see systemic pressure.
  biological_scale: ORGANISM
  role: mechanism
  locations:
  - preferred_term: Interventricular septum
    term:
      id: UBERON:0002094
      label: interventricular septum
  downstream:
  - target: Obligatory mixing of systemic and pulmonary venous return
    causal_link_type: DIRECT
    description: >
      A single outlet for both ventricles forces complete admixture of oxygenated and
      deoxygenated blood.
    evidence:
    - reference: PMID:38351237
      reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Truncus Arteriosus (TA) is a congenital heart disease characterized by a single common blood vessel emerging from the right and left ventricles instead of the main pulmonary artery and aorta."
      explanation: States that the single vessel receives ejection from both ventricles, which is what makes the mixing obligatory rather than shunt-dependent.
  - target: Unobstructed pulmonary blood flow at systemic pressure
    causal_link_type: DIRECT
    description: >
      Pulmonary arteries arising directly from the trunk are exposed to systemic pressure
      with no interposed obstruction.
    evidence:
    - reference: PMID:15649947
      reference_title: "Common arterial trunk associated with a homeodomain mutation of NKX2.6."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "a failure of septation of the cardiac outflow tract (OFT) into the pulmonary artery and the aorta"
      explanation: Establishes that the pulmonary arteries and aorta share a single unseptated source; PARTIAL because the haemodynamic consequence is not stated in the source.
  - target: Truncal valve dysfunction
    causal_link_type: DIRECT
    description: >
      The single semilunar valve is frequently dysplastic, with an abnormal cusp number, and
      is prone to regurgitation and, less often, stenosis.
  - target: Coronary ostial anomaly
    causal_link_type: DIRECT
    description: >
      Coronary arteries arise from an abnormal single-trunk root rather than from a normally
      septated aortic sinus template, so their origins are frequently anomalous.
    evidence:
    - reference: PMID:38351237
      reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "a single common blood vessel emerging from the right and left ventricles instead of the main pulmonary artery and aorta"
      explanation: Establishes the abnormal root geometry from which the coronaries must arise; PARTIAL because the coronary consequence is not asserted in the source.
  evidence:
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncus Arteriosus (TA) is a congenital heart disease characterized by a single common blood vessel emerging from the right and left ventricles instead of the main pulmonary artery and aorta."
    explanation: The definitional statement of this node, naming the single vessel and the fact that it receives ejection from both ventricles.
- name: Obligatory mixing of systemic and pulmonary venous return
  description: >
    Because there is one outlet, mixing is complete and is not modulated by shunt size or
    direction. Arterial saturation is therefore set by the proportion of pulmonary to systemic
    flow rather than by any restrictive orifice, which has a counterintuitive consequence:
    the more the lungs are flooded, the pinker the baby looks, so improving colour in an
    untreated infant is a sign of worsening physiology rather than improvement.
  biological_scale: ORGANISM
  role: mechanism
  downstream:
  - target: Cyanosis
    causal_link_type: DIRECT
    description: >
      Admixture of desaturated systemic venous return lowers arterial oxygen saturation.
  evidence:
  - reference: PMID:38351237
    reference_title: "Genetic etiology of truncus arteriosus excluding 22q11.2 deletion syndrome and identification of c.1617del, a prevalent variant in TMEM260, in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a single common blood vessel emerging from the right and left ventricles"
    explanation: The single common outlet from both ventricles is the anatomic basis of obligatory mixing.
- name: Unobstructed pulmonary blood flow at systemic pressure
  description: >
    In most anatomic subtypes nothing restricts flow into the pulmonary arteries. The
    pulmonary bed therefore sees systemic pressure directly, and pulmonary blood flow is
    governed purely by the ratio of pulmonary to systemic vascular resistance. In the first
    hours of life high neonatal pulmonary resistance masks the problem; over the following
    days that resistance falls physiologically, flow rises steeply, and the infant
    decompensates. The clinical corollary is that a well-looking newborn with this lesion is
    not reassuring, merely early.
  biological_scale: ORGANISM
  role: mechanism
  locations:
  - preferred_term: Pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  downstream:
  - target: Pulmonary overcirculation and volume-overload heart failure
    causal_link_type: DIRECT
    description: >
      As pulmonary vascular resistance falls after birth, pulmonary blood flow rises and
      volume-loads the ventricles.
  - target: Pulmonary vascular obstructive disease
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Sustained high-flow, high-pressure exposure of the pulmonary bed drives progressive
      remodelling toward fixed resistance.
  evidence:
  - reference: PMID:38884754
    reference_title: "Molecular Pathways and Animal Models of Truncus Arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the outflow tract of the heart is divided into two distinct channels to separate the oxygenated systemic blood flow from the deoxygenated pulmonary circulation"
    explanation: States the function of normal septation, whose absence leaves the pulmonary circulation exposed to systemic pressure.
- name: Truncal valve dysfunction
  description: >
    The single semilunar valve is frequently abnormal, with two, three, four, or rarely five
    cusps, and is often dysplastic. Regurgitation adds volume load on top of the pulmonary
    overcirculation. Stenosis is less common but worse tolerated, because both ventricles
    eject through this one valve, so a single stenotic orifice imposes pressure load on the
    whole heart at once. Truncal valve disease is a principal determinant of both operative
    difficulty and long-term reoperation.
  biological_scale: TISSUE
  role: mechanism
  downstream:
  - target: Pulmonary overcirculation and volume-overload heart failure
    causal_link_type: DIRECT
    description: >
      Truncal regurgitation adds regurgitant volume to the already high pulmonary flow,
      compounding ventricular volume overload.
  evidence:
  - reference: PMID:837493
    reference_title: "Coronary arterial origin in persistent truncus arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bicuspid truncal valve was observed in six cases (20%) and tricuspid in 21 cases (70%)."
    explanation: Autopsy series of 30 hearts quantifying truncal valve cusp number, which is the morphological abnormality this node asserts.
- name: Coronary ostial anomaly
  description: >
    Coronary origins are abnormal in a large fraction of cases, because the coronary buds
    address a single unseptated root rather than the normal paired aortic sinuses. There is
    no single consistent pattern, which is precisely the problem: the surgeon must map the
    coronaries individually before repair, and an unrecognised anomalous course is an
    independent driver of perioperative mortality.
  biological_scale: TISSUE
  role: mechanism
  downstream:
  - target: Perioperative myocardial ischaemia
    causal_link_type: DIRECT
    description: >
      An anomalous coronary origin or course can be compressed, distorted, or divided during
      conduit placement and root reconstruction.
    evidence:
    - reference: PMID:32557823
      reference_title: "Outcomes of truncus arteriosus repair and predictors of mortality."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "a total of 326 patients died during the hospitalization (10.8%)"
      explanation: Quantifies the in-hospital mortality that coronary anomalies contribute to; PARTIAL because the database analysis does not attribute deaths to coronary anatomy.
  evidence:
  - reference: PMID:837493
    reference_title: "Coronary arterial origin in persistent truncus arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a strong tendency for the left coronary artery to arise from a more posterior level than it does normally from the aorta."
    explanation: Documents the systematic displacement of the coronary origin from its normal aortic position, which is the consequence of the trunk not having septated into a normal aortic root.
  - reference: PMID:837493
    reference_title: "Coronary arterial origin in persistent truncus arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Single coronary artery was observed in four cases (three with tricuspid and one with quadricuspid truncal valves)."
    explanation: Quantifies the most surgically consequential variant, a single coronary artery, in four of 30 hearts.
- name: Pulmonary overcirculation and volume-overload heart failure
  description: >
    The clinical presentation in the first weeks: tachypnoea, poor feeding, sweating,
    failure to thrive, and hepatomegaly, in an infant who is only mildly desaturated. It is
    high-output failure from excessive pulmonary blood flow, not pump failure, which is why
    the treatment before surgery is to limit pulmonary flow rather than to augment
    contractility.
  biological_scale: ORGANISM
  role: consequence
  downstream:
  - target: Pulmonary vascular obstructive disease
    causal_link_type: DIRECT
    description: >
      Continuing high-flow high-pressure exposure remodels the pulmonary arterioles.
- name: Pulmonary vascular obstructive disease
  description: >
    The end of the untreated natural history, and the reason this is a neonatal surgical
    disease rather than an elective one. Sustained exposure of the pulmonary bed to systemic
    pressure and high flow produces fixed obstructive remodelling within the first year or
    two of life. Once resistance is fixed, closing the ventricular septal defect is
    contraindicated for the same reason it is in Eisenmenger physiology, and the operation
    that would have been curative at two weeks becomes lethal.
  biological_scale: ORGANISM
  role: consequence
  conforms_to: "pulmonary_vascular_remodeling#Obstructive Pulmonary Vascular Remodeling"
  locations:
  - preferred_term: Pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
- name: Perioperative myocardial ischaemia
  description: >
    Ischaemic injury around the time of repair, from anomalous coronary anatomy, from
    coronary distortion during root reconstruction, or from the mismatch between a
    volume-loaded ventricle and a diastolic pressure lowered by truncal regurgitation. It is
    one of the mechanisms behind an in-hospital mortality that remains around one in ten even
    in the contemporary era.
  biological_scale: ORGANISM
  role: consequence
  evidence:
  - reference: PMID:32557823
    reference_title: "Outcomes of truncus arteriosus repair and predictors of mortality."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, 3009 neonates met inclusion criteria; a total of 326 patients died during the hospitalization (10.8%)."
    explanation: Quantifies contemporary in-hospital mortality in a national cohort; PARTIAL because ischaemia is not separately attributed.
- name: Cyanosis
  description: >
    Present from birth but characteristically mild, because pulmonary blood flow is high.
    This is why the lesion is easy to miss on inspection and why newborn pulse-oximetry
    screening matters more here than a visual assessment does.
  biological_scale: ORGANISM
  role: consequence

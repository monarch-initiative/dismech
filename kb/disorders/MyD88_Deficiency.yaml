    Patient whole blood and fibroblasts do not induce the proinflammatory
    cytokines normally produced on TLR and IL-1R stimulation. Whole blood showed
    no cytokine response to six of eight TLR agonists tested, and IL-6, IL-8,
    interferon-beta and interferon-lambda production was abolished in fibroblasts
    after IL-1beta stimulation.

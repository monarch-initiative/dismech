name: MyD88 Deficiency
creation_date: "2026-09-24T19:23:48Z"
category: Mendelian
disease_term:
  preferred_term: MyD88 deficiency
  term:
    id: MONDO:0012839
    label: pyogenic bacterial infections due to MyD88 deficiency
synonyms:
- MyD88 deficiency
- MYD88D
- immunodeficiency 68
- recurrent pyogenic bacterial infections due to MyD88 deficiency
description: >-
  MyD88 deficiency (immunodeficiency 68) is an autosomal recessive inborn error
  of innate immunity caused by biallelic loss-of-function variants in MYD88,
  which encodes the cytosolic adaptor linking the Toll-like receptors (all TLRs
  except TLR3) and the interleukin-1 receptor (IL-1R) family to the IRAK kinase
  complex. Without functional MyD88, patient cells cannot activate NF-kappaB and
  MAPK in response to TLR and IL-1R agonists, and the proinflammatory cytokine
  response that normally follows detection of a pyogenic organism is not
  mounted. TLR3 signaling, which uses the adaptor TRIF instead, is spared.

  Clinically the susceptibility is narrow and age-dependent. Affected children
  suffer life-threatening, often recurrent invasive infection with a small set
  of pyogenic bacteria (Streptococcus pneumoniae above all, then Staphylococcus
  aureus and Pseudomonas aeruginosa), most often meningitis, while resistance to
  most other bacteria, viruses, fungi and parasites is essentially normal. Fever
  and the acute-phase response are characteristically weak or delayed, so
  invasive infection can progress with few warning signs. Half of the patients
  in the largest series died in early childhood, but invasive infection becomes
  rare after the first decade. The one recognized qualification of the
  preserved-antiviral-immunity picture is TLR7: because TLR7-dependent type I
  interferon production by plasmacytoid dendritic cells requires MyD88,
  patients are at high risk of hypoxemic COVID-19 pneumonia.

  MyD88 deficiency is clinically and immunologically indistinguishable from
  IRAK-4 deficiency (immunodeficiency 67, curated as Immunodeficiency_67), which
  lies one step downstream in the same pathway. The two are phenocopies but
  distinct gene-disease entities, and are curated as sibling entries rather than
  as subtypes of one another.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic (homozygous or compound heterozygous)
    loss-of-function MYD88 variants; heterozygous carriers are healthy.
  evidence:
  - reference: PMID:18669862
    reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The segregation of the MYD88 genotype and of the clinical phenotype is consistent
      with an autosomal recessive trait"
    explanation: Family segregation in the founding series establishes autosomal recessive
      inheritance.
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with MyD88 deficiency from 5 kindreds were homozygous, and 1 patient
      (b-P2) was compound heterozygous."
    explanation: Confirms the biallelic genotype across the six MyD88-deficient kindreds
      of the international series.
genetic:
- name: MYD88
  gene_term:
    preferred_term: MYD88
    term:
      id: hgnc:7562
      label: MYD88
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    MYD88 encodes the adaptor that bridges TLRs and IL-1Rs to the IRAK complex
    through its N-terminal death domain (which binds IRAK-4) and its C-terminal
    TIR domain (which binds the receptor). Reported disease alleles are germline
    biallelic loss-of-function variants in either domain, so the gene-disease
    relationship is recorded as causative with an autosomal recessive,
    loss-of-function mechanism.
  variants:
  - name: E52del
    description: >-
      Homozygous in-frame deletion (160del3, designated E52del in the founding
      report) in the death domain; only trace or small amounts of protein are
      produced and it cannot interact with IRAK-4. Nomenclature follows the
      source: this is very probably the same three-base deletion recorded below as
      c.157_159del p.(Glu53del) in current HGVS numbering, but neither source
      states the equivalence, so the two are listed as the sources name them
      rather than merged.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:18669862
      reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the R196C mutation in the TIR domain prevents interaction with IL-1R, whereas
        the E52del and L93P mutations in the death domain (DD) prevent interaction with
        IRAK-4"
      explanation: Shows that the death-domain alleles abolish binding to IRAK-4, the
        molecular consequence of this variant.
  - name: L93P
    description: >-
      Death-domain missense allele found in compound heterozygosity with R196C,
      associated with very small amounts of nonfunctional protein and loss of
      IRAK-4 binding.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:21057262
      reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two MyD88 mutant alleles were found to be associated with the production
        of very small amounts of a nonfunctional protein (E52del and L93P), whereas the
        R196C mutant allele was associated with the quantitatively normal production of
        a nonfunctional protein."
      explanation: States the protein-level consequence of each of the three founding
        alleles, including L93P.
  - name: R196C
    description: >-
      TIR-domain missense allele, homozygous or compound heterozygous, that
      yields normal amounts of a protein unable to interact with IL-1R; residues
      195 to 197 are crucial for TIR/TIR interaction.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:18669862
      reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "I3A cells responded to IL-1β after transfection with the WT MYD88 allele,
        but not after transfection with any of the three mutant MYD88 alleles, as shown
        by IL-8 production levels"
      explanation: Complementation in a MyD88-deficient cell line shows that all three
        founding alleles, R196C included, are loss-of-function.
  - name: S34Y
    description: >-
      Death-domain missense variant, one of two rare non-synonymous MYD88 variants
      shown in vitro to cripple NF-kappaB activation by reducing MyD88
      homo-oligomerization and IRAK-4 interaction. Curated as a functionally
      characterized rare variant rather than as one of the biallelic alleles of a
      described patient.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:20966070
      reference_title: "Two human MYD88 variants, S34Y and R98C, interfere with MyD88-IRAK4-myddosome assembly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Two variants found in the MyD88 death domain, S34Y and R98C, showed severely
        reduced NF-κB activation due to reduced homo-oligomerization and IRAK4 interaction."
      explanation: Measures the signaling consequence of the variant in a cellular assay.
  - name: R98C
    description: >-
      The second death-domain missense variant characterized in the same study;
      like S34Y it reduces Myddosome assembly, and the two interfere with some but
      not all MyD88-dependent receptor pathways.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:20966070
      reference_title: "Two human MYD88 variants, S34Y and R98C, interfere with MyD88-IRAK4-myddosome assembly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The differential interference of S34Y and R98C with some (IL-1 receptor,
        TLR2, TLR4, TLR5, and TLR7) but not all (TLR9) MyD88-dependent signaling pathways
        also suggests that receptor specificities exist at the level of the Myddosome."
      explanation: Records the receptor-selective effect of the variant, which is what
        distinguishes it from a complete null allele.
  - name: c.157_159del p.(Glu53del)
    description: >-
      Homozygous in-frame deletion of a single conserved glutamic acid residue in
      the death domain, reported recurrently in patients of Roma descent and
      attributed to a founder effect; it results in greatly diminished protein
      levels. Almost certainly the same allele the founding report called E52del,
      under current HGVS numbering.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:39859960
      reference_title: "Three Unrelated Patients of Roma Ethnicity from a Single Center Carrying the Same Deletion in MYD88 Gene: A Founder Effect?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a homozygous pathogenic in-frame deletion c.157_159del p.(Glu53del) in
        MYD88 gene, already described in this ethnic group, suggesting a founder effect"
      explanation: Documents the recurrent Roma founder allele in three unrelated patients.
  evidence:
  - reference: PMID:18669862
    reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results demonstrate that all nine patients had complete MyD88 deficiency,
      resulting from the inheritance of two loss-of-function MYD88 alleles."
    explanation: Establishes biallelic MYD88 loss of function as the cause of the disease
      in the founding cohort.
pathophysiology:
- name: MYD88 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic loss-of-function MYD88 variants eliminate functional MyD88.
    Death-domain alleles prevent the adaptor from recruiting IRAK-4 and
    TIR-domain alleles prevent it from engaging IL-1R, so in either case the
    adaptor step shared by the MyD88-dependent TLRs and the IL-1R family is
    lost. Protein may be absent, reduced, or present in normal amounts but
    nonfunctional.
  genetic_context:
    genes:
    - preferred_term: MYD88
      term:
        id: hgnc:7562
        label: MYD88
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline biallelic loss-of-function MYD88 variants (in-frame deletion and
      missense alleles in the death and TIR domains) abolishing adaptor
      function.
  evidence:
  - reference: PMID:18669862
    reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These analyses confirmed that all three MYD88 mutant alleles were loss-of-function."
    explanation: Transfection of each allele into a MyD88-deficient cell line establishes
      loss of function as the molecular lesion.
  downstream:
  - target: Impaired MyD88-Dependent TLR and IL-1R Signaling
    causal_link_type: DIRECT
    description: >-
      Loss of the adaptor directly abolishes signal transduction through the
      MyD88-dependent TLRs and the IL-1R family.
    evidence:
    - reference: PMID:18669862
      reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "showed a selective failure to respond to the stimulation of two key IRAK-4–dependent
        signaling pathways (TLR7/8 and IL-1R)"
      explanation: Patient cells carrying two mutant MYD88 alleles fail to respond to
        TLR and IL-1R stimulation, which is the edge from the molecular lesion to the
        signaling defect.
- name: Impaired MyD88-Dependent TLR and IL-1R Signaling
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Cells cannot transduce signals through the MyD88-dependent Toll-like
    receptors (all TLRs except TLR3) or the IL-1R family. The TLR3 arm, which
    signals through TRIF, is spared, so responses to poly(I:C) are retained and
    most antiviral immunity is preserved. The exception is TLR7, itself a
    MyD88-dependent endosomal single-stranded-RNA sensor, whose loss underlies
    the separately curated susceptibility to severe viral pneumonia.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: MyD88-dependent toll-like receptor signaling pathway
    term:
      id: GO:0002755
      label: MyD88-dependent toll-like receptor signaling pathway
    modifier: LOSS_OF_FUNCTION
  - preferred_term: interleukin-1-mediated signaling pathway
    term:
      id: GO:0070498
      label: interleukin-1-mediated signaling pathway
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:18669862
    reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MyD88 is a key downstream adapter for most Toll-like receptors (TLRs) and
      interleukin-1 receptors (IL-1Rs)."
    quote_role: BACKGROUND
    explanation: States the pathway position of the adaptor whose loss defines this node.
      The sentence is the paper's framing of established pathway biology rather than data
      it generated, so it is graded OTHER rather than as evidence from a study of any
      particular type.
  - reference: PMID:25344726
    reference_title: "A narrow repertoire of transcriptional modules responsive to pyogenic bacteria is impaired in patients carrying loss-of-function mutations in MYD88 or IRAK4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Responses to purified agonists were globally abolished, but variable residual
      responses were present following exposure to whole pathogens."
    explanation: Transcriptome-wide measurement in patient blood showing that responses
      to purified TLR and IL-1R agonists are abolished, with residual responses only to
      whole pathogens.
  downstream:
  - target: Defective NF-kappaB and MAPK Activation
    causal_link_type: DIRECT
    description: >-
      MyD88-dependent TLR and IL-1R signaling converges on NF-kappaB and MAPK
      activation, which cannot occur once the adaptor step is lost.
  - target: Impaired TLR7-Dependent Type I Interferon Production
    causal_link_type: DIRECT
    description: >-
      TLR7 is a MyD88-dependent endosomal RNA sensor, so its type I interferon
      output in plasmacytoid dendritic cells is lost with the other
      MyD88-dependent TLRs.
  - target: Impaired T-Independent IgM Response to Bacterial Antigens
    causal_link_type: DIRECT
    description: >-
      TLR7- and TLR9-driven proliferation of the IgM-positive memory B-cell
      subset is MyD88-dependent, so the subset and its antibody output shrink
      when the adaptor is lost.

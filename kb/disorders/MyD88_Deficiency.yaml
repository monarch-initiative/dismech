      than quantified in patients, which is why the edge is recorded as indirect.
    evidence:
    - reference: PMID:25320238
      reference_title: "IRAK-4 and MyD88 deficiencies impair IgM responses against T-independent bacterial antigens."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thus, by bolstering the IgM(+)IgD(+)CD27(+) B-cell subset, IRAK-4 and MyD88
        promote optimal T-independent IgM antibody responses against bacteria in humans."
      explanation: States the antibacterial role of the pathway-dependent IgM response,
        from which the contribution to bacterial susceptibility follows by one inference
        step.

    reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The MyD88-dependent TLRs and IL-1Rs are therefore essential for protective

- name: Impaired T-Independent IgM Response to Bacterial Antigens
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    A humoral arm of the same lesion. Patients have fewer IgM-positive,
    IgD-positive, CD27-positive B cells, a subset resembling murine splenic
    marginal zone B cells, and reduced serum IgM (but not IgG) against
    T-independent bacterial antigens. Patient cells show impaired TLR7- and
    TLR9-induced proliferation of the subset, which is the proposed reason its
    numbers fall. The arm is graded provisional because the evidence is a single
    combined IRAK-4 and MyD88 cohort and its contribution to the infection
    phenotype is inferred rather than measured.

treatments:
- name: Antibiotic Prophylaxis
  description: >-
    Long-term antibacterial prophylaxis, oral penicillin and/or cotrimoxazole in
    most cases, is the mainstay of preventive care through the vulnerable
    childhood years. Six of the twelve MyD88-deficient patients in the
    international cohort received it, and across the whole cohort invasive
    bacterial disease occurred in 35% of years off prophylaxis against 16.4% of
    years on it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
    therapeutic_agent:
    - preferred_term: antibiotic
      term:
        id: NCIT:C258
        label: Antibiotic
  target_mechanisms:
  - target: Invasive Pyogenic Bacterial Infection
    treatment_effect: INHIBITS
    description: >-
      Prophylaxis suppresses the pyogenic organisms pharmacologically rather than
      repairing the signaling defect, so it acts on the invasive-infection node
      and leaves the upstream chain untouched.
    evidence:
    - reference: PMID:21057262
      reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "At least 1 InvBD was observed in 35% of years without prophylaxis and in
        16.4% of years on prophylactic treatment"
      explanation: Quantifies the reduction in invasive bacterial disease on prophylaxis,
        which is the effect on this mechanism node.
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Preventive treatment included antibiotic prophylaxis (oral penicillin and/or
      cotrimoxazole in most cases (Table 10) in 28 IRAK-4-deficient and 6 MyD88-deficient
      patients"
    explanation: Names the agents used and the number of MyD88-deficient patients treated.
  - reference: PMID:35286514
    reference_title: "A Novel Kindred with MyD88 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical suspicion and the prompt start of antibiotic prophylaxis and immunoglobulin
      (Ig) substitution therapy can improve survival beyond the teenage years"
    explanation: States the survival benefit of early prophylaxis in MyD88 deficiency.
- name: Antipneumococcal Vaccination
  description: >-
    Immunization against Streptococcus pneumoniae, the leading pathogen, with
    conjugate and/or nonconjugate vaccine; patients were also immunized against
    Haemophilus influenzae type b and Neisseria meningitidis. Vaccination does not
    remove the risk, and specific glycan antibody responses may be impaired, so it
    is used alongside antibiotic prophylaxis rather than instead of it.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: antipneumococcal vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Invasive Pyogenic Bacterial Infection
    treatment_effect: BYPASSES
    description: >-
      Vaccine-induced adaptive antibody provides protection that does not require
      the MyD88-dependent innate pathway, so it circumvents rather than corrects
      the lesion.
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients were also immunized with Str. pneumoniae conjugated vaccine only
      (7/48 IRAK-4-deficient patients, 3/12 MyD88-deficient patients), nonconjugated vaccine
      only (8/48 IRAK-4-deficient patients, 1/12 MyD88-deficient patients), or both (9/48
      IRAK-4-deficient patients, 3/12 MyD88-deficient patients)"
    explanation: Documents antipneumococcal immunization and its uptake among the
      MyD88-deficient patients.
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antibiotic prophylaxis (n = 34), antipneumococcal vaccination (n = 31), and/or
      IgG infusion (n = 19), when instituted, had a beneficial impact on patients until the
      teenage years, with no seemingly detectable impact thereafter."
    explanation: Reports antipneumococcal vaccination as part of the regimen with a
      beneficial impact during childhood.
- name: Immunoglobulin Replacement
  description: >-
    Empirical intravenous or subcutaneous IgG, given in the cohort at 400 mg/kg
    every three weeks, supplies passive antibody to the organisms the innate
    pathway cannot handle. Four of the twelve MyD88-deficient patients received it.
  therapeutic_modality: PROTEIN_REPLACEMENT
  dosing_interval: every 3 weeks
  dosing_interval_days: 21
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_mechanisms:
  - target: Invasive Pyogenic Bacterial Infection
    treatment_effect: BYPASSES
    description: >-
      Passive antibody opsonizes the pyogenic organisms independently of the
      MyD88-dependent pathway, substituting for a defense the lesion removes
      rather than restoring signaling.
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "empirical intravenous or subcutaneous IgG injections (400 mg/kg every 3 wk)
      in 15 IRAK-4-deficient and 4 MyD88-deficient patients"
    explanation: Gives the regimen, dose interval and the number of MyD88-deficient patients
      treated.
diagnosis:
- name: Clinical recognition of invasive pyogenic infection with blunted inflammation
  description: >-
    MyD88 deficiency is suspected in an infant or young child with invasive
    infection by a narrow set of pyogenic bacteria, above all Streptococcus
    pneumoniae and then Staphylococcus aureus and Pseudomonas aeruginosa, in whom
    fever and the acute-phase response are weak or delayed. A normal temperature
    or C-reactive protein therefore does not exclude invasive infection, so
    empiric antibacterial treatment and urgent review are advised whenever
    infection is suspected.
  diagnosis_term:
    preferred_term: clinical recognition of invasive pyogenic infection
  markers: C-reactive protein (CRP), body temperature, total leukocyte and neutrophil counts
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "empiric antibacterial treatment and immediate medical consultation are strongly
      recommended in cases of suspected infection or moderate fever."
    explanation: States the clinical corollary of the blunted signs, which is what makes
      recognition rather than laboratory inflammation the diagnostic route.
- name: Whole-blood IL-6 and granulocyte CD62L shedding assay
  description: >-
    Functional confirmation rests on stimulating patient blood with TLR and IL-1R
    agonists. MyD88-deficient whole blood fails to produce IL-6 and patient
    granulocytes fail to shed CD62L. This pairs with molecular confirmation and
    was the diagnostic standard applied to every proband in the international
    cohort.
  diagnosis_term:
    preferred_term: TLR and IL-1R agonist whole-blood stimulation assay
  markers: IL-6 production, granulocyte CD62L shedding
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all probands, diagnosis was based on the detection of homozygous or compound
      heterozygous mutations in IRAK4 or MYD88 accompanied by a lack of production of IL-6
      by whole blood or of CD62L shedding from granulocytes following activation with TLR/IL-1Rs
      agonists."
    explanation: Defines the combined molecular and functional diagnostic criteria used in
      the reference cohort.
- name: MYD88 sequencing
  description: >-
    Molecular confirmation is the identification of biallelic loss-of-function
    MYD88 variants, homozygous or compound heterozygous. In patients of Roma
    descent the recurrent c.157_159del founder allele makes direct Sanger
    sequencing a rapid first-line screen.
  diagnosis_term:
    preferred_term: MYD88 sequencing
  results: Identifies biallelic loss-of-function MYD88 variants
  evidence:
  - reference: PMID:39859960
    reference_title: "Three Unrelated Patients of Roma Ethnicity from a Single Center Carrying the Same Deletion in MYD88 Gene: A Founder Effect?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the frequency of this specific genetic alteration, direct Sanger
      sequencing may be used for a rapid screening in patients of Roma ethnicity presenting
      with a suggestive phenotype characterized by early onset invasive pyogenic infections
      with only mild signs of inflammation."
    explanation: States the targeted sequencing strategy available where the founder allele
      is common.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The founding series reported nine children from five kindreds; the largest
    international cohort documented 12 MyD88-deficient patients from 6 kindreds.
    Roughly half of the reported patients are of Roma descent.
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We documented the clinical features and outcome of 48 patients with IRAK-4
      deficiency and 12 patients with MyD88 deficiency, from 37 kindreds in 15 countries."
    explanation: Gives the size of the largest reported MyD88-deficiency series.
  - reference: PMID:39859960
    reference_title: "Three Unrelated Patients of Roma Ethnicity from a Single Center Carrying the Same Deletion in MYD88 Gene: A Founder Effect?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Half of the reported patients belong to Roma descent, an itinerant ethnic group
      living mostly in Europe, with an increased risk of childhood mortality due to limited
      access to healthcare services."
    explanation: Records the concentration of reported cases in one population, which bears
      on where the disease is found rather than on a rate.
progression:
- phase: Early-onset bacterial infection
  age_range: First infection before age 2 years in 91.7% of patients
  notes: >-
    Bacterial infection begins very early: before the age of 2 years in 11 of the
    12 MyD88-deficient patients, and before 6 months in the same 11.
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, bacterial infections occurred early in most MyD88-deficient patients,
      before the age of 2 years in 91.7% (n = 11) of these patients."
    explanation: Gives the MyD88-specific age at first bacterial infection.
- phase: Age-dependent improvement
  age_range: No invasive bacterial disease from age 11 years onward in the reported cohort
  notes: >-
    Invasive disease becomes rare with age. In the international cohort no
    MyD88-deficient patient had an invasive episode from the age of 11 years,
    although the oldest patient still had noninvasive infection at 17 years. The
    mechanism of the improvement is treated as an open question in the
    age_dependent_improvement discussion.
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MyD88-deficient patients presented no InvBD from the age of 11 years on (2
      patients aged 11 and 17 years), but the oldest patient, aged 17 years, still suffered
      from NInvBD at last follow-up."
    explanation: Documents the age at which invasive disease stopped in the MyD88-deficient
      patients, and the residual noninvasive burden.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Half of the reported MyD88-deficient patients in the largest cohort died of
    invasive bacterial disease, all before the age of 8 years, and pneumococcus
    caused most of those deaths. The burden is concentrated in infancy and early
    childhood, and falls substantially with prophylaxis and with age.
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, 24 patients died of InvBD (18/46 IRAK-4, 6/12 MyD88), all before the
      age of 8 years, and most before the age of 2 years"
    explanation: Gives the MyD88-specific mortality, 6 of 12 patients, which drives the HIGH
      burden assessment.
animal_models:
- name: Myd88-null mouse
  species: Mouse
  genotype: Myd88 knockout (Myd88-/-)
  publication: PMID:9697844
  description: >-
    The germline Myd88 knockout was the model that established the adaptor's role
    in IL-1 and IL-18 signaling. It reproduces the cellular lesion, including the
    failure to induce acute-phase proteins and cytokines in response to IL-1, and
    it reproduces susceptibility to the same Gram-positive pyogenic organisms that
    affect patients. Its infectious phenotype is nonetheless far broader than the
    human disease, which is the substance of the HUMAN_MODEL_MISMATCH discussion
    below.
  modeled_mechanisms:
  - target: Blunted Proinflammatory Cytokine Production
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Myd88-null mice fail to induce acute-phase proteins and cytokines in
      response to IL-1, the same IL-1R-arm cytokine failure measured in patient
      cells.
    readouts:
    - name: Acute-phase protein and cytokine induction in response to IL-1
      target: Blunted Proinflammatory Cytokine Production
      direction: DECREASED
      interpretation: The murine correlate of the abolished cytokine response measured in
        patient whole blood and fibroblasts.
      evidence:
      - reference: PMID:9697844
        reference_title: "Targeted disruption of the MyD88 gene results in loss of IL-1- and IL-18-mediated function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mice generated by gene targeting to lack MyD88 have defects in T cell proliferation
          as well as induction of acute phase proteins and cytokines in response to IL-1."
        explanation: Reports the measured loss of cytokine and acute-phase induction in the
          knockout.
    evidence:
    - reference: PMID:9697844
      reference_title: "Targeted disruption of the MyD88 gene results in loss of IL-1- and IL-18-mediated function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "these results demonstrate that MyD88 is a critical component in the signaling
        cascade that is mediated by IL-1 receptor as well as IL-18 receptor."
      explanation: Establishes the knockout as informative for the IL-1R-arm signaling and
        cytokine defect.
  - target: Invasive Pyogenic Bacterial Infection
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Concordant for the pyogenic organisms that matter in patients, and
      discordant in scope: the murine susceptibility extends to at least 35
      pathogens, whereas patients are normally resistant to almost all of them.
    limitations: >-
      The mouse phenotype is far broader than the narrow human one and is not
      restricted to early life, so the model cannot be used to argue about which
      organisms a MyD88-deficient patient is at risk from, only that the pathway
      matters for pyogenic bacteria.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        Myd88-null mice are vulnerable to at least 35 microbes spanning bacteria,
        viruses, parasites and fungi; the nine founding patients were normally
        resistant to most common bacteria, viruses, fungi and parasites, so the
        human MyD88-dependent pathway is far more redundant than the murine one
        outside the pyogenic set.
      evidence:
      - reference: PMID:18669862
        reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the high susceptibility of MyD88-deficient mice to experimental infections
          with at least 35 pathogens—19 bacteria, seven viruses, five parasites, and four
          fungi"
        explanation: Enumerates the murine susceptibility that the species divergence rests
          on.
    evidence:
    - reference: PMID:18669862
      reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Like MyD88-deficient mice, the patients are vulnerable to Streptococcus pneumoniae
        (16, 17), Staphylococcus aureus (18, 19), and Pseudomonas aeruginosa (20-23)."
      explanation: The concordant arm, where mouse and human agree on the pyogenic organisms.
    - reference: PMID:18669862
      reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By contrast, MyD88-deficient mice are vulnerable to almost all pathogens tested
        (at least 35 microbes, tables S1 to S3)."
      explanation: The discordant arm, the broad murine susceptibility the human phenotype
        does not share.
  evidence:
  - reference: PMID:18669862
    reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The immunological pheno-type is similar to that of MyD88-deficient mice (tables
      S9 and S10) (13-15), but the infectious phenotype is different."
    explanation: >-
      States how far the model is informative; the immunological lesion matches
      while the infectious phenotype does not.
discussions:
- discussion_id: age_dependent_improvement
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does susceptibility to invasive pyogenic infection in MyD88 deficiency
    wane after the first decade despite a constitutive, lifelong signaling defect?
  attaches_to:
  - pathophysiology#Invasive Pyogenic Bacterial Infection
  rationale: >-
    Invasive infection and death are concentrated in infancy and early childhood,
    and no invasive episode was recorded in the reported MyD88-deficient patients
    from the age of 11 years. The founding report explicitly excluded cellular
    leakiness as the explanation, so the improvement is presumed to reflect
    compensation by maturing adaptive immunity or by MyD88-independent innate
    immunity, neither of which has been established. Noninvasive infection can
    continue into adulthood, so the improvement is partial.
  evidence:
  - reference: PMID:18669862
    reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their clinical status improved with age, but not due to any cellular leakiness
      in MyD88 deficiency."
    explanation: Documents the age-dependent improvement and rules out residual signaling
      as its cause, which is what leaves the mechanism open.
  - reference: PMID:18669862
    reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This may be due to the compensatory effect of adaptive immunity (27, 28) and/or
      the maturation of TIR-independent innate immunity (29, 30)."
    explanation: The candidate explanations are offered as possibilities by the authors, not
      demonstrated, which is the gap recorded here.
- discussion_id: mouse_broad_vs_human_narrow_susceptibility
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does the Myd88-null mouse show susceptibility to at least 35 pathogens
    when human MyD88 deficiency produces only a narrow, largely age-limited
    susceptibility to pyogenic bacteria?
  attaches_to:
  - pathophysiology#Impaired Inflammatory Response to Pyogenic Bacteria
  - pathophysiology#Invasive Pyogenic Bacterial Infection
  rationale: >-
    The immunological phenotype of the knockout matches the human one, so the
    discordance is not an artifact of a partial model: the same lesion yields a
    far broader infectious phenotype in mice. Resolving it means explaining which
    human pathways are redundant for antiviral, antifungal and intracellular
    bacterial immunity where the murine ones are not. The question bears directly
    on how much weight a murine result can carry when reasoning about risk in a
    patient.
  proposed_experiments:
  - experiment_id: myd88_mouse_pathogen_panel
    name: Systematic challenge of Myd88-null mice with the pathogens patients handle normally
    description: >-
      Challenge the knockout with the organisms to which patients are normally
      resistant, matched for age at exposure, to establish whether the murine
      susceptibility reflects a genuine pathway difference or the young age and
      controlled dose of experimental infection.
    would_support:
    - pathophysiology#Impaired Inflammatory Response to Pyogenic Bacteria
  evidence:
  - reference: PMID:18669862
    reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By contrast, MyD88-deficient mice are vulnerable to almost all pathogens tested
      (at least 35 microbes, tables S1 to S3)."
    explanation: Quantifies the murine breadth that the human phenotype does not reproduce.
  - reference: PMID:18669862
    reference_title: "Pyogenic bacterial infections in humans with MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the nine MyD88-deficient patients were normally resistant to most common
      bacteria, viruses, fungi, and parasites"
    explanation: The human side of the mismatch, preserved resistance to the organisms that
      kill the mouse.
notes: >-
  Scope. This entry is MyD88 deficiency (immunodeficiency 68, MONDO:0012839).
  IRAK-4 deficiency (immunodeficiency 67, MONDO:0011888) sits one step downstream
  in the same pathway and is clinically and immunologically indistinguishable, but
  it is a distinct gene-disease entity and is curated as the sibling entry
  Immunodeficiency_67 rather than as a subtype here. The two entries are kept
  structurally parallel on purpose.

  Disaggregation. The largest cohort (Picard 2010) pools 48 IRAK-4-deficient and
  12 MyD88-deficient patients, and every figure quoted here is one the source
  reports for the MyD88-deficient arm separately, with two exceptions that are
  visible in the snippets themselves: the prophylaxis benefit expressed as
  infection-free years, and the high-IgE finding, which name both arms together.

  The TLR7 branch. The COVID-19 susceptibility rests on a combined MyD88 or
  IRAK-4 cohort of 22 patients, 15 of them MyD88-deficient, so it is attributed to
  the shared pathway. Note the same paper reports that these patients did mount an
  inflammatory response to SARS-CoV-2 and did induce interferon-stimulated genes
  during acute infection; the defect it localizes is the plasmacytoid dendritic
  cell TLR7 sensing step, which is why this entry records the branch at that node
  rather than as a general interferon deficiency. The node is graded PROVISIONAL
  accordingly.

  Hyper-IgE overlap. Raised IgE and early suppurative infection with little
  inflammation make MyD88 deficiency a differential for the hyper-IgE syndromes,
  and it is not listed among their causes in the IUIS classification. This is
  recorded as a phenotype and a diagnostic consideration, not as a mechanism, since
  no source in this entry establishes how the adaptor defect raises IgE.

  Humoral branch. The T-independent IgM arm rests on one study of a combined
  IRAK-4 and MyD88 cohort, and its own authors present the impaired B-cell
  proliferation as a suggested mechanism, so the node is graded provisional and
  the edge to invasive infection is recorded as indirect. Note that total serum
  IgM was normal for age in the MyD88-deficient patients of the clinical cohort;
  the defect is in antibody against T-independent bacterial antigens, not in
  total IgM, so no decreased-IgM phenotype is asserted.

  Evidence base. The entry rests on the founding series (von Bernuth 2008,
  PMID:18669862), the large clinical-outcome cohort (Picard 2010, PMID:21057262),
  the transcriptional-module study (PMID:25344726), the Roma founder-allele series
  (PMID:39859960), a recent kindred report (PMID:35286514), the combined
  MyD88/IRAK-4 SARS-CoV-2 cohort (PMID:36880831), the T-independent IgM study
  (PMID:25320238), the death-domain variant study (PMID:20966070), and the
  original Myd88 knockout (PMID:9697844). No GeneReviews chapter names this disease; `just
  check-genereviews` reports NO_CHAPTER on both the offline index and an online
  title search.

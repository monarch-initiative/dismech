- name: Impaired Inflammatory Response to Pyogenic Bacteria
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Without cytokine-driven inflammation the host cannot contain invasive
    pyogenic bacteria, and the systemic signs that normally flag infection are
    weak or delayed. The susceptibility is narrow: resistance to most other
    bacteria, viruses, fungi and parasites is normal.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: DECREASED
  evidence:

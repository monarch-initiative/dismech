- name: Avoid prednisone-azathioprine-N-acetylcysteine combination
  description: >-
    This chronic three-drug regimen should not be used to treat IPF. PANTHER-IPF found excess deaths and
    hospitalizations without physiological or clinical benefit. This result is specific to the regimen
    and does not establish that immune cells have no mechanistic role or address every acute-exacerbation
    treatment question.
  evidence:
  - reference: PMID:22607134
    reference_title: Prednisone, azathioprine, and N-acetylcysteine for pulmonary fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased risks of death and hospitalization were observed in patients with idiopathic pulmonary
      fibrosis who were treated with a combination of prednisone, azathioprine, and NAC, as compared with
      placebo.
    explanation: >-
      The randomized PANTHER-IPF result supports avoiding this regimen.
- name: Genetic counseling for inherited fibrosis
  description: >-
    Offer specialist counseling when inherited pulmonary fibrosis is suspected or a pathogenic variant
    is identified. Discuss variable penetrance, possible anticipation and telomere inheritance, family
    evaluation and the distinction between variant transmission and disease prediction.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1230/
    reference_title: Pulmonary Fibrosis Predisposition Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with a ... associated with predisposition to pulmonary fibrosis has
      a 50% chance of inheriting the pathogenic variant.
    explanation: >-
      The recurrence statement applies to autosomal dominant monogenic predisposition, not every sporadic
      IPF case; inheritance of a variant does not predict age of onset or guarantee disease.
mechanistic_hypotheses:
- hypothesis_group_id: injury_centric_model
  hypothesis_label: Injury-Centric Wound Healing Model
  status: CANONICAL
  description: >-
    Repetitive alveolar epithelial injury is modeled as the primary upstream driver; AT2 cell senescence
    and subsequent fibroblast activation are downstream consequences of failed wound healing. Fibrosis
    represents an aberrant, non-resolving repair response to injury in genetically or environmentally
    susceptible individuals.
  evidence:
  - reference: PMID:35563849
    reference_title: "Evaluation of Proteasome Inhibitors in the Treatment of Idiopathic Pulmonary Fibrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      it has been suggested that repeated microinjuries of epithelial cells induce a wound healing response,
      during which fibroblasts differentiate into myofibroblasts.
    explanation: >-
      Supports the injury-centric model in which repetitive microinjury is the upstream initiating event
      that leads to fibroblast activation.
  notes: >-
    Retained as CANONICAL as a useful injury-and-aberrant-repair framework. Susceptibility, persistent
    signaling and regenerative failure can sustain fibrosis after an initiating insult; the framework
    does not require an identified recurrent exposure in every patient.
- hypothesis_group_id: senescence_first_model
  hypothesis_label: Senescence-First (Stem-Cell Exhaustion) Model
  status: ALTERNATIVE
  description: >-
    AT2 senescence and loss of regenerative capacity may be proximal drivers of fibrosis, particularly
    in telomere-associated disease but also after other stress pathways. Human genetics and tissue studies
    support relevance; TRF1 and Sin3a mouse perturbations demonstrate spontaneous fibrosis, whereas other
    telomerase models require injury. Immune-cell-free organoids establish one epithelial-fibroblast route.
    The relative contributions of this route and immune amplification in human disease remain unresolved.
  evidence:
  - reference: PMID:37653024
    reference_title: "Autocrine TGF-β-positive feedback in profibrotic AT2-lineage cells plays a crucial role in non-inflammatory lung fibrogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the autocrine TGF-β-positive feedback loop in AT2-lineage cells is a critical cellular system in
      non-inflammatory lung fibrogenesis.
    explanation: >-
      Immune-cell-free organoids support an epithelial-fibroblast route in vitro, without proving whole-animal
      immune independence.
  - reference: PMID:33808277
    reference_title: "Telomeres in Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Loss of regenerative potential of alveolar type II epithelial cells (AT2) cells following injury
      has been postulated to underlie telomeropathy-associated lung fibrosis, with concomitant excessive
      proliferation of airway cells displaying abnormal phenotypes
    explanation: >-
      Review describes telomere-driven loss of AT2 regenerative capacity as a mechanistic explanation
      for the strong age and telomere-length associations in IPF.
  - reference: PMID:33197388
    reference_title: "Telomere length and risk of idiopathic pulmonary fibrosis and chronic obstructive pulmonary disease: a mendelian randomisation study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meta-analysis of the two-sample mendelian randomisation results provided evidence inferring that
      shorter telomeres cause IPF
    explanation: >-
      Published Mendelian randomization supports a contribution of shorter telomeres to IPF susceptibility
      under instrumental-variable assumptions. The COPD comparator does not establish disease specificity
      across all conditions or AT2-specific causal timing.
  - reference: PMID:31000627
    reference_title: "Telomerase reverse transcriptase ameliorates lung fibrosis by protecting alveolar epithelial cells against senescence."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      SPC-Tert cKO mice did not develop pulmonary fibrosis spontaneously up to 9 months of TERT deficiency.
      However, upon bleomycin treatment, they exhibited enhanced lung injury, inflammation, and fibrosis
      compared with control mice
    explanation: >-
      AT2-specific TERT loss increases injury susceptibility and senescence without a significant change
      in AT2 telomere length. The absence of spontaneous fibrosis applies to this model only.
  - reference: PMID:41728098
    reference_title: "Shortened Telomere Length as a Risk Factor for Idiopathic Pulmonary Fibrosis: A Meta-Analysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pooled analysis showed shorter telomere length in IPF patients compared to controls (SMD: -0.84,
      95%CI -1.21 to -0.48, Z = 4.55, p < 0.00001)
    explanation: >-
      Observational pooled measurements support shorter telomeres in IPF. They complement genetic evidence
      but cannot alone establish causal ordering or an exclusive senescence-first subtype.
  - reference: PMID:34524912
    reference_title: "A cGAS-dependent response links DNA damage and senescence in alveolar epithelial cells: a potential drug target in IPF."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cGAS expression in fibrotic tissue from lungs of patients with IPF was detected within cells immunoreactive
      for epithelial cell adhesion molecule (EpCAM) and p21, epithelial and senescence markers, respectively
    explanation: >-
      Human colocalization supports pathway presence, while cultured-cell perturbations support cGAS-dependent
      senescence amplification. This does not establish universal STING activation or recruited immune-cell
      necessity.
  - reference: PMID:31922885
    reference_title: "Diverse Injury Pathways Induce Alveolar Epithelial Cell CCL2/12, Which Promotes Lung Fibrosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mice with lung epithelial cell-specific deletion of CCL12 were protected from bleomycin-induced
      fibrosis
    explanation: >-
      Epithelial CCL12 deletion limits macrophage recruitment and fibrosis in a specific bleomycin paradigm.
      Global deletion was not protective, and this is not a refutation of all epithelial-autonomous routes.
  - reference: PMID:27699234
    reference_title: Telomere dysfunction in alveolar epithelial cells causes lung remodeling and fibrosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results demonstrate that prolonged telomere dysfunction in type II AECs, but not collagen-expressing
      cells, leads to age-dependent lung remodeling and fibrosis.
    explanation: >-
      Conditional TRF1 deletion causes spontaneous fibrosis after prolonged epithelial telomere dysfunction;
      this severe uncapping model is distinct from ordinary age-related shortening.
  - reference: PMID:32991815
    reference_title: Senescence of Alveolar Type 2 Cells Drives Progressive Pulmonary Fibrosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We used conditional loss of Sin3a in adult mouse AT2 cells to initiate a program of p53-dependent
      cellular senescence, AT2 cell depletion, and spontaneous, progressive pulmonary fibrosis.
    explanation: >-
      An AT2-directed genetic perturbation produces spontaneous progressive fibrosis without bleomycin;
      it does not establish immune independence or the initiating lesion in all human IPF.
  notes: >-
    Retain ALTERNATIVE as a hypothesis about causal ordering, without assigning a validated exclusive
    patient subtype. OpenScientist provides useful multi-trigger and multi-cellular leads, but its universal
    second-hit and obligate-immune claims are rejected. Short leukocyte telomere frequencies do not define
    the fraction of IPF mediated by AT2 senescence. TERT deletion, telomere shortening and shelterin uncapping
    are distinct perturbations. The assessment records corrected source interpretation and missing declared
    artifacts.
- hypothesis_group_id: feedback_loop_convergence_model
  hypothesis_label: Convergent Self-Sustaining Feedback Loop Model
  status: ALTERNATIVE
  description: >-
    Epithelial stress, senescence, fibroblast persistence and matrix-derived mechanical signals may reinforce
    one another after initiation. Experimental TGF-beta and matrix-stiffness feedback support this convergent
    framework, but their relative necessity and therapeutic importance in human IPF remain unresolved.
  evidence:
  - reference: PMID:34813355
    reference_title: "Pathogenic Mechanisms Underlying Idiopathic Pulmonary Fibrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathogenesis of idiopathic pulmonary fibrosis (IPF) involves a complex interplay of cell types
      and signaling pathways. Recurrent alveolar epithelial cell (AEC) injury may occur in the context
      of predisposing factors (e.g., genetic, environmental, epigenetic, immunologic, and gerontologic),
      leading to metabolic dysfunction, senescence, aberrant epithelial cell activation, and dysregulated
      epithelial repair.
    explanation: >-
      Annual Review of Pathology review frames IPF as a convergence of multiple predisposing factors and
      cell types, consistent with the feedback loop model in which no single upstream event fully explains
      the disease.
  notes: >-
    This synthesis complements upstream injury and senescence hypotheses. Response to an antifibrotic
    drug does not by itself identify the initiating lesion or establish which feedback loop mediated benefit.
discussions:
- discussion_id: disc_ipf_injury_vs_senescence_ordering
  prompt: >-
    Is repetitive alveolar epithelial injury the primary upstream driver of IPF, or does age-related AT2
    cell senescence and telomere attrition precede and predispose to fibrosis independently of ongoing
    injury?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#AT2 cell senescence and SASP
  rationale: >-
    Human disease likely combines epithelial susceptibility, injury and failed repair. TRF1 and Sin3a
    perturbations demonstrate spontaneous fibrosis in mice, while AT2-specific TERT loss and certain surfactant
    variants require additional injury. The unresolved question is how these distinct model-specific mechanisms
    map onto human causal ordering, not whether any spontaneous model exists.
  evidence:
  - reference: PMID:27699234
    reference_title: Telomere dysfunction in alveolar epithelial cells causes lung remodeling and fibrosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results demonstrate that prolonged telomere dysfunction in type II AECs, but not collagen-expressing
      cells, leads to age-dependent lung remodeling and fibrosis.
    explanation: >-
      Conditional TRF1 deletion causes spontaneous fibrosis after prolonged epithelial telomere dysfunction;
      this severe uncapping model is distinct from ordinary age-related shortening.
  - reference: PMID:32991815
    reference_title: Senescence of Alveolar Type 2 Cells Drives Progressive Pulmonary Fibrosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We used conditional loss of Sin3a in adult mouse AT2 cells to initiate a program of p53-dependent
      cellular senescence, AT2 cell depletion, and spontaneous, progressive pulmonary fibrosis.
    explanation: >-
      An AT2-directed genetic perturbation produces spontaneous progressive fibrosis without bleomycin;
      it does not establish immune independence or the initiating lesion in all human IPF.
- discussion_id: disc_ipf_ecm_feedback_irreversibility
  prompt: >-
    Which epithelial, mesenchymal and matrix-derived feedback processes sustain progressive IPF, how necessary
    are they in different patients, and which combinations are therapeutically tractable?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Excessive extracellular matrix deposition
  - pathophysiology#Aberrant basaloid cell emergence
  rationale: >-
    Autocrine TGF-beta, matrix mechanics and persistent mesenchymal states can sustain experimental fibrosis.
    Human relative contributions and optimal combinations of interventions remain unresolved. Antifibrotic
    therapies slow FVC decline but do not establish reversal, while senolytic clinical studies remain
    small feasibility trials.
- discussion_id: disc_ipf_gut_lung_axis_causality
  prompt: >-
    Does gut dysbiosis drive IPF progression (dysbiosis → fibrosis), or is it a secondary consequence
    of systemic inflammation and drug effects in established IPF (fibrosis → dysbiosis)? Are microbial
    metabolite deficits (SCFA, secondary bile acids) individually sufficient to amplify pulmonary fibrosis,
    or do they require cofactors? Can fecal microbiota transplantation attenuate pulmonary inflammation
    in human ILD?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Gut dysbiosis and microbial metabolite dysregulation
  rationale: >-
    The reviewed evidence combines clinical associations and preclinical gut-lung experiments. Directionality,
    specific microbial mediators, and independence from disease severity, diet and drug exposure remain
    unresolved. Human microbiome-directed therapeutic benefit is not established by the cited review.
  proposed_experiments:
  - experiment_id: exp_ipf_microbiome_temporal_cohort
    name: Longitudinal microbiome profiling in IPF cohorts
    description: >-
      Use longitudinal microbiome profiling with matched lung-function measures, diet, medication and
      severity covariates to assess temporal association. Temporal precedence alone does not establish
      causality.
  - experiment_id: exp_ipf_germ_free_bleomycin
    name: Germ-free and antibiotic-depleted mouse IPF models
    description: >-
      Germ-free or antibiotic-depleted mouse bleomycin models to test whether microbiota depletion attenuates
      pulmonary fibrosis, establishing a causal contribution of gut microbiota to lung fibrotic pathways.
  - experiment_id: exp_ipf_scfa_supplementation
    name: SCFA supplementation in IPF mouse models
    description: >-
      SCFA (butyrate and propionate) supplementation in bleomycin-induced pulmonary fibrosis mouse models
      to determine whether restoring microbial metabolite levels reduces fibrotic burden and pro-inflammatory
      cytokines.

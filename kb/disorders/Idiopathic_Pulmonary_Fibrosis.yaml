      fibroblasts
    explanation: >-
      Establishes IL-11 up-regulation in patient IPF lung and its secretion by
      IPF fibroblasts, grounding this node in human disease. Evidence source is
      HUMAN_CLINICAL (patient lung tissue).
  - reference: PMID:31554736
    reference_title: "Interleukin-11 is a therapeutic target in idiopathic pulmonary fibrosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IL-11 stimulates lung fibroblasts to become invasive actin alpha 2, smooth
      muscle-positive (ACTA2+), collagen-secreting myofibroblasts in an
      extracellular signal-regulated kinase (ERK)-dependent, posttranscriptional
      manner
    explanation: >-
      Directly evidences the IL-11 to ERK receptor-signalling arm driving
      fibroblast-to-myofibroblast conversion modeled by this node. Evidence
      source is IN_VITRO (cultured lung fibroblasts).
  - reference: PMID:31554736
    reference_title: "Interleukin-11 is a therapeutic target in idiopathic pulmonary fibrosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      anti-IL-11 treatment diminished lung inflammation and reversed lung
      fibrosis while inhibiting ERK and SMAD activation in mice
    explanation: >-
      Shows pharmacological IL-11 inhibition reverses lung fibrosis and lowers
      ERK activation in vivo, validating the drug-target link on this node.
      Evidence source is MODEL_ORGANISM (bleomycin mouse model).

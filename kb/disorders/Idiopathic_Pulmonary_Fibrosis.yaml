- name: IL-11 Autocrine Signalling in Lung Fibroblasts
  description: >-
    IL-11 is upregulated in IPF lungs and secreted by IPF fibroblasts, where it
    acts through IL11RA1 in an autocrine, ERK-dependent manner to drive
    fibroblast-to-myofibroblast conversion. This IL-11 receptor-signalling arm is
    an organ-specific instance of the conserved IL-11 signalling module and feeds
    fibroblast activation; a neutralizing anti-IL-11 antibody blocks fibroblast
    activation and reverses lung fibrosis.
  conforms_to: "il11_erk_ampk_mtor_aging#IL-11 Receptor Signalling Activation"
  role: amplifier

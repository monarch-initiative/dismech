- name: Aberrant basaloid cell emergence
  description: >-
    KRT5-negative/KRT17-positive aberrant basaloid epithelial cells coexpress basal, mesenchymal and senescence-related
    markers and occur near myofibroblast foci in fibrotic human lungs. Their transcriptome is a disease-associated
    state rather than proof of epithelial conversion into fibroblasts. Human AT2 cultures can undergo
    a basal transition under defined signaling conditions, but the origin and causal contribution of every
    basaloid cell population in human IPF remain unresolved.
  role: consequence
  cell_types:

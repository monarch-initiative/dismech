- name: Surfactant dysfunction and epithelial proteostasis stress
  description: >-
    Rare surfactant variants predispose a subset of familial interstitial lung disease, sometimes classified
    as IPF. Misprocessing and endoplasmic-reticulum stress can compromise AT2 function, but variants differ:
    SP-A1 R219W-driven TGF-beta secretion is UPR dependent, whereas SP-C I73T and M71V secretion is largely
    UPR independent. L188Q SFTPC-induced ER stress increases bleomycin susceptibility without spontaneous
    fibrosis in one mouse model. Herpesvirus colocalization with UPR markers in human tissue does not
    establish viral causation.

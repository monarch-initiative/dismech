      label: cellular senescence
    modifier: INCREASED
  evidence:
  - reference: PMID:33859634
    reference_title: "Disparate Interferon Signaling and Shared Aberrant Basaloid Cells in Single-Cell Profiling of Idiopathic Pulmonary Fibrosis and Systemic Sclerosis-Associated Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Within both the IPF and SSc-ILD samples we identified a small population of the recently described
      aberrant basaloid cells (or KRT5-/KRT17+ cells), with no cells sharing this distinct transcriptome
      amongst the control samples
    explanation: >-
      Human single-cell data identify this population in both IPF and SSc-ILD, so it is not specific to
      IPF and does not establish senescence-to-basaloid lineage causality.
  - reference: PMID:34813355
    reference_title: "Pathogenic Mechanisms Underlying Idiopathic Pulmonary Fibrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These studies have uncovered a novel type of AEC with characteristics of an aberrant basal cell,
      which may disrupt normal epithelial repair and propagate a profibrotic phenotype.
    explanation: >-
      Annual Review of Pathology 2022 review identifies the aberrant basaloid cell population as mechanistically
      relevant to IPF pathogenesis through disruption of normal epithelial repair.
  - reference: PMID:32832599
    reference_title: Single-cell RNA-seq reveals ectopic and aberrant lung-resident cell populations in idiopathic pulmonary fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among epithelial cells enriched in IPF, we identify a previously unidentified population of aberrant
      basaloid cells that coexpress basal epithelial, mesenchymal, senescence, and developmental markers
      and are located at the edge of myofibroblast foci in the IPF lung.
    explanation: >-
      Single-cell and histologic localization demonstrate a disease-associated state, not causal lineage
      conversion.
  - reference: PMID:42182417
    reference_title: Chronic TGFβ1 Signaling Drives Aberrant Alveolar-Basaloid Metaplasia through a KRT17-Stratifin migratory complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using integrated single nucleus ATAC- and RNA-sequencing on human lungs and an in vitro model of
      dysplastic repair, we identify two distinct regenerative trajectories for alveolar type 2 (AT2)
      cells: a resolvable euplastic repair trajectory and a persistent, non-resolving dysplastic repair
      trajectory. The latter is governed by a spatially restricted ITGB6/TGFβ1/SMAD3 signaling axis in
      fibrotic regions of IPF lungs and in murine lungs characterized by chronic epithelial remodeling.
    explanation: >-
      Integrated human data and experimental dysplastic-repair models identify TGF-beta/SMAD3 regulation;
      human observational evidence alone does not establish temporal initiation.
- name: Gut dysbiosis and microbial metabolite dysregulation
  conforms_to: "gut_dysbiosis#Age-Associated Gut Microbiota Alteration"
  description: >-
    Altered gut microbial composition and metabolites have been associated with interstitial lung disease,
    and preclinical models suggest effects on immune responses and fibrosis. Directionality, specific
    mediators and independence from diet, disease severity and antifibrotic treatment remain unresolved
    in human IPF. This is an emerging modifier rather than an established universal upstream mechanism.
  role: amplifier

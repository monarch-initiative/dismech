- name: AT2-specific TRF1 conditional deletion
  species: Mus musculus
  genotype: SPC-Cre TRF1fl/fl
  description: >-
    Prolonged AT2 shelterin deletion produces spontaneous senescence-associated remodeling and collagen
    deposition, unlike the collagen-expressing-cell deletion comparator.
  publication: PMID:27699234
  evidence:
  - reference: PMID:27699234
    reference_title: Telomere dysfunction in alveolar epithelial cells causes lung remodeling and fibrosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deletion of TRF1 in type II AECs for up to 9 months resulted in short telomeres and lung remodeling
      characterized by increased numbers of type II AECs, α-smooth muscle actin+ mesenchymal cells, collagen
      deposition, and accumulation of senescence-associated β-galactosidase+ lung epithelial cells.
    explanation: >-
      Prolonged epithelial shelterin deletion produces spontaneous remodeling without bleomycin.
  modeled_mechanisms:
  - target: Alveolar epithelial telomere dysfunction
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      TRF1 loss perturbs telomere protection and eventually shortens telomeres.
    limitations: >-
      Severe engineered uncapping and mouse telomere biology differ from ordinary human age-related attrition.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that expression of two SP-A1 (R219W and R242*) and three SP-C (I73T, M71V, and L188Q) variant
      proteins lead to the secretion of the profibrotic latent transforming growth factor (TGF)-β1 in

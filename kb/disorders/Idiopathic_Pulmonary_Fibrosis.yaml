- accession: geo:GSE262882
  title: Activation of Fibroblast LRP1 by AT2-secreted MDK Affects OTUB1/SLC7A11 Ubiquitination to Inhibit Fibroblast Ferroptosis in Idiopathic Pulmonary Fibrosis.
  description: Idiopathic pulmonary fibrosis (IPF), a chronic interstitial fibrosing pneumonia of unknown cause, is characterized by an irreversible decrease in alveolar cells and an increase in fibroblasts. In our research, the numbers of AT2 cells and fibroblasts are abnormally regulated, but AT1 cells are significantly reduced in lung tissue sections from patients with IPF and mice. By analyzing the single-cell sequence from GEO database and experimental validation both in vivo and in vitro, it is found that the abnormally regulated AT2 cells secreting a large amount of MDK to activate the CTHRC1+ fibroblasts LRP1 receptor and inhibit the ferroptosis of fibroblasts.

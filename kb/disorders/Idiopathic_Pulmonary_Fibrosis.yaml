experimental_models:
- name: Microengineered alveolar array lung-on-chip with breathing mechanics
  description: >-
    An array of geometrically defined alveolar units suspended on a thin
    collagen-elastin hydrogel membrane engineered to match the dimensions and
    mechanical fragility of the native alveolar basement membrane, with human
    alveolar epithelial cells and lung fibroblasts co-cultured across it and
    subjected to controlled cyclic deflection emulating breathing. Precision
    injection moulding and an SBS microwell format make it medium-throughput,
    which is what allows drug testing rather than single-device demonstration.
  experimental_model_type: ORGAN_ON_CHIP
  namo_type: namo:OrganOnChip
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  cell_types:
  - preferred_term: Pulmonary alveolar epithelial cell
    term:
      id: CL:0000322
      label: pulmonary alveolar epithelial cell
  - preferred_term: Lung fibroblast
    term:
      id: CL:0002553
      label: fibroblast of lung
  conditions:
  - cyclic mechanical stretch (breathing-mimetic)
  - static control
  - TGF-beta 1 stimulation
  - nintedanib treatment
  culture_system: Injection-moulded alveolar array chip with suspended collagen-elastin hydrogel membrane
    and cyclic actuation
  publication: PMID:41406599
  modeled_mechanisms:
  - target: Fibroblast activation and myofibroblast differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cyclic stretch applied together with TGF-beta 1 amplified fibrotic
      signalling well beyond TGF-beta 1 alone. This makes breathing motion an
      explicit cofactor of fibroblast activation rather than background, which is
      the mechanistic claim a static culture cannot test.
    limitations: >-
      Amplification was demonstrated with exogenous TGF-beta 1 rather than with
      the endogenous injury signals of IPF, and the co-culture uses non-diseased
      alveolar epithelial cells and fibroblasts, so it models the mechanical
      contribution to fibrotic signalling rather than IPF-specific fibroblast
      biology such as the aberrant basaloid state.
    readouts:
    - name: Extracellular matrix gene expression under cyclic stretch with TGF-beta 1
      target: Fibroblast activation and myofibroblast differentiation
      direction: INCREASED
      interpretation: >-
        Collagen I, collagen III, and fibronectin induction is the activation
        readout, and its stretch-dependence is the finding.
      evidence:
      - reference: PMID:41406599
        reference_title: Microengineered alveolar array lung-on-chip with hydrogel membrane and simulated
          breathing mechanics for anti-fibrotic testing.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: We demonstrate that cyclic stretching significantly amplifies fibrotic signaling in the
          presence of transforming growth factor-beta 1 (TGF-β1), evidenced by increased expression of
          extracellular matrix (ECM) components such as collagen I, collagen III, and fibronectin.
        explanation: Reports the matrix-gene induction and its dependence on cyclic stretch.
    evidence:
    - reference: PMID:41406599
      reference_title: Microengineered alveolar array lung-on-chip with hydrogel membrane and simulated
        breathing mechanics for anti-fibrotic testing.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Human alveolar epithelial cells and lung fibroblasts are co-cultured on a membrane and subjected
        to cyclic biomechanical stress that mimics respiratory movements.
      explanation: Establishes the epithelial-fibroblast co-culture under breathing mechanics as the
        model configuration relevant to this node.
  - target: Excessive extracellular matrix deposition
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Matrix protein and PAI-1 expression rose under profibrotic stimulation and
      fell with nintedanib, an approved IPF antifibrotic, giving the model
      pharmacological validation against the standard of care for this node.
    limitations: >-
      Readouts are expression-level over days rather than accumulated
      cross-linked matrix, and nintedanib reversal establishes assay
      responsiveness rather than predictive value for novel compounds. The
      membrane is a defined collagen-elastin hydrogel, not fibrotic human lung
      matrix, so matrix-stiffness feedback is not reproduced.
    readouts:
    - name: ECM protein and PAI-1 expression under nintedanib
      target: Excessive extracellular matrix deposition
      direction: DECREASED
      interpretation: >-
        Reduction by an approved antifibrotic confirms the readout responds in
        the therapeutically expected direction.
      evidence:
      - reference: PMID:41406599
        reference_title: Microengineered alveolar array lung-on-chip with hydrogel membrane and simulated
          breathing mechanics for anti-fibrotic testing.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Treatment with the anti-fibrotic drug nintedanib reduced expression of ECM proteins and
          plasminogen activator inhibitor-1 (PAI-1), validating the system's utility for pharmacological
          testing.
        explanation: Directly reports the drug-responsive matrix readout.
    evidence:
    - reference: PMID:41406599
      reference_title: Microengineered alveolar array lung-on-chip with hydrogel membrane and simulated
        breathing mechanics for anti-fibrotic testing.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Treatment with the anti-fibrotic drug nintedanib reduced expression of ECM proteins and
        plasminogen activator inhibitor-1 (PAI-1), validating the system's utility for pharmacological
        testing.
      explanation: Supports the model as informative and drug-responsive for matrix deposition.

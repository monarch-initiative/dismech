    term:
      id: CL:0002553
      label: fibroblast of lung
  conditions:
  - cyclic mechanical stretch (breathing-mimetic)
  - static control
  - TGF-beta 1 stimulation
  - nintedanib treatment
  culture_system: Injection-moulded alveolar array chip with suspended collagen-elastin hydrogel membrane and cyclic actuation
  publication: PMID:41406599
  modeled_mechanisms:
  - target: Fibroblast activation and myofibroblast differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cyclic stretch applied together with TGF-beta 1 amplified fibrotic signalling well beyond TGF-beta
      1 alone. This makes breathing motion an explicit cofactor of fibroblast activation rather than background,
      which is the mechanistic claim a static culture cannot test.
    limitations: >-
      Amplification was demonstrated with exogenous TGF-beta 1 rather than with the endogenous injury
      signals of IPF, and the co-culture uses non-diseased alveolar epithelial cells and fibroblasts,
      so it models the mechanical contribution to fibrotic signalling rather than IPF-specific fibroblast
      biology such as the aberrant basaloid state.
    readouts:
    - name: Extracellular matrix gene expression under cyclic stretch with TGF-beta 1
      target: Fibroblast activation and myofibroblast differentiation
      direction: INCREASED
      interpretation: >-
        Collagen I, collagen III, and fibronectin induction is the activation readout, and its stretch-dependence
        is the finding.
      evidence:
      - reference: PMID:41406599
        reference_title: Microengineered alveolar array lung-on-chip with hydrogel membrane and simulated breathing mechanics for anti-fibrotic testing.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: We demonstrate that cyclic stretching significantly amplifies fibrotic signaling in the presence of transforming growth factor-beta 1 (TGF-β1), evidenced by increased expression of extracellular matrix (ECM) components such as collagen I, collagen III, and fibronectin.
        explanation: Reports the matrix-gene induction and its dependence on cyclic stretch.
    evidence:
    - reference: PMID:41406599
      reference_title: Microengineered alveolar array lung-on-chip with hydrogel membrane and simulated breathing mechanics for anti-fibrotic testing.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Human alveolar epithelial cells and lung fibroblasts are co-cultured on a membrane and subjected to cyclic biomechanical stress that mimics respiratory movements.
      explanation: Establishes the epithelial-fibroblast co-culture under breathing mechanics as the model configuration relevant to this node.
  - target: Excessive extracellular matrix deposition
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Matrix protein and PAI-1 expression rose under profibrotic stimulation and fell with nintedanib,
      an approved IPF antifibrotic, giving the model pharmacological validation against the standard of
      care for this node.
    limitations: >-
      Readouts are expression-level over days rather than accumulated cross-linked matrix, and nintedanib
      reversal establishes assay responsiveness rather than predictive value for novel compounds. The
      membrane is a defined collagen-elastin hydrogel, not fibrotic human lung matrix, so matrix-stiffness
      feedback is not reproduced.
    readouts:
    - name: ECM protein and PAI-1 expression under nintedanib
      target: Excessive extracellular matrix deposition
      direction: DECREASED
      interpretation: >-
        Reduction by an approved antifibrotic confirms the readout responds in the therapeutically expected
        direction.
      evidence:
      - reference: PMID:41406599
        reference_title: Microengineered alveolar array lung-on-chip with hydrogel membrane and simulated breathing mechanics for anti-fibrotic testing.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Treatment with the anti-fibrotic drug nintedanib reduced expression of ECM proteins and plasminogen activator inhibitor-1 (PAI-1), validating the system's utility for pharmacological testing.
        explanation: Directly reports the drug-responsive matrix readout.
    evidence:
    - reference: PMID:41406599
      reference_title: Microengineered alveolar array lung-on-chip with hydrogel membrane and simulated breathing mechanics for anti-fibrotic testing.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Treatment with the anti-fibrotic drug nintedanib reduced expression of ECM proteins and plasminogen activator inhibitor-1 (PAI-1), validating the system's utility for pharmacological testing.
      explanation: Supports the model as informative and drug-responsive for matrix deposition.
- name: Immune-cell-free AT2-lineage and fibroblast organoids
  experimental_model_type: ORGANOID
  description: >-
    Mouse and human lung-derived organoid co-cultures exposed to bleomycin isolate direct epithelial-fibroblast
    signaling. The assay tests an immune-cell-free route under defined conditions.
  cell_source: Mouse and human lung-derived epithelial cells and fibroblasts
  publication: PMID:37653024
  evidence:
  - reference: PMID:37653024
    reference_title: Autocrine TGF-β-positive feedback in profibrotic AT2-lineage cells plays a crucial role in non-inflammatory lung fibrogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we establish an organoid-based lung fibrosis model using mouse and human lung tissues to assess
      the direct communication between damaged alveolar type II (AT2)-lineage cells and lung fibroblasts
      by excluding immune cells.
    explanation: >-
      The co-culture removes immune cells to isolate epithelial-mesenchymal communication.
  modeled_mechanisms:
  - target: AT2 cell senescence and SASP
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Bleomycin-induced DNA damage activates p53 and a profibrotic secretory epithelial state.
    limitations: >-
      Organoids lack the immune, vascular and whole-organ context; experimental sufficiency does not establish
      in-vivo immune independence.
    evidence:
    - reference: PMID:37653024
      reference_title: "Autocrine TGF-β-positive feedback in profibrotic AT2-lineage cells plays a crucial role in non-inflammatory lung fibrogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        bleomycin causes DNA damage and activates p53 signaling in AT2-lineage cells, leading to AT2-to-AT1
        transition-like state with a senescence-associated secretory phenotype (SASP). Among SASP-related
        factors, TGF-β plays an exclusive role in promoting lung fibroblast-to-myofibroblast differentiation.
        Moreover, the autocrine TGF-β-positive feedback loop in AT2-lineage cells is a critical cellular
        system in non-inflammatory lung fibrogenesis.
      explanation: >-
        The immune-cell-free organoid experiment establishes epithelial-fibroblast sufficiency under bleomycin
        stimulation; accompanying mouse genetics do not imply immune independence of whole-animal disease.
    readouts:
    - name: p53-associated SASP and myofibroblast induction
      target: AT2 cell senescence and SASP
      direction: INCREASED
      interpretation: >-
        Bleomycin-induced DNA damage activates p53 and a profibrotic secretory epithelial state.
      evidence:
      - reference: PMID:37653024
        reference_title: "Autocrine TGF-β-positive feedback in profibrotic AT2-lineage cells plays a crucial role in non-inflammatory lung fibrogenesis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          bleomycin causes DNA damage and activates p53 signaling in AT2-lineage cells, leading to AT2-to-AT1
          transition-like state with a senescence-associated secretory phenotype (SASP). Among SASP-related
          factors, TGF-β plays an exclusive role in promoting lung fibroblast-to-myofibroblast differentiation.
          Moreover, the autocrine TGF-β-positive feedback loop in AT2-lineage cells is a critical cellular
          system in non-inflammatory lung fibrogenesis.
        explanation: >-
          The immune-cell-free organoid experiment establishes epithelial-fibroblast sufficiency under
          bleomycin
          stimulation; accompanying mouse genetics do not imply immune independence of whole-animal disease.
notes: >-
  The pathograph combines human associations with explicitly identified experimental mechanisms. Neither
  an obligatory exogenous second hit nor universal immune-cell dependence is established. Short leukocyte
  telomere length is an enrichment feature, not a validated boundary excluding senescence mechanisms in
  other patients. The OpenScientist report has an independent claim-level assessment. The full GeneReviews
  Pulmonary Fibrosis Predisposition Overview, revised 2025-12-04, was reviewed across clinical features,
  differential diagnosis, genetic evaluation, management, surveillance and counseling; direct chapter
  evidence is cited through its fetched Bookshelf URL. Its broader familial pulmonary fibrosis scope is
  not equated with IPF.
histopathology:
- name: Usual interstitial pneumonia pattern
  description: >-
    Patchy interstitial fibrosis with temporal and spatial heterogeneity, fibroblast foci and honeycomb
    remodeling, most marked subpleurally and paraseptally. UIP must be interpreted with clinical and radiologic
    findings because it is not specific to IPF.
  finding_term:
    preferred_term: Usual interstitial pneumonia fibrosis
    term:
      id: NCIT:C3044
      label: Fibrosis
  diagnostic: true
  evidence:
  - reference: PMID:21471066
    reference_title: 'An official ATS/ERS/JRS/ALAT statement: idiopathic pulmonary fibrosis: evidence-based guidelines for diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The histopathologic hallmark and chief diagnostic criterion is a heterogeneous appearance at low
      magnification in which areas of fibrosis with scarring and honeycomb change alternate with areas
      of less affected or normal parenchyma
    explanation: >-
      The statement describes the heterogeneous UIP pattern.
  - reference: PMID:21471066
    reference_title: 'An official ATS/ERS/JRS/ALAT statement: idiopathic pulmonary fibrosis: evidence-based guidelines for diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The fibrotic zones are composed mainly of dense collagen, although scattered convex subepithelial
      foci of proliferating fibroblasts and myofibroblasts (so-called fibroblast foci) are a consistent
      finding.
    explanation: >-
      Fibroblast foci connect the morphology to matrix-producing mesenchymal cells.
  notes: >-
    Highly characteristic in the proper diagnostic setting, not pathognomonic in isolation.
differential_diagnoses:
- name: Connective tissue disease-associated ILD
  description: >-
    Can produce fibrotic interstitial lung disease with an overlapping UIP pattern.
  distinguishing_features:
  - >-
    Assess systemic rheumatic manifestations and serology in the clinical context.
  evidence:
  - reference: PMID:21471066
    reference_title: 'An official ATS/ERS/JRS/ALAT statement: idiopathic pulmonary fibrosis: evidence-based guidelines for diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The major differential diagnostic considerations include UIP in other clinical settings such as
      connective tissue diseases, chronic hypersensitivity pneumonitis (extrinsic allergic alveolitis),
      and pneumoconioses (especially asbestosis).
    explanation: >-
      The source identifies major alternative causes of a UIP pattern.

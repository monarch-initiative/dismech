  evidence:
  - reference: PMID:42294946
    reference_title: >-
      Potential Roles of Gut Microbiome and Metabolomes in Interstitial Lung Disease: Evidence across
      Preclinical and Clinical Research.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Accumulating evidence supports bidirectional gut-lung axis interactions potentially mediated by
      the microbiota. Alterations in the gut microbiome have been associated with the onset and severity
      of interstitial lung disease.
    explanation: >-
      Review-level evidence summarizes clinical associations and preclinical gut-lung mechanisms; it does
      not establish the specified causal sequence or direction in human IPF.
  - reference: PMID:42294946
    reference_title: >-
      Potential Roles of Gut Microbiome and Metabolomes in Interstitial Lung Disease: Evidence across
      Preclinical and Clinical Research.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Preclinical studies demonstrate that gut dysbiosis is associated with altered immune responses,
      increased pro-inflammatory cytokines, and enhanced fibrotic pathways, with mechanistic evidence
      suggesting the involvement of specific microbial metabolites (short-chain fatty acids, bile acids,
      and immune mediators.
    explanation: >-
      Review-level evidence summarizes clinical associations and preclinical gut-lung mechanisms; it does
      not establish the specified causal sequence or direction in human IPF.
  notes: >-
    Retained as an emerging associated modifier without directed downstream edges because the reviewed
    clinical evidence does not resolve causal direction or specific intermediates.

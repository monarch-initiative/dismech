- name: AT2-specific Sin3a conditional loss
  species: Mus musculus
  genotype: Conditional Sin3a loss in adult Sftpc-expressing AT2 cells
  description: >-
    Induced p53-dependent AT2 senescence produces progressive fibrosis; comparison with conditional AT2
    ablation distinguishes senescence from simple cell loss.
  publication: PMID:32991815
  evidence:
  - reference: PMID:32991815
    reference_title: Senescence of Alveolar Type 2 Cells Drives Progressive Pulmonary Fibrosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We used conditional loss of Sin3a in adult mouse AT2 cells to initiate a program of p53-dependent
      cellular senescence, AT2 cell depletion, and spontaneous, progressive pulmonary fibrosis.
    explanation: >-
      An AT2-directed genetic perturbation produces spontaneous progressive fibrosis without bleomycin;
      it does not establish immune independence or the initiating lesion in all human IPF.
  notes: >-
    Erratum PMID:34256008 corrects figure alignment, panel labels and the comparator mouse line to RosaDTA;
    it does not withdraw the spontaneous-fibrosis result.
  modeled_mechanisms:
  - target: AT2 cell senescence and SASP
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Conditional Sin3a loss induces p53-dependent senescence, AT2 depletion and spontaneous fibrosis.
    limitations: >-

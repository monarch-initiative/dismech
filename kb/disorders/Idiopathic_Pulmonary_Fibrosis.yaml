inheritance:
- name: Autosomal dominant predisposition in a molecularly defined subset
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Some familial cases have heterozygous pathogenic variants with age-dependent incomplete penetrance
    and variable ILD phenotype. Most IPF does not follow a single Mendelian pattern. Short telomeres can
    also be inherited without the familial variant, complicating recurrence prediction.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1230/
    reference_title: Pulmonary Fibrosis Predisposition Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with a ... associated with predisposition to pulmonary fibrosis has
      a 50% chance of inheriting the pathogenic variant.
    explanation: >-
      The recurrence statement applies to autosomal dominant monogenic predisposition, not every sporadic
      IPF case; inheritance of a variant does not predict age of onset or guarantee disease.

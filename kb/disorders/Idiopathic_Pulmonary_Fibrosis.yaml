    modifier: DECREASED
  evidence:
  - reference: PMID:18753630
    reference_title: "Short telomeres are a risk factor for idiopathic pulmonary fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Short telomeres limit tissue renewal capacity in the lung and germ-line mutations in telomerase
      components, hTERT and hTR, underlie inheritance in a subset of families with IPF.
    explanation: >-
      Establishes that short telomeres limit lung tissue-renewal capacity, supporting exhaustion of the
      alveolar type II progenitor pool. Evidence source is HUMAN_CLINICAL (patient telomere-length study).
  - reference: PMID:32991815
    reference_title: Senescence of Alveolar Type 2 Cells Drives Progressive Pulmonary Fibrosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We establish that senescence rather than loss of AT2 cells promotes progressive fibrosis and show
      that either genetic or pharmacologic interventions targeting p53 activation or senescence block
      fibrogenesis.
    explanation: >-
      Senescence-associated dysfunction cannot be reduced to simple progenitor depletion.
  downstream:
  - target: Architectural distortion and gas-exchange failure
    description: >-
      Persistent failure of epithelial restoration contributes to progressive remodeling; simple cell
      ablation alone need not cause progressive fibrosis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:

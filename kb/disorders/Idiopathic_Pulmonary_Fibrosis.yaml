- name: Hypoxic pulmonary vasoconstriction and vascular remodeling
  description: >-
    Disturbed ventilation-perfusion and alveolar hypoxia can provoke pulmonary vasoconstriction. Persistent
    vasoconstriction and vascular remodeling contribute to pulmonary hypertension, alongside cytokine
    and growth-factor effects. Pulmonary hypertension severity is not determined solely by the extent
    of fibrosis.

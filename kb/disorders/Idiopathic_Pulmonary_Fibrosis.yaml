  - reference: PMID:17392301
    reference_title: Telomerase mutations in families with idiopathic pulmonary fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six probands (8%) had heterozygous mutations in hTERT or hTR; mutant telomerase resulted in short
      telomeres.
    explanation: >-
      The familial cohort demonstrates pathogenic telomerase variants and short telomeres. Unaffected
      carriers also had short telomeres, showing incomplete disease penetrance.
  - reference: PMID:27699234
    reference_title: Telomere dysfunction in alveolar epithelial cells causes lung remodeling and fibrosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results demonstrate that prolonged telomere dysfunction in type II AECs, but not collagen-expressing
      cells, leads to age-dependent lung remodeling and fibrosis.
    explanation: >-
      Conditional TRF1 deletion causes spontaneous fibrosis after prolonged epithelial telomere dysfunction;
      this severe uncapping model is distinct from ordinary age-related shortening.
  - reference: PMID:25848748
    reference_title: Exome sequencing links mutations in PARN and RTEL1 with familial pulmonary fibrosis and telomere shortening.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PARN and RTEL1 mutation carriers had shortened leukocyte telomere lengths, and we observed epigenetic
      inheritance of short telomeres in family members.
    explanation: >-
      Human pedigrees link rare variants to telomere dysfunction and familial pulmonary fibrosis.
  downstream:

    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37653024
      reference_title: "Autocrine TGF-β-positive feedback in profibrotic AT2-lineage cells plays a crucial role in non-inflammatory lung fibrogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        bleomycin causes DNA damage and activates p53 signaling in AT2-lineage cells, leading to AT2-to-AT1
        transition-like state with a senescence-associated secretory phenotype (SASP). Among SASP-related
        factors, TGF-β plays an exclusive role in promoting lung fibroblast-to-myofibroblast differentiation.
        Moreover, the autocrine TGF-β-positive feedback loop in AT2-lineage cells is a critical cellular
        system in non-inflammatory lung fibrogenesis.
      explanation: >-
        The immune-cell-free organoid experiment establishes epithelial-fibroblast sufficiency under bleomycin
        stimulation; accompanying mouse genetics do not imply immune independence of whole-animal disease.
  - target: Profibrotic macrophage recruitment and amplification
    description: >-
      Injured epithelium produces CCR2 ligands that promote exudate macrophage recruitment in a mouse
      injury model.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31922885
      reference_title: Diverse Injury Pathways Induce Alveolar Epithelial Cell CCL2/12, Which Promotes Lung Fibrosis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast, mice with lung epithelial cell-specific deletion of CCL12 were protected from bleomycin-induced
        fibrosis and had expression of CCL2 and CCL7 similar to that of control mice treated with bleomycin.
        Deletion of CCL12 within AECs led to decreased recruitment of exudate macrophages.
      explanation: >-
        Epithelial CCL12 contributes to macrophage recruitment in this mouse injury model; global CCL12
        deletion was not protective and this is not universal immune necessity.
  - target: Self-DNA sensing through epithelial cGAS
    description: >-
      DNA-damaging epithelial stress increases mitochondrial DNA in cytosolic and extracellular compartments
      in primary cultures.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34524912
      reference_title: 'A cGAS-dependent response links DNA damage and senescence in alveolar epithelial cells: a potential drug target in IPF.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Higher levels of mtDNA were detected in the cytosol and culture supernatants of primary IPF- and
        etoposide-treated Ctrl-AECs when compared with Ctrl-AECs at baseline.
      explanation: >-
        The cultured-cell compartment measurements support self-DNA exposure after damage, not universal
        cGAS/STING dependence.
- name: AT2 cell senescence and SASP
  description: >-
    AT2-lineage cells can enter a stress-associated senescent state with reduced regenerative capacity
    and a secretory program that activates fibroblasts. DNA damage, telomere dysfunction, chronic Wnt
    signaling and metabolic stress are candidate upstream routes. Bleomycin-treated epithelial-fibroblast
    organoids show autocrine TGF-beta feedback and paracrine myofibroblast induction without immune cells.
    In vivo models establish senescence as a possible proximal driver, while the contribution of immune
    recruitment varies by model and cannot be declared universally necessary or dispensable.
  conforms_to: "cellular_senescence#Senescent Cell Accumulation"

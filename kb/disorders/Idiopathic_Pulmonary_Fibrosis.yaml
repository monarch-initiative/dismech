- accession: ega:EGAS00001005794
  title: Profibrotic priming of airway cell types in idiopathic pulmonary fibrosis and drug inhibition in single-cell resolution
  description: The cause and etiology of idiopathic pulmonary fibrosis, a severe chronic lung disorder with limited treatment options, is still poorly understood. Early genetic studies hinted that airway epithelial cells play an important role in the development of IPF while more recent single-cell RNA sequencing atlases from explant IPF lungs have focused on macrophages. In this study, we used air-liquid interface cultures of primary cells taken from the subsegmental bronchi of IPF patients, reflecting early-stage fibrosis, to interrogate the single-cell transcriptional landscape of the airway mucosa. We identified IPF-enriched cell-cell interaction pathways.

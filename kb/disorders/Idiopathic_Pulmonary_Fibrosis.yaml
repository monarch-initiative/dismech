- name: Microengineered alveolar array lung-on-chip with breathing mechanics
  description: >-
    An array of geometrically defined alveolar units suspended on a thin collagen-elastin hydrogel membrane
    engineered to match the dimensions and mechanical fragility of the native alveolar basement membrane,
    with human alveolar epithelial cells and lung fibroblasts co-cultured across it and subjected to controlled
    cyclic deflection emulating breathing. Precision injection moulding and an SBS microwell format make
    it medium-throughput, which is what allows drug testing rather than single-device demonstration.

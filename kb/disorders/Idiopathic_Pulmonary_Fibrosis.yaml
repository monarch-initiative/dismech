- name: AT2-specific TERT conditional deletion with bleomycin
  species: Mus musculus
  genotype: SPC-Tert conditional knockout
  description: >-
    TERT deletion alone did not cause fibrosis over 9 months, but increased injury-associated senescence
    and fibrosis after bleomycin without a significant effect on measured AT2 telomere length.
  publication: PMID:31000627
  evidence:
  - reference: PMID:31000627
    reference_title: Telomerase reverse transcriptase ameliorates lung fibrosis by protecting alveolar epithelial cells against senescence.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, upon bleomycin treatment, they exhibited enhanced lung injury, inflammation, and fibrosis
      compared with control mice, accompanied by increased pro-fibrogenic cytokine expression but without
      a significant effect on AECII telomere length.
    explanation: >-
      TERT loss amplifies injury-associated fibrosis without measurable telomere shortening in this model.
  modeled_mechanisms:
  - target: AT2 cell senescence and SASP
    relationship: PERTURBS

diagnosis:
- name: Lung biopsy for histopathologic pattern
  description: >-
    Tissue sampling is considered when clinical and imaging assessment cannot establish a sufficiently
    confident diagnosis and procedural risk is acceptable. Transbronchial cryobiopsy is a conditional
    alternative to surgical biopsy in centers with appropriate expertise; biopsy is not mandatory for
    every patient without definite HRCT honeycombing.
  diagnosis_term:
    preferred_term: biopsy of lung
    term:
      id: NCIT:C51748
      label: Lung Biopsy
  results: Histopathologic pattern used to establish or exclude usual interstitial pneumonia.
  evidence:
  - reference: PMID:35486072
    reference_title: "Idiopathic Pulmonary Fibrosis (an Update) and Progressive Pulmonary Fibrosis in Adults: An Official ATS/ERS/JRS/ALAT Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A conditional recommendation was made to regard transbronchial lung cryobiopsy as an acceptable alternative to surgical lung biopsy in centers with appropriate expertise."
    explanation: The ATS/ERS/JRS/ALAT guideline conditionally recommends transbronchial lung cryobiopsy as an acceptable alternative to surgical lung biopsy where expertise exists.

- name: High-resolution chest CT
  diagnosis_term:
    preferred_term: High Resolution Computed Tomography
    term:
      id: NCIT:C20644
      label: High Resolution Computed Tomography
  description: >-
    Evaluate subpleural and basal reticulation, traction bronchiectasis and honeycombing, together with
    features suggesting an alternative diagnosis. Integrate the imaging pattern with clinical context.
  evidence:
  - reference: PMID:21471066
    reference_title: 'An official ATS/ERS/JRS/ALAT statement: idiopathic pulmonary fibrosis: evidence-based guidelines for diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      UIP is characterized on HRCT by the presence of reticular opacities, often associated with traction
      bronchiectasis
    explanation: >-
      The guideline describes a key radiologic UIP pattern.
- name: Multidisciplinary diagnosis and exclusion of other ILD causes
  description: >-
    Integrate symptoms, exposure and medication history, connective-tissue-disease evaluation, HRCT and
    pathology when available. A UIP pattern alone is not sufficient to identify an idiopathic cause.
  evidence:
  - reference: PMID:21471066
    reference_title: 'An official ATS/ERS/JRS/ALAT statement: idiopathic pulmonary fibrosis: evidence-based guidelines for diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Exclusion of other known causes of ILD (e.g., domestic and occupational environmental exposures,
      connective tissue disease, and drug toxicity).
    explanation: >-
      Alternative etiologies must be excluded before assigning IPF.
  - reference: PMID:21471066
    reference_title: 'An official ATS/ERS/JRS/ALAT statement: idiopathic pulmonary fibrosis: evidence-based guidelines for diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thus, the accuracy of diagnosis of IPF increases with clinical, radiologic, and histopathologic
      correlation and can be accomplished with a multidisciplinary discussion among experienced clinical
      experts in the field of ILDs
    explanation: >-
      Multidisciplinary integration supports diagnostic accuracy.
- name: Pulmonary function and oxygenation assessment
  diagnosis_term:
    preferred_term: Pulmonary Function Test
    term:
      id: NCIT:C38081
      label: Pulmonary Function Test
  description: >-
    Assess FVC, diffusion capacity and oxygenation at rest and exertion to characterize impairment and
    follow progression. These measurements do not identify the etiology of fibrosis by themselves.
  evidence:
  - reference: PMID:24836310
    reference_title: "Efficacy and safety of nintedanib in idiopathic pulmonary fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary end point was the annual rate of decline in forced vital capacity (FVC).
    explanation: >-
      The pivotal IPF nintedanib trials used annual FVC decline as the primary physiologic endpoint.
  - reference: PMID:21471066
    reference_title: 'An official ATS/ERS/JRS/ALAT statement: idiopathic pulmonary fibrosis: evidence-based guidelines for diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The recommendation for long-term oxygen therapy in patients with IPF and clinically significant
      resting hypoxemia is strong
    explanation: >-
      The guideline recognizes clinically significant hypoxemia and its treatment.
- name: Genetic and telomere evaluation in at-risk patients
  description: >-
    Family history, young onset, premature graying, cytopenias or liver disease can suggest inherited
    fibrosis or a telomere biology disorder. Consider specialist genetic evaluation and telomere testing
    in the appropriate context; blood telomere length is not a direct AT2 senescence measurement or a
    stand-alone IPF diagnosis.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1230/
    reference_title: Pulmonary Fibrosis Predisposition Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Telomere length measurement should be offered to individuals with pulmonary fibrosis and extrapulmonary
      manifestations of a short telomere syndrome
    explanation: >-
      The chapter recommends targeted telomere assessment in patients with syndromic clues; this does
      not require universal testing or establish IPF solely from a short result.
treatments:
- name: Pirfenidone
  description: >-
    Oral antifibrotic therapy that slows clinical progression and FVC decline. It is not established to
    reverse existing scarring. Gastrointestinal and skin adverse effects and liver monitoring affect use.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: pirfenidone
      term:
        id: CHEBI:32016
        label: pirfenidone
  evidence:
  - reference: PMID:24836312
    reference_title: "A phase 3 trial of pirfenidone in patients with idiopathic pulmonary fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pirfenidone, as compared with placebo, reduced disease progression, as reflected by lung function,
      exercise tolerance, and progression-free survival, in patients with idiopathic pulmonary fibrosis.
    explanation: The ASCEND phase 3 trial shows pirfenidone slows clinical progression in IPF.
  target_mechanisms:
  - target: Fibroblast activation and myofibroblast differentiation
    treatment_effect: INHIBITS
    description: >-
      Attenuates TGF-beta-stimulated fibroblast activation in culture; clinical slowing of progression
      is independently supported by ASCEND.
    evidence:
    - reference: PMID:24613900
      reference_title: Effect of pirfenidone on proliferation, TGF-β-induced myofibroblast differentiation and fibrogenic activity of primary human lung fibroblasts.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Pirfenidone reduced fibroblast proliferation and attenuated TGF-β-induced α-smooth muscle actin
        (SMA) and pro-collagen (Col)-I mRNA and protein levels.
      explanation: >-
        Primary human lung fibroblast experiments support an antifibrotic cellular effect; the direct
        molecular target and mediation of human benefit are not established.
- name: Nintedanib
  description: Antifibrotic tyrosine kinase inhibitor that slows the rate of forced vital capacity decline in IPF.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: nintedanib
      term:
        id: CHEBI:85164
        label: nintedanib
  evidence:
  - reference: PMID:24836310
    reference_title: "Efficacy and safety of nintedanib in idiopathic pulmonary fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with idiopathic pulmonary fibrosis, nintedanib reduced the decline in FVC, which is
      consistent with a slowing of disease progression
    explanation: The INPULSIS phase 3 trials show nintedanib slows lung function decline in IPF.
  target_mechanisms:
  - target: Fibroblast activation and myofibroblast differentiation
    treatment_effect: INHIBITS
    description: >-
      Inhibits multiple receptor tyrosine kinases and fibroblast responses; slowing FVC decline does not
      isolate a single causal kinase pathway.
    evidence:
    - reference: PMID:25745043
      reference_title: Mode of action of nintedanib in the treatment of idiopathic pulmonary fibrosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Data from in vitro studies have shown that nintedanib interferes with processes active in fibrosis
        such as fibroblast proliferation, migration and differentiation, and the secretion of ECM.
      explanation: >-
        The pharmacology review summarizes cellular mechanism evidence separately from randomized clinical
        efficacy.
- name: Dasatinib and Quercetin (Senolytic Combination)
  description: >-
    Investigational senolytic combination. An uncontrolled 14-participant study suggested physical-function
    changes without improved pulmonary function. A 12-participant randomized pilot demonstrated feasibility,
    with more nonserious adverse events on D+Q and no meaningful between-group functional difference.
    Neither study establishes antifibrotic efficacy or IPF-lung senescent-cell target engagement.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dasatinib
      term:
        id: CHEBI:49375
        label: dasatinib (anhydrous)
    - preferred_term: quercetin
      term:
        id: CHEBI:16243
        label: quercetin
  evidence:
  - reference: PMID:36857968
    reference_title: 'Senolytics dasatinib and quercetin in idiopathic pulmonary fibrosis: results of a phase I, single-blind, single-center, randomized, placebo-controlled pilot trial on feasibility and tolerability.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Frailty, pulmonary, or physical function were explored before and after intermittent D + Q; though
      under-powered to evaluate change, these measures do not appear to differ meaningfully between groups.
    explanation: >-
      The randomized pilot supports feasibility, not clinical efficacy.
  - reference: PMID:36857968
    reference_title: 'Senolytics dasatinib and quercetin in idiopathic pulmonary fibrosis: results of a phase I, single-blind, single-center, randomized, placebo-controlled pilot trial on feasibility and tolerability.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sleep disturbances and anxiety were disproportionately represented in the D + Q arm (4/6 vs 0/6).
    explanation: >-
      Adverse-event imbalance prevents an unqualified tolerability claim.
  target_mechanisms:
  - target: Senescent myofibroblast persistence and apoptosis resistance
    treatment_effect: INHIBITS
    description: >-
      Targets senescent fibroblast survival in vitro; efficacy in patients remains investigational.
    evidence:
    - reference: PMID:28230051
      reference_title: Cellular senescence mediates fibrotic pulmonary disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show that the secretome of senescent fibroblasts, which are selectively killed by a senolytic
        cocktail, dasatinib plus quercetin (DQ), is fibrogenic.
      explanation: >-
        Senolysis and a profibrotic secretome are demonstrated in fibroblasts; human IPF-lung target engagement
        remains unproven.
- name: Nerandomilast
  description: >-
    Oral preferential PDE4B inhibitor approved for adult IPF. The phase III FIBRONEER-IPF trial showed
    less FVC decline at 52 weeks, with most participants receiving background nintedanib or pirfenidone.
    Diarrhea was common. Longer follow-up did not establish a reduction in the composite of acute exacerbation,
    respiratory hospitalization or death, so survival benefit is not asserted.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Nerandomilast
      term:
        id: NCIT:C203229
        label: Nerandomilast
  evidence:
  - reference: PMID:40387033
    reference_title: Nerandomilast in Patients with Idiopathic Pulmonary Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with idiopathic pulmonary fibrosis, treatment with nerandomilast resulted in a smaller
      decline in the FVC than placebo over a period of 52 weeks.
    explanation: >-
      FIBRONEER-IPF randomized 1177 participants, most on background antifibrotics; the endpoint supports
      slowing decline rather than reversal.
  - reference: PMID:41738262
    reference_title: 'Nerandomilast in idiopathic pulmonary fibrosis: data from the whole follow-up period of the FIBRONEER-IPF trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      nerandomilast had no effect on the composite endpoint of time to first acute exacerbation of IPF,
      hospitalization for respiratory cause, or death
    explanation: >-
      The final follow-up did not show benefit on this composite clinical endpoint.
  target_mechanisms:
  - target: Fibroblast activation and myofibroblast differentiation
    treatment_effect: INHIBITS
    description: >-
      Preferential PDE4B inhibition suppresses myofibroblast transformation and proliferation in primary
      IPF fibroblast cultures.
    evidence:
    - reference: PMID:35517783
      reference_title: BI 1015550 is a PDE4B Inhibitor and a Clinical Drug Candidate for the Oral Treatment of Idiopathic Pulmonary Fibrosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        BI 1015550 inhibited transforming growth factor-β-stimulated myofibroblast transformation and
        the mRNA expression of various extracellular matrix proteins, as well as basic fibroblast growth
        factor plus interleukin-1β-induced cell proliferation.
      explanation: >-
        Primary IPF fibroblast experiments support antiproliferative and differentiation effects; the
        2023 corrigendum corrects Table 1 sample sizes without changing this conclusion.
- name: Supplemental oxygen
  description: >-
    Corrects clinically significant hypoxemia without reversing fibrosis.
  treatment_term:
    preferred_term: Oxygen Therapy
    term:
      id: NCIT:C94624

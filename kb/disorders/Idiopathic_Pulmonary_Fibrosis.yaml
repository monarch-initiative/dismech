clinical_trials:
- name: NCT05321069
  phase: PHASE_III
  status: COMPLETED
  description: >-
    FIBRONEER-IPF evaluated two nerandomilast doses versus placebo, including patients on background antifibrotics.
    The published primary endpoint was FVC change at 52 weeks.
  notes: >-
    Registry checked 2026-09-04: 1177 actual participants; completion 2024-12-17. Outcome evidence is
    in the nerandomilast treatment record.
  evidence:
  - reference: clinicaltrials:NCT05321069
    reference_title: A Double Blind, Randomized, Placebo-controlled Trial Evaluating the Efficacy and Safety of BI 1015550 Over at Least 52 Weeks in Patients With Idiopathic Pulmonary Fibrosis (IPF)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If they already take nintedanib or pirfenidone for their IPF, they can continue treatment throughout
      the study.
    explanation: >-
      The registry documents allowed background therapy.
- name: NCT02874989
  phase: PHASE_I
  status: COMPLETED
  description: >-
    Senolytic D+Q pilot program comprising open-label and randomized components, with 26 actual participants
    in the registry. Published components involved 14 open-label and 12 randomized participants.
  notes: >-
    Registry checked 2026-09-04: completion 2019-06-03. The archived official title says open label, while
    the design module also records a randomized participant-masked component. Published efficacy remains
    inconclusive.
  evidence:
  - reference: clinicaltrials:NCT02874989
    reference_title: 'Targeted Removal of Pro-Inflammatory Cells: An Open Label Human Pilot Study in Idiopathic Pulmonary Fibrosis'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study team hypothesizes that intermittent (3 doses administered over 3 consecutive days in 3
      consecutive weeks) oral administration of combination Dasatinib (100 mg/d) + Quercetin (1250 mg/d)
      will be safe and well tolerated in patients with IPF.
    explanation: >-
      Registry text describes the hypothesis and schedule, not a demonstrated safety or efficacy result.

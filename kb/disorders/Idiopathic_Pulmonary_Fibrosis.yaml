      Moreover, the autocrine TGF-β-positive feedback loop in AT2-lineage cells is a critical cellular
      system in non-inflammatory lung fibrogenesis.
    explanation: >-
      The immune-cell-free organoid experiment establishes epithelial-fibroblast sufficiency under bleomycin
      stimulation; accompanying mouse genetics do not imply immune independence of whole-animal disease.
  - reference: PMID:34813355
    reference_title: "Pathogenic Mechanisms Underlying Idiopathic Pulmonary Fibrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recurrent alveolar epithelial cell (AEC) injury may occur in the context of predisposing factors
      (e.g., genetic, environmental, epigenetic, immunologic, and gerontologic), leading to metabolic
      dysfunction, senescence, aberrant epithelial cell activation, and dysregulated epithelial repair.
    explanation: >-
      Annual Review of Pathology 2022 review places AT2 senescence as a consequence of recurrent injury
      that bridges injury to downstream fibrotic mechanisms.
  - reference: PMID:32991815
    reference_title: Senescence of Alveolar Type 2 Cells Drives Progressive Pulmonary Fibrosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We used conditional loss of Sin3a in adult mouse AT2 cells to initiate a program of p53-dependent
      cellular senescence, AT2 cell depletion, and spontaneous, progressive pulmonary fibrosis.
    explanation: >-
      An AT2-directed genetic perturbation produces spontaneous progressive fibrosis without bleomycin;
      it does not establish immune independence or the initiating lesion in all human IPF.

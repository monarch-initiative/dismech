- accession: massive:MSV000093453
  title: O-GlcNAc Containing Proteins in Normal and Idiopathic Pulmonary Fibrosis Human Fibroblasts
  description: 'Isolated normal and IPF fibroblasts were homogenized in cold MilliQ water using a bullet blender. Samples were centrifuged and inhibitors were added: HALT (Thermo Fisher Scientific), Z-Pugnac (Tocris), Thiamet G (Cayman Chemicals), and benzonase (E1014, Millipore, Sigma). O-GlcNAc enzymatic labeling and protein capturing was performed as described using a Click-IT enrichment kit following the manufacturer''s protocol (cat no: C33368, C33372, and C10416; Thermo Fisher Scientific).'

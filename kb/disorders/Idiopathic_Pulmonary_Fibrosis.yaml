- name: Age-associated endothelial repair failure
  description: >-
    Endothelial ERG dysregulation and capillary cell-state changes accompany aging and fibrotic repair.
    Conditional endothelial ERG loss impairs fibrosis resolution in mice and enhances paracrine fibroblast
    activation in culture. Human transcriptional overlap supports relevance but does not establish an
    independent initiating vascular lesion in all IPF.

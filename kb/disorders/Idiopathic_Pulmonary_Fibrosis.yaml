- name: AT2 progenitor exhaustion and impaired alveolar regeneration
  conforms_to: "stem_cell_exhaustion#Decline in Stem Cell Self-Renewal and Function"
  description: >-
    AT2 cells normally regenerate the alveolar epithelium. Senescence and telomere dysfunction impair
    renewal and can deplete functional progenitors. Cell loss and a persistent senescent secretory state
    are distinct mechanisms: the Sin3a model distinguishes progressive senescence-associated fibrosis
    from transient remodeling after AT2 ablation.
  role: effector
  cell_types:

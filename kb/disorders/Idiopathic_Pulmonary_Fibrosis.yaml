    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:42182417
      reference_title: Chronic TGFβ1 Signaling Drives Aberrant Alveolar-Basaloid Metaplasia through a KRT17-Stratifin migratory complex.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Using integrated single nucleus ATAC- and RNA-sequencing on human lungs and an in vitro model
        of dysplastic repair, we identify two distinct regenerative trajectories for alveolar type 2 (AT2)
        cells: a resolvable euplastic repair trajectory and a persistent, non-resolving dysplastic repair
        trajectory. The latter is governed by a spatially restricted ITGB6/TGFβ1/SMAD3 signaling axis
        in fibrotic regions of IPF lungs and in murine lungs characterized by chronic epithelial remodeling.
      explanation: >-
        Integrated human data and experimental dysplastic-repair models identify TGF-beta/SMAD3 regulation;
        human observational evidence alone does not establish temporal initiation.
- name: Senescent myofibroblast persistence and apoptosis resistance
  description: >-
    Aging-associated myofibroblasts can fail to dedifferentiate and become resistant to apoptosis. NOX4/NRF2
    redox imbalance, sustained MyoD and BCL-2-dependent survival support persistence in experimental systems.
    Human IPF fibroblasts share aspects of these states. Senescence therefore contributes through mesenchymal
    persistence as well as epithelial dysfunction.
  role: amplifier
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:41764163
    reference_title: Conditional BCL-2 Expression in Fibroblasts Promotes Persistent Pulmonary Fibrosis which is Reversible by Therapeutic BCL-2 Inhibition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that prevention of PDGFRα+ fibroblast apoptosis by conditional BCL-2 expression leads
      to the emergence and persistence of senescent, pro-fibrotic fibroblasts along with enduring, pathologic
      fibrotic lung remodeling.
    explanation: >-
      Conditional anti-apoptotic signaling demonstrates a fibroblast persistence route in mice, not universal
      BCL-2 dependence in humans.
  - reference: PMID:31962055
    reference_title: Impaired Myofibroblast Dedifferentiation Contributes to Nonresolving Fibrosis in Aging.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrated that nonsenescent lung myofibroblasts maintained the capacity for dedifferentiation,
      whereas senescent/IPF myofibroblasts exhibited an impaired capacity for dedifferentiation.
    explanation: >-
      Cultured IPF fibroblasts show impaired fate reversal.
  - reference: PMID:24718857
    reference_title: Reversal of persistent fibrosis in aging by targeting Nox4-Nrf2 redox imbalance.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Nox4 mediated senescence and apoptosis resistance in IPF fibroblasts.
    explanation: >-
      Experimental fibroblast perturbations support redox-dependent persistence.

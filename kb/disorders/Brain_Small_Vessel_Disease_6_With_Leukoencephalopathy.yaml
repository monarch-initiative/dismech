- name: Endothelin-1 Mediated Extracerebral Muscle and Fat Loss
  description: >-
    Patients have smaller extraocular rectus muscles and less intraorbital
    fat than controls, and many report muscle cramps. The authors of the
    largest cohort propose that endothelin-1, which impairs muscle
    myogenesis and causes atrophy in mice and stimulates adipocyte
    lipolysis, links these features. No study has tested this in CARASAL.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  evidence:
  - reference: PMID:41908989
    reference_title: "Expanding the Clinicoradiologic Phenotype of the CTSA-Associated Small Vessel Disease CARASAL: A Comparison With CADASIL."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The decrease in both EOR muscle volume and IO fat volume we found in patients with CARASAL, and the fact that some patients had severe muscle cramps in the extremities, may point toward an ET-1–mediated pathway of some of the CARASAL-associated extracerebral symptoms."
    explanation: The authors' hypothesis linking the muscle and fat findings to endothelin-1.
  - reference: PMID:41908989
    reference_title: "Expanding the Clinicoradiologic Phenotype of the CTSA-Associated Small Vessel Disease CARASAL: A Comparison With CADASIL."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Interestingly, ET-1 is also implicated in the regulation of skeletal muscle blood flow36 and was previously shown to impair skeletal muscle myogenesis and induce muscle atrophy in mice,37 with increasing circulating levels of ET-1 being associated with muscular fibrosis."
    explanation: Prior mouse work cited by the authors on endothelin-1 effects on skeletal muscle.
  downstream:
  - target: Muscle cramps
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Enophthalmos
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Cerebral Small Vessel Arteriopathy
  description: >-
    A primary microangiopathy with severe arteriolosclerosis of small
    arteries, with ischemic infarcts (cortical and subcortical), relatively
    few lacunes and microbleeds, and intracerebral hemorrhage. Hypertension
    probably adds to the hemorrhage and infarct risk.
  biological_scale: TISSUE

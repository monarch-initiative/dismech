classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >-
  MONDO merged its earlier CARASAL term, MONDO:0035551, into MONDO:0980711
  (release 2026-10-06), which is bound here; OMIM lists the disease as
  621394. No GeneReviews chapter covers CARASAL. All patients described so far carry
  the same variant, and most come from one extended Dutch founder pedigree,
  so some features may be specific to that family. The endothelin-1
  mechanism comes from autopsy staining in the founding families and from
  mouse data on endothelin-1 degradation; the direct effect of the variant on
  cathepsin A activity and on endothelin-1 levels in patients has not been
  measured, so the downstream mechanism nodes are marked PROVISIONAL.
  The muscle cramps and enophthalmos are linked to a PROVISIONAL
  endothelin-1 node because the cohort authors propose that pathway; it has
  not been tested in CARASAL. No mechanism has been proposed for the sicca
  symptoms, depression or migraine with aura, so these phenotypes are not
  linked to a mechanism node. The brainstem features (dysphagia,
  vertigo, hearing loss, REM sleep behavior disorder) are linked to the
  leukoencephalopathy because pontine white matter disease is constant, as
  proposed in the brainstem case report. Previously reported renal failure
  and myocardial infarction are thought to
  be secondary to hypertension and are not annotated. No disease-specific
  treatment exists; management is standard stroke and blood pressure care.
  Endothelin receptor antagonists are not recorded as a treatment because
  none has been tested in CARASAL.

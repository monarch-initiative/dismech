- name: Endothelin-1 Excess
  description: >-
    Excess endothelin-1 is proposed to result from reduced degradation by
    mutant cathepsin A. Only one part of this has been observed in patients:
    striking endothelin-1 immunoreactivity in white matter astrocytes at
    autopsy. Reduced degradation and a systemic excess, which the vascular
    and muscle arms below assume, are inferred, not measured.

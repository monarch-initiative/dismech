    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The DD mice had a reduced degradation rate of ET-1 in the blood whereas their cultured arterial vascular smooth muscle cells showed increased ET-1-dependent phosphorylation of myosin light chain 2."
    explanation: Loss of endothelin-1 degrading enzymes increases vascular responses to endothelin-1 in mice.

pathophysiology:
- name: Heterozygous CTSA Arg307Cys Variant
  description: >-
    The only known CARASAL variant, c.919C>T p.(Arg307Cys) (NM_000308.4),
    equivalent to c.973C>T p.Arg325Cys in older numbering. It is a founder
    variant in the Netherlands and has also been found in unrelated Chinese
    and Italian-Brazilian patients. The affected arginine lies on the protein
    surface in an AlphaFold model. Heterozygous carriers do not have
    galactosialidosis, and the effect of the variant on cathepsin A
    carboxypeptidase activity has not been reported, so the node binds the
    enzyme's activity without a direction.
  biological_scale: MOLECULAR

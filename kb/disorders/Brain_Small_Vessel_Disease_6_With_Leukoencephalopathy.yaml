animal_models:
- name: Ctsa and Scpep1 double-deficient mouse
  species: Mus musculus
  genotype: Ctsa S190A (catalytically inactive) combined with Scpep1 deficiency
  description: >-
    Mice lacking both endothelin-1 degrading carboxypeptidases degrade
    endothelin-1 more slowly, have arteries more reactive to it and develop
    higher blood pressure on a high-salt diet with endothelin-1 injection.
    This is not a CARASAL model; it tests the endothelin arm of the proposed
    mechanism.
  publication: PMID:24586188
  modeled_mechanisms:
  - target: Endothelin-1 Driven Arteriolar Vasoconstriction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Increased endothelin-1 responses and blood pressure when endothelin-1 degradation is lost.
    limitations: >-
      The model removes cathepsin A catalytic activity together with SCPEP1,
      rather than carrying the heterozygous CARASAL variant; white matter
      disease and stroke were not examined.
    evidence:
    - reference: PMID:24586188
      reference_title: "Serine carboxypeptidase SCPEP1 and Cathepsin A play complementary roles in regulation of vasoconstriction via inactivation of endothelin-1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generated a mouse strain devoid of both CathA and Scpep1 activities (DD mice) and found that in response to high-salt diet and systemic injections of ET-1 these animals showed significantly increased blood pressure as compared to wild type mice or those with single deficiencies of CathA or Scpep1."
      explanation: Blood pressure effect of combined deficiency.

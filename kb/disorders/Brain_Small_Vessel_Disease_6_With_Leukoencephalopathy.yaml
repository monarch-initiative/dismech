name: Brain Small Vessel Disease 6 With Leukoencephalopathy
creation_date: "2026-10-28T17:30:00Z"
category: Mendelian
synonyms:
- CARASAL
- cathepsin A-related arteriopathy with strokes and leukoencephalopathy
- CTSA-associated small vessel disease
description: >-
  CARASAL (cathepsin A-related arteriopathy with strokes and
  leukoencephalopathy) is an adult-onset autosomal dominant cerebral small
  vessel disease caused by a
  single recurrent heterozygous CTSA missense variant (c.919C>T
  p.Arg307Cys on NM_000308.4, reported in the first papers as c.973C>T
  p.Arg325Cys). CTSA encodes cathepsin A, the lysosomal and secreted serine
  carboxypeptidase whose biallelic loss causes the unrelated recessive
  storage disease galactosialidosis. Patients have very extensive confluent
  white matter hyperintensities, including the pons, out of proportion to
  their symptoms and to their lacune count; ischemic stroke (cortical and
  subcortical) and intracerebral hemorrhage from the fifth decade;
  hypertension that can be hard to treat; mild cognitive complaints; and
  brainstem and extracerebral features such as dysphagia, hearing loss,
  vertigo, sicca symptoms, muscle cramps and enophthalmos. At autopsy the
  white matter disease is more extensive than the arteriolar changes, and
  white matter astrocytes show strong endothelin-1 staining with an excess of
  premyelinating oligodendrocyte progenitors. Because cathepsin A degrades
  endothelin-1, the discoverers proposed that endothelin-1 excess both
  constricts small vessels and blocks oligodendrocyte maturation; how a
  single dominant variant does this is not established. About 30 patients
  have been described, mostly in an extended Dutch founder pedigree. There is
  no specific treatment.

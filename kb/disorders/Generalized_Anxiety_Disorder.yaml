animal_models:
- name: Adult zebrafish novel tank diving anxiolytic-screening assay
  species: Zebrafish (Danio rerio)
  genotype: Wild type (pharmacological assay; no engineered allele)
  description: >-
    Adult zebrafish placed in a novel tank initially dwell in the bottom third
    and progressively explore higher levels of the tank. The proportion of time
    spent bottom-dwelling serves as the anxiety index, while swim speed is
    recorded in parallel so that sedation can be separated from anxiolysis.
    Drugs are given by brief immersion rather than injection. As a New Approach
    Methodology-tier behavioural pharmacology screen the assay is inexpensive
    and higher-throughput than its rodent equivalents, and it discriminates
    anxiolytic drugs across serotonergic, benzodiazepine and nicotinic classes.
  publication: PMID:19643124
  associated_phenotypes:
  - Anxiety-like bottom dwelling (diving response) in a novel environment
  modeled_mechanisms:
  - target: Serotonin Dysregulation
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Acute immersion in the 5-HT1A receptor agonist buspirone reduces the
      diving response at doses that do not slow swimming, showing that the
      serotonergic (5-HT1A) anxiolytic target underlying this node is
      functionally conserved and pharmacologically addressable in zebrafish.
    limitations: >-
      Buspirone also carries D2 dopaminergic activity, so the effect cannot be
      attributed to 5-HT1A signalling alone, and a single 3-minute immersion
      cannot model the weeks of treatment that human serotonergic anxiolysis
      requires. The assay demonstrates conservation of an anxiolytic drug
      target, not that zebrafish reproduce the raphe-prefrontal serotonergic
      pathology curated for human GAD.
    readouts:
    - name: Novel-tank bottom dwelling under buspirone
      target: Serotonin Dysregulation
      description: >-
        Time spent in the bottom third of the novel tank across a 5-minute
        session after brief buspirone immersion, compared with vehicle controls,
        with swim speed measured concurrently as a sedation control.
      direction: DECREASED
      interpretation: >-
        A fall in bottom dwelling with no concurrent fall in swim speed is read
        as anxiolysis rather than sedation, so the readout reports specifically
        on pharmacological engagement of the serotonergic arm.
      evidence:
      - reference: PMID:19643124
        reference_title: "Buspirone, chlordiazepoxide and diazepam effects in a zebrafish model of anxiety."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Buspirone, a serotonergic (5HT(1A) receptor agonist) anxiolytic
          drug with some D(2) dopaminergic effect, had a pronounced anxiolytic-like
          effect in the zebrafish diving model at doses that did not have sedative
          effects."
        explanation: Reports the dose-controlled behavioural measurement behind
          this readout, including the explicit absence of sedation at the
          effective doses.
    evidence:
    - reference: PMID:19643124
      reference_title: "Buspirone, chlordiazepoxide and diazepam effects in a zebrafish model of anxiety."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The zebrafish novel tank diving task can be useful in discriminating
        anxiolytic drugs of several classes (serotonergic, benzodiazepines and nicotinic)."
      explanation: Supports treating this assay as informative for the
        serotonergic arm of GAD pharmacology, since the authors' stated claim is
        class-level discrimination that includes serotonergic anxiolytics.
  - target: GABA System Dysfunction
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      The benzodiazepine diazepam reduces the diving response at non-sedative
      doses, indicating that benzodiazepine-GABA-A signalling is present and
      anxiolytically effective in zebrafish. The second benzodiazepine tested,
      chlordiazepoxide, produced sedation but no anxiolysis, so the model
      engages this node only partially.
    limitations: >-
      Chlordiazepoxide is an effective GABA-A agonist and is anxiolytic in
      rodents, yet produced no reduction in bottom dwelling here over a broad
      dose range; the diazepam dose-response was also biphasic. Benzodiazepine
      responsiveness is therefore compound-specific in this model, and a
      negative result for a GABAergic compound must not be transferred to human
      GAD as evidence against a GABAergic mechanism.
    readouts:
    - name: Novel-tank bottom dwelling under diazepam
      target: GABA System Dysfunction
      description: >-
        Time spent in the bottom third of the novel tank after brief diazepam
        immersion, compared with vehicle controls, with swim speed measured
        concurrently as a sedation control.
      direction: DECREASED
      interpretation: >-
        Anxiolysis at doses that leave swimming intact is the positive readout
        for functional benzodiazepine-GABA-A signalling in this model.
      evidence:
      - reference: PMID:19643124
        reference_title: "Buspirone, chlordiazepoxide and diazepam effects in a zebrafish model of anxiety."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Diazepam another benzodiazepine anxiolytic drug did produce an
          anxiolytic effect at doses that did not cause sedation."
        explanation: Reports the measurement behind this readout, with sedation
          explicitly excluded as the explanation.
    - name: Novel-tank bottom dwelling under chlordiazepoxide
      target: GABA System Dysfunction
      description: >-
        The same bottom-dwelling measure after chlordiazepoxide immersion across
        a dose range extending up to sedative concentrations.
      direction: UNCHANGED
      interpretation: >-
        A genuine negative result: the compound reached behaviourally active
        concentrations (it caused sedation) without producing anxiolysis, so the
        null is not explained by failure to reach the target tissue. This bounds
        how far benzodiazepine pharmacology in this model may be generalized.
      evidence:
      - reference: PMID:19643124
        reference_title: "Buspirone, chlordiazepoxide and diazepam effects in a zebrafish model of anxiety."
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: "In contrast, chlordiazepoxide, a benzodiazepine anxiolytic drug,
          which is an effective agonist at GABA-A receptors, did not produce signs
          of anxiolysis in zebrafish over a broad dose range up to those that caused
          sedation."
        explanation: Documents the negative readout and confirms the compound was
          behaviourally active at the doses tested.
    evidence:
    - reference: PMID:19643124
      reference_title: "Buspirone, chlordiazepoxide and diazepam effects in a zebrafish model of anxiety."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "The zebrafish novel tank diving task can be useful in discriminating
        anxiolytic drugs of several classes (serotonergic, benzodiazepines and nicotinic)."
      explanation: Supports the assay as informative for benzodiazepine-GABA-A
        pharmacology, but only partially, because one of the two benzodiazepines
        tested failed to produce anxiolysis.
  notes: >-
    Scope is limited to the two neurotransmitter mechanisms the publication
    actually manipulated. The model is deliberately not linked to Amygdala
    Hyperactivity, HPA Axis Dysregulation, or the disease-level phenotypes,
    because no neural, endocrine, or symptom-level measurement was made.
- name: Larval zebrafish dark-flash thigmotaxis assay
  species: Zebrafish (Danio rerio)
  genotype: Wild type (pharmacological assay; no engineered allele)
  background: Larvae from 5 days post fertilization, assayed in standard 24-well plates
  description: >-
    Thigmotaxis ("wall-hugging") in 5-days-post-fertilization larvae, triggered
    by a sudden light-to-darkness transition and scored in a standard 24-well
    plate over a 10-minute session. This is the larval, plate-based tier of
    zebrafish anxiety modelling and the closest zebrafish analogue of a New
    Approach Methodology: it runs at medium-to-high throughput on early-stage
    larvae and reads out with both anxiolytic and anxiogenic reference compounds.
  publication: PMID:22197677
  associated_phenotypes:
  - Anxiety-like thigmotaxis (wall-hugging) after a sudden light-to-dark transition
  modeled_mechanisms:
  - target: GABA System Dysfunction
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Diazepam attenuates dark-flash-evoked thigmotaxis in larvae, and the
      anxiogenic reference compound caffeine enhances it, giving the assay
      bidirectional pharmacological validation of the benzodiazepine-GABA-A
      anxiolytic target at larval stages.
    limitations: >-
      Thigmotaxis is a behavioural proxy; no GABAergic transmission, receptor
      occupancy, or brain-region measurement was made, so the link is to the
      drug target of this node rather than to a demonstrated GABAergic deficit.
      Reducing the light-to-darkness contrast lowered thigmotaxis as effectively
      as diazepam did, so the readout is also sensitive to stimulus intensity
      and is not specific to pharmacology.
    readouts:
    - name: Dark-flash-evoked larval thigmotaxis under diazepam
      target: GABA System Dysfunction
      description: >-
        Thigmotaxis of 5-days-post-fertilization larvae following a sudden
        light-to-darkness transition, measured under diazepam against
        vehicle-treated larvae and against the anxiogenic comparator caffeine.
      direction: DECREASED
      interpretation: >-
        Attenuation by an anxiolytic together with enhancement by an anxiogenic
        is what validates the endpoint as an anxiety index rather than a general
        locomotor measure.
      evidence:
      - reference: PMID:22197677
        reference_title: Measuring thigmotaxis in larval zebrafish.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Thigmotaxis was significantly attenuated by anxiolytic (diazepam)
          and significantly enhanced by anxiogenic (caffeine) drugs, thus representing
          the first validated thigmotaxis assay for larval zebrafish."
        explanation: Reports the bidirectional pharmacological measurement behind
          this readout.
    evidence:
    - reference: PMID:22197677
      reference_title: Measuring thigmotaxis in larval zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that zebrafish larvae as young as 5 days post fertilization
        respond to this challenge by engaging in thigmotaxis."
      explanation: Establishes that the anxiety-like endpoint this model links to
        the node is measurable at larval stages, which is what makes the assay a
        higher-throughput alternative to adult and rodent testing.
  notes: >-
    Retained alongside the adult novel-tank model rather than replacing it: the
    two assays use different developmental stages, different aversive stimuli,
    and different laboratories, so the shared diazepam result is independent
    corroboration rather than duplication.
- name: Larval zebrafish edge-preference (thigmotaxis) assay
  species: Zebrafish (Danio rerio)
  genotype: Wild type (pharmacological assay; no engineered allele)
  background: Larvae imaged in multiwell plates in five-fish and two-fish assay formats
  description: >-
    Automated imaging of larval preference for the edge of a multiwell plate,
    with and without a visual stimulus, used to dissociate anxiolytic drug
    classes. Diazepam, fluoxetine and caffeine were tested against the same
    endpoint, so the assay reports not only which compounds are active but which
    are not.
  publication: PMID:22155488
  associated_phenotypes:
  - Anxiety-like edge preference (thigmotaxis) in a multiwell plate
  modeled_mechanisms:
  - target: GABA System Dysfunction
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Diazepam reduces larval edge preference with or without visual stimuli,
      independently reproducing the benzodiazepine sensitivity seen in the
      dark-flash thigmotaxis and adult novel-tank assays.
    limitations: >-
      As with the other behavioural assays, the manipulation is pharmacological
      and the endpoint is positional: no GABAergic transmission was measured.
      The authors themselves note substantial zebrafish-human brain differences
      and claim conservation only at the level of the molecular signals that
      regulate anxiety.
    readouts:
    - name: Larval edge preference under diazepam
      target: GABA System Dysfunction
      description: >-
        Proportion of time larvae spend at the well edge under diazepam relative
        to controls, assayed both with and without a visual stimulus.
      direction: DECREASED
      interpretation: >-
        Reduction under both stimulus conditions indicates the benzodiazepine
        effect is on the anxiety-like state rather than on stimulus processing.
      evidence:
      - reference: PMID:22155488
        reference_title: "On the edge: pharmacological evidence for anxiety-related behavior in zebrafish larvae."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Diazepam, a benzodiazepine that binds to GABA receptors, reduced
          the larval edge preference, with or without visual stimuli."
        explanation: Reports the measurement behind this readout under both
          stimulus conditions.
    evidence:
    - reference: PMID:22155488
      reference_title: "On the edge: pharmacological evidence for anxiety-related behavior in zebrafish larvae."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although there are substantial differences between zebrafish and
        human brains, our results indicate that the signals that regulate anxiety
        are similar on a molecular level."
      explanation: States the authors' own scope for transferring results from
        this model to human anxiety - molecular-signal conservation, with brain
        organization explicitly excluded.
  - target: Serotonin Dysregulation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Acute fluoxetine, a selective serotonin reuptake inhibitor and the drug
      class that is first-line for human GAD, did not alter larval edge
      preference, while diazepam tested in the same assay did. The assay
      therefore does not reproduce the serotonergic arm of human GAD
      pharmacology.
    limitations: >-
      This negative result is not evidence against serotonergic involvement in
      GAD. Human SSRI anxiolysis emerges over weeks of dosing, so an acute
      immersion has no expectation of an effect, and the adult novel-tank model
      does detect acute 5-HT1A agonist anxiolysis with buspirone. The honest
      reading is that acute larval edge preference is insensitive to reuptake
      inhibition, which bounds the assay's use in screening serotonergic
      anxiolytics rather than adjudicating the mechanism.
    readouts:
    - name: Larval edge preference under acute fluoxetine
      target: Serotonin Dysregulation
      description: >-
        Proportion of time larvae spend at the well edge under acute fluoxetine
        exposure relative to controls, assayed in the same experiment as the
        positive diazepam and caffeine comparators.
      direction: UNCHANGED
      interpretation: >-
        A negative result with internal positive controls in the same assay: the
        null is attributable to the compound class and exposure duration rather
        than to an insensitive endpoint.
      evidence:
      - reference: PMID:22155488
        reference_title: "On the edge: pharmacological evidence for anxiety-related behavior in zebrafish larvae."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In contrast, fluoxetine, a selective serotonin reuptake inhibitor,
          did not affect the edge preference."
        explanation: Directly reports the null measurement that grounds this
          readout, contrasted by the authors against the active comparators.
    evidence:
    - reference: PMID:22155488
      reference_title: "On the edge: pharmacological evidence for anxiety-related behavior in zebrafish larvae."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results suggest that the edge preference in zebrafish larvae
        is a measure of anxiety and further illustrate that the pharmaceuticals used
        in the study have different mechanisms of action."
      explanation: Supports treating the compound-level dissociation, including
        the fluoxetine null, as an interpretable property of the assay rather
        than an experimental failure.
  notes: >-
    The fluoxetine null is curated deliberately. Recording only the compounds
    that worked would misrepresent this assay as a general anxiolytic screen
    when the source reports a dissociation between drug classes.
discussions:
- discussion_id: gad_zebrafish_anxiolytic_class_mismatch
  prompt: >-
    Do zebrafish anxiolytic assays report the human GAD treatment hierarchy, given
    that acute SSRI exposure and the GABA-A agonist chlordiazepoxide both fail to
    produce anxiolysis in them while buspirone and diazepam succeed?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Serotonin Dysregulation
  - pathophysiology#GABA System Dysfunction
  rationale: >-
    Across the three zebrafish assays curated here the pharmacological pattern
    does not match human GAD practice. SSRIs are first-line in humans, yet acute
    fluoxetine leaves larval edge preference unchanged; chlordiazepoxide is an
    effective GABA-A agonist and is anxiolytic in rodents, yet produces sedation
    without anxiolysis in the adult novel-tank assay; while buspirone and
    diazepam are active in both. Two explanations are compatible with the data
    and are not distinguished by it - an exposure-duration artefact (acute
    immersion cannot express the weeks-long adaptation human SSRI anxiolysis
    requires) or genuine divergence in receptor-level pharmacology between
    teleost and mammalian anxiety circuits. Which it is determines whether these
    assays may be used to screen serotonergic anxiolytics at all, so it should be
    resolved rather than left implicit in the per-model limitations.
  proposed_experiments:
  - experiment_id: gad_zebrafish_chronic_ssri_exposure
    name: Sub-chronic versus acute SSRI exposure in larval and adult zebrafish anxiety assays
    description: >-
      Run matched dose-response curves for fluoxetine under acute immersion and
      under multi-day waterborne exposure in both the larval edge-preference and
      adult novel-tank assays, with diazepam and buspirone as in-assay positive
      controls and swim speed as a sedation control throughout.
    decision_criterion: >-
      Whether anxiolysis appears under sub-chronic but not acute exposure, at
      doses that leave locomotion intact.
    supporting_outcome:
    - >-
      Anxiolysis emerging only after sustained exposure would show the null is an
      exposure-duration artefact, leaving the assays usable for serotonergic
      screening provided the dosing schedule is matched to the human one.
    refuting_outcome:
    - >-
      A persistent null under sustained exposure at non-sedative doses would
      indicate genuine divergence in serotonergic anxiolytic pharmacology and
      argue against using these assays to screen reuptake inhibitors.
  notes: >-
    Raised while adding structured animal-model links for issue #4873; the
    underlying results were already cited on the GABA and serotonin nodes but the
    conflict between them had not been recorded anywhere.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "pneumoconiosis (CWP) is a lethal fibrotic lung disease caused by inhalation and deposition of inorganic coal mine dust in the lung"
    explanation: >-
      Characterizes CWP as a fibrotic lung disease, the substrate of this
      phenotype.
- name: Exertional dyspnea
  category: Respiratory
  description: >-
    Progressive breathlessness on exertion, the dominant symptom of complicated
    disease and the usual reason a miner presents. Absent or minimal in simple
    CWP.
  phenotype_term:
    preferred_term: Exertional dyspnea
    term:
      id: HP:0002875
      label: Exertional dyspnea

environmental:
- name: Occupational inhalation of respirable coal mine dust
  description: >-
    Cumulative inhalation of respirable coal mine dust during underground or
    surface coal mining is the necessary cause of CWP. Classic risk work is
    underground extraction, with roof bolting and continuous-miner operation
    among the dustiest tasks; contemporary thin-seam mining raises the silica
    fraction of the dust because accessing the seam requires cutting
    silica-bearing rock.
  exposure_term:
    preferred_term: exposure to respirable coal mine dust
    term:
      id: ECTO:7000005
      label: exposure to coal dust
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
      notes: >-
        Coal mine dust is a mineral dust, classified as a chemical agent in the
        occupational-hygiene scheme (ILO section 1.1), not as a physical agent.
    exposure_route:
    - classification_value: INHALATION
      notes: >-
        Only the respirable fraction reaching the terminal bronchioles and
        alveoli is pathogenic; the route is what defines the exposure.
    exposure_duration:
    - classification_value: CHRONIC
      notes: >-
        ATSDR chronic duration (365 days and longer). Classic CWP follows one to
        several decades of underground work; the rapidly progressive form
        compresses this but is still a multi-year exposure, not an intermediate
        or acute one.
    ghs_health_hazard_class:
    - classification_value: STOT_REPEATED_EXPOSURE
      notes: >-
        Specific target organ toxicity from repeated exposure — a non-lethal,
        organ-specific effect (lung) accumulating over prolonged exposure rather
        than an acute toxic response.
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
      notes: >-
        An identifiable individual-level occupational agent, in Wild's specific
        external domain rather than the general external environment.
  notes: >-
    No iarc_carcinogen_group is recorded. IARC evaluated coal dust in Monographs
    volume 68 and placed it in Group 3 (not classifiable as to carcinogenicity to
    humans); the schema's IARCCarcinogenGroupEnum was checked and does admit
    GROUP_3, so this omission is a judgement rather than a schema limit — the
    Group 3 listing is for coal dust as an agent, while the exposure curated here
    is coal *mine* dust, a mixture whose silica fraction carries its own
    classification. Crystalline silica's Group 1 listing belongs to the Silicosis
    entry's exposure, not to this one. The cohort association between coal mine
    dust and lung cancer mortality is instead curated as evidence, on the
    mortality items below.
  evidence:
  - reference: PMID:41411198
    reference_title: "Coal Workers' Pneumoconiosis-Associated Deaths - United States, 2020-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among workers employed in the mining industry, the highest PMR was among underground mining machine operators (164.6)."
    explanation: >-
      Identifies underground mining machine operation as the highest-risk task
      by proportionate mortality, grounding the occupational specificity of the
      exposure.
  - reference: PMID:31302880
    reference_title: "Current Review of Pneumoconiosis Among US Coal Miners."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Contributing factors may include mining of thin coal seams or cutting rock to access coal, which may expose miners to coal mine dust with a higher content of silica and silicates than in the past."
    explanation: >-
      Sources the thin-seam mechanism by which contemporary coal mine dust
      carries more silica than historical dust.
  - reference: PMID:24186945
    reference_title: "Respiratory disease mortality among US coal miners; results after 37 years of follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We saw a significant relationship between coal mine dust exposure and lung cancer mortality (HR=1.70; 95% CI 1.02 to 2.83) but not with respirable silica (HR=1.05; 95% CI 0.90 to 1.23)."
    explanation: >-
      The lung-cancer association this exposure's notes refer to, with the effect
      attaching to coal mine dust rather than to its respirable silica fraction.
      Curated as evidence on the exposure rather than as a hazard classification.
  - reference: PMID:36635098
    reference_title: "Increased odds of mortality from non-malignant respiratory disease and lung cancer are highest among US coal miners born after 1939."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "US coal miners have excess mortality from NMRD and lung cancer compared with total US and Appalachian populations. Mortality is highest in the most recent birth cohorts, perhaps reflecting increased rates of severe pneumoconiosis."
    explanation: >-
      Independent evidence that both malignant and non-malignant respiratory
      mortality is concentrated in later birth cohorts, consistent with the
      contemporary exposure shift this entry models.
  influences_mechanisms:
  - target: Respirable Coal Mine Dust Deposition and Retention
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Coal extraction liberates dust in the respirable size range, which is the
      fraction that reaches the terminal bronchioles and alveoli to be deposited
      and retained.
    evidence:
    - reference: PMID:41411198
      reference_title: "Coal Workers' Pneumoconiosis-Associated Deaths - United States, 2020-2023."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Coal workers' pneumoconiosis (CWP) is a preventable, progressive occupational lung disease caused by inhaling respirable coal mine dust, a complex mixture commonly containing coal, crystalline silica, and other silicate minerals."
      explanation: >-
        Ties the occupational activity directly to inhalation of the respirable
        dust that the deposition node represents.
  - target: Silica-Enriched Dust Burden
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Cutting silica-bearing rock strata to reach thin coal seams raises the
      crystalline-silica content of the generated dust, which is what shifts the
      retained burden toward the more fibrogenic silica-enriched form.
    evidence:
    - reference: PMID:31302880
      reference_title: "Current Review of Pneumoconiosis Among US Coal Miners."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Contributing factors may include mining of thin coal seams or cutting rock to access coal, which may expose miners to coal mine dust with a higher content of silica and silicates than in the past."
      explanation: >-
        States the specific mining practice that raises the silica fraction of
        the dust, which is the edge this link asserts.
- name: Cigarette smoking
  description: >-
    Smoking does not cause CWP and is not required for it — the excess
    respiratory mortality of coal miners is present in never-smokers. It is
    curated here because it compounds the obstructive component and overall
    respiratory morbidity, and smoking cessation is a core management step.
  exposure_term:
    preferred_term: exposure to cigarette smoking
    term:
      id: ECTO:0100003
      label: exposure to cigarette smoking
  review_notes: >-
    Bound and pathograph-linked as an explicitly non-causal modifier. An earlier
    revision left both the exposure_term and the mechanism link off, reasoning
    that binding a tobacco term would imply smoking is etiologic for CWP. That
    reasoning does not survive contact with the schema: environmental_effect
    exists to separate TRIGGERS from MODULATES, and only TRIGGERS and EXACERBATES
    count as causal for compliance scoring. MODULATES states the intended claim
    machine-readably instead of burying it in prose.
  evidence:
  - reference: PMID:24186945
    reference_title: "Respiratory disease mortality among US coal miners; results after 37 years of follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support previous studies showing that exposure to coal mine dust and respirable silica leads to increased mortality from malignant and non-malignant respiratory diseases even in the absence of smoking."
    explanation: >-
      Establishes that the dust effect is independent of smoking, which is the
      reason smoking is curated here as a compounding factor rather than a cause.
  influences_mechanisms:
  - target: Impaired Gas Exchange and Mixed Ventilatory Defect
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Smoking worsens measured lung function in miners who already have
      progressive massive fibrosis, on top of the dust-driven impairment, without
      being required for it. MODULATES rather than EXACERBATES because the
      cohort evidence puts the excess respiratory mortality in never-smokers,
      so the interaction is additive burden rather than a demonstrated
      amplification of the dust mechanism.
    evidence:
    - reference: PMID:11952275
      reference_title: "Pulmonary function impairment in pneumoconiotic patients with progressive massive fibrosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Smoking miners had even lower FEV1/FVC and DLCO than did their non-smoking counterparts."
      explanation: >-
        Measures worse airflow obstruction and diffusing capacity in smoking
        miners with progressive massive fibrosis, the additive functional effect
        this link asserts.
    - reference: PMID:11952275
      reference_title: "Pulmonary function impairment in pneumoconiotic patients with progressive massive fibrosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The loss of lung function cannot be accounted for by different smoking habits."
      explanation: >-
        The same study's conclusion that smoking does not explain the impairment,
        which is why this link is MODULATES and not a causal edge.
genetic:
- name: TNF
  gene_term:
    preferred_term: TNF
    term:
      id: hgnc:11892
      label: TNF
  association: >-
    Host susceptibility modifier. The TNF-alpha promoter polymorphisms -308 and
    -238 are associated with CWP risk in meta-analysis of candidate-gene
    case-control studies, chiefly in Chinese coal-miner cohorts. These are common
    regulatory variants that amplify the TNF-alpha-driven inflammatory response
    to retained dust; they modify risk and are neither necessary nor sufficient
    without the exposure.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:39578762
    reference_title: "Candidate gene polymorphisms associated with silicosis and coal workers' pneumoconiosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The analysis revealed that allele A of TNFα-308, allele A of TNFα-238, and allele C of IL-1RA + 2018 were identified as risk factors for the development of diseases."
    explanation: >-
      Meta-analytic association of both TNF-alpha promoter alleles with disease
      risk across the pooled candidate-gene literature.
  - reference: PMID:39578762
    reference_title: "Candidate gene polymorphisms associated with silicosis and coal workers' pneumoconiosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite similar exposure levels, individuals exhibit varying responses."
    explanation: >-
      States the observation that motivates a host-susceptibility layer at all:
      equal dust exposure does not produce equal disease.
  notes: >-
    The meta-analysis pools silicosis and CWP studies rather than reporting CWP
    separately, so the association is not CWP-specific. It is curated as a
    susceptibility modifier on that basis and not as a CWP-only effect estimate.
- name: TGFB1
  gene_term:
    preferred_term: TGFB1
    term:
      id: hgnc:11766
      label: TGFB1
  association: >-
    Host susceptibility modifier acting on the central profibrotic pathway. In a
    case-control study of 508 CWP patients and 526 exposed-miner controls, the
    rs1800470 CC genotype was associated with reduced CWP risk and the
    rs11466345 GG genotype with increased risk. TGF-beta1 is the same signal the
    Fibroblast Activation node is annotated with, so this locus modifies the rate
    of a mechanism the entry already models rather than adding a new one.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:23554640
    reference_title: "Association of transforming growth factor-β1 gene variants with risk of coal workers' pneumoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate logistic regression analysis revealed that SNP2 (rs1800470) CC genotype was associated with decreased risk of CWP (OR = 0.50, 95% CI = 0.32-0.78)"
    explanation: >-
      Reports the protective genotype association with an effect estimate in a
      CWP-specific exposed-control design.
  - reference: PMID:23554640
    reference_title: "Association of transforming growth factor-β1 gene variants with risk of coal workers' pneumoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the SNP5 (rs11466345) GG genotype was associated with an increased risk of CWP (OR = 2.5, 95%CI = 1.36-4.57)"
    explanation: >-
      Reports the risk-increasing genotype at the same locus, showing the
      modifier acts in both directions.
- name: H19
  gene_term:
    preferred_term: H19
    term:
      id: hgnc:4713
      label: H19
  association: >-
    Protective susceptibility modifier. The H19 long noncoding RNA variant
    rs2067051 CT/TT genotypes were associated with decreased CWP risk in 703
    cases and 705 exposed controls from Chinese coal mines. One of the few
    reported protective loci in this disease.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:27626436
    reference_title: "Polymorphisms in Long Noncoding RNA H19 Contribute to the Protective Effects of Coal Workers' Pneumoconiosis in a Chinese Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that individuals with the H19 rs2067051 CT/TT genotypes showed a decreased risk of CWP compared with those with the CC genotype (adjusted OR = 0.64, 95%CI = 0.49-0.83, p = 0.001)."
    explanation: >-
      Reports the protective genotype association and effect estimate in a
      CWP case-control study with dust-exposed controls.
  notes: >-
    Single-population candidate-gene finding in Han Chinese miners without
    reported independent replication; treat the effect size as provisional. The
    same caveat applies to the wider CWP susceptibility literature, which is
    dominated by Chinese candidate-gene case-control studies and has no
    genome-wide-significant locus.

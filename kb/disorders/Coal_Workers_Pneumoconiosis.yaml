treatments:
- name: Exposure Cessation and Dust Reduction
  description: >-
    Removal from further dust exposure — through the Part 90 transfer right,
    engineering controls, or leaving the work — is the only intervention that
    changes the disease trajectory in early CWP. It halts accrual of new dust
    burden; it does not clear retained dust, and it does not reliably stop PMF,
    which can progress after exposure ends.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational exposure cessation
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Respirable Coal Mine Dust Deposition and Retention
    description: >-
      Ending exposure stops further deposition and retention of respirable dust,
      capping the cumulative burden that drives every downstream step.
  evidence:
  - reference: PMID:36972614
    reference_title: "Pathology and Mineralogy of the Pneumoconioses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most pneumoconioses are irreversible and incurable, but disease progression can be mitigated by removal from or reduction in further exposure."
    explanation: >-
      States both halves of this treatment's claim: the disease is not
      reversible, and exposure reduction is what mitigates progression.
  - reference: PMID:41411198
    reference_title: "Coal Workers' Pneumoconiosis-Associated Deaths - United States, 2020-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease progression can occur after cessation of exposure"
    explanation: >-
      Sources the limit on this treatment stated in its description: stopping
      exposure caps the dust burden but does not reliably stop established
      disease from advancing.
- name: Supportive Respiratory Care
  description: >-
    Vaccination against influenza and pneumococcus, prompt treatment of
    respiratory infection, mycobacterial surveillance given impaired local lung
    defences, and smoking cessation. Standard of care and the backbone of
    management at every stage, since no disease-modifying drug exists.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36972614
    reference_title: "Pathology and Mineralogy of the Pneumoconioses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Many pneumoconioses are irreversible and develop due to excessive cumulative respirable dust inhalation."
    explanation: >-
      Establishes the irreversibility that makes supportive rather than curative
      management the standard of care.
- name: Pulmonary Rehabilitation
  description: >-
    Structured exercise and education to maintain functional capacity and
    activities of daily living in miners with established functional impairment.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Pulmonary Rehabilitation
    term:
      id: NCIT:C157966
      label: Pulmonary Rehabilitation
  target_mechanisms:
  - target: Impaired Gas Exchange and Mixed Ventilatory Defect
    description: >-
      Targets the functional consequences of impaired gas exchange and mixed
      ventilatory defect rather than the fibrotic lesion itself.
  evidence:
  - reference: PMID:37284491
    reference_title: "Serum Osteopontin, KL-6, and Syndecan-4 as Potential Biomarkers in the Diagnosis of Coal Workers' Pneumoconiosis: A Case-Control Study."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because the disease is progressive and incurable, early diagnosis or early prevention is especially important to control this disease."
    explanation: >-
      Indirect: the quote establishes that CWP is progressive and incurable —
      the reason management is functional rather than curative — but does not
      itself evaluate pulmonary rehabilitation.
- name: Long-Term Oxygen Therapy
  description: >-
    Supplemental oxygen for chronic hypoxemia in advanced disease, and to
    mitigate the hypoxic pulmonary vasoconstriction that drives pulmonary
    hypertension and cor pulmonale.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Oxygen Therapy
    term:
      id: NCIT:C94624
      label: Oxygen Therapy
  target_mechanisms:
  - target: Impaired Gas Exchange and Mixed Ventilatory Defect
    description: >-
      Compensates for the failed gas exchange surface; it does not alter the
      fibrotic or emphysematous lesion producing it.
  evidence:
  - reference: PMID:39620857
    reference_title: "Outcomes of Lung Transplantation in Coal Workers Pneumoconiosis: Analysis of UNOS Database."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "CWP group was noted to have higher mean pulmonary artery pressures, LAS, need for prolonged intubation and extracorporeal membrane oxygenation (ECMO) at 72 h"
    explanation: >-
      Indirect: documents the severity of oxygenation failure in advanced CWP
      that indicates oxygen support, rather than evaluating long-term oxygen
      therapy as an intervention.
- name: Lung Transplantation
  description: >-
    The only definitive intervention for end-stage CWP with progressive
    respiratory failure. Post-transplant graft and patient survival in CWP
    recipients are comparable to other indications, so the disease is not itself
    a contraindication, though CWP candidates arrive with higher pulmonary artery
    pressures and higher allocation scores and have a more demanding
    perioperative course.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Nodule Coalescence into Progressive Massive Fibrosis
    description: >-
      Replaces the fibrotic organ outright. It is the only listed treatment that
      removes the conglomerate lesion rather than managing its consequences.
  evidence:
  - reference: PMID:39620857
    reference_title: "Outcomes of Lung Transplantation in Coal Workers Pneumoconiosis: Analysis of UNOS Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall graft survival (Log-rank p = 0.889) and patient survival (Log-rank p = 0.910) were not significantly different between the two groups."
    explanation: >-
      Registry comparison showing CWP transplant recipients do as well as
      recipients transplanted for other indications.
  - reference: PMID:39620857
    reference_title: "Outcomes of Lung Transplantation in Coal Workers Pneumoconiosis: Analysis of UNOS Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Between May 2005 and June 2021, 158 patients underwent LT for CWP."
    explanation: >-
      Establishes the cohort size behind the survival comparison, so the
      equivalence claim is not read off a handful of cases.
  - reference: PMID:22360577
    reference_title: "Lung transplantation in patients with coal workers' pneumoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no increased risk of perioperative or postoperative complications."
    explanation: >-
      Independent single-centre series reaching the same conclusion on
      perioperative safety.
- name: Antifibrotic Therapy
  description: >-
    Pirfenidone, an antifibrotic established in idiopathic pulmonary fibrosis, has
    been trialled in CWP with pulmonary fibrosis on the reasoning that the
    fibroblast-activation step is shared. Investigational, not standard of care —
    no antifibrotic is approved for CWP. Nintedanib is discussed in the same
    context in the literature but is not listed as a therapeutic_agent here
    because no CWP trial or study was found to cite for it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pirfenidone
      term:
        id: CHEBI:32016
        label: pirfenidone
  target_mechanisms:
  - target: Fibroblast Activation and Myofibroblast Differentiation
    description: >-
      Both agents act on the fibroblast activation and matrix-deposition step
      that this entry models as the central effector of the lesion.
  evidence:
  - reference: clinicaltrials:NCT04461587
    reference_title: "Examination of Pirfenidone (Esbriet®) Therapy in Coal Workers' Pneumoconiosis With Pulmonary Fibrosis Associated With Radiographic and Functional Impairment to Examine the Reduction in Progression of Disease, Reduction of Exacerbation Rates and Possible Reduction of Inflammatory Biomarkers as an Index of Clinical Response."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Examination of pirfenidone (Esbriet®) therapy in coal workers' pneumoconiosis (black lung) with pulmonary fibrosis (scarring of the lung)."
    explanation: >-
      Registration record establishing that pirfenidone has been formally
      trialled in CWP with pulmonary fibrosis. A trial record documents that the
      question was asked; it is not evidence the therapy works.

  phenotype_term:
    preferred_term: Emphysema
    term:
      id: HP:0002097
      label: Emphysema
  evidence:
  - reference: PMID:24186945
    reference_title: "Respiratory disease mortality among US coal miners; results after 37 years of follow-up."

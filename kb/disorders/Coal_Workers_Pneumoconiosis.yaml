- name: Nodule Coalescence into Progressive Massive Fibrosis
  description: >-
    Nodular lesions coalesce into conglomerate fibrotic masses one centimetre or
    larger, destroying regional lung architecture. PMF is the disabling
    complicated form and is characteristically self-sustaining: it can continue
    to progress after dust exposure has ended. The silica-enriched dust burden of
    contemporary mining shifts the histologic type of these masses toward
    silica-type PMF.

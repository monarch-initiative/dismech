    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early pneumoconiosis can be asymptomatic, but advanced disease often leads to disability and premature death."
    explanation: >-
      Supports the asymptomatic-to-disabling symptom trajectory in which
      exertional breathlessness is the presenting complaint of advanced disease.
- name: Chronic cough
  category: Respiratory
  description: >-
    Persistent cough, frequently productive, reflecting chronic small-airway
    inflammation from retained dust.
  phenotype_term:
    preferred_term: Chronic cough
    term:
      id: HP:0034315
      label: Chronic cough
    temporality: CHRONIC
  evidence:
  - reference: PMID:26024344

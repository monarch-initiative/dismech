name: Coal Workers Pneumoconiosis
creation_date: "2026-09-03T00:00:00Z"
category: Environmental Lung Disease
parents:
- Pneumoconiosis
- Occupational Lung Disease
disease_term:
  preferred_term: coal workers' pneumoconiosis
  term:
    id: MONDO:0006654
    label: anthracosis
description: >-
  Coal workers' pneumoconiosis (CWP, "black lung") is a preventable, progressive
  occupational interstitial lung disease caused by the inhalation and pulmonary
  retention of respirable coal mine dust — a heterogeneous mixture of coal,
  crystalline silica, and other silicate minerals. Particles reaching the distal
  airways are phagocytosed by alveolar macrophages, whose oxidative and
  inflammasome-driven response builds the coal macule: a pigmented, dust-laden
  macrophage collection with reticulin and collagen centred on the respiratory
  bronchiole, accompanied by focal emphysema. Macules aggregate into
  radiographically visible micronodules and nodules (simple CWP) and, with
  sufficient cumulative or silica-rich dust burden, coalesce into conglomerate
  masses one centimetre or larger — progressive massive fibrosis (PMF, complicated
  CWP), which can continue to progress after exposure ceases and ends in
  restrictive or mixed respiratory failure, pulmonary hypertension, and cor
  pulmonale. Early disease is typically asymptomatic and is detected only by
  radiographic surveillance. After decades of decline following the 1969 US
  Federal Coal Mine Health and Safety Act, CWP has resurged since the late 1990s,
  concentrated in central Appalachia, and contemporary severe cases carry
  markedly more crystalline silica than their historical counterparts — thin-seam
  mining requires cutting silica-bearing rock strata. There is no curative
  therapy; management is supportive, lung transplantation is the only definitive
  intervention for end-stage disease, and prevention through dust control and
  surveillance is paramount.
classifications:
  harrisons_chapter:
  - classification_value: RESPIRATORY
  ilo_disease_category:
  - classification_value: pneumoconiosis_from_fibrogenic_mineral_dust
    notes: >-
      ILO List of Occupational Diseases (revised 2010), item 2.1.1
      "Pneumoconioses caused by fibrogenic mineral dust (silicosis,
      anthraco-silicosis, asbestosis)". Coal mine dust is a mixed fibrogenic
      mineral dust and the item text names anthraco-silicosis explicitly, which
      is the coal-plus-silica pneumoconiosis this entry covers. ILO item 2.1.9
      (COPD from coal dust) is deliberately NOT claimed here: that item names a
      different disease outcome of the same exposure, curated under Chronic
      Obstructive Pulmonary Disease rather than under CWP.

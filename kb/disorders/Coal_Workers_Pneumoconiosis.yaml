  - preferred_term: respiratory bronchiole
    term:
      id: UBERON:0002188
      label: respiratory bronchiole
  downstream:
  - target: Fibroblast Activation and Myofibroblast Differentiation
  - target: Chronic cough
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26024344
      reference_title: "Small airways involvement in coal mine dust lung disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "There is increasing evidence supporting an important association of abnormalities in the small peripheral airways with the development of respiratory symptoms"
      explanation: >-
        Sources this specific edge: small-airway abnormality producing
        respiratory symptoms, of which chronic cough is the characteristic one.
  evidence:
  - reference: PMID:26024344
    reference_title: "Small airways involvement in coal mine dust lung disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inflammatory changes in the small airways have long been recognized as the signature lung pathology among coal miners."
    explanation: >-
      Establishes sustained small-airway inflammation as the defining, and

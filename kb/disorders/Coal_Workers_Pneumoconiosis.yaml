  description: >-
    Myofibroblasts deposit collagen and reticulin around the dust-laden
    macrophage collection at the respiratory bronchiole, producing the coal
    macule — the histopathologic hallmark lesion of CWP. Macules aggregate into
    micronodules and nodules that become visible as small rounded opacities on

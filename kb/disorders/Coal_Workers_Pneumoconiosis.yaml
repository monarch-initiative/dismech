    modifier: INCREASED
  downstream:
  - target: Peribronchiolar Collagen Deposition and Coal Macule Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36581638
      reference_title: "Coal dust nanoparticles induced pulmonary fibrosis by promoting inflammation and epithelial-mesenchymal transition via the NF-κB/NLRP3 pathway driven by IGF1/ROS-mediated AKT/GSK3β signals."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "During the formation of PF, differentiation of lung fibroblasts into myofibroblasts cooperates with the upregulation of α-smooth muscle actin (α-SMA) and the synthesis of collagens to form the extracellular matrix (ECM)"
      explanation: >-
        Sources this specific edge: the myofibroblast transition is what
        produces the collagen and matrix that build the lesion.

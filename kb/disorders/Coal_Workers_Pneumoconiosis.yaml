has_subtypes:
- name: Simple CWP
  display_name: Simple (Uncomplicated) Coal Workers' Pneumoconiosis
  description: >-
    The early form, defined radiographically by small rounded opacities
    (ILO profusion categories 1-3) reflecting coal macules and micronodules,
    without conglomerate masses. Frequently asymptomatic and detected only on
    surveillance radiography, which is what makes periodic screening the key
    intervention window.
  evidence:
  - reference: PMID:41411198
    reference_title: "Coal Workers' Pneumoconiosis-Associated Deaths - United States, 2020-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early pneumoconiosis can be asymptomatic, but advanced disease often leads to disability and premature death."
    explanation: >-
      Establishes the asymptomatic early stage that distinguishes simple CWP
      from the complicated form, and why it is found by screening rather than
      by symptoms.
- name: Complicated CWP
  display_name: Complicated CWP / Progressive Massive Fibrosis (PMF)
  description: >-
    Defined by conglomerate fibrotic masses one centimetre or larger (ILO large
    opacity categories A, B, C) formed by coalescence of nodular lesions. Carries
    a substantially worse prognosis than simple CWP and is characteristically
    relentless — it can progress after dust exposure ends. Its prevalence in
    long-tenured central Appalachian miners has risen roughly tenfold from a late
    1990s nadir.
  evidence:
  - reference: PMID:35353671
    reference_title: "Pathology and Mineralogy Demonstrate Respirable Crystalline Silica Is a Major Cause of Severe Pneumoconiosis in U.S. Coal Miners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the prevalence of PMF has increased from 0.33% to 3.2% in miners with 25 years or more of tenure"
    explanation: >-
      Quantifies the resurgence of the complicated form among long-tenured
      central Appalachian miners. Note this sentence sits in the cited paper's
      introduction and carries its own citations; the primary surveillance
      reports are the source of record for the figure itself.
  - reference: PMID:31302880
    reference_title: "Current Review of Pneumoconiosis Among US Coal Miners."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "respiratory morbidity including ongoing fibrosis and functional impairment can occur after exposure ceases"
    explanation: >-
      Sources the claim that this subtype keeps progressing once dust exposure
      has ended, which is what separates its prognosis from simple CWP.
- name: Rapidly Progressive Pneumoconiosis
  display_name: Rapidly Progressive Pneumoconiosis (RPP)
  description: >-
    An accelerated presentation in which radiographic profusion advances unusually
    fast, often in younger miners with shorter tenure. Lung pathology in these
    cases shows features of accelerated silicosis and mixed-dust lesions with
    abundant birefringent silica and silicates rather than the classic
    coal-predominant macule, so this subtype is better understood as a
    silica-driven variant of coal mine dust lung disease than as fast simple CWP.
  evidence:
  - reference: PMID:26513613
    reference_title: "Lung Pathology in U.S. Coal Workers with Rapidly Progressive Pneumoconiosis Implicates Silica and Silicates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirteen cases were reviewed, many of which had features of accelerated silicosis and mixed dust lesions."
    explanation: >-
      Documents that rapidly progressive cases carry accelerated-silicosis and
      mixed-dust histology rather than the classic coal macule pattern.
  - reference: PMID:26513613
    reference_title: "Lung Pathology in U.S. Coal Workers with Rapidly Progressive Pneumoconiosis Implicates Silica and Silicates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that rapidly progressive pneumoconiosis in these miners was associated with exposure to coal mine dust containing high concentrations of respirable silica and silicates."
    explanation: >-
      Attributes the rapidly progressive subtype to the silica and silicate
      fraction of the dust, the basis for treating it as a distinct subtype.
pathophysiology:
- name: Respirable Coal Mine Dust Deposition and Retention
  description: >-
    Respirable coal mine dust — a heterogeneous mixture of carbonaceous coal
    particles, crystalline silica, and other silicate minerals — is small enough
    to escape upper-airway defences and deposit in the terminal bronchioles and
    alveoli, beyond the reach of mucociliary clearance. Cumulative retained dust
    burden, not any single exposure, is the driving quantity.
  role: trigger
  biological_scale: TISSUE
  locations:
  - preferred_term: respiratory bronchiole
    term:
      id: UBERON:0002188
      label: respiratory bronchiole
  - preferred_term: pulmonary alveolus
    term:
      id: UBERON:0002299
      label: alveolus of lung
  downstream:
  - target: Alveolar Macrophage Phagocytosis of Retained Dust
  - target: Silica-Enriched Dust Burden
  evidence:
  - reference: PMID:41411198
    reference_title: "Coal Workers' Pneumoconiosis-Associated Deaths - United States, 2020-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coal workers' pneumoconiosis (CWP) is a preventable, progressive occupational lung disease caused by inhaling respirable coal mine dust, a complex mixture commonly containing coal, crystalline silica, and other silicate minerals."
    explanation: >-
      Establishes inhaled respirable coal mine dust as the necessary cause and
      names the three mineral fractions of the deposited material.
  - reference: PMID:35831008
    reference_title: "Understanding the pathogenesis of occupational coal and silica dust-associated lung disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the lesions and macules comprise inhaled coal dust particles engulfed in alveolar macrophages and surrounded by inflammatory cells"
    explanation: >-
      Establishes that the retained particles are coal dust specifically, sitting
      inside alveolar macrophages in the lesion — the deposition-and-retention
      step this node represents, rather than a general statement about ambient
      particulate matter.
- name: Silica-Enriched Dust Burden
  description: >-
    The crystalline silica and silicate fraction of the retained dust, which in
    contemporary thin-seam mining is markedly higher than historically because
    accessing thin coal seams requires cutting silica-bearing rock strata. Silica
    is far more cytotoxic and fibrogenic per particle than carbonaceous coal, so
    a silica-enriched burden shifts the disease toward the accelerated and
    silica-type severe forms rather than merely producing more of the same
    lesion.
  role: driver
  biological_scale: TISSUE
  downstream:
  - target: Alveolar Macrophage Phagocytosis of Retained Dust
  - target: Nodule Coalescence into Progressive Massive Fibrosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37295943
      reference_title: "Historical shift in pathological type of progressive massive fibrosis among coal miners in the USA."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These results are further evidence of the prominent role of RCS in the pathogenesis of pneumoconiosis among contemporary US coal miners."
      explanation: >-
        Sources the edge from the silica fraction of the retained burden to the
        severe conglomerate disease, which is the causal claim this link makes.
  evidence:
  - reference: PMID:35353671
    reference_title: "Pathology and Mineralogy Demonstrate Respirable Crystalline Silica Is a Major Cause of Severe Pneumoconiosis in U.S. Coal Miners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In situ mineralogic analysis showed that the percentage (26.1% vs. 17.8%; P < 0.01) and concentration (47.3 × 108 vs. 25.8 × 108 particles/cm3; P = 0.036) of silica particles were significantly greater in specimens from contemporary miners compared with their historical counterparts."
    explanation: >-
      Directly measures the silica fraction of retained lung dust and shows it
      has risen in contemporary miners, which is the mineralogic basis for this
      node.
  - reference: PMID:26513613
    reference_title: "Lung Pathology in U.S. Coal Workers with Rapidly Progressive Pneumoconiosis Implicates Silica and Silicates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Polarized light microscopy revealed large amounts of birefringent mineral dust particles consistent with silica and silicates; carbonaceous coal dust was less prominent."
    explanation: >-
      Shows silica and silicates dominating over carbonaceous coal in the
      retained dust of severe contemporary cases, supporting a distinct
      silica-enriched burden rather than simply more coal.
  - reference: PMID:35831008
    reference_title: "Understanding the pathogenesis of occupational coal and silica dust-associated lung disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In contrast to coal dust, silica dust is considered more toxic and potent in eliciting oxidative stress and cellular inflammation in the lungs"
    explanation: >-
      Sources the comparative-potency half of this node's claim, which the
      mineralogy evidence above does not address: the mineralogy says how much
      silica is present, this says why that matters per particle.
- name: Alveolar Macrophage Phagocytosis of Retained Dust
  description: >-
    Alveolar macrophages recognize and internalize the deposited particles in an
    attempt to clear them. Coal and silica particles are poorly biodegradable, so
    the macrophage cannot resolve the load and instead becomes the persistently
    activated cell around which the lesion is built.
  role: driver
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: INCREASED
  downstream:
  - target: Reactive Oxygen Species Generation and Oxidative Injury
  - target: Dust-Laden Macrophage Death
  evidence:
  - reference: PMID:26024344
    reference_title: "Small airways involvement in coal mine dust lung disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Human and laboratory studies have suggested oxidant injury, and increased recruitment and activity of macrophages play important roles in dust-induced lung injury."
    explanation: >-
      Places increased macrophage recruitment and activity, alongside oxidant
      injury, at the centre of coal-dust lung injury.
  - reference: PMID:35831008
    reference_title: "Understanding the pathogenesis of occupational coal and silica dust-associated lung disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the lesions and macules comprise inhaled coal dust particles engulfed in alveolar macrophages and surrounded by inflammatory cells"
    explanation: >-
      States the phagocytic uptake this node annotates: coal dust particles
      engulfed by alveolar macrophages, and the lesion built around them.
- name: Reactive Oxygen Species Generation and Oxidative Injury
  description: >-
    Dust-laden macrophages and the reactive particle surfaces generate reactive
    oxygen species that overwhelm local antioxidant defences. Reactive oxygen
    species are the shared upstream signal feeding both the inflammasome branch
    and the epithelial injury branch of the cascade.
  role: driver
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: reactive oxygen species metabolic process
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  downstream:
  - target: Macrophage Mitochondrial Dysfunction and Defective Mitophagy
  - target: NF-kappaB and NLRP3 Inflammasome Activation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36581638
      reference_title: "Coal dust nanoparticles induced pulmonary fibrosis by promoting inflammation and epithelial-mesenchymal transition via the NF-κB/NLRP3 pathway driven by IGF1/ROS-mediated AKT/GSK3β signals."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ROS can induce the activation of AKT/GSK3β signaling, and inhibition of it can inhibit ROS-induced inflammation and EMT by the NF-kB/NLRP3 axis, thereby inhibiting PF."
      explanation: >-
        Sources this specific edge from the study's own inhibition experiments:
        blocking the pathway between reactive oxygen species and NF-kappaB/NLRP3
        abolishes the downstream inflammation, which is what makes it an edge
        rather than a correlation.
  - target: Alveolar Epithelial Injury and Epithelial-Mesenchymal Transition
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36581638
      reference_title: "Coal dust nanoparticles induced pulmonary fibrosis by promoting inflammation and epithelial-mesenchymal transition via the NF-κB/NLRP3 pathway driven by IGF1/ROS-mediated AKT/GSK3β signals."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "activation of the IGF1/IGF1R axis induced generation of reactive oxygen species (ROS) to promote epithelial-mesenchymal transition (EMT) in alveolar epithelial cells (AECs) to accelerate PF"
      explanation: >-
        Sources this specific edge: reactive oxygen species promoting
        epithelial-mesenchymal transition in alveolar epithelial cells.
  evidence:
  - reference: PMID:15364596
    reference_title: "Lung oxidative response after acute coal dust exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TBARS were increased 60 days after coal dust exposure and protein carbonyl groups increased at all times after coal dust exposure (48 h, 7 days, 30 days, and 60 days)."
    explanation: >-
      Direct in vivo measurement of lipid peroxidation and protein oxidation in
      coal-dust-exposed lung, which is the oxidative injury this node asserts
      rather than an inference from a signalling pathway in one cell type.
  - reference: PMID:36581638
    reference_title: "Coal dust nanoparticles induced pulmonary fibrosis by promoting inflammation and epithelial-mesenchymal transition via the NF-κB/NLRP3 pathway driven by IGF1/ROS-mediated AKT/GSK3β signals."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "activation of the IGF1/IGF1R axis induced generation of reactive oxygen species (ROS) to promote epithelial-mesenchymal transition (EMT) in alveolar epithelial cells (AECs) to accelerate PF"
    explanation: >-
      Supports the edge from reactive oxygen species to epithelial-mesenchymal
      transition in alveolar epithelial cells, one of the two branches this node
      feeds. Note this branch is epithelial; the macrophage-derived and
      particle-surface oxidant claim rests on the in vivo item above.
  - reference: PMID:36581638
    reference_title: "Coal dust nanoparticles induced pulmonary fibrosis by promoting inflammation and epithelial-mesenchymal transition via the NF-κB/NLRP3 pathway driven by IGF1/ROS-mediated AKT/GSK3β signals."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ROS induced inflammation and EMT by the activation of the NF-kB/NLRP3 axis to accelerate PF"
    explanation: >-
      Supports the other branch: reactive oxygen species acting through the
      NF-kappaB/NLRP3 axis to drive inflammation.
- name: Macrophage Mitochondrial Dysfunction and Defective Mitophagy
  description: >-
    Coal-silica dust collapses mitochondrial membrane potential and impairs
    oxidative phosphorylation in macrophages, while suppressing PINK1/Parkin
    signalling so the damaged mitochondria are not cleared. The failure of
    mitochondrial quality control amplifies the oxidant load and feeds both
    macrophage death and the inflammatory output, rather than being a passive
    consequence of them.
  role: driver
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: mitophagy
    term:
      id: GO:0000423
      label: mitophagy
    modifier: DECREASED
  downstream:
  - target: Dust-Laden Macrophage Death
  - target: Sustained Inflammatory Cell Recruitment and Amplification
  evidence:
  - reference: PMID:41894156
    reference_title: "Activation of Mitophagy by Kinetin Mitigates Coal-Silica Mixed Dust-Induced Pulmonary Fibrosis via Modulating Macrophage Mitochondrial Function in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CSD exposure triggered ROS accumulation, mitochondrial membrane potential collapse, and impaired oxidative phosphorylation, leading to reduced adenosine triphosphate synthesis."
    explanation: >-
      Measures the mitochondrial dysfunction this node asserts, in a
      coal-silica mixed dust exposure rather than in a generic particulate
      model.
  - reference: PMID:41894156
    reference_title: "Activation of Mitophagy by Kinetin Mitigates Coal-Silica Mixed Dust-Induced Pulmonary Fibrosis via Modulating Macrophage Mitochondrial Function in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CSD suppressed PINK1/Parkin signaling and diminished LC3B mitochondrial recruitment, resulting in defective mitophagy"
    explanation: >-
      Sources the defective-mitophagy half of the node and names the pathway
      through which clearance fails.
  notes: >-
    Demonstrated in mice and cells, not in human coal miner tissue, and the
    branch was added on a reviewer's suggestion after the report flagged its
    translational status as unconfirmed. It is curated because the rescue arm
    below makes it a testable causal claim rather than an observation, but the
    human evidence is not there yet.
- name: Dust-Laden Macrophage Death
  description: >-
    Poorly biodegradable particles — the silica fraction especially — are
    cytotoxic to the macrophages that ingested them, and pro-apoptotic signalling
    rises in the alveolar compartment after coal dust exposure. Particles freed by
    dying cells are available for re-uptake by newly recruited macrophages, a loop
    that keeps the lesion building without further inhaled dust. How much of the
    early injury this cell death actually accounts for is contested; see the
    refuting evidence below.
  role: driver
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Alveolar and Small-Airway Tissue Injury
  evidence:
  - reference: PMID:16966090
    reference_title: "Apoptosis and Bax expression are increased by coal dust in the polycyclic aromatic hydrocarbon-exposed lung."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In rats exposed to BNF, CD exposure increased alveolar expression of the proapoptotic mediator Bax but decreased CYP1A1 induction relative to BNF exposure alone."
    explanation: >-
      Indirect on two counts, both material. The pro-apoptotic response is
      measured under co-exposure to beta-naphthoflavone rather than to coal dust
      alone, and the assay localizes to alveolar cells generally rather than to
      macrophages specifically. Quoted in full so the conditional survives.
  - reference: PMID:16966090
    reference_title: "Apoptosis and Bax expression are increased by coal dust in the polycyclic aromatic hydrocarbon-exposed lung."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Combined BNF and CD exposure increased Bax expression and apoptosis in the lung, but Bax and apoptosis were not the major determinants of early lung injury in this model."
    explanation: >-
      The same study's own conclusion argues against apoptosis being the main
      driver of early injury. Curated as a REFUTE item rather than omitted,
      because the supporting quote above comes from the same paper and reading
      one without the other would overstate the node.
- name: Alveolar and Small-Airway Tissue Injury
  description: >-
    The cumulative tissue-level result of retained dust, macrophage death and
    oxidant exposure: structural and functional damage concentrated in the
    alveoli and the small conducting airways, which is where the dust sits and
    where the reparative program is then triggered.
  role: driver
  conforms_to: "fibrotic_response#Tissue Injury"
  biological_scale: TISSUE
  locations:
  - preferred_term: respiratory bronchiole
    term:
      id: UBERON:0002188
      label: respiratory bronchiole
  biological_processes:
  - preferred_term: wound healing
    term:
      id: GO:0042060
      label: wound healing
    modifier: DYSREGULATED
  downstream:
  - target: Sustained Inflammatory Cell Recruitment and Amplification
  evidence:
  - reference: PMID:26024344
    reference_title: "Small airways involvement in coal mine dust lung disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inhalation of coal mine dust results in a spectrum of symptoms, dysfunction, and pathological changes in the respiratory tract that collectively have been labeled coal mine dust lung disease."
    explanation: >-
      Sources the tissue-injury claim this node makes, and the coal mine dust
      lung disease framing under which the injury is classified.
  - reference: PMID:26024344
    reference_title: "Small airways involvement in coal mine dust lung disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pathologic changes associated with mineral dust deposition in the small airways may be of particular importance in contemporary miners with rapidly progressive respiratory impairment."
    explanation: >-
      Localizes the injury to the small airways, the anatomical claim this node
      makes, and ties it to the contemporary rapidly progressive presentation.
- name: NF-kappaB and NLRP3 Inflammasome Activation
  description: >-
    Reactive oxygen species and retained particles activate NF-kappaB signalling
    and assembly of the NLRP3 inflammasome in macrophages and epithelial cells,
    activating caspase-1 and releasing mature IL-1beta and IL-18. This converts
    a particle-handling problem into a sustained cytokine signal.
  role: driver
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
    modifier: INCREASED
  - preferred_term: positive regulation of canonical NF-kappaB signal transduction
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: INCREASED
  downstream:
  - target: Sustained Inflammatory Cell Recruitment and Amplification
  evidence:
  - reference: PMID:36581638
    reference_title: "Coal dust nanoparticles induced pulmonary fibrosis by promoting inflammation and epithelial-mesenchymal transition via the NF-κB/NLRP3 pathway driven by IGF1/ROS-mediated AKT/GSK3β signals."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the protein levels of p-NF-κB(Ser536)/NF-κB, NLRP3 and Cleaved Caspase1(Asp297)/Caspase1 in the lung tissues, as well as the contents of IL-1β and CXCL2 in the bronchoalveolar lavage fluid, were significantly increased in CD-NPs-induced pre-fibrosis model mice"
    explanation: >-
      The study's own in vivo measurement of every component this node asserts —
      NF-kappaB phosphorylation, NLRP3, cleaved caspase-1 and the IL-1beta
      output — in coal-dust-exposed mouse lung.
  - reference: PMID:36581638
    reference_title: "Coal dust nanoparticles induced pulmonary fibrosis by promoting inflammation and epithelial-mesenchymal transition via the NF-κB/NLRP3 pathway driven by IGF1/ROS-mediated AKT/GSK3β signals."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "p-NF-κB(Ser536)/NF-κB was significantly increased in the CD-NPs-induced pre-fibrotic cell model and could be inhibited by PPP for 24 h"
    explanation: >-
      The cell-model counterpart, with pharmacological inhibition establishing
      that the NF-kappaB activation is coal-dust-driven rather than incidental.
- name: Sustained Inflammatory Cell Recruitment and Amplification
  description: >-
    IL-1beta, IL-18, TNF-alpha and chemokines recruit neutrophils and further
    macrophages to the peribronchiolar region. Because the retained dust is never
    cleared, the recruitment does not resolve, and the small airways carry the
    signature chronic inflammatory change of coal miners' lungs.
  role: driver
  conforms_to: "fibrotic_response#Inflammatory Recruitment and Amplification"
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:

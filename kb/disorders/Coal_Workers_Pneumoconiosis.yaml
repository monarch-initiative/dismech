    evidence:
    - reference: PMID:37284491
      reference_title: "Serum Osteopontin, KL-6, and Syndecan-4 as Potential Biomarkers in the Diagnosis of Coal Workers' Pneumoconiosis: A Case-Control Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The pulmonary function parameters decreased sequentially, and the serum OPN, KL-6, Syndecan-4 and Gremlin-1 concentrations were increased sequentially among the HC, DEW and CWP groups."
      explanation: >-
        Shows serum osteopontin rising stepwise with exposure and disease

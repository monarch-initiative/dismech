- name: Alveolar Epithelial Injury and Epithelial-Mesenchymal Transition
  description: >-
    Injured alveolar epithelial cells undergo epithelial-mesenchymal transition,
    losing epithelial identity and acquiring a mesenchymal, matrix-producing
    phenotype. This is a second route into the fibroblast pool, parallel to
    activation of resident fibroblasts by the inflammatory milieu.
  role: driver
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: alveolar type II epithelial cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition
    term:
      id: GO:0001837
      label: epithelial to mesenchymal transition
    modifier: INCREASED
  downstream:
  - target: Fibroblast Activation and Myofibroblast Differentiation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36581638
      reference_title: "Coal dust nanoparticles induced pulmonary fibrosis by promoting inflammation and epithelial-mesenchymal transition via the NF-κB/NLRP3 pathway driven by IGF1/ROS-mediated AKT/GSK3β signals."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "EMT promotes myofibroblast activation and ECM production"
      explanation: >-
        Sources this specific edge: epithelial-mesenchymal transition feeding
        myofibroblast activation and matrix production.
  evidence:
  - reference: PMID:36581638
    reference_title: "Coal dust nanoparticles induced pulmonary fibrosis by promoting inflammation and epithelial-mesenchymal transition via the NF-κB/NLRP3 pathway driven by IGF1/ROS-mediated AKT/GSK3β signals."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Injured lung epithelial cells can exhibit a myofibroblastic phenotype by EMT, which contributes to abnormal wound healing and fibrosis"
    explanation: >-
      Supports the edge from this node to myofibroblast generation: epithelial
      injury feeds the fibroblast pool by transition, not only by signalling.
  - reference: PMID:36581638
    reference_title: "Coal dust nanoparticles induced pulmonary fibrosis by promoting inflammation and epithelial-mesenchymal transition via the NF-κB/NLRP3 pathway driven by IGF1/ROS-mediated AKT/GSK3β signals."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CD-NPs induced PF by promoting inflammation and EMT via the NF-κB/NLRP3 pathway driven by IGF1/ROS-mediated AKT/GSK3β signals."
    explanation: >-
      The study's overall conclusion, placing epithelial-mesenchymal transition
      downstream of coal dust and upstream of pulmonary fibrosis. Demonstrated
      with coal dust nanoparticles in cell and mouse systems; that nanoparticle
      fraction is a component of, not a substitute for, the respirable coal mine
      dust miners inhale.
- name: Fibroblast Activation and Myofibroblast Differentiation
  description: >-
    Resident lung fibroblasts, together with cells arriving via
    epithelial-mesenchymal transition, differentiate into alpha-smooth-muscle-actin
    positive myofibroblasts under TGF-beta and inflammatory cytokine signalling.
    This is the central effector step: from here the lesion is matrix, not
    inflammation.
  role: central_effector
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: lung fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: myofibroblast
    term:
      id: CL:0000186

- name: Focal Centrilobular Emphysema
  description: >-
    Destruction of alveolar walls immediately around the coal macule produces
    focal centrilobular emphysema. This is the obstructive component of coal mine
    dust lung disease and runs alongside the restrictive fibrotic component
    rather than replacing it, which is why advanced disease is characteristically
    a mixed defect.

    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support previous studies showing that exposure to coal mine dust and respirable silica leads to increased mortality from malignant and non-malignant respiratory diseases even in the absence of smoking."
    explanation: >-
      Supports dust-attributable non-malignant respiratory disease, including the
      obstructive/emphysematous component, independent of smoking.
- name: Restrictive ventilatory defect
  category: Respiratory

- reference: PMID:41411198
  title: "Coal Workers' Pneumoconiosis-Associated Deaths - United States, 2020-2023."
- reference: PMID:35353671
  title: "Pathology and Mineralogy Demonstrate Respirable Crystalline Silica Is a Major Cause of Severe Pneumoconiosis in U.S. Coal Miners."

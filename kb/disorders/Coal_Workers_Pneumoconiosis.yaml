differential_diagnoses:
- name: Caplan Syndrome
  disease_term:
    preferred_term: Caplan syndrome
    term:
      id: MONDO:0005690
      label: Caplan syndrome
  description: >-
    Rheumatoid pneumoconiosis: well-defined peripheral pulmonary nodules with
    necrobiotic centres retaining mineral dust, arising in a dust-exposed worker
    who also has rheumatoid arthritis. First described in Welsh coal miners, and
    a genuine consideration in any miner presenting with nodules.
  distinguishing_features:
  - Coexisting rheumatoid arthritis, which ordinary CWP does not require
  - Peripheral, well-defined nodules rather than the upper-zone rounded opacities of simple CWP
  - Necrobiotic nodule centre retaining mineral dust
  - Nodules may appear before, at, or years after the arthritis is diagnosed
  evidence:
  - reference: PMID:34027516
    reference_title: "Caplan's Syndrome with a twist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classically, they form peripheral well-defined pulmonary nodules with characteristic silica retained in the necrobiotic center."
    explanation: >-
      Describes the nodule morphology and retained mineral dust that separate
      Caplan syndrome from ordinary rheumatoid lung nodules and from the coal
      macule.
  - reference: PMID:34027516
    reference_title: "Caplan's Syndrome with a twist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Caplan's syndrome also known as rheumatoid pneumoconiosis is a disease entity that is seen in patients with rheumatoid arthritis (RA) exposed to chronic silica and inorganic dust"
    explanation: >-
      States the exposure range — chronic silica and inorganic dust generally,
      not coal specifically — which is the nosological point behind curating this
      as a differential rather than a coal-dust subtype.
  notes: >-
    Curated as a differential rather than as a CWP subtype because MONDO makes it
    a sibling, not a child: MONDO:0005690 is a direct subclass of MONDO:0015926
    pneumoconiosis, the parent of MONDO:0006654 anthracosis, and it arises on
    silicosis and asbestosis as readily as on coal dust. Recording it under
    has_subtypes would both misstate that nosology and, because subtype terms
    count as curated, retire MONDO:0005690 from the curation queue as though this
    entry covered it.

    The cited case had silica and asbestos exposure rather than coal mining, so
    it is used for the generic rheumatoid-pneumoconiosis lesion and not as a
    coal-miner case. A coal-miner Caplan citation would be a worthwhile addition;
    none was found in the cached reference set.
diagnosis:
- name: Occupational exposure history with ILO-classified chest radiography
  diagnosis_term:
    preferred_term: Chest Radiography
    term:
      id: NCIT:C38103
      label: Chest Radiography
  description: >-
    CWP is diagnosed clinically, not histologically: a compatible coal mine dust
    exposure history plus a characteristic chest radiograph classified under the
    ILO International Classification of Radiographs of Pneumoconioses, read by a
    NIOSH-certified B Reader. Profusion of small opacities is graded 0-3 with
    size categories p/q/r, and large opacities A/B/C define the complicated form.
    Tissue sampling is reserved for atypical presentations or a separate
    indication such as suspected malignancy. Certification matters measurably —
    non-certified readers over-read both presence and severity.
  evidence:
  - reference: PMID:36972614
    reference_title: "Pathology and Mineralogy of the Pneumoconioses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis of silicosis, coal workers’ pneumoconiosis, or asbestosis may be made based on a suggestive occupational history and typical chest imaging without the need for tissue sampling."
    explanation: >-
      States the two-part diagnostic basis this entry uses and that biopsy is
      not required.
  - reference: PMID:36972614
    reference_title: "Pathology and Mineralogy of the Pneumoconioses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A chest radiograph classified using the International Labor Office (ILO) system has been the mainstay for medical surveillance of pneumoconioses in dusty trades."
    explanation: >-
      Sources the ILO classification as the standard instrument, which the
      subtype definitions in this entry are stated in terms of.
  - reference: PMID:31302880
    reference_title: "Current Review of Pneumoconiosis Among US Coal Miners."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Certified B Readers are physicians who have successfully passed the certification examination, demonstrating competence with the ILO system."
    explanation: >-
      Sources the B Reader certification that the surveillance program depends
      on for consistent classification.
  - reference: PMID:31302880
    reference_title: "Current Review of Pneumoconiosis Among US Coal Miners."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Specifically, compared to B Readers, physicians who have not passed the certification examination tend to over-read for disease presence and severity."
    explanation: >-
      Quantifies why the certification is a diagnostic requirement rather than a
      formality — uncertified reading biases both presence and severity upward.
  notes: >-
    Radiography does not distinguish between the coal-dust-induced interstitial
    lung diseases, so a surveillance "case of CWP" is an opacity-based
    definition rather than a claim about which lesion is present. Genetic testing
    has no diagnostic role; the susceptibility loci curated in `genetic:` are
    research findings.
imaging_findings:
- name: Rounded small opacities on chest radiography
  modality: XRAY
  description: >-
    Small rounded opacities, graded p (up to 1.5 mm), q (1.5-3 mm) and r (3-10
    mm) by the ILO system, corresponding pathologically to coal macules and
    nodules. Irregular opacities in the same films correspond instead to
    interstitial fibrosis, so opacity shape carries lesion information.
  phenotype_term:
    preferred_term: Pulmonary nodule
    term:
      id: HP:0033608
      label: Pulmonary nodule
  diagnostic: true
  evidence:
  - reference: PMID:36972614
    reference_title: "Pathology and Mineralogy of the Pneumoconioses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pathologic studies have shown that rounded opacities on chest imaging correspond to coal macules and coal nodules, and irregular opacities to interstitial fibrosis."
    explanation: >-
      Establishes the radiographic-pathologic correspondence that makes the
      rounded opacity a readout of the macular lesion specifically.
- name: Nodules on high-resolution CT not visible on plain radiography
  modality: CT
  description: >-
    HRCT detects parenchymal nodules in miners whose plain films are classified
    ILO category 0/0, so radiographic surveillance under-calls early disease.
    This is a sensitivity gap in the diagnostic standard rather than a competing
    diagnostic criterion.
  evidence:
  - reference: PMID:8404184
    reference_title: "High-resolution CT in simple coal workers' pneumoconiosis. Lack of correlation with pulmonary function tests and arterial blood gas values."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By HRCT, nodules were identified in 12 miners; 4 of 9 were classified as category 0/0 CWP"
    explanation: >-
      Directly measures the under-detection: nodules on HRCT in miners the ILO
      film classification called normal.
histopathology:
- name: Coal macule
  description: >-
    Black pigment deposited around the walls of respiratory bronchioles and
    alveolar ducts, comprising dust-laden macrophages with reticulin and
    collagen. The earliest lesion of CWP and, with the coal nodule, what
    pathologically defines the simple form.
  diagnostic: true
  evidence:
  - reference: PMID:36972614
    reference_title: "Pathology and Mineralogy of the Pneumoconioses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The coal macule is the earliest lesion to form and consists of black pigment deposited around walls of respiratory bronchioles and alveolar ducts."
    explanation: >-
      Defines the lesion and fixes its anatomical location at the respiratory
      bronchiole, matching the pathophysiology node that builds it.
  - reference: PMID:36972614
    reference_title: "Pathology and Mineralogy of the Pneumoconioses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Simple CWP is pathologically defined by the presence of coal macules and nodules."
    explanation: >-
      Makes the macule the defining histologic criterion for the simple subtype
      curated in has_subtypes.
- name: Mineral dust alveolar proteinosis
  description: >-
    Accumulation of surfactant-like material in alveoli, a marker of very heavy
    dust burden. Substantially more common in contemporary US miners than in
    their historical counterparts, tracking the same silica-enriched exposure
    shift as silica-type PMF.
  evidence:
  - reference: PMID:35353671
    reference_title: "Pathology and Mineralogy Demonstrate Respirable Crystalline Silica Is a Major Cause of Severe Pneumoconiosis in U.S. Coal Miners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mineral dust alveolar proteinosis was also more common in contemporary miners compared with their historical counterparts (70% vs. 37%; P < 0.01)."
    explanation: >-
      Quantifies the finding and its historical shift in autopsy material from
      US coal miners with progressive massive fibrosis.
discussions:
- discussion_id: emt_human_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does epithelial-mesenchymal transition in alveolar epithelial cells actually
    contribute myofibroblasts to human coal workers' pneumoconiosis, or is the
    EMT branch curated here an artifact of the model system it was demonstrated
    in?
  attaches_to:
  - pathophysiology#Alveolar Epithelial Injury and Epithelial-Mesenchymal Transition
  - pathophysiology#Fibroblast Activation and Myofibroblast Differentiation
  rationale: >-
    The entire EMT branch rests on one study, PMID:36581638. Its in vitro arm
    used A549 — a lung adenocarcinoma line standing in for alveolar type II
    cells — and BEAS-2B, a bronchial line; its in vivo arm gave C57BL/6 mice coal
    dust *nanoparticles*, a fraction of, not a substitute for, the respirable
    coal mine dust miners inhale. No human CWP tissue evidence supports the
    branch.

    Two things make this a mismatch rather than a plain gap. The node binds
    CL:0002063 pulmonary alveolar type 2 cell and asserts type-II EMT in human
    disease on the strength of a carcinoma line's behaviour. And EMT as a source
    of myofibroblasts in human lung fibrosis is contested in its own right, not
    settled background — lineage-tracing work in other fibrotic lung disease has
    repeatedly failed to confirm it. The mechanism is well evidenced in the model;
    whether it operates in a miner's lung is the open question.
  proposed_experiments:
  - experiment_id: emt_lineage_trace_coal_dust
    name: Lineage-traced fate mapping of alveolar type II cells in a coal mine dust model
    description: >-
      Expose alveolar-type-II-lineage-labelled reporter mice to authentic
      respirable coal mine dust rather than to a nanoparticle fraction, and score
      whether labelled cells appear within fibrotic lesions carrying myofibroblast
      markers. Substituting real mine dust for the nanoparticle preparation is the
      point of the experiment, not an incidental detail.
    would_support:
    - pathophysiology#Alveolar Epithelial Injury and Epithelial-Mesenchymal Transition
    supporting_outcome:
    - >-
        Lineage-labelled alveolar type II descendants are found inside coal macules
        and fibrotic foci co-expressing alpha-SMA, in proportion to lesion burden.
    would_refute:
    - pathophysiology#Alveolar Epithelial Injury and Epithelial-Mesenchymal Transition
    refuting_outcome:
    - >-
        Labelled cells remain confined to the epithelium with no alpha-SMA-positive
        descendants in lesions, placing the myofibroblast pool entirely with
        resident mesenchymal cells.
  - experiment_id: emt_marker_human_cwp_tissue
    name: EMT marker localization in human CWP lung tissue
    description: >-
      Apply dual-marker immunohistochemistry for epithelial and mesenchymal
      markers to archived human coal miner lung specimens — the National Coal
      Workers' Autopsy Study material this entry already cites for PMF typing —
      scoring cells at the macule and PMF margins for a transitional phenotype.
    would_support:
    - pathophysiology#Alveolar Epithelial Injury and Epithelial-Mesenchymal Transition
    supporting_outcome:
    - >-
        Cells co-expressing epithelial and mesenchymal markers are enriched at
        lesion margins in miner lung relative to unexposed controls.
    would_refute:
    - pathophysiology#Alveolar Epithelial Injury and Epithelial-Mesenchymal Transition
    refuting_outcome:
    - >-
        No transitional phenotype is detectable at lesion margins, leaving the EMT
        branch unsupported in human tissue.
  notes: >-
    Recorded rather than resolved by deleting the branch: the model evidence is
    real and the branch is the only route by which epithelial injury reaches the
    fibroblast pool in this entry. The point is that its translational status is
    unestablished, not that it is wrong.
animal_models:
- name: Coal-silica mixed dust mouse model with kinetin mitophagy rescue
  species: Mouse
  genotype: Wild-type, with PINK1 overexpression and PINK1 knockdown arms
  publication: PMID:41894156
  description: >-
    Coal-silica mixed dust exposure in mice, with pharmacological mitophagy
    activation (kinetin) as a rescue arm and PINK1 knockdown to test pathway
    dependence. The genetic arms are what make this more than an exposure
    model: abolishing the rescue by knocking down PINK1 establishes the
    mechanism rather than just the association.
  modeled_mechanisms:
  - target: Macrophage Mitochondrial Dysfunction and Defective Mitophagy
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the mitochondrial collapse and mitophagy failure in
      macrophages after mixed coal-silica dust exposure.
    limitations: >-
      Mouse macrophages, and a coal-silica mixture whose ratio need not match
      any particular mine's respirable dust. No human coal miner tissue
      confirmation of the PINK1/Parkin defect exists.
    readouts:
    - name: Mitochondrial membrane potential and oxidative phosphorylation
      target: Macrophage Mitochondrial Dysfunction and Defective Mitophagy
      direction: DECREASED
      interpretation: >-
        Direct functional correlate of the mitochondrial dysfunction node.
      evidence:
      - reference: PMID:41894156
        reference_title: "Activation of Mitophagy by Kinetin Mitigates Coal-Silica Mixed Dust-Induced Pulmonary Fibrosis via Modulating Macrophage Mitochondrial Function in Mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "CSD exposure triggered ROS accumulation, mitochondrial membrane potential collapse, and impaired oxidative phosphorylation, leading to reduced adenosine triphosphate synthesis."
        explanation: >-
          Reports the measurement behind this readout and its direction.
    - name: PINK1/Parkin-mediated mitophagy after kinetin treatment
      target: Macrophage Mitochondrial Dysfunction and Defective Mitophagy
      direction: RESTORED
      interpretation: >-
        The rescue arm. Restoring mitophagy reverses the downstream inflammation
        and fibrosis, which is what makes the node causal rather than
        correlative.
      evidence:
      - reference: PMID:41894156
        reference_title: "Activation of Mitophagy by Kinetin Mitigates Coal-Silica Mixed Dust-Induced Pulmonary Fibrosis via Modulating Macrophage Mitochondrial Function in Mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "kinetin treatment and PINK1 overexpression restored PINK1/Parkin activation and LC3II-dependent mitophagy, alleviated mitochondrial dysfunction, and suppressed subsequent macrophage inflammation and pulmonary fibrosis."
        explanation: >-
          Documents the restoration and that it suppressed the downstream
          inflammation and fibrosis, the direction this readout records.
  - target: Nodule Coalescence into Progressive Massive Fibrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Produces pulmonary fibrosis after mixed-dust exposure, but on a
      months-long murine timescale.
    limitations: >-
      Murine fibrosis after weeks to months of instilled mixed dust is not the
      conglomerate mass lesion that defines human PMF after decades of
      inhalation. The model speaks to fibrogenesis, not to mass formation.
    evidence:
    - reference: PMID:41894156
      reference_title: "Activation of Mitophagy by Kinetin Mitigates Coal-Silica Mixed Dust-Induced Pulmonary Fibrosis via Modulating Macrophage Mitochondrial Function in Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Kinetin exerts its antifibrotic effects on CWP by promoting PINK1-mediated mitophagy, improving mitochondrial function, and alleviating macrophage inflammation."
      explanation: >-
        Establishes a fibrotic endpoint in the model that responds to the
        mechanism-directed intervention.
- name: Coal dust particle instillation mouse model with vitamin D rescue
  species: Mouse
  genotype: Wild-type
  publication: PMID:35057792
  description: >-
    Long-course coal dust particle exposure (nine months) with single-cell
    transcriptomic readout and a vitamin D treatment arm. The dust used was
    characterized as under 5 microns with under 10% silica, so unlike the model
    above this one isolates the coal-predominant exposure.
  modeled_mechanisms:
  - target: Alveolar and Small-Airway Tissue Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces alveolar structural destruction and activation of inflammatory
      and cell-death pathways after sustained coal dust exposure.
    limitations: >-
      Nine months in a mouse compresses what takes one to several decades in a
      miner, and instillation bypasses the aerodynamic deposition that
      determines where inhaled dust actually lands.
    readouts:
    - name: Alveolar structure and pulmonary microenvironment integrity
      target: Alveolar and Small-Airway Tissue Injury
      direction: DECREASED
      interpretation: >-
        Structural correlate of the tissue injury node in a coal-predominant
        exposure.
      evidence:
      - reference: PMID:35057792
        reference_title: "Coal dust exposure triggers heterogeneity of transcriptional profiles in mouse pneumoconiosis and Vitamin D remedies."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Alveolar structure and pulmonary microenvironment were destroyed, inflammatory and death (apoptosis, autophagy, and necrosis) pathways were activated, leading to pneumoconiosis in post 9 months coal dust stimulation."
        explanation: >-
          Reports the structural destruction and pathway activation behind this
          readout, on a stated timescale.
  - target: Fibroblast Activation and Myofibroblast Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces profibrotic signalling and an M2 macrophage population that
      tracks fibrosis, with vitamin D reducing both.
    limitations: >-
      The fibrogenic readout is transcriptional and macrophage-phenotypic rather
      than the alpha-SMA-positive myofibroblast this node names, so it supports
      the surrounding signalling rather than the effector cell itself. Vitamin D
      benefit here is not clinically validated in humans.
    evidence:
    - reference: PMID:35057792
      reference_title: "Coal dust exposure triggers heterogeneity of transcriptional profiles in mouse pneumoconiosis and Vitamin D remedies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Beclin1, LC3B, LAMP2, TGF-ß, and MLPH were up-regulated induced by CDP, promoting autophagy and pulmonary fibrosis."
      explanation: >-
        Documents upregulated TGF-beta and a profibrotic program, the signalling
        this node is annotated with, in a coal-predominant mouse exposure.

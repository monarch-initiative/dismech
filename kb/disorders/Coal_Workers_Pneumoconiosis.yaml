biochemical:
- name: Serum Krebs von den Lungen-6 (KL-6)
  presence: INCREASED
  biomarker_term:
    preferred_term: Krebs von den Lungen-6
    term:
      id: NCIT:C154724
      label: Krebs von den Lungen-6 Measurement
  readouts:
  - target: Alveolar Epithelial Injury and Epithelial-Mesenchymal Transition
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      KL-6 is shed by injured and regenerating alveolar type II cells, so rising
      serum concentration reports the alveolar epithelial injury node rather
      than the fibrotic mass burden directly.
    evidence:
    - reference: PMID:37284491
      reference_title: "Serum Osteopontin, KL-6, and Syndecan-4 as Potential Biomarkers in the Diagnosis of Coal Workers' Pneumoconiosis: A Case-Control Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Compared with HCs, patients with higher OPN, KL-6, Syndecan-4 and Gremlin-1 had higher risk for CWP."
      explanation: >-
        Establishes the positive direction of the marker with respect to
        disease, the claim this readout link makes.
  notes: >-
    A mucin-like glycoprotein released by injured and regenerating alveolar type
    II cells, elevated in CWP and rising stepwise from healthy controls through
    dust-exposed workers to diagnosed patients. Investigational rather than
    established practice; CWP is still diagnosed by exposure history plus
    radiography.
  evidence:
  - reference: PMID:37284491
    reference_title: "Serum Osteopontin, KL-6, and Syndecan-4 as Potential Biomarkers in the Diagnosis of Coal Workers' Pneumoconiosis: A Case-Control Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pulmonary function parameters decreased sequentially, and the serum OPN, KL-6, Syndecan-4 and Gremlin-1 concentrations were increased sequentially among the HC, DEW and CWP groups."
    explanation: >-
      Shows the stepwise rise in serum KL-6 across exposure and disease groups,
      alongside falling pulmonary function.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate logistic regression analysis revealed that SNP2 (rs1800470) CC genotype was associated with decreased risk of CWP (OR = 0.50, 95% CI = 0.32-0.78)"
    explanation: >-
      Reports the protective genotype association with an effect estimate in a
      CWP-specific exposed-control design.
  - reference: PMID:23554640
    reference_title: "Association of transforming growth factor-β1 gene variants with risk of coal workers' pneumoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the SNP5 (rs11466345) GG genotype was associated with an increased risk of CWP (OR = 2.5, 95%CI = 1.36-4.57)"
    explanation: >-
      Reports the risk-increasing genotype at the same locus, showing the

phenotypes:
- name: Pulmonary nodule
  category: Respiratory
  description: >-
    Small rounded opacities on chest radiography, graded by the ILO
    classification for profusion and size, corresponding to coal macules and
    micronodules. This is the defining radiographic finding of simple CWP and,
    because early disease is symptomless, usually the first sign of it.
  phenotype_term:
    preferred_term: Pulmonary nodule
    term:
      id: HP:0033608
      label: Pulmonary nodule
  evidence:
  - reference: PMID:31302880
    reference_title: "Current Review of Pneumoconiosis Among US Coal Miners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extended exposure to the dust that is generated in the process of extracting coal can cause interstitial fibrosis of the lungs that can be visualized by chest radiography."
    explanation: >-
      Sources the radiographic detectability of the dust-induced parenchymal
      lesion on which this phenotype and the whole surveillance program rest.
- name: Pulmonary fibrosis
  category: Respiratory
  description: >-
    Interstitial fibrosis of the lung, ranging from the reticulin and collagen of
    individual coal macules to the conglomerate masses of progressive massive
    fibrosis.
  phenotype_term:
    preferred_term: Pulmonary fibrosis
    term:
      id: HP:0002206
      label: Pulmonary fibrosis

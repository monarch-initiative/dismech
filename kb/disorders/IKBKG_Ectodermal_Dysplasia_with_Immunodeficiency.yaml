    - reference: PMID:16818673
      reference_title: X-linked susceptibility to mycobacteria is caused by mutations in NEMO impairing
        CD40-dependent IL-12 production.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: In conclusion, specific NEMO mutations may selectively target the CD40–NF-κB–c-Rel
        signaling pathway in monocytes and dendritic cells, preventing the production of sufficient
        quantities of IL-12 after T cell stimulation. This results in impaired IFN-γ–mediated immunity

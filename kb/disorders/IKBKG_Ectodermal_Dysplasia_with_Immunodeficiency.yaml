discussions:
- discussion_id: ikbkg_allelic_scope
  kind: INTERPRETATION
  status: OPEN
  prompt: How should immunodeficiency be distinguished from allelic IP and overlapping diagnoses?
  rationale: The assigned MONDO entity is IKBKG immunodeficiency. IP-only Blaschko lesions, retinal
    abnormalities, nonspecific IP dental findings and nail dystrophy are removed from the core phenotype
    set; the separate IP entry is unchanged. Seizures are retained only on new pre-HSCT evidence
    of an M. avium brain lesion. Hypomorphic variants can also produce IP in female relatives. The
    dual EDA/IKBKG families do not establish that every ectodermal feature, particularly their nail
    dystrophy, is attributable to NEMO alone. NEMO exon-5-deletion autoinflammation is another distinct
    allelic presentation, not evidence for a uniform loss-of-function mechanism.
  attaches_to:
  - pathophysiology#Impaired NEMO-dependent NF-kappaB activation
  evidence:
  - reference: DOI:10.1086/316914
    reference_title: A Novel X-Linked Disorder of Immune Deficiency and Hypohidrotic Ectodermal Dysplasia
      Is Allelic to Incontinentia Pigmenti and Due to Mutations in IKK-gamma (NEMO)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The molecular and clinical findings in these families establish HED-ID as a distinct
      X-linked recessive disorder. The phenotype and genetics (recessive vs. dominant) of HED-ID
      differ significantly from those of familial IP.
    explanation: The primary families establish the disease boundary.
  - reference: PMID:22566850
    reference_title: Hypohidrotic ectodermal dysplasia and immunodeficiency with coincident NEMO
      and EDA mutations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Thus in all three of the probands, it is difficult to attribute all of the clinical
      impact to one of the two mutant genes
    explanation: The authors explicitly limit attribution in the EDA/IKBKG dual diagnoses.
- discussion_id: ikbkg_variant_and_assay_scope
  kind: INTERPRETATION
  status: OPEN
  prompt: Which immune defects are shared and which depend on variant and assay?
  rationale: Patient-cell assays must retain their stimulus and genotype. C417 B-cell switching defects
    do not apply to E315A/R319Q B cells; c-Rel activation in the latter is delayed, not absent at
    every time point. The c.268delG family had no NF-kappaB functional assay, so the sequence alone
    does not demonstrate residual signaling. Normal lymphocyte counts or one normal response do not
    exclude immunodeficiency. Raw cytokine, proliferation and NK cytotoxicity assays are functional
    evidence, not extra causal clinical nodes.
  attaches_to:
  - pathophysiology#Impaired innate immune receptor responses
  - pathophysiology#Impaired CD40-dependent B-cell maturation
  - pathophysiology#Impaired CD40-dependent IL-12 and IFN-gamma cooperation
  evidence:
  - reference: PMID:16818673
    reference_title: X-linked susceptibility to mycobacteria is caused by mutations in NEMO impairing
      CD40-dependent IL-12 production.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, the CD40-dependent up-regulation of costimulatory molecules of dendritic cells
      and the proliferation and immunoglobulin class switch of B cells were normal.
    explanation: The selective family assays preserve multiple CD40 outputs.
- discussion_id: ikbkg_cohort_ascertainment
  kind: INTERPRETATION
  status: OPEN
  prompt: How should frequencies from compilations and transplant cohorts be interpreted?
  rationale: Hanson combines reported patients with uneven testing and clinical ascertainment; denominators
    differ by feature. Its pneumococcal response text gives 72% for 13/16 whereas the table gives
    81%, so no categorical frequency is inferred from that inconsistency. Miot is a severe HSCT-selected
    series with overlapping published cases, not an independent population sample. Pre-HSCT findings
    are separated from conditioning toxicity and post-HSCT complications; inconsistent patient IDs
    for vascular events preclude precise reassignment.
    Picard 2011 reports pyogenic bacterial infection in about 90%, mycobacterial infection in
    about 40%, serious viral infection in 19%, and aggregate ectodermal dysplasia in about 90%
    of the NEMO-deficient patients described at that time. These quantitative observations are
    retained here rather than discarded. The review describes up to 100 reported males and bases
    its NEMO infection tables on Hanson 2008 plus unpublished data, so it is not an independent
    population series. More importantly, its infection-occurrence estimates do not measure the
    narrower recurrent-infection phenotypes; the 19% viral composite includes HSV encephalitis,
    adenoviral gastroenteritis and CMV and is not a CMV-specific frequency. The approximately 90%
    ectodermal-dysplasia figure is not a frequency for each individual hair, dental or sweating
    abnormality. Although the numerical estimates fall within repository frequency bands, those
    bands would describe different endpoints from the phenotype entries. No categorical
    frequencies are transferred on that basis; observational study design alone is not the
    reason for declining them. These are NEMO-specific figures, not the separate IκBα cases.
  attaches_to:
  - phenotypes#Hypogammaglobulinemia
  - phenotypes#Impaired specific antibody response
  - phenotypes#Recurrent infections
  - phenotypes#Recurrent mycobacterial infections
  - phenotypes#Severe cytomegalovirus infection
  - has_subtypes#EDA-ID

name: IKBKG ectodermal dysplasia with immunodeficiency
creation_date: '2026-04-24T12:00:00Z'
category: Mendelian
parents:
- hereditary disease
- primary immunodeficiency
- ectodermal dysplasia syndrome
synonyms:
- EDA-ID
- NEMO deficiency syndrome
- X-linked ectodermal dysplasia and immunodeficiency
- anhidrotic ectodermal dysplasia with immunodeficiency
description: IKBKG-related immunodeficiency with or without ectodermal dysplasia is an X-linked disorder
  of NEMO-dependent NF-kappaB signaling. Hypomorphic variants produce variable immune defects, ranging
  from broad infection susceptibility with abnormal hair, teeth and sweating to predominantly mycobacterial
  disease without overt ectodermal dysplasia. Osteopetrosis, lymphedema and inflammatory bowel disease
  occur in subsets. Individual variants affect different receptor and cell-type responses; normal
  immunoglobulin concentrations or preserved responses in one assay do not exclude the disorder.
  Incontinentia pigmenti is a distinct allelic disease curated separately, although female manifestations
  and overlap can occur within immunodeficiency families.

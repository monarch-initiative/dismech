- name: Impaired innate immune receptor responses
  description: Responses to TNF, IL-1 and Toll-like receptor ligands are variably impaired in patient
    cells. This is a conditional pathway defect, not a claim that every response is absent in every
    IKBKG genotype. E315A/R319Q and other variants can preserve several tested innate responses.
  evidence:
  - reference: PMID:18851874
    reference_title: Hypomorphic nuclear factor-kappaB essential modulator mutation database and
      reconstitution system identifies phenotypic and immunologic diversity.
    supports: SUPPORT
    evidence_source: IN_VITRO

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: gut-infiltrating immune cells were strongly stained for nuclear p65, indicating normal
      NEMO function, whereas intestinal epithelial cells had no nuclear p65, suggesting the possible
      involvement of an intrinsic NF-κB signaling defect in intestinal epithelial cells.

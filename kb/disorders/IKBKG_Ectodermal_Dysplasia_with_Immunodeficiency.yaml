- name: Impaired CD40-dependent B-cell maturation
  description: C417R/C417Y patient B cells have impaired c-Rel activation, class-switch recombination
    and somatic hypermutation despite preserved induction of AID. This route explains a subset of
    humoral defects and is not transferred to E315A/R319Q patients with preserved B-cell CD40 responses.
  evidence:
  - reference: PMID:15578091
    reference_title: Specific NEMO mutations impair CD40-mediated c-Rel activation and B cell terminal
      differentiation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here we report that patient B cells are characterized by an absence of Ig somatic hypermutation
      (SHM) and defective class switch recombination (CSR) despite normal induction of activation-induced
      cytidine deaminase (AID) and Iepsilon-Cepsilon transcripts.
    explanation: Functional studies in selected C417-mutant patient B cells establish impaired terminal
      maturation without an AID-expression deficiency.
  downstream:
  - target: Hypogammaglobulinemia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Defective terminal B-cell maturation provides a qualified explanation for this humoral
      finding in switching-defective genotypes. It is not established as the sole route in every
      individual contributing a clinical observation.
    evidence:
    - reference: PMID:15578091

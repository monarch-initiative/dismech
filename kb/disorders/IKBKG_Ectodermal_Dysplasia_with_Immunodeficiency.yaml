  description: 'An epithelial contribution to NEMO-associated colitis is supported by persistent
    or new colitis after HSCT, compartment-specific p65 staining in one patient biopsy, and intestinal
    epithelial knockout models. This is a qualified mechanism: infection, including CMV, can aggravate
    colitis and some patients improve after HSCT.'

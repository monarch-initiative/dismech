diagnosis:
- name: Molecular and immune evaluation
  description: IKBKG testing must distinguish the functional gene from its highly similar pseudogene.
    Immunologic evaluation is warranted when ectodermal dysplasia accompanies unusual infections,
    including when a separate EDA variant has already been identified. Normal immunoglobulin levels
    or absence of ectodermal findings does not exclude variant-specific NEMO immunodeficiency.

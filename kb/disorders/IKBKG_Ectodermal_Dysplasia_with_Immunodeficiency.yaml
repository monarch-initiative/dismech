- name: OL-EDA-ID
  display_name: Anhidrotic EDA-ID with Osteopetrosis and Lymphedema
  subtype_term:
    preferred_term: anhidrotic ectodermal dysplasia-immunodeficiency-osteopetrosis-lymphedema syndrome
    term:
      id: MONDO:0010295
      label: anhidrotic ectodermal dysplasia-immunodeficiency-osteopetrosis-lymphedema syndrome
  description: An immunodeficiency presentation with osteopetrosis and lymphedema, first described
    with IKBKG stop-codon variants. Neither skeletal nor lymphatic involvement is universal in NEMO
    deficiency; later cohorts contain additional genotypes.
  evidence:
  - reference: PMID:11242109
    reference_title: X-linked anhidrotic ectodermal dysplasia with immunodeficiency is caused by
      impaired NF-kappaB signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 2 patients with a related and hitherto unrecognized syndrome of EDA-ID with osteopetrosis
      and lymphoedema (OL-EDA-ID). Mutations in the coding region of IKBKG are associated with EDA-ID,
      and stop codon mutations, with OL-EDA-ID
    explanation: First description of OL-EDA-ID as a distinct severe variant caused by stop codon
      IKBKG mutations.
- name: IMD33
  display_name: Immunodeficiency 33 (Mycobacterial Susceptibility)
  subtype_term:
    preferred_term: immunodeficiency 33
    term:
      id: MONDO:0010386
      label: immunodeficiency 33
  description: E315A and R319Q variants were identified in families with predominantly mycobacterial
    disease and selective impairment of CD40-dependent IL-12 production by antigen-presenting cells.
    B-cell switching was preserved. Minor dental findings and occasional invasive pyogenic infections
    mean the presentation is not absolutely restricted to mycobacteria.
  evidence:
  - reference: PMID:16818673
    reference_title: X-linked susceptibility to mycobacteria is caused by mutations in NEMO impairing
      CD40-dependent IL-12 production.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report here mutations in the leucine zipper (LZ) domain of the NF-kappaB essential
      modulator (NEMO) gene in three unrelated kindreds with XR-MSMD.
    explanation: Defines the primary families underlying the selective mycobacterial presentation.
  - reference: PMID:16818673
    reference_title: X-linked susceptibility to mycobacteria is caused by mutations in NEMO impairing
      CD40-dependent IL-12 production.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, the CD40-dependent up-regulation of costimulatory molecules of dendritic cells
      and the proliferation and immunoglobulin class switch of B cells were normal.
    explanation: Patient-cell assays distinguish this presentation from CD40-dependent B-cell switching
      defects.
inheritance:
- name: X-linked recessive inheritance (EDA-ID)
  description: The classic immunodeficiency pedigrees show X-linked recessive inheritance. Heterozygous
    females may have mild ectodermal findings, IP, inflammatory manifestations or occasionally immunodeficiency;
    X-inactivation is not uniformly protective. Counseling must use the familial variant and observed
    phenotype rather than importing the usual male lethality of classic IP.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:11047757
    reference_title: A novel X-linked disorder of immune deficiency and hypohidrotic ectodermal dysplasia
      is allelic to incontinentia pigmenti and due to mutations in IKK-gamma (NEMO).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: males from four families with HED and immunodeficiency (HED-ID), in which the disorder
      segregates as an X-linked recessive trait
    explanation: Establishes X-linked recessive inheritance pattern for EDA-ID.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1112/
    reference_title: Hypohidrotic Ectodermal Dysplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: IKBKG ... Hypohidrotic ectodermal dysplasia w/immunodeficiency ... XL ... Sparse hair
      ... Hypohidrosis ... Hypodontia ... Impaired immune function w/risk for recurrent infections,
      hypogammaglobulinemia, T cell dysfunction
    explanation: The IKBKG differential row explicitly assigns X-linked inheritance; the separate
      EDA-specific counseling probabilities and classic-IP lethality are not used.
pathophysiology:
- name: Impaired NEMO-dependent NF-kappaB activation
  description: Hypomorphic IKBKG variants impair NEMO-dependent activation of the canonical NF-kappaB
    pathway. Residual activity, protein abundance and stimulus specificity vary. Exon 10 truncations
    as well as missense variants can retain function; preserved protein expression does not establish
    normal signaling.
  evidence:
  - &id001
    reference: PMID:11242109
    reference_title: X-linked anhidrotic ectodermal dysplasia with immunodeficiency is caused by
      impaired NF-kappaB signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We show that IKBKG mutations causing OL-EDA-ID and EDA-ID impair but do not abolish
      NF-kappaB signaling
    explanation: The functional experiments distinguish hypomorphic immunodeficiency variants from
      complete pathway abolition.

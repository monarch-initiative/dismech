    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Impaired CD40-dependent IL-12/IFN-gamma cooperation compromises control of mycobacteria
      in the E315A/R319Q families. Other NEMO variants and residual TNF defects can contribute through

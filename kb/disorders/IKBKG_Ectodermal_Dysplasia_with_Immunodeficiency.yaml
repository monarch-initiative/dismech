  - target: Impaired innate immune receptor responses
    causal_link_type: DIRECT
    description: NEMO dysfunction can impair signal transmission from innate immune receptors; the
      affected receptor responses depend on the variant.
    evidence:
    - reference: PMID:18851874
      reference_title: Hypomorphic nuclear factor-kappaB essential modulator mutation database and
        reconstitution system identifies phenotypic and immunologic diversity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 86% (6/7) patients had abnormal IL-1 signaling, and 64% (9/14) had abnormal TLR signaling
      explanation: Selected patient-cell assays show variable IL-1 and Toll-like receptor defects;
        denominators are tested subsets.
  - target: Impaired CD40-dependent B-cell maturation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Selected zinc-finger variants impair CD40-mediated NF-kappaB signaling in B cells,
      compromising switching and antibody diversification.
    evidence:
    - reference: PMID:15578091
      reference_title: Specific NEMO mutations impair CD40-mediated c-Rel activation and B cell terminal
        differentiation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Furthermore, we show that patient B cells stimulated with CD40 ligand are impaired
        in both p65 and c-Rel activation, and whereas addition of IL-4 can enhance p65 activity,
        c-Rel activity remains deficient.
      explanation: The cultured patient B-cell experiments support this variant-scoped signaling-to-maturation
        route.
  - target: Impaired CD40-dependent IL-12 and IFN-gamma cooperation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: The E315A/R319Q variants selectively impair the CD40/c-Rel cytokine branch in antigen-presenting
      cells; this is not generalized failure of all CD40 functions.
    evidence:
    - reference: PMID:16818673
      reference_title: X-linked susceptibility to mycobacteria is caused by mutations in NEMO impairing
        CD40-dependent IL-12 production.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: IL-12 production was also impaired as the result of a specific defect in NEMO- and
        NF-kappaB/c-Rel-mediated CD40 signaling after the stimulation of monocytes and dendritic
        cells by CD40L-expressing T cells and fibroblasts, respectively.
      explanation: Patient-cell experiments support the selective upstream mechanism.
  - target: Impaired ectodermal appendage development
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Reduced NEMO-dependent signaling compromises the ectodysplasin receptor developmental
      program.
    evidence:
    - reference: PMID:11242109
      reference_title: X-linked anhidrotic ectodermal dysplasia with immunodeficiency is caused by
        impaired NF-kappaB signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We also show that the ectodysplasin receptor, DL, triggers NF-kappaB through the NEMO

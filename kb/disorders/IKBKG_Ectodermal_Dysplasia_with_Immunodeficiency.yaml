- discussion_id: ikbkg_unresolved_clinical_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which remaining findings lack a sufficiently established causal route?
  rationale: Elevated IgA and low IgM cannot be explained simply by a class-switch block; the authors
    leave low-IgM pathophysiology unresolved and discuss CD40-independent IgA as a hypothesis. Reduced
    T-cell counts in one c.268delG patient are not localized to a demonstrated survival or developmental
    defect. Dry skin, ichthyosis, pigment changes, autoimmune cytopenias, thyroiditis, arthritis
    and uveitis are documented, but the reviewed patient reports do not establish one common immune-dysregulation
    route; the Jurkat L153R apoptosis/A20 phenotype is not direct proof for each manifestation. Frontal
    bossing, prenatal growth restriction, developmental delay, intracranial calcification and delayed
    cord separation likewise have uncertain patient-specific attribution. These gaps concern causal
    attribution, not mere absence of a drawn intermediary. The supported epithelial, appendage, humoral
    and infection-consequence routes are already represented. The low-IgM, high-IgA and low-T-cell
    findings are laboratory observations, not clinical functional-assay readouts. Jain proposes CD40-independent
    synthesis to explain the presence of serum IgA despite failed cultured switching in a C417 patient;
    this does not establish why concentrations are elevated, especially in the distinct c.268delG
    family. Child hyperpigmentation is documented separately from maternal IP, without a proven pigmentary
    route.

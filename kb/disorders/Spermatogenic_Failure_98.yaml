genetic:
- name: CFAP54
  gene_term:
    preferred_term: CFAP54
    term:
      id: hgnc:26456
      label: CFAP54
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  frequency: 3 of 334 MMAF/NOA probands; separately 1 of 167 primary-infertility probands
  notes: >-
    CFAP54 encodes a C1d projection component of the ciliary and flagellar
    central microtubule apparatus; its Chlamydomonas orthologue is FAP54. Three
    unrelated men were found among 334 Han Chinese probands with severe MMAF or
    NOA, giving a genotype yield of roughly 1%. Reported alleles include a
    homozygous frameshift and two compound heterozygous combinations of missense
    variants. The same gene causes primary ciliary dyskinesia, so a CFAP54
    genotype found in an infertility workup should prompt a respiratory history.

    A second, independent cohort supports the relationship: whole-exome
    sequencing of 167 men with primary infertility identified CFAP54 among the
    known causative genes, in patient M827, who carried the compound
    heterozygous combination c.1540-4C>T and c.8642_8643del p.(Leu2882Phefs*7).
    That proband is worth noting for a second reason — his semen phenotype was
    oligoasthenozoospermia rather than the severe MMAF or NOA that defined the
    original cohort, so the reported genotype-phenotype range for CFAP54
    infertility is wider than the founding series alone suggests.
  evidence:
  - reference: PMID:36593121
    reference_title: "Biallelic mutations in CFAP54 cause male infertility with severe MMAF and NOA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we performed genetic analyses through whole-exome sequencing in a
      cohort of 334 Han Chinese probands with severe MMAF or NOA.
    explanation: >-
      Establishes the cohort size against which the three probands should be read.
  - reference: PMID:37725231
    reference_title: "Lack of CFAP54 causes primary ciliary dyskinesia in a mouse model and human patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of PCD-causing variants of CFAP54 in two unrelated
      patients with PCD for the first time provides strong supportive evidence
      that CFAP54 is a new PCD-causing gene.
    explanation: >-
      Establishes that the same gene also causes primary ciliary dyskinesia, the
      basis for the phenotypic-boundary discussion in this entry.
  - reference: PMID:39267058
    reference_title: "Whole exome sequencing analysis of 167 men with primary infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Accordingly, variants of 17 known causative (five X-linked and twelve
      autosomal) genes, including ACTRT1, ADAD2, AR, BCORL1, CFAP47, CFAP54,
      DNAH17, DNAH6, DNAH7, DNAH8, DNAH9, FSIP2, MSH4, SLC9C1, TDRD9, TTC21A, and
      WNK3, were identified in 23 patients.
    explanation: >-
      A second independent cohort, unrelated to the founding series, in which
      CFAP54 is identified among the known causative genes for spermatogenic
      failure.
  - reference: PMID:39267058
    reference_title: "Whole exome sequencing analysis of 167 men with primary infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, it has been shown that biallelic deleterious mutations of
      CFAP54 can induce severe MMAF and NOA in humans
    explanation: >-
      The authors' own reading of the CFAP54 gene-disease relationship in the
      context of their cohort finding.
animal_models:
- name: Cfap54 gene-trap mouse
  species: Mouse
  genotype: Cfap54 gene-trapped allele, homozygous
  publication: PMID:26224312
  description: >-
    Mouse line carrying a gene-trapped Cfap54 allele, established by its authors
    as a new model of primary ciliary dyskinesia.
  modeled_mechanisms:
  - target: Flagellar Axoneme Disorganisation and Assembly Protein Depletion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the specific C1d projection structural defect that defines the
      molecular lesion, with functional consequences for ciliary beating.
    limitations: >-
      The structural and functional characterisation is of motile cilia rather
      than of the sperm flagellum, so the flagellar readout is inferred from the

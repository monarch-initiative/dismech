name: Spermatogenic failure 98
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Spermatogenic failure 98 is male infertility caused by biallelic variants in
  CFAP54, which encodes a cilia- and flagella-associated protein of the C1d
  projection of the central microtubule apparatus. The sperm flagellum and the
  motile cilium share that axonemal architecture, so loss of CFAP54 disorganises
  the flagellar axoneme and depletes flagellar assembly proteins, producing
  multiple morphological abnormalities of the sperm flagella (MMAF) together
  with reduced sperm concentration and motility, extending in some men to
  non-obstructive azoospermia. Importantly, CFAP54 is not an infertility-only
  gene: the same gene causes primary ciliary dyskinesia, and the Cfap54 mouse
  has full PCD with hydrocephalus and mucus accumulation as well as male
  infertility. Whether isolated spermatogenic failure and CFAP54-related PCD are
  distinct entities or one spectrum is unresolved and is curated here as an open
  question rather than assumed. Fertility is achievable: favourable pregnancy
  outcomes have been reported using these men's sperm for intracytoplasmic sperm
  injection.
category: Mendelian
parents:
- hereditary disease
synonyms:
- SPGF98
- CFAP54-related spermatogenic failure
- CFAP54-related male infertility

  - reference: PMID:32704025
    reference_title: "Genetic interaction between central pair apparatus genes CFAP221, CFAP54, and SPEF2 in mouse models of primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this study, we investigated potential genetic interaction between these
      CPA genes by generating each combination of double heterozygous and double
      homozygous mutants.
    explanation: >-
      Establishes that the CFAP54-SPEF2 relationship was tested directly by
      genetic interaction in mice, which is the mechanistic underpinning for
      reading the reduced SPEF2 staining in patient sperm as part of a shared
      central-apparatus dependency rather than an isolated observation.
  - reference: PMID:32704025
    reference_title: "Genetic interaction between central pair apparatus genes CFAP221, CFAP54, and SPEF2 in mouse models of primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Spermiogenesis is aborted in double homozygotes, with an absence of mature
      flagella on elongating spermatids and epididymal sperm.
    explanation: >-
      The CFAP54-SPEF2 double homozygote aborts spermiogenesis, supporting the
      node's claim that loss of this central apparatus component destabilises the
      wider flagellar assembly machinery. Two caveats travel with this evidence.
      SPEF2 localises to the C1b projection, not C1d, so the interaction is
      between distinct projections of the same central apparatus rather than
      within one complex. And the double homozygote's SPERM phenotype is not more
      severe than the single mutants' - the paper states it "is not dissimilar to
      the spermatogenesis phenotype observed in single nm1054, bgh, or
      Cfap54gt/gt mutants". The paper's severity language concerns mortality,
      hydrocephalus and airway disease, which are not this entry's node.

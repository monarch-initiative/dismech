- name: Cfap54 in-frame variant knock-in mouse
  species: Mouse
  genotype: Cfap54 in-frame variant knock-in, modelling a human pathogenic allele
  publication: PMID:37725231
  description: >-
    Knock-in mouse carrying a human CFAP54 pathogenic variant rather than a gene
    trap, so it tests the specific allele class found in patients. Its relevance
    to this entry cuts in a particular direction: the mouse develops full PCD —
    hydrocephalus and nasal mucus accumulation as well as infertility — so on the
    closest available allele-matched model, CFAP54 loss does not produce isolated
    infertility.
  modeled_mechanisms:
  - target: Male Infertility
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the infertility endpoint of this entry, but as one component of
      a full PCD phenotype rather than in isolation.
    limitations: >-
      The human probands curated here have infertility without recognised airway
      disease, whereas this mouse has both. Whether that is a species difference,
      an allele difference, or undetected airway disease in the men is exactly
      the question left open in this entry's discussion, so the model cannot be
      read as settling it. The variant is in-frame, which need not match the
      frameshift and missense alleles in the infertility cohort.
    readouts:
    - name: Fertility
      target: Male Infertility
      direction: DECREASED
      interpretation: >-
        Infertility observed alongside the other PCD manifestations.
      evidence:
      - reference: PMID:37725231
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In addition, a CFAP54 in-frame variant knock-in mouse model was
          established, which recapitulated the typical symptoms of PCD, including
          hydrocephalus, infertility, and mucus accumulation in nasal sinuses.
        explanation: >-
          The measurement behind this readout, and the reason the model is
          recorded as partially rather than fully recapitulating an
          infertility-only entity.
    evidence:
    - reference: PMID:37725231
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In addition, a CFAP54 in-frame variant knock-in mouse model was
        established, which recapitulated the typical symptoms of PCD, including
        hydrocephalus, infertility, and mucus accumulation in nasal sinuses.
      explanation: >-
        Supports treating this allele-matched model as informative for the
        infertility node while recording that it manifests the wider PCD
        phenotype.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility and morphology defect by injecting a single
    spermatozoon directly into the oocyte. Favourable clinical pregnancy outcomes
    have been reported using sperm from men carrying CFAP54 mutations, so a
    CFAP54 diagnosis carries a genuinely useful prognostic message rather than
    only an explanatory one.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intracytoplasmic sperm injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  evidence:
  - reference: PMID:36593121
    reference_title: "Biallelic mutations in CFAP54 cause male infertility with severe MMAF and NOA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, favourable clinical pregnancy outcomes were achieved with sperm
      from men carrying CFAP54 mutations after intracytoplasmic sperm injection
      treatment.
    explanation: >-
      Direct evidence that ICSI achieves pregnancy despite the flagellar defect.
differential_diagnoses:
- name: CFAP54-related primary ciliary dyskinesia
  disease_term:
    preferred_term: primary ciliary dyskinesia 54
    term:
      id: MONDO:0100607
      label: ciliary dyskinesia, primary, 54
  distinguishing_features:
  - >-
    Chronic upper and lower airway disease — recurrent sinusitis, bronchitis,
    otitis media, bronchiectasis — with or without hydrocephalus. None of this
    is part of the infertility presentation.
  - >-
    Situs is normal in both, so situs inversus does not separate them.
  - >-
    The usual discriminating ciliary tests do not separate them either: nasal
    nitric oxide, transmission electron microscopy and high-speed
    videomicroscopy are all normal in C1d-defective PCD, and PICADAR scoring is
    unreliable. The distinction therefore rests on clinical respiratory history
    rather than on any ciliary assay.
  description: >-
    Not merely a differential but the same gene. Biallelic CFAP54 variants also
    cause primary ciliary dyskinesia, and C1d-defective PCD is notoriously hard
    to detect: it presents with normal situs, normal nasal nitric oxide, normal
    ciliary ultrastructure on transmission electron microscopy and normal
    high-speed videomicroscopy, and the PICADAR clinical prediction tool does not
    reliably identify it. A man diagnosed with CFAP54 spermatogenic failure could
    therefore have unrecognised airway disease that every standard PCD test would
    have called normal.
  evidence:
  - reference: PMID:39362668
    reference_title: "Pathogenic variants in CFAP46, CFAP54, CFAP74 and CFAP221 cause primary ciliary dyskinesia with a defective C1d projection of the central apparatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Careful evaluation revealed that C1d-defective primary ciliary dyskinesia is
      associated with normal situs composition, normal nasal nitric oxide
      production rates, normal ciliary ultrastructure by transmission electron
      microscopy and normal ciliary beating by high-speed videomicroscopy
      analysis.
    explanation: >-
      Documents that every standard PCD diagnostic modality is normal in
      C1d-defective disease.
  - reference: PMID:39362668
    reference_title: "Pathogenic variants in CFAP46, CFAP54, CFAP74 and CFAP221 cause primary ciliary dyskinesia with a defective C1d projection of the central apparatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, this study extends the spectrum of primary ciliary dyskinesia genes
      and highlights that individuals with C1d-defective primary ciliary
      dyskinesia elude diagnosis when using the current diagnostic algorithm.
    explanation: >-
      States that these patients evade the standard diagnostic algorithm, the
      clinically actionable point of this differential.
discussions:
- discussion_id: spgf98_isolated_infertility_versus_pcd_spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is CFAP54-related spermatogenic failure a distinct entity from CFAP54-related
    primary ciliary dyskinesia, or are the infertility probands simply
    PCD patients whose airway disease was never looked for?
  attaches_to:
  - "pathophysiology#CFAP54 Loss of Function"
  - "pathophysiology#Male Infertility"
  rationale: >-
    This is the central nosological question for this entry and it is
    deliberately left open. CFAP54 causes both isolated spermatogenic failure and
    PCD, and the Cfap54 mouse has full PCD — hydrocephalus, mucus accumulation
    and male infertility together — rather than infertility alone. The men in the
    infertility cohort were ascertained through a reproductive clinic, so a
    respiratory phenotype would not necessarily have been sought or recorded.
    What makes this more than a bookkeeping question is that C1d-defective PCD is
    specifically invisible to the standard diagnostic algorithm: normal situs,
    normal nasal nitric oxide, normal transmission electron microscopy, normal
    high-speed videomicroscopy, and unreliable PICADAR scoring. A man could
    therefore be correctly diagnosed with CFAP54 infertility while having
    genuinely undetected airway disease. The alternative explanation — that
    specific alleles or residual function separate an infertility-only phenotype
    from full PCD — is equally untested.

    ClinGen's Motile Ciliopathy Gene Curation Expert Panel went further than
    leaving this open, and this entry diverges from them deliberately rather than
    silently. Applying the ClinGen Lumping & Splitting criteria, the panel found
    the molecular mechanism and mode of inheritance consistent across unrelated
    patients and the phenotypic variability to represent a spectrum rather than
    separate entities, and therefore lumped all inherited CFAP54 disease into a
    single entity, Primary Ciliary Dyskinesia 54 (MONDO:0100607, OMIM:621125).
    dismech nonetheless curates SPGF98 as its own entry, for three reasons. First,
    MONDO retains both terms — MONDO:0700290 for SPGF98 and MONDO:0100607 for
    PCD54 — and dismech entries are keyed to MONDO concepts, so curating SPGF98
    is not an assertion that ClinGen is wrong about gene-disease validity, which
    is a different question from disease-concept granularity. Second, ClinGen's
    own narrative on the same record leaves the specific sub-question this
    discussion asks unresolved (quoted below), so the lumping conclusion and the
    open boundary question coexist in one document. Third, the differential
    diagnosis and `distinguishing_features` on this entry point explicitly at
    PCD54, so a reader who accepts ClinGen's lumping can traverse to it; the
    split costs nothing in navigability. If MONDO merges the two terms, this
    entry should be merged with them.

    Their leaving the sub-question open is the strongest available
    evidence that it is genuinely unresolved rather than merely unexamined here.
    Their review adds one fact that partly cuts against the
    undiagnosed-PCD reading: the proband in the study this entry is built on was
    examined carefully, including CT scanning, and had no obvious PCD symptoms.
    That is a real negative finding, though the panel notes respiratory ciliary
    structure and function were not investigated in either infertility study, so
    a subtle phenotype is not excluded.
  evidence:
  - reference: CGGV:assertion_f16ea0ce-7d5d-4bdc-92fe-52d111913161-2025-07-16T070000.000Z
    reference_title: "CFAP54 / ciliary dyskinesia, primary, 54 (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It remains unclear if these patients might have subtle respiratory
      phenotypes or if spermatogenic failure alone may be part of the spectrum of
      disease seen in CFAP54 patients.
    explanation: >-
      ClinGen's expert panel states this exact question as unresolved, confirming
      it is a genuine open question rather than a gap local to this entry.
  - reference: CGGV:assertion_f16ea0ce-7d5d-4bdc-92fe-52d111913161-2025-07-16T070000.000Z
    reference_title: "CFAP54 / ciliary dyskinesia, primary, 54 (Strong)"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One of these studies reports on a patient that underwent careful
      examination, including CT scanning and had no obvious PCD symptoms such as
      sinusitis, bronchitis, pneumonia or otitis media (PMID: 36593121).
    explanation: >-
      Evidence against the undiagnosed-PCD reading for at least one proband;
      marked PARTIAL because respiratory ciliary structure and function were still
      not investigated.
  - reference: CGGV:assertion_f16ea0ce-7d5d-4bdc-92fe-52d111913161-2025-07-16T070000.000Z
    reference_title: "CFAP54 / ciliary dyskinesia, primary, 54 (Strong)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Therefore, cases caused by inherited CFAP54 variants have been lumped into
      a single disease entity, Primary Ciliary Dyskinesia 54 (MONDO:0100607,
      OMIM:621125).
    explanation: >-
      ClinGen's formal conclusion, which argues against curating SPGF98 as a
      separate entity. Recorded as REFUTE against the split rather than omitted,
      so the divergence stated in the rationale is visible in the evidence rather
      than only asserted in prose.
  - reference: PMID:41393159
    reference_title: "Exome sequencing reanalysis identifies a novel likely pathogenic CFAP54 variant and expands the phenotypic and genotypic spectrum of primary ciliary dyskinesia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This finding brings the total number of CFAP54-associated PCD patients to
      eight and the number of distinct CFAP54 mutations to twelve, thereby
      enriching the phenotypic and genotypic spectrum of this gene.
    explanation: >-
      The CFAP54 PCD arm is still only eight patients, which bounds how firmly
      the infertility-versus-PCD boundary can be drawn from either side. The
      proband reported here is a 35-year-old woman with bronchiectasis, so the
      PCD arm is not male-restricted and the two presentations cannot be
      separated by sex.
  proposed_experiments:
  - experiment_id: exp_spgf98_respiratory_phenotyping_of_infertility_probands
    name: Respiratory phenotyping of CFAP54 infertility probands
    description: >-
      Systematically assess reported and newly identified CFAP54 infertility
      probands for airway disease using methods that work in C1d-defective PCD —
      ciliary transport assays and clinical history — rather than the standard
      algorithm that is known to return normal results in this PCD type.
  - experiment_id: exp_spgf98_genotype_stratified_comparison
    name: Genotype comparison between infertility-only and PCD cohorts
    description: >-
      Compare the CFAP54 alleles reported in infertility-only probands against
      those in PCD probands, testing whether allele class or predicted residual
      function separates the two presentations or whether the genotypes overlap.
notes: >-
  Scope. This entry curates SPGF98 (MONDO:0700290), the male infertility
  presentation of biallelic CFAP54 disease. It does not curate CFAP54-related
  primary ciliary dyskinesia, which is a separate clinical entity carried here as
  a differential diagnosis; the relationship between the two is an open question
  recorded in the discussions rather than a settled split.

  A curation gap this entry surfaces. `Primary_Ciliary_Dyskinesia.yaml` exists in
  this knowledge base but does not mention CFAP54, which is now an established
  PCD gene with a defective-C1d mechanism and a distinctive
  diagnostically-elusive profile. Adding CFAP54 to that entry, with the point
  that the standard diagnostic algorithm returns normal results for this PCD
  type, would be a worthwhile follow-up.

  Why the MMAF node conforms to the ciliopathy module. The sperm flagellum and
  the motile cilium share axonemal architecture, so a C1d defect impairs both.
  The conformance to `ciliopathy_dysfunction#Motile Cilia Beat Dysfunction` is
  therefore a claim about shared mechanism, not about the patient having airway
  disease — that separate question is the subject of the open discussion.

  Evidence base. Three probands from a 334-proband MMAF/NOA cohort, plus a fourth
  from an independent 167-proband primary-infertility cohort; two mouse models (a
  gene trap and an allele-matched knock-in); a mouse genetic-interaction study
  placing CFAP54 in a central-apparatus dependency with SPEF2 and CFAP221; and
  independent human PCD reports of the same gene, now totalling eight PCD
  patients and twelve distinct alleles. Small for the infertility phenotype, but
  the mechanism is well supported across species and the C1d requirement was
  established independently in mouse and Chlamydomonas.

  Why the PCD GeneReviews chapter is listed but not mined. PMID:20301301 is the
  authoritative clinical source for the diagnostic algorithm this entry's
  differential and open discussion both turn on, so it is listed in `references:`
  and tagged GeneReviews for navigability. It is not cited as evidence anywhere:
  the cached record is `content_type: abstract_only` — 448 characters of purpose
  statement, with no Clinical Characteristics, Diagnosis or Management content —
  so the only quotable text in it is the title, and quoting a title as a finding
  is the anti-pattern the evidence SOP forbids.

  Divergence from ClinGen on disease granularity. ClinGen's Motile Ciliopathy
  GCEP formally lumped all inherited CFAP54 disease into Primary Ciliary
  Dyskinesia 54. This entry nevertheless exists as a separate SPGF98 record,
  because MONDO retains both concepts and dismech entries are keyed to MONDO;
  the reasoning, and the ClinGen sentence that argues against it, are curated in
  the `spgf98_isolated_infertility_versus_pcd_spectrum` discussion rather than
  left implicit.

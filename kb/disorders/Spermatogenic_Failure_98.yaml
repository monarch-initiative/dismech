  description: >-
    Sperm from affected men show significant axonemal disorganisation on
    ultrastructural examination. The lesion is not confined to the C1d projection
    itself: immunofluorescence showed markedly reduced staining of four
    flagellar-assembly-associated proteins — IFT20, IFT52, IFT122 and SPEF2 — in
    the spermatozoa of CFAP54-deficient men, indicating that losing this central
    apparatus component destabilises the wider flagellar assembly machinery
    rather than deleting one projection in isolation.

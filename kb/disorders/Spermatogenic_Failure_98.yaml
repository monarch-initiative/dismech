treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility and morphology defect by injecting a single
    spermatozoon directly into the oocyte. Favourable clinical pregnancy outcomes
    have been reported using sperm from men carrying CFAP54 mutations, so a
    CFAP54 diagnosis carries a genuinely useful prognostic message rather than
    only an explanatory one.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:36593121
    reference_title: "Biallelic mutations in CFAP54 cause male infertility with severe MMAF and NOA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, favourable clinical pregnancy outcomes were achieved with sperm
      from men carrying CFAP54 mutations after intracytoplasmic sperm injection
      treatment.
    explanation: >-
      Direct evidence that ICSI achieves pregnancy despite the flagellar defect.
differential_diagnoses:
- name: CFAP54-related primary ciliary dyskinesia
  description: >-
    Not merely a differential but the same gene. Biallelic CFAP54 variants also
    cause primary ciliary dyskinesia, and C1d-defective PCD is notoriously hard
    to detect: it presents with normal situs, normal nasal nitric oxide, normal
    ciliary ultrastructure on transmission electron microscopy and normal
    high-speed videomicroscopy, and the PICADAR clinical prediction tool does not
    reliably identify it. A man diagnosed with CFAP54 spermatogenic failure could
    therefore have unrecognised airway disease that every standard PCD test would
    have called normal.
  evidence:
  - reference: PMID:39362668
    reference_title: "Pathogenic variants in CFAP46, CFAP54, CFAP74 and CFAP221 cause primary ciliary dyskinesia with a defective C1d projection of the central apparatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Careful evaluation revealed that C1d-defective primary ciliary dyskinesia is
      associated with normal situs composition, normal nasal nitric oxide
      production rates, normal ciliary ultrastructure by transmission electron
      microscopy and normal ciliary beating by high-speed videomicroscopy
      analysis.
    explanation: >-
      Documents that every standard PCD diagnostic modality is normal in
      C1d-defective disease.
  - reference: PMID:39362668
    reference_title: "Pathogenic variants in CFAP46, CFAP54, CFAP74 and CFAP221 cause primary ciliary dyskinesia with a defective C1d projection of the central apparatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, this study extends the spectrum of primary ciliary dyskinesia genes
      and highlights that individuals with C1d-defective primary ciliary
      dyskinesia elude diagnosis when using the current diagnostic algorithm.
    explanation: >-
      States that these patients evade the standard diagnostic algorithm, the
      clinically actionable point of this differential.
discussions:
- discussion_id: spgf98_isolated_infertility_versus_pcd_spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is CFAP54-related spermatogenic failure a distinct entity from CFAP54-related
    primary ciliary dyskinesia, or are the infertility probands simply
    PCD patients whose airway disease was never looked for?
  attaches_to:
  - "pathophysiology#CFAP54 Loss of Function"
  - "pathophysiology#Male Infertility"
  rationale: >-
    This is the central nosological question for this entry and it is
    deliberately left open. CFAP54 causes both isolated spermatogenic failure and
    PCD, and the Cfap54 mouse has full PCD — hydrocephalus, mucus accumulation
    and male infertility together — rather than infertility alone. The men in the
    infertility cohort were ascertained through a reproductive clinic, so a
    respiratory phenotype would not necessarily have been sought or recorded.
    What makes this more than a bookkeeping question is that C1d-defective PCD is
    specifically invisible to the standard diagnostic algorithm: normal situs,
    normal nasal nitric oxide, normal transmission electron microscopy, normal
    high-speed videomicroscopy, and unreliable PICADAR scoring. A man could
    therefore be correctly diagnosed with CFAP54 infertility while having
    genuinely undetected airway disease. The alternative explanation — that
    specific alleles or residual function separate an infertility-only phenotype
    from full PCD — is equally untested.

    ClinGen's Motile Ciliopathy Gene Curation Expert Panel reached the same
    question independently and left it open, which is the strongest available
    evidence that it is genuinely unresolved rather than merely unexamined here.
    Their review adds one fact that partly cuts against the
    undiagnosed-PCD reading: the proband in the study this entry is built on was
    examined carefully, including CT scanning, and had no obvious PCD symptoms.
    That is a real negative finding, though the panel notes respiratory ciliary
    structure and function were not investigated in either infertility study, so
    a subtle phenotype is not excluded.
  evidence:
  - reference: CGGV:assertion_f16ea0ce-7d5d-4bdc-92fe-52d111913161-2025-07-16T070000.000Z
    reference_title: "CFAP54 / ciliary dyskinesia, primary, 54 (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It remains unclear if these patients might have subtle respiratory
      phenotypes or if spermatogenic failure alone may be part of the spectrum of
      disease seen in CFAP54 patients.
    explanation: >-
      ClinGen's expert panel states this exact question as unresolved, confirming
      it is a genuine open question rather than a gap local to this entry.
  - reference: CGGV:assertion_f16ea0ce-7d5d-4bdc-92fe-52d111913161-2025-07-16T070000.000Z
    reference_title: "CFAP54 / ciliary dyskinesia, primary, 54 (Strong)"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One of these studies reports on a patient that underwent careful
      examination, including CT scanning and had no obvious PCD symptoms such as
      sinusitis, bronchitis, pneumonia or otitis media (PMID: 36593121).
    explanation: >-
      Evidence against the undiagnosed-PCD reading for at least one proband;
      marked PARTIAL because respiratory ciliary structure and function were still
      not investigated.
  proposed_experiments:
  - experiment_id: exp_spgf98_respiratory_phenotyping_of_infertility_probands
    name: Respiratory phenotyping of CFAP54 infertility probands
    description: >-
      Systematically assess reported and newly identified CFAP54 infertility
      probands for airway disease using methods that work in C1d-defective PCD —
      ciliary transport assays and clinical history — rather than the standard
      algorithm that is known to return normal results in this PCD type.
  - experiment_id: exp_spgf98_genotype_stratified_comparison
    name: Genotype comparison between infertility-only and PCD cohorts
    description: >-
      Compare the CFAP54 alleles reported in infertility-only probands against
      those in PCD probands, testing whether allele class or predicted residual
      function separates the two presentations or whether the genotypes overlap.
notes: >-
  Scope. This entry curates SPGF98 (MONDO:0700290), the male infertility
  presentation of biallelic CFAP54 disease. It does not curate CFAP54-related
  primary ciliary dyskinesia, which is a separate clinical entity carried here as
  a differential diagnosis; the relationship between the two is an open question
  recorded in the discussions rather than a settled split.

  A curation gap this entry surfaces. `Primary_Ciliary_Dyskinesia.yaml` exists in
  this knowledge base but does not mention CFAP54, which is now an established
  PCD gene with a defective-C1d mechanism and a distinctive
  diagnostically-elusive profile. Adding CFAP54 to that entry, with the point
  that the standard diagnostic algorithm returns normal results for this PCD
  type, would be a worthwhile follow-up.

  Why the MMAF node conforms to the ciliopathy module. The sperm flagellum and
  the motile cilium share axonemal architecture, so a C1d defect impairs both.
  The conformance to `ciliopathy_dysfunction#Motile Cilia Beat Dysfunction` is
  therefore a claim about shared mechanism, not about the patient having airway
  disease — that separate question is the subject of the open discussion.

  Evidence base. Three probands from a 334-proband cohort, plus a mouse gene-trap
  model, plus independent human PCD reports of the same gene. Small for the
  infertility phenotype, but the mechanism is well supported across species and
  the C1d requirement was established independently in mouse and Chlamydomonas.

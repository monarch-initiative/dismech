    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mild shortening of humeri in
      three patients, and chondrodysplasia punctata in two patients,
    explanation: >-
      Gives the frequency and severity of the two skeletal features in the founding cohort.
  downstream:
  - target: Epiphyseal Stippling
    causal_link_type: DIRECT
    description: Punctate epiphyseal calcification, present in two of the four reported patients.
  - target: Short Humerus
    causal_link_type: DIRECT
    description: Mild proximal (rhizomelic) shortening of the upper limb.
- name: Neurological Impairment
  biological_scale: ORGANISM
  description: >-
    Severe intellectual disability in all four patients, with microcephaly, seizures with
    epileptiform EEG, and in at least one patient findings compatible with a chronic
    demyelinating peripheral neuropathy - the last being a feature more usually associated
    with the Zellweger spectrum than with classic RCDP.
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT

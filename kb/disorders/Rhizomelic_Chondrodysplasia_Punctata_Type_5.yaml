genetic:
- name: PEX5
  relationship_type: CAUSATIVE
  presence: Present
  gene_term:
    preferred_term: PEX5
    term:
      id: hgnc:9719
      label: PEX5
  notes: >-
    PEX5 is the striking case of one gene giving two unrelated diseases according to which
    isoform an allele affects. Variants hitting both isoforms remove PTS1 import and cause
    a Zellweger spectrum disorder; the exon 9 variant hits only PEX5L, leaves PTS1 import
    intact, and causes RCDP5. Any diagnostic strategy that does not cover exon 9
    specifically will miss this entity in a patient whose biochemistry looks like RCDP1.
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previous patients with PEX5 mutations had ZSD, mainly due to deficient import of
      PTS1-tagged proteins.
    explanation: >-
      Establishes the contrasting PEX5 phenotype and the import defect that produces it.
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in PEX5 or 12 other PEX genes cause peroxisome biogenesis disorders,
      collectively named the Zellweger spectrum disorders (ZSDs), whereas mutations in PEX7
      cause rhizomelic chondrodysplasia punctata type 1 (RCDP1).
    explanation: >-
      States the pre-existing gene-disease assignments that RCDP5 complicates, since it
      places PEX5 on both sides of that division.

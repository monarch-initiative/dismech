    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to the biochemical overlap between RCDP1 and RCDP5, sequencing of PEX7 and exon 9
      in PEX5 should be performed in patients with a selective defect in the import of
      PTS2-tagged proteins.
    explanation: States the testing recommendation and the reason for it.

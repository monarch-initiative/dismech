name: Rhizomelic Chondrodysplasia Punctata Type 5
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Rhizomelic chondrodysplasia punctata type 5 is caused by biallelic PEX5 variants that
  remove the long isoform of the protein while sparing the short one. It exists as a
  distinct entity because of an isoform accident with unusually clean mechanistic
  consequences. PEX5 is the cytosolic receptor for peroxisomal matrix proteins carrying
  targeting signal 1, and it is transcribed as two isoforms: PEX5S, which does PTS1
  import only, and PEX5L, which does PTS1 import and additionally acts as the co-receptor
  through which PEX7 delivers PTS2-tagged cargo. Every previously reported PEX5 patient
  had a Zellweger spectrum disorder, because their variants knocked out PTS1 import.
  The RCDP5 variant sits in exon 9, which is specific to the long isoform, so PTS1 import
  survives intact and only the PTS2 arm fails - reproducing exactly the lesion that PEX7
  loss produces in RCDP1, from the other side of the same receptor complex. One gene
  therefore gives two unrelated diseases depending on which isoform an allele hits, and
  the practical consequence is stated in the founding paper: a patient with a selective
  PTS2 import defect needs PEX7 sequenced and PEX5 exon 9 sequenced, because the
  biochemistry alone will not tell them apart. Clinically the four reported patients had
  congenital cataracts, postnatal growth delay, microcephaly, and severe intellectual
  disability, but only mild humeral shortening in three and chondrodysplasia punctata in
  two - a milder and less consistently rhizomelic skeletal picture than classic RCDP1,
  which matters when deciding whether to look for the disorder at all.
synonyms:
- RCDP5
- PEX5 rhizomelic chondrodysplasia punctata
- Rhizomelic chondrodysplasia punctata, type 5
- PEX5L deficiency

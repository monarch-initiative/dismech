differential_diagnoses:
- name: Rhizomelic chondrodysplasia punctata type 1 (PEX7)
  disease_term:
    preferred_term: rhizomelic chondrodysplasia punctata type 1
    term:
      id: MONDO:0008972
      label: rhizomelic chondrodysplasia punctata type 1
  description: >-
    The differential that cannot be resolved biochemically. RCDP1 and RCDP5 are the two
    import-receptor forms and produce the identical selective PTS2 import defect, from the
    two partners of the same receptor complex. Only sequencing separates them.
  distinguishing_features:
  - RCDP1 is caused by PEX7 variants; RCDP5 by variants in the PEX5L-specific exon 9
  - The biochemical profiles are indistinguishable, which is why both genes must be tested
  - The reported RCDP5 patients had milder and less consistent skeletal features than classic RCDP1 and survived into the second decade
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the biochemical overlap between RCDP1 and RCDP5,"
    explanation: States the biochemical overlap that makes molecular testing necessary.
- name: Rhizomelic chondrodysplasia punctata, plasmalogen-synthesis defect (RCDP2/3/4)
  disease_term:
    preferred_term: rhizomelic chondrodysplasia punctata
    term:
      id: MONDO:0015776
      label: rhizomelic chondrodysplasia punctata
  description: >-
    The single-enzyme forms, caused by loss of GNPAT, AGPS, or FAR1 rather than by an
    import defect. They converge on plasmalogen deficiency but lie downstream of import, so
    phytanic-acid alpha-oxidation is preserved.
  distinguishing_features:
  - Phytanic acid is normal in RCDP2/3/4 and elevated in RCDP5
  - The lesion is in a biosynthetic enzyme rather than in peroxisomal protein import
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three additional RCDP types, RCDP2-3-4, are caused, respectively, by mutations in
      GNPAT, AGPS and FAR1, encoding enzymes involved in plasmalogen biosynthesis.
    explanation: Identifies the single-enzyme forms and their genes.
- name: Zellweger spectrum disorders
  disease_term:
    preferred_term: Zellweger spectrum disorders
    term:
      id: MONDO:0019609
      label: Zellweger spectrum disorders
  description: >-
    The other, and far more common, PEX5 phenotype. Variants affecting both isoforms remove
    PTS1 import and cause a generalized peroxisome biogenesis disorder. The reported RCDP5
    patients lacked the ZSD-typical hepatic dysfunction and sensorineural hearing loss.
  distinguishing_features:
  - ZSD involves failure of PTS1 import and hence generalized peroxisomal dysfunction; RCDP5 spares PTS1 import entirely
  - Hepatic dysfunction and sensorineural hearing loss are typical of ZSD and were absent in the RCDP5 patients
  - Congenital cataract with chondrodysplasia punctata points towards RCDP rather than ZSD
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      lacked several features
      typically associated with ZSD, such as hepatic dysfunction and
      sensorineural hearing loss
    explanation: >-
      Names the ZSD features absent in these patients, which is what separated the two
      phenotypes clinically before the isoform mechanism was established.
discussions:
- discussion_id: rcdp5_phenotypic_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Skeletal Dysplasia
  - disease#Rhizomelic Chondrodysplasia Punctata Type 5
  prompt: >-
    Is the milder, less consistently rhizomelic skeletal phenotype of RCDP5 a real property
    of the disorder, or an artefact of the single allele on which the entity was defined?
  rationale: >-
    All four described patients are homozygous for one frameshift in two families, so the
    entity's clinical description and its genotype are entirely confounded. The reported
    phenotype - chondrodysplasia punctata in only two of four, mild humeral shortening in
    three, survival into the second decade - is milder than classic RCDP1 and would fit the
    nonclassic RCDP pattern. Whether that reflects the isoform lesion, this particular
    allele, or the two families is untestable on the published cohort. It matters for
    ascertainment: if RCDP5 is genuinely milder, patients are being missed, since a
    plasmalogen screen showing only mild reduction in a child without striking rhizomelia is
    unlikely to prompt PEX5 exon 9 sequencing.
  proposed_experiments:
  - experiment_id: rcdp5_allelic_series
    name: Broader ascertainment of PEX5L-selective alleles
    description: >-
      Targeted analysis of PEX5 exon 9 in cohorts with a selective PTS2 import defect and no
      PEX7 variant, to determine whether other PEX5L-selective alleles exist and whether
      they reproduce the attenuated skeletal phenotype.
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mild shortening of humeri in
      three patients, and chondrodysplasia punctata in two patients,
    explanation: >-
      The per-feature counts show that the defining skeletal features were not present in
      every patient, which is the observation the question turns on.
notes: >-
  Curated as its own dismech entry rather than merged into the PEX7 entry, even though the
  two share a mechanism node. Three reasons. The ISDS 2023 nosology lists the five
  rhizomelic-CDP entities as five separate rows by gene, and NOS 23-0100 is this one.
  MONDO carries a distinct class, MONDO:0014743. And the interesting content here is
  gene-specific rather than mechanism-specific: it is the isoform-selective allele that
  makes one gene give two unrelated diseases, which has no counterpart in the PEX7 entry.
  This is a different judgement from the one made for RCDP2/3/4, which dismech lumps into a
  single entry - there the three genes are consecutive steps of one biosynthetic pathway
  with nothing gene-specific to say, whereas here the gene is the story. A member of the
  Chondrodysplasia_Punctata grouping.

  The two pathophysiology nodes shared with RCDP1 carry the same conforms_to links to the
  peroxisomal_metabolic_failure module that the RCDP1 entry uses, since the lesion is the
  same at both nodes - that is the whole point of naming them identically.

  The GeneReviews-tagged reference (PMID:20301447) is the PEX7/RCDP1 chapter, not an RCDP5
  chapter: none exists. It is cited once, for supportive management, and graded PARTIAL for
  that reason. Deep-mining a PEX7 chapter for a PEX5 disease would be an entity-confusion
  error, so the restraint is deliberate.

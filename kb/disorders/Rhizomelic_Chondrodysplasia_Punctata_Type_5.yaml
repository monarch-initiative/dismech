    snippet: >-
      postnatal growth delay, microcephaly and severe intellectual
      disability in all four patients
    explanation: States the neurological findings and that they were present in all four patients.
  downstream:
  - target: Severe Intellectual Disability
    causal_link_type: DIRECT
    description: Severe intellectual disability was present in all four reported patients.
  - target: Microcephaly
    causal_link_type: DIRECT
    description: Microcephaly developed postnatally.
  - target: Seizure

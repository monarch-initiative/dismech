biochemical:
- name: Erythrocyte or fibroblast plasmalogens
  notes: >-
    Reduced, but only mildly so in the reported patients - a softer signal than in classic
    RCDP1. GNPAT activity in fibroblasts was also reduced, which is the expected surrogate
    when the PTS2-targeted AGPS fails to reach the peroxisomal matrix.
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All RCDP types
      are characterized by low levels of plasmalogens
    explanation: Establishes reduced plasmalogens as the expected finding in every RCDP type.
- name: Plasma phytanic acid
  notes: >-
    Highly elevated, with markedly reduced fibroblast phytanic-acid alpha-oxidation. This
    is the discriminator from RCDP2/3/4, where alpha-oxidation is preserved, and it is
    shared with RCDP1 - so it separates the mechanistic class but not the two entities
    within it.
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT

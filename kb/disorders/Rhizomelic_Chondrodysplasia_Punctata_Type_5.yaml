      general, which is the pattern the reported RCDP5 patients fit, rather than making a
      survival claim about RCDP5 specifically.
pathophysiology:
- name: Loss of the PEX5 Long Isoform
  biological_scale: MOLECULAR
  description: >-
    PEX5 is transcribed as two isoforms. Both PEX5L and PEX5S recognize PTS1-tagged cargo,
    but only PEX5L serves as the co-receptor for PEX7-mediated import of PTS2-tagged cargo.
    The RCDP5 frameshift lies in exon 9, which is present only in the long transcript, so
    it removes PEX5L and leaves PEX5S intact. This is the whole mechanism of the disorder
    and the reason it is not a Zellweger spectrum disorder.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    gene:
      preferred_term: PEX5
      term:
        id: hgnc:9719
        label: PEX5
    description: >-
      Homozygous frameshift in the PEX5L-specific exon 9 in all four reported patients from
      two independent families. The functional impact is isoform-selective rather than
      whole-gene: PEX5S is unaffected, which is why PTS1 import is preserved.
  biological_processes:
  - preferred_term: protein import into peroxisome matrix
    modifier: DECREASED
    term:
      id: GO:0016558
      label: protein import into peroxisome matrix
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PEX5 encodes two isoforms, PEX5L and PEX5S, and we show that the c.722dupA mutation,
      located in the PEX5L-specific exon 9, results in loss of PEX5L only.
    explanation: Establishes the isoform-selective consequence of the variant.
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that PEX5L expression restores the import of PTS2-tagged proteins in
      patient fibroblasts.
    explanation: >-
      Complementation of patient fibroblasts with PEX5L restores the defective function,
      establishing causation rather than association.
  downstream:
  - target: Selective PTS2 Import Failure
    description: >-
      With PEX5L gone, PEX7 has no co-receptor, so PTS2-tagged cargo is not delivered into
      the peroxisomal matrix, while PTS1 import proceeds through the surviving short
      isoform.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26220973
      reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Both PEX5 isoforms recognize PTS1-tagged proteins, but PEX5L is also a co-receptor
        for PTS2-tagged proteins.
      explanation: >-
        The division of labour between the isoforms is what makes the import failure
        selective.
- name: Selective PTS2 Import Failure
  conforms_to: "peroxisomal_metabolic_failure#Peroxisomal Biogenesis or Enzyme Defect"
  biological_scale: CELLULAR
  description: >-
    An isolated failure to import the three known PTS2-tagged peroxisomal matrix proteins:
    alkyl-DHAP synthase (AGPS), which makes the ether bond in plasmalogens; phytanoyl-CoA
    2-hydroxylase (PHYH), which performs phytanic-acid alpha-oxidation; and acetyl-CoA
    acyltransferase 1 (ACAA1). Peroxisomes are otherwise assembled and PTS1 import is
    normal, so this is a targeted functional lesion rather than a general peroxisome
    biogenesis failure - which is why the disorder is an RCDP and not a Zellweger spectrum
    disorder. The node is deliberately named to match the corresponding node in the RCDP1
    entry, since the two disorders converge on it from opposite sides of the same receptor
    pair.
  cellular_components:
  - preferred_term: peroxisome
    term:
      id: GO:0005777
      label: peroxisome
  biological_processes:
  - preferred_term: protein targeting to peroxisome
    modifier: DECREASED
    term:
      id: GO:0006625
      label: protein targeting to peroxisome
  - preferred_term: protein import into peroxisome matrix
    modifier: DECREASED
    term:
      id: GO:0016558
      label: protein import into peroxisome matrix
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Similarly to mutations in PEX7, loss of PEX5L results in deficient import of
      PTS2-tagged proteins only, thus causing RCDP instead of ZSD.
    explanation: >-
      States both the selectivity of the import defect and the nosological consequence that
      follows from it.
  downstream:
  - target: Plasmalogen (Ether Lipid) Deficiency
    description: >-
      Failure to import AGPS impairs ether-phospholipid synthesis. Notably the reduction is
      described as mild in these patients, and the surrogate marker GNPAT activity was also
      reduced - the pattern expected when the PTS2-targeted AGPS fails to reach the matrix.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26220973
      reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        All RCDP types
        are characterized by low levels of plasmalogens
      explanation: >-
        Establishes plasmalogen deficiency as the shared biochemical endpoint of every RCDP
        type, this one included.
  - target: Phytanic Acid Accumulation
    description: >-
      Failure to import PHYH blocks phytanic-acid alpha-oxidation. This is the feature that
      the import-receptor forms share and that the single-enzyme plasmalogen-synthesis forms
      RCDP2/3/4 do not have, and it is therefore the biochemical discriminator between the
      two mechanistic classes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26220973
      reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Three PTS2-tagged peroxisomal matrix proteins are known:
        AGPS, involved in plasmalogen biosynthesis
      explanation: >-
        Identifies the PTS2 cargo set, whose members' failure to be imported produces both
        the plasmalogen and the phytanic-acid abnormalities.
- name: Plasmalogen (Ether Lipid) Deficiency
  conforms_to: "peroxisomal_metabolic_failure#Toxic Fatty-Acid Accumulation with Ether-Lipid Deficiency"
  biological_scale: MOLECULAR
  description: >-
    Reduced cellular plasmalogens, the shared endpoint of every RCDP type. In the reported
    RCDP5 patients the reduction was mild rather than profound, which fits their milder and
    less consistently rhizomelic skeletal phenotype but also means the disorder can be
    missed on a plasmalogen screen alone.
  biological_processes:
  - preferred_term: ether lipid biosynthesis
    modifier: DECREASED
    term:
      id: GO:0008611
      label: ether lipid biosynthetic process
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Three additional RCDP types, RCDP2-3-4, are caused, respectively, by mutations in
      GNPAT, AGPS and FAR1, encoding enzymes involved in plasmalogen biosynthesis.
    explanation: >-
      Places the plasmalogen pathway as the common convergence point across RCDP types,
      reached here through import failure rather than through enzyme loss.
  downstream:
  - target: Skeletal Dysplasia
    description: >-
      Plasmalogen deficiency is the lesion shared by all RCDP types and the presumed route
      to the skeletal phenotype, though the intervening steps are not established in any of
      them.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Congenital Cataract
    description: >-
      Congenital cataract is the most consistent non-skeletal feature across the RCDP types
      and was present in all four RCDP5 patients; the route from plasmalogen deficiency to
      lens opacity is not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Phytanic Acid Accumulation
  biological_scale: MOLECULAR
  description: >-
    Loss of peroxisomal phytanic-acid alpha-oxidation, following failure to import PHYH.
    In the reported patients plasma phytanic acid was highly elevated and fibroblast
    alpha-oxidation markedly reduced - a more striking abnormality than their mild
    plasmalogen reduction, and the finding that most clearly marks the disorder as an
    import-receptor rather than a single-enzyme RCDP.
  biological_processes:
  - preferred_term: fatty acid alpha-oxidation
    modifier: DECREASED
    term:
      id: GO:0001561
      label: fatty acid alpha-oxidation
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      phytanoyl-CoA
      2-hydroxylase (PHYH) (28), involved in phytanic acid
    explanation: >-
      Identifies phytanoyl-CoA 2-hydroxylase, the enzyme of phytanic-acid alpha-oxidation, as
      PTS2-tagged cargo - so a selective PTS2 import failure necessarily blocks that pathway.
  downstream:
  - target: Neurological Impairment
    description: >-
      Phytanic acid accumulation is neurotoxic in the peroxisomal disorders generally; the
      specific contribution it makes to the developmental and peripheral-nerve findings in
      this disorder is not separable from that of plasmalogen deficiency on the available
      evidence.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Skeletal Dysplasia
  biological_scale: TISSUE
  description: >-
    Disordered endochondral ossification with punctate epiphyseal calcification and
    proximal limb shortening. In RCDP5 this arm of the phenotype is attenuated relative to
    classic RCDP1: humeral shortening was mild and present in three of four patients, and
    chondrodysplasia punctata in only two.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: growth plate cartilage chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  biological_processes:
  - preferred_term: endochondral ossification
    modifier: ABNORMAL
    term:
      id: GO:0001958
      label: endochondral ossification
  evidence:

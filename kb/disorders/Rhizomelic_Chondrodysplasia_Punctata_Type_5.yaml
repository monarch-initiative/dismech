    snippet: >-
      phytanoyl-CoA
      2-hydroxylase (PHYH) (28), involved in phytanic acid
    explanation: >-
      Identifies phytanoyl-CoA 2-hydroxylase as PTS2-tagged cargo, which is why an import
      defect raises phytanic acid while a defect in a plasmalogen-synthesis enzyme does not.
diagnosis:
- name: Sequencing PEX7 and PEX5 exon 9 in a selective PTS2 import defect
  description: >-
    Because RCDP1 and RCDP5 are biochemically indistinguishable, a patient shown to have a
    selective PTS2 import defect needs both genes tested. The founding paper makes this an
    explicit recommendation, and it is the disorder's main practical consequence for
    laboratory workflow.

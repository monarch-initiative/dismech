progression:
- phase: Infancy - congenital cataracts
  notes: >-
    All four reported patients had congenital cataracts requiring surgery in the first
    months. As in RCDP1, the cataract is the earliest and most consistent feature and
    typically precedes recognition of the metabolic disorder.
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the phenotype in our patients, including congenital cataracts,
    explanation: Records congenital cataracts as a feature of the reported cohort.
- phase: Early childhood - growth delay, microcephaly, developmental impairment
  notes: >-
    Growth delay and microcephaly emerge after the first one to two years, with severe
    intellectual disability in all four patients. Seizures with epileptiform EEG developed
    in several.
  evidence:
  - reference: PMID:26220973
    reference_title: "A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss of the PEX5 long isoform."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      postnatal growth delay, microcephaly and severe intellectual
      disability in all four patients, mild shortening of humeri in
      three patients, and chondrodysplasia punctata in two patients,
    explanation: >-
      Gives the phenotype with the per-feature counts, including the important observation
      that the skeletal features were present in only some patients.
- phase: Survival beyond the first decade
  notes: >-
    Unlike classic RCDP1, where death within the first decade is typical, the reported
    RCDP5 patients survived into the second decade, with clinical assessments recorded at
    9.5, 10.5, and 13 years.
  evidence:
  - reference: PMID:26220973

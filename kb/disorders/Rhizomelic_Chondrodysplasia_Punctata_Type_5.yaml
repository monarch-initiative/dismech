    label: rhizomelic chondrodysplasia punctata type 5
parents:
- Rhizomelic Chondrodysplasia Punctata
- Peroxisome Biogenesis Disorder
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      An autosomal recessive Mendelian skeletal dysplasia diagnosed by molecular testing.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Also an inborn error of metabolism: the entity is defined by a selective peroxisomal
      protein-import defect with a measurable metabolite signature - reduced plasmalogens
      with elevated phytanic acid.
  icimd_category:
  - classification_value: peroxisomal_biogenesis
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Peroxisomal biogenesis disorders
      (peroxin-related)" under category "Disorders of organelle biogenesis, dynamics and
      interactions". PEX5 is a peroxin and the lesion is at the matrix-protein import step,
      which is the same reasoning that places RCDP1 (PEX7) here and distinguishes both from
      the single-enzyme forms RCDP2/3/4, which take "Disorders of glycerophospholipid
      metabolism".
  isds_skeletal_category:
  - classification_value: chondrodysplasia_punctata
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 23 "Chondrodysplasia punctata (CDP) group", row
      NOS 23-0100 "Rhizomelic CDP, PEX5-related" (MIM 616716). This row is new relative to
      the 2019 revision, which predated wide recognition of the entity; the group itself
      was numbered 21 there. The nosology lists the five rhizomelic-CDP entities as five
      separate rows by gene, and dismech follows that split here rather than folding this
      entity into the PEX7 entry.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0014743
      label: rhizomelic chondrodysplasia punctata type 5
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The dismech entry and the MONDO class denote the same entity: PEX5-related rhizomelic
      chondrodysplasia punctata arising from loss of the PEX5 long isoform. The other PEX5
      phenotype, Zellweger spectrum disorder from loss of PTS1 import, is a separate concept
      and is handled here as a differential.

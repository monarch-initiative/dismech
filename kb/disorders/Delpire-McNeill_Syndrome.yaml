name: Delpire-McNeill Syndrome
creation_date: "2026-04-14T00:00:00Z"
description: >-
  Delpire-McNeill syndrome (OMIM 619083; ORPHA:633024) is an autosomal dominant
  neurodevelopmental disorder caused by heterozygous (typically de novo) pathogenic
  variants in SLC12A2, which encodes the basolateral Na-K-2Cl cotransporter 1 (NKCC1).
  It represents the heterozygous haploinsufficient or dominant-negative counterpart to
  autosomal recessive Kilquist syndrome (caused by biallelic SLC12A2 loss of function)
  and is allelic with exon 21-restricted autosomal dominant nonsyndromic deafness 78
  (DFNA78), which presents with isolated congenital sensorineural hearing loss and
  vestibular areflexia. Impaired NKCC1 chloride transport disrupts intracellular
  chloride homeostasis and depolarizing GABAergic signaling in fetal radial glial cells
  during cortical neurogenesis, compromises stria vascularis potassium-rich endolymph
  production in the cochlea, and impairs basolateral fluid secretion across exocrine
  epithelia. Affected individuals present in infancy with global developmental delay,
  mild-to-severe intellectual disability, delayed or absent speech, hypotonia or
  spasticity, autistic features, variable structural brain anomalies (cortical dysplasia
  and agenesis of the corpus callosum), bilateral sensorineural hearing loss, feeding or
  swallowing difficulties, and variable congenital anomalies including ventricular septal
  defect, tracheoesophageal fistula, and hip dislocation.

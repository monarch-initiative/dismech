differential_diagnoses:
- name: Kilquist syndrome
  disease_term:
    preferred_term: Kilquist syndrome
    term:
      id: MONDO:0033664
      label: Kilquist syndrome
  description: >-
    Kilquist syndrome (autosomal recessive, biallelic SLC12A2 loss of
    function) overlaps with Delpire-McNeill syndrome but results from
    complete NKCC1 deficiency rather than haploinsufficiency. Kilquist
    syndrome presents with a more severe phenotype including profound global
    developmental delay, sensorineural hearing loss, absent salivation and
    tear production, and gastrointestinal dysmotility. Distinguishing the
    two disorders requires SLC12A2 molecular testing to determine zygosity.
  distinguishing_features:
  - De novo heterozygous SLC12A2 variant with variable neurodevelopmental severity favors Delpire-McNeill syndrome.
  - Biallelic SLC12A2 loss of function with absent epithelial secretions and more severe gastrointestinal dysfunction favors Kilquist syndrome.
  evidence:
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequently, several patients with severe developmental delay, sensorineural hearing loss, and bi-allelic loss of function variants were reported; this condition is known as Kilquist syndrome."
    explanation: >-
      Confirms Kilquist syndrome as the biallelic SLC12A2 disorder, distinct
      from the heterozygous Delpire-McNeill syndrome.
  - reference: PMID:30740830
    reference_title: "Kilquist syndrome: A novel syndromic hearing loss disorder caused by homozygous deletion of SLC12A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein we describe a child admitted to the NIH Undiagnosed Diseases Program with global developmental delay, sensorineural hearing loss, gastrointestinal abnormalities, and absent salivation."
    explanation: >-
      Characterizes the severe autosomal recessive Kilquist syndrome phenotype
      caused by homozygous SLC12A2 loss of function.
- name: Autosomal dominant nonsyndromic deafness 78
  disease_term:
    preferred_term: hearing loss, autosomal dominant 78
    term:
      id: MONDO:0033665
      label: hearing loss, autosomal dominant 78
  description: >-
    Autosomal dominant nonsyndromic deafness 78 (DFNA78; OMIM 619081) is an
    allelic disorder caused by heterozygous missense or splicing variants
    affecting exon 21 of SLC12A2, which is selectively included in the
    cochlear/inner-ear NKCC1 isoform. Unlike Delpire-McNeill syndrome, DFNA78
    presents with congenital profound bilateral sensorineural hearing loss and
    vestibular areflexia without global developmental delay, intellectual
    disability, or structural brain malformations.
  distinguishing_features:
  - Global developmental delay, intellectual disability, speech impairment, and variants outside exon 21 of SLC12A2 favor Delpire-McNeill syndrome.
  - Isolated congenital sensorineural hearing loss with vestibular areflexia and exon 21-specific missense or splice variants in SLC12A2 without cognitive impairment favor DFNA78.
  evidence:
  - reference: PMID:32658972
    reference_title: "SLC12A2 variants cause a neurodevelopmental disorder or cochleovestibular defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also identified SLC12A2 variants in three individuals with non-syndromic bilateral sensorineural hearing loss and vestibular areflexia."
    explanation: >-
      Establishes non-syndromic bilateral sensorineural hearing loss with
      vestibular areflexia as a distinct allelic presentation of heterozygous
      SLC12A2 variants.
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient with profound congenital hearing loss and vestibular areflexia with a de novo variant in SLC12A2 located in the splice donor site: NM_001046.2: c.2977+4_2977+7del causing an in-frame skip of exon 21"
    explanation: >-
      Demonstrates that exon 21-skipping de novo SLC12A2 variants cause isolated
      congenital sensorineural hearing loss and vestibular areflexia without
      syndromic neurodevelopmental impairment.
- name: Usher syndrome
  disease_term:
    preferred_term: Usher syndrome
    term:
      id: MONDO:0019501
      label: Usher syndrome
  description: >-
    Usher syndrome (particularly type I) is primarily relevant when evaluating
    the sensorineural hearing loss component: it presents with congenital
    profound bilateral sensorineural hearing loss and vestibular areflexia that
    can mimic the cochleovestibular presentation of heterozygous SLC12A2
    variants before retinitis pigmentosa develops.
  distinguishing_features:
  - Heterozygous SLC12A2 pathogenic variant without retinal degeneration or Usher gene mutations favors SLC12A2-related disease.
  - Biallelic pathogenic variants in Usher genes (MYO7A, USH1C, CDH23, PCDH15, USH2A) with progressive retinitis pigmentosa favor Usher syndrome.
  evidence:
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      From a genetic counseling point of view, it reminds us that beyond
      syndromic forms such as Usher syndrome, several non-syndromic forms of
      genetically determined sensorineural hearing loss, including those
      involving the SLC12A2 gene, may also present with vestibular areflexia.
    explanation: >-
      Explicitly identifies Usher syndrome as a key differential diagnosis for
      congenital sensorineural hearing loss with vestibular areflexia.

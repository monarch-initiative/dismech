- name: Inner Ear Endolymph Dysfunction
  description: >
    NKCC1 is essential for endolymph production in the inner ear. It is expressed in
    the strial marginal cells of the cochlea, where it drives potassium and chloride
    transport into the endolymph. Loss of NKCC1 function leads to reduced endolymph
    volume, impaired potassium recycling required for auditory mechanotransduction,
    and bilateral sensorineural hearing loss.

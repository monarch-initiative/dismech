      entry (about two-thirds of cases), so the mapped class is narrower than
      the entry; it is curated here as the UPD(14)pat subtype. OMIM uses the
      number 608149 for Kagami-Ogata syndrome as a whole, which is why the
      class carries the OMIM xref while being molecularly narrower.

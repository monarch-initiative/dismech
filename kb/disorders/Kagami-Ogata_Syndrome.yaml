genetic:
- name: RTL1
  gene_term:
    preferred_term: RTL1
    term:
      id: hgnc:14665
      label: RTL1
  presence: Positive
  association: Paternally expressed retrotransposon-derived gene overexpressed in KOS
  features: >-
    RTL1 (PEG11/SIRH2) dosage rises about 2.5-fold to five-fold when the
    maternal RTL1as microRNAs are lost. RTL1 overproduction is considered the
    primary driver of the placental, thoracic and muscle phenotype.
  notes: >-
    relationship_type is left unset because no GeneDiseaseRelationshipEnum
    value describes an imprinted dosage gene: KOS is caused by the
    parent-of-origin state of the 14q32.2 region (UPD14, DMR methylation or
    deletion), not by sequence variants in RTL1, so CAUSATIVE would overstate
    a Mendelian relationship.
  evidence:
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "RTL1 expression level becomes ~2.5 times increased in the absence of functional RTL1as-encoded microRNAs that act as a trans-acting repressor for RTL1"
    explanation: RTL1 overexpression follows loss of RTL1as microRNAs.
- name: DLK1
  gene_term:
    preferred_term: DLK1
    term:
      id: hgnc:2907
      label: DLK1
  presence: Positive
  association: Paternally expressed gene doubled with UPD(14)pat and epimutation
  features: >-
    DLK1 expression is doubled with UPD(14)pat and epimutations, but typical
    KOS occurs with deletions that leave DLK1 dosage normal.
  notes: relationship_type is left unset for the same reason as RTL1.
  evidence:
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, as patients with Deletions-2 and -4 are associated with typical KOS phenotype in the presence of a normal (1 time) DLK1 expression dosage, this argues against a major effect of doubled DLK1 expression dosage on phenotypic development."
    explanation: DLK1 excess is present in most cases but is not a major driver.
- name: MEG3
  gene_term:
    preferred_term: MEG3
    term:
      id: hgnc:14575
      label: MEG3
  presence: Positive
  association: Maternally expressed lncRNA lost in KOS; its promoter carries the MEG3-DMR
  features: >-
    MEG3 and the other maternally expressed noncoding RNAs are absent with
    UPD(14)pat, maternal hypermethylation and DMR deletions. Small maternal
    deletions disrupting MEG3 without affecting placental RTL1as expression
    lack placentomegaly, which argues against a role for MEG3 deficiency in the
    placental phenotype.
  notes: relationship_type is left unset for the same reason as RTL1.
  evidence:
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This notion explains lack of placentomegaly and polyhydramnios in Deletion-7, and excludes a positive role of MEG3 deficiency in the development of aberrant placental phenotype."
    explanation: MEG3 loss alone does not produce the placental phenotype.
pathophysiology:
- name: Loss of Maternal 14q32.2 Imprinted Expression
  biological_scale: MOLECULAR
  description: >-
    The unmethylated maternal IG-DMR (placenta) and MEG3-DMR (body) are the
    imprinting control centres of the DLK1-DIO3 domain. Paternal UPD14,
    maternal hypermethylation, or deletion of these DMRs converts the maternal
    allele to a paternal-type state, abolishing expression of the maternally
    expressed noncoding RNAs (MEG3, RTL1as, MEG8, snoRNAs and microRNAs).
  genes:
  - preferred_term: MEG3
    term:
      id: hgnc:14575
      label: MEG3
  biological_processes:
  - preferred_term: autosome genomic imprinting
    term:
      id: GO:0141068
      label: autosome genomic imprinting
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the unmethylated IG-DMR and MEG3-DMR of maternal origin function as the imprinting control centers in the placenta and body respectively, with a hierarchical interaction regulated by the IG-DMR for the methylation pattern of the MEG3-DMR in the body"
    explanation: Defines the maternal DMRs whose loss underlies KOS.
  - reference: PMID:25689926
    reference_title: Comprehensive clinical studies in 34 patients with molecularly defined UPD(14)pat and related conditions (Kagami-Ogata syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Paternal uniparental disomy 14 (UPD(14)pat) and epimutations and microdeletions affecting the maternally derived 14q32.2 imprinted region lead to a unique constellation of clinical features"
    explanation: All three molecular routes converge on loss of the maternal imprinted contribution.
  downstream:
  - target: Loss of RTL1as microRNA Repression of RTL1
    description: Absence of the maternal transcripts removes RTL1as and its microRNAs.
- name: Loss of RTL1as microRNA Repression of RTL1
  biological_scale: MOLECULAR
  description: >-
    RTL1as, transcribed antisense to RTL1 from the maternal allele, encodes
    microRNAs (including miR-127, miR-433, miR-136 and miR-431) that act in
    trans to cleave RTL1 mRNA. Without them, RTL1 transcripts escape repression.
    RTL1as has no separate HGNC symbol; MIR127 is bound here as a representative
    of the RTL1as-encoded microRNAs.
  genes:
  - preferred_term: MIR127
    term:
      id: hgnc:31509
      label: MIR127
  biological_processes:
  - preferred_term: miRNA-mediated post-transcriptional gene silencing
    term:
      id: GO:0035195
      label: miRNA-mediated post-transcriptional gene silencing
    modifier: DECREASED
  evidence:
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "RTL1as-encoded microRNAs function as a trans-acting repressor for RTL1 expression"
    explanation: Establishes RTL1as microRNAs as repressors of RTL1.
  - reference: PMID:32878913
    reference_title: Deficiency and overexpression of Rtl1 in the mouse cause distinct muscle abnormalities related to Temple and Kagami-Ogata syndromes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Interestingly, its mRNA is regulated by seven microRNAs (miRNAs) processed from maternally expressed RTL1as (RTL1 antisense transcript) through an RNAi mechanism"
    explanation: Describes the RNAi mechanism by which RTL1as microRNAs regulate RTL1 mRNA.
  - reference: PMID:26138477
    reference_title: A trans-homologue interaction between reciprocally imprinted miR-127 and Rtl1 regulates placenta development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Phenotypic analysis of single (ΔmiR-127/Rtl1 or miR-127/ΔRtl1) and double (ΔmiR-127/ΔRtl1) heterozygous miR-127- and Rtl1-deficient mice indicate that Rtl1 is the main target gene of miR-127 in placental development."
    explanation: Mouse genetic interaction showing Rtl1 is the main placental target of miR-127.
  downstream:
  - target: RTL1 Dosage Excess
    description: Loss of microRNA-directed cleavage raises RTL1 dosage above the twofold expected from two paternal alleles.
- name: RTL1 Dosage Excess
  biological_scale: MOLECULAR
  description: >-
    RTL1 (PEG11, SIRH2) is a eutherian-specific paternally expressed gene
    derived from a Ty3/Gypsy (sushi-ichi-related) LTR retrotransposon. In KOS,
    RTL1 expression rises about five-fold with UPD(14)pat or epimutation and
    about 2.5-fold with deletions that spare one paternal-type RTL1 copy.
    Excess RTL1, together with absent maternal transcripts, is considered the
    primary factor behind the phenotype; clinical severity tracks the degree of
    RTL1 overproduction.
  genes:
  - preferred_term: RTL1
    term:
      id: hgnc:14665
      label: RTL1
  evidence:
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Actually, quantitative PCR analyses have indicated ~5 times, rather than 2 times, increased RTL1 expression level in fresh placentas with upd(14)pat, as well as doubled DLK1 expression level and absent MEGs expression."
    explanation: Measured RTL1 overexpression in UPD(14)pat placentas.
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "excessive RTL1 expression and absent MEG expression constitute the primary underlying factor for the phenotypic development"
    explanation: Identifies excess RTL1 as the primary driver.
  - reference: PMID:18176563
    reference_title: Deletions and epimutations affecting the human 14q32.2 imprinted region in individuals with paternal and maternal upd(14)-like phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "excessive RTL1 expression and decreased DLK1 and RTL1 expression are relevant to upd(14)pat-like and upd(14)mat-like phenotypes, respectively"
    explanation: Relates excess RTL1 to the upd(14)pat-like (KOS) phenotype.
  downstream:
  - target: Placental Fetal Capillary Overgrowth and Placentomegaly
    description: Excess RTL1 in placental villous endothelium and pericytes drives placental enlargement.
  - target: Respiratory and Abdominal Skeletal Muscle Defects
    description: Overproduced RTL1 disturbs fetal intercostal, diaphragm and abdominal muscle development.
- name: DLK1 Dosage Increase
  biological_scale: MOLECULAR
  description: >-
    With UPD(14)pat or epimutation DLK1, the other paternally expressed
    protein-coding gene, is doubled. Patients with deletions that leave DLK1 at
    normal dosage still have typical KOS, which argues against a major
    contribution of DLK1 excess.
  genes:
  - preferred_term: DLK1
    term:
      id: hgnc:2907
      label: DLK1
  evidence:
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, as patients with Deletions-2 and -4 are associated with typical KOS phenotype in the presence of a normal (1 time) DLK1 expression dosage, this argues against a major effect of doubled DLK1 expression dosage on phenotypic development."
    explanation: Genotype-phenotype correlation indicating DLK1 excess is not a major driver.
- name: Placental Fetal Capillary Overgrowth and Placentomegaly
  biological_scale: TISSUE
  description: >-
    RTL1 protein is markedly increased in the vascular endothelial cells and
    pericytes of chorionic villi. In mice, Rtl1 is required to maintain the
    fetal capillary network of the placental labyrinth, and Rtl1 overproduction
    from loss of Rtl1as causes placentomegaly of about 150%. Placentomegaly
    contributes to polyhydramnios.
  cell_types:
  - preferred_term: villous capillary endothelial cell
    term:
      id: CL:0002144
      label: capillary endothelial cell
  - preferred_term: villous pericyte
    term:
      id: CL:0000669
      label: pericyte
  biological_processes:
  - preferred_term: labyrinthine layer blood vessel development
    term:
      id: GO:0060716
      label: labyrinthine layer blood vessel development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemical examinations have also identified markedly increased RTL1 protein expression and moderately increased DLK1 protein expression in the vascular endothelial cells and pericytes of chorionic villi with upd(14)pat."
    explanation: Localizes RTL1 excess to villous endothelium and pericytes in human placenta.
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "In particular, excessive RTL1 expression would play a crucial role in the development of placental features, because Rtl1as knockout mice have placentomegaly (~150%) in the presence of 2.5–3.0 times Rtl1 expression and apparently normal expression of other imprinted genes in this domain."
    explanation: Mouse Rtl1as knockout links isolated Rtl1 excess to placentomegaly.
  - reference: PMID:18176565
    reference_title: "Role of retrotransposon-derived imprinted gene, Rtl1, in the feto-maternal interface of mouse placenta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we demonstrate that retrotransposon-derived Rtl1 (retrotransposon-like 1), also known as Peg11 (paternally expressed 11), is essential for maintenance of the fetal capillaries, and that both its loss and its overproduction cause late-fetal and/or neonatal lethality in mice."
    explanation: Rtl1 maintains placental fetal capillaries, and both loss and overproduction are deleterious.
  downstream:
  - target: Placentomegaly
    description: The enlarged placenta is the clinical expression of this node.
  - target: Polyhydramnios
    description: Placentomegaly is proposed to increase amniotic fluid production across the placenta.
- name: Respiratory and Abdominal Skeletal Muscle Defects
  biological_scale: TISSUE
  description: >-
    In mice, Rtl1 is expressed in fetal skeletal muscle. Overproduction of Rtl1
    after maternal transmission of an Rtl1/Rtl1as deletion causes severe defects
    of the intercostal, diaphragm and abdominal muscles, with fragile,
    shrinking fibers and increased centronuclear fibers, and neonatal
    lethality. These defects are proposed to underlie the bell-shaped thorax,
    respiratory insufficiency and diastasis recti of KOS.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: skeletal muscle tissue development
    term:
      id: GO:0007519
      label: skeletal muscle tissue development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32878913
    reference_title: Deficiency and overexpression of Rtl1 in the mouse cause distinct muscle abnormalities related to Temple and Kagami-Ogata syndromes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we demonstrate that Rtl1 also plays an important role in fetal/neonatal skeletal muscle development: its deletion and overproduction in mice lead to neonatal lethality associated with severe but distinct skeletal muscle defects, similar to those of Temple and Kagami-Ogata syndromes, respectively."
    explanation: Rtl1 overproduction in mice causes KOS-like muscle defects.
  - reference: PMID:32878913
    reference_title: Deficiency and overexpression of Rtl1 in the mouse cause distinct muscle abnormalities related to Temple and Kagami-Ogata syndromes.

synonyms:
- KOS
- KOS14
- Paternal uniparental disomy 14 syndrome
- upd(14)pat syndrome
- Multiple congenital anomalies due to 14q32.2 maternally expressed gene defect
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:26377239
      reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Consistent with this, paternal uniparental disomy 14 (upd(14)pat), and epimutations (hypermethylations) and microdeletions affecting the IG-DMR and/or the MEG3-DMR of maternal origin, result in a unique phenotype associated with characteristic face, a small bell-shaped thorax with coat-hanger appearance of the ribs, abdominal wall defects, placentomegaly and polyhydramnios."
      explanation: A congenital genomic imprinting disorder with multiple malformations belongs with the genetic disorders of Harrison's.

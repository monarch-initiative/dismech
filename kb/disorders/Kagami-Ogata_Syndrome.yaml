definitions:
- name: Clinical and molecular definition
  definition_type: CASE_DEFINITION
  description: >-
    Kagami-Ogata syndrome is diagnosed in a person with the characteristic
    facial gestalt and increased coat-hanger angle of the ribs in whom
    molecular testing shows deficient expression of the maternal 14q32.2
    allele, through paternal UPD14, maternal IG-DMR/MEG3-DMR hypermethylation,
    or a maternally inherited deletion or rearrangement of the region.
  evidence:
  - reference: PMID:39446997
    reference_title: Kagami-Ogata Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of Kagami-Ogata syndrome is established in a proband with suggestive findings and findings on molecular genetic testing that suggest deficient expression of the RTL1 antisense (RTL1as) allele of maternal origin due to one of the following: paternal uniparental disomy of chromosome 14"
    explanation: The GeneReviews chapter defines the diagnosis as suggestive clinical findings plus molecular evidence of deficient maternal RTL1as expression.
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The facial gestalt and the increased coat-hanger angle are mandatory for the clinical diagnosis of KOS, and the decreased M/W ratios also constitute a diagnostic indication in infancy."
    explanation: States the mandatory clinical diagnostic features.
has_subtypes:
- name: UPD(14)pat
  display_name: Paternal uniparental disomy of chromosome 14
  classification: molecular
  subtype_frequency: about two-thirds of cases
  subtype_term:
    preferred_term: paternal uniparental disomy of chromosome 14
    term:
      id: MONDO:0011975
      label: paternal uniparental disomy of chromosome 14
  description: >-
    Both chromosomes 14 are paternal, so both IG-DMR and MEG3-DMR are
    methylated, maternally expressed genes are absent and RTL1 expression rises
    about five-fold with doubled DLK1. Robertsonian 13;14 translocations and
    i(14q) chromosomes are recognized predisposing rearrangements.
  evidence:
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Upd(14)pat accounts for approximately two-thirds of KOS patients, and epimutations and microdeletions are identified with a similar frequency."
    explanation: Gives the relative frequency of paternal UPD14 among KOS causes.
- name: Maternal epimutation
  display_name: Hypermethylation of the maternal IG-DMR and MEG3-DMR
  classification: molecular
  subtype_term:
    preferred_term: maternal 14q32.2 hypermethylation syndrome
    term:
      id: MONDO:0016783
      label: maternal 14q32.2 hypermethylation syndrome
  description: >-
    The maternal IG-DMR and MEG3-DMR acquire a paternal-type methylation pattern
    without a sequence change, giving an expression pattern essentially
    identical to UPD(14)pat.
  evidence:
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Upd(14)pat and epimutations are accompanied by essentially identical expression patterns (that is, 2 times DLK1 and ~5 times RTL1 expression dosages, and absent MEGs expression)"
    explanation: Establishes that epimutations reproduce the UPD(14)pat expression pattern.
- name: Maternal microdeletion
  display_name: Maternally inherited 14q32.2 microdeletion
  classification: molecular
  subtype_term:
    preferred_term: maternal 14q32.2 microdeletion syndrome
    term:
      id: MONDO:0016781
      label: maternal 14q32.2 microdeletion syndrome
  description: >-
    Deletions of the maternal allele removing the IG-DMR and/or MEG3-DMR, or
    RTL1as itself. Depending on the deleted interval, RTL1 dosage rises about
    2.5-fold to five-fold. Maternally inherited deletions can recur in sibs.
  evidence:
  - reference: PMID:18176563
    reference_title: Deletions and epimutations affecting the human 14q32.2 imprinted region in individuals with paternal and maternal upd(14)-like phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied eight individuals (cases 1-8) with a upd(14)pat-like phenotype and three individuals (cases 9-11) with a upd(14)mat-like phenotype in the absence of upd(14) and identified various deletions and epimutations affecting the imprinted region."
    explanation: First report of deletions and epimutations causing the upd(14)pat-like phenotype without UPD.
  - reference: PMID:39446997
    reference_title: Kagami-Ogata Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Recurrence of Kagami-Ogata syndrome has been reported in sibs with maternally derived deletions."
    explanation: Maternally inherited deletions carry a recurrence risk.
inheritance:
- name: Imprinted, usually sporadic
  inheritance_term:
    preferred_term: Imprinted
    term:
      id: HP:0034338
      label: Imprinted
  parent_of_origin_effect: >-
    Disease results from loss of the maternal 14q32.2 contribution (paternal
    UPD14, or hypermethylation or deletion on the maternal allele). The same
    deletion transmitted paternally causes Temple syndrome or no phenotype
    rather than Kagami-Ogata syndrome.
  description: >-
    Most cases arise de novo with no increased recurrence risk to sibs; a
    parental Robertsonian translocation or a maternally inherited deletion
    raises recurrence risk.
  evidence:
  - reference: PMID:39446997
    reference_title: Kagami-Ogata Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In most affected individuals, the underlying genetic mechanism occurs as a de novo event and the recurrence risk to sibs is not increased."
    explanation: Supports mostly sporadic occurrence.
  - reference: PMID:39446997
    reference_title: Kagami-Ogata Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Less commonly, a parent of a proband has a predisposing genetic alteration associated with an increased recurrence risk to sibs."
    explanation: Supports increased recurrence risk when a parent carries a predisposing alteration.

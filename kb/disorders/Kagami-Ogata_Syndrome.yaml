    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39446997
    reference_title: Kagami-Ogata Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The recurrence risk of Kagami-Ogata syndrome is dependent on the genetic mechanism underlying deficient expression of the maternal RTL1as allele in the proband."
    explanation: Counseling depends on the identified mechanism.
progression:
- phase: Infancy
  notes: Mortality is about 30% and occurs before 4 years of age; survivors are weaned from ventilation and tube feeding.
  evidence:
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "mortality is ~30%, and has invariably occurred before 4 years of age"
    explanation: Mortality is concentrated in early childhood.
differential_diagnoses:
- name: Temple syndrome
  disease_term:
    preferred_term: Temple syndrome
    term:
      id: MONDO:0100507
      label: multiple congenital anomalies due to 14q32.2 paternally expressed gene defect
  description: >-
    The reciprocal 14q32.2 imprinting disorder, caused by maternal UPD14 or
    loss of the paternal contribution, with loss rather than excess of RTL1 and
    DLK1 and a phenotype of growth failure, hypotonia and early puberty.
  distinguishing_features:
  - Opposite parent-of-origin defect (maternal UPD14, paternal deletion, or IG-DMR/MEG3-DMR hypomethylation).
  - Growth failure with small hands and feet instead of preserved birth size, bell-shaped thorax and abdominal wall defects.
  evidence:
  - reference: PMID:32592473
    reference_title: "Temple syndrome and Kagami-Ogata syndrome: clinical presentations, genotypes, models and mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "TS most frequently arises from maternal UPD14 or epimutations/deletions on the paternal chromosome, whereas KOS most frequently arises from paternal UPD14 or epimutations/deletions on the maternal chromosome."
    explanation: Contrasts the reciprocal molecular causes of TS and KOS.
- name: Beckwith-Wiedemann syndrome
  description: >-
    An 11p15.5 imprinting overgrowth disorder sharing omphalocele,
    placentomegaly, polyhydramnios and embryonal tumour (hepatoblastoma) risk.
  distinguishing_features:
  - Lacks the bell-shaped thorax with coat-hanger ribs and the KOS facial gestalt.
  evidence:
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Differential diagnosis includes Beckwith–Wiedemann syndrome and androgenetic mosaicism."
    explanation: Names BWS and androgenetic mosaicism as differentials.
animal_models:
- name: Rtl1 maternal-deletion (Mat-Rtl1 delta, anti-Rtl1as KO) mouse
  species: Mouse
  genotype: Maternally transmitted deletion of Rtl1/Rtl1as, removing the Rtl1as microRNAs and overexpressing the paternal Rtl1 allele
  background: C57BL/6J backcross
  publication: PMID:32878913
  description: >-
    Maternal transmission of an Rtl1 deletion removes six of the seven Rtl1as
    microRNAs, so the intact paternal Rtl1 allele is overexpressed. Mice show
    placentomegaly, severe intercostal, diaphragm and abdominal muscle defects
    and neonatal lethality, modelling KOS.
  genes:
  - preferred_term: Rtl1
    term:
      id: hgnc:14665
      label: RTL1
  modeled_mechanisms:
  - target: Respiratory and Abdominal Skeletal Muscle Defects
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      The deletion also removes most Rtl1as microRNAs, which may have targets
      other than Rtl1, and lethality depends on genetic background.
    evidence:
    - reference: PMID:32878913
      reference_title: Deficiency and overexpression of Rtl1 in the mouse cause distinct muscle abnormalities related to Temple and Kagami-Ogata syndromes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "All of these results provide strong evidence that the loss and overproduction of Rtl1 are responsible for the muscle abnormalities observed in the Pat-Rtl1Δ and Mat-Rtl1Δ mice, respectively"
      explanation: Rtl1 overproduction in Mat-Rtl1 delta mice causes the muscle abnormalities.
  - target: Placental Fetal Capillary Overgrowth and Placentomegaly
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: Mouse labyrinthine placenta differs in structure from the human villous placenta.
    evidence:
    - reference: PMID:32878913
      reference_title: Deficiency and overexpression of Rtl1 in the mouse cause distinct muscle abnormalities related to Temple and Kagami-Ogata syndromes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the case of the Mat-Rtl1Δ mice, neonatal lethality was predominant after the F6 generation, always in association with placentomegaly (150% by weight compared with the wild type)."
      explanation: Rtl1 overexpression produces placentomegaly in mice.
- name: Callipyge sheep
  species: Sheep
  genotype: CLPG intergenic point mutation between DLK1 and GTL2 (MEG3), paternal inheritance
  publication: PMID:20072617
  description: >-
    A naturally occurring ovine mutation in the orthologous DLK1-DIO3 region
    that causes postnatal muscle hypertrophy with large cis changes in
    expression of DLK1, PEG11 (RTL1) and maternal transcripts. Full-length
    PEG11 protein is overexpressed in callipyge skeletal muscle. It shows that
    PEG11/RTL1 overexpression affects skeletal muscle, but it is not a model of
    the human syndrome as a whole.
  genes:
  - preferred_term: PEG11
    term:
      id: hgnc:14665
      label: RTL1
  modeled_mechanisms:
  - target: RTL1 Dosage Excess
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      The callipyge phenotype is postnatal muscle hypertrophy rather than the
      fetal muscle and placental defects of KOS, and DLK1 overexpression is a
      competing effector.
    evidence:
    - reference: PMID:20072617
      reference_title: The imprinted retrotransposon-like gene PEG11 (RTL1) is expressed as a full-length protein in skeletal muscle from Callipyge sheep.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using immunological and mass spectrometry approaches we have directly identified the full-length PEG11 protein from postnatal nuclear preparations of callipyge skeletal muscle and conclude that its over-expression may be involved in inducing muscle hypertrophy."
      explanation: PEG11/RTL1 protein is overexpressed in callipyge muscle.
references:
- reference: PMID:39446997
  title: Kagami-Ogata Syndrome.
  tags:
  - GeneReviews
notes: >-
  RTL1as (RTL1 antisense) has no HGNC symbol of its own, so it is described in
  prose and represented by MIR127, one of the microRNAs it encodes. RTL1 is a
  member of the mammal-specific SIRH/RTL (sushi-ichi retrotransposon homologue)
  gene family. Genes in this entry are recorded as dosage-sensitive imprinted
  genes, not as Mendelian causal genes: the disease is defined by the
  parent-of-origin state of the 14q32.2 region rather than by a coding variant.

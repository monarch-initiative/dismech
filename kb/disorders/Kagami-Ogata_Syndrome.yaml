name: Kagami-Ogata Syndrome
creation_date: "2026-10-24T12:00:00Z"
category: Mendelian
description: >-
  Kagami-Ogata syndrome is a rare congenital imprinting disorder of the
  chromosome 14q32.2 DLK1-DIO3 imprinted region, caused by paternal uniparental
  disomy 14 or by hypermethylation (epimutation) or deletion of the normally
  unmethylated maternal IG-DMR and/or MEG3-DMR. Loss of the maternally expressed
  noncoding transcripts, including the RTL1 antisense (RTL1as) microRNAs that
  repress RTL1, raises dosage of the retrotransposon-derived paternally expressed
  gene RTL1 (PEG11), which is considered the primary driver of the phenotype.
  Affected pregnancies show polyhydramnios and placentomegaly; infants have a
  small bell-shaped thorax with coat-hanger ribs, often requiring mechanical
  ventilation, abdominal wall defects, a characteristic facial gestalt, feeding
  difficulty, developmental delay, and an increased risk of hepatoblastoma. It
  is the reciprocal disorder of Temple syndrome.
disease_term:
  preferred_term: Kagami-Ogata syndrome
  term:

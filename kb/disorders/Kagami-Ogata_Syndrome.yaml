diagnosis:
- name: Methylation testing of the 14q32.2 DMRs
  diagnosis_term:
    preferred_term: DNA methylation analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  description: >-
    Methylation analysis of the IG-DMR and MEG3-DMR (MEG3:TSS-DMR) detects all
    three molecular classes: hypermethylation of the maternal DMRs confirms the
    diagnosis, after which UPD, epimutation and deletion are distinguished by
    genotyping and copy-number analysis. Karyotyping is suggested to detect
    Robertsonian translocations predisposing to UPD. Prenatal ultrasound can
    detect polyhydramnios and the thoracic and abdominal features from about 25
    weeks of gestation; prenatal methylation testing of fetal DNA is not
    recommended because of false negatives.
  evidence:
  - reference: PMID:26377239
    reference_title: "Kagami-Ogata syndrome: a clinically recognizable upd(14)pat and related disorder affecting the chromosome 14q32.2 imprinted region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "When hypermethylation is found for either of the two DMRs of maternal origin, this confirms the diagnosis of KOS."
    explanation: Methylation testing of the DMRs is the confirmatory test.
  - reference: PMID:39446997
    reference_title: Kagami-Ogata Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Methylation testing of fetal DNA to examine abnormal methylation patterns of the DMRs (MEG3/DLK1:IG-DMR and MEG3:TSS-DMR) is not recommended"
    explanation: Prenatal methylation testing is not recommended.
  - reference: PMID:25689926
    reference_title: Comprehensive clinical studies in 34 patients with molecularly defined UPD(14)pat and related conditions (Kagami-Ogata syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, karyotyping is suggested for patients with an UPD(14)pat-like phenotype"
    explanation: Karyotyping identifies Robertsonian translocations predisposing to UPD.

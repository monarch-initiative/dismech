      label: G1/S transition of mitotic cell cycle
    modifier: DECREASED
  downstream:
  - target: Growth Restriction and Skeletal Involvement
  - target: Variable Immune Deficiency
  - target: Livedo
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The "L" of the acronym. Grouped here because dermal microvascular
      development would share the proliferation defect, but no work
      establishes the route.
  - target: Telangiectasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Appears with age alongside the livedo; grouped with it as a cutaneous
      vascular consequence, with the same caveat.
  evidence:
  - reference: PMID:23230001
    reference_title: "Polymerase ε1 mutation in a human syndrome with facial dysmorphism, immunodeficiency, livedo, and short stature (\"FILS syndrome\")."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed impairment in proliferation and G1- to S-phase progression in patients' T lymphocytes."

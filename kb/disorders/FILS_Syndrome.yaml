diagnosis:
- name: Molecular genetic testing of POLE (POLE1)
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: Homozygous POLE1 intron 34 splice variant g.G4444+3A>G, or other biallelic POLE variants
  description: >-
    The syndrome was defined in a single large consanguineous family, so the
    original diagnosis was made by linkage and candidate-gene sequencing rather
    than by a criterion set. The recurring allele is an intronic splice-site
    substitution that would be missed by a coding-exon-only analysis reported
    without intronic flanks - worth knowing when a clinically compatible
    patient has a negative exome.
  evidence:
  - reference: PMID:23230001
    reference_title: "Polymerase ε1 mutation in a human syndrome with facial dysmorphism, immunodeficiency, livedo, and short stature (\"FILS syndrome\")."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report that a homozygous single base pair substitution in POLE1 (polymerase ε 1), encoding the catalytic subunit of Polε, caused facial dysmorphism, immunodeficiency, livedo, and short stature (\"FILS syndrome\") in a large, consanguineous family."
    explanation: >-
      Identifies the causal gene and the homozygous single-base substitution
      that the molecular diagnosis looks for.
discussions:
- discussion_id: pole_replisome_tissue_specificity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Delayed G1-to-S Progression
  prompt: >-
    Why does a general deficiency of the leading-strand polymerase produce this
    particular combination of tissues - growth plate, adrenal cortex and
    lymphocyte - rather than uniform hypoproliferation?
  rationale: >-
    The POLE-IMAGe study frames this as an open question for the whole class,
    noting that disorders of DNA replication genes manifest growth restriction
    alongside adrenal dysfunction and immunodeficiency, and calling for studies
    of the tissue-specific developmental roles of the encoded proteins. The same
    question applies to the other replisome disorders in this nosology group -
    Meier-Gorlin, DONSON, the Seckel rows - so an answer here would generalize.
  evidence:
  - reference: PMID:30503519
    reference_title: "DNA Polymerase Epsilon Deficiency Causes IMAGe Syndrome with Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "consolidating these as replisome phenotypes and highlighting a need for future studies to understand the tissue-specific development roles of the encoded proteins"
    explanation: >-
      The authors state the gap in these terms, which is what this discussion
      records.

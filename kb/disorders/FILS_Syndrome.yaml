- name: Growth Restriction and Skeletal Involvement
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Short stature with variable skeletal involvement. In the original kindred
    patients were born at term with normal weight and length, and growth
    impairment appeared during early childhood - so the FILS end of the spectrum
    is postnatal-onset, unlike the intrauterine growth restriction reported at
    the POLE-IMAGe end. Growth hormone production and response were normal in
    the patients tested, so this is not a GH-axis disorder.
  downstream:
  - target: Short stature
    description: >-
      The growth endpoint of the proliferation defect; the "S" of the acronym.
  - target: Diaphyseal cortical thickening and modelling defects
    description: >-
      Skeletal expression, consistent with the demonstrated G1-to-S block in
      chondrocytes and osteoblasts.
  - target: Relative macrocephaly
    description: >-
      Head circumference is preserved while body growth is not, so the
      relative macrocephaly follows from the selective body-growth deficit.
  - target: Facial dysmorphism with malar hypoplasia
    description: >-
      Craniofacial skeletal consequence; the "F" of the acronym.
  - target: Adrenal hypoplasia congenita
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported at the POLE-IMAGe end of the spectrum; grouped as a
      developmental consequence of the same replication defect, which is the
      "replisome phenotype" the authors describe rather than a demonstrated
      adrenal mechanism.
  evidence:
  - reference: PMID:30503519
    reference_title: "DNA Polymerase Epsilon Deficiency Causes IMAGe Syndrome with Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these individuals had clinical features closely resembling IMAGe syndrome (intrauterine growth restriction [IUGR], metaphyseal dysplasia, adrenal hypoplasia congenita, and genitourinary anomalies in males)"
    explanation: >-
      Documents the growth and skeletal phenotype at the IMAGe end of the POLE
      spectrum.
- name: Variable Immune Deficiency
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Immunodeficiency with evidence of lymphocyte deficiency, variable in degree.
    This is the feature that distinguishes POLE-related IMAGe syndrome from the
    CDKN1C form, in which immune involvement is not part of the picture.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Immunodeficiency
    description: >-
      The immune endpoint; the "I" of the acronym.
  - target: Recurrent respiratory infections
    description: >-
      Impaired lymphocyte proliferation is the route from the replication
      defect to infection susceptibility.
  evidence:
  - reference: PMID:30503519
    reference_title: "DNA Polymerase Epsilon Deficiency Causes IMAGe Syndrome with Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POLE1-deficient individuals also exhibited distinctive facial features and variable immune dysfunction with evidence of lymphocyte deficiency."
    explanation: >-
      States the immune phenotype and its variability.

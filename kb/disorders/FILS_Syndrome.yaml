name: FILS Syndrome
creation_date: "2026-08-27T04:30:00Z"
category: Mendelian
synonyms:
- FILS
- facial dysmorphism-immunodeficiency-livedo-short stature syndrome
- POLE1 deficiency
- POLE-related IMAGe syndrome
description: >-
  FILS syndrome is the phenotype named for its four features - facial
  dysmorphism, immunodeficiency, livedo and short stature - caused by biallelic
  hypomorphic variants in POLE, which encodes POLE1, the catalytic subunit of
  DNA polymerase epsilon, the major leading-strand polymerase. The original
  description was a large consanguineous kindred homozygous for a splice-altering
  intronic substitution that strongly reduced Polε1 protein; patient T
  lymphocytes showed impaired proliferation and impaired G1-to-S progression,
  and the same block was reproduced in B lymphocytes, chondrocytes and
  osteoblasts, which is what ties one replication defect to both the immune and
  the skeletal phenotype.

  The disorder was later shown to sit at one end of a broader POLE phenotype.
  Biallelic POLE variants in 15 individuals from 12 families produced a picture
  closely resembling IMAGe syndrome - intrauterine growth restriction,
  metaphyseal dysplasia, adrenal hypoplasia congenita and male genitourinary
  anomalies - establishing POLE as a second IMAGe gene alongside CDKN1C. All of
  those individuals shared the same intronic variant, c.1686+32C>G, on a common
  haplotype in trans with different loss-of-function alleles. The ISDS Nosology
  accordingly lists FILS and POLE-related IMAGe as one row.

  Note the contrast with the cancer-associated POLE variants: those are
  heterozygous missense changes in the proofreading exonuclease domain that
  predispose to colorectal and endometrial cancer, and FILS patients did not
  exhibit cancer susceptibility. Same gene, different domain, different disease.

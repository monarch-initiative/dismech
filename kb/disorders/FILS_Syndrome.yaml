  evidence:
  - reference: PMID:23230001
    reference_title: "Polymerase ε1 mutation in a human syndrome with facial dysmorphism, immunodeficiency, livedo, and short stature (\"FILS syndrome\")."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation resulted in alternative splicing in the conserved region of intron 34"
    explanation: >-
      The measured splicing lesion that reduces polymerase protein and initiates
      the disease.
  - reference: PMID:30503519
    reference_title: "DNA Polymerase Epsilon Deficiency Causes IMAGe Syndrome with Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "together the biallelic mutations lead to cellular deficiency of Pol ε and delayed S-phase progression."
    explanation: >-
      Confirms the same mechanism - splice-mediated polymerase deficiency - in
      the independent POLE-IMAGe series.
- name: Delayed G1-to-S Progression
  biological_scale: CELLULAR
  description: >-
    Polymerase deficiency impairs proliferation and delays the G1-to-S
    transition. The key observation for this entry is how broadly that block was
    reproduced: not only in patient T lymphocytes, but on Polε1 depletion in B
    lymphocytes, chondrocytes and osteoblasts - the same lesion in the immune
    and the skeletal lineages, which is why one gene gives both an
    immunodeficiency and a growth phenotype.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: osteoblast
    term:

genetic:
- name: POLE
  gene_term:
    preferred_term: POLE
    term:
      id: hgnc:9177
      label: POLE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    POLE (12q24.33) encodes POLE1, the catalytic subunit of DNA polymerase
    epsilon. Because Polε is essential, disease alleles are hypomorphic: a
    homozygous single-base substitution causing alternative splicing in intron
    34 in the original FILS kindred, and the recurrent intronic c.1686+32C>G
    splice-altering allele in trans with loss-of-function variants in the
    POLE-IMAGe series. This variant class is distinct from the heterozygous
    proofreading-domain missense variants that predispose to colorectal and
    endometrial cancer.
  evidence:
  - reference: PMID:23230001
    reference_title: "Polymerase ε1 mutation in a human syndrome with facial dysmorphism, immunodeficiency, livedo, and short stature (\"FILS syndrome\")."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which strongly decreased protein expression of Polε1 and also to a lesser extent the Polε2 subunit."
    explanation: >-
      Characterizes the original allele as a splice change reducing protein
      level, i.e. hypomorphic rather than null.
  - reference: PMID:23230001
    reference_title: "Polymerase ε1 mutation in a human syndrome with facial dysmorphism, immunodeficiency, livedo, and short stature (\"FILS syndrome\")."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, patients did not exhibit cancer susceptibility."
    explanation: >-
      The explicit negative that separates this variant class from the
      cancer-predisposing POLE variants.
pathophysiology:
- name: Reduced DNA Polymerase Epsilon
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Biallelic hypomorphic POLE variants act through splicing to strongly reduce
    POLE1 protein, and to a lesser extent the POLE2 subunit as well. Polε is the
    major leading-strand polymerase and an essential gene, so only partial loss
    is compatible with development.

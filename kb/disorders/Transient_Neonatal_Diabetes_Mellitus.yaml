name: Transient Neonatal Diabetes Mellitus
creation_date: '2026-11-21T00:00:00Z'
category: Mendelian
description: Transient neonatal diabetes mellitus (TNDM) is insulin-deficient diabetes beginning soon
  after birth that remits within months, with frequent recurrence later in life. Most cases are due to
  overexpression of the imprinted 6q24 locus; activating variants in the beta-cell K-ATP channel genes
  ABCC8 and KCNJ11, which also cause permanent neonatal diabetes, account for most of the rest.
disease_term:
  preferred_term: transient neonatal diabetes mellitus
  term:
    id: MONDO:0020525
    label: transient neonatal diabetes mellitus
parents:
- Monogenic Diabetes
synonyms:
- TNDM
notes: The K-ATP channel forms are a severity gradient with permanent neonatal diabetes in the same genes,
  which is curated in Permanent_Neonatal_Diabetes_Mellitus. No gene descriptor is bound for TNDM1 because
  the lesion is an imprinting defect that raises dosage of PLAGL1 and the non-coding HYMAI transcript.
has_subtypes:
- name: TNDM1
  display_name: 6q24-related transient neonatal diabetes mellitus
  subtype_term:
    preferred_term: diabetes mellitus, transient neonatal, 1
    term:
      id: MONDO:0011073
      label: diabetes mellitus, transient neonatal, 1
  classification: molecular
  description: Overexpression of the paternally expressed imprinted genes PLAGL1 and HYMAI at 6q24, by
    maternal hypomethylation, paternal uniparental disomy of chromosome 6 or paternal 6q24 duplication.
    Severe intrauterine growth restriction and hyperglycaemia from the first week, remitting within months
    and often recurring in adolescence or adulthood.
  evidence:
  - reference: PMID:20301706
    reference_title: 6q24-Related Transient Neonatal Diabetes Mellitus.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: 6q24-related transient neonatal diabetes mellitus (6q24-TNDM) is defined as transient neonatal
      diabetes mellitus caused by genetic aberrations leading to overexpression of genes within the imprinted
      locus at 6q24.
    explanation: Defines the subtype by its imprinting mechanism.
- name: TNDM2
  display_name: diabetes mellitus, transient neonatal, 2 (ABCC8-related)
  subtype_term:
    preferred_term: diabetes mellitus, transient neonatal, 2
    term:
      id: MONDO:0012480
      label: diabetes mellitus, transient neonatal, 2
  classification: molecular
  genes:
  - preferred_term: ABCC8
    term:
      id: hgnc:59
      label: ABCC8
  description: >-
    The remitting presentation of activating ABCC8 variants. MONDO defines this
    class as "Any transient neonatal diabetes mellitus in which the cause of the
    disease is a mutation in the ABCC8 gene." It is the more common of the two
    ABCC8 presentations in the series cited below, and hyperglycaemia may recur
    later in life.
  evidence:
  - reference: PMID:17389331
    reference_title: "New ABCC8 mutations in relapsing neonatal diabetes and clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SUR1 mutations are more frequent in transient (52%) compared with
      permanent (14%) neonatal diabetes cases screened for ABCC8 in our series.
    explanation: >-
      States that activating ABCC8 variants more often produce the transient
      presentation this subtype names.
  - reference: PMID:17389331
    reference_title: "New ABCC8 mutations in relapsing neonatal diabetes and clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although ketoacidosis is frequent at presentation, SUR1 mutations
      associate mainly with transient hyperglycemia, with possible recurrence
      later in life.
    explanation: Supports the remission-and-relapse course this subtype's description states.
- name: TNDM3
  display_name: diabetes mellitus, transient neonatal, 3 (KCNJ11-related)
  subtype_term:
    preferred_term: diabetes mellitus, transient neonatal, 3
    term:
      id: MONDO:0012522
      label: diabetes mellitus, transient neonatal, 3
  classification: molecular
  genes:
  - preferred_term: KCNJ11
    term:
      id: hgnc:6257
      label: KCNJ11
  description: >-
    The remitting presentation of activating KCNJ11 variants. MONDO defines this
    class as "Any transient neonatal diabetes mellitus in which the cause of the
    disease is a mutation in the KCNJ11 gene." The founding report ties the
    permanent-versus-transient split to how severely the variant reduces ATP
    sensitivity, so PNDM2 and TNDM3 are a severity gradient in one gene rather
    than two mechanisms.
  evidence:
  - reference: PMID:15718250
    reference_title: "Relapsing diabetes can result from moderately activating mutations in KCNJ11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified the three novel heterozygous mutations (G53S, G53R, I182V)
      in three of 11 probands with clinically defined TNDM, who did not have
      chromosome 6q24 abnormalities.
    explanation: States the gene-disease relationship this subtype names.
  - reference: PMID:15718250
    reference_title: "Relapsing diabetes can result from moderately activating mutations in KCNJ11."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All three heterozygous mutations resulted in a reduction in the
      sensitivity to ATP when compared with wild-type (IC(50) approximately 30
      versus approximately 7 microM, P-value for is all <0.01); however, this
      was less profoundly reduced than with the PNDM associated mutations.
    explanation: >-
      The oocyte electrophysiology supports the severity-gradient reading this
      subtype's description gives for the PNDM2/TNDM3 split.

    reference_title: Switching from insulin to oral sulfonylureas in patients with diabetes due to Kir6.2
      mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Diabetes results from impaired insulin secretion caused by a failure of the beta-cell K(ATP)
      channel to close in response to increased intracellular ATP. Sulfonylureas close the K(ATP) channel
      by an ATP-independent route.
    explanation: States the two mechanistic claims this subtype's description makes.
  downstream:

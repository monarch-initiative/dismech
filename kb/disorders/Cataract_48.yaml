description: Autosomal recessive non-syndromic infantile cataract caused by biallelic loss-of-function
  variants in DNMBP, which encodes Tuba, a multi-SH3 scaffold protein whose Dbl homology domain is a Cdc42-specific
  guanine nucleotide exchange factor. Homozygous nonsense and frameshift variants were found in three
  consanguineous Pakistani families with bilateral infantile-onset cataract, and a homozygous nonsense
  variant in a Turkish child with bilateral lamellar cataract. In epithelial cells Tuba shapes tight and
  adherens junctions through local Cdc42 activation, and knockdown of the Drosophila ortholog disrupts
  E-cadherin localization in the lens-secreting cells. How DNMBP loss causes lens opacity in humans has
  not been tested in a vertebrate lens model.

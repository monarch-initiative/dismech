notes: No GeneReviews chapter or Orphanet record specific to DNMBP cataract was found. A PubMed search
  for DNMBP (50 records) and a Europe PMC full-text search for "DNMBP AND cataract" (29 records) found
  patient reports only in PMID:30290152 and PMID:37592116; the other hits are reviews, gene lists or association
  studies. One exome association study of cataract (PMID:40801674) lists DNMBP among nominal gene-based
  associations and reports higher DNMBP expression in lens fibers than in lens epithelium in aged human
  lens datasets; that study concerns cataract susceptibility rather than Mendelian infantile cataract
  and is not used as evidence here. The mechanism linking Tuba loss to lens opacity rests on non-lens
  epithelial cell culture and a Drosophila compound-eye model; no vertebrate lens model has been described.

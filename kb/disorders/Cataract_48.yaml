      explanation: Places Cdc42 activation between Tuba and the junctional phenotype.
- name: Epithelial Junction and E-cadherin Disorganization
  biological_scale: CELLULAR
  role: central_effector
  description: In cultured epithelia Tuba depletion leaves cell junctions curved and slack and alters
    E-cadherin assembly; in the fly eye, knockdown of the ortholog sif disrupts E-cadherin localization
    in lens-secreting cells and septate junction distribution in neighbouring cone cells. Lens epithelial
    cells are bound here as the presumed affected cell type in human cataract; no study has examined junctions
    in a DNMBP-deficient vertebrate lens.

  - reference: PMID:14506234
    reference_title: Tuba, a novel protein containing bin/amphiphysin/Rvs and Dbl homology domains, links
      dynamin to regulation of the actin cytoskeleton.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A Dbl homology domain present in the middle of Tuba upstream of a Bin/amphiphysin/Rvs (BAR)
      domain activates Cdc42, but not Rac and Rho, and may thus cooperate with the C terminus of the protein
      in regulating actin assembly.
    explanation: Biochemical characterization of Tuba as a Cdc42-specific exchange factor, the activity
      lost with truncating alleles.
  downstream:
  - target: Epithelial Junction and E-cadherin Disorganization
    causal_link_type: DIRECT
    description: Loss of Tuba-dependent Cdc42 activation at the apical junction alters junctional F-actin
      and E-cadherin assembly.
    evidence:

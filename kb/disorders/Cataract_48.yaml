    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: RNAi-mediated depletion of Tuba altered the geometrical configuration of cell junctions,
      resulting in a curved and slack appearance.
    explanation: Junction shape depends on Tuba in cultured epithelia.
  - reference: PMID:30290152
    reference_title: Bi-allelic Loss-of-Function Variants in DNMBP Cause Infantile Cataracts.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: DNMBP regulates the shape of tight junctions, which correspond to the septate junctions in
      invertebrates, as well as the assembly pattern of E-cadherin in human epithelial cells.
    explanation: Summarizes the role of DNMBP in tight junction geometry and E-cadherin assembly in human
      epithelial cells.
  - reference: PMID:30290152
    reference_title: Bi-allelic Loss-of-Function Variants in DNMBP Cause Infantile Cataracts.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: RNAi-mediated knockdown of the Drosophila ortholog still life (sif), enriched in lens-secreting
      cells, affects the development of these cells as well as the localization of E-cadherin, alters
      the distribution of septate junctions in adjacent cone cells, and leads to a ∼50% reduction in electroretinography
      amplitudes in young flies.
    explanation: Fly ortholog knockdown disrupts E-cadherin and junctions in the cells that secrete the
      compound-eye lens.
  downstream:

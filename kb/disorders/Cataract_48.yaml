animal_models:
- name: Drosophila sif knockdown
  species: Drosophila melanogaster
  genotype: RNAi knockdown of still life (sif), the fly ortholog of DNMBP
  publication: PMID:30290152
  modeled_mechanisms:
  - target: Epithelial Junction and E-cadherin Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Knockdown disrupts development of lens-secreting cells, E-cadherin localization and septate
      junction distribution, and halves electroretinogram amplitudes in young flies.
    limitations: The insect compound-eye lens is a secreted cuticular structure, not a cellular lens built
      from crystallin-filled fiber cells, and septate junctions are only functional counterparts of vertebrate
      tight junctions. The model shows a junctional defect, not lens opacity.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: The fly corneal lens is secreted by cone and pigment cells, so a defect in those cells
        is not equivalent to opacity of a vertebrate lens built from fiber cells.
    evidence:
    - reference: PMID:30290152
      reference_title: Bi-allelic Loss-of-Function Variants in DNMBP Cause Infantile Cataracts.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: RNAi-mediated knockdown of the Drosophila ortholog still life (sif), enriched in lens-secreting
        cells, affects the development of these cells as well as the localization of E-cadherin, alters
        the distribution of septate junctions in adjacent cone cells, and leads to a ∼50% reduction in
        electroretinography amplitudes in young flies.
      explanation: Fly knockdown phenotype in lens-secreting and cone cells.

      and frameshift variant c.2852_2855del (p.Thr951Metfs∗41) in family F3 (one affected individual).'
    explanation: Homozygous variants in three consanguineous families, with a LOD score of 5.18 in the
      largest, establish autosomal recessive inheritance.

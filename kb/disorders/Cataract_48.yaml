pathophysiology:
- name: DNMBP Loss of Function
  biological_scale: MOLECULAR
  description: >-
    All pathogenic alleles reported so far are homozygous nonsense or
    frameshift variants (p.Arg271*, p.Asp983*, p.Thr951Metfs*41, p.Arg640*)
    predicted to abolish Tuba, including its central Dbl homology domain, which
    activates Cdc42 but not Rac or Rho.
  genes:
  - preferred_term: DNMBP
    term:
      id: hgnc:30373
      label: DNMBP
  molecular_functions:
  - preferred_term: Cdc42 guanine nucleotide exchange factor activity
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:30290152
    reference_title: "Bi-allelic Loss-of-Function Variants in DNMBP Cause Infantile Cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in family F372 (two affected individuals), and frameshift variant c.2852_2855del (p.Thr951Metfs"
    explanation: Two of the three truncating homozygous alleles reported in the founding families are frameshifts.
  - reference: PMID:14506234
    reference_title: "Tuba, a novel protein containing bin/amphiphysin/Rvs and Dbl homology domains, links dynamin to regulation of the actin cytoskeleton."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A Dbl homology domain present in the middle of Tuba upstream of a Bin/amphiphysin/Rvs (BAR) domain activates Cdc42, but not Rac and Rho, and may thus cooperate with the C terminus of the protein in regulating actin assembly."
    explanation: Biochemical characterization of Tuba as a Cdc42-specific exchange factor, the activity lost with truncating alleles.
  downstream:
  - target: Epithelial Junction and E-cadherin Disorganization
    causal_link_type: DIRECT
    description: >-
      Loss of Tuba-dependent Cdc42 activation at the apical junction alters
      junctional F-actin and E-cadherin assembly.
    evidence:
    - reference: PMID:17015620
      reference_title: "Cdc42 GEF Tuba regulates the junctional configuration of simple epithelial cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "At the subcellular level, Tuba inactivation modified the assembly pattern of junctional F-actin and E-cadherin."
      explanation: >-
        Tuba knockdown in cultured simple epithelial cells, not lens cells, so
        the step to lens epithelium is an inference.
    - reference: PMID:17015620
      reference_title: "Cdc42 GEF Tuba regulates the junctional configuration of simple epithelial cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Suppression of Cdc42 activity or depletion of N-WASP, which is an effector of Cdc42, mimicked the effects of Tuba depletion."
      explanation: Places Cdc42 activation between Tuba and the junctional phenotype.
- name: Epithelial Junction and E-cadherin Disorganization
  biological_scale: CELLULAR
  description: >-
    In cultured epithelia Tuba depletion leaves cell junctions curved and slack
    and alters E-cadherin assembly; in the fly eye, knockdown of the ortholog
    sif disrupts E-cadherin localization in lens-secreting cells and septate
    junction distribution in neighbouring cone cells. Lens epithelial cells are
    bound here as the presumed affected cell type in human cataract; no study
    has examined junctions in a DNMBP-deficient vertebrate lens.
  cell_types:
  - preferred_term: lens epithelial cell
    term:
      id: CL:0002224
      label: lens epithelial cell
  biological_processes:
  - preferred_term: adherens junction organization
    term:
      id: GO:0034332
      label: adherens junction organization
    modifier: ABNORMAL
  - preferred_term: tight junction organization
    term:
      id: GO:0120193
      label: tight junction organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:17015620
    reference_title: "Cdc42 GEF Tuba regulates the junctional configuration of simple epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RNAi-mediated depletion of Tuba altered the geometrical configuration of cell junctions, resulting in a curved and slack appearance."
    explanation: Junction shape depends on Tuba in cultured epithelia.
  - reference: PMID:30290152
    reference_title: "Bi-allelic Loss-of-Function Variants in DNMBP Cause Infantile Cataracts."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RNAi-mediated knockdown of the Drosophila ortholog still life (sif), enriched in lens-secreting cells, affects the development of these cells as well as the localization of E-cadherin, alters the distribution of septate junctions in adjacent cone cells"
    explanation: Fly ortholog knockdown disrupts E-cadherin and junctions in the cells that secrete the compound-eye lens.
  downstream:
  - target: Loss of Lens Transparency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed link: E-cadherin is needed for lens vesicle separation and lens
      epithelial cell survival, so disordered junctional E-cadherin is
      expected to compromise lens development. Not demonstrated in a
      vertebrate lens.
    evidence:
    - reference: PMID:30290152
      reference_title: "Bi-allelic Loss-of-Function Variants in DNMBP Cause Infantile Cataracts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: BACKGROUND
      snippet: "E-cadherin has an important role in lens vesicle separation and lens epithelial cell survival in humans."
      explanation: The authors' stated rationale connecting the junctional defect to cataract; background, not a tested result in DNMBP-deficient lens.

notes: >-
  No GeneReviews chapter or Orphanet record specific to DNMBP cataract was
  found. Only two publications report DNMBP cataract families, and the
  mechanism linking Tuba loss to lens opacity rests on non-lens epithelial
  cell culture and a Drosophila compound-eye model; no vertebrate lens model
  has been described.

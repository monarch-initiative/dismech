- name: DNMBP Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: All pathogenic alleles reported so far are homozygous nonsense or frameshift variants (p.Arg271*,
    p.Asp983*, p.Thr951Metfs*41, p.Arg640*) predicted to abolish Tuba, including its central Dbl homology
    domain, which activates Cdc42 but not Rac or Rho.

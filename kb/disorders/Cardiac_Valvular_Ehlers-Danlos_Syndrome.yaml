inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Autosomal recessive inheritance with homozygous or compound heterozygous COL1A2 null alleles. Reported
    mechanisms include nonsense, frameshift and splice-altering variants. Obligate carriers in reported families
    were often clinically normal, although mild joint laxity was described in relatives in the founding series;
    heterozygosity is not itself diagnostic of cvEDS.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:15077201
    reference_title: "Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three unrelated individuals with a rare recessively inherited form of EDS (characterized by joint hypermobility, skin hyperextensibility, and cardiac valvular defects); in two of them, COL1A2 messenger RNA (mRNA) instability results from compound heterozygosity for splice site mutations in the COL1A2 gene, and, in the third, it results from homozygosity for a nonsense codon."
    explanation: Documents both recessive genotype configurations in the founding case series.
  - reference: PMID:30821104
    reference_title: "Cardiac valvular Ehlers-Danlos syndrome is a well-defined condition due to recessive null variants in COL1A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe two additional affected sisters, who share the homozygous c.3601G>T nonsense variant in COL1A2."
    explanation: An affected sibling pair homozygous for a nonsense variant, consistent with recessive segregation.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2564565/
    reference_title: Total absence of the α2(I) chain of collagen type I causes a rare form of Ehlers‐Danlos syndrome with hypermobility and propensity to cardiac valvular problems - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both parents were clinically normal. There was no history of fractures or dislocations, and they presented
      no joint hypermobility.
    explanation: >-
      Parents of the child with a homozygous frameshift were heterozygous and clinically unaffected.
prevalence:
- population: Worldwide reported cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The 2019 report described two sisters in addition to five previously molecularly confirmed patients. This
    is a dated literature count, not a present-day total or a population prevalence estimate. Older reviews
    grouped some COL1A2-deficient EDS/OI overlap cases together, so their denominators are not interchangeable.
  evidence:
  - reference: PMID:30821104
    reference_title: "Cardiac valvular Ehlers-Danlos syndrome is a well-defined condition due to recessive null variants in COL1A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only five molecularly confirmed patients have been reported to date."
    explanation: >-
      Number reported before the two additional sisters in the 2019 publication, not the current worldwide
      count.
  - reference: PMID:16816023
    reference_title: "Total absence of the alpha2(I) chain of collagen type I causes a rare form of Ehlers-Danlos syndrome with hypermobility and propensity to cardiac valvular problems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous or compound heterozygous COL1A2 mutations resulting in complete deficiency of the proalpha2(I) collagen chains are extremely rare and have been reported in only a few patients, albeit with variable phenotypic outcome."
    explanation: Independently confirms the extreme rarity of the causal genotype.
progression:
- phase: Childhood hypermobility-predominant phase
  age_range: Childhood
  notes: >-
    Joint hypermobility and skin hyperextensibility may dominate childhood. The molecularly characterized six-year-old
    boy had mitral valve bulging without gross mitral or aortic abnormalities, so absence of severe childhood
    valve disease does not exclude cvEDS.
  evidence:
  - reference: PMID:16816023
    reference_title: "Total absence of the alpha2(I) chain of collagen type I causes a rare form of Ehlers-Danlos syndrome with hypermobility and propensity to cardiac valvular problems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this report we show that complete lack of proalpha2(I) collagen chains can present as a phenotype reminiscent of mild hypermobility EDS during childhood."
    explanation: Documents the childhood hypermobility-like phase that precedes recognizable valve disease.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2564565/
    reference_title: Total absence of the α2(I) chain of collagen type I causes a rare form of Ehlers‐Danlos syndrome with hypermobility and propensity to cardiac valvular problems - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Echocardiography was performed and revealed no gross mitral or aortic valve abnormalities, although there
      were signs of mitral valve bulging.
    explanation: >-
      The childhood cardiac examination was not entirely normal.
- phase: Progressive valvular disease
  age_range: Adolescence to adulthood
  notes: >-
    Clinically important mitral and/or aortic insufficiency may develop in adulthood. The 2019 series described
    mitral-first progression, but the founding series also included aortic-only disease; a universal valve
    sequence is not established. Annual echocardiography is recommended in the 2017 rare-type review.
  evidence:
  - reference: PMID:30821104
    reference_title: "Cardiac valvular Ehlers-Danlos syndrome is a well-defined condition due to recessive null variants in COL1A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressive heart valve disease firstly affecting the mitral valve"
    explanation: Establishes the progressive, mitral-first course of the valve disease.
  - reference: PMID:16816023
    reference_title: "Total absence of the alpha2(I) chain of collagen type I causes a rare form of Ehlers-Danlos syndrome with hypermobility and propensity to cardiac valvular problems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "careful cardiac follow up with ultrasonography is highly recommended because of the risk for cardiac valvular problems in adulthood"
    explanation: Places the emergence of clinically significant valve disease in adulthood.
  - reference: PMID:15077201
    reference_title: Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in the other two either the aortic valve (brother of P3) or the mitral valve (P2) was involved.
    explanation: >-
      The founding report documents variable valve involvement.
pathophysiology:
- name: COL1A2 splice-altering variants
  biological_scale: MOLECULAR
  description: >-
    Compound heterozygous splice-altering single-nucleotide variants in the founding cases affected donor sites
    in introns 11 and 24 or activated an intron-1 cryptic exon. These are distinct sequence alterations from
    nonsense and frameshift variants.
  evidence:
  - reference: PMID:15077201
    reference_title: Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In P2, one allele harbored an A→G transition in intron 1 (IVS1+717A→G) that activated a cryptic exon
      and led to inclusion of a 105-nt exon that contained four in-frame PTCs.
    explanation: >-
      Patient-cell sequence analysis identifies cryptic-exon inclusion.
  genetic_context:
    allele_type: SNV
    zygosity: COMPOUND_HETEROZYGOUS
    variant_origin: GERMLINE
    variant_type: single nucleotide variant
  downstream:
  - target: Aberrant COL1A2 splicing
    description: >-
      The splice variants alter processing of patient fibroblast transcripts.
    causal_link_type: DIRECT
- name: Aberrant COL1A2 splicing
  biological_scale: MOLECULAR
  description: >-
    Cryptic donor use retains intronic sequence or truncates an exon; intron-1 pseudoexon inclusion provides
    another route to premature termination codons. Local intron-removal order helps explain why the studied
    donor variants do not simply skip an in-frame collagen exon. RNA-folding predictions are a possible explanation
    for site choice, not direct evidence of in vivo RNA structure.
  evidence:
  - reference: PMID:15077201
    reference_title: Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The splice site mutations led to use of cryptic splice donor sites, creation of a downstream premature
      termination codon, and extremely unstable mRNA.
    explanation: >-
      Measured splice products and transcript instability in cultured dermal fibroblasts.
  - reference: PMID:15077201
    reference_title: Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings suggest that the order of intron removal is an important variable in prediction of mutation
      outcome at splice sites
    explanation: >-
      Experimental splicing-order analysis supports context dependence.
  - reference: PMID:15077201
    reference_title: Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      It is conceivable that the spatial proximity between cryptic donor site and acceptor site, caused by
      either donor-site mutation, promotes spliceosome access and cryptic splice site use.
    explanation: >-
      mfold modeling motivates a hypothesis about splice-site proximity.

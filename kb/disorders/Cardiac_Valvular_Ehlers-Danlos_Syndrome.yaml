      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cardiac valvular EDS is mainly characterized by generalized/peripheral joint hypermobility, moderate-severe cardiac valvular disease, skin hyperextensibility and other minor soft tissues features."
      explanation: Records the soft-tissue arm of the phenotype alongside the cardiac arm.
- name: Progressive Cardiac Valve Matrix Failure

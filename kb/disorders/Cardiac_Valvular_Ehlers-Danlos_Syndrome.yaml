genetic:
- name: COL1A2
  notes: >
    Encodes the proα2(I) chain of type I collagen. cvEDS is caused specifically
    by biallelic null variants — compound heterozygous splice-site variants that
    activate nonsense-mediated decay, or homozygous nonsense variants such as
    c.3601G>T. This is a distinct genotype class from the COL1A2 variants that
    cause osteogenesis imperfecta or arthrochalasia EDS: the same gene produces
    a different disease depending on whether the allele is null (cvEDS) or
    structurally dominant-negative. Heterozygous COL1A2 variants generally cause
    osteogenesis imperfecta or arthrochalasia-type EDS rather than cvEDS.
  gene_term:
    preferred_term: COL1A2
    term:
      id: hgnc:2198
      label: COL1A2
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:30821104
    reference_title: "Cardiac valvular Ehlers-Danlos syndrome is a well-defined condition due to recessive null variants in COL1A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

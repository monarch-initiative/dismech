- name: Loss of proalpha2(I) collagen chains
  biological_scale: MOLECULAR
  description: >-
    Patient fibroblasts synthesize no detectable proalpha2(I) chain. Loss of this type I collagen component
    removes its contribution to extracellular matrix tensile structure; this annotation names the normal molecular
    role lost and does not claim a measured quantitative change in whole-tissue tensile strength.
  evidence:

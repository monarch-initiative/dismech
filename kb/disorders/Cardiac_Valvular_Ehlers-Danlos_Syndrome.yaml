progression:
- phase: Childhood hypermobility-predominant phase
  age_range: Childhood
  notes: >
    In childhood the presentation can be indistinguishable from mild hypermobile
    EDS — joint hypermobility and skin hyperextensibility without recognizable
    valve disease — which is why the diagnosis is often not suspected at this
    stage.
  evidence:
  - reference: PMID:16816023
    reference_title: "Total absence of the alpha2(I) chain of collagen type I causes a rare form of Ehlers-Danlos syndrome with hypermobility and propensity to cardiac valvular problems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this report we show that complete lack of proalpha2(I) collagen chains can present as a phenotype reminiscent of mild hypermobility EDS during childhood."
    explanation: Documents the childhood hypermobility-like phase that precedes recognizable valve disease.
- phase: Progressive valvular disease
  age_range: Adolescence to adulthood
  notes: >
    Heart valve disease is progressive and affects the mitral valve first, with
    aortic involvement following; it reaches moderate-to-severe degree and
    constitutes the prognostically dominant manifestation, which is why lifelong
    echocardiographic surveillance is recommended.
  evidence:
  - reference: PMID:30821104
    reference_title: "Cardiac valvular Ehlers-Danlos syndrome is a well-defined condition due to recessive null variants in COL1A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressive heart valve disease firstly affecting the mitral valve"
    explanation: Establishes the progressive, mitral-first course of the valve disease.
  - reference: PMID:16816023
    reference_title: "Total absence of the alpha2(I) chain of collagen type I causes a rare form of Ehlers-Danlos syndrome with hypermobility and propensity to cardiac valvular problems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "careful cardiac follow up with ultrasonography is highly recommended because of the risk for cardiac valvular problems in adulthood"
    explanation: Places the emergence of clinically significant valve disease in adulthood.
pathophysiology:
- name: COL1A2 Null Allele and Nonsense-Mediated mRNA Decay
  biological_scale: MOLECULAR
  description: >
    Biallelic COL1A2 null variants destabilize the transcript. Splice-site
    variants lead to use of cryptic splice donor sites, creating a downstream
    premature termination codon and extremely unstable mRNA; homozygous nonsense
    codons act directly. Either route engages the nonsense-mediated RNA decay
    pathway, so essentially no COL1A2 message survives to be translated. The
    order in which neighboring introns are removed is an important determinant
    of whether a given splice-site variant produces exon skipping or this
    decay-activating outcome.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: nonsense-mediated mRNA decay
    modifier: INCREASED
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
  evidence:
  - reference: PMID:15077201
    reference_title: "Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The splice site mutations led to use of cryptic splice donor sites, creation of a downstream premature termination codon, and extremely unstable mRNA."
    explanation: Describes the molecular route from splice-site variant to transcript destruction.
  - reference: PMID:15077201
    reference_title: "Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest that the order of intron removal is an important variable in prediction of mutation outcome at splice sites"
    explanation: Explains why some COL1A2 splice variants give cvEDS-type null alleles rather than in-frame exon skipping.
  downstream:
  - target: Complete Absence of proalpha2(I) Collagen Chains
    description: >
      Destruction of COL1A2 mRNA by nonsense-mediated decay removes the template
      for the proα2(I) chain, so no proα2(I) protein is made.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15077201
      reference_title: "Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The complete absence of pro alpha 2(I) chains has the surprising effect of producing cardiac valvular disease without bone involvement."
      explanation: Links transcript loss to complete absence of the chain and to the resulting phenotype.
- name: Complete Absence of proalpha2(I) Collagen Chains
  biological_scale: MOLECULAR
  description: >
    Type I collagen is normally a heterotrimer of two proα1(I) chains and one
    proα2(I) chain. With no proα2(I) available, the molecule is assembled
    instead as an α1(I) homotrimer. This altered composition is detectable by
    SDS-PAGE analysis of collagens extracted from cultured skin fibroblasts,
    which remains a practical way to identify affected individuals.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  cellular_components:
  - preferred_term: collagen type I trimer
    modifier: ABNORMAL
    term:
      id: GO:0005584
      label: collagen type I trimer
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:16816023
    reference_title: "Total absence of the alpha2(I) chain of collagen type I causes a rare form of Ehlers-Danlos syndrome with hypermobility and propensity to cardiac valvular problems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous or compound heterozygous COL1A2 mutations resulting in complete deficiency of the proalpha2(I) collagen chains are extremely rare and have been reported in only a few patients, albeit with variable phenotypic outcome."
    explanation: Establishes complete proα2(I) deficiency as the defining molecular lesion.
  - reference: PMID:16816023
    reference_title: "Total absence of the alpha2(I) chain of collagen type I causes a rare form of Ehlers-Danlos syndrome with hypermobility and propensity to cardiac valvular problems."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical analysis of collagens extracted from skin fibroblasts is a powerful tool to detect the subset of patients with complete absence of proalpha2(I) collagen chains"
    explanation: Documents the fibroblast biochemical assay that demonstrates the missing chain.
  downstream:
  - target: Progressive Cardiac Valve Matrix Failure
    description: >
      Type I collagen lacking its α2(I) chain cannot maintain normal valve
      extracellular matrix, and valve leaflet competence degrades over time.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:15077201
      reference_title: "Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The complete absence of pro alpha 2(I) chains has the surprising effect of producing cardiac valvular disease without bone involvement."
      explanation: >
        Directly links the absent chain to valvular disease; the intermediate
        steps in valve matrix remodeling are not resolved in the literature,
        hence an indirect causal link.
  - target: Generalized Soft Tissue Laxity Without Bone Fragility
    description: >
      The same collagen defect produces joint hypermobility and skin
      hyperextensibility, but characteristically spares bone strength.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

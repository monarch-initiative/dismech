    causal_link_type: DIRECT
- name: COL1A2 frameshift insertion
  biological_scale: MOLECULAR
  description: >-
    The 2006 child carried a homozygous single-C insertion reported as c.292_293insC, with an immediate downstream
    premature termination codon. Both parents carried the insertion heterozygously. The legacy source notation

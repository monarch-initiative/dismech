name: Cardiac Valvular Ehlers-Danlos Syndrome
category: Mendelian
creation_date: "2026-07-31T00:00:00Z"
description: >
  Cardiac valvular Ehlers-Danlos syndrome (cvEDS) is an ultra-rare autosomal
  recessive connective-tissue disorder caused by biallelic null variants in
  COL1A2 that abolish production of the proα2(I) chain of type I collagen.
  Splice-site variants drive use of cryptic donor sites, creating a downstream
  premature termination codon and extremely unstable mRNA; homozygous nonsense
  variants act the same way. Nonsense-mediated decay of COL1A2 mRNA leaves no
  proα2(I) protein, so type I collagen is assembled as an α1(I) homotrimer
  rather than the normal heterotrimer. The clinical consequence is distinctive:
  generalized joint hypermobility and skin hyperextensibility with
  moderate-to-severe, progressive cardiac valve disease that affects the mitral
  valve first, and — critically — without the bone fragility that biallelic
  COL1A2 variants cause in recessive osteogenesis imperfecta. Because the valve
  disease often becomes apparent only in adolescence or adulthood while the
  childhood picture can resemble mild hypermobile EDS, lifelong
  echocardiographic surveillance is the central management issue.

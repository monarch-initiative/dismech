name: Cardiac Valvular Ehlers-Danlos Syndrome
category: Mendelian
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Cardiac-valvular Ehlers-Danlos syndrome (cvEDS) is an ultra-rare autosomal recessive connective tissue disorder
  associated with biallelic COL1A2 null variants and loss of the proalpha2(I) collagen chain. Nonsense, frameshift
  and splice-altering alleles can produce unstable transcripts; type I collagen is assembled as alpha1(I) homotrimers.
  Joint hypermobility, skin hyperextensibility and tissue fragility accompany progressive mitral and/or aortic
  valve disease, which may be inconspicuous in childhood. Valve replacement has been successful in some patients,
  but severe procedural tissue fragility is also documented. Most well-characterized null cases lack the recurrent
  fractures of osteogenesis imperfecta; reduced bone density and overlapping COL1A2 phenotypes require a qualified
  differential diagnosis. Molecular confirmation and continuing echocardiographic surveillance are important
  even with a mild childhood presentation.

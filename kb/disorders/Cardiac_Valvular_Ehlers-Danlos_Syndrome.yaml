discussions:
- discussion_id: cveds_valve_specific_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does complete loss of the proα2(I) collagen chain damage cardiac valves
    while sparing bone, when the same gene's dominant-negative variants cause
    osteogenesis imperfecta?
  attaches_to:
  - pathophysiology#Progressive Cardiac Valve Matrix Failure
  - pathophysiology#Generalized Soft Tissue Laxity Without Bone Fragility
  rationale: >-
    The founding report described the valve-specific, bone-sparing outcome of
    complete proα2(I) absence as "surprising", and the tissue-selectivity has
    not since been mechanistically explained. Why an α1(I) homotrimer suffices
    for skeletal mineralization but not for long-term valve leaflet integrity is
    unresolved, and with only a handful of reported patients there is no
    histopathological series of affected valves to work from. This is why the
    causal edge from the absent chain to valve matrix failure is curated as
    indirect with unknown intermediates.
  evidence:
  - reference: PMID:15077201
    reference_title: "Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The complete absence of pro alpha 2(I) chains has the surprising effect of producing cardiac valvular disease without bone involvement."
    explanation: >-
      The authors' own framing of the tissue selectivity as surprising is the
      evidence that it remains mechanistically unexplained.
  proposed_experiments:
  - experiment_id: cveds_valve_histopathology_series
    name: Histopathology of explanted cvEDS valve tissue
    description: >-
      Collect and characterize valve tissue explanted at surgery from
      molecularly confirmed cvEDS patients, comparing collagen fibril
      ultrastructure and matrix composition with valves from non-cvEDS
      degenerative valve disease.
  - experiment_id: cveds_homotrimer_biomechanics
    name: Comparative biomechanics of alpha1(I) homotrimeric collagen
    description: >-
      Compare the tensile and fatigue properties of α1(I) homotrimeric versus
      normal heterotrimeric type I collagen matrices under cyclic loading that
      mimics valve leaflet motion versus static skeletal loading, to test
      whether cyclic-load fatigue explains the valve-selective failure.
notes: >
  Curated as a standalone entry rather than as a subtype of the umbrella
  Ehlers-Danlos Syndrome entry, following the precedent of Vascular and
  Hypermobile Ehlers-Danlos Syndrome, and named as a curation gap in the
  Ehlers-Danlos_Syndromes grouping notes and its MONDO mapping-consistency note.

  Differential-diagnosis boundary: cvEDS, arthrochalasia EDS, and osteogenesis
  imperfecta are all COL1A1/COL1A2 disorders. The discriminator is variant class
  and zygosity — biallelic null alleles with complete proα2(I) loss give cvEDS,
  whereas heterozygous structural (dominant-negative) variants give osteogenesis
  imperfecta or arthrochalasia EDS. The absence of bone fragility is the
  clinical corollary and the practical bedside discriminator against recessive
  COL1A2 osteogenesis imperfecta.

  Sourcing note: no deep-research provider artifact backs this entry. It was
  built directly from primary literature located via the PubMed E-utilities API,
  with every PMID cached through the reference validator and every snippet
  machine-verified as an exact quote. There is also no GeneReviews chapter for
  cardiac valvular EDS to serve as a phenotype baseline — a PubMed
  `GeneReviews[Book]` search returns eight EDS-related chapters (vascular,
  classic, hypermobile, TNXB classical-like, periodontal, PLOD1- and
  FKBP14-kyphoscoliotic, musculocontractural) and no cardiac-valvular one, so
  the subtype is covered only within broader EDS literature.

  Phenotype-coverage note: the phenotype list is deliberately short because the
  molecularly confirmed cohort is tiny (seven patients across the two
  defining reports). Aortic regurgitation is retained at `supports: PARTIAL`
  because no published source names aortic involvement in cvEDS specifically —
  a targeted PubMed search returned only classical/hypermobile EDS cardiac
  studies — so the claim rests on the generic "cardiac valvular defects"
  phrasing plus the MONDO definition, and is marked accordingly rather than
  overstated.

  No module conformance is declared. The disorder is not an aortopathy
  (aortopathy_tgfbeta_dysregulation covers medial degeneration and aortic
  dissection, which cvEDS does not feature), and although chronic regurgitant
  volume overload could in principle engage
  cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling, no cvEDS-specific
  evidence for ventricular remodeling or heart failure was found in the current
  evidence base, so asserting that conformance would outrun the sources.

genetic:
- name: COL1A2
  notes: >-
    COL1A2 encodes the proalpha2(I) chain of type I collagen. cvEDS is associated with biallelic null alleles,
    including nonsense c.3601G>T, the exon-7 single-C insertion reported as c.292_293insC in 2006, and splice-altering
    variants with cryptic donor use or intron-1 pseudoexon activation. These differ from structural alleles
    producing abnormal chains or exon-6-processing defects associated with other collagen disorders. A heterozygous
    null allele is not equivalent to a heterozygous structural allele. Legacy variant notation is retained
    from the original studies without inventing a transcript accession.
  gene_term:
    preferred_term: COL1A2
    term:
      id: hgnc:2198
      label: COL1A2
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:30821104
    reference_title: "Cardiac valvular Ehlers-Danlos syndrome is a well-defined condition due to recessive null variants in COL1A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac valvular Ehlers-Danlos syndrome (EDS) is a rare EDS subtype, caused by specific recessive variants in the gene encoding pro-α2-chain of type I collagen (COL1A2)."
    explanation: Establishes the COL1A2-cvEDS gene-disease relationship and its recessive null-variant specificity.
  - reference: PMID:15077201
    reference_title: "Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Splice site mutations in the COL1A2 gene of type I collagen can give rise to forms of Ehlers-Danlos syndrome (EDS) because of partial or complete skipping of exon 6, as well as to mild, moderate, or lethal forms of osteogenesis imperfecta as a consequence of skipping of other exons."
    explanation: >
      Documents the allelic series at COL1A2, in which different variant classes
      produce EDS subtypes versus osteogenesis imperfecta.
  - reference: PMID:16816023
    reference_title: "Total absence of the alpha2(I) chain of collagen type I causes a rare form of Ehlers-Danlos syndrome with hypermobility and propensity to cardiac valvular problems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous mutations in the COL1A1 or COL1A2 gene encoding the alpha1 and alpha2 chain of type I collagen generally cause either osteogenesis imperfecta or the arthrochalasis form of Ehlers-Danlos syndrome (EDS)."
    explanation: Contrasts the heterozygous COL1A2 disease outcomes with the biallelic-null cvEDS genotype.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2564565/
    reference_title: Total absence of the α2(I) chain of collagen type I causes a rare form of Ehlers‐Danlos syndrome with hypermobility and propensity to cardiac valvular problems - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The resulting frameshift introduces a premature termination codon (PTC) in the next amino acid position.
    explanation: >-
      Sequencing identified a homozygous one-base insertion in exon 7, reported in the preceding sentence as
      c.292_293insC.
  - reference: PMID:15077201
    reference_title: Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In P2, one allele harbored an A→G transition in intron 1 (IVS1+717A→G) that activated a cryptic exon
      and led to inclusion of a 105-nt exon that contained four in-frame PTCs.
    explanation: >-
      Patient-cell sequence analysis identifies cryptic-exon inclusion.
diagnosis:
- name: Molecular Genetic Testing of COL1A2
  description: >-
    Confirm biallelic COL1A2 variants with a null effect in the appropriate clinical setting. Sequencing or
    a suitable gene panel should include deletion/duplication assessment; negative routine sequencing does
    not exclude deep intronic variation. Variant class, phase and functional consequences distinguish cvEDS
    from other COL1A2 disorders.
  evidence:
  - reference: PMID:30821104
    reference_title: "Cardiac valvular Ehlers-Danlos syndrome is a well-defined condition due to recessive null variants in COL1A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe two additional affected sisters, who share the homozygous c.3601G>T nonsense variant in COL1A2."
    explanation: Molecular confirmation by identification of the biallelic COL1A2 null genotype.
  - reference: PMID:15077201
    reference_title: "Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in two of them, COL1A2 messenger RNA (mRNA) instability results from compound heterozygosity for splice site mutations in the COL1A2 gene, and, in the third, it results from homozygosity for a nonsense codon"
    explanation: Documents the two molecular genotype configurations that establish the diagnosis.
  - reference: PMID:39629471
    reference_title: Genetic diagnosis of the Ehlers-Danlos syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic investigations in individuals with an EDS phenotype and severe cardiac valvular disease should
      entail thorough evaluation of the COL1A2 gene, including large deletion analysis.
    explanation: >-
      Contemporary molecular diagnostic guidance.
  - reference: url:https://www.ehlers-danlos.com/wp-content/uploads/2022/12/Malfait_et_al-2017-American_Journal_of_Medical_Genetics_Part_C__Seminars_in_Medical_Genetics.pdf
    reference_title: "https://www.ehlers-danlos.com/wp-content/uploads/2022/12/Malfait_et_al-2017-American_Journal_of_Medical_Genetics_Part_C__Seminars_in_Medical_Genetics.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CNV detection strategy to identify large deletions or duplications.
    explanation: >-
      The 2017 classification recommends copy-number analysis when sequencing is unrevealing.
  - reference: url:https://www.ehlers-danlos.com/wp-content/uploads/2022/12/Malfait_et_al-2017-American_Journal_of_Medical_Genetics_Part_C__Seminars_in_Medical_Genetics.pdf
    reference_title: "https://www.ehlers-danlos.com/wp-content/uploads/2022/12/Malfait_et_al-2017-American_Journal_of_Medical_Genetics_Part_C__Seminars_in_Medical_Genetics.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      absence of confirmatory genetic findings does not exclude the diagnosis, as specific types of mutations
      (e.g., deep intronic mutations) may go undetected by stan- dard diagnostic molecular techniques.
    explanation: >-
      Routine molecular methods can miss deep intronic alleles.
- name: Echocardiography
  description: >-
    Echocardiography assesses valve function and aortic root size at diagnosis or by age five. The 2017 rare-type
    review recommends yearly studies even when the initial examination is normal. Pediatric mitral bulging
    and later severe regurgitation motivate continuing surveillance.
  evidence:
  - reference: PMID:16816023
    reference_title: "Total absence of the alpha2(I) chain of collagen type I causes a rare form of Ehlers-Danlos syndrome with hypermobility and propensity to cardiac valvular problems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "careful cardiac follow up with ultrasonography is highly recommended because of the risk for cardiac valvular problems in adulthood"
    explanation: Establishes cardiac ultrasonography as the modality for detecting and monitoring the valve lesion.
  - reference: url:https://www.ehlers-danlos.com/wp-content/uploads/2022/03/Brady_et_al-2017-American_Journal_of_Medical_Genetics_Part_C-_Seminars_in_Medical_Genetics.pdf
    reference_title: "https://www.ehlers-danlos.com/wp-content/uploads/2022/03/Brady_et_al-2017-American_Journal_of_Medical_Genetics_Part_C-_Seminars_in_Medical_Genetics.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Measurement of aortic root size and assessment of heart valves by echocar- diogram at the time of diagnosis
      or by age 5 years
    explanation: >-
      The cvEDS management section specifies the baseline timing.
  - reference: url:https://www.ehlers-danlos.com/wp-content/uploads/2022/03/Brady_et_al-2017-American_Journal_of_Medical_Genetics_Part_C-_Seminars_in_Medical_Genetics.pdf
    reference_title: "https://www.ehlers-danlos.com/wp-content/uploads/2022/03/Brady_et_al-2017-American_Journal_of_Medical_Genetics_Part_C-_Seminars_in_Medical_Genetics.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Y early echocardiogram, even if the initial echocardiogram is normal
    explanation: >-
      The cvEDS-specific management section recommends yearly echocardiography even after a normal initial
      examination.
- name: Skin Fibroblast Collagen Electrophoresis
  description: >
    SDS-polyacrylamide gel electrophoresis of collagens extracted from cultured
    skin fibroblasts detects the complete absence of proα2(I) chains, and can
    identify affected individuals before or alongside molecular testing.
  evidence:
  - reference: PMID:16816023
    reference_title: "Total absence of the alpha2(I) chain of collagen type I causes a rare form of Ehlers-Danlos syndrome with hypermobility and propensity to cardiac valvular problems."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical analysis of collagens extracted from skin fibroblasts is a powerful tool to detect the subset of patients with complete absence of proalpha2(I) collagen chains"
    explanation: Establishes fibroblast collagen biochemistry as a diagnostic modality for cvEDS.
- name: Clinical suspicion under the 2017 classification
  description: >-
    The 2017 criteria suggest cvEDS when severe progressive valve disease and a compatible recessive family
    history accompany either another major criterion (skin involvement or joint hypermobility) or at least
    two minor criteria (inguinal hernia, pectus deformity, dislocations, foot deformities). Molecular confirmation
    is required; these suspicion criteria can miss young children before valve disease is apparent.
  evidence:
  - reference: url:https://www.ehlers-danlos.com/wp-content/uploads/2022/12/Malfait_et_al-2017-American_Journal_of_Medical_Genetics_Part_C__Seminars_in_Medical_Genetics.pdf
    reference_title: "https://www.ehlers-danlos.com/wp-content/uploads/2022/12/Malfait_et_al-2017-American_Journal_of_Medical_Genetics_Part_C__Seminars_in_Medical_Genetics.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe progressive cardiac-valvular problems (aortic valve, mitral valve)
    explanation: >-
      The first major criterion specifies the severe progressive valve phenotype.
  - reference: url:https://www.ehlers-danlos.com/wp-content/uploads/2022/12/Malfait_et_al-2017-American_Journal_of_Medical_Genetics_Part_C__Seminars_in_Medical_Genetics.pdf
    reference_title: "https://www.ehlers-danlos.com/wp-content/uploads/2022/12/Malfait_et_al-2017-American_Journal_of_Medical_Genetics_Part_C__Seminars_in_Medical_Genetics.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AND a family history compatible with autosomal recessive transmission. Confirmatory molecular testing
      is obligatory to reach a final diagnosis.
    explanation: >-
      The remainder of the criteria specifies recessive inheritance, accompanying criteria and molecular confirmation.
- name: Bone density assessment
  description: >-
    Consider bone densitometry as recommended in the 2017 cvEDS management review, particularly when clinical
    findings raise concern about bone health.
  evidence:
  - reference: url:https://www.ehlers-danlos.com/wp-content/uploads/2022/03/Brady_et_al-2017-American_Journal_of_Medical_Genetics_Part_C-_Seminars_in_Medical_Genetics.pdf
    reference_title: "https://www.ehlers-danlos.com/wp-content/uploads/2022/03/Brady_et_al-2017-American_Journal_of_Medical_Genetics_Part_C-_Seminars_in_Medical_Genetics.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac valve replacement surgery – Consider bone densitometry evaluation
    explanation: >-
      The cvEDS management list includes consideration of bone densitometry.
treatments:
- name: Cardiac valve replacement
  description: >-
    Mitral and/or aortic valve replacement has treated severe regurgitation in reported adults. P2 and P3 had
    largely uneventful or uncomplicated postoperative courses, whereas P1 died following annular dehiscence
    and myocardial disintegration. Procedural planning must account for tissue fragility; these few cases do
    not provide an operative-risk rate.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac valve replacement
    term:
      id: NCIT:C99546
      label: Cardiac Valve Procedure
  evidence:
  - reference: PMID:15077201
    reference_title: Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mitral valve replacement surgery was performed, and the postoperative course was largely uneventful.
    explanation: >-
      Outcome in P2.
  - reference: PMID:15077201
    reference_title: Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He developed marked left ventricular enlargement and had his aortic and mitral valves replaced with prosthetic
      valves, with no surgical complications.
    explanation: >-
      Successful double-valve replacement in P3.
  - reference: PMID:15077201
    reference_title: Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there was massive leakage through the left ventricular myocardium with disintegration of the entire left
      ventricle, from which the patient died.
    explanation: >-
      Fatal operative tissue failure in P1; not a general outcome estimate.
  target_mechanisms:
  - target: Cardiac valve insufficiency
- name: Genetic Counseling
  description: >-
    Counseling addresses autosomal recessive inheritance, familial testing and the distinction from dominant
    structural COL1A2 disorders. When both parents are heterozygous carriers of causative alleles, standard
    Mendelian segregation gives a one-in-four chance of an affected child in each pregnancy; this is a conditional
    calculation, not a measured recurrence rate in the small published series.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:30821104
    reference_title: "Cardiac valvular Ehlers-Danlos syndrome is a well-defined condition due to recessive null variants in COL1A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe two additional affected sisters, who share the homozygous c.3601G>T nonsense variant in COL1A2."
    explanation: >
      An affected sibling pair sharing a homozygous variant illustrates the
      recessive recurrence risk that drives counseling and sibling testing.
- name: Physiotherapy for hypotonia and joint instability
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: physiotherapy for hypotonia and joint instability
    term:
      id: NCIT:C15302
      label: Physical Therapy
  description: >-
    Physiotherapy was provided from infancy for balance problems associated with hypotonia and joint hypermobility
    in the 2006 child. This is reported supportive care, with no comparative efficacy estimate.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2564565/
    reference_title: Total absence of the α2(I) chain of collagen type I causes a rare form of Ehlers‐Danlos syndrome with hypermobility and propensity to cardiac valvular problems - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He has been receiving physiotherapy since his first year because of equilibrium problems due to muscle
      hypotonia and joint hypermobility with deformities of the feet.
    explanation: >-
      Patient-specific supportive intervention.
discussions:
- discussion_id: cveds_valve_specific_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which effects of alpha1(I) homotrimeric collagen drive progressive valve disease in COL1A2-null patients,
    and why is bone fragility usually limited?
  attaches_to:
  - pathophysiology#Type I collagen homotrimer formation
  - pathophysiology#Cardiac valve insufficiency
  rationale: >-
    Patient observations establish severe valve disease despite relatively limited fracture susceptibility.
    The Col1a2-null versus oim mouse comparison shows that homotrimer formation alone does not reproduce the
    oim brittle-bone phenotype. It constrains the mechanism but does not explain valve-specific remodeling
    or prove an unfolded-protein-response mechanism for cvEDS. Slightly reduced bone density in a child also
    argues against treating bone as universally unaffected.
  evidence:
  - reference: PMID:15077201
    reference_title: Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that the α2(I) chain is important for functions in soft tissues but that bone
      can form in a normal or near-normal fashion in individuals whose cells make no α2(I) chains.
    explanation: >-
      The founding authors distinguish soft-tissue disease from preserved bone formation.
  - reference: PMID:36106514
    reference_title: Collagen (I) homotrimer potentiates the osteogenesis imperfecta (oim) mutant allele and reduces survival in male mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unlike oim homozygotes, we observed no fractures in Col1a2 null homozygotes.
    explanation: >-
      Animal comparison narrows the proposed mechanism without resolving human valve disease.
  proposed_experiments:
  - experiment_id: cveds_valve_histopathology_series
    name: Histopathology of explanted cvEDS valve tissue
    description: >-
      Collect and characterize valve tissue explanted at surgery from
      molecularly confirmed cvEDS patients, comparing collagen fibril
      ultrastructure and matrix composition with valves from non-cvEDS
      degenerative valve disease.
  - experiment_id: cveds_homotrimer_biomechanics
    name: Comparative biomechanics of alpha1(I) homotrimeric collagen
    description: >-
      Compare homotrimeric and heterotrimeric collagen matrices under controlled cyclic loads and in valve-cell
      systems, testing whether altered fatigue behavior or matrix turnover explains progressive valve dysfunction.
      This is a proposed experiment, not an established explanation.
notes: >-
  cvEDS denotes the biallelic COL1A2-null connective tissue phenotype. It should not be conflated with COL3A1-related
  vascular EDS, FLNA-related valvular dystrophy, arthrochalasia EDS, or structural COL1A1/COL1A2 osteogenesis
  imperfecta solely because valve disease is present. Reduced fracture susceptibility does not imply normal
  bone density in every patient. The 2021 Hyperdynamic Valve case was labeled cvEDS by its authors but did
  not report the exact COL1A2 variant, zygosity or collagen studies; it is retained as a clinical lead without
  using its generic EDS mortality figures or arterial-risk statements as cvEDS-specific estimates. The small
  historical series do not establish population phenotype frequencies or a universal order of valve involvement.
experimental_models:
- name: Patient dermal fibroblast collagen and RNA assays
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Skin biopsies from affected individuals
  cell_types: *id001
  publication: PMID:15077201
  description: >-
    Cultured dermal fibroblasts were used for radiolabeled collagen electrophoresis, sequencing of splice products,
    cDNA mixing and actinomycin-D splicing-order experiments. They demonstrate molecular consequences in skin
    cells, rather than valve-specific biomechanics.
  modeled_mechanisms:
  - target: COL1A2 transcript depletion
    relationship: MEASURES
  - target: Loss of proalpha2(I) collagen chains
    relationship: MEASURES
  - target: Type I collagen homotrimer formation
    relationship: MEASURES
  evidence:
  - reference: PMID:15077201
    reference_title: Rare autosomal recessive cardiac valvular form of Ehlers-Danlos syndrome results from mutations in the COL1A2 gene that activate the nonsense-mediated RNA decay pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Dermal fibroblasts were obtained from explants of skin biopsies from the three individuals.
    explanation: >-
      Patient-derived primary cultures.
animal_models:
- name: Col1a2-null mouse
  species: Mus musculus
  genotype: Col1a2tm1b(EUCOMM)Wtsi homozygous null
  background: C57BL/6N
  publication: PMID:36106514
  description: >-
    The knockout model lacks alpha2(I) chains and forms homotrimeric type I collagen. Unlike the oim structural-mutant
    comparator, it did not show spontaneous fractures; most measured bone properties were preserved, with some
    sex- and age-dependent differences. Male null animals developed swollen joints and age-related deterioration.
    The study did not establish a specific human valve-remodeling mechanism.
  modeled_mechanisms:
  - target: Type I collagen homotrimer formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      A null model distinguishes chain absence from an abnormal oim chain. Its bone and survival findings do
      not quantify human valve penetrance or surgical risk.
  evidence:
  - reference: PMID:36106514
    reference_title: Collagen (I) homotrimer potentiates the osteogenesis imperfecta (oim) mutant allele and reduces survival in male mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unlike oim homozygotes, we observed no fractures in Col1a2 null homozygotes.
    explanation: >-
      Direct comparison of the null and structural-mutant models.
  - reference: PMID:36106514
    reference_title: Collagen (I) homotrimer potentiates the osteogenesis imperfecta (oim) mutant allele and reduces survival in male mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Col1a2 null homozygotes did not display bone fragility, but swollen joints were identified in males,
      which also displayed age-related deterioration in condition.
    explanation: >-
      Sex-specific joint and condition findings in the knockout model.

has_subtypes:
- name: Congenital
  display_name: Congenital Oropouche syndrome (vertical transmission)
  description: >-
    Disease arising from vertical (transplacental) transmission of OROV during
    pregnancy, manifesting as fetal loss, stillbirth, congenital microcephaly
    and other CNS malformations. This stratum is defined by the route of
    acquisition and the fetal rather than the adult phenotype.
treatments:
- name: Supportive Care
  description: >-
    No antivirals or vaccines are licensed for OROV; management is supportive.
    CDC guidance (August 2024) advises against non-steroidal anti-inflammatory
    drugs in suspected cases until dengue is excluded, to reduce bleeding risk,
    and recommends that pregnant individuals reconsider non-essential travel to
    affected areas.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39351896
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No antivirals or vaccines are available for OROV, and clinical management is limited to supportive care."
    explanation: States that only supportive care is available.
progression:
- phase: Incubation period
  incubation_days: "3-10"
  notes: >-
    Abrupt febrile onset follows a 3-10 day incubation; viraemia peaks around
    day 2 of symptoms.
  evidence:
  - reference: PMID:39351896
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The incubation period is 3 to 10 days, with viraemia peaking on day 2 after symptom onset."
    explanation: Gives the incubation window and viraemia peak.
- phase: Acute phase
  notes: >-
    The acute phase usually lasts 2-7 days; in cases with CNS involvement it can
    extend to 2-4 weeks.
  evidence:
  - reference: PMID:39351896
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The acute phase usually lasts 2 to 7 days, but in cases involving the central nervous system (CNS), it can extend up to 2-4 weeks"
    explanation: Describes acute-phase duration.
- phase: Symptom recurrence
  notes: >-
    Recurrence of symptoms 2-10 days after the acute phase is characteristic, so
    the course is often biphasic; virus is not recoverable during recurrence and
    the cause is unclear.
  evidence:
  - reference: PMID:39351896
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Symptom recurrence is common, often occurring about 2-10 days after the acute phase"
    explanation: Documents the characteristic relapsing course.

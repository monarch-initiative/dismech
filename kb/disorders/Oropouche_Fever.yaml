has_subtypes:
- name: Congenital
  display_name: Congenital Oropouche syndrome (vertical transmission)
  description: >-
    Disease arising from vertical (transplacental) transmission of OROV during
    pregnancy, manifesting as fetal loss, stillbirth, congenital microcephaly
    and other CNS malformations. This stratum is defined by the route of
    acquisition and the fetal rather than the adult phenotype. No distinct MONDO
    term exists for congenital Oropouche syndrome, so this subtype carries no
    disease_term; it is a route-of-acquisition stratum rather than a separately
    coded nosological entity.
  evidence:
  - reference: PMID:39351896
    reference_title: 'Oropouche Virus: An Emerging Orthobunyavirus.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: vRNA was detected in the umbilical cord blood and various foetal tissues, including the foetal brain, liver, kidneys, lungs, heart and spleen. This is now the first confirmed case of OROV vertical transmission.
    explanation: Documents a fetal route-of-acquisition stratum distinct from postnatal midge-borne disease.
diagnosis:
- name: Molecular and serological diagnosis
  description: >-
    Confirmation is by RT-qPCR on acute serum (OROV RNA is also detectable in
    saliva and urine for up to 5 days after onset), with IgM/IgG serology and
    plaque-reduction neutralization. Because the dengue-like presentation
    overlaps dengue, Zika and chikungunya, laboratory confirmation is essential
    to distinguish Oropouche fever from the co-circulating arboviruses.
  evidence:
  - reference: PMID:39351896
    reference_title: 'Oropouche Virus: An Emerging Orthobunyavirus.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular diagnostics such as RT-qPCR assays are probably more common now and can screen for multiple arboviruses"
    explanation: RT-qPCR is the common molecular diagnostic.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:39351896
    reference_title: 'Oropouche Virus: An Emerging Orthobunyavirus.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reports of OROV being detectable in saliva and urine up to 5 days after symptom onset may also allow for alternative ways of OROV screening"
    explanation: Saliva and urine are alternative RT-qPCR specimens within the acute window.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:39351896
    reference_title: 'Oropouche Virus: An Emerging Orthobunyavirus.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical manifestations of OROV closely resemble those of other arboviral infections, such as dengue."
    explanation: Supports the dengue differential that makes laboratory confirmation necessary.
    quote_role: REVIEW_SYNTHESIS
treatments:
- name: Supportive Care
  description: >-
    No antivirals or vaccines are licensed for OROV; management is supportive.
    CDC guidance (August 2024) advises against non-steroidal anti-inflammatory
    drugs in suspected cases until dengue is excluded, to reduce bleeding risk,
    and recommends that pregnant individuals reconsider non-essential travel to
    affected areas.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39351896
    reference_title: 'Oropouche Virus: An Emerging Orthobunyavirus.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No antivirals or vaccines are available for OROV, and clinical management is limited to supportive care."
    explanation: States that only supportive care is available.
    quote_role: REVIEW_SYNTHESIS

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human OROV disease, or Oropouche fever, typically begins with a fever ranging from 100.4 to 104 °F, followed by headache, chills, malaise, myalgia and arthralgia"
    explanation: Links viraemia to the acute febrile syndrome.
    quote_role: REVIEW_SYNTHESIS
- name: Hepatotropic Infection
  biological_scale: TISSUE
  description: >-
    OROV infects the liver, producing necroinflammatory foci that progress to
    massive hepatic necrosis when the type I interferon response is lost. This
    hepatic injury underlies the rare severe and fatal human cases and raises
    circulating transaminases.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: hepatocyte necrosis
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  downstream:
  - target: Systemic Coagulopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Elevated hepatic transaminase
  evidence:
  - reference: PMID:42377030
    reference_title: Oropouche virus causes acute hepatitis in mice controlled by type I interferons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In both models, OROV causes focal hepatic necrosis in mice, which progresses to massive necrosis and death when the Type I interferon receptor is antagonized."
    explanation: >-
      Mouse models show OROV hepatotropism and the IFN-dependent progression to
      lethal hepatic necrosis, mirroring the fatal human coagulopathic cases.
  notes: Bound to the broad GO term cell death because GO:0070265 necrotic cell death is obsolete, GO:0097300 programmed necrotic cell death would assert regulated necroptosis that the OROV literature here does not establish, and GO:0006915 apoptotic process names a mechanism that the cited hepatic-necrosis evidence does not support.
- name: Systemic Coagulopathy
  biological_scale: ORGANISM
  description: >-
    Severe coagulopathy with haemorrhage accompanies hepatic injury in the rare fatal cases, resembling severe dengue.
  downstream:
  - target: Abnormal bleeding
  evidence:
  - reference: PMID:39351896
    reference_title: 'Oropouche Virus: An Emerging Orthobunyavirus.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients also suffered from rapid disease progression, severe coagulopathy, and liver impairment."
    explanation: >-
      The two fatal 2024 cases are described as rapid coagulopathy with liver
      impairment.
    quote_role: REVIEW_SYNTHESIS
- name: Central Nervous System Neuroinvasion
  biological_scale: TISSUE
  description: >-
    OROV reaches the central nervous system, producing aseptic meningitis and
    meningoencephalitis and prolonging the acute phase to 2-4 weeks. In earlier
    outbreaks viral RNA was recovered from cerebrospinal fluid; the 2025 Panama
    series instead found CSF consistently negative with virus detectable in
    urine beyond the acute phase, so the diagnostic specimen is not settled.
  biological_processes:
  - preferred_term: neuroinflammatory response
    term:
      id: GO:0150076
      label: neuroinflammatory response
  downstream:
  - target: Meningitis
  - target: Viral encephalitis
  evidence:
  - reference: PMID:39351896
    reference_title: 'Oropouche Virus: An Emerging Orthobunyavirus.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it can extend up to 2-4 weeks, potentially leading to meningitis or encephalitis"
    explanation: Reports CNS extension of disease with meningitis/encephalitis.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:42742818
    reference_title: 'Expanding the spectrum of oropouche virus neurological disease: emerging evidence from the 2025 Panama outbreak.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "included ocular motor disturbances such as nystagmus and opsoclonus, cerebellar signs including ataxia and vertigo, seizures, altered mental status, and meningeal irritation"
    explanation: A 2025 Panama case series documents the neurological spectrum.
- name: Transplacental Vertical Transmission
  biological_scale: ORGANISM
  description: >-
    Maternal viraemia leads to hematogenous transplacental infection of the
    fetoplacental unit and fetal multi-organ infection, with neurotropic damage
    to the developing fetal brain.
  downstream:
  - target: Fetal Neurodevelopmental Injury
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39351896
    reference_title: 'Oropouche Virus: An Emerging Orthobunyavirus.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "vRNA was detected in the umbilical cord blood and various foetal tissues, including the foetal brain, liver, kidneys, lungs, heart and spleen. This is now the first confirmed case of OROV vertical transmission."
    explanation: Documents transplacental transmission with fetal multi-organ infection.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:42896562
    reference_title: 'Oropouche virus infection in pregnant women in Rio de Janeiro, Brazil: a prospective cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal loss and haemorrhage risk were three times higher in women with confirmed infection than in those with no infection"
    explanation: >-
      A prospective cohort quantifies the elevated fetal-loss risk with
      confirmed maternal OROV infection, the clinical outcome of this branch.
- name: Fetal Neurodevelopmental Injury
  biological_scale: TISSUE
  description: >-
    OROV infection of the developing fetal brain causes massive neural cell death, neuroinflammation, microglial activation and neutrophil infiltration, with neurodevelopmental disruption, microcephaly and fetal death.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: microglial cell activation
    term:
      id: GO:0001774
      label: microglial cell activation
  downstream:
  - target: Microcephaly
  evidence:
  - reference: PMID:42811037
    reference_title: Oropouche virus causes severe congenital disease in embryonic mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Infected embryos present with multi-organ pathology, pneumonitis, myocarditis, steatohepatitis and severe neuropathology, including microcephaly, ventriculomegaly and neural loss."
    explanation: >-
      A Swiss-mouse placental-inoculation model reproduces congenital OROV
      disease with microcephaly and neural loss.

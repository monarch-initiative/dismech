name: Oropouche Fever
creation_date: "2026-11-04T01:15:28Z"
category: Infectious Disease
description: >-
  Oropouche fever is an emerging, usually self-limiting acute arboviral febrile
  illness caused by Oropouche virus (OROV), a tri-segmented negative-sense RNA
  orthobunyavirus of the Simbu serogroup transmitted to humans chiefly by the
  biting midge Culicoides paraensis. It presents as a dengue-like syndrome of
  fever, headache, myalgia and arthralgia with a characteristic recurrence of
  symptoms after apparent recovery; a minority develop aseptic meningitis or
  meningoencephalitis. The 2023-2024 re-emergence across the Americas brought
  the first reported deaths (from coagulopathy with liver involvement) and the
  first evidence of vertical transmission with fetal loss and congenital
  microcephaly.
disease_term:
  term:
    id: MONDO:0000345
    label: Oropouche fever
  preferred_term: Oropouche fever
synonyms:
- Oropouche virus disease
- Oropouche virus infection
notes: >-
  No GeneReviews chapter exists for Oropouche fever (an arboviral infection, not
  a Mendelian disorder); the offline Bookshelf index check returns NO_CHAPTER.
parents:
- Arbovirus Infection
infectious_agent:
- name: Oropouche virus
  infectious_agent_term:
    preferred_term: Oropouche virus
    term:
      id: NCBITaxon:118655
      label: Oropouche virus
  description: >-
    Tri-segmented (S, M, L), single-stranded negative-sense RNA virus of the
    family Peribunyaviridae, genus Orthobunyavirus (Simbu serogroup). The S
    segment encodes the nucleoprotein N and the non-structural NSs; the M
    segment encodes the Gn/Gc glycoprotein precursor and NSm; the L segment
    encodes the RNA-dependent RNA polymerase.
  evidence:
  - reference: PMID:39351896
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "OROV is a tri-segmented, single-stranded, negative-sense RNA virus within the Peribunyaviridae family and Orthobunyavirus genus"
    explanation: The review states the agent's taxonomy and genome organization.
agent_life_cycle:
  description: >-
    OROV is maintained in a sylvatic cycle involving non-human primates and
    pale-throated three-toed sloths (Bradypus tridactylus), with arthropod
    vectors whose sylvatic identity is uncertain; neutralizing antibodies in
    wild and domestic birds raise the possibility of an avian role. When OROV
    spills over into humans it initiates an urban/epidemic cycle whose principal
    vector is the biting midge Culicoides paraensis.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: incidental host (urban cycle)
  - preferred_term: pale-throated three-toed sloth
    term:
      id: NCBITaxon:9354
      label: Bradypus tridactylus
    role: sylvatic reservoir
  vectors:
  - Culicoides paraensis (NCBITaxon:1027879)
transmission:
- name: Culicoides paraensis midge bite transmission
  description: >-
    In the urban/epidemic cycle OROV is transmitted to humans by the bite of an
    infected Culicoides paraensis biting midge. Competence of other vectors
    (Culex, Aedes spp.) is not established.
  evidence:
  - reference: PMID:39351896
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When OROV spills over into humans, it can initiate an urban cycle where the likely vector is the biting midge Culicoides paraensis"
    explanation: The review names the principal urban vector.
pathophysiology:
- name: Culicoides Midge Inoculation and Viral Entry
  biological_scale: MOLECULAR
  description: >-
    The bite of an infected Culicoides paraensis midge inoculates OROV into the
    dermis. The Gn/Gc glycoproteins mediate attachment and clathrin-dependent
    entry into permissive cells, followed by endosomal membrane fusion and
    cytoplasmic release of the three ribonucleoprotein segments.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: OROV Genome Replication and Interferon Antagonism
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39351896
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The incubation period is 3 to 10 days, with viraemia peaking on day 2 after symptom onset."
    explanation: Establishes the inoculation-to-viremia sequence that follows entry.
- name: OROV Genome Replication and Interferon Antagonism
  biological_scale: MOLECULAR
  description: >-
    The L-protein RdRp transcribes and replicates the genome in the cytoplasm
    using a cap-snatching mechanism, N encapsidates the segments, and the
    M-encoded glycoproteins assemble and bud at the Golgi. The non-structural
    NSs protein antagonizes the host type I interferon response, permitting
    early high-titre viraemia; NSs deletion attenuates the virus.
  biological_processes:
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
  - preferred_term: suppression of host type I interferon response by NSs
    modifier: DECREASED
    term:
      id: GO:0052170
      label: symbiont-mediated suppression of host innate immune response
  downstream:
  - target: Viraemia and Systemic Inflammatory Response
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39351896
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These viral protein-RNA complexes facilitate genome replication and transcription in the cytoplasm of infected cells. Translation occurs via a cap-snatching mechanism"
    explanation: Describes OROV genome replication and cap-snatching transcription.
- name: Viraemia and Systemic Inflammatory Response
  biological_scale: ORGANISM
  description: >-
    High-titre viraemia (peaking around day 2 of symptoms) together with innate
    immune activation drives the acute systemic febrile syndrome of fever,
    headache, chills, myalgia and arthralgia.
  downstream:
  - target: Hepatotropic Infection and Coagulopathy
    causal_link_type: DIRECT
  - target: Central Nervous System Neuroinvasion
    causal_link_type: DIRECT
  - target: Transplacental Vertical Transmission
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39351896
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Human OROV disease, or Oropouche fever, typically begins with a fever ranging from 100.4 to 104 °F, followed by headache, chills, malaise, myalgia and arthralgia"
    explanation: Links viraemia to the acute febrile syndrome.
- name: Hepatotropic Infection and Coagulopathy
  biological_scale: TISSUE
  description: >-
    OROV infects the liver, producing necroinflammatory foci that progress to
    massive hepatic necrosis when the type I interferon response is lost, with
    transaminase elevation, thrombocytopenia and coagulopathy. This branch
    underlies the rare severe and fatal human cases.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: hepatocyte apoptosis and necrosis
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:42377030
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In both models, OROV causes focal hepatic necrosis in mice, which progresses to massive necrosis and death when the Type I interferon receptor is antagonized."
    explanation: >-
      Mouse models show OROV hepatotropism and the IFN-dependent progression to
      lethal hepatic necrosis, mirroring the fatal human coagulopathic cases.
- name: Central Nervous System Neuroinvasion
  biological_scale: TISSUE
  description: >-
    OROV reaches the central nervous system, where viral RNA is detectable in
    cerebrospinal fluid, producing aseptic meningitis and meningoencephalitis
    and prolonging the acute phase to 2-4 weeks.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuroinflammatory response
    term:
      id: GO:0150076
      label: neuroinflammatory response
  evidence:
  - reference: PMID:39351896
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "it can extend up to 2-4 weeks, potentially leading to meningitis or encephalitis"
    explanation: Reports CNS extension of disease with meningitis/encephalitis.
  - reference: PMID:42742818
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "included ocular motor disturbances such as nystagmus and opsoclonus, cerebellar signs including ataxia and vertigo, seizures, altered mental status, and meningeal irritation"
    explanation: A 2025 Panama case series documents the neurological spectrum.
- name: Transplacental Vertical Transmission
  biological_scale: ORGANISM
  description: >-
    Maternal viraemia leads to hematogenous transplacental infection of the
    fetoplacental unit and fetal multi-organ infection, with neurotropic damage
    to the developing fetal brain.
  cell_types:
  - preferred_term: trophoblast cell
    term:
      id: CL:0000351
      label: trophoblast cell
  downstream:
  - target: Fetal Neurodevelopmental Injury
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39351896
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "vRNA was detected in the umbilical cord blood and various foetal tissues, including the foetal brain, liver, kidneys, lungs, heart and spleen. This is now the first confirmed case of OROV vertical transmission."
    explanation: Documents transplacental transmission with fetal multi-organ infection.
  - reference: PMID:42896562
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal loss and haemorrhage risk were three times higher in women with confirmed infection than in those with no infection"
    explanation: >-
      A prospective cohort quantifies the elevated fetal-loss risk with
      confirmed maternal OROV infection, the clinical outcome of this branch.
- name: Fetal Neurodevelopmental Injury
  biological_scale: TISSUE
  description: >-
    OROV infection of the developing fetal brain causes massive neural cell
    death, neuroinflammation, microglial activation and neutrophil infiltration,
    with neurodevelopmental disruption, microcephaly, ventriculomegaly and fetal
    death.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: microglial cell activation
    term:
      id: GO:0001774
      label: microglial cell activation
  evidence:
  - reference: PMID:42811037
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Infected embryos present with multi-organ pathology, pneumonitis, myocarditis, steatohepatitis and severe neuropathology, including microcephaly, ventriculomegaly and neural loss."
    explanation: >-
      A Swiss-mouse placental-inoculation model reproduces congenital OROV
      disease with microcephaly and neural loss.

- name: Reduced Ciliary and Surface Polycystin-1
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Polycystin-1 is absent or markedly reduced in the primary cilia of
    Alg8-null cells. Cyst formation across the ADPKD/ADPLD gene family follows
    the amount of functional polycystin-1, which mouse genetics established for
    the ADPLD genes Prkcsh and Sec63 as a dose-response relationship. ALG8 is
    one of the endoplasmic-reticulum effectors whose loss feeds into that
    shared dosage mechanism.

notes: >-
  Scope and lump/split. Curated as a standalone gene-defined entry with its own
  MONDO term, following Polycystic_Kidney_Disease_3 (GANAB), whose kidney/liver
  spectrum this disease most resembles. ALG8 is also listed as a genetic record
  in Autosomal_Dominant_Polycystic_Kidney_Disease and
  Autosomal_Dominant_Polycystic_Liver_Disease; those records and this entry
  should be read together. MONDO places MONDO:1060122 only under autosomal
  dominant disease, not under either cystic parent, because the concept spans
  both, so both are listed in parents here.

  Distinct from ALG8-CDG. Biallelic ALG8 variants cause congenital disorder of
  glycosylation type Ih, a neonatal-onset multisystem disease. That is a
  separate disorder (stubs/ALG8-congenital_Disorder_Of_Glycosylation.yaml) and
  none of its features are curated here; the monoallelic cohort study screened
  for CDG-associated features in heterozygotes and did not find recurrent ones.

  Phenotype sourcing. No GeneReviews chapter covers this disease. The ADPKD
  GeneReviews chapter (NBK1246) names ALG8 only in its differential-diagnosis
  table, among polycystic liver disease genes with liver cysts and occasional
  kidney cysts, so its PKD1-dominated clinical picture (enlarged kidneys,
  kidney failure in mid-life, intracranial aneurysm) is deliberately not
  imported. Phenotypes here come from the ALG8 cohorts themselves: the
  multicenter clinical and biobank study (PMID:39899384), the Geisinger
  genotype-first cohort (PMID:36574950), the polycystic liver disease cohorts
  (PMID:28375157, PMID:37628703).

  Gene-disease validity. ClinGen classifies ALG8 as Definitive for autosomal
  dominant polycystic kidney disease (MONDO:0004691). That is a broader MONDO
  disease than this entry's term, so it is cited as evidence on the genetic
  record rather than copied into gene_disease_validity.
pathophysiology:
- name: Heterozygous ALG8 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Germline heterozygous loss-of-function variants, predominantly nonsense,
    frameshift and canonical splice alleles with recurrent p.Arg364*, reduce
    the dose of ALG8. ALG8 is the endoplasmic-reticulum alpha-1,3-
    glucosyltransferase that adds the second glucose to the dolichol-linked
    Glc1Man9GlcNAc2 precursor before the oligosaccharide is transferred to
    nascent glycoproteins. Unlike PRKCSH and SEC63, ALG8 is not intolerant of
    loss of function in the general population, which fits the incomplete
    penetrance of this disease.

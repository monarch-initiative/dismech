- name: PKD1
  gene_term:
    preferred_term: PKD1
    term:
      id: hgnc:9008
      label: PKD1
  association: MODIFIER
  variant_origin: GERMLINE
  features: >-
    Two individuals carried both an ALG8 and a PKD1 pathogenic variant. One had
    severe kidney disease with eGFR 10 at age 44; ALG8 is proposed as a modest
    enhancer of the PKD1 kidney phenotype. In a patient with a typical severe
    ADPKD phenotype an ALG8 finding should not be accepted as the sole cause
    before PKD1 has been excluded.
  evidence:
  - reference: PMID:39899384
    reference_title: Characterization of the Cystic Phenotype Associated with Monoallelic ALG8 and ALG9 Pathogenic Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Digenic disease with a PKD1 and an ALG8 P/LP variant described in two
      families provided some support of ALG8 as a modest enhancer of the PKD1
      kidney phenotype.
    explanation: Co-occurring PKD1 and ALG8 variants with a more severe kidney phenotype.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Monoallelic variants segregate with cysts across at least two generations,
    but many probands appear sporadic and genotype-first carriers often have
    few cysts.
  evidence:
  - reference: PMID:39899384
    reference_title: Characterization of the Cystic Phenotype Associated with Monoallelic ALG8 and ALG9 Pathogenic Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They are probably best described as ADPKD associated with lower
      penetrance (not all individuals developing cysts) and with variable
      expressivity (individuals having variable presentations in terms of cyst
      number).
    explanation: Characterises the dominant inheritance as low-penetrance with variable expressivity.
- name: Incomplete penetrance
  inheritance_term:
    preferred_term: Incomplete penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  description: Not all carriers develop cysts, and clinically significant kidney disease is uncommon.
  evidence:
  - reference: PMID:39899384
    reference_title: Characterization of the Cystic Phenotype Associated with Monoallelic ALG8 and ALG9 Pathogenic Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALG8 and ALG9 are defined as cystic kidney/liver genes but with limited
      penetrance for lower eGFR.
    explanation: Limited penetrance for kidney function decline.
prevalence:
- population: Families with polycystic kidney and/or liver disease (multicenter clinical screen)
  measure_type: UNKNOWN
  notes: >-
    1.3% of about 3900 cystic kidney and/or liver families carried an ALG8
    pathogenic variant, about ten times the 0.13% frequency in gnomAD. This is
    a share of a referral population, not a population rate. Predicted
    loss-of-function ALG8 alleles are present in roughly 0.1% of the general
    population, but most carriers are never diagnosed.
  evidence:
  - reference: PMID:39899384
    reference_title: Characterization of the Cystic Phenotype Associated with Monoallelic ALG8 and ALG9 Pathogenic Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The level of individuals with ALG8 pathogenic variants in the clinical
      population (51/3935, 1.3%) was significantly higher than that found in
      the gnomAD v3.1.2 database (95/76,000, 0.13%)
    explanation: Gives the ALG8 share of cystic families against the population background.
  - reference: PMID:42804492
    reference_title: The population frequency of predicted pathogenic variants in the genes associated with Autosomal Dominant Polycystic Liver Disease (ADPLD) and kidney cysts.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      LRP5 and ALG8 which are associated with a milder clinical phenotype, were
      the commonest affected genes with both strategies.
    explanation: ALG8 is among the most frequently affected ADPLD genes in gnomAD.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Diagnosis rests on finding a heterozygous ALG8 pathogenic variant in a
    person with kidney and/or liver cysts and no variant in another ADPKD or
    ADPLD gene; ALG8 should be on ADPKD/ADPLD panels. Because ALG8 alleles are
    common and penetrance is low, an incidental ALG8 finding without cysts on
    imaging should not be labelled ADPKD or ADPLD, and in a patient with a
    severe, typical ADPKD kidney phenotype a missed PKD1 variant should be
    considered first. The diagnosis implies a low chance of eGFR decline and a
    small chance of significant liver disease, so treatment or trial
    enrolment designed for typical ADPKD is probably not appropriate.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39899384
    reference_title: Characterization of the Cystic Phenotype Associated with Monoallelic ALG8 and ALG9 Pathogenic Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the enrichment of ALG8 and ALG9 P/LP alleles in cystic kidney, and
      ALG8 in cystic liver, individuals, these genes should be included on
      screening panels for ADPKD/ADPLD.
    explanation: Recommends ALG8 on diagnostic panels.
  - reference: PMID:39899384
    reference_title: Characterization of the Cystic Phenotype Associated with Monoallelic ALG8 and ALG9 Pathogenic Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This diagnosis would generally indicate a low (ALG8) to moderate (ALG9)
      chance of eGFR reduction, with a small chance of significant polycystic
      liver disease for ALG8, and that treatment or enrollment in clinical
      trials for more typical ADPKD is probably not appropriate.
    explanation: Prognostic and therapeutic implication of the molecular diagnosis.
treatments:
- name: Liver Resection, Fenestration or Transplantation
  description: >-
    Liver-volume-reducing surgery or transplantation is reserved for severe
    symptomatic polycystic liver disease and is rarely needed in ALG8 disease.
  treatment_term:
    preferred_term: liver-directed surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:39899384
    reference_title: Characterization of the Cystic Phenotype Associated with Monoallelic ALG8 and ALG9 Pathogenic Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only one ALG8 individual required liver surgical intervention, and the
      overall phenotype was more akin to GANAB than PRKCSH or SEC63 and not
      displaying the female sex bias usually seen in ADPKD and ADPLD.
    explanation: Surgery was needed in one of the clinically ascertained ALG8 patients.
  - reference: PMID:37628703
    reference_title: Novel α-1,3-Glucosyltransferase Variants and Their Broad Clinical Polycystic Liver Disease Spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After partial liver resection combined with fenestration, he received
      liver–kidney transplantation.
    explanation: A severe ALG8 case treated by resection, fenestration and then transplantation.
- name: Genetic Counseling
  description: >-
    Counselling addresses incomplete penetrance and the separate recessive
    risk of ALG8-CDG. Presymptomatic testing of at-risk minors should be
    avoided, and carriers planning a pregnancy should be asked about
    consanguinity with their partner.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:39899384
    reference_title: Characterization of the Cystic Phenotype Associated with Monoallelic ALG8 and ALG9 Pathogenic Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the incomplete penetrance of ALG8 and ALG9, presymptomatic genetic
      diagnosis should be avoided in minors at familial risk.
    explanation: Guidance against presymptomatic testing of minors.
  - reference: PMID:39899384
    reference_title: Characterization of the Cystic Phenotype Associated with Monoallelic ALG8 and ALG9 Pathogenic Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In carriers of ALG8 or ALG9 pathogenic variants intending to conceive, the
      presence of a shared ancestor with their partner should be ascertained.
    explanation: Reproductive counselling for the biallelic CDG risk.
discussions:
- discussion_id: alg8_liver_severity_modifiers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether an ALG8 carrier has no cysts, a few kidney cysts,
    or severe polycystic liver disease?
  rationale: >-
    Most genotype-first carriers have only modest kidney cysts and no severe
    liver disease, while a minority in liver clinics have livers over 2 L. The
    cohort authors attribute the difference to genic and other modifiers, but
    none has been identified, and the somatic second-hit evidence rests on one
    explanted liver.
  attaches_to:
  - pathophysiology#Somatic Second Hit in Cyst Epithelium
  - phenotypes#Polycystic Liver Disease
  evidence:
  - reference: PMID:39899384
    reference_title: Characterization of the Cystic Phenotype Associated with Monoallelic ALG8 and ALG9 Pathogenic Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Significant liver enlargement, usually with limited kidney cysts, was
      found in a minority of ALG8 cases, consistent with links to ADPLD, so
      ALG8 genic and other genetic (and nongenetic) modifiers are likely
      significant for this complication.
    explanation: The authors name modifiers as the open explanation.
- discussion_id: alg8_null_cells_vs_heterozygous_patients
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does heterozygous ALG8 loss reduce polycystin-1 maturation enough to
    matter, or does cyst formation need local loss of the second allele?
  rationale: >-
    The polycystin-1 glycosylation and trafficking defect was shown in
    Alg8-null mouse kidney cells. No heterozygous-cell or in vivo Alg8 model
    is cited here, so the dosage at which the mechanism operates in patients
    is inferred rather than measured.
  attaches_to:
  - pathophysiology#Defective Polycystin-1 Glycosylation and Maturation
  evidence:
  - reference: PMID:28375157
    reference_title: Isolated polycystic liver disease genes define effectors of polycystin-1 function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Altered migration of PC1-FL is due to hypoglycosylation in Alg8–/– cells.
    explanation: The mechanistic evidence comes from null cells only.

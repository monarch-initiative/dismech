phenotypes:
- category: Renal
  name: Multiple Renal Cysts
  frequency: VERY_FREQUENT
  description: >-
    Bilateral kidney cysts, usually modest in number with little kidney
    enlargement. In the unselected Mayo Clinic Biobank 89% of imaged carriers
    had kidney cysts and half had more than ten; in the Geisinger cohort 58%
    of carriers had four or more.
  phenotype_term:
    preferred_term: Multiple renal cysts
    term:
      id: HP:0005562
      label: Multiple renal cysts
  evidence:
  - reference: PMID:39899384
    reference_title: Characterization of the Cystic Phenotype Associated with Monoallelic ALG8 and ALG9 Pathogenic Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty-nine percent of individuals with ALG8 mutations with imaging in the
      entire MCBB had kidney cysts (50%, >10 cysts), with greater median kidney
      and liver cyst numbers than controls.
    explanation: Kidney cyst frequency in a genotype-first population.
  - reference: PMID:36574950
    reference_title: Individuals heterozygous for ALG8 protein-truncating variants are at increased risk of a mild cystic kidney disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALG8 PTV heterozygotes were significantly more likely to have cystic
      kidney disease, defined as four or more kidney cysts (57.7% vs. 7.7%),
      or bilateral kidney cysts (69.2% vs. 15.4%)
    explanation: Blinded radiology review in a second genotype-first cohort.
- category: Hepatobiliary
  name: Hepatic Cysts
  frequency: FREQUENT
  description: >-
    Liver cysts were present in about two thirds of clinically ascertained

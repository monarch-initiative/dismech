- name: Somatic Second Hit in Cyst Epithelium
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Polycystic liver disease is thought to need a somatic second hit on top of
    the germline variant. In one ALG8 patient's explanted liver, ALG8 protein
    was absent from the cholangiocytes lining cysts but present in hepatocytes
    away from them, consistent with focal loss of the remaining allele. This
    is a single-case observation; the somatic lesion itself was not sequenced.

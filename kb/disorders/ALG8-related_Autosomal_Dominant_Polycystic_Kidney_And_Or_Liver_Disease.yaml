    explanation: >-
      Establishes monoallelic loss of function as the disease-causing
      genotype through enrichment in cystic cohorts.
  downstream:
  - target: Defective Polycystin-1 Glycosylation and Maturation
    causal_link_type: DIRECT
    description: >-
      Without ALG8 the lipid-linked precursor is incompletely glucosylated,
      so polycystin-1 is hypoglycosylated and less of it reaches a mature,
      endoglycosidase H-resistant form.
    evidence:
    - reference: PMID:28375157
      reference_title: Isolated polycystic liver disease genes define effectors of polycystin-1 function.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        Altered migration of PC1-FL is due to hypoglycosylation in Alg8–/– cells.
      explanation: >-
        Alg8-null mouse kidney epithelial cells show hypoglycosylated
        polycystin-1. The cells are null, whereas patients are heterozygous, so
        the step from complete to partial loss is an inference.
- name: Defective Polycystin-1 Glycosylation and Maturation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Polycystin-1 is a very large, heavily N-glycosylated membrane protein whose
    maturation in the endoplasmic reticulum is rate-limiting for the
    polycystin complex. In Alg8-null renal epithelial cells polycystin-1 is
    hypoglycosylated, its steady-state level falls without any change in Pkd1
    transcript, and the endoglycosidase H-resistant fraction that has passed
    the medial Golgi is markedly reduced. Re-expression of Alg8 rescues
    polycystin-1 expression. Other membrane proteins (polycystin-2,
    Na+/K+-ATPase, calnexin) were not quantitatively reduced, so the defect is
    relatively selective for polycystin-1.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  - preferred_term: protein folding in endoplasmic reticulum

name: ALG8-related Autosomal Dominant Polycystic Kidney And/Or Liver Disease
creation_date: "2026-10-08T00:00:00Z"
category: Mendelian
synonyms:
- ALG8-related ADPKD/ADPLD
- ADPKD-ALG8
- ALG8-associated autosomal dominant polycystic liver disease
- ALG8-related autosomal dominant polycystic kidney and/or liver disease
description: >-
  ALG8-related autosomal dominant polycystic kidney and/or liver disease is the
  cystic disorder of people heterozygous for a loss-of-function variant in ALG8.
  ALG8 encodes the endoplasmic-reticulum alpha-1,3-glucosyltransferase that adds
  the second of three glucoses to the lipid-linked oligosaccharide precursor of
  N-linked glycosylation. Biallelic loss of the same gene causes a severe
  multisystem congenital disorder of glycosylation (ALG8-CDG, CDG-Ih); the
  monoallelic disease described here is a different, organ-restricted and
  usually mild condition.

  The phenotype sits between the two classical dominant cystic disorders.
  Most carriers who develop disease have a modest number of kidney cysts without
  marked kidney enlargement, and kidney function is usually preserved;
  progression to kidney failure is rare. Liver cysts are common, and a minority
  develop severe polycystic liver disease with liver volume above two litres, so
  the gene was first found in isolated polycystic liver disease cohorts and
  later in cystic kidney cohorts. Penetrance for cysts is incomplete and
  expressivity is variable even within one family, and predicted
  loss-of-function ALG8 alleles are present in roughly one in a thousand people,
  so many carriers have only a few cysts or none.

  Mechanistically ALG8 belongs with GANAB, PRKCSH, SEC63, ALG5, ALG9 and DNAJB11
  as an endoplasmic-reticulum proteostasis gene that sits upstream of the
  polycystin complex. Loss of ALG8 leaves polycystin-1 hypoglycosylated, reduces
  its steady-state level and blocks its trafficking to the cell surface and the
  primary cilium. Reduced functional polycystin-1 is the shared final pathway
  into cystogenesis in kidney tubule and biliary epithelium.

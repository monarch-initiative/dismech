genetic:
- name: ALG8
  gene_term:
    preferred_term: ALG8
    term:
      id: hgnc:23161
      label: ALG8
  association: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Heterozygous predicted loss-of-function variants, with recurrent p.Arg364*.
    Penetrance for cysts is incomplete and expressivity variable. The common
    splice variant c.478+1G>A was excluded from the largest cohort over doubts
    about its pathogenicity.
  notes: >-
    ClinGen classifies ALG8 as Definitive for autosomal dominant polycystic
    kidney disease (MONDO:0004691); that is a broader disease than
    MONDO:1060122, so the tier is not recorded in gene_disease_validity.
  evidence:
  - reference: CGGV:assertion_13259bf6-e954-4159-b247-c9685638e537-2025-03-10T160000.000Z
    reference_title: ALG8 / autosomal dominant polycystic kidney disease (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ALG8 | HGNC:23161 | autosomal dominant polycystic kidney disease | MONDO:0004691 | AD | Definitive"
    explanation: ClinGen classifies the ALG8 relationship to ADPKD as Definitive.
  - reference: ORPHA:2924
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ALG8 | ALG8 alpha-1,3-glucosyltransferase | hgnc:23161 | Disease-causing germline mutation(s) in"

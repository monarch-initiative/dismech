    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      inactivation of both Alg8 and Xbp1 does not change PC1 hypoglycosylation
      or GPS cleavage compared with Alg8 knockout alone
    explanation: >-
      Shows that the XBP1 arm of the stress response does not mediate the

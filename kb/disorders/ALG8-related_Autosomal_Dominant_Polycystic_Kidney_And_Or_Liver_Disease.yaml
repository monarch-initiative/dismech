    explanation: Fifty-one ALG8 families among about 3900 screened cystic families.
  - reference: PMID:28375157
    reference_title: Isolated polycystic liver disease genes define effectors of polycystin-1 function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

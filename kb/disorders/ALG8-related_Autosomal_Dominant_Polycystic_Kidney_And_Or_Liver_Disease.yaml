- name: Endoplasmic Reticulum Unfolded Protein Response Activation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Alg8-null cells show XBP1 splicing, the readout of IRE1-alpha activation.
    This is a side branch rather than a step in the cyst pathway: inactivating
    Xbp1 together with Alg8 did not change polycystin-1 hypoglycosylation or
    cleavage, and its contribution to human cyst formation is unknown.
  biological_processes:

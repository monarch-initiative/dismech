- name: TNF-alpha Inhibition
  description: >-
    Reported once, for dapsone-recalcitrant disease: a 50-year-old man who had
    responded poorly to dapsone cleared on adalimumab. A single case, so it is
    curated as an option of last resort rather than an established second line -
    but it is mechanistically coherent, since TNF-alpha blockade suppresses the
    neutrophilic inflammation that drives the lesions.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
  target_mechanisms:
  - target: Neutrophil Recruitment into the Epidermis
    description: >-
      TNF-alpha blockade reduces neutrophil recruitment into the epidermis.
  evidence:
  - reference: PMID:38751960
    reference_title: "A case of IgA pemphigus, with a poor response to dapsone, successfully treated with adalimumab."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the successful treatment of a 50-year-old male patient with
      an adalimumab injection who had a poor response to dapsone.
    explanation: >-
      The single reported case, with the response and the prior failure both
      stated.
- name: Treatment of an Underlying IgA Plasma Cell Dyscrasia
  description: >-
    Where an IgA myeloma is present, treating it treats the skin. In the reported
    case daratumumab, lenalidomide and dexamethasone cleared both the lesions and
    the anti-desmoglein and anti-desmocollin IgA ELISAs.

    This is the only reported treatment that acts on the autoantibody's source
    rather than on the downstream inflammation, which is why it is curated
    separately from the immunosuppressants. It applies to a small minority.

    therapeutic_modality is OTHER rather than MONOCLONAL_ANTIBODY: daratumumab
    is one of three components, and the regimen as given also contains an
    immunomodulatory small molecule and a corticosteroid. Tagging the whole
    regimen by its antibody component would misclassify it. All three agents are
    bound individually instead.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: daratumumab
      term:
        id: NCIT:C74007
        label: Daratumumab
    - preferred_term: lenalidomide
      term:
        id: NCIT:C2668
        label: Lenalidomide
    - preferred_term: dexamethasone
      term:
        id: NCIT:C422
        label: Dexamethasone
  target_mechanisms:
  - target: IgA Autoantibody Production Against Keratinocyte Cell Surface
    description: >-
      Eliminating the IgA-secreting plasma cell clone removes the source of the
      autoantibody, which is upstream of every other treatment in this entry.
  evidence:
  - reference: PMID:35838241
    reference_title: "Subcorneal pustular dermatosis-type IgA pemphigus associated with multiple myeloma: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Daratumumab, lenalidomide, and dexamethasone (DLd) therapy was effective
      for both the MM and the skin lesions, resulting in negative results on
      Dsg1/3 and Dsc1-3 IgA ELISAs.
    explanation: >-
      Clinical and serological response of the skin disease to myeloma-directed
      therapy.
differential_diagnoses:
- name: Classical subcorneal pustular dermatosis (Sneddon-Wilkinson disease)
  description: >-
    The hardest differential, because it is not distinguishable on the grounds
    clinicians usually use. In the largest cohort all thirteen classical SPD
    cases were immunologically negative and were indistinguishable clinically and
    histopathologically from the SPD-type IgA pemphigus cases. Only
    immunofluorescence separates them.
  evidence:
  - reference: PMID:27258999
    reference_title: "Clinical and immunological studies of 49 cases of various types of intercellular IgA dermatosis and 13 cases of classical subcorneal pustular dermatosis examined at Kurume University."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All cases of classical SPD, which showed no positive immunological results,
      were indistinguishable clinically and histopathologically from SPD-type
      IAD.
    explanation: >-
      States the indistinguishability directly, with the cohort behind it.
- name: Linear IgA bullous dermatosis
  description: >-
    Also an IgA-mediated blistering disease, but the antibody binds the basement
    membrane zone rather than the keratinocyte cell surface, so direct
    immunofluorescence shows a linear basement-membrane pattern rather than an
    intercellular one. The two can coexist: one reported patient had IgA
    reactivity to both desmocollins 2 and 3 and to BP180.
  evidence:
  - reference: PMID:24601812
    reference_title: "The expanding spectrum of IgA pemphigus: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we demonstrate the coexistence of IgA reactivity to both epidermal
      (desmocollins 2 and 3) and basement membrane-associated (BP180) proteins,
      suggesting the coexistence of atypical IGAP and linear IgA bullous
      dermatosis
    explanation: >-
      The documented overlap case, which is why this differential is not always
      an either/or.
discussions:
- discussion_id: igap_two_type_classification_inadequate
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the SPD/IEN two-type scheme survive the reported cases that fit neither?
  attaches_to:
  - "has_subtypes#SPD type"
  - "has_subtypes#IEN type"
  rationale: >-
    This entry uses the conventional two subtypes, and it should be read as a
    working scheme rather than a settled nosology.

    The pressure on it is from published cases: IgA reactive with all three
    desmocollins in an SPD-type patient; IgA to desmogleins 1 and 3 in an
    IEN-type patient; IgA to desmocollins 2 and 3 together with BP180. The
    largest cohort could not classify eight of forty-nine cases at all and found
    subgroups it had to call IgA-pemphigus vegetans, foliaceus and vulgaris. One
    review, tallying its own case against twenty prior atypical reports,
    concluded the classification schemes are limited and proposed replacing them
    with a general "IGAP spectrum".

    The reason not to act on that yet is that the two-type scheme is doing real
    work: it separates the one subtype with a known antigen from the one without,
    and the antigen difference is the only hard biological distinction available.
    A spectrum model would dissolve that. Recorded here so the decision is
    visible and revisitable rather than implied by the file's structure.
  proposed_experiments:
  - experiment_id: igap_unbiased_antigen_screen
    name: Unbiased autoantigen screen across the reported IgA pemphigus spectrum
    description: >-
      Proteome-wide autoantibody profiling of banked sera from SPD-type,
      IEN-type and unclassifiable cases, to test whether the unclassifiable cases
      form their own antigenic group or scatter.
    would_support:
    - "has_subtypes#IEN type"
    supporting_outcome:
    - >-
      IEN-type sera converge on one previously unidentified non-desmosomal
      cell-surface antigen, which would put the two-type scheme on the same
      antigenic footing as the SPD side.
    refuting_outcome:
    - >-
      Antigen reactivities scatter across cases without respecting the
      histological subtype, supporting a spectrum model over the two-type scheme.
- discussion_id: igap_anti_desmocollin_pathogenicity_unproven
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are anti-desmocollin IgA autoantibodies pathogenic, or are they a marker of a
    disease driven by something else?
  attaches_to:
  - "pathophysiology#Impaired Desmosomal Cell-Cell Adhesion"
  - "phenotypes#Acantholysis"
  rationale: >-
    Desmocollin 1 is securely established as the SPD-type autoantigen - the
    transfection experiment is clean, with six of six SPD sera binding Dsc1 and
    none binding Dsc2 or Dsc3. What is not established is that binding it causes
    the disease. A 2023 review of exactly this question concludes that beyond a
    few in vitro and in vivo studies there is no clear evidence for the
    pathogenicity of anti-desmocollin autoantibodies, in contrast to the
    well-established significance of anti-desmoglein antibodies.

    The histology points the same way. Acantholysis - the thing an
    adhesion-molecule antibody should produce - is slight where it is present at
    all, and one 2024 case report states flatly that it is not a feature of the
    disease. The dominant finding is neutrophilic. So an alternative reading is
    available and is not excluded by anything cited here: that the IgA acts
    mainly by recruiting neutrophils, and that the adhesion molecule it happens
    to bind is a marker of the disease rather than its mechanism.

    This is why the adhesion node is graded PROVISIONAL while the neutrophil node
    is ESTABLISHED, and why the acantholysis phenotype keeps the source that
    disagrees as a NO_EVIDENCE item rather than dropping it.
  proposed_experiments:
  - experiment_id: igap_dsc1_passive_transfer
    name: Passive transfer of affinity-purified anti-Dsc1 IgA
    description: >-
      Affinity-purify IgA anti-Dsc1 from SPD-type patient serum and transfer into
      a human skin organ culture or a humanised mouse model, with and without
      neutrophils present, reading out acantholysis and pustule formation.
    would_support:
    - "pathophysiology#Impaired Desmosomal Cell-Cell Adhesion"
    supporting_outcome:
    - >-
      Purified anti-Dsc1 IgA produces intraepidermal separation in the absence of
      neutrophils, establishing a direct adhesion-blocking mechanism.
    refuting_outcome:
    - >-
      Separation occurs only when neutrophils are present, indicating the
      antibody acts by recruiting them rather than by disrupting adhesion
      directly.
notes: >-
  Curated from a Perplexity deep-research report plus independent PubMed
  searching. The report supplied narrative framing only. Its reference-validation
  section reported 5 of 5 citations resolving with 4 of 5 on topic; its
  term-validation section reported zero terms checked, because the report offered
  no ontology CURIEs at all - which is a different failure from the mislabelled
  CURIEs seen in the other reports in this batch, and means the section's clean
  result carries no information. All bindings here were resolved against the
  committed term caches and OLS.

  No GeneReviews chapter applies; this is an acquired autoimmune disease, not a
  Mendelian one, so Step 3b of the initiate-new-disorder-creation skill does not
  apply.

  The FcalphaRI (CD89) node added in review is the mechanistic bridge between the
  isotype and the neutrophil infiltrate. Its evidence is receptor biology from
  human neutrophils and a linear IgA bullous disease mouse model rather than from
  IgA pemphigus patients, and the node says so: the disease shares the isotype
  and the neutrophil-rich histology, which is the basis for applying it here.

  A note on two evidence gradings that are unusual and deliberate. The
  retinoid treatment carries a REFUTE item, and the acantholysis phenotype keeps a
  contradicting source as NO_EVIDENCE so that it publishes no HPOA annotation.
  Both record sources that contradict the claim
  they attach to. They are kept rather than dropped because in a literature this
  small - 137 reported patients across 119 publications - a single contradicting
  source is a meaningful fraction of what is known, and hiding it would make the
  entry look more settled than the field is.

- category: Histopathologic
  name: Acantholysis
  description: >-
    Loss of keratinocyte cohesion. It is present but slight - reviews describe a
    few acantholytic cells within the pustules - and one case report states
    outright that acantholysis is not a feature of IgA pemphigus, unlike
    pemphigus vulgaris.

    Curated as OCCASIONAL and flagged in a discussion rather than smoothed over,
    because the sources genuinely disagree about whether it is present at all,
    and because that disagreement bears directly on whether the desmocollin
    antibody is doing what the disease name implies.
  phenotype_term:
    preferred_term: Acantholysis

has_subtypes:
- name: SPD type
  display_name: Subcorneal pustular dermatosis type
  description: >-
    Pustules in the uppermost epidermis, immediately beneath the stratum corneum,
    with IgA deposited in the intercellular space of the upper epidermis. The
    autoantigen is desmocollin 1. It is the subtype associated with IgA
    monoclonal gammopathy and with IgA multiple myeloma.

    A diagnostic caution that follows from the antigen being known: SPD-type IgA
    pemphigus is clinically and histopathologically indistinguishable from
    classical subcorneal pustular dermatosis (Sneddon-Wilkinson disease), which
    has no autoantibody at all. In the largest cohort all thirteen classical SPD
    cases were immunologically negative and could not be told apart from the
    seventeen SPD-type IgA pemphigus cases on clinical or histological grounds.
    The immunofluorescence is the only thing that separates them.
  evidence:
  - reference: PMID:9242496
    reference_title: "Human desmocollin 1 (Dsc1) is an autoantigen for the subcorneal pustular dermatosis type of IgA pemphigus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IgA antibodies of all six SPD-type IgA pemphigus cases reacted with the
      surface of cells expressing Dsc1, but not with cells expressing Dsc2 or
      Dsc3
    explanation: >-
      Identifies Dsc1 as the SPD-type autoantigen, with the specificity control
      that makes it convincing.
  - reference: PMID:27258999
    reference_title: "Clinical and immunological studies of 49 cases of various types of intercellular IgA dermatosis and 13 cases of classical subcorneal pustular dermatosis examined at Kurume University."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All cases of classical SPD, which showed no positive immunological results,
      were indistinguishable clinically and histopathologically from SPD-type
      IAD.
    explanation: >-
      The differential-diagnosis problem this subtype creates, stated by the
      largest cohort.
- name: IEN type
  display_name: Intraepidermal neutrophilic IgA dermatosis type
  description: >-
    Pustules involving the deeper or full-thickness epidermis, with IgA reactive
    with the entire epidermis rather than only its upper portion. The autoantigen
    is unknown and is presumed to be a non-desmosomal cell-surface protein - not
    for want of looking: in the experiment that identified Dsc1 for the SPD type,
    none of seven IEN sera bound any of the three human desmocollins.
  evidence:
  - reference: PMID:9242496
    reference_title: "Human desmocollin 1 (Dsc1) is an autoantigen for the subcorneal pustular dermatosis type of IgA pemphigus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, none of seven IEN-type IgA pemphigus cases reacted with cells
      transfected with any Dscs.
    explanation: >-
      The negative result that leaves the IEN antigen open, from the same
      experiment that settled the SPD one.
  - reference: PMID:21679872
    reference_title: "IgA pemphigus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      intraepidermal neutrophilic IgA dermatosis-type (IEN-type), whose target
      antigen is still unknown (probably nondesmosomal cell surface protein)
    explanation: >-
      The current state of the antigen question. Graded OTHER because it is a
      review's summary rather than a new finding.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A systematic review of MEDLINE, Embase and Web of Science found 137 patients
    across 119 studies - almost one publication per patient, which is what the
    literature of a disease this rare looks like. A 2016 case report put the
    running total at roughly 70. No incidence or point-prevalence estimate
    exists, and none can be derived from a case-report census.

    Mean age at presentation was 51.5 years with a standard deviation of 21.0,
    and the largest single-centre cohort gives a mean onset age of 45.9 with no
    sex predominance. The wide standard deviation is the substantive point: this
    is a disease of middle and later life that nonetheless occurs across a broad
    age range, so age is not a useful discriminator.
  evidence:
  - reference: PMID:31812619
    reference_title: "IgA pemphigus: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 119 eligible studies, comprising 137 patients with IgA pemphigus
      with a mean age of 51.5 ± 21.0 years, were included.
    explanation: >-
      The size of the entire reported literature, and the age distribution.
  - reference: PMID:27258999
    reference_title: "Clinical and immunological studies of 49 cases of various types of intercellular IgA dermatosis and 13 cases of classical subcorneal pustular dermatosis examined at Kurume University."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no sex predominance, and the average age at disease onset was
      45·9 years.
    explanation: >-
      Sex distribution and onset age from the largest single-centre series.
pathophysiology:
- name: IgA Autoantibody Production Against Keratinocyte Cell Surface
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating event, and the one that defines the disease: production of IgA
    autoantibodies binding the keratinocyte cell surface. The isotype is the
    diagnostic criterion - IgA pemphigus is defined by tissue-bound and
    circulating IgA antibodies where the other three pemphigus variants are
    defined by IgG.

    What triggers the autoantibody response is not known. The association with
    IgA monoclonal gammopathy (9.5 percent of reported patients) and with IgA
    multiple myeloma is the strongest clue available, and in the myeloma cases
    the antibody titre tracks the plasma-cell clone: treating the myeloma with
    daratumumab, lenalidomide and dexamethasone cleared both the skin lesions and
    the anti-desmoglein and anti-desmocollin IgA ELISAs.
  cell_types:
  - preferred_term: IgA plasma cell
    term:
      id: CL:0000987
      label: IgA plasma cell
  biological_processes:
  - preferred_term: immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:21679872
    reference_title: "IgA pemphigus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      IgA pemphigus is characterized by tissue-bound and circulating IgA
      antibodies targeting desmosomal or nondesmosomal cell surface components in
      the epidermis.
    explanation: >-
      The defining immunopathology. Graded OTHER because it is a review's
      definitional statement.
  - reference: PMID:35838241
    reference_title: "Subcorneal pustular dermatosis-type IgA pemphigus associated with multiple myeloma: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Daratumumab, lenalidomide, and dexamethasone (DLd) therapy was effective
      for both the MM and the skin lesions, resulting in negative results on
      Dsg1/3 and Dsc1-3 IgA ELISAs.
    explanation: >-
      Treating the plasma-cell clone abolished both the disease and the
      autoantibody, which is the closest thing in this literature to a
      demonstration that the clone is the source.
  downstream:
  - target: IgA Deposition in the Epidermal Intercellular Space
    causal_link_type: DIRECT
- name: IgA Deposition in the Epidermal Intercellular Space
  biological_scale: TISSUE
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Bound IgA in the intercellular space between keratinocytes, demonstrable by
    direct immunofluorescence in essentially every patient - 97 percent of the
    systematic review's cohort, with the remaining 3 percent diagnosed on
    indirect immunofluorescence or ELISA instead.

    The level at which it deposits is what separates the subtypes: the upper
    epidermis in the SPD type, the entire epidermis in the IEN type. Note the
    asymmetry with circulating antibody - only 66.7 percent of patients had
    detectable circulating IgA intercellular antibodies, so a negative serum does
    not exclude the disease and biopsy with direct immunofluorescence is the test
    that matters.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  evidence:
  - reference: PMID:31812619
    reference_title: "IgA pemphigus: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intercellular deposition of IgA was noted in almost all patients (97.0%),
      and the remaining 3.0% of patients had IgA positivity on indirect
      immunofluorescence or enzyme-linked immunosorbent assay confirming the
      diagnosis.
    explanation: >-
      The frequency of the defining tissue finding, across 137 patients.
  - reference: PMID:31812619
    reference_title: "IgA pemphigus: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IgA circulating intercellular antibodies were detected in only 66.7%
      patients.
    explanation: >-
      The serum-versus-tissue discrepancy, which is why direct
      immunofluorescence rather than serology is the primary test.
  downstream:
  - target: Impaired Desmosomal Cell-Cell Adhesion
    causal_link_type: DIRECT
  - target: FcalphaRI Cross-Linking on Neutrophils
    causal_link_type: DIRECT
- name: FcalphaRI Cross-Linking on Neutrophils
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The step that makes the isotype matter, and the reason this disease is
    neutrophilic where the IgG pemphigus variants are not. FcalphaRI (CD89) is
    the IgA Fc receptor, expressed on neutrophils, eosinophils, monocytes and
    several macrophage subsets. Cross-linking it with IgA immune complexes sets
    off superoxide production, cytokine release, phagocytosis, degranulation and
    NET release - and, critically, release of the chemoattractant leukotriene B4,
    which recruits further neutrophils in a positive feedback loop.

    That loop is useful against IgA-opsonised bacteria, where it self-terminates
    when the organism is cleared. Against a fixed autoantigen in the epidermis it
    does not terminate, which is the account this entry curates of why the
    inflammation is sustained.

    The evidence is not disease-specific to IgA pemphigus: it is receptor
    biology, established in human neutrophils and in a linear IgA bullous disease
    mouse model, and applied here to a disease that shares the isotype and the
    neutrophil-rich histology. That is stated rather than glossed, because the
    node is graded ESTABLISHED on the strength of the receptor work rather than
    on any IgA pemphigus experiment.
  molecular_functions:
  - preferred_term: IgA receptor activity
    term:
      id: GO:0019766
      label: IgA receptor activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: Fc receptor mediated stimulatory signaling pathway
    term:
      id: GO:0002431
      label: Fc receptor mediated stimulatory signaling pathway
    modifier: INCREASED
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  evidence:
  - reference: PMID:28736835
    reference_title: "Peptide mimetics of immunoglobulin A (IgA) and FcαRI block IgA-induced human neutrophil activation and migration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The cross-linking of the IgA Fc receptor (FcαRI) by IgA induces release of
      the chemoattractant LTB4, thereby recruiting neutrophils in a positive
      feedback loop. IgA autoantibodies of patients with autoimmune blistering
      skin diseases therefore induce massive recruitment of neutrophils,
      resulting in severe tissue damage.
    explanation: >-
      The mechanism and its application to IgA-mediated blistering disease, in one
      sentence pair. This is the step the entry previously asserted only in prose.
  - reference: PMID:28736835
    reference_title: "Peptide mimetics of immunoglobulin A (IgA) and FcαRI block IgA-induced human neutrophil activation and migration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cross‐linking of FcαRI by IgA‐immune complexes initiates robust
      inflammatory responses, including superoxide production, release of
      cytokines, phagocytosis, antigen presentation and release of neutrophil
      extracellular traps
    explanation: >-
      The effector repertoire the receptor triggers. Note the source uses
      non-breaking hyphens, reproduced exactly as cached.
  - reference: PMID:37081893
    reference_title: "Antagonizing FcαR1 (CD89) as treatment in IgA-mediated chronic inflammation and autoimmunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IgA can also be involved in disease pathology, because it provides a potent
      stimulus to activate neutrophils after crosslinking of surface CD89
      (FcaRI), resulting in chronic inflammation and tissue damage
    explanation: >-
      The receptor's pro-inflammatory role restated in the context of a
      therapeutic-antagonism programme. Not independent corroboration: van Egmond
      is senior author on this paper and on the one quoted above, both from the
      same VU Amsterdam anti-CD89 programme, and the quoted sentence is this
      paper's introduction citing its own group's prior work. That matters here,
      because this node is graded ESTABLISHED on evidence that is admittedly not
      disease-specific, so how much independent corroboration it carries is
      load-bearing.
  downstream:
  - target: Neutrophil Recruitment into the Epidermis
    causal_link_type: DIRECT
- name: Impaired Desmosomal Cell-Cell Adhesion
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    In SPD-type disease the antibody's target is desmocollin 1, a desmosomal
    cadherin that with the desmogleins holds keratinocytes together, so the
    expected consequence is loss of intercellular adhesion. That expectation is
    the standard account of the disease and it is what makes it a pemphigus.

    Graded PROVISIONAL deliberately, because the pathogenicity of
    anti-desmocollin autoantibodies is not established the way anti-desmoglein
    pathogenicity is. A 2023 review of the question puts it plainly: beyond a few
    in vitro and in vivo studies there is currently no clear evidence that
    anti-Dsc autoantibodies are pathogenic, in contrast to the well-established
    significance of the anti-Dsg ones. The antigen is identified; the causal step
    from binding it to blistering is inferred.
  molecular_functions:
  - preferred_term: cell adhesion molecule binding
    term:
      id: GO:0050839
      label: cell adhesion molecule binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: calcium-dependent cell-cell adhesion
    term:
      id: GO:0016339
      label: calcium-dependent cell-cell adhesion
    modifier: DECREASED
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:9242496
    reference_title: "Human desmocollin 1 (Dsc1) is an autoantigen for the subcorneal pustular dermatosis type of IgA pemphigus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results convincingly indicate that human Dsc1 is an autoantigen for
      SPD-type IgA pemphigus, suggesting the possibility of an important role for
      Dsc1 in the pathogenesis of this disease.
    explanation: >-
      The antigen identification. Note the authors' own hedge - "suggesting the
      possibility of an important role" - which is why this node is PROVISIONAL.
  - reference: PMID:36578135
    reference_title: "Significance of anti-desmocollin autoantibodies in pemphigus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, except for the findings of a few in vitro and in vivo studies,
      there is currently no clear evidence for the pathogenicity of anti-Dsc
      autoantibodies in pemphigus, whereas significance of anti-Dsg
      autoantibodies is well established.
    explanation: >-
      The explicit statement that the pathogenic step is unproven. Graded PARTIAL
      because it qualifies rather than supports the causal claim.
  downstream:
  - target: Intraepidermal Pustule and Vesicle Formation
    causal_link_type: DIRECT
  - target: "Acantholysis"
    causal_link_type: DIRECT
    description: >-
      The edge that carries this entry's central uncertainty into the graph. If
      anti-desmocollin IgA is pathogenic, this is how acantholysis arises; the
      node it leaves is graded PROVISIONAL for exactly that reason, and the
      phenotype it reaches is curated OCCASIONAL with a source that denies it
      occurs at all.
- name: Neutrophil Recruitment into the Epidermis
  biological_scale: TISSUE
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The step that makes this disease pustular rather than bullous, and the one
    that follows from the isotype. Histology shows extensive neutrophilic
    infiltration of the epidermis - confined to the upper part in the SPD type,
    through all layers in the IEN type - with the acantholysis, where present,
    slight.

    That inversion of emphasis relative to IgG pemphigus is the mechanistic
    signature: in pemphigus vulgaris the acantholysis is the lesion and
    neutrophils are incidental, here the neutrophils are the lesion and the
    acantholysis is a minor finding.

  evidence:
  - reference: PMID:10886149
    reference_title: "Subcorneal pustular dermatosis type of IgA pemphigus: demonstration of autoantibodies to desmocollin-1 and clinical review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathology showed subcorneal pustules containing a few acantholytic
      cells
    explanation: >-
      Acantholysis present but sparse, in a well-characterised SPD-type case.
  - reference: PMID:38751960
    reference_title: "A case of IgA pemphigus, with a poor response to dapsone, successfully treated with adalimumab."
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: >-
      Acantholysis of keratinocytes is not a feature of IgA pemphigus, unlike
      pemphigus vulgaris.
    explanation: >-
      Directly contradicts the phenotype as curated, and kept rather than omitted
      because the fact that a 2024 case report makes the claim is itself evidence
      that the point is unsettled in this literature. Two other cited sources
      describe acantholytic cells and one describes acantholytic blisters, so the
      flat denial is not supportable on its own.
      NO_EVIDENCE is deliberate and is the weakest part of this item. REFUTE would
      read better as direction, but on a phenotypes[] item it is also a publication
      decision: it maps to an HPOA NOT qualifier, so it would assert to downstream
      consumers that IgA pemphigus does not feature acantholysis - a claim this very
      explanation argues against. Grading it SUPPORT is worse still, and is what the
      retired WRONG_STATEMENT value silently did here. NO_EVIDENCE publishes nothing
      while leaving the source, the quote and this reasoning visible. The substantive
      disagreement is carried by the phenotype description and by discussions[1].
- category: Hematologic
  name: IgA Monoclonal Gammopathy
  description: >-
    An IgA paraprotein in about one in ten reported patients, and the association
    that has the clearest mechanistic reading, since the paraprotein-producing
    clone is a candidate source of the autoantibody. It can progress: IgA
    multiple myeloma has been reported in seven IgA pemphigus patients, in most
    of whom the myeloma was diagnosed at the same time as or after the skin
    disease.
  phenotype_term:
    preferred_term: IgA heavy chain paraproteinemia
    term:
      id: HP:0020194
      label: IgA heavy chain paraproteinemia
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:31812619
    reference_title: "IgA pemphigus: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IgA gammopathy and ulcerative colitis were associated with IgA pemphigus in
      9.5% and 6.6% patients, respectively.
    explanation: >-
      The frequency of the paraproteinaemia association in the pooled cohort.
      The quoted figure is for IgA gammopathy generally, which is what
      HP:0020194 names; myeloma is the malignant end of that spectrum and is
      much rarer, at seven reported cases.
  - reference: PMID:35838241
    reference_title: "Subcorneal pustular dermatosis-type IgA pemphigus associated with multiple myeloma: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Literature review revealed associations between SPD-type and IgA κ chain in
      IgA pemphigus and MM, and that in most cases the onset or diagnosis of MM
      was simultaneous or occurred after the diagnosis of IgA pemphigus.
    explanation: >-
      The temporal relationship, which is what makes surveillance after an IgA
      pemphigus diagnosis worthwhile.

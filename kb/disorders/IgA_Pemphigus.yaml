name: IgA Pemphigus
creation_date: "2026-08-29T06:00:00Z"
category: Autoimmune
disease_term:
  preferred_term: IgA pemphigus
  term:
    id: MONDO:0034127
    label: IgA pemphigus
description: >-
  IgA pemphigus is the pemphigus variant in which the autoantibody isotype is
  IgA rather than IgG. That single substitution changes the disease at every
  level below it. IgA does not drive the classic complement-and-acantholysis
  route; it recruits neutrophils, and the result is a pustular rather than a
  frankly blistering disease - annular and circinate plaques studded with
  vesicles and pustules, usually in the axillae and groin, intensely itchy, and
  histologically dominated by neutrophils in the epidermis.

  Two subtypes are conventionally recognised and they differ in the level of the
  epidermis involved and in what the antibody binds. In the subcorneal pustular
  dermatosis (SPD) type the pustules sit just under the stratum corneum and the
  autoantigen is known: desmocollin 1, established by transfecting each human
  desmocollin separately into COS7 cells and finding that every SPD serum bound
  Dsc1 and none bound Dsc2 or Dsc3. In the intraepidermal neutrophilic (IEN)
  type the pustules involve the deeper epidermis and the antigen is still
  unidentified - in that same experiment, none of the seven IEN sera bound any
  desmocollin.

  Both subtypes are curated here as `has_subtypes` on one disease rather than as
  two entries, because the IgA-plus-neutrophil mechanism is shared and it is
  what distinguishes the disease from the IgG pemphigus variants. That decision
  should be held loosely: cases with reactivity to Dsc2 and Dsc3, to
  desmogleins, or to all three desmocollins keep being reported, and one review
  has proposed abandoning the two-type scheme for an "IgA pemphigus spectrum".
parents:

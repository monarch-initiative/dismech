diagnosis:
- name: Direct Immunofluorescence of Perilesional Skin
  description: >-
    The primary test. IgA in the intercellular space of the epidermis is present
    in 97 percent of reported patients, and the staining level - upper epidermis
    versus full thickness - assigns the subtype. It is what separates SPD-type
    IgA pemphigus from classical subcorneal pustular dermatosis, which is
    clinically and histologically identical and immunologically negative.
  evidence:
  - reference: PMID:31812619
    reference_title: "IgA pemphigus: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intercellular deposition of IgA was noted in almost all patients (97.0%)
    explanation: >-
      The sensitivity of the test in the pooled cohort.
- name: Desmoglein and Desmocollin ELISA with Indirect Immunofluorescence
  description: >-
    Serological characterisation, useful for subtyping rather than for making the
    diagnosis - circulating IgA is detectable in only two-thirds of patients. The
    largest cohort found that indirect immunofluorescence combined with
    recombinant desmoglein and desmocollin ELISAs, added to direct
    immunofluorescence, was useful for diagnosis and subtyping, while noting that
    in many cases no antigen was detected at all.

    Desmocollin ELISAs are the part that is not universally available, and their
    absence is the practical reason many reported cases remain unclassified.
  evidence:
  - reference: PMID:27258999
    reference_title: "Clinical and immunological studies of 49 cases of various types of intercellular IgA dermatosis and 13 cases of classical subcorneal pustular dermatosis examined at Kurume University."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunological studies revealed that direct immunofluorescence, indirect
      immunofluorescence of normal human skin and enzyme-linked immunosorbent
      assays (ELISAs) of recombinant proteins of desmogleins and desmocollins
      frequently showed positive results, although no antigens were detected in
      many cases.
    explanation: >-
      Supports the assay panel while recording its failure rate. Graded PARTIAL
      because the same sentence does both.
- name: Haematological Surveillance After Diagnosis
  description: >-
    Not a test that makes the diagnosis, but one that should follow it. An IgA
    paraproteinaemia is present in roughly one in ten reported patients, and in
    most of the seven reported IgA myeloma cases the myeloma was diagnosed at the
    same time as, or after, the skin disease - so a normal screen at presentation
    does not close the question. Serum protein electrophoresis with
    immunofixation is the practical instrument.

    The association is strongest for the SPD subtype and for IgA kappa light
    chains, which is as far as the literature narrows it.
  evidence:
  - reference: PMID:35838241
    reference_title: "Subcorneal pustular dermatosis-type IgA pemphigus associated with multiple myeloma: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, clinicians should be aware of the development of multiple
      myeloma during the clinical course of patients with SPD-type IgA pemphigus.
    explanation: >-
      The surveillance recommendation, and its restriction to the SPD subtype.
treatments:
- name: Dapsone
  description: >-
    The drug of choice, and mechanistically apt: dapsone's anti-inflammatory
    action is on neutrophil function, which is the effector arm of this disease
    rather than an incidental feature of it. Oral dapsone and corticosteroids
    were the two commonest treatments across the entire reported literature.

    It is not reliably effective. A minority of patients do not clear on it, and
    recalcitrant disease is well enough recognised to have a second-line list -
    colchicine, sulfapyridine, acitretin - and reported failures even of those.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dapsone
      term:
        id: CHEBI:4325
        label: dapsone
  target_mechanisms:
  - target: Neutrophil Recruitment into the Epidermis
    description: >-
      Dapsone suppresses neutrophil recruitment and function, which is the
      effector step in this disease. It does not act on the autoantibody.
  evidence:
  - reference: PMID:31812619
    reference_title: "IgA pemphigus: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oral dapsone and corticosteroids were the mostly commonly used treatments.
    explanation: >-
      Established practice across the whole reported literature. The typo is the
      source's.
  - reference: PMID:38751960
    reference_title: "A case of IgA pemphigus, with a poor response to dapsone, successfully treated with adalimumab."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dapsone, despite being the drug of choice for treating IgA pemphigus, is
      not effective in clearing lesions in a minority of patients
    explanation: >-
      Establishes both the first-line status and its failure rate. Graded PARTIAL
      because it qualifies the treatment as much as it supports it.
- name: Systemic Corticosteroids
  description: >-
    The other commonly used first-line agent, usually alongside dapsone. The
    reported evidence is practice rather than trial: no controlled comparison of
    any treatment in this disease exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: systemic corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  target_mechanisms:
  - target: Neutrophil Recruitment into the Epidermis
    description: >-
      Broad suppression of the inflammatory infiltrate, without specificity for
      the autoantibody or its target.
  evidence:
  - reference: PMID:31812619
    reference_title: "IgA pemphigus: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oral dapsone and corticosteroids were the mostly commonly used treatments.
    explanation: >-
      Corticosteroids as one of the two commonest treatments in the pooled
      literature.
- name: Retinoid Therapy
  description: >-
    Retinoids appear in this literature in two guises and it is worth keeping
    them apart. Etretinate combined with dapsone improved a well-characterised
    SPD-type case, and acitretin is on the standard recalcitrant-disease list.
    But isotretinoin at 25 mg daily with prednisone achieved only a slight effect
    after six months in a reported IEN-type case with anti-desmoglein IgA - so
    the class is not uniformly useful, and the one clear failure was in the
    subtype whose antigen is unknown.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: etretinate
      term:
        id: CHEBI:4913
        label: etretinate
    - preferred_term: isotretinoin
      term:
        id: NCIT:C603
        label: Isotretinoin
  evidence:
  - reference: PMID:10886149
    reference_title: "Subcorneal pustular dermatosis type of IgA pemphigus: demonstration of autoantibodies to desmocollin-1 and clinical review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combined therapy with dapsone and etretinate improved the skin lesions.
    explanation: >-
      A retinoid-containing regimen working in an SPD-type case.
  - reference: PMID:27867744
    reference_title: "IgA pemphigus showing IgA antibodies to desmoglein 1 and 3."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systemic treatment with isotretinoin 25 mg/d and prednisone 20 mg/d

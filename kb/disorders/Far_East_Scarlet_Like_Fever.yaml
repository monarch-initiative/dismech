diagnosis:
- name: Stool culture and paired agglutinating antibody titers
  description: >-
    Pediatric FESLF-like disease can be confirmed by recovering Y.
    pseudotuberculosis from stool and documenting a fourfold or greater change
    in agglutinating antibody titer; stool isolates may require cold enrichment.
  evidence:
  - reference: PMID:6344044
    reference_title: Yersinia pseudotuberculosis infection in children, resembling Izumi fever and Kawasaki syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Yersinia pseudotuberculosis infection was diagnosed in 12 children on the
      basis of recovery of the organism from stool cultures and a 4-fold or
      greater titer change in agglutinating antibody.
    explanation: >-
      The pediatric Izumi/Kawasaki-like series anchors stool culture and paired
      serology as confirmatory tests.
  - reference: PMID:6344044
    reference_title: Yersinia pseudotuberculosis infection in children, resembling Izumi fever and Kawasaki syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight of the 12 Yersinia isolates were recovered from stool cultures only
      after cold enrichment.
    explanation: >-
      The same series documents that most stool isolates needed cold enrichment
      before recovery.
- name: Yersinia agglutination serology in refractory Kawasaki-like illness
  description: >-
    In Kawasaki-like presentations that persist despite immunomodulatory
    treatment, paired Yersinia agglutination titers can confirm infection even
    when blood and stool cultures are unrevealing.
  evidence:
  - reference: PMID:39697956
    reference_title: A Case of Refractory Kawasaki Disease With Yersinia pseudotuberculosis Infection Successfully Treated With Cefotaxime Following Immunosuppressive Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although stool and blood cultures did not detect any significant
      pathogens, analysis of Yersinia serum agglutinin titers revealed a result
      below detectable sensitivity on the second day of illness and a 640-fold
      increase on the 17th day.
    explanation: >-
      The Kawasaki-presenting case illustrates serologic confirmation after
      negative cultures.
treatments:
- name: Organism-directed antibiotic therapy
  description: >-
    Antibiotic therapy should be considered for severe, septicemic, or
    persistent Kawasaki-like Y. pseudotuberculosis disease once FESLF is
    suspected or confirmed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: cefotaxime
      term:
        id: CHEBI:204928
        label: cefotaxime
    - preferred_term: imipenem
      term:
        id: CHEBI:471744
        label: imipenem
  evidence:
  - reference: PMID:39697956
    reference_title: A Case of Refractory Kawasaki Disease With Yersinia pseudotuberculosis Infection Successfully Treated With Cefotaxime Following Immunosuppressive Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on these findings, cefotaxime was re-administered. The patient
      defervesced the next day and was afebrile late on with the improvement of
      inflammatory markers.
    explanation: >-
      The refractory Kawasaki-like pediatric case improved after cefotaxime was
      restarted for the underlying Y. pseudotuberculosis infection.
  - reference: PMID:18411766
    reference_title: "[Yersinia psuedotuberculosis septicemia in a healthy young woman]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After chemotherapy with imipenem, subjective symptoms ameliorated.
    explanation: >-
      This septicemic Y. pseudotuberculosis case supports antibiotic treatment
      for severe invasive disease.
- name: IVIG and aspirin for Kawasaki-presenting disease
  description: >-
    Kawasaki-presenting FESLF may require standard Kawasaki disease therapy with
    IVIG and aspirin to control vasculitis and limit coronary complications,
    while remaining alert to Yersinia-associated IVIG resistance.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: Therapeutic Immune Globulin
      term:
        id: NCIT:C2701
        label: Therapeutic Immune Globulin
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
  evidence:
  - reference: PMID:17129979
    reference_title: Analysis of Kawasaki disease showing elevated antibody titres of Yersinia pseudotuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the incidence of additional administration of immunoglobulin in the
      Yersinia-positive group (13/36, 36.1%) was significantly higher than in
      the Yersinia-negative group (41/256, 16.0%) (p=0.004).
    explanation: >-
      Yersinia-positive Kawasaki disease patients more often needed additional
      immunoglobulin, supporting IVIG relevance and resistance risk in this
      subset.
  - reference: PMID:39697956
    reference_title: A Case of Refractory Kawasaki Disease With Yersinia pseudotuberculosis Infection Successfully Treated With Cefotaxime Following Immunosuppressive Therapy.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Treatment includes intravenous immunoglobulin (IVIG) and aspirin to reduce
      complications, especially coronary artery issues.
    explanation: >-
      The Kawasaki/Yersinia case report restates IVIG plus aspirin as standard
      Kawasaki disease treatment for reducing coronary complications.
notes: >-
  Generic pYV-mediated adhesion, antiphagocytosis, and enteric invasion
  mechanisms remain inherited from the Yersinia pseudotuberculosis infectious
  disease parent. This child entry is restricted to the Far Eastern systemic
  branch centered on the YPMa superantigen and Kawasaki-like FESLF expression;
  postinfectious HLA-B27-associated reactive arthritis from European O:1/O:3
  Yersinia cohorts remains out of scope for this Far Eastern child entry.

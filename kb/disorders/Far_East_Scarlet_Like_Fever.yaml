name: Far-East Scarlet-Like Fever
creation_date: "2026-09-28T21:06:03Z"
category: Infectious Disease
description: >-
  Far-East scarlet-like fever is the severe Far Eastern systemic inflammatory
  form of Yersinia pseudotuberculosis infection, in which epidemic
  YPMa-superantigen-producing strains trigger Vbeta-restricted T-cell activation
  and a Kawasaki-like illness with fever, rash, desquamation,
  conjunctivitis, strawberry tongue, cheilitis, enteric symptoms, and arthralgia.
disease_term:
  preferred_term: Far-East scarlet-like fever
  term:
    id: MONDO:0041536
    label: Far-East scarlet-like fever
parents:
- Yersinia Pseudotuberculosis Infectious Disease
synonyms:
- FESLF
- Far East scarlet-like fever
- Izumi fever
infectious_agent:
- name: Yersinia pseudotuberculosis
  infectious_agent_term:
    preferred_term: Yersinia pseudotuberculosis
    term:
      id: NCBITaxon:633
      label: Yersinia pseudotuberculosis
  description: >-
    FESLF is caused by Far Eastern Y. pseudotuberculosis strains whose
    virulence program includes Yersinia pseudotuberculosis-derived mitogen A
    (YPMa), a T-cell superantigen implicated in the systemic inflammatory
    phenotype. The pVM82 plasmid is retained here as a reported
    clinical-epidemic strain marker; because the available review evidence does
    not distinguish a pVM82-encoded effector, the mechanistic pathograph follows
    YPMa.
  evidence:
  - reference: PMID:26819960
    reference_title: "Far East Scarlet-Like Fever: A Review of the Epidemiology, Symptomatology, and Role of Superantigenic Toxin: Yersinia pseudotuberculosis-Derived Mitogen A."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Studies suggest the ability of Far Eastern strains to produce superantigen
      toxin Y pseudotuberculosis-derived mitogen A is integral to FESLF
      pathogenesis.
    explanation: >-
      The FESLF review identifies Far Eastern YPMa-producing Y.
      pseudotuberculosis as the strain program that distinguishes this syndrome.
  - reference: PMID:30695393
    reference_title: "[PLASMID-ASSOCIATED VIRULENCE OF YERSINIA PSEUDOTUBERCULOSIS AND INFECTIOUS PROCESS]."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      pVM82 plasmid present only in Y pseudotuberculosis sttains causing
      clinical-epidemic manifestation of the infec- tions as Far East
      scarlet-like fever (FESLF)
    explanation: >-
      The plasmid-virulence review supports pVM82 as a marker reported in the
      Y. pseudotuberculosis strains that cause clinical-epidemic FESLF.
transmission:
- name: Ingestion of vegetables and root crops contaminated with Yersinia pseudotuberculosis
  description: >-
    FESLF is food-borne. Y. pseudotuberculosis survives and multiplies at
    refrigeration temperature, so vegetables and root crops held in winter
    stores accumulate the organism and are eaten raw; contamination of exactly
    these foods was documented in the vegetable stores of most Primorye FESLF
    foci.
  evidence:
  - reference: PMID:1210894
    reference_title: "[Study of the epidemiology of Far Eastern scarlatina-like fever in the Maritime Territory. I. Contamination of vegetables, root crops and pickled foods with the pseudotuberculosis microbe (Yersinia pseudotuberculosis) in foci of the scarlatina-like fever]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was revealed high incidence of contamination with Yersinia pseudotuberculosis of vegetables, roots and pickled products (less frequently) in the vegetable store-houses of the majority of the far Eastern scarlatina-like fever foci in Primorie."
    explanation: >-
      Field epidemiology of the FESLF foci themselves, finding the organism in
      the stored vegetables and root crops that are the suspected vehicle.
  - reference: PMID:1210894
    reference_title: "[Study of the epidemiology of Far Eastern scarlatina-like fever in the Maritime Territory. I. Contamination of vegetables, root crops and pickled foods with the pseudotuberculosis microbe (Yersinia pseudotuberculosis) in foci of the scarlatina-like fever]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "vegetables and roots which are often used raw--onion, carrots, cabbage--displayed the greastest contamination."
    explanation: >-
      Narrows the vehicle to the raw-eaten vegetables, which is what makes
      ingestion the route rather than a handling exposure.
  - reference: PMID:39697956
    reference_title: "A Case of Refractory Kawasaki Disease With Yersinia pseudotuberculosis Infection Successfully Treated With Cefotaxime Following Immunosuppressive Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "transmitted primarily through contaminated food or water, with the most common sources being raw or undercooked pork, unpasteurized milk, and contaminated water."
    explanation: >-
      States the food-and-water route for Y. pseudotuberculosis generally,
      alongside the FESLF-specific vegetable vehicle above.
- name: Outbreak exposure to a common contaminated source
  description: >-
    Because the vehicle is a stored food supply shared by many people, FESLF
    presents in outbreaks as well as sporadically, which is the epidemiological
    signature of a point-source food-borne disease rather than of
    person-to-person spread.
  evidence:
  - reference: PMID:26819960
    reference_title: "Far East Scarlet-Like Fever: A Review of the Epidemiology, Symptomatology, and Role of Superantigenic Toxin: Yersinia pseudotuberculosis-Derived Mitogen A."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In Russia and Japan, outbreaks of Y pseudotuberculosis infection cause severe systemic inflammatory symptoms."
    explanation: >-
      The FESLF review records the outbreak pattern in the two regions where the
      syndrome occurs.
definitions:
- name: Far-East scarlet-like fever syndrome
  definition_type: CASE_DEFINITION
  description: >-
    FESLF is the severe systemic inflammatory disease variant caused by Far
    Eastern Y. pseudotuberculosis strains, historically recognized in Russian
    Far East and Japanese outbreak settings as Izumi fever-like or
    Kawasaki-like pseudotuberculosis.
  evidence:
  - reference: PMID:26819960
    reference_title: "Far East Scarlet-Like Fever: A Review of the Epidemiology, Symptomatology, and Role of Superantigenic Toxin: Yersinia pseudotuberculosis-Derived Mitogen A."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Far East scarlet-like fever (FESLF) is a severe inflammatory disease that
      occurs sporadically and in outbreaks in Russia and Japan.
    explanation: >-
      The review defines FESLF as the severe Far Eastern inflammatory disease
      variant of Y. pseudotuberculosis infection.
progression:
- phase: YPMa-positive systemic inflammatory yersiniosis
  notes: >-
    Far Eastern strains enter the superantigen-driven branch of Y.
    pseudotuberculosis infection rather than remaining a purely localized
    enteric illness.
  evidence:
  - reference: PMID:26819960
    reference_title: "Far East Scarlet-Like Fever: A Review of the Epidemiology, Symptomatology, and Role of Superantigenic Toxin: Yersinia pseudotuberculosis-Derived Mitogen A."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      In Russia and Japan, outbreaks of Y pseudotuberculosis infection cause
      severe systemic inflammatory symptoms.
    explanation: >-
      The review supports FESLF as a severe systemic branch of Y.
      pseudotuberculosis infection.
- phase: Izumi fever and Kawasaki-like mucocutaneous disease
  notes: >-
    Pediatric Y. pseudotuberculosis infection can clinically resemble Izumi
    fever and Kawasaki syndrome, with mucocutaneous inflammation, enteric
    symptoms, arthralgia, and hepatomegaly.
  evidence:
  - reference: PMID:6344044
    reference_title: Yersinia pseudotuberculosis infection in children, resembling Izumi fever and Kawasaki syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients' clinical manifestations and courses of illness resembled
      those of Izumi fever, an illness that occurs epidemically in Japan.
    explanation: >-
      The 12-child clinical series explicitly relates Y. pseudotuberculosis
      infection to the Izumi fever syndrome.
pathophysiology:
- name: Far Eastern YPMa Superantigen Production
  description: >-
    The defining bacterial input is a Far Eastern Y. pseudotuberculosis lineage
    that expresses the secreted YPMa superantigen, redirecting infection from
    localized gastroenteritis toward systemic FESLF inflammation.
  biological_scale: MOLECULAR
  downstream:
  - target: Superantigenic MHC-II and TCR Vbeta Engagement
    description: >-
      YPM engages MHC class II and T-cell receptor Vbeta surfaces rather than a
      conventional peptide-specific TCR groove.
    evidence:
    - reference: PMID:10406939
      reference_title: Analysis of functional regions of YPM, a superantigen derived from gram-negative bacteria.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        To study the mode of action of YPM at the molecular level, we first
        generated a number of YPM point mutants with reduced T-cell
        proliferative activity using random mutagenesis and localized the amino
        acid positions involved in either major histocompatibility complex class
        II or T-cell receptor Vbeta-interaction.
      explanation: >-
        Mutational analysis connects YPM-induced T-cell proliferation to
        residues involved in MHC class II and TCR Vbeta interaction.
  evidence:
  - reference: PMID:26819960
    reference_title: "Far East Scarlet-Like Fever: A Review of the Epidemiology, Symptomatology, and Role of Superantigenic Toxin: Yersinia pseudotuberculosis-Derived Mitogen A."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Geographical heterogeneity exists between virulence factors produced by
      European and Far Eastern Y pseudotuberculosis strains, implicating
      superantigen Y pseudotuberculosis-derived mitogen A (YPMa) in the
      pathogenesis of FESLF.
    explanation: >-
      The review places YPMa specifically in the Far Eastern virulence program
      implicated in FESLF.
- name: Superantigenic MHC-II and TCR Vbeta Engagement
  description: >-
    YPM binds the Vbeta surface of T-cell receptors in a way that bypasses
    ordinary antigen specificity; point mutants defective in Vbeta binding show
    parallel attenuation of T-cell proliferation, cytotoxic activation, and
    proinflammatory cytokine release.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
  downstream:
  - target: Vbeta-Restricted T Cell Activation
    description: >-
      TCR Vbeta binding converts the secreted bacterial mitogen into
      nonclonal, Vbeta-restricted T-cell stimulation.
    evidence:
    - reference: PMID:10087177
      reference_title: Generated single point-mutations can considerably dismantle the lymphocyte overstimulation induced by Yersinia pseudotuberculosis superantigen.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The SAg-associated in vitro pathogenic functions, cytotoxic activation
        and the production of proinflammatory cytokines, were also diminished,
        in parallel.
      explanation: >-
        The point-mutant study shows that mutations reducing YPM-driven T-cell
        proliferative responses also diminish superantigen-associated
        cytotoxic activation and proinflammatory cytokine production.
  evidence:
  - reference: PMID:10406939
    reference_title: Analysis of functional regions of YPM, a superantigen derived from gram-negative bacteria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, we obtained evidence that YPM partially competes with
      staphylococcal enterotoxin E for human leukocyte antigen-DR binding.
    explanation: >-
      In-vitro binding studies support HLA-DR engagement as part of the YPM
      superantigen mechanism.
- name: Vbeta-Restricted T Cell Activation
  description: >-
    In vivo exposure to YPM expands Vbeta-biased alpha-beta T cells; experimental
    YPM shock depends on CD4-positive, TCR Vbeta7/Vbeta8 T cells rather than on
    conventional antigen-specific T-cell priming.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell activation
    modifier: INCREASED
    term:
      id: GO:0042110
      label: T cell activation
  downstream:
  - target: YPM-Induced Proinflammatory Cytokine Production
    description: >-
      Activated Vbeta-restricted T cells drive TNF-alpha and IFN-gamma release,
      producing a shock-like inflammatory effector arm.
    evidence:
    - reference: PMID:9159409
      reference_title: Identification of murine T cells reactive with the bacterial superantigen Yersinia pseudotuberculosis-derived mitogen (YPM) and factors involved in YPM-induced toxicity in mice.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results indicate that YPM-induced shock requires the presence of
        CD4+ T cells bearing TCR Vbeta7 and Vbeta8, and that endogenous
        TNF-alpha and IFN-gamma mediate the lethal effects.
      explanation: >-
        Antibody blockade in a mouse YPM shock model links CD4-positive
        Vbeta-restricted T cells to TNF-alpha and IFN-gamma-mediated systemic
        toxicity.
  - target: Superantigen-Activated T Cell Liver Homing
    description: >-
      YPM-activated Vbeta-biased T cells can rapidly traffic from blood into
      the liver in a superantigen shock model.
    evidence:
    - reference: PMID:15003813
      reference_title: Critical role of T cell migration in bacterial superantigen-mediated shock in mice.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found that Vbeta8(+) T cells activated by YPM migrated from
        peripheral blood to liver as early as 1 h after injection of YPM
      explanation: >-
        The YPM mouse shock model provides a hepatic trafficking bridge between
        superantigen-activated T cells and liver enlargement reported in FESLF.
  evidence:
  - reference: PMID:9109426
    reference_title: Clinical role for a superantigen in Yersinia pseudotuberculosis infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      T cells bearing the Vbeta3 gene segment were significantly increased (P =
      0.009) among acute phase patients compared with healthy children.
    explanation: >-
      The human acute-infection series supports Vbeta-biased T-cell expansion
      during Y. pseudotuberculosis infection.
- name: YPM-Induced Proinflammatory Cytokine Production
  description: >-
    YPM-triggered T cells and peripheral blood leukocytes release
    proinflammatory cytokines, including TNF-alpha and interferon-gamma, forming
    a measured cellular effector response downstream of superantigenic T-cell
    activation.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: alpha-beta T cell
    term:
      id: CL:0000789
      label: alpha-beta T cell
  biological_processes:
  - preferred_term: cytokine production
    modifier: INCREASED
    term:
      id: GO:0001816
      label: cytokine production
  - preferred_term: type II interferon production
    modifier: INCREASED
    term:
      id: GO:0032609
      label: type II interferon production
  downstream:
  - target: FESLF Mucocutaneous and Systemic Inflammatory Syndrome
    description: >-
      YPM-triggered cytokine release is the superantigen effector arm that
      links Vbeta-restricted T-cell activation to the systemic FESLF syndrome.
    evidence:
    - reference: PMID:26819960
      reference_title: "Far East Scarlet-Like Fever: A Review of the Epidemiology, Symptomatology, and Role of Superantigenic Toxin: Yersinia pseudotuberculosis-Derived Mitogen A."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        Studies suggest the ability of Far Eastern strains to produce
        superantigen toxin Y pseudotuberculosis-derived mitogen A is integral to
        FESLF pathogenesis.
      explanation: >-
        The review connects the YPMa superantigen program to the systemic FESLF
        phenotype downstream of cytokine-producing T-cell activation.
    - reference: PMID:9159409
      reference_title: Identification of murine T cells reactive with the bacterial superantigen Yersinia pseudotuberculosis-derived mitogen (YPM) and factors involved in YPM-induced toxicity in mice.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results indicate that YPM-induced shock requires the presence of
        CD4+ T cells bearing TCR Vbeta7 and Vbeta8, and that endogenous
        TNF-alpha and IFN-gamma mediate the lethal effects.
      explanation: >-
        The YPM shock model supports TNF-alpha and IFN-gamma as systemic
        mediators released downstream of Vbeta-biased CD4-positive T cells.
  evidence:
  - reference: PMID:15003813
    reference_title: Critical role of T cell migration in bacterial superantigen-mediated shock in mice.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that Vbeta8(+) T cells activated by YPM migrated from peripheral
      blood to liver as early as 1 h after injection of YPM and that serum level
      of IFN-gamma was significantly elevated 4 h after YPM injection.
    explanation: >-
      The mouse YPM shock model supports rapid Vbeta-biased T-cell activation
      followed by systemic IFN-gamma release.
  - reference: PMID:12449699
    reference_title: "[Impact of Yersinia pseudotuberculosis on the in vitro production of cytokines by whole blood cells of donors]."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The maximum stimulation of the production of cytokines was observed under
      the action of YPM, which confirmed an important role played by this
      superantigen in the pathogenesis of Y. pseudotuberculosis.
    explanation: >-
      Human whole-blood stimulation supports YPM as a potent cytokine-inducing
      superantigen.
- name: FESLF Mucocutaneous and Systemic Inflammatory Syndrome
  description: >-
    YPMa-positive systemic inflammation in children presents as an Izumi
    fever-like and Kawasaki-like syndrome with frequent fever, rash,
    mucocutaneous findings, gastrointestinal symptoms, arthralgia, and, in a
    Kawasaki-presenting subset, coronary artery lesions.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Fever
    description: Fever belongs to the frequent systemic FESLF presentation.
  - target: Skin Rash
    description: Rash belongs to the frequent mucocutaneous FESLF presentation.
  - target: Diarrhea
    description: Diarrhea belongs to the frequent gastrointestinal FESLF presentation.
  - target: Desquamation
    description: Desquamation belongs to the frequent mucocutaneous FESLF presentation.
  - target: Strawberry Tongue
    description: Strawberry tongue belongs to the frequent oral mucosal FESLF presentation.
  - target: Vomiting
    description: Vomiting belongs to the frequent gastrointestinal FESLF presentation.
  - target: Red and Cracked Lips
    description: Cracked erythematous lips belong to the frequent oral mucosal FESLF presentation.
  - target: Abdominal Pain
    description: Abdominal pain belongs to the frequent gastrointestinal FESLF presentation.
  - target: Arthralgia
    description: Arthralgia belongs to the frequent systemic FESLF presentation.
  - target: Conjunctivitis
    description: Conjunctivitis belongs to the frequent mucocutaneous FESLF presentation.
  - target: Coronary Artery Lesions
    description: >-
      Kawasaki disease with evidence of Y. pseudotuberculosis infection has an
      enriched coronary artery lesion burden.
    evidence:
    - reference: PMID:17129979
      reference_title: Analysis of Kawasaki disease showing elevated antibody titres of Yersinia pseudotuberculosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the incidence of coronary artery lesions (dilatations plus aneurysms)
        in the Yersinia-positive group (22/42, 52.4%) was significantly higher
        than in the Yersinia-negative group (105/330, 31.8%) (p=0.001)
      explanation: >-
        The age-adjusted retrospective Kawasaki disease comparison links
        Yersinia-positive cases to a higher rate of coronary dilatations or
        aneurysms.
  evidence:
  - reference: PMID:6344044
    reference_title: Yersinia pseudotuberculosis infection in children, resembling Izumi fever and Kawasaki syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally the finding in two children fulfilled the strict criteria
      for Kawasaki syndrome, and signs in the other 10 children were consistent
      with that diagnosis.
    explanation: >-
      The pediatric series documents that the common FESLF mucocutaneous and
      systemic findings clinically overlapped Kawasaki syndrome.
  - reference: PMID:26819960
    reference_title: "Far East Scarlet-Like Fever: A Review of the Epidemiology, Symptomatology, and Role of Superantigenic Toxin: Yersinia pseudotuberculosis-Derived Mitogen A."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Studies suggest the ability of Far Eastern strains to produce superantigen
      toxin Y pseudotuberculosis-derived mitogen A is integral to FESLF
      pathogenesis.
    explanation: >-
      Review-level evidence supports YPMa-driven superantigen inflammation as
      integral to the systemic FESLF syndrome.
- name: Superantigen-Activated T Cell Liver Homing
  description: >-
    YPM can recruit Vbeta-biased T cells into the liver in vivo, providing a
    model-organism bridge from the superantigenic T-cell node to the liver
    enlargement observed in pediatric FESLF.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  downstream:
  - target: Hepatomegaly
    description: >-
      Hepatic trafficking of YPM-activated T cells provides a plausible
      superantigen-linked bridge to hepatomegaly in FESLF.
    evidence:
    - reference: PMID:15003813
      reference_title: Critical role of T cell migration in bacterial superantigen-mediated shock in mice.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found that Vbeta8(+) T cells activated by YPM migrated from
        peripheral blood to liver as early as 1 h after injection of YPM
      explanation: >-
        The mouse YPM shock model supports the hepatic T-cell trafficking step;
        the downstream hepatomegaly endpoint is anchored by the human pediatric
        case series.
  evidence:
  - reference: PMID:15003813
    reference_title: Critical role of T cell migration in bacterial superantigen-mediated shock in mice.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Vbeta8(+) T cells activated by YPM migrated from peripheral blood to liver
    explanation: >-
      The model directly measures YPM-activated Vbeta-biased T-cell migration
      into liver after superantigen exposure.
phenotypes:
- name: Fever
  description: >-
    Fever is part of the frequent pediatric FESLF/Izumi fever presentation.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  frequency: FREQUENT
  evidence:
  - reference: PMID:6344044
    reference_title: Yersinia pseudotuberculosis infection in children, resembling Izumi fever and Kawasaki syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical findings in 50% or more of patients were fever, rash, diarrhea,
      desquamation, strawberry tongue, vomiting, red and cracked lips, abdominal
      pain, arthralgias, hepatomegaly and conjunctivitis.
    explanation: >-
      The 12-child clinical series found fever in at least half of patients with
      Y. pseudotuberculosis infection resembling Izumi fever and Kawasaki
      syndrome.

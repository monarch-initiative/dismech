notes: >-
  Gene symbol: the live HGNC record for hgnc:21882 gives the current symbol as IFT56 with
  `prev_symbol: ["TTC26"]` (checked against the HGNC REST API while writing this entry). The
  OBO build that `just validate-terms` resolves against still carries TTC26, so that is what
  `term.label` binds - the label is copied from the source the validator checks, as the
  ontology-term contract requires, not from the newer record. This is the same build-lag
  situation dismech#10102 records for GBA1/GBA. `preferred_term` also keeps TTC26, which is
  what every cited publication and the MONDO term use. When the build catches up, this label
  needs updating to IFT56 and the entry will fail term validation until it is.

  No GeneReviews chapter covers this disorder. `just check-genereviews` returns NO_CHAPTER
  for both Bookshelf collections against the committed index (snapshot 2026-09-10). The
  phenotype baseline is the index seven-family report (PMID:31595528) together with the
  four-patient pituitary series (PMID:32617964).

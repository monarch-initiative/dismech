name: Biliary, Renal, Neurologic, and Skeletal Syndrome
creation_date: "2026-09-18T00:00:00Z"
category: Mendelian
synonyms:
- BRNS
- TTC26 ciliopathy
- IFT56-related ciliopathy
- severe biliary ciliopathy
- TTC26-related severe biliary ciliopathy
description: >
  Biliary, renal, neurologic and skeletal syndrome is an autosomal recessive ciliopathy
  caused by biallelic variants in TTC26 - the gene HGNC now names IFT56 - which encodes an
  atypical component of the intraflagellar transport B complex. It was defined in 2019 from
  seven individuals in seven families whose shared and unexpected presentation was severe
  neonatal cholestasis: lethal in one, requiring liver transplantation in two.

  The name enumerates affected organs rather than naming a mechanism, which is usually the
  shape of a grouping. Here it is not, and the reason is worth stating. All four systems
  fail from one lesion in one conserved transport machine. The primary cilium is a shared
  signalling organelle rather than an organ-specific structure, so a defect in the machinery
  that builds and loads it presents wherever ciliary signalling is developmentally load
  bearing - the intrahepatic biliary tree, the kidney, the brain, the limb skeleton, and, as
  a later series added, the pituitary. The quartet in the name is the classic ciliopathy
  quartet, and it is a single pathograph rather than four.

  The contribution this entry makes beyond "another ciliopathy" is the biliary emphasis.
  Fibrocystic liver disease was already established ciliopathy territory; severe neonatal
  cholestasis was not, and the index study's own conclusion is that ciliopathy belongs in
  the differential for neonatal cholestasis even when none of the more familiar ciliopathy
  features is present.

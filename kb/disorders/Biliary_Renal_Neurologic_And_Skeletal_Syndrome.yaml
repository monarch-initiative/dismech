  prevalence_class: UNKNOWN
  notes: >-
    Eleven patients are reported: seven individuals from seven families in the defining
    study, and four further patients homozygous for a single missense allele in the
    pituitary series. No rate has been estimated.
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe seven individuals from seven families with syndromic ciliopathy clinical
      features, including severe neonatal cholestasis (lethal in one and necessitating liver
      transplant in two).
    explanation: >-
      Gives the size of the defining cohort and the severity distribution of its hepatic
      phenotype.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Of seven patients in the defining cohort, one died and two required liver
    transplantation - three of seven with a lethal or transplant-requiring hepatic course.
    The multisystem involvement adds renal, neurological and skeletal morbidity on top, and
    the later series adds pituitary stalk interruption with its endocrine consequences. No
    disease-modifying treatment exists; management is organ-directed and, for the liver,
    ultimately surgical.
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      including severe neonatal cholestasis (lethal in one and necessitating liver transplant
      in two)
    explanation: >-
      Gives the hepatic outcomes - one death and two transplants out of seven - that drive
      the HIGH burden assessment.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Disease requires biallelic TTC26 variants. All reported patients are homozygous; the
    defining study mapped a single critical locus on chromosome 7 and found three different
    homozygous variants that fully segregated with the phenotype across the seven families,
    and the pituitary series reports four patients homozygous for one missense allele.
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positional mapping revealed a single critical locus on chromosome 7. Whole-exome
      sequencing revealed three different homozygous variants in Tetratricopeptide Repeat
      Domain 26 (TTC26) that fully segregated with the phenotype.
    explanation: >-
      Establishes recessive inheritance and, through full segregation across seven
      independent families, the causality of the locus.
genetic:
- name: TTC26
  gene_term:
    preferred_term: TTC26
    term:
      id: hgnc:21882
      label: TTC26
  relationship_type: CAUSATIVE
  notes: >
    TTC26, renamed IFT56 by HGNC, encodes an atypical component of the IFT-B complex, also
    known as DYF13 after its Chlamydomonas ortholog. It is atypical in that it is not one of
    the IFT-B core subunits, which is consistent with a hypomorphic rather than
    cilium-abolishing phenotype. Reported human alleles are homozygous missense and
    loss-of-function changes; the recurrent c.695A>G p.Asn232Ser allele accounts for the
    four patients in the pituitary series.
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TTC26 (intraflagellar transport [IFT] 56/DYF13) is an atypical component of IFT-B
      complex, and deficiency of its highly conserved orthologs has been consistently shown
      to cause defective ciliary function in several model organisms.
    explanation: >-
      Identifies the gene product's place in the IFT-B complex and records the cross-species
      conservation that supports the mechanism.
  - reference: PMID:32617964
    reference_title: "Pituitary stalk interruption syndrome broadens the clinical spectrum of the TTC26 ciliopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now describe four patients with TTC26 ciliopathy due to a homozygous c.695A>G
      p.Asn232Ser mutation
    explanation: >-
      Gives the recurrent missense allele and the number of patients carrying it.
pathophysiology:
- name: TTC26 Loss of Function
  description: >
    Biallelic TTC26 variants impair an atypical component of the IFT-B complex, the anterograde
    intraflagellar transport machinery that carries cargo from the ciliary base to the tip.
    Loss of the conserved ortholog disrupts ciliary function across model organisms, which is
    the cross-species evidence the human interpretation rests on.
  biological_scale: MOLECULAR
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
  genes:
  - preferred_term: TTC26
    term:
      id: hgnc:21882
      label: TTC26
  biological_processes:
  - preferred_term: intraciliary transport
    modifier: DECREASED
    term:
      id: GO:0042073
      label: intraciliary transport
  cellular_components:
  - preferred_term: cilium
    term:
      id: GO:0005929
      label: cilium
  downstream:
  - target: Abnormal Ciliary Structure and IFT-B Cargo Loading
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31595528
      reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show that cilia in TTC26-mutated patient cells display variable length and
        impaired function, as indicated by dysregulated sonic hedgehog signaling, abnormal
        staining for IFT-B components, and transcriptomic clustering with cells derived from
        individuals with closely related ciliopathies.
      explanation: >-
        Demonstrates the structural and cargo-loading consequence directly in patient cells,
        which is what this edge asserts rather than either node alone.
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      three different homozygous variants in Tetratricopeptide Repeat Domain 26 (TTC26) that
      fully segregated with the phenotype
    explanation: >-
      Documents the biallelic lesion that constitutes this node.
- name: Abnormal Ciliary Structure and IFT-B Cargo Loading
  description: >
    Patient cells show cilia of variable length with abnormal staining for IFT-B components.
    Their transcriptomes cluster with cells from closely related ciliopathies, which is
    independent evidence that the lesion places these cells in the same functional class
    rather than merely resembling it clinically. The cilia are present - this is a
    trafficking defect, not a failure of ciliogenesis.

    The two systems disagree on one point and the entry keeps both rather than picking.
    Patient cells show cilia of *variable length*; the hop mouse shows no decrease in
    *number or length*. Both agree the organelle is built, which is the load-bearing claim
    for the mechanism; they differ on whether its dimensions are affected, which nothing
    downstream in this entry depends on.
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  biological_processes:
  - preferred_term: cilium assembly
    modifier: DECREASED
    term:
      id: GO:0060271
      label: cilium assembly
  downstream:
  - target: Dysregulated Sonic Hedgehog Signalling
    causal_link_type: DIRECT
    description: >-
      Hedgehog transduction depends on the trafficking of pathway components into and along
      the cilium, so a cargo-loading defect disables it.
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      cilia in TTC26-mutated patient cells display variable length and impaired function
    explanation: >-
      Documents the structural abnormality and functional impairment of the cilium in
      patient-derived cells.
- name: Dysregulated Sonic Hedgehog Signalling
  description: >
    Sonic hedgehog signalling is dysregulated in patient cells. Because Hedgehog transduction
    is obligately ciliary in vertebrates, this is the shared downstream step through which a
    transport defect becomes a developmental one, and it is the node that links the limb,
    brain and pituitary phenotypes to the same lesion as the liver and kidney phenotypes.

    The hop-sterile mouse localises the failure precisely, and the location is not where an
    IFT-B defect would be expected to act. Gli still accumulates at the ciliary tip on
    Hedgehog stimulation; what fails is the subsequent dissociation of Gli from its negative
    regulator Sufu. The authors state explicitly that this distinguishes Ttc26 from the
    previously characterised IFT-B mutations. So the lesion is not "cargo does not arrive" -
    cargo arrives and is not released.
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction"
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  downstream:
  - target: Failed Intrahepatic Biliary Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Multisystem Ciliopathy Organ Involvement
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      as indicated by dysregulated sonic hedgehog signaling
    explanation: >-
      Documents the Hedgehog signalling abnormality in patient cells, cited by the authors as
      the indicator of impaired ciliary function.
  - reference: PMID:25340710
    reference_title: "A mutation in the mouse ttc26 gene leads to impaired hedgehog signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      hop did not interfere with Hh-induced accumulation of Gli at the tip of the primary
      cilium, but rather with the subsequent dissociation of Gli from its negative
      regulator, Sufu
    explanation: >-
      Localises the signalling failure to the Gli-Sufu dissociation step rather than to
      ciliary delivery, which is what makes this node a specific mechanistic claim rather
      than a restatement that Hedgehog signalling is abnormal.
  - reference: PMID:25340710
    reference_title: "A mutation in the mouse ttc26 gene leads to impaired hedgehog signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unlike the previously characterized mutations that affect IFT complex B, hop did not
      interfere with Hh-induced accumulation of Gli at the tip of the primary cilium
    explanation: >-
      Records that this behaviour distinguishes the Ttc26 lesion from other IFT-B defects,
      which is why the node is worth stating separately rather than folding into the generic
      ciliopathy module mechanism.
- name: Failed Intrahepatic Biliary Development
  description: >
    The hepatic phenotype is developmental rather than degenerative. Ttc26 is strongly
    expressed in the embryonic mouse liver in a pattern consistent with a role in normal
    development of the intrahepatic biliary system, and the human presentation is neonatal -
    the biliary tree is malformed from the outset rather than progressively damaged. This is
    the node that makes the entry's contribution: fibrocystic liver disease was already
    known ciliopathy territory, severe neonatal cholestasis was not.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cholangiocyte
    term:
      id: CL:1000488
      label: cholangiocyte
  locations:
  - preferred_term: intrahepatic bile duct
    term:
      id: UBERON:0003704
      label: intrahepatic bile duct
  downstream:
  - target: Cholestasis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      We also demonstrate a strong expression of Ttc26 in the embryonic mouse liver in a
      pattern consistent with its proposed role in the normal development of the
      intrahepatic biliary system.
    explanation: >-
      Supports the developmental reading of the hepatic phenotype. Graded INDIRECT because
      the evidence is an expression pattern in mouse embryo, from which the developmental
      role is inferred rather than demonstrated, and the authors say "consistent with" and
      "proposed" rather than asserting it.
- name: Multisystem Ciliopathy Organ Involvement
  description: >
    Beyond the liver, patients show the renal, brain, skeletal and cardiac involvement that
    defines syndromic ciliopathy, with polydactyly among the skeletal features. A later
    series added pituitary stalk interruption, establishing the pituitary as a further
    ciliary-dependent developmental site in this disorder.
  biological_scale: ORGANISM
  conforms_to: "ciliopathy_dysfunction#Multisystem Pleiotropic Ciliopathy Phenotype"
  downstream:
  - target: Polydactyly
    causal_link_type: DIRECT
  - target: Renal cyst
    causal_link_type: DIRECT
  - target: Interrupted pituitary stalk
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32617964
    reference_title: "Pituitary stalk interruption syndrome broadens the clinical spectrum of the TTC26 ciliopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe biliary ciliopathy, caused by bi-allelic mutations in TTC26, has been recently
      described in the context of a syndrome of polydactyly and severe neonatal cholestasis,
      with brain, kidney and heart involvement.
    explanation: >-
      Enumerates the organ systems this node covers, in a later paper restating the
      established picture.
    quote_role: BACKGROUND

notes: >-
  IFT56 is the current gene symbol; TTC26 is retained in the gene binding and cited literature. Published variant
  names refer to the transcripts used in the original reports and should not be interchanged between isoforms
  without normalization. The clinical evidence consists of small cohorts and individual reports, rather than
  a population-based natural-history study. No disease-specific GeneReviews chapter was identified; the defining
  cohort and subsequent molecularly diagnosed cases provide the clinical baseline. The PMC5399663 URL contains
  the full text of PMID:28264835, including assay-context qualifications absent from its abstract. The PMID:36533556
  cache contains the full TTC26-specific CRISPR results.

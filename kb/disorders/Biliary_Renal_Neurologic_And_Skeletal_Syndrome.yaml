diagnosis:
- name: Molecular diagnosis by exome or genome sequencing
  description: >-
    Exome or genome sequencing with segregation analysis can establish biallelic TTC26/IFT56 variants in a
    compatible multisystem phenotype. RNA analysis can help assess splice variants; reduced transcript abundance
    alone is distinct from demonstrating a particular splicing product. Severe neonatal cholestasis can prompt
    consideration of ciliopathy even without the usual associated features.
  evidence:
  - reference: PMID:34177428
    reference_title: Identification of the TTC26 Splice Variant in a Novel Complex Ciliopathy Syndrome with Biliary, Renal, Neurological, and Skeletal Manifestations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Whole-genome sequencing and Sanger sequencing revealed a homozygous splice site variant (c.4-1G>C; NM_024926.3)
      in the tetratricopeptide repeat domain 26 (TTC26) gene located in chromosome 7q34, which cosegregated
      perfectly with the disease phenotype.
    explanation: >-
      This documents sequencing and segregation in a molecularly diagnosed patient.
    quote_role: PRIMARY_RESULT
  - reference: PMID:31595528
    reference_title: Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      our results highlight the importance of considering ciliopathies in the differential diagnosis of severe
      neonatal cholestasis even in the absence of more typical features.
    explanation: >-
      The defining study supports the diagnostic scope.
    quote_role: PRIMARY_RESULT
- name: Hepatobiliary imaging and histology
  description: >-
    Ultrasound can characterize intrahepatic duct abnormalities. The 2021 patient had cystic intrahepatic duct
    dilatation, initially suspected to be Caroli disease, and biopsy showed cholestasis with ductopenia and
    mild ductular reaction. These findings document hepatobiliary involvement but do not establish a universal
    ductal-plate malformation or a complete developmental mechanism.
  evidence:
  - reference: PMID:34177428
    reference_title: "Identification of the TTC26 Splice Variant in a Novel Complex Ciliopathy Syndrome with Biliary, Renal, Neurological, and Skeletal Manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

      quote_role: PRIMARY_RESULT
pathophysiology:
- name: TTC26 functional impairment
  description: >-
    Biallelic TTC26/IFT56 variants impair a core component of IFT-B. Splice, missense and truncating alleles
    can differ in residual function; complete absence of the protein is not established for every patient.
    IFT56 contributes to selective protein trafficking and signaling rather than simply determining whether
    all cilia form.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positional mapping revealed a single critical locus on chromosome 7. Whole-exome
      sequencing revealed three different homozygous variants in Tetratricopeptide Repeat
      Domain 26 (TTC26) that fully segregated with the phenotype.
    explanation: >-
      Establishes recessive inheritance and, through full segregation across seven
      independent families, the causality of the locus.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:26980730
    reference_title: Overall Architecture of the Intraflagellar Transport (IFT)-B Complex Containing Cluap1/IFT38 as an Essential Component of the IFT-B Peripheral Subcomplex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      we identified TTC26/IFT56 and Cluap1/IFT38, neither of which was included with certainty in previous
      models of the IFT-B complex, as integral components of the core and peripheral subcomplexes, respectively
    explanation: >-
      Biochemical interaction analysis places TTC26/IFT56 in the core, while CLUAP1/IFT38 belongs to the peripheral
      subcomplex.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Abnormal ciliary IFT-B protein localization
    description: >-
      Mutant patient cells exhibit abnormal IFT-B component distribution.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31595528
      reference_title: Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        We show that cilia in TTC26-mutated patient cells display variable length and impaired function, as
        indicated by dysregulated sonic hedgehog signaling, abnormal staining for IFT-B components, and transcriptomic
        clustering with cells derived from individuals with closely related ciliopathies.
      explanation: >-
        Patient-derived cells directly demonstrate abnormal ciliary function and IFT-B staining, without resolving
        every organ-level mechanism.
      quote_role: PRIMARY_RESULT
  - target: Ciliary axonemal disorganization

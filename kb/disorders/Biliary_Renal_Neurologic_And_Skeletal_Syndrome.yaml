- name: Abnormal ciliary IFT-B protein localization
  description: >-
    Patient cells have abnormal IFT-B staining. In hop mouse cells, IFT81 and IFT27 are reduced in cilia, whereas
    IFT88 distribution changes with tissue and compartment. Other IFT components and ciliary proteins can remain
    normally localized. These selective defects do not imply that all IFT movement ceases; algal particle velocities
    were similar after controlling for flagellar length.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:31595528
    reference_title: Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      We show that cilia in TTC26-mutated patient cells display variable length and impaired function, as indicated
      by dysregulated sonic hedgehog signaling, abnormal staining for IFT-B components, and transcriptomic
      clustering with cells derived from individuals with closely related ciliopathies.
    explanation: >-
      Patient-derived cells directly demonstrate abnormal ciliary function and IFT-B staining, without resolving
      every organ-level mechanism.
    quote_role: PRIMARY_RESULT
  - reference: PMID:28264835
    reference_title: IFT56 regulates vertebrate developmental patterning by maintaining IFTB complex integrity and ciliary microtubule architecture.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Strikingly, core IFTB proteins are unable to accumulate normally within Ift56hop cilia, including IFT88,
      IFT81 and IFT27, which are crucial for key processes such as tubulin transport and Shh signaling.
    explanation: >-
      The mouse study identifies altered distribution of particular IFT-B proteins; the full text shows compartment-dependent
      differences.
    quote_role: PRIMARY_RESULT
  - reference: PMID:24596149
    reference_title: TTC26/DYF13 is an intraflagellar transport protein required for transport of motility-related proteins into flagella.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      We found that in such cells, which were genetically wild-type but happened to have shorter flagella comparable
      to the dyf13 mutant flagella (6–8 μm), the KAP-GFP speed was almost the same as in the dyf13 mutant
    explanation: >-
      The full-text comparison controls for flagellar length and limits a blanket claim of reduced IFT speed.
    quote_role: PRIMARY_RESULT
  downstream: []
  conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
  biological_processes:

    term:
      id: GO:0042073
      label: intraciliary transport
    modifier: ABNORMAL
- name: Ciliary axonemal disorganization
  description: >-
    Primary cilia form in hop mice but can have abnormal axonemal microtubule-doublet number and positioning.
    Both mouse studies report retained cilia with modestly increased length; knockdown in renal cells and zebrafish
    can instead shorten cilia. The ordering between microtubule architecture defects and abnormal IFT-B distribution
    remains unresolved.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:28264835
    reference_title: IFT56 regulates vertebrate developmental patterning by maintaining IFTB complex integrity and ciliary microtubule architecture.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Ift56hop mice have normal cilia distribution but display defective cilia structure, including abnormal
      positioning and number of ciliary microtubule doublets.
    explanation: >-
      Electron microscopy in the mouse study demonstrates axonemal abnormalities, not a universal failure of
      basal-body docking.
    quote_role: PRIMARY_RESULT
  - reference: PMID:25340710
    reference_title: A mutation in the mouse ttc26 gene leads to impaired hedgehog signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      In fact, the hop mutation was associated with a slight increase in cilium length
    explanation: >-
      The mouse full text corrects an interpretation of the abstract as showing entirely unchanged ciliary
      dimensions.
    quote_role: PRIMARY_RESULT
  - reference: PMID:22718903
    reference_title: Knockdown of ttc26 disrupts ciliogenesis of the photoreceptor cells and the pronephros in zebrafish.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Knockdown of Ttc26 in mIMCD3 cells produced shortened and defective primary cilia, as revealed by immunofluorescence
      and scanning electron microscopy.
    explanation: >-
      A different perturbation and cellular setting produces shortened cilia.
    quote_role: PRIMARY_RESULT
  downstream: []
- name: Dysregulated Sonic Hedgehog Signalling
  description: >-
    Ciliary Hedgehog signaling is altered in patient cells. Mouse studies demonstrate impaired GLI activator
    and repressor functions, with residual pathway activity. One study found preserved stimulated GLI tip accumulation
    with impaired GLI-SUFU dissociation; another found reduced GLI tip accumulation in culture and embryonic
    tissues. Stimulation conditions may contribute to this difference. Reduced GLI repressor activity offers
    a model-based explanation for polydactyly; the evidence does not establish Hedgehog failure as the mechanism
    of every hepatic, renal, ocular or endocrine feature.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:31595528
    reference_title: Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      We show that cilia in TTC26-mutated patient cells display variable length and impaired function, as indicated
      by dysregulated sonic hedgehog signaling, abnormal staining for IFT-B components, and transcriptomic
      clustering with cells derived from individuals with closely related ciliopathies.
    explanation: >-
      Patient-derived cells directly demonstrate abnormal ciliary function and IFT-B staining, without resolving
      every organ-level mechanism.
    quote_role: PRIMARY_RESULT
  - reference: PMID:25340710
    reference_title: A mutation in the mouse ttc26 gene leads to impaired hedgehog signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      hop did not interfere with Hh-induced accumulation of Gli at the tip of the primary cilium, but rather
      with the subsequent dissociation of Gli from its negative regulator, Sufu
    explanation: >-
      This study locates a defect after GLI recruitment under its experimental conditions.
    quote_role: PRIMARY_RESULT
  - reference: PMID:28264835
    reference_title: IFT56 regulates vertebrate developmental patterning by maintaining IFTB complex integrity and ciliary microtubule architecture.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      We show that Ift56hop cilia are unable to accumulate Gli proteins efficiently, resulting in developmental

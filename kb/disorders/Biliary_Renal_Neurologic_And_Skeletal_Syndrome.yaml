animal_models:
- name: Ift56hop homozygous mouse
  species: Mouse
  genotype: Ift56hop (Ttc26) homozygous loss-of-function
  publication: PMID:41352382
  description: >
    The same Ift56hop loss-of-function allele produces radically different disease depending
    on mouse strain background: on Balb/cByJ, homozygotes survive to adulthood with male
    sterility and a hopping gait; on C57BL/6J they are perinatal lethal with multiple
    skeletal and organ defects including tracheoesophageal fistula. A modifier of the
    phenotype maps to chromosome 4. This is the most useful thing the mouse says about the
    human disease, and it is a caution rather than a mechanism.
  modeled_mechanisms:
  - target: Multisystem Ciliopathy Organ Involvement
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces multisystem congenital anomaly from the same gene, and demonstrates that
      the severity of that anomaly is set by unlinked modifier loci rather than by the
      causal allele alone.
    limitations: >-
      Severity is background-dependent to the point of changing the verdict: viable adult on
      one strain, perinatal lethal on another, from one allele. The mouse therefore cannot
      be used to predict severity for a human genotype, and the specific phenotypes differ
      from the human ones - male sterility and hopping gait on one background,
      tracheoesophageal fistula on the other, neither reported in patients, and neonatal
      cholestasis, the defining human feature, not reported in either.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The two strains are isogenic populations differing at a mapped chromosome 4 modifier.
        Human patients are outbred and each carries an unknown modifier background, so the
        model demonstrates that modifiers dominate without identifying which ones apply to
        any patient.
    - divergence_type: OTHER
      materiality: QUALIFYING
      description: >-
        Incomplete phenotype: severe neonatal cholestasis, the defining and most
        consequential human phenotype, is not among the reported mouse phenotypes on either
        background. Recorded as OTHER because ModelDivergenceTypeEnum has no value for a
        model that simply does not express part of the disease - see dismech#11743.
    evidence:
    - reference: PMID:41352382
      reference_title: "Genetic background influences the extent and severity of cilia-related congenital anomalies in Ift56/Ttc26 mutant mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we demonstrate that in the C57BL/6J background, Ift56hop homozygotes are perinatal
        lethal, and have multiple skeletal and organ defects, including the formation of
        tracheoesophageal fistulas
      explanation: >-
        Documents the severe-background phenotype, against which the viable Balb/cByJ
        phenotype is the contrast that carries the finding.
  evidence:
  - reference: PMID:41352382
    reference_title: "Genetic background influences the extent and severity of cilia-related congenital anomalies in Ift56/Ttc26 mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using Single Nucleotide Polymorphisms (SNPs) that differ between these mouse strains,
      we show that a modifier of the Ift56hop phenotype maps to Chromosome 4.
    explanation: >-
      Establishes that an unlinked modifier locus, not the causal allele, sets the severity -
      the finding that makes this model informative about human phenotypic variability.
discussions:
- discussion_id: brns_modifier_loci_explain_variability
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the chromosome 4 modifier effect seen in Ift56hop mice have a human counterpart that
    explains why one TTC26 patient dies in the neonatal period and another reaches liver
    transplantation and survives?
  attaches_to:
  - animal_models#Mouse
  - genetic#TTC26
  rationale: >-
    Human TTC26 disease is strikingly variable in severity for a recessive disorder in which
    patients are homozygous - one death, two transplants and four survivors among the first
    seven, and a later group of four sharing one allele who present with pituitary rather
    than hepatic disease as their distinguishing feature. The mouse work shows that for this
    exact gene, one loss-of-function allele can be compatible with adult life or perinatally
    lethal depending only on unlinked background, with a modifier mapped to chromosome 4.
    That is a mechanism for the human variability that does not require invoking allele
    severity, and the human cohorts are far too small to test it. Recorded as
    HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the evidence exists and is strong;
    what is unknown is whether the modifier architecture transfers, and the mouse experiment -
    fixing genotype and varying background - cannot be run in people.
  evidence:
  - reference: PMID:41352382
    reference_title: "Genetic background influences the extent and severity of cilia-related congenital anomalies in Ift56/Ttc26 mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This could lead to the same mutation causing distinct effects in different individuals.
    explanation: >-
      States the inference this discussion is about, in the authors' own terms, and its
      explicit extension to individual humans.
- discussion_id: brns_gli_accumulation_contested
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does Gli reach the ciliary tip in Ift56/Ttc26 mutants and fail to be released from Sufu,
    or does it fail to accumulate there in the first place?
  attaches_to:
  - pathophysiology#Dysregulated Sonic Hedgehog Signalling
  rationale: >-
    Two studies of the same Ift56hop allele report opposite things. One states that the
    mutation "did not interfere with Hh-induced accumulation of Gli at the tip of the primary
    cilium" and locates the defect at the subsequent Gli-Sufu dissociation, explicitly
    contrasting Ttc26 with other IFT-B mutants. The other states that "Ift56hop cilia are
    unable to accumulate Gli proteins efficiently", and attributes it to destabilisation of
    the IFT-B complex, with core IFT-B proteins themselves failing to accumulate.

    This is not a difference of species, allele or disease model, which is what makes it
    worth recording rather than reconciling by preference. It also matters for how the entry
    reads: the first account makes TTC26 mechanistically unusual among IFT-B components, the
    second makes it ordinary. The downstream nodes do not depend on the answer - both
    accounts agree Hedgehog transduction fails - so the pathograph is stable either way, and
    an earlier version of this entry that presented the first account as settled has been
    corrected rather than re-decided.
- discussion_id: brns_how_cilia_build_the_biliary_tree
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what steps does impaired IFT-B cargo transport produce a malformed intrahepatic
    biliary tree?
  attaches_to:
  - pathophysiology#Failed Intrahepatic Biliary Development
  rationale: >-
    The edge from dysregulated Hedgehog signalling to failed biliary development is recorded
    as INDIRECT_UNKNOWN_INTERMEDIATES, and that is not a formality. What exists is an
    embryonic mouse expression pattern "consistent with" a proposed role, plus a human
    phenotype. No study has traced ductal plate remodelling, cholangiocyte specification or
    the Hedgehog-dependence of either in this disease. Filling that in would matter beyond
    the disorder, because the index study's clinical message - consider ciliopathy in
    neonatal cholestasis - rests on a mechanism nobody has yet shown.

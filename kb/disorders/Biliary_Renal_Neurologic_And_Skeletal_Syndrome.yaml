clinical_burden:
  burden_level: HIGH
  rationale: >-
    Severe neonatal hepatic disease caused one death and required liver transplantation in two of seven patients
    in the defining cohort. Renal, brain, pituitary and skeletal abnormalities can add substantial morbidity.
    Other patients have different organ involvement, including a biliary-sparing presentation. These small
    selected series do not establish a syndrome-wide survival probability.
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      including severe neonatal cholestasis (lethal in one and necessitating liver transplant
      in two)
    explanation: >-
      Gives the hepatic outcomes - one death and two transplants out of seven - that drive
      the HIGH burden assessment.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    BRENS is associated with biallelic TTC26/IFT56 variants. Homozygous variants segregated in the defining
    families and pituitary series. A later patient carried a maternal splice-region allele in trans with two
    paternal missense variants on the same allele. Thus homozygosity is not required. Penetrance and reliable
    genotype-phenotype correlations are not established by the small published series.
  evidence:
  - &id001
    reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positional mapping revealed a single critical locus on chromosome 7. Whole-exome
      sequencing revealed three different homozygous variants in Tetratricopeptide Repeat
      Domain 26 (TTC26) that fully segregated with the phenotype.
    explanation: >-
      Establishes recessive inheritance and, through full segregation across seven
      independent families, the causality of the locus.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:39514123
    reference_title: Biliary, Renal, Neurological, and Skeletal syndrome in a Chinese boy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Gene testing revealed three novel compound heterozygous variants in the TTC26 gene, c.1069 + 5G > A in
      one allele from the mother and c.511A > G (p.Ile171Val) and c.1099T > C (p.Ser367Pro) in another allele
      from the father.
    explanation: >-
      The maternal allele is in trans with a paternal allele carrying two variants in cis; this is not three
      independently demonstrated pathogenic alleles.
    quote_role: PRIMARY_RESULT
genetic:
- name: TTC26
  gene_term:
    preferred_term: TTC26
    term:
      id: hgnc:21882
      label: TTC26
  relationship_type: CAUSATIVE
  notes: >-
    TTC26/IFT56 is an IFT-B core protein. Reported disease-associated genotypes include homozygous missense,
    splice-site and truncating alleles, and a compound-heterozygous genotype. The c.695A>G (p.Asn232Ser) allele
    recurs in the pituitary series. For c.4-1G>C (NM_024926.3), prior transcript work showed exon skipping,
    and a subsequent patient study measured reduced TTC26 RNA. The intronic c.1006-5T>C allele affects splicing.
    A later compound genotype contains a maternal c.1069+5G>A allele and a paternal cis pair, p.Ile171Val and
    p.Ser367Pro; the contribution of each change cannot be separated from that report. These observations do
    not imply identical molecular effects or severity for every allele.
  evidence:
  - *id001
  - reference: PMID:32617964
    reference_title: "Pituitary stalk interruption syndrome broadens the clinical spectrum of the TTC26 ciliopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now describe four patients with TTC26 ciliopathy due to a homozygous c.695A>G
      p.Asn232Ser mutation
    explanation: >-
      Gives the recurrent missense allele and the number of patients carrying it.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:38135897
    reference_title: "A novel TTC26 variant in a patient with hexadactyly, pituitary stalk interruption, hepatopathy, nephropathy, and bilateral lip-palate cleft: A case report and expansion of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on a previously undescribed homozygous intronic TTC26 variant
      (c.1006-5 T > C) in a patient showing some of the known TTC26-associated features
    explanation: >-
      Adds an intronic splice-affecting allele to the reported spectrum.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:39514123
    reference_title: Biliary, Renal, Neurological, and Skeletal syndrome in a Chinese boy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Gene testing revealed three novel compound heterozygous variants in the TTC26 gene, c.1069 + 5G > A in
      one allele from the mother and c.511A > G (p.Ile171Val) and c.1099T > C (p.Ser367Pro) in another allele
      from the father.
    explanation: >-
      The maternal allele is in trans with a paternal allele carrying two variants in cis; this is not three
      independently demonstrated pathogenic alleles.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34177428
    reference_title: Identification of the TTC26 Splice Variant in a Novel Complex Ciliopathy Syndrome with Biliary, Renal, Neurological, and Skeletal Manifestations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Using RNA samples from the patient, qRT-PCR revealed a substantial decrease in the expression of TTC26
      in the proband as compared to the normal control (Fig. 1e).
    explanation: >-
      The RNA assay demonstrates decreased abundance in this patient; it does not establish a universal expression
      defect or directly measure the splicing product.
    quote_role: PRIMARY_RESULT
  variants:
  - name: c.4-1G>C (NM_024926.3)
    variant_type: single nucleotide variant
    genomic_contexts:

clinical_burden:
  burden_level: HIGH
  rationale: >-
    Of seven patients in the defining cohort, one died and two required liver
    transplantation - three of seven with a lethal or transplant-requiring hepatic course.
    The multisystem involvement adds renal, neurological and skeletal morbidity on top, and
    the later series adds pituitary stalk interruption with its endocrine consequences. No
    disease-modifying treatment exists; management is organ-directed and, for the liver,
    ultimately surgical.
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      including severe neonatal cholestasis (lethal in one and necessitating liver transplant
      in two)
    explanation: >-
      Gives the hepatic outcomes - one death and two transplants out of seven - that drive
      the HIGH burden assessment.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Disease requires biallelic TTC26 variants. All reported patients are homozygous; the
    defining study mapped a single critical locus on chromosome 7 and found three different
    homozygous variants that fully segregated with the phenotype across the seven families,
    and the pituitary series reports four patients homozygous for one missense allele.
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positional mapping revealed a single critical locus on chromosome 7. Whole-exome
      sequencing revealed three different homozygous variants in Tetratricopeptide Repeat
      Domain 26 (TTC26) that fully segregated with the phenotype.
    explanation: >-
      Establishes recessive inheritance and, through full segregation across seven
      independent families, the causality of the locus.
genetic:
- name: TTC26
  gene_term:
    preferred_term: TTC26
    term:
      id: hgnc:21882
      label: TTC26
  relationship_type: CAUSATIVE
  notes: >
    TTC26, renamed IFT56 by HGNC, encodes a component of the IFT-B complex, also known as
    DYF13 after its Chlamydomonas ortholog. An earlier version of this note said it is "not
    one of the IFT-B core subunits"; that is wrong, and a paper cited here refutes it -
    TTC26/IFT56 is an integral component of the IFT-B **core** subcomplex, and loss of it
    prevents other core IFT-B proteins accumulating normally in cilia.

    What "atypical" in the index report actually refers to is cargo selectivity, not
    subcomplex position, and that is the more interesting fact. Unlike other IFT-B mutants,
    dyf13 mutant flagella assemble IFT particles at normal speed; what is lost is a
    particular subset of cargo, specifically motility-related proteins. So this is a core
    component whose loss removes some cargo classes and not others - which is why the
    disease has both a primary-cilium (Hedgehog) and a motile-cilium arm, and why the cilium
    is built rather than absent.

    Reported human alleles are homozygous missense, splice and loss-of-function changes; the
    recurrent c.695A>G p.Asn232Ser allele accounts for the four patients in the pituitary
    series, and a homozygous intronic c.1006-5T>C variant is reported in a further patient.
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TTC26 (intraflagellar transport [IFT] 56/DYF13) is an atypical component of IFT-B
      complex, and deficiency of its highly conserved orthologs has been consistently shown
      to cause defective ciliary function in several model organisms.
    explanation: >-
      Identifies the gene product's place in the IFT-B complex and records the cross-species
      conservation that supports the mechanism.
  - reference: PMID:32617964
    reference_title: "Pituitary stalk interruption syndrome broadens the clinical spectrum of the TTC26 ciliopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now describe four patients with TTC26 ciliopathy due to a homozygous c.695A>G
      p.Asn232Ser mutation
    explanation: >-
      Gives the recurrent missense allele and the number of patients carrying it.
  - reference: PMID:26980730
    reference_title: "Overall Architecture of the Intraflagellar Transport (IFT)-B Complex Containing Cluap1/IFT38 as an Essential Component of the IFT-B Peripheral Subcomplex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we identified TTC26/IFT56 and Cluap1/IFT38, neither of which was included with
      certainty in previous models of the IFT-B complex, as integral components of the core
      and peripheral subcomplexes, respectively
    explanation: >-
      Places TTC26/IFT56 in the IFT-B core subcomplex. Cited because it settles a question
      this entry previously got backwards.
  - reference: PMID:24596149
    reference_title: "TTC26/DYF13 is an intraflagellar transport protein required for transport of motility-related proteins into flagella."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Surprisingly, IFT particle assembly and speed were normal in dyf13 mutant flagella,
      unlike in other IFT complex B mutants. Proteomic and biochemical analyses indicated a
      particular set of proteins involved in motility was specifically depleted in the dyf13
      mutant.
    explanation: >-
      Establishes cargo selectivity rather than subcomplex position as what distinguishes
      this IFT-B component, which is the correct reading of "atypical".
  - reference: PMID:38135897
    reference_title: "A novel TTC26 variant in a patient with hexadactyly, pituitary stalk interruption, hepatopathy, nephropathy, and bilateral lip-palate cleft: A case report and expansion of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on a previously undescribed homozygous intronic TTC26 variant
      (c.1006-5 T > C) in a patient showing some of the known TTC26-associated features
    explanation: >-
      Adds an intronic splice-affecting allele to the reported spectrum.
pathophysiology:
- name: TTC26 Loss of Function
  description: >
    Biallelic TTC26 variants impair an atypical component of the IFT-B complex, the anterograde
    intraflagellar transport machinery that carries cargo from the ciliary base to the tip.
    Loss of the conserved ortholog disrupts ciliary function across model organisms, which is
    the cross-species evidence the human interpretation rests on.
  biological_scale: MOLECULAR
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
  genes:
  - preferred_term: TTC26
    term:
      id: hgnc:21882
      label: TTC26
  biological_processes:
  - preferred_term: intraciliary transport
    modifier: DECREASED
    term:
      id: GO:0042073
      label: intraciliary transport
  cellular_components:
  - preferred_term: cilium
    term:
      id: GO:0005929
      label: cilium
  downstream:
  - target: Abnormal Ciliary Structure and IFT-B Cargo Loading
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31595528
      reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show that cilia in TTC26-mutated patient cells display variable length and
        impaired function, as indicated by dysregulated sonic hedgehog signaling, abnormal
        staining for IFT-B components, and transcriptomic clustering with cells derived from
        individuals with closely related ciliopathies.
      explanation: >-
        Demonstrates the structural and cargo-loading consequence directly in patient cells,
        which is what this edge asserts rather than either node alone.
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      three different homozygous variants in Tetratricopeptide Repeat Domain 26 (TTC26) that
      fully segregated with the phenotype
    explanation: >-
      Documents the biallelic lesion that constitutes this node.
- name: Abnormal Ciliary Structure and IFT-B Cargo Loading
  description: >
    Patient cells show cilia of variable length with abnormal staining for IFT-B components.
    Their transcriptomes cluster with cells from closely related ciliopathies, which is
    independent evidence that the lesion places these cells in the same functional class
    rather than merely resembling it clinically. The cilia are present - this is a
    trafficking defect, not a failure of ciliogenesis.

    The two systems disagree on one point and the entry keeps both rather than picking.
    Patient cells show cilia of *variable length*; the hop mouse shows no decrease in
    *number or length*. Both agree the organelle is built, which is the load-bearing claim
    for the mechanism; they differ on whether its dimensions are affected, which nothing
    downstream in this entry depends on.
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  biological_processes:
  - preferred_term: cilium assembly
    modifier: DECREASED
    term:
      id: GO:0060271
      label: cilium assembly
  downstream:
  - target: Dysregulated Sonic Hedgehog Signalling
    causal_link_type: DIRECT
    description: >-
      Hedgehog transduction depends on the trafficking of pathway components into and along
      the cilium, so a cargo-loading defect disables it. This is the primary-cilium arm.
  - target: Motile Cilia Beat Dysfunction
    causal_link_type: DIRECT
    description: >-
      The cargo this component carries is specifically enriched for motility proteins, so
      the same lesion disables motile cilia by a separate route from the Hedgehog one. This
      is why the disease has a neurologic arm that Hedgehog does not explain.
    evidence:
    - reference: PMID:24596149
      reference_title: "TTC26/DYF13 is an intraflagellar transport protein required for transport of motility-related proteins into flagella."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Knockdown of TTC26/DYF13 in zebrafish embryos or mutation of TTC26/DYF13 in C.
        reinhardtii, produced short cilia with abnormal motility.
      explanation: >-
        Establishes that loss of this component impairs ciliary motility in two organisms,
        which is the step this edge asserts.
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      cilia in TTC26-mutated patient cells display variable length and impaired function
    explanation: >-
      Documents the structural abnormality and functional impairment of the cilium in
      patient-derived cells.
- name: Motile Cilia Beat Dysfunction
  description: >
    The second arm of the disease, and the one the Hedgehog account does not reach. The cargo
    this IFT-B component carries is specifically enriched for motility-related proteins, so
    losing it produces short cilia that beat abnormally while IFT particle assembly and speed
    stay normal. In the brain, ependymal motile cilia drive cerebrospinal fluid flow, and
    failure of that beat is the accepted route from a ciliopathy gene to hydrocephalus - which
    in this disease presents with aqueductal stenosis and needed shunting.
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Motile Cilia Beat Dysfunction"
  biological_processes:
  - preferred_term: cilium movement
    modifier: DECREASED
    term:
      id: GO:0003341
      label: cilium movement
  - preferred_term: cerebrospinal fluid circulation
    modifier: DECREASED
    term:
      id: GO:0090660
      label: cerebrospinal fluid circulation
  downstream:
  - target: Hydrocephalus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Impaired ependymal ciliary beat impairs cerebrospinal fluid flow, which accumulates.
    evidence:
    - reference: PMID:34177428
      reference_title: "Identification of the TTC26 Splice Variant in a Novel Complex Ciliopathy Syndrome with Biliary, Renal, Neurological, and Skeletal Manifestations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        The proper movement of cilia helps in the flow of cerebrospinal fluid, and the
        disruption of proper movement (beating) by irregular planar cell polarity causes the
        accumulation of cerebrospinal fluid resulting in hydrocephalus
      explanation: >-
        States the ependymal-cilia route to hydrocephalus. Graded INDIRECT because the source
        states the general ciliopathy mechanism as background rather than demonstrating it
        for TTC26.
      quote_role: BACKGROUND
  - target: Aqueductal stenosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:24596149
    reference_title: "TTC26/DYF13 is an intraflagellar transport protein required for transport of motility-related proteins into flagella."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Proteomic and biochemical analyses indicated a particular set of proteins involved in
      motility was specifically depleted in the dyf13 mutant.
    explanation: >-
      Identifies motility proteins as the specifically depleted cargo class, which is what
      makes this a distinct arm rather than a consequence of general ciliary failure.
- name: Dysregulated Sonic Hedgehog Signalling
  description: >
    Sonic hedgehog signalling is dysregulated in patient cells. Because Hedgehog transduction
    is obligately ciliary in vertebrates, this is the shared downstream step through which a
    transport defect becomes a developmental one, and it is the node that links the limb,
    brain and pituitary phenotypes to the same lesion as the liver and kidney phenotypes.

    Where in Hedgehog transduction the failure sits is **contested**, and this entry does not
    settle it. Two studies of the same Ift56hop allele disagree. One reports that Gli still
    accumulates at the ciliary tip on Hedgehog stimulation and that what fails is the
    subsequent dissociation of Gli from Sufu, explicitly distinguishing Ttc26 from other
    IFT-B mutants - cargo arrives and is not released. The other reports that Ift56hop cilia
    are unable to accumulate Gli proteins efficiently, and that core IFT-B proteins
    themselves fail to accumulate - cargo does not arrive. The disagreement is recorded in a
    knowledge gap attached to this node.

    What both agree on, and what the downstream nodes rest on, is that Hedgehog transduction
    fails and that the patterning consequences follow from it.
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction"
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  downstream:
  - target: Failed Intrahepatic Biliary Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Multisystem Ciliopathy Organ Involvement
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      as indicated by dysregulated sonic hedgehog signaling
    explanation: >-
      Documents the Hedgehog signalling abnormality in patient cells, cited by the authors as
      the indicator of impaired ciliary function.
  - reference: PMID:25340710
    reference_title: "A mutation in the mouse ttc26 gene leads to impaired hedgehog signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      hop did not interfere with Hh-induced accumulation of Gli at the tip of the primary
      cilium, but rather with the subsequent dissociation of Gli from its negative
      regulator, Sufu
    explanation: >-
      Localises the signalling failure to the Gli-Sufu dissociation step rather than to
      ciliary delivery, which is what makes this node a specific mechanistic claim rather
      than a restatement that Hedgehog signalling is abnormal.
  - reference: PMID:25340710
    reference_title: "A mutation in the mouse ttc26 gene leads to impaired hedgehog signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unlike the previously characterized mutations that affect IFT complex B, hop did not
      interfere with Hh-induced accumulation of Gli at the tip of the primary cilium
    explanation: >-
      Records that this behaviour distinguishes the Ttc26 lesion from other IFT-B defects.
      Contradicted by PMID:28264835 on the same allele - see the REFUTE item below and the
      attached knowledge gap.
  - reference: PMID:28264835
    reference_title: "IFT56 regulates vertebrate developmental patterning by maintaining IFTB complex integrity and ciliary microtubule architecture."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that Ift56hop cilia are unable to accumulate Gli proteins efficiently,
      resulting in developmental patterning defects in Shh signaling-dependent tissues such
      as the limb and neural tube.
    explanation: >-
      Refutes the claim that Gli accumulation at the ciliary tip is preserved. Same allele as
      the SUPPORT item above, so this is a direct disagreement in the literature rather than
      a difference of model.
  - reference: PMID:28264835
    reference_title: "IFT56 regulates vertebrate developmental patterning by maintaining IFTB complex integrity and ciliary microtubule architecture."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Strikingly, core IFTB proteins are unable to accumulate normally within Ift56hop cilia,
      including IFT88, IFT81 and IFT27, which are crucial for key processes such as tubulin
      transport and Shh signaling.
    explanation: >-
      Supports the upstream claim that the IFT-B complex itself is destabilised, which is the
      mechanism by which this account explains the Hedgehog failure.
- name: Failed Intrahepatic Biliary Development
  description: >
    The hepatic phenotype is developmental rather than degenerative. Ttc26 is strongly
    expressed in the embryonic mouse liver in a pattern consistent with a role in normal
    development of the intrahepatic biliary system, and the human presentation is neonatal -
    the biliary tree is malformed from the outset rather than progressively damaged. This is
    the node that makes the entry's contribution: fibrocystic liver disease was already
    known ciliopathy territory, severe neonatal cholestasis was not.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: intrahepatic bile duct development
    modifier: DECREASED
    term:
      id: GO:0035622
      label: intrahepatic bile duct development
  cell_types:
  - preferred_term: cholangiocyte
    term:
      id: CL:1000488
      label: cholangiocyte
  locations:
  - preferred_term: intrahepatic bile duct
    term:
      id: UBERON:0003704
      label: intrahepatic bile duct
  downstream:
  - target: Cholestasis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      We also demonstrate a strong expression of Ttc26 in the embryonic mouse liver in a
      pattern consistent with its proposed role in the normal development of the
      intrahepatic biliary system.
    explanation: >-
      Supports the developmental reading of the hepatic phenotype. Graded INDIRECT because
      the evidence is an expression pattern in mouse embryo, from which the developmental
      role is inferred rather than demonstrated, and the authors say "consistent with" and
      "proposed" rather than asserting it.
- name: Multisystem Ciliopathy Organ Involvement
  description: >
    Beyond the liver, patients show the renal, brain, skeletal and cardiac involvement that
    defines syndromic ciliopathy, with polydactyly among the skeletal features. A later
    series added pituitary stalk interruption, establishing the pituitary as a further
    ciliary-dependent developmental site in this disorder.
  biological_scale: ORGANISM
  conforms_to: "ciliopathy_dysfunction#Multisystem Pleiotropic Ciliopathy Phenotype"
  downstream:
  - target: Polydactyly
    causal_link_type: DIRECT
  - target: Renal cyst
    causal_link_type: DIRECT
  - target: Interrupted pituitary stalk
    causal_link_type: DIRECT
  - target: Congenital heart defect
    causal_link_type: DIRECT
  - target: Diabetes insipidus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Consequent on the pituitary involvement rather than a separate organ lesion.
  - target: Optic atrophy
    causal_link_type: DIRECT
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:32617964
    reference_title: "Pituitary stalk interruption syndrome broadens the clinical spectrum of the TTC26 ciliopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe biliary ciliopathy, caused by bi-allelic mutations in TTC26, has been recently
      described in the context of a syndrome of polydactyly and severe neonatal cholestasis,
      with brain, kidney and heart involvement.
    explanation: >-
      Enumerates the organ systems this node covers, in a later paper restating the
      established picture.
    quote_role: BACKGROUND
phenotypes:
- category: Hepatic
  name: Cholestasis
  description: >
    Severe neonatal cholestasis is the presenting and defining feature, and is what makes
    this ciliopathy distinctive. It was lethal in one of seven patients and required liver
    transplantation in two more. Seven of seven in the index cohort, with one reported
    exception among the eleven patients counted here - roughly 91%, which is the
    VERY_FREQUENT band. The exception matters for whether biliary disease is *obligate*, not
    for which band applies, and it is cited as REFUTE below for exactly that reason.

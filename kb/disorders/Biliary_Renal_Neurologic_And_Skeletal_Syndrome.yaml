- name: Motile Cilia Beat Dysfunction
  description: >-
    Algal and zebrafish TTC26/DYF13 perturbations impair motility-related cargo and ciliary beating. The direction
    of beat-frequency change depends on the tissue: zebrafish Kupffer vesicle cilia beat more slowly, whereas
    pronephric cilia show faster but poorly coordinated beating. A contribution to human hydrocephalus is plausible
    but unproven; aqueductal obstruction is also documented clinically.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:24596149
    reference_title: TTC26/DYF13 is an intraflagellar transport protein required for transport of motility-related proteins into flagella.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Knockdown of TTC26/DYF13 in zebrafish embryos or mutation of TTC26/DYF13 in C. reinhardtii, produced
      short cilia with abnormal motility.
    explanation: >-
      Motility dysfunction is demonstrated in experimental organisms, not directly measured in BRENS ependymal
      cells.
    quote_role: PRIMARY_RESULT
  - reference: PMID:24596149
    reference_title: TTC26/DYF13 is an intraflagellar transport protein required for transport of motility-related proteins into flagella.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Components of outer dynein arms were present at normal levels in dyf13 mutant flagella
    explanation: >-
      The experimental study found selective defects rather than depletion of every motility structure.
    quote_role: PRIMARY_RESULT
  - reference: PMID:22718903
    reference_title: Knockdown of ttc26 disrupts ciliogenesis of the photoreceptor cells and the pronephros in zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Control cilia bundles beat coordinately, but the cilia beat rate in ttc26 morphants (B and C) is increased
      and out of phase, resulting in loss of coordination.
    explanation: >-
      The pronephric measurements support abnormal coordination, not a uniform reduction in beat rate.
    quote_role: PRIMARY_RESULT

- IFT56-related ciliopathy
- severe biliary ciliopathy
- TTC26-related severe biliary ciliopathy
description: >-
  Biliary, renal, neurologic and skeletal syndrome (BRENS) is an autosomal recessive ciliopathy caused by biallelic
  variants in TTC26, now named IFT56. The protein is a core component of intraflagellar transport complex B.
  Severe neonatal cholestasis was prominent in the defining seven-family cohort, with one death and two liver
  transplants. Renal, cerebral, pituitary, limb and cardiac abnormalities vary between patients; later reports
  include facial clefts and a patient without biliary involvement. Human cellular studies demonstrate altered
  ciliary function, while the steps connecting this defect to each organ manifestation remain incompletely
  resolved.

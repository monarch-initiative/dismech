animal_models:
- name: Ift56hop homozygous mouse
  species: Mouse
  genotype: Ift56hop (Ttc26) homozygous loss-of-function
  publication: PMID:41352382
  description: >-
    The homozygous Ift56hop premature-stop allele produces markedly different phenotypes on BALB/cByJ and C57BL/6J
    backgrounds. Adult survivors with sterility and a hopping gait occur on BALB/cByJ, while C57BL/6J homozygotes
    are perinatally lethal with multiple malformations. A chromosome 4 modifier locus was mapped; the causal
    modifier gene and its relevance to human patients are unresolved.
  modeled_mechanisms:
  - target: TTC26 functional impairment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Models reduced IFT56 function and background-dependent developmental outcomes. These experiments establish
      modifier effects in mice without identifying a human modifier architecture.
    limitations: >-
      Severity and organ involvement depend on allele and strain. The 2014 study found normal kidney and retinal
      histology in examined adult hop mice, whereas human patients can have renal and ocular abnormalities.
      Severe neonatal cholestasis is not established as a recapitulated endpoint in the cited model reports.
      Mouse background effects cannot predict individual human severity.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        Inbred strain backgrounds differ at many loci. Mapping identifies a chromosome 4 modifier interval
        but does not show that this is the sole difference between strains or that the same locus modifies
        human BRENS.
    - divergence_type: OTHER
      materiality: QUALIFYING
      description: >-
        The cited mouse reports do not establish the severe neonatal cholestatic phenotype that is prominent
        in human BRENS.
    evidence:
    - reference: PMID:41352382
      reference_title: "Genetic background influences the extent and severity of cilia-related congenital anomalies in Ift56/Ttc26 mutant mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we demonstrate that in the C57BL/6J background, Ift56hop homozygotes are perinatal
        lethal, and have multiple skeletal and organ defects, including the formation of
        tracheoesophageal fistulas
      explanation: >-
        Documents the severe-background phenotype, against which the viable Balb/cByJ
        phenotype is the contrast that carries the finding.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  evidence:
  - reference: PMID:41352382
    reference_title: "Genetic background influences the extent and severity of cilia-related congenital anomalies in Ift56/Ttc26 mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using Single Nucleotide Polymorphisms (SNPs) that differ between these mouse strains,
      we show that a modifier of the Ift56hop phenotype maps to Chromosome 4.
    explanation: >-
      Maps a modifier locus in mice; it does not identify a human modifier gene or exclude allele-specific
      effects.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Zebrafish ttc26 knockdown and frameshift models
  species: Zebrafish
  publication: PMID:36533556
  description: >-
    Morpholino studies show shortened or disorganized cilia, pronephric dilation and photoreceptor outer-segment
    defects. Later CRISPR experiments confirmed a curved-down-tail phenotype in F1 ttc26 compound-frameshift
    embryos. These perturbations and endpoints differ; a photoreceptor phenotype should not be attributed to
    the later transition-zone screen.
  modeled_mechanisms:
  - target: TTC26 functional impairment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Tests loss of ttc26 function in development.
    limitations: >-
      Morpholinos, mosaic crispants and germline frameshifts have different limitations. No candidate crispants
      formed cysts by five days in the later screen. Neither study establishes neonatal cholestatic liver disease
      or human optic nerve atrophy.
    evidence:
    - reference: PMID:36533556
      reference_title: Variable phenotypes and penetrance between and within different zebrafish ciliary transition zone mutants.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        In the four CDT mutants analyzed, all had compound frameshift mutations
      explanation: >-
        The F1 zebrafish experiments confirmed biallelic frameshift genotypes in embryos with curved-down tails.
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:22718903
    reference_title: Knockdown of ttc26 disrupts ciliogenesis of the photoreceptor cells and the pronephros in zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Morpholino knockdown of ttc26 in zebrafish embryos caused ciliary defects in the pronephric kidney at
      27 h postfertilization and distension/dilation of pronephros at 5 d postfertilization (dpf).
    explanation: >-
      The earlier knockdown study directly documents renal ciliary and morphologic defects.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36533556
    reference_title: Variable phenotypes and penetrance between and within different zebrafish ciliary transition zone mutants.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      In the four CDT mutants analyzed, all had compound frameshift mutations
    explanation: >-
      The F1 zebrafish experiments confirmed biallelic frameshift genotypes in embryos with curved-down tails.
    quote_role: PRIMARY_RESULT
discussions:
- discussion_id: brns_modifier_loci_explain_variability
  kind: HUMAN_MODEL_MISMATCH
  prompt: Do modifier loci alter human BRENS severity as they do in hop mice?
  attaches_to:
  - animal_models#Mouse
  - genetic#TTC26
  rationale: >-
    Strain background substantially changes the mouse phenotype and a modifier interval maps to chromosome
    4. Human cases vary in organ involvement and severity, but current cohorts cannot distinguish allele effects,
    modifiers, ascertainment and treatment. No corresponding human modifier has been demonstrated.
  evidence:
  - reference: PMID:41352382
    reference_title: "Genetic background influences the extent and severity of cilia-related congenital anomalies in Ift56/Ttc26 mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using Single Nucleotide Polymorphisms (SNPs) that differ between these mouse strains,
      we show that a modifier of the Ift56hop phenotype maps to Chromosome 4.
    explanation: >-
      Maps a modifier locus in mice; it does not identify a human modifier gene or exclude allele-specific
      effects.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- discussion_id: brns_gli_accumulation_contested
  kind: KNOWLEDGE_GAP
  prompt: Which conditions determine whether GLI tip accumulation is impaired in TTC26-deficient cilia?
  attaches_to:
  - pathophysiology#Dysregulated Sonic Hedgehog Signalling
  rationale: >-
    Both hop studies support impaired Hedgehog signaling. They differ in GLI accumulation measurements: preserved
    recruitment with reduced GLI-SUFU dissociation in the 2014 assays, versus reduced recruitment in the 2017
    cellular and embryonic-tissue assays. The later authors explicitly propose differences in stimulation amount
    and duration. These data do not justify choosing one universal cellular block for all human alleles.
  evidence:
  - reference: PMID:25340710
    reference_title: A mutation in the mouse ttc26 gene leads to impaired hedgehog signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      hop did not interfere with Hh-induced accumulation of Gli at the tip of the primary cilium, but rather
      with the subsequent dissociation of Gli from its negative regulator, Sufu
    explanation: >-
      This study locates a defect after GLI recruitment under its experimental conditions.
    quote_role: PRIMARY_RESULT
  - reference: PMID:28264835
    reference_title: IFT56 regulates vertebrate developmental patterning by maintaining IFTB complex integrity and ciliary microtubule architecture.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      We show that Ift56hop cilia are unable to accumulate Gli proteins efficiently, resulting in developmental
      patterning defects in Shh signaling-dependent tissues such as the limb and neural tube.
    explanation: >-
      This study also supports impaired signaling, while locating abnormal GLI accumulation under different
      assays.
    quote_role: PRIMARY_RESULT
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5399663/
    reference_title: IFT56 regulates vertebrate developmental patterning by maintaining IFTB complex integrity and ciliary microtubule architecture - PMC
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      One possible explanation for this discrepancy is differences in experimental conditions between the studies,
      including amounts and duration of Hh pathway activation.
    explanation: >-
      The later study itself offers experimental conditions as an explanation; this is an interpretation, not
      a demonstrated reconciliation.
    quote_role: PRIMARY_RESULT
- discussion_id: brns_how_cilia_build_the_biliary_tree
  kind: KNOWLEDGE_GAP
  prompt: How does TTC26 dysfunction cause cholestasis and structural biliary disease?
  attaches_to:
  - pathophysiology#Intrahepatic biliary structural abnormalities
  rationale: >-
    Human duct abnormalities and embryonic mouse liver expression support a biliary role. They do not establish
    a sequence from impaired Hedgehog signaling through failed ductal-plate remodeling to cholestasis. Pituitary
    deficiency can coexist, making an exclusively irreversible structural explanation premature. Tissue-specific
    experiments and clinical endocrine-response data are needed to distinguish contributors.
  evidence:
  - reference: PMID:34177428
    reference_title: Identification of the TTC26 Splice Variant in a Novel Complex Ciliopathy Syndrome with Biliary, Renal, Neurological, and Skeletal Manifestations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Liver biopsy demonstrated zone 3 cholestasis with ductopenia and mild ductular reaction.
    explanation: >-
      Human histology documents ductopenia and cholestasis, without establishing a universal ductal-plate mechanism.
    quote_role: PRIMARY_RESULT
  - reference: PMID:31595528
    reference_title: "Biallelic Mutations in Tetratricopeptide Repeat Domain 26 (Intraflagellar Transport 56) Cause Severe Biliary Ciliopathy in Humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      We also demonstrate a strong expression of Ttc26 in the embryonic mouse liver in a
      pattern consistent with its proposed role in the normal development of the
      intrahepatic biliary system.
    explanation: >-
      Supports the developmental reading of the hepatic phenotype. Graded INDIRECT because
      the evidence is an expression pattern in mouse embryo, from which the developmental
      role is inferred rather than demonstrated, and the authors say "consistent with" and
      "proposed" rather than asserting it.
    quote_role: PRIMARY_RESULT
- discussion_id: brns_prmt7_candidate_mechanism
  kind: EMERGING_HYPOTHESIS
  prompt: Does altered ciliary PRMT7 localization contribute to Hedgehog dysfunction in biallelic TTC26 disease?
  attaches_to:
  - pathophysiology#Dysregulated Sonic Hedgehog Signalling
  rationale: >-
    An adolescent idiopathic scoliosis study identified TTC26-dependent ciliary PRMT7 localization and GLI2
    methylation in nucleus-pulposus cell experiments. Its mouse model combined heterozygous Flnb and Ttc26
    mutations, rather than biallelic TTC26 disease. Artificially targeting PRMT7 to cilia restored cellular
    signaling, and local Ptch1/Sufu knockdown improved tail-disc matrix endpoints. Transfer to BRENS organs
    remains untested; FLNB is not an established BRENS modifier, and these experiments do not establish a clinical
    therapy.
  evidence:
  - reference: PMID:42178579
    reference_title: FLNB and TTC26 regulate ciliary Hedgehog signaling to maintain intervertebral disc matrix homeostasis in adolescent idiopathic scoliosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      We find that TTC26 is required for the localization of protein arginine methyltransferase 7 (PRMT7) to
      the primary cilium, enabling methylation of GLI2, while FLNB binds methylated GLI2 to promote its nuclear
      import.
    explanation: >-
      This cellular mechanism is a candidate for testing in BRENS; the originating study concerns scoliosis.
    quote_role: PRIMARY_RESULT
  - reference: PMID:42178579
    reference_title: FLNB and TTC26 regulate ciliary Hedgehog signaling to maintain intervertebral disc matrix homeostasis in adolescent idiopathic scoliosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      First, we only used the tail disc microinjection model to explore the therapeutic effects of ECM metabolism
      on Hh signaling. However, its effect on scoliosis needs to be further investigated.
    explanation: >-
      Even rescue of scoliosis was untested; these model interventions provide no evidence of clinical benefit
      in BRENS.
    quote_role: PRIMARY_RESULT
mechanistic_hypotheses:
- hypothesis_group_id: MOTILE_CILIA_HYDROCEPHALUS
  hypothesis_label: Ependymal ciliary dysmotility contributes to hydrocephalus
  status: ALTERNATIVE
  description: >-
    Motility abnormalities in experimental TTC26 systems and general ependymal physiology support a possible
    route to human hydrocephalus. Human TTC26 ependymal motility has not been measured, and aqueductal stenosis
    provides another documented contributor.
  evidence:
  - reference: PMID:24596149
    reference_title: TTC26/DYF13 is an intraflagellar transport protein required for transport of motility-related proteins into flagella.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Knockdown of TTC26/DYF13 in zebrafish embryos or mutation of TTC26/DYF13 in C. reinhardtii, produced
      short cilia with abnormal motility.
    explanation: >-
      Motility dysfunction is demonstrated in experimental organisms, not directly measured in BRENS ependymal
      cells.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34177428
    reference_title: "Identification of the TTC26 Splice Variant in a Novel Complex Ciliopathy Syndrome with Biliary, Renal, Neurological, and Skeletal Manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The proper movement of cilia helps in the flow of cerebrospinal fluid, and the
      disruption of proper movement (beating) by irregular planar cell polarity causes the
      accumulation of cerebrospinal fluid resulting in hydrocephalus
    explanation: >-
      States the ependymal-cilia route to hydrocephalus. Graded INDIRECT because the source
      states the general ciliopathy mechanism as background rather than demonstrating it
      for TTC26.
    quote_role: BACKGROUND

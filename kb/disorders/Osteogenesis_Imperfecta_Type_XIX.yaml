prevalence:
- population: Worldwide, published kindreds
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Three unrelated affected kindreds have been reported in the peer-reviewed
    literature: two multigenerational X-linked pedigrees in the founding 2016
    report (PMID:27380894) and one additional male proband carrying a novel
    hemizygous MBTPS2 p.Glu172Asp variant functionally validated in 2023
    (PMID:37305034). No population-based prevalence or birth-incidence rate has
    been established.
  evidence:
  - reference: PMID:27380894
    reference_title: "MBTPS2 mutations cause defective regulated intramembrane proteolysis in X-linked osteogenesis imperfecta."
    supports: SUPPORT

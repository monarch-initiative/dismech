  downstream:
  - target: Recurrent Fractures
    description: >-
      Mechanically weak, poorly crosslinked bone matrix causes prenatal and
      recurrent childhood fractures.
  - target: Reduced Bone Mineral Density
    description: >-
      Reduced osteoblast matrix production and mineralization manifest as
      markedly reduced bone mineral density and generalized osteopenia.
  - target: Short Stature
    description: >-
      Impaired longitudinal bone growth, recurrent fractures, and spinal
      wedging produce moderate-to-severe short stature.
  - target: Bone Deformity
    description: >-
      Mechanical weakness of developing long bones leads to prenatal and
      postnatal bowing and anterior tibial angulation.
  - target: Scoliosis
    description: >-
      Osteopenic vertebral fragility and wedging lead to progressive
      kyphoscoliosis.
  - target: Pectus Deformity
    description: >-
      Generalized thoracic-cage bone dysplasia manifests as pectus carinatum or
      pectus excavatum.
  - target: Blue Sclerae (Age-Dependent / Variable)
    description: >-
      Type I collagen matrix deficiency underlies transient early-childhood blue
      sclerae in young probands.

name: Osteogenesis Imperfecta Type XIX
creation_date: "2026-06-30T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Osteogenesis imperfecta type 19
  term:
    id: MONDO:0049223
    label: osteogenesis imperfecta, type 19
synonyms:
- osteogenesis imperfecta, type 19
- Osteogenesis imperfecta type 19
- OI19
- osteogenesis imperfecta, type XIX, X-linked recessive
- X-linked osteogenesis imperfecta
- MBTPS2-related osteogenesis imperfecta
description: >-
  Osteogenesis imperfecta type XIX (OI type XIX) is the only X-linked recessive
  form of osteogenesis imperfecta, a collagen-related brittle bone dysplasia. It
  is caused by hemizygous hypomorphic missense variants in MBTPS2 (on Xp22),
  which encodes site-2 metalloprotease (S2P), an integral Golgi membrane protease
  that, together with site-1 protease (S1P), performs regulated intramembrane
  proteolysis (RIP) of membrane-bound transcription factors transported from the
  ER under ER-stress or sterol-restriction conditions. S2P substrates include
  OASIS/CREB3L1 (a bZIP transcription factor expressed in osteoblasts that
  activates type I collagen transcription and complexes with SMAD4 to drive
  matrix-gene expression), ATF6 (unfolded protein response) and SREBP (sterol and
  fatty acid metabolism). OI-causing MBTPS2 substitutions occur at conserved
  catalytic or metal-coordinating S2P residues (including p.Arg459Ser/p.Asn459Ser
  at the NPDG motif, p.Leu505Phe, and p.Glu172Asp in the HEXXH catalytic motif);
  the mutant protein is stable but functionally impaired, so RIP
  cleavage/activation of OASIS, ATF6 and SREBP is reduced alongside impaired
  SREBP-regulated fatty acid desaturation. The downstream bone defect combines
  reduced type I collagen secretion and extracellular matrix deposition, a broad
  defect in osteoblast differentiation, and reduced hydroxylation of the helical
  collagen lysine (K87) critical for crosslinking — the latter associated with
  reduced lysyl hydroxylase 1 (PLOD1/LH1) in proband osteoblasts and elevated
  urinary lysyl-/hydroxylysyl-pyridinoline ratio. The net result is mechanically
  weak bone with low bone mineral density and skeletal fragility. Affected males
  present with prenatal and childhood fractures, short stature, long-bone bowing,
  generalized osteopenia, scoliosis/vertebral wedging and pectal deformity, in
  the moderate-to-severe range; obligate-carrier mothers are clinically
  unaffected. OI type XIX is mechanistically continuous with CREB3L1-related OI
  type XVI: MBTPS2 defects impair RIP processing of the same OASIS transcription
  factor whose loss causes the recessive autosomal form, whereas affected
  individuals lack the dermatological features (IFAP/KFSD/Olmsted) of other
  allelic MBTPS2 disorders.
notes: >-
  No MBTPS2-specific GeneReviews or StatPearls chapter exists; PMID:20301472
  ("COL1A1- and COL1A2-Related Osteogenesis Imperfecta") is tagged as the
  closest overview for standard supportive, bisphosphonate, and orthopedic
  management of moderate-to-severe OI, while all genetic, molecular, and
  phenotypic assertions are anchored to molecularly confirmed MBTPS2-OI reports
  (PMID:27380894; PMID:37305034). Allelic X-linked dermatological disorders
  caused by distinct MBTPS2 missense variants — ichthyosis follicularis,
  atrichia, and photophobia (IFAP/BRESHECK), keratosis follicularis spinulosa
  decalvans (KFSD), and X-linked Olmsted syndrome — lack skeletal fragility and
  are outside the scope of this entry.

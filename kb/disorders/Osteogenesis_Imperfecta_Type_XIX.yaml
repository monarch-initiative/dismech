      MBTPS2-OI to infer the pathogenicity of a novel MBTPS2 c.516A>C
      (p.Glu172Asp) variant of unknown significance in a male proband.
    explanation: >-
      Documents a third unrelated affected kindred with a novel hemizygous
      MBTPS2 missense allele in a male proband with prenatal-onset OI.
pathophysiology:
- name: Hypomorphic MBTPS2 Impairs Site-2 Protease (S2P) Regulated Intramembrane Proteolysis
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    MBTPS2 encodes site-2 metalloprotease (S2P), an integral Golgi membrane
    protein that, with site-1 protease (S1P), sequentially cleaves
    membrane-spanning regulatory transcription factors (OASIS/CREB3L1, ATF6,
    SREBP) transported from the ER during ER stress or sterol restriction,
    releasing mature N-terminal fragments that enter the nucleus to activate
    transcription (regulated intramembrane proteolysis, RIP). OI-causing
    hemizygous missense substitutions at highly conserved S2P residues
    (including NPDG-motif substitution, p.Leu505Phe, and p.Glu172Asp in the
    catalytic motif) leave the protein stable and normally expressed but
    functionally impaired, so RIP cleavage/activation of OASIS, ATF6 and SREBP
    is reduced alongside perturbed cellular fatty acid metabolism.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Hemizygous hypomorphic missense variants preserve S2P protein stability
      while impairing regulated intramembrane proteolysis of OASIS, ATF6, and
      SREBP.

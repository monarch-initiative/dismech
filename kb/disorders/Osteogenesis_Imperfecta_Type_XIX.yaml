- name: Blue Sclerae (Age-Dependent / Variable)
  category: Ophthalmologic
  description: >-
    Scleral hue is variable and age-dependent in OI type XIX: the young Thai
    proband had blue sclerae at age 2 years, whereas affected adult males in the
    same and the German pedigree had white sclerae. This age-dependent shift from
    blue to white sclerae contrasts with the persistently blue sclerae typical of
    classic dominant collagen-defect OI and is a useful clinical discriminator.
  phenotype_term:

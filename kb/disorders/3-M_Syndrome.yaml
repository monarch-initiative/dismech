- name: Severe Pre- and Postnatal Growth Restriction
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The organism-level endpoint: growth restriction that begins before birth and
    continues without a catch-up phase, giving a final height about five
    standard deviations below the mean, together with the characteristic facies
    and skeletal findings, and with intelligence spared.
  downstream:
  - target: Severe pre- and postnatal growth deficiency
    description: >-
      The organism-level growth endpoint measured as final height.
  - target: Relative macrocephaly
    description: >-
      Head circumference is spared while body size is not, so the relative
      macrocephaly is a consequence of the body-growth deficit rather than of
      head overgrowth.
  evidence:
  - reference: PMID:20301654
    reference_title: "3-M Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3-M syndrome is characterized by severe pre- and postnatal growth deficiency (final height five standard deviations below the mean)"
    explanation: >-

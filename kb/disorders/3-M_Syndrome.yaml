treatments:
- name: Growth Hormone Therapy
  description: >-
    Referral to a paediatric endocrinologist for consideration of growth hormone
    in prepubertal children. The response is characteristically modest: 3-M is a
    GH-resistant rather than GH-deficient state, so the drug is working against
    a downstream signalling block. Set expectations accordingly rather than
    escalating dose indefinitely.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_mechanisms:
  - target: Disordered GH-IGF Growth Factor Signalling
    description: >-
      Exogenous GH acts on the axis this node describes; the node's signalling
      block is why the response is limited.
  evidence:
  - reference: PMID:20301654
    reference_title: "3-M Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Referral to pediatric endocrinologist for consideration of growth hormone in prepubertal children."
    explanation: >-
      GeneReviews management recommendation.
  - reference: PMID:23018678
    reference_title: "Mutations in CUL7, OBSL1 and CCDC8 in 3-M syndrome lead to disordered growth factor signalling."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "3-M patients typically have a modest response to GH treatment, but the mechanism is unknown."
    explanation: >-
      Documents the limited efficacy that qualifies this treatment - PARTIAL
      because the statement is about a modest rather than an absent response.

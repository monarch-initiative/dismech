animal_models:
- name: Cartilage-specific Cul7 knockout mouse
  species: Mouse
  genotype: Cul7fl/fl;Col2a1-CreERT2
  publication: PMID:38367951
  description: >-
    A conditional, cartilage-restricted Cul7 knockout that survives past birth,
    unlike the constitutive null, and so allows the growth plate to be studied
    directly.
  modeled_mechanisms:
  - target: Growth Plate Chondrocyte Proliferation Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the growth-plate lesion proposed to underlie the human skeletal
      growth failure.
    limitations: >-
      Cartilage-restricted and tamoxifen-induced, so it models the postnatal
      skeletal component only; it cannot speak to the placental/prenatal arm of
      the mechanism, and it addresses CUL7 alone rather than the OBSL1 and
      CCDC8 genotypes.
    readouts:
    - name: Proliferative-zone chondrocyte number
      target: Growth Plate Chondrocyte Proliferation Defect
      direction: DECREASED
      interpretation: >-
        Direct cellular correlate of the proliferation defect this node asserts.
      evidence:
      - reference: PMID:38367951
        reference_title: "Longitudinal skeletal growth and growth plate morphological characteristics of chondro-tissue specific CUL7 knockout mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "decreased number of cells in the proliferation zone"
        explanation: >-
          The measured reduction in proliferative-zone cellularity.
    - name: Limb length
      target: Growth Plate Chondrocyte Proliferation Defect
      direction: DECREASED
      interpretation: >-
        Organ-level consequence of the growth-plate lesion.
      evidence:
      - reference: PMID:38367951
        reference_title: "Longitudinal skeletal growth and growth plate morphological characteristics of chondro-tissue specific CUL7 knockout mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "mice had abnormally short and deformed limbs"
        explanation: >-
          The gross skeletal readout of the model.
    evidence:
    - reference: PMID:38367951
      reference_title: "Longitudinal skeletal growth and growth plate morphological characteristics of chondro-tissue specific CUL7 knockout mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The knockout of Cul7 gene may affect both the proliferation of chondrocytes and the endochondral osteogenesis"
      explanation: >-
        Supports treating this model as informative for the growth-plate node.
- name: Ccdc8 knockout mouse
  species: Mouse
  genotype: Ccdc8 null
  publication: PMID:31343991
  description: >-
    Constitutive Ccdc8 deletion, used to test whether loss of a 3-M gene is
    sufficient to cause intrauterine growth restriction through the placenta.
  modeled_mechanisms:
  - target: Impaired Cell Migration and Placental Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes that deleting a 3-M gene impairs trophoblast migration and
      placental development and produces intrauterine growth restriction.
    limitations: >-
      Perinatally lethal in the mouse, whereas human CCDC8-related 3-M is the
      mildest of the three genotypes and compatible with adult life - so the
      model overstates severity and cannot address postnatal growth.
    readouts:
    - name: Fetal growth
      target: Impaired Cell Migration and Placental Development
      direction: DECREASED
      interpretation: >-
        Intrauterine growth restriction as the in vivo endpoint of placental
        failure.
      evidence:
      - reference: PMID:31343991
        reference_title: "Impaired plasma membrane localization of ubiquitin ligase complex underlies 3-M syndrome development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "resulting in intrauterine growth restriction and perinatal lethality"
        explanation: >-
          The measured growth outcome in the knockout.
    evidence:
    - reference: PMID:31343991
      reference_title: "Impaired plasma membrane localization of ubiquitin ligase complex underlies 3-M syndrome development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Deletion of Ccdc8 in mice impaired trophoblast migration and placental development"
      explanation: >-
        Supports treating this model as informative for the placental node.
- name: Constitutive Cul7 (p185) knockout mouse
  species: Mouse
  genotype: Cul7 (p185) null
  publication: PMID:12904573
  description: >-
    The original Cul7 null, runted and perinatally lethal from respiratory
    distress, with defective trophoblast differentiation and abnormal placental
    vasculature.
  modeled_mechanisms:
  - target: Impaired Cell Migration and Placental Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Converges on the same placental trophoblast defect from a different 3-M
      gene.
    limitations: >-
      Perinatally lethal, so it does not model the viable human disease; the
      reported emphasis is vascular morphogenesis rather than the migration
      defect later shown for the 3-M ligase.
    readouts:
    - name: Placental trophoblast differentiation
      target: Impaired Cell Migration and Placental Development
      direction: ALTERED
      interpretation: >-
        Histological correlate of the placental node.
      evidence:
      - reference: PMID:12904573
        reference_title: "Targeted disruption of p185/Cul7 gene results in abnormal vascular morphogenesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "placentas show defects in the differentiation of the trophoblast lineage with an abnormal vascular structure"
        explanation: >-
          The measured placental phenotype.
    evidence:
    - reference: PMID:12904573
      reference_title: "Targeted disruption of p185/Cul7 gene results in abnormal vascular morphogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "embryos are runted and die immediately after birth because of respiratory distress"
      explanation: >-
        Supports treating this model as informative for prenatal growth failure,
        while its perinatal lethality is the limitation recorded above.

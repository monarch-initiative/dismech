- name: OBSL1 frameshift sheep with brachygnathia, cardiomegaly and renal hypoplasia
  species: Sheep
  background: Australian Poll Merino/Merino flock
  genotype: Homozygous OBSL1 c.1716delC, predicted p.(Val573Trpfs*119)
  publication: PMID:32933480
  description: >-
    A naturally occurring recessive syndrome with an OBSL1 frameshift that segregated in seven affected lambs and
    six obligate carriers. The authors propose an ovine model of 3-M syndrome type 2. Affected lambs are stillborn
    with short stature and skeletal abnormalities, plus cardiac and renal defects that extend beyond the usual human
    phenotype.
  modeled_mechanisms:
  - target: Dysfunction of a 3-M Complex Component
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      A segregating predicted truncating OBSL1 variant provides a naturally occurring genetic counterpart to human
      OBSL1-related disease.
    limitations: >-
      Affected lambs are stillborn, so this is not a viable adult model or a model of postnatal growth. The study
      establishes segregation and predicts protein truncation; it does not measure OBSL1 protein loss, altered complex
      assembly, LL5-beta regulation or growth-factor responses. The severe cardiac and renal phenotype should not
      be transferred to human 3-M syndrome.
    readouts:
    - name: OBSL1 genotype segregation
      target: Dysfunction of a 3-M Complex Component
      direction: ALTERED
      interpretation: All seven affected lambs were homozygous for the deletion; obligate carriers were heterozygous.
      evidence:

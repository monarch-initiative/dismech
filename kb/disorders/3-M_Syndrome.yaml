  - reference: PMID:16142236
    reference_title: "Identification of mutations in CUL7 in 3-M syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we first mapped the underlying gene to chromosome 6p21.1 and then identified 25 distinct mutations in the gene cullin 7 (CUL7)"

  - reference: PMID:20301654
    reference_title: "3-M Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If both parents are known to be heterozygous for a CCDC8, CUL7, or OBSL1 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being a carrier, and a 25% chance of inheriting neither of the familial pathogenic variants."
    explanation: >-
      Defines recurrence risks conditional on both parents being carriers; this does not establish complete penetrance.
    quote_role: REVIEW_SYNTHESIS
genetic:
- name: CUL7
  gene_term:
    preferred_term: CUL7
    term:
      id: hgnc:21024
      label: CUL7
  relationship_type: CAUSATIVE
  subtype: 3M1
  notes: >-
    CUL7 (6p21.1) encodes a large cullin-family scaffold that assembles an SCF-like E3 ubiquitin ligase with Skp1,
    FBXW8 (Fbx29/Fbw8) and ROC1/RBX1. Nonsense, frameshift and canonical splice variants predominate; missense variants
    cluster in the region required to recruit ROC1.
  case_fractions:
  - population: 3-M families with an identified mutation (Hanson et al. cohort)
    case_fraction_percent: 69.0
    notes: Most frequently mutated of the three 3-M genes.
    evidence:
    - reference: PMID:23018678
      reference_title: "Mutations in CUL7, OBSL1 and CCDC8 in 3-M syndrome lead to disordered growth factor signalling."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The prevalence of 3-M mutations was 69% CUL7, 23% OBSL1 and 8% CCDC8."
      explanation: >-
        Gene fraction among molecularly solved families in the Hanson et al. cohort; not a universal population
        proportion.
  evidence:
  - reference: PMID:16142236
    reference_title: "Identification of mutations in CUL7 in 3-M syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies indicated that the 3-M-associated CUL7 nonsense and missense mutations R1445X and H1464P, respectively, render CUL7 deficient in recruiting ROC1."
    explanation: >-
      The discovery study links patient-associated CUL7 variants to impaired ROC1 recruitment in functional assays.

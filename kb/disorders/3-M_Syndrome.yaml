pathophysiology:
- name: Loss of a 3-M Ubiquitin Ligase Complex Component
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Biallelic loss-of-function variants in CUL7, OBSL1 or CCDC8 remove one
    subunit of a single shared E3 ubiquitin ligase. CUL7 is the cullin scaffold,
    assembling an SCF-like complex with Skp1, FBXW8 and ROC1/RBX1; OBSL1 is a
    cytoskeletal adaptor required to maintain CUL7 protein levels; CCDC8 is the
    membrane-anchored partner. Because the three act in one pathway, mutations
    are mutually exclusive and any one of them produces the same disease.
  genes:
  - preferred_term: CUL7
    term:
      id: hgnc:21024
      label: CUL7
  - preferred_term: OBSL1
    term:
      id: hgnc:29092
      label: OBSL1
  - preferred_term: CCDC8
    term:
      id: hgnc:25367
      label: CCDC8
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    modifier: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: Cul7-RING ubiquitin ligase complex
    term:
      id: GO:0031467
      label: Cul7-RING ubiquitin ligase complex
  downstream:
  - target: Failed Membrane Assembly of the 3-M Ligase
  evidence:
  - reference: PMID:16142236
    reference_title: "Identification of mutations in CUL7 in 3-M syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CUL7 assembles an E3 ubiquitin ligase complex containing Skp1, Fbx29 (also called Fbw8) and ROC1 and promotes ubiquitination"
    explanation: >-
      Establishes CUL7 as the scaffold of an SCF-like E3 ligase, the molecular
      function lost in 3M1.
  - reference: PMID:16142236
    reference_title: "Identification of mutations in CUL7 in 3-M syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the 3-M-associated CUL7 nonsense and missense mutations R1445X and H1464P, respectively, render CUL7 deficient in recruiting ROC1"
    explanation: >-
      Shows patient variants act by preventing assembly of a catalytically
      competent ligase, not merely by reducing CUL7 abundance.
  - reference: PMID:19481195
    reference_title: "The primordial growth disorder 3-M syndrome connects ubiquitination to the cytoskeletal adaptor OBSL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "loss of OBSL1 leads to downregulation of CUL7, implying a role for OBSL1 in the maintenance of CUL7 protein levels"
    explanation: >-
      Explains why an OBSL1 null phenocopies a CUL7 null: OBSL1 loss collapses
      CUL7 levels, so both converge on the same ligase.
  - reference: PMID:21737058
    reference_title: "Exome sequencing identifies CCDC8 mutations in 3-M syndrome, suggesting that CCDC8 contributes in a pathway with CUL7 and OBSL1 to control human growth."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "coimmunoprecipitation indicates a physical interaction between CCDC8 and OBSL1 but not CUL7"
    explanation: >-
      Places CCDC8 in the same physical complex via OBSL1, completing the
      three-gene pathway.
- name: Failed Membrane Assembly of the 3-M Ligase
  biological_scale: MOLECULAR
  description: >-
    CCDC8 localizes exclusively to the plasma membrane and is phosphorylated by
    CK2 and GSK3; that phosphorylation nucleates binding first of OBSL1 and then
    of CUL7, assembling the ligase at the membrane. Patient-derived mutations in
    any of the three genes disrupt this membrane localization, and the ligase
    substrate LL5-beta - a plasma-membrane protein that regulates cell migration
    - accumulates instead of being degraded.
  molecular_functions:
  - preferred_term: ubiquitin-protein transferase activity
    term:
      id: GO:0004842
      label: ubiquitin-protein transferase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  cellular_components:
  - preferred_term: plasma membrane
    term:
      id: GO:0005886
      label: plasma membrane
  downstream:
  - target: Impaired Cell Migration and Placental Development
  - target: Disordered GH-IGF Growth Factor Signalling
  evidence:
  - reference: PMID:31343991
    reference_title: "Impaired plasma membrane localization of ubiquitin ligase complex underlies 3-M syndrome development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Phosphorylation of CCDC8 resulted in its binding first with OBSL1, and then CUL7, leading to the membrane assembly of the 3-M E3 ubiquitin ligase complex."
    explanation: >-
      Establishes the ordered, phosphorylation-dependent assembly of the ligase
      at the plasma membrane.
  - reference: PMID:31343991
    reference_title: "Impaired plasma membrane localization of ubiquitin ligase complex underlies 3-M syndrome development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "patient-derived mutations in 3-M genes disrupted membrane localization of the 3-M complex and accumulated LL5"
    explanation: >-
      Shows the disease alleles act by mislocalizing the complex, with failure
      to turn over its substrate as the readout.
- name: Impaired Cell Migration and Placental Development
  biological_scale: TISSUE
  description: >-
    Accumulation of the migration regulator LL5-beta impairs cell migration.
    In mice, deleting Ccdc8 impairs trophoblast migration and placental
    development, producing intrauterine growth restriction - a mechanism that
    explains the prenatal onset of the human growth failure rather than merely
    accompanying it. Cul7-null mice are independently runted with defective
    trophoblast differentiation and abnormal placental vasculature.
  cell_types:
  - preferred_term: trophoblast cell
    term:
      id: CL:0000351
      label: trophoblast cell
  biological_processes:
  - preferred_term: trophoblast cell migration
    term:
      id: GO:0061450
      label: trophoblast cell migration
    modifier: DECREASED
  - preferred_term: placenta development
    term:
      id: GO:0001890
      label: placenta development
    modifier: DECREASED
  downstream:
  - target: Severe Pre- and Postnatal Growth Restriction
  - target: Intrauterine growth restriction
    description: >-
      Placental trophoblast migration failure is the prenatal arm of the
      growth deficit.
  evidence:
  - reference: PMID:31343991
    reference_title: "Impaired plasma membrane localization of ubiquitin ligase complex underlies 3-M syndrome development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Deletion of Ccdc8 in mice impaired trophoblast migration and placental development, resulting in intrauterine growth restriction and perinatal lethality."
    explanation: >-
      Directly links loss of a 3-M gene to trophoblast migration failure and
      intrauterine growth restriction in vivo.
  - reference: PMID:12904573
    reference_title: "Targeted disruption of p185/Cul7 gene results in abnormal vascular morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "placentas show defects in the differentiation of the trophoblast lineage with an abnormal vascular structure"
    explanation: >-
      An independent 3-M gene knockout converges on the same placental
      trophoblast defect.
  - reference: PMID:16142236
    reference_title: "Identification of mutations in CUL7 in 3-M syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that impaired ubiquitination may have a role in the pathogenesis of intrauterine growth retardation in humans."
    explanation: >-
      The original CUL7 paper proposes, but does not demonstrate, the link from
      impaired ubiquitination to human intrauterine growth retardation - hence
      PARTIAL.
- name: Disordered GH-IGF Growth Factor Signalling
  biological_scale: CELLULAR
  description: >-
    3-M children usually have normal peak serum GH and normal or low IGF-1, yet
    respond poorly to growth hormone - the pattern of resistance rather than
    deficiency. Patient fibroblasts dysregulate IGF binding protein generation
    and show gene-specific signalling defects: CUL7-null cells have impaired
    IGF1-driven AKT activation with normal GH responses, CCDC8-null cells the
    converse, and OBSL1-null cells are impaired in both. This is the cellular
    reason growth hormone therapy is only modestly effective.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: insulin-like growth factor receptor signaling pathway
    term:
      id: GO:0048009
      label: insulin-like growth factor receptor signaling pathway
    modifier: DECREASED
  - preferred_term: growth hormone receptor signaling pathway
    term:
      id: GO:0060396
      label: growth hormone receptor signaling pathway
    modifier: DECREASED
  downstream:
  - target: Growth Plate Chondrocyte Proliferation Defect
  evidence:
  - reference: PMID:23018678
    reference_title: "Mutations in CUL7, OBSL1 and CCDC8 in 3-M syndrome lead to disordered growth factor signalling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the CUL7(-/-) cells showed impaired IGF1 signalling, CCDC8(-/-) cells showed impaired GH signalling and the OBSL1(-/-) cells showed impairment in both pathways"
    explanation: >-
      Documents the gene-specific split of the signalling defect across the
      three 3-M genotypes.
  - reference: PMID:23018678
    reference_title: "Mutations in CUL7, OBSL1 and CCDC8 in 3-M syndrome lead to disordered growth factor signalling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dysregulation of the GH-IGF-IGF binding protein axis is a feature of 3-M syndrome."
    explanation: >-
      States the axis-level conclusion this node asserts.
  - reference: PMID:22624670
    reference_title: "Exploring the spectrum of 3-M syndrome, a primordial short stature disorder of disrupted ubiquitination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "serum GH levels are usually normal and IGF-I normal or low, while growth response to rhGH therapy is variable but typically poor. All these features suggest a degree of resistance in the GH-IGF axis"
    explanation: >-
      Gives the clinical endocrine pattern - resistance, not deficiency - that
      this node explains.
  - reference: PMID:22624670
    reference_title: "Exploring the spectrum of 3-M syndrome, a primordial short stature disorder of disrupted ubiquitination."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "CUL7 acts an ubiquitin ligase and is known to interact with p53, cyclin D-1 and the growth factor signalling molecule IRS-1, the link with the latter may contribute to the GH-IGF resistance"
    explanation: >-
      Proposes IRS-1, a shared node of the GH, insulin and IGF-1 pathways, as
      the substrate connecting ligase loss to growth-factor resistance. The
      source states this as a possible contribution, so support is PARTIAL.
- name: Growth Plate Chondrocyte Proliferation Defect

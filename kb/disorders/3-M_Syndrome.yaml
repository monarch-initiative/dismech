name: 3-M Syndrome
creation_date: "2026-08-27T01:40:00Z"
category: Mendelian
synonyms:
- 3M syndrome
- Miller-McKusick-Malvaux syndrome
- Le Merrer syndrome
- gloomy face syndrome
- Yakut short stature syndrome
- dolichospondylic dysplasia
description: >-
  3-M syndrome is an autosomal recessive growth disorder caused by biallelic pathogenic variants in CUL7, OBSL1
  or CCDC8. The encoded proteins participate in the 3-M complex and regulate membrane substrate targeting, microtubule
  behavior and cellular growth-factor responses. Severe prenatal-onset growth restriction persists after birth,
  with characteristic facial features and variable slender long bones and tall vertebral bodies. Intelligence is
  usually normal, although developmental delay and occasional intellectual disability have been reported. Musculoskeletal
  abnormalities, neonatal respiratory distress and male genital or pubertal abnormalities broaden the phenotype
  beyond isolated short stature. The three molecular subtypes overlap clinically; CUL7-related cases tend to be
  shorter than OBSL1-related cases, but the small number of CCDC8 cases limits genotype-phenotype comparisons. Cellular
  and mouse studies identify several candidate mechanisms whose relative contributions to human prenatal and postnatal
  growth remain unresolved.

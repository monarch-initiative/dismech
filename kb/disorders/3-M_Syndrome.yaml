diagnosis:
- name: Molecular genetic testing of CUL7, OBSL1 and CCDC8
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: Biallelic pathogenic variants in CUL7, OBSL1 or CCDC8
  description: >-
    Diagnosis can be established by the characteristic prenatal-onset persistent growth deficiency with clinical
    and radiographic features and/or biallelic pathogenic variants in CUL7, OBSL1 or CCDC8. Molecular testing distinguishes
    overlapping growth disorders and assigns the subtype.
  evidence:
  - reference: PMID:20301654
    reference_title: "3-M Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of 3-M syndrome is established in a proband with prenatal-onset persistent growth deficiency and the characteristic clinical and radiographic features and/or biallelic pathogenic variants in CCDC8, CUL7, or OBSL1 identified by molecular genetic testing."
    explanation: >-
      The GeneReviews diagnostic criterion, naming both the clinical route and the three genes.
- name: Skeletal radiography
  diagnosis_term:
    preferred_term: Skeletal radiography
    term:
      id: NCIT:C128940
      label: Radiographic Examination
  presence: Slender long bones with tall vertebral bodies, on a background of prenatal-onset growth deficiency
  description: >-
    Skeletal radiography can identify slender long bones and tall vertebral bodies with reduced anteroposterior
    dimensions. Expression varies with genotype and age: some findings become more evident during childhood, whereas
    other clinical features become less distinctive. Absence of the classic radiographic pattern should be interpreted
    with the clinical and molecular findings.
  evidence:
  - reference: PMID:11665997
    reference_title: "3-M syndrome: description of six new patients with review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3-M syndrome can be differentiated from other types of dwarfism by clinical criteria and by the demonstration of characteristically slender long bones and foreshortened vertebral bodies."
    explanation: >-
      States the differentiating radiographic findings.
  - reference: PMID:41437277
    reference_title: "3-M syndrome: evolution of the phenotype over time."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our paper highlights how the clinical diagnosis of 3-M is easier in the first months of life, while in older children the phenotype becomes increasingly nuanced."
    explanation: >-
      The age-dependence caveat, which is why molecular testing carries more of the diagnostic weight in an older
      child.
  - reference: PMID:23517720
    reference_title: "3-M syndrome associated with growth hormone deficiency: 18 year follow-up of a patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Then, during childhood tall vertebral bodies, hip dislocation, transverse chest groove, winged scapulae and hyperextensible joints became more evident and the diagnosis of 3-M syndrome was made"
    explanation: >-
      Longitudinal case demonstrates that skeletal findings can emerge or become more evident during childhood.

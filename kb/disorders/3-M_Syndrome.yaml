name: 3-M Syndrome
creation_date: "2026-08-27T01:40:00Z"
category: Mendelian
synonyms:
- 3M syndrome
- Miller-McKusick-Malvaux syndrome
- Le Merrer syndrome
- gloomy face syndrome
- Yakut short stature syndrome
- dolichospondylic dysplasia
description: >-
  3-M syndrome is an autosomal recessive primordial growth disorder caused by
  biallelic loss-of-function variants in any one of three genes - CUL7, OBSL1 or
  CCDC8 - whose products assemble a single plasma-membrane-localized E3
  ubiquitin ligase, the "3-M complex". Growth restriction begins in utero and
  never catches up, giving severe pre- and postnatal growth deficiency with a
  final height around five standard deviations below the mean, a distinctive
  facies (relative macrocephaly, triangular face, midface retrusion, fleshy
  nasal tip, long philtrum, pointed chin) and characteristic slender long bones
  and tall vertebral bodies. What sets 3-M apart from most other microcephalic
  primordial dwarfisms is what is *absent*: intelligence is normal and there is
  no major organ-system involvement beyond the skeleton, so the disorder is
  close to a pure growth phenotype. The three genes are mutated in a mutually
  exclusive manner and produce a clinically near-indistinguishable phenotype,
  with a severity gradient (CUL7 shortest, CCDC8 mildest) rather than
  qualitatively different diseases.
disease_term:
  preferred_term: 3-M syndrome
  term:
    id: MONDO:0007477
    label: 3-M syndrome
parents:
- Autosomal recessive disease
- Primordial dwarfism
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  isds_skeletal_category:
  - classification_value: primordial_dwarfism_and_slender_bones
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 21 "Primordial dwarfism and slender bone
      dysplasias". The nosology splits 3-M by gene into three rows - NOS 21-0010
      "3-M syndrome, CUL7-related" (OMIM 273750), NOS 21-0020 "3-M syndrome,
      OBSL1-related" (612921) and NOS 21-0030 "3-M syndrome, CCDC8-related"
      (614205) - all in this one group. This entry lumps all three, matching how
      the literature treats them: the genes are mutated mutually exclusively,
      act in one pathway, and give a phenotype that differs in severity rather
      than in kind. The three nosology rows are curated here as `has_subtypes`
      so the split remains queryable.

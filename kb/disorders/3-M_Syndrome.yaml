pathophysiology:
- name: Dysfunction of a 3-M Complex Component
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic variants impair CUL7, OBSL1 or CCDC8 function. CUL7 provides the scaffold of a ubiquitin
    ligase; OBSL1 and CCDC8 have adaptor and localization functions. Loss of either adaptor need not abolish the
    purified ligase catalytic activity. The experimental phenotypes below were studied in different cell types and
    genotypes and do not constitute one proven linear pathway.
  genes:
  - preferred_term: CUL7
    term:
      id: hgnc:21024
      label: CUL7
  - preferred_term: OBSL1
    term:
      id: hgnc:29092
      label: OBSL1
  - preferred_term: CCDC8
    term:
      id: hgnc:25367
      label: CCDC8
  role: trigger
  downstream:
  - target: Impaired Membrane Recruitment of the 3-M Complex
    description: Patient-derived variants impair membrane recruitment in cellular assays.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

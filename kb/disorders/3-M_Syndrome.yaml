      reference_title: "Impaired plasma membrane localization of ubiquitin ligase complex underlies 3-M syndrome development."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "patient-derived mutations in 3-M genes disrupted membrane localization of the 3-M complex and accumulated LL5β."
      explanation: >-
        Tested patient-derived variants impair membrane localization and substrate regulation in cellular experiments.
      quote_role: PRIMARY_RESULT
  - target: Reduced Cellular Response to Growth Hormone

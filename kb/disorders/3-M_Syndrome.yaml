histopathology:
- name: Reduced bronchial cartilaginous lamina
  subtype: 3M1
  description: >-
    In one affected 26-week CUL7 fetus, compared with an unaffected fetus, medium and large bronchi had small, insufficiently
    developed cartilaginous laminae. Alveolar tissues showed no obvious abnormality. This observation supports a
    possible airway-development contribution to neonatal respiratory distress without establishing a universal mechanism.
  evidence:
  - reference: PMID:17675530
    reference_title: "Clinical, molecular and histopathological features of short stature syndrome with novel CUL7 mutation in Yakuts: new population isolate in Asia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "the amount of cartilaginous lamina of the medium and large bronchi was small and the cartilaginous lamina insufficiently developed"
    explanation: >-
      Single affected fetal specimen; frequency and causal contribution to liveborn respiratory distress remain
      uncertain.
- name: Abnormal chorionic villi and intervillous spaces
  subtype: 3M1
  description: >-
    The same affected fetal placenta had increased chorionic villi with numerous syncytial knots and constricted
    intervillous lacunae. Trophoblast giant-cell number was normal, contrasting with aspects of the constitutive
    mouse knockout phenotype.
  evidence:
  - reference: PMID:17675530
    reference_title: "Clinical, molecular and histopathological features of short stature syndrome with novel CUL7 mutation in Yakuts: new population isolate in Asia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "a marked increase in the number of chorionic villi with numerous syncytial knots and intervillous lacuna constriction was observed"
    explanation: >-
      Human fetal histology provides a limited clinical counterpart to the mouse placental models.

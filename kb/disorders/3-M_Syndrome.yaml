- name: Impaired Membrane Recruitment of the 3-M Complex
  biological_scale: MOLECULAR
  description: >-
    CCDC8 phosphorylation normally promotes recruitment of OBSL1 and CUL7 to the plasma membrane. Tested patient-derived
    variants disrupt this localization, compromising membrane substrate targeting.
  cellular_components:
  - preferred_term: plasma membrane
    term:
      id: GO:0005886
      label: plasma membrane
  downstream:
  - target: Reduced Cellular Ubiquitination of LL5-beta
    description: >-
      Loss of membrane recruitment is the proposed cellular basis of reduced LL5-beta ubiquitination. OBSL1 and
      CCDC8 are dispensable for catalysis in the purified reaction.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31343991
      reference_title: "Impaired plasma membrane localization of ubiquitin ligase complex underlies 3-M syndrome development."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "CCDC8 promoted the polyubiquitylation of LL5β (Figure 5C), while knockdown of either CUL7 or CCDC8 reduced LL5β poly - ubiquitylation (Figure 5D)."
      explanation: >-
        Cellular overexpression and knockdown assays support altered substrate ubiquitination. The full experiment
        coexpressed FBXW8, CUL7, OBSL1 and CCDC8.
      quote_role: PRIMARY_RESULT
    - reference: PMID:31343991
      reference_title: "Impaired plasma membrane localization of ubiquitin ligase complex underlies 3-M syndrome development."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Dropout of either OBSL1 (lane 6) or CCDC8 (lane 7) did not impair LL5β polyubiquitylation in vitro."

  description: >-
    Cartilage-specific Cul7 knockout mice have abnormally short and deformed
    limbs with thickened growth plates, disorderly chondrocyte columns, fewer
    cells in the proliferative zone and disordered metaphyseal trabecular bone -
    implicating both chondrocyte proliferation and endochondral ossification as
    the proximate tissue mechanism of the skeletal growth failure.

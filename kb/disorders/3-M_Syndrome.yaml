  name: CUL7-mutant patient fibroblasts for ploidy assessment
  publication: PMID:24793695
  description: >-
    Two patient skin fibroblast lines carrying CUL7 variants were compared with normal foreskin and lung fibroblast
    cell lines. Increased ploidy provided a patient-derived correlate of cell-division defects studied separately
    in depleted experimental cell lines.
  modeled_mechanisms:
  - target: Defective Cytokinesis
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Provides the tetraploid-cell proportion readout in patient-derived cultured cells.
    limitations: >-
      Ploidy is an indirect correlate of cell-division failure. The comparator lines differ in tissue source and
      passage, and the reported wild-type CUL7 rescue was performed in CUL7-depleted experimental cells rather than
      these patient fibroblasts.
    readouts:
    - name: Tetraploid-cell proportion
      target: Defective Cytokinesis
      direction: INCREASED
      interpretation: >-
        Cellular measurement under the study conditions; it does not directly establish human growth-plate physiology.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence or incidence estimate has been published. 3-M
    syndrome is known from case series rather than population surveillance;
    ascertainment is clinical and then genotype-confirmed, so published case
    counts are not a rate. Founder alleles enrich the disorder in specific
    populations (Yakut, Maghrebian/Tunisian, Turkish).

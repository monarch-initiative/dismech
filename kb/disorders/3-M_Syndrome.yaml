    preferred_term: CUL7
    term:
      id: hgnc:21024
      label: CUL7
  relationship_type: CAUSATIVE
  subtype: 3M1
  notes: >-
    CUL7 (6p21.1) encodes a large cullin-family scaffold that assembles an
    SCF-like E3 ubiquitin ligase with Skp1, FBXW8 (Fbx29/Fbw8) and ROC1/RBX1.
    Nonsense, frameshift and canonical splice variants predominate; missense
    variants cluster in the region required to recruit ROC1.

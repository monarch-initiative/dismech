      - reference: PMID:24793695
        reference_title: "The 3M complex maintains microtubule and genome integrity."
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: "These two lines of 3M fibroblast cells contained 8.8% and 6.4% of tetraploid cells"
        explanation: >-
          Patient-line ploidy measurement. Control cell lines differed in tissue origin and passage; the result

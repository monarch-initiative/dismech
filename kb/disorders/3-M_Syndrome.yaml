animal_models:
- name: Cartilage-specific Cul7 knockout mouse
  species: Mouse
  genotype: Cul7fl/fl;Col2a1-CreERT2
  publication: PMID:38367951
  description: >-
    A conditional, cartilage-restricted Cul7 knockout that survives past birth, unlike the constitutive null, and
    so allows the growth plate to be studied directly.
  modeled_mechanisms:
  - target: Reduced Growth Plate Proliferative-zone Cellularity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Models reduced proliferative-zone cellularity and abnormal skeletal growth after cartilage-specific Cul7 deletion.
    limitations: >-
      Conditional, tissue-restricted CUL7 knockout, compared with Cul7fl/+;Col2a1-CreERT2 mice. It does not establish
      human growth-plate histology, a direct proliferation-rate defect, or equivalent mechanisms for OBSL1 and CCDC8.
    readouts:
    - name: Proliferative-zone chondrocyte number
      target: Reduced Growth Plate Proliferative-zone Cellularity
      direction: DECREASED
      interpretation: >-
        Histological cell count, rather than a directly assayed proliferation rate.
      evidence:
      - reference: PMID:38367951
        reference_title: "Longitudinal skeletal growth and growth plate morphological characteristics of chondro-tissue specific CUL7 knockout mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "decreased number of cells in the proliferation zone"
        explanation: >-
          The measured reduction in proliferative-zone cellularity.
    - name: Limb length
      target: Reduced Growth Plate Proliferative-zone Cellularity
      direction: DECREASED
      interpretation: >-

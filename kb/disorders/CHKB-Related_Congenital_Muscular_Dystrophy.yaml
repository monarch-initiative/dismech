      direction: DECREASED
      interpretation: Impaired oxidative phosphorylation in rmd muscle mitochondria.
      evidence:
      - reference: PMID:21750112
        reference_title: Muscle choline kinase beta defect causes mitochondrial dysfunction and increased mitophagy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Muscle mitochondria in rmd mice exhibited significantly decreased PC levels, impaired respiratory chain enzyme activities, decreased mitochondrial ATP synthesis, decreased coenzyme Q and increased superoxide production."
        explanation: Reports the mitochondrial bioenergetic deficits in the model.
  - target: Megaconial Mitochondrial Redistribution
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: rmd muscle reproduces central mitochondrial depletion with enlarged peripheral mitochondria.
    readouts:
    - name: Mitochondrial distribution in muscle fibers
      target: Megaconial Mitochondrial Redistribution
      direction: ALTERED
      interpretation: Central depletion with peripheral enlargement, as in human biopsy.
      evidence:
      - reference: PMID:21750112
        reference_title: Muscle choline kinase beta defect causes mitochondrial dysfunction and increased mitophagy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "No mitochondria were found in the center of muscle fibers, while those located at the periphery of the fibers were significantly enlarged."
        explanation: Reproduces the megaconial distribution in the model.
  evidence:
  - reference: PMID:21750112
    reference_title: Muscle choline kinase beta defect causes mitochondrial dysfunction and increased mitophagy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of choline kinase activity in muscle causes rostrocaudal muscular dystrophy (rmd) in mouse and congenital muscular dystrophy in human"
    explanation: Establishes the rmd mouse as the model of CHKB deficiency.

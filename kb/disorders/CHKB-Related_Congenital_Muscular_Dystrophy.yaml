    reference_title: A new congenital muscular dystrophy with mitochondrial structural abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "1 patient died from dilated cardiomyopathy at the age of 13 years"
    explanation: Dilated cardiomyopathy is a recognised, potentially fatal complication.
treatments:
- name: Supportive care
  description: >-
    No disease-modifying therapy exists; management is supportive, including
    physiotherapy, orthopaedic care, and cardiac surveillance for dilated
    cardiomyopathy.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Myofiber Degeneration
    treatment_effect: INHIBITS
    description: Supportive measures mitigate the functional consequences of progressive muscle degeneration.

  species: Mouse
  genotype: Chkb-null (rostrocaudal muscular dystrophy, rmd)
  publication: PMID:21750112
  description: >-
    The rmd mouse carries a Chkb deletion and recapitulates the skeletal-muscle
    mitochondrial pathology of human CHKB deficiency.
  modeled_mechanisms:
  - target: Mitochondrial Membrane Dysfunction
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR

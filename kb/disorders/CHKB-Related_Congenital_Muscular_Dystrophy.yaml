name: CHKB-Related Congenital Muscular Dystrophy
creation_date: "2026-10-29T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: megaconial congenital muscular dystrophy
  term:
    id: MONDO:0011246
    label: megaconial type congenital muscular dystrophy
synonyms:
- megaconial congenital muscular dystrophy
- congenital muscular dystrophy, megaconial type
- CHKB-related muscular dystrophy
- congenital muscular dystrophy due to phosphatidylcholine biosynthesis defect
notes: >-
  Disease_term is MONDO:0011246 (megaconial type congenital muscular dystrophy,
  OMIM:602541), the canonical CHKB congenital disease with the megaconial muscle
  biopsy and intellectual disability. MONDO:0010923 "proximal myopathy with focal
  depletion of mitochondria" (OMIM:600706) is the milder, adult-onset,
  cognitively normal allelic form of the same CHKB spectrum (Brady et al. 2016,
  PMID:26782016); it is recorded as a relatedMatch rather than this entry's
  primary term. The curation claim issue was keyed on MONDO:0010923, but binding
  that term under a "congenital" name would be a self-consistent-but-wrong
  binding, so the canonical congenital term is used here.
mappings:
  mondo_mappings:
  - mapping_predicate: skos:relatedMatch
    term:
      id: MONDO:0010923
      label: proximal myopathy with focal depletion of mitochondria
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Caused by biallelic (homozygous or compound heterozygous) loss-of-function
    variants in CHKB.
  evidence:
  - reference: PMID:21665002
    reference_title: A congenital muscular dystrophy with mitochondrial structural abnormalities caused by defective de novo phosphatidylcholine biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have identified homozygous or compound heterozygous mutations in the gene encoding choline kinase beta (CHKB)"
    explanation: Establishes biallelic CHKB variants as the cause.
genetic:
- name: CHKB
  gene_term:
    preferred_term: CHKB
    term:
      id: hgnc:1938
      label: CHKB
  relationship_type: CAUSATIVE
  notes: >-
    Choline kinase beta, which catalyses the first committed step of de novo
    phosphatidylcholine synthesis (the Kennedy / CDP-choline pathway).
  evidence:
  - reference: PMID:21665002
    reference_title: A congenital muscular dystrophy with mitochondrial structural abnormalities caused by defective de novo phosphatidylcholine biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have identified homozygous or compound heterozygous mutations in the gene encoding choline kinase beta (CHKB)"
    explanation: Identifies CHKB as the causative gene.
pathophysiology:
- name: CHKB Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in CHKB leave muscle with absent or
    near-absent choline kinase beta activity, the enzyme that phosphorylates
    choline to phosphocholine.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: CHKB
    term:
      id: hgnc:1938
      label: CHKB
  molecular_functions:
  - preferred_term: choline kinase activity
    modifier: DECREASED
    term:
      id: GO:0004103
      label: choline kinase activity
  downstream:
  - target: Impaired CDP-Choline Pathway Flux
    description: Loss of choline kinase activity blocks the first committed step of phosphatidylcholine synthesis.
  evidence:
  - reference: PMID:21665002
    reference_title: A congenital muscular dystrophy with mitochondrial structural abnormalities caused by defective de novo phosphatidylcholine biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In muscle of three affected individuals with nonsense mutations, choline kinase activities were undetectable, and phosphatidylcholine levels were decreased."
    explanation: Reports absent choline kinase activity in patient muscle.
- name: Impaired CDP-Choline Pathway Flux
  biological_scale: MOLECULAR
  description: >-
    With choline kinase inactive, choline is not converted to phosphocholine, so
    choline accumulates and phosphocholine falls, stalling the Kennedy pathway at
    its first committed step.
  biological_processes:
  - preferred_term: CDP-choline pathway
    modifier: DECREASED
    term:
      id: GO:0006657
      label: CDP-choline pathway
  downstream:
  - target: Phosphatidylcholine Deficiency
    description: Reduced pathway flux lowers de novo phosphatidylcholine production.
  evidence:
  - reference: PMID:19236939
    reference_title: Understanding the muscular dystrophy caused by deletion of choline kinase beta in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "accumulation of choline and decreased amount of phosphocholine"
    explanation: The CHKB-mutant mouse shows the expected substrate accumulation and product loss.
- name: Phosphatidylcholine Deficiency
  biological_scale: MOLECULAR
  description: >-
    Reduced de novo synthesis lowers phosphatidylcholine, the major membrane
    phospholipid, in muscle and especially in mitochondrial membranes.
  biological_processes:
  - preferred_term: phosphatidylcholine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006656
      label: phosphatidylcholine biosynthetic process
  downstream:
  - target: Mitochondrial Membrane Dysfunction
    description: Phosphatidylcholine-poor mitochondrial membranes become functionally and structurally abnormal.
  evidence:
  - reference: PMID:21665002
    reference_title: A congenital muscular dystrophy with mitochondrial structural abnormalities caused by defective de novo phosphatidylcholine biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In muscle of three affected individuals with nonsense mutations, choline kinase activities were undetectable, and phosphatidylcholine levels were decreased."
    explanation: Reports decreased phosphatidylcholine in patient muscle.
- name: Mitochondrial Membrane Dysfunction
  biological_scale: CELLULAR
  description: >-
    Phosphatidylcholine-depleted mitochondrial membranes show impaired
    respiratory-chain activity, decreased ATP synthesis, reduced coenzyme Q and
    increased superoxide production.
  cell_types:
  - preferred_term: skeletal muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  downstream:
  - target: Impaired Mitochondrial Fission
    description: Abnormal membranes accompany dysregulated mitochondrial dynamics.
  - target: Dilated cardiomyopathy
    description: Bioenergetic failure in cardiac muscle contributes to dilated cardiomyopathy.
  evidence:
  - reference: PMID:21750112
    reference_title: Muscle choline kinase beta defect causes mitochondrial dysfunction and increased mitophagy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Muscle mitochondria in rmd mice exhibited significantly decreased PC levels, impaired respiratory chain enzyme activities, decreased mitochondrial ATP synthesis, decreased coenzyme Q and increased superoxide production."
    explanation: The CHKB-mutant mouse shows the mitochondrial bioenergetic failure of this node.
- name: Impaired Mitochondrial Fission
  biological_scale: CELLULAR
  description: >-
    Expression of the mitochondrial fission proteins DRP1, MFF and FIS1 is
    reduced, shifting the fission/fusion balance toward unopposed fusion and
    producing abnormally enlarged mitochondria.
  cell_types:
  - preferred_term: skeletal muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  biological_processes:
  - preferred_term: mitochondrial fission
    modifier: DECREASED
    term:
      id: GO:0000266
      label: mitochondrial fission
  downstream:
  - target: Megaconial Mitochondrial Redistribution
    description: Reduced fission yields the enlarged peripheral mitochondria characteristic of the disease.
  evidence:
  - reference: PMID:34518586
    reference_title: Reduced mitochondrial fission and impaired energy metabolism in human primary skeletal muscle cells of Megaconial Congenital Muscular Dystrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The expression levels of mitochondrial fission proteins (DRP1, MFF, FIS1) were found to be decreased significantly"
    explanation: Patient-derived primary muscle cells show reduced fission-protein expression.
- name: Megaconial Mitochondrial Redistribution
  biological_scale: CELLULAR
  description: >-
    Mitochondria become markedly enlarged ("megaconial") and crowd the periphery
    of the muscle fibre while the fibre centre is depleted of mitochondria, the
    pathognomonic biopsy finding.
  cell_types:
  - preferred_term: skeletal muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  downstream:
  - target: Myofiber Degeneration
    description: The mitochondria-depleted fibre centre is where myofibrillar degeneration occurs.
  evidence:
  - reference: PMID:9427222
    reference_title: A new congenital muscular dystrophy with mitochondrial structural abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondria at the periphery of fibers were markedly enlarged"
    explanation: Describes the enlarged peripheral mitochondria of the megaconial pattern.
  - reference: PMID:9427222
    reference_title: A new congenital muscular dystrophy with mitochondrial structural abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most striking finding was mitochondrial depletion in the center of the sarcoplasm"
    explanation: Describes the central mitochondrial depletion of the megaconial pattern.
- name: Myofiber Degeneration
  biological_scale: TISSUE
  description: >-
    Dystrophic muscle shows necrosis and regeneration, with myofibrillar
    degeneration concentrated in the mitochondria-depleted centre of the fibre,
    driving progressive muscle weakness.
  cell_types:
  - preferred_term: skeletal muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  downstream:
  - target: Muscle weakness
    description: Loss of functional muscle fibres produces weakness.
  - target: Hypotonia
    description: Early muscle involvement presents as infantile hypotonia.
  evidence:
  - reference: PMID:9427222
    reference_title: A new congenital muscular dystrophy with mitochondrial structural abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "myofibrillar degeneration occurred"
    explanation: Reports the myofibrillar degeneration in the fibre centre.

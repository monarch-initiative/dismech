histopathology:
- name: Megaconial mitochondrial pattern
  description: >-
    The pathognomonic muscle-biopsy finding: markedly enlarged ("megaconial")
    mitochondria crowding the periphery of the fibre with depletion of
    mitochondria from the fibre centre, on a background of dystrophic change with
    necrosis and regeneration. No NCIT morphologic-finding or HP term specific to
    the megaconial pattern is available, so finding_term is left unbound.
  diagnostic: true
  evidence:
  - reference: PMID:9427222
    reference_title: A new congenital muscular dystrophy with mitochondrial structural abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondria at the periphery of fibers were markedly enlarged"
    explanation: Describes the enlarged peripheral mitochondria of the megaconial pattern.

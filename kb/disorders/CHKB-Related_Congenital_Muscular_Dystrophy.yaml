- category: Neurological
  name: Intellectual disability
  description: >-
    Intellectual disability is a core feature of the congenital form; the
    mechanism by which CHKB deficiency affects the brain is not established, so
    this phenotype is not wired to a specific pathophysiology node.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:9427222
    reference_title: A new congenital muscular dystrophy with mitochondrial structural abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had the clinical characteristics of merosin-positive congenital muscular dystrophy, but had marked mental retardation"
    explanation: Intellectual disability accompanies the muscular dystrophy in the congenital form.
- category: Cardiovascular
  name: Dilated cardiomyopathy
  phenotype_term:

treatments:
- name: Supportive care
  description: >-
    No disease-modifying therapy exists; management is supportive and
    multidisciplinary, including physiotherapy, orthopaedic care, speech and
    language therapy, and developmental support.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37011121
    reference_title: CHKB-Related Muscular Dystrophy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Supportive care to improve quality of life, maximize function, and reduce complications typically involves multidisciplinary care by specialists in pediatric neurology, orthopedics, physical therapy, occupational therapy, developmental pediatrics, mental health, speech-language pathology, cardiology, dermatology, and clinical genetics."
    explanation: GeneReviews describes the multidisciplinary supportive-care model for CHKB-MD.
- name: Cardiac surveillance
  description: >-
    Because dilated cardiomyopathy is common and can be fatal, periodic cardiac
    evaluation (echocardiography and ECG) is recommended so heart failure can be
    managed and transplantation considered where needed. No NCIT clinical-action
    term for cardiac surveillance is reachable from the TreatmentActionTerm root
    (NCIT:C25218), so treatment_term is left unbound.
  target_phenotypes:
  - preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
  evidence:
  - reference: PMID:37011121
    reference_title: CHKB-Related Muscular Dystrophy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Dilated cardiomyopathy, seen in 14 children, resulted in death from heart failure in five and cardiac transplantation in one."
    explanation: Establishes the cardiac risk that motivates ongoing surveillance.
- name: Avoidance of strenuous exercise and viral infection
  description: >-
    Strenuous exercise and intercurrent viral infections can exacerbate muscle
    weakness and should be avoided.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:37011121
    reference_title: CHKB-Related Muscular Dystrophy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Avoid strenuous exercise and viral infections, which may exacerbate muscle weakness."
    explanation: GeneReviews lists these as circumstances to avoid.
has_subtypes:
- name: Adult-onset LGMD form
  display_name: Proximal myopathy with focal depletion of mitochondria (adult-onset, cognitively normal)
  subtype_term:
    preferred_term: proximal myopathy with focal depletion of mitochondria
    term:
      id: MONDO:0010923
      label: proximal myopathy with focal depletion of mitochondria
  description: >-
    The milder allelic pole of the CHKB spectrum: adult-onset, non-progressive
    proximal muscle weakness with a susceptibility to rhabdomyolysis and normal
    cognition, sharing the same megaconial muscle-biopsy pattern. Caused by
    biallelic CHKB variants, as in the congenital form.
  genes:
  - preferred_term: CHKB
    term:
      id: hgnc:1938
      label: CHKB
  evidence:
  - reference: PMID:26782016
    reference_title: Proximal myopathy with focal depletion of mitochondria and megaconial congenital muscular dystrophy are allelic conditions caused by mutations in CHKB.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These siblings, aged 37 and 40, are cognitively normal with mild non-progressive muscle weakness and a susceptibility to rhabdomyolysis."
    explanation: Describes the milder, adult-onset, cognitively normal allelic form.
  - reference: PMID:26782016
    reference_title: Proximal myopathy with focal depletion of mitochondria and megaconial congenital muscular dystrophy are allelic conditions caused by mutations in CHKB.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the phenotypic spectrum of CHKB mutations ranges from a congenital muscular dystrophy with intellectual disability to a later-onset non-progressive muscular weakness with normal cognition"
    explanation: Establishes the two forms as a single allelic CHKB spectrum.

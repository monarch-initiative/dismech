- name: Col6a2-null mouse
  species: Mus musculus
  genotype: Col6a2 homozygous deletion; Ltbp4 p.Cys1260Ser cross used for intervention
  description: >-
    The model develops weakness before overt fibrosis and abnormal matrix mechanics, with increased resting
    but disturbed post-injury TGF-beta activity. Disease was milder than human COL6 dystrophy and did not clearly
    progress through 60 weeks. An Ltbp4 binding-defective cross did not rescue strength, histology or physiology;
    no clinical treatment effect follows from this pathway finding.
  modeled_mechanisms:
  - target: Dysregulated extracellular TGF-beta bioavailability
    relationship: PARTIALLY_RECAPITULATES
    model_scale: TISSUE
    limitations: >-
      Experimental model findings do not establish their prevalence or treatment effect in human Bethlem myopathy.
    evidence:
    - reference: PMID:40309777
      reference_title: Collagen type VI regulates TGF-β bioavailability in skeletal muscle in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Together, these findings suggest that absence of collagen VI from the muscle ECM increases active TGF-β
        without an increase in total TGF-β transcription or translation.
      explanation: >-
        Col6a2-null mouse tissue and fibroblast assays; altered activation rather than increased overall production.
  - target: Endomysial fibrosis
    relationship: PARTIALLY_RECAPITULATES
    model_scale: TISSUE
    limitations: >-

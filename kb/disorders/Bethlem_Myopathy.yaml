- name: Tendon and periarticular connective tissue involvement
  biological_scale: TISSUE
  description: >
    Collagen VI is expressed pericellularly around tendon fibroblasts, and its
    deficiency produces a tendinopathy that contributes both to the small-joint
    laxity seen in young children and to the later contractures. The resulting
    distal contracture pattern, involving the long finger flexors, elbows, and
    Achilles tendons, is the clinical signature that distinguishes Bethlem
    myopathy from a limb-girdle pattern of weakness. On dorsiflexion of the
    wrist, contracture of the long finger flexors prevents complete finger
    extension, the Bethlem sign.
  cell_types:

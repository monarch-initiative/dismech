- name: Restrictive respiratory involvement
  biological_scale: ORGANISM
  description: >-
    Respiratory muscle weakness can reduce vital capacity and cause nocturnal hypoventilation even while patients
    remain ambulant. Severity is variable: 13 of 22 tested Bethlem patients in one cohort had FVC below 80%
    predicted, and two began noninvasive ventilation at ages 24 and 49. These clinic-based observations do
    not establish a population prevalence.

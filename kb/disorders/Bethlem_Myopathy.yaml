  description: >
    Surveillance for Bethlem muscular dystrophy comprises annual pulmonary
    function tests in the upright and supine positions with polysomnography for
    nocturnal hypoventilation, annual clinical and radiographic assessment of
    scoliosis, annual cardiac evaluation with echocardiogram and EKG, and annual
    physical and occupational therapy assessment.

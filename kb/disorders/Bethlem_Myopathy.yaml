name: Bethlem myopathy
category: Mendelian
creation_date: "2026-07-31T00:00:00Z"
synonyms:
- Bethlem myopathy 1
- BTHLM1
- Bethlem muscular dystrophy
- Benign autosomal dominant myopathy
description: >
  Bethlem myopathy is the mild end of the collagen VI-related dystrophy
  (COL6-RD) spectrum, whose severe end is Ullrich congenital muscular dystrophy.
  It is caused by pathogenic variants in COL6A1, COL6A2, or COL6A3 and is
  usually autosomal dominant, although recessive forms are described. Defective
  assembly and secretion of the collagen VI microfibrillar network in the
  endomysial extracellular matrix impairs matrix-to-sarcolemma anchoring of the
  myofibre and leaves muscle mitochondria vulnerable to inappropriate
  permeability-transition-pore opening, with defective autophagic clearance of
  damaged organelles and increased myofibre apoptosis. The signature clinical
  combination is slowly progressive proximal weakness together with striking
  distal joint contractures of the long finger flexors, elbows, and Achilles
  tendons, accompanied by connective-tissue skin findings such as follicular
  hyperkeratosis (keratosis pilaris) and abnormal keloid or atrophic scarring.

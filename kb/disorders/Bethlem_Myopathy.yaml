progression:
- phase: Early childhood onset
  age_range: Birth to 2 years
  notes: >
    Nearly all affected children show weakness or contractures within the first
    two years of life, sometimes preceded by diminished fetal movements and
    neonatal hypotonia; early congenital contractures are dynamic and often
    remit during childhood.
  evidence:
  - reference: PMID:10219778
    reference_title: "Bethlem myopathy: a slowly progressive congenital muscular dystrophy with contractures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our analysis shows that nearly all children exhibit weakness or contractures during the first 2 years of life."
    explanation: Natural-history data in seven kindreds establish onset within the first two years.
  - reference: PMID:10219778
    reference_title: "Bethlem myopathy: a slowly progressive congenital muscular dystrophy with contractures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early features include diminished foetal movements, neonatal hypotonia and congenital contractures which are of a dynamic nature during childhood."
    explanation: The same cohort documents the early prenatal and neonatal features.
- phase: Contracture development in later childhood and adolescence
  age_range: Late first decade to teenage years
  notes: >
    Achilles tendon and elbow contractures typically emerge late in the first
    decade and during the teenage years and then extend to the long finger
    flexors and shoulders, sometimes producing spinal rigidity.
  evidence:
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In Bethlem myopathy, typical contractures of the Achilles tendons (Figure 1d) and elbows tend to develop late in the first decade of life and during teenage years."
    explanation: The review dates the onset of the characteristic Bethlem contractures.
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These contractures progress to involve the long finger flexors and the shoulders; they can also affect the spine and cause a degree of spinal rigidity in some patients."
    explanation: The review describes progression of contractures to the long finger flexors, shoulders, and spine.
- phase: Slow adult progression with late mobility loss
  age_range: Fourth decade onward
  notes: >
    Weakness progresses slowly; more than two thirds of individuals older than
    50 years remain ambulatory indoors but rely on supportive means outdoors,
    and a substantial proportion use a wheelchair.
  evidence:
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The progression of weakness is slow, and more than two thirds of affected individuals older than age 50 years remain independently ambulatory indoors, while relying on supportive means for mobility outdoors."
    explanation: GeneReviews describes the slow adult course and late mobility limitation.
  - reference: PMID:10219778
    reference_title: "Bethlem myopathy: a slowly progressive congenital muscular dystrophy with contractures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to slow but ongoing progression, more than two-thirds of patients over 50 years of age use a wheelchair."
    explanation: The natural-history cohort quantifies wheelchair use after age 50.
  - reference: PMID:37569848
    reference_title: "New Clinical and Immunofluoresence Data of Collagen VI-Related Myopathy: A Single Center Cohort of 69 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our BM group, only one third had a knee extension strength greater than 50% of the predicted value, while only one in ten showed similar retention of elbow flexion."
    explanation: >
      A contemporary 33-patient Bethlem cohort quantifies how much strength is
      actually lost, showing that mild does not mean trivial.

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with Bethlem myopathy have an increased risk of restrictive lung disease, with the possibility
      of resulting respiratory insufficiency, particularly if this impairment occurs in combination with other
      causes of obstructive sleep apnea.
    explanation: Documents the increased but variable restrictive respiratory risk in Bethlem myopathy.
    quote_role: REVIEW_SYNTHESIS

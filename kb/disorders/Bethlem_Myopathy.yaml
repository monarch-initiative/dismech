- name: Defective autophagic clearance of damaged organelles
  biological_scale: CELLULAR
  description: >
    Skeletal muscle lacking collagen VI has impaired autophagic flux, with
    reduced induction of beclin-1 and Bnip3 and failure to form autophagosomes
    after starvation, so abnormal organelles persist. Muscle biopsies from
    patients with Bethlem myopathy and Ullrich congenital muscular dystrophy show
    the same reduction of beclin-1 and Bnip3 protein, and forced activation of
    autophagy rescues myofibre survival in the mouse model.
  conforms_to: "disabled_macroautophagy#Failure of Cytoplasmic Quality Control"

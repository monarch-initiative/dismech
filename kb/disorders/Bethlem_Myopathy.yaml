- name: Col6a1-null cyclophilin-D-deficient mouse
  species: Mus musculus
  genotype: Col6a1 knockout with Ppif/Cyp-D ablation
  description: >-
    Removing cyclophilin D genetically rescues mitochondrial, ultrastructural and apoptotic abnormalities in
    the null model, supporting a permeability-transition mechanism. It does not establish long-term clinical
    efficacy or immunosuppressant safety in Bethlem disease.
  modeled_mechanisms:
  - target: Myofibre mitochondrial dysfunction and permeability transition pore dysregulation
    relationship: PERTURBS
    model_scale: CELLULAR
    limitations: >-
      Experimental model findings do not establish their prevalence or treatment effect in human Bethlem myopathy.
    evidence:
    - reference: PMID:19293339
      reference_title: Genetic ablation of cyclophilin D rescues mitochondrial defects and prevents muscle apoptosis in collagen VI myopathic mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        In the absence of Cyp-D, Col6a1(-/-) mice show negligible myofiber degeneration, rescue from mitochondrial
        dysfunction and ultrastructural defects, and normalized incidence of apoptosis.
      explanation: >-
        Genetic rescue in double-mutant mice; not a patient therapy trial.

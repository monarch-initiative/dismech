animal_models:
- name: Col6a1-null mouse
  species: Mus musculus
  genotype: Col6a1 homozygous knockout
  description: >-
    This mild myopathic model supports mitochondrial, apoptotic and autophagy mechanisms, but a complete chain
    null differs from most dominant Bethlem alleles. Its skin is mechanically weaker with altered wound ultrastructure,
    yet pathological keloid-like scarring and overt wound-healing disturbance were not reproduced.
  modeled_mechanisms:
  - target: Myofibre mitochondrial dysfunction and permeability transition pore dysregulation
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: >-
      Experimental model findings do not establish their prevalence or treatment effect in human Bethlem myopathy.
    evidence:
    - reference: PMID:14625552
      reference_title: Mitochondrial dysfunction and apoptosis in myopathic mice with collagen VI deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Here we show that Col6a1-/- muscles have a loss of contractile strength associated with ultrastructural
        alterations of sarcoplasmic reticulum (SR) and mitochondria and spontaneous apoptosis.
      explanation: >-
        Primary knockout-mouse muscle findings.
  - target: Defective autophagic clearance of damaged organelles
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: >-
      Experimental model findings do not establish their prevalence or treatment effect in human Bethlem myopathy.
    evidence:
    - reference: PMID:21037586
      reference_title: Autophagy is defective in collagen VI muscular dystrophies, and its reactivation rescues myofiber degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Skeletal muscles of collagen VI-knockout (Col6a1(-/-)) mice had impaired autophagic flux, which matched the lower induction of beclin-1 and BCL-2/adenovirus E1B-interacting protein-3 (Bnip3) and the lack of autophagosomes after starvation."
      explanation: Demonstrates the autophagy machinery defect in collagen VI-deficient muscle.
  - target: Dermal extracellular matrix dysfunction
    relationship: PARTIALLY_RECAPITULATES
    model_scale: TISSUE
    limitations: >-
      Experimental model findings do not establish their prevalence or treatment effect in human Bethlem myopathy.
    evidence:
    - reference: PMID:25158062
      reference_title: 'Col6a1 null mice as a model to study skin phenotypes in patients with collagen VI related myopathies: expression of classical and novel collagen VI variants during wound healing.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Interestingly, we detected a decreased tensile strength of the skin and an altered collagen fibril
        and basement membrane architecture in Col6a1 null mice, the latter being features that are also found
        in collagen VI myopathy patients.
      explanation: >-
        Direct mechanical and morphological mouse skin findings.
  - target: Abnormal cutaneous scarring
    relationship: FAILS_TO_RECAPITULATE
    model_scale: TISSUE
    limitations: >-
      The reported mouse wounds did not develop the pathological scarring characteristic of some patients.
    evidence:
    - reference: PMID:25158062
      reference_title: 'Col6a1 null mice as a model to study skin phenotypes in patients with collagen VI related myopathies: expression of classical and novel collagen VI variants during wound healing.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        However, in contrast to the hypertrophic scars or keloids occurring in patients with a collagen VI
        myopathies, we did not observe such disturbed wound healing in the Col6a1 null mice.
      explanation: >-
        Explicit model failure to reproduce pathological human scarring.

biochemical:
- name: Mildly elevated serum creatine kinase
  presence: Elevated
  context: Skeletal muscle injury marker
  notes: >
    Creatine kinase elevation in Bethlem myopathy is characteristically mild,
    unlike the marked elevations seen in the severe dystrophinopathies.
  evidence:
  - reference: PMID:24339618
    reference_title: "Bethlem myopathy: An autosomal dominant myopathy with flexion contractures, keloids, and follicular hyperkeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Creatinine kinase was mildly elevated"
    explanation: A Bethlem family series documents mild creatine kinase elevation.
- name: Reduced beclin-1 and Bnip3 protein in muscle
  presence: Reduced
  context: Autophagy-initiation proteins in patient skeletal muscle
  notes: >
    Reduced beclin-1 and Bnip3 protein in muscle biopsies is the human
    biochemical correlate of the defective autophagy demonstrated in the
    Col6a1-null mouse.
  evidence:
  - reference: PMID:21037586
    reference_title: Autophagy is defective in collagen VI muscular dystrophies, and its reactivation rescues myofiber degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, muscle biopsies from subjects with Bethlem myopathy or Ullrich congenital muscular dystrophy had reduced protein amounts of beclin-1 and Bnip3."
    explanation: Directly measures reduced autophagy-initiation proteins in Bethlem myopathy muscle.
- name: Preserved or mildly reduced collagen VI in fibroblasts
  presence: Normal or mildly reduced
  context: Cultured dermal fibroblast collagen VI expression
  notes: >
    Unlike the absent collagen VI typical of recessive Ullrich congenital
    muscular dystrophy, most Bethlem myopathy patients have normal or only mildly
    reduced collagen VI expression in cultured fibroblasts, so a normal
    immunostain does not exclude the diagnosis.
  evidence:
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cultures of dermal fibroblasts from patients with collagen VI mutations often display changes of the collagen VI matrix, ranging from absence to abnormal formation."
    explanation: >
      Patient fibroblast collagen VI ranges from absent to merely abnormally
      formed across the spectrum, the milder end of which corresponds to Bethlem
      myopathy.
  - reference: PMID:24339618
    reference_title: "Bethlem myopathy: An autosomal dominant myopathy with flexion contractures, keloids, and follicular hyperkeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy in the father showed dystrophic changes with normal immmunostaining for collagen VI, sarcoglycans, and dysferlin."
    explanation: A genetically consistent Bethlem family shows dystrophic muscle with normal collagen VI immunostaining.
  - reference: PMID:37569848
    reference_title: "New Clinical and Immunofluoresence Data of Collagen VI-Related Myopathy: A Single Center Cohort of 69 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The immunofluorescence analysis of collagen VI in 55 biopsies from 37 patients confirmed the correlation between collagen VI defects and the severity of the clinical phenotype."
    explanation: >
      Collagen VI immunofluorescence intensity tracks phenotype severity across
      the spectrum, so the mild Bethlem end shows the least collagen VI defect.
  - reference: PMID:37569848
    reference_title: "New Clinical and Immunofluoresence Data of Collagen VI-Related Myopathy: A Single Center Cohort of 69 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biopsies from the same patient or from patients with the same mutation taken at different times showed a progressive increase in protein expression with age"
    explanation: >
      Collagen VI expression is time-dependent within an individual, which
      complicates use of immunofluorescence as a trial biomarker.

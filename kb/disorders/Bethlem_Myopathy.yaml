    explanation: Consensus standard-of-care guidance supports physical therapy targeting contractures.
- name: Orthopedic management of Achilles tendon contracture and scoliosis
  description: >
    Achilles tendon contractures are treated per orthopedist, and scoliosis is
    treated per orthopedics. GeneReviews advises that if surgical treatment for
    scoliosis is needed, it should be coordinated with orthopedics, anesthesia,

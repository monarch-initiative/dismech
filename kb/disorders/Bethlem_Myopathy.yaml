    snippet: "In patients with dominant mutations in particular, muscle immunohistochemistry will show a considerable amount of collagen VI immunoreactivity in the extracellular matrix, but the normal localization of collagen VI in the basement membrane is lost."
    explanation: Explains why dominant Bethlem muscle can retain collagen VI signal while the network is functionally abnormal.
  - reference: PMID:36982625
    reference_title: Extracellular Matrix Disorganization and Sarcolemmal Alterations in COL6-Related Myopathy Patients with New Variants of COL6 Genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "they documented the high variability in COL6 distribution and the extracellular matrix disorganization"
    explanation: >
      A 15-patient COL6 cohort directly documents variable collagen VI
      distribution and extracellular matrix disorganization in patient muscle.
  downstream:
  - target: Impaired matrix-to-sarcolemma anchoring of the myofibre
    description: >
      Loss of the functional collagen VI network at the muscle basement membrane
      removes the microfibrillar bridge between the myofibre surface and the
      surrounding matrix.
    causal_link_type: DIRECT
  - target: Tendon and periarticular connective tissue involvement
    description: >
      Collagen VI is also a pericellular matrix component of tendon, so the same
      network defect alters tendon and periarticular connective tissue.
    causal_link_type: DIRECT
  - target: Dermal collagen VI deficiency and abnormal wound healing
    description: >
      The same collagen VI network defect is expressed in skin, producing the
      characteristic follicular and scarring phenotype.
    causal_link_type: DIRECT
- name: Impaired matrix-to-sarcolemma anchoring of the myofibre
  biological_scale: CELLULAR
  description: >
    Microfibrillar collagen VI is thought to bridge cells with the surrounding
    extracellular matrix, and may be linked indirectly to muscle cell surface
    receptors through biglycan and the dystrophin-associated protein complex.
    Collagen VI-deficient cells show decreased adherence to their surroundings.
    Loss of this anchoring both degrades force transmission and removes the
    matrix attachment signals that normally protect cells from apoptosis.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: cell-matrix adhesion
    modifier: DECREASED
    term:
      id: GO:0007160
      label: cell-matrix adhesion
  evidence:
  - reference: PMID:8782832
    reference_title: Type VI collagen mutations in Bethlem myopathy, an autosomal dominant myopathy with contractures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the widely expressed microfibrillar type VI collagen is believed to play a role in bridging cells with the extracellular matrix"
    explanation: States the anchoring function of collagen VI whose loss is proposed as the Bethlem mechanism.
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "collagen VI might be indirectly linked to muscle cell surface receptors via biglycan and the dystrophin-associated protein complex"
    explanation: Proposes the molecular route linking the collagen VI network to the sarcolemma.
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Work in cell cultures has shown that collagen VI-deficient cells exhibit decreased adherence to their surroundings"
    explanation: Cell-culture data support reduced matrix adherence, although the precise myofibre receptor remains unidentified.
  - reference: PMID:36982625
    reference_title: Extracellular Matrix Disorganization and Sarcolemmal Alterations in COL6-Related Myopathy Patients with New Variants of COL6 Genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It localizes at the cell surface, creating a microfilamentous network that links the cytoskeleton to the extracellular matrix."
    explanation: States the cell-surface bridging role of collagen VI whose loss defines this node.
  downstream:
  - target: Myofibre mitochondrial dysfunction and permeability transition pore dysregulation
    description: >
      Loss of matrix anchoring renders muscle mitochondria latently dysfunctional
      and sensitizes the permeability transition pore; plating collagen
      VI-deficient myofibres back onto collagen VI reverses the defect.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Progressive myofibre degeneration and endomysial fibrosis
    description: >
      Defective matrix-based force transmission contributes directly to loss of
      contractile strength and to the dystrophic muscle process.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Myofibre mitochondrial dysfunction and permeability transition pore dysregulation
  biological_scale: CELLULAR
  description: >
    Collagen VI-deficient muscle shows ultrastructural alterations of
    mitochondria and sarcoplasmic reticulum and a latent mitochondrial
    dysfunction that is unmasked by oligomycin, producing mitochondrial
    depolarization, calcium deregulation, and apoptosis through inappropriate
    opening of the cyclophilin D-dependent permeability transition pore. The
    defect is reversible: it is corrected by replating myofibres on collagen VI,
    by cyclosporin A, and by genetic ablation of cyclophilin D. The same
    mitochondrial dysfunction and increased apoptosis are demonstrable in muscle
    biopsies from patients with collagen VI myopathies.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:14625552
    reference_title: Mitochondrial dysfunction and apoptosis in myopathic mice with collagen VI deficiency.
    supports: SUPPORT

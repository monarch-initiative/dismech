  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In muscle, the cell of origin for collagen VI is the interstitial fibroblast."
    explanation: Identifies the interstitial fibroblast as the source of muscle collagen VI, establishing the non-cell-autonomous mechanism.
  - reference: PMID:21691338

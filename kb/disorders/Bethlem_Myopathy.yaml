discussions:
- discussion_id: disc_bethlem_col6a1_null_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Does the Col6a1-null mouse, which lacks collagen VI entirely, faithfully
    model dominant-negative Bethlem myopathy, in which an abnormal collagen VI
    network is still present in the matrix?
  attaches_to:
  - pathophysiology#Myofibre mitochondrial dysfunction and permeability transition pore dysregulation
  - pathophysiology#Defective autophagic clearance of damaged organelles
  rationale: >
    Nearly all of the mitochondrial permeability-transition and autophagy
    mechanism is derived from the Col6a1-null mouse, a complete-null model whose
    muscle phenotype is milder than the human disease. Most Bethlem myopathy is
    caused by dominant-negative variants in which collagen VI immunoreactivity is
    preserved but mislocalized away from the basement membrane, a molecularly
    different state from complete absence. Whether a mislocalized network
    produces the same degree of mitochondrial and autophagic failure as no
    network at all is not established, and it bears directly on how much of the
    cyclophilin D therapeutic rationale transfers to dominant Bethlem myopathy.
  proposed_experiments:
  - experiment_id: exp_bethlem_dominant_negative_ptp_flux
    name: Permeability transition and autophagic flux by COL6 genotype class
    description: >
      Measure permeability transition pore sensitivity and autophagic flux in
      myofibres or myoblasts from genotyped patients carrying dominant-negative
      COL6A1 exon 14 skipping, and compare against recessive collagen VI null
      patients and unaffected controls.
  - experiment_id: exp_bethlem_knockin_mouse
    name: Bethlem dominant-negative knock-in mouse
    description: >
      Generate a knock-in mouse carrying a Bethlem dominant-negative Col6a1
      in-frame exon deletion and compare its mitochondrial, autophagic, and
      contracture phenotype with the existing Col6a1-null mouse.
  evidence:
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In contrast to the human disease, these mice only show a mild neuromuscular disorder without much overt weakness."
    explanation: >
      The review states directly that the Col6a1-null mouse phenotype is milder
      than human disease, which is the translational mismatch at issue.
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In patients with dominant mutations in particular, muscle immunohistochemistry will show a considerable amount of collagen VI immunoreactivity in the extracellular matrix, but the normal localization of collagen VI in the basement membrane is lost."
    explanation: >
      Establishes that dominant Bethlem muscle retains a mislocalized collagen VI
      network rather than lacking collagen VI, unlike the null mouse.
  posed_date: "2026-07-31T00:00:00Z"
- discussion_id: disc_bethlem_matrix_sarcolemma_receptor
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Which molecular partner mediates the interaction of collagen VI with the
    muscle basement membrane and links the microfibrillar network to the
    sarcolemma?
  attaches_to:
  - pathophysiology#Impaired matrix-to-sarcolemma anchoring of the myofibre
  rationale: >
    The anchoring step is the mechanistic bridge between the extracellular
    collagen VI defect and the intracellular mitochondrial and apoptotic
    phenotype, yet the receptor or matrix partner that transmits the signal is
    unidentified. Collagen IV and an indirect biglycan to
    dystrophin-associated-protein-complex route have been proposed but not
    established. Without it, the causal chain from matrix to mitochondrion rests
    mainly on the reversibility of the defect when collagen VI-deficient
    myofibres are replated onto collagen VI.
  proposed_experiments:
  - experiment_id: exp_bethlem_basement_membrane_interactome
    name: Muscle basement membrane collagen VI interactome
    description: >
      Perform proximity labeling or crosslinking mass spectrometry on the muscle
      basement membrane to identify the collagen VI binding partners present at
      the myofibre surface.
  - experiment_id: exp_bethlem_biglycan_dgc_phenocopy
    name: Biglycan and dystroglycan complex phenocopy test
    description: >
      Test whether disruption of biglycan or of the dystrophin-associated protein
      complex phenocopies the collagen VI mitochondrial defect in otherwise
      wild-type myofibres.
  evidence:
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The identity of the molecular partner (or partners) mediating the interaction of collagen VI in the muscle basement membrane is not yet known."
    explanation: The review states this gap explicitly.
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A crucial step will be to establish exactly how collagen VI deficiency in the extracellular matrix leaves muscle cells vulnerable to apoptosis"
    explanation: The review names this as the crucial unresolved mechanistic step.
  posed_date: "2026-07-31T00:00:00Z"
notes: >
  This entry scopes Bethlem myopathy as MONDO:0008029 (BTHLM1, OMIM phenotypic
  series 158810), the collagen VI form, with gene-defined MONDO subtypes Bethlem
  myopathy 1A (COL6A1), 1B (COL6A2), and 1C (COL6A3). MONDO also carries a
  separate Bethlem myopathy 2 (MONDO:0034022, OMIM:616471) caused by COL12A1
  variants; that is a distinct entity outside MONDO:0008029 and is not curated
  here. Bethlem myopathy sits at the mild end of the collagen VI-related
  dystrophy continuum whose severe end is curated separately as Ullrich
  congenital muscular dystrophy; the two entries deliberately share the same
  collagen VI matrix, mitochondrial permeability transition, and autophagy
  mechanism and are distinguished by severity, respiratory involvement, and the
  contracture-versus-hyperlaxity balance. An intermediate COL6-RD phenotype lies
  between them and is not separately curated. About 25% of patients with a
  Bethlem or mild intermediate phenotype have no identified collagen VI gene
  variant, so genetic heterogeneity remains. Orphanet ORPHA:610 corresponds to
  this entity, but a structured ORPHA cache record could not be generated during
  curation because the pinned Orphadata bulk XML checksum no longer matches
  upstream; no ORPHA-sourced evidence is asserted here.
references:
- reference: PMID:20301676
  title: Collagen VI-Related Dystrophies.
  tags:
  - GeneReviews
  findings:
  - statement: >
      GeneReviews defines Bethlem muscular dystrophy as the mild end of the
      collagen VI-related dystrophy continuum, characterized by proximal muscle
      weakness plus contractures of the elbows, Achilles tendons, and long finger
      flexors, with inconsistent respiratory involvement, and provides the
      management and surveillance recommendations used in this entry.
    supporting_text: "Bethlem muscular dystrophy is characterized by a combination of proximal muscle weakness and joint contractures."
- reference: PMID:8782832
  title: Type VI collagen mutations in Bethlem myopathy, an autosomal dominant myopathy with contractures.
  findings:
  - statement: >
      The original gene-identification study linked Bethlem myopathy to the
      COL6A1-COL6A2 cluster and COL6A3, and identified Gly-X-Y disrupting
      substitutions in the triple-helical domain.
    supporting_text: "Both mutations disrupt the Gly-X-Y motif of the triple helical domain by substitution of Gly for either Val or Ser."
- reference: PMID:10219778
  title: "Bethlem myopathy: a slowly progressive congenital muscular dystrophy with contractures."
  findings:
  - statement: >
      Natural-history analysis of seven kindreds established early-childhood
      onset and the less-benign-than-thought adult course.
    supporting_text: "Due to slow but ongoing progression, more than two-thirds of patients over 50 years of age use a wheelchair."
- reference: PMID:15689448
  title: "Automated genomic sequence analysis of the three collagen VI genes: applications to Ullrich congenital muscular dystrophy and Bethlem myopathy."
  findings:
  - statement: >
      Systematic sequencing of all 107 COL6 coding exons in 79 UCMD/Bethlem
      patients found putative mutations in 62%, supporting molecular diagnosis
      and documenting residual genetic heterogeneity.
    supporting_text: "We found putative mutations in one of the COL6 genes in 62% of patients."
- reference: PMID:21691338
  title: "The collagen VI-related myopathies: muscle meets its matrix."
  findings:
  - statement: >
      The definitive review covers collagen VI assembly, the non-cell-autonomous
      interstitial fibroblast origin of muscle collagen VI, the Bethlem
      contracture and skin phenotype, muscle imaging, prevalence, and the
      genotype-phenotype gradient across the COL6-RD spectrum.
    supporting_text: "In northern England, the prevalence of Ullrich CMD is 0.13 cases per 100,000 of the population, and that of Bethlem myopathy is 0.77 cases per 100,000."
- reference: PMID:14625552
  title: Mitochondrial dysfunction and apoptosis in myopathic mice with collagen VI deficiency.
  findings:
  - statement: >
      The Col6a1-null mouse, whose muscle phenotype resembles Bethlem myopathy,
      revealed latent mitochondrial dysfunction, permeability transition pore
      dysregulation, and spontaneous myofibre apoptosis reversible by collagen VI
      replating or cyclosporin A.
    supporting_text: "We previously generated collagen VI-deficient (Col6a1-/-) mice and showed that they have a muscle phenotype that strongly resembles Bethlem myopathy."
- reference: PMID:19293339
  title: Genetic ablation of cyclophilin D rescues mitochondrial defects and prevents muscle apoptosis in collagen VI myopathic mice.
  findings:
  - statement: >
      Genetic inactivation of cyclophilin D rescues the Col6a1-null phenotype,
      establishing a cause-effect relationship between permeability transition
      pore opening and collagen VI myopathy.
    supporting_text: "validate Cyp-D and the PTP as pharmacological targets for the therapy of human ColVI myopathies"
- reference: PMID:21037586
  title: Autophagy is defective in collagen VI muscular dystrophies, and its reactivation rescues myofiber degeneration.
  findings:
  - statement: >
      Defective autophagy underlies the persistence of abnormal organelles and
      apoptosis in collagen VI-deficient muscle, and reduced beclin-1 and Bnip3
      are demonstrable in Bethlem myopathy patient muscle.
    supporting_text: "Furthermore, muscle biopsies from subjects with Bethlem myopathy or Ullrich congenital muscular dystrophy had reduced protein amounts of beclin-1 and Bnip3."
- reference: PMID:18362356
  title: Cyclosporin A corrects mitochondrial dysfunction and muscle apoptosis in patients with collagen VI myopathies.
  findings:
  - statement: >
      An open pilot trial in five patients showed that oral cyclosporin A
      normalized mitochondrial dysfunction and apoptosis in muscle biopsies,
      providing human proof of mechanism for permeability transition pore
      modulation.
    supporting_text: "report the results of an open pilot trial with cyclosporin A in five patients"
- reference: PMID:24339618
  title: "Bethlem myopathy: An autosomal dominant myopathy with flexion contractures, keloids, and follicular hyperkeratosis."
  findings:
  - statement: >
      A three-generation Indian family diagnosed by ENMC Bethlem Consortium
      criteria showed the full combination of proximal weakness, flexion
      contractures, keloids, and follicular hyperkeratosis with mildly elevated
      creatine kinase and normal collagen VI immunostaining.
    supporting_text: "All had flexion contractures, keloids, and follicular hyperkeratosis without muscle hypertrophy."
- reference: PMID:25158062
  title: "Col6a1 null mice as a model to study skin phenotypes in patients with collagen VI related myopathies: expression of classical and novel collagen VI variants during wound healing."
  findings:
  - statement: >
      Patients with collagen VI-related myopathies display keloids, cigarette
      paper scars, dry skin, striae, and keratosis pilaris, and the Col6a1-null
      mouse is a model for the skin arm of the disease.
    supporting_text: "often also display skin abnormalities, like formation of keloids or"
- reference: PMID:37569848
  title: "New Clinical and Immunofluoresence Data of Collagen VI-Related Myopathy: A Single Center Cohort of 69 Patients."
  findings:
  - statement: >
      A 69-patient single-center collagen VI cohort including 33 Bethlem myopathy
      patients quantifies residual strength, and shows that collagen VI
      immunofluorescence correlates with severity but increases with age within
      an individual.
    supporting_text: "In our BM group, only one third had a knee extension strength greater than 50% of the predicted value, while only one in ten showed similar retention of elbow flexion."
- reference: PMID:36982625
  title: Extracellular Matrix Disorganization and Sarcolemmal Alterations in COL6-Related Myopathy Patients with New Variants of COL6 Genes.
  findings:
  - statement: >
      A 15-patient COL6 cohort documents extracellular matrix disorganization,
      sarcolemmal alterations, and highly variable collagen VI distribution, and
      establishes that combined histological, immunological, and ultrastructural
      methods are needed for diagnosis.
    supporting_text: "they documented the high variability in COL6 distribution and the extracellular matrix disorganization"
- reference: clinicaltrials:NCT01438788
  title: Low Protein Diet to Correct Defective Autophagy in Patients With Collagen VI Related Myopathies
  findings:
  - statement: >
      A phase II open-label pilot tested a normocaloric low-protein diet in eight
      adults with Bethlem myopathy or Ullrich congenital muscular dystrophy to
      reactivate autophagy, with muscle beclin-1 as the primary endpoint.
    supporting_text: "The primary end point of the study will be the change in muscle biopsy of Beclin 1, a marker of autophagy, at 1 year of LPD treatment when compared to baseline."
- reference: PMID:21078917
  title: Consensus statement on standard of care for congenital muscular dystrophies.
  findings:
  - statement: >
      Standard-of-care consensus supports physical therapy directed at
      maintaining function and preventing or treating joint contractures and
      spine deformity.
    supporting_text: "Physical therapy should be focused on the maintenance of function and mobility, prevention or treatment of joint contractures and spine deformities"

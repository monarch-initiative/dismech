differential_diagnoses:
- name: Emery-Dreifuss muscular dystrophy
  disease_term:
    preferred_term: Emery-Dreifuss muscular dystrophy
    term:
      id: MONDO:0016830
      label: Emery-Dreifuss muscular dystrophy
  description: >-
    Early contractures and slowly progressive weakness overlap.
  distinguishing_features:
  - Primary cardiac involvement is a major discriminator for Emery-Dreifuss disease, whereas cardiac review in Bethlem focuses on secondary consequences of hypoventilation.
  evidence:
  - reference: PMID:21691338
    reference_title: 'The collagen VI-related myopathies: muscle meets its matrix.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The presence of cardiac involvement clearly favors the presence of an Emery–Dreifuss muscular dystrophy,
      as primary cardiac involvement is not seen in the collagen VI-related myopathies.
    explanation: >-
      Clinical differential diagnosis in the COL6 review.
    quote_role: REVIEW_SYNTHESIS
- name: Calpainopathy
  description: >-
    Limb-girdle weakness and a contractural phenotype may resemble Bethlem disease.
  distinguishing_features:
  - Periscapular and biceps atrophy may suggest calpainopathy; muscle MRI patterns can overlap, so molecular diagnosis is needed.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1503/?report=reader
    reference_title: Collagen VI-Related Dystrophies - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Of note, similar muscle imaging patterns may be seen in other conditions, including ... calpainopathy
    explanation: >-
      Imaging differential caveat.
    quote_role: REVIEW_SYNTHESIS
- name: COL12A1-related myopathy
  disease_term:
    preferred_term: Bethlem myopathy 2
    term:
      id: MONDO:0034022
      label: Bethlem myopathy 2
  description: >-
    A genetically distinct myopathy/connective-tissue disorder can share hypotonia, laxity and contractures.
  distinguishing_features:
  - COL12A1-related disease lies outside the COL6A1/COL6A2/COL6A3 Bethlem definition and is distinguished molecularly. Its overlapping connective-tissue features should not be treated as evidence for a COL6 variant.
  evidence:
  - reference: PMID:40309777
    reference_title: Collagen type VI regulates TGF-β bioavailability in skeletal muscle in mice.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Mild and non-progressive muscle weakness is common in genetic connective tissue diseases — for example,
      Marfan’s syndrome due to FBN1 pathogenic variants (4), osteogenesis imperfecta due to COL1A1 pathogenic
      variants (5), and Ehlers-Danlos/myopathy overlap due to COL12A1 pathogenic variants (6).
    explanation: >-
      Background clinical distinction in the mechanistic study introduction.
    quote_role: BACKGROUND
- name: Ullrich congenital muscular dystrophy
  disease_term:
    preferred_term: Ullrich congenital muscular dystrophy
    term:
      id: MONDO:0000355
      label: Ullrich congenital muscular dystrophy
  description: >-
    An allelic COL6-related dystrophy with overlapping matrix disease.
  distinguishing_features:
  - More severe congenital weakness, earlier loss of walking and earlier ventilatory dependence distinguish UCMD; intermediate phenotypes lie between UCMD and adult-ambulant Bethlem disease.
  evidence:
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      UCMD is characterized by congenital weakness, hypotonia, proximal joint contractures, and striking hyperlaxity
      of distal joints.
    explanation: >-
      GeneReviews clinical distinction.
    quote_role: REVIEW_SYNTHESIS
experimental_models:
- name: COL6A1 exon-14-skipping patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Skin fibroblasts from the patient carrying the studied COL6A1 splice-donor allele
  description: >-
    Mutant chains entered monomers but not dimers/tetramers, and mutant-containing molecules were not secreted.
    Normal collagen VI production was approximately halved. The engineered alpha3-chain deletion also studied
    in SaOS-2 cells was a separate construct, not this patient allele.
  modeled_mechanisms:
  - target: Defective intracellular collagen VI assembly
    relationship: RECAPITULATES
    model_scale: CELLULAR
    limitations: >-
      One structurally characterized splice allele; consequences need not match all dominant COL6 variants.
    evidence:
    - reference: PMID:10419498
      reference_title: Bethlem myopathy and engineered collagen VI triple helical deletions prevent intracellular multimer assembly and protein secretion.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        The mutant alpha1(VI) chains associated intracellularly with alpha2(VI) and alpha3(VI) to form disulfide-bonded
        monomers, but further assembly into dimers and tetramers was prevented, and molecules containing the
        mutant chain were not secreted.
      explanation: >-
        Direct assembly/secretion study of one patient exon-14-skipping allele, not a universal mechanism for
        all COL6 variants.
  - target: Impaired collagen VI secretion
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: >-
      Experimental model findings do not establish their prevalence or treatment effect in human Bethlem myopathy.
    evidence:
    - reference: PMID:10419498
      reference_title: Bethlem myopathy and engineered collagen VI triple helical deletions prevent intracellular multimer assembly and protein secretion.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        The mutant alpha1(VI) chains associated intracellularly with alpha2(VI) and alpha3(VI) to form disulfide-bonded
        monomers, but further assembly into dimers and tetramers was prevented, and molecules containing the
        mutant chain were not secreted.
      explanation: >-
        Direct assembly/secretion study of one patient exon-14-skipping allele, not a universal mechanism for
        all COL6 variants.
  evidence:
  - reference: PMID:10419498
    reference_title: Bethlem myopathy and engineered collagen VI triple helical deletions prevent intracellular multimer assembly and protein secretion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      The mutant alpha1(VI) chains associated intracellularly with alpha2(VI) and alpha3(VI) to form disulfide-bonded
      monomers, but further assembly into dimers and tetramers was prevented, and molecules containing the
      mutant chain were not secreted.
    explanation: >-
      Direct assembly/secretion study of one patient exon-14-skipping allele, not a universal mechanism for
      all COL6 variants.
- name: Recessive COL6A2 patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Proband skin fibroblasts and single-variant relatives from the 2025 family
  description: >-
    Ascorbate-treated proband cells retained collagen VI intracellularly without the secreted network seen
    in the mother and unaffected brother. Segregation and the paired-variant cell phenotype support the family
    interpretation; each initially uncertain missense variant was not tested in isolation.
  modeled_mechanisms:
  - target: Impaired collagen VI secretion
    relationship: RECAPITULATES
    model_scale: CELLULAR
    limitations: >-
      One compound-heterozygous family; no isolated-allele functional dissection.

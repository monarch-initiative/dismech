- name: Bethlem-like col6a1 exon-13 morphant zebrafish
  species: Danio rerio
  genotype: Morpholino-induced in-frame col6a1 exon 13 skipping
  description: >-
    Transient exon-13 skipping, analogous to human COL6A1 exon 14, caused mild delayed motor and myotendinous/organellar
    abnormalities. The more severe exon-9 model was used for cyclosporin testing; its partial motor rescue
    cannot be claimed as a result in the mild arm. Morpholino embryos do not establish adult progression.
  modeled_mechanisms:
  - target: Progressive myofibre degeneration
    relationship: PARTIALLY_RECAPITULATES
    model_scale: TISSUE
    limitations: >-
      Transient developmental structural and motor phenotype, not adult longitudinal disease.
    evidence:
    - reference: PMID:20338942
      reference_title: Zebrafish models of collagen VI-related myopathies.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        In all, the functional, morphologic and structural changes caused by col6a1 morpholinos are consistent
        with a mild, Bethlem-like phenotype (exon 13 morpholino) and with a severe, UCMD-like phenotype (exon
        9 morpholino).
      explanation: >-
        Distinct transient zebrafish models; exon 13 is the Bethlem-like arm.

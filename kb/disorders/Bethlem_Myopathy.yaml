definitions:
- name: GeneReviews Bethlem muscular dystrophy definition
  definition_type: OTHER
  description: >
    Bethlem muscular dystrophy is the mild end of the collagen VI-related
    dystrophy continuum and is characterized by the combination of proximal
    muscle weakness and joint contractures.
  evidence:
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bethlem muscular dystrophy is characterized by a combination of proximal muscle weakness and joint contractures."
    explanation: The GeneReviews chapter states the defining clinical combination for Bethlem muscular dystrophy.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:15689448
    reference_title: "Automated genomic sequence analysis of the three collagen VI genes: applications to Ullrich congenital muscular dystrophy and Bethlem myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BM is a relatively mild dominantly inherited disorder with proximal weakness and distal joint contractures."
    explanation: A cohort sequencing study frames Bethlem myopathy as the mild, dominantly inherited COL6 disorder with proximal weakness and distal contractures.
inheritance:
- name: Autosomal dominant inheritance
  description: >
    Bethlem myopathy is usually inherited in an autosomal dominant manner,
    typically through dominant-negative COL6A1, COL6A2, or COL6A3 variants that
    are incorporated into collagen VI monomers.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bethlem muscular dystrophy is usually inherited in an autosomal dominant manner"
    explanation: GeneReviews records autosomal dominant inheritance as the usual mode for Bethlem muscular dystrophy.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:8782832
    reference_title: Type VI collagen mutations in Bethlem myopathy, an autosomal dominant myopathy with contractures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A distinctive feature of this autosomal dominant disorder consists of contractures of multiple joints in addition to generalized muscular weakness and wasting."
    explanation: The original gene-identification study describes Bethlem myopathy as an autosomal dominant disorder.
- name: Autosomal recessive inheritance
  description: >-
    Recessive Bethlem myopathy occurs with biallelic COL6 variants and residual-function mechanisms. COL6A2-related
    myosclerosis overlaps the spectrum but is clinically distinguishable by severe stiffness and restricted
    joint movement; it is not synonymous with all recessive Bethlem disease.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "although autosomal recessive inheritance has also been reported"
    explanation: GeneReviews records that recessive inheritance also occurs in Bethlem muscular dystrophy.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In fact, in populations with a low degree of consanguinity, de novo autosomal-dominant mutations are
      the most common underlying mechanism of Ullrich CMD.1,30,32,80 Furthermore, although the typical genetic
      mechanism and pattern of inheritance for Bethlem myopathy is dominant, recessive mutations have also
      been seen in affected patients, albeit rarely.81,82 For example, the myosclerosis phenotype15 has emerged
      as a recessive form of Bethlem myopathy, in which a homozygous nonsense mutation in the COL6A2 gene results
      in a stable chain lacking the C2 domain but retaining the C1 domain,16 which presumably interferes with
      its ability to interact with other components in the extracellular matrix.
    explanation: The review documents a recessive (myosclerosis) form of Bethlem myopathy caused by a homozygous COL6A2 nonsense variant.
    quote_role: REVIEW_SYNTHESIS

pathophysiology:
- name: Collagen VI alpha-chain gene defects
  biological_scale: MOLECULAR
  description: >
    Germline pathogenic variants in COL6A1, COL6A2, or COL6A3 alter the collagen
    VI alpha chains. In Bethlem myopathy these are typically dominant-negative
    lesions: in-frame skipping of COL6A1 exon 14, or glycine substitutions that
    disrupt the Gly-X-Y repeat of the N-terminal triple-helical domain. Mutant
    chains are still competent to enter the monomer, so the defect is
    transmitted into the assembled protein rather than simply reducing dosage.
  genes:
  - preferred_term: COL6A1
    term:
      id: hgnc:2211
      label: COL6A1
  - preferred_term: COL6A2
    term:
      id: hgnc:2212
      label: COL6A2
  - preferred_term: COL6A3
    term:
      id: hgnc:2213
      label: COL6A3
  molecular_functions:
  - preferred_term: extracellular matrix structural constituent
    modifier: ABNORMAL
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
  evidence:
  - reference: PMID:15689448
    reference_title: "Automated genomic sequence analysis of the three collagen VI genes: applications to Ullrich congenital muscular dystrophy and Bethlem myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the genes encoding collagen VI (COL6A1, COL6A2, and COL6A3) cause Bethlem myopathy (BM) and Ullrich congenital muscular dystrophy"
    explanation: Establishes the three collagen VI genes as the genetic cause of Bethlem myopathy.
  - reference: PMID:8782832
    reference_title: Type VI collagen mutations in Bethlem myopathy, an autosomal dominant myopathy with contractures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both mutations disrupt the Gly-X-Y motif of the triple helical domain by substitution of Gly for either Val or Ser."
    explanation: Identifies the triple-helix-disrupting substitutions that constitute the primary molecular lesion.
  downstream:
  - target: Defective collagen VI microfibril assembly and secretion
    description: >
      Mutant alpha chains are incorporated into collagen VI monomers and
      subvert the downstream dimer, tetramer, and microfibril assembly steps.
    causal_link_type: DIRECT
- name: Defective collagen VI microfibril assembly and secretion
  biological_scale: MOLECULAR
  description: >
    Collagen VI is assembled intracellularly from one each of the alpha 1, alpha
    2, and alpha 3 chains into a triple-helical monomer, then into antiparallel
    dimers and staggered tetramers, which are secreted and associate end to end
    into the characteristic beaded microfibrils. Because a mutant chain can be
    incorporated at the monomer step, only a minority of tetramers are normal,
    giving a strong dominant-negative effect. Milder lesions such as COL6A1 exon
    14 skipping have a more limited dominant-negative effect and therefore shift
    the phenotype toward the Bethlem end of the spectrum.
  biological_processes:
  - preferred_term: protein secretion
    modifier: ABNORMAL
    term:
      id: GO:0009306
      label: protein secretion
  locations:
  - preferred_term: extracellular matrix
    term:
      id: GO:0031012
      label: extracellular matrix
  evidence:
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These tetramers are secreted into the extracellular space, where they associate in an end-to-end fashion to form characteristic"
    explanation: Describes the extracellular tetramer-to-microfibril assembly step that collagen VI variants disrupt.
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "exon-14-skipping mutations are the single most common mutation type seen in patients with Bethlem myopathy"
    explanation: Links the assembly lesion with the mildest dominant-negative effect to the Bethlem phenotype.
  downstream:
  - target: Endomysial collagen VI microfibrillar network deficiency
    description: >
      Failure of tetramer assembly and microfibril formation leaves a deficient
      or dysfunctional collagen VI network in the tissue matrix.
    causal_link_type: DIRECT
- name: Endomysial collagen VI microfibrillar network deficiency
  biological_scale: TISSUE
  description: >
    Collagen VI forms a microfibrillar network that is particularly prominent in
    the endomysium of skeletal muscle, where it is produced not by the myofibre
    itself but by the resident interstitial fibroblast, making the collagen
    VI-related myopathies non-cell-autonomous muscle disorders. In dominant
    Bethlem myopathy the total amount of collagen VI immunoreactivity in muscle
    is often preserved or only mildly reduced, but the normal localization of
    collagen VI at the basement membrane is lost, indicating that the retained
    protein is not a functionally normal interactive microfibrillar network.
  cell_types:
  - preferred_term: muscle interstitial fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  locations:

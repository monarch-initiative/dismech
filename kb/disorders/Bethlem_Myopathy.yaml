progression:
- phase: Variable onset from birth to adulthood
  age_range: Prenatal life to adulthood
  notes: >-
    Onset is variable. The 1999 seven-kindred series found manifestations in nearly all affected children by
    age two, whereas the 2023 cohort included 10 of 33 with symptoms at birth, 11 in early childhood, two in
    adolescence, six first noticing difficulty in early adulthood and four initially asymptomatic. These ascertainment-specific
    distributions are not contradictory universal age cutoffs.
  evidence:
  - reference: PMID:10219778
    reference_title: "Bethlem myopathy: a slowly progressive congenital muscular dystrophy with contractures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our analysis shows that nearly all children exhibit weakness or contractures during the first 2 years of life."
    explanation: Natural-history data in seven kindreds establish onset within the first two years.
  - reference: PMID:10219778
    reference_title: "Bethlem myopathy: a slowly progressive congenital muscular dystrophy with contractures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early features include diminished foetal movements, neonatal hypotonia and congenital contractures which are of a dynamic nature during childhood."
    explanation: The same cohort documents the early prenatal and neonatal features.
  - reference: PMID:37569848
    reference_title: 'New Clinical and Immunofluoresence Data of Collagen VI-Related Myopathy: A Single Center Cohort of 69 Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Ten patients with BM (30%) exhibited symptoms at birth, with a varying combination of congenital hip
      dislocation (CHD) in four, hypotonia in four, club foot in four, torticollis in three, and contractures
      of the elbow and knee in one.
    explanation: >-
      Ten of 33 Bethlem patients; individual congenital findings each have their own count.
  - reference: PMID:37569848
    reference_title: 'New Clinical and Immunofluoresence Data of Collagen VI-Related Myopathy: A Single Center Cohort of 69 Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Six patients only noticed these difficulties during early adulthood, while four were asymptomatic at
      their initial visit.
    explanation: >-
      Adult recognition and initially asymptomatic cases in the Bethlem subgroup.
- phase: Contracture development in later childhood and adolescence
  age_range: Late first decade to teenage years
  notes: >
    Achilles tendon and elbow contractures typically emerge late in the first
    decade and during the teenage years and then extend to the long finger
    flexors and shoulders, sometimes producing spinal rigidity.
  evidence:
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Bethlem myopathy, typical contractures of the Achilles tendons (Figure 1d) and elbows tend to develop late in the first decade of life and during teenage years."
    explanation: The review dates the onset of the characteristic Bethlem contractures.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These contractures progress to involve the long finger flexors and the shoulders; they can also affect the spine and cause a degree of spinal rigidity in some patients."
    explanation: The review describes progression of contractures to the long finger flexors, shoulders, and spine.
    quote_role: REVIEW_SYNTHESIS
- phase: Slow adult progression with late mobility loss
  age_range: Fourth decade onward
  notes: >-
    Adult decline may accelerate after age 40. Wheelchair use or outdoor mobility assistance does not necessarily
    mean loss of independent indoor walking. GeneReviews describes more than two thirds of those over 50 remaining
    independently ambulant indoors while needing outdoor support. In a separate 33-patient Bethlem cohort,
    five lost ambulation at a mean age of 44.6 years.
  evidence:
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The progression of weakness is slow, and more than two thirds of affected individuals older than age 50 years remain independently ambulatory indoors, while relying on supportive means for mobility outdoors."
    explanation: GeneReviews describes the slow adult course and late mobility limitation.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:10219778
    reference_title: "Bethlem myopathy: a slowly progressive congenital muscular dystrophy with contractures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to slow but ongoing progression, more than two-thirds of patients over 50 years of age use a wheelchair."
    explanation: The natural-history cohort quantifies wheelchair use after age 50.
  - reference: PMID:37569848
    reference_title: "New Clinical and Immunofluoresence Data of Collagen VI-Related Myopathy: A Single Center Cohort of 69 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our BM group, only one third had a knee extension strength greater than 50% of the predicted value, while only one in ten showed similar retention of elbow flexion."
    explanation: >
      A contemporary 33-patient Bethlem cohort quantifies how much strength is
      actually lost, showing that mild does not mean trivial.
  - reference: PMID:25535305
    reference_title: 'Bethlem myopathy: long-term follow-up identifies COL6 mutations predicting severe clinical evolution.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      However, worsening of the functional disability appeared typically after the age of 40 in 47% of our
      patients, and was frequently associated with COL6A1 exon 14 skipping.
    explanation: >-
      Retrospective cohort of 35 molecularly identified Bethlem patients; not a deterministic allele prediction.
  - &id003
    reference: PMID:37569848
    reference_title: 'New Clinical and Immunofluoresence Data of Collagen VI-Related Myopathy: A Single Center Cohort of 69 Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The mean age at loss of ambulation was 44.6 years (SD 9.7 years) in five BM, 17.0 years (SD 1.8 years)
      in five INTM, and 8.1 years (SD 2.5 years) in 15 UCMD.
    explanation: >-
      Five of 33 Bethlem patients lost ambulation; intermediate/UCMD figures are separate comparators.
genetic:
- name: COL6A1
  gene_term:
    preferred_term: COL6A1
    term:
      id: hgnc:2211
      label: COL6A1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    COL6A1 encodes the collagen VI alpha 1 chain. Structural variants including glycine substitutions and in-frame
    exon 14 skipping cause Bethlem disease. For one splice-donor allele, patient RNA showed an 18-amino-acid
    in-frame deletion and fibroblast studies found blocked dimer/tetramer assembly and secretion of mutant-containing
    molecules. Exon 14 skipping was associated with worse adult evolution in one cohort; phenotype cannot be
    predicted reliably from the broad variant class alone.
  evidence:
  - reference: PMID:15689448
    reference_title: "Automated genomic sequence analysis of the three collagen VI genes: applications to Ullrich congenital muscular dystrophy and Bethlem myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      INTRODUCTION: Mutations in the genes encoding collagen VI (COL6A1, COL6A2, and COL6A3) cause Bethlem
      myopathy (BM) and Ullrich congenital muscular dystrophy (UCMD).
    explanation: Sequencing evidence establishes the three collagen VI genes as Bethlem myopathy causes.
  - reference: PMID:8782832
    reference_title: Type VI collagen mutations in Bethlem myopathy, an autosomal dominant myopathy with contractures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis in four families reveals a mutation in COL6A1 in one and a COL6A2 mutation in two other
      kindreds.
    explanation: The original study identified a COL6A1 mutation segregating in a Bethlem kindred.
  - reference: PMID:10419498
    reference_title: Bethlem myopathy and engineered collagen VI triple helical deletions prevent intracellular multimer assembly and protein secretion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      The mutant alpha1(VI) chains associated intracellularly with alpha2(VI) and alpha3(VI) to form disulfide-bonded
      monomers, but further assembly into dimers and tetramers was prevented, and molecules containing the
      mutant chain were not secreted.
    explanation: >-
      Direct assembly/secretion study of one patient exon-14-skipping allele, not a universal mechanism for
      all COL6 variants.
  - *id001
- name: COL6A2
  gene_term:
    preferred_term: COL6A2
    term:
      id: hgnc:2212
      label: COL6A2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    COL6A2 can cause dominant structural-variant disease or recessive Bethlem phenotypes. In one family, p.Gln889*
    and p.Pro260_Lys261insProPro in trans were associated with reduced normal protein and impaired secretion/assembly,
    respectively; carrier parents were asymptomatic. In a separate three-sister family, c.1514G>A (p.Gly505Asp)
    and c.2877G>C (p.Glu959Asp) segregated in trans, and proband fibroblasts showed intracellular retention
    and absent extracellular network. Those two missense variants were initially uncertain; combined segregation
    and functional findings supported the authors' causal interpretation, without separate assays proving the
    effect of each allele. Myosclerosis is an allelic, clinically distinct presentation.
  evidence:
  - reference: PMID:8782832
    reference_title: Type VI collagen mutations in Bethlem myopathy, an autosomal dominant myopathy with contractures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both mutations disrupt the Gly-X-Y motif of the triple helical domain by substitution of Gly for either Val or Ser."
    explanation: The original study characterizes the Gly-X-Y disrupting substitutions found in Bethlem kindreds.
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In fact, in populations with a low degree of consanguinity, de novo autosomal-dominant mutations are
      the most common underlying mechanism of Ullrich CMD.1,30,32,80 Furthermore, although the typical genetic
      mechanism and pattern of inheritance for Bethlem myopathy is dominant, recessive mutations have also
      been seen in affected patients, albeit rarely.81,82 For example, the myosclerosis phenotype15 has emerged
      as a recessive form of Bethlem myopathy, in which a homozygous nonsense mutation in the COL6A2 gene results
      in a stable chain lacking the C2 domain but retaining the C1 domain,16 which presumably interferes with
      its ability to interact with other components in the extracellular matrix.
    explanation: The review documents recessive COL6A2 disease at the Bethlem end of the spectrum.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:31471117
    reference_title: 'Autosomal recessive Bethlem myopathy: A clinical, genetic and functional study.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Fibroblast studies in both affected patients showed the concomitant reduction in the amount of normal
      Collagen VI (p.Gln889*) and impairment of Collagen VI secretion and assembly (p.Pro260_Lys261insProPro).
    explanation: >-
      Compound-heterozygous siblings; each heterozygous parent was asymptomatic.
  - reference: PMID:40550965
    reference_title: 'Autosomal recessive Bethlem myopathy: a 30-year journey.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      The proband’s cells (III:2) presented the absence of secreted protein and collagen VI network; collagen
      staining was observable only in the cell’s cytoplasm as in NT well (63X).
    explanation: >-
      Patient fibroblast phenotype in a recessive COL6A2 family; individual variant effects were not isolated.

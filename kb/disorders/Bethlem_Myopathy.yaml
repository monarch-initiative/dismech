diagnosis:
- name: Muscle collagen VI immunohistochemistry
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >
    In dominant collagen VI disease, muscle immunohistochemistry retains
    considerable collagen VI signal in the extracellular matrix but loses the
    normal collagen VI localization at the basement membrane, which is best
    revealed by double staining with a basement membrane marker. A normal
    overall collagen VI stain therefore does not exclude Bethlem myopathy,
    unlike the frankly absent collagen VI of recessive Ullrich disease.
  results: Retained but mislocalized collagen VI, away from the basement membrane, supports dominant collagen VI disease.
  evidence:
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In patients with dominant mutations in particular, muscle immunohistochemistry will show a considerable amount of collagen VI immunoreactivity in the extracellular matrix, but the normal localization of collagen VI in the basement membrane is lost."
    explanation: Describes the immunohistochemical signature of dominant collagen VI disease.
  - reference: PMID:24339618
    reference_title: "Bethlem myopathy: An autosomal dominant myopathy with flexion contractures, keloids, and follicular hyperkeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy in the father showed dystrophic changes with normal immmunostaining for collagen VI, sarcoglycans, and dysferlin."
    explanation: Illustrates that collagen VI immunostaining can be normal in genetically consistent Bethlem myopathy.
  - reference: PMID:36982625
    reference_title: Extracellular Matrix Disorganization and Sarcolemmal Alterations in COL6-Related Myopathy Patients with New Variants of COL6 Genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The combined use of these different technologies is pivotal in the diagnosis of COL6 patients."
    explanation: >
      Histological, immunological, and ultrastructural methods are complementary
      and jointly needed to validate COL6 variants.
- name: COL6A1, COL6A2, and COL6A3 molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >
    Molecular confirmation is by identification of a heterozygous or biallelic
    pathogenic variant in COL6A1, COL6A2, or COL6A3. Systematic sequencing of all
    107 coding exons of the three genes identifies a putative mutation in about
    62% of patients across the UCMD/Bethlem spectrum, so a negative result does
    not exclude the diagnosis.
  results: A heterozygous or biallelic COL6A1, COL6A2, or COL6A3 pathogenic variant confirms the diagnosis.
  evidence:
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis can be confirmed by identification of a heterozygous or biallelic pathogenic variant(s) in COL6A1, COL6A2, or COL6A3."
    explanation: GeneReviews defines the molecular confirmation criterion.
  - reference: PMID:15689448
    reference_title: "Automated genomic sequence analysis of the three collagen VI genes: applications to Ullrich congenital muscular dystrophy and Bethlem myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found putative mutations in one of the COL6 genes in 62% of patients."
    explanation: Quantifies the diagnostic yield of systematic COL6 sequencing.
- name: Muscle imaging
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >
    Muscle MRI or ultrasound shows a characteristic concentric pattern with the
    earliest degenerative change on the outer aspects of the muscle, plus a
    central zone of altered signal in rectus femoris (the central cloud or
    central shadow), which helps distinguish collagen VI disease from
    LMNA-related Emery-Dreifuss muscular dystrophy and from limb-girdle
    muscular dystrophy.
  results: A concentric outer-to-inner pattern with a rectus femoris central cloud supports collagen VI-related myopathy.
  evidence:
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the collagen VI-related myopathies, a characteristic concentric pattern of imaging changes is observed, in that the initial degenerative changes seen on imaging are most evident on the outer aspects of the muscle, rather than the inside"
    explanation: Describes the concentric muscle imaging signature.
  - reference: PMID:24339618
    reference_title: "Bethlem myopathy: An autosomal dominant myopathy with flexion contractures, keloids, and follicular hyperkeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle imaging revealed severe involvement of glutei and vasti with"
    explanation: A Bethlem case series documents the imaging pattern including the rectus femoris central shadow.

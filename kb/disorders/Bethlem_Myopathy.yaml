    does not exclude the diagnosis. Abnormal staining can support COL6 disease but is not a universal requirement,
    and expression may vary with age.
  results: Retained but mislocalized collagen VI, away from the basement membrane, supports dominant collagen VI disease.
  evidence:
  - reference: PMID:37569848
    reference_title: 'New Clinical and Immunofluoresence Data of Collagen VI-Related Myopathy: A Single Center Cohort of 69 Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Muscle biopsies from 13 out of 15 BM patients with dominant mutations exhibited a normal collagen VI
      pattern, as evidenced by the continuous overlap with the anti-perlecan staining (Table 2).
    explanation: >-
      Normal abundance and basal-lamina colocalization in most dominant Bethlem biopsies in this series; a
      normal result does not exclude disease.
- name: COL6A1, COL6A2, and COL6A3 molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Diagnosis requires compatible clinical findings and pathogenic or likely pathogenic COL6A1, COL6A2 or COL6A3
    variant(s), with inheritance and segregation assessed. Testing can use a multigene panel or exome/genome
    sequencing and selected deletion/duplication or RNA studies when standard sequencing is unrevealing. The
    62% putative-variant yield in a 2005 coding-exon study is historical and should not be presented as modern
    sensitivity. Variants of uncertain significance neither confirm nor exclude disease; functional evidence
    must be interpreted with appropriate controls. Deep-intronic COL6A1 testing is relevant to the wider COL6
    diagnostic spectrum, without labeling its typical severe phenotype as Bethlem.
  results: A heterozygous or biallelic COL6A1, COL6A2, or COL6A3 pathogenic variant confirms the diagnosis.
  evidence:
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis can be confirmed by identification of a heterozygous or biallelic pathogenic variant(s) in COL6A1, COL6A2, or COL6A3."
    explanation: GeneReviews defines the molecular confirmation criterion.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:15689448
    reference_title: "Automated genomic sequence analysis of the three collagen VI genes: applications to Ullrich congenital muscular dystrophy and Bethlem myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found putative mutations in one of the COL6 genes in 62% of patients."
    explanation: Quantifies the diagnostic yield of systematic COL6 sequencing.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1503/?report=reader
    reference_title: Collagen VI-Related Dystrophies - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The identification of variant(s) of uncertain significance cannot be used to confirm or rule out the
      diagnosis.
    explanation: >-
      GeneReviews explicitly limits interpretation of VUS.
    quote_role: REVIEW_SYNTHESIS
- name: Muscle imaging
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    MRI may show peripheral involvement of vastus lateralis with central rectus-femoris involvement, supporting
    a COL6 phenotype and helping select diagnostic testing. Imaging is supportive rather than perfectly specific;
    overlapping patterns occur in calpainopathy, and some mild Bethlem patients have normal MRI.
  results: A concentric outer-to-inner pattern with a rectus femoris central cloud supports collagen VI-related myopathy.
  evidence:
  - reference: PMID:21691338
    reference_title: "The collagen VI-related myopathies: muscle meets its matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This analysis, therefore, is also a useful diagnostic tool (Figure 2).30,32–34 MRI of muscle can be very
      useful in the recognition of a collagen VI-related myopathy and in the differentiation of collagen VI-related
      myopathies from LMNA-related Emery–Dreifuss muscular dystrophy, as well as from other myopathies associated
      with contractures and spinal rigidity.35,36 In the collagen VI-related myopathies, a characteristic concentric
      pattern of imaging changes is observed, in that the initial degenerative changes seen on imaging are
      most evident on the outer aspects of the muscle, rather than the inside (Figure 3).
    explanation: Describes the concentric muscle imaging signature.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:24339618
    reference_title: "Bethlem myopathy: An autosomal dominant myopathy with flexion contractures, keloids, and follicular hyperkeratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle imaging revealed severe involvement of glutei and vasti with "central shadow" in rectus femoris.
    explanation: A Bethlem case series documents the imaging pattern including the rectus femoris central shadow.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1503/?report=reader
    reference_title: Collagen VI-Related Dystrophies - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Of note, similar muscle imaging patterns may be seen in other conditions, including ... calpainopathy
    explanation: >-
      Imaging pattern is not unique to COL6 disease.
    quote_role: REVIEW_SYNTHESIS
- name: Cultured dermal fibroblast collagen VI analysis
  description: >-
    Cultured fibroblast immunocytochemistry can reveal disorganized, stippled, sparse or intracellularly retained
    collagen VI and complement molecular interpretation. The assay compartment differs from muscle immunohistochemistry.
    A 2025 recessive family showed absent extracellular network in the proband and preserved networks in single-variant
    relatives; this does not independently classify either allele in isolation.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:40550965
    reference_title: 'Autosomal recessive Bethlem myopathy: a 30-year journey.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      The proband’s cells (III:2) presented the absence of secreted protein and collagen VI network; collagen
      staining was observable only in the cell’s cytoplasm as in NT well (63X).
    explanation: >-
      Patient fibroblast phenotype in a recessive COL6A2 family; individual variant effects were not isolated.
treatments:
- name: Physical and occupational therapy for contracture management
  description: >
    Physical therapy and occupational therapy provide recommendations for joint
    stretching, swimming, and aquatherapy. Contracture management is the central
    supportive intervention in Bethlem myopathy, because contracture progression
    causes disability in its own right even when weakness progresses only slowly.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Flexion contracture
    term:
      id: HP:0001371
      label: Flexion contracture
  - preferred_term: Achilles tendon contracture
    term:
      id: HP:0001771
      label: Achilles tendon contracture
  - preferred_term: Muscle weakness
    term:
      id: HP:0001324
      label: Muscle weakness
  evidence:
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "physical therapy and occupational therapy to provide recommendations for joint stretching, swimming, and aquatherapy"
    explanation: GeneReviews recommends physical and occupational therapy for Bethlem muscular dystrophy.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:21078917
    reference_title: Consensus statement on standard of care for congenital muscular dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Physical therapy should be focused on the maintenance of function and mobility, prevention or treatment of joint contractures and spine deformities"
    explanation: Consensus standard-of-care guidance supports physical therapy targeting contractures.
    quote_role: REVIEW_SYNTHESIS
- name: Orthopedic management of Achilles tendon contracture and scoliosis
  description: >-
    Specialist care can include serial casting and selected Achilles tendon release followed by casting when
    severe or asymmetric shortening impairs gait. Surgery disrupting other joint capsules is generally discouraged
    because fixed postoperative contractures and loss of motion can result. Scoliosis surgery requires coordinated
    pulmonary, anesthesia, intensive-care and orthopedic planning.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_phenotypes:
  - preferred_term: Achilles tendon contracture
    term:
      id: HP:0001771
      label: Achilles tendon contracture
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  evidence:
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment of Achilles tendon contractures per orthopedist"
    explanation: GeneReviews prescribes orthopedic treatment of Achilles tendon contracture.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "if surgical treatment for scoliosis is needed, coordinate with orthopedics, anesthesia, intensive care, and pulmonary specialists"
    explanation: GeneReviews specifies multidisciplinary coordination for scoliosis surgery.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1503/?report=reader
    reference_title: Collagen VI-Related Dystrophies - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Surgical intervention on any joint contractures (beyond Achilles tendon release surgery) is not recommended,
      given the high postoperative risk of fixed contractures with complete loss of range of motion in individuals
      with Bethlem muscular dystrophy who have undergone joint surgery.
    explanation: >-
      Bethlem-specific caution from the full GeneReviews chapter.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1503/?report=reader
    reference_title: Collagen VI-Related Dystrophies - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      A noninvasive approach that can help promote improved range of motion of the Achilles tendons is serial
      casting.
    explanation: >-
      Nonoperative alternative described by GeneReviews.
    quote_role: REVIEW_SYNTHESIS
- name: Nocturnal noninvasive ventilation
  description: >-
    Respiratory support is guided by upright/supine pulmonary testing and polysomnography, including carbon-dioxide
    monitoring. GeneReviews recommends initiation of nocturnal BiPAP when FVC is 60% predicted or lower, with
    pressures titrated during a sleep study. Respiratory weakness can require treatment while independent walking
    is retained.
  treatment_term:
    preferred_term: noninvasive ventilation
    term:
      id: NCIT:C171457
      label: Non-Invasive Mechanical Ventilation
  target_phenotypes:
  - preferred_term: Restrictive ventilatory defect
    term:
      id: HP:0002091
      label: Restrictive ventilatory defect
  evidence:
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BiPAP as needed to support nocturnal ventilation and prevent right heart strain"
    explanation: GeneReviews prescribes BiPAP for Bethlem muscular dystrophy as needed.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1503/?report=reader
    reference_title: Collagen VI-Related Dystrophies - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      For forced vital capacity (FVC) measurements of 60% predicted or lower, noninvasive ventilation (NIV)
      in the form of bilevel positive airway pressure (BiPAP) should be initiated during a polysomnogram –
      with pressures adjusted to ensure adequate ventilation – and then consistently used while sleeping.
    explanation: >-
      Bethlem-specific threshold in the treatment section.
    quote_role: REVIEW_SYNTHESIS
- name: Respiratory, cardiac, and orthopedic surveillance
  description: >-
    At least annual upright and supine FVC, sleep evaluation for hypoventilation, clinical/radiographic scoliosis
    assessment and rehabilitation review are recommended for Bethlem disease. Initial pulmonary testing begins
    in childhood, around age five when feasible. GeneReviews recommends annual ECG/echocardiography to assess
    secondary right-heart strain from inadequate ventilation; this does not imply primary cardiomyopathy is
    a characteristic Bethlem feature. Mobility-device needs and joint function should be reassessed over time.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory surveillance including annual pulmonary function tests (PFTs) in the upright and supine positions and polysomnogram for assessing for nocturnal hypoventilation"
    explanation: GeneReviews defines the respiratory surveillance schedule for Bethlem muscular dystrophy.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "annual cardiac evaluation with echocardiogram and EKG"
    explanation: GeneReviews prescribes annual cardiac surveillance.
    quote_role: REVIEW_SYNTHESIS
- name: Genetic counseling
  description: >-
    A person with an autosomal dominant pathogenic variant has a 50% transmission risk in each pregnancy; sibling
    risk is 50% when a parent is heterozygous. Parental somatic/germline mosaicism can complicate apparently
    de novo families, and clinical severity varies within families. For recessive disease with two carrier
    parents, each pregnancy has a 25% affected, 50% carrier and 25% noncarrier chance. Once familial variants
    are established, prenatal and preimplantation genetic testing are possible.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Parental somatic mosaicism (and concomitant germline mosaicism) is not uncommon in the autosomal dominant COL6-RDs."
    explanation: GeneReviews highlights parental mosaicism as a counseling consideration.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severity of COL6-RD manifestations may vary among family members who are heterozygous for the same pathogenic variant."
    explanation: GeneReviews notes intrafamilial variability, a key counseling point.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      If a parent of the proband has the pathogenic variant identified in the proband and/or is affected, the
      risk to the sibs of inheriting the variant is 50%. The severity of COL6-RD manifestations may vary among
      family members who are heterozygous for the same pathogenic variant.
    explanation: >-
      GeneReviews genetic-counseling guidance.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      If both parents are known to be heterozygous for a pathogenic variant, each sib of an affected individual
      has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and
      a 25% chance of being unaffected and not a carrier.
    explanation: >-
      GeneReviews genetic-counseling guidance.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301676
    reference_title: Collagen VI-Related Dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Once the COL6A1, COL6A2, or COL6A3 pathogenic variant(s) have been identified in an affected family member,
      prenatal testing for a pregnancy at increased risk and preimplantation genetic testing are possible.
    explanation: >-
      GeneReviews genetic-counseling guidance.
    quote_role: REVIEW_SYNTHESIS
- name: Cyclophilin D and permeability transition pore modulation
  description: >-
    Cyclosporin A is investigational for COL6 myopathy. A one-month open pilot in five patients (four UCMD
    and one Bethlem) showed improved mitochondrial and apoptotic biopsy readouts, without establishing functional
    benefit or long-term Bethlem efficacy. Genetic cyclophilin-D ablation supports the target in Col6a1-null
    mice. Immunosuppression and toxicity preclude treating a biopsy response as a routine-care recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cyclosporin A
      term:
        id: CHEBI:4031
        label: cyclosporin A
  target_mechanisms:
  - target: Myofibre mitochondrial dysfunction and permeability transition pore dysregulation
    treatment_effect: INHIBITS
    description: >-
      Investigational cyclophilin-D-dependent pore desensitization can improve mitochondrial biopsy readouts;
      functional and long-term benefit in Bethlem disease remains unproved.
    evidence:
    - reference: PMID:18362356
      reference_title: Cyclosporin A corrects mitochondrial dysfunction and muscle apoptosis in patients with collagen VI myopathies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "cyclosporin A, a widely used immunosuppressant that desensitizes the permeability transition pore independently of calcineurin inhibition"
      explanation: Names the molecular target and mechanism of the intervention.
      quote_role: BACKGROUND
    - reference: PMID:19293339
      reference_title: Genetic ablation of cyclophilin D rescues mitochondrial defects and prevents muscle apoptosis in collagen VI myopathic mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These findings (i) demonstrate that lack of Cyp-D is equivalent to its inhibition with CsA at curing
        the mouse dystrophic phenotype; (ii) establish a cause-effect relationship between Cyp-D-dependent
        PTP regulation and pathogenesis of the ColVI muscular dystrophy and (iii) validate Cyp-D and the PTP
        as pharmacological targets for the therapy of human ColVI myopathies.
      explanation: >-
        Target validation in the Col6a1-null mouse, not proof of efficacy in patients.
  evidence:
  - reference: PMID:18362356
    reference_title: Cyclosporin A corrects mitochondrial dysfunction and muscle apoptosis in patients with collagen VI myopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "report the results of an open pilot trial with cyclosporin A in five patients with collagen VI myopathies"
    explanation: An open pilot trial tested cyclosporin A in patients with collagen VI myopathies.
  - reference: PMID:18362356
    reference_title: Cyclosporin A corrects mitochondrial dysfunction and muscle apoptosis in patients with collagen VI myopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both of these pathologic signs were largely normalized after 1 month of oral cyclosporin A administration, which also increased muscle regeneration."
    explanation: >
      Biopsy endpoints improved, but muscle strength was not measured, so this is
      proof of mechanism rather than proof of clinical benefit.
- name: Investigational low-protein diet for autophagy modulation
  description: >-
    A one-year open, uncontrolled pilot enrolled eight adults and analyzed seven completers (six Bethlem, one
    UCMD). Muscle autophagy-associated markers increased and apoptosis decreased, but human flux was not directly
    quantified. The six ambulant Bethlem patients improved on the four-stair test; six-minute walk, ten-meter
    walk, strength and the mixed-group FVC change were not statistically significant. Participants lost about
    9% body weight and 7% lean mass despite preservation of the lean-to-fat percentage. The diet remains investigational
    and requires nutritional oversight; the study does not establish long-term clinical efficacy.
  treatment_term:
    preferred_term: Therapeutic Dietary Intervention
    term:
      id: NCIT:C64892
      label: Therapeutic Dietary Intervention
  target_mechanisms:
  - target: Defective autophagic clearance of damaged organelles
    treatment_effect: MODULATES
    description: >-
      Human muscle autophagy-associated markers increase during the exploratory diet intervention. Experimental
      mouse autophagy rescue motivates the approach, but a restoration of human flux or sustained clinical
      efficacy has not been established.
    evidence:
    - reference: PMID:21037586
      reference_title: Autophagy is defective in collagen VI muscular dystrophies, and its reactivation rescues myofiber degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Forced activation of autophagy by genetic, dietary and pharmacological approaches restored myofiber survival and ameliorated the dystrophic phenotype of Col6a1(-/-) mice."
      explanation: Demonstrates rescue of the dystrophic phenotype by autophagy reactivation in the Bethlem model.
    - reference: PMID:27656840
      reference_title: Autophagy activation in COL6 myopathic patients by a low-protein-diet pilot trial.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        After one y of low-protein diet, autophagic markers were increased in skeletal muscle and blood leukocytes
        of patients.
      explanation: >-
        Markers in seven completers; increased abundance does not directly measure human autophagic flux.
  evidence:
  - reference: PMID:27656840
    reference_title: Autophagy activation in COL6 myopathic patients by a low-protein-diet pilot trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      After one y of low-protein diet, autophagic markers were increased in skeletal muscle and blood leukocytes
      of patients.
    explanation: >-
      Markers in seven completers; increased abundance does not directly measure human autophagic flux.
  - reference: PMID:27656840
    reference_title: Autophagy activation in COL6 myopathic patients by a low-protein-diet pilot trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      During the trial, patients lost 9% body weight (4.17 ± 2.01 kg), 7% lean mass (2.26 ± 2.45 kg), and 8%
      fat mass (1.91 ± 3.15 kg).
    explanation: >-
      Absolute lean mass fell despite a stable lean-to-fat percentage.
  - reference: PMID:27656840
    reference_title: Autophagy activation in COL6 myopathic patients by a low-protein-diet pilot trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      (B) Timed 4-stair climb test (4 steps), measured in seconds (s). P = 0.034, following Wilcoxon signed
      rank test for paired data, for the comparison between mean values at T0 and T12.
    explanation: >-
      Exploratory paired functional result in six ambulant participants; other functional comparisons did not
      establish efficacy.
- name: Individualized moderate aerobic exercise
  description: >-
    Supervised individualized moderate exercise can complement stretching and mobility support. In a ten-week
    home-training study, four men improved peak oxygen uptake by 16% compared with baseline, while two controls
    did not improve. CK remained stable and functional tests did not change significantly. The small study
    supports feasibility and aerobic conditioning, without establishing long-term disease modification or safety
    of intense eccentric loading.
  treatment_term:
    preferred_term: Exercise Intervention
    term:
      id: NCIT:C62739
      label: Exercise Intervention
  evidence:
  - reference: PMID:31026058
    reference_title: Moderate-intensity aerobic exercise improves physical fitness in bethlem myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Six men with Bethlem myopathy were included (4 training; 2 controls).
    explanation: >-
      Small nonrandomized disease-specific exercise study.
  - reference: PMID:31026058
    reference_title: Moderate-intensity aerobic exercise improves physical fitness in bethlem myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Performance in functional tests did not change significantly. Creatine kinase values were stable during
      the study.
    explanation: >-
      Functional and safety limitations of the small training study.
- name: Pregnancy planning and pulmonary monitoring
  description: >-
    Pregnancy care includes close respiratory surveillance for changing ventilatory requirements and assessment
    of hip range of motion and muscle function to inform delivery planning. Management should account for the
    individual level of diaphragmatic and limb weakness.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1503/?report=reader
    reference_title: Collagen VI-Related Dystrophies - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      For a pregnant woman with COL6-RD, careful pulmonary surveillance during pregnancy for potential increased
      needs for ventilatory support is recommended, particularly given the disproportionate weakness of the
      diaphragm in the COL6-RDs.
    explanation: >-
      Full GeneReviews pregnancy guidance across COL6-related dystrophies.
    quote_role: REVIEW_SYNTHESIS

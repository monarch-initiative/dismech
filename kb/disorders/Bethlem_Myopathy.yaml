- name: Dermal collagen VI deficiency and abnormal wound healing
  biological_scale: TISSUE
  description: >
    Collagen VI is a component of the dermal matrix, and its deficiency or
    dysfunction produces the characteristic connective-tissue skin phenotype of
    the collagen VI-related myopathies: prominent keratosis pilaris (follicular
    hyperkeratosis) over the extensor surfaces, a propensity to abnormal keloid
    or atrophic ("cigarette paper") scarring, and soft velvety palmar skin. This
    dermatological signature is one of the features that separates Bethlem
    myopathy from other proximal myopathies at the bedside.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057

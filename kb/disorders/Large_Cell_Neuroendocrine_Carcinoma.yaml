animal_models:
- name: Quadruple tumour-suppressor knockout mouse (Rb1/Rbl1/Pten/Trp53)
  species: Mouse
  genotype: Rbl1-null; Rb1, Pten and Trp53 conditional alleles deleted by adenoviral Cre
  publication: PMID:31611390
  description: >-
    The first defined mouse model of LCNEC. In an Rbl1-null background, deletion
    of Rb1, Pten and Trp53 by broadly targeted Ad-CMVcre produces LCNEC, whereas
    the identical genetic lesion delivered to basal cells by Ad-K5cre produces
    small cell lung carcinoma instead. This makes cell of origin, not genotype,
    the determinant of which high-grade neuroendocrine carcinoma develops.
  modeled_mechanisms:
  - target: Loss of G1/S Cell-Cycle Checkpoint Control
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Combined Rb1/Rbl1/Trp53 inactivation reproduces the checkpoint-loss lesion
      that defines the SCLC-like branch of human LCNEC.
    limitations: >-
      The model adds Rbl1 (p130) and Pten inactivation, which are not
      established recurrent drivers of human LCNEC, so the genotype is broader
      than the human lesion set. The tumours are also induced synchronously in
      immunocompetent mice rather than arising through decades of carcinogen
      exposure.
    evidence:
    - reference: PMID:31611390
      reference_title: "Differential development of large-cell neuroendocrine or small-cell lung carcinoma upon inactivation of 4 tumor suppressor genes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In an Rbl1-null background, deletion of Rb1, Pten, and Trp53 floxed alleles after Ad-CMVcre infection in a wide variety of lung epithelial cells produces LCNEC."
      explanation: Establishes that this genotype and delivery route generate LCNEC in mice.
    - reference: PMID:31611390
      reference_title: "Differential development of large-cell neuroendocrine or small-cell lung carcinoma upon inactivation of 4 tumor suppressor genes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Molecular and transcriptomic analyses of both models revealed strong similarities to their human counterparts."
      explanation: Supports treating the model as informative for the human disease.
  - target: Neuroendocrine Lineage Programme Expression
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model reproduces the neuroendocrine carcinoma lineage and shows that
      restricting the same lesions to basal cells yields SCLC instead, directly
      demonstrating cell-of-origin control of the neuroendocrine phenotype.
    limitations: >-
      The experiment establishes that cell of origin determines which tumour
      type arises, but it does not model the ASCL1/DLL3/NOTCH transcriptional
      subgrouping that distinguishes human type I from type II LCNEC.
    evidence:
    - reference: PMID:31611390
      reference_title: "Differential development of large-cell neuroendocrine or small-cell lung carcinoma upon inactivation of 4 tumor suppressor genes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Meanwhile, inactivation of these genes using Ad-K5cre in basal cells leads to the development of SCLC, thus differentially influencing the lung cancer type developed."
      explanation: Demonstrates cell-of-origin control over the resulting neuroendocrine carcinoma type.
  evidence:
  - reference: PMID:31611390
    reference_title: "Differential development of large-cell neuroendocrine or small-cell lung carcinoma upon inactivation of 4 tumor suppressor genes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "So far, a defined model of LCNEC has not been reported."
    explanation: Establishes this as the first defined animal model of LCNEC.
discussions:
- discussion_id: lcnec_molecular_subtype_binary
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the type I / type II (or SCLC-like / NSCLC-like) molecular
    classification of LCNEC hold up as a binary, and should it direct first-line
    therapy prospectively?
  attaches_to:
  - "pathophysiology#RB1 Biallelic Inactivation"
  - "pathophysiology#STK11 and KEAP1 Biallelic Inactivation"
  rationale: >-
    The subgroup framework rests on retrospective cohorts, and the one
    treatment-relevant finding (RB1 wild-type tumours doing better with
    NSCLC-type than with SCLC-type chemotherapy) comes from a registry analysis,
    not a randomised trial. The two branches are reported as mutually exclusive
    in 82% of cases, which leaves a substantial residue that fits neither, and
    the discordance between the genomic label and the transcriptional phenotype
    suggests a continuum of neuroendocrine differentiation rather than two
    classes. The largest clinical genomic series to date makes the residue
    explicit: of 1,426 profiled LCNEC samples, 557 were SCLC-like, 530
    NSCLC-like, 25 carcinoid-like and 314 could not be classified at all. No
    prospective biomarker-stratified trial has yet tested assigning chemotherapy
    by RB1 status.
  evidence:
  - reference: PMID:38159439
    reference_title: "Real-World comprehensive genomic profiling data for diagnostic clarity in pulmonary Large-Cell neuroendocrine carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Under this schema, 530 samples were classified as NSCLC-like and 314 remained unclassified."
    explanation: >-
      Quantifies the proportion of LCNEC that does not fit either genomic
      subtype, which is the empirical basis for treating the binary as
      incomplete.
  proposed_experiments:
  - experiment_id: lcnec_rb1_stratified_chemotherapy_trial
    name: Prospective RB1-stratified chemotherapy trial in advanced LCNEC
    description: >-
      Randomise patients with advanced LCNEC to platinum-etoposide versus
      platinum plus gemcitabine or taxane, stratified prospectively by RB1
      mutation and Rb immunohistochemistry, with overall survival as the primary
      endpoint.
- discussion_id: lcnec_underdiagnosis_epidemiology
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the reported epidemiology of LCNEC is distorted by
    under-diagnosis on biopsy material?
  attaches_to:
  - "pathophysiology#Neuroendocrine Lineage Programme Expression"
  rationale: >-
    Neuroendocrine morphology is absent in roughly half of biopsies from tumours
    that prove to be LCNEC on resection, and registry-coded frequency (0.9% of
    lung cancers) is well below the pathology-reviewed estimate (about 3%).
    Population statistics on incidence, stage distribution and survival are
    therefore drawn from a systematically incomplete and probably
    resection-biased case set, and the apparent rise in incidence may partly
    reflect improving recognition rather than changing biology.
  proposed_experiments:
  - experiment_id: lcnec_population_pathology_rereview
    name: Central pathology re-review of a population-based lung cancer cohort
    description: >-
      Apply the validated two-of-three neuroendocrine immunohistochemistry rule
      to a consecutive population-based series of non-small cell lung cancers
      without obvious squamous or glandular differentiation, and compare the
      resulting LCNEC frequency and stage distribution against registry codes.

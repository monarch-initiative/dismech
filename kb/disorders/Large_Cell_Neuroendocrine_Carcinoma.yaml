pathophysiology:
- name: Tobacco Carcinogen Exposure and Smoking-Associated Mutagenesis
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Pulmonary LCNEC arises almost exclusively in older heavy smokers. Whole-exome
    and whole-genome sequencing shows a high exonic mutation rate dominated by
    C:G>A:T transversions and by COSMIC mutational signature 4, the canonical
    tobacco-carcinogen signature. This mutagenic burden is what generates the
    tumour-suppressor loss-of-function events that define both molecular
    subgroups.
  evidence:
  - reference: PMID:29535388
    reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On average, LCNECs exhibited an exonic mutation rate of 8.6 non-synonymous mutations per million base pairs and a C:G > A:T transversion rate of 38.7%"
    explanation: Quantifies the tobacco-type mutational burden in a genomically profiled LCNEC cohort.
  - reference: PMID:29535388
    reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LCNEC and SCLC are clinically aggressive tumors presenting in elderly heavy-smokers"
    explanation: Establishes heavy smoking as the near-universal clinical context of LCNEC.
  downstream:
  - target: TP53 Inactivation
    causal_link_type: DIRECT
    description: >-
      Carcinogen-induced mutagenesis produces the near-universal TP53
      loss-of-function events that initiate the LCNEC pathograph.
    evidence:
    - reference: PMID:29535388
      reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "TP53 was the most frequently mutated gene (92%)"
      explanation: Places TP53 loss as the dominant somatic event downstream of the smoking-driven mutational process.
- name: TP53 Inactivation
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Biallelic TP53 loss of function is the near-universal first hit in LCNEC,
    reported in 78% of tumours by targeted sequencing and 92% by whole-exome
    sequencing. Loss of p53 abrogates DNA-damage checkpoint control and
    apoptosis, licensing both the genomic instability and the second-hit
    bifurcation that follow.
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  evidence:
  - reference: PMID:26960398
    reference_title: "Next-Generation Sequencing of Pulmonary Large Cell Neuroendocrine Carcinoma Reveals Small Cell Carcinoma-like and Non-Small Cell Carcinoma-like Subsets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Commonly altered genes in LCNEC included TP53 (78%), RB1 (38%), STK11 (33%), KEAP1 (31%), and KRAS (22%)"
    explanation: Gives the mutation frequency of TP53 and of the genes defining the downstream branches.
  - reference: PMID:29535388
    reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TP53 was the most frequently mutated gene (92%)"
    explanation: Independent whole-exome confirmation that TP53 loss is near universal.
  downstream:
  - target: Mutator Phenotype and Chromosomal Instability
    causal_link_type: DIRECT
    description: Loss of p53-dependent damage surveillance permits accumulation of mutations and copy-number change.
  - target: RB1 Biallelic Inactivation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      TP53 loss is co-selected with RB1 loss in the SCLC-like/type II branch;
      the two are reported as co-mutated rather than sequentially causal.
    evidence:
    - reference: PMID:29535388
      reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "type II LCNECs bear TP53 and RB1 alterations"
      explanation: Establishes TP53 and RB1 as the co-occurring pair defining this branch.
  - target: STK11 and KEAP1 Biallelic Inactivation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      In the alternative branch TP53 loss is accompanied by STK11 and/or KEAP1
      inactivation rather than by RB1 loss.
    evidence:
    - reference: PMID:29535388
      reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "with bi-allelic TP53 and STK11/KEAP1 alterations (37%)"
      explanation: Defines the type I branch as TP53 plus STK11/KEAP1 rather than TP53 plus RB1.
- name: Mutator Phenotype and Chromosomal Instability
  biological_scale: MOLECULAR
  role: central_effector
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  description: >-
    Following p53 loss, LCNEC accumulates a high mutation burden together with
    recurrent focal amplifications (MYCL1 at 1p34, FGFR1 at 8p12, MYC at 8q24.21,
    NKX2-1 at 14q13) and deletions (CDKN2A at 9p21), i.e. the mutator phenotype
    and chromosomal instability that the genome-instability module describes.
  biological_processes:
  - preferred_term: DNA repair
    modifier: DECREASED
    term:
      id: GO:0006281
      label: DNA repair
  evidence:
  - reference: PMID:29535388
    reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analyses of chromosomal gene copy numbers revealed statistically significant amplifications of 1p34 (containing the MYCL1 gene, 12%), 8p12 (containing FGFR1, 7%), 8q24.21 (containing MYC, 5%)"
    explanation: Documents the recurrent copy-number changes that constitute chromosomal instability in LCNEC.
  - reference: PMID:35641209
    reference_title: "Comprehensive Characterization of the Genomic Landscape in Chinese Pulmonary Neuroendocrine Tumors Reveals Prognostic and Therapeutic Markers (CSWOG-1901)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Large cell neuroendocrine carcinoma (12.7 mutations/Mb) and SCLC (11.9 mutations/Mb) showed higher tumor mutational burdens than TC (2.4 mutations/Mb) and AC (7.1 mutations/Mb)"
    explanation: >-
      Quantifies the mutator phenotype, showing that LCNEC carries a tumour
      mutational burden comparable to SCLC and several-fold above the
      low- and intermediate-grade carcinoids.
  downstream:
  - target: High-Grade Proliferative Activity and Necrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Accumulated driver alterations converge on the high-grade proliferative phenotype.
- name: RB1 Biallelic Inactivation
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Biallelic RB1 inactivation, co-occurring with TP53 loss, defines the
    SCLC-like (Rekhtman) or type II (George) subgroup. RB1 mutation is reported
    in 38-47% of cases and loss of nuclear Rb protein in up to 72%. This branch
    is mutually exclusive with the STK11/KEAP1 branch. Note the counterintuitive
    transcriptional consequence: despite the SCLC-like genotype, type II tumours
    show reduced neuroendocrine marker expression.
  genes:
  - preferred_term: RB1
    term:
      id: hgnc:9884
      label: RB1
  evidence:
  - reference: PMID:26960398
    reference_title: "Next-Generation Sequencing of Pulmonary Large Cell Neuroendocrine Carcinoma Reveals Small Cell Carcinoma-like and Non-Small Cell Carcinoma-like Subsets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCLC-like (n = 18), characterized by TP53+RB1 co-mutation/loss and other SCLC-type alterations, including MYCL amplification"
    explanation: Defines the SCLC-like subset by TP53+RB1 co-alteration.
  - reference: PMID:29066508
    reference_title: "Molecular Subtypes of Pulmonary Large-cell Neuroendocrine Carcinoma Predict Chemotherapy Treatment Outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RB1 mutation and protein loss were detected in 47% (n = 37) and 72% (n = 78) of the cases, respectively."
    explanation: Gives the frequency of RB1 mutation and of Rb protein loss in a registry-based LCNEC cohort.
  - reference: PMID:29535388
    reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "somatic alterations of RB1 and STK11/KEAP1 were detected in 82% of the cases (n = 49) and occurred in a mutually exclusive fashion"
    explanation: Establishes that the RB1 and STK11/KEAP1 branches are mutually exclusive.
  - reference: PMID:38159439
    reference_title: "Real-World comprehensive genomic profiling data for diagnostic clarity in pulmonary Large-Cell neuroendocrine carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of RB1 and TP53 genomic alterations (GAs) were used to define a SCLC-like subtype (n = 557)."
    explanation: >-
      Confirms the TP53+RB1 SCLC-like subtype in a 1,426-sample clinical
      comprehensive genomic profiling series, far larger than the original
      discovery cohorts.
  downstream:
  - target: Loss of G1/S Cell-Cycle Checkpoint Control
    causal_link_type: DIRECT
    description: Loss of the Rb brake releases the G1/S restriction point.
  - target: NOTCH Pathway Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Type II (RB1-altered) tumours display a NOTCH-high, neuroendocrine-low
      transcriptional state; the mechanistic link between RB1 loss and NOTCH
      activity in LCNEC is correlative rather than established.
    evidence:
    - reference: PMID:29535388
      reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "type II LCNECs bear TP53 and RB1 alterations and differ from most SCLC tumors with reduced neuroendocrine markers, a pattern of ASCL1low/DLL3low/NOTCHhigh, and an upregulation of immune-related pathways"
      explanation: >-
        Reports the association of the RB1-altered subgroup with a NOTCH-high,
        neuroendocrine-low state. Curated as PARTIAL because the study
        establishes co-occurrence, not a causal mechanism.
- name: STK11 and KEAP1 Biallelic Inactivation
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Biallelic inactivation of STK11 (LKB1) and/or KEAP1, in the absence of RB1
    co-alteration, defines the NSCLC-like (Rekhtman) or type I (George)
    subgroup. STK11 loss deregulates LKB1-AMPK-mTOR energy sensing and KEAP1 loss
    constitutively activates NRF2 antioxidant signalling. This branch frequently
    also carries activating KRAS mutations.
  genes:
  - preferred_term: STK11
    term:
      id: hgnc:11389
      label: STK11
  - preferred_term: KEAP1
    term:
      id: hgnc:23177
      label: KEAP1
  - preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  evidence:
  - reference: PMID:26960398
    reference_title: "Next-Generation Sequencing of Pulmonary Large Cell Neuroendocrine Carcinoma Reveals Small Cell Carcinoma-like and Non-Small Cell Carcinoma-like Subsets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NSCLC-like (n = 25), characterized by the lack of coaltered TP53+RB1 and nearly universal occurrence of NSCLC-type mutations (STK11, KRAS, and KEAP1)"
    explanation: Defines the NSCLC-like subset by STK11/KRAS/KEAP1 alteration without TP53+RB1 co-alteration.
  - reference: PMID:29535388
    reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined with loss-of-heterozygosity (LOH), bi-allelic alterations of STK11 and KEAP1 were found in 37% of the cases"
    explanation: Quantifies biallelic STK11/KEAP1 alteration as the defining lesion of the type I subgroup.
  - reference: PMID:38159439
    reference_title: "Real-World comprehensive genomic profiling data for diagnostic clarity in pulmonary Large-Cell neuroendocrine carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These NSCLC-like subtype-defining GAs included SMARCA4, KRAS, FGF3/4/19, STK11, CDKN2A/B, MTAP, and CCND1."
    explanation: >-
      Extends the NSCLC-like lesion set beyond STK11/KEAP1/KRAS in a large
      clinical genomic profiling cohort.
  downstream:
  - target: Neuroendocrine Lineage Programme Expression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The type I subgroup retains a high neuroendocrine transcriptional
      programme (ASCL1-high, DLL3-high, NOTCH-low). The association is
      transcriptomic; no causal mechanism from STK11/KEAP1 loss to lineage state
      has been demonstrated in LCNEC.
    evidence:
    - reference: PMID:29535388
      reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "While type I LCNECs and SCLCs exhibit a neuroendocrine profile with ASCL1high/DLL3high/NOTCHlow"
      explanation: >-
        Associates the type I subgroup with the high-neuroendocrine
        transcriptional state. PARTIAL because the link is correlative.
- name: Loss of G1/S Cell-Cycle Checkpoint Control
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: "evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control"
  description: >-
    Combined TP53 and RB1 inactivation removes both the p53 damage checkpoint and
    the Rb-enforced G1/S restriction point, the canonical
    evading-growth-suppressors lesion. In LCNEC this is the SCLC-like branch and
    is accompanied by measurably higher proliferative activity than in the
    STK11/KEAP1 branch.
  biological_processes:
  - preferred_term: G1/S transition of mitotic cell cycle
    modifier: INCREASED
    term:
      id: GO:0000082
      label: G1/S transition of mitotic cell cycle
  evidence:
  - reference: PMID:26960398
    reference_title: "Next-Generation Sequencing of Pulmonary Large Cell Neuroendocrine Carcinoma Reveals Small Cell Carcinoma-like and Non-Small Cell Carcinoma-like Subsets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "higher proliferative activity in SCLC-like tumors (P < 0.0001)"
    explanation: Demonstrates that the TP53+RB1 branch translates into a measurably higher proliferative rate.
  downstream:
  - target: High-Grade Proliferative Activity and Necrosis
    causal_link_type: DIRECT
    description: Loss of checkpoint control produces the defining high mitotic rate.
- name: Neuroendocrine Lineage Programme Expression
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    LCNEC expresses a neuroendocrine differentiation programme demonstrable as
    chromogranin A, synaptophysin and CD56 immunoreactivity, and
    transcriptionally as ASCL1 and DLL3 expression in the neuroendocrine-high
    subgroup. This programme, not the genomic lesion set, is what places LCNEC
    transcriptionally closest to small cell lung carcinoma and justifies its WHO
    classification as a neuroendocrine carcinoma rather than an NSCLC variant.
    DLL3 expression in this branch is the rationale for DLL3-directed therapy.
  cell_types:
  - preferred_term: pulmonary neuroendocrine cell
    term:
      id: CL:1000223
      label: pulmonary neuroendocrine cell
  biological_processes:
  - preferred_term: neuroendocrine cell differentiation
    term:
      id: GO:0061101
      label: neuroendocrine cell differentiation
  genes:
  - preferred_term: ASCL1
    term:
      id: hgnc:738
      label: ASCL1
  - preferred_term: DLL3
    term:
      id: hgnc:2909
      label: DLL3
  evidence:
  - reference: PMID:29535388
    reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "instead LCNECs form distinct transcriptional subgroups with closest similarity to SCLC"
    explanation: Establishes that LCNEC's transcriptional identity is neuroendocrine and SCLC-proximate.
  - reference: PMID:30485478
    reference_title: "Is the sum of positive neuroendocrine immunohistochemical stains useful for diagnosis of large cell neuroendocrine carcinoma (LCNEC) on biopsy specimens?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "positive staining for greater than or equal to two of three neuroendocrine IHC markers increased the sensitivity for LCNEC from 47% to 93% on paired biopsy specimens"
    explanation: Shows that the neuroendocrine programme is demonstrable immunohistochemically and is diagnostically decisive.
  downstream:
  - target: High-Grade Proliferative Activity and Necrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The neuroendocrine programme accompanies, rather than causes, the
      high-grade phenotype; both are required for the diagnosis.
- name: NOTCH Pathway Dysregulation
  biological_scale: MOLECULAR
  role: modifier
  description: >-
    Inactivating NOTCH-family mutations occur in about a quarter of NSCLC-like
    LCNEC, and NOTCH pathway activity is high in the type II subgroup that shows
    low neuroendocrine marker expression. NOTCH signalling is an established
    regulator of the neuroendocrine-versus-non-neuroendocrine fate switch in lung
    epithelium, which makes it the most plausible link between the genomic
    subgroups and their divergent lineage states.
  biological_processes:
  - preferred_term: Notch signaling pathway
    term:
      id: GO:0007219
      label: Notch signaling pathway
  evidence:
  - reference: PMID:26960398
    reference_title: "Next-Generation Sequencing of Pulmonary Large Cell Neuroendocrine Carcinoma Reveals Small Cell Carcinoma-like and Non-Small Cell Carcinoma-like Subsets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "more frequent mutations in NOTCH family genes (28%), implicated as key regulators of neuroendocrine differentiation"
    explanation: Quantifies NOTCH-family mutation in LCNEC and names its role in neuroendocrine differentiation.
  downstream:
  - target: Neuroendocrine Lineage Programme Expression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      NOTCH activity is inversely associated with neuroendocrine marker
      expression across the LCNEC subgroups.
- name: High-Grade Proliferative Activity and Necrosis
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    A mitotic rate above 10 mitoses per 2 square millimetres together with
    extensive, often geographic necrosis is a defining diagnostic criterion of
    LCNEC and separates it from the low-grade (typical carcinoid) and
    intermediate-grade (atypical carcinoid) neuroendocrine tumours.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:28572122
    reference_title: "Chemotherapy for pulmonary large cell neuroendocrine carcinomas: does the regimen matter?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a subtype of lung cancer with neuroendocrine morphology, neuroendocrine differentiation on immunohistochemistry, a high mitotic rate"
    explanation: States the defining combination of neuroendocrine features with a high mitotic rate.
  downstream:
  - target: Local Tumour Growth with Central or Peripheral Presentation
    causal_link_type: DIRECT
    description: Unrestrained proliferation produces the expanding primary mass.
  - target: Early Metastatic Dissemination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The high-grade phenotype underlies the characteristic early and widespread dissemination.
- name: Local Tumour Growth with Central or Peripheral Presentation
  biological_scale: TISSUE
  role: consequence
  description: >-
    The primary tumour grows as either a peripheral mass, which is the majority
    pattern, or a central tumour invading the segmental or lobar bronchus. The
    distinction is prognostically and biologically real: central tumours are more
    strongly associated with smoking, present at higher stage and larger size,
    and carry markedly worse survival, while peripheral tumours more often retain
    Rb protein and harbour EGFR mutations.
  cell_types:
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  evidence:
  - reference: PMID:29413048
    reference_title: "Distinct clinicopathologic features, genomic characteristics and survival of central and peripheral pulmonary large cell neuroendocrine carcinoma: From different origin cells?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The tumors with invasion of the segmental and/or lobar bronchus were classified as central LCNEC and those without as peripheral LCNEC."
    explanation: Defines the central versus peripheral growth patterns by bronchial invasion.
  - reference: PMID:29413048
    reference_title: "Distinct clinicopathologic features, genomic characteristics and survival of central and peripheral pulmonary large cell neuroendocrine carcinoma: From different origin cells?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of LCNEC proved to be of the peripheral type (64.3%, 81/126). Central tumors were associated with smoking habit (p = 0.047), higher TNM-stage (p = 0.014) and larger tumor size (p < 0.001)."
    explanation: Quantifies the peripheral predominance and the clinical correlates of central growth.
  downstream:
  - target: Lung Neoplasm
    causal_link_type: DIRECT
    description: The expanding primary constitutes the clinically detected lung neoplasm.
- name: Early Metastatic Dissemination
  biological_scale: ORGANISM
  role: consequence
  conforms_to: "invasion_and_metastasis#Metastatic Colonization"
  description: >-
    LCNEC disseminates early and widely. In population data the majority of
    patients present at stage IV, and brain metastasis is more frequent than in
    either small cell or non-small cell lung cancer, making the central nervous
    system a characteristic site of colonisation.
  evidence:
  - reference: PMID:31601526
    reference_title: "Large-Cell Neuroendocrine Carcinoma of the Lung: A Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LCNEC was more common among male subjects, and disease usually presented at stage IV (55%)"
    explanation: Establishes that most patients present with disseminated disease.
  - reference: PMID:31601526
    reference_title: "Large-Cell Neuroendocrine Carcinoma of the Lung: A Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain metastasis occurred more frequently in LCNEC (19.2%) than SCLC (16.7%, P < .001) or NSCLC (13%, P < .001)"
    explanation: Documents the disproportionate brain tropism of LCNEC.
  downstream:
  - target: Brain Metastasis
    causal_link_type: DIRECT
    description: >-
      Colonisation of the central nervous system produces the brain metastases
      that are disproportionately frequent in LCNEC.

environmental:
- name: Tobacco smoking
  description: >-
    Heavy tobacco smoking is the dominant environmental risk factor for pulmonary
    LCNEC. Sequencing confirms a dominant tobacco mutational signature in these
    tumours.
  influences_mechanisms:
  - target: Tobacco Carcinogen Exposure and Smoking-Associated Mutagenesis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Chronic smoking is the exposure that generates the carcinogen-driven
      mutational process initiating LCNEC.
    evidence:
    - reference: PMID:29535388
      reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "LCNEC and SCLC are clinically aggressive tumors presenting in elderly heavy-smokers"
      explanation: Establishes heavy smoking as the population context in which LCNEC arises.
  evidence:
  - reference: PMID:29535388
    reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which confirmed a prominent smoking-related signature (signature 4"
    explanation: Confirms the tobacco mutational signature as the dominant mutational process in LCNEC.
  notes: >-
    Left without an `exposure_term` binding pending an ECTO lookup for a
    tobacco-smoke exposure class; the mechanism link is what places this exposure
    in the pathograph.
prevalence:
- population: United States (SEER 2010-2015, lung primaries)
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >-
    LCNEC accounted for 1681 of 195,148 lung cancer cases (0.9%) in SEER
    2010-2015. Other series place it at approximately 3% of lung malignancies;
    the difference reflects registry coding versus panel-reviewed pathology, and
    LCNEC is known to be underdiagnosed on biopsy. Recorded as a proportion of
    lung cancers, not as a population rate, because the sources report it that
    way.
  evidence:
  - reference: PMID:31601526
    reference_title: "Large-Cell Neuroendocrine Carcinoma of the Lung: A Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 195,148 cases of lung cancer, including 1681 (0.9%) cases of LCNEC, were analyzed."
    explanation: Gives the registry-based share of lung cancers diagnosed as LCNEC.
- population: Resected lung cancers (European genomic cohort)
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: LCNEC as a proportion of resected lung cancers.
  evidence:
  - reference: PMID:29535388
    reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LCNECs account for 2–3% of all resected lung cancers"
    explanation: Independent estimate of LCNEC frequency among resected lung cancers.
epidemiology:
- name: Rising incidence and mortality
  description: >-
    The recorded incidence of LCNEC has been rising, driven mainly by stage IV
    disease, and annual mortality doubled over the period studied in SEER. Part
    of this trend may reflect improving pathological recognition rather than
    changing biology; see the under-diagnosis knowledge gap.
  evidence:
  - reference: PMID:31601526
    reference_title: "Large-Cell Neuroendocrine Carcinoma of the Lung: A Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Incidence increased by 0.011 people per 100,000 per year, primarily of stage IV disease. Annual mortality from LCNEC doubled over the time period studied."
    explanation: Documents the rising incidence and mortality of LCNEC.
- name: Marked male predominance and later-middle-age onset
  description: >-
    A single-centre surgical series of 62 patients was 95% male with a mean age
    of 60.3 years, an extreme sex skew consistent with the historical
    distribution of heavy smoking. Registry data show the same direction of
    effect more moderately, so the 95% figure should be read as a single-centre
    observation rather than a population estimate.
  evidence:
  - reference: PMID:32584230
    reference_title: "Characteristics of Patients with Large-Cell Neuroendocrine Carcinoma of the Lung."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients were predominantly (95%) men (male:female=59:3) with their average age being 60.3±8.6 years."
    explanation: Gives the sex ratio and mean age at diagnosis in a surgical LCNEC series.
- name: Survival by central versus peripheral tumour location
  description: >-
    Tumour location is a strong independent prognostic factor, with peripheral
    tumours surviving markedly longer than central ones.
  evidence:
  - reference: PMID:29413048
    reference_title: "Distinct clinicopathologic features, genomic characteristics and survival of central and peripheral pulmonary large cell neuroendocrine carcinoma: From different origin cells?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peripheral tumors had better survival compared with central tumors (median OS: 4.04 vs. 1.51 years, p < 0.001)."
    explanation: Quantifies the survival difference between central and peripheral LCNEC.
progression:
- phase: Stage-dependent divergent clinical behaviour
  notes: >-
    An unusual and clinically important feature of LCNEC is that its natural
    history tracks non-small cell lung cancer at stages I-III but small cell lung
    cancer at stage IV. Overall survival is poor, with five-year survival below
    15-25% in genomically characterised cohorts.
  evidence:
  - reference: PMID:31601526
    reference_title: "Large-Cell Neuroendocrine Carcinoma of the Lung: A Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Survival in patients with stage I-III LCNEC mirrored survival trends of patients with NSCLC, whereas stage IV LCNEC behaved similarly to SCLC."
    explanation: States the stage-dependent divergence in clinical behaviour.
  - reference: PMID:29535388
    reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with 5-year survival rates below 15–25% (LCNEC) and 5% (SCLC), respectively"
    explanation: Gives the five-year survival range for LCNEC.
diagnosis:
- name: Combined morphologic and immunohistochemical diagnosis
  description: >-
    Diagnosis requires neuroendocrine morphology, a high mitotic rate and
    neuroendocrine differentiation confirmed by immunohistochemistry (CD56,
    chromogranin A, synaptophysin). Because neuroendocrine morphology is often
    absent on small biopsies, positivity for at least two of three neuroendocrine
    markers substantially improves sensitivity and is the practical diagnostic
    rule on biopsy material.
  evidence:
  - reference: PMID:30485478
    reference_title: "Is the sum of positive neuroendocrine immunohistochemical stains useful for diagnosis of large cell neuroendocrine carcinoma (LCNEC) on biopsy specimens?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In NSCLC devoid of obvious morphological squamous or adenocarcinoma features, positive staining in greater than or equal to two of three neuroendocrine IHC stains supports the diagnosis of LCNEC."
    explanation: States the operational immunohistochemical diagnostic rule for biopsy specimens.
  - reference: PMID:30485478
    reference_title: "Is the sum of positive neuroendocrine immunohistochemical stains useful for diagnosis of large cell neuroendocrine carcinoma (LCNEC) on biopsy specimens?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "further validated using an independent TMA of LCNEC and NSCLC with sensitivity and specificity of 80% and 99%, respectively"
    explanation: Gives the validated performance of the two-of-three marker rule.
differential_diagnoses:
- name: Small cell lung carcinoma
  description: >-
    The principal differential. SCLC shares neuroendocrine differentiation and
    the TP53+RB1 genotype but differs in cytology (small cells, scant cytoplasm,
    nuclear moulding, inconspicuous nucleoli). Transcriptionally LCNEC sits
    closest to SCLC, which is why the distinction rests on cytomorphology rather
    than on marker expression.
  disease_term:
    preferred_term: small cell lung carcinoma
    term:
      id: MONDO:0008433
      label: small cell lung carcinoma
  evidence:
  - reference: PMID:29535388
    reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "instead LCNECs form distinct transcriptional subgroups with closest similarity to SCLC"
    explanation: Establishes the transcriptional proximity that makes SCLC the key differential.
- name: Atypical carcinoid
  description: >-
    The intermediate-grade neuroendocrine tumour. Shares neuroendocrine
    morphology and marker expression but is separated from LCNEC by mitotic rate
    and necrosis; a small minority of LCNEC-diagnosed tumours are genomically
    carcinoid-like, which is a recognised classification boundary problem.
  evidence:
  - reference: PMID:26960398
    reference_title: "Next-Generation Sequencing of Pulmonary Large Cell Neuroendocrine Carcinoma Reveals Small Cell Carcinoma-like and Non-Small Cell Carcinoma-like Subsets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and carcinoid-like (n = 2), characterized by MEN1 mutations and low mutation burden"
    explanation: Documents the genomically carcinoid-like minority within histologically diagnosed LCNEC.
treatments:
- name: Platinum-Etoposide Chemotherapy
  description: >-
    Small cell lung cancer-type chemotherapy, historically the default first-line
    regimen for advanced LCNEC by extrapolation from SCLC. Note that its
    superiority is not established, and in RB1 wild-type tumours it performs
    worse than NSCLC-type chemotherapy.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
    - preferred_term: etoposide

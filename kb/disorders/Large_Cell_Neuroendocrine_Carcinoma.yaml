name: Large Cell Neuroendocrine Carcinoma
creation_date: "2026-08-19T21:10:00Z"
description: >-
  Large cell neuroendocrine carcinoma (LCNEC) is a rare, high-grade, poorly
  differentiated neuroendocrine carcinoma composed of large malignant epithelial
  cells that combine neuroendocrine morphology (organoid nesting, palisading,
  rosettes) with immunohistochemically demonstrable neuroendocrine
  differentiation, a high mitotic rate and extensive necrosis. The lung is the
  prototype and best-studied site, where LCNEC accounts for roughly 1-3% of lung
  cancers and arises almost exclusively in older heavy smokers, but the entity is
  also recognised at many extrapulmonary sites. Genomically LCNEC is not one
  disease: near-universal TP53 inactivation is followed by a bifurcation into a
  TP53+RB1 co-altered (SCLC-like, or type II) group and a STK11/KEAP1-altered
  (NSCLC-like, or type I) group, which are largely mutually exclusive and which
  differ in neuroendocrine transcriptional programme and in chemotherapy
  outcome. Clinically LCNEC behaves like non-small cell lung cancer at stages
  I-III and like small cell lung cancer at stage IV, and prognosis is poor.
category: Neoplastic
categories:
- Solid Tumor
- Neuroendocrine Neoplasm
- Thoracic Malignancy
parents:
- Neuroendocrine Carcinoma
synonyms:
- LCNEC
- large cell NEC
- large-cell neuroendocrine carcinoma
- high-grade neuroendocrine carcinoma, large cell type
disease_term:
  preferred_term: large cell neuroendocrine carcinoma
  term:
    id: MONDO:0005057
    label: large cell neuroendocrine carcinoma
notes: >-
  Scope. This entry is the site-agnostic LCNEC entity (MONDO:0005057), whose
  MONDO children are the organ-specific LCNECs modelled here under
  `has_subtypes`. Because the overwhelming majority of the mechanistic and
  clinical literature concerns the pulmonary form, the pathograph and the
  treatment/prevalence sections are pulmonary-anchored and say so; extrapulmonary
  LCNEC is captured as subtypes plus a site-specific treatment entry rather than
  by silently generalising lung data. Thymic LCNEC (MONDO:0003047) is already
  curated in depth as a `has_subtypes` facet of
  `kb/disorders/Thymic_Neuroendocrine_Carcinoma.yaml`; it is listed here as a
  subtype for completeness and deliberately not re-derived.

  Deep research. `just research-disorder falcon` was attempted first (the repo
  default) and failed with HTTP 402 Payment Required from the Edison API, so no
  falcon report exists for this entry. Two providers did complete and both
  reports are committed: `claude_code` (35/35 references resolved, confabulation
  rate 0.0, 0 off topic) and `openscientist` (49/49 resolved, 7/7 quoted claims
  found in source, 0 off topic). NEC preflight against MONDO:0005057 returned
  SKIP for both, because MONDO records no causal gene for a sporadic carcinoma;
  the manual fallback was therefore run - the reports' top-mentioned genes are
  the expected TP53/RB1/STK11/KEAP1/ASCL1 set, MONDO:0005057 carries no OMIM
  xref to contradict, and the flagged acronym "LCNEC" names no other MONDO
  entity.

  Despite validating cleanly, the claude_code report proposed three incorrect
  ontology identifiers, which were caught and not used: KEAP1 as HGNC:6396
  (correct: hgnc:23177), pulmonary neuroendocrine cell as CL:0002251 (correct:
  CL:1000223), and the disease itself as a MONDO:0018316-class term (correct:
  MONDO:0005057). Every identifier in this entry was independently re-resolved
  with OAK. Reference validation checks that a citation resolves, not that an
  ontology term is real - this is the standard treat-DR-as-leads discipline, not
  an incidental problem with one report.

  Phenotypes deliberately not curated. Cough, haemoptysis, dyspnoea and
  constitutional weight loss are the typical presenting features of LCNEC as of
  any thoracic malignancy, and earlier drafts of this entry carried them. They
  were removed because none of the sources available here actually documents or
  quantifies them in LCNEC specifically - the only snippets that could be
  attached were general statements about LCNEC being aggressive, which do not
  support a symptom claim. They are recorded in prose here instead of being
  given evidence items that do not say what they are cited for. The curated
  phenotypes are limited to the two that are directly evidenced (the lung
  primary, and brain metastasis at 19.2%); a clinical series that quantifies
  presenting symptoms would be the right basis for adding the rest.

  Type I / type II naming. The two large genomic studies use opposite-sounding
  labels for overlapping groups and this entry preserves both rather than
  flattening them: Rekhtman's SCLC-like group (TP53+RB1 co-altered) corresponds
  to George's type II, and Rekhtman's NSCLC-like group (STK11/KRAS/KEAP1)
  corresponds to George's type I. Counterintuitively it is George's type I, the
  group named for NSCLC-type genomic lesions, that carries the higher
  neuroendocrine transcriptional programme (ASCL1high/DLL3high/NOTCHlow), while
  type II shows reduced neuroendocrine markers. Curators should not correct this
  apparent inversion; it is what the sources report.

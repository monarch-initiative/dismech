    snippet: "LCNECs account for 2–3% of all resected lung cancers and belong to the category of neuroendocrine lung tumors"
    explanation: Establishes the pulmonary form as a defined entity within neuroendocrine lung tumours.
- name: Combined Pulmonary LCNEC
  display_name: Lung combined large cell neuroendocrine carcinoma
  description: >-
    Pulmonary LCNEC admixed with a non-neuroendocrine component (adenocarcinoma
    or squamous cell carcinoma) or with small cell carcinoma. Notably the RB1
    alterations of the LCNEC component are frequently shared with the combined
    component, arguing for a common clonal origin rather than collision tumours.
  subtype_term:
    preferred_term: lung combined large cell neuroendocrine carcinoma
    term:
      id: MONDO:0004142
      label: lung combined large cell neuroendocrine carcinoma
  evidence:
  - reference: PMID:29535388
    reference_title: "Integrative genomic profiling of large-cell neuroendocrine carcinomas reveals distinct subtypes of high-grade neuroendocrine lung tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nineteen of 75 LCNECs included in this study showed additional histological components of lung adenocarcinoma (ADC) (n = 2), squamous cell carcinoma (SqCC) (n = 5) or SCLC (n = 12)"
    explanation: Quantifies the combined histology subtype within a genomically characterised LCNEC cohort.
- name: Thymic LCNEC

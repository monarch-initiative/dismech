histopathology:
- name: Neuroendocrine Morphology with High Mitotic Rate and Necrosis
  description: >-
    Organoid nesting, palisading and rosette-like structures with large cells,
    abundant cytoplasm and prominent nucleoli, combined with a mitotic rate above
    10 per 2 square millimetres and extensive necrosis. Neuroendocrine morphology
    is frequently not appreciable on small biopsies, which is the main reason
    LCNEC is underdiagnosed pre-operatively.
  evidence:
  - reference: PMID:30485478
    reference_title: "Is the sum of positive neuroendocrine immunohistochemical stains useful for diagnosis of large cell neuroendocrine carcinoma (LCNEC) on biopsy specimens?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroendocrine morphology was absent in 53% (n = 17 of 32) of paired biopsy specimens"
    explanation: Quantifies how often the defining morphology is missing on biopsy material.
  - reference: PMID:30485478
    reference_title: "Is the sum of positive neuroendocrine immunohistochemical stains useful for diagnosis of large cell neuroendocrine carcinoma (LCNEC) on biopsy specimens?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LCNEC is difficult to diagnose because neuroendocrine morphology is frequently absent in biopsy specimens."
    explanation: States the diagnostic consequence of the morphology being biopsy-dependent.

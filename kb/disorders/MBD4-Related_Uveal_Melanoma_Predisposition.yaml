diagnosis:
- name: Germline MBD4 testing in uveal melanoma
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    The predisposition is identified by germline MBD4 testing of a person with
    uveal melanoma, or by cascade testing of relatives once a familial variant is
    known. A hypermutated, CpG>TpG-dominant, monosomy-3 tumor is a clue to
    MBD4 deficiency, but somatic MBD4 inactivation also occurs, so germline
    status needs a constitutional sample. Practice differs between guidelines:
    NCCN lists MBD4 among the uveal melanoma testing genes and ASCO recommends
    BAP1 alone (per a secondary report; the guideline texts were not read for
    this entry). MBD4 was absent from older multigene panels, so an earlier
    negative panel does not exclude a carrier state.
  evidence:
  - reference: PMID:42415513
    reference_title: "Impact of Multigene Panel Testing in High-Risk Uveal Melanoma Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, the NCCN UM genetic testing guidelines list five genes: BAP1, BRCA1, BRCA2, PALB2, and MBD4, to be associated with genetic predisposition to UM, while the ASCO guidelines recommend testing for only a single gene, BAP1"
    explanation: Secondary report of the NCCN and ASCO testing recommendations.
  - reference: PMID:42415513
    reference_title: "Impact of Multigene Panel Testing in High-Risk Uveal Melanoma Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, MBD4 and other recently implicated UM predisposition genes were not included on earlier versions of the testing panels."
    explanation: Supports the caution about earlier negative panels.
  - reference: PMID:42060275
    reference_title: "Prevalence of the Predisposing Gene MBD4 for Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This reinforces a strategy of broad patient screening given the therapeutic implications and the consequences of genetic counseling."
    explanation: Authors' recommendation of broad germline screening of uveal melanoma patients.
  - reference: PMID:42788773
    reference_title: "Survival of Patients With MBD4-Mutated Metastatic Uveal Melanoma Treated With Immune Checkpoint Inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Beyond clinical implications, our findings argue for systematic testing of MBD4 status in uveal melanoma, ideally through both somatic and germline analyses."
    explanation: Supports testing both tumor and constitutional DNA.
treatments:
- name: Immune Checkpoint Blockade for Metastatic MBD4-Deficient Uveal Melanoma
  description: >-
    Anti-PD-1 monotherapy or anti-PD-1 with anti-CTLA-4 for metastatic disease.
    In unselected metastatic uveal melanoma, response rates are below 5%; in
    MBD4-deficient tumors, a retrospective series of 12 patients (most of them
    germline carriers, some with somatic MBD4 loss only) reported a 50% response
    rate, and in a 300-patient retrospective cohort 3 of 5 MBD4-mutated patients
    responded against 4% of wild-type. The evidence is retrospective and rests on
    small numbers, and how checkpoint blockade should be sequenced with
    tebentafusp in HLA-A*02:01-positive carriers is unresolved.
  treatment_term:
    preferred_term: immune checkpoint inhibitor therapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
    - preferred_term: nivolumab
      term:
        id: NCIT:C68814
        label: Nivolumab
    - preferred_term: ipilimumab
      term:
        id: NCIT:C2654
        label: Ipilimumab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  target_mechanisms:
  - target: CpG>TpG Hypermutator Phenotype in Uveal Melanoma
  evidence:
  - reference: PMID:42788773
    reference_title: "Survival of Patients With MBD4-Mutated Metastatic Uveal Melanoma Treated With Immune Checkpoint Inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall response rate was 50% (two complete, four partial) with a disease control rate of 83%."
    explanation: Response in 12 MBD4-mutated metastatic patients treated with checkpoint inhibitors.
  - reference: PMID:42788773
    reference_title: "Survival of Patients With MBD4-Mutated Metastatic Uveal Melanoma Treated With Immune Checkpoint Inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 25 patients carrying germline MDB4 mutations (n = 25/29, 86.2%) and five with somatic alterations of MBD4 (13.8%), among whom 18 presented with metastases (62%)."
    explanation: Most patients in the source population were germline carriers (the "MDB4" typo is the source's).
  - reference: PMID:42788773
    reference_title: "Survival of Patients With MBD4-Mutated Metastatic Uveal Melanoma Treated With Immune Checkpoint Inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike cutaneous melanoma, metastatic uveal melanoma (mUM) generally responds poorly to immunotherapy, with reported response rates of <5% in unselected populations."
    explanation: Baseline response rate in unselected metastatic uveal melanoma, for comparison.
  - reference: PMID:35863105
    reference_title: "MBD4 deficiency is predictive of response to immune checkpoint inhibitors in metastatic uveal melanoma patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MBD4 mutation was associated with a better objective response rate as three out of five MBD4m versus 4% of MBD4 wild-type patients responded"
    explanation: Comparative response rate in a 300-patient metastatic cohort; germline and somatic MBD4 mutations are not separated in the quoted result.
  - reference: PMID:29760383
    reference_title: "Outlier response to anti-PD1 in uveal melanoma reveals germline MBD4 mutations in hypermutated tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present a metastatic uveal melanoma patient with an exceptional high sensitivity to a PD-1 inhibitor associated with outlier CpG>TpG mutation burden, MBD4 germline deleterious mutation, and somatic MBD4 inactivation in the tumor."
    explanation: The index germline carrier whose response led to the discovery.
  - reference: PMID:30714079
    reference_title: "Prolonged stable disease in a uveal melanoma patient with germline MBD4 nonsense mutation treated with pembrolizumab and ipilimumab."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient experienced stable disease (10 months) and survived 2 years with metastatic disease, which is twice as long as median survival."
    explanation: An independent germline carrier with prolonged disease control on combination checkpoint blockade.
  - reference: PMID:42788773
    reference_title: "Survival of Patients With MBD4-Mutated Metastatic Uveal Melanoma Treated With Immune Checkpoint Inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Another major question is the choice of the first systemic line in HLA-A02:01–positive, MBD4-mutated cases, as tebentafusp is currently the recommended standard."
    explanation: The unresolved sequencing question with tebentafusp.
- name: Genetic Counseling and Cascade Testing of Relatives
  description: >-
    Dominant counselling: first-degree relatives of a carrier have a 50% chance
    of carrying the variant. Because absolute risk is low and no
    heterozygote-specific surveillance protocol was found in the sources cited
    here, counselling centres on testing relatives and on informing tumor
    management if uveal melanoma develops. Relatives of a biallelic MBD4-TPDS
    proband who carry one familial variant are counselled about the same uveal
    melanoma risk.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:42594245
    reference_title: "MBD4-Related Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the MBD4 pathogenic variants have been identified in an affected family member, heterozygote testing for at-risk relatives and prenatal/preimplantation genetic testing are possible."
    explanation: GeneReviews statement that heterozygote testing of relatives is available once the familial variant is known.
  - reference: PMID:38060262
    reference_title: "Familial uveal melanoma and other tumors in 25 families with monoallelic germline MBD4 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further genetic testing in relatives combined with molecular tumor analyses will help define the tumor spectrum and estimate each tumor's risk."
    explanation: Carrier-series authors recommend testing relatives.
differential_diagnoses:
- name: BAP1 tumor predisposition syndrome
  description: >-
    The other established germline uveal melanoma predisposition, and the one
    with higher penetrance.
  distinguishing_features:
  - Uveal melanoma penetrance is much higher in BAP1 carriers than in MBD4 heterozygotes.
  - A CpG>TpG hypermutated tumor points to MBD4 deficiency.
  - In neither predisposition is uveal melanoma onset shifted earlier than in non-carriers.
  evidence:
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, the same is observed in germline BAP1-mutant carriers, even with the high penetrance in that context (6,23)."
    explanation: Contrasts BAP1's high penetrance with MBD4 while noting the shared absence of early onset.
- name: MBD4-Related Tumor Predisposition Syndrome
  description: >-
    The autosomal recessive MBD4 disease caused by biallelic loss of function,
    with a constitutional mutator state.
  disease_term:
    preferred_term: tumor predisposition syndrome 2
    term:
      id: MONDO:0859267
      label: tumor predisposition syndrome 2
  distinguishing_features:
  - Biallelic carriers develop early-onset adenomatous polyposis and AML or MDS, with uveal melanoma as one of several further tumors.
  - Polyposis and colorectal cancer risk has not been shown in heterozygotes.
  evidence:
  - reference: PMID:42594245
    reference_title: "MBD4-Related Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MBD4-related tumor predisposition syndrome (MBD4-TPDS) is characterized by early-onset gastrointestinal polyposis and acute myeloid leukemia (AML) or myelodysplastic syndrome (MDS)."
    explanation: GeneReviews definition of the recessive syndrome.
  - reference: PMID:35460607
    reference_title: "Germline MBD4 deficiency causes a multi-tumor predisposition syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to findings with uveal melanoma where heterozygotes for MBD4 LOF variants appear to be at a 4- to 20-fold increased risk, our limited data show no convincing evidence for a comparable effect on the relative risk of developing polyposis and/or CRC."
    explanation: The phenotypic boundary between heterozygotes and biallelic carriers.
animal_models:
- name: Mbd4 knockout mouse
  species: Mouse
  genotype: Mbd4-/- (homozygous null)
  publication: PMID:12130785
  description: >-
    Constitutional Mbd4-null mice. They model the tumor-cell state of a
    carrier's uveal melanoma (both alleles lost), not the heterozygous germline
    state, and no uveal or melanocytic phenotype is reported.
  modeled_mechanisms:
  - target: CpG>TpG Hypermutator Phenotype in Uveal Melanoma
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Reproduces the CpG-specific transition excess that follows loss of both
      MBD4 alleles.
    limitations: >-
      Measured in normal mouse tissues, not in melanocytes or uveal melanoma, and
      at a two- to three-fold increase rather than the roughly 15-fold exome-wide
      excess in human carrier tumors. Heterozygous mice show no increased cancer
      susceptibility, and the model does not address uveal melanoma.
    evidence:
    - reference: PMID:12130785
      reference_title: "Enhanced CpG mutability and tumorigenesis in MBD4-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We tested this hypothesis by analyzing Mbd4-/- mice and found that the frequency of of C --> T transitions at CpG sites was increased by a factor of three."
      explanation: Threefold increase in CpG transitions on loss of both alleles (the doubled "of" is the source's).
    - reference: PMID:12417741
      reference_title: "Mbd4 inactivation increases Cright-arrowT transition mutations and promotes gastrointestinal tumor formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous and homozygous Mbd4 mutant mice develop normally and do not show increased cancer susceptibility or reduced survival."
      explanation: Neither heterozygous nor homozygous mice show spontaneous tumor predisposition.
discussions:
- discussion_id: mbd4_um_penetrance_and_surveillance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the absolute, age-specific uveal melanoma risk in heterozygous MBD4
    carriers, and does it justify ophthalmologic surveillance, and from what age?
  attaches_to:
  - "phenotypes#Uveal Melanoma"
  - "genetic#MBD4"
  rationale: >-
    Relative-risk estimates span 9.15 to 31.44 within one French institution,
    another series found no loss-of-function carrier, and ClinGen held the
    classification at Moderate for that reason. No heterozygote surveillance
    protocol was found in the sources cited here; the annual dilated eye
    examination GeneReviews recommends is for biallelic MBD4-TPDS. All
    published carrier cases found are adults, so there is no basis for
    childhood surveillance.
  evidence:
  - reference: PMID:42594245
    reference_title: "MBD4-Related Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "annual dilated eye exam beginning in adulthood"
    explanation: The only eye-surveillance recommendation found, written for the recessive syndrome.
  - reference: CGGV:assertion_d97335a9-7e38-4f2c-a59f-f35fd047594a-2026-02-27T180000.000Z
    reference_title: "MBD4 / uveal melanoma (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One study showed enrichment of loss-of-function variants in affected patients compared to controls (PMID: 32239153), while the other showed no such enrichment of this variant type (PMID: 32421892)."
    explanation: ClinGen's summary of the conflicting case-control evidence.
- discussion_id: mbd4_um_tumor_spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do heterozygous MBD4 carriers have an increased risk of tumors other than
    uveal melanoma?
  attaches_to:
  - "genetic#MBD4"
  rationale: >-
    Germline heterozygous MBD4 variants have been found in single cases of
    glioblastoma, spiradenocarcinoma, colorectal, gastric and pancreatic tumors,
    and carrier families report breast, renal and colorectal cancers in
    relatives, but no case-control estimate exists for any of them in the
    sources cited here, and the breast cancer probands came from a series
    referred for suspected breast cancer predisposition. No phenotype other than
    uveal melanoma is recorded on this entry for that reason.
  evidence:
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, germline MBD4 mutations were recently reported in other types of malignancy, including a polyposis-associated colorectal adenocarcinoma (20), a spiradenocarcinoma (19), a glioblastoma (8), a pilocytic astrocytoma, a gastric adenocarcinoma, a pancreatic adenocarcinoma, and a pancreatic endocrine tumor (21)"
    explanation: Single-case reports of other tumors in carriers.
  - reference: PMID:38060262
    reference_title: "Familial uveal melanoma and other tumors in 25 families with monoallelic germline MBD4 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Monoallelic MBD4 pathogenic variant may explain some cases of familial and multiple uveal melanoma as well as various cancer types, expanding the tumor spectrum of this predisposition."
    explanation: The carrier-series authors frame the wider spectrum as possible, not shown.
- discussion_id: mbd4_um_transformation_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does tumor-restricted MBD4 deficiency promote uveal melanoma, and why is
    the uvea the dominant tumor site in heterozygotes?
  attaches_to:
  - "pathophysiology#CpG>TpG Hypermutator Phenotype in Uveal Melanoma"
  rationale: >-
    The discovery authors could not say whether MBD4 loss acts by increasing
    driver mutations, by altering the methylation landscape, or otherwise, and
    they called the uveal proneness unexplained, offering only that monosomy 3
    co-inactivates BAP1 and MBD4. Their working model puts a Gq-pathway
    activating mutation first, which would explain adult onset but has not been
    tested in carriers.
  evidence:
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whether MBD4 deficiency favors malignant transformation by increasing driver mutations by modifying the methylation landscape or a distinct mechanism has yet to be determined."
    explanation: The authors state the mechanism is unresolved.
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "remains unexplained, but the fact that the frequent M3 in UM inactivates wild-type copies of both BAP1 and MBD4 suppressor genes may at least in part explain the frequent inactivation of MBD4 in UM."
    explanation: The tissue-specificity question and the authors' partial explanation.
- discussion_id: mbd4_um_cytidine_analog_sensitivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are MBD4-deficient uveal melanomas selectively sensitive to cytidine analogs
    such as gemcitabine in patients?
  attaches_to:
  - "pathophysiology#Unrepaired G:T Mismatches at Methyl-CpG in Tumor Cells"
  rationale: >-
    A drug-repurposing screen in isogenic MBD4-knockout cells, one uveal
    melanoma patient-derived xenograft and one patient's tumor response point to
    synthetic lethality with cytidine analogs. That is a single clinical
    observation, so no cytidine-analog treatment is curated on this entry.
  evidence:
  - reference: PMID:36323843
    reference_title: "Cytidine analogs are synthetic lethal with base excision repair default due to MBD4 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "After a large-scale drug repurposing screen, we show in two isogenic MBD4 knock-out cell models that the inactivation of MBD4 sensitizes cancer cells to cytidine analogs."
    explanation: The cell-model synthetic-lethality result.
  - reference: PMID:36323843
    reference_title: "Cytidine analogs are synthetic lethal with base excision repair default due to MBD4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment in the corresponding patient resulted in an exceptional tumor response"
    explanation: The single patient response.

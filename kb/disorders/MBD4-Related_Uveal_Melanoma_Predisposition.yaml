      snippet: "MBD4, located on chromosome 3, is thought to act as a tumor suppressor gene, following Knudson’s 2-hit model with loss of the wild-type allele by monosomy 3 (M3) in UMs (8)."
      explanation: States the two-hit model linking the germline allele to tumor-level loss of the wild-type allele.
- name: Somatic Loss of the Wild-Type MBD4 Allele by Chromosome 3 Loss
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  role: effector
  biological_scale: MOLECULAR
  description: >-
    In every sequenced tumor from a carrier, the wild-type MBD4 allele (3q21.3)
    was lost by monosomy 3 or isodisomy 3. Because BAP1 (3p21) lies on the same
    chromosome, the same event removes the wild-type BAP1 allele, and the
    carrier tumors with available profiles also carried somatic BAP1
    inactivation. MBD4 deficiency in uveal melanoma is therefore tied to
    monosomy-3, high-metastatic-risk tumors.
  genetic_context:
    gene:
      preferred_term: MBD4
      term:
        id: hgnc:6919
        label: MBD4
    variant_origin: SOMATIC
    allelic_hit_role: SECOND_HIT
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Loss of heterozygosity of the wild-type MBD4 allele by monosomy 3 or
      isodisomy 3 in the tumor.

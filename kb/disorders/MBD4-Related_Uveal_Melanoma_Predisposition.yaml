    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirmed that the 3 MBD4 germline LoF mutations were associated with somatic loss of the wild-type allele in the tumors by either M3 (UM75 and UM605) or isodisomy 3 (UM656)"
    explanation: Tumor-level loss of the wild-type allele in carrier tumors from the consecutive series.
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Out of these 5 UM case patients with germline MBD4 variants, 4 had available tumor profiles that all showed M3 and somatic BAP1 inactivation (8,9,16), presumably because of the localization of both MBD4 and BAP1 on chromosome 3."
    explanation: Co-inactivation of BAP1 by the same chromosome 3 loss in carrier tumors.
  - reference: PMID:29760383
    reference_title: "Outlier response to anti-PD1 in uveal melanoma reveals germline MBD4 mutations in hypermutated tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a germline deleterious frameshift deletion of MBD4 (3q21.3; c.1441delT:p.F481Dfs*9) with loss of the second allele by monosomy 3 in all tumor samples (Fig. 2c, f)."
    explanation: Index case in which every tumor sample lost the second allele through monosomy 3.
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This finding confirms that MBD4 deficiency in UM is mainly associated with M3 and that MBD4 germline mutations specifically predispose to hypermutated high-risk M3 UMs."
    explanation: Restriction of MBD4-deficient uveal melanoma to the monosomy 3 subgroup.
  downstream:
  - target: Unrepaired G:T Mismatches at Methyl-CpG in Tumor Cells
    causal_link_type: DIRECT
- name: Unrepaired G:T Mismatches at Methyl-CpG in Tumor Cells
  conforms_to: "genome_instability_mutation#Failure of DNA Damage Surveillance and Repair"
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    With both alleles gone, the tumor cell can no longer excise thymine from the
    G:T mispair produced by spontaneous deamination of 5-methylcytosine, so the
    mispair persists into replication. The defect is confined to the tumor
    lineage, not present constitutionally as in biallelic MBD4-TPDS.
  biological_processes:
  - preferred_term: base-excision repair initiated by removal of deaminated bases
    term:
      id: GO:0097510
      label: base-excision repair, AP site formation via deaminated base removal
    modifier: DECREASED
  cell_types:
  - preferred_term: uveal melanoma cell
    term:
      id: CL:0000148
      label: melanocyte
  evidence:
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MBD4 encodes a glycosylase involved in the base excision repair of DNA damage arising from spontaneous deamination of 5-methylcytosine to thymine"
    explanation: Names the repair step lost when the second allele is gone.
  - reference: PMID:10499592
    reference_title: "The thymine glycosylase MBD4 can bind to the product of deamination at methylated CpG sites."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, the methyl-CpG binding domain of MBD4 binds preferentially to m5CpG x TpG mismatches-the primary product of deamination at methyl-CpG."
    explanation: Identifies the deaminated methyl-CpG mispair as MBD4's preferred substrate.
  - reference: PMID:37957685
    reference_title: "MBD4 loss results in global reactivation of promoters and retroelements with low methylated CpG density."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that the protein MBD4 is required for DNA methylation maintenance and G/T mismatch repair."
    explanation: Experimental confirmation that MBD4 loss abolishes G/T mismatch repair.
  downstream:
  - target: CpG>TpG Hypermutator Phenotype in Uveal Melanoma
    causal_link_type: DIRECT
- name: CpG>TpG Hypermutator Phenotype in Uveal Melanoma
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Carrier tumors carry a median of about 243 exome variants against 16 in
    MBD4-proficient uveal melanoma, with 85-96% of single-nucleotide variants
    being CpG>TpG transitions against about a quarter in other uveal melanomas.
    The excess continues after dissemination: metastases from MBD4-deficient
    tumors are genetically heterogeneous and acquire new drivers (TP53, SMARCA4,
    GNAS), whereas MBD4-proficient metastases acquire few new variants. How the
    mutator contributes to malignant transformation, beyond accompanying it, has
    not been determined (see discussions).
  evidence:
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tumors carrying deleterious MBD4 mutations were all associated with high tumor mutation burden and a CpG>TpG hypermutator phenotype."
    explanation: The mutator phenotype in every carrier tumor sequenced.
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, these 7 patients with MBD4 deleterious mutations had a 15-fold increase in number of variants per exome"
    explanation: Quantifies the mutator effect relative to MBD4-proficient uveal melanoma.
  - reference: PMID:29760383
    reference_title: "Outlier response to anti-PD1 in uveal melanoma reveals germline MBD4 mutations in hypermutated tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over 91% of mutations were CpG>TpG transitions, compared to <30% in other UMs (Fig. 2b)."
    explanation: CpG specificity of the excess mutations in the index carrier's tumors.
  - reference: PMID:31227496
    reference_title: "Evolutionary Routes in Metastatic Uveal Melanomas Depend on MBD4 Alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, MBD4-deficient uveal melanomas carried more than 266 SNVs per sample, with high genetic heterogeneity and TP53, SMARCA4, and GNAS new driver mutations."
    explanation: Continued mutagenesis and new driver acquisition during metastatic progression.
  downstream:
  - target: Uveal Melanoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The predisposition is to hypermutated monosomy-3 uveal melanoma. Which step
      of transformation the mutator accelerates is not known; the discovery
      authors propose that it acts only after a Gq-pathway initiating mutation.
    evidence:
    - reference: PMID:32239153
      reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We further demonstrated that MBD4 deficiency specifically predisposes to high-risk M3 UM."
      explanation: Links MBD4 deficiency to the monosomy 3 uveal melanoma outcome.
phenotypes:
- category: Neoplastic
  name: Uveal Melanoma
  description: >-
    The defining tumor. Primary uveal melanoma in carriers has been unilateral
    and single in nearly all reported cases, with one carrier with multiple
    uveal melanomas among 25 French carrier families. Carrier tumors are
    monosomy-3, hypermutated, and in the first series had metastasis-free and
    overall survival not different from MBD4-proficient monosomy-3 tumors.
    Median age at diagnosis was 55.5 years in the first eight carriers, not
    earlier than in non-carriers, and the discovery authors' model places the
    rate-limiting first step (a Gq-pathway activating mutation) upstream of any
    MBD4 effect, which they offer as the reason onset is not shifted earlier. No
    pediatric case was found in the sources cited here.
  phenotype_term:
    preferred_term: Uveal melanoma
    term:
      id: HP:0007716
      label: Uveal melanoma
    onset:
      onset_category: ADULT
  evidence:
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 8 deleterious MBD4 mutations in the consecutive UM series, a 9.15-fold (95% confidence interval = 4.24-fold to 19.73-fold) increased incidence compared with the general population"
    explanation: Case-control enrichment of germline MBD4 loss-of-function among 1093 consecutive uveal melanoma patients.
  - reference: PMID:42060275
    reference_title: "Prevalence of the Predisposing Gene MBD4 for Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 23 of 896 patients were identified as carrying an MBD4 germline pathogenic or likely pathogenic variant, corresponding to a relative risk of 31.44 (95% CI, 18.18-53.00) of developing uveal melanoma compared with the general population"
    explanation: Larger, later relative-risk estimate from the same institution with non-Finnish European gnomAD as reference.
  - reference: PMID:30714079
    reference_title: "Prolonged stable disease in a uveal melanoma patient with germline MBD4 nonsense mutation treated with pembrolizumab and ipilimumab."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, the frequency of MBD4 loss-of-function variants in reported UM cohorts was > 20 times higher than in an aggregated population genome database (P < 5 × 10-5), implying a potential role as UM predisposition gene."
    explanation: Independent pooled estimate of enrichment across published uveal melanoma cohorts.
  - reference: PMID:32421892
    reference_title: "Germline loss-of-function variants in MBD4 are rare in Finnish patients with uveal melanoma."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified no LOF variants though their frequency in the Finnish population is 0.052%. Thus, our data do not support the suggestion that MBD4 germline variants predispose to UM."
    explanation: >-
      The conflicting case-control study; 440 Finnish patients without a single
      loss-of-function carrier. ClinGen kept the classification at Moderate
      because of it.
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One surprising observation for this new cancer-predisposing condition is the absence of early-onset UM."
    explanation: Basis for adult onset and for not shifting the onset category earlier.
  - reference: PMID:38060262
    reference_title: "Familial uveal melanoma and other tumors in 25 families with monoallelic germline MBD4 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighteen of these families presented with uveal melanoma (including a case patient with multiple uveal melanoma), and 7 families presented with breast cancer."
    explanation: Uveal melanoma, including one multiple-primary case, in a second carrier series.
genetic:
- name: MBD4
  gene_term:
    preferred_term: MBD4
    term:
      id: hgnc:6919
      label: MBD4
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  association: >-
    Heterozygous germline loss-of-function variants in MBD4 increase the risk of
    hypermutated monosomy-3 uveal melanoma.
  notes: >-
    relationship_type is RISK_FACTOR rather than CAUSATIVE. The schema reserves
    CAUSATIVE for ClinGen Definitive or Strong, and ClinGen rates this pair
    Moderate (autosomal dominant, Hereditary Cancer GCEP, 2026-02-27), kept there
    because of conflicting case-control data. The variant is also neither
    sufficient (estimated lifetime risk below 0.1%) nor necessary (under 3% of
    consecutive uveal melanoma patients carry one), which is the RISK_FACTOR
    definition. That ClinGen assertion is recorded against MONDO:0006486 uveal
    melanoma rather than this entry's MONDO:0011695, so it is cited in evidence
    and not copied into gene_disease_validity.
  case_fractions:
  - population: Consecutive uveal melanoma patients, Institut Curie, France, 2013-2018
    case_fraction_percent: 0.7
    cohort_size: 1093
    notes: Germline loss-of-function variants including one glycosylase-dead missense allele; approximate figure as stated by the authors.
    evidence:
    - reference: PMID:32239153
      reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we demonstrate that the prevalence of MBD4 germline deleterious variants in UM is approximately 0.7%, close to that of BAP1 germline mutation in UM (1.6%) (23), and that MBD4 mutations strongly predispose to UM with an RR of 9.15 (95% CI = 4.24 to 19.73)."
      explanation: Share of consecutive uveal melanoma cases carrying a germline MBD4 loss-of-function variant.
  - population: Uveal melanoma patients, Institut Curie, France, February 2021 to September 2025
    cohort_size: 896
    notes: 23 of 896 patients carried a pathogenic or likely pathogenic variant; the abstract gives the count, not a percentage, so none is recorded here. 319 patients overlap with earlier evaluations.
    evidence:
    - reference: PMID:42060275
      reference_title: "Prevalence of the Predisposing Gene MBD4 for Uveal Melanoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In a case series involving 896 individuals, including 319 who were previously evaluated, germline target-sequencing of MBD4 was offered to every new patient with uveal melanoma at Curie Institute from February 2021 to September 2025."
      explanation: Cohort definition for the 23 of 896 count quoted under the uveal melanoma phenotype.
  - population: Finnish uveal melanoma patients
    case_fraction_percent: 0.23
    case_fraction_low: 0.01
    case_fraction_high: 1.28
    cohort_size: 432
    notes: One likely pathogenic missense variant; no loss-of-function variant was found.
    evidence:
    - reference: PMID:32421892
      reference_title: "Germline loss-of-function variants in MBD4 are rare in Finnish patients with uveal melanoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The frequency of likely pathogenic variants in our cohort is 0.23% (1/432; 95% CI, 0.01-1.28)."
      explanation: Case fraction in a population-based Finnish series.
  evidence:

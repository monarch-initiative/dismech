name: MBD4-Related Uveal Melanoma Predisposition
creation_date: "2026-10-15T14:19:12Z"
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
parents:
- susceptibility to uveal melanoma
disease_term:
  preferred_term: melanoma, uveal, susceptibility to, 1
  term:
    id: MONDO:0011695
    label: melanoma, uveal, susceptibility to, 1
synonyms:
- UVM1
- melanoma, uveal, susceptibility to, type 1
- MBD4-related uveal melanoma susceptibility
- autosomal dominant MBD4 uveal melanoma predisposition
description: >-
  Autosomal dominant, low-penetrance susceptibility to uveal melanoma conferred by
  a heterozygous germline loss-of-function variant in MBD4, the methyl-CpG-binding
  glycosylase that removes thymine from the G:T mispair left when
  5-methylcytosine deaminates. Unlike the recessive MBD4-related tumor
  predisposition syndrome, a heterozygote's normal cells keep one working allele;
  the tumor follows a Knudson two-hit route in which the second hit is loss of
  chromosome 3 (monosomy 3 or isodisomy 3), which removes the wild-type MBD4
  allele and, from the same chromosome, the wild-type BAP1 allele. Only then is
  the melanocyte MBD4-deficient, and the resulting uveal melanomas are monosomy-3,
  high-risk tumors carrying a CpG>TpG hypermutator phenotype, about 15-fold more
  exome variants than MBD4-proficient uveal melanoma in a cancer that otherwise
  has one of the lowest mutation burdens. Metastatic MBD4-deficient uveal
  melanoma responds to immune checkpoint blockade far more often than unselected
  metastatic uveal melanoma. Relative-risk estimates from consecutive Institut
  Curie series are 9.15 and 31.44, but a Finnish series of 440 patients found no
  loss-of-function carrier, and the absolute lifetime risk implied by the first
  estimate is under 0.1%, so most carriers never develop the tumor. Onset in
  carriers is in adulthood and was not earlier than in non-carriers in the first
  series (median 55.5 years); no uveal melanoma in a child or adolescent
  heterozygote was found in the sources cited here. Whether heterozygotes carry an
  excess risk of other cancers is not established.
notes: >-
  Lump/split. ClinGen split MBD4-related disease into autosomal dominant uveal
  melanoma susceptibility (OMIM 606660) and autosomal recessive tumor
  predisposition syndrome 2 (OMIM 619975), on differences in inheritance pattern
  and phenotypic variability. This entry is the dominant half; the recessive half
  is MBD4-Related_Tumor_Predisposition_Syndrome. Heterozygous relatives of an
  MBD4-TPDS proband are heterozygotes in the sense of this entry. Anchor. The
  disease term is the germline susceptibility concept MONDO:0011695, not
  MONDO:0006486 uveal melanoma, which is the tumor term that the somatic
  Uveal_Melanoma entry anchors to (design decisions section 3a). ClinGen recorded
  its autosomal dominant assertion against MONDO:0006486, so that Moderate
  assertion is cited as evidence below but is not recorded in
  gene_disease_validity, which requires the assertion's MONDO term to be this
  entry's disease term. Somatic Gq-pathway and BAP1/SF3B1/EIF1AX biology of
  uveal melanoma is curated in Uveal_Melanoma and is repeated here only where the
  MBD4-deficient tumor differs from it.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    One germline loss-of-function allele is sufficient for the increased risk,
    and offspring of a carrier have a 50% chance of inheriting it. Penetrance is
    low: with a population lifetime uveal melanoma risk of about 7.7 per 100,000,
    the 2021 relative risk of about 9 corresponds to a lifetime risk below 0.1%,
    which is consistent with the absence of familial or bilateral uveal melanoma
    among the first eight carriers. A familial case was later reported among 25
    carrier families. Larger relative-risk estimates (31.44 in a 2026 update of
    the same French cohort) would raise this figure, and a Finnish series found
    no loss-of-function carrier at all, so no penetrance figure is recorded.
  evidence:
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, we described here a novel autosomal-dominant syndrome that is caused by germline mutations of MBD4, characterized by a high RR of developing hypermutated UM and possibly other malignancies."
    explanation: The discovery cohort's statement of dominant inheritance.
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With a lifetime risk of UM estimated at 7.69 × 10–5 in the general population (25), an RR of 9 would result in a lifetime risk of UM of 6.92 × 10–4."
    explanation: The authors' own conversion of relative risk to an absolute lifetime risk, the basis for calling penetrance low.
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "none of these individuals had familial or bilateral UM."
    explanation: No familial aggregation among the first carriers identified.
  - reference: PMID:38060262
    reference_title: "Familial uveal melanoma and other tumors in 25 families with monoallelic germline MBD4 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family histories showed the first familial case of uveal melanoma in monoallelic MBD4 pathogenic variant carriers and other various types of cancers in relatives, especially breast, renal, and colorectal tumors."
    explanation: First familial uveal melanoma in heterozygous carriers.
  - reference: CGGV:assertion_d97335a9-7e38-4f2c-a59f-f35fd047594a-2026-02-27T180000.000Z
    reference_title: "MBD4 / uveal melanoma (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MBD4 | HGNC:6919 | uveal melanoma | MONDO:0006486 | AD | Moderate"
    explanation: ClinGen records the uveal melanoma relationship with autosomal dominant inheritance.
  - reference: PMID:42594245
    reference_title: "MBD4-Related Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous family members of an individual with MBD4-TPDS have a relative risk of 9.15-31.44 to develop uveal melanoma compared to the general population."
    explanation: >-
      GeneReviews applies the heterozygote uveal melanoma risk to relatives of a
      recessive MBD4-TPDS proband, who fall under this entry.
pathophysiology:
- name: Heterozygous Germline MBD4 Loss of Function
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    One constitutional MBD4 allele carries a truncating, canonical-splice or
    catalytically dead missense variant. Every cell keeps one functional allele,
    so the constitutional state is not itself a mutator state; it is a first hit
    awaiting loss of the wild-type allele in a uveal melanocyte. Recurrent alleles
    across unrelated carriers (c.1562-1G>T, c.1443delT, c.1706G>A, c.335+1G>A,
    c.939dup) suggest founder effects.
  genetic_context:
    gene:
      preferred_term: MBD4
      term:
        id: hgnc:6919
        label: MBD4
    variant_origin: GERMLINE
    allelic_hit_role: FIRST_HIT
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline loss-of-function variants, including frameshift,
      nonsense, canonical splice and glycosylase-dead missense (p.Arg468Trp)
      alleles.
  molecular_functions:
  - preferred_term: G/T mismatch-specific thymine-DNA glycosylase activity
    term:
      id: GO:0141016
      label: G/T mismatch-specific thymine-DNA glycosylase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, we thus identified 8 LoF germline variants in MBD4 among the 1093 consecutive UM case patients, including p. Arg468Trp with deleterious effect on MBD4 glycosylase activity (Table 1)."
    explanation: The allele classes seen in carriers, including a missense allele shown to abolish glycosylase activity.
  - reference: PMID:32239153
    reference_title: "Germline MBD4 Mutations and Predisposition to Uveal Melanoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The assay confirmed that p. Trp569* results in a catalytically inactive protein and further demonstrated p. Arg468Trp to be a LoF variant (Figure 1)."
    explanation: In vitro glycosylase assay of carrier alleles; graded IN_VITRO because the quoted sentence reports the recombinant-protein assay.
  - reference: CGGV:assertion_d97335a9-7e38-4f2c-a59f-f35fd047594a-2026-02-27T180000.000Z
    reference_title: "MBD4 / uveal melanoma (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity appears to be loss-of-function."
    explanation: ClinGen's assessment of the disease mechanism for the dominant uveal melanoma relationship.
  - reference: PMID:10499592
    reference_title: "The thymine glycosylase MBD4 can bind to the product of deamination at methylated CpG sites."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that MBD4, an unrelated mammalian protein that contains a methyl-CpG binding domain, can also efficiently remove thymine or uracil from a mismatches CpG site in vitro."
    explanation: >-
      Biochemical definition of the glycosylase activity reduced by the germline
      variant (the "mismatches" typo is the source's own).
  downstream:

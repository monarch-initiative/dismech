  biological_scale: TISSUE
- name: Photoreceptor Degeneration
  description: Outer nuclear layer loss and disrupted photoreceptor segment structure occur in affected retinal regions. Generalized rod and cone dysfunction is variable in ARB; early retinal fluid can coexist with retained photoreceptors. This node represents structural degeneration rather than every electrophysiologic abnormality.
  evidence:
  - reference: PMID:29507198
    reference_title: BEST1 gene therapy corrects a diffuse retina-wide microdetachment modulated by light exposure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both patients showed a significant loss of ONL and abnormalities at the level of photoreceptor IS/OS in the outer retina across most of the central retina.  # codespell:ignore onl
    explanation: Two ARB patients showed outer nuclear layer loss and outer retinal abnormalities, providing human evidence distinct from the canine experiments.
  downstream:
  - target: Reduced Visual Acuity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Central photoreceptor degeneration contributes to vision loss, alongside fluid, fibrosis, neovascular complications and amblyopia.
  - target: Rod-Cone Dystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Broader retinal involvement can produce rod-cone dysfunction; relative rod and cone severity varies.
  mechanism_confidence: ESTABLISHED
  biological_scale: TISSUE
- name: Allele-Specific BEST1 Ubiquitination
  description: For p.Pro233Leu and p.Pro346His, Hsp70/CHIP mediates ubiquitination at BEST1 Lys149. This site is a lysine in BEST1, not a ubiquitin-chain linkage designation, and the route is not established for all BEST1 alleles.
  evidence:
  - reference: PMID:41456629
    reference_title: Hsp70/CHIP E3 ligase complex triggers K149-linked ubiquitination and degradation of BEST1 mutants p.P233L and p.P346H, impairing chloride channel function and retinal integrity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lys149 was identified as the site responsible for ubiquitination of p.P346H- and p.P233L-bestrophin-1, mediated by Hsp70 and the C-terminal Hsp70-interacting protein (CHIP).
    explanation: The study identifies BEST1 residue Lys149 as the modified site for these two mutants; this is not a ubiquitin-chain linkage designation.
  downstream:
  - target: Accelerated Mutant BEST1 Degradation
    causal_link_type: DIRECT
    description: The reported Hsp70/CHIP-dependent modification promotes turnover of these two mutant proteins.
  mechanism_confidence: PROVISIONAL
  biological_scale: MOLECULAR
- name: Reduced BEST1 Membrane Localization
  description: Selected BEST1 mutants fail to accumulate normally at the membrane. This can reduce anion-channel activity, but other pathogenic alleles retain basolateral localization; preserved localization alone does not establish normal function.
  evidence:
  - reference: PMID:41456629
    reference_title: Hsp70/CHIP E3 ligase complex triggers K149-linked ubiquitination and degradation of BEST1 mutants p.P233L and p.P346H, impairing chloride channel function and retinal integrity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mutant bestrophin-1 proteins p.P346H and p.P233L undergo ubiquitination and degradation, preventing their localization to the cell membrane of MDCK II cells and the RPE of zebrafish, thereby reducing chloride channel activity.
    explanation: The abstract reports degradation and mislocalization in polarized cells and zebrafish; no universal degradation mechanism across BEST1 alleles is inferred.
  downstream:
  - target: BEST1 Channel Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reduced membrane abundance can impair channel activity; direct gating defects also occur independently of trafficking.
  mechanism_confidence: PROVISIONAL
  biological_scale: MOLECULAR
- name: Reduced CaV1.3 Channel Activity
  description: BEST1 p.Thr6Pro, p.Phe80Leu, p.Arg218Cys and p.Phe305Ser reduced CaV1.3 activity or surface expression in heterologous and polarized RPE experiments. Co-immunoprecipitation supports altered protein association, not necessarily direct binding. The proposed connection to EOG abnormalities or deposits remains incompletely established.
  evidence:
  - reference: PMID:31930599
    reference_title: Inhibition of Ca(2+) channel surface expression by mutant bestrophin-1 in RPE cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For the four selected BEST1 mutations, presence of mutant bestrophin-1 led to reduced CaV 1.3 activity by modulating pore-function or decreasing surface expression.
    explanation: T6P, F80L, R218C and F305S affected the interacting L-type calcium channel in cellular assays; the relative contribution of gating versus trafficking was variant-dependent.
  downstream:
  - target: Abnormal Electrooculogram
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Altered calcium-channel activity is proposed to affect RPE electrophysiology; the experiments did not establish its quantitative contribution to patient EOG.
  mechanism_confidence: PROVISIONAL
  biological_scale: MOLECULAR
- name: Accelerated Mutant BEST1 Degradation
  description: Ubiquitinated p.Pro233Leu and p.Pro346His proteins undergo increased degradation in the experimental study, limiting membrane availability. Other BEST1 genotypes can retain mutant RNA and protein, so this is an allele-specific mechanism.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:41456629
    reference_title: Hsp70/CHIP E3 ligase complex triggers K149-linked ubiquitination and degradation of BEST1 mutants p.P233L and p.P346H, impairing chloride channel function and retinal integrity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mutant bestrophin-1 proteins p.P346H and p.P233L undergo ubiquitination and degradation, preventing their localization to the cell membrane of MDCK II cells and the RPE of zebrafish, thereby reducing chloride channel activity.
    explanation: The reported sequence connects degradation to membrane localization for two tested mutants.
  downstream:
  - target: Reduced BEST1 Membrane Localization
    causal_link_type: DIRECT
    description: Increased turnover reduces the pool available for membrane localization.
  biological_scale: MOLECULAR
phenotypes:
- name: Vitelliform Macular Lesion
  category: Ophthalmological
  diagnostic: true
  description: 'Characteristic yellow egg-yolk-like subretinal deposit at the macula. Central and focal in BVMD; more extensive with extramacular involvement in ARB.


  experimental_model_type: IPSC_DERIVED_MODEL
  description: Three dominant lines carried p.Arg218Cys, p.Asn296His or p.Ala146Lys; the ARB line carried p.Arg141His/p.Ala195Val. Controls included unaffected RPE and an isogenic corrected p.Arg218Cys line. Lentiviral VMD2-driven BEST1 augmentation restored chloride currents in the ARB line and two dominant lines, but not p.Ala146Lys. Mutant-allele-selective CRISPR-Cas9 disruption restored currents in all three dominant lines. Transcriptomic testing found no adverse RPE program changes, but targeted sequencing detected an off-target noncoding chromosome 7 alteration with the p.Arg218Cys guide.
  publication: PMID:32707085

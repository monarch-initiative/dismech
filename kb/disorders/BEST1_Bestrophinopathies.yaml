    supports: SUPPORT
    snippet: The best corrected visual acuity (BCVA) is mildly decreased to 20/50 on average (range 20/20 to 20/200), until later stages, where natural progression and complication create a steep decline.
    explanation: Documents visual acuity decline particularly in later disease stages.
  - reference: PMID:38278445
    reference_title: 'Best Vitelliform Macular Dystrophy Natural History Study Report 1: Clinical Features and Genetic Findings.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mean annual progression rate was 0.013 logMAR
    explanation: The right-eye mean annual BCVA decline was 0.013 logMAR in longitudinal BVMD data; rates varied and the estimate does not apply to every subtype.
- name: Abnormal Electrooculogram
  category: Ophthalmological
  diagnostic: true
  description: Reduced EOG light rise/Arden ratio is characteristic, often severe in ARB, but may be only mildly reduced or occasionally normal. EOG results must be interpreted with the clinical phenotype, ERG and molecular findings.

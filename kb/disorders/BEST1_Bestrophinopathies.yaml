    reference_title: Bestrophinopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: BVMD, AVMD, and ADVIRC are inherited in an autosomal dominant (AD) manner.
    explanation: Established dominant clinical presentations.
    quote_role: REVIEW_SYNTHESIS
- name: Autosomal recessive
  description: ARB is associated with biallelic BEST1 variants. Residual expression or function can persist, depending on the alleles.
  inheritance_term:
    preferred_term: Autosomal recessive
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:

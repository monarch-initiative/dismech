diagnosis:
- name: Molecular testing with retinal phenotype correlation
  description: Interpret BEST1 pathogenic or likely pathogenic variants alongside retinal imaging, clinical pattern and family segregation. Dominant presentations generally require a heterozygous causal variant and ARB requires biallelic variants. A normal-range EOG does not exclude the diagnosis; atypical RP-like cases warrant broader retinal-gene assessment.
  evidence:
  - reference: PMID:20301346
    reference_title: Bestrophinopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of autosomal recessive bestrophinopathy is established in a proband with suggestive findings and biallelic BEST1 pathogenic variants.
    explanation: GeneReviews defines molecular confirmation of ARB.
    quote_role: REVIEW_SYNTHESIS
- name: Multimodal retinal imaging and electrophysiology
  description: Fundus examination, OCT and autofluorescence characterize deposits, fluid, atrophy and fibrosis. EOG assesses RPE-related light-rise abnormalities and full-field ERG assesses generalized rod/cone dysfunction. Angiographic assessment can clarify suspected secondary neovascularization.
  evidence:
  - reference: PMID:33039401
    reference_title: 'Autosomal Recessive Bestrophinopathy: Clinical Features, Natural History, and Genetic Findings in Preparation for Clinical Trials.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Review of case notes, retinal imaging (color fundus photography, fundus autofluorescence, OCT), electrophysiologic assessment, and molecular genetic testing.
    explanation: The natural-history cohort combines imaging, electrophysiology and genetics to characterize ARB.

      evidence_source: IN_VITRO
      snippet: Densitometric analysis of the minigene results (semiquantitative analysis) showed ratios of the abnormal transcript in total transcripts of 67.7%, 50.0%, and 37.5% for the DIV c.867+97G>A, c.867+97G>T, and WT constructs, respectively.
      explanation: c.867+97G>A/T increased the proportion of an intron-retaining product also produced by the wild-type construct. These semiquantitative HEK293T results are not measurements in patient RPE.
  - name: BEST1 c.867+97G>T
    description: Deep-intronic NM_004183.4 allele increasing the intron-retaining transcript fraction in a HEK293T minigene (50.0% versus 37.5% for wild type). Patient PBMC corroboration in the paper was obtained for the G>A allele, not this G>T allele; neither result quantifies splicing in patient RPE.

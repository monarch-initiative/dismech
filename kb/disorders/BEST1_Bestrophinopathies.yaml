- name: Impaired Photoreceptor Outer-Segment Internalization
  description: RPE differentiated from one ARB donor carrying p.Arg141His and p.Ile366fsTer18 internalized photoreceptor outer segments less efficiently than parental and unrelated control RPE. After three hours, two ARB clones internalized approximately 24% and 31% of associated outer segments versus approximately 42% in controls. This measures uptake, distinct from subsequent rhodopsin degradation. The causal contribution of reduced BEST1 abundance versus mutant-protein dysfunction was unresolved.

    reference_title: Bestrophinopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: By definition, autosomal recessive bestrophinopathy (ARB) is inherited in an autosomal recessive (AR) manner.
    explanation: ARB is recessively inherited; related biallelic presentations can vary.
    quote_role: REVIEW_SYNTHESIS
treatments:
- name: Anti-VEGF Therapy
  description: Intravitreal anti-VEGF is used for active secondary choroidal neovascularization. A retrospective BVMD cohort found better final acuity in treated eyes, but untreated eyes included advanced fibrosis and inactive lesions, introducing selection bias. Subretinal fluid intrinsic to bestrophinopathy does not itself establish active neovascularization.
  treatment_term:
    preferred_term: anti-VEGF pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:34015078
    reference_title: Phenotypic and Genetic Spectrum of Autosomal Recessive Bestrophinopathy and Best Vitelliform Macular Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinicians should interrogate these eyes for CNV and consider anti-VEGF agents if present. However, this is likely not a primary treatment for the underlying disease.
    explanation: The study supports complication-directed treatment when CNV is present, not anti-VEGF therapy for every fluid-containing vitelliform lesion.
  - reference: PMID:38278445
    reference_title: 'Best Vitelliform Macular Dystrophy Natural History Study Report 1: Clinical Features and Genetic Findings.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: selection bias in the present cohort has to be considered, with some patients not receiving anti-VEGF treatment despite diagnosis of CNV because of, for example, severe atrophic or fibrotic changes, or both.
    explanation: Treatment groups differed in reasons for treatment selection; the observed visual advantage is not a randomized efficacy estimate.
- name: Low Vision Aids and Rehabilitation
  description: 'Visual rehabilitation and low vision aids for patients with progressive central vision loss.

    '

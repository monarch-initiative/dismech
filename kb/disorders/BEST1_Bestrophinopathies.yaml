name: BEST1 Bestrophinopathies
creation_date: '2026-04-04T12:00:00Z'
description: Bestrophinopathies are a spectrum of inherited retinal disorders caused by pathogenic BEST1 variants. Bestrophin-1 is a pentameric calcium-activated anion channel in retinal pigment epithelium (RPE). Allele-dependent abnormalities of protein expression, localization or channel activity are associated with impaired RPE support of photoreceptors, subretinal fluid and deposits, and retinal degeneration. The spectrum includes dominant Best vitelliform macular dystrophy, BEST1-associated adult-onset vitelliform disease, vitreoretinochoroidopathy/MRCS presentations, recessive bestrophinopathy and reported RP-like phenotypes. Dominant and recessive clinical presentations overlap; channel loss of function, dominant interference and increased anion permeability cannot be assigned solely from inheritance.
category: Genetic
parents:
- Inherited Retinal Dystrophy
- Macular Dystrophy
disease_term:
  preferred_term: BEST1 bestrophinopathy spectrum
notes: 'This entry covers the BEST1-associated retinal disease spectrum across dominant and recessive inheritance. Vitelliform macular dystrophy (MONDO:0000390) is not equivalent to that gene-defined spectrum: it includes other genetic causes and does not encompass all BEST1 phenotypes. The focal descriptor is therefore unbound; individual clinical subtypes retain their specific MONDO bindings. BEST1-related dominant retinopathy (MONDO:0700238) is also curated separately in BEST1-Related_Dominant_Retinopathy.yaml, with predominantly BVMD clinical evidence. BEST1-related recessive retinopathy (MONDO:0700239) and BEST1-related vitreoretinochoroidopathy (MONDO:0700240) describe additional gene-defined scopes rather than synonyms for this whole spectrum. Clinical overlap includes biallelic vitelliform presentations intermediate between dominant BVMD and typical ARB; whether these evolve into ARB requires longitudinal evidence.'
has_subtypes:
- name: BVMD
  display_name: Best Vitelliform Macular Dystrophy (BVMD)
  subtype_term:
    preferred_term: Best vitelliform macular dystrophy
    term:
      id: MONDO:0007931
      label: vitelliform macular dystrophy 2
  description: Dominant BEST1-associated macular dystrophy with variable expression and age at presentation. Gass stages describe previtelliform, vitelliform, pseudohypopyon, vitelliruptive, and atrophic or fibrotic appearances. Progression is usually slow and heterogeneous; a patient need not follow every stage in order. EOG is usually abnormal but normal-range results occur, so molecular testing and multimodal imaging remain important.
  evidence:
  - reference: PMID:38278445
    reference_title: 'Best Vitelliform Macular Dystrophy Natural History Study Report 1: Clinical Features and Genetic Findings.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: stage 1, previtelliform; stage 2, vitelliform; stage 3, pseudohypopyon; stage 4, vitelliruptive; and stage 5, atrophy or fibrosis.
    explanation: Correct ordering of the Gass staging used in this clinical cohort.
  - reference: PMID:38278445
    reference_title: 'Best Vitelliform Macular Dystrophy Natural History Study Report 1: Clinical Features and Genetic Findings.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 5 eyes (2.0%) showed a light peak-to-dark trough ratio of 1.85 or more
    explanation: Five of 244 tested eyes had ratios in the lower normal range; this is an eye-level result in a selected cohort, not a sensitivity estimate for all BEST1 disease.
- name: ARB
  display_name: Autosomal Recessive Bestrophinopathy (ARB)
  subtype_term:
    preferred_term: autosomal recessive bestrophinopathy
    term:
      id: MONDO:0012733
      label: autosomal recessive bestrophinopathy
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0700239
        label: BEST1-related recessive retinopathy
      mapping_predicate: skos:broadMatch
      mapping_source: MONDO
      mapping_justification: MONDO:0700239 is the gene-level "any retinopathy caused by bi-allelic BEST1 variants" grouping term; ARB (MONDO:0012733) is its specific clinical presentation curated here.
  description: Biallelic BEST1-associated retinopathy with variable age at presentation, multifocal deposits often extending beyond the macula, subretinal/intraretinal fluid, hyperopia, short axial length and angle-closure risk. EOG is usually markedly abnormal and ERG may show generalized dysfunction, but neither test has an invariant pattern. Reduced protein abundance, channel dysfunction and altered splicing occur in different alleles; complete absence of BEST1 and nonsense-mediated decay are not universal mechanisms. Disease extent ranges from isolated macular to panretinal involvement; different cohorts and follow-up periods yield different progression estimates.
  evidence:
  - reference: PMID:34015078
    reference_title: Phenotypic and Genetic Spectrum of Autosomal Recessive Bestrophinopathy and Best Vitelliform Macular Dystrophy.
    supports: SUPPORT
    snippet: ARB displays macular changes resembling the vitelliruptive, atrophic, and cicatricial stages of VMD. The phenotype additionally encompasses extramacular punctate deposits, intraretinal and subretinal fluid (SRF) accumulation, punctate or diffuse fundus hyperautofluorescence, hyperopia, short axial-length, central visual field loss, severely decreased Arden ratio
    explanation: Comprehensive description of ARB phenotype distinguishing it from BVMD.
  - reference: PMID:29540715
    reference_title: Mutant Best1 Expression and Impaired Phagocytosis in an iPSC Model of Autosomal Recessive Bestrophinopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Furthermore, ARB is not universally the result of NMD and ARB, in this patient, is not due to the absence of Best1.
    explanation: Patient-derived RPE carrying p.Arg141His and p.Ile366fsTer18 expressed both mutant transcripts and detectable p.Arg141His protein. The antibody could not detect the truncated protein, so that product was not directly demonstrated.
  - reference: PMID:41421761
    reference_title: Autosomal Recessive Bestrophinopathy-Phenotypic Variability, Natural History, and Genotype-Phenotype Correlations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No significant linear annual change in best-corrected visual acuity could be demonstrated over a median follow-up of 3 years.
    explanation: The 2026 ARB cohort had a shorter follow-up and did not demonstrate a significant linear annual acuity change; this limits extrapolation of a uniform decline rate.
- name: ADVIRC
  display_name: Autosomal Dominant Vitreoretinochoroidopathy (ADVIRC)
  subtype_term:
    preferred_term: autosomal dominant vitreoretinochoroidopathy
    term:
      id: MONDO:0008662
      label: autosomal dominant vitreoretinochoroidopathy
  description: Dominant BEST1-associated vitreoretinochoroidopathy with peripheral retinal degeneration and variable ocular developmental anomalies. A circumferential hyperpigmented band is characteristic but can be absent, and advanced cases can resemble rod-cone dystrophy. Microcornea, cataract, shallow anterior chamber and angle-closure glaucoma occur variably.
  evidence:
  - reference: PMID:21072067
    reference_title: 'BEST1-related autosomal dominant vitreoretinochoroidopathy: a degenerative disease with a range of developmental ocular anomalies.'
    supports: SUPPORT
    snippet: Clinical features observed included angle closure glaucoma (n = 2), microcornea with shallow anterior chamber (n = 1), iris dysgenesis (n = 2), cataracts (n = 4), classical peripheral concentric band of retinal hyperpigmentation (n = 5), and optic nerve dysplasia (n = 1).
    explanation: Describes the clinical features of BEST1-related ADVIRC and supports adding it as a distinct subtype.
  - reference: PMID:29370033
    reference_title: 'AUTOSOMAL DOMINANT VITREORETINOCHOROIDOPATHY: When Molecular Genetic Testing Helps Clinical Diagnosis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: On fundoscopy, the pathognomonic circumferential hyperpigmented band of the peripheral retina was totally absent in two patients.
    explanation: Two of five genetically diagnosed patients lacked the hallmark band, limiting its use as an exclusion criterion.
- name: MRCS
  display_name: Microcornea, Rod-Cone Dystrophy, Cataract, and Posterior Staphyloma (MRCS)
  subtype_term:
    preferred_term: MRCS syndrome
    term:
      id: MONDO:0033644
      label: microcornea, rod-cone dystrophy, cataract, and posterior staphyloma 1
  description: Microcornea, rod-cone dystrophy, early cataract and posterior staphyloma form a reported BEST1-associated panophthalmic presentation. Its overlap with ADVIRC suggests a spectrum of expressivity rather than a proven separate molecular pathway.
  evidence:
  - reference: PMID:33738427
    reference_title: 'Bestrophinopathies: perspectives on clinical disease, Bestrophin-1 function and developing therapies.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Microcornea, rod-cone dystrophy and staphyloma (MRCS), a disease linked to BEST1 mutations, shares many ADVIRC-associated clinical features and the phenotype could be on the spectrum of ADVIRC disease expressivity.
    explanation: Review describes MRCS/ADVIRC phenotypic overlap; a distinct mechanism is not established.
    quote_role: REVIEW_SYNTHESIS
- name: BEST1-RP
  display_name: BEST1-Associated Retinitis Pigmentosa
  subtype_term:
    preferred_term: BEST1-associated retinitis pigmentosa
    term:
      id: MONDO:0013175
      label: retinitis pigmentosa 50
  description: RP-like phenotypes with night blindness, peripheral field loss and rod-cone dysfunction have been reported with BEST1 variants. Distinction from ADVIRC or ARB and exclusion of other retinal-disease genes are important. A de novo deletion case lacked proof that BEST1 alone caused the phenotype; a later p.Pro346His pedigree adds segregation and experimental support. These reports should not impose a uniform inheritance or mechanism on every RP-like presentation.
  evidence:
  - reference: PMID:29503890
    reference_title: Retinitis pigmentosa associated with a mutation in BEST1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For this reason it is unclear how the H422fsX431 mutation could be solely responsible for RP in the proband despite the fact that it is a large de novo mutation that does not occur in either parent.
    explanation: The single RP case carried other retinal-gene variants and a deletion extending into an adjacent gene; sole causation by BEST1 was unresolved.
  - reference: PMID:41456629
    reference_title: Hsp70/CHIP E3 ligase complex triggers K149-linked ubiquitination and degradation of BEST1 mutants p.P233L and p.P346H, impairing chloride channel function and retinal integrity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we report a c.1037C > A (p.P346H) mutation and a c.698C > T (p.P233L) mutation that co-segregate with the phenotypes of pedigrees affected by RP50 and Best vitelliform macular dystrophy (BVMD), respectively.
    explanation: The newer study reports p.Pro346His segregation with RP50. The available abstract does not establish penetrance or family size.
- name: BEST1-AVMD
  display_name: BEST1-associated adult-onset vitelliform macular dystrophy
  description: Later-onset dominant BEST1 vitelliform disease overlaps clinically with BVMD. This gene-defined presentation excludes acquired vitelliform lesions and adult-onset disease caused by other genes.
  evidence:
  - reference: PMID:20301346
    reference_title: Bestrophinopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'The four recognized phenotypes are the three autosomal dominant disorders: Best vitelliform macular dystrophy (BVMD), BEST1 adult-onset vitelliform macular dystrophy (AVMD), and autosomal dominant vitreoretinochoroidopathy (ADVIRC); and autosomal recessive bestrophinopathy (ARB).'
    explanation: GeneReviews recognizes BEST1-associated AVMD within the dominant spectrum.
    quote_role: REVIEW_SYNTHESIS
  subtype_term:
    preferred_term: BEST1-associated adult-onset vitelliform macular dystrophy
pathophysiology:
- name: Reduced RPE Transepithelial Fluid Transport
  description: Patient-derived ARB iPSC-RPE monolayers showed reduced apical-to-basal fluid transport despite preserved epithelial morphology and no significant change in transepithelial electrical resistance. In a study of one ARB donor, one dominant Best disease donor and two controls, fluid flow was 0.12, 0.29 and 0.35 microliters/hour/cm2, respectively. This cellular transport defect provides a candidate explanation for fluid accumulation; the small donor sample does not establish its magnitude across BEST1 genotypes or demonstrate that epithelial barrier breakdown is required.
  cell_types:
  - preferred_term: Retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  evidence:
  - reference: PMID:32882766
    reference_title: Induced Pluripotent Stem Cell Modeling of Best Disease and Autosomal Recessive Bestrophinopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Fluid transport from apical to basal was significantly decreased in ARB iPSC-RPE compared with BD iPSC-RPE or control iPSC-RPE.
    explanation: Direct fluid-flow measurement in patient-derived RPE; one donor represented each disease group.
  downstream:
  - target: Subretinal Fluid Accumulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Impaired fluid clearance may contribute to subretinal fluid accumulation; this experiment did not demonstrate formation of vitelliform deposits.
  mechanism_confidence: PROVISIONAL
  biological_scale: CELLULAR
- name: BEST1 Channel Dysfunction
  description: 'BEST1 encodes a pentameric calcium-activated anion channel of the RPE basolateral membrane. Variant effects differ: selected dominant patient-derived RPE lines have greatly reduced calcium-activated chloride currents, whereas p.Pro77Ser RPE shows increased halide permeability in a fluorescent biosensor assay. Reduced protein abundance, altered localization and channel-gating defects are allele-dependent. Dominant inheritance does not imply a uniform dominant-negative loss of channel activity.'

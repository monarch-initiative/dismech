    limitations: Lentiviral gene delivery in cultured RPE, not the AAV clinical-trial construct; rescue is allele- and assay-specific. Off-target screening was limited, and a noncoding edit cannot be assumed harmless from location alone.
  - target: Delayed Photoreceptor Outer-Segment Protein Degradation
    relationship: PARTIALLY_RECAPITULATES
    limitations: Bovine outer-segment feeding and rhodopsin immunoblots measure protein clearance in culture, not vision or human retinal anatomy.

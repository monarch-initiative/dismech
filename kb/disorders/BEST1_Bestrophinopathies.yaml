- name: Patient-derived ARB and dominant Best disease iPSC-RPE fluid-transport model
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: Peripheral blood mononuclear cells from one ARB patient, one dominant Best disease patient and two unaffected controls.
  description: Differentiated RPE monolayers on permeable supports were tested for apical-to-basal fluid flow and electrical resistance. ARB cells carried BEST1 p.Leu40Pro and p.Ala195Val. The dominant donor variant is listed as c.287A>G (p.Gln96Arg) in Table 1, whereas the methods call it G96A; that source discrepancy limits allele-specific interpretation. RNA-seq gene-set enrichment implicated EMT and TNF-alpha/NF-kappaB signatures, but no pathway-inhibition experiment established their causal role.

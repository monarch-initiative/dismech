  - name: BEST1 c.867+97G>A
    description: 'Deep-intronic NM_004183.4 founder allele in the studied Chinese ARB cohort: 20/125 disease alleles (16%), not a general-population allele frequency. Minigene and patient PBMC assays showed increased 203-nucleotide intron retention against a nonzero normal background. The same genomic site has different consequences under alternative transcript annotations.'

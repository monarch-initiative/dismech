    reference_title: Impaired Bestrophin Channel Activity in an iPSC-RPE Model of Best Vitelliform Macular Dystrophy (BVMD) from an Early Onset Patient Carrying the P77S Dominant Mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These results pointed to an increased halide entrance in Fi21/01 cells both in a resting state and after calcium release by A23187.
    explanation: Patient-derived p.Pro77Ser RPE showed increased iodide-sensitive YFP quenching, consistent with increased anion permeability. This was a biosensor assay rather than patch-clamp chloride-current measurement.
  - reference: PMID:32707085
    reference_title: Human iPSC Modeling Reveals Mutation-Specific Responses to Gene Therapy in a Genotypically Diverse Dominant Maculopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Gene-corrected Arg218Cys>WT isogenic iPSC-RPE control showed CaCC current density at levels similar to those of native WT control lines
    explanation: Isogenic correction supports the causal effect of p.Arg218Cys on the measured calcium-activated chloride current.
  downstream:
  - target: RPE Apical Microvillar Underdevelopment

- name: ARB p.Arg141His/p.Ile366fsTer18 family iPSC-RPE model
  experimental_model_type: IPSC_DERIVED_MODEL
  description: Multiple clones from one affected donor, her heterozygous parents and three unrelated controls were studied using RNA assays, immunoblotting, localization and outer-segment uptake assays. Both mutant transcripts persisted, p.Arg141His protein was detectable and partly basolateral, and uptake was impaired. The C-terminal antibodies could not detect p.Ile366fsTer18 protein.
  publication: PMID:29540715
  modeled_mechanisms:
  - target: Impaired Photoreceptor Outer-Segment Internalization
    relationship: PARTIALLY_RECAPITULATES
    limitations: Single affected donor with multiple clones, no isogenic correction; the experiment does not separate insufficient protein from qualitative mutant dysfunction.
  evidence:
  - reference: PMID:29540715
    reference_title: Mutant Best1 Expression and Impaired Phagocytosis in an iPSC Model of Autosomal Recessive Bestrophinopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Furthermore, ARB is not universally the result of NMD and ARB, in this patient, is not due to the absence of Best1.
    explanation: Patient-derived RPE carrying p.Arg141His and p.Ile366fsTer18 expressed both mutant transcripts and detectable p.Arg141His protein. The antibody could not detect the truncated protein, so that product was not directly demonstrated.
  - reference: PMID:29540715
    reference_title: Mutant Best1 Expression and Impaired Phagocytosis in an iPSC Model of Autosomal Recessive Bestrophinopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When tested for the ability to phagocytose photoreceptor outer segments, ARB iPSC-RPE exhibited impaired internalization.
    explanation: FITC-labeled bovine outer segments with extracellular fluorescence quenching distinguished internalized from surface-bound material in patient-derived RPE.
- name: BEST1 p.Pro77Ser patient-derived RPE halide-permeability model
  experimental_model_type: IPSC_DERIVED_MODEL
  description: One BVMD donor was compared with two non-isogenic control lines, including a RHO-associated RP donor whose causal gene is not expressed in RPE. Premo halide-sensitive YFP measured iodide influx with and without A23187. BEST1 abundance/localization, short-term synthetic-bead uptake and TUNEL labeling were not significantly altered; patient cells were less pigmented.
  publication: PMID:35806438
  modeled_mechanisms:
  - target: BEST1 Channel Dysfunction
    relationship: MEASURES
    limitations: Halide-sensitive fluorescence is not a direct patch-clamp current measurement. Single affected donor and no isogenic correction limit attribution; normal bead uptake does not exclude a long-term outer-segment processing defect.
  evidence:
  - reference: PMID:35806438
    reference_title: Impaired Bestrophin Channel Activity in an iPSC-RPE Model of Best Vitelliform Macular Dystrophy (BVMD) from an Early Onset Patient Carrying the P77S Dominant Mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These results pointed to an increased halide entrance in Fi21/01 cells both in a resting state and after calcium release by A23187.
    explanation: Patient-derived p.Pro77Ser RPE showed increased iodide-sensitive YFP quenching, consistent with increased anion permeability. This was a biosensor assay rather than patch-clamp chloride-current measurement.
  - reference: PMID:35806438
    reference_title: Impaired Bestrophin Channel Activity in an iPSC-RPE Model of Best Vitelliform Macular Dystrophy (BVMD) from an Early Onset Patient Carrying the P77S Dominant Mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We observed that the rate of phagocytosis was increased over time and there were no differences between the patient line and the control lines (Figure 6b).
    explanation: Uptake of synthetic microspheres over 4-24 hours was unchanged; this does not test long-term photoreceptor outer-segment degradation.
- name: BEST1 p.Pro233Leu and p.Pro346His polarized MDCK II model
  experimental_model_type: CELL_LINE
  description: Polarized MDCK II cells expressing these BEST1 mutants showed reduced channel activity, altered localization and effects on wild-type protein. The study reports Hsp70/CHIP-mediated ubiquitination at Lys149. Detailed construct, replicate and rescue conditions were not available in the retrieved abstract.
  publication: PMID:41456629
  modeled_mechanisms:
  - target: Allele-Specific BEST1 Ubiquitination
    relationship: MEASURES
  - target: Reduced BEST1 Membrane Localization
    relationship: MEASURES
  evidence:
  - reference: PMID:41456629
    reference_title: Hsp70/CHIP E3 ligase complex triggers K149-linked ubiquitination and degradation of BEST1 mutants p.P233L and p.P346H, impairing chloride channel function and retinal integrity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lys149 was identified as the site responsible for ubiquitination of p.P346H- and p.P233L-bestrophin-1, mediated by Hsp70 and the C-terminal Hsp70-interacting protein (CHIP).
    explanation: The study identifies BEST1 residue Lys149 as the modified site for these two mutants; this is not a ubiquitin-chain linkage designation.
  - reference: PMID:41456629
    reference_title: Hsp70/CHIP E3 ligase complex triggers K149-linked ubiquitination and degradation of BEST1 mutants p.P233L and p.P346H, impairing chloride channel function and retinal integrity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mutant bestrophin-1 proteins p.P346H and p.P233L undergo ubiquitination and degradation, preventing their localization to the cell membrane of MDCK II cells and the RPE of zebrafish, thereby reducing chloride channel activity.
    explanation: The abstract reports degradation and mislocalization in polarized cells and zebrafish; no universal degradation mechanism across BEST1 alleles is inferred.
- name: HEK293 BEST1 mutant and wild-type coexpression with PABA rescue
  experimental_model_type: CELL_LINE
  description: Whole-cell patch clamp tested six mutant constructs (p.Ala10Thr, p.Arg218His, p.Leu234Pro, p.Ala243Thr, p.Gln293Lys and p.Asp302Ala) coexpressed with wild-type BEST1 at a 4:1 mutant:wild-type ratio. Extracellular 4-aminobenzoic acid restored currents at allele-dependent concentrations. Cryo-EM of purified BEST1-PABA complexes supports extracellular binding and neck-gate opening. The study did not demonstrate retinal rescue in patients.
  publication: DOI:10.1038/s41467-024-54938-z
  modeled_mechanisms:
  - target: BEST1 Channel Dysfunction
    relationship: RESCUES
    limitations: Selected loss-of-function constructs and an imposed coexpression ratio; gain-of-function variants and recessive mutants require separate assessment.
  evidence:
  - reference: DOI:10.1038/s41467-024-54938-z
    reference_title: Neurotransmitter-bound bestrophin channel structures reveal small molecule drug targeting sites for disease treatment
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we individually co-transfected six patient-derived dominant LOF mutants (A10T, R218H, L234P, A243T, Q293K and D302A) along with WT Best1 into HEK293 cells at a 4:1 ratio
    explanation: The six clinical-origin mutant constructs were tested in engineered HEK293 cells with a chosen mutant:wild-type expression ratio, not in cells derived from these patients.
  - reference: DOI:10.1038/s41467-024-54938-z
    reference_title: Neurotransmitter-bound bestrophin channel structures reveal small molecule drug targeting sites for disease treatment
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: and were fully rescued by PABA at different concentrations
    explanation: PABA restored the reduced whole-cell chloride currents in the six engineered coexpression conditions; this does not demonstrate restoration of vision.
- name: Mutant BEST1 and CaV1.3 interaction in polarized RPE
  experimental_model_type: OTHER
  description: Heterologous channel expression, polarized primary porcine RPE and human iPSC-RPE were used to examine interaction, activity and surface expression of CaV1.3 in the presence of four BEST1 hotspot mutants. The retrieved abstract supports a cellular calcium-channel effect but not a complete pathway to clinical degeneration.
  publication: PMID:31930599
  modeled_mechanisms:
  - target: Reduced CaV1.3 Channel Activity
    relationship: MEASURES
  evidence:
  - reference: PMID:31930599
    reference_title: Inhibition of Ca(2+) channel surface expression by mutant bestrophin-1 in RPE cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For the four selected BEST1 mutations, presence of mutant bestrophin-1 led to reduced CaV 1.3 activity by modulating pore-function or decreasing surface expression.
    explanation: T6P, F80L, R218C and F305S affected the interacting L-type calcium channel in cellular assays; the relative contribution of gating versus trafficking was variant-dependent.
- name: BEST1 p.Pro77Ser iPSC-RPE lipoplex-mediated precise editing
  experimental_model_type: IPSC_DERIVED_MODEL
  description: FRIMOi006-A patient-derived RPE carrying c.229C>T underwent Cas9 or Cas12 editing with a repair template, HDR enhancer and NHEJ inhibitor. Single-cell cloning and Sanger sequencing detected corrected alleles but also conversion to homozygous pathogenic sequence following wild-type allele cleavage. Morphology and RPE markers were preserved; chloride-channel rescue was not measured. Retinal-organoid delivery experiments had very low or undetectable cleavage under the tested conditions.
  publication: PMID:41827889
  modeled_mechanisms:
  - target: BEST1 Channel Dysfunction
    relationship: PERTURBS
    limitations: The intervention changes the causal allele; the study reports DNA correction rather than functional channel rescue. Clone survival/selection affects the editing-efficiency denominator.
  evidence:
  - reference: PMID:41827889
    reference_title: Precise CRISPR/Cas9 and Cas12 Correction Using Lipoplexes in Retinal Models Derived from Patients with Inherited Retinal Dystrophies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the assay performed with CRISPRMAX rendered the best ratios of HDR correction and gene editing of the mutant allele resulting in 10.53% properly repaired clones, whereas only 2.63% harbored the pathogenic variant in homozygosis
    explanation: Cas12/CRISPRMAX corrected 10.53% of screened surviving clones but also generated homozygous pathogenic clones. These are not percentages of all treated retinal cells.
  - reference: PMID:41827889
    reference_title: Precise CRISPR/Cas9 and Cas12 Correction Using Lipoplexes in Retinal Models Derived from Patients with Inherited Retinal Dystrophies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we found no off-target effects in edited clones, except in one clone in which we observed a single-nucleotide change in the experiment performed using Cas9
    explanation: Targeted Sanger screening of a few predicted sites detected one Cas9-associated off-target change; this does not exclude genome-wide off-target effects.

- name: Delayed Photoreceptor Outer-Segment Protein Degradation
  description: Selected dominant BEST1 patient-derived iPSC-RPE models show delayed degradation of rhodopsin after photoreceptor outer-segment feeding. Wild-type BEST1 augmentation improved this endpoint in p.Arg218Cys and p.Asn296His cells but not p.Ala146Lys cells. This is a post-feeding protein-clearance readout and does not by itself measure outer-segment internalization or prove the composition of human vitelliform lesions.

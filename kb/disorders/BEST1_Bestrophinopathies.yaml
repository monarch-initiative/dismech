  - name: BEST1 c.1101-491A>G
    description: Deep-intronic NM_004183.4 variant found in recessive disease; 204-nucleotide pseudoexon inclusion was observed in a HEK293T minigene and RNA from a patient also carrying p.Leu40Pro. Predicted p.Ser367ArgfsTer59 and NMD are inferred consequences, not measured protein or decay outcomes.

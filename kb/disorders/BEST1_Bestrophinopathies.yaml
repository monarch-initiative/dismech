- name: RPE Apical Microvillar Underdevelopment
  description: Recessive canine BEST1 disease shows fewer and shorter RPE apical microvilli before visible retinal lesions, with loss of cone outer-segment ensheathment and compromised interphotoreceptor matrix in established disease. These structural defects were absent in the comparator CNGB3 cone-channelopathy model. Altered calcium-dependent EZRIN activation is a proposed intermediate, not a directly tested BEST1-to-EZRIN pathway.
  cell_types:

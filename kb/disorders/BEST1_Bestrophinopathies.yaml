  biological_scale: CELLULAR
- name: Light-Modulated RPE-Photoreceptor Microdetachment
  description: Canine recessive BEST1 retinas show diffuse separation between RPE and photoreceptors that expands with light and contracts after dark adaptation. Early affected regions retain photoreceptor nuclear numbers, with increased internuclear spacing proposed to explain outer nuclear layer thickening. Advanced gross detachments can show outer nuclear layer loss. The canine light-dependent response is not established as a universal human phenotype.

- name: Retinal Pigment Epithelium Atrophy
  description: Imaging can demonstrate loss of RPE at the macula and, in ARB, peripheral patches. Atrophy is distinct from persistent fluid and from fibrosis. The route from altered channel function and outer-segment handling to RPE cell loss remains incompletely resolved, and atrophy is not present at every disease stage.
  evidence:

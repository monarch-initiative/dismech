    reference_title: 'Autosomal Recessive Bestrophinopathy: Clinical Features, Natural History, and Genetic Findings in Preparation for Clinical Trials.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Ten eyes of 6 patients manifested patches of peripheral RPE atrophy.
    explanation: Peripheral RPE atrophy was observed in the ARB cohort; not every patient had diffuse degeneration.
  downstream:

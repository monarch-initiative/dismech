animal_models:
- name: Recessive canine BEST1 retinal degeneration and AAV2 augmentation
  species: Dog
  genotype: BEST1 p.Arg25Ter homozygous, p.Pro463fs homozygous, or p.Arg25Ter/p.Pro463fs compound heterozygous
  description: Naturally occurring recessive canine alleles were examined in 18 affected dogs alongside 12 controls. Serial OCT, autofluorescence and retinal immunohistochemistry documented microvillar defects, light-dependent microdetachments and focal or multifocal gross lesions. Subretinal AAV2 with a VMD2 promoter and human or canine BEST1 restored local retinal attachment and interface architecture, with long-term follow-up. The experiment does not establish treatment efficacy for human dominant alleles.
  publication: PMID:29507198
  modeled_mechanisms:
  - target: RPE Apical Microvillar Underdevelopment
    relationship: RECAPITULATES
  - target: Light-Modulated RPE-Photoreceptor Microdetachment
    relationship: RECAPITULATES
  - target: Light-Modulated RPE-Photoreceptor Microdetachment
    relationship: RESCUES
    limitations: Rescue was measured after subretinal AAV2-BEST1 delivery in recessive canine disease.
  evidence:
  - reference: PMID:29507198
    reference_title: BEST1 gene therapy corrects a diffuse retina-wide microdetachment modulated by light exposure.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In vivo imaging demonstrated a retina-wide RPE-PR microdetachment, which contracted with dark adaptation and expanded upon exposure to a moderate intensity of light.
    explanation: In vivo OCT demonstrated reversible, light-dependent separation in the recessive canine model.
  - reference: PMID:29507198
    reference_title: BEST1 gene therapy corrects a diffuse retina-wide microdetachment modulated by light exposure.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The microdetachments did not result in thinning of the ONL that would be expected from photoreceptor degeneration.  # codespell:ignore onl
    explanation: Early microdetachment regions had normal photoreceptor nuclear counts and often thicker outer nuclear layers; photoreceptor loss was associated with advanced gross lesions rather than established for every microdetachment.
  - reference: PMID:29507198
    reference_title: BEST1 gene therapy corrects a diffuse retina-wide microdetachment modulated by light exposure.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Subretinal BEST1 gene augmentation therapy using adeno-associated virus 2 reversed not only clinically detectable subretinal lesions but also the diffuse microdetachments.
    explanation: AAV2 carrying canine or human BEST1 restored attachment within treated retinal regions; these are preclinical outcomes.
- name: Zebrafish RPE expressing BEST1 p.Pro233Leu or p.Pro346His
  species: Zebrafish
  description: The study reports mutant BEST1 degradation and mislocalization in zebrafish RPE with disrupted retinal layered structure. Developmental stage and detailed expression strategy were not available in the retrieved abstract, limiting interpretation as a human disease-course model.
  publication: PMID:41456629
  modeled_mechanisms:
  - target: Reduced BEST1 Membrane Localization
    relationship: RECAPITULATES
    limitations: Abstract-level evidence; no inference about human penetrance or clinical efficacy.
  evidence:
  - reference: PMID:41456629
    reference_title: Hsp70/CHIP E3 ligase complex triggers K149-linked ubiquitination and degradation of BEST1 mutants p.P233L and p.P346H, impairing chloride channel function and retinal integrity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Mislocalization of mutant bestrophin-1 to the RPE impaired the multicellular layered structure of the retina.
    explanation: The zebrafish experiment links mutant localization to retinal structural abnormalities; the retrieved abstract does not establish an adult visual-function outcome.
clinical_trials:
- name: NCT07185256
  description: OPGx-BEST1 open-label phase 1b/2a dose-exploration study of a single subretinal injection in adults with genetically confirmed BVMD or ARB. The registry excludes other bestrophinopathies such as AOFVD and ADVIRC and restricts eligible dominant variants; this is not a trial for the whole spectrum.
  status: RECRUITING
  notes: ClinicalTrials.gov API checked 2026-09-27; record updated 2026-09-24. Combined phase 1b/2a is stated in the description because the phase enum has no combined value.
  evidence:
  - reference: clinicaltrials:NCT07185256
    reference_title: A Phase 1b/2a, Open-Label, Dose-Exploration Basket Study to Investigate the Safety and Tolerability of Subretinally Injected OPGx-BEST1 Administered in Patients With Either Autosomal-Dominant BEST1 Disease (Best Vitelliform Macular Dystrophy [BVMD]) or Autosomal-Recessive Bestrophinopathy (ARB)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Evaluate the safety and tolerability of drug OPGx-BEST1 in one eye (the treatment eye), for 5 years post-injection, in participants with BVMD or ARB.
    explanation: The trial tests unilateral gene delivery with long-term follow-up; registration is not evidence of efficacy.
- name: NCT05809635
  description: Observational natural-history study of BEST1-associated vitelliform macular dystrophy to define progression and trial outcome measures. The registry title mentions retinitis pigmentosa, but its summary and eligibility describe BEST1 VMD.
  phase: NOT_APPLICABLE
  notes: ClinicalTrials.gov API checked 2026-09-27 still reported RECRUITING, but its last update was 2025-07-30 and estimated completion was May 2026; current recruitment cannot be inferred confidently from this stale record.
  evidence:
  - reference: clinicaltrials:NCT05809635
    reference_title: Natural History Study in Retinitis Pigmentosa Caused by Mutations in the BEST1 Gene
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Report the natural history of retinal degeneration in participants with a clinical diagnosis of VMD with molecular confirmation of a pathogenic BEST1 mutation(s).
    explanation: The study is observational rather than a therapeutic intervention.

genetic:
- name: BEST1
  gene_term:
    preferred_term: BEST1
    term:
      id: hgnc:12703
      label: BEST1
  association: Causative
  features: BEST1-associated disease includes dominant and recessive inheritance with substantial allelic and phenotypic overlap. Protein abundance, channel activity, splicing and response to experimental gene augmentation depend on the allele. Biallelic disease does not invariably represent complete protein absence.
  variants:
  - name: Dominant missense variants
    description: Dominant BEST1 variants can impair channel function or localization, and some increase measured anion permeability. Molecular effects and clinical expressivity require allele-specific assessment.
    evidence:
    - reference: PMID:35806438
      reference_title: Impaired Bestrophin Channel Activity in an iPSC-RPE Model of Best Vitelliform Macular Dystrophy (BVMD) from an Early Onset Patient Carrying the P77S Dominant Mutation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: These results pointed to an increased halide entrance in Fi21/01 cells both in a resting state and after calcium release by A23187.
      explanation: Patient-derived p.Pro77Ser RPE showed increased iodide-sensitive YFP quenching, consistent with increased anion permeability. This was a biosensor assay rather than patch-clamp chloride-current measurement.
  - name: Biallelic loss-of-function variants
    description: Biallelic BEST1 variants causing recessive disease can reduce expression or impair function. Residual transcript and protein expression are documented in some genotypes; a null-protein mechanism must not be assumed for every ARB allele.
    evidence:
    - reference: PMID:29540715
      reference_title: Mutant Best1 Expression and Impaired Phagocytosis in an iPSC Model of Autosomal Recessive Bestrophinopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Furthermore, ARB is not universally the result of NMD and ARB, in this patient, is not due to the absence of Best1.
      explanation: Patient-derived RPE carrying p.Arg141His and p.Ile366fsTer18 expressed both mutant transcripts and detectable p.Arg141His protein. The antibody could not detect the truncated protein, so that product was not directly demonstrated.
  - name: BEST1 p.Arg218Cys

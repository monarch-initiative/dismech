      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Lys149 was identified as the site responsible for ubiquitination of p.P346H- and p.P233L-bestrophin-1, mediated by Hsp70 and the C-terminal Hsp70-interacting protein (CHIP).
      explanation: The study identifies BEST1 residue Lys149 as the modified site for these two mutants; this is not a ubiquitin-chain linkage designation.

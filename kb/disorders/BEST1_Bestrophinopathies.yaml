  biological_scale: TISSUE
- name: Subretinal Vitelliform Material Accumulation
  description: Subretinal deposits appear as hyperreflective material on OCT and increased fundus autofluorescence. They may coalesce into central egg-yolk lesions in BVMD or remain multifocal in ARB. Defective outer-segment processing is a candidate contributor, but the cell assays do not establish the full chemical composition of human lesions.

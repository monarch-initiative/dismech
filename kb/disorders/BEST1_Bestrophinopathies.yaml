- name: Gene Therapy (Investigational)
  description: Subretinal AAV2-BEST1 augmentation restored retinal attachment and RPE-photoreceptor interface architecture in recessive canine models. Patient-derived dominant RPE models show allele-dependent responses to lentiviral BEST1 augmentation, so animal efficacy cannot be generalized to every dominant genotype. Human clinical development requires separate trial evidence.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:29507198
    reference_title: BEST1 gene therapy corrects a diffuse retina-wide microdetachment modulated by light exposure.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Subretinal BEST1 gene augmentation therapy using adeno-associated virus 2 reversed not only clinically detectable subretinal lesions but also the diffuse microdetachments.
    explanation: AAV2 carrying canine or human BEST1 restored attachment within treated retinal regions; these are preclinical outcomes.
  - reference: clinicaltrials:NCT07185256
    reference_title: A Phase 1b/2a, Open-Label, Dose-Exploration Basket Study to Investigate the Safety and Tolerability of Subretinally Injected OPGx-BEST1 Administered in Patients With Either Autosomal-Dominant BEST1 Disease (Best Vitelliform Macular Dystrophy [BVMD]) or Autosomal-Recessive Bestrophinopathy (ARB)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Evaluate the safety and tolerability of drug OPGx-BEST1 in one eye (the treatment eye), for 5 years post-injection, in participants with BVMD or ARB.
    explanation: The trial tests unilateral gene delivery with long-term follow-up; registration is not evidence of efficacy.
- name: Ophthalmic surveillance and refractive care
  description: Monitor visual acuity, retinal imaging and complications; address refractive error and childhood amblyopia risk. Anterior chamber angle and pressure assessment are particularly relevant in ARB and ADVIRC/MRCS.
  evidence:
  - reference: PMID:20301346
    reference_title: Bestrophinopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Annual ophthalmologic examination (including best corrected visual acuity, visual fields, and spectral domain optical coherence tomography) to monitor progression of fundus lesions and to evaluate for coincidental development of CNV
    explanation: GeneReviews recommends regular ophthalmic surveillance.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38278445
    reference_title: 'Best Vitelliform Macular Dystrophy Natural History Study Report 1: Clinical Features and Genetic Findings.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These findings stress the importance of a consequent management of highly prevalent refractive errors in BVMD to avoid the development of amblyopia
    explanation: The clinical cohort emphasizes refractive correction and prevention of additional amblyopic vision loss.
- name: Management of angle-closure glaucoma
  description: Angle-closure risk and established glaucoma require ophthalmic management. Laser peripheral iridotomy and lens extraction were used in selected ARB patients; the observational cohort does not establish one procedure for all genotypes or anatomical presentations.
  evidence:
  - reference: PMID:33039401
    reference_title: 'Autosomal Recessive Bestrophinopathy: Clinical Features, Natural History, and Genetic Findings in Preparation for Clinical Trials.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Eight patients demonstrated angle-closure glaucoma; 5 of these patients underwent bilateral peripheral laser iridotomy, and 4 of these patients underwent bilateral clear lens extraction.
    explanation: Eight of 28 ARB patients had angle-closure glaucoma, with clinically selected procedures rather than a randomized treatment comparison.
- name: 4-Aminobenzoic acid channel activation (preclinical)
  description: PABA restored calcium-dependent chloride currents in HEK293 cells coexpressing selected dominant loss-of-function BEST1 mutants and wild-type protein. Structural data place PABA at an extracellular allosteric site. This is an experimental pharmacologic lead without demonstrated clinical efficacy; it cannot be generalized to increased-permeability alleles.
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: DOI:10.1038/s41467-024-54938-z
    reference_title: Neurotransmitter-bound bestrophin channel structures reveal small molecule drug targeting sites for disease treatment
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we individually co-transfected six patient-derived dominant LOF mutants (A10T, R218H, L234P, A243T, Q293K and D302A) along with WT Best1 into HEK293 cells at a 4:1 ratio
    explanation: The six clinical-origin mutant constructs were tested in engineered HEK293 cells with a chosen mutant:wild-type expression ratio, not in cells derived from these patients.
  - reference: DOI:10.1038/s41467-024-54938-z
    reference_title: Neurotransmitter-bound bestrophin channel structures reveal small molecule drug targeting sites for disease treatment
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: and were fully rescued by PABA at different concentrations
    explanation: PABA restored the reduced whole-cell chloride currents in the six engineered coexpression conditions; this does not demonstrate restoration of vision.
- name: Carbonic anhydrase inhibitors for cystic macular fluid
  description: Topical carbonic anhydrase inhibitors have been used for intraretinal cystic changes in ARB, with variable anatomical and visual responses in small series. Response does not establish disease modification, and subretinal fluid requires assessment for other causes including neovascularization.
  evidence:
  - reference: PMID:34015078
    reference_title: Phenotypic and Genetic Spectrum of Autosomal Recessive Bestrophinopathy and Best Vitelliform Macular Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The retinal microstructure normalized in the probands from families B and E. No change was noted in patient C over one year. Only patient E experienced an improvement in visual acuity.
    explanation: Three ARB patients received topical carbonic anhydrase inhibitors; anatomical and visual responses differed.
- name: Allele-selective disruption or precise correction of BEST1 (preclinical)
  description: Mutant-allele disruption restored channel currents in selected dominant patient-derived RPE lines. A separate 2026 study precisely corrected c.229C>T in surviving RPE clones using Cas9/Cas12 lipoplexes, but also produced homozygous pathogenic clones and did not measure functional rescue. These distinct experimental approaches require further assessment of delivery, allele specificity and unintended edits.
  therapeutic_modality: GENE_THERAPY
  evidence:
  - reference: PMID:41827889
    reference_title: Precise CRISPR/Cas9 and Cas12 Correction Using Lipoplexes in Retinal Models Derived from Patients with Inherited Retinal Dystrophies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the assay performed with CRISPRMAX rendered the best ratios of HDR correction and gene editing of the mutant allele resulting in 10.53% properly repaired clones, whereas only 2.63% harbored the pathogenic variant in homozygosis
    explanation: Cas12/CRISPRMAX corrected 10.53% of screened surviving clones but also generated homozygous pathogenic clones. These are not percentages of all treated retinal cells.
  - reference: PMID:41827889
    reference_title: Precise CRISPR/Cas9 and Cas12 Correction Using Lipoplexes in Retinal Models Derived from Patients with Inherited Retinal Dystrophies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we found no off-target effects in edited clones, except in one clone in which we observed a single-nucleotide change in the experiment performed using Cas9
    explanation: Targeted Sanger screening of a few predicted sites detected one Cas9-associated off-target change; this does not exclude genome-wide off-target effects.
  - reference: PMID:32707085
    reference_title: Human iPSC Modeling Reveals Mutation-Specific Responses to Gene Therapy in a Genotypically Diverse Dominant Maculopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Gene-corrected Arg218Cys>WT isogenic iPSC-RPE control showed CaCC current density at levels similar to those of native WT control lines
    explanation: Isogenic correction restored the measured calcium-activated chloride-current phenotype in the 2020 study.

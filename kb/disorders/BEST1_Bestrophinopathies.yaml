    supports: SUPPORT
    snippet: electrophysiology changes show a moderately decreased electro-oculography (EOG) Arden ratio of less than 1.5 with frequently normal full-field electroretinogram (ffERG).
    explanation: Documents the characteristic EOG abnormality in BVMD with normal ERG.
  - reference: PMID:39048936
    reference_title: Clinical and genetic features in autosomal recessive bestrophinopathy in Chinese cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: EOG recordings showed a typically decreased Arden ratio in 12 patients, and a normal or slightly decreased Arden ratio in two patients.
    explanation: The abstract reports 14 tested patients; the full-text table lists three additional patients without EOG. Abnormal EOG is common but a fixed absent-light-rise threshold is not universal.

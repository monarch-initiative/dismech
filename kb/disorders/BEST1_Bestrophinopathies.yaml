    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When tested for the ability to phagocytose photoreceptor outer segments, ARB iPSC-RPE exhibited impaired internalization.
    explanation: FITC-labeled bovine outer segments with extracellular fluorescence quenching distinguished internalized from surface-bound material in patient-derived RPE.

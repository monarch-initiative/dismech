  biological_scale: CELLULAR
- name: Subretinal Fluid Accumulation
  description: Subretinal fluid is observed in BEST1-associated retinopathy, often persistent in ARB. Impaired RPE fluid handling is a candidate contributor, while neovascular leakage requires separate assessment. Chronic fluid can coexist with retained photoreceptors for years; its presence alone does not establish progressive cell death.
  cell_types:

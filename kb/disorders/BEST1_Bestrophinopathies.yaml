  - name: BEST1 p.Pro77Ser
    description: Heterozygous c.229C>T reported de novo in a patient with BVMD. Patient-derived RPE showed increased iodide-sensitive YFP quenching, with preserved BEST1 expression and basolateral localization. This supports a possible gain-of-function mechanism; no isogenic rescue or patch-clamp chloride measurement was performed in that study.

name: Idiopathic Hypereosinophilic Syndrome
creation_date: "2026-09-06T14:30:00Z"
category: Complex
description: >-
  Idiopathic hypereosinophilic syndrome (idiopathic HES, HES-I) is the
  diagnosis-of-exclusion variant of the hypereosinophilic syndromes: persistent
  blood eosinophilia at or above 1.5 x 10^9/L with eosinophil-mediated end-organ
  damage, in a patient for whom a systematic work-up has ruled out reactive
  (secondary) causes, a clonal myeloid driver such as FIP1L1-PDGFRA, and an
  aberrant or clonal T-cell population. It is defined by what cannot be found:
  the eosinophilopoietic drive is real and sustained but its origin is unproven,
  which is why the entry's central mechanistic claim is a negative one and why
  the disorder is separated here from the myeloid (imatinib-responsive) and
  lymphocytic variants that share its downstream tissue injury. Organ damage
  follows a stereotyped route regardless of variant - eosinophil recruitment,
  degranulation, and granule-protein cytotoxicity - with endomyocardial disease
  and thromboembolism the manifestations that determine prognosis.
disease_term:
  preferred_term: idiopathic hypereosinophilic syndrome
  term:
    id: MONDO:0011895
    label: idiopathic hypereosinophilic syndrome
synonyms:
- Idiopathic HES
- HES-I
- HES of undetermined origin
parents:
- Hypereosinophilic Syndrome
- Eosinophilic Disorder
notes: >-
  Curated as a separate entry from Hypereosinophilic_Syndrome (MONDO:0015691),
  where idiopathic HES had previously been carried only as a bare has_subtypes
  stub. The split follows the promotion test used elsewhere in this repository:
  idiopathic HES has a distinct diagnostic pathway (it is constituted by an
  exclusion work-up rather than by a positive finding) and a distinct first-line
  therapy from its sibling variants - corticosteroids and anti-IL-5 biologics
  rather than imatinib, which is markedly less effective in FIP1L1-PDGFRA
  negative disease (23% vs 88%, PMID:19910029). The parent entry remains the
  place for cross-variant content.

  Caution on the disease_term binding. MONDO:0011895 is derived from OMIM:607685,
  which defines its concept around the FIP1L1-PDGFRA fusion; MONDO consequently
  asserts "has material basis in germline mutation in PDGFRA" (RO:0004003 to
  hgnc:8803) on this term, and also places it under idiopathic cardiomyopathy
  (MONDO:0005110) and familial restrictive cardiomyopathy (MONDO:0016340). Those
  axioms describe the myeloid variant, which is precisely what the modern
  ICOG-EO definition of idiopathic HES excludes (PMID:22460074). MONDO:0011895
  is nonetheless the only MONDO term whose label names this concept, so it is
  bound here and the discrepancy is recorded rather than papered over. It is
  reported as an open item in the discussions section.

  On factoring out the shared cascade. The recruitment -> degranulation ->
  granule-protein cytotoxicity -> tissue injury chain in this entry is not
  idiopathic-specific: it recurs in myeloid and lymphocytic HES, in EGPA, and in
  the organ-restricted eosinophilic diseases, and this entry's own description
  says the damage route is stereotyped across variants. There is no eosinophil
  effector module in kb/modules/ today, so both this entry and the parent
  re-derive the chain. A module would let both conform and would leave this
  entry carrying only what is genuinely idiopathic - the exclusion work-up, the
  imatinib negative, and the unexplained driver. Recorded here as a deliberate
  follow-up rather than done inline, since creating a module is a separate
  change touching several existing entries.
pathophysiology:
- name: Unexplained Eosinophil Lineage Expansion
  biological_scale: CELLULAR
  description: >-
    Sustained expansion of the eosinophil lineage without a demonstrable clonal
    myeloid lesion or an identifiable aberrant T-cell population driving it.
    This is the defining feature of the idiopathic variant and it is a negative
    characterisation: the same downstream cascade in myeloid HES traces to a
    kinase fusion and in lymphocytic HES to cytokine-producing T cells, whereas
    here a systematic work-up returns neither. The proximate driver is therefore
    unknown rather than absent.
  cell_types:
  - preferred_term: eosinophil progenitor cell
    term:
      id: CL:0000611
      label: eosinophil progenitor cell
  biological_processes:
  - preferred_term: eosinophil differentiation
    modifier: INCREASED
    term:
      id: GO:0030222
      label: eosinophil differentiation
  evidence:
  - reference: PMID:25964669
    reference_title: "How I treat hypereosinophilic syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Moreover, the etiology of the eosinophilia in HESs can be primary
      (myeloid), secondary (lymphocyte-driven), or unknown.
    explanation: >-
      Establishes the three-way aetiologic split in which the idiopathic variant
      is the "unknown" arm, distinguished from the myeloid and
      lymphocyte-driven arms rather than from a shared downstream phenotype.
  - reference: PMID:26637706
    reference_title: "Eosinophilia: a pragmatic approach to diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Unfortunately, despite recent advances in molecular and immunologic
      techniques, the etiology remains unproven in the overwhelming majority of
      cases.
    explanation: >-
      Supports the claim that the eosinophilopoietic driver is unproven in most
      patients with marked eosinophilia, which is what makes the idiopathic
      category large rather than residual.
  - reference: PMID:1090795
    reference_title: "The hypereosinophilic syndrome: analysis of fourteen cases with review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The etiology of HES remains unknown, as does the mechanism of tissue
      damage.
    explanation: >-
      The original clinical description of the syndrome already framed it around
      an unknown aetiology, which is the historical basis for the "idiopathic"
      designation.
  downstream:
  - target: IL-5-Dependent Eosinophil Survival and Tissue Recruitment
    causal_link_type: DIRECT
    description: >-
      Expanded eosinophil output is sustained in the periphery by IL-5-dependent
      survival and recruitment signalling.
- name: IL-5-Dependent Eosinophil Survival and Tissue Recruitment
  biological_scale: MOLECULAR
  description: >-
    IL-5 signalling through IL-5R-alpha maintains eosinophil survival, primes
    the cells, and supports their recruitment into tissue. The pathway is
    inferred to be operative in idiopathic HES chiefly from therapeutic
    reversal: neutralising IL-5 or depleting IL-5R-alpha-bearing cells lowers
    blood, marrow, and tissue eosinophilia and controls disease in
    FIP1L1-PDGFRA-negative patients.
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: interleukin-5-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0038043
      label: interleukin-5-mediated signaling pathway
  - preferred_term: eosinophil chemotaxis
    modifier: INCREASED
    term:
      id: GO:0048245
      label: eosinophil chemotaxis
  evidence:
  - reference: PMID:30943337
    reference_title: "Benralizumab for PDGFRA-Negative Hypereosinophilic Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The numbers of bone marrow eosinophils, eosinophil precursors, and blood
      and bone marrow basophils were significantly decreased at week 12 in all
      the patients in the benralizumab group, but the number of mast cells and
      serum tryptase levels were unchanged
    explanation: >-
      Blocking IL-5R-alpha depletes marrow eosinophils and their precursors in
      PDGFRA-negative HES, which supports IL-5 receptor signalling sustaining
      the expanded lineage. Indirect because it argues from therapeutic reversal
      rather than measuring the pathway in untreated disease.
  - reference: PMID:39056762
    reference_title: "Managing Patients with Hypereosinophilic Syndrome: A Statement from the Italian Society of Allergy, Asthma, and Clinical Immunology (SIAAIC)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      IL-5 plays a pivotal role in promoting eosinophils differentiation,
      activation, and survival
    explanation: >-
      States the three functions of IL-5 that this node asserts - lineage
      differentiation, priming, and prolonged survival.
  downstream:
  - target: Persistent Blood and Tissue Hypereosinophilia
    causal_link_type: DIRECT
  - target: Chemokine-Driven Eosinophil Recruitment into Tissue
    causal_link_type: DIRECT
    description: >-
      Primed circulating eosinophils are directed into target tissue by
      eosinophil-selective chemokine signalling.
- name: Chemokine-Driven Eosinophil Recruitment into Tissue
  biological_scale: CELLULAR
  description: >-
    Eosinophil-selective chemokines - the eotaxins CCL11, CCL24, and CCL26
    acting through CCR3, alongside CCL3 and CCL5 - direct primed eosinophils out
    of the circulation and into skin, lung, gut, and myocardium. This step is
    what converts a blood count into tissue disease, and it is the reason the
    circulating count and the tissue burden can move independently. It is
    inferred from general eosinophil biology rather than demonstrated uniquely
    in the idiopathic variant.
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: eosinophil chemotaxis
    modifier: INCREASED
    term:
      id: GO:0048245
      label: eosinophil chemotaxis
  evidence:
  - reference: PMID:38611061
    reference_title: "Clinical and Therapeutic Intervention of Hypereosinophilia in the Era of Molecular Diagnosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Because of activation by CCL5 and other cytokines, CCL3 can stimulate
      eosinophilic chemotaxis, which is important for eosinophil migration.
    explanation: >-
      Establishes chemokine-driven eosinophil chemotaxis as the recruitment
      mechanism. Indirect because it describes eosinophil biology generally
      rather than measurements made in idiopathic HES.
  downstream:
  - target: Eosinophil Activation and Degranulation
    causal_link_type: DIRECT
- name: Persistent Blood and Tissue Hypereosinophilia
  biological_scale: ORGANISM
  description: >-
    Blood eosinophilia at or above 1.5 x 10^9/L persisting over weeks to months,
    accompanied by eosinophil accumulation in target tissues. Persistence rather
    than peak count is the disease-defining feature; the historical criterion
    required six months, which contemporary criteria have relaxed so that
    treatment is not withheld while damage accrues.
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  evidence:
  - reference: PMID:1090795
    reference_title: "The hypereosinophilic syndrome: analysis of fourteen cases with review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The syndrome is manifest by persistent and prolonged eosinophilia with
      organ damage.
    explanation: >-
      States the persistence-plus-organ-damage construct that defines the
      syndrome, as opposed to transient or asymptomatic eosinophilia.
  - reference: PMID:30567176
    reference_title: "Idiopathic hypereosinophilic syndrome with cutaneous involvement: a comparative review of 32 cases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Idiopathic HES is characterised by peripheral blood eosinophilia (>1.5 ×
      109/L) for at least 6 months
    explanation: >-
      Gives the threshold and the historical duration requirement specifically
      for the idiopathic variant.
  downstream:
  - target: Eosinophil Activation and Degranulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39056762
      reference_title: "Managing Patients with Hypereosinophilic Syndrome: A Statement from the Italian Society of Allergy, Asthma, and Clinical Immunology (SIAAIC)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Indeed, persistent HE may be associated with eosinophil infiltration
        into tissues, thus leading to tissue and organ damage caused mainly by
        the release of eosinophil effector molecules
      explanation: >-
        States the step from persistent hypereosinophilia to tissue infiltration
        and effector-molecule release, which is this edge rather than either
        node alone.
- name: Eosinophil Activation and Degranulation
  biological_scale: CELLULAR
  description: >-
    Tissue-recruited eosinophils are activated and release their secondary
    granule contents - major basic protein, eosinophil cationic protein,
    eosinophil-derived neurotoxin, and eosinophil peroxidase - into the
    extracellular space. Degranulation, not eosinophil number alone, is the step
    that converts hypereosinophilia into tissue damage.
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: eosinophil degranulation
    modifier: INCREASED
    term:
      id: GO:0043308
      label: eosinophil degranulation
  evidence:
  - reference: PMID:2882081
    reference_title: "Deposits of eosinophil granule proteins in cardiac tissues of patients with eosinophilic endomyocardial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Activated eosinophils and secreted eosinophil granule proteins were most
      evident within the necrotic and later stage thrombotic lesions and were
      found mainly within the areas of acute tissue damage in the endocardium
      and in the walls of small blood vessels.
    explanation: >-
      Localises activated eosinophils and their secreted granule proteins to the
      sites of acute tissue damage in human eosinophilic endomyocardial disease.
  - reference: PMID:39056762
    reference_title: "Managing Patients with Hypereosinophilic Syndrome: A Statement from the Italian Society of Allergy, Asthma, and Clinical Immunology (SIAAIC)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Human eosinophils are terminally differentiated leukocytes characterized
      by cytoplasmatic granules containing biologically active molecules,
      including eosinophil peroxidase, eosinophil cationic protein, major basic
      protein, and several cytokines, such as transforming growth factor (TGF)-ß
    explanation: >-
      Names the specific granule constituents released at this step, including
      the TGF-beta that links degranulation forward to the fibrotic stage.
  - reference: PMID:39056762
    reference_title: "Managing Patients with Hypereosinophilic Syndrome: A Statement from the Italian Society of Allergy, Asthma, and Clinical Immunology (SIAAIC)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The biopsy specimens of mucosal ulcers from patients with HES show the
      extensive deposition of eosinophilic granule proteins in the absence of
      morphologically identifiable intact eosinophils
    explanation: >-
      Shows that granule-protein deposition in HES tissue outlasts the
      identifiable eosinophil, which is why tissue injury can continue after
      cell counts fall.
  downstream:
  - target: Granule Protein-Mediated Cytotoxic Tissue Injury
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33277190
      reference_title: "Mechanisms of toxicity mediated by neutrophil and eosinophil granule proteins."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        It should be noted that an excess of granules protein release can lead
        to tissue damage of the host resulting in chronic inflammation and organ
        dysfunction.
      explanation: >-
        States the causal step from excess granule-protein release to host
        tissue damage and organ dysfunction, which is the edge itself rather
        than either node.
  - target: Eosinophil-Driven Prothrombotic State
    causal_link_type: DIRECT
    description: >-
      The same degranulation that injures tissue releases the cationic proteins
      that disable anticoagulant control.
- name: Granule Protein-Mediated Cytotoxic Tissue Injury
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Tissue Injury"
  description: >-
    Cationic granule proteins deposited in tissue are directly cytotoxic to
    parenchymal and endothelial cells, producing the initial necrotic lesion.
    In the heart this is the first of the three classically described stages of
    eosinophilic cardiac damage; elsewhere it produces the cutaneous,
    pulmonary, and gastrointestinal manifestations.
  evidence:
  - reference: PMID:2882081
    reference_title: "Deposits of eosinophil granule proteins in cardiac tissues of patients with eosinophilic endomyocardial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that eosinophil granule proteins are involved in
      cardiac injury, producing muscle damage and vascular injury which lead to
      the development of endomyocardial fibrosis.
    explanation: >-
      Attributes muscle and vascular injury to eosinophil granule proteins and
      links that injury forward to endomyocardial fibrosis.
  downstream:
  - target: Endocardial Injury and Mural Thrombus Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39007045
      reference_title: "The three stages of eosinophilic cardiac damage: A series of case reports."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cardiac involvement in hypereosinophilic syndrome typically occurs in
        three stages - necrotic, thrombotic, and fibrotic.
      explanation: >-
        Orders the necrotic injury before the thrombotic stage, which is this
        edge.
  - target: Eosinophil-Mediated Skin, Lung, and Gut Injury
    causal_link_type: DIRECT
- name: Endocardial Injury and Mural Thrombus Formation
  biological_scale: TISSUE
  conforms_to: "thrombogenesis#Pathological Fibrin-Platelet Thrombus Formation"
  description: >-
    Damaged endocardium becomes a thrombogenic surface and mural thrombus forms
    over it - the thrombotic stage. This is the point at which the disease
    becomes embolic, and the source of the cardioembolic strokes that dominate
    its neurological morbidity.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: blood coagulation
    modifier: INCREASED
    term:
      id: GO:0007596
      label: blood coagulation
  evidence:
  - reference: PMID:39007045
    reference_title: "The three stages of eosinophilic cardiac damage: A series of case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac involvement in hypereosinophilic syndrome typically occurs in
      three stages - necrotic, thrombotic, and fibrotic.
    explanation: >-
      Establishes the thrombotic stage as the intermediate step between the
      initial necrotic injury and the fibrotic end state.
  downstream:
  - target: Systemic Thromboembolism
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19364940
      reference_title: "Cerebral arteriolar thromboembolism in idiopathic hypereosinophilic syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pathology review demonstrated mural cardiac thrombus that likely caused
        cardioembolism as well as diffuse microangiopathy despite resolution of
        the hypereosinophilia.
      explanation: >-
        Traces cardioembolism to a mural cardiac thrombus at autopsy in
        idiopathic HES, which is the edge from endocardial thrombus to systemic
        embolism.
  - target: Endomyocardial Fibrosis and Restrictive Physiology
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39056762
      reference_title: "Managing Patients with Hypereosinophilic Syndrome: A Statement from the Italian Society of Allergy, Asthma, and Clinical Immunology (SIAAIC)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The characteristics of cardiac involvement due to HES include mural
        thrombi, endomyocardial fibrosis, and restrictive cardiomyopathy with
        congestive heart failure
      explanation: >-
        Places mural thrombi and endomyocardial fibrosis in the same cardiac
        sequence, which is the transition this edge asserts.
- name: Eosinophil-Driven Prothrombotic State
  biological_scale: MOLECULAR
  description: >-
    Degranulating eosinophils shift haemostasis toward thrombosis independently
    of any endocardial surface lesion. Eosinophil cationic protein binds heparin
    and modulates thrombomodulin, blunting the physiological anticoagulant
    pathways. This is the arm that explains what surface thrombogenicity alone
    cannot: diffuse microangiopathy, thrombosis at sites remote from the heart,
    and events that continue after the blood eosinophil count has been
    normalised.
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: blood coagulation
    modifier: INCREASED
    term:
      id: GO:0007596
      label: blood coagulation
  evidence:
  - reference: PMID:32184691
    reference_title: "Idiopathic Hypereosinophilia and Venous Thromboembolism: Is There a Pathophysiological or Clinical Link? Description of an Intriguing Clinical Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, the eosinophil activation and degranulation increases the
      release of eosinophil cationic protein that is able to bind heparin and
      modulate thrombomodulin so reducing the physiological anticoagulation
      mechanisms and so increasing the prothrombotic state in hypereosinophilia.
    explanation: >-
      Gives the molecular route from degranulation to a prothrombotic state,
      cited from a paper reporting idiopathic hypereosinophilia with venous
      thromboembolism.
  downstream:
  - target: Systemic Thromboembolism
    causal_link_type: DIRECT
    description: >-
      Loss of anticoagulant control permits thrombosis in vessels with no
      endocardial lesion.
- name: Systemic Thromboembolism
  biological_scale: ORGANISM
  conforms_to: "thrombogenesis#Thrombotic Vascular Occlusion and Ischemic Tissue Injury"
  description: >-
    Embolisation from intracardiac thrombus, on top of the eosinophil-driven
    prothrombotic state, produces cerebral and systemic infarction and a diffuse
    microangiopathy. Thromboembolic events can occur and progress even after the
    blood eosinophil count has been normalised, which the two converging
    upstream arms account for.
  evidence:
  - reference: PMID:26637706
    reference_title: "Eosinophilia: a pragmatic approach to diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical manifestations range from benign asymptomatic presentations to
      life-threatening complications, including endomyocardial fibrosis and
      thromboembolism.
    explanation: >-
      Names thromboembolism, alongside endomyocardial fibrosis, as one of the
      two life-threatening complications that define the severe end of the
      clinical spectrum.
  downstream:
  - target: Stroke
    causal_link_type: DIRECT
  - target: Thromboembolism
    causal_link_type: DIRECT
- name: Endomyocardial Fibrosis and Restrictive Physiology
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  description: >-
    Organisation of the injured and thrombus-covered endocardium into dense
    fibrous scar - the fibrotic stage. The scar is not remodelled back, so this
    stage is irreversible and it converts the ventricle to restrictive
    physiology, which is why cardiac surveillance continues after the
    eosinophilia is controlled.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: INCREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  evidence:
  - reference: PMID:2882081
    reference_title: "Deposits of eosinophil granule proteins in cardiac tissues of patients with eosinophilic endomyocardial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that eosinophil granule proteins are involved in
      cardiac injury, producing muscle damage and vascular injury which lead to
      the development of endomyocardial fibrosis.
    explanation: >-
      Endomyocardial fibrosis is the stated end point of the granule
      protein-mediated cardiac injury sequence.
  - reference: PMID:39056762
    reference_title: "Managing Patients with Hypereosinophilic Syndrome: A Statement from the Italian Society of Allergy, Asthma, and Clinical Immunology (SIAAIC)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The characteristics of cardiac involvement due to HES include mural
      thrombi, endomyocardial fibrosis, and restrictive cardiomyopathy with
      congestive heart failure
    explanation: >-
      Names the thrombus-fibrosis-restriction sequence that this node and its
      upstream neighbour together represent.
  downstream:
  - target: Restrictive cardiomyopathy
    causal_link_type: DIRECT
  - target: Myocardial fibrosis
    causal_link_type: DIRECT
- name: Eosinophil-Mediated Skin, Lung, and Gut Injury
  biological_scale: TISSUE
  description: >-
    Granule-protein injury outside the heart produces the non-cardiac
    manifestations: pruritic and urticarial or eczematous skin disease,
    pulmonary infiltrates with cough, and gastrointestinal symptoms including
    diarrhoea. Cutaneous disease is the most common organ manifestation and is
    frequently what brings the patient to attention. The node is the injury, not
    the infiltration that precedes it - eosinophil arrival in these tissues is
    upstream, at the recruitment node.
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:30567176
    reference_title: "Idiopathic hypereosinophilic syndrome with cutaneous involvement: a comparative review of 32 cases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This review illustrates that physicians should maintain a high index of
      clinical suspicion for idiopathic HES in patients presenting with
      dermatological lesions and hypereosinophilia, without an obvious cause.
    explanation: >-
      Supports cutaneous involvement as a common and clinically salient
      presentation of the idiopathic variant specifically.
  downstream:
  - target: Pruritus
    causal_link_type: DIRECT
  - target: Urticaria
    causal_link_type: DIRECT
  - target: Diarrhea
    causal_link_type: DIRECT
  - target: Pulmonary infiltrates
    causal_link_type: DIRECT

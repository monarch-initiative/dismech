diagnosis:
- name: Systematic exclusion work-up
  description: >-
    The diagnosis is constituted by the work-up rather than confirmed by it. A
    minimum evaluation requires bone marrow karyotyping, PDGFRA testing,
    lymphocyte immunophenotyping, and T-cell receptor gene rearrangement
    studies, in addition to exclusion of reactive causes such as helminth
    infection, drug reaction, allergy, vasculitis, and malignancy. Idiopathic
    HES is assigned only when all of these are unrevealing.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:36756990
    reference_title: "Diagnostic spectrum of hypereosinophilia based on bone marrow pathology: 10 years' experience at a tertiary care hospital."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The work-up of patients in whom ruled out the common secondary causes of
      HE requires a systematic but sufficient approach including at a minimum BM
      karyotyping, PDGFRA testing, lymphocyte immunophenotyping and TCR gene
      rearrangement.
    explanation: >-
      Specifies the minimum diagnostic work-up that must be negative before the
      idiopathic designation is applied.
  - reference: PMID:37122022
    reference_title: French guidelines for the etiological workup of eosinophilia and the management of hypereosinophilic syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The workup should also include basal tryptase determination (suggestive of
      mastocytosis or clonal HE/HES), vitamin B12 (elevated B12 and tryptase are
      suggestive of clonal eosinophilia), plasma protein electrophoresis
      (polyclonal hypergammaglobulinemia is suggestive of IgG4-related disease,
      angioimmunoblastic T-cell lymphoma or chronic parasitic infection) and
      total IgE (although the specificity is limited, elevated levels suggest
      reactive eosinophilia).
    explanation: >-
      Adds the serological arm of the work-up - tryptase, B12,
      protein electrophoresis, total IgE - alongside the marrow and molecular
      testing, each element pointing at a rival diagnosis to exclude.
- name: Consensus criteria and terminology
  description: >-
    The 2011 Working Conference on Eosinophil Disorders and Syndromes
    (ICOG-EO) unified previously divergent classifications and separated
    hypereosinophilia of undetermined significance - eosinophilia without organ
    damage - from hypereosinophilic syndrome proper. Idiopathic HES sits inside
    the syndrome category and requires demonstrable eosinophil-mediated organ
    damage.
  notes: >-
    No diagnosis_term is bound. This record states a classification convention,
    not a procedure performed on a patient, and NCIT:C18020 Diagnostic Procedure
    would assert something false about it.
  evidence:
  - reference: PMID:22460074
    reference_title: "Contemporary consensus proposal on criteria and classification of eosinophilic disorders and related syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For patients in whom no underlying disease or hypereosinophilic syndrome
      is found, the term hypereosinophilia of undetermined significance is
      introduced.
    explanation: >-
      Draws the boundary between idiopathic HES and hypereosinophilia of
      undetermined significance, which is the distinction organ damage makes.
  - reference: PMID:22460074
    reference_title: "Contemporary consensus proposal on criteria and classification of eosinophilic disorders and related syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The expert group agreed on unifying terminologies and criteria and a
      classification that delineates various forms of hypereosinophilia,
      including primary and secondary variants based on specific hematologic and
      immunologic conditions, and various forms of the hypereosinophilic
      syndrome.
    explanation: >-
      Establishes the consensus classification within which the idiopathic
      variant is defined against the primary and secondary variants.
- name: Contemporary threshold and the obsolete six-month rule
  description: >-
    The historical Chusid criterion required six months of eosinophilia before
    the diagnosis could be made. That waiting period is no longer applied when
    organ damage is already present, because the fibrotic and thromboembolic
    complications that determine outcome accrue during it. Persistence is now
    confirmed on repeat measurement over weeks rather than months, and
    etiological work-up runs in parallel with organ-damage assessment rather
    than before it.
  notes: >-
    No diagnosis_term is bound: this record is criteria history, not a
    procedure. The six-month figure is cited to a source that states it, rather
    than to Chusid's own abstract, which describes persistence without naming a
    duration.
  evidence:
  - reference: PMID:40283978
    reference_title: Biologic Agents in Idiopathic Hypereosinophilic Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The current definition of HES requires persistent eosinophilia with a
      corresponding absolute eosinophil count of >1.5 × 109/L for a shorter
      period of 2 to 4 weeks (compared to the historical criterion of more than
      6 months outlined by Chusid and colleagues in 1975), and concomitant
      tissue damage
    explanation: >-
      States both the historical six-month criterion and the 2-to-4-week window
      that replaced it.
  - reference: PMID:40283978
    reference_title: Biologic Agents in Idiopathic Hypereosinophilic Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      More specifically, the diagnostic criteria for idiopathic HES include
      sustained hypereosinophilia (eosinophil count ≥ 1.5 × 109/L) recorded more
      than once in a minimum time interval of two weeks, ≥10% eosinophilia,
      organ failure attributable to the eosinophilia or tissue infiltration by
      eosinophils, and exclusion of reactive eosinophilia, lymphocyte-variant
      HES, chronic eosinophilic leukemia, and other myeloid or lymphoid
      neoplasm
    explanation: >-
      The full contemporary criteria set stated for idiopathic HES specifically,
      including the >=10% of leukocytes threshold and the repeat-measurement
      interval.
  - reference: PMID:39056762
    reference_title: "Managing Patients with Hypereosinophilic Syndrome: A Statement from the Italian Society of Allergy, Asthma, and Clinical Immunology (SIAAIC)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cardiac assessment should include a heart ultrasound as a routine
      examination due to the lack of symptoms in the early phases of heart
      involvement.
    explanation: >-
      Supports assessing organ damage up front rather than waiting, because
      early cardiac involvement is asymptomatic.
treatments:
- name: Systemic Corticosteroid Therapy
  description: >-
    Oral corticosteroids are first-line for idiopathic HES and produce a
    response in the large majority of patients, but most require indefinite
    maintenance dosing and the cumulative toxicity of that maintenance is the
    principal reason steroid-sparing agents are sought.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  target_mechanisms:
  - target: Persistent Blood and Tissue Hypereosinophilia
    description: >-
      Corticosteroids suppress eosinophil production and survival and rapidly
      lower the circulating count.
  evidence:
  - reference: PMID:19910029
    reference_title: "Hypereosinophilic syndrome: a multicenter, retrospective analysis of clinical characteristics and response to therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corticosteroid monotherapy induced complete or partial responses at 1
      month in 85% (120/141) of patients with most remaining on maintenance
      doses (median, 10 mg prednisone equivalent daily for 2 months to 20
      years).
    explanation: >-
      Quantifies both the high first-line response rate and the long-term
      maintenance dependence that motivates steroid-sparing therapy.
  - reference: PMID:25964669
    reference_title: "How I treat hypereosinophilic syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although corticosteroids remain the first-line therapy for most forms of
      HESs, the availability of an increasing number of novel therapeutic
      agents, including tyrosine kinase inhibitors and monoclonal antibodies,
      has necessarily altered the approach to treatment of HESs.
    explanation: >-
      Confirms corticosteroids as first-line therapy in current practice.
- name: Mepolizumab
  description: >-
    Anti-IL-5 monoclonal antibody, and the only biologic approved for HES. In
    FIP1L1-PDGFRA-negative HES with recurrent flares it halves the proportion of
    patients flaring, and in prednisone-dependent patients it permits
    substantial steroid tapering. Note what that trial population is:
    FIP1L1-PDGFRA negative is not a synonym for idiopathic, since it also
    contains lymphocytic-variant and non-PDGFRA myeloid disease. Idiopathic HES
    is its largest component and the small idiopathic-only cohort below points
    the same way, but the phase III result is not an idiopathic-specific
    measurement.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mepolizumab
      term:
        id: NCIT:C157376
        label: Mepolizumab
  target_mechanisms:
  - target: IL-5-Dependent Eosinophil Survival and Tissue Recruitment
    description: >-
      Neutralising circulating IL-5 removes the survival and recruitment signal
      the expanded eosinophil population depends on.
  evidence:
  - reference: PMID:32956756
    reference_title: "Efficacy and safety of mepolizumab in hypereosinophilic syndrome: A phase III, randomized, placebo-controlled trial."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proportion of patients experiencing 1 or more flares/withdrawing from
      the study was 50% lower with mepolizumab versus placebo (15 of 54 [28%] vs
      30 of 54 [56%]; P = .002).
    explanation: >-
      Phase III efficacy result in FIP1L1-PDGFRA-negative HES. That trial
      population is a superset of this entry's disease - it also admits
      lymphocytic-variant and non-PDGFRA myeloid HES - so the result is read
      down onto the idiopathic subset rather than measured in it.
  - reference: PMID:18344568
    reference_title: "Treatment of patients with the hypereosinophilic syndrome with mepolizumab."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary end point was reached in 84% of patients in the mepolizumab
      group, as compared with 43% of patients in the placebo group (hazard
      ratio, 2.90; 95% confidence interval [CI], 1.59 to 5.26; P<0.001) with no
      increase in clinical activity of the hypereosinophilic syndrome.
    explanation: >-
      Establishes the corticosteroid-sparing effect in prednisone-dependent
      FIP1L1-PDGFRA-negative patients.
  - reference: PMID:40283978
    reference_title: "Biologic Agents in Idiopathic Hypereosinophilic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients with concomitant asthma (n = 8) experienced elimination of
      asthma flares, asthma control (ACQ < 0.75), functional improvement (mean
      ΔFEV1: 857 ± 594 mL), and an 82% reduction in oral corticosteroids
    explanation: >-
      Real-world corticosteroid sparing in a cohort characterised specifically
      as idiopathic HES. Uncontrolled and small (11 patients across mepolizumab
      and benralizumab), so it corroborates the trial result in this exact
      population rather than adding independent efficacy evidence.
- name: Benralizumab
  description: >-
    Afucosylated anti-IL-5R-alpha monoclonal antibody that depletes
    IL-5R-alpha-bearing cells by antibody-dependent cellular cytotoxicity. In
    PDGFRA-negative HES it depletes blood, marrow, and tissue eosinophils and
    permits tapering of background therapy, with responses sustained to 48 weeks
    in most patients. As with mepolizumab, that trial population is a superset
    of idiopathic HES rather than a synonym for it.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: benralizumab
      term:
        id: NCIT:C88594
        label: Benralizumab
  target_mechanisms:
  - target: IL-5-Dependent Eosinophil Survival and Tissue Recruitment
    description: >-
      Depletion of IL-5R-alpha-bearing eosinophils and their marrow precursors
      removes the effector population rather than only its survival signal.
  evidence:
  - reference: PMID:30943337
    reference_title: "Benralizumab for PDGFRA-Negative Hypereosinophilic Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the randomized phase, the primary end point occurred in more
      patients in the benralizumab group than in the placebo group (9 of 10
      patients [90%] vs. 3 of 10 patients [30%], P = 0.02).
    explanation: >-
      Phase II efficacy result on eosinophil reduction in PDGFRA-negative HES.
  - reference: PMID:30943337
    reference_title: "Benralizumab for PDGFRA-Negative Hypereosinophilic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the open-label phase, clinical and hematologic responses were
      observed in 17 of 19 patients (89%) and were sustained for 48 weeks in 14
      of 19 patients (74%); in the latter group, in 9 of 14 patients (64%),
      background therapies could be tapered.
    explanation: >-
      Documents durability of response and the background-therapy sparing
      effect.
- name: Hydroxyurea
  description: >-
    Conventional second-line cytoreductive agent used when corticosteroids fail
    or cannot be tapered. Effective, but toxicity limits its use, which is the
    gap the anti-IL-5 agents fill.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxyurea
      term:
        id: CHEBI:44423
        label: hydroxyurea
  target_mechanisms:
  - target: Persistent Blood and Tissue Hypereosinophilia
    description: >-
      Cytoreduction of the expanded eosinophil population.
  evidence:
  - reference: PMID:19910029
    reference_title: "Hypereosinophilic syndrome: a multicenter, retrospective analysis of clinical characteristics and response to therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hydroxyurea and IFN-alpha (used in 64 and 46 patients, respectively) were
      also effective, but their use was limited by toxicity.
    explanation: >-
      Establishes hydroxyurea's efficacy and the toxicity ceiling on its
      use.
- name: Interferon Alfa
  description: >-
    Second-line immunomodulatory therapy, curated separately from hydroxyurea
    because it is a recombinant protein rather than a small molecule and the two
    are not interchangeable in a modality or agent query. Effective, with the
    same toxicity ceiling.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: interferon alfa
      term:
        id: CHEBI:753470
        label: interferon alfa
  target_mechanisms:
  - target: Persistent Blood and Tissue Hypereosinophilia
    description: >-
      Immunomodulatory suppression of the expanded eosinophil population.
  evidence:
  - reference: PMID:19910029
    reference_title: "Hypereosinophilic syndrome: a multicenter, retrospective analysis of clinical characteristics and response to therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hydroxyurea and IFN-alpha (used in 64 and 46 patients, respectively) were
      also effective, but their use was limited by toxicity.
    explanation: >-
      Establishes interferon alfa's efficacy and the toxicity ceiling on
      its use.
- name: Empirical Antiparasitic Therapy Before Corticosteroids
  description: >-
    A safety step rather than a treatment for the disease. Corticosteroids given
    to a patient with unrecognised strongyloidiasis can precipitate
    hyperinfection, and strongyloidiasis is itself a cause of eosinophilia that
    must be excluded before the idiopathic label is applied. Guidelines offer
    empirical ivermectin depending on exposure history and endemic-area risk,
    while noting that the value of empirical treatment in genuinely unexplained
    chronic hypereosinophilia is disputed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ivermectin
      term:
        id: CHEBI:6078
        label: ivermectin
  evidence:
  - reference: PMID:37122022
    reference_title: French guidelines for the etiological workup of eosinophilia and the management of hypereosinophilic syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Depending on the patient's condition and risk factors and the endemic
      areas visited, an antiparasitic treatment consisting of all or some of the
      following compounds may be offered:D1 ivermectin: 200 µg/kg on an empty
      stomach (possibly followed by a second dose at D2 or D15 in case of
      diagnostic confirmation of strongyloidiasis).
    explanation: >-
      Gives the guideline's empirical antiparasitic regimen and the
      risk-stratified basis for offering it.
  - reference: PMID:37122022
    reference_title: French guidelines for the etiological workup of eosinophilia and the management of hypereosinophilic syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the absence of available studies, the usefulness of empirical
      antiparasitic treatment in unexplained chronic HE is disputed.
    explanation: >-
      Records that the practice is contested rather than settled, so the entry
      does not overstate it.
- name: Imatinib
  description: >-
    Tyrosine kinase inhibitor and the treatment of choice for the
    FIP1L1-PDGFRA-positive myeloid variant. It is included here as a negative
    therapeutic claim: in FIP1L1-PDGFRA-negative disease, which includes
    idiopathic HES, the response rate falls to roughly a quarter. The
    contrast is the main therapeutic reason this entry is separated from the
    myeloid variant. It carries no target_mechanisms deliberately: the claim is
    that it does not act on this disease's mechanisms, so linking it to one
    would assert the opposite of what the evidence says.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: imatinib mesylate
      term:
        id: NCIT:C1687
        label: Imatinib Mesylate
  evidence:
  - reference: PMID:19910029
    reference_title: "Hypereosinophilic syndrome: a multicenter, retrospective analysis of clinical characteristics and response to therapy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Imatinib (used in 68 patients) was more effective in patients with the
      FIP1L1-PDGFRA mutation (88%) than in those without (23%; P < .001).
    explanation: >-
      Refutes imatinib as an effective therapy for FIP1L1-PDGFRA-negative
      disease: the response rate in the negative group is 23% against 88% in the
      positive group.
animal_models:
- name: IL-5 transgenic (IL-5Tg) hypereosinophilic mouse
  species: Mouse
  genotype: Il5 transgene under the CD3-delta promoter (IL-5Tg); eosinophil-deficient IL-5Tg-dblGATA1 used as the specificity control
  publication: PMID:37829205
  description: >-
    Constitutive IL-5 overexpression produces massive blood and tissue
    eosinophilia and progressive left ventricular dysfunction. Crossing onto an
    eosinophil-deficient dblGATA1 background abolishes the cardiac phenotype,
    which separates the eosinophil's contribution from any direct effect of
    IL-5 on the heart - a control that makes this model informative about the
    effector arm rather than about the cytokine.
  modeled_mechanisms:
  - target: Eosinophil-Mediated Skin, Lung, and Gut Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      IL-5Tg mice develop extensive eosinophilic infiltration of the lung, which
      the paper measures directly and likens to the pulmonary infiltration seen
      in patients.
    limitations: >-
      Of the three organs this node names, the model demonstrates the lung only.
      The paper measures pulmonary infiltration in detail but reports no skin
      and no gastrointestinal data; its single mention of those organs is a
      background sentence citing other literature, not a measurement made here.
      The cutaneous and gut arms of this node are unmodelled by this system.
    readouts:
    - name: Pulmonary leukocyte infiltration
      target: Eosinophil-Mediated Skin, Lung, and Gut Injury
      direction: INCREASED
      interpretation: >-
        Eosinophil-dominant infiltration of lung tissue, worsening with age.
      evidence:
      - reference: PMID:37829205
        reference_title: "Hypereosinophilia causes progressive cardiac pathologies in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Thus, hypereosinophilic mice developed extensive infiltration of the
          lungs that worsened with age and was about 50% eosinophilic.
        explanation: >-
          The measured pulmonary infiltration, with its eosinophil fraction.
    evidence:
    - reference: PMID:37829205
      reference_title: "Hypereosinophilia causes progressive cardiac pathologies in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, hypereosinophilic mice developed extensive infiltration of the
        lungs that worsened with age and was about 50% eosinophilic.
      explanation: >-
        Supports the model as informative for the pulmonary arm of this node.
  - target: Granule Protein-Mediated Cytotoxic Tissue Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Eosinophil-dependent cardiac tissue damage with transcriptional signatures
      of injury and remodeling.
    limitations: >-
      The model's eosinophilia has a defined genetic cause, which is exactly
      what idiopathic HES is defined by not having. It therefore models the
      effector arm of the disease and not its unexplained upstream driver. It
      also does not progress to the dense endomyocardial fibrosis that
      determines human prognosis.
    readouts:
    - name: Left ventricular ejection fraction
      target: Granule Protein-Mediated Cytotoxic Tissue Injury
      direction: DECREASED
      interpretation: >-
        Functional consequence of eosinophil-mediated cardiac injury, and
        eosinophil-dependent by the dblGATA1 cross.
      evidence:
      - reference: PMID:37829205
        reference_title: "Hypereosinophilia causes progressive cardiac pathologies in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Echocardiography readouts such as LV diameters and EF were similar in
          IL-5TgΔdblGATA1, ΔdblGATA1, and WT mice and significantly higher in
          IL-5Tg mice compared to all other groups
        explanation: >-
          The eosinophil-deficient cross normalises the echocardiographic
          readout, attributing the deficit to eosinophils rather than to IL-5.
    - name: Cardiac tissue damage and remodeling gene expression signature
      target: Granule Protein-Mediated Cytotoxic Tissue Injury
      direction: INCREASED
      interpretation: >-
        Transcriptional correlate of ongoing injury and attempted repair in the
        ventricle.
      evidence:
      - reference: PMID:37829205
        reference_title: "Hypereosinophilia causes progressive cardiac pathologies in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Gene expression signatures showed tissue damage as well as repair and
          remodeling processes.
        explanation: >-
          Reports the transcriptional damage-and-remodeling signature measured
          in the model's left ventricle.
    evidence:
    - reference: PMID:37829205
      reference_title: "Hypereosinophilia causes progressive cardiac pathologies in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cardiomyocytes from IL-5Tg mice exhibited significantly reduced
        contractility relative to wild type (WT) controls.
      explanation: >-
        Establishes a measurable cell-level consequence of the eosinophilic
        cardiac environment, supporting the model as informative for this node.
datasets:
- accession: geo:GSE185300
  title: Expression data from adult left ventricular heart tissue of hypereosinophilic mice and controls
  description: >-
    Microarray profiling of left ventricular myocardium from IL-5 transgenic
    hypereosinophilic mice against controls, the transcriptional dataset behind
    the tissue damage and remodeling signature cited for the cardiac injury
    node. Model-organism data: it addresses the eosinophil effector arm shared
    with idiopathic HES, not the unexplained driver specific to it.
  data_type: MICROARRAY
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  publication: PMID:37829205
  notes: >-
    Selected after relevance triage of the GEO candidate list. Two higher-scoring
    DIRECT candidates were rejected: geo:GSE12079 profiles CD3-CD4+ T cells from
    the lymphocytic variant, which this entry excludes by definition, and
    geo:GSE131738 is Sezary syndrome. Every GENE_ONLY candidate matched on

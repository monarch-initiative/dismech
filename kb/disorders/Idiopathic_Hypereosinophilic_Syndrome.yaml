- name: Restrictive cardiomyopathy
  category: Cardiovascular
  description: >-
    Endomyocardial fibrosis obliterates the ventricular apex and inflow tract
    and produces restrictive filling. This is the principal determinant of
    long-term prognosis.
  phenotype_term:
    preferred_term: Restrictive cardiomyopathy
    term:
      id: HP:0001723
      label: Restrictive cardiomyopathy
  evidence:

differential_diagnoses:
- name: Primary (myeloid) hypereosinophilic syndrome
  disease_term:
    preferred_term: primary hypereosinophilic syndrome
    term:
      id: MONDO:0017833
      label: primary hypereosinophilic syndrome
  description: >-
    The clonal myeloid variant, most often carrying FIP1L1-PDGFRA. Separating it
    from idiopathic HES changes first-line therapy from corticosteroids to
    imatinib, so the distinction is therapeutically decisive rather than
    taxonomic.
  distinguishing_features:
  - Demonstrable FIP1L1-PDGFRA fusion or other clonal myeloid lesion
  - Marked and durable response to imatinib
  - Marrow features of a myeloid neoplasm on morphology or karyotype
  evidence:
  - reference: PMID:19910029
    reference_title: "Hypereosinophilic syndrome: a multicenter, retrospective analysis of clinical characteristics and response to therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Imatinib (used in 68 patients) was more effective in patients with the
      FIP1L1-PDGFRA mutation (88%) than in those without (23%; P < .001).
    explanation: >-
      The differential response to imatinib is the operative distinction between
      the myeloid and idiopathic variants.
- name: Lymphocytic variant hypereosinophilic syndrome
  disease_term:
    preferred_term: lymphocytic hypereosinophilic syndrome
    term:
      id: MONDO:0017835
      label: lymphocytic hypereosinophilic syndrome
  description: >-
    Eosinophilia driven by an aberrant or clonal T-cell population producing
    eosinophilopoietic cytokines. Detected by lymphocyte immunophenotyping and
    T-cell receptor gene rearrangement, both of which are negative in idiopathic
    HES by definition.
  distinguishing_features:
  - Aberrant T-cell immunophenotype on flow cytometry
  - Clonal T-cell receptor gene rearrangement
  - Risk of progression to T-cell lymphoma
  evidence:
  - reference: PMID:19910029
    reference_title: "Hypereosinophilic syndrome: a multicenter, retrospective analysis of clinical characteristics and response to therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and 29 of 168 patients tested (17%) had a demonstrable aberrant or clonal
      T-cell population.
    explanation: >-
      Quantifies the lymphocytic-variant minority identified by testing and
      thereby excluded from the idiopathic category.
- name: Hypereosinophilia of undetermined significance
  description: >-
    Marked eosinophilia meeting the same threshold but without demonstrable
    eosinophil-mediated organ damage. It is not a syndrome and does not by
    itself warrant cytoreductive therapy; the distinction from idiopathic HES
    rests entirely on whether organ damage can be demonstrated.
  distinguishing_features:
  - No demonstrable eosinophil-mediated end-organ damage
  - Observation rather than eosinophil-directed therapy
  evidence:
  - reference: PMID:22460074
    reference_title: "Contemporary consensus proposal on criteria and classification of eosinophilic disorders and related syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For patients in whom no underlying disease or hypereosinophilic syndrome
      is found, the term hypereosinophilia of undetermined significance is
      introduced.
    explanation: >-
      Introduces the category that idiopathic HES must be distinguished from.
- name: Eosinophilic granulomatosis with polyangiitis
  disease_term:
    preferred_term: eosinophilic granulomatosis with polyangiitis
    term:
      id: MONDO:0015943
      label: eosinophilic granulomatosis with polyangiitis
  description: >-
    ANCA-associated eosinophilic vasculitis presenting with asthma, marked
    eosinophilia, and multiorgan disease. Distinguished by vasculitic and
    granulomatous pathology rather than pure eosinophil-mediated injury.
  distinguishing_features:
  - Necrotising vasculitis and extravascular granulomas on biopsy
  - Antecedent asthma and sinonasal disease
  - ANCA positivity in a subset
  evidence:
  - reference: PMID:26637706
    reference_title: "Eosinophilia: a pragmatic approach to diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Eosinophilia is associated with a wide variety of allergic, rheumatologic,
      infectious, neoplastic, and rare idiopathic disorders.
    explanation: >-
      Places rheumatologic disease, of which EGPA is the principal eosinophilic
      example, among the categories that must be excluded. The snippet supports
      the category rather than EGPA by name.
discussions:
- discussion_id: idiopathic_hes_unknown_driver
  kind: KNOWLEDGE_GAP
  prompt: >-
    What drives sustained eosinophilopoiesis in idiopathic hypereosinophilic
    syndrome when no clonal myeloid lesion and no aberrant T-cell population can
    be found?
  rationale: >-
    The idiopathic category is defined by the failure of the current work-up,
    not by a positive mechanistic finding, and it is the largest of the HES
    variants precisely because that work-up leaves most patients unexplained.
    Every node downstream of the first in this entry's chain is well supported;
    the first node is a placeholder for an unknown. Whether idiopathic HES is one
    disease or a residual bin holding several mechanisms with a shared effector
    pathway is unresolved, and it determines whether the category should
    eventually be split further or dissolved into newly identified variants.
  attaches_to:
  - pathophysiology#Unexplained Eosinophil Lineage Expansion
  evidence:
  - reference: PMID:26637706
    reference_title: "Eosinophilia: a pragmatic approach to diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Unfortunately, despite recent advances in molecular and immunologic
      techniques, the etiology remains unproven in the overwhelming majority of
      cases.
    explanation: >-
      States that the aetiology is unproven in most cases despite current
      molecular and immunologic methods, which is the gap itself.
- discussion_id: idiopathic_hes_count_damage_dissociation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does eosinophil-mediated cardiac damage continue to progress after the
    blood eosinophil count has been normalised, and what should be monitored
    instead?
  rationale: >-
    Treatment response in this disease is assessed on the blood eosinophil
    count, but cardiac injury and its clinical consequences dissociate from that
    count. The fibrotic stage is irreversible and cardioembolism has been
    documented despite resolution of the hypereosinophilia, so a normal count is
    not evidence that the cardiac process has stopped. Troponin, NT-pro-BNP and
    cardiac imaging are in routine guideline use and are curated here, but they
    report damage that has already occurred; no validated surrogate for ongoing
    tissue-level eosinophil activity exists, so nothing tells a clinician the
    process is still running before the next increment of injury shows up.
  attaches_to:
  - pathophysiology#Endomyocardial Fibrosis and Restrictive Physiology
  - pathophysiology#Systemic Thromboembolism
  evidence:
  - reference: PMID:39007045
    reference_title: "The three stages of eosinophilic cardiac damage: A series of case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More importantly, they demonstrate, for the first time, the dissociation
      between the eosinophil count and patients' clinical evolution, suggesting
      the need for close follow up even after the eosinophilia has been
      controlled.
    explanation: >-
      Documents the dissociation between blood eosinophil count and clinical
      cardiac evolution, which is the monitoring gap.
  - reference: PMID:19364940
    reference_title: "Cerebral arteriolar thromboembolism in idiopathic hypereosinophilic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathology review demonstrated mural cardiac thrombus that likely caused
      cardioembolism as well as diffuse microangiopathy despite resolution of
      the hypereosinophilia.
    explanation: >-
      Shows thrombotic and microangiopathic injury persisting despite resolved
      hypereosinophilia.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    The syndrome spans asymptomatic eosinophilia through to fatal cardiac,
    thromboembolic and neurological disease, and the damage that determines
    outcome is largely irreversible once established: endomyocardial fibrosis
    does not remodel back, and cerebral infarction does not. Most patients
    respond to corticosteroids but the large majority stay on maintenance dosing
    indefinitely, so the treatment burden is lifelong even where the disease is
    controlled. Reported disease-related mortality is roughly one in ten.
  evidence:
  - reference: PMID:30567176
    reference_title: "Idiopathic hypereosinophilic syndrome with cutaneous involvement: a comparative review of 32 cases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The Surveillance, Epidemiology, and End Results data show that the
      estimated morbidity is between 0.036/100 000 and 6.3/100 000 whereas the
      mortality is about 9.3%.
    explanation: >-
      Gives the reported mortality figure behind this burden assessment.
  - reference: PMID:19910029
    reference_title: "Hypereosinophilic syndrome: a multicenter, retrospective analysis of clinical characteristics and response to therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corticosteroid monotherapy induced complete or partial responses at 1
      month in 85% (120/141) of patients with most remaining on maintenance
      doses (median, 10 mg prednisone equivalent daily for 2 months to 20
      years).
    explanation: >-
      Quantifies the indefinite maintenance dosing that makes the treatment
      burden lifelong even in responders.

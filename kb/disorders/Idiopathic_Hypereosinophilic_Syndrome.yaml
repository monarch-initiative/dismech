prevalence:
- population: Worldwide, all HES variants
  measure_type: UNKNOWN
  prevalence_class: RARE
  rate_low: 0.036
  rate_high: 6.3
  notes: >-
    SEER-derived figures quoted in an idiopathic-HES-focused review, but the
    numbers themselves span all HES variants, not idiopathic disease alone. The
    source calls them morbidity without naming a measure type, and the 175-fold
    spread between the bounds is itself the finding: population incidence and
    prevalence of idiopathic HES are not established. Recorded with
    measure_type UNKNOWN for that reason. rate_per_100000 is deliberately left
    empty: there is no point estimate to put in it, only the span in rate_low
    and rate_high, and the qualitative tiers are reserved for records without a
    populated rate.
  evidence:

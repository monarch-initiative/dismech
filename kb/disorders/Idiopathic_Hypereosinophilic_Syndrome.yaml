    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The characteristics of cardiac involvement due to HES include mural
      thrombi, endomyocardial fibrosis, and restrictive cardiomyopathy with
      congestive heart failure
    explanation: >-

- name: Serum tryptase
  presence: NORMAL
  biomarker_term:
    preferred_term: tryptase
    term:
      id: NCIT:C120030
      label: Tryptase
  notes: >-
    Discriminating rather than diagnostic. An elevated tryptase points away from

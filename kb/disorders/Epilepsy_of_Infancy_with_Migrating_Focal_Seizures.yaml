datasets:
- accession: geo:GSE297948
  title: Therapeutic Potential of ASO-Mediated KCNT1 Knockdown in KCNT1 Epileptic Encephalopathy
  description: KCNT1-related epileptic encephalopathy, including Epilepsy of Infancy with Migrating Focal Seizures (EIMFS), is a severe neurodevelopmental disorder associated with refractory seizures, profound neurologic impairment, and premature death. It is caused by de novo genetic variants in KCNT1 which alter the function of Slack, an evolutionarily conserved sodium-gated potassium channel that modulates neuronal firing patterns and excitability. Pathogenic KCNT1 variants lead to overactive Slack channels, boosting total neuronal potassium currents by up to 40%, driving cortical hyperexcitability and causing seizures.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 12
  publication: PMID:41981306
  notes: Identified by GEO DataSets index search for Epilepsy of Infancy with Migrating Focal Seizures (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
discussions:
- discussion_id: eimfs-gof-hyperexcitability-paradox
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Disrupted Neuronal Firing and Interneuron Dysfunction"
  - "pathophysiology#Increased Slack Sodium-Activated Potassium Current"
  prompt: >-
    KCNT1 variants in EIMFS increase a potassium current, which in isolation is
    hyperpolarizing and would be expected to reduce excitability - yet the result
    is severe, near-continuous seizures. By what circuit mechanism does a
    gain-of-function potassium channel produce network hyperexcitability, and how
    central is the proposed preferential effect on inhibitory interneurons?
  rationale: >-
    Resolving the gain-of-function paradox is essential for rational therapy: if
    the seizures arise chiefly from interneuron dysfunction, the therapeutic
    logic (and the interpretation of channel blockers) differs from a model in
    which principal-neuron firing is the driver. The interneuron hypothesis is
    plausible but not firmly established in human cortex.
  proposed_experiments:
  - experiment_id: eimfs-celltype-circuit
    name: Cell-type-resolved circuit study of KCNT1 gain of function
    description: >-
      Use cell-type-specific expression of EIMFS KCNT1 variants in
      excitatory versus inhibitory neurons (in iPSC-derived human neurons and
      animal models) with circuit-level recording to determine how the enhanced
      current translates into network hyperexcitability.
    readouts:
    - name: Effect of KCNT1 gain of function by neuron type on network excitability
      target: "pathophysiology#Disrupted Neuronal Firing and Interneuron Dysfunction"
    would_support:
    - "pathophysiology#Disrupted Neuronal Firing and Interneuron Dysfunction"
- discussion_id: eimfs-quinidine-variable-response
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Increased Slack Sodium-Activated Potassium Current"
  prompt: >-
    Quinidine blocks gain-of-function KCNT1 channels in vitro, motivating its use
    as a precision therapy, yet clinical benefit in EIMFS is inconsistent (around
    45% of patients). Why does the in vitro channel block translate so variably
    to seizure control - is it variant-specific pharmacology, CNS penetration,
    QT-limited dosing, or timing relative to established encephalopathy?
  rationale: >-
    The mismatch between reliable in vitro block and variable clinical response
    is the central obstacle to KCNT1 precision therapy. Evidence for target
    engagement exists in cell models, but its translational validity for seizure
    control in patients is uncertain, so predicting responders remains unsolved.
  proposed_experiments:
  - experiment_id: eimfs-quinidine-responder
    name: Variant-stratified quinidine response study
    description: >-
      Correlate quinidine clinical response with KCNT1 variant, in vitro block
      potency, achieved CSF/plasma levels, QT-limited dosing, and age at
      treatment across a multicenter EIMFS cohort to identify determinants of
      response.
    readouts:
    - name: Seizure response versus variant, drug level, and timing
      target: "pathophysiology#Migrating Focal Seizure Generation"
    decision_criterion: >-
      Identification of reproducible responder predictors would support
      variant-stratified quinidine use.
    would_support:
    - "pathophysiology#Increased Slack Sodium-Activated Potassium Current"
- discussion_id: eimfs-kcnt1-genotype-phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#KCNT1 Gain-of-Function Mutation"
  prompt: >-
    Gain-of-function KCNT1 variants cause a spectrum from severe EIMFS to the
    much milder autosomal dominant sleep-related hypermotor epilepsy. What
    determines whether the same channel defect produces devastating migrating
    seizures or a relatively mild focal epilepsy - variant location, degree of
    gain of function, mosaicism, or modifiers?
  rationale: >-
    Understanding what sets phenotypic severity from a shared gene would improve
    prognostic counseling and might reveal modifiable factors, but the
    genotype-phenotype relationship for KCNT1 is only partially mapped.
  proposed_experiments:
  - experiment_id: eimfs-kcnt1-genotype-severity
    name: KCNT1 genotype-severity mapping
    description: >-
      Relate the degree of channel gain of function (and variant location and
      mosaic fraction) to clinical severity across the KCNT1 phenotypic spectrum
      using functional assays and deep phenotyping.
    readouts:
    - name: Gain-of-function magnitude versus clinical severity
      target: "pathophysiology#KCNT1 Gain-of-Function Mutation"
    would_support:
    - "pathophysiology#KCNT1 Gain-of-Function Mutation"

treatments:
- name: Quinidine (KCNT1 Blocker)
  description: >-
    Quinidine, a partial blocker of the Slack (KCNT1) channel, has been used as
    a precision therapy that targets the gain-of-function mechanism. In a
    systematic review of KCNT1-related epilepsy it benefited a subset of EIMFS
    patients (about 45%), with variable responses and required cardiac QT
    monitoring.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Increased Slack Sodium-Activated Potassium Current
    treatment_effect: INHIBITS
    description: >-
      Quinidine partially blocks the gain-of-function Slack potassium current.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed exome sequencing in three probands with MMPSI and identified de novo gain-of-function mutations affecting the C-terminal domain of the KCNT1 potassium channel"
    explanation: >-
      The seminal study identifying de novo gain-of-function KCNT1 mutations as
      the cause of migrating focal seizures of infancy.
  downstream:
  - target: Increased Slack Sodium-Activated Potassium Current

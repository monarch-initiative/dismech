name: Epilepsy of Infancy with Migrating Focal Seizures
creation_date: "2026-07-18T00:00:00Z"
category: Genetic
description: >-
  Epilepsy of infancy with migrating focal seizures (EIMFS; formerly malignant
  migrating partial seizures of infancy) is a severe developmental and epileptic
  encephalopathy beginning in the first months of life. It is defined by nearly
  continuous, drug-resistant focal seizures that arise independently in both
  hemispheres and migrate from one cortical region to another on EEG, together
  with profound developmental impairment. The most common cause is a
  gain-of-function variant in KCNT1, which encodes the sodium-activated
  potassium channel Slack (KNa1.1); the increased potassium current disturbs the
  excitability of cortical networks. Prognosis is poor, and standard antiseizure
  medications are largely ineffective; the KCNT1 blocker quinidine has been
  tried as a precision therapy with variable benefit, and the ketogenic diet
  helps a substantial subset.

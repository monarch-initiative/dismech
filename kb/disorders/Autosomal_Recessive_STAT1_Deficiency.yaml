genetic:
- name: STAT1
  association: Causal
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: STAT1
    term:
      id: hgnc:11362
      label: STAT1
  notes: >-
    Biallelic loss-of-function STAT1 variants. In the 2021 cohort 22 alleles
    were found in 20 kindreds, 17 loss-of-function and 5 hypomorphic. Null
    alleles include the Saudi founder frameshift c.1757_1758delAG, L600P,
    c.1928insA and intronic splice variants (c.128+2T>G with c.542-8A>G);
    hypomorphic alleles include P696S and K201N, both of which act by
    disrupting splicing. Heterozygous loss-of-function STAT1 alleles
    (immunodeficiency 31A) and gain-of-function alleles (chronic mucocutaneous
    candidiasis) are separate disorders and are not part of this entry.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_3240fac3-4738-4cd5-9923-bd1ca1896b07-2024-10-06T090000.000Z
    evidence:
    - reference: CGGV:assertion_3240fac3-4738-4cd5-9923-bd1ca1896b07-2024-10-06T090000.000Z
      reference_title: "STAT1 / immunodeficiency 31B (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "STAT1 | HGNC:11362 | immunodeficiency 31B | MONDO:0013427 | AR | Definitive | SOP11 | Primary Immune Regulatory Disorders Gene Curation Expert Panel | 2024-10-06T09:00:00.000Z"
      explanation: >-
        ClinGen's Primary Immune Regulatory Disorders GCEP classifies STAT1 as
        Definitive for autosomal recessive immunodeficiency 31B.
  evidence:
  - reference: PMID:34183371
    reference_title: "Genetic, Immunological, and Clinical Features of 32 Patients with Autosomal Recessive STAT1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, based on these and previously reported data, 17 of these alleles are LOF, and five are hypomorphic."
    explanation: Summarizes the allelic series across the reported kindreds.
  - reference: PMID:32603428
    reference_title: "Autosomal recessive complete STAT1 deficiency caused by compound heterozygous intronic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both mutations were the first intronic STAT1 mutations to cause AR complete STAT1 deficiency."
    explanation: Intronic variants are part of the allelic spectrum.
pathophysiology:
- name: Biallelic STAT1 Loss of Function
  description: >-
    Biallelic STAT1 variants abolish (null alleles) or reduce (hypomorphic
    alleles) the amount of functional STAT1 protein, or leave a protein that is
    not tyrosine-phosphorylated after interferon stimulation. STAT1 is
    expressed in hematopoietic and non-hematopoietic cells, so the defect is
    present in leukocytes and in tissue cells such as fibroblasts and
    epithelium.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: STAT1
    term:
      id: hgnc:11362
      label: STAT1
  molecular_functions:
  - preferred_term: STAT1 transcription activator activity
    term:
      id: GO:0001228
      label: DNA-binding transcription activator activity, RNA polymerase II-specific
    modifier: DECREASED
  evidence:
  - reference: PMID:32603428
    reference_title: "Autosomal recessive complete STAT1 deficiency caused by compound heterozygous intronic mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patient's cells showed a lack of STAT1 expression and phosphorylation, and severe impairment of the cellular response to IFN-γ and IFN-α."
    explanation: Patient cells lack STAT1 protein and its phosphorylation.
  - reference: PMID:34183371
    reference_title: "Genetic, Immunological, and Clinical Features of 32 Patients with Autosomal Recessive STAT1 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "STAT1 is ubiquitously expressed in hematopoietic and non-hematopoietic cells"
    explanation: The defect is not confined to leukocytes.
  downstream:
  - target: Loss of IFN-gamma GAF Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12590259
      reference_title: "Impaired response to interferon-alpha/beta and lethal viral disease in human STAT1 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Neither IFN-alpha/beta nor IFN-gamma activated STAT1-containing transcription factors."
      explanation: Biallelic STAT1 loss prevents activation of the IFN-gamma-induced STAT1 complex.
  - target: Loss of Type I and III Interferon ISGF3 Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12590259
      reference_title: "Impaired response to interferon-alpha/beta and lethal viral disease in human STAT1 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Neither IFN-alpha/beta nor IFN-gamma activated STAT1-containing transcription factors."
      explanation: Biallelic STAT1 loss prevents activation of the IFN-alpha/beta-induced STAT1-containing complexes.
  - target: Loss of IL-27 Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19436109
      reference_title: "A partial form of recessive STAT1 deficiency in humans."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We also show that recessive STAT1 deficiencies impaired the IL-27 and IFN-lambda1 signaling pathways, possibly contributing to the predisposition to bacterial and viral infections, respectively."
      explanation: Recessive STAT1 deficiency impairs IL-27 signaling.
- name: Loss of IFN-gamma GAF Signaling
  description: >-
    Without STAT1, IFN-gamma cannot activate the gamma-activated factor (GAF,
    a STAT1 homodimer) or induce its target genes in monocytes and macrophages.
    In the partial form, activation is reduced rather than absent, or (K201N)
    impaired only in the first hour after stimulation.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: type II interferon-mediated signaling pathway
    term:
      id: GO:0060333
      label: type II interferon-mediated signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:12590259
    reference_title: "Impaired response to interferon-alpha/beta and lethal viral disease in human STAT1 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Neither IFN-alpha/beta nor IFN-gamma activated STAT1-containing transcription factors."
    explanation: Direct demonstration that IFN-gamma fails to activate STAT1 complexes.
  - reference: PMID:20841510
    reference_title: "A novel form of human STAT1 deficiency impairing early but not late responses to interferons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, the activation of γ-activating factor and ISGF3 was impaired only at early time points in the various cells from patient (within 1 hour of stimulation), whereas sustained impairment occurs in other known forms of complete and partial recessive STAT1 deficiency."
    explanation: Shows the graded nature of the GAF defect across alleles.
  downstream:

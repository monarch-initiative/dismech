discussions:
- discussion_id: hlh_mechanism_without_ifn_gamma
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does hemophagocytic syndrome arise in patients whose cells cannot
    respond to IFN-gamma, the cytokine thought to drive primary HLH?
  attaches_to:
  - pathophysiology#Hyperinflammatory Hemophagocytic Syndrome
  - phenotypes#Hemophagocytosis
  rationale: >-
    Seven of 32 patients developed hemophagocytic syndrome, mostly with complete
    STAT1 deficiency, and NK cell degranulation was normal in three of four
    patients tested. The cohort authors conclude that the syndrome can develop
    independently of IFN-gamma-STAT1 immunity, but the driving pathway is not
    identified. A single-patient study reported impaired NK cytolytic activity,
    so whether NK dysfunction contributes is also unsettled.
  evidence:
  - reference: PMID:34183371
    reference_title: "Genetic, Immunological, and Clinical Features of 32 Patients with Autosomal Recessive STAT1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NK cell degranulation and cytotoxicity were normal in three of the four patients tested."
    explanation: Shows that the usual cytotoxicity defect of primary HLH is mostly absent here.
  - reference: PMID:21772053
    reference_title: "Severe impairment of IFN-γ and IFN-α responses in cells of a patient with a novel STAT1 splicing mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, analysis of natural killer cells showed a defective STAT1 phosphorylation in response to IFN-α and impaired basal cytolytic activity, suggesting that the STAT1-dependent pathway might be important for natural killer cell function."
    explanation: A single-patient report of impaired NK cytolytic activity, which conflicts with the cohort result.
- discussion_id: non_hematopoietic_stat1_after_hsct
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the STAT1 defect that persists in non-hematopoietic cells after
    transplantation cause the late bronchiectasis and bronchiolitis obliterans
    seen in two survivors, as mouse lung-epithelial Stat1 deletion suggests?
  attaches_to:
  - phenotypes#Post-transplant bronchiectasis and bronchiolitis obliterans
  - treatments#Hematopoietic Stem Cell Transplantation
  rationale: >-
    Transplantation replaces only hematopoietic cells, while STAT1 is also
    required for interferon responses in epithelium. The evidence for an
    epithelial role in chronic lung disease comes from mice with
    Stat1-deficient lung epithelial cells; in patients there are only two
    transplanted survivors with late lung disease, and no study has tested the
    epithelial defect in human tissue.
  evidence:
  - reference: PMID:34183371
    reference_title: "Genetic, Immunological, and Clinical Features of 32 Patients with Autosomal Recessive STAT1 Deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Chronic lung disease is accelerated after viral clearance in mice with Stat1-deficient lung epithelial cells, suggesting an intrinsic role of STAT1 in epithelial cell defenses"
    explanation: The mouse evidence behind the hypothesis, quoted from the cohort paper's discussion.

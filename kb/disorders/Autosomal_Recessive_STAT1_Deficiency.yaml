    Patient blood cells do not respond to IFN-gamma with IL-12 production or
    HLA class II induction, so the IL-12/IFN-gamma loop that activates
    macrophages to kill intramacrophagic bacteria is broken. This is the same
    functional lesion as in the other forms of Mendelian susceptibility to
    mycobacterial disease.
  biological_scale: CELLULAR

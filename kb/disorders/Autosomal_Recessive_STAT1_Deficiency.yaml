has_subtypes:
- name: Complete
  display_name: AR complete STAT1 deficiency
  description: >-
    Biallelic null alleles (frameshift, nonsense, essential splice-site and
    loss-of-function missense variants) abolish STAT1 expression or function,
    so responses to type I, II and III interferons and IL-27 are absent. Onset
    is in early infancy (mean 3.0 months in the 2021 cohort) with disseminated
    BCG or environmental mycobacterial disease and severe herpesvirus disease;
    live viral vaccines cause severe disease. Without hematopoietic stem cell
    transplantation median survival was 6 months; 69% had died by 24 months,
    at a median age of 7.5 months.
  evidence:
  - reference: PMID:19436109
    reference_title: "A partial form of recessive STAT1 deficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete STAT1 deficiency is an autosomal recessive primary immunodeficiency caused by null mutations that abolish STAT1-dependent cellular responses to both IFN-alpha/beta and IFN-gamma. Affected children suffer from lethal intracellular bacterial and viral diseases."
    explanation: Defines the complete form by null alleles, abolished responses and lethal infection.
  - reference: PMID:34183371
    reference_title: "Genetic, Immunological, and Clinical Features of 32 Patients with Autosomal Recessive STAT1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 24 months, 69% of patients with AR complete STAT1 deficiency and 25.0% of those with AR partial STAT1 deficiency had died."
    explanation: Quantifies the difference in early mortality between the two forms.
  - reference: PMID:34183371
    reference_title: "Genetic, Immunological, and Clinical Features of 32 Patients with Autosomal Recessive STAT1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age at death was 7.5 months (SD: 7.3 months, range: 2–22 months) in the 18 patients with AR complete deficiency who died"
    explanation: Age at death in the complete form.
- name: Partial
  display_name: AR partial STAT1 deficiency
  description: >-
    Hypomorphic alleles (for example P696S and K201N, which disrupt splicing and
    leave low levels of normal STAT1 protein) impair but do not abolish
    interferon and IL-27 responses. Onset is later and more variable (mean 35.8
    months), infections are severe but curable, and environmental mycobacterial
    disease can relapse after treatment. Recurrent Salmonella disease was seen
    only in this form in the 2021 cohort.
  evidence:
  - reference: PMID:19436109
    reference_title: "A partial form of recessive STAT1 deficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The allele was hypofunctional, because residual full-length mRNA production resulted in low but detectable levels of normally functional STAT1 proteins."
    explanation: Gives the molecular basis of the partial form in the first reported kindred.
  - reference: PMID:19436109
    reference_title: "A partial form of recessive STAT1 deficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two affected siblings suffered from severe but curable intracellular bacterial and viral diseases."
    explanation: Establishes the milder, curable clinical course that separates the partial form.
  - reference: PMID:20841510
    reference_title: "A novel form of human STAT1 deficiency impairing early but not late responses to interferons."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation causes the abnormal splicing out of exon 8 from most STAT1 mRNAs, thereby decreasing (by ~ 70%) STAT1 protein levels."
    explanation: A second hypomorphic allele (K201N) that lowers STAT1 abundance rather than abolishing it.
  - reference: PMID:34183371
    reference_title: "Genetic, Immunological, and Clinical Features of 32 Patients with Autosomal Recessive STAT1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is important to distinguish between complete and partial forms of AR STAT1 deficiency, as their clinical outcome and management differ significantly."
    explanation: The cohort authors treat complete and partial deficiency as clinically distinct forms.
inheritance:
- name: Autosomal recessive
  description: >-
    Homozygous or compound heterozygous STAT1 variants. Heterozygous carriers
    are healthy and their cells show normal STAT1 levels and phosphorylation,
    so there is no haploinsufficiency at the locus.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:12590259
    reference_title: "Impaired response to interferon-alpha/beta and lethal viral disease in human STAT1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here two unrelated infants homozygous with respect to mutated STAT1 alleles."
    explanation: The founding report of disease in infants carrying biallelic STAT1 variants.
  - reference: PMID:32603428
    reference_title: "Autosomal recessive complete STAT1 deficiency caused by compound heterozygous intronic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, AR complete STAT1 deficiency can be caused by compound heterozygous and intronic mutations."
    explanation: Extends the recessive genotype to compound heterozygosity.
  - reference: PMID:34183371
    reference_title: "Genetic, Immunological, and Clinical Features of 32 Patients with Autosomal Recessive STAT1 Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "displayed normal levels of STAT1 and of STAT1 phosphorylation after stimulation on WB, reflecting an absence of haploinsufficiency at the STAT1 locus"
    explanation: Carrier cells are functionally normal, consistent with recessive inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population rate exists. The 2021 international cohort assembled 32
    patients from 20 kindreds (24 complete, 8 partial); before it, nine cases of
    the complete form had been published. A Saudi founder allele
    (c.1757_1758delAG) is recurrent.
  evidence:
  - reference: PMID:34183371
    reference_title: "Genetic, Immunological, and Clinical Features of 32 Patients with Autosomal Recessive STAT1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the genetic, immunological, and clinical features of an international cohort of 32 patients from 20 kindreds: 24 patients with complete deficiency, and 8 patients with partial deficiency."
    explanation: The largest published case count.
  - reference: PMID:33394319
    reference_title: "Successful Hematopoietic Stem Cell Transplantation for Autosomal Recessive STAT1 Complete Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AR STAT1 complete deficiency is a rare form of PID, with only nine cases in seven families reported to date"
    explanation: Case count for the complete form before the 2021 cohort.
  - reference: PMID:34183371
    reference_title: "Genetic, Immunological, and Clinical Features of 32 Patients with Autosomal Recessive STAT1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A founder effect in two kindreds from Saudi Arabia (recurrent c.1757_1758delAG variant) was found"
    explanation: Records the Saudi founder allele that shapes the geographic distribution.

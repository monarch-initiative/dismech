diagnosis:
- name: Functional STAT1 assays
  description: >-
    STAT1 protein expression and tyrosine-701 phosphorylation (western blot or
    flow cytometry) and the cellular response to IFN-gamma and IFN-alpha in
    patient cells. Absent in the complete form, reduced in the partial form.
    Routine immunology is unrevealing: lymphocyte subsets are normal.

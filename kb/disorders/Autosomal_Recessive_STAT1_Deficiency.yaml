name: Autosomal Recessive STAT1 Deficiency
creation_date: "2026-11-16T14:25:26Z"
category: Mendelian
synonyms:
- immunodeficiency 31B
- IMD31B
- immunodeficiency 31B, mycobacterial and viral infections, autosomal recessive
- STAT1 deficiency
- Stat1 deficiency, autosomal recessive
- susceptibility to viral and mycobacterial infections
- immunodeficiency type 31B
disease_term:
  preferred_term: immunodeficiency 31B
  term:
    id: MONDO:0013427
    label: immunodeficiency 31B
parents:
- inborn error of immunity
- autosomal recessive disease
description: >-
  Autosomal recessive STAT1 deficiency (immunodeficiency 31B; OMIM 613796) is an
  inborn error of immunity caused by biallelic loss-of-function variants in
  STAT1. STAT1 is the transcription factor shared by the IFN-gamma-activated
  factor (GAF, a STAT1 homodimer) and IFN-stimulated gene factor 3 (ISGF3,
  STAT1-STAT2-IRF9), so its loss impairs cellular responses to type I, II and
  III interferons and to IL-27. Loss of IFN-gamma signalling leaves macrophages
  unable to contain intramacrophagic bacteria, producing disseminated BCG and
  environmental mycobacterial disease; loss of type I and III interferon
  signalling abolishes the cell-intrinsic antiviral state, producing severe
  herpesvirus infections and disease after live attenuated viral vaccines.
  Hemophagocytic syndrome occurs in about a fifth of patients. Two allelic forms
  differ in severity: complete deficiency (null alleles) begins in early infancy
  and is usually fatal without hematopoietic stem cell transplantation (median
  age at death 7.5 months), whereas partial deficiency (hypomorphic alleles)
  gives severe but curable, relapsing infections. Lymphocyte subsets and
  immunoglobulin levels are normal, so the diagnosis rests on functional STAT1
  assays and sequencing. This entry excludes two other disorders at the same
  locus: autosomal dominant partial STAT1 deficiency (immunodeficiency 31A,
  Mendelian susceptibility to mycobacterial disease without viral disease) and
  autosomal dominant STAT1 gain of function (chronic mucocutaneous
  candidiasis, curated in Chronic_Mucocutaneous_Candidiasis).
notes: >-
  No GeneReviews chapter covers autosomal recessive STAT1 deficiency (checked
  with `just check-genereviews --online`, which searches the committed Bookshelf
  index and PubMed for the disease names and the STAT1 gene symbol). The
  phenotype baseline is the 32-patient international cohort (PMID:34183371),
  the largest series. Phenotype frequencies use all 32 patients as the
  denominator unless the phenotype description gives another.
references:
- reference: PMID:34183371

  - reference: PMID:32603428
    reference_title: "Autosomal recessive complete STAT1 deficiency caused by compound heterozygous intronic mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patient's cells showed a lack of STAT1 expression and phosphorylation, and severe impairment of the cellular response to IFN-γ and IFN-α."
    explanation: The functional readouts that establish the diagnosis.
  - reference: PMID:34183371
    reference_title: "Genetic, Immunological, and Clinical Features of 32 Patients with Autosomal Recessive STAT1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory studies showed normal counts for circulating myeloid subsets (polymorphonuclear cells and monocytes, data not shown) and normal levels of circulating lymphocytes, in terms of both counts and percentages (CD3+, CD4+, CD8+ T cells, B and NK cells), in the 19 patients tested."
    explanation: Standard immunophenotyping is normal and does not exclude the disease.

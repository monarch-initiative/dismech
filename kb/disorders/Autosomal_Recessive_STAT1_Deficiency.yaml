  - reference: PMID:32603428
    reference_title: "Autosomal recessive complete STAT1 deficiency caused by compound heterozygous intronic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted RNA-seq-based systemic gene expression assay may help to increase diagnostic yield in inconclusive cases after comprehensive genomic study."
    explanation: RNA-level analysis can find variants missed by exonic sequencing.

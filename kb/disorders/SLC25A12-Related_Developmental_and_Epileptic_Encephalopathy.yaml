name: SLC25A12-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
synonyms:
- DEE39
- EIEE39
- AGC1 deficiency
- aralar deficiency
- cerebral aspartate-glutamate carrier isoform 1 deficiency
- developmental and epileptic encephalopathy 39
description: >-
  SLC25A12-related developmental and epileptic encephalopathy (DEE39, AGC1
  deficiency) is an ultra-rare autosomal recessive neurometabolic epilepsy caused
  by biallelic variants in SLC25A12, which encodes AGC1 (aralar), the
  neuron-specific mitochondrial aspartate-glutamate carrier. AGC1 is the
  calcium-regulated component of the malate-aspartate shuttle, the principal route
  by which neurons pass cytosolic reducing equivalents into mitochondria; it
  exchanges mitochondrial aspartate for cytosolic glutamate, so losing it
  simultaneously blocks cytosolic NAD+ regeneration and cuts off the neuronal
  supply of aspartate. The consequences run down two very different routes from
  one transport defect. The bioenergetic route limits ATP supply exactly when
  neurons fire, since activity-dependent calcium normally activates AGC1. The
  biosynthetic route depletes aspartate and therefore N-acetylaspartate, whose
  acetyl groups are exported to oligodendrocytes for myelin lipid synthesis.
  Affected children present in infancy with refractory seizures, arrested
  psychomotor development, and hypotonia, with global cerebral hypomyelination and
  a strikingly reduced NAA peak on MR spectroscopy. Whether the hypomyelination is
  a primary oligodendrocyte problem or secondary to neuronal dysfunction is
  actively disputed.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 39
  term:
    id: MONDO:0013056
    label: developmental and epileptic encephalopathy, 39
parents:
- Neurodevelopmental Disorder
- Genetic Disease
- Inborn Error of Metabolism

inheritance:
- name: Autosomal recessive
  description: >-
    DEE39 requires two pathogenic SLC25A12 alleles. Reported genotypes include
    homozygous missense variants in consanguineous families and compound
    heterozygous variants.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:19641205
    reference_title: "AGC1 deficiency associated with global cerebral hypomyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in a child with a homozygous missense mutation in the solute carrier family 25, member 12, gene SLC25A12, which encodes the AGC1 protein"
    explanation: >-
      The founding case is a homozygous missense genotype.
  - reference: PMID:31403263
    reference_title: "Longitudinal MRI findings in patient with SLC25A12 pathogenic variants inform disease progression and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Novel compound heterozygous, recessive variants in SLC25A12 were identified"
    explanation: >-
      Documents the compound heterozygous route to the same disorder.

pathophysiology:
- name: Biallelic SLC25A12 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Two pathogenic SLC25A12 alleles are present - reported variants include the
    homozygous missense c.1058G>A p.Arg353Gln and the compound heterozygous pair
    c.1295C>T p.A432V with c.1447-2_1447-1delAG. This node records the genomic
    lesion only.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:24515575
    reference_title: "AGC1 Deficiency Causes Infantile Epilepsy, Abnormal Myelination, and Reduced N-Acetylaspartate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel SLC25A12 homozygous missense mutation, c.1058G>A; p.Arg353Gln, segregated with disease in this kindred."
    explanation: >-
      Reports a specific causal variant with segregation.
  - reference: PMID:31403263
    reference_title: "Longitudinal MRI findings in patient with SLC25A12 pathogenic variants inform disease progression and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Novel compound heterozygous, recessive variants in SLC25A12 were identified: c.1295C>T (p.A432V) and c.1447-2_1447-1delAG."
    explanation: >-
      Reports the compound heterozygous variant pair.
  downstream:
  - target: Reduced AGC1 Aspartate-Glutamate Carrier Activity
    causal_link_type: DIRECT
    description: >-
      The variants reduce or abolish the transport activity of the carrier protein.

- name: Reduced AGC1 Aspartate-Glutamate Carrier Activity
  biological_scale: MOLECULAR
  description: >-
    The carrier's capacity to exchange mitochondrial aspartate for cytosolic
    glutamate across the inner mitochondrial membrane is reduced. Variant severity
    spans a measured range - p.Arg353Gln retains about 15% of wild-type activity
    while the founding variant abolished activity entirely - so the disorder is not
    a single all-or-nothing lesion.
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  biological_processes:
  - preferred_term: aspartate transmembrane transport
    term:
      id: GO:0015810
      label: aspartate transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:24515575
    reference_title: "AGC1 Deficiency Causes Infantile Epilepsy, Abnormal Myelination, and Reduced N-Acetylaspartate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Recombinant mutant p.Arg353Gln AGC1 activity was reduced to 15% of wild type."
    explanation: >-
      Quantifies residual carrier activity for one variant.
  - reference: PMID:19641205
    reference_title: "AGC1 deficiency associated with global cerebral hypomyelination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis of the mutant AGC1 protein showed abolished activity."
    explanation: >-
      Documents complete loss of activity for a different variant, establishing the
      range.
  downstream:
  - target: Malate-Aspartate Shuttle Failure
    causal_link_type: DIRECT
    description: >-
      AGC1 is the regulatory component of the shuttle, so losing it disables the
      shuttle.
  - target: Depletion of Neuronal Cytosolic Aspartate
    causal_link_type: DIRECT
    description: >-
      Aspartate can no longer be exported from mitochondria to the cytosol. This is
      a separate consequence from the redox one: it concerns where a metabolite ends
      up, not the NADH balance.

- name: Malate-Aspartate Shuttle Failure
  biological_scale: MOLECULAR
  description: >-
    The principal neuronal NADH redox shuttle stops working, so cytosolic NADH is
    no longer reoxidized by transfer of reducing equivalents into mitochondria and
    the cytosolic NAD+/NADH ratio shifts unfavourably for glucose oxidation.
  biological_processes:
  - preferred_term: cellular respiration
    term:
      id: GO:0045333
      label: cellular respiration
    modifier: ABNORMAL
  evidence:
  - reference: PMID:19641205
    reference_title: "AGC1 deficiency associated with global cerebral hypomyelination."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "as a component of the malate-aspartate shuttle, enables mitochondrial oxidation of cytosolic NADH, thought to be important in providing energy for neurons in the central nervous system"
    explanation: >-
      States the shuttle function that is lost.
  - reference: PMID:35008954
    reference_title: "AGC1 Deficiency: Pathology and Molecular and Cellular Mechanisms of the Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The function of MAS in brain is essential for maintaining a NAD+/NADH ratio favorable for the oxidative metabolism of glucose"
    explanation: >-
      Names the redox consequence specifically.
  downstream:
  - target: Impaired Activity-Dependent Neuronal Respiration
    causal_link_type: DIRECT
    description: >-
      Without the shuttle, glucose-supported mitochondrial respiration cannot keep
      pace with demand.

- name: Impaired Activity-Dependent Neuronal Respiration
  biological_scale: CELLULAR
  description: >-
    Baseline and maximal uncoupled respiration fall in AGC1-deficient neurons. The
    critical feature is the coupling to activity: AGC1 is calcium-regulated, so the
    normal mechanism by which firing neurons boost their own ATP supply is exactly
    what is lost. Pyruvate rescues respiration, which is diagnostic of the defect
    being NAD+/NADH cycling rather than a primary respiratory chain lesion.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cellular respiration
    term:
      id: GO:0045333
      label: cellular respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:31403263
    reference_title: "Longitudinal MRI findings in patient with SLC25A12 pathogenic variants inform disease progression and classification."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "decreased baseline and maximal uncoupled respiration in neuronal cultures"
    explanation: >-
      Reports the respiratory deficit itself, measured in cultured AGC1-deficient
      neurons.
  - reference: PMID:31403263
    reference_title: "Longitudinal MRI findings in patient with SLC25A12 pathogenic variants inform disease progression and classification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Metabolic alterations include reduced aspartate and NAA in the brain"
    explanation: >-
      The in vivo half of the same finding, measured in the brains of Slc25a12
      loss-of-function mice, and quoted separately so each item carries a single
      evidence source.
  - reference: PMID:31403263
    reference_title: "Longitudinal MRI findings in patient with SLC25A12 pathogenic variants inform disease progression and classification."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As utilization of pyruvate obviates the accumulation of NADH that occurs during glucose catabolism, the ability of pyruvate to rescue these deficits is suggestive of the importance of AGC1's role in NAD+/NADH cycling"
    explanation: >-
      The pyruvate rescue localizes the defect to redox cycling rather than to the
      respiratory chain itself. Tagged in vitro because the rescue experiments this
      sentence interprets were done in cerebellar slice cultures and cortical
      neurons, not in the intact animal.
  downstream:
  - target: Neuronal Hyperexcitability and Seizure Generation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced activity-dependent energy supply is one of several converging routes
      to hyperexcitability; the intermediate steps are not established.
  - target: Nigrostriatal Dopaminergic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Substrate limitation at complex I is proposed to underlie the selective
      vulnerability of dopaminergic neurons.

- name: Depletion of Neuronal Cytosolic Aspartate
  biological_scale: CELLULAR
  description: >-
    Brain aspartate falls dramatically because mitochondrial aspartate cannot reach
    the cytosol. This is the biosynthetic arm and is measurable independently of any
    respiratory parameter.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:35008954
    reference_title: "AGC1 Deficiency: Pathology and Molecular and Cellular Mechanisms of the Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "hypo myelination and a drastic drop in brain aspartate (Asp) and N-acetylaspartate (NAA)"
    explanation: >-
      Documents the fall in brain aspartate alongside NAA.
  - reference: PMID:19641205
    reference_title: "AGC1 deficiency associated with global cerebral hypomyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that impaired efflux of aspartate from neuronal mitochondria prevents normal myelin formation"
    explanation: >-
      Names impaired aspartate efflux as the proposed link to the myelin phenotype.
  downstream:
  - target: Reduced N-Acetylaspartate Synthesis
    causal_link_type: DIRECT
    description: >-
      Aspartate is the substrate from which N-acetylaspartate is made, so its
      depletion limits NAA synthesis.
  - target: Impaired Astroglial Glutamine Synthesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neuronal aspartate normally serves as a nitrogen donor for astrocytic
      glutamate and hence glutamine; this is a non-cell-autonomous consequence.

- name: Reduced N-Acetylaspartate Synthesis
  biological_scale: CELLULAR
  description: >-
    N-acetylaspartate, the second most abundant metabolite in the CNS, is
    continuously made from aspartate in neurons. With aspartate depleted, NAA falls
    steeply - the finding that produces the diminished NAA peak on MR spectroscopy.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:31403263
    reference_title: "Longitudinal MRI findings in patient with SLC25A12 pathogenic variants inform disease progression and classification."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "in the brain, neuronal aspartate is continuously acetylated to form N-acetylaspartate (NAA)"
    explanation: >-
      States the biosynthetic relationship between aspartate and NAA.
  - reference: PMID:24515575
    reference_title: "AGC1 Deficiency Causes Infantile Epilepsy, Abnormal Myelination, and Reduced N-Acetylaspartate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abnormal myelination, fluctuating basal ganglia changes, cerebral atrophy, and reduced N-acetylaspartate (NAA)"
    explanation: >-
      Documents reduced NAA in affected children.
  downstream:
  - target: Reduced Acetyl-Group Supply to Oligodendrocytes
    causal_link_type: DIRECT
    description: >-
      NAA is the vehicle by which neuron-derived acetyl groups reach oligodendrocytes.

- name: Reduced Acetyl-Group Supply to Oligodendrocytes
  biological_scale: TISSUE
  description: >-
    NAA is normally transported from neurons to glial cells, particularly
    oligodendrocytes, where it is thought to supply acetyl groups for lipid and
    myelin synthesis. Less NAA means less of that supply. This is a transcellular
    step, distinct from both the neuronal synthesis upstream and the myelin
    deficit downstream.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  evidence:
  - reference: PMID:31403263
    reference_title: "Longitudinal MRI findings in patient with SLC25A12 pathogenic variants inform disease progression and classification."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NAA is transported to glial cells, particularly oligodendrocytes, where it is likely used for lipid and myelin synthesis"
    explanation: >-
      Describes the transcellular route, with the authors' own hedge on its
      certainty preserved.
  - reference: PMID:24515575
    reference_title: "AGC1 Deficiency Causes Infantile Epilepsy, Abnormal Myelination, and Reduced N-Acetylaspartate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AGC1 activity enables neuronal export of aspartate, the glial substrate necessary for proper neuronal myelination."
    explanation: >-
      States the neuron-to-glia substrate relationship directly.
  downstream:
  - target: Global Cerebral Hypomyelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced acetyl-group supply is the leading proposed cause of the myelin
      deficit, but whether the myelin failure is primary to oligodendrocytes or
      secondary to neuronal dysfunction is disputed.

- name: Impaired Astroglial Glutamine Synthesis
  biological_scale: CELLULAR
  description: >-
    Glutamine synthesis in astrocytes is markedly impaired even though AGC1 is
    expressed in neurons rather than astrocytes. This apparent paradox is the
    clearest evidence that the disorder is transcellular, and it degrades the
    glutamate-glutamine cycle on which neurotransmission depends.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: glutamate metabolic process
    term:
      id: GO:0006536
      label: glutamate metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35008954
    reference_title: "AGC1 Deficiency: Pathology and Molecular and Cellular Mechanisms of the Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, paradoxically, glial functions such as myelin and Glutamine (Gln) synthesis are markedly impaired in AGC1 deficiency."
    explanation: >-
      States the non-cell-autonomous glial failure and flags it as paradoxical.
  - reference: PMID:35008954
    reference_title: "AGC1 Deficiency: Pathology and Molecular and Cellular Mechanisms of the Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the aralar-KO mice model that extensively recapitulate the human disease including the astroglial failure to synthesize Gln"
    explanation: >-
      Confirms the astroglial defect is reproduced in the knockout mouse.
  downstream:
  - target: Neuronal Hyperexcitability and Seizure Generation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disturbed glutamate-glutamine cycling is proposed as one contributor to the
      excitability phenotype.

- name: Global Cerebral Hypomyelination
  biological_scale: TISSUE
  description: >-
    Myelination of the cerebral hemispheres is globally deficient. Longitudinal
    imaging in the oldest reported patient shows early hypomyelination followed by
    subsequent progression of myelination, a pattern the authors read as a
    leuko-axonopathy - white matter abnormality secondary to a primary neuronal
    defect - rather than a primary oligodendrocyte disease.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: DECREASED
  evidence:
  - reference: PMID:19641205
    reference_title: "AGC1 deficiency associated with global cerebral hypomyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The child had global hypomyelination in the cerebral hemispheres"
    explanation: >-
      Documents the global cerebral hypomyelination in the founding case.
  - reference: PMID:31403263
    reference_title: "Longitudinal MRI findings in patient with SLC25A12 pathogenic variants inform disease progression and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The serial neuroimaging findings are notable for cerebral atrophy with white matter involvement, namely, early hypomyelination yet subsequent progression of myelination."
    explanation: >-
      Documents that myelination progresses over time, which is the observation
      driving the secondary-mechanism reading.
  downstream:
  - target: Arrested Psychomotor Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Deficient myelination contributes to the developmental phenotype alongside the
      bioenergetic deficit.

- name: Nigrostriatal Dopaminergic Dysfunction
  biological_scale: TISSUE
  description: >-
    Aralar deficiency selectively affects nigrostriatal dopaminergic neurons, which
    show altered dopamine handling in the knockout mouse. This is a circuit-specific
    vulnerability separate from the diffuse cortical excitability phenotype, and it
    is the proposed basis for the movement-disorder features.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:35008954
    reference_title: "AGC1 Deficiency: Pathology and Molecular and Cellular Mechanisms of the Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the dopamine (DA) mishandling in the nigrostriatal system"
    explanation: >-
      Names the dopaminergic phenotype reproduced in the knockout mouse.

- name: Neuronal Hyperexcitability and Seizure Generation
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Neurons become hyperexcitable despite the overall energy-deficient state. Several
    routes converge here - reduced activity-dependent ATP supply and disturbed
    glutamate-glutamine cycling among them - and the review that assembles them
    describes the epilepsy as a direct consequence of the neuronal metabolic defect
    rather than of the glial changes.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:35008954
    reference_title: "AGC1 Deficiency: Pathology and Molecular and Cellular Mechanisms of the Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Epilepsy and DA mishandling are a direct consequence of the metabolic defect in neurons due to AGC1/Aralar deficiency."
    explanation: >-
      Attributes the epilepsy to the neuronal metabolic defect specifically, as
      distinct from the glial arms.
  downstream:
  - target: Infantile-Onset Epilepsy
    causal_link_type: DIRECT
    description: >-
      Sustained hyperexcitability manifests as recurrent infantile-onset seizures.

- name: Infantile-Onset Epilepsy
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  description: >-
    Seizures begin in infancy. They are pharmacoresistant in many reported children
    but not universally - medical control has been achieved in several - so
    refractoriness is a common course rather than part of the definition. The
    ketogenic diet, which bypasses the glycolytic NADH load the shuttle cannot
    handle, has produced marked benefit in reported cases.
  evidence:
  - reference: PMID:24515575
    reference_title: "AGC1 Deficiency Causes Infantile Epilepsy, Abnormal Myelination, and Reduced N-Acetylaspartate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two siblings presented with profound developmental delay, congenital hypotonia, refractory epilepsy, abnormal myelination"
    explanation: >-
      Documents the refractory epilepsy phenotype.
  downstream:
  - target: Arrested Psychomotor Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      High early seizure burden compounds the developmental phenotype, which the
      metabolic and myelin arms already produce independently.

- name: Arrested Psychomotor Development
  biological_scale: ORGANISM
  description: >-
    Psychomotor development arrests, producing profound developmental delay and, in
    the oldest reported patient, severe intellectual disability with nonambulatory
    and nonverbal status. Three upstream routes converge here and the published
    cases do not apportion them.
  evidence:
  - reference: PMID:19641205
    reference_title: "AGC1 deficiency associated with global cerebral hypomyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a novel syndrome characterized by arrested psychomotor development, hypotonia, and seizures"
    explanation: >-
      Defines the syndrome's developmental phenotype.
  - reference: PMID:31403263
    reference_title: "Longitudinal MRI findings in patient with SLC25A12 pathogenic variants inform disease progression and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical presentation is characterized by severe intellectual disability, nonambulatory, nonverbal status, hypotonia, epilepsy, spastic quadriplegia, and a happy disposition."
    explanation: >-
      Documents the long-term functional outcome in the oldest reported individual.


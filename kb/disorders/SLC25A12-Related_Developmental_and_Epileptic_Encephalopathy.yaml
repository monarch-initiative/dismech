    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLC25A12 encodes the neuronal aspartate-glutamate carrier 1 (AGC1) protein, an essential component of the neuronal malate/aspartate shuttle"
    explanation: >-
      Establishes the gene product and its function.
  - reference: PMID:35008954
    reference_title: "AGC1 Deficiency: Pathology and Molecular and Cellular Mechanisms of the Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "whereas aralar deficiency provokes predominantly neurological effects"
    explanation: >-
      Distinguishes this disorder from the paralogous citrin deficiency, which
      matters because both are aspartate-glutamate carriers; the same sentence states

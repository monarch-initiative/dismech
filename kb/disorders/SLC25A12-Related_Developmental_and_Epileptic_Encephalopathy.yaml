treatments:
- name: Ketogenic Diet
  description: >-
    Seizure frequency abated drastically following initiation of the ketogenic diet
    in a reported case. The rationale is mechanistically apt: ketone bodies are
    metabolized without generating the cytosolic NADH load that the failed
    malate-aspartate shuttle cannot clear, so the diet routes around the specific
    defect rather than merely suppressing excitability. The response should not be
    read as uniform: the published clinical evidence is a small number of individual
    reports, and no series establishes what fraction of patients benefit or by how
    much.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Impaired Activity-Dependent Neuronal Respiration
    treatment_effect: RESTORES
    description: >-
      The metabolic-bypass arm. beta-hydroxybutyrate, the main ketone body produced
      on a ketogenic diet, recovers aralar-knockout neurons from their basal- and
      glutamate-stimulated respiration deficits, which is the mechanism the diet is
      proposed to work through in this disorder rather than by generic seizure
      suppression.
    evidence:
    - reference: PMID:33087477
      reference_title: "βOHB Protective Pathways in Aralar-KO Neurons and Brain: An Alternative to Ketogenic Diet."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "OHB efficiently recovers aralar-KO neurons from deficits in basal-stimulated and glutamate-stimulated respiration, effects requiring βOHB entry into the neuron, and protects from glutamate excitotoxicity"
      explanation: >-
        Direct demonstration that the ketone body rescues the respiratory deficit
        this entry models as the bioenergetic arm.
    - reference: PMID:33087477
      reference_title: "βOHB Protective Pathways in Aralar-KO Neurons and Brain: An Alternative to Ketogenic Diet."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We have investigated whether β-hydroxybutyrate (βOHB), the main ketone body (KB) produced in ketogenic diet (KD), is neuroprotective in aralar-knock-out (KO) neurons and mice"
      explanation: >-
        Establishes beta-hydroxybutyrate as the ketogenic-diet-derived agent under
        test, which is what licenses reading this preclinical result onto the diet.
  - target: Infantile-Onset Epilepsy
    treatment_effect: INHIBITS
    description: >-
      Marked reduction in seizure frequency after starting the diet.
    evidence:
    - reference: PMID:31766059
      reference_title: "Expanding Phenotypic Spectrum of Cerebral Aspartate-Glutamate Carrier Isoform 1 (AGC1) Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patient's seizure frequency abated drastically following initiation of ketogenic diet."
      explanation: >-
        Records the observed seizure response.
  evidence:
  - reference: PMID:31766059
    reference_title: "Expanding Phenotypic Spectrum of Cerebral Aspartate-Glutamate Carrier Isoform 1 (AGC1) Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report also provides evidence regarding beneficial effect of ketogenic diet in this rare neurometabolic epilepsy."
    explanation: >-
      The authors state the ketogenic-diet benefit as a contribution of their report.
  notes: >-
    Efficacy here rests on single-patient reports, so the striking response recorded
    above is the best-documented outcome rather than a typical one. Cohort data
    described in the deep-research artifact for this entry suggest the response is
    heterogeneous, with some children deriving modest or no benefit, but that source
    could not be resolved to a citable publication and so is deliberately not curated
    as evidence. The gap is recorded rather than filled: a case series reporting the
    distribution of responses is the missing observation, and it is the same gap the
    gap_ketogenic_diet_mechanism_and_generality discussion turns on.
- name: Conventional Anti-Seizure Medication
  description: >-
    Response is heterogeneous rather than uniformly refractory. Several reported
    children had pharmacoresistant seizures, but seizures were successfully treated

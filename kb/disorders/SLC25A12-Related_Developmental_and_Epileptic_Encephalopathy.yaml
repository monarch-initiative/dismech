discussions:
- discussion_id: controversy_primary_versus_secondary_hypomyelination
  prompt: >-
    Is the hypomyelination in AGC1 deficiency a primary oligodendrocyte disease
    caused by loss of the NAA-derived acetyl-group supply, or is it a
    leuko-axonopathy - white matter abnormality secondary to a primary neuronal
    defect?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Acetyl-Group Supply to Oligodendrocytes
  - pathophysiology#Global Cerebral Hypomyelination
  rationale: >-
    The mechanism curated here runs neuron to oligodendrocyte: aspartate depletion
    reduces NAA, NAA carries acetyl groups to oligodendrocytes, myelin lipid
    synthesis suffers. That chain is well motivated but the disagreement is explicit
    in the literature, and longitudinal imaging is what forces it. The oldest
    reported patient showed early hypomyelination followed by subsequent progression
    of myelination, which the authors read as characteristic of a leuko-axonopathy -
    a white matter abnormality arising from a primary neuronal defect - rather than
    of an oligodendrocyte disease, because a primary myelinating-cell defect would
    not be expected to catch up over time. The review literature is careful to leave
    both open, noting the glial deficits may be a consequence of neuronal affectation
    or a direct effect in glial cells. Two things hang on it: whether a therapy
    should target neuronal metabolism or oligodendrocyte substrate supply, and
    whether the white matter finding should be read prognostically as static or
    improvable.
  evidence:
  - reference: PMID:31403263
    reference_title: "Longitudinal MRI findings in patient with SLC25A12 pathogenic variants inform disease progression and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there has been discussion in the literature as to whether this hypomyelination is primary or secondary to a neuronal defect"
    explanation: >-
      States the existence of the disagreement directly.
  - reference: PMID:31403263
    reference_title: "Longitudinal MRI findings in patient with SLC25A12 pathogenic variants inform disease progression and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The longitudinal MRI findings are most consistent with a leukodystrophy of the leuko-axonopathy category, that is, white matter abnormalities that are most suggestive of mechanisms that result from primary neuronal defects."
    explanation: >-
      The evidence for the secondary reading, and the specific classification it
      supports.
  - reference: PMID:35008954
    reference_title: "AGC1 Deficiency: Pathology and Molecular and Cellular Mechanisms of the Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, the deficits in myelin and Gln synthesis may be a consequence of neuronal affectation or a direct effect of AGC1/Aralar deficiency in glial cells. Further research is needed to clarify this question"
    explanation: >-
      The review states both possibilities and declines to choose, which is why this
      is curated as an open controversy rather than a settled chain.
  proposed_experiments:
  - experiment_id: exp_celltype_restricted_aralar_deletion
    name: Neuron-restricted versus oligodendrocyte-restricted aralar deletion
    description: >-
      Compare conditional Slc25a12 deletion restricted to neurons against deletion
      restricted to the oligodendrocyte lineage, scoring myelin thickness,
      oligodendrocyte maturation, and brain NAA in each, to establish whether the
      myelin deficit requires the neuronal lesion or can arise cell-autonomously in
      glia. A neuron-restricted deletion that reproduces the full myelin phenotype
      would settle the question in favour of the leuko-axonopathy reading.

- discussion_id: gap_hyperexcitability_in_an_energy_deficient_state
  prompt: >-
    How does a disorder whose central defect is reduced neuronal energy supply
    produce hyperexcitability and refractory seizures, rather than the depressed
    excitability that an energy deficit would naively predict?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Activity-Dependent Neuronal Respiration
  - pathophysiology#Neuronal Hyperexcitability and Seizure Generation
  rationale: >-
    This is the substantive puzzle of the disorder and the entry does not resolve it.
    Several contributors are proposed - reduced activity-dependent ATP supply,
    disturbed glutamate-glutamine cycling, loss of the astrocyte-neuron lactate
    shuttle's protective role - but none has been shown to be sufficient, and their
    relative weights are unknown. The paradox is not unique to AGC1 deficiency; it
    recurs across metabolic encephalopathies, which suggests a general principle is
    missing rather than a disorder-specific detail. Note that the causal edges into
    the hyperexcitability node are typed INDIRECT_UNKNOWN_INTERMEDIATES precisely
    because of this: the endpoints are evidenced and the path between them is not.
  evidence:
  - reference: PMID:35008954
    reference_title: "AGC1 Deficiency: Pathology and Molecular and Cellular Mechanisms of the Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Epilepsy and DA mishandling are a direct consequence of the metabolic defect in neurons due to AGC1/Aralar deficiency."
    explanation: >-
      Attributes the epilepsy to the neuronal metabolic defect while leaving the
      intervening mechanism unspecified.
  - reference: PMID:35008954
    reference_title: "AGC1 Deficiency: Pathology and Molecular and Cellular Mechanisms of the Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Herein, we discuss the role of the AGC1/Aralar-MAS pathway in neuronal functions such as Asp and NAA synthesis, lactate use, respiration on glucose, glutamate (Glu) oxidation and other neurometabolic aspects."
    explanation: >-
      Enumerates the candidate contributors whose relative weights are unresolved.
  proposed_experiments:
  - experiment_id: exp_dissect_excitability_contributors
    name: Dissect the contributors to hyperexcitability in aralar-deficient cortex
    description: >-
      In aralar-knockout cortical slices, separately restore each candidate arm -
      supply exogenous pyruvate to bypass the redox block, supply glutamine to
      bypass the astroglial synthesis failure, and supply lactate to restore the
      shuttle - and measure epileptiform discharge threshold and duration after each,
      to establish which contributor is rate-limiting for the excitability phenotype
      rather than merely present.

- discussion_id: gap_ketogenic_diet_mechanism_and_generality
  prompt: >-
    Does the ketogenic diet work in AGC1 deficiency because ketone bodies bypass the
    cytosolic NADH load that the failed malate-aspartate shuttle cannot clear, and if
    so should it be first-line rather than a late option after conventional agents
    fail?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Malate-Aspartate Shuttle Failure
  - pathophysiology#Infantile-Onset Epilepsy
  rationale: >-
    The reported ketogenic-diet response is striking - seizure frequency abated
    drastically - and there is a clean mechanistic rationale, since ketone body
    oxidation does not generate the cytosolic NADH that the shuttle would normally
    clear. The same logic explains why pyruvate rescues respiration in the model
    systems, and the mechanism has since been tested directly with the diet's own
    active metabolite: beta-hydroxybutyrate restores basal and glutamate-stimulated
    respiration in aralar-KO neurons, and the rescue requires the ketone body to
    enter the neuron. So the mechanistic arm is no longer only an inference from
    biochemistry. What remains open is the translation: the clinical evidence is
    still individual case reports, the mechanism has not been demonstrated in
    patients, and no series compares early to late initiation. If the mechanistic account holds, the diet is
    not a generic anti-seizure measure here but a targeted metabolic bypass, which
    would argue for offering it at diagnosis rather than after conventional agents
    have failed - a materially different clinical posture from the one the current
    evidence supports.
  evidence:
  - reference: PMID:31766059
    reference_title: "Expanding Phenotypic Spectrum of Cerebral Aspartate-Glutamate Carrier Isoform 1 (AGC1) Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient's seizure frequency abated drastically following initiation of ketogenic diet."
    explanation: >-
      The single clinical observation on which the question rests.
  - reference: PMID:33087477
    reference_title: "βOHB Protective Pathways in Aralar-KO Neurons and Brain: An Alternative to Ketogenic Diet."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "OHB efficiently recovers aralar-KO neurons from deficits in basal-stimulated and glutamate-stimulated respiration, effects requiring βOHB entry into the neuron, and protects from glutamate excitotoxicity"
    explanation: >-
      The direct test of the proposed mechanism, which is what narrows this gap from
      "is the rationale even right" to "does it translate to patients". The
      requirement for βOHB entry into the neuron is what makes it a test of the
      metabolic-bypass account rather than of a generic effect.
  - reference: PMID:31403263
    reference_title: "Longitudinal MRI findings in patient with SLC25A12 pathogenic variants inform disease progression and classification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As utilization of pyruvate obviates the accumulation of NADH that occurs during glucose catabolism, the ability of pyruvate to rescue these deficits is suggestive of the importance of AGC1's role in NAD+/NADH cycling"
    explanation: >-
      The parallel metabolic-bypass result in model systems, which is the basis for
      the proposed mechanism of the diet.
  proposed_experiments:
  - experiment_id: exp_ketogenic_timing_registry
    name: Registry comparison of early versus late ketogenic diet initiation
    description: >-
      Assemble the reported and newly ascertained AGC1-deficient patients into a
      registry recording time from diagnosis to ketogenic diet initiation, seizure
      outcome, and developmental trajectory, and pair it with measurement of brain
      NAA and lactate on the diet, to test both whether earlier initiation improves
      outcome and whether the diet shifts the metabolic markers the mechanism
      predicts it should.

- discussion_id: mismatch_knockout_mouse_versus_hypomorphic_patients
  prompt: >-
    Does the complete aralar knockout mouse represent human AGC1 deficiency
    faithfully, given that reported patients retain measurable residual carrier
    activity and that the knockout cannot distinguish neuronal from glial origins of
    the glial phenotypes?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Astroglial Glutamine Synthesis
  - pathophysiology#Nigrostriatal Dopaminergic Dysfunction
  rationale: >-
    The knockout mouse is described as extensively recapitulating the human disease,
    and it is the source of most of what is curated here about the astroglial and
    dopaminergic arms. Two caveats limit how far that transfers. First, it is a
    complete null while human variants span from abolished activity to about 15% of
    wild type, so the model sits at the severe end of a range that patients occupy
    unevenly - and the p.Arg353Gln children were not obviously milder, which is
    itself unexplained. Second, and more consequentially for this entry, a
    constitutive whole-animal knockout removes aralar from every expressing cell at
    once, so it cannot in principle distinguish a glial defect secondary to neuronal
    dysfunction from a cell-autonomous one. That is exactly the distinction the
    hypomyelination controversy turns on, which means the model that supplies most of
    the mechanism is structurally unable to settle the disorder's central question.
  evidence:
  - reference: PMID:35008954
    reference_title: "AGC1 Deficiency: Pathology and Molecular and Cellular Mechanisms of the Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the aralar-KO mice model that extensively recapitulate the human disease"
    explanation: >-
      States the model's claimed fidelity, which is what the caveats qualify.
  - reference: PMID:24515575
    reference_title: "AGC1 Deficiency Causes Infantile Epilepsy, Abnormal Myelination, and Reduced N-Acetylaspartate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Recombinant mutant p.Arg353Gln AGC1 activity was reduced to 15% of wild type."
    explanation: >-
      Establishes that human genotypes retain residual activity the null does not.
  - reference: PMID:35008954
    reference_title: "AGC1 Deficiency: Pathology and Molecular and Cellular Mechanisms of the Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the deficits in myelin and Gln synthesis may be a consequence of neuronal affectation or a direct effect of AGC1/Aralar deficiency in glial cells"
    explanation: >-
      The question a constitutive whole-animal knockout cannot address, since it
      removes the carrier from all cell types simultaneously.
  proposed_experiments:
  - experiment_id: exp_hypomorphic_knockin_allelic_series_agc1
    name: Hypomorphic Slc25a12 knock-in series against the null
    description: >-
      Generate knock-in mice carrying the human p.Arg353Gln allele, which retains
      about 15% activity, alongside the existing null, and compare brain aspartate
      and NAA, myelination, astroglial glutamine synthesis, and seizure burden, to
      establish how much of the null phenotype requires complete loss and whether 15%
      residual activity is protective for any arm.


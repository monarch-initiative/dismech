genetic:
- name: SLC25A12
  association: Biallelic pathogenic variants
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    SLC25A12 (chromosome 2q31.1) encodes AGC1, also called aralar - the
    neuron-specific mitochondrial aspartate-glutamate carrier and the
    calcium-regulated component of the malate-aspartate shuttle. Reported pathogenic
    genotypes include the homozygous missense c.1058G>A p.Arg353Gln, which retains
    about 15% of wild-type activity, and the compound heterozygous pair c.1295C>T
    p.A432V with c.1447-2_1447-1delAG. The paralogue SLC25A13 encodes AGC2 (citrin),
    which is expressed in liver rather than brain, and its deficiency causes liver
    disease rather than this neurological phenotype.
  gene_term:
    preferred_term: SLC25A12
    term:
      id: hgnc:10982
      label: SLC25A12
  evidence:

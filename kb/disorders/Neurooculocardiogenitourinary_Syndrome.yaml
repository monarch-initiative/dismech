- name: Impaired Embryonic Development of Multiple Organs
  biological_scale: TISSUE
  description: >-
    The non-ocular malformations (cerebellar and other brain anomalies, septal
    and complex heart defects, renal dysplasia and cystic kidneys, other
    genitourinary anomalies, anal atresia, spinal anomalies, dysmorphic facial
    features) are congenital, and heterozygous missense wdr37 alleles impair
    growth and survival of zebrafish larvae. This node records that the
    variants disturb embryonic development; the organ-specific mechanisms are
    not known, and the edges from it to the individual malformations are
    inferred from their congenital nature rather than demonstrated.

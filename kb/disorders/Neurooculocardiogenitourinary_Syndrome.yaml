mechanistic_hypotheses:
- hypothesis_group_id: pacs_complex_dysfunction
  hypothesis_label: >-
    WDR37 variants act through the WDR37-PACS1-PACS2 complex
  status: EMERGING
  description: >-
    The clinical overlap with the PACS1 and PACS2 disorders and the mutual
    stabilisation of WDR37 and PACS1 suggest the variants act by disturbing the
    complex, possibly including its control of ER calcium release. Against a
    simple version of this, most tested WDR37 variants bind PACS1 and PACS2
    normally. Edges that depend on this hypothesis carry
    hypothesis_groups: [pacs_complex_dysfunction].
  evidence:
  - reference: PMID:34642815
    reference_title: "WDR37 syndrome: identification of a distinct new cluster of disease-associated variants and functional analyses of mutant proteins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The strong degree of phenotypic overlap as well as consistent evidence of interaction between WDR37 and PACS1/2 suggests that WDR37 may also be involved in protein transport and that the identified missense variants in these proteins disrupt their function through a dominant negative mechanism."
    explanation: The authors' proposal linking the WDR37 disorder to PACS-mediated transport.
discussions:
- discussion_id: nocgus_variant_mechanism
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Do NOCGUS variants act by a dominant-negative effect, by loss of function,
    or by some other route, and do the N-terminal and C-terminal clusters act
    the same way?
  attaches_to:
  - pathophysiology#Abnormal WDR37 Protein Function
  - genetic#WDR37
  rationale: >-
    The sources disagree. ClinGen reads the functional data as consistent with a
    dominant-negative mechanism, which rests on the zebrafish contrast between
    lethal heterozygous missense alleles and viable heterozygous frameshift
    alleles and on preserved dimerization of variant proteins. Orphanet
    annotates the gene association as loss of function, and the fly rescue
    experiment shows the patient alleles have lost function. The 2021
    functional study states the mechanism has not been established. The two
    clusters also behave differently in cells: N-terminal variant proteins are
    expressed normally and C-terminal variant proteins at reduced levels. No
    truncating allele has been reported as causal.
  evidence:
  - reference: PMID:34642815
    reference_title: "WDR37 syndrome: identification of a distinct new cluster of disease-associated variants and functional analyses of mutant proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although a dominant negative effect for the previously reported missense alleles has been suggested ( Kanca et al. 2019 ; Reis et al. 2019 ), the mechanism of action has not been established for either the previously reported or the novel variants reported here."
    explanation: The primary functional study leaves the mechanism open.
  - reference: CGGV:assertion_f3eaff9e-978b-47a6-ad55-88edabc62064-2024-10-18T160000.000Z
    reference_title: "WDR37 / neurooculocardiogenitourinary syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Functional studies are consistent with a dominant-negative mechanism of disease predominantly due to missense variants."
    explanation: ClinGen's reading of the functional data.
  - reference: ORPHA:684305
    reference_title: Neurooculocardiogenitourinary syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "WDR37 | WD repeat domain 37 | hgnc:31406 | Disease-causing germline mutation(s) (loss of function) in"
    explanation: Orphanet's gene-association qualifier, which differs from ClinGen's.
- discussion_id: nocgus_pacs_axis_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does a NOCGUS variant disturb PACS1 or PACS2 function, ER calcium handling
    or protein trafficking in neural or developing ocular cells?
  attaches_to:
  - pathophysiology#Altered WDR37-PACS1-PACS2 Complex Function
  - pathophysiology#Impaired ER Calcium Release
  rationale: >-
    The WDR37-PACS1 complex and its role in ER calcium release are shown with
    null alleles, in mouse lymphocytes and in C. elegans. No experiment cited
    here has put a NOCGUS variant into neurons or eye tissue and measured these
    processes, and no vertebrate knock-in of a human variant has been
    characterised for the eye, brain and heart malformations. Until then the
    mechanism nodes between the variant and the malformations are inferred.
  evidence:

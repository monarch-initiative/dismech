  modeled_mechanisms:
  - target: Impaired Embryonic Development of Multiple Organs
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Heterozygous missense alleles, as in patients, disturb vertebrate

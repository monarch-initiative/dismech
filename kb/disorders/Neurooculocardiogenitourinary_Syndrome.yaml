name: Neurooculocardiogenitourinary Syndrome
creation_date: "2026-11-05T18:53:03Z"
category: Mendelian
disease_term:
  preferred_term: neurooculocardiogenitourinary syndrome
  term:
    id: MONDO:0032850
    label: neurooculocardiogenitourinary syndrome
description: >-
  Neurooculocardiogenitourinary syndrome (NOCGUS, OMIM 618652) is an autosomal
  dominant multisystem developmental disorder caused by heterozygous, almost
  always de novo, variants in WDR37, which encodes a WD40-repeat protein of
  unknown function. It was delineated in 2019 by two independent groups. The
  original variants are missense changes clustered in a short conserved stretch
  upstream of the first WD40 repeat (p.Thr115 to p.Thr130); a second cluster in
  and between the second and third WD40 repeats and one intronic splice variant
  were reported later. Presentation is neonatal or infantile. The core is
  neurological (seizures, usually severe developmental delay and intellectual
  disability, often absent speech, cerebellar hypoplasia and other structural
  brain anomalies) together with structural eye anomalies (coloboma,
  microphthalmia, microcornea, Peters anomaly) and facial dysmorphism that has
  been compared with CHARGE syndrome. Congenital heart defects, genitourinary
  and renal anomalies, skeletal (mostly spinal) anomalies, sensorineural hearing
  loss, feeding difficulties and poor postnatal growth are variable; one
  individual in a founding series died in infancy, while a later series
  describes milder developmental delay. WDR37 binds the paralogous sorting
  proteins PACS1 and PACS2, whose own de novo missense disorders
  (Schuurs-Hoeijmakers syndrome and DEE66) overlap clinically with NOCGUS. How
  the variants act is not settled: a dominant-negative mechanism has been
  proposed from zebrafish and cell data and is ClinGen's reading, Orphanet
  annotates the association as loss of function, and the main functional study
  states that the mechanism has not been established.
synonyms:
- NOCGUS
- Neuro-oculo-cardio-genito-urinary syndrome
- WDR37 syndrome
- WDR37-related disorder
parents:
- Autosomal dominant syndromic intellectual disability
pathophysiology:
- name: De Novo Heterozygous WDR37 Variant
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion is a heterozygous WDR37 variant, arising de novo in
    every individual reported with a pathogenic or likely pathogenic call. The
    founding missense variants (p.Thr115Ile, p.Ser119Phe, p.Ser119Tyr,
    p.Thr125Ile, p.Ser129Cys, p.Thr130Ile) cluster upstream of the first WD40
    repeat. A second cluster lies in or just after the second WD40 repeat
    (p.Asp220Gly and p.Asp260Asn de novo; p.Pro257His inherited from an
    unaffected mother and of uncertain significance). One de novo intronic
    deletion (c.727-27_727-24del) causes retention of 63 intronic bases and an
    in-frame insertion of 21 amino acids. No truncating variant has been
    reported as causal.
  genes:
  - preferred_term: WDR37
    term:
      id: hgnc:31406
      label: WDR37
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
  downstream:
  - target: Abnormal WDR37 Protein Function
    causal_link_type: DIRECT
    description: >-
      The variant protein is made and correctly localized but fails to perform
      the function the wild-type protein provides in the fly rescue assay.
  evidence:
  - reference: PMID:31327510
    reference_title: De Novo Missense Variants in WDR37 Cause a Severe Multisystemic Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have discovered four de novo missense variants predicted to affect the N-terminal region of WDR37-p.Ser119Phe, p.Thr125Ile, p.Ser129Cys, and p.Thr130Ile-in unrelated individuals with a previously unrecognized syndrome"
    explanation: Founding report of the clustered N-terminal de novo missense variants.
  - reference: PMID:31327508
    reference_title: "De Novo Variants in WDR37 Are Associated with Epilepsy, Colobomas, Dysmorphism, Developmental Delay, Intellectual Disability, and Cerebellar Hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two probands shared one variant and the others have variants in nearby amino acids outside the WD40 repeats."
    explanation: Independent founding cohort with de novo variants clustered outside the WD40 repeats.
  - reference: PMID:32530092
    reference_title: Expanding the phenotypic spectrum consequent upon de novo WDR37 missense variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variants fall within a highly conserved region upstream of the WD-repeat domains, within an apparent mutation cluster."
    explanation: Two further de novo variants in the same N-terminal cluster.
  - reference: PMID:34642815
    reference_title: "WDR37 syndrome: identification of a distinct new cluster of disease-associated variants and functional analyses of mutant proteins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The novel alleles are C-terminal to the prior variants and located either within the second WD40 motif (c.659A>G p.(Asp220Gly)) or in a disordered protein region connecting the second and third WD40 motifs (c.778G>A p.(Asp260Asn) and c.770C>A p.(Pro257His))."
    explanation: Second, C-terminal variant cluster in individuals with overlapping phenotypes.
  - reference: PMID:38044197
    reference_title: Splicing variant of WDR37 in a case of Neurooculocardiogenitourinary syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reverse transcription polymerase chain reaction (RT-PCR) revealed intron retention of 63 base pairs before exon 10 in messenger RNA, which was predicted to insert 21 additional aberrant amino acids"
    explanation: The one reported non-missense variant is an in-frame splice change, not a truncating allele.
- name: Abnormal WDR37 Protein Function
  biological_scale: MOLECULAR
  description: >-
    The variant proteins reach the cytoplasm and still dimerize with wild-type
    WDR37. The N-terminal variants are expressed at levels similar to wild type,
    while the C-terminal variants are expressed at lower levels. Two human
    variants fail to rescue the Drosophila wdr37 null, so they impair function.
    In zebrafish, heterozygous missense alleles were lethal to larvae while
    heterozygous frameshift alleles were not, which suggested a dominant
    negative effect. Whether that is the mechanism in patients is open (see the
    discussion on variant mechanism). The only molecular activities shown for
    WDR37 are homodimerization and binding to PACS1 and PACS2; the
    homodimerization term is bound without a modifier because variant proteins
    still dimerize with wild type, so it names the activity, not a defect in it.
  genes:
  - preferred_term: WDR37
    term:
      id: hgnc:31406
      label: WDR37
  molecular_functions:
  - preferred_term: WDR37 homodimerization
    term:
      id: GO:0042803
      label: protein homodimerization activity
  downstream:
  - target: Impaired Ocular Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred. WDR37 variants and the variants of its PACS partners share
      coloboma, which has been read as a role for the axis in eye development;
      no study has followed a WDR37 variant into a developing eye.
    evidence:
    - reference: PMID:33369122
      reference_title: Coloboma may be a shared feature in a spectrum of disorders caused by mutations in the WDR37-PACS1-PACS2 axis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The present observation of coloboma as a shared feature among these three disorders suggests that this group of genes may be involved in ocular development."
      explanation: Clinical inference from shared coloboma that the WDR37-PACS1-PACS2 genes act in ocular development.
  - target: Impaired Embryonic Development of Multiple Organs
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Heterozygous missense wdr37 alleles impair growth and survival of zebrafish
      larvae; the organ-level steps between the protein defect and the human
      malformations are not known.
    evidence:
    - reference: PMID:31327510
      reference_title: De Novo Missense Variants in WDR37 Cause a Severe Multisystemic Syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Zebrafish carrying heterozygous missense variants demonstrated poor growth and larval lethality, while heterozygotes with frameshift alleles survived to adulthood"
      explanation: Heterozygous missense alleles disrupt vertebrate development in zebrafish.
  - target: Neuronal Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of the single fly ortholog causes a seizure-associated phenotype that
      human WDR37 rescues and the patient alleles do not.
    evidence:
    - reference: PMID:31327508
      reference_title: "De Novo Variants in WDR37 Are Associated with Epilepsy, Colobomas, Dysmorphism, Developmental Delay, Intellectual Disability, and Cerebellar Hypoplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These flies are homozygous viable but display severe bang sensitivity, a phenotype associated with seizures in flies."
      explanation: Fly null phenotype linking WDR37 function to neuronal excitability.
  - target: Upregulated Cholesterol Biosynthesis Gene Expression
    causal_link_type: UNKNOWN
    description: >-
      Transcriptomic finding in zebrafish embryos carrying a missense allele; its
      relation to the human phenotype is unknown.
  - target: Altered WDR37-PACS1-PACS2 Complex Function
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - pacs_complex_dysfunction
    description: >-
      Hypothesis. Most tested variants still bind PACS1 and PACS2 normally, so
      a defect at the level of the complex, if there is one, is not loss of
      binding.
  evidence:
  - reference: PMID:31327508
    reference_title: "De Novo Variants in WDR37 Are Associated with Epilepsy, Colobomas, Dysmorphism, Developmental Delay, Intellectual Disability, and Cerebellar Hypoplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The two variants found in three human subjects failed to rescue these phenotypes, suggesting that these alleles severely affect the function of this protein."
    explanation: Patient alleles fail to complement the fly null, showing the variant proteins are functionally impaired.
  - reference: PMID:31327510
    reference_title: De Novo Missense Variants in WDR37 Cause a Severe Multisystemic Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunocytochemistry and western blot studies showed that wild-type WDR37 is localized predominantly in the cytoplasm and mutant proteins demonstrate similar protein levels and localization."
    explanation: The N-terminal variant proteins are stable and correctly localized, so the defect is not simple loss of the protein.
  - reference: PMID:34642815
    reference_title: "WDR37 syndrome: identification of a distinct new cluster of disease-associated variants and functional analyses of mutant proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The three novel mutants showed normal cellular localization but lower expression levels in comparison to wild-type WDR37."
    explanation: The C-terminal variant proteins localize normally but are expressed at lower levels.
  - reference: PMID:34642815
    reference_title: "WDR37 syndrome: identification of a distinct new cluster of disease-associated variants and functional analyses of mutant proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "dimerization with wild-type WDR37 was not affected by any of the missense variants studied, supporting the possibility of a dominant negative effect"
    explanation: Variant proteins retain the ability to dimerize with wild type, which the authors read as compatible with a dominant negative effect.
  - reference: PMID:31327510
    reference_title: De Novo Missense Variants in WDR37 Cause a Severe Multisystemic Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Zebrafish carrying heterozygous missense variants demonstrated poor growth and larval lethality, while heterozygotes with frameshift alleles survived to adulthood, suggesting a potential dominant-negative mechanism for the missense variants."
    explanation: Allele-type contrast in zebrafish that underlies the dominant-negative proposal.
- name: Altered WDR37-PACS1-PACS2 Complex Function
  biological_scale: MOLECULAR
  description: >-
    Hypothesis node. WDR37's main binding partners are the phosphofurin acidic
    cluster sorting proteins PACS1 and PACS2, and WDR37 and PACS1 depend on each
    other for stable expression in cultured cells and in C. elegans. Of the
    seven WDR37 variants tested for binding, only p.Asp220Gly lost binding to
    PACS1 and PACS2. So the shared biology of the three disorders points at this
    complex, but no study has shown that a NOCGUS variant impairs complex
    function.
  genes:
  - preferred_term: PACS1
    term:
      id: hgnc:30032
      label: PACS1
  - preferred_term: PACS2
    term:
      id: hgnc:23794
      label: PACS2
  biological_processes:
  - preferred_term: intracellular protein transport
    term:
      id: GO:0006886
      label: intracellular protein transport
    modifier: ABNORMAL
  downstream:
  - target: Impaired ER Calcium Release
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - pacs_complex_dysfunction
    description: >-
      Shown only for deletion of Pacs1 or Wdr37 in mouse lymphocytes, not for a
      NOCGUS variant or in neural cells.
    evidence:
    - reference: PMID:33630350
      reference_title: Calcium flux control by Pacs1-Wdr37 promotes lymphocyte quiescence and lymphoproliferative diseases.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Deletion of Pacs1 or Wdr37 caused peripheral lymphopenia that was linked to blunted Ca2+ release from the ER after antigen receptor stimulation."
      explanation: Loss of either complex member blunts ER calcium release in mouse lymphocytes.
  evidence:
  - reference: PMID:34642815
    reference_title: "WDR37 syndrome: identification of a distinct new cluster of disease-associated variants and functional analyses of mutant proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This revealed the ability of WDR37 to form homodimers and to strongly bind PACS1 and PACS2 phosphofurin acidic cluster sorting proteins; immunocytochemistry confirmed colocalization of WDR37 with PACS1 and PACS2 in human cells."
    explanation: Establishes PACS1 and PACS2 as the major binding partners of WDR37.
  - reference: PMID:34642815
    reference_title: "WDR37 syndrome: identification of a distinct new cluster of disease-associated variants and functional analyses of mutant proteins."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Interaction with wild-type WDR37 was not affected for any variant; however, one novel mutant, p.(Asp220Gly), lost its ability to bind PACS1 and PACS2."
    explanation: >-
      Cuts against loss of PACS binding as a general mechanism: the other
      variants tested, including all four founding N-terminal variants, bound
      PACS1 and PACS2 normally.
  - reference: PMID:41279321
    reference_title: The Structural Basis for Pacs1-Wdr37 Complex Assembly and Stability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This interaction stabilizes Wdr37 and is critical for the expression of both proteins."
    explanation: >-
      Cryo-EM and biochemical study (a bioRxiv preprint indexed in PubMed)
      showing that the Pacs1-Wdr37 interaction is needed for both proteins'
      expression.
  - reference: PMID:39031646
    reference_title: PACS-1 variant protein is aberrantly localized in Caenorhabditis elegans model of PACS1/PACS2 syndromes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that cePACS-1 and ceWDR-37 colocalize to somatic cytoplasm of many types of cells and are mutually required for expression, supporting a conclusion that the intermolecular dependence of PACS1/PACS2/PACS-1 and WDR37/WDR-37 is evolutionarily conserved."
    explanation: The PACS-WDR37 mutual dependence is conserved in C. elegans.
- name: Impaired ER Calcium Release
  biological_scale: CELLULAR
  description: >-
    Mouse finding. In lymphocytes, Pacs1 and Wdr37 are needed for normal release
    of calcium from the endoplasmic reticulum after antigen receptor
    stimulation. No immune phenotype has been reported in NOCGUS, and ER calcium
    handling has not been measured in patient cells or in neurons carrying a
    NOCGUS variant, so this node is a lead for the mechanism, not part of the
    established chain.
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  biological_processes:

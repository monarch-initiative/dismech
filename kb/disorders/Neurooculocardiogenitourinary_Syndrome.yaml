    term:
      id: GO:0032469
      label: endoplasmic reticulum calcium ion homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33630350
    reference_title: Calcium flux control by Pacs1-Wdr37 promotes lymphocyte quiescence and lymphoproliferative diseases.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Through forward genetic screening in mice, we identified two members of a new complex, Pacs1 and Wdr37, which are required for normal ER Ca2+ handling in lymphocytes."
    explanation: Mouse genetics showing that the Pacs1-Wdr37 complex is required for ER calcium handling in lymphocytes.

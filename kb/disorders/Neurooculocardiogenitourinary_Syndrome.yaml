    reference_title: "WDR37 syndrome: identification of a distinct new cluster of disease-associated variants and functional analyses of mutant proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further work is needed to determine the role of PACS binding in the normal function of WDR37 and the mechanism of action for various pathogenic variants in WDR37."

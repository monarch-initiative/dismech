    - reference: PMID:31327510
      reference_title: De Novo Missense Variants in WDR37 Cause a Severe Multisystemic Syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "RNA-seq analysis of zebrafish embryos carrying a missense variant detected significant upregulation of cholesterol biosynthesis pathways."
      explanation: Transcriptomic readout in the missense model.

    explanation: Transcriptomic finding in the zebrafish missense model.
- name: Impaired Ocular Morphogenesis
  biological_scale: TISSUE
  description: >-
    Structural eye anomalies are the most consistent malformations: coloboma of
    the iris and retina, microphthalmia, microcornea, Peters anomaly and other
    anterior segment dysgenesis, and optic nerve hypoplasia, present from
    birth. The developmental step that WDR37 variants disturb has not been
    studied; the link is drawn from the congenital nature of the findings and
    the shared ocular phenotype of the WDR37, PACS1 and PACS2 disorders.
  biological_processes:
  - preferred_term: camera-type eye development
    term:
      id: GO:0043010
      label: camera-type eye development
    modifier: ABNORMAL

animal_models:
- name: Drosophila wdr37 (CG12333) null
  species: Fruit fly
  genotype: CG12333/wdr37 coding region replaced with GAL4, homozygous
  publication: PMID:31327508
  description: >-
    Homozygous null flies are viable but bang-sensitive, have reduced grip
    strength and lose grip during copulation. Human reference WDR37 rescues
    these phenotypes; two patient alleles do not.
  modeled_mechanisms:
  - target: Neuronal Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      A seizure-associated behavioural phenotype that patient alleles fail to
      rescue, linking the human variants to loss of a conserved neuronal
      function.
    limitations: >-
      The model is a homozygous null in an invertebrate, whereas patients are
      heterozygous for missense or in-frame variants; it cannot test a dominant
      negative effect and has no counterpart of the eye, heart or kidney
      malformations.
    evidence:
    - reference: PMID:31327508
      reference_title: "De Novo Variants in WDR37 Are Associated with Epilepsy, Colobomas, Dysmorphism, Developmental Delay, Intellectual Disability, and Cerebellar Hypoplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These flies are homozygous viable but display severe bang sensitivity, a phenotype associated with seizures in flies."
      explanation: The fly null phenotype that the model contributes.
- name: Zebrafish wdr37 CRISPR missense and frameshift alleles
  species: Zebrafish
  genotype: Heterozygous wdr37 missense (p.Ser129Phe, p.Ser129Cys, p.Ser129Tyr) or frameshift (p.Lys127Cysfs, p.Gln95Argfs) alleles
  publication: PMID:31327510
  description: >-
    Heterozygous missense alleles, including one matching the human
    p.Ser129Cys, caused poor growth and larval lethality, while heterozygous

notes: >-
  No GeneReviews chapter covers this disorder. No treatment study,
  natural-history study or management guideline was found, so the entry has no
  treatments section. The N-terminal and C-terminal variant clusters and the
  splice variant are curated as one disease rather than as subtypes: ClinGen
  includes all three in this disease, and the C-terminal series differs mainly
  in milder ocular involvement in three individuals, too few to establish a
  separate entity. Phenotype frequencies are not given because the published
  case table is small and no source states frequencies in prose.

inheritance:
- name: Autosomal Recessive
  description: >
    Biallelic COG4 variants. Reported genotypes include compound heterozygous
    missense plus deletion, compound heterozygous nonsense plus missense, and a
    homozygous founder splice variant. Notably, biallelic truncating genotypes may
    be non-viable, so surviving patients appear to retain residual COG4 function.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:42202558
    reference_title: "A splice-altering intronic variant in two multiplex families refines autosomal recessive COG4-related congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing identified the homozygous COG4 c.1647+5G>A variant in four
      affected individuals from two apparently unrelated Italian families.
    explanation: >-
      Documents homozygous inheritance of a single COG4 allele in four affected
      individuals across two families, establishing the recessive mode.
  - reference: PMID:28848061
    reference_title: "Hypothesis: lobe A (COG1-4)-CDG causes a more severe phenotype than lobe B (COG5-8)-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This represents a frequency gap which suggests that bi-allelic truncating
      mutations in COG lobe A genes might be non-viable.
    explanation: >-
      Supports the inference that surviving COG4-CDG patients retain residual
      function, which constrains which genotypes are seen.
prevalence:
- population: Worldwide, cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Six individuals reported before the 2026 series, which added four more from two
    Italian families sharing a founder haplotype. No population estimate exists.
    The founder effect means the reported count is not a random sample of the
    disease.
  evidence:
  - reference: PMID:42202558
    reference_title: "A splice-altering intronic variant in two multiplex families refines autosomal recessive COG4-related congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      COG4-CDG(ar) has been described in six individuals to date, and its clinical
      manifestations and disease mechanisms remain poorly understood.
    explanation: Gives the reported case count prior to that paper's own additions.
genetic:
- name: COG4
  notes: >
    COG4 (16q22.1) encodes a subunit of lobe A of the conserved oligomeric Golgi
    complex. Reported recessive alleles include p.R729W with a submicroscopic
    deletion in trans, the compound p.E233X and p.L773R pair, and a homozygous
    c.1647+5G>A founder splice variant that causes exon 12 skipping and a
    frameshift. The same gene causes Saul-Wilson syndrome through an entirely
    different mechanism: a single recurrent heterozygous de novo p.Gly516Arg
    substitution that leaves COG4 mRNA and protein levels intact.
  gene_term:
    preferred_term: COG4
    term:
      id: hgnc:18620
      label: COG4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:19494034
    reference_title: "Golgi function and dysfunction in the first COG4-deficient CDG type II patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a new CDG-II patient harbouring a p.R729W missense mutation in COG4
      combined with a submicroscopical deletion.
    explanation: >-
      The founding report identifying COG4 as the cause of this CDG subtype, and the
      genotype that established it.
  - reference: PMID:21185756
    reference_title: "Identification of the first COG-CDG patient of Indian origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present data identifying a previously reported CDG-IIx case from
      Singapore as a new COG4 patient with 2 novel mutations leading to p.E233X and
      p.L773R; with p.E233X being a de novo mutation.
    explanation: Adds a second independent genotype to the recessive allelic spectrum.
  - reference: PMID:42202558
    reference_title: "A splice-altering intronic variant in two multiplex families refines autosomal recessive COG4-related congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole transcriptome sequencing and reverse transcriptase PCR from peripheral
      blood detected an aberrant COG4 transcript which features skipping of exon 12
      and results in a frameshift, predicted to introduce a premature termination
      codon.
    explanation: >-
      Establishes the molecular consequence of the founder splice allele at the
      transcript level rather than by prediction alone.
pathophysiology:
- name: Reduced COG4 Expression and Destabilised Lobe A
  biological_scale: MOLECULAR
  description: >
    Biallelic COG4 variants reduce COG4 protein, and because lobe A subunits depend
    on one another, the loss propagates to the expression or stability of the other
    lobe A subunits. Full complex formation is still achieved but at a lower level,
    so the lesion is quantitative rather than an absolute failure to assemble.
  gene:
    preferred_term: COG4
    term:
      id: hgnc:18620
      label: COG4
  evidence:
  - reference: PMID:19494034
    reference_title: "Golgi function and dysfunction in the first COG4-deficient CDG type II patient."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The resulting downregulation of COG4 expression additionally affects expression
      or stability of other lobe A subunits.
    explanation: >-
      Establishes that the primary defect propagates across lobe A rather than being
      confined to COG4.
  - reference: PMID:21185756
    reference_title: "Identification of the first COG-CDG patient of Indian origin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      As a result, COG4 protein expression was dramatically reduced, while expression
      of the other subunits remained unaffected.
    explanation: >-
      An independent patient showing reduced COG4 protein. Cited alongside the result
      above because the two disagree on whether other subunits are affected, which is
      recorded rather than smoothed over.
  downstream:
  - target: Impaired Golgi Vesicle Tethering and Retrograde Transport
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19494034
      reference_title: "Golgi function and dysfunction in the first COG4-deficient CDG type II patient."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Moreover, our data indicate that subunits are present in a cytosolic pool and
        full complex formation assists tethering preceding membrane fusion.
      explanation: >-
        States the tethering function that reduced complex formation compromises.
- name: Impaired Golgi Vesicle Tethering and Retrograde Transport
  biological_scale: CELLULAR
  description: >
    Vesicle tethering during intra-Golgi and Golgi-to-ER retrograde transport is
    impaired, measurable in patient fibroblasts as a delay in Brefeldin A-induced
    retrograde transport. This is the shared cellular signature of COG deficiencies.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: intra-Golgi vesicle-mediated transport
    modifier: DECREASED
    term:
      id: GO:0006891
      label: intra-Golgi vesicle-mediated transport
  evidence:
  - reference: PMID:21185756
    reference_title: "Identification of the first COG-CDG patient of Indian origin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, patient fibroblasts exhibited a delay in Brefeldin A (BFA) induced
      retrograde transport, a common characteristic seen in COG deficiencies.
    explanation: >-
      The direct cell-based measurement of the transport delay in patient material.
  downstream:
  - target: Disrupted Golgi Glycosyltransferase Localisation
    causal_link_type: DIRECT
    description: >
      Retrograde transport is how Golgi enzymes are returned to their correct
      cisternae, so a tethering defect mislocalises them.
    evidence:
    - reference: PMID:19494034
      reference_title: "Golgi function and dysfunction in the first COG4-deficient CDG type II patient."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        All together our results indicate that intact COG complexes are required to
        maintain Golgi dynamics and its associated functions.
      explanation: >-
        States the dependence of Golgi function on intact COG complexes, the step this
        edge asserts.
- name: Disrupted Golgi Glycosyltransferase Localisation
  biological_scale: CELLULAR
  description: >
    With retrograde recycling impaired, the glycosyltransferases and glycosidases
    that should be retained in specific cisternae are mislocalised. The consequence
    is a processing defect affecting terminal steps in particular, which is why the
    glycan abnormality is deficient galactosylation and sialylation rather than a
    failure to build the core.
  biological_processes:
  - preferred_term: Golgi organization
    modifier: DECREASED
    term:
      id: GO:0007030
      label: Golgi organization
  evidence:
  - reference: PMID:19494034
    reference_title: "Golgi function and dysfunction in the first COG4-deficient CDG type II patient."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By extending this study to four other known COG-deficient patients, we now
      present the first comparative analysis on defects in transport, glycosylation
      and Golgi ultrastructure in these patients.
    explanation: >-
      Establishes that transport, glycosylation and Golgi structure were assessed
      together across COG-deficient patients including the COG4 case.
  downstream:
  - target: Combined N- and O-Glycosylation Defect
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21185756
      reference_title: "Identification of the first COG-CDG patient of Indian origin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Analysis of serum N-glycans revealed deficiencies in both sialylation and
        galactosylation.
      explanation: >-
        The measured terminal-processing defect that follows from enzyme
        mislocalisation.
- name: Combined N- and O-Glycosylation Defect
  biological_scale: ORGANISM
  description: >
    Both N- and O-linked glycosylation are affected, with deficient galactosylation
    and sialylation of serum glycoproteins. The combined pattern is what places the
    disorder in CDG type II and distinguishes COG defects from the assembly-step
    (type I) disorders.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  - preferred_term: protein O-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006493
      label: protein O-linked glycosylation
  evidence:
  - reference: PMID:21185756
    reference_title: "Identification of the first COG-CDG patient of Indian origin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, patient fibroblasts have impaired O-glycosylation.
    explanation: >-
      Establishes the O-linked arm alongside the N-linked defect, making the defect a
      combined one.
  - reference: PMID:42202558
    reference_title: "A splice-altering intronic variant in two multiplex families refines autosomal recessive COG4-related congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Matrix-assisted laser desorption/ionization time-of-flight mass spectrometry
      profiling of serum N-glycans showed mildly deficient galactosylation and
      sialylation, consistent with an impaired Golgi-mediated glycosylation.
    explanation: >-
      Independent mass-spectrometry confirmation of the terminal glycan defect in the
      founder-variant families.
  downstream:
  - target: Progressive Neurometabolic Multisystem Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      How a general glycosylation defect produces this particular organ pattern is
      not established, so the edge is drawn with unknown intermediates rather than
      given a mechanism the sources do not supply.
    evidence:
    - reference: PMID:42202558
      reference_title: "A splice-altering intronic variant in two multiplex families refines autosomal recessive COG4-related congenital disorder of glycosylation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These findings and literature review define COG4-CDG(ar) as a neurometabolic
        disorder with a progressive course leading to severe global disability,
        post-natal microcephaly with brain atrophy, seizures, coagulopathy, liver
        involvement, recurrent infections, and defective N-glycosylation of serum
        proteins.
      explanation: >-
        Ties the glycosylation defect and the clinical syndrome together in one
        statement, which is as far as the evidence goes.

genetic:
- name: COG4
  notes: >-
    Reported recessive genotypes include p.Arg729Trp with a deletion in trans, p.Glu233Ter with p.Leu773Arg,
    p.Glu419Ter with p.Cys314Tyr, and homozygous c.1647+5G>A. The latter causes exon 12 skipping in blood
    RNA, with a frameshift predicted to introduce a premature stop; this assay does not establish complete
    loss of protein in every tissue. The p.Arg729Trp substitution affects a structurally important C-terminal
    region. Dominant p.Gly516Arg causes the separate Saul-Wilson syndrome.
  gene_term:
    preferred_term: COG4
    term:
      id: hgnc:18620
      label: COG4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:19494034
    reference_title: Golgi function and dysfunction in the first COG4-deficient CDG type II patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report a new CDG-II patient harbouring a p.R729W missense mutation in COG4 combined with a submicroscopical deletion.
    explanation: The founding report identifying COG4 as the cause of this CDG subtype, and the genotype that established it.
  - reference: PMID:21185756
    reference_title: Identification of the first COG-CDG patient of Indian origin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we present data identifying a previously reported CDG-IIx case from Singapore as a new COG4 patient with 2 novel mutations leading to p.E233X and p.L773R; with p.E233X being a de novo mutation.
    explanation: Adds a second independent genotype to the recessive allelic spectrum.
  - reference: PMID:42202558
    reference_title: A splice-altering intronic variant in two multiplex families refines autosomal recessive COG4-related congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole transcriptome sequencing and reverse transcriptase PCR from peripheral blood detected an aberrant COG4 transcript which features skipping of exon 12 and results in a frameshift, predicted to introduce a premature termination codon.
    explanation: Establishes the molecular consequence of the founder splice allele at the transcript level rather than by prediction alone.
  - reference: PMID:34298581
    reference_title: Expanding the genotypes and phenotypes for 19 rare diseases by exome sequencing performed in pediatric intensive care unit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      For example, patient P21 was found compound heterozygous variants c.1255G>T (p.Glu419Ter) and c.941G>A
      (p.Cys314Tyr) in COG4.
    explanation: >-
      Adds a segregated nonsense/missense genotype in a child with severe multisystem disease.
  - reference: PMID:19651599
    reference_title: Structural basis for a human glycosylation disorder caused by mutation of the COG4 gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Arg 729 is found to occupy a key position at the center of a salt bridge network, thereby stabilizing
      Cog4's small C-terminal domain.
    explanation: >-
      Crystallographic evidence locates the residue altered by p.Arg729Trp; structural inference does
      not establish clinical severity.
pathophysiology:
- name: Biallelic COG4 dysfunction
  biological_scale: MOLECULAR
  gene:
    preferred_term: COG4
    term:
      id: hgnc:18620
      label: COG4
  description: >-
    Biallelic deleterious COG4 variants impair the function of this Golgi tethering-complex subunit. Alleles
    can reduce protein abundance or alter function while retaining complex assembly; the homozygous splice
    allele produces an aberrant transcript.

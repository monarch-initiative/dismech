  description: >-
    Homozygous splice-altering variant identified in four affected individuals from two Italian families.
    Blood transcriptome sequencing and RT-PCR demonstrated exon 12 skipping. The resulting frameshift
    predicts a premature termination codon; protein abundance and nonsense-mediated decay were not established
    by the quoted RNA result.

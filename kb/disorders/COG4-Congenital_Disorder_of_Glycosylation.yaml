diagnosis:
- name: Serum N-glycan mass spectrometry
  description: >-
    Serum N-glycan mass spectrometry can reveal deficient galactosylation and sialylation, as in the 2026
    families. A normal result does not exclude COG4-CDG: both transferrin and broader second-line N-glycosylation
    analyses were initially normal in two adult siblings.
  evidence:
  - reference: PMID:42202558
    reference_title: A splice-altering intronic variant in two multiplex families refines autosomal recessive COG4-related congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Matrix-assisted laser desorption/ionization time-of-flight mass spectrometry profiling of serum N-glycans showed mildly deficient galactosylation and sialylation, consistent with an impaired Golgi-mediated glycosylation.
    explanation: The glycan assay and the abnormality it detects in this disorder.
  - reference: PMID:34022244
    reference_title: 'Normal transferrin patterns in congenital disorders of glycosylation with Golgi homeostasis disruption: apolipoprotein C-III at the rescue!'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      All results of second-line N-glycosylation analyses were initially normal.
    explanation: >-
      Limits diagnostic sensitivity; an abnormal apoC-III O-glycan pattern provided additional evidence
      in the COG4 siblings.
- name: Serum IgG N-glycosylation analysis
  description: >-
    Serum IgG N-glycan abnormalities analogous to total serum findings were reported in the 2026 families.
    Diagnostic sensitivity, specificity and comparative accessibility were not established by that observation.
  evidence:
  - reference: PMID:42202558
    reference_title: A splice-altering intronic variant in two multiplex families refines autosomal recessive COG4-related congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As a novel finding, N-glycosylation study of serum IgG showed analogous N-glycan anomalies.
    explanation: Documents the IgG glycan finding as newly reported in this disorder.
- name: Serum transferrin isoelectric focusing
  description: >-
    Transferrin isoelectric focusing can show an abnormal type 2 pattern, as in the founding COG4 patient.
    Screening can also be normal in affected individuals and therefore cannot by itself exclude the disorder.
  evidence:
  - reference: PMID:19494034
    reference_title: Golgi function and dysfunction in the first COG4-deficient CDG type II patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Because CDG was suspected, isoelectric focusing of serum transferrin was performed and showed a type 2 pattern
    explanation: >-
      Documents an abnormal transferrin screen in the founding COG4-CDG patient.
  - reference: PMID:34022244
    reference_title: 'Normal transferrin patterns in congenital disorders of glycosylation with Golgi homeostasis disruption: apolipoprotein C-III at the rescue!'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: We identified three cases of congenital disorders of glycosylation (CDG) with Golgi homeostasis disruption, one ATP6V0A2-CDG and two COG4-CDG, with normal transferrin screening analyses.
    explanation: 'Graded REFUTE against the implicit claim that transferrin screening detects this disorder: the cited cases are COG4-CDG patients in whom it did not.'
- name: Apolipoprotein C-III two-dimensional electrophoresis
  description: >-
    Two-dimensional electrophoresis of mucin core 1 O-glycosylated apoC-III detected abnormal apoC-III0
    patterns in two COG4 siblings whose initial N-glycosylation analyses were normal. The result helped
    reclassify their homozygous COG4 variant as likely pathogenic; performance across all COG4 genotypes
    remains uncertain.
  evidence:
  - reference: PMID:34022244
    reference_title: 'Normal transferrin patterns in congenital disorders of glycosylation with Golgi homeostasis disruption: apolipoprotein C-III at the rescue!'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, apoC-III 2-DE revealed characteristic "apoC-III1" pattern in P1 and specific "apoC-III0" patterns in P2 and P3.
    explanation: Reports what the assay showed in the patients, including the two COG4-CDG cases, which is the claim this entry makes.
  - reference: PMID:34022244
    reference_title: 'Normal transferrin patterns in congenital disorders of glycosylation with Golgi homeostasis disruption: apolipoprotein C-III at the rescue!'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Furthermore, they show the potential of apoC-III 2-DE in diagnosing this type of CDG, with highly specific patterns in COG-CDG.
    explanation: States the diagnostic value of the assay in COG-CDG specifically.
- name: COG4 molecular and RNA analysis
  description: >-
    Identify biallelic COG4 variants through sequencing with deletion analysis where indicated, and assess
    segregation. RNA studies can resolve splice consequences. Biochemical evidence can support interpretation
    of uncertain variants even with normal transferrin screening.
  evidence:
  - reference: PMID:19494034
    reference_title: Golgi function and dysfunction in the first COG4-deficient CDG type II patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      We report a new CDG-II patient harbouring a p.R729W missense mutation in COG4 combined with a submicroscopical
      deletion.
    explanation: >-
      A deletion in trans to a sequence variant shows why a negative second sequence allele does not exhaust
      molecular testing.
  - reference: PMID:42202558
    reference_title: A splice-altering intronic variant in two multiplex families refines autosomal recessive COG4-related congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Whole transcriptome sequencing and reverse transcriptase PCR from peripheral blood detected an aberrant
      COG4 transcript which features skipping of exon 12 and results in a frameshift, predicted to introduce
      a premature termination codon.
    explanation: >-
      RNA studies demonstrated aberrant splicing after exome identification of the intronic variant.
  - reference: PMID:34022244
    reference_title: 'Normal transferrin patterns in congenital disorders of glycosylation with Golgi homeostasis disruption: apolipoprotein C-III at the rescue!'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      In P2 and P3, this allowed reclassifying the variant as likely pathogenic according to ACMG guidelines.
    explanation: >-
      In context, abnormal apoC-III patterns supported interpretation of the homozygous COG4 variant.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1332/
    reference_title: Congenital Disorders of N-Linked Glycosylation and Multiple Pathway Overview – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: >-
      If previous biochemical testing is not diagnostic for or suggestive of a particular CDG, molecular
      testing approaches most often involve use of a ... multigene panel ... or ... more ... comprehensive
      ... genomic ... testing
    explanation: >-
      Historical group-level diagnostic guidance, supported here by the COG4-specific exome and RNA studies.
differential_diagnoses:
- name: Saul-Wilson syndrome (COG4, dominant)
  description: >-
    Saul-Wilson syndrome is a skeletal dysplasia with primordial dwarfism caused by recurrent heterozygous
    de novo p.Gly516Arg. Patient fibroblasts showed preserved COG4 abundance and accelerated retrograde
    recycling, contrasting with the reduced abundance and delayed recycling documented in recessive COG4-CDG
    fibroblasts.
  evidence:
  - reference: PMID:30290151
    reference_title: A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All affected subjects harbored heterozygous de novo variants in COG4, giving rise to the same recurrent amino acid substitution (p.Gly516Arg).
    explanation: Establishes the dominant, single-recurrent-allele genetics that separate Saul-Wilson from recessive COG4-CDG.
  - reference: PMID:30290151
    reference_title: A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Affected individuals' fibroblasts, whose COG4 mRNA and protein were not decreased, exhibited delayed anterograde vesicular trafficking from the ER to the Golgi and accelerated retrograde vesicular recycling from the Golgi to the ER.
    explanation: 'The mechanistic contrast that carries the lump/split argument: normal COG4 levels and accelerated rather than delayed retrograde transport.'
- name: Lobe B COG-CDG (COG5-8)
  description: >-
    Other COG-subunit disorders share trafficking and glycosylation abnormalities and require gene-specific
    molecular diagnosis. A historical lobe A versus lobe B severity hypothesis compared mutation classes
    and residual expression; it does not establish that every lobe B disorder is milder or provide individual
    COG4 prognosis.
  evidence:
  - reference: PMID:28848061
    reference_title: 'Hypothesis: lobe A (COG1-4)-CDG causes a more severe phenotype than lobe B (COG5-8)-CDG.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Second, nearly all of the 27 patients with lobe B COG-CDG had bi-allelic truncating mutations, as compared with only one of the six patients with lobe A COG-CDG.
    explanation: >-
      Historical comparison of mutation classes across COG disorders, not a validated individual severity
      prediction.
    quote_role: REVIEW_SYNTHESIS
discussions:
- discussion_id: cog4cdg_glycan_to_organ_gap
  kind: KNOWLEDGE_GAP
  prompt: Which glycoproteins and tissue processes connect COG4 dysfunction to neurological and hepatic disease?
  attaches_to:
  - pathophysiology#Biallelic COG4 dysfunction
  - pathophysiology#Abnormal N-glycan processing
  - pathophysiology#Abnormal O-glycan processing
  rationale: >-
    Clinical outcome edges have unknown intermediates. Mild or initially normal serum N-glycan assays
    can accompany severe disease, and the cited studies do not identify a single glycoprotein lesion explaining
    the organ pattern.
- discussion_id: cog4cdg_conflicting_subunit_effects
  kind: KNOWLEDGE_GAP
  prompt: How do genotype and cellular background determine COG-complex abundance and Golgi morphology?
  attaches_to:
  - pathophysiology#Reduced COG4 Expression
  - pathophysiology#Altered Golgi ultrastructure
  rationale: >-
    The two founding patient-cell studies differ in effects on other COG subunits. Engineered p.Arg729Trp
    cells retain normal COG4 levels and Golgi morphology. These observations may reflect allele dosage,
    expression system or cellular background; they do not establish a universal isolated quantitative
    lesion.
- discussion_id: cog4cdg_autophagy_hypothesis
  kind: KNOWLEDGE_GAP
  prompt: Does altered autophagy contribute to recessive COG4-CDG?
  attaches_to:
  - pathophysiology#Biallelic COG4 dysfunction
  rationale: >-
    A pooled all-COG-CDG phenotype study proposed an autophagy connection to episodic fever. It did not
    demonstrate reduced autophagic flux or a fever mechanism in COG4 patients. Pooled phenotype frequencies
    and specificity rankings cannot establish COG4-specific rates.
  evidence:
  - reference: PMID:31804708
    reference_title: 'Hypothesis: determining phenotypic specificity facilitates understanding of pathophysiology in rare genetic disorders.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      The links between episodic fever and autophagy, and autophagy and the COG complex suggest that episodic
      fever in COG‐CDG patients, unlike other COG‐CDG phenotypic features caused by the disrupted glycosylation
      process, might be caused by disruption of its function in the autophagy pathway. The veracity of
      this hypothesis remains to be further elucidated.
    explanation: >-
      The authors explicitly identify the autophagy-fever account as an unresolved hypothesis.
- discussion_id: cog4cdg_residual_function
  kind: KNOWLEDGE_GAP
  prompt: How much residual COG4 function is required for survival?
  attaches_to:
  - pathophysiology#Biallelic COG4 dysfunction
  rationale: >-
    A historical lobe A mutation-spectrum analysis proposed that near-total loss might be nonviable. The
    later homozygous splice variant produces a frameshifted transcript, but the available RNA result does
    not quantify residual functional protein. Neither study establishes complete-null human viability
    or a general prognostic rule.
  evidence:
  - reference: PMID:28848061
    reference_title: 'Hypothesis: lobe A (COG1-4)-CDG causes a more severe phenotype than lobe B (COG5-8)-CDG.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: >-
      This represents a frequency gap which suggests that bi-allelic truncating mutations in COG lobe
      A genes might be non-viable.
    explanation: >-
      Mutation-spectrum hypothesis across lobe A genes; not a direct COG4 viability experiment.
  - reference: PMID:42202558
    reference_title: A splice-altering intronic variant in two multiplex families refines autosomal recessive COG4-related congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Whole transcriptome sequencing and reverse transcriptase PCR from peripheral blood detected an aberrant
      COG4 transcript which features skipping of exon 12 and results in a frameshift, predicted to introduce
      a premature termination codon.
    explanation: >-
      Measured aberrant transcript with predicted premature stop, without a cited protein-null assay.

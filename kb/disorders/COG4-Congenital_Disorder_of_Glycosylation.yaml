inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic COG4 variants cause the recessive disorder. Reported configurations include missense/deletion,
    nonsense/missense and homozygous splice-altering genotypes. A de novo allele can occur as one member
    of a recessive compound-heterozygous genotype; this differs from the dominant p.Gly516Arg mechanism
    of Saul-Wilson syndrome. When both parents carry a pathogenic recessive allele, standard Mendelian
    counseling gives each pregnancy a 25% affected, 50% carrier and 25% unaffected noncarrier probability.
    This assumes confirmed parental carrier status; the reported de novo compound-heterozygous configuration
    requires family-specific assessment.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:42202558
    reference_title: A splice-altering intronic variant in two multiplex families refines autosomal recessive COG4-related congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Exome sequencing identified the homozygous COG4 c.1647+5G>A variant in four affected individuals from two apparently unrelated Italian families.
    explanation: Documents homozygous inheritance of a single COG4 allele in four affected individuals across two families, establishing the recessive mode.
  - reference: PMID:34298581
    reference_title: Expanding the genotypes and phenotypes for 19 rare diseases by exome sequencing performed in pediatric intensive care unit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      The first variant was inherited from her father, and the second was inherited from her mother.
    explanation: >-
      The preceding case description identifies COG4 p.Glu419Ter and p.Cys314Tyr in patient P21, with
      segregation establishing opposite parental origins.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1332/
    reference_title: Congenital Disorders of N-Linked Glycosylation and Multiple Pathway Overview – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: >-
      At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance
      of being an asymptomatic ... carrier ... and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      General autosomal-recessive counseling from the retired overview, applicable to COG4 families when
      both parents are carriers; not an unconditional recurrence estimate for a de novo allele.

      COG4 transcript which features skipping of exon 12 and results in a frameshift, predicted to introduce
      a premature termination codon.
    explanation: >-
      Separates the measured blood RNA splice defect from the predicted coding consequence.
animal_models:
- species: Danio rerio
  genotype: cog4 b1312 homozygous null
  description: >-
    The b1312 allele is a 13-base-pair exon 12 deletion with a frameshift and premature stop. Null larvae
    showed delayed epithelial projection growth and reduced extracellular-matrix secretion during semicircular-canal
    development. This gene-loss model probes Cog4 function; its ear phenotype does not establish hearing
    impairment in recessive human COG4-CDG.
  modeled_mechanisms:
  - target: Biallelic COG4 dysfunction
    relationship: PERTURBS
    model_scale: ORGANISM
    limitations: >-
      Complete zebrafish gene loss differs from residual-function human alleles. The study examines ear
      morphogenesis and does not reproduce or quantify the human multisystem phenotype.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: Larval inner-ear developmental readouts do not establish the neurological and hepatic course of human COG4-CDG.
    evidence:
    - reference: PMID:30287385
      reference_title: Cog4 is required for protrusion and extension of the epithelium in the developing semicircular canals.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      directness: DIRECT
      snippet: >-
        The cog4b1312 allele is a 13 bp deletion in exon 12 of cog4. The mutation introduces a frameshift
        followed by an early stop codon (Ferreira et al., in press).
      explanation: >-
        Defines the gene-loss perturbation used in the developmental study.
  evidence:
  - reference: PMID:30287385
    reference_title: Cog4 is required for protrusion and extension of the epithelium in the developing semicircular canals.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Here, we show that formation of the pillars is delayed and that secretion of extracellular matrix
      components (ECM) is impaired in cog4-/- mutants.
    explanation: >-
      Direct developmental observations in null zebrafish.

experimental_models:
- name: COG4-CDG patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  description: >-
    Primary fibroblasts from the founding compound-heterozygous patients model COG4 protein abundance,
    BFA-induced retrograde trafficking and glycan biosynthesis. Wild-type COG4 viral complementation did
    not restore a normal BFA response in the tested patient cells. Increasing COG4 expression also impaired
    the BFA response in control fibroblasts in the founding study.
  modeled_mechanisms:
  - target: Delayed Golgi retrograde transport
    relationship: RECAPITULATES
    model_scale: CELLULAR
    fidelity: MODERATE
    limitations: >-
      BFA redistributes Golgi proteins pharmacologically; the assay does not isolate every physiological
      tethering or fusion step, and fibroblasts do not establish organ-specific mechanisms.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Cultured cells lack the neuronal, hepatic and systemic context required to explain the clinical
        disorder.
    evidence:
    - reference: PMID:21185756
      reference_title: Identification of the first COG-CDG patient of Indian origin.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: >-
        Importantly, patient fibroblasts exhibited a delay in Brefeldin A (BFA) induced retrograde transport,
        a common characteristic seen in COG deficiencies.
      explanation: >-
        Direct patient-cell transport readout.
  - target: Abnormal O-glycan processing
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    fidelity: MODERATE
    limitations: >-
      GAP is an artificial acceptor of glycan biosynthesis; products mimic glycan chains but do not enumerate
      native glycoprotein substrates.
    evidence:
    - reference: PMID:21185756
      reference_title: Identification of the first COG-CDG patient of Indian origin.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: >-
        HPLC analysis of purified, metabolically labeled, GAP molecules from patient fibroblasts revealed
        an increase in Galβ1,3GalNAc as well as Core1 monosialylated structures, with a decrease in extended
        Core2 based glycans.
      explanation: >-
        Patient-derived biosynthetic-capacity readout.
  evidence:
  - reference: PMID:21185756
    reference_title: Identification of the first COG-CDG patient of Indian origin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      To our surprise transduction of patient fibroblasts with the wild-type COG4 did not restore the
      normal BFA response even using various viral titers or infection times.
    explanation: >-
      Failed complementation is an experimental limitation, not evidence of an effective gene therapy.
  - reference: PMID:19494034
    reference_title: Golgi function and dysfunction in the first COG4-deficient CDG type II patient.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Surprisingly, stable transduction of control cells with COG4 (thereby doubling expression levels)
      resulted in a retrograde trafficking defect, reminiscent of that observed in patient cells.
    explanation: >-
      Increasing COG4 expression impaired the control-cell trafficking assay, limiting a simple dosage-rescue
      interpretation.
- name: COG4-knockout RPE1 and HEK293T cells complemented with p.Arg729Trp
  experimental_model_type: CELL_LINE
  description: >-
    CRISPR COG4 knockouts were complemented by lentiviral myc-tagged wild-type or mutant COG4 under a
    cloned COG4 promoter. The p.Arg729Trp constructs restored many knockout abnormalities while retaining
    an N-glycosylation defect. These are complemented knockout backgrounds, not endogenous-locus patient-genotype
    knock-ins.
  modeled_mechanisms:
  - target: Abnormal N-glycan processing
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      p.Arg729Trp cells show increased GNL binding consistent with abnormal N-glycosylation.
    limitations: >-
      Tagged constructs in engineered non-patient backgrounds; lectin binding is a glycan-class readout
      and does not reproduce every serum glycan or clinical phenotype.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Cultured cells lack the neuronal, hepatic and systemic context required to explain the clinical
        disorder.
    evidence:
    - reference: PMID:34603392
      reference_title: Development and Initial Characterization of Cellular Models for COG Complex-Related CDG-II Diseases.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: >-
        In contrast, binding of GNL to plasma membrane of non-permeabilized cells was increased in both
        mutant cell lines, but most significantly in cells expressing COG4-R729W (Figures 6A,B, Supplementary
        Figure S3B).
      explanation: >-
        Direct lectin readout in engineered p.Arg729Trp cells.
  - target: Altered Golgi ultrastructure
    relationship: FAILS_TO_RECAPITULATE
    model_scale: CELLULAR
    limitations: >-
      Normal Golgi stack morphology in these engineered point-mutant cells contrasts with patient-fibroblast
      disruption.
    evidence:
    - reference: PMID:34603392
      reference_title: Development and Initial Characterization of Cellular Models for COG Complex-Related CDG-II Diseases.
      supports: REFUTE
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: >-
        The analysis revealed the Golgi stacks morphology and integrity were normal in all analyzed cell
        lines (Figure 4).
      explanation: >-
        Negative morphology result prevents treating this model as reproducing all patient-cell defects.
  evidence:
  - reference: PMID:34603392
    reference_title: Development and Initial Characterization of Cellular Models for COG Complex-Related CDG-II Diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using a combination of CRISPR/Cas9 and lentiviral transduction technologies, both myc-tagged wild-type and mutant (G516R and R729W) COG4 proteins were expressed under the endogenous COG4 promoter.
    explanation: >-
      Documents knockout plus lentiviral complementation with promoter-controlled constructs; it does
      not by itself exclude expression-system artifacts.
  - reference: PMID:34603392
    reference_title: Development and Initial Characterization of Cellular Models for COG Complex-Related CDG-II Diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Expression of wild-type and mutant COG4 rescued stability and glycosylation of all three tested
      proteins (Figure 2A, Supplementary Figure S1A).
    explanation: >-
      The proteins are B4GalT1, Lamp2 and TMEM165 in the preceding experimental description.
  - reference: PMID:34603392
    reference_title: Development and Initial Characterization of Cellular Models for COG Complex-Related CDG-II Diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      This result indicates the investigated COG4 mutations do not significantly affect GS15 localization

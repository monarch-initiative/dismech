name: COG4-Congenital Disorder of Glycosylation
creation_date: '2026-09-06T15:45:00Z'
category: Mendelian
description: >
  COG4-CDG (CDG-IIj) is an autosomal recessive type II congenital disorder of
  glycosylation caused by biallelic loss-of-function variants in COG4, a subunit
  of lobe A of the conserved oligomeric Golgi complex. The COG complex tethers
  vesicles during intra-Golgi and Golgi-to-ER retrograde transport, which is how
  the Golgi keeps its resident glycosyltransferases in the right cisternae. Losing
  that tethering does not disable any single glycosylation enzyme; it lets the
  enzymes drift, and the result is a combined N- and O-glycosylation defect with
  deficient galactosylation and sialylation.

  Clinically it is a progressive neurometabolic disorder: severe global
  disability, secondary microcephaly with brain atrophy, seizures, coagulopathy,
  liver involvement and recurrent infections. Roughly six to ten patients have
  been reported.

  The entry's central curation decision is that this is a different disease from
  Saul-Wilson syndrome, which is also caused by COG4 and is already curated
  separately. The argument is mechanistic and is set out in the differential and
  the notes: COG4-CDG is biallelic loss of function with reduced COG4 protein and
  delayed retrograde transport, while Saul-Wilson is a single recurrent
  heterozygous de novo allele with normal COG4 protein and accelerated retrograde
  recycling. They are not two severities of one lesion; they run in opposite
  directions.
synonyms:
- COG4-CDG
- CDG-IIj
- CDG IIj
- congenital disorder of glycosylation, type IIj
- carbohydrate deficient glycoprotein syndrome type IIj
- COG4-CDG(ar)
- autosomal recessive COG4-related congenital disorder of glycosylation

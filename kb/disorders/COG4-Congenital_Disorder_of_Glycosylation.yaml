name: COG4-Congenital Disorder of Glycosylation
creation_date: '2026-09-06T15:45:00Z'
category: Mendelian
description: >-
  COG4-CDG (CDG-IIj) is an autosomal recessive congenital disorder of glycosylation caused by biallelic
  deleterious COG4 variants. COG4 is a lobe A subunit of the conserved oligomeric Golgi complex involved
  in retrograde vesicle trafficking. Patient fibroblasts can show reduced COG4 abundance, delayed retrograde
  transport and altered Golgi morphology. Abnormal N- and O-glycan processing is reported, although transferrin
  and broader N-glycan screens can be normal in affected individuals. The clinical spectrum includes developmental
  impairment, postnatal microcephaly, brain atrophy, seizures, hypotonia, coagulopathy, liver disease
  and recurrent infections. A progressive course and severe disability are described, with survival ranging
  from early childhood deaths to adulthood. The recessive disorder is distinct from dominant COG4-related
  Saul-Wilson syndrome caused by p.Gly516Arg.
synonyms:
- COG4-CDG
- CDG-IIj
- CDG IIj
- congenital disorder of glycosylation, type IIj
- carbohydrate deficient glycoprotein syndrome type IIj
- COG4-CDG(ar)
- autosomal recessive COG4-related congenital disorder of glycosylation

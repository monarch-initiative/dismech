diagnosis:
- name: Serum N-glycan mass spectrometry
  description: >
    MALDI-TOF profiling of serum N-glycans shows deficient galactosylation and
    sialylation. This matters as a diagnostic route because transferrin isoelectric
    focusing, the traditional CDG screen, can be falsely normal in COG4-CDG.
  evidence:
  - reference: PMID:42202558
    reference_title: "A splice-altering intronic variant in two multiplex families refines autosomal recessive COG4-related congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Matrix-assisted laser desorption/ionization time-of-flight mass spectrometry
      profiling of serum N-glycans showed mildly deficient galactosylation and
      sialylation, consistent with an impaired Golgi-mediated glycosylation.
    explanation: The glycan assay and the abnormality it detects in this disorder.
- name: Serum IgG N-glycosylation analysis
  description: >
    IgG N-glycan analysis shows the same anomalies as total serum N-glycans,
    reported as a novel finding and a potentially more accessible assay.
  evidence:
  - reference: PMID:42202558
    reference_title: "A splice-altering intronic variant in two multiplex families refines autosomal recessive COG4-related congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As a novel finding, N-glycosylation study of serum IgG showed analogous
      N-glycan anomalies.
    explanation: Documents the IgG glycan finding as newly reported in this disorder.
differential_diagnoses:
- name: Saul-Wilson syndrome (COG4, dominant)
  description: >
    The critical differential, because it is the same gene. Saul-Wilson is a
    primordial dwarfism with preserved-to-mildly-affected intellect, caused by a
    single recurrent heterozygous de novo p.Gly516Arg substitution. Its cells have
    normal COG4 mRNA and protein and show accelerated retrograde recycling, the
    opposite direction of transport change to the delay seen in COG4-CDG. The two
    are separate diseases sharing a locus, not two severities of one lesion, which
    is why they are curated as separate entries.
  evidence:
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected subjects harbored heterozygous de novo variants in COG4, giving
      rise to the same recurrent amino acid substitution (p.Gly516Arg).
    explanation: >-
      Establishes the dominant, single-recurrent-allele genetics that separate
      Saul-Wilson from recessive COG4-CDG.
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Affected individuals' fibroblasts, whose COG4 mRNA and protein were not
      decreased, exhibited delayed anterograde vesicular trafficking from the ER to
      the Golgi and accelerated retrograde vesicular recycling from the Golgi to the
      ER.
    explanation: >-
      The mechanistic contrast that carries the lump/split argument: normal COG4
      levels and accelerated rather than delayed retrograde transport.
- name: Lobe B COG-CDG (COG5-8)
  description: >
    The other COG subunit deficiencies. Lobe B defects tolerate biallelic
    truncating mutations and are reported to run milder, which is the basis for
    treating lobe A membership as prognostically meaningful.
  evidence:
  - reference: PMID:28848061
    reference_title: "Hypothesis: lobe A (COG1-4)-CDG causes a more severe phenotype than lobe B (COG5-8)-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Second, nearly all of the 27 patients with lobe B COG-CDG had bi-allelic
      truncating mutations, as compared with only one of the six patients with lobe A
      COG-CDG.
    explanation: >-
      Quantifies the genotype difference between the lobes that underlies the
      severity contrast.
discussions:
- discussion_id: cog4cdg_glycan_to_organ_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does a general deficit in terminal galactosylation and sialylation produce
    this specific organ pattern of brain atrophy, coagulopathy and liver disease?
  attaches_to:
  - pathophysiology#Combined N- and O-Glycosylation Defect
  - pathophysiology#Progressive Neurometabolic Multisystem Disease
  rationale: >
    The edge from the glycosylation defect to the clinical syndrome is drawn with
    unknown intermediates because that is the honest state of the evidence. Nothing
    cited identifies which glycoproteins are functionally compromised, and the
    glycan abnormality is described as mild even in severely affected patients. The
    coagulopathy is the one arm with an obvious candidate mechanism, since
    coagulation factors are heavily glycosylated, but no study cited here
    demonstrates it. The largest series states plainly that disease mechanisms
    remain poorly understood.
- discussion_id: cog4cdg_conflicting_subunit_effects
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does loss of COG4 destabilise the other lobe A subunits, or is COG4 protein
    reduced in isolation?
  attaches_to:
  - pathophysiology#Reduced COG4 Expression and Destabilised Lobe A
  rationale: >
    The two patient studies disagree. The founding report finds that downregulated
    COG4 additionally affects expression or stability of other lobe A subunits;
    the Indian-origin patient report finds COG4 protein dramatically reduced while
    the other subunits remained unaffected. Both are cited on this node rather than
    one being selected, because the disagreement may reflect genuine allele-specific
    behaviour (a missense-plus-deletion genotype against a nonsense-plus-missense
    one) rather than a technical discrepancy. Resolving it would need the two
    genotypes assayed side by side.
treatments:
- name: Supportive and multidisciplinary care
  description: >
    No disease-modifying therapy exists. Management is anticonvulsant treatment,
    nutritional support, monitoring and correction of coagulopathy, and management
    of intercurrent infection.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Deliberately carries no evidence item. No trial, cohort or case series of any
    intervention in COG4-CDG was identified in the sources cited here. The
    components listed are standard measures inferred from the phenotype, and citing
    a general CDG management statement would attribute to this disorder a
    therapeutic claim made about a heterogeneous group.
notes: >
  On the lump/split decision, which is the thing to review first. COG4 causes two
  diseases and one of them, Saul-Wilson syndrome, is already curated as
  Saul-Wilson_Syndrome.yaml. This entry treats COG4-CDG as separate rather than
  folding it in as a subtype. The argument is mechanistic rather than clinical:
  Saul-Wilson is a single recurrent heterozygous de novo p.Gly516Arg allele whose
  cells have normal COG4 mRNA and protein and show accelerated retrograde recycling
  (PMID:30290151), while COG4-CDG is biallelic loss of function with reduced COG4
  protein and delayed retrograde transport (PMID:21185756). The transport phenotypes
  run in opposite directions, so these are not two points on one severity axis. The
  clinical pictures also barely overlap: primordial dwarfism with largely preserved
  intellect against a progressive neurometabolic disorder with brain atrophy and
  seizures. If a reviewer disagrees, the alternative is a shared COG4 entry with
  has_subtypes, and that should be settled before anything else.

  On a disagreement left standing. The two patient reports differ on whether
  reduced COG4 destabilises the other lobe A subunits. Both are cited on the same
  node with a discussion recording the conflict, rather than selecting whichever is
  more convenient. They studied different genotypes, so the disagreement may be
  real.

  On the weakest link. The edge from the glycosylation defect to the clinical
  syndrome is INDIRECT_UNKNOWN_INTERMEDIATES. Nothing cited identifies which
  glycoproteins are functionally compromised, and the glycan abnormality is
  described as mild even in severely affected patients. Giving that edge a
  mechanism would have meant inventing one.

  On one citation's scope. The episodic fever phenotype is evidenced from a study
  of all 45 reported COG-CDG patients across subunits, not COG4 specifically. That
  is recorded in the evidence explanation so the scope is not silently widened to a
  COG4 claim.

  On what is deliberately absent. No datasets: no COG4-CDG-specific omics dataset
  was identified, and a COG4 gene-symbol search returns the Saul-Wilson and general
  Golgi-trafficking literature. No animal models: the deep-research report noted a
  C. elegans knock-in that does not reproduce the Golgi defect, which is a negative
  result about a model rather than a model of this disease, and no vertebrate model
  of the recessive disorder was found in the cited sources.

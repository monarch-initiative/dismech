    explanation: The authors' own statement that the evidence is not yet sufficient.
- name: Hantavax (formalin-inactivated Hantaan virus vaccine)
  description: >-
    A formalin-inactivated, rodent-brain-derived Hantaan virus vaccine
    (Hantavax, Korea Green Cross) is licensed and commercially available in

    reference_title: "Hemorrhagic Fever with Renal Syndrome: Literature Review, Epidemiology, Clinical Picture and Pathogenesis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hantavax (Korea Green Cross, Seoul, Korea), a formalin-inactivated HTNV

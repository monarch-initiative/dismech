- name: Rodent exposure reduction and One Health prevention
  description: >-
    With no globally available vaccine — Hantavax is licensed only in Korea and
    its protection is short-lived — and no established antiviral, prevention
    turns on reducing contact with rodent reservoirs and their aerosolised
    excreta, on surveillance, and on integrated One Health strategies spanning
    the rodent, environmental, and human compartments.

pathophysiology:
- name: Aerosol exposure and Old World hantavirus inoculation
  biological_scale: ORGANISM
  description: >-
    Inhalation of aerosolised rodent excreta delivers Old World
    orthohantaviruses to the human host, initiating a systemic infection whose
    principal target is the vascular endothelium rather than any single organ
    parenchyma.
  downstream:
  - target: Beta3 integrin-mediated viral entry into endothelium, platelets, and macrophages
    description: Inoculated virions engage beta3 integrins on the cells that determine leak physiology.
    causal_link_type: DIRECT
  biological_processes:
  - preferred_term: viral process
    modifier: ABNORMAL
    term:
      id: GO:0016032
      label: viral process
  evidence:
  - reference: PMID:36851775
    reference_title: "Hemorrhagic Fever with Renal Syndrome in Asia: History, Pathogenesis, Diagnosis, Treatment, and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This zoonotic infection is the result of exposure to the
      virus-contaminated aerosols.
    explanation: Supports aerosol exposure as the initiating event.
- name: Beta3 integrin-mediated viral entry into endothelium, platelets, and macrophages
  biological_scale: MOLECULAR
  description: >-
    Cellular entry of the HFRS-causing hantaviruses Hantaan, Seoul, and Puumala
    is facilitated by alphavbeta3 and alphaIIbbeta3 integrins. Because beta3
    integrins are displayed on endothelial cells, platelets, and macrophages,
    and because they themselves regulate vascular permeability and platelet
    function, receptor choice places the virus directly on the two cell types
    whose failure defines the syndrome.
  downstream:
  - target: Noncytopathic microvascular endothelial infection
    description: Integrin engagement delivers virus into the microvascular endothelium.
    causal_link_type: DIRECT
  - target: Acute thrombocytopenia and platelet dysfunction
    description: >-
      Beta3 integrin usage places the virus on platelets, coupling receptor
      tropism to the platelet loss that accompanies vascular leak.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: receptor-mediated virion attachment to host cell
    modifier: INCREASED
    term:
      id: GO:0046813
      label: receptor-mediated virion attachment to host cell
  evidence:
  - reference: PMID:10196290
    reference_title: Cellular entry of hantaviruses which cause hemorrhagic fever with renal syndrome is mediated by beta3 integrins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Infection of human umbilical vein endothelial cells and Vero E6 cells by
      the HFRS-causing hantaviruses Hantaan (HTN), Seoul (SEO), and Puumala
      (PUU) is inhibited by antibodies to alphavbeta3 integrins and by the
      integrin ligand vitronectin.
    explanation: >-
      Directly demonstrates beta3 integrin dependence for the three main HFRS
      agents in human endothelial cells.
  - reference: PMID:10196290
    reference_title: Cellular entry of hantaviruses which cause hemorrhagic fever with renal syndrome is mediated by beta3 integrins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Since beta3 integrins regulate vascular permeability and platelet
      function, these findings also correlate beta3 integrin usage with common
      elements of hantavirus pathogenesis.
    explanation: >-
      Links the receptor to the two downstream nodes of this pathograph, vascular
      permeability and platelet dysfunction.
- name: Noncytopathic microvascular endothelial infection
  biological_scale: CELLULAR
  description: >-
    Hantaviruses replicate to high levels in microvascular endothelial cells
    without producing a cytopathic effect. This is the central mechanistic
    constraint on the disease: because the endothelium is not killed, the
    ensuing microvascular leak must be explained by dysregulated signalling
    rather than by structural destruction of the barrier.
  downstream:
  - target: Cytokine amplification and IL-6 trans-signaling
    description: Infected endothelium drives an amplifying inflammatory cytokine programme.
    causal_link_type: DIRECT
  - target: VEGF-driven VE-cadherin destabilisation of endothelial adherens junctions
    description: Infection raises secreted VEGF and lowers junctional VE-cadherin.
    causal_link_type: DIRECT
    hypothesis_groups:
    - vegf_ve_cadherin_model
  - target: Factor XII-dependent kallikrein-kinin activation and bradykinin release
    description: The infected endothelial surface promotes FXII binding and autoactivation.
    causal_link_type: DIRECT
    hypothesis_groups:
    - kallikrein_kinin_model
  - target: Cytotoxic T cell attack on antigen-presenting endothelium
    description: >-
      Infected endothelium presents viral antigen and becomes a target of the
      hantavirus-specific cytotoxic T cell response.
    causal_link_type: DIRECT
    hypothesis_groups:
    - t_cell_immunopathogenesis_model
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: viral process
    modifier: INCREASED
    term:
      id: GO:0016032
      label: viral process
  evidence:
  - reference: PMID:20810734
    reference_title: Andes virus disrupts the endothelial cell barrier by induction of vascular endothelial growth factor and downregulation of VE-cadherin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      High levels of virus replication occur in microvascular endothelial cells
      but without a virus-induced cytopathic effect.
    explanation: >-
      States the noncytopathic high-replication phenotype that constrains all
      downstream mechanistic models. The framing of this paper covers both HPS
      and HFRS, though its experiments used the HPS-associated Andes virus.
  - reference: PMID:10196290
    reference_title: Cellular entry of hantaviruses which cause hemorrhagic fever with renal syndrome is mediated by beta3 integrins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Hantaviruses replicate primarily in the vascular endothelium and cause two
      human diseases, hemorrhagic fever with renal syndrome (HFRS) and
      hantavirus pulmonary syndrome (HPS).
    explanation: Establishes the vascular endothelium as the primary replication site in HFRS.
- name: Cytokine amplification and IL-6 trans-signaling
  biological_scale: CELLULAR
  description: >-
    Infected endothelium amplifies an inflammatory cytokine programme. In
    primary human endothelial cells, soluble IL-6 receptor (trans-signaling)
    treatment of infected cells increased IL-6 and CCL2 secretion, upregulated
    ICAM-1, and disrupted VE-cadherin and barrier integrity; Puumala-infected
    HFRS patients showed a shifted sIL-6R/sgp130 ratio consistent with enhanced
    trans-signaling potential, which tracked with clinical severity.
  downstream:
  - target: Increased vascular permeability and capillary leak
    description: Cytokine-driven endothelial activation degrades barrier function.
    causal_link_type: DIRECT
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: interleukin-6-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0070102
      label: interleukin-6-mediated signaling pathway
  - preferred_term: cytokine-mediated signaling pathway
    modifier: INCREASED

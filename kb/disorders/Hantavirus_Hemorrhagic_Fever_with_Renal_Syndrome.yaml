- name: Intravenous ribavirin
  description: >-
    In a 1991 placebo-controlled randomised trial of 242 patients in China,
    intravenous ribavirin reduced adjusted mortality sevenfold and reduced the
    risk of entering the oliguric phase and of haemorrhage, at the cost of a
    reversible anaemia. Contemporary reviews nevertheless still state that no
    specific effective antiviral treatment is available, and the same drug
    failed in cardiopulmonary-stage HCPS, so its place in current practice is
    unsettled.
  treatment_term:
    preferred_term: antiviral therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: ribavirin
      term:
        id: CHEBI:63580
        label: ribavirin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Noncytopathic microvascular endothelial infection
    treatment_effect: INHIBITS
    description: >-
      Ribavirin is a nucleoside analogue acting on viral replication, so its
      mechanistic join point is the infected endothelium rather than the
      downstream renal lesion. Consistent with acting upstream, it reduced the
      risk of entering the oliguric phase in the 1991 randomised trial; that
      clinical outcome is captured in target_phenotypes (Oliguria).
  target_phenotypes:
  - preferred_term: Oliguria

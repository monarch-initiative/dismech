    reference_title: Prospective, double-blind, concurrent, placebo-controlled clinical trial of intravenous ribavirin therapy of hemorrhagic fever with renal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ribavirin therapy also resulted in a significant reduction in the risk of
      entering the oliguric phase and experiencing hemorrhage.
    explanation: >-
      The randomised evidence that ribavirin reduces progression to the oliguric
      phase and to haemorrhage.
  - reference: PMID:1683355
    reference_title: Prospective, double-blind, concurrent, placebo-controlled clinical trial of intravenous ribavirin therapy of hemorrhagic fever with renal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The only ribavirin-related side effect was a well-recognized, fully

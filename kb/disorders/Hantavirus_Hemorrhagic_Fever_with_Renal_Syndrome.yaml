differential_diagnoses:
- name: Hantavirus pulmonary syndrome
  description: >-
    The New World counterpart, caused by Sin Nombre, Andes, and related viruses
    in the Americas. It shares the endothelial target and the
    leak-plus-thrombocytopenia physiology but centres on noncardiogenic
    pulmonary oedema and cardiogenic shock rather than acute kidney injury, and
    Andes virus is additionally capable of person-to-person transmission.
  disease_term:
    preferred_term: hantavirus pulmonary syndrome
    term:
      id: MONDO:0017879
      label: hantavirus pulmonary syndrome
  distinguishing_features:
  - Geography - Americas rather than Asia and Europe
  - Organ of failure - noncardiogenic pulmonary oedema rather than oliguric acute kidney injury
  - Person-to-person transmissibility of Andes virus, which has no HFRS counterpart
  evidence:
  - reference: PMID:37105214
    reference_title: "Hantavirus in humans: a review of clinical aspects and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main clinical syndromes associated with hantaviruses are haemorrhagic
      fever with renal syndrome (HFRS), which is endemic in Europe and Asia, and
      hantavirus cardiopulmonary syndrome (HCPS), which is endemic in the
      Americas.
    explanation: Establishes the geographic and syndromic split between the two entities.
  - reference: PMID:37105214
    reference_title: "Hantavirus in humans: a review of clinical aspects and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HCPS and HFRS are separate clinical entities, but they share several
      features and have many overlapping symptoms, signs, and pathogenic
      alterations.
    explanation: >-
      Confirms that the two are separate clinical entities, which is why dismech
      models them as distinct disease entries rather than one blended graph.
notes: >-
  Scope. This entry covers the Old World, renal arm of human orthohantavirus
  disease (MONDO:0005784) and is the deliberate sibling of the existing
  Hantavirus Pulmonary Syndrome entry (MONDO:0017879). The two are curated as
  separate entries because the source literature treats them as separate
  clinical entities with different agents, geography, and organ of failure,
  while acknowledging extensive mechanistic overlap at the endothelium.

  Evidence provenance. Several mechanistic nodes rest on experiments performed
  with the HPS-associated Andes virus (notably the VEGF/VE-cadherin work) or in
  cell systems rather than in HFRS patients. Those items carry IN_VITRO
  evidence_source and the model-fidelity concern is recorded explicitly as a
  HUMAN_MODEL_MISMATCH discussion rather than being smoothed over in prose.

  Two snippets quote typographical errors present in the published abstracts
  (HRFS for HFRS in PMID:36851775, Apodernus agraricus for Apodemus agrarius in
  PMID:35384417). They are quoted verbatim so that reference validation succeeds
  against the cached text; the corrected forms appear in the surrounding
  descriptions.

  Prevalence records report absolute annual case counts because that is what the
  source states; no rate_per_100000 or prevalence_class is asserted, since
  converting counts to a population rate would require a denominator the source
  does not supply.

  Not yet curated. Histopathology (acute tubulointerstitial nephritis with
  medullary haemorrhage) and HLA-linked genetic susceptibility are documented in
  the literature and are natural next additions. Differential diagnoses beyond
  hantavirus pulmonary syndrome (leptospirosis, dengue, other viral haemorrhagic
  fevers) are clinically standard but are not stated in any reference cached in
  this entry, so they are deferred rather than asserted without a quotable
  source.

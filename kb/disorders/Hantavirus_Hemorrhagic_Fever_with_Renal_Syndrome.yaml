transmission:
- name: Aerosolised rodent excreta exposure
  description: >-
    Human infection is accidental and follows inhalation of aerosols generated
    from virus-contaminated rodent urine, faeces, or saliva. Unlike Andes
    virus in the Americas, the Old World HFRS agents are not known to spread
    person to person.
  evidence:
  - reference: PMID:35384417
    reference_title: "Hemorrhagic Fever with Renal Syndrome: Literature Review, Epidemiology, Clinical Picture and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infection in humans is typically accidental and occurs when
      virus-containing rodent excretions such as urine, feces, or saliva are
      aerosolized.
    explanation: Describes the aerosol route of acquisition.
  - reference: PMID:37105214
    reference_title: "Hantavirus in humans: a review of clinical aspects and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transmission to humans occurs by exposure to infected rodents in endemic
      areas; however, Andes hantavirus is unique in that it can be transmitted
      from person to person.
    explanation: >-
      Confirms rodent exposure as the transmission route and marks
      person-to-person spread as unique to Andes virus, i.e. not an HFRS agent.
- name: Urban and pet/feeder-rat exposure to Seoul virus
  description: >-
    Seoul virus circulates in domesticated rat populations and has produced
    human HFRS cases in the USA, United Kingdom, France, and the Netherlands
    linked to pet or feeder rats, extending the exposure setting from rural
    fieldwork to urban households and the rodent trade.
  evidence:
  - reference: PMID:33801789
    reference_title: Seoul Virus in Pet and Feeder Rats in The Netherlands.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent human SEOV cases described in the USA, United Kingdom, France and
      the Netherlands were associated with contact with pet or feeder rats.
    explanation: Documents the pet/feeder-rat exposure route for human SEOV disease.
  - reference: PMID:33801789
    reference_title: Seoul Virus in Pet and Feeder Rats in The Netherlands.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In all three investigated groups, RT-qPCR-positive rats were found: in
      1/29 rats from private owners (3.6%), 2/56 rats from ratteries (3.4%) and
      11/90 rats from commercial breeders (12.2%).
    explanation: Quantifies SEOV carriage across domesticated rat populations.
  - reference: PMID:42430118
    reference_title: "Hantavirus infections in a changing world: epidemiology, pathogenesis, and one health challenges."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Particular attention is given to the emerging global epidemiology of Seoul
      virus (SEOV), an urban-associated hantavirus linked to brown rats and pet
      rodents.
    explanation: >-
      The 2026 review that triggered this entry frames SEOV as an
      urban-associated, pet-rodent-linked emerging exposure pattern.
progression:
- phase: Febrile phase
  age_range: Any age after exposure
  notes: >-
    HFRS classically runs through five consecutive but frequently overlapping
    clinical phases. The first is an abrupt febrile illness with headache,
    myalgia, abdominal or flank pain, and gastrointestinal symptoms.
  evidence:
  - reference: PMID:1683355
    reference_title: Prospective, double-blind, concurrent, placebo-controlled clinical trial of intravenous ribavirin therapy of hemorrhagic fever with renal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HFRS typically consists of five consecutive but frequently overlapping
      clinical phases.
    explanation: Establishes the canonical five-phase clinical course of HFRS.
- phase: Hypotensive phase
  age_range: Acute illness, typically days 4-7
  notes: >-
    Capillary leak causes plasma extravasation, haemoconcentration, and
    hypotension that may progress to shock, coinciding with the nadir of the
    platelet count.
  evidence:
  - reference: PMID:24750436
    reference_title: Hantavirus infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The central phenomena behind the pathogenesis of both HFRS and HCPS are
      increased vascular permeability and acute thrombocytopenia.
    explanation: >-
      Supports the leak-and-thrombocytopenia physiology underlying the
      hypotensive phase.
- phase: Oliguric phase
  age_range: Acute illness, typically days 6-12
  notes: >-
    Acute kidney injury with falling urine output is the defining stage of
    HFRS. Entry into the oliguric phase, along with haemorrhage, is one of the
    two features that tracked with clinical severity in the placebo arm of the
    Chinese ribavirin trial.
  evidence:
  - reference: PMID:1683355
    reference_title: Prospective, double-blind, concurrent, placebo-controlled clinical trial of intravenous ribavirin therapy of hemorrhagic fever with renal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only occurrence of oliguric phase and hemorrhage was associated with
      severity of clinical disease in the placebo group.
    explanation: >-
      Identifies the oliguric phase as a severity marker in a placebo-controlled
      HFRS cohort.
- phase: Polyuric (diuretic) phase
  age_range: Recovery, typically after day 10
  notes: >-
    Renal recovery is heralded by a diuretic phase with large urine volumes and
    a risk of dehydration and electrolyte loss.
  evidence:
  - reference: PMID:15011467
    reference_title: '[Clinical picture of hemorrhagic fever with renal syndrome in Croatia].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The oliguric stage is followed by the polyuric stage which can last for
      up to two weeks, and is characterized by excretion of a large quantity of
      urine of low specific gravity (up to 15 liters during 24 hours).
    explanation: >-
      Directly supports the timing, duration, and high urine output of the
      polyuric recovery phase.
- phase: Convalescent phase
  age_range: Weeks to months after acute illness
  notes: >-
    Most patients recover renal function. Pituitary involvement can complicate
    recovery from Puumala virus HFRS, although late-onset hypopituitarism was
    not observed in long-term follow-up of a Finnish cohort.
  evidence:
  - reference: PMID:26202013
    reference_title: Long-term hormonal follow-up after human Puumala hantavirus infection.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of our patients had developed obvious late-onset hypopituitarism
      despite of the fact that pituitary gland can be affected during acute NE.
    explanation: >-
      Supports pituitary involvement during acute disease while explicitly not
      supporting late-onset hypopituitarism as a routine sequela.

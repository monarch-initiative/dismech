mechanistic_hypotheses:
- hypothesis_group_id: vegf_ve_cadherin_model
  hypothesis_label: VEGF hypersensitisation and VE-cadherin degradation open the barrier
  status: CANONICAL
  description: >-
    The most widely cited explanation of hantavirus vascular leak: infection
    raises secreted VEGF and hypersensitises the endothelium to it, VEGF-R2
    engagement dissociates from and internalises VE-cadherin, and the adherens
    junction is dismantled without cell death. Blocking VEGF-R2 prevents the
    VE-cadherin loss. It is curated as CANONICAL because it is the dominant
    published model, not because it is unchallenged; the direct experimental
    challenge is recorded on the node and in the kallikrein-kinin alternative.
  evidence:
  - reference: PMID:20810734
    reference_title: Andes virus disrupts the endothelial cell barrier by induction of vascular endothelial growth factor and downregulation of VE-cadherin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data implicate virus induction of VEGF and reduction in VE-cadherin
      in the endothelial cell permeability seen in HPS and suggest potential
      immunotherapeutic targets for the treatment of the disease.
    explanation: The authors' own statement of the model.
- hypothesis_group_id: kallikrein_kinin_model
  hypothesis_label: Factor XII-dependent kallikrein-kinin activation and bradykinin drive the leak
  status: ALTERNATIVE
  description: >-
    An alternative proximal mechanism proposed after the VEGF model failed to
    reproduce in a three-dimensional endothelial/smooth-muscle vessel model.
    FXII binds and autoactivates on the infected endothelial surface, generating
    kallikrein activity and liberating bradykinin, which increases permeability;
    the effect is abolished by blocking bradykinin binding, FXIIa, or
    kallikrein. Its clinical corollary is that a bradykinin B2 receptor
    antagonist should help, which a single severe Puumala case report supports.
  evidence:
  - reference: PMID:23874198
    reference_title: Endothelial cell permeability during hantavirus infection involves factor XII-dependent increased activation of the kallikrein-kinin system.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we present evidence for a novel mechanism of hantavirus-induced
      vascular leakage involving activation of the plasma kallikrein-kinin system
      (KKS).
    explanation: The authors' statement of the alternative model.
- hypothesis_group_id: t_cell_immunopathogenesis_model
  hypothesis_label: Hantavirus-specific cytotoxic T cells attacking infected endothelium cause the leak
  status: ALTERNATIVE
  description: >-
    An immunopathological model in which capillary permeability results from
    cytotoxic T cells attacking endothelial cells presenting viral antigen.
    Curated as ALTERNATIVE rather than EMERGING because it is long-standing, and
    not as CANONICAL because its supporting clinical correlation is
    direction-inconsistent between HFRS and HCPS.
  evidence:
  - reference: PMID:21994770
    reference_title: T cells and pathogenesis of hantavirus cardiopulmonary syndrome and hemorrhagic fever with renal syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These seemingly contradictory findings may suggest delicate balance in T
      cell responses between protection and immunopathogenesis. Both too strong
      and too weak T cell responses may lead to severe disease.
    explanation: >-
      The review's own summary of why the T cell model cannot currently be
      promoted above the endothelial-signalling models.
discussions:
- discussion_id: hfrs_leak_mechanism_competing_models
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Which proximal mechanism actually opens the endothelial barrier in HFRS -
    VEGF-driven VE-cadherin degradation, factor XII-dependent kallikrein-kinin
    activation with bradykinin release, or cytotoxic T cell attack on
    antigen-presenting endothelium - and are they sequential, parallel, or
    artefacts of different model systems?
  attaches_to:
  - pathophysiology#VEGF-driven VE-cadherin destabilisation of endothelial adherens junctions
  - pathophysiology#Factor XII-dependent kallikrein-kinin activation and bradykinin release
  - pathophysiology#Cytotoxic T cell attack on antigen-presenting endothelium
  - pathophysiology#Increased vascular permeability and capillary leak
  rationale: >-
    The three models are not merely underdetermined, they are in direct
    experimental tension. The VEGF/VE-cadherin model rests on infected
    endothelial monolayers; in a co-cultured endothelial/smooth-muscle vessel
    model, infected vessels retained integrity and showed no VE-cadherin
    degradation despite viral replication and the presence of VEGF, which is
    what motivated the kallikrein-kinin proposal. The T cell model has clinical
    correlations that run in opposite directions in HFRS and HCPS. The choice
    matters therapeutically: the models nominate anti-VEGF/VEGF-R2 blockade, a
    bradykinin B2 antagonist, and immunosuppression respectively - three
    interventions that are not interchangeable, and one of which
    (immunosuppression) could be harmful if the T cell response is protective.
  proposed_experiments:
  - experiment_id: exp_hfrs_leak_model_head_to_head_3d_vessel
    name: Head-to-head test of the VEGF and kallikrein-kinin leak models in a three-dimensional vessel using an HFRS agent
    description: >-
      Run the VEGF/VE-cadherin and kallikrein-kinin readouts side by side in the
      same co-cultured endothelial/smooth-muscle vessel model, infected with an
      HFRS-causing agent (Hantaan or Puumala) rather than the HPS-associated
      Andes virus, so that virus identity and model dimensionality stop being
      confounded with each other. Measure secreted VEGF, junctional VE-cadherin,
      FXIIa/kallikrein activity, liberated bradykinin, and barrier impedance in
      the same wells.
    decision_criterion: >-
      If VE-cadherin degrades in the three-dimensional vessel with an Old World
      agent, the earlier negative result was virus-specific rather than
      model-specific; if bradykinin liberation but not VE-cadherin loss tracks
      the impedance fall, the kallikrein-kinin model is the better account of
      HFRS leak.
  - experiment_id: exp_hfrs_serial_leak_biomarkers_patient_cohort
    name: Serial plasma leak-mediator profiling across the five clinical phases of HFRS
    description: >-
      Measure plasma bradykinin, cleaved high-molecular-weight kininogen, VEGF,
      and soluble VE-cadherin serially in the same HFRS patient cohort, sampled
      by clinical phase, and test which mediator's rise precedes the onset of
      measured capillary leak and haemoconcentration.
    decision_criterion: >-
      The mediator whose rise consistently precedes rather than follows the leak
      onset is the candidate proximal driver in humans; a mediator that rises
      only after leak is established is downstream or epiphenomenal.
  - experiment_id: exp_hfrs_bradykinin_antagonist_rct
    name: Randomised trial of a bradykinin B2 receptor antagonist in severe HFRS
    description: >-
      Run an adequately powered randomised controlled trial of icatibant or an
      equivalent bradykinin B2 receptor antagonist in severe HFRS, with capillary
      leak and progression to the oliguric phase as primary endpoints. This is
      the interventional test that the existing single case report cannot
      provide.
    decision_criterion: >-
      A reduction in leak and in oliguric-phase entry would confirm the
      kallikrein-kinin arm as causal and therapeutically actionable in humans; a
      null result would leave the mechanism as an in-vitro finding without
      clinical reach.
  evidence:
  - reference: PMID:23874198
    reference_title: Endothelial cell permeability during hantavirus infection involves factor XII-dependent increased activation of the kallikrein-kinin system.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast to results obtained in monolayers of cultured EC, we found that
      despite viral replication in both cell types as well as the presence of
      VEGF, infected in vitro vessels neither lost integrity nor displayed
      evidence of VE-cadherin degradation.
    explanation: The direct experimental statement of the tension between the two endothelial-signalling models.
- discussion_id: hfrs_vegf_evidence_from_new_world_virus
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the VEGF/VE-cadherin leak mechanism, demonstrated with the
    HPS-associated Andes virus in human lung endothelial cells, actually operate
    in the Old World HFRS agents and in the renal microvasculature they injure?
  attaches_to:
  - pathophysiology#VEGF-driven VE-cadherin destabilisation of endothelial adherens junctions
  rationale: >-
    The canonical VEGF/VE-cadherin evidence in this entry is generated with
    Andes virus - a New World, HCPS-causing agent - in primary human lung
    endothelial cells. HFRS is caused by different viruses and its defining organ
    injury is renal, not pulmonary. Old and New World hantaviruses are known to
    differ in cell tropism, so importing the mechanism wholesale risks asserting
    a lung-derived, HPS-derived model as HFRS pathophysiology. This is a
    model-fidelity question rather than an absence of evidence: the experiments
    exist and are sound, but their translational reach to HFRS is the open
    question.
  proposed_experiments:
  - experiment_id: exp_hfrs_vegf_in_renal_microvascular_endothelium
    name: VEGF induction and VE-cadherin loss in human renal microvascular endothelium infected with Old World hantaviruses
    description: >-
      Repeat the VEGF induction and VE-cadherin degradation measurements in
      primary human renal microvascular endothelial cells infected with Hantaan
      and Puumala virus, and compare them head to head with Andes virus in the
      same system, so that virus origin and vascular bed are varied
      independently.
    decision_criterion: >-
      Reproduction of VEGF induction and VE-cadherin loss with Old World agents
      in renal endothelium would license the mechanism for HFRS; failure would
      require the entry to demote this node to an HPS-specific model.
  evidence:
  - reference: PMID:40857262
    reference_title: Differential tropisms of old and new world hantaviruses influence virulence and developing host-directed antiviral candidates.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SNV readily infected pulmonary endothelial cells, while HTNV robustly
      amplified in endothelial cells, cardiomyocytes, and astrocytes.
    explanation: >-
      Demonstrates that Old and New World hantaviruses differ in cell tropism,
      which is why an Andes-virus-derived mechanism cannot simply be assumed to
      hold for the HFRS agents.
- discussion_id: hfrs_ribavirin_efficacy_and_treatment_window
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is intravenous ribavirin genuinely effective in HFRS, and if so within what
    window - given that the single supporting randomised trial is from 1991 in
    China and that the same drug failed in cardiopulmonary-stage HCPS?
  attaches_to:
  - pathophysiology#Acute kidney injury with oliguric renal failure
  rationale: >-
    HFRS is unusual among viral haemorrhagic fevers in having a positive
    placebo-controlled antiviral trial: intravenous ribavirin reduced mortality
    sevenfold after adjustment and reduced the risk of entering the oliguric
    phase. But that trial was conducted in 1991 in a single country, the effect
    estimate is adjusted rather than crude, and a later randomised trial of the
    same drug in the cardiopulmonary stage of the New World syndrome found no
    trend towards benefit. Contemporary reviews continue to state that no
    specific effective antiviral treatment is available, so the field has not
    absorbed the 1991 result as practice-changing. Whether the discrepancy is
    about the drug, the syndrome, or the timing of administration is unresolved
    and directly determines whether an HFRS patient should be offered ribavirin.
  proposed_experiments:
  - experiment_id: exp_hfrs_ribavirin_phase_stratified_rct
    name: Modern phase-stratified randomised trial of intravenous ribavirin in HFRS
    description: >-
      Conduct a multicentre randomised trial of intravenous ribavirin in HFRS
      stratified by clinical phase at enrolment (febrile versus hypotensive
      versus oliguric), against contemporary supportive care including renal
      replacement therapy, to test whether the 1991 benefit is real and whether
      it is confined to an early treatment window.
    decision_criterion: >-
      Benefit confined to febrile-phase enrolment would reconcile the positive
      1991 HFRS trial with the negative cardiopulmonary-stage HCPS trial as a
      treatment-window effect rather than a syndrome difference; a uniformly null
      result would retire ribavirin for HFRS.
  evidence:
  - reference: PMID:1683355
    reference_title: Prospective, double-blind, concurrent, placebo-controlled clinical trial of intravenous ribavirin therapy of hemorrhagic fever with renal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality was significantly reduced (sevenfold decrease in risk) among
      ribavirin-treated patients, when comparisons were adjusted for baseline
      risk estimators of mortality (P = .01; two-tailed).
    explanation: The positive randomised result that sits in tension with current practice statements.
  - reference: PMID:37105214
    reference_title: "Hantavirus in humans: a review of clinical aspects and management."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No specific effective antiviral treatment is available.
    explanation: >-
      A 2023 Lancet Infectious Diseases review still states that no specific
      effective antiviral exists, which is what makes the 1991 positive trial an
      open question rather than settled practice.

diagnosis:
- name: Hantavirus serology and viral RNA detection
  description: >-
    Diagnosis rests on recognising a compatible febrile illness with
    thrombocytopenia and acute kidney injury in someone with rodent exposure,
    then confirming orthohantavirus infection serologically or molecularly.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Hantavirus-specific IgM or viral RNA in a patient with the clinical triad of
    fever, thrombocytopenia, and acute kidney injury.
  evidence:
  - reference: PMID:35384417
    reference_title: "Hemorrhagic Fever with Renal Syndrome: Literature Review, Epidemiology, Clinical Picture and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The laboratory diagnosis of hantavirus infection is mostly dependent on
      four types of tests: serology, molecular techniques, viral isolation and
      immunochemistry
    explanation: >-
      Names the four laboratory modalities on which confirmation of hantavirus
      infection rests, of which serology and molecular testing are the two
      curated here.
  - reference: PMID:35384417
    reference_title: "Hemorrhagic Fever with Renal Syndrome: Literature Review, Epidemiology, Clinical Picture and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      serological assays that detect IgM and/or IgG antibodies to hantaviral
      antigens in serum are the most often used techniques for diagnostic
      testing of HFRS
    explanation: >-
      Establishes IgM/IgG serology as the first-line confirmatory test in HFRS,
      which is the primary claim of this diagnosis entry.
- name: Serial urinalysis in suspected Seoul virus exposure
  description: >-
    Because Seoul virus disease is often mild and atypical, sometimes with
    preserved kidney function, repeated simple urine examination is the
    recommended way to avoid missing cases in people exposed to pet, feeder, or
    wild rats.
  diagnosis_term:
    preferred_term: urinalysis
    term:
      id: NCIT:C17241
      label: Urinalysis
  results: Transient proteinuria and microhaematuria, which are rarely absent even in mild disease.
  evidence:
  - reference: PMID:31319534
    reference_title: "Wild Rats, Laboratory Rats, Pet Rats: Global Seoul Hantavirus Disease Revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the importance of simple but repeated urine examination is stressed, since
      initial but transient proteinuria and microhematuria are rarely lacking
    explanation: Directly supports serial urinalysis as the recommended detection strategy in SEOV disease.

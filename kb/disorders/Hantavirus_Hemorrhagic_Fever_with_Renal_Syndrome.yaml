    explanation: Documents the toxicity profile observed in the trial.
  - reference: PMID:37105214
    reference_title: "Hantavirus in humans: a review of clinical aspects and management."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No specific effective antiviral treatment is available.
    explanation: >-
      A 2023 review contradicts the practical adoption of ribavirin, which is why

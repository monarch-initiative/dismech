      established therapy.
- name: Icatibant (bradykinin B2 receptor antagonist)
  description: >-
    The therapeutic corollary of the kallikrein-kinin model of vascular leak. A
    single severe Puumala virus case responded dramatically to one dose of the
    bradykinin receptor antagonist icatibant. This is a single case report; the
    authors themselves call for testing in larger numbers of patients, and it is
    curated here as a mechanism-matched hypothesis rather than as established
    therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: icatibant
      term:
        id: CHEBI:68556
        label: icatibant
  therapeutic_modality: PEPTIDE
  target_mechanisms:
  - target: Factor XII-dependent kallikrein-kinin activation and bradykinin release
    treatment_effect: INHIBITS
    description: >-
      Icatibant blocks the bradykinin B2 receptor, the terminal step of the
      kallikrein-kinin arm of this pathograph.
  target_phenotypes:
  - preferred_term: Capillary leak
    term:
      id: HP:0030005
      label: Capillary leak
  evidence:
  - reference: PMID:23294035
    reference_title: A severe case of Puumala hantavirus infection successfully treated with bradykinin receptor antagonist icatibant.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A patient with severe capillary leakage syndrome caused by a Puumala
      hantavirus infection was treated with a single dose of icatibant, a
      bradykinin receptor antagonist, with a dramatic positive response.
    explanation: >-
      Single-patient evidence of benefit, curated as PARTIAL because n=1 cannot
      establish efficacy.
  - reference: PMID:23294035
    reference_title: A severe case of Puumala hantavirus infection successfully treated with bradykinin receptor antagonist icatibant.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that this drug should be tested in a larger number of patients

name: Hantavirus Hemorrhagic Fever with Renal Syndrome
creation_date: '2026-08-04T16:00:00Z'
description: >-
  Hemorrhagic fever with renal syndrome (HFRS) is the Old World arm of human
  orthohantavirus disease, endemic across Asia and Europe and caused chiefly by
  Hantaan, Seoul, Puumala, and Dobrava-Belgrade viruses acquired from
  aerosolised rodent excreta. Hantaviruses enter endothelial cells, platelets,
  and macrophages via beta3 integrins and replicate in the microvascular
  endothelium without a cytopathic effect; disease instead arises from
  increased vascular permeability and acute thrombocytopenia, producing a
  characteristic staged illness of fever, hypotension, oliguric acute kidney
  injury, polyuric diuresis, and convalescence. It is the counterpart of the
  New World hantavirus cardiopulmonary syndrome, sharing the same endothelial
  target and leak physiology but centred on the kidney rather than the lung.
category: Infectious Disease
disease_term:
  preferred_term: hantavirus hemorrhagic fever with renal syndrome
  term:
    id: MONDO:0005784
    label: hantavirus hemorrhagic fever with renal syndrome
parents:
- Hantavirus infectious disease
- Viral hemorrhagic fever
synonyms:
- HFRS
- Korean hemorrhagic fever
- epidemic hemorrhagic fever
- nephropathia epidemica
clinical_burden:
  burden_level: HIGH
  rationale: >-
    HFRS is the most frequently diagnosed zoonosis in Asia and carries a
    case-fatality rate of roughly 5-10% depending on the causative
    orthohantavirus, with severe cases requiring intensive care and renal
    replacement therapy.
  evidence:
  - reference: PMID:36851775
    reference_title: "Hemorrhagic Fever with Renal Syndrome in Asia: History, Pathogenesis, Diagnosis, Treatment, and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hemorrhagic Fever with Renal Syndrome (HFRS) is the most frequently
      diagnosed zoonosis in Asia.
    explanation: Establishes the regional disease burden of HFRS.
  - reference: PMID:35384417
    reference_title: "Hemorrhagic Fever with Renal Syndrome: Literature Review, Epidemiology, Clinical Picture and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The case fatality rate of HFRS varies around 5.0 - 10.0% depending on the
      causative viral agent.
    explanation: Quantifies mortality and supports a high burden level.
has_subtypes:
- name: HTNV HFRS
  display_name: Hantaan virus HFRS (classic Korean/epidemic hemorrhagic fever)
  description: >-
    The classic severe form of HFRS, endemic in Asia (notably China and Korea)
    and carried by the striped field mouse Apodemus agrarius.
  geography:
  - Asia
  evidence:
  - reference: PMID:35384417
    reference_title: "Hemorrhagic Fever with Renal Syndrome: Literature Review, Epidemiology, Clinical Picture and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The old world hantaviruses, primarily Hantaan virus (HTNV), responsible
      for causing HFRS occurs endemically in Asia and Europe.
    explanation: Identifies HTNV as the primary Old World agent of HFRS.
- name: SEOV HFRS
  display_name: Seoul virus HFRS (rat-borne, urban and pet-rat associated)
  description: >-
    Moderate-severity HFRS caused by Seoul orthohantavirus, whose reservoir is
    the globally distributed brown rat. Unlike the other agents it has an urban
    and pet/feeder-rat exposure route, and its presentation is often mild or
    atypical with only transient proteinuria and microhaematuria.
  evidence:
  - reference: PMID:31319534
    reference_title: "Wild Rats, Laboratory Rats, Pet Rats: Global Seoul Hantavirus Disease Revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the mostly milder and atypical clinical presentation, sometimes even
      with preserved normal kidney function, the importance of simple but
      repeated urine examination is stressed, since initial but transient
      proteinuria and microhematuria are rarely lacking.
    explanation: Describes the distinctively mild and atypical SEOV presentation.
- name: PUUV HFRS
  display_name: Puumala virus HFRS (nephropathia epidemica)
  description: >-
    The mild European form, also called nephropathia epidemica, carried by the
    bank vole and associated with mortality below 1%. It nonetheless produces
    genuine acute kidney injury and can be complicated by pituitary
    haemorrhage.
  geography:
  - Europe
  evidence:
  - reference: PMID:24750436
    reference_title: Hantavirus infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whereas Seoul virus causes moderate and Puumala virus and Saaremaa virus
      cause mild forms of disease with mortality rates <1%
    explanation: Places PUUV at the mild end of the HFRS severity spectrum.
- name: DOBV HFRS
  display_name: Dobrava-Belgrade virus HFRS
  description: >-
    The most severe European form, carried by Apodemus mice, with a
    case-fatality rate in the same 5-15% range as Hantaan virus.
  geography:
  - Europe
  evidence:
  - reference: PMID:24750436
    reference_title: Hantavirus infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In general, HFRS caused by Hantaan virus, Amur virus and Dobrava virus are
      more severe with mortality rates from 5 to 15%
    explanation: Places DOBV with HTNV at the severe end of the spectrum.

- name: VEGF-driven VE-cadherin destabilisation of endothelial adherens junctions
  biological_scale: MOLECULAR
  description: >-
    In the most widely cited model of hantavirus leak, infection raises secreted
    VEGF, and VEGF binding to VEGF-R2 dissociates the receptor from VE-cadherin
    and drives VE-cadherin internalisation and degradation, dismantling the
    adherens junction without killing the cell. Blocking VEGF-R2 activation
    prevents the infection-induced VE-cadherin loss.

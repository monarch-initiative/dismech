inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic FBXL4 variants, homozygous or compound heterozygous. Many reported
    patients are from consanguineous families, and a possible founder effect in
    patients of Arab descent has been proposed from a pooled mutation table.
    Carrier parents have a 25% recurrence risk in each pregnancy.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28383868
    reference_title: "FBXL4-Related Encephalomyopathic Mitochondrial DNA Depletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FBXL4-related mtDNA depletion syndrome is inherited in an autosomal recessive manner."
    explanation: GeneReviews statement of the mode of inheritance.
  - reference: PMID:28383868
    reference_title: "FBXL4-Related Encephalomyopathic Mitochondrial DNA Depletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When both parents are heterozygous carriers, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier (heterozygote), and a 25% chance of being unaffected and not a carrier."
    explanation: GeneReviews recurrence risk for sibs.
  - reference: PMID:23993193
    reference_title: "Mutations in FBXL4 cause mitochondrial encephalopathy and a disorder of mitochondrial DNA maintenance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through whole-exome sequencing, we identified recessive nonsense and splicing mutations in FBXL4 segregating in three unrelated consanguineous kindreds in which affected children present with a fatal encephalopathy, lactic acidosis, and severe mtDNA depletion in muscle."
    explanation: Recessive segregation in the discovery kindreds.
  - reference: PMID:30804983
    reference_title: "FBXL4-Related Mitochondrial DNA Depletion Syndrome 13 (MTDPS13): A Case Report With a Comprehensive Mutation Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "using it to highlight, for the first time, a possible founder effect of Arab origins to the disorder, being most prevalent in patients of Arab descent as shown in our mutation table."
    explanation: Proposed Arab founder effect from a pooled mutation review; stated by the authors as possible.
prevalence:
- population: Published cases worldwide to 2017
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    87 individuals in the largest pooled review (50 previously published plus 37
    new). No population-based prevalence has been published. In a referral
    laboratory series FBXL4 variants explained 6 of 808 people tested for
    suspected mitochondrial disease, and 4 of 28 young children with congenital
    lactic acidosis unexplained by a 192-gene panel.
  evidence:
  - reference: PMID:28940506
    reference_title: "Molecular and clinical spectra of FBXL4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since its initial description in 2013, 36 different pathogenic variants in FBXL4 were reported in 50 affected individuals. In this report, we present 37 additional affected individuals and 11 previously unreported pathogenic variants."
    explanation: Case count in the largest pooled review.
  - reference: PMID:27743463
    reference_title: "FBXL4 defects are common in patients with congenital lactic acidemia and encephalomyopathic mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, FBXL4 defects account for at least 0.7% (6 out of 808) of subjects suspected to have a mitochondrial disorder, and as high as 14.3% (4 out of 28) in young children with congenital lactic acidosis and clinical features of mitochondrial disease."
    explanation: Diagnostic yield in a referral laboratory series; a proportion of referred patients, not a population prevalence.
mechanistic_hypotheses:
- hypothesis_group_id: excessive_bnip3_nix_mitophagy
  hypothesis_label: Excessive BNIP3/NIX-Dependent Basal Mitophagy
  status: CANONICAL
  description: >-
    FBXL4 is the substrate adaptor of an SCF ubiquitin ligase that degrades the
    mitophagy receptors BNIP3 and NIX. Pathogenic FBXL4 variants fail to assemble
    an active ligase, BNIP3 and NIX accumulate, basal mitophagy rises, and cells
    lose mitochondrial content and mtDNA. Several independent groups reported
    the ligase-substrate relationship in 2023, and deleting Bnip3 or Nix rescues
    the viability of Fbxl4 knockout mice.
  evidence:
  - reference: PMID:36896912
    reference_title: "A mitochondrial SCF-FBXL4 ubiquitin E3 ligase complex degrades BNIP3 and NIX to restrain mitophagy and prevent mitochondrial disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, beyond identifying SCF-FBXL4 as a novel mitochondrial ubiquitin E3 ligase restraining basal mitophagy, our results reveal hyperactivated mitophagy as a cause of mitochondrial disease and suggest therapeutic strategies."
    explanation: Genetic rescue in mice establishes hyperactive mitophagy as causal.
  - reference: PMID:38123379
    reference_title: "FBXL4 mutation-caused mitochondrial DNA depletion syndrome is driven by BNIP3/BNIP3L-dependent excessive mitophagy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Recent advances have shown that excessive BCL2 interacting protein 3 (BNIP3)/ BCL2 interacting protein 3 like (BNIP3L)-dependent mitophagy underlies the molecular pathogenesis of MTDPS13."
    explanation: Review synthesis of the convergent 2023 studies.
- hypothesis_group_id: primary_oxphos_defect_secondary_mitophagy
  hypothesis_label: Primary Oxidative Phosphorylation Defect with Secondary Mitophagy
  status: ALTERNATIVE
  description: >-
    Before the ligase studies, one fibroblast study of two patients found
    increased mitochondrial mass, fragmentation and autophagy but interpreted
    them as secondary to a primary oxidative phosphorylation defect, and one of
    the two lines had normal mtDNA copy number. A neonatal case likewise showed
    relative sparing of mitochondrial mass in fibroblasts despite profound
    respiratory failure. These observations predate, and have not been
    reconciled with, the BNIP3/NIX data.
  evidence:
  - reference: PMID:31969900
    reference_title: "Molecular Characterization of New FBXL4 Mutations in Patients With mtDNA Depletion Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further analysis of fibroblasts allowed to establish that increased mitochondrial mass, mitochondrial fragmentation, and augmented autophagy are associated with FBXL4 deficiency in cells, but are probably secondary to a primary metabolic defect affecting oxidative phosphorylation."
    explanation: The authors' interpretation of autophagy as secondary.
- hypothesis_group_id: embryonic_mitophagy_developmental_defects
  hypothesis_label: Dysregulated Mitophagy in Embryonic Stem Cell Differentiation
  status: EMERGING
  description: >-
    Structural brain and heart malformations and facial dysmorphism suggest a
    defect of embryogenesis. A commentary proposes that excess mitophagy
    disturbs the fine-tuned mitophagy needed for stem cell differentiation. No
    experimental test in an FBXL4 model is cited.
  evidence:
  - reference: PMID:39937392
    reference_title: "FBXL4-Related Mitochondrial Depletion Syndrome Underscores the role of Mitophagy in Stem Cell Differentiation during Embryogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The disruption of this process is the likely explanation of developmental defects in FBXL4- related mitochondrial depletion syndrome."
    explanation: Hypothesis stated in a commentary without new data.
pathophysiology:
- name: FBXL4 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic germline FBXL4 variants (nonsense, frameshift, splice and
    missense) distributed across the gene, without a clear genotype-phenotype
    correlation. FBXL4 is the substrate-binding F-box subunit of an SCF (CRL1)
    ubiquitin ligase on the mitochondrial outer membrane. Tested pathogenic
    variants leave FBXL4 able to bind BNIP3 and NIX but unable to assemble an
    active ligase. Re-expression of wild-type FBXL4 restores mtDNA copy number
    in patient cells.
  genes:
  - preferred_term: FBXL4
    term:
      id: hgnc:13601
      label: FBXL4
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic (homozygous or compound heterozygous) germline FBXL4 variants.
  molecular_functions:
  - preferred_term: SCF substrate adaptor activity
    term:
      id: GO:1990756
      label: ubiquitin-like ligase-substrate adaptor activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial outer membrane
    term:
      id: GO:0005741
      label: mitochondrial outer membrane
  evidence:
  - reference: PMID:23993193
    reference_title: "Mutations in FBXL4 cause mitochondrial encephalopathy and a disorder of mitochondrial DNA maintenance."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of the wild-type FBXL4 transcript in cell lines from two subjects fully rescued the levels of mtDNA copy number, leading to a correction of the mitochondrial biochemical deficit."
    explanation: Complementation in patient cells ties the cellular defect to loss of FBXL4 function.
  - reference: PMID:25868664
    reference_title: "Clinical, morphological, biochemical, imaging and outcome parameters in 21 individuals with mitochondrial maintenance defect related to FBXL4 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations were detected throughout the FBXL4 gene albeit with no clear delineation of a genotype-phenotype correlation."
    explanation: Variants span the gene without a genotype-phenotype correlation.
  - reference: PMID:36896912
    reference_title: "A mitochondrial SCF-FBXL4 ubiquitin E3 ligase complex degrades BNIP3 and NIX to restrain mitophagy and prevent mitochondrial disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We determined that FBXL4 functions as an integral outer-membrane protein that forms an SCF-FBXL4 ubiquitin E3 ligase complex."
    explanation: Establishes FBXL4 as the substrate adaptor of an outer-membrane SCF ligase.
  - reference: PMID:37161784
    reference_title: "FBXL4 suppresses mitophagy by restricting the accumulation of NIX and BNIP3 mitophagy receptors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that the pathogenic variants of FBXL4 that cause encephalopathic mtDNA depletion syndrome (MTDPS13) do not efficiently interact with the core SCF ubiquitin ligase machinery or mediate the degradation of NIX and BNIP3."
    explanation: Patient variants lose ligase assembly and function.
  - reference: PMID:37876279
    reference_title: "Excessive BNIP3- and BNIP3L-dependent mitophagy underlies the pathogenesis of FBXL4-mutated mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient-derived FBXL4 mutations do not affect its interaction with BNIP3 and BNIP3L but impair the assembly of an active CRL1-FBXL4 complex."
    explanation: Substrate binding is retained and ligase assembly is lost.

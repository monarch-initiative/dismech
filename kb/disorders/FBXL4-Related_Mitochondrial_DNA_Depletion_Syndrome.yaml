- name: Failed Ubiquitination and Degradation of BNIP3 and NIX
  biological_scale: MOLECULAR
  description: >-
    Without an active SCF-FBXL4 ligase, the mitophagy receptors BNIP3 and NIX
    (BNIP3L) escape constitutive ubiquitination and proteasomal degradation and
    accumulate on the mitochondrial outer membrane. PPTC7, a matrix protein
    retained at the outer membrane, scaffolds the substrate-PPTC7-SCF-FBXL4
    complex and is part of the same regulatory loop.
  genes:
  - preferred_term: BNIP3
    term:
      id: hgnc:1084
      label: BNIP3
  - preferred_term: NIX (BNIP3L)
    term:
      id: hgnc:1085
      label: BNIP3L
  biological_processes:
  - preferred_term: SCF-dependent proteasomal degradation of BNIP3 and NIX

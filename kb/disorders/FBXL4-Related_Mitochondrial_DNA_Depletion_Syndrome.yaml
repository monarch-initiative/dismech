    snippet: "To date no definite treatment is available; thus, treatment is mainly supportive: assuring adequate nutrition and standard treatment of neurologic complications including developmental delay / intellectual disability, seizures, cardiac complications, eye involvement, and hearing loss."
    explanation: GeneReviews management.

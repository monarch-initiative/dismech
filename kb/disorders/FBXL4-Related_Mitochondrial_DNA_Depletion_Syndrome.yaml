- name: Dichloroacetate
  description: >-
    Pyruvate dehydrogenase activator. In one of two siblings with the
    p.Cys584Arg variant it improved metabolic acidosis and reversed cardiac
    hypertrophy; in patient fibroblasts it reduced acidification without
    correcting other mitochondrial functions. In C. elegans, zebrafish and
    human fibroblast models it improved survival, neuromuscular function and
    mitochondrial physiology. No controlled human trial has been reported.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dichloroacetate
      term:
        id: CHEBI:28240
        label: dichloroacetate
  target_phenotypes:
  - preferred_term: Lactic acidosis
    term:
      id: HP:0003128
      label: Lactic acidosis
  - preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
  target_mechanisms:
  - target: Lactic acidosis
    description: Drives pyruvate into mitochondrial oxidation, lowering lactate.
  - target: Cardiomyocyte Energy Failure
    description: Cardiac hypertrophy reversed in one patient.
  evidence:
  - reference: PMID:31442532
    reference_title: "Characterization of the C584R variant in the mtDNA depletion syndrome gene FBXL4, reveals a novel role for FBXL4 as a regulator of mitochondrial fusion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Remarkably, dichloroacetate (DCA) administration to the younger sibling improved metabolic acidosis and reversed cardiac hypertrophy."
    explanation: Single-patient clinical response.
  - reference: PMID:35881484
    reference_title: "Dichloroacetate improves mitochondrial function, physiology, and morphology in FBXL4 disease models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Validation studies were performed in fbxl4sa12470 zebrafish larvae and in FBXL4-/- human fibroblasts; they showed DCA efficacy in preventing brain death, impairment of neurologic and/or muscular function, mitochondrial biochemical dysfunction, and stress-induced morphologic and ultrastructural mitochondrial defects."
    explanation: Preclinical efficacy in zebrafish; the same sentence covers fibroblasts, which are not graded separately here.
- name: Ketogenic Diet
  description: >-
    Parenteral then enteral ketogenic diet lowered lactate in a 4-year-old girl
    whose lactic acidosis during sepsis did not respond to drugs, and in a
    preterm neonate lactate fell and acid-base balance and growth improved
    within three days. Single-patient reports.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: ketogenic diet
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  target_phenotypes:
  - preferred_term: Lactic acidosis
    term:
      id: HP:0003128
      label: Lactic acidosis
  evidence:
  - reference: PMID:33882172
    reference_title: "The first case with FBXL4 mutation successfully treated with a parenteral ketogenic diet for lactic acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the disease course, lactic acidosis became prominent and did not respond to pharmacological treatment; standard PN was gradually switched to parenteral KD, and lactate levels decreased after parenteral KD."
    explanation: Single-case response.
  - reference: PMID:41635899
    reference_title: "The Ketogenic Diet in the Neonatal Intensive Care Setting: The Case of a Preterm Newborn With Mitochondrial DNA Depletion Syndrome Type 13 (MTDPS13)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 3 days of this treatment approach, a significant reduction in lactate levels and improvement in acid-base balance and growth trend were observed along with clinical and cardiovascular parameters."
    explanation: Single-case response in a preterm neonate.
- name: Deoxycytidine and Deoxythymidine
  description: >-
    Oral pyrimidine deoxynucleosides, investigational. An interim open-label
    analysis pooled eight children with FBXL4, SUCLG1, SUCLA2 or RRM2B variants;
    Newcastle Mitochondrial Disease Scale scores improved at group level. The
    number of FBXL4 patients and their individual results are not given in the
    abstract, the study is uncontrolled, and there is no FBXL4-specific
    mechanistic rationale, since the defect is excess mitochondrial removal
    rather than nucleotide supply.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deoxycytidine
      term:
        id: CHEBI:15698
        label: 2'-deoxycytidine
    - preferred_term: deoxythymidine
      term:
        id: CHEBI:17748
        label: thymidine
  evidence:
  - reference: PMID:40175578
    reference_title: "Investigating the safety and efficacy of deoxycytidine/deoxythymidine in mitochondrial DNA depletion disorders: phase 2 open-label trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Data were available from eight individuals having pathogenic variants in FBXL4, SUCLG1, SUCLA2, or RRM2B."
    explanation: FBXL4 is among the pooled genotypes.
  - reference: PMID:40175578
    reference_title: "Investigating the safety and efficacy of deoxycytidine/deoxythymidine in mitochondrial DNA depletion disorders: phase 2 open-label trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Newcastle Mitochondrial Disease Scale score improved in all individuals except for one who withdrew before the first follow-up visit; group level analysis was significant at 1-month and 6-month timepoints."
    explanation: Pooled open-label result, not specific to FBXL4.
- name: AMPK Activation (preclinical)
  description: >-
    Small-molecule AMPK activators, including PXL-770, inhibited BNIP3/NIX
    mitophagy and restored mitochondrial content and respiration in
    FBXL4-deficient cells and patient fibroblasts, and inhibited mitophagy in
    liver and brain of a chemically induced mouse model. Not tested in patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Excessive Basal Mitophagy
    description: AMPK sequesters the ULK1 autophagy-initiating kinase and so restrains mitophagy.
  evidence:
  - reference: PMID:42310391
    reference_title: "Activation of AMPK as a therapeutic strategy for FBXL4-related mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using FBXL4-deficient cells, as well as fibroblasts derived from MTDPS13 patients and a chemically-induced mouse model, we show that small molecule AMPK activation inhibits BNIP3/NIX-mediated mitophagy and recovers functional mitochondrial content."
    explanation: Preclinical rescue of the mitophagy node, mainly in cells.

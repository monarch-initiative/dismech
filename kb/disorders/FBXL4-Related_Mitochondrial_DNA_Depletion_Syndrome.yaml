genetic:
- name: FBXL4
  gene_term:
    preferred_term: FBXL4
    term:
      id: hgnc:13601
      label: FBXL4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    47 pathogenic variants in 87 individuals by 2017; null (nonsense,
    frameshift, splice) and missense variants both occur. No clear
    genotype-phenotype correlation has been established: a homozygous
    frameshift was proposed to lie at the severe end, a homozygous nonsense
    variant has been reported with a milder course, and one missense variant
    gave different courses in unrelated carriers.
  evidence:
  - reference: PMID:28940506
    reference_title: "Molecular and clinical spectra of FBXL4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic pathogenic variants in FBXL4 are associated with an encephalopathic mtDNA maintenance defect syndrome that is a multisystem disease characterized by lactic acidemia, developmental delay, and hypotonia."
    explanation: Gene-disease association summarised over 87 patients.
  - reference: PMID:23993194
    reference_title: "Mutations in FBXL4, encoding a mitochondrial protein, cause early-onset mitochondrial encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing and autozygosity mapping studies, independently performed in subjects with defective combined mitochondrial OXPHOS-enzyme deficiencies, identified a total of nine disease-segregating FBXL4 mutations in seven unrelated mitochondrial disease families, composed of six singletons and three siblings."
    explanation: Independent discovery in seven families.
  - reference: PMID:27743463
    reference_title: "FBXL4 defects are common in patients with congenital lactic acidemia and encephalomyopathic mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Definitive diagnosis was made in 10 new subjects with a total of 7 novel deleterious variants; 5 null and 2 missense substitutions."
    explanation: Null and missense variant classes.
  variants:
  - name: c.1641_1642delTG (homozygous frameshift)
    description: Homozygous frameshift in a neonate; proposed by the authors to represent the severe end of the spectrum.
    evidence:
    - reference: PMID:26404457
      reference_title: "Detailed Biochemical and Bioenergetic Characterization of FBXL4-Related Encephalomyopathic Mitochondrial DNA Depletion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In light of our patient's clinical findings and genotype (homozygous frameshift), this phenotype likely represents the severe end of the FBXL4 clinical spectrum."
      explanation: Authors' severity interpretation for a single patient.
  - name: c.1303C>T
    description: Missense variant reported in three unrelated individuals with different clinical courses.
    evidence:
    - reference: PMID:30804983
      reference_title: "FBXL4-Related Mitochondrial DNA Depletion Syndrome 13 (MTDPS13): A Case Report With a Comprehensive Mutation Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Finally, we provide a direct comparison of the disorder's clinical manifestations across two unrelated patients harboring the same disease-causing mutation as our patient, emphasizing the remarkable variability in genotype-to-phenotype correlation characteristic of the disease."
      explanation: Same variant, variable phenotype.
  - name: c.1750T>C (p.Cys584Arg)
    description: Homozygous missense in two siblings with cardiac hypertrophy; unlike wild-type FBXL4 the variant does not promote mitochondrial fusion.
    evidence:
    - reference: PMID:31442532
      reference_title: "Characterization of the C584R variant in the mtDNA depletion syndrome gene FBXL4, reveals a novel role for FBXL4 as a regulator of mitochondrial fusion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report two siblings, from consanguineous parents, harbouring a previously uncharacterized homozygous variant in FBXL4 (c.1750 T > C; p.Cys584Arg)."
      explanation: Identification in two siblings.
  - name: c.486T>G (p.Tyr162Ter)
    description: Homozygous nonsense variant in a 4.5-year-old boy with a milder course than usual.
    evidence:
    - reference: PMID:34602956
      reference_title: "A Mild Phenotype of Mitochondrial DNA Depletion Syndrome Type 13 with a Novel FBXL4 Variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "While most of the patients with FBLX4 gene mutation have severe clinical manifestation and die at a very young age, clinical progress of our case was milder than previously reported."
      explanation: Milder course despite a truncating variant.
progression:
- phase: Prenatal and neonatal onset
  notes: >-
    Onset is congenital or in early infancy. Prenatal onset with brain changes
    from the second trimester, polyhydramnios and cardiac anomalies is reported
    in a few cases.
  evidence:
  - reference: PMID:28383868
    reference_title: "FBXL4-Related Encephalomyopathic Mitochondrial DNA Depletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FBXL4-related encephalomyopathic mitochondrial DNA (mtDNA) depletion syndrome is a multi-system disorder characterized primarily by congenital or early-onset lactic acidosis and growth failure, feeding difficulty, hypotonia, and developmental delay."
    explanation: Congenital or early onset.
  - reference: PMID:40252080
    reference_title: "Prenatal FBXL4-Associated Mitochondrial DNA Depletion Syndrome-13: A New Case and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case illustrates the prenatal onset of MTDPS13, with central nervous system abnormalities apparent from the second trimester."
    explanation: Prenatal onset in a subset.
- phase: Survival
  notes: >-
    Median age at reported death two years (range 2 days to 75 months), with
    survivors up to 36 years. In the 21-patient series 7 children had died at a
    mean age of 37 months and 11 were alive at a mean follow-up of 46 months.
    Deaths during metabolic decompensation with intercurrent infection are
    described.
  evidence:
  - reference: PMID:28383868
    reference_title: "FBXL4-Related Encephalomyopathic Mitochondrial DNA Depletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Survival varies; the median age of reported deaths was two years (range 2 days – 75 months), although surviving individuals as old as 36 years have been reported."
    explanation: GeneReviews survival summary.
  - reference: PMID:25868664
    reference_title: "Clinical, morphological, biochemical, imaging and outcome parameters in 21 individuals with mitochondrial maintenance defect related to FBXL4 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven children died (mean age 37 months); 11 children were alive (mean age at follow-up 46 months), three children were lost to follow-up."
    explanation: Outcome in the 21-patient series.
diagnosis:
- name: FBXL4 molecular genetic testing
  description: >-
    Identification of biallelic pathogenic FBXL4 variants establishes the
    diagnosis. Early-onset encephalopathy with persistent lactic acidosis,
    profound hypotonia and the typical facial dysmorphism should prompt FBXL4
    analysis, and FBXL4 belongs on mitochondrial panels used for congenital
    lactic acidosis.
  evidence:
  - reference: PMID:28383868
    reference_title: "FBXL4-Related Encephalomyopathic Mitochondrial DNA Depletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of FBXL4-related mtDNA depletion syndrome is established in a proband by identification of biallelic pathogenic variants in FBXL4 on molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:25868664
    reference_title: "Clinical, morphological, biochemical, imaging and outcome parameters in 21 individuals with mitochondrial maintenance defect related to FBXL4 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, a clinical pattern of early-onset encephalopathy, persistent lactic acidosis, profound muscular hypotonia and typical facial dysmorphism should prompt initiation of molecular genetic analysis of FBXL4."
    explanation: Clinical pattern that should trigger testing.
  - reference: PMID:27743463
    reference_title: "FBXL4 defects are common in patients with congenital lactic acidemia and encephalomyopathic mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Including FBLX4 in the mitochondrial diseases panel should be particularly important for patients with congenital lactic acidosis."
    explanation: Panel inclusion recommendation.
  - reference: PMID:25868664
    reference_title: "Clinical, morphological, biochemical, imaging and outcome parameters in 21 individuals with mitochondrial maintenance defect related to FBXL4 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Establishment of the diagnosis permits genetic counselling, prevents patients undergoing unhelpful diagnostic procedures and allows for accurate prognosis."
    explanation: Value of an early molecular diagnosis.
- name: Muscle biopsy
  description: >-
    Shows mtDNA depletion, a paucity of mitochondria and a combined respiratory
    chain deficiency; supportive, but the diagnosis rests on molecular testing.
  evidence:
  - reference: PMID:25868664
    reference_title: "Clinical, morphological, biochemical, imaging and outcome parameters in 21 individuals with mitochondrial maintenance defect related to FBXL4 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnostic workup in patient tissues and cells revealed a severe combined respiratory chain defect with a general decrease of enzymes associated with mitochondrial energy metabolism and a relative depletion of mitochondrial DNA content."
    explanation: Tissue findings on diagnostic workup.
- name: Surveillance
  description: >-
    No published surveillance guideline; follow-up of eyes, hearing, heart,
    feeding, liver, neurological complications and neutropenia is set by the
    treating physician according to the findings.
  evidence:
  - reference: PMID:28383868
    reference_title: "FBXL4-Related Encephalomyopathic Mitochondrial DNA Depletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The treating physician should decide about the frequency of follow up of eyes, hearing, heart, feeding difficulties, liver, neurologic complications, and neutropenia based on the patient's findings."
    explanation: GeneReviews surveillance statement.
- name: Carrier and prenatal testing
  description: Once both familial variants are known, carrier testing, prenatal testing and preimplantation genetic testing are possible.
  evidence:
  - reference: PMID:28383868
    reference_title: "FBXL4-Related Encephalomyopathic Mitochondrial DNA Depletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the FBXL4 pathogenic variants have been identified in an affected family member, carrier testing for at-risk relatives, prenatal testing for a pregnancy at increased risk, and preimplantation genetic testing are possible."
    explanation: GeneReviews genetic counseling statement.

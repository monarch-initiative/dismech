    modifier: DECREASED
  evidence:
  - reference: PMID:37161784
    reference_title: "FBXL4 suppresses mitophagy by restricting the accumulation of NIX and BNIP3 mitophagy receptors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report that SCFFBXL4 , an SKP1/CUL1/F-box protein ubiquitin ligase complex, localises to the mitochondrial outer membrane in unstressed cells and mediates the constitutive ubiquitylation and degradation of the mitophagy receptors NIX and BNIP3 to suppress basal levels of mitophagy."
    explanation: Constitutive SCF-FBXL4-dependent turnover of the two receptors.
  - reference: PMID:37568009
    reference_title: "FBXL4 mutations cause excessive mitophagy via BNIP3/BNIP3L accumulation leading to mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we demonstrate that, FBXL4 directly interacts with the mitophagy cargo receptors BNIP3 and BNIP3L, promoting their degradation through the ubiquitin-proteasome pathway via the assembly of an active CRL1FBXL4 complex."
    explanation: Independent group; direct interaction and proteasomal degradation.
  - reference: PMID:37102372
    reference_title: "FBXL4 ubiquitin ligase deficiency promotes mitophagy by elevating NIX levels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "FBXL4 restricts NIX and BNIP3 levels via direct interaction and protein destabilization, while VHL acts through suppression of HIF1α-mediated transcription of BNIP3 and NIX."
    explanation: Third independent group, from a CRISPR screen of E3 ligases.
  - reference: PMID:38151018
    reference_title: "A mitophagy sensor PPTC7 controls BNIP3 and NIX degradation to regulate mitochondrial mass."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemically, the PPTC7 precursor is trapped by BNIP3 and NIX to the mitochondrial outer membrane, where PPTC7 scaffolds assembly of a substrate-PPTC7-SCFFBXL4 holocomplex to degrade BNIP3 and NIX, forming a homeostatic regulatory loop."
    explanation: PPTC7 as a co-factor of SCF-FBXL4 substrate degradation.
  downstream:

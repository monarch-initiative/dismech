name: FBXL4-Related Mitochondrial DNA Depletion Syndrome
creation_date: "2026-09-28T20:00:00Z"
category: Mendelian
disease_term:
  preferred_term: mitochondrial DNA depletion syndrome 13
  term:
    id: MONDO:0014198
    label: mitochondrial DNA depletion syndrome 13
synonyms:
- MTDPS13
- mitochondrial DNA depletion syndrome 13
- mitochondrial DNA depletion syndrome 13 (encephalomyopathic type)
- mitochondrial DNA depletion syndrome type 13
- FBXL4-related encephalomyopathic mitochondrial DNA depletion syndrome
- FBXL4 mitochondrial DNA depletion syndrome
- FBXL4 deficiency
- encephalomyopathic mitochondrial DNA depletion syndrome-13
- mtDNA depletion syndrome, encephalomyopathic form with variable craniofacial anomalies
- mitochondrial DNA depletion syndrome caused by mutation in FBXL4
description: >-
  Autosomal recessive multisystem mitochondrial disease caused by biallelic
  FBXL4 variants. FBXL4 is the substrate adaptor of an SCF (SKP1-CUL1-F-box)
  ubiquitin ligase on the mitochondrial outer membrane that continuously
  ubiquitinates the mitophagy receptors BNIP3 and NIX (BNIP3L) and so restrains
  basal mitophagy. Loss of FBXL4 lets BNIP3 and NIX accumulate, mitochondria are
  removed by autophagy in excess, and cells are left with too few mitochondria,
  too little mtDNA and a combined respiratory chain deficiency. Onset is
  congenital or in early infancy with lactic acidosis, hypotonia, feeding
  difficulty, growth failure and developmental delay; progressive cerebral
  atrophy with white matter involvement, seizures, movement disorders,
  hyperammonemia, hypertrophic cardiomyopathy, congenital heart malformations,
  arrhythmias, raised transaminases, cataract and other eye findings,
  sensorineural hearing loss, neutropenia and lymphopenia, and characteristic
  facial dysmorphism occur variably. Reported deaths cluster in early childhood
  (median two years), but survival into adulthood occurs and milder courses are
  described. Treatment is supportive; dichloroacetate, ketogenic diet and
  deoxynucleosides have been tried in single patients or small open-label
  series, and suppression of mitophagy is the mechanistic treatment target in
  preclinical work.
parents:
- mitochondrial DNA depletion syndrome, encephalomyopathic form
- mitochondrial DNA maintenance defect
notes: >-
  Identity: MONDO:0014198 carries OMIM:615471 and Orphanet:369897 as exact
  cross-references and FBXL4 as its causal gene (RO:0004003). The MONDO parent
  MONDO:0016796 (mitochondrial DNA depletion syndrome, encephalomyopathic form)
  is a multi-gene grouping and is not this entry. FBXL4 is the only gene. The
  submitochondrial location of FBXL4 was first reported as the intermembrane
  space (Gai et al. 2013); the later ligase studies place it on the outer
  membrane, the topology that ubiquitination of BNIP3 and NIX requires, and the
  entry follows the later work.

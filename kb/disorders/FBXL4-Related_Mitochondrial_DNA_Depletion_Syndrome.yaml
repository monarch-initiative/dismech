animal_models:
- name: Fbxl4 knockout mouse (Alsina et al.)
  species: Mouse
  genotype: Fbxl4-/-
  publication: PMID:32525278
  description: >-
    Predominant perinatal lethality; rare survivors appear normal until 8-12
    months, then develop mitochondrial dysfunction, weight loss, a global
    reduction of mitochondrial proteins and mtDNA depletion.
  modeled_mechanisms:
  - target: Reduced Mitochondrial Content
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Survivors are asymptomatic for most of the first year, unlike the
      neonatal onset in patients; the authors argue that the mitochondrial
      phenotype is not the leading cause of the perinatal death, since embryos
      develop normally until E13.5 despite lower mtDNA.
    evidence:
    - reference: PMID:32525278
      reference_title: "FBXL4 deficiency increases mitochondrial removal by autophagy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "One-year-old Fbxl4 knockouts show a global reduction in a variety of mitochondrial proteins and mtDNA depletion, whereas lysosomal proteins are upregulated."
      explanation: Reduced mitochondrial content in knockout mouse tissue.
    - reference: PMID:32525278
      reference_title: "FBXL4 deficiency increases mitochondrial removal by autophagy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The finding that Fbxl4 −/− embryos are present at Mendelian ratios and develop normally until E13.5 despite having somewhat lower mtDNA levels argues that the mitochondrial phenotype is not the leading cause of the perinatal death."
      explanation: The authors' caveat on the cause of perinatal death.
- name: Fbxl4 knockout mouse with Bnip3 or Nix co-deletion (Cao et al.)
  species: Mouse
  genotype: Fbxl4-/- with Bnip3-/- or Nix-/-
  publication: PMID:36896912
  description: >-
    Fbxl4-/- mice have raised BNIP3 and NIX, hyperactive mitophagy and perinatal
    lethality; deleting either Bnip3 or Nix represses the mitophagy, corrects
    metabolic derangements and rescues viability.
  modeled_mechanisms:
  - target: Excessive Basal Mitophagy
    relationship: RESCUES
    fidelity: HIGH
    model_scale: ORGANISM
    limitations: >-
      Genetic rescue in mice; receptor knockout is not a clinical intervention,
      and neurological outcome in a model with the human neonatal course has
      not been tested.
    evidence:
    - reference: PMID:36896912
      reference_title: "A mitochondrial SCF-FBXL4 ubiquitin E3 ligase complex degrades BNIP3 and NIX to restrain mitophagy and prevent mitochondrial disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Importantly, knockout of either Bnip3 or Nix rescues metabolic derangements and viability of the Fbxl4-/- mice."
      explanation: Genetic rescue places receptor-driven mitophagy upstream of lethality.
- name: Fbxl4 patient-variant knock-in mouse (Chen et al.)
  species: Mouse
  genotype: knock-in of a patient-derived FBXL4 variant
  publication: PMID:37568009
  description: Knock-in mice carrying a patient-derived FBXL4 variant show excessive mitophagy.
  modeled_mechanisms:
  - target: Excessive Basal Mitophagy
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: The abstract does not name the variant or report the whole-animal phenotype of the mice.
    evidence:
    - reference: PMID:37568009
      reference_title: "FBXL4 mutations cause excessive mitophagy via BNIP3/BNIP3L accumulation leading to mitochondrial DNA depletion syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Excessive mitophagy was observed in Knockin (KI) mice carrying a patient-derived FBXL4 mutation and cortical neurons (CNs)-induced from MTDPS13 patient human induced pluripotent stem cells (hiPSCs)."
      explanation: Patient allele reproduces the mitophagy state in vivo.
- name: fbxl-1(ok3741) C. elegans
  species: Caenorhabditis elegans
  genotype: fbxl-1(ok3741)
  publication: PMID:35881484
  description: >-
    Developmental delay, impaired fecundity, reduced neuromuscular activity,
    mitochondrial dysfunction and altered lactate metabolism; improved by
    dichloroacetate.
  modeled_mechanisms:
  - target: Combined Respiratory Chain Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      Invertebrate ortholog model; whether fbxl-1 regulates BNIP3/NIX-type
      mitophagy receptors in worms is not stated in the abstract.
    evidence:
    - reference: PMID:35881484
      reference_title: "Dichloroacetate improves mitochondrial function, physiology, and morphology in FBXL4 disease models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Developmental delay, impaired fecundity and neurologic and/or muscular activity, mitochondrial dysfunction, and altered lactate metabolism were identified in fbxl-1(ok3741) C. elegans."
      explanation: Mitochondrial and lactate phenotypes in the worm model.
- name: fbxl4 sa12470 zebrafish
  species: Zebrafish
  genotype: fbxl4sa12470
  publication: PMID:35881484
  description: Zebrafish larvae used to validate dichloroacetate against brain death and neuromuscular impairment.
  modeled_mechanisms:
  - target: Neuronal Energy Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      The abstract reports protection by dichloroacetate but does not describe
      the untreated phenotype in detail, and the morphological mitochondrial
      defects are stress-induced rather than baseline.
    evidence:
    - reference: PMID:35881484
      reference_title: "Dichloroacetate improves mitochondrial function, physiology, and morphology in FBXL4 disease models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Validation studies were performed in fbxl4sa12470 zebrafish larvae and in FBXL4-/- human fibroblasts; they showed DCA efficacy in preventing brain death, impairment of neurologic and/or muscular function, mitochondrial biochemical dysfunction, and stress-induced morphologic and ultrastructural mitochondrial defects."
      explanation: Brain death and neuromuscular impairment in the larvae are prevented by DCA.

discussions:
- discussion_id: fbxl4-mitochondrial-mass-discordance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is mitochondrial mass reduced in knockout cells, knockout mouse tissue
    and patient muscle but spared or increased in some patient fibroblast
    lines?
  attaches_to:
  - pathophysiology#Reduced Mitochondrial Content
  - pathophysiology#Excessive Basal Mitophagy
  rationale: >-
    The canonical model predicts fewer mitochondria, which knockout cells,
    knockout mice and patient muscle show, while one neonatal fibroblast line
    had relatively spared mass and two other lines had increased mass, one of
    them with normal mtDNA. Whether this reflects culture conditions, residual
    function of particular alleles or compensatory biogenesis is not resolved.
- discussion_id: fbxl4-developmental-defects
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do the facial dysmorphism, congenital heart malformations and prenatal brain
    anomalies arise from excess mitophagy during embryonic differentiation, or
    from energy failure?
  attaches_to:
  - pathophysiology#Disrupted Stem Cell Differentiation during Embryogenesis
  - phenotypes#Abnormal facial shape
  - phenotypes#Congenital heart malformation
  rationale: >-
    The developmental features are not explained by the postnatal
    energy-failure chain, and the embryonic-mitophagy explanation is a
    hypothesis without an FBXL4 experiment.

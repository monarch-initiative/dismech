    snippet: "In contrast to the cerebellum, p-S6240/244 levels were decreased by about 90% in the hippocampus of 3-week-old B6J.Gtpbp1-/- and B6J-Gtpbp2-/- mice relative to wild type"
    explanation: mTORC1 readout is sharply reduced in the Gtpbp2 knockout hippocampus.
- name: Neuronal Degeneration
  description: >-
    Gtpbp2 mutant mice on the C57BL/6J background lose cerebellar granule
    cells, dentate gyrus granule cells, cortical layer IV neurons and retinal
    neurons and become ataxic; the neuron loss depends on the strain's n-Tr20
    tRNA mutation. In patients, cerebellar atrophy, progressive spasticity and
    a movement disorder show a neurodegenerative course alongside the
    developmental one.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cerebellar granule cell
    term:

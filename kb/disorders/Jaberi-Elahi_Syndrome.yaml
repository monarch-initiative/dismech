    evidence_source: HUMAN_CLINICAL
    snippet: "A full-field electroretinography revealed generalized dysfunction of photoreceptors, bipolar cells, and amacrine cells."
    explanation: Retinal dysfunction across several neuronal layers in patients.
- name: Abnormal Brain Development
  description: >-
    Microcephaly often begins before birth, motor and cognitive impairment
    start in infancy and can appear non-progressive, and some patients have
    agenesis of the corpus callosum. These point to a developmental component
    that the mouse ribosome-pausing model, in which neurons are lost after
    weaning, does not explain. How GTPBP2 loss disturbs brain development is
    not known.
  biological_scale: TISSUE
  biological_processes:

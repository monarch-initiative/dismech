    snippet: "As previously observed in B6J-Gtpbp2-/- mice, granule cells in the DG, layer IV cortical neurons and multiple neurons in the retina degenerated in B6J.Gtpbp1-/- mice"
    explanation: The neuronal populations that degenerate in Gtpbp2 mutant mice.
  - reference: PMID:33186095
    reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As observed in Gtpbp2-/- mice, neuron loss in Gtpbp1-/- mice is dependent on a mutation in the B6J strain that disrupts n-Tr20 tRNAArgUCU processing"
    explanation: Neuron loss in Gtpbp2 mutant mice depends on the n-Tr20 mutation.
  - reference: PMID:30790272
    reference_title: "Clinical delineation of GTPBP2-associated neuro-ectodermal syndrome: Report of two new families and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The individuals described herein provide valuable additional phenotypic information about this rare, novel, and progressive neuroectodermal condition."
    explanation: The human disease is progressive.
- name: Retinal Neuron Degeneration
  description: >-
    Retinal neurons degenerate in Gtpbp2 mutant mice. Patients have visual
    impairment, and electroretinography in the first family showed generalized
    dysfunction of photoreceptors, bipolar cells and amacrine cells. Labrador
    retrievers homozygous for an in-frame GTPBP2 deletion develop progressive
    retinal atrophy.
  biological_scale: TISSUE
  cell_types:

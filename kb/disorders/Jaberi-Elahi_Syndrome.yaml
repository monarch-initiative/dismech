discussions:
- discussion_id: jabels_ribosome_pausing_human_model_mismatch
  prompt: >-
    Does loss of GTPBP2 cause codon-specific ribosome pausing in human
    neurons, as it does in mouse brain carrying a mutant n-Tr20 tRNA, or does
    the human disease arise another way?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Unresolved Ribosome Pausing
  rationale: >-
    Mouse neurodegeneration needs a second, strain-specific lesion in a
    neuronal tRNA gene that patients do not carry, and ribosome profiling of
    GTPBP2-deficient patient fibroblasts found no stalling. The mouse also
    lacks the prenatal microcephaly, callosal agenesis and ectodermal features
    of the human disease. Pausing could still occur in human neurons whose own
    tRNA supply limits translation, which has not been tested.
  evidence:
  - reference: PMID:38118446
    reference_title: "Bi-allelic genetic variants in the translational GTPases GTPBP1 and GTPBP2 cause a distinct identical neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, using ribosome profiling, we did not observe any significant evidence of increased ribosome stalling or other translational defects in GTPBP2-deficient fibroblast cells."
    explanation: The patient-cell result that the mouse mechanism does not predict.
  proposed_experiments:
  - experiment_id: exp_jabels_ribosome_profiling_patient_neurons
    name: Ribosome profiling of GTPBP2-deficient human neurons
    description: >-
      Differentiate patient-derived or GTPBP2-knockout iPSCs into neurons,
      profile ribosome occupancy codon by codon, and compare with isogenic
      controls, with and without depleting a limiting tRNA.
    would_support:
    - pathophysiology#Unresolved Ribosome Pausing
    supporting_outcome:
    - Codon-specific pausing at codons read by tRNAs that are scarce in the neurons, absent in isogenic controls.
    refuting_outcome:
    - No pausing in GTPBP2-deficient neurons even when a tRNA is depleted.

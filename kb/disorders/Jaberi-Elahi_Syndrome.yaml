name: Jaberi-Elahi Syndrome
creation_date: "2026-11-11T07:18:07Z"
category: Mendelian
synonyms:
- JABELS
- Jaberi-Elahi syndrome
- GTPBP2-associated neuro-ectodermal syndrome
description: >-
  Jaberi-Elahi syndrome (JABELS) is an ultra-rare autosomal recessive
  neurodevelopmental and neurodegenerative disorder caused by biallelic
  loss-of-function variants in GTPBP2, a translational GTPase that binds the
  ribosome rescue protein Pelota and is thought to release ribosomes that pause
  when the tRNA for a codon is scarce. Most affected children come from
  consanguineous families. Motor and cognitive impairment begin in infancy and
  range from walking with an ataxic gait to absent motor control and speech,
  usually with microcephaly that can begin before birth, hypotonia, early
  seizures, spasticity, choreoathetoid movements, retinal dysfunction with
  visual impairment, cerebellar atrophy and, in some families, agenesis of the
  corpus callosum. Ectodermal features (sparse scalp hair, eyebrows and
  eyelashes, abnormal teeth), scoliosis and limb contractures are common. The
  ectodermal features and a peripheral neuropathy are most prominent in older
  individuals, and brain iron accumulation, found only in the first family,
  may appear only after childhood. Deficiency of the paralog GTPBP1 causes an
  identical syndrome. In mice, Gtpbp2 loss causes codon-specific ribosome
  stalling and neuron death only together with a strain-specific mutation in a
  neuronal tRNA gene, and no stalling was found in patient fibroblasts.
disease_term:
  preferred_term: Jaberi-Elahi syndrome
  term:
    id: MONDO:0060711
    label: Jaberi-Elahi syndrome
parents:
- Mendelian Neurodevelopmental Disorder
- Genetic Disease
notes: >-
  MONDO cross-references this disease as OMIM 617988. No GeneReviews chapter
  covers it (checked against the Bookshelf index of 2026-09-10), so the
  phenotypes come from case reports and reviews. Phenotype frequencies come
  from a 2024 review of 28 individuals with GTPBP2 variants (PMID:38852771).
  The largest clinical cohort (PMID:38118446) pools
  individuals with GTPBP1 and GTPBP2 variants and reports most counts for the
  pooled cohort; its counts are not given here as GTPBP2 frequencies, and its
  descriptions are used only where the authors state them for both genes. The
  GTPBP1 disease is a separate entry (NEDFET1, MONDO:0975745), kept apart
  because MONDO keeps the two apart. The ribosome-pausing mechanism is shown
  only in mice that also carry a strain-specific mutation in the neuronal tRNA
  gene n-Tr20, and ribosome profiling of GTPBP2-deficient patient fibroblasts
  found no stalling. Scoliosis and the craniofacial features have no proposed
  mechanism and are left unconnected in the causal graph.
inheritance:
- name: Autosomal recessive
  description: >-
    Affected individuals carry biallelic GTPBP2 variants, homozygous in most
    families, which are mostly consanguineous; one family was compound
    heterozygous for two nonsense variants.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: CGGV:assertion_c8e1f8d9-d8e8-428c-9860-f84bb96ff9ea-2024-08-16T160000.000Z
    reference_title: "GTPBP2 / Jaberi-Elahi syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The mode of inheritance is autosomal recessive; all but two of the reported affected families to date have been consanguineous."
    explanation: ClinGen's summary of the reported families.
  - reference: PMID:30790272
    reference_title: "Clinical delineation of GTPBP2-associated neuro-ectodermal syndrome: Report of two new families and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both families carry nonsense variants in GTPBP2: homozygous p.(Arg470*) and compound heterozygous p.(Arg432*)/p.(Arg131*)."
    explanation: Biallelic variants, homozygous in one family and compound heterozygous in the other.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2024 review counted 27 previously reported individuals, 28 with its own
    proband. This is a count of published cases, not a population rate.
  evidence:
  - reference: PMID:38852771
    reference_title: "Jaberi-Elahi syndrome: Exploring a novel GTPBP2 mutation and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hitherto, twenty-seven individuals with Jaberi-Elahi syndrome have been reported in the literature."
    explanation: Number of published cases.
pathophysiology:
- name: Loss of GTPBP2 Function
  description: >-
    Biallelic nonsense, frameshift and canonical splice-site variants remove or
    truncate GTPBP2; the founding splice variant deletes exon 9 and yields a
    protein lacking its conserved C-terminal domains. A few missense variants
    have also been reported. GTPBP2 is a cytoplasmic translational GTPase of
    the family that includes eEF1A, eRF3 and Hbs1, and binds the ribosome
    rescue protein Pelota. Its biochemical activity is not settled: purified
    GTPBP2 binds GTP weakly, and aminoacyl-tRNA stimulates the binding, but
    unlike its paralog GTPBP1 it has no elongation activity and does not
    stimulate exosomal mRNA decay.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GTPBP2
    term:
      id: hgnc:4670
      label: GTPBP2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: GTP binding
    modifier: DECREASED
    term:
      id: GO:0005525
      label: GTP binding
  downstream:
  - target: Unresolved Ribosome Pausing
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25061210
      reference_title: "RNA function. Ribosome stalling induced by mutation of a CNS-specific tRNA causes neurodegeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results not only define GTPBP2 as a ribosome rescue factor but also unmask the disease potential of mutations in nuclear-encoded tRNA genes."
      explanation: GTPBP2 acts as a ribosome rescue factor in mouse brain.
  - target: Abnormal Brain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The developmental features are established in patients, but how GTPBP2
      loss disturbs brain development is not known.
    evidence:
    - reference: PMID:30790272
      reference_title: "Clinical delineation of GTPBP2-associated neuro-ectodermal syndrome: Report of two new families and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Key features of this clinically recognizable condition include prenatal onset microcephaly, tone abnormalities, and movement disorders, epilepsy, dysmorphic features, retinal dysfunction, ectodermal dysplasia, and brain iron accumulation."
      explanation: Microcephaly of prenatal onset shows that brain development is affected.
  - target: Abnormal Ectodermal Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      No mechanism linking GTPBP2 to the development of hair, teeth, nails,
      skin or sweat glands has been studied.
    evidence:
    - reference: PMID:38118446
      reference_title: "Bi-allelic genetic variants in the translational GTPases GTPBP1 and GTPBP2 cause a distinct identical neurodevelopmental syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In individuals with variants in GTPBP1 and GTPBP2, distinct signs of abnormal ectodermal development such thin sparse hair, sparse eyebrows and eyelashes, abnormal nails, hand/feet anomalies, abnormal dentition (hypodontia), and abnormalities of skin pigmentation and sweat glands were all variably present."
      explanation: Ectodermal development is abnormal in individuals with variants in either gene.
  - target: Iron accumulation in brain
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Found only in the first family, examined as adults. Whether it follows
      from neuron loss or from another effect of GTPBP2 deficiency is not
      known.
  - target: Peripheral neuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported mainly in older individuals; its mechanism has not been
      studied.
  evidence:
  - reference: PMID:26675814
    reference_title: "Identification of mutation in GTPBP2 in patients of a family with neurodegeneration accompanied by iron deposition in the brain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation was empirically shown to cause deletion of exon 9 of the gene and result in production of a truncated protein-lacking conserved C-terminus domains."
    explanation: The founding splice variant produces a truncated protein.
  - reference: CGGV:assertion_c8e1f8d9-d8e8-428c-9860-f84bb96ff9ea-2024-08-16T160000.000Z
    reference_title: "GTPBP2 / Jaberi-Elahi syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The mechanism of disease appears to be loss of function, as most variants identified are truncations, frameshifts, or splice variants, though 5 missense variants have also been reported."
    explanation: ClinGen's reading of the variant spectrum as loss of function.
  - reference: PMID:38118446
    reference_title: "Bi-allelic genetic variants in the translational GTPases GTPBP1 and GTPBP2 cause a distinct identical neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "available fibroblast cell lines from affected individuals were used to perform semi-qPCR and western blot analyses, which identified significant reduction of both mRNA and protein levels, respectively, suggesting a LoF mechanism of the variants"
    explanation: >-
      Patient fibroblasts show reduced mRNA and protein. The cell lines came
      from the pooled GTPBP1 and GTPBP2 cohort.
  - reference: PMID:30108131
    reference_title: "Functions of unconventional mammalian translational GTPases GTPBP1 and GTPBP2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although GTPBP2's binding to GTP was stimulated by Phe-tRNAPhe, suggesting that its function might also involve interaction with aa-tRNA, GTPBP2 lacked elongation activity and did not stimulate exosomal degradation, indicating that GTPBP1 and GTPBP2 have different functions."
    explanation: GTPBP2 binds GTP, but lacks the elongation and exosome-stimulating activities of GTPBP1.
- name: Unresolved Ribosome Pausing
  description: >-
    GTPBP2 is thought to rescue ribosomes that pause when the tRNA for a codon
    is scarce. In Gtpbp2 mutant mice on the C57BL/6J background, which carries
    a processing mutation in the neuron-specific arginine tRNA gene n-Tr20,
    elongating ribosomes stall at AGA codons in the brain. Whether pausing
    occurs in human neurons is not known; it was not seen by ribosome
    profiling of fibroblasts from GTPBP2-deficient patients.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: rescue of stalled cytosolic ribosome
    modifier: DECREASED
    term:
      id: GO:0072344
      label: rescue of stalled cytosolic ribosome
  downstream:
  - target: Integrated Stress Response Activation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27085088
      reference_title: "Activation of GCN2 kinase by ribosome stalling links translation elongation with translation initiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Genetic experiments showed that this pathway was activated by the eIF2α kinase, GCN2, in an apparent deacylated tRNA-independent fashion."
      explanation: Stalled ribosomes activate the stress response through GCN2.
  - target: Reduced mTORC1 Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Neuronal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25061210
      reference_title: "RNA function. Ribosome stalling induced by mutation of a CNS-specific tRNA causes neurodegeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we discover that loss of GTPBP2, a novel binding partner of the ribosome recycling protein Pelota, in mice with a mutation in a tRNA gene that is specifically expressed in the central nervous system causes ribosome stalling and widespread neurodegeneration."
      explanation: Stalling and neurodegeneration occur together in the double-mutant mouse.
    - reference: PMID:38377989
      reference_title: "Cell-type-specific expression of tRNAs in the brain regulates cellular homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Surprisingly, the neurodegeneration induced by depletion of the tRNAIle(TAT) family in Gtpbp2−/− mice was less severe than that caused by the B6J mutation of tRNA-Arg-TCT-4–1 (n-Tr20 J/J), despite the pronounced reduction in the tRNAIle(TAT) pool in tRNA-Ile-TAT-2–3−/−, tRNA-Ile-TAT-1–1+/− mice."
      explanation: >-
        Depleting a different tRNA family in Gtpbp2 knockout mice also causes
        neurodegeneration, so loss of GTPBP2 sensitizes neurons to limiting
        tRNA supply beyond the n-Tr20 mutation.
  - target: Retinal Neuron Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:33186095
    reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "In the absence of Gtpbp2, translating ribosomes in the cerebellum exhibit prolonged pauses at AGA codons, suggesting GTPBP2 acts as a ribosome-rescue factor to resolve codon-specific ribosome pausing that occurs when the available pool of cognate tRNAs is limited."
    explanation: Codon-specific pausing in the Gtpbp2 mutant cerebellum.
  - reference: PMID:27085088
    reference_title: "Activation of GCN2 kinase by ribosome stalling links translation elongation with translation initiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To investigate these pathways we analyzed the brain of C57BL/6J-Gtpbp2(nmf205)(-/-) mice in which neuronal elongation complexes are stalled at AGA codons due to deficiencies in a tRNA(Arg)UCU tRNA and GTPBP2, a mammalian ribosome rescue factor."
    explanation: Stalling requires deficiency of both GTPBP2 and the arginine tRNA.
  - reference: PMID:38118446
    reference_title: "Bi-allelic genetic variants in the translational GTPases GTPBP1 and GTPBP2 cause a distinct identical neurodevelopmental syndrome."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "However, using ribosome profiling, we did not observe any significant evidence of increased ribosome stalling or other translational defects in GTPBP2-deficient fibroblast cells."
    explanation: >-
      No stalling in GTPBP2-deficient patient fibroblasts. The authors note
      that stalling may be specific to neurons or to stress conditions.
- name: Integrated Stress Response Activation
  description: >-
    In the brains of Gtpbp2 mutant mice, eIF2alpha phosphorylation rises
    before neurons degenerate and ATF4 targets are induced. The kinase GCN2
    drives this without the rise in uncharged tRNA that usually activates it.
    The response is protective: it attenuates neurodegeneration.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: integrated stress response signaling
    modifier: INCREASED
    term:
      id: GO:0140467
      label: integrated stress response signaling
  role: Compensatory
  evidence:
  - reference: PMID:27085088
    reference_title: "Activation of GCN2 kinase by ribosome stalling links translation elongation with translation initiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Increased levels of phosphorylation of eIF2α (Ser51) were detected prior to neurodegeneration in these mice and transcriptome analysis demonstrated activation of ATF4, a key transcription factor in the integrated stress response (ISR) pathway."
    explanation: The stress response is active before neuron loss.
  - reference: PMID:27085088
    reference_title: "Activation of GCN2 kinase by ribosome stalling links translation elongation with translation initiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Further we found that the ISR attenuates neurodegeneration in C57BL/6J-Gtpbp2(nmf205)(-/-) mice, underscoring the importance of cellular and stress context on the outcome of activation of this pathway."
    explanation: The stress response protects against neuron loss.
- name: Reduced mTORC1 Signaling
  description: >-
    In the hippocampus of Gtpbp2 and Gtpbp1 knockout mice, mTORC1 activity
    (read out as S6 phosphorylation) falls by about 90 percent. Inhibiting mTOR
    with rapamycin increases granule cell loss in the knockout cerebellum, so
    the fall in mTORC1 signaling worsens degeneration.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: TOR signaling
    modifier: DECREASED
    term:
      id: GO:0031929
      label: TOR signaling
  downstream:
  - target: Neuronal Degeneration

animal_models:
- name: B6J-Gtpbp2 nmf205 mouse
  species: Mouse
  genotype: Gtpbp2 nmf205 splice-site mutation, homozygous, on C57BL/6J, which is homozygous for the n-Tr20 tRNA processing mutation
  publication: PMID:25061210
  description: >-
    The nmf205 mutation, a splice-donor variant in intron 6 of Gtpbp2 that
    arose on the C57BL/6J strain, causes ataxia and degeneration of cerebellar,
    hippocampal, cortical and retinal neurons. The degeneration depends on the
    strain's processing mutation in n-Tr20, a neuron-specific arginine tRNA
    gene.
  modeled_mechanisms:
  - target: Unresolved Ribosome Pausing
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: MOLECULAR
    description: Elongating ribosomes stall at AGA codons in the mutant brain.
    limitations: >-
      Stalling needs the strain's n-Tr20 tRNA mutation, which patients do not
      carry, and was not found in fibroblasts from GTPBP2-deficient patients.
    evidence:
    - reference: PMID:27085088
      reference_title: "Activation of GCN2 kinase by ribosome stalling links translation elongation with translation initiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To investigate these pathways we analyzed the brain of C57BL/6J-Gtpbp2(nmf205)(-/-) mice in which neuronal elongation complexes are stalled at AGA codons due to deficiencies in a tRNA(Arg)UCU tRNA and GTPBP2, a mammalian ribosome rescue factor."
      explanation: Codon-specific stalling in the model.
  - target: Neuronal Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Progressive, region-specific neuron loss with ataxia.
    limitations: >-
      The degeneration begins after weaning and depends on a second,
      strain-specific tRNA mutation. The model does not show the prenatal
      microcephaly, callosal agenesis or ectodermal features of the human
      syndrome.
    evidence:
    - reference: CGGV:assertion_c8e1f8d9-d8e8-428c-9860-f84bb96ff9ea-2024-08-16T160000.000Z
      reference_title: "GTPBP2 / Jaberi-Elahi syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "including a mouse model with a splice donor variant in intron 6 of gtpbp2 which recapitulates the cerebellar, retinal, and gait abnormalities found in humans"
      explanation: ClinGen counts the mouse as recapitulating the cerebellar, retinal and gait features.
  - target: Retinal Neuron Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Retinal neurons degenerate in the mutant.
    limitations: >-
      Shown in mice that also carry the n-Tr20 mutation; human retinal
      histology has not been reported.
    evidence:
    - reference: PMID:33186095
      reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "As previously observed in B6J-Gtpbp2-/- mice, granule cells in the DG, layer IV cortical neurons and multiple neurons in the retina degenerated in B6J.Gtpbp1-/- mice"
      explanation: Retinal neurons degenerate in Gtpbp2 mutant mice.
- name: Labrador retriever GTPBP2 p.Ala536del
  species: Dog
  genotype: GTPBP2 c.1606_1608del (p.Ala536del), homozygous
  publication: PMID:39971978
  description: >-
    A naturally occurring, non-syndromic progressive retinal atrophy in three
    littermates homozygous for an in-frame GTPBP2 deletion. The dogs had no
    neurological or external morphological abnormalities.
  modeled_mechanisms:
  - target: Retinal Neuron Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Progressive photoreceptor degeneration.
    limitations: >-
      The allele deletes one residue outside the GTP-binding domain and makes
      the protein form cytoplasmic aggregates in transfected cells rather than
      removing it, and the dogs have no neurological disease, so this is a
      retina-only model of a different allele class.
    evidence:
    - reference: PMID:39971978
      reference_title: "GTPBP2 in-frame deletion in canine model with non-syndromic progressive retinal atrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygosity mapping and whole-genome sequencing detected a homozygous 3-bp deletion in the coding region of GTPBP2, located in CFA12"
      explanation: The retinal atrophy segregates with a homozygous GTPBP2 deletion.
    - reference: PMID:39971978
      reference_title: "GTPBP2 in-frame deletion in canine model with non-syndromic progressive retinal atrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, the affected dogs had no neurologic or external morphologic abnormalities (Table 3)."
      explanation: The canine disease is confined to the retina.
    - reference: PMID:39971978
      reference_title: "GTPBP2 in-frame deletion in canine model with non-syndromic progressive retinal atrophy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Immunofluorescent methods and confocal analysis of cells transfected with WT or A536del GTPBP2 protein revealed that the WT form is diffuse throughout the cytosol, while the mutant form resulted in the formation of cytoplasmic aggregates in ~70-80% of cells."
      explanation: The canine allele mislocalizes the protein rather than abolishing it.

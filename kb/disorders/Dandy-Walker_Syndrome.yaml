- name: Cerebellar Vermis Hypoplasia with Upward Rotation
  description: >-
    The defining structural lesion: hypoplasia of the cerebellar vermis
    predominantly affecting its inferior portion, with the residual cerebellum
    rotated upward away from the brainstem so that the tentorium and torcula sit
    high. Modern quantitative imaging work has reduced the criteria to inferior
    predominant vermian hypoplasia, an enlarged tegmentovermian angle,
    inferolateral displacement of the tela choroidea and choroid plexus, an
    obtuse fastigial recess and an unpaired caudal lobule, and has argued that
    posterior fossa size and torcular location should be dropped.
  biological_scale: TISSUE

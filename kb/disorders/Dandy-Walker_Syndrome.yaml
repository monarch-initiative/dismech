pathophysiology:
- name: ZIC1/ZIC4 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygous interstitial deletion of chromosome 3q removes the two
    adjacent zinc-finger transcription-factor genes ZIC1 and ZIC4 together.
    Sources place the interval differently (Grinberg 2004 reports "3q2"
    deletions; Watts 2026 writes 3q25.1, while HGNC assigns ZIC1 to 3q24), so no
    single sub-band is asserted here. This
    was the first critical region mapped for DWM, and the loss is of both linked
    genes rather than either alone — a contiguous-gene effect, not a single-gene
    one. It is mechanistically distinct from the intragenic final-exon ZIC1
    variants that act by gain of function and produce craniosynostosis rather
    than DWM.
  genes:
  - preferred_term: ZIC1
    term:
      id: hgnc:12872
      label: ZIC1
  - preferred_term: ZIC4
    term:
      id: hgnc:20393
      label: ZIC4
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Rhombic Lip and Roof Plate Patterning Failure
    causal_link_type: DIRECT
    description: >-
      ZIC1/ZIC4 dosage is required in the developing cerebellar anlage; halving
      it disrupts the dorsal patterning programme that specifies the rhombic
      lip and the fourth-ventricular roof plate.
  - target: Reduced Granule Cell Progenitor Proliferation
    causal_link_type: DIRECT
    description: >-
      Zic1/Zic4 act partly through Sonic hedgehog output to drive granule cell
      progenitor proliferation, so haploinsufficiency reduces that proliferation
      directly rather than only via the patterning defect.
    evidence:
    - reference: PMID:21307096
      reference_title: "Multiple developmental programs are altered by loss of Zic1 and Zic4 to cause Dandy-Walker malformation cerebellar pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Through genetic and molecular analyses, we show that Zic1 and Zic4 have
        Shh-dependent function promoting proliferation of granule cell
        progenitors.
      explanation: >-
        Names the Shh-dependent route from Zic1/Zic4 dosage to granule cell
        progenitor proliferation, which is the edge asserted here.
  evidence:
  - reference: PMID:15338008
    reference_title: "Heterozygous deletion of the linked genes ZIC1 and ZIC4 is involved in Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through physical mapping of 3q2 interstitial deletions in several
      individuals with DWM, we defined the first critical region associated with
      DWM, encompassing two adjacent Zinc finger in cerebellum genes, ZIC1 and
      ZIC4.
    explanation: >-
      Maps the human deletions in DWM to the linked ZIC1/ZIC4 pair, establishing
      the locus this node names.
  - reference: PMID:42028696
    reference_title: "Expanding the phenotypic spectrum associated with ZIC1 variants: A neurodevelopmental disorder with and without craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous deletions encompassing ZIC1 and ZIC4 cause Dandy-Walker
      malformation, whilst in the final exon heterozygous ZIC1 variants result
      in a distinct phenotype of craniosynostosis with variable intellectual
      disability via a gain-of-function mechanism.
    explanation: >-
      Supports both halves of this node: the contiguous ZIC1+ZIC4 deletion as
      the DWM mechanism, and the separation of that from the gain-of-function
      intragenic ZIC1 allele class, which does not cause DWM.
- name: FOXC1-Dependent Posterior Fossa Mesenchymal Signalling Failure
  biological_scale: MOLECULAR
  description: >-
    Deletions or duplications of chromosome 6p25.3 encompassing FOXC1, and
    intragenic FOXC1 variants, alter forkhead-box C1 dosage in the
    posterior-fossa mesenchyme and
    its meningeal derivatives. The measured consequence is on
    mesenchyme-expressed secreted signals (Tgfb1, SDF1a, Bmp2, Bmp4) and not on
    neural-tube gene expression, so the lesion acts on the cerebellum
    non-cell-autonomously, by changing the signalling environment the meninges
    present to it. This is the second causal locus for DWM and reaches the same
    downstream node as ZIC1/ZIC4 from the opposite side of the
    neuroepithelial-mesenchymal interface.
  genes:
  - preferred_term: FOXC1
    term:
      id: hgnc:3800
      label: FOXC1
  cell_types:
  - preferred_term: posterior fossa meningeal (meningothelial) cell
    term:
      id: CL:0002379
      label: meningothelial cell
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Rhombic Lip and Roof Plate Patterning Failure
    causal_link_type: DIRECT
    description: >-
      Reduced FOXC1 activity lowers expression of mesenchyme-derived secreted
      signals that the cerebellar rhombic lip and roof plate depend on, so the
      patterning failure follows from a defect outside the neuroepithelium.
    evidence:
    - reference: PMID:28092268
      reference_title: "Phenotypic outcomes in Mouse and Human Foxc1 dependent Dandy-Walker cerebellar malformation suggest shared mechanisms."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Foxc1 reduction decreases hindbrain mesenchyme expressed genes (Tgfb1,
        SDF1α, Bmp2 and Bmp4), but not neural tube expressed genes (Fgf15 and
        Cxcr4).
      explanation: >-
        Shows the effect of reduced Foxc1 is on mesenchyme-expressed secreted
        signals and not on neural-tube gene expression, which is precisely the
        non-cell-autonomous route this edge asserts.
    - reference: PMID:19668217
      reference_title: "FOXC1 is required for normal cerebellar development and is a major contributor to chromosome 6p25.3 Dandy-Walker malformation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Foxc1-null mice have embryonic abnormalities of the rhombic lip due to
        loss of mesenchyme-secreted signaling molecules with subsequent loss of
        Atoh1 expression in vermis.
      explanation: >-
        States this edge end to end in one sentence: loss of mesenchyme-secreted
        signals produces rhombic lip abnormality, with the vermian consequence
        named as the next step.
  evidence:
  - reference: PMID:28092268
    reference_title: "Phenotypic outcomes in Mouse and Human Foxc1 dependent Dandy-Walker cerebellar malformation suggest shared mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analyses of rare human del chr 6p25 fetal cerebella demonstrate extensive
      phenotypic overlap with our Foxc1 mutant mouse models, validating our DWM
      models and demonstrating that many key mechanisms controlling cerebellar
      development are likely conserved between mouse and human.
    explanation: >-
      Anchors the FOXC1 mechanism in human del 6p25 fetal cerebellar tissue, not
      only in mouse.
  - reference: PMID:28092268
    reference_title: "Phenotypic outcomes in Mouse and Human Foxc1 dependent Dandy-Walker cerebellar malformation suggest shared mechanisms."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Further, our analyses clearly demonstrate that competent meningeal
      signaling is required for multiple aspects of prenatal and postnatal
      cerebellar development.
    explanation: >-
      States the meningeal-signalling dependency that makes this a mesenchymal
      rather than a neuroepithelial lesion.
  - reference: PMID:19668217
    reference_title: "FOXC1 is required for normal cerebellar development and is a major contributor to chromosome 6p25.3 Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we characterize a second DWM-linked locus on 6p25.3, showing that
      deletions or duplications encompassing FOXC1 are associated with
      cerebellar and posterior fossa malformations including cerebellar vermis
      hypoplasia (CVH), mega-cisterna magna (MCM) and DWM.
    explanation: >-
      Establishes 6p25.3/FOXC1 as the second DWM locus and records that both
      deletions and duplications are implicated, which is why this node is
      described as a dosage change rather than as loss alone.
  - reference: PMID:19668217
    reference_title: "FOXC1 is required for normal cerebellar development and is a major contributor to chromosome 6p25.3 Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results highlight a previously unrecognized role for
      mesenchyme-neuroepithelium interactions in the mid-hindbrain during early
      embryogenesis.
    explanation: >-
      Names the mesenchyme-neuroepithelium interaction that this node and the
      ZIC1/ZIC4 node sit on opposite sides of.
- name: Rhombic Lip and Roof Plate Patterning Failure
  biological_scale: TISSUE
  description: >-
    Convergent node. Disrupted specification and maintenance of the cerebellar
    rhombic lip and the fourth-ventricular roof plate, reached either from
    ZIC1/ZIC4 haploinsufficiency within the neuroepithelium or from failed
    FOXC1-dependent mesenchymal signalling outside it. In humans the rhombic lip
    is the progenitor source for the posterior vermis specifically, which is why
    a patterning failure here produces a posterior-predominant vermian defect
    rather than global cerebellar hypoplasia.
  biological_processes:
  - preferred_term: roof plate formation
    term:
      id: GO:0021509
      label: roof plate formation
    modifier: ABNORMAL
  - preferred_term: hindbrain development
    term:
      id: GO:0030902
      label: hindbrain development
    modifier: ABNORMAL
  cell_types:
  - preferred_term: rhombic lip neuroepithelial progenitor
    term:
      id: CL:0002259
      label: neuroepithelial stem cell
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Cerebellar Vermis Hypoplasia with Upward Rotation
    causal_link_type: DIRECT
    description: >-
      Rhombic lip disruption maps onto the posterior vermis, which is the
      segment hypoplastic in DWM.
    evidence:
    - reference: PMID:31624095
      reference_title: "Spatiotemporal expansion of primary progenitor zones in the developing human cerebellum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Disruptions in human rhombic lip development are associated with
        posterior cerebellar vermis hypoplasia and Dandy-Walker malformation.
      explanation: >-
        States the rhombic-lip-to-vermian-hypoplasia link in human tissue, which
        is the causal step this edge records.
  evidence:
  - reference: PMID:31624095
    reference_title: "Spatiotemporal expansion of primary progenitor zones in the developing human cerebellum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disruptions in human rhombic lip development are associated with
      posterior cerebellar vermis hypoplasia and Dandy-Walker malformation.
    explanation: >-
      Identifies the rhombic lip as the developmental compartment whose
      disruption underlies DWM.
  - reference: PMID:20498066
    reference_title: "Lmx1a regulates fates and location of cells originating from the cerebellar rhombic lip and telencephalic cortical hem."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      In the developing cerebellum, Lmx1a is expressed in the roof plate, where
      it is required to segregate the roof plate lineage from neuronal rhombic
      lip derivatives.
    explanation: >-
      Supports coupling the roof plate and the rhombic lip in one node: the same
      transcription factor partitions the two lineages. Indirect because the
      study is of normal rhombic lip biology in mouse rather than of DWM.
  - reference: PMID:20498066
    reference_title: "Lmx1a regulates fates and location of cells originating from the cerebellar rhombic lip and telencephalic cortical hem."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      This overmigration is associated with premature regression of the rhombic
      lip and posterior vermis hypoplasia in Lmx1a(-/-) mice.
    explanation: >-
      Shows that failure of the rhombic lip programme produces posterior vermis
      hypoplasia specifically, the regional selectivity this node asserts.
      Indirect because Lmx1a is not itself a known human DWM locus.
- name: Reduced Granule Cell Progenitor Proliferation
  biological_scale: CELLULAR
  description: >-
    Decreased proliferation of cerebellar granule cell progenitors, demonstrated
    in Zic1/Zic4 mutant mice and mediated in part through reduced Sonic hedgehog
    pathway output (downregulated Ptch1, Gli1 and Mycn) despite normal Shh
    production. This is the cell-level deficit that translates the patterning
    failure into a smaller cerebellum. In Foxc1 mutants the granule-cell
    abnormality is one of migration and position as well as number.
  cell_types:
  - preferred_term: cerebellar granule cell precursor
    term:
      id: CL:0002362
      label: cerebellar granule cell precursor
  biological_processes:
  - preferred_term: cerebellar granule cell precursor proliferation
    term:
      id: GO:0021930
      label: cerebellar granule cell precursor proliferation
    modifier: DECREASED
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: DECREASED
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Cerebellar Vermis Hypoplasia with Upward Rotation
    causal_link_type: DIRECT
    description: >-
      Reduced granule cell progenitor proliferation is the demonstrated cause of
      the reduced cerebellar size in the Zic1/Zic4 model.
    evidence:
    - reference: PMID:21307096
      reference_title: "Multiple developmental programs are altered by loss of Zic1 and Zic4 to cause Dandy-Walker malformation cerebellar pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we show that reduced cerebellar size in Zic1 and Zic4 mutants
        results from decreased postnatal granule cell progenitor proliferation.
      explanation: >-
        Attributes the size reduction specifically to decreased granule cell
        progenitor proliferation, which is the causal claim on this edge.
  evidence:
  - reference: PMID:21307096
    reference_title: "Multiple developmental programs are altered by loss of Zic1 and Zic4 to cause Dandy-Walker malformation cerebellar pathogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that reduced cerebellar size in Zic1 and Zic4 mutants
      results from decreased postnatal granule cell progenitor proliferation.
    explanation: >-
      Establishes the proliferation deficit itself in the ZIC-deletion model of
      DWM.
- name: Cerebellar Vermis Hypoplasia with Upward Rotation
  biological_scale: TISSUE
  description: >-
    Complete or partial agenesis of the cerebellar vermis, predominantly its
    posterior segment, with the residual vermis rotated upward over the
    posterior-fossa cyst. The associated dysplastic, extended posterior vermis
    with an indistinct choroid plexus is the DWM "tail sign", and a hypomorphic
    Foxc1 mouse reproduces it as a partially formed posterior lobule.
  locations:
  - preferred_term: cerebellar vermis
    term:
      id: UBERON:0004720
      label: cerebellar vermis
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Cystic Dilatation of the Fourth Ventricle and Posterior Fossa Enlargement
    causal_link_type: DIRECT
    description: >-
      Absence of the vermian floor leaves the fourth ventricle open dorsally and
      continuous with the retrocerebellar space, which is what allows it to
      balloon into a posterior-fossa cyst.
  - target: Cerebellar vermis hypoplasia
    causal_link_type: DIRECT
    description: The imaging and clinical expression of this mechanism node.
  evidence:
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DWM is diagnosed by neuroimaging and is defined by a complete or partial
      agenesis of the cerebellar vermis, cystic dilation of the fourth
      ventricle, and enlargement of the posterior fossa with elevation of the
      torcula
    explanation: >-
      Places vermian agenesis at the centre of the diagnostic definition of DWM.
  - reference: PMID:28092268
    reference_title: "Phenotypic outcomes in Mouse and Human Foxc1 dependent Dandy-Walker cerebellar malformation suggest shared mechanisms."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Particularly striking is the presence of a partially formed posterior
      lobule which echoes the posterior vermis DW 'tail sign' observed in human
      imaging studies.
    explanation: >-
      Ties the posterior-predominant vermian defect described here to the
      pathognomonic human tail sign via the Foxc1 hypomorph.
- name: Cystic Dilatation of the Fourth Ventricle and Posterior Fossa Enlargement
  biological_scale: TISSUE
  description: >-
    The fourth ventricle expands into a cyst continuous with the posterior
    fossa, which enlarges with upward displacement of the torcula and tentorium
    and thinning of the overlying occipital bone. Together with the vermian
    defect this completes the imaging triad that defines the malformation.
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Obstruction of Fourth Ventricular CSF Outflow
    causal_link_type: DIRECT
    description: >-
      The cyst and the maldeveloped fourth-ventricular roof obstruct outflow at
      the level of the fourth ventricle and its outlets rather than at the
      aqueduct.
  - target: Enlarged posterior fossa
    causal_link_type: DIRECT
    description: The imaging expression of this mechanism node.
  - target: Dilated fourth ventricle
    causal_link_type: DIRECT
    description: The imaging expression of this mechanism node.
  evidence:
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DWM is diagnosed by neuroimaging and is defined by a complete or partial
      agenesis of the cerebellar vermis, cystic dilation of the fourth
      ventricle, and enlargement of the posterior fossa with elevation of the
      torcula
    explanation: >-
      States the cystic fourth-ventricular dilatation and posterior-fossa
      enlargement that this node names.
- name: Obstruction of Fourth Ventricular CSF Outflow
  biological_scale: ORGANISM
  description: >-
    Impaired egress of cerebrospinal fluid from the fourth ventricle. Because
    the block is distal — at the fourth ventricle and its outlets rather than at
    the aqueduct — the supratentorial ventricles and the posterior-fossa cyst
    behave largely as one compartment, which is why a single shunt can control
    both. Decompensation of this node is what separates the with-hydrocephalus
    from the without-hydrocephalus subtype.
  biological_processes:
  - preferred_term: cerebrospinal fluid circulation
    term:
      id: GO:0090660
      label: cerebrospinal fluid circulation
    modifier: DECREASED
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Hydrocephalus
    causal_link_type: DIRECT
    description: >-
      Failure of fourth-ventricular outflow produces progressive ventricular
      enlargement in roughly 80% of affected children.
    evidence:
    - reference: PMID:42432063
      reference_title: "Quantitative ventricular volume changes after endoscopic third ventriculostomy in children with Dandy-Walker malformation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hydrocephalus occurs in up to 80% of children with Dandy-Walker
        malformation (DWM).
      explanation: >-
        Quantifies how often the outflow lesion decompensates into clinical
        hydrocephalus.
  evidence:
  - reference: PMID:21928031
    reference_title: "Hydrocephalus in Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among therapeutical strategies, single shunting (ventriculo-peritoneal or
      cyst-peritoneal shunts) appears effective in the control of both ventricle
      and cyst size.
    explanation: >-
      That one shunt controls both compartments is the clinical signature of a
      single distal outflow block, which is what this node asserts.
    directness: INDIRECT

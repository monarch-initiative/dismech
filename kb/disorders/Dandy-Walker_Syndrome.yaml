    preferred_term: Hypoplasia of the pons
    term:
      id: HP:0012110
      label: Hypoplasia of the pons
  evidence:
  - reference: PMID:37591769
    reference_title: "Dandy-Walker Phenotype with Brainstem Involvement: 2 Distinct Subgroups with Different Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically, patients with the severe form had significantly increased rates
      of bulbar dysfunction, seizures, and mortality.
    explanation: >-
      Establishes the prognostic weight of the brainstem subgroup this phenotype
      belongs to.
- category: Ophthalmological
  name: Posterior embryotoxon
  description: >-
    Anterior segment dysgenesis seen with FOXC1 loss at 6p25, not with DWM in
    general. Its presence in a child with DWM is a pointer to the 6p25 deletion
    and to glaucoma risk.
  context: FOXC1 / 6p25 deletion syndrome
  phenotype_term:
    preferred_term: Posterior embryotoxon
    term:
      id: HP:0000627
      label: Posterior embryotoxon
  evidence:
  - reference: PMID:22497499
    reference_title: "Chromosome 6p25 deletion syndrome: report of a case with optic disc coloboma and review of published ophthalmic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ophthalmic examination showed bilateral corectopia associated with
      posterior embryotoxon.
    explanation: >-
      Documents posterior embryotoxon in a child with DWM and a FOXC1-containing
      6p25 deletion.
- category: Ophthalmological
  name: Glaucoma
  description: >-
    Glaucoma risk travels with the FOXC1 arm of the disease through
    Axenfeld-Rieger-type anterior segment dysgenesis. It is a reason to refer a
    child with DWM and dysmorphic features for ophthalmological assessment rather
    than a feature of DWM as such.
  context: FOXC1 / 6p25 deletion syndrome
  phenotype_term:
    preferred_term: Glaucoma
    term:
      id: HP:0000501
      label: Glaucoma
  evidence:
  - reference: PMID:22497499
    reference_title: "Chromosome 6p25 deletion syndrome: report of a case with optic disc coloboma and review of published ophthalmic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 6p25 deletion syndrome is a rare disorder characterized by Dandy-Walker
      malformation, congenital heart defects, developmental delay, dysmorphic
      facial features, and malformations of the anterior segment of the eye with
      a risk for glaucoma.
    explanation: >-
      States the glaucoma risk within the 6p25 deletion syndrome that carries
      DWM.
- category: Ophthalmological
  name: Cataract
  description: >-
    Reported among the eye and ear comorbidities of DWS. The ascertainment base
    is published case reports rather than a patient series, so the share is a
    floor on what gets written up rather than a population figure. Mechanistic
    context is likely the FOXC1 / 6p25 anterior segment arm, which the entry
    already carries as posterior embryotoxon and glaucoma, but the review does
    not resolve its cases by genotype and the association is therefore recorded
    without one.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
  evidence:
  - reference: PMID:28635420
    reference_title: "The Most Common Comorbidities in Dandy-Walker Syndrome Patients: A Systematic Review of Case Reports."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One-third of cases had a chromosomal abnormality or syndrome (n = 8
      PHACE), 27% had a cardiovascular condition (n = 7 Patent Ductus
      Arteriosus), 24% had a disease of eye and ear (n = 9 cataract)
    explanation: >-
      Nine cataract cases among 187 patients, which is where the OCCASIONAL band
      comes from.
- category: Cardiovascular
  name: Congenital heart defect
  description: >-
    Structural cardiac malformation accompanying the posterior fossa lesion,
    most often patent ductus arteriosus but also ventricular septal defect and
    tetralogy of Fallot. It is one of the associated anomalies that moves a case
    out of the isolated category, and it is part of what the 6p25 deletion
    syndrome carries alongside DWM. Bound to the general HPO heart morphology
    term because the reported lesions are several and no single one dominates.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Congenital heart defect
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  evidence:
  - reference: PMID:36068432
    reference_title: "Dandy-Walker malformation and variants: clinical features and associated anomalies in 28 affected children-a single retrospective study and a review of the literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac abnormalities were seen in 3 (10%); cardiac defect consisted of
      patent ductus arteriosus, ventricular septal defect, and Fallot's
      tetralogy.
    explanation: >-
      Gives the frequency and names the specific lesions in a 28-child cohort,
      which is why the binding is to the general heart morphology term.
  - reference: PMID:1863935
    reference_title: "Dandy-Walker malformation: analysis of 38 cases."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several associated malformations were observed, the most frequent being
      capillary angioma (6 cases); cardiac malformations, ophthalmic anomalies,
      agenesis of the corpus callosum, malformed limbs, and occipital
      meningocele were also seen.
    explanation: >-
      Independent confirmation of cardiac malformation among the associated
      anomalies, in a separate 38-case series.
genetic:
- name: ZIC1
  notes: >-
    Zinc finger of the cerebellum 1, at 3q24, immediately adjacent to ZIC4. The
    human lesion is a contiguous deletion removing both, so neither gene has been
    separated from the other in a patient; the mouse work likewise uses a double
    heterozygote. Treat ZIC1 and ZIC4 as one locus for curation purposes.
  gene_term:
    preferred_term: ZIC1
    term:
      id: hgnc:12872
      label: ZIC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:15338008
    reference_title: Heterozygous deletion of the linked genes ZIC1 and ZIC4 is involved in Dandy-Walker malformation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through physical mapping of 3q2 interstitial deletions in several
      individuals with DWM, we defined the first critical region associated with
      DWM, encompassing two adjacent Zinc finger in cerebellum genes, ZIC1 and
      ZIC4.
    explanation: >-
      Establishes ZIC1 as one of the two genes in the first mapped DWM critical
      region.
- name: ZIC4
  notes: >-
    Zinc finger of the cerebellum 4, at 3q24, deleted together with ZIC1 in
    human DWM. See the note on ZIC1.
  gene_term:
    preferred_term: ZIC4
    term:
      id: hgnc:20393
      label: ZIC4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:15338008
    reference_title: Heterozygous deletion of the linked genes ZIC1 and ZIC4 is involved in Dandy-Walker malformation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through physical mapping of 3q2 interstitial deletions in several
      individuals with DWM, we defined the first critical region associated with
      DWM, encompassing two adjacent Zinc finger in cerebellum genes, ZIC1 and
      ZIC4.
    explanation: >-
      Establishes ZIC4 as the second gene in the first mapped DWM critical
      region.
- name: FOXC1
  notes: >-
    Forkhead box C1 at 6p25.3, the second mapped DWM locus. The same gene causes
    Axenfeld-Rieger syndrome through heterozygous mutation, and the KB already
    carries that entry along with Congenital Glaucoma and the
    anterior_segment_dysgenesis module; this entry adds the cerebellar arm rather
    than restating the ocular one. Duplications as well as deletions are
    associated with posterior fossa malformation. In prenatally ascertained
    "isolated" DWM, subtelomeric 6p deletion is a recurrent cryptic finding, so
    an apparently isolated case still warrants array testing.
  gene_term:
    preferred_term: FOXC1
    term:
      id: hgnc:3800
      label: FOXC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:19668217
    reference_title: FOXC1 is required for normal cerebellar development and is a major contributor to chromosome 6p25.3 Dandy-Walker malformation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that alteration of FOXC1 function alone causes CVH and
      contributes to MCM and DWM.
    explanation: >-
      States the gene-disease conclusion, including that FOXC1 alone is
      sufficient for cerebellar vermis hypoplasia.
  - reference: PMID:22418964
    reference_title: "Prenatal diagnosis of 'isolated' Dandy-Walker malformation: imaging findings and prenatal counselling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also emphasise the potential high incidence of subtelomeric anomalies in
      isolated DWM, especially 6p deletion.
    explanation: >-
      Supports testing for 6p deletion even when the malformation appears
      isolated on imaging.
- name: NID1
  notes: >-
    Nidogen-1, an extracellular matrix protein. Mutations cause autosomal
    dominant Dandy-Walker malformation with occipital cephalocele (ADDWOC),
    which MONDO carries as its own disease (MONDO:0012218) rather than as a
    descendant of MONDO:0009072. Recorded here because the ECM route converges
    on the same meningeal compartment as FOXC1; see differential_diagnoses.
  gene_term:
    preferred_term: NID1
    term:
      id: hgnc:7821
      label: NID1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:23674478
    reference_title: Mutations in extracellular matrix genes NID1 and LAMC1 cause autosomal dominant Dandy-Walker malformation and occipital cephaloceles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed whole-exome sequencing of a family with autosomal dominant
      Dandy-Walker malformation and occipital cephaloceles and detected a
      mutation in the extracellular matrix (ECM) protein-encoding gene NID1.
    explanation: >-
      The founding NID1 gene-disease report for the dominant cephalocele
      phenotype.
- name: LAMC1
  notes: >-
    Laminin subunit gamma-1, a NID1 binding partner. Identified through protein
    interaction network analysis in a second ADDWOC family after NID1 sequencing
    was negative, which is why the two genes are reported together. Note the KB
    also carries LAMB1-Related Cobblestone Lissencephaly, a different
    laminin-subunit disease; the genes and the malformations are distinct.
  gene_term:
    preferred_term: LAMC1
    term:
      id: hgnc:6492
      label: LAMC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:23674478
    reference_title: Mutations in extracellular matrix genes NID1 and LAMC1 cause autosomal dominant Dandy-Walker malformation and occipital cephaloceles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a second family, protein interaction network analysis identified a
      mutation in LAMC1, which encodes a NID1-binding partner.
    explanation: >-
      Establishes LAMC1 as the second ADDWOC gene and the route by which it was
      found.
- name: FGF17
  notes: >-
    Fibroblast growth factor 17 at 8p21.3, a mid-hindbrain patterning factor
    whose disruption in mice produces cerebellar vermis abnormalities. Recorded
    at UNKNOWN rather than CAUSATIVE, which is the difference between this gene
    and the four above it. The human evidence is one girl with a de novo 2.3-Mb
    8p21.2-p21.3 deletion and classical DWM in whom FGF17 was markedly
    downregulated, but FGF17 sits 1 Mb outside the deleted interval and was
    implicated by expression rather than by sequence, so it is a position effect
    argued from a single case. A 2024 review of the gene reaches the same place,
    stating that how FGF17 is implicated in DWM remains unclear.
  gene_term:
    preferred_term: FGF17
    term:
      id: hgnc:3673
      label: FGF17
  relationship_type: UNKNOWN
  variant_origin: DE_NOVO
  evidence:
  - reference: PMID:21484435
    reference_title: "FGF17, a gene involved in cerebellar development, is downregulated in a patient with Dandy-Walker malformation carrying a de novo 8p deletion."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a de novo 2.3-Mb deletion of chromosome 8p21.2-p21.3 in
      a girl with severe growth retardation, seizures, and classical
      Dandy-Walker malformation. Analysis of gene expression in blood lymphocytes
      and skin fibroblasts revealed markedly reduced levels of FGF17, which is
      located 1 Mb from the proximal deletion breakpoint.
    explanation: >-
      The founding and, as far as this curation found, the only human report
      connecting FGF17 to DWM. It is one patient, and the gene is outside the
      deletion, which is why the relationship is recorded as UNKNOWN.
  - reference: PMID:39327214
    reference_title: "Fgf17: A regulator of the mid/hind brain boundary in mammals."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      FGF17 mutations were also identified in patients diagnosed with
      Dandy-Walker malformation and Pituitary Stalk Interruption Syndrome,
      however, it remains unclear how FGF17 is implicated in these diseases.
    explanation: >-
      A recent gene-focused review that both records the DWM association and
      states its unresolved status, which is the claim the UNKNOWN relationship
      type makes.
prevalence:
- population: Europe (EUROCAT registries, 28 registries in 17 countries, 2002-2015)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 6.79
  rate_low: 5.79
  rate_high: 7.96
  rate_denominator: LIVE_BIRTHS
  notes: >-
    6.79 per 100,000 births over 8,028,454 surveyed births, all birth outcomes
    included. Live-birth prevalence is much lower at 2.74 per 100,000 because
    56.5% of cases ended in termination after prenatal diagnosis, so the two
    figures answer different questions and must not be compared with each other
    or with a live-birth-only estimate.
  evidence:
  - reference: PMID:31302658
    reference_title: "Epidemiology of Dandy-Walker Malformation in Europe: A EUROCAT Population-Based Registry Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall prevalence of DW malformation was 6.79 per 100,000 births (95%
      CI 5.79-7.96) with 39.2% livebirths, 4.3% foetal deaths from 20 weeks
      gestational age, and 56.5% terminations of pregnancy after prenatal
      diagnosis of foetal anomaly at any gestation (TOPFA).
    explanation: >-
      The population-based prevalence figure with its confidence interval and
      the birth-outcome breakdown that explains the gap to live-birth
      prevalence.
- population: Worldwide, review estimate
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.3
  rate_low: 2.9
  rate_high: 4.0
  rate_denominator: LIVE_BIRTHS
  notes: >-
    The commonly quoted textbook range of 1 in 25,000 to 35,000 live births,
    normalized to 2.9-4.0 per 100,000. Other reviews quote 1 in 10,000 to 30,000.
    These are review estimates without a stated denominator population, so they
    are recorded separately from the EUROCAT registry figure and not pooled with
    it.
  evidence:
  - reference: PMID:40445443
    reference_title: "Dandy-Walker syndrome: an updated literature review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      DWS, occurring in 1 in 25,000 to 35,000 live births, often presents with
      hydrocephalus and other central nervous system anomalies.
    explanation: >-
      The 1 in 25,000-35,000 review estimate that the normalized rate is derived
      from.
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dandy-Walker malformation (DWM) is a rare congenital abnormality of the
      posterior fossa and the cerebellum and has an incidence of 1 in 10 000 to
      30 000 births.
    explanation: >-
      A competing quoted range from a different review lineage, recorded so the
      spread between published estimates is visible rather than hidden.
progression:
- phase: Prenatal detection
  notes: >-
    Most cases are now found before birth. In the European registry study 87.6%
    of cases were detected prenatally, and more than half of all ascertained
    cases ended in termination of pregnancy, which shapes every downstream
    postnatal cohort.
  evidence:
  - reference: PMID:31302658
    reference_title: "Epidemiology of Dandy-Walker Malformation in Europe: A EUROCAT Population-Based Registry Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The livebirth prevalence was 2.74 per 100,000 births (95% CI 2.08-3.61).
      The prenatal detection rate was 87.6%.
    explanation: >-
      Gives the prenatal detection rate and the live-birth prevalence it leaves
      behind.
- phase: Infancy
  notes: >-
    The great majority of postnatally diagnosed children present in the first
    year, most commonly with signs of hydrocephalus. Infant mortality is high
    and scales with the number of affected organ systems.
  evidence:
  - reference: PMID:1863935
    reference_title: "Dandy-Walker malformation: analysis of 38 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-two cases (84%) were diagnosed within the 1st year of life.
    explanation: >-
      Gives the age-at-diagnosis distribution for this phase.
  - reference: PMID:18648217
    reference_title: "Dandy-Walker syndrome, associated anomalies and survival through infancy: a population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 196 cases of DWS had a high infant mortality rate (250/1,000), and the
      elevated risk correlated positively with additional anomalies in a
      dose-effect pattern (p for trend <0.01).
    explanation: >-
      Population-registry infant mortality with the dose-effect relationship to
      associated anomalies.
- phase: Childhood and beyond
  notes: >-
    Outcome after infancy is dominated by what else is present, not by the
    posterior fossa measurements. Which associated feature drives it is
    contested: one retrospective cohort found cyst size and additional CNS
    anomalies predictive while hydrocephalus was not, whereas a congenital
    cerebellar malformation cohort found supratentorial abnormalities predicted
    epilepsy but not neurodevelopmental outcome. Milder variants ascertained in
    isolation can develop entirely normally, and DWM is occasionally found
    incidentally in adults.
  evidence:
  - reference: PMID:34507295
    reference_title: "Predicting outcomes in Dandy-Walker malformation: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cyst size and the presence of another CNS anomaly were shown to portend
      worse outcomes.
    explanation: >-
      Identifies the predictors of worse outcome in this cohort.
  - reference: PMID:34507295
    reference_title: "Predicting outcomes in Dandy-Walker malformation: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-CNS anomalies and hydrocephalus were not predictive of worse outcomes.
    explanation: >-
      The negative half of the same analysis, which is what makes the prognostic
      claim specific rather than general.
  - reference: PMID:30320441
    reference_title: Developmental outcomes in children with congenital cerebellar malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adjusting for supratentorial malformations and presence of genetic
      findings, severe GDD was associated with cerebellar hypoplasia (p=0.049)
      and PCH (p=0.030), whereas children with vermis hypoplasia were less likely
      to have severe GDD (p=0.003).
    explanation: >-
      Places vermis hypoplasia at the milder end of the congenital cerebellar
      malformation outcome spectrum after adjustment.
diagnosis:
- name: Prenatal ultrasound after 18 weeks gestation
  description: >-
    Second-trimester sonography is the usual first detection. The timing rule is
    mechanistic rather than conventional: the inferior vermis is still closing
    through the mid second trimester, so an "open vermis" seen too early is a
    normal developmental stage rather than a malformation. In a prospective series
    of 897 structurally normal fetuses, 56% had an open vermis at 14 weeks and 6%
    still did at 17 weeks, and all but one closed on follow-up. Calling
    Dandy-Walker before 18 weeks therefore over-diagnoses.
  diagnosis_term:
    preferred_term: prenatal ultrasound
    term:
      id: NCIT:C19337
      label: Diagnostic Ultrasound
  evidence:
  - reference: PMID:7972820
    reference_title: "Closure of the cerebellar vermis: evaluation with second trimester US."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prenatal diagnosis of Dandy-Walker variant should not be made before 18
      weeks gestation because the development of the cerebellar vermis may be
      incomplete at that time.
    explanation: >-
      States the 18-week rule and the developmental reason for it.
  - reference: PMID:7972820
    reference_title: "Closure of the cerebellar vermis: evaluation with second trimester US."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 14 weeks gestation, 56% of fetuses had an open vermis, decreasing to 23%
      at 15 weeks and 6% at 17 weeks.
    explanation: >-
      Quantifies how common the normal open vermis is before 18 weeks, which is
      what makes the earlier call unreliable rather than merely cautious.
  - reference: PMID:19106349
    reference_title: "Three-dimensional ultrasonography of the fetal vermis at 18 to 26 weeks' gestation: time of appearance of the primary fissure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary fissure was observed at 24 weeks' gestation in all cases, at 22
      weeks in 94% of cases, and as early as 18 weeks in 40%.
    explanation: >-
      Shows that even after 18 weeks the normal vermian landmarks appear
      progressively, so absent fissuration early in the window is not itself
      abnormal.
- name: Fetal MRI
  description: >-
    Used to exclude additional cerebral lesions and to characterise the posterior
    fossa. It is not a solution to the vermian-assessment problem: in a
    referral-centre series, fetal MRI could not resolve vermian fissuration and
    lobulation even with good-quality imaging, which is precisely the measurement
    the DWM-versus-vermian-hypoplasia distinction depends on.
  diagnosis_term:
    preferred_term: fetal magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:22418964
    reference_title: "Prenatal diagnosis of 'isolated' Dandy-Walker malformation: imaging findings and prenatal counselling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite good-quality imaging, including fetal magnetic resonance imaging
      (MRI), prenatal analysis of the vermis was impossible because of limited
      identification of fissuration and lobulation.
    explanation: >-
      States the specific limitation of fetal MRI for the measurement that
      defines the diagnosis.
- name: Postnatal MRI with modern Dandy-Walker criteria
  description: >-
    The confirmatory test. The criteria applied have changed: a 446-examination
    multicentre reanalysis of fetal and postnatal MRI defined the phenotype by
    inferior-predominant vermian hypoplasia, enlarged tegmentovermian angle,
    inferolateral displacement of the tela choroidea and choroid plexus, an
    obtuse fastigial recess and an unpaired caudal lobule, and removed posterior
    fossa size and torcular location. Choroid plexus and taenia-tela choroidea
    position is the feature that best separates DWM from a Blake pouch cyst.
  diagnosis_term:
    preferred_term: magnetic resonance imaging of the brain
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:36137655
    reference_title: Refining the Neuroimaging Definition of the Dandy-Walker Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As confirmed by objective measures, the modern Dandy-Walker malformation
      phenotype is best defined by inferior predominant vermian hypoplasia, an
      enlarged tegmentovermian angle, inferolateral displacement of the tela
      choroidea/choroid plexus, an obtuse fastigial recess, and an unpaired
      caudal lobule.
    explanation: >-
      The current criteria this diagnostic step applies.
  - reference: PMID:33783580
    reference_title: Taenia-tela choroidea complex and choroid plexus location help distinguish Dandy-Walker malformation and Blake pouch cysts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dandy-Walker malformation showed inferolateral displacement of the
      taenia-tela choroidea complex and choroid plexus distant from the vermis.
    explanation: >-
      Gives the specific anatomical discriminator against Blake pouch cyst.
- name: Chromosomal microarray and exome sequencing
  description: >-
    Karyotype abnormalities are common in prenatally ascertained cases, and
    cryptic subtelomeric deletions — 6p in particular — turn up in cases that
    looked isolated on imaging. For DWM with additional anomalies, clinical exome
    sequencing reaches a diagnosis in about a third and substantially outperforms
    commercial brain malformation panels, which would have found only a quarter
    to a half of the same diagnoses.
  diagnosis_term:
    preferred_term: clinical exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A definitive or probable diagnosis was made for 32 individuals, yielding a
      diagnostic rate of 35.2% (32/91).
    explanation: >-
      Gives the diagnostic yield of clinical exome sequencing in non-isolated
      DWM.
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Commercially available brain malformation panels would have detected only
      24.2% (8/33) to 54.5% (18/33) of the diagnoses made by cES.
    explanation: >-
      Supports choosing exome sequencing over a targeted panel.
  - reference: PMID:7972821
    reference_title: "Sonographic detection of inferior vermian agenesis in Dandy-Walker malformations: prognostic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromosomal abnormalities were found in 23 (45%) of the 51 fetuses tested
      for karyotypic abnormalities or clinically thought to have Down syndrome.
    explanation: >-
      Records the high karyotype-abnormality yield in prenatally detected cases,
      which is why cytogenetic testing precedes sequencing.
environmental:
- name: Maternal history of infertility
  description: >-
    A population-based case-control study of 160 infants with DWM against 10,200
    controls found a raised risk with maternal history of infertility, stronger
    when multiple infertility conditions were reported. The same study found no
    association with most periconceptional exposures examined, which the authors
    read as supporting a predominantly genetic aetiology. This is an
    epidemiological association without an identified mechanism, so it is not
    linked into the pathograph.
  effect: increases risk
  evidence:
  - reference: PMID:25941000
    reference_title: "Risk factors for Dandy-Walker malformation: a population-based assessment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among maternal conditions, a history of infertility increased the risk for
      DWM (all: aOR = 2.4, 95%CI: 1.3-4.6; multiple: aOR = 3.9, 95%CI: 1.7-8.9).
    explanation: >-
      The adjusted odds ratios for the association, from the National Birth
      Defects Prevention Study.
  - reference: PMID:25941000
    reference_title: "Risk factors for Dandy-Walker malformation: a population-based assessment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lack of association with many maternal exposures supports the
      hypothesis of a major contribution of genetic factors to the risk for DWM
    explanation: >-
      The negative result from the same study, which bounds how much of the
      disease environmental factors can explain.
treatments:
- name: Ventriculoperitoneal Shunt
  description: >-
    CSF diversion from the lateral ventricles to the peritoneum, the most common
    first operation for Dandy-Walker-associated hydrocephalus. In a national
    inpatient analysis, operative CSF drainage nearly halved mortality; in a
    prenatally ascertained series, every child with true DWM needed one.
    Dual-compartment shunting, which drains the ventricles and the posterior
    fossa cyst separately, failed in all four cases in the Hydrocephalus Clinical
    Research Network series and is not a default.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: ventriculoperitoneal shunt placement
    term:
      id: NCIT:C168483
      label: Ventriculoperitoneal Shunt Placement
  target_mechanisms:
  - target: Impaired Cerebrospinal Fluid Egress from the Fourth Ventricle
    description: >-
      Bypasses the obstructed CSF pathway rather than correcting it, so the
      malformation is unchanged and the treatment is lifelong.
  evidence:
  - reference: PMID:25552847
    reference_title: "The natural history of Dandy-Walker syndrome in the United States: A population-based analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CSF drainage reduced mortality by 44% among DWS patients (P < 0.0001).
    explanation: >-
      Quantifies the mortality benefit of operative CSF drainage in a national
      inpatient cohort.
  - reference: PMID:33930865
    reference_title: "Treatment strategies for hydrocephalus related to Dandy-Walker syndrome: evaluating procedure selection and success within the Hydrocephalus Clinical Research Network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, 100% (4/4) of the dual-compartment shunts failed.
    explanation: >-
      Supports the caution against dual-compartment shunting stated in the
      description. The denominator is four, so this is a signal rather than an
      estimate.
  - reference: PMID:34507295
    reference_title: "Predicting outcomes in Dandy-Walker malformation: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, of all the treatments assessed, ventriculoperitoneal shunts
      were shown to be the most effective in this data set.
    explanation: >-
      A single-centre comparative observation favouring VP shunting; not a
      randomised comparison, and it disagrees with the network registry finding
      of equivalence.
- name: Cystoperitoneal Shunt
  description: >-
    Diversion from the posterior fossa cyst itself rather than from the lateral
    ventricles. Used when the cyst is the dominant compartment. It was 16 of 102
    shunt operations in the HCRN registry, so it is a real but minority choice.
  therapeutic_modality: SURGERY
  notes: >-
    NCIT has no clinical-action term for cystoperitoneal shunting. The searches
    run were on shunt and peritoneal shunt labels in the local NCIT build; the
    only peritoneal shunt procedure term is NCIT:C168483, which is
    ventriculoperitoneal and so names a different operation, and NCIT:C20569
    Shunt is a retired concept. The generic surgical-procedure term is therefore
    kept, with the device concept carried as a qualifier so it stays queryable.
  treatment_term:
    preferred_term: cystoperitoneal shunt placement
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cystoperitoneal shunt
        term:
          id: NCIT:C50174
          label: Shunt Device
  target_mechanisms:
  - target: Cystic Dilatation of the Fourth Ventricle
    description: >-
      Drains the posterior fossa cyst directly, which is the compartment this
      node describes.
  evidence:
  - reference: PMID:33930865
    reference_title: "Treatment strategies for hydrocephalus related to Dandy-Walker syndrome: evaluating procedure selection and success within the Hydrocephalus Clinical Research Network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among these, the 102 patients who underwent shunt placement (79 VPSs, 16
      CPSs, 3 other, and 4 multiple proximal catheter) were younger (6.6 vs 18.8
      months, p < 0.001) and more frequently had 1 or more comorbidities (37.3%
      vs 14.3%, p = 0.005) than the 49 ETV-treated children (28 ETV-CPC).
    explanation: >-
      Gives the share of cystoperitoneal shunting among shunt operations in a
      multicentre registry.
  - reference: PMID:35210871
    reference_title: A Rare Case of Dandy-Walker Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A cystoperitoneal (CP) shunt was placed and then the patient transferred to
      recovery room.
    explanation: >-
      A worked case of cystoperitoneal shunting for DWS, in an adolescent
      presenting late.
- name: Endoscopic Third Ventriculostomy
  description: >-
    An internal CSF diversion that creates an outlet from the third ventricle
    floor, often combined with choroid plexus cauterization in infants. It works
    here because the obstruction is at the fourth ventricle and its outlets while
    the aqueduct is usually patent. Registry data show it is about as durable as
    shunting — roughly half of each strategy failed — with low complication
    rates, which is the argument for trying it first rather than creating shunt
    dependence. Where it fails it usually fails within four months.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: endoscopic third ventriculostomy
    term:
      id: NCIT:C182204
      label: Third Ventriculostomy
  target_mechanisms:
  - target: Impaired Cerebrospinal Fluid Egress from the Fourth Ventricle
    description: >-
      Creates an alternative CSF outflow route upstream of the obstruction,
      exploiting the patent aqueduct.
    evidence:
    - reference: PMID:21961544
      reference_title: Management of Dandy-Walker complex-associated infant hydrocephalus by combined endoscopic third ventriculostomy and choroid plexus cauterization.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The rate of success was 74% for DWM, 73% for DWV, and 100% for MCM; 95%
        had an open aqueduct, and none required posterior fossa shunting.
      explanation: >-
        Ties the procedure's success to the patent aqueduct, which is the
        mechanistic reason this treatment targets that node.
  evidence:
  - reference: PMID:33930865
    reference_title: "Treatment strategies for hydrocephalus related to Dandy-Walker syndrome: evaluating procedure selection and success within the Hydrocephalus Clinical Research Network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this North American, multicenter, prospective database review,
      shunt-based and ETV-based primary treatment strategies of DWSH appear
      similarly durable.
    explanation: >-
      The comparative-durability conclusion from the largest prospective
      registry comparison.
  - reference: PMID:21961544
    reference_title: Management of Dandy-Walker complex-associated infant hydrocephalus by combined endoscopic third ventriculostomy and choroid plexus cauterization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endoscopic treatment of DWC-associated hydrocephalus should be strongly
      considered as the primary management in place of the historical standard of
      creating shunt dependence.
    explanation: >-
      States the recommendation to prefer endoscopic treatment as first-line.
  - reference: PMID:42432063
    reference_title: Quantitative ventricular volume changes after endoscopic third ventriculostomy in children with Dandy-Walker malformation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall success rate was 66.7%, with most failures occurring within
      four months.
    explanation: >-
      Gives the success rate and the timing of failures quoted in the
      description.
- name: Physical Therapy
  description: >-
    Motor rehabilitation for the delay, hypotonia and incoordination. Part of the
    standard multidisciplinary follow-up rather than a disease-modifying
    treatment.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:40134959
    reference_title: "Unraveling Dandy-Walker Malformation: A Comprehensive Literature Review and Case Insight."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Research indicates that individualized education plans (IEPs) and
      consistent therapies, such as physical, occupational, and speech therapy,
      are beneficial for children with DWM, especially when intellectual delays
      or motor impairments are present.
    explanation: >-
      A narrative review's statement that physical therapy benefits children with
      DWM. It cites no trial, so this supports standard practice rather than
      demonstrated efficacy.
- name: Occupational Therapy
  description: >-
    Function-directed therapy addressing daily activities and fine motor skills,
    delivered alongside physical and speech therapy in the standard
    multidisciplinary package.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Occupational Therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:40134959
    reference_title: "Unraveling Dandy-Walker Malformation: A Comprehensive Literature Review and Case Insight."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Research indicates that individualized education plans (IEPs) and
      consistent therapies, such as physical, occupational, and speech therapy,
      are beneficial for children with DWM, especially when intellectual delays
      or motor impairments are present.
    explanation: >-
      Names occupational therapy among the recommended therapies. No trial is
      cited.
- name: Speech and Language Therapy
  description: >-
    Language delay is the commonest cognitive-domain finding in vermis
    hypoplasia, and most affected children remain verbal, so speech therapy is
    directed at a realistically remediable deficit.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Speech Language Therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:40134959
    reference_title: "Unraveling Dandy-Walker Malformation: A Comprehensive Literature Review and Case Insight."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Research indicates that individualized education plans (IEPs) and
      consistent therapies, such as physical, occupational, and speech therapy,
      are beneficial for children with DWM, especially when intellectual delays
      or motor impairments are present.
    explanation: >-
      Names speech therapy among the recommended therapies. No trial is cited.
  - reference: PMID:30320441
    reference_title: Developmental outcomes in children with congenital cerebellar malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with vermis hypoplasia have language delay but are verbal.
    explanation: >-
      Establishes the target deficit and its likely ceiling, which is what makes
      speech therapy an appropriate rather than a token intervention.
- name: Genetic Counseling
  description: >-
    Recurrence-risk counselling and decisions about prenatal testing. Quoted
    recurrence risk is 1-5% for isolated DWM and higher for syndromic patterns,
    which makes establishing whether the case is truly isolated the substance of
    the counselling rather than a preliminary to it.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40134959
    reference_title: "Unraveling Dandy-Walker Malformation: A Comprehensive Literature Review and Case Insight."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      genetic counseling may be informative for the family with respect to
      recurrence risk in subsequent pregnancies
    explanation: >-
      States the indication for genetic counselling in this disorder.
  - reference: PMID:34757866
    reference_title: "Short- and Long-Term Outcomes of Prenatally Diagnosed Dandy-Walker Malformation, Vermian Hypoplasia, and Blake Pouch Cyst."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Echocardiogram and genetic screening are recommended with vermian
      hypoplasia.
    explanation: >-
      Recommends genetic screening in the vermian hypoplasia group, which is the
      testing arm that counselling accompanies.
animal_models:
- name: Zic1;Zic4 double heterozygous mouse
  species: Mouse
  genotype: Zic1(+/-);Zic4(+/-)
  publication: PMID:15338008
  description: >-
    The model that made the ZIC1;ZIC4 deletion a disease mechanism rather than an
    association. It matches the human lesion in kind — a heterozygous loss of the
    same two linked genes — and reproduces both the cerebellar size reduction and
    the foliation defect. Later work in the same line separated two routes out of
    the lesion: an Shh-dependent granule cell progenitor proliferation deficit
    and an Shh-independent foliation-patterning defect.
  modeled_mechanisms:
  - target: Reduced Shh-Dependent Granule Cell Progenitor Proliferation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the progenitor proliferation deficit and localises it to the Shh
      response rather than to ligand supply.
    evidence:
    - reference: PMID:21307096
      reference_title: Multiple developmental programs are altered by loss of Zic1 and Zic4 to cause Dandy-Walker malformation cerebellar pathogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Through genetic and molecular analyses, we show that Zic1 and Zic4 have
        Shh-dependent function promoting proliferation of granule cell
        progenitors.
      explanation: >-
        Establishes that the model reports the Shh-dependent proliferation
        mechanism this node describes.
  - target: Cerebellar Vermis Hypoplasia with Upward Rotation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces reduced cerebellar size and abnormal vermis foliation.
    limitations: >-
      The published claim is a phenotype that "closely resembles" DWM at the
      level of cerebellar size and foliation. The mouse posterior fossa is not
      the human one, and the model is not cited for the upward rotation,
      tegmentovermian angle or posterior fossa cyst that constitute the human
      radiological diagnosis. It is also a mouse cerebellum, which lacks the
      posterior-lobule rhombic lip progenitor pool that human work now places at
      the centre of DWM pathogenesis.
    evidence:
    - reference: PMID:21307096
      reference_title: Multiple developmental programs are altered by loss of Zic1 and Zic4 to cause Dandy-Walker malformation cerebellar pathogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Deletion of Zic1 and Zic4 in mice produces both cerebellar size and
        foliation defects similar to human DWM, confirming a requirement for
        these genes in cerebellar development and providing a model to delineate
        the developmental basis of this clinically important congenital
        malformation.
      explanation: >-
        States what the model does and does not reproduce: size and foliation,
        described as similar to rather than identical with human DWM.
  evidence:
  - reference: PMID:15338008
    reference_title: Heterozygous deletion of the linked genes ZIC1 and ZIC4 is involved in Dandy-Walker malformation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice with a heterozygous deletion of these two linked genes have a
      phenotype that closely resembles DWM, providing a mouse model for this
      malformation.
    explanation: >-
      Establishes the model and its stated correspondence to the human
      malformation.
- name: Foxc1 hypomorphic mouse
  species: Mouse
  genotype: Foxc1 hypomorph (Foxc1hith/hith)
  publication: PMID:28092268
  description: >-
    Viable as adults, unlike the Foxc1 null, and therefore the model that can be
    followed into postnatal cerebellar development. It has granule and Purkinje
    cell abnormalities producing foliation and lamination defects, and a
    partially formed posterior lobule that echoes the posterior vermis "tail
    sign" proposed as pathognomonic for human DWM. Lineage tracing attributes
    the tail to premature and abnormal migration of posterior-vermis-fated
    rhombic lip derivatives. The null allele is the complementary model: it shows
    the mesenchymal mechanism, losing rhombic lip development because
    mesenchyme-secreted signals are absent.
  modeled_mechanisms:
  - target: Posterior Fossa Mesenchymal Signalling Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      The mouse Foxc1 work is where the mesenchyme-to-neuroepithelium requirement
      was demonstrated; the human data are deletion mapping and fetal
      histopathology, which cannot show it.
    evidence:
    - reference: PMID:28092268
      reference_title: Phenotypic outcomes in Mouse and Human Foxc1 dependent Dandy-Walker cerebellar malformation suggest shared mechanisms.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Further, our analyses clearly demonstrate that competent meningeal
        signaling is required for multiple aspects of prenatal and postnatal
        cerebellar development.
      explanation: >-
        The demonstration of the meningeal signalling requirement that this node
        asserts.
  - target: Cerebellar Vermis Hypoplasia with Upward Rotation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the posterior vermis defect including a mouse counterpart of the
      human "tail sign", validated against rare human del chr 6p25 fetal
      cerebella.
    limitations: >-
      The correspondence demonstrated is with the cerebellar pathology, not with
      the posterior fossa geometry: upward rotation, tegmentovermian angle and
      the fourth-ventricle cyst that define DWM radiologically in humans are not
      what this model is cited for. The comparison human tissue is three fetal
      del chr 6p25 cerebella, which is a small validation set.
    evidence:
    - reference: PMID:28092268
      reference_title: Phenotypic outcomes in Mouse and Human Foxc1 dependent Dandy-Walker cerebellar malformation suggest shared mechanisms.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Particularly striking is the presence of a partially formed posterior
        lobule which echoes the posterior vermis DW 'tail sign' observed in human
        imaging studies.
      explanation: >-
        The specific structural correspondence the model is cited for.
  evidence:
  - reference: PMID:28092268
    reference_title: Phenotypic outcomes in Mouse and Human Foxc1 dependent Dandy-Walker cerebellar malformation suggest shared mechanisms.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Analyses of rare human del chr 6p25 fetal cerebella demonstrate extensive
      phenotypic overlap with our Foxc1 mutant mouse models, validating our DWM
      models and demonstrating that many key mechanisms controlling cerebellar
      development are likely conserved between mouse and human.
    explanation: >-
      The authors' own validation claim for the model, stated against human fetal
      tissue.
  - reference: PMID:19668217
    reference_title: FOXC1 is required for normal cerebellar development and is a major contributor to chromosome 6p25.3 Dandy-Walker malformation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Foxc1 homozygous hypomorphs have CVH with medial fusion and foliation
      defects.
    explanation: >-
      Describes the hypomorph's cerebellar phenotype in the paper that
      introduced the allele in this context.
differential_diagnoses:
- name: Blake pouch cyst
  description: >-
    The commonest and most consequential confusion, because the prognosis
    differs. In a Blake pouch cyst the vermis is complete but rotated, the
    tegmentovermian angle is much smaller, and the choroid plexus and
    taenia-tela choroidea sit below the vermis rather than displaced
    inferolaterally away from it. It can still cause hydrocephalus, but the
    outcome is favourable.
  evidence:
  - reference: PMID:33783580
    reference_title: Taenia-tela choroidea complex and choroid plexus location help distinguish Dandy-Walker malformation and Blake pouch cysts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The choroid plexus and associated taenia-tela choroidea complex are
      displaced inferolaterally in Dandy-Walker malformation and below the vermis
      in Blake pouch cysts.
    explanation: >-
      The anatomical discriminator between the two.
  - reference: PMID:34757866
    reference_title: "Short- and Long-Term Outcomes of Prenatally Diagnosed Dandy-Walker Malformation, Vermian Hypoplasia, and Blake Pouch Cyst."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blake pouch cyst can be complicated by hydrocephalus, but outcome is
      favorable.
    explanation: >-
      States the prognostic difference that makes the distinction worth making.
- name: Isolated cerebellar vermis hypoplasia
  description: >-
    Vermian hypoplasia without the upward rotation, cyst and enlarged
    tegmentovermian angle. On the rhombic lip model the two are the same lesion
    at different times — insult before or after about 14 post-conception weeks —
    which makes them mechanistically continuous but prognostically distinct.
    Vermian hypoplasia is more strongly associated with genetic syndromes and
    cardiac malformations than DWM is.
  evidence:
  - reference: PMID:34347142
    reference_title: Evidence of disrupted rhombic lip development in the pathogenesis of Dandy-Walker malformation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Timing of insult to the developing rhombic lip (before or after 14 PCW)
      dictates the extent of hypoplasia and distinguishes DWM from CVH.
    explanation: >-
      Gives the proposed developmental basis for the distinction between the two
      entities.
  - reference: PMID:34757866
    reference_title: "Short- and Long-Term Outcomes of Prenatally Diagnosed Dandy-Walker Malformation, Vermian Hypoplasia, and Blake Pouch Cyst."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vermian hypoplasia was strongly associated with genetic conditions and
      cardiac malformations; odds of not ambulating normally were 12 times
      greater if a syndrome or injury was present.
    explanation: >-
      Records the different associated-anomaly profile and its prognostic
      consequence.
- name: Mega cisterna magna
  description: >-
    An enlarged retrocerebellar CSF space with a normal vermis and fourth
    ventricle. Historically bundled into the "Dandy-Walker complex", which is
    part of why prevalence and outcome figures across the older literature are
    hard to compare. Hydrocephalus is uncommon and endoscopic treatment succeeded
    in all cases in one series.
  evidence:
  - reference: PMID:21961544
    reference_title: Management of Dandy-Walker complex-associated infant hydrocephalus by combined endoscopic third ventriculostomy and choroid plexus cauterization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dandy-Walker complex (DWC) is a continuum of congenital anomalies
      comprising Dandy-Walker malformation (DWM), Dandy-Walker variant (DWV),
      Blake pouch cyst, and mega cisterna magna (MCM).
    explanation: >-
      Documents the historical grouping that makes this a differential rather
      than an unrelated entity.
- name: Autosomal dominant Dandy-Walker malformation with occipital cephalocele (ADDWOC)
  description: >-
    A distinct dominant entity (MONDO:0012218) caused by NID1 or LAMC1 mutations,
    in which vermian hypoplasia is accompanied by an occipital cephalocele and
    psychomotor development can be entirely normal. A separate locus at 2q36.1
    was mapped in one pedigree with no coding mutation found, and a second family
    did not link there, so ADDWOC itself is genetically heterogeneous. Kept
    separate from this entry because MONDO does, and because the cephalocele is
    not a feature of DWM.
  evidence:
  - reference: PMID:36702440
    reference_title: NID1-related autosomal dominant Dandy-Walker malformation with occipital cephalocele in three generations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a three-generation family with variable manifestations of
      Dandy-Walker malformation and occipital cephalocele. They all have normal
      psychomotor development and lack neurological manifestations.
    explanation: >-
      Documents the distinguishing feature (cephalocele) and the markedly
      different neurodevelopmental outcome.
  - reference: PMID:18204864
    reference_title: Linkage to chromosome 2q36.1 in autosomal dominant Dandy-Walker malformation with occipital cephalocele and evidence for genetic heterogeneity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, these results demonstrate a locus for ADDWOC on 2q36.1 and
      also suggest locus heterogeneity for ADDWOC.
    explanation: >-
      Establishes a second ADDWOC locus and the entity's genetic heterogeneity.
- name: 6p25 deletion syndrome
  description: >-
    Contiguous gene deletion including FOXC1, presenting with DWM alongside
    congenital heart defects, developmental delay, dysmorphic features and
    anterior segment dysgenesis with glaucoma risk. Not a differential in the
    sense of an alternative explanation for the imaging — the DWM is real — but a
    diagnosis that changes surveillance, and one that can be cryptic on standard
    karyotype in an apparently isolated case.
  evidence:
  - reference: PMID:22497499
    reference_title: "Chromosome 6p25 deletion syndrome: report of a case with optic disc coloboma and review of published ophthalmic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 6p25 deletion syndrome is a rare disorder characterized by Dandy-Walker
      malformation, congenital heart defects, developmental delay, dysmorphic
      facial features, and malformations of the anterior segment of the eye with
      a risk for glaucoma.
    explanation: >-
      Describes the syndrome and the extracerebellar findings that identify it.
discussions:
- discussion_id: human_rhombic_lip_has_no_mouse_counterpart
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can the Zic1;Zic4 and Foxc1 mouse models be used to reason about the
    developmental origin of human Dandy-Walker malformation, when the human
    rhombic lip compartment those models would have to contain — a posterior
    lobule progenitor pool — does not exist in mouse or macaque?
  attaches_to:
  - pathophysiology#Rhombic Lip Progenitor Pool Failure
  - animal_models#Zic1;Zic4 double heterozygous mouse
  - animal_models#Foxc1 hypomorphic mouse
  rationale: >-
    This is not the usual complaint that a mouse is not a person. The human
    cerebellum's primary progenitor zones expand spatiotemporally relative to the
    mouse's, the human rhombic lip persists longer, and it reorganises into a
    progenitor pool in the posterior lobule that is not present in other
    organisms, macaque included. Human DWM work localises the defect to exactly
    that zone, with reduced proliferation and self-renewal of its progenitor
    pool. So the compartment where the human lesion is being placed is partly a
    human-specific structure, and the mouse models of the same genes — which
    remain the only place the causal mechanism has been demonstrated
    experimentally — cannot report on it. Both models are cited in this entry for
    what they do show: the Shh-dependent proliferation route, and the
    mesenchyme-to-neuroepithelium requirement. Neither can be read as reporting
    on the posterior-lobule pool. Reviews from the same group state the general
    form of the problem directly, that these findings challenge mouse-centric
    models of DWM pathogenesis.
  evidence:
  - reference: PMID:31624095
    reference_title: Spatiotemporal expansion of primary progenitor zones in the developing human cerebellum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The human rhombic lip persists longer through cerebellar development than
      in the mouse and undergoes morphological changes to form a progenitor pool
      in the posterior lobule, which is not seen in other organisms, not even in
      the nonhuman primate the macaque.
    explanation: >-
      States the species-specific structure at issue and that it is absent from
      mouse and macaque.
  - reference: PMID:31624095
    reference_title: Spatiotemporal expansion of primary progenitor zones in the developing human cerebellum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disruptions in human rhombic lip development are associated with posterior
      cerebellar vermis hypoplasia and Dandy-Walker malformation.
    explanation: >-
      Connects that human-specific compartment to this disease, which is what
      makes the gap material rather than academic.
  - reference: PMID:35440142
    reference_title: "Human Cerebellar Development and Transcriptomics: Implications for Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These discoveries challenge many current mouse-centric models of normal
      human cerebellar development and models regarding the pathogenesis of
      several neurodevelopmental phenotypes affecting the cerebellum, including
      Dandy-Walker malformation and medulloblastoma.
    explanation: >-
      States the translational-validity problem for DWM specifically, in a review
      by the group that produced the human developmental data.
  - reference: PMID:35440142
    reference_title: "Human Cerebellar Development and Transcriptomics: Implications for Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Since we cannot model what we do not know, additional normative and
      pathological human developmental data are essential, and new models are
      needed.
    explanation: >-
      States what would resolve the mismatch: human developmental data and new
      model systems, rather than more work in the existing mouse lines.
- discussion_id: dandy_walker_continuum_nosology
  kind: KNOWLEDGE_GAP
  prompt: >-
    Where does Dandy-Walker malformation end and Blake pouch cyst, mega cisterna
    magna and isolated vermian hypoplasia begin, and is the "Dandy-Walker
    continuum" a mechanistic claim or a description of diagnostic uncertainty?
  attaches_to:
  - diagnosis#Postnatal MRI with modern Dandy-Walker criteria
  - differential_diagnoses#Blake pouch cyst
  - differential_diagnoses#Mega cisterna magna
  rationale: >-
    The literature runs two incompatible framings side by side. One treats DWM,
    vermian hypoplasia, Blake pouch cyst and mega cisterna magna as a continuum
    of one process, which is how "Dandy-Walker complex" and "Dandy-Walker
    variant" entered use and why older prevalence and outcome figures pool
    entities with very different prognoses. The other treats them as separable by
    objective measurement — the tegmentovermian angle discriminates strongly and
    choroid plexus position resolves ambiguous cases — and a recent review argues
    the term "Dandy-Walker variant or continuum" should be abandoned in favour of
    describing what is actually seen. The rhombic lip model complicates the
    picture rather than settling it: it makes DWM and vermian hypoplasia
    mechanistically continuous through the timing of a shared insult while
    leaving them prognostically distinct. The practical cost is that a reader
    cannot tell, from a figure quoted in an older paper, which entities were
    counted. This entry uses the strict modern definition and records
    DWM-versus-variant pooling wherever a cited number does not separate them.
  evidence:
  - reference: PMID:34266871
    reference_title: Evaluation of Posterior Fossa Biometric Measurements on Fetal MRI in the Evaluation of Dandy-Walker Continuum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because they fall along the same spectrum of abnormalities, the difficulty
      in distinguishing these entities from one another makes precise morphologic
      and biometric descriptions important.
    explanation: >-
      States the continuum framing and the measurement problem it creates.
  - reference: PMID:38429135
    reference_title: "Not Dandy Walker variant: a review of prominent retrocerebellar CSF space in children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Instead, the emphasis is on a more elaborate description of the findings in
      the posterior fossa.
    explanation: >-
      The competing position: abandon the continuum label and describe the
      findings, which is the argument this gap is about.
  - reference: PMID:36137655
    reference_title: Refining the Neuroimaging Definition of the Dandy-Walker Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common diagnoses were Dandy-Walker malformation (78%), vermian
      hypoplasia (14%), vermian hypoplasia with Blake pouch cyst (9%), and Blake
      pouch cyst (4%).
    explanation: >-
      Shows that a cohort assembled under a DWM or vermian hypoplasia label
      resolves into four entities on re-evaluation, which quantifies how much
      pooling the older literature carries.
notes: >-
  Scope and lump/split. Curated as entry_type DISEASE against MONDO:0009072.
  MONDO lists three descendants; the two isolated forms — with hydrocephalus
  (MONDO:0017110) and without (MONDO:0017111) — are modelled as has_subtypes with
  their MONDO ids bound, because they differ in management rather than in
  mechanism. The third, Dandy-Walker malformation with nasopharyngeal teratoma
  and diaphragmatic hernia (MONDO:0022930), is not modelled: no quotable source
  for it was found in this curation round, and a subtype with no evidence would
  be an assertion about a syndrome nobody here has read. It should be added when
  a source is available.

  Syndromic Dandy-Walker is deliberately not a subtype here. Where DWM occurs
  inside another curated entry it is a phenotype of that entry, which is how the
  KB already handles it: Acrocallosal_Syndrome and
  Brain_Abnormalities_Neurodegeneration_and_Dysosteosclerosis both carry
  HP:0001305 as a phenotype, and Congenital_Hydrocephalus carries a
  Dandy-Walker-associated subtype bound to MONDO:0017110. That last one is a
  deliberate overlap, not a duplicate: the same MONDO concept is a subtype of
  hydrocephalus viewed from the CSF side and a subtype of DWM viewed from the
  malformation side.

  ADDWOC (NID1/LAMC1, MONDO:0012218) is kept out of has_subtypes because MONDO
  does not make it a descendant of MONDO:0009072 and because the occipital
  cephalocele is not a DWM feature. It appears in genetic, in a pathophysiology
  node, and in differential_diagnoses instead.

  Frequencies. Hydrocephalus is the number to be careful with. "Up to 80%" is
  repeated widely and is quoted here from the neurosurgical literature, but the
  modern paediatric cohort applying the current imaging criteria found 48%, and
  a national inpatient analysis found 20.4% of admitted children received
  operative CSF drainage. Those three numbers are not measuring the same thing
  and are recorded separately rather than reconciled. The same applies to
  intellectual disability, where a systematic review of published case reports
  gives 6.4% against 58-61% in patient series; that item is recorded as REFUTE
  against the FREQUENT band with the ascertainment difference stated, rather than
  averaged away.

  A genuine disagreement is left standing in progression. PMID:34507295 found
  additional CNS anomalies predicted worse outcome and hydrocephalus did not;
  PMID:30320441 found supratentorial abnormalities predicted epilepsy but not
  neurodevelopmental outcome. Both are cited. The brief for this curation
  asserted that developmental outcome is worse with associated supratentorial
  anomalies; the second paper contradicts that for neurodevelopmental outcome
  specifically, so the entry states the disagreement instead of the assertion.

  Deep-research report. Provider was Perplexity sonar-deep-research; the report
  is committed alongside this entry. It carried needs_review: true. Its citation
  base is thin for a report of its length — 7 resolvable references against 19
  citations, the rest being OMIM, MedlinePlus, Wikipedia, Radiopaedia, KEGG,
  Harmonizome and MalaCards pages that cannot be cited — so most of this entry's
  evidence was sourced independently through PubMed. Four NCIT treatment CURIEs
  the report offered were fabricated in the sense that matters: they resolve, and
  they name something else. NCIT:C80438 is Exempt Device, not a ventriculoperitoneal
  shunt; NCIT:C116195 is Leukemic Cells Measurement, not endoscopic third
  ventriculostomy; NCIT:C28239 is Cobalt Co-60, not occupational therapy;
  NCIT:C15323 is Salpingo-Oophorectomy, not speech therapy. Every treatment,
  phenotype, gene, process, cell type and anatomy CURIE in this file was looked up
  through OLS or the HGNC build at the time it was written. The report's
  NCIT:C16810 for MRI is Magnetic Resonance Spectroscopy; MRI is NCIT:C16809,
  which is what is used here. Its GO:0021542 for "rhombomere development" is
  dentate gyrus development and was not used.

  No GeneReviews chapter exists for isolated Dandy-Walker malformation; PubMed
  was searched and none was found, so there is no GeneReviews phenotype baseline
  for this entry.

  Not modelled. No datasets, clinical_trials, biochemical, histopathology or
  computational_models sections: nothing quotable was found for them in this
  round. No mechanism module conformance was declared — the KB has no posterior
  fossa, CSF-dynamics or rhombic lip module, and creating one from a single
  disease would be premature.

  Review round, PR #11592. The pathograph previously terminated only in the
  CSF arm, so the four cerebellar phenotypes were curated with evidence but
  explained by nothing. Four downstream edges were added from the vermis
  hypoplasia node: ataxia and hypotonia as DIRECT, global developmental delay
  and intellectual disability as INDIRECT_UNKNOWN_INTERMEDIATES because
  hydrocephalus and the associated supratentorial anomalies confound them and
  no mechanism is established. The deep-research report's own causal sentence
  was not used as the citation for any of them; primary literature was fetched
  instead.

  Some of the review's suggestions were declined. The reported 1:3
  male-to-female ratio was not carried over because the two sources in this
  entry that report sex contradict it: PMID:28635420 gives 46.5% male across
  187 patients and PMID:36068432 gives 17 boys to 11 girls in 28 children, both
  of which are male-predominant. Prominent occiput, frontal bossing and
  platybasia were not carried over because no primary source for them was found
  among the references consulted here; they are aggregator-sourced in the
  report, and an unsourced phenotype is worse than an absent one. Cataract and
  congenital heart defect were on the same aggregator list and were added,
  because primary sources for those two were found.

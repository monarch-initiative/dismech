    explanation: >-
      Defines the second human DWM locus and records that both deletions and
      duplications of FOXC1 are implicated.
- name: Meningeal Extracellular Matrix Disruption
  description: >-
    Loss-of-function in the basement-membrane proteins nidogen-1 (NID1) and
    laminin gamma-1 (LAMC1), which bind each other, disrupts the extracellular
    matrix of the meninges and skull base. This is the ADDWOC end of the
    Dandy-Walker spectrum — dominant families with vermian hypoplasia and
    occipital cephalocele — and it is included here because it converges on the
    same meningeal-mesenchymal compartment that FOXC1 acts through, not because
    ADDWOC is a subtype of this entry. Structural modelling shows each reported
    mutation breaks the NID1-LAMC1 interaction itself.

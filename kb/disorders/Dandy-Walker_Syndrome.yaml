  frequency: FREQUENT
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:36068432
    reference_title: "Dandy-Walker malformation and variants: clinical features and associated anomalies in 28 affected children-a single retrospective study and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common clinical features were the developmental delay and epilepsy

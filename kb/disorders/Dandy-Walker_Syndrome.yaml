name: Dandy-Walker Syndrome
synonyms:
- Dandy-Walker malformation
- Dandy-Walker complex
- DWM
- DWS
creation_date: "2026-09-09T20:05:49Z"
category: Congenital
description: >-
  Dandy-Walker syndrome (Dandy-Walker malformation, DWM) is a congenital
  posterior-fossa malformation defined on neuroimaging by complete or partial
  agenesis of the cerebellar vermis with upward rotation of the vermian
  remnant, cystic dilatation of the fourth ventricle continuous with the
  posterior fossa, and an enlarged posterior fossa with upward displacement of
  the torcula and tentorium. Hydrocephalus is present in roughly 80% of
  affected individuals but is a downstream consequence of the malformation
  rather than part of its definition, which is why the isolated form is split
  into with- and without-hydrocephalus subtypes below. Mechanistically the
  lesion is a developmental patterning failure of the cerebellar rhombic lip
  and fourth-ventricular roof plate together with the overlying posterior-fossa
  mesenchyme: heterozygous proximal-3q deletions removing the linked ZIC1 and ZIC4
  genes and heterozygous 6p25.3 deletions or variants affecting FOXC1 are the
  two best-established causal loci, acting on the neuroepithelial and on the
  meningeal-mesenchymal side of the same signalling interaction. Approximately
  half to two thirds of cases occur with additional CNS or extra-CNS anomalies
  (DWM+), where the malformation is one feature of a broader syndrome and the
  genetic architecture is correspondingly heterogeneous.
disease_term:
  preferred_term: Dandy-Walker syndrome
  term:
    id: MONDO:0009072
    label: Dandy-Walker syndrome
parents:
- Cystic Malformation of the Posterior Fossa
- Congenital Nervous System Disorder
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >-
  Scope and lump/split decisions for this entry. (1) MONDO records three
  descendants of MONDO:0009072. The two isolated forms — with hydrocephalus
  (MONDO:0017110) and without (MONDO:0017111) — are curated here as
  has_subtypes, because they share one malformation and one developmental
  mechanism and differ only in whether CSF outflow decompensates. (2) The third
  descendant, Dandy-Walker malformation with nasopharyngeal teratoma and
  diaphragmatic hernia (MONDO:0022930), is deliberately left out of scope: it
  rests on a small original case-report cluster with no subsequent mechanistic
  literature, so there is nothing to curate beyond the co-occurrence itself, and
  modelling it as a subtype here would imply a shared mechanism that no source
  asserts. (3) MONDO:0017110 is also carried as a has_subtypes entry on
  kb/disorders/Congenital_Hydrocephalus.yaml. That is intentional, not a
  duplicate: the two entries cut the same concept along different axes. This
  entry owns the malformation and its ZIC1/ZIC4 and FOXC1 developmental
  pathograph; Congenital_Hydrocephalus owns the CSF-diversion behaviour of the
  resulting hydrocephalus among other hydrocephalus aetiologies. Each entry
  points at the other in the relevant subtype description, and neither should
  grow a copy of the other's content. (4) Dandy-Walker malformation occurring
  as one feature of an already-curated syndrome — Joubert syndrome, acrocallosal
  syndrome, Marden-Walker syndrome, Ritscher-Schinzel syndrome, BANDDOS — is a
  phenotype of those entries and is not a subtype here. (5) No antiepileptic and
  no rehabilitation-therapy treatment is asserted, despite Seizure and Global
  developmental delay both being curated at FREQUENT. Neither has a
  DWM-specific citable statement in the literature fetched for this entry: the
  reviewed sources describe management as treating the hydrocephalus, addressing
  the associated anomalies, and following the child neurologically, and name no
  drug and no therapy modality for this disease. Symptomatic management follows
  ordinary paediatric practice with no disease-specific trial evidence, so the
  Multidisciplinary Neurological Follow-Up treatment above carries the claim the
  sources actually make and nothing narrower. Adding a drug or a therapy entry
  here would mean writing an evidence block around a generic statement, which is
  worse than the gap.
has_subtypes:
- name: Isolated DWM with hydrocephalus
  display_name: Isolated Dandy-Walker malformation with hydrocephalus
  subtype_term:
    preferred_term: isolated Dandy-Walker malformation with hydrocephalus
    term:
      id: MONDO:0017110
      label: isolated Dandy-Walker malformation with hydrocephalus
  description: >-
    Dandy-Walker malformation occurring without additional CNS or extra-CNS
    anomalies, in which fourth-ventricular outflow obstruction decompensates
    into progressive ventriculomegaly requiring CSF diversion. This is the
    majority presentation. The same MONDO concept is also curated as the
    Dandy-Walker-associated subtype of kb/disorders/Congenital_Hydrocephalus.yaml,
    which carries the shunt-behaviour detail; the malformation and its
    developmental mechanism live here.
  evidence:
  - reference: PMID:42432063
    reference_title: "Quantitative ventricular volume changes after endoscopic third ventriculostomy in children with Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hydrocephalus occurs in up to 80% of children with Dandy-Walker
      malformation (DWM).
    explanation: >-
      Establishes that the with-hydrocephalus form is the predominant
      presentation and therefore worth splitting out as its own subtype.
- name: Isolated DWM without hydrocephalus
  display_name: Isolated Dandy-Walker malformation without hydrocephalus
  subtype_term:
    preferred_term: isolated Dandy-Walker malformation without hydrocephalus
    term:
      id: MONDO:0017111
      label: isolated Dandy-Walker malformation without hydrocephalus
  description: >-
    Dandy-Walker malformation in which the posterior-fossa cyst and vermian
    hypoplasia are present but CSF circulation remains compensated, so no
    ventricular diversion is required. Presentation ranges from an incidental
    imaging finding in an asymptomatic individual to isolated cerebellar signs.
    Because outcome in DWM tracks the degree of vermian malformation and the
    associated anomalies rather than ventricular size alone, absence of
    hydrocephalus does not by itself predict a normal neurodevelopmental
    outcome.
  evidence:
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The consequences of DWM can vary widely, from asymptomatic to severe
      clinical presentations that include hypotonia, respiratory distress,
      hydrocephalus, and seizures
    explanation: >-
      Documents that an asymptomatic, non-hydrocephalic end of the DWM spectrum
      exists, which is what this subtype names.
  - reference: PMID:21928031
    reference_title: "Hydrocephalus in Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prognosis and intellectual outcome mostly depend on the presence of
      associated malformations, the degree of vermian malformation and the
      adequate control of hydrocephalus.
    explanation: >-
      Supports the caveat that absence of hydrocephalus does not on its own
      predict outcome, since vermian involvement and associated malformations
      are independent determinants.
prevalence:
- population: Europe (EUROCAT registries, 2002-2015, all birth outcomes)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 6.79
  rate_low: 5.79
  rate_high: 7.96
  notes: >-
    The most precise estimate available: 562 DW malformation cases in 8,028,454
    surveyed births across 28 registries in 17 countries. Counts all birth
    outcomes, which matters here because more than half of cases end in
    termination after prenatal diagnosis, so a livebirth-only denominator gives
    a much lower number (see the next record). DW variant was counted separately
    at 2.08 per 100,000 and is not included in this figure.
  evidence:
  - reference: PMID:31302658
    reference_title: "Epidemiology of Dandy-Walker Malformation in Europe: A EUROCAT Population-Based Registry Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall prevalence of DW malformation was 6.79 per 100,000 births (95%
      CI 5.79-7.96) with 39.2% livebirths, 4.3% foetal deaths from 20 weeks
      gestational age, and 56.5% terminations of pregnancy after prenatal
      diagnosis of foetal anomaly at any gestation (TOPFA).
    explanation: >-
      States the rate and confidence interval recorded here, and the birth-outcome
      breakdown that makes the choice of denominator material.

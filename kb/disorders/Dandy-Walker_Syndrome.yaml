- name: Rhombic Lip Progenitor Pool Failure
  description: >-
    The rhombic lip is a transient dorsal progenitor zone that supplies the
    glutamatergic neurons of the cerebellum and drives growth of the posterior
    vermis. In prenatal human DWM tissue it is specifically disrupted, with
    reduced proliferation and reduced self-renewal of the progenitor pool and
    altered vasculature, confirmed by laser-capture RNA sequencing of the zone
    itself. The proposed unified model is that either aberrant vascularization or
    direct insult reduces expansion of this pool, and that the timing of the
    insult relative to about 14 post-conception weeks decides whether the result
    is DWM or the milder cerebellar vermis hypoplasia.
  biological_scale: CELLULAR
  locations:
  - preferred_term: rhombic lip

    explanation: >-
      Cohort frequency of 32% for epilepsy supporting the FREQUENT band.
  - reference: PMID:30320441
    reference_title: Developmental outcomes in children with congenital cerebellar malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Presence of supratentorial abnormalities was not significantly associated

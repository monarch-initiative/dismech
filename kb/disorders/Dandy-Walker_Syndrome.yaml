- name: FOXC1 Haploinsufficiency at 6p25.3
  description: >-
    Deletion or intragenic mutation of FOXC1, a forkhead transcription factor, at
    6p25.3. FOXC1 is the same gene whose heterozygous mutation causes
    Axenfeld-Rieger anterior segment dysgenesis, which is why the ocular findings
    travel with the cerebellar ones in 6p25 deletion syndrome. Duplications as
    well as deletions of the locus are associated with posterior fossa
    malformation, so the dosage relationship is not a simple one-sided loss.
  biological_scale: MOLECULAR

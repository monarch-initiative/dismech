  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:35210871
    reference_title: A Rare Case of Dandy-Walker Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical manifestations include psychomotor retardation, ataxia and
      hydrocephalus.
    explanation: >-
      States ataxia as a manifestation of the syndrome. This is a single case
      report, so it supports presence and not frequency.
  - reference: PMID:40134959
    reference_title: "Unraveling Dandy-Walker Malformation: A Comprehensive Literature Review and Case Insight."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Approximately 1 in 10,000 to 30,000 live births is affected by this

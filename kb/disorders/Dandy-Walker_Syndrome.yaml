      Vermian malformation predicts gross motor and expressive language delay
      independently of associated supratentorial anomalies and of chromosomal
      findings, so the association survives the obvious confounders. What that
      does not do is name the mechanism between the malformed vermis and the
      delay, and hydrocephalus is a further contributor the analysis did not
      separate, so the edge is recorded as indirect with the intermediates
      unknown.
    evidence:
    - reference: PMID:21418200
      reference_title: Spectrum of neurodevelopmental disabilities in children with cerebellar malformations.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Additionally, malformations affecting the cerebellar vermis were
        significant independent predictors of expressive language (p=0.04) and
        gross motor delays (p=0.02).
      explanation: >-
        An adjusted cohort analysis in which the vermian malformation itself,
        rather than the anomalies accompanying it, predicts the developmental
        delay.
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The weakest and most confounded of the four cerebellar edges:
      hydrocephalus, associated supratentorial anomalies and the underlying
      chromosomal lesion all bear on the cognitive outcome. It is drawn because
      disease confined to the cerebellum, and to the vermis in particular, is on
      its own enough to produce executive, spatial and language impairment; the
      route from that to intellectual disability in a congenitally malformed
      cerebellum is not established.
    evidence:
    - reference: PMID:9577385
      reference_title: The cerebellar cognitive affective syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Behavioural changes were clinically prominent in patients with lesions
        involving the posterior lobe of the cerebellum and the vermis, and in
        some cases they were the most noticeable aspects of the presentation.
      explanation: >-
        Shows in patients whose disease is confined to the cerebellum that
        vermian involvement alone produces cognitive and behavioural impairment,
        which is the step this edge needs and which hydrocephalus cannot
        account for. INDIRECT because the cohort is acquired adult cerebellar
        disease, not a congenital malformation.
  evidence:
  - reference: PMID:34347142
    reference_title: Evidence of disrupted rhombic lip development in the pathogenesis of Dandy-Walker malformation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our histopathological analysis points to reduced foliation and inferior
      vermian hypoplasia as common features in all examined DWM cases.
    explanation: >-
      Direct neuropathological confirmation of the inferior-predominant vermian
      lesion in human DWM tissue.
  - reference: PMID:36137655
    reference_title: Refining the Neuroimaging Definition of the Dandy-Walker Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As confirmed by objective measures, the modern Dandy-Walker malformation
      phenotype is best defined by inferior predominant vermian hypoplasia, an
      enlarged tegmentovermian angle, inferolateral displacement of the tela
      choroidea/choroid plexus, an obtuse fastigial recess, and an unpaired
      caudal lobule.
    explanation: >-
      The current quantitative imaging definition of the lesion this node
      describes.
- name: Cystic Dilatation of the Fourth Ventricle
  description: >-
    The fourth ventricle dilates cystically and is continuous with a posterior
    fossa cyst, inside a posterior fossa that is enlarged in the anteroposterior
    dimension with the torcula and transverse sinuses displaced upward. Torcular
    elevation is the classical criterion that recent quantitative work argues
    should no longer be required for the diagnosis, which is a nosological
    change rather than a change in what is seen.
  biological_scale: TISSUE
  locations:
  - preferred_term: fourth ventricle
    term:
      id: UBERON:0002422
      label: fourth ventricle
  - preferred_term: posterior cranial fossa
    term:
      id: UBERON:0008788
      label: posterior cranial fossa
  downstream:
  - target: Impaired Cerebrospinal Fluid Egress from the Fourth Ventricle
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40445443
      reference_title: "Dandy-Walker syndrome: an updated literature review."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: >-
        This cystic formation is often covered by a membrane that blocks
        communication with the subarachnoid space; however, in some cases, the
        permeabilization of the AMA occurs, which may explain the presence or
        absence of hydrocephalus in this condition.
      explanation: >-
        Names the mechanism by which the cyst blocks CSF egress, and why the
        block is not universal, which is what makes hydrocephalus variable
        rather than obligate in this malformation.
  evidence:
  - reference: PMID:25552847
    reference_title: "The natural history of Dandy-Walker syndrome in the United States: A population-based analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The classic anatomic hallmarks of DWS are hypoplasia of the cerebellar
      vermis, anterior-posterior enlargement of the posterior fossa, upward
      displacement of the torcula and transverse sinuses, and cystic dilatation
      of the fourth ventricle.
    explanation: >-
      States the classical four anatomical criteria, including the cystic
      fourth-ventricle dilatation and the enlarged posterior fossa this node
      covers.
- name: Impaired Cerebrospinal Fluid Egress from the Fourth Ventricle
  description: >-
    The malformed fourth ventricle and its cyst obstruct CSF outflow, so
    production and absorption fall out of balance and ventricular pressure rises.
    The obstruction is at the level of the fourth ventricle and its outlets
    rather than the cerebral aqueduct: in a large endoscopic series 95% of
    treated children had an open aqueduct, which is also why endoscopic third
    ventriculostomy works at all in this malformation.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: cerebrospinal fluid circulation
    term:
      id: GO:0090660
      label: cerebrospinal fluid circulation
    modifier: DECREASED
  downstream:
  - target: Hydrocephalus
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25552847
      reference_title: "The natural history of Dandy-Walker syndrome in the United States: A population-based analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Congenital hydrocephalus is a condition resulting from increased
        intracranial pressure in the ventricular system due to a derangement
        between the production and absorption of CSF.
      explanation: >-
        States the production-absorption imbalance that converts the CSF egress
        block into hydrocephalus.
  - target: Macrocephaly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Raised intracranial pressure from the accumulated CSF
    - Expansion of an infant skull whose sutures have not yet fused
    description: >-
      The head enlarges because the pressure rises, not because CSF egress fails
      as such, and it does so only while the sutures are open. Both intermediates
      are known, and one of them - hydrocephalus - is a node in this graph, so
      the edge is a compression rather than a gap in the mechanism.
    evidence:
    - reference: PMID:40445443
      reference_title: "Dandy-Walker syndrome: an updated literature review."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: >-
        In the pediatric population, the most common postnatal sign of increased
        intracranial pressure is the progressive increase in head circumference
        or macrocephaly
      explanation: >-
        Ties the head growth to raised intracranial pressure specifically, which
        is the intermediate this edge compresses.
  evidence:
  - reference: PMID:21961544
    reference_title: Management of Dandy-Walker complex-associated infant hydrocephalus by combined endoscopic third ventriculostomy and choroid plexus cauterization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rate of success was 74% for DWM, 73% for DWV, and 100% for MCM; 95% had
      an open aqueduct, and none required posterior fossa shunting.
    explanation: >-
      Records that the aqueduct is patent in almost all of these children, which
      localises the obstruction to the fourth ventricle and its outlets.
phenotypes:
- category: Neuroimaging
  name: Dandy-Walker malformation
  description: >-
    The diagnostic imaging constellation itself: inferior-predominant vermian
    hypoplasia with upward rotation, cystic fourth-ventricle dilatation and an
    enlarged posterior fossa. Recorded as a phenotype as well as a mechanism
    because it is the finding the diagnosis is made on and the term other KB
    entries use when DWM appears inside a syndrome.
  diagnostic: true
  phenotype_term:
    preferred_term: Dandy-Walker malformation
    term:
      id: HP:0001305
      label: Dandy-Walker malformation
  evidence:
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dandy-Walker malformation (DWM) is a rare congenital abnormality of the
      posterior fossa and the cerebellum and has an incidence of 1 in 10 000 to
      30 000 births.
    explanation: >-
      Establishes DWM as a defined posterior fossa and cerebellar malformation
      entity.
- category: Neuroimaging
  name: Cerebellar vermis hypoplasia
  description: >-
    Partial or complete hypoplasia of the vermis, predominantly inferior. Present
    in every examined case in the largest neuropathological series of prenatal
    DWM tissue.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Cerebellar vermis hypoplasia
    term:
      id: HP:0001320
      label: Cerebellar vermis hypoplasia
  evidence:
  - reference: PMID:34347142
    reference_title: Evidence of disrupted rhombic lip development in the pathogenesis of Dandy-Walker malformation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our histopathological analysis points to reduced foliation and inferior
      vermian hypoplasia as common features in all examined DWM cases.
    explanation: >-
      Supports the obligate frequency: the finding was present in all examined
      cases in this neuropathological series.
- category: Neuroimaging
  name: Dilated fourth ventricle
  description: >-
    Cystic dilatation of the fourth ventricle continuous with the posterior fossa
    cyst. The OBLIGATE band records that this is one of the classical diagnostic
    criteria for the malformation, so a case without it is not called
    Dandy-Walker; it is not a measured frequency in an ascertained cohort. Note
    that the 2022 quantitative reanalysis defines the phenotype on vermian
    measures and does not list fourth-ventricle dilatation among its
    discriminating features, so the band rests on the classical definition
    rather than on the modern one.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Dilated fourth ventricle
    term:
      id: HP:0002198
      label: Dilated fourth ventricle
  evidence:
  - reference: PMID:35210871
    reference_title: A Rare Case of Dandy-Walker Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dandy-Walker syndrome (DWS) is a rare congenital malformation characterized
      by hypoplasia of the cerebellar vermis and its upward rotation and cystic
      enlargement of the fourth ventricle.
    explanation: >-
      States cystic fourth-ventricle enlargement as a defining feature, which is
      what makes it obligate rather than variable. This is a single case report,
      so it carries the definitional claim and not a frequency.
  - reference: PMID:25552847
    reference_title: "The natural history of Dandy-Walker syndrome in the United States: A population-based analysis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The classic anatomic hallmarks of DWS are hypoplasia of the cerebellar
      vermis, anterior-posterior enlargement of the posterior fossa, upward
      displacement of the torcula and transverse sinuses, and cystic dilatation
      of the fourth ventricle.
    explanation: >-
      Restates the definitional claim from a national population-based analysis
      rather than from a single case, which is the ascertainment base the
      OBLIGATE band needs.
- category: Neuroimaging
  name: Enlarged posterior fossa
  description: >-
    Anteroposterior enlargement of the posterior fossa with upward displacement
    of the torcula and transverse sinuses. Recorded here as a classical
    criterion; a 446-examination multicentre reanalysis found posterior fossa
    size and torcular location did not discriminate DWM from non-DWM and argued
    they should be removed from the criteria.
  phenotype_term:
    preferred_term: Enlarged posterior fossa
    term:
      id: HP:0005445
      label: Enlarged posterior fossa
  evidence:
  - reference: PMID:25552847
    reference_title: "The natural history of Dandy-Walker syndrome in the United States: A population-based analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The classic anatomic hallmarks of DWS are hypoplasia of the cerebellar
      vermis, anterior-posterior enlargement of the posterior fossa, upward
      displacement of the torcula and transverse sinuses, and cystic dilatation
      of the fourth ventricle.
    explanation: >-
      States the classical criterion.
  - reference: PMID:36137655
    reference_title: Refining the Neuroimaging Definition of the Dandy-Walker Phenotype.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Posterior fossa size and torcular location should be eliminated from the
      diagnostic criteria.
    explanation: >-
      Contradicts the diagnostic weight of this feature. Kept as a REFUTE item
      rather than dropping the phenotype, because the finding is real and still
      described; it is its discriminating value that is disputed.
- category: Neurological
  name: Hydrocephalus
  description: >-
    Progressive ventricular enlargement from impaired CSF egress. The quoted
    frequency depends heavily on the source: neurosurgical and genetics reviews
    repeat "up to 80%", while a paediatric neurology cohort applying the modern
    imaging criteria found 48%, and a US inpatient analysis found only 20.4% of
    admitted children received operative CSF drainage. The frequency band below
    reflects the modern cohort figures rather than the historical 80%.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Hydrocephalus
    term:
      id: HP:0000238
      label: Hydrocephalus
  evidence:
  - reference: PMID:36068432
    reference_title: "Dandy-Walker malformation and variants: clinical features and associated anomalies in 28 affected children-a single retrospective study and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among these, hydrocephalus was found in 13/28 (48%), and hydrocephalus plus
      corpus callosum anomalies in three children (10%).
    explanation: >-
      Cohort frequency of 48% in 28 children assessed against the modern
      criteria, which is the figure the FREQUENT band is taken from.
  - reference: PMID:42432063
    reference_title: Quantitative ventricular volume changes after endoscopic third ventriculostomy in children with Dandy-Walker malformation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hydrocephalus occurs in up to 80% of children with Dandy-Walker
      malformation (DWM).
    explanation: >-
      The higher figure quoted in the neurosurgical literature. Recorded beside
      the cohort number rather than instead of it, because the two are not
      reconciled.
  - reference: PMID:25552847
    reference_title: "The natural history of Dandy-Walker syndrome in the United States: A population-based analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      20.4% of DWS patients received operative cerebrospinal fluid (CSF)
      drainage, 81-times more than controls (P < 0.0001).
    explanation: >-
      The third and lowest figure, from a US national inpatient sample. It counts
      operative CSF drainage among admitted patients rather than hydrocephalus
      among all patients, which is why it is recorded alongside the other two
      rather than reconciled with them.
- category: Physical
  name: Macrocephaly
  description: >-
    Enlarged head circumference, usually a consequence of hydrocephalus rather
    than an independent finding. It was the single most frequent physical
    finding in a classical 38-case series.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Macrocephaly
    term:
      id: HP:0000256
      label: Macrocephaly
  evidence:
  - reference: PMID:1863935
    reference_title: "Dandy-Walker malformation: analysis of 38 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Macrocephaly was the most frequent physical finding, appearing in 31 cases
      (82%).
    explanation: >-
      Gives the 82% frequency in a 38-case series, which supports the
      VERY_FREQUENT band. Note this is a 1991 hospital series ascertained before
      routine prenatal imaging, so it is skewed toward symptomatic cases.
- category: Neurodevelopmental
  name: Global developmental delay
  description: >-
    Delay across motor, language and cognitive domains. Two thirds of children in
    a modern DWM/DWV cohort; 85% across a broader congenital cerebellar
    malformation cohort. Outcome is markedly better when the malformation is
    genuinely isolated.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:36068432
    reference_title: "Dandy-Walker malformation and variants: clinical features and associated anomalies in 28 affected children-a single retrospective study and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common clinical features were the developmental delay and epilepsy
      observed in 19/28 (67%) and in 9/28 (32%) of the cases.
    explanation: >-
      Cohort frequency of 67% supporting the FREQUENT band.
  - reference: PMID:18759601
    reference_title: "The Dandy-Walker variant: a case series of 24 pediatric patients and evaluation of associated anomalies, incidence of hydrocephalus, and developmental outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five of 6 patients with isolated DWV had a normal developmental course.
    explanation: >-
      Records the isolated-case exception that makes the pooled frequency
      misleading when applied to an individual child.
- category: Neurodevelopmental
  name: Intellectual disability
  description: >-
    Variable, and the reported frequency varies more than for any other feature
    here. A classical hospital series found IQ below 70 in 58% of survivors; a
    congenital cerebellar malformation cohort found 61%; a systematic review of
    published case reports found mild or severe intellectual disability recorded
    in only 6.4%, which almost certainly reflects what case reports choose to
    state rather than the true distribution.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:1863935
    reference_title: "Dandy-Walker malformation: analysis of 38 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mental retardation (IQ below 70) was found in 11 cases (58% of survivors),
      low intellect (IQ between 70 and 85) in 4, and only 2 patients showed
      normal intellectual development (IQ more than 85).
    explanation: >-
      Gives a measured IQ distribution in survivors, supporting the FREQUENT
      band.
  - reference: PMID:30320441
    reference_title: Developmental outcomes in children with congenital cerebellar malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intellectual disability was present in 61 percent (27/43) and autism
      spectrum disorder (ASD) in 12 percent (6/52).
    explanation: >-
      Corroborating frequency from a congenital cerebellar malformation cohort,
      of which DWM was 15%.
  - reference: PMID:28635420
    reference_title: "The Most Common Comorbidities in Dandy-Walker Syndrome Patients: A Systematic Review of Case Reports."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Almost one-fifth had a mental illness diagnosis; only 6.4% had mild or
      severe intellectual disability.
    explanation: >-
      Reports a far lower frequency than the cohorts above. Recorded as REFUTE
      against the FREQUENT band rather than averaged in, because the ascertainment
      base is published case reports rather than a patient series.
- category: Neurological
  name: Seizure
  description: >-
    Epilepsy affects roughly a third of children in modern cohorts and is more

- name: Posterior Fossa Mesenchymal Signalling Failure
  description: >-
    The mesenchyme overlying the developing hindbrain — the future meninges of
    the posterior fossa — normally secretes signals that the adjacent
    neuroepithelium requires. When FOXC1 function is lost in that mesenchyme, the
    signals are not made, and the rhombic lip on the other side of the interface
    fails. This is why a mesenchymal transcription factor is a cerebellar
    malformation gene, and it is the mechanistic point that distinguishes the
    FOXC1 arm from a cell-autonomous neuronal defect.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: meningeal (meningothelial) cell
    term:

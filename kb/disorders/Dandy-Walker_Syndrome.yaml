      fourth ventricle follows the failure of the vermis to grow over its roof.
      The classical embryological model runs the other way, and is recorded as a
      REFUTE item on this edge rather than dropped.
    evidence:
    - reference: PMID:40445443
      reference_title: "Dandy-Walker syndrome: an updated literature review."
      supports: REFUTE
      directness: DIRECT
      evidence_source: OTHER
      snippet: >-
        The pulsations of CSF cause the AMA to expand into the posterior region

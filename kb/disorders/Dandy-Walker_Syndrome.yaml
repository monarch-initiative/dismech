- name: ZIC1-ZIC4 Heterozygous Deletion at 3q24
  description: >-
    Interstitial deletion of the linked zinc-finger transcription factor genes
    ZIC1 and ZIC4 at 3q24, mapped from human DWM patients as the first critical
    region for the malformation. The lesion is a contiguous-gene heterozygous
    deletion rather than a point mutation, so both genes are lost together and
    the mouse model that reproduces the phenotype is a double heterozygote.

- category: Neuroimaging
  name: Hypoplasia of the pons
  description: >-
    Brainstem involvement occurs in a substantial minority and separates into a
    mild form of anteroposterior disproportion, most often pontine hypoplasia,
    and a severe form with tegmental dysplasia. The distinction matters
    clinically rather than descriptively: the severe form carries higher rates of

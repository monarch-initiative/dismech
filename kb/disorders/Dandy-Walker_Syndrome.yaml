name: Dandy-Walker Syndrome
creation_date: "2026-09-09T13:20:42Z"
category: Genetic
synonyms:
- Dandy-Walker malformation
- DWM
- DWS
- Dandy-Walker complex
- Dandy-Walker spectrum disorder
- isolated Dandy-Walker malformation
description: >-
  Dandy-Walker malformation is the most commonly diagnosed human cerebellar
  birth defect. It is defined on imaging, not on a gene: hypoplasia of the
  cerebellar vermis that predominantly affects its inferior portion, upward
  rotation of the cerebellum away from the brainstem so that the tentorium is
  elevated, and cystic dilatation of the fourth ventricle continuous with the
  posterior fossa cyst inside an enlarged posterior fossa. Torcular elevation is
  the classical fourth criterion and is the one modern quantitative work has
  argued should be dropped.

  Two literatures describe how it arises and they are not the same claim. The
  midline-patterning account came from human deletion mapping: heterozygous
  deletion of the linked genes ZIC1 and ZIC4 at 3q24 defined the first critical
  region, and deletion of FOXC1 at 6p25.3 defined the second. The striking point
  about FOXC1 is that it is not acting cell-autonomously in the cerebellum at
  all. Foxc1-null mice lose rhombic lip development because the overlying
  posterior fossa mesenchyme stops secreting the signals the neuroepithelium
  needs, which makes a mesenchymal gene a cerebellar malformation gene. Rare
  autosomal dominant families with occipital cephalocele carry mutations in the
  extracellular matrix genes NID1 and LAMC1, pointing at the same meningeal
  compartment from a different direction.

  The second, more recent account works directly on human fetal tissue. Laser
  capture and RNA sequencing of the rhombic lip in prenatal DWM cases place the
  defect in that transient dorsal progenitor zone, with reduced proliferation
  and self-renewal of the progenitor pool that drives growth of the posterior
  vermis. That work sits on a species observation with real consequences: the
  human rhombic lip persists longer than the mouse's and reorganises into a
  posterior-lobule progenitor pool that has no counterpart in mouse or even in
  macaque. So the compartment where the human lesion is being localised is
  partly one that the mouse models of the same genes cannot contain.

  Downstream the malformation obstructs cerebrospinal fluid egress from the
  fourth ventricle, and hydrocephalus follows in a large minority to a majority
  of children depending on the series and on how strictly the phenotype is
  defined. Macrocephaly, developmental delay, intellectual disability, seizures,
  hypotonia and ataxia follow, all with wide variability that tracks associated
  anomalies more than it tracks the posterior fossa findings themselves.
  Management is CSF diversion — ventriculoperitoneal or cystoperitoneal shunting,
  or endoscopic third ventriculostomy with or without choroid plexus
  cauterization — plus developmental therapies and genetic counselling.

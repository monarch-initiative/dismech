genetic:
- name: ZIC1
  gene_term:
    preferred_term: ZIC1
    term:
      id: hgnc:12872
      label: ZIC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Lost as part of a heterozygous proximal-3q interstitial deletion that also
    removes the adjacent ZIC4. The DWM mechanism is deletion of the linked pair, so ZIC1
    should not be reported as a single-gene DWM cause on its own.
  notes: >-
    Intragenic heterozygous ZIC1 variants in the final exon act by gain of
    function and produce craniosynostosis with variable intellectual disability,
    not DWM. Keeping these allele classes apart matters when interpreting a
    ZIC1 result in a child with a posterior-fossa anomaly.
  evidence:
  - reference: PMID:15338008
    reference_title: "Heterozygous deletion of the linked genes ZIC1 and ZIC4 is involved in Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through physical mapping of 3q2 interstitial deletions in several
      individuals with DWM, we defined the first critical region associated with
      DWM, encompassing two adjacent Zinc finger in cerebellum genes, ZIC1 and
      ZIC4.
    explanation: >-
      Maps ZIC1 into the first DWM critical region as one of a linked pair.
  - reference: PMID:42028696
    reference_title: "Expanding the phenotypic spectrum associated with ZIC1 variants: A neurodevelopmental disorder with and without craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous deletions encompassing ZIC1 and ZIC4 cause Dandy-Walker
      malformation, whilst in the final exon heterozygous ZIC1 variants result
      in a distinct phenotype of craniosynostosis with variable intellectual
      disability via a gain-of-function mechanism.
    explanation: >-
      Separates the DWM-causing contiguous deletion from the non-DWM intragenic
      gain-of-function allele class, which is the caveat recorded in notes.
- name: ZIC4
  gene_term:
    preferred_term: ZIC4
    term:
      id: hgnc:20393
      label: ZIC4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Co-deleted with ZIC1 in the proximal-3q DWM critical region. Mice heterozygous for
    deletion of both linked genes reproduce a DWM-like phenotype.
  evidence:
  - reference: PMID:15338008
    reference_title: "Heterozygous deletion of the linked genes ZIC1 and ZIC4 is involved in Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice with a heterozygous deletion of these two linked genes have a
      phenotype that closely resembles DWM, providing a mouse model for this
      malformation.
    explanation: >-
      Supports the causal role of losing the ZIC1/ZIC4 pair by showing the
      heterozygous double deletion is sufficient in mouse.
- name: FOXC1
  gene_term:
    preferred_term: FOXC1
    term:
      id: hgnc:3800
      label: FOXC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    6p25.3 deletions and duplications encompassing FOXC1, and intragenic FOXC1
    variants, are associated with DWM. Reducing Foxc1 lowers mesenchyme-expressed
    secreted signals while leaving neural-tube gene expression intact, so the
    route to the cerebellar defect is non-cell-autonomous. FOXC1 haploinsufficiency
    also causes Axenfeld-Rieger syndrome, so an individual with a 6p25.3 lesion
    may present through ophthalmology rather than neurology.
  evidence:
  - reference: PMID:28092268
    reference_title: "Phenotypic outcomes in Mouse and Human Foxc1 dependent Dandy-Walker cerebellar malformation suggest shared mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analyses of rare human del chr 6p25 fetal cerebella demonstrate extensive
      phenotypic overlap with our Foxc1 mutant mouse models, validating our DWM
      models and demonstrating that many key mechanisms controlling cerebellar
      development are likely conserved between mouse and human.
    explanation: >-
      Anchors FOXC1-dependent DWM in human del 6p25 fetal cerebellar tissue.
  - reference: PMID:19668217
    reference_title: "FOXC1 is required for normal cerebellar development and is a major contributor to chromosome 6p25.3 Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human FOXC1 heterozygous mutations are known to affect eye development,
      causing a spectrum of glaucoma-associated anomalies (Axenfeld-Rieger
      syndrome, ARS; MIM no. 601631). We report the first brain imaging data
      from humans with FOXC1 mutations and show that these individuals also have
      CVH.
    explanation: >-
      Supports the note that the same locus reaches clinical attention through
      the eye, and that intragenic FOXC1 mutation carriers have cerebellar
      vermis hypoplasia on imaging.
diagnosis:
- name: Prenatal ultrasound and fetal MRI
  description: >-
    DWM is a neuroimaging diagnosis and is detected before birth in the large
    majority of cases. In the European registry cohort the prenatal detection
    rate was 87.6%, and just under half of cases were an isolated cerebral
    anomaly, so a prenatal finding of DWM is as much a prompt to look for
    additional anomalies as it is a diagnosis in itself.
  evidence:
  - reference: PMID:31302658
    reference_title: "Epidemiology of Dandy-Walker Malformation in Europe: A EUROCAT Population-Based Registry Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prenatal detection rate was 87.6%.
    explanation: Quantifies how reliably DWM is identified antenatally.
  - reference: PMID:31302658
    reference_title: "Epidemiology of Dandy-Walker Malformation in Europe: A EUROCAT Population-Based Registry Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two-hundred and seventy-three cases (48.6%) had an isolated cerebral
      anomaly and 24.2, 19.2 and 5.5% cases were associated with other
      structural non-cerebral anomalies, chromosomal anomalies and genetic
      syndromes respectively.
    explanation: >-
      Gives the isolated-versus-associated split, which is what makes a
      systematic search for additional anomalies part of the diagnostic workup.
- name: Chromosomal microarray analysis
  description: >-
    Both established DWM loci are copy-number lesions — the contiguous ZIC1 plus
    ZIC4 deletion and the 6p25.3 FOXC1 deletion or duplication — so the test
    that finds the mechanism this entry curates is CMA, not sequencing. Reported
    diagnostic efficacy is 25% in DWM specifically. Exome sequencing can miss
    copy-number variants, so the two tests are complementary rather than
    alternatives.
  evidence:
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromosomal microarray analysis (CMA) has been reported to have a
      diagnostic efficacy of 14.6% in individuals with posterior fossa defects
      and 25% in DWM specifically
    explanation: >-
      Gives the DWM-specific CMA yield. Quoted from this paper's discussion,
      where it is attributed to two earlier studies rather than measured here.
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since cES may fail to identify some copy number variants, it would be
      reasonable to request a CMA before, after, or in conjunction with cES to
      maximize diagnostic efficacy.
    explanation: >-
      Supports treating CMA and exome as complementary, which is why both are
      curated here rather than one replacing the other.
- name: Exome sequencing in non-isolated Dandy-Walker malformation
  description: >-
    Clinical exome sequencing in DWM occurring with additional CNS or extra-CNS
    anomalies (DWM+) yields a definitive or probable molecular diagnosis in
    about a third of individuals, and substantially outperforms targeted brain
    malformation gene panels. This is the practical argument for exome rather
    than panel testing when DWM is not isolated.
  evidence:
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A definitive or probable diagnosis was made for 32 individuals, yielding a
      diagnostic rate of 35.2% (32/91).
    explanation: >-
      Quantifies the exome diagnostic yield in a DWM+ cohort of 91.
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Commercially available brain malformation panels would have detected only
      24.2% (8/33) to 54.5% (18/33) of the diagnoses made by cES.
    explanation: >-
      Supports preferring exome over targeted panels in this setting.
treatments:
- name: Ventriculoperitoneal Shunting
  description: >-
    CSF diversion from the lateral ventricle to the peritoneum. Because the
    supratentorial ventricles and the posterior-fossa cyst behave as one
    compartment in a distal outflow block, a single shunt generally controls
    both. In a small single-centre comparison, VPS outperformed posterior-fossa
    cystoperitoneal shunting on clinical outcome, postoperative frontal-occipital
    horn ratio and adaptive behaviour scores.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: ventriculoperitoneal shunt placement
    term:
      id: NCIT:C168483
      label: Ventriculoperitoneal Shunt Placement
  target_mechanisms:
  - target: Obstruction of Fourth Ventricular CSF Outflow
    description: >-
      Bypasses the obstructed fourth-ventricular outflow by draining CSF to the
      peritoneal cavity, without altering the underlying malformation.
  evidence:
  - reference: PMID:21928031
    reference_title: "Hydrocephalus in Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among therapeutical strategies, single shunting (ventriculo-peritoneal or
      cyst-peritoneal shunts) appears effective in the control of both ventricle
      and cyst size.
    explanation: >-
      Supports single-catheter CSF diversion as effective for both compartments.
  - reference: PMID:41526540
    reference_title: "Dandy-Walker syndrome with hydrocephalus undergoing VPS or CPS? A single-center retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The choice of shunt procedure was statistically significantly associated
      with clinical outcome
    explanation: >-
      Supports that shunt route is not outcome-neutral in DWM; the same series
      reports VPS superior to CPS. The cohort is 12 children from one centre, so
      this is a small retrospective signal rather than a settled comparison.
- name: Endoscopic Third Ventriculostomy
  description: >-
    Endoscopic creation of a stoma in the floor of the third ventricle,
    increasingly used as primary treatment of DWM hydrocephalus in place of a
    shunt. In a 30-child series the overall success rate was about two thirds,
    with most failures inside four months; supratentorial ventricular volume
    fell reliably, whereas posterior-fossa cyst volume reduction was
    inconsistent and did not predict clinical improvement.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: endoscopic third ventriculostomy
    term:
      id: NCIT:C182204
      label: Third Ventriculostomy
  target_mechanisms:
  - target: Obstruction of Fourth Ventricular CSF Outflow
    description: >-
      Creates an alternative CSF egress route proximal to the fourth-ventricular
      block.
  evidence:
  - reference: PMID:42432063
    reference_title: "Quantitative ventricular volume changes after endoscopic third ventriculostomy in children with Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall success rate was 66.7%, with most failures occurring within
      four months.
    explanation: >-
      Quantifies ETV success and the early failure window in DWM.
  - reference: PMID:42432063
    reference_title: "Quantitative ventricular volume changes after endoscopic third ventriculostomy in children with Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ventricular volume reduction correlated and CSF flow across the stoma with
      good clinical outcomes, whereas cyst volume reduction did not consistently
      predict clinical improvement.
    explanation: >-
      Supports the caveat that cyst shrinkage is not the outcome measure to
      follow after ETV. Quoted as printed in the abstract, which contains a
      typographical transposition.
- name: Multidisciplinary Neurological Follow-Up and Management of Associated Anomalies
  description: >-
    Beyond CSF diversion there is no disease-modifying therapy, and management
    is structural and supportive: treat the hydrocephalus, identify and treat
    the associated anomalies, and follow the child neurologically. Because half
    to two thirds of cases are non-isolated and comorbidity is what drives
    outcome, the coordinating work is itself the intervention. Symptomatic
    treatment of the seizures and the developmental delay curated above follows
    ordinary paediatric practice; see this entry's notes for why no
    drug-specific or therapy-specific treatment is asserted here.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Global developmental delay
    description: >-
      Coordinated follow-up is directed at the developmental and comorbid burden
      rather than at the malformation, which is not modifiable.
  - target: Seizure
    description: >-
      Seizures are managed within the same neurological follow-up rather than by
      any DWM-specific intervention.
  evidence:
  - reference: PMID:40445443
    reference_title: "Dandy-Walker syndrome: an updated literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management involves treating hydrocephalus, addressing associated
      anomalies, and providing neurological follow-up with a multidisciplinary
      team.
    explanation: >-
      States the three components of management this treatment names.
  - reference: PMID:36068432
    reference_title: "Dandy-Walker malformation and variants: clinical features and associated anomalies in 28 affected children-a single retrospective study and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The high frequency of comorbidities requires the coexistence of
      multidisciplinary specialists for early diagnosis and for rapid
      identification of the associated anomalies.
    explanation: >-
      Gives the reason the coordinating work is treated as an intervention here:
      comorbidity frequency, not the malformation itself.
differential_diagnoses:
- name: Joubert syndrome
  description: >-
    A ciliopathy with mid-hindbrain malformation that can be mistaken for DWM on
    early imaging before the molar tooth sign is looked for.
  distinguishing_features:
  - Molar tooth sign on axial imaging at the midbrain-hindbrain junction, absent in DWM.
  - No cystic fourth ventricle continuous with an enlarged posterior fossa.
  disease_term:
    preferred_term: Joubert syndrome
    term:
      id: MONDO:0018772
      label: Joubert syndrome
  evidence:
  - reference: PMID:33717386
    reference_title: "A case report of Joubert syndrome with renal involvement and seizures in a neonate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initially a diagnosis of Dandy Walker malformation with no clear signs of
      obstruction of the foramen magnum was suspected, however upon closer
      reevaluation of the MRI the presence of inferior vermis agenesis with a
      medial crack in the cerebellum, a partial dysgenesis of corpus calosum, an
      underlying and thicker cerebral peduncle as well the molar tooth sign, all
      pointed to Joubert syndrome as a potential diagnosis.
    explanation: >-
      A worked instance of the confusion this differential names: DWM was the
      initial read and the molar tooth sign is what redirected it to Joubert.
- name: Dandy-Walker variant
  description: >-
    A milder posterior-fossa picture with partial vermian hypoplasia and
    fourth-ventricular enlargement but without the enlarged posterior fossa and
    torcular elevation of full DWM. Population registries count it as a separate
    entity from DWM rather than folding it in, and at roughly a third of the DWM
    rate. It is deliberately not curated as a subtype here: it fails the imaging
    definition this entry is built on, and the term itself is used
    inconsistently across series.
  distinguishing_features:
  - Posterior fossa is not enlarged and the torcula is not elevated.
  - Vermian hypoplasia is partial rather than complete.
  evidence:
  - reference: PMID:31302658
    reference_title: "Epidemiology of Dandy-Walker Malformation in Europe: A EUROCAT Population-Based Registry Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of DW variant was 2.08 per 100,000 (95% CI 1.39-3.13).
    explanation: >-
      A European registry study counting DW variant separately from DWM, at
      roughly a third of the DWM rate, which is the practical argument for
      keeping the two apart in this entry.
- name: Mega cisterna magna
  description: >-
    An enlarged retrocerebellar CSF space with a normally formed, non-rotated
    vermis and an intact fourth ventricle. Historically lumped into the
    "Dandy-Walker complex", which is one reason DWM prevalence and outcome
    figures vary between series.
  distinguishing_features:
  - Cerebellar vermis is normally formed and not upwardly rotated.
  - No cystic dilatation of the fourth ventricle.
  evidence:
  - reference: PMID:21928031
    reference_title: "Hydrocephalus in Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further confusion is added by the inclusion, in some classification, of
      different malformations with different prognosis and therapeutic strategy
      under the same label of "Dandy-Walker".
    explanation: >-
      Supports treating the wider "Dandy-Walker complex" label as a source of
      diagnostic confusion rather than as a single entity.
  - reference: PMID:40445443
    reference_title: "Dandy-Walker syndrome: an updated literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Dandy-Walker syndrome (DWS) encompasses a group of anatomical midline
      cerebellar disorders with potential shared embryological origins,
      including the classic Dandy-Walker malformation, Blake's pouch cyst, and
      mega cisterna magna.
    explanation: >-
      Shows that "Dandy-Walker syndrome" is used in the current literature for a
      group that includes mega cisterna magna. This entry deliberately does not
      follow that usage: it curates the classic malformation, whose imaging
      definition mega cisterna magna does not meet, and records the wider group
      here as a differential instead.
animal_models:
- name: Zic1/Zic4 heterozygous deletion mouse
  species: Mouse
  genotype: Zic1/Zic4 heterozygous deletion (Zic1+/-;Zic4+/-) and Zic1-/-;Zic4-/-
  description: >-
    Mice carrying a heterozygous deletion of the linked Zic1 and Zic4 genes
    develop cerebellar size and foliation defects resembling human DWM. The
    model was the basis for showing that the size reduction comes from decreased
    postnatal granule cell progenitor proliferation, and that Zic1/Zic4 have
    both Shh-dependent (proliferation) and Shh-independent (anterior vermis
    foliation) roles.
  publication: PMID:21307096
  genes:
  - preferred_term: ZIC1
    term:
      id: hgnc:12872
      label: ZIC1
  - preferred_term: ZIC4
    term:
      id: hgnc:20393
      label: ZIC4
  modeled_mechanisms:
  - target: Reduced Granule Cell Progenitor Proliferation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The proliferation deficit was demonstrated in this model and is the
      mechanism by which cerebellar size is reduced.
    limitations: >-
      Cerebellar foliation is largely a postnatal process in mouse, so the
      timing of the proliferative window is not directly transferable to the
      human prenatal course.
    readouts:
    - name: Postnatal granule cell progenitor proliferation
      target: Reduced Granule Cell Progenitor Proliferation
      direction: DECREASED
      interpretation: >-
        Reduced proliferation of granule cell progenitors is the measured
        cellular deficit underlying the reduced cerebellar size.
      evidence:
      - reference: PMID:21307096
        reference_title: "Multiple developmental programs are altered by loss of Zic1 and Zic4 to cause Dandy-Walker malformation cerebellar pathogenesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Here, we show that reduced cerebellar size in Zic1 and Zic4 mutants
          results from decreased postnatal granule cell progenitor
          proliferation.
        explanation: Reports the direction and identity of this measurement.
    evidence:
    - reference: PMID:21307096
      reference_title: "Multiple developmental programs are altered by loss of Zic1 and Zic4 to cause Dandy-Walker malformation cerebellar pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Through genetic and molecular analyses, we show that Zic1 and Zic4 have
        Shh-dependent function promoting proliferation of granule cell
        progenitors.
      explanation: >-
        Supports treating this model as informative for the proliferation node
        by identifying the pathway through which Zic dosage acts on it.
  - target: Cerebellar Vermis Hypoplasia with Upward Rotation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Heterozygous double-deletion mice show a cerebellar phenotype closely
      resembling DWM, covering the size and foliation components.
    limitations: >-
      The source describes resemblance to DWM at the level of cerebellar size
      and foliation; it does not report the upward vermian rotation over a
      posterior-fossa cyst that names this node in humans.
    evidence:
    - reference: PMID:15338008
      reference_title: "Heterozygous deletion of the linked genes ZIC1 and ZIC4 is involved in Dandy-Walker malformation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice with a heterozygous deletion of these two linked genes have a
        phenotype that closely resembles DWM, providing a mouse model for this
        malformation.
      explanation: >-
        Supports treating the heterozygous Zic1/Zic4 deletion mouse as a model
        for the human malformation.
  evidence:
  - reference: PMID:15338008
    reference_title: "Heterozygous deletion of the linked genes ZIC1 and ZIC4 is involved in Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice with a heterozygous deletion of these two linked genes have a
      phenotype that closely resembles DWM, providing a mouse model for this
      malformation.
    explanation: Establishes the model and its correspondence to human DWM.
- name: Foxc1 hypomorphic mouse
  species: Mouse
  genotype: Foxc1 hypomorphic homozygote (Foxc1hith/hith), retaining ~5% Foxc1 activity; also Foxc1-/-
  description: >-
    Foxc1 hypomorphic mice are viable as adults and show a partially formed
    posterior lobule that exposes the internal granule layer to the fourth
    ventricle, echoing the human DWM posterior-vermis "tail sign". Lineage
    tracing attributes it to premature and ectopic migration of
    rhombic-lip-derived cells fated for the posterior vermis, and qRT-PCR shows
    the primary
    effect is on mesenchyme-expressed rather than neural-tube-expressed genes.
  publication: PMID:28092268
  genes:
  - preferred_term: FOXC1
    term:
      id: hgnc:3800
      label: FOXC1
  modeled_mechanisms:
  - target: FOXC1-Dependent Posterior Fossa Mesenchymal Signalling Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The model directly demonstrates the non-cell-autonomous mesenchymal
      mechanism this node asserts.
    limitations: >-
      The hypomorph retains about 5% activity, whereas human del 6p25.3 patients
      retain one functional FOXC1 allele; the mouse null is more severe than the
      human phenotype and is neonatally lethal.
    readouts:
    - name: Hindbrain mesenchyme secreted-signal gene expression
      target: FOXC1-Dependent Posterior Fossa Mesenchymal Signalling Failure
      direction: DECREASED
      interpretation: >-
        Reduced Foxc1 lowers mesenchyme-expressed secreted signals while leaving
        neural-tube gene expression intact, locating the lesion outside the
        neuroepithelium.
      evidence:
      - reference: PMID:28092268
        reference_title: "Phenotypic outcomes in Mouse and Human Foxc1 dependent Dandy-Walker cerebellar malformation suggest shared mechanisms."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Foxc1 reduction decreases hindbrain mesenchyme expressed genes (Tgfb1,
          SDF1α, Bmp2 and Bmp4), but not neural tube expressed genes (Fgf15 and
          Cxcr4).
        explanation: Reports the measured expression changes and their direction.
    evidence:
    - reference: PMID:28092268
      reference_title: "Phenotypic outcomes in Mouse and Human Foxc1 dependent Dandy-Walker cerebellar malformation suggest shared mechanisms."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Further, our analyses clearly demonstrate that competent meningeal
        signaling is required for multiple aspects of prenatal and postnatal
        cerebellar development.
      explanation: >-
        Supports the model as informative for the meningeal-mesenchymal
        signalling node.
  - target: Cerebellar Vermis Hypoplasia with Upward Rotation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the posterior-vermis component of the human phenotype,
      including a mouse correlate of the DWM tail sign.
    limitations: >-
      The mouse reproduces the posterior folial abnormality but not the upward
      rotation of the vermis over a posterior-fossa cyst, and mouse cerebellar
      foliation is postnatal whereas the human defect is established prenatally.
    readouts:
    - name: Posterior vermis lobule X formation
      target: Cerebellar Vermis Hypoplasia with Upward Rotation
      direction: ALTERED
      interpretation: >-
        A partially formed posterior lobule is the mouse structural correlate of
        the human DWM tail sign.
      evidence:
      - reference: PMID:28092268
        reference_title: "Phenotypic outcomes in Mouse and Human Foxc1 dependent Dandy-Walker cerebellar malformation suggest shared mechanisms."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Particularly striking is the presence of a partially formed posterior
          lobule which echoes the posterior vermis DW 'tail sign' observed in
          human imaging studies.
        explanation: Reports the structural measurement behind this readout.
    evidence:
    - reference: PMID:28092268
      reference_title: "Phenotypic outcomes in Mouse and Human Foxc1 dependent Dandy-Walker cerebellar malformation suggest shared mechanisms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Analyses of rare human del chr 6p25 fetal cerebella demonstrate
        extensive phenotypic overlap with our Foxc1 mutant mouse models,
        validating our DWM models and demonstrating that many key mechanisms
        controlling cerebellar development are likely conserved between mouse
        and human.
      explanation: >-
        The human fetal comparison is what licenses treating this mouse as
        informative for the human vermian defect.
- name: Isl1-Cre G9a conditional mouse
  species: Mouse
  genotype: Isl1-Cre-driven G9a (Ehmt2) inactivation in a subset of Isl1-expressing progenitors
  description: >-
    Conditional G9a inactivation in Isl1-expressing progenitors produces
    hydrocephalus with an underdeveloped cerebellum, which the authors describe
    as modelling aspects of the Dandy-Walker complex. This is a phenocopy in a
    gene with no established human DWM association, so it is recorded as a
    mechanistic lead about progenitor-derived multicomponent malformation rather
    than as a model of a known DWM locus.
  publication: PMID:37470706
  modeled_mechanisms:
  - target: Obstruction of Fourth Ventricular CSF Outflow
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces hydrocephalus alongside an underdeveloped cerebellum, but via
      a thinned and disorganized lateral-ventricle neuroepithelium rather than
      the fourth-ventricular outflow block that operates in human DWM.
    limitations: >-
      G9a/EHMT2 is not an established human DWM gene; the Cre driver had reduced
      recombinase activity so the affected progenitor population is a subset;
      and the CSF compartment implicated is the lateral ventricle, not the
      fourth-ventricular outflow this node names. The correspondence to human
      DWM is at the level of the phenotype constellation, not the mechanism.
    evidence:
    - reference: PMID:37470706
      reference_title: "G9a inactivation in progenitor cells with Isl1-Cre with reduced recombinase activity models aspects of Dandy-Walker complex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        G9a mutants reached endpoint by 7 weeks of age with cardiac hypertrophy,
        hydrocephalus, underdeveloped cerebellum and hind limb paralysis,
        modeling aspects of Dandy-Walker complex.
      explanation: >-
        Reports the phenotype constellation and the authors' own framing of it
        as modelling aspects of the Dandy-Walker complex.
  evidence:
  - reference: PMID:37470706
    reference_title: "G9a inactivation in progenitor cells with Isl1-Cre with reduced recombinase activity models aspects of Dandy-Walker complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, altered development of descendants of the second heart field and the
      neural crest could contribute to multicomponent malformation like
      Dandy-Walker.
    explanation: >-
      The authors' own conclusion, stated as a possibility rather than a
      demonstrated human mechanism, which is why this model is recorded at LOW
      fidelity and as a lead rather than as a DWM locus.
discussions:
- discussion_id: human_specific_posterior_rhombic_lip
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The human posterior rhombic lip persists longer than the mouse one and forms
    a progenitor pool in the posterior lobule that has no counterpart in mouse
    or even in macaque. If the compartment whose disruption produces DWM is
    itself human-specific, how far can the Zic1/Zic4 and Foxc1 mouse models be
    read as models of the human posterior-vermian defect rather than of a
    partially overlapping mouse phenotype?
  attaches_to:
  - pathophysiology#Rhombic Lip and Roof Plate Patterning Failure
  - animal_models#Foxc1 hypomorphic mouse
  rationale: >-
    This is not a general species caveat. Both mouse models were built and
    validated against a rhombic lip that regresses early and lacks the posterior
    subventricular progenitor pool the human rhombic lip develops. The human
    tissue work that identified this pool is the same work that ties rhombic lip
    disruption to posterior vermis hypoplasia and DWM, so the compartment where
    the human lesion is thought to arise is precisely the one the mouse does not
    have. That the Foxc1 hypomorph reproduces a tail-sign-like posterior lobule
    anyway is informative but does not settle the question, because a similar
    structural outcome can be reached from a different progenitor architecture.
    Recording this keeps MODEL_ORGANISM evidence on the patterning node from
    being read as though it were human developmental evidence.
  proposed_experiments:
  - experiment_id: human_rl_dwm_tissue_comparison
    name: Compare posterior rhombic lip architecture in genotyped human DWM fetal cerebella
    description: >-
      Apply the same histological and single-cell molecular staging used to
      define the human rhombic lip progenitor zones to fetal cerebellar tissue
      from DWM cases with known ZIC1/ZIC4 or FOXC1 lesions, and compare the
      affected compartment against gestation-matched controls and against the
      corresponding mouse mutants at equivalent developmental stages.
    experiment_type:
      preferred_term: observational human tissue study
    would_support:
    - pathophysiology#Rhombic Lip and Roof Plate Patterning Failure
    supporting_outcome:
    - >-
      Genotyped human DWM cerebella show the lesion localized to the
      human-specific posterior rhombic lip subventricular progenitor pool, with
      the mouse mutants disrupting an earlier, architecturally different
      compartment.
    refuting_outcome:
    - >-
      The human DWM lesion is confined to the rhombic lip compartment that mouse
      also possesses, leaving the human-specific pool intact, in which case the
      mouse models address the same structure and the mismatch is not material.
  evidence:
  - reference: PMID:31624095
    reference_title: "Spatiotemporal expansion of primary progenitor zones in the developing human cerebellum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The human rhombic lip persists longer through cerebellar development than
      in the mouse and undergoes morphological changes to form a progenitor pool
      in the posterior lobule, which is not seen in other organisms, not even in
      the nonhuman primate the macaque.
    explanation: >-
      Establishes the human-specific compartment that makes this a mismatch
      rather than a generic species caveat.
  - reference: PMID:31624095
    reference_title: "Spatiotemporal expansion of primary progenitor zones in the developing human cerebellum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disruptions in human rhombic lip development are associated with posterior
      cerebellar vermis hypoplasia and Dandy-Walker malformation.
    explanation: >-
      Ties the human-specific compartment to the DWM lesion, which is what makes
      the mismatch mechanistically meaningful.
- discussion_id: dwm_plus_genetic_heterogeneity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Two thirds of clinical exomes in non-isolated DWM return no definitive or
    probable diagnosis. What accounts for the unexplained fraction, and does DWM+
    share the ZIC1/ZIC4 and FOXC1 developmental mechanism curated here or arrive
    at the same malformation by other routes?
  attaches_to:
  - genetic#FOXC1
  - pathophysiology#Rhombic Lip and Roof Plate Patterning Failure
  rationale: >-
    The pathograph in this entry is built from the two loci with an established
    developmental mechanism. Those loci account for a minority of DWM. In the
    largest exome series of DWM+ the diagnostic yield was 35.2%, and the genes
    implicated span chromatin, RASopathy, collagen and ciliary machinery rather
    than converging on rhombic-lip patterning. Whether those routes reach the
    same node curated here, or produce a radiologically similar malformation by
    a different developmental failure, is unresolved and matters for how far
    this entry's mechanism should be generalized to DWM+.
  evidence:
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A definitive or probable diagnosis was made for 32 individuals, yielding a
      diagnostic rate of 35.2% (32/91).
    explanation: >-
      Quantifies the unexplained fraction that this gap is about.
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 50% to 70% of cases, DWM is associated with other central nervous
      system (CNS) abnormalities or extra-CNS anomalies (DWM+)
    explanation: >-
      Establishes that DWM+ is the majority of DWM, so the gap covers most cases
      rather than an edge population.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    The clinical range runs from an asymptomatic incidental imaging finding to
    severe neonatal presentation with hydrocephalus, respiratory distress and
    seizures. Outcome is driven by the degree of vermian malformation and by
    associated malformations rather than by ventricular size alone, and since
    half to two thirds of cases are non-isolated, the burden of the coexisting
    anomalies frequently dominates.
  evidence:
  - reference: PMID:41736477
    reference_title: "Non-Isolated Dandy-Walker Malformation: Exome Sequencing Efficacy and Phenotypic Expansions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The consequences of DWM can vary widely, from asymptomatic to severe
      clinical presentations that include hypotonia, respiratory distress,
      hydrocephalus, and seizures
    explanation: States the range of severity that makes this burden VARIABLE.
  - reference: PMID:21928031
    reference_title: "Hydrocephalus in Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prognosis and intellectual outcome mostly depend on the presence of
      associated malformations, the degree of vermian malformation and the
      adequate control of hydrocephalus.
    explanation: >-
      Identifies the determinants of outcome, which is why the burden is not a
      single level.
review_notes: >-
  Curated against a Perplexity deep-research report
  (research/Dandy-Walker_Syndrome-deep-research-perplexity.md, model
  sonar-reasoning-pro) plus targeted PubMed retrieval. Report validation: 7/7
  references resolved, none unresolved, 6/7 on topic; 11 ontology CURIEs, 8
  resolved, none unresolved, 3 unverifiable. preflight-dr returned SKIP because
  MONDO records no RO:0004003 causal gene for MONDO:0009072, so disease identity
  was checked manually instead - OMIM 220200 matches on both sides and the
  report's top genes are FOXC1, ZIC1 and ZIC4. Every ontology binding in this
  entry was selected with OAK against the adapters in conf/oak_config.yaml and
  none was copied from the report, on the standing rule that a report CURIE is a
  lead; this matters here because sibling runs in the same batch had a majority
  of report CURIE labels naming a different term than claimed. Disposition of the
  report's seven references: PMID:31302658 (EUROCAT registry), PMID:19668217
  (FOXC1 6p25.3 locus), PMID:36068432 (28-child clinical series) and
  PMID:40445443 (2025 narrative review) are all cited above; the two DOI-keyed
  entries are the same papers as PMID:36068432 and PMID:40445443 and are cited by
  PMID instead, since a DOI-keyed snippet is not checked by the gating validator.
  The seventh, PMID:39649865, is a bibliometric analysis of the 100 most-cited
  DWS articles and is deliberately not cited: it reports citation counts, not
  disease content, so it can support no claim in this entry. The report's
  remaining citations are secondary web pages (StatPearls, Radiopaedia,
  MedlinePlus, Wikipedia) with no identifier to fetch. No GeneReviews chapter
  exists for Dandy-Walker malformation itself - a PubMed search for "Dandy-Walker
  GeneReviews" returns only the MID1-related Opitz G/BBB and OFD1 chapters, which
  mention it as a feature - so the GeneReviews phenotype baseline step does not
  apply here. Review round 1 (PR #11578) added the two missing clinical
  phenotypes the reviewer identified - Macrocephaly as a sequela of the
  hydrocephalus node, and Ataxia at OCCASIONAL, the band the "relatively
  uncommon" source supports rather than the band the centrality of the vermian
  lesion would suggest - plus chromosomal microarray in diagnosis, a
  multidisciplinary supportive-care treatment, and ABNORMAL in place of
  DECREASED on the roof plate formation binding. Both new CURIEs were resolved
  with OAK and all six new snippets checked as exact substrings of the cached
  records before use, rather than taken from the review on trust.

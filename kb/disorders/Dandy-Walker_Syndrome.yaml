- name: Isolated DWM with hydrocephalus
  display_name: Isolated Dandy-Walker malformation with hydrocephalus
  subtype_term:
    preferred_term: isolated Dandy-Walker malformation with hydrocephalus
    term:
      id: MONDO:0017110
      label: isolated Dandy-Walker malformation with hydrocephalus
  description: >-
    Dandy-Walker malformation without associated CNS or extra-CNS anomalies, in
    which impaired CSF egress from the fourth ventricle progresses to
    hydrocephalus requiring CSF diversion. This is the arm that generates the
    neurosurgical literature: in one prenatally ascertained series every child
    with true DWM required a ventriculoperitoneal shunt, and shunt- and
    ETV-based strategies are the two competing first operations.
  evidence:
  - reference: PMID:34757866
    reference_title: "Short- and Long-Term Outcomes of Prenatally Diagnosed Dandy-Walker Malformation, Vermian Hypoplasia, and Blake Pouch Cyst."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although all patients with Dandy-Walker malformation required
      ventriculoperitoneal shunts and 66% were intubated at birth, none required
      tracheostomy tube and 2 of 5 surviving children had no neurologic deficits.
    explanation: >-
      Documents the hydrocephalic arm of prenatally diagnosed DWM, in which CSF
      diversion was universally required.
- name: Isolated DWM without hydrocephalus
  display_name: Isolated Dandy-Walker malformation without hydrocephalus
  subtype_term:
    preferred_term: isolated Dandy-Walker malformation without hydrocephalus
    term:
      id: MONDO:0017111
      label: isolated Dandy-Walker malformation without hydrocephalus
  description: >-
    Dandy-Walker malformation without associated anomalies in which ventricular
    size remains stable and no CSF diversion is needed. Hydrocephalus is not
    obligate: a single-centre paediatric neurology cohort applying the modern
    criteria found it in fewer than half of children with DWM or Dandy-Walker
    variant, well below the ~80% figure quoted from older neurosurgical series.
    A DWM ascertained without hydrocephalus may still declare it later, so
    absence at diagnosis is not a permanent classification.
  evidence:
  - reference: PMID:36068432
    reference_title: "Dandy-Walker malformation and variants: clinical features and associated anomalies in 28 affected children-a single retrospective study and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among these, hydrocephalus was found in 13/28 (48%), and hydrocephalus
      plus corpus callosum anomalies in three children (10%).
    explanation: >-
      Establishes that a substantial fraction of children with DWM or DWV in a
      modern series have no hydrocephalus, which is what makes this a real
      subtype rather than a staging artefact.
  - reference: PMID:22418964
    reference_title: "Prenatal diagnosis of 'isolated' Dandy-Walker malformation: imaging findings and prenatal counselling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the postnatal period, paediatricians should look for postnatal
      hydrocephalus even if the ventricular size is normal or slightly dilated on
      prenatal imaging.
    explanation: >-
      States that a normal prenatal ventricular size does not exclude later
      hydrocephalus, so this subtype assignment can change after birth.
inheritance:
- name: Sporadic occurrence
  description: >-
    Most Dandy-Walker malformation is sporadic. Recurrence risk quoted for
    counselling in isolated DWM is low but not negligible, and rises sharply when
    the malformation is part of a recognised syndrome.
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  evidence:
  - reference: PMID:40134959
    reference_title: "Unraveling Dandy-Walker Malformation: A Comprehensive Literature Review and Case Insight."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      estimated to be between 1% and 5% in the case of isolated DWM but higher if
      related to specific syndromic patterns
    explanation: >-
      Gives the recurrence-risk figure used in counselling, which is the
      practical expression of predominantly sporadic occurrence.
- name: Autosomal dominant inheritance
  description: >-
    The two mapped DWM loci act as heterozygous deletions — ZIC1;ZIC4 at 3q24 and
    FOXC1 at 6p25.3 — so a transmitted deletion segregates dominantly, though
    most are de novo. The clearest dominant families in the DW spectrum are the
    ADDWOC pedigrees with occipital cephalocele, which are caused by NID1 or
    LAMC1 mutations and are carried in MONDO as their own entity
    (MONDO:0012218) rather than as a subtype of this entry.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:36702440
    reference_title: NID1-related autosomal dominant Dandy-Walker malformation with occipital cephalocele in three generations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The combination of Dandy-Walker malformation and occipital cephalocele is a
      rare autosomal dominant condition, known as ADDWOC, and caused by mutations
      in NID1 or LAMC1.
    explanation: >-
      Establishes autosomal dominant transmission for the cephalocele-associated
      end of the Dandy-Walker spectrum.
  - reference: PMID:15338008
    reference_title: Heterozygous deletion of the linked genes ZIC1 and ZIC4 is involved in Dandy-Walker malformation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through physical mapping of 3q2 interstitial deletions in several
      individuals with DWM, we defined the first critical region associated with
      DWM, encompassing two adjacent Zinc finger in cerebellum genes, ZIC1 and
      ZIC4.
    explanation: >-
      The mapped lesion is a heterozygous deletion, which is what makes the
      genetic forms dominant at the allele level.

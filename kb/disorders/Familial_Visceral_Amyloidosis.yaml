name: Familial Visceral Amyloidosis
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
description: >-
  Familial visceral amyloidosis - the Ostertag-type hereditary non-neuropathic
  systemic amyloidosis - is an autosomal dominant disease in which a germline
  variant in a circulating, hepatically synthesised plasma protein renders that
  protein amyloidogenic, so that it misfolds and deposits as extracellular
  amyloid predominantly in the viscera (kidney above all, and also liver, spleen,
  adrenal and gastrointestinal tract) rather than in peripheral nerve or heart.
  Four precursor proteins define the recognised forms: apolipoprotein A-I
  (AApoAI, APOA1), apolipoprotein A-II (AApoAII, APOA2), fibrinogen A alpha-chain
  (AFib, FGA) and lysozyme (ALys, LYZ). Whatever the precursor, the presentation
  is proteinuria and slowly progressive renal impairment culminating in end-stage
  renal disease, typically over years to decades, with a natural history far
  slower than acquired AL amyloidosis. Penetrance is variable and a family
  history is often absent, so the disease is routinely mistaken for sporadic AL
  amyloidosis; distinguishing the two matters because chemotherapy is useless
  here and because organ transplantation - renal, and in selected patients
  combined hepatorenal, which removes the source of the circulating variant - is
  the only intervention that alters the course.
parents:
- Genetic Disease
- Protein Misfolding Disease
disease_term:
  preferred_term: familial visceral amyloidosis
  term:
    id: MONDO:0007099
    label: familial visceral amyloidosis
synonyms:
- Ostertag type amyloidosis
- Hereditary non-neuropathic systemic amyloidosis
- Familial renal amyloidosis
- Hereditary renal amyloidosis
- Familial amyloid nephropathy
- German type amyloidosis

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Every recognised precursor form is transmitted as an autosomal dominant
    trait: affected individuals are heterozygous for a variant in the precursor
    gene, and one variant allele suffices because the disease arises from the
    amyloidogenic behaviour of the variant protein rather than from loss of the
    normal protein's function. Penetrance is markedly variable and, for the
    fibrinogen forms, low enough that a family history of renal disease is absent
    in about half of patients - which is why apparently sporadic renal amyloid
    still warrants sequencing of the precursor genes. Lysozyme amyloidosis sits
    at the other end of the penetrance range, with a clear family history in
    every case of one referral cohort.
  evidence:
  - reference: PMID:12832750
    reference_title: Hereditary systemic amyloidosis with renal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These diseases are inherited in an autosomal dominant manner with variable
      penetrance, and can present clinically at any time from the teen years to
      old age, though usually in mid-adult life.
    explanation: >-
      States both the autosomal dominant transmission and the variable penetrance
      and wide age range curated in this block.
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, a family history of renal disease or amyloidosis was absent in 46%
      patients with AFib, with all of the available evidence indicating that this
      was due to reduced penetrance
    explanation: >-
      Quantifies the incomplete penetrance in the largest single cohort and gives
      the reason a negative family history does not exclude the diagnosis.

has_subtypes:
- name: AApoAI
  display_name: AApoAI amyloidosis (apolipoprotein A-I, APOA1)
  subtype_term:
    preferred_term: AApoAI amyloidosis
    term:
      id: MONDO:0019731
      label: AApoAI amyloidosis
  classification: precursor_protein
  description: >-
    Amyloidosis in which the fibril protein is a variant apolipoprotein A-I, the
    principal HDL apolipoprotein. It is the most clinically heterogeneous of the
    four forms: kidney, liver and heart are all involved in a substantial
    fraction of patients, and it is also the only form in which peripheral
    neuropathy is described, and then only with the Gly26Arg variant and only in
    some kindreds. The renal lesion is characteristically medullary and
    tubulointerstitial rather than glomerular, so urinalysis may be bland and the
    presentation a defective urine-concentrating capacity rather than heavy
    proteinuria. Progression to end-stage renal disease is the slowest of the
    four forms, with a median of about 15 years from diagnosis.
  genes:
  - preferred_term: APOA1
    term:
      id: hgnc:600
      label: APOA1
  evidence:
  - reference: PMID:35502644
    reference_title: The experience of hereditary apolipoprotein A-I amyloidosis at the UK National Amyloidosis Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Involvement of the kidneys, liver and heart by amyloid was detected in 81%,
      67% and 28% of patients, respectively.
    explanation: >-
      Quantifies the multi-visceral organ distribution that distinguishes AApoAI
      from the kidney-restricted AFib form.
  - reference: PMID:16011983
    reference_title: "Ostertag revisited: the inherited systemic amyloidoses without neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Only the apolipoprotein AI glycine 26 arginine mutation may cause
      peripheral neuropathy and then in only some of the kindreds with this
      disease.
    explanation: >-
      Establishes the single exception to the non-neuropathic character of this
      disease group, which belongs to the AApoAI subtype. Evidence source is
      OTHER because this is a review.

- name: AApoAII
  display_name: AApoAII amyloidosis (apolipoprotein A-II, APOA2)
  subtype_term:
    preferred_term: apolipoprotein A-II amyloidosis
    term:
      id: MONDO:0016533
      label: apolipoprotein A-II amyloidosis
  classification: precursor_protein
  description: >-
    The rarest of the four forms, described in only a handful of kindreds. The
    reported amyloidogenic variants are stop-codon mutations that abolish the
    normal termination signal and append a C-terminal extension of about 21
    residues to apolipoprotein A-II; it is this extension, rather than a missense
    destabilisation of the native fold, that is thought to drive fibril
    formation. Presentation is renal, with glomerular amyloid and proteinuria.
  genes:
  - preferred_term: APOA2
    term:
      id: hgnc:601
      label: APOA2
  evidence:
  - reference: PMID:11703582
    reference_title: Renal amyloidosis caused by a novel stop-codon mutation in the apolipoprotein A-II gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA analysis revealed heterozygosity for a G to C transversion at the
      second position of the stop-codon of apoA-II gene, suggesting a stop to
      serine substitution at codon 78.
    explanation: >-
      Documents the stop-codon read-through mechanism that defines the reported
      amyloidogenic APOA2 alleles.
  - reference: PMID:11703582
    reference_title: Renal amyloidosis caused by a novel stop-codon mutation in the apolipoprotein A-II gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results indicate that the patient's amyloid fibrils were derived from
      apoA-II and the amyloidogenesis is likely to be closely linked to the
      peptide extension at the C-terminus of variant apoA-II.
    explanation: >-
      Attributes fibril formation specifically to the C-terminal peptide
      extension, the proximal molecular defect of this subtype.

- name: AFib
  display_name: AFib amyloidosis (fibrinogen A alpha-chain, FGA)
  subtype_term:
    preferred_term: AFib amyloidosis
    term:
      id: MONDO:0019733
      label: AFib amyloidosis
  classification: precursor_protein
  description: >-
    Amyloidosis in which the fibril protein is a fragment of a variant fibrinogen
    A alpha-chain. It is the most common hereditary renal amyloidosis in the UK
    and the most nearly organ-restricted of the four forms: renal involvement
    leads to diagnosis in essentially every case, and clinically significant
    extra-renal disease is rare in the largest referral cohort even after years
    of follow-up. How organ-restricted it really is, is disputed - see the
    CONTROVERSY discussion on this entry. The renal histology is
    distinctive enough to be diagnostic - massive amyloid within grossly enlarged
    glomeruli with almost none in vessels or interstitium. Amyloidogenic variants
    cluster in the portion of exon 5 encoding the fibril subunit peptide, and
    E526V is by far the most frequent.
  genes:
  - preferred_term: FGA
    term:
      id: hgnc:3661
      label: FGA
  evidence:
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the fibrinogen A alpha-chain gene are the most common cause of
      hereditary renal amyloidosis in the United Kingdom.
    explanation: >-
      Establishes AFib as the most frequent precursor form among hereditary renal
      amyloidoses in the best-characterised referral population.
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median age at presentation was 58 yr, and renal involvement led to
      diagnosis in all cases.
    explanation: >-
      Supports the kidney-dominant, adult-onset character curated for this
      subtype.

- name: ALys
  display_name: ALys amyloidosis (lysozyme, LYZ)
  subtype_term:
    preferred_term: ALys amyloidosis
    term:
      id: MONDO:0019732
      label: ALys amyloidosis
  classification: precursor_protein
  description: >-
    Amyloidosis in which the fibril protein is a variant lysozyme, the
    bacteriolytic enzyme made by hepatocytes, neutrophils and macrophages.
    Reported amyloidogenic alleles are missense substitutions of highly conserved
    residues (classically Ile56Thr and Asp67His) that destabilise the native
    fold; fibrils contain full-length variant lysozyme rather than a proteolytic
    fragment. The organ distribution is the broadest visceral pattern of the four
    forms - gastrointestinal tract, liver and kidney - and hepatic amyloid can be
    extensive enough to cause spontaneous liver rupture, a presentation not seen
    in the other subtypes. Natural history is slow and penetrance appears high.
  genes:
  - preferred_term: LYZ
    term:
      id: hgnc:6740
      label: LYZ
  evidence:
  - reference: PMID:8464497
    reference_title: Human lysozyme gene mutations cause hereditary systemic amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals are heterozygous for point mutations in the lysozyme
      gene that cause substitution of highly conserved residues, namely threonine
      for isoleucine at position 56 in one family, and histidine for aspartic
      acid at residue 67 in the other.
    explanation: >-
      The original identification of lysozyme as an amyloid fibril protein and of
      the two classic amyloidogenic substitutions.
  - reference: PMID:21988333
    reference_title: "Hereditary lysozyme amyloidosis -- phenotypic heterogeneity and the role of solid organ transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lysozyme amyloidosis is a disease of the GI tract, liver and kidneys, which
      has a slow natural history.
    explanation: >-
      Defines the tri-organ visceral distribution and indolent course curated for
      this subtype.

pathophysiology:
- name: Variant Plasma Protein Amyloidogenic Precursor
  description: >-
    The proximal trigger is a germline heterozygous variant in one of four genes
    encoding abundant circulating plasma proteins - APOA1, APOA2, FGA or LYZ -
    all of which are synthesised chiefly by the liver and secreted into plasma.
    The variant protein circulates alongside its wild-type counterpart and is the
    protein recovered from the amyloid deposits, so the disease is a gain of
    amyloidogenic behaviour by the variant allele's product rather than a
    shortfall of the normal protein. The identity of the precursor is what
    partitions this disease into its four subtypes, because it sets the organ
    tropism, the histological pattern and the rate of progression. The precursor
    is also the therapeutic target: removing the organ that makes it (liver
    transplantation) is the only manoeuvre that stops new deposition.
  conforms_to: amyloidogenesis#Amyloidogenic Precursor Protein
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  evidence:
  - reference: PMID:16011983
    reference_title: "Ostertag revisited: the inherited systemic amyloidoses without neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in a number of plasma proteins, including transthyretin,
      apolipoprotein AI, fibrinogen Aalpha-chain, lysozyme, and apolipoprotein
      AII, are associated with hereditary systemic amyloidosis.
    explanation: >-
      Names the variant plasma proteins that constitute the substituted precursor
      node of the amyloidogenesis module for this disease. Evidence source is
      OTHER because this is a review.
  - reference: PMID:12832750
    reference_title: Hereditary systemic amyloidosis with renal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The types that present with renal disease are usually associated with
      mutations in the genes for either apolipoprotein AI, apolipoprotein AII,
      lysozyme or fibrinogen A alpha-chain.
    explanation: >-
      Restricts the precursor set specifically to the renal-presenting, visceral
      forms curated by this entry.
  downstream:
  - target: Destabilization and Beta-Sheet Conversion of the Variant Precursor
    causal_link_type: DIRECT
    description: >-
      The circulating variant protein is the substrate on which conformational
      conversion acts.

- name: Destabilization and Beta-Sheet Conversion of the Variant Precursor
  description: >-
    The variant precursor is thermodynamically less stable than the wild-type
    protein and, under physiological conditions, populates partly unfolded states
    that retain beta-sheet secondary structure while losing tertiary or higher
    order structure. These partly folded species self-associate into
    aggregation-prone oligomers, committing the precursor to the amyloid pathway.
    The molecular route to instability differs by precursor and is the one
    genuinely subtype-specific upstream step: missense substitution of conserved
    core residues in lysozyme; acquisition of an extra positive charge in
    apolipoprotein A-I; a C-terminal peptide extension from stop-codon
    read-through in apolipoprotein A-II; and, in the fibrinogen A alpha-chain,
    variants clustered in the exon-5 segment that becomes the fibril subunit
    peptide.
  conforms_to: amyloidogenesis#Protein Misfolding and Beta-Sheet Oligomerization
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12832750
    reference_title: Hereditary systemic amyloidosis with renal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The amyloidogenic variant proteins associated with hereditary amyloidosis
      are less stable than their normal wild type counterparts and even under
      physiological conditions can populate partly unfolded states, involving
      loss of tertiary or higher order structure, which readily aggregate with
      retention of beta-sheet secondary structure into protofilaments and
      fibrils.
    explanation: >-
      Describes the destabilization-to-beta-sheet-aggregation step exactly as
      curated in this node.
  - reference: PMID:9461086
    reference_title: Hereditary nephropathic systemic amyloidosis caused by a novel variant apolipoprotein A-I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the previously reported amyloidogenic variants of apoA-I also carry an
      extra positive charge, indicating that this electrostatic change is likely
      to be relevant to the amyloidogenicity of apoA-I.
    explanation: >-
      Gives the precursor-specific physicochemical route to instability for the
      AApoAI subtype.
  downstream:
  - target: Visceral Amyloid Fibril Formation and Extracellular Deposition
    causal_link_type: DIRECT

- name: Visceral Amyloid Fibril Formation and Extracellular Deposition
  description: >-
    Beta-sheet oligomers nucleate and elongate into insoluble cross-beta amyloid
    fibrils that deposit in the extracellular space. The deposition is systemic
    in the sense that the precursor is a circulating plasma protein, but the
    clinically relevant deposits are visceral - kidney above all, with spleen,
    adrenal, liver and gut involved to varying degrees - and, unlike hereditary
    transthyretin amyloidosis, peripheral nerve and myocardium are largely
    spared. This node is the disease's convergence with every other amyloidosis
    and the key conformance target of the amyloidogenesis module.
  conforms_to: amyloidogenesis#Amyloid Fibril Formation and Extracellular Deposition
  role: central_effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: amyloid fibril formation
    term:
      id: GO:1990000
      label: amyloid fibril formation
    modifier: INCREASED
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  - preferred_term: spleen
    term:
      id: UBERON:0002106
      label: spleen
  evidence:
  - reference: PMID:8464497
    reference_title: Human lysozyme gene mutations cause hereditary systemic amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hereditary non-neuropathic systemic amyloidosis (Ostertag-type) is a rare
      autosomal dominant disease in which amyloid deposition in the viscera is
      usually fatal by the fifth decade.
    explanation: >-
      The defining statement of the disease concept: visceral, rather than
      neural, extracellular amyloid deposition.
  - reference: PMID:29142973
    reference_title: Renal Amyloidosis Associated With 5 Novel Variants in the Fibrinogen A Alpha Chain Protein.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deposition of amyloid fibrils in an extracellular space readily leads
      to progressive disruption of the structure and function of affected tissues
      and organs.
    explanation: >-
      States the extracellular character of the deposit and its structural
      consequence, the module's central effector step.
  downstream:
  - target: Precursor-Determined Visceral Organ Tropism
    causal_link_type: DIRECT

- name: Precursor-Determined Visceral Organ Tropism
  description: >-
    Which viscera are affected, and where within them, is set by the identity of
    the precursor rather than by anything downstream. In AFib the deposit is
    almost purely glomerular, filling grossly enlarged glomeruli while sparing
    vessels and interstitium; in AApoAI the renal deposit is the mirror image,
    confined to non-glomerular medullary tissue and producing a
    tubulointerstitial nephritis with bland urinalysis, and liver and heart are
    also commonly involved; ALys deposits across gut, liver and kidney; AApoAII
    deposits in glomeruli. Curating this as its own node keeps the
    subtype-differentiating step explicit rather than dissolving it into the
    generic accumulation node, and it is the step that explains why the four
    forms have different presentations and prognoses despite an identical
    upstream mechanism.
  role: modifier
  biological_scale: TISSUE
  locations:
  - preferred_term: renal glomerulus
    term:
      id: UBERON:0000074
      label: renal glomerulus
  - preferred_term: renal medulla
    term:
      id: UBERON:0000362
      label: renal medulla
  evidence:
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal histology was characteristic: striking glomerular enlargement with
      almost complete obliteration of the normal architecture by amyloid
      deposition and little or no vascular or interstitial amyloid.
    explanation: >-
      Documents the glomerulus-restricted tropism of the AFib precursor.
  - reference: PMID:16221867
    reference_title: "Renal apolipoprotein A-I amyloidosis: a rare and usually ignored cause of hereditary tubulointerstitial nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This location of apolipoprotein A-I amyloid differs sharply from other
      systemic amyloidoses that are mainly characterized by glomerular and
      vascular deposits.
    explanation: >-
      Establishes that the AApoAI precursor produces a different intrarenal
      distribution from the other forms, which is the claim this node makes.
  downstream:
  - target: Progressive Visceral Amyloid Accumulation
    causal_link_type: DIRECT

- name: Progressive Visceral Amyloid Accumulation
  description: >-
    Because the liver keeps secreting the variant precursor throughout life,
    deposition is cumulative and the amyloid load in the affected viscera rises
    over years to decades. Accumulation, not any acute event, is what converts a
    subclinical deposit into organ failure, and it is why the disease is
    typically diagnosed in mid to late adult life despite the causal variant
    being present from conception. The corollary is therapeutic: interrupting
    supply of the precursor arrests accumulation and can allow existing deposits
    to regress.
  conforms_to: amyloidogenesis#Progressive Tissue Amyloid Accumulation
  role: effector
  biological_scale: TISSUE
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:9461086
    reference_title: Hereditary nephropathic systemic amyloidosis caused by a novel variant apolipoprotein A-I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two members of the current generation received renal transplants for
      end-stage renal failure 16 and 18 years ago, and remain very well
      clinically despite massive visceral amyloidosis.
    explanation: >-
      Documents accumulation of a massive visceral amyloid burden over decades,
      and that the burden itself is tolerated once the failed organ is replaced.
  - reference: PMID:35502644
    reference_title: The experience of hereditary apolipoprotein A-I amyloidosis at the UK National Amyloidosis Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Liver transplantation led to regression of amyloid in all four cases in
      whom serial 123I-SAP scintigraphy was performed.
    explanation: >-
      Shows accumulation is supply-driven: removing the source of the variant
      precursor reverses the accumulated load.
  downstream:
  - target: Progressive Renal Excretory Failure
    causal_link_type: DIRECT

- name: Progressive Renal Excretory Failure
  description: >-
    Amyloid replacement of glomerular or tubulointerstitial architecture
    manifests first as proteinuria and then as a steady decline in excretory
    function, ending in end-stage renal disease requiring dialysis or
    transplantation. The rate differs by precursor - roughly five years from
    proteinuria to end-stage disease in AFib, roughly fifteen years from
    diagnosis in AApoAI - but the endpoint is shared, and renal failure is the
    dominant cause of morbidity in every subtype. Survival is nonetheless far
    better than in AL amyloidosis, because extra-renal amyloid is limited and
    dialysis outcomes are comparable to those of other non-diabetic nephropathy.
  conforms_to: amyloidogenesis#Organ Dysfunction
  role: outcome
  biological_scale: ORGANISM
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median time from presentation to ESRD was 4.6 yr, and the estimated median
      patient survival from presentation was 15.2 yr.
    explanation: >-
      Quantifies the progression from renal presentation to end-stage disease and
      the comparatively long survival that follows it.
  - reference: PMID:35502644
    reference_title: The experience of hereditary apolipoprotein A-I amyloidosis at the UK National Amyloidosis Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      median time from diagnosis to end-stage renal disease was 15.0 (95% CI:
      10.0-20.0) years
    explanation: >-
      Gives the substantially slower renal decline of the AApoAI subtype, the
      contrast that makes progression rate precursor-dependent.

phenotypes:
- category: Renal
  name: Proteinuria
  description: >-
    Proteinuria is the presenting abnormality in most patients and the finding
    that leads to renal biopsy and diagnosis. In the fibrinogen form it is
    universal at presentation; in the apolipoprotein A-I form it may be mild and
    tubular rather than nephrotic-range, because the deposit is medullary rather
    than glomerular.
  phenotype_term:
    preferred_term: Proteinuria
    term:
      id: HP:0000093
      label: Proteinuria
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A proteinuric presentation followed by progression to ESRD within 5 yr was
      typical of AFib.
    explanation: >-
      Establishes proteinuria as the typical presenting phenotype.
  - reference: PMID:29142973
    reference_title: Renal Amyloidosis Associated With 5 Novel Variants in the Fibrinogen A Alpha Chain Protein.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six patients presented with proteinuria, hypertension, and/or lower limb
      edema and underwent detailed clinical and laboratory investigations.
    explanation: >-
      Independent case series confirming proteinuria as the mode of presentation.
  - reference: PMID:39417966
    reference_title: "Clinical manifestations, diagnosis and treatment of hereditary fibrinogen Aα-chain renal amyloidosis: one case report and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients showed incipient symptoms including proteinuria
    explanation: >-
      Systematic review of 46 reported AFib cases finding proteinuria in every
      patient at onset.

- category: Renal
  name: Renal Amyloidosis
  description: >-
    Amyloid deposition within the kidney is the defining organ lesion of this
    disease and is present in essentially every symptomatic patient regardless of
    precursor. Its intrarenal distribution differs by subtype (glomerular in AFib
    and AApoAII, medullary and tubulointerstitial in AApoAI), which is what makes
    renal histology informative about the underlying gene.
  phenotype_term:
    preferred_term: Renal amyloidosis
    term:
      id: HP:0001917
      label: Renal amyloidosis
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:12832750
    reference_title: Hereditary systemic amyloidosis with renal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the renal histology is very characteristic showing substantial accumulation
      of amyloid within enlarged glomeruli, but none in blood vessels or the
      interstitium
    explanation: >-
      Describes the renal amyloid deposit and its characteristic distribution in
      the fibrinogen form.
  - reference: PMID:35502644
    reference_title: The experience of hereditary apolipoprotein A-I amyloidosis at the UK National Amyloidosis Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal amyloidosis was universal in association with the most commonly
      identified variant (Gly26Arg, n = 28).
    explanation: >-
      Establishes renal amyloid as effectively universal in the commonest AApoAI
      genotype.

- category: Renal
  name: End-Stage Renal Disease
  description: >-
    Progressive loss of excretory function culminating in dialysis dependence or
    the need for transplantation. This is the dominant clinical outcome of the
    disease in every subtype; the time course differs, being fastest in AFib
    (median under five years from proteinuria) and slowest in AApoAI.
  phenotype_term:
    preferred_term: Stage 5 chronic kidney disease
    term:
      id: HP:0003774
      label: Stage 5 chronic kidney disease
    clinical_course: PROGRESSIVE
  frequency: FREQUENT
  evidence:
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At censor, a total of 44 (62%) patients had reached ESRD, having commenced
      renal replacement therapy at a median age of 60 yr
    explanation: >-
      Quantifies progression to end-stage renal disease in the largest reported
      cohort.
  - reference: PMID:21988333
    reference_title: "Hereditary lysozyme amyloidosis -- phenotypic heterogeneity and the role of solid organ transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five patients had progressive amyloidotic renal dysfunction culminating in
      end-stage renal failure, three of whom underwent renal transplantation
      (RTx).
    explanation: >-
      Confirms the same renal endpoint in the lysozyme subtype.
  - reference: PMID:39417966
    reference_title: "Clinical manifestations, diagnosis and treatment of hereditary fibrinogen Aα-chain renal amyloidosis: one case report and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      10 (21.7%) patients progressed to end-stage renal disease (ESRD) or
      received renal replacement therapy (including dialysis and kidney
      transplantation) within 1 year
    explanation: >-
      Quantifies the pace of progression to end-stage renal disease across
      pooled AFib case reports.

- category: Renal
  name: Nephrotic Syndrome
  description: >-
    Around a quarter of reported AFib patients present in the nephrotic range
    rather than with isolated proteinuria. This is the presentation that most
    resembles AL amyloidosis and it is where the misdiagnosis usually happens.
    Note the contrast with the apolipoprotein A-I subtype, where median protein
    excretion at diagnosis was only 0.3 g per 24 hours despite universal renal
    amyloid: nephrotic-range proteinuria is a feature of the glomerular
    precursor forms, not of the medullary AApoAI lesion.
  phenotype_term:
    preferred_term: Nephrotic syndrome
    term:
      id: HP:0000100
      label: Nephrotic syndrome
  frequency: FREQUENT
  subtypes:
  - AFib
  evidence:
  - reference: PMID:39417966
    reference_title: "Clinical manifestations, diagnosis and treatment of hereditary fibrinogen Aα-chain renal amyloidosis: one case report and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      13 (28.3%) patients presented with nephrotic syndrome, 9 (19.6%) had edema
      in both lower limbs, and 4 (8.7%) had palpebral edema.
    explanation: >-
      Quantifies nephrotic-range presentation across 46 pooled AFib cases.
  - reference: PMID:35502644
    reference_title: The experience of hereditary apolipoprotein A-I amyloidosis at the UK National Amyloidosis Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients with renal amyloidosis had a median creatinine of 159 µmol/L and
      median urinary protein of 0.3 g/24 h at the time of diagnosis of AApoAI
      amyloidosis
    explanation: >-
      Bounds the phenotype to the glomerular precursor forms by showing that the
      AApoAI subtype is characteristically sub-nephrotic. Graded PARTIAL because
      it constrains rather than establishes the phenotype.

- category: Renal
  name: Edema
  description: >-
    Peripheral and periorbital edema follow the loss of protein in the urine and
    are often the symptom that brings the patient to attention, ahead of any
    measured decline in kidney function.
  phenotype_term:
    preferred_term: Edema
    term:
      id: HP:0000969
      label: Edema
  frequency: FREQUENT
  subtypes:
  - AFib
  evidence:
  - reference: PMID:39417966
    reference_title: "Clinical manifestations, diagnosis and treatment of hereditary fibrinogen Aα-chain renal amyloidosis: one case report and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      13 (28.3%) patients presented with nephrotic syndrome, 9 (19.6%) had edema
      in both lower limbs, and 4 (8.7%) had palpebral edema.
    explanation: >-
      Quantifies lower-limb and palpebral edema as presenting features across
      pooled AFib cases.
  - reference: PMID:29142973
    reference_title: Renal Amyloidosis Associated With 5 Novel Variants in the Fibrinogen A Alpha Chain Protein.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six patients presented with proteinuria, hypertension, and/or lower limb
      edema and underwent detailed clinical and laboratory investigations.
    explanation: >-
      Independent series listing lower-limb edema among the presenting features.

- category: Renal
  name: Tubulointerstitial Nephritis
  description: >-
    The characteristic renal presentation of the apolipoprotein A-I subtype:
    medullary, non-glomerular amyloid producing defective urine concentration,
    polyuria and only mild tubular proteinuria with a bland urinalysis. This is
    the presentation most likely to be missed, because it does not look like
    amyloid nephropathy.
  phenotype_term:
    preferred_term: Tubulointerstitial nephritis
    term:
      id: HP:0001970
      label: Tubulointerstitial nephritis
  subtypes:
  - AApoAI
  evidence:
  - reference: PMID:16221867
    reference_title: "Renal apolipoprotein A-I amyloidosis: a rare and usually ignored cause of hereditary tubulointerstitial nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The renal presentation was consistent with a tubulointerstitial disease, as
      suggested by the findings of defective urine-concentrating capacity,
      moderate polyuria, negative urinalysis, and mild tubular proteinuria.
    explanation: >-
      Directly describes the tubulointerstitial presentation curated here and
      restricted to the AApoAI subtype.

- category: Renal
  name: Polyuria
  description: >-
    Polyuria from impaired urinary concentration, reflecting medullary amyloid in
    apolipoprotein A-I amyloidosis rather than glomerular injury.
  phenotype_term:
    preferred_term: Polyuria
    term:
      id: HP:0000103
      label: Polyuria
  subtypes:
  - AApoAI
  evidence:
  - reference: PMID:16221867
    reference_title: "Renal apolipoprotein A-I amyloidosis: a rare and usually ignored cause of hereditary tubulointerstitial nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      defective urine-concentrating capacity, moderate polyuria, negative
      urinalysis, and mild tubular proteinuria
    explanation: >-
      Reports polyuria and defective urine concentration as part of the AApoAI
      renal phenotype.

- category: Cardiovascular
  name: Hypertension
  description: >-
    Hypertension is common at or before the discovery of proteinuria and is part
    of the usual renal presentation rather than a marker of cardiac amyloid.
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  frequency: FREQUENT
  evidence:
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventy-two percent of patients had previously been diagnosed with
      hypertension or were hypertensive at the time of discovery of proteinuria
    explanation: >-
      Quantifies the frequency of hypertension at presentation.

- category: Hepatic
  name: Hepatic Amyloid Deposition
  description: >-
    Liver involvement is prominent in the lysozyme and apolipoprotein A-I
    subtypes and is rare in the fibrinogen subtype. It may be clinically silent
    and detected only as an unexplained persistent cholestatic liver enzyme
    elevation, which is how several apolipoprotein A-I kindreds were first
    identified.
  phenotype_term:
    preferred_term: Hepatic amyloidosis
    term:
      id: HP:0012280
      label: Hepatic amyloidosis
  subtypes:
  - AApoAI
  - ALys
  evidence:
  - reference: PMID:21988333
    reference_title: "Hereditary lysozyme amyloidosis -- phenotypic heterogeneity and the role of solid organ transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All symptomatic ALys individuals had hepatic amyloid.
    explanation: >-
      Establishes universal hepatic amyloid among symptomatic lysozyme
      amyloidosis patients.
  - reference: PMID:15131802
    reference_title: Liver biopsy discloses a new apolipoprotein A-I hereditary amyloidosis in several unrelated Italian families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We investigated both phenotypic and genotypic aspects of apolipoprotein A-I
      amyloidosis unexpectedly disclosed by liver biopsy in 13 unrelated
      individuals with asymptomatic, persistent elevation of alkaline phosphatase
      and gamma-glutamyltransferase levels.
    explanation: >-
      Shows hepatic amyloid in AApoAI presenting silently as a cholestatic enzyme
      abnormality.

- category: Gastrointestinal
  name: Gastrointestinal Amyloid Involvement
  description: >-
    Macroscopically visible amyloid lesions throughout the gastrointestinal tract
    are characteristic of the lysozyme subtype and can be the presenting problem,
    ahead of any renal disease. Gastrointestinal involvement is not a feature of
    the fibrinogen subtype. HPO has no gastrointestinal-specific amyloid class,
    so the generic Amyloid deposition term is bound here and the anatomical site
    is carried by the phenotype name and description.
  phenotype_term:
    preferred_term: Gastrointestinal amyloid deposition
    term:
      id: HP:0011034
      label: Amyloid deposition
  subtypes:
  - ALys
  evidence:
  - reference: PMID:21988333
    reference_title: "Hereditary lysozyme amyloidosis -- phenotypic heterogeneity and the role of solid organ transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptomatic gastrointestinal (GI) amyloid was prevalent, and macroscopically
      visible amyloidotic lesions were present in nine of 10 patients who
      underwent GI endoscopy.
    explanation: >-
      Documents prevalent, endoscopically visible gastrointestinal amyloid in the
      lysozyme subtype.
  - reference: PMID:25217048
    reference_title: A new family with hereditary lysozyme amyloidosis with gastritis and inflammatory bowel disease as prevailing symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected individuals suffered with prevailing gastrointestinal symptoms
      leading to the diagnosis of ALys.
    explanation: >-
      An entire nine-member ALys kindred in which gastrointestinal disease, not
      renal disease, was the presenting problem.

- category: Gastrointestinal
  name: Gastrointestinal Inflammation
  description: >-
    A minority of lysozyme amyloidosis patients have rectocolic inflammation that
    looks like inflammatory bowel disease, which is a route to misdiagnosis: the
    colitis is treated on its own terms and the underlying amyloidosis is missed
    until the disease is atypical or refractory enough to prompt a search for
    amyloid. Reported in three of nine affected members of a single p.Trp82Arg
    kindred, so the proportion should not be generalised.
  phenotype_term:
    preferred_term: Gastrointestinal inflammation
    term:
      id: HP:0004386
      label: Gastrointestinal inflammation
  subtypes:
  - ALys
  evidence:
  - reference: PMID:25217048
    reference_title: A new family with hereditary lysozyme amyloidosis with gastritis and inflammatory bowel disease as prevailing symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      8/9 had non specific upper gastrointestinal symptoms and 3/9 had rectocolic
      inflammation evoking inflammatory bowel disease.
    explanation: >-
      Reports the inflammatory-bowel-disease-like colitis and its frequency
      within the described kindred.
  - reference: PMID:25217048
    reference_title: A new family with hereditary lysozyme amyloidosis with gastritis and inflammatory bowel disease as prevailing symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Amyloidosis should be considered in atypical or treatment resistant, upper
      or lower chronic gastrointestinal symptoms.
    explanation: >-
      States the misdiagnosis risk that makes this phenotype worth curating
      separately from the amyloid deposit itself.

- category: Hematologic
  name: Splenic Amyloid Deposition
  description: >-
    Splenic amyloid is detected by serum amyloid P component scintigraphy in the
    large majority of patients with the fibrinogen subtype but is asymptomatic,
    an illustration of how far visceral amyloid load can outrun clinical
    manifestations outside the kidney.
  phenotype_term:
    preferred_term: Splenic amyloid deposition
    term:
      id: HP:0011034
      label: Amyloid deposition
  subtypes:
  - AFib
  evidence:
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      showed renal amyloid in every patient who had not already reached ESRD, and
      asymptomatic splenic and adrenal amyloid deposits in 89 and 21% of
      patients, respectively
    explanation: >-
      Quantifies asymptomatic splenic and adrenal amyloid detected by
      scintigraphy.

- category: Cardiovascular
  name: Cardiac Amyloid Involvement
  description: >-
    Cardiac involvement separates the subtypes sharply and is the clearest
    contrast with hereditary transthyretin amyloidosis. Roughly a quarter of
    apolipoprotein A-I patients have cardiac amyloid, whereas in the fibrinogen
    subtype infiltrative cardiomyopathy is essentially absent even on prolonged
    follow-up.
  phenotype_term:
    preferred_term: Cardiac amyloidosis
    term:
      id: HP:0030843
      label: Cardiac amyloidosis
  frequency: OCCASIONAL
  subtypes:
  - AApoAI
  evidence:
  - reference: PMID:35502644
    reference_title: The experience of hereditary apolipoprotein A-I amyloidosis at the UK National Amyloidosis Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Involvement of the kidneys, liver and heart by amyloid was detected in 81%,
      67% and 28% of patients, respectively.
    explanation: >-
      Quantifies cardiac involvement in the AApoAI subtype.
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No patient developed the typical electrocardiographic and echocardiographic

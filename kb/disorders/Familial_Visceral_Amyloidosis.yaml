name: Familial Visceral Amyloidosis
creation_date: "2026-08-28T00:00:00Z"
description: >-
  Familial visceral amyloidosis (Ostertag-type hereditary non-neuropathic
  systemic amyloidosis) is an autosomal dominant systemic amyloidosis in which a
  germline variant in a hepatically synthesised plasma protein renders that
  protein amyloidogenic, so that it misfolds and deposits as extracellular
  amyloid predominantly in the viscera - kidney above all, and also liver,
  spleen and gastrointestinal tract - rather than in peripheral nerve or heart.
  Proteinuria and slowly progressive renal impairment culminating in end-stage
  renal disease is the defining presentation.
category: Mendelian
disease_term:
  preferred_term: familial visceral amyloidosis
  term:
    id: MONDO:0007099
    label: familial visceral amyloidosis

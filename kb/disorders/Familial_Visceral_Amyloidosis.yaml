biochemical:
- name: Cholestatic Liver Enzyme Elevation
  notes: >-
    A persistent, asymptomatic rise in alkaline phosphatase and
    gamma-glutamyltransferase, with hepatic amyloid found only when the liver is
    biopsied. This is not a minor laboratory footnote: it is how an entire cohort
    of Italian apolipoprotein A-I kindreds was discovered, in people who had no
    renal complaint and no family history to prompt the question. It matters for
    diagnosis because the alternative route in - proteinuria - can be absent or
    trivial in the AApoAI subtype, whose renal deposit is medullary.
  biomarker_term:
    preferred_term: Serum Alkaline Phosphatase Measurement
    term:
      id: NCIT:C61016
      label: Serum Alkaline Phosphatase Measurement
  presence: Persistently elevated
  subtypes:
  - AApoAI
  evidence:
  - reference: PMID:15131802
    reference_title: Liver biopsy discloses a new apolipoprotein A-I hereditary amyloidosis in several unrelated Italian families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that specific staining for amyloid should be
      performed on liver biopsy of individuals with asymptomatic chronic
      elevation of alkaline phosphatase and gamma-glutamyltransferase levels.
    explanation: >-
      States the diagnostic recommendation that follows from this biochemical
      abnormality being the presenting abnormality.

- name: Gamma-Glutamyltransferase Elevation
  notes: >-
    Raised gamma-glutamyltransferase accompanies the alkaline phosphatase rise
    and is part of the same cholestatic pattern; the two are reported together
    and neither on its own is specific.
  biomarker_term:
    preferred_term: Gamma Glutamyl Transpeptidase Measurement
    term:
      id: NCIT:C64847
      label: Gamma Glutamyl Transpeptidase Measurement
  presence: Persistently elevated
  subtypes:
  - AApoAI
  evidence:
  - reference: PMID:15131802
    reference_title: Liver biopsy discloses a new apolipoprotein A-I hereditary amyloidosis in several unrelated Italian families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      apolipoprotein A-I amyloidosis unexpectedly disclosed by liver biopsy in 13
      unrelated individuals with asymptomatic, persistent elevation of alkaline
      phosphatase and gamma-glutamyltransferase levels
    explanation: >-
      Documents the persistent gamma-glutamyltransferase elevation in the cohort
      in which the diagnosis was made this way.

histopathology:
- name: Congo Red-Positive Amyloid Deposition
  description: >-
    Congo red staining of the affected tissue shows acellular extracellular
    deposits that are birefringent under cross-polarized light. The cited renal
    series describes the colour as red-green; the classical textbook phrase is
    apple-green, and the two name the same optical finding. This establishes that
    the deposit is amyloid but says nothing about which protein it is made of, so
    typing by immunohistochemistry or mass spectrometry remains a separate and
    mandatory step.
  diagnostic: true
  finding_term:
    preferred_term: amyloid deposition
    term:
      id: NCIT:C54018
      label: Amyloid Deposition
  evidence:
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Panel B shows red-green birefringence when the same section is viewed under
      cross-polarized light.
    explanation: >-
      Documents the polarized-light birefringence of the Congo red-stained renal
      deposit in this disease.

- name: Glomerulus-Restricted Amyloid Deposition
  description: >-
    In the fibrinogen subtype the deposit fills grossly enlarged glomeruli and
    obliterates their architecture while leaving vessels and tubulointerstitium
    essentially clear. The pattern is distinctive enough to be actionable: seeing
    it should prompt FGA sequencing even in a patient with no family history, and
    it is the opposite of the medullary, non-glomerular pattern of the
    apolipoprotein A-I subtype.
  diagnostic: true
  finding_term:
    preferred_term: amyloid deposition
    term:
      id: NCIT:C54018
      label: Amyloid Deposition
  subtype: AFib
  evidence:
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the discovery of massive glomerular amyloid, particularly in the absence of
      significant extraglomerular amyloid, should always prompt a search for a
      mutation
    explanation: >-
      States the actionable inference this histopathological pattern licenses -
      the sentence continues "in the fibrinogen Aa-chain gene", trimmed here only
      because the cached text spells the chain with a Greek alpha.
  - reference: PMID:29142973
    reference_title: Renal Amyloidosis Associated With 5 Novel Variants in the Fibrinogen A Alpha Chain Protein.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 5 subjects, extensive amyloid deposits were found solely within the
      glomeruli, which stained specifically with antibodies to fibrinogen A alpha
      chain
    explanation: >-
      Independent confirmation of the glomerulus-restricted distribution with
      precursor-specific staining.

genetic:
- name: APOA1
  gene_term:
    preferred_term: APOA1
    term:
      id: hgnc:600
      label: APOA1
  relationship_type: CAUSATIVE
  subtype: AApoAI
  association: >-
    Heterozygous variants in APOA1, which encodes the major HDL apolipoprotein,
    cause AApoAI amyloidosis. The amyloidogenic alleles are structurally diverse
    - missense substitutions, in-frame deletions and frameshifts - but the
    reported ones share the acquisition of an extra positive charge in the mature
    protein, which is thought to underlie their amyloidogenicity. Gly26Arg is the
    most frequently encountered variant and the only one associated with
    peripheral neuropathy; Leu75Pro accounts for several Italian kindreds and
    presents with a hepatic and renal picture.
  evidence:
  - reference: PMID:9461086
    reference_title: Hereditary nephropathic systemic amyloidosis caused by a novel variant apolipoprotein A-I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      among living family members there was complete concordance between
      amyloidosis and the presence of a novel 9 base pair in-frame deletion
      mutation in exon 4 of the apoA-I gene
    explanation: >-
      Demonstrates co-segregation of an APOA1 variant with amyloidosis within a
      pedigree, the causal genetic claim.
  - reference: PMID:15131802
    reference_title: Liver biopsy discloses a new apolipoprotein A-I hereditary amyloidosis in several unrelated Italian families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel (Leu75Pro) heterozygous mutation in the apolipoprotein A-I gene was
      present in affected individuals but not in controls.
    explanation: >-
      Case-control genetic evidence for a second amyloidogenic APOA1 allele.

- name: APOA2
  gene_term:
    preferred_term: APOA2
    term:
      id: hgnc:601
      label: APOA2
  relationship_type: CAUSATIVE
  subtype: AApoAII
  association: >-
    Heterozygous stop-codon variants in APOA2 abolish normal translational
    termination and extend apolipoprotein A-II by roughly 21 C-terminal residues.
    The extended variant circulates alongside normal apolipoprotein A-II and is
    the fibril protein recovered from renal amyloid. Very few kindreds have been
    reported.
  evidence:
  - reference: PMID:11703582
    reference_title: Renal amyloidosis caused by a novel stop-codon mutation in the apolipoprotein A-II gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Western blot analysis and amino acid sequence analysis of the patient's
      plasma apoA-II showed both normal apoA-II and variant apoA-II with a
      21-amino acid residue extension at the C-terminus.
    explanation: >-
      Confirms the extended variant protein circulating in a patient with renal
      amyloidosis, tying the APOA2 allele to the amyloid.

- name: FGA
  gene_term:
    preferred_term: FGA
    term:
      id: hgnc:3661
      label: FGA
  relationship_type: CAUSATIVE
  subtype: AFib
  association: >-
    Heterozygous variants in FGA, encoding the fibrinogen A alpha-chain, are the
    most common cause of hereditary renal amyloidosis in the United Kingdom. The
    amyloidogenic variants cluster in the region of exon 5 encoding the peptide
    fragment that forms the fibril subunit, and include both single-base
    substitutions and frameshifts; E526V dominates in British and northern
    European patients. Penetrance is low, so a negative family history is common
    and does not argue against the diagnosis. Allele class is not cosmetic: it
    tracks with how aggressive the renal disease is and therefore with whether an
    isolated kidney graft is enough or a combined liver-kidney transplant is
    warranted, since only the combined procedure removes the source of the
    variant protein. Pooled case data also show women presenting significantly
    earlier than men, for reasons that are not established.
  frequency: >-
    Most common cause of hereditary renal amyloidosis in the UK; E526V accounted
    for 64 of 71 patients in the largest reported cohort.
  evidence:
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      64 patients were heterozygous for the previously reported single base
      substitution that altered the codon at position 526 of the mature protein
      from that for glutamic acid to valine
    explanation: >-
      Establishes the dominant FGA allele and its heterozygous state in the
      largest cohort.
  - reference: PMID:29142973
    reference_title: Renal Amyloidosis Associated With 5 Novel Variants in the Fibrinogen A Alpha Chain Protein.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      2 frameshift mutations F521Sfs*27 and G519Efs*30 and 4 single base
      substitutions G555F, E526K, E524K, R554H
    explanation: >-
      Documents the allelic spectrum, including frameshift and substitution
      classes, in a second independent series.
  - reference: PMID:39417966
    reference_title: "Clinical manifestations, diagnosis and treatment of hereditary fibrinogen Aα-chain renal amyloidosis: one case report and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found the onset age to be lower in women than in men (P < 0.05).
    explanation: >-
      Reports the sex difference in age at onset across 46 pooled AFib cases.
  - reference: PMID:39417966
    reference_title: "Clinical manifestations, diagnosis and treatment of hereditary fibrinogen Aα-chain renal amyloidosis: one case report and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      among them, 6 (37.5%) patients had disease recurrence after
      transplantation
    explanation: >-
      Quantifies post-transplant amyloid recurrence, the outcome that makes
      allele class and transplant strategy a joined-up decision.

- name: LYZ
  gene_term:
    preferred_term: LYZ
    term:
      id: hgnc:6740
      label: LYZ
  relationship_type: CAUSATIVE
  subtype: ALys
  association: >-
    Heterozygous missense variants in LYZ substitute highly conserved residues of
    human lysozyme (classically Ile56Thr and Asp67His), destabilising the native
    fold. Unlike the fibrinogen form, the fibril is composed of full-length
    variant lysozyme rather than a proteolytic fragment. Because lysozyme's
    structure and folding are known in atomic detail, this was the first
    hereditary amyloidosis to be used as a tractable structural model of
    amyloidogenesis.
  evidence:
  - reference: PMID:8464497
    reference_title: Human lysozyme gene mutations cause hereditary systemic amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Amyloid fibrils from one individual were composed of the full-length Thr-56
      variant lysozyme molecule.
    explanation: >-
      Directly identifies full-length variant lysozyme as the fibril protein,
      establishing LYZ causation and the fibril composition claim.
  - reference: PMID:21988333
    reference_title: "Hereditary lysozyme amyloidosis -- phenotypic heterogeneity and the role of solid organ transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lysozyme, which is the amyloidogenic precursor protein in ALys, is a
      ubiquitous bacteriolytic enzyme synthesized by hepatocytes, polymorphs and
      macrophages.
    explanation: >-
      Identifies the LYZ gene product as the amyloidogenic precursor and names its
      cellular sources, which is why hepatectomy alone does not fully abolish
      precursor supply in this subtype.

diagnosis:
- name: Renal biopsy with amyloid typing
  description: >-
    Congo red staining of a renal biopsy establishes amyloid; the intrarenal
    distribution then narrows the precursor, since massive glomerular amyloid
    with spared vessels and interstitium is characteristic of the fibrinogen
    form. Immunohistochemistry with antibodies to the candidate fibril proteins
    types the deposit in most but not all cases, and laser microdissection with
    mass spectrometry resolves the remainder. Typing failure is common enough
    that a negative immunohistochemical result does not exclude a hereditary
    form.
  evidence:
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of amyloidosis was made by kidney biopsy in 64 patients and
      by serum amyloid P component (SAP) scintigraphy in conjunction with genetic
      analysis in the context of renal dysfunction and a known family history of
      AFib in seven patients.
    explanation: >-
      Establishes kidney biopsy as the primary diagnostic modality in this
      disease, with scintigraphy plus genetics as the alternative route.
  - reference: PMID:29142973
    reference_title: Renal Amyloidosis Associated With 5 Novel Variants in the Fibrinogen A Alpha Chain Protein.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical awareness and suspicion of hereditary amyloidosis corroborated by
      genetic analysis and adequate typing using combined immunohistochemistry
      and laser microdissection and mass spectrometry is valuable to avoid
      misdiagnosis, especially when a family history of amyloidosis is absent.
    explanation: >-
      States the combined histological, immunohistochemical, proteomic and
      genetic diagnostic strategy curated here.

- name: Sequencing of amyloidogenic precursor genes
  description: >-
    Because the clinical picture is non-specific and penetrance is variable, DNA
    analysis of APOA1, APOA2, FGA and LYZ is required to establish the hereditary
    form and identify the precursor. A detectable plasma cell dyscrasia does not
    exclude a hereditary amyloidosis and does not remove the need for sequencing.
  evidence:
  - reference: PMID:12832750
    reference_title: Hereditary systemic amyloidosis with renal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA analysis is now performed routinely in UK National Amyloidosis Centre
      in patients with systemic amyloidosis in whom AA or AL fibril type cannot
      be definitively verified.
    explanation: >-
      Establishes routine precursor-gene sequencing as the diagnostic step for
      untyped systemic amyloid.
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the presence of a plasma cell dyscrasia in a patient with systemic
      amyloidosis, as was detected in 10% of the current cohort using the very
      sensitive techniques now available, neither excludes AFib nor proves
      AL-type amyloidosis, and does not alter the requirement for DNA analysis
    explanation: >-
      States explicitly that a coexisting paraprotein does not remove the
      requirement for genetic testing.

- name: Serum amyloid P component scintigraphy
  description: >-
    Radiolabelled SAP scintigraphy maps whole-body visceral amyloid load
    non-invasively, is diagnostic in patients in whom biopsy is not obtained, and
    is the tool that demonstrates regression of amyloid after removal of the
    precursor source by liver transplantation.
  evidence:
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiolabeled SAP scintigraphy was diagnostic of amyloidosis in each of 63
      patients who underwent the procedure.
    explanation: >-
      Establishes the diagnostic yield of SAP scintigraphy in this disease.

treatments:
- name: Kidney Transplantation
  description: >-
    Renal transplantation is the standard treatment for end-stage renal disease
    in this group and gives good medium-term outcomes, but it does not address
    the source of the circulating variant precursor, so amyloid can recur in the
    graft. In the fibrinogen subtype recurrent amyloid caused graft loss after
    roughly six to seven years in several patients; in the apolipoprotein A-I
    subtype, where deposition is far slower, allograft survival has been much
    longer.
  treatment_term:
    preferred_term: Kidney Transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Progressive Renal Excretory Failure
    treatment_effect: RESTORES
    description: >-
      Restores excretory function by replacing the failed organ, without altering
      upstream precursor supply - so the mechanism keeps running and amyloid
      eventually re-deposits in the graft.
    evidence:
    - reference: PMID:19073821
      reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Renal transplantation in AFib is associated with recurrence of amyloid in
        the graft and with resultant loss of transplant kidneys after a median of
        6.7 yr, although one kidney continued to function after 12.2 yr.
      explanation: >-
        Shows the graft restores excretory function but that ongoing precursor
        supply eventually re-deposits amyloid in it.
  evidence:
  - reference: PMID:35502644
    reference_title: The experience of hereditary apolipoprotein A-I amyloidosis at the UK National Amyloidosis Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Post-renal transplantation, median allograft survival was 22.0 (13.0-31.0)
      years.
    explanation: >-
      Documents the favourable renal allograft survival that makes
      transplantation the treatment of choice in the AApoAI subtype.

- name: Liver Transplantation
  description: >-
    Because the amyloidogenic precursors are synthesised chiefly by the liver,
    orthotopic liver transplantation removes the source of the circulating
    variant protein and is the only intervention that stops further deposition;
    existing deposits can then regress. It is used pre-emptively or, in lysozyme
    amyloidosis, urgently for spontaneous hepatic rupture. Lysozyme is also made
    by neutrophils and macrophages, so hepatectomy does not abolish precursor
    supply as completely in that subtype as it does for the apolipoproteins and
    fibrinogen.
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Variant Plasma Protein Amyloidogenic Precursor
    treatment_effect: INHIBITS
    description: >-
      Removes the hepatic source of the variant precursor, cutting supply at the
      trigger node rather than treating a downstream consequence.
    evidence:
    - reference: PMID:35502644
      reference_title: The experience of hereditary apolipoprotein A-I amyloidosis at the UK National Amyloidosis Centre.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Liver transplantation led to regression of amyloid in all four cases in
        whom serial 123I-SAP scintigraphy was performed.
      explanation: >-
        Demonstrates that removing the precursor source reverses accumulated
        amyloid, which is the mechanistic claim for targeting this node.
  evidence:
  - reference: PMID:21988333
    reference_title: "Hereditary lysozyme amyloidosis -- phenotypic heterogeneity and the role of solid organ transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four patients received orthotopic liver transplants (OLT), three for
      spontaneous hepatic rupture and one case, who had extensive hepatic amyloid
      and a strong family history of hepatic rupture, pre-emptively.
    explanation: >-
      Documents both the emergency and pre-emptive indications for liver
      transplantation in lysozyme amyloidosis.
  - reference: PMID:19633201
    reference_title: "Hereditary fibrinogen A alpha-chain amyloidosis: phenotypic characterization of a systemic disease and the role of liver transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data encourage evaluation of preemptive solitary liver transplantation
      early in the course of amyloid nephropathy to prevent hemodialysis and
      kidney transplantation.
    explanation: >-
      Argues for pre-emptive isolated liver transplantation on the mechanistic
      ground that it removes the precursor before the kidney is lost.

- name: Combined Liver-Kidney Transplantation
  description: >-
    Simultaneous hepatorenal transplantation both replaces the failed kidney and
    removes the hepatic source of the amyloidogenic precursor, so it prevents
    amyloid recurrence in the renal allograft. It carries greater perioperative
    risk than isolated renal transplantation, and because isolated renal grafts
    last several years before recurrent amyloid becomes limiting, it is generally
    reserved for younger, fitter patients.
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Progressive Visceral Amyloid Accumulation
    treatment_effect: INHIBITS
    description: >-
      Combines organ replacement with elimination of precursor supply, arresting
      further accumulation rather than merely replacing the failed organ.
    evidence:
    - reference: PMID:19073821
      reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A further six patients in this series have undergone combined hepatorenal
        transplantation at King's College Hospital, London, which was performed
        preemptively in three patients.
      explanation: >-
        Documents the combined procedure in this disease, including pre-emptive
        use before renal replacement is strictly required.
  evidence:
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it has been our practice to recommend consideration of combined liver and
      kidney transplantation only in younger, fitter patients with this disease
    explanation: >-
      States the patient-selection caveat curated in this treatment's
      description.
  - reference: PMID:19633201
    reference_title: "Hereditary fibrinogen A alpha-chain amyloidosis: phenotypic characterization of a systemic disease and the role of liver transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six of 9 patients who underwent LKT are alive (67%), with good allograft
      function and no amyloidosis at median 67 months (range, 33-155 months) of
      follow-up.
    explanation: >-
      Reports absence of recurrent amyloid after combined transplantation, the
      outcome that distinguishes it from isolated renal transplantation.

- name: Renal Replacement Therapy
  description: >-
    Dialysis for end-stage renal disease. Outcomes in this disease are notably
    better than in AL amyloidosis and comparable to those of age-matched patients
    with other non-diabetic nephropathies, because extra-renal amyloid is limited
    and the natural history is slow.
  treatment_term:
    preferred_term: Hemodialysis
    term:
      id: NCIT:C15248
      label: Hemodialysis
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Progressive Renal Excretory Failure
    treatment_effect: BYPASSES
    description: >-
      Substitutes extracorporeally for lost excretory function; it has no effect
      on precursor supply or amyloid deposition.
    evidence:
    - reference: PMID:19073821
      reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Estimated median survival from commencement of renal replacement therapy
        by Kaplan-Meier analysis was 8.2 yr
      explanation: >-
        Quantifies survival on renal replacement therapy in this disease.

- name: Symptomatic and Supportive Management
  description: >-
    There is no amyloid-specific pharmacotherapy for any of the four precursor
    forms. In particular, none of the transthyretin-directed stabilisers or
    gene-silencing agents applies here, because the precursor is a different
    protein. Management outside transplantation is symptomatic - blood-pressure
    and proteinuria control, treatment of gastrointestinal bleeding, and
    surveillance of organ function.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:21988333
    reference_title: "Hereditary lysozyme amyloidosis -- phenotypic heterogeneity and the role of solid organ transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is currently no amyloid-specific therapy for the condition which is
      managed symptomatically.
    explanation: >-
      States the absence of disease-modifying pharmacotherapy that this treatment
      entry records.

differential_diagnoses:
- name: AL Amyloidosis
  description: >-
    Systemic amyloidosis from a clonal immunoglobulin light chain. This is the
    diagnosis familial visceral amyloidosis is most often mistaken for, and the
    error has consequences: patients have received cytotoxic chemotherapy for
    presumed AL disease before the hereditary form was recognised. A monoclonal
    protein is common enough in older patients to be incidental, so its presence
    does not settle the question.
  distinguishing_features:
  - >-
    Precursor-gene sequencing (APOA1, APOA2, FGA, LYZ) establishes the hereditary
    form; amyloid typing by immunohistochemistry, or by laser microdissection
    with mass spectrometry when immunohistochemistry is non-definitive,
    identifies the fibril protein.
  - >-
    Renal histology is informative: massive amyloid within grossly enlarged
    glomeruli with almost none in vessels or interstitium suggests fibrinogen A
    alpha-chain amyloidosis.
  - >-
    Survival is far longer in the hereditary visceral forms than in untreated AL
    amyloidosis, and clinically significant extra-renal amyloid is much less
    common.
  evidence:
  - reference: PMID:12832750
    reference_title: Hereditary systemic amyloidosis with renal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical phenotype of hereditary renal amyloid is non-specific and is
      readily misdiagnosed as acquired AL amyloidosis.
    explanation: >-
      States the misdiagnosis risk that makes AL amyloidosis the principal
      differential.
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chemotherapy comprising autologous stem cell transplantation was
      administered for presumed AL amyloidosis in one such patient before the
      correct diagnosis of AFib was achieved.
    explanation: >-
      Documents the clinical harm of the misdiagnosis: cytotoxic therapy given
      for presumed AL amyloidosis.
  - reference: PMID:39417966
    reference_title: "Clinical manifestations, diagnosis and treatment of hereditary fibrinogen Aα-chain renal amyloidosis: one case report and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      among the 46 patients, seven were misdiagnosed with immunoglobulin light
      chain amyloidosis (AL). After chemotherapy and stem-cell transplantation,
      renal function in these patients deteriorated.
    explanation: >-
      Quantifies how often the misdiagnosis happens (7 of 46 pooled AFib cases)
      and reports that the resulting treatment worsened renal function.

prevalence:
- subtype: AFib
  population: Patients with systemic amyloidosis, United Kingdom national series 1987-2012
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    A denominator-based figure, but a denominator of amyloidosis patients rather
    than of the general population: 87 of 5100 patients evaluated at the UK
    national amyloidosis service over 25 years had AFib amyloidosis. It bounds
    how often the commonest precursor form turns up in an amyloidosis clinic, not
    how common the disease is in a population, so no rate per 100,000 is derived
    from it. measure_type is UNKNOWN rather than PERIOD_PREVALENCE for the same
    reason, and matches the sibling record below: PrevalenceMeasureEnum's values
    all presuppose a population denominator, and neither of these two records
    has one.
  evidence:
  - reference: PMID:39417966
    reference_title: "Clinical manifestations, diagnosis and treatment of hereditary fibrinogen Aα-chain renal amyloidosis: one case report and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      evaluated 5100 patients with British national amyloidosis between 1987 and
      2012 and discovered that only 87 (1.7%) patients had AFib amyloidosis
    explanation: >-
      Gives the numerator and denominator behind the AFib share of a national
      amyloidosis cohort.
- population: Patients with apparently sporadic systemic amyloidosis, United Kingdom
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Not a population prevalence. This records the fraction of patients presenting
    with apparently sporadic systemic amyloid who in fact have hereditary
    fibrinogen A alpha-chain amyloidosis, which is the number that matters
    clinically because it sets the threshold for genetic testing. No
    general-population rate is curated: the two records here both have a
    denominator of amyloidosis patients, not of a population, and the Orphanet
    epidemiology record (ORPHA:85450) could not be quoted because the Orphadata
    bulk XML needed to generate a citable cache entry is not present in this
    checkout. MONDO carries the rare-disease subsets for this class.
  evidence:
  - reference: PMID:12832750
    reference_title: Hereditary systemic amyloidosis with renal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we have lately demonstrated that five percent of patients with apparent
      sporadic amyloid have hereditary fibrinogen A alpha-chain amyloidosis
      associated with the valine 526 variant
    explanation: >-
      Gives the measured fraction of apparently sporadic amyloid that is in fact
      hereditary AFib.

discussions:
- discussion_id: gap_fva_precursor_organ_tropism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do four different variant plasma proteins, all made chiefly by the liver
    and all converging on the same cross-beta fibril, deposit in such different
    places - fibrinogen A alpha-chain almost purely in glomeruli, apolipoprotein
    A-I in the renal medulla and heart, lysozyme across gut, liver and kidney?
  attaches_to:
  - pathophysiology#Precursor-Determined Visceral Organ Tropism
  rationale: >-
    Organ tropism is the single most clinically consequential difference between
    the subtypes - it determines presentation, rate of progression and whether
    liver transplantation is worth its risk - and yet the mechanism that
    determines it is not established. Candidate explanations include differences
    in the size and charge of the fibrillogenic fragment, local proteolytic
    processing at the deposition site, differential binding to tissue
    glycosaminoglycans or basement membrane components, and hemodynamic
    filtration effects at the glomerulus. The evidence curated in this entry
    documents the tropism but not its cause, so the downstream nodes are
    deliberately silent about it.

- discussion_id: controversy_fva_afib_organ_restriction
  kind: CONTROVERSY
  prompt: >-
    Is AFib fibrinogen A alpha-chain amyloidosis a kidney-restricted disease, or
    a systemic one whose extra-renal deposits are simply not looked for?
  attaches_to:
  - has_subtypes#AFib
  - pathophysiology#Precursor-Determined Visceral Organ Tropism
  rationale: >-
    Two large UK series reach opposite conclusions from overlapping patient
    populations. Gillmore and colleagues, following 71 prospectively studied
    patients, found clinically significant extra-renal disease rare and no
    patient developing the echocardiographic picture of infiltrative amyloid
    cardiomyopathy - the basis for calling AFib the most organ-restricted of the
    four precursor forms. Stangou and colleagues, assessing 22 AFib patients
    specifically for combined liver-kidney transplantation and therefore
    obtaining vascular and endomyocardial tissue that the observational cohort
    did not, found variant fibrinogen amyloid in excised atheroma and
    endomyocardial biopsies and autonomic neuropathy in half, and conclude the
    disease is systemic. The disagreement is partly about ascertainment - you
    find myocardial amyloid if you biopsy myocardium - and it matters clinically,
    because cardiovascular amyloid is what can make a patient ineligible for the
    combined transplant that would otherwise be curative. This entry curates the
    kidney-dominant tropism as the general pattern, and records the systemic
    finding here rather than asserting either position as settled.
  evidence:
  - reference: PMID:19633201
    reference_title: "Hereditary fibrinogen A alpha-chain amyloidosis: phenotypic characterization of a systemic disease and the role of liver transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fibrinogen amyloidosis is a systemic amyloid disease with visceral,
      vascular, cardiac, and neurologic involvement.
    explanation: >-
      The transplant-assessment series' conclusion that AFib is systemic rather
      than kidney-restricted.
  - reference: PMID:19633201
    reference_title: "Hereditary fibrinogen A alpha-chain amyloidosis: phenotypic characterization of a systemic disease and the role of liver transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vascular atheroma excised at endarterectomy and endomyocardial biopsies
      contained purely variant fibrinogen amyloid.
    explanation: >-
      The tissue finding behind the systemic claim, and the reason the
      disagreement is partly one of ascertainment.
  - reference: PMID:19073821
    reference_title: "Diagnosis, pathogenesis, treatment, and prognosis of hereditary fibrinogen A alpha-chain amyloidosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Even after a median follow-up of 4 yr, clinically significant extra-renal
      disease was rare.
    explanation: >-
      The opposing position from the larger prospective cohort, on which this
      entry's kidney-dominant characterization rests.

- discussion_id: openq_fva_apoa1_recessive_cardiac_allele
  kind: OPEN_QUESTION
  prompt: >-
    Is every amyloidogenic APOA1 allele dominant, or can a variant require two
    copies? A homozygous p.Leu202Arg carrier developed cardiac amyloidosis while
    his heterozygous brother was unaffected.
  attaches_to:
  - inheritance#Autosomal dominant
  - has_subtypes#AApoAI
  rationale: >-
    This entry curates autosomal dominant inheritance throughout, which is
    correct for every established allele in all four precursor genes. One 2024
    report is the sole exception on record: a man born to consanguineous parents,
    homozygous for APOA1 p.Leu202Arg, with cardiac amyloidosis, whose
    heterozygous brother had no disease. One family cannot establish a recessive
    mechanism - an unaffected heterozygous sibling is also compatible with
    reduced penetrance or later onset in a dominant allele - so nothing in the
    inheritance block was changed. It is recorded here because if the observation
    holds up it would mean a homozygous-only amyloidogenic allele class exists,
    which changes how an APOA1 variant of uncertain significance should be
    interpreted in a heterozygote.
  evidence:
  - reference: DOI:10.1038/s41439-024-00288-7
    reference_title: The APOA1 p.Leu202Arg variant potentially causes autosomal recessive cardiac amyloidosis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a 69-year-old man with sporadic cardiac amyloidosis who was
      born to consanguineous parents and carried a homozygous variant of
      p.Leu202Arg in APOA1.
    explanation: >-
      The single observation this question rests on. Graded PARTIAL because one
      consanguineous case is hypothesis-generating, not a demonstration of
      recessive inheritance.
  - reference: DOI:10.1038/s41439-024-00288-7
    reference_title: The APOA1 p.Leu202Arg variant potentially causes autosomal recessive cardiac amyloidosis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ApoA-I amyloidosis is caused by amyloidogenic variants of APOA1 that are
      inherited in an autosomal dominant manner.
    explanation: >-
      The same report's statement of the established dominant rule, which is what
      this entry curates and which the case is proposed as an exception to.

notes: >-
  Concept decision (why this is a Disease entry with has_subtypes rather than a
  grouping). MONDO:0007099 (familial visceral amyloidosis, Ostertag type) has four
  MONDO children, one per precursor protein: AApoAI (MONDO:0019731), AApoAII
  (MONDO:0016533), AFib (MONDO:0019733) and ALys (MONDO:0019732). They share one
  reasonably conserved pathograph - a germline variant in a hepatically
  synthesised circulating plasma protein, destabilisation and beta-sheet
  conversion of that protein, cross-beta fibril formation, visceral
  (kidney-dominant, non-neuropathic, non-cardiac) deposition, cumulative
  accumulation, and progressive renal excretory failure - and they share their
  diagnostic pathway and their only disease-modifying treatment, which is removal
  of the precursor source by transplantation. What differs between them sits at
  one node, organ tropism, curated explicitly as
  "Precursor-Determined Visceral Organ Tropism". That is a subtype-level
  difference within one mechanism, not a union of unrelated diseases, so the
  entry is curated as a Disease root with has_subtypes, per the guidance in issue
  #9603.

  Relationship to kb/groupings/Hereditary_Systemic_Amyloidoses.yaml. That grouping
  is the broader systemic-hereditary union, scoped by MONDO:0018634
  (skos:broadMatch) and spanning the neuropathic and cardiac forms as well as
  these visceral ones; its rationale records the maintainer directive on issue
  #8655 not to create an umbrella kb/disorders/Hereditary_Amyloidosis.yaml. This
  entry does not contradict that directive. MONDO:0007099 is a narrower concept
  than MONDO:0018634 - it is precisely the non-neuropathic visceral subset, which
  is why a single conserved pathograph is available here and was not available at
  the MONDO:0018634 level. This entry is added to that grouping's members as a
  DISEASE member in the same change.

  Revisit condition. The grouping's rationale lists AApoAI, AApoAII, AFib and
  ALys as intended future standalone Disease entries. If any of them is later
  curated as its own kb/disorders/ file, this entry's corresponding has_subtypes
  block becomes a duplicate and should be reduced to a pointer, or this entry
  should be converted to a grouping at that time. Curating them standalone first
  was not chosen here because it would have left MONDO:0007099 itself - the
  concept the issue asks for, and the one clinicians use when they say
  "hereditary renal amyloidosis" - uncurated.

  Scope. Hereditary transthyretin amyloidosis (ATTRv) is deliberately excluded
  even though Benson's review discusses TTR alongside these precursors: it is
  neuropathic and cardiac rather than visceral, is not a MONDO child of
  MONDO:0007099, and is already curated as kb/disorders/ATTR_Amyloidosis.yaml.
  Gelsolin (AGel/Finnish-type) amyloidosis is likewise excluded and separately
  curated as kb/disorders/Finnish_Type_Amyloidosis.yaml; it is not a MONDO child
  of this class and its phenotype is corneal and cranial-nerve rather than
  visceral. The shared downstream mechanism is modelled once in
  kb/modules/amyloidogenesis.yaml and reached here via conforms_to.

  GeneReviews. PubMed searches for GeneReviews chapters covering fibrinogen A
  alpha-chain, apolipoprotein A-I, apolipoprotein A-II and lysozyme amyloidosis
  returned no results (searched 2026-08-28), so no GeneReviews baseline was
  available. The phenotype baseline is taken instead from the UK National
  Amyloidosis Centre cohort series (PMID:19073821 for AFib, PMID:35502644 for
  AApoAI, PMID:21988333 for ALys) and the Benson review (PMID:16011983).

  Hereditary beta-2-microglobulin amyloidosis (AB2M, B2M p.Asp76Asn) is a
  candidate fifth precursor form and is deliberately NOT curated as a subtype
  here. It is a visceral, non-osteoarticular hereditary systemic amyloidosis and
  the falcon deep-research report proposed it as a member, but it is not a MONDO
  child of MONDO:0007099, it was described long after the Ostertag concept was
  partitioned into the four precursor forms, and the reported literature is a
  small number of families. Adding it would extend the concept past its ontology
  grounding on the strength of a single review. Revisit if MONDO places it under
  this class.

  Deep research. One falcon (Edison) run was performed
  (research/Familial_Visceral_Amyloidosis-deep-research-falcon.md); its
  reference validation resolved 11 of 11 identifiers with a 0.0 confabulation
  rate. Note that its relevance pass reports on_topic 1 of 11 with off_topic 0,
  which means most references were undecided rather than judged off topic. Its
  central recommendation - that MONDO:0007099 be treated as a legacy umbrella
  and the disease-level record point at precursor-defined subtype records rather
  than assign one prognosis to all forms - is what the has_subtypes structure and
  the per-subtype evidence in this entry implement. Claims taken from the report
  were re-verified against the cited abstracts before use; nothing is cited on
  the report's authority alone.

  PMID:16916739 (Lane et al., "Hereditary fibrinogen A alpha-chain amyloidosis")
  was fetched but its cache entry has no retrievable text, so nothing from it is
  quoted or cited here.

  Not curated for want of a verifiable source: the AFib allele-class onset
  gradient (roughly 57 years for E526V, 45 for R554L, 24.5 for frameshift
  alleles) and the E526V-versus-other post-transplant recurrence contrast (22%
  versus 83%). Both appear in the falcon report, attributed to a 32-patient
  French series, but neither number is present in any cached reference in this
  repository, and a deep-research report is a lead rather than a citation. What
  is curated instead is what the cached systematic review (PMID:39417966) does
  support: the pooled post-transplant recurrence rate, the sex difference in age
  at onset, and the allelic spectrum itself. If the French series is fetched
  later, the gradient belongs in the FGA genetic block, because it is what
  decides between an isolated kidney graft and a combined liver-kidney
  transplant.

  The transgenic APOA2 Stop78Ser mouse is the strongest disease-specific animal
  model in the literature and is not curated as an animal_models entry: its cache
  (DOI:10.1016/j.kint.2019.03.013) has content_type unavailable, so there is
  nothing quotable to attach to a modeled_mechanisms link.


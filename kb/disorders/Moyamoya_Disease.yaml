      label: inflammatory response
  evidence:
  - reference: PMID:41891799
    reference_title: "RNF213-TRAF2 interaction enhances inflammatory responses via NF-κB activation in moyamoya disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RNF213 as a critical regulator of the IL-6 amplifier (IL6-Amp), a mechanism that
      enhances NF-κB-mediated inflammation in the presence of IL-6-STAT3 in non-immune cells.
    explanation: This identifies RNF213's role in regulating the IL-6 amplifier mechanism that enhances NF-κB inflammation.
  - reference: PMID:41891799
    reference_title: "RNF213-TRAF2 interaction enhances inflammatory responses via NF-κB activation in moyamoya disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The MMD-associated RNF213 p.R4810K variant enhanced NF-κB activation by
      strengthening the interaction between RNF213 and TRAF2, a key adaptor in
      TNF-α-NF-κB signaling.
    explanation: This demonstrates that the pathogenic p.R4810K variant amplifies NF-κB signaling through enhanced RNF213-TRAF2 interaction.
  - reference: PMID:41891799
    reference_title: "RNF213-TRAF2 interaction enhances inflammatory responses via NF-κB activation in moyamoya disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      histopathological analysis of superficial temporal arteries from MMD patients revealed
      genotype-dependent IL6-Amp activation, with pronounced phosphorylation of NF-κB
      p65 and STAT3 in homozygous carriers.
    explanation: Vessel histopathology directly confirms IL6-Amp activation and NF-κB pathway engagement in MMD patient arterial tissue.
  downstream:
  - target: Progressive steno-occlusive intracranial arteriopathy
    description: Chronic NF-κB-driven IL-6 amplification and inflammatory signaling in vascular tissue drives endothelial dysfunction, vascular remodeling dysregulation, and progressive stenosis.
- name: Nitric oxide-sGC-cGMP signaling deficiency
  description: >-
    Biallelic loss of endothelial nitric oxide synthase (NOS3) or of the soluble
    guanylate cyclase alpha-1 subunit (GUCY1A1, formerly GUCY1A3) removes
    signaling through the NO-sGC-cGMP pathway that controls vascular
    smooth-muscle relaxation, vascular tone and vascular remodeling. This is the
    recessive route to moyamoya angiopathy in this entry. A review of the two
    genes treats RNF213 and GUCY1A3 as joint regulators of nitric
    oxide-mediated vascular protection, so this mechanism is not necessarily
    independent of the RNF213 nodes.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: nitric oxide-cGMP-mediated signaling
    modifier: DECREASED
    term:
      id: GO:0038060
      label: nitric oxide-cGMP-mediated signaling
  genes:
  - preferred_term: NOS3
    term:
      id: hgnc:7876
      label: NOS3
  - preferred_term: GUCY1A1
    term:
      id: hgnc:4685
      label: GUCY1A1
  evidence:
  - reference: PMID:36941667
    reference_title: "Biallelic variants in NOS3 and GUCY1A3, the two major genes of the nitric oxide pathway, cause moyamoya cerebral angiopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Causative homozygous variants of NOS3, the gene encoding the endothelial nitric oxide synthase (eNOS), and GUCY1A3, the gene encoding the alpha1 subunit of the soluble guanylate cyclase (sGC) which is the major nitric oxide (NO) receptor in the vascular wall, were identified in 3 of the 6 probands.
    explanation: >-
      Exome sequencing of consanguineous moyamoya probands places both genes of
      the NO-sGC axis in the same mechanism, which is what this node asserts.
  - reference: PMID:24581742
    reference_title: "Loss of α1β1 soluble guanylate cyclase, the major nitric oxide receptor, leads to moyamoya and achalasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      The NO-sGC-cGMP pathway is a major pathway controlling vascular smooth-muscle relaxation, vascular tone, and vascular remodeling.
    explanation: >-
      States the established physiology of the pathway this node names, which is
      the basis for the vascular smooth muscle and vascular tone claims in the
      node description.
  - reference: PMID:24581742
    reference_title: "Loss of α1β1 soluble guanylate cyclase, the major nitric oxide receptor, leads to moyamoya and achalasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Platelet analysis showed a complete loss of the soluble
    explanation: >-
      Platelet assays in affected individuals demonstrate that the biallelic
      GUCY1A3 variants abolish the enzyme, establishing loss of signaling rather
      than a reduction of uncertain magnitude.
  - reference: PMID:36941667
    reference_title: "Biallelic variants in NOS3 and GUCY1A3, the two major genes of the nitric oxide pathway, cause moyamoya cerebral angiopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data pinpoint the essential role of the NO pathway in MMA pathophysiology.
    explanation: >-
      The authors' own conclusion that the NO pathway is central to moyamoya
      pathophysiology supports modeling it as a distinct mechanism node.
  - reference: PMID:34381413
    reference_title: "RNF213 and GUCY1A3 in Moyamoya Disease: Key Regulators of Metabolism, Inflammation, and Vascular Stability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      They are important regulators of lipid metabolism especially lipotoxicity, NF-κB mediated inflammation, and nitric oxide-mediated vascular protection.
    explanation: >-
      This review's subjects are RNF213 and GUCY1A3, and it treats both as
      regulators of nitric oxide-mediated vascular protection. That is the basis
      for the caveat in this node's description that the mechanism is not
      necessarily independent of the RNF213 nodes.
  downstream:
  - target: Progressive steno-occlusive intracranial arteriopathy
    description: >-
      Loss of NO-sGC-cGMP signaling is proposed to produce abnormal vascular
      remodeling at the internal carotid artery bifurcations, the site of the
      steno-occlusive lesion.
    evidence:
    - reference: PMID:24581742
      reference_title: "Loss of α1β1 soluble guanylate cyclase, the major nitric oxide receptor, leads to moyamoya and achalasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our data suggest that alterations of this pathway might lead to an abnormal vascular-remodeling process in sensitive vascular areas such as ICA bifurcations.
      explanation: >-
        The authors state this edge with their own hedging, which the edge
        description preserves.
- name: ANO1 gain-of-function chloride channel hyperactivity
  description: >-
    Rare ANO1 variants increase the sensitivity of the calcium-activated
    chloride channel anoctamin-1 to intracellular calcium. This gain of function
    predisposes to moyamoya disease and is reported with involvement of the
    posterior circulation in addition to the classic features of moyamoya
    disease.
  molecular_functions:
  - preferred_term: intracellularly calcium-gated chloride channel activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0005229
      label: intracellularly calcium-gated chloride channel activity
  genes:
  - preferred_term: ANO1
    term:
      id: hgnc:21625
      label: ANO1
  evidence:
  - reference: PMID:37253099
    reference_title: "Rare variants in ANO1, encoding a calcium-activated chloride channel, predispose to moyamoya disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The ANO1 rare variants were assessed using patch-clamp recordings, and the majority of variants, including ANO1 p.Met658Val, displayed increased sensitivity to intracellular Ca2+.
    explanation: >-
      Patch-clamp recordings are the measurement behind the gain-of-function
      modifier on the channel-activity term.
  - reference: PMID:37253099
    reference_title: "Rare variants in ANO1, encoding a calcium-activated chloride channel, predispose to moyamoya disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our studies support that ANO1 gain-of-function pathogenic variants predispose to moyamoya disease and are associated with unique involvement of the posterior circulation.
    explanation: >-
      The authors' conclusion links the gain of function to moyamoya disease and
      to the posterior-circulation pattern named in the node description.
  downstream:
  - target: Progressive steno-occlusive intracranial arteriopathy
    description: >-
      Gain-of-function anoctamin-1 activity predisposes to the steno-occlusive
      arteriopathy, with additional posterior-circulation lesions.
    evidence:
    - reference: PMID:37253099
      reference_title: "Rare variants in ANO1, encoding a calcium-activated chloride channel, predispose to moyamoya disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our studies support that ANO1 gain-of-function pathogenic variants predispose to moyamoya disease and are associated with unique involvement of the posterior circulation.
      explanation: >-
        Supports the predisposing link from the channel gain of function to the
        moyamoya arteriopathy.

name: Moyamoya Disease
creation_date: "2026-05-04T22:23:50Z"
description: >-
  Moyamoya disease is an idiopathic, progressive cerebrovascular arteriopathy
  characterized by stenosis or occlusion of the circle of Willis and terminal
  internal carotid arteries with development of prominent basal collateral
  vessels that create the radiographic "puff-of-smoke" appearance.
category: Complex
disease_term:
  preferred_term: Moyamoya disease
  term:
    id: MONDO:0016820
    label: Moyamoya disease
parents:
- Vascular disorder
synonyms:
- MMD
- Moyamoya angiopathy
notes: >-
  Scope: this entry is moyamoya disease, the idiopathic primary arteriopathy in
  which the cerebral angiopathy is the only manifestation of the disease
  (PMID:24581742), together with the monogenic forms MONDO files beneath
  MONDO:0016820. Moyamoya syndrome, meaning moyamoya-like vasculopathy
  secondary to another condition, belongs in the underlying disease's own
  entry; moyamoya-like steno-occlusive arteriopathy from ACTA2 Arg179 variants
  is curated in Multisystemic smooth muscle dysfunction syndrome. A
  synonym-inclusive MONDO search (runoak -i ols:mondo search "moyamoya")
  returns nine classes, all of them MONDO:0016820 or its children, so MONDO
  offers no separate moyamoya-syndrome class to bind. MONDO asserts no causal
  gene for MONDO:0009649 moyamoya disease 1 or MONDO:0012122 moyamoya disease
  3, so neither carries a subtype row here. No GeneReviews chapter covers this
  disease in the committed Bookshelf index of 958 chapters. Orphanet was not
  consulted: no ORPHA cache file for moyamoya disease is present.
pathophysiology:
- name: Progressive steno-occlusive intracranial arteriopathy
  description: >-
    Progressive stenosis of the terminal internal carotid arteries and circle
    of Willis lowers cerebral perfusion and drives formation of fragile
    collateral vessels, which underlies ischemic and hemorrhagic presentations.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: vasculature development
    modifier: ABNORMAL
    term:
      id: GO:0001944
      label: vasculature development
  evidence:
  - reference: DOI:10.3171/2024.1.JNS221977
    reference_title: "Management of moyamoya disease: a review of current and future therapeutic strategies"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moyamoya disease (MMD) is characterized by idiopathic, progressive stenosis of the circle of Willis and the terminal portion of the internal carotid arteries with the development of prominent small collateral vessels and a characteristic moyamoya or puff-of-smoke radiographic appearance.
    explanation: This review directly states the defining vascular pathology and collateralization.
  - reference: PMID:24581742
    reference_title: "Loss of α1β1 soluble guanylate cyclase, the major nitric oxide receptor, leads to moyamoya and achalasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      It can occur as an isolated cerebral angiopathy (so-called moyamoya disease) or in association with various conditions (moyamoya syndromes).
    explanation: >-
      Draws the nosological line this entry is scoped on: moyamoya disease is the
      isolated angiopathy, while the same arteriopathy occurring with another
      condition is a moyamoya syndrome and belongs with that condition.
  downstream:
  - target: Intracranial arterial stenosis
    description: >-
      The progressive arteriopathy is observed clinically as stenosis of the
      circle of Willis and the terminal internal carotid arteries.
    evidence:
    - reference: DOI:10.3171/2024.1.JNS221977
      reference_title: "Management of moyamoya disease: a review of current and future therapeutic strategies"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Moyamoya disease (MMD) is characterized by idiopathic, progressive stenosis of the circle of Willis and the terminal portion of the internal carotid arteries with the development of prominent small collateral vessels and a characteristic moyamoya or puff-of-smoke radiographic appearance.
      explanation: >-
        Names the stenosis of these specific vessels as the defining
        manifestation of the arteriopathy.
  - target: Ischemic symptoms and stroke
    description: >-
      Reduced perfusion through the stenosed terminal internal carotid arteries
      produces ischemic stroke.
    evidence:
    - reference: PMID:34381413
      reference_title: "RNF213 and GUCY1A3 in Moyamoya Disease: Key Regulators of Metabolism, Inflammation, and Vascular Stability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Moyamoya disease is an idiopathic chronically progressive cerebrovascular disease, which causes both ischemic and hemorrhagic stroke.
      explanation: >-
        States that the progressive cerebrovascular disease causes ischemic
        stroke, which is this edge.
  - target: Intracranial hemorrhage
    description: >-
      Rupture of the fragile collateral vessels that form in response to the
      stenosis produces intracranial hemorrhage.
    evidence:
    - reference: PMID:34381413
      reference_title: "RNF213 and GUCY1A3 in Moyamoya Disease: Key Regulators of Metabolism, Inflammation, and Vascular Stability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Moyamoya disease is an idiopathic chronically progressive cerebrovascular disease, which causes both ischemic and hemorrhagic stroke.
      explanation: >-
        The same sentence names hemorrhagic stroke as a consequence of the
        arteriopathy.
  - target: Cognitive impairment
    description: >-
      The cerebrovascular disorder has cognitive consequences independent of
      recurrent stroke.
    evidence:
    - reference: PMID:36996746
      reference_title: Long-term study of the cognitive profile of Moyamoya Disease in adults.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Moyamoya Disease (MMD) is a rare cerebrovascular disorder which can have significant cognitive consequences.
      explanation: >-
        Attributes the cognitive consequences to the cerebrovascular disorder
        itself; the same cohort found the profile stable in the absence of
        recurrent stroke.
- name: RNF213-associated angiogenic and remodeling dysregulation
  description: >-
    RNF213 variants, especially p.R4810K in East Asian populations, contribute
    to susceptibility and may perturb endothelial angiogenesis, vascular
    remodeling, and cerebral blood flow regulation.
  genes:
  - preferred_term: RNF213
    term:
      id: hgnc:14539
      label: RNF213
  cell_types:

has_subtypes:
- name: Moyamoya disease 2
  subtype_term:
    preferred_term: Moyamoya disease 2
    term:
      id: MONDO:0011784
      label: Moyamoya disease 2
  description: >-
    The RNF213-associated form, driven in East Asian populations by the variant
    p.R4810K. MONDO carries "moyamoya disease 2, susceptibility to" as a
    synonym of this class, and the variant is a susceptibility allele rather
    than a deterministic cause.
  genes:
  - preferred_term: RNF213
    term:
      id: hgnc:14539
      label: RNF213
  review_notes: >-
    No mode of inheritance is asserted for this subtype. The abstracts cited
    here describe RNF213 as a susceptibility gene without naming one, and the
    autosomal dominant pattern with incomplete penetrance reported for the
    17q25.3 linkage families appears only in the body of PMID:34381413.
  evidence:
  - reference: DOI:10.3390/biomedicines13010017
    reference_title: "Exploring RNF213 in Ischemic Stroke and Moyamoya Disease: From Cellular Models to Clinical Insights"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initially identified as the primary susceptibility gene for MMD, RNF213—notably the p.R4810K variant—has been strongly linked to intracranial artery stenosis (ICAS) and various ischemic stroke subtypes, particularly in East Asian populations.
    explanation: >-
      Supports RNF213 p.R4810K as the East Asian susceptibility allele that
      defines this subtype.

phenotypes:
- category: Skeletal
  name: Generalized osteosclerosis
  description: 'Diffuse increase in bone density on plain radiographs, maximal at the cranial vault. This is the defining radiological finding and the basis of the historical "type I" designation.

    '
  phenotype_term:
    preferred_term: Generalized osteosclerosis
    term:
      id: HP:0005789
      label: Generalized osteosclerosis
  evidence:
  - reference: PMID:12054167
    reference_title: Localization of the gene causing autosomal dominant osteopetrosis type I to chromosome 11q12-13.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Within the autosomal dominant form of osteopetrosis, the radiological type I (ADOI) is characterized by a generalized osteosclerosis, most pronounced at the cranial vault.
    explanation: The defining radiological criterion for ADO1.
- category: Skeletal
  name: Increased bone mineral density
  description: DXA is usually elevated. In a literature synthesis, lumbar-spine values were increased in 40/43 evaluated cases and hip values in 26/31. Radiographic cortical thickening with normal DXA was reported in R1414S carriers, whose variant mechanism remains untested. These selected reports do not estimate carrier penetrance.
  phenotype_term:
    preferred_term: Increased bone mineral density
    term:
      id: HP:0011001
      label: Increased bone mineral density
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:37659026
    reference_title: 'LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dual-energy X-ray absorptiometry (DEXA) scan revealed elevated bone mass.
    explanation: Densitometric confirmation in a genetically confirmed LRP5 case.
  - reference: PMID:36971833
    reference_title: 'Novel mutation in LRP5 gene cause rare osteosclerosis: cases studies and literature review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the proportion of patients with elevated BMD at lumbar spine and hip were 40/43, 26/31, respectively
    explanation: Measurement-specific denominators in a literature synthesis; reports overlap with other reviews and should not be pooled as independent samples.
    quote_role: REVIEW_SYNTHESIS
- category: Craniofacial
  name: Craniofacial hyperostosis
  description: Thickening of skull and facial bones can alter appearance. The historical review recorded facial changes in 93/153 cases with reported status (61%); this broader observation is not a direct frequency measurement of the specific HPO hyperostosis finding.

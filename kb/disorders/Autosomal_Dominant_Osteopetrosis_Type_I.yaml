inheritance:
- name: Autosomal Dominant
  description: Heterozygous LRP5 activating variants segregate as an autosomal dominant trait. Clinical severity varies within families; absence of symptoms is not equivalent to absence of skeletal changes. Historical untyped osteopetrosis cohorts do not provide LRP5-specific penetrance estimates. Recessive loss-of-function LRP5 variants cause the distinct osteoporosis-pseudoglioma syndrome.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:12054167
    reference_title: Localization of the gene causing autosomal dominant osteopetrosis type I to chromosome 11q12-13.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Linkage analysis in two families with ADOI from Danish origin enabled us to assign the disease-causing gene to chromosome 11q12-13.
    explanation: Dominant segregation in two multigenerational families localised the ADO1 locus to the interval that contains LRP5.
  - reference: PMID:29208525
    reference_title: 'Novel familial mutation of LRP5 causing high bone mass: Genetic analysis, clinical presentation, and characterization of bone matrix mineralization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both individuals, we detected a novel heterozygous duplication of six basepairs in the LRP5 gene, resulting in an insertion of two amino acids, very likely associated with a gain-of-function.
    explanation: Affected mother and daughter had a heterozygous in-frame duplication; the report proposes gain of function rather than measuring receptor activity.

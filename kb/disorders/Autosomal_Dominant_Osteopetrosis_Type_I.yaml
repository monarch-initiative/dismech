- category: Skeletal
  name: Absence of increased fracture rate
  description: >
    A discriminating negative. Every other osteopetrosis carries an increased
    fracture rate because the accumulated bone is brittle; ADO1 does not, because
    the bone is added by a normally functioning formation apparatus. This is
    recorded as a phenotype entry rather than a note because it is the single most
    useful feature for distinguishing ADO1 from ADO2 at the bedside, and because
    absence of fractures is a positive claim about this disease, not merely missing
    data.

pathophysiology:
- name: LRP5 Gain-of-Function Variation
  biological_scale: MOLECULAR
  description: Heterozygous LRP5 activating variants cause inherited high bone mass. Many established missense variants cluster in the first extracellular beta-propeller; in-frame insertion alleles also occur. Tested HBM receptor variants have reduced binding or sensitivity to extracellular antagonists. This region participates in a receptor whose ligand binding, trafficking and inhibition are interdependent; it is not simply an isolated non-Wnt-binding brake. The reported cytoplasmic R1414S association has not been functionally shown to use the same mechanism.

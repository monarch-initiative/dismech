    evidence_source: HUMAN_CLINICAL
    snippet: Like the previously reported mutation (G171V) that causes the high-bone-mass phenotype, all mutations are located in the aminoterminal part of the gene, before the first epidermal growth factor-like domain.
    explanation: First-propeller clustering in the alleles studied in 2003; this is not an exhaustive statement about all subsequently reported variants.

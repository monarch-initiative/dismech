inheritance:
- name: Autosomal Dominant
  description: >
    Heterozygous LRP5 missense variants segregate as an autosomal dominant trait
    with high penetrance for the bone density phenotype. The mechanism is gain of
    function rather than haploinsufficiency, which is why the allelic
    loss-of-function condition (osteoporosis-pseudoglioma syndrome) is recessive
    and has the opposite bone phenotype.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:12054167
    reference_title: "Localization of the gene causing autosomal dominant osteopetrosis type I to chromosome 11q12-13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linkage analysis in two families with ADOI from Danish origin enabled us to
      assign the disease-causing gene to chromosome 11q12-13.
    explanation: >-
      Dominant segregation in two multigenerational families localised the ADO1
      locus to the interval that contains LRP5.
  - reference: PMID:3829443
    reference_title: "Osteopetrosis. A genetic and epidemiological study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two obligate carriers, who had the genotype but were not phenotypically
      affected, were disclosed.
    explanation: >-
      Documents non-penetrant obligate carriers in the dominant osteopetrosis
      cohort, establishing that penetrance is incomplete. Note the cohort predates
      the ADO1/ADO2 split, so this bears on dominant osteopetrosis generally.
  - reference: PMID:3829443
    reference_title: "Osteopetrosis. A genetic and epidemiological study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a great variation in the clinical manifestations; 39% were
      asymptomatic.
    explanation: >-
      Quantifies the asymptomatic fraction, which is why most carriers are
      ascertained incidentally rather than clinically.
prevalence:
- population: Funen County, Denmark
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 5.5
  notes: >-
    Read this as an upper bound for ADO1, not an ADO1 figure. The 1986 Funen
    County survey predates both the radiological separation of autosomal dominant
    osteopetrosis into types I and II and the 2002 identification of LRP5, so its
    32 autosomal dominant patients are the whole dominant group. The common
    dominant form is the CLCN7-related type II, so most of that 5.5/100,000 is
    almost certainly ADO2. No survey has ever measured ADO1 prevalence separately.
    The figure is recorded because it bounds the disorder and because the same
    cohort supplies the penetrance and asymptomatic-fraction data used below.
  evidence:
  - reference: PMID:3829443
    reference_title: "Osteopetrosis. A genetic and epidemiological study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By a systemic search of osteopetrosis in the county of Funen, Denmark, the
      prevalence was 5.5/100,000 inhabitants.
    explanation: >-
      Gives the population prevalence of osteopetrosis in a defined geographic
      cohort; the scope caveat is recorded in notes rather than in the quote.
- population: Worldwide, cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2023 historical review assembled every reported Worth-type endosteal
    hyperostosis / LRP5 HBM case, both the pre-2002 clinically defined reports and
    the genetically confirmed ones since. No population-based prevalence estimate
    exists, and ascertainment is biased because asymptomatic carriers are found
    only incidentally on densitometry.
  evidence:
  - reference: PMID:37659026
    reference_title: "LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Including the present case, 155 patients have been reported to date."
    explanation: >-
      Gives the cumulative reported case count, which is the only occurrence
      figure available for this disorder.
genetic:
- name: LRP5
  notes: >
    LRP5 (11q13.2) encodes low-density lipoprotein receptor-related protein 5, the
    Wnt co-receptor that partners Frizzled to transduce canonical Wnt signals in
    osteoblasts. Disease alleles in ADO1 are missense substitutions confined to the
    amino-terminal first beta-propeller, before the first EGF-like domain
    (D111Y, G171R, G171V, A214T, A214V, A242T, T253I). This is the sclerostin- and
    DKK1-binding surface, which is why the substitutions act by escaping inhibition
    rather than by increasing intrinsic receptor activity. The direction of effect
    is gain of function; the allelic loss-of-function alleles cause the recessive
    disorder osteoporosis-pseudoglioma syndrome, with low rather than high bone mass.
  gene_term:
    preferred_term: LRP5
    term:
      id: hgnc:6697
      label: LRP5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:12579474
    reference_title: "Six novel missense mutations in the LDL receptor-related protein 5 (LRP5) gene in different conditions with an increased bone density."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen of these were confirmed as polymorphisms, but six novel missense
      mutations (D111Y, G171R, A214T, A214V, A242T, and T253I) are most likely
      disease causing.
    explanation: >-
      Identifies the LRP5 missense alleles found in patients ascertained with
      increased bone density including osteopetrosis type I.
  - reference: PMID:12579474
    reference_title: "Six novel missense mutations in the LDL receptor-related protein 5 (LRP5) gene in different conditions with an increased bone density."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed mutation analysis of the LRP5 gene in 10 families or isolated
      patients with different conditions with an increased bone density, including
      endosteal hyperostosis, Van Buchem disease, autosomal dominant osteosclerosis,
      and osteopetrosis type I.
    explanation: >-
      Establishes that osteopetrosis type I was among the high-bone-density
      conditions in which LRP5 was screened, linking the gene to this entry's disease.
  - reference: PMID:16251418
    reference_title: "Osteoclasts from patients with autosomal dominant osteopetrosis type I caused by a T253I mutation in low-density lipoprotein receptor-related protein 5 are normal in vitro, but have decreased resorption capacity in vivo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant osteopetrosis type I (ADOI) is presumably caused by
      gain-of-function mutations in the LRP5 gene.
    explanation: >-
      States the gain-of-function direction of effect that distinguishes ADO1 from
      the loss-of-function osteopetroses.
  - reference: PMID:37659026
    reference_title: "LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LRP5 high bone mass (HBM) is an autosomal dominant endosteal hyperostosis
      caused by mutations of the low-density lipoprotein receptor-related protein 5
      (LRP5) gene.
    explanation: Confirms LRP5 as the causative gene under the disorder's modern designation.
  - reference: PMID:20855225
    reference_title: "Genetics of bone diseases: Paget's disease, fibrous dysplasia, osteopetrosis, and osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of LRP5 gain-of-function mutations in autosomal dominant
      osteopetrosis type I prompted a revision of the classification scheme, and
      this form is now being included among the high-bone-mass diseases.
    explanation: >-
      States both the gain-of-function mechanism and the resulting reclassification
      of ADO1 out of the osteopetroses, which is the framing this whole entry rests
      on and was previously asserted only in prose.
pathophysiology:
- name: LRP5 First Beta-Propeller Missense Substitution
  biological_scale: MOLECULAR
  description: >
    Heterozygous missense substitutions land in the amino-terminal first
    beta-propeller of LRP5, before the first EGF-like domain. The clustering is the
    mechanistic clue: this region is not the Wnt-binding or signal-transducing part
    of the receptor but the docking surface for the secreted inhibitors sclerostin
    and DKK1. Substitutions here therefore do not make the receptor intrinsically
    more active; they make it unavailable to the physiological brake.
  gene:
    preferred_term: LRP5
    term:
      id: hgnc:6697
      label: LRP5
  evidence:
  - reference: PMID:12579474
    reference_title: "Six novel missense mutations in the LDL receptor-related protein 5 (LRP5) gene in different conditions with an increased bone density."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Like the previously reported mutation (G171V) that causes the high-bone-mass
      phenotype, all mutations are located in the aminoterminal part of the gene,
      before the first epidermal growth factor-like domain.
    explanation: >-
      Establishes the domain clustering of ADO1 alleles in the amino-terminal
      region, the structural basis of this node.
  downstream:
  - target: Constitutive Canonical Wnt Signaling in Osteoblasts
    causal_link_type: DIRECT
    description: >
      Loss of inhibitor docking leaves the receptor signalling at a level set by Wnt
      ligand availability alone.
    evidence:
    - reference: PMID:18328982
      reference_title: "Sclerosing bone disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Other less common recessive or dominant sclerosing disorders, such as
        endosteal hyperostosis, sclerostosis, van Buchen disease and high bone mass
        syndrome, are due to mutations in two genes (LRP5 and SOST) of the Wnt
        pathway that induce increased osteoblast activity.
      explanation: >-
        Places LRP5 and its inhibitor SOST on the same Wnt axis and states that the
        consequence is increased osteoblast activity.
    - reference: PMID:25808845
      reference_title: "High Bone Mass-Causing Mutant LRP5 Receptors Are Resistant to Endogenous Inhibitors In Vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We observed that the (8kb) Dmp1-SOST transgene significantly lowered
        whole-body bone mineral density (BMD), bone mineral content (BMC), femoral
        and vertebral trabecular bone volume fraction (BV/TV), and periosteal
        bone-formation rate (BFR) in wild-type mice but not in mice with Lrp5
        p.G171V and p.A214V alleles.
      explanation: >-
        Direct in vivo test of the escape-from-inhibition mechanism: overexpressed
        sclerostin suppresses bone in wild-type mice but not in mice carrying the
        HBM alleles, which is the causal step this edge asserts.
- name: Constitutive Canonical Wnt Signaling in Osteoblasts
  biological_scale: CELLULAR
  description: >
    Canonical Wnt/beta-catenin signalling in the osteoblast lineage runs above its
    normal set point. This is a qualitative change, not merely a quantitative one:
    the pathway is no longer under the control of the sclerostin feedback loop by
    which osteocytes normally restrain formation in response to mechanical and
    endocrine cues.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  evidence:
  - reference: PMID:18328982
    reference_title: "Sclerosing bone disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other less common recessive or dominant sclerosing disorders, such as
      endosteal hyperostosis, sclerostosis, van Buchen disease and high bone mass
      syndrome, are due to mutations in two genes (LRP5 and SOST) of the Wnt
      pathway that induce increased osteoblast activity.
    explanation: >-
      Attributes the increased osteoblast activity in this disease group to Wnt
      pathway gene mutations.
  downstream:
  - target: Increased Osteoblastic Bone Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16251418
      reference_title: "Osteoclasts from patients with autosomal dominant osteopetrosis type I caused by a T253I mutation in low-density lipoprotein receptor-related protein 5 are normal in vitro, but have decreased resorption capacity in vivo."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with a T253I mutation in LRP5 have a high bone mass phenotype,
        characterized by increased mineralizing surface index but abnormally low
        numbers of small osteoclasts.
      explanation: >-
        The increased mineralizing surface index is the histomorphometric readout of
        increased osteoblastic formation in ADO1 patients.
  - target: Reduced Osteoclast Number and Resorptive Response
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered osteoblastic support of osteoclastogenesis
    - osteoblast-presented RANKL and OPG signalling to the osteoclast lineage
    description: >
      The osteoclast abnormality in ADO1 is secondary to the osteoblast lesion, not
      parallel to it. This is the inferential step in the entry and it is explicitly
      framed as a speculation by the authors who made the measurement.
    evidence:
    - reference: PMID:16251418
      reference_title: "Osteoclasts from patients with autosomal dominant osteopetrosis type I caused by a T253I mutation in low-density lipoprotein receptor-related protein 5 are normal in vitro, but have decreased resorption capacity in vivo."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We speculate that the mutations causing ADOI alter the osteoblastic
        phenotype toward a smaller potential for supporting osteoclastogenesis.
      explanation: >-
        The authors propose the osteoblast-to-osteoclast link explicitly as a
        speculation, so the edge is recorded as indirect and the quoted hedge is
        preserved rather than paraphrased into a claim the source does not make.
- name: Increased Osteoblastic Bone Formation
  biological_scale: TISSUE
  description: >
    Bone matrix is deposited at an increased rate, measurable as an increased
    mineralizing surface index on histomorphometry. Formation predominantly thickens
    the endosteal surface and the cranial vault rather than expanding the metaphyses,
    which is why ADO1 lacks the Erlenmeyer flask deformity of the resorption-failure
    osteopetroses.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: bone mineralization
    modifier: INCREASED
    term:
      id: GO:0030282
      label: bone mineralization
  evidence:
  - reference: PMID:16251418
    reference_title: "Osteoclasts from patients with autosomal dominant osteopetrosis type I caused by a T253I mutation in low-density lipoprotein receptor-related protein 5 are normal in vitro, but have decreased resorption capacity in vivo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found attenuated resorptive response to T3 stimulation, despite a normal
      bone formation response, in alignment with the reduced number of osteoclasts
      in vivo.
    explanation: >-
      Documents that the bone formation response is intact in ADO1 patients in vivo,
      in contrast to the resorptive arm.
  downstream:
  - target: Generalized Osteosclerosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18328982
      reference_title: "Sclerosing bone disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Osteocondensation can also be related to increased bone formation."
      explanation: >-
        States the formation-driven route to increased bone density that this entry's
        pathograph follows.
- name: Reduced Osteoclast Number and Resorptive Response
  biological_scale: CELLULAR
  description: >
    Osteoclast numbers are low in vivo and the resorptive response to a stimulus is
    blunted, yet osteoclasts taken from the same patients behave normally in culture.
    Osteoclastogenesis, marker expression, morphology, localisation of ClC-7 and
    cathepsin K, and the ability to resorb bone are all preserved in vitro. The
    defect is therefore in the bone microenvironment, not in the osteoclast.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: bone resorption
    modifier: DECREASED
    term:
      id: GO:0045453
      label: bone resorption
  evidence:
  - reference: PMID:16251418
    reference_title: "Osteoclasts from patients with autosomal dominant osteopetrosis type I caused by a T253I mutation in low-density lipoprotein receptor-related protein 5 are normal in vitro, but have decreased resorption capacity in vivo."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found normal osteoclastogenesis, expression of osteoclast markers,
      morphology, and localization of proteins involved in bone resorption, such as
      ClC-7 and cathepsin K.
    explanation: >-
      The cell-culture arm of the study establishes that ADO1 osteoclasts are
      intrinsically normal, which is what makes the in vivo deficit
      non-cell-autonomous.
  - reference: PMID:16251418
    reference_title: "Osteoclasts from patients with autosomal dominant osteopetrosis type I caused by a T253I mutation in low-density lipoprotein receptor-related protein 5 are normal in vitro, but have decreased resorption capacity in vivo."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data demonstrate that ADOI osteoclasts are normal with respect to all
      aspects investigated in vitro.
    explanation: >-
      The authors' own summary of the negative in vitro result, cited here because a
      well-characterised negative is what excludes an osteoclast-intrinsic mechanism.
  downstream:
  - target: Generalized Osteosclerosis
    causal_link_type: DIRECT
    description: >
      Reduced resorption compounds the formation excess, but is a consequence of the
      osteoblast lesion rather than an independent cause.
    evidence:
    - reference: PMID:16251418
      reference_title: "Osteoclasts from patients with autosomal dominant osteopetrosis type I caused by a T253I mutation in low-density lipoprotein receptor-related protein 5 are normal in vitro, but have decreased resorption capacity in vivo."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with a T253I mutation in LRP5 have a high bone mass phenotype,
        characterized by increased mineralizing surface index but abnormally low
        numbers of small osteoclasts.
      explanation: >-
        Ties the low osteoclast number directly to the high bone mass phenotype in
        the same patients.
- name: Generalized Osteosclerosis
  biological_scale: TISSUE
  description: >
    Diffusely increased bone density, most pronounced at the cranial vault and the
    endosteal surfaces of the long bones. Unlike the resorption-failure
    osteopetroses the accumulated bone is architecturally competent, so it does not
    carry the fracture, marrow-failure and extramedullary-haematopoiesis
    consequences that follow from dense but brittle bone.
  evidence:
  - reference: PMID:12054167
    reference_title: "Localization of the gene causing autosomal dominant osteopetrosis type I to chromosome 11q12-13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Within the autosomal dominant form of osteopetrosis, the radiological type I
      (ADOI) is characterized by a generalized osteosclerosis, most pronounced at
      the cranial vault.
    explanation: >-
      Defines the radiological hallmark and its cranial predominance, which is what
      drives the neurological consequences downstream.
  downstream:
  - target: Cranial Foramina Narrowing
    causal_link_type: DIRECT
    description: >
      Because the sclerosis is most marked at the skull base and vault, the bony
      canals transmitting the cranial nerves progressively narrow.
    evidence:
    - reference: PMID:12054167
      reference_title: "Localization of the gene causing autosomal dominant osteopetrosis type I to chromosome 11q12-13."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Within the autosomal dominant form of osteopetrosis, the radiological type I
        (ADOI) is characterized by a generalized osteosclerosis, most pronounced at
        the cranial vault.
      explanation: >-
        The cranial predominance of the sclerosis is the anatomical basis for
        foraminal narrowing.
  - target: Increased bone mineral density
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37659026
      reference_title: "LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Dual-energy X-ray absorptiometry (DEXA) scan revealed elevated bone mass.
      explanation: >-
        Densitometric confirmation of the sclerosis in a genetically confirmed case.
- name: Cranial Foramina Narrowing
  biological_scale: TISSUE
  description: >
    Progressive bony encroachment on the cranial foramina compresses the nerves
    passing through them. This is the main route by which an otherwise
    well-tolerated increase in bone mass becomes symptomatic disease, and it is the
    reason the neurological features are late and slowly progressive rather than
    congenital.
  evidence:
  - reference: PMID:37659026
    reference_title: "LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurological manifestations, previously considered absent in the disease,
      affect 19.4% of the patients.
    explanation: >-
      Establishes that neurological involvement is a real and quantified feature of
      the disorder, correcting the earlier view that it did not occur.
  downstream:
  - target: Hearing impairment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12054167

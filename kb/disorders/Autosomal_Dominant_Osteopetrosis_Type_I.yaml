    snippet: We performed mutation analysis of the LRP5 gene in 10 families or isolated patients with different conditions with an increased bone density, including endosteal hyperostosis, Van Buchem disease, autosomal dominant osteosclerosis, and osteopetrosis type I.
    explanation: Establishes that osteopetrosis type I was among the high-bone-density conditions in which LRP5 was screened, linking the gene to this entry's disease.

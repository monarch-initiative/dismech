genetic:
- name: LRP5
  notes: LRP5 encodes a Wnt co-receptor. Established high-bone-mass alleles include D111Y, G171R, G171V, A214T, A214V, A242T and T253I, concentrated in the first extracellular beta-propeller. The variant spectrum also includes a two-amino-acid insertion. A 2023 report associated cytoplasmic R1414S with radiographic cortical thickening in a father and son whose DXA measurements were normal; that study used segregation and computational predictions without a functional assay. R1414S should not be assumed to share the experimentally demonstrated inhibitor-resistance mechanism of canonical extracellular alleles. Effects on sclerostin, DKK1 and trafficking differ by allele. Recessive loss-of-function disease has the opposite skeletal phenotype.

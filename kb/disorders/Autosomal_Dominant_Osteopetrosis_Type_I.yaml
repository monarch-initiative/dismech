diagnosis:
- name: Skeletal survey and bone densitometry
  description: Radiographs characterize skull-vault and long-bone cortical thickening, while DXA quantifies density. The classic type I pattern differs from the skull-base, sandwich-vertebra and bone-within-bone pattern of type II, but clinical overlap and LRP6 phenocopies make molecular assessment useful. Normal DXA does not automatically exclude a reported cortical-overgrowth phenotype.
  evidence:
  - reference: PMID:37659026
    reference_title: 'LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dual-energy X-ray absorptiometry (DEXA) scan revealed elevated bone mass.
    explanation: DEXA is the densitometric confirmation step used in the reported workup.
- name: LRP5 sequencing
  description: LRP5 analysis in the context of imaging and family history distinguishes molecularly supported LRP5 high bone mass from other sclerosing dysplasias. Testing should accommodate sequence variants and small in-frame changes rather than assuming every causal variant is a first-propeller missense substitution. A reported cytoplasmic association remains functionally unconfirmed.
  evidence:
  - reference: PMID:37659026
    reference_title: 'LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Genetic analysis and appropriate denomination of LRP5 HBM are fundamental for diagnosis and to mitigate the confusion that has long characterized this disease.
    explanation: States that molecular analysis is central to establishing this diagnosis.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:29208525
    reference_title: 'Novel familial mutation of LRP5 causing high bone mass: Genetic analysis, clinical presentation, and characterization of bone matrix mineralization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both individuals, we detected a novel heterozygous duplication of six basepairs in the LRP5 gene, resulting in an insertion of two amino acids, very likely associated with a gain-of-function.
    explanation: Affected mother and daughter had a heterozygous in-frame duplication; the report proposes gain of function rather than measuring receptor activity.
- name: Bone turnover and circulating Wnt-inhibitor measurements
  description: Normal turnover markers do not exclude high bone mass. In 16 G171V/N198S carriers, 13 unaffected relatives and 24 unrelated controls, mean affected Z-score was 6.4 but CTX and P1NP did not differ significantly across groups. Sclerostin and DKK1 did not distinguish carriers from relatives. SFRP-4 was higher in both affected and unaffected relatives than unrelated controls, so it did not discriminate mutation status within those kindreds. These measurements are not validated confirmatory tests. A prior T253I study had different biomarker findings, limiting generalization across alleles.
  evidence:
  - reference: PMID:24927689
    reference_title: "Serum levels of sclerostin, Dickkopf-1, and secreted frizzled-related protein-4 are not changed in individuals with high bone mass causing mutations in LRP5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There were no differences in CTX or P1NP values among the three groups.
    explanation: Normal-group comparisons despite marked high bone mass; lack of significance is not universal equivalence.
  - reference: PMID:24927689
    reference_title: "Serum levels of sclerostin, Dickkopf-1, and secreted frizzled-related protein-4 are not changed in individuals with high bone mass causing mutations in LRP5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was no group effect for sclerostin when analyzed by one-way ANOVA
    explanation: Direct measurement in the G171V/N198S kindred comparison.
  - reference: PMID:24927689
    reference_title: "Serum levels of sclerostin, Dickkopf-1, and secreted frizzled-related protein-4 are not changed in individuals with high bone mass causing mutations in LRP5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: there was an overall group effect by one-way ANOVA. When an ANCOVA analysis was conducted for Dkk-1, controlling for age did not affect the results in any pair-wise comparisons among the three groups, all of which remained nonsignificant.
    explanation: DKK1 did not show significant pairwise differences despite a borderline overall group effect.
  - reference: PMID:24927689
    reference_title: "Serum levels of sclerostin, Dickkopf-1, and secreted frizzled-related protein-4 are not changed in individuals with high bone mass causing mutations in LRP5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: When age was controlled for, the serum SFRP-4 values in both the affected and unaffected kindreds members remained significantly higher than the mean value in controls (p=0.01 for both comparisons).
    explanation: The full text reports elevated SFRP-4 versus unrelated controls in both family groups; the abstract should not be read as universally unchanged serum concentrations.
differential_diagnoses:
- name: Autosomal dominant osteopetrosis type II (Albers-Schonberg disease)
  description: CLCN7-related dominant osteopetrosis has a resorption defect, often with sandwich vertebrae, bone-within-bone changes and increased fracture susceptibility. Clinical variability means that absence of fractures alone does not exclude it.
  evidence:
  - reference: PMID:12054167
    reference_title: Localization of the gene causing autosomal dominant osteopetrosis type I to chromosome 11q12-13.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ADOI is the only type of osteopetrosis not associated with an increased fracture rate.
    explanation: The fracture-rate contrast is the stated discriminator between ADO1 and the other osteopetroses.
- name: LRP6 high bone mass
  description: LRP6-related high bone mass can resemble LRP5 disease clinically. A negative LRP5 result prompts consideration of LRP6 and other sclerosing dysplasias; it does not establish an LRP6 diagnosis.
  evidence:
  - reference: PMID:37659026
    reference_title: 'LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the detection of pathogenic mutations in the low-density lipoprotein receptor-related protein 6 (LRP6) gene in some patients with autosomal dominant HBM phenotype led to the description of a clinically identical disorder in 2019, called LRP6 HBM
    explanation: Establishes LRP6 HBM as a separate gene producing a clinically identical high-bone-mass disorder.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37659026
    reference_title: 'LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: when comparing the affected individuals with patients carrying LRP5 mutations, no feature was found to differentiate LRP6 HBM from LRP5 HBM
    explanation: States directly that no clinical feature separates the two, which is why this differential is resolvable only by sequencing.
    quote_role: REVIEW_SYNTHESIS
- name: Sclerosteosis and van Buchem disease
  description: Sclerosteosis and van Buchem disease reduce sclerostin activity through SOST coding or regulatory defects and can cause marked skeletal overgrowth. They involve the same antagonist–receptor pathway as LRP5 high bone mass, with different inheritance and molecular causes.
  evidence:
  - reference: PMID:18328982
    reference_title: Sclerosing bone disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Other less common recessive or dominant sclerosing disorders, such as endosteal hyperostosis, sclerostosis, van Buchen disease and high bone mass syndrome, are due to mutations in two genes (LRP5 and SOST) of the Wnt pathway that induce increased osteoblast activity.
    explanation: Groups the SOST and LRP5 disorders as the same Wnt-axis differential.
    quote_role: REVIEW_SYNTHESIS
- name: Osteoporosis-pseudoglioma syndrome
  description: Recessive loss-of-function LRP5 disease causes osteoporosis-pseudoglioma syndrome, with low bone mass and ocular disease. It is an allelic contrast rather than a high-bone-mass clinical phenocopy.
  evidence:
  - reference: PMID:12579474
    reference_title: Six novel missense mutations in the LDL receptor-related protein 5 (LRP5) gene in different conditions with an increased bone density.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The LDL receptor-related protein 5 (LRP5) gene has been shown to be involved in both osteoporosis-pseudoglioma syndrome and the high-bone-mass phenotype and turned out to be an important regulator of peak bone mass in vertebrates.
    explanation: Establishes the allelic relationship between the low- and high-bone-mass LRP5 disorders.
animal_models:
- name: Lrp5 p.G171V knock-in mouse
  species: Mouse
  genotype: Homozygous Lrp5 p.G171V knock-in at the endogenous locus, crossed with SOST- or Dkk1-overexpressing transgenes
  publication: PMID:25808845
  description: The 2015 inhibitor-challenge study used homozygous G171V knock-in mice. Endogenous-locus expression preserves regulatory context but differs from the usual heterozygous human genotype. Skeletal responses depend on inhibitor, site and sex.
  modeled_mechanisms:
  - target: LRP5 Gain-of-Function Variation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: 'Carries the orthologous substitution at the endogenous locus, and reproduces the defining property of the human allele, resistance to sclerostin.

      '
    limitations: Two mutant alleles differ from human heterozygosity. Cranial-nerve morbidity was not evaluated, so absence of that phenotype cannot be inferred. Background differences and different transgene promoters/expression levels limit cross-inhibitor comparisons.
    readouts:
    - name: Bone response to osteocytic SOST overexpression
      target: LRP5 Gain-of-Function Variation
      direction: UNCHANGED
      interpretation: The main whole-body and selected bone endpoints did not show significant SOST-induced reductions in HBM mice, unlike controls. This is resistance in specified readouts, not proof of zero response in every microarchitectural parameter.
      evidence:
      - reference: PMID:25808845
        reference_title: High Bone Mass-Causing Mutant LRP5 Receptors Are Resistant to Endogenous Inhibitors In Vivo.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: We observed that the (8kb) Dmp1-SOST transgene significantly lowered whole-body bone mineral density (BMD), bone mineral content (BMC), femoral and vertebral trabecular bone volume fraction (BV/TV), and periosteal bone-formation rate (BFR) in wild-type mice but not in mice with Lrp5 p.G171V and p.A214V alleles.
        explanation: Abstract summary of specified endpoints; full text reports some residual architectural effects.
    evidence:
    - reference: PMID:25808845
      reference_title: High Bone Mass-Causing Mutant LRP5 Receptors Are Resistant to Endogenous Inhibitors In Vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We previously reported the creation of two Lrp5 HBM knock-in mouse models, in which the human p.A214V or p.G171V missense mutations were knocked into the endogenous Lrp5 locus.
      explanation: Establishes that these are knock-ins of the human disease alleles at the endogenous locus, which is what makes them informative for this node.
- name: Lrp5 p.A214V knock-in mouse
  species: Mouse
  genotype: Homozygous Lrp5 p.A214V knock-in at the endogenous locus, crossed with SOST- or Dkk1-overexpressing transgenes
  publication: PMID:25808845
  description: The 2015 inhibitor-challenge study used homozygous A214V knock-in mice. Endogenous-locus expression preserves regulatory context but differs from the usual heterozygous human genotype. Skeletal responses depend on inhibitor, site and sex.
  modeled_mechanisms:
  - target: LRP5 Gain-of-Function Variation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces sclerostin resistance but remains more sensitive than G171V to DKK1. Under DKK1 challenge, A214V whole-body aBMD fell by approximately 11–14%, with site-specific effects.
    limitations: Two mutant alleles differ from human heterozygosity. Cranial-nerve morbidity was not evaluated, so absence of that phenotype cannot be inferred. Background differences and different transgene promoters/expression levels limit cross-inhibitor comparisons.
    evidence:
    - reference: PMID:25808845
      reference_title: High Bone Mass-Causing Mutant LRP5 Receptors Are Resistant to Endogenous Inhibitors In Vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The (2.3kb) Col1a1-Dkk1 transgene significantly lowered whole-body BMD, BMC, and vertebral BV/TV in wild-type mice and affected p.A214V mice more than p.G171V mice.
      explanation: Documents the allele-specific difference in DKK1 sensitivity that limits how far this model generalises.
- name: Conditional Lrp5 HBM with Wls deletion in late osteoblasts and osteocytes
  species: Mouse
  genotype: Dmp1-Cre activation of conditional G171V or A214V Lrp5 alleles with conditional Wls deletion
  publication: PMID:42113468
  description: Tests whether intracellular retention of G171V permits bone accrual when Wnt secretion is impaired. Severe Wls-associated osteopenia persisted with either HBM allele; some male bone-mineral-content endpoints showed partial effects.
  modeled_mechanisms:
  - target: Enhanced Canonical Wnt Signaling in Bone-Forming Cells
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Perturbation tests the dependence of HBM behavior on the ligand-secretion environment.
    limitations: Wls deletion can change resorption and intracellular ligand positioning; these confound a simple inference about receptor localization. This is an engineered compound genotype, not isolated human LRP5 disease.
    evidence:
    - reference: PMID:42113468
      reference_title: Different Lrp5-HBM mutations induce magnitude- and surface-selective effects that are not explained by receptor trafficking.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Wls-deleted mice exhibited a severe low bone mass phenotype whether G171V or A214V was present or not.
      explanation: Conditional Dmp1-Cre experiments constrain a ligand-independent or intracellular-retention explanation; altered resorption and intracellular ligand localization remain potential confounders.
  evidence:
  - reference: PMID:42113468
    reference_title: Different Lrp5-HBM mutations induce magnitude- and surface-selective effects that are not explained by receptor trafficking.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Wls-deleted mice exhibited a severe low bone mass phenotype whether G171V or A214V was present or not.
    explanation: Conditional Dmp1-Cre experiments constrain a ligand-independent or intracellular-retention explanation; altered resorption and intracellular ligand localization remain potential confounders.
discussions:
- discussion_id: ado1_osteoclast_link_mechanism
  kind: KNOWLEDGE_GAP
  prompt: Which signals explain reduced resorptive responses in T253I disease, and how far does this mechanism generalize to other LRP5 HBM alleles?
  attaches_to:
  - pathophysiology#Reduced Osteoclast Number and Resorptive Response
  rationale: Normal tested osteoclast endpoints under supplied RANKL/M-CSF favor environmental dependence but do not prove that the entire intrinsic program is unaffected. The T253I authors proposed altered osteoblastic support without demonstrating a mediator. A later study actually measured circulating RANKL/OPG in 16 affected G171V/N198S carriers, 13 unaffected relatives and unrelated controls; the ratio difference was nonsignificant (p=0.09). This neither proves nor excludes altered local signaling at remodeling surfaces, and does not directly resolve T253I biology. Allele-specific co-culture or in vivo perturbation studies are needed.
  evidence:
  - reference: PMID:24927689
    reference_title: Serum levels of sclerostin, Dickkopf-1, and secreted frizzled-related protein-4 are not changed in individuals with high bone mass causing mutations in LRP5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is also of interest that the RANKL/OPG ratio was higher in the affected individuals than in the other two groups, although this too was not significant.
    explanation: The ratio was measured, with p=0.09 in Table 1; serum measurements are not a test of local osteoblast–osteoclast mediation.
- discussion_id: ado1_neuro_ascertainment_bias
  kind: KNOWLEDGE_GAP
  prompt: Does the 19.4% neurological involvement figure reflect the true rate, or ascertainment bias in a literature assembled from case reports?
  attaches_to:
  - pathophysiology#Cranial Foramina Narrowing
  rationale: 'The figure comes from pooling published cases across a century of shifting nomenclature, and symptomatic patients are far more likely to be published than the asymptomatic carriers found incidentally on DEXA. The review itself notes that neurological manifestations were previously considered absent, which shows how much the estimate has moved with ascertainment. A population-based or family-based series would be needed to fix the rate.

    '
- discussion_id: ado1_g171v_trafficking
  kind: KNOWLEDGE_GAP
  prompt: How does G171V enhance bone accrual despite reduced surface localization in some experimental systems?
  attaches_to:
  - pathophysiology#Enhanced Canonical Wnt Signaling in Bone-Forming Cells
  rationale: Earlier cellular work proposed preserved autocrine signaling with reduced extracellular inhibitor access. The 2026 Wls-deletion experiments did not support preferential rescue by intracellularly retained G171V, but altered resorption and intracellular ligand positioning limit exclusion of every trafficking mechanism. Relative contributions of antagonist resistance, receptor localization and ligand availability remain unresolved.
  evidence:
  - reference: PMID:42113468
    reference_title: Different Lrp5-HBM mutations induce magnitude- and surface-selective effects that are not explained by receptor trafficking.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Wls-deleted mice exhibited a severe low bone mass phenotype whether G171V or A214V was present or not.
    explanation: Conditional Dmp1-Cre experiments constrain a ligand-independent or intracellular-retention explanation; altered resorption and intracellular ligand localization remain potential confounders.
treatments:
- name: Clinical surveillance
  description: Management is individualized to skeletal and neurologic symptoms. Hearing, cranial nerve deficits and signs of intracranial hypertension warrant clinical assessment. The cited case literature does not establish a standard surveillance interval or a disease-modifying treatment.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: Reported interventions address symptoms or compression. Treatments used for other osteopetrosis mechanisms should not be inferred to benefit LRP5 high bone mass.
  evidence:
  - reference: PMID:37659026
    reference_title: 'LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In summary, neurological involvement may occur because of nerve tissue compression by hyperostotic bone, cerebellar disturbances due to a reduction in size of the posterior cranial fossa or tonsillar herniation, and chronic intracranial hypertension
    explanation: Distinguishes direct nerve compression from reduced posterior-fossa space and pressure-related complications.
    quote_role: REVIEW_SYNTHESIS
- name: Hearing rehabilitation
  description: External hearing aids were used for mixed deafness in the A242T index case. This observation supports individualized hearing rehabilitation without establishing comparative efficacy.
  evidence:
  - reference: PMID:37659026
    reference_title: 'LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At age 35, external hearing aids were placed due to complete, bilateral, and mixed hearing loss caused by the narrowing of internal and external acoustic meati.
    explanation: Index A242T case with anatomically described auditory canal narrowing.
  treatment_term:
    preferred_term: Hearing rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  therapeutic_modality: OTHER
- name: Specialist surgical decompression
  description: Occipital decompression has been reported in an LRP5 insertion-allele carrier with foramen magnum stenosis. A separate clinically diagnosed, genetically untested ADO1 case had temporary relief after posterior fossa decompression and prolonged relief after microvascular decompression for recurrent trigeminal neuralgia. These selected cases support evaluation of documented compressive complications, not routine prophylactic surgery or disease modification.
  evidence:
  - reference: PMID:29208525
    reference_title: 'Novel familial mutation of LRP5 causing high bone mass: Genetic analysis, clinical presentation, and characterization of bone matrix mineralization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: When the daughter had part of the occipital bone surgically removed, the bone sample was used for the visualization of bone lamellar structure and bone cells as well as the measurement of bone mineralization density distribution (BMDD).
    explanation: Confirms surgery in a genetically characterized case without supplying a controlled efficacy estimate.
  - reference: PMID:41431003
    reference_title: 'Staged posterior fossa decompression and microvascular decompression for trigeminal neuralgia in autosomal dominant osteopetrosis type I: A case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Throughout more than 5 years of follow-up, she remained entirely pain-free, without recurrence, and had discontinued all medications.
    explanation: Outcome after second-stage microvascular decompression in one clinically diagnosed ADO1 case; genetic testing was not performed.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Specialist surgical decompression
    term:
      id: NCIT:C15329
      label: Surgical Procedure
- name: Mandibular reduction surgery
  description: A young woman diagnosed with Worth syndrome underwent mandibular reduction using cutting guides. This is a single reported surgical outcome for mandibular enlargement; the available abstract does not establish her genotype or comparative efficacy.
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:36907844
    reference_title: Worth Syndrome-Patient Report, Diagnostic Work-Up, and Surgical Management of a Rare Craniofacial Entity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The authors report the preoperative considerations in a young female with Worth syndrome, operative planning, and successful mandibular reduction using cutting guides.
    explanation: Primary surgical case using the historical Worth designation; limited to the available abstract.
  treatment_term:
    preferred_term: Mandibular reduction surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
- name: Cochlear implantation
  description: A molecularly characterized insertion-allele carrier with congenital hearing impairment underwent cochlear implantation. The available abstract does not quantify hearing benefit.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  evidence:
  - reference: PMID:29208525
    reference_title: 'Novel familial mutation of LRP5 causing high bone mass: Genetic analysis, clinical presentation, and characterization of bone matrix mineralization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the daughter suffered from congenital hearing impairment resulting in cochlear implantation, recurrent facial palsy, and migraine
    explanation: Primary report of hearing rehabilitation in a molecularly characterized family.
notes: 'This entry retains MONDO:0011877 while covering the overlapping LRP5 high-bone-mass, Worth-type endosteal-hyperostosis and historical ADO1 literature. Modern usage distinguishes this primarily Wnt-related bone-accrual disorder from classical osteoclast-resorption defects; T253I data nevertheless show that resorptive responses can contribute.

  The 5.5/100,000 estimate in PMID:3829443 describes a historical Funen osteopetrosis cohort containing 33 patients, including one non-dominant case. Its untyped carriers and asymptomatic fraction do not supply LRP5-specific prevalence or penetrance, so those structured estimates have been removed. The 155-case historical review includes only 64 genetically tested patients, and each clinical percentage uses its own available-data denominator.

  No disease-specific GeneReviews chapter was identified. CLCN7-Related Osteopetrosis (PMID:20301306) and TCIRG1-Related Osteopetrosis (PMID:40875877) concern different diseases and are not transferred as care guidelines for LRP5 HBM. Lrp5 loss-of-function models alone represent the opposite skeletal mechanism.'

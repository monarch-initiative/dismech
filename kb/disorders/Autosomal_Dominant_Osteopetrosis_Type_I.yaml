- name: Enhanced Canonical Wnt Signaling in Bone-Forming Cells
  biological_scale: CELLULAR
  description: LRP5 HBM variants can enhance canonical Wnt signaling by reducing inhibition by sclerostin and, variably, DKK1. This does not imply complete loss of feedback or constitutive ligand-independent signaling. Homozygous G171V and A214V mice resisted many skeletal effects of SOST overexpression, but some architectural responses remained; A214V was more responsive to DKK1 than G171V. In conditional mice, neither allele rescued severe osteopenia caused by Wls deletion in late osteoblasts/osteocytes, limiting a proposed autonomous intracellular-signaling explanation.

diagnosis:
- name: Skeletal survey and bone densitometry
  description: >
    Plain radiographs show generalized osteosclerosis maximal at the cranial vault;
    DEXA confirms elevated bone mineral density. Radiology alone cannot separate
    ADO1 from ADO2 reliably, which is why molecular confirmation matters.
  evidence:
  - reference: PMID:37659026
    reference_title: "LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dual-energy X-ray absorptiometry (DEXA) scan revealed elevated bone mass.
    explanation: DEXA is the densitometric confirmation step used in the reported workup.
- name: LRP5 sequencing
  description: >
    Targeted sequencing of the LRP5 first beta-propeller region establishes the
    diagnosis and separates ADO1 from the CLCN7-related ADO2, which has a materially
    different prognosis.
  evidence:
  - reference: PMID:37659026
    reference_title: "LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis and appropriate denomination of LRP5 HBM are fundamental for
      diagnosis and to mitigate the confusion that has long characterized this
      disease.
    explanation: States that molecular analysis is central to establishing this diagnosis.
differential_diagnoses:
- name: Autosomal dominant osteopetrosis type II (Albers-Schonberg disease)
  description: >
    The principal differential and the one that matters clinically. ADO2 is caused
    by dominant-negative CLCN7 variants and fails at resorption, so it carries
    recurrent fractures, mandibular osteomyelitis and cranial nerve compression. The
    absence of an increased fracture rate is the discriminating feature.
  evidence:
  - reference: PMID:12054167
    reference_title: "Localization of the gene causing autosomal dominant osteopetrosis type I to chromosome 11q12-13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ADOI is the only type of osteopetrosis not associated with an increased
      fracture rate.
    explanation: >-
      The fracture-rate contrast is the stated discriminator between ADO1 and the
      other osteopetroses.
- name: Sclerosteosis and van Buchem disease
  description: >
    Both are caused by loss of SOST, the gene encoding sclerostin, the LRP5
    inhibitor whose binding site the ADO1 variants disrupt. They therefore sit on
    the same molecular axis approached from the ligand side, and produce a
    comparable high-bone-mass picture.
  evidence:
  - reference: PMID:18328982
    reference_title: "Sclerosing bone disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other less common recessive or dominant sclerosing disorders, such as
      endosteal hyperostosis, sclerostosis, van Buchen disease and high bone mass
      syndrome, are due to mutations in two genes (LRP5 and SOST) of the Wnt
      pathway that induce increased osteoblast activity.
    explanation: Groups the SOST and LRP5 disorders as the same Wnt-axis differential.
- name: Osteoporosis-pseudoglioma syndrome
  description: >
    The allelic opposite. Loss-of-function LRP5 variants give recessive low bone
    mass with blindness. Its existence is the strongest argument that the ADO1
    alleles act by gain of function rather than by haploinsufficiency.
  evidence:
  - reference: PMID:12579474
    reference_title: "Six novel missense mutations in the LDL receptor-related protein 5 (LRP5) gene in different conditions with an increased bone density."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The LDL receptor-related protein 5 (LRP5) gene has been shown to be involved
      in both osteoporosis-pseudoglioma syndrome and the high-bone-mass phenotype
      and turned out to be an important regulator of peak bone mass in vertebrates.
    explanation: >-
      Establishes the allelic relationship between the low- and high-bone-mass LRP5
      disorders.
animal_models:
- name: Lrp5 p.G171V knock-in mouse
  species: Mouse
  genotype: Lrp5 p.G171V knocked into the endogenous mouse Lrp5 locus
  publication: PMID:25808845
  description: >
    The human HBM allele knocked into the mouse locus, so the receptor is expressed
    at endogenous level and dose. Its value is not that it makes bone dense but that
    it lets the escape-from-inhibition mechanism be tested directly: the mouse is
    challenged with overexpressed sclerostin and asked whether bone still responds.
  modeled_mechanisms:
  - target: LRP5 First Beta-Propeller Missense Substitution
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >
      Carries the orthologous substitution at the endogenous locus, and reproduces
      the defining property of the human allele, resistance to sclerostin.
    limitations: >-
      The mouse reproduces the bone-mass and inhibitor-resistance phenotype but not
      the skull-base cranial-nerve compression that causes most human morbidity, so
      it is uninformative about the clinical end of this entry's pathograph.
    readouts:
    - name: Bone response to osteocytic SOST overexpression
      target: LRP5 First Beta-Propeller Missense Substitution
      direction: UNCHANGED
      interpretation: >-
        Sclerostin overexpression suppressed BMD, BMC, BV/TV and bone-formation rate
        in wild-type mice but left the p.G171V mice unchanged, which is the assay
        readout of inhibitor resistance.
      evidence:
      - reference: PMID:25808845
        reference_title: "High Bone Mass-Causing Mutant LRP5 Receptors Are Resistant to Endogenous Inhibitors In Vivo."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We observed that the (8kb) Dmp1-SOST transgene significantly lowered
          whole-body bone mineral density (BMD), bone mineral content (BMC), femoral
          and vertebral trabecular bone volume fraction (BV/TV), and periosteal
          bone-formation rate (BFR) in wild-type mice but not in mice with Lrp5
          p.G171V and p.A214V alleles.
        explanation: States the measured non-response of the HBM alleles to sclerostin.
    evidence:
    - reference: PMID:25808845
      reference_title: "High Bone Mass-Causing Mutant LRP5 Receptors Are Resistant to Endogenous Inhibitors In Vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We previously reported the creation of two Lrp5 HBM knock-in mouse models, in
        which the human p.A214V or p.G171V missense mutations were knocked into the
        endogenous Lrp5 locus.
      explanation: >-
        Establishes that these are knock-ins of the human disease alleles at the
        endogenous locus, which is what makes them informative for this node.
- name: Lrp5 p.A214V knock-in mouse
  species: Mouse
  genotype: Lrp5 p.A214V knocked into the endogenous mouse Lrp5 locus
  publication: PMID:25808845
  description: >
    The second HBM knock-in. It is worth listing separately from p.G171V because the
    two alleles behave differently under DKK1 challenge, which is evidence that the
    substitutions are not interchangeable even though both cause high bone mass.
  modeled_mechanisms:
  - target: LRP5 First Beta-Propeller Missense Substitution
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >
      Reproduces sclerostin resistance, but is more sensitive to DKK1 than the
      p.G171V allele, so it models the human substitution class rather than a single
      uniform escape mechanism.
    limitations: >-
      DKK1 sensitivity differs between the two HBM alleles, so this model does not
      support a claim that all first-beta-propeller substitutions escape both
      inhibitors equally. As with p.G171V it does not model the cranial morbidity.
    evidence:
    - reference: PMID:25808845
      reference_title: "High Bone Mass-Causing Mutant LRP5 Receptors Are Resistant to Endogenous Inhibitors In Vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The (2.3kb) Col1a1-Dkk1 transgene significantly lowered whole-body BMD, BMC,
        and vertebral BV/TV in wild-type mice and affected p.A214V mice more than
        p.G171V mice.
      explanation: >-
        Documents the allele-specific difference in DKK1 sensitivity that limits how
        far this model generalises.
discussions:
- discussion_id: ado1_osteoclast_link_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the reduced osteoclast number in ADO1 caused by altered osteoblastic support
    of osteoclastogenesis, as the authors speculate, or by a separate consequence of
    Wnt pathway activation?
  attaches_to:
  - pathophysiology#Reduced Osteoclast Number and Resorptive Response
  rationale: >
    The only direct evidence on this link is a stated speculation in the discussion
    of the single study that measured it. The measurements themselves are solid:
    ADO1 osteoclasts are normal in vitro and reduced in vivo, so the cause is
    external to the osteoclast. What is not established is which external signal.
    RANKL/OPG ratios were not measured in these patients, and no ADO1 mouse model
    carrying a first-beta-propeller LRP5 substitution was identified in the sources
    cited here to test it. The edge is real; its mechanism is assumed.
- discussion_id: ado1_neuro_ascertainment_bias
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the 19.4% neurological involvement figure reflect the true rate, or
    ascertainment bias in a literature assembled from case reports?
  attaches_to:
  - pathophysiology#Cranial Foramina Narrowing
  rationale: >
    The figure comes from pooling published cases across a century of shifting
    nomenclature, and symptomatic patients are far more likely to be published than
    the asymptomatic carriers found incidentally on DEXA. The review itself notes
    that neurological manifestations were previously considered absent, which shows
    how much the estimate has moved with ascertainment. A population-based or
    family-based series would be needed to fix the rate.
treatments:
- name: Clinical surveillance
  description: >
    There is no disease-modifying therapy. Management is periodic assessment of
    hearing and cranial nerve function, since the morbidity that does occur comes
    from foraminal narrowing and is otherwise silent until established.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Left without treatment-level evidence deliberately. No trial, cohort or case
    series of any intervention in ADO1 was found in the sources cited by this entry,
    and citing a general osteopetrosis management statement here would attribute to
    ADO1 a therapeutic claim made about the resorption-failure forms, whose problem
    is the opposite one.
notes: >
  On naming. The MONDO term for this entry is "autosomal dominant osteopetrosis 1",
  and the entry is filed under it, but the name is now regarded as a misnomer in the
  clinical literature. The disorder is a bone-formation disease, not a
  bone-resorption disease, and the identification of LRP5 gain of function prompted
  a formal reclassification of ADO1 out of osteopetrosis and into the high-bone-mass
  group (PMID:20855225). The 2023 historical review argues for "LRP5 high bone mass"
  as the correct designation (PMID:37659026). Both names are carried in synonyms so
  that either search finds the entry.

  On the boundary with the LRP5 high-bone-mass literature. ADO1, Worth-type
  endosteal hyperostosis, autosomal dominant osteosclerosis and the high bone mass
  trait were described separately and later shown to be the same LRP5 disorder.
  This entry treats them as one disease, which is why evidence from papers using the
  other names is cited here. That decision follows the reclassification review
  rather than MONDO, which still keeps some of these as distinct terms.

  On what is deliberately absent. There is no datasets block: no expression or omics
  dataset specific to ADO1 was identified, and a search on the LRP5 gene symbol
  alone would return the osteoporosis and FEVR literature, which is the Named Entity
  Confusion trap. The widely used Lrp5 knockout is deliberately not listed as a
  model: it reproduces the allelic loss-of-function disease with the opposite bone
  phenotype, so it bounds the direction of effect but does not model this disease.

  On the prevalence figure. The only population estimate available, 5.5/100,000 from
  Funen County, is for autosomal dominant osteopetrosis as a whole in a 1986 survey
  that predates both the type I/type II radiological split and the identification of
  LRP5. Since the common dominant form is CLCN7-related type II, most of that figure
  is not this disease. It is recorded as an upper bound with that caveat stated in
  the record's own notes, and a deep-research report that presented it as an ADO1
  prevalence was not followed on this point.

name: Autosomal Dominant Osteopetrosis Type I
creation_date: '2026-09-06T15:45:00Z'
category: Mendelian
description: >
  Autosomal dominant osteopetrosis type I (ADO1), now more accurately called LRP5
  high bone mass (LRP5 HBM) or Worth-type endosteal hyperostosis, is a sclerosing
  bone disorder caused by heterozygous gain-of-function missense variants in LRP5.
  It is mechanistically the inverse of the other osteopetroses. Classical
  osteopetrosis is a failure of osteoclastic bone resorption; ADO1 is an excess of
  osteoblastic bone formation. The causal variants cluster in the first
  beta-propeller of the LRP5 extracellular domain, the surface through which the
  secreted antagonists sclerostin and DKK1 normally restrain the receptor. Escaping
  that inhibition leaves canonical Wnt/beta-catenin signalling in osteoblasts
  constitutively elevated, and bone is laid down faster than it is removed.

  The clinical consequence of that mechanism is the feature that distinguishes ADO1
  from every other osteopetrosis: the bone is dense and also structurally sound, so
  there is no increased fracture rate, no marrow failure and no extramedullary
  haematopoiesis. Many carriers are asymptomatic and are found incidentally on a
  bone density scan. Where disease does declare itself it is largely a consequence
  of skull vault thickening narrowing the cranial foramina, giving hearing loss,
  headache and anosmia.

  Because of this mechanism the disorder was formally reclassified out of the
  osteopetrosis group and into the high-bone-mass diseases, and the literature is
  correspondingly scattered across the names "autosomal dominant osteosclerosis",
  "Worth disease", "endosteal hyperostosis" and "osteopetrosis type I". The entry
  is filed under the MONDO term for ADO1 but the description, synonyms and notes
  record the preferred modern designation.
synonyms:
- autosomal dominant osteopetrosis type 1
- osteopetrosis, autosomal dominant, type 1
- OPTA1
- LRP5 high bone mass
- LRP5 HBM
- Worth disease
- Worth-type autosomal dominant endosteal hyperostosis
- autosomal dominant osteosclerosis
- LRP5 osteopetrosis

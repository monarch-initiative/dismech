name: Autosomal Dominant Osteopetrosis Type I
creation_date: '2026-09-06T15:45:00Z'
category: Mendelian
description: 'Autosomal dominant osteopetrosis type I (ADO1), commonly called LRP5 high bone mass or Worth-type endosteal hyperostosis, is an inherited sclerosing bone disorder associated with heterozygous activating LRP5 variants. Many established alleles affect the first extracellular beta-propeller and reduce inhibition by sclerostin or DKK1, enhancing Wnt-dependent bone accrual. The spectrum includes in-frame insertions, and a cytoplasmic variant has been reported without functional confirmation. Inhibitor resistance and effects on bone surfaces vary by allele; the evidence does not establish universal ligand-independent receptor activation. Increased formation and, in some genotypes, reduced resorptive responses contribute to the phenotype.

  Skull and long-bone cortical thickening, high bone mineral density, mandibular enlargement and palatal tori are characteristic. Many individuals have few symptoms. Cranial nerve compression, posterior fossa crowding and intracranial hypertension can cause substantial morbidity, sometimes beginning in childhood. Unlike classical resorption-defect osteopetrosis, increased fracture susceptibility and marrow failure are not characteristic, although fractures have been reported. The modern high-bone-mass designation distinguishes the biology while preserving the historical MONDO ADO1 identity.'

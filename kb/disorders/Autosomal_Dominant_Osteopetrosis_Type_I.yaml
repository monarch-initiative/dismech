      snippet: >-
        The patients are often asymptomatic but some suffer from pain and hearing
        loss.
      explanation: >-
        Names hearing loss as a symptomatic consequence in a minority of ADO1
        patients.
  - target: Headache
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37659026
      reference_title: "LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A 44-year-old Caucasian woman with torus palatinus complained of headache,

  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This results in a massive release of proinflammatory cytokines, with
      clinical signs, such as capillary leakage, arterial hypotension, organ
      failure, and coagulation activation, usually being reported in this setting
    explanation: >-
      Links cytokine release directly to capillary leakage and arterial
      hypotension.
  - reference: PMID:29229737
    reference_title: "The Superantigen Toxic Shock Syndrome Toxin 1 Alters Human Aortic Endothelial Cell Function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TSST-1-mediated activation results in increased monolayer permeability and
      defects in vascular reendothelialization.
    explanation: >-
      Human aortic endothelial cell experiments showing the superantigen itself
      increases endothelial permeability.
- name: Distributive Shock and Multi-Organ Dysfunction
  description: >-
    Refractory hypotension with tissue hypoperfusion, together with direct
    cytokine-mediated injury and coagulation activation, produces the
    multisystem failure that defines the syndrome.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Hypotension
    description: >-
      Distributive shock is recorded clinically as acute hypotension.
    causal_link_type: DIRECT
  - target: Acute Kidney Injury
    description: >-
      Reduced perfusion of vital organs during shock contributes to renal
      dysfunction.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Confusion
    description: >-
      Shock and systemic inflammation can present as central nervous system
      dysfunction without focal neurologic deficits.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:19393958
    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Toxic shock syndrome (TSS) is an acute, multi-system, toxin-mediated
      illness, often resulting in multi-organ failure.
    explanation: >-
      Supports multi-organ failure as the terminal manifestation of the
      toxin-mediated cascade.
- name: Bacterial Ribosomal Translation (Clindamycin/Linezolid Target)
  description: >-
    S. aureus depends on 70S-ribosome translation. Clindamycin and linezolid bind
    the 50S subunit and arrest bacterial protein synthesis; in staphylococcal TSS
    this target is pursued to suppress the translated superantigen products.
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:19393958
    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific therapy focuses on early identification of the illness, source
      control, and administration on antimicrobial agents including drugs capable
      of suppressing toxin production (eg, clindamycin, linezolid).
    explanation: >-
      Identifies clindamycin and linezolid, both ribosome-targeting protein
      synthesis inhibitors, as toxin-suppressing agents used in TSS therapy.
- name: Suppression of Superantigen Synthesis by Protein-Synthesis Inhibitors
  description: >-
    Because TSST-1 and staphylococcal enterotoxins are secreted proteins, a
    ribosome-targeting antibiotic suppresses their production independently of
    bacterial killing. This antitoxin rationale is why clindamycin or linezolid
    is paired with bactericidal therapy in toxic shock syndrome.
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Suppression of Toxin and Exoprotein Synthesis"
  biological_processes:
  - preferred_term: translation
    modifier: DECREASED
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:19393958
    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific therapy focuses on early identification of the illness, source
      control, and administration on antimicrobial agents including drugs capable
      of suppressing toxin production (eg, clindamycin, linezolid).
    explanation: >-
      Explicitly frames clindamycin and linezolid as agents capable of
      suppressing toxin production.
- name: Bacterial Peptidoglycan Cross-Linking (Beta-Lactam Target)
  description: >-
    Methicillin-susceptible S. aureus builds its peptidoglycan cell wall by
    penicillin-binding protein transpeptidase cross-linking. Antistaphylococcal
    beta-lactams or cefazolin acylate the PBP active site, halt cross-linking,
    and provide the bactericidal arm of therapy; methicillin-resistant strains
    express an altered PBP and require vancomycin or linezolid instead.
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  biological_processes:
  - preferred_term: peptidoglycan-based cell wall biogenesis
    term:
      id: GO:0009273
      label: peptidoglycan-based cell wall biogenesis
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management of TSS is a medical emergency and relies on early detection,
      immediate resuscitation, source control and eradication of toxin
      production, bactericidal antibiotic treatment, and protein synthesis
      inhibiting antibiotic administration.
    explanation: >-
      Establishes bactericidal antibiotic treatment as a distinct required
      component of TSS management.

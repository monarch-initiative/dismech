name: Staphylococcal Toxic Shock Syndrome
creation_date: "2026-09-25T13:33:49Z"
updated_date: "2026-09-25T13:33:49Z"
category: Infectious Disease
description: >-
  Staphylococcal toxic shock syndrome is the Staphylococcus aureus arm of toxic
  shock syndrome: a toxigenic S. aureus strain colonizes or infects a mucosal,
  wound, postpartum, or device-associated focus and secretes toxic shock
  syndrome toxin-1 or staphylococcal enterotoxins. Those superantigens
  cross-link MHC class II to selected T-cell receptor Vbeta chains, activate a
  large fraction of the T-cell repertoire, and trigger cytokine-driven capillary
  leak, hypotension, and multisystem organ dysfunction in hosts without
  sufficient neutralizing antitoxin.

  description: >-
    Superantigen-producing S. aureus strains cause staphylococcal toxic shock
    syndrome, often by colonizing a mucosal or wound surface while secreted
    toxins act systemically.
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Toxic shock syndrome (TSS) is a rare, life-threatening, toxin-mediated
      infectious process linked, in the vast majority of cases, to

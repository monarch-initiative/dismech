    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Conjunctival Hyperemia
    description: >-
      Superantigen-driven inflammation involves mucosal surfaces, including the
      conjunctivae.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Vomiting
    description: >-
      Superantigen-driven systemic illness includes acute gastrointestinal

    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: regulation of vascular permeability
    modifier: INCREASED
    term:
      id: GO:0043114
      label: regulation of vascular permeability
  downstream:
  - target: Distributive Shock and Multi-Organ Dysfunction
    description: >-
      Capillary leak plus cytokine-mediated vasodilation produces refractory

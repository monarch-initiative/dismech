genetic:
- name: HLA-DRB1
  association: >-
    HLA class II genotype is the best-characterized human genetic modifier of
    TSST-1 susceptibility. It does not cause disease directly; it sets the
    magnitude of the anti-TSST-1 antibody response, and therefore whether a host
    can neutralize the superantigen on exposure. HLA-DRB1*03:01 is positively
    associated with anti-TSST-1 antibody levels, whereas HLA-DRB1*01:01 is
    negatively associated.
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:37731490
    reference_title: "Toxin exposure and HLA alleles determine serum antibody binding to toxic shock syndrome toxin 1 (TSST-1) of Staphylococcus aureus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, the anti-TSST-1 antibody levels were strongly associated with HLA
      class II gene loci.
    explanation: >-
      Genome-wide association analysis in 976 population-based participants
      showing HLA class II loci govern the anti-TSST-1 antibody response.
- name: HLA-DQB1
  association: >-
    HLA-DQB1*02:01 is positively and HLA-DQB1*05:01 negatively associated with
    anti-TSST-1 antibody levels, acting with HLA-DRB1 as a susceptibility
    modifier through the humoral antitoxin response.
  gene_term:
    preferred_term: HLA-DQB1
    term:
      id: hgnc:4944
      label: HLA-DQB1
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:37731490
    reference_title: "Toxin exposure and HLA alleles determine serum antibody binding to toxic shock syndrome toxin 1 (TSST-1) of Staphylococcus aureus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, the anti-TSST-1 antibody levels were strongly associated with HLA
      class II gene loci.
    explanation: >-
      Genome-wide association analysis in 976 population-based participants
      identifying HLA class II loci, including HLA-DQB1, as determinants of the
      protective antibody response.
definitions:
- name: CDC clinical case definition for staphylococcal toxic shock syndrome
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The US Centers for Disease Control and Prevention case definition for
    staphylococcal TSS requires fever, a diffuse macular erythroderma,
    desquamation one to two weeks after rash onset, hypotension, and involvement
    of at least three organ systems from the gastrointestinal, muscular,
    mucous-membrane, renal, hepatic, hematologic, and central nervous system
    categories.
  evidence:
  - reference: PMID:31151811
    reference_title: "Menstrual toxic shock syndrome: case report and systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis was confirmed by fulfilment of the clinical criteria
      outlined by the US Centers for Disease Control and Prevention (CDC; fever,
      rash, desquamation, hypotension, and multi-system involvement)
    explanation: >-
      Enumerates the five CDC clinical criteria that constitute this case
      definition.
diagnosis:
- name: Culture of the suspected focus and sterile sites
  description: >-
    Wound, mucosal-site, device-associated, and blood cultures are obtained. In
    staphylococcal TSS, blood cultures are often negative because the organism
    can remain at a colonized surface while the toxin acts systemically.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Isolation of a superantigen-producing Staphylococcus aureus strain in a
    compatible clinical syndrome.
  evidence:
  - reference: PMID:31151811
    reference_title: "Menstrual toxic shock syndrome: case report and systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      as well as a nasal swab positive for the S aureus strain and presence of
      the gene encoding for toxic shock syndrome toxin 1 (TSST-1).
    explanation: >-
      Illustrates microbiological confirmation by recovery of the organism
      together with demonstration of the TSST-1 toxin gene.
treatments:
- name: Source control
  description: >-
    Immediate removal of the inciting focus: withdrawal of a retained tampon,
    nasal packing, or other foreign body and drainage or debridement of a
    staphylococcal wound focus when present.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: TSST-1 and Staphylococcal Enterotoxin Production
    description: >-
      Removing the colonized device or wound focus eliminates the niche in which
      S. aureus is producing superantigen.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        source control and eradication of toxin production
      explanation: >-
        Pairs source control directly with eradication of toxin production.
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management of TSS is a medical emergency and relies on early detection,
      immediate resuscitation, source control and eradication of toxin
      production, bactericidal antibiotic treatment, and protein synthesis
      inhibiting antibiotic administration.
    explanation: >-
      Lists source control and eradication of toxin production as core
      components of emergency TSS management.
- name: Anti-staphylococcal bactericidal antibiotic therapy
  description: >-
    A bactericidal agent directed at S. aureus, usually an antistaphylococcal
    penicillin or cefazolin for methicillin-susceptible strains, with vancomycin
    or linezolid used when methicillin resistance is present or suspected.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: vancomycin
      term:
        id: CHEBI:28001
        label: vancomycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Bacterial Peptidoglycan Cross-Linking (Beta-Lactam Target)
    description: >-
      Anti-staphylococcal beta-lactams acylate penicillin-binding protein
      transpeptidases and halt peptidoglycan cross-linking, killing the
      organism.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Management of TSS is a medical emergency and relies on early detection,
        immediate resuscitation, source control and eradication of toxin
        production, bactericidal antibiotic treatment, and protein synthesis
        inhibiting antibiotic administration.
      explanation: >-
        Establishes bactericidal antibiotic therapy as a component of TSS
        management.
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management of TSS is a medical emergency and relies on early detection,
      immediate resuscitation, source control and eradication of toxin
      production, bactericidal antibiotic treatment, and protein synthesis
      inhibiting antibiotic administration.
    explanation: >-
      Establishes bactericidal antibiotic therapy as a required, distinct
      component of TSS management.
- name: Adjunctive protein-synthesis-inhibiting antibiotic therapy
  description: >-
    Clindamycin, or linezolid where clindamycin cannot be used, is added to the
    bactericidal agent specifically to suppress superantigen synthesis.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: clindamycin
      term:
        id: CHEBI:3745
        label: clindamycin
    - preferred_term: linezolid
      term:
        id: CHEBI:63607
        label: linezolid
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Bacterial Ribosomal Translation (Clindamycin/Linezolid Target)
    description: >-
      Clindamycin and linezolid bind the 50S ribosomal subunit and arrest
      bacterial protein synthesis.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        protein synthesis inhibiting antibiotic administration
      explanation: >-
        Names protein-synthesis inhibition as the therapeutic action.
  - target: Suppression of Superantigen Synthesis by Protein-Synthesis Inhibitors
    description: >-
      Arresting translation suppresses production of the secreted superantigen
      driving the syndrome, independently of bacterial killing.
    evidence:
    - reference: PMID:19393958
      reference_title: "Gram-positive toxic shock syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        drugs capable of suppressing toxin production (eg, clindamycin,
        linezolid)
      explanation: >-
        Names clindamycin and linezolid specifically as toxin-production
        suppressing drugs.
  evidence:
  - reference: PMID:19393958
    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific therapy focuses on early identification of the illness, source
      control, and administration on antimicrobial agents including drugs capable
      of suppressing toxin production (eg, clindamycin, linezolid).
    explanation: >-
      Names clindamycin and linezolid as the toxin-suppressing agents used in
      TSS.

  - reference: PMID:33477467
    reference_title: "Toxic Shock Syndrome Toxin 1 Induces Immune Response via the Activation of NLRP3 Inflammasome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      rTSST-1 significantly induced interleukin-1β (IL-1β) and tumor necrosis
      factor-α (TNF-α) production in mouse macrophages and the production was
      dose-dependent
    explanation: >-
      Macrophage stimulation experiments showing that TSST-1 dose-dependently
      induces IL-1beta and TNF-alpha.
- name: Endothelial Injury and Capillary Leak
  description: >-
    Cytokine-driven endothelial activation, compounded by direct TSST-1 action
    on endothelial cells, increases monolayer permeability and extravasates
    plasma into the interstitium, reducing effective intravascular volume.
  biological_scale: TISSUE
  cell_types:

pathophysiology:
- name: Absent or Low Neutralizing Antitoxin Antibody
  description: >-
    Most adults acquire neutralizing antibody to TSST-1 through subclinical
    colonization. Individuals who lack such antibody at the time of toxin
    exposure cannot neutralize the superantigen, and this deficit is the
    principal recognized host susceptibility determinant for staphylococcal TSS.
    Antibody levels are strongly determined by both colonization-driven toxin
    exposure and HLA class II genotype.
  biological_scale: ORGANISM
  role: susceptibility_factor
  biological_processes:
  - preferred_term: humoral immune response
    modifier: DECREASED
    term:
      id: GO:0006959
      label: humoral immune response
  downstream:
  - target: TSST-1 and Staphylococcal Enterotoxin Production
    description: >-
      Without neutralizing antitoxin, secreted TSST-1 or enterotoxin reaches its
      host receptors and initiates the superantigen cascade.
    evidence:
    - reference: PMID:6491377
      reference_title: "Antibody responses to toxic-shock-syndrome (TSS) toxin by patients with TSS and by healthy staphylococcal carriers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The data suggest that absence of antibodies to the TSS toxin may be a
        predisposing factor in the development of clinical disease.
      explanation: >-
        Supports the predisposing direction of this edge: lacking antitoxin is
        what permits secreted staphylococcal superantigen to produce clinical
        disease.
  evidence:
  - reference: PMID:6491377
    reference_title: "Antibody responses to toxic-shock-syndrome (TSS) toxin by patients with TSS and by healthy staphylococcal carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The data suggest that absence of antibodies to the TSS toxin may be a
      predisposing factor in the development of clinical disease.
    explanation: >-
      Case-control serology showing antitoxin levels are significantly lower in
      women with TSS than in controls, supporting absent antibody as a
      predisposing host factor.
  - reference: PMID:37731490
    reference_title: "Toxin exposure and HLA alleles determine serum antibody binding to toxic shock syndrome toxin 1 (TSST-1) of Staphylococcus aureus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A well-known risk factor is the lack of neutralizing antibodies.
    explanation: >-
      Population-based study confirming lack of neutralizing antibody as the
      recognized risk factor this node represents.
  - reference: PMID:20036064
    reference_title: "Toxic shock syndrome toxin-1 (TSST-1) antibody levels in Japanese children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children are at risk of developing staphylococcal toxic shock syndrome when
      their immune system is immature and they have no protective circulating
      anti-TSS antibodies.
    explanation: >-
      Age-stratified serology showing risk tracks the absence of circulating
      antitoxin.
- name: TSST-1 and Staphylococcal Enterotoxin Production
  description: >-
    Toxigenic S. aureus secretes superantigen exotoxins at the colonized or
    infected site. Toxic shock syndrome toxin-1 is responsible for nearly all
    menstrual cases and more than half of non-menstrual cases, while
    staphylococcal enterotoxins account for a smaller share of disease.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    modifier: ABNORMAL
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: Superantigen-Mediated MHC Class II and TCR Vbeta Cross-Linking
    description: >-
      Secreted staphylococcal superantigens reach antigen-presenting cells and
      T cells at the primary site and systemically.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Superantigenic exotoxins are able to induce unconventional activation of
        T cells by antigen-presenting cells (APCs).
      explanation: >-
        States that the secreted exotoxins act by engaging antigen-presenting
        cells and T cells, the transition this edge encodes.
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main described superantigenic exotoxins are toxic shock syndrome
      toxin-1 (TSST-1) and enterotoxins for Staphylococcus aureus and
      Streptococcal pyrogenic exotoxins (SpE) A, B, and C and streptococcal
      superantigen A (SsA) for Streptococcus pyogenes.
    explanation: >-
      Enumerates TSST-1 and staphylococcal enterotoxins as the S. aureus
      superantigens that drive staphylococcal toxic shock syndrome.
  - reference: clinicaltrials:NCT02340338
    reference_title: "Phase 1 Clinical Trial of the BioMed rTSST-1 Variant Vaccine in Healthy Adults"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Toxic shock syndrome toxin (TSST-1) being responsible for almost all of
      menstruation associated and more than 50% of all other cases.
    explanation: >-
      Quantifies why TSST-1 is the dominant staphylococcal superantigen target.
- name: Superantigen-Mediated MHC Class II and TCR Vbeta Cross-Linking
  description: >-
    The superantigen binds MHC class II on antigen-presenting cells outside the
    conventional peptide-binding groove and simultaneously engages the variable
    beta domain of the T-cell receptor. This bridges the two cells without
    antigen processing or MHC restriction, so activation is determined by Vbeta
    usage rather than antigen specificity.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: professional antigen presenting cell
    term:
      id: CL:0000145
      label: professional antigen presenting cell
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  cellular_components:
  - preferred_term: MHC class II protein complex
    term:
      id: GO:0042613
      label: MHC class II protein complex
  downstream:
  - target: Massive Polyclonal T Cell Activation
    description: >-
      Cross-linking delivers an activating signal to every T cell carrying a
      responsive Vbeta element.
    evidence:
    - reference: PMID:19393958
      reference_title: "Gram-positive toxic shock syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        TSS results from the ability of bacterial toxins to act as superantigens,
        stimulating immune-cell expansion and rampant cytokine expression in a
        manner that bypasses normal MHC-restricted antigen processing.
      explanation: >-
        Links non-MHC-restricted superantigen activity directly to immune-cell
        expansion.
  evidence:
  - reference: PMID:19393958
    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TSS results from the ability of bacterial toxins to act as superantigens,
      stimulating immune-cell expansion and rampant cytokine expression in a
      manner that bypasses normal MHC-restricted antigen processing.
    explanation: >-
      States the defining superantigen property this node represents:
      activation that bypasses conventional MHC-restricted antigen processing.
- name: Massive Polyclonal T Cell Activation
  description: >-
    Because activation is Vbeta-restricted rather than antigen-specific, a large
    fraction of the circulating T-cell repertoire is activated simultaneously.
    TSST-1 mutational analysis in rabbits shows that T-cell activation is
    required for downstream toxicity, not merely correlated with it.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: T cell activation
    modifier: INCREASED
    term:
      id: GO:0042110
      label: T cell activation
  downstream:
  - target: Systemic Cytokine Storm
    description: >-
      Activated T cells and accessory macrophages release proinflammatory
      cytokines.
    evidence:
    - reference: PMID:19393958
      reference_title: "Gram-positive toxic shock syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A repetitive cycle of cell stimulation and cytokine release results in a
        cytokine avalanche that causes tissue damage, disseminated intravascular
        coagulation, and organ dysfunction.
      explanation: >-
        Describes activated-cell stimulation feeding forward into the cytokine
        cascade.
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bacterial superantigenic exotoxins induces unconventional polyclonal
      lymphocyte activation, which leads to rapid shock, multiple organ failure
      syndrome, and death.
    explanation: >-
      Directly supports unconventional polyclonal lymphocyte activation as the
      step linking superantigen exposure to shock and organ failure.
  - reference: PMID:22069685
    reference_title: "Staphylococcal superantigen (TSST-1) mutant analysis reveals that t cell activation is required for biological effects in the rabbit including the cytokine storm."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report that the mutant G31R induced all the biological effects of
      the wild type sAg, while the mutant with non-functional TCR binding did not
      retain any of the toxic effects, proving the pivotal role of T cells in
      this system.
    explanation: >-
      Rabbit TSST-1 mutant analysis showing that abolishing T-cell receptor
      binding abolishes toxicity.
- name: Systemic Cytokine Storm
  description: >-
    Simultaneous activation of T cells and antigen-presenting cells produces an
    overwhelming release of proinflammatory cytokines including TNF, IL-1beta,
    IL-2, and IFN-gamma. This mediator burst, rather than bacterial invasion
    itself, produces the systemic illness.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: cytokine production
    modifier: INCREASED
    term:
      id: GO:0001816
      label: cytokine production
  - preferred_term: tumor necrosis factor production
    modifier: INCREASED
    term:
      id: GO:0032640
      label: tumor necrosis factor production
  - preferred_term: interleukin-1 beta production
    modifier: INCREASED
    term:
      id: GO:0032611
      label: interleukin-1 beta production
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Fever
    description: >-
      The cytokine storm manifests clinically as acute fever.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Diffuse Macular Erythroderma
    description: >-
      Systemic inflammatory signaling produces the diffuse macular erythroderma
      counted in the case definition.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Palmoplantar Desquamation
    description: >-
      Diffuse cutaneous inflammation is followed in convalescence by

    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Endothelial Injury and Capillary Leak
    description: >-
      Circulating cytokines act on vascular endothelium to increase
      permeability.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This results in a massive release of proinflammatory cytokines, with
        clinical signs, such as capillary leakage, arterial hypotension, organ
        failure, and coagulation activation, usually being reported in this
        setting
      explanation: >-
        Places capillary leakage downstream of the proinflammatory cytokine
        release.
  evidence:
  - reference: PMID:19393958
    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A repetitive cycle of cell stimulation and cytokine release results in a
      cytokine avalanche that causes tissue damage, disseminated intravascular
      coagulation, and organ dysfunction.
    explanation: >-
      Describes the self-amplifying cytokine cascade and links it to tissue

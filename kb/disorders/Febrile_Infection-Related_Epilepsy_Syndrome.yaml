discussions:
- discussion_id: fires-il1-early-immunotherapy-window
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Innate Neuroinflammatory Activation"
  - "pathophysiology#Super-Refractory Status Epilepticus"
  prompt: >-
    FIRES is hypothesized to be driven by an IL-1-beta/IL-6 innate-immune
    cytokine surge, and anakinra/tocilizumab appear more effective when started
    early. Does early, mechanism-targeted cytokine blockade (versus escalating
    anesthetics and later immunotherapy) shorten the super-refractory status
    epilepticus and improve chronic-phase epilepsy and cognitive outcome?
  rationale: >-
    The cytokinopathy model predicts that early IL-1/IL-6 blockade should
    interrupt the cascade before irreversible neuronal injury, but the evidence is
    largely from case series and retrospective cohorts, and the optimal timing and
    agent remain unestablished.
  evidence:
  - reference: PMID:27770579
    reference_title: "Febrile infection-related epilepsy syndrome treated with anakinra."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebral spinal fluid analysis revealed elevated levels of proinflammatory cytokines before treatment that normalized on anakinra, suggesting a potential pathogenic role for neuroinflammation in FIRES"
    explanation: >-
      Cytokine normalization on anakinra motivates testing early
      mechanism-targeted cytokine blockade against outcome.
  proposed_experiments:
  - experiment_id: fires-early-cytokine-blockade-trial
    name: Early cytokine-blockade timing trial in FIRES
    description: >-
      In a multicenter FIRES registry/trial, compare time-to-resolution of
      super-refractory status epilepticus and chronic-phase seizure/cognitive
      outcomes by time from onset to initiation of IL-1/IL-6-targeted therapy.
    readouts:
    - name: Status-epilepticus duration and chronic outcome versus time-to-cytokine-blockade
      target: "pathophysiology#Super-Refractory Status Epilepticus"
    would_support:
    - "pathophysiology#Innate Neuroinflammatory Activation"
- discussion_id: fires-genetic-susceptibility
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Innate Neuroinflammatory Activation"
  prompt: >-
    Why does a common febrile illness trigger catastrophic FIRES in a previously
    healthy child? Is there an underlying genetic predisposition of the innate
    immune response (e.g., in the IL-1 pathway or other inflammasome/cytokine
    genes) that determines susceptibility?
  rationale: >-
    FIRES strikes previously healthy children without an identified pathogen or
    classic autoimmune antibody, suggesting a host-susceptibility factor. A
    functional deficiency of endogenous IL-1RA (IL1RN) has been demonstrated in
    small FIRES cohorts, but whether this is a reproducible, generalizable
    susceptibility signature - and how it interacts with the febrile trigger -
    remains open.
  evidence:
  - reference: PMID:30779222
    reference_title: "Functional deficiency in endogenous interleukin-1 receptor antagonist in patients with febrile infection-related epilepsy syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings suggest that FIRES is associated with reduced expression of intracellular IL1RA isoforms and a functional deficiency in IL1RA inhibitory activity"
    explanation: >-
      An IL1RN/IL-1RA functional-deficiency signature is the leading
      host-susceptibility lead motivating this gap.
  proposed_experiments:
  - experiment_id: fires-host-susceptibility-genomics
    name: Host innate-immune susceptibility genomics in FIRES
    description: >-
      Perform genomic/immunogenetic profiling (e.g., IL-1 pathway and
      inflammasome genes) in a FIRES cohort versus controls to test for a
      susceptibility signature.
    readouts:
    - name: Innate-immune genetic susceptibility signature
      target: "pathophysiology#Innate Neuroinflammatory Activation"
    would_support:
    - "pathophysiology#Innate Neuroinflammatory Activation"

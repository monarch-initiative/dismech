    description: >-
      Neuroinflammation disrupts the blood-brain barrier.
- name: Cytokine-Driven Lowering of Seizure Threshold
  description: >-
    Interleukin-1-beta and interleukin-6 act on neurons to lower seizure
    threshold - enhancing NMDA-receptor-mediated excitation, impairing GABAergic
    inhibition, and disrupting glutamate homeostasis. This node captures the
    single concept of the cytokine-to-excitability link and conforms to the
    shared epilepsy final common pathway.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  cell_types:

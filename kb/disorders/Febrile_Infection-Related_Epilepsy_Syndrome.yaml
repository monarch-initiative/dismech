genetic:
- name: IL1RN
  gene_term:
    preferred_term: IL1RN
    term:
      id: hgnc:6000
      label: IL1RN
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    IL1RN encodes the endogenous interleukin-1 receptor antagonist (IL-1RA), the
    natural brake on IL-1-beta signaling. FIRES is not Mendelian; this is a
    candidate host-susceptibility factor rather than an established cause. In a
    small study, an index FIRES patient carried IL1RN variants of uncertain
    significance with reduced expression of intracellular IL-1RA isoforms, and
    functionally attenuated endogenous IL-1RA activity was demonstrated in a few
    patients - suggesting a permissive "loss of the anti-inflammatory brakes"
    mechanism that may be present in only some children and that also rationalizes
    anakinra (recombinant IL-1RA) therapy.
  evidence:
  - reference: PMID:30779222
    reference_title: "Functional deficiency in endogenous interleukin-1 receptor antagonist in patients with febrile infection-related epilepsy syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings suggest that FIRES is associated with reduced expression of intracellular IL1RA isoforms and a functional deficiency in IL1RA inhibitory activity"
    explanation: >-
      FIRES patients show reduced intracellular IL-1RA expression and functionally
      deficient IL-1RA activity, implicating IL1RN in susceptibility.
  - reference: PMID:30779222
    reference_title: "Functional deficiency in endogenous interleukin-1 receptor antagonist in patients with febrile infection-related epilepsy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Levels of endogenous IL1RA and IL1β were elevated in the serum and CSF of patients with FIRES"
    explanation: >-
      Endogenous IL-1RA and IL-1-beta are elevated in FIRES serum and CSF,
      consistent with active IL-1 pathway inflammation that outstrips the IL-1RA
      brake.

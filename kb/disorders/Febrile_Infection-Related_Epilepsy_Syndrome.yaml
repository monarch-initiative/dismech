name: Febrile Infection-Related Epilepsy Syndrome
creation_date: "2026-07-24T00:00:00Z"
category: Complex
description: >-
  Febrile infection-related epilepsy syndrome (FIRES) is a catastrophic
  epileptic encephalopathy that strikes previously healthy school-aged children
  a few days to two weeks after a nonspecific febrile illness. It is defined as
  the subgroup of new-onset refractory status epilepticus (NORSE) that requires a
  preceding febrile infection, and it develops without an identified acute
  structural, toxic, metabolic, or infectious (CNS pathogen) cause. The leading
  mechanistic model is a disorder of innate immunity: a febrile trigger drives
  microglial/inflammasome activation and a pro-convulsant cytokine surge
  (interleukin-1-beta, interleukin-6), which - together with blood-brain barrier
  dysfunction - lowers seizure threshold and produces explosive, multifocal,
  drug-resistant status epilepticus. The illness is biphasic: an acute
  super-refractory status epilepticus phase (often requiring prolonged anesthetic
  burst-suppression) is followed, in survivors, by a chronic phase of
  drug-resistant epilepsy with cognitive and behavioral sequelae. Because the
  acute and chronic phases are mechanistically distinct endpoints of the same
  cascade, this entry keeps them as separate downstream nodes rather than
  bundling them.
parents:
- Epilepsy
- Neurological Disease
synonyms:
- FIRES
- AERRPS
- acute encephalitis with refractory repetitive partial seizures
- DESC syndrome
- devastating epileptic encephalopathy in school-aged children

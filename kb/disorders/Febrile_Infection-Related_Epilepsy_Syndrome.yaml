differential_diagnoses:
- name: New-Onset Refractory Status Epilepticus (without preceding fever)
  description: >-
    NORSE is the parent category; FIRES is specifically the subgroup with a
    mandatory preceding febrile infection. NORSE cases without a preceding fever,
    or with an identified cause, are distinguished on that basis - so FIRES is a
    clinical subset defined by the febrile prodrome and by exclusion of other
    NORSE etiologies.
  disease_term:
    preferred_term: new-onset refractory status epilepticus
    term:
      id: MONDO:0018199
      label: new-onset refractory status epilepticus
  evidence:
  - reference: PMID:29399791
    reference_title: "Proposed consensus definitions for new-onset refractory status epilepticus (NORSE), febrile infection-related epilepsy syndrome (FIRES), and related conditions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NORSE is a clinical presentation, not a specific diagnosis, in a patient without active epilepsy or other preexisting relevant neurological disorder, with new onset of refractory status epilepticus without a clear acute or active structural, toxic or metabolic cause"
    explanation: >-
      The consensus defines NORSE as the parent presentation; FIRES is its
      febrile subcategory, which is the basis for distinguishing them.
- name: Anti-NMDA Receptor Encephalitis
  description: >-
    Anti-NMDA receptor encephalitis is a leading autoimmune mimic that can cause
    new-onset refractory status epilepticus; it is distinguished by detection of
    anti-NMDAR antibodies and its characteristic psychiatric/dyskinetic
    prodrome, and must be excluded before diagnosing FIRES.
  disease_term:
    preferred_term: anti-NMDA receptor encephalitis
    term:
      id: MONDO:0021081
      label: anti-NMDA receptor encephalitis
- name: Herpes Simplex Encephalitis
  description: >-
    Herpes simplex (and other viral) encephalitis is a treatable infectious
    cause of febrile encephalopathy with seizures that must be excluded (CSF PCR,
    MRI) before FIRES is diagnosed, since FIRES requires the absence of an
    identified CNS pathogen.
  disease_term:
    preferred_term: herpes simplex encephalitis
    term:
      id: MONDO:0012521
      label: herpes simplex encephalitis
- name: Dravet Syndrome
  description: >-
    Dravet syndrome (SCN1A) features fever-sensitive, often prolonged seizures
    and status epilepticus and can enter the differential of a febrile-triggered
    encephalopathy; it is distinguished by earlier (infantile) onset, the
    characteristic evolution, and SCN1A genetic testing.
  disease_term:
    preferred_term: Dravet syndrome
    term:
      id: MONDO:0100135
      label: Dravet syndrome
treatments:
- name: Anakinra (IL-1 Receptor Antagonist)
  description: >-
    Anakinra, a recombinant interleukin-1 receptor antagonist, targets the
    IL-1-beta-driven neuroinflammation thought to underlie FIRES and is used as an
    early targeted immunotherapy, with reports of seizure improvement especially
    when started early.
  therapeutic_modality: PROTEIN_REPLACEMENT
  target_mechanisms:
  - target: Innate Neuroinflammatory Activation
    treatment_effect: INHIBITS
    description: >-
      Anakinra blocks IL-1 receptor signaling, dampening the IL-1-beta-driven
      neuroinflammatory cascade.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: CHEBI:231683
        label: Anakinra
  evidence:
  - reference: PMID:27770579
    reference_title: "Febrile infection-related epilepsy syndrome treated with anakinra."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anakinra was well tolerated and effective"
    explanation: >-
      The first report of anakinra in FIRES found it well tolerated and
      effective for super-refractory status epilepticus.
  - reference: PMID:27770579
    reference_title: "Febrile infection-related epilepsy syndrome treated with anakinra."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anakinra is a recombinant version of the human interleukin-1 receptor antagonist used to treat autoinflammatory disorders"
    explanation: >-
      Anakinra's mechanism is IL-1 receptor antagonism, matching the
      IL-1-beta-driven neuroinflammation model of FIRES.
- name: Tocilizumab (IL-6 Receptor Antagonist)
  description: >-
    Tocilizumab, an anti-interleukin-6-receptor monoclonal antibody, targets the
    IL-6-driven arm of the neuroinflammation and is used as a second-line
    immunomodulatory option in refractory NORSE/FIRES when IL-1 blockade is
    insufficient.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  target_mechanisms:
  - target: Innate Neuroinflammatory Activation
    treatment_effect: INHIBITS
    description: >-
      Tocilizumab blocks IL-6 receptor signaling, reducing the IL-6-driven
      inflammatory arm.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: Ketogenic Diet
  description: >-
    The ketogenic diet is a mainstay of FIRES management and can help terminate
    refractory status epilepticus, with anti-seizure and anti-inflammatory
    effects; early initiation is often recommended.
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Super-Refractory Status Epilepticus
    treatment_effect: INHIBITS
    description: >-
      The ketogenic diet can help terminate refractory status epilepticus.
  treatment_term:
    preferred_term: ketogenic diet intake
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  evidence:
  - reference: PMID:20813015
    reference_title: "Efficacy of ketogenic diet in severe refractory status epilepticus initiating fever induced refractory epileptic encephalopathy in school age children (FIRES)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In seven patients, KD was efficacious within 2-4 days (mean 2 days) following the onset of ketonuria"
    explanation: >-
      The ketogenic diet terminated refractory status epilepticus in most FIRES
      patients, shortly after ketonuria onset.
  - reference: PMID:21883180
    reference_title: "Febrile infection-related epilepsy syndrome (FIRES): pathogenesis, treatment, and outcome: a multicenter study on 77 children."
    supports: SUPPORT

- name: First-Line Immunotherapy
  description: >-
    First-line immunotherapy - high-dose corticosteroids, intravenous
    immunoglobulin, and/or plasma exchange - is used acutely to suppress the
    presumed immune-mediated process, though responses are frequently
    incomplete.
  therapeutic_modality: OTHER
  target_mechanisms:

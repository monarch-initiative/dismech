prevalence:
- population: Children/adolescents (Germany)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.1
  notes: >-
    Orphanet cites an annual incidence on the order of 1 per 1,000,000 in
    children/adolescents. FIRES is very rare - only on the order of 100+
    well-characterized cases have been published worldwide - and ascertainment is
    difficult because the syndrome is defined clinically and by exclusion. It
    predominantly affects previously healthy school-aged children.
- population: Children/adolescents (Germany)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.0
  notes: >-
    Orphanet cites a point prevalence on the order of 1 per 100,000 in
    children/adolescents (kept as a separate record from annual incidence, which
    is roughly tenfold lower, to avoid conflating the two measures).
diagnosis:
- name: Clinical Diagnosis by Consensus Criteria (Diagnosis of Exclusion)
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    FIRES is a clinical diagnosis made when a previously healthy person develops
    new-onset refractory status epilepticus after a preceding febrile infection
    (typically 24 hours to 2 weeks before onset), once acute structural, toxic,
    metabolic, and identifiable infectious/autoimmune causes have been excluded.
    Workup includes MRI, EEG, CSF analysis, autoimmune/paraneoplastic antibody
    panels, and infectious and metabolic studies - all of which are, by
    definition, non-diagnostic of an alternative cause.
  results: >-
    New-onset refractory status epilepticus with a documented preceding febrile
    illness and no identified alternative cause.
  evidence:
  - reference: PMID:29399791
    reference_title: "Proposed consensus definitions for new-onset refractory status epilepticus (NORSE), febrile infection-related epilepsy syndrome (FIRES), and related conditions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FIRES is a subcategory of NORSE, applicable for all ages, that requires a prior febrile infection starting between 2 weeks and 24 hours prior to onset of refractory status epilepticus, with or without fever at onset of status epilepticus"
    explanation: >-
      The international consensus definition specifies the diagnostic criteria
      for FIRES: a NORSE presentation with a mandatory preceding febrile infection
      in the defined time window.
pathophysiology:
- name: Preceding Febrile Infection Trigger
  description: >-
    A nonspecific febrile illness (usually an upper-respiratory or
    gastrointestinal infection) precedes seizure onset by roughly 24 hours to two
    weeks in a previously healthy individual. No specific pathogen is consistently
    identified in the CNS, and the fever is understood as a trigger of a
    maladaptive immune response rather than a direct CNS infection. This node
    captures the single concept of the initiating febrile trigger.
  role: trigger
  cell_types:
  - preferred_term: Leukocyte
    term:
      id: CL:0000738
      label: leukocyte
  evidence:
  - reference: PMID:21883180
    reference_title: "Febrile infection-related epilepsy syndrome (FIRES): pathogenesis, treatment, and outcome: a multicenter study on 77 children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A preceding febrile infection had been reported in 96% of them"
    explanation: >-
      In the multicenter cohort, a preceding febrile infection was reported in
      96% of FIRES patients - the defining trigger.
  downstream:
  - target: Innate Neuroinflammatory Activation
    causal_link_type: DIRECT
    description: >-
      The febrile trigger initiates a maladaptive innate immune response in the
      CNS.
  - target: Preceding Fever
    causal_link_type: DIRECT
    description: >-
      The febrile illness is observed clinically as the mandatory preceding
      fever, 24 hours to two weeks before seizure onset.
- name: Functional IL-1RA Deficiency (Permissive Host Factor)
  description: >-
    A functional deficiency of endogenous interleukin-1 receptor antagonist
    (IL-1RA, encoded by IL1RN) is a candidate permissive host factor: with the
    natural brake on IL-1-beta signaling weakened, a common febrile trigger can
    drive unchecked IL-1-beta activity. This node captures the single concept of
    the "loss of the anti-inflammatory brakes" - the gene-environment convergence
    at the heart of the leading FIRES model - kept separate from the febrile
    trigger and from the downstream inflammatory activation it permits.
  role: modifier
  cell_types:
  - preferred_term: Leukocyte
    term:
      id: CL:0000738
      label: leukocyte
  gene:
    preferred_term: IL1RN
    term:
      id: hgnc:6000
      label: IL1RN
  downstream:
  - target: Innate Neuroinflammatory Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Deficient IL-1RA braking permits unchecked IL-1-beta-driven neuroinflammatory
      activation on exposure to the febrile trigger.
  molecular_functions:
  - preferred_term: interleukin-1 receptor antagonist activity
    term:
      id: GO:0005152
      label: interleukin-1 receptor antagonist activity
    modifier: DECREASED
  evidence:
  - reference: PMID:30779222
    reference_title: "Functional deficiency in endogenous interleukin-1 receptor antagonist in patients with febrile infection-related epilepsy syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings suggest that FIRES is associated with reduced expression of intracellular IL1RA isoforms and a functional deficiency in IL1RA inhibitory activity"
    explanation: >-
      Functionally deficient endogenous IL-1RA activity in FIRES patient cells is
      the permissive "loss of brakes" host factor.
- name: Innate Neuroinflammatory Activation
  description: >-
    The trigger drives activation of brain-resident innate immunity - microglia
    and astrocytes - with inflammasome activation and production of
    pro-inflammatory cytokines, prominently interleukin-1-beta and interleukin-6.
    A genetic predisposition of the innate immune response (e.g., variation in
    the IL-1 pathway) is hypothesized. This node captures the single concept of
    the central neuroinflammatory driver.
  role: mediator
  cell_types:
  - preferred_term: Microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: Astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: Microglial cell activation
    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: INCREASED
  - preferred_term: Interleukin-1 beta production
    term:
      id: GO:0032611
      label: interleukin-1 beta production
    modifier: INCREASED
  - preferred_term: Interleukin-6 production
    term:
      id: GO:0032635
      label: interleukin-6 production
    modifier: INCREASED
  evidence:
  - reference: PMID:27770579
    reference_title: "Febrile infection-related epilepsy syndrome treated with anakinra."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebral spinal fluid analysis revealed elevated levels of proinflammatory cytokines before treatment that normalized on anakinra, suggesting a potential pathogenic role for neuroinflammation in FIRES"
    explanation: >-
      Elevated CSF proinflammatory cytokines that normalized on IL-1 blockade
      support a pathogenic neuroinflammatory driver in FIRES.
  - reference: PMID:36871188
    reference_title: "Cytokines in New-Onset Refractory Status Epilepticus Predict Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "to investigate inflammation using cerebrospinal fluid (CSF) and serum cytokines/chemokines in patients with new-onset refractory status epilepticus (NORSE) to better understand the pathophysiology of NORSE"
    explanation: >-
      A dedicated cytokine study of NORSE/FIRES supports inflammation as central
      to the pathophysiology.
  downstream:
  - target: Cytokine-Driven Lowering of Seizure Threshold
    causal_link_type: DIRECT
    description: >-
      The cytokine surge acts on neurons to lower seizure threshold.
  - target: Blood-Brain Barrier Dysfunction

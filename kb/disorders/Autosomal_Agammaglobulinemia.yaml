- name: Peripheral blood CD19+ B cell percentage
  presence: Decreased
  context: >-
    Flow cytometric CD19+ (or CD20+) B cells as a percentage of peripheral blood
    lymphocytes. This is the single most discriminating test: profoundly reduced
    B cells with normal T-cell numbers separates agammaglobulinemia from common
    variable immunodeficiency (B cells present) and from severe combined
    immunodeficiency (T cells also absent).
  biomarker_term:
    preferred_term: B-Lymphocyte Count
    term:
      id: NCIT:C174314
      label: B-Lymphocyte Count
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  readouts:
  - target: Developmental Arrest at the Pro-B to Pre-B Transition
    relationship: READOUT_OF
    direction: NEGATIVE
    description: >-
      The circulating CD19+ percentage is the clinical readout of the bone-marrow
      developmental block: the more complete the block, the lower the percentage.
  evidence:
  - reference: PMID:22351933
    reference_title: "Agammaglobulinemia and absent B lineage cells in a patient lacking the p85α subunit of PI3K."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bone marrow aspirates from the patient showed <0.1% CD19(+) B cells with
      normal percentages of TdT(+)VpreB(+)CD19(-) B cell precursors.
    explanation: >-
      Illustrates the magnitude of CD19+ depletion in an autosomal form.
  notes: >-
    The diagnostic threshold conventionally applied is CD19+ B cells below 2% of
    peripheral blood lymphocytes (many laboratories and case series use below 1%),
    derived from the PAGID/ESID diagnostic criteria for primary immunodeficiencies
    (Conley, Notarangelo and Etzioni, PMID:10600329). That reference is indexed in
    PubMed without an abstract, so the threshold is recorded here as provenance
    rather than as an evidence item with a fabricated snippet. No non-deprecated
    LOINC code exists for CD19+ cells per 100 lymphocytes in blood, so loinc_term
    is omitted from the range below.
  reference_ranges:
  - lower_bound: 5.0
    upper_bound: 20.0
    unit: '%'
    population: >-
      children and adults; CD19+ cells as a percentage of peripheral blood
      lymphocytes
    notes: >-
      Approximate normal range for CD19+ B cells as a percentage of peripheral
      blood lymphocytes; the paediatric range is age-dependent and wider in
      infancy. Recorded as laboratory convention, not from a citable interval
      study.
    interpretation_bands:
    - name: Absent or near-absent B cells
      upper_bound: 2.0
      unit: '%'
      abnormal_flag: CRITICAL_LOW
      severity: SEVERE
      phenotype_term:
        preferred_term: Decreased total B cell count
        term:
          id: HP:0010976
          label: Decreased total B cell count
      interpretation: >-
        CD19+ B cells below 2% of lymphocytes, with normal T-cell numbers and
        panhypogammaglobulinemia, is the diagnostic laboratory signature of
        congenital agammaglobulinemia. In autosomal forms with a complete
        pre-BCR defect the value is usually far below 1%.
    - name: Reduced B cells
      lower_bound: 2.0
      upper_bound: 5.0
      unit: '%'
      abnormal_flag: LOW
      severity: MILD
      interpretation: >-
        Reduced but clearly detectable B cells; suggests a hypomorphic or leaky
        genotype, or an alternative diagnosis such as common variable
        immunodeficiency, rather than classic agammaglobulinemia.
    - name: Normal
      lower_bound: 5.0
      upper_bound: 20.0
      unit: '%'
      abnormal_flag: NORMAL

- name: AGM8B
  display_name: "Agammaglobulinemia 8B, autosomal recessive (TCF3)"
  description: >-
    A biallelic, autosomal recessive TCF3 form, distinct from the dominant
    p.E555K allele. TCF3 is therefore the one locus in this series that carries
    both a dominant and a recessive numbered subtype. MONDO places this term
    directly under agammaglobulinemia (MONDO:0015977) rather than under autosomal

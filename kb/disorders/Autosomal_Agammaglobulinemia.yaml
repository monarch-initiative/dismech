- name: Earlier and More Severe Presentation than X-Linked Agammaglobulinemia
  description: >-
    A genotype-severity gradient distinguishes the autosomal forms clinically.
    Because most autosomal defects remove an obligate structural component of the
    pre-BCR (rather than attenuating a kinase, as hypomorphic BTK alleles can),

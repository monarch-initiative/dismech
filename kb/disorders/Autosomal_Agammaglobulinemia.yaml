- name: AGM9
  display_name: "Agammaglobulinemia 9, autosomal recessive (SLC39A7/ZIP7)"
  description: >-
    Hypomorphic variants in SLC39A7, the endoplasmic-reticulum-to-cytoplasm zinc
    transporter ZIP7. Loss of cytosolic Zn2+ buffering raises phosphatase
    activity and blunts pre-BCR/BCR signal strength. Severity is variable; per
    the OMIM/MONDO description, additional features include failure to thrive and
    skin involvement, and more severe cases may require hematopoietic stem cell
    transplantation.
  subtype_term:
    preferred_term: agammaglobulinemia 9, autosomal recessive

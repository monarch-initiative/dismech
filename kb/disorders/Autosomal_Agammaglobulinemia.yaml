inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Most autosomal agammaglobulinemia is autosomal recessive, caused by
    biallelic loss-of-function variants in pre-BCR components (IGHM, IGLL1,
    CD79A, CD79B), the receptor-proximal adaptor BLNK, PIK3R1, SLC39A7, FNIP1,
    or a recessive TCF3 allele. Consanguinity substantially increases the
    probability of disease and has driven much of the gene discovery.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31696364
    reference_title: "Genetic Approaches for Definitive Diagnosis of Agammaglobulinemia in Consanguineous Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive agammaglobulinemia (ARA) is a primary immunodeficiency
      characterized by absent peripheral B cells, severe hypogammaglobulinemia,
      and absent BTK gene mutations.
    explanation: >-
      Defines the autosomal recessive form of agammaglobulinemia as a distinct,
      BTK-negative entity.
  - reference: PMID:31696364
    reference_title: "Genetic Approaches for Definitive Diagnosis of Agammaglobulinemia in Consanguineous Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In ARA, mutations occur in genes encoding the pre-B cell receptor (pre-BCR)
      or downstream signaling proteins.
    explanation: >-
      Establishes the pre-BCR / downstream-signalling gene set as the recessive
      genetic basis.
- name: Autosomal dominant inheritance
  description: >-
    A minority of autosomal agammaglobulinemia is autosomal dominant and
    typically de novo, acting through dominant-negative or haploinsufficient
    mechanisms rather than biallelic loss of function: TCF3/E47 (AGM8,
    dominant-negative E555K), SPI1/PU.1 (AGM10, haploinsufficiency), and
    LRRC8A (AGM5, a truncating translocation allele).
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:24216514
    reference_title: "A recurrent dominant negative E47 mutation causes agammaglobulinemia and BCR(-) B cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings document a mutational hot-spot in E47 and represent an
      autosomal dominant form of agammaglobulinemia.
    explanation: >-
      Documents an autosomal dominant, dominant-negative form of agammaglobulinemia.
  - reference: PMID:33951726
    reference_title: "Constrained chromatin accessibility in PU.1-mutated agammaglobulinemia patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We studied six unrelated agammaglobulinemic patients, each harboring a
      heterozygous mutation (four de novo, two unphased) of SPI1, the gene
      encoding PU.1.
    explanation: >-
      Heterozygous, largely de novo SPI1 variants establish a second autosomal
      dominant form.

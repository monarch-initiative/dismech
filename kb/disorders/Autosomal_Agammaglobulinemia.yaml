differential_diagnoses:
- name: X-linked agammaglobulinemia (BTK)
  description: BTK-related XLA shares severe B-cell and antibody deficiency and is usually male, but rare heterozygous females are affected. Sex, consanguinity and age alone do not distinguish it from all autosomal forms; molecular testing determines the cause.
  disease_term:
    preferred_term: Bruton-type agammaglobulinemia
    term:
      id: MONDO:0010421
      label: Bruton-type agammaglobulinemia
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1453/
    reference_title: X-Linked Agammaglobulinemia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Females with a heterozygous pathogenic variant in <i>BTK</i> extremely rarely have clinical and laboratory findings of XLA.
    explanation: The chapter explicitly recognizes rare affected females, correcting an absolute male-only boundary.
- name: Common variable immunodeficiency
  description: CVID generally retains B cells with impaired antibody function, but some autosomal transcription-factor disorders can begin with a CVID-like phenotype and later lose B cells. This is a molecular and longitudinal distinction, not a single universal count threshold.
  disease_term:
    preferred_term: common variable immunodeficiency
    term:
      id: MONDO:0015517
      label: common variable immunodeficiency
  evidence:
  - reference: PMID:39073655
    reference_title: Exclusive Characteristics of the p.E555K Dominant-Negative Variant in Autosomal Dominant E47 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: TCF3 haploinsufficiency (HI) also impacts both TCF3 isoforms, resulting in common variable immunodeficiency (CVID) with low B cells and hypogammaglobulinemia
    explanation: TCF3 allele mechanism can yield an overlapping phenotype.
- name: Severe combined immunodeficiency
  description: Major T-cell deficiency or dysfunction suggests combined immunodeficiency rather than an isolated antibody defect. Some syndromic autosomal forms have additional immune abnormalities, so comprehensive phenotyping and molecular diagnosis remain necessary.
  disease_term:
    preferred_term: severe combined immunodeficiency
    term:
      id: MONDO:0015974
      label: severe combined immunodeficiency
  evidence:
  - reference: PMID:37273190
    reference_title: Inborn errors of human B cell development, differentiation, and function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: variants in RAG1 or RAG2 cause severe combined immunodeficiency (SCID) because recombination of TCR chains during thymic development is also compromised.
    explanation: RAG-related T- and B-cell developmental failure distinguishes an important combined-immunodeficiency mechanism.
- name: Transient hypogammaglobulinemia of infancy
  description: Transient hypogammaglobulinemia of infancy typically retains B cells and is confirmed by subsequent recovery. Severe infections or profound B-cell depletion require evaluation for persistent genetic disease rather than assuming a transient state.
  disease_term:
    preferred_term: transient hypogammaglobulinemia of infancy
    term:
      id: MONDO:0015698
      label: transient hypogammaglobulinemia of infancy
- name: Good syndrome (thymoma with immunodeficiency)
  description: Adult-onset antibody and B-cell deficiency associated with thymoma is an acquired syndromic differential. Adult onset alone does not exclude inherited SPI1 disease.
  disease_term:
    preferred_term: Good syndrome
    term:
      id: MONDO:0015696
      label: Good syndrome
- name: Secondary hypogammaglobulinemia after B-cell-depleting therapy
  description: Prior B-cell-depleting therapy can cause prolonged secondary antibody deficiency. Drug exposure, pre-treatment immune history and longitudinal recovery help distinguish it from inherited disease. The cited Greek cohort is broader PAD, not an autosomal agammaglobulinemia prevalence study.
  evidence:
  - reference: PMID:38792965
    reference_title: A Nationwide Study of the Delayed Diagnosis and the Clinical Manifestations of Predominantly Antibody Deficiencies and CTLA4-Mediated Immune Dysregulation Syndrome in Greece.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 12 patients with "secondary" hypogammaglobulinemia due to a previous B-cell depletion immunotherapy for autoimmune or malignant disease several years ago
    explanation: A national antibody-deficiency cohort documents secondary hypogammaglobulinemia following B-cell depletion therapy as a distinct group requiring separation from primary antibody deficiency.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: POU2AF1 (BOB1) deficiency
  description: BOB1 deficiency can cause agammaglobulinemia despite preserved peripheral B-cell numbers, reflecting a later functional differentiation defect rather than the B-cell-poor pattern emphasized here.
  disease_term:
    preferred_term: agammaglobulinemia, autosomal recessive, due to BOB1 deficiency
    term:
      id: MONDO:0800146
      label: agammaglobulinemia, autosomal recessive, due to BOB1 deficiency
  evidence:
  - reference: PMID:37273190
    reference_title: Inborn errors of human B cell development, differentiation, and function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Despite normal numbers of peripheral B cells, the OBF-1–deficient patient presented with recurrent respiratory infection, agammaglobulinemia, and an absence of class switched memory B cells (Kury et al., 2021).
    explanation: A review summarizes the reported BOB1 patient; the original brief report had no substantive retrievable cached text.
- name: Hyper-IgM syndrome
  description: Class-switch defects usually preserve B-cell numbers and IgM relative to IgG/IgA. Residual IgM alone does not exclude evolving autosomal agammaglobulinemia; use the full immunophenotype and genotype.
  disease_term:
    preferred_term: hyper-IgM syndrome
    term:
      id: MONDO:0003947
      label: hyper-IgM syndrome
treatments:
- name: Immunoglobulin Replacement Therapy
  description: IVIG or SCIG is standard supportive treatment for clinically significant antibody deficiency. Dose and interval are individualized to infections, trough concentrations and lung disease. It supplies passive IgG without restoring the underlying B-cell program; infections and noninfectious complications may persist. The route schedule is extrapolated from XLA guidance, with direct autosomal cohort evidence of continuing replacement dependence.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Immunoglobulin Therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Reduced Immunoglobulin Production
    treatment_effect: BYPASSES
    description: Passive antibody supplies an effector product without correcting endogenous production or B-cell development.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1453/
      reference_title: X-Linked Agammaglobulinemia - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: The mainstay of treatment is gammaglobulin substitution therapy (by weekly subcutaneous injection or intravenous infusion every two to four weeks) to prevent bacterial infections.
      explanation: GeneReviews expert guidance is for XLA; shared antibody-replacement principles are extrapolated to autosomal disease.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1453/
    reference_title: X-Linked Agammaglobulinemia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: The mainstay of treatment is gammaglobulin substitution therapy (by weekly subcutaneous injection or intravenous infusion every two to four weeks) to prevent bacterial infections.
    explanation: GeneReviews expert guidance is for XLA; shared antibody-replacement principles are extrapolated to autosomal disease.
  - reference: url:https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    reference_title: https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: All patients with PU.MA were IRT dependent
    explanation: All 22 affected patients in the expanded SPI1 cohort used replacement.
- name: Antibiotic Therapy and Prophylaxis
  description: Treat suspected or proven bacterial infection promptly. Selected patients with recurrent infections despite replacement may receive specialist-directed prophylaxis; it is not mandatory for every genotype or patient.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Recurrent Infections
    treatment_effect: INHIBITS
    description: Antimicrobial treatment addresses infection and selected prophylaxis reduces recurrence.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1453/
      reference_title: X-Linked Agammaglobulinemia - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: Generous use of antibiotics can decrease the incidence of chronic sinusitis and lung disease. Prophylactic antibiotics can be considered to prevent infections.
      explanation: XLA management synthesis supports prompt treatment and selected prophylaxis; autosomal treatment is individualized.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1453/
    reference_title: X-Linked Agammaglobulinemia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Generous use of antibiotics can decrease the incidence of chronic sinusitis and lung disease. Prophylactic antibiotics can be considered to prevent infections.
    explanation: XLA management synthesis supports prompt treatment and selected prophylaxis; autosomal treatment is individualized.
- name: Avoidance of Live Attenuated Vaccines (Agents to Avoid)
  description: Avoid live viral vaccines, especially oral polio vaccine, in severe antibody deficiency under immunology guidance. Inactivated polio vaccine is used for affected people and family contacts. The SPI1 cohort directly documents vaccine-associated paralytic poliomyelitis; this does not quantify all vaccines or all genotypes.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Preventive Intervention
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1453/
    reference_title: X-Linked Agammaglobulinemia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Live viral vaccines, particularly oral polio vaccine.
    explanation: GeneReviews lists these among agents to avoid in XLA; severe autosomal antibody deficiency shares the relevant concern.
  - reference: url:https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    reference_title: https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: One (D.II.1) of 5 patients receiving live-attenuated oral polio vaccine developed iatrogenic paralytic poliomyelitis.
    explanation: Direct SPI1 cohort evidence of a live oral polio vaccine complication; the small exposed denominator is not a general vaccine-risk estimate.
- name: Clinical and Respiratory Surveillance
  description: Monitor infections, blood counts and immunoglobulins; assess chronic lung or sinus disease when clinically indicated. Follow genotype-specific skin, cardiac, gastrointestinal and inflammatory complications. Surveillance detects complications; it does not itself inhibit the molecular defect.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1453/
    reference_title: X-Linked Agammaglobulinemia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Complete blood count with differential and quantitative serum immunoglobulins at least annually; chest and sinus imaging as needed to assess for chronic lung and/or sinus disease.
    explanation: XLA surveillance schedule provides a clinical framework, adapted for genotype, age, complications and treatment.
- name: Allogeneic Hematopoietic Cell Transplantation
  description: Consider HSCT only through individualized specialist assessment of the genetic disorder, morbidity, donor genotype and transplant risk. Two severely affected ZIP7 siblings had correction of immunologic abnormalities and improvement of skin disease. In SPI1 disease, one recipient remained replacement-dependent five years after full trilineage donor engraftment; another failed engraftment after receiving cells from an unknowingly variant-carrying sister. These contrasting small series do not establish a uniform curative strategy.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:30718914
    reference_title: An essential role for the Zn(2+) transporter ZIP7 in B cell development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: (P1 and P2, family 1) additionally showed severe blistering dermatosis (Fig. 1b), failure to thrive and thrombocytopenia, prompting hematopoietic stem cell transplantation; this resulted in cure of immunologic abnormalities and amelioration of skin disease.
    explanation: Two siblings among six ZIP7-deficient patients had severe skin disease, poor growth and thrombocytopenia; transplantation outcomes are specific to them.
  - reference: url:https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    reference_title: https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Five years after transplantation, he remains IRT dependent because of undetectable serum immunoglobulin (IgA) and IgM despite naïve B-cell reconstitution and >99% donor peripheral blood engraftment in B-cell, T-cell, and myeloid cell compart- ments.
    explanation: Long-term SPI1 follow-up documents persistent antibody-production failure despite donor engraftment.
  - reference: url:https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    reference_title: https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The second patient (L.II.1) who received HSCT received stem cells from her healthy sister (L.II.2) at the age of 16 but failed to engraft. 18 Unbeknown at the time of HSCT, the donor harbored the same PU.1 variant as the recipient.
    explanation: The second SPI1 attempt failed; donor variant status was recognized retrospectively.
- name: Genetic Counseling and Family Testing
  description: Explain gene- and allele-specific inheritance, test at-risk relatives after a molecular diagnosis, and reassess initially mild SPI1 carriers over time. A clinically healthy related donor can carry the familial variant; donor assessment should include this possibility.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    reference_title: https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: 6 were clinically well with laboratory evaluations documenting serum antibody and circulating B-cell concentrations within age- adjusted normal ranges.
    explanation: Six variant-carrying relatives had normal clinical and laboratory assessments at the study time; ascertainment and possible later onset limit penetrance estimates.
  - reference: url:https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    reference_title: https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: Unbeknown at the time of HSCT, the donor harbored the same PU.1 variant as the recipient.
    explanation: Retrospective donor genotyping illustrates the relevance of variable expressivity to family and donor assessment.
- name: Individualized Management of Inflammatory Complications
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  description: Treat inflammatory complications according to the affected organ and infection risk. In the SPI1 cohort, mesalamine, mycophenolate and adalimumab were reported for bowel inflammation, whereas multiple agents had limited success in one refractory arthritis case. These are uncontrolled treatment experiences, not comparative efficacy evidence or a disease-wide regimen.
  evidence:
  - reference: url:https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    reference_title: https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Immune modulating treatments successfully used for inﬂammatory bowel disorder included mesalamine, mycophenolate, and tumor necrosis factor inhibition (adalimumab). A series of therapies (methotrexate, hydroxychloroquine, etanercept, tocilizumab, abatacept, and canakinumab) were trialed with limited success in 1 patient with recalcitrant juvenile idiopathic arthritis (S.II.1).
    explanation: Retrospective case-level treatment experience; no controlled efficacy estimate.
diagnosis:
- name: Quantitative serum immunoglobulins
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: Measure IgG, IgA and IgM with age-specific laboratory interpretation. Maternal IgG, replacement therapy and residual or evolving antibody production affect results.
  markers: Serum IgG, IgA and IgM
  results: Severely reduced endogenous antibody concentrations support the phenotype, with variable residual values.
  evidence:
  - reference: PMID:31696364
    reference_title: Genetic Approaches for Definitive Diagnosis of Agammaglobulinemia in Consanguineous Families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autosomal recessive agammaglobulinemia (ARA) is a primary immunodeficiency characterized by absent peripheral B cells, severe hypogammaglobulinemia, and absent BTK gene mutations.
    explanation: Severe hypogammaglobulinemia with absent peripheral B cells is the laboratory definition of the disorder.
    directness: DIRECT
    quote_role: BACKGROUND
- name: Lymphocyte subset flow cytometry
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  description: Assess absolute and proportional B cells plus T/NK subsets; add lineage-specific studies when indicated. Normal T cells are common but not universal. Repeat testing may reveal progressive B-cell depletion.
  markers: CD19+ B cell percentage; CD3/CD4/CD8 T cell counts
  results: Profoundly low B cells, with genotype-dependent accompanying abnormalities.
  evidence:
  - reference: PMID:31696364
    reference_title: Genetic Approaches for Definitive Diagnosis of Agammaglobulinemia in Consanguineous Families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autosomal recessive agammaglobulinemia (ARA) is a primary immunodeficiency characterized by absent peripheral B cells, severe hypogammaglobulinemia, and absent BTK gene mutations.
    explanation: The cited source describes the B-cell and antibody-deficiency phenotype. No frequency band or universal complete absence is inferred.
    directness: DIRECT
    quote_role: BACKGROUND
  - reference: url:https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    reference_title: https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: 6 were clinically well with laboratory evaluations documenting serum antibody and circulating B-cell concentrations within age- adjusted normal ranges.
    explanation: Six variant-carrying relatives had normal clinical and laboratory assessments at the study time; ascertainment and possible later onset limit penetrance estimates.
- name: Molecular genetic testing (IEI panel or exome sequencing)
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: Use phenotype-informed gene testing, multigene panels or exome/genome approaches as appropriate. Evaluate inheritance, copy-number/splice variants and functional evidence; a VUS or a historical gene label alone does not establish causality.
  results: Pathogenic or likely pathogenic variants consistent with the clinical phenotype and inheritance; both inherited and de novo dominant disease occur.
  evidence:
  - reference: PMID:31696364
    reference_title: Genetic Approaches for Definitive Diagnosis of Agammaglobulinemia in Consanguineous Families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: WES has the potential to provide a rapid and more accurate genetic diagnosis in ARA, which is crucial for the treatment of the patients.
    explanation: Directly supports exome sequencing over serial single-gene testing in this genetically heterogeneous disorder.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:31696364
    reference_title: Genetic Approaches for Definitive Diagnosis of Agammaglobulinemia in Consanguineous Families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We concluded that conventional gene sequencing, especially when multiple genes are involved in the defect as is the case in ARA, is costly and time-consuming, resulting in delayed diagnosis that contributes to increased morbidity and mortality.
    explanation: Links serial single-gene testing to diagnostic delay and worse outcomes.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: KREC-based newborn screening
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: KREC testing can detect deficient B-cell output before symptoms in some screening settings. It is a screening adjunct requiring immunophenotypic and molecular confirmation; later-onset forms may not be recognized at birth.
  markers: KREC copy number (with TREC as the T-cell comparator)
  results: Low KRECs suggest impaired new B-cell output, without identifying a specific gene.
  evidence:
  - reference: PMID:34241796
    reference_title: 'Agammaglobulinemia: from X-linked to Autosomal Forms of Disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Some diagnostic innovations, such as KREC level measurements and serum BCMA measurements, may aid in facilitating an earlier identification of agammaglobulinemia leading to prompt treatment.
    explanation: Supports KREC measurement as a route to earlier identification of agammaglobulinemia.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  notes: Residual vaccine titers can persist in evolving SPI1 disease and do not exclude it. Serology is also affected by maternal or replacement antibodies. Do not use live-vaccine challenge to investigate severe antibody deficiency.
- name: Respiratory complication assessment
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: Assess chest and sinus disease using imaging when indicated, and obtain baseline pulmonary function testing when the patient can cooperate. This evaluates complications rather than establishing the molecular diagnosis. The XLA GeneReviews framework is extrapolated to autosomal antibody deficiency and individualized to age and clinical course.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1453/
    reference_title: X-Linked Agammaglobulinemia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Complete blood count with differential and quantitative serum immunoglobulins at least annually; chest and sinus imaging as needed to assess for chronic lung and/or sinus disease.
    explanation: XLA guidance supports chest and sinus imaging for suspected chronic disease; application to autosomal antibody deficiency is extrapolated.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1453/
    reference_title: X-Linked Agammaglobulinemia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Baseline chest &#x00026; sinus radiographs ... Baseline pulmonary function tests ... If able to cooperate w/testing
    explanation: XLA guidance recommends pulmonary function testing in those able to cooperate; its application here is extrapolated.
progression:
- phase: Variable onset and evolving B-cell deficiency
  age_range: Infancy through adulthood
  evidence:
  - reference: url:https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    reference_title: https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The 7 remaining late diagnoses developed infectious symptoms later in life, sometimes well into adulthood (range, aged 4-33 years).
    explanation: Seven late-diagnosed SPI1 patients developed infectious symptoms later in life; this is a selected gene-specific cohort.
  notes: Many structural pre-BCR defects present early. SPI1 and some TCF3 cases can retain B cells or antibody responses for years before progressing. Diagnostic delay and genuinely later biological onset are distinct.
- phase: Long-term treated disease
  evidence:
  - reference: url:https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    reference_title: https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: All patients with PU.MA were IRT dependent
    explanation: All 22 agammaglobulinemic patients in this expanded SPI1 cohort required replacement; this is not a trial estimate of all autosomal forms.
  notes: Immunoglobulin replacement often improves infection control, while bronchiectasis, inflammatory complications and gene-specific syndromic findings can persist. The long-term course cannot be summarized as uniformly more severe than XLA.
clinical_burden:
  burden_level: HIGH
  rationale: Severe infection risk, repeated immunoglobulin infusions and ongoing monitoring impose substantial burden. Chronic lung disease and selected inflammatory or syndromic complications add morbidity. Age at onset, severity and transplant suitability differ by genotype; the umbrella is not uniformly more severe than XLA.
notes: This entry covers the autosomal B-cell-poor agammaglobulinemia spectrum, including historical numbered subtypes, recessive PIK3CD deficiency and selected syndromic overlaps. The numbering is not an exhaustive modern gene list. Related PAX5, IKZF3 and other antibody deficiencies require phenotype- and allele-specific assessment. GeneReviews X-linked agammaglobulinemia guidance is explicitly extrapolated where used for shared antibody-deficiency care. The genuine full papers PMID32905580, PMID40294836 and PMID39854693 are cited through generated author/repository URL caches because canonical PMID retrieval did not recover their full bodies. The 2026 correction to PMID39854693 restores missing supplemental tables; the main article was reviewed, but those separate supplementary objects were not independently examined. No population phenotype frequencies are inferred from small gene-specific families or selected clinical cohorts.
experimental_models:
- name: IGLL1 folding and secretion in COS cells
  experimental_model_type: CELL_LINE
  cell_source: COS cells expressing wild-type or patient P142L-containing lambda5 with VpreB
  publication: PMID:9419212
  description: Heterologous expression compares mutant folding and secretion. The mutant retains VpreB association but is not normally secreted; the patient also carried a separate premature-stop allele with no detected transcript.
  modeled_mechanisms:
  - target: Defective Lambda5 Surrogate Light Chain
    relationship: MEASURES
    description: Mutant lambda5 has abnormal folding and secretion.
    limitations: COS expression is not a patient marrow receptor-assembly assay; protein degradation is inferred.
    evidence:
    - reference: PMID:9419212
      reference_title: Mutations in the human lambda5/14.1 gene result in B cell deficiency and agammaglobulinemia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: the allele carrying the pseudogene sequence resulted in defective folding and secretion of mutant lambda5/14.1.
      explanation: COS-cell expression showed defective folding/secretion of the P142L-containing allele; this is not a direct patient pre-BCR surface assay.
    readouts:
    - name: Secreted lambda5
      target: Defective Lambda5 Surrogate Light Chain
      direction: DECREASED
      interpretation: Mutant lambda5 has abnormal folding and secretion.
      evidence:
      - reference: PMID:9419212
        reference_title: Mutations in the human lambda5/14.1 gene result in B cell deficiency and agammaglobulinemia.
        supports: SUPPORT
        evidence_source: IN_VITRO
        directness: DIRECT
        quote_role: PRIMARY_RESULT
        snippet: the allele carrying the pseudogene sequence resulted in defective folding and secretion of mutant lambda5/14.1.
        explanation: COS-cell expression showed defective folding/secretion of the P142L-containing allele; this is not a direct patient pre-BCR surface assay.
- name: CD79B mature-BCR reconstitution in S2 cells
  experimental_model_type: CELL_LINE
  cell_source: Cultured Drosophila S2 Schneider cells with mixed mouse and human BCR components
  publication: PMID:17709424
  description: Reconstitution uses a mature BCR containing mu heavy chain, conventional light chain, Ig-alpha and wild-type or mutant Ig-beta. The Q80-stop allele prevents surface complex assembly. These cultured cells are not an in-vivo fly immune model.
  modeled_mechanisms:
  - target: Impaired Pre-B-Cell Receptor Assembly
    relationship: MEASURES
    description: The tested Ig-beta mutation prevents mature BCR surface assembly, supporting a receptor-component defect.
    limitations: Mature BCR rather than pre-BCR, heterologous species mixture, and one tested allele; extension to the human pre-B checkpoint is indirect.
    evidence:
    - reference: PMID:17709424
      reference_title: Mutations of the Igbeta gene cause agammaglobulinemia in man.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: Transfection experiments using Drosophila melanogaster S2 Schneider cells showed that the mutant Igbeta is no longer able to associate with Igalpha, and that assembly of the BCR complex on the cell surface is abrogated.
      explanation: Mixed-species mature-BCR reconstitution in cultured S2 cells establishes an assembly defect for the tested Q80-stop allele; extension to human pre-BCR development is indirect.
    readouts:
    - name: Surface BCR expression
      target: Impaired Pre-B-Cell Receptor Assembly
      direction: DECREASED
      interpretation: The tested Ig-beta mutation prevents mature BCR surface assembly, supporting a receptor-component defect.
      evidence:
      - reference: PMID:17709424
        reference_title: Mutations of the Igbeta gene cause agammaglobulinemia in man.
        supports: SUPPORT
        evidence_source: IN_VITRO

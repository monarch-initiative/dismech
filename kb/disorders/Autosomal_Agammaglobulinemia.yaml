differential_diagnoses:
- name: X-linked agammaglobulinemia (BTK)
  description: >-
    The single most important boundary. XLA shares the entire downstream
    mechanism modelled here — a pre-B developmental block, absent CD19+ B cells,
    panhypogammaglobulinemia, intact T cells, the same infection spectrum, the
    same immunoglobulin-replacement treatment and the same live-vaccine
    contraindication — and accounts for roughly 85% of congenital
    agammaglobulinemia. It is curated separately in dismech as
    X-linked_Agammaglobulinemia; that entry, not this one, carries the
    BTK-specific mechanism, and it is deliberately not duplicated here. The
    distinguishing content of the present entry is which pre-BCR component is
    lost and the earlier, more severe presentation that follows.
  disease_term:
    preferred_term: Bruton-type agammaglobulinemia
    term:
      id: MONDO:0010421
      label: Bruton-type agammaglobulinemia
  distinguishing_features:
  - Affects hemizygous males only; a female proband or a consanguineous pedigree points away from XLA
  - Caused by BTK, a cytoplasmic kinase downstream of the pre-BCR, rather than by loss of a pre-BCR structural or proximal signalling component
  - Later onset and less severe complications; the autosomal forms present at younger ages
  - Some BTK alleles are hypomorphic and permit leaky B-cell output, which complete autosomal pre-BCR defects do not
  - Absent BTK protein on flow cytometry or Western blot; a carrier mother shows non-random X inactivation in the B-cell lineage
  evidence:
  - reference: PMID:14752335
    reference_title: "Early defects in B cell development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with autosomal recessive agammaglobulinemia have an earlier onset of
      disease compared with patients with X-linked agammaglobulinemia and they are
      more likely to have severe complications of the disease.
    explanation: >-
      The clinical discriminator between the autosomal forms and XLA.
  - reference: PMID:31696364
    reference_title: "Genetic Approaches for Definitive Diagnosis of Agammaglobulinemia in Consanguineous Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive agammaglobulinemia (ARA) is a primary immunodeficiency
      characterized by absent peripheral B cells, severe hypogammaglobulinemia,
      and absent BTK gene mutations.
    explanation: >-
      Absence of BTK mutations is definitional for the autosomal forms.
  notes: >-
    In a classic male phenotype, BTK testing remains essential even when the
    referring label says "autosomal", because BTK is by far the most likely gene.
- name: Common variable immunodeficiency
  description: >-
    The commonest antibody deficiency in adults. Shares hypogammaglobulinemia and
    recurrent sinopulmonary infection, but the developmental block is absent — B
    cells are made and circulate, and the lesion is in terminal differentiation to
    plasma cells. Curated separately in dismech as Common_Variable_Immunodeficiency.
  disease_term:
    preferred_term: common variable immunodeficiency
    term:
      id: MONDO:0015517
      label: common variable immunodeficiency
  distinguishing_features:
  - CD19+ B cells are present, usually in normal numbers; agammaglobulinemia has under 1-2%
  - IgG is reduced but measurable rather than absent, and IgM is often preserved
  - Onset typically in the second to fourth decade rather than infancy
  - Prominent autoimmunity, lymphoproliferation, granulomatous disease and lymphoma risk, which are not features of agammaglobulinemia
- name: Severe combined immunodeficiency
  description: >-
    Also presents in infancy with profound infection and can have absent B cells,
    but the T-cell compartment is also absent or non-functional, which changes both
    the infection spectrum and the treatment. Curated separately in dismech as
    Severe_Combined_Immunodeficiency.
  disease_term:
    preferred_term: severe combined immunodeficiency
    term:
      id: MONDO:0015974
      label: severe combined immunodeficiency
  distinguishing_features:
  - T cells are absent or non-functional; in agammaglobulinemia T-cell number and function are normal
  - Opportunistic infection (Pneumocystis jirovecii, disseminated CMV, chronic candidiasis) and failure to thrive from the first months of life
  - Abnormal newborn TREC screening; agammaglobulinemia has normal TRECs with low or absent KRECs
  - Requires urgent hematopoietic stem cell transplantation or gene therapy, not immunoglobulin replacement alone
  evidence:
  - reference: PMID:22351933
    reference_title: "Agammaglobulinemia and absent B lineage cells in a patient lacking the p85α subunit of PI3K."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The number and function of the patient's T cells were normal.
    explanation: >-
      Normal T-cell number and function in autosomal agammaglobulinemia is the
      discriminator from SCID.
- name: Transient hypogammaglobulinemia of infancy
  description: >-
    A self-limited, physiological exaggeration of the normal nadir in serum IgG
    that follows catabolism of maternal IgG. It is the benign mimic that must not
    be treated as agammaglobulinemia, and equally must not be diagnosed in a child
    who actually has a developmental B-cell block.
  disease_term:
    preferred_term: transient hypogammaglobulinemia of infancy
    term:
      id: MONDO:0015698
      label: transient hypogammaglobulinemia of infancy
  distinguishing_features:
  - B cells are present in normal numbers
  - IgG is low but detectable and specific antibody responses to protein vaccines are usually intact
  - Immunoglobulin levels normalise spontaneously, typically by 2-4 years of age
  - Infections are milder and invasive bacterial disease is uncommon
- name: Good syndrome (thymoma with immunodeficiency)
  description: >-
    An acquired adult-onset immunodeficiency that is the closest adult phenocopy of
    agammaglobulinemia: thymoma with hypogammaglobulinemia and profoundly reduced or
    absent peripheral B cells. It is the reason a newly agammaglobulinemic adult
    needs chest imaging rather than a paediatric genetic panel.
  disease_term:
    preferred_term: Good syndrome
    term:
      id: MONDO:0015696
      label: Good syndrome
  distinguishing_features:
  - Adult onset, typically in the fifth to sixth decade, with no relevant family history
  - A thymoma is present on chest CT
  - Accompanying CD4+ T-cell lymphopenia and inverted CD4/CD8 ratio, unlike the intact T-cell compartment of congenital agammaglobulinemia
  - Susceptibility extends to opportunistic and viral infection, not only encapsulated bacteria
- name: Secondary hypogammaglobulinemia after B-cell-depleting therapy
  description: >-
    Rituximab and other anti-CD20 agents deplete CD19+ B cells and can produce
    prolonged hypogammaglobulinemia that is laboratory-indistinguishable from
    congenital agammaglobulinemia. Drug exposure history is the discriminator and
    should be sought before any genetic testing in an adult. No MONDO term
    specifically denotes rituximab-induced secondary hypogammaglobulinemia, so
    disease_term is deliberately omitted here rather than bound to an inaccurate
    surrogate.
  distinguishing_features:
  - History of anti-CD20 monoclonal antibody, other B-cell-depleting therapy, or immunosuppression
  - Onset in adulthood after a documented period of normal immunoglobulin levels
  - B-cell numbers usually recover over months to years after drug withdrawal
  - Other secondary causes to exclude include protein-losing enteropathy, nephrotic syndrome and lymphoid malignancy
  evidence:
  - reference: PMID:38792965
    reference_title: "A Nationwide Study of the Delayed Diagnosis and the Clinical Manifestations of Predominantly Antibody Deficiencies and CTLA4-Mediated Immune Dysregulation Syndrome in Greece."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      12 patients with "secondary" hypogammaglobulinemia due to a previous
      B-cell depletion immunotherapy for autoimmune or malignant disease several
      years ago
    explanation: >-
      A national antibody-deficiency cohort documents secondary hypogammaglobulinemia
      following B-cell depletion therapy as a distinct group requiring separation
      from primary antibody deficiency.
- name: POU2AF1 (BOB1) deficiency
  description: >-
    Biallelic loss of the B-cell transcriptional coactivator BOB1/OBF-1
    (POU2AF1) causes agammaglobulinemia, so it is frequently listed alongside the
    autosomal agammaglobulinemia genes. It is deliberately scoped OUT of this
    entry on mechanistic grounds: the defining report is titled
    "Agammaglobulinemia with normal B-cell numbers in a patient lacking Bob1",
    i.e. there is no pro-B to pre-B developmental block and B cells are present,
    which is the opposite of the cellular lesion this entry models and violates
    the absent-CD19+-B-cell criterion used here to separate agammaglobulinemia
    from CVID. MONDO likewise places it directly under agammaglobulinemia
    (MONDO:0015977) rather than under autosomal agammaglobulinemia
    (MONDO:0011096). The lesion is in terminal B-cell differentiation and
    antibody output, not early B lymphopoiesis.
  disease_term:
    preferred_term: agammaglobulinemia, autosomal recessive, due to BOB1 deficiency
    term:
      id: MONDO:0800146
      label: agammaglobulinemia, autosomal recessive, due to BOB1 deficiency
  distinguishing_features:
  - Circulating B-cell numbers are normal, not absent or near-absent
  - The block is in terminal B-cell differentiation and antibody production rather than at the pro-B to pre-B checkpoint
  - MONDO classifies it under agammaglobulinemia (MONDO:0015977), not under autosomal agammaglobulinemia (MONDO:0011096)
  notes: >-
    Primary report PMID:33571536 (Kury et al., J Allergy Clin Immunol 2021). Its
    PubMed record carries no abstract body, so no snippet-backed evidence item is
    asserted here; the exclusion rests on the article title and the MONDO
    placement, both verified directly.
- name: Hyper-IgM syndrome
  description: >-
    Class-switch recombination defects give low IgG and IgA with normal or elevated
    IgM and present with recurrent infection in childhood, so they enter the same
    differential; the preserved or raised IgM and the presence of B cells separate
    them.
  disease_term:
    preferred_term: hyper-IgM syndrome
    term:
      id: MONDO:0003947
      label: hyper-IgM syndrome
  distinguishing_features:
  - Serum IgM is normal or elevated rather than absent
  - CD19+ B cells are present
  - CD40LG (X-linked) deficiency adds opportunistic infection, notably Pneumocystis jirovecii pneumonia, and neutropenia
- name: TOP2B-related B-cell immunodeficiency with distal limb and urogenital anomalies
  description: >-
    Dominant-negative TOP2B variants cause a syndromic B-cell immunodeficiency
    (also called Hoffman syndrome) with facial dysmorphism, distal limb anomalies
    and urogenital malformations alongside the B-cell defect. It is listed here
    explicitly because TOP2B is frequently and incorrectly listed as one of the
    numbered autosomal agammaglobulinemia loci; MONDO assigns it to a separate
    disease (MONDO:0012243, OMIM 609296), not to the AGM series.
  disease_term:
    preferred_term: "B-cell immunodeficiency, distal limb anomalies, and urogenital malformations"
    term:
      id: MONDO:0012243
      label: "B-cell immunodeficiency, distal limb anomalies, and urogenital malformations"
  distinguishing_features:
  - Extra-immune congenital malformations (facial, distal limb, urogenital) that isolated agammaglobulinemia lacks
  - Autosomal dominant, dominant-negative TOP2B variants
  - Classified by MONDO as a distinct disease rather than a numbered autosomal agammaglobulinemia subtype
  evidence:
  - reference: PMID:31409799
    reference_title: "Mutations in topoisomerase IIβ result in a B cell immunodeficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      dominant negative effect on enzyme function, resulting in defective
      proliferation, survival of B-2 cells, causing a block in B cell development,
      and impair humoral function in response to immunization
    explanation: >-
      Yeast and knock-in/knockout mouse work establishes the dominant-negative TOP2B
      mechanism for this separate syndromic entity.
treatments:
- name: Immunoglobulin Replacement Therapy
  description: >-
    Lifelong intravenous (IVIG) or subcutaneous (SCIG) immunoglobulin replacement
    is the mainstay of treatment. It supplies the antibody the patient cannot make,
    reduces the frequency and severity of bacterial infection, and prevents chronic
    enteroviral meningoencephalitis. It does not reverse bronchiectasis already
    established before diagnosis, which is why early recognition matters. Dose and
    interval are individualised to infection control and to the presence of chronic
    lung disease rather than to a single universal trough. Because the autosomal
    forms present earlier, therapy often needs to start in the first months of life.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Immunoglobulin Therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Panhypogammaglobulinemia and Loss of Humoral Immunity
    treatment_effect: BYPASSES
    description: >-
      Passive IgG replacement corrects the humoral effector deficit without
      correcting the upstream developmental block.
  evidence:
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mainstay of treatment is gammaglobulin substitution therapy
    explanation: >-
      GeneReviews states that gammaglobulin substitution is the mainstay of treatment
      for congenital agammaglobulinemia. The chapter covers the X-linked form;
      management is identical in the autosomal forms because the antibody deficit is
      the same, so this is recorded as PARTIAL.
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe, difficult-to-treat enteroviral infections (often manifesting as
      dermatomyositis or chronic meningoencephalitis) can be prevented by this
      treatment.
    explanation: >-
      Documents prevention of chronic enteroviral disease by immunoglobulin
      replacement; sourced from the X-linked chapter, hence PARTIAL.
- name: Antibiotic Therapy and Prophylaxis
  description: >-
    Prompt and generous therapeutic antibiotics for breakthrough infection, with
    prophylactic antibiotics considered for patients who continue to have recurrent
    infection despite optimised immunoglobulin dosing or who have established
    bronchiectasis. Because patients cannot mount antibody responses, serology is
    unreliable and microbiological diagnosis should rely on culture, antigen
    detection or nucleic-acid amplification.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Susceptibility to Recurrent and Invasive Bacterial Infection
    treatment_effect: INHIBITS
    description: >-
      Antibiotics eradicate the bacterial infections that the missing antibody
      cannot prevent or clear.
  evidence:
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Generous use of antibiotics can decrease the incidence of chronic sinusitis
      and lung disease.
    explanation: >-
      GeneReviews supports generous antibiotic use to reduce chronic sinus and lung
      disease in congenital agammaglobulinemia; X-linked chapter, hence PARTIAL.
- name: Avoidance of Live Attenuated Vaccines (Agents to Avoid)
  description: >-
    Live attenuated vaccines are contraindicated. Oral poliovirus vaccine is the
    most important: without neutralising antibody the vaccine strain replicates,
    can revert, and causes vaccine-associated paralytic poliomyelitis — reported
    significantly more often in mu heavy chain (IGHM) deficiency than in BTK
    deficiency. Inactivated poliovirus vaccine should be used instead, for the
    patient and for household contacts. Other live products (MMR, varicella,
    rotavirus, BCG, live attenuated influenza, oral typhoid, yellow fever) should
    likewise be withheld. Inactivated vaccines are safe though responses are
    minimal; immunising household contacts provides indirect protection.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Preventive Intervention
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  target_mechanisms:
  - target: Vulnerability to Live Attenuated Vaccine Strains
    treatment_effect: INHIBITS
    description: >-
      Withholding replicating vaccine strains removes the exposure entirely.
  evidence:
  - reference: PMID:30240888
    reference_title: "Comparison of Common Monogenic Defects in a Large Predominantly Antibody Deficiency Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paralysis following live polio vaccination was considerably higher in patients
      with μ heavy chain deficiency compared with BTK deficiency (P < .001).
    explanation: >-
      Directly demonstrates the excess vaccine-associated paralysis risk in an
      autosomal (IGHM) form, the strongest available justification for the
      live-vaccine contraindication in autosomal agammaglobulinemia.
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Live viral
      vaccines, particularly oral polio vaccine.
    explanation: >-
      The GeneReviews Agents/Circumstances to Avoid recommendation. Written for the
      X-linked form; the underlying reason (no neutralising antibody) is identical in
      the autosomal forms, so this is recorded as PARTIAL.
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inactivated polio vaccine (as opposed to live oral polio vaccine) should be
      given to affected individuals and their family contacts.
    explanation: >-
      Specifies the substitution of inactivated for oral poliovirus vaccine,
      including for household contacts; X-linked chapter, hence PARTIAL.
- name: Respiratory Surveillance and Airway Clearance
  description: >-
    Annual quantitative immunoglobulins and full blood count, chest and sinus
    imaging as indicated, and pulmonary function testing once age-appropriate.
    Established bronchiectasis is managed with airway-clearance physiotherapy and
    specialist respiratory input.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Progressive Airway Damage and Bronchiectasis
    treatment_effect: INHIBITS
    description: >-
      Surveillance detects, and airway clearance limits progression of, chronic
      suppurative lung disease.
  evidence:
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complete blood count with differential and quantitative serum
      immunoglobulins at least annually; chest and sinus imaging as needed to assess
      for chronic lung and/or sinus disease.
    explanation: >-
      The GeneReviews surveillance schedule for congenital agammaglobulinemia;
      X-linked chapter, hence PARTIAL.
- name: Allogeneic Hematopoietic Cell Transplantation
  description: >-
    Not routine therapy for isolated agammaglobulinemia, because immunoglobulin
    replacement is effective and transplantation carries substantial risk. It is
    reserved for selected patients — uncontrollable complications, or a genotype
    with a broader haematopoietic defect where immune reconstitution is
    established, such as some SLC39A7/AGM9 cases.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Developmental Arrest at the Pro-B to Pre-B Transition
    treatment_effect: INHIBITS
    description: >-
      Donor haematopoiesis supplies genetically normal B-cell progenitors that can
      traverse the pre-BCR checkpoint.
  notes: >-
    The OMIM/MONDO description of agammaglobulinemia 9 (SLC39A7, MONDO:0030519)
    states that more severe cases may require hematopoietic stem cell
    transplantation whereas others are treated effectively with immunoglobulin
    replacement. No transplant-outcome series specific to autosomal
    agammaglobulinemia was identified with a quotable abstract, so no evidence item
    is asserted.
- name: Genetic Counseling and Family Testing
  description: >-
    Confirming the molecular diagnosis defines the mode of inheritance and the
    recurrence risk: 25% for siblings in an autosomal recessive family, 50% for the
    offspring of an affected heterozygote in the dominant forms (many of which are
    de novo). Cascade testing of at-risk relatives allows immunoglobulin
    replacement to begin before infection and live vaccines to be avoided. Because
    autosomal agammaglobulinemia is genetically heterogeneous, an
    inborn-errors-of-immunity panel or exome sequencing — including
    deletion/duplication analysis — is preferred over serial single-gene testing.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31696364
    reference_title: "Genetic Approaches for Definitive Diagnosis of Agammaglobulinemia in Consanguineous Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES has the potential to provide a rapid and more accurate genetic diagnosis
      in ARA, which is crucial for the treatment of the patients.
    explanation: >-
      Supports exome sequencing over serial single-gene testing in this genetically
      heterogeneous disorder.
  - reference: PMID:31696364
    reference_title: "Genetic Approaches for Definitive Diagnosis of Agammaglobulinemia in Consanguineous Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We concluded that conventional gene sequencing, especially when multiple genes
      are involved in the defect as is the case in ARA, is costly and time-consuming,
      resulting in delayed diagnosis that contributes to increased morbidity and
      mortality.
    explanation: >-
      Explicitly links serial single-gene testing to diagnostic delay and worse
      outcomes.
diagnosis:
- name: Quantitative serum immunoglobulins
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Measurement of serum IgG, IgA and IgM against age-specific reference
    intervals. All three isotypes are severely reduced or undetectable. IgM and
    IgA are informative even in early infancy because, unlike IgG, they are not
    contributed by transplacental maternal transfer.
  markers: Serum IgG, IgA and IgM
  results: Severe reduction or absence of all immunoglobulin isotypes
  evidence:
  - reference: PMID:31696364
    reference_title: "Genetic Approaches for Definitive Diagnosis of Agammaglobulinemia in Consanguineous Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive agammaglobulinemia (ARA) is a primary immunodeficiency
      characterized by absent peripheral B cells, severe hypogammaglobulinemia,
      and absent BTK gene mutations.
    explanation: >-
      Severe hypogammaglobulinemia with absent peripheral B cells is the
      laboratory definition of the disorder.
- name: Lymphocyte subset flow cytometry
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  description: >-
    Enumeration of CD19+ (or CD20+) B cells, CD3/CD4/CD8 T cells and NK cells.
    The discriminating pattern is CD19+ B cells below 1-2% of lymphocytes with
    numerically and functionally normal T cells: B cells are present in common
    variable immunodeficiency, and T cells are also absent in severe combined
    immunodeficiency.
  markers: CD19+ B cell percentage; CD3/CD4/CD8 T cell counts
  results: CD19+ B cells profoundly reduced with normal T cell numbers
  evidence:
  - reference: PMID:22351933
    reference_title: "Agammaglobulinemia and absent B lineage cells in a patient lacking the p85α subunit of PI3K."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The number and function of the patient's T cells were normal.
    explanation: >-
      Preserved T-cell number and function alongside absent B cells is the
      pattern that separates agammaglobulinemia from combined immunodeficiency.
- name: Molecular genetic testing (IEI panel or exome sequencing)
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    BTK testing remains essential in a male proband even when the referral says
    "autosomal". Beyond that, because the autosomal forms are genetically
    heterogeneous, an inborn-errors-of-immunity panel covering at least IGHM,
    IGLL1, CD79A, CD79B, BLNK, PIK3R1, TCF3, SLC39A7, SPI1 and LRRC8A, or
    trio exome sequencing, is preferred over serial single-gene testing.
    Deletion/duplication analysis should be included because sequence-only
    assays miss exon-level copy-number changes such as the large IGHM deletions.
  results: Biallelic (or, for the dominant forms, heterozygous de novo) pathogenic variant identified
  evidence:
  - reference: PMID:31696364
    reference_title: "Genetic Approaches for Definitive Diagnosis of Agammaglobulinemia in Consanguineous Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES has the potential to provide a rapid and more accurate genetic diagnosis
      in ARA, which is crucial for the treatment of the patients.
    explanation: >-
      Directly supports exome sequencing over serial single-gene testing in this
      genetically heterogeneous disorder.
  - reference: PMID:31696364
    reference_title: "Genetic Approaches for Definitive Diagnosis of Agammaglobulinemia in Consanguineous Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We concluded that conventional gene sequencing, especially when multiple genes
      are involved in the defect as is the case in ARA, is costly and time-consuming,
      resulting in delayed diagnosis that contributes to increased morbidity and
      mortality.
    explanation: >-
      Links serial single-gene testing to diagnostic delay and worse outcomes.
- name: KREC-based newborn screening
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Kappa-deleting recombination excision circles (KRECs) are a by-product of
    B-cell receptor light-chain rearrangement and are low or undetectable from
    birth when B-cell development is blocked. Combined TREC/KREC newborn
    screening can therefore identify severe B-cell lymphopenia before the first
    infection, allowing immunoglobulin replacement to start early and live
    vaccines to be avoided. TRECs are normal, which distinguishes the pattern
    from severe combined immunodeficiency. KREC screening is not universally
    implemented and may miss hypomorphic, leaky genotypes.
  markers: KREC copy number (with TREC as the T-cell comparator)
  results: KRECs low or undetectable with normal TRECs
  evidence:
  - reference: PMID:34241796
    reference_title: "Agammaglobulinemia: from X-linked to Autosomal Forms of Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some diagnostic innovations, such as KREC level measurements and serum BCMA
      measurements, may aid in facilitating an earlier identification of
      agammaglobulinemia leading to prompt treatment.
    explanation: >-
      Supports KREC measurement as a route to earlier identification of
      agammaglobulinemia.
  notes: >-
    Because patients cannot mount antibody responses, vaccine-response serology
    is uninformative and should not be used to establish or exclude the
    diagnosis; deliberate live-vaccine challenge is contraindicated.
notes: >-
  Gene-to-numbered-subtype mapping was re-derived independently from MONDO and
  OMIM using OAK (RO:0004003 "has material basis in germline mutation in"
  relationships plus OMIM xrefs) rather than taken from the curation brief or the
  deep-research report. The verified series is: AGM1 / MONDO:0020729 /
  OMIM:601495 = IGHM (AR); AGM2 / MONDO:0013287 / OMIM:613500 = IGLL1 (AR); AGM3 /
  MONDO:0013288 / OMIM:613501 = CD79A (AR); AGM4 / MONDO:0013289 / OMIM:613502 =
  BLNK (AR); AGM5 / MONDO:0013290 / OMIM:613506 = LRRC8A (AD); AGM6 /
  MONDO:0012987 / OMIM:612692 = CD79B (AR); AGM7 / MONDO:0014083 / OMIM:615214 =
  PIK3R1 (AR); AGM8 / MONDO:0014840 / OMIM:616941 = TCF3 (AD); AGM8B /
  MONDO:0859234 / OMIM:619824 = TCF3 (AR); AGM9 / MONDO:0030519 / OMIM:619693 =
  SLC39A7 (AR); and AGM10 / MONDO:0030529 / OMIM:619707 = SPI1 (AD). Two
  corrections resulted: LRRC8A (AGM5) is a numbered locus that is routinely
  omitted from gene lists, and AGM10 is SPI1, not TOP2B — TOP2B causes a separate
  syndromic disease (MONDO:0012243, OMIM:609296) recorded under
  differential_diagnoses. Note that MONDO places AGM1-AGM9 under
  MONDO:0011096 (their definitions read "Any autosomal agammaglobulinemia in
  which..."), whereas AGM8B (MONDO:0859234) and AGM10 (MONDO:0030529) sit
  directly under agammaglobulinemia (MONDO:0015977); both are nonetheless
  retained here on the strength of the numbered-series naming and their gene
  assertions. FNIP1 (MONDO:0100432, FNIP1-associated syndrome) is a further
  autosomal cause outside the numbered series and is retained as a syndromic
  subtype, with its hypertrophic cardiomyopathy scoped to that subtype.
  POU2AF1/BOB1 (MONDO:0800146) was deliberately scoped OUT and moved to
  differential_diagnoses: its defining report (PMID:33571536) is titled
  "Agammaglobulinemia with normal B-cell numbers in a patient lacking Bob1", so
  it has no pro-B to pre-B block and does not satisfy the absent-B-cell criterion
  this entry is built on.

  GeneReviews has no chapter for the autosomal forms; the only agammaglobulinemia
  chapter is "X-Linked Agammaglobulinemia" (PMID:20301626). Its cached content is
  fully minable (Clinical Characteristics, Management and Agents/Circumstances to
  Avoid are all present), and it is used here for the shared antibody-deficiency
  clinical and management content, always marked supports: PARTIAL with an
  explanation that the source cohort is X-linked. Claims specific to the autosomal
  forms use autosomal-specific primary sources instead, and no XLA-specific
  frequency figures are carried over as frequency bands.

  Deep research: Edison/Falcon, 553 s. Its 17 citations resolved to only four
  distinct works (Ben-Ali 2020, Della Mina 2021, Cardenas-Morales 2022, Tangye
  2023), so the entry was built primarily from an independent PubMed E-utilities
  sweep of the primary gene-discovery literature. The Falcon report proposed two
  ontology identifiers that OAK showed to be semantically wrong — HP:0030245 was
  offered for "Tonsillar hypoplasia" but is actually Intrapartum fever, and
  HP:0031693 was offered for "Recurrent viral infections" but is actually Severe
  Epstein Barr virus infection. Neither was used. The report also omitted LRRC8A
  and SPI1 while presenting TOP2B as a numbered AGM locus.
references:
- reference: PMID:20301626
  title: "X-Linked Agammaglobulinemia."
  tags:
  - GeneReviews
  findings:
  - statement: >-
      Recurrent otitis is the commonest infection prior to diagnosis in congenital
      agammaglobulinemia, with conjunctivitis, sinopulmonary infection, diarrhea
      and skin infection also frequent.
    supporting_text: >-
      Recurrent otitis is the most common infection prior to diagnosis.
  - statement: >-
      A majority of affected individuals are recognised only when they develop a
      severe, life-threatening infection.
    supporting_text: >-
      they develop a severe, life-threatening infection such as pneumonia, empyema,
      meningitis, sepsis, cellulitis, or septic arthritis
  - statement: >-
      Gammaglobulin substitution therapy is the mainstay of treatment.
    supporting_text: >-
      The mainstay of treatment is gammaglobulin substitution therapy
  - statement: >-
      Agents and circumstances to avoid are live viral vaccines, particularly oral
      polio vaccine; inactivated poliovirus vaccine should be substituted, for
      affected individuals and their family contacts.
    supporting_text: >-
      Inactivated polio vaccine (as opposed to live oral polio vaccine) should be
      given to affected individuals and their family contacts.
  - statement: >-
      This chapter covers the X-linked form only; no GeneReviews chapter exists
      for the autosomal forms. It is therefore used in the present entry solely
      for the shared antibody-deficiency clinical and management content, always
      with supports PARTIAL.
- reference: PMID:34241796
  title: "Agammaglobulinemia: from X-linked to Autosomal Forms of Disease."
  findings:
  - statement: >-
      XLA accounts for approximately 85% of congenital agammaglobulinemia; the
      autosomal recessive forms present at younger ages and with more severe
      clinical features.
    supporting_text: >-
      In contrast, while less common, autosomal recessive forms of
      agammaglobulinemia present at younger ages and with typically more severe
      clinical features resulting in an earlier diagnosis.
- reference: PMID:37273190
  title: "Inborn errors of human B cell development, differentiation, and function."
  findings:
  - statement: >-
      Contemporary framework review integrating pre-BCR, PI3K, transcriptional,
      ionic and metabolic defects of human B-cell development, using monogenic
      patients as natural experiments defining essential pathways.
    supporting_text: >-
      analysis of individuals with monogenic defects that disrupt immune cell
      function are unprecedented models to link genotypes to clinical phenotypes,
      establish mechanisms of disease pathogenesis, and elucidate critical pathways
      for immune cell development and differentiation

name: Autosomal Agammaglobulinemia
creation_date: "2026-08-01T09:00:00Z"
category: Mendelian
synonyms:
- Autosomal recessive agammaglobulinemia
- ARA
- AGM
- Agammaglobulinemia, non-Bruton type
- Non-Bruton agammaglobulinemia
- Autosomal dominant agammaglobulinemia
description: >-
  Autosomal (non-Bruton) agammaglobulinemia is the collective term for the
  autosomal recessive and autosomal dominant forms of congenital
  agammaglobulinemia — the roughly 10-15% of cases that are not caused by BTK.
  The unifying lesion is a block in early B-cell development at the pro-B to
  pre-B transition in the bone marrow, because the pre-B-cell receptor (pre-BCR)
  cannot be assembled or cannot signal. Biallelic loss of pre-BCR structural
  components (IGHM mu heavy chain, IGLL1 lambda5 surrogate light chain) or of
  its signalling module and proximal adaptor (CD79A/Igalpha, CD79B/Igbeta, BLNK)
  abolishes the positive-selection checkpoint that drives pro-B cells forward. A
  second arm involves PIK3R1 and the transcriptional
  and homeostatic regulators of B lymphopoiesis (TCF3/E47, SPI1/PU.1, SLC39A7,
  LRRC8A) plus the metabolic regulator FNIP1. The result is absent or
  near-absent circulating CD19+ B cells, no plasma cells, and profound
  hypogammaglobulinemia across all isotypes, with numerically and functionally
  normal T cells. Affected children
  present after maternal IgG wanes (around 6 months) with recurrent
  sinopulmonary and invasive bacterial infection; bronchiectasis develops if
  diagnosis is delayed, and chronic enteroviral meningoencephalitis is a feared
  complication. Compared with X-linked agammaglobulinemia (XLA), autosomal
  forms present earlier and more severely. Lifelong immunoglobulin replacement
  is the mainstay of treatment, and live attenuated vaccines — particularly
  oral poliovirus vaccine — are contraindicated.

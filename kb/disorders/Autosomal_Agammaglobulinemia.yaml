  - reference: PMID:14660746
    reference_title: "A congenital mutation of the novel gene LRRC8 causes agammaglobulinemia in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results indicate that LRRC8 is responsible for the B cell deficiency
      in this patient and is required for B cell development.
    explanation: >-
      The authors conclude that LRRC8 (LRRC8A) causes the B-cell deficiency in
      this patient with congenital agammaglobulinemia; MONDO assigns this gene to
      agammaglobulinemia 5, autosomal dominant.

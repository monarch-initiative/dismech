    term:
      id: hgnc:29418
      label: FNIP1
  evidence:
  - reference: PMID:32905580
    reference_title: "Absent B cells, agammaglobulinemia, and hypertrophic cardiomyopathy in folliculin-interacting protein 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FNIP1 deficiency is a novel inborn error of immunity characterized by early
      and severe B-cell development defect, agammaglobulinemia, variable
      neutropenia, and HCM.
    explanation: >-
      Defines the FNIP1 entity, including the syndromic cardiac feature that
      separates it from the numbered AGM subtypes.
pathophysiology:
- name: Loss of a Pre-B-Cell Receptor Structural or Signalling Component
  description: >-
    Biallelic loss-of-function variants remove or inactivate one of the proteins
    that build or transduce the pre-B-cell receptor: the membrane form of the mu
    heavy chain (IGHM), the lambda5/14.1 surrogate light chain (IGLL1), the
    Igalpha/Igbeta signal-transduction heterodimer (CD79A, CD79B), or the
    receptor-proximal cytoplasmic adaptor BLNK that organises signalling
    immediately downstream of it. This is the proximal molecular lesion in the
    majority of autosomal agammaglobulinemia.
  biological_scale: MOLECULAR
  role: Primary
  genes:
  - preferred_term: IGHM
    term:
      id: hgnc:5541
      label: IGHM
  - preferred_term: IGLL1
    term:
      id: hgnc:5870
      label: IGLL1
  - preferred_term: CD79A
    term:
      id: hgnc:1698
      label: CD79A
  - preferred_term: CD79B
    term:
      id: hgnc:1699
      label: CD79B
  - preferred_term: BLNK
    term:
      id: hgnc:14211
      label: BLNK
  protein_complexes:
  - preferred_term: pre-B cell receptor complex
    term:
      id: GO:0035369
      label: pre-B cell receptor complex
  biological_processes:
  - preferred_term: pre-B cell receptor expression
    term:
      id: GO:0002330
      label: pre-B cell receptor expression
    modifier: DECREASED
  evidence:
  - reference: PMID:17709424
    reference_title: "Mutations of the Igbeta gene cause agammaglobulinemia in man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on the first patient with agammaglobulinemia caused by a
      homozygous nonsense mutation in Igbeta, which is a transmembrane protein
      that associates with Igalpha as part of the preBCR complex.
    explanation: >-
      Names Igbeta as a pre-BCR complex component whose loss causes
      agammaglobulinemia.
  - reference: PMID:8890099
    reference_title: "Mutations in the mu heavy-chain gene in patients with agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This implies that an intact membrane-bound mu chain is essential for B-cell
      development.
    explanation: >-
      Establishes the membrane mu heavy chain as an indispensable pre-BCR
      structural component.
  downstream:
  - target: Failure of Pre-B-Cell Receptor Assembly and Signalling
    description: >-
      Absence of any obligate structural or signalling subunit prevents surface
      assembly of a functional pre-BCR.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17709424
      reference_title: "Mutations of the Igbeta gene cause agammaglobulinemia in man."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Transfection experiments using Drosophila melanogaster S2 Schneider cells
        showed that the mutant Igbeta is no longer able to associate with
        Igalpha, and that assembly of the BCR complex on the cell surface is
        abrogated.
      explanation: >-
        Direct in-vitro demonstration that the mutant component abolishes
        receptor assembly at the cell surface.
- name: Loss of a Transcriptional or Homeostatic Regulator of B Lymphopoiesis
  description: >-
    A mechanistically distinct arm in which the pre-BCR proteins themselves are
    intact but the cellular program that permits their expression and signalling
    fails. For the transcriptional regulators (TCF3/E47, SPI1/PU.1) and PIK3R1
    the lesion acts developmentally earlier than the pre-BCR structural defects;

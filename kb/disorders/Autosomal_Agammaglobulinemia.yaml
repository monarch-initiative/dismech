discussions:
- discussion_id: gap_autosomal_agamma_lrrc8a
  kind: KNOWLEDGE_GAP
  prompt: Does the historical LRRC8A truncation define a reproducible dominant agammaglobulinemia mechanism?
  rationale: The human claim rests on a single balanced-translocation case. ClinGen labels the relationship Limited. Forced mutant expression and global null mouse studies use different allele mechanisms; preserved null-mouse antibody function cannot establish or refute a dominant human effect. Additional unrelated families and allele-specific functional evidence are needed.
  attaches_to:
  - pathophysiology#Truncated LRRC8A Protein
  evidence:
  - reference: url:https://thegencc.org/submissions/SGC-107391.2
    reference_title: LRRC8A | agammaglobulinemia | Autosomal dominant by ClinGen submission information facts
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Since other patients with B cell deficiency and heterozygous LRRC8A have not been identified, the curation is classified as Limited.
    explanation: ClinGen explains the Limited classification by the lack of additional human cases.
  - reference: PMID:24752297
    reference_title: Leucine-rich repeat containing 8A (LRRC8A) is essential for T lymphocyte development and function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Lrrc8a(-/-) mice displayed a modest block in B cell development but intact intrinsic B cell function.
    explanation: Global null mice have a different allele mechanism from the single human heterozygous truncation.
- discussion_id: gap_autosomal_agamma_spi1_penetrance
  kind: KNOWLEDGE_GAP
  prompt: What predicts onset, expressivity and long-term risk in SPI1 carriers?
  rationale: The 2025 cohort has22 agammaglobulinemic patients,5 relatives with milder antibody abnormalities and6 apparently unaffected relatives. Its81.8% estimate concerns any antibody phenotype and is affected by familial ascertainment and possible later onset. No hematologic malignancy was observed over514 patient-years, but the small cohort cannot establish zero risk. The L180F family has marked within-family variation; a simple PU.1 abundance-to-severity relationship is not established.
  attaches_to:
  - pathophysiology#Reduced PU.1 Dosage or Activity
  evidence:
  - reference: url:https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    reference_title: https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: 6 were clinically well with laboratory evaluations documenting serum antibody and circulating B-cell concentrations within age- adjusted normal ranges.
    explanation: Six variant-carrying relatives had normal clinical and laboratory assessments at the study time; ascertainment and possible later onset limit penetrance estimates.
  - reference: url:https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    reference_title: https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: our cohort remains too small to conclude that inborn LOF PU.1 variants convey 0 malignancy risks.
    explanation: The authors explicitly limit inference from the absence of observed blood cancers.
- discussion_id: gap_autosomal_agamma_transplant
  kind: KNOWLEDGE_GAP
  prompt: Which genetic forms benefit from transplantation, and which compartments must be corrected?
  rationale: ZIP7 sibling outcomes contrast with two SPI1 attempts that did not achieve independence from replacement. Persistent tissue-resident macrophages and donor competitive advantage are proposed explanations in SPI1, not demonstrated mechanisms. Gene-specific outcome data and donor genotype matter; immunologic improvement must be distinguished from skin or other organ recovery.
  attaches_to:
  - treatments#Allogeneic Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:30718914
    reference_title: An essential role for the Zn(2+) transporter ZIP7 in B cell development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: (P1 and P2, family 1) additionally showed severe blistering dermatosis (Fig. 1b), failure to thrive and thrombocytopenia, prompting hematopoietic stem cell transplantation; this resulted in cure of immunologic abnormalities and amelioration of skin disease.
    explanation: Two siblings among six ZIP7-deficient patients had severe skin disease, poor growth and thrombocytopenia; transplantation outcomes are specific to them.
  - reference: url:https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    reference_title: https://pure.eur.nl/ws/portalfiles/portal/198591090/1-s2.0-S0006497125002174-main.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Five years after transplantation, he remains IRT dependent because of undetectable serum immunoglobulin (IgA) and IgM despite naïve B-cell reconstitution and >99% donor peripheral blood engraftment in B-cell, T-cell, and myeloid cell compart- ments.
    explanation: Long-term SPI1 follow-up documents persistent antibody-production failure despite donor engraftment.
- discussion_id: gap_autosomal_agamma_fnip_cardio
  kind: KNOWLEDGE_GAP
  prompt: How does FNIP1 deficiency produce cardiomyopathy and variable neutropenia?
  rationale: The clinical syndrome is genetically associated with these features, but small B-cell metabolic assays do not establish heart or granulocyte causal pathways. The original marrow observation lacks a discrete block, and later cases differ in neutrophil number and stimulus-dependent function.
  attaches_to:
  - pathophysiology#FNIP1 Protein Deficiency
  - pathophysiology#Increased B-Cell Mitochondrial Abundance
  - pathophysiology#Increased B-Cell Mitochondrial Activity Signal
  - pathophysiology#Increased B-Cell AKT Phosphorylation
  - pathophysiology#Increased B-Cell 4EBP1 Phosphorylation
  evidence:
  - reference: url:https://repositorio.udd.cl/server/api/core/bitstreams/a9d54a3e-518c-4beb-ac3d-b570765e7314/content
    reference_title: https://repositorio.udd.cl/server/api/core/bitstreams/a9d54a3e-518c-4beb-ac3d-b570765e7314/content
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Specifically, p4EBP1 and pAkt473 were significantly activated ( 12.46±1.86 vs 4.00±0.53, p = 0.00 02; 3.82±1.78 vs 0.97±0. 09, p = 0.029). As opposite, no difference could be found in S6 phosphorylation (1.46±0.14 vs 2.70±0.51, p = 0.14).
    explanation: One patient marrow comparison showed increased p4EBP1 and pAKT473 but not pS6; small repeated assays do not expand the donor count.
  - reference: url:https://repositorio.udd.cl/server/api/core/bitstreams/a9d54a3e-518c-4beb-ac3d-b570765e7314/content
    reference_title: https://repositorio.udd.cl/server/api/core/bitstreams/a9d54a3e-518c-4beb-ac3d-b570765e7314/content
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: B -cell precursors did not show evidence of a maturation block, unlike classical agammaglobulinemia14, although a relative increase of earlier maturation stages (pro-B and pre-B1) and a significant reduction of immature B-cells was observed (Figure 1E and supplemental Figure 8).
    explanation: One patient had altered precursor proportions without a discrete maturation block, limiting a universal pro-B arrest model.
  - reference: url:https://repositorio.udd.cl/server/api/core/bitstreams/a9d54a3e-518c-4beb-ac3d-b570765e7314/content
    reference_title: https://repositorio.udd.cl/server/api/core/bitstreams/a9d54a3e-518c-4beb-ac3d-b570765e7314/content
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Indeed, circulating P1 B-cells exhibited increased numbers of mitochondria and mitochondrial activity relative to healthy control (HC) B-cells (Figure 1F and supplemental Figure 9 ).
    explanation: Mitochondrial dye readouts were measured in rare circulating B cells from one patient compared with a healthy control; they do not establish a general ATP-production flux.

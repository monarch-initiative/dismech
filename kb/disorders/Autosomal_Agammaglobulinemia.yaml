    reference_title: "An essential role for the Zn(2+) transporter ZIP7 in B cell development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The immunodeficiency results from hypomorphic mutations of SLC39A7, which
      encodes the endoplasmic reticulum-to-cytoplasm zinc transporter ZIP7.
    explanation: >-
      Identifies hypomorphic SLC39A7 variants as the cause of this B-cell
      developmental immunodeficiency.
- name: AGM10
  display_name: "Agammaglobulinemia 10, autosomal dominant (SPI1/PU.1 haploinsufficiency)"
  description: >-
    Heterozygous, largely de novo SPI1 variants causing PU.1 haploinsufficiency.
    PU.1 is a pioneer transcription factor that decompacts heterochromatin;
    haploinsufficiency constrains euchromatin accessibility for the non-pioneer
    transcription factors that drive the pro-B to pre-B transition. Patients
    also have few conventional dendritic cells. Note that this locus is SPI1,
    not TOP2B, which is a frequent mis-assignment. MONDO places this term directly
    under agammaglobulinemia (MONDO:0015977) rather than under autosomal
    agammaglobulinemia (MONDO:0011096).
  subtype_term:
    preferred_term: agammaglobulinemia 10, autosomal dominant
    term:
      id: MONDO:0030529
      label: agammaglobulinemia 10, autosomal dominant
  genes:
  - preferred_term: SPI1
    term:
      id: hgnc:11241
      label: SPI1
  evidence:
  - reference: PMID:33951726
    reference_title: "Constrained chromatin accessibility in PU.1-mutated agammaglobulinemia patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings molecularly describe a novel form of agammaglobulinemia and
      underscore PU.1's critical, dose-dependent role as a hematopoietic
      euchromatin gatekeeper.
    explanation: >-
      Establishes SPI1/PU.1 haploinsufficiency as a distinct autosomal dominant
      form of agammaglobulinemia.
- name: FNIP1
  display_name: "FNIP1-associated syndrome (autosomal recessive)"
  description: >-
    Biallelic FNIP1 loss disrupts the AMPK/mTOR metabolic program of the
    developing B cell, producing an early and severe B-cell developmental block
    with agammaglobulinemia. Unlike the numbered AGM subtypes it is syndromic:
    hypertrophic cardiomyopathy and variable neutropenia accompany the immune
    defect, and MONDO classifies it as FNIP1-associated syndrome rather than as
    a numbered autosomal agammaglobulinemia.
  subtype_term:
    preferred_term: FNIP1-associated syndrome
    term:
      id: MONDO:0100432
      label: FNIP1-associated syndrome
  genes:

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No direct population prevalence or incidence estimate exists for autosomal
    agammaglobulinemia as an umbrella category. What is reported is its share of
    congenital agammaglobulinemia: XLA accounts for approximately 85% of cases,
    and registry data put autosomal recessive agammaglobulinemia at roughly
    5-10%, so the autosomal forms collectively represent on the order of 10-15%
    of congenital agammaglobulinemia. Because congenital agammaglobulinemia
    itself is on the order of 1 in 200,000 births, the autosomal forms are
    ultra-rare; the qualitative class is recorded rather than a fabricated
    numeric rate. Individual genes beyond IGHM are represented by single
    families or very small series.
  evidence:
  - reference: PMID:34241796
    reference_title: "Agammaglobulinemia: from X-linked to Autosomal Forms of Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While the most common cause of congenital agammaglobulinemia is X-linked
      agammaglobulinemia (XLA), accounting for approximately 85% of cases, other
      genetic forms of agammaglobulinemia have been identified.
    explanation: >-
      Establishes that non-XLA (autosomal) forms make up roughly the remaining
      15% of congenital agammaglobulinemia.
  - reference: PMID:38683392
    reference_title: "B-cells absence in patients diagnosed as inborn errors of immunity: a registry-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 80 to 90% of individuals exhibit genetic variations in
      Bruton's agammaglobulinemia tyrosine kinase (BTK), whereas a minority of
      cases, around 5-10%, are autosomal recessive agammaglobulinemia (ARA).
    explanation: >-
      A registry-based study quantifies the autosomal recessive share of
      hypogammaglobulinemia-without-B-cells at 5-10%.

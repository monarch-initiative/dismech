- name: AGM4
  display_name: "Agammaglobulinemia 4, autosomal recessive (BLNK)"
  description: >-
    Deficiency of the cytoplasmic adaptor BLNK (B-cell linker protein), which
    organises signalling downstream of the pre-BCR. Pro-B cells are present in
    normal numbers but pre-B and mature B cells are absent.
  subtype_term:
    preferred_term: agammaglobulinemia 4, autosomal recessive
    term:
      id: MONDO:0013289
      label: agammaglobulinemia 4, autosomal recessive
  genes:
  - preferred_term: BLNK
    term:
      id: hgnc:14211
      label: BLNK
  evidence:
  - reference: PMID:10583958
    reference_title: "An essential role for BLNK in human B cell development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although this patient had normal numbers of pro-B cells, he had no pre-B
      cells or mature B cells, indicating that BLNK plays a critical role in
      orchestrating the pro-B cell to pre-B cell transition.
    explanation: >-
      Localises the BLNK-deficiency block precisely at the pro-B to pre-B
      transition.
- name: AGM5
  display_name: "Agammaglobulinemia 5, autosomal dominant (LRRC8A)"
  description: >-
    Autosomal dominant agammaglobulinemia caused by a truncating LRRC8A allele
    arising from a balanced t(9;20) translocation, reported in a girl with
    congenital agammaglobulinemia and minor facial anomalies. LRRC8A encodes the
    essential subunit of the volume-regulated anion channel. This subtype is
    represented by a single kindred and is the numbered locus most often omitted
    from summary gene lists.
  subtype_term:
    preferred_term: agammaglobulinemia 5, autosomal dominant
    term:
      id: MONDO:0013290
      label: agammaglobulinemia 5, autosomal dominant

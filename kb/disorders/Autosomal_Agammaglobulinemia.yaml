    numbered-series naming and the TCF3 gene assertion. The primary report is
    PMID:28532655 (homozygous TCF3, severe hypogammaglobulinemia and B-cell ALL),
    which is indexed in PubMed without an abstract, so no evidence item is
    asserted rather than fabricating a snippet.
  subtype_term:

- name: ZIP7-mutant mouse B-cell signaling and zinc assays
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: IL7-expanded P198A homozygous and wild-type mouse marrow B cells; ex-vivo SWHEL immature B cells
  publication: PMID:30718914
  description: Compartment-targeted FRET-FLIM measures free zinc in expanded cultures. Separate ex-vivo assays measure broad phosphatase activity and antigen-induced phosphorylation with equivalent surface BCR expression. These assays support several linked abnormalities without proving one necessary PTEN-mediated sequence.
  notes: The cultured zinc assay and ex-vivo signaling assays use different preparations. No UPR transcriptional signature or altered Xbp1 splicing was observed; there was no measured ER free-zinc overload. PTEN haploinsufficiency failed to rescue maturation. Findings do not establish human zinc treatment efficacy.

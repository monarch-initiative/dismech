        explanation: Edited cord-blood progenitors carry mixtures of near-variant indels, not precise patient-allele knock-ins; lineage selection supports but does not isolate the chromatin mediator.
animal_models:
- name: Slc39a7 hypomorphic mice and mixed marrow chimeras
  species: Mouse
  genotype: Slc39a7 P198A homozygous, H199QV homozygous or P198A/H199QV compound heterozygous
  description: Global knock-in and engineered hypomorphic alleles cause allele-dependent growth/skin abnormalities and profound B-cell deficiency. P198A is orthologous to human P190A. Mixed WT/mutant marrow chimeras demonstrate a B-cell intrinsic late-pre-B to immature-stage block.
  publication: PMID:30718914
  notes: Null/null and null/hypomorph animals could not be obtained; these are not equivalent to viable complete-null patient models. Few P198A homozygotes survived past six weeks. Oral zinc did not rescue the tested marrow-reconstitution model. BCL2 increased peripheral numbers without relieving the block; B-cell PTEN haploinsufficiency also failed to rescue maturation. Phenotyping was not randomized or blinded.
  evidence:
  - reference: PMID:30718914
    reference_title: An essential role for the Zn(2+) transporter ZIP7 in B cell development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Mice with homozygous (ZIP7P198A/P198A or ZIP7H199QV/H199QV) or compound heterozygous (ZIP7P198A/H199QV) hypomorphic mutations demonstrated profound B cell immunodeficiency
    explanation: Global hypomorphic alleles produce B-cell deficiency; H199QV is engineered rather than a human allele.
  - reference: PMID:30718914
    reference_title: An essential role for the Zn(2+) transporter ZIP7 in B cell development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Eight weeks after BM transfer, our analysis confirmed a B cell intrinsic block in development, which was most evident in a failure to progress from the late pre-B (FrD) to immature B (FrE) cell stage, with no residual mutant cells in the recirculating FrF population
    explanation: Mixed marrow chimeras show cell-intrinsic developmental failure strongest at late-pre-B to immature transition.

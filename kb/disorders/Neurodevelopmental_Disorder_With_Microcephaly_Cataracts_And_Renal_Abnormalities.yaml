    snippet: "This report provides a retrospective review of 16 patients from 11 unrelated Saudi consanguineous families with GEMIN4 mutations."
    explanation: Largest published case count for the disorder.
pathophysiology:
- name: Biallelic GEMIN4 Missense Variants
  description: >-
    Homozygous missense variants in GEMIN4 initiate the disorder. Structural
    modelling places the three reported substitutions in the helical scaffold of
    the protein, where they are predicted to destabilise the fold and may impair
    the accessibility of a nuclear localisation signal. That the variants reduce
    rather than abolish GEMIN4 function is an inference: complete loss of Gemin4
    is embryonic lethal in mice, whereas patients survive into childhood. No
    study has measured GEMIN4 protein abundance or SMN complex composition in
    patient cells.

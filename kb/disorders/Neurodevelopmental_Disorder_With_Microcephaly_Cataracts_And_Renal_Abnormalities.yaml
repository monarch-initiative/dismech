    snippet: "In other words, the affected individuals were homozygous, whereas the parents were carriers (Figure 1A,B)."
    explanation: Segregation in an independent consanguineous family is consistent with recessive inheritance.
prevalence:
- population: Saudi Arabia (consanguineous families)
  measure_type: CASES_IN_LITERATURE
  notes: >-
    The largest series reports 16 patients from 11 unrelated Saudi
    consanguineous families, including five previously described individuals
    (PMID:35861185); two further affected siblings carrying p.His147Arg were
    reported separately (PMID:35052432). No population prevalence has been
    estimated.

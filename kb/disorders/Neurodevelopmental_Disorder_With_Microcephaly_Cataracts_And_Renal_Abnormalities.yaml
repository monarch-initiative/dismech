  evidence:
  - reference: PMID:35052432
    reference_title: "A Novel GEMIN4 Variant in a Consanguineous Family Leads to Neurodevelopmental Impairment with Severe Microcephaly, Spastic Quadriplegia, Epilepsy, and Cataracts."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The resulting structural perturbations could hamper the capability of Gemin4 to bind certain ligands, may affect the accessibility of NLS2, and could lead to an unstable and more rapidly degradable protein."
    explanation: AlphaFold2-based structural modelling predicts that p.His147Arg destabilises GEMIN4.
  - reference: PMID:35052432
    reference_title: "A Novel GEMIN4 Variant in a Consanguineous Family Leads to Neurodevelopmental Impairment with Severe Microcephaly, Spastic Quadriplegia, Epilepsy, and Cataracts."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "This effect is similar to those evoked by previously reported variants (p.Pro105L and p.Trp818R) that are both destabilizing by introducing clashes and gaps in a hydrophobic environment of the protein fold."
    explanation: The same modelling predicts that both founder variants are destabilising.
  downstream:
  - target: Impaired SMN Complex Sm-Core snRNP Assembly
    causal_link_type: DIRECT
    description: >-
      Depletion of GEMIN4 reduces Sm-core assembly in cultured human cells. The
      edge is extrapolated from RNAi knockdown; it has not been tested with
      patient alleles.
    evidence:
    - reference: PMID:16301532
      reference_title: "Gemin proteins are required for efficient assembly of Sm-class ribonucleoproteins."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "RNAi-mediated knockdown of SMN, Gemin2, Gemin3, and Gemin4 each disrupted Sm core assembly, whereas knockdown of Gemin5 and Snurportin1 had no effect."
      explanation: >-
        GEMIN4 knockdown disrupts Sm core assembly in HeLa cells. Indirect for
        this disease because it uses knockdown rather than the patient missense
        alleles.
  - target: Neuronal GEMIN4 Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35861185
      reference_title: "Further delineation of GEMIN4 related neurodevelopmental disorder with microcephaly, cataract, and renal abnormalities syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Our fly model findings demonstrated developmental defects and motor dysfunction suggesting that loss of GEMIN4 function is detrimental in vivo; likely similar to human patients."
      explanation: >-
        Neuron-specific GEMIN4 knockdown in flies causes developmental and
        motor defects, supporting neuronal loss of GEMIN4 function as the
        route from the variants to the neurological phenotype.
  - target: Lens GEMIN4 Deficiency During Early Lens Development
    causal_link_type: UNKNOWN
    description: >-
      Hypothetical branch: the patient variants are assumed to reduce GEMIN4
      function in the developing lens, where the mouse orthologue is enriched
      early in development.
- name: Impaired SMN Complex Sm-Core snRNP Assembly
  description: >-
    GEMIN4 is a component of the SMN complex, binding it through a direct
    interaction with Gemin3 and contacting several Sm proteins, and is required
    for efficient assembly of the Sm core onto spliceosomal snRNAs. Reduced
    snRNP assembly is the best-supported cellular function of GEMIN4, but it has
    not been demonstrated in NEDMCR patient cells, and no downstream splicing
    defect has been linked to any NEDMCR phenotype. The node is therefore not
    connected to phenotypes; see the nedmcr_smn_complex_link discussion.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL

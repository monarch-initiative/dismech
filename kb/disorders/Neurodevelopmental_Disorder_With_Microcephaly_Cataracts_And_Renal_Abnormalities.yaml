    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in GEMIN4 have recently been linked to an inherited autosomal recessive neurodevelopmental disorder characterized with microcephaly, cataracts, and renal abnormalities (NEDMCR syndrome)."
    explanation: States the autosomal recessive mode of inheritance of GEMIN4-related NEDMCR.
  - reference: PMID:35052432

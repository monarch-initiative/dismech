- name: Neuronal GEMIN4 Deficiency
  description: >-
    Reduced GEMIN4 function in neurons. Neuron-specific knockdown of the fly
    orthologue causes developmental defects and motor dysfunction, which the
    authors interpret as modelling the patients' neurological phenotype. The
    edges from this node to the human neurological phenotypes are inferred from
    that model together with the clinical picture; the cellular process that
    fails in GEMIN4-deficient neurons is unknown.

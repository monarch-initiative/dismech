genetic:
- name: GEMIN4
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: GEMIN4
    term:
      id: hgnc:15717
      label: GEMIN4
  features: >-
    Gem nuclear organelle associated protein 4, a 1058-residue predicted
    all-helical scaffold protein of the SMN complex. All disease alleles reported
    so far are homozygous missense variants; no truncating or null allele has
    been reported in a patient, consistent with embryonic lethality of Gemin4
    null mice.
  evidence:
  - reference: PMID:25558065
    reference_title: "Accelerating novel candidate gene discovery in neurogenetic disorders via whole-exome sequencing of prescreened multiplex consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This prescreening step led to the identification of 69 recessive genes not previously associated with disease, of which 33 are here described (SPDL1, TUBA3E, INO80, NID1, TSEN15, DMBX1, CLHC1, C12orf4, WDR93, ST7, MATN4, SEC24D, PCDHB4, PTPN23, TAF6, TBCK, FAM177A1, KIAA1109, MTSS1L, XIRP1, KCTD3, CHAF1B, ARV1, ISCA2, PTRH2, GEMIN4, MYOCD, PDPR, DPH1, NUP107, TMEM92, EPB41L4A, and FAM120AOS)."
    explanation: Founding report proposing GEMIN4 as a recessive neurogenetic disease gene.
  - reference: PMID:27878435
    reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specifically, we confirmed GEMIN4 as a disease gene for the syndrome of cataract and global developmental delay (Alazami et al. 2015)."
    explanation: Independent confirmation with a second allele in an unrelated family.
  - reference: PMID:35861185
    reference_title: "Further delineation of GEMIN4 related neurodevelopmental disorder with microcephaly, cataract, and renal abnormalities syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only two missense, homozygous, pathogenic variants were found in all affected patients, suggesting a founder effect."
    explanation: Two recurrent founder missense variants account for the 16-patient series.
  variants:
  - name: c.2452T>C p.(Trp818Arg)
    description: >-
      Homozygous founder missense variant (NM_015721) reported in the founding
      families; predicted to destabilise the hydrophobic core of the C-terminal
      half of the protein.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:35052432
      reference_title: "A Novel GEMIN4 Variant in a Consanguineous Family Leads to Neurodevelopmental Impairment with Severe Microcephaly, Spastic Quadriplegia, Epilepsy, and Cataracts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "The study reported three unrelated families with three children harboring the same variant in GEMIN4."
      explanation: The founding study's three families shared this variant, as summarised in a later report.
  - name: c.314C>T p.(Pro105Leu)
    description: >-
      Homozygous founder missense variant (NM_015721.2) first reported in an
      independent pediatric cataract family and later in further Saudi patients.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:27878435
      reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patient 14DG2265 provided independent confirmation of this association where his novel GEMIN4 mutation (NM_015721.2:c.314C>T;p. (Pro105Leu)) was associated with an identical phenotype (Table 1, Table S1)."
      explanation: Reports p.Pro105Leu with the characteristic phenotype.
  - name: c.440A>G p.(His147Arg)
    description: >-
      Homozygous missense variant in exon 2 (NM_015721) reported in two siblings
      from one consanguineous Saudi family, absent from population databases and
      predicted damaging; segregation was complete.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:35052432

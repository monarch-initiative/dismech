name: Neurodevelopmental Disorder With Microcephaly, Cataracts, And Renal Abnormalities
creation_date: "2026-10-22T00:00:00Z"
category: Mendelian
synonyms:
- NEDMCR
- GEMIN4-related neurodevelopmental disorder
description: >-
  Neurodevelopmental disorder with microcephaly, cataracts, and renal
  abnormalities (NEDMCR, OMIM:617913) is an ultra-rare autosomal recessive
  syndrome caused by biallelic missense variants in GEMIN4 (17p13.3), which
  encodes a component of the survival motor neuron (SMN) complex that assembles
  Sm-class spliceosomal small nuclear ribonucleoproteins (snRNPs). All reported
  individuals come from consanguineous Saudi Arabian families. Global
  developmental delay is present in every reported patient, usually with
  infantile or congenital cataract, microcephaly, early-onset epilepsy (often
  infantile spasms with hypsarrhythmia), hypotonia evolving into spastic
  tetraplegia, and cerebellar and brainstem atrophy on brain MRI. Renal
  involvement (tubulopathy and nephrolithiasis) is variable, and skeletal
  features, dystonia, hearing and visual impairment, minor dysmorphism and
  recurrent aspiration pneumonia have been described. Two recurrent founder
  missense variants (p.Trp818Arg and p.Pro105Leu) account for most patients,
  and a third (p.His147Arg) has been reported in one sibship. How loss of
  GEMIN4 function produces the phenotype is not established: GEMIN4 is required
  for efficient Sm-core snRNP assembly in cultured cells and is essential for
  mouse embryonic viability, and neuronal knockdown of the fly orthologue causes
  developmental and motor defects, but no study has measured snRNP assembly,
  splicing, or microRNA function in patient cells.

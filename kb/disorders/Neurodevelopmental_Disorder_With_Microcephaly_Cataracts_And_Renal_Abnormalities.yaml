notes: >-
  The founding description of GEMIN4 as a recessive disease gene is the
  multiplex consanguineous family exome study of Alazami et al. 2015
  (PMID:25558065), whose cached abstract names GEMIN4 only in a list of
  candidate genes; the clinical details of those families are quoted here from
  a later report that summarises them (PMID:35052432), and those items carry
  quote_role BACKGROUND. All published patients are Saudi, and the largest
  series (PMID:35861185, 16 patients from 11 families) re-reports five
  previously described individuals, so case counts across papers overlap and are
  not summed. No phenotype frequency band is asserted except global
  developmental delay, which PMID:35861185 reports in all 16 patients; cataract,
  renal and skeletal features are described there as variable without
  per-feature counts in the cached abstract. GEMIN4 single-nucleotide
  polymorphisms studied as cancer or psychiatric risk modifiers in the
  microRNA-machinery literature are unrelated to this Mendelian disorder and are
  not cited. This disorder is distinct from the GEMIN5-related
  neurodevelopmental disorder with cerebellar atrophy and motor dysfunction,
  which is caused by a different SMN complex subunit. No GeneReviews chapter
  covers this disorder (`just check-genereviews --online` returns NO_CHAPTER),
  so the phenotype baseline is the 16-patient series (PMID:35861185) together
  with the detailed sibship report (PMID:35052432).
inheritance:
- name: Autosomal recessive
  description: >-
    All reported patients are homozygous for a GEMIN4 missense variant and were
    born to consanguineous parents; heterozygous carrier parents are unaffected
    and the variants segregate with disease within families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance

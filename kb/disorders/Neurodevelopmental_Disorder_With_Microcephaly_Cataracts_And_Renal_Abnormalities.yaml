      explanation: The fly phenotype is presented by the authors as similar to the patients'.
- name: Gemin4 gene-trap null mouse
  species: Mouse
  genotype: Gemin4 gene-trap insertion, homozygous
  description: >-
    Homozygous Gemin4 gene-trap mice were not recovered at any stage examined,
    down to E5.5, while heterozygotes are phenotypically normal and express
    wild-type protein levels. The model shows that GEMIN4 is essential but cannot
    model the postnatal disease.
  publication: PMID:29371219
  modeled_mechanisms:
  - target: Biallelic GEMIN4 Missense Variants
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: Complete loss of Gemin4 is early embryonic lethal.
    limitations: >-
      A null allele, whereas every patient allele is a missense variant
      compatible with survival into childhood; no postnatal or tissue phenotype
      can be studied, and heterozygotes have no phenotype.
    evidence:
    - reference: PMID:29371219
      reference_title: "Gemin4 is an essential gene in mice, and its overexpression in human cells causes relocalization of the SMN complex to the nucleoplasm."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Gemin4 null mice die early in embryonic development, demonstrating that Gemin4 is an essential mammalian protein."
      explanation: Null mice are embryonic lethal and so do not reproduce the human disease.
discussions:
- discussion_id: nedmcr_smn_complex_link
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the NEDMCR missense variants impair SMN complex function and snRNP
    assembly in patient cells, and does that explain the neurological, lens and
    renal phenotypes?
  attaches_to:
  - pathophysiology#Impaired SMN Complex Sm-Core snRNP Assembly
  - pathophysiology#Biallelic GEMIN4 Missense Variants
  rationale: >-
    GEMIN4 knockdown reduces Sm-core assembly in HeLa cells, but no study has
    measured GEMIN4 protein levels, SMN complex composition, snRNP assembly or
    splicing in NEDMCR patient cells, and the authors of the most detailed
    clinical report state that the link is unclear. The phenotype also differs
    from spinal muscular atrophy, so it cannot be assumed to follow the same
    route. The snRNP assembly node is therefore left unconnected to phenotypes.
  evidence:
  - reference: PMID:35052432
    reference_title: "A Novel GEMIN4 Variant in a Consanguineous Family Leads to Neurodevelopmental Impairment with Severe Microcephaly, Spastic Quadriplegia, Epilepsy, and Cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The exact relationship between GEMIN4 pathogenic variants and the syndrome, as well as its potential mediation by SMN complex disruption, are unclear"
    explanation: The authors state that SMN complex mediation is unestablished.
  proposed_experiments:
  - experiment_id: nedmcr_patient_cell_snrnp_assembly
    name: snRNP assembly in patient-derived cells
    description: >-
      Measure GEMIN4 protein abundance, SMN complex integrity and in vitro
      Sm-core assembly activity in patient lymphoblastoid cell lines or
      fibroblasts carrying p.Trp818Arg, p.Pro105Leu or p.His147Arg.
  - experiment_id: nedmcr_splicing_transcriptome
    name: Transcriptome-wide splicing analysis
    description: >-
      RNA-seq of patient cells or patient-allele iPSC-derived neurons to test for
      intron retention and alternative splicing changes.
- discussion_id: nedmcr_mirna_role
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does disruption of GEMIN4's role in microRNA-containing ribonucleoproteins
    contribute to NEDMCR?
  attaches_to:
  - pathophysiology#Biallelic GEMIN4 Missense Variants
  rationale: >-
    GEMIN4 is also found, with Gemin3, in an Argonaute-containing microRNA
    ribonucleoprotein complex separate from the SMN complex. Whether the patient
    variants affect this complex, or microRNA-mediated silencing in neurons, lens
    or kidney, has not been studied, so no microRNA node is curated.
  evidence:
  - reference: PMID:11914277
    reference_title: "miRNPs: a novel class of ribonucleoproteins containing numerous microRNAs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we report that Gemin3 and Gemin4 are also in a separate complex that contains eIF2C2, a member of the Argonaute protein family."
    explanation: Establishes GEMIN4 membership in an miRNP complex.
  proposed_experiments:
  - experiment_id: nedmcr_mirnp_profiling
    name: miRNP association and microRNA profiling with patient alleles
    description: >-
      Test Argonaute co-immunoprecipitation of wild-type and patient-variant
      GEMIN4 and profile microRNA abundance and target derepression in
      patient-allele neural cells.
- discussion_id: nedmcr_renal_and_lens_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What causes the renal tubulopathy, nephrolithiasis and cataract in GEMIN4
    deficiency?
  attaches_to:
  - phenotypes#Renal tubular dysfunction
  - phenotypes#Nephrolithiasis
  - pathophysiology#Lens GEMIN4 Deficiency During Early Lens Development
  rationale: >-
    The renal phenotype has only been described in summary form (tubulopathy and
    stones in two of three founding-family patients), without the type of
    tubulopathy or stone composition, and no renal tissue or functional study
    exists. The lens link rests on mouse lens expression data only. The renal
    phenotypes are therefore left unconnected to any mechanism.
  proposed_experiments:
  - experiment_id: nedmcr_renal_phenotyping
    name: Systematic renal phenotyping
    description: >-
      Characterise tubular function (urine amino acids, phosphate, bicarbonate,
      calcium, low-molecular-weight proteinuria) and stone composition across the
      Saudi cohort, controlling for valproate exposure.
  - experiment_id: nedmcr_lens_model
    name: Lens-specific Gemin4 reduction
    description: >-
      Hypomorphic or lens-conditional Gemin4 reduction in mouse or zebrafish to
      test whether early lens GEMIN4 deficiency causes cataract.
- discussion_id: nedmcr_no_hypomorphic_vertebrate_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can a vertebrate model carrying a patient missense allele reproduce NEDMCR,
    given that the only vertebrate model, a Gemin4 null mouse, dies in early
    embryogenesis?
  attaches_to:
  - pathophysiology#Biallelic GEMIN4 Missense Variants
  - pathophysiology#Neuronal GEMIN4 Deficiency
  rationale: >-
    Model evidence exists but does not translate: Gemin4 null mice are early
    embryonic lethal, and the fly model uses neuronal knockdown in an
    invertebrate. Neither carries a patient allele, so the hypomorphic nature of
    the human variants and the lens and kidney phenotypes cannot be studied in
    either.
  proposed_experiments:
  - experiment_id: nedmcr_knockin_mouse
    name: Patient-allele knock-in mouse
    description: >-
      Generate Gemin4 p.Trp818Arg or p.Pro105Leu knock-in mice and assess
      survival, brain size, cerebellar morphology, lens transparency and renal
      tubular function.

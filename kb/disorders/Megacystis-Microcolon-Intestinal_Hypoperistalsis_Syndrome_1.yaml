references:
- reference: PMID:31070878
  title: "Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome Overview."
  tags:
  - GeneReviews
notes: >-
  The GeneReviews MMIHS overview (PMID:31070878) is the phenotype baseline, but
  its cached PubMed record holds only the chapter's statement of purpose, so no
  phenotype is quoted from it. The gene-discovery report (PMID:28602422) is
  cached abstract-only. The deep-research report attributes further findings in
  the discovery families (intestinal malrotation, bilateral
  hydroureteronephrosis, abnormal amniotic fluid volume) to that paper's full
  text; they are not curated here because no cached source contains them. No
  phenotype carries a frequency: the MYLK patients are too few. The only
  ClinGen record for MYLK in cache/clingen/gene_validity.csv is for familial
  thoracic aortic aneurysm and dissection (MONDO:0019625). No bladder
  management (catheterisation, cystostomy) is curated: the 2025 cohort
  (PMID:41387873) names individualized bladder management only as general
  MMIHS care in its introduction, and no cached source describes it in a MYLK
  patient.
inheritance:
- name: Autosomal recessive
  description: Homozygous MYLK variants in two consanguineous families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28602422
    reference_title: "Loss-of-Function Variants in MYLK Cause Recessive Megacystis Microcolon Intestinal Hypoperistalsis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By performing homozygosity mapping and whole-exome sequencing, we found homozygous variants in myosin light chain kinase (MYLK) in both families."
    explanation: Homozygous variants in both consanguineous families.
pathophysiology:
- name: Biallelic MYLK Loss of Function
  description: >-
    The initiating lesion. A homozygous 7 bp duplication causing a frameshift
    (c.3838_3844dupGAAAGCG, p.Glu1282_Glyfs*51) in one family and a homozygous
    putative splice-site variant (c.3985+5C>A) in the other both disturb normal
    MYLK expression.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
  genes:
  - preferred_term: MYLK
    term:
      id: hgnc:7590
      label: MYLK
  molecular_functions:
  - preferred_term: myosin light chain kinase activity
    term:
      id: GO:0004687
      label: myosin light chain kinase activity
    modifier: DECREASED
  downstream:
  - target: Failure of Visceral Smooth Muscle Contraction
    causal_link_type: DIRECT
    description: >-
      Without MLCK the regulatory light chain is not phosphorylated, so
      smooth muscle myosin cannot develop force.
    evidence:
    - reference: PMID:18586037
      reference_title: "Myosin light chain kinase is central to smooth muscle contraction and required for gastrointestinal motility in mice."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Isolated muscles showed a loss of RLC phosphorylation and force development induced by K(+)-depolarization."
      explanation: Loss of light-chain phosphorylation and force in knockout mouse smooth muscle.
    - reference: PMID:28602422
      reference_title: "Loss-of-Function Variants in MYLK Cause Recessive Megacystis Microcolon Intestinal Hypoperistalsis Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Because MYLK encodes an important kinase required for myosin activation and subsequent interaction with actin filaments, it is likely that in its absence, contraction of smooth muscle cells is impaired."
      explanation: >-
        The human report's inference of the same step. It is stated as likely,
        from the gene's known function, not measured in patient tissue.
  evidence:
  - reference: PMID:28602422
    reference_title: "Loss-of-Function Variants in MYLK Cause Recessive Megacystis Microcolon Intestinal Hypoperistalsis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a 7 bp duplication (c.3838_3844dupGAAAGCG ... in one family and a putative splice-site variant (c.3985+5C>A) in the other."
    explanation: The two causal variants.
  - reference: PMID:28602422
    reference_title: "Loss-of-Function Variants in MYLK Cause Recessive Megacystis Microcolon Intestinal Hypoperistalsis Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression studies and splicing assays indicated that both variants affect normal MYLK expression."
    explanation: Functional evidence that both variants reduce MYLK expression.
- name: Failure of Visceral Smooth Muscle Contraction
  description: >-
    Smooth muscle in the bladder and bowel wall cannot generate force. The
    organs are patent and do not move, which is why the obstruction is
    functional and the syndrome is classed as a myopathy.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: enteric smooth muscle cell
    term:
      id: CL:0002504
      label: enteric smooth muscle cell
  - preferred_term: smooth muscle cell of bladder
    term:
      id: CL:0002597
      label: smooth muscle cell of bladder
  biological_processes:
  - preferred_term: smooth muscle contraction
    term:
      id: GO:0006939
      label: smooth muscle contraction
    modifier: DECREASED
  downstream:
  - target: Megacystis
    causal_link_type: DIRECT
    description: A bladder that cannot contract cannot empty, so it distends without an outlet lesion.
    evidence:
    - reference: PMID:18586037
      reference_title: "Myosin light chain kinase is central to smooth muscle contraction and required for gastrointestinal motility in mice."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice displayed uroschesis during the late period after tamoxifen treatment."
      explanation: >-
        Urinary retention after smooth muscle MLCK deletion. INDIRECT because
        the mouse is an adult-onset deletion, not the congenital human disease.
  - target: Intestinal Hypoperistalsis
    causal_link_type: DIRECT
    description: Bowel smooth muscle that cannot contract does not generate propulsive waves.
    evidence:
    - reference: PMID:18586037
      reference_title: "Myosin light chain kinase is central to smooth muscle contraction and required for gastrointestinal motility in mice."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Targeted deletion of MLCK in adult mouse smooth muscle resulted in severe gut dysmotility characterized by weak peristalsis, dilation of the digestive tract, and reduction of feces excretion and food intake."
      explanation: Weak peristalsis after smooth muscle MLCK deletion in mice.
  - target: Parenteral Nutrition Dependence
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Via failed intestinal propulsion: bowel that cannot move feed cannot
      absorb it, so nutrition has to be given intravenously.
    evidence:
    - reference: PMID:41387873
      reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All patients experienced clinical (sub)ileus, with 85% requiring ostomy and parenteral nutrition, key determinants of unfavorable outcome."
      explanation: Ileus in every patient, and parenteral nutrition in most, across the MMIHS cohort.
  evidence:
  - reference: PMID:28602422
    reference_title: "Loss-of-Function Variants in MYLK Cause Recessive Megacystis Microcolon Intestinal Hypoperistalsis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Megacystis microcolon intestinal hypoperistalsis syndrome (MMIHS) is a congenital disorder characterized by loss of smooth muscle contraction in the bladder and intestine."
    explanation: Defines the syndrome as loss of visceral smooth muscle contraction.
  - reference: PMID:28602422
    reference_title: "Loss-of-Function Variants in MYLK Cause Recessive Megacystis Microcolon Intestinal Hypoperistalsis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In aggregate, our findings implicate MYLK as a gene involved in the recessive form of MMIHS, confirming that this disease of the visceral organs is heterogeneous with a myopathic origin."
    explanation: The myopathic basis of the MYLK form.
- name: Parenteral Nutrition Dependence
  description: >-
    Bowel that does not propel its contents cannot be fed enterally, so
    patients depend on parenteral nutrition. The hepatobiliary complications
    that follow are complications of that dependence rather than of the
    myopathy itself. The one MYLK patient in the 2025 cohort was managed this
    way and developed both.
  biological_scale: ORGANISM
  downstream:
  - target: Intestinal Failure-Associated Liver Disease
    causal_link_type: DIRECT
    description: In the cohort, IFALD occurred only in patients dependent on parenteral nutrition.
    evidence:
    - reference: PMID:41387873
      reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Intestinal failure-associated liver disease (IFALD) was diagnosed in 15 patients (58%), all of whom were dependent on parenteral nutrition"
      explanation: Every IFALD case in this MMIHS cohort was parenteral-nutrition dependent.
  - target: Cholelithiasis
    causal_link_type: UNKNOWN
    description: Reduced enteral intake and parenteral nutrition are risk factors for gallstones.
    evidence:
    - reference: PMID:41387873
      reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Reduced enteral intake and parenteral nutrition are risk factors for cholelithiasis."
      explanation: >-
        A risk-factor statement, not a measured effect in this cohort, so the
        link is graded INDIRECT.
  evidence:
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Apart from the four children with complete bowel continuity, all patients were dependent on home-parenteral nutrition (PN)"
    explanation: Parenteral nutrition dependence across the MMIHS cohort.
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was managed by proximal jejunostomy and parenteral nutrition and developed IFALD and cholelithiasis (Table 1)."
    explanation: >-

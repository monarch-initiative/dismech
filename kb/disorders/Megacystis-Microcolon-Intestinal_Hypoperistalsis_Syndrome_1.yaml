  description: >-
    A proximal stoma that drains bowel which cannot propel its contents. It is
    drainage, not restoration: the bowel beyond the stoma stays aperistaltic.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: decompressing jejunostomy
    term:
      id: NCIT:C52005
      label: Enterostomy
  target_mechanisms:
  - target: Intestinal Hypoperistalsis
    description: >-
      Gives intestinal content an exit the bowel does not have to generate; it
      does not act on the contractile defect.
  evidence:
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

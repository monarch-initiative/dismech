discussions:
- discussion_id: small_evidence_base
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#MYLK
  - phenotypes#Microcolon
  prompt: >-
    How consistent is the MYLK phenotype beyond the three patients of the
    gene-discovery report, and how does microcolon arise?
  rationale: >-
    The human evidence is three affected individuals from two families and
    single further patients in later series, one of whom carries a missense
    variant of unreported zygosity. No phenotype frequency, natural history or
    genotype-phenotype relationship can be stated for the MYLK form. Microcolon
    has no causal edge because none of the cited sources states its mechanism,
    and the adult-onset knockout mouse cannot test a congenital finding.
  evidence:
  - reference: PMID:28602422
    reference_title: "Loss-of-Function Variants in MYLK Cause Recessive Megacystis Microcolon Intestinal Hypoperistalsis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on three MMIHS-affected subjects from two consanguineous families with no variants in the known MMIHS-associated genes."
    explanation: The size of the defining evidence base.

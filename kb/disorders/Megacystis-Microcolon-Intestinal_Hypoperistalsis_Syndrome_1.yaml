notes: >-
  The GeneReviews MMIHS overview (PMID:31070878) is the phenotype baseline, but
  its cached PubMed record holds only the chapter's statement of purpose, so no
  phenotype is quoted from it. The gene-discovery report (PMID:28602422) is
  cached abstract-only. The deep-research report attributes further findings in
  the discovery families (intestinal malrotation, bilateral
  hydroureteronephrosis, abnormal amniotic fluid volume) to that paper's full
  text; they are not curated here because no cached source contains them. No
  phenotype carries a frequency: the MYLK patients are too few. The only
  ClinGen record for MYLK in cache/clingen/gene_validity.csv is for familial
  thoracic aortic aneurysm and dissection (MONDO:0019625).

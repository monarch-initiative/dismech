name: Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome 1
creation_date: "2026-10-23T15:00:00Z"
category: Mendelian
synonyms:
- MMIHS1
- MYLK-related megacystis-microcolon-intestinal hypoperistalsis syndrome
- MYLK-related visceral myopathy
description: >-
  Megacystis-microcolon-intestinal hypoperistalsis syndrome 1 (MMIHS1) is the
  autosomal recessive, MYLK-related form of MMIHS. MYLK encodes myosin light
  chain kinase (MLCK), which phosphorylates the myosin regulatory light chain
  so that smooth muscle myosin can engage actin and generate force. Biallelic
  loss of MYLK leaves bladder and bowel smooth muscle unable to contract, so
  both hollow organs fail functionally while remaining anatomically patent: an
  enlarged bladder, a small unused colon and intestine that does not propel.

  The MYLK form is one of several recessive forms of a genetically
  heterogeneous syndrome whose genes all act on the smooth muscle contractile
  apparatus. Its human evidence is small: three affected individuals from two
  consanguineous families in the gene-discovery report, plus single patients
  in later series, including one with a missense variant of unreported
  zygosity. The mechanism is supported by a smooth muscle-specific Mlck
  knockout mouse with severe gut dysmotility and urinary retention. MYLK is
  also a gene for familial thoracic aortic aneurysm and dissection, curated as
  a subtype of Familial_Thoracic_Aortic_Aneurysm_and_Aortic_Dissection.

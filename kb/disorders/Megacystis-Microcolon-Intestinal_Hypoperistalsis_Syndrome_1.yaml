pathophysiology:
- name: Biallelic MYLK Loss of Function
  description: >-
    The initiating lesion. A homozygous 7 bp duplication causing a frameshift
    (c.3838_3844dupGAAAGCG, p.Glu1282_Glyfs*51) in one family and a homozygous
    putative splice-site variant (c.3985+5C>A) in the other both disturb normal
    MYLK expression.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS

treatments:
- name: Decompressing Jejunostomy and Parenteral Nutrition
  description: >-
    Management of the functional intestinal obstruction and intestinal
    failure. The cohort's MYLK patient was managed this way and developed
    intestinal failure-associated liver disease and cholelithiasis, which are
    recognised complications of parenteral nutrition in MMIHS.
  treatment_term:
    preferred_term: decompressing jejunostomy with parenteral nutrition
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was managed by proximal jejunostomy and parenteral nutrition and developed IFALD and cholelithiasis (Table 1)."
    explanation: Management and complications in the cohort's MYLK patient.
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intestinal failure-associated liver disease (IFALD) was diagnosed in 15 patients (58%), all of whom were dependent on parenteral nutrition"
    explanation: IFALD in this MMIHS cohort occurred only in patients on parenteral nutrition.
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduced enteral intake and parenteral nutrition are risk factors for cholelithiasis."
    explanation: Parenteral nutrition as a risk factor for cholelithiasis.
animal_models:

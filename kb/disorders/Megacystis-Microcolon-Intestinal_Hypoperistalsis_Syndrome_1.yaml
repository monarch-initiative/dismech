phenotypes:
- category: Genitourinary
  name: Megacystis
  description: >-
    Enlarged bladder without outlet obstruction. Prenatal signs were described
    in all MYLK, MYL9 and LMOD1 cases of a systematic review, and megacystis was
    present in the MYLK patient of a 2025 cohort.
  phenotype_term:
    preferred_term: Megacystis
    term:
      id: HP:0000021
      label: Megacystis
  evidence:
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The only patient with a MYLK variant in our cohort presented with megacystis, microcolon, duodenal stenosis and persistent ileus."
    explanation: >-
      Megacystis in a MYLK patient. That patient carries a missense variant,
      c.4820G>T (p.G1607V), whose zygosity and pathogenicity the cohort does
      not report, so this is supporting rather than defining evidence.
  - reference: PMID:36200034
    reference_title: "Smooth muscle motility disorder phenotypes: A systematic review of cases associated with seven pathogenic genes (ACTG2, MYH11, FLNA, MYLK, RAD21, MYL9 and LMOD1)."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "all 5 patients with a MYLK , MYL9 or LMOD1 mutation"
    explanation: >-
      Prenatal signs in every reviewed MYLK case. INDIRECT because the review
      does not specify that the prenatal sign was megacystis, and it pools
      MYLK with two other genes.

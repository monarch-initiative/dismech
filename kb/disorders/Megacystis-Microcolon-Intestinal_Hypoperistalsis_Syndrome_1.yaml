  species: Mouse
  genotype: Mlck floxed (exons 23-25) x SM-CreERT2, tamoxifen-induced in adults
  publication: PMID:18586037
  description: >-
    Inducible deletion of MLCK in adult smooth muscle. The mice develop severe
    gut dysmotility with weak peristalsis and a dilated digestive tract,
    urinary retention and lower blood pressure.
  evidence:
  - reference: PMID:18586037
    reference_title: "Myosin light chain kinase is central to smooth muscle contraction and required for gastrointestinal motility in mice."

      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Because MYLK encodes an important kinase required for myosin activation and subsequent interaction with actin filaments, it is likely that in its absence, contraction of smooth muscle cells is impaired."
      explanation: >-
        The human report's inference of the same step. It is stated as likely,
        from the gene's known function, not measured in patient tissue.
  evidence:
  - reference: PMID:28602422
    reference_title: "Loss-of-Function Variants in MYLK Cause Recessive Megacystis Microcolon Intestinal Hypoperistalsis Syndrome."

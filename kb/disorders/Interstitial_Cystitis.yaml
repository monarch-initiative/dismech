- name: ATP2C1
  gene_term:
    preferred_term: ATP2C1
    term:
      id: hgnc:13211
      label: ATP2C1
  relationship_type: RISK_FACTOR
  notes: >-
    Encodes the Golgi SPCA1 Ca2+/Mn2+ ATPase; canonically causes Hailey-Hailey
    disease (a desquamating skin disorder). Rare-variant burden analysis in an
    IC/BPS exome cohort (medRxiv preprint) nominates ATP2C1 as a risk gene,
    consistent with a shared Ca2+-dependent epithelial-barrier vulnerability
    extending from skin to bladder urothelium.
  evidence:
  - reference: PMID:40034785
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An exome wide ultra-rare variants analysis in 348 IC/BPS and 11,981 controls extended the previously reported association with ATP2C1 and ATP2A2, implicated in Mendelian desquamating skin disorders"
    explanation: Case-control exome study (medRxiv preprint, not yet peer-reviewed) extending the rare-variant burden association between ATP2C1 and IC/BPS.
  - reference: PMID:40034785
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATP2C1 and ATP2A2 are expressed in the urothelium"
    explanation: Notes that ATP2C1/ATP2A2 are expressed in bladder urothelium, supporting the proposed mechanistic extension of their calcium-transporter role from skin to bladder.
- name: ATP2A2
  gene_term:
    preferred_term: ATP2A2
    term:
      id: hgnc:812
      label: ATP2A2
  relationship_type: RISK_FACTOR
  notes: >-
    Encodes the ER SERCA2 Ca2+ ATPase; canonically causes Darier disease (a
    desquamating skin disorder). Implicated alongside ATP2C1 as an IC/BPS
    rare-variant risk gene in a medRxiv preprint exome study.
  evidence:
  - reference: PMID:40034785
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An exome wide ultra-rare variants analysis in 348 IC/BPS and 11,981 controls extended the previously reported association with ATP2C1 and ATP2A2, implicated in Mendelian desquamating skin disorders"
    explanation: Case-control exome study (medRxiv preprint, not yet peer-reviewed) extending the rare-variant burden association between ATP2A2 and IC/BPS.
environmental:
- name: Dietary Bladder Irritants
  description: >-
    Caffeine, alcohol, carbonated beverages, citrus fruits/juices, spicy
    foods, artificial sweeteners, and MSG are widely reported symptom
    triggers/exacerbants in IC/BPS, though they are not established as
    initiating causes.
  effect: EXACERBATES
- name: Antecedent Urinary Tract Infection
  description: >-
    A history of urinary tract infection preceding symptom onset is commonly
    reported and is mechanistically linked to initial GAG-layer disruption,
    though IC/BPS is by definition non-infectious (urine culture-negative) at
    diagnosis.
  effect: TRIGGERS
prevalence:
- population: United States adult women
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2700.0
  rate_low: 2700.0
  rate_high: 6530.0
  notes: >-
    RAND RICE population-based telephone survey; high-specificity case
    definition estimated 2.70% (CI 2.53-2.86) and high-sensitivity definition
    estimated 6.53% (CI 6.28-6.79) prevalence, projecting 3.3-7.9 million
    affected US women.
  evidence:
  - reference: PMID:21683389
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the high sensitivity (most inclusive) definition, the estimate of prevalence of BPS/IC symptoms among United States adult females was 6.53% (CI 6.28, 6.79). Based on the high specificity definition, the prevalence was estimated to be 2.70% (CI 2.53, 2.86)."
    explanation: Direct quantitative population-based prevalence estimates from the RAND RICE study.
treatments:
- name: Behavioral Modification and Physical Therapy
  description: >-
    First/second-line conservative management: patient education, dietary
    trigger avoidance, stress management, bladder training, and manual
    pelvic-floor physical therapy for myofascial dysfunction.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: MAXO:0000011
      label: physical therapy
- name: Amitriptyline
  description: >-
    Tricyclic antidepressant used off-label for IC/BPS pain management,
    thought to act via central/peripheral pain-pathway modulation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amitriptyline
      term:
        id: CHEBI:2666
        label: amitriptyline
  target_mechanisms:
  - target: Central Sensitization and Chronic Pelvic/Bladder Pain
    treatment_effect: MODULATES
- name: Pentosan Polysulfate Sodium
  description: >-
    Oral heparinoid intended to replenish the deficient urothelial GAG layer.
    Long-term use carries an FDA-flagged risk of pigmentary maculopathy;
    patients require counseling and ophthalmologic monitoring.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pentosan polysulfate
      term:
        id: NCIT:C1755
        label: Pentosan Polysulfate
  target_mechanisms:
  - target: Urothelial Glycosaminoglycan (GAG) Layer Dysfunction
    treatment_effect: RESTORES
    evidence:
    - reference: PMID:17462486
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exogenous heparinoids can restore the barrier function of the urothelium and thus successfully treat patients with IC."
      explanation: States the mechanistic rationale for heparinoid (GAG-replacement) therapy in IC/BPS.
- name: Intravesical DMSO Instillation
  description: >-
    Dimethyl sulfoxide instilled directly into the bladder with a 15-20 minute
    dwell time; provides symptom relief lasting approximately 3-6 months
    through combined anti-inflammatory, mast-cell-stabilizing, and analgesic
    effects.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dimethyl sulfoxide
      term:
        id: CHEBI:28262
        label: dimethyl sulfoxide
  target_mechanisms:
  - target: Mast Cell Activation and Degranulation
    treatment_effect: INHIBITS
- name: Hunner Lesion Fulguration
  description: >-
    Endoscopic electrocautery ablation (or triamcinolone injection) of
    cystoscopically identified Hunner lesions; a targeted, lesion-directed
    therapy specific to the Hunner-lesion IC/BPS subtype.
  treatment_term:
    preferred_term: Fulguration
    term:
      id: NCIT:C15390
      label: Fulguration
  target_mechanisms:
  - target: Pancystitis with Clonal B-Cell Expansion and Epithelial Denudation (Hunner Lesion)
    treatment_effect: INHIBITS
- name: Oral Cyclosporine A
  description: >-
    Fifth-line calcineurin-inhibitor immunosuppressant; particularly effective
    in Hunner-lesion IC/BPS, consistent with the autoimmune/inflammatory
    pancystitis mechanism specific to that subtype.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cyclosporin A
      term:
        id: CHEBI:4031
        label: cyclosporin A
  target_mechanisms:
  - target: Pancystitis with Clonal B-Cell Expansion and Epithelial Denudation (Hunner Lesion)
    treatment_effect: INHIBITS

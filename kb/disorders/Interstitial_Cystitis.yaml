name: Interstitial Cystitis
creation_date: "2026-07-24T23:52:08Z"
category: Complex
description: >-
  A chronic bladder pain syndrome (interstitial cystitis/bladder pain syndrome,
  IC/BPS) characterized by urinary urgency, frequency, and pelvic/bladder pain
  in the absence of infection or other identifiable cause. IC/BPS is a
  heterogeneous umbrella syndrome spanning at least two distinct mechanistic
  streams: a urothelial-centric stream (glycosaminoglycan barrier dysfunction,
  mast cell activation, neurogenic inflammation, and central sensitization) and
  an HLA class II-associated autoimmune/inflammatory stream specific to the
  Hunner-lesion subtype (pancystitis with clonal B-cell expansion and
  epithelial denudation).
parents:
- Urologic Disease
- Chronic Pain Syndrome
disease_term:
  preferred_term: interstitial cystitis
  term:
    id: MONDO:0018301
    label: interstitial cystitis
has_subtypes:
- name: Hunner-Lesion IC/BPS
  display_name: Hunner-Lesion (Classic) IC/BPS
  description: >-
    Bladder-centric inflammatory subtype defined by cystoscopically visible
    Hunner lesions (mucosal ulceration with vessel disruption), HLA class
    II-associated antigen-presentation susceptibility, pancystitis with
    frequent clonal B-cell expansion and epithelial denudation, older age of
    onset, and smaller bladder capacity. Responds better than the non-Hunner
    subtype to lesion-directed local therapy (fulguration, triamcinolone
    injection) and oral cyclosporine A.
- name: Non-Hunner-Lesion IC/BPS
  display_name: Non-Hunner-Lesion IC/BPS
  description: >-
    Majority IC/BPS phenotype without cystoscopically visible ulcerative
    lesions and minimal bladder-wall histological changes. More frequently
    overlaps with chronic-overlapping-pain-condition comorbidities
    (fibromyalgia, irritable bowel syndrome) and is thought to be more
    centrally (rather than bladder-locally) mediated.
pathophysiology:
- name: Urothelial Glycosaminoglycan (GAG) Layer Dysfunction
  biological_scale: MOLECULAR
  description: >
    Bladder surface mucus normally forms a hydrophilic glycosaminoglycan (GAG)
    barrier (hyaluronic acid, chondroitin sulfate, heparan sulfate) that traps
    water at the umbrella-cell surface and renders the urothelium impermeable
    to urinary solutes. In IC/BPS this barrier is disrupted or deficient,
    whether from antecedent infection, mechanical/chemical injury, or a
    genetically determined epithelial vulnerability.
  cell_types:
  - preferred_term: Urothelial Cell
    term:
      id: CL:0000731
      label: urothelial cell
  biological_processes:
  - preferred_term: Glycosaminoglycan Biosynthetic Process
    term:
      id: GO:0006024
      label: glycosaminoglycan biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:17462486
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The biologic activity of mucus that imparts this barrier function is generated by the highly anionic polysaccharide components (eg, glycosaminoglycans), which are extremely hydrophilic and trap water at the outer layer of the umbrella cell."
    explanation: Describes the normal GAG-mucus barrier mechanism whose disruption is proposed to initiate IC/BPS.
  downstream:
  - target: Increased Urothelial Permeability (Leaky Urothelium)
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17462486
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In interstitial cystitis (IC), disruption of the urothelial barrier may initiate a cascade of events in the bladder, leading to symptoms and disease."
      explanation: Directly links GAG/urothelial barrier disruption to the downstream permeability cascade.
- name: Increased Urothelial Permeability (Leaky Urothelium)
  biological_scale: CELLULAR
  description: >
    Loss of the GAG barrier renders the urothelium abnormally permeable,
    allowing urinary solutes -- particularly potassium -- to diffuse into the
    suburothelium, where they depolarize sensory nerves and detrusor muscle and
    cause direct tissue injury.
  cell_types:
  - preferred_term: Urothelial Cell
    term:
      id: CL:0000731
      label: urothelial cell
  evidence:
  - reference: PMID:17462486
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specifically, epithelial dysfunction leads to the migration of urinary solutes, in particular, potassium, that depolarize nerves and muscles and cause tissue injury."
    explanation: Establishes the leaky-urothelium/potassium-recycling mechanism linking barrier loss to nerve/muscle injury.
  downstream:
  - target: Mast Cell Activation and Degranulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36498919
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the altered permeability of the impaired urothelium, the sensitized nerves on the bladder wall, and the chronic or intermittent sensory pain with inaccurate location, as well as pathologic angiogenesis, fibrosis, and Hunner lesions, all act as barriers to better diagnoses and treatments"
      explanation: Review connecting impaired urothelial permeability to downstream nerve sensitization and pain in IC/BPS.
- name: Mast Cell Activation and Degranulation
  biological_scale: CELLULAR
  description: >
    Bladder mastocytosis with mast cell degranulation is a central
    pathophysiologic finding in IC/BPS. Activated mast cells release
    preformed mediators (histamine, tryptase, cytokines) that sensitize
    afferent nerves and amplify local inflammation. Bladder mast cells in
    IC/BPS patients also show altered expression of the c-kit (stem cell
    factor receptor) growth-factor receptor relative to controls.
  cell_types:
  - preferred_term: Mast Cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: Mast Cell Degranulation
    term:
      id: GO:0043303
      label: mast cell degranulation
    modifier: INCREASED
  evidence:
  - reference: PMID:17462477
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Current evidence from clinical and laboratory studies confirms that mast cells play a central role in the pathogenesis and pathophysiology of interstitial cystitis (IC)."
    explanation: Review establishing the central role of mast cells in IC/BPS pathophysiology.
  - reference: PMID:9609630
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bladders of IC patients contained a higher number of mast cells than control patients."
    explanation: Direct histologic comparison showing bladder mastocytosis in IC patients versus controls.
  downstream:
  - target: Neurogenic Inflammation and Peripheral Sensitization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17462477
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In this article, we focus on the role of the mast cell in IC and examine the ways in which mast cells and other pathophysiologic mechanisms are interrelated in this disease."
      explanation: Discusses mast cell mediator release as a driver of neurogenic inflammation in IC/BPS.
- name: Neurogenic Inflammation and Peripheral Sensitization
  biological_scale: TISSUE
  description: >
    Mast-cell-derived mediators and depolarizing urinary solutes sensitize
    bladder sensory afferents (C-fiber and Adelta-fiber), producing neurogenic
    inflammation of the bladder wall and peripheral sensitization of pain
    pathways.
  biological_processes:
  - preferred_term: Neuroinflammatory Response
    term:
      id: GO:0150076
      label: neuroinflammatory response
  evidence:
  - reference: PMID:36498919
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the sensitized nerves on the bladder wall, and the chronic or intermittent sensory pain with inaccurate location"
    explanation: Review describing sensitized bladder-wall nerves as a core IC/BPS pathophysiologic feature.
  downstream:
  - target: Central Sensitization and Chronic Pelvic/Bladder Pain
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Sustained peripheral afferent barrage is proposed to drive spinal and
      supraspinal (central) sensitization via mechanisms not yet fully
      characterized in human IC/BPS.
- name: Central Sensitization and Chronic Pelvic/Bladder Pain
  biological_scale: ORGANISM
  description: >
    In a substantial subset of patients (particularly non-Hunner-lesion
    IC/BPS), chronic peripheral nociceptive input drives central nervous
    system sensitization, producing pain that persists independent of ongoing
    peripheral bladder pathology and frequently co-occurring with other
    chronic-overlapping-pain conditions (fibromyalgia, irritable bowel
    syndrome).
  evidence:
  - reference: PMID:36498919
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the chronic or intermittent sensory pain with inaccurate location"
    explanation: Describes the diffuse, centrally-mediated character of IC/BPS pain.
- name: HLA Class II-Associated Antigen-Presentation Susceptibility (Hunner-Type IC)
  biological_scale: MOLECULAR
  description: >
    A genome-wide association study of Hunner-type interstitial cystitis in a
    Japanese cohort identified a major histocompatibility complex (MHC, 6p21.3)
    risk locus. Fine-mapping localized the association to amino acid positions
    in the HLA-DQbeta1 and HLA-DPbeta1 peptide-binding grooves, tagging the
    HLA-DPB1*04:02 allele, implicating class II MHC antigen presentation in
    Hunner-lesion disease risk.
  genes:
  - preferred_term: HLA-DQB1
    term:
      id: hgnc:4944
      label: HLA-DQB1
  - preferred_term: HLA-DPB1
    term:
      id: hgnc:4940
      label: HLA-DPB1
  evidence:
  - reference: PMID:37467720
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association is confirmed in a replication set of 26 cases and 1,026 controls (p = 0.014)."
    explanation: Replication of the MHC/6p21.3 (rs1794275) risk locus for Hunner-type IC in an independent case-control set, confirming the GWAS finding.
  - reference: PMID:37467720
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fine mapping demonstrates the contribution to the disease risk of a completely linked haplotype of three human leukocyte antigen HLA-DQβ1 amino acid positions, 71, 74, and 75 (OR = 1.94; p = 5 × 10-8) and of HLA-DPβ1 amino acid position 178, which tags HLA-DPB1∗04:02 (OR = 2.35; p = 7.5 × 10-8). The three HLA-DQβ1 amino acid positions are located together at the peptide binding groove, suggesting their functional importance in antigen presentation."
    explanation: Localizes the HLA risk association to peptide-binding-groove residues, supporting an antigen-presentation mechanism.
  downstream:
  - target: Pancystitis with Clonal B-Cell Expansion and Epithelial Denudation (Hunner Lesion)
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - HLA class II risk alleles are proposed to enable presentation of a
      currently unidentified antigen, triggering the adaptive immune response
      that produces pancystitis; the specific antigen and the intervening
      steps of immune activation are not yet established.
- name: Pancystitis with Clonal B-Cell Expansion and Epithelial Denudation (Hunner Lesion)
  biological_scale: TISSUE
  description: >
    Hunner-type IC is histologically distinct from non-Hunner IC/BPS: dense,
    full-thickness bladder-wall lymphoplasmacytic infiltration (pancystitis)
    with frequent light-chain-restricted clonal B-cell expansion and
    epithelial denudation, culminating in the characteristic Hunner ulcer
    (mucosal lesion with vessel disruption).
  cell_types:
  - preferred_term: B Cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: Plasma Cell
    term:
      id: CL:0000946
      label: antibody secreting cell
  evidence:
  - reference: PMID:26587589
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Substantial lymphoplasmacytic inflammation (≥200 cells/mm2) was observed in 93% of HIC specimens, whereas only 8% of NHIC specimens were inflamed."
    explanation: Quantifies the pancystitis distinguishing Hunner-type from non-Hunner IC on bladder biopsy.
  - reference: PMID:26587589
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, expansion of light-chain-restricted B-cells was observed in 31% of cases of HIC."
    explanation: Demonstrates clonal B-cell expansion as a distinguishing feature of Hunner-type IC pathology.
  - reference: PMID:26587589
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that NHIC and HIC are distinct pathological entities, with the latter characterized by pancystitis, frequent clonal B-cell expansion and epithelial denudation."
    explanation: Summarizes Hunner-type IC as a distinct inflammatory entity from non-Hunner IC/BPS.
  downstream:
  - target: Central Sensitization and Chronic Pelvic/Bladder Pain
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Autoimmune/inflammatory bladder-wall injury drives severe bladder-centric
      pain and reduced bladder capacity; a URO-OVA transgenic murine model of
      bladder-antigen-directed autoimmune cystitis shows that resulting pain
      behavior is Toll-like receptor 4 (TLR4)-dependent.
    evidence:
    - reference: PMID:31091120
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Compared with URO-OVA mice, TLR4-deficient URO-OVA mice developed significantly reduced nociceptive responses, although similar bladder inflammation and voiding dysfunction, after cystitis induction."
      explanation: Mouse model evidence that TLR4 signaling specifically mediates the pain (not the inflammation) resulting from bladder-autoantigen-directed autoimmune cystitis.
phenotypes:
- name: Pelvic/Bladder Pain
  description: >
    Suprapubic or pelvic pain, pressure, or discomfort perceived as related to
    the bladder, classically worsening with bladder filling and relieved by
    voiding; a core AUA diagnostic criterion for IC/BPS.
  phenotype_term:
    preferred_term: Pelvic pain
    term:
      id: HP:0034267
      label: Pelvic pain
  evidence:
  - reference: PMID:30015351
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interstitial cystitis/bladder pain syndrome (IC/BPS) is an umbrella term of chronic debilitating conditions of unknown etiology characterized by symptoms of lower urinary tract hypersensitivity such as bladder pain/discomfort, urgency, and urinary frequency."
    explanation: Review defining bladder/pelvic pain as a core IC/BPS symptom.
- name: Bladder Pain
  description: >
    Pain localized specifically to the urinary bladder, often more pronounced
    with a full bladder and partially relieved by voiding.
  phenotype_term:
    preferred_term: Bladder pain
    term:
      id: HP:0032171
      label: Bladder pain
  evidence:
  - reference: PMID:30015351
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bladder pain/discomfort, urgency, and urinary frequency"
    explanation: Names bladder pain/discomfort as a defining IC/BPS symptom.
- name: Urinary Urgency
  description: >
    A strong, sudden need to urinate; one of the core lower urinary tract
    symptoms required (together with pain) for an AUA-criteria IC/BPS
    diagnosis.
  phenotype_term:
    preferred_term: Urinary urgency
    term:
      id: HP:0000012
      label: Urinary urgency
  evidence:
  - reference: PMID:30015351
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bladder pain/discomfort, urgency, and urinary frequency"
    explanation: Names urgency as a defining IC/BPS symptom.
- name: Urinary Frequency
  description: >
    Increased frequency of daytime urination, often more than 8 voids per
    day; a core lower urinary tract symptom of IC/BPS.
  phenotype_term:
    preferred_term: Urinary frequency
    term:
      id: HP:0100515
      label: Pollakisuria
  evidence:
  - reference: PMID:30015351
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bladder pain/discomfort, urgency, and urinary frequency"
    explanation: Names urinary frequency as a defining IC/BPS symptom.
- name: Nocturia
  description: >
    Waking at night due to the need to urinate; very commonly reported by
    IC/BPS patients and a major contributor to sleep-related quality-of-life
    impairment.
  phenotype_term:
    preferred_term: Nocturia
    term:
      id: HP:0000017
      label: Nocturia
- name: Dyspareunia
  description: >
    Pain with sexual intercourse, reported in a substantial minority of
    IC/BPS patients and more common with comorbid vulvodynia.
  phenotype_term:
    preferred_term: Dyspareunia
    term:
      id: HP:0030016
      label: Dyspareunia

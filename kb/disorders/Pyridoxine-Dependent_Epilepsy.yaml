pathophysiology:
- name: Antiquitin (ALDH7A1) Deficiency
  description: >-
    Biallelic loss-of-function variants in ALDH7A1 abolish antiquitin
    (alpha-aminoadipic semialdehyde dehydrogenase) activity, a step in the
    saccharopine pathway of lysine degradation. This node captures the single
    concept of the enzyme deficiency.
  role: trigger
  gene:
    preferred_term: ALDH7A1
    term:
      id: hgnc:877
      label: ALDH7A1
  molecular_functions:
  - preferred_term: Aldehyde dehydrogenase (NAD+) activity
    term:
      id: GO:0004029
      label: aldehyde dehydrogenase (NAD+) activity
    modifier: DECREASED
  evidence:
  - reference: PMID:16491085
    reference_title: "Mutations in antiquitin in individuals with pyridoxine-dependent seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show here that children with pyridoxine-dependent seizures (PDS) have mutations in the ALDH7A1 gene, which encodes antiquitin"
    explanation: >-
      The founding study established biallelic ALDH7A1 (antiquitin) mutations as
      the cause of pyridoxine-dependent seizures.
  downstream:
  - target: Accumulation of Alpha-AASA and P6C
    causal_link_type: DIRECT
    description: >-
      Loss of antiquitin blocks the pathway, so its substrate alpha-AASA and the
      cyclic form P6C accumulate.
    evidence:
    - reference: PMID:26026794
      reference_title: "Triple therapy with pyridoxine, arginine supplementation and dietary lysine restriction in pyridoxine-dependent epilepsy: Neurodevelopmental outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PDE is caused by deficiency of α-aminoadipic semialdehyde dehydrogenase resulting in impaired lysine degradation and subsequent accumulation of α-aminoadipic semialdehyde"
      explanation: >-
        States the causal step directly: loss of the antiquitin
        (alpha-aminoadipic semialdehyde dehydrogenase) activity blocks lysine
        degradation and causes the substrate to accumulate.
- name: Accumulation of Alpha-AASA and P6C
  description: >-
    With antiquitin absent, alpha-aminoadipic semialdehyde (alpha-AASA) and its
    cyclic equilibrium partner delta-1-piperideine-6-carboxylate (P6C)
    accumulate in tissues and body fluids, where alpha-AASA serves as the
    diagnostic biomarker. This node captures the single concept of toxic
    metabolite accumulation.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: P6C-Mediated Inactivation of Pyridoxal 5-Phosphate
    causal_link_type: DIRECT
    description: >-
      P6C reacts with and inactivates pyridoxal 5'-phosphate.
    evidence:
    - reference: PMID:16491085
      reference_title: "Mutations in antiquitin in individuals with pyridoxine-dependent seizures."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The accumulating P6C inactivates pyridoxal 5'-phosphate (PLP) by forming a Knoevenagel condensation product."
      explanation: >-
        Identifies the accumulating metabolite P6C as the species that
        chemically inactivates PLP, which is the causal link this edge asserts.
- name: P6C-Mediated Inactivation of Pyridoxal 5-Phosphate
  description: >-
    P6C undergoes a Knoevenagel condensation with pyridoxal 5'-phosphate (PLP),
    chemically trapping and inactivating the active cofactor form of vitamin B6.
    This node captures the single concept of the metabolite-driven cofactor
    inactivation that links the enzyme block to a vitamin deficiency.
  role: mediator
  downstream:
  - target: Secondary Pyridoxal 5-Phosphate Deficiency
    causal_link_type: DIRECT
    description: >-
      Ongoing PLP inactivation depletes the intracellular pool of active
      vitamin B6.
    evidence:
    - reference: PMID:30671974
      reference_title: "Disorders affecting vitamin B(6) metabolism."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "disorders where metabolites accumulate that inactivate PLP, for example, ALDH7A1 deficiency and hyperprolinaemia type II"
      explanation: >-
        This review classifies ALDH7A1 deficiency specifically as a disorder in
        which accumulating metabolites inactivate PLP and thereby produce PLP
        deficiency. Evidence source is OTHER because this is a review article.
- name: Secondary Pyridoxal 5-Phosphate Deficiency
  description: >-
    Chronic inactivation of PLP produces a secondary, intracellular deficiency
    of the active vitamin B6 cofactor, which pharmacologic pyridoxine can
    partially overcome. This node captures the single concept of the acquired
    cofactor deficiency.
  role: mediator
  downstream:
  - target: Impaired PLP-Dependent GABA Synthesis and Excitation-Inhibition Imbalance
    causal_link_type: DIRECT
    description: >-
      PLP deficiency impairs the many PLP-dependent neuronal enzymes, notably
      glutamic acid decarboxylase.
    evidence:
    - reference: PMID:30671974
      reference_title: "Disorders affecting vitamin B(6) metabolism."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Because of the vital role of PLP in neurotransmitter metabolism, particularly synthesis of the inhibitory transmitter γ-aminobutyric acid"
      explanation: >-
        Ties PLP availability to synthesis of the inhibitory transmitter GABA,
        the PLP-dependent step this edge claims is impaired. Evidence source is
        OTHER because this is a review article.
- name: Impaired PLP-Dependent GABA Synthesis and Excitation-Inhibition Imbalance
  description: >-
    Glutamic acid decarboxylase, which synthesizes the inhibitory
    neurotransmitter GABA from glutamate, requires PLP as its cofactor; PLP
    deficiency lowers GABA synthesis and shifts cortical circuits toward
    excitation. This node captures the single concept of the
    excitation-inhibition imbalance and conforms to the shared epilepsy final
    common pathway.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  cell_types:
  - preferred_term: GABAergic interneuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  downstream:
  - target: Neuronal Hyperexcitability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced inhibitory tone renders neonatal networks hyperexcitable.
    evidence:
    - reference: PMID:30764523
      reference_title: "Pediatric Epilepsy Mechanisms: Expanding the Paradigm of Excitation/Inhibition Imbalance."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "increased excitation, decreased inhibition, or both favor a hyperexcitable state"

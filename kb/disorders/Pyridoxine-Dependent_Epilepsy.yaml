classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      An inborn error of lysine degradation: antiquitin (ALDH7A1) deficiency
      blocks the alpha-aminoadipic semialdehyde dehydrogenase step.
  - classification_value: NEUROLOGIC
    notes: >-
      Clinically a neonatal-onset epilepsy, so the epilepsy/neurology Part is
      the primary clinical home.
  icimd_category:
  - classification_value: lys_hyl_and_trp
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of lysine,
      hydroxylysine and tryptophan metabolism" under category "Disorders of
      amino acid metabolism". The primary enzymatic lesion is in lysine
      degradation; the pyridoxal 5'-phosphate deficiency is a secondary
      consequence of P6C accumulation, so this entry is classified with the
      amino-acid disorders rather than under "Disorders of pyridoxine
      metabolism" (which is where the primary PLP-synthesis defect, PNPO
      deficiency, belongs).

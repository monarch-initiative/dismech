name: Pyridoxine-Dependent Epilepsy
creation_date: "2026-07-18T00:00:00Z"
category: Mendelian
description: >-
  Pyridoxine-dependent epilepsy - ALDH7A1 (PDE-ALDH7A1) is an autosomal
  recessive, treatable metabolic epilepsy caused by deficiency of antiquitin
  (alpha-aminoadipic semialdehyde dehydrogenase), an enzyme of lysine
  degradation. Loss of antiquitin causes accumulation of
  alpha-aminoadipic semialdehyde (alpha-AASA) and its cyclic equilibrium form
  delta-1-piperideine-6-carboxylate (P6C); P6C chemically inactivates
  pyridoxal 5'-phosphate (PLP, the active form of vitamin B6), producing a
  secondary intracellular PLP deficiency. Because PLP is the cofactor for
  glutamic acid decarboxylase and many other neuronal enzymes, its depletion
  impairs GABA synthesis and drives neonatal-onset seizures that are resistant
  to standard antiseizure medication but respond to pharmacologic pyridoxine.
  Intellectual disability is common despite seizure control, motivating adjunct
  lysine-lowering therapy.
parents:
- Epilepsy
- Inborn Errors of Metabolism
- Neurodevelopmental Disorder
synonyms:
- PDE-ALDH7A1
- Antiquitin deficiency
- Alpha-aminoadipic semialdehyde dehydrogenase deficiency
- Pyridoxine-dependent epilepsy caused by ALDH7A1 mutant

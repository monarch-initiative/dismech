diagnosis:
- name: Urinary and Plasma Polyol and Sugar-Phosphate Profiling
  diagnosis_term:
    preferred_term: urine chemistry measurement
    term:
      id: NCIT:C61044
      label: Urine Chemistry Measurement
  description: Biochemical metabolite profiling of urine and plasma to detect accumulation of five-carbon
    and four-carbon polyols (erythritol, arabitol, ribitol) and pent(ul)ose-5-phosphates resulting from
    non-oxidative pentose phosphate pathway blockade.
  presence: Elevated urinary erythritol, arabitol, ribitol, and pent(ul)ose-5-phosphates; elevated plasma
    erythritol, arabitol, and ribitol
  results: Marked elevation of erythritol, arabitol, ribitol, and pent(ul)ose-5-phosphates provides the
    characteristic biochemical signature of transketolase deficiency.
  evidence:
  - reference: PMID:27259054
    reference_title: Mutations in TKT Are the Cause of a Syndrome Including Short Stature, Developmental
      Delay, and Congenital Heart Defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Elevated urinary excretion of erythritol, arabitol, ribitol, and pent(ul)ose-5-phosphates
      was detected, as well as elevated amounts of erythritol, arabitol, and ribitol in the plasma of
      affected individuals.
    explanation: Establishes urinary and plasma polyol and pentose-phosphate profiling as a key biochemical
      diagnostic test.

name: Transketolase Deficiency
creation_date: "2026-07-07T00:00:00Z"
category: Mendelian
synonyms:
- TKT deficiency
- Short stature-developmental delay-congenital heart defect syndrome
- SDDHD
description: >
  Transketolase deficiency is an ultra-rare autosomal recessive inborn error of
  the non-oxidative branch of the pentose phosphate pathway caused by biallelic
  pathogenic variants in TKT. Transketolase is a thiamine-dependent enzyme that
  reversibly transfers two-carbon units between sugar phosphates, linking the
  pentose phosphate pathway to glycolysis and recycling pentose phosphates.
  Loss of transketolase activity blocks non-oxidative pentose-phosphate
  metabolism, producing characteristic accumulation of the polyols erythritol,
  arabitol, and ribitol together with pentose(-ulose) phosphates in urine and
  plasma, and is thought to reduce NADPH availability for reductive
  biosynthesis and glutathione-dependent redox defense. Affected individuals
  present with short stature and developmental delay, frequently with
  congenital heart defects; chronic diarrhea and cataracts have been reported
  in older individuals. The disorder was first defined in three families
  (five affected individuals) by whole-exome sequencing, with enzymatic and
  urinary-metabolite confirmation. Management is largely supportive.

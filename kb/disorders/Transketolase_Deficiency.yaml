mechanistic_hypotheses:
- hypothesis_group_id: canonical_tkt_ppp_nadph_model
  hypothesis_label: Canonical TKT Non-Oxidative PPP / NADPH Redox Model
  status: CANONICAL
  description: 'Biallelic TKT variants reduce transketolase activity in the non-oxidative branch of the
    pentose phosphate pathway. The resulting block causes accumulation of polyols (erythritol, arabitol,
    ribitol) and pentose(-ulose) phosphates and is proposed to reduce NADPH available for nucleic acid
    synthesis, cell division, and maintenance of cerebral glutathione, thereby explaining growth failure
    (short stature) and neurodevelopmental delay.

    '
  evidence:
  - reference: PMID:27259054
    reference_title: Mutations in TKT Are the Cause of a Syndrome Including Short Stature, Developmental
      Delay, and Congenital Heart Defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Transketolase deficiency reduces NADPH synthesis and nucleic acid synthesis and cell division
      and could explain the problems with growth.
    explanation: The defining study proposes the NADPH-depletion mechanism linking the enzyme block to
      growth failure.
  - reference: PMID:27259054
    reference_title: Mutations in TKT Are the Cause of a Syndrome Including Short Stature, Developmental
      Delay, and Congenital Heart Defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: NADPH is also critical for maintaining cerebral glutathione, which might contribute to the
      neurodevelopmental delays.
    explanation: The study links reduced NADPH to glutathione-dependent redox defense in the brain and
      neurodevelopmental delay.

- category: Neurologic
  name: Epilepsy
  frequency: FREQUENT
  description: >-
    Epilepsy in 67%. Worth distinguishing from the seizure phenotype of Wolf-Hirschhorn
    syndrome, which maps to a terminal 4p region rather than to LETM1: microarray mapping in 48

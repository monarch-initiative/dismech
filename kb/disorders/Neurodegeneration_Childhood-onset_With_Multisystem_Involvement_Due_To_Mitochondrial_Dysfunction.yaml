name: Neurodegeneration, Childhood-Onset, with Multisystem Involvement Due to Mitochondrial Dysfunction
creation_date: "2026-09-06T01:30:00Z"
category: Mendelian
disease_term:
  preferred_term: neurodegeneration, childhood-onset, with multisystem involvement due to mitochondrial dysfunction
  term:
    id: MONDO:0859304
    label: neurodegeneration, childhood-onset, with multisystem involvement due to mitochondrial dysfunction
synonyms:
- CONDMIM
- LETM1 deficiency
- LETM1-related mitochondrial disease
- childhood-onset neurodegeneration with multisystem involvement due to mitochondrial dysfunction
description: >-
  An autosomal recessive mitochondrial disease caused by biallelic variants in LETM1, which
  encodes an inner mitochondrial membrane protein that acts as the mitochondrial K+/H+
  exchanger. The entity was defined in 2022 by a single international gene-matching study of 18
  affected individuals from 11 unrelated families; there is no earlier literature on it under
  any other name, and everything below rests on that report and on reviews of it.

  The mechanism is osmotic rather than catalytic, which is what distinguishes this disease from
  the rest of the paediatric mitochondrial group. LETM1 does not belong to a respiratory chain
  complex and does not assemble one. It sets matrix volume by exchanging potassium for protons
  across the inner membrane, so losing it does not disable a specific enzyme - it lets the
  matrix take up water. The consequences measured in proband fibroblasts and muscle are
  defective K+ efflux, a swollen matrix, and loss of oxidative phosphorylation protein
  components; the source reports the three together and does not order them, so the chain below
  imposes an order the data do not establish. On that reading the respiratory chain deficiency
  is downstream of a membrane-biophysics lesion. Whether the deficiency is combined rather than
  isolated is this entry's expectation from a non-subunit lesion, not something the source
  characterises.

  Clinically it reads as a severe infantile-onset multisystem mitochondrial disease with the
  nervous system taking the brunt. Respiratory chain complex deficiency was found in every
  patient assessed and global developmental delay in almost every one; optic atrophy affected
  83% and sensorineural hearing loss and cerebellar ataxia 78% each. Epilepsy,
  spasticity and myopathy follow, and a minority develop the features that mark the disease as
  systemic rather than purely neurological - cataracts, cardiomyopathy and diabetes. Onset was
  infantile in 14 of 18.

  The gene's more familiar context is the wrong one for this entry and is worth separating
  explicitly. LETM1 sits in the 4p16.3 interval deleted in Wolf-Hirschhorn syndrome, and its
  haploinsufficiency was long proposed as a driver of the WHS phenotype. That is a monoallelic
  contiguous-gene deletion; this is a biallelic single-gene recessive disease, and deletion
  mapping in WHS cohorts argues that LETM1 loss on its own does not reproduce WHS. The two
  should not be conflated, and a curator reaching for LETM1 literature will find most of it is
  about the other condition.
parents:
- Mitochondrial Disease
- Inherited Neurodegenerative Disorder

pathophysiology:

- name: Biallelic LETM1 Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Ultra-rare biallelic missense and loss-of-function LETM1 variants, identified by exome
    sequencing across eleven unrelated families through international gene matching. LETM1
    encodes an inner mitochondrial membrane protein whose function is osmoregulatory - it
    controls mitochondrial volume and ion homeostasis - rather than enzymatic, so the primary
    lesion is not in a respiratory chain subunit or an assembly factor.
  genetic_context:
    gene:
      preferred_term: LETM1
      term:
        id: hgnc:6556
        label: LETM1
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic in all reported individuals. The reported alleles are missense and
      loss-of-function; the study does not report a founder allele or a genotype-phenotype
      correlation, and with eighteen individuals it is not powered to.
  downstream:
  - target: Defective Mitochondrial Potassium Efflux
    causal_link_type: DIRECT
    description: >-
      Loss of the protein that carries out the exchange removes the exchange activity. The
      study measured K+/H+ exchange activity in proband-derived material rather than inferring
      it from the variant class.
    evidence:
    - reference: PMID:36055214
      reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our results demonstrate that bi-allelic LETM1 variants are associated with defective
        mitochondrial K+ efflux, swollen mitochondrial matrix structures, and loss of important
        mitochondrial oxidative phosphorylation protein components
      explanation: >-
        The variant-to-K+-efflux step, asserted from measurement in proband material rather
        than predicted. The same sentence carries the two downstream steps and is cited again
        on those edges.
  evidence:
  - reference: PMID:36055214
    reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Utilizing exome sequencing and international gene-matching efforts, we have identified 18
      affected individuals from 11 unrelated families harboring ultra-rare bi-allelic missense
      and loss-of-function LETM1 variants and clinical presentations highly suggestive of
      mitochondrial disease.
    explanation: >-
      The allelic spectrum and the size of the cohort the entity rests on.
  - reference: PMID:36055214
    reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Leucine zipper-EF-hand containing transmembrane protein 1 (LETM1) encodes an inner
      mitochondrial membrane protein with an osmoregulatory function controlling mitochondrial
      volume and ion homeostasis.
    explanation: >-
      What the gene product does, which is why the lesion is osmotic rather than catalytic.
      Graded OTHER because this sentence states established gene function as background rather
      than reporting a measurement made in the study.

- name: Defective Mitochondrial Potassium Efflux
  biological_scale: MOLECULAR
  description: >-
    LETM1 functions as the mitochondrial K+/H+ exchanger, and is additionally implicated in
    calcium uptake or extrusion. Without it, potassium that enters the matrix down the
    electrochemical gradient is not exported, so the exchange arm of the volume-control loop is
    missing.
  biological_processes:
  - preferred_term: mitochondrial potassium efflux via the K+/H+ exchanger
    modifier: DECREASED
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
  - preferred_term: proton countertransport across the inner mitochondrial membrane
    modifier: DECREASED
    term:
      id: GO:1902600
      label: proton transmembrane transport
  downstream:
  - target: Mitochondrial Matrix Osmotic Swelling
    causal_link_type: DIRECT
    description: >-
      Retained matrix potassium is osmotically active, so water follows it in.
    evidence:
    - reference: PMID:36055214
      reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our results demonstrate that bi-allelic LETM1 variants are associated with defective
        mitochondrial K+ efflux, swollen mitochondrial matrix structures, and loss of important
        mitochondrial oxidative phosphorylation protein components
      explanation: >-
        Defective efflux and swollen matrix are reported together as consequences of the same
        variants, which is the evidence for this edge.
  evidence:
  - reference: PMID:41191133
    reference_title: "Neurogenetic Disorders with Hearing Loss: Mechanisms, Classifications, and Emerging Insights."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      by acting as a mitochondrial K⁺/H⁺ exchanger as well as being involved in the uptake or
      extrusion of Ca 2+
    explanation: >-
      Names the transport activity whose loss this node asserts, and the calcium involvement
      the description mentions alongside it. Graded OTHER as a review's statement of
      established gene function.

- name: Mitochondrial Matrix Osmotic Swelling
  biological_scale: CELLULAR
  description: >-
    Swollen matrix structures on morphological study of proband fibroblasts and muscle. In cell
    models, LETM1 depletion produces the same swelling together with fragmentation and loss of
    cristae structure, and overexpression produces the opposite - elongation with matrix
    condensation - which is the pattern expected of an osmotic rather than a structural lesion.
  biological_processes:
  - preferred_term: distortion of inner mitochondrial membrane architecture
    modifier: ABNORMAL
    term:
      id: GO:0007007
      label: inner mitochondrial membrane organization
  - preferred_term: loss of cristae structure
    modifier: DECREASED
    term:
      id: GO:0042407
      label: cristae formation
  downstream:
  - target: Loss of Oxidative Phosphorylation Protein Components
    causal_link_type: DIRECT
    description: >-
      Cristae are where the respiratory chain resides, so losing cristae structure costs the
      complexes their membrane environment.
    evidence:
    - reference: PMID:36055214
      reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our results demonstrate that bi-allelic LETM1 variants are associated with defective
        mitochondrial K+ efflux, swollen mitochondrial matrix structures, and loss of important
        mitochondrial oxidative phosphorylation protein components
      explanation: >-
        Swollen matrix and OXPHOS protein loss are reported as consequences of the same
        variants in the same material. The sentence does not itself order the two, so the
        direction here follows the paper's own framing of osmoregulation as the upstream
        lesion.
  evidence:
  - reference: PMID:41191133
    reference_title: "Neurogenetic Disorders with Hearing Loss: Mechanisms, Classifications, and Emerging Insights."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      LETM1 depletion causes mitochondrial swelling, fragmentation and loss of cristae
      structure
    explanation: >-
      The swelling and cristae loss this node asserts, reported as the consequence of removing
      LETM1 rather than of one patient allele. Graded OTHER as a review's summary of prior
      cell-biological work.
  - reference: PMID:36055214
    reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To better understand the pathogenic mechanism of the identified LETM1 variants, we
      performed biochemical and morphological studies on mitochondrial K+/H+ exchange activity,
      proteins, and shape in proband-derived fibroblasts and muscles and in Saccharomyces
      cerevisiae, which is an important model organism for mitochondrial osmotic regulation.
    explanation: >-
      The material and assays behind the morphological claim. Graded IN_VITRO because the
      measurements are in cultured proband cells, explanted muscle and yeast rather than in an
      animal.

- name: Loss of Oxidative Phosphorylation Protein Components
  biological_scale: MOLECULAR
  description: >-
    Loss of important mitochondrial oxidative phosphorylation protein components in
    proband-derived material. This is a secondary loss: LETM1 is not a subunit of any complex
    and not an assembly factor, so what is lost is taken to be the maintenance of complexes
    that were assembled normally rather than their assembly. The source reports the protein
    loss; the assembly-versus-maintenance reading of it is this entry's.

    No GO term is bound here on purpose. The available process terms name assembly, which is
    exactly what this node says is not the defect, and binding one would contradict the
    sentence above it.
  downstream:
  - target: Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
    description: >-
      This entry's inference, not a measured step: fewer complex components is taken to mean
      less complex activity on assay. No source separates the two measurements.
  evidence:
  - reference: PMID:36055214
    reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results demonstrate that bi-allelic LETM1 variants are associated with defective
      mitochondrial K+ efflux, swollen mitochondrial matrix structures, and loss of important
      mitochondrial oxidative phosphorylation protein components
    explanation: >-
      The OXPHOS protein loss this node is, measured in proband-derived material.

- name: Respiratory Chain Complex Deficiency
  biological_scale: CELLULAR
  description: >-
    The one finding present in every assessed patient, and the reason the presentation is
    recognised as mitochondrial before the gene is known. Because the upstream lesion is
    osmotic rather than subunit-specific, this is the biochemical endpoint of the chain rather
    than its start.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  - preferred_term: aerobic respiration
    modifier: DECREASED
    term:
      id: GO:0009060
      label: aerobic respiration
  downstream:
  - target: Neuronal Bioenergetic Failure
    causal_link_type: DIRECT
    description: >-
      This entry's reading of why the nervous system takes the brunt, resting on the general
      oxidative dependence of neurons rather than on any measurement in this disease.
  - target: Multisystem Energy-Dependent Organ Dysfunction
    causal_link_type: DIRECT
    description: >-
      The same deficiency in heart, skeletal muscle, endocrine pancreas and lens.
  evidence:
  - reference: PMID:36055214
    reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The common features included respiratory chain complex deficiencies (100%), global
      developmental delay (94%), optic atrophy (83%), sensorineural hearing loss (78%), and
      cerebellar ataxia (78%) followed by epilepsy (67%), spasticity (53%), and myopathy (50%).
    explanation: >-
      Respiratory chain complex deficiency in 100% of the cohort. This enumerated sentence is
      quoted once here and cited again on the individual phenotypes whose frequencies it fixes.

- name: Neuronal Bioenergetic Failure
  biological_scale: CELLULAR
  description: >-
    ATP shortfall in neurons carrying a high and continuous oxidative demand. Two neuronal
    populations are named in the literature as impaired by LETM1 deficiency, cochlear and
    cerebellar; the retinal ganglion cell is listed below as this entry's inference from the
    optic atrophy rather than as a population any cited source identifies, and no source
    resolves the cerebellar involvement to a particular neuron type.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: cerebellar neuron
    term:
      id: CL:1001611
      label: cerebellar neuron
  - preferred_term: cochlear (spiral ganglion) neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  - preferred_term: retinal ganglion cell (inferred from the optic atrophy, not named by a source)
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: ATP biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006754
      label: ATP biosynthetic process
  downstream:
  - target: Progressive Neurodegeneration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41191133
    reference_title: "Neurogenetic Disorders with Hearing Loss: Mechanisms, Classifications, and Emerging Insights."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cardiolipin and LETM1 deficiencies impair both cochlear and cerebellar neurons
    explanation: >-
      Names the two neuronal populations whose failure the auditory and cerebellar phenotypes
      are attributed to. Graded OTHER as a review's synthesis.

- name: Progressive Neurodegeneration
  biological_scale: TISSUE
  description: >-
    Neurodegeneration accompanying multiple organ dysfunction, with a course described as
    variably progressive. It is what converts a static developmental picture into a
    deteriorating one and is the feature the disease is named for.

    No cell-death process is bound to this node. None of the sources here reports apoptosis,
    caspase activation or any other death pathway in this disease, and the mode of neuronal
    loss is simply not characterised. The edges below attribute each neurological phenotype to
    this node; they carry no evidence of their own, because no source makes the attribution
    for an individual phenotype.
  downstream:
  - target: Global Developmental Delay
    description: >-
      Attribution by this entry. The source establishes the phenotype's frequency, not its
      origin in this node.
  - target: Optic Atrophy
    description: >-
      Attribution by this entry, consistent with optic atrophy being a degenerative rather
      than a developmental lesion.
  - target: Sensorineural Hearing Loss
    description: >-
      Attribution by this entry, supported by cochlear neurons being named as a population
      LETM1 deficiency impairs.
  - target: Cerebellar Ataxia
    description: >-
      Attribution by this entry, supported by cerebellar neurons being named as a population
      LETM1 deficiency impairs.
  - target: Epilepsy
    description: >-
      Attribution by this entry. No source localises the epilepsy in this disease.
  - target: Spasticity
    description: >-
      Attribution by this entry, implying corticospinal involvement that no cited source
      demonstrates.
  evidence:
  - reference: PMID:36055214
    reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These manifested as a spectrum of predominantly infantile-onset (14/18, 78%) and variably
      progressive neurological, metabolic, and dysmorphic symptoms, plus multiple organ
      dysfunction associated with neurodegeneration.
    explanation: >-
      Neurodegeneration as the described course, and the infantile onset of it.

- name: Multisystem Energy-Dependent Organ Dysfunction
  biological_scale: ORGANISM
  description: >-
    Involvement outside the nervous system in a minority of patients: heart, skeletal muscle,
    endocrine pancreas and lens. Their presence is what makes the entity multisystem rather
    than a pure neurodegeneration, and their absence in a given child does not argue against
    the diagnosis. Cardiomyopathy and skeletal muscle myopathy are on the standard list of
    organ presentations for respiratory chain disorders; cataract and diabetes are not, so
    their appearance here is a feature of this entity rather than a generic mitochondrial
    pattern.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  downstream:
  - target: Myopathy
  - target: Bilateral Cataracts
  - target: Cardiomyopathy
  - target: Diabetes Mellitus
  evidence:
  - reference: PMID:36055214
    reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other features included bilateral cataracts (42%), cardiomyopathy (36%), and diabetes
      (27%).
    explanation: >-
      The extraneurological features and their frequencies. Quoted once here and cited again on
      the individual phenotypes it fixes.
  - reference: PMID:26917594
    reference_title: Hypoxia as a therapy for mitochondrial disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with RC disorders can present with blindness, deafness, gray or white matter
      brain disease, cardiomyopathy, skeletal muscle myopathy, GI dysmotility, anemia, ataxia,
      liver disease and kidney disease.
    explanation: >-
      The organ presentations respiratory chain disorders are known to produce, which is what
      places the cardiac and muscle involvement here in a recognised pattern. Note the list
      does not include cataract or diabetes, which is why the description marks those two as
      not following from the generic pattern.


diagnosis:

- name: Molecular testing of LETM1
  description: >-
    Sequencing establishes the diagnosis, and in practice it is how the entity is found: every
    reported family was identified by exome sequencing and then matched internationally.
    Because LETM1 is not a respiratory chain gene, it may be absent from older targeted
    mitochondrial panels; exome or genome sequencing is the reliable route.
  evidence:
  - reference: PMID:36055214
    reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Utilizing exome sequencing and international gene-matching efforts, we have identified 18
      affected individuals from 11 unrelated families harboring ultra-rare bi-allelic missense
      and loss-of-function LETM1 variants and clinical presentations highly suggestive of
      mitochondrial disease.
    explanation: >-
      The diagnostic route actually used across the whole reported cohort.

- name: Respiratory chain enzymology in muscle or fibroblasts
  description: >-
    Respiratory chain complex deficiency was found in every assessed patient, so enzymology
    supports the diagnosis of a mitochondrial disease and directs sequencing there. It does not
    point at LETM1 specifically: the deficiency here is secondary to an osmoregulatory lesion,
    so it does not carry the subunit-specific signature that some assembly-gene defects give.
  evidence:
  - reference: PMID:36055214
    reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The common features included respiratory chain complex deficiencies (100%), global
      developmental delay (94%), optic atrophy (83%), sensorineural hearing loss (78%), and
      cerebellar ataxia (78%) followed by epilepsy (67%), spasticity (53%), and myopathy (50%).
    explanation: >-
      The 100% figure is what makes enzymology a sensitive pointer to mitochondrial disease in
      this cohort.

treatments:

- name: Supportive and Multidisciplinary Care
  therapeutic_modality: BEHAVIORAL
  description: >-
    There is no disease-modifying therapy. Management is what the phenotype dictates: seizure
    control, hearing and vision assessment with the corresponding rehabilitation, cardiac
    surveillance given cardiomyopathy in about a third, glycaemic screening given diabetes in
    about a quarter, and developmental support. Vitamin and cofactor cocktails are the usual
    mainstay across mitochondrial disease; neither they nor the other proposed strategies
    alongside them have shown efficacy in randomised controlled trials, so they should be
    offered as such rather than as treatment. Nothing has been trialled in this entity
    specifically.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26917594
    reference_title: Hypoxia as a therapy for mitochondrial disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The current mainstay of managing mitochondrial disease involves the use of vitamin
      co-factors
    explanation: >-
      What is given in practice across mitochondrial disease. Quoted from the source's own
      framing of the management landscape rather than from a trial in this disease, which does
      not exist.
  - reference: PMID:26917594
    reference_title: Hypoxia as a therapy for mitochondrial disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      None of these approaches have demonstrated efficacy in randomized controlled clinical
      trials.
    explanation: >-
      The evidence status of the management strategies, stated plainly by the source. In the
      source the antecedent covers the cofactors together with the small-molecule bypass and
      antioxidant strategies listed with them, which is why the description names both.

- name: Avoidance of Mitochondrial Toxins
  therapeutic_modality: BEHAVIORAL
  description: >-
    A management principle rather than a therapy, and the one most likely to change a decision
    at the bedside: aminoglycoside and tetracycline antibiotics are toxic to mitochondria and
    are avoided where an alternative exists. This matters more than usual in a disease whose
    patients already have sensorineural hearing loss in four of five, since aminoglycoside
    ototoxicity would compound it.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26917594
    reference_title: Hypoxia as a therapy for mitochondrial disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      An important principle in the management of mitochondrial disease is to avoid exposures –
      such as aminoglycoside or tetracycline antibiotics – that are known to be toxic to
      mitochondria.
    explanation: >-
      Names both the principle and the two antibiotic classes the description singles out.

differential_diagnoses:

- name: Wolf-Hirschhorn syndrome
  description: >-
    The condition LETM1 is usually associated with, and a different genetic mechanism. WHS
    follows de novo monoallelic deletion of 4p16.3, a contiguous-gene interval that happens to
    contain LETM1; this entry requires biallelic LETM1 variants. Deletion mapping in WHS
    cohorts indicates that LETM1 loss on one allele is not sufficient for the WHS phenotype, so
    the two are not points on one spectrum. WHS is distinguished clinically by its craniofacial
    phenotype and growth deficiency, and its seizure phenotype maps to a terminal 4p interval
    that interstitial deletions removing LETM1 leave intact. Whether WHS can present with
    respiratory chain complex deficiency is not addressed by any source cited here.
  evidence:
  - reference: PMID:23963300
    reference_title: "Deletions involving genes WHSC1 and LETM1 may be necessary, but are not sufficient to cause Wolf-Hirschhorn Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altogether, these results show that although loss-of-function for WHSC1 and/or LETM1
      contributes to some of the features of WHS, deletion of additional genes is required for
      the full expression of the phenotype
    explanation: >-
      The genotype argument for keeping the two conditions apart.
  - reference: PMID:26747863
    reference_title: Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All other individuals in our cohort whose deletions encompass the terminal 751 kbp region
      report having seizures typical of WHS.
    explanation: >-
      Locates the WHS seizure phenotype in the terminal interval rather than in LETM1, which is
      the second strand of the argument for keeping the two conditions apart.

- name: Leigh syndrome and other paediatric respiratory chain disorders
  description: >-
    The group this presentation is drawn from clinically. A child with infantile-onset
    developmental delay, ataxia, optic atrophy and combined respiratory chain deficiency will
    be worked up as a mitochondrial disease of unspecified genetic cause. Over 150 causative
    genes were already known as of 2016 and LETM1 was added to that differential in 2022, so
    the list this disease has to be picked out of is long. Nothing in the clinical picture
    distinguishes it before sequencing; the distinguishing feature is mechanistic, in that the
    respiratory chain lesion here is secondary to loss of matrix volume control rather than to
    a defect in a complex or its assembly.
  evidence:
  - reference: PMID:26917594
    reference_title: Hypoxia as a therapy for mitochondrial disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To date, lesions in over 150 genes, encoded by the nuclear or mitochondrial (mtDNA)
      genomes, have been identified as disease-causing.
    explanation: >-
      The size of the genetic differential a child with this presentation sits in, as it stood
      in 2016. The source predates the LETM1 report, so it counts the differential this disease
      was later added to rather than one that includes it.

discussions:

- discussion_id: gap_letm1_swelling_versus_oxphos_loss_ordering
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the swollen matrix cause the loss of oxidative phosphorylation protein components, or
    do the two arise in parallel from the same ion-homeostasis lesion?
  attaches_to:
  - pathophysiology#Mitochondrial Matrix Osmotic Swelling
  - pathophysiology#Loss of Oxidative Phosphorylation Protein Components
  rationale: >-
    The defining study reports defective K+ efflux, swollen matrix structures and loss of
    OXPHOS protein components together, as associated consequences of the same variants. It
    does not order them, and no time-course or rescue experiment separating them has been
    published. This entry draws the edge swelling to protein loss because the paper frames
    perturbed osmoregulation as the upstream lesion, but that ordering is inference from the
    paper's framing rather than a measured sequence. If the two are parallel consequences, the
    chain here is wrong in shape even though every node in it is supported.

- discussion_id: gap_letm1_genotype_phenotype_correlation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is there a genotype-phenotype correlation between missense variants in the conserved LETM
    domain and truncating variants?
  attaches_to:
  - pathophysiology#Biallelic LETM1 Loss-of-Function Variant
  - has_subtypes#
  rationale: >-
    Eighteen individuals across eleven families carrying both missense and loss-of-function
    alleles is not enough to test whether allele class predicts severity or organ involvement,
    and the report does not claim it does. This entry therefore defines no subtypes. Whether
    residual exchange activity from a missense allele produces a milder course is open, and it
    is the question a second cohort would be able to answer.

notes: >-
  Scope of the evidence. This entry rests on one primary study of the disease itself
  (PMID:36055214) plus two reviews that read it, with two Wolf-Hirschhorn papers cited only to
  keep that condition separate and one general mitochondrial-disease paper for management, and
  everything asserted here is traceable to those. That is not a curation
  shortcut: the entity was defined in 2022 and, as far as the sources consulted here show, no
  second cohort has been published. Frequencies quoted as percentages are proportions of
  eighteen individuals, so each percentage point is roughly one patient and the bands should be
  read accordingly - 83% is 15 of 18, not a stable population estimate.

  What is deliberately absent. There are no animal or experimental model entries: the defining
  study used proband fibroblasts, explanted muscle and Saccharomyces cerevisiae rather than a
  mouse, and the hearing-loss review notes that global knockout is embryonically lethal in the
  relevant animal models, which is a reason to expect the gap to persist. There are no
  biochemical reference ranges and no clinical trials, because none were found for this entity.
  There are no subtypes, for the reason argued in the second discussion entry. There is no
  `datasets:` block, and that absence should be read as unchecked rather than as searched: the
  GEO discovery step could not run in the environment this entry was curated in, so no dataset
  search was completed either way. It is worth re-running before anyone concludes there is
  nothing to find.

  Two things that are named here without a cached source behind them. The acronym CONDMIM in
  the synonym list is OMIM's, and the entry carries no OMIM identifier because omim.org could
  not be reached from the environment this was curated in; treat the acronym as a search handle
  rather than as a verified cross-reference. Separately, the six edges from Progressive
  Neurodegeneration to the individual neurological phenotypes carry no evidence, because no
  source attributes a named phenotype to that node - each edge description says so.

  The Wolf-Hirschhorn trap. Most LETM1 literature is about WHS, where the gene is lost on one
  allele inside a contiguous-gene deletion. Searching LETM1 will return that literature
  preferentially, and its seizure and craniofacial findings do not transfer to this disease.
  The seizure phenotype of WHS in particular maps to a terminal 4p region rather than to LETM1
  (PMID:26747863), so citing WHS seizure work as support for the epilepsy phenotype here would
  be a straightforward error.


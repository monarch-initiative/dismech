genetic:

- name: LETM1
  gene_term:
    preferred_term: LETM1
    term:
      id: hgnc:6556
      label: LETM1
  relationship_type: CAUSATIVE
  association: >-
    Biallelic missense and loss-of-function LETM1 variants cause childhood-onset
    neurodegeneration with multisystem involvement by removing mitochondrial K+/H+ exchange and
    with it the control of matrix volume.
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:36055214
      reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Utilizing exome sequencing and international gene-matching efforts, we have identified 18
        affected individuals from 11 unrelated families harboring ultra-rare bi-allelic missense
        and loss-of-function LETM1 variants and clinical presentations highly suggestive of
        mitochondrial disease.
      explanation: >-
        Biallelic genotypes across eleven unrelated families, which is the basis for the
        recessive mode assigned to this gene-disease pair.
  notes: >-
    Monoallelic LETM1 loss is a different question. LETM1 lies inside the 4p16.3 interval
    deleted in Wolf-Hirschhorn syndrome and its haploinsufficiency has long been proposed as a
    WHS driver, but deletion mapping argues that losing one copy of LETM1 does not by itself
    reproduce WHS, and heterozygous carriers in these eleven families are not reported as
    affected.
  evidence:
  - reference: PMID:36055214
    reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Utilizing exome sequencing and international gene-matching efforts, we have identified 18
      affected individuals from 11 unrelated families harboring ultra-rare bi-allelic missense
      and loss-of-function LETM1 variants and clinical presentations highly suggestive of
      mitochondrial disease.
    explanation: >-
      The gene-disease assertion and the allelic spectrum behind it.
  - reference: PMID:23963300
    reference_title: "Deletions involving genes WHSC1 and LETM1 may be necessary, but are not sufficient to cause Wolf-Hirschhorn Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altogether, these results show that although loss-of-function for WHSC1 and/or LETM1
      contributes to some of the features of WHS, deletion of additional genes is required for
      the full expression of the phenotype
    explanation: >-
      Supports keeping the monoallelic-deletion literature separate from this biallelic entity:
      LETM1 loss on one allele is not sufficient for the WHS phenotype.


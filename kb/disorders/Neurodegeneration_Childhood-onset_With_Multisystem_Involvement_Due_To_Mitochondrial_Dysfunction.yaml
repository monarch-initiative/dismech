    368 kb from the 4p terminus, and individuals whose interstitial deletions spared that
    terminal region were largely seizure-free even though the deletions removed LETM1.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:36055214
    reference_title: Bi-allelic LETM1 variants perturb mitochondrial ion homeostasis leading to a clinical spectrum with predominant nervous system involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The common features included respiratory chain complex deficiencies (100%), global
      developmental delay (94%), optic atrophy (83%), sensorineural hearing loss (78%), and
      cerebellar ataxia (78%) followed by epilepsy (67%), spasticity (53%), and myopathy (50%).
    explanation: >-
      67% falls in the FREQUENT band (30-79%).
  - reference: PMID:26747863
    reference_title: Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      further refine the candidate seizure susceptibility region to a region 197 kbp in size,
      starting 368 kbp from the terminus of chromosome 4
    explanation: >-
      The WHS seizure-susceptibility interval this description points away from LETM1 towards.
      It does not bear on the epilepsy in this disease; it is cited to keep the two apart.
  - reference: PMID:26747863
    reference_title: Chromosomal microarray testing identifies a 4p terminal region associated with seizures in Wolf-Hirschhorn syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed a significant correlation between the presence of an interstitial 4p deletion
      and lack of a seizure phenotype
    explanation: >-
      Interstitial deletions, which remove LETM1 while sparing the terminus, are associated

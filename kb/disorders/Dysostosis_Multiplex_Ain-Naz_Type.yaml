biochemical:
- name: Lysosomal enzyme activities in plasma and cultured fibroblasts
  presence: Elevated in plasma, reduced in fibroblasts
  context: >-
    The mucolipidosis-type inverted pattern. Because untagged hydrolases are
    secreted rather than delivered to the lysosome, plasma activities of
    multiple lysosomal enzymes are raised while activities measured in cultured
    fibroblasts are low. This combination is what distinguishes the M6P
    targeting disorders from a single-enzyme storage disease and is the
    biochemical finding that should prompt LYSET sequencing when GNPTAB and
    GNPTG are negative.
  evidence:
  - reference: PMID:41858182
    reference_title: "The Diagnostic Odyssey of a Biochemically Confirmed Case of ML II: The First Western Patient With LYSET Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine enzymes showed increased levels in plasma, and seven showed decreased levels in fibroblasts."
    explanation: >-
      Quantifies the inverted plasma/fibroblast enzyme pattern in a patient
      with a homozygous LYSET nonsense variant.
  - reference: PMID:41858182
    reference_title: "The Diagnostic Odyssey of a Biochemically Confirmed Case of ML II: The First Western Patient With LYSET Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the LYSET gene must be considered in the differential diagnosis when M6P-labeled lysosomal enzymes are altered"
    explanation: >-
      States the diagnostic use of the finding — an altered M6P-labelled enzyme
      profile should prompt LYSET testing.
  notes: >-
    Which nine plasma enzymes were raised and which seven fibroblast activities
    were reduced is not recoverable from the abstract, so no individual analyte
    is named here and no reference interval is curated.
- name: Urinary glycosaminoglycans and sialic acid profile
  presence: Abnormal
  context: >-
    Urinary GAG excretion overlaps that of the mucopolysaccharidoses, which is
    part of why the disorder is misdiagnosed; the abnormal sialic acid profile
    reflects the mixed storage expected when the shared targeting marker rather
    than one hydrolase is lost.
  evidence:
  - reference: PMID:41858182
    reference_title: "The Diagnostic Odyssey of a Biochemically Confirmed Case of ML II: The First Western Patient With LYSET Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormal sialic acid profile and GAGs (glycosaminoglycans) were detected in urine."
    explanation: >-
      Documents both abnormal urinary findings in a genetically confirmed
      patient.
genetic:
- name: LYSET
  gene_term:
    preferred_term: LYSET
    term:
      id: hgnc:20218
      label: TMEM251
  relationship_type: CAUSATIVE
  association: Biallelic loss-of-function variants cause the disorder.
  variant_origin: GERMLINE
  notes: >-
    The gene has three names in current use: LYSET (lysosomal enzyme
    trafficking factor, the approved HGNC symbol), TMEM251 (the previous
    symbol, used in the founding clinical report), and GCAF (GNPTAB cleavage
    and activity factor, an alias). All four reported families are homozygous,
    and three of the four alleles are premature-termination variants. The
    p.(Arg45Trp) missense allele is expressed but fails to bind
    GlcNAc-1-phosphotransferase and does not rescue the sorting defect, so it
    too behaves as loss of function.
  evidence:
  - reference: PMID:33252156
    reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our work implicates TMEM251 in the pathogenesis of a novel disorder"
    explanation: The founding report establishes the gene-disease relationship.
  - reference: PMID:36074821
    reference_title: "The human disease gene LYSET is essential for lysosomal enzyme transport and viral infection."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "human pathogenic LYSET alleles failed to restore lysosomal sorting defects"
    explanation: >-
      Functional confirmation that the patient alleles are loss of function in
      a complementation assay.
  variants:
  - name: LYSET c.133C>T p.(Arg45Trp)
    description: >-
      Homozygous missense allele in family NMD02. The protein is expressed but
      is targeted to the Golgi less efficiently, binds GlcNAc-1-phosphotransferase
      poorly, and fails to rescue cathepsin missorting.
    evidence:
    - reference: PMID:33252156
      reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "However, p.Arg45Trp mutant TMEM251 protein was targeted less efficiently and the localization was punctate."
      explanation: >-
        Characterizes the mislocalization of the missense allele in transfected
        cells.
  - name: LYSET c.215dupA p.(Tyr72Ter)
    description: Homozygous premature-termination allele in family ID01.
  - name: LYSET c.112C>T p.(Gln38Ter)
    description: >-
      Homozygous nonsense allele found by whole-genome sequencing in the first
      reported Western patient, after more than a decade of undiagnosed
      investigation.
    evidence:
    - reference: PMID:41858182

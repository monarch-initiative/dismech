    explanation: Documents death in early adult life in the index family.
  - reference: PMID:33252156
    reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She died at the age of 5 years."
    explanation: Documents death in childhood in the affected child of family ID01.
  - reference: PMID:41858182
    reference_title: "The Diagnostic Odyssey of a Biochemically Confirmed Case of ML II: The First Western Patient With LYSET Deficiency."
    supports: SUPPORT

notes: >-
  Scope: this entry covers OMIM:619345 / MONDO:0859156 only. The similarly
  named "rhizomelic dysplasia, Ain-Naz type" (OMIM:619598, MONDO:0859203) is a
  different disorder — a different gene (GNPNAT1) and a different skeletal
  pattern (rhizomelic shortening, platyspondyly, large hands and feet). The
  shared eponym reflects only the shared first and last authors of the two
  reports, not a shared entity.

  Two classification slots were deliberately left empty. `isds_skeletal_category`
  is not populated because it may only be assigned to disorders the ISDS
  Nosology itself lists, and it could not be confirmed that this 2021-described
  disorder appears in the 2023 revision. `icimd_category` is not populated for
  the same reason relative to the 2021 ICIMD, which predates the gene-disease
  association. Neither omission is a claim that the disorder falls outside
  those nosologies.

  No GeneReviews chapter exists for LYSET/TMEM251 (PubMed searched
  2026-09-07 for "LYSET GeneReviews" and "TMEM251 GeneReviews"; zero hits), so
  there is no GeneReviews phenotype baseline for this entry.

  LYSET has a substantial cancer cell-biology literature — it was identified in
  CRISPR screens as a factor letting tumour cells use macropinocytosed
  extracellular protein as a nutrient source, and as a host factor for
  cathepsin-dependent viruses including SARS-CoV-2. Those papers are cited here
  only for the M6P-pathway mechanism they establish, graded IN_VITRO, and none
  of their oncology or virology conclusions is carried into this disease entry.

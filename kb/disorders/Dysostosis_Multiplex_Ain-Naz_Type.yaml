name: Dysostosis Multiplex, Ain-Naz Type
creation_date: "2026-09-07T00:00:00Z"
description: >-
  Dysostosis multiplex, Ain-Naz type (DMANT; OMIM 619345) is an ultra-rare
  autosomal recessive lysosomal enzyme-targeting disorder caused by biallelic
  loss-of-function variants in LYSET (TMEM251/GCAF). LYSET is a small
  two-transmembrane Golgi protein required for the stability, Site-1
  protease cleavage, and Golgi retention of GlcNAc-1-phosphotransferase, the
  enzyme that generates the mannose-6-phosphate (M6P) recognition marker on
  soluble acid hydrolases. Without LYSET the M6P tag is not applied, so
  hydrolases are missorted and hypersecreted instead of being delivered to the
  lysosome, and multisystem lysosomal storage follows. Clinically the disorder
  is a progressive mucolipidosis II-like disease: severe short stature, coarse
  facies, protuberant abdomen, dysostosis multiplex, joint contractures,
  cardiac valve thickening, progressive loss of mobility, and death in
  childhood or early adult life. Only four families have been published, so the
  entry is deliberately thin and rests on those primary reports plus the
  cell-biological characterization of LYSET.
category: Mendelian
categories:
- Lysosomal Storage Disorder
- Mucolipidosis
- Golgipathy
- Skeletal Dysplasia
- Disorder of Lysosomal Enzyme Trafficking
disease_term:
  preferred_term: dysostosis multiplex, Ain-Naz type
  term:
    id: MONDO:0859156

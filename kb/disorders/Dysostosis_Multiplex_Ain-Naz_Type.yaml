    reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They manifested increasingly coarse facial features, protruding abdomens, and progressive skeletal changes, reminiscent of mucopolysaccharidosis."
    explanation: >-

  modeled_mechanisms:
  - target: Multisystem Lysosomal Substrate Accumulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The mouse reproduces the biochemical signature of the human disorder —

    reference_title: "The Diagnostic Odyssey of a Biochemically Confirmed Case of ML II: The First Western Patient With LYSET Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was clinically diagnosed at 2 years old with contractures and severe dysplasia."
    explanation: Dates the clinical presentation in the one case with a documented early course.
- phase: Progressive skeletal decline
  notes: >-
    Skeletal changes and facial coarsening are described as progressive, and
    affected individuals lose mobility over time.
  evidence:
  - reference: PMID:33252156
    reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients gradually lost mobility"
    explanation: Records the progressive loss of mobility in the index family.
- phase: Early death
  age_range: age 5 years to the third decade
  notes: >-
    Death is reported across a wide age band in a very small series: one child
    at five years, one patient in childhood from respiratory causes, and the
    two oldest affected individuals of the index family in their twenties. No
    survival estimate can be derived from four families, and none is asserted.
    Note that no HPO mortality term could be bound: the HPO Mortality/Aging
    branch (which holds "Death in childhood") is outside the phenotype subtree
    the schema's PhenotypeTerm enum draws from, so this natural-history fact is
    recorded here rather than as a phenotype.
  evidence:
  - reference: PMID:33252156
    reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

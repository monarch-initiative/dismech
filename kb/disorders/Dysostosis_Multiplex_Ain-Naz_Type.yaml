inheritance:
- name: Autosomal recessive
  description: >-
    All reported families are homozygous for a LYSET allele; consanguinity is
    reported where parental relationship is stated. Penetrance is recorded as
    COMPLETE because every published homozygote is affected and no unaffected
    homozygote has been described - with four families that is an absence of
    counterexamples rather than a measured figure. Expressivity is VARIABLE in
    severity and survival while the core skeletal phenotype stays constant:
    reported outcomes span death at five years to survival into the twenties,
    as recorded in the progression block, without a corresponding difference in
    the dysostosis multiplex itself.

diagnosis:
- name: Plasma and Fibroblast Lysosomal Enzyme Panel
  description: >-
    The biochemical key, and the step that separates this disease from the rest
    of the skeletal dysplasias. Multiple lysosomal hydrolases are raised several
    fold in plasma while the same enzymes are deficient inside cultured
    fibroblasts, because the enzymes are made normally and then secreted instead
    of delivered. That paired pattern is the mucolipidosis II signature, so a
    patient reaching it without a GNPTAB or GNPTG variant is the one in whom
    LYSET should be tested.
  diagnosis_term:
    preferred_term: plasma and fibroblast lysosomal enzyme activity panel
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  presence: Positive
  results: >-
    Elevated plasma activity of multiple lysosomal hydrolases with reduced
    activity in cultured fibroblasts, in the absence of a GNPTAB or GNPTG
    variant.
  evidence:
  - reference: PMID:41858182
    reference_title: "The Diagnostic Odyssey of a Biochemically Confirmed Case of ML II: The First Western Patient With LYSET Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the LYSET gene must be considered in the differential diagnosis when M6P-labeled lysosomal enzymes are altered"
    explanation: >-
      States the diagnostic rule this record encodes: an altered
      mannose-6-phosphate enzyme profile should put LYSET in the differential.
- name: Molecular Diagnosis by Genome or Panel Sequencing
  description: >-
    The confirmatory step. The Western case was solved by whole-genome analysis
    after a long diagnostic odyssey, and both reporting groups argue that LYSET
    belongs on the panel used for mucolipidosis II/III-like presentations, which
    is the change that would shorten that odyssey for the next patient.
  diagnosis_term:
    preferred_term: whole genome sequencing
    term:
      id: NCIT:C101294
      label: Whole Genome Sequencing
  presence: Positive
  results: >-
    A biallelic LYSET (TMEM251) variant. Four alleles are published across four
    families, including the homozygous nonsense NM_001098621.4:c.112C>T
    (p.Gln38Ter).
  evidence:
  - reference: PMID:41858182
    reference_title: "The Diagnostic Odyssey of a Biochemically Confirmed Case of ML II: The First Western Patient With LYSET Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A whole-genome analysis identified the homozygous nonsense variant NM_001098621.4:c.112C>T (p.Gln38Ter) in the LYSET gene."
    explanation: >-
      Records genome sequencing as the modality that made the molecular
      diagnosis, and the allele it returned.
  - reference: PMID:40171858
    reference_title: Biallelic Variant in LYSET Associated With Mucolipidosis II-Like Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "emphasize the importance of including LYSET in the genetic diagnostic panel for MLII/III-like presentations"
    explanation: >-
      The authors' explicit recommendation that LYSET be on the diagnostic panel
      for this presentation, which is the testing route to this diagnosis.
differential_diagnoses:
- name: Mucolipidosis type II (I-cell disease)
  disease_term:
    preferred_term: mucolipidosis type II
    term:
      id: MONDO:0009650
      label: mucolipidosis type II
  description: >-
    The closest differential and the one this disorder is repeatedly mistaken
    for. Mucolipidosis II is caused by biallelic GNPTAB variants that abolish
    GlcNAc-1-phosphotransferase itself; LYSET deficiency knocks out the factor
    the phosphotransferase depends on, one step upstream. The clinical,
    radiographic, and enzyme findings are described as strikingly similar.
  distinguishing_features:
  - >-
    In practice the two are separated by molecular testing: GNPTAB and GNPTG
    are normal in LYSET deficiency. Because LYSET was associated with disease
    only recently it is often absent from mucolipidosis gene panels, which is
    the stated reason the first Western case went undiagnosed for more than a
    decade.
  evidence:
  - reference: PMID:40171858
    reference_title: "Biallelic Variant in LYSET Associated With Mucolipidosis II-Like Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "emphasize the importance of including LYSET in the genetic diagnostic panel for MLII/III-like presentations"
    explanation: >-
      States the diagnostic consequence of the overlap: LYSET must be on the
      panel used for mucolipidosis II/III-like presentations.
- name: Mucolipidosis type III alpha/beta
  disease_term:
    preferred_term: mucolipidosis type III, alpha/beta
    term:
      id: MONDO:0018931
      label: mucolipidosis type III, alpha/beta
  description: >-
    The attenuated GNPTAB phenotype, which shares the raised plasma lysosomal
    enzyme signature and a milder dysostosis multiplex.
  distinguishing_features:
  - >-
    Later onset and slower progression than the reported LYSET cases, and
    resolved by GNPTAB sequencing.
  evidence:
  - reference: PMID:40171858
    reference_title: "Biallelic Variant in LYSET Associated With Mucolipidosis II-Like Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "pathogenic variants in the LYSET gene have been linked to a novel disorder resembling mucolipidosis types II/III (MLII/III)"
    explanation: >-
      Places the LYSET disorder in the mucolipidosis II/III differential.
- name: Mucopolysaccharidoses
  disease_term:
    preferred_term: mucopolysaccharidosis
    term:
      id: MONDO:0019249
      label: mucopolysaccharidosis
  description: >-
    The clinical picture — coarse facies, dysostosis multiplex, protuberant
    abdomen, contractures, urinary glycosaminoglycans — was read as
    mucopolysaccharidosis in the index families before the gene was known.
  distinguishing_features:
  - >-
    In the mucopolysaccharidoses a single specific hydrolase is deficient and
    plasma lysosomal enzyme activities are not globally raised; in LYSET
    deficiency multiple plasma enzyme activities are elevated while fibroblast
    activities are low.
  evidence:
  - reference: PMID:33252156
    reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressive skeletal changes, reminiscent of mucopolysaccharidosis"
    explanation: >-
      The founding report describes the phenotype as resembling
      mucopolysaccharidosis, which is the differential it had to be
      distinguished from.
- name: Rhizomelic dysplasia, Ain-Naz type
  disease_term:
    preferred_term: rhizomelic dysplasia, Ain-Naz type
    term:
      id: MONDO:0859203
      label: rhizomelic dysplasia, Ain-Naz type
  description: >-
    A separate disorder that shares the Ain-Naz eponym only because the two
    reports share their first and last authors. It is caused by a homozygous
    GNPNAT1 variant and presents as extreme rhizomelic limb shortening with
    platyspondyly and hip dysplasia, not as dysostosis multiplex.
  distinguishing_features:
  - >-
    Different gene (GNPNAT1, encoding glucosamine 6-phosphate
    N-acetyltransferase, versus LYSET), different OMIM entry (619598 versus
    619345), and a different skeletal pattern: rhizomelic shortening with
    platyspondyly rather than dysostosis multiplex. The founding report of the
    rhizomelic disorder describes neither coarse facies nor an abnormal
    lysosomal enzyme profile, though the abstract consulted here would not
    necessarily record their absence. The two are mechanistically adjacent — GNPNAT1
    makes the UDP-GlcNAc that GlcNAc-1-phosphotransferase uses as substrate —
    but they are not the same entity and should not be merged.
  evidence:
  - reference: PMID:32591345
    reference_title: "Novel form of rhizomelic skeletal dysplasia associated with a homozygous variant in GNPNAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients presented with short stature due to extreme shortening of the proximal segments of the limbs."
    explanation: >-
      Describes the rhizomelic phenotype that defines the separate Ain-Naz
      disorder, distinct from the dysostosis multiplex pattern curated here.
  - reference: PMID:32591345
    reference_title: "Novel form of rhizomelic skeletal dysplasia associated with a homozygous variant in GNPNAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WGS data analyses identified a homozygous missense variant c.226G>A; p.(Glu76Lys) in GNPNAT1, segregating with the disease."
    explanation: >-
      Establishes that the rhizomelic Ain-Naz disorder is a GNPNAT1 disorder,
      so the shared eponym does not indicate a shared gene.

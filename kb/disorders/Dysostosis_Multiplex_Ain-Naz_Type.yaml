progression:
- phase: Infantile presentation
  age_range: from about 5 months of age
  notes: >-
    In the one case with a documented early course, hand contractures and a
    recognizable facial appearance were present at five months, with the
    clinical diagnosis of contractures and severe dysplasia made at two years.
  evidence:

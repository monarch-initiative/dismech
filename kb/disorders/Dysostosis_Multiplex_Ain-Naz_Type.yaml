classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      An inborn error of metabolism: a lysosomal enzyme-targeting (M6P
      pathway) defect producing multisystem lysosomal storage.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Autosomal recessive Mendelian disorder caused by biallelic LYSET
      (TMEM251) variants, reported in consanguineous families.
  lysosomal_storage_category:
    classification_value: mucolipidosis
    notes: >-
      Classified with the mucolipidoses rather than with a single-hydrolase
      storage disease because, as in mucolipidosis II, no individual lysosomal
      hydrolase is defective: loss of the mannose-6-phosphate recognition
      marker missorts many soluble acid hydrolases at once. The authors of the
      most recent clinical report explicitly propose "LYSET-related
      mucolipidosis" for this disorder; a separate group proposed
      "Mucolipidosis Type V". Neither name is yet adopted by MONDO or OMIM,
      which retain the Ain-Naz eponym.
    evidence:
    - reference: PMID:40171858
      reference_title: "Biallelic Variant in LYSET Associated With Mucolipidosis II-Like Phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We propose the term \"LYSET-related mucolipidosis\" to describe this disorder"
      explanation: >-
        The clinical report proposing the disorder be named as a
        mucolipidosis, on the basis of clinical, enzymatic and radiographic
        features matching mucolipidosis II.

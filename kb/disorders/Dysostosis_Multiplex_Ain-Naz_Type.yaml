    evidence:
    - reference: PMID:36074821
      reference_title: "The human disease gene LYSET is essential for lysosomal enzyme transport and viral infection."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lyset knockout mice exhibited MLII-like phenotypes"
      explanation: >-
        Establishes that the mouse reproduces mucolipidosis II-like features,
        supporting its use as a model of the trafficking lesion.
- name: tmem251 knockout zebrafish
  species: Zebrafish
  genotype: TMEM251 (GCAF) deletion
  publication: PMID:36096887
  description: >-
    Zebrafish lacking the LYSET orthologue develop skeletal dysplasia and
    cardiac oedema, reported by the authors as phenocopying mucolipidosis II.
  evidence:
  - reference: PMID:36096887
    reference_title: "GCAF(TMEM251) regulates lysosome biogenesis by activating the mannose-6-phosphate pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In zebrafish, TMEM251 deletion leads to severe developmental defects including heart edema and skeletal dysplasia"
    explanation: >-
      Establishes that this zebrafish knockout exists and what phenotype it
      produces.
  modeled_mechanisms:
  - target: Skeletal and Connective-Tissue Storage Disease
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Unlike the mouse, the zebrafish reproduces a skeletal phenotype, so it is
      currently the only whole-organism model that reaches the tissue-level
      disease.
    limitations: >-
      Zebrafish skeletal development differs substantially from human
      endochondral ossification, and the reported phenotype is a developmental
      dysplasia in the embryo rather than the progressive postnatal dysostosis
      multiplex of patients. Cardiac oedema has no clear human counterpart in
      this disorder.
    evidence:
    - reference: PMID:36096887
      reference_title: "GCAF(TMEM251) regulates lysosome biogenesis by activating the mannose-6-phosphate pathway."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In zebrafish, TMEM251 deletion leads to severe developmental defects including heart edema and skeletal dysplasia, which phenocopies Mucolipidosis Type II."
      explanation: >-
        Reports the skeletal phenotype of the zebrafish knockout and the
        authors' own comparison to mucolipidosis II.
treatments:
- name: Supportive and Multidisciplinary Management
  description: >-
    No disease-specific or disease-modifying therapy has been reported for any
    of the published patients. Management in the case reports is supportive,
    and by analogy with mucolipidosis II would involve orthopaedic, cardiac,
    and respiratory surveillance. Conventional single-enzyme replacement is not
    a candidate here for a mechanistic reason: the lesion is in the targeting
    marker itself, so an infused hydrolase would face the same M6P-receptor
    uptake route that is defective. The candidate disease-modifying strategies
    that do exist have all been tested in mucolipidosis II rather than in this
    disorder; they are recorded, with their sources, in the
    `dmant_no_therapy` discussion rather than here, so that nothing in this
    treatment block reads as evidence about a LYSET patient.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Deliberately uncited. No treatment study, trial, or management guideline
    exists for LYSET deficiency; the four published reports describe diagnosis
    and natural history only, and none states a treatment. Rather than
    borrowing a mucolipidosis II management citation and presenting it as
    evidence about this disorder, the treatment is recorded without evidence
    and the gap is registered in the discussions section.
discussions:
- discussion_id: dmant_phenotype_breadth
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the full phenotypic range of LYSET deficiency, and which features
    of the reported cases are consistent and which are individual?
  attaches_to:
  - phenotypes#
  rationale: >-
    The entire clinical description rests on four published families.
    Craniosynostosis is reported once; the cardiac assessment is
    detailed in one patient; neurodevelopmental status is barely described
    anywhere. Frequencies cannot be estimated, so most phenotypes here carry no
    frequency band, and the two that do carry one as an explicitly labelled
    curator estimate, on the basis that every published family shows them. A
    case series or registry is needed before any feature can be called
    characteristic or excluded.
  status: OPEN
- discussion_id: dmant_no_therapy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is any disease-modifying therapy plausible for a disorder of the
    mannose-6-phosphate targeting marker itself?
  attaches_to:
  - treatments#
  rationale: >-
    Nothing is published on treatment for this disorder. The mechanism argues
    against straightforward enzyme replacement, since the defect is in the
    receptor recognition marker rather than in one hydrolase, and infused
    enzyme relies on the same M6P-receptor uptake route. Every candidate
    strategy that exists has been tested in mucolipidosis II, which shares the
    downstream lesion but not the gene: haematopoietic stem cell
    transplantation, bisphosphonate treatment in a Gnptab knock-in mouse, and
    enzyme cross-correction with pre-tagged hydrolases. The two evidence items
    below are mucolipidosis II studies, cited here to show what the
    transferable candidate set is, and neither says anything about a patient
    with LYSET deficiency. Whether that transfer is valid is exactly what is
    unknown. This is an absence of evidence, not evidence of futility.
  evidence:
  - reference: PMID:33505859
    reference_title: "Is hematopoietic stem cell transplantation a therapeutic option for mucolipidosis type II?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HSCT resulted in a sustained reduction of lysosomal storage und bone metabolism markers."
    explanation: >-
      A mucolipidosis II patient, not a LYSET patient. Cited only to establish
      that transplantation is the one candidate with human data anywhere in
      this mechanism class, and that even there the same report records
      progression of skeletal disease and calls the benefit unclear.
  - reference: PMID:42320387
    reference_title: "Zoledronic acid ameliorates multiple organ pathologies in a murine model of mucolipidosis II by partially restoring mannose-6-phosphate-mediated lysosomal hydrolase activities."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Zoledronic acid treatment increased both M6P-dependent and M6P-independent luminal hydrolases, and reduced glycosaminoglycan storage in MLII skin fibroblasts."
    explanation: >-
      A Gnptab knock-in mouse and mucolipidosis II fibroblasts, not a LYSET
      model. Cited to record that pharmacological partial restoration of
      hydrolase delivery has been achieved downstream of the same lesion, which
      is the reason the question is open rather than closed.
  status: OPEN
- discussion_id: dmant_unverified_features
  kind: CURATION_TODO
  prompt: >-
    Are hemivertebrae, dental abnormalities, and the reported ventricular
    septal defect genuine features of this disorder?
  attaches_to:
  - phenotypes#
  rationale: >-
    The OpenScientist deep-research report for this entry lists hemivertebrae,
    dental abnormalities, and a ventricular septal defect in one patient among
    the phenotypes, but attaches no citation to any of them, and none could be
    traced to a quotable passage in the four primary reports as cached here.
    They were therefore not curated. They are plausible — all three occur in
    mucolipidosis II — which is precisely why they should not be added on
    plausibility. Resolving this needs the full text of the primary case
    reports or the OMIM clinical synopsis read directly.
  status: OPEN
- discussion_id: dmant_chondrocyte_vs_storage
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does LYSET have a chondrocyte-autonomous role in skeletal development that
    is separable from the mannose-6-phosphate targeting defect, and does the
    rodent chondrocyte result translate to human growth plate?
  attaches_to:
  - pathophysiology#Impaired Chondrocyte Differentiation
  rationale: >-
    The founding report showed that siRNA knockdown dedifferentiates rat
    primary chondrocytes and proposed a function in chondrocyte
    differentiation. That result is in cultured rodent cells; no human growth
    plate or human chondrocyte data exist. It matters because the Lyset
    knockout mouse reproduces the biochemical lesion without the skeletal
    disease, so the M6P defect alone may not account for the severity of the
    human skeletal phenotype — yet the one experiment pointing at an additional
    chondrocyte mechanism is the one whose translational validity is least
    established.
  status: OPEN
- discussion_id: dmant_nomenclature
  kind: OPEN_QUESTION
  prompt: >-
    Should this disorder be named as a mucolipidosis rather than by the Ain-Naz
    eponym?
  attaches_to:
  - disease#Dysostosis Multiplex, Ain-Naz Type
  rationale: >-
    Three names are in circulation for the same entity: the OMIM/MONDO eponym
    used here, "LYSET-related mucolipidosis" proposed by the most recent
    clinical report, and "Mucolipidosis Type V" proposed by the group that
    named the gene GCAF. The mechanistic case for a mucolipidosis label is
    strong — the lesion is one step upstream of the GNPTAB lesion of
    mucolipidosis II — but the eponym is what the identifier resolves to, so
    the entry keeps it and records the alternatives as synonyms. This is a
    nomenclature question for the community, not a curation error.
  status: OPEN

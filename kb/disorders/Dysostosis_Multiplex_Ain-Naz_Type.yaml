phenotypes:
- name: Dysostosis multiplex
  description: >-
    The defining radiographic pattern: a dysostosis multiplex-like skeletal
    dysplasia resembling mucopolysaccharidosis, present in every reported
    family.
  phenotype_term:
    preferred_term: Dysostosis multiplex
    term:
      id: HP:0000943
      label: Dysostosis multiplex
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:33252156
    reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In family NMD02, affected individuals had a dysostosis multiplex-like skeletal dysplasia and severe short stature"
    explanation: >-
      Names the dysostosis multiplex pattern in the affected individuals of the
      index family. The VERY_FREQUENT band is a curator estimate under pattern
      D of docs/frequency-evidence-guidelines.md: the feature is present in
      every one of the four published families and is the feature the disorder
      is named for, but no cohort large enough to yield a percentage exists.
  - reference: PMID:40171858
    reference_title: "Biallelic Variant in LYSET Associated With Mucolipidosis II-Like Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two Iranian brothers with homozygous pathogenic variants in LYSET (c.197dupA) who exhibit clinical, enzymatic, and radiographic features strikingly similar to MLII."
    explanation: >-
      Independent family with radiographic features matching mucolipidosis II,
      the dysostosis multiplex pattern.
- name: Severe short stature
  description: >-
    Extreme short stature; height below -8.5 SD was recorded in the index
    family.
  phenotype_term:
    preferred_term: Severe short stature
    term:
      id: HP:0003510
      label: Severe short stature
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:33252156
    reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "affected individuals had a dysostosis multiplex-like skeletal dysplasia and severe short stature"
    explanation: >-
      Severe short stature is reported as a defining feature of the index
      family. The VERY_FREQUENT band is a curator estimate under pattern D of
      docs/frequency-evidence-guidelines.md: short stature is reported in every
      published family, but no cohort percentage exists.
- name: Coarse facial features

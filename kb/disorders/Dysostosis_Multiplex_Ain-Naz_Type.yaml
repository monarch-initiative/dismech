    explanation: Documents the death and its respiratory cause in the first Western case.
pathophysiology:
- name: Biallelic LYSET Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous loss-of-function variants in LYSET (TMEM251) abolish or
    functionally cripple the small Golgi transmembrane protein LYSET. Reported
    alleles include the missense p.(Arg45Trp), which is expressed but fails to
    bind GlcNAc-1-phosphotransferase, and several premature-termination alleles.
  gene:
    preferred_term: LYSET
    term:
      id: hgnc:20218
      label: TMEM251
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      All four reported families carry homozygous LYSET alleles: c.133C>T
      p.(Arg45Trp), c.215dupA p.(Tyr72Ter), c.112C>T p.(Gln38Ter), and
      c.197dupA. Consanguinity is reported in the families for which it is
      stated.
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:33252156
    reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified two homozygous variants c.133C>T; p.(Arg45Trp) and c.215dupA; p.(Tyr72Ter), respectively, in the two families, affecting an evolutionary conserved gene TMEM251"
    explanation: >-
      The founding report identifies biallelic TMEM251 (LYSET) variants as the
      cause in the two index families.
  - reference: PMID:33252156
    reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunofluorescence and confocal studies using human osteosarcoma cells indicated that TMEM251 is localized to the Golgi complex."
    explanation: >-
      Establishes the Golgi localization of the affected protein in a human
      cell line, the compartment in which the downstream lesion occurs.
  downstream:
  - target: GlcNAc-1-Phosphotransferase Destabilization and Golgi Mislocalization
    causal_link_type: DIRECT
    description: >-
      LYSET is required to keep GlcNAc-1-phosphotransferase stable, cleaved,
      and retained in the Golgi; without it the enzyme is lost.
    evidence:
    - reference: PMID:36074822
      reference_title: "Lysosomal enzyme trafficking factor LYSET enables nutritional usage of extracellular proteins."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Without LYSET, GlcNAc-1-phosphotransferase was unstable because of a hydrophilic transmembrane domain."
      explanation: >-
        States the causal step directly: loss of LYSET destabilizes
        GlcNAc-1-phosphotransferase.
  - target: Impaired Chondrocyte Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Knockdown of the orthologous gene dedifferentiates primary chondrocytes,
      suggesting a growth-plate-autonomous contribution whose intermediate
      steps are not established.
    evidence:
    - reference: PMID:33252156
      reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Tmem251 knockdown by small interfering RNA induced dedifferentiation of rat primary chondrocytes."
      explanation: >-
        Loss of the gene product in cultured chondrocytes causes
        dedifferentiation, supporting an effect on the chondrocyte lineage.
        The steps between the human genotype and this cellular change are not
        established, which is why the edge is typed as having unknown
        intermediates.
- name: GlcNAc-1-Phosphotransferase Destabilization and Golgi Mislocalization
  biological_scale: MOLECULAR
  description: >-
    LYSET is a two-transmembrane Golgi protein that binds
    GlcNAc-1-phosphotransferase, supports its Site-1-protease cleavage and
    activity, and anchors it in the Golgi. In LYSET-deficient cells the
    phosphotransferase is destabilized and redistributes from the Golgi to
    lysosomes, where it is degraded.
  molecular_functions:
  - preferred_term: N-acetylglucosamine-1-phosphotransferase activity
    term:
      id: GO:0003976
      label: UDP-N-acetylglucosamine-lysosomal-enzyme N-acetylglucosaminephosphotransferase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:36074821
    reference_title: "The human disease gene LYSET is essential for lysosomal enzyme transport and viral infection."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "LYSET deficiency resulted in global loss of M6P tagging and mislocalization of GlcNAc-1-phosphotransferase from the Golgi complex to lysosomes."
    explanation: >-
      Documents both the mislocalization of the phosphotransferase and the
      resulting global loss of M6P tagging in LYSET-deficient human cells.
  - reference: PMID:41807387
    reference_title: "Molecular insights into the regulation of GNPTαβ by LYSET."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that LYSET is a two-transmembrane protein essential for GNPT stability, cleavage by Site-1 Protease (S1P), and enzymatic activity"
    explanation: >-
      Resolves the mechanism of the node: LYSET is required for
      GlcNAc-1-phosphotransferase stability, proteolytic activation, and
      catalytic activity.
  - reference: PMID:39937677
    reference_title: "LYSET facilitates integration of both the N- and C-terminal transmembrane helices/cytoplasmic domains of GlcNAc-1-phosphotransferase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that the C-terminal TMH of GNPTαβ also contributes to LYSET-mediated Golgi retention."
    explanation: >-
      Independent work localizing the LYSET requirement to the transmembrane
      helices of GlcNAc-1-phosphotransferase, which is what its Golgi retention
      depends on.
  - reference: PMID:36456556
    reference_title: "Golgipathies reveal the critical role of the sorting machinery in brain and skeletal development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "even though the consequences of mutations in these genes affect endosomal and lysosomal compartments, the problem originates in the Golgi complex"
    explanation: >-
      Places the primary lesion in the Golgi rather than in the lysosome, which
      is what this node asserts and what distinguishes this disorder's
      mechanism from a classical intralysosomal enzyme deficiency. Graded OTHER
      because this is a commentary synthesizing several primary studies.
  downstream:
  - target: Loss of Mannose-6-Phosphate Tagging of Lysosomal Hydrolases
    causal_link_type: DIRECT
    description: >-
      Loss of functional GlcNAc-1-phosphotransferase removes the enzyme that
      initiates M6P-marker synthesis.
- name: Loss of Mannose-6-Phosphate Tagging of Lysosomal Hydrolases
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  biological_scale: MOLECULAR
  description: >-
    Soluble acid hydrolases are no longer tagged with mannose-6-phosphate, the
    recognition marker read by the M6P receptors that route them from the
    trans-Golgi network to the lysosome. Because the marker is shared by
    roughly seventy soluble hydrolases, the defect is a simultaneous functional
    deficiency of many enzymes rather than of one.
  biological_processes:
  - preferred_term: protein targeting to lysosome
    term:
      id: GO:0006622
      label: protein targeting to lysosome
    modifier: DECREASED
  - preferred_term: macromolecule catabolic process
    term:
      id: GO:0009057
      label: macromolecule catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:36096887
    reference_title: "GCAF(TMEM251) regulates lysosome biogenesis by activating the mannose-6-phosphate pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Deleting TMEM251 causes mistargeting of most lysosomal enzymes due to their loss of M6P modification and accumulation of numerous undigested materials."
    explanation: >-
      Directly states that loss of TMEM251 abolishes the M6P modification and
      thereby mistargets most lysosomal enzymes.
  - reference: PMID:37474375
    reference_title: "Lysosomal enzyme trafficking: from molecular mechanisms to human diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hydrolysis of the different classes of macromolecules is catalyzed by about 70 soluble enzymes that are transported from the Golgi apparatus to lysosomes in a mannose 6-phosphate (M6P)-dependent process."
    explanation: >-
      Establishes the breadth of the pathway — why a single tagging defect
      produces a multi-enzyme functional deficiency. Graded OTHER because this
      is a review synthesizing the field rather than a primary study.
  downstream:
  - target: Hydrolase Missorting and Hypersecretion
    causal_link_type: DIRECT
    description: >-
      Untagged hydrolases are not captured by M6P receptors and follow the
      default secretory route.
- name: Hydrolase Missorting and Hypersecretion
  biological_scale: CELLULAR
  description: >-
    Untagged hydrolases escape M6P-receptor capture at the trans-Golgi network
    and are secreted, so the cell is depleted of intracellular lysosomal enzyme
    while extracellular fluid is enriched for it. This inverted distribution —
    high enzyme activity in plasma, low activity in cultured fibroblasts — is
    the diagnostic biochemical signature shared with mucolipidosis II.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:36074822
    reference_title: "Lysosomal enzyme trafficking factor LYSET enables nutritional usage of extracellular proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consequently, LYSET-deficient cells were depleted of lysosomal enzymes and impaired in turnover of macropinocytic and autophagic cargoes."
    explanation: >-
      Demonstrates the intracellular arm of the missorting phenotype — LYSET
      loss depletes cells of lysosomal enzymes and blocks cargo turnover.
  - reference: PMID:41858182
    reference_title: "The Diagnostic Odyssey of a Biochemically Confirmed Case of ML II: The First Western Patient With LYSET Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine enzymes showed increased levels in plasma, and seven showed decreased levels in fibroblasts."
    explanation: >-
      Shows the same inverted enzyme distribution in a patient with biallelic
      LYSET variants, confirming the cellular mechanism operates in vivo.
  downstream:
  - target: Multisystem Lysosomal Substrate Accumulation
    causal_link_type: DIRECT
    description: >-
      Functional intracellular deficiency of many hydrolases at once leaves
      their substrates undegraded inside the lysosome.
- name: Multisystem Lysosomal Substrate Accumulation
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  biological_scale: CELLULAR
  description: >-
    Undegraded substrate accumulates within distended lysosomes across many
    tissues. Because the missing catabolic step is the shared targeting marker
    rather than one enzyme, the stored material is mixed, and urine carries
    both glycosaminoglycans and an abnormal sialic acid profile.
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:36096887
    reference_title: "GCAF(TMEM251) regulates lysosome biogenesis by activating the mannose-6-phosphate pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "accumulation of numerous undigested materials"
    explanation: >-
      Records the accumulation of undigested material that follows TMEM251
      deletion, the storage step of the module.
  - reference: PMID:41858182
    reference_title: "The Diagnostic Odyssey of a Biochemically Confirmed Case of ML II: The First Western Patient With LYSET Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormal sialic acid profile and GAGs (glycosaminoglycans) were detected in urine."
    explanation: >-
      Mixed storage products in patient urine evidence multisystem substrate
      accumulation rather than a single-substrate block.
  downstream:
  - target: Skeletal and Connective-Tissue Storage Disease
    causal_link_type: DIRECT
    description: >-
      Storage in cartilage, bone and connective tissue produces the dysostosis
      multiplex pattern and the somatic features.
  - target: Cardiac Valve Storage Disease
    causal_link_type: DIRECT
    description: >-
      Storage in valve connective tissue thickens the leaflets and produces
      regurgitation.
- name: Impaired Chondrocyte Differentiation
  biological_scale: CELLULAR
  description: >-
    Loss of the LYSET orthologue dedifferentiates primary chondrocytes in
    culture, implying a contribution to the skeletal phenotype from the growth
    plate itself rather than only from passive storage. Whether this is
    separable from the M6P-targeting defect in human disease is unresolved.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:33252156
    reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "suggests its potential function in chondrocyte differentiation"
    explanation: >-
      The founding report's own conclusion that the gene has a role in
      chondrocyte differentiation, stated as a suggestion rather than an
      established mechanism.
  downstream:
  - target: Skeletal and Connective-Tissue Storage Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A growth-plate-autonomous defect would compound the storage-driven
      skeletal disease; the intermediate steps are not established.
- name: Skeletal and Connective-Tissue Storage Disease

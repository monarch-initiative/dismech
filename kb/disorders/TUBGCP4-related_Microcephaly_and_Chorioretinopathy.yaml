progression:
- phase: Long-term ophthalmic course
  notes: >-
    One TUBGCP4 proband was reported as clinically stable over two decades. A
    separate mixed KIF11/TUBGCP4/TUBGCP6 cohort, which included only one person
    with TUBGCP4 variants, found that visually significant posterior-segment
    progression can occur and recommended close ophthalmic-genetics monitoring.
    Progression is reported only for the pooled cohort, so the direction and
    rate of TUBGCP4-specific retinal change remain uncertain.
  evidence:
  - reference: PMID:37038737
    reference_title: "Microcephaly and chorioretinopathy associated with TUBGCP4: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical characteristics in our proband have remained stable for two
      decades.
    explanation: >-
      This is a single-proband observation over long follow-up and is not a
      population natural-history estimate.
  - reference: PMID:33137195
    reference_title: Genotype Phenotype Correlation and Variability in Microcephaly Associated With Chorioretinopathy or Familial Exudative Vitreoretinopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nine patients had KIF11 variants, two had heterozygous TUBGCP6 variants,
      and one had heterozygous variants in TUBGCP4.
    explanation: >-
      Establishes that the natural-history source is a mixed-gene cohort with
      only one TUBGCP4 participant; it does not isolate that participant's
      course.
  - reference: PMID:33137195
    reference_title: Genotype Phenotype Correlation and Variability in Microcephaly Associated With Chorioretinopathy or Familial Exudative Vitreoretinopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microcephaly due to mutations in KIF11, TUBGCP4, or TUBGCP6 can be
      associated with retinal disease on a spectrum from chorioretinal atrophy
      to FEVR-like posterior segment changes. Visually significant disease
      progression can occur and patients should be monitored closely by a team
      experienced in ophthalmic genetics.
    explanation: >-
      This conclusion comes from a mixed-gene cohort. Only one of the 12
      participants had TUBGCP4 variants, and the reported course is pooled; the
      result supports surveillance context but not a TUBGCP4-specific
      progression rate.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The disorder is autosomal recessive. The founding families and later case
    reports identified two TUBGCP4 variants in affected individuals, including
    compound-heterozygous or confirmed in-trans variants.
  evidence:
  - reference: PMID:25817018
    reference_title: Mutations in TUBGCP4 alter microtubule organization via the γ-tubulin ring complex in autosomal-recessive microcephaly with chorioretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing performed on one family with two affected siblings
      and independently on another family with one affected child revealed
      compound-heterozygous mutations in TUBGCP4.
    explanation: >-
      Establishes biallelic compound-heterozygous inheritance across two
      independent families.
  - reference: PMID:37038737
    reference_title: "Microcephaly and chorioretinopathy associated with TUBGCP4: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular diagnosis using exome sequencing demonstrated two TUBCGP4
      variants in trans: c.1669C>T (p.Arg557*) and c.1746 G>T (p.Leu582=).
    explanation: >-
      Confirms two in-trans variants in a later case; the snippet preserves the
      source abstract's TUBCGP4 typographical error.

name: TUBGCP4-related Microcephaly and Chorioretinopathy
creation_date: "2026-08-20T17:30:00Z"
category: Mendelian
disease_term:
  preferred_term: microcephaly and chorioretinopathy 3
  term:
    id: MONDO:0014592
    label: microcephaly and chorioretinopathy 3
description: >-
  TUBGCP4-related microcephaly and chorioretinopathy (MCCRP3) is a
  gamma-tubulin-complex disease rather than a tubulin-isotype disease. TUBGCP4
  encodes gamma-tubulin complex protein 4, a component of the gamma-tubulin ring
  complex (gamma-TuRC) that nucleates and organizes microtubules. Biallelic
  variants reduce the level of the gamma-TuRC itself, so the lesion is a shortage
  of the nucleating machine rather than a defect in the polymer's building
  blocks.

  The consequence is a combined brain and eye phenotype: autosomal recessive
  microcephaly with chorioretinopathy, and in particular photoreceptor anomalies.
  Patient fibroblasts show reduced gamma-TuRC, altered nucleation and
  organization of microtubules, abnormal nuclear shape and aneuploidy -
  aneuploidy being the signature that distinguishes a nucleation/spindle defect
  from the post-mitotic migration failures of the cortical-malformation
  tubulinopathies. Zebrafish morphants show reduced head volume and eye
  developmental anomalies with chorioretinal dysplasia, reproducing both halves
  of the human phenotype.

  Clinically this sits within a small differential that matters: microcephaly with
  chorioretinopathy resembles congenital toxoplasmosis and cytomegalovirus
  infection, so a genetic diagnosis changes management and reproductive
  counselling for the family. Its closest genetic neighbour is TUBGCP6, which
  causes MCCRP1 through the same complex.

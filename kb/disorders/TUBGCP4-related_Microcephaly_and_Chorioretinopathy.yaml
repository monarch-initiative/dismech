pathophysiology:
- name: Reduced Gamma-Tubulin Ring Complex (TUBGCP4) Level
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Biallelic TUBGCP4 variants - a recurrent synonymous variant that induces exon
    skipping, plus frameshift variants and a deletion - reduce the level of the
    gamma-tubulin ring complex. TUBGCP4 is a structural component of that complex,
    which regulates the nucleation and organization of microtubules. The lesion is
    therefore quantitative and upstream of polymer assembly: with less nucleating
    machinery, microtubule arrays are built incorrectly rather than built from
    faulty subunits.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    allele_type: frameshift, deletion, splice-altering synonymous
    description: >-
      Biallelic loss-of-function alleles. The allele classes themselves make the
      mechanism unambiguous - frameshifts, a deletion, and a synonymous variant
      shown to induce exon skipping are all loss-of-function, and the measured
      consequence is reduced gamma-TuRC level. This is the clearest
      LOSS_OF_FUNCTION assignment in the tubulin family, and contrasts with the
      dominant missense mechanisms of the tubulin isotype genes.

- name: Aneuploidy and Impaired Cell Division
  biological_scale: CELLULAR
  description: >-
    The cellular consequence, and the one that separates this disorder from the
    migration tubulinopathies. Patient fibroblasts show abnormal nuclear shape
    and aneuploidy - a division phenotype, not a motility phenotype. In a
    developing brain and retina, cells that divide unfaithfully produce fewer and
    abnormal progeny, which is the route to both microcephaly and the
    photoreceptor phenotype.

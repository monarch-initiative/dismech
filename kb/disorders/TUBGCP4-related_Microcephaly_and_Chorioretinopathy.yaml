notes: >-
  Created 2026-08-20 while closing out tubulin-family disease coverage following
  docs/reports/tubulinopathies-grouping-review-2026-08-20.md.

  Deliberately NOT a member of the Tubulinopathies grouping. The grouping's notes
  record TUBGCP genes as out of scope: they encode gamma-tubulin COMPLEX proteins
  rather than tubulin isotypes, and this disorder does not conform to the
  microtubule-dependent neuronal migration module - its cellular lesion is
  aneuploidy and impaired division, not failed neuronal locomotion. If the
  grouping is ever re-scoped to "tubulin and tubulin-complex genes", this entry
  and TUBGCP6-related Microcephaly and Chorioretinopathy are the two that move.

  functional_impact_category is LOSS_OF_FUNCTION, and unusually for this family it
  is not an inference: the alleles are frameshifts, a deletion and a
  splice-altering synonymous variant, and the measured consequence is reduced
  gamma-TuRC level.

  All evidence snippets are quoted from cached abstracts.

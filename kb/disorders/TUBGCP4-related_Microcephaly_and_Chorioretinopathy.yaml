  category: Morpholino knockdown
  description: >-
    Morpholino-treated zebrafish had reduced head volume and eye developmental
    anomalies with chorioretinal dysplasia. This is a transient knockdown model,
    not a stable patient-variant model, and it does not establish the intervening
    human developmental mechanism.
  genes:
  - preferred_term: TUBGCP4
    term:
      id: hgnc:16691
      label: TUBGCP4
  associated_phenotypes:
  - Reduced head volume
  - Eye developmental anomalies
  - Chorioretinal dysplasia
  evidence:
  - reference: PMID:25817018
    reference_title: Mutations in TUBGCP4 alter microtubule organization via the γ-tubulin ring complex in autosomal-recessive microcephaly with chorioretinopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, zebrafish treated with morpholinos against tubgcp4 were found to
      have reduced head volume and eye developmental anomalies with
      chorioretinal dysplasia.
    explanation: >-
      Directly reports the morpholino model and its observed brain and eye
      phenotypes; the limitations are recorded in the model description.
notes: >-
  Deliberately NOT a member of the Tubulinopathies grouping. The grouping's notes
  record TUBGCP genes as out of scope: they encode gamma-tubulin COMPLEX proteins
  rather than tubulin isotypes. If the grouping is ever re-scoped to "tubulin and
  tubulin-complex genes", this entry would need reconsideration.

  The LOSS_OF_FUNCTION assignment reflects reported truncating and deletion
  alleles plus a recurrent synonymous allele shown to alter splicing. Reduced
  gamma-TuRC, altered microtubule behavior, abnormal nuclear shape, and
  aneuploidy are direct patient-fibroblast observations. Their causal connection
  to human neural and retinal development remains a hypothesis.

  Reduced visual acuity, microphthalmia, neurodevelopmental delay, nystagmus,
  and abnormal facial shape are intentionally not connected to the
  pathophysiology graph. They are case-level observations, and the reviewed
  sources do not supply a directional mechanistic bridge for those individual
  features.

  All evidence snippets are quoted from cached abstracts. No treatment,
  disease-modifying-therapy, recurrence-risk percentage, or population
  phenotype-frequency claim is made because the reviewed sources do not directly
  support one.

name: TUBGCP4-related Microcephaly and Chorioretinopathy
creation_date: "2026-08-20T17:30:00Z"
category: Mendelian
disease_term:
  preferred_term: microcephaly and chorioretinopathy 3
  term:
    id: MONDO:0014592
    label: microcephaly and chorioretinopathy 3
description: >-
  TUBGCP4-related microcephaly and chorioretinopathy (MCCRP3) is an
  autosomal recessive neuro-ophthalmic disorder caused by biallelic TUBGCP4
  variants. TUBGCP4 encodes a component of the gamma-tubulin ring complex
  (gamma-TuRC), which regulates microtubule nucleation and organization.

  In the founding study, patient fibroblasts had reduced gamma-TuRC levels,
  altered microtubule nucleation and organization, abnormal nuclear shape, and
  aneuploidy. TUBGCP4 morpholino-treated zebrafish had reduced head volume and
  eye-development abnormalities with chorioretinal dysplasia. These are direct
  experimental observations, but the intervening mechanism that connects them
  to human brain and retinal development has not been established.

  Reported human findings include microcephaly, chorioretinopathy or punched-out
  chorioretinal lesions, microphthalmia, reduced vision, and developmental or
  learning difficulties. Nystagmus and dysmorphic facial features have each
  been described in individual case reports. The small published case base does
  not support population frequency estimates for these findings.
parents:
- hereditary disease
- congenital nervous system disorder

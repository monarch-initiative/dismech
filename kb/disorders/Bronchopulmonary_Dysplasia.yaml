name: Bronchopulmonary Dysplasia
creation_date: "2026-10-03T00:00:00Z"
category: Complex
synonyms:
- BPD
- chronic lung disease of prematurity
- neonatal chronic lung disease
description: >-
  Bronchopulmonary dysplasia is the chronic lung disease of prematurity. In a
  very preterm infant whose lungs are still in the saccular stage and deficient
  in surfactant, the supplemental oxygen and mechanical ventilation required to
  survive, together with pre- and postnatal inflammation, injure the immature
  lung and arrest its development. Inflammation is the shared downstream pathway;
  impaired VEGF-driven microvascular growth and arrested alveolar septation then
  produce the "new BPD" lesion of simplified, enlarged alveoli with a reduced,
  dysmorphic capillary bed. The result is a lasting loss of gas-exchange surface
  (oxygen dependence, diagnosed at 36 weeks postmenstrual age) and, in a subset,
  pulmonary vascular disease with pulmonary hypertension.
disease_term:
  preferred_term: bronchopulmonary dysplasia
  term:
    id: MONDO:0019091
    label: bronchopulmonary dysplasia
parents:
- respiratory system disorder
pathophysiology:
- name: Preterm Birth with Saccular-Stage Lung and Surfactant Deficiency
  role: trigger
  biological_scale: ORGANISM
  description: >-
    The initiating condition is very preterm birth, which interrupts lung
    development in the canalicular/saccular stage before alveolarization. A lack
    of surfactant from incompletely differentiated alveolar type 2 cells leaves
    the immature lung unable to sustain gas exchange, so the infant requires
    supplemental oxygen and mechanical ventilation - the exposures that drive the
    downstream injury.
  cell_types:
  - preferred_term: pulmonary alveolar type 2 cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "a lack of pulmonary surfactant as a result of incomplete differentiation of AT2 cells causes RDS in preterm infants"
    explanation: Ties the surfactant deficiency of this node to incomplete alveolar type 2 cell differentiation in the preterm lung.
  downstream:
  - target: Hyperoxic Oxidative Lung Injury
    causal_link_type: DIRECT
  - target: Ventilator-Induced Lung Injury
    causal_link_type: DIRECT
- name: Hyperoxic Oxidative Lung Injury
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    Supplemental oxygen exposes the immature, antioxidant-poor lung to
    hyperoxia, generating reactive oxygen species that injure alveolar
    epithelial and endothelial cells. It is one of the initial injuries that
    converge on pulmonary inflammation.
  biological_processes:
  - preferred_term: response to hyperoxia
    modifier: INCREASED
    term:
      id: GO:0055093
      label: response to hyperoxia
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "initial lung injury owing to surfactant deficiency, exposure to increased oxygen, mechanical ventilation, inadequate nutrition, infection and inflammation"
    explanation: Names exposure to increased oxygen among the initial injuries to the preterm lung in BPD.
  downstream:
  - target: Pulmonary Inflammation
    causal_link_type: DIRECT
- name: Ventilator-Induced Lung Injury
  role: amplifier
  biological_scale: TISSUE
  description: >-
    Mechanical ventilation of the structurally immature preterm lung causes
    volutrauma and stretch injury to the airways and distal airspaces, a second
    initial injury converging on inflammation. Preterm animal models show airway
    injury after even brief ventilation at birth.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:19816239
    reference_title: "Airway injury from initiating ventilation in preterm sheep."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "We report where injury occurred within the lung after brief ventilation at birth."
    explanation: Preterm sheep study demonstrating lung injury from initiating mechanical ventilation.
  - reference: PMID:19816239
    reference_title: "Airway injury from initiating ventilation in preterm sheep."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: "Premature infants exposed to ventilation are at risk of developing bronchopulmonary dysplasia and persistent lung disease in childhood."
    explanation: States the clinical link between ventilation exposure and BPD risk that the model addresses.
  downstream:
  - target: Pulmonary Inflammation
    causal_link_type: DIRECT
- name: Antenatal Inflammation (Chorioamnionitis)
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Intrauterine inflammation, most often chorioamnionitis, primes the fetal
    lung before birth: it is both a cause of preterm birth and a
    gestation-independent contributor to BPD risk, and it blunts the surfactant
    response so that affected infants need longer mechanical ventilation. It
    feeds the same pulmonary inflammatory pathway as the postnatal injuries.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:24128984
    reference_title: "Chorioamnionitis is essential in the evolution of bronchopulmonary dysplasia--the case in favour."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Antenatal inflammation with signs of a systemic fetal response reduces the response to exogenous surfactant in infants with respiratory distress syndrome, leading to a longer need for mechanical ventilation."
    explanation: Links antenatal inflammation to a blunted surfactant response and longer ventilation, a route into the injury cascade.
  - reference: PMID:24128984
    reference_title: "Chorioamnionitis is essential in the evolution of bronchopulmonary dysplasia--the case in favour."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Multiple ante- and postnatal factors act in concert to injure the immature lung in the pathogenesis of the disease."
    explanation: Frames BPD as a convergence of antenatal and postnatal injuries on the immature lung.
  downstream:
  - target: Pulmonary Inflammation
    causal_link_type: DIRECT
- name: Postnatal Sepsis or Necrotizing Enterocolitis
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Postnatal systemic inflammation from late-onset sepsis or necrotizing
    enterocolitis is a further inflammatory input that raises BPD risk, adding to
    the oxidative and mechanical injuries already acting on the lung.
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Subsequent inflammation from sepsis or necrotizing enterocolitis can increase the risk of developing BPD."
    explanation: Names postnatal sepsis and NEC as inflammatory inputs that increase BPD risk.
  downstream:
  - target: Pulmonary Inflammation
    causal_link_type: DIRECT
- name: Pulmonary Inflammation
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Inflammation is the common downstream pathway on which the oxidative,
    mechanical and antenatal injuries converge. Recruited neutrophils and
    macrophages and a proinflammatory cytokine milieu injure the developing lung
    and disrupt the growth-factor signaling that normal alveolar and vascular
    development depend on.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Inflammation is the common pathway that initiates the lung injury that can progress to BPD."
    explanation: Identifies pulmonary inflammation as the shared initiating pathway, the central effector of the cascade.
  - reference: PMID:24128984
    reference_title: "Chorioamnionitis is essential in the evolution of bronchopulmonary dysplasia--the case in favour."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Pulmonary inflammatory processes seen in animal models of chorioamnionitis resemble those seen in premature infants who developed BPD."
    explanation: The pulmonary inflammation of BPD mirrors that triggered by chorioamnionitis, supporting the shared inflammatory node.
  downstream:
  - target: Disrupted VEGF Signaling
    causal_link_type: DIRECT
  - target: Arrested Alveolar Septation
    causal_link_type: DIRECT
- name: Disrupted VEGF Signaling
  role: effector
  biological_scale: CELLULAR
  description: >-
    Injury and inflammation impair vascular endothelial growth factor (VEGF)
    signaling in the developing alveolar capillary endothelium. Restoring VEGF
    signaling in animal models of BPD preserves lung growth, which is the
    experimental basis for treating impaired VEGF signaling as a driver rather
    than a bystander.
  cell_types:
  - preferred_term: lung endothelial cell
    term:
      id: CL:1001567
      label: lung endothelial cell
  biological_processes:
  - preferred_term: vascular endothelial growth factor signaling
    modifier: DECREASED
    term:
      id: GO:0038084
      label: vascular endothelial growth factor signaling pathway
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:29268623
    reference_title: "Anti-sFlt-1 Therapy Preserves Lung Alveolar and Vascular Growth in Antenatal Models of Bronchopulmonary Dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: "impaired VEGF signaling has been implicated in the pathogenesis of BPD"
    explanation: Identifies impaired VEGF signaling as implicated in BPD pathogenesis.
  - reference: PMID:29268623
    reference_title: "Anti-sFlt-1 Therapy Preserves Lung Alveolar and Vascular Growth in Antenatal Models of Bronchopulmonary Dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "treatment with anti-sFlt-1 mAb preserves lung structure and function and prevents right ventricular hypertrophy in two rat models of BPD"
    explanation: Restoring VEGF signaling with anti-sFlt-1 preserves lung growth, validating the signaling defect as causal by rescue.
  downstream:
  - target: Impaired Microvascular Growth
    causal_link_type: DIRECT
- name: Impaired Microvascular Growth
  role: effector
  biological_scale: TISSUE
  description: >-
    Disrupted VEGF signaling reduces and distorts the pulmonary microvasculature,
    leaving a sparse, dysmorphic capillary bed. By the vascular hypothesis of
    BPD, this early disruption of lung vascular growth also impairs growth of the
    distal airspace, coupling the vascular and alveolar lesions.
  biological_processes:
  - preferred_term: angiogenesis
    modifier: DECREASED
    term:
      id: GO:0001525
      label: angiogenesis
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "early disruption of lung vascular growth and function can impair growth of the distal airspace"
    explanation: States the vascular hypothesis, in which disrupted lung vascular growth impairs distal airspace (alveolar) growth.
  downstream:
  - target: Arrested Alveolar Septation
    causal_link_type: DIRECT
  - target: Pulmonary Hypertension
    causal_link_type: DIRECT
- name: Arrested Alveolar Septation
  role: effector
  biological_scale: TISSUE
  description: >-
    The defining lesion of the "new BPD" is disrupted alveolarization that
    leaves fewer, larger, simplified alveoli rather than the normal fine
    septation, reducing the gas-exchange surface. It is driven jointly by the
    inflammatory injury and by the impaired microvascular growth.
  biological_processes:
  - preferred_term: lung alveolus development
    modifier: DECREASED
    term:
      id: GO:0048286
      label: lung alveolus development
  locations:
  - preferred_term: alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "BPD is a clinical syndrome of lung injury that disrupts alveolarization and microvascular development."
    explanation: Defines BPD by disrupted alveolarization (arrested septation) together with microvascular disruption.
  downstream:
  - target: Reduced Gas-Exchange Surface Area
    causal_link_type: DIRECT
  - target: Chronic pulmonary obstruction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Wheezing
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Reduced Gas-Exchange Surface Area
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Simplified alveoli and a reduced capillary bed leave a lasting deficit of
    alveolar surface area for gas exchange. This is the functional endpoint that
    manifests as the persistent supplemental-oxygen requirement by which BPD is
    diagnosed at 36 weeks postmenstrual age.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "result in a loss of alveolar surface area"
    explanation: The converging injuries result in loss of alveolar surface area, the functional deficit of BPD.
  downstream:
  - target: Hypoxemia
    causal_link_type: DIRECT
  - target: Respiratory failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Pulmonary Hypertension
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The reduced, dysmorphic pulmonary microvasculature raises pulmonary vascular
    resistance, producing pulmonary hypertension and pulmonary vascular disease
    in a subset of infants, a strong contributor to mortality in BPD.
  notes: >-
    BPD-associated pulmonary hypertension is clinically classified as group 3
    (lung-disease-associated) pulmonary hypertension, not group 1 pulmonary
    arterial hypertension, despite the HP binding on the corresponding phenotype.
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Pulmonary hypertension and related pulmonary vascular disease (PVD) have long been recognized as strong contributors to poor survival in preterm infants with BPD"
    explanation: Establishes pulmonary hypertension/pulmonary vascular disease as a major BPD complication.
  downstream:
  - target: Pulmonary arterial hypertension
    causal_link_type: DIRECT
phenotypes:

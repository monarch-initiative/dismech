    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Symptoms of wheezing, cough, airway reactivity and shortness of breath are frequently encountered in this population"
    explanation: Reports wheezing as a frequent respiratory symptom in the BPD population.
- name: Chronic pulmonary obstruction
  description: >-
    Obstructive lung disease and chronic airflow limitation are more common in
    children who had BPD, with a concern for early-onset COPD in adult life.
  phenotype_term:
    preferred_term: Obstructive lung disease
    term:
      id: HP:0006510
      label: Chronic pulmonary obstruction
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Although obstructive lung disease is more commonly found in children with BPD than in those without BPD, restrictive lung disease can also be present"
    explanation: Reports obstructive lung disease as more common in children with BPD.
- name: Neurodevelopmental abnormality
  description: >-
    BPD is reported as an independent risk factor for poor neurodevelopmental
    outcomes, even without overt brain injury. Left unconnected in the
    pathograph because the mechanism linking it to the lung disease is unsettled.
  phenotype_term:
    preferred_term: Neurodevelopmental abnormality
    term:
      id: HP:0012759
      label: Neurodevelopmental abnormality
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "some clinical studies have suggested that BPD is an independent risk factor for poor neurodevelopmental outcomes, even in the absence of definite brain injuries, such as intraventricular haemorrhage or hypoxic ischaemic encephalopathy"
    explanation: BPD is reported as an independent risk factor for poor neurodevelopmental outcomes.

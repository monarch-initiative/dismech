diagnosis:
- name: Clinical diagnosis at 36 weeks postmenstrual age
  description: >-
    BPD is diagnosed clinically at 36 weeks postmenstrual age, historically a
    yes/no determination based on the need for supplemental oxygen; the 2001 and
    2018 NICHD workshop definitions and the Jensen severity grades refine it.
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Although BPD is a 'yes/no' diagnosis at 36 weeks PMA, the term has become shorthand for the presence of respiratory morbidity in a preterm infant before and after discharge from hospital."
    explanation: States the 36-week-PMA clinical diagnosis of BPD.
genetic:
- name: Multifactorial genetic susceptibility
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Twin studies indicate a heritable contribution to BPD risk, but no single
    causative gene is established; the search for genetic markers is ongoing. No
    gene term is bound because none is defensible as causative.
  evidence:
  - reference: PMID:31727986

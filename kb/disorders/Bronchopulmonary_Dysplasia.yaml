    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "treatment with anti-sFlt-1 mAb preserves lung structure and function and prevents right ventricular hypertrophy in two rat models of BPD"
    explanation: Restoring VEGF signaling with anti-sFlt-1 preserves alveolar and vascular growth, validating the vascular mechanism by rescue.
  downstream:

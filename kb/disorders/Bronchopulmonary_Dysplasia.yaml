progression:
- phase: Acute neonatal lung injury
  notes: >-
    In the neonatal period the preterm lung sustains oxidative, mechanical and
    inflammatory injury superimposed on surfactant deficiency.
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "initial lung injury owing to surfactant deficiency, exposure to increased oxygen, mechanical ventilation, inadequate nutrition, infection and inflammation"
    explanation: Describes the acute neonatal lung injury that initiates BPD.
- phase: Chronic airway and pulmonary vascular disease
  notes: >-
    Beyond the neonatal period, impaired lung development leaves persistent
    airway and pulmonary vascular disease that can affect adult lung function.
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "lung development is markedly impaired, which leads to persistent airway and pulmonary vascular disease that can affect adult lung function"
    explanation: Describes the chronic phase of persistent airway and pulmonary vascular disease into adulthood.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    BPD carries high early-childhood respiratory morbidity, with up to half of
    affected children rehospitalized in the first two years of life.
  evidence:
  - reference: PMID:31727986
    reference_title: "Bronchopulmonary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Up to 50% of children with BPD are rehospitalized during the first 2 years of life"
    explanation: Quantifies the early-childhood rehospitalization burden of BPD.
animal_models:
- name: Preterm lamb initiation-of-ventilation model
  species: Sheep
  publication: PMID:19816239
  description: >-
    Preterm sheep ventilated briefly at birth, used to localize the airway and
    distal lung injury caused by initiating mechanical ventilation.
  modeled_mechanisms:
  - target: Ventilator-Induced Lung Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Brief initiation of ventilation in the preterm lamb reproduces the airway
      injury of mechanical ventilation.
    limitations: >-
      A preterm sheep is not a human neonate, and the model captures the initial
      ventilation injury rather than the full chronic BPD phenotype.
    readouts:
    - name: Bronchial epithelial disruption in medium-sized airways
      target: Ventilator-Induced Lung Injury
      direction: INCREASED
      interpretation: Structural airway-injury correlate of the VILI node in this model.
      evidence:
      - reference: PMID:19816239
        reference_title: "Airway injury from initiating ventilation in preterm sheep."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "In both fetal and newborn lambs, ventilation caused bronchial epithelial disruption in medium-sized airways."
        explanation: Reports the airway epithelial injury measured in the ventilated preterm sheep.
    evidence:
    - reference: PMID:19816239
      reference_title: "Airway injury from initiating ventilation in preterm sheep."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Ventilation caused loss of heat shock protein 70 (HSP70) mRNA from the bronchial epithelium, but induced mRNA in the smooth muscle surrounding large airways."
      explanation: A measured molecular injury signature from initiating ventilation, supporting the preterm sheep as informative for ventilator-induced lung injury.
- name: Antenatal-stress rat BPD model (anti-sFlt-1 rescue)
  species: Rat
  publication: PMID:29268623
  description: >-
    Two antenatal-stress rat models of BPD in which an anti-sFlt-1 monoclonal
    antibody restores VEGF availability and rescues lung alveolar and vascular
    growth.
  modeled_mechanisms:
  - target: Impaired Microvascular Growth
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Anti-sFlt-1 mAb restores pulmonary vascular growth in antenatal-stress rat
      models of BPD, evidence that disrupted VEGF signaling drives the
      microvascular deficit.
    limitations: >-
      Rat antenatal-stress models, and anti-sFlt-1 is an experimental
      intervention not in clinical use for BPD.
    readouts:
    - name: Pulmonary vessel density
      target: Impaired Microvascular Growth
      direction: RESTORED
      interpretation: Anti-sFlt-1 therapy improved vessel density, the microvascular-growth readout.
      evidence:
      - reference: PMID:29268623
        reference_title: "Anti-sFlt-1 Therapy Preserves Lung Alveolar and Vascular Growth in Antenatal Models of Bronchopulmonary Dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "mAb therapy improved infant lung structure as assessed by radial alveolar count, vessel density, right ventricular hypertrophy, and lung function"
        explanation: Reports improved vessel density with anti-sFlt-1 therapy.
    evidence:
    - reference: PMID:29268623
      reference_title: "Anti-sFlt-1 Therapy Preserves Lung Alveolar and Vascular Growth in Antenatal Models of Bronchopulmonary Dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "treatment with anti-sFlt-1 mAb preserves lung structure and function and prevents right ventricular hypertrophy in two rat models of BPD"
      explanation: Supports treating this rat model as informative for the microvascular-growth node.
  - target: Arrested Alveolar Septation
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Anti-sFlt-1 mAb restores alveolar growth (radial alveolar count) in the
      same models, coupling the vascular rescue to alveolarization.
    limitations: >-
      Same rat antenatal-stress models; radial alveolar count is a structural
      correlate of septation rather than septation itself.
    readouts:
    - name: Radial alveolar count
      target: Arrested Alveolar Septation
      direction: RESTORED
      interpretation: Anti-sFlt-1 therapy improved radial alveolar count, an alveolarization readout.
      evidence:
      - reference: PMID:29268623
        reference_title: "Anti-sFlt-1 Therapy Preserves Lung Alveolar and Vascular Growth in Antenatal Models of Bronchopulmonary Dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "mAb therapy improved infant lung structure as assessed by radial alveolar count, vessel density, right ventricular hypertrophy, and lung function"
        explanation: Reports improved radial alveolar count with anti-sFlt-1 therapy.
    evidence:
    - reference: PMID:29268623
      reference_title: "Anti-sFlt-1 Therapy Preserves Lung Alveolar and Vascular Growth in Antenatal Models of Bronchopulmonary Dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "treatment with anti-sFlt-1 mAb preserves lung structure and function and prevents right ventricular hypertrophy in two rat models of BPD"
      explanation: Supports treating this rat model as informative for the alveolar-septation node.

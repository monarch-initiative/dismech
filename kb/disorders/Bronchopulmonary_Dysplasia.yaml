- name: Disrupted VEGF Signaling and Impaired Microvascular Growth
  role: effector
  biological_scale: CELLULAR
  description: >-
    Injury and inflammation impair vascular endothelial growth factor (VEGF)
    signaling in the developing alveolar capillary network, reducing and
    distorting the pulmonary microvasculature. By the "vascular hypothesis" of
    BPD, this disruption of lung vascular growth also impairs growth of the
    distal airspace, coupling the vascular and alveolar lesions.
  cell_types:
  - preferred_term: lung endothelial cell
    term:
      id: CL:1001567
      label: lung endothelial cell
  biological_processes:
  - preferred_term: angiogenesis
    modifier: DECREASED
    term:
      id: GO:0001525
      label: angiogenesis
  locations:
  - preferred_term: lung
    term:

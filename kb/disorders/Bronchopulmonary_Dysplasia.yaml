    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Prospective studies have provided echocardiographic evidence of pulmonary hypertension in 14-25% of preterm infants at 36 weeks post-menstrual age (PMA), with pulmonary hypertension especially prevalent (29-58%) in infants with severe BPD"
    explanation: Quantifies pulmonary hypertension prevalence in preterm infants at 36 weeks PMA, synthesising several prospective cohorts.
- name: Wheezing
  description: >-
    Wheezing, cough and airway reactivity are frequent respiratory symptoms in
    children who had BPD.
  phenotype_term:
    preferred_term: Wheezing
    term:
      id: HP:0030828
      label: Wheezing

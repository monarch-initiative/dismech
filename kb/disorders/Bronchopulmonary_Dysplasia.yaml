- name: Pulmonary arterial hypertension
  description: >-
    BPD-associated pulmonary hypertension / pulmonary vascular disease, present
    in a subset and most common in severe disease. Clinically group 3 pulmonary
    hypertension; see the Pulmonary Hypertension pathophysiology node notes.
  phenotype_term:
    preferred_term: Pulmonary hypertension

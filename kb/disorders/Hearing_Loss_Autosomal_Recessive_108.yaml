name: Hearing Loss Autosomal Recessive 108
category: Mendelian
creation_date: "2026-09-05T00:00:00Z"
synonyms:
- DFNB108
- autosomal recessive nonsyndromic deafness 108
- deafness, autosomal recessive 108
- ROR1-related hearing loss
description: >-
  Hearing loss autosomal recessive 108 (DFNB108) is an autosomal recessive
  sensorineural hearing loss caused by biallelic loss-of-function variants in
  ROR1 (receptor tyrosine kinase-like orphan receptor 1). It was defined by a
  single consanguineous family in which a homozygous missense variant
  (c.2207G>C, p.R736T) cosegregated with deafness, so essentially everything
  known about the human disorder rests on that one family plus the mouse the
  same study characterised.

  The mechanism sets DFNB108 apart from most nonsyndromic recessive deafness.
  ROR1 is a WNT5A co-receptor, and the R736T substitution prevents the protein
  from reaching the plasma membrane, so the mutant receptor cannot transduce
  WNT5A signalling. The functional consequence is not primarily a hair-cell
  transduction defect but a wiring defect: in the mouse, spiral ganglion neuron
  axons fasciculate abnormally, type I neurons form defective synapses with
  inner hair cells, and type II neurons project aberrantly through the sensory
  epithelium. Outer hair cell function is preserved, which is why the mice are
  deaf yet retain otoacoustic emissions and the family was described as having
  auditory neuropathy. The human ears also show a common cavity inner ear
  malformation, so the phenotype is a combination of a cochleovestibular
  malformation and an auditory neuropathy rather than pure cochlear hair-cell
  loss.

  Do not confuse ROR1 with its paralogue ROR2, whose biallelic loss causes
  autosomal recessive Robinow syndrome - a skeletal dysplasia, not isolated
  deafness.
disease_term:
  preferred_term: hearing loss, autosomal recessive 108
  term:
    id: MONDO:0033200
    label: hearing loss, autosomal recessive 108
parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic ROR1 variants. In the defining family the c.2207G>C (p.R736T)
    variant was homozygous in the affected individuals, consistent with
    consanguinity, and absent from ethnicity-matched controls.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a variant (c.2207G>C, p.R736T) in ROR1 (receptor tyrosine kinase-like orphan receptor 1), cosegregating with deafness in the family and absent in ethnicity-matched controls"
    explanation: Homozygous cosegregation in a consanguineous family with absence from controls establishes recessive inheritance.
pathophysiology:
- name: Biallelic ROR1 Loss of Function
  description: >-
    Biallelic ROR1 variants. The reported allele is the missense c.2207G>C
    (p.R736T); at the cellular level the substitution prevents the ROR1 receptor
    from reaching the plasma membrane, so it is a trafficking-defect
    loss-of-function rather than a simple catalytic change.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ROR1
    term:
      id: hgnc:10256
      label: ROR1
  downstream:
  - target: Disrupted WNT5A-ROR1 Signaling
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "At the cellular level, the mutation prevents the protein from reaching the cellular membrane."
    explanation: Establishes the loss-of-function mechanism of the R736T allele as failed membrane trafficking.
- name: Disrupted WNT5A-ROR1 Signaling
  description: >-
    ROR1 is a tyrosine kinase-like receptor and a co-receptor for the
    non-canonical Wnt ligand WNT5A. Because the mutant receptor never reaches the
    membrane, WNT5A-dependent ROR1 signalling fails - shown experimentally as
    failure of the mutant receptor to activate NF-kappaB in response to WNT5A.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: WNT5A-ROR1 non-canonical Wnt signaling
    modifier: DECREASED
    term:
      id: GO:0035567
      label: non-canonical Wnt signaling pathway
  downstream:
  - target: Impaired Spiral Ganglion Innervation of Hair Cells
    causal_link_type: DIRECT
  - target: Cochlear Common Cavity Malformation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the presence of WNT5A, a known ROR1 ligand, the mutated ROR1 fails to activate"
    explanation: Direct functional demonstration that the mutant receptor cannot transduce WNT5A signalling.
- name: Impaired Spiral Ganglion Innervation of Hair Cells
  description: >-
    The core lesion is a failure of spiral ganglion neurons to innervate the
    auditory hair cells correctly. In Ror1 mutant mice the spiral ganglion axons
    show fasciculation defects, type I neurons form impaired synapses with inner
    hair cells, and type II neurons project aberrantly through the cochlear
    sensory epithelium. Ror1 is expressed in the developing inner ear, consistent
    with a developmental wiring role.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: spiral ganglion neuron innervation of hair cells
    modifier: DECREASED
    term:
      id: GO:0060384
      label: innervation
  - preferred_term: spiral ganglion axon fasciculation
    modifier: DECREASED
    term:
      id: GO:0007413
      label: axonal fasciculation
  locations:
  - preferred_term: cochlear ganglion
    term:
      id: UBERON:0000395
      label: cochlear ganglion
  downstream:
  - target: Failure of Auditory Afferent Neurotransmission
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Axons of spiral ganglion neurons show fasciculation defects."
    explanation: The axon-guidance component of the innervation defect in the Ror1 mutant mouse.
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Type I neurons show impaired synapses with inner hair cells, and type II neurons display aberrant projections through the cochlear sensory epithelium."
    explanation: The synaptic and projection components of the spiral-ganglion innervation defect.
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that Ror1 is crucial for spiral ganglion neurons to innervate auditory hair cells."
    explanation: The authors' summary that ROR1 is required for hair-cell innervation by spiral ganglion neurons.
- name: Cochlear Common Cavity Malformation
  description: >-
    Beyond the neuronal wiring defect, ROR1 loss disrupts cochlear
    morphogenesis. The human family had a common cavity inner ear malformation,
    and the Ror1 mutant mice display malformed cochleae, so the developmental
    role of ROR1 extends to gross cochlear structure.
  biological_scale: TISSUE
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  downstream:
  - target: Failure of Auditory Afferent Neurotransmission
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a family with autosomal recessive deafness associated with a common cavity inner ear malformation and auditory neuropathy."
    explanation: Human evidence for the cochlear malformation component of the phenotype.
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Anatomically, mutant mice display malformed cochleae."
    explanation: Model-organism confirmation that ROR1 loss disrupts gross cochlear morphology.
- name: Failure of Auditory Afferent Neurotransmission
  description: >-
    The convergent consequence of the innervation defect and the cochlear
    malformation is a failure to carry the auditory signal from hair cells to the
    brain, while cochlear amplification is preserved. Ror1 mutant mice are
    severely deaf yet retain otoacoustic emissions, the electrophysiological
    signature of auditory neuropathy - a hair-cell / neural transmission
    dissociation rather than a transduction failure.
  biological_scale: ORGANISM
  downstream:
  - target: Sensorineural Hearing Impairment
    causal_link_type: DIRECT
  - target: Auditory Neuropathy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate that Ror1 mutant mice are severely deaf, with preserved otoacoustic emissions."
    explanation: The deaf-with-preserved-OAE dissociation is the functional signature of auditory neuropathy.
phenotypes:
- name: Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Bilateral sensorineural hearing loss is the defining clinical feature. In the
    reported human family the loss was associated with a common cavity malformation
    and auditory neuropathy; the Ror1 mutant mice are severely deaf.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a family with autosomal recessive deafness associated with a common cavity inner ear malformation and auditory neuropathy."
    explanation: Establishes autosomal recessive deafness in the human family.
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate that Ror1 mutant mice are severely deaf, with preserved otoacoustic emissions."
    explanation: Model-organism corroboration of the deafness phenotype; kept distinct from the human evidence by evidence_source.
- name: Auditory Neuropathy
  category: Auditory
  description: >-
    Auditory neuropathy pattern - preserved outer-hair-cell function
    (otoacoustic emissions retained) with disrupted afferent neural transmission.
    Reported in the human family and reproduced electrophysiologically in the
    mouse, and mechanistically expected from a spiral-ganglion innervation defect.
  phenotype_term:
    preferred_term: Auditory neuropathy (abnormal auditory evoked potentials)
    term:
      id: HP:0006958
      label: Abnormal auditory evoked potentials
  evidence:
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a family with autosomal recessive deafness associated with a common cavity inner ear malformation and auditory neuropathy"
    explanation: Documents auditory neuropathy in the affected human family.
- name: Cochlear Malformation
  category: Auditory
  description: >-
    A common cavity inner ear malformation was present in the affected family, and
    the mutant mice have malformed cochleae. This distinguishes DFNB108 from
    nonsyndromic deafness with structurally normal inner ears.
  phenotype_term:
    preferred_term: Cochlear malformation
    term:
      id: HP:0008554
      label: Cochlear malformation
  evidence:
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a family with autosomal recessive deafness associated with a common cavity inner ear malformation and auditory neuropathy."
    explanation: The common cavity malformation is documented in the human family.
genetic:
- name: ROR1
  notes: >-
    ROR1 (receptor tyrosine kinase-like orphan receptor 1) encodes a WNT5A
    co-receptor of the ROR family. DFNB108 is defined by a single homozygous
    missense allele, c.2207G>C (p.R736T), identified by whole-exome sequencing in
    a consanguineous family. ROR1 is the paralogue of ROR2 (Robinow syndrome);
    the two are distinct disease genes and should not be conflated.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ROR1
    term:
      id: hgnc:10256
      label: ROR1
  evidence:
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Via whole-exome sequencing, we identified a variant (c.2207G>C, p.R736T) in ROR1 (receptor tyrosine kinase-like orphan receptor 1), cosegregating with deafness in the family and absent in ethnicity-matched controls."
    explanation: The founding gene-disease association for DFNB108.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    DFNB108 is known from a single consanguineous family reported in 2016; no
    prevalence estimate exists. The entire natural history and mechanism rest on
    that family and the mouse characterised in the same study, and every frequency
    statement here should be read against that single-family evidence base.
  evidence:
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a family with autosomal recessive deafness associated with a common cavity inner ear malformation and auditory neuropathy."
    explanation: Documents the single defining family, the basis for the ultra-rare classification.
treatments:
- name: Hearing Amplification
  description: >-
    Conventional hearing aids are the first-line management for the sensorineural
    hearing loss, as for auditory neuropathy generally with milder loss. No
    DFNB108-specific amplification outcome has been published; the evidence cited
    is for auditory neuropathy spectrum disorder, the pattern DFNB108 produces.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid fitting
  evidence:
  - reference: PMID:32290039
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing aids are indicated in the treatment of ANSD with mild to moderate hearing loss"
    explanation: >-
      Supports amplification as management for the auditory neuropathy pattern
      DFNB108 causes; INDIRECT because it addresses ANSD in general, not DFNB108.
  notes: >-
    treatment_term carries no NCIT binding. NCIT device terms (e.g. hearing aid)
    are equipment concepts, not reachable from NCIT:C25218 Clinical Intervention
    or Procedure, and NCIT has no clinical-action term for hearing-aid fitting, so
    per the ontology contract a free-text preferred_term is correct rather than a
    forced broader binding.
- name: Cochlear Implantation
  description: >-
    For profound loss or poor benefit from hearing aids, cochlear implantation is
    the standard option, and it is a feasible modality in auditory neuropathy. In
    DFNB108 the common cavity malformation and the neural (rather than purely
    sensory) locus of the lesion make individualised candidacy assessment
    important; no DFNB108-specific implant outcome is published.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  evidence:
  - reference: PMID:32290039
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "cochlear implantation is the first choice of treatment in case of profound hearing loss"
    explanation: >-
      Supports cochlear implantation for profound loss in the auditory neuropathy
      pattern DFNB108 causes; INDIRECT because it addresses ANSD in general.
  - reference: PMID:37638998
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present systematic review suggests that CI is a feasible and effective hearing  rehabilitation modality for children with ANSD."
    explanation: >-
      Systematic-review evidence that cochlear implantation benefits children with
      auditory neuropathy; INDIRECT for DFNB108 specifically.
- name: Genetic Counseling
  description: >-
    Autosomal recessive recurrence-risk counseling for families, with molecular
    diagnosis by exome/panel sequencing since the phenotype overlaps other causes
    of auditory neuropathy and cochleovestibular malformation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
animal_models:
- name: Ror1 mutant mouse
  species: Mouse
  genotype: Ror1 mutant
  publication: PMID:27162350
  description: >-
    The Ror1 mutant mouse was characterised alongside the human family in the
    defining study. Mutant mice are severely deaf with preserved otoacoustic
    emissions, have malformed cochleae, and show spiral ganglion neuron
    fasciculation defects with impaired type I synapses and aberrant type II
    projections - reproducing the auditory neuropathy and innervation defect that
    human cochlear tissue cannot show directly.
  genes:
  - preferred_term: ROR1
    term:
      id: hgnc:10256
      label: ROR1
  modeled_mechanisms:
  - target: Impaired Spiral Ganglion Innervation of Hair Cells
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Provides the histological and electrophysiological evidence for the
      innervation defect that is inaccessible in living patients.
    limitations: >-
      The human allele is a single missense variant (p.R736T) shown to mislocalise
      the receptor; the mouse allele's molecular equivalence to it is not
      established here, and the disorder is defined by one human family.
    readouts:
    - name: Spiral ganglion axon fasciculation and hair-cell synapses
      target: Impaired Spiral Ganglion Innervation of Hair Cells
      direction: DECREASED
      interpretation: >-
        Fasciculation defects, impaired type I inner-hair-cell synapses, and
        aberrant type II projections.
      evidence:
      - reference: PMID:27162350
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Type I neurons show impaired synapses with inner hair cells, and type II neurons display aberrant projections through the cochlear sensory epithelium."
        explanation: The measured innervation phenotype in the mutant mouse.
  - target: Failure of Auditory Afferent Neurotransmission
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Reproduces the deaf-with-preserved-OAE auditory neuropathy signature at the
      whole-organism level.
    readouts:
    - name: Auditory function with otoacoustic emissions
      target: Failure of Auditory Afferent Neurotransmission
      direction: DECREASED
      interpretation: Severe deafness with retained otoacoustic emissions.
      evidence:
      - reference: PMID:27162350
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We demonstrate that Ror1 mutant mice are severely deaf, with preserved otoacoustic emissions."
        explanation: The functional auditory readout in the mutant mouse.
  evidence:
  - reference: PMID:27162350
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that Ror1 is crucial for spiral ganglion neurons to innervate auditory hair cells."
    explanation: The mouse establishes the ROR1 requirement for hair-cell innervation, making it informative for the innervation-defect node.

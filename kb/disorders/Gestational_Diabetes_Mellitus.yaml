environmental:
- name: Gestational phthalate exposure
  exposure_term:
    preferred_term: exposure to phthalate
    term:
      id: ECTO:9000522
      label: exposure to phthalate
  description: >-
    Two independent meta-analyses put phthalate exposure in pregnancy at a small
    but consistent excess risk of GDM - pooled odds ratios of about 1.07 to 1.10,
    with lower confidence bounds only just clear of the null. The effect size is
    the point: this is a population-level exposure with a per-woman risk far
    smaller than obesity or prior GDM, and it should not be curated as though it
    were a comparable driver. No mediating step has been demonstrated in humans.
    Experimental work offers candidate routes - insulin resistance, beta-cell
    dysfunction, inflammation, oxidative stress - but names them collectively for
    a class of pollutants rather than tying any one to phthalates in pregnancy.
  evidence:
  - reference: PMID:35578291
    reference_title: "Endocrine-disrupting chemicals and the risk of gestational diabetes mellitus: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PAEs and PFASs exposure were also positively associated with the risk of GDM, with summary ORs of 1.10 (95% CI = 1.03-1.16; n = 7 for PAEs)"
    explanation: >-
      Pooled estimate across seven studies giving the phthalate-GDM association
      and its magnitude, which is what this entry claims.
  - reference: PMID:37164202
    reference_title: "Environmental pollutants exposure and gestational diabetes mellitus: Evidence from epidemiological and experimental studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meta-analysis results showed that exposure to PAEs [OR (95%CI) = 1.07 (1.00, 1.14)], PFASs [OR (95%CI) = 1.10 (1.01, 1.19)], as well as PCBs [OR (95%CI) = 1.18 (1.02, 1.36)] and PBDEs [OR (95%CI) = 1.33 (1.17, 1.50)] significantly increased the risk of GDM"
    explanation: >-
      An independent meta-analysis reproducing the association at a similar
      magnitude, which is why it is curated as a signal rather than a single
      finding.
  influences_mechanisms:
  - target: Beta-Cell Compensatory Failure
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Drawn to the compensatory-failure node because that is the lesion of GDM -
      the point at which a normal gestational insulin-resistance load stops being
      matched by beta-cell output. The choice is by elimination, not by
      measurement: no human study places phthalates at either the insulin
      sensitivity or the secretion side of that balance. Experimental work
      nominates beta-cell dysfunction among several candidate mechanisms for
      pollutants as a class, which is why this edge is drawn at all, and why its
      intermediates are marked unknown.
    evidence:
    - reference: PMID:37164202
      reference_title: "Environmental pollutants exposure and gestational diabetes mellitus: Evidence from epidemiological and experimental studies."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "experimental studies suggested that the potential biological mechanisms of environmental pollutants contributing to GDM may involve insulin resistance, β-cell dysfunction, neurohormonal dysfunction, inflammation, oxidative stress, epigenetic modification, and alterations in gut microbiome"
      explanation: >-
        Names beta-cell dysfunction as a candidate mechanism, supporting the
        choice of target node. PARTIAL because the claim is made for pollutants
        as a class and is explicitly framed as potential. OTHER rather than
        HUMAN_CLINICAL because this sentence summarises the review's
        experimental arm - in vivo and in vitro studies together - so it fits
        neither MODEL_ORGANISM nor IN_VITRO alone and cannot be split further.
- name: Gestational bisphenol A exposure
  exposure_term:
    preferred_term: exposure to bisphenol A
    term:
      id: ECTO:9000057
      label: exposure to bisphenol A
  description: >-
    Curated as a negative result, not as a risk factor. BPA is the
    endocrine-disrupting chemical most often assumed to cause metabolic disease
    in pregnancy, and it does associate with preeclampsia in cohort data, so its
    absence from the GDM risk set is informative rather than an omission. A
    dedicated meta-analysis found no association with GDM or with impaired
    glucose tolerance, and a second meta-analysis covering the wider pollutant
    class found none for phenols generally. This entry carries no pathograph
    edge because there is no effect for a mechanism to explain.
  evidence:
  - reference: PMID:34590231
    reference_title: "Bisphenol A exposure and abnormal glucose tolerance during pregnancy: systematic review and meta-analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled odds ratio did not show BPA exposure to be a significant risk factor for GDM (OR = 0.90, 95% CI = 0.62-1.33, I2: 50.7%)."
    explanation: >-
      Directly refutes a BPA-GDM association, with a point estimate below unity
      rather than an underpowered positive.
  - reference: PMID:37164202
    reference_title: "Environmental pollutants exposure and gestational diabetes mellitus: Evidence from epidemiological and experimental studies."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "no significant effects were found for phenols, OCPs, and parabens"
    explanation: >-
      An independent meta-analysis finding no effect for the phenol class that
      contains BPA, in the same analysis that did find effects for phthalates.
diagnosis:
- name: Oral glucose tolerance test
  description: >-
    The OGTT is the usual diagnostic test for GDM and is the operational definition of
    the disease: it measures the maternal hyperglycaemia node directly, and the
    diagnosis is made by applying a glucose threshold to a continuously distributed
    measurement. The thresholds are conventional rather than natural and differ
    between guidelines, which is why the threshold-versus-continuum question is
    curated as an open discussion on this entry rather than settled here.
  diagnosis_term:
    preferred_term: oral glucose tolerance test
    term:
      id: NCIT:C45946
      label: Glucose Tolerance Test
  presence: Diagnostic
  markers: Venous plasma glucose, fasting and post-load
  evidence:
  - reference: PMID:31296866
    reference_title: "Gestational diabetes mellitus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis is usually performed using an oral glucose tolerance test (OGTT), although a non-fasting, glucose challenge test (GCT) is used in some parts of the world to screen women for those requiring a full OGTT."
    explanation: >-
      Names the OGTT as the usual diagnostic test for GDM. The review states the
      testing modality only; it reports no diagnostic accuracy and does not specify
      the glucose thresholds, which are the contested part and are left uncurated here.
- name: Glucose challenge test
  description: >-
    A non-fasting glucose challenge test is used in some parts of the world as a
    two-step screen, identifying the women who then proceed to a full OGTT. It is a
    screening rather than a diagnostic test, and its use is geographically variable -
    one of the concrete ways the diagnostic convention differs between guidelines.
  diagnosis_term:
    preferred_term: glucose challenge test
    term:
      id: NCIT:C45946
      label: Glucose Tolerance Test
  presence: Screening
  evidence:
  - reference: PMID:31296866
    reference_title: "Gestational diabetes mellitus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a non-fasting, glucose challenge test (GCT) is used in some parts of the world to screen women for those requiring a full OGTT"
    explanation: >-
      Establishes the GCT as a screening step that gates access to a full OGTT, and
      that its use is regional rather than universal. No accuracy figures are given.
  notes: >-
    NCIT has no distinct term for the non-fasting glucose challenge test, so the
    parent Glucose Tolerance Test term is used and the screening role is carried by
    preferred_term and presence.
treatments:
- name: Medical Nutrition Therapy and Physical Activity
  description: >-
    Dietary modification and increased physical activity are the first-line treatment
    and are sufficient for the majority of women. They act on the insulin-resistance
    side of the imbalance rather than on beta-cell secretion.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:31296866
    reference_title: "Gestational diabetes mellitus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dietary modification and increased physical activity are the primary treatments for GDM, but pharmacotherapy, usually insulin, is used when normoglycaemia is not achieved."
    explanation: Establishes diet and activity as first-line therapy with pharmacotherapy in reserve.
- name: Insulin Therapy
  description: >-
    Insulin is the standard pharmacotherapy when diet and activity fail to achieve
    normoglycaemia. It directly substitutes for the inadequate endogenous secretory
    response, and does not cross the placenta.
  therapeutic_modality: PROTEIN_REPLACEMENT
  target_mechanisms:
  - target: Beta-Cell Compensatory Failure
    treatment_effect: MODULATES
    description: >-
      Exogenous insulin supplies the secretory capacity the maternal beta cells cannot
      provide, correcting the demand-supply mismatch that defines the lesion.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: insulin
      term:
        id: CHEBI:145810
        label: insulin
  evidence:
  - reference: PMID:31296866
    reference_title: "Gestational diabetes mellitus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dietary modification and increased physical activity are the primary treatments for GDM, but pharmacotherapy, usually insulin, is used when normoglycaemia is not achieved."
    explanation: Identifies insulin as the usual pharmacotherapy for GDM.
  - reference: PMID:31296866
    reference_title: "Gestational diabetes mellitus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Treatment improves immediate pregnancy outcomes, reducing excess fetal growth and adiposity and pregnancy-related hypertensive disorders."
    explanation: >-
      Supports that treating GDM improves the fetal growth and hypertensive outcomes
      modeled downstream of maternal hyperglycaemia.
- name: Metformin
  description: >-
    An oral insulin-sensitising agent used in some countries as an alternative or
    adjunct to insulin. Unlike insulin it crosses the placenta, which is the basis of
    the continuing debate about long-term offspring effects.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Placental Hormone-Driven Insulin Resistance
    treatment_effect: INHIBITS
    description: >-
      Metformin improves maternal insulin sensitivity, reducing the secretory demand
      placed on limited beta-cell reserve.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metformin
      term:
        id: CHEBI:6801
        label: metformin
  evidence:
  - reference: PMID:31296866
    reference_title: "Gestational diabetes mellitus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Oral hypoglycaemic agents, principally metformin and glibenclamide (glyburide), are also used in some countries."
    explanation: >-
      Documents metformin as an oral agent used for GDM in some settings. The snippet
      supports use, not comparative efficacy or offspring safety.
discussions:
- discussion_id: gap_gdm_diagnostic_threshold_convention
  prompt: >-
    Given that maternal glucose relates to adverse perinatal outcome continuously with
    no natural inflection, on what basis should a GDM diagnostic threshold be set, and
    what does "prevalence of GDM" mean when the denominator-defining cut-off differs
    between guidelines?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Maternal Hyperglycaemia
  - phenotypes#Maternal hyperglycemia
  rationale: >-
    This entry deliberately carries no prevalence record, despite GDM being described
    as the most common medical complication of pregnancy, because a prevalence figure
    is not interpretable without the diagnostic criterion that generated it: the same
    population yields materially different GDM rates under IADPSG, WHO, NICE or
    Carpenter-Coustan criteria. The underlying question is a decision-theoretic one -
    the threshold should fall where the benefit of treatment exceeds its harms and
    costs - rather than a biological one, and it cannot be resolved by more precise
    measurement of the glucose-outcome curve. Curators adding prevalence to this entry
    should record the diagnostic criterion in the population or notes field, and should
    not pool estimates across criteria.
  evidence:
  - reference: PMID:31296866
    reference_title: "Gestational diabetes mellitus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hyperglycaemia that develops during pregnancy and resolves after birth has been recognized for over 50 years, but uniform worldwide consensus is lacking about threshold hyperglycaemic levels that merit a diagnosis of 'gestational diabetes mellitus' (GDM) and thus treatment during pregnancy."
    explanation: >-
      Documents the unresolved threshold question that makes cross-criterion prevalence
      comparison invalid.
  - reference: PMID:18463375
    reference_title: "Hyperglycemia and adverse pregnancy outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is controversial whether maternal hyperglycemia less severe than that in diabetes mellitus is associated with increased risks of adverse pregnancy outcomes."
    explanation: >-
      Frames the question HAPO was designed to answer, and whose continuous answer
      created the threshold problem.
references:
- reference: PMID:31296866
  title: "Gestational diabetes mellitus."
- reference: PMID:18463375
  title: "Hyperglycemia and adverse pregnancy outcomes."
notes: >-
  No prevalence record is asserted. GDM is the most common medical complication of
  pregnancy, but reported prevalence depends primarily on which diagnostic threshold a
  guideline adopts, so a single figure would be misleading. See the
  gap_gdm_diagnostic_threshold_convention discussion.

      preeclampsia specifically, and provides no frequency.
genetic:
- name: TCF7L2
  gene_term:
    preferred_term: TCF7L2
    term:
      id: hgnc:11641
      label: TCF7L2
  association: Susceptibility (common variants shared with type 2 diabetes)
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    The strongest common type 2 diabetes locus, and it carries over to GDM: three
    independent TCF7L2 variants (rs34872471, rs7903146, rs4506565) associate with GDM
    in the same case-control series. TCF7L2 acts principally on insulin secretion, so
    it loads onto the beta-cell side of the demand-supply imbalance rather than onto
    placental insulin resistance.
  evidence:
  - reference: PMID:29947923
    reference_title: "Genetic variants of gestational diabetes mellitus: a study of 112 SNPs among 8722 women in two independent populations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified eight variants associated with GDM, namely rs7957197 (HNF1A), rs10814916 (GLIS3), rs3802177 (SLC30A8), rs9379084 (RREB1), rs34872471 (TCF7L2), rs7903146 (TCF7L2), rs11787792 (GPSM1) and rs7041847 (GLIS3)"
    explanation: >-
      Names rs34872471 and rs7903146 in TCF7L2 among the eight variants associated
      with GDM in 2636 cases and 6086 controls across two independent cohorts.
  - reference: PMID:29947923
    reference_title: "Genetic variants of gestational diabetes mellitus: a study of 112 SNPs among 8722 women in two independent populations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we confirmed three variants, rs10830963 (MTNR1B), rs1387153 (MTNR1B) and rs4506565 (TCF7L2), that had previously been significantly associated with GDM risk"
    explanation: >-
      Independently replicates rs4506565 in TCF7L2 as a previously reported GDM

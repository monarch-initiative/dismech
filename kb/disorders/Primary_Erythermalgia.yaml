treatments:
- name: Cooling and trigger avoidance
  description: >-
    Non-pharmacological mainstay: cooling of the affected extremities (fan cooling
    preferred over prolonged cold-water immersion to avoid tissue injury) and
    avoidance of known triggers (warmth, standing, alcohol, spicy foods) relieve
    and prevent acute attacks.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:20301342
    reference_title: SCN9A Neuropathic Pain Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cooling the extremities reduces pain; note that use of a fan is preferable to prolonged immersion in cold water, which can result in skin maceration, infection, and gangrene."
    explanation: GeneReviews management guidance for cooling with a caution against prolonged cold-water immersion.
  - reference: PMID:20301342
    reference_title: SCN9A Neuropathic Pain Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Triggers including warmth, standing, alcohol, and spicy foods (SCN9A-EM)"
    explanation: GeneReviews lists the agents/circumstances to avoid that provoke SCN9A-EM attacks.
- name: Sodium channel blocker therapy
  description: >-
    Oral/systemic sodium-channel-blocking agents (carbamazepine, oral mexiletine,
    lidocaine infusion) are used to reduce Nav1.7-driven hyperexcitability;
    responses are variable and can be genotype-dependent (e.g., the V400M variant
    is carbamazepine-responsive). Unlike secondary/MPN-associated erythromelalgia,
    primary erythermalgia typically responds poorly to aspirin.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mexiletine
      term:
        id: CHEBI:6916
        label: mexiletine
    - preferred_term: carbamazepine
      term:

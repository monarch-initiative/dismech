    term:
      id: hgnc:10597
      label: SCN9A
  relationship_type: CAUSATIVE
  association: >-
    Heterozygous gain-of-function missense variants in SCN9A (Nav1.7) are the
    principal cause of primary/inherited erythromelalgia. Distinct variants can be
    genotype-specific for treatment response (e.g., the V400M variant is
    carbamazepine-responsive).

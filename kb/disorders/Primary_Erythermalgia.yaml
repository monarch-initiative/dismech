    treatment_effect: INHIBITS
    description: >-
      Sodium-channel blockers act on the gain-of-function Nav1.7 channel itself; carbamazepine
      normalizes the shifted activation/inactivation of the mutant channel (genotype-dependent),
      reducing the upstream driver of nociceptor hyperexcitability.
    evidence:

name: Primary Erythermalgia
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Primary erythermalgia (primary/inherited erythromelalgia, IEM) is an autosomal
  dominant neuropathic pain channelopathy caused by gain-of-function variants in
  SCN9A, which encodes the voltage-gated sodium channel Nav1.7 preferentially
  expressed in dorsal root ganglion nociceptors and sympathetic neurons. Patients
  have intermittent, often bilateral and symmetric attacks of red, warm, burning
  pain in the distal extremities (feet more than hands) that are triggered by
  warmth or exercise and dramatically relieved by cooling. Onset is typically in
  early childhood, though later-onset kindreds exist. It is distinguished from
  secondary erythromelalgia (e.g., myeloproliferative-neoplasm-associated) by its
  genetic, neuronal-sodium-channel basis and its characteristic poor response to
  aspirin. Within the SCN9A neuropathic pain syndromes it is distinct from the
  sibling entities paroxysmal extreme pain disorder (PEPD) and SCN9A small-fiber
  neuropathy.
category: Mendelian
parents:
- Channelopathy
- Peripheral Neuropathy
- hereditary disease

differential_diagnoses:
- name: Secondary erythromelalgia
  disease_term:
    preferred_term: secondary erythromelalgia
    term:
      id: MONDO:0035149
      label: secondary erythromelalgia
  description: >-
    The acquired sibling entity, curated separately as `Secondary_Erythromelalgia`.
    Most characteristically it arises in a myeloproliferative neoplasm (essential
    thrombocythemia or polycythemia vera), where the mechanism is platelet-mediated
    arteriolar inflammation and thrombotic occlusion of acral arterioles rather than
    the Nav1.7 nociceptor channelopathy modeled here. Distinguishing features:
    later onset, frequently asymmetric or unilateral attacks, an accompanying
    thrombocytosis, and — the key discriminator — dramatic relief with aspirin,
    which primary erythermalgia characteristically lacks.
  evidence:
  - reference: PMID:8203771
    reference_title: 'Thrombocythemic erythromelalgia, primary erythermalgia, and secondary erythermalgia: three distinct clinicopathologic entities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the authors discern three distinct types of red, congested, and burning extremities that need to be distinguished for effective treatment according to their etiology: erythromelalgia in thrombocythemia, primary erythermalgia, and secondary erythermalgia"
    explanation: >-
      Establishes primary erythermalgia and the acquired forms as distinct clinicopathologic
      entities that must be separated for effective treatment.
  - reference: PMID:40428878
    reference_title: 'Comparative Efficacy and Tolerability of Treatments for Erythromelalgia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary EM, in contrast, is not associated with known genetic mutations and typically presents later in life."
    explanation: Supports the later age at onset of the secondary form relative to the primary form.
  - reference: PMID:40428878
    reference_title: 'Comparative Efficacy and Tolerability of Treatments for Erythromelalgia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary EM tends to be more variable in presentation, may be unilateral or localized, and treatment usually targets the underlying condition."
    explanation: Supports the asymmetric/unilateral and localized presentation that distinguishes secondary disease.
  - reference: PMID:3977194
    reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin punch biopsy samples taken from the affected areas showed typical arteriolar inflammation, fibromuscular intima proliferation, and thrombotic occlusions."
    explanation: >-
      Documents the platelet-mediated arteriolar histopathology of the myeloproliferative form.
      This paper studied thrombocythemia patients only and makes no claim about primary
      erythermalgia; the contrast between the two entities rests on PMID:8203771 above.
discussions:
- discussion_id: iem_rodent_knockin_pain_mismatch
  prompt: >-
    Do rodent Nav1.7 gain-of-function knock-in models faithfully recapitulate the human
    inherited-erythromelalgia pain phenotype, or only its cellular (DRG hyperexcitability) substrate?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Nociceptor Hyperexcitability
  rationale: >-
    Human iPSC-derived sensory neurons carrying Nav1.7 gain-of-function mutations reproduce
    hyperexcitability, and CRISPR correction reverses it while introducing the mutation confers it
    (PMID:40279376), validating the human cellular model. By contrast, two independent knock-in
    mouse lines carrying a Nav1.7 gain-of-function variant (I228M — a variant found in idiopathic
    small-fiber neuropathy, a sibling Nav1.7 channelopathy rather than an IEM-specific allele)
    reproduce DRG neuron hyperexcitability but do NOT display mechanical/thermal hyperalgesia or
    intraepidermal nerve fiber loss (PMID:33323889). This dissociation — cellular hyperexcitability
    without an overt behavioral pain phenotype in mice — is a translational caveat for modeling
    Nav1.7 gain-of-function pain disorders, including IEM.
  evidence:
  - reference: PMID:33323889
    reference_title: Two independent mouse lines carrying the Nav1.7 I228M gain-of-function variant display dorsal root ganglion neuron hyperexcitability but a minimal pain phenotype.
    supports: SUPPORT

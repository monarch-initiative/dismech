inheritance:
- name: Autosomal dominant
  description: >-
    Primary erythermalgia is inherited in an autosomal dominant pattern; most
    familial cases segregate a heterozygous gain-of-function SCN9A variant, and
    de novo variants account for many sporadic early-onset cases.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301342
    reference_title: SCN9A Neuropathic Pain Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCN9A neuropathic pain syndromes are inherited in an autosomal dominant manner. Each child of an individual with an NPS-causing variant in SCN9A has a 50% chance of inheriting the variant."
    explanation: GeneReviews establishes autosomal dominant inheritance with 50% transmission risk.
pathophysiology:
- name: SCN9A Gain-of-Function Variant (Nav1.7)
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense gain-of-function variants in SCN9A alter the biophysical
    properties of the Nav1.7 voltage-gated sodium channel. Characteristic changes
    include a hyperpolarizing shift in the voltage-dependence of activation, slowed
    deactivation, and enhanced ramp currents, which lower the threshold for channel
    opening and increase the channel's response to small, slow depolarizations.
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: INCREASED
  genes:
  - preferred_term: SCN9A
    term:
      id: hgnc:10597
      label: SCN9A
  evidence:
  - reference: PMID:14985375
    reference_title: Mutations in SCN9A, encoding a sodium channel alpha subunit, in patients with primary erythermalgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that mutations in SCN9A cause primary erythermalgia. SCN9A, encoding a voltage-gated sodium channel alpha subunit predominantly expressed in sensory and sympathetic neurones, may play an important role in nociception and vasomotor regulation."
    explanation: The gene-discovery study links SCN9A missense mutations to primary erythermalgia.
  - reference: PMID:15385606
    reference_title: Electrophysiological properties of mutant Nav1.7 sodium channels in a painful inherited neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that these mutations in Na(v)1.7 produce a hyperpolarizing shift in activation and slow deactivation. We also show that these mutations cause an increase in amplitude of the current produced by Na(v)1.7 in response to slow, small depolarizations."
    explanation: Patch-clamp characterization demonstrates the gain-of-function biophysical shifts of erythermalgia Nav1.7 mutants.
  - reference: PMID:16988069
    reference_title: 'Inherited erythermalgia: limb pain from an S4 charge-neutral Na channelopathy.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The F216S mutation hyperpolarizes the voltage dependence of activation by 11 mV, accelerates activation, slows deactivation, and enhances the response to slow, small depolarizations."
    explanation: A second erythermalgia mutation (in the S4 segment) reproduces the same gain-of-function gating changes.
  - reference: PMID:25995458
    reference_title: 'Novel SCN9A mutations underlying extreme pain phenotypes: unexpected electrophysiological and clinical phenotype correlations.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "IEM is usually caused by enhanced NaV1.7 channel activation, whereas mutations that alter steady-state fast inactivation often lead to PEPD."
    explanation: >-
      Anchors the mechanistic distinction underpinning the IEM/PEPD split modeled here — IEM
      arises from enhanced activation, distinguishing it from the fast-inactivation defects of PEPD.
  downstream:
  - target: Nociceptor Hyperexcitability
    description: Altered Nav1.7 gating lowers nociceptor firing threshold and drives repetitive firing.
  - target: Sympathetic Neuron Dysregulation
    description: The same gain-of-function variant alters excitability of sympathetic ganglion neurons that also express Nav1.7.
- name: Nociceptor Hyperexcitability
  biological_scale: CELLULAR
  description: >-
    Because Nav1.7 sets the gain of dorsal root ganglion nociceptors, the
    gain-of-function channel produces membrane hyperexcitability: lowered firing
    threshold, increased spontaneous and evoked action-potential firing, and
    amplified responses to physiological stimuli, generating ectopic pain signaling.
  cell_types:
  - preferred_term: dorsal root ganglion sensory neuron
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  biological_processes:
  - preferred_term: neuronal action potential
    term:
      id: GO:0019228
      label: neuronal action potential
    modifier: INCREASED
  evidence:
  - reference: PMID:15385606
    reference_title: Electrophysiological properties of mutant Nav1.7 sodium channels in a painful inherited neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these physiological changes, which confer hyperexcitability on peripheral sensory and sympathetic neurons, contribute to symptom production in hereditary erythermalgia"
    explanation: >-
      The gain-of-function gating changes confer hyperexcitability on sensory neurons, driving
      symptoms. Note the 2004 characterization of sympathetic neurons as hyperexcitable was later
      refined to hypoexcitability (PMID:16702558; see the Sympathetic Neuron Dysregulation node).
  - reference: PMID:16988069
    reference_title: 'Inherited erythermalgia: limb pain from an S4 charge-neutral Na channelopathy.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These changes should increase excitability of nociceptive dorsal root ganglion neurons in which the mutant channel is present, thus contributing to pain."
    explanation: Predicts increased excitability of nociceptive DRG neurons carrying the mutant channel.
  - reference: PMID:40279376
    reference_title: Correction of sodium channel mutations in sensory neurons reverses aberrant properties.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "using CRISPR/Cas9, we corrected this mutation, which reduced the underlying hyperexcitability, providing a path for personalized medicine to treat these disorders, and we introduced the mutation into control induced pluripotent stem cells, which generated hyperexcitability, providing causality"
    explanation: >-
      Bidirectional CRISPR editing in human iPSC-derived sensory neurons establishes a direct causal
      link between the Nav1.7 gain-of-function mutation and nociceptor hyperexcitability.
  downstream:
  - target: Episodic Neurovascular Pain Flares
    description: Hyperexcitable nociceptor output drives painful attacks with warmth-triggered vasodilation.
- name: Sympathetic Neuron Dysregulation
  biological_scale: CELLULAR
  description: >-
    Nav1.7 is also expressed in sympathetic ganglion neurons. The same
    gain-of-function variant that renders sensory neurons hyperexcitable
    paradoxically renders sympathetic neurons hypoexcitable (because sympathetic
    neurons lack Nav1.8, which keeps sensory neurons firing at depolarized
    potentials), providing a molecular basis for the abnormal vasomotor control and
    the warm, erythematous flares.
  cell_types:
  - preferred_term: sympathetic noradrenergic neuron
    term:
      id: CL:0011103
      label: sympathetic neuron
  evidence:
  - reference: PMID:16702558
    reference_title: A single sodium channel mutation produces hyper- or hypoexcitability in different types of neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although this mutation depolarizes resting membrane potential in both types of neurons, it renders sensory neurons hyperexcitable and sympathetic neurons hypoexcitable."
    explanation: A single Nav1.7 erythermalgia mutation has opposite excitability effects in sensory versus sympathetic neurons.
  - reference: PMID:16702558
    reference_title: A single sodium channel mutation produces hyper- or hypoexcitability in different types of neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results provide a molecular basis for the sympathetic dysfunction that has been observed in erythermalgia."
    explanation: Links Nav1.7 sympathetic hypoexcitability to the vasomotor/autonomic dysfunction seen clinically.
  downstream:
  - target: Episodic Neurovascular Pain Flares
    description: Autonomic vasomotor dysregulation contributes to episodic distal vasodilation.
- name: Episodic Neurovascular Pain Flares
  biological_scale: ORGANISM
  description: >-
    The convergence of nociceptor hyperexcitability and autonomic vasomotor
    dysregulation produces the clinical hallmark: intermittent, often bilateral
    and symmetric attacks of burning pain with erythema and increased warmth of the
    distal extremities, provoked by heat or exertion and relieved by cooling.
  evidence:
  - reference: PMID:20301342
    reference_title: SCN9A Neuropathic Pain Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCN9A-EM is characterized by recurrent episodes of bilateral intense, burning pain, and redness, warmth, and occasionally swelling."
    explanation: GeneReviews describes the episodic bilateral burning-pain-with-redness-and-warmth flare that defines the disorder.

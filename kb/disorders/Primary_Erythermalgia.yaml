inheritance:
- name: Autosomal dominant
  description: >-
    Primary erythermalgia is inherited in an autosomal dominant pattern; most
    familial cases segregate a heterozygous gain-of-function SCN9A variant, and
    de novo variants account for many sporadic early-onset cases.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301342
    reference_title: SCN9A Neuropathic Pain Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCN9A neuropathic pain syndromes are inherited in an autosomal dominant manner. Each child of an individual with an NPS-causing variant in SCN9A has a 50% chance of inheriting the variant."
    explanation: GeneReviews establishes autosomal dominant inheritance with 50% transmission risk.
pathophysiology:
- name: SCN9A Gain-of-Function Variant (Nav1.7)
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense gain-of-function variants in SCN9A alter the biophysical
    properties of the Nav1.7 voltage-gated sodium channel. Characteristic changes
    include a hyperpolarizing shift in the voltage-dependence of activation, slowed
    deactivation, and enhanced ramp currents, which lower the threshold for channel
    opening and increase the channel's response to small, slow depolarizations.
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: INCREASED
  genes:
  - preferred_term: SCN9A
    term:
      id: hgnc:10597
      label: SCN9A
  evidence:
  - reference: PMID:14985375
    reference_title: Mutations in SCN9A, encoding a sodium channel alpha subunit, in patients with primary erythermalgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that mutations in SCN9A cause primary erythermalgia. SCN9A, encoding a voltage-gated sodium channel alpha subunit predominantly expressed in sensory and sympathetic neurones, may play an important role in nociception and vasomotor regulation."
    explanation: The gene-discovery study links SCN9A missense mutations to primary erythermalgia.
  - reference: PMID:15385606
    reference_title: Electrophysiological properties of mutant Nav1.7 sodium channels in a painful inherited neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that these mutations in Na(v)1.7 produce a hyperpolarizing shift in activation and slow deactivation. We also show that these mutations cause an increase in amplitude of the current produced by Na(v)1.7 in response to slow, small depolarizations."
    explanation: Patch-clamp characterization demonstrates the gain-of-function biophysical shifts of erythermalgia Nav1.7 mutants.
  - reference: PMID:16988069
    reference_title: 'Inherited erythermalgia: limb pain from an S4 charge-neutral Na channelopathy.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The F216S mutation hyperpolarizes the voltage dependence of activation by 11 mV, accelerates activation, slows deactivation, and enhances the response to slow, small depolarizations."
    explanation: A second erythermalgia mutation (in the S4 segment) reproduces the same gain-of-function gating changes.
  downstream:
  - target: Nociceptor Hyperexcitability
    description: Altered Nav1.7 gating lowers nociceptor firing threshold and drives repetitive firing.
- name: Nociceptor Hyperexcitability
  biological_scale: CELLULAR
  description: >-
    Because Nav1.7 sets the gain of dorsal root ganglion nociceptors, the
    gain-of-function channel produces membrane hyperexcitability: lowered firing
    threshold, increased spontaneous and evoked action-potential firing, and
    amplified responses to physiological stimuli, generating ectopic pain signaling.
  cell_types:
  - preferred_term: dorsal root ganglion sensory neuron
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  biological_processes:
  - preferred_term: neuronal action potential
    term:
      id: GO:0019228
      label: neuronal action potential
    modifier: INCREASED
  evidence:
  - reference: PMID:15385606
    reference_title: Electrophysiological properties of mutant Nav1.7 sodium channels in a painful inherited neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these physiological changes, which confer hyperexcitability on peripheral sensory and sympathetic neurons, contribute to symptom production in hereditary erythermalgia"
    explanation: The gain-of-function gating changes confer hyperexcitability on sensory neurons, driving symptoms.
  - reference: PMID:16988069
    reference_title: 'Inherited erythermalgia: limb pain from an S4 charge-neutral Na channelopathy.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These changes should increase excitability of nociceptive dorsal root ganglion neurons in which the mutant channel is present, thus contributing to pain."
    explanation: Predicts increased excitability of nociceptive DRG neurons carrying the mutant channel.
  downstream:
  - target: Episodic Neurovascular Pain Flares
    description: Hyperexcitable nociceptor output drives painful attacks with warmth-triggered vasodilation.
- name: Sympathetic Neuron Dysregulation
  biological_scale: CELLULAR
  description: >-
    Nav1.7 is also expressed in sympathetic ganglion neurons. The same
    gain-of-function variant that renders sensory neurons hyperexcitable
    paradoxically renders sympathetic neurons hypoexcitable (because sympathetic
    neurons lack Nav1.8, which keeps sensory neurons firing at depolarized
    potentials), providing a molecular basis for the abnormal vasomotor control and
    the warm, erythematous flares.
  cell_types:
  - preferred_term: sympathetic noradrenergic neuron
    term:
      id: CL:0011103
      label: sympathetic neuron
  evidence:
  - reference: PMID:16702558
    reference_title: A single sodium channel mutation produces hyper- or hypoexcitability in different types of neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although this mutation depolarizes resting membrane potential in both types of neurons, it renders sensory neurons hyperexcitable and sympathetic neurons hypoexcitable."
    explanation: A single Nav1.7 erythermalgia mutation has opposite excitability effects in sensory versus sympathetic neurons.
  - reference: PMID:16702558
    reference_title: A single sodium channel mutation produces hyper- or hypoexcitability in different types of neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results provide a molecular basis for the sympathetic dysfunction that has been observed in erythermalgia."
    explanation: Links Nav1.7 sympathetic hypoexcitability to the vasomotor/autonomic dysfunction seen clinically.
  downstream:
  - target: Episodic Neurovascular Pain Flares
    description: Autonomic vasomotor dysregulation contributes to episodic distal vasodilation.
- name: Episodic Neurovascular Pain Flares
  biological_scale: ORGANISM
  description: >-
    The convergence of nociceptor hyperexcitability and autonomic vasomotor
    dysregulation produces the clinical hallmark: intermittent, often bilateral
    and symmetric attacks of burning pain with erythema and increased warmth of the
    distal extremities, provoked by heat or exertion and relieved by cooling.
  evidence:
  - reference: PMID:20301342
    reference_title: SCN9A Neuropathic Pain Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCN9A-EM is characterized by recurrent episodes of bilateral intense, burning pain, and redness, warmth, and occasionally swelling."
    explanation: GeneReviews describes the episodic bilateral burning-pain-with-redness-and-warmth flare that defines the disorder.
phenotypes:
- name: Erythromelalgia
  category: Clinical
  description: >-
    Intermittent attacks of red, hot, burning painful distal extremities — the
    defining clinical phenotype, typically bilateral and symmetric, worse in the
    feet, triggered by warmth or exercise and relieved by cooling.
  phenotype_term:
    preferred_term: Erythromelalgia
    term:
      id: HP:0032147
      label: Erythromelalgia
    temporality: RECURRENT
  evidence:
  - reference: PMID:20301342
    reference_title: SCN9A Neuropathic Pain Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the feet are more commonly affected than the hands, in severely affected individuals the legs, arms, face, and/or ears may be involved."
    explanation: Documents the distal, feet-predominant distribution characteristic of the erythromelalgia phenotype.
  - reference: PMID:14985375
    reference_title: Mutations in SCN9A, encoding a sodium channel alpha subunit, in patients with primary erythermalgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary erythermalgia is a rare autosomal dominant disease characterised by intermittent burning pain with redness and heat in the extremities."
    explanation: Defines the erythromelalgia triad of burning pain, redness, and heat in the extremities.
- name: Burning limb pain
  category: Clinical
  description: >-
    Severe burning pain of the distal limbs during flares; often the most
    disabling feature and a driver of compulsive cooling behavior.
  phenotype_term:
    preferred_term: Limb pain
    term:
      id: HP:0009763
      label: Limb pain
  evidence:
  - reference: PMID:16988069
    reference_title: 'Inherited erythermalgia: limb pain from an S4 charge-neutral Na channelopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inherited erythermalgia (also termed \"erythromelalgia\"), characterized by episodic burning pain in the distal extremities evoked by warmth, has been causally linked with mutations of the Na(v)1.7 sodium channel, which is preferentially expressed in nociceptors."
    explanation: Describes episodic burning pain of the distal extremities evoked by warmth.
- name: Skin ulceration
  category: Clinical
  description: >-
    Prolonged cold-water immersion used to relieve pain, and severe attacks, can
    cause skin maceration, erosion, ulceration, infection, and even gangrene of the
    extremities — the basis for advising fan cooling over prolonged immersion.
  phenotype_term:
    preferred_term: Skin ulcer
    term:
      id: HP:0200042
      label: Skin ulcer
  evidence:
  - reference: PMID:20301342
    reference_title: SCN9A Neuropathic Pain Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "use of a fan is preferable to prolonged immersion in cold water, which can result in skin maceration, infection, and gangrene"
    explanation: GeneReviews documents skin maceration, infection, and gangrene from prolonged cold-water immersion.
genetic:
- name: SCN9A
  gene_term:
    preferred_term: SCN9A
    term:
      id: hgnc:10597
      label: SCN9A
  relationship_type: CAUSATIVE
  association: >-
    Heterozygous gain-of-function missense variants in SCN9A (Nav1.7) are the
    principal cause of primary/inherited erythromelalgia. Distinct variants can be
    genotype-specific for treatment response (e.g., the V400M variant is
    carbamazepine-responsive).
  evidence:
  - reference: PMID:14985375
    reference_title: Mutations in SCN9A, encoding a sodium channel alpha subunit, in patients with primary erythermalgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We then identified two missense mutations in SCN9A in the family (T2573A) and the sporadic patient (T2543C). Our data suggest that mutations in SCN9A cause primary erythermalgia."
    explanation: Identifies causative SCN9A missense mutations in familial and sporadic primary erythermalgia.
  - reference: PMID:30416015
    reference_title: 'Pediatric Erythromelalgia and SCN9A Mutations: Systematic Review and Single-Center Case Series.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-eight publications described erythromelalgia associated with 15 different SCN9A gene variants in 25 children."
    explanation: A systematic review confirms multiple distinct SCN9A gain-of-function variants across pediatric erythromelalgia cases.
treatments:
- name: Cooling and trigger avoidance
  description: >-
    Non-pharmacological mainstay: cooling of the affected extremities (fan cooling
    preferred over prolonged cold-water immersion to avoid tissue injury) and
    avoidance of known triggers (warmth, standing, alcohol, spicy foods) relieve
    and prevent acute attacks.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:20301342
    reference_title: SCN9A Neuropathic Pain Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cooling the extremities reduces pain; note that use of a fan is preferable to prolonged immersion in cold water, which can result in skin maceration, infection, and gangrene."
    explanation: GeneReviews management guidance for cooling with a caution against prolonged cold-water immersion.
- name: Sodium channel blocker therapy
  description: >-
    Oral/systemic sodium-channel-blocking agents (carbamazepine, oral mexiletine,
    lidocaine infusion) are used to reduce Nav1.7-driven hyperexcitability;
    responses are variable and can be genotype-dependent (e.g., the V400M variant
    is carbamazepine-responsive). Unlike secondary/MPN-associated erythromelalgia,
    primary erythermalgia typically responds poorly to aspirin.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mexiletine
      term:
        id: CHEBI:6916
        label: mexiletine
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:20301342
    reference_title: SCN9A Neuropathic Pain Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Medications to consider are nonselective sodium channel blockers (e.g., carbamazepine, lidocaine infusion, or oral mexiletine)."
    explanation: GeneReviews lists nonselective sodium channel blockers as the pharmacologic options for SCN9A erythromelalgia.
  - reference: PMID:19557861
    reference_title: A novel Nav1.7 mutation producing carbamazepine-responsive erythromelalgia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that CBZ, at concentrations in the human therapeutic range, normalizes the voltage dependence of activation and inactivation of this inherited erythromelalgia mutation in Na(v)1.7 but does not affect these parameters in wild-type Na(v)1.7."
    explanation: Demonstrates the mechanistic, genotype-specific basis for carbamazepine responsiveness of the V400M variant.

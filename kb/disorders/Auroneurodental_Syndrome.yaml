experimental_models:
- name: Patient-derived fibroblasts and PBMCs (NAA80 p.Leu130Pro homozygous)
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary skin fibroblasts from the elder brother and peripheral blood
    mononuclear cells from both brothers, compared with cells from three healthy
    donors, and rescued by lentiviral re-expression of wild-type NAA80. These are
    the cells in which every molecular step of the mechanism was measured.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  cell_source: Patient skin biopsy and peripheral blood
  publication: PMID:34805998
  modeled_mechanisms:
  - target: Reduced N-Terminal Acetylation of Cytoplasmic Actin
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Mass spectrometry of actin N-terminal peptides in the patients' own cells
      is the direct measurement of the residual modification.
    limitations: >-
      Fibroblasts and PBMCs are not the affected tissues, so the degree of
      residual acetylation in cochlea, brain or muscle is unmeasured and could
      differ.
    readouts:
    - name: Proportion of unacetylated beta- and gamma-actin
      target: Reduced N-Terminal Acetylation of Cytoplasmic Actin
      direction: INCREASED
      interpretation: >-
        25 to 65 percent unacetylated in patients against about 0.5 percent in
        healthy donors, i.e. a partial rather than complete loss.
      evidence:
      - reference: PMID:34805998
        reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          In healthy donors, ∼0.5% of beta and gamma-actins were not acetylated.
          However, for the NAA80 individuals, 25–65% of beta and gamma-actins
          were not acetylated, depending on the cell type and the type of
          cytoplasmic actin
        explanation: The mass-spectrometry measurement behind this readout.
    evidence:
    - reference: PMID:34805998
      reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Concurrently, individuals exhibited a ∼50% decrease of actin
        acetylation.
      explanation: >-
        Supports treating the patients' own cells as the informative system for
        the acetylation defect.
  - target: Increased Filamentous Actin with Excess Filopodia and Migration
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The cellular phenotype is present in the patients' own cells, matches the
      NAA80-knockout cell-line phenotype, and is reversed by re-expressing
      wild-type NAA80.
    limitations: >-
      Fibroblast and PBMC migration is not the cell behaviour that matters in
      cochlear hair cells, neurons or myofibres; the read-across to those cells is
      an assumption.
    readouts:
    - name: Phalloidin staining intensity (polymerized actin)
      target: Increased Filamentous Actin with Excess Filopodia and Migration
      direction: INCREASED
      interpretation: More filamentous actin in patient PBMCs and fibroblasts.
      evidence:
      - reference: PMID:34805998
        reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Indeed, NAA80 individual PBMCs and fibroblasts displayed increased
          phalloidin staining, corresponding with increased levels of polymerized
          actin
        explanation: The direct measurement of filamentous actin content.
    - name: Filopodia count per cell after wild-type NAA80 rescue
      target: Increased Filamentous Actin with Excess Filopodia and Migration
      direction: RESTORED
      interpretation: >-
        Re-expressing wild-type NAA80 returns filopodia counts to control levels,
        establishing that the enzyme deficiency causes the phenotype.
      evidence:
      - reference: PMID:34805998
        reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The introduction of wild-type NAA80 protein with the SV40 promoter
          lowered filopodia counts to the level observed in healthy controls
        explanation: The rescue measurement behind this readout.
    - name: Chemotactic migration after wild-type NAA80 rescue
      target: Increased Filamentous Actin with Excess Filopodia and Migration
      direction: RESTORED
      interpretation: Migration also returns to control levels on rescue.
      evidence:
      - reference: PMID:34805998
        reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          In fibroblasts, expression of NAA80 wild-type with the SV40 promoter
          protein lowered migration levels to the level observed in healthy
          controls
        explanation: The rescue measurement for the migration readout.
    evidence:
    - reference: PMID:34805998
      reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        NAA80 individual derived fibroblasts and peripheral blood mononuclear
        cells showed increased migration, increased filopodia counts and

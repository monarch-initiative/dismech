name: Auroneurodental Syndrome
creation_date: '2026-09-04T00:00:00Z'
category: Mendelian
description: An autosomal recessive NAA80-associated syndrome reported in two brothers with progressive high-frequency sensorineural hearing impairment, craniofacial and dental abnormalities, developmental delay and mild proximal and axial muscle weakness. The reported p.Leu130Pro allele reduces NAA80 abundance and actin N-terminal acetylation in sampled cells. Patient-cell and knockout experiments show altered filament content, protrusions and migration, while separate zebrafish experiments support a hearing-related role. The routes to individual human organ manifestations remain incompletely resolved.
disease_term:
  preferred_term: auroneurodental syndrome
  term:
    id: MONDO:0970998
    label: auroneurodental syndrome
parents:
- hereditary disease
- Neurodevelopmental Disorder
synonyms:
- NAA80-related syndrome
- AURDENS
notes: Clinical observations derive from two related individuals, so no phenotype-frequency bands or population prevalence are inferred. NAA80 functional evidence is substantial, but the co-segregating PLXNB1 variant leaves possible contributions to individual features unresolved. Cellular rescue is experimental and does not establish a clinical treatment. Search by NAA80 or OMIM 620830 to distinguish this disorder from FGF3-related labyrinthine aplasia-microtia-microdontia syndrome.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Both affected brothers are homozygous for NAA80 c.389T>C, p.(Leu130Pro); both parents are heterozygous and unaffected, and the two healthy siblings do not carry the variant in the homozygous state. A large run of homozygosity and shared parental geographic origin indicate distant consanguinity.
  evidence:
  - reference: PMID:34805998
    reference_title: NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report two individuals from a single family harbouring a homozygous c.389T>C, p.(Leu130Pro) NAA80 genetic variant.
    explanation: States the homozygous state in both affected individuals.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34805998
    reference_title: NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both parents were heterozygous for this variant.
    explanation: Unaffected heterozygous parents complete the recessive segregation argument.
    quote_role: PRIMARY_RESULT
pathophysiology:
- name: Biallelic NAA80 Dysfunction
  biological_scale: MOLECULAR
  description: The reported family carries homozygous NAA80 c.389T>C, p.(Leu130Pro), a hypomorphic allele with residual activity in expression assays. Molecular and cellular experiments support NAA80 dysfunction. Attribution of every clinical feature remains limited by one family and a co-segregating PLXNB1 variant.
  evidence:
  - reference: PMID:34805998
    reference_title: NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: We report two individuals from a single family harbouring a homozygous c.389T>C, p.(Leu130Pro) NAA80 genetic variant.
    explanation: The clinical association is based on two affected brothers in one family.

    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Disordered Actin Dynamics in Skeletal Muscle
  biological_scale: TISSUE
  description: >-
    Mild proximal and axial muscle weakness, with fatigue and feeding
    difficulties. The authors judge the overlap with ACTA1-related disease to be
    only modest: NAA80 individuals have moderate axial hypotonia and proximal
    weakness where ACTA1 patients have overt nemaline myopathy.
  mechanism_confidence: HYPOTHETICAL
  notes: >-
    The weakest of the three organ arms. It is HYPOTHETICAL not only because no
    muscle tissue has been examined but because the one in-vivo test of it — the
    naa80-null zebrafish — was negative for muscle phenotype. See the
    `HUMAN_MODEL_MISMATCH` discussion.
  evidence:

        snippet: In NAA80 individual fibroblasts, increased filopodia counts were observed
        explanation: Filopodia were counted in fibroblasts from the elder brother; this was not a PBMC filopodia assay.
  - target: Increased Cell Migration
    relationship: MEASURES
    fidelity: HIGH
    description: Fibroblasts and PBMCs from affected individuals migrate more in chemotactic assays. Wild-type NAA80 expression rescues fibroblast migration; HAP1 knockout experiments also show increased directed and random migration. Migration was not measured in the patients’ developing neurons or craniofacial tissues.
    limitations: One patient fibroblast line and two related PBMC donors; these are not inner-ear, neural, muscle or dental tissue.
    evidence:
    - reference: PMID:34805998
      reference_title: NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: Both fibroblasts and PBMCs of NAA80 individuals showed increased movement in response to chemotactic stimuli

genetic:
- name: NAA80
  gene_term:
    preferred_term: NAA80
    term:
      id: hgnc:30252
      label: NAA80
  relationship_type: CAUSATIVE
  association: Homozygous c.389T>C, p.(Leu130Pro) in the catalytic domain
  variant_origin: GERMLINE
  notes: One functionally studied NAA80 allele in one reported family. Both brothers also carry homozygous PLXNB1 p.Ser911Gly, which was absent in the healthy siblings. NAA80 rescue establishes its contribution to the measured fibroblast phenotypes, but does not exclude an additional clinical contribution from PLXNB1.
  evidence:
  - reference: PMID:34805998
    reference_title: NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report two individuals from a single family harbouring a homozygous c.389T>C, p.(Leu130Pro) NAA80 genetic variant.
    explanation: Identifies the allele and the number of affected individuals carrying it.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34805998
    reference_title: NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: Based on the molecular structure, we predicted and confirmed the NAA80 c.389T>C, p.(Leu130Pro) variant to result in protein destabilization, causing severely decreased NAA80 protein availability.
    explanation: Functional evidence that the allele is deleterious, which is what carries the gene-disease assertion in a single family. INDIRECT because protein destabilization is a step short of the disease.
    quote_role: PRIMARY_RESULT

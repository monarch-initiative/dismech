- name: Disordered Actin Dynamics in the Inner Ear
  biological_scale: TISSUE
  description: >-
    The best-supported organ-level arm of the disease. Both brothers have
    bilateral high-frequency sensorineural hearing loss, detected at five weeks
    of age in the elder. Zebrafish lacking naa80 show smaller otoliths, fewer
    hair-cell bundles in the lateral crista, shorter stereocilia, reduced
    hair-cell viability and a reduced acoustic startle response, which is
    independent in-vivo support for this node.
  mechanism_confidence: HYPOTHETICAL
  notes: >-
    Curated HYPOTHETICAL for the human disease specifically: no cochlear or
    vestibular tissue from a patient has been examined, and the supporting
    measurements are in zebrafish or in patient fibroblasts. The zebrafish result
    is strong enough that this is the node most likely to be upgraded first.
  evidence:
  - reference: PMID:34805998
    reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both individuals show progressive high-frequency sensorineural hearing
      loss, craniofacial dysmorphisms, developmental delay and mild proximal and
      axial muscle weakness.
    explanation: >-
      Establishes the hearing phenotype as constant across both affected
      individuals and progressive in character.
  - reference: PMID:39384430
    reference_title: "Naa80 is required for actin N-terminal acetylation and normal hearing in zebrafish."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, naa80 KO larvae displayed smaller otoliths, reduced hair cell
      bundles, decreased hair cell viability in the inner ear.
    explanation: >-
      Independent in-vivo evidence that removing the same enzyme damages the
      inner ear. INDIRECT because it is a null allele in a different species.
  downstream:
  - target: High-frequency sensorineural hearing impairment
    description: >-
      The defining feature of the syndrome and the earliest to present.
    causal_link_type: DIRECT
- name: Disordered Actin Dynamics in the Developing Brain
  biological_scale: TISSUE
  description: >-
    Mild global developmental delay with an estimated IQ of 79 at three years,
    periodic hypotonia, gait ataxia, and structural findings on MRI — an enlarged
    right lateral ventricle system, reduced white matter volume and asymmetrical
    subcortical white matter lesions. Behavioural disturbance triggered by loud
    noise or visual stimuli, including self-injury, was reported in the elder
    brother.
  mechanism_confidence: HYPOTHETICAL
  notes: >-
    HYPOTHETICAL: the neurological findings are well documented but the link to
    actin acetylation is an inference from the cellular phenotype and from the
    ACTB/ACTG1 comparison. No brain tissue has been examined, and the zebrafish
    model was not assessed for a neurodevelopmental phenotype beyond gross
    morphology and behaviour.
  evidence:
  - reference: PMID:34805998
    reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI revealed an enlarged right lateral ventricle system, a decreased
      amount of white matter volume and asymmetrical subcortical white matter
      lesions
    explanation: >-
      The structural neuroimaging findings, which make the neurological arm more
      than a developmental-delay label.
  downstream:
  - target: Global developmental delay
    description: Mild delay with an estimated IQ of 79 at age three.
    causal_link_type: DIRECT
  - target: Hypotonia
    description: Periodic hypotonia reported in both brothers.
    causal_link_type: DIRECT
  - target: Gait ataxia
    description: Reported among the additional features of the elder brother.
    causal_link_type: DIRECT
  - target: Reduced cerebral white matter volume
    description: Decreased white matter volume with asymmetrical subcortical lesions on MRI.
    causal_link_type: DIRECT
  - target: Lateral ventricle dilatation
    description: An enlarged right lateral ventricle system on MRI.
    causal_link_type: DIRECT
  - target: Self-injurious behavior
    description: >-
      Auto-mutilation as part of a behavioural disturbance triggered by loud
      noises or visual images. Curated with unknown intermediates because a

discussions:
- discussion_id: gap_auroneurodental_clinical_attribution
  kind: KNOWLEDGE_GAP
  prompt: Which clinical manifestations are attributable to NAA80 in this single family?
  rationale: NAA80 reconstitution rescues the measured fibroblast abnormalities, but the brothers also share PLXNB1 p.Ser911Gly. Additional families and affected-tissue models are needed to distinguish the full NAA80 spectrum from possible additional genetic contributions. Neither the co-variant nor its absence in healthy siblings establishes a modifier mechanism.
  attaches_to:
  - pathophysiology#Biallelic NAA80 Dysfunction
- discussion_id: gap_auroneurodental_tissue_routes
  kind: KNOWLEDGE_GAP
  prompt: How do the measured actin changes contribute to human organ manifestations?
  rationale: Filament abundance, elongation, depolymerization, protrusion formation and migration are distinct results. Human inner-ear, neural, muscle and dental tissue mechanisms were not measured. The fish ear observations support a candidate sensory route, but acetylation and dynamics were not assayed in those F0 hair cells. No single fibroblast readout is established as the mediator of craniofacial, behavioral or brain-imaging abnormalities.
  attaches_to:
  - pathophysiology#Reduced Actin N-Terminal Acetylation
  - pathophysiology#Increased Cell Migration
- discussion_id: gap_auroneurodental_muscle_model_scope
  kind: HUMAN_MODEL_MISMATCH
  prompt: What does grossly normal behavior in stable knockout fish establish about muscle disease?
  rationale: Stable mutant fish lacked most detectable muscle actin acetylation but swam and fed normally under routine conditions. No force or endurance testing was performed. Species, allele severity and assay sensitivity preclude treating this as a stronger disproof of human hypomorphic myopathy, or assigning the human weakness to PLXNB1 by exclusion.
  attaches_to:
  - phenotypes#Proximal muscle weakness
  - phenotypes#Axial muscle weakness
- discussion_id: gap_auroneurodental_activity_threshold
  kind: KNOWLEDGE_GAP
  prompt: Is there a clinically meaningful residual NAA80 activity threshold?
  rationale: The human paper’s estimate of approximately 1–2% residual activity comes from a simplified kinetic model, not a patient enzyme assay. Proposed lethality below that range and asymptomatic status above it are unvalidated; viable zebrafish nulls further limit cross-species extrapolation. Strong-promoter rescue is not a therapeutic dose or clinical safety threshold.
  attaches_to:
  - pathophysiology#Reduced NAA80 Protein Abundance
  - pathophysiology#Reduced Actin N-Terminal Acetylation

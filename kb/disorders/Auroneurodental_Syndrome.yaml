  - target: Chronic constipation
    description: >-
      Enteric smooth-muscle actin dysfunction produces intestinal
      pseudo-obstruction; the NAA80 brothers have only mild constipation, which
      the authors present as the mild end of the same axis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34805998
      reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        While ACTG2 individuals show intestinal pseudo-obstruction, only mild
        constipation is seen in NAA80 individuals.
      explanation: >-
        Places the constipation on the enteric-actin axis while explicitly
        noting how much milder it is. INDIRECT because it is a comparison, not a

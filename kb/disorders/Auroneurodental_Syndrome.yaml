experimental_models:
- name: Patient fibroblasts and peripheral blood mononuclear cells
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism: &id001
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Skin fibroblasts from the elder brother; PBMCs from both brothers
  publication: PMID:34805998
  description: Patient cells were compared with healthy-donor cells; control donor numbers varied by assay and could not be age- and sex-matched. Wild-type NAA80 rescue was performed in the elder brother’s fibroblasts. Technical replicates do not expand the number of patients.
  modeled_mechanisms:
  - target: Reduced Actin N-Terminal Acetylation
    relationship: MEASURES
    fidelity: HIGH
    description: N-terminal acetylation of cytoplasmic beta- and gamma-actin is reduced in the sampled patient cells, with 25–65% unacetylated depending on cell type and actin isoform. Residual acetylation distinguishes this human allele from a complete knockout. Acetylation in human inner ear, brain and muscle was not measured.
    limitations: One patient fibroblast line and two related PBMC donors; these are not inner-ear, neural, muscle or dental tissue.
    evidence:
    - reference: PMID:34805998
      reference_title: NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: In healthy donors, ∼0.5% of beta and gamma-actins were not acetylated. However, for the NAA80 individuals, 25–65% of beta and gamma-actins were not acetylated, depending on the cell type and the type of cytoplasmic actin
      explanation: Isotope-assisted mass spectrometry quantified beta- and gamma-actin acetylation in the elder brother’s fibroblasts and both brothers’ PBMCs.
    readouts:
    - name: Fraction of unacetylated beta- and gamma-actin
      target: Reduced Actin N-Terminal Acetylation
      direction: INCREASED
      interpretation: N-terminal acetylation of cytoplasmic beta- and gamma-actin is reduced in the sampled patient cells, with 25–65% unacetylated depending on cell type and actin isoform. Residual acetylation distinguishes this human allele from a complete knockout. Acetylation in human inner ear, brain and muscle was not measured.
      evidence:
      - reference: PMID:34805998
        reference_title: NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay.
        supports: SUPPORT
        evidence_source: IN_VITRO
        directness: DIRECT
        quote_role: PRIMARY_RESULT
        snippet: In healthy donors, ∼0.5% of beta and gamma-actins were not acetylated. However, for the NAA80 individuals, 25–65% of beta and gamma-actins were not acetylated, depending on the cell type and the type of cytoplasmic actin
        explanation: Isotope-assisted mass spectrometry quantified beta- and gamma-actin acetylation in the elder brother’s fibroblasts and both brothers’ PBMCs.
  - target: Increased Filamentous Actin Content
    relationship: MEASURES
    fidelity: HIGH
    description: Patient fibroblasts and PBMCs have increased phalloidin-stained filamentous actin; wild-type NAA80 expression normalizes the fibroblast signal. HAP1 knockout cells show a lower globular-to-filamentous actin ratio. These abundance measurements do not show an increased instantaneous polymerization rate.
    limitations: One patient fibroblast line and two related PBMC donors; these are not inner-ear, neural, muscle or dental tissue.
    evidence:
    - reference: PMID:34805998
      reference_title: NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: Indeed, NAA80 individual PBMCs and fibroblasts displayed increased phalloidin staining, corresponding with increased levels of polymerized actin
      explanation: Phalloidin fluorescence measures filamentous actin content, not polymerization flux.
    readouts:
    - name: Phalloidin fluorescence
      target: Increased Filamentous Actin Content
      direction: INCREASED
      interpretation: Patient fibroblasts and PBMCs have increased phalloidin-stained filamentous actin; wild-type NAA80 expression normalizes the fibroblast signal. HAP1 knockout cells show a lower globular-to-filamentous actin ratio. These abundance measurements do not show an increased instantaneous polymerization rate.
      evidence:
      - reference: PMID:34805998
        reference_title: NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay.
        supports: SUPPORT
        evidence_source: IN_VITRO
        directness: DIRECT
        quote_role: PRIMARY_RESULT
        snippet: Indeed, NAA80 individual PBMCs and fibroblasts displayed increased phalloidin staining, corresponding with increased levels of polymerized actin
        explanation: Phalloidin fluorescence measures filamentous actin content, not polymerization flux.
  - target: Increased Filopodia Formation
    relationship: MEASURES
    fidelity: HIGH
    description: Fibroblasts from the elder brother have increased filopodia counts that normalize after wild-type NAA80 expression. Knockout HAP1 cells independently show more and longer filopodia-like protrusions. A direct causal route from this cultured-cell phenotype to human neural or craniofacial malformations has not been demonstrated.
    limitations: One patient fibroblast line and two related PBMC donors; these are not inner-ear, neural, muscle or dental tissue.
    evidence:
    - reference: PMID:34805998
      reference_title: NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: In NAA80 individual fibroblasts, increased filopodia counts were observed
      explanation: Filopodia were counted in fibroblasts from the elder brother; this was not a PBMC filopodia assay.
    readouts:
    - name: Fibroblast filopodia count
      target: Increased Filopodia Formation
      direction: INCREASED
      interpretation: Fibroblasts from the elder brother have increased filopodia counts that normalize after wild-type NAA80 expression. Knockout HAP1 cells independently show more and longer filopodia-like protrusions. A direct causal route from this cultured-cell phenotype to human neural or craniofacial malformations has not been demonstrated.
      evidence:

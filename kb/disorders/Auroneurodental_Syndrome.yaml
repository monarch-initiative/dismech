  - target: Disordered Actin Dynamics in Skeletal Muscle
    description: >-
      Sarcomeric contraction depends on actin-myosin networks, and the patients'
      weakness is proximal and axial in distribution.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34805998

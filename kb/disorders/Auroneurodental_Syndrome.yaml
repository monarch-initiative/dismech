  - target: Reduced systolic function
    description: >-
      The other half of the same argument. Cardiac actin is an NAA80 substrate,
      and the authors read the mild ventricular dysfunction as the cardiac
      counterpart of the constipation - a minor ACTC1 dysfunction set beside a
      minor ACTG2 one. They present it explicitly as speculation, and no cardiac

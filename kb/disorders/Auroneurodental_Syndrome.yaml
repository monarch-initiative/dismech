name: Auroneurodental Syndrome
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
description: >-
  An autosomal recessive syndrome combining progressive high-frequency
  sensorineural hearing loss, a distinctive craniofacial and dental appearance,
  mild developmental delay and mild proximal and axial muscle weakness, caused by
  biallelic missense variants in NAA80. NAA80 is the N-terminal acetyltransferase
  that performs the final maturation step on actin, and it is the only enzyme
  known to do so; the homozygous p.Leu130Pro substitution reported in the two
  affected brothers destabilizes the enzyme's catalytic-domain fold, leaving
  severely reduced NAA80 protein and roughly half of cytoplasmic beta- and
  gamma-actin unacetylated. Because unacetylated actin depolymerizes more slowly,
  patient fibroblasts and peripheral blood mononuclear cells accumulate
  filamentous actin and show excess filopodia and increased migration —
  the same cellular phenotype as NAA80-knockout cell lines, and reversible by
  re-expressing wild-type NAA80. The clinical picture overlaps that of patients
  with pathogenic variants in the actin genes themselves, most closely ACTB and
  ACTG1, which is the argument that the syndrome is an actin-dysfunction disorder
  reached through a modifying enzyme rather than through the substrate.
disease_term:
  preferred_term: auroneurodental syndrome
  term:
    id: MONDO:0970998
    label: auroneurodental syndrome
parents:
- hereditary disease
- Neurodevelopmental Disorder
synonyms:
- NAA80-related syndrome
- AURDENS
notes: >-
  Seven points about the shape of this entry.

  First, **the evidence base is one consanguineous Portuguese family with two
  affected brothers, and the entry does not pretend otherwise.** A search of
  PubMed for NAA80 returns no second clinical report; the phenotype records
  therefore carry no `frequency` bands and the prevalence record is
  `CASES_IN_LITERATURE`. What makes the entry worth writing anyway is that the
  mechanism is unusually well measured for a two-patient disorder: the variant's
  structural consequence, the enzyme's solubility, the residual actin
  acetylation, the downstream cytoskeletal phenotype and its rescue by wild-type
  NAA80 were all determined in the same paper, and a zebrafish knockout published
  three years later tested the hearing arm independently.

  Second, **a second homozygous variant segregates in this family and the
  report does not resolve it.** Both brothers are also homozygous for PLXNB1
  p.Ser911Gly, absent in the healthy siblings, and the paper reports this without
  further discussion. Nothing in the cited literature excludes a PLXNB1
  contribution to the phenotype. This is recorded as a knowledge gap rather than
  left out, because it is the main threat to the gene-disease assertion.

  Third, **the tissue-level nodes are deliberately typed HYPOTHETICAL.** What is
  measured is the molecular lesion and the cellular phenotype in fibroblasts and
  PBMCs — cells that are not ear, brain, muscle, or tooth. The step from
  "cytoplasmic actin is under-acetylated everywhere" to "this is why the cochlea,
  the brain, the muscle and the dentition are affected" rests on the phenotypic
  overlap with ACTB and ACTG1 patients, which the authors quantify but do not
  demonstrate mechanistically in the affected tissues.

  Fourth, **the zebrafish model is curated with its failure as well as its
  success.** naa80-null zebrafish reproduce the inner-ear arm well — smaller
  otoliths, fewer hair cells, shorter stereocilia, reduced hair-cell viability and
  a reduced acoustic startle response — and reproduce the loss of actin
  N-terminal acetylation completely rather than partially. They do **not**
  reproduce the muscle weakness: swimming and feeding are normal, and the authors
  name the absence of stress testing as a limitation. That link is curated
  `FAILS_TO_RECAPITULATE` with its own evidence, and the mismatch is recorded as a
  `HUMAN_MODEL_MISMATCH` discussion.

  Fifth, **the disease name is not searchable and a deep-research run went to
  the wrong disease because of it.** "Auroneurodental syndrome" is an OMIM name
  (620830) that appears in no PubMed record — the defining paper's title says
  "NAA80 bi-allelic missense variants result in high-frequency hearing loss,
  muscle weakness and developmental delay" and never uses the syndrome name. A
  Falcon deep-research run against the entry name reported that the label "could not be
  verified", substituted labyrinthine aplasia-microtia-microdontia (LAMM)
  syndrome (FGF3, OMIM 610706) as "the likely intended entity", and produced a
  full report on that disease instead; NAA80 is mentioned zero times. Note that
  `just preflight-dr` returns SKIP rather than FAIL here, because MONDO records
  no causal gene for this term — but its diagnostic output (FGF3=42, report OMIM
  610706 against MONDO's 620830) makes the substitution obvious. Search this
  disease by the gene or by OMIM 620830, never by name.

  Sixth, **two features are recorded but deliberately left out of the
  pathograph.** Episodic swelling of the extremities and vomiting are reported
  in the elder brother in one sentence with hypotonia, feeding difficulties and
  fatigue, all of them "worsened during infections". The three that have a
  mechanistic route are wired; these two are not. The report gives no mechanism
  for them - the etiological workup including clinical chemistry and metabolic
  screening of urine and plasma found no cause - and nothing in the cited
  literature puts episodic infection-associated swelling or vomiting on the
  actin axis. The intercurrent-illness decompensation pattern itself is the
  clinically actionable part and is recorded here: these brothers get worse
  during infections, which is worth knowing even though no cited source
  explains why.

  Seventh, **the model is more severe than the disease and this cuts both ways.**
  The fish are null and lose actin N-terminal acetylation essentially completely,
  whereas the human allele is hypomorphic and leaves roughly half of actin still
  acetylated. A null fish with normal muscle is therefore a stronger negative
  result than a hypomorphic one would be — but it is a negative result in a
  different species with a different degree of loss, which is why the muscle link
  carries `fidelity: LOW`.

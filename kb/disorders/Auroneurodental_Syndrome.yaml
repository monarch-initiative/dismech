      loss of function in muscle cells, as swimming and feeding behavior are
      comparable to that of heterozygous or WT siblings.
    explanation: >-
      A null model of the same enzyme has no muscle phenotype under normal
      conditions, which argues against loss of actin N-terminal acetylation being
      sufficient to cause the muscle weakness.

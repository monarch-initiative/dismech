  description: >-
    Both affected brothers are homozygous for NAA80 c.389T>C, p.(Leu130Pro);
    both parents are heterozygous and unaffected, and the two healthy siblings do
    not carry the variant in the homozygous state. A large run of homozygosity
    and shared parental geographic origin indicate distant consanguinity.
  evidence:
  - reference: PMID:34805998
    reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report two individuals from a single family harbouring a homozygous
      c.389T>C, p.(Leu130Pro) NAA80 genetic variant.
    explanation: States the homozygous state in both affected individuals.
  - reference: PMID:34805998
    reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both parents were heterozygous for this variant.
    explanation: >-
      Unaffected heterozygous parents complete the recessive segregation
      argument.
pathophysiology:
- name: NAA80 p.Leu130Pro Destabilizes the Acetyltransferase Fold
  biological_scale: MOLECULAR
  description: >-
    Leucine 130 lies at the end of beta-strand 1 of the central beta-sheet of the
    NAA80 catalytic domain, with its side chain in a hydrophobic pocket and its
    backbone participating in the sheet's hydrogen-bond network. Substituting
    proline removes the backbone amide hydrogen and imposes the ring's steric
    demands, which was predicted to destabilize the local fold and was then
    confirmed: recombinant mutant protein is predominantly insoluble where
    wild-type protein is essentially soluble, and NAA80 protein is severely
    reduced in patient fibroblasts.
  genes:
  - preferred_term: NAA80
    term:
      id: hgnc:30252
      label: NAA80
  genetic_context:
    gene:
      preferred_term: NAA80
      term:
        id: hgnc:30252
        label: NAA80
    allele_type: MISSENSE
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Curated as a partial rather than complete loss of function on the authors'
      own evidence: driving the mutant cDNA from a weak promoter gives only
      partial restoration of actin acetylation while stronger promoters reach
      near-maximal acetylation, so the mutant enzyme retains residual activity and
      the defect is one of protein availability.
  molecular_functions:
  - preferred_term: N-terminal protein amino-acid acetyltransferase activity
    term:
      id: GO:0004596
      label: protein-N-terminal amino-acid acetyltransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:34805998
    reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      These effects are expected to weaken and disturb the local fold of the
      protein.
    explanation: >-
      The structural prediction from inspection of the NAA80-actin-profilin
      crystal structure, which is what the wet-lab work then tested.
  - reference: PMID:34805998
    reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Mutant protein was predominantly insoluble, contrasting with wild-type
      protein, which was essentially soluble, with only a very small proportion
      in the sediment
    explanation: >-
      Confirms the folding defect experimentally, in recombinant protein where
      solubility is the direct readout of folding.
  - reference: PMID:34805998
    reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Based on the molecular structure, we predicted and confirmed the NAA80
      c.389T>C, p.(Leu130Pro) variant to result in protein destabilization,
      causing severely decreased NAA80 protein availability.
    explanation: >-
      The authors' summary of the variant's consequence, stated as protein
      availability rather than catalytic impairment.
  downstream:
  - target: Reduced N-Terminal Acetylation of Cytoplasmic Actin
    description: >-
      Less enzyme means less of the modification it performs. NAA80 is the enzyme
      that N-terminally acetylates actin, so its scarcity is felt directly on the
      actin N-terminus.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29581253
      reference_title: "NAA80 is actin's N-terminal acetyltransferase and regulates cytoskeleton assembly and cell motility."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we reveal that NAA80, a suggested NAT enzyme whose substrate
        specificity had not been characterized, is Nt-acetylating actin.
      explanation: >-
        Establishes the enzyme-substrate relationship that makes reduced NAA80
        availability a direct cause of reduced actin acetylation.
- name: Reduced N-Terminal Acetylation of Cytoplasmic Actin
  biological_scale: MOLECULAR
  description: >-
    Mass spectrometry of patient fibroblasts and peripheral blood mononuclear
    cells shows 25 to 65 percent of beta- and gamma-actin unacetylated, against
    about 0.5 percent in healthy donors — a roughly 50 percent loss of the
    modification rather than its abolition. This partial loss is what
    distinguishes the human disease from the complete loss achievable in
    knockout cells and knockout fish.
  biological_processes:
  - preferred_term: N-terminal acetylation of actin
    term:
      id: GO:0006474
      label: N-terminal protein amino acid acetylation
    modifier: DECREASED
  evidence:
  - reference: PMID:34805998
    reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In healthy donors, ∼0.5% of beta and gamma-actins were not acetylated.
      However, for the NAA80 individuals, 25–65% of beta and gamma-actins were
      not acetylated, depending on the cell type and the type of cytoplasmic
      actin
    explanation: >-
      Quantifies the residual and lost acetylation in the patients' own cells by
      mass spectrometry, which is the measurement the whole mechanism rests on.
  - reference: PMID:34805998
    reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Thus, ∼50% actin acetylation agrees with extremely low, but not absent,
      residual NAA80 activity, estimated in the range of 1–2% of normal activity.
    explanation: >-
      Converts the measured acetylation deficit into an estimate of residual
      enzyme activity, roughly 1 to 2 percent of normal. The authors use this
      window to explain why the syndrome is so rare: they argue that below it
      the loss would probably be lethal and above it probably asymptomatic. It
      is an inference from a simplified kinetic model rather than an activity
      assay, hence COMPUTATIONAL and INDIRECT.
  downstream:
  - target: Increased Filamentous Actin with Excess Filopodia and Migration
    description: >-
      Unacetylated actin depolymerizes more slowly, so the filament-to-monomer
      balance shifts toward filaments and the structures built from them
      proliferate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29581253
      reference_title: "NAA80 is actin's N-terminal acetyltransferase and regulates cytoskeleton assembly and cell motility."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The absence of Nt-acetylation leads to significant differences in the
        rates of actin filament depolymerization and elongation, including
        elongation driven by formins, whereas filament nucleation by the Arp2/3
        complex is mostly unaffected.
      explanation: >-
        Supplies the biophysical step — altered filament turnover kinetics —
        between the missing acetyl group and the cellular phenotype.
- name: Increased Filamentous Actin with Excess Filopodia and Migration
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts and PBMCs show increased phalloidin staining, more
    filopodia per cell and increased chemotactic migration in a Boyden chamber —
    the same triad reported for NAA80-knockout cell lines. Re-expressing
    wild-type NAA80 from a weak promoter returns phalloidin intensity, filopodia
    counts and migration to control levels, which is what makes the link causal
    rather than correlative.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: actin filament polymerization
    term:
      id: GO:0030041
      label: actin filament polymerization
    modifier: INCREASED
  - preferred_term: cell migration
    term:
      id: GO:0016477
      label: cell migration
    modifier: INCREASED
  evidence:
  - reference: PMID:34805998
    reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      NAA80 individual derived fibroblasts and peripheral blood mononuclear cells
      showed increased migration, increased filopodia counts and increased levels
      of polymerized actin, in agreement with previous observations in NAA80
      knock-out cells.
    explanation: >-
      The cellular phenotype in patient-derived cells, and its concordance with
      the engineered knockout.
  - reference: PMID:34805998
    reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In fibroblasts, expression of NAA80 wild-type with the SV40 promoter
      protein lowered migration levels to the level observed in healthy controls
    explanation: >-
      Rescue by the wild-type enzyme, which excludes an unrelated cause of the
      migration phenotype in these cells.
  - reference: PMID:29581253
    reference_title: "NAA80 is actin's N-terminal acetyltransferase and regulates cytoskeleton assembly and cell motility."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      NAA80-knockout cells display severely altered cytoskeletal organization,
      including an increase in the ratio of filamentous to globular actin,
      increased filopodia and lamellipodia formation, and accelerated cell
      motility.
    explanation: >-
      The engineered-knockout counterpart of the patient phenotype. INDIRECT
      because it is a complete loss of NAA80 in a cell line, not the patients'
      hypomorphic allele.
  downstream:
  - target: Disordered Actin Dynamics in the Inner Ear
    description: >-
      Hair-cell stereocilia are actin-cored structures whose length and bundle
      organization depend on regulated filament turnover.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34805998
      reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Furthermore, the significant clinical overlap between NAA80 individuals
        and individuals with pathogenic variants in several actin subtypes
        reflects the general importance of controlled actin dynamics for the
        inner ear, brain and muscle.
      explanation: >-
        The phenotype-overlap argument that connects the cellular actin defect to
        the affected organs. INDIRECT because the inference runs through a
        comparison with a different set of patients.
  - target: Disordered Actin Dynamics in the Developing Brain
    description: >-
      Filopodial dynamics govern neurite outgrowth and synaptogenesis, so a shift
      toward stable filaments and excess filopodia is a plausible route to the
      neurodevelopmental features.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34805998
      reference_title: "NAA80 bi-allelic missense variants result in high-frequency hearing loss, muscle weakness and developmental delay."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our work suggests a crucial role for NAA80-mediated actin dynamics in
        neuronal health, muscle health and hearing.
      explanation: >-
        The authors' own statement of the organ-level claim. INDIRECT because it

animal_models:
- species: Zebrafish
  genotype: naa80 knockout (stable CRISPR mutant lines and transient F0 crispants)
  category: Genetic
  description: >-
    The first and so far only animal model of NAA80 loss. Stable naa80-null lines
    lose actin N-terminal acetylation essentially completely in skeletal and
    cardiac muscle, yet develop, swim and feed normally. F0 crispants show
    smaller otoliths, fewer hair-cell bundles in the lateral crista, shorter
    stereocilia, reduced hair-cell viability and a reduced acoustic startle
    response.
  genes:
  - preferred_term: NAA80
    term:
      id: hgnc:30252
      label: NAA80
  publication: PMID:39384430
  notes: >-
    Note the severity mismatch in both directions. The fish are null while the
    human allele is hypomorphic, so a fish phenotype is expected to be at least
    as severe as the human one — which makes the absent muscle phenotype a
    stronger negative than it first appears, and the present ear phenotype less
    surprising.
  modeled_mechanisms:
  - target: Reduced N-Terminal Acetylation of Cytoplasmic Actin
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Naa80 is the enzyme responsible for actin N-terminal acetylation in
      zebrafish as in humans, and knockouts show little to no detectable
      acetylated actin.
    limitations: >-
      The knockout abolishes the modification, whereas the human allele removes
      roughly half of it, so the model sits at a more extreme point on the same
      axis.
    readouts:
    - name: Nt-acetylated actin peptides in skeletal and cardiac muscle
      target: Reduced N-Terminal Acetylation of Cytoplasmic Actin
      direction: ABOLISHED
      interpretation: >-
        Mass spectrometry finds little to no Nt-acetylated actin in either
        knockout line.
      evidence:
      - reference: PMID:39384430
        reference_title: "Naa80 is required for actin N-terminal acetylation and normal hearing in zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We developed a zebrafish naa80 knockout model and demonstrated that
          Naa80 acetylates both muscle and non-muscle actins in vivo.
        explanation: >-
          Establishes the enzyme-substrate relationship in vivo, which is what
          the readout measures.
    evidence:
    - reference: PMID:39384430
      reference_title: "Naa80 is required for actin N-terminal acetylation and normal hearing in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We developed a zebrafish naa80 knockout model and demonstrated that
        Naa80 acetylates both muscle and non-muscle actins in vivo.
      explanation: Supports the model as informative for the acetylation node.
  - target: Disordered Actin Dynamics in the Inner Ear
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model reproduces the inner-ear arm of the human disease at both
      structural and functional level, and is the only in-vivo test of it.
    limitations: >-
      Zebrafish hair cells sit in otolith organs, cristae and lateral-line
      neuromasts rather than in a cochlea, so frequency-specific hearing loss —
      the defining feature in the patients — has no counterpart in the model. The
      acoustic startle response is a behavioural proxy, not an audiogram.
    readouts:
    - name: Otolith size
      target: Disordered Actin Dynamics in the Inner Ear
      direction: DECREASED
      interpretation: Smaller otoliths in knockouts than in Cas9-injected controls.
      evidence:
      - reference: PMID:39384430
        reference_title: "Naa80 is required for actin N-terminal acetylation and normal hearing in zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          However, we observed a reduction in otolith size compared with controls
          following Cas9 protein injection
        explanation: The structural measurement behind this readout.
    - name: Hair cell number and stereocilia length in the lateral crista
      target: Disordered Actin Dynamics in the Inner Ear
      direction: DECREASED
      interpretation: >-
        Fewer hair cells per crista and shorter stereocilia — the actin-cored
        structure whose length regulation the mechanism predicts should fail.
      evidence:
      - reference: PMID:39384430
        reference_title: "Naa80 is required for actin N-terminal acetylation and normal hearing in zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          both number of hair cells per crista as well as stereocilia length
          reduced
        explanation: The histological measurement behind this readout.
    - name: Acoustic startle response
      target: Disordered Actin Dynamics in the Inner Ear
      direction: DECREASED
      interpretation: >-
        The functional counterpart of the structural findings, and the model's
        closest analogue to the patients' hearing loss.
      evidence:
      - reference: PMID:39384430
        reference_title: "Naa80 is required for actin N-terminal acetylation and normal hearing in zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Moreover, the KOs demonstrated a reduced acoustic startle response
          compared with controls (Fig 6I), suggesting a hearing impairment.
        explanation: The behavioural measurement behind this readout.
    - name: Hair cell viability by Yo-Pro-1 uptake
      target: Disordered Actin Dynamics in the Inner Ear
      direction: DECREASED
      interpretation: Reduced hair-cell viability in lateral-line neuromasts.
      evidence:
      - reference: PMID:39384430
        reference_title: "Naa80 is required for actin N-terminal acetylation and normal hearing in zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Reduced hair cell viability in KOs was also observed through the
          Yo-Pro-1 uptake experiment
        explanation: The viability measurement behind this readout.
    evidence:
    - reference: PMID:39384430
      reference_title: "Naa80 is required for actin N-terminal acetylation and normal hearing in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Whereas zebrafish lacking naa80 showed no obvious muscle defects or
        abnormalities, we observed abnormal inner ear development, small
        otoliths, and impaired response to sound.
      explanation: >-
        Supports the model as informative for the inner-ear node, and in the same
        sentence marks the muscle arm as not reproduced.
  - target: Disordered Actin Dynamics in Skeletal Muscle
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Complete loss of actin N-terminal acetylation produces no muscle phenotype
      in this model: development, morphology, swimming and feeding are normal.
    limitations: >-
      The authors name the missing test themselves — no stress testing such as a
      swim-mill experiment was performed, so an endurance deficit could have been
      missed. Zebrafish skeletal muscle also differs from human in fibre-type
      composition and loading, and the human phenotype is mild, so a small effect
      might fall below detection in either species. The negative result therefore
      constrains the human mechanism without excluding it.
    readouts:
    - name: Swimming and feeding behaviour
      target: Disordered Actin Dynamics in Skeletal Muscle
      direction: UNCHANGED
      interpretation: >-
        No detectable muscle functional deficit in null animals under normal
        conditions. A real negative, not an unmeasured one.
      evidence:
      - reference: PMID:39384430
        reference_title: "Naa80 is required for actin N-terminal acetylation and normal hearing in zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Our results indicate that under normal conditions there is no
          significant loss of function in muscle cells, as swimming and feeding
          behavior are comparable to that of heterozygous or WT siblings.
        explanation: The behavioural measurement behind this negative readout.
    evidence:
    - reference: PMID:39384430
      reference_title: "Naa80 is required for actin N-terminal acetylation and normal hearing in zebrafish."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Zebrafish lacking actin N-terminal acetylation exhibited normal
        development, morphology, and behavior.
      explanation: >-
        A null model with no developmental, morphological or behavioural
        phenotype argues against loss of actin N-terminal acetylation being
        sufficient for the muscle weakness seen in the patients.
discussions:
- discussion_id: gap_aurondental_plxnb1_confound
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the co-segregating homozygous PLXNB1 p.Ser911Gly variant contribute to
    this phenotype?
  rationale: >-
    Both affected brothers are homozygous for PLXNB1 p.Ser911Gly as well as for
    the NAA80 variant, and the healthy siblings carry neither. The report states
    this and does not discuss it further, so nothing in the cited literature
    weighs the two candidates against each other. PLXNB1 encodes a semaphorin
    receptor with its own roles in cytoskeletal regulation and axon guidance,
    which makes it a plausible rather than an implausible contributor to a
    syndrome with neurodevelopmental and dysmorphic features. With a single
    family, the functional work on NAA80 is what carries the gene-disease
    assertion; a second unrelated family, or functional work on the PLXNB1
    allele, would settle it.
  attaches_to:
  - genetic#NAA80
  - disease#Auroneurodental Syndrome
- discussion_id: gap_aurondental_muscle_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why do naa80-null zebrafish have normal muscle function when the patients
    have proximal and axial weakness?
  rationale: >-
    This is a mismatch between an existing model result and the human phenotype,
    not an absence of evidence. The zebrafish knockout abolishes actin N-terminal
    acetylation completely — a more extreme lesion than the patients' roughly 50
    percent loss — yet swims and feeds normally, and the authors conclude that
    Nt-acetylation may not be necessary for functional actin networks under normal
    conditions in vivo. Three readings are open and the cited literature does not
    choose between them: the human weakness may not be caused by the acetylation
    defect at all (which would return attention to the co-segregating PLXNB1
    allele); the fish may have a deficit that only appears under load, which the
    authors name as an untested limitation; or zebrafish muscle may tolerate
    unacetylated actin in a way human muscle does not. The
    `Disordered Actin Dynamics in Skeletal Muscle` node is curated HYPOTHETICAL
    for this reason, and its model link is `FAILS_TO_RECAPITULATE`.
  attaches_to:
  - pathophysiology#Disordered Actin Dynamics in Skeletal Muscle
  - phenotypes#Proximal muscle weakness
  - phenotypes#Axial muscle weakness
  proposed_experiments:
  - experiment_id: exp_aurondental_zebrafish_swim_stress
    name: Endurance testing of naa80-null zebrafish
    description: >-
      Swim-mill or forced-swimming endurance testing of naa80-null adults against
      heterozygous and wild-type siblings, with sarcomere ultrastructure and
      fibre-type composition assessed afterward — the experiment the authors
      identify as missing from their own study.
    would_support:
    - pathophysiology#Disordered Actin Dynamics in Skeletal Muscle
    supporting_outcome:
    - >-
      Null animals fatigue earlier or show sarcomeric disorganization under load,
      showing that the muscle requirement for actin N-terminal acetylation is
      conditional rather than absent.
    would_refute:
    - pathophysiology#Disordered Actin Dynamics in Skeletal Muscle
    refuting_outcome:
    - >-
      Null animals match siblings on endurance and ultrastructure under load,
      strengthening the case that the patients' weakness has another cause.
- discussion_id: gap_aurondental_affected_tissue_evidence
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is actin N-terminal acetylation reduced, and the cytoskeleton altered, in the
    tissues that are actually affected?
  rationale: >-
    Every molecular measurement in this disease was made in fibroblasts, PBMCs, or
    engineered cell lines. The three organ-level nodes are typed HYPOTHETICAL
    because the step from "cytoplasmic actin is under-acetylated in a fibroblast"
    to "this is why the cochlea, brain and dentition are affected" rests on
    phenotypic resemblance to ACTB and ACTG1 patients rather than on any
    measurement in those tissues. Patient-derived induced pluripotent stem cells
    differentiated into inner-ear organoids or cortical neurons would put the
    acetylation and F-actin measurements in a relevant cell type without needing
    tissue from two individuals.
  attaches_to:
  - pathophysiology#Disordered Actin Dynamics in the Inner Ear
  - pathophysiology#Disordered Actin Dynamics in the Developing Brain
  - pathophysiology#Dysmorphogenesis of Craniofacial, Dental and Digital Structures

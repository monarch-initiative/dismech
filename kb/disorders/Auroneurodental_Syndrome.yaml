    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Both fibroblasts and PBMCs of NAA80 individuals showed increased movement in response to chemotactic stimuli
    explanation: Boyden chamber assays measured migration in patient-derived cells.

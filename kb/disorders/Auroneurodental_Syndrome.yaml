- name: Slower Actin Filament Elongation
  biological_scale: MOLECULAR
  description: Nonacetylated beta/gamma-actin purified from HAP1 knockout cells elongates more slowly in seeded barbed-end assays. Total unseeded polymerization, Arp2/3-driven assembly and mDia2-mediated assembly did not show the same difference; mDia1 and PFN1/PFN2 context matter. This is an in-vitro biochemical result, not a measured patient-tissue growth rate.
  evidence:
  - reference: PMID:29581253
    reference_title: NAA80 is actin's N-terminal acetyltransferase and regulates cytoskeleton assembly and cell motility.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The barbed-end elongation rate of β/γ-actin filament seeds is ∼2.2-fold faster for Ac-actin (blue) than for non–Ac-actin (red).
    explanation: Purified acetylated versus nonacetylated beta/gamma-actin differed in seeded barbed-end elongation.
- name: Slower Actin Filament Depolymerization
  biological_scale: MOLECULAR
  description: Purified nonacetylated actin filaments depolymerize more slowly than acetylated filaments. Both elongation and depolymerization change, so this result alone does not establish the net filament content or clinical effect in a tissue.
  evidence:
  - reference: PMID:29581253
    reference_title: NAA80 is actin's N-terminal acetyltransferase and regulates cytoskeleton assembly and cell motility.
    supports: SUPPORT
    evidence_source: IN_VITRO

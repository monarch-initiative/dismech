histopathology:
- name: Biphasic Melanin-Producing Epithelioid and Neurogenic Cell Pattern
  finding_term:
    preferred_term: biphasic population of epithelioid melanin-producing cells and primitive neurogenic cells
    term:
      id: NCIT:C35907
      label: Biphasic Pattern
  description: >-
    A biphasic population of epithelioid melanin-producing cells and primitive
    neurogenic cells in a fibrocollagenous stroma. It is described as the
    hallmark microscopic feature of MNTI, and together with the usual
    immunohistochemical profile it is considered sufficient for the diagnosis in
    the appropriate clinical context. Its small round blue cell morphology can
    lead to misdiagnosis of a malignant neoplasm, and in small biopsies these
    findings can raise a broad differential diagnosis.
  diagnostic: true
  evidence:
  - reference: PMID:30407852
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Melanotic neuroectodermal tumor of infancy, albeit rare and generally regarded as benign, is an important tumor to recognize because of its rapid growth, potential for local recurrence, and small round blue cell morphology, which can lead to misdiagnosis of a malignant neoplasm. ... Histologically, it is composed of a biphasic population of cells, consisting of epithelioid melanin-producing cells and primitive neurogenic cells in a fibrocollagenous stroma. These microscopic findings, especially in small biopsies, can lead to a broad differential diagnosis that includes malignant small round blue cell tumors and malignant melanoma."
    explanation: >-
      This 2018 review of the MNTI literature and University of Michigan cases
      states the histology directly: the tumour is composed of a biphasic
      population of epithelioid melanin-producing cells and primitive neurogenic
      cells in a fibrocollagenous stroma. Its opening sentence adds that the
      small round blue cell morphology can lead to misdiagnosis of a malignant
      neoplasm, and names the tumour that 'it' refers to in the histology
      sentence. The last sentence qualifies the pattern's diagnostic value:
      especially in small biopsies, these findings can raise a broad
      differential diagnosis that includes malignant small round blue cell
      tumours and malignant melanoma. The opening sentence also calls MNTI
      generally regarded as benign; that is the 2018 view and is not relied on
      here, because a 2025 case series (PMID:40278957) reports that the 5th
      edition of the WHO classification of paediatric tumours considers MNTI of
      the head and neck a malignant entity. The ellipsis skips the review's
      objective, data sources and a sentence on tumour sites.
  - reference: PMID:38681460
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy of Jaws: A Case Report and Review of Literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The hallmark microscopic feature of MNTI is the presence of a biphasic population of cells consisting of larger epithelioid melanogenic cells and smaller primitive neuroblast-like cells dispersed in dense fibrocollagenous stroma."
    explanation: >-
      In the Discussion of their case report and review of jaw MNTI, the
      authors call the biphasic population of larger epithelioid melanogenic
      cells and smaller primitive neuroblast-like cells in a dense
      fibrocollagenous stroma the hallmark microscopic feature of MNTI. This
      supports the pattern as the characteristic finding on which the diagnosis
      rests. The sentence is the review's summary of the histology, not a
      measurement, and the same paragraph adds that immunohistochemistry helps
      to distinguish MNTI from lesions with similar histology.
  - reference: PMID:40278957
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: Clinicopathological Evaluation of a 10-Year Consecutive Case Series from a Tertiary Cancer Center."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Typical biphasic morphology and usual immunohistochemistry profile (AE1/AE3 and HMB45 positivity in larger epithelioid melanin-containing cells; synaptophysin positivity in smaller neuroblast-like cells) are sufficient for the diagnosis of MNTI in a given clinical context."
    explanation: >-
      In the Discussion of their single-centre series of 11 head and neck MNTIs,
      Sharma et al. state that the typical biphasic morphology, together with
      the usual immunohistochemical profile (AE1/AE3 and HMB45 in the larger
      epithelioid cells, synaptophysin in the smaller neuroblast-like cells), is
      sufficient for the diagnosis of MNTI in a given clinical context. The
      sufficiency therefore rests on the morphology together with
      immunohistochemistry and the clinical setting, not on the morphology
      alone. The statement carries no citation and is the authors' conclusion
      from their own series, in which the diagnosis was established from the
      morphology with adjunct immunohistochemistry.
phenotypes:
- category: Craniofacial
  name: Rapidly Growing Jaw Mass
  description: >-
    The tumour may present as a rapidly expanding, lobulated, non-ulcerated and
    painless mass, most often of the maxilla. In a 472-case systematic review,
    which Xia et al. (2021) describe as the largest, 62.2% of tumours involved
    the maxilla, 15.6% the skull and 7.8% the mandible.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: rapidly growing jaw mass
    term:
      id: HP:0030792
      label: Jaw neoplasm
  evidence:
  - reference: PMID:34094962
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: A Clinicopathological and BRAF V600E Mutation Study of 11 Cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The largest systematic review of 472 cases showed that 62.2% cases involved maxilla, followed by the skull (15.6%), and mandible (7.8%)."
    explanation: >-
      In their Introduction, Xia et al. restate the tumour-site distribution
      reported by what they call the largest systematic review of MNTI (472
      cases): maxilla 62.2%, skull 15.6%, mandible 7.8%. These figures are not
      from their own 11-case series, so the quote is BACKGROUND. The sentence
      carries no citation, but the 472-case count matches Rachidi et al. 2015
      (PMID:25936939), which is in Xia et al.'s reference list and whose
      abstract gives no site percentages, which is why the figures are quoted
      from this restatement. They are site shares of all MNTIs, so they set how
      often the tumour presents as a jaw mass: the maxilla alone (62.2%) is
      inside the FREQUENT band (30-79%), and adding the mandible (7.8%) keeps
      the jaw share inside that band. The quote says nothing about growth rate.
  - reference: PMID:34094962
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: A Clinicopathological and BRAF V600E Mutation Study of 11 Cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, MNTI may appear as a rapid expansive, lobulated, but non-ulcerated and painless mass."
    explanation: >-
      Xia et al. state that MNTI may appear clinically as a rapidly expanding,
      lobulated, non-ulcerated and painless mass. The sentence opens the
      clinical paragraph of their Discussion and carries no citation of its
      own, and the sentence after it cites a prior report. It is not a finding
      from their 11 cases, whose clinical table records none of these features.
      Because the source hedges with 'may appear', it supports these as
      features MNTI may show at presentation, not invariant ones. It names no
      anatomical site, so it supports what the mass is like, not that it is in
      the jaw.
- category: Craniofacial
  name: Bluish-Black Pigmented Swelling
  description: >-
    A review of jaw MNTI states that, because of the tumour's melanin content,
    the lesion appears clinically as a bluish-black swelling, usually covered
    by the oral mucosa, and regards a maxillary swelling with a bluish-black
    hue and a rapid course in an infant as a pathognomonic clinical sign of
    oral MNTI. In the case the authors present, the swelling looked like a
    coin-sized, marble-like elevation with blanching of the overlying mucosa
    and a central melanaceous hue, and that hue, with the patient's age and the
    site, was the basis for the provisional diagnosis.
  phenotype_term:
    preferred_term: bluish-black pigmented swelling
  notes: >-
    No HPO term is bound, because none describes a pigmented swelling or mass.
    Abnormal pigmentation of the oral mucosa (HP:0100669) and its child
    Intra-oral hyperpigmentation (HP:0010284) describe pigment in the mucosa
    itself, whereas the source describes the tumour's own melanin in a swelling
    covered by the mucosa, which in the authors' case was blanched over it. The
    other descendants of HP:0100669 are mucosal patterns and named lesions:
    reticulate pigmentation of oral mucosa, oral melanotic macule, oral
    melanoacanthoma, white oral mucosal macule and tongue hyperpigmentation. An
    OLS search of HPO for "jaw swelling" returned Jaw swelling (HP:0030793) and
    Jaw mass (HP:6000307), which describe only the swelling, already recorded
    by the Rapidly Growing Jaw Mass phenotype, and not its colour; "oral mass"
    returned Fetal oral mass and Oral mucosal papule. Searches for "pigmented
    mass" (which returned only Iris flocculi), "pigmented lesion", "pigmented
    tumor", "melanotic", "bluish" and "blue-black" returned terms for skin and
    eye findings, cyanosis, melanomas and other named tumours and lesions,
    including the oral lesions above, and none for a pigmented swelling or mass
    of the jaw or mouth. No frequency band is set: the review
    describes the appearance without saying how often it is seen.
  evidence:

    A systematic review covered the 472 cases reported from 1918 through 2013.
    This is a count of published cases, not a population rate.
  evidence:
  - reference: PMID:25936939
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: A Systematic Review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors performed a systematic review of the 472 reported cases from 1918 through 2013 and provided a comprehensive update on this rare entity that can have devastating effects on young patients."
    explanation: >-
      The review calls MNTI 'this rare entity' and states that its authors
      performed a systematic review of the 472 reported cases from 1918 through
      2013. The 472 is a count of cases published in the literature over that
      period, not a population rate: the abstract gives no prevalence, incidence
      or denominator, so it supports a CASES_IN_LITERATURE record and no
      rate_per_100000 can be derived from it. prevalence_class RARE follows the
      source's own word 'rare' and is not a numeric estimate.
progression:
- phase: Local recurrence after treatment
  notes: >-
    In a review pooling 250 jaw cases (249 published and one new), recurrence
    was significantly associated with age and with treatment method. In that
    cohort the recurrence rate was 15.2%, with recurrences 15 days to 20 months
    after treatment; the malignancy rate was 2% and mortality 2.4%, which are
    separate outcomes rather than recurrences. Most included case reports had
    short follow-up, so recurrence may be under-counted. The review gives
    incomplete tumour excision, multifocal tumour and tumour seeding during
    surgery as the reasons stated in the literature for recurrence. Malignancy
    estimates differ by series and by site: the review's 2% is lower than an
    earlier estimate of 6.97% that it mentions, and it states that jaw MNTI
    has lower metastatic potential than MNTI of the skull and brain, so these
    jaw-only figures are not rates for MNTI at those sites. The review
    describes chemotherapy as used for inoperable, metastatic or progressing
    tumours and radiotherapy for malignant and metastatic ones, so the
    association with treatment method may reflect which tumours received those
    treatments rather than a treatment effect.
  evidence:
  - reference: PMID:38681460
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy of Jaws: A Case Report and Review of Literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Literature review of 250 cases of MNTI including the current case report was conducted considering study parameters such as age and gender of the patient, location of the lesion, levels of vanillylmandelic acid, management options, and outcome after treatment. ... Recurrence of the lesion shows a significant association with age of the individual and treatment method employed. This study reports a 2.4% mortality rate, 2% malignancy rate, and a recurrence rate of 15.2%, with recurrence times ranging from 15 days to 20 months."
    explanation: >-
      The abstract of this pooled literature review states the claim directly.
      The review pooled 250 histologically proven MNTI cases of the jaw: 249
      from 178 published articles plus the authors' own case. It excluded MNTI
      at any other site, so these are jaw-only figures, not rates for the
      disease as a whole. Recurrence was significantly associated with age and
      with treatment method, each tested separately by chi-square. In this
      cohort the recurrence rate was 15.2% (recurrences 15 days to 20 months
      after treatment), the malignancy rate 2% and mortality 2.4%. The authors
      warn that most included case reports had short follow-up and recurrence
      might have come later, so 15.2% may under-count recurrence; the paper
      also cites 11.3% from the latest systematic review of jaw MNTI. In the
      full text, infants aged zero to two months recurred in 24.8% of cases
      against 9.7% at three to six months. The treatment association should
      not be read as a treatment effect: recurrence was 12.4% after surgery
      alone against 37.5% after surgery plus chemotherapy and 66.7% after
      surgery, chemotherapy and radiotherapy, but the paper describes
      chemotherapy as used for inoperable or metastatic tumours and for disease
      that progresses after surgery, and radiotherapy for malignant and
      metastatic tumours, and its tests do not adjust for this. The ellipsis
      skips one sentence on the anterior maxilla and infants under six months.
  - reference: PMID:38681460
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy of Jaws: A Case Report and Review of Literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Reasons stated for recurrence are incomplete tumor excision, multifocal tumor, or tumor seeding during surgery"
    explanation: >-
      In its Discussion the jaw review gives, citing an earlier review,
      incomplete tumour excision, multifocal tumour and tumour seeding during
      surgery as the reasons stated for recurrence. These are reasons reported
      in the literature, not factors the review tested: its own tests covered
      site, age, sex, treatment method, VMA level and malignancy.
  - reference: PMID:38681460
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy of Jaws: A Case Report and Review of Literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Even though a benign disease, it was mentioned that MNTI has malignant potential of 6.97%, which is higher compared to our study, which shows 2%. ... Overall metastatic potential and distant metastasis of jaw MNTI are less compared to MNTI of the skull and brain."
    explanation: >-
      In its Discussion the jaw review contrasts its own 2% malignancy rate
      with a malignant potential of 6.97% mentioned earlier in the literature,
      and states that the overall metastatic potential and distant metastasis
      of jaw MNTI are lower than those of MNTI of the skull and brain. So the
      malignancy figure depends on the series, and the jaw-only figures in this
      record would understate metastatic risk if applied to those sites. The
      sentence carries no citation for the 6.97%, and the review gives no
      figures for skull or brain MNTI. The ellipsis skips one sentence on
      cervical lymph node metastasis in malignant variants.
pathophysiology:
- name: Biphasic Melanocyte-Like and Neuroblast-Like Tumor Cell Population
  description: >-
    The tumour cells form two populations: large polygonal epithelioid cells
    that resemble melanocytes and produce melanin, which they contain in
    variable amounts, and smaller neuroblast-like round cells. The tumour's
    origin is attributed to the neural crest, but that origin is also described
    as putative and the histogenesis of MNTI as still unresolved.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: melanin-containing epithelioid tumor cell
    term:
      id: CL:0000147
      label: pigment cell
  - preferred_term: neuroblast-like small round tumor cell
  biological_processes:
  - preferred_term: melanin production by the large epithelioid tumor cells
    term:
      id: GO:0042438
      label: melanin biosynthetic process
  notes: >-
    No node is marked as the origin node (genetic_context), because the cited
    sources describe no recurrent initiating lesion (see the entry notes). The
    large cells are bound to pigment cell rather than melanocyte, because the
    sources describe them only as epithelioid cells that resemble melanocytes
    and produce or contain melanin. Their melanin production is bound to
    melanin biosynthetic process rather than its child melanin biosynthetic
    process from tyrosine (GO:0006583), because the sources say only that the
    cells produce melanin, not by which pathway. No modifier is set, because
    the sources do not compare the amount of melanin with that made by normal
    melanocytes. The small cells are described only as neuroblast-like,
    and no CL term is bound for them. An OLS search of CL for "neuroblast"
    returned five neuroblast classes (neuroblast (sensu Vertebrata), neural
    crest derived neuroblast, cycling neuroblast (sensu Vertebrata), neuroblast
    (sensu Nematoda and Protostomia) and forebrain neuroblast) and three other
    cell classes (ependymal cell, ganglion mother cell and neural crest cell); a
    search for "neuroblast-like" returned only ependymal cell. A neuroblast
    class would assert that the cells are neuroblasts, which the sources do not
    establish: they describe the cells only by their resemblance to
    neuroblasts, and the cells were PHOX2B-negative in the series cited under
    the neuroblastoma differential diagnosis.
  evidence:
  - reference: PMID:16876064
    reference_title: "Melanotic neuroectodermal tumor of infancy: systematic review of the literature and presentation of a case."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The origin of the tumor is the neural crest. ... Microscopically, large polygonal epithelioid cells resembling melanocytes, with variable deposits of melanin, and smaller neuroblast-like round cells characterize MNTI."
    explanation: >-
      A systematic literature review of published MNTI cases, which also
      presents one original case, states that the tumour's origin is the neural
      crest. It also states that MNTI is characterised microscopically by large
      polygonal epithelioid cells resembling melanocytes, with variable melanin
      deposits, and smaller neuroblast-like round cells. This supports the
      node's two cell populations and the attribution of the tumour's origin to
      the neural crest. The quote places the melanin in the large cells, so it
      supports binding them to pigment cell; they are only said to resemble
      melanocytes, which is why they are not bound to melanocyte. The small
      cells are described only as neuroblast-like, so this quote supports their
      morphology, not that they are neuroblasts, which is why no CL term is bound
      for them. The origin is stated as an assertion, and the abstract gives no
      data for it. The ellipsis skips one sentence on clinical growth features.
  - reference: PMID:33572349
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy (MNTI) and Pineal Anlage Tumor (PAT) Harbor A Medulloblastoma Signature by DNA Methylation Profiling."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "MNTI is a rare neoplasm of putative neural crest origin, preferentially arising in craniofacial sites. The histogenesis of MNTI remains elusive, with divergent theories (odontogenic, primordial germ cell, and a neural crest origin) being hypothesized over the years, leading to inconsistent—and confusing—nomenclature in the literature"
    explanation: >-
      In the Discussion of their DNA methylation study of seven MNTIs,
      Lopez-Nunez et al. call the neural-crest origin of MNTI putative and its
      histogenesis elusive, with odontogenic, primordial germ cell and
      neural-crest origins all proposed over the years. The passage restates
      earlier literature, which it cites, rather than reporting a result of the
      study. It supports the node description's hedge that the neural-crest
      origin is attributed to the tumour rather than established; the same
      paper's abstract calls MNTI a tumour of indeterminate histogenesis.
  - reference: PMID:30407852
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologically, it is composed of a biphasic population of cells, consisting of epithelioid melanin-producing cells and primitive neurogenic cells in a fibrocollagenous stroma."
    explanation: >-
      In the conclusions of this 2018 review, the tumour ('it' refers to
      melanotic neuroectodermal tumour of infancy, named in the sentence before)
      is composed of epithelioid melanin-producing cells and primitive
      neurogenic cells in a fibrocollagenous stroma. This supports the melanin
      production bound to the node and places it in the epithelioid cells. The
      review states it as a histological description, not a measurement.
  - reference: PMID:34094962
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: A Clinicopathological and BRAF V600E Mutation Study of 11 Cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The large polygonal epithelioid cells were melanin-producing and showed vesicular nuclei, prominent nucleoli and eosinophilic cytoplasm."
    explanation: >-
      In the Results of their series of 11 MNTIs, Xia et al. describe the
      large polygonal epithelioid cells of their tumours as melanin-producing.
      This is the series' own histological observation, and it supports the
      melanin production bound to the node and its place in the large
      epithelioid cells rather than the small neuroblast-like ones.
  downstream:
  - target: Expansile Destructive Local Growth
    causal_link_type: DIRECT
    description: >-
      The two cell populations form the mass whose rapid, expansive growth gives
      the clinical picture. The tumour commonly grows infiltratively, and in one
      series every tumour examined had infiltrative borders and extensive
      permeation into the bone.
    evidence:
    - reference: PMID:30407852
      reference_title: "Melanotic Neuroectodermal Tumor of Infancy."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "Melanotic neuroectodermal tumor of infancy commonly has an infiltrative growth pattern, and anatomic constraints often lead to incomplete resection and local recurrence, requiring multiple surgical operations."
      explanation: >-
        This 2018 review states that MNTI commonly has an infiltrative growth
        pattern, and that anatomical constraints often lead to incomplete
        resection and local recurrence. It describes the growth of the tumour as
        a whole and does not attribute it to either cell population, so reading
        it as the tumour cells producing the destructive local growth is an
        inference. The sentence also links incomplete resection to local
        recurrence, which the progression record covers.
    - reference: PMID:40278957
      reference_title: "Melanotic Neuroectodermal Tumor of Infancy: Clinicopathological Evaluation of a 10-Year Consecutive Case Series from a Tertiary Cancer Center."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "Microscopically, infiltrative borders were noted in all 9 cases. Extensive permeation into the bone was present in all cases (case 2; Fig. 2b)."
      explanation: >-
        In this single-centre series of 11 head and neck MNTIs, infiltrative
        borders were noted microscopically in all 9 cases described, and all
        cases showed extensive permeation into the bone; the figure it cites
        shows native bone infiltrated by the biphasic cell population. This ties
        the tumour cells to bone-destroying growth at the microscopic level. It
        is a histological observation in resected tumours, not a measurement of
        how fast they grew, so the link to the clinical expansile growth is an
        inference.
  - target: Elevated Urinary Vanillylmandelic Acid
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      MNTI has been reported to produce vanillylmandelic acid, which, with its
      heterogeneous cellular phenotype, is given as the reason for proposing a
      neural-crest origin. The cited sources do not describe how the tumour
      comes to produce it or how its production relates to the urinary level.
    evidence:
    - reference: PMID:34094962
      reference_title: "Melanotic Neuroectodermal Tumor of Infancy: A Clinicopathological and BRAF V600E Mutation Study of 11 Cases."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "The name of MNTI is widely accepted now and the tumor is proposed to be of neural crest origin because the tumor produces VMA (2) and has heterogeneous cellular phenotype microscopically which explains by the mesodermal and ectodermal morphological features displayed by neural crest cells at different stages of their ontogeny (13)."
      explanation: >-
        In the first paragraph of their Discussion, Xia et al. restate earlier
        work: MNTI is proposed to be of neural crest origin because the tumour
        produces VMA and has a heterogeneous cellular phenotype. For the VMA
        statement they cite their reference 2, which their introduction
        identifies as Borello and Gorlin's proposal; Lopez-Nunez et al.
        (PMID:33572349) attribute that original observation to a single case.
        The quote supports only the tumour itself as a source of VMA. It uses
        that production as evidence for a proposed origin, so it does not show
        that neural crest derivation explains the VMA. It mentions neither urine
        nor a raised level, and the paper never expands the abbreviation VMA, so
        the step from tumour VMA production to elevated urinary
        vanillylmandelic acid is an inference. The authors state that none of
        their own cases had urinary VMA measured, so this is background rather
        than a result of their study.
  - target: Bluish-Black Pigmented Swelling
    causal_link_type: DIRECT
    description: >-
      The melanin made by the large epithelioid tumour cells gives the
      swelling, which is usually covered by the oral mucosa, its bluish-black
      colour.
    evidence:
    - reference: PMID:38681460
      reference_title: "Melanotic Neuroectodermal Tumor of Infancy of Jaws: A Case Report and Review of Literature."
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "Due to the melanin content of the tumor, clinically, the lesion will appear as a bluish-black swelling usually draped by the oral mucosa."
      explanation: >-
        In its Discussion the jaw review attributes the clinical appearance of
        the lesion as a bluish-black swelling, usually draped by the oral
        mucosa, to the tumour's melanin content. That is the causal link this
        edge records. The sentence names the tumour's melanin but not the cells
        that make it; the node's own evidence places the melanin production in
        the large epithelioid cells.

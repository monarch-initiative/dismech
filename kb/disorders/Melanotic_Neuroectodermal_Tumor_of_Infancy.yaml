      A case report with a literature review of MNTI of the jaws. The authors
      recorded urine VMA levels, among other parameters, from 249 published jaw
      cases and added their own case, for 250 in all. VMA was normal in 31 cases
      and elevated in 22, and 197 cases had no VMA information. In the
      Discussion the authors state that raised VMA can point to a
      neuroectodermal tumour, but that its absence does not rule out the
      disease. The percentages are shares of all 250 cases, most of which had no
      VMA information, so they are not the proportion of MNTI with raised VMA.
      The review covered only jaw tumours. Its sentence on VMA refers to
      neuroectodermal tumours in general, so it does not make raised VMA
      specific to MNTI.
diagnosis:
- name: Histopathologic Examination With Immunohistochemistry
  description: >-
    In a single-centre retrospective series of 11 head and neck MNTI cases,
    immunohistochemistry showed AE1/AE3 and HMB45 positivity in the larger
    epithelioid cells in 9 of 9 cases tested, and synaptophysin positivity in
    the smaller neuroblast-like cells in 6 of 6 cases tested.
  diagnosis_term:
    preferred_term: histopathologic and immunohistochemical examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:40278957
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: Clinicopathological Evaluation of a 10-Year Consecutive Case Series from a Tertiary Cancer Center."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "By immunohistochemistry, 9/9 (100%) cases were positive for both AE1/AE3 and HMB45 in the larger epithelioid cells and 6/6 (100%) were positive for Synaptophysin in the smaller neuroblast-like cells."
    explanation: >-
      In a single-centre retrospective series of 11 head and neck MNTI cases,
      immunohistochemistry done as part of the diagnostic workup showed AE1/AE3
      and HMB45 positivity in the larger epithelioid cells in all 9 cases
      tested, and synaptophysin positivity in the smaller neuroblast-like cells
      in all 6 cases tested. Immunohistochemistry was done in 10 of the 11
      cases, so the denominators are the cases tested for each marker, not the
      whole cohort. The authors conclude that awareness of the classic biphasic
      morphology and distinct immunoprofile of MNTI is essential, since failing
      to consider MNTI can lead to misdiagnosis.
differential_diagnoses:
- name: Neuroblastoma
  description: >-
    In one series of seven MNTIs, the small neuroblast-like cells expressed NSE
    and synaptophysin while PHOX2B was negative in every tumour component, and
    metastatic neuroblastoma was excluded in every MNTI by negative imaging
    studies and negative PHOX2B immunostaining. PHOX2B is regarded as a highly
    sensitive and specific immunohistochemical marker for tumours of
    neuroblastic origin, and the series' authors propose it as a diagnostic aid
    when urinary VMA is raised, particularly when a limited biopsy looks
    neuroblastic and expresses neuronal markers. The authors of an 11-case
    series (Sharma et al. 2025) note that raised urinary VMA, seen in some
    patients, can add to the confusion when a biopsy from an infant's
    facial-bone tumour shows primitive round cells, leading to a misdiagnosis
    of metastatic neuroblastoma.
  distinguishing_features:
  - PHOX2B immunostaining was negative in every component of the MNTIs in one series, and had been reported negative in MNTI before; PHOX2B is regarded as a highly sensitive and specific marker for tumours of neuroblastic origin.
  - Negative imaging studies were used together with PHOX2B staining to exclude metastatic neuroblastoma.
  disease_term:
    preferred_term: neuroblastoma
    term:
      id: MONDO:0005072
      label: neuroblastoma
  evidence:
  - reference: PMID:33572349
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy (MNTI) and Pineal Anlage Tumor (PAT) Harbor A Medulloblastoma Signature by DNA Methylation Profiling."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Remarkably, the possibility of metastatic neuroblastoma was excluded in all cases by negative imaging studies and negative expression of Phox2b, which is considered a highly sensitive and specific immunohistochemical marker for tumors of neuroblastic origin, whereas it was reported negative in MNTI ... This immunostain can be used as a diagnostic aid in patients presenting with increased urinary levels of VMA, particularly in cases with limited biopsy material containing a predominantly neuroblastic-like morphology and expression of neuronal markers (i.e., synaptophysin, chromogranin A, PGP9.5, CD56)."
    explanation: >-
      In this series of seven MNTIs and one pineal anlage tumour, the authors
      excluded metastatic neuroblastoma in every MNTI by negative imaging and
      negative PHOX2B immunostaining; their Methods state that PHOX2B
      immunohistochemistry was done in all cases. They then propose PHOX2B
      immunostaining as a diagnostic aid in patients with raised urinary VMA,
      particularly when limited biopsy material shows a predominantly
      neuroblastic-like morphology with expression of neuronal markers. That is
      the authors' recommendation, not a measured result: the paper reports no
      urinary VMA values. Two parts of the quote restate earlier work rather
      than this study's own measurement: the description of PHOX2B as a highly
      sensitive and specific marker of neuroblastic tumours (introduced with 'is
      considered'), and the clause that PHOX2B was previously reported negative
      in MNTI, which carries a citation to an earlier report. The study included
      no neuroblastomas, so it did not measure PHOX2B's sensitivity or
      specificity. The ellipsis replaces only that citation marker and the end
      of its sentence.
  - reference: PMID:33572349
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy (MNTI) and Pineal Anlage Tumor (PAT) Harbor A Medulloblastoma Signature by DNA Methylation Profiling."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The small, neuroblast-like cell component was strongly reactive for NSE and synaptophysin (Figure 3D), while Phox2b was constantly negative in all components (Figure 3E)."
    explanation: >-
      The authors' own staining result for the MNTIs of the series: the small
      neuroblast-like cells expressed the neuronal markers NSE and
      synaptophysin, but PHOX2B was negative in every tumour component. This
      neuronal-marker expression is part of what can make a limited MNTI biopsy
      resemble a neuroblastic tumour, and the PHOX2B negativity is the
      observation behind the series' PHOX2B-based exclusion of metastatic
      neuroblastoma. The sentence does not mention imaging, does not describe
      PHOX2B as a marker of neuroblastic tumours and gives no diagnostic
      recommendation. It supports the clause on the MNTIs' marker profile; the
      exclusion of neuroblastoma follows from it only with the premise, which
      the same paper states in its Discussion, that PHOX2B marks neuroblastic
      tumours.
  - reference: PMID:40278957
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: Clinicopathological Evaluation of a 10-Year Consecutive Case Series from a Tertiary Cancer Center."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Raised levels of urinary VMA seen in some patients can be a further confounding factor in an infant wherein the biopsy from a tumor involving facial bones and showing primitive round cells can lead to a misdiagnosis of metastatic neuroblastoma."
    explanation: >-
      In the Discussion of their 11-case series, Sharma et al. note that raised
      urinary VMA, seen in some patients, can further confound the diagnosis
      when a biopsy from an infant's facial-bone tumour shows primitive round
      cells, and can lead to a misdiagnosis of metastatic neuroblastoma. This is
      a general diagnostic caution rather than a finding of the series, in which
      the urinary VMA levels that were measured were normal.
- name: Rhabdomyosarcoma
  description: >-
    In one 11-case series (Xia et al. 2021), the epithelioid cells of MNTI were
    positive for pan-cytokeratin and HMB45, the small neuroblast-like cells were
    positive for synaptophysin, and all tumours were negative for S-100,
    Melan-A and desmin. The authors suggest that this immunohistochemical
    profile could help distinguish MNTI from small round cell tumours,
    including rhabdomyosarcoma; the series stained no rhabdomyosarcoma. A
    second 11-case series (Sharma et al. 2025) found desmin in none of the 3
    tumours tested and MyoD1 in neither of the 2 tested. Its authors note that
    rhabdomyosarcoma is readily diagnosed by positive immunohistochemistry for
    desmin, MyoD1 and myogenin, but that MNTI with myogenic differentiation,
    including aberrant desmin and other skeletal-muscle marker positivity, has
    also been reported.
  distinguishing_features:
  - Rhabdomyosarcoma is positive for desmin, MyoD1 and myogenin, whereas desmin was negative in all 11 tumours of one MNTI series (Xia et al. 2021) and in the 3 tested in another (Sharma et al. 2025), and MNTI shows a two-cell profile, with pan-cytokeratin and HMB45 in the large epithelioid cells and synaptophysin in the small cells.
  - MNTI with myogenic differentiation, including aberrant desmin and other skeletal-muscle marker positivity, has been reported, so myogenic marker expression does not by itself exclude MNTI.
  disease_term:
    preferred_term: rhabdomyosarcoma
    term:
      id: MONDO:0005212
      label: rhabdomyosarcoma
  evidence:
  - reference: PMID:34094962
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: A Clinicopathological and BRAF V600E Mutation Study of 11 Cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The epithelioid cells were also positive for Pan-CK, HMB45 and the small neuroblast-like cells were positive for Syn. All the tumors were negative for S-100, Melan-A and Des. The immunohistochemical results were in line with the previous publications (6). Those distinct immunohistochemical profile could help distinguishing with other melanin-containing tumors or small round cell tumors, such as melanoma, neuroblastoma, Ewing sarcoma and rhabdomyosarcoma."
    explanation: >-
      In this 11-case series every case was stained for S-100, Melan-A and
      desmin (abbreviated 'Des' in the paper), and all the tumours were negative
      for all three. The epithelioid cells were positive for Pan-CK (the paper's
      pancytokeratin, clone AE1/AE3) and HMB45, and the small neuroblast-like
      cells for synaptophysin. The authors suggest that this distinct overall
      profile could help distinguish MNTI from small round cell tumours, naming
      rhabdomyosarcoma. They did not stain any rhabdomyosarcoma and do not say
      which marker makes that distinction, and the negativity is this series'
      result rather than a stated feature of every MNTI.
  - reference: PMID:40278957
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: Clinicopathological Evaluation of a 10-Year Consecutive Case Series from a Tertiary Cancer Center."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Aberrant Desmin and other skeletal muscle IHC markers positivity reported in MNTI ... Whilst RMS can easily be diagnosed with the help of positive immunohistochemistry for desmin, myoD1, and myogenin, it should be noted that cases of MNTI with myogenic differentiation have also been reported"
    explanation: >-
      Sharma et al. state that rhabdomyosarcoma can easily be diagnosed by
      positive immunohistochemistry for desmin, MyoD1 and myogenin, but that
      MNTI with myogenic differentiation has also been reported, citing earlier
      case reports. The first part of the quote is the footnote to the paper's
      table of features that separate MNTI from other paediatric tumours, which
      adds that aberrant positivity for desmin and other skeletal-muscle
      markers has been reported in MNTI. Both restate earlier literature rather
      than results of the series, and together they mean that myogenic marker
      expression does not by itself exclude MNTI. The ellipsis skips the rest
      of the Discussion between the table footnote and the sentence on
      rhabdomyosarcoma.
  - reference: PMID:40278957
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: Clinicopathological Evaluation of a 10-Year Consecutive Case Series from a Tertiary Cancer Center."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression of other IHC markers were as follows: MIC2 (1/4 cases, in a dot-like pattern, 25%), CD56 (2/2 cases, 100%), chromogranin A (1/2 cases, 50%), S-100 protein (1/8 cases, 12.5%), desmin (0/3 cases, 0%), LCA (0/3, 0%), NKX2-2 (0/2, 0%), FLI1 (0/2, 0%), and MyoD1 (0/2, 0%)."
    explanation: >-
      In this single-centre series of 11 head and neck MNTIs, desmin was
      negative in all 3 tumours tested and MyoD1 in both tumours tested. The
      denominators are the cases tested for each marker, not the whole cohort,
      and they are small. S-100 was positive in 1 of the 8 tumours tested,
      whereas every tumour in the Xia et al. series was S-100-negative, which is
      why S-100 is not used here as a distinguishing feature.
- name: Ewing sarcoma
  description: >-
    In one 11-case series (Xia et al. 2021), the epithelioid cells of MNTI were
    positive for pan-cytokeratin and HMB45 and the small neuroblast-like cells
    for synaptophysin, in line with earlier reports. The authors suggest that
    this two-cell profile could help distinguish MNTI from small round cell
    tumours, including Ewing sarcoma; the series stained no Ewing sarcoma and
    used no Ewing-directed marker. Ewing sarcoma is characterised by diffuse
    membranous MIC2 (CD99) positivity with FLI1 and NKX2-2 positivity. In a
    second 11-case series (Sharma et al. 2025), MIC2 was positive, in a
    dot-like pattern, in 1 of the 4 MNTIs tested, and NKX2-2 and FLI1 were
    negative in both tumours tested; a 2021 review adds that several MNTIs
    have been reported to express CD99, a marker used in diagnosing tumours of
    the Ewing sarcoma group. A 2024 review of jaw MNTI states that Ki-67 or
    CD99 positivity of the neuroblast-like cells appears to be associated with
    an aggressive type of MNTI.
  distinguishing_features:
  - In one 11-case series (Xia et al. 2021), in line with earlier reports, the large epithelioid cells of MNTI were positive for pan-cytokeratin and HMB45 and the small neuroblast-like cells for synaptophysin.
  - Ewing sarcoma shows diffuse membranous MIC2 (CD99) positivity with FLI1 and NKX2-2; in one MNTI series MIC2 was dot-like in 1 of 4 tumours tested and NKX2-2 and FLI1 were negative in the 2 tested, and several MNTIs have been reported to express CD99, so CD99 positivity alone does not rule MNTI out; Ki-67 or CD99 positivity of the neuroblast-like cells appears to be associated with an aggressive type of MNTI.
  disease_term:
    preferred_term: Ewing sarcoma
    term:
      id: MONDO:0012817
      label: Ewing sarcoma
  evidence:
  - reference: PMID:34094962
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: A Clinicopathological and BRAF V600E Mutation Study of 11 Cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The epithelioid cells were also positive for Pan-CK, HMB45 and the small neuroblast-like cells were positive for Syn. All the tumors were negative for S-100, Melan-A and Des. The immunohistochemical results were in line with the previous publications (6). Those distinct immunohistochemical profile could help distinguishing with other melanin-containing tumors or small round cell tumors, such as melanoma, neuroblastoma, Ewing sarcoma and rhabdomyosarcoma."
    explanation: >-
      From the Discussion of this clinicopathological case series: the
      epithelioid cells were positive for Pan-CK and HMB45 and the small
      neuroblast-like cells for Syn (the Methods define these as pancytokeratin
      and synaptophysin). All tumours were negative for S-100, Melan-A and
      desmin, and the authors note that these results agree with earlier
      publications. They then suggest that this distinct two-cell profile could
      help distinguish MNTI from other melanin-containing and small round cell
      tumours, naming Ewing sarcoma. That differential value is the authors'
      suggestion, not a tested comparison: the series stained no Ewing sarcoma
      cases, and its antibody panel includes no marker directed at Ewing
      sarcoma.
  - reference: PMID:40278957
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: Clinicopathological Evaluation of a 10-Year Consecutive Case Series from a Tertiary Cancer Center."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffuse membranous MIC2 positivity along with FLI1 and NKX2-2 positivity is the characteristic IHC profile for Ewing sarcoma."
    explanation: >-
      In the Discussion of their 11-case MNTI series, Sharma et al. give
      diffuse membranous MIC2 positivity together with FLI1 and NKX2-2
      positivity as the characteristic immunohistochemical profile of Ewing
      sarcoma. This is a general statement about Ewing sarcoma, not a result of
      the series. MIC2 is a previous HGNC symbol of the CD99 gene, so MIC2
      staining is CD99 staining.
  - reference: PMID:40278957
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: Clinicopathological Evaluation of a 10-Year Consecutive Case Series from a Tertiary Cancer Center."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression of other IHC markers were as follows: MIC2 (1/4 cases, in a dot-like pattern, 25%), CD56 (2/2 cases, 100%), chromogranin A (1/2 cases, 50%), S-100 protein (1/8 cases, 12.5%), desmin (0/3 cases, 0%), LCA (0/3, 0%), NKX2-2 (0/2, 0%), FLI1 (0/2, 0%), and MyoD1 (0/2, 0%)."
    explanation: >-
      In this single-centre series of 11 head and neck MNTIs, MIC2 was positive
      in 1 of the 4 tumours tested, in a dot-like pattern rather than the
      diffuse membranous pattern given for Ewing sarcoma, and NKX2-2 and FLI1
      were negative in both tumours tested. The denominators are the cases
      tested for each marker, not the whole cohort, and they are small, so the
      result shows that MIC2 staining can occur in MNTI rather than how often.
  - reference: PMID:34359769
    reference_title: "The Role of Chemotherapy in Management of Inoperable, Metastatic and/or Recurrent Melanotic Neuroectodermal Tumor of Infancy-Own Experience and Systematic Review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, several MNTI cases were found to express CD99, a marker used in diagnosis of ES group tumors"
    explanation: >-
      In the Discussion of this chemotherapy review, the authors note, citing
      earlier reports, that several MNTI cases were found to express CD99, a
      marker used in diagnosing tumours of the Ewing sarcoma (ES) group. The
      sentence opens with 'Consequently' because it follows a suggestion that
      Ewing sarcoma, like MNTI, may derive from the neural crest; the CD99
      expression itself is the cited reports' observation. It shows that CD99
      positivity does not exclude MNTI. The paper also notes that CD99
      expression has been reported in typical MNTIs with benign histology and
      outcome.
  - reference: PMID:38681460
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy of Jaws: A Case Report and Review of Literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The neuroblast-like component is regarded as the aggressive part of the neoplasm, and if neuroblasts are positive for Ki-67 or CD99, it appears to be associated with an aggressive type of MNTI"
    explanation: >-
      In its Discussion the jaw review, citing an earlier report, regards the
      neuroblast-like component as the aggressive part of MNTI and states that
      Ki-67 or CD99 positivity of the neuroblasts appears to be associated with
      an aggressive type of MNTI. The association is hedged and taken from the
      earlier report, and the review does not define what it calls an
      aggressive type. For this differential it adds that the neuroblast-like
      cells of MNTI can be CD99-positive, so CD99 positivity does not by itself
      point to Ewing sarcoma; the Ki-67 part does not bear on the distinction.
      The 2021 chemotherapy review cited in this row notes that CD99 expression
      has also been reported in typical MNTIs with benign histology and
      outcome, so the association with aggressive behaviour is not settled.
treatments:
- name: Surgical Excision
  description: >-
    Surgery is the mainstay of treatment; a 2026 expert consensus gives cure
    rates of 80%-90%, and its abstract does not say which case series the
    figure comes from or how cure was defined. Complete surgical resection is
    regarded as the gold standard, and incomplete resection has been proposed as
    one of the main reasons for frequent recurrences.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical excision
    term:
      id: NCIT:C15232
      label: Excision
  target_mechanisms:
  - target: Biphasic Melanocyte-Like and Neuroblast-Like Tumor Cell Population
    treatment_effect: INHIBITS
    description: >-
      Excision removes the tumour and with it both tumour cell populations.
      Incomplete resection, which leaves tumour behind, is given as one of the
      main reasons for recurrence.
    evidence:
    - reference: PMID:42527893
      reference_title: "Clinical Guidance for the Management of Melanotic Neuroectodermal Tumor of Infancy-A Consensus by the Expert Group."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "Surgery is the mainstay of treatment, achieving 80%-90% cure rates."
      explanation: >-
        The consensus guidance states that surgery is the mainstay of MNTI
        treatment and achieves 80%-90% cure rates. This is a treatment outcome,
        so reading it as surgery removing the tumour cell population is an
        inference, and the abstract does not say how cure was defined.
    - reference: PMID:40278957
      reference_title: "Melanotic Neuroectodermal Tumor of Infancy: Clinicopathological Evaluation of a 10-Year Consecutive Case Series from a Tertiary Cancer Center."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "Regarding the treatment of MNTI, complete surgical resection is considered a gold standard and incomplete resection has been purported to be one of the main reasons for frequent recurrences"
      explanation: >-
        Sharma et al. state, citing earlier reviews, that complete surgical
        resection is considered the gold standard for MNTI and that incomplete
        resection has been proposed as one of the main reasons for frequent
        recurrences. That tumour left behind after incomplete resection is
        linked to recurrence supports excision acting by removing the tumour
        cells, but the link is an inference and the sentence reports no
        measurement.
  evidence:
  - reference: PMID:42527893
    reference_title: "Clinical Guidance for the Management of Melanotic Neuroectodermal Tumor of Infancy-A Consensus by the Expert Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgery is the mainstay of treatment, achieving 80%-90% cure rates."
    explanation: >-
      This EXPeRT and ERN PaedCan consensus guidance on melanotic
      neuroectodermal tumor of infancy was developed through a structured
      consensus process based on a focused literature review and expert
      agreement. It states that surgery is the mainstay of MNTI treatment and
      achieves 80%-90% cure rates, which is the claim made for this treatment.
      The figure is the consensus group's own summary, not an outcome the
      guidance measured: the abstract does not say which case series it comes
      from, how long patients were followed or how cure was defined.
  - reference: PMID:40278957
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy: Clinicopathological Evaluation of a 10-Year Consecutive Case Series from a Tertiary Cancer Center."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Regarding the treatment of MNTI, complete surgical resection is considered a gold standard and incomplete resection has been purported to be one of the main reasons for frequent recurrences"
    explanation: >-
      In the Discussion of their 11-case series, Sharma et al. state, citing
      earlier reviews, that complete surgical resection is considered the gold
      standard of MNTI treatment and that incomplete resection has been
      proposed as one of the main reasons for frequent recurrences. This
      supports surgical removal of the tumour, rather than surgery in general,
      as the treatment, and the binding to excision. It restates earlier
      literature rather than a result of the series.
- name: Chemotherapy for Inoperable, Metastatic or Recurrent Disease
  description: >-
    Chemotherapy may be considered for the fewer than 10% of patients whose MNTI
    is inoperable, metastatic or persistently recurring, although its role is
    still unclear. The main source is a review that combined four of its
    authors' own infants with 38 published cases from the previous 42 years. In
    that review neoadjuvant chemotherapy, based mainly on neuroblastoma
    protocols, was often effective, and the review's conclusions say it allowed
    delayed complete surgery in a large subset of patients (in first-line use,
    partial shrinkage in 8 of 12 children, with delayed surgery complete in 5 of
    those 8). The role of adjuvant chemotherapy in preventing recurrence after
    incomplete resection remains unclear, and disseminated inoperable disease
    was almost universally associated with poor response to chemotherapy and an
    unfavourable outcome. A 2026 expert consensus likewise says that
    chemotherapy may be considered for advanced disease, and that radiotherapy
    is generally avoided in young children.
  action_category: THERAPEUTIC
  context: Inoperable, metastatic or persistently recurring MNTI
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  notes: >-
    No agent or regimen is bound, because the cited review pooled cases treated
    with different regimens; neuroblastoma-derived protocols were the most
    frequently used (12 of 39 reported inoperable, recurrent or metastatic
    cases).
  evidence:
  - reference: PMID:34359769
    reference_title: "The Role of Chemotherapy in Management of Inoperable, Metastatic and/or Recurrent Melanotic Neuroectodermal Tumor of Infancy-Own Experience and Systematic Review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In less than 10% of patients with inoperable, metastatic or persistently recurring MNTI, chemotherapy (CHT) may be considered; however, its role is still unclear. The aim of our study was to assess the efficacy of CHT in children with large, inoperable, metastatic and/or recurrent MNTI. Four such infants, treated with CHT in Polish and German centers of pediatric oncology, were presented. Additionally, a systematic literature search of the PubMed/MEDLINE, Scopus and Web of Science databases was performed, yielding 38 similar cases within the last 42 years. Neoadjuvant CHT, based mainly on the protocols for neuroblastoma, was often effective, allowing for complete delayed surgery in most cases. However, the role of adjuvant CHT in preventing recurrences after incomplete resection of MNTI remains unclear. Disseminated inoperable MNTI was almost universally associated with poor response to CHT and unfavorable outcome."
    explanation: >-
      This paper combines four chemotherapy-treated infants from Polish and
      German paediatric oncology centres with 38 similar published cases found
      by a systematic search covering the previous 42 years, so its findings
      rest on a small, heterogeneous set of reported cases rather than a
      cohort. Its abstract says chemotherapy may be considered for the fewer
      than 10% of patients whose MNTI is inoperable, metastatic or persistently
      recurring, although its role is still unclear; that figure is the
      abstract's framing statement and is not derived in the body. From the
      pooled cases it reports that neoadjuvant chemotherapy, based mainly on
      neuroblastoma protocols, was often effective and allowed complete delayed
      surgery in most cases. The paper's conclusions word the same result as
      delayed complete surgery in a large subset of patients, so 'most cases'
      should not be read as most of all children given neoadjuvant
      chemotherapy. It also says the role of adjuvant chemotherapy in
      preventing recurrence after incomplete resection remains unclear, and
      that disseminated inoperable MNTI was almost universally associated with
      poor response to chemotherapy and an unfavourable outcome.
  - reference: PMID:34359769
    reference_title: "The Role of Chemotherapy in Management of Inoperable, Metastatic and/or Recurrent Melanotic Neuroectodermal Tumor of Infancy-Own Experience and Systematic Review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In eight out of 12 children who underwent neoadjuvant CHT in the first-line treatment, partial tumor shrinkage was stated ... This enabled physicians to perform delayed surgery, which was complete in 5 out of 8. ... Neoadjuvant CHT is usually effective, allowing physicians to perform delayed complete and non-mutilating surgery in a large subset of patients."
    explanation: >-
      In the Discussion of the same review, eight of the 12 children given
      neoadjuvant chemotherapy as part of first-line treatment had partial
      tumour shrinkage, and delayed surgery was then complete in five of those
      eight. The conclusions describe neoadjuvant chemotherapy as usually
      effective, allowing delayed complete and non-mutilating surgery in a large
      subset of patients. These counts come from published case reports pooled
      with the authors' own cases, not from a trial. The first ellipsis replaces
      the citation markers after the first sentence; the second skips the rest
      of the Discussion up to the conclusions.
  - reference: PMID:34359769
    reference_title: "The Role of Chemotherapy in Management of Inoperable, Metastatic and/or Recurrent Melanotic Neuroectodermal Tumor of Infancy-Own Experience and Systematic Review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Including the aforementioned patients treated according to CCLG guidelines, 12 out of 39 reported cases of inoperable/recurrent and/or metastatic MNTI were treated with protocols directly adapted from NBL treatment ... Considering the biological similarity of neuroblast-like components of MNTI and NBL, CHT adapted from NBL treatment protocols has been used most frequently with beneficial outcomes."
    explanation: >-
      The review reports that 12 of the 39 reported cases of inoperable,
      recurrent or metastatic MNTI, including those treated under the CCLG
      guidelines, received protocols directly adapted from neuroblastoma (NBL)
      treatment. Its conclusions say that these neuroblastoma-derived regimens
      were used most frequently, citing the biological similarity of the
      neuroblast-like component of MNTI to neuroblastoma. That makes them the
      largest group of regimens, not a majority of the cases. 'Beneficial
      outcomes' is the authors' summary of a small pooled case series. The
      ellipsis skips the rest of the Discussion between the two sentences.
  - reference: PMID:42527893
    reference_title: "Clinical Guidance for the Management of Melanotic Neuroectodermal Tumor of Infancy-A Consensus by the Expert Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Chemotherapy may be considered for advanced disease, whereas radiotherapy is generally avoided in young children."
    explanation: >-
      The EXPeRT and ERN PaedCan consensus guidance states that chemotherapy
      may be considered for advanced disease, whereas radiotherapy is generally
      avoided in young children. This agrees with the review's position that
      chemotherapy is an option for inoperable, metastatic or recurrent
      disease. It is a recommendation from a structured consensus process, not
      an outcome the guidance measured, and the abstract does not define
      advanced disease, although it names unresectable, multiply recurrent and
      metastatic cases as the ones whose management can be challenging.
discussions:
- discussion_id: mnti_shared_progenitor_with_group_3_medulloblastoma
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biphasic Melanocyte-Like and Neuroblast-Like Tumor Cell Population
  prompt: >-
    Do MNTI and group 3 medulloblastoma, which share a DNA methylation profile,
    arise from a common multipotent progenitor such as an early cranial neural
    crest cell, and if so, why is MNTI mostly benign while group 3
    medulloblastoma is mainly known for aggressive behaviour?
  rationale: >-
    In a DNA methylation study of seven MNTIs, five clustered in the group 3
    medulloblastoma class family with an optimal score and the other two in the
    PLEX, PED B (plexus tumour) class family with suboptimal scores, while a
    medulloblastoma group 3/4 classifier classed all seven as high-risk group
    3 tumours, subtype II. Compared with methylation data from a cohort of 36
    medulloblastoma patients, all the MNTIs had a global methylation profile
    very close to that of group 3 medulloblastoma. The authors conclude that
    MNTI shares a homogeneous methylation profile with group 3
    medulloblastoma, and propose that MNTI, pineal anlage tumour and group 3
    medulloblastoma could form a spectrum of tumours determined by
    neural-crest-derived stem cells, with an early cranial neural crest cell
    named as a candidate multipotent progenitor. They present this as a
    hypothesis deserving further investigation. They also contrast the benign
    behaviour of MNTI with group 3 medulloblastoma, which is mainly known for
    aggressive clinical behaviour, and name the anatomical site, the tumour
    microenvironment and other cytogenetic events as factors whose role in
    that difference deserves further investigation. Because the shared
    progenitor is a hypothesis, the entry records it here and not as a
    pathophysiology node or causal edge.
  evidence:
  - reference: PMID:33572349
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy (MNTI) and Pineal Anlage Tumor (PAT) Harbor A Medulloblastoma Signature by DNA Methylation Profiling."
    supports: SUPPORT
    directness: DIRECT

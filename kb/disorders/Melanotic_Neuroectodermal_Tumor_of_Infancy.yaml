mappings:
  mondo_mappings:
  - term:
      id: MONDO:0002072
      label: melanotic neuroectodermal tumor
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      Primary MONDO identifier for this entry. MONDO defines the class as a rare
      neoplasm usually occurring in infants, with a mixture of melanin-containing
      epithelial cells and smaller neuroblast-like cells, that may involve the
      skull and facial bones or the epididymis and usually has a benign clinical
      course. It cross-references NCIT:C3717 and ICD-O 9363/0 and files the
      class under primitive neuroectodermal tumor (MONDO:0005462), as a sibling
      of neuroblastic tumor (MONDO:0006316).
  ncit_mappings:
  - term:
      id: NCIT:C3717
      label: Melanotic Neuroectodermal Tumor
    mapping_predicate: skos:exactMatch
    mapping_source: NCIT
    mapping_justification: >-
      The NCIT concept that MONDO cross-references for MONDO:0002072, with the
      same definition. NCIT files it under Embryonal Neoplasm (NCIT:C3264) and
      lists Epididymal Melanotic Neuroectodermal Tumor (NCIT:C162488) as a
      child, which this entry covers.

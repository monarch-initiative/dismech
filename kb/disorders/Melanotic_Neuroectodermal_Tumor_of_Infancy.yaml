  evidence:
  - reference: PMID:38681460
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy of Jaws: A Case Report and Review of Literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "After removing the duplicate articles and articles not following the inclusion criteria, full-text screening of the remaining articles was conducted to record the parameters such as age, sex, location, management option, recurrence, and urine VMA levels. ... A total of 178 articles discussing 249 cases of MNTI in the jawbone were selected for data extraction. ... The final number of cases included in this review was 250 including the current case we described. ... Data on vanillylmandelic acid (VMA) levels in the patient population revealed that 31 (12.4%) cases exhibited normal levels, while 22 (8.8%) cases indicated elevated VMA levels. In 197 (78.8%) cases, lacked information regarding VMA levels. ... Raised VMA levels can indicate a neuroectodermal tumor, but its absence does not rule out the disease."

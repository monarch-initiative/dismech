    reference_title: "Melanotic Neuroectodermal Tumor of Infancy of Jaws: A Case Report and Review of Literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the melanin content of the tumor, clinically, the lesion will appear as a bluish-black swelling usually draped by the oral mucosa. Maxillary swelling with a bluish-black hue and a rapid course in an infant can be considered as a clinical pathognomic sign to diagnose an oral MNTI."
    explanation: >-

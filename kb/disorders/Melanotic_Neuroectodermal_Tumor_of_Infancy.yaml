name: Melanotic Neuroectodermal Tumor of Infancy
creation_date: '2026-10-28T18:40:00Z'
description: >-
  Melanotic neuroectodermal tumor of infancy (MNTI) is a rare pigmented tumour
  whose origin is attributed to the neural crest. It most often affects the
  maxilla of infants in the first year of life, and less often the skull,
  mandible, brain, epididymis or other rare sites, where its expansive,
  destructive and rapid growth forms a mass that may be lobulated,
  non-ulcerated and painless. It is biphasic: large epithelioid cells that
  contain variable melanin and smaller neuroblast-like round cells lie in a
  fibrocollagenous stroma. MNTI has generally been regarded as benign, although
  it recurs locally and rarely behaves malignantly, and the 5th edition of the
  WHO classification of paediatric tumours is reported to treat MNTI of the
  head and neck as malignant (see notes). Its small round blue cell morphology
  can lead to misdiagnosis as a malignant neoplasm; metastatic neuroblastoma is
  one differential diagnosis, excluded in one series by imaging and negative
  PHOX2B immunostaining. Surgery is the mainstay of treatment, and chemotherapy
  may be considered for inoperable, metastatic or persistently recurring
  tumours, with neoadjuvant regimens based mainly on neuroblastoma protocols.
  MONDO files MNTI (MONDO:0002072) under primitive neuroectodermal tumor,
  beside neuroblastic tumor rather than within it.
categories:
- Neural Tumor
- Embryonal Tumor
parents:
- primitive neuroectodermal tumor
synonyms:
- MNTI
- melanotic progonoma
- retinal anlage tumor
- pigmented neuroectodermal tumor of infancy
notes: >-
  MNTI has generally been regarded as benign (Soles et al. 2018,
  PMID:30407852), and MONDO cross-references ICD-O code 9363/0, a benign
  behaviour code. Its classification has since shifted: the 5th edition of the
  WHO Classification of Head and Neck Tumours deleted MNTI from the benign bone
  and cartilaginous tumours (Vered and Wright 2022, PMID:35312978), and a 2025
  case series reports that the 5th edition of the WHO classification of
  paediatric tumours considers MNTI of the head and neck a malignant entity
  (Sharma et al. 2025, PMID:40278957). No genetic record is curated and no
  pathophysiology node is marked as the origin node, because the cited sources
  describe no recurrent initiating lesion: Xia et al. (2021, PMID:34094962)
  found no BRAF V600E mutation in 11 tumours after Gomes et al. had found it in
  one of three, and describe the genetic alterations of MNTI as inconclusive.
  Most tumours in that series had a low Ki-67 index, so no proliferation
  process is bound to the growth node. A DNA methylation study of seven MNTIs
  found that MNTI shares a homogeneous methylation profile with group 3
  medulloblastoma (Lopez-Nunez et al. 2021, PMID:33572349); the finding is
  recorded as an open question under discussions, not as a pathophysiology
  node or causal edge. The entry covers MNTI at every site, including the
  epididymal tumour that NCIT records as a child class (NCIT:C162488).
epidemiology:
- name: Age Distribution
  description: >-
    In a pooled literature review of 250 jaw MNTI cases, most (53.6%) were aged
    three to six months, followed by zero to two months (40.4%); 4.0% were aged
    seven months to one year and 2.0% more than one year. The figures describe
    published jaw tumours, not a population sample, and the review does not say
    whether the tabulated age is the age at presentation, at diagnosis or at
    treatment.
  evidence:
  - reference: PMID:38681460
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy of Jaws: A Case Report and Review of Literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In terms of age, most cases were observed in the age group of three to six months, accounting for 134 (53.6%) cases, followed by zero to two months, accounting for 101 (40.4%) cases, while the categories of seven months to one year and more than one year represented 10 cases (4.0%) and five (2.0%) cases, respectively."
    explanation: >-
      Of the review's 250 pooled jaw MNTI cases (published cases plus the
      authors' own), 134 (53.6%) were aged three to six months, 101 (40.4%)
      zero to two months, 10 (4.0%) seven months to one year and five (2.0%)
      more than one year. The data cover jaw tumours only and are compiled from
      published articles, not a population registry. The review does not say
      whether the age it tabulated is the age at presentation, at diagnosis or
      at treatment.
  - reference: PMID:38681460
    reference_title: "Melanotic Neuroectodermal Tumor of Infancy of Jaws: A Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Literature review of 250 cases of MNTI including the current case report was conducted considering study parameters such as age and gender of the patient, location of the lesion, levels of vanillylmandelic acid, management options, and outcome after treatment."
    explanation: >-
      States that the review pooled 250 MNTI cases, the authors' own case plus
      published cases, and that patient age was among the parameters recorded
      for each case. This is the denominator behind the age-band percentages.
      The sentence itself reports no age bands and does not state the jaw-only
      scope, which comes from the review's inclusion criteria.

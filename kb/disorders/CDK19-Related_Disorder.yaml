    snippet: "We identified three unrelated individuals with de novo missense variants in CDK19, encoding a cyclin-dependent kinase protein family member that"
    explanation: Establishes CDK19 as a Mediator kinase-module cyclin-dependent kinase disrupted by de novo variants.
  - reference: PMID:32330417
    reference_title: "De Novo Variants in CDK19 Are Associated with a Syndrome Involving Intellectual Disability and Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The few eclosing flies exhibit severe seizures and a reduced lifespan."
    explanation: Drosophila knockdown recapitulates a seizure phenotype, supporting a conserved role for CDK19/Cdk8 in neuronal function.
  downstream:
  - target: Neurodevelopmental transcriptional dysregulation
    description: >-
      CDK19 kinase dysfunction disrupts Mediator-dependent transcription of neurodevelopmental
      gene-expression programs, producing an epilepsy-predominant phenotype.
- name: Neurodevelopmental transcriptional dysregulation
  description: >
    Downstream of CDK19 kinase-module dysfunction, neuronal gene-expression programs are
    dysregulated during brain development, contributing to hypotonia, global developmental
    delay, and a prominent epileptic encephalopathy with dysmorphic features.

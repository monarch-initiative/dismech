- name: Altered Transcriptional Regulation
  description: CDK19 is a Mediator-associated transcriptional kinase. Variant-dependent phosphorylation changes can alter transcription, but an abnormal neuronal expression program has not been directly delineated in these patients. The cytoplasmic rescue experiments indicate that transcription alone need not account for every phenotype.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL

    description: Disrupted neuronal developmental programs contribute to global developmental delay.
  - target: Epileptic encephalopathy
    description: Disrupted cortical network excitability produces a prominent epileptic encephalopathy.
  - target: Hypotonia
    description: Disrupted neurodevelopmental programs contribute to hypotonia.
  - target: Dysmorphic features
    description: Disrupted craniofacial developmental programs contribute to dysmorphic features.

name: CDK19-Related Disorder
creation_date: '2026-07-31T00:00:00Z'
category: Mendelian
synonyms:
- Developmental and epileptic encephalopathy 87
- DEE87
- CDK19-related developmental and epileptic encephalopathy
- CDK19-associated neurodevelopmental disorder
description: >
  CDK19-related disorder (developmental and epileptic encephalopathy 87, DEE87) is a rare
  autosomal dominant neurodevelopmental disorder caused by heterozygous de novo missense
  variants in CDK19, which encodes a cyclin-dependent kinase that is the paralog of CDK8 and
  serves as an alternative catalytic kinase of the CDK8 kinase module of the Mediator
  transcriptional coactivator complex. This is the most epilepsy-predominant of the Mediator
  kinase-module disorders: affected individuals present with hypotonia, global developmental
  delay, epileptic encephalopathy (including infantile spasms), and dysmorphic features. Both
  loss-of-function and gain-of-function mechanisms have been reported for different alleles.
  The gene-disease relationship was established with Drosophila rescue and overexpression
  assays, in which human CDK19 rescues loss of the fly homolog Cdk8.

pathophysiology:
- name: CDK19 kinase module dysfunction
  description: >
    CDK19 is a cyclin-dependent kinase and the paralog of CDK8, serving as an alternative
    catalytic kinase of the CDK8 kinase module (CKM) of the Mediator complex, which
    predominantly regulates gene transcription. De novo missense variants in the kinase domain
    disrupt CKM-dependent transcriptional regulation; different alleles act through loss-of- or
    gain-of-function mechanisms. CDK19 belongs to the group of CDK8-kinase module-associated
    disease genes, alongside CDK8, MED12, MED12L, MED13, and MED13L.

genetic:
- name: CDK19
  association: Heterozygous de novo kinase-domain missense variants cause a variable neurodevelopmental disorder. Recurrent alleles cluster in the glycine-rich ATP-binding loop and activation segment. The direction of biochemical activity and the ability to substitute for fly Cdk8 depend on allele and assay. Neither a universal loss-of-function mechanism nor simple haploinsufficiency explains all reported variants.
  gene_term:
    preferred_term: CDK19
    term:
      id: hgnc:19338
      label: CDK19
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:32330417
      reference_title: "De Novo Variants in CDK19 Are Associated with a Syndrome Involving Intellectual Disability and Epileptic Encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified three unrelated individuals with de novo missense variants in CDK19"
      explanation: Heterozygous de novo CDK19 missense variants are consistent with autosomal dominant inheritance.
    description: The missense series consists predominantly of confirmed de novo heterozygous variants. A de novo result does not make recurrence risk zero because parental germline mosaicism cannot be excluded; penetrance and family recurrence rates have not been quantified.
  evidence:
  - reference: PMID:32330417
    reference_title: De Novo Variants in CDK19 Are Associated with a Syndrome Involving Intellectual Disability and Epileptic Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We identified three unrelated individuals with de novo missense variants in CDK19
    explanation: Human case-level evidence for the de novo disorder.
  - reference: PMID:33495529
    reference_title: CDK19-related disorder results from both loss-of-function and gain-of-function de novo missense variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: kinase activity of protein was lower for p.Gly28Arg and higher for p.Tyr32His substitutions compared with that of the wild-type protein.
    explanation: Opposite biochemical effects do not support a uniformly decreased activity annotation.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: G2P classifies the autosomal dominant CDK19–DEE87 relationship as Strong (evaluated 14 January 2025; GenCC SGC-123798.1). ClinGen has not published its own CDK19 validity curation. An earlier pericentric chromosome-6 inversion disrupted CDK19 and reduced transcript abundance in a patient with retinal folds, microcephaly and milder intellectual disability; that single structural case does not establish that all deletions or truncating alleles cause the missense-associated syndrome.
  gene_disease_validity:
  - validity_classification: STRONG
    classified_by: G2P
    external_id: G2P02961
    notes: G2P assertion represented by GenCC SGC-123798.1; evaluated 2025-01-14. Historical classifications by other submitters differ.
    evidence:
    - reference: url:https://thegencc.org/submissions/SGC-123798.1
      reference_title: CDK19 | developmental and epileptic encephalopathy, 87 | Autosomal dominant by G2P submission information facts
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: 'Classification: ... Strong ... Gene: ... CDK19 ... Disease: ... developmental and epileptic encephalopathy, 87'
      explanation: Records the external G2P assertion, not a new dismech validity assessment.
  variants:
  - name: p.Gly28Arg
    description: Recurrent ATP-loop substitution encoded by c.82G>C or c.82G>A in the 2021 cohort. Autophosphorylation and substrate phosphorylation are reduced.
    evidence:
    - reference: PMID:33495529
      reference_title: CDK19-related disorder results from both loss-of-function and gain-of-function de novo missense variants.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: kinase activity of protein was lower for p.Gly28Arg and higher for p.Tyr32His substitutions compared with that of the wild-type protein.
      explanation: Measured biochemical effects.
  - name: c.94T>C (p.Tyr32His)
    description: Recurrent ATP-loop allele with increased activity in biochemical assays. It fails stringent fly rescue assays but restores selected functions under milder knockdown conditions; lifespan and myofibril defects can remain.
    evidence:
    - reference: PMID:41251503
      reference_title: Uncovering functional insights into human pathogenic variants in CDK19 using Drosophila models.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Y32H can functionally compensate for Cdk8 depletion in a manner similar to wild-type CDK19.
      explanation: Assay-dependent functional complementation.
  - name: c.586A>G (p.Thr196Ala)
    description: Activation-segment substitution in two founding patients. It fails functional rescue and decreases Drp1 phosphorylation in the sensitized fly model; a dominant-negative mechanism is proposed but not directly established in human cells.
    evidence:
    - reference: PMID:32330417
      reference_title: De Novo Variants in CDK19 Are Associated with a Syndrome Involving Intellectual Disability and Epileptic Encephalopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: p.Thr196Ala identified in probands 1 and 2
      explanation: Recurrent founding allele.
  - name: c.92C>A (p.Thr31Asn)
    description: De novo variant classified as likely pathogenic in the infantile-spasm case. ATP-pocket effects were modeled computationally; kinase activity was not directly measured in that report.
    evidence:
    - reference: PMID:33568421
      reference_title: A novel variant of CDK19 causes a severe neurodevelopmental disorder with infantile spasms.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: We identified a novel de novo missense variant c.92C > A (p.Thr31Asn) in CDK19 that was classified as a likely pathogenic disease-causing variant.
      explanation: Case-level classification and variant identity.
    clinical_significance: LIKELY_PATHOGENIC
  - name: Additional kinase-domain substitutions
    description: The 2021 series also reports p.Gly28Ala, p.Tyr32Cys, p.Phe197Leu, p.Trp198Cys and p.Arg200Trp. Direct biochemical results for Gly28Arg or Tyr32His should not be assigned to each untested allele.
    evidence:
    - reference: url:https://www.nature.com/articles/s41436-020-01091-9.pdf
      reference_title: https://www.nature.com/articles/s41436-020-01091-9.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The additional substitutions reported here, p.Phe197Leu, p.Trp198Cys, and p.Arg200Trp
      explanation: Activation-segment variants in the primary cohort.
  - name: Historical CDK19-disrupting pericentric inversion
    description: A de novo inversion with a breakpoint mapped within intron 1 was associated with reduced CDK19 RNA in EBV-transformed lymphoblasts. Its retinal/microcephaly phenotype and dosage mechanism should be considered separately from the better-supported kinase-domain missense series.
    evidence:
    - reference: PMID:20563892
      reference_title: CDK19 is disrupted in a female patient with bilateral congenital retinal folds, microcephaly and mild mental retardation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The transcript level for CDK19 in the patient was found to be 54% (p = 0.022) when compared with the control mean
      explanation: Measured transcript decrease in the inversion case; not a direct kinase assay.

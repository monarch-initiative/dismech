  features: >
    Heterozygous de novo kinase-domain missense variants; both loss-of-function and
    gain-of-function mechanisms have been reported for different alleles.
  evidence:
  - reference: PMID:32330417
    reference_title: "De Novo Variants in CDK19 Are Associated with a Syndrome Involving Intellectual Disability and Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of Cdk8, the fly homolog of CDK19, causes larval lethality, which is suppressed by expression of human CDK19 reference cDNA."
    explanation: Cross-species rescue establishes functional conservation and supports the CDK19 gene-disease relationship.
  - reference: PMID:33495529
    reference_title: "CDK19-related disorder results from both loss-of-function and gain-of-function de novo missense variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "kinase activity of protein was lower for p.Gly28Arg and higher for p.Tyr32His substitutions compared with that of the wild-type protein."
    explanation: Autophosphorylation assays show recurrent CDK19 variants act through both loss-of-function (Gly28Arg) and gain-of-function (Tyr32His) mechanisms, supporting the mixed-mechanism statement.

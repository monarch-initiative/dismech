- name: Impaired CDK19 Functional Complementation
  description: Tyr32His and Thr196Ala fail to rescue severe fly Cdk8 depletion or null phenotypes. In milder knockdown conditions, Tyr32His rescues climbing and mitochondrial morphology while failing to normalize lifespan and myofibril width; Thr196Ala remains broadly impaired. A dominant-negative mechanism is a hypothesis rather than proof of interaction with the human wild-type allele.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:32330417
    reference_title: De Novo Variants in CDK19 Are Associated with a Syndrome Involving Intellectual Disability and Epileptic Encephalopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: expression of either CDK19 p.Tyr32His or p.Thr196Ala failed to rescue the lethality.
    explanation: Failure of stringent complementation.
  - reference: PMID:41251503
    reference_title: Uncovering functional insights into human pathogenic variants in CDK19 using Drosophila models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: both variants are unable to rescue the cdk8 depletion muscle myofibril thickening as the wild-type CDK19 can

  description: One Tyr32His case had persistently elevated CSF protein and later elevated CSF/plasma glycine, prompting evaluation for nonketotic hyperglycinemia. These case-specific results do not establish a screening biomarker or justify routine invasive CSF testing for every CDK19 diagnosis.

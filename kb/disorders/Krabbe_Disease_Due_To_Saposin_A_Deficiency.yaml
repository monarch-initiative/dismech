name: Krabbe Disease Due To Saposin A Deficiency
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Krabbe disease due to saposin A deficiency is an ultra-rare autosomal recessive atypical
  globoid cell leukodystrophy caused by biallelic pathogenic variants in the saposin A-coding
  domain of PSAP (encoding prosaposin). Saposin A is the essential in vivo lysosomal
  sphingolipid activator protein required by galactosylceramidase (GALC) to hydrolyze
  galactosylceramide and galactosylsphingosine (psychosine). Despite an intact GALC gene,
  loss of saposin A leads to intralysosomal galactosylceramide storage, elevated psychosine,
  impaired autophagosome-lysosome fusion, and progressive central white-matter demyelination
  with peripheral axonal polyneuropathy, producing an infantile neurodegenerative presentation
  nearly indistinguishable from classic infantile Krabbe disease.
notes: >-
  ClinGen data/clingen/ check on 2026-11-12 returned zero gene-disease validity assertions for
  PSAP (hgnc:9498) or MONDO:0012720. GeneReviews Bookshelf index check (snapshot 2026-09-10,
  verified 2026-11-12) confirmed NO_CHAPTER for MONDO:0012720 (the classic Krabbe Disease
  chapter covers GALC-deficient Krabbe disease rather than PSAP saposin A deficiency).

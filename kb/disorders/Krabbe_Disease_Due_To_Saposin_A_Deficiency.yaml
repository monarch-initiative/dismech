      label: autophagosome-lysosome fusion
  - preferred_term: autophagy
    modifier: DYSREGULATED
    term:
      id: GO:0006914
      label: autophagy
  - preferred_term: lysosome organization
    modifier: DYSREGULATED
    term:
      id: GO:0007040
      label: lysosome organization
  evidence:
  - reference: PMID:29995202
    reference_title: "The Second Case of Saposin A Deficiency and Altered Autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Autophagosome-lysosome fusion is impaired in saposin A-deficient fibroblasts. We demonstrated that the extent of LAMP1/LC3A colocalization was reduced (ranging from 50 to 60%) in the proband fibroblast compared to those of the father and brother (Fig. 6a, b)."
    explanation: "Directly demonstrates impaired autophagosome-lysosome fusion in primary fibroblasts from a patient with saposin A deficiency."
  - reference: PMID:29995202
    reference_title: "The Second Case of Saposin A Deficiency and Altered Autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data suggest that accumulation of autophagosomes (Fig. 5b, c) in saposin A-deficient fibroblasts is due to defective clearance caused by impaired autophagosome-lysosome fusion (Fig. 6a, b)."
    explanation: "Clarifies that elevated LC3A and p62 reflect blocked autophagic clearance rather than solely increased autophagosome biogenesis."
  - reference: PMID:29995202
    reference_title: "The Second Case of Saposin A Deficiency and Altered Autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fluorescence microscopic imaging of lysosomal-associated membrane protein (LAMP1) revealed increased numbers of lysosomal vesicles in proband fibroblast (Fig. 4c), compared to healthy family members (Fig. 4a, b)."
    explanation: "Confirms expansion of the LAMP1-positive lysosomal compartment alongside impaired autophagic flux."
  downstream:
  - target: Progressive encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Impaired autophagic-lysosomal clearance compounds glycosphingolipid neurotoxicity in progressive neurodegeneration.

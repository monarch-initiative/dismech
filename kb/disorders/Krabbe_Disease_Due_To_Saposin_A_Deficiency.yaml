  evidence:
  - reference: PMID:15773042
    reference_title: "A mutation in the saposin A coding region of the prosaposin gene in an infant presenting as Krabbe disease: first report of saposin A deficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A three base pair deletion was found in the saposin A coding sequence of the prosaposin gene leading to the deletion of a conserved valine at amino acid number 11 of the saposin A protein."
    explanation: "Identifies the first human PSAP saposin A-domain variant abolishing saposin A cofactor function."
  - reference: PMID:29995202
    reference_title: "The Second Case of Saposin A Deficiency and Altered Autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, at whole exome sequencing, the previously undescribed homozygous, obviously pathogenic PSAP gene NM_002778.3:c.209T>G(p.Val70Gly) variant was determined in the saposin A domain of the PSAP gene."
    explanation: "Confirms biallelic saposin A-domain PSAP mutation in the second reported human patient with intact GALC sequencing."
  - reference: PMID:31439510
    reference_title: "Rare Saposin A deficiency: Novel variant and psychosine analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present the case of an 18-month-old male with clinical and radiological findings concerning for Krabbe disease who had preserved GALC enzyme activity and negative GALC gene sequencing, but was found to have a homozygous variant, c.257 T > A (p.I86N), in the saposin A peptide of PSAP."
    explanation: "Documents the third human case carrying a homozygous saposin A-peptide variant with preserved GALC enzyme activity."
  downstream:
  - target: Galactosylceramide and Psychosine Accumulation
    causal_link_type: DIRECT
    description: Loss of saposin A blocks GALC-mediated hydrolysis of galactosylceramide and psychosine in lysosomes.
    evidence:
    - reference: PMID:15773042
      reference_title: "A mutation in the saposin A coding region of the prosaposin gene in an infant presenting as Krabbe disease: first report of saposin A deficiency in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This deletion in saposin A is proposed as the cause for the abnormal galactosylceramide metabolism in this infant."
      explanation: "Links the PSAP saposin A-domain defect directly to impaired galactosylceramide catabolism."
- name: Galactosylceramide and Psychosine Accumulation
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  biological_scale: CELLULAR
  description: >-
    Without saposin A to solubilize and present membrane glycosphingolipid substrates to GALC,
    undegraded galactosylceramide (GalCer) and other neutral glycosphingolipids accumulate
    within lysosomes, accompanied by systemic elevation of cytotoxic galactosylsphingosine
    (psychosine) detectable on dried blood spot analysis.

differential_diagnoses:
- name: Krabbe disease
  description: >-
    Classic globoid cell leukodystrophy caused by biallelic GALC loss-of-function variants,
    presenting with a near-identical infantile leukodystrophy, optic nerve enlargement, and
    elevated dried blood spot psychosine.
  disease_term:
    preferred_term: Krabbe disease
    term:
      id: MONDO:0009499
      label: Krabbe disease
  distinguishing_features:
  - Classic Krabbe disease has biallelic pathogenic GALC variants and severely deficient GALC activity across both leukocytes and cultured skin fibroblasts, whereas saposin A deficiency has negative GALC sequencing, preserved or intermediate GALC enzyme activity, and biallelic pathogenic variants in the saposin A domain of PSAP.
  evidence:
  - reference: PMID:29995202
    reference_title: "The Second Case of Saposin A Deficiency and Altered Autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A clinical manifestation almost identical to Krabbe disease is observed when, instead of the galactosylceramidase protein, the saposin A molecule is defective."
    explanation: "Saposin A deficiency is clinically near-identical to GALC-deficient Krabbe disease and requires molecular and enzymatic differentiation."
  - reference: PMID:31439510
    reference_title: "Rare Saposin A deficiency: Novel variant and psychosine analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present the case of an 18-month-old male with clinical and radiological findings concerning for Krabbe disease who had preserved GALC enzyme activity and negative GALC gene sequencing, but was found to have a homozygous variant, c.257 T > A (p.I86N), in the saposin A peptide of PSAP."
    explanation: "Preserved GALC activity and negative GALC sequencing distinguish saposin A deficiency from classic GALC-deficient Krabbe disease."
animal_models:
- name: Saposin A-deficient (Psap C106F) mouse
  species: Mouse
  genotype: Psap p.Cys106Phe homozygous knock-in (Saposin A-/-)
  publication: PMID:11371512
  description: >-
    Targeted Cys106Phe substitution eliminating a conserved disulfide bond in the saposin A
    domain of murine prosaposin produces specific saposin A deficiency with chronic globoid
    cell leukodystrophy pathology and galactosylceramide accumulation, though with a milder,
    later-onset clinical course (onset ~2.5 months, survival up to 5 months) than the early
    infantile human disease.
  modeled_mechanisms:
  - target: Galactosylceramide and Psychosine Accumulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    divergences:
    - divergence_type: SPECIES_MISMATCH
      description: Murine prosaposin C106F knock-in retains intact murine saposin C that partially compensates for saposin A deficiency in vivo.
    - divergence_type: TEMPORAL_SCOPE
      description: Saposin A(-/-) mice exhibit a late-onset chronic leukodystrophy (onset ~2.5 months, survival up to 5 months) rather than the acute early-infantile human neurodegeneration.
    limitations: >-
      Saposin A(-/-) mice develop a late-onset chronic leukodystrophy (onset ~2.5 months,
      survival up to 5 months), likely due to partial compensation by intact murine saposin C,
      whereas reported human infants present with severe early-infantile neurodegeneration.
    evidence:
    - reference: PMID:11371512
      reference_title: "A mutation in the saposin A domain of the sphingolipid activator protein (prosaposin) gene results in a late-onset, chronic form of globoid cell leukodystrophy in the mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Pathology and analytical biochemistry were qualitatively identical to, but generally much milder than, that seen in the typical infantile globoid cell leukodystrophy (GLD) in man (Krabbe disease) and in several other mammalian species, due to genetic deficiency of lysosomal galactosylceramidase (GALC) (EC 3.2.1.46)."
      explanation: "Confirms biochemical and pathological recapitulation of globoid cell leukodystrophy with milder chronic tempo in mouse."
    - reference: PMID:17986137
      reference_title: "The function of sphingolipids in the nervous system: lessons learnt from mouse models of specific sphingolipid activator protein deficiencies."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Saposin A deficient mice showed the clinical, biochemical and pathological phenotype of a chronic form of globoid cell leukodystrophy (Krabbe disease) establishing that saposin A is essential for in vivo degradation of galactosylceramide."
      explanation: "Summarizes the mechanistic proof from Saposin A-deficient mice that saposin A is indispensable for in vivo galactosylceramide degradation."
treatments:
- name: Supportive Care
  therapeutic_modality: OTHER
  description: >-
    No saposin-A-specific disease-modifying therapy has been established; clinical management
    is supportive and multidisciplinary, addressing refractory seizures, hypertonia, and
    infantile feeding difficulties.
  notes: >-
    None of the three published human case reports (PMID:15773042, PMID:29995202,
    PMID:31439510) reports a disease-modifying therapy for saposin A deficiency.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:29995202
    reference_title: "The Second Case of Saposin A Deficiency and Altered Autophagy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Much still remains to be explained concerning the roles of activator proteins in the lysosomal and degradation pathways, their interactions with other proteins, and whether or not these will have a role to play in the treatment of lysosomal storage diseases in the future."
    explanation: "Indicates that activator-protein-targeted therapy is not yet established for lysosomal storage diseases; no disease-specific therapy is reported for saposin A deficiency."
definitions:
- name: Clinical case definition of saposin A deficiency Krabbe disease
  definition_type: CASE_DEFINITION
  description: >-
    Krabbe disease due to saposin A deficiency is an autosomal recessive atypical globoid cell
    leukodystrophy defined by biallelic pathogenic variants in the saposin A-coding domain of
    PSAP, producing galactosylceramide and psychosine accumulation with central and peripheral
    demyelination despite a genetically intact GALC gene.
  scope: Disease-level case definition for saposin A deficiency Krabbe disease.
  evidence:
  - reference: PMID:29995202
    reference_title: "The Second Case of Saposin A Deficiency and Altered Autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A clinical manifestation almost identical to Krabbe disease is observed when, instead of the galactosylceramidase protein, the saposin A molecule is defective."
    explanation: "Anchors the case definition in saposin A deficiency producing a Krabbe-like disease."

diagnosis:
- name: Galactosylceramidase assay pattern across specimens
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >-
    A Krabbe-like clinical and MRI presentation accompanied by normal or only mildly reduced
    galactosylceramidase (GALC) activity (including discordant low leukocyte/dried-blood-spot
    activity with preserved fibroblast or leukocyte activity above classic infantile Krabbe
    ranges) and negative GALC sequencing implicates a saposin A activator deficiency.
  markers: Discordant or preserved galactosylceramidase activity despite Krabbe-spectrum leukodystrophy; abnormal galactosylceramide storage.
  measurements:
  - preferred_term: Galactosylceramidase activity (leukocyte)
    term:
      id: LOINC:24084-6
      label: Galactosylceramidase [Enzymatic activity/mass] in Leukocytes
  - preferred_term: Galactosylceramidase activity (fibroblast)
    term:
      id: LOINC:24083-8
      label: Galactosylceramidase [Enzymatic activity/mass] in Fibroblast
  notes: >-
    Bound both specimen-specific codes rather than the specimen-generic Part
    code (LOINC:LP14027-4, bound on the separate classic Krabbe_Disease.yaml
    entry): the diagnostic claim this row makes is specifically the
    leukocyte-versus-fibroblast discordance (deficient in leukocytes, normal in fibroblasts),
    which is what distinguishes this activator-deficiency variant from
    classic GALC-deficient Krabbe disease. A single generic code would erase
    the distinguishing fact. No reference_ranges band is recorded: the
    source states "did not show a similar enzyme deficiency" qualitatively,
    with no numeric cut-off for either specimen.
  evidence:
  - reference: PMID:15773042
    reference_title: "A mutation in the saposin A coding region of the prosaposin gene in an infant presenting as Krabbe disease: first report of saposin A deficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When cultured skin fibroblasts did not show a similar enzyme deficiency and sulphatide (stearoyl-1-14C) uptake indicated an abnormal storage of\ngalactosylceramide, a deficiency of an activator was implied."
    explanation: "Normal fibroblast GALC activity combined with abnormal galactosylceramide storage points to saposin A activator deficiency."
  - reference: PMID:29995202
    reference_title: "The Second Case of Saposin A Deficiency and Altered Autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Investigation directed toward saposin A deficiency must be considered when clinical and radiological diagnosis of Krabbe disease is not supported by enzymatic and genetic methods."
    explanation: "Highlights the diagnostic imperative to test PSAP when GALC enzymatic and genetic results do not confirm classic Krabbe disease."

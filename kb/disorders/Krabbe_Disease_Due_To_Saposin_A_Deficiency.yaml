- name: Saposin A Deficiency from PSAP Variants
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  biological_scale: MOLECULAR
  description: >-
    Saposin A is generated by proteolytic processing of prosaposin (encoded by PSAP) into
    four mature lysosomal activator glycoproteins (saposins A-D). Biallelic pathogenic variants
    in the saposin A-coding domain of PSAP abolish saposin A function, eliminating the essential
    in vivo cofactor required for galactosylceramidase (GALC) stabilization and substrate
    presentation despite a genetically intact GALC enzyme.

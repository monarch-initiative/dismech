    snippet: "sulphatide (stearoyl-1-14C) uptake indicated an abnormal storage of\ngalactosylceramide"
    explanation: "Metabolic labeling in patient cells demonstrated abnormal intralysosomal galactosylceramide storage."
  - reference: PMID:29995202
    reference_title: "The Second Case of Saposin A Deficiency and Altered Autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We detected significant increases in the levels of GalCer (Fig. 3b), LacCer (Fig. 3c), Cer (Fig. 3d), and GlcCer (Fig. 3e) in the proband fibroblast cell compared to the control group, 3.5-fold, 1.5-fold, 2-fold, and 1.4-fold, respectively."
    explanation: "Thin-layer chromatography of patient primary skin fibroblasts quantified a 3.5-fold accumulation of galactosylceramide."
  - reference: PMID:31439510
    reference_title: "Rare Saposin A deficiency: Novel variant and psychosine analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Psychosine determination on dried blood spot at 18 months of age was elevated to 12 nmol/L (normal <3 nmol/L)."
    explanation: "Demonstrates 4-fold elevation of cytotoxic psychosine in human saposin A deficiency."
  downstream:
  - target: Autophagic-Lysosomal Dysfunction
    causal_link_type: DIRECT
    description: Intralysosomal glycosphingolipid storage expands the lysosomal compartment and impairs autophagosome-lysosome fusion.
    evidence:
    - reference: PMID:29995202
      reference_title: "The Second Case of Saposin A Deficiency and Altered Autophagy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Fibroblast studies showed GalCer accumulation and the activation of autophagy for the first time in a case of human saposin A deficiency."
      explanation: "Links galactosylceramide storage to altered autophagy in human saposin A-deficient fibroblasts."
  - target: Central Nervous System White Matter Demyelination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Galactosylceramide and cytotoxic psychosine accumulation in myelinating oligodendrocytes drives central white-matter demyelination.
    evidence:
    - reference: PMID:11371512
      reference_title: "A mutation in the saposin A domain of the sphingolipid activator protein (prosaposin) gene results in a late-onset, chronic form of globoid cell leukodystrophy in the mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Pathology and analytical biochemistry were qualitatively identical to, but generally much milder than, that seen in the typical infantile globoid cell leukodystrophy (GLD) in man (Krabbe disease) and in several other mammalian species, due to genetic deficiency of lysosomal galactosylceramidase (GALC) (EC 3.2.1.46). Thus, saposin A is indispensable for in vivo degradation of galactosylceramide by GALC."
      explanation: "Establishes that failed in vivo galactosylceramide degradation in saposin A deficiency causes globoid cell leukodystrophy demyelination."
  - target: Peripheral Nerve Axonal Degeneration and Demyelination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Glycosphingolipid and psychosine toxicity in Schwann cells and peripheral nerves drives severe peripheral polyneuropathy.
- name: Autophagic-Lysosomal Dysfunction
  conforms_to: "lysosomal_substrate_accumulation#Autophagic-Lysosomal Dysfunction and Secondary Cascade"
  biological_scale: CELLULAR
  description: >-
    Lysosomal glycosphingolipid storage in saposin A-deficient cells causes at least a twofold
    expansion of LAMP1-positive lysosomal vesicles and blocks autophagic flux by impairing
    autophagosome-lysosome fusion (50-60% reduction in LAMP1/LC3A colocalization), leading to
    intracellular accumulation of LC3A- and p62-positive autophagosomes.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  cellular_components:

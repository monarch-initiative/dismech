name: Hypotonia, Ataxia, Developmental Delay, and Tooth Enamel Defect Syndrome
creation_date: "2026-10-24T01:30:00Z"
description: >-
  An ultra-rare autosomal dominant neurodevelopmental disorder (HADDTS;
  MONDO:0060666, OMIM:617915) caused by heterozygous, almost always de novo,
  variants in CTBP1, which encodes the NAD(H)-sensing transcriptional
  corepressor C-terminal binding protein 1. Most reported patients carry the
  same recurrent missense variant, p.Arg342Trp on the long nuclear isoform
  (NM_001328.2:c.1024C>T), reported as p.Arg331Trp (c.991C>T) on the MANE
  Select transcript NM_001012614.2. The variant lies at the edge of the
  PXDLS-motif binding cleft through which CtBP1 recruits histone deacetylases,
  histone methyltransferases, LSD1, CoREST and zinc-finger repressors, and the
  mutant protein binds these cofactors less well. The clinical picture is
  infant-onset global developmental delay and intellectual disability with
  impaired speech, hypotonia, a cerebellar syndrome (ataxia, dysarthria,
  dysmetria, oculomotor apraxia) usually with cerebellar atrophy on MRI, and
  hypoplastic or discoloured tooth enamel, frequently with feeding difficulty,
  failure to thrive and a myopathic component. A subset regress, and several
  patients have secondary mitochondrial respiratory chain deficiency in muscle
  or reduced respiratory capacity in blood cells. Patient iPSC-derived neurons
  and isogenic edited lines show downregulated neurodevelopmental
  transcriptional programs with abnormal neural cell adhesion, migration,
  neurite morphology and calcium signalling. No disease-modifying therapy
  exists and management is supportive.
category: Mendelian
parents:
- hereditary disease
synonyms:
- HADDTS
- CTBP1-related neurodevelopmental disorder

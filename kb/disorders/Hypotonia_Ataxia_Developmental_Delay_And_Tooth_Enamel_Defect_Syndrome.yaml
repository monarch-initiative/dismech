    term:
      id: GO:0017053
      label: transcription repressor complex
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:31041561
    reference_title: A pathogenic CtBP1 missense mutation causes altered cofactor binding and transcriptional activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These factors included various Zn-finger transcription factors (such as Znf217, ZEB1, ZEB2, and WIZ), histone deacetylases (HDAC1 and 2), histone methyltransferases (G9a and GLA), histone H3-K4 demethylase (LSD-1), and the co-repressor CoREST."
    explanation: Lists the corepressor complex components whose binding to the mutant is reduced.
  downstream:
  - target: Dysregulated Neurodevelopmental Gene Expression
    causal_link_type: DIRECT
    description: >-
      Weaker corepressor assembly changes transcription of CtBP1 target genes.
    evidence:
    - reference: PMID:31041561

inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    A single heterozygous CTBP1 variant is sufficient. Expressivity is variable
    even among carriers of the identical recurrent variant, from an ataxic gait
    with age-appropriate cognition to non-ambulation with profound disability
    and regression. No affected parent-to-child transmission has been reported;
    the dominant mode is inferred from heterozygous de novo occurrence.
  evidence:
  - reference: PMID:34608870
    reference_title: Exome sequencing identified a de novo frameshift pathogenic variant of CTBP1 in an extremely rare case of HADDTS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypotonia, ataxia, developmental delay, and tooth enamel defect syndrome (HADDTS) is an extremely rare autosomal dominant genetic disease caused by disruptive pathogenic variants in CTBP1."
    explanation: States the autosomal dominant mode of inheritance for HADDTS.
  - reference: PMID:42589715
    reference_title: "Delineating the CTBP1-Related Phenotypic Spectrum: A Review of HADDTS and Atypical Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The recurrent p.Arg342Trp (NM_001328.2; p.Arg331Trp, MANE Select NM_001012614.2) accounts for 84%, with severity from mild impairment to profound disability."
    explanation: >-
      Pooled review of 25 published cases documenting variable expressivity of
      the same recurrent allele.
- name: De Novo
  inheritance_term:
    preferred_term: Typically de novo
    term:
      id: HP:0025352
      label: Typically de novo
  description: >-
    Nearly all reported variants arose de novo. The one documented exception is
    an apparently de novo case in which the variant was transmitted from a
    clinically unaffected mother with germline mosaicism, so recurrence risk
    for parents of an affected child is low but not zero.
  evidence:
  - reference: PMID:36331689
    reference_title: "CTBP1 and CTBP2 mutations underpinning neurological disorders: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "These mutations were de novo in 13 cases and one case of maternal germinal mosaicism."
    explanation: >-
      Systematic review of the first fourteen cases: thirteen de novo and one
      transmitted through maternal germline mosaicism.

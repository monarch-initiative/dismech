      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Genome-wide transcriptome analysis in human glioblastoma cell lines expressing -CtBP1 R342 (wt) or W342 mutation revealed changes in the expression profiles of genes controlling multiple cellular processes."
      explanation: Links the cofactor-binding mutant to altered target-gene expression.
  - target: NOXA Derepression and Increased Apoptotic Susceptibility
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Under glucose deprivation, when NADH falls, the mutant fails to keep the

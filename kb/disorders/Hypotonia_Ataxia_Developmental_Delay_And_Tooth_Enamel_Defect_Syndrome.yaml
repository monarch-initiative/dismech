- name: Secondary Mitochondrial Respiratory Chain Dysfunction
  biological_scale: CELLULAR
  description: >-
    Respiratory chain enzymology of patient muscle has shown reduced complex I
    and complex IV activity (57% and 35% of control in one patient; complex IV
    6%, complex I 23% and complex II+III 15% in another), with patchy loss of
    COX histochemistry in one biopsy and structural mitochondrial abnormalities
    on electron microscopy in another. In a further patient, peripheral blood
    mononuclear cells showed reduced maximal and spare respiratory capacity by
    extracellular flux analysis. CTBP1 encodes no respiratory chain component,
    so the defect is regarded as secondary; the mechanism is unknown.

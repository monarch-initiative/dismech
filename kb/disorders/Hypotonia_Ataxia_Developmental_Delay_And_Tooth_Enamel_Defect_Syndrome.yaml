notes: >-
  No GeneReviews chapter exists for this disorder (see `just check-genereviews`).
  HADDTS is defined clinically by the tetrad in its name, but neither the
  enamel defect nor cerebellar atrophy is obligate: two carriers of the
  recurrent variant had no detectable enamel defect and three had a normal
  brain MRI. Seizures and skeletal anomalies such as pectus excavatum have been
  reported only in carriers of non-recurrent CTBP1 variants and are not
  modelled as HADDTS phenotypes here. The short CTBP1 isoform CtBP1-S/BARS
  is a membrane-fission factor needed for post-Golgi trafficking and neurite
  growth (PMID:35455998); no study has tested whether HADDTS variants impair
  that function, so it is not modelled as a separate mechanism node. Human embryonic
  stem cell lines carrying the variant (heterozygous and homozygous) have been
  generated as a resource (PMID:36610307) without reported phenotypes. Ctbp1
  null mice are small but viable and fertile (PMID:12101226); a knockout is not
  a model of the missense allele and is not linked here.

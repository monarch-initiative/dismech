- name: Abnormal Neurite, Dendrite, and Excitatory Synapse Development
  biological_scale: CELLULAR
  description: >-
    Variant-expressing neurons show abnormal process development and synaptic
    function. Patient iPSC-derived neurons have thinner neurites and altered
    intracellular calcium transients; isogenic mutant neurons extend neurites
    prematurely. Expression of p.R342W reduces dendrite number and length in
    cultured hippocampal neurons and, in vivo, disrupts dendritic arborization
    and spine formation and reduces excitatory synaptic transmission. CtBP1 is
    enriched at presynaptic active zones and shuttles to the nucleus in an
    activity- and NAD/NADH-dependent way, which places the corepressor at the
    junction of synaptic activity and gene expression.

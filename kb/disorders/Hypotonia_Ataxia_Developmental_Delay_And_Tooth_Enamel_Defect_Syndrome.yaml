- name: Cerebellar Developmental Vulnerability and Volume Loss
  biological_scale: TISSUE
  description: >-
    The cerebellum is the dominant site of clinical involvement: most patients
    have cerebellar signs and cerebellar volume loss, mostly of the vermis, on
    MRI, progressive on serial imaging in some. In mouse, CtBP1 is expressed
    in cerebellar Purkinje and granule cells, and the variant downregulates
    transcription factors for granule cell development in human neurons.
    Whether the volume loss is hypoplasia, degeneration or both has not been
    resolved, and no human cerebellar histology has been reported.

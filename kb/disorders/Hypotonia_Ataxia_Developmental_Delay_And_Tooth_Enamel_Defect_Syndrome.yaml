pathophysiology:
- name: CTBP1 PXDLS-Cleft Missense Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A heterozygous, usually de novo, CTBP1 missense variant replaces arginine
    342 (CtBP1-L numbering) with tryptophan at the C-terminal edge of the
    PXDLS-motif binding cleft, the main protein-interaction surface by which
    CtBP1 assembles chromatin-modifying corepressor complexes. The variant does
    not remove the protein: its effect is on which partners the corepressor
    binds.
  gene:
    preferred_term: CTBP1
    term:
      id: hgnc:2494
      label: CTBP1
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: >-
      Recurrent missense p.Arg342Trp (NM_001328.2) / p.Arg331Trp
      (NM_001012614.2). functional_impact_category is left unset because a
      dominant-negative effect is inferred, not demonstrated.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:27094857
    reference_title: "A recurrent de novo CTBP1 mutation is associated with developmental delay, hypotonia, ataxia, and tooth enamel defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The R331W variant found in these patients is within the C-terminal portion of the PLDLS (Pro-Leu-Asp-Leu-Ser) binding cleft, which is the domain through which CTBP1, interacts with chromatin-modifying enzymes and mediates chromatin-dependent gene repression pathways."
    explanation: Places the recurrent variant in the cofactor-binding cleft of the corepressor.
  downstream:
  - target: Reduced Corepressor Cofactor Recruitment by CtBP1
    causal_link_type: DIRECT
    description: >-
      The substitution weakens binding of PXDLS-motif partners to the cleft.
    evidence:
    - reference: PMID:31041561
      reference_title: A pathogenic CtBP1 missense mutation causes altered cofactor binding and transcriptional activity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Unbiased proteomic analysis demonstrated reduced interaction of several chromatin-modifying factors with the CtBP1 W342 mutant."
      explanation: Shows the variant reduces cofactor binding in cultured cells.
  - target: Secondary Mitochondrial Respiratory Chain Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Respiratory chain deficiency has been found in muscle of several patients
      with the recurrent variant, but the steps linking the corepressor defect
      to mitochondrial function have not been worked out.
    evidence:
    - reference: PMID:36341169
      reference_title: Mitochondrial respiratory chain dysfunction in a patient with a heterozygous de novo CTBP1 variant.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pathogenic variants in the CTBP1 gene may be associated with secondary mitochondrial dysfunction."
      explanation: Authors' synthesis that the mitochondrial defect is secondary to the CTBP1 variant.
- name: Reduced Corepressor Cofactor Recruitment by CtBP1
  biological_scale: MOLECULAR
  description: >-
    In cells expressing the W342 mutant, mass spectrometry and immunoblotting
    of CtBP1 complexes showed reduced association of zinc-finger transcription
    factors (ZNF217, ZEB1, ZEB2, WIZ), histone deacetylases HDAC1 and HDAC2,
    the H3K9 methyltransferases G9a and GLP, the H3K4 demethylase LSD1 and the
    scaffold CoREST, all established components of the CtBP1 corepressor
    complex. HDAC2 binding was variably affected. CtBP1 also forms dimers with
    CtBP2, and whether mutant subunits impair CtBP2-containing complexes is
    proposed but untested.
  gene:
    preferred_term: CTBP1
    term:
      id: hgnc:2494
      label: CTBP1
  molecular_functions:
  - preferred_term: CtBP1 transcription corepressor activity
    term:
      id: GO:0003714
      label: transcription corepressor activity
    modifier: DECREASED
  cellular_components:

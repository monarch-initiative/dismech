diagnosis:
- name: Exome or genome sequencing
  description: >-
    Diagnosis is molecular, by exome or genome sequencing identifying a
    heterozygous CTBP1 variant, usually the recurrent p.Arg342Trp. The
    phenotype is non-specific in infancy and several patients were first
    investigated for primary mitochondrial disease or congenital myopathy.
  evidence:
  - reference: PMID:28955726
    reference_title: De novo CTBP1 variant is associated with decreased mitochondrial respiratory chain activities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the fifth known patient harboring a recurrent pathogenic de novo c.991C>T p.(Arg331Trp) CTBP1 variant, who was initially suspected to have an autosomal recessive mitochondrial disorder."
    explanation: Exome-based diagnosis in a patient first suspected to have a recessive mitochondrial disorder.
  - reference: PMID:40959803
    reference_title: "Hypotonia, Ataxia, Developmental Delay and Tooth Enamel Defect Syndrome (HADDTS) due to a Heterozygous de Novo Missense Variant in CTBP1 Identified via Whole Genome Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After many years of genetic testing where no diagnosis was found, whole genome sequencing (WGS) identified a missense variant in the CTBP1 gene (NM_001012614.1): c.991C > T p.(Arg331Trp)."
    explanation: Genome sequencing ended a long diagnostic odyssey.
treatments:
- name: Supportive Multidisciplinary Care
  description: >-
    No disease-modifying therapy exists. Management is supportive: neurological
    and developmental follow-up with rehabilitation, nutritional support for
    dysphagia and failure to thrive including gastrostomy, respiratory care,
    early dental care for the enamel defect, speech and language therapy with
    augmentative communication, and orthopaedic management of scoliosis and
    contractures.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:42589715
    reference_title: "Delineating the CTBP1-Related Phenotypic Spectrum: A Review of HADDTS and Atypical Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "No disease-modifying therapies exist as of July 2026; management is supportive, symptomatic, and multidisciplinary"
    explanation: States the absence of disease-modifying therapy and the supportive approach.
- name: Mitochondrial Cofactor Supplementation
  description: >-
    In one 9-year-old patient, a year of coenzyme Q10, riboflavin, vitamin C and
    vitamin E improved maximal and spare respiratory capacity of blood cells
    and was associated with fewer respiratory infections, but no neurological
    improvement or new skills. This is a single uncontrolled case.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Dietary supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
    - preferred_term: vitamin C
      term:
        id: CHEBI:29073
        label: L-ascorbic acid
    - preferred_term: vitamin E
      term:
        id: CHEBI:22470
        label: alpha-tocopherol
  target_mechanisms:
  - target: Secondary Mitochondrial Respiratory Chain Dysfunction
    description: Intended to support respiratory chain function.
    evidence:
    - reference: PMID:42123581
      reference_title: "A Rare CTBP1-Related Neurodevelopmental Disorder Is Associated with Impaired Mitochondrial Bioenergetics: A Functional Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Following mitochondria-targeted nutritional support for one-year measurable bioenergetic improvements and reduced number of respiratory infections were registered."
      explanation: Bioenergetic improvement after supplementation in one patient.
  evidence:
  - reference: PMID:42123581
    reference_title: "A Rare CTBP1-Related Neurodevelopmental Disorder Is Associated with Impaired Mitochondrial Bioenergetics: A Functional Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The therapeutic regimen consisted of vitamin C (100 mg/day), riboflavin (vitamin B2, 50 mg/day), vitamin E (200 mg/day), and coenzyme Q10 (200 mg/day)."
    explanation: Composition of the supplementation regimen.
  - reference: PMID:42123581
    reference_title: "A Rare CTBP1-Related Neurodevelopmental Disorder Is Associated with Impaired Mitochondrial Bioenergetics: A Functional Case Report."
    supports: REFUTE

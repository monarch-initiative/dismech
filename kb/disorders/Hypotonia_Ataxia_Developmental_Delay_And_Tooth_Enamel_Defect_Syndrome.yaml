    modifier: INCREASED
  - preferred_term: cellular response to glucose starvation
    term:
      id: GO:0042149
      label: cellular response to glucose starvation
    modifier: ABNORMAL
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:31041561
    reference_title: A pathogenic CtBP1 missense mutation causes altered cofactor binding and transcriptional activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient-derived dermal fibroblasts were found to be more sensitive to apoptosis during acute glucose deprivation compared to controls."
    explanation: Increased apoptosis of patient fibroblasts under glucose deprivation.

- name: NOXA Derepression and Increased Apoptotic Susceptibility
  biological_scale: CELLULAR
  description: >-
    Patient dermal fibroblasts are more sensitive to apoptosis under acute
    glucose deprivation. Glucose starvation raises NOXA (PMAIP1) transcript
    8- to 10-fold in control fibroblasts but more than 30-fold in patient
    fibroblasts, with higher NOXA protein. Because CtBP corepressor activity
    depends on NADH, the authors propose that falling NADH unmasks a repression
    defect of the mutant. Increased apoptosis in brain regions with high CtBP1
    expression, such as the cerebellum, is their hypothesis for the
    neurodevelopmental phenotype; it has not been tested in neural tissue.
  cell_types:
  - preferred_term: patient dermal fibroblast
    term:

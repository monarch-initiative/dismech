- name: Dysregulated Neurodevelopmental Gene Expression
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental Transcriptional Program"
  biological_scale: MOLECULAR
  description: >-
    Neurons derived from patient iPSCs downregulate gene networks for
    neurodevelopment, synaptic and cell-cell adhesion and the type I
    interferon response, including neuronal transcription factors such as EN1,
    ETV5 and TAL1. Isogenic iPSC lines edited to carry the variant reproduce
    downregulation of key transcription factors, more strongly in the
    homozygous than the heterozygous state, including factors needed for
    cerebellar granule cell development and Sonic hedgehog pathway genes.

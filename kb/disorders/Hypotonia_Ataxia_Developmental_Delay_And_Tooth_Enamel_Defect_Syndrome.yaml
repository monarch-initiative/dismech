genetic:
- name: CTBP1
  gene_term:
    preferred_term: CTBP1
    term:
      id: hgnc:2494
      label: CTBP1
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  presence: PRESENT
  association: >-
    Heterozygous CTBP1 variants cause HADDTS. The recurrent missense p.Arg342Trp
    (NM_001328.2:c.1024C>T; MANE Select NM_001012614.2:c.991C>T,
    p.Arg331Trp) accounts for most cases; a frameshift
    (NM_001328.3:c.1315_1316delCA, p.Gln439ValfsTer84) was reported in one
    patient with an incomplete phenotype.
  notes: >-
    Two residue numberings circulate for the same allele because CTBP1 has two
    protein-coding isoforms differing at the N-terminus: p.Arg342Trp on the
    440-residue CtBP1-L isoform (NM_001328) used by most functional papers,
    and p.Arg331Trp on the MANE Select transcript NM_001012614. Healthy
    individuals carry heterozygous CTBP1 loss-of-function alleles, so the
    recurrent missense is argued to act through a dominant-negative or
    gain-of-function effect rather than haploinsufficiency; that argument is
    population-genetic and the dominant-negative effect has not been directly
    demonstrated in patient cells. Rarer CTBP1 missense variants (p.Ser124Phe
    and p.Arg36Pro on NM_001328) were reported with phenotypes their authors
    judged distinct from HADDTS (microcephaly, dysmorphism, skeletal anomalies,
    atrial septal defect, no enamel defect); they are not modelled as HADDTS
    alleles here. No ClinGen gene-disease validity record was consulted for
    this pair, so gene_disease_validity is left empty.
  evidence:
  - reference: PMID:27094857
    reference_title: "A recurrent de novo CTBP1 mutation is associated with developmental delay, hypotonia, ataxia, and tooth enamel defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have identified four patients with similar phenotypes of developmental delay, intellectual disability, failure to thrive, hypotonia, ataxia, and tooth enamel defects who all have the same de novo R331W missense variant in C-terminal binding protein 1 (CTBP1)"
    explanation: Original report linking the recurrent de novo CTBP1 variant to the syndrome.
  - reference: PMID:31041561
    reference_title: A pathogenic CtBP1 missense mutation causes altered cofactor binding and transcriptional activity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the clinical phenotypes of seven additional individuals with the same recurrent de novo CTBP1 mutation."
    explanation: Independent replication of the recurrent de novo variant in seven more patients.
  - reference: PMID:31041561
    reference_title: A pathogenic CtBP1 missense mutation causes altered cofactor binding and transcriptional activity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Since healthy individuals with heterozygous loss of function alleles have been reported, these mutations likely act through either as a dominant negative or gain of function rather than loss of function mechanism."
    explanation: >-
      The authors' argument against haploinsufficiency, based on heterozygous
      loss-of-function alleles in healthy individuals.

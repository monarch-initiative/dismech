animal_models:
- name: Xenopus WNT11 c.814delG functional assay
  species: Xenopus laevis
  genotype: >-
    Embryos injected with wild-type WNT11, patient WNT11 c.814delG, Xenopus
    wnt11b and dominant-negative wnt11b mRNAs targeted to dorsal mesoderm and
    the gastrocoel roof plate left-right organizer
  category: Cross-species variant-function assay for a candidate laterality gene
  publication: PMID:40200693
  description: >-
    An infant with situs inversus totalis, complex heart defects and renal
    hypodysplasia carried a homozygous WNT11 truncating variant. Xenopus embryos
    were used as the in vivo readout for whether that variant retains Wnt
    signaling and morphogenetic activity: gain or dominant-negative manipulation
    of the frog wnt11b ligand shifts asymmetric pitx2c expression, whereas the
    patient allele behaves as a loss-of-function ligand and produces no laterality
    phenotype on overexpression. The model therefore adjudicates the variant
    rather than reproducing the child's syndrome.
  genes:
  - preferred_term: WNT11
    term:
      id: hgnc:12776
      label: WNT11
  modeled_mechanisms:
  - target: Nodal-PITX2 laterality signaling disruption
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Wnt11 manipulation at the left-right organizer changes the side on which
      pitx2c is expressed, placing Wnt11 ligand activity upstream of the
      Nodal-PITX2 laterality cascade that this node describes.
    limitations: >-
      The assay is mRNA overexpression and dominant-negative interference in frog
      embryos, not a WNT11-null animal, so it reports ligand signaling capacity
      rather than the consequences of the homozygous human genotype. Because the
      patient allele is a hypomorph, overexpressing it is silent — the absence of
      a laterality phenotype is the evidence for lost function, not evidence
      against WNT11 involvement, and the human case remains a single individual.
    readouts:
    - name: Side of asymmetric pitx2c expression after wnt11b gain or dominant-negative interference
      target: Nodal-PITX2 laterality signaling disruption
      direction: ALTERED
      interpretation: >-
        Both directions of Wnt11 manipulation move pitx2c away from its normal
        left-only domain, establishing that this node is Wnt11-sensitive in vivo.
      evidence:
      - reference: PMID:40200693
        reference_title: "A homozygous human WNT11 variant is associated with laterality, heart and renal defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Gain of wt Wnt11b or WNT11 induced ectopic right-sided pitx2c, leading to bilateral expression in the majority of embryos (>50% bilateral)"
        explanation: Measures the laterality readout shifting to bilateral on Wnt11 gain of function.
      - reference: PMID:40200693
        reference_title: "A homozygous human WNT11 variant is associated with laterality, heart and renal defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "dnWnt11b caused loss of pitx2c expression as the most frequent phenotype (>30% absent)"
        explanation: Measures the same readout being lost under dominant-negative Wnt11b.
    - name: Asymmetric pitx2c expression after overexpression of the patient WNT11 c.814delG allele
      target: Nodal-PITX2 laterality signaling disruption
      direction: UNCHANGED
      interpretation: >-
        A negative result that carries the argument: the patient allele cannot
        drive the laterality readout in either direction, which is what identifies
        it as a loss-of-function rather than a dominant-negative ligand.
      evidence:
      - reference: PMID:40200693
        reference_title: "A homozygous human WNT11 variant is associated with laterality, heart and renal defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "overexpression of WNT11c.814delG not only led to embryos developing no visible morphological defects, but also to no left-right axis defects being detected in the majority of manipulated embryos (>70% left-sided expression)"
        explanation: Records the explicit negative laterality readout for the patient allele.
    evidence:
    - reference: PMID:40200693
      reference_title: "A homozygous human WNT11 variant is associated with laterality, heart and renal defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "WNT11c.814delG encodes a protein with reduced stability that lost signaling activity in vivo."
      explanation: States the model's central conclusion about the patient variant's signaling capacity.
    - reference: PMID:40200693
      reference_title: "A homozygous human WNT11 variant is associated with laterality, heart and renal defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "alteration of the truncated C-terminal end can restore stability and signaling activity similarly to Xenopus dominant-negative Wnt11b"
      explanation: >-
        Structure-function control showing the loss of activity maps to the
        truncated C-terminus, which is what makes the frog assay informative about
        the human allele rather than about overexpression artefact.
  evidence:
  - reference: PMID:40200693
    reference_title: "A homozygous human WNT11 variant is associated with laterality, heart and renal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous human WNT11 variant in an infant with situs inversus totalis, complex heart defects and renal hypodysplasia, and used Xenopus embryos to functionally characterize this variant."
    explanation: Establishes the human laterality presentation that the frog assay was built to interpret.
- name: Xenopus cleavage-stage serotonergic left-right assay
  species: Xenopus laevis
  genotype: >-
    Wild-type embryos with pharmacological and molecular manipulation of
    serotonergic signaling in individual cleavage-stage blastomeres
  category: Pharmacological / blastomere-targeted perturbation of early left-right patterning
  publication: PMID:22899856
  description: >-
    Blastomere-resolution manipulation of serotonergic signaling in the frog
    embryo, used to test when the left-right axis is first specified. The
    experiments place the requirement in ventral right blastomeres at cleavage
    stages, before cilia exist and in cells that never contribute to the ciliated
    left-right organizer. This is the principal vertebrate evidence for a
    cilia-independent origin of left-right asymmetry, so the model is included
    here as a challenge to the organizer-first ordering of this entry's
    pathophysiology rather than as a model of a patient genotype.
  modeled_mechanisms:
  - target: Nodal-PITX2 laterality signaling disruption
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Serotonergic manipulation at cleavage stages randomizes left-right
      patterning upstream of the asymmetric signaling cascade, without acting
      through the ciliated organizer.
    limitations: >-
      No human laterality disorder has been attributed to pre-nervous
      serotonergic signaling, and the pathway's relevance to human left-right
      specification is unestablished; the frog cleavage-stage blastomere
      geometry that makes the experiment possible has no direct human
      counterpart. The manipulations are largely pharmacological, so
      off-target effects on early embryonic physiology cannot be excluded.
    readouts:
    - name: Left-right patterning after serotonergic manipulation of ventral right blastomeres
      target: Nodal-PITX2 laterality signaling disruption
      direction: ALTERED
      interpretation: >-
        Laterality is disturbed by manipulations restricted to cells and stages
        that predate the ciliated organizer, which is the observation that
        separates the two competing models.
      evidence:
      - reference: PMID:22899856
        reference_title: "Serotonin has early, cilia-independent roles in Xenopus left-right patterning."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The results uniformly support a role for serotonin in the cleavage-stage embryo, long before the appearance of cilia, in ventral right blastomeres that do not contribute to the ciliated organ."
        explanation: States the measured outcome and the cells and stage at which it was obtained.
    evidence:
    - reference: PMID:22899856
      reference_title: "Serotonin has early, cilia-independent roles in Xenopus left-right patterning."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Two major models exist for the origin of LR asymmetry and both implicate pre-nervous serotonergic signaling."
      explanation: >-
        Supports the model being informative about how this node is initiated,
        while recording that the field holds two competing accounts of the step
        it acts on.
treatments:
- name: Congenital heart defect surgical palliation or repair
  description: >-
    Management commonly requires staged univentricular palliation or selected
    biventricular repair according to the specific cardiac anatomy within the
    heterotaxy spectrum.
  evidence:

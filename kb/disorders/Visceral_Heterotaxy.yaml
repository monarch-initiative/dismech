  evidence:
  - reference: PMID:19876930
    reference_title: 'Disorders of left-right asymmetry: heterotaxy and situs inversus.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Cilia function is critical to the development of proper organ laterality.
    explanation: >-
      This review directly supports defective ciliary biology as an upstream
      mechanism for human heterotaxy.
  - reference: PMID:36619867
    reference_title: >-
      Understanding laterality disorders and the left-right organizer: Insights
      from zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mutations identified in patients with laterality disorders implicate
      motile cilia in establishing LR asymmetry.
    explanation: >-
      This directly links human laterality-disorder genetics to motile-cilia
      dysfunction.
  downstream:
  - target: Nodal-PITX2 laterality signaling disruption
    description: >-
      Failed left-right organizer signaling disrupts conserved downstream
      laterality pathways that pattern asymmetric organ development.
    evidence:
    - reference: PMID:36619867
      reference_title: >-
        Understanding laterality disorders and the left-right organizer:
        Insights from zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In several vertebrates, including mouse, frog and zebrafish, motile
        cilia located in a "left-right organizer" (LRO) trigger conserved
        signaling pathways that guide asymmetric organ development.
      explanation: >-
        This supports the causal edge from organizer-level ciliary dysfunction
        to failure of downstream asymmetric developmental signaling.
- name: Loss of DAND5 Nodal antagonism
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
  description: >-
    DAND5 encodes a secreted Cerberus/DAN-family antagonist that binds NODAL and
    restricts Nodal signaling during left-right axis specification. Biallelic
    loss-of-function DAND5 variants ablate Nodal inhibition, leaving Nodal
    activity unrestrained or bilateral and perturbing downstream left-right
    patterning.
  genes:
  - preferred_term: DAND5
    term:
      id: hgnc:26780
      label: DAND5
  molecular_functions:
  - preferred_term: signaling receptor inhibitor activity
    modifier: DECREASED
    term:
      id: GO:0030547
      label: signaling receptor inhibitor activity
  - preferred_term: nodal binding
    modifier: DECREASED
    term:
      id: GO:0038100
      label: nodal binding
  biological_processes:
  - preferred_term: negative regulation of nodal signaling pathway
    modifier: DECREASED
    term:
      id: GO:1900108
      label: negative regulation of nodal signaling pathway
  evidence:
  - reference: PMID:36316122
    reference_title: >-
      A novel biallelic loss-of-function variant in DAND5 causes heterotaxy
      syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using an in vitro assay, we demonstrate that the DAND5 c.197del variant is
      unable to inhibit nodal signaling when compared with the wild-type
      expression construct.
    explanation: >-
      Demonstrates that the heterotaxy-associated biallelic DAND5 frameshift
      variant abolishes DAND5-mediated Nodal signaling inhibition.
  - reference: PMID:36316122
    reference_title: >-
      A novel biallelic loss-of-function variant in DAND5 causes heterotaxy
      syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      DAND5 encodes a member of the Cerberus/DAN subfamily; in mouse and chicken
      models, Dand5 was shown to bind Nodal and inhibit the Nodal signaling
      pathway essential for left to right patterning (Marques et al. 2004;
      Tavares et al. 2007).
    explanation: >-
      Establishes the wild-type biochemical function of DAND5 in Nodal binding
      and negative regulation of the Nodal left-right signaling cascade.
  downstream:
  - target: Nodal-PITX2 laterality signaling disruption
    causal_link_type: DIRECT
    description: >-
      Loss of DAND5-mediated Nodal antagonism leaves Nodal signaling
      unrestrained, disrupting asymmetric Nodal-PITX2 left-right patterning.
    evidence:
    - reference: PMID:36316122
      reference_title: >-
        A novel biallelic loss-of-function variant in DAND5 causes heterotaxy
        syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Overexpression of the c.197del variant was unable to inhibit nodal and
        resulted in a complete loss of function when compared with the wild-type
        protein (Fig. 1E).
      explanation: >-
        Luciferase reporter assay shows complete loss of Nodal inhibition by the
        patient DAND5 frameshift variant, directly perturbing Nodal-pathway
        regulation.
    - reference: PMID:36316122
      reference_title: >-
        A novel biallelic loss-of-function variant in DAND5 causes heterotaxy
        syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        The majority of Cerl2 (DAND5 ortholog) knockout mice were found to have
        heterotaxy and left ventricular cardiac hyperplasia; 35% had a severe
        form that resulted in neonatal death (Marques et al. 2004; Araújo et al.
        2014).
      explanation: >-
        Loss of the murine DAND5 ortholog Cerl2 disrupts asymmetric Nodal
        patterning and produces visceral heterotaxy in vivo.
- name: Nodal-PITX2 laterality signaling disruption
  biological_scale: CELLULAR
  description: >-
    Downstream of cilia-driven symmetry breaking and DAND5-mediated Nodal
    restraint, abnormal Nodal signaling (whether attenuated by ZIC3 or GDF1
    deficiency or derepressed by loss of DAND5 antagonism) and altered PITX2
    activation disrupt left-right pattern formation across the developing heart
    and abdominal viscera. WNT11 is included on this node as a single-case
    candidate laterality gene whose ligand activity lies upstream of asymmetric
    pitx2c expression in Xenopus, alongside established laterality drivers ZIC3
    and GDF1. This laterality-patterning failure yields the cardio-visceral
    organ discordance that defines visceral heterotaxy.
  genes:

  evidence:
  - reference: PMID:38884711
    reference_title: Establishment of Cardiac Laterality.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This pathway involves initial asymmetric activation of a nodal signaling
      cascade at the embryonic node, followed by its propagation to the left
      lateral plate mesoderm and activation of left-sided expression of the
      Pitx2 transcription factor specifying visceral organ asymmetry.
    explanation: >-
      This directly supports nodal-PITX2 pathway disruption as a central
      mechanism connecting early laterality defects to abnormal visceral
      asymmetry.
  - reference: PMID:29442328
    reference_title: ZIC3 in Heterotaxy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Analysis of model organisms and gene expression during early development
      suggests ZIC3-related heterotaxy occurs due to defects at the earliest
      stage of left-right axis formation.
    explanation: >-
      This supports disruption of early left-right axis formation as a
      mechanistic basis for ZIC3-associated heterotaxy.
  downstream:
  - target: Right atrial isomerism
    description: Abnormal left-right patterning can specify bilateral right-sided atrial morphology.
    evidence:
    - reference: PMID:26612104
      reference_title: Cardiac and Non-Cardiac Abnormalities in Heterotaxy Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        These subgroups are - 1) Isomerism of right atrial appendage (asplenia
        syndrome); 2) Isomerism of left atrial appendage (polysplenia syndrome);
      explanation: This review defines right atrial appendage isomerism as a principal heterotaxy subgroup.
  - target: Left atrial isomerism
    description: Abnormal left-right patterning can specify bilateral left-sided atrial morphology.
    evidence:
    - reference: PMID:26612104
      reference_title: Cardiac and Non-Cardiac Abnormalities in Heterotaxy Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        These subgroups are - 1) Isomerism of right atrial appendage (asplenia
        syndrome); 2) Isomerism of left atrial appendage (polysplenia syndrome);
      explanation: This review defines left atrial appendage isomerism as a principal heterotaxy subgroup.
  - target: Atrioventricular canal defect
    description: Disturbed left-right cardiac patterning commonly disrupts atrioventricular septation.
    evidence:
    - reference: PMID:28603940
      reference_title: >-
        Outcome of prenatally diagnosed fetal heterotaxy: systematic review and
        meta-analysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Atrioventricular septal defect was the most common associated major
        cardiac anomaly found both in fetuses with LAI (pooled proportion (PP),
        59.3% (95% CI, 44.0-73.7%)), with obstructive lesions of the right
        outflow tract occurring in 35.5% of these cases, and in fetuses with RAI
        (PP, 72.9% (95% CI, 60.4-83.7%)).
      explanation: This meta-analysis supports atrioventricular septal defect as a common heterotaxy cardiac outcome.
  - target: Intestinal malrotation
    description: Abnormal visceral laterality can disrupt intestinal rotation and fixation.
    evidence:
    - reference: PMID:28603940
      reference_title: >-
        Outcome of prenatally diagnosed fetal heterotaxy: systematic review and
        meta-analysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        while intestinal malrotation was detected in 14.2% (95% CI, 2.5-33.1%) of
        LAI and 27.1% (95% CI, 7.9-52.0%) of RAI cases.
      explanation: This meta-analysis supports intestinal malrotation as an extracardiac heterotaxy outcome.
  - target: Heart block
    description: Abnormal atrial isomerism, especially left isomerism, can disrupt cardiac conduction.
    evidence:
    - reference: PMID:28603940
      reference_title: >-
        Outcome of prenatally diagnosed fetal heterotaxy: systematic review and
        meta-analysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fetal arrhythmias occurred in 36.7% (95% CI, 26.9-47.2%) of cases with LAI
        and were mainly represented by complete atrioventricular block, while this
        finding was uncommon in cases with RAI (PP, 1.3% (95% CI, 0.2-3.2%)).
      explanation: This meta-analysis supports atrioventricular block as a heterotaxy rhythm phenotype.
  - target: Asplenia
    description: Right isomerism/asplenia spectrum reflects abnormal spleen laterality development.
    evidence:
    - reference: ORPHA:157769
      reference_title: "Situs ambiguus"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Left (polysplenia syndrome) or right (asplenia syndrome) isomerism are usually observed."
      explanation: Orphanet links right isomerism/asplenia syndrome to situs ambiguus/visceral heterotaxy.
  - target: Polysplenia
    description: Left isomerism/polysplenia spectrum reflects abnormal spleen laterality development.
    evidence:

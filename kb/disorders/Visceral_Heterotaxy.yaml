- name: DAND5
  gene_term:
    preferred_term: DAND5
    term:
      id: hgnc:26780
      label: DAND5
  association: Recessive monogenic cause
  variant_origin: GERMLINE
  notes: >-
    Human evidence currently rests on two unrelated biallelic loss-of-function
    families plus an in vitro Nodal-inhibition assay; clinical exome sequencing
    in the second reported case classified c.197del as a VUS in a gene of
    uncertain significance, and ClinGen has not yet curated DAND5 for visceral
    heterotaxy.
  evidence:
  - reference: PMID:34215651
    reference_title: >-
      Whole-exome sequencing reveals a monogenic cause in 56% of individuals
      with laterality disorders and associated congenital heart defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, we detected a homozygous disease causing mutation in DAND5,
      as a novel recessive monogenic cause for heterotaxy in humans.
    explanation: >-
      Reports the first homozygous loss-of-function DAND5 variant in an
      individual with autosomal recessive human heterotaxy.
  - reference: PMID:36316122
    reference_title: >-
      A novel biallelic loss-of-function variant in DAND5 causes heterotaxy
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, with an additional case of a homozygous frameshift variant, we add
      to the genetic and functional evidence for biallelic LoF variants in DAND5
      causing an autosomal recessive heterotaxy syndrome.
    explanation: >-
      Describes a second unrelated proband with a homozygous DAND5 frameshift
      variant and functional loss of Nodal inhibition, supporting an emerging
      autosomal recessive gene-disease association.
  - reference: PMID:36316122
    reference_title: >-
      A novel biallelic loss-of-function variant in DAND5 causes heterotaxy
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was reported as a variant of uncertain significance (VUS) in a gene of
      uncertain significance (GUS).
    explanation: >-
      Documents that DAND5 remained classified clinically as a gene of uncertain
      significance at the time of the second reported biallelic family.

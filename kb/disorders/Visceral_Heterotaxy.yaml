    evidence:
    - reference: PMID:28603940
      reference_title: >-
        Outcome of prenatally diagnosed fetal heterotaxy: systematic review and
        meta-analysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fetal heterotaxy is associated with a high prevalence of cardiac
        and extracardiac anomalies.
      explanation: >-
        Systematic review and meta-analysis confirms complex congenital cardiac
        malformations as a central clinical manifestation of visceral heterotaxy.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE

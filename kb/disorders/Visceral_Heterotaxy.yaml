- name: WNT11
  gene_term:
    preferred_term: WNT11
    term:
      id: hgnc:12776
      label: WNT11
  association: Candidate recessive laterality and cardiorenal gene
  variant_origin: GERMLINE
  notes: >-
    Reported in a single infant with situs inversus totalis, complex heart
    defects and renal hypodysplasia carrying a homozygous truncating variant
    whose loss of signaling activity was established in Xenopus.
  evidence:
  - reference: PMID:40200693
    reference_title: "A homozygous human WNT11 variant is associated with laterality, heart and renal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biallelic WNT11 dysfunction should be considered a novel genetic cause of syndromal human phenotypes presenting with congenital heart defects and renal hypoplasia, with or without laterality defects."
    explanation: >-
      The authors' own framing is a proposal from one case plus functional data,
      which is why this is recorded as a candidate rather than an established
      heterotaxy gene.
animal_models:
- name: Xenopus WNT11 c.814delG functional assay
  species: Xenopus laevis
  genotype: >-
    Embryos injected with wild-type WNT11, patient WNT11 c.814delG, Xenopus
    wnt11b and dominant-negative wnt11b mRNAs targeted to dorsal mesoderm and
    the gastrocoel roof plate left-right organizer
  category: Cross-species variant-function assay for a candidate laterality gene
  publication: PMID:40200693
  description: >-
    An infant with situs inversus totalis, complex heart defects and renal
    hypodysplasia carried a homozygous WNT11 truncating variant. Xenopus embryos
    were used as the in vivo readout for whether that variant retains Wnt
    signaling and morphogenetic activity: gain or dominant-negative manipulation
    of the frog wnt11b ligand shifts asymmetric pitx2c expression, whereas the
    patient allele behaves as a loss-of-function ligand and produces no laterality
    phenotype on overexpression. The model therefore adjudicates the variant
    rather than reproducing the child's syndrome.
  genes:
  - preferred_term: WNT11
    term:
      id: hgnc:12776
      label: WNT11
  modeled_mechanisms:
  - target: Nodal-PITX2 laterality signaling disruption
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Wnt11 manipulation at the left-right organizer changes the side on which
      pitx2c is expressed, placing Wnt11 ligand activity upstream of the
      Nodal-PITX2 laterality cascade that this node describes.
    limitations: >-
      The assay is mRNA overexpression and dominant-negative interference in frog
      embryos, not a WNT11-null animal, so it reports ligand signaling capacity
      rather than the consequences of the homozygous human genotype. Because the
      patient allele is a hypomorph, overexpressing it is silent — the absence of
      a laterality phenotype is the evidence for lost function, not evidence
      against WNT11 involvement, and the human case remains a single individual.
    readouts:
    - name: Side of asymmetric pitx2c expression after wnt11b gain or dominant-negative interference
      target: Nodal-PITX2 laterality signaling disruption
      direction: ALTERED
      interpretation: >-
        Both directions of Wnt11 manipulation move pitx2c away from its normal
        left-only domain, establishing that this node is Wnt11-sensitive in vivo.
      evidence:
      - reference: PMID:40200693
        reference_title: "A homozygous human WNT11 variant is associated with laterality, heart and renal defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Gain of wt Wnt11b or WNT11 induced ectopic right-sided pitx2c, leading to bilateral expression in the majority of embryos (>50% bilateral)"
        explanation: Measures the laterality readout shifting to bilateral on Wnt11 gain of function.
      - reference: PMID:40200693
        reference_title: "A homozygous human WNT11 variant is associated with laterality, heart and renal defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "dnWnt11b caused loss of pitx2c expression as the most frequent phenotype (>30% absent)"
        explanation: Measures the same readout being lost under dominant-negative Wnt11b.
    - name: Asymmetric pitx2c expression after overexpression of the patient WNT11 c.814delG allele
      target: Nodal-PITX2 laterality signaling disruption
      direction: UNCHANGED
      interpretation: >-
        A negative result that carries the argument: the patient allele cannot
        drive the laterality readout in either direction, which is what identifies
        it as a loss-of-function rather than a dominant-negative ligand.
      evidence:
      - reference: PMID:40200693
        reference_title: "A homozygous human WNT11 variant is associated with laterality, heart and renal defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "overexpression of WNT11c.814delG not only led to embryos developing no visible morphological defects, but also to no left-right axis defects being detected in the majority of manipulated embryos (>70% left-sided expression)"
        explanation: Records the explicit negative laterality readout for the patient allele.
    evidence:
    - reference: PMID:40200693
      reference_title: "A homozygous human WNT11 variant is associated with laterality, heart and renal defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "WNT11c.814delG encodes a protein with reduced stability that lost signaling activity in vivo."
      explanation: States the model's central conclusion about the patient variant's signaling capacity.
    - reference: PMID:40200693
      reference_title: "A homozygous human WNT11 variant is associated with laterality, heart and renal defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "alteration of the truncated C-terminal end can restore stability and signaling activity similarly to Xenopus dominant-negative Wnt11b"
      explanation: >-
        Structure-function control showing the loss of activity maps to the
        truncated C-terminus, which is what makes the frog assay informative about
        the human allele rather than about overexpression artefact.
  evidence:
  - reference: PMID:40200693
    reference_title: "A homozygous human WNT11 variant is associated with laterality, heart and renal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous human WNT11 variant in an infant with situs inversus totalis, complex heart defects and renal hypodysplasia, and used Xenopus embryos to functionally characterize this variant."
    explanation: Establishes the human laterality presentation that the frog assay was built to interpret.
- name: Xenopus cleavage-stage serotonergic left-right assay
  species: Xenopus laevis
  genotype: >-
    Wild-type embryos with pharmacological and molecular manipulation of
    serotonergic signaling in individual cleavage-stage blastomeres
  category: Pharmacological / blastomere-targeted perturbation of early left-right patterning
  publication: PMID:22899856
  description: >-
    Blastomere-resolution manipulation of serotonergic signaling in the frog
    embryo, used to test when the left-right axis is first specified. The
    experiments place the requirement in ventral right blastomeres at cleavage
    stages, before cilia exist and in cells that never contribute to the ciliated
    left-right organizer. This is the principal vertebrate evidence for a
    cilia-independent origin of left-right asymmetry, so the model is included
    here as a challenge to the organizer-first ordering of this entry's
    pathophysiology rather than as a model of a patient genotype.
  modeled_mechanisms:
  - target: Nodal-PITX2 laterality signaling disruption
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Serotonergic manipulation at cleavage stages randomizes left-right
      patterning upstream of the asymmetric signaling cascade, without acting
      through the ciliated organizer.
    limitations: >-
      No human laterality disorder has been attributed to pre-nervous
      serotonergic signaling, and the pathway's relevance to human left-right
      specification is unestablished; the frog cleavage-stage blastomere
      geometry that makes the experiment possible has no direct human
      counterpart. The manipulations are largely pharmacological, so
      off-target effects on early embryonic physiology cannot be excluded.
    readouts:
    - name: Left-right patterning after serotonergic manipulation of ventral right blastomeres
      target: Nodal-PITX2 laterality signaling disruption
      direction: ALTERED
      interpretation: >-
        Laterality is disturbed by manipulations restricted to cells and stages
        that predate the ciliated organizer, which is the observation that
        separates the two competing models.
      evidence:
      - reference: PMID:22899856
        reference_title: "Serotonin has early, cilia-independent roles in Xenopus left-right patterning."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The results uniformly support a role for serotonin in the cleavage-stage embryo, long before the appearance of cilia, in ventral right blastomeres that do not contribute to the ciliated organ."
        explanation: States the measured outcome and the cells and stage at which it was obtained.
    evidence:
    - reference: PMID:22899856
      reference_title: "Serotonin has early, cilia-independent roles in Xenopus left-right patterning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Two major models exist for the origin of LR asymmetry and both implicate pre-nervous serotonergic signaling."
      explanation: >-
        Supports the model being informative about how this node is initiated,
        while recording that the field holds two competing accounts of the step
        it acts on.
diagnosis:
- name: Echocardiography
  description: >-
    Transthoracic and fetal echocardiography define intracardiac anatomy,
    atrioventricular septation defects, outflow tract obstruction, and systemic
    or pulmonary venous connections across right and left isomerism.
  diagnosis_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:36316122
    reference_title: >-
      A novel biallelic loss-of-function variant in DAND5 causes heterotaxy
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An echocardiogram done at birth confirmed this diagnosis with findings of
      levocardia, unbalanced complete atrioventricular canal defect (classified
      as Rastelli type A), patent ductus arteriosus (PDA), bicuspid aortic valve
      and abnormal blood vessel morphology including interrupted inferior vena
      cava with azygous continuation, bilateral superior vena cava without
      bridging vein, and partial anomalous pulmonary venous return.
    explanation: >-
      Illustrates neonatal echocardiography confirming the complex intracardiac
      and systemic/pulmonary venous anomalies diagnostic of heterotaxy syndrome.
- name: Prenatal and Abdominal Ultrasound Imaging
  description: >-
    Prenatal ultrasonography and postnatal abdominal ultrasound assess stomach,
    liver, and splenic situs (asplenia vs polysplenia) as well as intestinal
    malrotation.
  diagnosis_term:
    preferred_term: Ultrasound Imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:28603940
    reference_title: >-
      Outcome of prenatally diagnosed fetal heterotaxy: systematic review and
      meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal stomach and liver position were found, respectively, in 59.4%
      (95% CI, 38.1-79.0%) and 32.5% (95% CI, 11.9-57.6%) of cases with LAI,
      and in 54.5% (95% CI, 38.5-70.1%) and 45.9% (95% CI, 11.3-83.0%) of cases
      with RAI, while intestinal malrotation was detected in 14.2% (95% CI,
      2.5-33.1%) of LAI and 27.1% (95% CI, 7.9-52.0%) of RAI cases.
    explanation: >-
      Meta-analysis of prenatally diagnosed fetal heterotaxy quantifies
      ultrasound detection of abnormal stomach and liver situs and intestinal
      malrotation across left and right atrial isomerism.
  - reference: PMID:36316122
    reference_title: >-
      A novel biallelic loss-of-function variant in DAND5 causes heterotaxy
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further imaging of chest by computed tomography (CT) scan, radiography,
      and abdominal ultrasound showed left-sided isomerism, intestinal
      malrotation, transverse liver, and polysplenia (Fig. 1A).
    explanation: >-
      Supports postnatal abdominal ultrasound for defining visceral situs,
      intestinal malrotation, and splenic morphology in heterotaxy.
- name: Whole-Exome Sequencing
  description: >-
    Exome sequencing identifies monogenic causative variants in ciliary and
    Nodal-laterality signaling genes (such as ZIC3, DNAH5, PKD1L1, GDF1, and
    DAND5) in over half of probands with heterotaxy and associated congenital
    heart defects.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:34215651
    reference_title: >-
      Whole-exome sequencing reveals a monogenic cause in 56% of individuals
      with laterality disorders and associated congenital heart defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using WES, we reached a molecular diagnosis for 17 of the 30 probands
      (56.7%).
    explanation: >-
      Demonstrates the diagnostic yield of whole-exome sequencing in individuals
      with heterotaxy and laterality disorders.
treatments:
- name: Congenital heart defect surgical palliation or repair
  description: >-
    Management commonly requires staged univentricular palliation or selected
    biventricular repair according to the specific cardiac anatomy within the
    heterotaxy spectrum.
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Atrioventricular canal defect
    treatment_effect: BYPASSES
    description: >-
      Surgical biventricular repair or staged univentricular palliation
      addresses the structural intracardiac malformations resulting from
      abnormal cardiac laterality.
    evidence:
    - reference: PMID:28603940
      reference_title: >-
        Outcome of prenatally diagnosed fetal heterotaxy: systematic review and
        meta-analysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Biventricular repair was common in LAI while univentricular repair was
        required in the majority of children affected by RAI.
      explanation: >-
        Supports anatomy-directed surgical repair or univentricular palliation
        for heterotaxy-associated cardiac defects.
  evidence:
  - reference: PMID:33603285
    reference_title: 'The heterotaxy syndrome: associated congenital heart defects and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While 49 patients were palliated on the univentricular pathway, 5
      underwent biventricular repair.
    explanation: >-
      This institutional heterotaxy series directly supports congenital heart
      surgery as a central treatment modality.
  - reference: PMID:28603940
    reference_title: >-
      Outcome of prenatally diagnosed fetal heterotaxy: systematic review and
      meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biventricular repair was common in LAI while univentricular repair was
      required in the majority of children affected by RAI.
    explanation: >-
      This meta-analysis supports anatomy-specific surgical pathway selection
      across the heterotaxy spectrum.
  treatment_term:
    preferred_term: cardiac surgery
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
- name: Vaccination for asplenia or hyposplenism
  description: >-
    When heterotaxy includes asplenia or splenic hypofunction, vaccination
    against encapsulated bacteria is a core infection-prevention strategy.
  target_mechanisms:
  - target: Asplenia
    treatment_effect: BYPASSES
    description: >-
      Immunization against encapsulated bacteria compensates for absent or
      impaired splenic immune function in right-isomerism/asplenia heterotaxy.
    evidence:
    - reference: PMID:36329079
      reference_title: Asplenia and spleen hypofunction.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Early recognition of hyposplenism and proper management of asplenia are
        warranted to prevent overwhelming post-splenectomy infections through
        vaccination and antibiotic prophylaxis.
      explanation: >-
        Supports vaccination to mitigate infection susceptibility from asplenia
        or splenic hypofunction.
  evidence:
  - reference: PMID:26612104
    reference_title: Cardiac and Non-Cardiac Abnormalities in Heterotaxy Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients must be provided with special care for their susceptibility to
      infection due to absence of spleen or presence of splenic malfunction.
    explanation: >-
      This heterotaxy review links splenic dysfunction in the disease spectrum
      to the need for infection-prevention management.
  - reference: PMID:36329079
    reference_title: Asplenia and spleen hypofunction.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Early recognition of hyposplenism and proper management of asplenia are
      warranted to prevent overwhelming post-splenectomy infections through
      vaccination and antibiotic prophylaxis.
    explanation: >-
      This supports vaccination as part of preventive management for
      heterotaxy-associated asplenia or splenic hypofunction.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
- name: Antibiotic prophylaxis for asplenia or hyposplenism
  description: >-
    Antibiotic prophylaxis is part of infection-prevention care for heterotaxy
    patients who have absent or functionally impaired spleens.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Asplenia
    treatment_effect: BYPASSES
    description: >-
      Prophylactic antimicrobial therapy prevents overwhelming encapsulated
      bacterial infection in patients with congenital asplenia or hyposplenism.
    evidence:
    - reference: PMID:36329079
      reference_title: Asplenia and spleen hypofunction.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Early recognition of hyposplenism and proper management of asplenia are
        warranted to prevent overwhelming post-splenectomy infections through
        vaccination and antibiotic prophylaxis.
      explanation: >-
        Supports antibiotic prophylaxis to prevent encapsulated bacterial sepsis
        in asplenia or splenic hypofunction.
  evidence:
  - reference: PMID:36329079
    reference_title: Asplenia and spleen hypofunction.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Early recognition of hyposplenism and proper management of asplenia are
      warranted to prevent overwhelming post-splenectomy infections through
      vaccination and antibiotic prophylaxis.
    explanation: >-
      This directly supports antibiotic prophylaxis in the splenic dysfunction
      subset of heterotaxy.
  - reference: PMID:21474172
    reference_title: Post-splenectomy and hyposplenic states.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Because of the high mortality, the fulminant course, and the
      refractoriness to common treatment of overwhelming infections caused by
      encapsulated bacteria, prevention through vaccination and antibiotic
      prophylaxis is the basis of the management of patients who have had
      splenectomy or have hyposplenism.
    explanation: >-
      This reinforces antibiotic prophylaxis as standard preventive management
      when heterotaxy includes hyposplenism or asplenia.
  treatment_term:
    preferred_term: antibiotic prophylaxis

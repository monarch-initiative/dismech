discussions:
- discussion_id: heterotaxy_lr_initiation_stage
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is left-right asymmetry in vertebrates initiated by the ciliated left-right
    organizer, or is the axis already specified at cleavage stages by
    cilia-independent signaling that the organizer subsequently amplifies?
  attaches_to:
  - pathophysiology#Left-right organizer ciliary dysfunction
  rationale: >-
    This entry orders its pathophysiology with organizer ciliary dysfunction
    upstream of Nodal-PITX2 signaling, which matches the human genetics: most
    identified heterotaxy genes are motile-cilia genes. Blastomere-resolution
    work in Xenopus argues that serotonergic signaling specifies the axis at
    cleavage stages, in ventral right cells that never contribute to the
    ciliated organizer — before cilia exist at all. If that ordering is right,
    ciliary dysfunction would be a step at which an already-specified axis fails
    to be read out robustly rather than the symmetry-breaking event itself. The
    distinction matters for what an unexplained heterotaxy case should be
    screened for, and roughly half of affected individuals still have no
    identified causative gene.
  evidence:
  - reference: PMID:22899856
    reference_title: "Serotonin has early, cilia-independent roles in Xenopus left-right patterning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The results uniformly support a role for serotonin in the cleavage-stage embryo, long before the appearance of cilia, in ventral right blastomeres that do not contribute to the ciliated organ."
    explanation: The frog result placing left-right specification before the ciliated organizer exists.
  - reference: PMID:22899856
    reference_title: "Serotonin has early, cilia-independent roles in Xenopus left-right patterning."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "A second model suggests that serotonin is a permissive factor required to specify the dorsal region of the embryo containing chiral cilia that generate asymmetric fluid flow during neurulation, a much later process."
    explanation: >-
      States the competing account, under which serotonin is permissive for
      building the ciliated organizer and the organizer-first ordering stands.
  notes: >-
    Recorded because the Xenopus serotonergic model curated in animal_models
    bears on the ordering of this entry's pathophysiology, not because the
    entry's current ordering is thought to be wrong.
notes: >-
  This entry uses MONDO:0018677 (visceral heterotaxy) as the primary disease
  anchor because it is the MONDO preferred label. Heterotaxy syndrome and situs
  ambiguus are exact MONDO synonyms. The clinical spectrum is often discussed as
  right or left atrial appendage isomerism, but MONDO does not currently provide
  symmetric active disease-level anchors for both branches, so those labels are
  represented narratively and with HPO phenotype terms rather than as the
  primary disease anchor.

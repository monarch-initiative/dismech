- spinocerebellar ataxia

notes: >-
  Scope and relationship to neighbouring entries. SCAR16 (MONDO:0014339) is
  curated here as the STUB1 biallelic recessive ataxia. Two adjacent entries
  already exist and are deliberately not merged with it: Spinocerebellar
  Ataxia 48 (MONDO:0032526) is the allelic autosomal dominant disorder caused
  by heterozygous STUB1 variants, and Cerebellar Ataxia-Hypogonadism Syndrome
  (MONDO:0008935, Gordon Holmes syndrome) is the clinical syndrome of ataxia
  with hypogonadism, whose causes include RNF216, OTUD4, PNPLA6 and STUB1.
  Much of the SCAR16 literature is published under the Gordon Holmes name
  because the index STUB1 family was ascertained through hypogonadism, so
  papers cited here span both labels; hypogonadism is a feature of a subset of
  SCAR16, not a defining criterion, and Synofzik's Caucasian cohort found
  neither hypogonadism nor cognitive impairment obligatory.

  GeneReviews baseline: no STUB1-, SCAR16- or Gordon-Holmes-specific
  GeneReviews chapter exists. PubMed searches for "STUB1 GeneReviews" and
  "SCAR16 GeneReviews" both returned zero records, so no GeneReviews phenotype
  baseline was available and none is tagged. Phenotype coverage was built from
  the primary cohort and case literature instead (Shi 2013, Shi 2014, Heimdal
  2014, Synofzik 2014, Hayer 2017, Madrigal 2019, Ravel 2021 French series,
  Chiu 2020 Taiwan series, Zheng 2026).

  Deep research: the requested provider (falcon/Edison) was unreachable in
  this environment (403, key not authorized). The run was re-issued with
  --fallback, which recorded the substitution in the report frontmatter
  (fell_back: true, requested_provider: falcon) and produced
  Autosomal_Recessive_Spinocerebellar_Ataxia_16-deep-research-openscientist.md;
  20 of 20 of its references resolved, with none off topic. A second report
  was generated with the claude_code provider and is committed alongside it.
  Both were used.

  Three things the claude_code report offered were rejected on its own
  validation results and are not used anywhere in this entry. PMID:23847347
  does not resolve and was attributed to Shi 2013 (the real record is
  PMID:24312598). PMID:32778825 resolves to a newborn-screening metabolomics
  paper and was attributed to Roux 2020 (the real record is PMID:32713943).
  hgnc:17208 was given for STUB1; the correct identifier is hgnc:11427, which
  is what MONDO's causal-gene relation and the repository term cache both
  carry. Cohort percentages that report attributed to Madrigal 2019 (71%
  cognitive dysfunction, 75% hyperreflexia, 17% hypogonadism) do not appear in
  the paper and were not used; the figure this entry does take from Madrigal is
  the combined "over 70% ... increased tendon reflex and/or cognitive
  dysfunction", quoted from the cached full text. From the openscientist report,
  HP:0000765 was rejected for autonomic dysfunction (it is Abnormal thorax
  morphology) and HP:0006888 for cerebellar atrophy (it is
  Meningoencephalocele); both were flagged by that report's own term
  validation.


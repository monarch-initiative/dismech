diagnosis:
- name: Biallelic STUB1 sequencing with supportive MRI
  description: Diagnosis combines a compatible phenotype with biallelic pathogenic STUB1 variants. Sequencing is needed because repeat-expansion testing alone does not assess conventional STUB1 variants. Parental segregation can establish phase. Functional assays can support variant interpretation, but preserved activity in one assay does not exclude pathogenicity. Cerebellar atrophy supports the clinical assessment but does not independently distinguish SCAR16 from SCA48. A single heterozygous variant requires assessment for a dominant mechanism; zygosity alone is insufficient. The published maternal-isodisomy case involved a VUS with a predicted, unconfirmed splice effect.
  evidence:
  - reference: PMID:41851873
    reference_title: A novel STUB1 p.(Gln118*) nonsense variant in compound heterozygosity causes autosomal recessive spinocerebellar ataxia type 16 in a Chinese patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The whole-exome sequencing combined with long-range flanking polymerase chain reaction (PCR) were performed in a Chinese SCAR16 patient.
    explanation: The abstract names the testing methods, but parental segregation in the full report establishes phase; the long-range PCR addressed repeat-expansion differentials.
  - reference: PMID:41851873
    reference_title: A novel STUB1 p.(Gln118*) nonsense variant in compound heterozygosity causes autosomal recessive spinocerebellar ataxia type 16 in a Chinese patient.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we used quantitative real-time PCR and western blot analysis to investigate the function of variant in STUB1 in cultured cells
    explanation: The functional work-up used to classify a novel STUB1 variant as pathogenic rather than uncertain.
  - reference: PMID:32367277
    reference_title: Clinical and Genetic Characterization of Autosomal Recessive Spinocerebellar Ataxia Type 16 (SCAR16) in Taiwan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The brain MRIs showed a marked cerebellar atrophy of the patients.
    explanation: Cerebellar atrophy on MRI is the supportive imaging finding that accompanies the genetic diagnosis.
  - reference: PMID:32367277
    reference_title: Clinical and Genetic Characterization of Autosomal Recessive Spinocerebellar Ataxia Type 16 (SCAR16) in Taiwan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: SCAR16 is an important but often neglected diagnosis of cerebellar ataxia of unknown cause, and the isolated cerebellar ataxia without involvement of other systems cannot be a basis to exclude the possibility of STUB1-related disease.
    explanation: 'Warns against the specific diagnostic error this entry''s phenotype section also records: isolated ataxia, without cognitive, pyramidal or endocrine features, does not exclude SCAR16.'
  - reference: url:https://www.def-lab.org/wp-content/uploads/2024/12/2024-Agianda-MDCP.pdf

name: Autosomal Recessive Spinocerebellar Ataxia 16
creation_date: "2026-09-05T00:00:00Z"
category: Mendelian
description: >-
  Autosomal recessive spinocerebellar ataxia 16 (SCAR16; ATX-STUB1) is a rare
  autosomal recessive cerebellar ataxia caused by biallelic pathogenic variants
  in STUB1, which encodes CHIP (C-terminus of HSC70-interacting protein), a
  dimeric co-chaperone and U-box E3 ubiquitin ligase that couples the
  HSP70/HSC70 chaperone machinery to the ubiquitin-proteasome system. The core
  syndrome is a slowly progressive gait, limb and truncal ataxia with cerebellar
  dysarthria and marked cerebellar atrophy on MRI. Beyond that core the
  phenotype is broad and genuinely multisystemic: cognitive decline ranging from
  isolated executive dysfunction to severe dementia, pyramidal tract involvement
  with hyperreflexia and lower-limb spasticity, hypogonadotropic hypogonadism,
  epilepsy, autonomic dysfunction, and extrapyramidal features including
  dystonia and parkinsonism, with peripheral neuropathy in a subset. Age at onset
  spans childhood to the eighth decade.
  Because the disorder is defined by the gene rather than by any one clinical
  combination, hypogonadism and cognitive impairment are frequent but not
  obligatory, and cases presenting as isolated cerebellar ataxia are well
  documented. Most disease-causing missense changes destabilize CHIP, producing
  soluble oligomers, reduced chaperone binding, diminished substrate
  ubiquitination and low steady-state protein levels; a non-coding
  polyadenylation-signal variant produces the same end state by reducing
  translation.

  description: Trehalose reduced epoxomicin-associated cell injury and oxidative-stress readouts and increased autophagy-associated readouts in fibroblasts from one SCAR16 patient with p.Met211Ile/p.Glu238Ter variants. The study used three control donors and patient culture pseudoreplicates; patient-versus-control statistical comparisons were not valid. Increased CHIP abundance did not establish restored mutant CHIP function, and the authors did not attribute protection to that increase. This is a cell-culture therapeutic lead, not evidence of clinical efficacy.

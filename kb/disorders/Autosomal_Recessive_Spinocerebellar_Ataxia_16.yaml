genetic:
- name: STUB1 variants associated with recessive ataxia
  notes: SCAR16 requires two pathogenic STUB1 alleles, homozygous or compound heterozygous. Reported alleles span the tetratricopeptide-repeat, coiled-coil and U-box domains and include missense, nonsense and frameshift changes; the index allele is the U-box missense p.Thr246Met. Heterozygous STUB1 variants cause the allelic dominant disorder SCA48, and some alleles have been reported in both inheritance contexts. Similar biochemical defects alone cannot establish inheritance or predict clinical disease in a heterozygous relative; segregation, age and the specific allele require assessment. A 2019 analysis associated U-box disease alleles with cognitive dysfunction, but it analyzed alleles rather than independent patients and used published cases with some imputed SARA scores. Its ancestry association does not identify a genetic modifier and may be confounded by care or environmental differences. The c.612+11C>G allele below remains a source-classified VUS; its inclusion records the reported uniparental-isodisomy case and does not upgrade it to a proven disease allele.
  gene_term:
    preferred_term: STUB1
    term:
      id: hgnc:11427
      label: STUB1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:24312598
    reference_title: Identification of CHIP as a novel causative gene for autosomal recessive cerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using Sanger sequencing, we also identified two compound heterozygous mutations
    explanation: Compound heterozygous STUB1 alleles in additional kindreds establish the biallelic requirement beyond the homozygous index family.

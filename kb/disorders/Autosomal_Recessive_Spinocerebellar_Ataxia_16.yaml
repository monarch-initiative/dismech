notes: >-
  Entry scope and lump/split decision. This entry is the gene-defined recessive
  STUB1 disorder, MONDO:0014339. It deliberately sits alongside two neighbouring
  entries rather than inside either. Spinocerebellar Ataxia 48
  (MONDO:0032526) is the allelic dominant disorder caused by heterozygous STUB1
  variants; the two are separated by zygosity and by phenotype, not by variant
  class, since dominant and recessive variants are biochemically
  indistinguishable in vitro (PMID:34070858). Cerebellar Ataxia-Hypogonadism
  Syndrome (Gordon Holmes syndrome, MONDO:0008935) is a clinically defined and
  genetically heterogeneous entity whose commonest causes are RNF216 and PNPLA6;
  STUB1 is one of its causes, so the two concepts overlap without either
  containing the other. Many SCAR16 patients have no hypogonadism at all
  (PMID:24742043, PMID:32367277), which is why the gene-defined concept needs
  its own entry, and the SCAR16 literature itself argues that STUB1 disease
  should be organised by gene rather than by historical syndrome name
  (PMID:28193273). Note that the Spinocerebellar Ataxia 48 entry currently
  points its SCAR16 differential at MONDO:0008935; this entry is the more
  precise target for that cross-reference.

  GeneReviews baseline: no STUB1-, SCAR16- or SCA48-specific GeneReviews chapter
  exists. PubMed searches for "STUB1 GeneReviews[All Fields]", "spinocerebellar
  ataxia autosomal recessive 16 GeneReviews[All Fields]" and "SCAR16
  GeneReviews" each returned zero records. The closest authoritative GeneReviews
  resource is the Hereditary Ataxia Overview (PMID:20301317), tagged above; its
  PubMed record is a scope statement carrying no per-phenotype clinical content,
  so it could not serve as a phenotype baseline and no evidence item quotes it.
  Phenotype coverage was therefore built from the primary cohort and case
  literature (Shi 2013, Shi 2014, Synofzik 2014, Hayer 2017, Gazulla 2018,
  Turkgenc 2018, Kanata 2019/Chen 2020, Olszewska 2020, Ravel 2021).

  Deep research: research/Autosomal_Recessive_Spinocerebellar_Ataxia_16-deep-research-openscientist.md
  (requested provider falcon; falcon's API key is not valid in this environment,
  so the run was executed with `--fallback` and the report records
  fell_back/requested_provider/provider_attempts in its frontmatter). Every
  snippet below was taken from the PubMed record cached by
  `just fetch-reference`, not from the report. The report contributed the PDE9A
  and mitophagy branches of the pathophysiology chain, the peripheral-neuropathy
  phenotype, and the TPR-domain alleles from PMID:25258038.

  The report's own validation reports needs_review: true. Two of its quotes did
  not resolve (PMID:39117117, PMID:24312598), 3 of 21 references scored off
  topic, and 7 terms were mislabelled. None of that reached this entry: the two
  quotes it got wrong are not the sentences cited here, and its NCIT treatment
  bindings are wrong in a way worth recording because they look plausible -
  NCIT:C15367 is Health Risk Assessment, not Physical Therapy; NCIT:C15451 is
  Prior Anthracycline Therapy, not Speech Therapy; NCIT:C15329 is Surgical
  Procedure, not Occupational Therapy; NCIT:C376 is Cisplatin, not Baclofen. The
  treatment terms used below were looked up independently.

  One substantive error was caught and not imported. The report attributes
  "massive loss of Purkinje cells in the vermis" to SCAR16, citing PMID:32713943.
  That paper states the autopsied patient was STUB1 heterozygous, so the finding
  belongs to SCA48, not to the biallelic disorder. The same paper's 54%
  cognitive-impairment and 70% female figures come from a series that was mostly
  dominant, so they are likewise not used here. Direct human neuropathology in
  biallelic SCAR16 remains scarce, which is why the Purkinje node below rests on
  animal models and states so.

  Three SCAR16-relevant references are named nowhere below because
  `just fetch-reference` retrieved metadata but no abstract text for them, so no
  snippet could be verified against them and no cache file is committed:
  PMID:30206723 (Gazulla, inaugural cognitive decline and late onset in SCAR16),
  PMID:32775533 (STUB1-Related Ataxias: A Challenging Diagnosis) and
  PMID:39728009 (SCAR16 presenting as Gordon-Holmes syndrome from maternal
  uniparental isodisomy). Each would have supported a claim already carried here
  by another source - late onset, the diagnostic-difficulty framing, and the
  hypogonadic presentation respectively - so nothing was dropped for want of
  them. They are worth revisiting if their full text becomes fetchable.

  No datasets: block. `just discover-datasets` was run and every candidate was
  rejected on relevance triage. Its three DIRECT hits are other recessive
  ataxias that matched the phrase "autosomal recessive spinocerebellar ataxia" -
  geo:GSE215831 and geo:GSE215832 are SNX14 deficiency (SCAR20) and
  geo:GSE305228 is TDP2 (SCAR23) - and every GENE_ONLY hit is STUB1 in an
  unrelated context (prostate cancer androgen-receptor therapy, tumour
  immunity, epithelial EDAR/NF-kB signalling, HEK293 knockdown). This is the
  Named Entity Confusion the dataset SOP warns about, reached from both
  directions at once. No SCAR16 dataset was found; an accession that resolves
  is not the same as one about this disease.

  One reported observation is deliberately left out of the phenotype section: the
  three siblings homozygous for p.Asn65Ser showed "a marked appearance of
  accelerated aging", along with diabetes, alopecia, uveitis and ulcerative
  colitis in the wider family (PMID:25258038). It is a single sibship, the
  authors say it had not been described before, and it has not been replicated,
  so it is recorded here rather than curated as a SCAR16 feature.


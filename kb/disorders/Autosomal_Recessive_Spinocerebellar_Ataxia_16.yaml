treatments:
- name: Supportive and Symptomatic Care
  description: Management is multidisciplinary symptomatic care for ataxia, dysarthria, dysphagia, pyramidal signs and, where present, endocrine and seizure manifestations. No SCAR16-specific disease-modifying intervention was identified in the September 2026 trial search. Cellular and animal therapeutic candidates remain preclinical.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33200713
    reference_title: 'C-terminus of Hsp70 Interacting Protein (CHIP) and Neurodegeneration: Lessons from the Bench and Bedside.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: These diseases are all incurable at present, with no available treatments to modify the neurodegenerative process or provide neuroprotection.
    explanation: A CHIP-focused review's framing statement about the neurodegenerative diseases it covers, which include the inherited cerebellar ataxias. It supports the absence of disease-modifying therapy at the class level rather than reporting a SCAR16-specific treatment trial; no such trial was found.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The goals of supportive care are to maximize function and reduce complications.
    explanation: 'General hereditary-ataxia guidance, extrapolated to SCAR16: Supports multidisciplinary supportive management; this is not a SCAR16-specific efficacy study.'
- name: Physical Therapy and Gait Rehabilitation
  description: Balance exercises, gait training and muscle strengthening, with adaptive mobility devices and home fall-prevention measures. Recommendations are extrapolated from general hereditary-ataxia care.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: PT (balance exercises, gait training, muscle strengthening) to maintain mobility
    explanation: 'General hereditary-ataxia guidance, extrapolated to SCAR16: Identifies the rehabilitation components and intended functional goal.'
- name: Speech and Language Therapy
  description: Speech-language assessment and therapy for dysarthria, with alternative communication methods when needed. Swallowing and feeding management is addressed separately. This recommendation is extrapolated from general hereditary-ataxia care.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Consider alternative communication methods as needed
    explanation: 'General hereditary-ataxia guidance, extrapolated to SCAR16: The dysarthria row recommends speech-language therapy and communication aids.'
- name: Occupational Therapy
  description: Adaptive strategies and equipment to preserve independence in daily activities as limb ataxia progresses.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: supportive care by a multidisciplinary team of specialists including neurologists, occupational therapists, physical therapists
    explanation: 'General hereditary-ataxia guidance, extrapolated to SCAR16: Supports occupational therapy and adaptive strategies for daily activities.'
- name: Sex Hormone Replacement Therapy
  description: Individualized endocrine replacement addresses sex-steroid deficiency in patients with hypogonadotropic hypogonadism. In the original homozygous p.Thr246Met sisters, estrogen/progestin supplementation induced menstrual bleeding after three weeks. This endocrine response does not establish neurological benefit or restoration of spontaneous gonadotropin function.

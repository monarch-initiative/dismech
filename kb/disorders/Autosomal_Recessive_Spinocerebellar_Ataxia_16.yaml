name: Autosomal Recessive Spinocerebellar Ataxia 16
creation_date: "2026-09-05T00:00:00Z"
category: Mendelian
description: >-
  Autosomal recessive spinocerebellar ataxia 16 (SCAR16) is a progressive
  cerebellar degeneration caused by biallelic pathogenic variants in STUB1,
  which encodes CHIP (C-terminus of HSC70-interacting protein), a dimeric
  co-chaperone and U-box E3 ubiquitin ligase that couples the HSP70/HSC70
  chaperone machinery to the ubiquitin-proteasome system. Disease variants
  destabilize CHIP and abolish or reduce its ubiquitin ligase activity, and
  many additionally weaken its interaction with chaperones, so that misfolded
  client proteins are no longer triaged for proteasomal degradation. The
  clinical core is progressive gait and limb ataxia with dysarthria and marked
  cerebellar atrophy on MRI. Pyramidal tract involvement (hyperreflexia,
  lower-limb spasticity) and cognitive decline are common accompanying
  features, and a subset of patients has hypogonadotropic hypogonadism, in
  which case the presentation corresponds to the historical Gordon Holmes
  syndrome. Dystonia and parkinsonism broaden the movement-disorder phenotype
  in a minority, and seizures occur at the severe, multisystemic end. Age at
  onset is highly variable, spanning adolescence to late adulthood in the
  series that report it, and ataxia severity does not track age at onset.
  Heterozygous STUB1 variants cause the allelic autosomal dominant disorder
  SCA48 (MONDO:0032526), curated separately; recessive and dominant variants
  produce similar in vitro biochemical defects and the two entities form a
  clinical continuum rather than sharply separated diseases.

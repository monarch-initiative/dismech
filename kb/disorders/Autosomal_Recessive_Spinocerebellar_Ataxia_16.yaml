      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: No differences were evident in the proteasome activity of U-box–/– compared to the wild-type fish brains at a 6-month time point.
      explanation: The significant reduction emerged at 24 months; earlier Purkinje-cell count abnormalities cannot be attributed directly to the measured late proteasome decline.
    - reference: PMID:34630034
      reference_title: Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish.

        explanation: Reports the heat-shock response measurement in patient fibroblasts.
- name: SCAR16 patient iPSC-derived cortical neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  description: Cortical neurons differentiated from three SCAR16 patient iPSC lines, compared with control lines and an isogenic STUB1 knockout. The day-36 neurons expressed cortical-layer markers and most closely resembled fetal neocortex at postconception week 16. They model a neuronal context but do not establish the response of mature cerebellar Purkinje cells.
  publication: PMID:33097556
  evidence:
  - reference: PMID:33097556
    reference_title: CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we next investigated the HSR in cortical neurons (CNs) derived from induced pluripotent stem cells of SCAR16 patients
    explanation: Establishes the neuronal model as patient-derived and as the cell type the study treats as disease-relevant.
  - reference: PMID:33097556
    reference_title: CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The better stress coping of CNs could be a result of the immaturity of the CNs
    explanation: The authors identify neuronal immaturity as a possible explanation for the apparent heat-stress resistance.
  modeled_mechanisms:
  - target: Failure of Chaperone-Assisted Protein Quality Control
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Proteomic enrichment patterns were consistent with altered protein folding and oxidative-stress responses in patient cortical neurons. These are proteomic inferences rather than direct measurements of protein-refolding capacity or reactive oxygen species.
    limitations: Immature cortical neurons rather than mature Purkinje cells. High basal HSP70 and culture conditions may limit the heat-shock response. Patient and knockout neurons did not reproduce the fibroblast HSR defect; proteomic pathway enrichment does not itself demonstrate defective refolding or elevated reactive oxygen species.
    readouts:
    - name: Proteomic enrichment of protein-folding and oxidative-stress pathways
      target: Failure of Chaperone-Assisted Protein Quality Control
      direction: ALTERED
      interpretation: Protein-abundance and pathway-enrichment differences support altered proteostasis responses; no direct refolding or ROS assay is represented by this readout.
      evidence:
      - reference: PMID:33097556
        reference_title: CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Proteomic analysis of CNs showed dysfunctional protein (re)folding and higher basal oxidative stress levels in patients.
        explanation: The abstract summarizes the authors' interpretation of proteomic differences. The full-text results establish protein-abundance and enrichment patterns, not direct functional refolding or ROS measurements.
    evidence:
    - reference: PMID:33097556
      reference_title: CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons.
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: Our results question the role of impaired HSR in SCAR16 neuropathology and highlight the need for careful selection of proper cell types for modeling human diseases.
      explanation: The authors question impaired neuronal HSR as the explanation for disease; the model link is limited to proteomic differences and does not establish mature Purkinje-cell behavior.

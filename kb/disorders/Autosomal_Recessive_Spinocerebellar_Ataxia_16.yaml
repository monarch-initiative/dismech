pathophysiology:
- name: Biallelic STUB1 Loss-of-Function Variants
  description: >-
    Homozygous or compound heterozygous pathogenic variants in STUB1 are the
    initiating lesion. Variants are distributed across all three CHIP domains
    (tetratricopeptide-repeat, coiled-coil and U-box) and include missense,
    nonsense and frameshift alleles; a nonsense allele truncates the protein
    before the U-box and abolishes ligase activity outright.
  biological_scale: MOLECULAR
  downstream:
  - target: CHIP Destabilization and Aggregation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29317501
      reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we systematically analyzed CHIP mutations that cause SCAR16 and found that most SCAR16 mutations destabilize CHIP."
      explanation: >-
        Systematic biophysical analysis of the SCAR16 allele set establishes
        that the variants act on CHIP by destabilizing the protein, which is
        the step this edge asserts.
  - target: Loss of CHIP E3 Ubiquitin Ligase Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24113144
      reference_title: "Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Introduction of the Thr246Met mutation into CHIP results in a loss of ubiquitin ligase activity measured directly using recombinant proteins as well as in cell culture models."
      explanation: >-
        Introducing the index SCAR16 variant into CHIP abolishes ligase
        activity in recombinant protein and in cells, which is a direct
        variant-to-enzyme-defect causal claim.
    - reference: PMID:41851873
      reference_title: "A novel STUB1 p.(Gln118*) nonsense variant in compound heterozygosity causes autosomal recessive spinocerebellar ataxia type 16 in a Chinese patient."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that STUB1 p.(Gln118*) variant generated truncated proteins of the C-terminus of Hsc70-interacting protein and caused the loss function of ubiquitin ligase activity."
      explanation: >-
        A nonsense allele reaches the same endpoint by truncation, showing the
        edge holds across variant classes and not only for the index missense
        allele.
  - target: Impaired CHIP-HSC70 Chaperone Coupling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25258038
      reference_title: "STUB1 mutations in autosomal recessive ataxias - evidence for mutation-specific clinical heterogeneity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that the p.Asn65Ser substitution impairs CHIP's ability to ubiquitinate HSC70 in vitro, despite being able to self-ubiquitinate."
      explanation: >-
        A tetratricopeptide-repeat-domain variant selectively impairs handling
        of the chaperone substrate while leaving self-ubiquitination intact,
        which is the chaperone-coupling arm of the mechanism rather than a
        blanket loss of catalysis.
  genes:
  - preferred_term: STUB1
    term:
      id: hgnc:11427
      label: STUB1
  evidence:
  - reference: PMID:24312598
    reference_title: "Identification of CHIP as a novel causative gene for autosomal recessive cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "using a combination of whole-exome sequencing and linkage analysis, we identified CHIP, encoding a U-box containing ubiquitin E3 ligase, as a novel causative gene for autosomal recessive cerebellar ataxia."
    explanation: >-
      The gene-discovery study establishing STUB1/CHIP as the cause of this
      autosomal recessive cerebellar ataxia.
  - reference: PMID:28396517
    reference_title: "In vitro characterization of six STUB1 variants in spinocerebellar ataxia 16 reveals altered structural properties for the encoded CHIP proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Spinocerebellar ataxia, autosomal recessive 16 (SCAR16) is caused by biallelic mutations in the STIP1 homology and U-box containing protein 1 (STUB1) gene encoding the ubiquitin E3 ligase and dimeric co-chaperone C-terminus of Hsc70-interacting protein (CHIP)."
    explanation: >-
      States the biallelic requirement and identifies the gene product as a
      dual-function E3 ligase and co-chaperone.

- name: CHIP Destabilization and Aggregation
  description: >-
    Most SCAR16 variants lower the thermodynamic stability of CHIP. The
    destabilized protein forms soluble oligomers, is turned over faster by the
    proteasome, and is present at reduced steady-state levels in patient
    cells, so the functional deficit reflects loss of protein as well as loss
    of catalysis. Frank aggregation is not a general property of the allele
    set: of six variants characterized biophysically only p.Thr246Met showed a
    strong aggregation tendency, alongside structural disorganization of its
    U-box, while the others showed structural defects without it.
  biological_scale: MOLECULAR
  downstream:
  - target: Loss of CHIP E3 Ubiquitin Ligase Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30222779
      reference_title: "Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we demonstrated that T246M mutation results in structural disorganization and misfolding of the CHIP U-box domain, promoting oligomerization, and increased proteasome-dependent turnover. CHIP-T246M has no ligase activity, but maintains interactions with chaperones and chaperone-related functions."
      explanation: >-
        Ties the structural destabilization of the U-box directly to abolished
        ligase activity, and shows the two arms of the mechanism can dissociate
        because chaperone interactions are preserved in this variant.
  evidence:
  - reference: PMID:29317501
    reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This destabilization caused mutation-specific defects in CHIP activity, including increased formation of soluble oligomers, decreased interactions with chaperones, diminished substrate ubiquitination, and reduced steady-state levels in cells."
    explanation: >-
      Enumerates the consequences of destabilization that this node describes:
      oligomer formation, weakened chaperone interaction, less substrate
      ubiquitination, and lower protein abundance.
  - reference: PMID:25258038
    reference_title: "STUB1 mutations in autosomal recessive ataxias - evidence for mutation-specific clinical heterogeneity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we show that the levels of CHIP are strongly reduced in vivo in patients' fibroblasts compared to controls."
    explanation: >-
      Confirms in patient-derived cells that CHIP protein abundance is reduced,
      not only that the enzyme is catalytically impaired.
  - reference: PMID:28396517
    reference_title: "In vitro characterization of six STUB1 variants in spinocerebellar ataxia 16 reveals altered structural properties for the encoded CHIP proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "our results illustrate that some STUB1 mutations known to cause recessive SCAR16 have a profound impact on the protein structure, stability, and ability of CHIP to dimerize in vitro."
    explanation: >-
      Independent biophysical characterization of six SCAR16 variants
      confirming effects on structure, stability and dimerization.

- name: Loss of CHIP E3 Ubiquitin Ligase Activity
  description: >-
    The U-box-dependent E3 ubiquitin ligase activity of CHIP is abolished or
    reduced, so client proteins delivered by HSP70/HSC70 are no longer
    ubiquitinated. In the index p.Thr246Met allele the activity loss is
    complete while chaperone interactions are retained, so the catalytic defect
    can occur with chaperone binding intact. That allele is not a clean
    isolation of the catalytic arm, however: it also destabilizes and
    oligomerizes the protein, and its authors are explicit that it is not
    equivalent to total loss of CHIP.
  biological_scale: MOLECULAR
  downstream:
  - target: Failure of Chaperone-Assisted Protein Quality Control
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24312598
      reference_title: "Identification of CHIP as a novel causative gene for autosomal recessive cerebellar ataxia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Wild-type, but not disease-associated mutant CHIPs promoted the degradation of NR2A, which may underlie the pathogenesis of ataxia."
      explanation: >-
        Shows a named CHIP client escaping degradation specifically when the
        ligase carries a disease variant, which is the substrate-handling
        failure this edge asserts.
  molecular_functions:
  - preferred_term: ubiquitin-protein transferase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004842
      label: ubiquitin-protein transferase activity
  biological_processes:
  - preferred_term: protein ubiquitination
    modifier: DECREASED
    term:
      id: GO:0016567
      label: protein ubiquitination
  evidence:
  - reference: PMID:30222779
    reference_title: "Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We discovered a genetic disease, now known as spinocerebellar autosomal recessive 16 (SCAR16), resulting from a coding mutation that caused a loss of CHIP ubiquitin ligase function."
    explanation: >-
      States that loss of CHIP ubiquitin ligase function is the defect that
      constitutes SCAR16.

- name: Impaired CHIP-HSC70 Chaperone Coupling
  description: >-
    Variants in the tetratricopeptide-repeat domain weaken the interaction
    between CHIP and its HSP70/HSC70 co-chaperones, so misfolded clients are
    not efficiently handed off to the ligase. This arm is separable from the
    catalytic arm: TPR variants can retain self-ubiquitination while failing to
    ubiquitinate HSC70, and the U-box p.Thr246Met variant conversely retains
    chaperone binding with no ligase activity.
  biological_scale: MOLECULAR
  downstream:
  - target: Failure of Chaperone-Assisted Protein Quality Control
    causal_link_type: DIRECT
  molecular_functions:
  - preferred_term: Hsp70 protein binding
    modifier: DECREASED
    term:
      id: GO:0030544
      label: Hsp70 protein binding
  - preferred_term: protein-folding chaperone binding
    modifier: DECREASED
    term:
      id: GO:0051087
      label: protein-folding chaperone binding
  evidence:
  - reference: PMID:25258038
    reference_title: "STUB1 mutations in autosomal recessive ataxias - evidence for mutation-specific clinical heterogeneity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the p.Asn65Ser substitution impairs CHIP's ability to ubiquitinate HSC70 in vitro, despite being able to self-ubiquitinate."
    explanation: >-
      A tetratricopeptide-repeat variant that specifically fails to handle the
      chaperone substrate while retaining self-ubiquitination is the direct
      demonstration that this arm of the mechanism is separable from the
      catalytic arm.
  - reference: PMID:29317501
    reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This destabilization caused mutation-specific defects in CHIP activity, including increased formation of soluble oligomers, decreased interactions with chaperones, diminished substrate ubiquitination, and reduced steady-state levels in cells."
    explanation: >-
      The decreased-chaperone-interaction clause is what supports the reduced
      binding recorded in this node's molecular_functions; the neighbouring
      clauses about oligomers and abundance belong to the destabilization node
      and are curated there.
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results expand the genotypic spectrum of STUB1-disease, showing that pathogenic mutations affect also the tetratricopeptide-repeat domain, thus providing clinical evidence for the functional importance of this domain."
    explanation: >-
      Establishes that the chaperone-binding TPR domain carries pathogenic
      variants in patients, so this arm of the mechanism is clinically
      instantiated and not only a biochemical possibility.

- name: Failure of Chaperone-Assisted Protein Quality Control
  description: >-
    With neither efficient client delivery nor ubiquitin transfer, misfolded
    and damaged proteins escape proteasomal degradation and accumulate.
    Patient-derived cells additionally show a disturbed heat-shock response and
    raised basal oxidative stress, and CHIP loss deranges PINK1/Parkin-mediated
    mitochondrial quality control, so the proteostasis defect is not confined
    to bulk misfolded-protein turnover.
  biological_scale: CELLULAR
  downstream:
  - target: Corticospinal Tract Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24742043
      reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pyramidal tract damage is a common accompanying feature and can include lower limb spasticity"
      explanation: >-
        Pyramidal tract damage accompanies the cerebellar disease consistently
        enough to be a core feature, which places it downstream of the same
        CHIP proteostasis defect. Indirect and with unknown intermediates: no
        study shows the corticospinal degeneration is caused by the
        quality-control failure specifically, and the neuron-population
        selectivity is unexplained.
  - target: Hypothalamic-Pituitary Gonadotropin Deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24113144
      reference_title: "Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of CHIP function in mice resulted in behavioral and reproductive impairments that mimic human ataxia and hypogonadism."
      explanation: >-
        Loss of CHIP function is sufficient to produce the reproductive deficit
        in mice, placing the endocrine branch downstream of the same molecular
        lesion. The intermediates are unknown: nothing localizes the defect
        within the hypothalamic-pituitary-gonadal axis or names the CHIP client
        involved, which is the open question recorded in the knowledge-gap
        discussion attached to that node.
  - target: Purkinje Cell Degeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34630034
      reference_title: "Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutant fish also had decreased total 26S proteasome activity in the brain and showed behavioral changes."
      explanation: >-
        In an animal carrying a U-box truncation, the proteasome-handling
        defect and the Purkinje phenotype reported in the same animals link
        the proteostasis failure to cerebellar cell pathology. Indirect because
        the study establishes co-occurrence in one model rather than isolating
        proteostasis failure as the sufficient cause of the cell loss.
  biological_processes:
  - preferred_term: protein quality control for misfolded or incompletely synthesized proteins
    modifier: DECREASED
    term:
      id: GO:0006515
      label: protein quality control for misfolded or incompletely synthesized proteins
  - preferred_term: ubiquitin-dependent protein catabolic process
    modifier: DECREASED
    term:
      id: GO:0006511
      label: ubiquitin-dependent protein catabolic process
  evidence:
  - reference: PMID:33097556
    reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found impaired HSR induction and recovery compared to healthy controls."
    explanation: >-
      Primary fibroblasts from three SCAR16 patients show a defective heat
      shock response, a direct patient-cell readout of disturbed proteostasis.
  - reference: PMID:33097556
    reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Proteomic analysis of CNs showed dysfunctional protein (re)folding and higher basal oxidative stress levels in patients."
    explanation: >-
      Patient iPSC-derived cortical neurons show dysfunctional protein
      refolding and raised oxidative stress, extending the proteostasis defect
      to a neuronal cell type.
  - reference: PMID:39117117
    reference_title: "Disease-associated mutations in C-terminus of HSP70 interacting protein (CHIP) impair its ability to negatively regulate mitophagy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we find that multiple disease-associated mutations in CHIP dysregulate mitophagy both in vitro and in vivo in C. elegans neurons"
    explanation: >-
      Disease-associated CHIP variants also derange mitochondrial quality
      control, broadening the quality-control failure beyond cytosolic
      misfolded-protein turnover. Graded MODEL_ORGANISM for the in vivo
      C. elegans neuron result the sentence rests on; the same sentence also
      reports a cell-based result, which is why the grade is the organism one
      rather than a split claim.

- name: Purkinje Cell Degeneration
  description: >-
    Cerebellar Purkinje neurons are the principal cellular target. STUB1 is
    expressed in the Purkinje and granule layers, and impairing CHIP ligase
    activity in vivo reduces Purkinje cell number and soma size and disorganizes
    their dendritic arbors.
  biological_scale: CELLULAR
  downstream:
  - target: Cerebellar Atrophy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32713943
      reference_title: "Clinical, neuropathological, and genetic characterization of STUB1 variants in cerebellar ataxias: a frequent cause of predominant cognitive impairment."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "showing massive loss of Purkinje cells in the vermis and major loss in the cerebellar hemispheres without atrophy of the pons, hippocampus, or cerebral cortex"
      explanation: >-
        Autopsy of a STUB1 patient shows that the cell loss is confined to the
        cerebellum while neighbouring structures are spared, which is the
        anatomical pattern that makes Purkinje loss the substrate of the
        cerebellar atrophy rather than a bystander finding. Indirect because
        the autopsied patient carried a heterozygous variant (the allelic
        dominant disorder SCA48), so the neuropathology is transferred to
        SCAR16 by an inference step across the STUB1 spectrum.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:34630034
    reference_title: "Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast to SCAR16/SCA48 patients, no gross cerebellar atrophy was evident in mutant fish, however, these fish displayed reduced numbers and sizes of Purkinje cell bodies and abnormal organization of Purkinje cell dendrites."
    explanation: >-
      Direct demonstration that loss of Chip U-box function damages Purkinje
      cells. The same sentence records that gross cerebellar atrophy was absent
      in this model, so the model supports the cellular node without supporting
      the tissue-level one.
  - reference: PMID:34630034
    reference_title: "Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the brain, stub1 mRNA was predominantly detected in the cerebellum, including the Purkinje cell layer and granular layer."
    explanation: >-
      The gene is expressed in the Purkinje layer that degenerates, which is
      consistent with a cell-autonomous lesion. Expression is not degeneration:
      the granular layer also expresses stub1 and no granule-cell loss is
      reported, which is why only the Purkinje cell is bound above.

- name: Cerebellar Atrophy
  description: >-
    Progressive loss of cerebellar volume, visible on MRI as marked cerebellar
    atrophy and in more advanced cases extending to the brainstem. It is the
    near-constant imaging finding in SCAR16 and the tissue-level substrate of
    the ataxia.
  biological_scale: TISSUE
  downstream:
  - target: Progressive Cerebellar Ataxia
    causal_link_type: DIRECT
  - target: Dysarthria
    causal_link_type: DIRECT
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:33417001
    reference_title: "Expanding the clinical spectrum of STIP1 homology and U-box containing protein 1-associated ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI showed marked cerebellar atrophy in all patients."
    explanation: >-
      Cerebellar atrophy in every patient of a French series that included four
      SCAR16 cases.
  - reference: PMID:32367277
    reference_title: "Clinical and Genetic Characterization of Autosomal Recessive Spinocerebellar Ataxia Type 16 (SCAR16) in Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The brain MRIs showed a marked cerebellar atrophy of the patients."
    explanation: >-
      Independent confirmation in the Taiwanese SCAR16 families.
  - reference: PMID:36569391
    reference_title: "MRI Findings in a Patient with Known SCAR-16 Type STUB1 Associated Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An MRI of her brain showed moderate to severe atrophy of the cerebellum and brainstem."
    explanation: >-
      A radiologically characterized SCAR16 case showing that the atrophy can
      extend beyond the cerebellum to the brainstem.

- name: Corticospinal Tract Involvement
  description: >-
    Pyramidal tract damage accompanies the cerebellar degeneration in a large
    share of patients, producing hyperreflexia and, at the more severe end,
    lower-limb spasticity or spastic tetraparesis. It is frequent enough that
    STUB1 disease belongs in the differential diagnosis of the spastic ataxias.
  biological_scale: TISSUE
  downstream:
  - target: Hyperreflexia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients showed evidence of pyramidal tract damage."
    explanation: >-
      Every STUB1 ataxia patient in this Caucasian screening cohort had
      pyramidal tract involvement.
  - reference: PMID:28193273
    reference_title: "STUB1/CHIP mutations cause Gordon Holmes syndrome as part of a widespread multisystemic neurodegeneration: evidence from four novel mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three subjects presented with a severe multisystemic phenotype including severe dementia, spastic tetraparesis, epilepsy, and autonomic dysfunction in addition to cerebellar ataxia, plus hypogonadism in one index patient."
    explanation: >-
      Documents spastic tetraparesis as the severe end of the corticospinal
      involvement, alongside the other multisystem features.

- name: Hypothalamic-Pituitary Gonadotropin Deficiency
  description: >-
    A subset of patients has hypogonadotropic hypogonadism, the feature that
    made the historical Gordon Holmes syndrome. Loss of CHIP function
    reproduces reproductive as well as motor impairment in mice, but the
    cellular basis of the neuroendocrine deficit in human disease has not been
    established, and hypogonadism is absent from whole cohorts of STUB1 ataxia.
  biological_scale: ORGANISM
  downstream:
  - target: Hypogonadotropic Hypogonadism
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24113144
    reference_title: "Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of CHIP function in mice resulted in behavioral and reproductive impairments that mimic human ataxia and hypogonadism."
    explanation: >-
      Mouse loss of CHIP function produces reproductive impairment alongside
      the behavioural phenotype, supporting a causal rather than coincidental
      link between the CHIP defect and the gonadal axis.
  - reference: PMID:28193273
    reference_title: "STUB1/CHIP mutations cause Gordon Holmes syndrome as part of a widespread multisystemic neurodegeneration: evidence from four novel mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our data reveal the second STUB1 family with ataxia plus hypogonadism reported so far, demonstrating that Gordon Holmes syndrome is indeed a recurrent manifestation of STUB1."
    explanation: >-
      Confirms in patients that the ataxia-plus-hypogonadism combination
      recurs in STUB1 disease rather than being confined to the index family.
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to previous reports, STUB1-ataxia can start even above age 40 years, and neither hypogonadism nor prominent cognitive impairment are obligatory features."
    explanation: >-
      Supports this node's framing as a subset branch rather than an obligatory
      part of SCAR16: a screening cohort found no hypogonadism at all. Indirect
      because the quote establishes the branch's optionality by absence rather
      than asserting the branch itself.

phenotypes:
- category: Neurologic
  name: Progressive Cerebellar Ataxia
  description: >-
    Progressive truncal, gait and limb ataxia is the defining and essentially
    universal clinical feature. In the SCAR16-only patient set the median age
    at onset is 17 years with a range from infancy to the fifth decade, and
    severity does not track age at onset.
  phenotype_term:
    preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
    clinical_course: PROGRESSIVE
    onset:
      onset_category: JUVENILE
      mean_age_years: 17.0
      min_age_years: 0.5
      max_age_years: 49.0
      notes: >-
        Median 17 years, range 0.5-49, from the SCAR16-only patient set
        assembled by Madrigal 2019; the recorded value is that median, not an
        arithmetic mean. The category is JUVENILE on the median even though the
        range reaches infancy at one end and the fifth decade at the other. A
        French series reports 14-76 years, but for a combined SCAR16 and SCA48
        cohort, so it is not used to set the range here.
  frequency: VERY_FREQUENT
  sequelae:
  - target: Dysarthria
  evidence:
  - reference: PMID:33417001
    reference_title: "Expanding the clinical spectrum of STIP1 homology and U-box containing protein 1-associated ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report four SCAR16 and nine SCA48 patients from two SCAR16 and five SCA48 unrelated French families. All presented with slowly progressive cerebellar ataxia."
    explanation: >-
      All thirteen patients, including the four SCAR16 cases, had slowly
      progressive cerebellar ataxia, supporting the VERY_FREQUENT band.
  - reference: PMID:29317501
    reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "in humans, mutations in CHIP cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16), a fatal neurodegenerative disease characterized by truncal and limb ataxia that results in gait instability"
    explanation: >-
      Characterizes the disease by truncal and limb ataxia producing gait
      instability, which is the phenotype described here.
  - reference: PMID:33417001
    reference_title: "Expanding the clinical spectrum of STIP1 homology and U-box containing protein 1-associated ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age at onset was highly variable, ranging from 14 to 76 years."
    explanation: >-
      Documents how wide the onset range runs across STUB1 disease. It is not
      used to set this entry's recorded range because the cohort combines
      SCAR16 and SCA48 patients.
  - reference: PMID:31619515
    reference_title: "Changes in protein function underlie the disease spectrum in patients with CHIP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that the severity of ataxia did not correlate with age of onset"
    explanation: >-
      Supports the statement that severity does not track age at onset, which
      distinguishes SCAR16 from the polyglutamine ataxias.
  - reference: PMID:31619515
    reference_title: "Changes in protein function underlie the disease spectrum in patients with CHIP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median AOO was 17 years of age (range = 0.5-49)"
    explanation: >-

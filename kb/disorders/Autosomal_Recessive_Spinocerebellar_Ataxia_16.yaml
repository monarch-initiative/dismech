notes: 'Scope and relationship to neighbouring entries. SCAR16 (MONDO:0014339) is curated here as the STUB1 biallelic recessive ataxia. Two adjacent entries already exist and are deliberately not merged with it: Spinocerebellar Ataxia 48 (MONDO:0032526) is the allelic autosomal dominant disorder caused by heterozygous STUB1 variants, and Cerebellar Ataxia-Hypogonadism Syndrome (MONDO:0008935, Gordon Holmes syndrome) is the clinical syndrome of ataxia with hypogonadism, whose causes include RNF216, OTUD4, PNPLA6 and STUB1. Much of the SCAR16 literature is published under the Gordon Holmes name because the index STUB1 family was ascertained through hypogonadism, so papers cited here span both labels; hypogonadism is a feature of a subset of SCAR16, not a defining criterion, and Synofzik''s Caucasian cohort found neither hypogonadism nor cognitive impairment obligatory.'

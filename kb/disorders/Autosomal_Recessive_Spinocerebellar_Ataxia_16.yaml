genetic:
- name: STUB1 biallelic pathogenic variants
  gene_term:
    preferred_term: STUB1
    term:
      id: hgnc:11427
      label: STUB1
  association: Causative biallelic pathogenic variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:24312598
      reference_title: "Identification of CHIP as a novel causative gene for autosomal recessive cerebellar ataxia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These mutations co-segregated exactly with the disease in these families and were not observed in 500 control subjects with matched ancestry."
      explanation: >-
        Cosegregation of biallelic genotypes with disease, absent from
        ancestry-matched controls.
  notes: >-
    Variants are germline and distributed across all three functional regions of
    the protein - the TPR chaperone-binding domain, the coiled-coil dimerisation
    region and the C-terminal U-box ligase domain - with no hotspot. Both
    homozygous and compound heterozygous genotypes occur; zygosity is recorded as
    HOMOZYGOUS because that is the genotype of the discovery pedigree and of
    several later families, but compound heterozygosity is equally common and the
    slot cannot express both. Reported examples include the homozygous
    c.737C>T (p.Thr246Met) of the Gordon Holmes family, the compound
    heterozygous c.355C>T / c.880A>T pair from which a patient iPSC line was
    derived, the Taiwanese c.[433A>C];[721C>T] and c.[433A>C];[694T>G] pairs, and
    the homozygous non-coding polyadenylation-signal change c.*240T>C, which acts
    by reducing translation rather than by altering the protein sequence. The TPR
    domain is represented by the homozygous c.194A>G (p.Asn65Ser) of a
    three-sibling ARCA family and by c.82G>A (p.Glu28Lys) in trans with the
    nonsense c.430A>T (p.Lys144Ter).
    Because dominant and recessive STUB1 variants are biochemically
    indistinguishable in vitro, zygosity and phenotype, not variant class,
    separate SCAR16 from SCA48.
  evidence:
  - reference: PMID:24312598
    reference_title: "Identification of CHIP as a novel causative gene for autosomal recessive cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified CHIP, encoding a U-box containing ubiquitin E3 ligase, as a novel causative gene for autosomal recessive cerebellar ataxia"
    explanation: >-
      Establishes STUB1/CHIP as the causative gene for the recessive disorder.
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 3 ataxia patients (3/167 = 1.8%) with 4 novel missense mutations in STUB1, including 3 mutations in its tetratricopeptide-repeat domain."
    explanation: >-
      Documents the domain distribution of pathogenic variants beyond the U-box.
  - reference: PMID:30058754
    reference_title: "STUB1 polyadenylation signal variant AACAAA does not affect polyadenylation but decreases STUB1 translation causing SCAR16."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "exome sequencing revealed novel homozygous c.*240T > C variant in the 3'UTR of STUB1, the gene responsible for autosomal recessive spinocerebellar ataxia 16 (SCAR16)"
    explanation: >-
      Source of the non-coding regulatory variant recorded in the notes.
  - reference: PMID:34070858
    reference_title: "Genetic Dominant Variants in STUB1, Segregating in Families with SCA48, Display In Vitro Functional Impairments Indistinctive from Recessive Variants Associated with SCAR16."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These studies revealed that dominantly and recessively inherited STUB1 variants showed similar biochemical defects, including impaired ubiquitin ligase activity and altered oligomerization properties of the CHIP."
    explanation: >-
      Source of the claim that variant class does not separate the recessive and
      dominant disorders.
  - reference: PMID:25258038
    reference_title: "STUB1 mutations in autosomal recessive ataxias - evidence for mutation-specific clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified three mutations in STUB1 in two families with ARCA and cognitive impairment; a homozygous missense variant (c.194A > G, p.Asn65Ser) that segregated in three affected siblings"
    explanation: >-
      Source of the TPR-domain alleles named in the notes, in genetically
      confirmed biallelic families.


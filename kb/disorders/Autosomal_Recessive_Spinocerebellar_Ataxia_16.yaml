    explanation: Independent confirmation in the Taiwanese SCAR16 patients.
- category: Neurologic
  name: Cognitive Decline
  description: Cognitive impairment, ranging from a frontal-dysexecutive profile to frank dementia, is a common but not obligatory accompaniment. It is part of the recognized SCAR16 disease spectrum, and severe dementia occurs at the multisystemic end. The relative contributions of cerebral and cerebellar pathology to cognitive decline have not been isolated in these patients.

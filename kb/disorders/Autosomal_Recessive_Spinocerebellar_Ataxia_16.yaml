- name: Cerebellar cortical neuronal loss with Bergmann gliosis
  finding_term:
    preferred_term: Cerebellar cortical neuronal degeneration
    term:
      id: NCIT:C120874
      label: Degeneration and Atrophy
  description: Autopsy of one man with p.Met211Ile/p.Glu238Ter STUB1 variants showed severe Purkinje-cell and granule-layer neuronal loss with reactive Bergmann gliosis. This is a direct recessive-disease observation; its prevalence across SCAR16 is unknown.
  evidence:
  - reference: url:https://citeseerx.ist.psu.edu/document?doi=f78c14ae0406c116593ae28fe32d1af8bda282ac&repid=rep1&type=pdf  # codespell:ignore ist,repid
    reference_title: https://citeseerx.ist.psu.edu/document?doi=f78c14ae0406c116593ae28fe32d1af8bda282ac&repid=rep1&type=pdf  # codespell:ignore ist,repid
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: severe loss of Purkinje cells and neurons of the granular layer, accompanied by reactive Bergmann gliosis
    explanation: 'Bettencourt 2015 (PMID:25592071), recovered full text: Defines the neuronal populations lost and the associated reactive gliosis.'
- name: p62-positive neuronal intranuclear inclusions
  finding_term:
    preferred_term: Neuronal intranuclear inclusion body
    term:
      id: NCIT:C120945
      label: Inclusion Body
  description: A few p62-positive neuronal intranuclear inclusions were reported in frontal cortex and caudate in the same p.Met211Ile/p.Glu238Ter autopsy. This single-case finding does not establish a universal or diagnostic inclusion pathology.
  evidence:

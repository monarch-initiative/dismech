- name: CHIP T246M knock-in mouse
  species: Mouse
  genotype: Homozygous Stub1 p.Thr247Met knock-in, orthologous to human p.Thr246Met
  publication: PMID:30222779
  description: Endogenous knock-in of the rodent residue corresponding to the human p.Thr246Met SCAR16 allele. The paper calls the model T246M while its mouse-locus methods identify T247M. Young mice initially learn the rotarod task, then develop progressive motor impairment, Purkinje-cell loss, reduced brain mass and cognitive readout abnormalities.

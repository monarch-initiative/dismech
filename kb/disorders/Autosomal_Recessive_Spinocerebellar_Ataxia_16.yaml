references:
- reference: url:https://citeseerx.ist.psu.edu/document?doi=f78c14ae0406c116593ae28fe32d1af8bda282ac&repid=rep1&type=pdf  # codespell:ignore ist,repid
  title: https://citeseerx.ist.psu.edu/document?doi=f78c14ae0406c116593ae28fe32d1af8bda282ac&repid=rep1&type=pdf  # codespell:ignore ist,repid
  findings:
  - statement: 'Full text of Bettencourt et al. 2015, Clinical and Neuropathological Features of Spastic Ataxia in a Spanish Family with Novel Compound Heterozygous Mutations in STUB1 (PMID:25592071): biallelic family, cerebellar autopsy, myoclonus, chorea and severe dysphagia.'
- reference: PMID:31619515
  title: Changes in protein function underlie the disease spectrum in patients with CHIP mutations.
  findings:
  - statement: Published-case and biochemical-data modeling suggests allele-specific CHIP-HSP70 effects and predicts benefit from reducing some mutant interactions. These are simulations, not treatment outcomes; some clinical scores were imputed. The paper supplies its extracted data and analysis supplements at DOI:10.17615/8dqf-e678.
- reference: PMID:25258038
  title: STUB1 mutations in autosomal recessive ataxias - evidence for mutation-specific clinical heterogeneity.
  findings:
  - statement: The p.Asn65Ser siblings showed an aged appearance and some had alopecia, type 1 diabetes, ulcerative colitis or uveitis. The authors explicitly left the causal relationship of the autoimmune conditions to STUB1 unresolved; these observations do not establish a SCAR16 autoimmune mechanism.
- reference: PMID:28193273
  title: 'STUB1/CHIP mutations cause Gordon Holmes syndrome as part of a widespread multisystemic neurodegeneration: evidence from four novel mutations.'
  findings:
  - statement: Diffusion tensor imaging compared one patient with nine age- and sex-matched controls and found widespread reduction in fractional anisotropy. This is a single-patient imaging observation, not histological confirmation of universal tract degeneration. Table 2 marks one seizure history as uncertain.
- reference: PMID:30222779
  title: Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16.
  findings:
  - statement: Rat cerebellar proteomics at 32 weeks identified 143 differentially abundant proteins. The authors caution that altered cell composition can contribute. The changes in tau and other proteins and enrichment of coagulation-related interactions generate hypotheses; they do not establish human tau aggregation or a clinical coagulation disorder. T246M retains chaperone-related functions despite loss of ubiquitin ligase activity, distinguishing it from a null allele.
- reference: url:https://www.def-lab.org/wp-content/uploads/2024/12/2024-Agianda-MDCP.pdf
  title: https://www.def-lab.org/wp-content/uploads/2024/12/2024-Agianda-MDCP.pdf
  findings:
  - statement: Agianda et al. reported Gordon Holmes features with maternal chromosome-16 isodisomy and homozygous STUB1 c.612+11C>G, classified as a VUS with only predicted splice disruption. BARS remained stable after 4-aminopyridine was started, an uncontrolled observation that neither establishes treatment efficacy nor resolves the molecular diagnosis. The patient was ascertained through observational HSP sequencing study NCT05354622.
- reference: url:https://mito2i.ca/wp-content/uploads/2026/02/8-Earnshaw.pdf
  title: https://mito2i.ca/wp-content/uploads/2026/02/8-Earnshaw.pdf
  findings:
  - statement: The 2024 mitophagy study tested SCA48 alleles p.Ile53Thr and p.Leu275AspfsTer16 and their homozygous worm analogues, plus gene knockdown or deletion. It does not directly test SCAR16 patient alleles. U2OS cells required mitochondrial stress, whereas worm neurons showed altered basal mitophagy. These distinctions limit transfer to human SCAR16. Table 1 and the methods/results disagree on worm strain-number digits; the deletion models and their pathway comparisons do not depend on resolving that typo.
- reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
  title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
  tags:
  - GeneReviews
  findings:
  - statement: General hereditary-ataxia care, surveillance and recessive counseling were used with explicit extrapolation to SCAR16. This overview is not a disease-specific SCAR16 GeneReview; STUB1 dominant inheritance and uniparental-disomy caveats require disease-specific sources.
- reference: PMID:31189917
  title: Feedback inhibition of cAMP effector signaling by a chaperone-assisted ubiquitin system.
  findings:
  - statement: 'Full scientific text: HEK293 PKAc ubiquitination/turnover, two SCAR16 fibroblast lines with high basal CREB phosphorylation, and enhanced chemically induced hippocampal long-term potentiation after CHIP loss or HSP70 inhibition. Patient neuronal or endocrine causation remains unproven; H89 is a biochemical perturbation rather than an established therapy.'
- reference: PMID:29581457
  title: Counterregulation of cAMP-directed kinase activities controls ciliogenesis.
  findings:
  - statement: 'Full scientific text: PKA-NEK10-CHIP regulation of cilium resorption and a SCAR16 AX71 fibroblast defect under serum starvation. NEK10-perturbed medaka and human cancer tissue experiments establish related biology but are not STUB1 disease models. No clinical ciliopathy phenotype is inferred.'
- reference: PMID:39806097
  title: E3 ubiquitin ligase CHIP facilitates cAMP and cGMP signalling cross-talk by polyubiquitinating PDE9A.
  findings:
  - statement: 'Full scientific text and methods: PDE9A Lys186 ubiquitination, autophagic turnover, cGMP/CHIP phosphorylation feedback, and preclinical BAY 73-6691 and AAV-CHIP interventions in T246M rats. Static mitochondrial/autophagy markers are not direct flux measurements. Purkinje-cell transcriptomic cAMP pathway scoring was not significantly different between untreated mutant and wild-type groups in Figure 9E; whole-tissue and other-cell findings should not be generalized to every cell class. OMIX008238 provides associated expression matrices.'
- reference: PMID:24113144
  title: Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP.
  findings:
  - statement: 'Full family report: preserved GnRH-stimulated gonadotropin responses and estrogen/progestin-induced menstrual bleeding in the T246M sisters. CHIP-null mice had Purkinje pathology, impaired motor learning and reproductive deficits. Human tissue staining used healthy donors; a dominant-negative effect was hypothesized rather than demonstrated.'
- reference: PMID:29317501
  title: Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP.
  findings:
  - statement: The 2018 study separates chaperone binding, substrate ubiquitination, free-chain formation and cellular abundance. Lower assay temperature restored activity for many variants, supporting a stabilizer hypothesis; no stabilizing compound or patient treatment was tested. Its purified-protein results differ in some respects from the 2017 MBP-based experiments and should not be collapsed into universal catalytic loss.
- reference: PMID:32713943
  title: 'Clinical, neuropathological, and genetic characterization of STUB1 variants in cerebellar ataxias: a frequent cause of predominant cognitive impairment.'
  findings:
  - statement: A predominantly dominant-ataxia cohort included three biallelic patients from two families, with earlier mean onset than heterozygotes. The apparent severity difference was not statistically significant. The autopsy and proposed AFG3L2/PRKCG/TBP second-hit effects concern heterozygous disease, not proven SCAR16 neuropathology or modifiers. Clinical frequencies from the full mixed cohort are not SCAR16 frequencies.
- reference: PMID:36853170
  title: CARPs regulate STUB1 and its pathogenic mutants aggregation kinetics by mono-ubiquitination.
  findings:
  - statement: Full text distinguishes biochemical controls from patient variants and sequestration from degradation. CARP inhibition is a proposed therapeutic direction, not a demonstrated SCAR16 treatment.

    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30222779
      reference_title: Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: we demonstrated that T246M mutation results in structural disorganization and misfolding of the CHIP U-box domain, promoting oligomerization, and increased proteasome-dependent turnover. CHIP-T246M has no ligase activity, but maintains interactions with chaperones and chaperone-related functions.
      explanation: Ties the structural destabilization of the U-box directly to abolished ligase activity, and shows the two arms of the mechanism can dissociate because chaperone interactions are preserved in this variant.

differential_diagnoses:
- name: Spinocerebellar ataxia 48
  description: The allelic autosomal dominant disorder, caused by heterozygous variants in the same gene, curated in this knowledge base as Spinocerebellar Ataxia 48.
  disease_term:
    preferred_term: Spinocerebellar ataxia 48
    term:
      id: MONDO:0032526
      label: spinocerebellar ataxia 48
  distinguishing_features:
  - Biallelic pathogenic variants support recessive SCAR16, whereas a heterozygous variant with evidence for a dominant effect can support SCA48. Variant interpretation and family segregation remain necessary.
  - SCA48 is adult-onset with a prominent cerebellar cognitive-affective and psychiatric syndrome, often with chorea, and shows dentate-nucleus T2 hyperintensity on MRI; SCAR16 starts earlier, with spastic-ataxic features and, in a subset, hypogonadism.
  - The separation is not clean. One variant has been reported causing both forms, and the two entities are described as a continuum rather than as discrete diseases.
  evidence:
  - reference: PMID:33417001
    reference_title: Expanding the clinical spectrum of STIP1 homology and U-box containing protein 1-associated ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We also report the first pathogenic variation associated with both dominant and recessive forms of inheritance (SCAR16 and SCA48).
    explanation: One allele producing both the recessive and the dominant disorder is why the differential cannot be settled on variant identity alone.
  - reference: PMID:32342324
    reference_title: 'Spinocerebellar ataxia type 48: last but not least.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: SCA48 is an adult-onset syndrome characterized by ataxia and cognitive-psychiatric features, variably associated with chorea, parkinsonism, dystonia, and urinary symptoms.
    explanation: The SCA48 clinical description against which SCAR16 is distinguished.
- name: Gordon Holmes syndrome due to RNF216, OTUD4 or PNPLA6
  description: Other genetic causes of ataxia with hypogonadism overlap clinically with STUB1 disease. Molecular testing distinguishes the etiologies.
  disease_term:
    preferred_term: Cerebellar ataxia-hypogonadism syndrome
    term:
      id: MONDO:0008935
      label: cerebellar ataxia-hypogonadism syndrome
  distinguishing_features:
  - Clinical overlap makes molecular confirmation important.
  - Across published Gordon Holmes cases, RNF216 accounts for the majority and STUB1 for a small minority.
  - In the ascertained Gordon Holmes case review, seizures were reported only in its STUB1 subset, which also had the lowest median onset; this is not a diagnostic rule or biological exclusion for other causes.

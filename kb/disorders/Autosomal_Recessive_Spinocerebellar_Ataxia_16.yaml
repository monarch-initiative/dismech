    evidence_source: HUMAN_CLINICAL
    snippet: The disease spectrum of SCAR16 includes a varying age of disease onset, cognitive dysfunction, increased tendon reflex, and hypogonadism.
    explanation: Places cognitive dysfunction in the recognized SCAR16 spectrum alongside the other accompanying features curated here.
  - reference: PMID:32367277
    reference_title: Clinical and Genetic Characterization of Autosomal Recessive Spinocerebellar Ataxia Type 16 (SCAR16) in Taiwan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinically, the three patients from the two SCAR16 families presented with cerebellar ataxia alone or in combination with cognitive impairment.
    explanation: Cognitive impairment accompanied ataxia in some Taiwanese patients, whereas others had isolated ataxia.
  - reference: PMID:24742043
    reference_title: 'Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts.'

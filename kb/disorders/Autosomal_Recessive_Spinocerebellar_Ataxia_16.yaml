phenotypes:
- category: Neurologic
  name: Progressive Cerebellar Ataxia
  description: Progressive truncal, gait and limb ataxia is the defining clinical feature. The 2019 published-case analysis reported median onset at 17 years, with a range of 0.5 to 49 years; these are cohort-specific observations rather than fixed diagnostic age limits.
  phenotype_term:
    preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
    clinical_course: PROGRESSIVE
    onset:
      onset_category: JUVENILE
      min_age_years: 0.5
      max_age_years: 49.0
      notes: Median 17 years, range 0.5–49, in the SCAR16 patient set assembled by Madrigal 2019. The median is not an arithmetic mean. The juvenile category summarizes that median; individual onset spans infancy to adulthood. The French 14–76-year range combines SCAR16 and SCA48 and is not used here.
  frequency: VERY_FREQUENT
  sequelae:
  - target: Dysarthria
  evidence:
  - reference: PMID:33417001
    reference_title: Expanding the clinical spectrum of STIP1 homology and U-box containing protein 1-associated ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we report four SCAR16 and nine SCA48 patients from two SCAR16 and five SCA48 unrelated French families. All presented with slowly progressive cerebellar ataxia.
    explanation: All thirteen patients, including the four SCAR16 cases, had slowly progressive cerebellar ataxia, supporting the VERY_FREQUENT band.
  - reference: PMID:29317501
    reference_title: Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: in humans, mutations in CHIP cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16), a fatal neurodegenerative disease characterized by truncal and limb ataxia that results in gait instability
    explanation: Characterizes the disease by truncal and limb ataxia producing gait instability, which is the phenotype described here.
  - reference: PMID:33417001
    reference_title: Expanding the clinical spectrum of STIP1 homology and U-box containing protein 1-associated ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The age at onset was highly variable, ranging from 14 to 76 years.
    explanation: Documents how wide the onset range runs across STUB1 disease. It is not used to set this entry's recorded range because the cohort combines SCAR16 and SCA48 patients.
  - reference: PMID:31619515
    reference_title: Changes in protein function underlie the disease spectrum in patients with CHIP mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found that the severity of ataxia did not correlate with age of onset
    explanation: Supports the statement that severity does not track age at onset, which distinguishes SCAR16 from the polyglutamine ataxias.
  - reference: PMID:31619515
    reference_title: Changes in protein function underlie the disease spectrum in patients with CHIP mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The median AOO was 17 years of age (range = 0.5-49)
    explanation: Source of the recorded onset median and range. This is a SCAR16-only patient set, which is why it is preferred here over the combined SCAR16/SCA48 range reported by the French series.

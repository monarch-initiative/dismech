discussions:
- discussion_id: scar16_hypogonadism_mechanism
  kind: KNOWLEDGE_GAP
  prompt: By what cellular mechanism does loss of CHIP function produce hypogonadotropic hypogonadism, and why does it occur in only a subset of patients with biallelic STUB1 variants?
  attaches_to:
  - pathophysiology#Hypothalamic-Pituitary Gonadotropin Deficiency
  rationale: The original sisters retained GnRH-stimulated gonadotropin responses, suggesting a hypothalamic contribution without excluding later pituitary dysfunction. Patient-fibroblast signaling studies do not establish endocrine-cell causation. Why hypogonadism occurs in only some STUB1 families remains unresolved.
  evidence:
  - reference: PMID:24742043
    reference_title: 'Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cognitive impairment was present only in one and hypogonadism in none of them.
    explanation: 'The cohort observation that makes the gap concrete: unbiased screening found no hypogonadism at all, against a literature in which it defines the syndrome.'
- discussion_id: scar16_heat_shock_response_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  prompt: Is the impaired heat-shock response seen in SCAR16 patient fibroblasts relevant to the neurodegeneration, given that patient iPSC-derived cortical neurons do not show it?
  attaches_to:
  - pathophysiology#Failure of Chaperone-Assisted Protein Quality Control
  rationale: Evidence exists in a model system and its translational validity is the open question, which is the HUMAN_MODEL_MISMATCH case rather than a plain absence of evidence. Patient fibroblasts show impaired heat-shock response induction and recovery, but patient cortical neurons were resistant to heat stress with high basal HSP70, and an isogenic CRISPR STUB1 knockout neuron line behaved like the patient lines, so the neuronal readout does not separate mutant from null from control. The authors themselves question whether impaired heat-shock response has any role in SCAR16 neuropathology. Since the disease target tissue is neuronal, the fibroblast finding cannot stand as the disease mechanism, and the proteostasis node here rests on the ubiquitination and mitophagy evidence rather than on the heat-shock arm.
  evidence:
  - reference: PMID:33097556
    reference_title: CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Furthermore, STUB1(-/-) neurons generated by CRISPR/Cas9-mediated genome editing from an isogenic healthy control line showed a similar HSR to patients.
    explanation: The isogenic knockout behaving like the patient lines is what removes the neuronal heat-shock readout's ability to discriminate, and is the specific result the mismatch turns on.

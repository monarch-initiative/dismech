    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: In contrast to previous reports, STUB1-ataxia can start even above age 40 years, and neither hypogonadism nor prominent cognitive impairment are obligatory features.
    explanation: The screening cohort found cognitive impairment in one of three affected subjects, demonstrating variability rather than an obligatory feature.

pathophysiology:
- name: Biallelic STUB1 Loss-of-Function Variants
  description: Homozygous or compound heterozygous pathogenic variants in STUB1 are the initiating lesion. Variants are distributed across all three CHIP domains (tetratricopeptide-repeat, coiled-coil and U-box) and include missense, nonsense and frameshift alleles; a nonsense allele truncates the protein before the U-box and abolishes ligase activity outright.
  biological_scale: MOLECULAR
  downstream:
  - target: CHIP Structural Destabilization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29317501
      reference_title: Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: we systematically analyzed CHIP mutations that cause SCAR16 and found that most SCAR16 mutations destabilize CHIP.
      explanation: Systematic biophysical analysis of the SCAR16 allele set establishes that the variants act on CHIP by destabilizing the protein, which is the step this edge asserts.
  - target: Loss of CHIP E3 Ubiquitin Ligase Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24113144
      reference_title: Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Introduction of the Thr246Met mutation into CHIP results in a loss of ubiquitin ligase activity measured directly using recombinant proteins as well as in cell culture models.
      explanation: Introducing the index SCAR16 variant into CHIP abolishes ligase activity in recombinant protein and in cells, which is a direct variant-to-enzyme-defect causal claim.
    - reference: PMID:41851873
      reference_title: A novel STUB1 p.(Gln118*) nonsense variant in compound heterozygosity causes autosomal recessive spinocerebellar ataxia type 16 in a Chinese patient.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We found that STUB1 p.(Gln118*) variant generated truncated proteins of the C-terminus of Hsc70-interacting protein and caused the loss function of ubiquitin ligase activity.
      explanation: A nonsense allele reaches the same endpoint by truncation, showing the edge holds across variant classes and not only for the index missense allele.
  - target: Impaired CHIP-HSC70 Chaperone Coupling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25258038
      reference_title: STUB1 mutations in autosomal recessive ataxias - evidence for mutation-specific clinical heterogeneity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We show that the p.Asn65Ser substitution impairs CHIP's ability to ubiquitinate HSC70 in vitro, despite being able to self-ubiquitinate.
      explanation: A tetratricopeptide-repeat-domain variant selectively impairs handling of the chaperone substrate while leaving self-ubiquitination intact, which is the chaperone-coupling arm of the mechanism rather than a blanket loss of catalysis.
  - target: CARP-Dependent CHIP Aggregate Formation

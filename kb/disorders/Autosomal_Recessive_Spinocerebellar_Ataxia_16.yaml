    explanation: States the biallelic requirement and identifies the gene product as a dual-function E3 ligase and co-chaperone.
- name: CHIP Structural Destabilization
  description: Many tested SCAR16 variants reduce CHIP thermal stability. The p.Thr246Met U-box is structurally disorganized, whereas p.Asn65Ser has increased alpha-helical content and resistance to limited proteolysis in the 2017 study. Effects vary with allele, assay and construct; several 2017 structural experiments used an MBP fusion. Reduced steady-state abundance in cells is a distinct accompanying observation, not proof that every allele is equally unstable.
  biological_scale: MOLECULAR
  downstream:

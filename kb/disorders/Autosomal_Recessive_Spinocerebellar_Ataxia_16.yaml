animal_models:
- name: Chip U-box truncation zebrafish
  species: Zebrafish
  genotype: Homozygous stub1 p.Thr255ValfsTer3 U-box truncation
  publication: PMID:34630034
  description: Engineered U-box truncation abolishes detectable Hsc70 ubiquitination in the recombinant assay but retains a mono-self-ubiquitination band. Early development, longevity and breeding were reported as normal. The model captures selected cellular features of CHIP deficiency rather than a patient-specific allele.
  evidence:
  - reference: PMID:34630034
    reference_title: Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Recombinant wild-type zebrafish Chip showed ubiquitin ligase activity highly comparable to human CHIP, while the mutant Chip protein showed impaired ubiquitination of the Hsc70 substrate and Chip itself.
    explanation: Establishes that the fish orthologue is functionally comparable to human CHIP and that the mutant reproduces the ligase defect, which is what makes the model informative for human STUB1 disease.
  modeled_mechanisms:
  - target: Purkinje Cell Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Purkinje-cell body counts were reduced at 6 and 24 months; cell-body area was reduced at 24 months. Dendritic organization was abnormal, with increased spine counts significant at 6 months only.
    limitations: No gross cerebellar atrophy was demonstrated through 24 months, although absolute cerebellar area was slightly smaller at that age. TUNEL analysis did not confirm cell death. Open-field locomotion and light/dark preference were not significantly altered; increased top-zone exploration in the novel tank is not a demonstrated ataxic motor deficit. The engineered truncation models only part of the human allelic spectrum.
    readouts:
    - name: Purkinje cell body number and size
      target: Purkinje Cell Degeneration
      direction: DECREASED
      interpretation: Purkinje-cell counts were lower at both measured ages; the reduction in cell-body area was significant only at 24 months.
      evidence:
      - reference: PMID:34630034
        reference_title: Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: these fish displayed reduced numbers and sizes of Purkinje cell bodies and abnormal organization of Purkinje cell dendrites
        explanation: Reports the Purkinje cell measurement behind this readout.
    evidence:
    - reference: PMID:34630034
      reference_title: Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: truncation of the Chip U-box domain leads to impaired ubiquitin ligase activity and behavioral and anatomical changes in zebrafish, illustrating the potential of zebrafish to study STUB1-mediated diseases
      explanation: The authors' own statement that the model is informative for STUB1-mediated disease.
  - target: Failure of Chaperone-Assisted Protein Quality Control
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Whole-brain 26S proteasome activity was reduced at 24 months, but not at 6 months, when Purkinje-cell counts were already reduced. The timing does not establish this measured decline as the initiating cause of cell loss.
    limitations: A11 oligomer abundance and immunohistochemical NR2A, Hsp70 and ataxin-3 readouts were not significantly increased. This model does not establish generalized aggregate accumulation.
    readouts:
    - name: Brain 26S proteasome activity
      target: Failure of Chaperone-Assisted Protein Quality Control
      direction: DECREASED
      interpretation: Whole-brain 26S proteasome activity was reduced at 24 months, but not at 6 months, when Purkinje-cell counts were already reduced. The timing does not establish this measured decline as the initiating cause of cell loss.
      evidence:
      - reference: PMID:34630034
        reference_title: Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Mutant fish also had decreased total 26S proteasome activity in the brain
        explanation: Reports the proteasome activity measurement.
    evidence:

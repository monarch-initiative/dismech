    reference_title: "Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CHIP-T246M has no ligase activity, but maintains interactions with chaperones and chaperone-related functions."
    explanation: >-
      Source of the selective-loss claim: the ligase arm fails while the
      co-chaperone arm is preserved.
  - reference: PMID:25258038
    reference_title: "STUB1 mutations in autosomal recessive ataxias - evidence for mutation-specific clinical heterogeneity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the p.Asn65Ser substitution impairs CHIP's ability to ubiquitinate HSC70 in vitro, despite being able to self-ubiquitinate."
    explanation: >-
      A second biallelic-SCAR16 allele, in the TPR domain rather than the U-box,
      shown to lose substrate ubiquitination while retaining autoubiquitination,
      which is why the defect is described as selective.

- name: Failure of Chaperone-Coupled Protein Quality Control
  biological_scale: CELLULAR
  conforms_to: "loss_of_proteostasis#Loss of Proteostasis"
  description: >-
    With the CHIP ligase arm disabled, chaperone-bound misfolded proteins are no
    longer routed efficiently to the proteasome and cellular proteostasis
    degrades. Patient-derived cortical neurons show dysfunctional protein
    refolding and raised basal oxidative stress on proteomic analysis. The
    picture is not uniform across cell types, and one aspect of it has been
    explicitly questioned - see the heat-shock-response discussion below.
  downstream:
  - target: Purkinje Neuron Degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33097556
      reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CHIP-/- mice display severe cerebellar atrophy, show high perinatal lethality and impaired heat stress tolerance."
      explanation: >-
        Loss of CHIP in vivo produces cerebellar degeneration, supporting the
        step from proteostasis failure to cerebellar neuronal loss. Graded
        MODEL_ORGANISM and read with the caveat that the null is more severe
        than the SCAR16 knock-in.
  - target: Multisystem Neuronal Degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28193273
      reference_title: "STUB1/CHIP mutations cause Gordon Holmes syndrome as part of a widespread multisystemic neurodegeneration: evidence from four novel mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings provide clinical and imaging support for the notion that CHIP is a crucial converging point of manifold neurodegenerative processes, corresponding with its universal biological function in neurodegeneration."
      explanation: >-
        Argues from patient imaging and phenotype that loss of CHIP's general
        proteostatic function is what produces degeneration beyond the
        cerebellum.
  - target: Hypothalamic-Pituitary-Gonadal Axis Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24113144
      reference_title: "Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of CHIP function in mice resulted in behavioral and reproductive impairments that mimic human ataxia and hypogonadism."
      explanation: >-
        Loss of CHIP function reproduces reproductive as well as motor
        impairment in vivo. Recorded as INDIRECT because the specific
        neuroendocrine cell population through which CHIP loss reaches the
        gonadal axis has not been established.
  biological_processes:
  - preferred_term: protein quality control for misfolded or incompletely synthesized proteins
    term:
      id: GO:0006515
      label: protein quality control for misfolded or incompletely synthesized proteins
    modifier: DECREASED
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  cell_types:
  - preferred_term: iPSC-derived cortical neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  evidence:
  - reference: PMID:33097556
    reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Proteomic analysis of CNs showed dysfunctional protein (re)folding and higher basal oxidative stress levels in patients."
    explanation: >-
      Patient-derived cortical neurons show the proteostatic defect this node
      names, measured directly by proteomics.

- name: Failure of NMDA Receptor NR2A Subunit Turnover
  biological_scale: MOLECULAR
  description: >-
    One identified CHIP substrate with a plausible route to cerebellar
    vulnerability is NR2A (GRIN2A), a subunit of the NMDA receptor. CHIP
    colocalizes with NR2A across cerebellum, pons, medulla, hippocampus and
    cortex, and wild-type but not SCAR16-mutant CHIP promotes its degradation.
    This is a candidate substrate-level mechanism proposed by the discovery
    study, not an established requirement for the phenotype; the authors
    themselves frame it as something that may underlie the ataxia.
  downstream:
  - target: Purkinje Neuron Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24312598
      reference_title: "Identification of CHIP as a novel causative gene for autosomal recessive cerebellar ataxia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Wild-type, but not disease-associated mutant CHIPs promoted the degradation of NR2A, which may underlie the pathogenesis of ataxia."
      explanation: >-
        The authors advance failed NR2A turnover as a candidate route to the
        ataxia phenotype. Recorded as INDIRECT because the quote proposes rather
        than demonstrates the link to neuronal degeneration.
  molecular_functions:
  - preferred_term: NMDA glutamate receptor activity
    term:
      id: GO:0004972
      label: NMDA glutamate receptor activity
  evidence:
  - reference: PMID:24312598
    reference_title: "Identification of CHIP as a novel causative gene for autosomal recessive cerebellar ataxia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CHIP colocalized with NR2A, a subunit of the N-methyl-D-aspartate receptor, in the cerebellum, pons, medulla oblongata, hippocampus and cerebral cortex."
    explanation: >-
      Establishes the anatomical overlap of ligase and candidate substrate in
      the regions affected in SCAR16.

- name: PDE9A Accumulation and cGMP-cAMP Imbalance
  biological_scale: MOLECULAR
  description: >-
    Phosphodiesterase 9A is a CHIP substrate: CHIP polyubiquitinates PDE9A and
    routes it to autophagic degradation. When CHIP is dysfunctional PDE9A
    accumulates, cGMP hydrolysis rises, and PKG can no longer phosphorylate CHIP
    at serine 19 - which removes a brake on PDE9A and makes the accumulation
    self-amplifying. This branch was found by starting from a preclinical rodent
    model of CHIP-related ataxia rather than from a candidate-substrate list, and
    it is the branch that carries the only pharmacological rescue reported so far
    in this disorder.
  downstream:
  - target: Mitophagy Dysregulation in Cerebellar Neurons
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39806097
      reference_title: "E3 ubiquitin ligase CHIP facilitates cAMP and cGMP signalling cross-talk by polyubiquitinating PDE9A."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This cascade further amplifies PDE9A accumulation, ultimately disrupting mitophagy and triggering neuronal apoptosis."
      explanation: >-
        States the step from the PDE9A cascade to disrupted mitophagy and
        neuronal death, which is this edge.
  molecular_functions:
  - preferred_term: 3',5'-cyclic-nucleotide phosphodiesterase activity
    term:
      id: GO:0004114
      label: 3',5'-cyclic-nucleotide phosphodiesterase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:39806097
    reference_title: "E3 ubiquitin ligase CHIP facilitates cAMP and cGMP signalling cross-talk by polyubiquitinating PDE9A."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In a preclinical rodent model of CHIP-related ataxia, we observed that CHIP mutations lead to increased levels of phosphodiesterase 9A (PDE9A), whose role in this context remains poorly understood."
    explanation: >-
      Establishes PDE9A accumulation as a consequence of CHIP mutation in the
      disease model, which is what this node claims.

- name: Mitophagy Dysregulation in Cerebellar Neurons
  biological_scale: CELLULAR
  description: >-
    CHIP is a negative regulator of PINK1/Parkin mitophagy - it degrades PINK1
    and impairs Parkin recruitment to mitochondria - so losing it removes a
    brake, and disease-associated CHIP mutations dysregulate mitophagy in vitro
    and in C. elegans neurons. The PDE9A/cGMP branch converges here from the
    other direction, with Purkinje-neuron mitophagy dysfunction named as the
    cerebellar pathology that PDE9A inhibition protects against. The direction of
    the net defect in human Purkinje cells is not settled, which is why this node
    is titled dysregulation rather than loss or excess.
  downstream:
  - target: Purkinje Neuron Degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39806097
      reference_title: "E3 ubiquitin ligase CHIP facilitates cAMP and cGMP signalling cross-talk by polyubiquitinating PDE9A."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Notably, pharmacological inhibition of PDE9A via Bay 73-6691 or virus-mediated CHIP expression restored the balance of cGMP/cAMP signalling. These interventions protect against cerebellar neuropathologies, particularly Purkinje neuron mitophagy dysfunction."
      explanation: >-
        A rescue experiment: correcting the upstream imbalance protects against
        Purkinje neuropathology, which is the strongest available support for
        this edge being causal rather than correlative.
  biological_processes:
  - preferred_term: mitophagy
    term:
      id: GO:0000423
      label: mitophagy
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:39117117
    reference_title: "Disease-associated mutations in C-terminus of HSP70 interacting protein (CHIP) impair its ability to negatively regulate mitophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that CHIP acts as a negative regulator of the PTEN-induced kinase 1 (PINK1)/Parkin-mediated mitophagy pathway, promoting the degradation of PINK1, impairing Parkin translocation to the mitochondria, and suppressing mitophagy in response to mitochondrial stress"
    explanation: >-
      Establishes the normal regulatory role of CHIP that is lost in SCAR16, and
      is the reason the node is framed as loss of a brake.
  - reference: PMID:39117117
    reference_title: "Disease-associated mutations in C-terminus of HSP70 interacting protein (CHIP) impair its ability to negatively regulate mitophagy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "we find that multiple disease-associated mutations in CHIP dysregulate mitophagy both in vitro and in vivo in C. elegans neurons, a finding which could implicate mitophagy dysregulation in CHIP-associated diseases"
    explanation: >-
      Shows the disease mutations dysregulate mitophagy in neurons. Recorded as
      INDIRECT because the neurons are invertebrate and the authors themselves
      state only that this could implicate mitophagy in CHIP-associated disease.

- name: Purkinje Neuron Degeneration
  biological_scale: CELLULAR
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  description: >-
    Cerebellar Purkinje cells, the sole output neurons of the cerebellar cortex,
    are the vulnerable population. They are large, postmitotic and heavily
    dependent on protein quality control, which is the standard explanation for
    why a generalised proteostatic lesion presents as a cerebellar syndrome.
    Direct human neuropathology in biallelic SCAR16 is scarce; the strongest
    in vivo evidence is that CHIP-null mice develop severe cerebellar atrophy
    and that T246M knock-in mice and rats show cerebellar motor dysfunction.
  downstream:
  - target: Cerebellar Cortical Atrophy and Output Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33097556
      reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CHIP-/- mice display severe cerebellar atrophy, show high perinatal lethality and impaired heat stress tolerance."
      explanation: >-
        Loss of CHIP produces gross cerebellar atrophy in vivo, the tissue-level
        consequence of neuronal loss that this edge asserts.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:30222779
    reference_title: "Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Animals homozygous for T246M had both cognitive and motor cerebellar dysfunction distinct from those observed in the CHIP null animal model, as well as deficits in learning and memory, reflective of the cognitive deficits reported in SCAR16 patients."
    explanation: >-
      The genotype-matched knock-in model develops cerebellar motor dysfunction,
      and its divergence from the null is the basis for the caveat in the
      description.

- name: Cerebellar Cortical Atrophy and Output Failure
  biological_scale: TISSUE
  conforms_to: "cerebellar_purkinje_degeneration#Loss of Cerebellar Cortical Output"
  description: >-
    Purkinje cell loss removes the inhibitory output of the cerebellar cortex to
    the deep cerebellar nuclei and manifests structurally as cerebellar atrophy,
    which is present on MRI in essentially every reported SCAR16 patient and
    frequently extends to the brainstem. The result is the loss of feed-forward
    motor coordination that produces the cardinal ataxia and dysarthria.
  downstream:
  - target: Progressive Cerebellar Ataxia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32367277
      reference_title: "Clinical and Genetic Characterization of Autosomal Recessive Spinocerebellar Ataxia Type 16 (SCAR16) in Taiwan."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The brain MRIs showed a marked cerebellar atrophy of the patients."
      explanation: >-
        Ties the structural cerebellar lesion to the ataxic patients in whom it
        was imaged.
  - target: Dysarthria
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36569391
      reference_title: "MRI Findings in a Patient with Known SCAR-16 Type STUB1 Associated Cerebellar Ataxia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "A 34-year-old patient with a known family history of spinocerebellar ataxia and known mutation of the STUB1 gene presents to the neurological outpatient clinic with four-year slow onset history of dizziness, slurred speech, and hearing impairment and ataxia."
      explanation: >-
        Slurred speech and ataxia in a genetically confirmed SCAR16 patient whose
        MRI showed cerebellar and brainstem atrophy. Recorded as INDIRECT because
        this is co-occurrence of the structural lesion and the speech deficit in
        one patient, not a demonstration that the former produces the latter.
  evidence:
  - reference: PMID:33417001
    reference_title: "Expanding the clinical spectrum of STIP1 homology and U-box containing protein 1-associated ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI showed marked cerebellar atrophy in all patients."
    explanation: >-
      Cerebellar atrophy in every patient of a combined SCAR16/SCA48 French
      series establishes it as an essentially constant structural finding.

- name: Multisystem Neuronal Degeneration
  biological_scale: TISSUE
  description: >-
    SCAR16 is not confined to the cerebellum. Diffusion tensor imaging shows
    degeneration of many supra- and infratentorial tracts, and the clinical
    counterpart is dementia, corticospinal tract dysfunction with spasticity and
    hyperreflexia, epilepsy and autonomic failure. This is the observation that
    motivates conceptualising STUB1 disease by gene rather than by the historical
    syndrome names.
  downstream:
  - target: Cognitive Decline and Dementia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33097556
      reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Mutations in STUB1 cause autosomal recessive spinocerebellar ataxia type 16 (SCAR16) with widespread neurodegeneration manifesting as spastic-ataxic gait disorder, dementia and epilepsy."
      explanation: >-
        States that the widespread neurodegeneration of SCAR16 manifests as
        dementia, which is this edge. Graded OTHER because the sentence is the
        paper's framing of the disorder rather than a result of its experiments.
  - target: Pyramidal Tract Signs
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24742043
      reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All patients showed evidence of pyramidal tract damage."
      explanation: >-
        Reports corticospinal involvement in every STUB1 patient of the cohort,
        the tract-level lesion this edge asserts.
  - target: Seizures
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33097556
      reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Mutations in STUB1 cause autosomal recessive spinocerebellar ataxia type 16 (SCAR16) with widespread neurodegeneration manifesting as spastic-ataxic gait disorder, dementia and epilepsy."
      explanation: >-
        States that the widespread neurodegeneration of SCAR16 is what manifests
        as epilepsy, which is this edge. Graded OTHER because the sentence is the
        paper's framing of the disorder rather than a result of its experiments.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:28193273
    reference_title: "STUB1/CHIP mutations cause Gordon Holmes syndrome as part of a widespread multisystemic neurodegeneration: evidence from four novel mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffusion tensor imaging revealed degeneration of manifold supra- and infratentorial tracts."
    explanation: >-
      Imaging evidence of degeneration well beyond the cerebellum, which is what
      this node claims.

- name: Hypothalamic-Pituitary-Gonadal Axis Failure
  biological_scale: ORGANISM
  description: >-
    A subset of SCAR16 patients has hypogonadotropic hypogonadism, the feature
    that produces the Gordon Holmes phenotype. The deficit is central rather than
    primary gonadal. Loss of CHIP function reproduces reproductive impairment in
    mice alongside the motor phenotype, but the neuroendocrine cell population
    through which the proteostatic lesion reaches the gonadal axis has not been
    identified, and hypogonadism is absent in many biallelic patients, so this
    node is a partially penetrant branch rather than a step every case takes.
  downstream:
  - target: Hypogonadotropic Hypogonadism
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24113144
      reference_title: "Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Gordon Holmes syndrome (GHS) is a rare Mendelian neurodegenerative disorder characterized by ataxia and hypogonadism."
      explanation: >-
        Names hypogonadism as the endocrine manifestation of the central axis
        failure in the STUB1 phenotype this node describes.
  evidence:
  - reference: PMID:24113144
    reference_title: "Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of CHIP function in mice resulted in behavioral and reproductive impairments that mimic human ataxia and hypogonadism."
    explanation: >-
      In vivo loss of CHIP produces the reproductive phenotype this node names.
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to previous reports, STUB1-ataxia can start even above age 40 years, and neither hypogonadism nor prominent cognitive impairment are obligatory features."
    explanation: >-
      Refutes any reading of this node as an obligatory step: none of the three
      STUB1 patients in this cohort had hypogonadism.

phenotypes:
- category: Neurologic
  name: Progressive Cerebellar Ataxia
  description: >-
    The cardinal and essentially universal feature: slowly progressive truncal,
    gait and limb ataxia causing gait instability. It is the presenting complaint
    in most patients and may occur in isolation, without cognitive, pyramidal or
    endocrine involvement.
  phenotype_term:
    preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:29317501
    reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "in humans, mutations in CHIP cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16), a fatal neurodegenerative disease characterized by truncal and limb ataxia that results in gait instability"
    explanation: >-
      Names truncal and limb ataxia with gait instability as the defining
      clinical characteristic of the disorder.
  - reference: PMID:33417001
    reference_title: "Expanding the clinical spectrum of STIP1 homology and U-box containing protein 1-associated ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report four SCAR16 and nine SCA48 patients from two SCAR16 and five SCA48 unrelated French families. All presented with slowly progressive cerebellar ataxia."
    explanation: >-
      Every patient in the series, SCAR16 included, had slowly progressive
      cerebellar ataxia, supporting both the frequency and the progressive
      course.
  - reference: PMID:32367277
    reference_title: "Clinical and Genetic Characterization of Autosomal Recessive Spinocerebellar Ataxia Type 16 (SCAR16) in Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, the three patients from the two SCAR16 families presented with cerebellar ataxia alone or in combination with cognitive impairment."
    explanation: >-
      Supports the specific claim that ataxia can be the isolated manifestation.
  - reference: PMID:32342324
    reference_title: "Spinocerebellar ataxia type 48: last but not least."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SCAR16 is characterized by early onset spastic ataxia and a wide disease spectrum, including cognitive dysfunction, hyperkinetic disorders, epilepsy, peripheral neuropathy, and hypogonadism."
    explanation: >-
      A review of the published SCAR16 patients characterises the core syndrome
      as early-onset spastic ataxia, which is the modal presentation even though
      onset extends into late adulthood.

- category: Neurologic
  name: Dysarthria
  description: >-
    Cerebellar dysarthria with slurred, scanning speech accompanies the ataxia
    and is among the presenting features.
  phenotype_term:
    preferred_term: Dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  evidence:
  - reference: PMID:32258232
    reference_title: "Extending the Phenotypic Spectrum Associated with STUB1 Mutations: A Case of Dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a 45-year-old right-handed woman with dysarthria, ataxia, and cervical dystonia with SCAR16"
    explanation: >-
      Reports dysarthria in a genetically confirmed biallelic SCAR16 patient.

- category: Neurologic
  name: Cognitive Decline and Dementia
  description: >-
    Cognitive involvement spans a wide range, from executive dysfunction to
    frank dementia, and can be the inaugural manifestation. It is frequent but
    not obligatory - patients with isolated ataxia and preserved cognition are
    reported - and its severity, together with tendon-reflex status, predicts a
    substantial fraction of the variance in ataxia severity across the cohort.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
    clinical_course: PROGRESSIVE
  frequency: FREQUENT
  evidence:
  - reference: PMID:31619515
    reference_title: "Changes in protein function underlie the disease spectrum in patients with CHIP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease spectrum of SCAR16 includes a varying age of disease onset, cognitive dysfunction, increased tendon reflex, and hypogonadism."
    explanation: >-
      Places cognitive dysfunction in the established SCAR16 phenotype spectrum.
  - reference: PMID:31619515
    reference_title: "Changes in protein function underlie the disease spectrum in patients with CHIP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that the severity of ataxia did not correlate with age of onset; however, cognitive dysfunction, increased tendon reflex, and ancestry were able to predict 54% of the variation in ataxia severity."
    explanation: >-
      Quantifies the relationship between cognitive involvement and overall
      disease severity across the reported patient set.
  - reference: PMID:33097556
    reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in STUB1 cause autosomal recessive spinocerebellar ataxia type 16 (SCAR16) with widespread neurodegeneration manifesting as spastic-ataxic gait disorder, dementia and epilepsy."
    explanation: >-
      Names dementia among the manifestations of SCAR16.
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to previous reports, STUB1-ataxia can start even above age 40 years, and neither hypogonadism nor prominent cognitive impairment are obligatory features."
    explanation: >-
      Refutes cognitive impairment as an obligatory feature, which is why the
      frequency is recorded as FREQUENT rather than VERY_FREQUENT.

- category: Neurologic
  name: Pyramidal Tract Signs
  description: >-
    Corticospinal involvement is a common accompaniment: brisk lower-limb tendon
    reflexes, spasticity, and in the most severe cases spastic tetraparesis. It
    is prominent enough that STUB1-ataxia belongs in the differential of the
    spastic ataxias, although STUB1 is not a meaningful cause of pure spastic
    paraplegia.
  phenotype_term:
    preferred_term: Hyperreflexia
    term:
      id: HP:0001347
      label: Hyperreflexia
  frequency: FREQUENT
  evidence:
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pyramidal tract damage is a common accompanying feature and can include lower limb spasticity"
    explanation: >-
      States both the frequency and the spastic character of the pyramidal
      involvement.
  - reference: PMID:30058754

diagnosis:
- name: STUB1 sequencing in progressive ataxia with cerebellar atrophy
  description: >-
    Diagnosis rests on finding biallelic pathogenic STUB1 variants in a patient
    with progressive cerebellar ataxia and cerebellar atrophy on MRI. STUB1 is a
    conventional non-repeat gene, so it is missed by the repeat-expansion panels
    used first-line in ataxia and must be covered by a multigene sequencing panel
    or exome/genome test; it is among the highest-yield genes on such panels.
    Two practical points follow from the phenotype. Isolated cerebellar ataxia
    without cognitive, pyramidal or endocrine involvement does not exclude
    STUB1, and neither does onset after 40. Coverage should extend to the STUB1
    3'UTR, since a polyadenylation-signal variant outside the coding sequence is
    an established cause.
  evidence:
  - reference: PMID:34445196
    reference_title: "NGS in Hereditary Ataxia: When Rare Becomes Frequent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "STUB1, PRKCG, and SPG7 were the most common causative genes."
    explanation: >-
      In a 377-patient hereditary ataxia cohort undiagnosed by routine testing,
      STUB1 was among the top-yielding genes on a targeted resequencing panel.
  - reference: PMID:32367277
    reference_title: "Clinical and Genetic Characterization of Autosomal Recessive Spinocerebellar Ataxia Type 16 (SCAR16) in Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCAR16 is an important but often neglected diagnosis of cerebellar ataxia of unknown cause, and the isolated cerebellar ataxia without involvement of other systems cannot be a basis to exclude the possibility of STUB1-related disease."
    explanation: >-
      Source of the caution that isolated ataxia does not exclude the diagnosis.
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to previous reports, STUB1-ataxia can start even above age 40 years, and neither hypogonadism nor prominent cognitive impairment are obligatory features."
    explanation: >-
      Source of the caution that later onset and absent hypogonadism do not
      exclude the diagnosis.
  - reference: PMID:30058754
    reference_title: "STUB1 polyadenylation signal variant AACAAA does not affect polyadenylation but decreases STUB1 translation causing SCAR16."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "exome sequencing revealed novel homozygous c.*240T > C variant in the 3'UTR of STUB1, the gene responsible for autosomal recessive spinocerebellar ataxia 16 (SCAR16)"
    explanation: >-
      Establishes that a pathogenic variant can lie outside the coding sequence,
      which is why 3'UTR coverage matters.

differential_diagnoses:
- name: Spinocerebellar ataxia 48 (heterozygous STUB1)
  disease_term:
    preferred_term: spinocerebellar ataxia 48
    term:
      id: MONDO:0032526
      label: spinocerebellar ataxia 48
  description: >-
    The allelic autosomal dominant STUB1 disorder, curated separately in this
    knowledge base. It shares ataxia, cognitive-affective involvement, dystonia
    and parkinsonism with SCAR16, and dominant and recessive variants are
    biochemically indistinguishable in vitro, so the two form a continuum rather
    than separable syndromes.
  distinguishing_features:
  - >-
    SCA48 is caused by a single heterozygous STUB1 variant; SCAR16 requires two
    variants in trans or a homozygous variant.
  - >-
    SCA48 is characteristically adult-onset with a cerebellar cognitive-affective
    syndrome that often precedes the motor syndrome; SCAR16 more often begins
    earlier and carries pyramidal signs and, in a subset, hypogonadism.
  - >-
    Bilateral dentate T2 hyperintensity with postero-lateral hemispheric atrophy
    (the "crab sign") is described in SCA48 and is not a recurrent SCAR16
    finding.
  - >-
    Intermediate-length TBP CAG/CAA expansions co-occur with heterozygous STUB1
    variants and modify penetrance in the dominant disorder; this digenic
    interaction is not part of the recessive disorder.
  evidence:
  - reference: PMID:34070858
    reference_title: "Genetic Dominant Variants in STUB1, Segregating in Families with SCA48, Display In Vitro Functional Impairments Indistinctive from Recessive Variants Associated with SCAR16."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These studies revealed that dominantly and recessively inherited STUB1 variants showed similar biochemical defects, including impaired ubiquitin ligase activity and altered oligomerization properties of the CHIP."
    explanation: >-
      Establishes that the two disorders cannot be separated by variant class,
      which is why zygosity and phenotype carry the distinction.
  - reference: PMID:34906452
    reference_title: "Digenic inheritance of STUB1 variants and TBP polyglutamine expansions explains the incomplete penetrance of SCA17 and SCA48."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All except 1 (30/31) of the index cases with TBP41-46 alleles carried a heterozygous pathogenic variant in the STUB1 gene associated with spinocerebellar ataxias SCAR16 (autosomal recessive) and SCA48 (autosomal dominant)."
    explanation: >-
      Source of the TBP digenic distinguishing feature, and explicit that the
      interaction involves heterozygous STUB1 carriers.
  - reference: PMID:32342324
    reference_title: "Spinocerebellar ataxia type 48: last but not least."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The overlap of several clinical signs between SCAR16 and SCA48 indicates the presence of a continuous clinical spectrum among recessively and dominantly inherited mutations of STUB1."
    explanation: >-
      A review of both patient sets states the continuity that makes this a
      differential diagnosis rather than a clean separation.

- name: Cerebellar ataxia-hypogonadism syndrome (Gordon Holmes syndrome)
  disease_term:
    preferred_term: cerebellar ataxia-hypogonadism syndrome
    term:
      id: MONDO:0008935
      label: cerebellar ataxia-hypogonadism syndrome
  description: >-
    The clinically defined, genetically heterogeneous syndrome of ataxia with
    hypogonadotropic hypogonadism, curated separately in this knowledge base.
    Biallelic STUB1 is one of its causes, so a SCAR16 patient who has
    hypogonadism satisfies both concepts; the majority of Gordon Holmes cases,
    however, are caused by RNF216 or PNPLA6, and the majority of SCAR16 patients
    have no hypogonadism.
  distinguishing_features:
  - >-
    Gordon Holmes syndrome is defined by a clinical combination and admits
    several genes; SCAR16 is defined by biallelic STUB1 regardless of whether
    hypogonadism is present.
  - >-
    Hypogonadism is required for the Gordon Holmes label and is absent in whole
    SCAR16 cohorts.
  evidence:
  - reference: PMID:28193273
    reference_title: "STUB1/CHIP mutations cause Gordon Holmes syndrome as part of a widespread multisystemic neurodegeneration: evidence from four novel mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This supports the notion that STUB1 disease should be conceptualized not by historical or clinical syndromic names, but as a variable multisystemic disease defined by disturbed function of the underlying STUB1 gene"
    explanation: >-
      The argument for keeping the gene-defined and syndrome-defined concepts
      apart, made by the authors who reported STUB1 Gordon Holmes families.
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cognitive impairment was present only in one and hypogonadism in none of them."
    explanation: >-
      Demonstrates a SCAR16 cohort in which no patient would meet the Gordon
      Holmes definition.

- name: Hereditary spastic paraplegia
  description: >-
    The pyramidal involvement of SCAR16 puts it in the differential of the
    spastic ataxias, and lower-limb spasticity can dominate the early picture.
    Screening argues against the reverse confusion: no biallelic STUB1 disease
    was found among patients with predominant spastic paraplegia.
  distinguishing_features:
  - >-
    In SCAR16 the ataxia and cerebellar atrophy are primary and the spasticity
    accompanies them; in hereditary spastic paraplegia the corticospinal
    syndrome dominates and cerebellar atrophy is not the leading finding.
  evidence:
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, STUB1 is rare in subjects with predominant spastic paraplegia (0/133)."
    explanation: >-
      Establishes the asymmetry: spastic ataxia should prompt STUB1 testing,
      pure spastic paraplegia much less so.

treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    No disease-modifying therapy exists for SCAR16, and no SCAR16-specific
    interventional trial has been reported. Management is symptomatic and
    coordinated across neurology, clinical genetics, rehabilitation,
    neuropsychology, speech-language pathology and, where hypogonadism is
    present, endocrinology. Expert consensus for degenerative cerebellar
    disorders is that no medication has been shown to be effective outside
    episodic ataxia type 2, so pharmacological trials should be framed as
    symptomatic and individualised rather than disease-modifying.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:24222635
    reference_title: "Consensus paper: management of degenerative cerebellar disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is consensus that up to date, no medication has been proven effective."
    explanation: >-
      Expert consensus across degenerative cerebellar ataxias establishes the
      absence of proven pharmacotherapy, which is the premise of a supportive
      management strategy.

- name: Physiotherapy and Coordinative Training
  description: >-
    Physiotherapy is the mainstay of treatment for degenerative cerebellar
    ataxia, together with occupational therapy and speech therapy. A
    meta-analysis of randomised trials in degenerative cerebellar ataxia found a
    significant reduction in SARA score with physiotherapy; the certainty of
    evidence was low and no trial was SCAR16-specific, so this is generalised
    from the degenerative-ataxia population.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
  evidence:
  - reference: PMID:24222635
    reference_title: "Consensus paper: management of degenerative cerebellar disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As such, all authors agreed that the mainstays of treatment of degenerative cerebellar ataxia are currently physiotherapy, occupational therapy, and speech therapy."
    explanation: >-
      Expert consensus identifies physiotherapy as the mainstay of management
      for this class of disorder.
  - reference: PMID:39866519
    reference_title: "Effects of physiotherapy on degenerative cerebellar ataxia: a systematic review and meta-analysis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, physiotherapy significantly reduced SARA scores (MD = -1.41, [95% CI: -2.16, -0.66])"
    explanation: >-
      Quantifies the effect in the degenerative-ataxia population. Recorded as
      INDIRECT because the pooled trials were not SCAR16-specific and the review
      reports low certainty of evidence.

- name: Speech and Swallowing Therapy
  description: >-
    Speech therapy addresses the cerebellar dysarthria that accompanies the
    ataxia, and swallowing assessment becomes relevant as dysphagia develops.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and swallowing therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: Dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  - preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: PMID:24222635
    reference_title: "Consensus paper: management of degenerative cerebellar disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the mainstays of treatment of degenerative cerebellar ataxia are currently physiotherapy, occupational therapy, and speech therapy"
    explanation: >-
      Speech therapy is named among the consensus mainstays of management for
      degenerative cerebellar ataxia.

- name: Occupational Therapy
  description: >-
    Occupational therapy supports activities of daily living, home safety and
    fall prevention as gait ataxia and dysmetria progress, and is relevant early
    given the cognitive involvement many patients carry.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  evidence:
  - reference: PMID:24222635
    reference_title: "Consensus paper: management of degenerative cerebellar disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the mainstays of treatment of degenerative cerebellar ataxia are currently physiotherapy, occupational therapy, and speech therapy"
    explanation: >-
      Occupational therapy is named among the consensus mainstays of management.

- name: Genetic Counselling and Cascade Testing
  description: >-
    Counselling covers the 25% sibling recurrence risk of an autosomal recessive
    disorder, carrier testing, and consanguinity where relevant. One
    STUB1-specific complication must be raised: because heterozygous STUB1
    variants cause the dominant allelic disorder SCA48 with incomplete,
    age-dependent penetrance, a carrier parent or sibling in a SCAR16 pedigree
    cannot be reassured that they carry no risk of a later ataxia, and the
    authors who established the biochemical equivalence of dominant and
    recessive variants say so explicitly.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34070858
    reference_title: "Genetic Dominant Variants in STUB1, Segregating in Families with SCA48, Display In Vitro Functional Impairments Indistinctive from Recessive Variants Associated with SCAR16."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings expand the molecular understanding of SCA48 but also mean that assumptions concerning unaffected carriers of recessive STUB1 variants in SCAR16 families must be re-evaluated."
    explanation: >-
      States the specific counselling complication this treatment entry exists
      to capture.

animal_models:
- name: CHIP T246M knock-in mouse
  species: Mouse
  genotype: Stub1 T246M homozygous knock-in
  publication: PMID:30222779
  description: >-
    The genotype-matched preclinical model of SCAR16: the archetypal human
    T246M substitution engineered at the endogenous mouse locus. Homozygotes
    develop both motor cerebellar dysfunction and learning and memory deficits,
    reproducing the pairing of ataxia with cognitive impairment seen in patients.
    Its phenotype is explicitly distinct from the CHIP null, which is the
    experimental basis for treating SCAR16 as a selective loss of the ligase arm
    rather than as absence of CHIP.
  modeled_mechanisms:
  - target: Purkinje Neuron Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Homozygous T246M animals develop cerebellar motor dysfunction on the
      correct genotype.
    limitations: >-
      The reported readout is behavioural cerebellar dysfunction rather than
      quantified Purkinje cell loss, so the cellular claim is inferred from the
      motor phenotype. T246M is one of many SCAR16 alleles and, being a
      ligase-dead but chaperone-competent variant, is not representative of
      alleles that reduce CHIP abundance.
    evidence:
    - reference: PMID:30222779
      reference_title: "Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Animals homozygous for T246M had both cognitive and motor cerebellar dysfunction distinct from those observed in the CHIP null animal model, as well as deficits in learning and memory, reflective of the cognitive deficits reported in SCAR16 patients."
      explanation: >-
        Reports the cerebellar motor phenotype on the SCAR16 genotype.
  - target: Multisystem Neuronal Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Learning and memory deficits in the knock-in mirror the cognitive
      involvement that accompanies ataxia in patients.
    limitations: >-
      Rodent learning and memory deficits are a coarse proxy for the human
      dementia syndrome, and the model has not been shown to reproduce the
      epilepsy, autonomic failure or spastic tetraparesis of the severe human
      phenotype.
    evidence:
    - reference: PMID:30222779
      reference_title: "Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Animals homozygous for T246M had both cognitive and motor cerebellar dysfunction distinct from those observed in the CHIP null animal model, as well as deficits in learning and memory, reflective of the cognitive deficits reported in SCAR16 patients."
      explanation: >-
        Reports the cognitive phenotype alongside the motor one.
  evidence:
  - reference: PMID:30222779
    reference_title: "Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To establish preclinical models of SCAR16, we engineered T246M at the endogenous locus in both mice and rats."
    explanation: >-
      Establishes the model's construction and its intended purpose as a SCAR16
      preclinical model.

- name: CHIP T246M knock-in rat
  species: Rat
  genotype: Stub1 T246M homozygous knock-in
  publication: PMID:30222779
  description: >-
    The rat counterpart of the knock-in mouse, generated in the same study at the
    endogenous locus, extending the SCAR16 genotype to a second species.
  evidence:
  - reference: PMID:30222779
    reference_title: "Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To establish preclinical models of SCAR16, we engineered T246M at the endogenous locus in both mice and rats."
    explanation: >-
      Documents the rat knock-in alongside the mouse.

- name: CHIP null mouse
  species: Mouse
  genotype: Stub1 knockout (CHIP-/-)
  publication: PMID:33097556
  description: >-
    The constitutive knockout, which predates the SCAR16 knock-in models. It
    develops severe cerebellar atrophy with impaired heat stress tolerance and
    high perinatal lethality. It is the strongest in vivo demonstration that
    losing CHIP degrades the cerebellum, but it is not a SCAR16 genotype: no
    reported patient is CHIP-null, the knock-in phenotype is explicitly milder
    and different, and the perinatal lethality has no human counterpart.
  modeled_mechanisms:
  - target: Cerebellar Cortical Atrophy and Output Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Complete loss of CHIP produces gross cerebellar atrophy, the tissue-level
      lesion seen on patient MRI.
    limitations: >-
      The null is not the SCAR16 genotype. Human disease results from biallelic
      hypomorphic or ligase-dead variants that retain protein and chaperone
      function, and the T246M knock-in phenotype is explicitly distinct from the
      null's. High perinatal lethality has no counterpart in a disorder whose
      onset spans childhood to the eighth decade.
    evidence:
    - reference: PMID:33097556
      reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CHIP-/- mice display severe cerebellar atrophy, show high perinatal lethality and impaired heat stress tolerance."
      explanation: >-
        Reports the cerebellar atrophy and, in the same sentence, the lethality
        that limits the model's fidelity.
  evidence:
  - reference: PMID:30222779
    reference_title: "Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Animals homozygous for T246M had both cognitive and motor cerebellar dysfunction distinct from those observed in the CHIP null animal model, as well as deficits in learning and memory, reflective of the cognitive deficits reported in SCAR16 patients."
    explanation: >-
      Source of the claim that the null and the SCAR16 knock-in have distinct
      phenotypes.

experimental_models:
- name: SCAR16 patient-derived iPSC line HIHCNi001-A
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cells reprogrammed from skin fibroblasts of a
    12-year-old male SCAR16 patient carrying compound heterozygous STUB1
    variants c.355C>T and c.880A>T. The line retains the disease genotype and is
    the substrate for the patient-derived cortical neuron work below. Its donor
    also documents the paediatric end of the SCAR16 onset range.
  evidence:
  - reference: PMID:29679845
    reference_title: "Establishment of STUB1/CHIP mutant induced pluripotent stem cells (iPSCs) from a patient with Gordon Holmes syndrome/SCAR16."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we reprogrammed human skin fibroblasts from a 12-year-old male patient with recessive spinocerebellar ataxia type 16 (OMIM #615768), carrying compound heterozygous mutations (c.355C>T, c.880A>T) in STUB1"
    explanation: >-
      Documents the line's derivation, donor age and disease genotype.

- name: SCAR16 patient iPSC-derived cortical neurons and fibroblasts
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Primary fibroblasts and iPSC-derived cortical neurons from three SCAR16
    patients, compared with healthy controls and with an isogenic STUB1-null
    line made by CRISPR/Cas9 editing of a control. Proteomics on the neurons
    shows dysfunctional protein refolding and raised basal oxidative stress. The
    same system produced the study's negative result on the heat shock response,
    recorded in the discussion below.
  modeled_mechanisms:
  - target: Failure of Chaperone-Coupled Protein Quality Control
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Patient-derived neurons show the proteostatic defect directly, by
      proteomics, on the correct human genotype.
    limitations: >-
      Cortical neurons are not the cell type that degenerates first in SCAR16;
      no Purkinje-cell model exists, so the vulnerable population is not the one
      assayed. The system is two-dimensional and lacks the aged, circuit-embedded
      context in which the human disease develops over decades.
    evidence:
    - reference: PMID:33097556
      reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Proteomic analysis of CNs showed dysfunctional protein (re)folding and higher basal oxidative stress levels in patients."
      explanation: >-
        The proteomic readout that grounds this link.
  evidence:
  - reference: PMID:33097556
    reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As SCAR16 primarily affects the central nervous system we next investigated the HSR in cortical neurons (CNs) derived from induced pluripotent stem cells of SCAR16 patients."
    explanation: >-
      Describes the model system and the reason it was chosen over fibroblasts.

discussions:
- discussion_id: scar16_heat_shock_response_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Failure of Chaperone-Coupled Protein Quality Control
  prompt: >-
    Is impaired heat shock response a mechanism of SCAR16 neuropathology, or an
    artefact of the fibroblast model in which it was first observed?
  rationale: >-
    CHIP couples HSP70/HSC70 to the proteasome, and CHIP-null mice have impaired
    heat stress tolerance, so an impaired heat shock response is the natural
    mechanistic prediction, and it was duly observed in SCAR16 patient
    fibroblasts. It did not survive the move to the disease-relevant cell type.
    Patient iPSC-derived cortical neurons were resistant to heat stress with high
    basal HSP70, showed no HSP70 protein increase after heat shock despite strong
    transcript induction, and behaved the same whether or not they carried STUB1
    variants - an isogenic CRISPR STUB1-null control line gave the same result.
    The authors state plainly that this questions the role of impaired HSR in
    SCAR16 neuropathology. This is precisely a model-fidelity question rather
    than a gap in evidence: the fibroblast evidence exists and is not disputed,
    but its translational validity to the neurons that actually degenerate is
    what is in doubt. It matters because impaired HSR is otherwise an obvious
    target for a proteostasis-directed therapy, and because the general
    proteostatic defect in the same neurons - dysfunctional refolding, raised
    oxidative stress - did replicate, so the negative result is specific to the
    heat shock arm rather than a failure of the model overall.
  evidence:
  - reference: PMID:33097556
    reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found impaired HSR induction and recovery compared to healthy controls."
    explanation: >-
      The fibroblast result that established the impaired heat shock response.
  - reference: PMID:33097556
    reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Our results question the role of impaired HSR in SCAR16 neuropathology"
    explanation: >-
      The authors' own conclusion after the neuronal experiments, which is what
      makes this a model-fidelity mismatch rather than an established mechanism.

- discussion_id: scar16_chip_thermostabilization_therapy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#CHIP Destabilization and Misfolding
  - treatments#Multidisciplinary Supportive Care
  prompt: >-
    Can pharmacological stabilisation of destabilized CHIP variants restore
    ligase activity in SCAR16, and does that translate into clinical benefit?
  rationale: >-
    Most SCAR16 variants act by destabilizing CHIP rather than by abolishing
    catalysis outright, and most mutant proteins regain activity when assayed
    below their melting temperature. That is an unusually direct therapeutic
    lead: it implies a chaperone-like small molecule that raises the thermal
    stability of the mutant protein could restore function, and the authors say
    as much. Nothing has tested it. No SCAR16-specific interventional trial has
    been reported, management remains entirely supportive, and it is not known
    whether the in vitro rescue holds in neurons, whether it would apply to the
    ligase-dead-but-stable T246M allele that the animal models carry, or whether
    restoring ligase activity after degeneration has begun changes anything.

    A second, independent lead has since gone further. In a rodent model of
    CHIP-related ataxia, inhibiting the CHIP substrate PDE9A with Bay 73-6691, or
    re-expressing CHIP virally, restored cGMP/cAMP balance and protected against
    Purkinje-neuron mitophagy dysfunction. That is an actual rescue in an animal
    model rather than a biochemical inference, and Bay 73-6691 is an existing
    tool compound. It has not been taken further: there is no reported trial, no
    published work on whether the rescue holds for alleles outside the modelled
    genotype, and no evidence about a therapeutic window relative to Purkinje
    cell loss.
  evidence:
  - reference: PMID:29317501
    reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "compounds that improve the thermostability of genetic CHIP variants may be beneficial for treating patients with SCAR16"
    explanation: >-
      The therapeutic hypothesis this gap is about, stated by the group that
      generated the stability data.
  - reference: PMID:29317501
    reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "most mutant proteins recovered activity when the assays were performed below the mutants' melting temperature"
    explanation: >-
      The experimental observation that makes stabilisation a plausible strategy.
  - reference: PMID:39806097
    reference_title: "E3 ubiquitin ligase CHIP facilitates cAMP and cGMP signalling cross-talk by polyubiquitinating PDE9A."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Notably, pharmacological inhibition of PDE9A via Bay 73-6691 or virus-mediated CHIP expression restored the balance of cGMP/cAMP signalling. These interventions protect against cerebellar neuropathologies, particularly Purkinje neuron mitophagy dysfunction."
    explanation: >-
      The in vivo rescue result behind the second therapeutic lead described in
      this gap.

- discussion_id: scar16_hypogonadism_penetrance_substrate
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Hypothalamic-Pituitary-Gonadal Axis Failure
  prompt: >-
    Why do only some patients with biallelic STUB1 variants develop
    hypogonadotropic hypogonadism, and through which cell population does loss of
    CHIP reach the gonadal axis?
  rationale: >-
    Hypogonadism is the feature that gave SCAR16 its Gordon Holmes identity, yet
    whole cohorts of biallelic patients have none. Neither the neuroendocrine
    substrate nor the modifier that decides presence or absence is known.
    Genotype does not obviously explain it, since the biochemical properties of
    CHIP variants have been mapped onto cognitive dysfunction and tendon reflexes
    but not onto the endocrine phenotype. Resolving this would settle how the
    gene-defined and syndrome-defined concepts relate, which is currently handled
    by keeping two overlapping entries.
  evidence:
  - reference: PMID:31619515
    reference_title: "Changes in protein function underlie the disease spectrum in patients with CHIP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "specific biochemical activities that associate selectively with either increased tendon reflex or cognitive dysfunction"
    explanation: >-
      The genotype-phenotype analysis that resolved two other features of the
      spectrum and did not resolve hypogonadism.
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cognitive impairment was present only in one and hypogonadism in none of them."
    explanation: >-
      Documents the cohort in which the feature was entirely absent, which is
      what the gap is about.

    - CARP-dependent CHIP ubiquitination
    evidence:
    - reference: PMID:36853170
      reference_title: CARPs regulate STUB1 and its pathogenic mutants aggregation kinetics by mono-ubiquitination.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: pathogenic mutants of STUB1 are more prone than the wild-type to CARP2-mediated aggregate assembly.
      explanation: CARP2 modifies mutant CHIP and promotes aggregate assembly in experimental systems; human neuronal causation is untested.

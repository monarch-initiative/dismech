genetic:
- name: STUB1 biallelic pathogenic variants
  notes: >-
    SCAR16 requires two pathogenic STUB1 alleles, homozygous or compound
    heterozygous. Reported alleles span the tetratricopeptide-repeat,
    coiled-coil and U-box domains and include missense, nonsense and
    frameshift changes; the index allele is the U-box missense p.Thr246Met.
    Heterozygous STUB1 variants cause the allelic dominant disorder SCA48, and
    because dominant and recessive alleles produce similar biochemical
    defects, the disease status of SCAR16 heterozygotes is an open question.
  gene_term:
    preferred_term: STUB1
    term:
      id: hgnc:11427
      label: STUB1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:24312598
    reference_title: "Identification of CHIP as a novel causative gene for autosomal recessive cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using Sanger sequencing, we also identified two compound heterozygous mutations"
    explanation: >-
      Compound heterozygous STUB1 alleles in additional kindreds establish the
      biallelic requirement beyond the homozygous index family.
  - reference: PMID:28396517
    reference_title: "In vitro characterization of six STUB1 variants in spinocerebellar ataxia 16 reveals altered structural properties for the encoded CHIP proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "six previously reported pathogenic STUB1 variants (E28K, N65S, K145Q, M211I, S236T, and T246M) were expressed as recombinant proteins"
    explanation: >-
      Names the recurrent SCAR16 allele set that spans the three CHIP domains.
  - reference: PMID:34070858
    reference_title: "Genetic Dominant Variants in STUB1, Segregating in Families with SCA48, Display In Vitro Functional Impairments Indistinctive from Recessive Variants Associated with SCAR16."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These studies revealed that dominantly and recessively inherited STUB1 variants showed similar biochemical defects, including impaired ubiquitin ligase activity and altered oligomerization properties of the CHIP."
    explanation: >-
      Supports the statement that recessive and dominant alleles are not
      biochemically distinct classes, which is why heterozygote status is
      unresolved.

inheritance:
- name: Autosomal recessive inheritance
  description: >-
    SCAR16 segregates as an autosomal recessive trait, established by linkage
    plus exome sequencing in a consanguineous kindred with a homozygous STUB1
    variant and confirmed by compound heterozygous families. Uniparental
    isodisomy of chromosome 16 is a reported non-classical route to
    homozygosity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24312598
    reference_title: "Identification of CHIP as a novel causative gene for autosomal recessive cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a two-generation autosomal recessive cerebellar ataxia family, we mapped a linkage to a minimal candidate region on chromosome 16p13.3"
    explanation: >-
      Linkage in an autosomal recessive pedigree localizing the disease to the
      STUB1 locus.
  - reference: PMID:24113144
    reference_title: "Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed exome sequencing in a family with two of three siblings afflicted with ataxia and hypogonadism and identified a homozygous mutation in STUB1"
    explanation: >-
      A homozygous variant segregating in affected siblings of unaffected
      parents is the recessive pattern.

prevalence:
- population: German ataxia and spastic paraplegia referral cohort
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Diagnostic yield within a referral population, not a population
    prevalence. Three of 167 degenerative ataxia subjects carried biallelic
    STUB1 variants; none of 133 spastic paraplegia subjects did. Recorded as
    UNKNOWN measure type because a diagnostic-yield fraction is neither a
    prevalence nor an incidence, and no population-level estimate for SCAR16
    exists in the literature reviewed.
  evidence:
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 3 ataxia patients (3/167 = 1.8%) with 4 novel missense mutations in STUB1"
    explanation: >-
      Source of the 1.8% diagnostic yield among degenerative ataxia referrals.
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "STUB1 is rare in subjects with predominant spastic paraplegia (0/133)"
    explanation: >-
      Records the zero yield in the spastic paraplegia arm of the same
      screening study.

- population: Taiwanese cerebellar ataxia families
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Diagnostic yield, not a population prevalence: two SCAR16 pedigrees among
    512 Taiwanese families screened for cerebellar ataxia.
  evidence:
  - reference: PMID:32367277
    reference_title: "Clinical and Genetic Characterization of Autosomal Recessive Spinocerebellar Ataxia Type 16 (SCAR16) in Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCAR16 seems to be an uncommon ataxic syndrome, accounting for 0.4% (2/512) of our cohort with cerebellar ataxia."
    explanation: >-
      Source of the 0.4% yield in the Taiwanese ataxia cohort.

- population: German and Belgian ataxia index cohorts
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Diagnostic yield in exome-screened ataxia index subjects, not a population
    prevalence.
  evidence:
  - reference: PMID:28193273
    reference_title: "STUB1/CHIP mutations cause Gordon Holmes syndrome as part of a widespread multisystemic neurodegeneration: evidence from four novel mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified four novel STUB1 mutations in three affected subjects from two index families (frequency 2/87 = 2.3%)."
    explanation: >-
      Source of the 2.3% yield among ataxia index subjects.

animal_models:
- name: Chip U-box truncation zebrafish
  species: Zebrafish
  genotype: stub1 U-box domain truncation mutant
  publication: PMID:34630034
  description: >-
    A zebrafish mutant truncating the functional U-box domain of Chip, with
    impaired ubiquitination of the Hsc70 substrate and of Chip itself.
  evidence:
  - reference: PMID:34630034
    reference_title: "Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Recombinant wild-type zebrafish Chip showed ubiquitin ligase activity highly comparable to human CHIP, while the mutant Chip protein showed impaired ubiquitination of the Hsc70 substrate and Chip itself."
    explanation: >-
      Establishes that the fish orthologue is functionally comparable to human
      CHIP and that the mutant reproduces the ligase defect, which is what
      makes the model informative for human STUB1 disease.
  modeled_mechanisms:
  - target: Purkinje Cell Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces Purkinje cell loss and dendritic disorganization downstream of
      U-box loss of function, in an animal whose stub1 expression is
      concentrated in the same cerebellar layers as in humans.
    limitations: >-
      The mutant showed no gross cerebellar atrophy, unlike SCAR16 patients, so
      the model captures the cellular lesion without reproducing the
      tissue-level endpoint. It is also a truncation engineered in the fish
      orthologue rather than a patient allele, and models only the U-box arm
      of the mechanism, not the tetratricopeptide-repeat chaperone-binding arm.
    readouts:
    - name: Purkinje cell body number and size
      target: Purkinje Cell Degeneration
      direction: DECREASED
      interpretation: Direct cellular correlate of the degeneration node.
      evidence:
      - reference: PMID:34630034
        reference_title: "Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "these fish displayed reduced numbers and sizes of Purkinje cell bodies and abnormal organization of Purkinje cell dendrites"
        explanation: Reports the Purkinje cell measurement behind this readout.
    - name: Brain 26S proteasome activity
      target: Purkinje Cell Degeneration
      direction: DECREASED
      interpretation: >-
        Proteasome readout linking the cellular pathology to the proteostasis
        mechanism upstream of it.
      evidence:
      - reference: PMID:34630034
        reference_title: "Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mutant fish also had decreased total 26S proteasome activity in the brain"
        explanation: Reports the proteasome activity measurement.
    evidence:
    - reference: PMID:34630034
      reference_title: "Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "truncation of the Chip U-box domain leads to impaired ubiquitin ligase activity and behavioral and anatomical changes in zebrafish, illustrating the potential of zebrafish to study STUB1-mediated diseases"
      explanation: >-
        The authors' own statement that the model is informative for
        STUB1-mediated disease.

- name: CHIP T246M knock-in mouse
  species: Mouse
  genotype: Stub1 T246M homozygous knock-in
  publication: PMID:30222779
  description: >-
    The index SCAR16 U-box variant engineered at the endogenous locus, giving a
    genotype-matched model rather than a null. The same study engineered the
    allele in rat as well; the rat line is not curated separately here because
    the cited work reports the two together and this entry does not have
    species-resolved phenotype data for it.
  evidence:
  - reference: PMID:30222779
    reference_title: "Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To establish preclinical models of SCAR16, we engineered T246M at the endogenous locus in both mice and rats."
    explanation: >-
      Establishes the models as purpose-built SCAR16 models carrying the
      patient allele at its native locus.
  modeled_mechanisms:
  - target: Loss of CHIP E3 Ubiquitin Ligase Activity
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Carries the actual patient allele at the endogenous locus, and the
      encoded protein has no ligase activity while retaining chaperone
      interactions, matching the biochemistry measured for the human variant.
    evidence:
    - reference: PMID:30222779
      reference_title: "Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To establish preclinical models of SCAR16, we engineered T246M at the endogenous locus in both mice and rats."
      explanation: >-
        States that the model was built to carry the SCAR16 allele at its
        native locus.
  - target: Progressive Cerebellar Ataxia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Homozygous animals show motor cerebellar dysfunction together with
      cognitive and learning deficits, matching the ataxia-plus-cognition
      profile of patients.
    limitations: >-
      The paper reports cerebellar motor dysfunction and learning deficits as
      behavioural phenotypes; it does not establish that the progressive
      cerebellar atrophy or the hypogonadism of human SCAR16 is reproduced, and
      the phenotype is explicitly distinct from the CHIP-null animal, so
      conclusions do not transfer between the two models.
    evidence:
    - reference: PMID:30222779
      reference_title: "Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Animals homozygous for T246M had both cognitive and motor cerebellar dysfunction distinct from those observed in the CHIP null animal model, as well as deficits in learning and memory, reflective of the cognitive deficits reported in SCAR16 patients."
      explanation: >-
        Reports the motor and cognitive phenotype and, in the same sentence,
        that it differs from the null model.

experimental_models:
- name: SCAR16 patient primary fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary skin fibroblasts from three SCAR16 patients, used to test whether a
    defective heat-shock response underlies the disease. Curated separately
    from the iPSC-derived neurons below because the two systems give opposite
    answers, which is the whole point of the study.
  publication: PMID:33097556
  evidence:
  - reference: PMID:33097556
    reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we investigated the heat shock response (HSR) in primary fibroblasts of three SCAR16 patients"
    explanation: >-
      Establishes that the model is built from SCAR16 patient material rather
      than from an unrelated CHIP-deficient line.
  modeled_mechanisms:
  - target: Failure of Chaperone-Assisted Protein Quality Control
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Patient fibroblasts show impaired heat-shock response induction and
      recovery, a cellular readout of disturbed proteostasis.
    limitations: >-
      Fibroblast is not the disease target tissue, and the same study's patient
      neurons do not reproduce this defect, so the fibroblast phenotype cannot
      be read as the neuropathological mechanism. Fidelity is LOW for that
      reason, not because the measurement is unreliable.
    readouts:
    - name: Heat shock response induction and recovery
      target: Failure of Chaperone-Assisted Protein Quality Control
      direction: DECREASED
      interpretation: Patient-cell readout of disturbed proteostasis.
      evidence:
      - reference: PMID:33097556
        reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We found impaired HSR induction and recovery compared to healthy controls."
        explanation: Reports the heat-shock response measurement in patient fibroblasts.

- name: SCAR16 patient iPSC-derived cortical neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Cortical neurons differentiated from SCAR16 patient iPSCs, benchmarked
    against an isogenic STUB1 knockout line generated by CRISPR/Cas9 from a
    healthy control. This is the disease-relevant cell type, and it does not
    reproduce the fibroblast heat-shock phenotype.
  publication: PMID:33097556
  evidence:
  - reference: PMID:33097556
    reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we next investigated the HSR in cortical neurons (CNs) derived from induced pluripotent stem cells of SCAR16 patients"
    explanation: >-
      Establishes the neuronal model as patient-derived and as the cell type
      the study treats as disease-relevant.
  modeled_mechanisms:
  - target: Failure of Chaperone-Assisted Protein Quality Control
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Patient cortical neurons show dysfunctional protein refolding and raised
      basal oxidative stress, supporting the proteostasis node, but not the
      heat-shock defect seen in the same patients' fibroblasts.
    limitations: >-
      The heat-shock readout does not discriminate in this model: patient
      neurons were resistant to heat stress with high basal HSP70, and an
      isogenic STUB1 knockout line behaved like the patient lines. The authors
      conclude the heat-shock arm may not be the neuropathological mechanism,
      so only the refolding and oxidative-stress readouts carry the link.
    readouts:
    - name: Protein refolding and basal oxidative stress by proteomics
      target: Failure of Chaperone-Assisted Protein Quality Control
      direction: ALTERED
      interpretation: >-
        Neuronal readout of the proteostasis defect, in the disease-relevant
        cell type.
      evidence:
      - reference: PMID:33097556
        reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Proteomic analysis of CNs showed dysfunctional protein (re)folding and higher basal oxidative stress levels in patients."
        explanation: Reports the proteomic measurement behind this readout.
    evidence:
    - reference: PMID:33097556
      reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "Our results question the role of impaired HSR in SCAR16 neuropathology and highlight the need for careful selection of proper cell types for modeling human diseases."
      explanation: >-
        Refutes the specific claim that this model is informative for SCAR16
        through the heat-shock response, which is why the link is
        PARTIALLY_RECAPITULATES and rests on the other readout.

treatments:
- name: Supportive and Symptomatic Care
  description: >-
    No disease-modifying or neuroprotective therapy exists for SCAR16, and no
    interventional trial specific to STUB1 disease was identified. Management
    is multidisciplinary symptomatic care directed at the ataxia, the
    dysarthria and dysphagia, the pyramidal features, and, where present, the
    endocrine and seizure phenotypes.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33200713
    reference_title: "C-terminus of Hsp70 Interacting Protein (CHIP) and Neurodegeneration: Lessons from the Bench and Bedside."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These diseases are all incurable at present, with no available treatments to modify the neurodegenerative process or provide neuroprotection."
    explanation: >-
      A CHIP-focused review's framing statement about the neurodegenerative
      diseases it covers, which include the inherited cerebellar ataxias. It
      supports the absence of disease-modifying therapy at the class level
      rather than reporting a SCAR16-specific treatment trial; no such trial
      was found.

- name: Physical Therapy and Gait Rehabilitation
  description: >-
    Balance and gait training to maintain mobility and reduce falls. Supportive
    management extrapolated from general progressive-ataxia care; no
    SCAR16-specific rehabilitation trial exists.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy

- name: Speech and Language Therapy
  description: >-
    Management of cerebellar dysarthria and, as the disease advances, of
    swallowing difficulty and aspiration risk.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_mechanisms:
  - target: Dysarthria
    description: >-
      Addresses the dysarthria and dysphagia arising from cerebellar
      degeneration; symptomatic, with no effect on the underlying degeneration.

- name: Occupational Therapy
  description: >-
    Adaptive strategies and equipment to preserve independence in daily
    activities as limb ataxia progresses.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy

- name: Sex Hormone Replacement Therapy
  description: >-
    For the subset with hypogonadotropic hypogonadism, endocrine replacement
    directed at the gonadal deficiency. It treats the endocrine phenotype only
    and does not modify the neurodegeneration.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: sex hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: testosterone
      term:
        id: CHEBI:17347
        label: testosterone
  target_mechanisms:
  - target: Hypothalamic-Pituitary Gonadotropin Deficiency
    description: >-
      Replaces the sex steroids that the deficient gonadotropin drive fails to
      elicit, without acting on the CHIP defect upstream.

- name: Trehalose (Preclinical CHIP-Stabilizing Candidate)
  description: >-
    Trehalose, an autophagy enhancer, raises CHIP and Hsp70 protein levels and
    reduces oxidative stress in SCAR16 patient fibroblasts. This is a
    cell-culture result in patient-derived fibroblasts only, proposed as a
    candidate rather than established therapy; there is no animal efficacy
    study and no clinical trial in SCAR16. It is recorded here because it is
    the one mechanism-directed therapeutic lead in the SCAR16 literature, not
    because it is available treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: trehalose
      term:
        id: CHEBI:27082
        label: trehalose
  target_mechanisms:
  - target: CHIP Destabilization and Aggregation
    description: >-
      Acts on the protein-abundance arm of the mechanism by raising CHIP and
      Hsp70 levels, rather than on the catalytic defect.
    evidence:
    - reference: PMID:33200713
      reference_title: "C-terminus of Hsp70 Interacting Protein (CHIP) and Neurodegeneration: Lessons from the Bench and Bedside."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Treatment of SCAR16 patient fibroblasts with trehalose was shown to increase CHIP and Hsp70 protein levels, increase autophagy"
      explanation: >-
        Directly reports the effect on CHIP protein levels in SCAR16 patient
        cells, which is the mechanism target this link asserts.
  evidence:
  - reference: PMID:33200713
    reference_title: "C-terminus of Hsp70 Interacting Protein (CHIP) and Neurodegeneration: Lessons from the Bench and Bedside."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "has been implicated as a potential STUB1-associated disease therapeutic requiring further investigation"
    explanation: >-
      The review's own assessment, not an experiment, which is why it is graded
      OTHER and why this entry is recorded as a preclinical candidate rather
      than available therapy.
  - reference: PMID:29317501
    reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our insights suggest that compounds that improve the thermostability of genetic CHIP variants may be beneficial for treating patients with SCAR16."
    explanation: >-
      States the rationale for stabilizing mutant CHIP as a therapeutic
      strategy, which is the class this candidate belongs to.

- name: Genetic Counseling
  description: >-
    Counseling for an autosomal recessive disorder, including a 25 percent
    recurrence risk for siblings of a proband and cascade testing. Counseling
    is complicated by the allelic dominant disorder SCA48 and by evidence that
    recessive and dominant STUB1 alleles are biochemically similar, so the
    status of heterozygous relatives cannot be assumed benign.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34070858
    reference_title: "Genetic Dominant Variants in STUB1, Segregating in Families with SCA48, Display In Vitro Functional Impairments Indistinctive from Recessive Variants Associated with SCAR16."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings expand the molecular understanding of SCA48 but also mean that assumptions concerning unaffected carriers of recessive STUB1 variants in SCAR16 families must be re-evaluated."
    explanation: >-
      Supports the counseling caveat that SCAR16 heterozygotes cannot be
      assumed unaffected.

diagnosis:
- name: Biallelic STUB1 sequencing with supportive MRI
  description: >-
    Diagnosis rests on finding two pathogenic STUB1 alleles in a patient with a
    compatible progressive ataxia and cerebellar atrophy on MRI. STUB1 is a
    conventional non-repeat gene, so it is missed by the repeat-expansion
    panels used first-line in ataxia and must be covered by a sequencing panel
    or exome test; phasing a compound heterozygote can require long-range PCR.
    Because many STUB1 missense alleles are variants of uncertain significance,
    functional demonstration of lost ubiquitin ligase activity is used to
    establish pathogenicity. Zygosity does not settle the diagnosis on its own:
    a single heterozygous allele indicates the dominant disorder SCA48, and one
    reported patient reached homozygosity through maternal uniparental
    isodisomy of chromosome 16 rather than through two carrier parents.
  evidence:
  - reference: PMID:41851873
    reference_title: "A novel STUB1 p.(Gln118*) nonsense variant in compound heterozygosity causes autosomal recessive spinocerebellar ataxia type 16 in a Chinese patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The whole-exome sequencing combined with long-range flanking polymerase chain reaction (PCR) were performed in a Chinese SCAR16 patient."
    explanation: >-
      The sequencing strategy used to reach a SCAR16 diagnosis, including the
      long-range PCR needed to phase the compound heterozygote.
  - reference: PMID:41851873
    reference_title: "A novel STUB1 p.(Gln118*) nonsense variant in compound heterozygosity causes autosomal recessive spinocerebellar ataxia type 16 in a Chinese patient."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we used quantitative real-time PCR and western blot analysis to investigate the function of variant in STUB1 in cultured cells"
    explanation: >-
      The functional work-up used to classify a novel STUB1 variant as
      pathogenic rather than uncertain.
  - reference: PMID:32367277
    reference_title: "Clinical and Genetic Characterization of Autosomal Recessive Spinocerebellar Ataxia Type 16 (SCAR16) in Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The brain MRIs showed a marked cerebellar atrophy of the patients."
    explanation: >-
      Cerebellar atrophy on MRI is the supportive imaging finding that
      accompanies the genetic diagnosis.
  - reference: PMID:32367277
    reference_title: "Clinical and Genetic Characterization of Autosomal Recessive Spinocerebellar Ataxia Type 16 (SCAR16) in Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCAR16 is an important but often neglected diagnosis of cerebellar ataxia of unknown cause, and the isolated cerebellar ataxia without involvement of other systems cannot be a basis to exclude the possibility of STUB1-related disease."
    explanation: >-
      Warns against the specific diagnostic error this entry's phenotype
      section also records: isolated ataxia, without cognitive, pyramidal or
      endocrine features, does not exclude SCAR16.

differential_diagnoses:
- name: Spinocerebellar ataxia 48
  description: >-
    The allelic autosomal dominant disorder, caused by heterozygous variants in
    the same gene, curated in this knowledge base as Spinocerebellar Ataxia 48.
  disease_term:
    preferred_term: Spinocerebellar ataxia 48
    term:
      id: MONDO:0032526
      label: spinocerebellar ataxia 48
  distinguishing_features:
  - >-
    Zygosity is the primary discriminator: one pathogenic STUB1 allele indicates
    SCA48, two indicate SCAR16.
  - >-
    SCA48 is adult-onset with a prominent cerebellar cognitive-affective and
    psychiatric syndrome, often with chorea, and shows dentate-nucleus T2
    hyperintensity on MRI; SCAR16 starts earlier, with spastic-ataxic features
    and, in a subset, hypogonadism.
  - >-
    The separation is not clean. One variant has been reported causing both
    forms, and the two entities are described as a continuum rather than as
    discrete diseases.
  evidence:
  - reference: PMID:33417001
    reference_title: "Expanding the clinical spectrum of STIP1 homology and U-box containing protein 1-associated ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also report the first pathogenic variation associated with both dominant and recessive forms of inheritance (SCAR16 and SCA48)."
    explanation: >-
      One allele producing both the recessive and the dominant disorder is why
      the differential cannot be settled on variant identity alone.
  - reference: PMID:32342324
    reference_title: "Spinocerebellar ataxia type 48: last but not least."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCA48 is an adult-onset syndrome characterized by ataxia and cognitive-psychiatric features, variably associated with chorea, parkinsonism, dystonia, and urinary symptoms."
    explanation: >-
      The SCA48 clinical description against which SCAR16 is distinguished.

- name: Gordon Holmes syndrome due to RNF216, OTUD4 or PNPLA6
  description: >-
    The other genetic causes of the ataxia-plus-hypogonadism syndrome, curated
    in this knowledge base as Cerebellar Ataxia-Hypogonadism Syndrome. A SCAR16
    patient who has hypogonadism is clinically indistinguishable from these
    without sequencing.
  disease_term:
    preferred_term: Cerebellar ataxia-hypogonadism syndrome
    term:
      id: MONDO:0008935
      label: cerebellar ataxia-hypogonadism syndrome
  distinguishing_features:
  - Only sequencing separates them reliably.
  - >-
    Across published Gordon Holmes cases, RNF216 accounts for the majority and
    STUB1 for a small minority.
  - >-
    Dementia, chorea and psychiatric disturbance cluster with RNF216, while
    seizures were seen only in the STUB1 cases, which also had the lowest
    median age at onset.
  evidence:
  - reference: PMID:42080998
    reference_title: "Clinical and Genetic Profile of Gordon-Holmes Syndrome: A Review of Published Cases : Original Article."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was total 29 reported cases of GHS with RNF216 variants, 9 cases with PNPLA6 variants, and 5 with STUB1 variant."
    explanation: >-
      Gives the relative contribution of each gene to published Gordon Holmes
      cases, which is what makes STUB1 the minority possibility in that
      presentation.
  - reference: PMID:42080998
    reference_title: "Clinical and Genetic Profile of Gordon-Holmes Syndrome: A Review of Published Cases : Original Article."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at onset was lower and duration of illness was longer in STUB1 variants."
    explanation: >-
      Source of the age-at-onset discriminator recorded in the distinguishing
      features.

datasets:
- accession: geo:GSE310700
  title: Transcriptomic analysis of STUB1 knockdown in HEK293 cells under normal and heat-shock conditions
  description: >-
    RNA-seq of HEK293 cells carrying shRNA against STUB1 versus non-targeting
    control, under basal conditions and after acute heat shock. This is a
    knockdown cell-line experiment, not SCAR16 patient material, and the
    submitters generated it for a study of the dominant allelic disorder
    SCA48. It is included because it is the only public transcriptomic dataset
    that directly interrogates STUB1 loss of function against the heat-shock
    response, which is the axis the HUMAN_MODEL_MISMATCH discussion in this
    entry turns on.
  data_type: BULK_RNA_SEQ
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: GEO:GSE310700
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "to investigate the role of the STUB1/CHIP co-chaperone/E3 ligase in the cellular heat-shock response and proteostasis"
    explanation: >-
      The repository's own summary states the dataset's purpose, which is what
      makes it relevant to the proteostasis node here.
  notes: >-
    Dataset relevance triage. `just discover-datasets` returned twelve
    candidates and eleven were rejected. The three scored DIRECT are mouse
    studies of TDP2 and SNX14, matched only on the words "autosomal recessive
    spinocerebellar ataxia" in their summaries; they are different recessive
    ataxias and are the Named Entity Confusion case the curation guide warns
    about. The GENE_ONLY hits are STUB1 in tumour immunology, prostate cancer
    and epithelial NF-kB signalling, none of which bear on cerebellar
    degeneration. No SCAR16 patient-derived omics dataset was found in GEO.

discussions:
- discussion_id: scar16_hypogonadism_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what cellular mechanism does loss of CHIP function produce
    hypogonadotropic hypogonadism, and why does it occur in only a subset of
    patients with biallelic STUB1 variants?
  attaches_to:
  - pathophysiology#Hypothalamic-Pituitary Gonadotropin Deficiency
  rationale: >-
    Hypogonadism is the feature that gave SCAR16 its Gordon Holmes label and it
    is reproduced by loss of CHIP function in mice, yet no study localizes the
    defect within the hypothalamic-pituitary-gonadal axis or identifies the
    CHIP client involved. It is also strikingly inconsistent between cohorts:
    absent in all three patients of an unbiased ataxia screening cohort, and
    present across the Gordon-Holmes-ascertained literature. Whether that
    reflects genotype, ascertainment, or an unrecognized modifier is unknown,
    and the node is consequently the least mechanistically specified in this
    entry.
  evidence:
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cognitive impairment was present only in one and hypogonadism in none of them."
    explanation: >-
      The cohort observation that makes the gap concrete: unbiased screening
      found no hypogonadism at all, against a literature in which it defines
      the syndrome.

- discussion_id: scar16_heat_shock_response_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is the impaired heat-shock response seen in SCAR16 patient fibroblasts
    relevant to the neurodegeneration, given that patient iPSC-derived cortical
    neurons do not show it?
  attaches_to:
  - pathophysiology#Failure of Chaperone-Assisted Protein Quality Control
  rationale: >-
    Evidence exists in a model system and its translational validity is the
    open question, which is the HUMAN_MODEL_MISMATCH case rather than a plain
    absence of evidence. Patient fibroblasts show impaired heat-shock response
    induction and recovery, but patient cortical neurons were resistant to heat
    stress with high basal HSP70, and an isogenic CRISPR STUB1 knockout neuron
    line behaved like the patient lines, so the neuronal readout does not
    separate mutant from null from control. The authors themselves question
    whether impaired heat-shock response has any role in SCAR16 neuropathology.
    Since the disease target tissue is neuronal, the fibroblast finding cannot
    stand as the disease mechanism, and the proteostasis node here rests on the
    ubiquitination and mitophagy evidence rather than on the heat-shock arm.
  evidence:
  - reference: PMID:33097556
    reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, STUB1(-/-) neurons generated by CRISPR/Cas9-mediated genome editing from an isogenic healthy control line showed a similar HSR to patients."
    explanation: >-
      The isogenic knockout behaving like the patient lines is what removes the
      neuronal heat-shock readout's ability to discriminate, and is the
      specific result the mismatch turns on.

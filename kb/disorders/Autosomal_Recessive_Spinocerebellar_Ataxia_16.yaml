inheritance:
- name: Autosomal recessive inheritance
  description: SCAR16 usually segregates as an autosomal recessive trait through homozygous or compound heterozygous pathogenic variants. A reported Gordon Holmes case had homozygous STUB1 c.612+11C>G in regions consistent with maternal uniparental isodisomy; the source classified that allele as a VUS, and the predicted splice effect remains unverified.

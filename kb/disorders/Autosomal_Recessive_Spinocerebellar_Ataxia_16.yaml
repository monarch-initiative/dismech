inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    SCAR16 segregates as an autosomal recessive trait. Affected individuals
    carry either a homozygous STUB1 variant, typically in a consanguineous or
    geographically isolated pedigree, or two variants in trans; unaffected
    parents are heterozygous carriers. One important caveat follows from the
    allelic dominant disorder SCA48: because heterozygous STUB1 variants can
    themselves cause late-onset disease with incomplete, age-dependent
    penetrance, the assumption that an obligate carrier in a SCAR16 pedigree is
    and will remain unaffected cannot be made without follow-up.
  evidence:
  - reference: PMID:24312598
    reference_title: "Identification of CHIP as a novel causative gene for autosomal recessive cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations co-segregated exactly with the disease in these families and were not observed in 500 control subjects with matched ancestry."
    explanation: >-
      Biallelic STUB1 genotypes cosegregating with disease across three
      independent kindreds, absent from 500 ancestry-matched controls, establish
      recessive inheritance.
  - reference: PMID:34070858
    reference_title: "Genetic Dominant Variants in STUB1, Segregating in Families with SCA48, Display In Vitro Functional Impairments Indistinctive from Recessive Variants Associated with SCAR16."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "assumptions concerning unaffected carriers of recessive STUB1 variants in SCAR16 families must be re-evaluated"
    explanation: >-
      Source of the carrier caveat recorded in the description; the authors draw
      it directly from the biochemical equivalence of dominant and recessive
      variants.

pathophysiology:
- name: Biallelic STUB1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  genetic_context:
    genes:
    - preferred_term: STUB1
      term:
        id: hgnc:11427
        label: STUB1
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Both homozygous and compound heterozygous genotypes cause SCAR16. The slot
      is single-valued, so COMPOUND_HETEROZYGOUS is recorded as the commoner of
      the two in the published families; the homozygous genotypes are named in
      the genetic section notes.
  description: >-
    The initiating lesion is a pair of pathogenic STUB1 alleles - homozygous or
    compound heterozygous - affecting the tetratricopeptide-repeat (TPR)
    chaperone-binding domain, the central coiled-coil dimerisation region, or
    the C-terminal U-box ligase domain. Most reported changes are missense, and
    the discovery pedigrees carried both a homozygous change and two compound
    heterozygous genotypes.
  downstream:
  - target: CHIP Destabilization and Misfolding
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29317501
      reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we systematically analyzed CHIP mutations that cause SCAR16 and found that most SCAR16 mutations destabilize CHIP"
      explanation: >-
        A systematic survey of the SCAR16 mutation set establishes that the
        variants act by destabilizing the protein, which is the step this edge
        asserts.
  - target: Reduced CHIP Protein Abundance
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30058754
      reference_title: "STUB1 polyadenylation signal variant AACAAA does not affect polyadenylation but decreases STUB1 translation causing SCAR16."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We propose that this change underlies the extremely low amounts of the encoded protein in patient leukocytes."
      explanation: >-
        A non-coding 3'UTR variant reaches the same end state by a route that
        bypasses protein misfolding entirely - low CHIP protein in patient
        cells - which is why reduced abundance is drawn as its own branch.
  evidence:
  - reference: PMID:28396517
    reference_title: "In vitro characterization of six STUB1 variants in spinocerebellar ataxia 16 reveals altered structural properties for the encoded CHIP proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Spinocerebellar ataxia, autosomal recessive 16 (SCAR16) is caused by biallelic mutations in the STIP1 homology and U-box containing protein 1 (STUB1) gene encoding the ubiquitin E3 ligase and dimeric co-chaperone C-terminus of Hsc70-interacting protein (CHIP)."
    explanation: >-
      States the biallelic genetic lesion and the dual co-chaperone/E3-ligase
      identity of the gene product that the rest of the chain depends on.
  - reference: PMID:24742043
    reference_title: "Phenotype and frequency of STUB1 mutations: next-generation screenings in Caucasian ataxia and spastic paraplegia cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 3 ataxia patients (3/167 = 1.8%) with 4 novel missense mutations in STUB1, including 3 mutations in its tetratricopeptide-repeat domain."
    explanation: >-
      Establishes that pathogenic variants are not confined to the ligase
      domain but also affect the TPR chaperone-binding domain.

- name: CHIP Destabilization and Misfolding
  biological_scale: MOLECULAR
  description: >-
    SCAR16 missense substitutions lower the thermodynamic stability of CHIP.
    The protein adopts a more flexible, partly disordered conformation with
    reduced alpha-helical content, and the U-box domain in particular becomes
    structurally disorganised. The defect is temperature-dependent rather than
    absolute: several mutant proteins regain activity when assayed below their
    melting temperature, which is the observation that makes pharmacological
    stabilisation a rational therapeutic idea.
  downstream:
  - target: CHIP Oligomerization and Aggregation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30222779
      reference_title: "Disrupted structure and aberrant function of CHIP mediates the loss of motor and cognitive function in preclinical models of SCAR16."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we demonstrated that T246M mutation results in structural disorganization and misfolding of the CHIP U-box domain, promoting oligomerization, and increased proteasome-dependent turnover"
      explanation: >-
        States the causal step directly: misfolding of the U-box domain is what
        promotes oligomerization.
  - target: Loss of CHIP Ubiquitin Ligase Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29317501
      reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This destabilization caused mutation-specific defects in CHIP activity, including increased formation of soluble oligomers, decreased interactions with chaperones, diminished substrate ubiquitination, and reduced steady-state levels in cells."
      explanation: >-
        Names destabilization as the cause and diminished substrate
        ubiquitination as its consequence, which is exactly this edge.
  molecular_functions:
  - preferred_term: misfolded protein binding
    term:
      id: GO:0051787
      label: misfolded protein binding
    modifier: DECREASED
  - preferred_term: Hsp70 protein binding
    term:
      id: GO:0030544
      label: Hsp70 protein binding
    modifier: DECREASED
  evidence:
  - reference: PMID:28396517
    reference_title: "In vitro characterization of six STUB1 variants in spinocerebellar ataxia 16 reveals altered structural properties for the encoded CHIP proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "some STUB1 mutations known to cause recessive SCAR16 have a profound impact on the protein structure, stability, and ability of CHIP to dimerize in vitro"
    explanation: >-
      Direct biophysical characterisation of six SCAR16 variants showing
      structural and stability defects in the encoded protein.
  - reference: PMID:29317501
    reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "most mutant proteins recovered activity when the assays were performed below the mutants' melting temperature"
    explanation: >-
      Establishes that the functional defect tracks thermal stability rather
      than being a fixed loss of catalytic capability.

- name: CHIP Oligomerization and Aggregation
  biological_scale: MOLECULAR
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  description: >-
    Destabilized CHIP self-associates into soluble oligomers and, for the most
    aggregation-prone variants such as T246M, into detergent-insoluble
    aggregates. This is an unusual instance of the proteostasis-collapse motif:
    the aggregating species is the quality-control ligase itself rather than a
    downstream client, so aggregation and loss of clearance capacity are the
    same event. Aggregate assembly is actively regulated - the ubiquitin ligase
    CARP2 mono-ubiquitinates CHIP through its TPR motif and drives it toward the
    insoluble pool, and pathogenic mutants are more susceptible to this than
    wild-type protein.
  downstream:
  - target: Loss of CHIP Ubiquitin Ligase Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29317501
      reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This destabilization caused mutation-specific defects in CHIP activity, including increased formation of soluble oligomers, decreased interactions with chaperones, diminished substrate ubiquitination, and reduced steady-state levels in cells."
      explanation: >-
        Places oligomer formation and diminished substrate ubiquitination in the
        same causal sequence within the SCAR16 mutation set.
  biological_processes:
  - preferred_term: Protein Folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: DECREASED
  evidence:
  - reference: PMID:28396517
    reference_title: "In vitro characterization of six STUB1 variants in spinocerebellar ataxia 16 reveals altered structural properties for the encoded CHIP proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "T246M demonstrates a strong tendency for aggregation, a more flexible protein structure"
    explanation: >-
      Documents aggregation propensity of the archetypal SCAR16 variant.
  - reference: PMID:36853170
    reference_title: "CARPs regulate STUB1 and its pathogenic mutants aggregation kinetics by mono-ubiquitination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, pathogenic mutants of STUB1 are more prone than the wild-type to CARP2-mediated aggregate assembly."
    explanation: >-
      Supports the regulated-aggregation claim and the greater susceptibility of
      SCAR16 mutants specifically.
  - reference: PMID:36853170
    reference_title: "CARPs regulate STUB1 and its pathogenic mutants aggregation kinetics by mono-ubiquitination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In spinocerebellar ataxia 16 (SCAR16), an autosomal recessive neurodegenerative disease, mutations in and aggregation of STUB1 are reported."
    explanation: >-
      States that aggregation of STUB1 itself, not only of its clients, is a
      reported feature of SCAR16.

- name: Reduced CHIP Protein Abundance
  biological_scale: MOLECULAR
  description: >-
    Independently of catalytic impairment, SCAR16 lowers the amount of CHIP in
    the cell. Destabilized missense mutants are cleared faster and sit at lower
    steady-state levels; a homozygous change in the STUB1 polyadenylation signal
    (AACAAA) reduces translation without affecting polyadenylation or mRNA
    stability, leaving patient leukocytes with very little protein. Reduced dose
    and impaired catalysis converge on the same downstream defect.
  downstream:
  - target: Loss of CHIP Ubiquitin Ligase Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29317501
      reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This destabilization caused mutation-specific defects in CHIP activity, including increased formation of soluble oligomers, decreased interactions with chaperones, diminished substrate ubiquitination, and reduced steady-state levels in cells."
      explanation: >-
        Places reduced steady-state CHIP levels and diminished substrate
        ubiquitination in the same consequence set, which is what this edge
        asserts.
  evidence:
  - reference: PMID:30058754
    reference_title: "STUB1 polyadenylation signal variant AACAAA does not affect polyadenylation but decreases STUB1 translation causing SCAR16."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present three siblings afflicted with a disease characterized by cerebellar ataxia, cerebellar atrophy, pyramidal tract damage with increased lower limb tendon reflexes, and onset of 31 to 57 years"
    explanation: >-
      Describes the SCAR16 family in whom the translation-reducing regulatory
      variant was found, tying reduced protein dose to the clinical disorder.
  - reference: PMID:29317501
    reference_title: "Most mutations that cause spinocerebellar ataxia autosomal recessive type 16 (SCAR16) destabilize the protein quality-control E3 ligase CHIP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This destabilization caused mutation-specific defects in CHIP activity, including increased formation of soluble oligomers, decreased interactions with chaperones, diminished substrate ubiquitination, and reduced steady-state levels in cells."
    explanation: >-
      Reduced steady-state levels in cells is one of the named consequences of
      destabilization, which is the coding-variant route to this node.
  - reference: PMID:25258038
    reference_title: "STUB1 mutations in autosomal recessive ataxias - evidence for mutation-specific clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we show that the levels of CHIP are strongly reduced in vivo in patients' fibroblasts compared to controls"
    explanation: >-
      Confirms low CHIP protein in cells taken from biallelic SCAR16 patients
      themselves, not only in heterologous expression systems.
  - reference: PMID:25258038
    reference_title: "STUB1 mutations in autosomal recessive ataxias - evidence for mutation-specific clinical heterogeneity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggest that STUB1 mutations might cause disease by impacting not only the E3 ligase function, but also its protein interaction properties and protein amount."
    explanation: >-
      States the authors' conclusion that protein amount is a disease mechanism
      in its own right alongside catalytic loss, which is what this node models.

- name: Loss of CHIP Ubiquitin Ligase Activity
  biological_scale: MOLECULAR
  description: >-
    The convergent molecular defect is failure of CHIP's U-box-dependent E3
    ubiquitin ligase activity. The archetypal T246M substitution abolishes
    ligase activity measured with recombinant protein and in cells. Loss of
    ligase activity is not the same as loss of the whole protein: T246M retains
    chaperone binding and chaperone-related functions, and the knock-in animal
    phenotype differs from the null, so SCAR16 is better read as a selective
    loss of the degradative arm than as CHIP absence.
  downstream:
  - target: Failure of Chaperone-Coupled Protein Quality Control
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24113144
      reference_title: "Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "CHIP plays a central role in regulating protein quality control, in part through its ability to function as an E3 ligase."
      explanation: >-
        States that the ligase activity lost in this disorder is the means by
        which CHIP performs protein quality control, which is this edge.
  - target: Failure of NMDA Receptor NR2A Subunit Turnover
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24312598
      reference_title: "Identification of CHIP as a novel causative gene for autosomal recessive cerebellar ataxia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Wild-type, but not disease-associated mutant CHIPs promoted the degradation of NR2A, which may underlie the pathogenesis of ataxia."
      explanation: >-
        Directly contrasts wild-type and SCAR16 mutant CHIP in an NR2A
        degradation assay, which is the step this edge asserts.
  - target: PDE9A Accumulation and cGMP-cAMP Imbalance
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39806097
      reference_title: "E3 ubiquitin ligase CHIP facilitates cAMP and cGMP signalling cross-talk by polyubiquitinating PDE9A."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "CHIP binds to PDE9A, facilitating its polyubiquitination and autophagic degradation. Conversely, dysfunctional CHIP disrupts this process, resulting in PDE9A accumulation, increased cGMP hydrolysis, and impaired PKG phosphorylation of CHIP at serine 19."
      explanation: >-
        Identifies PDE9A as a CHIP substrate and states that dysfunctional CHIP
        is what causes it to accumulate, which is this edge.

name: Sturge-Weber Syndrome
creation_date: "2026-07-18T00:00:00Z"
category: Genetic
description: >-
  Sturge-Weber syndrome (SWS) is a sporadic neurocutaneous disorder caused by a
  postzygotic (somatic mosaic) activating mutation in GNAQ - most often the
  p.Arg183Gln variant - arising in progenitor cells and producing constitutive
  Gq signaling. The mosaic distribution yields the classic triad: a facial
  capillary malformation (port-wine birthmark, typically in the ophthalmic
  trigeminal territory), a leptomeningeal capillary-venous malformation
  (leptomeningeal angioma) overlying the brain, and ocular involvement
  (glaucoma). The leptomeningeal malformation impairs cortical venous drainage,
  causing chronic hypoperfusion, progressive cortical injury with the
  characteristic gyriform ("tram-track") calcification and atrophy, and
  early-onset, often drug-resistant seizures, together with stroke-like
  episodes, hemiparesis, and variable cognitive impairment.
parents:
- Epilepsy
- Neurological Disease
synonyms:
- SWS
- Encephalotrigeminal angiomatosis

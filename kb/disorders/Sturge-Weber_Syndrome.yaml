discussions:
- discussion_id: sws-mutation-timing-phenotype-extent
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Somatic GNAQ Activating Mutation"
  prompt: >-
    The same GNAQ p.Arg183Gln mutation produces outcomes ranging from an isolated
    facial port-wine stain to full Sturge-Weber syndrome with leptomeningeal and
    ocular involvement, depending on when and where in fetal development the
    mutation arises. What developmental window and progenitor lineage must be hit
    to produce leptomeningeal involvement, and can this be used to predict which
    infants with a high-risk (V1) port-wine stain will develop brain disease?
  rationale: >-
    Prognostic counseling and the case for presymptomatic intervention both hinge
    on knowing which port-wine-stain infants carry occult leptomeningeal disease.
    The developmental-timing model is well supported conceptually but has not been
    resolved to a specific lineage/timing map, and mutant-allele fraction in
    accessible tissue does not straightforwardly predict CNS involvement.
  proposed_experiments:
  - experiment_id: sws-timing-lineage-tracing
    name: Lineage and timing map of GNAQ-mutant clones
    description: >-
      Use single-cell and spatial sequencing of skin, brain, and eye tissue from
      Sturge-Weber and isolated-port-wine-stain cases (plus inducible mosaic
      animal models) to map the developmental timing and progenitor lineage of
      GNAQ-mutant clones against the extent of malformation.
    readouts:
    - name: Mutant-allele fraction by tissue and cell type
      target: "pathophysiology#Somatic GNAQ Activating Mutation"
    - name: Clonal lineage and timing reconstruction
      target: "pathophysiology#Somatic GNAQ Activating Mutation"
    - name: Correlation of mutant clones with leptomeningeal involvement on imaging
      target: "pathophysiology#Leptomeningeal Capillary-Venous Malformation"
    would_support:
    - "pathophysiology#Leptomeningeal Capillary-Venous Malformation"
    - "pathophysiology#Somatic GNAQ Activating Mutation"
- discussion_id: sws-presymptomatic-treatment-neuro-outcome
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Neurological Deficits"
  prompt: >-
    Early seizure onset and drug-resistant seizures are associated with worse
    cognitive outcome in Sturge-Weber syndrome. Does presymptomatic treatment
    (antiseizure medication and/or low-dose aspirin started before the first
    seizure in high-risk infants) reduce seizure burden and protect neurological
    and cognitive outcome, or does it merely delay onset?
  rationale: >-
    Cohort data link early, poorly controlled seizures to more severe cognitive
    impairment, and seizures can further worsen cortical perfusion in a vicious
    cycle. If presymptomatic treatment interrupts that cycle, the risk/benefit
    balance of treating clinically silent infants shifts, but this has not been
    established in a controlled prospective study.
  evidence:
  - reference: PMID:22832777
    reference_title: "Sturge-Weber syndrome: clinical spectrum, disease course, and outcome of 30 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An early age at seizure onset and those with drug-resistant seizures had more severe degree of mental subnormality"
    explanation: >-
      Associates early-onset and drug-resistant seizures with worse cognitive
      outcome, motivating the presymptomatic-treatment question.
  proposed_experiments:
  - experiment_id: sws-presymptomatic-rct
    name: Presymptomatic treatment trial in high-risk infants
    description: >-
      Prospective controlled trial in infants with a high-risk V1 port-wine stain
      and imaging/EEG evidence of leptomeningeal involvement, randomizing to
      presymptomatic antiseizure medication and/or low-dose aspirin versus
      treatment at first seizure, with long-term neurodevelopmental follow-up.
    readouts:
    - name: Age at first seizure and seizure control
      target: "pathophysiology#Seizures"
    - name: Neurodevelopmental and cognitive scores
      target: "pathophysiology#Neurological Deficits"
    - name: Stroke-like episode frequency
      target: "pathophysiology#Neurological Deficits"
    decision_criterion: >-
      A significant improvement in cognitive outcome without prohibitive treatment
      harm would support presymptomatic treatment.
    would_support:
    - "pathophysiology#Neurological Deficits"
    - "pathophysiology#Seizures"
- discussion_id: sws-gnaq-targeted-therapy
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Constitutive Gq Signaling and Dysregulated Vascular Development"
  prompt: >-
    Sturge-Weber syndrome is driven by constitutive Gq signaling with downstream
    activation of pathways including MEK/ERK and mTOR. Can pharmacological
    inhibition of this signaling axis (e.g., MEK or mTOR inhibition) modify the
    vascular malformation or its neurological consequences, and at what
    developmental stage would such therapy need to act to be beneficial?
  rationale: >-
    Identification of the GNAQ driver makes the pathway a rational drug target,
    but the malformation is largely structural and established before diagnosis;
    it is unknown whether downstream inhibition can remodel existing lesions or
    only limit progression, and whether CNS delivery and mosaic target engagement
    are achievable.
  proposed_experiments:
  - experiment_id: sws-pathway-inhibition-model
    name: Pathway-inhibition test in GNAQ-mutant models
    description: >-
      Test MEK and mTOR pathway inhibitors in GNAQ p.Arg183Gln endothelial and
      mosaic animal models, and in patient-derived organoids, for effects on
      aberrant vascular phenotype and downstream signaling, with staged dosing to
      probe the developmental window of efficacy.
    readouts:
    - name: Vascular malformation phenotype and stability
      target: "pathophysiology#Leptomeningeal Capillary-Venous Malformation"
    - name: Downstream ERK and mTOR pathway activity
      target: "pathophysiology#Constitutive Gq Signaling and Dysregulated Vascular Development"
    - name: Endothelial proliferation and survival
      target: "pathophysiology#Constitutive Gq Signaling and Dysregulated Vascular Development"
    would_support:
    - "pathophysiology#Constitutive Gq Signaling and Dysregulated Vascular Development"

datasets:
- accession: geo:GSE199978
  title: A novel somatic mutation in GNAQ in Sturge-Weber Syndrome provides insight into disease pathogenesis
  description: Sturge-Weber syndrome (SWS) is a sporadic, congenital, neuro-cutaneous disorder characterized by a mosaic, capillary malformation. SWS and isolated capillary malformations are caused by a somatic activating mutation in GNAQ encoding the G protein subunit alpha-q protein. The missense mutation R183Q is the sole GNAQ mutation identified thus far in affected tissues of 90% of SWS patients. In this study, we sequenced skin biopsies of affected capillary malformations from 9 patients. We identified the R183Q mutation in nearly all samples, but one sample exhibited a Q209R mutation.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 15
  publication: PMID:35635655
  notes: Identified by GEO DataSets index search for Sturge-Weber Syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE287906
  title: Common and Distinct Circulating MicroRNAs Across Four Neurovascular Disorders
  description: 'Background: Familial cerebral cavernous malformations (FCCM), Sturge-Weber Syndrome (SWS), and hereditary hemorrhagic telangiectasia with brain arteriovenous malformations (HHT) are neurovascular disorders driven by genetic mutations. Cerebral microbleeds (CMBs) are primarily associated with the aging process with less known about genetic drivers. This study hypothesizes that common and distinct circulating microribonucleic acids (miRNAs) reflect shared and different pathobiology and can serve as potential diagnostic and mechanistic biomarkers.'
  organism:

genetic:
- name: GNAQ (somatic mosaic)
  gene_term:
    preferred_term: GNAQ
    term:
      id: hgnc:4390
      label: GNAQ
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  notes: >-
    SWS is caused by a postzygotic somatic activating mutation in GNAQ (most
    commonly p.Arg183Gln), not an inherited germline variant; it is
    non-hereditary and sporadic. A related GNAQ variant and GNA11 mutations
    underlie phenotypically related capillary malformation conditions.
  evidence:
  - reference: PMID:23656586
    reference_title: "Sturge-Weber syndrome and port-wine stains caused by somatic mutation in GNAQ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the precise clinical manifestations dependent on where and when in the developing fetus the somatic mutation occurs"
    explanation: >-
      The somatic-mosaic model holds that the extent of disease (isolated
      port-wine stain versus full Sturge-Weber syndrome) is set by where and when
      in fetal development the GNAQ mutation arises.
- name: GNA11 (somatic mosaic, minority)
  gene_term:
    preferred_term: GNA11
    term:
      id: hgnc:4379
      label: GNA11
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  notes: >-
    A minority of cases are caused by a postzygotic somatic activating variant
    in the GNAQ paralog GNA11 (typically p.R183C), which tends to produce a
    distinct, often more reticulated phenotype with generally milder CNS
    involvement.
  evidence:
  - reference: PMID:39654261
    reference_title: "Phenotypic Spectrum of GNA11 R183C Mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many vascular anomalies harbor postzygotic somatic variants in GNAQ and GNA11"
    explanation: >-
      Establishes GNA11 (alongside GNAQ) as a source of postzygotic somatic
      variants underlying these vascular anomalies.

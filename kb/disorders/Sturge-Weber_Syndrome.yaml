  notes: Identified by GEO DataSets index search for Sturge-Weber Syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE186998
  title: Endothelial GNAQ p.R183Q activates phospholipase-Cbeta3, increases angiopoietin-2 and drives formation of enlarged blood vessels
  description: 'Introduction: Capillary malformation (CM) occurs sporadically and is associated with Sturge-Weber syndrome (SWS). The somatic mosaic mutation in GNAQ (c.548GàA, p.R183Q) is enriched in endothelial cells (EC) in skin CM and SWS brain CM. Our goal was to investigate how the mutant G-protein a-q subunit (Gaq) alters EC signaling and disrupts capillary morphogenesis. Approach and results: We used lentiviral constructs to express p.R183Q or wild-type GNAQ in normal human endothelial colony forming cells (EC-R183Q and EC-WT respectively). EC-R183Q constitutively activated phospholipase-C β3 (PLCβ3), a downstream effector of Gαq. Activated PLCβ3 was also detected in human CM tissue sections.'
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 12

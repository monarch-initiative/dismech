pathophysiology:
- name: Somatic GNAQ Activating Mutation
  description: >-
    A postzygotic activating mutation in GNAQ (most often p.Arg183Gln) arises in
    a progenitor cell, producing a mosaic population of cells with constitutively
    active Gq alpha signaling. The timing and location of the mutation determine
    the distribution of the vascular malformations. This node captures the single
    concept of the initiating somatic mosaic lesion.
  role: trigger
  gene:
    preferred_term: GNAQ
    term:
      id: hgnc:4390
      label: GNAQ
  evidence:
  - reference: PMID:23656586
    reference_title: "Sturge-Weber syndrome and port-wine stains caused by somatic mutation in GNAQ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in samples of affected tissue from 88% of the participants"
    explanation: >-
      Whole-genome sequencing identified the somatic GNAQ p.Arg183Gln activating
      mutation in affected tissue from 88% (23 of 26) of Sturge-Weber patients,
      establishing it as the initiating somatic lesion.
  downstream:
  - target: Constitutive Gq Signaling and Dysregulated Vascular Development
    causal_link_type: DIRECT
    description: >-
      The activating variant drives constitutive Gq-alpha signaling in the mosaic
      cells.
- name: Constitutive Gq Signaling and Dysregulated Vascular Development
  description: >-
    GNAQ encodes the Gq alpha subunit; the activating variant causes constitutive
    downstream signaling that dysregulates vascular development and endothelial
    behavior. This node captures the single concept of the aberrant signaling
    state.
  role: mediator
  cell_types:
  - preferred_term: Endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  downstream:
  - target: PLC-beta3-PKC-NF-kB Signaling Activation
    causal_link_type: DIRECT
    description: >-
      Constitutively active Gq alpha drives PLC-beta3 signaling.
  - target: RAS-MAPK/ERK Pathway Activation
    causal_link_type: DIRECT
    description: >-
      Mutant Gq alpha modestly increases ERK/MAPK signaling.
  - target: PI3K-AKT-mTOR Pathway Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Downstream signaling engages the PI3K-AKT-mTOR axis.
- name: PLC-beta3-PKC-NF-kB Signaling Activation
  description: >-
    In endothelial cells, GNAQ R183Q establishes constitutively active
    phospholipase C-beta3 (PLC-beta3) signaling, engaging PKC, calcium/
    calcineurin, and NF-kB and producing a proangiogenic, proinflammatory
    state. This node captures the single concept of the PLC-beta3 signaling arm.
  role: mediator
  cell_types:
  - preferred_term: Endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell

      id: GO:0006096
      label: glycolytic process
    modifier: INCREASED
  evidence:
  - reference: PMID:37975900
    reference_title: >-
      Mitochondrial aminoacyl-tRNA synthetases trigger unique compensatory mechanisms in neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      AARS2 and EARS2 defect iNPCs exhibited reduced rates of basal mitochondrial respiration compared

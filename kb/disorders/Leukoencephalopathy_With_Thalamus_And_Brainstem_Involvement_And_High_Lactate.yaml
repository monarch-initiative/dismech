- name: Physical therapy and supportive therapies
  description: Physical and other supportive therapies for motor and speech delay.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:31520968
    reference_title: >-
      Broad spectrum of clinical presentation in EARS2 beyond typical "leukoencephalopathy with thalamus

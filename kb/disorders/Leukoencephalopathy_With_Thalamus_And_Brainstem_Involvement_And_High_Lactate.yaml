has_subtypes:
- name: Severe
  display_name: Severe LTBL
  description: >-
    Early (often neonatal or early-infantile) onset with delayed psychomotor development, hypotonia, seizures
    and persistently raised lactate, followed by clinical stagnation without recovery and progressive
    atrophy of the affected brain structures. Rapidly fatal neonatal cases with corpus callosum agenesis,
    lactic acidosis and liver involvement are reported at the far end of this group. No genotype-phenotype
    correlation separates the groups; the grouping is clinical and radiological.
  evidence:
  - reference: PMID:22492562
    reference_title: >-
      Leukoencephalopathy with thalamus and brainstem involvement and high lactate 'LTBL' caused by EARS2
      mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      those of the 'severe' group were characterized by clinical stagnation, brain atrophy on magnetic
      resonance imaging and persistent lactate increases
    explanation: The defining series names a severe group and its course.
  - reference: PMID:25854774
    reference_title: >-
      Expanding the Clinical and Magnetic Resonance Spectrum of Leukoencephalopathy with Thalamus and
      Brainstem Involvement and High Lactate (LTBL) in a Patient Harboring a Novel EARS2 Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The severe form is characterized by early-onset hypotonia, delayed psychomotor development, seizures,
      and persistent lactate elevation.
    explanation: Summary of the severe form.
  - reference: PMID:27571996
    reference_title: >-
      Lethal Neonatal LTBL Associated with Biallelic EARS2 Variants: Case Report and Review of the Reported
      Neuroradiological Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five died soon after the first clinical event (our patient, Talim et al. 2013; Taylor et al. 2014;
      Danhauser et al. 2016) and six patients had severe neurodevelopmental compromise
    explanation: >-
      Of 11 severe patients among 26 reported, five died soon after the first clinical event.
- name: Mild
  display_name: Mild LTBL
  description: >-
    Clinical manifestations usually after six months of age, with irritability and psychomotor regression,
    followed from the second year by partial recovery of milestones, striking MRI improvement and declining
    lactate. Intermediate presentations between the two groups are described, and a later systematic review
    proposes a three-tier severe, moderate and mild clustering based on initial presentation.
  evidence:
  - reference: PMID:22492562
    reference_title: >-
      Leukoencephalopathy with thalamus and brainstem involvement and high lactate 'LTBL' caused by EARS2
      mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients in the 'mild' group partially recovered and regained milestones in the following years
      with striking magnetic resonance imaging improvement and declining lactate levels
    explanation: The defining series names a mild group and its course.
  - reference: PMID:25854774
    reference_title: >-
      Expanding the Clinical and Magnetic Resonance Spectrum of Leukoencephalopathy with Thalamus and
      Brainstem Involvement and High Lactate (LTBL) in a Patient Harboring a Novel EARS2 Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the mild form, clinical manifestations usually occur after the age of 6 months, with irritability
      and psychomotor regression, but clinical and biochemical improvement takes place from the second
      year of life without further clinical deterioration
    explanation: Summary of the mild form.
  - reference: PMID:39173847
    reference_title: >-
      Phenotyping mitochondrial glutamyl-tRNA synthetase deficiency (EARS2): A case series and systematic
      literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose a novel strategy for clustering phenotypes into severe, moderate, or mild disease based
      on initial presentation, seemingly correlating with disease progression.
    explanation: >-
      A later systematic review proposes a three-tier clustering, including an intermediate group.

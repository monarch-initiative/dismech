- name: Glycolytic Shift With Increased Lactate Production
  biological_scale: CELLULAR
  role: effector
  description: >-
    With respiration impaired, cells rely more on glycolysis and produce more lactate. Patient fibroblasts
    and fibroblast-derived neuronal progenitors with EARS2 variants show reduced respiration with a glycolytic
    shift. Lactate is raised in blood, CSF and affected brain regions; in the mild group it falls over
    time, in the severe group it stays high.
  biological_processes:
  - preferred_term: lactate biosynthetic process
    term:
      id: GO:0019249
      label: lactate biosynthetic process
    modifier: INCREASED
  - preferred_term: glycolytic process

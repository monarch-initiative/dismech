genetic:
- name: EARS2
  gene_term: *id002
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    Variants are mostly missense, with start-loss, nonsense, splice and in-frame deletion alleles; severe
    null alleles tend to be combined with missense alleles. No genotype-phenotype correlation has been
    identified, and patients sharing a genotype can differ markedly. Fibroblast metabolomics separated
    variants from mild and severe patients in one study. Functionally damaging EARS2 variants have been
    found in a patient whose leukoencephalopathy with calcifications and cysts was explained by SNORD118,
    and in an adult with late-onset leukoencephalopathy whose causality the authors left open, so a functional
    defect in vitro does not by itself establish the diagnosis.
  evidence:
  - reference: PMID:22492562
    reference_title: >-
      Leukoencephalopathy with thalamus and brainstem involvement and high lactate 'LTBL' caused by EARS2
      mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In an isolated patient, we found two mutant alleles for EARS2, the gene encoding mitochondrial glutamyl-tRNA
      synthetase.
    explanation: Discovery of EARS2 as the causal gene.
  - reference: PMID:22492562
    reference_title: >-
      Leukoencephalopathy with thalamus and brainstem involvement and high lactate 'LTBL' caused by EARS2
      mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found mutations in the EARS2 gene in all.
    explanation: EARS2 variants in all 11 MRI-matched patients.
  - reference: PMID:39173847
    reference_title: >-
      Phenotyping mitochondrial glutamyl-tRNA synthetase deficiency (EARS2): A case series and systematic
      literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      There are no pathognomonic features specific to EARS2 deficiency, and no genotype-phenotype correlation
      has been identified.
    explanation: No genotype-phenotype correlation in a systematic review.
  - reference: PMID:33855712
    reference_title: >-
      Metabolic impact of pathogenic variants in the mitochondrial glutamyl-tRNA synthetase EARS2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Metabolomics identified a group of signature metabolites, mostly from the TCA cycle and amino acid
      metabolism, that discriminate between EARS2 variants causing relatively mild and severe COXPD12.
    explanation: Metabolic signatures distinguishing mild and severe alleles.
  - reference: PMID:28748214
    reference_title: >-
      Functionally pathogenic EARS2 variants in vitro may not manifest a phenotype in vivo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This patient illustrates that variants with demonstrated impact on protein function should not necessarily
      be considered clinically relevant.
    explanation: Functional EARS2 variants in a patient whose disease had another cause.
  - reference: PMID:32887222
    reference_title: >-
      Identification of a Novel Variant in EARS2 Associated with a Severe Clinical Phenotype Expands the
      Clinical Spectrum of LTBL.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The combination of severe changes, like nonsense with milder missense variants, is a common molecular
      mechanism in EARS2-associated diseases.
    explanation: Severe alleles are usually paired with milder missense alleles.

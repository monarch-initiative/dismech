inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic EARS2 variants, homozygous or compound heterozygous, with parental carrier status confirmed
    by segregation. Once the familial variants are known, prenatal or preimplantation diagnosis is available
    for future pregnancies. Expressivity varies, including between siblings and between unrelated patients
    with the same genotype.
  evidence:
  - reference: PMID:26619324
    reference_title: >-
      Absent Thalami Caused by a Homozygous EARS2 Mutation: Expanding Disease Spectrum of LTBL.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Leukoencephalopathy with thalamus and brainstem involvement and high lactate (LTBL) is caused by
      autosomal recessive EARS2 mutations.
    explanation: States the mode of inheritance.
  - reference: PMID:27571996
    reference_title: >-
      Lethal Neonatal LTBL Associated with Biallelic EARS2 Variants: Case Report and Review of the Reported
      Neuroradiological Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation analysis confirmed parental carrier status of the identified variants
    explanation: Parental carrier status consistent with recessive inheritance.
  - reference: PMID:27571996
    reference_title: >-
      Lethal Neonatal LTBL Associated with Biallelic EARS2 Variants: Case Report and Review of the Reported
      Neuroradiological Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The establishment of the molecular diagnosis is always important for accurate genetic counselling
      for families and should allow the option for prenatal diagnosis or pre-implantation diagnosis for
      future pregnancies.
    explanation: Genetic counselling and reproductive options once the variants are known.
  - reference: PMID:31520968
    reference_title: >-
      Broad spectrum of clinical presentation in EARS2 beyond typical "leukoencephalopathy with thalamus
      and brain stem involvement".
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, the presentations of these two patients are remarkably different despite the same genotype.
    explanation: Variable expressivity for an identical genotype.
  - reference: PMID:27206875
    reference_title: >-
      Leukoencephalopathy with thalamus and brainstem involvement and high lactate caused by novel mutations
      in the EARS2 gene in two siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients showed symptoms of mild-type disease, but there were clinical differences between
      the two siblings.
    explanation: Intrafamilial variability.

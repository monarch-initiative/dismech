progression:
- phase: Infantile onset and regression
  age_range: Neonatal period to 16 months
  notes: >-
    Onset is usually in the first year. In the mild group regression with irritability, hypotonia and
    spasticity occurs in the second half-year, with maximal MRI involvement between about 9 months and
    2 years.
  evidence:
  - reference: PMID:22312165
    reference_title: >-
      Novel infantile-onset leukoencephalopathy with high lactate level and slow improvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most striking abnormalities were seen between the ages of 9 months and 2 years and consisted
      of selective involvement of the deep cerebral white matter, thalamus, and brainstem, especially
      the midbrain.
    explanation: Timing of maximal MRI involvement.
  - reference: PMID:31839000
    reference_title: >-
      Mitochondrial aminoacyl-tRNA synthetase disorders: an emerging group of developmental disorders
      of myelination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      | Mean age at onset (age range) | 8 years (5 months–40 years) | 6 months (birth–16 months) | 25
      years (1.5–44 years) |
    explanation: Mean onset 6 months, range birth to 16 months, for LTBL (middle column).
- phase: Recovery or stagnation
  age_range: From the second year of life
  notes: >-
    In the mild group clinical improvement begins in the second year without a second regression; MRI
    lesions improve and lactate falls. In the severe group the course stagnates with atrophy. Late new
    or recurrent lesions are reported in individual patients.
  evidence:
  - reference: PMID:22312165
    reference_title: >-
      Novel infantile-onset leukoencephalopathy with high lactate level and slow improvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gradual clinical improvement starts in the second year of life. So far, no second episode of regression
      has occurred.
    explanation: Course of the mild group.
  - reference: PMID:31839000
    reference_title: >-
      Mitochondrial aminoacyl-tRNA synthetase disorders: an emerging group of developmental disorders
      of myelination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The LTBL disease course is biphasic, involving one “hit” in the neonatal or infantile period with
      either stability or recovery based on the degree of MRI brain insult.
    explanation: Biphasic course.
diagnosis:
- name: Brain MRI
  diagnosis_term:
    preferred_term: brain MRI
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    The MRI pattern is the hallmark and was the basis on which the disease was defined: symmetrical deep
    cerebral white matter involvement sparing the periventricular rim, with thalamic, brainstem and cerebellar
    white matter involvement. Imaging very early in infancy may underestimate white matter involvement,
    and patients without thalamic or brainstem involvement are reported, so a non-classic MRI does not
    exclude the diagnosis.
  evidence:
  - reference: PMID:25854774
    reference_title: >-
      Expanding the Clinical and Magnetic Resonance Spectrum of Leukoencephalopathy with Thalamus and
      Brainstem Involvement and High Lactate (LTBL) in a Patient Harboring a Novel EARS2 Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A distinctive brain MRI pattern is the hallmark of the disease.
    explanation: MRI pattern as the diagnostic hallmark.
  - reference: PMID:31520968
    reference_title: >-
      Broad spectrum of clinical presentation in EARS2 beyond typical "leukoencephalopathy with thalamus
      and brain stem involvement".
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EARS2 deficiency should be considered in any child with developmental delay, neuroregression, or
      unexplained hepatopathy when associated with high lactate, even in the absence of characteristic
      neuroimaging findings.
    explanation: A non-classic MRI does not exclude the diagnosis.
- name: Proton MR spectroscopy
  diagnosis_term:
    preferred_term: magnetic resonance spectroscopy
    term:
      id: NCIT:C16810
      label: Magnetic Resonance Spectroscopy
  description: >-
    Spectroscopy of the affected white matter shows a lactate peak, which falls as the disease improves
    in the mild group.
  evidence:
  - reference: PMID:22312165
    reference_title: >-
      Novel infantile-onset leukoencephalopathy with high lactate level and slow improvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Proton magnetic resonance spectroscopy at age 2 years showed elevated lactate levels in the affected
      white matter, which normalized on follow-up
    explanation: MRS lactate and its normalisation.
- name: Blood and CSF lactate
  description: >-
    Lactate in blood and CSF is raised during the regression phase; blood lactate quantification is a
    useful early test in an infant with low tone and poor growth.
  measurements:

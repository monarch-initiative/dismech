pathophysiology:
- name: Mitochondrial Glutamyl-tRNA Synthetase Deficiency
  biological_scale: MOLECULAR
  role: initiator
  description: >-
    Biallelic EARS2 variants reduce the function of the mitochondrial glutamyl-tRNA synthetase. EARS2
    is a non-discriminating enzyme that charges mt-tRNA(Glu) with glutamate and also mischarges mt-tRNA(Gln)
    with glutamate, the substrate later amidated to Gln-tRNA(Gln). In patient fibroblasts and muscle the
    steady-state EARS2 protein level is markedly reduced for start-loss and destabilising missense alleles.
    Not every allele acts through abundance: the homozygous p.Gly317Cys variant of a fatal neonatal case
    left EARS2 protein levels normal, and structural modelling places it near the tRNA-binding surface
    of the catalytic domain. Aminoacylation by patient alleles was not measured in the cited studies.
  genes:
  - &id002
    preferred_term: EARS2
    term:
      id: hgnc:29419
      label: EARS2
  molecular_functions:
  - preferred_term: glutamate-tRNA ligase activity
    term:
      id: GO:0004818
      label: glutamate-tRNA ligase activity
    modifier: DECREASED
  - preferred_term: glutamate-tRNA(Gln) ligase activity
    term:
      id: GO:0050561
      label: glutamate-tRNA(Gln) ligase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:33855712
    reference_title: >-
      Metabolic impact of pathogenic variants in the mitochondrial glutamyl-tRNA synthetase EARS2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Human EARS2 is a non-discriminating glutamyl-tRNA synthetase that not only aminoacylates tRNAGlu,
      but misaminoacylates tRNAGln with Glu.
    explanation: Establishes both catalytic activities of the enzyme that is lost.
  - reference: PMID:27571996
    reference_title: >-
      Lethal Neonatal LTBL Associated with Biallelic EARS2 Variants: Case Report and Review of the Reported
      Neuroradiological Features.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Steady-state levels of EARS2 were markedly decreased in both patient fibroblasts and muscle homogenate
      compared to controls, demonstrating a functional consequence of the EARS2 mutations.
    explanation: Reduced EARS2 protein in patient cells and tissue.
  - reference: PMID:26780086
    reference_title: >-
      EARS2 mutations cause fatal neonatal lactic acidosis, recurrent hypoglycemia and agenesis of corpus
      callosum.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Studies on patient-derived skin fibroblasts showed severely decreased EARS2 protein levels
    explanation: Reduced EARS2 protein in a second, neonatal-onset patient.
  - reference: PMID:33855712
    reference_title: >-
      Metabolic impact of pathogenic variants in the mitochondrial glutamyl-tRNA synthetase EARS2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: indicating that G317C does not affect EARS2 protein stability
    explanation: >-
      Not all pathogenic alleles reduce abundance; this one leaves protein levels normal.
  downstream:
  - target: Impaired Mitochondrial Glutamyl-tRNA Aminoacylation
    causal_link_type: DIRECT
    description: >-
      Structural modelling predicts that the reported missense substitutions impair catalysis by weakening
      substrate binding or destabilising the protein; no direct aminoacylation assay of patient alleles
      is reported in the cited studies.
    evidence:
    - reference: PMID:33855712
      reference_title: >-
        Metabolic impact of pathogenic variants in the mitochondrial glutamyl-tRNA synthetase EARS2.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      directness: INDIRECT
      snippet: >-
        Altogether, the localization of these amino acid substitutions suggest that all of them might
        impair catalytic function due to weakened substrate binding or destabilization of the protein
      explanation: Homology-model analysis linking the variants to impaired catalysis.
- name: Impaired Mitochondrial Glutamyl-tRNA Aminoacylation
  biological_scale: MOLECULAR
  role: effector
  description: >-
    Reduced charging of mt-tRNA(Glu), and of the Glu-tRNA(Gln) intermediate, with glutamate. This step
    is inferred from the enzyme's function and the reduced EARS2 protein; charging of mitochondrial tRNAs
    was not measured in patient cells in the cited studies.
  biological_processes:
  - preferred_term: mitochondrial glutamyl-tRNA aminoacylation
    term:
      id: GO:0070149
      label: mitochondrial glutamyl-tRNA aminoacylation
    modifier: DECREASED
  evidence:
  - reference: PMID:31839000
    reference_title: >-
      Mitochondrial aminoacyl-tRNA synthetase disorders: an emerging group of developmental disorders
      of myelination.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Specifically, AARS2 attaches alanine, EARS2 attaches glutamate, and DARS2 attaches aspartate.
    explanation: Places EARS2 in the glutamate-charging step of mitochondrial translation.
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31520968
      reference_title: >-
        Broad spectrum of clinical presentation in EARS2 beyond typical "leukoencephalopathy with thalamus
        and brain stem involvement".
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        EARS2 encodes mitochondrial glutamyl t-RNA synthetase responsible for attaching glutamate to its
        cognate mitochondrial t-RNA. Hence, EARS2 is critical for protein translation in mitochondria.
      explanation: States the dependence of mitochondrial translation on EARS2 charging.
- name: Impaired Mitochondrial Translation
  biological_scale: CELLULAR
  role: effector
  conforms_to: primary_oxphos_deficiency#Mitochondrial Translation Defect
  description: >-
    Reduced synthesis of the 13 mitochondrially encoded respiratory chain subunits. The defect is inferred
    from the biochemical signature rather than measured by translation assays in patient cells, and it
    can be compensated: in fibroblast-derived induced neuronal progenitors and neurons carrying biallelic
    EARS2 variants, no clear mitochondrial protein synthesis defect was detected.
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  evidence:
  - reference: PMID:22492562
    reference_title: >-
      Leukoencephalopathy with thalamus and brainstem involvement and high lactate 'LTBL' caused by EARS2
      mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      expanding the list of medically relevant defects of mitochondrial DNA translation
    explanation: The defining paper classifies LTBL as a defect of mtDNA translation.
  - reference: PMID:37975900
    reference_title: >-
      Mitochondrial aminoacyl-tRNA synthetases trigger unique compensatory mechanisms in neurons.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Also, no clear defect of mitochondrial protein synthesis was present in EARS2 and RARS2 mutant neurons,
      suggesting that the defect of mitochondrial translation in these models was prevented by compensatory
      mechanisms.
    explanation: >-
      In patient-derived neurons the translation defect was compensated and not detectable.
  downstream:
  - target: Combined Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33855712
      reference_title: >-
        Metabolic impact of pathogenic variants in the mitochondrial glutamyl-tRNA synthetase EARS2.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        Pathogenic variants in mitochondrial aminoacyl-tRNA synthetases can compromise ETC function, because
        charging tRNAs with their cognate amino acids is required to synthesize the 13 subunits of ETC
        complexes I, III, and IV and ATP synthase (complex V) encoded by the mitochondrial genome.
      explanation: Explains why a charging defect reaches the respiratory chain.
- name: Combined Respiratory Chain Complex Deficiency
  biological_scale: CELLULAR
  role: effector
  conforms_to: primary_oxphos_deficiency#OXPHOS Complex Deficiency
  description: >-
    Combined deficiency of the respiratory chain complexes that contain mitochondrially encoded subunits:
    complexes I and IV in the muscle of biopsied patients, with complex III also reported, alongside reduced
    complex I and IV subunit levels in muscle and reduced oxygen consumption in fibroblasts. The deficiency
    is tissue-variable: fibroblasts can be normal when muscle is clearly affected, and respiratory chain
    activities in muscle have been normal in some patients. Patient fibroblasts also showed raised reactive
    oxygen species production.


    Conformance note: this node instantiates the primary_oxphos_deficiency module's central OXPHOS Complex
    Deficiency node, as a combined deficiency of the complexes carrying mitochondrially encoded subunits.
    The upstream Impaired Mitochondrial Translation node conforms to the module's Mitochondrial
    Translation Defect trigger.
  biological_processes:

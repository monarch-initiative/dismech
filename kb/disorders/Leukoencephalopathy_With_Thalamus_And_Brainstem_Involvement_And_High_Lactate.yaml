- name: Muscle biopsy with respiratory chain enzyme analysis
  diagnosis_term:
    preferred_term: muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  description: >-
    Muscle can show COX-deficient and ragged-red fibres and a combined respiratory chain deficiency, but
    activities are normal in some patients, and fibroblasts may be normal when muscle is affected. Rapid
    genetic testing can make biopsy unnecessary.
  evidence:
  - reference: PMID:27571996
    reference_title: >-
      Lethal Neonatal LTBL Associated with Biallelic EARS2 Variants: Case Report and Review of the Reported
      Neuroradiological Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle histochemistry showed cytochrome c oxidase (COX)-deficient and ragged-red fibres, while muscle
      biochemical studies showed decreased activities of mitochondrial respiratory chain complexes I and
      IV.
    explanation: Muscle findings supporting a mitochondrial diagnosis.
  - reference: PMID:27875839
    reference_title: >-
      Severe Metabolic Acidosis and Hepatopathy due to Leukoencephalopathy with Thalamus and Brainstem
      Involvement and High Lactate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, this case demonstrates the utility of current genetic diagnostic testing, in lieu of
      more invasive procedures, in obtaining rapid answers in this very complicated group of disorders.
    explanation: Genetic testing can replace invasive procedures.
- name: Exome sequencing or mitochondrial gene panel
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    Molecular diagnosis is by detecting biallelic EARS2 variants, by exome sequencing or a nuclear mitochondrial
    gene panel; targeted EARS2 analysis is reasonable when the MRI pattern is typical. Segregation in
    parents confirms phase.
  evidence:
  - reference: PMID:27571996
    reference_title: >-
      Lethal Neonatal LTBL Associated with Biallelic EARS2 Variants: Case Report and Review of the Reported
      Neuroradiological Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For our patient, the application of WES was fundamental in reaching a definitive genetic diagnosis,
      but the functional studies were essential to validate the significance of the novel variant.
    explanation: Exome sequencing as the diagnostic route.
  - reference: PMID:27571996
    reference_title: >-
      Lethal Neonatal LTBL Associated with Biallelic EARS2 Variants: Case Report and Review of the Reported
      Neuroradiological Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Though the clinical and bio-histochemical characteristics are not specific, when combined with brain
      MR/MRS pattern there can be enough specificity to implement a targeted EARS2 gene analysis in similar
      cases.
    explanation: Targeted EARS2 testing guided by MRI/MRS.
treatments:
- name: Mitochondrial cofactor supplementation
  description: >-
    Riboflavin, thiamine and coenzyme Q10 are given as a standard mitochondrial regimen, typically in
    the acute phase. No controlled study of their effect in LTBL is reported in the cited literature,
    and the 2019 review notes that no long-term intervention has been developed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
    - preferred_term: thiamine
      term:
        id: CHEBI:18385
        label: thiamine(1+)
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
  evidence:
  - reference: PMID:31839000
    reference_title: >-
      Mitochondrial aminoacyl-tRNA synthetase disorders: an emerging group of developmental disorders
      of myelination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the acute resuscitation phase, a standard treatment regimen for mitochondrial disorders has been
      administered, including thiamine, riboflavin, and coenzyme Q 10, but no long-term interventions
      have been developed.
    explanation: Use of the regimen and absence of disease-modifying therapy.
  - reference: PMID:25854774
    reference_title: >-
      Expanding the Clinical and Magnetic Resonance Spectrum of Leukoencephalopathy with Thalamus and
      Brainstem Involvement and High Lactate (LTBL) in a Patient Harboring a Novel EARS2 Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was treated with riboflavin (10 mg/day), thiamine (100 mg/day), and CoQ10 (100 mg/day).
    explanation: >-
      Regimen used in one patient who later improved; improvement is not attributable to treatment in
      an uncontrolled report.
- name: Cognate amino acid (glutamate) supplementation
  description: >-
    Oral glutamate with a high-protein diet was given from birth to one antenatally diagnosed boy with
    EARS2 deficiency within an open series of patients with mitochondrial aminoacyl-tRNA synthetase deficiencies.
    After glutamate supplementation was stopped and his protein source was switched to a formula lacking
    L-glutamate, he developed progressive lactic acidosis and neurological regression. The rationale is
    that cognate amino acid deprivation reduced respiration in fibroblasts from patients with these deficiencies,
    including one EARS2 line. This is a single uncontrolled observation and is experimental.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: L-glutamic acid
      term:
        id: CHEBI:16015
        label: L-glutamic acid
  target_mechanisms:
  - target: Impaired Mitochondrial Glutamyl-tRNA Aminoacylation
    treatment_effect: RESTORES
    description: >-
      Proposed: supplying the cognate amino acid aims to prevent substrate-limited charging by the residual
      enzyme. Not shown in patient cells for EARS2 specifically.
    evidence:
    - reference: PMID:42863838
      reference_title: >-
        Tailored Amino Acid Treatment for Pediatric Patients With Mitochondrial Aminoacyl-tRNA Synthetase
        Deficiencies.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        Supplementation with cognate amino acids to prevent local amino acid depletion has shown promise
        in ARS1 deficiencies, but its potential in ARS2 deficiencies remains largely unexplored.
      explanation: >-
        States the rationale and that it is unproven in mitochondrial synthetase deficiencies.
  evidence:
  - reference: PMID:42863838
    reference_title: >-
      Tailored Amino Acid Treatment for Pediatric Patients With Mitochondrial Aminoacyl-tRNA Synthetase
      Deficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six hours after birth, he had his first seizure, after which anti‐epileptic medication, 40 mg/kg/day
      glutamate and a high protein diet (3 g/kg/day) were initiated.
    explanation: Glutamate supplementation in one EARS2 patient.
  - reference: PMID:42863838
    reference_title: >-
      Tailored Amino Acid Treatment for Pediatric Patients With Mitochondrial Aminoacyl-tRNA Synthetase
      Deficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After switching to Neocate LCP and discontinuing glutamate supplementation, the patient developed
      sinus tachycardia, cyclic vomiting, and progressive lactic acidosis within 3 months
    explanation: Deterioration after discontinuation in the same patient; uncontrolled.
  - reference: PMID:42863838
    reference_title: >-
      Tailored Amino Acid Treatment for Pediatric Patients With Mitochondrial Aminoacyl-tRNA Synthetase
      Deficiencies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All ARS2‐deficient patient fibroblast lines showed reduced basal and maximal respiration during
      cognate amino acid deprivation, which was not observed in healthy controls or patients with IARS1
      and LARS1 deficiency during amino acid depletion
    explanation: In vitro rationale; the deficient lines included one EARS2 line.
- name: Ketogenic diet
  description: >-
    A modified ketogenic diet was tried in a neonate with homozygous p.Gly317Cys and lactate rose further;
    the infant died on day 5. In another neonate, a ketogenic diet was started one week before death from
    enterocolitis and sepsis. There is no evidence of benefit.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: ketogenic diet
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:33855712
    reference_title: >-
      Metabolic impact of pathogenic variants in the mitochondrial glutamyl-tRNA synthetase EARS2.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A modified ketogenic diet was initiated on Day 3, but the lactate rose further, peaking at 57.6
      mmol/L.
    explanation: No lactate response in one neonate.
  - reference: PMID:42863838
    reference_title: >-
      Tailored Amino Acid Treatment for Pediatric Patients With Mitochondrial Aminoacyl-tRNA Synthetase
      Deficiencies.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A ketogenic diet was initiated, but 1 week later, she died due to enterocolitis and sepsis.
    explanation: Ketogenic diet in a second neonate who died; no effect can be inferred.
- name: Antiseizure medication
  description: >-
    Seizures are treated symptomatically; levetiracetam was used in one patient who became seizure free
    and stopped it after more than a year.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

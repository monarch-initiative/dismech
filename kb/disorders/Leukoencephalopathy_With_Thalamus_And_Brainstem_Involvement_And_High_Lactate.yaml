name: Leukoencephalopathy With Thalamus And Brainstem Involvement And High Lactate
creation_date: '2026-10-28T00:00:00Z'
category: Mendelian
description: >-
  Autosomal recessive mitochondrial leukoencephalopathy caused by biallelic variants in EARS2, which encodes
  the mitochondrial glutamyl-tRNA synthetase. The disease was defined by MRI pattern recognition: extensive
  symmetrical deep cerebral white matter abnormalities that spare a periventricular rim, symmetrical signal
  change in the thalami, midbrain, pons, medulla oblongata and cerebellar white matter, and raised lactate
  in body fluids and on proton MR spectroscopy. Onset is usually in infancy. The defining series separated
  a mild group, who regress in infancy and then partially recover with striking MRI improvement and falling
  lactate, from a severe group with clinical stagnation, brain atrophy and persistently raised lactate;
  neonatal-onset fatal cases with corpus callosum agenesis, lactic acidosis and liver involvement, and
  cases without the typical MRI pattern, have since been reported. Muscle and fibroblast studies show
  a combined respiratory chain deficiency of the complexes that contain mitochondrially encoded subunits,
  consistent with a defect of mitochondrial translation. Management is supportive.
parents:
- combined oxidative phosphorylation deficiency
- leukodystrophy
synonyms:
- LTBL
- COXPD12
- combined oxidative phosphorylation deficiency 12
- combined oxidative phosphorylation deficiency type 12
- EARS2 combined oxidative phosphorylation deficiency
- leukoencephalopathy-thalamus and brainstem anomalies-high lactate syndrome
- EARS2 deficiency

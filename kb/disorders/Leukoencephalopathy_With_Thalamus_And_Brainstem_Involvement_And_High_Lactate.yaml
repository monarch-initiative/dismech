experimental_models:
- name: EARS2 patient primary dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Skin fibroblasts from patients with biallelic EARS2 variants, used to measure EARS2 protein, respiration,
    reactive oxygen species and metabolomic profiles, and for rescue by wild-type EARS2. Fibroblasts often
    show milder or absent respiratory chain enzyme defects than muscle.
  modeled_mechanisms:
  - target: Mitochondrial Glutamyl-tRNA Synthetase Deficiency
    relationship: MEASURES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: Western blotting of patient fibroblasts measures the reduction of EARS2 protein.
    limitations: >-
      Fibroblasts are not an affected tissue, and abundance does not capture catalytic defects of stable
      alleles such as p.Gly317Cys.
    evidence:
    - reference: PMID:26780086
      reference_title: >-
        EARS2 mutations cause fatal neonatal lactic acidosis, recurrent hypoglycemia and agenesis of corpus
        callosum.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Studies on patient-derived skin fibroblasts showed severely decreased EARS2 protein levels
      explanation: Fibroblasts report the protein deficiency.
  - target: Combined Respiratory Chain Complex Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reduced oxygen consumption and raised reactive oxygen species in patient fibroblasts, with metabolic
      abnormalities rescued by wild-type EARS2.
    limitations: >-
      Respiratory chain enzyme activities and subunit levels can be normal in fibroblasts when muscle
      is clearly deficient, so the deficiency is under-represented in this cell type.
    readouts:
    - name: Oxygen consumption rate
      target: Combined Respiratory Chain Complex Deficiency
      direction: DECREASED
      interpretation: Reduced electron flow through the respiratory chain.
      evidence:
      - reference: PMID:32887222
        reference_title: >-
          Identification of a Novel Variant in EARS2 Associated with a Severe Clinical Phenotype Expands
          the Clinical Spectrum of LTBL.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          revealed decreases in both the OCR and the OCR/ECAR ratio in the patient's fibroblasts, indicating
          a reduced electron flow through the respiratory chain
        explanation: The respirometry measurement.
    evidence:
    - reference: PMID:33855712
      reference_title: >-
        Metabolic impact of pathogenic variants in the mitochondrial glutamyl-tRNA synthetase EARS2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Ectopic expression of WT EARS2 rescued many of the metabolic abnormalities detected in P3-041
        fibroblasts, including acylcarnitines, nucelotides, and TCA cycle metabolites
      explanation: Rescue ties the fibroblast metabolic phenotype to EARS2 loss.
    - reference: PMID:27571996
      reference_title: >-
        Lethal Neonatal LTBL Associated with Biallelic EARS2 Variants: Case Report and Review of the Reported
        Neuroradiological Features.
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: >-
        Patient fibroblasts showed no decrease in steady-state protein levels of respiratory chain complex
        subunits (Fig. 3a).
      explanation: Subunit levels normal in fibroblasts of a patient with clear muscle deficiency.
- name: EARS2 patient fibroblast-derived induced neuronal progenitors and neurons
  experimental_model_type: OTHER
  description: >-
    Induced neuronal progenitor cells directly converted from fibroblasts of a patient with biallelic
    EARS2 variants, and neurons differentiated from them, studied alongside AARS2 and RARS2 lines.
  modeled_mechanisms:
  - target: Glycolytic Shift With Increased Lactate Production
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      EARS2-mutant progenitors had reduced basal respiration and a more glycolytic profile.
    limitations: >-
      A single patient line in vitro; neuronal progenitors are not the cells of the white matter lesions.
    evidence:
    - reference: PMID:37975900
      reference_title: >-
        Mitochondrial aminoacyl-tRNA synthetases trigger unique compensatory mechanisms in neurons.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        AARS2 and EARS2 defect iNPCs exhibited reduced rates of basal mitochondrial respiration compared
        to controls and appeared to be more glycolytic, indicating increased lactate production.
      explanation: Glycolytic shift in the model.
  - target: Impaired Mitochondrial Translation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      No clear mitochondrial protein synthesis defect was detected in EARS2-mutant neurons.
    limitations: >-
      The authors attribute the negative result to compensatory mechanisms in the cells, so it does not
      show that translation is normal in patient brain.
    evidence:
    - reference: PMID:37975900
      reference_title: >-
        Mitochondrial aminoacyl-tRNA synthetases trigger unique compensatory mechanisms in neurons.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Also, no clear defect of mitochondrial protein synthesis was present in EARS2 and RARS2 mutant
        neurons, suggesting that the defect of mitochondrial translation in these models was prevented
        by compensatory mechanisms.
      explanation: Negative translation result in the model.
differential_diagnoses:
- name: >-
    Leukoencephalopathy with brainstem and spinal cord involvement and lactate elevation (LBSL)
  disease_term:
    preferred_term: LBSL
    term:
      id: MONDO:0012622
      label: >-
        leukoencephalopathy with brain stem and spinal cord involvement-high lactate syndrome
  description: >-
    The DARS2 mitochondrial aspartyl-tRNA synthetase leukoencephalopathy, also with white matter disease
    and raised lactate; distinguished by spinal cord involvement, absent thalamic involvement and a slower,
    gradual course.
  evidence:
  - reference: PMID:31839000
    reference_title: >-
      Mitochondrial aminoacyl-tRNA synthetase disorders: an emerging group of developmental disorders
      of myelination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Thalamus | 0 | 100 | Not reported
    explanation: >-
      Thalamic involvement in 0% of LBSL against 100% of LTBL patients in the review table.
  - reference: PMID:31839000
    reference_title: >-
      Mitochondrial aminoacyl-tRNA synthetase disorders: an emerging group of developmental disorders
      of myelination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      | Rate of disease progression | Slow, gradual > rapid decline | Biphasic with stability or improvement
      after early “hit” | Rapid decline within a few years |
    explanation: Contrasting courses of LBSL and LTBL.
- name: Kearns-Sayre syndrome
  disease_term:
    preferred_term: Kearns-Sayre syndrome
    term:
      id: MONDO:0010787
      label: Kearns-Sayre syndrome
  description: >-
    Shares white matter disease sparing a periventricular rim with basal ganglia, thalamic and brainstem
    involvement, but preferentially affects subcortical white matter and progresses over time; excluded
    by mtDNA analysis.
  evidence:
  - reference: PMID:22312165
    reference_title: >-
      Novel infantile-onset leukoencephalopathy with high lactate level and slow improvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Kearns-Sayre syndrome, however, preferentially affects subcortical instead of deep cerebral white
      matter and MRI abnormalities increase over time.
    explanation: MRI features distinguishing Kearns-Sayre syndrome.
- name: Leigh syndrome
  disease_term:
    preferred_term: Leigh syndrome
    term:
      id: MONDO:0009723
      label: Leigh syndrome
  description: >-
    Symmetrical grey matter and brainstem lesions with raised lactate in early infancy can suggest Leigh
    syndrome before the white matter involvement becomes evident.
  evidence:
  - reference: PMID:27571996
    reference_title: >-
      Lethal Neonatal LTBL Associated with Biallelic EARS2 Variants: Case Report and Review of the Reported
      Neuroradiological Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The bilateral and symmetrical lesions that predominantly affected grey matter structures and brainstem
      plus the elevated lactate observed at 2 months of age were suggestive of Leigh syndrome.
    explanation: Early imaging resembling Leigh syndrome.
- name: Leukoencephalopathy with calcifications and cysts
  disease_term:
    preferred_term: LCC
    term:
      id: MONDO:0013803
      label: leukoencephalopathy with calcifications and cysts
  description: >-
    A SNORD118 disorder in which functionally damaging EARS2 variants were found incidentally; the presence
    of EARS2 variants without the LTBL biochemical or imaging picture should prompt consideration of another
    cause.
  evidence:
  - reference: PMID:28748214
    reference_title: >-
      Functionally pathogenic EARS2 variants in vitro may not manifest a phenotype in vivo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report seemingly pathogenic EARS2 mutations in a single patient with LCC with no biochemical
      or neuroimaging presentations of LTBL.
    explanation: EARS2 variants in a patient with a different leukoencephalopathy.
notes: >-
  No GeneReviews chapter covers this disease. The 2012 Archives of Neurology series of seven patients
  (PMID:22312165) described the MRI pattern before the gene was known; the 2012 Brain paper that identified
  EARS2 matched its index patient against a previously selected MRI cohort, and its quotes are used here
  for the MRI and clinical picture with that caveat. Phenotype frequencies come from a 2019 review table
  of 21 patients and should be read with that denominator. The same table reports combined visual or auditory
  impairment in a minority of patients without separating the two, so no vision or hearing phenotype is
  bound.

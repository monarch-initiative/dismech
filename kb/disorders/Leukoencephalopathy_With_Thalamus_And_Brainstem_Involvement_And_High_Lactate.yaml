      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: reactive oxygen species metabolic process
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:25854774
    reference_title: >-
      Expanding the Clinical and Magnetic Resonance Spectrum of Leukoencephalopathy with Thalamus and

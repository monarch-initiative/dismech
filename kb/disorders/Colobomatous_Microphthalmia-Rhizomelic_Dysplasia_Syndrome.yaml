name: Colobomatous Microphthalmia-Rhizomelic Dysplasia Syndrome
synonyms:
- Oculo-skeletal syndrome with rhizomelic shortening, MAB21L2-related
- microphthalmia/coloboma and skeletal dysplasia syndrome
- MAB21L2-related oculo-skeletal syndrome
- MCOPS14
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  A recognizable syndrome combining severe structural eye malformation —
  anophthalmia, microphthalmia, or coloboma — with a skeletal dysplasia
  characterized by rhizomelic (proximal-segment) limb shortening and abnormal
  joint formation, and with intellectual disability. It is caused by
  heterozygous MAB21L2 variants; the recurrent de novo p.Arg51Cys substitution
  is the allele associated with the skeletal phenotype. MAB21L2 variants also
  cause isolated eye malformations without skeletal involvement, so this entry
  is scoped to the syndromic oculo-skeletal presentation rather than to the
  gene. Conditional deletion in the mouse limb bud delays endochondral
  ossification and reduces chondrocyte proliferation in the prospective humerus
  during a narrow window, which matches the proximal-segment distribution of the
  human phenotype.
disease_term:
  preferred_term: colobomatous microphthalmia-rhizomelic dysplasia syndrome
  term:
    id: MONDO:0014380
    label: colobomatous microphthalmia-rhizomelic dysplasia syndrome
parents:
- Skeletal Dysplasia
- Syndromic microphthalmia
notes: >-
  Scope, and why it is not merged with the MAC entry. dismech separately curates
  ``Microphthalmia_with_Coloboma``, which is explicitly scoped to the isolated,
  non-syndromic MAC spectrum and carries MAB21L2 as one of its subtypes. That
  entry and this one are different concepts sharing a gene: there, MAB21L2 is
  one of many genes converging on optic-fissure closure; here, the skeletal
  dysplasia is the point, and it is the reason the ISDS Nosology lists the
  entity at all. Neither entry should take the other's classification — in
  particular, the isolated MAC entry must not be given an ISDS group-15
  assignment on the strength of this row.

  Note also that the nosology places a *rhizomelic* entity in a group defined by
  *mesomelic* shortening. The group's own name accommodates this — "mesomelic
  and rhizo-mesomelic" — but a reader scanning for mesomelia will not expect it.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian multisystem developmental disorder; tagged on the genetics
      axis.
  isds_skeletal_category:
  - classification_value: mesomelic_and_rhizomesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 15 "Mesomelic and rhizo-mesomelic dysplasias", row
      NOS 15-0170, listed as "Oculo-skeletal syndrome with rhizomelic
      shortening, MAB21L2-related" (MIM 615877, AD). The row's own comment notes
      that OMIM calls it "Microphthalmia/Coloboma and skeletal dysplasia
      syndrome", that skeletal involvement is not present in all individuals,
      and that two brothers with biallelic variants had ocular but no skeletal
      involvement. The assignment is to this syndromic oculo-skeletal entity;
      the dismech ``Microphthalmia_with_Coloboma`` entry, scoped to isolated
      non-syndromic MAC, is deliberately left unassigned. The 2019 revision
      (Mortier et al., PMID:31633310) numbered the same group 17.

differential_diagnoses:
- name: Isolated microphthalmia with coloboma
  description: >-
    The non-syndromic MAC spectrum, curated separately in dismech and itself
    including MAB21L2-related cases. It shares the gene but not the skeletal
    dysplasia, and it is not assigned to the ISDS nosology.
- name: Matthew-Wood syndrome (STRA6-related)
  description: >-
    Another syndromic microphthalmia with extraocular malformations, but with
    pulmonary and diaphragmatic rather than rhizomelic skeletal involvement.
discussions:
- discussion_id: mab21l2_allele_specificity_of_skeletal_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does p.Arg51Cys produce a skeletal dysplasia when other MAB21L2 alleles,
    including biallelic ones, produce eye malformation alone?
  attaches_to:
  - pathophysiology#MAB21L2 p.Arg51Cys Substitution
  rationale: >-
    The nosology records biallelic MAB21L2 cases with ocular but no skeletal
    involvement, which is the opposite of what a simple dosage model predicts:
    two defective alleles giving less phenotype than one particular
    heterozygous substitution. That pattern points at a non-loss-of-function
    mechanism for the R51C allele specifically, but the available model is a
    conditional null, which cannot distinguish the two. A knockin of the human
    substitution, compared against the conditional null in the same limb driver,
    is the experiment.
- discussion_id: mab21l2_non_autonomous_limb_action
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the signal by which Mab21l2, expressed in distal limb-bud
    mesenchyme, controls proliferation in the proximal (stylopod) region?
  attaches_to:
  - pathophysiology#Reduced Chondrocyte Proliferation in the Proximal Limb Bud
  rationale: >-
    The expression domain and the affected structure do not coincide, and the
    authors conclude the gene acts non-autonomously. That is an unusual and
    informative arrangement — it means the phenotype is a signalling failure
    across the proximodistal axis rather than a cell-intrinsic defect — but the
    intermediary is unidentified, which is why the downstream edge in this entry
    stops at the proliferation node rather than naming a pathway.

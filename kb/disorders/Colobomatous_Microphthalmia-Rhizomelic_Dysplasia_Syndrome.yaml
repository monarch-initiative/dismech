pathophysiology:
- name: MAB21L2 p.Arg51Cys Substitution
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MAB21L2
    term:
      id: hgnc:6758
      label: MAB21L2
  genetic_context:
    gene:
      preferred_term: MAB21L2
      term:
        id: hgnc:6758
        label: MAB21L2
    allele_type: recurrent missense c.151C>T (p.Arg51Cys)
    zygosity: HETEROZYGOUS
    variant_origin: DE_NOVO
  description: >-
    A specific recurrent substitution, not a generic MAB21L2 loss. The same
    residue change recurs in unrelated individuals with the oculo-skeletal
    phenotype, while other MAB21L2 alleles produce eye malformation without
    skeletal involvement — an allele-specific association that argues the
    skeletal phenotype is not simply the severe end of a dosage series. The same
    substitution modelled in transgenic mice reproduces severe appendicular
    skeletal anomalies.
  evidence:
  - reference: PMID:26116559
    reference_title: "A Novel Oculo-Skeletal syndrome with intellectual disability caused by a particular MAB21L2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent exome studies showed that these characteristics are part of the
      phenotypic spectrum of MAB21L2 gene mutations which cause a range of
      structural eye malformations such as microphthalmia/anophthalmia and
      ocular coloboma.
    explanation: >-
      Places the syndromic presentation inside the MAB21L2 spectrum whose other
      end is isolated eye malformation.
  - reference: PMID:40054064
    reference_title: "Mab21l2 is required to promote cell proliferation in stylopods during early limb development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Human patients and transgenic mice with MAB21L2(R51C) mutation have severe
      skeletal anomalies in their appendicular skeleton.
    explanation: >-
      States that the same specific allele produces appendicular skeletal
      anomalies in both species, supporting the allele-specific claim.
  downstream:
  - target: Reduced Chondrocyte Proliferation in the Proximal Limb Bud
    causal_link_type: DIRECT
    description: >-
      Loss of MAB21L2 function in the early limb bud reduces proliferation in
      the prospective stylopod.
  - target: Disrupted Optic Cup and Fissure Morphogenesis
    causal_link_type: DIRECT
    description: >-
      The same allele acts on the eye, which is the organ MAB21L2 is best
      established to pattern.
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Intellectual disability is a defining component of this syndrome and is
      not a feature of isolated MAB21L2-related eye disease, so it belongs to
      this allele rather than to the gene generally. No neurodevelopmental
      mechanism has been described, and the limb-restricted mouse model cannot
      address it.
- name: Disrupted Optic Cup and Fissure Morphogenesis
  biological_scale: TISSUE
  genes:
  - preferred_term: MAB21L2
    term:
      id: hgnc:6758
      label: MAB21L2
  description: >-
    MAB21L2 is required for eye development, and its variants produce a graded
    range of structural eye malformation — coloboma where the optic fissure
    fails to close, microphthalmia where the optic cup is undergrown,
    anophthalmia at the severe end. This node records that the ocular and
    skeletal components of the syndrome are parallel consequences of the same
    allele rather than one causing the other. The cellular lesion in the eye has
    not been resolved to the same depth as the limb one.
  biological_processes:
  - preferred_term: eye morphogenesis
    modifier: DECREASED
    term:
      id: GO:0048592
      label: eye morphogenesis
  evidence:
  - reference: PMID:26116559
    reference_title: "A Novel Oculo-Skeletal syndrome with intellectual disability caused by a particular MAB21L2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MAB21L2 gene mutations which cause a range of structural eye malformations
      such as microphthalmia/anophthalmia and ocular coloboma
    explanation: >-
      Establishes the range of structural eye malformation MAB21L2 variants
      produce, which is what this node represents.
  downstream:
  - target: Anophthalmia
    causal_link_type: DIRECT
    description: >-
      The severe end of the optic-cup phenotype, and what the two delineating
      individuals had.
  - target: Microphthalmia and Coloboma
    causal_link_type: DIRECT
    description: >-
      The milder expressions of the same morphogenetic failure; coloboma
      specifically reflects failed optic fissure closure.
- name: Reduced Chondrocyte Proliferation in the Proximal Limb Bud
  biological_scale: CELLULAR
  description: >-
    Conditional deletion of Mab21l2 in the mouse limb bud malforms the
    stylopods. The defect is developmentally narrow and specific: reduced
    chondrocyte proliferation in the prospective humerus region at E10.5, a
    critical window confined to E9.5-10.5, a smaller cartilage template by
    E13.5, a three-day delay in endochondral ossification, and humerus
    shortening at birth. Mab21l2 is expressed in the distal mesenchyme during
    that window while the affected structure is proximal, so the authors conclude
    it acts non-autonomously — the gene is not where the damage is.
  cell_types:
  - preferred_term: limb bud chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: chondrocyte proliferation
    modifier: DECREASED
    term:
      id: GO:0035988
      label: chondrocyte proliferation
  - preferred_term: endochondral ossification
    modifier: DECREASED
    term:
      id: GO:0001958
      label: endochondral ossification
  evidence:
  - reference: PMID:40054064
    reference_title: "Mab21l2 is required to promote cell proliferation in stylopods during early limb development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Reduced proliferation was noted in the chondrocytes of this perspective
      humerus region in Prx1-cre; Mab21l2flox/flox mice at E10.5. This defect
      may contribute to a smaller cartilage template found at E13.5 and the
      subsequent humerus shortening at birth.
    explanation: >-
      Gives the measured proliferation defect and the chain from it to the
      shortened bone.
  - reference: PMID:40054064
    reference_title: "Mab21l2 is required to promote cell proliferation in stylopods during early limb development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Histological examination revealed a three-day delay of endochondral
      ossification in the Prx1-cre; Mab21l2flox/flox mice.
    explanation: >-
      Quantifies the ossification delay in the conditional knockout.
  - reference: PMID:40054064
    reference_title: "Mab21l2 is required to promote cell proliferation in stylopods during early limb development."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results imply that Mab21l2 is acting non-autonomously to control
      stylopods development.
    explanation: >-
      The non-autonomy conclusion, stated by the source as an implication rather
      than a demonstration.
  downstream:
  - target: Shortened Proximal Limb Cartilage Template
    causal_link_type: DIRECT
    description: >-
      Fewer proliferating chondrocytes yield a smaller proximal cartilage
      template.
- name: Shortened Proximal Limb Cartilage Template
  biological_scale: TISSUE
  description: >-
    A smaller cartilage template in the prospective humerus and femur, the
    structural antecedent of the clinical rhizomelia. The proximal distribution
    is the point of correspondence with the mouse, whose conditional knockout
    malforms the stylopod specifically.
  evidence:
  - reference: PMID:26116559
    reference_title: "A Novel Oculo-Skeletal syndrome with intellectual disability caused by a particular MAB21L2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographic anomalies include severe rhizomelic shortness of the limbs
      and abnormal joint formation.
    explanation: >-
      Gives the defining radiographic phenotype.
  downstream:
  - target: Rhizomelic Limb Shortening
    causal_link_type: DIRECT
    description: >-
      The undersized proximal template ossifies into a short humerus and femur,
      with abnormal joint formation at their ends.

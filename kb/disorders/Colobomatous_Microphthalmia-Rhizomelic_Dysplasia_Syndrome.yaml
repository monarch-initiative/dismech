diagnosis:
- name: Recognition of the Oculo-Skeletal Pattern
  description: >-
    Suspected when a severe structural eye malformation is accompanied by
    rhizomelic limb shortening and intellectual disability. The eye phenotype is
    what usually presents; the skeletal component is what distinguishes this
    syndrome from the far commoner isolated MAC spectrum, so limb radiographs in
    a child with anophthalmia or microphthalmia are the discriminating step.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:26116559
    reference_title: "A Novel Oculo-Skeletal syndrome with intellectual disability caused by a particular MAB21L2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a novel recognizable phenotype characterized by anophthalmia,
      a distinctive skeletal dysplasia and intellectual disability.
    explanation: >-
      Supports recognizability of the three-component pattern.
- name: Molecular Confirmation
  description: >-
    Confirmed by a heterozygous MAB21L2 variant, characteristically the
    recurrent p.Arg51Cys substitution. MAB21L2 is on standard MAC gene panels,
    so the gene is usually tested; the interpretive work is in recognizing that
    a particular allele carries the skeletal risk.
  diagnosis_term:

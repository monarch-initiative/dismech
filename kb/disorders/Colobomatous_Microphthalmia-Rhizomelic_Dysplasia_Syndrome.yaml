genetic:
- name: MAB21L2
  gene_term:
    preferred_term: MAB21L2
    term:
      id: hgnc:6758
      label: MAB21L2
  relationship_type: CAUSATIVE
  notes: >-
    A male abnormal 21 like 2 family member, required for eye and limb
    development. The oculo-skeletal presentation is associated specifically with
    the recurrent p.Arg51Cys substitution; other MAB21L2 alleles give eye
    malformation without a skeletal phenotype, and biallelic alleles have been
    reported with ocular involvement only. Reporting a MAB21L2 variant as causal
    for this syndrome therefore requires attention to which allele it is, not
    only to which gene.
  evidence:
  - reference: PMID:26116559
    reference_title: "A Novel Oculo-Skeletal syndrome with intellectual disability caused by a particular MAB21L2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two unrelated individuals described here in detail are heterozygous
      carriers of the same de novo missense mutation c.151C > T (p.Arg51Cys) in
      MAB21L2.
    explanation: >-
      Establishes the specific recurrent allele in two unrelated individuals.

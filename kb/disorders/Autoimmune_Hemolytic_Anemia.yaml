    reference_title: CD19 CAR T-Cell Therapy for Autoimmune Hemolytic Anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CD19 CAR T cells were administered to 11 patients - 5 in the compassionate-use program and 6 in the phase 1 study.
    explanation: >-

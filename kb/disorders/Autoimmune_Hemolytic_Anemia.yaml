- name: CD19 CAR T-cell therapy
  therapeutic_modality: CELL_THERAPY
  description: >-
    Investigational therapy for primary multirefractory AIHA. A 2026 report combined five compassionate-use and six phase I patients; all 11 achieved complete response, with median follow-up 12.2 months. Nine had grade 1-2 cytokine-release syndrome, one grade 1 neurotoxicity, seven had infections and one grade 3 hematotoxicity. Small size, mixed enrollment and lack of a control group limit efficacy and safety generalization.
  evidence:

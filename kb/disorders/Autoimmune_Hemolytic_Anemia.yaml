differential_diagnoses:
- name: Passenger lymphocyte syndrome
  description: >-
    Post-transplant alloimmune hemolysis can mimic AIHA.
  distinguishing_features:
  - >-
    Donor lymphocytes produce antibodies against recipient red-cell antigens absent from the donor. The transplant history and antibody specificity distinguish this alloimmune process.
  evidence:
  - reference: PMID:38673882
    reference_title: "Autoimmune Hemolytic Anemias: Classifications, Pathophysiology, Diagnoses and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is feasible for donor lymphocytes that have been transferred to produce antibodies that are specific to RBC antigens in the recipient’s body but not present on the donor’s own red cells
    explanation: >-
      This is a mechanistic boundary despite some review taxonomies listing PLS alongside AIHA.
- name: Drug-dependent immune hemolytic anemia
  description: >-
    A medication-dependent antibody reaction can cause immune hemolysis without a spontaneous red-cell autoantibody.
  distinguishing_features:
  - >-
    Review temporal drug exposure and perform reference-laboratory testing for drug dependence. Drug-independent autoantibodies induced by medication can instead resemble warm AIHA.
  evidence:
  - reference: PMID:39371250
    reference_title: "Autoimmune Hemolytic Anemias: Challenges in Diagnosis and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      drug-dependent antibodies that activate an immune response in the presence of the drug only
    explanation: >-
      Drug dependence distinguishes one drug-associated immune mechanism from autonomous autoantibody activity.
- name: Nonimmune inherited or acquired hemolysis
  description: >-
    Red-cell membrane defects, enzymopathies, hemoglobinopathies and mechanical hemolysis can produce anemia, jaundice and reticulocytosis.
  distinguishing_features:
  - >-
    Use personal and family history, blood-film findings and targeted membrane, enzyme or hemoglobin testing. Spherocytes alone do not establish autoimmune destruction.
  evidence:
  - reference: PMID:38673882
    reference_title: "Autoimmune Hemolytic Anemias: Classifications, Pathophysiology, Diagnoses and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital reasons for the anemia need to be ruled out, from enzymopathies
    explanation: >-
      The diagnostic workup must exclude nonimmune causes, especially when standard DAT is negative.
notes: >-
  AIHA is an acquired immune phenotype, not a single Mendelian disorder. Germline immune-dysregulation syndromes and somatic CAD clones can provide underlying context; common HLA/cytokine association signals are not treated as universal causal alleles. This umbrella entry preserves mechanistic subtype distinctions; the dedicated Cold Agglutinin Disease entry provides additional clonal detail. DAT-negative status is a diagnostic category rather than a separate effector mechanism. Passenger lymphocyte syndrome is modeled as an alloimmune differential. Reference reviews contain conflicting numerical and mechanistic statements; primary-study denominators and current trial registry records take precedence. The marrow study PMID:40854885 reverses dyserythropoiesis and fibrosis percentages in its abstract/discussion, so the results and Table 1 counts are used. The daratumumab erratum PMID:39671214 corrects Figure 1 time-axis units to weeks, not months. PMID:39708374 was identified as a later rituximab/bortezomib phase II report, but the current fetch retrieved no abstract/full text; no efficacy claim is inferred from its title.

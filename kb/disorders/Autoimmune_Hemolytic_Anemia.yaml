datasets:
- accession: geo:GSE301528
  title: 'Comprehensive evaluation of bone marrow microenvironment in patients with autoimmune hemolytic anemia: from trephine biopsy to single cell RNA sequencing.'
  description: Here we investigated bone marrow (BM) features in a large cohort of 97 patients with autoimmune hemolytic anemia (AIHA) and observed a high prevalence of hypercellularity, dyserythropoiesis, reticulin fibrosis, and T-cell infiltration (65%, 29%, 76%, and 69% of patients, respectively). These findings were associated with inadequate bone marrow compensation, more severe anemia at onset, and need of multiple treatments. In a subset of warm type AIHA patients we investigated BM microenvironment by single-cell RNA sequencing. We found distinct immune cell profiles across disease stages (diagnosis, remission, relapse).
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: SINGLE_CELL_RNA_SEQ
  sample_count: 18
  publication: PMID:40854885
  notes: Identified by GEO DataSets index search for Autoimmune Hemolytic Anemia (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE195791
  title: Transcriptional modifications between Treg from healthy donors (HD) and Treg from patients suffering from warm autoimmune hemolytic anemia (wAIHA)
  description: We assessed Next Generation RNA Sequencing of circulating Treg from PBMC of HD or wAIHA patients and our results showed that Treg have an activated profile with sustained transcriptional and translational activity, as well as strong engagement of the TCR and TNF-a signaling pathway during wAIHA.

  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Off-label proteasome inhibition targeting antibody-producing cells in refractory warm or cold AIHA. The primary CAD phase II report enrolled 21 patients, with 6/19 evaluable responders; two early discontinuations were excluded from that efficacy denominator. Warm-AIHA evidence also includes small combination series, which cannot isolate the bortezomib effect.

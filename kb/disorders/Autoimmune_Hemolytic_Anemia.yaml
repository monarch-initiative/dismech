name: Autoimmune Hemolytic Anemia
creation_date: '2025-12-19T01:12:52Z'
category: Autoimmune
parents:
- Autoimmune Disease
- Hematologic Disease
disease_term:
  preferred_term: Autoimmune Hemolytic Anemia
  term:
    id: MONDO:0020108
    label: autoimmune hemolytic anemia
description: >-
  An acquired immune hemolytic disorder in which autoantibodies shorten red-cell survival through Fc-receptor-mediated phagocytosis and/or complement activation. Warm AIHA, cold agglutinin disease or secondary cold agglutinin syndrome, mixed AIHA and paroxysmal cold hemoglobinuria differ in antibody properties, sites of destruction and treatment response. Disease severity also depends on marrow compensation. A positive direct antiglobulin test requires accompanying evidence of hemolysis; a negative standard test does not exclude AIHA. The disorder may be primary or associated with another disease.
pathophysiology:
- name: Anti-Erythrocyte Autoantibody Production
  biological_scale: CELLULAR
  description: >-
    Autoreactive B-lineage cells produce antibodies against red-cell antigens. Warm disease generally involves polyclonal responses; CAD has a characteristic clonal B-cell source. Persistent antibody production by CD20-negative plasma cells can contribute to resistance to B-cell depletion.
  evidence:
  - reference: PMID:40821796
    reference_title: "Beneath the surface in autoimmune hemolytic anemia: pathogenetic networks, therapeutic advancements and open questions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In warm AIHA, persistent autoantibody production is driven by autoreactive plasmablasts and plasma cells, with circulating plasmablasts indicating ongoing B-cell activation
    explanation: >-
      Review synthesis of the antibody-producing compartment; persistence mechanisms are not identical in all AIHA subtypes.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Warm IgG Coating of Erythrocytes
    causal_link_type: DIRECT
    description: >-
      Warm-reactive IgG recognizes red-cell antigens.
  - target: Cold Agglutinin Binding
    causal_link_type: DIRECT
    description: >-
      Cold-reactive antibodies bind and crosslink red cells within their thermal amplitude.
  - target: Biphasic Hemolysin Binding
    causal_link_type: DIRECT
    description: >-
      In PCH, a cold-reactive IgG binds the P/GLOB antigen.
- name: Clonal B-Cell Expansion in CAD
  biological_scale: CELLULAR
  description: >-
    A characteristic marrow B-cell clone supplies the pathogenic monoclonal cold agglutinin in primary CAD. This is distinct from overt lymphoma-associated secondary cold agglutinin syndrome and is not a universal feature of warm AIHA.
  evidence:
  - reference: PMID:38673882
    reference_title: "Autoimmune Hemolytic Anemias: Classifications, Pathophysiology, Diagnoses and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cold agglutinin disease (CAD) or primary CAD is a clonal disease whereby the lymphoproliferation of a B-cell clone produces a cold-reactive (≤30 °C) monoclonal IgM autoantibody
    explanation: >-
      Clonal source of the cold autoantibody, as synthesized in the clinical review.
  subtypes:
  - Cold agglutinin disease
  downstream:
  - target: Anti-Erythrocyte Autoantibody Production
    causal_link_type: DIRECT
    description: >-
      The CAD clone produces monoclonal cold-reactive immunoglobulin.
- name: Warm IgG Coating of Erythrocytes
  biological_scale: MOLECULAR
  description: >-
    Warm-reactive IgG coats erythrocytes at physiological temperature. Antigen specificity varies; band 3 and Rh-associated reactivity should not be treated as a single universal target.
  evidence:
  - reference: PMID:38673882
    reference_title: "Autoimmune Hemolytic Anemias: Classifications, Pathophysiology, Diagnoses and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      IgG antibodies have a strong attraction to red blood cells when the temperature is at the normal level of the human body (37 °C).
    explanation: >-
      Warm antibody binding establishes the opsonic signal for clearance.
  subtypes:
  - Warm AIHA
  - Mixed AIHA
  downstream:
  - target: Fc-Gamma-Receptor-Mediated Erythrophagocytosis
    causal_link_type: DIRECT
    description: >-
      Fc receptors recognize IgG coating on erythrocytes.
  - target: Classical Complement Activation
    causal_link_type: DIRECT
    description: >-
      Complement-fixing warm IgG can also activate C1; complement involvement is variable.
  - target: Antibody-Dependent Cellular Cytotoxicity
    causal_link_type: DIRECT
    description: >-
      IgG-coated red cells provide a potential substrate for Fc-receptor-bearing cytotoxic effector cells.
- name: Fc-Gamma-Receptor-Mediated Erythrophagocytosis
  locations:
  - preferred_term: spleen
    term:
      id: UBERON:0002106
      label: spleen
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction"
  biological_scale: CELLULAR
  description: >-
    Splenic red-pulp macrophages recognize and ingest IgG-opsonized erythrocytes. Isolated human red-pulp macrophages predominantly express FcγRIIa and FcγRIIIa; the primary study did not detect the inhibitory FcγRIIb found in some blood-derived macrophage preparations.
  evidence:
  - reference: PMID:29692344
    reference_title: Red pulp macrophages in the human spleen are a distinct cell population with a unique expression of Fc-γ receptors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Human red pulp macrophages predominantly expressed the low-affinity receptors FcγRIIa and FcγRIIIa. In contrast to blood monocyte-derived macrophages, red pulp macrophages did not express the inhibitory FcγRIIb.
    explanation: >-
      Flow-cytometric characterization of macrophages isolated from human spleens; it does not establish receptor expression in every AIHA patient.
  - reference: PMID:29692344
    reference_title: Red pulp macrophages in the human spleen are a distinct cell population with a unique expression of Fc-γ receptors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      phagocytosis of IgG-opsonized blood cells by red pulp macrophages was dependent on the same FcγRs as phagocytosis by blood monocyte-derived macrophages
    explanation: >-
      Functional study of isolated human macrophages supports the receptor-dependent clearance mechanism.
  subtypes:
  - Warm AIHA
  - Mixed AIHA
  cell_types:
  - preferred_term: splenic red pulp macrophage
    term:
      id: CL:0000874
      label: splenic red pulp macrophage
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: Fc-gamma receptor signaling pathway involved in phagocytosis
    term:
      id: GO:0038096
      label: Fc-gamma receptor signaling pathway involved in phagocytosis
  downstream:
  - target: Anemia
    causal_link_type: DIRECT
    description: >-
      Removal of erythrocytes shortens their circulating survival.
  - target: Partial Erythrocyte Membrane Removal
    causal_link_type: DIRECT
    description: >-
      Macrophages can remove part of an opsonized cell membrane rather than ingest the entire cell.
  - target: Jaundice
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Increased erythrocyte breakdown increases unconjugated bilirubin production.
  - target: Monocyte TNF Production in Hemolytic Conditions
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      IgG-coated erythrocytes stimulate TNF production in cultured monocytes; the systemic feedback contribution remains inferred.
- name: Partial Erythrocyte Membrane Removal
  biological_scale: CELLULAR
  description: >-
    Partial macrophage uptake removes erythrocyte membrane, reducing deformability and producing spherocytes that are more readily retained in the spleen.
  evidence:
  - reference: PMID:38673882
    reference_title: "Autoimmune Hemolytic Anemias: Classifications, Pathophysiology, Diagnoses and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In wAIHA, this leads to the degradation of the RBC membrane, causing transformation into spherocytes
    explanation: >-
      Clinical review describes membrane loss as the route to spherocyte formation.
  subtypes:
  - Warm AIHA
  downstream:
  - target: Spherocytosis
    causal_link_type: DIRECT
    description: >-
      Loss of membrane relative to cell volume produces the spherical morphology.
  - target: Splenomegaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Splenic sequestration of spherocytes and opsonized cells can contribute to enlargement.
- name: Cold Agglutinin Binding
  biological_scale: MOLECULAR
  description: >-
    Cold-reactive autoantibodies bind red-cell antigens within their thermal amplitude. Binding can initiate both complement activation and red-cell crosslinking; those consequences are modeled separately.
  evidence:
  - reference: PMID:40821796
    reference_title: "Beneath the surface in autoimmune hemolytic anemia: pathogenetic networks, therapeutic advancements and open questions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pentameric nature of IgM promotes red cell agglutination, causing RBC aggregates that impair microcirculation in acral regions
    explanation: >-
      Agglutination is a separate consequence from complement-mediated erythrocyte destruction.
  subtypes:
  - Cold agglutinin disease
  - Secondary cold agglutinin syndrome
  - Mixed AIHA
  downstream:
  - target: Classical Complement Activation
    causal_link_type: DIRECT
    description: >-
      Erythrocyte-bound IgM activates the classical pathway.
  - target: Erythrocyte Agglutination
    causal_link_type: DIRECT
    description: Multivalent antibody crosslinks erythrocytes.
- name: Erythrocyte Agglutination
  biological_scale: CELLULAR
  description: >-
    Multivalent cold agglutinins crosslink erythrocytes into aggregates that impair acral microcirculation. These symptoms can persist despite control of complement-mediated hemolysis.
  evidence:
  - reference: PMID:40821796
    reference_title: "Beneath the surface in autoimmune hemolytic anemia: pathogenetic networks, therapeutic advancements and open questions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pentameric nature of IgM promotes red cell agglutination, causing RBC aggregates that impair microcirculation in acral regions
    explanation: >-
      Agglutination is a separate consequence from complement-mediated erythrocyte destruction.
  subtypes:
  - Cold agglutinin disease
  - Secondary cold agglutinin syndrome
  - Mixed AIHA
  downstream:
  - target: Acrocyanosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Agglutinated erythrocytes impair acral circulation.
  - target: Raynaud phenomenon
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cold-associated red-cell aggregation contributes to circulatory symptoms.
- name: Biphasic Hemolysin Binding
  biological_scale: MOLECULAR
  description: >-
    The Donath-Landsteiner IgG binds red cells at lower temperatures and initiates complement fixation; warming permits terminal complement-mediated lysis.
  evidence:
  - reference: PMID:40821796
    reference_title: "Beneath the surface in autoimmune hemolytic anemia: pathogenetic networks, therapeutic advancements and open questions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the Donath-Landsteiner IgG binds to its antigen at low temperatures and fixes early complement components C1, C4, and C2
    explanation: >-
      PCH differs from the IgM mechanism of CAD/CAS.
  subtypes:
  - Paroxysmal cold hemoglobinuria
  downstream:
  - target: Classical Complement Activation
    causal_link_type: DIRECT
    description: >-
      Cold-bound IgG fixes early complement components, with further activation on warming.
- name: Classical Complement Activation
  biological_scale: MOLECULAR
  description: >-
    Erythrocyte-bound antibody activates the C1 complex and the classical complement cascade. C3 opsonization and terminal membrane injury are distinct downstream branches. Warm IgG1/IgG3 can activate complement, although this is less consistently prominent than in cold-antibody disease.
  evidence:
  - reference: PMID:40821796
    reference_title: "Beneath the surface in autoimmune hemolytic anemia: pathogenetic networks, therapeutic advancements and open questions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      IgG1 and IgG3 autoantibodies retain the capacity to activate the classical complement cascade through C1q binding
    explanation: >-
      Complement is not confined to IgM-mediated AIHA.
  - reference: PMID:30559259
    reference_title: "Inhibition of complement C1s improves severe hemolytic anemia in cold agglutinin disease: a first-in-human trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      immunoglobulin M antibodies bind to erythrocytes and fix complement, resulting in predominantly extravascular hemolysis.
    explanation: >-
      Clinical C1s-inhibition study establishes the complement-dependent CAD context.
  biological_processes:
  - preferred_term: complement activation, classical pathway
    term:
      id: GO:0006958
      label: complement activation, classical pathway
  downstream:
  - target: C3b Opsonization of Erythrocytes
    causal_link_type: DIRECT
    description: >-
      Classical-pathway C3 activation deposits opsonic fragments on red cells.
  - target: Terminal Complement-Mediated Erythrocyte Lysis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Progression through terminal complement forms the membrane attack complex; especially important in PCH and acute cold-antibody exacerbations.
- name: C3b Opsonization of Erythrocytes
  biological_scale: MOLECULAR
  description: >-
    C3b coating promotes complement-receptor-mediated erythrocyte clearance. Residual C3d detected by the DAT is a marker of complement sensitization, not the principal opsonin driving this clearance.
  evidence:
  - reference: PMID:40821796
    reference_title: "Beneath the surface in autoimmune hemolytic anemia: pathogenetic networks, therapeutic advancements and open questions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Opsonization of RBCs by C3b promotes their extravascular clearance, primarily mediated by hepatic macrophages
    explanation: >-
      Separates the functional C3b opsonin from C3d detected in diagnostic testing.
  downstream:
  - target: Hepatic Clearance of Complement-Opsonized Erythrocytes
    causal_link_type: DIRECT
    description: >-
      Complement receptors recognize erythrocyte-bound C3 fragments.
- name: Hepatic Clearance of Complement-Opsonized Erythrocytes
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction"
  biological_scale: CELLULAR
  description: >-
    Hepatic macrophages remove complement-coated erythrocytes. This extravascular pathway predominates in stable CAD, explaining why splenectomy is poorly effective.
  evidence:
  - reference: PMID:40821796
    reference_title: "Beneath the surface in autoimmune hemolytic anemia: pathogenetic networks, therapeutic advancements and open questions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Opsonization of RBCs by C3b promotes their extravascular clearance, primarily mediated by hepatic macrophages
    explanation: >-
      Clinical mechanistic synthesis of the major site of complement-opsonized clearance.
  cell_types:
  - preferred_term: Kupffer cell
    term:
      id: CL:0000091
      label: Kupffer cell
  downstream:
  - target: Anemia
    causal_link_type: DIRECT
    description: >-
      Accelerated erythrocyte removal lowers red-cell mass when marrow compensation is insufficient.
  - target: Jaundice
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Increased heme catabolism generates unconjugated bilirubin.
- name: Terminal Complement-Mediated Erythrocyte Lysis
  conforms_to: "complement_dysregulation#C5 Convertase Activation and Terminal Pathway Assembly"
  biological_scale: CELLULAR
  description: >-
    Membrane attack complex formation causes intravascular hemolysis. It is prominent in PCH and can increase during CAD exacerbations; it should not replace hepatic extravascular clearance as the predominant stable-CAD mechanism.
  evidence:
  - reference: PMID:40821796
    reference_title: "Beneath the surface in autoimmune hemolytic anemia: pathogenetic networks, therapeutic advancements and open questions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      terminal complement activation with membrane attack complex (MAC) C5b-C9 formation is generally absent during stable clinical phases and occurs predominantly during acute exacerbations or in severe disease
    explanation: >-
      The review qualifies the relative contribution of terminal complement in CAD.
  downstream:
  - target: Anemia
    causal_link_type: DIRECT
    description: >-
      Intravascular destruction reduces the circulating red-cell mass.
  - target: Hemoglobinuria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Released hemoglobin can exceed plasma binding and renal reabsorption capacity.
  - target: Monocyte TNF Production in Hemolytic Conditions
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Heme exposure stimulates cultured human monocytes; its contribution to sustained human autoimmunity is inferred.
  - target: Thromboembolism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Active intravascular hemolysis is associated with thrombosis; free hemoglobin, inflammatory and complement-coagulation interactions are candidate mediators, with additional patient-specific risk factors.
    evidence:
    - reference: PMID:35555857
      reference_title: Intravascular hemolysis and multitreatment predict thrombosis in patients with autoimmune hemolytic anemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thrombosis was observed in about 11% of AIHA patients, mainly grade 3, and associated with intravascular hemolysis, need of transfusions, multitreatment, and infections
      explanation: >-
        Observational association supports a clinically important connection; it does not prove any one proposed molecular mediator.
- name: Monocyte TNF Production in Hemolytic Conditions
  biological_scale: CELLULAR
  description: >-
    Heme and IgG-coated erythrocytes increase TNF production by cultured human monocytes. This offers a possible feedback link from hemolysis to immune dysregulation, but does not prove that TNF causes clinical AIHA.
  evidence:
  - reference: PMID:37534543
    reference_title: Regulatory T-cell dysfunctions are associated with increase in tumor necrosis factor α in autoimmune hemolytic anemia and participate in Th17 polarization.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro, we observed that in conditions mimicking wAIHA, monocytes were the main cells producing TNF-α.
    explanation: >-
      Human-cell experiments identify a potential inflammatory feedback source.
  subtypes:
  - Warm AIHA
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Regulatory T-Cell Suppressive Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Patient TNF-pathway engagement correlates with reduced FOXP3 protein and Treg frequency; a causal TNF-to-Treg effect was not directly isolated in AIHA.
- name: Regulatory T-Cell Suppressive Dysfunction
  biological_scale: CELLULAR
  description: >-
    Untreated warm-AIHA patients had fewer circulating regulatory T cells and reduced suppression of effector T-cell proliferation in coculture. FOXP3 protein was reduced despite increased transcripts. Proposed phosphorylation/deacetylation mechanisms were not directly demonstrated; onset versus persistence of autoimmunity cannot be distinguished.
  evidence:
  - reference: PMID:37534543
    reference_title: Regulatory T-cell dysfunctions are associated with increase in tumor necrosis factor α in autoimmune hemolytic anemia and participate in Th17 polarization.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the suppressive function of Treg was also altered in wAIHA, as shown by a decreased ability to inhibit Teff proliferation (51% vs. 73%; P=0.003
    explanation: >-
      Suppression was tested in nine patient and nine control cocultures, not all 22 enrolled patients.
  - reference: PMID:37534543
    reference_title: Regulatory T-cell dysfunctions are associated with increase in tumor necrosis factor α in autoimmune hemolytic anemia and participate in Th17 polarization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In humans, it is impossible to determine whether Treg dysfunction precedes the onset of the disease and promotes it, or whether this deficit merely sustains the disease.
    explanation: >-
      The investigators explicitly limit temporal and causal interpretation.
  subtypes:
  - Warm AIHA
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  downstream:
  - target: Anti-Erythrocyte Autoantibody Production
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired peripheral regulation may sustain autoreactive immunity; this link remains inferred in humans.
  - target: Th17-Associated Immune Polarization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Treg dysfunction accompanies a Th17-biased response; a causal conversion of Tregs into Th17 cells was not established.
- name: Th17-Associated Immune Polarization
  biological_scale: CELLULAR
  description: >-
    Warm-AIHA cohorts show increased IL-17 production and a higher Th17/Treg ratio. Serum IL-17 correlates with LDH and bilirubin, but not hemoglobin or reticulocyte count; this association does not establish that IL-17 directly destroys red cells.
  evidence:
  - reference: PMID:37534543
    reference_title: Regulatory T-cell dysfunctions are associated with increase in tumor necrosis factor α in autoimmune hemolytic anemia and participate in Th17 polarization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the serum concentration of IL-17 positively correlated with markers of RBC destruction, namely lactate dehydrogenase (LDH) and bilirubin
    explanation: >-
      Observational human serum association, distinct from the cell-culture cytokine assays.
  subtypes:
  - Warm AIHA
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: T-helper 17 cell
    term:
      id: CL:0000899
      label: T-helper 17 cell
  downstream:
  - target: Anti-Erythrocyte Autoantibody Production
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Th17-biased immune activity is proposed to support persistent autoreactivity; direct causal proof in patients is lacking.
- name: Inflammatory Bone Marrow Microenvironment
  biological_scale: TISSUE
  description: >-
    Biopsy-selected AIHA patients showed lymphoid infiltration and abnormal erythroid morphology. Single-cell analysis in nine warm-AIHA patients found relapse-associated inflammatory programs in T cells and monocytes. Treatment exposure, a small cohort and unrelated relapse samples limit causal inference; transcriptomic cytokine signatures are not direct measurements of secreted cytokine concentrations.
  evidence:
  - reference: PMID:40854885
    reference_title: "Bone marrow microenvironment in autoimmune hemolytic anemia: from trephine biopsy to single cell RNA sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      at relapse, an upregulation of inflammatory pathways (TNF-alpha signaling for all the three cell types and IFN pathways for monocytes only) was noted compared with diagnosis and remission
    explanation: >-
      Single-cell analysis of patient marrow T cells and monocytes; association rather than experimentally isolated cause.
  subtypes:
  - Warm AIHA
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Inadequate Erythropoietic Compensation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inflammation, erythroid abnormalities and inadequate endogenous erythropoietin may limit compensation. The marrow study did not directly demonstrate immune killing of erythroblasts.
- name: Inadequate Erythropoietic Compensation
  biological_scale: TISSUE
  description: >-
    Marrow output may fail to match accelerated erythrocyte loss. Reticulocytopenia is one presentation, but an elevated absolute reticulocyte count may still be inadequate for the severity of anemia. Inadequate endogenous erythropoietin and dyserythropoiesis are associated findings rather than universal causes.
  evidence:
  - reference: PMID:40854885
    reference_title: "Bone marrow microenvironment in autoimmune hemolytic anemia: from trephine biopsy to single cell RNA sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than half of patients (56%) displayed inadequate reticulocytosis as depicted by a BMRI < 121, and 75% of patients had inadequate endogenous erythropoietin levels.
    explanation: >-
      Findings from a selected marrow-evaluated referral cohort; the percentages are not population prevalence estimates.
  downstream:
  - target: Anemia
    causal_link_type: DIRECT
    description: >-
      Insufficient replacement amplifies anemia caused by peripheral destruction.
  - target: Reticulocytopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Some patients have a low absolute reticulocyte count, although inadequate compensation can occur without frank reticulocytopenia.
- name: Follicular Helper T-Cell Expansion
  biological_scale: CELLULAR
  description: >-
    An expanded follicular-helper compartment can support autoreactive B-cell activation. In rat-red-cell-immunized mice, Tfh expansion increased the Tfh:Tfr ratio; Tfr absolute numbers and suppressive function were not clearly reduced. Transfer accelerated autoantibody induction only in the setting of subsequent repeated immunization, rather than demonstrating spontaneous human AIHA.
  evidence:
  - reference: PMID:31875006
    reference_title: The Role of T Follicular Helper Cells and T Follicular Regulatory Cells in the Pathogenesis of Autoimmune Hemolytic Anemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The function of TFH cells in the responder group was not altered compared to the non-responder group, despite the increased number of TFH cells.
    explanation: >-
      The murine study supports expansion rather than greater per-cell helper activity. Human generalization remains provisional.
  - reference: PMID:31875006
    reference_title: The Role of T Follicular Helper Cells and T Follicular Regulatory Cells in the Pathogenesis of Autoimmune Hemolytic Anemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The day after transfer, the mice were immunized with rat RBCs weekly for consecutive 12 weeks.
    explanation: >-
      Adoptive transfer was followed by repeated antigen challenge; it was not sufficient alone to establish spontaneous disease.
  downstream:
  - target: Anti-Erythrocyte Autoantibody Production
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Tfh help supports germinal-center B-cell activation and antibody production; transfer and coculture experiments support this connection in the murine model.
  cell_types:
  - preferred_term: T follicular helper cell
    term:
      id: CL:0002038
      label: T follicular helper cell
  notes: >-
    The cached CD4 T-cell review (DOI:10.5633/amm.2024.0108) was cross-checked against the primary murine study. The ratio change is not modeled as proven Tfr depletion or a universal human initiating lesion.
  mechanism_confidence: PROVISIONAL
- name: Persistent Autoreactive Plasma Cells
  biological_scale: CELLULAR
  description: >-
    Autoreactive plasma cells can persist in the spleen despite corticosteroid treatment and rituximab-mediated B-cell depletion. In selected rituximab-refractory warm-AIHA splenectomy samples, these cells displayed a long-lived transcriptional program, providing a potential reservoir for continuing autoantibody production.
  evidence:
  - reference: PMID:26112660
    reference_title: Emergence of long-lived autoreactive plasma cells in the spleen of primary warm auto-immune hemolytic anemia patients treated with rituximab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In wAIHA patients treated by rituximab and who underwent splenectomy because of treatment failure, plasma cells were still present in the spleen, some of them being autoreactive.
    explanation: >-
      Selected refractory human tissue establishes persistence, not its frequency across all warm AIHA.
  - reference: PMID:26112660
    reference_title: Emergence of long-lived autoreactive plasma cells in the spleen of primary warm auto-immune hemolytic anemia patients treated with rituximab.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Long-term corticosteroid regimens markedly reduced this response while splenic plasma cells were able to persist, a fraction of them secreting anti-red blood cell IgG in vitro.
    explanation: >-
      Ex-vivo secretion supports the autoantibody-producing function of persistent plasma cells.
  downstream:
  - target: Anti-Erythrocyte Autoantibody Production
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Persistent autoreactive plasma cells continue to supply anti-red-cell antibodies.
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  subtypes:

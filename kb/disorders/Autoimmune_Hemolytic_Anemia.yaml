- accession: geo:GSE301528
  title: 'Comprehensive evaluation of bone marrow microenvironment in patients with autoimmune hemolytic anemia: from trephine biopsy to single cell RNA sequencing.'
  description: >-
    Bone marrow histology and clinical data from 97 selected AIHA patients, with single-cell RNA/TCR analysis in nine warm-AIHA patients across diagnosis, remission and relapse. Results and Table 1 report hypercellularity in 63/97, dyserythropoiesis in 74/97 and grade-1 reticulin fibrosis in 28/97; the abstract reverses the latter two percentages. The single-cell study used 12 patient specimens from nine individuals and three healthy donors, with treatment and cross-sectional relapse comparisons limiting causal interpretation. GEO sample_count denotes repository sample records rather than independent participants.

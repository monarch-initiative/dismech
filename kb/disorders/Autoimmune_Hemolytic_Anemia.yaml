    reference_title: CD19 CAR T-Cell Therapy for Autoimmune Hemolytic Anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had a complete response; the median time to a complete response was 45 days (range, 21 to 153).
    explanation: >-

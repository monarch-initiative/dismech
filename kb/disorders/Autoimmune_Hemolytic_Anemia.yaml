  title: Transcriptional modifications between Treg from healthy donors (HD) and Treg from patients suffering from warm autoimmune hemolytic anemia (wAIHA)
  description: >-
    RNA sequencing of sorted circulating regulatory T cells in untreated warm AIHA and healthy controls. The publication reports four patients and four matched controls in the main transcriptomic comparison; the GEO sample_count is the repository record count. TCR and TNF pathway engagement was associated with reduced Treg suppression and reduced FOXP3 protein despite increased FOXP3 transcript levels; causality and post-translational mechanisms remain incompletely established.

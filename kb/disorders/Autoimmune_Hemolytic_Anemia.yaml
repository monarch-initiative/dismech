has_subtypes:
- name: Warm AIHA
  description: >-
    Usually IgG-mediated hemolysis at body temperature, predominantly through splenic Fc-receptor-mediated clearance. Complement can contribute; IgA and warm IgM forms are uncommon.
  evidence:
  - reference: PMID:38673882
    reference_title: "Autoimmune Hemolytic Anemias: Classifications, Pathophysiology, Diagnoses and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary antibody isotype involved with wAIHA is IgG, but IgA and IgM may be infrequently seen
    explanation: >-
      The quote establishes IgG as the usual warm antibody and preserves uncommon IgA and IgM exceptions.
  subtype_term:
    preferred_term: autoimmune hemolytic anemia, warm type
    term:
      id: MONDO:0019532
      label: autoimmune hemolytic anemia, warm type
- name: Cold agglutinin disease
  description: >-
    Chronic clonal B-cell disease producing a pathogenic cold-reactive monoclonal antibody, usually IgM. Complement-mediated hepatic clearance and agglutination-related circulatory symptoms are distinct consequences. Also covered in the dedicated Cold Agglutinin Disease entry.
  evidence:
  - reference: PMID:39371250
    reference_title: "Autoimmune Hemolytic Anemias: Challenges in Diagnosis and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CAD is an established clonal B-cell lymphoproliferative disorder of the bone marrow (MYD88 L265P negative)
    explanation: >-
      The review identifies the marrow B-cell clone, supporting the distinction between primary CAD and a secondary cold agglutinin syndrome.
  subtype_term:
    preferred_term: cold agglutinin disease
    term:
      id: MONDO:0018922
      label: cold agglutinin disease
- name: Secondary cold agglutinin syndrome
  review_notes: >-
    OLS MONDO searches for secondary cold agglutinin syndrome and cold agglutinin
    found no term specific to the secondary syndrome. MONDO:0016450, autoimmune
    hemolytic anemia, cold type, also encompasses primary CAD and is too broad
    for this subtype distinction.
  description: >-
    Cold-antibody hemolysis associated with another condition, including infection or overt lymphoproliferative disease, rather than the characteristic primary CAD clone. Its course depends on the underlying disorder; not every secondary case is transient or polyclonal.
  evidence:
  - reference: PMID:39371250
    reference_title: "Autoimmune Hemolytic Anemias: Challenges in Diagnosis and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As for other AIHAs secondary forms (identified as cold agglutinin syndrome or secondary CAD) should be carefully investigated, as the association with infections, lymphoproliferative disorders and tumors is particularly frequent
    explanation: >-
      The named associated conditions support investigating an underlying cause; the quote does not establish uniform transience or polyclonality.
- name: Mixed AIHA
  subtype_term:
    preferred_term: mixed-type autoimmune hemolytic anemia
    term:
      id: MONDO:0019534
      label: mixed-type autoimmune hemolytic anemia
  description: >-
    Coexisting warm IgG and a clinically significant cold-reactive antibody. IgG plus C3d DAT positivity alone does not establish this subtype; cold-antibody thermal amplitude and titer must also be evaluated.
  evidence:
  - reference: PMID:39371250
    reference_title: "Autoimmune Hemolytic Anemias: Challenges in Diagnosis and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since DAT positivity for IgG and C3d may be observed even in wAIHA, the titer of the cold agglutinin and the presence of spontaneous agglutination at 20°C are useful tools.
    explanation: >-
      The quote explains why IgG/C3d DAT positivity alone is insufficient and why cold-antibody testing is needed for the mixed subtype.
- name: Paroxysmal cold hemoglobinuria
  description: >-
    Biphasic cold-reactive IgG, usually against the P/GLOB antigen, produces complement-mediated intravascular hemolysis on warming. The Donath-Landsteiner test establishes the serologic mechanism. Modern childhood cases are often transient after an infection.
  evidence:
  - reference: PMID:38673882
    reference_title: "Autoimmune Hemolytic Anemias: Classifications, Pathophysiology, Diagnoses and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PCH is characterized by the presence of a cold-reactive IgG autoantibody.
    explanation: >-
      Cold-reactive IgG distinguishes the Donath-Landsteiner/PCH antibody from the usual IgM cold agglutinin.
  subtype_term:
    preferred_term: paroxysmal cold hemoglobinuria
    term:
      id: MONDO:0019533
      label: paroxysmal cold hemoglobinuria
diagnosis:
- name: Demonstrate hemolysis and characterize red-cell sensitization
  description: >-
    Combine anemia/hemolysis markers with polyspecific and monospecific DAT testing. Determine IgG and complement reactivity and investigate secondary causes. A positive DAT without hemolysis is insufficient.
  evidence:
  - reference: PMID:39371250
    reference_title: "Autoimmune Hemolytic Anemias: Challenges in Diagnosis and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The DAT is neither 100% specific nor sensitive, and several technical issues should be considered for a proper interpretation.
    explanation: >-
      Test limitations require integrated clinical and laboratory interpretation.
  - reference: PMID:31839434
    reference_title: "Diagnosis and treatment of autoimmune hemolytic anemia in adults: Recommendations from the First International Consensus Meeting."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Monospecific direct antiglobulin test is considered mandatory in the diagnostic workup
    explanation: >-
      Consensus diagnostic recommendation; the cached landing page contains the abstract, not the full consensus paper.
- name: Cold-antibody titer and thermal-amplitude assessment
  description: >-
    Use cold-agglutinin studies to distinguish CAD/CAS from warm disease with complement involvement and mixed AIHA. IgG+C3d DAT positivity alone is not sufficient for mixed AIHA.
  evidence:
  - reference: PMID:39371250
    reference_title: "Autoimmune Hemolytic Anemias: Challenges in Diagnosis and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since DAT positivity for IgG and C3d may be observed even in wAIHA, the titer of the cold agglutinin and the presence of spontaneous agglutination at 20°C are useful tools.
    explanation: >-
      Additional serology is required for subtype assignment.
- name: Donath-Landsteiner testing
  description: >-
    Detect the biphasic hemolysin when PCH is suspected; C3d DAT positivity alone does not distinguish PCH from other cold-antibody forms.
  evidence:
  - reference: PMID:38673882
    reference_title: "Autoimmune Hemolytic Anemias: Classifications, Pathophysiology, Diagnoses and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis is made in the laboratory using the Donath–Landsteiner test (D–L test)
    explanation: >-
      PCH-specific serologic investigation.
- name: Extended evaluation of suspected DAT-negative AIHA
  description: >-
    Exclude nonimmune hemolysis and use a reference laboratory for more sensitive DAT methods, low-affinity antibody evaluation and IgA/IgM-specific reagents when indicated.
  evidence:
  - reference: PMID:38673882
    reference_title: "Autoimmune Hemolytic Anemias: Classifications, Pathophysiology, Diagnoses and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of DAT-neg AIHA mostly relies on the method of excluding other possible causes
    explanation: >-
      A diagnosis of exclusion supported by specialized immune testing, not simply a negative routine DAT.

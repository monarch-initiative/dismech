treatments:
- name: Corticosteroids
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    First-line treatment for warm AIHA, with tapering after response and substantial relapse and cumulative toxicity concerns. This role does not extend to primary CAD, where steroid responses are poor.
  evidence:
  - reference: PMID:39371250
    reference_title: "Autoimmune Hemolytic Anemias: Challenges in Diagnosis and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite a slow steroid tapering in 4–6 months, 1/3 of patients relapse and require a further therapy line.
    explanation: >-
      The review distinguishes initial warm-AIHA response from sustained steroid-free remission.
  treatment_term:
    preferred_term: Systemic Corticosteroid Therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  target_mechanisms:
  - target: Fc-Gamma-Receptor-Mediated Erythrophagocytosis
    treatment_effect: INHIBITS
    description: >-
      Reduces immune-mediated red-cell clearance in warm AIHA.
- name: Rituximab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Anti-CD20 B-cell depletion is a preferred second-line treatment for warm AIHA and may be introduced earlier in severe disease. It also targets the pathogenic B-cell clone in CAD, as monotherapy or combined with bendamustine in suitable patients; response magnitude and durability differ by subtype.
  evidence:
  - reference: PMID:39371250
    reference_title: "Autoimmune Hemolytic Anemias: Challenges in Diagnosis and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The anti-CD20 monoclonal antibody rituximab has become the preferred 2nd line being able to induce 70–80% of responses.
    explanation: >-
      The response estimate applies to warm AIHA in this clinical review, not every AIHA subtype.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Anti-Erythrocyte Autoantibody Production
    treatment_effect: INHIBITS
    description: >-
      Depletes CD20-positive B cells contributing to autoantibody production; long-lived CD20-negative plasma cells can persist.
- name: Splenectomy
  therapeutic_modality: SURGERY
  description: >-
    A later-line option for selected fit patients with refractory warm AIHA, after accounting for lifelong infection and thrombotic risks. It is generally ineffective in CAD because complement-opsonized cells are cleared predominantly in the liver.
  evidence:
  - reference: PMID:39371250
    reference_title: "Autoimmune Hemolytic Anemias: Challenges in Diagnosis and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It may be considered in young low comorbid patients after vaccination against capsulated organisms, and accounting for a life-long increase in infectious and thrombotic risk.
    explanation: >-
      The clinical review limits this intervention to suitable warm-AIHA patients.
  treatment_term:
    preferred_term: Splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  target_mechanisms:
  - target: Fc-Gamma-Receptor-Mediated Erythrophagocytosis
    treatment_effect: INHIBITS
    description: >-
      Removes a major site of IgG-mediated erythrocyte clearance.
- name: Sutimlimab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    C1s inhibition for CAD rapidly controls complement-mediated hemolysis and improves anemia and fatigue. Continued dosing is usually needed; it does not remove the B-cell clone or directly treat agglutination-mediated acrocyanosis and Raynaud symptoms.
  evidence:
  - reference: PMID:39091672
    reference_title: "Long-term efficacy and safety of continued complement C1s inhibition with sutimlimab in cold agglutinin disease: CADENZA study Part B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following a 9-week washout, inhibition of CP activity was reversed, and haemolytic markers approached baseline levels.
    explanation: >-
      CADENZA Part B followed 39 patients, 32 of whom completed the extension, for a median treatment duration of 99 weeks. The extension was open label and descriptive.
  - reference: PMID:39091672
    reference_title: "Long-term efficacy and safety of continued complement C1s inhibition with sutimlimab in cold agglutinin disease: CADENZA study Part B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mechanism of action of sutimlimab means that it affects the complement-mediated symptoms of CAD, such as haemolysis, anaemia, and fatigue, rather than the cold-induced, agglutination-mediated circulatory symptoms, such as acrocyanosis and Raynaud's phenomenon.
    explanation: >-
      Explains the mechanistic boundary of treatment response.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Sutimlimab
      term:
        id: NCIT:C153093
        label: Sutimlimab
  target_mechanisms:
  - target: Classical Complement Activation
    treatment_effect: INHIBITS
    description: >-
      Selective C1s blockade prevents classical-pathway activation and downstream C3b opsonization.
- name: Red-cell transfusion support
  therapeutic_modality: OTHER
  description: >-
    Transfusion supports patients with severe or symptomatic anemia while disease-directed therapy takes effect. Selection depends on symptoms and comorbidity as well as hemoglobin; alloantibody investigation and close transfusion-service coordination are essential. Physiologically necessary transfusion should not be withheld solely because an autoantibody makes serologic compatibility difficult.
  evidence:
  - reference: PMID:39371250
    reference_title: "Autoimmune Hemolytic Anemias: Challenges in Diagnosis and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, a careful matching is recommended along with a close collaboration with transfusion medicine experts
    explanation: >-
      Supportive care requires attention to clinically significant alloantibodies.
  - reference: PMID:38673882
    reference_title: "Autoimmune Hemolytic Anemias: Classifications, Pathophysiology, Diagnoses and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transfusion if necessary; do not withhold transfusion if physiologically required
    explanation: >-
      The source stresses clinical necessity while retaining investigation and matching for underlying alloantibodies.
  treatment_term:
    preferred_term: Packed Red Blood Cell Transfusion
    term:
      id: NCIT:C15409
      label: Packed Red Blood Cell Transfusion
  target_mechanisms:
  - target: Anemia
    treatment_effect: BYPASSES
    description: >-
      Replaces circulating red cells without suppressing the underlying autoimmune process.
- name: Epoetin alfa
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    An adjunct for selected AIHA patients with inadequate reticulocyte compensation and inappropriately low endogenous erythropoietin. A prospective 47-patient cohort found an early hemoglobin and transfusion benefit, but treatment was not randomized and most patients received concomitant immunosuppression.
  evidence:
  - reference: PMID:38029356
    reference_title: "Recombinant erythropoietin in autoimmune hemolytic anemia with inadequate bone marrow response: a prospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall response was 55% at 15 days, 74% at 1 month, 74% at 3 months, 80% at 6 months, and 91% at 12 months.
    explanation: >-
      Response rates use time-specific evaluable denominators; Figure 1A gives 25 complete responses, six partial responses and three nonresponses at day 360, yielding 31/34; this is not 91% of all 47 enrolled patients. This is add-on evidence for inadequate marrow compensation.
  - reference: PMID:38029356
    reference_title: "Recombinant erythropoietin in autoimmune hemolytic anemia with inadequate bone marrow response: a prospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the contribution of concomitant medication to response cannot be excluded
    explanation: >-
      The nonrandomized comparison does not isolate epoetin efficacy. Two thromboses occurred among treated patients, both with additional risk factors.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Epoetin Alfa
      term:
        id: NCIT:C2695
        label: Epoetin Alfa
  target_mechanisms:
  - target: Inadequate Erythropoietic Compensation
    treatment_effect: RESTORES
    description: >-
      Stimulates erythropoiesis when endogenous compensation is insufficient.
- name: Fostamatinib
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Investigational/off-label SYK inhibition for refractory warm AIHA. The 90-patient randomized FORWARD trial did not meet its primary durable-hemoglobin-response endpoint (35.6% versus 26.7%; P=0.398). Favorable post-hoc analyses and subsequent retrospective responses are hypothesis-generating, rather than a positive primary trial result.
  evidence:
  - reference: PMID:37929318
    reference_title: "Fostamatinib for warm antibody autoimmune hemolytic anemia: Phase 3, randomized, double-blind, placebo-controlled, global study (FORWARD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the fostamatinib-treated patients, 35.6% achieved a durable Hgb response versus 26.7% on placebo (p = .398).
    explanation: >-
      The prespecified phase III primary comparison was not statistically significant; regional and rescue-adjusted analyses were post hoc.
  - reference: PMID:41846299
    reference_title: "A multicentre analysis of efficacy, safety and molecular response correlates of fostamatinib in warm autoimmune haemolytic anaemia and Evans syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Regarding efficacy, 14 of 22 patients (64%) responded to fostamatinib (9 wAIHA and 5 ES).
    explanation: >-
      The 2026 retrospective cohort included 13 isolated warm-AIHA and nine Evans-syndrome patients; 10/22 had a six-month durable response, and 11 required steroid rescue. It does not overturn the randomized primary result.

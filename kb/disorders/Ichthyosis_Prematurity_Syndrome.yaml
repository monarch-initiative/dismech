      snippet: "Our data provide evidence of a new splice acceptor site creating SNV that results in a reduction or loss of intact SLC27A4 protein and probably explains the severe skin phenotype in Great Danes."
      explanation: The canine variant reduces or abolishes intact protein.
discussions:
- discussion_id: ips_mouse_human_severity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why is complete FATP4 loss lethal in the mouse but compatible with survival
    and near-normal skin in humans?
  attaches_to:
  - pathophysiology#Epidermal Permeability Barrier Failure
  - progression#Resolution of the birth scale
  rationale: >-
    The mechanistic evidence for the acylceramide-to-barrier chain comes mainly
    from null mice, which die neonatally, whereas human patients with null
    alleles recover within weeks. If another acyl-CoA synthetase, such as FATP1,
    compensates in human skin after birth, the mouse overstates the lasting
    human barrier defect and the human postnatal course depends on a mechanism
    the model lacks. No study has measured FATP1 or acylceramide in patient
    epidermis over time.
  status: OPEN
  evidence:
  - reference: PMID:31519952
    reference_title: Fatty acid transport protein 4 is required for incorporation of saturated ultralong-chain fatty acids into epidermal ceramides and monoacylglycerols.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "FATP4 (SLC27A4) mutations cause ichthyosis prematurity syndrome, a nonlethal disorder. In contrast, Fatp4-/- mice die neonatally from a defective barrier."
    explanation: States the mismatch.
  - reference: PMID:25184958
    reference_title: Fatty acid transport protein 1 can compensate for fatty acid transport protein 4 in the developing mouse epidermis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we tested the hypothesis that FATP1, the closest FATP4 homolog, can compensate for the lack of FATP4 in our mouse model of IPS, as it might do postnatally in IPS patients."
    explanation: Proposes FATP1 compensation as the explanation, untested in patients.
- discussion_id: ips_preterm_labour_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    What triggers preterm delivery in IPS pregnancies: uterine overdistension
    from polyhydramnios, the membrane separation, intra-amniotic inflammation
    from keratin debris, or something else?
  attaches_to:
  - phenotypes#Premature birth
  - pathophysiology#Corneocyte Shedding into Amniotic Fluid
  rationale: >-
    Preterm birth is near-universal and gives the syndrome its name, yet the
    only evidence linking it to the amniotic findings is their temporal order in
    small series. The edge from the amniotic node to premature birth is marked
    UNKNOWN for that reason.
  status: OPEN
  evidence:
  - reference: PMID:21465607
    reference_title: Prenatal sonographic assessment and perinatal course of ichthyosis prematurity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All fetuses were delivered prematurely between 30 and 34 weeks."
    explanation: Preterm delivery follows the amniotic changes in all five fetuses.
- discussion_id: ips_atopy_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the eosinophilia, raised IgE and lifelong atopy of IPS a consequence of
    barrier-driven epicutaneous sensitization, or a direct effect of SLC27A4
    loss on immune cells?
  attaches_to:
  - pathophysiology#Barrier-Associated Type 2 Sensitization
  rationale: >-
    Eosinophilia is present in the neonatal period, early for environmental
    sensitization, and atopy persists in many patients after the skin has
    largely normalised, which is hard to reconcile with a purely barrier-driven
    route. The review leaves both explanations open.
  status: OPEN
  evidence:
  - reference: PMID:40000070
    reference_title: "Ichthyosis Prematurity Syndrome: A Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients typically have a predisposition to atopic disease, possibly due to a defective skin barrier, epicutaneous sensitization, or as‐of‐yet effects of germline SLC27A4 variants on immune cell polarisation"
    explanation: The review lists both candidate mechanisms without choosing.
mechanistic_hypotheses:
- hypothesis_group_id: ips_barrier_driven_atopy
  hypothesis_label: Barrier-driven epicutaneous sensitization explains IPS atopy
  status: EMERGING
  description: >-
    The atopic features of IPS arise from allergen sensitization through the
    defective epidermal barrier, as in filaggrin-related atopy, rather than from
    an intrinsic immune effect of FATP4 loss.
notes: >-
  No disease-specific GeneReviews chapter exists for ichthyosis prematurity
  syndrome: a PubMed search for "ichthyosis prematurity[TI] AND genereviews[book]"
  returned no records. The only GeneReviews chapter with ichthyosis in its title
  covers autosomal recessive congenital ichthyosis, a neighbouring entity rather
  than this disease, and is not used as the phenotype baseline here.

  Phenotype frequencies come mainly from a 2025 systematic review of 59
  published cases and from a 23-patient Norwegian clinical series. Published
  cases are selected for the full phenotype, and many reports do not mention a
  given feature, so the percentages describe the literature rather than
  penetrance.

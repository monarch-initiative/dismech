diagnosis:
- name: Prenatal ultrasound
  description: >-
    From 28 weeks, polyhydramnios with separation of the chorionic and amniotic
    membranes, echo-free chorionic fluid and echogenic amniotic sediment suggests
    IPS and allows a neonatal team to be present at delivery. These signs are
    suggestive rather than diagnostic.
  results: Membrane separation, echogenic amniotic fluid and echo-free chorionic fluid between 28 and 32 weeks.
  evidence:
  - reference: PMID:21465607
    reference_title: Prenatal sonographic assessment and perinatal course of ichthyosis prematurity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal sonographic signs of IPS are separation of the membranes, echogenic amniotic fluid and echo-free chorionic fluid occurring between 28 and 32 weeks' gestation."
    explanation: The series proposes these as the prenatal signs.
- name: Skin biopsy with electron microscopy
  description: >-
    Electron microscopy shows trilamellar membrane aggregates in the stratum
    granulosum and stratum corneum, which support the diagnosis when genetic
    results are pending or inconclusive.
  results: Curved trilamellar membrane aggregates in the upper epidermis.
  evidence:
  - reference: PMID:19119129
    reference_title: "Ichthyosis prematurity syndrome: a well-defined congenital ichthyosis subtype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the diagnosis supported by electron microscopy of a skin biopsy specimen showing pathognomonic trilamellar membrane aggregations in the stratum corneum and stratum granulosum"
    explanation: Electron microscopy supported the diagnosis in the index sibling pair.
- name: SLC27A4 molecular testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequencing of SLC27A4, alone or on a congenital ichthyosis panel, confirms
    the diagnosis. Because exon-level deletions occur, a single detected allele
    calls for deletion/duplication analysis.
  results: Biallelic pathogenic SLC27A4 variants.
  evidence:
  - reference: PMID:39865317
    reference_title: Ichthyosis Prematurity Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing confirmed the presence of germline, compound heterozygous variants of the SLC27A4 gene."
    explanation: Molecular confirmation in a case where one allele was an exon deletion.
differential_diagnoses:
- name: Autosomal recessive congenital ichthyosis
  disease_term:
    preferred_term: autosomal recessive congenital ichthyosis
    term:
      id: MONDO:0017265
      label: autosomal recessive congenital ichthyosis
  description: >-
    IPS shares recessive inheritance, congenital scaling and a lipid-barrier
    mechanism with non-syndromic ARCI, and SLC27A4 appears on ARCI gene panels.
    IPS is set apart as a syndromic congenital ichthyosis by its prematurity and
    prenatal amniotic findings, neonatal asphyxia, eosinophilia, characteristic
    epidermal ultrastructure, and the rapid improvement of the skin after birth,
    whereas ARCI scaling persists.
  distinguishing_features:
  - Premature birth with polyhydramnios and chorioamniotic membrane separation
  - Neonatal asphyxia from aspirated keratin debris
  - Marked peripheral eosinophilia
  - Curved trilamellar membrane aggregates on electron microscopy
  - Scale sheds within weeks, leaving a mild nonscaly ichthyosis
  evidence:
  - reference: PMID:21856041
    reference_title: "Ichthyosis prematurity syndrome: clinical evaluation of 17 families with a rare disorder of lipid metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Ichthyosis prematurity syndrome (IPS) is classified as a syndromic congenital ichthyosis based on the presence of skin changes at birth, ultrastructural abnormalities in the epidermis, and extracutaneous manifestations."
    explanation: >-
      States the classification basis that separates IPS from the non-syndromic
      congenital ichthyoses.
  - reference: PMID:19119129
    reference_title: "Ichthyosis prematurity syndrome: a well-defined congenital ichthyosis subtype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosing this syndrome is important to reassure parents, obstetricians, and pediatricians about its benign course after complications in the perinatal period."
    explanation: >-
      The benign course after the perinatal period is what distinguishes IPS
      prognostically from other severe congenital ichthyoses.
- name: Harlequin ichthyosis
  disease_term:
    preferred_term: harlequin ichthyosis
    term:
      id: MONDO:0009443
      label: autosomal recessive congenital ichthyosis 4B
  description: >-
    Also presents with thick scale and respiratory distress at birth, but with
    thick constrictive plates; the respiratory compromise reflects restricted
    chest expansion rather than aspiration of amniotic keratin debris.
  distinguishing_features:
  - Thick armour-like plates rather than clay-like vernix scale

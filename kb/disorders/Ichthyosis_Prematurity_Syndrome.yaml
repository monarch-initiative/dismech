    term:
      id: HP:0025724
      label: Caseous vernix-like desquamation
  target_mechanisms:
  - target: Epidermal Permeability Barrier Failure
    description: Topical occlusion supports the defective barrier.
  evidence:
  - reference: PMID:40000070
    reference_title: "Ichthyosis Prematurity Syndrome: A Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is insufficient evidence that emollients confer any therapeutic advantage, as the scale‐like vernix sheds spontaneously"
    explanation: >-
      Supports the description's statement that IPS-specific benefit is
      unproven.
  - reference: PMID:40000070
    reference_title: "Ichthyosis Prematurity Syndrome: A Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "emollients are a simple and safe intervention that is well established in other forms of ichthyosis"
    explanation: >-

      explanation: Pooled description of residual skin findings after the neonatal period.
- name: Corneocyte Shedding into Amniotic Fluid
  biological_scale: TISSUE
  description: >-
    Corneocytes and keratin debris from the fetal skin accumulate in the
    amniotic fluid from about 28 weeks, producing echogenic sediment in the
    amniotic cavity. The debris is thought to obstruct fetal swallowing and
    passage of fluid through the gut, which would explain the polyhydramnios and
    the empty fetal stomach seen on ultrasound, and it is the material later
    aspirated at birth.
  locations:
  - preferred_term: amniotic fluid
    term:
      id: UBERON:0000173
      label: amniotic fluid
  evidence:
  - reference: PMID:21465607
    reference_title: Prenatal sonographic assessment and perinatal course of ichthyosis prematurity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Separation of chorionic and amniotic membranes with a peculiar appearance of echo-free fluid in the chorionic cavity and echogenic sediment in the amniotic cavity were observed between 28 + 5 and 32 + 3 weeks in all cases."
    explanation: >-
      All five fetuses in the series showed echogenic amniotic sediment, the
      ultrasound sign of this node.
  downstream:
  - target: Polyhydramnios
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Keratin debris is proposed to block fetal swallowing or gut transit of
      amniotic fluid. The mechanism is inferred, not demonstrated.
    evidence:
    - reference: PMID:40000070
      reference_title: "Ichthyosis Prematurity Syndrome: A Systematic Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Keratin debris deposition likely contributes to polyhydramnios by obstructing the passage of amniotic fluid through the fetal gastrointestinal tract"
      explanation: The review states the proposed mechanism, with hedged wording.
    - reference: PMID:21465607
      reference_title: Prenatal sonographic assessment and perinatal course of ichthyosis prematurity syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The fetal stomach appeared to be empty in four cases, and was not described in one case."
      explanation: >-
        An empty fetal stomach is consistent with impaired swallowing of the
        debris-laden fluid, the observation behind the proposed mechanism.
  - target: Spontaneous chorioamniotic separation
    causal_link_type: UNKNOWN
    description: >-
      Membrane separation accompanies the echogenic fluid in every fetus of the
      prenatal series. How the two are linked is not known; the review suggests
      a shared embryological origin of amnion and surface ectoderm.
    evidence:
    - reference: PMID:21465607
      reference_title: Prenatal sonographic assessment and perinatal course of ichthyosis prematurity syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Separation of chorionic and amniotic membranes with a peculiar appearance of echo-free fluid in the chorionic cavity and echogenic sediment in the amniotic cavity were observed between 28 + 5 and 32 + 3 weeks in all cases."
      explanation: The two findings co-occur in all five fetuses.
  - target: Aspiration of Keratin Debris into the Airways
    causal_link_type: DIRECT
    description: >-
      At delivery the infant aspirates the corneocyte-containing amniotic fluid.
    evidence:
    - reference: PMID:21856041
      reference_title: "Ichthyosis prematurity syndrome: clinical evaluation of 17 families with a rare disorder of lipid metabolism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "this was likely caused by aspiration of corneocyte-containing amniotic fluid as postmortem examination of lung tissue in two patients revealed keratin debris filling the bronchial tree and alveoli"
      explanation: Postmortem lung findings in two patients document the aspirated debris.
  - target: Premature birth
    causal_link_type: UNKNOWN
    description: >-
      Preterm delivery follows the polyhydramnios and membrane separation in
      nearly every affected pregnancy, but what triggers labour has not been
      established. Polyhydramnios-related uterine overdistension is one
      plausible route; it has not been tested in IPS.
    evidence:
    - reference: PMID:21465607
      reference_title: Prenatal sonographic assessment and perinatal course of ichthyosis prematurity syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All five developed polyhydramnios between 28 and 31 weeks."
      explanation: >-
        Polyhydramnios precedes delivery at 30 to 34 weeks in all five fetuses,
        a temporal sequence rather than a demonstrated causal link.
- name: Aspiration of Keratin Debris into the Airways
  biological_scale: ORGANISM
  description: >-
    Aspirated keratin debris fills the bronchial tree and alveoli, obstructing
    the airways at birth. Restricted chest expansion from tight skin, the main
    route in harlequin ichthyosis and collodion babies, is not thought to be the
    principal mechanism in IPS. Prematurity adds surfactant-deficiency risk,
    but the respiratory distress rate in IPS far exceeds the rate expected for
    gestational age.
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  - preferred_term: alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  evidence:
  - reference: PMID:21856041
    reference_title: "Ichthyosis prematurity syndrome: clinical evaluation of 17 families with a rare disorder of lipid metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "postmortem examination of lung tissue in two patients revealed keratin debris filling the bronchial tree and alveoli"
    explanation: Direct autopsy evidence of airway keratin debris, in two patients.
  - reference: PMID:39865317
    reference_title: Ichthyosis Prematurity Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "While respiratory distress may also be seen in collodion and Harlequin presentations, in IPS it is thought to be primarily due to aspiration of keratin debris in amniotic fluid rather than restricted chest expansion"
    explanation: >-
      Distinguishes the aspiration mechanism from the restrictive-skin mechanism
      of other severe neonatal ichthyoses; stated in the discussion of a case
      letter, citing earlier work.
  - reference: PMID:40000070
    reference_title: "Ichthyosis Prematurity Syndrome: A Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with 79.7% reporting respiratory distress, significantly higher than the 5% approximate age‐matched incidence for the general population"
    explanation: >-
      The excess over the gestational-age-matched rate argues that prematurity
      alone does not explain the respiratory distress.
  downstream:
  - target: Neonatal respiratory distress
    causal_link_type: DIRECT
    description: Airway obstruction by debris produces respiratory distress at birth.
    evidence:
    - reference: PMID:40000070
      reference_title: "Ichthyosis Prematurity Syndrome: A Systematic Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Pathogenesis is likely due to keratin debris in the amniotic fluid that accumulates in the airways and is aspirated at birth"
      explanation: The review attributes the respiratory distress to aspirated debris.
  - target: Neonatal asphyxia
    causal_link_type: DIRECT
    description: In severe cases the obstruction causes life-threatening asphyxia.
    evidence:
    - reference: PMID:22927265
      reference_title: Ichthyosis prematurity syndrome with separation of fetal membranes and neonatal asphyxia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Children are born prematurely with thick skin and have been found to develop neonatal asphyxia due to occlusions in the bronchial tree from debris in the amniotic fluid."
      explanation: Links asphyxia to bronchial occlusion by amniotic debris.
  - target: Aspiration pneumonia
    causal_link_type: DIRECT
    description: Aspirated debris can be followed by aspiration pneumonia.
    evidence:
    - reference: PMID:21465607
      reference_title: Prenatal sonographic assessment and perinatal course of ichthyosis prematurity syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All neonates had difficulties in breathing, two developed aspiration pneumonia"
      explanation: Two of five neonates in the series developed aspiration pneumonia.
- name: Barrier-Associated Type 2 Sensitization
  conforms_to: "epithelial_barrier_dysfunction#Type 2 Sensitization and IgE Class Switch"
  biological_scale: ORGANISM
  description: >-
    Peripheral eosinophilia is almost invariable in the neonate, serum IgE is
    raised in most patients, and respiratory or food allergy develops in most.
    Whether this follows from epicutaneous sensitization through the defective
    barrier, as in other barrier disorders, or from a direct effect of FATP4
    loss on immune cells has not been resolved (see discussion
    ips_atopy_mechanism).
  cell_types:

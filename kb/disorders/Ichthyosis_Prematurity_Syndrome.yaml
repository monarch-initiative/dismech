    evidence:
    - reference: PMID:17401141
      reference_title: Keratinocyte-specific expression of fatty acid transport protein 4 rescues the wrinkle-free phenotype in Slc27a4/Fatp4 mutant mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both modes of FATP4 expression led to rescue of the neonatally lethal skin defects, and the resulting mice were viable and fertile. Keratinocyte expression of an FATP4 variant with mutations in the acyl-CoA synthetase domain did not provide any degree of rescue."
      explanation: Rescue and its dependence on the synthetase domain.
    - reference: PMID:25184958
      reference_title: Fatty acid transport protein 1 can compensate for fatty acid transport protein 4 in the developing mouse epidermis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Transgenic expression of FATP1 in suprabasal keratinocytes rescued the phenotype of Fatp4 mutants, and FATP1 sorted to the same intracellular organelles as endogenous FATP4."
      explanation: The closest homolog can substitute for FATP4 in the same cells.
- name: Great Dane ichthyosis
  species: Dog
  genotype: SLC27A4 g.8684G>A splice-acceptor variant, homozygous

animal_models:
- name: Fatp4 targeted knockout mouse
  species: Mouse
  genotype: Slc27a4 (Fatp4) targeted null
  publication: PMID:12821645
  description: >-
    Neonatally lethal with tight, thick skin, hyperproliferative hyperkeratosis,
    a defective barrier and reduced ultra-long-chain ceramides. Much more
    severe than the human disease.
  modeled_mechanisms:
  - target: Epidermal Permeability Barrier Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces the epidermal barrier failure and hyperkeratosis.
    limitations: >-
      Null mice die neonatally of dehydration and restricted movement, whereas
      human IPS is nonlethal and the skin improves after birth. Prenatal
      amniotic findings and aspiration have not been described in the mouse.
    evidence:
    - reference: PMID:12821645
      reference_title: Mice with targeted disruption of the fatty acid transport protein 4 (Fatp 4, Slc27a4) gene show features of lethal restrictive dermopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Their skin was characterized by hyperproliferative hyperkeratosis with a disturbed epidermal barrier"
      explanation: The barrier and hyperkeratosis phenotype.
  - target: Reduced Epidermal omega-O-Acylceramide Synthesis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: Epidermal acylceramide falls to about a tenth of wild type.
    evidence:
    - reference: PMID:31974308
      reference_title: Skin permeability barrier formation by the ichthyosis-causative gene FATP4 through formation of the barrier lipid ω-O-acylceramide.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The total amount of acylceramide in Fatp4 KO mice was reduced to ∼10% of wild-type mice."
      explanation: Quantifies the acylceramide deficit in knockout epidermis.
  - target: Caseous vernix-like scale at birth
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mouse shows a tight restrictive-dermopathy-like skin and dies, rather
      than the transient, shedding vernix-like scale of human IPS.
    limitations: >-
      Species and severity differ; compensation by other FATPs postnatally in
      humans is one proposed explanation.
    evidence:
    - reference: PMID:31519952
      reference_title: Fatty acid transport protein 4 is required for incorporation of saturated ultralong-chain fatty acids into epidermal ceramides and monoacylglycerols.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "FATP4 (SLC27A4) mutations cause ichthyosis prematurity syndrome, a nonlethal disorder. In contrast, Fatp4-/- mice die neonatally from a defective barrier."
      explanation: States the severity mismatch between the human disease and the null mouse.
  evidence:
  - reference: PMID:12821645
    reference_title: Mice with targeted disruption of the fatty acid transport protein 4 (Fatp 4, Slc27a4) gene show features of lethal restrictive dermopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Fatp4-null mice displayed features of a neonatally lethal restrictive dermopathy."
    explanation: Describes the overall model phenotype.
- name: Suprabasal FATP4 or FATP1 transgene rescue of Fatp4 mutant mice
  species: Mouse
  genotype: Fatp4-/- with a keratinocyte (suprabasal) FATP4 or FATP1 transgene
  publication: PMID:17401141
  description: >-
    Keratinocyte-restricted FATP4 rescues the lethal skin phenotype, while an
    FATP4 with a mutated acyl-CoA synthetase domain does not; FATP1 expressed in
    the same compartment also rescues.
  modeled_mechanisms:
  - target: Epidermal Permeability Barrier Failure
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Shows that the barrier defect is cell-autonomous to keratinocytes and
      depends on the acyl-CoA synthetase activity.
    limitations: >-
      Transgenic overexpression in mice; no equivalent intervention exists in

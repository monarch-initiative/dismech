treatments:
- name: Neonatal respiratory support
  description: >-
    A neonatal intensive care team should attend delivery because of the risk
    of asphyxia. Airway clearance and respiratory support, non-invasive (CPAP,
    nasal oxygen, high-frequency oscillation) or invasive ventilation, are the
    main treatment; 27 of 59 published cases needed support. Surfactant has been
    given but its benefit is uncertain because the cause is airway debris rather
    than surfactant deficiency.
  treatment_term:
    preferred_term: neonatal respiratory support
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  therapeutic_modality: DEVICE
  target_phenotypes:
  - preferred_term: Neonatal respiratory distress
    term:
      id: HP:0002643
      label: Neonatal respiratory distress
  target_mechanisms:
  - target: Aspiration of Keratin Debris into the Airways
    description: Supports ventilation while the aspirated debris is cleared.
  evidence:
  - reference: PMID:40000070
    reference_title: "Ichthyosis Prematurity Syndrome: A Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment primarily consisted of respiratory support to manage respiratory distress."
    explanation: Respiratory support is the main treatment across published cases.
  - reference: PMID:21465607
    reference_title: Prenatal sonographic assessment and perinatal course of ichthyosis prematurity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Delivery occurs at 30-34 weeks and, as there is a high risk of asphyxia, an experienced neonatal intensive care unit team should be present at delivery."
    explanation: Recommends neonatal intensive care at delivery.
- name: Emollient skin care
  description: >-
    Bland emollients such as white soft paraffin are used while the scale sheds
    spontaneously. There is no IPS-specific evidence that they speed resolution;
    they are used because they are safe and established in other ichthyoses and
    may support the defective barrier.
  treatment_term:
    preferred_term: emollient skin care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  target_phenotypes:

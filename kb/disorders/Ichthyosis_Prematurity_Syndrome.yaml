    evidence_source: HUMAN_CLINICAL
    snippet: "The clay‐like scale of IPS is pathognomonic, but depending on the phenotype, differential diagnoses may include the thick scale of harlequin ichthyosis or the feathery scale of Conradi‐Hünermann‐Happle syndrome"
    explanation: Names harlequin ichthyosis as a differential by scale type.
  - reference: PMID:39865317
    reference_title: Ichthyosis Prematurity Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "While respiratory distress may also be seen in collodion and Harlequin presentations, in IPS it is thought to be primarily due to aspiration of keratin debris in amniotic fluid rather than restricted chest expansion"
    explanation: Distinguishes the respiratory mechanism.

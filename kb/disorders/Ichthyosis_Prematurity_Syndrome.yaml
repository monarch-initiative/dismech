name: Ichthyosis Prematurity Syndrome
creation_date: "2026-10-09T20:30:00Z"
description: >-
  Ichthyosis prematurity syndrome (IPS) is an autosomal recessive syndromic
  congenital ichthyosis caused by biallelic germline variants in SLC27A4, which
  encodes fatty acid transport protein 4 (FATP4), an acyl-CoA synthetase that
  activates very-long-chain and omega-hydroxy fatty acids for synthesis of the
  epidermal barrier lipid omega-O-acylceramide. The fetal epidermis forms a
  defective barrier and sheds large amounts of corneocyte debris into the
  amniotic fluid. Pregnancies show polyhydramnios, echogenic amniotic fluid and
  separation of the chorionic and amniotic membranes from about 28 weeks, and
  the child is born prematurely, typically at 30 to 34 weeks, covered in a thick,
  greasy, clay- or vernix-like scale over erythrodermic, swollen skin.
  Aspiration of keratin-laden amniotic fluid causes neonatal respiratory distress
  or asphyxia, which is the main source of early morbidity and of the rare
  deaths. Peripheral eosinophilia is almost invariable and serum IgE is usually
  raised. The scale sheds within weeks to months; survivors have a favourable
  course but keep a mild, nonscaly ichthyosis or follicular hyperkeratosis,
  pruritus, and a lasting atopic diathesis with respiratory and food allergy.
category: Mendelian

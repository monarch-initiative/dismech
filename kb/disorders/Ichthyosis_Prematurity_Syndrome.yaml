inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry biallelic SLC27A4 variants, homozygous (often the
    Scandinavian p.Cys168* founder allele, or in consanguineous families) or
    compound heterozygous.
  evidence:
  - reference: PMID:19631310
    reference_title: Mutations in the fatty acid transport protein 4 gene cause the ichthyosis prematurity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ichthyosis prematurity syndrome (IPS) is an autosomal-recessive disorder characterized by premature birth and neonatal asphyxia, followed by a lifelong nonscaly ichthyosis with atopic manifestations."
    explanation: >-
      The gene-discovery study states the recessive mode of inheritance for the
      families in which it mapped the disease.
  - reference: PMID:21450060
    reference_title: FATP4 missense and nonsense mutations cause similar features in Ichthyosis Prematurity Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four probands were compound heterozygous for four different mutations of which three are novel."
    explanation: >-
      Compound heterozygosity in four of five unrelated probands supports
      biallelic, recessive causation.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.5
  notes: >-
    The 2025 systematic review repeats a worldwide estimate of 1 in 200,000 from
    earlier literature and says the true figure may be higher given recent cases
    from many ancestries. The measure (birth or point prevalence) is not stated
    by the source, so measure_type is UNKNOWN.
  evidence:
  - reference: PMID:40000070
    reference_title: "Ichthyosis Prematurity Syndrome: A Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Prevalence worldwide is estimated to be 1 in 200,000 cases, though recent cases from diverse ethnic backgrounds suggest that frequency may be underestimated"
    explanation: >-
      States the worldwide estimate in the review's introduction, citing earlier
      work rather than deriving it, hence BACKGROUND.
- population: Norway and Sweden
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2000.0
  notes: >-
    Local carrier frequency of about 1 in 50, attributed to the p.Cys168*
    founder allele. Stated in the introduction of a mutation-screening paper,
    citing earlier work; not a population screening result of that paper.
  evidence:
  - reference: PMID:21450060
    reference_title: FATP4 missense and nonsense mutations cause similar features in Ichthyosis Prematurity Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "IPS is more prevalent in Norway and Sweden with an estimated local carrier frequency of one in 50 suggesting a founder mutation"
    explanation: >-
      Gives the Scandinavian carrier frequency and links it to a founder allele.
- population: Published IPS literature to September 2024
  measure_type: CASES_IN_LITERATURE
  notes: >-
    A PROSPERO-registered systematic review found 59 reported cases in 26
    studies, from European, African, Middle Eastern, Asian and American
    patients, so the disease is not restricted to Scandinavia.
  evidence:
  - reference: PMID:40000070
    reference_title: "Ichthyosis Prematurity Syndrome: A Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 26 studies reporting 59 cases of IPS (PROSPERO database: CRD42024533988). While IPS was previously thought to predominantly affect Norwegian and Swedish patients, we identified cases from a broad range of ethnicities."
    explanation: >-
      The cumulative case count and its ancestral breadth are stated directly.
progression:
- phase: Third-trimester prenatal phase
  age_range: from about 28 weeks of gestation to delivery
  notes: >-
    Polyhydramnios, separation of the chorionic and amniotic membranes, echogenic
    sediment in the amniotic cavity and echo-free chorionic fluid appear between
    28 and 32 weeks. Delivery follows prematurely at 30 to 34 weeks.
  evidence:
  - reference: PMID:21465607
    reference_title: Prenatal sonographic assessment and perinatal course of ichthyosis prematurity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal sonographic signs of IPS are separation of the membranes, echogenic amniotic fluid and echo-free chorionic fluid occurring between 28 and 32 weeks' gestation."
    explanation: >-
      A national fetal-medicine-centre series of five fetuses gives the timing
      of the prenatal phase.
  - reference: PMID:21465607
    reference_title: Prenatal sonographic assessment and perinatal course of ichthyosis prematurity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All fetuses were delivered prematurely between 30 and 34 weeks."
    explanation: Gives the end of the prenatal phase.
- phase: Neonatal phase
  age_range: birth to the first weeks of life
  notes: >-
    The newborn is covered in thick, greasy, vernix-like scale over erythrodermic,
    swollen skin and has respiratory distress or asphyxia, sometimes requiring
    ventilation. Eosinophilia is present. This is the period of risk: six of
    59 published cases were fatal, giving an estimated six-month survival of
    87.6%.
  evidence:
  - reference: PMID:21856041
    reference_title: "Ichthyosis prematurity syndrome: clinical evaluation of 17 families with a rare disorder of lipid metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients were born prematurely with sometimes life-threatening neonatal asphyxia"
    explanation: The 23-patient Norwegian series describes the neonatal presentation.
  - reference: PMID:40000070
    reference_title: "Ichthyosis Prematurity Syndrome: A Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mortality in these cases was attributed to respiratory and/or cardiac sequelae or sepsis."
    explanation: >-
      The fatal cases in the systematic review arise from the neonatal
      respiratory and infectious complications.
  - reference: PMID:40000070
    reference_title: "Ichthyosis Prematurity Syndrome: A Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term prognosis is generally good, although six (10.2%) fulminant cases were identified with an estimated 6-month survival rate of 87.6% (95% confidence interval: 78.8-97.4)."
    explanation: >-
      Gives the case-fatality count and the Kaplan-Meier six-month survival
      across published cases with follow-up.
- phase: Resolution of the birth scale
  age_range: weeks to a few months after birth
  notes: >-
    The vernix-like scale sheds spontaneously; the median reported duration was
    10 weeks, although an exact duration was available for only a minority of
    published cases.
  evidence:
  - reference: PMID:40000070
    reference_title: "Ichthyosis Prematurity Syndrome: A Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median duration of the cutaneous scale was 10 weeks, though patients usually have persisting atopy."
    explanation: Gives the duration of the scaling phase across published cases.
  - reference: PMID:19119129
    reference_title: "Ichthyosis prematurity syndrome: a well-defined congenital ichthyosis subtype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Marked regression of the edema and ichthyotic scaling was observed within a few weeks."
    explanation: A sibling pair report documents the same rapid regression.
- phase: Lifelong mild phase
  age_range: infancy onward
  notes: >-
    After the birth scale resolves, the skin settles into a mild, nonscaly
    ichthyosis or follicular hyperkeratosis, often with chronic pruritus and
    atopic disease; long-term prognosis is otherwise good.
  evidence:
  - reference: PMID:21856041
    reference_title: "Ichthyosis prematurity syndrome: clinical evaluation of 17 families with a rare disorder of lipid metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "evolved rapidly to a mild chronic ichthyosis. Many patients subsequently had chronic, severe pruritus."
    explanation: Describes the course after the neonatal period in the Norwegian series.
  - reference: PMID:40000070
    reference_title: "Ichthyosis Prematurity Syndrome: A Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cutaneous manifestations of IPS resolve over a period of weeks, and patients generally have a favorable long-term prognosis."
    explanation: Summarises the long-term course across published cases.
pathophysiology:
- name: FATP4 Acyl-CoA Synthetase Deficiency
  conforms_to: "epidermal_cornification_failure#Cornification Program Component Deficiency"
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in SLC27A4 (nonsense, splice-site,
    missense and exon deletions) leave the epidermis without functional FATP4.
    FATP4 is the principal very-long-chain fatty acyl-CoA synthetase of the
    skin, and patient fibroblasts show reduced very-long-chain fatty acid-CoA
    synthetase activity and reduced incorporation of very-long-chain fatty acids
    into cellular lipids. Missense alleles produce the same clinical picture as
    the nonsense founder allele, indicating that they too abolish function.
  genes:
  - preferred_term: SLC27A4
    term:
      id: hgnc:10998
      label: SLC27A4
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  molecular_functions:
  - preferred_term: very long-chain fatty acid-CoA ligase activity
    term:
      id: GO:0031957
      label: very long-chain fatty acid-CoA ligase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: very long-chain fatty acid metabolic process
    term:
      id: GO:0000038
      label: very long-chain fatty acid metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:19631310
    reference_title: Mutations in the fatty acid transport protein 4 gene cause the ichthyosis prematurity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that the gene encoding the fatty acid transport protein 4 (FATP4) is mutated in individuals with IPS."
    explanation: Gene-discovery result identifying SLC27A4/FATP4 as the disease gene.
  - reference: PMID:19631310
    reference_title: Mutations in the fatty acid transport protein 4 gene cause the ichthyosis prematurity syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblasts derived from a patient with IPS show reduced activity of very long-chain fatty acids (VLCFA)-CoA synthetase and a specific reduction in the incorporation of VLCFA into cellular lipids."
    explanation: >-
      Patient-derived cells show the enzymatic loss that defines this node. The
      assay was in cultured fibroblasts from one patient, not in epidermis.
  - reference: PMID:17522045
    reference_title: Fatty acid transport protein 4 is the principal very long chain fatty acyl-CoA synthetase in skin fibroblasts.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Compared with w.t. fibroblasts, cells lacking FATP4 had an 83% decrease in C24:0 activation."
    explanation: >-
      Dermal fibroblast lines from FATP4-null mice show that FATP4 supplies most
      of the very-long-chain acyl-CoA synthetase activity, which is why its loss
      is not compensated in skin cells. Indirect because the cells are murine.
  - reference: PMID:21450060
    reference_title: FATP4 missense and nonsense mutations cause similar features in Ichthyosis Prematurity Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Missense mutations and non-sense mutations in FATP4 are associated with similar clinical features suggesting that missense mutations have a severe impact on FATP4 function."
    explanation: >-
      Genotype-phenotype comparison across five families supports loss of
      function as the shared consequence of the different allele classes.
  downstream:
  - target: Reduced Epidermal omega-O-Acylceramide Synthesis
    causal_link_type: DIRECT
    description: >-
      FATP4 activates the omega-hydroxy ultra-long-chain fatty acid that is an
      intermediate of acylceramide synthesis; without it, acylceramide
      production falls.
    evidence:
    - reference: PMID:31974308
      reference_title: Skin permeability barrier formation by the ichthyosis-causative gene FATP4 through formation of the barrier lipid ω-O-acylceramide.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro experiments revealed that FATP4 exhibits ACS activity toward an ω-hydroxy fatty acid (FA), an intermediate of the acylceramide synthetic pathway."
      explanation: >-
        Places FATP4's enzymatic activity on the acylceramide pathway
        intermediate, which is the link between the enzyme defect and the lipid
        deficit.
- name: Reduced Epidermal omega-O-Acylceramide Synthesis
  conforms_to: "epidermal_cornification_failure#Defective Cornified Envelope Assembly and Lamellar Lipid Delivery"
  biological_scale: CELLULAR
  description: >-
    Differentiating keratinocytes make far less omega-O-acylceramide and bound
    omega-hydroxyceramide, the lipids of the intercellular lamellae and the
    corneocyte lipid envelope, and the remaining ceramides have shortened
    chains. Lamellar bodies, the corneocyte lipid envelope and the cornified
    envelope are abnormal on electron microscopy in the knockout mouse. The
    lipid measurements come from Fatp4-null mice and FATP4-knockdown human
    keratinocytes; a comparable lipidomic study of patient epidermis has not
    been reported.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: corneocyte
    term:
      id: CL:0002153
      label: corneocyte
  biological_processes:
  - preferred_term: epidermal acylceramide biosynthesis
    term:
      id: GO:0046513
      label: ceramide biosynthetic process
    modifier: DECREASED
  - preferred_term: cornified envelope assembly
    term:
      id: GO:1903575
      label: cornified envelope assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:31974308
    reference_title: Skin permeability barrier formation by the ichthyosis-causative gene FATP4 through formation of the barrier lipid ω-O-acylceramide.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Decreased levels and shortening of chain lengths were observed in the saturated, nonacylated ceramides."
    explanation: Fatp4 knockout epidermis shows the ceramide deficit and chain shortening.
  - reference: PMID:31974308
    reference_title: Skin permeability barrier formation by the ichthyosis-causative gene FATP4 through formation of the barrier lipid ω-O-acylceramide.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A decrease in acylceramide levels was also observed in human keratinocytes with FATP4 knockdown."
    explanation: >-
      The acylceramide deficit is reproduced in human keratinocytes, which is
      the only human-cell evidence for this node.
  - reference: PMID:31519952
    reference_title: Fatty acid transport protein 4 is required for incorporation of saturated ultralong-chain fatty acids into epidermal ceramides and monoacylglycerols.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutants showed lamellar body, corneocyte lipid envelope, and cornified envelope abnormalities."
    explanation: >-
      Electron microscopy of Fatp4-null mouse epidermis shows the structural
      consequences in the lamellar lipid and cornified envelope compartments.
  - reference: PMID:12821645
    reference_title: Mice with targeted disruption of the fatty acid transport protein 4 (Fatp 4, Slc27a4) gene show features of lethal restrictive dermopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lipid analysis demonstrated a disturbed fatty acid composition of epidermal ceramides, in particular a decrease in the C26:0 and C26:0-OH fatty acid substitutes."
    explanation: >-
      An independent targeted knockout shows the loss of very-long-chain and
      omega-hydroxy acyl chains from epidermal ceramides.
  downstream:
  - target: Epidermal Permeability Barrier Failure
    causal_link_type: DIRECT
    description: >-
      Acylceramide is the lipid that organises the stratum corneum lamellae; its
      loss leaves the barrier permeable.
    evidence:
    - reference: PMID:31974308
      reference_title: Skin permeability barrier formation by the ichthyosis-causative gene FATP4 through formation of the barrier lipid ω-O-acylceramide.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "From these results, we conclude that skin barrier dysfunction observed in IPS patients and Fatp4 KO mice is caused mainly by reduced acylceramide production."
      explanation: >-
        The authors' conclusion links the acylceramide deficit to barrier
        dysfunction. The data are from mice and cultured cells, so the human
        part of the claim is an inference.
- name: Epidermal Permeability Barrier Failure
  conforms_to: "epidermal_cornification_failure#Stratum Corneum Permeability Barrier Failure"
  biological_scale: TISSUE
  description: >-
    The fetal and neonatal stratum corneum fails as a permeability barrier. In
    the mouse this is lethal shortly after birth; in humans the barrier defect is
    most severe in fetal and neonatal skin and is partly compensated later.
    Restoring FATP4 with an intact acyl-CoA synthetase domain in suprabasal
    keratinocytes alone rescues the mouse skin phenotype, placing the defect in
    the epidermis rather than in a systemic or placental lipid disturbance.
  cell_types:
  - preferred_term: corneocyte
    term:
      id: CL:0002153
      label: corneocyte
  biological_processes:
  - preferred_term: establishment of skin barrier
    term:
      id: GO:0061436
      label: establishment of skin barrier
    modifier: DECREASED
  locations:
  - preferred_term: stratum corneum
    term:
      id: UBERON:0002027
      label: stratum corneum of epidermis
  evidence:
  - reference: PMID:31974308
    reference_title: Skin permeability barrier formation by the ichthyosis-causative gene FATP4 through formation of the barrier lipid ω-O-acylceramide.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Fatp4 knockout (KO) mice exhibited severe skin barrier dysfunction and morphological abnormalities in the epidermis."
    explanation: Direct demonstration of barrier failure in the knockout.
  - reference: PMID:17401141
    reference_title: Keratinocyte-specific expression of fatty acid transport protein 4 rescues the wrinkle-free phenotype in Slc27a4/Fatp4 mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that expression of FATP4 with an intact acyl-CoA synthetase domain in suprabasal keratinocytes is necessary for normal skin development and that FATP4 functions in establishing the cornified envelope."
    explanation: >-
      Transgenic rescue localises the barrier defect to the acyl-CoA synthetase
      function of FATP4 in suprabasal keratinocytes.
  - reference: PMID:19631310
    reference_title: Mutations in the fatty acid transport protein 4 gene cause the ichthyosis prematurity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The human phenotype is consistent with Fatp4 deficiency in mice that is characterized by a severe skin phenotype, a defective permeability barrier function, and perturbed VLCFA metabolism."
    explanation: >-
      The discovery paper draws the mouse-to-human parallel; the human barrier
      defect is inferred from phenotype rather than measured.
  downstream:
  - target: Epidermal Hyperkeratosis with Lamellar Membrane Aggregates
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      As in other disorders of cornification, the barrier defect is accompanied
      by a thickened, hyperproliferative epidermis and abnormal membrane material
      in the upper epidermis. The signal linking the lipid defect to
      hyperproliferation has not been defined in IPS.
    evidence:
    - reference: PMID:12821645
      reference_title: Mice with targeted disruption of the fatty acid transport protein 4 (Fatp 4, Slc27a4) gene show features of lethal restrictive dermopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Their skin was characterized by hyperproliferative hyperkeratosis with a disturbed epidermal barrier"
      explanation: The knockout shows barrier failure and hyperproliferative hyperkeratosis together.
  - target: Corneocyte Shedding into Amniotic Fluid
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The abnormal fetal epidermis sheds corneocytes into the amniotic fluid,
      producing echogenic sediment visible on ultrasound. Why the defective
      epidermis sheds so much material in utero has not been studied directly.
    evidence:
    - reference: PMID:21856041
      reference_title: "Ichthyosis prematurity syndrome: clinical evaluation of 17 families with a rare disorder of lipid metabolism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

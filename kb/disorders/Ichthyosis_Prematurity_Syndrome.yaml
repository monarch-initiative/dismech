experimental_models:
- name: IPS patient dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Fibroblasts from a patient with IPS, used for acyl-CoA synthetase and
    lipid-incorporation assays.
  modeled_mechanisms:
  - target: FATP4 Acyl-CoA Synthetase Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Shows the reduced very-long-chain acyl-CoA synthetase activity directly.
    limitations: >-
      Fibroblasts are not the epidermal cell type in which FATP4 builds the
      barrier, and the data come from a single patient.
    evidence:
    - reference: PMID:19631310
      reference_title: Mutations in the fatty acid transport protein 4 gene cause the ichthyosis prematurity syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO

- name: Prothrombotic Glomerular Endothelial Phenotype
  biological_scale: CELLULAR
  description: >-
    Sustained signalling shifts the glomerular endothelium to an activated,
    prothrombotic state, with increased tissue factor and adhesion-molecule
    expression and impaired endothelial repair, favouring microvascular thrombosis
    independently of complement.
  cell_types:
  - preferred_term: glomerular endothelial cell
    term:
      id: CL:0002188
      label: glomerular endothelial cell
  biological_processes:
  - preferred_term: positive regulation of blood coagulation
    modifier: INCREASED
    term:
      id: GO:0030194
      label: positive regulation of blood coagulation
  evidence:
  - reference: PMID:25498910
    reference_title: "Loss of DGKε induces endothelial cell activation and death independently of complement activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DGKE silencing also increases EC apoptosis and impairs EC migration and angiogenesis in vitro"
    explanation: Endothelial apoptosis and impaired repair accompany the prothrombotic shift in DGKE-deficient endothelium.
  downstream:
  - target: Glomerular Thrombotic Microangiopathy
    causal_link_type: DIRECT
    evidence:

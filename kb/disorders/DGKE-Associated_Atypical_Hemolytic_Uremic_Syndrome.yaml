name: DGKE-Associated Atypical Hemolytic Uremic Syndrome
creation_date: "2026-10-30T00:00:00Z"
category: Mendelian
synonyms:
- aHUS type 7
- DGKE nephropathy
- DGKE-associated thrombotic microangiopathy
- hemolytic uremic syndrome, atypical, susceptibility to, 7
disease_term:
  preferred_term: DGKE-associated atypical hemolytic uremic syndrome
  term:
    id: MONDO:0100590
    label: hemolytic uremic syndrome, atypical, susceptibility to, 7
description: >-
  An autosomal recessive thrombotic microangiopathy caused by biallelic
  loss-of-function variants in DGKE (diacylglycerol kinase epsilon). Unlike the
  complement-regulator forms of atypical hemolytic uremic syndrome (aHUS), DGKE
  disease is complement-independent: loss of the intracellular lipid kinase that
  terminates arachidonoyl-diacylglycerol signalling leaves protein kinase C
  persistently active in the glomerular endothelium and podocytes, producing a
  prothrombotic microvascular state. It typically presents in the first year of
  life with the aHUS triad of microangiopathic hemolytic anemia, thrombocytopenia
  and acute kidney injury, with persistent hypertension, hematuria and proteinuria,
  and frequently progresses to chronic kidney disease even after the acute
  episodes abate in later childhood.
notes: >-
  Curated as a distinct disorder rather than a has_subtypes row on
  Atypical_Hemolytic_Uremic_Syndrome (MONDO:0016244): that entry is scoped in its
  own description to complement-mediated aHUS and lists only complement
  components/regulators as subtypes, whereas DGKE disease is complement-independent
  and recessive. MONDO files MONDO:0100590 under inherited disease susceptibility
  (its "susceptibility to, 7" label is the aHUS series naming convention), but the
  entity is a recessive monogenic thrombotic microangiopathy. No DGKE-specific
  GeneReviews chapter exists; the gene is covered within the broad "Genetic
  Atypical Hemolytic-Uremic Syndrome" GeneReviews chapter (PMID:20301541), which is
  used here as the phenotype/management baseline.

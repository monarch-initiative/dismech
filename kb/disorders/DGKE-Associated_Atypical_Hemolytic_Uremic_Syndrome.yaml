    evidence_source: MODEL_ORGANISM
    snippet: "loss of Dgke in the endothelium results in impaired signaling downstream of VEGFR2 due to cellular shortage of phosphatidylinositol 4,5-biphosphate"
    explanation: The endothelial Dgke-knockout mouse shows PIP2 shortage as the proximal defect.
  downstream:
  - target: Impaired Endothelial VEGFR2/Akt Signaling
    causal_link_type: DIRECT
    evidence:

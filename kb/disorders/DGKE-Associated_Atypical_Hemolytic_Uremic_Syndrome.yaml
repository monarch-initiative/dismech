- name: Diacylglycerol Accumulation and Sustained PKC Signaling
  biological_scale: MOLECULAR
  description: >-
    Without DGKE, arachidonoyl-diacylglycerol is not cleared, so protein kinase C
    remains persistently activated in the affected cell types.
  biological_processes:
  - preferred_term: protein kinase C signaling

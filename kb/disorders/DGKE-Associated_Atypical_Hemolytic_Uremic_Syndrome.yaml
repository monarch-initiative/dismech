    reference_title: "Recessive mutations in DGKE cause atypical hemolytic-uremic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Arachidonic acid-containing diacylglycerols (DAG) activate protein kinase C (PKC), which promotes thrombosis, and DGKE normally inactivates DAG signaling."
    explanation: Names the DAG/PKC axis this node represents and that DGKE normally terminates it, so its loss sustains PKC signalling.
  - reference: PMID:23542698
    reference_title: "Recessive mutations in DGKE cause atypical hemolytic-uremic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT

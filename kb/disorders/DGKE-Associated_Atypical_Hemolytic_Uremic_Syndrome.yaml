treatments:
- name: Supportive care
  description: >-
    Management is largely supportive — transfusion, management of the acute
    microangiopathic episode, and dialysis for acute kidney injury. Because the
    disease is complement-independent, complement blockade (eculizumab) does not
    reliably benefit these patients, who have relapsed on anti-complement therapy.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301541
    reference_title: "Genetic Atypical Hemolytic-Uremic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Eculizumab therapy may not be beneficial to those with aHUS caused by pathogenic variants in DGKE."
    explanation: GeneReviews notes complement blockade may not benefit DGKE patients, supporting a supportive-care approach.
  - reference: PMID:23542698
    reference_title: "Recessive mutations in DGKE cause atypical hemolytic-uremic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two patients with DGKE mutations had HUS relapses while on anti-complement therapy (eculizumab and fresh frozen plasma infusions, respectively)"
    explanation: Observed relapses on eculizumab support that complement blockade is not reliably effective.
- name: Blood pressure control
  description: >-
    ACE inhibitors or angiotensin receptor antagonists to control blood pressure
    and slow progression of renal disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:20301541
    reference_title: "Genetic Atypical Hemolytic-Uremic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment with ACE inhibitors or angiotensin receptor antagonists helps to control blood pressure and reduce renal disease progression."
    explanation: GeneReviews recommends renin-angiotensin blockade for blood pressure and renal protection.
- name: Kidney transplantation
  description: >-
    Kidney transplantation is an option for end-stage renal disease; unlike the
    complement-regulator forms of aHUS, graft outcomes in DGKE disease are
    favourable and recurrence in the graft has not been observed.
  treatment_term:
    preferred_term: kidney transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  evidence:
  - reference: PMID:20301541
    reference_title: "Genetic Atypical Hemolytic-Uremic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Evidence suggests that kidney graft outcome is favorable in those with CD46 and DGKE pathogenic variants but not in those with C3, CFB, CFH, CFI, or THBD pathogenic variants"
    explanation: GeneReviews reports favourable kidney graft outcome in DGKE disease.
  - reference: PMID:23542698
    reference_title: "Recessive mutations in DGKE cause atypical hemolytic-uremic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it appears that renal transplantation can be efficacious and safe in patients with aHUS due to DGKE mutations"
    explanation: The founding report concludes transplantation can be efficacious and safe in DGKE disease.

  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants abolish diacylglycerol kinase epsilon
    activity. DGKE is an intracellular lipid kinase selective for diacylglycerol
    species bearing an arachidonoyl chain; it is expressed in glomerular
    endothelial cells, platelets and podocytes.

genetic:
- name: DGKE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: DGKE
    term:
      id: hgnc:2852
      label: DGKE
  notes: >-
    Biallelic loss-of-function variants in DGKE (diacylglycerol kinase epsilon)
    cause the disease. DGKE phosphorylates diacylglycerol species containing
    arachidonic acid, terminating diacylglycerol-driven signalling.
  evidence:
  - reference: PMID:23542698
    reference_title: "Recessive mutations in DGKE cause atypical hemolytic-uremic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "that co-segregated with aHUS in nine unrelated kindreds, defining a distinctive Mendelian disease"
    explanation: Recessive DGKE variants co-segregate with aHUS across nine kindreds, establishing causation.
  - reference: PMID:23542698
    reference_title: "Recessive mutations in DGKE cause atypical hemolytic-uremic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DGKE is the first gene implicated in aHUS that is not an integral component of the complement cascade"
    explanation: Distinguishes DGKE disease from the complement-regulator forms of aHUS.
- name: Complement gene modifiers
  relationship_type: MODIFIER
  notes: >-
    A minority of patients with DGKE mutations also carry heterozygous
    complement-gene variants (e.g. C3 or thrombomodulin/THBD). In these combined
    cases complement dysregulation can influence onset and severity, and plasma
    infusion or complement inhibition may help — unlike isolated DGKE disease,
    which is complement-independent.
  evidence:
  - reference: PMID:25135762
    reference_title: "Complement mutations in diacylglycerol kinase-ε-associated atypical hemolytic uremic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients also carried heterozygous mutations in thrombomodulin or C3."
    explanation: In an early-onset aHUS cohort, a subset of DGKE-mutation carriers also carried complement-gene variants acting as modifiers.
pathophysiology:

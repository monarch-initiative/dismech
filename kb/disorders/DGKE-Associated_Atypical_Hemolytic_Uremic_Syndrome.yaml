- name: PI-Cycle Disruption with PIP2 Shortage
  biological_scale: MOLECULAR
  description: >-
    DGKE phosphorylates arachidonoyl-diacylglycerol back toward phosphatidic acid,
    feeding the phosphatidylinositol (PI) cycle that regenerates PIP2. Its loss
    depletes PIP2, disrupting PIP2-dependent signalling in both the glomerular
    endothelium and the podocyte.
  biological_processes:
  - preferred_term: phosphatidylinositol biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006661
      label: phosphatidylinositol biosynthetic process
  evidence:

animal_models:
- name: Endothelial-specific Dgke-knockout mouse
  species: Mouse
  genotype: endothelial-specific Dgke knockout
  publication: PMID:33986189
  description: >-
    Conditional endothelial Dgke deletion reproduces thrombotic microangiopathy and
    proteinuria via impaired VEGFR2/Akt signalling and loss of COX-2/PGE2; a stable
    PGE2 analog reverses both.
  modeled_mechanisms:
  - target: Reduced COX-2 and PGE2 Production
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reproduces the endothelial VEGFR2 to Akt to COX-2 to PGE2 defect.
    limitations: >-
      Mouse endothelial-specific knockout; the human disease is a constitutive
      biallelic germline loss, and the episodic human triggers are not modelled.
    evidence:
    - reference: PMID:33986189
      reference_title: "Loss of diacylglycerol kinase ε causes thrombotic microangiopathy by impairing endothelial VEGFA signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Akt fails to be activated upon VEGFR2 stimulation, resulting in defective induction of the enzyme cyclooxygenase 2 and production of prostaglandin E2 (PGE2)"
      explanation: The model recapitulates the VEGFR2/COX-2/PGE2 defect of this node.
  - target: Glomerular Thrombotic Microangiopathy
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Develops thrombotic microangiopathy and proteinuria, reversed by a stable PGE2 analog.
    limitations: Conditional endothelial knockout rather than the human germline biallelic loss.
    evidence:
    - reference: PMID:33986189
      reference_title: "Loss of diacylglycerol kinase ε causes thrombotic microangiopathy by impairing endothelial VEGFA signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Treating the endothelial specific Dgke-knockout mice with a stable PGE2 analog was sufficient to reverse the clinical manifestations of thrombotic microangiopathy and proteinuria"
      explanation: The model develops, and with a PGE2 analog reverses, TMA and proteinuria.
- name: Global Dgke-knockout mouse
  species: Mouse
  genotype: Dgke null (global knockout)
  publication: PMID:26887830
  description: >-
    Global Dgke-null mice show subclinical glomerular endothelial and basement-membrane
    anomalies that worsen with age and develop capillary occlusion under nephrotoxic
    stress, with impaired glomerular COX-2/PGE2.
  modeled_mechanisms:
  - target: Reduced COX-2 and PGE2 Production
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Impaired glomerular COX-2/PGE2; overt microangiopathy only under nephrotoxic challenge.
    limitations: >-
      Global knockout with no spontaneous thrombotic phenotype; a second insult
      (nephrotoxic serum) is needed to produce glomerular capillary occlusion.
    evidence:
    - reference: PMID:26887830
      reference_title: "Loss of diacylglycerol kinase epsilon in mice causes endothelial distress and impairs glomerular Cox-2 and PGE2 production."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "induction of cyclooxygenase-2 and of the proangiogenic prostaglandin E2 are impaired in Dgke null kidneys"
      explanation: An independent mouse model of the impaired glomerular COX-2/PGE2 node.

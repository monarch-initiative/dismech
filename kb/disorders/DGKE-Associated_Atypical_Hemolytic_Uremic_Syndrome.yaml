treatments:
- name: Supportive care
  description: >-
    Management is largely supportive — transfusion, management of the acute
    microangiopathic episode, and dialysis for acute kidney injury. Because the
    disease is complement-independent, complement blockade (eculizumab) does not
    reliably benefit these patients, who have relapsed on anti-complement therapy.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301541
    reference_title: "Genetic Atypical Hemolytic-Uremic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Eculizumab therapy may not be beneficial to those with aHUS caused by pathogenic variants in DGKE."
    explanation: GeneReviews notes complement blockade may not benefit DGKE patients, supporting a supportive-care approach.
  - reference: PMID:23542698
    reference_title: "Recessive mutations in DGKE cause atypical hemolytic-uremic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two patients with DGKE mutations had HUS relapses while on anti-complement therapy (eculizumab and fresh frozen plasma infusions, respectively)"
    explanation: Observed relapses on eculizumab support that complement blockade is not reliably effective.
  - reference: PMID:32386968
    reference_title: "Long-term outcomes and response to treatment in diacylglycerol kinase epsilon nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we suggest that DGKE-mediated aHUS is eculizumab non-responsive"
    explanation: A UK national cohort concludes DGKE-mediated aHUS is eculizumab non-responsive, supporting supportive management.
- name: Blood pressure control
  description: >-
    ACE inhibitors or angiotensin receptor antagonists to control blood pressure
    and slow progression of renal disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: angiotensin II receptor antagonist
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  evidence:
  - reference: PMID:20301541
    reference_title: "Genetic Atypical Hemolytic-Uremic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment with ACE inhibitors or angiotensin receptor antagonists helps to control blood pressure and reduce renal disease progression."
    explanation: GeneReviews recommends renin-angiotensin blockade for blood pressure and renal protection.
- name: Kidney transplantation
  description: >-
    Kidney transplantation is an option for end-stage renal disease; unlike the
    complement-regulator forms of aHUS, graft outcomes in DGKE disease are
    favourable and recurrence in the graft has not been observed.
  treatment_term:
    preferred_term: kidney transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  evidence:
  - reference: PMID:20301541
    reference_title: "Genetic Atypical Hemolytic-Uremic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Evidence suggests that kidney graft outcome is favorable in those with CD46 and DGKE pathogenic variants but not in those with C3, CFB, CFH, CFI, or THBD pathogenic variants"
    explanation: GeneReviews reports favourable kidney graft outcome in DGKE disease.
  - reference: PMID:23542698
    reference_title: "Recessive mutations in DGKE cause atypical hemolytic-uremic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it appears that renal transplantation can be efficacious and safe in patients with aHUS due to DGKE mutations"
    explanation: The founding report concludes transplantation can be efficacious and safe in DGKE disease.
- name: Plasma infusion (combined-genotype patients)
  description: >-
    Plasma infusion controlled recurrences and prevented renal failure in patients
    carrying a DGKE mutation together with a complement-gene (THBD/C3) variant. It
    is not expected to benefit isolated, complement-independent DGKE disease.
  treatment_term:
    preferred_term: fresh frozen plasma transfusion
    term:
      id: NCIT:C116475
      label: Fresh Frozen Plasma Transfusion
  evidence:
  - reference: PMID:25135762
    reference_title: "Complement mutations in diacylglycerol kinase-ε-associated atypical hemolytic uremic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extensive plasma infusions controlled atypical hemolytic uremic syndrome recurrences and prevented renal failure"
    explanation: Plasma infusion controlled recurrences and prevented renal failure in combined DGKE + complement cases.
- name: Prostaglandin E2 analog (preclinical)
  description: >-
    In the endothelial-specific Dgke-knockout mouse, a stable PGE2 analog reversed
    thrombotic microangiopathy and proteinuria. Preclinical only — not an
    established human therapy — but it directly tests the COX-2/PGE2 mechanism.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prostaglandin E2 analogue
      term:
        id: NCIT:C78568
        label: Prostaglandin Analogue
  target_mechanisms:
  - target: Reduced COX-2 and PGE2 Production
    description: >-
      Supplies the PGE2 the DGKE-deficient endothelium fails to make, restoring the
      antithrombotic, pro-angiogenic state.
    evidence:
    - reference: PMID:33986189
      reference_title: "Loss of diacylglycerol kinase ε causes thrombotic microangiopathy by impairing endothelial VEGFA signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Treating the endothelial specific Dgke-knockout mice with a stable PGE2 analog was sufficient to reverse the clinical manifestations of thrombotic microangiopathy and proteinuria"
      explanation: PGE2-analog rescue reversed TMA and proteinuria in the endothelial Dgke-knockout mouse.
diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: molecular genetic testing for DGKE
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    aHUS gene-panel or exome sequencing identifying biallelic DGKE variants.
    Typically normal serum complement helps distinguish DGKE disease from the
    complement-regulator forms of aHUS.
  notes: >-
    Normal C3 is a useful discriminating finding; DGKE should be screened
    especially in infants with aHUS and nephrotic-range proteinuria.
  evidence:
  - reference: PMID:20301541
    reference_title: "Genetic Atypical Hemolytic-Uremic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The genes associated with genetic aHUS include C3, CD46 (MCP), CFB, CFH, CFHR1, CFHR3, CFHR4, CFHR5, CFI, DGKE, THBD, and VTN."
    explanation: GeneReviews lists DGKE among the genes covered by a genetic aHUS panel.
  - reference: PMID:37994143
    reference_title: "[Genetic analysis of a child with atypical Hemolytic uremic syndrome and nephrotic-range proteinuria]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For infants and young children with aHUS in conjunct with nephrotic level proteinuria, variants of the DGKE gene should be screened"
    explanation: Defines the clinical signature that should prompt DGKE screening.
  - reference: PMID:37994143
    reference_title: "[Genetic analysis of a child with atypical Hemolytic uremic syndrome and nephrotic-range proteinuria]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypercholesterolemia but normal complement levels"
    explanation: Normal complement levels are the discriminating laboratory finding.

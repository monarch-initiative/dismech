      reference_title: "Loss of diacylglycerol kinase ε causes thrombotic microangiopathy by impairing endothelial VEGFA signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Akt fails to be activated upon VEGFR2 stimulation, resulting in defective induction of the enzyme cyclooxygenase 2 and production of prostaglandin E2 (PGE2)"
      explanation: PIP2 shortage leaves Akt unactivated downstream of VEGFR2.
  - target: Podocyte Injury
    causal_link_type: DIRECT

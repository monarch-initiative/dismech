    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All four presented between 4 and 8 months of age with microangiopathic hemolytic anemia, thrombocytopenia and acute renal failure"
    explanation: Microangiopathic hemolytic anemia is a presenting feature.

name: Ichthyosis Vulgaris
creation_date: "2026-09-30T19:45:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal dominant ichthyosis vulgaris
  term:
    id: MONDO:0007810
    label: autosomal dominant ichthyosis vulgaris
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0007810
      label: autosomal dominant ichthyosis vulgaris
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      Primary MONDO identifier for this entry: the FLG-caused, inherited form of
      ichthyosis vulgaris.
  - term:
      id: MONDO:0024304
      label: ichthyosis vulgaris
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0024304 is the broader clinical class, which also covers acquired
      ichthyosis vulgaris. This entry is scoped to the inherited FLG form, so the
      broader class is recorded as a cross-reference rather than as the entry's
      identity.
description: >-
  Ichthyosis vulgaris is the most common inherited disorder of keratinization,
  caused by loss-of-function variants in FLG, which encodes profilaggrin, the
  main protein of epidermal keratohyalin granules. Inheritance is semidominant:
  homozygous or compound heterozygous carriers of FLG null alleles have
  moderate to severe disease with near-complete loss of filaggrin, whereas
  heterozygous carriers have a mild phenotype with incomplete penetrance. Loss
  of filaggrin reduces keratohyalin granules, disturbs corneocyte and lamellar
  lipid formation, and removes the filaggrin-derived amino acids that make up
  much of the stratum corneum natural moisturizing factor, producing a
  gene-dose-dependent permeability barrier defect with reduced hydration and
  increased transepidermal water loss. Clinically this appears as xerosis and
  fine scaling on the extensor surfaces of the limbs with flexural sparing,
  keratosis pilaris and palmar and plantar hyperlinearity; symptoms worsen in
  cold, dry weather and improve in summer and with age. The same barrier defect
  permits percutaneous allergen penetration and type 2 sensitization, so
  ichthyosis vulgaris is strongly associated with atopic dermatitis, asthma
  occurring with eczema, allergic rhinitis and peanut allergy. FLG null alleles
  are common in European and Asian populations and rarer in darkly pigmented
  populations. Treatment is symptomatic, with regular emollients and urea- or
  lactate-containing keratolytic moisturizers.
synonyms:
- ichthyosis vulgaris
- ichthyosis simplex
- dominant ichthyosis vulgaris
- ichthyosis vulgaris, autosomal dominant
- filaggrin-related ichthyosis vulgaris
parents:
- Inherited Ichthyosis
notes: >-
  Bound to MONDO:0007810 (autosomal dominant ichthyosis vulgaris), the heritable
  FLG-related form. Its MONDO parent MONDO:0024304 (ichthyosis vulgaris) is
  defined to include acquired ichthyosis vulgaris, a phenotype secondary to
  malignancy, drugs or systemic disease that this entry does not model. The
  MONDO label says autosomal dominant because the disorder was classified that
  way before FLG was identified; the genotype-phenotype data show semidominant
  inheritance, which is how the inheritance block records it. There is no
  GeneReviews chapter for ichthyosis vulgaris (Bookshelf index snapshot
  2026-09-10 plus a live PubMed title search); the only Bookshelf chapter is
  the StatPearls review "Hereditary and Acquired Ichthyosis Vulgaris"
  (PMID:32965989), which is not a phenotype baseline.
has_subtypes:
- name: Mild IV
  display_name: Mild ichthyosis vulgaris (heterozygous FLG)
  subtype_term:
    preferred_term: mild ichthyosis vulgaris
    term:
      id: MONDO:0100474
      label: mild ichthyosis vulgaris
  genes:
  - preferred_term: FLG
    term:
      id: hgnc:3748
      label: FLG
  description: >-
    Heterozygous carriers of a single FLG null allele. The phenotype is mild and
    incompletely penetrant, most readily recognized by palmar hyperlinearity,
    with fine scaling or keratosis pilaris in some carriers and dry skin that
    worsens in cold, dry climates. Some heterozygotes nonetheless show a
    pronounced scaling phenotype, which points to modifiers.
  evidence:
  - reference: PMID:16444271
    reference_title: "Loss-of-function mutations in the gene encoding filaggrin cause ichthyosis vulgaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these mutations are semidominant; heterozygotes show a very mild phenotype with incomplete penetrance"
    explanation: Defines the heterozygous, mild and incompletely penetrant stratum.
  - reference: PMID:16810297
    reference_title: "Prevalent and rare mutations in the gene encoding filaggrin cause ichthyosis vulgaris and predispose individuals to atopic dermatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "heterozygotes have an intermediate phenotype most readily identified by palmar hyperlinearity and in some cases fine-scale and/or keratosis pilaris"
    explanation: Describes the features that identify heterozygous carriers.
  - reference: PMID:17164798
    reference_title: "Filaggrin mutations p.R501X and c.2282del4 in ichthyosis vulgaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this group of patients not only homozygous and compound heterozygous, but also heterozygous patients for p.R501X and c.2282del4 display a pronounced phenotype"
    explanation: Shows that heterozygous expression is variable and can be marked, so the mild stratum is a tendency rather than a rule.
- name: Severe IV
  display_name: Severe ichthyosis vulgaris (biallelic FLG)
  subtype_term:
    preferred_term: severe ichthyosis vulgaris
    term:
      id: MONDO:0100475
      label: severe ichthyosis vulgaris
  genes:
  - preferred_term: FLG
    term:
      id: hgnc:3748
      label: FLG
  description: >-
    Homozygous or compound heterozygous carriers of FLG null alleles. Filaggrin
    is essentially absent from the epidermis, and the phenotype is a stable,
    chronic, more marked ichthyosis with obvious scaling and hyperlinearity.
    Only this stratum shows significant changes in transepidermal water loss
    and skin hydration in vivo.
  evidence:
  - reference: PMID:16444271
    reference_title: "Loss-of-function mutations in the gene encoding filaggrin cause ichthyosis vulgaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified homozygous or compound heterozygous mutations R501X and 2282del4 in the gene encoding filaggrin (FLG) as the cause of moderate or severe ichthyosis vulgaris in 15 kindreds."
    explanation: Defines the biallelic stratum as the cause of moderate or severe disease.
  - reference: PMID:27519469
    reference_title: "Compound heterozygotes for filaggrin gene mutations do not always show severe atopic dermatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was found that five of the six patients had severe IV, and the remaining patient showed moderate IV."
    explanation: Biallelic FLG null carriers had severe or moderate ichthyosis vulgaris.
  - reference: PMID:23297869
    reference_title: "Complete filaggrin deficiency in ichthyosis vulgaris is associated with only moderate changes in epidermal permeability barrier function profile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A complete, but not a partial deficiency is associated with moderate changes in TEWL and skin hydration"
    explanation: Barrier function measurably changes only with biallelic (complete) filaggrin deficiency.

inheritance:
- name: Semidominant inheritance
  inheritance_term:
    preferred_term: Semidominant inheritance
    term:
      id: HP:0032113
      label: Semidominant inheritance
  penetrance: INCOMPLETE
  description: >-
    FLG null alleles act in a gene-dose-dependent way: biallelic carriers have
    moderate to severe ichthyosis vulgaris with essentially complete
    penetrance, while heterozygous carriers have a mild, incompletely penetrant
    phenotype. Before FLG was identified the disorder was classified as
    autosomal dominant, which is the origin of the MONDO label.
  evidence:
  - reference: PMID:16444271
    reference_title: "Loss-of-function mutations in the gene encoding filaggrin cause ichthyosis vulgaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these mutations are semidominant; heterozygotes show a very mild phenotype with incomplete penetrance"
    explanation: Establishes semidominant inheritance with incomplete heterozygote penetrance.
  - reference: PMID:17164798
    reference_title: "Filaggrin mutations p.R501X and c.2282del4 in ichthyosis vulgaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygotes and compound heterozygotes were severely affected whereas heterozygotes showed mild disease or were asymptomatic, suggesting semidominant inheritance with incomplete penetrance in heterozygotes."
    explanation: Independent Austrian cohort restating the semidominant model.
  - reference: PMID:2579164
    reference_title: "Ichthyosis vulgaris: identification of a defect in synthesis of filaggrin correlated with an absence of keratohyaline granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Ichthyosis vulgaris is an autosomal dominant disorder of keratinization characterized histologically by absent or reduced keratohyaline granules in the epidermis and mild hyperkeratosis."
    explanation: Records the pre-molecular autosomal dominant classification behind the MONDO label.

prevalence:
- population: English schoolchildren
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 400.0
  notes: >-
    1 in 250 from a survey of 6,051 healthy English schoolchildren. The source
    calls the figure an incidence; it is a cross-sectional survey count, so it
    is recorded here as point prevalence.
  evidence:
  - reference: PMID:16444271
    reference_title: "Loss-of-function mutations in the gene encoding filaggrin cause ichthyosis vulgaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The most widely cited incidence figure is 1 in 250 based on a survey of 6,051 healthy English schoolchildren."
    explanation: Source of the commonly cited 1 in 250 figure.
- population: Europeans (FLG null-allele carriers)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 7700.0
  rate_low: 2700.0
  rate_high: 14200.0
  notes: >-
    Median 7.7% (range 2.7 to 14.2%) of Europeans carry an FLG loss-of-function
    variant, pooled across published population studies. Carriers are at risk of
    the mild, heterozygous form.
  evidence:
  - reference: PMID:23301728
    reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, the median prevalence of FLG mutations among Europeans and Asians was 7·7% (range 2·7–14·2) and 3·0% (range 0–7·3), respectively."
    explanation: Pooled review estimate of European FLG null-allele carrier frequency.
- population: Asians (FLG null-allele carriers)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3000.0
  rate_low: 0.0
  rate_high: 7300.0
  notes: >-
    Median 3.0% (range 0 to 7.3%). The mutation spectrum differs from that of
    Europeans, so screening panels built on European alleles undercount Asian
    carriers.
  evidence:
  - reference: PMID:23301728
    reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, the median prevalence of FLG mutations among Europeans and Asians was 7·7% (range 2·7–14·2) and 3·0% (range 0–7·3), respectively."
    explanation: Pooled review estimate of Asian FLG null-allele carrier frequency.
  - reference: PMID:19958351
    reference_title: "FLG mutations in ichthyosis vulgaris and atopic eczema: spectrum of mutations and population genetics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Notably, the same FLG mutations identified in the European population were rarely found in Asians."
    explanation: Population-specific mutation spectra explain why European panels miss Asian alleles.

clinical_burden:
  burden_level: LOW
  rationale: >-
    Ichthyosis vulgaris is chronic and lifelong but does not shorten life, and
    most patients improve with age. The burden is xerosis, scaling and itch,
    with cosmetic discomfort and psychosocial impairment, plus the associated
    atopic disease; it is greater in biallelic carriers and in patients with
    atopic dermatitis.
  evidence:
  - reference: PMID:35663767
    reference_title: "Effect of topical treatment with 7.5% urea in Ichthyosis Vulgaris: A randomized, controlled, double blinded, split body study evaluating the effect of urea cream compared to the vehicle (moisturizing) cream."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The characteristic clinical features of IV are xerosis, scaling, and itching, often accompanied by cosmetic discomfort and consequent psychosocial impairment."
    explanation: States the cosmetic and psychosocial burden that accompanies the skin features.
  - reference: PMID:36751330
    reference_title: "Ichthyosis vulgaris: An updated review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The prognosis for inherited cases has proven to be good among majority of patients, leading to a normal lifespan and an improvement in the disease with age."
    explanation: Normal lifespan and improvement with age support a low overall burden level.

progression:
- phase: Onset in infancy and lifelong course
  age_range: first year of life onward
  notes: >-
    Features usually appear in the first year of life and are recognizable by
    about age 5. The disease worsens in winter and low humidity, improves in
    summer and humid climates, and tends to improve with age; lifespan is
    normal.
  evidence:
  - reference: PMID:32115871
    reference_title: "Ichthyoses in everyday practice: management of a rare group of diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A distinction is made between common hereditary ichthyoses (ichthyosis vulgaris and X-linked ichthyosis), which usually manifest themselves in the first year of life"
    explanation: Review statement on onset in the first year of life.
  - reference: PMID:36751330
    reference_title: "Ichthyosis vulgaris: An updated review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It typically presents in infancy as xerosis, skin lesions, keratosis pilaris, palmoplantar hyper linearity, scaly dermatosis, and erythroderma, clearly identifiable by age 5."
    explanation: Review statement on age of onset.
  - reference: PMID:36751330
    reference_title: "Ichthyosis vulgaris: An updated review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There are no notable significances in sex or ethnicities and the disease is observed to improve with age."
    explanation: Review statement that the disease improves with age.

pathophysiology:
- name: FLG Loss-of-Function Variants
  conforms_to: "epidermal_cornification_failure#Cornification Program Component Deficiency"
  biological_scale: MOLECULAR
  description: >-
    Germline nonsense and frameshift variants in FLG, most commonly R501X and
    2282del4 in Europeans and population-specific alleles in Asia, truncate
    profilaggrin. Because the C-terminal region is required for processing,
    truncations anywhere in the repeat array abolish or sharply reduce
    filaggrin production, and with it the keratin filament binding of the
    filaggrin monomers. How much the clinical phenotype depends on lost keratin
    aggregation, as opposed to lost natural moisturizing factor, is debated: a
    filaggrin knockdown skin model showed no keratin extraction defect
    (PMID:20445547).
  genes:
  - preferred_term: FLG
    term:
      id: hgnc:3748
      label: FLG
  molecular_functions:
  - preferred_term: keratin filament binding
    term:
      id: GO:1990254
      label: keratin filament binding
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Nonsense and frameshift null alleles; heterozygous (mild) or homozygous /
      compound heterozygous (moderate to severe).
  evidence:
  - reference: PMID:16444271
    reference_title: "Loss-of-function mutations in the gene encoding filaggrin cause ichthyosis vulgaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified homozygous or compound heterozygous mutations R501X and 2282del4 in the gene encoding filaggrin (FLG) as the cause of moderate or severe ichthyosis vulgaris in 15 kindreds."
    explanation: Identifies FLG null variants as the cause of ichthyosis vulgaris.
  - reference: PMID:17417636
    reference_title: "Comprehensive analysis of the gene encoding filaggrin uncovers prevalent and rare mutations in ichthyosis vulgaris and atopic eczema."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the variants are either nonsense or frameshift mutations that, in representative cases, resulted in loss of filaggrin production in the epidermis."
    explanation: The allelic series is uniformly null and removes epidermal filaggrin.
  - reference: PMID:27667308
    reference_title: "Filaggrin failure - from ichthyosis vulgaris to atopic eczema and beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "profilaggrin is rapidly cleaved into multiple copies of the 37 kDa filaggrin monomer, which binds to and condenses the keratin cytoskeleton, thereby facilitating cellular compression"
    explanation: Review statement that the filaggrin monomer binds keratin filaments, the molecular function lost when FLG null alleles abolish filaggrin.
  - reference: PMID:16444271
    reference_title: "Loss-of-function mutations in the gene encoding filaggrin cause ichthyosis vulgaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During terminal differentiation, it is cleaved into multiple filaggrin peptides that aggregate keratin filaments."
    explanation: The paper identifying FLG null alleles in ichthyosis vulgaris names keratin filament aggregation as the function of the lost filaggrin peptides.
  downstream:
  - target: Profilaggrin and Filaggrin Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19958351
      reference_title: "FLG mutations in ichthyosis vulgaris and atopic eczema: spectrum of mutations and population genetics."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Mutations at any site within FLG, even mutations in C-terminal imperfect filaggrin repeats, cause significant reductions in amounts of profilaggrin/filaggrin peptide in patient epidermis as the C-terminal region is essential for proper processing of profilaggrin into filaggrin."
      explanation: Links FLG truncations to reduced profilaggrin/filaggrin protein in patient epidermis.

- name: Profilaggrin and Filaggrin Deficiency
  biological_scale: MOLECULAR
  description: >-
    Profilaggrin is normally stored in keratohyalin granules of the granular
    layer and cleaved during terminal differentiation into filaggrin monomers
    that aggregate keratin filaments and are later degraded into natural
    moisturizing factor. In ichthyosis vulgaris profilaggrin and filaggrin are
    reduced or absent, in proportion to clinical severity.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: keratinocyte differentiation
    term:
      id: GO:0030216
      label: keratinocyte differentiation
    modifier: DECREASED
  locations:
  - preferred_term: stratum granulosum of epidermis
    term:
      id: UBERON:0002069
      label: stratum granulosum of epidermis
  evidence:
  - reference: PMID:2579164
    reference_title: "Ichthyosis vulgaris: identification of a defect in synthesis of filaggrin correlated with an absence of keratohyaline granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was absent from the more severely affected individuals in each family and reduced in intensity in the less severely affected family members."
    explanation: Filaggrin loss in patient epidermis tracks clinical severity.
  - reference: PMID:23290076
    reference_title: "Analyses of FLG mutation frequency and filaggrin expression in isolated ichthyosis vulgaris (IV) and atopic dermatitis-associated IV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemical staining revealed that profilaggrin/filaggrin peptides were remarkably reduced in the epidermis of all the patients."
    explanation: Confirms reduced epidermal profilaggrin/filaggrin in patients.
  downstream:
  - target: Reduced Keratohyalin Granules and Defective Corneocyte Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:2579164
      reference_title: "Ichthyosis vulgaris: identification of a defect in synthesis of filaggrin correlated with an absence of keratohyaline granules."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This biochemical abnormality correlates with the morphologic reduction in the amount of keratohyalin, and with the clinical severity of the disorder."
      explanation: Links filaggrin loss to the loss of keratohyalin granules.
    - reference: PMID:20445547
      reference_title: "Knockdown of filaggrin impairs diffusion barrier function and increases UV sensitivity in a human skin model."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Electron microscopy revealed that keratohyalin granules were reduced in number and size and lamellar body formation was disturbed."
      explanation: Experimental knockdown in a human skin model reproduces the granule and lamellar body defects, showing they follow from filaggrin loss.
  - target: Reduced Natural Moisturizing Factor
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33462753
      reference_title: "Skin barrier dysfunction and filaggrin."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Filaggrin is degraded by caspase-14, calpain 1, and bleomycin hydrolases into amino acids and amino acid metabolites such as trans-urocanic acid and pyrrolidone carboxylic acid, which are pivotal natural moisturizing factors in the SC."
      explanation: Filaggrin is the precursor of the natural moisturizing factor, so its loss removes that pool.
  - target: Keratosis pilaris
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Keratosis pilaris frequency follows FLG genotype in a dose-dependent way,
      but FLG mutations explain only part of keratosis pilaris and the lesional
      mechanism is not settled.
    evidence:
    - reference: PMID:23301728
      reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Keratosis pilaris was noted in 100%, 66% and 30%, respectively, of homozygous, heterozygous and wild-type juvenile FLG mutation carriers."
      explanation: Gene-dose relationship between filaggrin loss and keratosis pilaris.
  - target: Palmar hyperlinearity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Palmar hyperlinearity is the sign that most reliably identifies FLG
      heterozygotes; how filaggrin loss produces exaggerated palmar markings is
      not established.
    evidence:
    - reference: PMID:16810297
      reference_title: "Prevalent and rare mutations in the gene encoding filaggrin cause ichthyosis vulgaris and predispose individuals to atopic dermatitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "heterozygotes have an intermediate phenotype most readily identified by palmar hyperlinearity"
      explanation: Hyperlinearity tracks even single-allele filaggrin loss.

- name: Reduced Keratohyalin Granules and Defective Corneocyte Formation
  conforms_to: "epidermal_cornification_failure#Defective Cornified Envelope Assembly and Lamellar Lipid Delivery"
  biological_scale: CELLULAR
  description: >-
    Keratohyalin granules are reduced or absent. Filaggrin-deficient granular
    cells show perinuclear retraction of keratin filaments, impaired loading of
    lamellar bodies, nonuniform extracellular deposition of their contents and
    abnormal lamellar bilayers, with fewer corneodesmosomes and reduced tight
    junction proteins.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: corneocyte
    term:
      id: CL:0002153
      label: corneocyte
  biological_processes:
  - preferred_term: cornified envelope assembly
    term:
      id: GO:1903575
      label: cornified envelope assembly
    modifier: DECREASED
  - preferred_term: intermediate filament organization
    term:
      id: GO:0045109
      label: intermediate filament organization
    modifier: DECREASED
  locations:
  - preferred_term: stratum granulosum of epidermis
    term:
      id: UBERON:0002069
      label: stratum granulosum of epidermis
  evidence:
  - reference: PMID:21514438
    reference_title: "Filaggrin genotype in ichthyosis vulgaris predicts abnormalities in epidermal structure and function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormal barrier function correlated with alterations in keratin filament organization (perinuclear retraction), impaired loading of lamellar body contents, followed by nonuniform extracellular distribution of secreted organelle contents, and abnormalities in lamellar bilayer architecture."
    explanation: Ultrastructural defects in FLG-mutant ichthyosis vulgaris epidermis.
  - reference: PMID:21514438
    reference_title: "Filaggrin genotype in ichthyosis vulgaris predicts abnormalities in epidermal structure and function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, we observed reductions in corneodesmosome density and tight junction protein expression."
    explanation: Adhesion structures are also reduced in filaggrin-deficient epidermis.
  downstream:
  - target: Stratum Corneum Permeability Barrier Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21514438
      reference_title: "Filaggrin genotype in ichthyosis vulgaris predicts abnormalities in epidermal structure and function."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thus, FLG deficiency provokes alterations in keratinocyte architecture that influence epidermal functions localizing to the extracellular matrix."
      explanation: The cellular architecture defects are the route by which filaggrin loss impairs the barrier.

- name: Reduced Natural Moisturizing Factor
  biological_scale: MOLECULAR
  description: >-
    Filaggrin is degraded in the stratum corneum by caspase-14, calpain 1 and
    bleomycin hydrolase to hygroscopic amino acids and their derivatives,
    including trans-urocanic acid and pyrrolidone carboxylic acid, that act as
    the natural moisturizing factor. Their deficiency reduces stratum corneum
    hydration in a gene-dose-dependent way and removes the main epidermal
    UV-B-absorbing chromophore.
  locations:
  - preferred_term: stratum corneum of epidermis
    term:
      id: UBERON:0002027
      label: stratum corneum of epidermis
  evidence:
  - reference: PMID:23301728
    reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The inherent reduction of filaggrin metabolites seen in patients with IV reduce the levels of NMFs, causing not only a gene dose-dependent reduction in skin hydration, but also an elevated skin surface pH, and increased transepidermal water loss (TEWL), which are all features of the xerotic skin in IV."
    explanation: Review synthesis of the filaggrin to NMF deficit in ichthyosis vulgaris.
  - reference: PMID:20445547
    reference_title: "Knockdown of filaggrin impairs diffusion barrier function and increases UV sensitivity in a human skin model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, lack of filaggrin led to a reduction in the concentration of urocanic acid, and sensitized the organotypic skin to UVB-induced apoptosis."
    explanation: Experimental filaggrin knockdown lowers urocanic acid, a filaggrin-derived NMF component.
  downstream:
  - target: Reduced Stratum Corneum Hydration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23301728
      reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The inherent reduction of filaggrin metabolites seen in patients with IV reduce the levels of NMFs, causing not only a gene dose-dependent reduction in skin hydration, but also an elevated skin surface pH, and increased transepidermal water loss (TEWL), which are all features of the xerotic skin in IV."
      explanation: States the causal step from NMF loss to reduced hydration and raised pH.

- name: Reduced Stratum Corneum Hydration
  biological_scale: TISSUE
  description: >-
    Stratum corneum water content falls and skin surface pH may rise. In vivo
    the change is moderate and statistically significant only in biallelic
    carriers; in a cohort of 15 patients skin-surface pH did not differ
    significantly from controls. Low ambient humidity is proposed to accelerate
    breakdown of residual filaggrin and aggravate the deficit.
  locations:
  - preferred_term: stratum corneum of epidermis
    term:
      id: UBERON:0002027
      label: stratum corneum of epidermis
  evidence:
  - reference: PMID:23297869
    reference_title: "Complete filaggrin deficiency in ichthyosis vulgaris is associated with only moderate changes in epidermal permeability barrier function profile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a moderate decrease of skin hydration from 29.20 ± 1.96 to 20.17 ± 3.60 (P < 0.05) in comparison with the control group were observed"
    explanation: Measured hydration decrease in biallelic FLG ichthyosis vulgaris.
  - reference: PMID:23297869
    reference_title: "Complete filaggrin deficiency in ichthyosis vulgaris is associated with only moderate changes in epidermal permeability barrier function profile."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Changes in skin surface pH were not significant."
    explanation: In this cohort skin-surface pH was not significantly raised, which qualifies the pH component of the claim.
  downstream:
  - target: Dry skin
    causal_link_type: DIRECT
  - target: Stratum Corneum Permeability Barrier Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22164253
      reference_title: "Filaggrin genotype determines functional and molecular alterations in skin of patients with atopic dermatitis and ichthyosis vulgaris."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Disease severity, TEWL and pH follow FLG deficiency in the skin; and the number of altered genes and pathways are correlated to FLG mRNA expression."
      explanation: Barrier readouts track filaggrin deficiency in patients with ichthyosis vulgaris and atopic dermatitis.

- name: Stratum Corneum Permeability Barrier Failure
  conforms_to: "epidermal_cornification_failure#Stratum Corneum Permeability Barrier Failure"
  biological_scale: TISSUE
  description: >-
    The permeability barrier becomes leaky in proportion to FLG gene dose, via a
    paracellular route through abnormal extracellular lamellae, with increased
    transepidermal water loss. The in vivo defect is moderate and significant
    in biallelic carriers.
  cell_types:
  - preferred_term: corneocyte
    term:
      id: CL:0002153
      label: corneocyte
  biological_processes:
  - preferred_term: establishment of skin barrier
    term:
      id: GO:0061436
      label: establishment of skin barrier
    modifier: DECREASED
  locations:
  - preferred_term: stratum corneum of epidermis
    term:
      id: UBERON:0002027
      label: stratum corneum of epidermis
  evidence:
  - reference: PMID:21514438
    reference_title: "Filaggrin genotype in ichthyosis vulgaris predicts abnormalities in epidermal structure and function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here that the presence of FLG mutations in Caucasians predicts dose-dependent alterations in epidermal permeability barrier function."
    explanation: Gene-dose-dependent barrier impairment in ichthyosis vulgaris.
  - reference: PMID:21514438
    reference_title: "Filaggrin genotype in ichthyosis vulgaris predicts abnormalities in epidermal structure and function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although FLG is an intracellular protein, the barrier abnormality occurred solely via a paracellular route in affected stratum corneum."
    explanation: Locates the barrier leak to the paracellular pathway.
  - reference: PMID:23297869
    reference_title: "Complete filaggrin deficiency in ichthyosis vulgaris is associated with only moderate changes in epidermal permeability barrier function profile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In FLG(-/-) subjects, a moderate increase of TEWL from 5.41 ± 0.32-7.54 ± 0.90 g/m(2) h (P < 0.03)"
    explanation: Measured increase in transepidermal water loss in biallelic carriers.
  downstream:
  - target: Retention Hyperkeratosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      By analogy with the other ichthyoses covered by the cornification module,
      the barrier defect is followed by a thickened, retained stratum corneum;
      a direct experimental link in ichthyosis vulgaris is not established.
  - target: Pruritus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Itch accompanies the barrier defect; the sensory mechanism linking the
      two in ichthyosis vulgaris is not described in the cited sources.
    evidence:
    - reference: PMID:36751330
      reference_title: "Ichthyosis vulgaris: An updated review."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Pruritus, allergic rhinoconjunctivitis, hypohidrosis, heat intolerance, and recurrent infections due to a disturbed skin barrier are other common occurrences."
      explanation: Review attributes pruritus in ichthyosis vulgaris to the disturbed skin barrier.
  - target: Increased Percutaneous Allergen and Irritant Penetration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19349982
      reference_title: "A homozygous frameshift mutation in the mouse Flg gene facilitates enhanced percutaneous allergen priming."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "provide experimental evidence for the hypothesis that antigen transfer through a defective epidermal barrier is a key mechanism underlying elevated IgE sensitization"
      explanation: Flg-mutant mice show antigen transfer across the defective barrier.

- name: Retention Hyperkeratosis
  conforms_to: "epidermal_cornification_failure#Compensatory Epidermal Hyperproliferation and Retention Hyperkeratosis"
  biological_scale: TISSUE
  description: >-
    The stratum corneum is thickened with mild orthokeratotic hyperkeratosis
    over a reduced or absent granular layer; this retained stratum corneum is
    the fine scale seen clinically. The Flg-mutant flaky tail mouse shows the
    same orthokeratotic hyperkeratosis with granular-layer attenuation.
  biological_processes:
  - preferred_term: keratinization
    term:
      id: GO:0031424
      label: keratinization
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  evidence:
  - reference: PMID:2579164
    reference_title: "Ichthyosis vulgaris: identification of a defect in synthesis of filaggrin correlated with an absence of keratohyaline granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The stratum corneum was thicker than in normals"
    explanation: Thickened stratum corneum in patient skin.
  - reference: PMID:11121144
    reference_title: "Loss of normal profilaggrin and filaggrin in flaky tail (ft/ft) mice: an animal model for the filaggrin-deficient skin disease ichthyosis vulgaris."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Affected homozygous ft/ft mice exhibit large, disorganized scales on tail and paw skin, marked attenuation of the epidermal granular layer, mild acanthosis, and orthokeratotic hyperkeratosis."
    explanation: The filaggrin-deficient mouse reproduces orthokeratotic hyperkeratosis and scaling.
  downstream:
  - target: Fine scaling of the skin
    causal_link_type: DIRECT

- name: Increased Percutaneous Allergen and Irritant Penetration
  conforms_to: "epithelial_barrier_dysfunction#Increased Transepithelial Allergen Penetration and Innate Immune Activation"
  biological_scale: TISSUE
  description: >-
    Allergens, haptens and irritants cross filaggrin-deficient skin more
    readily, which predisposes carriers to atopic dermatitis, hand eczema,
    irritant contact dermatitis and contact sensitization, the latter mainly
    in carriers who already have dermatitis.
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  evidence:
  - reference: PMID:23301728
    reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mechanistic studies have shown increased penetration of allergens and chemicals in filaggrin-deficient skin"
    explanation: Review synthesis of increased allergen and chemical penetration.
  - reference: PMID:19349982
    reference_title: "A homozygous frameshift mutation in the mouse Flg gene facilitates enhanced percutaneous allergen priming."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate that topical application of allergen to mice homozygous for this mutation results in cutaneous inflammatory infiltrates and enhanced cutaneous allergen priming with development of allergen-specific antibody responses."
    explanation: Experimental percutaneous allergen priming in Flg-mutant mice.
  downstream:
  - target: Type 2 Allergic Sensitization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19349982
      reference_title: "A homozygous frameshift mutation in the mouse Flg gene facilitates enhanced percutaneous allergen priming."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In marked contrast, percutaneous allergen exposure in ft/ft mice generated OVA-specific IgG and OVA-specific IgE"
      explanation: Percutaneous exposure through the Flg-deficient barrier produces allergen-specific IgE.
  - target: Contact dermatitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23343419
      reference_title: "Filaggrin mutations are strongly associated with contact sensitization in individuals with dermatitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "FLG mutation carriers with self-reported dermatitis have an increased risk of contact sensitization to substances other than nickel, whereas FLG mutations alone may not, or may only slightly, increase the risk of sensitization."
      explanation: Contact sensitization risk in FLG carriers depends on coexisting dermatitis, consistent with penetration through inflamed, filaggrin-depleted skin.

- name: Type 2 Allergic Sensitization
  conforms_to: "epithelial_barrier_dysfunction#Type 2 Sensitization and IgE Class Switch"
  biological_scale: ORGANISM
  description: >-
    Allergen priming through the skin generates allergen-specific IgE, the
    shared step behind the atopic comorbidities of ichthyosis vulgaris. In the
    mouse model the response is mixed Th1/Th2.
  biological_processes:
  - preferred_term: type 2 immune response
    term:
      id: GO:0042092
      label: type 2 immune response
    modifier: INCREASED
  - preferred_term: isotype switching to IgE isotypes
    term:
      id: GO:0048289
      label: isotype switching to IgE isotypes
    modifier: INCREASED
  evidence:
  - reference: PMID:19349982
    reference_title: "A homozygous frameshift mutation in the mouse Flg gene facilitates enhanced percutaneous allergen priming."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In marked contrast, percutaneous allergen exposure in ft/ft mice generated OVA-specific IgG and OVA-specific IgE"

  - reference: PMID:21377035
    reference_title: "Loss-of-function variants in the filaggrin gene are a significant risk factor for peanut allergy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Filaggrin mutations represent a significant risk factor for IgE-mediated peanut allergy, indicating a role for epithelial barrier dysfunction in the pathogenesis of this disease."
    explanation: Human IgE-mediated sensitization associated with FLG null alleles.
  downstream:
  - target: Atopic dermatitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Asthma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Allergic rhinitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Peanut allergy
    causal_link_type: DIRECT

phenotypes:
- name: Dry skin
  category: Dermatologic
  description: >-
    Xerosis, intermittent or persistent, more severe in winter and in dry
    climates.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Xerosis
    term:
      id: HP:0000958
      label: Dry skin
    temporality: CHRONIC
  evidence:
  - reference: PMID:23301728
    reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ichthyosis vulgaris is caused by loss-of-function mutations in the filaggrin gene (FLG) and is characterized clinically by xerosis, scaling, keratosis pilaris, palmar and plantar hyperlinearity, and a strong association with atopic disorders."
    explanation: Xerosis is a defining clinical feature.
  - reference: PMID:29050444
    reference_title: "Treatment of ichthyosis vulgaris with a urea-based emulsion: videodermatoscopy and confocal microscopy evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ichthyosis vulgaris is a common disorder of keratinization caused by mutations in the filaggrin gene and clinically characterized by variable degree of xerosis."
    explanation: Xerosis is the core clinical sign, of variable degree.
- name: Fine scaling of the skin
  category: Dermatologic
  description: >-
    Fine, powdery and sometimes coarse polygonal scale on the extensor surfaces
    of the limbs (lower legs especially in adults), scalp, central face and
    trunk, with sparing of the more hydrated axillae and antecubital and
    popliteal fossae.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Fine scaling of the skin
    term:
      id: HP:0040189
      label: Scaling skin
  evidence:
  - reference: PMID:23301728
    reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Individuals intermittently or persistently suffer from xerosis, which manifests itself as fine (powdery) and sometimes even coarse (polygonal) scaling of the extensor surfaces of the extremities, the scalp, central part of the face and the trunk"
    explanation: Describes the scale type and distribution.
  - reference: PMID:23301728
    reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The extensor surfaces of the lower limbs are more often affected in adults than in children,58 while the more hydrated axillae, antecubital and popliteal fossae are rarely involved."
    explanation: Flexural sparing and lower-limb predominance in adults.
  - reference: PMID:16810297
    reference_title: "Prevalent and rare mutations in the gene encoding filaggrin cause ichthyosis vulgaris and predispose individuals to atopic dermatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main characteristics of IV are fine-scale on the arms and legs, palmar hyperlinearity, and keratosis pilaris."
    explanation: Fine scale on the limbs is a main characteristic.
- name: Keratosis pilaris
  category: Dermatologic
  description: >-
    Keratotic papules at follicular orifices. Frequency follows FLG gene dose;
    FLG mutations account for only a minority of keratosis pilaris overall.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Keratosis pilaris
    term:
      id: HP:0032152
      label: Keratosis pilaris
  evidence:
  - reference: PMID:23301728
    reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Keratosis pilaris was noted in 100%, 66% and 30%, respectively, of homozygous, heterozygous and wild-type juvenile FLG mutation carriers."
    explanation: Gene-dose frequency of keratosis pilaris.
  - reference: PMID:25660180
    reference_title: "Sebaceous gland, hair shaft, and epidermal barrier abnormalities in keratosis pilaris with and without filaggrin deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-five percent of KP patients displayed filaggrin mutations, demonstrating that filaggrin mutations only partially account for the KP phenotype."
    explanation: Keratosis pilaris is associated with, but not specific to, FLG mutations.
- name: Palmar hyperlinearity
  category: Dermatologic
  description: >-
    Exaggerated palmar (and plantar) skin markings. It is the most useful
    clinical sign of FLG heterozygosity, but as a screening test its presence
    is only moderately predictive of an FLG null genotype, while its absence
    largely excludes one.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Palmar hyperlinearity
    term:
      id: HP:0033252
      label: Palmar hyperlinearity
  evidence:
  - reference: PMID:16810297
    reference_title: "Prevalent and rare mutations in the gene encoding filaggrin cause ichthyosis vulgaris and predispose individuals to atopic dermatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "heterozygotes have an intermediate phenotype most readily identified by palmar hyperlinearity"
    explanation: Palmar hyperlinearity identifies FLG heterozygotes.
  - reference: PMID:23301728
    reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Palmar and plantar hyperlinearity, defined as exaggerated skin markings (dermatoglyphics), and keratosis pilaris, defined by keratotic elevations around hair follicle orifices, are frequently observed in individuals with IV"
    explanation: Palmar and plantar hyperlinearity are frequent in ichthyosis vulgaris.
  - reference: PMID:34608691
    reference_title: "Clinical examination for hyperlinear palms to determine filaggrin genotype: A diagnostic test accuracy study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of HLP is not a reliable sign to detect FLG mutations, but the absence of HLP excludes FLG null genotype with a reasonable degree of certainty."
    explanation: Diagnostic accuracy of hyperlinear palms for FLG genotype in 3656 children.
- name: Pruritus
  category: Dermatologic
  description: Itch accompanies the dry, scaling skin.
  phenotype_term:
    preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:35663767
    reference_title: "Effect of topical treatment with 7.5% urea in Ichthyosis Vulgaris: A randomized, controlled, double blinded, split body study evaluating the effect of urea cream compared to the vehicle (moisturizing) cream."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ichthyosis Vulgaris (IV) is a common genetic skin disease, characterized by dry, scaling skin and itch."
    explanation: Itch is part of the clinical picture.
- name: Atopic dermatitis
  category: Immunologic
  description: >-
    Roughly 37 to 50% of people with ichthyosis vulgaris have atopic eczema.
    FLG null alleles are the strongest known genetic risk factor for atopic
    dermatitis, with several-fold risk in heterozygotes and very high risk in
    homozygotes; not every biallelic carrier develops it.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Atopic dermatitis
    term:
      id: HP:0001047
      label: Atopic dermatitis
  evidence:
  - reference: PMID:36159354
    reference_title: "A Case of Ichthyosis Vulgaris and the Use of 70% Glycolic Acid Chemical Peels for Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Approximately 37-50% of people affected have associated atopic eczema and a similar proportion have atopic relatives."
    explanation: Frequency of atopic eczema among people with ichthyosis vulgaris, stated as background in a case report.
  - reference: PMID:17417636
    reference_title: "Comprehensive analysis of the gene encoding filaggrin uncovers prevalent and rare mutations in ichthyosis vulgaris and atopic eczema."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fisher's exact test: heterozygote odds ratio (OR) = 7.44 (95% confidence interval (c.i.) = 4.9-11.3), and homozygote OR = 151 (95% c.i. = 20-1,136))"
    explanation: Gene-dose risk of moderate-to-severe childhood eczema in FLG null carriers.
  - reference: PMID:16550169
    reference_title: "Common loss-of-function variants of the epidermal barrier protein filaggrin are a major predisposing factor for atopic dermatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This work establishes a key role for impaired skin barrier function"
    explanation: Places the filaggrin barrier defect upstream of atopic dermatitis.
  - reference: PMID:27519469
    reference_title: "Compound heterozygotes for filaggrin gene mutations do not always show severe atopic dermatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that individuals with bi-allelic FLG mutations do not always have severe AD and confirm that not all individuals with bi-allelic FLG mutations have AD."
    explanation: Atopic dermatitis is not an obligate consequence even of biallelic FLG loss.
- name: Asthma
  category: Respiratory
  description: >-
    FLG null alleles raise the risk of asthma, but the association is with
    asthma in the context of eczema rather than asthma alone.
  phenotype_term:
    preferred_term: Asthma
    term:
      id: HP:0002099
      label: Asthma
  evidence:
  - reference: PMID:19501237
    reference_title: "Meta-analysis of filaggrin polymorphisms in eczema and asthma: robust risk factors in atopic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FLG mutations are also significantly associated with asthma (OR, 1.48; 95% CI, 1.32-1.66). However, although strong effects for the compound phenotype asthma plus eczema (OR, 3.29; 95% CI, 2.84-3.82) were observed, there appears to be no association with asthma in the absence of eczema."
    explanation: Meta-analysis quantifying asthma risk and its dependence on eczema.
- name: Allergic rhinitis
  category: Respiratory
  description: Allergic rhinitis (hay fever) is part of the associated atopic diathesis.
  phenotype_term:
    preferred_term: Allergic rhinitis
    term:
      id: HP:0003193
      label: Allergic rhinitis
  evidence:
  - reference: PMID:22158554
    reference_title: "One remarkable molecule: filaggrin."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Subsequent investigations of the role of FLG-null mutations have identified a series of significant associations with atopic disease phenotypes, including atopic asthma, allergic rhinitis, and peanut allergy."
    explanation: Review summarizing the association of FLG null alleles with allergic rhinitis.
  - reference: PMID:36751330
    reference_title: "Ichthyosis vulgaris: An updated review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ichthyosis vulgaris has a strong association with atopic disorders such as atopic dermatitis, allergic rhinitis (hay fever), and asthma."
    explanation: Review lists allergic rhinitis among the associated atopic disorders.
- name: Peanut allergy
  category: Immunologic
  description: >-
    FLG null alleles are a risk factor for IgE-mediated peanut allergy,
    independently of coexisting atopic dermatitis.
  phenotype_term:
    preferred_term: Peanut allergy
    term:
      id: HP:0500093
      label: Food allergy
  evidence:
  - reference: PMID:21377035
    reference_title: "Loss-of-function variants in the filaggrin gene are a significant risk factor for peanut allergy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Filaggrin loss-of-function mutations showed a strong and significant association with peanut allergy in the food challenge-positive patients (P = 3.0 × 10(-6); odds ratio, 5.3; 95% CI, 2.8-10.2)"
    explanation: Case-control association of FLG null alleles with challenge-proven peanut allergy.
  - reference: PMID:21377035
    reference_title: "Loss-of-function variants in the filaggrin gene are a significant risk factor for peanut allergy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association of filaggrin mutations with peanut allergy remains significant (P = .0008) after controlling for coexistent atopic dermatitis."
    explanation: The association is not solely mediated through eczema.
- name: Contact dermatitis
  category: Dermatologic
  description: >-
    FLG mutation carriers have more hand eczema, irritant contact dermatitis and
    nickel sensitization; hand eczema in carriers has a dorsal distribution with
    palmar hyperlinearity and fissures, and FLG null alleles are associated
    with persistent rather than incident hand eczema.
  phenotype_term:
    preferred_term: Irritant contact dermatitis and hand eczema
    term:
      id: HP:0032282
      label: Contact dermatitis
  evidence:
  - reference: PMID:23301728
    reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "epidemiological studies have found higher levels of hand eczema, irritant contact dermatitis, nickel sensitization and serum vitamin D levels"
    explanation: Epidemiological association of FLG mutations with irritant contact dermatitis and hand eczema.
  - reference: PMID:23301728
    reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hand eczema in FLG mutation carriers displays a distinct phenotype characterized by its dorsal localization, palmar hyperlinearity and skin fissures."
    explanation: Describes the hand eczema phenotype in carriers.
  - reference: PMID:26872425
    reference_title: "Predictive factors of self-reported hand eczema in adult Danes: a population-based cohort study with 5-year follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While filaggrin gene (FLG) null mutations were not associated with incident hand eczema, a statistically significant association was observed with persistent hand eczema (OR 3·1, 95% CI 1·8-5·2)."
    explanation: Population cohort association of FLG null alleles with persistent hand eczema.

histopathology:
- name: Reduced or absent granular layer
  description: >-
    The granular layer is thin or absent, with reduced or absent keratohyalin
    granules on electron microscopy in proportion to filaggrin loss and clinical
    severity, beneath mild hyperkeratosis. An absent or reduced granular layer
    helps separate ichthyosis vulgaris from other non-syndromic ichthyoses,
    although acquired ichthyosis shows similar histology.
  diagnostic: true
  evidence:
  - reference: PMID:2579164
    reference_title: "Ichthyosis vulgaris: identification of a defect in synthesis of filaggrin correlated with an absence of keratohyaline granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electron microscopic studies showed that keratohyaline granules were absent in 3 severely affected individuals, and reduced in number in the others."
    explanation: Ultrastructural hallmark of ichthyosis vulgaris.
  - reference: PMID:38841231
    reference_title: "Clinico-Epidemiologic Profile of Non-Syndromic Congenital Ichthyosis - A Retrospective Chart Review of 107 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "histological differences including an absent or reduced granular layer in ichthyosis vulgaris can help differentiate among the clinical phenotypes of inherited non-syndromic ichthyosis"
    explanation: Diagnostic value of the granular-layer finding among inherited ichthyoses.
  - reference: PMID:36159354
    reference_title: "A Case of Ichthyosis Vulgaris and the Use of 70% Glycolic Acid Chemical Peels for Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ichthyosis vulgaris was confirmed by histopathological findings of hyperkeratosis and an absent granular layer."
    explanation: Case in which the histologic pattern confirmed the diagnosis.

diagnosis:
- name: Clinical evaluation with histology and FLG genotyping
  description: >-
    Diagnosis is usually clinical, from xerosis, fine extensor scaling with
    flexural sparing, keratosis pilaris, palmar hyperlinearity, atopy and family
    history. Histology, electron microscopy and molecular testing of FLG
    confirm it; screening panels must include population-specific alleles.
  evidence:
  - reference: PMID:32115871
    reference_title: "Ichthyoses in everyday practice: management of a rare group of diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis is usually based on clinical evaluation. Molecular genetic testing as well as histological and electron microscopic studies may aid in confirming the diagnosis."
    explanation: Review statement of the diagnostic approach to the ichthyoses, including ichthyosis vulgaris.

differential_diagnoses:
- name: X-linked ichthyosis
  disease_term:
    preferred_term: X-linked ichthyosis
    term:
      id: MONDO:0010622
      label: recessive X-linked ichthyosis
  description: >-
    The other common hereditary ichthyosis, also presenting in the first year
    of life; caused by steroid sulfatase (STS) deficiency and inherited as an
    X-linked recessive trait.
  distinguishing_features:
  - X-linked inheritance affecting males, with STS deletion or steroid sulfatase deficiency.
  - Ichthyosis vulgaris shows a reduced or absent granular layer and FLG null alleles.
  evidence:
  - reference: PMID:36159354
    reference_title: "A Case of Ichthyosis Vulgaris and the Use of 70% Glycolic Acid Chemical Peels for Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the differential diagnoses of X-linked recessive ichthyosis, pityriasis rubra pilaris, and xerotic dermatitis were entertained"
    explanation: Lists X-linked recessive ichthyosis as a differential diagnosis.
- name: Acquired ichthyosis
  disease_term:
    preferred_term: acquired ichthyosis
    term:
      id: MONDO:0018683
      label: acquired ichthyosis
  description: >-
    Scaling resembling ichthyosis vulgaris but with no family history of
    ichthyosis or atopy, often transient, and sometimes a sign of malignancy,
    autoimmune or metabolic disease, or a drug effect.
  distinguishing_features:
  - Absence of a family history of ichthyosis or atopic disease.
  - Adult onset in association with an underlying condition or medication.
  evidence:
  - reference: PMID:36165597
    reference_title: "Acquired ichthyosis, asteatotic dermatitis or xerosis? An update on pathoetiology and drug-induced associations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Acquired ichthyosis (AI) is a relatively rare cutaneous entity characterized by transient, generalized scaling and pruritus in the absence of family history of ichthyosis or atopic disease."
    explanation: Defines the distinguishing clinical context of acquired ichthyosis.
  - reference: PMID:36165597
    reference_title: "Acquired ichthyosis, asteatotic dermatitis or xerosis? An update on pathoetiology and drug-induced associations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Histopathology of AI is similar to that found in IV."
    explanation: Histology does not separate acquired from hereditary ichthyosis vulgaris.

genetic:
- name: FLG
  gene_term:
    preferred_term: FLG
    term:
      id: hgnc:3748
      label: FLG
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Common European alleles are R501X and 2282del4, carried on conserved
    ancestral haplotypes; Asian populations carry largely different alleles,
    and FLG null alleles are less often found in African American patients.
    No ClinGen gene-disease validity record for FLG and ichthyosis vulgaris is
    cached in this repository, so no validity tier is recorded. A proportion of
    clinically diagnosed ichthyosis vulgaris, especially with atopic dermatitis,
    carries no detectable FLG mutation.
  case_fractions:
  - population: Chinese isolated ichthyosis vulgaris
    case_fraction_percent: 74.0
    notes: >-
      Full FLG sequencing; 43% in ichthyosis vulgaris associated with atopic
      dermatitis in the same study.
    evidence:
    - reference: PMID:23290076
      reference_title: "Analyses of FLG mutation frequency and filaggrin expression in isolated ichthyosis vulgaris (IV) and atopic dermatitis-associated IV."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The percentage of mutations in the FLG gene was 74% and 43% in patients with isolated IV and patients with AD-associated IV, respectively."
      explanation: FLG mutation yield in isolated and AD-associated ichthyosis vulgaris.
  - population: Austrian patients with marked generalized scaling
    case_fraction_percent: 71.4
    cohort_size: 21
    notes: 15 of 21 patients carried p.R501X or c.2282del4, the only alleles screened.
    evidence:
    - reference: PMID:17164798
      reference_title: "Filaggrin mutations p.R501X and c.2282del4 in ichthyosis vulgaris."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report the presence of FLG mutations in 15 out of 21 IV patients with a marked generalized scaling phenotype"
      explanation: Mutation yield for the two common European alleles.
  evidence:
  - reference: PMID:16444271
    reference_title: "Loss-of-function mutations in the gene encoding filaggrin cause ichthyosis vulgaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified homozygous or compound heterozygous mutations R501X and 2282del4 in the gene encoding filaggrin (FLG) as the cause of moderate or severe ichthyosis vulgaris in 15 kindreds."
    explanation: Original identification of FLG as the ichthyosis vulgaris gene.
  - reference: PMID:17417636
    reference_title: "Comprehensive analysis of the gene encoding filaggrin uncovers prevalent and rare mutations in ichthyosis vulgaris and atopic eczema."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show here that these common European mutations are ancestral variants carried on conserved haplotypes."
    explanation: Common European alleles are ancestral.
  - reference: PMID:19958351
    reference_title: "FLG mutations in ichthyosis vulgaris and atopic eczema: spectrum of mutations and population genetics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Notably, the same FLG mutations identified in the European population were rarely found in Asians."
    explanation: Population-specific mutation spectra.
  - reference: PMID:24920311
    reference_title: "Filaggrin gene mutations in African Americans with both ichthyosis vulgaris and atopic dermatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the African American children with both AD and IV, 22.2% were heterozygous for filaggrin null mutations."
    explanation: Lower FLG mutation yield in African American patients.
- name: STS
  gene_term:
    preferred_term: STS
    term:
      id: hgnc:11425
      label: STS
  association: Phenotype modifier
  relationship_type: MODIFIER
  notes: >-
    Reported in a single Chinese family: carriers of both an STS deletion and
    FLG c.3321delA had more severe ichthyosis than relatives carrying the FLG
    variant alone. STS deficiency on its own causes X-linked ichthyosis.
  evidence:
  - reference: PMID:30021537
    reference_title: "Exacerbation of ichthyosis vulgaris phenotype by co-inheritance of STS and FLG mutations in a Chinese family with ichthyosis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients carried both mutations presented more severe symptom, while those only carried FLG c.3321delA mutation showed slight or normal phenotype."
    explanation: Co-inheritance of an STS deletion worsened the FLG-related phenotype in one family.

environmental:
- name: Low ambient humidity and cold season
  description: >-
    Dry air in winter aggravates ichthyosis vulgaris, and most patients improve
    in summer or humid climates. Low humidity is thought to accelerate breakdown
    of residual filaggrin in heterozygous carriers.
  exposure_term:
    preferred_term: low ambient humidity
    term:
      id: ECTO:0010007
      label: exposure to humidity
  evidence:
  - reference: PMID:23301728
    reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Skin symptoms improve as environmental humidity increases; in fact, 80% of patients with IV report improvement during the summer."
    explanation: Seasonal and humidity dependence of symptoms.
  influences_mechanisms:
  - target: Reduced Stratum Corneum Hydration
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Low humidity drives deimination and breakdown of filaggrin; in patients
      with little residual filaggrin this is proposed to deepen the hydration
      deficit. In reconstructed epidermis with normal filaggrin, dry conditions
      instead raised NMF, so the worsening in patients is inferred rather than
      directly measured.
    evidence:
    - reference: PMID:23301728
      reference_title: "Ichthyosis vulgaris: the filaggrin mutation disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Accordingly, IV is typically present, and more severe, during the winter in temperate climates when a drop in humidity may result in further hydrolysis of residual filaggrin (in heterozygous carriers) into its constituent amino acids and their deiminated carboxylic acid derivatives."
      explanation: Review states the proposed mechanism by which low humidity worsens disease.
    - reference: PMID:28242341
      reference_title: "Lowering relative humidity level increases epidermal protein deimination and drives human filaggrin breakdown."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Partial inhibition of PADs with Cl-amidine reversed the effect of dryness on filaggrin breakdown."
      explanation: Shows experimentally that dryness drives PAD-dependent filaggrin breakdown in reconstructed human epidermis.

treatments:
- name: Topical urea
  description: >-
    Urea-containing creams (typically 7.5 to 10%) are a long-standing first-line
    keratolytic moisturizer. In a randomized split-body trial, 7.5% urea was
    superior to a plain moisturizer on the more keratotic legs but not on the
    arms.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: urea
      term:
        id: CHEBI:16199
        label: urea
  target_phenotypes:
  - preferred_term: Fine scaling of the skin
    term:
      id: HP:0040189
      label: Scaling skin
  - preferred_term: Xerosis
    term:
      id: HP:0000958
      label: Dry skin
  target_mechanisms:
  - target: Reduced Stratum Corneum Hydration
  evidence:
  - reference: PMID:35663767
    reference_title: "Effect of topical treatment with 7.5% urea in Ichthyosis Vulgaris: A randomized, controlled, double blinded, split body study evaluating the effect of urea cream compared to the vehicle (moisturizing) cream."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the legs, however, the urea treated areas had a significantly higher decrease in SRRC score (0.7 points [95% CI: 1.1-0.3, p < 0.005]) and increase in hydration (32.1 μS [95% CI: 10.9-53.2, p < 0.006])."
    explanation: Randomized split-body evidence for urea on the legs.
  - reference: PMID:35663767
    reference_title: "Effect of topical treatment with 7.5% urea in Ichthyosis Vulgaris: A randomized, controlled, double blinded, split body study evaluating the effect of urea cream compared to the vehicle (moisturizing) cream."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "On the arms, no significant differences between the two treatments were found."
    explanation: Urea was no better than a plain moisturizer on the less keratotic arms.
  - reference: PMID:29050444
    reference_title: "Treatment of ichthyosis vulgaris with a urea-based emulsion: videodermatoscopy and confocal microscopy evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the end of treatment the tested urea-based emulsion resulted in a significant clinical improvement of xerosis in all patients."
    explanation: Small open series with a 10% urea, ceramide and NMF emulsion.
- name: Regular emollient therapy
  description: >-
    Regular moisturizers improve dryness and reduce transepidermal water loss,
    with the largest effect in biallelic FLG carriers, but do not normalize the
    epidermal gene expression profile. Rigorous hydration of the skin several
    times a day is the mainstay of ichthyosis care.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care with emollients
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Xerosis
    term:
      id: HP:0000958
      label: Dry skin
  target_mechanisms:
  - target: Stratum Corneum Permeability Barrier Failure
  evidence:
  - reference: PMID:24330146
    reference_title: "Moisturizing treatment of patients with atopic dermatitis and ichthyosis vulgaris improves dry skin, but has a modest effect on gene expression regardless of FLG genotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moisturizing treatment improves dry skin and certain aspects of abnormal skin barrier function, especially in patients with AD/IV and dual FLG mutations, but does not normalize the epidermal gene expression profile."
    explanation: Emollients improve dryness and barrier readouts, most in biallelic carriers.
  - reference: PMID:35663767
    reference_title: "Effect of topical treatment with 7.5% urea in Ichthyosis Vulgaris: A randomized, controlled, double blinded, split body study evaluating the effect of urea cream compared to the vehicle (moisturizing) cream."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin hydration improved significantly with both urea and moisturising treatment."
    explanation: Plain moisturizer also improved hydration in the randomized trial.
  - reference: PMID:32115871
    reference_title: "Ichthyoses in everyday practice: management of a rare group of diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rigorous hydration of the skin (several times a day) and balneotherapy are the mainstay of ichthyosis treatment."
    explanation: Review recommendation for the ichthyoses as a group, including ichthyosis vulgaris.
- name: Ammonium lactate lotion
  description: >-
    Ammonium lactate 12% lotion, combined with a lipid-based repair cream, is
    used for scaling and dryness; lactate is a component of the natural
    moisturizing factor. Support is a review-level recommendation rather than a
    controlled trial in ichthyosis vulgaris.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ammonium lactate
      term:
        id: CHEBI:749313
        label: ammonium lactate
  target_phenotypes:
  - preferred_term: Fine scaling of the skin
    term:
      id: HP:0040189
      label: Scaling skin
  evidence:
  - reference: PMID:36751330
    reference_title: "Ichthyosis vulgaris: An updated review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Urea-based creams are highly therapeutic, whereas ammonium lactate 12% lotion with a physiological lipid-based repair cream can help with scaling and dryness."
    explanation: Review recommendation for ammonium lactate in ichthyosis vulgaris.

animal_models:
- name: Flaky tail mouse (Flg 5303delA homozygous)
  species: Mouse
  genotype: Flg ft/ft (5303delA frameshift), homozygous
  description: >-
    Spontaneous recessive mouse mutant lacking processed filaggrin and F-type
    keratohyalin granules, with dry flaky skin, orthokeratotic hyperkeratosis
    and enhanced percutaneous allergen priming.
  publication: PMID:19349982
  notes: >-
    The flaky tail line arose on a background carrying the recessive matted
    (ma) hair mutation and has been maintained on a mixed strain, so not every
    phenotype of the line can be attributed to Flg alone.
  modeled_mechanisms:
  - target: Profilaggrin and Filaggrin Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: ft/ft mice express an abnormal, unprocessed profilaggrin and lack filaggrin.
    limitations: >-
      Mouse Flg frameshift on a mixed background that also carries the matted
      mutation; the mouse is homozygous, so it models biallelic rather than
      heterozygous disease.
    evidence:
    - reference: PMID:11121144
      reference_title: "Loss of normal profilaggrin and filaggrin in flaky tail (ft/ft) mice: an animal model for the filaggrin-deficient skin disease ichthyosis vulgaris."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutant mice lacked the large, irregular F-type keratohyalin granules that contain profilaggrin, and filaggrin was absent from the cornified layers of ft/ft epidermis."
      explanation: Reproduces the human filaggrin and keratohyalin deficiency.
  - target: Increased Percutaneous Allergen and Irritant Penetration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Topical allergen produces cutaneous inflammation and allergen-specific antibodies.
    limitations: >-
      Ovalbumin sensitization in mice; the antibody response is mixed Th1/Th2
      rather than purely type 2, and the background matted mutation is a
      potential confounder.
    evidence:
    - reference: PMID:19349982
      reference_title: "A homozygous frameshift mutation in the mouse Flg gene facilitates enhanced percutaneous allergen priming."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We demonstrate that topical application of allergen to mice homozygous for this mutation results in cutaneous inflammatory infiltrates and enhanced cutaneous allergen priming with development of allergen-specific antibody responses."
      explanation: Direct experimental test of percutaneous priming through a Flg-deficient barrier.
  evidence:
  - reference: PMID:19349982
    reference_title: "A homozygous frameshift mutation in the mouse Flg gene facilitates enhanced percutaneous allergen priming."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we report a 1-bp deletion mutation, 5303delA, analogous to common human FLG mutations, within the murine Flg gene in the spontaneous mouse mutant flaky tail (ft)."
    explanation: Identifies the Flg frameshift in flaky tail mice.

pathophysiology:
- name: JPH2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic JPH2 variants reduce junctophilin-2 function. Reported alleles include truncating
    variants and less well characterized missense variants; residual protein abundance, localization,
    and channel interactions may differ by allele. The c.1920dupT allele predicts C-terminal truncation,
    rather than demonstrating complete protein absence. Impaired membrane tethering and calcium-channel
    regulation are supported by experimental JPH2 depletion.
  genes:
  - preferred_term: JPH2
    term:
      id: hgnc:14202
      label: JPH2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of Junctional Membrane Complex Assembly
    causal_link_type: DIRECT
    description: >-
      JPH2 depletion disrupts the formation or maintenance of junctional membrane complexes in mice.
      Applying this mechanism to human biallelic variants is supported by gene function and clinical
      genetics; the degree of disruption remains allele dependent.
    evidence:
    - reference: PMID:10949023
      reference_title: 'Junctophilins: a novel family of junctional membrane complex proteins.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cardiac myocytes from the mutant mice showed deficiency of the junctional membrane complexes
        and abnormal Ca2+ transients.
      explanation: The structural and functional consequence of losing JP-2, in the same cells, which is what this edge asserts.
  - target: Impaired RyR2 Inactivation
    causal_link_type: DIRECT
    description: JPH2 depletion removes a channel-regulatory interaction in the mouse model.
    evidence:
    - reference: PMID:21339484
      reference_title: >-
        Disrupted junctional membrane complexes and hyperactive ryanodine receptors after acute junctophilin
        knockdown in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, we found that JPH2 associates with and facilitates RyR2 inactivation, thereby preventing
        diastolic SR Ca2+ leak.
      explanation: The depletion study supports a regulatory role in addition to membrane spacing.
  evidence:
  - reference: PMID:31227780
    reference_title: >-
      Analysis of enriched rare variants in JPH2-encoded junctophilin-2 among Greater Middle Eastern
      individuals reveals a novel homozygous variant associated with neonatal dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES was performed and the proband was found to host a homozygous single nucleotide insertion
      (c.1920dupT) resulting in a premature stop codon (JPH2-p.E641*).
    explanation: >-
      Direct genotype evidence in the first Iranian proband; deceased relatives without DNA are not
      counted as confirmed homozygotes.
  - reference: PMID:33092464
    reference_title: >-
      Interaction of the Joining Region in Junctophilin-2 With the L-Type Ca(2+) Channel Is Pivotal
      for Cardiac Dyad Assembly and Intracellular Ca(2+) Dynamics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Protein-protein interaction studies showed that the joining region in JPH2 interacts with LTCC-α1C
      subunit and causes LTCCs distribution to the dyads, where they colocalize with RyRs.
    explanation: >-
      Experiments in cultured animal ventricular myocytes establish the relevant channel-binding function.
      Loss of this function in individual CMD2E alleles is inferred, not directly measured here.
  molecular_functions:
  - preferred_term: junctophilin-2 interaction with cardiac calcium channels
    term:
      id: GO:0044325
      label: transmembrane transporter binding
    modifier: DECREASED
- name: Failure of Junctional Membrane Complex Assembly
  biological_scale: CELLULAR
  description: >-
    JPH2 deficiency reduces the number of junctional membrane complexes and increases variability
    of sarcolemmal-to-sarcoplasmic-reticulum spacing in experimental cardiomyocytes. Reduced colocalization
    of L-type channels with RyR2 impairs excitation-contraction coupling. This structural lesion is
    distinct from the accompanying defect in RyR2 inactivation; unchanged channel abundance does not
    imply unchanged channel function.
  cellular_components:
  - preferred_term: T-tubule
    modifier: ABNORMAL
    term:
      id: GO:0030315
      label: T-tubule
  - preferred_term: sarcoplasmic reticulum
    term:
      id: GO:0016529
      label: sarcoplasmic reticulum
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Failure of Calcium-Induced Calcium Release
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21339484
    reference_title: >-
      Disrupted junctional membrane complexes and hyperactive ryanodine receptors after acute junctophilin
      knockdown in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      JPH2 deficiency resulted in loss of excitation-contraction coupling gain, precipitated by a
      reduction in the number of junctional membrane complexes and increased variability in the plasmalemma-sarcoplasmic
      reticulum distance.
    explanation: >-
      The geometric lesion measured directly: fewer complexes and a more variable membrane separation,
      with the functional consequence named in the same sentence.
  - reference: PMID:27760414
    reference_title: Junctophilin-2 gene therapy rescues heart failure by normalizing RyR2-mediated Ca(2+) release.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Junctophilin-2 (JPH2) is the primary structural protein for the coupling of transverse (T)-tubule
      associated cardiac L-type Ca channels and type-2 ryanodine receptors on the sarcoplasmic reticulum
      within junctional membrane complexes (JMCs) in cardiomyocytes.
    explanation: >-
      States the protein's structural role and what it couples. It is the introduction to a gene-therapy
      study rather than that study's finding, which is why it is marked as background.
  - reference: PMID:21339484
    reference_title: >-
      Disrupted junctional membrane complexes and hyperactive ryanodine receptors after acute junctophilin
      knockdown in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, co-localization between the two channels was significantly decreased following JPH2
      knockdown, and this was not due to a difference in protein levels.
    explanation: The model shows altered spatial organization without reduced channel abundance.
- name: Impaired RyR2 Inactivation
  biological_scale: MOLECULAR
  description: >-
    Experimental JPH2 depletion impairs stabilization of RyR2 in its closed state during diastole.
    This is a loss of channel regulation, separate from the disruption of dyadic spacing.
  molecular_functions:
  - preferred_term: JPH2-mediated restraint of RyR2 opening
    term:
      id: GO:0019855
      label: calcium channel inhibitor activity
    modifier: DECREASED
  downstream:
  - target: Diastolic Sarcoplasmic Reticulum Calcium Leak
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21339484
    reference_title: >-
      Disrupted junctional membrane complexes and hyperactive ryanodine receptors after acute junctophilin
      knockdown in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

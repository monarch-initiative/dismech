genetic:
- name: JPH2
  gene_term:
    preferred_term: JPH2
    term:
      id: hgnc:14202
      label: JPH2
  relationship_type: CAUSATIVE
  notes: >-
    JPH2 encodes junctophilin-2, the structural protein of the cardiac dyad. One
    gene, two inheritance modes: biallelic loss of function causes this disease,
    and heterozygous missense variants cause hypertrophic cardiomyopathy, curated
    separately as Hypertrophic_Cardiomyopathy_17. ClinGen's position at the time
    of the systematic review was moderate evidence for JPH2 in hypertrophic
    cardiomyopathy with autosomal dominant inheritance and moderate evidence for
    dilated cardiomyopathy with semidominant inheritance.

    A caution for anyone re-deriving this binding from a deep-research report:
    the OpenScientist run for this entry offered HGNC:14179 for JPH2. That
    identifier is CIAO3. The correct one, used here, is hgnc:14202, confirmed
    against the HGNC REST API. HGNC is skipped by the report's own term
    validator, so nothing in the pipeline would have caught it.
  variants:
  - name: c.1920dupT, p.E641*
    description: >-
      A homozygous single-nucleotide insertion producing a stop codon, found in
      consanguineous Iranian families with neonatal dilated cardiomyopathy and
      confirmed by segregation analysis. The first loss-of-function JPH2 allele
      described in disease.
  evidence:
  - reference: PMID:31227780
    reference_title: Analysis of enriched rare variants in JPH2-encoded junctophilin-2 among Greater Middle Eastern individuals reveals a novel homozygous variant associated with neonatal dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previously, missense variants in JPH2 have been linked to hypertrophic
      cardiomyopathy; however, pathogenic "loss of function" (LOF) variants have
      not been described.
    explanation: >-
      States what was known before this report and what it added, which is the
      distinction between this entry and the dominant JPH2 disease.
  - reference: PMID:34861382
    reference_title: "One gene, two modes of inheritance, four diseases: A systematic review of the cardiac manifestation of pathogenic variants in JPH2-encoded junctophilin-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Currently, ClinGen considers JPH2 to have moderate evidence for association
      with HCM in an autosomal dominant inheritance pattern, and moderate
      evidence for association with DCM in a semidominant inheritance pattern.
    explanation: >-
      The curated gene-disease validity position for both phenotypes. Note the
      word for the DCM relationship is semidominant rather than recessive, which
      is a weaker claim than this entry's title makes and is why it is quoted
      rather than paraphrased.
  - reference: PMID:30384889
    reference_title: Genetic Basis of Severe Childhood-Onset Cardiomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease genes converge on metabolic causes (PRKAG2, MRPL44, AARS2,
      HADHB, DNAJC19, PPA2, TAZ, BAG3), MAPK pathways (HRAS, PTPN11, RAF1, TAB2),
      development (NEK8 and TBX20), calcium signaling (JPH2, CALM1, CACNA1C), and
      the sarcomeric contraction cycle (TNNC1, TNNI3, ACTC1, MYH7, NRAP)
    explanation: >-
      Places JPH2 among the calcium-signalling causes of severe childhood
      cardiomyopathy in a countrywide cohort. This abstract does not describe the
      JPH2 kindred's allele; that detail is in the full text and is therefore not
      curated here.
diagnosis:
- name: Genetic testing for biallelic JPH2 loss-of-function variants
  description: >-
    Next-generation sequencing, with segregation analysis in the family. Two
    features of this disease shape the testing strategy: the phenotype is not
    distinguishable on imaging from any other paediatric dilated cardiomyopathy,
    and loss-of-function JPH2 alleles are enriched in Greater Middle Eastern
    populations, so consanguinity raises the prior.
  evidence:
  - reference: PMID:31227780
    reference_title: Analysis of enriched rare variants in JPH2-encoded junctophilin-2 among Greater Middle Eastern individuals reveals a novel homozygous variant associated with neonatal dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, we report ethnic-specific differences in JPH2 rare variants,
      with GME individuals being at higher risk of hosting homozygous LOF
      variants.
    explanation: >-
      The population-genetic finding that raises the pre-test probability in a
      specific group, which is the actionable part of that study.
differential_diagnoses:
- name: Hypertrophic Cardiomyopathy 17
  description: >-
    The dominant JPH2 disease, curated separately. Same gene, different allele
    class and different inheritance: heterozygous missense variants acting
    through altered regulation of the ryanodine receptor, rather than biallelic
    loss of the protein. Genetic testing distinguishes them; the phenotypes are
    opposite in ventricular geometry.
  distinguishing_features:
  - Heterozygous missense rather than biallelic loss-of-function alleles.
  - Ventricular hypertrophy rather than dilation, with a wider associated range
    including arrhythmia, sudden cardiac death and conduction disease.
  evidence:
  - reference: PMID:34861382
    reference_title: "One gene, two modes of inheritance, four diseases: A systematic review of the cardiac manifestation of pathogenic variants in JPH2-encoded junctophilin-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In analyzing the 24 probands described in the studies, we found that
      autosomal recessive, loss-of-function variants are associated with severe,
      early onset DCM, while autosomal dominant missense variants are associated
      with a wider range of cardiac disease, including HCM, arrhythmia, SCD, and
      cardiac conduction disease.
    explanation: >-
      The two diseases contrasted in one sentence, by allele class and
      inheritance rather than by phenotype alone.

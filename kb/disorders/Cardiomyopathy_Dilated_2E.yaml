    transplanted. That figure is for the cohort, not for JPH2 patients.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Impaired Cardiac Contractility
    description: >-
      Replaces the failing heart, and with it the cardiomyocytes that lack
      junctophilin-2. It is the only intervention that removes the mechanism.
  evidence:
  - reference: PMID:30384889
    reference_title: Genetic Basis of Severe Childhood-Onset Cardiomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The KidCMP cohort presents remarkable early-onset and severe disorders: the
      median age of diagnosis was 0.33 years, and 17 patients underwent cardiac
      transplantation.
    explanation: >-
      The transplantation count in the childhood cardiomyopathy cohort that
      includes JPH2 patients. It is a cohort figure and is labelled as one.
  - reference: PMID:30384889
    reference_title: Genetic Basis of Severe Childhood-Onset Cardiomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic diagnoses may suggest intervention strategies and predict
      prognosis, offering valuable tools for prioritization of patients for
      transplantation versus conservative treatment.
    explanation: >-
      The authors' argument that the genetic diagnosis itself informs the
      transplant decision, which is why molecular diagnosis is curated as
      consequential in a disease with no specific therapy.
discussions:
- discussion_id: gap_cmd2e_gene_therapy_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does AAV9-mediated JPH2 delivery, which rescues a pressure-overload mouse,
    address the defect in a patient who has never had junctophilin-2?
  attaches_to:
  - "pathophysiology#Failure of Junctional Membrane Complex Assembly"
  rationale: >-
    The gene therapy result is real and striking: AAV9-JPH2 rescues contractility
    and preserves t-tubule structure in mice after transverse aortic
    constriction. But the model is not this disease. In transverse aortic
    constriction, junctophilin-2 falls secondarily as the heart fails, so the
    experiment restores a protein the animal once had, in a heart whose dyads
    were built normally. A CMD2E patient is a constitutive null whose dyads were
    never assembled, and whose myocardium has remodelled around their absence
    since before birth. Whether delivering junctophilin-2 to such a heart
    reassembles dyads, or arrives too late to reorganise a t-tubule system that
    never formed, is untested. The report treats this result as a strong
    preclinical rationale for CMD2E; that is a reasonable hope and it is not
    evidence, and the distinction matters because the patients are infants for
    whom transplantation is the alternative.
  proposed_experiments:
  - experiment_id: exp_cmd2e_aav9_in_constitutive_null
    name: AAV9-JPH2 in a cardiac Jph2 conditional null rather than a pressure-overload model
    description: >-
      Deliver AAV9-JPH2 to mice in which Jph2 has been deleted in cardiomyocytes
      from before dyad assembly, and measure junctional membrane complex number,
      plasmalemma-to-sarcoplasmic-reticulum distance and contractility against
      the pressure-overload rescue. A rescue in that model would support
      translation; a failure would locate the problem in dyad assembly rather
      than in protein supply.
- discussion_id: gap_cmd2e_semidominant_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the JPH2 dilated cardiomyopathy relationship recessive or semidominant,
    and do heterozygous loss-of-function carriers have cardiac disease?
  attaches_to:
  - "genetic#JPH2"
  - "inheritance#Autosomal recessive inheritance"
  rationale: >-
    This entry is titled and curated as autosomal recessive, and the segregation
    evidence in the Iranian kindred supports that. But ClinGen's curated position
    at the time of the systematic review was "semidominant" for the JPH2-dilated
    cardiomyopathy relationship, which is a different claim: it implies
    heterozygous carriers are not simply unaffected. Loss-of-function JPH2
    variants are carried by 0.21% of Greater Middle Eastern individuals, so the
    carrier population is large enough to answer this, and none of the published
    work reports systematic cardiac phenotyping of heterozygous relatives. The
    stake is cascade screening: if carriers are at risk, the families already
    identified contain many people who should be under surveillance and are not.
  proposed_experiments:
  - experiment_id: exp_cmd2e_heterozygote_phenotyping
    name: Echocardiographic phenotyping of obligate heterozygous JPH2 LOF carriers
    description: >-
      Systematically image the obligate carrier parents and heterozygous
      relatives in the published consanguineous kindreds, and compare ventricular
      dimensions and systolic function against matched controls, to test whether
      one functional JPH2 allele is sufficient.
notes: >-
  Scope and lump/split. MONDO:0030366 was bound nowhere in kb/. JPH2 appears as a
  gene in the broad Dilated_Cardiomyopathy entry and in the hypertrophic
  entries, and Hypertrophic_Cardiomyopathy_17 is the dominant JPH2 disease. This
  entry is the recessive counterpart, curated separately because the systematic
  review separates them by allele class and inheritance rather than by phenotype
  alone. Sibling per-type entries already exist (Cardiomyopathy_Dilated_2G, _2H,
  _2J), so the naming and granularity follow them. Neither the broad DCM entry
  nor CMH17 is edited here.

  A wrong gene identifier in the deep-research report. The OpenScientist run
  offered HGNC:14179 for JPH2 throughout. That identifier is CIAO3, cytosolic
  iron-sulfur assembly component 3. The correct one is hgnc:14202, which is what
  this entry binds, confirmed against the HGNC REST API and matching the stub.
  Nothing in the pipeline would have caught this: the research recipe passes
  --term-skip-prefix HGNC, so gene CURIEs are unchecked where they are emitted,
  and on the KB side `just validate-terms` checks only that a CURIE's label
  matches that CURIE, which a wrong-but-consistent pair would pass. This is the
  failure mode CLAUDE.md documents under "A gene binding only has to be
  self-consistent", reproduced live.

  Whose cohort a number comes from. Three denominators appear and none is a
  CMD2E frequency. The systematic review's 61 variant-positive individuals and
  its 18% DCM share span both inheritance modes. The Finnish KidCMP figures,
  median diagnosis age 0.33 years and 17 of 66 transplanted, are for a
  countrywide childhood cardiomyopathy cohort in which JPH2 is one of many
  genes. The Greater Middle East carrier frequencies are population genetics,
  not disease frequency. Each record says which, and the carrier-frequency
  prevalence record explains in its notes why its band and its rate refer to
  different quantities.

  Two phenotypes only. Dilated cardiomyopathy and congestive heart failure. The
  temptation with a cardiac entry is to add arrhythmia, sudden cardiac death and
  conduction disease from the JPH2 literature, and those belong to the dominant
  missense disease: the systematic review assigns them to that group explicitly.
  Importing them here would merge the two entities the same review separates.

  The gene therapy result, and why it is a discussion rather than a treatment.
  AAV9-JPH2 rescues contractility and t-tubule structure after transverse aortic
  constriction, where junctophilin-2 falls secondarily in a heart whose dyads
  formed normally. A CMD2E patient never had the protein. Curated as a
  HUMAN_MODEL_MISMATCH with a proposed experiment rather than as a treatment
  with a rationale, because the model and the disease differ in the one variable
  the therapy depends on.

  ClinGen says semidominant, this entry says recessive. That disagreement is
  quoted rather than smoothed: the ClinGen position is curated verbatim on the
  gene record and a KNOWLEDGE_GAP asks whether heterozygous loss-of-function
  carriers have cardiac disease, which nothing published has systematically
  tested.

  Deep research. One OpenScientist run, committed; reference validation reports
  17 of 17 references resolved, with 9 of 17 assessed as on topic, which is low
  and consistent with a report that ranges across the whole junctophilin
  literature. `just preflight-dr` returned SKIP, which means unchecked, because
  MONDO records no causal gene for MONDO:0030366. That is four of five entries in
  this run. Manual fallback: JPH2 dominates the report's gene mentions and its
  OMIM #619492 is CMD2E's.

  What is deliberately absent. No animal_models: block, despite three mouse
  studies being central to the mechanism. They are curated as evidence on the
  pathophysiology nodes instead, because none of them is a model of CMD2E: the
  germline null is embryonic lethal, the knockdown is an acute adult
  intervention, and the gene therapy study uses pressure overload. Recording any
  of them as an animal model of this disease would assert a fidelity claim none
  of the papers makes. No datasets: block, no clinical_trials: block, no
  environmental: block. No GeneReviews chapter exists; `just check-genereviews`
  reports NO_CHAPTER.

name: Dilated Cardiomyopathy 2E
creation_date: '2026-09-17T16:17:48Z'
description: >-
  CMD2E is autosomal recessive dilated cardiomyopathy associated with biallelic pathogenic JPH2 variants.
  Junctophilin-2 maintains cardiac junctional membrane complexes and regulates calcium-channel coupling.
  Experimental loss of JPH2 disrupts dyad architecture and RyR2 inactivation, impairing systolic calcium
  release and contractility. These model findings support a loss-of-function mechanism, but complete
  absence of protein and failure of all dyads to develop have not been demonstrated for every human
  allele. Reported children have severe early-onset ventricular dilation and systolic failure, sometimes
  with conduction abnormalities, death, or transplantation. ClinGen rates the recessive association
  Strong and evaluates dominant JPH2 cardiomyopathies separately. Treatment follows pediatric heart-failure
  care; JPH2 gene delivery remains experimental.
synonyms:
- CMD2E
- cardiomyopathy, dilated, 2E
- JPH2 dilated cardiomyopathy
- junctophilin-2 dilated cardiomyopathy
- autosomal recessive dilated cardiomyopathy due to JPH2 deficiency

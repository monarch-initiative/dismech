- name: Cascade testing and cardiac surveillance
  description: >-
    Clarify relatives' genetic status and arrange cardiac surveillance according to genotype, age,
    phenotype, and family history. GeneReviews specifically advises considering surveillance for heterozygous
    JPH2 parents and siblings; unaffected carriers in small published families do not establish lifelong
    absence of risk.

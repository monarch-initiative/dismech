      directly measured in all human CMD2E variants.
- name: Diastolic Sarcoplasmic Reticulum Calcium Leak
  biological_scale: CELLULAR
  description: >-
    JPH2-depleted mouse cardiomyocytes show increased spontaneous calcium release during diastole
    and reduced sarcoplasmic-reticulum calcium content. The loss of stored calcium contributes to
    diminished triggered systolic release.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Failure of Calcium-Induced Calcium Release
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Reduced SR calcium content contributes alongside structural uncoupling to smaller systolic calcium transients.
  evidence:
  - reference: PMID:21339484
    reference_title: >-
      Disrupted junctional membrane complexes and hyperactive ryanodine receptors after acute junctophilin
      knockdown in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ventricular myocytes of MCM-shJPH2 mice exhibited an increase in cell-wide spontaneous Ca2+
      release (SCR) events following a 1-Hz pacing train, compared to MCM mice
    explanation: Direct measurement in the experimental knockdown model.
  - reference: PMID:21339484
    reference_title: >-
      Disrupted junctional membrane complexes and hyperactive ryanodine receptors after acute junctophilin
      knockdown in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: However, our findings clearly revealed a reduction in overall SR Ca2+ content, which argues against this model
    explanation: Reduced store content argues against SR overload as the cause of the spontaneous release.
- name: Failure of Calcium-Induced Calcium Release
  biological_scale: CELLULAR
  description: >-
    Reduced coupling between L-type channels and RyR2, together with diastolic calcium leak and reduced
    SR calcium stores, diminishes triggered systolic calcium release and excitation-contraction coupling
    gain in JPH2-depleted cardiomyocytes. Failure denotes impaired efficiency, not complete cessation
    of calcium release.
  biological_processes:
  - preferred_term: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    modifier: DECREASED
    term:
      id: GO:0014808
      label: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
  downstream:
  - target: Impaired Cardiac Contractility
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21339484
    reference_title: >-
      Disrupted junctional membrane complexes and hyperactive ryanodine receptors after acute junctophilin
      knockdown in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Whereas Ca2+ influx through VGCC was unaffected by loss of JPH2, Ca2+ release from the SR (i.e.,
      Ca2+ transients) was significantly smaller in tamoxifen-treated MCM-shJPH2 mice
    explanation: Functional comparison in the knockdown mouse separates preserved trigger influx from reduced SR release.
- name: Impaired Cardiac Contractility
  biological_scale: ORGANISM
  description: >-
    Reduced systolic contractile performance is demonstrated after cardiac JPH2 knockdown in adult
    mice and is consistent with the systolic dysfunction observed in recessive human JPH2 cardiomyopathy.
    It can progress to ventricular dilation and clinical heart failure.
  locations:

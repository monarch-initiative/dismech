name: Dilated Cardiomyopathy 2E
creation_date: "2026-09-17T16:17:48Z"
description: >-
  CMD2E is the autosomal recessive dilated cardiomyopathy caused by biallelic
  loss-of-function variants in JPH2, the gene for junctophilin-2. It is the
  recessive counterpart of the dominant JPH2 disease already curated here as
  Hypertrophic_Cardiomyopathy_17, and the two are separated by mechanism as well
  as by inheritance: the dominant disease runs on missense alleles that alter
  how junctophilin-2 regulates the ryanodine receptor, while this one removes
  the protein.

  The mechanism is architectural rather than biochemical. Junctophilin-2 tethers
  the t-tubule sarcolemma to the junctional sarcoplasmic reticulum and so holds
  the dyadic cleft at the width that places L-type calcium channels opposite
  ryanodine receptors. Calcium-induced calcium release depends on that geometry,
  not on any catalytic step, so losing the tether degrades excitation-contraction
  coupling by moving two channels apart. The mouse genetics are unusually clean
  on this point: germline Jph2-null embryos die with deficient junctional
  membrane complexes and abnormal calcium transients, and acute cardiac-specific
  knockdown in adults produces loss of junctional membrane complexes, increased
  variability in the plasmalemma-to-sarcoplasmic-reticulum distance, and heart
  failure.

  Clinically it presents in the neonatal period or early childhood with rapidly
  progressive systolic failure, and transplantation is a realistic outcome.
  There is no disease-specific therapy. AAV9-mediated JPH2 delivery rescues
  contractility in a mouse pressure-overload model, which is a rationale rather
  than a treatment.
synonyms:
- CMD2E
- cardiomyopathy, dilated, 2E
- JPH2 dilated cardiomyopathy
- junctophilin-2 dilated cardiomyopathy
- autosomal recessive dilated cardiomyopathy due to JPH2 deficiency

discussions:
- discussion_id: gap_cmd2e_gene_therapy_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Can JPH2 gene delivery restore structure and function in variant-specific recessive cardiomyopathy models?
  attaches_to:
  - pathophysiology#Failure of Junctional Membrane Complex Assembly
  rationale: >-
    AAV9-JPH2 preserved T-tubule structure and calcium handling after transverse aortic constriction
    in mice. This supports experimental replacement of reduced JPH2 but does not establish efficacy
    for a child with biallelic pathogenic variants. Patient alleles may retain truncated protein or
    residual function, so constitutive absence and irreversible failure of dyad assembly must not
    be assumed. Variant-specific models are needed to test timing, structural rescue, and functional
    recovery.
  proposed_experiments:
  - experiment_id: exp_cmd2e_aav9_in_constitutive_null
    name: AAV9-JPH2 in a cardiac Jph2 conditional null rather than a pressure-overload model
    description: >-
      Test JPH2 delivery in variant-specific recessive models and compare dyad structure, calcium
      handling, and contractility with pressure-overload rescue. Vary treatment timing to examine
      whether developmental and maintenance defects differ in reversibility.
- discussion_id: gap_cmd2e_semidominant_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What is the age-dependent cardiac risk in heterozygous relatives of recessive JPH2 cases?
  attaches_to:
  - genetic#JPH2
  - inheritance#Autosomal recessive inheritance
  rationale: >-
    ClinGen now curates recessive and dominant DCM separately, resolving the earlier semidominant
    classification issue. Healthy heterozygotes were described in the Iranian kindreds, but small
    cross-sectional observations do not quantify lifelong risk. GeneReviews recommends considering
    cardiac surveillance of heterozygous parents and siblings. Prospective follow-up with variant-specific
    interpretation is needed.
  proposed_experiments:
  - experiment_id: exp_cmd2e_heterozygote_phenotyping
    name: Echocardiographic phenotyping of obligate heterozygous JPH2 LOF carriers
    description: >-
      Systematically image the obligate carrier parents and heterozygous relatives in the published
      consanguineous kindreds, and compare ventricular dimensions and systolic function against matched
      controls, to test whether one functional JPH2 allele is sufficient.
- discussion_id: gap_cmd2e_cryptic_second_allele
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Can cardiac proteomics help identify cryptic second JPH2 alleles in apparently monoallelic pediatric DCM?
  attaches_to:
  - genetic#JPH2
  rationale: >-
    A 2026 medRxiv preprint reports a coding frameshift in trans with an approximately 8.34-Mb inversion
    interrupting intron 5 and separating the coding transcript from its 3-prime UTR. Proteomic downregulation
    and reduced UTR-containing transcripts supported the authors' biallelic interpretation. This is
    preliminary single-patient evidence, not a validated diagnostic workflow or proof of a particular
    RNA-decay mechanism. The proband presented at age 10-15 years, extending the reported range beyond
    infancy; the study requires independent confirmation. Data are available on request, without a
    public accession.
  evidence:
  - reference: DOI:10.64898/2026.06.16.26355718
    reference_title: "Proteomics Uncovers Cryptic\n                  <i>JPH2</i>\n                  Loss in Paediatric Dilated Cardiomyopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, proteomic analysis showed a pronounced downregulation of JPH2, suggestive of biallelic
      loss-of-function.
    explanation: >-
      Preprint evidence from explanted human myocardium; reduced abundance prompted investigation
      of a second allele.
  - reference: DOI:10.64898/2026.06.16.26355718
    reference_title: "Proteomics Uncovers Cryptic\n                  <i>JPH2</i>\n                  Loss in Paediatric Dilated Cardiomyopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, we applied RNA sequencing with total RNA library preparation to show that transcripts
      containing a 3′UTR were reduced to ∼10% relative to controls.
    explanation: The measured RNA consequence does not by itself distinguish transcription from RNA stability.
  - reference: https://www.medrxiv.org/content/10.64898/2026.06.16.26355718v1.full.pdf
    reference_title: https://www.medrxiv.org/content/10.64898/2026.06.16.26355718v1.full.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two variants were confirmed to be in trans using long read DNA sequencing, consistent with
      a diagnosis of JPH2 autosomal recessive DCM.
    explanation: >-
      The preprint reports long-read phasing of a coding frameshift and an intronic inversion; this
      preliminary observation supports investigating cryptic second alleles.
notes: >-
  CMD2E denotes the recessive JPH2 association, distinct from dominant hypertrophic cardiomyopathy
  and the separately assessed dominant DCM association. Available patient series are too small and
  selectively ascertained to establish disease prevalence, penetrance, or reliable phenotype frequencies.
  Protein loss and dyad disruption remain allele-dependent mechanistic inferences in human cases.
  The compound-missense infant reported in PMID:32879264 also had a PKD1 nonsense variant and polycystic
  kidney disease; its renal, histological, and additional cardiac findings are not treated as established
  CMD2E features. General pediatric heart-failure guidance and the DCM GeneReviews chapter inform
  clinical care, while the pressure-overload gene-delivery study supplies preclinical rationale only.

animal_models:
- name: Germline Jph2-null mouse
  species: Mus musculus
  genotype: Jph2 null
  description: >-
    Global knockout causes embryonic lethality and abnormal junctional complexes. It models the requirement
    for JPH2 during cardiac development, not the entire postnatal course or residual function of human
    variants.
  evidence:
  - reference: PMID:10949023
    reference_title: 'Junctophilins: a novel family of junctional membrane complex proteins.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: JP-2 is abundantly expressed in the heart, and mutant mice lacking JP-2 exhibited embryonic lethality.
    explanation: >-
      Global knockout causes embryonic lethality and abnormal junctional complexes. It models the
      requirement for JPH2 during cardiac development, not the entire postnatal course or residual
      function of human variants.
  - reference: PMID:10949023
    reference_title: 'Junctophilins: a novel family of junctional membrane complex proteins.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cardiac myocytes from the mutant mice showed deficiency of the junctional membrane complexes
      and abnormal Ca2+ transients.
    explanation: Junctional membrane defects were observed in null mouse cardiomyocytes.
  modeled_mechanisms:
  - target: Failure of Junctional Membrane Complex Assembly
    relationship: RECAPITULATES
    description: Null mouse cardiomyocytes show deficient junctional membrane complexes.
    model_scale: CELLULAR
    limitations: >-
      Embryonic lethality prevents assessment of postnatal dyad maintenance and does not reproduce
      the residual function of every human allele.
    evidence:
    - reference: PMID:10949023
      reference_title: 'Junctophilins: a novel family of junctional membrane complex proteins.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cardiac myocytes from the mutant mice showed deficiency of the junctional membrane complexes
        and abnormal Ca2+ transients.
      explanation: Junctional membrane defects were observed in null mouse cardiomyocytes.
    fidelity: MODERATE
    divergences:
    - divergence_type: TEMPORAL_SCOPE
      description: Embryonic knockout cannot establish the postnatal course of dyad dysfunction.
    - divergence_type: SPECIES_MISMATCH
      description: The experiment used mouse myocardium; correspondence to human JPH2 cardiomyopathy requires corroboration.

    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic pathogenic JPH2 variants can cause severe early-onset DCM. Both homozygous and compound
    heterozygous genotypes have been reported. This entry covers the recessive disease; the existence
    of dominant JPH2 associations means heterozygous relatives should not automatically be assumed
    free of cardiac risk.
  evidence:
  - reference: CGGV:assertion_7aa138ae-114c-46b0-84e4-5bfc5a7db51b-2026-03-04T170000.000Z
    reference_title: JPH2 / cardiomyopathy, dilated, 2E (Strong)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In summary, there is strong evidence to support a recessive model of disease for this gene-disease
      relationship.
    explanation: >-
      ClinGen separately evaluates recessive JPH2 cardiomyopathy; the historical semidominant assessment
      has been superseded.
  - reference: PMID:31227780
    reference_title: >-
      Analysis of enriched rare variants in JPH2-encoded junctophilin-2 among Greater Middle Eastern
      individuals reveals a novel homozygous variant associated with neonatal dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES was performed and the proband was found to host a homozygous single nucleotide insertion
      (c.1920dupT) resulting in a premature stop codon (JPH2-p.E641*).
    explanation: >-
      Direct genotype evidence in the first Iranian proband; deceased relatives without DNA are not
      counted as confirmed homozygotes.
prevalence:
- population: Greater Middle East reference cohorts analyzed by Jones et al. (2019)
  measure_type: CARRIER_FREQUENCY
  rate_per_100000: 210.0
  notes: >-
    The reported 0.21% frequency converts to 210 per 100,000 individuals. This is a carrier estimate
    using the study definition of predicted loss of function, which included in-frame insertions/deletions
    and canonical splice variants; it is neither a count of clinically classified pathogenic alleles
    nor a prevalence of CMD2E. The worldwide comparator was 0.04%. Disease prevalence and penetrance
    cannot be inferred from these carrier data.
  evidence:
  - reference: PMID:31227780
    reference_title: >-
      Analysis of enriched rare variants in JPH2-encoded junctophilin-2 among Greater Middle Eastern
      individuals reveals a novel homozygous variant associated with neonatal dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Worldwide, 1.45% of healthy individuals hosted a rare JPH2 variant with a significantly higher
      proportion among GME individuals (4.45%); LOF variants were rare overall (0.04%) yet were most
      prevalent in GME (0.21%).
    explanation: >-
      The source reports the frequency among reference individuals; no homozygote frequency or disease-prevalence
      band is inferred.
progression:
- phase: Infantile or childhood presentation with progressive systolic failure
  notes: >-
    The confirmed Iranian proband presented at 20 months and died at five years while awaiting transplantation.
    Neonatal cardiac death in his sibling and deaths in a second family support familial disease but
    the deceased children were not genotyped. Published severe cases do not establish universal penetrance
    or an inevitable untreated outcome.
  evidence:
  - reference: PMID:31227780
    reference_title: >-
      Analysis of enriched rare variants in JPH2-encoded junctophilin-2 among Greater Middle Eastern
      individuals reveals a novel homozygous variant associated with neonatal dilated cardiomyopathy.
    supports: SUPPORT

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic JPH2 loss of function. The inheritance mode is the axis that
    separates this disease from the dominant JPH2 hypertrophic cardiomyopathy,
    and the separation is not merely nosological: the systematic review of JPH2
    cardiac disease found that recessive loss-of-function alleles give severe
    early-onset dilated cardiomyopathy while dominant missense alleles give a
    wider range of disease including hypertrophic cardiomyopathy and arrhythmia.
  evidence:
  - reference: PMID:34861382
    reference_title: "One gene, two modes of inheritance, four diseases: A systematic review of the cardiac manifestation of pathogenic variants in JPH2-encoded junctophilin-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In analyzing the 24 probands described in the studies, we found that
      autosomal recessive, loss-of-function variants are associated with severe,
      early onset DCM, while autosomal dominant missense variants are associated
      with a wider range of cardiac disease, including HCM, arrhythmia, SCD, and
      cardiac conduction disease.
    explanation: >-
      The genotype-inheritance-phenotype split across all published JPH2
      probands, and the sentence that justifies curating CMD2E separately from
      CMH17 rather than as one JPH2 entry.
  - reference: PMID:31227780
    reference_title: Analysis of enriched rare variants in JPH2-encoded junctophilin-2 among Greater Middle Eastern individuals reveals a novel homozygous variant associated with neonatal dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This conclusion is supported by the identification of a novel JPH2 LOF
      variant confirmed by segregation analysis resulting in autosomal recessive
      pediatric DCM due to presumptive JPH2 truncation.
    explanation: >-
      A segregation-confirmed recessive allele, which is the direct evidence for
      the inheritance mode in a specific kindred.
prevalence:
- population: Published JPH2 variant-positive individuals, systematic review to 2021
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The systematic review identified 61 individuals carrying a JPH2 variant, of
    whom about 80% had cardiac disease and 18% had dilated cardiomyopathy. That
    18% is the DCM share of all JPH2 disease, dominant and recessive together,
    and is not a prevalence of CMD2E: the analysis that separates recessive from
    dominant was done on 24 probands, not on the 61.
  evidence:
  - reference: PMID:34861382
    reference_title: "One gene, two modes of inheritance, four diseases: A systematic review of the cardiac manifestation of pathogenic variants in JPH2-encoded junctophilin-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We identified a total of 61 variant-positive individuals, approximately 80%
      of whom had some form of cardiac disease, including 47% HCM, 18% DCM, and
      14% arrhythmia/SCD.
    explanation: >-
      The published JPH2 case count with its phenotype breakdown. The breakdown
      is across both inheritance modes, which is why no CMD2E-specific figure is
      curated from it.
- population: Greater Middle East population and variome cohorts
  measure_type: CARRIER_FREQUENCY
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 21.0
  notes: >-
    Loss-of-function JPH2 variants are carried by 0.21% of Greater Middle Eastern
    individuals against 0.04% worldwide, a fivefold enrichment that the authors
    attribute to population structure and consanguinity. The recorded rate is the
    GME carrier frequency; the prevalence_class band refers to the resulting
    homozygote frequency, which is what the disease requires, and is therefore
    far below the carrier rate.
  evidence:
  - reference: PMID:31227780
    reference_title: Analysis of enriched rare variants in JPH2-encoded junctophilin-2 among Greater Middle Eastern individuals reveals a novel homozygous variant associated with neonatal dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Worldwide, 1.45% of healthy individuals hosted a rare JPH2 variant with a
      significantly higher proportion among GME individuals (4.45%); LOF variants
      were rare overall (0.04%) yet were most prevalent in GME (0.21%).
    explanation: >-
      The carrier frequencies for rare and loss-of-function JPH2 variants, given
      separately for the worldwide and Greater Middle Eastern populations. The
      loss-of-function figure is the one that bears on this disease, because
      missense alleles cause the dominant one.
progression:
- phase: Neonatal or early childhood presentation with systolic failure
  notes: >-
    Onset is in the neonatal period or early childhood, and the course is
    rapidly progressive. In the Iranian kindred the second family lost two
    children in childhood to cardiac failure before the variant was identified.
  evidence:
  - reference: PMID:31227780
    reference_title: Analysis of enriched rare variants in JPH2-encoded junctophilin-2 among Greater Middle Eastern individuals reveals a novel homozygous variant associated with neonatal dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A second Iranian family with consanguineous parents hosting an identical
      heterozygous variant had 2 children die in childhood from cardiac failure.
    explanation: >-
      The outcome in an affected sibship. Note the sentence describes the parents
      as heterozygous carriers of the variant that was homozygous in the affected
      children.
  - reference: PMID:30384889
    reference_title: Genetic Basis of Severe Childhood-Onset Cardiomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The KidCMP cohort presents remarkable early-onset and severe disorders: the
      median age of diagnosis was 0.33 years, and 17 patients underwent cardiac
      transplantation.
    explanation: >-
      The severity and transplantation rate of the Finnish childhood
      cardiomyopathy cohort in which JPH2 appears. It describes the whole cohort
      of 66 children rather than the JPH2 patients specifically.
pathophysiology:
- name: JPH2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function JPH2 alleles remove junctophilin-2. The reported
    recessive alleles are truncating: a homozygous single-nucleotide insertion
    producing p.E641* in consanguineous Iranian families, and a nonsense allele
    in a Finnish childhood cardiomyopathy kindred. This is the axis that
    separates CMD2E from the dominant JPH2 disease, which runs on missense
    alleles that alter the protein's regulation of the ryanodine receptor rather
    than removing it.
  genes:
  - preferred_term: JPH2
    term:
      id: hgnc:14202
      label: JPH2
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of Junctional Membrane Complex Assembly
    causal_link_type: DIRECT
    description: >-
      Junctophilin-2 is the structural protein of the complex, so removing it
      prevents the complex from forming. Demonstrated in the germline null mouse,
      whose cardiomyocytes show deficient junctional membrane complexes.
    evidence:
    - reference: PMID:10949023
      reference_title: "Junctophilins: a novel family of junctional membrane complex proteins."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cardiac myocytes from the mutant mice showed deficiency of the junctional
        membrane complexes and abnormal Ca2+ transients.
      explanation: >-
        The structural and functional consequence of losing JP-2, in the same
        cells, which is what this edge asserts.
  evidence:
  - reference: PMID:31227780
    reference_title: Analysis of enriched rare variants in JPH2-encoded junctophilin-2 among Greater Middle Eastern individuals reveals a novel homozygous variant associated with neonatal dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Family-based genetic analysis of GME individuals with cardiomyopathic
      disease identified an Iranian patient with dilated cardiomyopathy (DCM) as
      a carrier of a novel, homozygous single nucleotide insertion in JPH2
      resulting in a stop codon (JPH2-p.E641*).
    explanation: >-
      The recessive allele and its consequence, named precisely. The same paper
      notes that loss-of-function JPH2 variants had not previously been described
      in disease, only missense ones.
- name: Failure of Junctional Membrane Complex Assembly
  biological_scale: CELLULAR
  description: >-
    Without junctophilin-2 the t-tubule sarcolemma and the junctional
    sarcoplasmic reticulum are not held together, so the dyad does not assemble
    and the distance between the two membranes becomes variable. The lesion is
    geometric: nothing about either channel is altered, they are simply no longer
    reliably apposed.
  cellular_components:
  - preferred_term: T-tubule
    modifier: ABNORMAL
    term:
      id: GO:0030315
      label: T-tubule
  - preferred_term: sarcoplasmic reticulum
    term:
      id: GO:0016529
      label: sarcoplasmic reticulum
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Failure of Calcium-Induced Calcium Release
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21339484
    reference_title: Disrupted junctional membrane complexes and hyperactive ryanodine receptors after acute junctophilin knockdown in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      JPH2 deficiency resulted in loss of excitation-contraction coupling gain,
      precipitated by a reduction in the number of junctional membrane complexes
      and increased variability in the plasmalemma-sarcoplasmic reticulum
      distance.
    explanation: >-
      The geometric lesion measured directly: fewer complexes and a more variable
      membrane separation, with the functional consequence named in the same
      sentence.
  - reference: PMID:27760414
    reference_title: Junctophilin-2 gene therapy rescues heart failure by normalizing RyR2-mediated Ca(2+) release.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Junctophilin-2 (JPH2) is the primary structural protein for the coupling of
      transverse (T)-tubule associated cardiac L-type Ca channels and type-2
      ryanodine receptors on the sarcoplasmic reticulum within junctional
      membrane complexes (JMCs) in cardiomyocytes.
    explanation: >-
      States the protein's structural role and what it couples. It is the
      introduction to a gene-therapy study rather than that study's finding,
      which is why it is marked as background.
- name: Failure of Calcium-Induced Calcium Release
  biological_scale: CELLULAR
  description: >-
    With the dyad disassembled, calcium entering through the L-type channel no
    longer reliably reaches a ryanodine receptor, so the amplification step of
    excitation-contraction coupling fails. The measurable consequences are
    abnormal and asynchronous calcium transients and a loss of
    excitation-contraction coupling gain.
  biological_processes:
  - preferred_term: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    modifier: DECREASED
    term:
      id: GO:0014808
      label: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
  downstream:
  - target: Impaired Cardiac Contractility
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21339484
    reference_title: Disrupted junctional membrane complexes and hyperactive ryanodine receptors after acute junctophilin knockdown in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Excitation-contraction coupling in striated muscle requires proper
      communication of plasmalemmal voltage-activated Ca2+ channels and Ca2+
      release channels on sarcoplasmic reticulum within junctional membrane
      complexes.
    explanation: >-
      The requirement this node's failure violates. It is the paper's background
      statement of the physiology rather than its result.
    quote_role: BACKGROUND
  - reference: PMID:10949023
    reference_title: "Junctophilins: a novel family of junctional membrane complex proteins."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cardiac myocytes from the mutant mice showed deficiency of the junctional
      membrane complexes and abnormal Ca2+ transients.
    explanation: >-
      The calcium handling defect measured in null cardiomyocytes, alongside the
      structural defect that causes it.
- name: Impaired Cardiac Contractility
  biological_scale: ORGANISM
  description: >-
    Systolic dysfunction with ventricular dilation and progression to heart
    failure. In the acute knockdown mouse this is a direct and rapid consequence
    of losing junctophilin-2 in the adult heart, which matters for interpreting
    the human disease: it shows the protein is required continuously for
    contractile function, not only for building the dyad during development.
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  biological_processes:
  - preferred_term: cardiac muscle contraction
    modifier: DECREASED
    term:
      id: GO:0060048
      label: cardiac muscle contraction
  downstream:
  - target: Dilated cardiomyopathy
    causal_link_type: DIRECT
  - target: Congestive heart failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21339484
    reference_title: Disrupted junctional membrane complexes and hyperactive ryanodine receptors after acute junctophilin knockdown in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cardiac-specific JPH2 knockdown resulted in impaired cardiac
      contractility, which caused heart failure and increased mortality.
    explanation: >-
      Contractile failure and its outcome from an adult-onset, cardiac-restricted
      loss of the protein, which is the closest experimental analogue of the
      human recessive disease.

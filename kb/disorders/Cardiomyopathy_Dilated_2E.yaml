    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Congestive heart failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:21339484
    reference_title: >-
      Disrupted junctional membrane complexes and hyperactive ryanodine receptors after acute junctophilin
      knockdown in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cardiac-specific JPH2 knockdown resulted in impaired cardiac contractility, which caused heart

- name: Altered Myosin Kinetics and Reduced Force in Residual Fibres
  biological_scale: CELLULAR
  description: >-
    In fibres from patients with truncating MYH2 variants, myosin heads in the
    disordered-relaxed state consume more ATP, actomyosin kinetics are faster,
    and fibre force is reduced, alongside an acetylated MyHC IIa species.
  subtypes:
  - Autosomal recessive
  evidence:
  - reference: PMID:36745529
    reference_title: "Myosin post-translational modifications and function in the presence of myopathy-linked truncating MYH2 mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This was accompanied by 1) a higher ATP demand of myosin heads in the disordered-relaxed conformation; 2) faster actomyosin kinetics; and 3) reduced muscle fiber force."
    explanation: Ex vivo mechanics on fibres dissected from four patients.
  downstream:
  - target: Proximal muscle weakness
    causal_link_type: DIRECT
    description: Reduced fibre force contributes to weakness.

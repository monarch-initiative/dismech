    explanation: Recessive inheritance of truncating alleles.
diagnosis:
- name: Muscle biopsy with ATPase histochemistry for type 2A fibres
  description: >-
    ATPase staining or MyHC isoform immunohistochemistry to detect absent,
    reduced, or small type 2A fibres, the most consistent biopsy finding.
  evidence:
  - reference: PMID:41252304
    reference_title: "Unveiling MYH2-related myopathy: Histological-genetic insights from a case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most informative stain was ATPase, detecting the lack or reduction of type 2A fibres."
    explanation: Identifies the most informative stain.
- name: MYH2 genetic testing
  description: >-
    Exome, genome, or panel sequencing including MYH2 in patients with
    congenital or early-onset ophthalmoplegia and proximal weakness, or with a
    CPEO-like presentation and limb-girdle weakness.
  evidence:
  - reference: PMID:42491855
    reference_title: "A Novel Homozygous MYH2 Variant Causing Early-Onset External Ophthalmoplegia and Proximal Myopathy in a Consanguineous Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case expands the mutational spectrum of MYH2-associated disease and highlights the importance of genetic evaluation in children presenting with congenital ophthalmoplegia and proximal muscle weakness."
    explanation: Recommends genetic evaluation for this presentation.
  - reference: PMID:41252304
    reference_title: "Unveiling MYH2-related myopathy: Histological-genetic insights from a case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "External ophthalmoparesis, though not a defining feature, should raise suspicion of MYH2-related myopathy in patients with a CPEO-like presentation and limb-girdle weakness."
    explanation: Clinical trigger for testing.
treatments:
- name: Endurance exercise training
  description: >-
    No disease-modifying treatment exists. An eight-week endurance programme in
    six E706K patients shifted MyHC expression from fast to slow isoforms and
    increased maximal workload, without reducing MyHC IIa or changing isometric
    strength. The authors propose training as a way to alter expression of the
    defective isoform.
  treatment_term:
    preferred_term: Endurance exercise training
    term:
      id: NCIT:C62739
      label: Exercise Intervention
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Impaired MyHC IIa Motor Function
    description: >-
      Aims to shift fibres toward the slow isoform and away from the mutant
      fast isoform.
  evidence:
  - reference: PMID:14991352
    reference_title: "Induced shift in myosin heavy chain expression in myosin myopathy by endurance training."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a clear and consistent shift from fast to slow MyHC isoform expression, but the training program did not result in the desired reduction of MyHC IIa, which may be due to the limited time period of training."
    explanation: Isoform shift without reduction of MyHC IIa in six patients.
  - reference: PMID:14991352
    reference_title: "Induced shift in myosin heavy chain expression in myosin myopathy by endurance training."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients showed an increase in maximal workload but no significant change in isometric muscle strength."
    explanation: Functional outcome of the training programme.
animal_models:
- name: Drosophila E701K myosin heavy chain transgenic (IBM3 model)
  species: Drosophila melanogaster
  genotype: Mhc transgene carrying E701K (human MYH2 E706K), homozygous and heterozygous
  publication: PMID:22496423
  description: >-
    Transgenic flies expressing the fly equivalent of E706K in indirect flight
    and jump muscles, studied as homozygotes and as heterozygotes matching the
    dominant human genotype.
  modeled_mechanisms:
  - target: Impaired MyHC IIa Motor Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Purified mutant myosin shows depressed ATPase and actin sliding.
    limitations: >-
      Drosophila flight muscle expresses a single myosin heavy chain gene, so
      the fibre-type selectivity of the human disease cannot be modelled.
    evidence:
    - reference: PMID:22496423
      reference_title: "Expression of the inclusion body myopathy 3 mutation in Drosophila depresses myosin function and stability and recapitulates muscle inclusions and weakness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ATPase and actin sliding velocity of the mutant myosin were depressed >80% compared with wild-type myosin."
      explanation: Motor defect in the model.
  - target: Sarcomeric Protein Breakdown with Rimmed Vacuole Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Mutant fibres develop cytoplasmic inclusions and disorganised filaments.
    limitations: >-
      Inclusions were shown in homozygous flies; rimmed vacuoles as such are a
      human histological feature not described in the fly.
    evidence:
    - reference: PMID:22496423
      reference_title: "Expression of the inclusion body myopathy 3 mutation in Drosophila depresses myosin function and stability and recapitulates muscle inclusions and weakness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, mutant fly fibers exhibit ultrastructural hallmarks seen in patients, including cytoplasmic inclusions containing aberrant proteinaceous structures and disorganized muscle filaments."
      explanation: Inclusion pathology in the model.
  evidence:
  - reference: PMID:22496423
    reference_title: "Expression of the inclusion body myopathy 3 mutation in Drosophila depresses myosin function and stability and recapitulates muscle inclusions and weakness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our Drosophila model reveals the unambiguous consequences of the IBM-3 lesion on fast muscle myosin and fibers."
    explanation: Establishes the model.
- name: C. elegans unc-54 E710K model
  species: Caenorhabditis elegans
  genotype: unc-54 null carrying an E710K (human E706K) unc-54 extrachromosomal array
  publication: PMID:16130113
  modeled_mechanisms:
  - target: Impaired MyHC IIa Motor Function
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Mutant worms are severely paralysed despite forming thick filaments.
    limitations: >-
      Nematode body wall myosin B expressed from extrachromosomal arrays in a
      null background, so allele dosage and the heterozygous context of the
      human disease are not modelled.
    evidence:
    - reference: PMID:16130113
      reference_title: "A Caenorhabditis elegans model of the myosin heavy chain IIa E706K [corrected] mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that the MyHC E706K (E710K in C. elegans) mutation is pathogenic and that the effect is primarily functional rather than structural because thick filaments are formed."
      explanation: Functional rather than structural defect.
  evidence:
  - reference: PMID:16130113
    reference_title: "A Caenorhabditis elegans model of the myosin heavy chain IIa E706K [corrected] mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of unc-54 null mutants with extrachromosomal arrays of the unc-54 gene with the E710K mutation were severely paralyzed but showed formation of thick filaments in the body wall muscle."
    explanation: Establishes the nematode model phenotype.
differential_diagnoses:
- name: Sporadic inclusion body myositis
  description: >-
    Shares rimmed vacuoles and tubulofilamentous inclusions with the adult
    dominant form, which is why this disease was first named hereditary
    inclusion body myopathy 3. Sporadic inclusion body myositis is an acquired,
    late-onset inflammatory myopathy.
  evidence:
  - reference: PMID:11889243
    reference_title: "Myosin heavy chain IIa gene mutation E706K is pathogenic and its expression increases with age."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Young patients showed minor changes in their muscle biopsies, although dystrophic alterations and rimmed vacuoles with 15- to 20-nm tubulofilaments identical to those in sporadic inclusion body myositis (s-IBM) were observed in some of the adult (especially older) patients."
    explanation: The shared histology that motivates the differential.
- name: Chronic progressive external ophthalmoplegia of other causes
  description: >-
    Adult-onset MYH2 myopathy can present as isolated CPEO; mitochondrial
    disorders, centronuclear myopathies, congenital myasthenic syndromes, and
    oculopharyngeal muscular dystrophy are the main alternatives.
  evidence:
  - reference: PMID:37154181
    reference_title: "MYH2-related Myopathy: Expanding the Clinical Spectrum of Chronic Progressive External Ophthalmoplegia (CPEO)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYH2 myopathy has to be considered in adult patients with CPEO."
    explanation: Places MYH2 myopathy in the CPEO differential.
  - reference: PMID:37154181
    reference_title: "MYH2-related Myopathy: Expanding the Clinical Spectrum of Chronic Progressive External Ophthalmoplegia (CPEO)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CPEO is seen in various neuromuscular conditions such as mitochondrial disorders, centronuclear myopathies, congenital myasthenic syndromes and oculopharyngeal muscular dystrophy."
    explanation: Lists the alternative causes of CPEO.
- name: Oculopharyngodistal myopathy
  description: >-
    A de novo dominant MYH2 tail variant produced a distal, bulbar, and ocular
    phenotype first classified as oculopharyngodistal myopathy.
  evidence:
  - reference: PMID:25529940
    reference_title: "Adult onset distal and proximal myopathy with complete ophthalmoplegia associated with a novel de novo p.(Leu1877Pro) mutation in MYH2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This expands the phenotype of dominant MYH2 myopathies with the clinical phenotype overlapping the oculopharyngodistal myopathy spectrum."
    explanation: Phenotypic overlap with oculopharyngodistal myopathy.
- name: Congenital myasthenic syndromes
  description: >-
    Recessive MYH2 myopathy with congenital ptosis and ophthalmoplegia overlaps
    clinically with neuromuscular junction disorders.
  evidence:
  - reference: PMID:42491855
    reference_title: "A Novel Homozygous MYH2 Variant Causing Early-Onset External Ophthalmoplegia and Proximal Myopathy in a Consanguineous Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive MYH2-related myopathy is uncommon and may be difficult to recognize because of overlapping clinical features with neuromuscular junction disorders."
    explanation: Overlap with neuromuscular junction disorders.
prevalence:
- population: Western Sweden, 1985-2022
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.9
  rate_low: 0.8
  rate_high: 17.6
  rate_denominator: LIVE_BIRTHS
  notes: >-
    Birth prevalence 3.9 per 100,000 live births (95% CI 0.8 to 17.6), the
    highest of any gene in a population-based study of congenital myopathies.
    The figure is dominated by one family with 20 affected members and the
    authors know of no Swedish MYH2 founder variant, so it should not be
    generalised beyond this region.
  evidence:
  - reference: PMID:41159764
    reference_title: "Incidence and Prevalence of Congenital Myopathies - A Population-Based Study From Western Sweden."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common genetic causes were MYH2 and RYR1 (Fig 3B), with birth prevalences of 3.9 per 100.000 (95% CI = 0.8 to 17.6) and 2.0 per 100,000 (95% CI = 1.0 to 4.0), respectively."
    explanation: Regional birth prevalence of MYH2 congenital myopathy.
  - reference: PMID:41159764
    reference_title: "Incidence and Prevalence of Congenital Myopathies - A Population-Based Study From Western Sweden."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This was at least partly explained by a variant identified in 20 affected individuals from one family."
    explanation: The estimate reflects one large family.
- population: Western Sweden, 1985-2022
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.1
  rate_low: 0.2
  rate_high: 4.9
  notes: Point prevalence 1.1 per 100,000 inhabitants (95% CI 0.2 to 4.9).
  evidence:
  - reference: PMID:41159764
    reference_title: "Incidence and Prevalence of Congenital Myopathies - A Population-Based Study From Western Sweden."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common causative genes were MYH2 at 1.1 per 100,000 inhabitants (95% CI = 0.2 to 4.9) and RYR1 at 0.6 per 100,000 inhabitants (95% CI = 0.3 to 1.2)."
    explanation: Regional point prevalence.

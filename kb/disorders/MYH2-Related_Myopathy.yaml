genetic:
- name: MYH2
  gene_term:
    preferred_term: MYH2
    term:
      id: hgnc:7572
      label: MYH2
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    Encodes myosin heavy chain IIa, the major isoform of fast type 2A fibres, in
    the skeletal myosin heavy chain cluster on chromosome 17p13. Dominant alleles
    are motor-domain (E706K) or distal-tail missense and splice variants;
    recessive alleles are truncating, splice, or missense variants. Sequencing of
    50 control individuals found little coding variation in MYH2, consistent
    with strong selective constraint.
  variants:
  - name: c.2116G>A p.(Glu706Lys)
    description: >-
      Founding dominant motor-domain variant (E706K) in the SH1 helix, from the
      original Swedish family.
    gene:
      preferred_term: MYH2
      term:
        id: hgnc:7572
        label: MYH2
    evidence:
    - reference: PMID:11114175
      reference_title: "Autosomal dominant myopathy: missense mutation (Glu-706 --> Lys) in the myosin heavy chain IIa gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a missense mutation, Glu-706 --> Lys, which is located in a highly conserved region of the motor domain, the so-called SH1 helix region."
      explanation: Variant identification.
  - name: c.5673+1G>C (exon 39 skipping)
    description: >-
      Dominant splice-donor variant causing in-frame skipping of exon 39 and
      loss of residues 1860-1891 of the distal tail.
    gene:
      preferred_term: MYH2
      term:
        id: hgnc:7572
        label: MYH2
    evidence:
    - reference: PMID:36380287
      reference_title: "Dominantly inherited myosin IIa myopathy caused by aberrant splicing of MYH2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole-genome sequencing identified a heterozygous MYH2 variant, segregating with the disease in the three affected individuals: c.5673 + 1G > C."
      explanation: Segregating dominant splice variant.
  evidence:
  - reference: PMID:11114175
    reference_title: "Autosomal dominant myopathy: missense mutation (Glu-706 --> Lys) in the myosin heavy chain IIa gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here report on a human myopathy associated with a mutation in a fast myosin heavy chain (MyHC) gene, and also the genetic defect in a hereditary inclusion body myopathy."
    explanation: First report of MYH2 as the causal gene.
  - reference: PMID:20418530
    reference_title: "Human disease caused by loss of fast IIa myosin heavy chain due to recessive MYH2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients were compound heterozygous for truncating mutations in MYH2. The parents were unaffected, consistent with recessive mutations."
    explanation: Establishes recessive MYH2 disease.
  - reference: PMID:15741996
    reference_title: "Mutations and sequence variation in the human myosin heavy chain IIa gene (MYH2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of the analysis of normal variation indicate that there is strong selective pressure against mutations in MYH2."
    explanation: Constraint on MYH2 variation in controls.
inheritance:

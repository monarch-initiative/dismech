  downstream:
  - target: External ophthalmoplegia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Ophthalmoplegia is the most consistent clinical sign of both forms. Why the
      extraocular muscles are so vulnerable to MyHC IIa loss is not explained by
      the cited sources.
  - target: Proximal muscle weakness
    causal_link_type: DIRECT
    description: Loss of fast type 2A fibres reduces limb muscle force.
  - target: Weakness of facial musculature

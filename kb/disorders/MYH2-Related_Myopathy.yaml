name: MYH2-Related Myopathy
creation_date: "2026-09-28T12:50:06Z"
description: >-
  MYH2-related myopathy (myopathy, proximal, and ophthalmoplegia; MYPOP) is a
  congenital myosin myopathy caused by pathogenic variants in MYH2, which encodes
  myosin heavy chain IIa (MyHC IIa), the motor isoform that defines fast type 2A
  skeletal muscle fibres. It is inherited in both an autosomal dominant and an
  autosomal recessive manner, and the two forms reach a shared clinical core,
  external ophthalmoplegia with predominantly proximal limb weakness, by
  different molecular routes.

  The dominant form was the first human myopathy traced to a skeletal myosin
  heavy chain gene. The founding Swedish family carries the E706K missense
  change in the SH1 helix of the motor domain; affected members are born with
  joint contractures that resolve in early childhood, have ophthalmoplegia and a
  mild childhood myopathy, and deteriorate from the fourth or fifth decade, when
  biopsies show dystrophic change and rimmed vacuoles with 15- to 21-nm
  tubulofilamentous inclusions. That late pathology is why the disorder was first
  named hereditary inclusion body myopathy 3. The mutant motor is profoundly
  impaired and structurally labile, and the degenerative changes track the level
  of mutant protein expressed. Other dominant alleles lie in the distal tail and
  impair thick filament assembly rather than the motor.

  The recessive form is a loss-of-function disease: biallelic truncating, splice,
  or missense variants leave little or no MyHC IIa protein, and biopsies show
  small or absent type 2A fibres with type 1 predominance, usually without
  vacuoles. It is typically early-onset, mild, and slowly progressive or static,
  although recessive genotypes with dominant-like vacuolar pathology are
  reported. Across the literature, ophthalmoparesis and proximal weakness are
  each present in close to nine in ten patients, facial and neck flexor weakness
  in more than half, and ptosis in about one in five.
category: Mendelian
disease_term:
  preferred_term: myopathy, proximal, and ophthalmoplegia
  term:
    id: MONDO:0011577
    label: myopathy, proximal, and ophthalmoplegia
synonyms:
- MYPOP
- MYH2 myopathy
- Myosin IIa myopathy
- Hereditary myosin myopathy with external ophthalmoplegia
- Inclusion body myopathy 3, autosomal dominant
- Myopathy with congenital joint contractures, ophthalmoplegia, and rimmed vacuoles
notes: >-
  Scope. This entry covers every MYH2 myopathy, dominant and recessive, as MONDO
  does: MONDO:0011577 (OMIM:605637) is defined as any congenital myopathy caused
  by a mutation in MYH2, with both inheritance patterns, and its two MONDO
  children (MONDO:0019195, the Orphanet dominant hereditary inclusion body
  myopathy-joint contractures-ophthalmoplegia syndrome, and MONDO:0018206,
  childhood-onset autosomal recessive myopathy with external ophthalmoplegia)
  are carried as has_subtypes rows rather than separate entries. MONDO also
  files MONDO:0011577 under inclusion body myositis (MONDO:0007827). That
  placement reflects the historical name inclusion body myopathy 3 and the
  rimmed vacuoles of the dominant form; the disease shares no mechanism with
  sporadic inclusion body myositis, which is an acquired inflammatory and
  degenerative myopathy curated separately as Inclusion_Body_Myositis.

  The dominant and recessive forms are not cleanly separable by phenotype.
  Rimmed vacuoles and progressive proximal weakness, the features that defined
  the dominant form, are reported with a homozygous missense genotype
  (p.Arg246His), and a dominant distal-tail splice variant produces a
  progressive myopathy without ophthalmoplegia. Subtype attribution on
  phenotypes below therefore marks where a feature was characterised, not a
  feature restricted to that form.

  Frequencies are cohort proportions from a systematic literature review of 86
  published patients, not population estimates. That review's own 13-patient
  series had later onset, no congenital contractures, and no rimmed vacuoles,
  so the literature proportions are weighted toward the early Swedish dominant
  family.

  No GeneReviews chapter exists for this disease.
has_subtypes:
- name: Autosomal dominant
  display_name: Autosomal dominant MYH2 myopathy (hereditary inclusion body myopathy 3)
  subtype_term:
    preferred_term: hereditary inclusion body myopathy-joint contractures-ophthalmoplegia syndrome
    term:
      id: MONDO:0019195
      label: hereditary inclusion body myopathy-joint contractures-ophthalmoplegia syndrome
  genes:
  - preferred_term: MYH2
    term:
      id: hgnc:7572
      label: MYH2
  description: >-
    Heterozygous MYH2 variants. The prototype is the E706K motor-domain missense
    variant in the original Swedish family, with congenital joint contractures
    that normalise in early childhood, external ophthalmoplegia, proximal
    weakness that is static in childhood and progressive from adulthood, and
    rimmed vacuoles with tubulofilamentous inclusions in older patients. Other
    dominant alleles, several de novo, lie in the distal tail around the
    assembly competence domain (L1870P, L1877P, and a splice variant skipping
    exon 39) and give neonatal, oculopharyngodistal-like, or ophthalmoplegia-free
    presentations. MONDO:0019195 is the Orphanet concept defined on the E706K
    phenotype; the tail-variant presentations are included here by inheritance
    rather than because they match that phenotype.
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:9708547
      reference_title: "Autosomal dominant myopathy with congenital joint contractures, ophthalmoplegia, and rimmed vacuoles."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We describe a new myopathy in a large family with 19 affected cases. Inheritance was autosomal dominant."
      explanation: >-
        The original description of the dominant form in a 19-case family.
  evidence:
  - reference: PMID:11114175
    reference_title: "Autosomal dominant myopathy: missense mutation (Glu-706 --> Lys) in the myosin heavy chain IIa gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a missense mutation, Glu-706 --> Lys, which is located in a highly conserved region of the motor domain, the so-called SH1 helix region."
    explanation: >-
      Identifies the E706K variant in the family originally described with
      autosomal dominant myopathy with joint contractures, ophthalmoplegia, and
      rimmed vacuoles.
  - reference: PMID:36380287
    reference_title: "Dominantly inherited myosin IIa myopathy caused by aberrant splicing of MYH2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whereas recessive MyHC IIa myopathy has been described in many cases, myopathy caused by dominant MYH2 variants is rare and has been described with clinical manifestations and muscle pathology in only one family and two sporadic cases."
    explanation: >-
      Records how few dominant families and sporadic cases were known when the
      splice-variant family was reported.

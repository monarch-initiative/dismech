pathophysiology:
- name: MYH2 E706K Motor-Domain Missense Variant
  biological_scale: MOLECULAR
  description: >-
    The founding dominant allele. Glu706 lies in the SH1 helix, the region of
    the motor domain that transmits conformational change at the
    nucleotide-binding site to the neck and so drives the lever-arm swing. A
    charge reversal there is predicted to cripple the motor.
  genes:
  - preferred_term: MYH2
    term:
      id: hgnc:7572
      label: MYH2
  subtypes:
  - Autosomal dominant
  evidence:
  - reference: PMID:11114175
    reference_title: "Autosomal dominant myopathy: missense mutation (Glu-706 --> Lys) in the myosin heavy chain IIa gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By conformational changes this region communicates activity at the nucleotide-binding site to the neck region, resulting in the lever arm swing. The mutation in this region is likely to result in a dysfunctional myosin, compatible with the disorder in the family."
    explanation: >-
      Places the variant in the SH1 helix and states the predicted functional
      consequence.
  downstream:
  - target: Impaired MyHC IIa Motor Function
    causal_link_type: DIRECT
    description: >-
      The substitution directly degrades the chemomechanical cycle of the mutant
      heavy chain.
  - target: Multiple congenital joint contractures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Congenital contractures that resolve in early childhood are part of the
      E706K phenotype. The cited sources establish the association, not the
      mechanism; reduced fetal muscle function is the presumed but unmeasured
      intermediate.
- name: Impaired MyHC IIa Motor Function
  biological_scale: MOLECULAR
  description: >-
    Mutant MyHC IIa hydrolyses ATP and moves actin far more slowly than wild
    type. The defect was measured in the in vitro motility assay on myosin from
    patient muscle and in purified homozygous Drosophila myosin, and persists in
    heterozygous flies as a reduced rate of strong actin binding. The C. elegans
    model shows the lesion is primarily functional, since thick filaments still
    form.
  cell_types:
  - preferred_term: type IIa muscle fibre
    term:
      id: CL:0002214
      label: type IIa muscle cell
  molecular_functions:
  - preferred_term: myosin IIa motor activity
    modifier: DECREASED
    term:
      id: GO:0000146
      label: microfilament motor activity
  subtypes:
  - Autosomal dominant
  evidence:
  - reference: PMID:17005402
    reference_title: "Muscle cell and motor protein function in patients with a IIa myosin missense mutation (Glu-706 to Lys)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A dramatic impairment in the function of the IIa MyHC isoform was observed at the motor protein level."
    explanation: >-
      Single-fibre and in vitro motility measurements on biopsies from E706K
      patients, studied ex vivo.
  - reference: PMID:22496423
    reference_title: "Expression of the inclusion body myopathy 3 mutation in Drosophila depresses myosin function and stability and recapitulates muscle inclusions and weakness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ATPase and actin sliding velocity of the mutant myosin were depressed >80% compared with wild-type myosin."
    explanation: >-
      Purified homozygous E701K (human E706K) Drosophila myosin quantifies the
      motor defect.
  - reference: PMID:28258125
    reference_title: "A Drosophila model of dominant inclusion body myopathy type 3 shows diminished myosin kinetics that reduce muscle power and yield myofibrillar defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Rate constant analyses suggest a decrease in the rate of myosin attachment to actin, with myosin spending decreased time in the strongly bound state."
    explanation: >-
      Heterozygous flies, the genotype that matches the dominant human disease,
      retain a kinetic motor defect.
  - reference: PMID:16130113
    reference_title: "A Caenorhabditis elegans model of the myosin heavy chain IIa E706K [corrected] mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that the MyHC E706K (E710K in C. elegans) mutation is pathogenic and that the effect is primarily functional rather than structural because thick filaments are formed."
    explanation: >-
      The nematode model separates the functional motor defect from a
      filament-assembly defect.
  downstream:
  - target: Mutant Myosin Instability and Aggregation
    causal_link_type: DIRECT
    description: >-
      The same substitution that impairs the motor renders the head domain
      labile, so it collapses and aggregates.
  - target: Focal Myofilament Disorganization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced power output from the mutant motor is proposed to produce focal
      myofibrillar disorganisation, the principal childhood lesion.
  - target: Proximal muscle weakness
    causal_link_type: DIRECT
    description: >-
      Fibres that incorporate a crippled motor generate less power, the
      functional basis of the early, non-progressive weakness.
- name: Mutant Myosin Instability and Aggregation
  biological_scale: MOLECULAR
  description: >-
    E706K myosin heads have a strong propensity to collapse and aggregate, and
    in patient muscle the mutant transcript outstrips the corresponding protein,
    consistent with increased turnover of the mutant heavy chain. This is the
    route from a motor lesion to the protein-aggregate pathology of the adult
    disease.
  subtypes:
  - Autosomal dominant
  evidence:
  - reference: PMID:22496423
    reference_title: "Expression of the inclusion body myopathy 3 mutation in Drosophila depresses myosin function and stability and recapitulates muscle inclusions and weakness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Light scattering experiments and electron microscopy revealed that mutant myosin heads bear a dramatic propensity to collapse and aggregate."
    explanation: >-
      Direct biophysical evidence of the instability of the mutant head.
  - reference: PMID:11889243
    reference_title: "Myosin heavy chain IIa gene mutation E706K is pathogenic and its expression increases with age."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The relative level of MyHC IIa transcripts exceeded that of the corresponding protein, indicating an increased turnover of mutated protein."
    explanation: >-
      Patient biopsies show the protein deficit relative to transcript that the
      instability predicts.
  downstream:
  - target: Sarcomeric Protein Breakdown with Rimmed Vacuole Formation
    causal_link_type: DIRECT
    description: >-
      Aggregated and misfolded myosin is not cleared efficiently, and the
      breakdown products accumulate in vacuolated fibres.
- name: Sarcomeric Protein Breakdown with Rimmed Vacuole Formation
  biological_scale: CELLULAR
  description: >-
    In older patients with the dominant form, fibres expressing MyHC IIa develop
    rimmed vacuoles and cytoplasmic and intranuclear inclusions of 15- to 21-nm
    tubulofilaments like those of sporadic inclusion body myositis. Rimmed
    vacuoles are consistently found in fibres expressing the mutant isoform, and
    the aggregates carry features of defective degradation of misfolded protein.
  cell_types:
  - preferred_term: type IIa muscle fibre
    term:
      id: CL:0002214
      label: type IIa muscle cell
  subtypes:
  - Autosomal dominant
  evidence:
  - reference: PMID:11889243
    reference_title: "Myosin heavy chain IIa gene mutation E706K is pathogenic and its expression increases with age."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The consistent expression of MyHC IIa in muscle fibers with rimmed vacuoles indicates that the breakdown of sarcomeric proteins is a key element in the pathogenesis of rimmed vacuoles of s-IBM type."
    explanation: >-
      Ties rimmed vacuole formation to fibres expressing the mutant isoform.
  - reference: PMID:22918376
    reference_title: "Myosinopathies: pathology and mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Protein aggregates in the form of tubulofilamentous inclusions in association with vacuolated muscle fibers are present at late stage of dominant myosin IIa myopathy and sometimes in Laing distal myopathy. These protein aggregates exhibit features indicating defective degradation of misfolded proteins."
    explanation: >-
      Review synthesis placing the inclusions at the late stage of the dominant
      disease and attributing them to defective degradation.
  - reference: PMID:22496423
    reference_title: "Expression of the inclusion body myopathy 3 mutation in Drosophila depresses myosin function and stability and recapitulates muscle inclusions and weakness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, mutant fly fibers exhibit ultrastructural hallmarks seen in patients, including cytoplasmic inclusions containing aberrant proteinaceous structures and disorganized muscle filaments."
    explanation: >-
      The Drosophila E701K model recapitulates the inclusion pathology.
  downstream:
  - target: Rimmed vacuoles
    causal_link_type: DIRECT
    description: The histological readout of this node.
  - target: Muscle fiber cytoplasmatic inclusion bodies
    causal_link_type: DIRECT
    description: Tubulofilamentous aggregates in the cytoplasm of affected fibres.
  - target: Muscle fiber intranuclear inclusion bodies
    causal_link_type: DIRECT
    description: The same filaments are also found within myonuclei.
  - target: Progressive Muscle Fibre Degeneration
    causal_link_type: DIRECT
    description: >-
      Protein breakdown and aggregation accompany the dystrophic change of the
      adult disease.

    Dominant variants in the light meromyosin region of the tail, including the
    de novo L1870P and L1877P missense changes and a splice variant that deletes
    residues 1860-1891, fall in or near the assembly competence domain. In vitro,
    MYH2 tail mutants have disrupted coiled-coil structure and filament packing,
    and L1870P reduces helical content.

- name: Progressive Muscle Fibre Degeneration
  biological_scale: TISSUE
  description: >-
    In adults with the dominant form, deterioration of muscle function from 30 to
    50 years of age coincides with dystrophic change, and the extent of pathology
    tracks the level of mutant MyHC IIa expressed. Young patients express the
    isoform at undetectable levels and have minor pathology.
  subtypes:
  - Autosomal dominant
  evidence:
  - reference: PMID:11889243
    reference_title: "Myosin heavy chain IIa gene mutation E706K is pathogenic and its expression increases with age."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Young patients with muscle weakness and minor pathologic changes in muscle expressed MyHC IIa at undetectable levels. MyHC IIa was expressed at high levels in adults with a progressive clinical course and dystrophic muscle changes."
    explanation: >-
      Correlates mutant isoform expression with dystrophic change and
      progression.
  - reference: PMID:11889243
    reference_title: "Myosin heavy chain IIa gene mutation E706K is pathogenic and its expression increases with age."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clear correlation between pathologic changes and expression of MyHC IIa indicates that defects in MyHC may lead not only to muscle weakness but also to muscle degeneration."
    explanation: The authors' conclusion that the myosin defect drives degeneration.
  - reference: PMID:9708547
    reference_title: "Autosomal dominant myopathy with congenital joint contractures, ophthalmoplegia, and rimmed vacuoles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In adults with progressive muscle weakness, the muscle biopsies showed dystrophic changes and rimmed vacuoles with cytoplasmic and intranuclear inclusions of 15- to 21-nm filaments."
    explanation: Adult biopsy pathology in the original family.
  downstream:
  - target: Progressive proximal muscle weakness in adulthood

    reference_title: "Human disease caused by loss of fast IIa myosin heavy chain due to recessive MYH2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings show that null mutations in the fast myosin heavy chain IIa gene cause early onset myopathy and demonstrate that this isoform is necessary for normal muscle development and function."
    explanation: Links absence of the isoform to the myopathy.

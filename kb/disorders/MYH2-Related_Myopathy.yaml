  - reference: PMID:23489661
    reference_title: "A new de novo missense mutation in MYH2 expands clinical and genetic findings in hereditary myosin myopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a new de novo MYH2 missense mutation in a baby affected by a congenital myopathy characterized by severe dysphagia, respiratory distress at birth and external ophthalmoplegia."

- name: Fever-Sensitive Sodium Channel Decompensation
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Proposed explanation for the attacks of episodic ataxia: with Nav
    availability already reduced, fever or other stressors push cerebellar
    excitability below threshold for days at a time. It rests on clinical
    observations (fever-triggered attacks, response to acetazolamide) and on
    the known temperature sensitivity of sodium channels; it has not been
    tested experimentally in an FGF14 model.
  downstream:
  - target: Episodic ataxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32162847
      reference_title: "FGF14-related episodic ataxia: delineating the phenotype of Episodic Ataxia type 9."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Attacks were triggered by fever, lasted several days, and had variable frequencies."
      explanation: Fever precipitates the episodic attacks in two families.

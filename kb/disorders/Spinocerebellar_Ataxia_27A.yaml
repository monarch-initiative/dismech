differential_diagnoses:
- name: Spinocerebellar ataxia 27B
  description: >-
    Allelic disorder caused by a heterozygous intronic GAA repeat expansion in
    FGF14. It is far more common, starts late in adult life and is not detected
    by standard exome or short-read sequencing, so the repeat must be sized
    separately.
  distinguishing_features:
  - Intronic GAA repeat expansion rather than a coding or structural variant
  - Late adult onset without the childhood tremor and neurodevelopmental features of SCA27A
  evidence:
  - reference: PMID:40156335
    reference_title: "Novel In-Frame FGF14 Deletion Causes Spinocerebellar Ataxia Type 27A: Clinical Response to Deep Brain Stimulation and 4-Aminopyridine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "This led to the assignment of two different names to the allelic disorders: SCA27A for ataxia caused by the rare coding variants and SCA27B (OMIM #620174) for ataxia caused by the more common intronic repeat expansion."
    explanation: Defines the two allelic disorders.
- name: Episodic ataxia types 1 and 2
  description: >-
    KCNA1 and CACNA1A episodic ataxias are the commonest genetic causes of
    episodic ataxia and are on the same gene panels.
  distinguishing_features:
  - Fever triggering, childhood postural tremor and learning disability point towards FGF14
  evidence:
  - reference: PMID:25566820
    reference_title: A novel frameshift mutation in FGF14 causes an autosomal dominant episodic ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mutations in KCNA1 and CACNA1A account for the majority of EA cases worldwide."
    explanation: Establishes the main alternative causes of episodic ataxia.
- name: Paroxysmal non-kinesigenic dyskinesia
  description: >-
    PNKD caused by MR-1 (PNKD) variants can be mimicked by FGF14 disruption.
  evidence:
  - reference: PMID:21600715
    reference_title: Spinocerebellar ataxias type 27 derived from a disruption of the fibroblast growth factor 14 gene with mimicking phenotype of paroxysmal non-kinesigenic dyskinesia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This indicated genetic heterogeneity of PNKD, since 60% of the patients with PNKD exhibit mutations in another gene responsible for PNKD, the myofibrillogenesis regulator 1 gene (MR-1)."
    explanation: PNKD-like presentation with FGF14 disruption.
- name: Isolated early-onset nystagmus
  description: >-
    Apparently isolated infantile nystagmus may be the presenting feature of an
    FGF14 deletion.
  evidence:
  - reference: PMID:36207621
    reference_title: Analysis of Fibroblast Growth Factor 14 (FGF14) structural variants reveals the genetic basis of the early onset nystagmus locus NYS4 and variable ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, our study reveals the genetic variant underlying NYS4, expands the spectrum of pathogenic FGF14 variants, and highlights the importance of screening FGF14 in apparently isolated early onset nystagmus."
    explanation: Recommends FGF14 screening in isolated early nystagmus.
diagnosis:
- name: Sequencing with copy-number analysis
  description: >-
    Exome or genome sequencing, or an ataxia or episodic-ataxia gene panel,
    combined with copy-number analysis (SNP array or sequencing-based CNV
    calling), since deletions are a common mechanism. Karyotyping detects
    balanced translocations.
  evidence:
  - reference: PMID:24252256
    reference_title: A new variable phenotype in spinocerebellar ataxia 27 (SCA 27) caused by a deletion in the FGF14 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This family demonstrates phenotypic variability of FGF14 deletions (SCA 27), fever sensitivity of ataxia and the added value of SNP-array analysis in making a diagnosis."
    explanation: SNP-array detected the causal deletion.
animal_models:
- name: Fgf14 F145S knock-in mouse
  species: Mouse
  genotype: Fgf14 F145S/+ (heterozygous knock-in of the first human SCA27A allele)
  description: >-
    Carries the founding patient allele at the mouse locus. Purkinje neurons
    fire in bursts, iFGF14 protein is reduced and Nav inactivation is shifted
    to more negative voltages, matching the heterozygous null.
  publication: PMID:41558966
  evidence:
  - reference: PMID:41558966
    reference_title: In Vivo Expression of an SCA27A-Linked FGF14 Mutation Results in Haploinsufficiency and Impaired Firing of Cerebellar Purkinje Neurons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To investigate the in vivo mechanisms underlying SCA27A, we developed a targeted knock-in strategy to introduce the first point mutation identified in FGF14 into the mouse Fgf14 locus (Fgf14F145S )."
    explanation: Describes construction of the knock-in model.
  modeled_mechanisms:
  - target: Impaired Purkinje Neuron Repetitive Firing
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Same genotype as the patients; reproduces the firing defect and its Nav basis.
    limitations: >-
      Reproduces the cellular defect but not the motor phenotype: knock-in
      and heterozygous null mice performed like wild type on the elevated
      balance beam.
    evidence:
    - reference: PMID:41558966
      reference_title: In Vivo Expression of an SCA27A-Linked FGF14 Mutation Results in Haploinsufficiency and Impaired Firing of Cerebellar Purkinje Neurons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Together, these results indicate that Fgf14 haploinsufficiency and reduced Nav channel availability underlie impaired firing in Fgf14F145S/+ Purkinje neurons."
      explanation: Establishes the knock-in as a model of the firing node.
- name: Fgf14 knockout mouse
  species: Mouse
  genotype: Fgf14 -/- (Fgf14 N-beta-Gal allele)
  description: >-
    Homozygous null mice develop ataxia and a paroxysmal hyperkinetic movement
    disorder, have reduced responses to dopamine agonists, silent Purkinje
    neurons with reduced Nav1.6, and impaired spatial learning with defective
    hippocampal LTP.
  publication: PMID:12123606
  evidence:
  - reference: PMID:12123606
    reference_title: Ataxia and paroxysmal dyskinesia in mice lacking axonally transported FGF14.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Fgf14-deficient mice were viable, fertile, and anatomically normal, but developed ataxia and a paroxysmal hyperkinetic movement disorder."
    explanation: Whole-animal phenotype of the null mouse.
  modeled_mechanisms:
  - target: Impaired Purkinje Neuron Repetitive Firing
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Homozygous loss, whereas patients are heterozygous; the null phenotype is
      more severe (most Purkinje cells silent rather than bursting).
    evidence:
    - reference: PMID:18930825
      reference_title: FGF14 regulates the intrinsic excitability of cerebellar Purkinje neurons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice with a targeted disruption of the Fgf14 locus (Fgf14(-/-)) develop ataxia resembling human SCA27."
      explanation: The null mouse is an accepted model of the human ataxia.
  - target: Impaired Hippocampal Synaptic Plasticity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      Mouse spatial-learning assays are a proxy for human cognitive
      impairment, the LTP defect has not been examined in patients, and the
      genotype is homozygous whereas patients are heterozygous.
    evidence:
    - reference: PMID:17236779
      reference_title: Impaired spatial learning and defective theta burst induced LTP in mice lacking fibroblast growth factor 14.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we extend the similarities between Fgf14(-/-) mice and FGF14(F145S) humans by showing that Fgf14(-/-) mice exhibit reliable acquisition (place learning) deficits in the Morris water maze."
      explanation: Learning deficits parallel the human cognitive phenotype.
  - target: Basal Ganglia Dopaminergic Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      Reduced responses to dopamine agonists in mice are a pharmacological
      proxy for basal ganglia dysfunction; the paroxysmal hyperkinetic disorder
      of the homozygous null is more severe than the dyskinesia of
      heterozygous patients.
    evidence:
    - reference: PMID:12123606
      reference_title: Ataxia and paroxysmal dyskinesia in mice lacking axonally transported FGF14.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Neuropharmacological studies showed that Fgf14-deficient mice have reduced responses to dopamine agonists."
      explanation: Altered dopaminergic responses in the null mouse model the basal ganglia node.
- name: Sheep familial episodic ataxia
  species: Sheep
  genotype: FGF14 c.46C>T (p.Q16*) heterozygous, naturally occurring
  description: >-
    Familial episodic ataxia of newborn lambs, autosomal dominant with variable
    expressivity; signs resolve as the lambs mature. A more severely affected
    homozygous lamb was observed. The authors describe the association as
    potential.
  publication: PMID:29253853
  evidence:
  - reference: PMID:29253853
    reference_title: Familial episodic ataxia in lambs is potentially associated with a mutation in the fibroblast growth factor 14 (FGF14) gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Familial episodic ataxia of lambs is a congenital transient autosomal dominant disorder of newborn lambs, with varying expressivity."
    explanation: Naturally occurring dominant episodic ataxia in sheep with an FGF14 truncating variant.
notes: >-
  The GAA repeat-expansion disease in the same gene is curated separately as
  Spinocerebellar_Ataxia_27B; evidence from SCA27B studies, including the
  larger 4-aminopyridine literature, is deliberately not used here. No
  GeneReviews chapter exists for SCA27A. Two patient-derived iPSC lines (PMID:42372627) exist
  but have no phenotype data yet.

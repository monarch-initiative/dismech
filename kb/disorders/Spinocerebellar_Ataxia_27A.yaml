    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25926453
      reference_title: Intracellular FGF14 (iFGF14) Is Required for Spontaneous and Evoked Firing in Cerebellar Purkinje Neurons and for Motor Coordination and Balance.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The selective shRNA-mediated in vivo \"knock-down\" of iFGF14 in adult Purkinje neurons also impairs motor coordination and balance."
      explanation: Removing iFGF14 from adult Purkinje neurons alone is enough to cause incoordination.
    - reference: PMID:25926453
      reference_title: Intracellular FGF14 (iFGF14) Is Required for Spontaneous and Evoked Firing in Cerebellar Purkinje Neurons and for Motor Coordination and Balance.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We also show here that expressing iFGF14 selectively in adult Fgf14(-/-) Purkinje neurons rescues spontaneous firing and improves motor performance."
      explanation: Restoring Purkinje firing improves motor performance, linking the firing defect to the motor phenotype.
    - reference: PMID:41558966
      reference_title: In Vivo Expression of an SCA27A-Linked FGF14 Mutation Results in Haploinsufficiency and Impaired Firing of Cerebellar Purkinje Neurons.
      supports: REFUTE
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "The results here also revealed that adult (6–8-week-old) Fgf14+/− and Fgf14F145S/+ animals, which express one wild-type Fgf14 allele, performed similarly to age-matched wild-type controls on the elevated balance beam test, indicating that mice harboring a single Fgf14F145S mutation do not recapitulate the motor phenotypes expressed in humans."
      explanation: >-
        Mice with one mutant or null allele have the firing defect but no
        measurable balance deficit, so a single-copy firing defect has not
        been shown to be sufficient for ataxia in mice.

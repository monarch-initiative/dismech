name: Spinocerebellar Ataxia 27A
creation_date: "2026-10-01T00:00:00Z"
category: Mendelian
synonyms:
- SCA27A
- SCA27
- spinocerebellar ataxia type 27
- ATX-FGF14
- FGF14-related spinocerebellar ataxia
- nystagmus 4, congenital, autosomal dominant
- NYS4
description: >-
  Spinocerebellar ataxia 27A (SCA27A, ATX-FGF14) is a rare, usually autosomal
  dominant cerebellar disorder caused by heterozygous loss-of-function changes
  in FGF14: missense, nonsense, frameshift, splice and in-frame variants,
  13q33.1 deletions, a partial duplication and gene-disrupting translocations.
  FGF14 encodes intracellular fibroblast growth factor 14 (iFGF14), a
  non-secreted protein that binds the C-terminus of voltage-gated sodium (Nav)
  channel alpha subunits and keeps them available for firing. In mice, loss of one
  copy shifts Purkinje neuron Nav inactivation to more negative voltages, so the
  cells lose their tonic high-frequency firing. The typical picture is a
  childhood-onset postural tremor followed by a very slowly progressive
  cerebellar ataxia from young adulthood, with nystagmus, dysarthria,
  dyskinesia, cognitive and psychiatric features, and in some families
  fever-triggered episodic ataxia. SCA27A is distinct from SCA27B, the common
  late-onset ataxia caused by an intronic GAA repeat expansion in the same
  gene.

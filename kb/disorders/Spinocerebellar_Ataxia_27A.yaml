genetic:
- name: FGF14
  gene_term:
    preferred_term: FGF14
    term:
      id: hgnc:3671
      label: FGF14
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Heterozygous coding, splice and structural loss-of-function variants in
    FGF14 cause SCA27A. Point variants are a rare cause of dominant ataxia: one
    frameshift was found among 208 unrelated familial ataxia cases. The
    intronic GAA expansion in the same gene causes the separate disease SCA27B
    and is not part of this entry.
  evidence:
  - reference: PMID:15470364
    reference_title: "Mutation analysis in the fibroblast growth factor 14 gene: frameshift mutation and polymorphisms in patients with inherited ataxias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one patient, we detected a novel single base pair deletion in exon 4 (c.487delA) creating a frameshift mutation."
    explanation: One frameshift among 208 familial ataxia cases, showing the gene is a rare cause.
  - reference: PMID:39704271
    reference_title: The First Case of Autosomal Recessive Cerebellar Ataxia with Prominent Paroxysmal Non-kinesigenic Dyskinesia Caused by a Truncating FGF14 Variant in a Turkish Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATX-FGF/SCA27A has been exclusively associated with heterozygous variants in the FGF14 gene, presenting with postural tremor, slowly progressive cerebellar ataxia, and psychiatric and behavioral disturbances."
    explanation: Summarizes the established gene-disease relationship.
  - reference: PMID:40156335
    reference_title: "Novel In-Frame FGF14 Deletion Causes Spinocerebellar Ataxia Type 27A: Clinical Response to Deep Brain Stimulation and 4-Aminopyridine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel heterozygous in-frame deletion (p.Val119del) in FGF14 was identified in this family affected by childhood-onset tremor followed by late-onset progressive ataxia."
    explanation: Segregation of an in-frame deletion in a five-generation family.
  notes: >-
    No ClinGen gene-disease validity record for FGF14 is cached in this
    repository, so gene_disease_validity is left empty.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    Expressivity is highly variable within families, from isolated childhood
    tremor or nystagmus to ataxia with severe intellectual disability; some
    carriers never seek medical attention. Most families show dominant transmission of a single loss-of-function
    allele. One consanguineous family had a homozygous truncating variant: the
    child had a congenital nonprogressive cerebellar disorder with intellectual
    disability, and the heterozygous parents developed mild gait ataxia and
    tremor in their 40s, which fits a dosage effect.
  evidence:
  - reference: PMID:24252256
    reference_title: A new variable phenotype in spinocerebellar ataxia 27 (SCA 27) caused by a deletion in the FGF14 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This family demonstrates phenotypic variability of FGF14 deletions (SCA 27), fever sensitivity of ataxia and the added value of SNP-array analysis in making a diagnosis."
    explanation: Variable expressivity across three generations with one deletion.
  - reference: PMID:24252256
    reference_title: A new variable phenotype in spinocerebellar ataxia 27 (SCA 27) caused by a deletion in the FGF14 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mother was unable to perform tandem gait walking and had abnormal eye movements but had never sought medical attention."
    explanation: A mildly affected carrier who had never been diagnosed.
  - reference: PMID:39704271
    reference_title: The First Case of Autosomal Recessive Cerebellar Ataxia with Prominent Paroxysmal Non-kinesigenic Dyskinesia Caused by a Truncating FGF14 Variant in a Turkish Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation analysis confirmed that the homozygous variant was inherited from heterozygous parents who developed mild gait ataxia and tremor in their 40s."
    explanation: Heterozygous parents are mildly affected while the homozygous child is severely affected.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    One consanguineous family: a homozygous truncating variant (c.75del,
    p.Leu26Serfs*51) caused a severe congenital nonprogressive cerebellar
    disorder, while the heterozygous parents were mildly affected in later
    life.
  evidence:
  - reference: PMID:39704271
    reference_title: The First Case of Autosomal Recessive Cerebellar Ataxia with Prominent Paroxysmal Non-kinesigenic Dyskinesia Caused by a Truncating FGF14 Variant in a Turkish Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first case of autosomal recessive FGF14-related cerebellar ataxia caused by a c.75del variant resulting in p.Leu26Serfs*51 truncation of the FGF14 protein."
    explanation: The only reported biallelic case.

- name: Impaired Purkinje Neuron Repetitive Firing
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Purkinje neurons, the only output of the cerebellar cortex, lose their
    spontaneous tonic high-frequency firing. Heterozygous null and F145S
    knock-in cells fire in prolonged bursts; most homozygous null cells fall
    silent. The defect is intrinsic to the cell and present in adults:
    knocking iFGF14 down only in adult Purkinje neurons is enough to cause it,
    and re-expressing iFGF14 in adult null neurons restores firing. The link
    to ataxia is not settled at the patients' genotype: knockdown and
    homozygous null mice are ataxic, but heterozygous null and F145S knock-in
    mice, which have the firing defect, performed normally on a balance beam.
  biological_processes:
  - preferred_term: neuronal action potential
    modifier: DECREASED
    term:
      id: GO:0019228
      label: neuronal action potential
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell

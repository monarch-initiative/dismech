- name: Basal Ganglia Dopaminergic Dysfunction
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    FGF14 loss alters basal ganglia function. Null mice have a paroxysmal
    hyperkinetic movement disorder and reduced responses to dopamine agonists,
    and functional imaging in one patient supported basal ganglia involvement.
    This is the proposed basis of the dyskinesia, but the step from mouse to
    patient is not established.

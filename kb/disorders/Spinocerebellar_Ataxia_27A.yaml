pathophysiology:
- name: Heterozygous FGF14 Loss-of-Function Variants
  biological_scale: MOLECULAR
  role: initiating genetic lesion
  mechanism_confidence: ESTABLISHED
  description: >-
    One FGF14 allele is inactivated. The reported spectrum is a founding
    missense change (p.Phe145Ser), frameshift and nonsense variants, an intron
    1 splice variant, an in-frame deletion (p.Val119del), 13q33.1 deletions of
    58 kb to 545 kb that often also remove ITGBL1, a partial duplication, and
    two balanced translocations with breakpoints in FGF14.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline, usually inherited; one translocation arose de novo. Truncating
      variants, whole-gene deletions and the F145S knock-in mouse all point to
      haploinsufficiency.

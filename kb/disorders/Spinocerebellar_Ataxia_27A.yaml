- name: Loss of FGF14 Regulation of Purkinje Neuron Nav Channels
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Without enough iFGF14 bound to their C-terminus, Purkinje neuron Nav
    channels (largely Nav1.6) inactivate at more negative voltages, inactivate
    faster and carry less late and resurgent current, so fewer channels are
    available at resting potential. The null mouse also has less Nav1.6
    protein in Purkinje cells. Parallel changes in cerebellar granule neurons
    are shown in Fgf12/Fgf14 double-null mice.

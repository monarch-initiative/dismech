progression:
- phase: Childhood onset
  age_range: infancy to adolescence
  notes: >-
    Nystagmus can be present from infancy, tremor begins in childhood, and
    fever-triggered episodic attacks can begin in early childhood. Episodic
    symptoms, nystagmus, learning disability and psychiatric symptoms tend to
    appear earlier than ataxia.
  evidence:
  - reference: PMID:41099962
    reference_title: "Spinocerebellar Ataxia 27 A with Episodic Ataxia: Case Series of Fibroblast Growth Factor 14 (FGF14) Microdeletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Episodic symptoms, nystagmus, learning disability and neuropsychiatric symptoms occur at an earlier age."
    explanation: Early-appearing features in microdeletion carriers.
- phase: Slowly progressive adult ataxia
  age_range: young adulthood onward
  notes: >-
    Ataxia begins in young adulthood and progresses very slowly; motor
    function is maintained through life in most patients.
  evidence:
  - reference: PMID:32162847
    reference_title: "FGF14-related episodic ataxia: delineating the phenotype of Episodic Ataxia type 9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Symptom onset occurs early in life nevertheless the disease course is usually very slow and motor function is maintained through life in most of the patients."
    explanation: Background summary of the disease course.

- name: Th1 and Th17 Effector T Cell Expansion
  description: Th1 and Th17 cells are increased in the blood of patients in proportion to disease activity, and T cells producing interferon gamma, IL-6 and IL-17A are present in the aortic inflammatory infiltrate. Serum from patients with active disease induces interferon gamma and IL-17A production by healthy CD4+ T cells. Glucocorticoids lower the Th1 cytokines but leave the Th17 cytokines unchanged, which is a proposed reason for relapse on glucocorticoid tapering.

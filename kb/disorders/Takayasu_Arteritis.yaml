discussions:
- discussion_id: tak_jak_inhibitor_efficacy_unconfirmed
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Do JAK inhibitors reduce relapse in Takayasu arteritis, given that the only placebo-controlled trial missed its primary endpoint while observational comparisons favour the class?
  attaches_to:
  - treatments#Upadacitinib
  - treatments#Tofacitinib
  - pathophysiology#JAK-STAT Signaling Activation in T Cells
  rationale: SELECT-TAK randomised 59 patients and found fewer relapses on upadacitinib (37% against 62%) with a hazard ratio of 0.52 whose confidence interval crossed 1, so the primary endpoint was not met. Prospective cohorts found tofacitinib better than methotrexate for complete remission, but allocation was not randomised. The mechanistic case, a JAK-STAT signature in patient T cells that JAK inhibitors reverse, is consistent with benefit. The trial was small for the effect size it observed, so the question is open.
  evidence:
  - reference: PMID:43044624
    reference_title: 'Efficacy and safety of upadacitinib in Takayasu arteritis (SELECT-TAK): a multicentre, double-blind, randomised, placebo-controlled, phase 3 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Further exploration of upadacitinib in refractory Takayasu arteritis is warranted.
    explanation: The trial authors state that the question remains open.
  - reference: PMID:32213496
    reference_title: Targeting JAK/STAT pathway in Takayasu's arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: JAK/STAT signalling pathway is critical in the pathogenesis of TAK and JAKinibs may be a promising therapy.
    explanation: The mechanistic study that motivates the class.
- discussion_id: tak_mtorc1_inhibition_untested_in_patients
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does inhibiting mTORC1 control Takayasu arteritis in patients?
  attaches_to:
  - pathophysiology#mTORC1 Hyperactivity in CD4+ T Cells
  rationale: Rapamycin reverses the Th1 and Th17 maldifferentiation of patient CD4+ T cells and reduces vasculitis in human artery-NSG mouse chimeras. No clinical trial of an mTORC1 inhibitor in this disease was found on ClinicalTrials.gov or in PubMed, so the node has a candidate drug and no treatment entry.
  evidence:
  - reference: PMID:31430047
    reference_title: Targeting Mechanistic Target of Rapamycin Complex 1 Restricts Proinflammatory T Cell Differentiation and Ameliorates Takayasu Arteritis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: Targeting mTORC1 is a promising therapeutic strategy against TAK.
    explanation: The authors propose the strategy on the basis of ex vivo and chimera experiments.
- discussion_id: tak_activity_versus_damage_biomarker
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which measurement separates active vessel-wall inflammation from fixed structural damage well enough to serve as a trial endpoint?
  attaches_to:
  - biochemical#Erythrocyte Sedimentation Rate (ESR)
  - biochemical#C-Reactive Protein (CRP)
  - biochemical#Plasma Pentraxin-3 (PTX3)
  - pathophysiology#Adventitial Fibroblast Activation and Fibrosis
  rationale: ESR was unreliable in the NIH cohort, where 44% of surgical specimens from clinically inactive patients showed active disease. Arterial wall damage can advance under immunosuppression. Pentraxin-3 and the FDG-PET vascular activity score are candidates, but neither is a validated endpoint, and the SELECT-TAK trial defined relapse from signs, symptoms and inflammation markers.
  evidence:
  - reference: PMID:41860699
    reference_title: Management of Takayasu Arteritis - A 2026 Update.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Distinguishing disease activity from vascular damage in patients with TAK is challenging.
    explanation: A 2026 review states the problem.
  - reference: PMID:40434493
    reference_title: Association of PET vascular activity score with Takayasu's arteritis angiographic progression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Multivariate Cox proportional hazards regression analysis adjusted for age and sex showed baseline PETVAS > 15 (HR 1.93; 95% CI, 1.01-3.68; p = 0.04) an independent predictor of angiographic progression.
    explanation: A prospective cohort links the PET vascular activity score to later angiographic progression.

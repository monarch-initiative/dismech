  downstream:
  - target: Granulomatous Vascular Inflammation
    description: Carriage of HLA-B*52:01 raises the risk of developing the vessel-wall inflammation; how the allele does so has not been established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:27815653
    reference_title: 'Relationship of HLA-B*51 and HLA-B*52 alleles and TNF-α-308A/G polymorphism with susceptibility to Takayasu arteritis: a meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The HLA-B*52 allele was found to be associated with TA (pooled OR 3.91, 95 % CI 3.22-4.74, P < 0.0001).
    explanation: Meta-analysis of 20 studies with 1864 TA patients confirms strong HLA-B*52 association with Takayasu arteritis.
  - reference: PMID:26178430
    reference_title: Revisited HLA and non-HLA genetics of Takayasu arteritis--where are we?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: HLA-B*52:01 is associated with TAK beyond population. Many of the associations other than HLA-B*52:01 can be explained by a haplotype with HLA-B*52:01.
    explanation: Review confirms HLA-B*52:01 as the primary susceptibility allele across populations, with IL12B having a central role in onset and progression.
  - reference: ORPHA:3287
    reference_title: Takayasu arteritis
    supports: SUPPORT
    snippet: HLA-B | major histocompatibility complex, class I, B | hgnc:4932 | Major susceptibility factor in
    explanation: Orphanet lists HLA-B as a major susceptibility factor for Takayasu arteritis.
- name: mTORC1 Hyperactivity in CD4+ T Cells
  description: Circulating CD4+ T cells from patients show cell-intrinsic hyperactivity of mechanistic target of rapamycin complex 1, measured as phosphorylation of S6 kinase 1 and S6 ribosomal protein. The hyperactive cells differentiate spontaneously into Th1 and Th17 effectors, and the level of mTORC1 activity tracks the frequency of those cells and disease activity. Rapamycin and RPTOR knockdown both reverse the maldifferentiation. The evidence is from patient cells ex vivo and a humanized mouse chimera; no mTORC1 inhibitor has been tested in a clinical trial in this disease.

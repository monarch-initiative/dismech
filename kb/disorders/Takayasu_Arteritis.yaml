- name: Interleukin-6 Overproduction and Receptor Signaling
  description: Serum IL-6 is raised in every patient studied during active disease and returns to control levels in remission. IL-6 and its receptor are over-expressed in the arterial wall. IL-6 acts through the IL-6 receptor and JAK2-STAT3 on adventitial fibroblasts and drives the systemic acute-phase response. A common variant in IL6 is a genome-wide significant susceptibility locus. This is the pathway blocked by tocilizumab.
  conforms_to: il6_hypercytokinemia#Sustained Interleukin-6 Oversupply

      snippet: 'The final criteria items and weights were as follows: female sex (+1), angina (+2), limb claudication (+2), arterial bruit (+2), reduced upper extremity pulse (+2), reduced pulse or tenderness of a carotid artery (+2), blood pressure difference between arms of ≥20 mm Hg (+1), number of affected arterial territories (+1 to +3), paired artery involvement (+1) and abdominal aorta plus renal or mesenteric involvement (+3).'

biochemical:
- name: Erythrocyte Sedimentation Rate (ESR)
  presence: Elevated
  context: Elevated ESR is common during active disease, though normal ESR does not exclude active inflammation.
  loinc_term:
    id: LOINC:30341-2
    label: Erythrocyte sedimentation rate [Velocity] in Red Blood Cells
  readouts:
  - target: Systemic Acute-Phase Response
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: 'Reflects the systemic acute-phase response. It is not a reliable measure of vessel-wall inflammation: surgical specimens from clinically inactive patients often show active disease.'
  evidence:
  - reference: ORPHA:3287
    reference_title: Takayasu arteritis
    supports: SUPPORT
    snippet: HP:0003565 | Elevated erythrocyte sedimentation rate | Frequent (79-30%)
    explanation: Orphanet classifies elevated ESR as frequent in TAK.
  - reference: PMID:7909656
    reference_title: Takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The erythrocyte sedimentation rate was not a consistently reliable surrogate marker of disease activity.
    explanation: The NIH cohort found ESR elevated but unreliable as a sole disease activity marker.
  - reference: PMID:7909656
    reference_title: Takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Surgical bypass biopsy specimens from clinically inactive patients showed histologically active disease in 44% of patients.
    explanation: Histologically active disease in clinically inactive patients shows the limit of clinical and laboratory activity measures.
- name: C-Reactive Protein (CRP)
  presence: Elevated
  context: CRP is elevated during active inflammation but may not correlate perfectly with disease activity.
  loinc_term:
    id: LOINC:1988-5
    label: C reactive protein [Mass/volume] in Serum or Plasma
  readouts:
  - target: Systemic Acute-Phase Response
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: Acute-phase reactant used with ESR to follow disease activity; pentraxin-3 was more accurate than CRP in a meta-analysis.
  evidence:
  - reference: ORPHA:3287
    reference_title: Takayasu arteritis
    supports: SUPPORT
    snippet: HP:0011227 | Elevated circulating C-reactive protein concentration | Occasional (29-5%)
    explanation: Orphanet classifies elevated CRP as occasional.
  - reference: PMID:33529185
    reference_title: 'Pentraxin 3 is more accurate than C-reactive protein for Takayasu arteritis activity assessment: A systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The pooled sensitivity, specificity, and AUC values of PTX3 in active TAK diagnosis were higher than those of CRP (0.78 [95% CI = 0.65-0.87] vs. 0.66 [95% CI = 0.53-0.77], p = 0.012; 0.85 [95% CI = 0.77-0.90] vs. 0.77 [95% CI = 0.56-0.90], p = 0.033; 0.88 [95% CI = 0.85-0.90] vs. 0.75 [95% CI = 0.71-0.79], p < 0.0001).
    explanation: Meta-analysis giving the pooled sensitivity (0.66) and specificity (0.77) of CRP for active disease.
- name: Serum Interleukin-6
  presence: Elevated
  context: Raised in active disease and comparable to controls in remission; correlates with clinical disease activity. Baseline serum IL-6 also correlates with the FDG-PET vascular activity score.
  loinc_term:
    id: LOINC:26881-3
    label: Interleukin 6 [Mass/volume] in Serum or Plasma
  readouts:
  - target: Interleukin-6 Overproduction and Receptor Signaling
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: Direct measure of circulating IL-6. Not a validated or regulatory endpoint.
  evidence:
  - reference: PMID:10393681
    reference_title: 'Interleukin-6 and RANTES in Takayasu arteritis: a guide for therapeutic decisions?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found that all patients with Takayasu arteritis studied during an active phase of the disease have increased serum concentration of IL-6 compared with healthy control subjects (P<0.01).
    explanation: Serum IL-6 measured by ELISA in 18 patients.
  - reference: PMID:10393681
    reference_title: 'Interleukin-6 and RANTES in Takayasu arteritis: a guide for therapeutic decisions?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A positive correlation was found between either IL-6 (rho=0.705, P<0.01) or RANTES (rho=0.607, P<0.05) serum level and disease activity.
    explanation: Serum IL-6 correlated with disease activity.
  - reference: PMID:40434493
    reference_title: Association of PET vascular activity score with Takayasu's arteritis angiographic progression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The baseline PETVAS was positively correlated with Erythrocyte Sedimentation Rate (ESR), serum IL-6, and Platelet.
    explanation: In a prospective cohort of 123 patients, serum IL-6 correlated with the PET vascular activity score.
- name: Plasma Pentraxin-3 (PTX3)
  presence: Elevated
  context: Pentraxin-3 is produced by immune and vascular cells in response to inflammatory signals. Plasma levels are higher in active than inactive disease, and a level above 1 ng/mL separated active from inactive disease more accurately than CRP or ESR in the original study. A meta-analysis of 8 studies confirmed higher accuracy than CRP and reported possible publication bias.
  readouts:
  - target: Granulomatous Vascular Inflammation
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: Candidate marker of active vessel-wall inflammation. Research use; not a validated or regulatory endpoint.
  evidence:
  - reference: PMID:21969341
    reference_title: Pentraxin-3 as a marker of disease activity in Takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A plasma PTX3 level greater than 1 ng/mL was more accurate than normal thresholds of CRP or ESR for distinguishing active from inactive disease.
    explanation: Cross-sectional study of 57 patients.
  - reference: PMID:33529185
    reference_title: 'Pentraxin 3 is more accurate than C-reactive protein for Takayasu arteritis activity assessment: A systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PTX3 level in the blood in active TAK patients were found to be higher than that in dormant TAK with pooled SMD of 0.761 (95% CI = 0.38-1.14, p<0.0001; I2 = 68%, p of Q test = 0.003).
    explanation: Meta-analysis of 8 studies with 473 patients.
  notes: No biomarker_term or loinc_term is bound. NCIT:C119682 Pentraxin-Related Protein PTX3 was found by OLS search but was not checked for membership of the biomarker enum, and no LOINC code for pentraxin-3 was looked up.
- name: Circulating Plasmablasts
  presence: Elevated
  context: CD19+ CD20- CD27-high antibody-secreting cells in peripheral blood, measured by flow cytometry. Raised in active disease and proposed as a marker for selecting patients for B cell depletion. Reported from a single study of 17 patients.
  readouts:
  - target: B Cell Homeostasis Disturbance and Plasmablast Expansion
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: Research measure; not in clinical use.
  evidence:
  - reference: PMID:21953334
    reference_title: Takayasu arteritis is characterised by disturbances of B cell homeostasis and responds to B cell depletion therapy with rituximab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The absolute number and frequency of peripheral blood CD19(+)/CD20(-)/CD27(high) antibody-secreting cells in patients with active TA was significantly higher than in healthy donors.
    explanation: Flow cytometry of peripheral blood B cell subsets.
  - reference: PMID:21953334
    reference_title: Takayasu arteritis is characterised by disturbances of B cell homeostasis and responds to B cell depletion therapy with rituximab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Circulating plasmablasts could be a useful biomarker of disease activity and a tool for selecting appropriate candidates for BCDT.
    explanation: The authors propose the measure as an activity marker.
- name: Anti-EPCR and Anti-SR-BI Autoantibodies
  presence: Positive
  context: Autoantibodies against endothelial protein C receptor and scavenger receptor class B type 1, detected in 34.6% and 36.5% of patients with little overlap. Anti-EPCR antibodies are also found in ulcerative colitis. Research assays only.
  readouts:
  - target: Anti-Endothelial Autoantibody-Mediated Endothelial Activation
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: Each antibody is present in about a third of patients, so absence does not exclude the disease.
  evidence:
  - reference: PMID:32152303
    reference_title: Identification of two major autoantigens negatively regulating endothelial activation in Takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autoantibodies against EPCR and SR-BI are detected in 34.6% and 36.5% of cases, respectively, with minimal overlap (3.8%).
    explanation: Frequency of the two autoantibodies in patient sera.
  - reference: PMID:32152303
    reference_title: Identification of two major autoantigens negatively regulating endothelial activation in Takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autoantibodies against EPCR are also detected in ulcerative colitis, the frequent comorbidity of TAK.
    explanation: Anti-EPCR antibodies are not specific to this disease.
treatments:
- name: Glucocorticoids
  description: First-line treatment for active disease. Guidelines recommend 40 to 60 mg per day of prednisone-equivalent to induce remission, combined from the start with a glucocorticoid-sparing agent. Most patients respond, but relapse on tapering is common. Glucocorticoids lower Th1 cytokines and leave Th17 cytokines unchanged.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: glucocorticoid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: glucocorticoid
      term:
        id: CHEBI:24261
        label: glucocorticoid
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  target_mechanisms:
  - target: Th1 and Th17 Effector T Cell Expansion
    treatment_effect: INHIBITS
    description: Glucocorticoids suppress the Th1 arm (IL-2, interferon gamma, TNF alpha) and do not suppress the Th17 arm.
    evidence:
    - reference: PMID:25604824
      reference_title: Th1 and Th17 cytokines drive inflammation in Takayasu arteritis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The Th17 and Th1 pathways contribute to the systemic and vascular manifestations of TAK. Glucocorticoid treatment suppresses Th1 cytokines but spares Th17 cytokines in patients with TAK.
      explanation: Glucocorticoid-treated patients had lower circulating Th1 cytokines than untreated patients.
    - reference: PMID:25604824
      reference_title: Th1 and Th17 cytokines drive inflammation in Takayasu arteritis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: However, glucocorticoids had essentially no effect on the frequency of Th17 cytokines (IL-1 receptor, IL-17, and IL-23).
      explanation: The same study found no glucocorticoid effect on Th17 cytokines, so the inhibition of this node is partial.
  evidence:
  - reference: PMID:29191819
    reference_title: 'Efficacy and safety of tocilizumab in patients with refractory Takayasu arteritis: results from a randomised, double-blind, placebo-controlled, phase 3 trial in Japan (the TAKT study).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with TAK who had relapsed within the previous 12 weeks were induced into remission with oral glucocorticoid therapy.
    explanation: The TAKT study used glucocorticoids to induce remission in all patients before randomization, confirming their role as standard first-line therapy.
  - reference: PMID:7909656
    reference_title: Takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Medical therapy was required for 80% of patients, whereas 20% had monophasic self-limiting disease. Immunosuppressive treatment with glucocorticoids alone or in combination with a cytotoxic agent failed to induce remission in one fourth of patients; about half of those who achieved remission later relapsed.
    explanation: NIH cohort confirms glucocorticoid use in 80% of patients with significant relapse rate.
  - reference: PMID:31270110
    reference_title: 2018 Update of the EULAR recommendations for the management of large vessel vasculitis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: High dose glucocorticoid therapy (40-60 mg/day prednisone-equivalent) should be initiated immediately for induction of remission in active giant cell arteritis (GCA) or Takayasu arteritis (TAK).
    explanation: The 2018 EULAR large-vessel-vasculitis guideline recommends immediate high-dose glucocorticoids to induce remission in active Takayasu arteritis, confirming first-line status.
  - reference: PMID:42481270
    reference_title: 2025 EULAR recommendations for the management of polymyalgia rheumatica and primary large vessel vasculitis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: For induction of remission, GC should be initiated at a dose of 15 to 25 mg/day prednisone-equivalent for PMR and 40 to 60 mg for GCA or TAK.
    explanation: The 2025 EULAR recommendations keep the 40 to 60 mg per day prednisone-equivalent induction dose.
- name: Methotrexate
  description: Conventional immunosuppressive agent given with glucocorticoids to maintain remission and lower the glucocorticoid dose. In a randomised trial the combination of methotrexate with mycophenolate mofetil gave a higher response rate than cyclophosphamide followed by azathioprine. In a prospective cohort, methotrexate was less effective than tofacitinib for complete remission at 12 months.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: immunosuppressive pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  target_mechanisms:
  - target: Granulomatous Vascular Inflammation
    treatment_effect: INHIBITS
    description: Methotrexate is used as a general immunosuppressant against the vessel-wall inflammation. Which step it acts on in this disease has not been studied; the link rests on clinical response.
    evidence:
    - reference: PMID:40849269
      reference_title: Mycophenolate mofetil plus methotrexate versus cyclophosphamide with sequential azathioprine for treatment of Takayasu arteritis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: The overall response rates at 28 and 52 weeks were 58.1% and 55.4% in the MMF+MTX group, respectively, higher than 32.4% at both time points in the CYC/AZA group (P = .011 and .022).
      explanation: A methotrexate-containing regimen produced clinical responses in active disease; this shows an effect on disease activity and not the molecular step.
  evidence:
  - reference: PMID:33026580
    reference_title: 'Takayasu arteritis: a cohort of Italian patients and recent pathogenetic and therapeutic advances.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Medical treatment, based on pathogenetic insights into the roles of humoral and cell-mediated immune mechanisms, included glucocorticoids mostly combined with steroid-sparing immunosuppressive agents and, in patients with relapsing/refractory disease, biologic drugs.
    explanation: Confirms standard use of steroid-sparing immunosuppressive agents including methotrexate alongside glucocorticoids.
  - reference: PMID:34235884
    reference_title: 2021 American College of Rheumatology/Vasculitis Foundation Guideline for the Management of Giant Cell Arteritis and Takayasu Arteritis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Recommendations for TAK include the use of nonglucocorticoid immunosuppressive agents with glucocorticoids as initial therapy.
    explanation: The 2021 ACR/Vasculitis Foundation guideline recommends nonglucocorticoid immunosuppressive agents such as methotrexate together with glucocorticoids as initial therapy for Takayasu arteritis.
  - reference: PMID:40658482
    reference_title: Turkish Society for Rheumatology (Turkish Takayasu Arteritis Study Group) recommendations for the diagnosis, follow-up and the treatment of Takayasu's arteritis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: We recommend conventional immunosuppressives as the first choice during remission-induction.
    explanation: The Turkish Takayasu Arteritis Study Group recommends conventional immunosuppressives such as methotrexate as the first choice for remission-induction.
  - reference: PMID:40849269
    reference_title: Mycophenolate mofetil plus methotrexate versus cyclophosphamide with sequential azathioprine for treatment of Takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Treatment of active TAK with MMF+MTX has more favourable efficacy compared to CYC/AZA.
    explanation: A randomised trial of 111 patients favoured methotrexate with mycophenolate mofetil over cyclophosphamide and azathioprine.
  - reference: PMID:34362744
    reference_title: 'Treatment efficacy and safety of tofacitinib versus methotrexate in Takayasu arteritis: a prospective observational study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The CR rate was higher in the TOF group than in the MTX group (6 months: 85.19% vs 61.54%, p=0.07; 12 months: 88.46% vs 56.52%, p=0.02).'
    explanation: In a prospective observational comparison, complete remission at 12 months was 56.52% with methotrexate.
  - reference: PMID:42481270
    reference_title: 2025 EULAR recommendations for the management of polymyalgia rheumatica and primary large vessel vasculitis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: GC-sparing agents should be given in combination with GC to all patients with TAK.
    explanation: The 2025 EULAR recommendations advise a glucocorticoid-sparing agent for every patient with Takayasu arteritis.
- name: Mycophenolate Mofetil
  description: Conventional immunosuppressive agent used as a glucocorticoid-sparing drug, alone or with methotrexate. Before-and-after studies show falls in ESR, CRP and glucocorticoid dose after it is added, and a randomised trial favoured mycophenolate mofetil with methotrexate over cyclophosphamide followed by azathioprine.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: immunosuppressive pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mycophenolate mofetil
      term:
        id: CHEBI:8764
        label: mycophenolate mofetil
  target_mechanisms:
  - target: Granulomatous Vascular Inflammation
    treatment_effect: INHIBITS
    description: Used as a general immunosuppressant; the step it acts on in this disease has not been studied.
    evidence:
    - reference: PMID:28364217
      reference_title: 'The efficacy of mycophenolate mofetil in treating Takayasu arteritis: a systematic review and meta-analysis.'
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: Compared with the baseline, there were significant reductions in the ESR (-14.92 ... CRP values (-12.99 ... and the steroid dosage (-17.64 ... after the addition of MMF, and the disease tended to stabilize.
      explanation: Inflammatory markers fell after mycophenolate mofetil was added; this shows an effect on inflammation and not the molecular step.
  evidence:
  - reference: PMID:28364217
    reference_title: 'The efficacy of mycophenolate mofetil in treating Takayasu arteritis: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Therefore, MMF might be an alternative immunosuppressive drug for TA for the control of disease activity and to taper the steroid dosage.
    explanation: Systematic review and meta-analysis of before-and-after studies.
  - reference: PMID:40849269
    reference_title: Mycophenolate mofetil plus methotrexate versus cyclophosphamide with sequential azathioprine for treatment of Takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The overall response rates at 28 and 52 weeks were 58.1% and 55.4% in the MMF+MTX group, respectively, higher than 32.4% at both time points in the CYC/AZA group (P = .011 and .022).
    explanation: 'Randomised trial: overall response at 52 weeks was 55.4% with mycophenolate mofetil plus methotrexate against 32.4% with cyclophosphamide then azathioprine.'
- name: Leflunomide
  description: Conventional immunosuppressive agent given at 20 mg per day with prednisone. In the TACTIC randomised, double-blind, placebo-controlled trial of 116 patients, clinical remission at week 24 was 81.5% with leflunomide and 78.9% with placebo, so the primary endpoint was not met; the mean prednisone dose at week 24 was slightly lower with leflunomide. In a prospective cohort, leflunomide and tofacitinib had similar effectiveness, with more side effects on leflunomide.
  therapeutic_modality: SMALL_MOLECULE
  dosing_interval: once daily
  dosing_interval_days: 1
  treatment_term:
    preferred_term: immunosuppressive pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: leflunomide
      term:
        id: CHEBI:6402
        label: leflunomide
  effect_modifiers:
  - effect_modifier_type: SEX
    stratum: female patients
    modified_outcome: clinical remission at week 24
    effect_in_stratum: LARGER_EFFECT
    modification_analysis: POST_HOC_SUBGROUP
    description: The risk difference between leflunomide and placebo was larger in the female subgroup. The abstract reports no interaction test, and the trial as a whole did not meet its primary endpoint.
    evidence:
    - reference: PMID:42399917
      reference_title: 'Efficacy of leflunomide in active Takayasu arteritis: a randomized double-blind placebo-controlled trial : Takayasu arteritis clinical trial in China (TACTIC).'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Post hoc analyses indicated greater risk differences (LEF minus placebo) in the female subgroup, ≤ 40 years subgroup, refractory subgroup, systemic symptoms subgroup, imaging type II subgroup and in those achieving the composite endpoint of both clinical remission and stable/improved imaging.
      explanation: Post hoc subgroup result from the TACTIC trial.
  - effect_modifier_type: AGE
    stratum: patients aged 40 years or younger
    modified_outcome: clinical remission at week 24
    effect_in_stratum: LARGER_EFFECT
    modification_analysis: POST_HOC_SUBGROUP
    description: The risk difference between leflunomide and placebo was larger in patients aged 40 or younger. The abstract reports no interaction test.
    evidence:
    - reference: PMID:42399917
      reference_title: 'Efficacy of leflunomide in active Takayasu arteritis: a randomized double-blind placebo-controlled trial : Takayasu arteritis clinical trial in China (TACTIC).'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Post hoc analyses indicated greater risk differences (LEF minus placebo) in the female subgroup, ≤ 40 years subgroup, refractory subgroup, systemic symptoms subgroup, imaging type II subgroup and in those achieving the composite endpoint of both clinical remission and stable/improved imaging.
      explanation: Post hoc subgroup result from the TACTIC trial.
  evidence:
  - reference: PMID:42399917
    reference_title: 'Efficacy of leflunomide in active Takayasu arteritis: a randomized double-blind placebo-controlled trial : Takayasu arteritis clinical trial in China (TACTIC).'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'In mITT set, clinical remission was achieved in 44/54 (81.5%) LEF- and 45/57 (78.9%) placebo-treated patients (risk difference: 2.6, 95%CI: -12.5, 17.2) at week 24.'
    explanation: The placebo-controlled trial found no difference in the primary endpoint, which counts against a large effect of leflunomide on remission.
  - reference: PMID:42399917
    reference_title: 'Efficacy of leflunomide in active Takayasu arteritis: a randomized double-blind placebo-controlled trial : Takayasu arteritis clinical trial in China (TACTIC).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although the primary endpoint was not met, our results still provide evidence supporting LEF as a potential alternative treatment option for TAK.
    explanation: The authors keep leflunomide as a possible option on the strength of secondary and post hoc results.
  - reference: PMID:35523066
    reference_title: 'Efficacy and safety of tofacitinib versus leflunomide with glucocorticoids treatment in Takayasu arteritis: A prospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Side-effect prevalence was higher in the LEF group (11 (31.43%) vs. 3 (9.38%), p = 0.04). In conclusion, LEF and TOF were comparable for TAK treatment.
    explanation: A prospective cohort comparison with tofacitinib found similar effectiveness and more side effects with leflunomide.
  notes: No target_mechanisms link is recorded. The one placebo-controlled trial did not show an effect on remission, and no study of the mechanism of leflunomide in this disease was found.
- name: Cyclophosphamide With Sequential Azathioprine
  description: Intravenous cyclophosphamide for induction followed by oral azathioprine. In a randomised trial it gave a lower overall response rate (32.4% at 28 and 52 weeks) than mycophenolate mofetil with methotrexate.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: immunosuppressive pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
    - preferred_term: azathioprine
      term:
        id: CHEBI:2948
        label: azathioprine
  evidence:
  - reference: PMID:40849269
    reference_title: Mycophenolate mofetil plus methotrexate versus cyclophosphamide with sequential azathioprine for treatment of Takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The overall response rates at 28 and 52 weeks were 58.1% and 55.4% in the MMF+MTX group, respectively, higher than 32.4% at both time points in the CYC/AZA group (P = .011 and .022).
    explanation: The cyclophosphamide and azathioprine arm responded in 32.4% of patients, less than the comparator arm.
  notes: No target_mechanisms link is recorded; no study of the mechanism of either drug in this disease was found.
- name: Tocilizumab
  description: Monoclonal antibody against the IL-6 receptor, given as 162 mg subcutaneously once a week. In the TAKT phase 3 trial in Japan the primary endpoint, time to relapse, was not met, although the result favoured tocilizumab. In the open-label extension to 96 weeks the glucocorticoid dose fell to less than half of the dose at pre-study relapse in 46.4% of patients, and imaging was improved or stable in most. In an open-label randomised study of severe disease, adalimumab had a higher efficacy rate than tocilizumab at 6 months and the two were similar at 9 and 12 months.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  dosing_interval: once weekly
  dosing_interval_days: 7
  treatment_term:
    preferred_term: tocilizumab therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Tocilizumab
      term:
        id: NCIT:C84217
        label: Tocilizumab
  target_mechanisms:
  - target: Interleukin-6 Overproduction and Receptor Signaling
    treatment_effect: INHIBITS
    description: Tocilizumab binds the IL-6 receptor and blocks IL-6 signalling. It does not lower IL-6 production.
    evidence:
    - reference: PMID:28770707
      reference_title: Pro-fibrotic effect of IL-6 via aortic adventitial fibroblasts indicates IL-6 as a treatment target in Takayasu arteritis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: IL-6/IL-6R induces fibrogenesis of AAFs via the JAK2/STAT3 and JAK2/Akt pathways, which provides theoretical evidence for IL-6 as a treatment target in TAK.
      explanation: Cell culture work supports IL-6 receptor signalling as a treatment target in this disease.
  evidence:
  - reference: PMID:29191819
    reference_title: 'Efficacy and safety of tocilizumab in patients with refractory Takayasu arteritis: results from a randomised, double-blind, placebo-controlled, phase 3 trial in Japan (the TAKT study).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although the primary endpoint was not met, the results suggest favour for tocilizumab over placebo for time to relapse of TAK without new safety concerns. Further investigation is warranted to confirm the efficacy of tocilizumab in patients with refractory TAK.
    explanation: The TAKT trial did not meet its primary endpoint, although the direction of effect favoured tocilizumab.
  - reference: PMID:31951279
    reference_title: 'Long-term efficacy and safety of tocilizumab in refractory Takayasu arteritis: final results of the randomized controlled phase 3 TAKT study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These results in patients with Takayasu arteritis provide evidence of a steroid-sparing effect and improvements in well-being during long-term treatment with once-weekly tocilizumab 162 mg, with no new safety concerns.
    explanation: Open-label extension of TAKT to 96 weeks.
  - reference: PMID:31951279
    reference_title: 'Long-term efficacy and safety of tocilizumab in refractory Takayasu arteritis: final results of the randomized controlled phase 3 TAKT study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Imaging evaluations indicated that most patients' disease was improved (17.9%) or stable (67.9%) after 96 weeks compared with baseline.
    explanation: Imaging outcome in the open-label extension; there was no control arm in this period.
  - reference: PMID:37540159
    reference_title: 'Treatment efficacy and safety of adalimumab versus tocilizumab in patients with active and severe Takayasu arteritis: an open-label study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the intention-to-treat (ITT) population, the ER at 6 months was higher in the ADA group (85.71% vs 52.63%, P = 0.02).
    explanation: Open-label randomised comparison in 40 patients with severe disease, in which tocilizumab had the lower efficacy rate at 6 months.
- name: TNF Inhibitor Therapy
  description: Monoclonal antibodies against TNF alpha (infliximab, adalimumab) used for disease that relapses on or is refractory to conventional immunosuppressants. No placebo-controlled trial exists. In a multicentre retrospective cohort of 111 patients, remission, glucocorticoid sparing and drug survival were similar for TNF inhibitors and tocilizumab; in an open-label randomised study of severe disease, adalimumab had a higher efficacy rate than tocilizumab at 6 months.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:

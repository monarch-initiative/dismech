      reference_title: Targeting JAK/STAT pathway in Takayasu's arteritis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: JAKinibs induced both in vitro and in vivo a significant reduction of CD25 expression by CD4+ and CD8+ T cells, a significant decrease of type 1 helper T cells (Th1) and Th17 cells and an increase of Tregs cells in TAK.
      explanation: JAK inhibition reduced Th1 and Th17 cells in vitro and in treated patients, which implies that JAK-STAT signalling maintains them.

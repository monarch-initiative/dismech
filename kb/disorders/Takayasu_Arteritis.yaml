      reference_title: Targeting Mechanistic Target of Rapamycin Complex 1 Restricts Proinflammatory T Cell Differentiation and Ameliorates Takayasu Arteritis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: TAK CD4+ T cells were selectively prepositioned with hyperactivity of mTORC1 (P < 0.001), resulting in spontaneous maldifferentiation of Th1 and Th17 cells (P < 0.001).
      explanation: Patient CD4+ T cells with hyperactive mTORC1 differentiate spontaneously into Th1 and Th17 cells.

    snippet: Blockade of mTORC1 with rapamycin efficiently abrogated the maldifferentiation of Th1 and Th17 cells (P < 0.01) and ameliorated vasculitis in humanized TAK chimeras (P < 0.001).
    explanation: Rapamycin reversed the T cell maldifferentiation and reduced vasculitis in human artery-NSG mouse chimeras, a model result that has not been tested in patients.

- name: IL6 Susceptibility Locus
  association: Genome-wide significant susceptibility locus
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: IL6
    term:
      id: hgnc:6018
      label: IL6
  notes: A common variant in IL6 (rs2069837) reached genome-wide significance in a Turkish cohort and a North American cohort of European ancestry (odds ratio 2.07). The same study identified loci at RPS9/LILRB3 and chromosome 21q22. A later multi-ancestral study of 1,226 patients (PMID:33308445) added VPS8, SVEP1, CFL2 and chr13q21 and confirmed IL12B, PTK2B and chr21q22; those loci are not given their own rows here.

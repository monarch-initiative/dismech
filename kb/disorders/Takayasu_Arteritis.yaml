    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
  target_mechanisms:
  - target: TNF-Alpha-Driven Inflammatory Signaling
    treatment_effect: INHIBITS
    description: Infliximab and adalimumab neutralise TNF alpha.
    evidence:
    - reference: PMID:36916777
      reference_title: Comparative Efficacy of Secukinumab Versus Tumor Necrosis Factor Inhibitors for the Treatment of Takayasu Arteritis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: Our findings suggest that secukinumab and TNFi are effective for patients with TAK who do not respond to oral glucocorticoids and conventional immunosuppressive agents, with similar response rates at 3 and 6 months.
      explanation: Refractory patients responded to TNF inhibitors in a prospective cohort, which supports TNF as a driver of the disease.
  evidence:
  - reference: PMID:31270110
    reference_title: 2018 Update of the EULAR recommendations for the management of large vessel vasculitis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Non-biological glucocorticoid-sparing agents should be given in combination with glucocorticoids in all patients with TAK and biological agents may be used in refractory or relapsing patients.
    explanation: The 2018 EULAR guideline recommends biologic agents, including TNF inhibitors, for refractory or relapsing Takayasu arteritis.
  - reference: PMID:40658482
    reference_title: Turkish Society for Rheumatology (Turkish Takayasu Arteritis Study Group) recommendations for the diagnosis, follow-up and the treatment of Takayasu's arteritis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Tumour necrosis factor-inhibitors or tocilizumab can be considered in patients with relapsing or refractory disease despite conventional immunosuppressives.
    explanation: The Turkish Takayasu Arteritis Study Group recommends TNF inhibitors (or tocilizumab) for relapsing or refractory disease that fails conventional immunosuppressives.
  - reference: PMID:34706312
    reference_title: 'Biologic treatments in Takayasu''s Arteritis: A comparative study of tumor necrosis factor inhibitors and tocilizumab.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Complete/partial remission rates between TCZ and TNF inhibitors were similar at 3rd month and at the end of the follow-up.
    explanation: Multicentre retrospective cohort comparing TNF inhibitors with tocilizumab.
  - reference: PMID:37540159
    reference_title: 'Treatment efficacy and safety of adalimumab versus tocilizumab in patients with active and severe Takayasu arteritis: an open-label study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ADA combined with GCs and MTX may be more efficacious than TCZ combined with GCs and MTX among patients with active and severe TAK.
    explanation: Open-label randomised study of adalimumab against tocilizumab in 40 patients.
- name: Tofacitinib
  description: Oral JAK inhibitor. Not tested against placebo in this disease. In a prospective cohort of 53 patients, complete remission at 12 months was more frequent with tofacitinib than with methotrexate (88.46% against 56.52%), with a lower glucocorticoid dose. In a second prospective cohort it was comparable to leflunomide for effectiveness and better for sustained remission on low-dose glucocorticoid.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: JAK inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tofacitinib
      term:
        id: CHEBI:71200
        label: tofacitinib
  target_mechanisms:
  - target: JAK-STAT Signaling Activation in T Cells
    treatment_effect: INHIBITS
    description: JAK inhibition lowers T cell activation and the Th1 and Th17 fractions and raises regulatory T cells.
    evidence:
    - reference: PMID:32213496
      reference_title: Targeting JAK/STAT pathway in Takayasu's arteritis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: JAKinibs induced both in vitro and in vivo a significant reduction of CD25 expression by CD4+ and CD8+ T cells, a significant decrease of type 1 helper T cells (Th1) and Th17 cells and an increase of Tregs cells in TAK.
      explanation: JAK inhibitors, tested in vitro and in treated patients, reduced activated, Th1 and Th17 cells.
  evidence:
  - reference: PMID:34362744
    reference_title: 'Treatment efficacy and safety of tofacitinib versus methotrexate in Takayasu arteritis: a prospective observational study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: TOF was superior to MTX for CR induction, a tendency to prevent relapse and tapering of the GCs dose in TAK treatment.
    explanation: Prospective observational comparison with methotrexate; treatment was not randomised.
  - reference: PMID:35523066
    reference_title: 'Efficacy and safety of tofacitinib versus leflunomide with glucocorticoids treatment in Takayasu arteritis: A prospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: TOF might be a potential agent to maintain disease remission at a low dose of glucocorticoids in TAK.
    explanation: Prospective cohort comparison with leflunomide.
- name: Upadacitinib
  description: Oral JAK inhibitor, investigational in this disease. In the SELECT-TAK phase 3 trial, 59 patients in glucocorticoid-induced remission after a relapse were randomised to upadacitinib 15 mg once daily or placebo with a glucocorticoid taper. The primary endpoint, time to first relapse, was not met (hazard ratio 0.52, 95% CI 0.24 to 1.12). Relapse occurred in 37% of patients on upadacitinib and 62% on placebo.
  therapeutic_modality: SMALL_MOLECULE
  dosing_interval: once daily
  dosing_interval_days: 1
  treatment_term:
    preferred_term: JAK inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: upadacitinib
      term:
        id: NCIT:C152802
        label: Upadacitinib
  target_mechanisms:
  - target: JAK-STAT Signaling Activation in T Cells
    treatment_effect: INHIBITS
    description: Upadacitinib is a JAK inhibitor; the mechanistic evidence in this disease comes from other drugs of the class.
    evidence:
    - reference: PMID:32213496
      reference_title: Targeting JAK/STAT pathway in Takayasu's arteritis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: JAKinibs induced both in vitro and in vivo a significant reduction of CD25 expression by CD4+ and CD8+ T cells, a significant decrease of type 1 helper T cells (Th1) and Th17 cells and an increase of Tregs cells in TAK.
      explanation: Evidence for the JAK inhibitor class; the study did not use upadacitinib.
  evidence:
  - reference: PMID:43044624
    reference_title: 'Efficacy and safety of upadacitinib in Takayasu arteritis (SELECT-TAK): a multicentre, double-blind, randomised, placebo-controlled, phase 3 trial.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: The primary endpoint was not met with upadacitinib (hazard ratio 0·52, 95% CI 0·24-1·12; log-rank test p=0·045).
    explanation: The phase 3 trial did not meet its primary endpoint, which counts against established efficacy.
  - reference: PMID:43044624
    reference_title: 'Efficacy and safety of upadacitinib in Takayasu arteritis (SELECT-TAK): a multicentre, double-blind, randomised, placebo-controlled, phase 3 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 11 (37%) relapse events occurred in 30 patients in the upadacitinib group and 18 (62%) occurred in 29 patients in the placebo group.
    explanation: Fewer relapses occurred on upadacitinib, which is the basis for the authors calling for further study.
  - reference: PMID:43044624
    reference_title: 'Efficacy and safety of upadacitinib in Takayasu arteritis (SELECT-TAK): a multicentre, double-blind, randomised, placebo-controlled, phase 3 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The primary endpoint was not met; the time to first relapse analysis numerically favoured upadacitinib over placebo, but did not meet the prespecified statistical significance threshold.
    explanation: The authors read the result as numerically favourable and not statistically confirmed.
- name: Secukinumab
  description: Monoclonal antibody against IL-17A, used off-label for disease refractory to glucocorticoids and two conventional immunosuppressants. In a prospective single-centre open-label cohort (19 patients on secukinumab, 34 on TNF inhibitors) response rates at 6 months were 52.6% and 64.7%, not significantly different. No randomised trial has reported.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: anti-IL-17A therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: secukinumab
      term:
        id: NCIT:C152315
        label: Secukinumab
  target_mechanisms:
  - target: Th1 and Th17 Effector T Cell Expansion
    treatment_effect: INHIBITS
    description: Secukinumab neutralises IL-17A, the effector cytokine of the Th17 arm that glucocorticoids do not suppress. It acts on the cytokine and not on the number of Th17 cells.
    evidence:
    - reference: PMID:36916777
      reference_title: Comparative Efficacy of Secukinumab Versus Tumor Necrosis Factor Inhibitors for the Treatment of Takayasu Arteritis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: Our findings suggest that secukinumab and TNFi are effective for patients with TAK who do not respond to oral glucocorticoids and conventional immunosuppressive agents, with similar response rates at 3 and 6 months.
      explanation: Refractory patients responded to IL-17A blockade, which supports a role for the Th17 arm.
  evidence:
  - reference: PMID:36916777
    reference_title: Comparative Efficacy of Secukinumab Versus Tumor Necrosis Factor Inhibitors for the Treatment of Takayasu Arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Complete response and partial response for patients treated with secukinumab and TNFi were 31.6% and 58.8% (P = 0.057), respectively, at 3 months and 52.6% and 64.7%, respectively, at 6 months (P = 0.389).
    explanation: Prospective open-label cohort; allocation was not randomised.
- name: Ustekinumab
  description: Monoclonal antibody against the p40 subunit shared by IL-12 and IL-23, investigated because IL12B is a susceptibility locus. The Japanese phase 3 placebo-controlled trial was terminated early for slow recruitment after 14 patients; 4 of 6 on ustekinumab and 4 of 8 on placebo relapsed, so it shows no benefit and cannot exclude one. A small case series reported only marginal effects on inflammatory markers and glucocorticoid dose.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: anti-IL-12/23 therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ustekinumab
      term:
        id: NCIT:C84237
        label: Ustekinumab
  target_mechanisms:
  - target: Th1 and Th17 Effector T Cell Expansion
    treatment_effect: INHIBITS
    description: IL-12 and IL-23 drive Th1 and Th17 differentiation, and the IL12B gene encoding their shared p40 subunit is a susceptibility locus. This is the rationale for the drug; a clinical effect has not been shown.
    evidence:
    - reference: PMID:26178430
      reference_title: Revisited HLA and non-HLA genetics of Takayasu arteritis--where are we?
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: Recent genome-wide association studies of TAK revealed multiple non-HLA susceptibility genes. In particular, the IL12B region seems to have a central role in TAK onset and its progression.
      explanation: Genetic rationale for blocking the IL12B product; it does not show that the drug acts on Th1 or Th17 cells in patients.
  evidence:
  - reference: PMID:40104212
    reference_title: Phase 3, multicentre, randomized, double-blind, placebo-controlled, parallel-group study of ustekinumab in patients with Takayasu arteritis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'The study was terminated early due to patient recruitment challenge. Of 14 patients randomized, 8 relapsed during the DB phase (UST: 4/6; placebo: 4/8).'
    explanation: The phase 3 trial stopped early and showed no difference in relapse; it is too small to settle the question.
  - reference: PMID:32700985
    reference_title: Long-term outcomes of refractory Takayasu arteritis patients treated with biologics including ustekinumab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: UST exhibited marginal effects on reducing ESR, CRP levels, and PSL dose.
    explanation: Three patients treated with ustekinumab in a single-centre series.
- name: Abatacept
  description: 'CTLA-4 immunoglobulin fusion protein that blocks T cell costimulation. A randomised, double-blind withdrawal trial of 34 patients found no benefit: relapse-free survival at 12 months was 22% with abatacept and 40% with placebo. It is recorded here as a tested and ineffective treatment.'
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: T cell costimulation blockade
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: abatacept
      term:
        id: NCIT:C28898
        label: Abatacept
  evidence:
  - reference: PMID:28133931
    reference_title: A Randomized, Double-Blind Trial of Abatacept (CTLA-4Ig) for the Treatment of Takayasu Arteritis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: In patients with TAK, the addition of abatacept to a treatment regimen with prednisone did not reduce the risk of relapse.
    explanation: Conclusion of the randomised trial; the evidence is against efficacy.
  - reference: PMID:28133931
    reference_title: A Randomized, Double-Blind Trial of Abatacept (CTLA-4Ig) for the Treatment of Takayasu Arteritis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: The relapse-free survival rate at 12 months was 22% for those receiving abatacept and 40% for those receiving placebo (P = 0.853).
    explanation: Primary endpoint result.
  notes: 'therapeutic_modality is OTHER because the enum has no value for an Fc-fusion protein. No target_mechanisms link is recorded: the entry has no T cell costimulation node, and the negative trial gives no reason to add one.'
- name: Rituximab
  description: 'Monoclonal antibody against CD20 that depletes B cells. Evidence is limited to small uncontrolled series: three patients with refractory disease and expanded plasmablasts reached remission after B cell depletion. It is not part of guideline-recommended therapy.'
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: B cell depletion therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: B Cell Homeostasis Disturbance and Plasmablast Expansion
    treatment_effect: INHIBITS
    description: Rituximab depletes CD20-positive B cells, the precursors of the expanded plasmablast population.
    evidence:
    - reference: PMID:21953334
      reference_title: Takayasu arteritis is characterised by disturbances of B cell homeostasis and responds to B cell depletion therapy with rituximab.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Three patients with active refractory TA and expansion of plasmablasts were successfully treated with BCDT, which resulted in remission.
      explanation: Three patients selected for plasmablast expansion responded to B cell depletion.
  evidence:
  - reference: PMID:21953334
    reference_title: Takayasu arteritis is characterised by disturbances of B cell homeostasis and responds to B cell depletion therapy with rituximab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three patients with active refractory TA and expansion of plasmablasts were successfully treated with BCDT, which resulted in remission.
    explanation: Uncontrolled series of three patients.
- name: Antiplatelet Therapy
  description: Antiplatelet agents given to prevent arterial ischaemic events. In a retrospective cohort of 48 patients, those who had ischaemic events were far less often on antiplatelet therapy, and antiplatelet use was associated with a lower hazard of ischaemic events; anticoagulants showed no such association. The evidence is observational and from a single centre.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiplatelet therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antiplatelet agent
      term:
        id: NCIT:C1327
        label: Antiplatelet Agent
  evidence:
  - reference: PMID:20467149
    reference_title: Antiplatelet therapy for the prevention of arterial ischemic events in takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Antiplatelet therapy is associated with a lower frequency of ischemic events in patients with TA.
    explanation: Retrospective single-centre cohort.
  - reference: PMID:20467149
    reference_title: Antiplatelet therapy for the prevention of arterial ischemic events in takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: TA patients with ischemic events used significantly less antiplatelet agents (14.3%) than those without ischemic events (82.4%), P<0.0001.
    explanation: The comparison underlying the conclusion.
  notes: No target_mechanisms link is recorded. The drug acts on platelet aggregation in stenosed arteries, and the entry has no thrombosis node; the cited study names antiplatelet agents as a class and no individual drug.
- name: Surgical and Endovascular Revascularization
  description: Bypass surgery or endovascular angioplasty and stenting for stenoses or aneurysms that threaten organ function or impair quality of life. A meta-analysis of observational studies (770 patients) found restenosis about five times more likely after endovascular than after open surgical intervention, and stroke less frequent after endovascular intervention. Revascularisation relieves the stenosis and does not treat the arteritis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical or endovascular revascularization
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Vascular Remodeling and Stenosis
    treatment_effect: BYPASSES
    description: Bypass grafting or angioplasty restores flow past a fixed stenosis without altering the disease process in the wall.
    evidence:
    - reference: PMID:7909656
      reference_title: Takayasu arteritis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Although clinically significant palliation usually occurred after angioplasty or bypass of severely stenotic vessels, restenosis was common.
      explanation: Revascularisation of severely stenotic vessels relieved symptoms in the NIH cohort, with frequent restenosis.
  evidence:
  - reference: PMID:7909656
    reference_title: Takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although clinically significant palliation usually occurred after angioplasty or bypass of severely stenotic vessels, restenosis was common.
    explanation: NIH cohort confirms that surgical revascularization provides palliation but restenosis is a significant problem.
  - reference: PMID:29622513
    reference_title: 'Endovascular Versus Open Surgical Intervention in Patients with Takayasu''s Arteritis: A Meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Restenosis was more common with endovascular than open surgical intervention (odds ratio [OR] 5.18, 95% confidence interval [CI] 2.78-9.62; p < .001).
    explanation: Meta-analysis of observational studies comparing endovascular and open surgical intervention.
  - reference: PMID:29622513
    reference_title: 'Endovascular Versus Open Surgical Intervention in Patients with Takayasu''s Arteritis: A Meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, stroke occurred less often with endovascular intervention than with open surgical intervention (OR 0.33, 95% CI 0.12-0.90; p = .003).
    explanation: The same meta-analysis found fewer strokes after endovascular intervention.
  - reference: PMID:41860699
    reference_title: Management of Takayasu Arteritis - A 2026 Update.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Vascular interventions are reserved for vascular damage or ischemia of major organs threatening their function or affecting the quality of life.
    explanation: A 2026 review states the indication for intervention.
diagnosis:
- name: Non-Invasive Vascular Imaging Surveillance
  description: >-
    Non-invasive vascular imaging (MR-angiography, CT-angiography, FDG-PET, or
    ultrasound) is used to establish the extent of arterial involvement,
    monitor disease activity and suspected relapse, and track structural
    vascular damage over time. Guidelines identify MRI as the preferred
    modality in Takayasu arteritis, guiding immunosuppression and
    revascularization decisions.
  diagnosis_term:
    preferred_term: non-invasive vascular imaging surveillance
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:37550004
    reference_title: "EULAR recommendations for the use of imaging in large vessel vasculitis in clinical practice: 2023 update."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      For Takayasu arteritis, MRI is the preferred imaging modality; FDG-PET,
      CT or ultrasound are alternatives.
    explanation: >-
      The 2023 EULAR imaging recommendations designate MRI as the preferred
      imaging modality for Takayasu arteritis, with FDG-PET, CT, or ultrasound
      as alternatives.
  - reference: PMID:37550004
    reference_title: "EULAR recommendations for the use of imaging in large vessel vasculitis in clinical practice: 2023 update."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      MR-angiography, CT-angiography or ultrasound may be used for long-term
      monitoring of structural damage, particularly at sites of preceding
      vascular inflammation.
    explanation: >-
      EULAR supports MR-angiography, CT-angiography, or ultrasound for
      long-term surveillance of structural vascular damage in large vessel
      vasculitis.
  - reference: PMID:40462247
    reference_title: "2025 Chinese guideline for the imaging diagnosis and evaluation of Takayasu arteritis."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Imaging is crucial for the diagnosis and evaluation of TAK, but the
      rational selection of imaging methods and interpretation of imaging
      results are major challenges in clinical practice, which can affect
      treatment decisions.
    explanation: >-
      The 2025 Chinese imaging guideline underscores that imaging is central
      to evaluating Takayasu arteritis and directly informs treatment
      decisions.
- name: 2022 ACR/EULAR Classification Criteria
  description: Points-based classification criteria. Age 60 years or younger at diagnosis and imaging evidence of large-vessel vasculitis are absolute requirements; a cumulative score of 5 or more from ten weighted clinical and imaging items classifies a patient as having Takayasu arteritis. These are classification criteria for research, not diagnostic criteria.
  evidence:
  - reference: PMID:36351705
    reference_title: 2022 American College of Rheumatology/EULAR classification criteria for Takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Age ≤60 years at diagnosis and imaging evidence of large-vessel vasculitis were absolute requirements to classify a patient as having TAK.
    explanation: Entry requirements of the criteria.
  - reference: PMID:36351705
    reference_title: 2022 American College of Rheumatology/EULAR classification criteria for Takayasu arteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: When these criteria were tested in the validation data set, the model area under the curve was 0.97 (95% CI 0.94 to 0.99) with a sensitivity of 93.8% (95% CI 88.6% to 97.1%) and specificity of 99.2% (95% CI 96.7% to 100.0%).
    explanation: Performance in the validation set of 146 cases and 127 comparators.
- name: FDG-PET Vascular Activity Scoring (PETVAS)
  description: Semi-quantitative score of arterial wall FDG uptake across arterial territories on 18F-FDG PET/CT. In a prospective cohort of 123 patients a baseline score above 15 independently predicted angiographic progression. It is a research and monitoring tool and not a validated endpoint.
  diagnosis_term:
    preferred_term: FDG PET/CT
    term:
      id: NCIT:C103512
      label: Positron Emission Tomography and Computed Tomography Scan
  evidence:
  - reference: PMID:40434493
    reference_title: Association of PET vascular activity score with Takayasu's arteritis angiographic progression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Multivariate Cox proportional hazards regression analysis adjusted for age and sex showed baseline PETVAS > 15 (HR 1.93; 95% CI, 1.01-3.68; p = 0.04) an independent predictor of angiographic progression.
    explanation: Prospective cohort relating the score to later angiographic progression.

  description: 'Tumor necrosis factor alpha is regarded as a driver of the granulomatous vessel-wall inflammation, and it is the target of infliximab, adalimumab and certolizumab. The support for its role in this disease is mostly therapeutic: patients refractory to conventional agents respond to TNF blockade.'

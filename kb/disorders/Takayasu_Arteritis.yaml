    snippet: Among dysregulated genes, we highlighted a great enrichment for pathways linked to type I and type II interferons, JAK/STAT and cytokines/chemokines-related signalling in TAK.
    explanation: Transcriptome analysis of sorted T cells from 25 patients shows enrichment of JAK-STAT and interferon pathways.
- name: Anti-Endothelial Autoantibody-Mediated Endothelial Activation
  description: About a third of patients each carry autoantibodies against endothelial protein C receptor (EPCR, gene PROCR) or scavenger receptor class B type 1 (SR-BI, gene SCARB1), with little overlap between the two. Both proteins restrain endothelial activation, and the autoantibodies block that function, leaving endothelium in a pro-inflammatory state. EPCR signalling also restrains Th17 differentiation, so blocking it removes a brake on Th17 cells.

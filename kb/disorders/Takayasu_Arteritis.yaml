    snippet: mTORC1 activation was found also in Th1 and Th17 cells both systemically and in inflamed vessels.
    explanation: An independent study of large vessel vasculitis found mTORC1 activation in Th1 and Th17 cells in blood and in inflamed vessels; the cohort pooled Takayasu arteritis with giant cell arteritis.
- name: JAK-STAT Signaling Activation in T Cells
  description: Sorted CD4+ and CD8+ T cells from patients carry a transcriptional signature enriched for type I and type II interferon response, JAK-STAT signalling and cytokine and chemokine signalling. JAK inhibitors reduce T cell activation and the Th1 and Th17 fractions and raise regulatory T cells, in culture and in treated patients. This is cytokine-driven signalling through the pathway, not an activating mutation in a JAK or STAT gene.

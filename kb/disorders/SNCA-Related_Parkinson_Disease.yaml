    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both the four symptomatic and the older asymptomatic carriers reported abnormalities in the SCOPA questionnaire and had markedly diminished cardiac MIBG uptake."
    explanation: The scintigraphic denervation finding.
diagnosis:
- name: SNCA Molecular Genetic Testing
  description: >-
    The diagnosis is established in a person with parkinsonism and a heterozygous
    SNCA pathogenic missense variant or an SNCA locus multiplication. Because the
    multiplications are copy-number changes, dosage-sensitive methods such as
    quantitative PCR, multiplex ligation-dependent probe amplification or
    microarray are needed; sequencing alone detects only the missense alleles.
  diagnosis_term:
    preferred_term: SNCA molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:16358335
    reference_title: "Clinical heterogeneity of alpha-synuclein gene duplication in Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We screened 113 ADPD probands and 200 sporadic PD cases by quantitative polymerase chain reaction and confirmed SNCA multiplications by fluorescence in situ hybridization (FISH) and comparative genomic hybridization array."
    explanation: The dosage-sensitive methods needed to detect multiplications.
treatments:
- name: Levodopa with Peripheral Decarboxylase Inhibitor
  description: >-
    Treatment does not differ from sporadic Parkinson disease. Levodopa with
    carbidopa or benserazide is the mainstay, and the response is generally good
    across the dominant genetic forms, although in triplication and p.Gly51Asp
    disease it is less durable and motor complications appear early. The
    response is symptomatic: levodopa restores striatal dopaminergic
    transmission and does not touch the synuclein lesion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
    - preferred_term: carbidopa
      term:
        id: CHEBI:3395
        label: carbidopa
  target_mechanisms:
  - target: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
    treatment_effect: RESTORES
    description: Levodopa restores striatal dopaminergic transmission downstream of the degenerated neurons, so the benefit is symptomatic.
    evidence:
    - reference: PMID:30357936
      reference_title: "Genotype-phenotype relations for the Parkinson's disease genes SNCA, LRRK2, VPS35: MDSGene systematic review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "recapitulates many of the previously described findings including later onset of disease (median age at onset: ∼49 years) compared to recessive forms of PD of an overall excellent treatment response."
      explanation: The overall good treatment response across the dominant forms.
  target_phenotypes:
  - preferred_term: Bradykinesia
    term:
      id: HP:0002067
      label: Bradykinesia
  - preferred_term: Rigidity
    term:
      id: HP:0002063
      label: Rigidity
  - preferred_term: Resting tremor
    term:
      id: HP:0002322
      label: Resting tremor
  evidence:
  - reference: PMID:23526723
    reference_title: G51D α-synuclein mutation causes a novel parkinsonian-pyramidal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "G51D was associated with an unusual PD phenotype characterized by early disease onset, moderate response to levodopa, rapid progression leading to loss of autonomy and death within a few years"
    explanation: The response is present but only moderate and less durable in the p.Gly51Asp subtype.
- name: Subthalamic Deep Brain Stimulation
  description: >-
    Bilateral subthalamic nucleus deep brain stimulation benefits motor
    fluctuations and dyskinesia in selected SNCA carriers, with the best and most
    durable outcomes in duplication carriers who do not yet have cognitive
    decline; carriers with missense mutations and early dementia do less well and
    can deteriorate despite a motor benefit.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Deep Brain Stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  target_mechanisms:
  - target: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
    treatment_effect: MODULATES
    description: Stimulation modulates the dysfunctional basal ganglia motor circuit downstream of the dopamine deficit, reducing fluctuations without altering the synucleinopathy.
    evidence:
    - reference: PMID:35040589
      reference_title: "Subthalamic deep brain stimulation in Parkinson's disease with SNCA mutations: Based on the follow-up to 10 years."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Based on findings in our small cohort, subthalamic DBS could be beneficial for motor fluctuation in PD patients with SNCA mutations, especially those with SNCA duplication, and cognitive and psychiatric symptoms are important for the long-term outcome of subthalamic DBS."
      explanation: The benefit and its dependence on cognitive status.
  target_phenotypes:
  - preferred_term: Dyskinesia
    term:
      id: HP:0100660
      label: Dyskinesia
  evidence:
  - reference: PMID:26350119
    reference_title: "Autosomal dominant Parkinson's disease caused by SNCA duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, DBS might be potentially useful for selected SNCA duplication patients who have severe motor complications but do not have any cognitive deficits."
    explanation: The selection criterion for DBS in SNCA carriers.
- name: Antipsychotic Management of Visual Hallucinations and Psychosis
  description: >-
    Visual hallucinations and psychosis, frequent in SNCA disease, are managed by
    reducing offending medication and, when needed, a Parkinson-safe atypical
    antipsychotic that does not worsen parkinsonism. Typical neuroleptics and
    other dopamine blockers are avoided.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antipsychotic pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: quetiapine
      term:
        id: CHEBI:8707
        label: quetiapine
  target_phenotypes:
  - preferred_term: Visual hallucination
    term:
      id: HP:0002367
      label: Visual hallucination
  notes: >-
    The choice of quetiapine as a Parkinson-safe atypical antipsychotic is
    extrapolated from sporadic Parkinson disease and dementia-with-Lewy-bodies
    management; no SNCA-specific trial was identified. The cited evidence
    establishes only that the target feature, hallucinations, is frequent in
    these carriers, not the drug's efficacy in this population.
  evidence:
  - reference: PMID:26350119
    reference_title: "Autosomal dominant Parkinson's disease caused by SNCA duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hallucinations were the only feature present significantly more often than not (χ2 test, p<0.01) in these patients."
    explanation: Establishes hallucinations as a frequent, treatable target in SNCA carriers.
- name: Management of Orthostatic Hypotension and Dysautonomia
  description: >-
    Orthostatic hypotension from autonomic failure is managed with
    non-pharmacological measures and, when needed, agents such as midodrine,
    droxidopa or fludrocortisone, as in sporadic disease with dysautonomia.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

- name: Alpha-Synuclein Missense Substitution
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    In the missense subtype the lesion is a single substitution in the
    N-terminal amphipathic repeats, which changes the conformational and
    membrane-binding behaviour of the protein. Most alleles (p.Ala53Thr,
    p.Glu46Lys, p.His50Gln) accelerate fibril formation, which is why this node
    feeds the aggregation node. The direction is not uniform: p.Ala30Pro
    fibrillizes more slowly and p.Gly51Asp and p.Ala53Glu attenuate aggregation
    in vitro, so the node asserts an altered aggregation propensity, not a
    uniform increase, and the per-allele direction is recorded on the variants.

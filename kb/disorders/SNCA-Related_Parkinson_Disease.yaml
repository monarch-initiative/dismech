name: SNCA-Related Parkinson Disease
creation_date: "2026-11-17T04:30:00Z"
description: >-
  SNCA-related Parkinson disease (PARK1 and PARK4, PARK-SNCA) is autosomal
  dominant parkinsonism caused by heterozygous variation in SNCA, the gene
  encoding alpha-synuclein, the protein that forms Lewy bodies. Two classes of
  lesion produce it: missense variants in the N-terminal membrane-binding
  repeats (p.Ala53Thr, p.Ala30Pro, p.Glu46Lys, p.His50Gln, p.Gly51Asp,
  p.Ala53Glu) and multiplications of the wild-type locus (duplication,
  triplication), which raise the amount of normal protein. Both drive
  alpha-synuclein toward oligomers and amyloid fibrils, block its degradation by
  chaperone-mediated autophagy, impair synaptic vesicle recycling and
  neurotransmitter release, fragment mitochondria and seed Lewy pathology that
  propagates through connected circuits, with degeneration of nigrostriatal
  dopaminergic neurons and a widespread cortical, limbic and autonomic
  synucleinopathy. Onset is earlier than in sporadic disease (mean about 48
  years for duplications, mid-30s for triplications), severity tracks gene
  dosage, and dementia, visual hallucinations, REM sleep behaviour disorder and
  dysautonomia are frequent; a p.Gly51Asp kindred adds pyramidal signs and
  pathology overlapping multiple system atrophy. Duplication carriers can be
  clinically indistinguishable from idiopathic Parkinson disease and penetrance
  of duplications is incomplete.
category: Mendelian
parents:
- Neurodegenerative Disease
- Movement Disorder
disease_term:
  preferred_term: autosomal dominant Parkinson disease 1
  term:
    id: MONDO:0008200
    label: autosomal dominant Parkinson disease 1
synonyms:
- PARK1
- PARK4
- PARK-SNCA
- autosomal dominant Parkinson disease 1
- autosomal dominant Parkinson disease 4
- Parkinson disease 1, autosomal dominant
- Parkinson disease 4, autosomal dominant
- alpha-synuclein Parkinson disease
- SNCA Parkinson disease
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
notes: >-
  Lump-vs-split rationale: this entry is kept separate from the
  `Parkinsons_Disease` basket (MONDO:0005180), which curates the common, mostly
  idiopathic alpha-synucleinopathy, and sits beside the other per-gene Mendelian
  entries (`LRRK2-Related_Parkinson_Disease`, `VPS35-Related_Parkinson_Disease`,
  `PRKN-Related_Juvenile_Parkinson_Disease`, `PINK1-Related_Early-Onset_Parkinson_Disease`,
  `PARK7-Related_Early-Onset_Parkinson_Disease`). The case for a separate entry
  is that the root of the graph is a defined lesion in the alpha-synuclein gene
  itself, so the dosage, aggregation-kinetic and degradation nodes can be
  stated with a direction and a cause that the basket, whose synuclein node has
  no upstream lesion, cannot assert. MONDO splits the gene into two terms,
  PARK1 (MONDO:0008200, point mutations) and PARK4 (MONDO:0011562, locus
  multiplications); HGNC lists both as previous symbols of SNCA. They are one
  gene and one mechanism class (increased alpha-synuclein aggregation and
  dosage-dependent toxicity) that differ in the lesion, so both are curated
  here, with the PARK1 term as the `disease_term` and PARK4 as a subtype bound
  to its own term, rather than as two entries that would duplicate every
  downstream node. The basket keeps thin PARK1 and PARK4 rows in
  `has_subtypes` and a one-paragraph SNCA row in `genetic`; the mechanism is
  curated only here. Entry naming: no GeneReviews chapter covers SNCA (the
  Monogenic Parkinson Disease Overview, PMID:20301402, is the only chapter);
  the dyadic form is the MDSGene nomenclature PARK-SNCA (PMID:30357936) and is
  used as "SNCA-related Parkinson's disease" in the literature
  (PMID:38741289), which design decision 18 counts as an established name.
  MONDO's labels for both terms are kept in `synonyms`. The ClinGen Definitive
  tier is asserted against Parkinson disease (MONDO:0005180), not this entry's
  term, so it is quoted as evidence and not recorded in
  `gene_disease_validity`.
has_subtypes:
- name: PARK1
  display_name: SNCA missense Parkinson disease (PARK1)
  description: >-
    Disease caused by a heterozygous missense variant in SNCA. p.Ala53Thr
    (the Contursi and Greek founder allele, also de novo in Sweden) was the
    first Mendelian cause of Parkinson disease identified; p.Ala30Pro,
    p.Glu46Lys (Lewy body dementia phenotype), p.His50Gln (late-onset, typical
    disease), p.Gly51Asp (early onset, rapid course, pyramidal signs and
    pathology shared with multiple system atrophy) and p.Ala53Glu followed. The
    variants cluster in the N-terminal amphipathic repeats and most accelerate
    fibril formation, although p.Gly51Asp and p.Ala30Pro do not.
  subtype_term:
    preferred_term: autosomal dominant Parkinson disease 1
    term:
      id: MONDO:0008200
      label: autosomal dominant Parkinson disease 1
  genes:
  - preferred_term: SNCA
    term:
      id: hgnc:11138
      label: SNCA
  evidence:
  - reference: PMID:9197268
    reference_title: "Mutation in the alpha-synuclein gene identified in families with Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A mutation was identified in the alpha-synuclein gene, which codes for a presynaptic protein thought to be involved in neuronal plasticity, in the Italian kindred and in three unrelated families of Greek origin with autosomal dominant inheritance for the PD phenotype."
    explanation: The founding observation of a missense SNCA variant as a dominant cause of Parkinson disease.
  - reference: PMID:26350119
    reference_title: "Autosomal dominant Parkinson's disease caused by SNCA duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Currently, six other known missense mutations (p.Ala18Thr, p.Ala29Ser, p.Ala30Pro, p.Glu46Lys, p.His50Gln and p.Gly51Asp"
    explanation: The review's enumeration of the missense alleles beside p.Ala53Thr; p.Ala18Thr and p.Ala29Ser are of uncertain significance and are not curated as variants here.
  - reference: PMID:23457019
    reference_title: "Alpha-synuclein p.H50Q, a novel pathogenic mutation for Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three missense mutations in SNCA, the gene encoding alpha-synuclein, as well as genomic multiplications have been identified as causes for autosomal-dominantly inherited Parkinsonism."
    explanation: States the two lesion classes side by side.
- name: PARK4
  display_name: SNCA multiplication Parkinson disease (PARK4)
  description: >-
    Disease caused by duplication or triplication of the wild-type SNCA locus,
    so the lesion is an increased dose of normal alpha-synuclein rather than a
    changed protein. Triplication (four copies) doubles alpha-synuclein mRNA and
    protein and causes fully penetrant, early-onset, rapidly progressive
    parkinsonism with dementia; duplication (three copies) causes later-onset
    disease that can resemble idiopathic Parkinson disease, with incomplete
    penetrance. Severity tracks copy number and not the size of the
    multiplicated interval or the number of neighbouring genes it carries.
  subtype_term:
    preferred_term: autosomal dominant Parkinson disease 4
    term:
      id: MONDO:0011562
      label: autosomal dominant Parkinson disease 4
  genes:
  - preferred_term: SNCA
    term:
      id: hgnc:11138
      label: SNCA
  evidence:
  - reference: PMID:15451224
    reference_title: "Alpha-synuclein locus duplication as a cause of familial Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By contrast with SNCA triplication families, the clinical phenotype of SNCA duplication closely resembles idiopathic Parkinson's disease, which has a late age-of-onset, progresses slowly, and in which neither cognitive decline nor dementia are prominent."
    explanation: The duplication phenotype against the triplication phenotype, in the report that found the first duplication kindred.
  - reference: PMID:15451225
    reference_title: "Causal relation between alpha-synuclein gene duplication and familial Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results indicate that SNCA is more frequently associated with familial Parkinson's disease than previously thought, and that there is a clear dosage effect according to the number of supernumerary copies of this gene."
    explanation: The independent French duplication report, stating the dosage effect.
  - reference: PMID:18571778
    reference_title: Genomic investigation of alpha-synuclein multiplication and parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severity of clinical presentation is correlated with SNCA dosage and does not appear to be overtly affected by the presence of other genes in the multiplicated region."
    explanation: Excludes the neighbouring genes in the multiplicated interval as the driver of severity.
  - reference: PMID:30619023
    reference_title: A Meta-Analysis of α-Synuclein Multiplication in Familial Parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SNCA dosage correlates with disease onset (mean age of onset CNV3: 46.9 ± 10.5 years vs. 34.5 ± 7.4 CNV4, p = 0.003)."
    explanation: The dosage-onset relation across 59 multiplication families.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous missense variants and locus multiplications segregate as
    autosomal dominant traits. Triplication is fully penetrant; p.Ala53Thr and
    duplication show incomplete penetrance, with asymptomatic carriers older
    than the expected age at onset and a penetrance as low as a third in one
    duplication kindred. De novo occurrence of p.Ala53Thr is documented, and
    duplications are found in apparently sporadic cases.
  evidence:
  - reference: PMID:9197268
    reference_title: "Mutation in the alpha-synuclein gene identified in families with Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A mutation was identified in the alpha-synuclein gene, which codes for a presynaptic protein thought to be involved in neuronal plasticity, in the Italian kindred and in three unrelated families of Greek origin with autosomal dominant inheritance for the PD phenotype."
    explanation: Autosomal dominant segregation in the discovery kindreds.
  - reference: PMID:10025809
    reference_title: "Mutated alpha-synuclein gene in two Greek kindreds with familial PD: incomplete penetrance?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both families, asymptomatic carriers older than the expected age at onset were found."
    explanation: Incomplete penetrance of p.Ala53Thr (G209A).
  - reference: PMID:16358335
    reference_title: "Clinical heterogeneity of alpha-synuclein gene duplication in Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, the penetrance ratio was 33.3% (2/6) in one kindred, indicating that the ratio was very much lower than expected."
    explanation: Measured low penetrance of a duplication.
  - reference: PMID:17625105
    reference_title: alpha-Synuclein gene duplication is present in sporadic Parkinson disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients were identified as having SNCA duplication. One patient had a positive family history, and two patients were sporadic. Each patient had asymptomatic carriers in their families."
    explanation: Duplications in apparently sporadic patients with asymptomatic carrier relatives.
  - reference: PMID:19632874
    reference_title: "A Swedish family with de novo alpha-synuclein A53T mutation: evidence for early cortical dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One unaffected family member carried the mutation haplotype without the c.209A mutation, strongly suggesting its de novo occurrence within this family."
    explanation: De novo origin of p.Ala53Thr in a Swedish family.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    No population-based prevalence exists. The 2015 review counted 46 reported
    duplication cases from 31 families, and the 2018 GEoPD meta-analysis
    assembled 59 multiplication families; missense carriers are rarer still,
    with p.Ala53Thr largely confined to the Contursi and Greek founder
    haplotype. Do not read this record as a measured rate.
  evidence:
  - reference: PMID:26350119
    reference_title: "Autosomal dominant Parkinson's disease caused by SNCA duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Forty-six cases from 31 families with SNCA duplication have been reported."
    explanation: The literature count behind the band.
  - reference: PMID:30619023
    reference_title: A Meta-Analysis of α-Synuclein Multiplication in Familial Parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein we summarize genealogic, clinical and genetic data from 59 families (25 not previously published) with parkinsonism caused by SNCA multiplications."
    explanation: The family count in the consortium meta-analysis.
progression:
- phase: Age at onset
  notes: >-
    SNCA carriers develop disease younger than LRRK2 or VPS35 carriers. Mean
    onset is about 48 years in duplication carriers and about 35 years in
    triplication carriers, with the range for duplications spanning the second
    to eighth decade; p.Gly51Asp and some p.Ala53Thr carriers present in their
    late twenties or thirties.
  evidence:
  - reference: PMID:30357936
    reference_title: "Genotype-phenotype relations for the Parkinson's disease genes SNCA, LRRK2, VPS35: MDSGene systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our systematic review validates previous reports showing that SNCA mutation carriers have a younger age at onset compared to LRRK2 and VPS35 (P < 0.001)."
    explanation: The systematic comparison across the three dominant genes.
  - reference: PMID:26350119
    reference_title: "Autosomal dominant Parkinson's disease caused by SNCA duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age of onset in 44 patients with heterozygous SNCA duplication was 48 years (SD: 13 years, range 18–77 years)."
    explanation: Onset in duplication carriers.
  - reference: PMID:30619023
    reference_title: A Meta-Analysis of α-Synuclein Multiplication in Familial Parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SNCA dosage correlates with disease onset (mean age of onset CNV3: 46.9 ± 10.5 years vs. 34.5 ± 7.4 CNV4, p = 0.003)."
    explanation: Onset by copy number.
  - reference: PMID:23404372
    reference_title: "α-Synucleinopathy associated with G51D SNCA mutation: a link between Parkinson's disease and multiple system atrophy?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family history was consistent with autosomal dominant inheritance as both the father and sister of the proband developed levodopa-responsive parkinsonism with onset in their late thirties."
    explanation: Onset in the British p.Gly51Asp kindred.
- phase: Disease course
  notes: >-
    Course tracks the lesion. Triplication and p.Gly51Asp produce rapid
    progression with early dementia, loss of autonomy and death within years;
    duplication and p.His50Gln can run like idiopathic Parkinson disease, though
    about half of duplication carriers develop motor complications within about
    four years and more than half of multiplication probands become demented.
    The levodopa response is generally good.
  evidence:
  - reference: PMID:23526723
    reference_title: G51D α-synuclein mutation causes a novel parkinsonian-pyramidal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "G51D was associated with an unusual PD phenotype characterized by early disease onset, moderate response to levodopa, rapid progression leading to loss of autonomy and death within a few years, marked pyramidal signs including bilateral extensor plantar reflexes, occasionally spasticity, and frequently psychiatric symptoms."
    explanation: The rapid course of p.Gly51Asp disease.
  - reference: PMID:26350119
    reference_title: "Autosomal dominant Parkinson's disease caused by SNCA duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About half of the patients with SNCA duplication developed motor complications, such as wearing off and dyskinesia, early in the disease course. The mean duration from disease onset to the development of motor complications was four years (n=15, SD: 3 years, range 1–12 years)."
    explanation: Time to motor complications in duplication carriers.
  - reference: PMID:30619023
    reference_title: A Meta-Analysis of α-Synuclein Multiplication in Familial Parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Atypical or more severe clinical courses were described in several patients and dementia was noted in 50.9% of the probands."
    explanation: Dementia frequency across multiplication probands.
  - reference: PMID:30357936
    reference_title: "Genotype-phenotype relations for the Parkinson's disease genes SNCA, LRRK2, VPS35: MDSGene systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the high degree of missingness of phenotypic features and unsystematic reporting of genotype data in the original literature, the present review recapitulates many of the previously described findings including later onset of disease (median age at onset: ∼49 years) compared to recessive forms of PD of an overall excellent treatment response."
    explanation: Treatment response across the dominant forms, SNCA included.
genetic:
- name: SNCA
  gene_term:
    preferred_term: SNCA
    term:
      id: hgnc:11138
      label: SNCA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: present
  association: >-
    Heterozygous missense variants in SNCA at 4q22, or duplication or
    triplication of the locus, cause autosomal dominant Parkinson disease. The
    gene encodes the 140-residue presynaptic protein alpha-synuclein, the main
    fibrillar constituent of Lewy bodies. p.Ala53Thr in the Contursi kindred and
    three Greek families (1997) was the first Mendelian cause of Parkinson
    disease found; locus triplication (2003) and duplication (2004) showed that
    an increased dose of the wild-type protein is sufficient.
  notes: >-
    The ClinGen Definitive tier quoted below is asserted against Parkinson
    disease (MONDO:0005180), not against this entry's MONDO term, and is
    therefore not recorded in `gene_disease_validity`. Common variation at the
    SNCA locus is also the strongest genetic risk factor for sporadic disease;
    that susceptibility is curated in the basket, not here. Two further
    reported missense changes, p.Ala18Thr and p.Ala29Ser, are of uncertain
    pathogenicity and are not listed under `variants`.
  evidence:
  - reference: PMID:9197268
    reference_title: "Mutation in the alpha-synuclein gene identified in families with Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A mutation was identified in the alpha-synuclein gene, which codes for a presynaptic protein thought to be involved in neuronal plasticity, in the Italian kindred and in three unrelated families of Greek origin with autosomal dominant inheritance for the PD phenotype."
    explanation: The discovery report.
  - reference: PMID:15451224
    reference_title: "Alpha-synuclein locus duplication as a cause of familial Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genomic triplication of the alpha-synuclein gene (SNCA) has been reported to cause hereditary early-onset parkinsonism with dementia."
    explanation: The multiplication class, as restated in the first duplication report (the 2003 triplication report has no indexed abstract to quote).
  - reference: PMID:15451224
    reference_title: "Alpha-synuclein locus duplication as a cause of familial Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One kindred was identified with SNCA duplication by semiquantitative PCR and confirmed by fluorescent in-situ hybridisation analysis in peripheral leucocytes."
    explanation: The first duplication kindred.
  - reference: CGGV:assertion_d21593ae-ed10-4442-8167-24f96f917302-2022-05-03T134931.425Z
    reference_title: "SNCA / Parkinson disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SNCA | HGNC:11138 | Parkinson disease | MONDO:0005180 | AD | Definitive"
    explanation: >-
      ClinGen's Parkinson's Disease GCEP classifies the SNCA gene-disease
      relationship as Definitive with autosomal dominant inheritance, against the
      broad term MONDO:0005180; quoted as evidence and not copied into
      `gene_disease_validity`.
  case_fractions:
  - population: Japanese probands with autosomal dominant Parkinson disease (113 screened for SNCA multiplication)
    case_fraction_percent: 1.8
    cohort_size: 113
    notes: Two of 113 dominant probands carried an SNCA duplication (1.8%); none of 200 sporadic cases did.
    evidence:
    - reference: PMID:16358335
      reference_title: "Clinical heterogeneity of alpha-synuclein gene duplication in Parkinson's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two families (two patients from Family A and one from Family B) with SNCA duplication were identified among ADPD patients."
      explanation: The numerator; the abstract gives 113 ADPD probands as the denominator.
  - population: Korean patients with parkinsonism screened for SNCA multiplication (906 Parkinson disease, 200 multiple system atrophy)
    case_fraction_percent: 0.3
    cohort_size: 906
    notes: Three duplication carriers among 906 Parkinson disease patients (0.3%), one familial and two sporadic.
    evidence:
    - reference: PMID:17625105
      reference_title: alpha-Synuclein gene duplication is present in sporadic Parkinson disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three patients were identified as having SNCA duplication. One patient had a positive family history, and two patients were sporadic."
      explanation: The numerator; the methods give 906 Parkinson disease patients screened.
  variants:
  - name: p.Ala53Thr
    description: >-
      c.209G>A (G209A), the founding allele in the Contursi (Italian) and Greek
      kindreds, which share a haplotype; it also occurs de novo (Sweden) and on
      a different haplotype in Korea. Early-onset, severe, levodopa-responsive
      disease with prominent cortical dysfunction, dysphasia and cognitive
      decline in the Swedish family; incomplete penetrance in Greek families.
      Mutant protein fibrillizes fastest of the early alleles in vitro.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:19632874
      reference_title: "A Swedish family with de novo alpha-synuclein A53T mutation: evidence for early cortical dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two affected individuals had early-onset (before 31 and 40 years), severe levodopa-responsive PD with prominent dysphasia, dysarthria, and cognitive decline."
      explanation: Clinical picture of p.Ala53Thr carriers in the Swedish family.
    - reference: PMID:10025809
      reference_title: "Mutated alpha-synuclein gene in two Greek kindreds with familial PD: incomplete penetrance?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The G209A mutation in the alpha-synuclein gene has been associated with autosomal dominant PD (ADPD) in a family from Contursi, Italy, and three apparently unrelated Greek families."
      explanation: The founder families and the nucleotide designation.
    - reference: PMID:9809558
      reference_title: Accelerated in vitro fibril formation by a mutant alpha-synuclein linked to early-onset Parkinson disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "However, at higher concentrations, Lewy body-like fibrils and discrete spherical assemblies are formed; most rapidly by A53T."
      explanation: Accelerated fibrillization of the mutant protein.
  - name: p.Ala30Pro
    description: >-
      Found in a German family in 1998. The substitution disrupts membrane
      association and synaptic enrichment of the protein; unlike the other
      alleles it does not inhibit synaptic vesicle exocytosis when
      overexpressed, and it fibrillizes more slowly, which may underlie its
      later onset and incomplete penetrance.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:9809558
      reference_title: Accelerated in vitro fibril formation by a mutant alpha-synuclein linked to early-onset Parkinson disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We demonstrate here that both mutant forms of alpha-synuclein (A53T and A30P) are, like wild-type alpha-synuclein (WT), disordered in dilute solution."
      explanation: Names the two early alleles studied; the 1998 discovery letter has no indexed abstract to quote.
    - reference: PMID:20152114
      reference_title: Increased expression of alpha-synuclein reduces neurotransmitter release by inhibiting synaptic vesicle reclustering after endocytosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Consistent with a crucial role for the N-terminal membrane-binding domain, the PD-associated A30P mutation abolishes the inhibition of transmitter release by αsyn."
      explanation: The functional distinctness of p.Ala30Pro from the other alleles.
  - name: p.Glu46Lys
    description: >-
      Found in a Spanish (Basque) family with autosomal dominant parkinsonism,
      dementia and visual hallucinations, with cortical and subcortical Lewy
      bodies at autopsy; carriers show early cognitive impairment with a
      posterior cortical pattern, cardiac sympathetic denervation and small
      fibre neuropathy with dermal phosphorylated alpha-synuclein.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:14755719
      reference_title: "The new mutation, E46K, of alpha-synuclein causes Parkinson and Lewy body dementia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequencing of the alpha-synuclein gene showed a novel, nonconservative E46K mutation in heterozygosis."
      explanation: The discovery of the allele.
    - reference: PMID:14755719
      reference_title: "The new mutation, E46K, of alpha-synuclein causes Parkinson and Lewy body dementia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The E46K mutation was present in all affected family members and in three young asymptomatic subjects, but it was absent in healthy and pathological controls."
      explanation: Segregation and absence from controls.
  - name: p.His50Gln
    description: >-
      Found in a patient with dopa-responsive Parkinson disease and a family
      history of parkinsonism and dementia; the clinical picture mimics
      late-onset idiopathic disease with a sustained levodopa response and
      typical Lewy pathology without glial inclusions. The mutant accelerates
      aggregation in vitro.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23457019
      reference_title: "Alpha-synuclein p.H50Q, a novel pathogenic mutation for Parkinson's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we describe a novel missense mutation in exon 4 of SNCA encoding a H50Q substitution in a patient with dopa-responsive Parkinson's disease with a family history of parkinsonism and dementia."
      explanation: The discovery report.
    - reference: PMID:24047453
      reference_title: "The Parkinson's disease-associated H50Q mutation accelerates α-Synuclein aggregation in vitro."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we analyzed the aggregation of newly discovered α-Syn missense mutant H50Q in vitro and found that this mutation significantly accelerates the aggregation and amyloid formation of α-Syn."
      explanation: Aggregation kinetics of the mutant.
  - name: p.Gly51Asp
    description: >-
      c.152G>A, found in French and British kindreds. Early-onset
      parkinsonian-pyramidal syndrome with moderate levodopa response, rapid
      progression, psychiatric symptoms, dementia and autonomic failure, and
      neuropathology combining Lewy pathology with oligodendroglial inclusions
      like those of multiple system atrophy. Unlike most alleles it attenuates
      aggregation and membrane binding in vitro, while its fibrils are more
      toxic.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23526723
      reference_title: G51D α-synuclein mutation causes a novel parkinsonian-pyramidal syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a novel SNCA G51D (c.152 G>A) mutation that cosegregated with the disease and was absent from controls."
      explanation: Discovery and segregation.

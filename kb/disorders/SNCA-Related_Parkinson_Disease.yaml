  evidence:
  - reference: PMID:26350119
    reference_title: "Autosomal dominant Parkinson's disease caused by SNCA duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe dysautonomia, including orthostatic hypotension with fainting"
    explanation: Orthostatic hypotension within the dysautonomia of a duplication carrier, the treatable target.
- name: Genetic Counseling
  description: >-
    Autosomal dominant inheritance with incomplete penetrance for missense
    alleles and duplication, and dosage-dependent severity, make genetic
    counseling important; copy-number testing is needed to detect
    multiplications in relatives.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:

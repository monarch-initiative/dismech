- name: Increased Alpha-Synuclein Gene Dosage
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    In the multiplication subtype the lesion is copy number: three or four copies
    of the wild-type SNCA locus raise alpha-synuclein mRNA and protein roughly in
    proportion to dosage. Triplication doubles the protein in blood and brain,
    and the effect on the aggregated, insoluble fraction is larger than on the
    soluble pool. This node is the root of the dosage branch; the missense branch
    starts at the next node. The bound phospholipid-binding molecular function
    represents alpha-synuclein's normal membrane activity; the INCREASED modifier
    marks the raised amount of the otherwise-normal protein, not a higher
    per-molecule lipid affinity.

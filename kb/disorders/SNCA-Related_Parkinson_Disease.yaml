    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a complete absence of tyrosine hydroxylase immunostaining in the myocardium of the two autopsied cases."
    explanation: Histological cardiac sympathetic denervation in carriers.
  downstream:

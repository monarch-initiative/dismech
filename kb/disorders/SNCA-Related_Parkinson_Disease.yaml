      snippet: "We have found imaging and histological evidence of cardiac sympathetic denervation in symptomatic and asymptomatic carriers of the E46K alpha-synuclein gene mutation."
      explanation: The autonomic lesion behind the dysautonomia.
  - target: Orthostatic Hypotension
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sympathetic denervation predisposes to orthostatic hypotension but is not
      sufficient for it: in the E46K series cardiac denervation was organ-specific

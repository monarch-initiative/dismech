      orthostatic hypotension, whereas duplication carriers with autonomic
      involvement developed orthostatic hypotension with fainting.
    evidence:
    - reference: PMID:26350119
      reference_title: "Autosomal dominant Parkinson's disease caused by SNCA duplications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "severe dysautonomia, including orthostatic hypotension with fainting"
      explanation: Orthostatic hypotension occurring within the autonomic syndrome of a duplication carrier.
    - reference: PMID:23000061
      reference_title: Cardiac sympathetic denervation in symptomatic and asymptomatic carriers of the E46K mutation in the α synuclein gene.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Only one patient had significant orthostatic hypotension."
      explanation: In the E46K series denervation was present but orthostatic hypotension was uncommon, so denervation alone does not produce it.

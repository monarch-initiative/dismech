  - reference: PMID:24746362
    reference_title: "Novel α-synuclein mutation A53E associated with atypical multiple system atrophy and Parkinson's disease-type pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuronal and glial (including oligodendroglial) SNCA inclusions and neurites were found to be particularly prominent in the putamen, caudatus, amygdala, temporal and insular cortices, gyrus cinguli, and hippocampus CA2-3 region."
    explanation: Oligodendroglial inclusions in the p.Ala53Glu carrier.

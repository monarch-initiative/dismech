- name: Preformed-fibril intrastriatal inoculation of wild-type mice (Luk et al.)
  species: Mouse
  species_term:
    preferred_term: Mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genotype: Wild-type (nontransgenic) mice, intrastriatal synthetic alpha-synuclein preformed fibrils
  genes:
  - preferred_term: SNCA
    term:
      id: hgnc:11138
      label: SNCA
  publication: PMID:23161999
  description: >-
    A single injection of synthetic alpha-synuclein fibrils into wild-type mouse
    striatum seeds the templated spread of Lewy pathology along connections,
    selectively kills nigral dopaminergic neurons, lowers striatal dopamine and
    produces motor deficits. The model recapitulates the propagation and
    selective degeneration steps of the cascade without any genetic lesion, so
    it isolates templated spread rather than modelling the SNCA genotype itself.
  modeled_mechanisms:

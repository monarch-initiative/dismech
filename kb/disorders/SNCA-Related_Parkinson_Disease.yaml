    limitations: >-
      The seed is exogenous synthetic fibril and the mice are genetically normal,
      so the model reproduces the spread and degeneration steps but not the SNCA
      lesion that initiates them in patients.
    divergences:
    - divergence_type: BOUNDARY_OMISSION

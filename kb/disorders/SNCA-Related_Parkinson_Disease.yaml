      snippet: "We report a British family with young-onset Parkinson's disease (PD) and a G51D SNCA mutation that segregates with the disease."
      explanation: The independent British kindred.
  - name: p.Ala53Glu
    description: >-
      c.158C>A, found in a Finnish family. Atypical early-onset parkinsonism
      with neuropathology showing features of both multiple system atrophy and
      Parkinson disease, including oligodendroglial inclusions.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24746362
      reference_title: "Novel α-synuclein mutation A53E associated with atypical multiple system atrophy and Parkinson's disease-type pathology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The A53E mutation was found in 2 other relatives who had parkinsonism. Our results suggest that the novel SNCA A53E substitution is a causative mutation resulting clinically in parkinsonism and pathologically in severe multiple system atrophy- and PD-type phenotype."
      explanation: Segregation and the mixed neuropathology.
  - name: SNCA locus duplication
    description: >-
      Three copies of the wild-type gene, with multiplicated intervals of
      variable size (about 0.9 Mb in the Swedish Lister family branch, average
      about 2 Mb across families) that may carry neighbouring genes such as
      MMRN1. Later onset than triplication, incomplete penetrance, and a
      phenotype ranging from idiopathic-like Parkinson disease to dementia with
      Lewy bodies and dysautonomia.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:17251522
      reference_title: Phenotypic variation in a large Swedish pedigree due to SNCA duplication and triplication.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Molecular analysis identified a genomic duplication of <0.9 Mb encompassing alpha-synuclein and multimerin 1 (SNCA-MMRN1), flanked by long interspersed repeat sequences (LINE L1)."
      explanation: Breakpoint characterization of a duplication.
    - reference: PMID:15451225
      reference_title: "Causal relation between alpha-synuclein gene duplication and familial Parkinson's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two patients had duplications, which were confirmed by analysis of intragenic and flanking microsatellite markers. The phenotype in both patients was indistinguishable from idiopathic Parkinson's disease and no atypical features were present, by contrast with reports of families with triplication of the same gene."
      explanation: The idiopathic-like end of the duplication phenotype.
  - name: SNCA locus triplication
    description: >-
      Four copies of the wild-type gene (the Iowa kindred and a branch of the
      Swedish Lister family), doubling SNCA mRNA and alpha-synuclein protein in
      blood and brain. Fully penetrant, early-onset, rapidly progressive
      parkinsonism with dementia.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:15159488
      reference_title: Alpha-synuclein in blood and brain from familial Parkinson disease with SNCA locus triplication.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here it is shown that SNCA triplication results in a doubling in the amount of alpha-synuclein protein in blood."
      explanation: The dosage consequence measured in patients.
    - reference: PMID:17251522
      reference_title: Phenotypic variation in a large Swedish pedigree due to SNCA duplication and triplication.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The genetic basis for familial parkinsonism is an SNCA-MMRN11 multiplication, but whereas SNCA-MMRN1 duplication in the Swedish proband (Branch J) leads to late-onset autonomic dysfunction and parkinsonism, SNCA-MMRN1 triplication in the Swedish American family (Branch I) leads to early-onset Parkinson disease and dementia."
      explanation: Duplication and triplication in one pedigree, with the dosage-severity contrast.

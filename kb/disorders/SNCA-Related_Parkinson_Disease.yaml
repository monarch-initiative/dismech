    reference_title: "Clinical heterogeneity of alpha-synuclein gene duplication in Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also detected asymptomatic carriers in the families of both patients. Interestingly, the penetrance ratio was 33.3% (2/6) in one kindred, indicating that the ratio was very much lower than expected."
    explanation: Incomplete penetrance and asymptomatic carriers, the counseling issues.
  - reference: PMID:26350119
    reference_title: "Autosomal dominant Parkinson's disease caused by SNCA duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic counselling is made difficult by the wide range of ages at which symptoms develop in SNCA duplication carriers, and by the fact that penetrance remains incomplete even at 79 years of age"
    explanation: States the counselling difficulty directly, naming variable onset age and incomplete penetrance.
differential_diagnoses:
- name: Idiopathic Parkinson Disease
  description: >-
    Clinically overlapping, especially with the duplication and p.His50Gln
    subtypes; earlier onset, a positive family history, dosage-dependent
    severity, prominent early dementia or dysautonomia and molecular testing
    discriminate. Common SNCA variation is also the strongest risk locus for the
    sporadic disease, curated in the Parkinson disease basket.
  disease_term:
    preferred_term: Parkinson disease
    term:
      id: MONDO:0005180
      label: Parkinson disease
  evidence:
  - reference: PMID:15451224
    reference_title: "Alpha-synuclein locus duplication as a cause of familial Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By contrast with SNCA triplication families, the clinical phenotype of SNCA duplication closely resembles idiopathic Parkinson's disease, which has a late age-of-onset, progresses slowly, and in which neither cognitive decline nor dementia are prominent."
    explanation: The duplication subtype can be indistinguishable from idiopathic disease.
- name: Multiple System Atrophy
  description: >-
    The p.Gly51Asp and p.Ala53Glu subtypes, and some duplication carriers with
    early dysautonomia, overlap multiple system atrophy both clinically and
    pathologically, with oligodendroglial glial cytoplasmic inclusions; MSA is
    not usually familial and carries no SNCA mutation.
  disease_term:
    preferred_term: multiple system atrophy
    term:
      id: MONDO:0007803
      label: multiple system atrophy
  evidence:
  - reference: PMID:24746362
    reference_title: "Novel α-synuclein mutation A53E associated with atypical multiple system atrophy and Parkinson's disease-type pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "highly abundant SNCA pathology was observed throughout the brain and spinal cord showing features of multiple system atrophy and PD."
    explanation: The mixed MSA and PD pathology that drives this differential.
- name: Dementia with Lewy Bodies
  description: >-
    The non-motor profile of SNCA multiplication carriers, with early cognitive
    decline, visual hallucinations and RBD, resembles dementia with Lewy bodies;
    the distinction is the Mendelian cause and the parkinsonism.
  disease_term:
    preferred_term: dementia with Lewy bodies
    term:
      id: MONDO:0007488
      label: Lewy body dementia
  evidence:
  - reference: PMID:26350119
    reference_title: "Autosomal dominant Parkinson's disease caused by SNCA duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In general, the non-motor phenotypes of these cases resembled the phenotypes frequently seen in dementia with Lewy bodies (DLB), with prominent cognitive and psychiatric impairments and RBD."
    explanation: The overlap with dementia with Lewy bodies.
discussions:
- discussion_id: emerging_alpha_synuclein_targeted_therapy
  prompt: >-
    Can lowering or clearing alpha-synuclein, by anti-aggregation agents,
    passive immunotherapy or SNCA-lowering, modify the course of SNCA-related
    disease, where the lesion is directly upstream of the protein?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Increased Alpha-Synuclein Gene Dosage
  - pathophysiology#Alpha-Synuclein Oligomerization and Amyloid Fibril Formation
  rationale: >-
    SNCA disease is the one genetic form whose root lesion is the quantity or
    aggregation propensity of alpha-synuclein itself, so a therapy that lowers or
    clears the protein acts directly on the cause rather than on a downstream
    node. Passive immunotherapies against alpha-synuclein and active vaccines
    have entered early-phase trials in Parkinson disease, and multiplication
    carriers, whose disease is driven purely by dosage, are the population in
    which the rationale is cleanest. None is approved and none has yet shown
    disease modification; the entry records the target, not a treatment.
  evidence:
  - reference: PMID:30619023
    reference_title: A Meta-Analysis of α-Synuclein Multiplication in Familial Parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Such alpha-synuclein targeted therapies may be most beneficial to subjects with increased SNCA dosage and patients with idiopathic alpha-synucleinopathies (PD, PDD, DLB, MSA)."
    explanation: States the rationale for anti-synuclein therapy in dosage-driven disease.
- discussion_id: ctrl_wild_type_overexpression_toxicity
  prompt: >-
    How does an increased dose of wild-type alpha-synuclein, with no change in
    the protein, cause a fully penetrant aggressive disease, and is the earliest
    lesion a synaptic-release deficit rather than aggregation?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Increased Alpha-Synuclein Gene Dosage
  - pathophysiology#Impaired Synaptic Vesicle Recycling and Dopamine Release
  rationale: >-
    Overexpression of wild-type alpha-synuclein in the range predicted for
    multiplication impairs neurotransmitter release before any aggregation or
    cell loss is detectable, which argues that a physiological synaptic deficit,
    not inclusion formation, is the initiating event in the dosage subtype. Yet
    the aggregated fraction also rises with dosage and the end-stage pathology is
    Lewy disease. Whether the synaptic deficit and the aggregation are parallel
    consequences of excess protein or a single ordered cascade is unresolved, and
    it matters for when in the disease a synuclein-lowering therapy would have to
    act.
  evidence:
  - reference: PMID:20152114
    reference_title: Increased expression of alpha-synuclein reduces neurotransmitter release by inhibiting synaptic vesicle reclustering after endocytosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Increased levels of alpha-synuclein thus produce a specific, physiological defect in synaptic vesicle recycling that precedes detectable neuropathology."
    explanation: The pre-aggregation synaptic deficit that frames the controversy.

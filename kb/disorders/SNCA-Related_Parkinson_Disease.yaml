- name: Cardiac Sympathetic Denervation
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Alpha-synuclein pathology affects peripheral autonomic neurons, producing
    sympathetic denervation of the heart that is demonstrable by reduced cardiac
    MIBG uptake and by absent tyrosine-hydroxylase immunostaining in the
    myocardium at autopsy. It is documented in p.Glu46Lys carriers, including
    asymptomatic ones, and underlies the orthostatic hypotension of the
    dysautonomia.
  cell_types:
  - preferred_term: sympathetic neuron
    term:
      id: CL:0011103

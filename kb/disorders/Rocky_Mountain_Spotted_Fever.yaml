name: Rocky Mountain spotted fever
creation_date: "2026-08-02T14:15:00Z"
category: Infectious Disease
parents:
- Spotted fever rickettsiosis
- Rickettsial disease
- Tick-borne disease
synonyms:
- RMSF
- Rickettsia rickettsii infection
- Sao Paulo fever
- Brazilian spotted fever
- Tick typhus
description: >-
  Rocky Mountain spotted fever is an acute, life-threatening tick-borne
  rickettsiosis caused by the obligate intracellular bacterium Rickettsia
  rickettsii. After inoculation by a feeding Dermacentor or Rhipicephalus tick,
  the organism disseminates and infects vascular endothelial cells throughout the
  body, producing a systemic small-vessel vasculitis with adherens-junction
  disruption, increased microvascular permeability, platelet consumption, and
  end-organ injury. Illness begins nonspecifically 3-12 days after the tick bite
  with fever, headache, myalgia, and gastrointestinal symptoms; a macular rash
  typically appears 2-4 days after fever onset, begins on the wrists and ankles,
  and may become petechial. It is the most frequently fatal rickettsiosis in the
  United States, and outcome is dominated by the timing of empiric doxycycline:
  patients treated after the fifth day of illness are substantially more likely
  to die.

- name: Platelet Consumption and Coagulation Activation
  biological_scale: CELLULAR
  description: >-
    Injured endothelium consumes platelets intravascularly and activates the
    coagulation system. In experimental canine infection, retinal vasculitic
    foci developed together with thrombocytopenia, increased circulating
    fibrinogen, and slight prolongation of the activated partial thromboplastin
    time - a mild consumptive coagulopathy that can progress to disseminated
    intravascular coagulation in severe disease.

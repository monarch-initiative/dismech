- name: VE-Cadherin Phosphorylation and Adherens Junction Disruption
  biological_scale: MOLECULAR
  description: >-
    Spotted fever group rickettsial infection of microvascular endothelial cells
    activates tyrosine phosphorylation of VE-cadherin, attenuating homophilic
    adherens-junction protein-protein interactions and producing paracellular
    barrier dysfunction. This is the best-characterized molecular route from
    endothelial infection to microvascular leak.
  biological_processes:
  - preferred_term: adherens junction organization
    term:
      id: GO:0034332
      label: adherens junction organization
    modifier: DECREASED
  evidence:
  - reference: PMID:22720111
    reference_title: "Rickettsiae induce microvascular hyperpermeability via phosphorylation of VE-cadherins: evidence from atomic force microscopy and biochemical studies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "upon infection by SFG rickettsiae, phosphorylation of VE-cadherin directly attenuates homophilic protein-protein interactions at the endothelial adherens junctions, and may lead to endothelial paracellular barrier dysfunction causing microvascular hyperpermeability"
    explanation: >-
      Atomic force microscopy and biochemical assays establish the
      VE-cadherin-phosphorylation mechanism. The experiments used the
      non-pathogenic surrogate R. montanensis under BSL2 conditions, so the
      inference to R. rickettsii is by genetic and phenotypic similarity (see
      the HUMAN_MODEL_MISMATCH discussion on this entry).

      treatment for patients of all ages.
    supporting_text: "Doxycycline is the drug of choice for treatment of all tickborne rickettsial diseases in patients of all ages, including children aged <8 years"
- reference: PMID:17236897
  title: "Clinical and laboratory features, hospital course, and outcome of Rocky Mountain spotted fever in children."
  found_in:
  - Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md
  findings:
  - statement: >-
      A 92-patient multicenter pediatric series quantifies the frequency of
      fever, rash, nausea/vomiting, headache, thrombocytopenia, and
      hyponatremia, and documents death or neurologic deficits at discharge.
    supporting_text: "which most commonly included fever (98%), rash (97%), nausea and/or vomiting (73%), and headache (61%)"
- reference: PMID:25697742
  title: "Risk factors for fatal outcome from rocky mountain spotted Fever in a highly endemic area-Arizona, 2002-2011."
  found_in:
  - Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md
  findings:
  - statement: >-
      A 205-case review in a high-incidence Arizona region shows that
      doxycycline was started significantly later in fatal than nonfatal cases
      and identifies clinical risk factors for treatment delay.
    supporting_text: "Doxycycline was initiated significantly later in fatal cases (median, day 7) than nonfatal cases (median, day 3)"
- reference: PMID:22720111
  title: "Rickettsiae induce microvascular hyperpermeability via phosphorylation of VE-cadherins: evidence from atomic force microscopy and biochemical studies."
  found_in:
  - Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md
  findings:
  - statement: >-
      Spotted fever group rickettsial infection of microvascular endothelial
      cells phosphorylates VE-cadherin and attenuates adherens-junction
      interactions, giving a molecular mechanism for hyperpermeability. The
      experiments used the non-pathogenic surrogate R. montanensis at BSL2.
    supporting_text: "phosphorylation of VE-cadherin directly attenuates homophilic protein-protein interactions at the endothelial adherens junctions"
- reference: PMID:6687526
  title: "Fulminant Rocky Mountain spotted fever. Its pathologic characteristics associated with glucose-6-phosphate dehydrogenase deficiency."
  found_in:
  - Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md
  findings:
  - statement: >-
      Fulminant RMSF (death on or before day 5) in G6PD-deficient patients shows
      extensive fibrin thrombosis with minimal mononuclear inflammatory
      response, a hyperacute thrombotic variant of the classic vasculitic course.
    supporting_text: "Thrombosis was more extensive than in classic RMSF, with fibrin thrombi located in foci of rickettsial infection."
- reference: PMID:2105679
  title: "Vascular permeability and coagulation during Rickettsia rickettsii infection in dogs."
  found_in:
  - Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md
  findings:
  - statement: >-
      Experimental canine R. rickettsii infection links retinal vasculitic foci
      to altered vascular permeability and to thrombocytopenia with coagulation
      activation.
    supporting_text: "Twenty-four to 48 hours after the onset of fever and rickettsemia, multifocal areas of retinal vasculitis were evident, which corresponded to areas of altered vascular permeability demonstrated by fluorescein angiography."
- reference: PMID:11179362
  title: "Critical role of cytotoxic T lymphocytes in immune clearance of rickettsial infection."
  found_in:
  - Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md
  findings:
  - statement: >-
      MHC class I knockout mice are dramatically more susceptible to lethal
      rickettsial infection, establishing CD8 T lymphocyte cytotoxicity as
      critical for clearing rickettsia-infected endothelium.
    supporting_text: "immune clearance of rickettsial infection was more dependent on CD8 T lymphocytes, and there is evidence that CTL activity is a critical factor."
- reference: PMID:25827414
  title: "Targeted knockout of the Rickettsia rickettsii OmpA surface antigen does not diminish virulence in a mammalian model system."
  found_in:
  - Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md
  findings:
  - statement: >-
      An isogenic rOmpA knockout in the virulent Sheila Smith strain did not
      attenuate virulence in guinea pigs, indicating redundancy among
      rickettsial adhesins rather than a single essential invasion factor.
    supporting_text: "no significant difference in either fever peak (40.5 C) or duration (8 days) were shown between the wild type and the knockout"
- reference: PMID:28365226
  title: "Rocky Mountain spotted fever in Mexico: past, present, and future."
  found_in:
  - Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md
  findings:
  - statement: >-
      A Lancet review documents the re-emergence of RMSF in Sonora and Baja
      California driven by domesticated dogs and brown dog ticks.
    supporting_text: "Rocky Mountain spotted fever, a tick-borne zoonosis caused by Rickettsia rickettsii, is among the most lethal of all infectious diseases in the Americas."
- reference: PMID:25794784
  title: "No visible dental staining in children treated with doxycycline for suspected Rocky Mountain Spotted Fever."
  found_in:
  - Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md
  findings:
  - statement: >-
      Children who received doxycycline before 8 years of age showed no
      tetracycline-like staining and no difference in tooth shade or enamel
      hypoplasia, removing the historical barrier to doxycycline in young
      children.
    supporting_text: "No tetracycline-like staining was observed in any of the exposed children's teeth (0/58, 95% CI 0%-5%), and no significant difference in tooth shade (P=.20) or hypoplasia (P=1.0) was found between the 2 groups."
- reference: PMID:16926398
  title: "Infection of human endothelial cells with spotted Fever group rickettsiae stimulates cyclooxygenase 2 expression and release of vasoactive prostaglandins."
  found_in:
  - Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md
  findings:
  - statement: >-
      Spotted fever group infection of human endothelial cells upregulates COX-2
      and vasoactive prostaglandins, a mechanism contributing to inflammatory
      and vascular permeability changes in RMSF.
    supporting_text: "Rocky Mountain spotted fever and boutonneuse fever, due to Rickettsia rickettsii and R. conorii, respectively, are characterized by widespread infection of the vascular endothelium, microvascular injury, and vasculitis."
- reference: PMID:16360032
  title: "Ku70, a component of DNA-dependent protein kinase, is a mammalian receptor for Rickettsia conorii."
  found_in:
  - Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md
  findings:
  - statement: >-
      Ku70 was identified as a mammalian receptor engaged by rickettsial OmpB
      for host-cell entry, characterized for the closely related spotted fever
      group agent R. conorii.
    supporting_text: "Ku70, a component of DNA-dependent protein kinase, is a mammalian receptor for Rickettsia conorii."

- name: Increased Microvascular Permeability
  biological_scale: TISSUE
  description: >-
    Pathogen-mediated injury to the vascular endothelium produces increased
    capillary permeability and microhemorrhage. The late-stage manifestations of
    noncardiogenic pulmonary edema (ARDS) and cerebral edema are direct
    consequences of this microvascular leakage, and hypovolemia from leak drives
    appropriate antidiuretic hormone secretion and hyponatremia.

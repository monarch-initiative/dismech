progression:
- phase: Incubation period
  incubation_days: "3-12"
  notes: >-
    Symptoms appear 3-12 days after the bite of an infected tick; a shorter
    incubation (5 days or less) is associated with severe disease.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms of RMSF typically appear 3-12 days after the bite of an infected tick"
    explanation: The CDC report gives the incubation window.
- phase: Nonspecific febrile prodrome
  notes: >-
    Illness begins abruptly with fever, headache, chills, malaise, and myalgia,
    often with gastrointestinal symptoms and before any rash is visible.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial symptoms include sudden onset of fever, headache, chills, malaise, and myalgia."
    explanation: The CDC report describes the initial nonspecific febrile phase.
- phase: Rash onset and centripetal spread
  notes: >-
    A rash typically appears 2-4 days after fever onset, beginning as blanching
    macules on the ankles, wrists, or forearms and spreading to the palms,
    soles, limbs, and trunk, usually sparing the face.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A rash typically appears 2-4 days after the onset of fever"
    explanation: The CDC report gives rash timing relative to fever onset.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "blanching, pink macules on the ankles, wrists, or forearms that subsequently spread to the palms, soles, arms, legs, and trunk, usually sparing the face"
    explanation: The CDC report describes the characteristic acral-onset centripetal spread.
- phase: Late-stage multiorgan disease
  notes: >-
    Untreated or late-treated disease progresses to meningoencephalitis, acute
    renal failure, ARDS, cutaneous necrosis, shock, arrhythmia, and seizure.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe, late-stage manifestations of RMSF include meningoencephalitis, acute renal failure, ARDS, cutaneous necrosis, shock, arrhythmia, and seizure."
    explanation: The CDC report enumerates the late-stage complications of untreated disease.
epidemiology:
- name: Treatment delay as the dominant determinant of death
  description: >-
    Delay in diagnosis and treatment is the most important factor associated
    with death. Patients treated after the fifth day of illness are more likely
    to die, and in a high-incidence Arizona region doxycycline was started a
    median of four days later in fatal than in nonfatal cases.
  factors:
  - delayed doxycycline initiation
  - late-onset or absent rash
  - atypical or gastrointestinal early manifestations
  - absence of a reported tick bite
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Delay in diagnosis and treatment is the most important factor associated with increased likelihood of death, and early empiric therapy is the best way to prevent RMSF progression."
    explanation: The CDC report identifies treatment delay as the dominant modifiable determinant of mortality.
  - reference: PMID:25697742
    reference_title: "Risk factors for fatal outcome from rocky mountain spotted Fever in a highly endemic area-Arizona, 2002-2011."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Doxycycline was initiated significantly later in fatal cases (median, day 7) than nonfatal cases (median, day 3)"
    explanation: The Arizona case review quantifies the treatment-timing difference between fatal and nonfatal cases.
- name: Host risk factors for fatal outcome
  description: >-
    Additional risk factors for fatal RMSF include age 40 years or older, age
    under 10 years, alcohol abuse, and glucose-6-phosphate dehydrogenase
    deficiency (a risk factor specifically for the fulminant form).
  factors:
  - age 40 years or older
  - age under 10 years
  - alcohol abuse
  - glucose-6-phosphate dehydrogenase deficiency
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional risk factors for fatal RMSF include age >=40 years, age <10 years, and alcohol abuse"
    explanation: The CDC report enumerates host risk factors for fatal outcome.
  - reference: PMID:25697742
    reference_title: "Risk factors for fatal outcome from rocky mountain spotted Fever in a highly endemic area-Arizona, 2002-2011."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple factors increased the risk of doxycycline delay and fatal outcome, such as early symptoms of nausea and diarrhea, history of alcoholism or chronic lung disease, and abnormal laboratory results such as elevated liver aminotransferases."
    explanation: The Arizona review found alcoholism and chronic lung disease among factors increasing risk of doxycycline delay and fatal outcome.
- name: Case fatality before and after antimicrobial therapy
  description: >-
    RMSF is the most frequently fatal rickettsial illness in the United States.
    Case fatality was approximately 25% in the preantibiotic era; present-day
    estimates are 5%-10% overall and depend heavily on the timing of treatment,
    with rates of 40%-50% reported among patients treated on days 8 or 9.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RMSF is the most frequently fatal rickettsial illness in the United States; the case-fatality rate in the preantibiotic era was approximately 25%"
    explanation: The CDC report gives the historical and present-day case-fatality estimates.
- name: Brown dog tick driven re-emergence in Mexico
  description: >-
    RMSF re-emerged in Sonora and Baja California in the early 21st century,
    driven by the same environmental circumstances - domesticated dogs and
    Rhipicephalus sanguineus brown dog ticks - that produced devastating
    Mexican outbreaks in the 1940s.
  factors:
  - free-roaming domestic dogs
  - peridomestic brown dog tick infestation
  evidence:
  - reference: PMID:28365226
    reference_title: "Rocky Mountain spotted fever in Mexico: past, present, and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These investigators also described the pivotal roles of domesticated dogs and Rhipicephalus sanguineus sensu lato (brown dog ticks) as drivers of epidemic levels of Rocky Mountain spotted fever."
    explanation: The Lancet review identifies dogs and brown dog ticks as drivers of epidemic RMSF in Mexico.

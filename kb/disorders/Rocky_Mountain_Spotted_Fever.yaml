genetic:
- name: G6PD deficiency as a fulminant-disease modifier
  gene_term:
    preferred_term: G6PD
    term:
      id: hgnc:4057
      label: G6PD
  association: >-
    Glucose-6-phosphate dehydrogenase deficiency does not cause RMSF but is a
    recognized host modifier of severity. It is a risk factor for the fulminant
    form, in which death occurs on or before day 5 of illness with extensive
    fibrin thrombosis and minimal inflammatory response.
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:6687526
    reference_title: "Fulminant Rocky Mountain spotted fever. Its pathologic characteristics associated with glucose-6-phosphate dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three patients were male blacks with glucose-6-phosphate dehydrogenase deficiency, a condition recently associated with severity of RMSF."
    explanation: The autopsy series links G6PD deficiency to the fulminant RMSF phenotype.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glucose-6-phosphate dehydrogenase deficiency is a risk factor for fulminant RMSF, with death occurring in <=5 days"
    explanation: National guidance independently records G6PD deficiency as a fulminant-disease risk factor.
  notes: >-
    No specific G6PD allele has been implicated beyond G6PD deficiency broadly,
    and no RMSF-specific GWAS or additional host susceptibility locus has been
    reported.
environmental:
- name: Tick exposure in endemic habitat
  influences_mechanisms:
  - target: Tick-Borne Rickettsia rickettsii Inoculation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Entering the wooded, shrubby and grassy habitat where questing
      Dermacentor ticks congregate is what brings a person within reach of an
      attaching, infected tick.
    evidence:
    - reference: PMID:27172113
      reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "D. variabilis ticks often are encountered in wooded, shrubby, and grassy areas and tend to congregate along walkways and trails."
      explanation: >-
        Describes where these ticks are encountered and that they congregate
        along walkways and trails, the habitat contact that precedes
        inoculation.
  description: >-
    Exposure to questing Dermacentor ticks in wooded, shrubby, and grassy areas,
    including residential areas and city parks, is the proximate environmental
    risk. Adult Dermacentor ticks are active from spring through autumn with
    maximum activity in late spring through early summer.
  effect: Increases the probability of an infectious tick bite and therefore of acquiring RMSF.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "D. variabilis ticks often are encountered in wooded, shrubby, and grassy areas and tend to congregate along walkways and trails."
    explanation: The CDC report describes the habitat in which vector exposure occurs.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adult Dermacentor ticks are active from spring through autumn, with maximum activity during late spring through early summer."
    explanation: The CDC report gives the seasonality of vector activity.
- name: Domestic dog and peridomestic brown dog tick exposure
  influences_mechanisms:
  - target: Tick-Borne Rickettsia rickettsii Inoculation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Dogs are not themselves the source of infection: they maintain and
      amplify brown dog tick populations around dwellings, and those ticks
      then bite people. The intermediates are known, which is why this is
      indirect rather than direct.
    evidence:
    - reference: PMID:28365226
      reference_title: "Rocky Mountain spotted fever in Mexico: past, present, and future."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These investigators also described the pivotal roles of domesticated dogs and Rhipicephalus sanguineus sensu lato (brown dog ticks) as drivers of epidemic levels of Rocky Mountain spotted fever."
      explanation: >-
        Identifies domestic dogs and brown dog ticks as drivers of epidemic
        transmission, the amplification step between dog contact and human
        inoculation.
  description: >-
    Domestic dogs are the preferred host of Rhipicephalus sanguineus at all life
    stages, and free-roaming dogs with peridomestic tick infestation drive the
    high-incidence epidemic foci in Arizona and northern Mexico. Dogs are also
    susceptible to R. rickettsii and can serve as sentinels for human risk.
  effect: Sustains a peridomestic transmission cycle that raises human exposure to infected brown dog ticks.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Canids, especially domestic dogs, are the preferred hosts for the brown dog tick at all life stages."
    explanation: The CDC report identifies dogs as the tick host driving peridomestic transmission.
  - reference: PMID:28365226
    reference_title: "Rocky Mountain spotted fever in Mexico: past, present, and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These investigators also described the pivotal roles of domesticated dogs and Rhipicephalus sanguineus sensu lato (brown dog ticks) as drivers of epidemic levels of Rocky Mountain spotted fever."
    explanation: The Lancet review identifies dogs and brown dog ticks as epidemic drivers.
diagnosis:
- name: Empiric clinical diagnosis without waiting for confirmation
  description: >-
    Because diagnostic tests are usually not helpful during the initial stages
    of illness and the classic triad of fever, rash, and reported tick bite is
    present in only a minority of patients at presentation, RMSF is treated
    empirically on clinical and epidemiologic suspicion.
  diagnosis_term:
    preferred_term: clinical diagnosis
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Compatible acute febrile illness with tick exposure in an endemic area
    warrants immediate empiric doxycycline regardless of test results.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnostic tests for rickettsial diseases, particularly for RMSF, are usually not helpful in making a timely diagnosis during the initial stages of illness."
    explanation: The CDC report establishes that acute testing cannot guide initial treatment.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The classic triad of fever, rash, and reported tick bite is present in only a minority of patients during initial presentation to health care"
    explanation: The CDC report documents the low sensitivity of the classic triad at presentation.
- name: Paired-serum indirect immunofluorescence antibody assay
  description: >-
    The standard confirmatory test is the indirect immunofluorescence antibody
    (IFA) assay on paired acute and convalescent sera; at least a fourfold rise
    in antibody titer is confirmatory. IFA assays are insensitive during the
    first week of illness and therefore confirm the diagnosis retrospectively.
  diagnosis_term:
    preferred_term: serologic testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: A fourfold or greater rise in R. rickettsii antibody titer between paired sera confirms infection.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A diagnosis of tickborne rickettsial disease is confirmed with a fourfold or greater increase in antibody titer in samples collected at appropriately timed intervals in patients with a clinically compatible acute illness"
    explanation: The CDC report defines the serologic confirmation criterion.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indirect immunofluorescence antibody (IFA) assays using paired acute and convalescent sera are the reference standard for serologic confirmation of rickettsial infection"
    explanation: The CDC report identifies IFA as the standard serologic assay.
- name: Supportive laboratory pattern
  description: >-
    Thrombocytopenia, slight transaminase elevation, hyponatremia, and a normal
    or slightly increased white blood cell count with increased immature
    neutrophils together form a suggestive but non-specific pattern that cannot
    be relied on to guide early treatment.
  diagnosis_term:
    preferred_term: clinical laboratory testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: Suggestive but non-diagnostic haematologic, hepatic, and electrolyte abnormalities.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "however, laboratory values cannot be relied on to guide early treatment decisions"
    explanation: The CDC report cautions against using laboratory findings to gate early therapy.
- name: Whole-blood PCR for Rickettsia rickettsii
  description: >-
    Real-time PCR amplification of R. rickettsii DNA from whole blood can
    confirm infection during the acute stage, but sensitivity is low because
    few rickettsiae circulate before advanced disease; tissue specimens are a
    better source of spotted fever group rickettsial DNA than acute blood.
    Blood should be drawn before antibacterial agents are given, because
    doxycycline reduces PCR sensitivity. A negative PCR result therefore never
    excludes RMSF and must not delay empiric doxycycline.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: >-
    A positive result confirms rickettsial infection and identifies the
    species; a negative result is uninformative in early or mild disease.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PCR detection of R. rickettsii in whole blood is possible but less sensitive because low numbers of rickettsiae typically circulate in the blood in the absence of advanced disease"
    explanation: The CDC report documents the low sensitivity of whole-blood PCR for R. rickettsii.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "obtaining blood for molecular testing before antibacterial agents are administered is recommended to minimize the likelihood of a false-negative result"
    explanation: The CDC report recommends collecting molecular-testing specimens before therapy is started.
- name: Immunohistochemical staining of a skin punch biopsy
  description: >-
    Immunostaining (immunohistochemistry or immunofluorescence) for
    rickettsial antigen in formalin-fixed, paraffin-embedded skin punch biopsy
    of a rash lesion or eschar is a rapid confirmatory technique that, unlike
    serology, can establish the diagnosis during acute illness. It is highly
    specific but only moderately sensitive, so a negative stain does not
    exclude RMSF.
  diagnosis_term:
    preferred_term: skin biopsy immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  results: >-
    Detection of spotted fever group rickettsial antigen in dermal
    microvascular endothelium; approximately 100% specific and 70% sensitive.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For patients with a rash or eschar, immunohistochemical staining of a skin punch biopsy is a useful diagnostic technique"
    explanation: The CDC report endorses skin punch biopsy immunohistochemistry for rash or eschar.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunostaining of skin biopsy specimens is 100% specific and 70% sensitive in diagnosing RMSF"
    explanation: The CDC report quantifies the specificity and sensitivity of skin biopsy immunostaining.
differential_diagnoses:
- name: Meningococcemia
  description: >-
    RMSF-associated cutaneous necrosis and gangrene can be difficult to
    distinguish clinically from purpura fulminans associated with
    meningococcemia.
  distinguishing_features:
  - Purpura fulminans of meningococcemia closely mimics RMSF cutaneous necrosis
  - Tick exposure history and acral-onset rash favour RMSF
  - Both warrant concurrent empiric therapy while awaiting diagnostic information
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RMSF-associated cutaneous necrosis and gangrene might be difficult to distinguish clinically from purpura fulminans associated with meningococcemia"
    explanation: The CDC report names meningococcemia as a key clinical mimic.
- name: Thrombotic thrombocytopenic purpura
  description: >-
    RMSF-associated neurologic manifestations, renal failure, and
    thrombocytopenia have led to confusion with thrombotic thrombocytopenic
    purpura.
  distinguishing_features:
  - Neurologic signs, renal failure, and thrombocytopenia overlap between the two
  - Tick exposure history and response to doxycycline favour RMSF
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RMSF-associated neurologic manifestations, renal failure, and thrombocytopenia have led to confusion with the diagnosis of thrombotic thrombocytopenic purpura (TTP)"
    explanation: The CDC report records TTP as a recognized diagnostic confusion.
- name: Kawasaki disease
  description: >-
    RMSF-associated vasculitis in children has been confused with idiopathic
    acute vasculitides such as Kawasaki disease.
  distinguishing_features:
  - Both present with fever and rash in children
  - RMSF follows tick exposure in an endemic area and responds to doxycycline
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RMSF-associated vasculitis has been confused with idiopathic, acute vasculitides, such as Kawasaki disease in pediatric patients."
    explanation: The CDC report names Kawasaki disease as a pediatric mimic.
- name: Acute gastroenteritis
  description: >-
    Prominent early nausea, vomiting, abdominal pain, and diarrhea commonly lead
    to an initial diagnosis of gastroenteritis, which delays doxycycline and
    increases the risk of fatal outcome.
  distinguishing_features:
  - Gastrointestinal symptoms in RMSF accompany high fever and severe headache
  - Gastrointestinal symptoms often precede any rash
  - Misattribution to gastroenteritis is a documented cause of treatment delay and death
  evidence:
  - reference: PMID:25697742
    reference_title: "Risk factors for fatal outcome from rocky mountain spotted Fever in a highly endemic area-Arizona, 2002-2011."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple factors increased the risk of doxycycline delay and fatal outcome, such as early symptoms of nausea and diarrhea"
    explanation: The Arizona review links early gastrointestinal symptoms to treatment delay and death.
treatments:
- name: Empiric doxycycline for patients of all ages
  description: >-
    Doxycycline is the drug of choice for RMSF in patients of all ages,
    including children under 8 years, and should be started immediately on
    clinical suspicion without waiting for laboratory confirmation. Patients
    treated after the fifth day of illness are more likely to die. The
    historical reluctance to use doxycycline in young children is not supported:
    children who received courses of doxycycline before age 8 showed no
    tetracycline-like dental staining and no difference in tooth shade or enamel
    hypoplasia. Agents to avoid - sulfonamide antimicrobials can result in
    increased disease severity and death in RMSF.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation
    treatment_effect: INHIBITS
    description: >-
      Doxycycline binds the bacterial 30S ribosomal subunit and arrests
      rickettsial protein synthesis.
  - target: Obligate Intracellular Niche (Cell-Penetrant Drug Requirement)
    treatment_effect: BYPASSES
    description: >-
      Doxycycline accumulates intracellularly and so reaches the cytoplasmic
      organism that beta-lactams cannot.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Doxycycline is the drug of choice for treatment of all tickborne rickettsial diseases in patients of all ages, including children aged <8 years, and should be initiated immediately in persons with signs and symptoms suggestive of rickettsial disease"
    explanation: The CDC national recommendation establishes doxycycline as first-line for all ages.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients treated after the fifth day of illness are more likely to die than those treated earlier in the course of illness"
    explanation: Supports the day-5 treatment window that governs outcome.
  - reference: PMID:25794784
    reference_title: "No visible dental staining in children treated with doxycycline for suspected Rocky Mountain Spotted Fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No tetracycline-like staining was observed in any of the exposed children's teeth (0/58, 95% CI 0%-5%), and no significant difference in tooth shade (P=.20) or hypoplasia (P=1.0) was found between the 2 groups."
    explanation: >-
      Directly supports the safety statement that removed the age barrier to
      doxycycline in young children.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment of patients with RMSF using a sulfonamide antimicrobial can result in increased disease severity and death"
    explanation: Supports the agents-to-avoid warning recorded in this treatment description.
- name: Chloramphenicol as second-line therapy
  description: >-
    Chloramphenicol is the only alternative drug that has been used to treat
    RMSF, and it is clearly inferior to doxycycline - CDC case-report data show
    higher mortality in chloramphenicol-treated patients. It is no longer
    available orally in the United States, requires monitoring of blood indices
    for hematologic toxicity, and does not cover ehrlichiosis or anaplasmosis,
    so empiric substitution leaves those co-endemic infections untreated. In
    pregnancy it is a potential alternative to doxycycline, but administration
    late in the third trimester carries a theoretical risk of gray baby
    syndrome. Because doxycycline has been used successfully in pregnant women
    and RMSF is potentially fatal, doxycycline remains preferred for suspected
    RMSF in pregnancy; chloramphenicol is reserved for true doxycycline
    intolerance.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: chloramphenicol
      term:
        id: CHEBI:17698
        label: chloramphenicol
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation
    treatment_effect: INHIBITS
    description: >-
      Chloramphenicol binds the bacterial 50S ribosomal subunit and blocks
      rickettsial protein synthesis, acting on the same translational target
      that doxycycline inhibits from the 30S side.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Chloramphenicol is the only alternative drug that has been used to treat RMSF; however, epidemiologic studies using CDC case report data suggest that patients with RMSF treated with chloramphenicol are at higher risk for death than persons who received a tetracycline"
    explanation: >-
      Supports chloramphenicol as the sole alternative agent while documenting
      its inferior mortality outcome relative to tetracyclines.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chloramphenicol is a potential alternative treatment for RMSF during pregnancy; however, care must be used when administering the drug late during the third trimester of pregnancy because of the theoretical risk for gray baby syndrome"
    explanation: Supports the pregnancy positioning and the third-trimester gray baby syndrome caveat.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Doxycycline has been used successfully to treat tickborne rickettsial diseases in several pregnant women without adverse effects to the mother"
    explanation: Supports retaining doxycycline as the preferred agent in pregnancy.
- name: Tick-bite prevention counseling
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  description: >-
    No vaccine is licensed against tickborne rickettsial diseases, so primary
    prevention rests entirely on interrupting the tick-inoculation step that
    triggers the pathograph. Personal protective measures are DEET at 20-30
    percent on skin, with IR3535 or picaridin above 15 percent as alternatives;
    permethrin applied to outer clothing but never to skin, which reduces tick
    bites by more than 80 percent among outdoor workers; protective clothing;
    and prompt tick checks and bathing after time in tick habitat, since
    several hours may elapse before an attached tick transmits the organism.
    Prophylactic doxycycline after a tick bite is explicitly not recommended,
    and asymptomatic seropositive persons should not be treated - antibody can
    persist for months to years, so serology cannot be used to monitor
    treatment response.
  treatment_term:
    preferred_term: tick-bite prevention counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No vaccine is licensed for the prevention of tickborne rickettsial diseases in the United States. Avoiding tick bites and promptly removing attached ticks remain the best disease prevention strategies."
    explanation: Establishes the absence of a vaccine and that bite avoidance is the primary prevention strategy.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Permethrin-impregnated clothing can reduce tick bites by >80% among outdoor workers"
    explanation: Quantifies the protective effect of permethrin-treated clothing.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several hours might elapse before ticks attach and transmit pathogens; therefore, timely tick checks increase the likelihood of finding and removing ticks before they can transmit an infectious agent."
    explanation: Supports the mechanistic rationale for prompt tick checks.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prophylactic use of doxycycline after a tick bite is not recommended for the prevention of tickborne rickettsial diseases."
    explanation: Supports the explicit recommendation against post-bite antibiotic prophylaxis.
- name: Pet acaricide use and peridomestic tick control
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    Because dogs are the primary host of Rhipicephalus sanguineus, the brown
    dog tick that drives the epidemic RMSF foci in Arizona tribal communities
    and northern Mexico, controlling ticks on dogs is a population-level
    intervention against the same inoculation step. Monthly topical acaricides,
    acaricidal tick collars, oral acaricidal products, and acaricidal shampoos
    reduce human exposure to ticks carried by pets. This is the intervention
    that maps onto the peridomestic transmission cycle recorded in this entry's
    environmental risk factors, and it addresses a route that individual
    repellent use does not.
  treatment_term:
    preferred_term: pet ectoparasite control
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regular use of pet ectoparasite control products (e.g., monthly topical acaricide products, acaricidal tick collars, oral acaricidal products, and acaricidal shampoos) can help reduce the risk for human exposure to ticks on pets."
    explanation: Supports acaricidal pet treatment as a measure that reduces human tick exposure.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "dogs serve as the primary host for Rh. sanguineus, which is known to transmit R. rickettsii both to humans and dogs in certain geographic areas"
    explanation: Establishes the dog-brown dog tick reservoir that makes pet acaricide use a human-disease intervention.
- name: Supportive and intensive care for severe disease
  description: >-
    Severe RMSF requires supportive management of the vasculitic complications -
    fluid and electrolyte correction for hyponatremia, transfusion support for
    coagulopathy, and intensive care for ARDS, shock, and renal failure -
    alongside, never instead of, doxycycline.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Multiorgan End-Organ Injury
    treatment_effect: MODULATES
    description: Organ support mitigates the consequences of established vasculopathy.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe, late-stage manifestations of RMSF include meningoencephalitis, acute renal failure, ARDS, cutaneous necrosis, shock, arrhythmia, and seizure."
    explanation: >-
      Establishes the complications that require organ support. Marked PARTIAL
      because the source enumerates the complications rather than evaluating
      supportive-care efficacy.
  - reference: PMID:17236897
    reference_title: "Clinical and laboratory features, hospital course, and outcome of Rocky Mountain spotted fever in children."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Coma and need for inotropic support and intravenous fluid boluses were independently associated with adverse outcomes."
    explanation: >-
      Documents the intensive-care interventions used in severe pediatric RMSF;
      PARTIAL because these markers of severity are not evidence of benefit.
histopathology:
- name: Lymphohistiocytic capillaritis and venulitis
  description: >-
    The main histopathologic feature of RMSF skin lesions is a lymphohistiocytic
    small-vessel capillaritis and venulitis with erythrocyte extravasation,
    edema, and a predominantly perivascular with some interstitial infiltrate.
    This is the tissue-level correlate of the disseminated small-vessel
    vasculitis node in the pathograph, and it is the earlier lesion in a
    sequence that progresses to leukocytoclastic vasculitis.
  finding_term:
    preferred_term: lymphohistiocytic capillaritis and venulitis
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  context: Skin biopsy and autopsy specimens; series of 26 RMSF cases.
  evidence:
  - reference: PMID:9449487
    reference_title: "Cutaneous histopathology of Rocky Mountain spotted fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main histopathologic feature was lymphohistiocytic capillaritis and venulitis with extravasation of erythrocytes, edema, predominantly perivascular and some interstitial infiltrate."
    explanation: Directly reports the dominant cutaneous histopathologic pattern in a 26-case series.
- name: Leukocytoclastic vasculitis with nuclear dust
  description: >-
    Leukocytoclastic vasculitis with a neutrophilic infiltrate and nuclear dust
    was present in 11 of 15 involved-skin specimens. It represents progression
    from the earlier lymphohistiocytic lesion, and the authors classify the
    vasculitis of RMSF as a septic vasculitis caused by direct rickettsial
    endothelial damage rather than an immune-complex process - a distinction
    that matters for the differential against idiopathic cutaneous vasculitis.
  finding_term:
    preferred_term: leukocytoclastic vasculitis
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  frequency: FREQUENT
  context: Involved skin specimens; 11 of 15 (73 percent).
  evidence:
  - reference: PMID:9449487
    reference_title: "Cutaneous histopathology of Rocky Mountain spotted fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Leukocytoclastic vasculitis (LCV) with neutrophilic infiltrate and nuclear dust was seen in 11 of 15 (73%) specimens from involved skin."
    explanation: >-
      Quantifies the finding at 73 percent of involved-skin specimens, which
      maps to the FREQUENT band.
  - reference: PMID:9449487
    reference_title: "Cutaneous histopathology of Rocky Mountain spotted fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The vasculitis in RMSF is, therefore, considered to be a form of septic vasculitis."
    explanation: Supports the septic rather than immune-complex classification of the vasculitis.
- name: Focal fibrin thrombi and capillary wall necrosis
  description: >-
    Six leukocytoclastic lesions showed focal fibrin thrombi and capillary wall
    necrosis - the histologic counterpart of the platelet consumption and
    microvascular occlusion recorded in the pathograph, and the lesion that
    becomes extensive in fulminant G6PD-associated disease.
  finding_term:
    preferred_term: fibrin thrombi with capillary wall necrosis
    term:
      id: NCIT:C48903
      label: Intravascular Fibrin Thrombus Formation
  frequency: FREQUENT
  context: >-
    Six of the leukocytoclastic vasculitis lesions in the series, against the
    11 of 15 involved-skin specimens that showed leukocytoclastic vasculitis.
  notes: >-
    The FREQUENT band holds under either denominator the source actually
    states - 6 of 11 leukocytoclastic lesions or 6 of 15 involved-skin
    specimens. It would fall to OCCASIONAL only against all 26 cases, a
    denominator the paper does not report for this finding.
  evidence:
  - reference: PMID:9449487
    reference_title: "Cutaneous histopathology of Rocky Mountain spotted fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six lesions with LCV displayed focal fibrin thrombi and capillary wall necrosis."
    explanation: >-
      Reports fibrin thrombi and capillary wall necrosis in six of the
      leukocytoclastic vasculitis lesions, the count behind the FREQUENT band.
- name: Rickettsial antigen in affected endothelial cells
  description: >-
    Immunohistologic staining with polyclonal rabbit anti-Rickettsia rickettsii
    demonstrated organisms in the affected endothelial cells in all 12 cases
    tested, confirming at tissue level the endothelial tropism that initiates
    the pathograph. This is the histopathologic basis of the skin-biopsy
    immunohistochemistry diagnostic entry.
  finding_term:
    preferred_term: rickettsial antigen in endothelium
    term:
      id: NCIT:C40998
      label: Immunophenotypic Finding
  diagnostic: true
  context: 12 cases tested by polyclonal anti-R. rickettsii immunohistology.
  evidence:
  - reference: PMID:9449487
    reference_title: "Cutaneous histopathology of Rocky Mountain spotted fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistologic (IH) staining using polyclonal rabbit anti-Rickettsia rickettsii demonstrated positive staining of the organisms in the affected endothelial cells in all 12 cases tested."
    explanation: Confirms endothelial localization of the organism in stained tissue.
animal_models:
- species: Dog
  description: >-
    Experimental intradermal R. rickettsii inoculation of dogs reproduces the
    vasculitic and coagulopathic core of human RMSF, with retinal vasculitic
    foci corresponding to fluorescein-demonstrated permeability defects,
    thrombocytopenia, and coagulation activation. The dog is also a natural host
    and a sentinel for human risk.
  evidence:
  - reference: PMID:2105679
    reference_title: "Vascular permeability and coagulation during Rickettsia rickettsii infection in dogs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The vascular permeability of the ocular fundus, alterations in the coagulation system, and plasma concentrations of thromboxane B2 (TXB2) and 6-keto-prostaglandin F1 alpha (6-keto-PGF1 alpha) were studied in dogs following intradermal inoculation with 5 x 10(5) TCID50 of Rickettsia rickettsii."
    explanation: The canine model was used to measure permeability and coagulation during R. rickettsii infection.
- species: Guinea pig
  description: >-
    Guinea pig challenge is the standard virulence readout for R. rickettsii
    mutants; it was used to show that an isogenic rOmpA knockout in the virulent
    Sheila Smith strain is not attenuated.
  evidence:
  - reference: PMID:25827414
    reference_title: "Targeted knockout of the Rickettsia rickettsii OmpA surface antigen does not diminish virulence in a mammalian model system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Virulence was assessed in a guinea pig model by challenge with 100 PFU of either ompA::int312 Sheila Smith or the wild type"
    explanation: Establishes the guinea pig as the virulence model used for R. rickettsii genetics.
- species: Mouse
  genotype: MHC class I knockout
  description: >-
    MHC class I knockout mice are dramatically more susceptible to lethal
    rickettsial infection than wild-type animals, defining the CD8 T lymphocyte
    requirement for clearance. This is an immunologic-mechanism model rather
    than a faithful clinical model of RMSF.
  evidence:
  - reference: PMID:11179362
    reference_title: "Critical role of cytotoxic T lymphocytes in immune clearance of rickettsial infection."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "immune clearance of rickettsial infection was more dependent on CD8 T lymphocytes, and there is evidence that CTL activity is a critical factor."
    explanation: Knockout mice establish the CD8 T lymphocyte requirement for rickettsial clearance.
discussions:
- discussion_id: rmsf_surrogate_species_permeability_mechanism
  prompt: >-
    Does the VE-cadherin phosphorylation mechanism of microvascular
    hyperpermeability, demonstrated with the non-pathogenic surrogate Rickettsia
    montanensis under BSL2 conditions, hold quantitatively for Rickettsia
    rickettsii in human microvasculature?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#VE-Cadherin Phosphorylation and Adherens Junction Disruption
  - pathophysiology#Increased Microvascular Permeability
  rationale: >-
    The junctional mechanism curated on this entry is the best available
    molecular account of RMSF microvascular leak, but the biophysical and
    biochemical experiments were deliberately performed with R. montanensis, a
    genetically similar but non-pathogenic species chosen so the work could be
    done at biosafety level 2. Virulent R. rickettsii strains differ from
    avirulent relatives in outer-membrane protein expression, so the magnitude
    and kinetics of junctional disruption - and any pathogen-specific effector
    contribution - are not established for the disease-causing organism. The
    complementary in vivo permeability evidence comes from experimentally
    infected dogs rather than humans.
  proposed_experiments:
  - experiment_id: exp_rmsf_ve_cadherin_bsl3
    name: VE-cadherin phosphorylation assays with virulent R. rickettsii
    description: >-
      Repeat the atomic force microscopy and VE-cadherin phosphorylation assays
      using virulent R. rickettsii in human microvascular endothelial cells
      under BSL3 containment, to test whether the surrogate result holds for the
      pathogenic organism.
  - experiment_id: exp_rmsf_virulent_vs_avirulent_junction
    name: Virulent versus avirulent strain comparison of junctional disruption
    description: >-
      Compare adherens-junction disruption between the virulent Sheila Smith and
      avirulent Iowa strains of R. rickettsii to test whether the magnitude of
      the effect tracks with virulence.
  - experiment_id: exp_rmsf_human_tissue_junction
    name: Junctional integrity in human RMSF tissue
    description: >-
      Assess VE-cadherin phosphorylation and adherens-junction integrity in
      autopsy or skin-biopsy tissue from human RMSF cases to establish whether
      the in vitro mechanism is present in human disease.
  evidence:
  - reference: PMID:22720111
    reference_title: "Rickettsiae induce microvascular hyperpermeability via phosphorylation of VE-cadherins: evidence from atomic force microscopy and biochemical studies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "R. montanensis, which is genetically similar to R. rickettsii and R. conorii, and displays a similar ability to invade cells, but is non-pathogenic and can be experimentally manipulated under Biosafety Level 2 (BSL2) conditions"
    explanation: >-
      The authors state explicitly that a non-pathogenic surrogate was used in
      place of R. rickettsii, which is the source of the translational
      uncertainty recorded here.
notes: >-
  Scope note: this entry models RMSF as caused by Rickettsia rickettsii and is
  deliberately distinct from the other spotted fever group rickettsioses already
  in the knowledge base. Boutonneuse fever (R. conorii) is the closest sibling
  entry and shares the endothelial-infection mechanism, but differs clinically in
  that an inoculation eschar is characteristic there and rare in RMSF.
  Frequency bands are taken from a pediatric multicenter series (PMID:17236897)
  and therefore reflect hospitalized children; adult frequencies may differ, and
  frequency was omitted wherever a quantitative or mappable qualitative source
  was not available. The United States incidence record is marked PARTIAL because
  the surveillance category is spotted fever group rickettsiosis rather than
  laboratory-confirmed RMSF alone. No GeneReviews chapter exists for RMSF, which
  is expected for an acquired infectious disease.

- name: Multiorgan End-Organ Injury
  biological_scale: ORGANISM
  description: >-
    Sustained vasculopathy and microvascular leak injure the brain, kidney,
    lung, and skin, producing meningoencephalitis, acute renal failure, ARDS,
    cutaneous necrosis, shock, arrhythmia, and seizure. Survivors of severe
    disease may be left with long-term neurologic sequelae that are most likely
    the result of R. rickettsii-induced vasculopathy.

- name: Fulminant Thrombotic Course in G6PD Deficiency
  biological_scale: ORGANISM
  description: >-
    A minority of patients follow a hyperacute course with death on or before
    day 5 of illness. In the described fulminant cases, thrombosis was more
    extensive than in classic RMSF with fibrin thrombi at foci of rickettsial
    infection, rash was absent or only preterminal, and there was minimal
    mononuclear leukocytic response - a thrombotic rather than classically
    vasculitic pathology. All described patients were G6PD-deficient, and the
    CDC recommendations list G6PD deficiency as a risk factor for fulminant
    RMSF.

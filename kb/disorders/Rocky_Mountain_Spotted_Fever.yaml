transmission:
- name: Dermacentor tick bite transmission
  description: >-
    In the United States R. rickettsii is transmitted most frequently by the
    American dog tick Dermacentor variabilis, and in the western states by the
    Rocky Mountain wood tick Dermacentor andersoni.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the tick species that is most frequently associated with transmission of R. rickettsii is the American dog tick, Dermacentor variabilis (Figure 2). This tick is found primarily in the eastern, central, and Pacific coastal United States"
    explanation: The CDC report names the principal United States vector.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Rocky Mountain wood tick, Dermacentor andersoni (Figure 4), is associated with transmission in the western United States"
    explanation: The CDC report names the western United States vector.
- name: Brown dog tick transmission in peridomestic epidemic foci
  description: >-
    Rhipicephalus sanguineus, the brown dog tick, is a recognized R. rickettsii
    vector in parts of Arizona and along the United States-Mexico border, where
    domestic dogs are the preferred host at all life stages and drive a
    peridomestic transmission cycle with unusually high incidence.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recognized as an important vector in parts of Arizona (16) and along the U.S.-Mexico border"
    explanation: The CDC report identifies the brown dog tick as an emergent vector in Arizona.
  - reference: PMID:28365226
    reference_title: "Rocky Mountain spotted fever in Mexico: past, present, and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rocky Mountain spotted fever, a tick-borne zoonosis caused by Rickettsia rickettsii, is among the most lethal of all infectious diseases in the Americas."
    explanation: The Lancet review frames RMSF as a tick-borne zoonosis of the Americas.
pathophysiology:
- name: Tick-Borne Rickettsia rickettsii Inoculation
  biological_scale: ORGANISM
  description: >-
    A feeding Dermacentor or Rhipicephalus tick inoculates R. rickettsii into
    the skin, initiating acute spotted fever rickettsiosis after an incubation
    period of 3-12 days. Unlike most other spotted fever group rickettsioses, an
    inoculation eschar is rarely present.
  biological_processes:
  - preferred_term: response to bacterium
    term:
      id: GO:0009617
      label: response to bacterium
    modifier: ABNORMAL
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms of RMSF typically appear 3-12 days after the bite of an infected tick"
    explanation: The CDC report establishes tick-bite inoculation and the incubation interval.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike some SFG rickettsioses, an inoculation eschar is rarely present with RMSF"
    explanation: >-
      Supports the negative feature that distinguishes RMSF from eschar-forming
      spotted fever rickettsioses such as boutonneuse fever.
  downstream:
  - target: Endothelial Cell Invasion and Intracytoplasmic Replication
    description: Inoculated rickettsiae disseminate and invade vascular endothelium.
    causal_link_type: DIRECT
  - target: Rickettsial Ribosomal Translation
    description: The replicating organism depends on bacterial ribosomal translation.
    causal_link_type: DIRECT
- name: Endothelial Cell Invasion and Intracytoplasmic Replication
  biological_scale: CELLULAR
  description: >-
    R. rickettsii is an obligate intracellular organism that primarily infects
    vascular endothelial cells, and less commonly the underlying smooth muscle
    cells of small and medium vessels. Adhesion and invasion are mediated by
    the conserved rOmpA and rOmpB surface autotransporters engaging host
    receptors (Ku70 identified for the closely related R. conorii); after entry
    the organism escapes into the cytoplasm and replicates. Individual adhesins
    are redundant - an isogenic rOmpA knockout in a virulent strain did not
    attenuate virulence in guinea pigs.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  - preferred_term: microvascular endothelial cell
    term:
      id: CL:2000008
      label: microvascular endothelial cell
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
    modifier: INCREASED
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "R. rickettsii is an obligate intracellular pathogen that primarily infects vascular endothelial cells, and, less commonly, underlying smooth muscle cells of small and medium vessels"
    explanation: The CDC report establishes the endothelial tropism that defines RMSF pathophysiology.
  - reference: PMID:16360032
    reference_title: "Ku70, a component of DNA-dependent protein kinase, is a mammalian receptor for Rickettsia conorii."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Ku70, a component of DNA-dependent protein kinase, is a mammalian receptor for Rickettsia conorii."
    explanation: >-
      Identifies a host receptor for rickettsial entry. Marked PARTIAL because
      the receptor was characterized for the closely related spotted fever group
      agent R. conorii rather than R. rickettsii directly.
  - reference: PMID:25827414
    reference_title: "Targeted knockout of the Rickettsia rickettsii OmpA surface antigen does not diminish virulence in a mammalian model system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "no significant difference in either fever peak (40.5 C) or duration (8 days) were shown between the wild type and the knockout"

- reference: PMID:27172113
  title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
  found_in:
  - Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md
  findings:
  - statement: >-
      The CDC national recommendations provide the authoritative account of RMSF
      pathophysiology, tick vectors, incubation and rash timing, laboratory

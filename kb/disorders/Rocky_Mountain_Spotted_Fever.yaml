definitions:
- name: Orphanet Rocky Mountain spotted fever definition
  definition_type: OTHER
  description: >-
    A rare, acquired, life-threatening infectious disease due to the tick-borne
    bacterium Rickettsia rickettsii, with acute fever, malaise, and severe
    headache, followed 2-5 days later by a maculopapular rash with petechiae
    beginning on the wrists and ankles.
  evidence:
  - reference: ORPHA:83311
    reference_title: "Rocky Mountain spotted fever"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A rare, acquired, life-threatening, infectious disease due to the tick-borne bacteria <i>Rickettsia rickettsii</i> characterized by an acute onset of fever, malaise, and severe headache"
    explanation: Orphanet defines RMSF as a life-threatening tick-borne R. rickettsii infection.
- name: CDC/MMWR clinical definition and pathophysiologic framing
  definition_type: OTHER
  description: >-
    The CDC national recommendations define RMSF as infection with the obligate
    intracellular pathogen R. rickettsii, which primarily infects vascular
    endothelial cells and produces a systemic vasculitis.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infection with R. rickettsii leads to systemic vasculitis that manifests externally as characteristic petechial skin lesions."
    explanation: The CDC recommendations define the disease by endothelial infection producing systemic vasculitis.

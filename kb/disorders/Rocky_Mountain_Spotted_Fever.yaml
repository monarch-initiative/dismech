- name: Cytotoxic T Lymphocyte Clearance of Infected Endothelium
  biological_scale: CELLULAR
  description: >-
    Recovery depends on cell-mediated immunity: interferon-gamma- and
    TNF-alpha-activated endothelial cells kill intracellular rickettsiae by
    nitric-oxide-dependent mechanisms, and CD8 T lymphocyte cytotoxicity
    eliminates the remaining infected cells. MHC class I knockout mice are
    dramatically more susceptible to lethal rickettsial infection than wild-type
    animals, establishing CTL activity as the critical effector arm.

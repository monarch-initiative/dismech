- name: Rickettsial Ribosomal Translation
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_scale: MOLECULAR
  description: >-
    R. rickettsii, like other bacteria, depends on 70S-ribosome translation of
    its mRNA. Doxycycline, a tetracycline, binds the 30S ribosomal subunit and
    blocks aminoacyl-tRNA delivery to the A site, arresting bacterial protein
    synthesis. This ribosomal target - not a cell-wall target - is why a
    tetracycline rather than a beta-lactam is the drug of choice.
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review establishing the bacterial ribosome as the target of tetracyclines
      and other protein-synthesis inhibitors, the step this node represents.
      Evidence source is OTHER as this is a review article.
- name: Obligate Intracellular Niche (Cell-Penetrant Drug Requirement)
  role: intrinsic_resistance
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  biological_scale: CELLULAR
  description: >-
    R. rickettsii is an obligate intracellular bacterium that replicates within
    host endothelial cells. Effective therapy therefore requires an antibiotic
    that accumulates inside host cells; doxycycline does, whereas beta-lactams
    cannot reach the intracellular organism - the lifestyle gating that further
    constrains drug choice beyond the ribosomal target.
  biological_processes:
  - preferred_term: Biological Process Involved in Interaction with Host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:18611821
    reference_title: "Intracellular organisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The intracellular location of some microorganisms allow them to resist
      antibiotics with poor ability to penetrate eukaryotic cell membranes, such
      as the beta-lactam compounds.
    explanation: >-
      Review stating that the intracellular niche confers resistance to poorly
      cell-penetrant antibiotics such as beta-lactams, the gating principle this
      node represents. Evidence source is OTHER as this is a review article.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "R. rickettsii is an obligate intracellular pathogen that primarily infects vascular endothelial cells, and, less commonly, underlying smooth muscle cells of small and medium vessels"
    explanation: Confirms the obligate intracellular lifestyle for this specific organism.

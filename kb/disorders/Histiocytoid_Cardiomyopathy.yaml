- name: Arrhythmogenic Substrate and Triggered Activity
  description: >-
    The lesional cells behave as autonomous arrhythmogenic foci. Clinically
    this produces incessant ventricular tachycardia and short-coupled premature
    ventricular complexes that initiate torsade de pointes, typically
    refractory to standard antiarrhythmic drugs. Catheter mapping localises
    discrete triggering foci with recordable pre-potentials, and successful
    ablation or surgical excision of the foci can abolish the arrhythmia,
    directly implicating the lesions as the substrate. The response of
    otherwise-refractory arrhythmia to high-dose carvedilol has been proposed
    to implicate ryanodine-receptor store-overload-induced calcium release, but
    this rests on a single case.

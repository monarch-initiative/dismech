  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: reported in a single molecularly characterised patient
  features: >-
    Heteroplasmic, maternally transmissible m.15498G>A (p.Gly251Asp) missense
    variant in the mitochondrially encoded cytochrome b subunit of complex III,
    in a patient with biochemically documented ubiquinol-cytochrome c
    oxidoreductase deficiency. This was the first molecular defect identified
    in histiocytoid cardiomyopathy and is the basis of the OMIM 500000
    mitochondrial-inheritance assignment. Its generality is disputed: screening
    27 further registry cases failed to confirm MT-CYB as a recurrent cause.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical studies showed markedly decreased succinate-cytochrome c reductase and rotenone-sensitive NADH-cytochrome c reductase activities, while other mitochondrial enzymes were normal."
    explanation: >-
      Quantifies the segmental respiratory-chain block in a histiocytoid
      cardiomyopathy heart.
  - reference: PMID:6093033
    reference_title: "Histiocytoid cardiomyopathy of infancy: deficiency of reducible cytochrome b in heart mitochondria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histiocytoid cardiomyopathy appears to be due to a defect of complex III (reduced coenzyme Q-cytochrome c reductase) in the respiratory chain of heart mitochondria."
    explanation: States the complex III localisation of the defect.
  - reference: PMID:18473377
    reference_title: "Histiocytoid cardiomyopathy: a mitochondrial disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since HICMP is frequently found in patients with mitochondrial deoxyribonucleic acid (DNA) mutations, HICMP cardiomyocytes carry an increased number of normal or abnormal mitochondria, and may show markedly decreased succinate-cytochrome c reductase or NADH-cytochrome c reductase activity; HICMP should be regarded as mitochondrial cardiomyopathy."
    explanation: >-
      Review-level statement tying the enzymology to the classification of HC as
      a mitochondrial cardiomyopathy.
  - reference: PMID:36675256
    reference_title: "A Novel Mutation Associated with Neonatal Lethal Cardiomyopathy Leads to an Alternative Transcript Expression in the X-Linked Complex I NDUFB11 Gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a neonatal patient with hypertrophic cardiomyopathy (HCM), lactic acidosis and isolated complex I deficiency."
    explanation: >-
      Demonstrates isolated complex I deficiency in an NDUFB11 neonate. Partial
      because this proband had hypertrophic, not pathology-proven histiocytoid,
      cardiomyopathy; it supports the NDUFB11 complex I arm of the mechanism
      rather than the histiocytoid morphology.
  downstream:
  - target: Oncocytic Transformation of Purkinje-like Cardiomyocytes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic energy failure is followed by compensatory mitochondrial
      proliferation, lipid microvacuolation, and loss of contractile apparatus
      in affected cells. The steps linking the bioenergetic defect to the
      focal, conduction-system-biased distribution of the transformed cells are
      not established.
    evidence:
    - reference: PMID:25921236
      reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Lipids in small vacuoles are commonly observed to fill the intracellular space, generating a foamy cytoplasm that has been considered to result from failure of energy generation."
      explanation: >-
        Explicitly attributes the foamy cytoplasm of the histiocytoid cell to
        failure of energy generation.
- name: Oncocytic Transformation of Purkinje-like Cardiomyocytes
  description: >-
    The cellular hallmark of the disease. Affected cells are enlarged,
    polygonal, and pale, with abundant faintly eosinophilic foamy granular
    cytoplasm, coarse granules and microvacuoles, few or no myofibrils, and
    poorly developed or absent intercellular junctions. Ultrastructurally they
    are filled with excessive and aberrantly shaped mitochondria plus scattered
    lipid droplets. They are not histiocytes: immunophenotype and distribution
    identify them as modified cardiomyocytes with Purkinje/conduction-cell
    features, which is why the WHO 5th edition renamed the lesion "conduction
    system hamartoma".
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: Purkinje myocyte
    term:
      id: CL:0002068
      label: Purkinje myocyte
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
    modifier: INCREASED
  locations:
  - preferred_term: cardiac Purkinje fiber
    term:
      id: UBERON:0002354
      label: cardiac Purkinje fiber
  evidence:
  - reference: PMID:10463272
    reference_title: "Histiocytoid cardiomyopathy: three new cases and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microscopic examination in all three cases revealed multiple, scattered clusters of histiocytoid myocytes which on ultrastructural examination were filled with abnormal mitochondria, scattered lipid droplets, and scanty myofibrils."
    explanation: Defines the ultrastructural signature of the transformed cell.
  - reference: PMID:7942464
    reference_title: "Infantile histiocytoid cardiomyopathy: three cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These cells were remarkably similar in all patients and had poorly developed or absent intercellular junctions, few or no contractile elements, and markedly increased numbers of mitochondria, which imparted a granular or vacuolated appearance to the cytoplasm."
    explanation: >-
      Establishes the loss of junctions and contractile elements alongside the
      mitochondrial excess across a 53-patient review.
  - reference: PMID:22758650
    reference_title: "Association of ventricular noncompaction and histiocytoid cardiomyopathy: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histiocytoid cardiomyopathy is a rare arrhythmogenic disorder characterized by aggregates of oncocytic cells involving predominantly the subendocardium. These cells are thought to be abnormal Purkinje cells."
    explanation: Identifies the transformed cells as abnormal Purkinje cells.
  - reference: PMID:39225698
    reference_title: "Conduction System Hamartoma: Autopsy Case Series."
    supports: SUPPORT

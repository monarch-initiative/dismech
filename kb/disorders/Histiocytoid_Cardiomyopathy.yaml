synonyms:
- infantile histiocytoid cardiomyopathy
- infantile xanthomatous cardiomyopathy
- oncocytic cardiomyopathy
- foamy myocardial transformation of infancy
- Purkinje cell hamartoma
- conduction system hamartoma
- arachnocytosis of the myocardium
- infantile cardiomyopathy with histiocytoid change
- focal lipid cardiomyopathy
- isolated cardiac lipidosis
notes: >-
  No GeneReviews chapter exists for histiocytoid cardiomyopathy - a PubMed
  search for "histiocytoid cardiomyopathy GeneReviews[All Fields]" returned zero
  results on 2026-08-01 - so the usual GeneReviews phenotype baseline is
  unavailable and this entry is anchored directly on primary case reports, the
  histiocytoid cardiomyopathy registry publications, and forensic/autopsy
  series. Scope decisions: (1) microphthalmia and linear skin defects are NOT
  curated as HC phenotypes even though NDUFB11 is allelic with MLS syndrome,
  because the index NDUFB11 histiocytoid case explicitly "lacked the diagnostic
  features of MLS syndrome" (PMID:28050600); the allelic relationship is
  recorded under `genetic` and `differential_diagnoses` instead. The scope line
  drawn is deliberately CARDIAC: phenotypes of the NDUFB11 complex I spectrum
  that are cardiac or that are direct biochemical readouts of the
  respiratory-chain lesion (hypertrophic cardiomyopathy, lactic acidosis) are
  curated but marked `supports: PARTIAL` with an explicit caveat, whereas
  extracardiac NDUFB11/MLS features that are not consequences of the cardiac
  lesion (microphthalmia, linear skin defects, sideroblastic anemia) are
  excluded entirely. (2) Frequency bands are asserted only where a source gives
  a count or an explicit qualitative statement about that specific phenotype;
  the literature is a ~100-case aggregate of published reports with heavy
  autopsy ascertainment bias, so only Ventricular Tachycardia carries a
  `frequency:`. In particular, no band is asserted for Sudden cardiac death
  (overall case fatality is not the same claim as the sudden-arrhythmic
  fraction) or for Cardiomegaly (a contemporary autopsy series found normal
  age- and sex-adjusted heart weights in all four cases, curated as REFUTE
  evidence on that phenotype). (3) Sudden death is curated both as a phenotype
  (HP:0001645 Sudden cardiac death, which is inside the Phenotypic abnormality
  subtree) and under `progression` as natural history. (4) Two NDUFB11 reports used here
  (PMID:36675256, PMID:39132302) describe neonatal hypertrophic cardiomyopathy
  with complex I deficiency rather than pathology-proven histiocytoid change;
  they are cited for the NDUFB11/complex I molecular mechanism and for the
  X-inactivation modifier, and their evidence items are marked PARTIAL and say
  so explicitly rather than implying histiocytoid morphology. (5) The
  Edison/falcon deep-research report used as a lead source asserted that no
  disease-specific OMIM identifier could be verified; that is incorrect (OMIM
  500000 is xrefed by MONDO:0010771) and the claim was not carried over. Two of
  its quantitative claims sourced to the 2015 WHO cardiac-tumour review
  (">1/3 with additional anomalies", "fewer than 150 reported cases") are not
  present in that paper's abstract (PMID:26725181) and were dropped rather than
  cited.

- name: Mechanical Circulatory Support (ECMO and Ventricular Assist Device)
  description: >-
    Extracorporeal membrane oxygenation and biventricular assist device support
    have been used as rescue and bridge-to-transplant strategies for
    cardiogenic shock from incessant ventricular arrhythmia. In the reported
    BiVAD case an atrial rather than apical left inflow cannula was needed
    because preserved systolic function, noncompaction, and frequent rhythm
    changes caused mechanical inflow obstruction.
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE

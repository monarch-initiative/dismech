      id: hgnc:20372
      label: NDUFB11
  evidence:
  - reference: PMID:10960495
    reference_title: "A missense mutation in the mitochondrial cytochrome b gene in a revisited case with histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation, a G to A transition at nucleotide 15498, results in the substitution of glycine with aspartic acid at amino acid position 251."
    explanation: Defines the MT-CYB (complex III) variant in the mitochondrial arm.
  - reference: PMID:28050600
    reference_title: "Histiocytoid cardiomyopathy and microphthalmia with linear skin defects syndrome: phenotypes linked by truncating variants in NDUFB11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in NDUFB11, which encodes a structural component of complex I of the mitochondrial respiratory chain (MRC), were recently independently reported to cause histiocytoid cardiomyopathy (histiocytoid CM) and microphthalmia with linear skin defects syndrome (MLS syndrome)."
    explanation: >-
      Establishes NDUFB11, a complex I structural component, as a histiocytoid
      cardiomyopathy gene.
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A third proband was doubly heterozygous for inherited rare variants in additional components of complex I, NDUFAF2 and NDUFB9, confirming that Histiocytoid CM is genetically heterogeneous."
    explanation: Documents the genetic heterogeneity of the subunit-defect node.
  - reference: PMID:36675256
    reference_title: "A Novel Mutation Associated with Neonatal Lethal Cardiomyopathy Leads to an Alternative Transcript Expression in the X-Linked Complex I NDUFB11 Gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "transcript is required for the proper NDUFB11 protein synthesis, which is essential for optimal CI assembly and activity"
    explanation: >-
      Patient-tissue functional work showing that loss of the canonical NDUFB11
      transcript removes the protein and thereby impairs complex I assembly and
      activity - the molecular step this node asserts. Partial because the
      proband studied had hypertrophic rather than pathology-proven
      histiocytoid cardiomyopathy, so this evidences the NDUFB11 mechanism, not
      the histiocytoid morphology.
  downstream:
  - target: Oxidative Phosphorylation Failure in Cardiomyocytes
    causal_link_type: DIRECT
    description: >-
      Loss of a complex I or complex III subunit directly reduces electron
      transfer through the respiratory chain in cardiac mitochondria.
    evidence:
    - reference: PMID:6093033
      reference_title: "Histiocytoid cardiomyopathy of infancy: deficiency of reducible cytochrome b in heart mitochondria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In isolated mitochondria, cytochrome spectra showed a severe defect of reducible cytochrome b and a less marked defect of cytochrome cc1, while the content of cytochrome aa3 (cytochrome c oxidase) was normal."
      explanation: >-
        Directly demonstrates the cytochrome b defect in heart mitochondria of a
        histiocytoid cardiomyopathy patient.
- name: Oxidative Phosphorylation Failure in Cardiomyocytes
  description: >-
    Respiratory-chain enzymology in histiocytoid cardiomyopathy hearts shows
    markedly decreased succinate-cytochrome c reductase and rotenone-sensitive
    NADH-cytochrome c reductase activity, i.e. a segmental block of electron
    transport at complex III (and, in the NDUFB11 arm, at complex I) with
    preserved cytochrome c oxidase. The resulting failure of oxidative ATP
    synthesis in a high-demand tissue is the energetic lesion that the
    downstream cellular phenotype is built on.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell

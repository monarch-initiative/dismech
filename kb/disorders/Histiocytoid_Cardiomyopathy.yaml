- name: NDUFB11
  gene_term:
    preferred_term: NDUFB11
    term:
      id: hgnc:20372
      label: NDUFB11
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  presence: recurrent; the best-supported histiocytoid cardiomyopathy gene
  features: >-
    De novo nonsense variants in exon 2 of the X-linked complex I accessory
    subunit NDUFB11 (Xp11.23) have been identified in multiple unrelated
    probands with histiocytoid cardiomyopathy, including the recurrent
    c.262C>T p.Arg88* allele. NDUFB11 is allelic with microphthalmia with
    linear skin defects (MLS) syndrome: the identical p.Arg88* change has been
    reported in MLS, and the two disorders are therefore genetically related
    even though an individual histiocytoid case may lack any MLS feature.
    Splice-disrupting and missense NDUFB11 alleles cause a broader neonatal
    complex I cardiomyopathy spectrum in which severity in females tracks with
    skewed X-inactivation.
  evidence:
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: SUPPORT

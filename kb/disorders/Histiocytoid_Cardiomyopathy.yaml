name: Histiocytoid Cardiomyopathy
creation_date: "2026-08-01T13:20:00Z"
category: Mendelian
description: >-
  Histiocytoid cardiomyopathy (HC; OMIM 500000) is an ultra-rare, strongly
  female-predominant arrhythmogenic cardiomyopathy of infancy and early
  childhood. Its defining lesion is multifocal aggregation of enlarged,
  polygonal, pale "histiocyte-like" (oncocytic) cells that are not histiocytes
  at all but modified Purkinje-like cardiomyocytes: they are packed with
  abnormal mitochondria, contain lipid microvacuoles giving a foamy granular
  cytoplasm, have few or no myofibrils, and lack normal intercellular
  junctions. The aggregates sit preferentially in the subendocardium and in the
  vicinity of the Purkinje/conduction system, and may form grossly visible
  yellow-tan nodules on endocardium, epicardium, or valves. Clinically the
  disease presents in the first two years of life with incessant ventricular
  tachycardia, cardiomegaly, refractory arrhythmia, and sudden death; some
  children instead present with dilated cardiomyopathy or ventricular
  noncompaction morphology (a hypertrophic presentation is documented in the
  allelic NDUFB11 complex I spectrum rather than in pathology-proven
  histiocytoid disease). HC is genetically heterogeneous and, in most
  historical cases, molecularly unsolved. Two mitochondrial respiratory-chain
  arms are established: a mitochondrial-DNA arm (the OMIM 500000 mitochondrial
  inheritance entry, anchored on a heteroplasmic MT-CYB missense variant with
  documented complex III deficiency) and a nuclear X-linked arm (de novo
  truncating variants in NDUFB11, a complex I accessory subunit, which is
  allelic with microphthalmia with linear skin defects syndrome). Rarer
  candidate complex I alleles (NDUFAF2, NDUFB9) have been reported. The 5th
  edition WHO classification of cardiac tumours now names the lesion
  "conduction system hamartoma".
disease_term:
  preferred_term: histiocytoid cardiomyopathy
  term:
    id: MONDO:0010771
    label: histiocytoid cardiomyopathy
parents:

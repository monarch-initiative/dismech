progression:
- phase: Prenatal to neonatal onset
  age_range: fetal life to first weeks
  notes: >-
    Arrhythmia may begin before birth. One autopsy-confirmed patient had
    ventricular tachycardia from the prenatal period, and severe NDUFB11
    complex I disease can present within hours of birth with lactic acidosis
    and heart failure.
  evidence:
  - reference: PMID:8563940
    reference_title: "Histiocytoid cardiomyopathy with hypotonia in an infant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 15 month old female, who had suffered from ventricular tachycardia from the prenatal period, experienced cardiac arrest at home."
    explanation: Documents prenatal onset of the arrhythmia.
- phase: Infantile arrhythmic phase
  age_range: first two years of life
  notes: >-
    The great majority of recognised patients present in the first two years
    with incessant ventricular tachycardia, cardiomegaly, or sudden death. A
    contemporary autopsy series of conduction system hamartoma had a mean age
    of 5.8 months.
  evidence:
  - reference: PMID:21585276
    reference_title: "Identification of candidate genes for histiocytoid cardiomyopathy (HC) using whole genome expression analysis: analyzing material from the HC registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It primarily occurs in the first two years of life and has a female to male ratio of 3:1."
    explanation: Defines the age window of presentation.
  - reference: PMID:39225698
    reference_title: "Conduction System Hamartoma: Autopsy Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age of the cases was 5.8 months."
    explanation: Gives the mean age at death in a contemporary autopsy series.
- phase: Fatal outcome without early treatment
  age_range: usually before 2 years
  notes: >-
    Untreated disease is fatal in the vast majority, typically by age two,
    either as sudden arrhythmic death or as progressive heart failure.
    Diagnosis is very often made only at autopsy, and requires adequate
    myocardial sampling.
  evidence:
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infantile histiocytoid cardiomyopathy (Histiocytoid CM, MIM 500000) is a rare, but distinctive arrhythmogenic disorder characterized by incessant ventricular tachycardia, cardiomegaly, and sudden death within the first two years of life if left untreated."
    explanation: States the untreated natural history and its time course.
- phase: Survival after early intervention
  age_range: beyond 2 years
  notes: >-
    Children diagnosed early and treated by surgical excision or ablation of
    the arrhythmogenic foci, or by cardiac transplantation for extensive
    disease, can survive beyond the usual fatal window.
  evidence:
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "over 20 cases collected from children who were diagnosed early and treated either with surgical excision or ablation of the arrhythmogenic foci. In cases where there is extensive involvement of Histiocytoid CM a cardiac transplant was performed."
    explanation: >-
      Documents the treated cohort in the registry and the interventions that
      permitted survival.
diagnosis:
- name: Autopsy or Endomyocardial Tissue Examination
  description: >-
    Histopathology remains the definitive diagnostic test. Because the lesions
    are focal and subendocardial, the diagnosis is missed unless the heart is
    adequately sampled; this is the main reason cases are miscertified as
    sudden infant death syndrome, sudden unexplained death in childhood, or
    inflicted injury.
  diagnosis_term:
    preferred_term: endomyocardial biopsy
    term:
      id: NCIT:C51674
      label: Endomyocardial Biopsy
  evidence:
  - reference: PMID:37831311
    reference_title: "Histiocytoid cardiomyopathy presenting as sudden death in an 18-month-old infant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meticulous gross and histological examination of the heart in collaboration with a cardiovascular-trained pathologist maximises the opportunity to make specific diagnoses (and therefore rule out the differentials of SIDS, SUDC and child abuse), guide genetic testing, and inform potentially life-saving medical interventions for blood relations."
    explanation: >-
      States the requirement for meticulous cardiac histology and its
      implications for family members.
  - reference: PMID:39225698
    reference_title: "Conduction System Hamartoma: Autopsy Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autopsy findings should be evaluated by taking extra samples from the heart if necessary, especially in suspected cases below 2 years of age."
    explanation: Operational guidance on adequate myocardial sampling at autopsy.
- name: Rhythm Monitoring and Electrophysiological Mapping
  description: >-
    Twelve-lead ECG and continuous rhythm monitoring establish the arrhythmia
    phenotype; invasive electrophysiological mapping localises the triggering
    foci, at which pre-potentials can be recorded, and guides ablation.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:31449642
    reference_title: "Successful catheter ablation of premature ventricular contractions triggering torsade de pointes in a small infant with histiocytoid cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pre-potentials were recorded at the earliest ventricular activation sites of the targeted PVCs."
    explanation: >-
      Demonstrates the electrophysiological signature used to localise the
      arrhythmogenic foci.
- name: Echocardiography
  description: >-
    Transthoracic echocardiography characterises the cardiomyopathy morphology
    that accompanies the arrhythmia - ventricular noncompaction, chamber
    dilation or hypertrophy, and systolic function. It does not visualise the
    histiocytoid lesions themselves, so a structurally near-normal echo with
    preserved ejection fraction does not exclude the diagnosis.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:31449642
    reference_title: "Successful catheter ablation of premature ventricular contractions triggering torsade de pointes in a small infant with histiocytoid cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Echocardiography revealed a left ventricular non-compaction with a left ventricular ejection fraction (LVEF) of 59% and no other abnormalities."
    explanation: >-
      Shows both what echocardiography contributes (detection of noncompaction)
      and its limitation in this disease: ejection fraction was preserved and no
      other abnormality was seen despite histologically extensive biventricular
      histiocytoid disease at autopsy.
- name: Genomic Testing Including NDUFB11 and mtDNA
  description: >-
    Trio exome or rapid whole-genome sequencing with mitochondrial-genome
    analysis is the preferred genetic approach. Targeted cardiomyopathy panels
    are insufficient: a pathogenic NDUFB11 variant has been reported that
    commercial cardiomyopathy panels did not cover.
  diagnosis_term:
    preferred_term: whole genome sequencing
    term:
      id: NCIT:C101294
      label: Whole Genome Sequencing
  evidence:
  - reference: PMID:39132302
    reference_title: "Case report: severe hypertrophic cardiomyopathy in a female neonate caused by de novo variant in NDUFB11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This variant was not identifiable by commercial cardiomyopathy panels."
    explanation: >-
      Direct evidence that panel-based testing can miss the causal variant,
      justifying WGS/WES.
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have performed whole exome sequencing on five parent-proband trios and identified nuclear-encoded mitochondrial protein mutations in three cases."
    explanation: Establishes trio exome sequencing as the diagnostic yield-bearing approach.
differential_diagnoses:
- name: Sudden infant death syndrome
  description: >-
    The most consequential differential. Histiocytoid cardiomyopathy causes
    unheralded infant death and is only distinguishable by adequate myocardial
    sampling at autopsy, so an unknown fraction of cases is certified as SIDS.
  evidence:
  - reference: PMID:21585276
    reference_title: "Identification of candidate genes for histiocytoid cardiomyopathy (HC) using whole genome expression analysis: analyzing material from the HC registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the prevalence of this disease may be higher than the reported cases would suggest, as some cases are mistaken for Sudden Infant Death Syndrome (SIDS)"
    explanation: States the SIDS misclassification directly.
- name: Microphthalmia with linear skin defects (MLS) syndrome
  description: >-
    Allelic at NDUFB11, with the identical p.Arg88* variant reported in both.
    MLS is distinguished by microphthalmia and linear skin defects; a
    histiocytoid cardiomyopathy proband carrying the same variant lacked those
    diagnostic features, although detailed comparison showed phenotypic
    overlap.
  evidence:
  - reference: PMID:28050600
    reference_title: "Histiocytoid cardiomyopathy and microphthalmia with linear skin defects syndrome: phenotypes linked by truncating variants in NDUFB11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The case we describe here lacked the diagnostic features of MLS syndrome, but a detailed clinical comparison of the two cases revealed significant phenotypic overlap."
    explanation: >-
      Establishes both the distinction and the overlap between the two allelic
      phenotypes.
- name: Cardiac rhabdomyoma
  description: >-
    Histiocytoid cardiomyopathy was originally confused with rhabdomyoma, a
    benign myocardial tumour, and was not recognised as a separate entity until
    1962.
  evidence:
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease was first confused with rhabdomyoma, benign tumors of the myocardium, and was not recognized as a separate pathologic entity until 1962 by Voth"
    explanation: Documents the historical confusion with rhabdomyoma.
treatments:
- name: High-Dose Carvedilol
  description: >-
    In a 4-month-old girl with histiocytoid cardiomyopathy whose ventricular
    arrhythmias were refractory to bisoprolol, landiolol, verapamil, and
    cardiac sympathetic denervation, high-dose carvedilol achieved control.
    Carvedilol is distinctive among beta blockers in acting directly on the
    ryanodine receptor to inhibit store-overload-induced calcium release, which
    is the proposed basis of the response. This rests on a single case and
    should not be generalised.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carvedilol
      term:
        id: CHEBI:3441
        label: carvedilol
  target_mechanisms:
  - target: Arrhythmogenic Substrate and Triggered Activity
    treatment_effect: INHIBITS
    description: >-
      Proposed to suppress ryanodine-receptor store-overload-induced calcium
      release in the abnormal myocardium, reducing triggered activity.
  evidence:
  - reference: PMID:38089118
    reference_title: "Case report: high-dose carvedilol as a potential key drug for arrhythmias in histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of infantile histiocytoid cardiomyopathy whose refractory ventricular arrhythmias were successfully controlled by high-dose carvedilol."
    explanation: Single-case report of arrhythmia control with high-dose carvedilol.
  - reference: PMID:38089118
    reference_title: "Case report: high-dose carvedilol as a potential key drug for arrhythmias in histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Carvedilol is the only beta blocker that directly acts on the ryanodine receptor (RyR2) and inhibits store-overload-induced Ca2+ release (SOICR) in myocardium at high dosage."
    explanation: States the proposed molecular rationale for the drug choice.
  - reference: PMID:38089118
    reference_title: "Case report: high-dose carvedilol as a potential key drug for arrhythmias in histiocytoid cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no specific treatment for these arrhythmias."
    explanation: >-
      Establishes that no disease-specific antiarrhythmic therapy is
      established, framing carvedilol as investigational.
- name: Catheter Ablation of Arrhythmogenic Foci
  description: >-
    Radiofrequency catheter ablation of mapped premature-ventricular-complex or
    ventricular-tachycardia foci can abolish otherwise refractory arrhythmia,
    and has been performed successfully in an infant weighing 3.4 kg. Durability
    is limited by the multifocal nature of the disease: in the reported case the
    arrhythmia was abolished but the child died of heart failure at 6 months.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac ablation
    term:
      id: NCIT:C100068
      label: Cardiac Ablation
  target_mechanisms:
  - target: Arrhythmogenic Substrate and Triggered Activity
    treatment_effect: INHIBITS
    description: >-
      Destroys the mapped triggering focus, removing the arrhythmogenic
      substrate at that site.
  evidence:
  - reference: PMID:31449642
    reference_title: "Successful catheter ablation of premature ventricular contractions triggering torsade de pointes in a small infant with histiocytoid cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two types of PVCs triggering TdP were successfully ablated, which originated from the right ventricle (RV). Pre-potentials were recorded at the earliest ventricular activation sites of the targeted PVCs."
    explanation: Documents successful ablation of mapped trigger foci.
  - reference: PMID:31449642
    reference_title: "Successful catheter ablation of premature ventricular contractions triggering torsade de pointes in a small infant with histiocytoid cardiomyopathy: a case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "After the ablation, she had no TdP episodes and the cardiac assist device was removed. However, she died of uncontrolled heart failure at 6 months of age."
    explanation: >-
      Shows that arrhythmia control does not necessarily prevent death from
      heart failure.
- name: Surgical Excision of Histiocytoid Nodules
  description: >-
    Where a discrete arrhythmogenic nodule can be localised, surgical excision
    can produce clinical remission. Together with ablation this is the main
    lesion-directed strategy documented in the histiocytoid cardiomyopathy
    registry cohort of early-diagnosed, treated survivors.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Hamartomatous Nodule Formation in the Conduction System
    treatment_effect: INHIBITS
    description: >-
      Physically removes the hamartomatous nodule that constitutes the

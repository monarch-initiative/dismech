    snippet: "Two probands had de novo non-sense mutations in the second exon of the X-linked nuclear gene NDUFB11."
    explanation: Original identification of de novo NDUFB11 nonsense variants in HC probands.
  - reference: PMID:28050600
    reference_title: "Histiocytoid cardiomyopathy and microphthalmia with linear skin defects syndrome: phenotypes linked by truncating variants in NDUFB11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report an additional case of histiocytoid CM, which carries a de novo nonsense variant in NDUFB11"
    explanation: >-
      Independent replication of a de novo NDUFB11 nonsense variant in a further
      histiocytoid cardiomyopathy proband.
  - reference: PMID:28050600
    reference_title: "Histiocytoid cardiomyopathy and microphthalmia with linear skin defects syndrome: phenotypes linked by truncating variants in NDUFB11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

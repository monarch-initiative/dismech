mechanistic_hypotheses:
- hypothesis_group_id: mitochondrial_respiratory_chain_model
  hypothesis_label: Mitochondrial respiratory-chain cardiomyopathy
  status: CANONICAL
  description: >-
    Histiocytoid cardiomyopathy is fundamentally a mitochondrial
    cardiomyopathy: a respiratory-chain subunit defect (MT-CYB/complex III or
    NDUFB11/complex I) causes bioenergetic failure and compensatory
    mitochondrial proliferation in cardiomyocytes, with the histiocytoid
    morphology as the cellular readout. This is the dominant contemporary
    model and is supported by direct enzymology in patient heart mitochondria
    and by molecular genetics.
  evidence:
  - reference: PMID:18473377
    reference_title: "Histiocytoid cardiomyopathy: a mitochondrial disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HICMP should be regarded as mitochondrial cardiomyopathy."
    explanation: Explicit review-level endorsement of the mitochondrial model.
- hypothesis_group_id: purkinje_hamartoma_model
  hypothesis_label: Purkinje-cell/oncocyte hamartoma rather than diffuse mitochondrial cardiomyopathy
  status: ALTERNATIVE
  description: >-
    The competing pathology-derived model holds that the lesion is a
    hamartoma-like focal aggregation of oncocyte-like cardiac myocytes and
    explicitly rejects a diffuse mitochondrial cardiomyopathy, a multifocal
    Purkinje-cell tumour, and a developmental arrest, proposing instead a
    prenatal myocardial or systemic (possibly viral) injury. The WHO 5th
    edition adoption of the name "conduction system hamartoma" keeps this
    framing alive. The two models are not fully reconciled: the focal,
    conduction-system-restricted distribution of the lesions is the main
    observation the purely mitochondrial model does not yet explain.
  evidence:
  - reference: PMID:7942464
    reference_title: "Infantile histiocytoid cardiomyopathy: three cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence is presented to exclude the possibilities that the disorder represents a developmental anomaly of the atrioventricular conduction system, a multifocal tumor of Purkinje cells, a developmental arrest of cardiac myocytes, and a diffuse type of mitochondrial cardiomyopathy."
    explanation: >-
      States the alternative model's explicit exclusion of a diffuse
      mitochondrial cardiomyopathy.
  - reference: PMID:7942464
    reference_title: "Infantile histiocytoid cardiomyopathy: three cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This syndrome is likely caused by prenatal myocardial or systemic (viral?) injury."
    explanation: States the alternative model's proposed prenatal-injury aetiology.
- hypothesis_group_id: il33_s100a_axis_model
  hypothesis_label: Downregulated IL-33/IL1RL1-p38-MAPK/S100A axis
  status: EMERGING
  description: >-
    Whole-genome expression profiling of registry hearts identified coordinate
    downregulation of two chromosomally clustered gene sets (S100A8/S100A9/
    S100A12 at 1q21.3 and IL1RL1/IL18R1/IL18RAP at 2q12.1) together with
    reduced interleukin 33, with confirmed copy-number loss of the S100A
    cluster. This suggests an inflammatory-signalling axis contributing to
    susceptibility. It has not been replicated, no causal variant has been
    demonstrated in these loci, and the finding could be a consequence rather
    than a cause of the myocardial lesion.
  evidence:
  - reference: PMID:21585276
    reference_title: "Identification of candidate genes for histiocytoid cardiomyopathy (HC) using whole genome expression analysis: analyzing material from the HC registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data suggest a model in which the interleukin 33-IL1RL1/p38-MAPK/ S100A8-S100A9 axis is downregulated in HC cardiac tissue and provide several candidate genes on 1q21.3c and 2q12.1a for inherited mutations that may predispose individuals to HC."
    explanation: Statement of the emerging expression-based model and its candidate loci.

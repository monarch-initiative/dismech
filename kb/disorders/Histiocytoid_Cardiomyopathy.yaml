animal_models:
- species: Danio rerio
  genotype: ndufb11 morpholino knockdown
  category: Morpholino knockdown
  description: >-
    Morpholino-mediated knockdown of ndufb11 in zebrafish embryos produced
    defective cardiac tissue with cardiomegaly, looping defects, and
    arrhythmia. This is the only reported experimental model addressing the
    NDUFB11 arm of the disease. It reproduces cardiomegaly and arrhythmia but
    has not been shown to reproduce the defining histiocytoid/oncocytic cell
    morphology.
  associated_phenotypes:
  - Cardiomegaly
  - Cardiac looping defect
  - Arrhythmia
  evidence:
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "morpholino-mediated knockdown of ndufb11 in zebrafish embryos generated defective cardiac tissue with cardiomegaly, looping defects, and arrhythmia which suggests the role of NDUFB11 in the pathogenesis of this abnormal cardiac pathology"
    explanation: Describes the zebrafish knockdown phenotype and its interpretation.
- species: Felis catus
  genotype: naturally occurring, genotype unknown
  category: Naturally occurring veterinary case
  description: >-
    A 2-month-old female Savannah kitten died suddenly with cardiac lesions
    described as identical to human histiocytoid cardiomyopathy - large,
    angular, tightly packed Purkinje fibres with few disorganised myofibrils in
    a rarified cytoplasm - together with biventricular noncompaction. This is a
    spontaneous comparative-pathology observation, not an engineered model, and
    no causal genotype was established.
  associated_phenotypes:
  - Abnormal Purkinje fibers
  - Ventricular noncompaction
  - Sudden death
  evidence:
  - reference: PMID:19276060
    reference_title: "Purkinje fiber dysplasia (histiocytoid cardiomyopathy) with ventricular noncompaction in a savannah kitten."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings are identical to those that occur in children with histiocytoid cardiomyopathy, a fatal genetic mitochondrial disorder of Purkinje fibers."
    explanation: >-
      States the equivalence of the feline lesion to the human disease. Tagged
      MODEL_ORGANISM per the dismech rule that veterinary observations in
      non-human mammals are model-organism evidence.
  - reference: PMID:19276060
    reference_title: "Purkinje fiber dysplasia (histiocytoid cardiomyopathy) with ventricular noncompaction in a savannah kitten."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The Purkinje fibers were large, angular, and tightly packed. They contained few disorganized myofibrils among a rarified cytoplasm."
    explanation: Describes the feline Purkinje-fibre lesion in detail.
discussions:
- discussion_id: hc_causal_gene_unsolved
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What explains the majority of histiocytoid cardiomyopathy cases that carry
    no variant in NDUFB11, MT-CYB, or another complex I gene?
  attaches_to:
  - pathophysiology#Mitochondrial Respiratory Chain Subunit Defect
  rationale: >-
    Trio exome sequencing of five registry probands identified a plausible
    nuclear mitochondrial-protein variant in only three, and no strong recessive
    or compound-heterozygous candidate in two. MT-CYB, the first reported locus,
    was not confirmed in 27 further registry cases. The disease therefore
    remains molecularly unexplained in a large fraction of patients, which
    blocks both prenatal/cascade testing and any mechanism-directed therapy.
  proposed_experiments:
  - experiment_id: exp_hc_registry_wgs_and_lesional_omics
    name: Registry whole-genome sequencing plus lesional-myocardium multi-omics
    description: >-
      Re-analyse the histiocytoid cardiomyopathy registry trios by whole-genome
      rather than exome sequencing, with structural-variant calling and deep
      mitochondrial-heteroplasmy detection, and pair this with RNA sequencing,
      respiratory-chain enzymology, and blue-native supercomplex analysis on
      banked lesional myocardium. Add single-nucleus transcriptomics of
      histiocytoid versus adjacent normal myocardium from the same hearts to
      test whether the lesional cells occupy a distinct somatic or epigenetic
      state.
    experiment_type:
      preferred_term: observational molecular profiling study
  evidence:
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strong candidate recessive or compound heterozygous variants were not found for this individual or for the fifth case."
    explanation: Documents the unsolved fraction even in a systematic trio exome study.
- discussion_id: hc_focal_distribution_unexplained
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why does a germline respiratory-chain defect produce focal, hamartoma-like
    nests of oncocytic Purkinje-like cells rather than uniform cardiomyocyte
    dysfunction?
  attaches_to:
  - pathophysiology#Hamartomatous Nodule Formation in the Conduction System
  rationale: >-
    This is the central unresolved tension between the canonical mitochondrial
    model and the alternative Purkinje-hamartoma model. A germline mtDNA or
    X-linked nuclear variant is present in every cardiomyocyte, yet the lesions
    are discrete and conduction-system-biased. Candidate explanations include
    mitochondrial heteroplasmy segregation, X-inactivation mosaicism in the
    NDUFB11 arm, a cell-intrinsic vulnerability of Purkinje-lineage myocytes
    with high oxidative demand, or a superimposed somatic/developmental event.
    None has been tested.
  proposed_experiments:
  - experiment_id: exp_hc_lesional_vs_normal_single_cell_mosaicism
    name: Lesional versus adjacent-normal myocyte mosaicism assay
    description: >-
      Within single histiocytoid cardiomyopathy hearts, compare lesional
      histiocytoid cells with adjacent morphologically normal myocardium for
      mitochondrial heteroplasmy level and X-inactivation ratio, and use
      laser-capture microdissection with targeted deep sequencing to search for
      a lesion-restricted second somatic hit. Complement this with a
      lineage-resolved comparison of Purkinje versus working cardiomyocyte
      respiratory capacity and vulnerability to complex I/III inhibition.
    experiment_type:
      preferred_term: comparative single-cell molecular pathology study
  evidence:
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike other mitochondrial diseases, however, Histiocytoid CM does not affect all cardiomyocytes equally."
    explanation: States the observation that the open question is about.
- discussion_id: hc_zebrafish_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the zebrafish ndufb11 morpholino knockdown actually model histiocytoid
    cardiomyopathy, given that it reproduces cardiomegaly and arrhythmia but has
    not been shown to produce the defining histiocytoid/oncocytic Purkinje-like
    cell?
  attaches_to:
  - pathophysiology#Oncocytic Transformation of Purkinje-like Cardiomyocytes
  rationale: >-
    The zebrafish result is the only experimental support that NDUFB11 loss can
    cause cardiac disease, and it is cited as such. But the reported readouts
    are cardiomegaly, looping defects, and arrhythmia - non-specific outputs
    obtainable from many cardiac perturbations - not the oncocytic
    transformation that defines the human entity. Morpholino knockdown also
    differs mechanistically from a de novo human nonsense allele acting in a
    mosaic X-inactivation context, and the zebrafish conduction system is not
    homologous in detail to the mammalian His-Purkinje system. Treating the
    model as validating the human cellular mechanism would overstate it.
  proposed_experiments:
  - experiment_id: exp_ndufb11_model_ladder_for_oncocytic_transformation
    name: Cross-model test for oncocytic Purkinje-like transformation on NDUFB11 loss
    description: >-
      Examine ndufb11-deficient zebrafish - ideally a stable genetic mutant
      rather than a morphant - histologically and ultrastructurally for
      oncocytic myocyte transformation rather than gross cardiac phenotypes
      alone. In parallel, generate a conditional cardiomyocyte- or
      conduction-cell-specific Ndufb11 mouse and assess it for histiocytoid
      lesions and arrhythmia, and assay NDUFB11-null human iPSC-derived
      cardiomyocytes and conduction-like cells for mitochondrial accumulation,
      myofibrillar loss, and triggered activity.
    experiment_type:
      preferred_term: cross-species model validation study
  evidence:
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "morpholino-mediated knockdown of ndufb11 in zebrafish embryos generated defective cardiac tissue with cardiomegaly, looping defects, and arrhythmia"
    explanation: >-
      The reported model phenotypes are non-specific cardiac abnormalities; the
      defining histiocytoid morphology is not among them.

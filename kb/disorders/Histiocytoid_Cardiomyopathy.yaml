inheritance:
- name: Mitochondrial inheritance
  description: >-
    OMIM 500000 assigns histiocytoid cardiomyopathy to mitochondrial
    (maternal) inheritance on the basis of the heteroplasmic MT-CYB
    m.15498G>A variant reported by Andreu et al. A separate proband in the
    histiocytoid cardiomyopathy registry exome study inherited a mitochondrial
    mutation from a heteroplasmic mother, as did an affected brother.
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  evidence:
  - reference: PMID:10960495
    reference_title: "A missense mutation in the mitochondrial cytochrome b gene in a revisited case with histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a pathogenic mutation in the mitochondrial cytochrome b gene in a patient with a multisystem disorder presenting as histiocytoid cardiomyopathy in whom a defect of ubiquinol cytochrome c oxidoreductase of the electron transport chain had been documented biochemically."
    explanation: >-
      Documents the mitochondrial-DNA (MT-CYB) lesion that underlies the
      mitochondrial-inheritance assignment of OMIM 500000.
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a fourth case, the proband with Histiocytoid CM inherited a mitochondrial mutation from her heteroplasmic mother, as did her brother who presented with cardiac arrhythmia."
    explanation: >-
      Maternal transmission of a heteroplasmic mtDNA variant to two affected
      siblings is the signature of mitochondrial inheritance.
- name: X-linked dominant inheritance
  description: >-
    The marked female excess (approximately 3:1) prompted the long-standing
    hypothesis that histiocytoid cardiomyopathy is an X-linked dominant
    disorder with prenatal lethality in hemizygous males, originally mapped to
    Xp22. The subsequent identification of de novo truncating variants in the
    X-linked nuclear gene NDUFB11 (Xp11.23) in affected girls is consistent
    with this model, although the mechanistically related NDUFB11 hypertrophic
    cardiomyopathy reports include surviving hemizygous males, so strict male
    lethality is not universal.
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  evidence:
  - reference: PMID:10463272
    reference_title: "Histiocytoid cardiomyopathy: three new cases and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was recently proposed that this disorder is X-linked dominant with the associated gene located in the region of Xp22."
    explanation: States the X-linked dominant hypothesis for histiocytoid cardiomyopathy.
  - reference: PMID:21585276
    reference_title: "Identification of candidate genes for histiocytoid cardiomyopathy (HC) using whole genome expression analysis: analyzing material from the HC registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of the female predominance, it was suggested that HC is an X-linked genetic disorder with prenatal lethality in males."
    explanation: >-
      Links the observed female predominance to the X-linked, male-prenatal-lethal
      model.
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Two probands had de novo non-sense mutations in the second exon of the X-linked nuclear gene NDUFB11."
    explanation: >-
      De novo truncating variants in an X-linked nuclear gene in affected
      probands are consistent with, but do not by themselves prove, X-linked
      dominant inheritance with male lethality.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence or incidence estimate exists. The published
    literature amounts to roughly 100 reported cases plus the material in the
    Emory histiocytoid cardiomyopathy registry. The true occurrence is probably
    higher than the publication count because an unknown fraction of cases is
    certified as sudden infant death syndrome when the heart is not
    adequately sampled at autopsy.
  evidence:
  - reference: PMID:21585276
    reference_title: "Identification of candidate genes for histiocytoid cardiomyopathy (HC) using whole genome expression analysis: analyzing material from the HC registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although approximately 100 HC cases have been reported in the literature, the prevalence of this disease may be higher than the reported cases would suggest, as some cases are mistaken for Sudden Infant Death Syndrome (SIDS)"
    explanation: >-
      Gives the literature case count and states the SIDS-misclassification
      reason why it understates true occurrence.
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 100 Histiocytoid CM cases have been reported in the literature"
    explanation: Independent statement of the same literature case count.
epidemiology:
- name: Female predominance
  description: >-
    Histiocytoid cardiomyopathy affects girls roughly three times as often as
    boys, and this sex skew is the principal observation behind the X-linked
    male-prenatal-lethality hypothesis. The predominance is reproduced in an
    independent contemporary forensic autopsy series.
  evidence:
  - reference: PMID:21585276
    reference_title: "Identification of candidate genes for histiocytoid cardiomyopathy (HC) using whole genome expression analysis: analyzing material from the HC registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It primarily occurs in the first two years of life and has a female to male ratio of 3:1."
    explanation: Quantifies the female-to-male ratio and the age window.
  - reference: PMID:39225698
    reference_title: "Conduction System Hamartoma: Autopsy Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The female-to-male ratio was 3/1."
    explanation: >-
      A small independent 2012-2022 forensic autopsy series (n = 4; three girls,
      one boy) shows the same direction of sex skew. With four cases this is
      directionally consistent rather than statistical replication of the
      registry ratio.
- name: Ancestry distribution
  description: >-
    Reported cases from the histiocytoid cardiomyopathy registry are
    predominantly of European ancestry. This distribution reflects the
    ascertainment of a registry assembled largely from North American autopsy
    referrals and should not be read as a validated population risk estimate.
  evidence:
  - reference: PMID:21585276
    reference_title: "Identification of candidate genes for histiocytoid cardiomyopathy (HC) using whole genome expression analysis: analyzing material from the HC registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It predominantly affects Caucasians (80%) followed by African-American (15%) and Latin-American infants (3%); it is rare in Oriental infants"
    explanation: >-
      Source statement of the reported ancestry distribution in the registry
      material.
- name: Sibling recurrence
  description: >-
    The histiocytoid cardiomyopathy registry investigators estimate a sibling
    recurrence risk of about 5%, which they note is probably an underestimate
    because of recurrent miscarriage in some families - itself consistent with
    prenatal lethality of the more severe genotypes.
  evidence:
  - reference: PMID:25921236
    reference_title: "Exome sequencing of patients with histiocytoid cardiomyopathy reveals a de novo NDUFB11 mutation that plays a role in the pathogenesis of histiocytoid cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We estimate the sibling recurrence rate to be approximately 5%, but note that this is likely to be downward biased due to the incidence of recurrent miscarriages in some families."
    explanation: Direct statement of the registry sibling recurrence estimate and its bias.
pathophysiology:
- name: Mitochondrial Respiratory Chain Subunit Defect
  description: >-
    The proximal lesion is a defect in a structural subunit of the
    mitochondrial respiratory chain. Two arms are established. In the
    mitochondrial-DNA arm a heteroplasmic MT-CYB missense variant
    (m.15498G>A, p.Gly251Asp) impairs ubiquinol-cytochrome c oxidoreductase
    (complex III). In the nuclear X-linked arm, de novo truncating variants in
    NDUFB11, an accessory subunit of complex I, abolish or reduce NDUFB11
    protein and impair complex I assembly and activity. A minority of probands
    carry rare variants in other complex I components (NDUFAF2, NDUFB9), so
    the disease is genetically heterogeneous and remains unsolved in many
    historical cases.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  protein_complexes:
  - preferred_term: mitochondrial respiratory chain complex I
    term:
      id: GO:0045271
      label: respiratory chain complex I
    modifier: DECREASED
  - preferred_term: mitochondrial respiratory chain complex III
    term:
      id: GO:0045275
      label: respiratory chain complex III
    modifier: DECREASED

      id: GO:0032420
      label: stereocilium
  locations:
  - preferred_term: spiral organ of Corti
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  downstream:
  - target: Disorganized Stereociliary Actin Cytoskeleton
    causal_link_type: DIRECT
    description: >-
      The node is a localisation rather than a lesion; the edge says the stereocilium is
      where the missing activity is missing from.
    evidence:
    - reference: PMID:24039609
      reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "We found that in rodents, within the sensory epithelia of the inner ear, ELMOD3 appears most pronounced in the stereocilia of cochlear hair cells."
      explanation: >-
        The subcellular compartment in which the lesion is expected to act. INDIRECT because
        the localisation is rat and mouse and no human cochlear tissue has been examined.
  evidence:
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In rat cochlea, ELMOD3 immunoreactivity was observed in the stereocilia, kinocilia and cuticular plate of developing hair cells"
    explanation: The three compartments the protein occupies in cochlear hair cells.
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast to the cochlear hair cells, ELMOD3 antibody labeling was observed within the hair cell bodies in the vestibular end organs of both rat and mouse inner ear, but no prominent immunoreactivity was observed in the hair bundles"
    explanation: >-
      The cochlear/vestibular asymmetry in bundle localisation, which is the structural
      counterpart of the normal balance function in the affected family.
- name: Disorganized Stereociliary Actin Cytoskeleton
  biological_scale: CELLULAR
  role: mediator
  mechanism_confidence: PROVISIONAL
  description: >-
    Hair bundle actin is not properly organised when ELMOD3 activity is absent. In the
    knockout mouse, phalloidin signal is markedly weaker across the cochlea and especially in
    hair cells, and stereocilia formation and maturation are already delayed at postnatal day
    1. This is the node at which the molecular defect becomes a bundle defect.
  biological_processes:
  - preferred_term: auditory receptor cell stereocilium organization
    modifier: DECREASED
    term:
      id: GO:0060088
      label: auditory receptor cell stereocilium organization
  cell_types:
  - preferred_term: sensory hair cell
    term:
      id: CL:0000855
      label: sensory hair cell
  downstream:
  - target: Inner Hair Cell Stereocilia Shortening and Fusion
    causal_link_type: DIRECT
    description: The inner hair cell arm of the bundle phenotype.
    evidence:
    - reference: PMID:31628468
      reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "The deafness associated with the mutation may be caused by cochlear hair cells dysfunction, which manifests with shortening and fusion of inner hair cells stereocilia and progressive degeneration of outer hair cells stereocilia."
      explanation: >-
        Both bundle phenotypes in one sentence. INDIRECT because it is a mouse and because
        the authors state the causal link as a possibility.
  - target: Outer Hair Cell Stereocilia Degeneration and Loss of Cochlear Amplification
    causal_link_type: DIRECT
    description: The outer hair cell arm of the bundle phenotype.
    evidence:
    - reference: PMID:31628468
      reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "stereocilia of OHCs were missing in both Elmod3−/− and WT mice with an increased frequency of losses in Elmod3−/− mice compared with WT mice"
      explanation: >-
        The outer hair cell bundle loss, measured against wild-type littermates of the same
        age so that ordinary age-related loss is controlled for. INDIRECT because it is a
        mouse.
  evidence:
  - reference: PMID:31628468
    reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results indicated a reduction of F-actin cytoskeleton formation in Elmod3 KO mice and therefore suggested that Elmod3 is required for the proper organization of F-actin networks."
    explanation: >-
      The direct measurement behind this node: less F-actin in the knockout cochlea, and the
      authors' conclusion from it.
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "We therefore speculate that ELMOD3 functions as a GAP for Arl2 and perhaps other GTPases that participate in actin organization, polymerization or depolymerization in the cochlear hair bundles"
    explanation: >-
      The proposed route from GAP activity to bundle actin. Quoted with its hedge intact and
      graded INDIRECT because it is explicitly the authors' speculation, not a result.
- name: Inner Hair Cell Stereocilia Shortening and Fusion
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    In the knockout mouse, inner hair cell stereocilia are significantly shortened by two
    months - the age at which thresholds first shift - and by five months every inner hair
    cell shows bundle degeneration, some with no bundle at all. Hair cell bodies themselves
    are largely preserved, so this is a bundle lesion rather than hair cell death.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  downstream:
  - target: Cochlear Sensory Transduction Failure
    causal_link_type: DIRECT
    description: >-
      A shortened or fused inner hair cell bundle cannot transduce deflection into
      receptor potential normally, which is the step from structure to hearing.
    evidence:
    - reference: PMID:31628468
      reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Shortened stereocilia in IHCs of Elmod3−/− mice were discovered at the age of 2 months and found to worsen in the later life of Elmod3−/− mice, which is consistent with the timing of the increased hearing threshold onset"
      explanation: >-
        The bundle lesion and the threshold shift arrive together, which is the observation
        linking this node to hearing. INDIRECT: it is a mouse, and the link is a temporal
        coincidence rather than an intervention.
  evidence:
  - reference: PMID:31628468
    reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Abnormality of these actin-based cytoskeleton structures in the hair cells, particularly those of stereocilia, is often the root cause of HL"
    explanation: >-
      The general principle the authors invoke for why a bundle actin defect produces hearing
      loss, quoted here as the framing for this node rather than as a result.
- name: Outer Hair Cell Stereocilia Degeneration and Loss of Cochlear Amplification
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Outer hair cell stereocilia are lost progressively in the knockout mouse, and the bundles
    that remain lose their tight inter-stereocilia connections. The functional read-out is a
    rise in distortion-product otoacoustic emission thresholds, which the authors read as a
    loss of the force the outer hair cells couple into the cochlear amplifier.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  downstream:
  - target: Cochlear Sensory Transduction Failure
    causal_link_type: DIRECT
    description: >-
      Loss of the cochlear amplifier raises thresholds independently of the inner hair cell
      bundle lesion.
    evidence:
    - reference: PMID:31628468
      reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "the shifting of DPOAE thresholds indicated the reduction of the force coupled into the cochlear amplifier by OHCs motility"
      explanation: >-
        The functional measurement that ties the outer hair cell bundle lesion to threshold
        elevation. INDIRECT: mouse, and an inference the authors draw from the emission data.
  evidence:
  - reference: PMID:31628468
    reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the shifting of DPOAE thresholds indicated the reduction of the force coupled into the cochlear amplifier by OHCs motility"
    explanation: The state of this node, measured by distortion-product otoacoustic emissions.
- name: Cochlear Sensory Transduction Failure
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: PROVISIONAL
  conforms_to: "sensorineural_hair_cell_loss#Cochlear Amplification Loss and Spiral Ganglion Neuron Degeneration"
  description: >-
    The cochlea can no longer turn sound into a neural signal at normal levels. In the mouse
